version: '3.7'

services:
  redis:
    image: redis:5.0.5-alpine
    container_name: redis-queue
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - airflow_network

  postgres:
    image: postgres:alpine
    container_name: postgres-backend
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - /tmp/PostgreSQL/airflow:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - airflow_network

  airflow:
    image: bietlejuice-airflow-local
    container_name: airflow-webserver
    build:
      context: ../..
      dockerfile: local/docker/airflow-environment.Dockerfile
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN}
    environment:
      - ENVIRONMENT=forno
    ports:
      - "8080:8080"
    volumes:
      - ../../bietlejuice:/bi-etl-ejuice/local/bietlejuice
      - ../../dags:/bi-etl-ejuice/local/bietlejuice/dags/dags
    entrypoint: ./entrypoint.sh ${DATABRICKS_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - airflow_network

  worker_1:
    image: bietlejuice-airflow-local
    container_name: airflow-worker-1
    build:
      context: ../..
      dockerfile: local/docker/airflow-environment.Dockerfile
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN}
    restart: always
    environment:
      - C_FORCE_ROOT=true
      - ENVIRONMENT=forno
    depends_on:
      - airflow
    volumes:
      - ../../bietlejuice:/bi-etl-ejuice/local/bietlejuice
      - ../../dags:/bi-etl-ejuice/local/bietlejuice/dags/dags
    entrypoint: airflow worker -cn worker_1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "[ -f /bi-etl-ejuice/airflow/airflow-worker.pid ]"
        ]
      interval: 30s
      timeout: 30s
      retries: 3
    networks:
      - airflow_network

  worker_2:
    image: bietlejuice-airflow-local
    container_name: airflow-worker-2
    build:
      context: ../..
      dockerfile: local/docker/airflow-environment.Dockerfile
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN}
    restart: always
    environment:
      - C_FORCE_ROOT=true
      - ENVIRONMENT=forno
    depends_on:
      - airflow
    volumes:
      - ../../bietlejuice:/bi-etl-ejuice/local/bietlejuice
      - ../../dags:/bi-etl-ejuice/local/bietlejuice/dags/dags
    entrypoint: airflow worker -cn worker_2
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "[ -f /bi-etl-ejuice/airflow/airflow-worker.pid ]"
        ]
      interval: 30s
      timeout: 30s
      retries: 3
    networks:
      - airflow_network

networks:
  airflow_network:
    driver: bridge
