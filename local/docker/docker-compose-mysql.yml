version: '3.7'

services:
  redis:
    image: redis:5.0.5-alpine
    container_name: redis-queue
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - airflow_network

  mysql:
    image: mysql:8.4
    container_name: mysql-backend
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=airflow
      - MYSQL_USER=airflow
      - MYSQL_PASSWORD=airflow
    command: mysqld --character-set-server=utf8 --collation-server=utf8_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - airflow_network

  airflow:
    image: bietlejuice-airflow-local
    container_name: airflow-webserver
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: local/docker/airflow-environment-mysql.Dockerfile
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN}
    environment:
      - ENVIRONMENT=forno
    ports:
      - "8080:8080"
    entrypoint: ./entrypoint.sh ${DATABRICKS_TOKEN}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - airflow_network

  worker_1:
    image: bietlejuice-airflow-local
    container_name: airflow-worker-1
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: local/docker/airflow-environment-mysql.Dockerfile
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN}
    restart: always
    environment:
      - C_FORCE_ROOT=true
      - ENVIRONMENT=forno
    depends_on:
      - airflow
    entrypoint: airflow worker -cn worker_1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "[ -f /bi-etl-ejuice/airflow/airflow-worker.pid ]"
        ]
      interval: 30s
      timeout: 30s
      retries: 3
    networks:
      - airflow_network

  worker_2:
    image: bietlejuice-airflow-local
    container_name: airflow-worker-2
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: local/docker/airflow-environment-mysql.Dockerfile
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN}
    restart: always
    environment:
      - C_FORCE_ROOT=true
      - ENVIRONMENT=forno
    depends_on:
      - airflow
    entrypoint: airflow worker -cn worker_2
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "[ -f /bi-etl-ejuice/airflow/airflow-worker.pid ]"
        ]
      interval: 30s
      timeout: 30s
      retries: 3
    networks:
      - airflow_network

networks:
  airflow_network:
    driver: bridge
volumes:
  mysql-data: