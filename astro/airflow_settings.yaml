# Local development only — pools, connections, and variables for Astro CLI.
# Pools are sourced from local_pools.json via import_local_pools.sh (make import-local-pools).
# See: https://www.astronomer.io/docs/astro/cli/develop-project

airflow:
  connections:
    - conn_id:
      conn_type:
      conn_host:
      conn_schema:
      conn_login:
      conn_password:
      conn_port:
      conn_extra:
        example_extra_field: example-value
  pools:
    - pool_name: emr_api
      pool_slot: 128
      pool_description: Rate-limits concurrent EMR control-plane API calls. Default pool for emr_plugin operators.
    - pool_name: gsheets_pool
      pool_slot: 32
      pool_description: Limits concurrent Google Sheets ingestion tasks from raw_gsheets_workflow.
    - pool_name: gsheets_several_daily_runs_pool
      pool_slot: 16
      pool_description: Limits concurrent gsheets_several_daily_runs DAG tasks.
  variables:
    - variable_name: DOC_MD_BASE_URL
      variable_value: DOC_MD_BASE_URL
