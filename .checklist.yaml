apiVersion: quintoandar.com.br/checklist/v2
kind: ServiceChecklist
metadata:
  name: bi-etl-ejuice
spec:
  description: |
    Gathers two main development subjects: analytical data pipelines developed
    as Airflow DAGs and destined to be orchestrated inside Google Cloud Composer;
    and data transformations and extractions, developed as Python Spark job files
    and/or SQL queries, triggered by the DAGs and destined to be executed inside
    Databricks clusters.

  costCenter: C092
  department: data
  lifecycle: production
