version: '3.7'

services:
  postgres_airflow:
    image: postgres:alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - /home/PostgreSQL:/var/lib/postgresql/data
    network_mode: host

  airflow_python2:
    build:
      context: ..
      dockerfile: docker/airflow-py2.Dockerfile
      args:
         GITHUB_TOKEN: ${GITHUB_TOKEN}
    ports:
      - "8080:8080"
    volumes:
      - /home/${USERNAME}/.aws:/root/.aws
      - ${PROJECT_PATH}/bietlejuice:/bi-etl-ejuice/bietlejuice
    depends_on:
      - postgres_airflow
    network_mode: host
