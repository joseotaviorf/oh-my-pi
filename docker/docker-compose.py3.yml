version: '3.7'

services:
  redis:
    image: redis:5.0.5-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - airflow_postgres_py3

  postgres_airflow_py3:
    image: postgres:alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - /tmp/PostgreSQL/airflow_py3:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - airflow_postgres_py3

  airflow_python3:
    image: base
    build:
      context: ..
      dockerfile: docker/airflow-py3.Dockerfile
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN}
    environment:
      - ENVIRONMENT=forno
    ports:
      - "8080:8080"
    volumes:
      - ${PROJECT_PATH}/bietlejuice:/bi-etl-ejuice/bietlejuice
    depends_on:
      postgres_airflow_py3:
        condition: service_healthy
    networks:
      - airflow_postgres_py3

  worker_1:
    image: base
    restart: always
    environment:
      - C_FORCE_ROOT=true
      - ENVIRONMENT=forno
    depends_on:
      - airflow_python3
    volumes:
      - ${PROJECT_PATH}/bietlejuice/jobs/composer/dags:/bi-etl-ejuice/bietlejuice/jobs/composer/dags
    entrypoint: airflow worker -cn worker_1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "[ -f /bi-etl-ejuice/airflow_python3/airflow-worker.pid ]"
        ]
      interval: 30s
      timeout: 30s
      retries: 3
    networks:
      - airflow_postgres_py3

  worker_2:
    image: base
    restart: always
    environment:
      - C_FORCE_ROOT=true
      - ENVIRONMENT=forno
    depends_on:
      - airflow_python3
    volumes:
      - ${PROJECT_PATH}/bietlejuice/jobs/composer/dags:/bi-etl-ejuice/bietlejuice/jobs/composer/dags
    entrypoint: airflow worker -cn worker_2
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "[ -f /bi-etl-ejuice/airflow_python3/airflow-worker.pid ]"
        ]
      interval: 30s
      timeout: 30s
      retries: 3
    networks:
      - airflow_postgres_py3

networks:
  airflow_postgres_py3:
    driver: bridge
