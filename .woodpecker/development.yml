# Hybrid Dev Astro deployment — production-shadow S3, Dev Astro target.
#
# File: .woodpecker/development.yml
# Git branch: development. Deploys only on merge (push) or manual.
# Astro target: Dev Astronomer deployment (Vault apps/dev/...).
#
# Hybrid shape (parity with planned forno/prod):
#   create-s3-dag-files (INCLUDE_VALIDATION=1 temporarily — prod-parity smoke) →
#   S3 mirror of dags/ under astronomer/dags-dev/ → clear astronomer/dags-dev/bietlejuice/
#   → assemble bag + astro deploy --dags → image from this repo (astro deploy --image)
# Drop INCLUDE_VALIDATION=1 from Dev once prod hybrid is validated.
#
# Production shadow: same artifacts bucket as prod
# (artifacts.s3.data.quintoandar.com.br) and beethoven-s3-sync:prod-latest,
# but isolated prefix astronomer/dags-dev/ (never live astronomer/dags/).
# There is no beethoven-deploy-dags:dev image; deploy is a Vault + aws s3 sync
# + astro CLI step that mirrors that image's behaviour for the isolated prefix.
#
# POSIX /bin/sh on ci-astro: use set -eu and `. file` (not source / pipefail).

when:
  - event: push
    branch: [development]
  - event: manual
    branch: [development]

steps:
  setup:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice:prod-ci-astro-latest
    pull: true
    commands:
      - uv sync
    when:
      event: [push, manual]
      branch: [development]
      path: &dag_bundle_sync_path
        include:
          - ".woodpecker/development.yml"
          - "dags/**"
          - "packages/bietlejuice-compiler/src/**"
          - "packages/bietlejuice-compiler/scripts/ci_cd/airflow_dag_builder/**/*.py"
          - "Makefile"
          - "astro/.airflowignore"
          - "dags/.airflowignore"
        on_empty: false

  # Domain bundles only (no migration bundles — same as forno/prod hybrid).
  # INCLUDE_VALIDATION=1 temporarily mirrors prod so Dev exercises _validation_bundle_*.py;
  # remove after Dev/prod hybrid is proven.
  create-dag-files:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice:prod-ci-astro-latest
    pull: true
    commands:
      - make create-s3-dag-files INCLUDE_VALIDATION=1
      - |
        set -eu
        # Refuse declaration-generated stubs (would double-register with bundles).
        # Hand-written *_dag.py without a sibling *_declaration.yml must remain
        # (e.g. governance/sync_tars_entities). Platform migration_* DAG packages too.
        # Skip luigijr: create-s3 excludes it; keep parity with release.yml stub guard.
        leftovers=""
        for stub in $(find dags \( -name '*_dag.py' -o -name '*_validation_dag.py' \) \
          ! -path '*/platform/migration_twin_*/*' \
          ! -path '*/platform/migration_emr_*/*' \
          ! -path '*/platform/migration_compare_*/*' \
          ! -path '*/luigijr/*' \
          -print || true); do
          dir=$(dirname "$stub")
          if ls "$dir"/*_declaration.yml >/dev/null 2>&1; then
            leftovers="${leftovers}$(printf '%s\n' "$stub")"
          fi
        done
        if [ -n "$leftovers" ]; then
          echo "Unexpected declaration stubs present — refusing S3 upload:" >&2
          printf '%s' "$leftovers" >&2
          exit 1
        fi
        [ -n "$(find dags/_astro_bundles -name '_bundle_*.py' -print -quit 2>/dev/null)" ] \
          || { echo "No domain bundles under dags/_astro_bundles — refusing upload" >&2; exit 1; }
        [ -n "$(find dags/_astro_bundles -name '_validation_bundle_*.py' -print -quit 2>/dev/null)" ] \
          || { echo "No validation bundles under dags/_astro_bundles — refusing upload" >&2; exit 1; }
    when:
      event: [push, manual]
      branch: [development]
      path: *dag_bundle_sync_path
    depends_on: [setup]

  get-astro-credentials:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/plugins/vault
    pull: true
    settings:
      vault_secrets:
        - ASTRO_API_TOKEN=kv:apps/dev/astronomer/creds/cicd_token#ASTRO_API_TOKEN
        - ASTRO_DEPLOYMENT_ID=kv:apps/dev/astronomer/creds/cicd_token#ASTRO_DEPLOYMENT_ID
        - ASTRO_WORKSPACE_ID=kv:apps/dev/astronomer/creds/cicd_token#ASTRO_WORKSPACE_ID
        - DAGS_BUCKET=kv:apps/dev/astronomer/creds/cicd_token#DAGS_BUCKET
      output_file: ./astro-secrets
      vault_env: prod
    when:
      - event: [push, manual]
        branch: [development]
        path: *dag_bundle_sync_path
      - event: [push, manual]
        branch: [development]
        path: &astro_image_paths
          include:
            - ".woodpecker/development.yml"
            - "astro/Dockerfile"
            - "astro/packages.txt"
            - "astro/requirements.txt"
            - "astro/runtime-constraints.txt"
            - "astro/parse-alias-batching.patch"
            - "astro/config/**"
            - "packages/bietlejuice-core/src/**"
            - "packages/bietlejuice-airflow/src/**"
            - "packages/bietlejuice-airflow-operators/src/**"
            - "packages/bietlejuice-airflow-plugins/src/**"
            - "packages/bietlejuice-core/pyproject.toml"
            - "packages/bietlejuice-airflow/pyproject.toml"
            - "packages/bietlejuice-airflow-operators/pyproject.toml"
            - "packages/bietlejuice-airflow-plugins/pyproject.toml"
            - "pyproject.toml"
            - "uv.lock"
          on_empty: false

  # Exact mirror of workspace dags/ → s3://{prod-artifacts}/astronomer/dags-dev/dags/
  # (production-shadow bucket; live prod prefix remains astronomer/dags/).
  upload-dag-packages-dags-s3-dev:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/beethoven-s3-sync:prod-latest
    pull: true
    environment:
      BUCKET: artifacts.s3.data.quintoandar.com.br
      S3_PREFIX: astronomer/dags-dev
      SOURCE: dags
    when:
      event: [push, manual]
      branch: [development]
      path: *dag_bundle_sync_path
    depends_on: [create-dag-files]

  # Prepare empty tree for the clear step (beethoven-s3-sync entrypoint must run
  # without `commands:`, which would replace it).
  prepare-clear-bietlejuice-s3-dev:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice:prod-ci-astro-latest
    pull: true
    commands:
      - rm -rf staging/bietlejuice && mkdir -p staging/bietlejuice
    when:
      event: [push, manual]
      branch: [development]
      path: *dag_bundle_sync_path
    depends_on: [create-dag-files]

  # Empty-mirror clears every object under astronomer/dags-dev/bietlejuice/.
  clear-bietlejuice-s3-dev:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/beethoven-s3-sync:prod-latest
    pull: true
    environment:
      BUCKET: artifacts.s3.data.quintoandar.com.br
      S3_PREFIX: astronomer/dags-dev
      SOURCE: staging/bietlejuice
    when:
      event: [push, manual]
      branch: [development]
      path: *dag_bundle_sync_path
    depends_on: [prepare-clear-bietlejuice-s3-dev]

  # Assemble bag from the isolated S3 prefix and deploy to Dev Astro (same outcome
  # as beethoven-deploy-dags, but prefix-configurable and using Dev Vault secrets).
  # Woodpecker pre-substitutes ${braced} env refs — hardcode the Dev shadow URI.
  # prod-ci-astro-latest has astro but not aws; install AWS CLI v2 for this step only
  # (follow-up: bake aws into ci-astro and/or move this step fully onto DinD).
  deploy-dags-from-s3-dev:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice:prod-ci-astro-latest
    pull: true
    depends_on: [upload-dag-packages-dags-s3-dev, clear-bietlejuice-s3-dev, get-astro-credentials]
    commands:
      - |
        set -eu
        set -a
        # shellcheck disable=SC1091
        . ./astro-secrets
        set +a
        [ -n "$ASTRO_API_TOKEN" ] || { echo "ASTRO_API_TOKEN missing from Vault (apps/dev/astronomer/creds/cicd_token)" >&2; exit 1; }
        [ -n "$ASTRO_DEPLOYMENT_ID" ] || { echo "ASTRO_DEPLOYMENT_ID missing from Vault (apps/dev/astronomer/creds/cicd_token)" >&2; exit 1; }
        [ -n "$ASTRO_WORKSPACE_ID" ] || { echo "ASTRO_WORKSPACE_ID missing from Vault (apps/dev/astronomer/creds/cicd_token)" >&2; exit 1; }
        # Literal URI — do not use ${DAGS_BUCKET}/${S3_PREFIX} (Woodpecker empties braced forms).
        S3_URI="s3://artifacts.s3.data.quintoandar.com.br/astronomer/dags-dev/"
        apt-get update -qq
        apt-get install -y --no-install-recommends curl unzip ca-certificates >/dev/null
        curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
        unzip -q /tmp/awscliv2.zip -d /tmp
        /tmp/aws/install --bin-dir /usr/local/bin --install-dir /usr/local/aws-cli >/dev/null
        rm -rf /tmp/awscliv2.zip /tmp/aws
        command -v aws >/dev/null || { echo "aws CLI missing after install" >&2; exit 1; }
        rm -rf /tmp/astro-bag
        mkdir -p /tmp/astro-bag
        aws s3 sync "$S3_URI" /tmp/astro-bag/ --delete
        # Refuse a bag that still carries a package tree (must come from the image).
        if [ -d /tmp/astro-bag/bietlejuice ]; then
          echo "Refuse deploy: bag still contains bietlejuice/ (S3 clear failed)" >&2
          find /tmp/astro-bag/bietlejuice | head -20 >&2
          exit 1
        fi
        [ -n "$(find /tmp/astro-bag/dags/_astro_bundles -name '_bundle_*.py' -print -quit 2>/dev/null)" ] \
          || { echo "Refuse deploy: no domain bundles in S3 bag" >&2; exit 1; }
        [ -n "$(find /tmp/astro-bag/dags/_astro_bundles -name '_validation_bundle_*.py' -print -quit 2>/dev/null)" ] \
          || { echo "Refuse deploy: no validation bundles in S3 bag" >&2; exit 1; }
        # Historical Beethoven layout: package dirs are siblings under the Astro dags folder.
        rm -rf astro/dags
        mkdir -p astro/dags
        cp -a /tmp/astro-bag/. astro/dags/
        [ -n "$(find astro/dags -name '*.py' -print -quit)" ] || { echo "DAG bundle is empty — refusing to deploy" >&2; exit 1; }
        cd astro
        astro version
        astro deploy "$ASTRO_DEPLOYMENT_ID" --workspace-id "$ASTRO_WORKSPACE_ID" --dags -f
    when:
      event: [push, manual]
      branch: [development]
      path: *dag_bundle_sync_path

  deploy-astro-image:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice:prod-ci-astro-dind-latest
    pull: true
    privileged: true
    depends_on: [get-astro-credentials]
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - |
        set -eu
        set -a
        # shellcheck disable=SC1091
        . ./astro-secrets
        set +a
        [ -n "$ASTRO_API_TOKEN" ] || { echo "ASTRO_API_TOKEN missing from Vault (apps/dev/astronomer/creds/cicd_token)" >&2; exit 1; }
        [ -n "$ASTRO_DEPLOYMENT_ID" ] || { echo "ASTRO_DEPLOYMENT_ID missing from Vault (apps/dev/astronomer/creds/cicd_token)" >&2; exit 1; }
        [ -n "$ASTRO_WORKSPACE_ID" ] || { echo "ASTRO_WORKSPACE_ID missing from Vault (apps/dev/astronomer/creds/cicd_token)" >&2; exit 1; }
        [ -n "$GITHUB_TOKEN" ] || { echo "GITHUB_TOKEN secret missing" >&2; exit 1; }
        sh -c 'dockerd-entrypoint.sh --registry-mirror=http://docker-registry.shared.quintoandar.com.br:5000 1>/dev/null 2>/dev/null' &
        while ! docker stats --no-stream >/dev/null 2>&1; do
          echo "Waiting Docker daemon to start..."
          sleep 1
        done
        printf '%s' "$GITHUB_TOKEN" > /tmp/github_token
        DOCKER_BUILDKIT=1 docker build \
          --target production \
          --file astro/Dockerfile \
          --secret id=GITHUB_TOKEN,src=/tmp/github_token \
          --build-arg UV_VERSION=0.11.7 \
          -t bietlejuice-airflow:deploy \
          .
        rm -f /tmp/github_token
        cd astro
        # IMAGEONLY bag finalize risk accepted for now (no trailing --dags).
        astro deploy "$ASTRO_DEPLOYMENT_ID" \
          --workspace-id "$ASTRO_WORKSPACE_ID" \
          --image-name bietlejuice-airflow:deploy \
          --image \
          -f
    when:
      event: [push, manual]
      branch: [development]
      path: *astro_image_paths
