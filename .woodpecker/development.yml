# Temporary Astro "dev" deployment pipeline — isolated from forno/prod.
#
# File: .woodpecker/development.yml
# Git branch: development (integration). Deploys only on merge (push) or manual.
# Astro target: the isolated "dev" Astronomer deployment (Vault under apps/dev/...).
#
# Does NOT touch .woodpecker/release.yml or forno/prod Astronomer paths.
#
# POSIX /bin/sh on ci-astro: use set -eu and `. file` (not source / pipefail).
#
# Triggers (intentionally NOT stack/astro-dev-* push — Graphite stack sync
# force-pushes every layer and would fan out N Woodpecker jobs):
#   - push/manual on development only (no PR / stack-branch pre-merge deploy)

when:
  - event: push
    branch: [development]
  - event: manual
    branch: [development]

steps:
  # Path anchors: dag_bundle_sync_path + astro_image_paths defined on setup.
  # setup + create-dag-files OR both so image-only pushes still generate the
  # domain bag (deploy-astro-image ends with --dags; cascade-safe on Woodpecker 3.9).
  setup:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice:prod-ci-astro-latest
    pull: true
    commands:
      - uv sync
    when:
      - event: [push, manual]
        branch: [development]
        path: &dag_bundle_sync_path
          include:
            - ".woodpecker/development.yml"
            - "dags/**"
            - "packages/bietlejuice-compiler/src/**"
            - "packages/bietlejuice-compiler/scripts/ci_cd/airflow_dag_builder/**/*.py"
            - "Makefile"
            - "astro/.airflowignore"
            - "dags/.airflowignore"
          on_empty: false
      - event: [push, manual]
        branch: [development]
        path: &astro_image_paths
          include:
            - ".woodpecker/development.yml"
            - "astro/Dockerfile"
            - "astro/packages.txt"
            - "astro/requirements.txt"
            - "astro/runtime-constraints.txt"
            - "astro/parse-alias-batching.patch"
            - "astro/config/**"
            - "packages/bietlejuice-core/src/**"
            - "packages/bietlejuice-airflow/src/**"
            - "packages/bietlejuice-airflow-operators/src/**"
            - "packages/bietlejuice-airflow-plugins/src/**"
            - "packages/bietlejuice-core/pyproject.toml"
            - "packages/bietlejuice-airflow/pyproject.toml"
            - "packages/bietlejuice-airflow-operators/pyproject.toml"
            - "packages/bietlejuice-airflow-plugins/pyproject.toml"
            - "pyproject.toml"
            - "uv.lock"
          on_empty: false

  # Manifests + domain bundles only. Per-DAG stubs are forno/prod
  # (`make create-dag-files`); luigijr uses `make create-luigijr-dag-files`.
  create-dag-files:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice:prod-ci-astro-latest
    pull: true
    commands:
      - make create-astro-dag-files
    when:
      - event: [push, manual]
        branch: [development]
        path: *dag_bundle_sync_path
      - event: [push, manual]
        branch: [development]
        path: *astro_image_paths
    depends_on: [setup]

  # Single Vault fetch shared by DAG and image deploys (same Astro "dev" credentials).
  # Runs when either DAG-bundle or image paths change (when-list = OR).
  get-astro-credentials:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/plugins/vault
    pull: true
    settings:
      vault_secrets:
        - ASTRO_API_TOKEN=kv:apps/dev/astronomer/creds/cicd_token#ASTRO_API_TOKEN
        - ASTRO_DEPLOYMENT_ID=kv:apps/dev/astronomer/creds/cicd_token#ASTRO_DEPLOYMENT_ID
        - ASTRO_WORKSPACE_ID=kv:apps/dev/astronomer/creds/cicd_token#ASTRO_WORKSPACE_ID
      output_file: ./astro-secrets
      vault_env: prod
    when:
      - event: [push, manual]
        branch: [development]
        path: *dag_bundle_sync_path
      - event: [push, manual]
        branch: [development]
        path: *astro_image_paths

  deploy-astro-dags:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice:prod-ci-astro-latest
    pull: true
    depends_on: [create-dag-files, get-astro-credentials]
    commands:
      - |
        # POSIX /bin/sh (dash on ci-astro): no pipefail, no source builtin.
        set -eu
        set -a
        # shellcheck disable=SC1091
        . ./astro-secrets
        set +a
        # Bare $VAR (no braces): Woodpecker only pre-substitutes braced forms; braces blank runtime secrets.
        [ -n "$ASTRO_API_TOKEN" ] || { echo "ASTRO_API_TOKEN missing from Vault (apps/dev/astronomer/creds/cicd_token)" >&2; exit 1; }
        [ -n "$ASTRO_DEPLOYMENT_ID" ] || { echo "ASTRO_DEPLOYMENT_ID missing from Vault (apps/dev/astronomer/creds/cicd_token)" >&2; exit 1; }
        [ -n "$ASTRO_WORKSPACE_ID" ] || { echo "ASTRO_WORKSPACE_ID missing from Vault (apps/dev/astronomer/creds/cicd_token)" >&2; exit 1; }
        astro version
        # Airflow bag: parse/import only. queries/ for table discovery at parse time;
        # SQL content + schemas/ + spark_jobs/*.py are S3 artifacts for Spark (Databricks/EMR).
        # Must be a real directory — astro CLI's tar (filepath.Walk) does not follow
        # symlinks, so `ln -s` here silently uploaded an empty DAG bundle.
        # Conf includes before spark_jobs exclude (rsync first-match); exclude spark_jobs
        # before *.py so job sources stay out while *_conf.yml under spark_jobs ships
        # (ConfigurationService searches {dag}/ and {dag}/spark_jobs/).
        rm -rf astro/dags
        mkdir -p astro/dags
        rsync -a --prune-empty-dirs \
          --exclude-from=astro/generated-dag-excludes.txt \
          --include='*/' \
          --include='*_conf.yml' \
          --include='*_declaration.yml' \
          --include='*_cluster.yml' \
          --include='.airflowignore' \
          --include='queries/***' \
          --include='data_quality/***' \
          --include='metadata/***' \
          --include='tables/***' \
          --include='dependencies.yaml' \
          --exclude='spark_jobs/***' \
          --include='*.py' \
          --exclude='*' \
          dags/ astro/dags/
        [ -n "$(find astro/dags -name '*.py' -print -quit)" ] || { echo "DAG bundle is empty — refusing to deploy" >&2; exit 1; }
        cd astro
        astro deploy "$ASTRO_DEPLOYMENT_ID" --workspace-id "$ASTRO_WORKSPACE_ID" --dags -f
    when:
      event: [push, manual]
      branch: [development]
      path: *dag_bundle_sync_path

  # Same shape as beethoven/.woodpecker/.02-deploy.yml (DinD + astro deploy --image).
  # Diff: build from monorepo root with BuildKit GITHUB_TOKEN (private git dep), then
  # hand the local image to `astro deploy --image-name` (Astro CLI pushes to Astronomer).
  # After --image, always --dags: IMAGEONLY finalize can mint a new empty DAG stamp
  # (forno 86540); last finalize must be a real domain-bag upload.
  deploy-astro-image:
    image: public.ecr.aws/docker/library/docker:24.0.9
    privileged: true
    depends_on: [create-dag-files, get-astro-credentials]
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - |
        # POSIX /bin/sh (dash on ci-astro): no pipefail, no source builtin.
        set -eu
        set -a
        # shellcheck disable=SC1091
        . ./astro-secrets
        set +a
        # Bare $VAR (no braces): Woodpecker only pre-substitutes braced forms; braces blank runtime secrets.
        [ -n "$ASTRO_API_TOKEN" ] || { echo "ASTRO_API_TOKEN missing from Vault (apps/dev/astronomer/creds/cicd_token)" >&2; exit 1; }
        [ -n "$ASTRO_DEPLOYMENT_ID" ] || { echo "ASTRO_DEPLOYMENT_ID missing from Vault (apps/dev/astronomer/creds/cicd_token)" >&2; exit 1; }
        [ -n "$ASTRO_WORKSPACE_ID" ] || { echo "ASTRO_WORKSPACE_ID missing from Vault (apps/dev/astronomer/creds/cicd_token)" >&2; exit 1; }
        [ -n "$GITHUB_TOKEN" ] || { echo "GITHUB_TOKEN secret missing" >&2; exit 1; }
        apk add --no-cache curl bash sudo
        # Same as beethoven/.woodpecker/.02-deploy.yml — unpinned install (v1.42.0 tag fails godownloader).
        curl -sSL https://install.astronomer.io | sudo bash -s
        sh -c 'dockerd-entrypoint.sh --registry-mirror=http://docker-registry.shared.quintoandar.com.br:5000 1>/dev/null 2>/dev/null' &
        while ! docker stats --no-stream >/dev/null 2>&1; do
          echo "Waiting Docker daemon to start..."
          sleep 1
        done
        printf '%s' "$GITHUB_TOKEN" > /tmp/github_token
        DOCKER_BUILDKIT=1 docker build \
          --target production \
          --file astro/Dockerfile \
          --secret id=GITHUB_TOKEN,src=/tmp/github_token \
          --build-arg UV_VERSION=0.11.7 \
          -t bietlejuice-airflow:deploy \
          .
        rm -f /tmp/github_token
        cd astro
        astro deploy "$ASTRO_DEPLOYMENT_ID" \
          --workspace-id "$ASTRO_WORKSPACE_ID" \
          --image-name bietlejuice-airflow:deploy \
          --image \
          -f
        # IMAGEONLY finalize sends DagTarballVersion="" when DAG deploys are enabled on the
        # deployment; Astronomer may mint a new DAG stamp and replace the live bag (forno
        # 86540: 20:27:44 replaced 20:12:22 with no DAG upload). Re-upload the domain bag
        # so the last finalize is a real --dags deploy.
        cd /woodpecker/src/github.com/quintoandar/bi-etl-ejuice
        # docker:24 image has no rsync by default
        apk add --no-cache rsync findutils
        rm -rf astro/dags
        mkdir -p astro/dags
        rsync -a --prune-empty-dirs \
          --exclude-from=astro/generated-dag-excludes.txt \
          --include='*/' \
          --include='*_conf.yml' \
          --include='*_declaration.yml' \
          --include='*_cluster.yml' \
          --include='.airflowignore' \
          --include='queries/***' \
          --include='data_quality/***' \
          --include='metadata/***' \
          --include='tables/***' \
          --include='dependencies.yaml' \
          --exclude='spark_jobs/***' \
          --include='*.py' \
          --exclude='*' \
          dags/ astro/dags/
        [ -n "$(find astro/dags -name '*.py' -print -quit)" ] || { echo "DAG bundle is empty — refusing to deploy after image" >&2; exit 1; }
        cd astro
        astro deploy "$ASTRO_DEPLOYMENT_ID" --workspace-id "$ASTRO_WORKSPACE_ID" --dags -f
    when:
      event: [push, manual]
      branch: [development]
      path: *astro_image_paths
