# Path filters: pull_request = full PR diff (origin/master...HEAD via CI_PIPELINE_EVENT);
# push = files in the pushed commit range (HEAD~1...HEAD on master/forno/hotfix).
# Workflows always trigger (release depends_on); skipped steps = success.
# setup runs only when at least one downstream step would run (union path).
when:
  - event: pull_request
  - event: push
    branch: [master, hotfix/*, forno]
  - event: tag
    branch: [master, hotfix/*]

clone:
  - name: clone
    image: woodpeckerci/plugin-git
    settings:
      partial: false # We need to clone the entire history to find the changed files

steps:
  setup:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice:prod-ci-base-latest
    pull: true
    commands:
      - uv sync
    when:
      - event: pull_request
        path: &validations_setup_paths
          include:
            - "dags/**"
            - "packages/**/src/**"
            - "packages/**/test/**"
            - "packages/**/scripts/**"
            - ".woodpecker/validations.yml"
            - "Makefile"
            - "docs/platform/cluster_validation_dags.md"
          on_empty: false
      - event: push
        branch: [master, hotfix/*, forno]
        path: *validations_setup_paths

  validate-dag-declaration-files:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice:prod-ci-base-latest
    pull: true
    commands:
      - make run-domain-validation MAKE_TARGET=validate-dag-declaration-files MAKE_EXTRA_ARGS="level=debug"
    when:
      - event: pull_request
        path: &dag_declaration_path
          include:
            - "dags/**/*.yml"
            - "packages/bietlejuice-airflow/src/bietlejuice/base/airflow/dag_builders/**/*.py"
            - "packages/bietlejuice-core/src/bietlejuice/base/airflow/dag_builders/**/*.py"
            - "packages/bietlejuice-compiler/scripts/ci_cd/airflow_dag_builder/**/*.py"
            - "packages/bietlejuice-compiler/scripts/ci_cd/run_validation_by_domain.py"
          on_empty: false
      - event: push
        branch: [master, hotfix/*, forno]
        path: *dag_declaration_path
    depends_on: [setup]

  # Regen / cluster YAML PRs: full extract --check + instance-family audit.
  validate-cluster-validation-files:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice:prod-ci-base-latest
    pull: true
    # Resolves consolidation presets from prod_conf.yml (same as validate-dags-dependencies-prod).
    environment:
      ENVIRONMENT: prod
    commands:
      - make validate-cluster-validation-files
    when:
      - event: pull_request
        path: &cluster_validation_files_path
          include:
            - "dags/**/*_cluster.yml"
            - "packages/bietlejuice-core/src/bietlejuice/config/prod_conf.yml"
          on_empty: false
      - event: push
        branch: [master, hotfix/*, forno]
        path: *cluster_validation_files_path
    depends_on: [setup]

  # Tooling-only PRs: unit tests for extract/mapping/audit/promote + audit (no full-tree extract --check).
  validate-cluster-validation-tooling:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice:prod-ci-base-latest
    pull: true
    environment:
      ENVIRONMENT: prod
    commands:
      - uv run --directory packages/bietlejuice-compiler pytest test/unit/ci_cd/airflow_dag_builder/test_extract_cluster_validation_files.py test/unit/ci_cd/airflow_dag_builder/test_cluster_validation_mapping.py test/unit/ci_cd/airflow_dag_builder/test_rightsizing_validation_config.py test/unit/validation/test_audit_cluster_instance_families.py test/unit/ci_cd/airflow_dag_builder/test_promote_cluster_validation_to_prod.py -q
      - make audit-cluster-instance-families
    when:
      - event: pull_request
        path: &cluster_validation_tooling_path
          include:
            - ".woodpecker/validations.yml"
            - "Makefile"
            - "docs/platform/cluster_validation_dags.md"
            - "packages/bietlejuice-compiler/scripts/ci_cd/airflow_dag_builder/cluster_validation_mapping.py"
            - "packages/bietlejuice-compiler/scripts/ci_cd/airflow_dag_builder/extract_cluster_validation_files.py"
            - "packages/bietlejuice-compiler/scripts/ci_cd/airflow_dag_builder/rightsizing_validation_config.py"
            - "packages/bietlejuice-compiler/scripts/validation/audit_cluster_instance_families.py"
            - "packages/bietlejuice-compiler/scripts/validation/promote_cluster_validation_to_prod.py"
            - "packages/bietlejuice-compiler/test/unit/ci_cd/airflow_dag_builder/test_cluster_validation_mapping.py"
            - "packages/bietlejuice-compiler/test/unit/ci_cd/airflow_dag_builder/test_extract_cluster_validation_files.py"
            - "packages/bietlejuice-compiler/test/unit/ci_cd/airflow_dag_builder/test_rightsizing_validation_config.py"
            - "packages/bietlejuice-compiler/test/unit/ci_cd/airflow_dag_builder/test_promote_cluster_validation_to_prod.py"
            - "packages/bietlejuice-compiler/test/unit/validation/test_audit_cluster_instance_families.py"
          on_empty: false
      - event: push
        branch: [master, hotfix/*, forno]
        path: *cluster_validation_tooling_path
    depends_on: [setup]

  validate-dags-up-to-standard:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice:prod-ci-base-latest
    pull: true
    commands:
      - make run-domain-validation MAKE_TARGET=validate-dags-up-to-standard
    when:
      - event: pull_request
        path: &dags_up_to_standard_path
          include:
            - "dags/**/*"
            - "packages/bietlejuice-compiler/scripts/dag_standard_validation/**"
            - "packages/bietlejuice-airflow/src/bietlejuice/base/airflow/dag_builders/**/*.py"
            - "packages/bietlejuice-core/src/bietlejuice/base/airflow/dag_builders/**/*.py"
            - "packages/bietlejuice-compiler/scripts/ci_cd/run_validation_by_domain.py"
          on_empty: false
      - event: push
        branch: [master, hotfix/*, forno]
        path: *dags_up_to_standard_path
    depends_on: [setup]


  # F2-01 table + F2-02 column substantive descriptions (validate_metadata_cli on clean+ diff)
  validate-fair-metadata:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice:prod-ci-base-latest
    pull: true
    commands:
      - make validate-fair-metadata
    when:
      event: [push, pull_request]
      branch:
        exclude: [forno, hotfix/*]
      path:
        include:
          - "dags/**/metadata/**/*.yml"
        on_empty: false
    depends_on: [setup]

  validate-metadata-files-content:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice:prod-ci-base-latest
    pull: true
    commands:
      - make run-domain-validation MAKE_TARGET=validate-metadata-files-content
    when:
      - event: pull_request
        branch:
          exclude: [forno, hotfix/*]
        path: &metadata_files_content_path
          include:
            - "dags/**/*.yml"
            - "packages/bietlejuice-compiler/scripts/governance_metadata_validation/**"
            - "packages/bietlejuice-compiler/scripts/ci_cd/run_validation_by_domain.py"
          on_empty: false
      - event: push
        branch: [master, forno]
        path: *metadata_files_content_path
    depends_on: [setup]

  validate-metadata-files-exist:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice:prod-ci-base-latest
    pull: true
    commands:
      - make run-domain-validation MAKE_TARGET=validate-metadata-files-exist
    when:
      - event: pull_request
        branch:
          exclude: [forno, hotfix/*]
        path: &metadata_files_exist_path
          include:
            - "dags/**/*.sql"
            - "packages/bietlejuice-compiler/scripts/governance_metadata_validation/**"
            - "packages/bietlejuice-compiler/scripts/ci_cd/run_validation_by_domain.py"
          on_empty: false
      - event: push
        branch: [master, forno]
        path: *metadata_files_exist_path
    depends_on: [setup]

  validate-pii-privacy:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice:prod-ci-base-latest
    pull: true
    commands:
      - make run-domain-validation MAKE_TARGET=validate-pii-privacy
    when:
      event: [push, pull_request]
      branch:
        exclude: [forno, hotfix/*]
      path:
        include:
          - "dags/**/*.yml"
          # Keep: a controls-only PR (rae.yml) must still run the RAE cross-check.
          - "governance/pii_anonymization_controls/**"
          # Keep: validator-only PRs must re-run the check (same as metadata-content / lineage).
          - "packages/bietlejuice-compiler/scripts/governance_metadata_validation/**"
          # NOTE: governance/pii_catalog/** is intentionally NOT a trigger — in
          # branch mode a catalog-only change validates no metadata. Re-add when
          # Phase 2 wires a full-scan to detect orphaned piiType slugs.
          - "packages/bietlejuice-compiler/scripts/ci_cd/run_validation_by_domain.py"
        on_empty: false
    depends_on: [setup]

  validate-lineage-consistency:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice:prod-ci-base-latest
    pull: true
    commands:
      - make run-domain-validation MAKE_TARGET=validate-lineage-consistency
    when:
      - event: pull_request
        branch:
          exclude: [forno, hotfix/*]
        path: &lineage_consistency_path
          include:
            - "dags/**/*.sql"
            - "dags/**/*.yml"
            - "packages/bietlejuice-compiler/scripts/governance_metadata_validation/**"
            - "packages/bietlejuice-compiler/scripts/ci_cd/run_validation_by_domain.py"
          on_empty: false
      - event: push
        branch: [master, forno]
        path: *lineage_consistency_path
    depends_on: [setup]

  validate-source-layer-policy:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice:prod-ci-base-latest
    pull: true
    commands:
      - make run-domain-validation MAKE_TARGET=validate-source-layer-policy
    when:
      - event: pull_request
        path: &source_layer_policy_path
          include:
            - "dags/**/*"
            - "packages/bietlejuice-compiler/scripts/ci_cd/source_layer_validation/**"
            - "packages/bietlejuice-compiler/scripts/ci_cd/run_validation_by_domain.py"
          on_empty: false
      - event: push
        branch: [master, hotfix/*, forno]
        path: *source_layer_policy_path
    depends_on: [setup]

  # validate-dags-dependencies is two steps because ConfigurationService reads
  # ENVIRONMENT: forno is push-only (no PRs); master/hotfix use prod on push/PR.
  # Commands and path filters are identical — anchors keep them in sync.

  validate-dags-dependencies-forno:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice:prod-ci-base-latest
    pull: true
    environment:
      ENVIRONMENT: forno
    commands: &validate_dags_dependencies_commands
      - make run-domain-validation MAKE_TARGET=validate-dags-dependencies
    when:
      event: push
      branch: [forno]
      path: &validate_dags_dependencies_paths
        include:
          - "dags/**/*"
          - "packages/bietlejuice-core/src/bietlejuice/base/dependencies/**/*.py"
          - "packages/bietlejuice-airflow/src/bietlejuice/base/airflow/**/*.py"
          - "packages/bietlejuice-core/src/bietlejuice/base/airflow/**/*.py"
          - "packages/bietlejuice-runtime/src/bietlejuice/base/db/**/*.py"
          - "packages/bietlejuice-compiler/scripts/ci_cd/validate_dags_dependencies.py"
          - "packages/bietlejuice-compiler/scripts/dependency_handling/**"
          - "packages/bietlejuice-compiler/scripts/ci_cd/run_validation_by_domain.py"
        on_empty: false
    depends_on: [setup]

  validate-dags-dependencies-prod:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice:prod-ci-base-latest
    pull: true
    environment:
      ENVIRONMENT: prod
    commands: *validate_dags_dependencies_commands
    when:
      - event: pull_request
        branch:
          exclude: [forno]
        path: *validate_dags_dependencies_paths
      - event: push
        branch: [master, hotfix/*]
        path: *validate_dags_dependencies_paths
    depends_on: [setup]

  validate-dependency-file-correctness:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice:prod-ci-base-latest
    pull: true
    commands:
      - make validate-dependency-file-correctness
    when:
      - event: pull_request
        path: &dependency_file_correctness_path
          include:
            - "dags/dependencies.yaml"
            - "dags/**/*"
            - "packages/bietlejuice-core/src/bietlejuice/base/dependencies/**/*.py"
            - "packages/bietlejuice-airflow/src/bietlejuice/base/airflow/**/*.py"
            - "packages/bietlejuice-core/src/bietlejuice/base/airflow/**/*.py"
            - "packages/bietlejuice-runtime/src/bietlejuice/base/db/**/*.py"
            - "packages/bietlejuice-compiler/scripts/ci_cd/validate_dags_dependencies.py"
            - "packages/bietlejuice-compiler/scripts/dependency_handling/**"
          on_empty: false
      - event: push
        branch: [master, hotfix/*, forno]
        path: *dependency_file_correctness_path
    depends_on: [setup]

  validate-core-model-schemas:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice:prod-ci-base-latest
    pull: true
    commands:
      - make validate-core-model-schemas
    when:
      - event: pull_request
        path: &core_model_schemas_path
          include:
            - "dags/core/**/*"
            - "packages/bietlejuice-compiler/scripts/ci_cd/validate_core_model_schemas.py"
          on_empty: false
      - event: push
        branch: [master, hotfix/*, forno]
        path: *core_model_schemas_path
    depends_on: [setup]

  validate-jiraops-routine-mute-list:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice:prod-ci-base-latest
    pull: true
    commands:
      - make validate-jiraops-routine-exceptions
      - make validate-jiraops-routine-mute-list
    when:
      event: [push, pull_request]
      path:
        include:
          - "dags/dependencies.yaml"
          - "dags/**/*"
          - "packages/bietlejuice-airflow/src/bietlejuice/base/jiraops/**/*.py"
          - "packages/bietlejuice-airflow/src/bietlejuice/base/airflow/**/*.py"
          - "packages/bietlejuice-compiler/scripts/jiraops/**"
          - "packages/bietlejuice-compiler/scripts/dependency_handling/**/*.py"
          - "packages/bietlejuice-core/src/bietlejuice/base/airflow/**/*.py"
        on_empty: false
    depends_on: [setup]

  validate-core-model-schema-content:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice:prod-ci-base-latest
    pull: true
    commands:
      - make validate-core-model-schema-content
    when:
      - event: pull_request
        path: &core_model_schema_content_path
          include:
            - "dags/core/**/*"
            - "packages/bietlejuice-compiler/scripts/ci_cd/validate_core_model_schema_content.py"
            - "packages/bietlejuice-runtime/src/bietlejuice/base/core_models/**/*.py"
            - "packages/bietlejuice-airflow/src/bietlejuice/base/core_models/**/*.py"
            - "packages/bietlejuice-core/src/bietlejuice/base/core_models/**/*.py"
          on_empty: false
      - event: push
        branch: [master, hotfix/*, forno]
        path: *core_model_schema_content_path
    depends_on: [setup]

  validate-databricks-sql-constructs:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice:prod-ci-base-latest
    pull: true
    commands:
      - make validate-databricks-sql-constructs
    when:
      - event: pull_request
        path: &databricks_sql_constructs_path
          include:
            - "dags/**/*.sql"
            - "packages/bietlejuice-compiler/scripts/ci_cd/validate_databricks_sql_constructs.py"
          on_empty: false
      - event: push
        branch: [master, hotfix/*, forno]
        path: *databricks_sql_constructs_path
    depends_on: [setup]
