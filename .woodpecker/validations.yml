# Path filters use Woodpecker `when.path` with `event: [push, pull_request]`.
#
# The pull_request event is critical for correctness: Woodpecker evaluates
# when.path against the full PR diff (via GitHub PullRequests.ListFiles API),
# not just the last pushed commit. Without it, a trivial final commit (e.g.
# touching only a Dockerfile or a comment) would skip all validation steps
# even when earlier commits in the same PR changed DAGs or Python modules.
#
# The push event is kept alongside pull_request so that direct pushes to
# forno/master (which have no open PR) still trigger the relevant steps.
#
# Skipped steps count as success so downstream workflows
# (e.g. release depends_on: validations) still pass.
#
# DAG-side globs are kept coarse (`dags/**/*` or `dags/**/*.yml` where enough)
# instead of per-folder patterns, so `when.path.include` stays short. Steps
# may run a bit more often than strictly necessary; validation scripts still
# scope work via git diff where applicable.
clone:
  - name: clone
    image: woodpeckerci/plugin-git
    settings:
      partial: false # We need to clone the entire history to find the changed files

steps:
  validate-dag-declaration-files:
    image: public.ecr.aws/docker/library/python:3.7.16
    commands:
      - pip install tqdm==4.64.1 Cerberus==1.3.4
      - make requirements-scripts
      - make validate-dag-declaration-files level=debug
    when:
      event: [push, pull_request]
      path:
        include:
          - 'dags/**/*.yml'
          - 'bietlejuice/base/airflow/dag_builders/**/*.py'
          - 'scripts/ci_cd/airflow_dag_builder/**/*.py'
        on_empty: false
    depends_on: [] # This is for the steps to run in parallel

  validate-dags-up-to-standard:
    image: public.ecr.aws/docker/library/python:3.7.16
    commands:
      - make requirements-scripts
      - make validate-dags-up-to-standard
    when:
      event: [push, pull_request]
      path:
        include:
          - 'dags/**/*'
          - 'scripts/dag_standard_validation/**'
          - 'bietlejuice/base/airflow/dag_builders/**/*.py'
        on_empty: false

  validate-dags-dependencies-forno:
    image: public.ecr.aws/docker/library/python:3.7.16
    environment:
      ENVIRONMENT: forno
    commands:
      - make requirements-scripts
      - make validate-dags-dependencies
    when:
      event: [push, pull_request]
      branch:
        exclude:
          - master
          - hotfix/*
      path:
        include:
          - 'dags/**/*'
          - 'bietlejuice/base/dependencies/**/*.py'
          - 'bietlejuice/base/airflow/**/*.py'
          - 'bietlejuice/base/db/**/*.py'
          - 'scripts/ci_cd/validate_dags_dependencies.py'
          - 'scripts/dependency_handling/**'
        on_empty: false

  validate-dags-dependencies-prod:
    image: public.ecr.aws/docker/library/python:3.7.16
    environment:
      ENVIRONMENT: prod
    commands:
      - make requirements-scripts
      - make validate-dags-dependencies
    when:
      event: [push, pull_request]
      branch: [master, hotfix/*]
      path:
        include:
          - 'dags/**/*'
          - 'bietlejuice/base/dependencies/**/*.py'
          - 'bietlejuice/base/airflow/**/*.py'
          - 'bietlejuice/base/db/**/*.py'
          - 'scripts/ci_cd/validate_dags_dependencies.py'
          - 'scripts/dependency_handling/**'
        on_empty: false

  validate-dependency-file-correctness:
    image: public.ecr.aws/docker/library/python:3.7.16
    commands:
      - make requirements
      - make requirements-scripts
      - make validate-dependency-file-correctness
    when:
      event: [push, pull_request]
      path:
        include:
          - 'dags/**/*'
          - 'bietlejuice/base/dependencies/**/*.py'
          - 'bietlejuice/base/airflow/**/*.py'
          - 'bietlejuice/base/db/**/*.py'
          - 'scripts/ci_cd/validate_dags_dependencies.py'
          - 'scripts/dependency_handling/**'
        on_empty: false

  validate-metadata-files-content:
    image: public.ecr.aws/docker/library/python:3.7.16
    commands:
      - make requirements-scripts
      - make validate-metadata-files-content
    when:
      event: [push, pull_request]
      branch:
        exclude: [forno, hotfix/*]
      path:
        include:
          - 'dags/**/*.yml'
          - 'scripts/governance_metadata_validation/**'
        on_empty: false

  validate-metadata-files-exist:
    image: public.ecr.aws/docker/library/python:3.7.16
    commands:
      - make requirements-scripts
      - make validate-metadata-files-exist
    when:
      event: [push, pull_request]
      branch:
        exclude: [forno, hotfix/*]
      path:
        include:
          - 'dags/**/*.sql'
          - 'scripts/governance_metadata_validation/**'
        on_empty: false

  validate-lineage-consistency:
    image: public.ecr.aws/docker/library/python:3.7.16
    commands:
      - make requirements-scripts
      - make validate-lineage-consistency
    when:
      event: [push, pull_request]
      path:
        include:
          - 'dags/**/*'
          - 'scripts/governance_metadata_validation/**'
        on_empty: false

  validate-core-model-schemas:
    image: public.ecr.aws/docker/library/python:3.7.16
    commands:
      - make requirements-scripts
      - make validate-core-model-schemas
    when:
      event: [push, pull_request]
      path:
        include:
          - 'dags/core/**/*'
          - 'scripts/ci_cd/validate_core_model_schemas.py'
        on_empty: false

  validate-core-model-schema-content:
    image: public.ecr.aws/docker/library/python:3.7.16
    commands:
      - make requirements-scripts
      - make validate-core-model-schema-content
    when:
      event: [push, pull_request]
      path:
        include:
          - 'dags/core/**/*'
          - 'scripts/ci_cd/validate_core_model_schema_content.py'
          - 'bietlejuice/base/core_models/**/*.py'
        on_empty: false

  validate-source-layer-policy:
    image: public.ecr.aws/docker/library/python:3.7.16
    commands:
      - make requirements-scripts
      - make validate-source-layer-policy
    when:
      event: [push, pull_request]
      branch:
        exclude: [forno, hotfix/*]
      path:
        include:
          - 'dags/**/*'
          - 'scripts/ci_cd/source_layer_validation/**'
        on_empty: false
