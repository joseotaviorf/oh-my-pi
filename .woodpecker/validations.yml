clone:
  - name: clone
    image: woodpeckerci/plugin-git
    settings:
      partial: false # We need to clone the entire history to find the changed files

steps:
  validate-dag-declaration-files:
    image: public.ecr.aws/docker/library/python:3.7.16
    commands:
      - pip install tqdm==4.64.1 Cerberus==1.3.4
      - make requirements-scripts
      - make validate-dag-declaration-files level=debug
    when:
      event: push
    depends_on: [] # This is for the steps to run in parallel

  validate-dags-up-to-standard:
    image: public.ecr.aws/docker/library/python:3.7.16
    commands:
      - make requirements-scripts
      - make validate-dags-up-to-standard
    when:
      event: push

  validate-dags-dependencies-forno:
    image: public.ecr.aws/docker/library/python:3.7.16
    environment:
      ENVIRONMENT: forno
    commands:
      - make requirements-scripts
      - make validate-dags-dependencies
    when:
      event: push
      branch:
        exclude:
          - master
          - hotfix/*

  validate-dags-dependencies-prod:
    image: public.ecr.aws/docker/library/python:3.7.16
    environment:
      ENVIRONMENT: prod
    commands:
      - make requirements-scripts
      - make validate-dags-dependencies
    when:
      event: push
      branch: [master, hotfix/*]

  validate-dependency-file-correctness:
    image: public.ecr.aws/docker/library/python:3.7.16
    commands:
      - make requirements
      - make requirements-scripts
      - make validate-dependency-file-correctness
    when:
      event: push

  validate-metadata-files-content:
    image: public.ecr.aws/docker/library/python:3.7.16
    commands:
      - make requirements-scripts
      - make validate-metadata-files-content
    when:
      event: push
      branch:
        exclude: [forno, hotfix/*]

  validate-metadata-files-exist:
    image: public.ecr.aws/docker/library/python:3.7.16
    commands:
      - make requirements-scripts
      - make validate-metadata-files-exist
    when:
      event: push
      branch:
        exclude: [forno, hotfix/*]

  validate-core-model-schemas:
    image: public.ecr.aws/docker/library/python:3.7.16
    commands:
      - make requirements-scripts
      - make validate-core-model-schemas
    when:
      event: push

  validate-core-model-schema-content:
    image: public.ecr.aws/docker/library/python:3.7.16
    commands:
      - make requirements-scripts
      - make validate-core-model-schema-content
    when:
      event: push

  transpile-and-commit-sql:
    image: public.ecr.aws/docker/library/python:3.9.5
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      # Install dependencies and run transpilation
      - make requirements-scripts
      - make transcript-sql-files
      
      # Configure git identity
      - git config user.name "Homes"
      - git config user.email "homesbot@quintoandar.com.br"
      
      # Commit and push if there are changes
      - |
        if ! git diff --quiet || ! git diff --cached --quiet; then
          echo "📝 Changes detected, committing and pushing..."
          git add -A
          git commit -m "chore: transpile SQL files to Databricks syntax [skip ci]"
          git push origin HEAD:$${CI_COMMIT_BRANCH}
          echo "✅ Changes pushed successfully"
        else
          echo "ℹ️ No changes to commit"
        fi
    when:
      event: push
      path:
        include:
          - 'dags/planning_and_performance/**/*.sql'
    depends_on: []
