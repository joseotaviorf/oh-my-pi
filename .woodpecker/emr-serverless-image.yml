# EMR Serverless notebook image — published to ECR for SageMaker Unified Studio.
#
# Two variants (see .container/Dockerfile.emr-serverless):
#   emr-serverless-base   — common set; what most notebooks use
#   emr-serverless-heavy  — base + geo/ML/NLP stack
#
# Tag convention follows .woodpecker/containers.yml (env prefix required by the
# ECR tagging policy):
#   master            → prod-emr-serverless-<variant>-latest  + prod-emr-serverless-<variant>-<sha7>
#   forno / manual    → forno-emr-serverless-<variant>-latest + forno-emr-serverless-<variant>-<sha7>
#
# ARTIFACTS: private wheels/JARs are prefetched with fetch-artifacts.sh (pipeline
# IAM role — no Woodpecker secrets) before plugins/docker runs, matching how
# beethoven image builds only COPY from the clone context. See
# docs/platform/emr_serverless_notebook_image.md.
#
# ARCHITECTURE: linux/amd64 only. EMR Serverless does not run arm64 images, so
# unlike the CI images this is deliberately NOT a multi-arch manifest.
#
# After a new tag is published, the EMR Serverless application must be updated to
# point at it — images are resolved at application update time, not per job run.
# See docs/platform/emr_serverless_notebook_image.md.

when:
  - event: pull_request
  - event: push
    branch: [master, forno]
  - event: manual

variables:
  - &image_paths
    include:
      - '.woodpecker/emr-serverless-image.yml'
      - '.container/Dockerfile.emr-serverless'
      - '.container/emr-serverless/**'

steps:
  # Pull private wheels/JARs into the clone before Kaniko builds. Uses prod-ci-base
  # plus a one-shot AWS CLI install (same pattern as development.yml deploy-dags-
  # from-s3-dev) so we never fight the aws-cli image entrypoint. The pipeline IAM
  # role supplies credentials — no Woodpecker repo secrets.
  fetch-emr-serverless-artifacts:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice:prod-ci-base-latest
    pull: true
    commands:
      - |
        set -eu
        apt-get update -qq
        apt-get install -y --no-install-recommends curl unzip ca-certificates >/dev/null
        curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
        unzip -q /tmp/awscliv2.zip -d /tmp
        /tmp/aws/install --bin-dir /usr/local/bin --install-dir /usr/local/aws-cli >/dev/null
        rm -rf /tmp/awscliv2.zip /tmp/aws
        command -v aws >/dev/null
        sh .container/emr-serverless/fetch-artifacts.sh
    when:
      - event: pull_request
        path: *image_paths
      - event: push
        branch: [master, forno]
        path: *image_paths
      - event: manual

  # PR: build-only smoke test. The Dockerfile runs smoke_test.py as its last
  # step, so a build that succeeds has already proven every import resolves.
  validate-emr-serverless-pr:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/plugins/docker:test-5654ae1
    pull: true
    privileged: true
    settings:
      repo: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice
      dockerfile: .container/Dockerfile.emr-serverless
      target: emr-serverless-base
      platforms:
        - linux/amd64
      no_push: true
    when:
      event: pull_request
      path: *image_paths
    depends_on:
      - fetch-emr-serverless-artifacts

  publish-emr-serverless-base-prod:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/plugins/docker:test-5654ae1
    pull: true
    privileged: true
    settings:
      repo: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice
      dockerfile: .container/Dockerfile.emr-serverless
      target: emr-serverless-base
      tag:
        - prod-emr-serverless-base-latest
        - prod-emr-serverless-base-${CI_COMMIT_SHA:0:7}
      platforms:
        - linux/amd64
    when:
      - path: *image_paths
        branch: [master]
        event: push
      - branch: [master]
        event: manual
    depends_on:
      - fetch-emr-serverless-artifacts

  publish-emr-serverless-heavy-prod:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/plugins/docker:test-5654ae1
    pull: true
    privileged: true
    settings:
      repo: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice
      dockerfile: .container/Dockerfile.emr-serverless
      target: emr-serverless-heavy
      tag:
        - prod-emr-serverless-heavy-latest
        - prod-emr-serverless-heavy-${CI_COMMIT_SHA:0:7}
      platforms:
        - linux/amd64
    when:
      - path: *image_paths
        branch: [master]
        event: push
      - branch: [master]
        event: manual
    depends_on:
      - publish-emr-serverless-base-prod

  # ---------------------------------------------------------------------------
  # forno — publish for pre-merge validation.
  #
  # Triggered manually on any branch except master (a manual run on master is
  # the prod re-publish path and must not also emit forno tags), or by a push to
  # the forno branch, matching how .woodpecker/release.yml treats forno.
  # ---------------------------------------------------------------------------
  publish-emr-serverless-base-forno:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/plugins/docker:test-5654ae1
    pull: true
    privileged: true
    settings:
      repo: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice
      dockerfile: .container/Dockerfile.emr-serverless
      target: emr-serverless-base
      tag:
        - forno-emr-serverless-base-latest
        - forno-emr-serverless-base-${CI_COMMIT_SHA:0:7}
      platforms:
        - linux/amd64
    when:
      - event: manual
        branch:
          exclude: [master]
      - path: *image_paths
        branch: [forno]
        event: push
    depends_on:
      - fetch-emr-serverless-artifacts

  # Heavy is ~1 GB larger and only needed by geo/ML/anonymization notebooks.
  # It still builds on every forno run so the two variants never drift apart in
  # what has actually been validated.
  publish-emr-serverless-heavy-forno:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/plugins/docker:test-5654ae1
    pull: true
    privileged: true
    settings:
      repo: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice
      dockerfile: .container/Dockerfile.emr-serverless
      target: emr-serverless-heavy
      tag:
        - forno-emr-serverless-heavy-latest
        - forno-emr-serverless-heavy-${CI_COMMIT_SHA:0:7}
      platforms:
        - linux/amd64
    when:
      - event: manual
        branch:
          exclude: [master]
      - path: *image_paths
        branch: [forno]
        event: push
    depends_on:
      - publish-emr-serverless-base-forno
