# DataHub governance pipeline — independent of the main code release.
#
# Scope: triggers ONLY on entity Markdown changes and processes ONLY the MD files
# added/edited in the triggering PR/push — never a full catalog re-sync. Editing one
# entity's MD uploads/updates just that one Data Product.
#
# Path filters: pull_request = full PR diff; push = files in the pushed commit range.
# Workflow triggers on pull_request or push to master / hotfix/* only.
#
# Triggers on changes to:
#   • docs/llm_context/business_entities/**  (business entity Markdown — versioned source)
#   • docs/llm_context/metric_entities/**    (metric entity Markdown — versioned source)
#
# Loader/generator/reference changes no longer auto-republish every product. When a change
# to the generation logic must propagate to all products, run a deliberate full re-sync:
#   uv run python packages/bietlejuice-compiler/scripts/ci_cd/generate_and_push_datahub_entities.py --all
# (The push step still auto-detects changed MDs via git diff; --resync-if-loader-changed is
#  intentionally NOT used so a loader edit never fans out to all 36 products.)
#
# The sync-tars-entities and push-context-documents steps keep their own path filters below.
#
# Steps:
#   get-credentials-prod — Vault OPENAI_API_KEY for LiteLLM (push only)
#   push-datahub-business-context — LLM → ephemeral YAML → DataHub via
#                                   generate_and_push_datahub_entities.py (push only)
#   validate-datahub-entities — smoke full catalog on pull_request (no push-only deps)
#   validate-datahub-entities-post-push — smoke after publish (push only;
#       must be a separate step: Woodpecker PR pipelines omit push-only steps, so
#       depends_on push-datahub-business-context fails on pull_request)
#   sync-tars-entities — sync_tars_entities.py (direct mode) for DataHub Context Documents
#                         tagged tars-entity (domain) or tars-metrics (metric).
#                         Runs after push-datahub-business-context so the Data Product
#                         already exists when the backlink is established.
#   push-context-documents — push_context_documents.py on push to master / hotfix/*
#                             (idempotent; stable document IDs)
#
# Secrets required (configure in Woodpecker repo settings):
#   datahub_graphql_url_prod — prod DataHub GraphQL endpoint (push + sync-tars-entities)
#   datahub_api_key_prod     — prod DataHub PAT with editor role (push + sync-tars-entities)
#   datahub_graphql_url      — DataHub GraphQL endpoint (validate step)
#   datahub_token            — DataHub PAT (validate step)
#   github_token             — GitHub PAT with repo write access (gitops mode only)
#   Vault (prod)             — OPENAI_API_KEY for LiteLLM (push step only)
#
# This pipeline does NOT depend on lint / tests / validations so it can run
# independently on documentation-only changes.

when:
  - event: pull_request
  - event: push
    branch: [master, hotfix/*]

clone:
  - name: clone
    image: woodpeckerci/plugin-git
    settings:
      partial: false

steps:
  get-credentials-prod:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/plugins/vault
    pull: true
    settings:
      vault_secrets:
        - OPENAI_API_KEY=kv:/apps/shared/litellm/zordon-tars-llm#key
      output_file: ./my-secrets
      vault_env: prod
    when:
      - event: push
        branch: [master, hotfix/*]
        # Scope: fire ONLY when entity Markdown sources change. Loader/generator/reference
        # edits no longer auto-trigger a run (they would process zero changed MDs anyway);
        # use `generate_and_push_datahub_entities.py --all` for a deliberate full re-sync.
        path: &datahub_path
          include:
            - "docs/llm_context/business_entities/**"
            - "docs/llm_context/metric_entities/**"
          on_empty: false

  push-datahub-business-context:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice:prod-ci-base-latest
    pull: true
    environment:
      DATAHUB_GRAPHQL_URL:
        from_secret: datahub_graphql_url_prod
      DATAHUB_TOKEN:
        from_secret: datahub_api_key_prod
    commands:
      - eval $(cat ./my-secrets)
      # Process ONLY the entity MDs added/edited in this push (auto-detected via git diff) —
      # never a full catalog re-sync. Editing one MD uploads/updates just that Data Product.
      # For a deliberate full re-sync (e.g. after a generator/loader change), run the script
      # with --all as a one-off, outside this path-scoped pipeline.
      - uv run python packages/bietlejuice-compiler/scripts/ci_cd/generate_and_push_datahub_entities.py
    when:
      - event: push
        branch: [master, hotfix/*]
        path: *datahub_path
    depends_on: [get-credentials-prod]

  validate-datahub-entities:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice:prod-ci-base-latest
    pull: true
    environment:
      DATAHUB_GRAPHQL_URL:
        from_secret: datahub_graphql_url
      DATAHUB_TOKEN:
        from_secret: datahub_token
    commands:
      # PR validation: scoped to changed MDs only (avoids failing on pre-existing empty
      # shells unrelated to this PR), warn-only for brand-new entities that don't exist
      # in DataHub until the post-merge push.
      - uv run python dags/governance/datahub_business_context/smoke_test_datahub.py --verbose --changed-only --skip-missing
    when:
      - event: pull_request
        path: *datahub_path

  validate-datahub-entities-post-push:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice:prod-ci-base-latest
    pull: true
    environment:
      DATAHUB_GRAPHQL_URL:
        from_secret: datahub_graphql_url
      DATAHUB_TOKEN:
        from_secret: datahub_token
    commands:
      # Post-push validation: strict + deep, scoped to the MDs republished in THIS push
      # (--changed-only). Hard-fails if a just-published product has an empty description,
      # zero golden queries, or zero linked assets. Scoping avoids failing on pre-existing
      # empty/legacy products unrelated to the current change.
      - uv run python dags/governance/datahub_business_context/smoke_test_datahub.py --verbose --strict --deep --changed-only
    when:
      - event: push
        branch: [master, hotfix/*]
        path: *datahub_path
    depends_on: [push-datahub-business-context]

  sync-tars-entities:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice:prod-ci-base-latest
    pull: true
    environment:
      DATAHUB_GRAPHQL_URL:
        from_secret: datahub_graphql_url_prod
      DATAHUB_TOKEN:
        from_secret: datahub_api_key_prod
      TARS_SYNC_MODE: direct
    commands:
      - uv run python dags/governance/datahub_business_context/sync_tars_entities.py --mode direct
    when:
      - event: push
        branch: [master, hotfix/*]
        path:
          include:
            - "docs/llm_context/business_entities/**"
            - "docs/llm_context/metric_entities/**"
            - "dags/governance/datahub_business_context/sync/**"
            - "dags/governance/datahub_business_context/sync_tars_entities.py"
          on_empty: false
    depends_on: [push-datahub-business-context]

  push-context-documents:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice:prod-ci-base-latest
    pull: true
    environment:
      DATAHUB_GRAPHQL_URL:
        from_secret: datahub_graphql_url
      DATAHUB_TOKEN:
        from_secret: datahub_token
    commands:
      - uv run python dags/governance/datahub_business_context/push_context_documents.py
    when:
      - event: push
        branch: [master, hotfix/*]
        path:
          include:
            - "dags/governance/datahub_business_context/context_documents/**"
            - "dags/governance/datahub_business_context/push_context_documents.py"
          on_empty: false
