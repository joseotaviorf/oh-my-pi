# Path filters use Woodpecker `when.path` with `event: [push, pull_request]`.
# See validations.yml header for the full rationale — pull_request is required
# so that when.path evaluates the full PR diff, not just the last pushed commit.
clone:
  - name: clone
    image: woodpeckerci/plugin-git
    settings:
      partial: false # We need to clone the entire history to find the changed files

steps:
  setup:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice:prod-ci-jdk-latest
    pull: true
    commands:
      # Re-link editable workspace packages and patch any new workspace deps (~1-2s).
      # UV_PROJECT_ENVIRONMENT=/opt/bietlejuice/venvs/workspace is set in the image.
      - uv sync
      # Symlink runtime venv paths into the workspace so the Makefile's
      # `envs/dbr-16-4/.venv/bin/pytest` resolves to the pre-built image venvs at
      # /opt/bietlejuice/venvs/ (present in images built from .container/Dockerfile).
      - ln -sfn /opt/bietlejuice/venvs/runtime packages/bietlejuice-runtime/.venv
      - ln -sfn /opt/bietlejuice/venvs/dbr-16-4 packages/bietlejuice-runtime/envs/dbr-16-4/.venv
    when:
      event: [push, pull_request]

  # PR pushes: scope tests to changed modules via pytest-testmon + path detection.
  # master/forno pushes run the full suite via unit-tests-python instead.
  changed-unit-tests-python:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice:prod-ci-jdk-latest
    pull: true
    commands:
      - export AWS_DEFAULT_REGION=us-east-1
      - make unit-tests-changed
    when:
      event: [push, pull_request]
      branch:
        exclude: [master, forno]
      path:
        include:
          - '**/*.py'
          - 'pyproject.toml'
          - 'packages/*/pyproject.toml'
          - 'uv.lock'
        on_empty: false
    depends_on: [setup]

  # master/forno pushes: run the full suite and rebuild .testmondata as the CI baseline.
  unit-tests-python:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice:prod-ci-jdk-latest
    pull: true
    commands:
      - export AWS_DEFAULT_REGION=us-east-1
      - make unit-tests
    when:
      event: [push, pull_request]
      branch: [master, forno]
      path:
        include:
          - '**/*.py'
          - 'pyproject.toml'
          - 'packages/*/pyproject.toml'
          - 'uv.lock'
        on_empty: false
    depends_on: [setup]

  integration-tests-python:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice:prod-ci-jdk-latest
    pull: true
    commands:
      - export AWS_DEFAULT_REGION=us-east-1
      - make integration-tests
    when:
      event: [push, pull_request]
      path:
        include:
          - '**/*.py'
          - 'pyproject.toml'
          - 'packages/*/pyproject.toml'
          - 'uv.lock'
        on_empty: false
    depends_on: [setup]

  core-model-tests-and-coverage:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice:prod-ci-jdk-latest
    pull: true
    commands:
      - export AWS_DEFAULT_REGION=us-east-1
      - make core-model-coverage
    when:
      event: [push, pull_request]
      path:
        include:
          - 'dags/core/**/*.py'
          - 'packages/bietlejuice-runtime/test/**/*.py'
          - 'packages/bietlejuice-runtime/src/bietlejuice/base/core_models/**/*.py'
          - 'packages/bietlejuice-airflow/src/bietlejuice/base/core_models/**/*.py'
          - 'packages/bietlejuice-core/src/bietlejuice/base/core_models/**/*.py'
        on_empty: false
    depends_on: [setup]
