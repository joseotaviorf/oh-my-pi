# Path filters use Woodpecker `when.path` with `event: [push, pull_request]`.
# See validations.yml header for the full rationale — pull_request is required
# so that when.path evaluates the full PR diff, not just the last pushed commit.
# Skipped steps count as success so downstream workflows
# (e.g. release depends_on: tests) still pass.
clone:
  - name: clone
    image: woodpeckerci/plugin-git
    settings:
      partial: false # We need to clone the entire history to find the changed files

steps:
  # PR pushes: scope tests to changed modules via pytest-testmon + path detection.
  # master pushes: run the full suite and (re)build .testmondata as the CI baseline.
  changed-python-unit-tests:
    image: octoenergy/pyspark:3.3.2
    commands:
      - export AIRFLOW_GPL_UNIDECODE=yes
      - export AWS_DEFAULT_REGION=us-east-1
      - pip install --upgrade pip
      - make requirements
      - make requirements-test
      - make unit-tests-changed
    when:
      event: [push, pull_request]
      branch:
        exclude: [master, forno]
      path:
        include: ['**/*.py']
        on_empty: false
    depends_on: [] # This is for the steps to run in parallel
  
  # master pushes: run the full suite and (re)build .testmondata as the CI baseline.
  full-python-unit-tests:
    image: octoenergy/pyspark:3.3.2
    commands:
      - export AIRFLOW_GPL_UNIDECODE=yes
      - export AWS_DEFAULT_REGION=us-east-1
      - pip install --upgrade pip
      - make requirements-test
      - make requirements
      - make unit-tests
    when:
      event: [push, pull_request]
      branch: [master, forno]
      path:
        include: ['**/*.py']
        on_empty: false
    depends_on: [] # This is for the steps to run in parallel

  integration-tests-python:
    image: octoenergy/pyspark:3.3.2
    commands:
      - export AIRFLOW_GPL_UNIDECODE=yes
      - export AWS_DEFAULT_REGION=us-east-1
      - pip install --upgrade pip
      - make requirements-test
      - make requirements
      - make integration-tests
    when:
      event: [push, pull_request]
      path:
        include: ['**/*.py']
        on_empty: false
    depends_on: [] # This is for the steps to run in parallel

  core-model-tests-and-coverage:
    image: octoenergy/pyspark:3.3.2
    commands:
      - export AIRFLOW_GPL_UNIDECODE=yes
      - export AWS_DEFAULT_REGION=us-east-1
      - pip install --upgrade pip
      - make requirements-test
      - make requirements
      - make core-model-coverage
    when:
      event: [push, pull_request]
      path:
        include:
          # Same roots as scripts/ci_cd/core_models/check_core_model_changes.py (Python only)
          - 'dags/core/**/*.py'
          - 'tests/core_model_dags/**/*.py'
          - 'bietlejuice/base/core_models/**/*.py'
        on_empty: false
