clone:
  - name: clone
    image: woodpeckerci/plugin-git
    settings:
      partial: false # We need the parent commit for git diff HEAD~1 HEAD (see .woodpecker docs)
      depth: 2 # At least 2 commits so HEAD~1 exists in the clone

# Matches scripts/ci_cd/core_models/check_core_model_changes.py CORE_MODEL_PATHS (Python only)
variables:
  - &path_filter_core_model_python
    include:
      - "dags/core/**/*.py"
      - "tests/core_model_dags/**/*.py"
      - "bietlejuice/base/core_models/**/*.py"
    on_empty: false

steps:
  unit-tests-python:
    image: octoenergy/pyspark:3.3.2
    commands:
      - export AIRFLOW_GPL_UNIDECODE=yes
      - export AWS_DEFAULT_REGION=us-east-1
      - pip install --upgrade pip
      - make requirements-test
      - make requirements
      - make unit-tests
    when:
      event: push
      path:
        include:
          - "**/*.py"
        on_empty: false
    depends_on: [] # This is for the steps to run in parallel

  integration-tests-python:
    image: octoenergy/pyspark:3.3.2
    commands:
      - export AIRFLOW_GPL_UNIDECODE=yes
      - export AWS_DEFAULT_REGION=us-east-1
      - pip install --upgrade pip
      - make requirements-test
      - make requirements
      - make integration-tests
    when:
      event: push
      path:
        include:
          - "**/*.py"
        on_empty: false
    depends_on: [] # This is for the steps to run in parallel

  core-model-tests-and-coverage:
    image: octoenergy/pyspark:3.3.2
    commands:
      - export AIRFLOW_GPL_UNIDECODE=yes
      - export AWS_DEFAULT_REGION=us-east-1
      - pip install --upgrade pip
      - make requirements-test
      - make requirements
      - make core-model-coverage
    when:
      event: push
      path: *path_filter_core_model_python
