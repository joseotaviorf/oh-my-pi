steps:
  unit-tests-python:
    image: octoenergy/pyspark:3.3.2
    commands:
      - export AIRFLOW_GPL_UNIDECODE=yes
      - export AWS_DEFAULT_REGION=us-east-1
      - pip install --upgrade pip
      - make requirements-test
      - make requirements
      - make unit-tests
    when:
      event: push
    depends_on: [] # This is for the steps to run in parallel

  integration-tests-python:
    image: octoenergy/pyspark:3.3.2
    commands:
      - export AIRFLOW_GPL_UNIDECODE=yes
      - export AWS_DEFAULT_REGION=us-east-1
      - pip install --upgrade pip
      - make requirements-test
      - make requirements
      - make integration-tests
    when:
      event: push
    depends_on: [] # This is for the steps to run in parallel

  core-model-tests:
    image: octoenergy/pyspark:3.3.2
    commands:
      - export AIRFLOW_GPL_UNIDECODE=yes
      - export AWS_DEFAULT_REGION=us-east-1
      - pip install --upgrade pip
      - make requirements-test
      - make requirements
      - make core-model-tests
    when:
      path:
        [
          "dags/core/**",
          "tests/core_model_dags/**",
          "bietlejuice/base/core_models/**",
        ]
