when:
  event: push

steps:
  check-style-python:
    image: python:3.7.16
    commands:
      - apt-get update
      - apt-get install -y git > /dev/null
      - make requirements-lint
      - make check-style

  files-validation-python:
    image: python:3.7.16
    commands:
      - apt-get update
      - apt-get install -y git > /dev/null
      - make requirements-test
      - make files-validation
