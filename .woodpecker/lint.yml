clone:
  - name: clone
    image: woodpeckerci/plugin-git
    settings:
      partial: false # Full history is required for path-based changed-file detection

steps:
  check-style-python:
    image: &python_lint_image public.ecr.aws/docker/library/python:3.9-bookworm
    commands:
      - apt-get update
      - apt-get install -y git > /dev/null
      - make requirements-lint
      - make check-style
    when:
      event: push
      path:
        include:
          - "**/*.py"
        on_empty: false
    depends_on: [] # This is for the steps to run in parallel

  files-validation-python:
    image: *python_lint_image
    commands:
      - apt-get update
      - apt-get install -y git > /dev/null
      - pip install --upgrade pip
      - make requirements-test
      - make files-validation
    when:
      event: push
      path:
        include:
          - "**/*.py"
        on_empty: false