# Steps run only when Python sources change (step-level when); pipeline is always scheduled
# so downstream pipelines (e.g. release depends_on: lint) are not blocked when no .py files change.

steps:
  check-style-python:
    image: public.ecr.aws/docker/library/python:3.9-bookworm
    commands:
      - apt-get update
      - apt-get install -y git > /dev/null
      - make requirements-lint
      - make check-style
    when:
      event: push
      path:
        include: ['**/*.py']
        on_empty: false
    depends_on: [] # This is for the steps to run in parallel

  files-validation-python:
    image: public.ecr.aws/docker/library/python:3.9-bookworm
    commands:
      - apt-get update
      - apt-get install -y git > /dev/null
      - pip install --upgrade pip
      - make requirements-test
      - make files-validation
    when:
      event: push
      path:
        include: ['**/*.py']
        on_empty: false