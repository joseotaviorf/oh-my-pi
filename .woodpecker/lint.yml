
steps:
  setup:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice:prod-ci-base-latest
    pull: true
    commands:
      - uv sync
    when:
      event: [push, pull_request]

  check-style-python:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice:prod-ci-base-latest
    pull: true
    commands:
      - make check-style
    when:
      event: [push, pull_request]
    depends_on: [setup]

  check-style-dags-python:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice:prod-ci-base-latest
    pull: true
    commands:
      - make check-style-dags
    when:
      event: [push, pull_request]
    depends_on: [setup]

  validate-py39-runtime-typing:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice:prod-ci-base-latest
    pull: true
    commands:
      - make validate-py39-runtime-typing
    when:
      event: [push, pull_request]
    depends_on: [setup]

  files-validation-python:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice:prod-ci-base-latest
    pull: true
    commands:
      - make files-validation
    when:
      event: [push, pull_request]
    depends_on: [setup]

  type-check-python:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice:prod-ci-base-latest
    pull: true
    failure: ignore
    commands:
      - make type-check
    when:
      event: [push, pull_request]
    depends_on: [setup]
