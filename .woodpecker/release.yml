        - ASTRO_API_TOKEN=kv:apps/forno/astronomer/creds/cicd_token#ASTRO_API_TOKEN
        - ASTRO_DEPLOYMENT_ID=kv:apps/forno/astronomer/creds/cicd_token#ASTRO_DEPLOYMENT_ID
        - ASTRO_WORKSPACE_ID=kv:apps/forno/astronomer/creds/cicd_token#ASTRO_WORKSPACE_ID
      output_file: ./astro-secrets-forno
      vault_env: prod
    when:
      event: push
      branch: [forno]
      path: *astro_image_paths

  deploy-astro-image-forno:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice:prod-ci-astro-dind-latest
    pull: true
    privileged: true
    depends_on: [get-astro-credentials-forno]
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - |
        set -eu
        set -a
        # shellcheck disable=SC1091
        . ./astro-secrets-forno
        set +a
        [ -n "$ASTRO_API_TOKEN" ] || { echo "ASTRO_API_TOKEN missing from Vault (apps/forno/astronomer/creds/cicd_token)" >&2; exit 1; }
        [ -n "$ASTRO_DEPLOYMENT_ID" ] || { echo "ASTRO_DEPLOYMENT_ID missing from Vault (apps/forno/astronomer/creds/cicd_token)" >&2; exit 1; }
        [ -n "$ASTRO_WORKSPACE_ID" ] || { echo "ASTRO_WORKSPACE_ID missing from Vault (apps/forno/astronomer/creds/cicd_token)" >&2; exit 1; }
        [ -n "$GITHUB_TOKEN" ] || { echo "GITHUB_TOKEN secret missing" >&2; exit 1; }
        sh -c 'dockerd-entrypoint.sh --registry-mirror=http://docker-registry.apps.shared-prd.habitat.zone:5000 1>/dev/null 2>/dev/null' &
        while ! docker stats --no-stream >/dev/null 2>&1; do
          echo "Waiting Docker daemon to start..."
          sleep 1
        done
        printf '%s' "$GITHUB_TOKEN" > /tmp/github_token
        DOCKER_BUILDKIT=1 docker build \
          --target production \
          --file astro/Dockerfile \
          --secret id=GITHUB_TOKEN,src=/tmp/github_token \
          --build-arg UV_VERSION=0.12.0 \
          -t bietlejuice-airflow:deploy \
          .
        rm -f /tmp/github_token
        cd astro
        astro deploy "$ASTRO_DEPLOYMENT_ID" \
          --workspace-id "$ASTRO_WORKSPACE_ID" \
          --image-name bietlejuice-airflow:deploy \
          --image \
          -f
    when:
      event: push
      branch: [forno]
      path: *astro_image_paths

