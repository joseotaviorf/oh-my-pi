    environment:
      ENVIRONMENT: prod
    commands:
      - pip install boto3==1.24.0 PyYAML==5.1 hierarchical-conf==1.0.3
      - make requirements-scripts
      - PYTHONPATH=. python scripts/ci_cd/upload_all_metadata_files_informations_into_s3.py 5a-databricks
    when:
      event: push
      branch: [master, hotfix/*]

  upload-qube-modules-s3-forno:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/beethoven-s3-sync:forno-latest
    pull: true
    environment:
      BUCKET: databricks.s3.forno.data.quintoandar.com.br
