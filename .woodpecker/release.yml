  # --- luigijr (separate Astro deployment; luigijr/ at repo root) ---

  stage-bietlejuice-tree-luigijr:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice:prod-ci-base-latest
    pull: true
    commands:
      - rm -rf staging/bietlejuice-luigijr
      - mkdir -p staging/bietlejuice-luigijr
      - cp -a packages/bietlejuice-core/src/bietlejuice/. staging/bietlejuice-luigijr/
      - cp -a packages/bietlejuice-airflow/src/bietlejuice/. staging/bietlejuice-luigijr/
    when:
      event: push
      branch: [feature/luigijr]
      path: &luigijr_dag_bundle_path
        include:
          - "luigijr/**"
          - "packages/bietlejuice-core/src/**"
          - "packages/bietlejuice-airflow/src/**"
          - "packages/bietlejuice-compiler/scripts/ci_cd/airflow_dag_builder/**/*.py"
          - "Makefile"
        on_empty: false

  create-dag-files-luigijr:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice:prod-ci-base-latest
    pull: true
    commands:
      - make create-luigijr-dag-files
    when:
      event: push
      branch: [feature/luigijr]
      path: *luigijr_dag_bundle_path
    depends_on: [setup]

  upload-bi-etl-ejuice-modules-s3-luigijr:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/beethoven-s3-sync:forno-latest
    pull: true
    environment:
      BUCKET: artifacts.s3.forno.data.quintoandar.com.br
      S3_PREFIX: astronomer/luigijr/dags
      SOURCE: staging/bietlejuice-luigijr
    when:
      event: push
      branch: [feature/luigijr]
      path: *luigijr_dag_bundle_path
    depends_on: [stage-bietlejuice-tree-luigijr]

  upload-dag-packages-dags-s3-luigijr:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/beethoven-s3-sync:forno-latest
    pull: true
    environment:
      BUCKET: artifacts.s3.forno.data.quintoandar.com.br
      S3_PREFIX: astronomer/luigijr/dags
      SOURCE: luigijr
    when:
      event: push
      branch: [feature/luigijr]
      path: *luigijr_dag_bundle_path
    depends_on: [create-dag-files-luigijr]

  astronomer-deploy-dags-luigijr:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/beethoven-deploy-dags:forno-latest
    pull: true
    when:
      event: push
      branch: [feature/luigijr]
      path: *luigijr_dag_bundle_path
    depends_on:
      [upload-bi-etl-ejuice-modules-s3-luigijr, upload-dag-packages-dags-s3-luigijr]

  get-jiraops-credentials-prod:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/plugins/vault
    pull: true
    settings:
      vault_env: prod
      vault_secrets:
        - JIRA_OPS_CREDENTIALS_JSON=kv:apps/prod/bi-etl-ejuice/JIRA_OPS_API#value
      output_file: ./vault-credentials
    when:
      event: push
      branch: [master, hotfix/*]
      path: &jiraops_mute_list_path
        include:
          - "packages/bietlejuice-compiler/scripts/jiraops/jiraops_mute_list.yml"
          - "packages/bietlejuice-compiler/scripts/jiraops/**"
          - "packages/bietlejuice-core/src/bietlejuice/base/jiraops/**"
        on_empty: false
    depends_on: []

  sync-jiraops-routine-mute-list-prod:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice:prod-ci-base-latest
    pull: true
    commands:
      - . ./vault-credentials
      - bash packages/bietlejuice-compiler/scripts/jiraops/export_jiraops_credentials.sh
      - . ./vault-credentials
      - make sync-jiraops-routine-mute-list
    when:
      event: push
      branch: [master, hotfix/*]
      path: *jiraops_mute_list_path
    depends_on: [setup, get-jiraops-credentials-prod]
