      - uv run --project packages/bietlejuice-compiler python packages/bietlejuice-compiler/scripts/ci_cd/upload_gsheets_dag_conf_into_s3.py databricks.s3.forno.data.quintoandar.com.br --include-dir luigijr
    when:
      event: push
      branch: [forno-luigijr]
      path: *luigijr_dag_bundle_path
    depends_on: [setup]

  upload-luigijr-queries-s3-forno:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice:prod-ci-base-latest
    pull: true
    commands:
      - uv run --project packages/bietlejuice-compiler python packages/bietlejuice-compiler/scripts/ci_cd/upload_dag_packages_artifact_into_s3.py databricks.s3.forno.data.quintoandar.com.br queries --include-dir luigijr
    when:
      event: push
      branch: [forno-luigijr]
      path: *luigijr_dag_bundle_path
