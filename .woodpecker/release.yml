  upload-dag-packages-schemas-s3-forno:
    image: public.ecr.aws/docker/library/python:3.7.16
    commands:
      - pip install boto3==1.24.0 tqdm==4.64.1
      - python scripts/ci_cd/upload_dag_packages_artifact_into_s3.py databricks.s3.forno.data.quintoandar.com.br schemas
    when:
      event: push
      branch: forno

  upload-dag-packages-schemas-s3-prod:
    image: public.ecr.aws/docker/library/python:3.7.16
    commands:
      - pip install boto3==1.24.0 tqdm==4.64.1
      - python scripts/ci_cd/upload_dag_packages_artifact_into_s3.py 5a-databricks schemas
    when:
      event: [push, tag]
      branch: [master, hotfix/*]

  load-metadata-files-to-s3-forno:
    image: public.ecr.aws/docker/library/python:3.7.16
    commands:
      - pip install requests==2.28.1 PyYAML==5.1 boto3==1.24.0
      - make requirements-scripts
      - PYTHONPATH=. python scripts/ci_cd/upload_metadata_files_into_s3.py --branch ${CI_COMMIT_BRANCH} --bucket "data-documentation.s3.forno.data.quintoandar.com.br" --host "https://metadata-propagator.apps.data-frn.habitat.zone/"
    when:
      event: push
      branch: forno

  load-metadata-files-to-s3-prod:
    image: public.ecr.aws/docker/library/python:3.7.16
    commands:
      - pip install requests==2.28.1 PyYAML==5.1 boto3==1.24.0
      - make requirements-scripts
      - PYTHONPATH=. python scripts/ci_cd/upload_metadata_files_into_s3.py --branch ${CI_COMMIT_BRANCH} --bucket "data-documentation.s3.data.quintoandar.com.br" --host "https://metadata-propagator.apps.data-prd.habitat.zone/"
    when:
      event: push
      branch: [master, hotfix/*]

  load-all-metadata-files-information-to-s3-forno:
    image: public.ecr.aws/docker/library/python:3.7.16
    environment:
      ENVIRONMENT: forno
    commands:
      - pip install boto3==1.24.0 PyYAML==5.1 hierarchical-conf==1.0.3
      - make requirements-scripts
      - PYTHONPATH=. python scripts/ci_cd/upload_all_metadata_files_informations_into_s3.py databricks.s3.forno.data.quintoandar.com.br
