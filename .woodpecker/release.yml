  # --- luigijr (dedicated Astro instances; only dags/luigijr/ is deployed) ---
  # Luigi (Zordon plugin) opens PRs adding DAGs under dags/luigijr/. We deploy ONLY
  # dags/luigijr/ to the dedicated luigijr Astro instances, isolated from forno/prod:
  #   - forno-luigijr branch -> forno luigijr instance (sandbox)
  #   - master               -> prod  luigijr instance (production)
  # The normal create-dag-files (--exclude-dir luigijr) keeps Luigi's DAGs out of the
  # forno/prod DAG bag; here --include-dir luigijr routes ONLY them to their instances.
  # Isolation also lives in the staging step: we sync a pruned `dags` package (package
  # scaffolding + dags/luigijr only). The deployed bundle is still rooted at a package
  # literally named `dags`, so the framework's `import dags` (and dependencies.yaml
  # resolution) keep working on the instance with zero framework changes.
  #
  # The forno and prod deploys are two fully independent step chains (each with its own
  # create-dag-files -> stage -> S3/volume uploads -> astronomer deploy), gated on its own
  # branch, with distinct staging dirs, buckets, volumes and beethoven images.

  # ===== forno luigijr chain (branch forno-luigijr -> forno luigijr Astro instance) =====

  create-dag-files-luigijr-forno:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice:prod-ci-base-latest
    pull: true
    commands:
      - make create-luigijr-dag-files
    when:
      event: push
      branch: [forno-luigijr]
      path: &luigijr_dag_bundle_path
        include:
          - "dags/luigijr/**"
          - "packages/bietlejuice-core/src/**"
          - "packages/bietlejuice-airflow/src/**"
          - "packages/bietlejuice-compiler/scripts/ci_cd/airflow_dag_builder/**/*.py"
          - "Makefile"
        on_empty: false
    depends_on: [setup]

  stage-luigijr-bundle-forno:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice:prod-ci-base-latest
    pull: true
    commands:
      # framework modules -> package "bietlejuice" (basename matters: beethoven-s3-sync
      # names the deployed package after basename(SOURCE)).
      - rm -rf staging/luigijr-forno
      - mkdir -p staging/luigijr-forno/bietlejuice
      - cp -a packages/bietlejuice-core/src/bietlejuice/. staging/luigijr-forno/bietlejuice/
      - cp -a packages/bietlejuice-airflow/src/bietlejuice/. staging/luigijr-forno/bietlejuice/
      # pruned dags package -> scaffolding + only dags/luigijr (so `import dags` and
      # dependencies.yaml resolve on the instance, and only Luigi DAGs are loaded).
      # Preserve the luigijr/ domain folder level: the framework's get_dag_parent_path
      # scandirs DAG_PACKAGES_ROOT for {domain}/{dag_name}; flattening (cp .../. dest/)
      # drops the domain folder and breaks sheets_info registration.
      - mkdir -p staging/luigijr-forno/dags
      - cp dags/__init__.py staging/luigijr-forno/dags/
      - cp dags/dependencies.yaml staging/luigijr-forno/dags/
      - cp -a dags/dependency_exceptions staging/luigijr-forno/dags/
      # dags/luigijr may be absent (e.g. first prod bootstrap, or a framework-only push
      # that still triggers this chain via the Makefile/package paths). Copy it when present,
      # otherwise create the empty domain folder so the bundle still resolves — never fail the cp.
      - if [ -d dags/luigijr ]; then cp -a dags/luigijr staging/luigijr-forno/dags/; else mkdir -p staging/luigijr-forno/dags/luigijr; fi
    when:
      event: push
      branch: [forno-luigijr]
      path: *luigijr_dag_bundle_path
    depends_on: [create-dag-files-luigijr-forno]

  upload-bi-etl-ejuice-modules-s3-luigijr-forno:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/beethoven-s3-sync:forno-latest
    pull: true
    environment:
      BUCKET: artifacts-forno-luigijr-data
      S3_PREFIX: astronomer/dags
      SOURCE: staging/luigijr-forno/bietlejuice
    when:
      event: push
      branch: [forno-luigijr]
      path: *luigijr_dag_bundle_path
    depends_on: [stage-luigijr-bundle-forno]

  upload-dag-packages-dags-s3-luigijr-forno:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/beethoven-s3-sync:forno-latest
    pull: true
    environment:
      BUCKET: artifacts-forno-luigijr-data
      S3_PREFIX: astronomer/dags
      SOURCE: staging/luigijr-forno/dags
    when:
      event: push
      branch: [forno-luigijr]
      path: *luigijr_dag_bundle_path
    depends_on: [stage-luigijr-bundle-forno]

  # forno luigijr: populate the FORNO Databricks volume with per-DAG runtime artifacts.
  # The cluster reads sheets_info/queries from the volume when a DAG isn't in the
  # bietlejuice_runtime wheel (the luigijr case: the wheel is built off `forno` and has no
  # dags/luigijr, so get_dag_parent_path returns None and ConfigurationService falls back to
  # the volume). --include-dir luigijr scopes the walk so forno artifacts are never touched.
  upload-luigijr-spark-jobs-conf-s3-forno:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice:prod-ci-base-latest
    pull: true
