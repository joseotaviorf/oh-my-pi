# Path filters use Woodpecker `when.path`. Steps that run on both push and tag use
# `event: [push, tag]` with branch and path in one `when` object. Skipped steps count as
# success so upstream `depends_on: lint/tests/validations` still passes.
#
# Wheel / create-dag / upload chains share YAML anchors so path predicates stay identical
# within each chain (avoid skipping `make package` while a dependent step still runs).
# API ingestion declaration YAML under dags/ is packaged in the wheel (MANIFEST.in); the
# wheel must rebuild when those files change so Databricks reads current declarations.
#
# IMPORTANT: astronomer-deploy-dags-{env} depends_on upload-dag-packages-dags-s3-{env},
# so *astronomer_deploy_path must be a subset of *upload_dags_path. Do NOT add paths here
# (e.g. `bietlejuice/**`) that are not also covered by *upload_dags_path, or Woodpecker
# will error with "depends on unknown step" when only those paths change.

depends_on:
  - lint
  - tests
  - validations

clone:
  - name: clone
    image: woodpeckerci/plugin-git
    settings:
      partial: false # We need to clone the entire history to find the changed files

steps:
  make-package-python:
    image: public.ecr.aws/docker/library/python:3.9.5
    commands:
      - make package
    when:
      event: [push, tag]
      branch: [master, forno, hotfix/*]
      path: &wheel_package_path
          include:
            - 'bietlejuice/**'
            - 'setup.py'
            - 'setup.cfg'
            - 'pyproject.toml'
            - 'MANIFEST.in'
            - 'dags/**/*_api_declaration.y*ml'
            - 'dags/**/spark_jobs/*_conf.y*ml'
            - 'requirements.txt'
            - 'requirements-*.txt'
            - 'Makefile'
          on_empty: false

  prepare-release-forno:
    image: public.ecr.aws/docker/library/alpine:3.10
    commands:
      - find . -wholename "./dist/bi_etl_ejuice-*-py3-none-any.whl" -exec mv '{}' ./dist/bi_etl_ejuice-latest-py3-none-any.whl \;
    when:
      event: push
      branch: forno
      path: *wheel_package_path
    depends_on: [make-package-python]

  prepare-release-prod:
    image: public.ecr.aws/docker/library/alpine:3.10
    commands:
      - find . -wholename "./dist/bi_etl_ejuice-*-py3-none-any.whl" -exec cp '{}' ./dist/bi_etl_ejuice-latest-py3-none-any.whl \;
    when:
      event: [push, tag]
      branch: [master, hotfix/*]
      path: *wheel_package_path
    depends_on: [make-package-python]

  export-releases-to-s3-prod:
    image: plugins/s3:1.4.0
    settings:
      bucket: artifacts.s3.data.quintoandar.com.br
      source: dist/*.whl
      target: bi-etl-ejuice/
      strip_prefix: dist/
      acl: bucket-owner-full-control
      cache_control: no-cache
    when:
      event: [push, tag]
      branch: [master, hotfix/*]
      path: *wheel_package_path
    depends_on: [prepare-release-prod]

  export-releases-to-s3-forno:
    image: plugins/s3:1.4.0
    settings:
      bucket: artifacts.s3.forno.data.quintoandar.com.br
      source: dist/*.whl
      target: bi-etl-ejuice/
      strip_prefix: dist/
      acl: bucket-owner-full-control
      cache_control: no-cache
    when:
      event: [push, tag]
      branch: forno
      path: *wheel_package_path
    depends_on: [prepare-release-forno]

  export-init-script-to-s3-forno:
