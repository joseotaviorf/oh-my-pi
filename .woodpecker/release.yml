  # Single source of truth for the entire DAG-bag delivery chain
  # (create-dag-files → stage/upload → astronomer-deploy-dags). All five
  # downstream steps reuse `*dag_bundle_sync_path` so a push touching ANY
  # path that affects what Astro discovers will fire the chain end-to-end.
  #
  # Previously each step had its own narrower `when.path` block, which meant:
  #   - library-only changes (packages/bietlejuice-{core,airflow}/src/**)
  #     would update the S3 mirror but never trigger
  #     `astronomer-deploy-dags-forno`, leaving the live DAG bag stale
  #     until someone happened to touch dags/** or Makefile;
  #   - keeping the trigger sets in sync across five steps was error-prone
  #     and had already drifted (`create-dag-files` listed
  #     `dags/dependencies.yaml` separately even though `dags/**` covers it).
  #
  # CRITICAL: every step that participates in the DAG-bag delivery chain
  # MUST use `*dag_bundle_sync_path`. The chain has internal `depends_on`
  # links — if upstream filters were narrower than downstream filters, the
  # upstream would skip and cascade-skip the downstream (Woodpecker treats
  # skipped deps the same as failed deps for `depends_on`). Likewise, if
  # `stage-bietlejuice-tree` were skipped while
  # `upload-bi-etl-ejuice-modules-s3-{env}` fired, the upload would mirror
  # a missing `staging/bietlejuice/` and beethoven-s3-sync's mirror-delete
  # would wipe `s3://{bucket}/astronomer/dags/bietlejuice/` in prod.
  create-dag-files:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice:prod-ci-base-latest
    pull: true
    commands:
      - make create-dag-files
    when:
      event: push
      branch: [forno, master, hotfix/*]
      path: &dag_bundle_sync_path
        include:
          - "packages/bietlejuice-core/src/**"
          - "packages/bietlejuice-airflow/src/**"
          - "dags/**"
          - "packages/bietlejuice-compiler/scripts/ci_cd/airflow_dag_builder/**/*.py"
          - "Makefile"
        on_empty: false
    depends_on: [setup]

  stage-bietlejuice-tree:
    image: public.ecr.aws/docker/library/alpine:3.20
    commands:
      - rm -rf staging/bietlejuice
      - mkdir -p staging/bietlejuice
      - cp -a packages/bietlejuice-core/src/bietlejuice/. staging/bietlejuice/
      - cp -a packages/bietlejuice-airflow/src/bietlejuice/. staging/bietlejuice/
    when:
      event: push
      branch: [forno, master, hotfix/*]
      path: *dag_bundle_sync_path

  upload-bi-etl-ejuice-modules-s3-forno:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/beethoven-s3-sync:forno-latest
    pull: true
    environment:
      BUCKET: artifacts.s3.forno.data.quintoandar.com.br
      S3_PREFIX: astronomer/dags
      SOURCE: staging/bietlejuice
    when:
      event: push
      branch: [forno]
      path: *dag_bundle_sync_path
    depends_on: [stage-bietlejuice-tree]

  upload-bi-etl-ejuice-modules-s3-prod:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/beethoven-s3-sync:prod-latest
    pull: true
    environment:
      BUCKET: artifacts.s3.data.quintoandar.com.br
      S3_PREFIX: astronomer/dags
      SOURCE: staging/bietlejuice
    when:
      event: push
      branch: [master, hotfix/*]
      path: *dag_bundle_sync_path
    depends_on: [stage-bietlejuice-tree]

  upload-dag-packages-dags-s3-forno:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/beethoven-s3-sync:forno-latest
    pull: true
    environment:
      BUCKET: artifacts.s3.forno.data.quintoandar.com.br
      S3_PREFIX: astronomer/dags
      SOURCE: dags
    when:
      event: push
      branch: [forno]
      path: *dag_bundle_sync_path
    depends_on: [create-dag-files]

  upload-dag-packages-dags-s3-prod:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/beethoven-s3-sync:prod-latest
    pull: true
    environment:
      BUCKET: artifacts.s3.data.quintoandar.com.br
      S3_PREFIX: astronomer/dags
      SOURCE: dags
    when:
      event: push
      branch: [master, hotfix/*]
      path: *dag_bundle_sync_path
    depends_on: [create-dag-files]

  astronomer-deploy-dags-forno:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/beethoven-deploy-dags:forno-latest
    pull: true
    when:
      event: push
      branch: [forno]
      path: *dag_bundle_sync_path
    depends_on:
      [upload-bi-etl-ejuice-modules-s3-forno, upload-dag-packages-dags-s3-forno]

  astronomer-deploy-dags-prod:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/beethoven-deploy-dags:prod-latest
    pull: true
