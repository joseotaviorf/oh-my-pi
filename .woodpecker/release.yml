      path: *luigijr_dag_bundle_path
    depends_on: [stage-luigijr-bundle-forno]

  # forno luigijr: populate the FORNO Databricks volume with per-DAG runtime artifacts.
  # The cluster reads sheets_info/queries from the volume when a DAG isn't in the
  # bietlejuice_runtime wheel (the luigijr case: the wheel is built off `forno` and has no
  # dags/luigijr, so get_dag_parent_path returns None and ConfigurationService falls back to
  # the volume). --include-dir luigijr scopes the walk so forno artifacts are never touched.
  upload-luigijr-spark-jobs-conf-s3-forno:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice:prod-ci-base-latest
    pull: true
    commands:
      # gsheets confs live at the DAG ROOT; the cluster runtime reads them from spark_jobs/{dag}/.
      - uv run --project packages/bietlejuice-compiler python packages/bietlejuice-compiler/scripts/ci_cd/upload_gsheets_dag_conf_into_s3.py databricks.s3.forno.data.quintoandar.com.br --include-dir luigijr
    when:
      event: push
      branch: [forno-luigijr]
