    pull: true
    environment:
      BUCKET: databricks.s3.prod.data.quintoandar.com.br
      S3_PREFIX: github-repos/bi-etl-ejuice/
      SOURCE: bietlejuice/qube
    when:
      event: push
      branch: [master, hotfix/*]