# Path filters use Woodpecker `when.path`. Steps that run on both push and tag use
# `event: [push, tag]` with branch and path in one `when` object. Skipped steps count as
# success so upstream `depends_on: lint/tests/validations` still passes.
#
# This file uses two YAML anchors as the only sources of truth for path predicates:
#
#   *wheel_package_path   — fires the wheel-build / publish chain
#                           (make-package-python -> prepare-release-* -> export-releases-to-s3-*)
#
#   *dag_bundle_sync_path — fires the DAG-bag delivery chain
#                           (create-dag-files -> stage-bietlejuice-tree
#                            -> upload-bi-etl-ejuice-modules-s3-* + upload-dag-packages-dags-s3-*
#                            -> astronomer-deploy-dags-*)
#
# CRITICAL: every step inside a chain MUST reuse the chain's anchor. Within a chain
# the steps have hard `depends_on` links — if an upstream filter is narrower than a
# downstream filter, the upstream step is skipped on a push that matches only the
# downstream paths, and Woodpecker treats a skipped dep the same as a failed dep,
# cascade-skipping the whole tail. The previous setup had three separate, drifting
# anchors for the DAG-bag chain (`&bietlejuice_sync_path`, `&upload_dags_path`,
# `&astronomer_deploy_path`) which silently kept library-only changes from ever
# triggering `astronomer-deploy-dags-*`, leaving the live DAG bag stale.
#
# Repo layout note: `bietlejuice` is split across `packages/bietlejuice-core/src/bietlejuice/`
# and `packages/bietlejuice-airflow/src/bietlejuice/`. The Astronomer DAG bundle still
# expects a single `bietlejuice/` tree under `s3://{bucket}/astronomer/dags/`, so the
# `stage-bietlejuice-tree` step below merges both into `staging/bietlejuice/` before
# `upload-bi-etl-ejuice-modules-s3-{env}` mirrors it to S3.
#
# `setup` runs `uv sync` for the compiler workspace once before any parallel Python
# steps. Without it, several release steps share the repo workspace and concurrent
# `uv run --project packages/bietlejuice-compiler` races on `.venv` (intermittent CI
# failure). Same pattern as `.woodpecker/validations.yml` + `depends_on: [setup]`.
#
# Wheel pipeline (`make-package-python` -> `prepare-release-*` -> `export-releases-to-s3-*`):
# `make build` produces TWO wheels into `dist/` — `bietlejuice_core-*.whl` and
# `bietlejuice_runtime-*.whl`. These are the wheels Spark/Databricks/EMR jobs install
# via `default_libraries` / `emr_init_script.sh`. The Airflow wheel is intentionally NOT
# published here because Airflow code is shipped via the Astro DAG bundle (see
# stage-bietlejuice-tree), not pip-installed on Spark workers. The legacy
# `bi_etl_ejuice-latest` alias was retired with this change; consumers were migrated to
# install both `bietlejuice_core-latest` and `bietlejuice_runtime-latest`.

depends_on:
  - lint
  - tests
  - validations

clone:
  - name: clone
    image: woodpeckerci/plugin-git
    settings:
      partial: false # We need to clone the entire history to find the changed files

steps:
  setup:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice:prod-ci-base-latest
    pull: true
    commands:
      - uv sync --project packages/bietlejuice-compiler
    when:
      event: [push, tag]

  make-package-python:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice:prod-ci-base-latest
    pull: true
    commands:
      - apt-get update -qq && apt-get install -y --no-install-recommends make git rsync
      - pip install uv
      # `make build` runs `uv build` for bietlejuice-core and bietlejuice-runtime; uv
      # writes both wheels (and sdists) into the workspace-root `dist/`, which is what
      # `prepare-release-*` and `export-releases-to-s3-*` consume.
      - make build
    when:
      event: [push, tag]
      branch: [master, forno, hotfix/*]
      path: &wheel_package_path
        include:
          - "packages/bietlejuice-core/**"
          - "packages/bietlejuice-runtime/**"
          - "pyproject.toml"
          - "uv.lock"
          - "dags/**/*_api_declaration.y*ml"
          - "dags/**/spark_jobs/*_conf.y*ml"
          - "requirements.txt"
          - "requirements-*.txt"
          - "Makefile"
        on_empty: false
    depends_on: [setup]

  prepare-release-forno:
    image: public.ecr.aws/docker/library/alpine:3.10
    commands:
      # forno only ever publishes the latest build, so we `mv` the versioned wheels to
      # their `*-latest-*` aliases. dist/ ends up with exactly two files which
      # `export-releases-to-s3-forno` mirrors to S3.
      - find . -wholename "./dist/bietlejuice_core-*.whl" -not -name "*-latest-*" -exec mv '{}' ./dist/bietlejuice_core-latest-py3-none-any.whl \;
      - find . -wholename "./dist/bietlejuice_runtime-*.whl" -not -name "*-latest-*" -exec mv '{}' ./dist/bietlejuice_runtime-latest-py3-none-any.whl \;
    when:
      event: push
      branch: forno
      path: *wheel_package_path
    depends_on: [make-package-python]

  prepare-release-prod:
    image: public.ecr.aws/docker/library/alpine:3.10
    commands:
      # prod copies (not moves), so both versioned wheels (e.g. bietlejuice_core-0.1.0.whl)
      # and `*-latest-*` aliases get uploaded — versioned ones provide rollback targets
      # in S3 (s3://artifacts.s3.data.../bi-etl-ejuice/).
      - find . -wholename "./dist/bietlejuice_core-*.whl" -not -name "*-latest-*" -exec cp '{}' ./dist/bietlejuice_core-latest-py3-none-any.whl \;
      - find . -wholename "./dist/bietlejuice_runtime-*.whl" -not -name "*-latest-*" -exec cp '{}' ./dist/bietlejuice_runtime-latest-py3-none-any.whl \;
    when:
      event: [push, tag]
      branch: [master, hotfix/*]
      path: *wheel_package_path
    depends_on: [make-package-python]

  export-releases-to-s3-prod:
    image: plugins/s3:1.4.0
    settings:
      bucket: artifacts.s3.data.quintoandar.com.br
      source: dist/*.whl
      target: bi-etl-ejuice/
      strip_prefix: dist/
      acl: bucket-owner-full-control
      cache_control: no-cache
    when:
      event: [push, tag]
      branch: [master, hotfix/*]
      path: *wheel_package_path
    depends_on: [prepare-release-prod]

  export-releases-to-s3-forno:
    image: plugins/s3:1.4.0
    settings:
      bucket: artifacts.s3.forno.data.quintoandar.com.br
      source: dist/*.whl
      target: bi-etl-ejuice/
      strip_prefix: dist/
      acl: bucket-owner-full-control
      cache_control: no-cache
    when:
      event: [push, tag]
      branch: forno
      path: *wheel_package_path
    depends_on: [prepare-release-forno]

  export-init-script-to-s3-forno:
    image: plugins/s3:1.4.0
    settings:
      bucket: artifacts.s3.forno.data.quintoandar.com.br
      source: packages/bietlejuice-compiler/scripts/init_script.sh
      target: bi-etl-ejuice/
      strip_prefix: packages/bietlejuice-compiler/scripts/
      acl: bucket-owner-full-control
      cache_control: no-cache
    when:
      event: [push, tag]
      branch: forno
      path:
        include:
          - "packages/bietlejuice-compiler/scripts/init_script.sh"
        on_empty: false

  export-emr-init-script-to-s3-forno:
    image: plugins/s3:1.4.0
    settings:
      bucket: artifacts.s3.forno.data.quintoandar.com.br
      source: packages/bietlejuice-compiler/scripts/emr_init_script.sh
      target: bi-etl-ejuice/
      strip_prefix: packages/bietlejuice-compiler/scripts/
      acl: bucket-owner-full-control
      cache_control: no-cache
    when:
