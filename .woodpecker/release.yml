  upload-dag-packages-schemas-s3-forno:
    image: *image_python
    commands:
      - pip install boto3==1.24.0
      - python scripts/ci_cd/upload_dag_packages_artifact_into_s3.py databricks.s3.forno.data.quintoandar.com.br schemas
