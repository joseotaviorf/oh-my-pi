depends_on:
  - lint
  - tests
  - validations

clone:
  - name: clone
    image: woodpeckerci/plugin-git
    settings:
      partial: false # We need to clone the entire history to find the changed files

steps:
  make-package-python:
    image: public.ecr.aws/docker/library/python:3.9.5
    commands:
      - make package
    when:
      event: [push, tag]
      branch: [master, forno, hotfix/*]

  prepare-release-forno:
    image: public.ecr.aws/docker/library/alpine:3.10
    commands:
      - find . -wholename "./dist/bi_etl_ejuice-*-py3-none-any.whl" -exec mv '{}' ./dist/bi_etl_ejuice-latest-py3-none-any.whl \;
    when:
      event: push
      branch: forno
    depends_on: [make-package-python]

  prepare-release-prod:
    image: public.ecr.aws/docker/library/alpine:3.10
    commands:
      - find . -wholename "./dist/bi_etl_ejuice-*-py3-none-any.whl" -exec cp '{}' ./dist/bi_etl_ejuice-latest-py3-none-any.whl \;
    when:
      event: [push, tag]
      branch: [master, hotfix/*]
    depends_on: [make-package-python]

  export-releases-to-s3-prod:
    image: plugins/s3:1.4.0
    settings:
      bucket: artifacts.s3.data.quintoandar.com.br
      source: dist/*.whl
      target: bi-etl-ejuice/
      strip_prefix: dist/
      acl: bucket-owner-full-control
      cache_control: no-cache
    when:
      event: [push, tag]
      branch: [master, hotfix/*]
    depends_on: [prepare-release-prod]

  export-releases-to-s3-forno:
    image: plugins/s3:1.4.0
    settings:
      bucket: artifacts.s3.forno.data.quintoandar.com.br
      source: dist/*.whl
      target: bi-etl-ejuice/
      strip_prefix: dist/
      acl: bucket-owner-full-control
      cache_control: no-cache
    when:
      event: [push, tag]
      branch: forno
    depends_on: [prepare-release-forno]

  export-init-script-to-s3-forno:
    image: plugins/s3:1.4.0
    settings:
      bucket: artifacts.s3.forno.data.quintoandar.com.br
      source: scripts/init_script.sh
      target: bi-etl-ejuice/
      strip_prefix: scripts/
      acl: bucket-owner-full-control
      cache_control: no-cache
    when:
      event: [push, tag]
      branch: forno

  export-install-pex-init-script-forno:
    image: plugins/s3:1.4.0
    settings:
      bucket: artifacts.s3.forno.data.quintoandar.com.br
      source: scripts/wonka/install_pex_generic.sh
      target: bi-etl-ejuice/
      strip_prefix: scripts/wonka/
      acl: bucket-owner-full-control
      cache_control: no-cache
    when:
      event: [push, tag]
      branch: forno

  export-vault-secrets-init-script-forno:
    image: plugins/s3:1.4.0
    settings:
      bucket: artifacts.s3.forno.data.quintoandar.com.br
      source: scripts/wonka/get_credentials_from_vault.sh
      target: bi-etl-ejuice/
      strip_prefix: scripts/wonka/
      acl: bucket-owner-full-control
      cache_control: no-cache
    when:
      event: [push, tag]
      branch: forno

  export-install-spark-metrics-plugin-forno:
    image: plugins/s3:1.4.0
    settings:
      bucket: artifacts.s3.forno.data.quintoandar.com.br
      source: scripts/wonka/install_spark_metrics_plugin.sh
      target: bi-etl-ejuice/
      strip_prefix: scripts/wonka/
      acl: bucket-owner-full-control
      cache_control: no-cache
    when:
      event: [push, tag]
      branch: forno

  export-init-script-to-s3-prod:
    image: plugins/s3:1.4.0
    settings:
      bucket: artifacts.s3.data.quintoandar.com.br
      source: scripts/init_script.sh
      target: bi-etl-ejuice/
      strip_prefix: scripts/
      acl: bucket-owner-full-control
      cache_control: no-cache
    when:
      event: [push, tag]
      branch: [master, hotfix/*]
 
  export-install-pex-init-script-prod:
    image: plugins/s3:1.4.0
    settings:
      bucket: artifacts.s3.data.quintoandar.com.br
      source: scripts/wonka/install_pex_generic.sh
      target: bi-etl-ejuice/
      strip_prefix: scripts/wonka/
      acl: bucket-owner-full-control
      cache_control: no-cache
    when:
      event: [push, tag]
      branch: [master, hotfix/*]

  export-vault-secrets-init-script-prod:
    image: plugins/s3:1.4.0
    settings:
      bucket: artifacts.s3.data.quintoandar.com.br
      source: scripts/wonka/get_credentials_from_vault.sh
      target: bi-etl-ejuice/
      strip_prefix: scripts/wonka/
      acl: bucket-owner-full-control
      cache_control: no-cache
    when:
      event: [push, tag]
      branch: [master, hotfix/*]

  export-install-spark-metrics-plugin-prod:
    image: plugins/s3:1.4.0
    settings:
      bucket: artifacts.s3.data.quintoandar.com.br
      source: scripts/wonka/install_spark_metrics_plugin.sh
      target: bi-etl-ejuice/
      strip_prefix: scripts/wonka/
      acl: bucket-owner-full-control
      cache_control: no-cache
    when:
      event: [push, tag]
      branch: [master, hotfix/*]

  create-dag-files:
    image: public.ecr.aws/docker/library/python:3.9.5
    commands:
      - pip install "google-re2==1.1.20250805" "apache-airflow==2.10.4"
      - make requirements-scripts
      - make create-dag-files
    when:
      event: push
      branch: [forno, master, hotfix/*]

  upload-bi-etl-ejuice-modules-s3-forno:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/beethoven-s3-sync:forno-latest
    pull: true
    environment:
      BUCKET: artifacts.s3.forno.data.quintoandar.com.br
      S3_PREFIX: astronomer/dags
      SOURCE: bietlejuice
    when:
      event: push
      branch: [forno]

  upload-bi-etl-ejuice-modules-s3-prod:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/beethoven-s3-sync:prod-latest
    pull: true
    environment:
      BUCKET: artifacts.s3.data.quintoandar.com.br
      S3_PREFIX: astronomer/dags
      SOURCE: bietlejuice
    when:
      event: push
      branch: [master, hotfix/*]

  upload-dag-packages-dags-s3-forno:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/beethoven-s3-sync:forno-latest
    pull: true
    environment:
      BUCKET: artifacts.s3.forno.data.quintoandar.com.br
      S3_PREFIX: astronomer/dags
      SOURCE: dags
    when:
      event: push
      branch: [forno]
    depends_on: [create-dag-files]

  upload-dag-packages-dags-s3-prod:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/beethoven-s3-sync:prod-latest
    pull: true
    environment:
      BUCKET: artifacts.s3.data.quintoandar.com.br
      S3_PREFIX: astronomer/dags
      SOURCE: dags
    when:
      event: push
      branch: [master, hotfix/*]
    depends_on: [create-dag-files]

  astronomer-deploy-dags-forno:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/beethoven-deploy-dags:forno-latest
    pull: true
    when:
      event: push
      branch: [forno]
    depends_on:
      [upload-bi-etl-ejuice-modules-s3-forno, upload-dag-packages-dags-s3-forno]

  astronomer-deploy-dags-prod:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/beethoven-deploy-dags:prod-latest
    pull: true
    when:
      event: push
      branch: [master, hotfix/*]
    depends_on:
      [upload-bi-etl-ejuice-modules-s3-prod, upload-dag-packages-dags-s3-prod]

  upload-dag-packages-spark-jobs-s3-forno:
    image: public.ecr.aws/docker/library/python:3.7.16
    commands:
      - pip install boto3==1.24.0 tqdm==4.64.1
      - python scripts/ci_cd/upload_dag_packages_artifact_into_s3.py databricks.s3.forno.data.quintoandar.com.br spark_jobs
    when:
      event: push
      branch: forno

  upload-dag-packages-spark-jobs-s3-prod:
    image: public.ecr.aws/docker/library/python:3.7.16
    commands:
      - pip install boto3==1.24.0 tqdm==4.64.1
      - python scripts/ci_cd/upload_dag_packages_artifact_into_s3.py 5a-databricks spark_jobs
    when:
      event: push
      branch: [master, hotfix/*]

  upload-dag-packages-queries-s3-forno:
    image: public.ecr.aws/docker/library/python:3.7.16
    commands:
      - pip install boto3==1.24.0 tqdm==4.64.1
      - python scripts/ci_cd/upload_dag_packages_artifact_into_s3.py databricks.s3.forno.data.quintoandar.com.br queries
    when:
      event: push
      branch: forno

  upload-dag-packages-queries-s3-prod:
    image: public.ecr.aws/docker/library/python:3.7.16
    commands:
      - pip install boto3==1.24.0 tqdm==4.64.1
      - python scripts/ci_cd/upload_dag_packages_artifact_into_s3.py 5a-databricks queries
    when:
      event: push
      branch: [master, hotfix/*]

  upload-dag-packages-data-quality-s3-forno:
    image: public.ecr.aws/docker/library/python:3.7.16
    commands:
      - pip install boto3==1.24.0 tqdm==4.64.1
      - python scripts/ci_cd/upload_dag_packages_artifact_into_s3.py databricks.s3.forno.data.quintoandar.com.br data_quality
