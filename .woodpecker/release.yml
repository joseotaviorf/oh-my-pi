  stage-luigijr-bundle-prod:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice:prod-ci-base-latest
    pull: true
    commands:
      # framework modules -> package "bietlejuice" (basename matters: beethoven-s3-sync
      # names the deployed package after basename(SOURCE)).
      - rm -rf staging/luigijr-prod
      - mkdir -p staging/luigijr-prod/bietlejuice
      - cp -a packages/bietlejuice-core/src/bietlejuice/. staging/luigijr-prod/bietlejuice/
      - cp -a packages/bietlejuice-airflow/src/bietlejuice/. staging/luigijr-prod/bietlejuice/
      # pruned dags package -> scaffolding + only dags/luigijr (see forno chain for why the
      # luigijr/ domain folder level must be preserved).
      - mkdir -p staging/luigijr-prod/dags
      - cp dags/__init__.py staging/luigijr-prod/dags/
      - cp dags/dependencies.yaml staging/luigijr-prod/dags/
      - cp -a dags/dependency_exceptions staging/luigijr-prod/dags/
      # dags/luigijr may be absent (e.g. first prod bootstrap, or a framework-only push
      # that still triggers this chain via the Makefile/package paths). Copy it when present,
      # otherwise create the empty domain folder so the bundle still resolves — never fail the cp.
      - if [ -d dags/luigijr ]; then cp -a dags/luigijr staging/luigijr-prod/dags/; else mkdir -p staging/luigijr-prod/dags/luigijr; fi
    when:
      event: push
      branch: [master]
      path: *luigijr_dag_bundle_path
    depends_on: [create-dag-files-luigijr-prod]

  upload-bi-etl-ejuice-modules-s3-luigijr-prod:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/beethoven-s3-sync:prod-latest
    pull: true
    environment:
      BUCKET: artifacts-luigijr-data
      S3_PREFIX: astronomer/dags
      SOURCE: staging/luigijr-prod/bietlejuice
    when:
      event: push
      branch: [master]
