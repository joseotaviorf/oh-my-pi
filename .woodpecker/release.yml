  upload-luigijr-schemas-s3-forno:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice:prod-ci-base-latest
    pull: true
    commands:
      - uv run --project packages/bietlejuice-compiler python packages/bietlejuice-compiler/scripts/ci_cd/upload_dag_packages_artifact_into_s3.py databricks.s3.forno.data.quintoandar.com.br schemas --include-dir luigijr
    when:
      event: push
      branch: [forno-luigijr]
      path: *luigijr_dag_bundle_path
    depends_on: [setup]

  astronomer-deploy-dags-luigijr-forno:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/beethoven-deploy-dags:forno-luigijr-latest
    pull: true
    when:
      event: push
      branch: [forno-luigijr]
      path: *luigijr_dag_bundle_path
    depends_on:
      [
        upload-bi-etl-ejuice-modules-s3-luigijr-forno,
        upload-dag-packages-dags-s3-luigijr-forno,
      ]

  # ===== prod luigijr chain (branch master -> prod luigijr Astro instance) =====

  create-dag-files-luigijr-prod:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice:prod-ci-base-latest
    pull: true
    commands:
      - make create-luigijr-dag-files
    when:
