# Container image builds — CI images published to ECR.
#
# All images (ci-base, ci-jdk, devcontainer) are built for linux/amd64 + linux/arm64
# via the ECR-hosted Kaniko plugin (plugins/docker) with privileged: true for QEMU
# binfmt registration. GITHUB_TOKEN is passed via environment; the plugin stages
# /kaniko/run/secrets/GITHUB_TOKEN for Dockerfile RUN steps. The plugin pushes a
# manifest list per tag so consumers get the right arch automatically.
# Layer 5 adds prod-devcontainer-* ECR publish on master.
#
# Tag convention (env prefix required by ECR tagging policy):
#   master → prod-<target>-latest   + prod-<target>-<sha7>
#
# No custom clone: default plugin-git shallow clone is enough (Docker build only; no git diff).

steps:
  # Validates that ci-jdk builds for both amd64 and arm64 on feature branches.
  # No push — build-only smoke test.
  # Runs on push to non-master branches (pull_request events are not enabled in
  # Woodpecker for this repo). Add event: pull_request here once enabled.
  validate-multi-arch-pr:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/plugins/docker:test-5654ae1
    pull: true
    privileged: true
    settings:
      repo: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice
      dockerfile: .container/Dockerfile
      target: ci-jdk
      platforms:
        - linux/amd64
        - linux/arm64
      no_push: true
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    when:
      - path:
          include:
            - '.woodpecker/containers.yml'
            - '.container/Dockerfile'
            - '**/pyproject.toml'
            - '**/uv.lock'
            - 'packages/bietlejuice-runtime/hatch_build.py'
        event: push
        branch:
          exclude: [master]
      - path:
          include:
            - '.woodpecker/containers.yml'
            - '.container/Dockerfile'
            - '**/pyproject.toml'
            - '**/uv.lock'
            - 'packages/bietlejuice-runtime/hatch_build.py'
        event: pull_request

  publish-ci-base-prod:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/plugins/docker:test-5654ae1
    pull: true
    privileged: true
    settings:
      repo: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice
      dockerfile: .container/Dockerfile
      target: ci-base
      tag:
        - prod-ci-base-latest
        - prod-ci-base-${CI_COMMIT_SHA:0:7}
      platforms:
        - linux/amd64
        - linux/arm64
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    when:
      - path:
          include:
            - '.woodpecker/containers.yml'
            - '.container/Dockerfile'
            - '**/pyproject.toml'
            - '**/uv.lock'
            - 'packages/bietlejuice-runtime/hatch_build.py'
        branch: [master]
        event: push
      - branch: [master]
        event: manual

  publish-ci-jdk-prod:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/plugins/docker:test-5654ae1
    pull: true
    privileged: true
    settings:
      repo: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice
      dockerfile: .container/Dockerfile
      target: ci-jdk
      tag:
        - prod-ci-jdk-latest
        - prod-ci-jdk-${CI_COMMIT_SHA:0:7}
      platforms:
        - linux/amd64
        - linux/arm64
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    when:
      - path:
          include:
            - '.woodpecker/containers.yml'
            - '.container/Dockerfile'
            - '**/pyproject.toml'
            - '**/uv.lock'
            - 'packages/bietlejuice-runtime/hatch_build.py'
        branch: [master]
        event: push
      - branch: [master]
        event: manual

  publish-devcontainer-prod:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/plugins/docker:test-5654ae1
    pull: true
    privileged: true
    settings:
      dockerfile: .container/Dockerfile
      target: devcontainer
      repo: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice
      tag:
        - prod-devcontainer-latest
        - prod-devcontainer-${CI_COMMIT_SHA:0:7}
      platforms:
        - linux/amd64
        - linux/arm64
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    when:
      - path:
          include:
            - '.woodpecker/containers.yml'
            - '.container/Dockerfile'
            - '.devcontainer/**'
            - '**/pyproject.toml'
            - '**/uv.lock'
            - 'packages/bietlejuice-runtime/hatch_build.py'
        branch: [master]
        event: push
      - branch: [master]
        event: manual
