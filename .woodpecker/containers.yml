# Container image builds — CI images published to ECR.
#
# ci-base, ci-jdk, and devcontainer are built for linux/amd64 + linux/arm64
# via the ECR-hosted Kaniko plugin (plugins/docker) with privileged: true for QEMU
# binfmt registration. ci-astro is amd64-only (Woodpecker CI runners only).
# GITHUB_TOKEN is passed via settings.github_token
# (PLUGIN_GITHUB_TOKEN); the plugin stages /kaniko/run/secrets/GITHUB_TOKEN for
# Dockerfile RUN steps. Multi-arch targets push a
# manifest list per tag so consumers get the right arch automatically.
# Layer 5 adds prod-devcontainer-* ECR publish on master.
#
# Tag convention (env prefix required by ECR tagging policy):
#   master → prod-<target>-latest   + prod-<target>-<sha7>
#
# No custom clone: default plugin-git shallow clone is enough (Docker build only; no git diff).
#
# Path filters scope workspace/package deps used by .container/Dockerfile:
# packages/**/{pyproject.toml,uv.lock} covers every real workspace package
# (incl. nested envs/, e.g. bietlejuice-runtime/envs/dbr-16-4/) minus the
# excluded standalone projects below, which are never copied into the image
# and must not trigger a rebuild. Woodpecker only skips a step when EVERY
# changed file matches an exclude pattern, so a commit touching both an
# excluded path and a real dependency still triggers the rebuild.
when:
  - event: pull_request
    branch:
      exclude: [development]
  - event: push
    branch: [master]
  - event: manual

steps:
  # Validates that ci-jdk builds for both amd64 and arm64 on PRs.
  # No push — build-only smoke test.
  validate-multi-arch-pr:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/plugins/docker:test-5654ae1
    pull: true
    privileged: true
    settings:
      repo: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice
      dockerfile: .container/Dockerfile
      target: devcontainer
      platforms:
        - linux/amd64
        - linux/arm64
      no_push: true
      github_token:
        from_secret: github_token
    when:
      event: pull_request
      path:
        include: &container_dep_paths
          - ".woodpecker/containers.yml"
          - ".container/Dockerfile"
          - ".devcontainer/**"
          - "pyproject.toml"
          - "uv.lock"
          - "packages/**/pyproject.toml"
          - "packages/**/uv.lock"
          - "packages/bietlejuice-runtime/hatch_build.py"
        exclude: &container_excluded_paths
          - "packages/tars-evals/**"
          - "packages/emr-cli/**"

  publish-ci-base-prod:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/plugins/docker:test-5654ae1
    pull: true
    privileged: true
    settings:
      repo: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice
      dockerfile: .container/Dockerfile
      target: ci-base
      tag:
        - prod-ci-base-latest
        - prod-ci-base-${CI_COMMIT_SHA:0:7}
      platforms:
        - linux/amd64
      github_token:
        from_secret: github_token
    when:
      - path:
          include: *container_dep_paths
          exclude: *container_excluded_paths
        branch: [master]
        event: push
      - branch: [master]
        event: manual

  publish-ci-jdk-prod:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/plugins/docker:test-5654ae1
    pull: true
    privileged: true
    settings:
      repo: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice
      dockerfile: .container/Dockerfile
      target: ci-jdk
      tag:
        - prod-ci-jdk-latest
        - prod-ci-jdk-${CI_COMMIT_SHA:0:7}
      platforms:
        - linux/amd64
      github_token:
        from_secret: github_token
    when:
      - path:
          include: *container_dep_paths
          exclude: *container_excluded_paths
        branch: [master]
        event: push
      - branch: [master]
        event: manual

  # amd64 only — used by Woodpecker CI (development.yml), not local/devcontainer.
  publish-ci-astro-prod:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/plugins/docker:test-5654ae1
    pull: true
    privileged: true
    settings:
      repo: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice
      dockerfile: .container/Dockerfile
      target: ci-astro
      tag:
        - prod-ci-astro-latest
        - prod-ci-astro-${CI_COMMIT_SHA:0:7}
      platforms:
        - linux/amd64
      github_token:
        from_secret: github_token
    when:
      - path:
          include: *container_dep_paths
          exclude: *container_excluded_paths
        branch: [master]
        event: push
      - branch: [master]
        event: manual

  # amd64 only — ci-astro + Docker-in-Docker, staged after devcontainer in the
  # Dockerfile so validate-multi-arch-pr's --target=devcontainer never builds
  # this under QEMU. Needs its own path list (not *container_dep_paths):
  # ci-astro-dind's DinD layer is the only target reading .container/dind/**.
  publish-ci-astro-dind-prod:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/plugins/docker:test-5654ae1
    pull: true
    privileged: true
    settings:
      repo: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice
      dockerfile: .container/Dockerfile
      target: ci-astro-dind
      tag:
        - prod-ci-astro-dind-latest
        - prod-ci-astro-dind-${CI_COMMIT_SHA:0:7}
      platforms:
        - linux/amd64
      github_token:
        from_secret: github_token
    when:
      - path:
          include:
            - ".woodpecker/containers.yml"
            - ".container/Dockerfile"
            - ".container/dind/**"
            - "pyproject.toml"
            - "uv.lock"
            - "packages/**/pyproject.toml"
            - "packages/**/uv.lock"
            - "packages/bietlejuice-runtime/hatch_build.py"
          exclude: *container_excluded_paths
        branch: [master]
        event: push
      - branch: [master]
        event: manual

  publish-devcontainer-prod:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/plugins/docker:test-5654ae1
    pull: true
    privileged: true
    settings:
      dockerfile: .container/Dockerfile
      target: devcontainer
      repo: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice
      tag:
        - prod-devcontainer-latest
        - prod-devcontainer-${CI_COMMIT_SHA:0:7}
      platforms:
        - linux/arm64
      github_token:
        from_secret: github_token
    when:
      - path:
          include: *container_dep_paths
          exclude: *container_excluded_paths
        branch: [master]
        event: push
      - branch: [master]
        event: manual
