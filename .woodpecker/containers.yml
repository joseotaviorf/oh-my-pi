# Container image builds — CI images published to ECR.
#
# PRs smoke-build the devcontainer target twice in parallel (one plugin
# invocation per arch: amd64 + arm64) — never one step with both platforms,
# which Kaniko builds sequentially under QEMU. Publish steps build ci-base /
# ci-jdk / ci-astro / ci-astro-dind / devcontainer for their configured
# platforms via the ECR-hosted Kaniko plugin (plugins/docker) with
# privileged: true for QEMU binfmt registration.
# ci-astro and ci-astro-dind are amd64-only (Woodpecker CI runners only).
# GITHUB_TOKEN is passed via settings.github_token
# (PLUGIN_GITHUB_TOKEN); the plugin stages /kaniko/run/secrets/GITHUB_TOKEN for
# Dockerfile RUN steps. Multi-arch targets push a
# manifest list per tag so consumers get the right arch automatically.
# Layer 5 adds prod-devcontainer-* ECR publish on master.
#
# Tag convention (env prefix required by ECR tagging policy):
#   master → prod-<target>-latest   + prod-<target>-<sha7>
#
# No custom clone: default plugin-git shallow clone is enough (Docker build only; no git diff).
#
# Path filters list only what .container/Dockerfile actually COPYs: the
# bietlejuice-* workspace packages, plus bietlejuice-runtime/envs/** (which
# holds only pyproject.toml + uv.lock per DBR env; a single * cannot cross the
# env directory). packages/emr-cli and packages/tars-evals are standalone
# projects never copied into any image, so they are simply not matched — no
# exclude list, which would skip a step only when EVERY changed file matched it.
when:
  - event: pull_request
    branch:
      exclude: [development]
  - event: push
    branch: [master]
  - event: manual

steps:
  # Smoke-build devcontainer per arch on PRs, in parallel.
  # Woodpecker runs steps serially unless any step sets depends_on (DAG mode).
  # Empty depends_on: [] opts both validates into DAG with no deps so they start
  # together. One platform per plugin invocation on purpose: a single step
  # listing both platforms makes Kaniko build them sequentially under QEMU,
  # doubling PR feedback latency (~20 min). No push — build-only smoke test.
  # Astro/DinD stages sit after devcontainer in the Dockerfile so Kaniko
  # --target=devcontainer does not build DinD apt under QEMU.
  validate-devcontainer-amd64-pr:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/plugins/docker:test-5654ae1
    pull: true
    privileged: true
    depends_on: []
    settings:
      repo: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice
      dockerfile: .container/Dockerfile
      target: devcontainer
      platforms:
        - linux/amd64
      no_push: true
      github_token:
        from_secret: github_token
    when:
      event: pull_request
      path:
        include: &container_dep_paths
          - ".woodpecker/containers.yml"
          - ".container/Dockerfile"
          - ".container/dind/**"
          - ".devcontainer/**"
          - "pyproject.toml"
          - "uv.lock"
          - "packages/bietlejuice-*/pyproject.toml"
          - "packages/bietlejuice-*/uv.lock"
          - "packages/bietlejuice-runtime/envs/**"
          - "packages/bietlejuice-runtime/hatch_build.py"

  validate-devcontainer-arm64-pr:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/plugins/docker:test-5654ae1
    pull: true
    privileged: true
    depends_on: []
    settings:
      repo: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice
      dockerfile: .container/Dockerfile
      target: devcontainer
      platforms:
        - linux/arm64
      no_push: true
      github_token:
        from_secret: github_token
    when:
      event: pull_request
      path:
        include: *container_dep_paths

  publish-ci-base-prod:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/plugins/docker:test-5654ae1
    pull: true
    privileged: true
    settings:
      repo: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice
      dockerfile: .container/Dockerfile
      target: ci-base
      tag:
        - prod-ci-base-latest
        - prod-ci-base-${CI_COMMIT_SHA:0:7}
      platforms:
        - linux/amd64
      github_token:
        from_secret: github_token
    when:
      - path:
          include: *container_dep_paths
        branch: [master]
        event: push
      - branch: [master]
        event: manual

  publish-ci-jdk-prod:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/plugins/docker:test-5654ae1
    pull: true
    privileged: true
    settings:
      repo: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice
      dockerfile: .container/Dockerfile
      target: ci-jdk
      tag:
        - prod-ci-jdk-latest
        - prod-ci-jdk-${CI_COMMIT_SHA:0:7}
      platforms:
        - linux/amd64
      github_token:
        from_secret: github_token
    when:
      - path:
          include: *container_dep_paths
        branch: [master]
        event: push
      - branch: [master]
        event: manual

  # amd64 only — used by Woodpecker CI (development.yml), not local/devcontainer.
  publish-ci-astro-prod:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/plugins/docker:test-5654ae1
    pull: true
    privileged: true
    settings:
      repo: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice
      dockerfile: .container/Dockerfile
      target: ci-astro
      tag:
        - prod-ci-astro-latest
        - prod-ci-astro-${CI_COMMIT_SHA:0:7}
      platforms:
        - linux/amd64
      github_token:
        from_secret: github_token
    when:
      - path:
          include: *container_dep_paths
        branch: [master]
        event: push
      - branch: [master]
        event: manual

  # amd64 only — ci-astro + Docker-in-Docker, staged after devcontainer in the
  # Dockerfile so the PR validate steps' --target=devcontainer never build this
  # under QEMU. Consumed by development.yml deploy-astro-image and release.yml
  # deploy-astro-image-{prod,forno} via prod-ci-astro-dind-latest.
  publish-ci-astro-dind-prod:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/plugins/docker:test-5654ae1
    pull: true
    privileged: true
    settings:
      repo: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice
      dockerfile: .container/Dockerfile
      target: ci-astro-dind
      tag:
        - prod-ci-astro-dind-latest
        - prod-ci-astro-dind-${CI_COMMIT_SHA:0:7}
      platforms:
        - linux/amd64
      github_token:
        from_secret: github_token
    when:
      - path:
          include: *container_dep_paths
        branch: [master]
        event: push
      - branch: [master]
        event: manual

  publish-devcontainer-prod:
    image: 796143582747.dkr.ecr.us-east-1.amazonaws.com/plugins/docker:test-5654ae1
    pull: true
    privileged: true
    settings:
      dockerfile: .container/Dockerfile
      target: devcontainer
      repo: 796143582747.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice
      tag:
        - prod-devcontainer-latest
        - prod-devcontainer-${CI_COMMIT_SHA:0:7}
      platforms:
        - linux/arm64
      github_token:
        from_secret: github_token
    when:
      - path:
          include: *container_dep_paths
        branch: [master]
        event: push
      - branch: [master]
        event: manual
