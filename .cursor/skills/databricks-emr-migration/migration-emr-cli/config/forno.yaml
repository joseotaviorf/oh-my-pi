# EMR submit settings.

region: us-east-1
release_label: emr-7.12.0
subnet_id: subnet-0b0dd4939e90dab1a
job_flow_role: emr-forno
service_role: arn:aws:iam::713278628093:role/EMR_DefaultRole_V2
poll_sec: 15.0
action_on_failure: TERMINATE_CLUSTER
deploy_mode: cluster
dump_logs_base_uri: s3://artifacts.s3.forno.data.quintoandar.com.br/emr/logs/
log_uri: s3://artifacts.s3.forno.data.quintoandar.com.br/emr/logs/cli/
staging_uri: s3://artifacts.s3.forno.data.quintoandar.com.br/emr/staging/cli/
visible_to_all_users: true
idle_timeout_sec: 600

# Same ``emr_applications`` as ``emr_cluster_base`` in ``bietlejuice/forno_conf.yml``:
# Hadoop (YARN/HDFS), Hive (metastore SQL), JupyterEnterpriseGateway, Livy (REST),
# Spark — plus configurations below for Glue + Delta/Iceberg.
applications:
  - Hadoop
  - Hive
  - Spark

# Subset of ``emr_configurations`` from ``forno_conf.yml``: Delta/Iceberg toggles + Glue metastore client.
# Does not include ``yarn-env`` (Databricks/UC secrets) — full parity uses Airflow + ``scripts/emr_init_script.sh``.
configurations:
  - Classification: iceberg-defaults
    Properties:
      iceberg.enabled: "true"
  - Classification: delta-defaults
    Properties:
      delta.enabled: "true"
  - Classification: spark-hive-site
    Properties:
      hive.metastore.client.factory.class:
        "com.amazonaws.glue.catalog.metastore.AWSG\
        lueDataCatalogHiveClientFactory"
  - Classification: yarn-site
    Properties:
      yarn.resourcemanager.scheduler.enable-preemption: "true"
      yarn.scheduler.capacity.maximum-am-resource-percent: "0.2"
      yarn.scheduler.capacity.resource-calculator: org.apache.hadoop.yarn.util.resource.DominantResourceCalculator
      yarn.nodemanager.vmem-check-enabled: "false"
      yarn.nodemanager.pmem-check-enabled: "false"
  - Classification: capacity-scheduler
    Properties:
      yarn.scheduler.capacity.root.queues: "default"
      yarn.scheduler.capacity.root.default.capacity: "100"
      yarn.scheduler.capacity.root.default.maximum-capacity: "100"
      yarn.scheduler.capacity.root.default.ordering-policy: fair
      yarn.scheduler.capacity.root.default.maximum-am-resource-percent: "0.2"
      yarn.scheduler.capacity.maximum-am-resource-percent: "0.2"
      yarn.scheduler.capacity.maximum-applications: "2000"
      yarn.scheduler.capacity.minimum-user-limit-percent: "10"
  - Classification: spark-defaults
    Properties:
      spark.dynamicAllocation.enabled: "true"
      spark.shuffle.service.enabled: "true"
      spark.dynamicAllocation.minExecutors: "1"
      spark.dynamicAllocation.maxExecutors: "6"
      spark.executor.memory: 3g
      spark.executor.cores: "2"
      spark.executor.memoryOverhead: 1g
      spark.driver.memory: 2g
      spark.driver.memoryOverhead: 1g
      spark.yarn.am.memory: 2g
      spark.yarn.am.cores: "1"

# Overridable per run (CLI args).
master_instance_type: m5.xlarge
core_instance_type: m5.xlarge
core_instance_count: 2
use_spot: true
