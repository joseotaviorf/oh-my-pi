version: '3.7'

services:
  postgres_airflow:
    image: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - /home/PostgreSQL:/var/lib/postgresql/data
    networks:
      - airflow_postgres

  airflow_python2:
    build:
      context: .
      dockerfile: dockerfile/airflow-py2.Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - /home/<USER>/.aws:/root/.aws
      - /home/<USER>/<BIETLEJUICE_FOLDER>:/bi-etl-ejuice
    depends_on:
      - postgres_airflow
    networks:
      - airflow_postgres

networks:
  airflow_postgres:
    driver: bridge
