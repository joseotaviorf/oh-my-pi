# QuintoAndar Spark defaults for SageMaker Unified Studio notebooks.
#
# Appended to /usr/lib/spark/conf/spark-defaults.conf by Dockerfile.emr-serverless.
#
# READ THIS BEFORE ADDING A KEY HERE
#   EMR Serverless generates its own spark-defaults.conf when it launches a
#   worker, and AWS does not document a guarantee that values baked into the
#   image survive that. Treat this file as defence in depth, NOT as the primary
#   mechanism. The authoritative place for these values is the application's
#   runtimeConfiguration — see application-runtime-configuration.json in this
#   directory, which is the documented, supported path.
#
#   Keep the two files in sync. If they ever disagree, the application config
#   wins and this file is the one that is wrong.
#
# Users can still override any of these per-notebook with %%configure, because
# job-level configuration takes precedence over both of the above.

# Timestamps are stored and compared in UTC across the lake. Without this, a
# notebook picks up the worker's local timezone and every timestamp comparison
# silently disagrees with what the ETL job produced — the worst class of bug,
# because nothing errors. Matches the test fixtures in
# packages/bietlejuice-runtime/test/**/conftest.py.
spark.sql.session.timeZone UTC
