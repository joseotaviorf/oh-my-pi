cluster:
  type: emr_7_12_consolidation_xl_memory_fleet_cluster
  custom_configurations:
    spark_conf:
      spark.sql.broadcastTimeout: '600'
      spark.sql.shuffle.partitions: '400'
    core_nodes:
      target_on_demand: 2
      target_spot: 0
      instance_types:
      - r6g.8xlarge
      - r7g.8xlarge
      - r6i.8xlarge
    task_nodes:
      instance_types:
      - r6g.8xlarge
      - r7g.8xlarge
      - r6i.8xlarge
      target_on_demand: 0
      target_spot: 2
      allocation_strategy: price-capacity-optimized
      bid_price_percentage: 100
    aws_attributes:
      ebs_volume_size: 200
