---
database_name: datalake_supply_staging
table_name: supply_costs_allocation_lead
description: |
  Allocates paid media costs to supply leads by proportionally distributing campaign spend
  across city groups and planning clusters based on each lead's share of total lead volume
  for a given date and campaign. Produced by joining media platform cost data with supply
  funnel events, this table enables the Growth Supply team to attribute marketing investment
  to acquisition channels and measure cost-per-lead at a granular campaign and geography level.
domain: Growth
owner: fabio.soeiro@quintoandar.com.br
columns:
  date:
    description: Calendar date to which the allocated media costs and associated supply leads are attributed, used for daily-level cost attribution reporting.
    lineage:
      - dw_growth.fact_media_platform_metrics (via dim_date)
      - dw_growth.obt_supply.date
  city_group:
    description: A grouping of city or clusters of cities and neighborhoods.
    lineage:
      - dw_public.dim_region.city_group
      - dw_growth.obt_supply.city_group
  naming_convention_sufix:
    description: Acronym generated from the values of the taxonomy levels, used as input in the campaigns UTM parameters.
    lineage:
      - dw_growth.dim_media_setup.naming_convention_sufix
  company_report_origin:
    description: Acquisition channel for Inside Sales and FSS operations, or conversion source for other operations such as CIQ, Rede, and PP Multi, indicating where the supply lead originated.
    lineage:
      - dw_growth.obt_supply.company_report_origin
  planning_cluster:
    description: Marketing channel cluster assigned to the lead for planning and cost allocation (e.g. affiliates, Owner PWA, Price Calculator).
    lineage:
      - dw_growth.obt_supply.planning_cluster
  nm_campaign:
    description: Name of the marketing campaign associated with the lead.
    lineage:
      - dw_growth.fact_media_platform_metrics.utm_campaign
      - dw_growth.obt_supply.nm_campaign
  id_campaign:
    description: The key for the campaign, representing the unique identifier for each media campaign.
    lineage:
      - dw_growth.fact_media_platform_metrics.sk_campaign
  campaign_strategy_intent:
    description: Intention of the actions/campaigns adopted in relation to the growth strategy.
    lineage:
      - dw_growth.dim_media_setup.campaign_strategy_intent
  campaign_landing_page:
    description: Landing page/domain of QuintoAndar to which the campaign directs.
    lineage:
      - dw_growth.dim_media_setup.campaign_landing_page
  campaign_business_context:
    description: Intention of the actions/campaigns adopted in relation to the business context.
    lineage:
      - dw_growth.dim_media_setup.campaign_business_context
  source:
    description: QuintoAndar s external platform/operation responsible for generating the result.
    lineage:
      - dw_growth.dim_media_setup.source
  medium:
    description: Combination of platform intent, media package, branded and recovery audience status dimensions. Where the average package size is mandatory and the others are applied when convenient.
    lineage:
      - dw_growth.dim_media_setup.medium
  funnel_side:
    description: Side of the funnel to which that campaign was directed.
    lineage:
      - dw_growth.dim_media_setup.funnel_side
  behavior_type:
    description: Type of user behavior in relation to their search decision and entry into the QuintoAndar environment.
    lineage:
      - dw_growth.dim_media_setup.behavior_type
  shared_cost:
    description: Cost allocated to leads proportionally by lead share within date and campaign.
