---
database_name: datalake_supply_staging
table_name: supply_unique_rules
description: |
  Identifies the single canonical supply record per physical property and business context (rent
  or sale) by applying a deduplication ranking based on the furthest funnel stage reached,
  recency, and conversion type. Each row is assigned a uniqueness flag so that downstream
  metrics count each property only once when measuring unique supply funnel volumes. Used by
  the Growth Supply team to avoid double-counting properties that have multiple associated leads.
domain: Growth
owner: fabio.soeiro@quintoandar.com.br
columns:
  sk_supply:
    description: Surrogate key for the supply related to the lead.
    lineage:
      - dw_growth.obt_supply.sk_supply
  nm_business_context:
    description: Describes the business context of the lead, indicating if this lead is for rent or for sale.
    lineage:
      - dw_growth.obt_supply.nm_business_context
  fl_unique:
    description: Flag indicating the record was selected as the unique representative (value 'Unique') for the house and business context.
