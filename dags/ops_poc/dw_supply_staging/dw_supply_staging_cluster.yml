cluster:
  type: emr_7_12_consolidation_m_memory_fleet_cluster
  custom_configurations:
    core_nodes:
      target_on_demand: 4
      target_spot: 0
    spark_conf:
      spark.sql.broadcastTimeout: '600'
      # Avoid AQE coalescing skewed joins/aggs into a handful of 256MiB partitions.
      spark.sql.adaptive.advisoryPartitionSizeInBytes: '64m'
      spark.sql.adaptive.coalescePartitions.minPartitionSize: '16m'
