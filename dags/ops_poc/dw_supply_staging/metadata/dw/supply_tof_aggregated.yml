---
  database_name: dw_supply_staging
  table_name: supply_tof_aggregated
  owner: fabio.soeiro@quintoandar.com.br
  domain: Growth
  description: |
    Table that consolidates supply top-of-funnel (TOF) metrics for planning and reporting.
    Unions actual funnel volumes from obt_supply, budget and OKR targets from supply staging, unique
    targets, marketing cost targets, allocated lead costs, and prior-year actuals; enriches with
    campaign names, dim_date calendar attributes, and week/month/year-to-date flags versus the latest
    obt_supply date.
  columns:
    aux_reference:
      description:
        Row source label distinguishing each union branch (e.g. actual volumes, budget, OKR, unique
        targets, cost targets, allocated costs, or last-year actuals reshaped to the current year).
    date:
      description: Calendar date for the metric row; aligned to event or target date depending on the row source.
      lineage:
        - dw_growth.obt_supply.date
        - dw_public.dim_date.date
    acquisition_origin:
      description: Describes the origin of lead acquisition in the supply user path.
      lineage:
        - dw_growth.obt_supply.acquisition_origin
    business_context:
      description: Business context of the row (RENT or SALE), equivalent to nm_business_context on obt_supply actual rows.
      lineage:
        - dw_growth.obt_supply.nm_business_context
        - datalake_supply_staging.supply_targets.business_context
    supply_source:
      description:
        High-level supply channel grouping (1P, 3P, CIQ) derived from planning_operation for target rows;
        from obt_supply for actual rows.
      lineage:
        - dw_growth.obt_supply.nm_supply_source
        - datalake_supply_staging.supply_targets.planning_operation
    company_report_origin:
      description: Indicates the origin within the company that the report targets.
      lineage:
        - dw_growth.obt_supply.company_report_origin
        - datalake_supply_staging.supply_targets.company_report_origin
    planning_operation:
      description: Identifies the conversion operation type for budget and OKR target rows.
      lineage:
        - dw_growth.obt_supply.planning_operation
        - datalake_supply_staging.supply_targets.planning_operation
    planning_conversion:
      description: Detailed conversion operation type; distinguishes Inside Sales inbound, outbound, and expert flows.
      lineage:
        - dw_growth.obt_supply.planning_conversion
        - datalake_supply_staging.supply_targets.planning_conversion
    planning_cluster:
      description: Channel segmented by cluster (e.g. affiliates) and medium (e.g. Owner PWA, price calculator).
      lineage:
        - dw_growth.obt_supply.planning_cluster
        - datalake_supply_staging.supply_targets.planning_cluster
    behavior_type:
      description: Describes the behavior type of the lead, such as organic or non-organic.
      lineage:
        - dw_growth.obt_supply.behavior_type
        - dw_growth.dim_media_setup.behavior_type
    source:
      description: The originating source of the lead within the marketing campaign context.
      lineage:
        - dw_growth.obt_supply.source
        - dw_growth.dim_media_setup.source
    medium:
      description: The marketing medium used to generate the lead, such as PPC or affiliate marketing.
      lineage:
        - dw_growth.obt_supply.medium
        - dw_growth.dim_media_setup.medium
    nm_campaign:
      description:
        Marketing campaign name; for actual rows, coalesced with the latest name from campaign name
        history when available.
      lineage:
        - dw_growth.obt_supply.nm_campaign
        - datalake_growth_media_platform.campaign_name_history.campaign_name
    id_campaign:
      description: Unique identifier for the media campaign used to join taxonomy and cost allocation.
      lineage:
        - datalake_growth_media_platform.campaign_name_history.id_campaign
        - dw_supply_staging.supply_costs_allocation_prospect.id_campaign
    country_code:
      description: ISO country code where the lead or target applies.
      lineage:
        - dw_growth.obt_supply.country_code
        - dw_public.dim_region.country_code
    city_group:
      description: A grouping of cities or clusters of cities and neighborhoods.
      lineage:
        - dw_growth.obt_supply.city_group
        - dw_public.dim_region.city_group
    ds_discard_reason:
      description: Description of why the lead was discarded when applicable.
      lineage:
        - dw_growth.obt_supply.ds_discard_reason
        - dw_growth.dim_supply_discards.ds_discard_reason
    campaign_cluster:
      description: Campaign cluster label from the supply campaign cluster taxonomy (GSheets).
      lineage:
        - datalake_gsheets_clean.supply_campaign_cluster.campaign_cluster
    dt_creation_sf:
      description: Date the lead was created in Salesforce for Carteirizado outbound rows.
      lineage:
        - datalake_salesforce_growth_clean.lead.creation_date
    channel_sf:
      description: Salesforce channel field for the lead on the latest updated row.
      lineage:
        - datalake_salesforce_growth_clean.lead.channel
    is_carteirizacao:
      description:
        TRUE when the lead matches portfolio Carteirizacao rules (BR outbound, Wololo portfolio, with
        exclusions for specific conversion and affiliate users after 2025-09-01 for RENT).
      lineage:
        - dw_growth.obt_supply.sk_supply
    is_exec_carteirizacao:
      description:
        TRUE when the converting user is in the executive Carteirizacao allowlist and other outbound
        carteirizacao conditions hold, with the same RENT exclusions as is_carteirizacao.
      lineage:
        - dw_growth.obt_supply.sk_user_conversion
    is_3p_fr_test:
      description: TRUE for RENT leads in a defined date window with specific conversion users (3P FR test cohort).
      lineage:
        - dw_growth.obt_supply.sk_user_conversion
    is_click_to_wpp:
      description: TRUE when the lead matches click-to-WhatsApp routing (UTM patterns or QuintoAndar phone numbers).
      lineage:
        - dw_growth.obt_supply.quinto_andar_phone_number
    outbound_operation:
      description: Outbound operation label from Salesforce Carteirizado flow or default non-Carteirizado.
      lineage:
        - datalake_salesforce_growth_clean.lead.id_lead
    fl_unique:
      description:
        Unique-supply classification from supply_unique_rules, literal Unique for Unique-target rows,
        or Cross-listing when no rule matches.
      lineage:
        - datalake_supply_staging.supply_unique_rules.fl_unique
    act_leads:
      description: Count of distinct supply keys with funnel step lead on the calendar date and grain.
      lineage:
        - dw_growth.obt_supply.sk_supply
        - dw_growth.obt_supply.cd_funnel_step
    act_prospects:
      description: Count of distinct supply keys with funnel step prospect on the calendar date and grain.
      lineage:
        - dw_growth.obt_supply.sk_supply
        - dw_growth.obt_supply.cd_funnel_step
    act_qualifieds:
      description: Count of distinct supply keys with funnel step qualified on the calendar date and grain.
      lineage:
        - dw_growth.obt_supply.sk_supply
        - dw_growth.obt_supply.cd_funnel_step
    act_av_qualifieds:
      description: Count of distinct supply keys with funnel step av_qualified on the calendar date and grain.
      lineage:
        - dw_growth.obt_supply.sk_supply
        - dw_growth.obt_supply.cd_funnel_step
    act_opportunities:
      description: Count of distinct supply keys with funnel step opportunity on the calendar date and grain.
      lineage:
