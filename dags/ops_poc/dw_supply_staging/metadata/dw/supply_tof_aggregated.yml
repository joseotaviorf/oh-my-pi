        - dw_growth.obt_supply.cd_funnel_step
    bup_prospects:
      description: Sum of budget (QTS) prospect targets for the current year at the planning grain.
      lineage:
        - datalake_supply_staging.supply_targets.prospects
    bup_qualifieds:
      description: Sum of budget qualified targets from QTS supply_targets for the current year.
      lineage:
        - datalake_supply_staging.supply_targets.qualifieds
    bup_opportunities:
      description: Sum of budget opportunity targets from QTS supply_targets for the current year.
      lineage:
        - datalake_supply_staging.supply_targets.opportunities
    bup_first_listings:
      description: Sum of budget first-listing targets from QTS supply_targets for the current year.
      lineage:
        - datalake_supply_staging.supply_targets.first_listings
    okr_prospects:
      description: Sum of OKR prospect targets from supply_targets for the current year.
      lineage:
        - datalake_supply_staging.supply_targets.prospects
    okr_qualifieds:
      description: Sum of OKR qualified targets from supply_targets for the current year.
      lineage:
        - datalake_supply_staging.supply_targets.qualifieds
    okr_opportunities:
      description: Sum of OKR opportunity targets from supply_targets for the current year.
      lineage:
        - datalake_supply_staging.supply_targets.opportunities
    okr_first_listings:
      description: Sum of OKR first-listing targets from supply_targets for the current year.
      lineage:
        - datalake_supply_staging.supply_targets.first_listings
    qts_prospects_unique:
      description: Sum of unique-supply prospect volumes from supply_unique_targets.
      lineage:
        - datalake_supply_staging.supply_unique_targets.volumes_prospects_unique
    qts_qualifieds_unique:
      description: Sum of unique-supply qualified volumes from supply_unique_targets.
      lineage:
        - datalake_supply_staging.supply_unique_targets.volumes_qualifieds_unique
    qts_opportunities_unique:
      description: Sum of unique-supply opportunity volumes from supply_unique_targets.
      lineage:
        - datalake_supply_staging.supply_unique_targets.volumes_opportunities_unique
    qts_first_listings_unique:
      description: Sum of unique-supply first-listing volumes from supply_unique_targets.
      lineage:
        - datalake_supply_staging.supply_unique_targets.volumes_first_listings_unique
    tgt_cost:
      description:
        Target marketing cost per source from daily_target_supply_sale or daily_target_supply_rental
        GSheets clean tables (summed at the row grain).
      lineage:
        - datalake_gsheets_clean.daily_target_supply_sale.cost_per_source
        - datalake_gsheets_clean.daily_target_supply_rental.cost_per_source
    mkt_cost:
      description:
        Allocated shared media cost per lead from supply_costs_allocation_prospect, with a 2026 uplift
        factor applied to Facebook source rows from 2026-01-01 onward.
      lineage:
        - dw_supply_staging.supply_costs_allocation_prospect.shared_cost
    month_start:
      description: First calendar day of the month for the row date, from dim_date.
      lineage:
        - dw_public.dim_date.month_start
    week_start:
      description: Start of the week for the row date, from dim_date.
      lineage:
        - dw_public.dim_date.week_start
    year:
      description: Calendar year of the row date from dim_date.
      lineage:
        - dw_public.dim_date.year
    max_date:
      description: Latest event date present in dw_growth.obt_supply; anchor for partial period flags.
      lineage:
        - dw_growth.obt_supply.date
    WTD:
      description:
        TRUE when the row date is before the weekday of max_date within the same week, used to flag
        week-to-date comparable periods.
      lineage:
        - dw_public.dim_date.date
    MTD:
      description: TRUE when the day-of-month of the row date is at or before the day-of-month of max_date.
      lineage:
        - dw_public.dim_date.date
    YTD:
      description:
        TRUE when the row date is in the same year as max_date and not after max_date in month-day order,
        for year-to-date style filters.
      lineage:
        - dw_public.dim_date.date
    MTD_CurrentMonth:
      description: TRUE when the row date falls in max_date month from month start through max_date day.
      lineage:
        - dw_public.dim_date.date
    YTD_CurrentYear:
      description: TRUE when the row date is between the start of max_date year and max_date inclusive.
      lineage:
        - dw_public.dim_date.date
    ts_load:
      description: Timestamp when the row was materialized by the pipeline (load time).
  