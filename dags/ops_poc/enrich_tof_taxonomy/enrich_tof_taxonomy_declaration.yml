dag:
  name: enrich_tof_taxonomy
  schedule_start_date: 2026, 1, 26
  owner: Ops POC
  documentation:
    dag_purpose: |
      This DAG enrich provides Top of Funnel events from the past year with taxonomy data from Amplitude.
      It joins the event data with user merge data to associate events with the correct taxonomy classifications.
workflow:
  type: query_delta
  layer: enrich
  default_extraction_type: full
  short_circuit_customization:
    function: CHECK_IS_SPECIFIC_WEEKDAY
    function_params:
      weekday: 6
  spark_session_configs:
    udfs: [SF_NORMALIZE_STRING]
  inner_dependencies:
    tof_events_with_taxonomy:
      - amplitude_user_merge
  tables_customization:
    amplitude_user_merge: {}
    tof_events_with_taxonomy:
      partitions: [funnel_side]

cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: r5d.2xlarge
    node_type_id: r5d.4xlarge
    runtime_engine: PHOTON
    num_workers: 5
    spark_version: 16.4.x-scala2.12
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
  databricks_conn_id: databricks_new_env
