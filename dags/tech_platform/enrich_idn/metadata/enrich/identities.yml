database_name: datalake_idn
table_name: identities
domain: Tech Platform
owner: danilo.barbosa@quintoandar.com.br
description: |
  Current-state SailPoint IdentityNow identities — latest ingest partition within the Airflow batch window and one
  row per identity. Derived from clean by keeping MAX(year, month, day) in scope and deduplicating with QUALIFY.
columns:
  id_identity:
    description: Unique identity identifier in SailPoint IdentityNow.
    lineage:
      - datalake_idn_clean.identities.id_identity
  nm_identity:
    description: Technical or login-oriented identity name in IdentityNow.
    lineage:
      - datalake_idn_clean.identities.nm_identity
  nm_display:
    description: Human-readable display name for the identity.
    lineage:
      - datalake_idn_clean.identities.nm_display
  ds_work_email:
    description: Primary work email associated with the identity.
    lineage:
      - datalake_idn_clean.identities.ds_work_email
  ds_lifecycle_state:
    description: Lifecycle state label for the identity in IdentityNow.
    lineage:
      - datalake_idn_clean.identities.ds_lifecycle_state
  ds_identity_status:
    description: Platform-reported identity status (e.g. active states).
    lineage:
      - datalake_idn_clean.identities.ds_identity_status
  ds_employee_number:
    description: Employee or workforce identifier merged from attributes when present.
    lineage:
      - datalake_idn_clean.identities.ds_employee_number
  ds_cost_center:
    description: Cost center code from identity attributes when available.
    lineage:
      - datalake_idn_clean.identities.ds_cost_center
  ds_last_login_sso:
    description: Last SSO login indicator as provided by source attributes (string form).
    lineage:
      - datalake_idn_clean.identities.ds_last_login_sso
  nm_manager:
    description: Manager name resolved from manager reference or attributes.
    lineage:
      - datalake_idn_clean.identities.nm_manager
  nm_department:
    description: Department name from identity attributes.
    lineage:
      - datalake_idn_clean.identities.nm_department
  ds_worker_type:
    description: Worker or employment type from attributes.
    lineage:
      - datalake_idn_clean.identities.ds_worker_type
  nm_company:
    description: Company name from identity attributes.
    lineage:
      - datalake_idn_clean.identities.nm_company
  nm_job:
    description: Job title or role name from attributes.
    lineage:
      - datalake_idn_clean.identities.nm_job
  ds_location:
    description: Location string from identity attributes.
    lineage:
      - datalake_idn_clean.identities.ds_location
  dt_start:
    description: Parsed employment or identity start date when provided by source.
    lineage:
      - datalake_idn_clean.identities.dt_start
  dt_end:
    description: Parsed employment or identity end date when provided by source.
    lineage:
      - datalake_idn_clean.identities.dt_end
  ts_created:
    description: Source creation timestamp for the identity record when available.
    lineage:
      - datalake_idn_clean.identities.ts_created
  ts_modified:
    description: Source last-modified timestamp for the identity record when available.
    lineage:
      - datalake_idn_clean.identities.ts_modified
  js_raw_attributes:
    description: JSON string of raw IdentityNow attributes for lineage and debugging.
    lineage:
      - datalake_idn_clean.identities.js_raw_attributes
  year:
    description: Year of the latest ingest partition retained for this row.
    lineage:
      - datalake_idn_clean.identities.year
  month:
    description: Month of the latest ingest partition retained for this row.
    lineage:
      - datalake_idn_clean.identities.month
  day:
    description: Day of the latest ingest partition retained for this row.
    lineage:
      - datalake_idn_clean.identities.day
