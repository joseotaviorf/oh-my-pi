dag:
  name: okta
  schedule_start_date: 2026, 7, 24
  schedule_interval: 0 1 * * *
  owner: Tech Platform Cyber Security
  documentation:
    dag_purpose: |
      Loads and cleans Okta System Log events from the audit-logs S3 bucket into the
      datalake clean layer. Source data is delivered as GZIP NDJSON via EventBridge partner
      integration and Kinesis Data Firehose.

workflow:
  layer: clean
  type: query_delta
  bucket_config_name: auditlogs_bucket
  custom_schema: okta_audit_logs
  spark_job_arguments:
    - "{dag_name}"
    - "{environment}"
    - "{bucket}"
    - "{schema}"
    - "{{ ts }}"
    - "{table_name}"
    - "{partitions}"
  default_extraction_type: incremental
  default_partitions: [year, month, day]
  has_hive_sync: true
  tables_customization:
    system_logs:
      load_spark_job: system_logs_load
      merge_on: [year, month, day, id_event]
  default_table_privileges:
    auditlogs: ["ALL PRIVILEGES"]
