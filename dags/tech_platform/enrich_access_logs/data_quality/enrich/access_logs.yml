---
table_name: datalake_access_logs.access_logs
alert_channel: AUTHX_ALERTS
# Wall-clock caveat (as in the clean opa/istio checks): the framework does not
# template the run's data interval into a constraint, so the check below is anchored
# on CURRENT_DATE() rather than on the interval the run is processing. The DAG runs
# at 02:00 UTC for the previous day, so CURRENT_DATE() - 1 day is the date the run
# just loaded, with ~22h of margin before the anchor slides to the next day. A rerun
# of an old interval, or a run delayed past midnight UTC, therefore reports on the
# current calendar day and not on the interval that reported it.
#
# `is_incremental` is deliberately NOT used here. It would scope the frame handed to
# Deequ, but `DataQualityTestsPipeline._read_table` filters on
# `to_timestamp(CAST(<column> AS STRING), <mask>)`, which for the TIMESTAMP column
# `ts_decision` only parses under `spark.sql.legacy.timeParserPolicy=LEGACY` and
# prunes no partitions. Worse, an empty slice short-circuits `run()` into the generic
# "dataframe is empty" message before any validation executes, so the assertion below
# would never actually run in the one case it exists to catch. Expressing the
# freshness rule as a partition-filtered constraint keeps it inside the validation
# suite (so `severity_level` applies), prunes partitions, and drops the dependency on
# the legacy date parser.
table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error
column_level_validations:
  settled_day_volume_present:
    custom:
      # Freshness/volume-loss guard: the date this run loaded (CURRENT_DATE() - 1 day,
      # the `{load_end_date}` of the enrich query) must have at least one record. An
      # empty partition means either the enrich join produced nothing or one of the
      # clean access-log sources stopped, both of which lose audit data silently.
      constraint: |-
        (
          SELECT COUNT(*)
          FROM datalake_access_logs.access_logs
          WHERE MAKE_DATE(year, month, day) = CURRENT_DATE() - INTERVAL 1 DAY
        ) > 0
      severity_level: Error
