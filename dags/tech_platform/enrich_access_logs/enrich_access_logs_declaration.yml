dag:
  name: enrich_access_logs
  schedule_start_date: 2024, 10, 24
  schedule_interval: 0 2 * * *
  owner: Tech Platform Cyber Security
  documentation:
    dag_purpose: |
      This dag joins relevant fields of access logs
workflow:
  type: query_delta
  layer: enrich
  default_extraction_type: incremental
  execution_timeout_hours: 4
  default_partitions: [year, month, day]
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, -1), 'load_start_date') }}"
  tables_customization:
    access_logs: {}
  default_table_privileges:
    auditlogs: ["ALL PRIVILEGES"]
cluster:
  type: consolidation_m_general_cluster
  custom_configurations:
    spark_conf:
      spark.sql.legacy.json.allowEmptyString.enabled: "true"
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
  access_control_list:
    group_name: auditlogs
    permission_level: CAN_MANAGE
  databricks_conn_id: databricks_new_env
