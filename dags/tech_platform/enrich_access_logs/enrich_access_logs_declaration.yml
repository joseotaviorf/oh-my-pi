dag:
  name: enrich_access_logs
  schedule_start_date: 2024, 10, 24
  schedule_interval: 0 2 * * *
  owner: Tech Platform Cyber Security
  documentation:
    dag_purpose: |
      This dag joins relevant fields of access logs
workflow:
  type: query_delta
  layer: enrich
  default_extraction_type: incremental
  default_partitions: [year, month, day]
  extra_query_template_params:  
    load_start_date: "{{ get_date_param(dag_run, macros.ds_add(ds, -1), 'load_start_date') }}"
  tables_customization:
    access_logs:
      merge_on: [year, month, day, id_trace]
      when_matched_update_condition: target.ts_event IS NULL OR source.ts_event IS NOT NULL
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: m5a.2xlarge
    node_type_id: m5a.2xlarge
    num_workers: 2
    spark_version: 12.2.x-scala2.12
    spark_conf:
      spark.sql.legacy.json.allowEmptyString.enabled: "true"
  access_control_list:
    group_name: software-engineers
    permission_level: CAN_MANAGE
