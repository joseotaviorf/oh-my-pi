database_name: datalake_access_logs
table_name: access_logs
domain: Tech Platform
owner: luciane.lopes@quintoandar.com.br
description: |
  Unified access observability row joining OPA authorization decisions with Istio Envoy request telemetry.
  One row per evaluated HTTP request with trace correlation, principals, and partition keys for security analytics.
columns:
  id_decision:
    lineage:
      - datalake_access_logs_clean.opa.id_decision
    description: Unique identifier of the OPA authorization decision event for correlation with policy logs.
  id_trace:
    lineage:
      - datalake_access_logs_clean.opa.id_trace
    description: Trace identifier extracted from the traceparent header for correlation across OPA and Istio logs.
  ts_decision:
    lineage:
      - datalake_access_logs_clean.opa.ts_event
    description: UTC timestamp when OPA recorded the authorization decision for the HTTP request.
  ts_mesh_request:
    lineage:
      - datalake_access_logs_clean.istio.ts_event
    description: UTC timestamp when the Istio sidecar started processing the HTTP request in the mesh.
  request_traceparent:
    lineage:
      - datalake_access_logs_clean.istio.request_traceparent
    description: W3C traceparent header value propagated across the mesh for distributed tracing.
  request_x_forwarded_for:
    lineage:
      - datalake_access_logs_clean.istio.request_x_forwarded_for
    description: Comma-separated client IP chain from the X-Forwarded-For header as seen by the Istio sidecar.
  request_real_ip:
    lineage:
      - datalake_access_logs_clean.opa.request_real_ip
    description: Client IP address inferred by OPA after proxy headers are evaluated.
  request_method:
    lineage:
      - datalake_access_logs_clean.opa.request_method
    description: HTTP verb (GET, POST, etc.) of the inbound request evaluated by OPA.
  request_user_agent:
    lineage:
      - datalake_access_logs_clean.istio.request_user_agent
    description: User-Agent header sent by the client, captured from Istio access logs.
  request_path:
    lineage:
      - datalake_access_logs_clean.opa.request_path
    description: Raw URL path of the HTTP request before parameter templating.
  request_duration_ms:
    lineage:
      - datalake_access_logs_clean.istio.request_duration_ms
    description: End-to-end request duration in milliseconds measured by the Istio sidecar.
  response_flags:
    lineage:
      - datalake_access_logs_clean.istio.response_flags
    description: Envoy response flags indicating upstream or client anomalies for the request.
  response_code:
    lineage:
       - datalake_access_logs_clean.istio.response_code
    description: HTTP status code returned to the client for the evaluated request.
  request_source_principal:
    lineage:
      - datalake_access_logs_clean.opa.request_source_principal
    description: SPIFFE or service identity of the caller initiating the request in the mesh.
  request_destination_principal:
    lineage:
      - datalake_access_logs_clean.opa.request_destination_principal
    description: SPIFFE or service identity of the upstream workload receiving the request.
  request_parameterized_path:
    lineage:
      - datalake_access_logs_clean.opa.request_parameterized_path
    description: URL path template with route parameters normalized for RBAC policy matching in OPA.
  request_required_roles:
    lineage:
      - datalake_access_logs_clean.opa.request_required_roles
    description: JSON array of RBAC roles OPA evaluated as required for the request path.
  result_http_allowed:
    lineage:
      - datalake_access_logs_clean.opa.result_http_allowed
    description: Boolean outcome indicating whether OPA allowed the HTTP request to proceed.
  result_decision:
    lineage:
      - datalake_access_logs_clean.opa.result_decision
    description: OPA policy decision boolean when present in the authorizer result payload.
  result_decision_reasons:
    lineage:
      - datalake_access_logs_clean.opa.result_decision_reasons
    description: Array of human-readable denial or error reason codes from OPA evaluation context.
  result_http_status:
    lineage:
      - datalake_access_logs_clean.opa.result_http_status
    description: HTTP status code returned by the authorizer when the request is denied or fails policy checks.
  principal_user_email:
    lineage:
      - datalake_access_logs_clean.istio.principal_user_email
    description: End-user email extracted from the authenticated principal when present.
  id_main_principal_user:
    lineage:
      - datalake_access_logs_clean.istio.id_principal_user
    description: Primary internal identifier for the authenticated human principal on the request.
  uuid_person_principal_user:
    lineage:
      - datalake_access_logs_clean.istio.uuid_person_principal_user
    description: Person UUID linked to the authenticated user principal in identity systems.
  principal_identities_json:
    lineage:
      - datalake_access_logs_clean.istio.principal_identities_json
    description: JSON map of linked external identities keyed by provider, parsed from the JWT user payload.
  principal_user_idp:
    lineage:
      - datalake_access_logs_clean.opa.principal_user_idp
    description: Identity provider slug that issued the user credential for this request.
  principal_service:
    lineage:
      - datalake_access_logs_clean.istio.principal_service
    description: Service account or workload name acting as the authenticated principal.
  principal_user_provided_roles:
    lineage:
      - datalake_access_logs_clean.opa.principal_user_provided_roles
    description: JSON array of RBAC roles supplied by the authenticated user principal during OPA evaluation.
  principal_user_issuer:
    lineage:
      - datalake_access_logs_clean.istio.principal_user_issuer
    description: Token issuer URL or realm that minted the user credential for the request.
  id_principal_user_impersonated_by:
    lineage:
      - datalake_access_logs_clean.istio.id_principal_user_impersonated_by
    description: Internal identifier of the admin or service account that impersonated the end user on the request.
  principal_service_provided_roles:
    lineage:
       - datalake_access_logs_clean.opa.principal_service_provided_roles
    description: JSON array of RBAC roles supplied by the calling service principal during OPA evaluation.
  app:
    lineage:
      - datalake_access_logs_clean.opa.app
    description: Application label of the Kubernetes workload associated with the evaluated request.
  pod_name:
    lineage:
      - datalake_access_logs_clean.istio.pod_name
    description: Kubernetes pod name of the workload proxy that handled the inbound HTTP request.
  year:
    lineage:
      - datalake_access_logs_clean.opa.year
    description: Partition year of the event timestamp
  month:
    lineage:
      - datalake_access_logs_clean.opa.month
    description: Partition month of the event timestamp
  day:
    lineage:
      - datalake_access_logs_clean.opa.day
    description: Partition day of the event timestamp
  hour:
    lineage:
      - datalake_access_logs_clean.opa.hour
    description: Partition hour of the event timestamp
