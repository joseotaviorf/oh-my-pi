database_name: datalake_claude_usage_clean
table_name: members
owner: gabriel.berger@quintoandar.com.br
domain: Tech Platform
description: |
  Claude Enterprise organization members representing QuintoAndar workforce seats.
  One row per id after deduplication from overlapping admin snapshot loads.
  Flattens vendor JSON from the Admin Members endpoint into typed columns.
columns:
  id:
    description: Vendor Claude user identifier (user_...) for the organization member (e.g. 'user_011CReAqK5DGX6fqXqoBSpFn').
    lineage:
      - datalake_claude_usage_raw.members.payload

  email:
    description: Work email address of the organization member (e.g. 'jane.doe@quintoandar.com').
    lineage:
      - datalake_claude_usage_raw.members.payload

  name:
    description: Display name of the organization member (e.g. 'Jane Doe').
    lineage:
      - datalake_claude_usage_raw.members.payload

  role:
    description: Organization role assigned to the member (for example admin, billing, developer, claude_code_user).
    lineage:
      - datalake_claude_usage_raw.members.payload

  type_member:
    description: Vendor object type discriminator for the record; always user (e.g. 'user').
    lineage:
      - datalake_claude_usage_raw.members.payload

  ts_added:
    description: Timestamp when the member was added to the organization.
    lineage:
      - datalake_claude_usage_raw.members.payload

  ts_load:
    description: Timestamp when the Spark api_ingestion job wrote the source raw row.
    lineage:
      - datalake_claude_usage_raw.members.ts_load

  year:
    description: Ingestion partition year, derived from ts_load (job run time); this endpoint has no date_filter_column, so it is not derived from the API payload.
    lineage:
      - datalake_claude_usage_raw.members.year

  month:
    description: Ingestion partition month, derived from ts_load (job run time); this endpoint has no date_filter_column, so it is not derived from the API payload.
    lineage:
      - datalake_claude_usage_raw.members.month

  day:
    description: Ingestion partition day, derived from ts_load (job run time); this endpoint has no date_filter_column, so it is not derived from the API payload.
    lineage:
      - datalake_claude_usage_raw.members.day
