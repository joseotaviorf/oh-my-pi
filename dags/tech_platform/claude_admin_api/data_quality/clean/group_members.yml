---
table_name: datalake_claude_usage_clean.group_members
alert_channel: PEOPLE_ALERTS

table_level_validations:
  has_size:
    greater_than: 1
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: -10
    less_than_or_equal_to: 25
    severity_level: Error

column_level_validations:
  id_group:
    is_complete:
      severity_level: Warning

  id_user:
    is_complete:
      severity_level: Warning

  one_row_per_group_and_user:
    custom:
      # Grain uniqueness: exactly one row per id_group and id_user after deduplication.
      constraint: |-
        (SELECT COUNT(*)
         FROM (
           SELECT id_group, id_user
           FROM datalake_claude_usage_clean.group_members
           GROUP BY id_group, id_user
           HAVING COUNT(*) > 1
         )
        ) = 0
      severity_level: Error
