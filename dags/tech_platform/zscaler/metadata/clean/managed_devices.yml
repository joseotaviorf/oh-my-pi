database_name: datalake_zscaler_clean
table_name: managed_devices
domain: Tech Platform
owner: danilo.barbosa@quintoandar.com.br
description: |
  Clean endpoint inventory from Zscaler Client Connector with normalized identifiers and telemetry timestamps.
  One row per enrolled device per ingestion batch for corporate VPN posture and MDM cross-check analytics.

columns:
  id_device:
    description: UDID from Zscaler (trimmed), merge key device id alongside partition.
    lineage:
      - datalake_zscaler_raw.managed_devices.udid
  ds_mac_address:
    description: Media access control address reported by the Zscaler Client Connector agent on the endpoint.
    lineage:
      - datalake_zscaler_raw.managed_devices.macAddress
  nm_hostname:
    description: Machine hostname registered in Zscaler Client Connector for the managed endpoint.
    lineage:
      - datalake_zscaler_raw.managed_devices.machineHostname
  ds_user_email:
    description: Corporate email of the user last associated with the device in Zscaler Client Connector.
    lineage:
      - datalake_zscaler_raw.managed_devices.user
  nm_owner:
    description: Display name of the device owner or assigned user reported by Zscaler inventory.
    lineage:
      - datalake_zscaler_raw.managed_devices.owner
  nm_device_model:
    description: Hardware model description parsed from Zscaler device detail metadata.
    lineage:
      - datalake_zscaler_raw.managed_devices.detail
  nm_manufacturer:
    description: Hardware manufacturer name reported by Zscaler Client Connector device inventory.
    lineage:
      - datalake_zscaler_raw.managed_devices.manufacturer
  ds_os_version:
    description: Operating system name and version string reported by the Zscaler agent on the endpoint.
    lineage:
      - datalake_zscaler_raw.managed_devices.osVersion
  ds_agent_version:
    description: Zscaler agent version installed on the device.
    lineage:
      - datalake_zscaler_raw.managed_devices.agentVersion
  nm_policy:
    description: Zscaler policy name applied to the device.
    lineage:
      - datalake_zscaler_raw.managed_devices.policyName
  nm_company:
    description: Organization or company name registered for the device in Zscaler tenant configuration.
    lineage:
      - datalake_zscaler_raw.managed_devices.companyName
  ds_registration_state:
    description: Enrollment state of the device in Zscaler Client Connector, such as Registered or Unregistered.
    lineage:
      - datalake_zscaler_raw.managed_devices.registrationState
  cd_device_type:
    description: Zscaler device type classification code for the enrolled Client Connector endpoint.
    lineage:
      - datalake_zscaler_raw.managed_devices.type
  cd_device_state:
    description: Operational state code of the device in Zscaler Client Connector (online/offline/etc.).
    lineage:
      - datalake_zscaler_raw.managed_devices.state
  cd_vpn_state:
    description: VPN tunnel state code reported by Zscaler Client Connector for the device session.
    lineage:
      - datalake_zscaler_raw.managed_devices.vpnState
  ds_tunnel_version:
    description: Version of the Zscaler tunnel protocol negotiated by the Client Connector agent.
    lineage:
      - datalake_zscaler_raw.managed_devices.tunnelVersion
  ds_architecture:
    description: CPU architecture reported by the Zscaler agent, such as x64 or arm64.
    lineage:
      - datalake_zscaler_raw.managed_devices.zappArch
  ds_hardware_fingerprint:
    description: Stable hardware fingerprint hash generated by Zscaler to detect device re-enrollment.
    lineage:
      - datalake_zscaler_raw.managed_devices.hardwareFingerprint
  qt_download_count:
    description: Cumulative count of Zscaler policy configuration downloads for the device.
    lineage:
      - datalake_zscaler_raw.managed_devices.download_count
  ts_registration:
    description: UTC timestamp when the device first registered with Zscaler Client Connector.
    lineage:
      - datalake_zscaler_raw.managed_devices.registration_time
  ts_last_seen:
    description: UTC timestamp when the device last checked in with the Zscaler cloud service.
    lineage:
      - datalake_zscaler_raw.managed_devices.last_seen_time
  ts_config_download:
    description: UTC timestamp of the most recent Zscaler policy configuration download on the device.
    lineage:
      - datalake_zscaler_raw.managed_devices.config_download_time
  ts_keep_alive:
    description: UTC timestamp of the last keep-alive heartbeat received from the Zscaler agent.
    lineage:
      - datalake_zscaler_raw.managed_devices.keepAliveTime
  year:
    description: Ingestion partition year derived from the batch load date; filter on this column for partition pruning.
    lineage:
      - datalake_zscaler_raw.managed_devices.year
  month:
    description: Ingestion partition month derived from the batch load date; filter on this column for partition pruning.
    lineage:
      - datalake_zscaler_raw.managed_devices.month
  day:
    description: Ingestion partition day derived from the batch load date; filter on this column for partition pruning.
    lineage:
      - datalake_zscaler_raw.managed_devices.day
