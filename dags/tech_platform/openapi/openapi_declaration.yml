dag:
  name: openapi
  schedule_start_date: 2024, 10, 1
  schedule_interval: 0 3 * * *
  owner: Tech Platform Cyber Security
  documentation:
    dag_purpose: |
      This dag fetches openapi definitions.

workflow:
  layer: raw
  type: custom_ingestion
  custom_schema: access_logs
  load_spark_job: openapi_load
  spark_job_arguments:
    - "{dag_name}"
    - "{environment}"
    - "{bucket}"
    - "{schema}"
    - "{{ ts }}"
    - "{table_name}"
  tables_customization:
    openapi: {}
  default_table_privileges:
    auditlogs: ["ALL PRIVILEGES"]

