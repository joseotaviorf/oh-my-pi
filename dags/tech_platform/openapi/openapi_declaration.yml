dag:
  name: openapi
  schedule_start_date: 2024, 10, 1
  schedule_interval: 0 3 * * *
  owner: Tech Platform Cyber Security
  documentation:
    dag_purpose: |
      This dag fetches openapi definitions.

workflow:
  layer: raw
  type: custom_ingestion
  custom_schema: access_logs
  load_spark_job: openapi_load
  spark_job_arguments:
  - "{dag_name}"
  - "{environment}"
  - "{bucket}"
  - "{schema}"
  - "{{ ts }}"
  - "{table_name}"
  tables_customization:
    openapi: {}

cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: m5a.2xlarge
    node_type_id: m5a.2xlarge
    num_workers: 2
    spark_version: 12.2.x-scala2.12
    spark_conf:
      spark.sql.legacy.json.allowEmptyString.enabled: "true"
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
  access_control_list:
    group_name: software-engineers
    permission_level: CAN_MANAGE
  databricks_conn_id: databricks_new
