---
table_name: datalake_access_logs_clean.opa
alert_channel: AUTHX_ALERTS
# Wall-clock caveat (applies to both checks below): the framework does not template
# the run's data interval into a constraint, so every check is anchored on
# CURRENT_TIMESTAMP() and always looks at the hours around *now*, never at the
# interval the run is processing. Consequences: on a catch-up burst every queued run
# evaluates the same current hours and reports the same result; a rerun of an old
# interval says nothing about that interval; and while the DAG is itself more than 2h
# behind, the settled hour is legitimately not loaded yet and the presence check will
# warn on every run until it catches up. A warning therefore describes the stream at
# the time it was sent, not the run that sent it.
column_level_validations:
  settled_hour_volume_present:
    custom:
      # Total-volume loss guard: the settled hour (now - 2h) must have at least one
      # record. Runs every hour of every day, including weekends, so a complete stop
      # in the access-log stream is detected within ~2h regardless of the weekday
      # gate on the week-over-week check below.
      constraint: |-
        (
          SELECT COUNT(*)
          FROM datalake_access_logs_clean.opa
          WHERE MAKE_TIMESTAMP(year, month, day, hour, 0, 0)
                = DATE_TRUNC('hour', CURRENT_TIMESTAMP()) - INTERVAL 2 HOURS
        ) > 0
      severity_level: Warning
  per_app_volume_drop_week_over_week:
    custom:
      # Per-app volume drop, compared to the SAME hour 7 days earlier (week-over-week).
      # Two settled hours are evaluated (now - 2h and now - 3h), each against its own
      # counterpart 7 days earlier, and an app must drop more than 50% in BOTH hours to
      # fail. Requiring two consecutive hours filters out the single-hour blips that
      # dominate this signal (deploys, traffic shifts, an anomalous reference hour); a
      # real loss of access logs persists. The 2h lag guarantees the most recent hour
      # evaluated is fully loaded, so detection lags an outage by ~3h -- total-volume
      # loss is covered 24/7 within ~2h by settled_hour_volume_present above.
      # Apps under 1000 records in the reference hour are ignored: below that, normal
      # hour-to-hour variance routinely exceeds 50% and the check only flaps. Apps that
      # quiet cannot be watched here and rely on the corrupt-record monitor instead.
      # Runs only when the settled hour (now - 2h) is a weekday in UTC (Mon-Fri, all
      # hours); weekends short-circuit to pass. The 7-day offset keeps every comparison
      # on the same weekday and hour, so the gate only excludes low-volume weekends.
      constraint: |-
        (
          CASE
            WHEN DAYOFWEEK(
                   DATE_TRUNC('hour', CURRENT_TIMESTAMP()) - INTERVAL 2 HOURS
                 ) BETWEEN 2 AND 6
            THEN
              (
                WITH cur AS (
                   SELECT
                     COALESCE(app, '(unknown)') AS app,
                     MAKE_TIMESTAMP(year, month, day, hour, 0, 0) AS ts_hour,
                     COUNT(*) AS c
                   FROM datalake_access_logs_clean.opa
                   WHERE MAKE_TIMESTAMP(year, month, day, hour, 0, 0) IN (
                           DATE_TRUNC('hour', CURRENT_TIMESTAMP()) - INTERVAL 2 HOURS,
                           DATE_TRUNC('hour', CURRENT_TIMESTAMP()) - INTERVAL 3 HOURS
                         )
                   GROUP BY
                     COALESCE(app, '(unknown)'),
                     MAKE_TIMESTAMP(year, month, day, hour, 0, 0)
                 ),
                 prev AS (
                   SELECT
                     COALESCE(app, '(unknown)') AS app,
                     MAKE_TIMESTAMP(year, month, day, hour, 0, 0)
                       + INTERVAL 7 DAYS AS ts_hour,
                     COUNT(*) AS c
                   FROM datalake_access_logs_clean.opa
                   WHERE MAKE_TIMESTAMP(year, month, day, hour, 0, 0) IN (
                           DATE_TRUNC('hour', CURRENT_TIMESTAMP())
                             - INTERVAL 7 DAYS - INTERVAL 2 HOURS,
                           DATE_TRUNC('hour', CURRENT_TIMESTAMP())
                             - INTERVAL 7 DAYS - INTERVAL 3 HOURS
                         )
                   GROUP BY
                     COALESCE(app, '(unknown)'),
                     MAKE_TIMESTAMP(year, month, day, hour, 0, 0)
                 )
                 SELECT COUNT(*)
                 FROM (
                   SELECT prev.app AS app
                   FROM prev
                   LEFT JOIN cur
                     ON prev.app = cur.app
                     AND prev.ts_hour = cur.ts_hour
                   WHERE prev.c >= 1000
                     AND COALESCE(cur.c, 0) < 0.5 * prev.c
                   GROUP BY prev.app
                   HAVING COUNT(*) >= 2
                 ) AS apps_dropped_two_hours
              ) = 0
            ELSE TRUE
          END
        )
      severity_level: Warning
