cluster:
  # Reverted to the historically working AMD multi-node configuration after
  # repeated OOMs on Graviton driver sizing experiments (#23104, #23107,
  # #23108). r5a.2xlarge (64 GB) gives the Python `register-table` task
  # enough headroom alongside the still-warm Spark JVM. Workers stay on
  # r5a.2xlarge to keep CPU + S3 connection pool capacity matched to the
  # high-fanout JSON ingestion workload. Inline settings below mirror the
  # `cluster_anchor` defaults (single-user, SINGLE_USER mode, namespace)
  # because `custom_cluster` does not inherit from anchors.
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: r5a.2xlarge
    node_type_id: r5a.2xlarge
    num_workers: 2
    spark_version: 16.4.x-scala2.12
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      # Required to parse OPA audit log JSON entries with empty string values.
      spark.sql.legacy.json.allowEmptyString.enabled: "true"

      # Sets the default catalog so SQL run on this cluster resolves against
      # the environment-aware Unity Catalog (mirrors the cluster_anchor default).
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}

      # --- S3 client tuning -------------------------------------------------
      # The job reads ~150k tiny .gz files per hour; the dominant cost is S3
      # round-trip latency, not bandwidth. Bump the per-JVM S3A thread pool
      # and connection pool so each executor can saturate its NIC with many
      # concurrent GETs instead of waiting on the default 10/15.
      spark.hadoop.fs.s3a.threads.max: "64"
      spark.hadoop.fs.s3a.connection.maximum: "200"

      # --- Partition discovery (LIST) --------------------------------------
      # Default is spark.default.parallelism, which is tiny on small workers.
      # Force a higher fanout so the recursive LIST against the source bucket
      # is parallelized across many threads instead of serialized on the
      # driver. We split the LIST work into 400 tasks (vs. the previous 200)
      # so the 16 worker task slots can chew through more, smaller batches.
      # This straggler-proofs the stage when some prefixes hold many more
      # files than others, and Stage 0/2 wall-clock should drop further from
      # the 6.1 / 4.6 min observed on Istio at parallelism=200. S3 and the
      # per-JVM connection pool of 200 easily absorb the extra concurrency.
      spark.sql.sources.parallelPartitionDiscovery.parallelism: "400"

      # --- File grouping into tasks ----------------------------------------
      # Default 128 MB packs ~1500 tiny .gz files into a single task, hurting
      # parallelism, failure recovery and S3-thread utilization. We tighten
      # both maxPartitionBytes and the per-file open-cost estimate so Spark
      # plans many balanced tasks. 64 MB targets ~60 files per task at our
      # average compressed size, which keeps Stage scheduling overhead in
      # proportion to the actual work each task does (16 MB was producing
      # ~9.6k tasks and the overhead per task started to dominate).
      spark.sql.files.maxPartitionBytes: "67108864"
      spark.sql.files.openCostInBytes: "1048576"
  access_control_list:
    group_name: auditlogs
    permission_level: CAN_MANAGE
  databricks_conn_id: databricks_new
validation:
  cluster:
    type: consolidation_m_memory_cluster
    databricks_conn_id: databricks_new
    access_control_list:
      group_name: auditlogs
      permission_level: CAN_MANAGE
  allow_custom_spark_job: true
