database_name: datalake_monalisa_monitoria_evaluations_clean
table_name: monalisa_monitoria_evaluations
description: Header of the Monitoria quality evaluations generated by the MonalisaAIEvaluationPerformer rpa across the inbound, outbound and carteirizacao flows (see origin_flow). One row per evaluated conversation (id_reference); the latest analysis wins when a conversation is re-evaluated. Holds the conversation-level attributes - origin flow, conversion outcome, analyst, free-text summary and coaching feedback, customer-intent analysis, lead quality, and the audio-inference block. The per-criterion and per-NCG detail live in the sibling tables monalisa_monitoria_evaluation_criteria and monalisa_monitoria_evaluation_ncgs, joined back on id_reference. Partitioned by the S3 day partition the evaluation was written under (year/month/day). Contains PII - email_primary_analyst (collaborator) and the free-text summary/feedback/client_intent_analysis fields, which may embed customer or analyst personal data.
domain: Tech Platform
owner: rpa-team@quintoandar.com.br
columns:
  id_reference:
    lineage:
      - s3_monalisa_bucket/monalisa_monitoria_evaluations.reference_id
    description: Identifier of the evaluated conversation. Merge/idempotency key - one row per conversation, latest analysis wins - and the foreign key used to join with the source conversation tables.
  uuid_analysis:
    lineage:
      - s3_monalisa_bucket/monalisa_monitoria_evaluations.analysis_id
    description: Unique identifier (UUID) of the analysis run that produced this row. Regenerated on every re-evaluation of the same conversation, so it is an attribute and not a key.
  origin_flow:
    lineage:
      - s3_monalisa_bucket/monalisa_monitoria_evaluations.origin_flow
    description: Operational flow the evaluated conversation originated from (categorical, observed values inbound, outbound, carteirizacao). Set by the producer for each handling.
  summary:
    lineage:
      - s3_monalisa_bucket/monalisa_monitoria_evaluations.resumo
    description: Free-text summary of the evaluated conversation produced by the evaluation. May embed customer or analyst personal data (PII).
  email_primary_analyst:
    lineage:
      - s3_monalisa_bucket/monalisa_monitoria_evaluations.email_analista
    description: Corporate e-mail of the primary analyst/collaborator who handled the conversation. PII.
  feedback:
    lineage:
      - s3_monalisa_bucket/monalisa_monitoria_evaluations.feedback
    description: Free-text coaching feedback written to the analyst as a single continuous string (Contexto | O que funcionou | O que falhou | Will | Skill | Desfecho). May embed personal data (PII).
  strengths:
    lineage:
      - s3_monalisa_bucket/monalisa_monitoria_evaluations.pontos_positivos
    description: List of free-text strengths (positive points) identified in the analyst handling. Kept as an array of strings.
  improvement_areas:
    lineage:
      - s3_monalisa_bucket/monalisa_monitoria_evaluations.pontos_de_melhoria
    description: List of free-text improvement areas identified in the analyst handling. Kept as an array of strings.
  client_intent_analysis:
    lineage:
      - s3_monalisa_bucket/monalisa_monitoria_evaluations.analise_intent_cliente
    description: Free-text analysis of the customer's intent inferred from the evaluated conversation. May embed customer personal data (PII).
  lead_quality:
    lineage:
      - s3_monalisa_bucket/monalisa_monitoria_evaluations.qualidade_lead
    description: Assessment of the lead quality for the evaluated conversation, produced by the evaluation (categorical free-text).
  audio_confidence_level:
    lineage:
      - s3_monalisa_bucket/monalisa_monitoria_evaluations.analise_de_audio.nivel_de_confianca
    description: Confidence level of the hidden-audio inference (categorical, observed values Alto, Médio, Baixo). Never null by contract.
  audio_inference_justification:
    lineage:
      - s3_monalisa_bucket/monalisa_monitoria_evaluations.analise_de_audio.justificativa_da_inferencia
    description: Free-text justification for the hidden-audio inference. May embed personal data.
  is_converted:
    lineage:
      - s3_monalisa_bucket/monalisa_monitoria_evaluations.convertido
    description: Whether the conversation converted (photo session scheduled, second modality activated, new property added, or listing reactivated).
  has_audio:
    lineage:
      - s3_monalisa_bucket/monalisa_monitoria_evaluations.analise_de_audio.teve_audio
    description: Whether the evaluation inferred that a voice message (audio) was exchanged during the conversation.
  has_audio_impact:
    lineage:
      - s3_monalisa_bucket/monalisa_monitoria_evaluations.analise_de_audio.impacto_na_monitoria
    description: Whether the inferred audio (or its absence) impacted the ability to evaluate critical parts of the conversation.
  ts_analysis:
    lineage:
      - s3_monalisa_bucket/monalisa_monitoria_evaluations.ts_analysis
    description: Timestamp when the analysis that produced this row was performed. Used to pick the latest analysis per conversation.
  year:
    lineage:
      - s3_monalisa_bucket/monalisa_monitoria_evaluations.year
    description: Year of the S3 day partition the evaluation was written under (year=). Partition key.
  month:
    lineage:
      - s3_monalisa_bucket/monalisa_monitoria_evaluations.month
    description: Month of the S3 day partition the evaluation was written under (month=). Partition key.
  day:
    lineage:
      - s3_monalisa_bucket/monalisa_monitoria_evaluations.day
    description: Day of the S3 day partition the evaluation was written under (day=). Partition key.
