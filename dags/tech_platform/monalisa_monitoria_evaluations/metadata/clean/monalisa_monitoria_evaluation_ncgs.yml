database_name: datalake_monalisa_monitoria_evaluations_clean
table_name: monalisa_monitoria_evaluation_ncgs
description: Per-NCG detail of the Monitoria quality evaluations generated by the MonalisaAIEvaluationPerformer rpa (across the inbound, outbound and carteirizacao flows). One row per (conversation, NCG) - the 8 mapped Non-Conformidades Graves (grave non-conformities) evaluated for each conversation. Joins back to the header table monalisa_monitoria_evaluations on id_reference. Kept separate from the checklist-criteria table because the NCG domain differs (8 fixed NCGs, conformity is never N/A) and NCGs drive the downstream penalty/impact scoring. Reflects the latest analysis for the conversation. Partitioned by the S3 day partition the evaluation was written under (year/month/day). Contains PII - the free-text justification may embed customer or analyst personal data.
domain: Tech Platform
owner: rpa-team@quintoandar.com.br
columns:
  id_reference:
    lineage:
      - s3_monalisa_bucket/monalisa_monitoria_evaluations.reference_id
    description: Identifier of the evaluated conversation. Foreign key to the header table monalisa_monitoria_evaluations and first part of the composite merge key.
  criterion:
    lineage:
      - s3_monalisa_bucket/monalisa_monitoria_evaluations.ncgs.criterio
    description: Evaluated NCG (categorical, one of the 8 mapped grave non-conformities, e.g. Divergência de Valores, Conduta Antiprofissional e/ou Descarte Indevido). Second part of the composite merge key. The NCG weight and impact category are catalog attributes applied downstream, not stored here.
  conformity:
    lineage:
      - s3_monalisa_bucket/monalisa_monitoria_evaluations.ncgs.conformidade
    description: Conformity classification assigned to the NCG (categorical, observed values Conforme, Parcialmente Conforme, Não conforme). Never N/A by contract - Conforme means the infraction did not occur.
  justification:
    lineage:
      - s3_monalisa_bucket/monalisa_monitoria_evaluations.ncgs.justificativa
    description: Free-text justification for the NCG classification as a single continuous string (Contexto | Causa Raiz | Análise | Exemplo). Mandatory even when Conforme. May embed personal data (PII).
  year:
    lineage:
      - s3_monalisa_bucket/monalisa_monitoria_evaluations.year
    description: Year of the S3 day partition the evaluation was written under (year=). Partition key.
  month:
    lineage:
      - s3_monalisa_bucket/monalisa_monitoria_evaluations.month
    description: Month of the S3 day partition the evaluation was written under (month=). Partition key.
  day:
    lineage:
      - s3_monalisa_bucket/monalisa_monitoria_evaluations.day
    description: Day of the S3 day partition the evaluation was written under (day=). Partition key.
