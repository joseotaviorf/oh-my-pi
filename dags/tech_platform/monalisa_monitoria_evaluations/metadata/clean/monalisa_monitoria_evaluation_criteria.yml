database_name: datalake_monalisa_monitoria_evaluations_clean
table_name: monalisa_monitoria_evaluation_criteria
description: Per-criterion detail of the Monitoria quality evaluations generated by the MonalisaAIEvaluationPerformer rpa (across the inbound, outbound and carteirizacao flows). One row per (conversation, checklist criterion) - the 11 standard checklist criteria evaluated for each conversation. Joins back to the header table monalisa_monitoria_evaluations on id_reference. Reflects the latest analysis for the conversation. Partitioned by the S3 day partition the evaluation was written under (year/month/day). Contains PII - the free-text justification may embed customer or analyst personal data.
domain: Tech Platform
owner: rpa-team@quintoandar.com.br
columns:
  id_reference:
    lineage:
      - s3_monalisa_bucket/monalisa_monitoria_evaluations.reference_id
    description: Identifier of the evaluated conversation. Foreign key to the header table monalisa_monitoria_evaluations and first part of the composite merge key.
  criterion:
    lineage:
      - s3_monalisa_bucket/monalisa_monitoria_evaluations.checklist.criterio
    description: Evaluated checklist criterion (categorical, one of the 11 standard criteria, e.g. Condução do Atendimento, Sondagem, Precificação). Second part of the composite merge key.
  conformity:
    lineage:
      - s3_monalisa_bucket/monalisa_monitoria_evaluations.checklist.conformidade
    description: Conformity classification assigned to the criterion (categorical, observed values Conforme, Parcialmente Conforme, Não conforme, N/A). The final numeric score and weighting are computed downstream, not stored here.
  justification:
    lineage:
      - s3_monalisa_bucket/monalisa_monitoria_evaluations.checklist.justificativa
    description: Free-text justification for the criterion classification as a single continuous string (Contexto | Causa Raiz | Análise | Exemplo). May embed personal data (PII).
  year:
    lineage:
      - s3_monalisa_bucket/monalisa_monitoria_evaluations.year
    description: Year of the S3 day partition the evaluation was written under (year=). Partition key.
  month:
    lineage:
      - s3_monalisa_bucket/monalisa_monitoria_evaluations.month
    description: Month of the S3 day partition the evaluation was written under (month=). Partition key.
  day:
    lineage:
      - s3_monalisa_bucket/monalisa_monitoria_evaluations.day
    description: Day of the S3 day partition the evaluation was written under (day=). Partition key.
