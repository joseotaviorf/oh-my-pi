dag:
  name: monalisa_monitoria_evaluations
  schedule_start_date: 2026, 07, 21
  schedule_interval: 0 22 * * *
  owner: Tech Platform Workforce Productivity
  documentation:
    dag_purpose: |
      This DAG loads and cleans the Monitoria quality evaluations generated by the
      MonalisaAIEvaluationPerformer rpa across the inbound, outbound and carteirizacao
      flows (see origin_flow). The producer writes one nested JSON object
      per evaluation to S3; this DAG normalizes it into three tables that share the same
      NDJSON source and the datalake_monalisa_monitoria_evaluations_clean database:
        - monalisa_monitoria_evaluations: one row per evaluated conversation (header).
        - monalisa_monitoria_evaluation_criteria: one row per (conversation, checklist criterion).
        - monalisa_monitoria_evaluation_ncgs: one row per (conversation, NCG).
      Idempotency is keyed on id_reference (the conversation id; source reference_id) - a
      rerun of the same conversation mints a new analysis_id but keeps the same reference_id,
      so the latest analysis wins.

workflow:
  layer: clean
  type: query_delta
  load_spark_job: monalisa_monitoria_evaluations_load
  custom_schema: monalisa_monitoria_evaluations
  spark_job_arguments:
  - "{dag_name}"
  - "{environment}"
  - "{bucket}"
  - "{schema}"
  - "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, -2), 'load_start_date') }}"
  - "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  - "{table_name}"
  - "{partitions}"
  default_extraction_type: incremental
  default_partitions: [year, month, day]
  tables_customization:
    monalisa_monitoria_evaluations:
      merge_on: [id_reference]
    monalisa_monitoria_evaluation_criteria:
      merge_on: [id_reference, criterion]
    monalisa_monitoria_evaluation_ncgs:
      merge_on: [id_reference, criterion]
