---
database_name: datalake_release_validations_tests_clean
table_name: playwright_specs_tests
domain: Tech Platform
owner: gabriel.dantas@quintoandar.com.br
description: |
  Clean Playwright web release-validation retries parsed from results.json artifacts in S3.
  One row per test retry with suite, spec, project, and outcome metadata for CI quality gate analytics.
columns:
  file_path:
    description: Full storage path for the Playwright JSON artifact used as source.
    lineage:
      - datalake_release_validations_tests_raw.playwright_results.file_path
  test_type:
    description: Logical test classification derived from the artifact location (e.g. hermetic, e2e).
    lineage:
      - datalake_release_validations_tests_raw.playwright_results.test_type
  repository:
    description: Git repository name inferred from the artifact path.
    lineage:
      - datalake_release_validations_tests_raw.playwright_results.repository
  deploy_group:
    description: Deploy group or product area inferred from the artifact path.
    lineage:
      - datalake_release_validations_tests_raw.playwright_results.deploy_group
  service:
    description: Service or app name associated with the run, when available in the path.
    lineage:
      - datalake_release_validations_tests_raw.playwright_results.service
  id_ci_build:
    description: CI build identifier that produced the Playwright run.
    lineage:
      - datalake_release_validations_tests_raw.playwright_results.ci_build_id
  dt_run:
    description: Execution date provided by the ingestion pipeline in YYYY-MM-DD.
    lineage:
      - datalake_release_validations_tests_raw.playwright_results.run_date
  year:
    description: Year partition extracted from run_date.
    lineage:
      - datalake_release_validations_tests_raw.playwright_results.year
  month:
    description: Month partition extracted from run_date.
    lineage:
      - datalake_release_validations_tests_raw.playwright_results.month
  day:
    description: Day partition extracted from run_date.
    lineage:
      - datalake_release_validations_tests_raw.playwright_results.day
  run_total_expected:
    description: Total number of expected assertions reported by Playwright for the run.
    lineage:
      - datalake_release_validations_tests_raw.playwright_results.content
  run_total_unexpected:
    description: Total number of unexpected assertions reported by Playwright for the run.
    lineage:
      - datalake_release_validations_tests_raw.playwright_results.content
  run_total_flaky:
    description: Count of tests classified as flaky in the run summary.
    lineage:
      - datalake_release_validations_tests_raw.playwright_results.content
  run_total_skipped:
    description: Total number of skipped tests reported in the run summary.
    lineage:
      - datalake_release_validations_tests_raw.playwright_results.content
  run_total_duration_ms:
    description: Total duration in milliseconds for the entire Playwright run.
    lineage:
      - datalake_release_validations_tests_raw.playwright_results.content
  run_start_time:
    description: Start timestamp of the Playwright run in ISO-8601 format.
    lineage:
      - datalake_release_validations_tests_raw.playwright_results.content
  playwright_version:
    description: Playwright version captured in the run configuration.
    lineage:
      - datalake_release_validations_tests_raw.playwright_results.content
  config_max_workers:
    description: Maximum number of workers configured for the run.
    lineage:
      - datalake_release_validations_tests_raw.playwright_results.content
  config_root_dir:
    description: Root directory configured for Playwright within the repository.
    lineage:
      - datalake_release_validations_tests_raw.playwright_results.content
  actual_workers:
    description: Actual number of workers Playwright used during execution.
    lineage:
      - datalake_release_validations_tests_raw.playwright_results.content
  git_commit_hash:
    description: Full git commit hash from the run metadata.
    lineage:
      - datalake_release_validations_tests_raw.playwright_results.content
  git_commit_short:
    description: Short git commit hash from the run metadata.
    lineage:
      - datalake_release_validations_tests_raw.playwright_results.content
  git_branch:
    description: Git branch checked out for the run.
    lineage:
      - datalake_release_validations_tests_raw.playwright_results.content
  git_commit_subject:
    description: Commit subject line associated with the run.
    lineage:
      - datalake_release_validations_tests_raw.playwright_results.content
  commit_author_name:
    description: Author name for the commit associated with the run.
    lineage:
      - datalake_release_validations_tests_raw.playwright_results.content
  commit_author_email:
    description: Author email for the commit associated with the run.
    lineage:
      - datalake_release_validations_tests_raw.playwright_results.content
  ts_commit_author:
    description: Commit author timestamp (epoch millis) provided by metadata.
    lineage:
      - datalake_release_validations_tests_raw.playwright_results.content
  suite_title:
    description: Title of the Playwright suite containing the spec.
    lineage:
      - datalake_release_validations_tests_raw.playwright_results.content
  suite_file:
    description: File path of the suite definition.
    lineage:
      - datalake_release_validations_tests_raw.playwright_results.content
  suite_line:
    description: Line number in the suite file where the suite is declared.
    lineage:
      - datalake_release_validations_tests_raw.playwright_results.content
  suite_column:
    description: Column number in the suite file where the suite is declared.
    lineage:
      - datalake_release_validations_tests_raw.playwright_results.content
  spec_title:
    description: Human-readable Playwright spec title extracted from the nested results.json suites hierarchy.
    lineage:
      - datalake_release_validations_tests_raw.playwright_results.content
  id_spec:
    description: Unique Playwright-generated spec identifier.
    lineage:
      - datalake_release_validations_tests_raw.playwright_results.content
  spec_file:
    description: File path where the spec is defined.
    lineage:
      - datalake_release_validations_tests_raw.playwright_results.content
  spec_line:
    description: Line number for the spec definition.
    lineage:
      - datalake_release_validations_tests_raw.playwright_results.content
  spec_column:
    description: Column number for the spec definition.
    lineage:
      - datalake_release_validations_tests_raw.playwright_results.content
  is_spec_ok:
    description: Boolean indicating whether the spec completed successfully across all tests.
    lineage:
      - datalake_release_validations_tests_raw.playwright_results.content
  spec_tags:
    description: Array of tags declared on the spec.
    lineage:
      - datalake_release_validations_tests_raw.playwright_results.content
  test_timeout:
    description: Timeout configured for the individual Playwright test (milliseconds).
    lineage:
      - datalake_release_validations_tests_raw.playwright_results.content
  test_expected_status:
    description: Status Playwright expected for the test (passed, failed, skipped, etc.).
    lineage:
      - datalake_release_validations_tests_raw.playwright_results.content
  id_test_project:
    description: Identifier of the Playwright project that executed the test.
    lineage:
      - datalake_release_validations_tests_raw.playwright_results.content
  test_project_name:
    description: Human-readable name of the Playwright project.
    lineage:
      - datalake_release_validations_tests_raw.playwright_results.content
  test_overall_status:
    description: Aggregated status of the test considering all retries.
    lineage:
      - datalake_release_validations_tests_raw.playwright_results.content
  result_worker_index:
    description: Index of the worker that executed the retry.
    lineage:
      - datalake_release_validations_tests_raw.playwright_results.content
  result_parallel_index:
    description: Parallel execution index reported by Playwright for the retry.
    lineage:
      - datalake_release_validations_tests_raw.playwright_results.content
  result_status:
    description: Status outcome for this specific retry (passed, failed, timedOut, skipped, etc.).
    lineage:
      - datalake_release_validations_tests_raw.playwright_results.content
  result_duration_ms:
    description: Duration in milliseconds for this retry attempt.
    lineage:
      - datalake_release_validations_tests_raw.playwright_results.content
  result_retry_attempt:
    description: Retry number starting from zero for the first execution.
    lineage:
      - datalake_release_validations_tests_raw.playwright_results.content
  result_start_time:
    description: Start timestamp of the retry attempt in ISO-8601 format.
    lineage:
      - datalake_release_validations_tests_raw.playwright_results.content
  result_errors:
    description: Array of error objects emitted by Playwright for the retry.
    lineage:
      - datalake_release_validations_tests_raw.playwright_results.content
  result_attachments:
    description: Array of attachments (screenshots, video, trace) generated for the retry.
    lineage:
      - datalake_release_validations_tests_raw.playwright_results.content
  result_stdout:
    description: Array of stdout lines captured during the retry.
    lineage:
      - datalake_release_validations_tests_raw.playwright_results.content
  result_stderr:
    description: Array of stderr lines captured during the retry.
    lineage:
      - datalake_release_validations_tests_raw.playwright_results.content
  is_flaky_test:
    description: Boolean flag when this retry passed after at least one earlier failure for the same test.
  is_passed:
    description: Boolean flag set when the Playwright retry finished with status passed.
  is_failed:
    description: Boolean flag set when the Playwright retry finished with status failed.
  is_skipped:
    description: Boolean flag set when the Playwright retry was skipped by the test runner.
  is_timeout:
    description: Boolean flag set when the Playwright retry ended due to configured timeout limits.
  total_attempts_for_this_result:
    description: Running count of execution attempts for the test including this retry index.
  first_error_message:
    description: First error message text captured in the Playwright errors array for this retry.
  first_error_stack:
    description: Stack trace string associated with the first error captured for this retry.
  error_count:
    description: Total number of error objects recorded by Playwright for this retry attempt.
  attachment_count:
    description: Total number of attachments such as screenshots or traces saved for this retry.
  stdout_line_count:
    description: Number of stdout log lines captured by Playwright during this retry execution.
  stderr_line_count:
    description: Number of stderr log lines captured by Playwright during this retry execution.
  ts_result_start:
    description: Retry start timestamp parsed from ISO-8601 and cast to Spark timestamp type.
  ts_run_start:
    description: Playwright run start timestamp parsed from config and cast to Spark timestamp type.
  dt_run_parsed:
    description: Calendar date derived from ts_run_start for daily aggregation and partition-friendly filtering.
  run_year:
    description: Year component extracted from ts_run_start for partition-style filtering on run time.
  run_month:
    description: Month component extracted from ts_run_start for partition-style filtering on run time.
  run_day:
    description: Day component extracted from ts_run_start for partition-style filtering on run time.
  run_hour:
    description: Hour component extracted from ts_run_start for partition-style filtering on run time.
  id_unique_test_result:
    description: Deterministic surrogate key concatenating build, spec, project, and retry index for deduplication.
