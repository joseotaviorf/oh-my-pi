domain: Tech Platform
owner: gabriel.capanema@quintoandar.com.br
columns:
  id_test_execution:
    lineage:
      - datalake_cypress_reports_raw.cypress_reports.id_test_execution
    description: The ID of the execution.
  results:
    lineage:
      - datalake_cypress_reports_raw.cypress_reports.results
    description: JSON with results information.
  stats:
    lineage:
      - datalake_cypress_reports_raw.cypress_reports.stats
    description: JSON with stats information.
  pwa:
