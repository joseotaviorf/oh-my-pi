dag:
  name: identitynow
  schedule_start_date: 2025, 02, 17
  schedule_interval: 0 1 * * *
  owner: Tech Platform Cyber Security
  documentation:
    dag_purpose: |
      This DAG loads and cleans IdentityNow audit logs.

workflow:
  layer: clean
  type: query_delta
  custom_schema: identitynow_audit_logs
  spark_job_arguments:
  - "{dag_name}"
  - "{environment}"
  - "{bucket}"
  - "{schema}"
  - "{{ ts }}"
  - "{table_name}"
  - "{partitions}"
  default_extraction_type: incremental
  default_partitions: [year, month, day]
  has_hive_sync: false
  tables_customization:
    events:
      load_spark_job: events_load
      merge_on: [year, month, day, id_event]
    account_activities:
      load_spark_job: account_activities_load
      merge_on: [year, month, day, id_account_activity]

cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: m5a.2xlarge
    node_type_id: m5a.2xlarge
    num_workers: 2
    spark_version: 12.2.x-scala2.12
    spark_conf:
      spark.sql.legacy.json.allowEmptyString.enabled: "true"
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
  access_control_list:
    group_name: auditlogs
    permission_level: CAN_MANAGE
  databricks_conn_id: databricks_new
