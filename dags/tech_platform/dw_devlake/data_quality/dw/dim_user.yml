---
table_name: dw_devlake.dim_user
alert_channel: "#alerts-de-airflow-dags"

table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error

column_level_validations:
  sk_user:
    is_complete:
      severity_level: Error
    is_unique:
      severity_level: Error
  id_user:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Error
  user_email:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Warning
  ts_load:
    is_complete:
      severity_level: Warning
