---
table_name: dw_devlake.dim_team
alert_channel: "#alerts-de-airflow-dags"

table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error

column_level_validations:
  sk_team:
    is_complete:
      severity_level: Error
    is_unique:
      severity_level: Error
  id_team:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Error
  team_name:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Error
  team_type:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Error
    is_contained_in:
      values: ['LINE', 'TEAM']
      severity_level: Warning
  ts_load:
    is_complete:
      severity_level: Warning
