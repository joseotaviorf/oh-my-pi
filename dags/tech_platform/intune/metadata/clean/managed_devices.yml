database_name: datalake_intune_clean
table_name: managed_devices
domain: Tech Platform
owner: identityplatform-team@quintoandar.com.br
description: Clean snapshot of managed devices from Microsoft Intune, with normalized identifiers and timestamps.
columns:
  id_device:
    description: Unique Intune device identifier.
    lineage:
      - datalake_intune_raw.managed_devices.id
  id_azure_ad_device:
    description: Microsoft Entra (Azure AD) device identifier.
    lineage:
      - datalake_intune_raw.managed_devices.azureADDeviceId
  nm_device:
    description: Device display name in Intune.
    lineage:
      - datalake_intune_raw.managed_devices.deviceName
  nm_managed_device:
    description: Intune managed device label generated by the platform.
    lineage:
      - datalake_intune_raw.managed_devices.managedDeviceName
  id_user:
    description: Intune user identifier associated with the device.
    lineage:
      - datalake_intune_raw.managed_devices.userId
  nm_user:
    description: Display name of the associated user.
    lineage:
      - datalake_intune_raw.managed_devices.userDisplayName
  ds_email_address:
    description: Email address associated with the device user.
    lineage:
      - datalake_intune_raw.managed_devices.emailAddress
  ds_user_principal_name:
    description: User principal name (UPN) associated with the device.
    lineage:
      - datalake_intune_raw.managed_devices.userPrincipalName
  ds_owner_type:
    description: Ownership type of the device (company or personal).
    lineage:
      - datalake_intune_raw.managed_devices.managedDeviceOwnerType
  nm_manufacturer:
    description: Device manufacturer name.
    lineage:
      - datalake_intune_raw.managed_devices.manufacturer
  nm_model:
    description: Device model name.
    lineage:
      - datalake_intune_raw.managed_devices.model
  ds_serial_number:
    description: Device serial number.
    lineage:
      - datalake_intune_raw.managed_devices.serialNumber
  ds_device_enrollment_type:
    description: Enrollment mechanism used for the device.
    lineage:
      - datalake_intune_raw.managed_devices.deviceEnrollmentType
  ds_device_registration_state:
    description: Registration state of the device in Microsoft Entra.
    lineage:
      - datalake_intune_raw.managed_devices.deviceRegistrationState
  ds_management_agent:
    description: Management agent used by Intune for this device.
    lineage:
      - datalake_intune_raw.managed_devices.managementAgent
  ds_operating_system:
    description: Operating system family.
    lineage:
      - datalake_intune_raw.managed_devices.operatingSystem
  ds_os_version:
    description: Operating system version.
    lineage:
      - datalake_intune_raw.managed_devices.osVersion
  ds_compliance_state:
    description: Intune compliance state for the device.
    lineage:
      - datalake_intune_raw.managed_devices.complianceState
  ds_management_state:
    description: Device management state reported by Intune.
    lineage:
      - datalake_intune_raw.managed_devices.managementState
  is_encrypted:
    description: Indicates if device storage is encrypted.
    lineage:
      - datalake_intune_raw.managed_devices.isEncrypted
  is_supervised:
    description: Indicates if the device is supervised by an MDM policy.
    lineage:
      - datalake_intune_raw.managed_devices.isSupervised
  is_azure_ad_registered:
    description: Indicates if the device is registered in Microsoft Entra (Azure AD).
    lineage:
      - datalake_intune_raw.managed_devices.azureADRegistered
  is_eas_activated:
    description: Indicates if Exchange ActiveSync is activated.
    lineage:
      - datalake_intune_raw.managed_devices.easActivated
  id_eas_device:
    description: Exchange ActiveSync device identifier.
    lineage:
      - datalake_intune_raw.managed_devices.easDeviceId
  ds_jail_broken:
    description: Jailbreak/root status as reported by Intune.
    lineage:
      - datalake_intune_raw.managed_devices.jailBroken
  ds_wifi_mac_address:
    description: Wi-Fi MAC address reported for the device.
    lineage:
      - datalake_intune_raw.managed_devices.wiFiMacAddress
  qt_total_storage_bytes:
    description: Total device storage in bytes.
    lineage:
      - datalake_intune_raw.managed_devices.totalStorageSpaceInBytes
  qt_free_storage_bytes:
    description: Free device storage in bytes.
    lineage:
      - datalake_intune_raw.managed_devices.freeStorageSpaceInBytes
  ts_enrolled_utc:
    description: Timestamp when the device was enrolled in Intune (UTC), null for sentinel values.
    lineage:
      - datalake_intune_raw.managed_devices.enrolledDateTime
  ts_last_sync_utc:
    description: Timestamp of the last successful Intune sync (UTC), null for sentinel values.
    lineage:
      - datalake_intune_raw.managed_devices.lastSyncDateTime
  ts_compliance_grace_expiration_utc:
    description: Compliance grace period expiration timestamp (UTC), null for sentinel values.
    lineage:
      - datalake_intune_raw.managed_devices.complianceGracePeriodExpirationDateTime
  ts_management_certificate_expiration_utc:
    description: Management certificate expiration timestamp (UTC), null for sentinel values.
    lineage:
      - datalake_intune_raw.managed_devices.managementCertificateExpirationDate
  year:
    description: Year partition of the ingestion date.
    lineage:
      - datalake_intune_raw.managed_devices.year
  month:
    description: Month partition of the ingestion date.
    lineage:
      - datalake_intune_raw.managed_devices.month
  day:
    description: Day partition of the ingestion date.
    lineage:
      - datalake_intune_raw.managed_devices.day
