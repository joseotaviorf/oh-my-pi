dag:
  name: reverse_integration_cloudzero
  schedule_start_date: 2025, 1, 1
  owner: Tech Platform Dev Foundation
  documentation:
    dag_purpose: |
      Query Databricks for contracts count and send to CloudZero API for cost monitoring.
      Also exports API request counts from Prometheus via Grafana datasource to CloudZero.
      - Contracts: number of ongoing rental contracts from Databricks.
      - API requests: quantity of requests per app from Grafana (Prometheus/Thanos), sent as dimensioned metric.
workflow:
  type: load_access
  layer: reverse
  custom_schema: integration_cloudzero
  load_spark_job: load_contracts_to_cloudzero
  spark_job_arguments:
    - "{environment}"
    - "{{ data_interval_start | ds }}"
  execution_timeout_hours: 2
  tables_customization:
    contracts_count: {}
    api_requests_count:
      load_spark_job: load_api_requests_to_cloudzero
