dag:
  name: cloudfront
  schedule_start_date: 2024, 10, 1
  schedule_interval: 0 * * * *
  owner: Tech Platform Cyber Security
  documentation:
    dag_purpose: |
      This dag extracts and cleans cloudfront access logs.

workflow:
  layer: clean
  type: query_delta
  custom_schema: access_logs
  load_spark_job: cloudfront_logs_load
  spark_job_arguments:
    - "{dag_name}"
    - "{environment}"
    - "{bucket}"
    - "{schema}"
    - "{{ ts }}"
    - "{table_name}"
    - "{partitions}"
  default_extraction_type: incremental
  default_partitions: [year, month, day, hour]
  tables_customization:
    cloudfront: {}
  default_table_privileges:
    auditlogs: ["ALL PRIVILEGES"]

