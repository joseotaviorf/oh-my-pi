database_name: datalake_zscaler
table_name: managed_devices
domain: Tech Platform
owner: danilo.barbosa@quintoandar.com.br
description: |
  Current-state Zscaler Client Connector managed devices: latest ingest partition within the Airflow batch window and one row
  per device (not a historical stack of partitions). Derived from clean by keeping MAX(year, month, day) in
  scope and deduplicating by device with QUALIFY.
columns:
  id_device:
    description: Unique device identifier (UDID) in Zscaler.
    lineage:
      - datalake_zscaler_clean.managed_devices.id_device
  ds_mac_address:
    description: Media access control address reported by the Zscaler Client Connector agent on the endpoint.
    lineage:
      - datalake_zscaler_clean.managed_devices.ds_mac_address
  nm_hostname:
    description: Machine hostname registered in Zscaler Client Connector for the managed endpoint.
    lineage:
      - datalake_zscaler_clean.managed_devices.nm_hostname
  ds_user_email:
    description: Corporate email of the user last associated with the device in Zscaler Client Connector.
    lineage:
      - datalake_zscaler_clean.managed_devices.ds_user_email
  nm_owner:
    description: Display name of the device owner or assigned user reported by Zscaler inventory.
    lineage:
      - datalake_zscaler_clean.managed_devices.nm_owner
  nm_device_model:
    description: Device model name from Zscaler Client Connector inventory for hardware identification.
    lineage:
      - datalake_zscaler_clean.managed_devices.nm_device_model
  nm_manufacturer:
    description: Hardware manufacturer name reported by Zscaler Client Connector device inventory.
    lineage:
      - datalake_zscaler_clean.managed_devices.nm_manufacturer
  ds_os_version:
    description: Operating system name and version string reported by the Zscaler agent on the endpoint.
    lineage:
      - datalake_zscaler_clean.managed_devices.ds_os_version
  ds_agent_version:
    description: Zscaler Client Connector agent version.
    lineage:
      - datalake_zscaler_clean.managed_devices.ds_agent_version
  nm_policy:
    description: Policy name applied to the device.
    lineage:
      - datalake_zscaler_clean.managed_devices.nm_policy
  nm_company:
    description: Company name associated with the device enrollment in Zscaler Client Connector.
    lineage:
      - datalake_zscaler_clean.managed_devices.nm_company
  ds_registration_state:
    description: Device registration state.
    lineage:
      - datalake_zscaler_clean.managed_devices.ds_registration_state
  cd_device_type:
    description: Zscaler device type classification code for the enrolled Client Connector endpoint.
    lineage:
      - datalake_zscaler_clean.managed_devices.cd_device_type
  cd_device_state:
    description: Operational state code of the device in Zscaler Client Connector (online/offline/etc.).
    lineage:
      - datalake_zscaler_clean.managed_devices.cd_device_state
  cd_vpn_state:
    description: VPN tunnel state code reported by Zscaler Client Connector for the device session.
    lineage:
      - datalake_zscaler_clean.managed_devices.cd_vpn_state
  ds_tunnel_version:
    description: Version of the Zscaler tunnel protocol negotiated by the Client Connector agent.
    lineage:
      - datalake_zscaler_clean.managed_devices.ds_tunnel_version
  ds_architecture:
    description: Device architecture (e.g. x64, arm64).
    lineage:
      - datalake_zscaler_clean.managed_devices.ds_architecture
  ds_hardware_fingerprint:
    description: Hardware fingerprint identifier.
    lineage:
      - datalake_zscaler_clean.managed_devices.ds_hardware_fingerprint
  qt_download_count:
    description: Number of downloads.
    lineage:
      - datalake_zscaler_clean.managed_devices.qt_download_count
  ts_registration:
    description: Timestamp when the device was registered.
    lineage:
      - datalake_zscaler_clean.managed_devices.ts_registration
  ts_last_seen:
    description: Timestamp when the device was last seen.
    lineage:
      - datalake_zscaler_clean.managed_devices.ts_last_seen
  ts_config_download:
    description: Timestamp of last configuration download.
    lineage:
      - datalake_zscaler_clean.managed_devices.ts_config_download
  ts_keep_alive:
    description: Timestamp of last keep-alive signal.
    lineage:
      - datalake_zscaler_clean.managed_devices.ts_keep_alive
  year:
    description: Year of the latest ingest partition retained for this row.
    lineage:
      - datalake_zscaler_clean.managed_devices.year
  month:
    description: Month of the latest ingest partition retained for this row.
    lineage:
      - datalake_zscaler_clean.managed_devices.month
  day:
    description: Day of the latest ingest partition retained for this row.
    lineage:
      - datalake_zscaler_clean.managed_devices.day
