database_name: datalake_intune
table_name: managed_devices
domain: Tech Platform
owner: marcelo.farinaro@quintoandar.com.br
description: |
  Current-state Intune managed devices: latest ingest partition within the Airflow batch window and one row
  per device (not a historical stack of partitions). Derived from clean by keeping MAX(year, month, day) in
  scope and deduplicating by device with QUALIFY.
columns:
  id_device:
    description: Unique Intune device identifier.
    lineage:
      - datalake_intune_clean.managed_devices.id_device
  id_azure_ad_device:
    description: Microsoft Entra (Azure AD) device identifier.
    lineage:
      - datalake_intune_clean.managed_devices.id_azure_ad_device
  nm_device:
    description: Device display name in Intune.
    lineage:
      - datalake_intune_clean.managed_devices.nm_device
  nm_managed_device:
    description: Intune managed device label generated by the platform.
    lineage:
      - datalake_intune_clean.managed_devices.nm_managed_device
  id_user:
    description: Intune user identifier associated with the device.
    lineage:
      - datalake_intune_clean.managed_devices.id_user
  nm_user:
    description: Display name of the associated user.
    lineage:
      - datalake_intune_clean.managed_devices.nm_user
  ds_email_address:
    description: Email address associated with the device user.
    lineage:
      - datalake_intune_clean.managed_devices.ds_email_address
  ds_user_principal_name:
    description: User principal name (UPN) associated with the device.
    lineage:
      - datalake_intune_clean.managed_devices.ds_user_principal_name
  ds_owner_type:
    description: Ownership type of the device (company or personal).
    lineage:
      - datalake_intune_clean.managed_devices.ds_owner_type
  nm_manufacturer:
    description: Device manufacturer name.
    lineage:
      - datalake_intune_clean.managed_devices.nm_manufacturer
  nm_model:
    description: Device model name.
    lineage:
      - datalake_intune_clean.managed_devices.nm_model
  ds_serial_number:
    description: Hardware serial number reported by Microsoft Intune for asset tracking and inventory reconciliation.
    lineage:
      - datalake_intune_clean.managed_devices.ds_serial_number
  ds_device_enrollment_type:
    description: Enrollment mechanism used for the device.
    lineage:
      - datalake_intune_clean.managed_devices.ds_device_enrollment_type
  ds_device_registration_state:
    description: Registration state of the device in Microsoft Entra.
    lineage:
      - datalake_intune_clean.managed_devices.ds_device_registration_state
  ds_management_agent:
    description: Management agent used by Intune for this device.
    lineage:
      - datalake_intune_clean.managed_devices.ds_management_agent
  ds_operating_system:
    description: Operating system family.
    lineage:
      - datalake_intune_clean.managed_devices.ds_operating_system
  ds_os_version:
    description: Operating system name and version string reported by the MDM agent on the enrolled endpoint.
    lineage:
      - datalake_intune_clean.managed_devices.ds_os_version
  ds_compliance_state:
    description: Intune compliance state for the device.
    lineage:
      - datalake_intune_clean.managed_devices.ds_compliance_state
  ds_management_state:
    description: Device management state reported by Intune.
    lineage:
      - datalake_intune_clean.managed_devices.ds_management_state
  is_encrypted:
    description: Indicates if device storage is encrypted.
    lineage:
      - datalake_intune_clean.managed_devices.is_encrypted
  is_supervised:
    description: Indicates if the device is supervised by an MDM policy.
    lineage:
      - datalake_intune_clean.managed_devices.is_supervised
  is_azure_ad_registered:
    description: Indicates if the device is registered in Microsoft Entra (Azure AD).
    lineage:
      - datalake_intune_clean.managed_devices.is_azure_ad_registered
  is_eas_activated:
    description: Indicates if Exchange ActiveSync is activated.
    lineage:
      - datalake_intune_clean.managed_devices.is_eas_activated
  id_eas_device:
    description: Exchange ActiveSync device identifier.
    lineage:
      - datalake_intune_clean.managed_devices.id_eas_device
  ds_jail_broken:
    description: Jailbreak/root status as reported by Intune.
    lineage:
      - datalake_intune_clean.managed_devices.ds_jail_broken
  ds_wifi_mac_address:
    description: Wi-Fi MAC address reported for the device.
    lineage:
      - datalake_intune_clean.managed_devices.ds_wifi_mac_address
  qt_total_storage_bytes:
    description: Total device storage in bytes.
    lineage:
      - datalake_intune_clean.managed_devices.qt_total_storage_bytes
  qt_free_storage_bytes:
    description: Free device storage in bytes.
    lineage:
      - datalake_intune_clean.managed_devices.qt_free_storage_bytes
  ts_enrolled_utc:
    description: Timestamp when the device was enrolled in Intune (UTC), null for sentinel values.
    lineage:
      - datalake_intune_clean.managed_devices.ts_enrolled_utc
  ts_last_sync_utc:
    description: Timestamp of the last successful Intune sync (UTC), null for sentinel values.
    lineage:
      - datalake_intune_clean.managed_devices.ts_last_sync_utc
  ts_compliance_grace_expiration_utc:
    description: Compliance grace period expiration timestamp (UTC), null for sentinel values.
    lineage:
      - datalake_intune_clean.managed_devices.ts_compliance_grace_expiration_utc
  ts_management_certificate_expiration_utc:
    description: Management certificate expiration timestamp (UTC), null for sentinel values.
    lineage:
      - datalake_intune_clean.managed_devices.ts_management_certificate_expiration_utc
  year:
    description: Year of the latest ingest partition retained for this row.
    lineage:
      - datalake_intune_clean.managed_devices.year
  month:
    description: Month of the latest ingest partition retained for this row.
    lineage:
      - datalake_intune_clean.managed_devices.month
  day:
    description: Day of the latest ingest partition retained for this row.
    lineage:
      - datalake_intune_clean.managed_devices.day
