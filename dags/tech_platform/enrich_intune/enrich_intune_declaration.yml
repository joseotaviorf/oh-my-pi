dag:
  name: enrich_intune
  schedule_start_date: 2026, 5, 1
  schedule_interval: 0 4 * * *
  owner: Tech Platform Cyber Security
  documentation:
    dag_purpose: |
      Enriched current-state Intune managed devices from clean: latest ingest partition within the batch
      window and one row per device (not a historical partition stack).

workflow:
  type: query_delta
  layer: enrich
  default_extraction_type: full
  default_partitions: []
  execution_timeout_hours: 4
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, -1), 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  tables_customization:
    managed_devices:
      extraction_type: full
      merge_on: [id_device]
      partitions: []
  default_table_privileges:
    auditlogs:
      - ALL PRIVILEGES

