dag:
  name: botcity
  schedule_start_date: 2025, 06, 12
  schedule_interval: 0 1 * * *
  owner: Tech Platform Workforce Productivity
  documentation:
    dag_purpose: |
      This DAG loads and cleans BotCity audit logs.

workflow:
  layer: clean
  type: query_delta
  load_spark_job: botcity_audit_logs_load
  custom_schema: botcity_audit_logs
  spark_job_arguments:
  - "{dag_name}"
  - "{environment}"
  - "{bucket}"
  - "{schema}"
  - "{{ ts }}"
  - "{table_name}"
  - "{partitions}"
  default_extraction_type: incremental
  tables_customization:
    audit_logs: {}

