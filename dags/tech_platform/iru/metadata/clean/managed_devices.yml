database_name: datalake_iru_clean
table_name: managed_devices
domain: Tech Platform
owner: danilo.barbosa@quintoandar.com.br
description: Clean snapshot of managed devices from IRU/Kandji MDM platform, with normalized identifiers and timestamps.
columns:
  id_device:
    description: Unique device identifier in IRU/Kandji (UUID format).
    lineage:
      - datalake_iru_raw.managed_devices.device_id
  ds_serial_number:
    description: Hardware serial number reported by IRU/Kandji MDM for endpoint inventory and compliance tracking.
    lineage:
      - datalake_iru_raw.managed_devices.serial_number
  id_udid:
    description: Device unique identifier (UDID).
    lineage:
      - datalake_iru_raw.managed_devices.udid
  nm_device:
    description: Device display name in IRU.
    lineage:
      - datalake_iru_raw.managed_devices.device_name
  nm_model:
    description: Device model name (e.g. MacBook Pro 14-inch).
    lineage:
      - datalake_iru_raw.managed_devices.model
  ds_platform:
    description: Device platform (e.g. Mac, iPhone, iPad).
    lineage:
      - datalake_iru_raw.managed_devices.platform
  ds_os_version:
    description: Operating system name and version string reported by the Kandji MDM agent on the enrolled endpoint.
    lineage:
      - datalake_iru_raw.managed_devices.os_version
  ds_supplemental_build_version:
    description: Supplemental operating system build version string reported by IRU/Kandji for patch-level identification.
    lineage:
      - datalake_iru_raw.managed_devices.supplemental_build_version
  id_blueprint:
    description: Blueprint identifier associated with the device.
    lineage:
      - datalake_iru_raw.managed_devices.blueprint_id
  nm_blueprint:
    description: Blueprint name associated with the device.
    lineage:
      - datalake_iru_raw.managed_devices.blueprint_name
  ds_asset_tag:
    description: Asset tag assigned to the device.
    lineage:
      - datalake_iru_raw.managed_devices.asset_tag
  id_user:
    description: User identifier associated with the device.
    lineage:
      - datalake_iru_raw.managed_devices.user
  nm_user:
    description: User display name associated with the device.
    lineage:
      - datalake_iru_raw.managed_devices.user
  ds_user_email:
    description: Corporate email of the primary user assigned to the device in Kandji MDM inventory.
    lineage:
      - datalake_iru_raw.managed_devices.user
  is_user_archived:
    description: Indicates if the user is archived in IRU.
    lineage:
      - datalake_iru_raw.managed_devices.user
  is_user_active:
    description: Indicates if the user is active in IRU.
    lineage:
      - datalake_iru_raw.managed_devices.user
  ds_agent_version:
    description: Version of the IRU/Kandji agent installed on the device.
    lineage:
      - datalake_iru_raw.managed_devices.agent_version
  ds_lost_mode_status:
    description: Lost mode status for the device.
    lineage:
      - datalake_iru_raw.managed_devices.lost_mode_status
  is_mdm_enabled:
    description: Indicates if the device has MDM enabled.
    lineage:
      - datalake_iru_raw.managed_devices.mdm_enabled
  is_agent_installed:
    description: Indicates if the IRU agent is installed on the device.
    lineage:
      - datalake_iru_raw.managed_devices.agent_installed
  is_missing:
    description: Indicates if the device is marked as missing.
    lineage:
      - datalake_iru_raw.managed_devices.is_missing
  is_removed:
    description: Indicates if the device has been removed from management.
    lineage:
      - datalake_iru_raw.managed_devices.is_removed
  ts_first_enrollment:
    description: Timestamp when the device was first enrolled.
    lineage:
      - datalake_iru_raw.managed_devices.first_enrollment
  ts_last_enrollment:
    description: Timestamp when the device was last enrolled.
    lineage:
      - datalake_iru_raw.managed_devices.last_enrollment
  ts_last_check_in:
    description: Timestamp of the last device check-in.
    lineage:
      - datalake_iru_raw.managed_devices.last_check_in
  year:
    description: Year partition of the ingestion date.
    lineage:
      - datalake_iru_raw.managed_devices.year
  month:
    description: Month partition of the ingestion date.
    lineage:
      - datalake_iru_raw.managed_devices.month
  day:
    description: Day partition of the ingestion date.
    lineage:
      - datalake_iru_raw.managed_devices.day
