database_name: datalake_monalisa_capta_ai_evaluations_clean
table_name: monalisa_capta_ai_evaluations
description: Cleaned Capta AI conversation evaluations generated by the MonalisaAIEvaluationPerformer rpa. One row per evaluated conversation (id_reference); the stored values reflect the latest Capta AI analysis for that conversation. Partitioned by the S3 day partition the evaluation was written under (year/month/day). Used for inbound/outbound conversation-quality and opportunity analytics. The free-text fields (summary, approach) are LLM-generated and may embed personal data mentioned in the conversation - see governance/pii_catalog before promoting downstream.
domain: Tech Platform
owner: rpa-team@quintoandar.com.br
columns:
  id_reference:
    lineage:
      - s3_monalisa_bucket/monalisa_capta_ai_evaluations.reference_id
    description: Unique identifier of the conversation the Capta AI evaluation belongs to. Merge/idempotency key - one row per conversation, latest analysis wins.
  id_analysis:
    lineage:
      - s3_monalisa_bucket/monalisa_capta_ai_evaluations.analysis_id
    description: Identifier of the evaluation run (RPA queue item id) that produced this analysis.
  category:
    lineage:
      - s3_monalisa_bucket/monalisa_capta_ai_evaluations.output.categoria
    description: 'Capta AI classification of the conversation. One of: "Idle de primeira mensagem", "Idle durante a tratativa", "Outros temas", "Outra modalidade", "Contato futuro", "Cadastro nao finalizado", "Inquilino", "Fora de area", "Ja convertido", "Teste", "Outros".'
  summary:
    lineage:
      - s3_monalisa_bucket/monalisa_capta_ai_evaluations.output.resumo
    description: Capta AI generated summary of what happened in the conversation during Inbound. May embed personal data mentioned in the conversation.
  approach:
    lineage:
      - s3_monalisa_bucket/monalisa_capta_ai_evaluations.output.abordagem
    description: Capta AI recommended next-contact approach for the Carteirizacao analyst. May embed personal data mentioned in the conversation.
  is_opportunity:
    lineage:
      - s3_monalisa_bucket/monalisa_capta_ai_evaluations.output.oportunidade
    description: Whether Capta AI classified the conversation as an unexplored business opportunity.
  opportunity_score:
    lineage:
      - s3_monalisa_bucket/monalisa_capta_ai_evaluations.output.percentual
    description: Capta AI estimated conversion probability for the conversation, as a decimal between 0.0 and 1.0.
  ts_analyzed:
    lineage:
      - s3_monalisa_bucket/monalisa_capta_ai_evaluations.ts_analysis
    description: UTC timestamp when the Capta AI analysis that produced this evaluation was performed.
  dt_analyzed:
    lineage:
      - s3_monalisa_bucket/monalisa_capta_ai_evaluations.ts_analysis
    description: UTC date the Capta AI analysis that produced this evaluation was performed (derived from ts_analyzed).
  year:
    lineage:
      - s3_monalisa_bucket/monalisa_capta_ai_evaluations.year
    description: Year of the S3 day partition the evaluation was written under (year=). Partition key.
  month:
    lineage:
      - s3_monalisa_bucket/monalisa_capta_ai_evaluations.month
    description: Month of the S3 day partition the evaluation was written under (month=). Partition key.
  day:
    lineage:
      - s3_monalisa_bucket/monalisa_capta_ai_evaluations.day
    description: Day of the S3 day partition the evaluation was written under (day=). Partition key.
