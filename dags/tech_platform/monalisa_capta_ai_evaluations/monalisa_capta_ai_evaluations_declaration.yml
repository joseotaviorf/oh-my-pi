dag:
  name: monalisa_capta_ai_evaluations
  schedule_start_date: 2026, 07, 17
  schedule_interval: 0 22 * * *
  owner: Tech Platform Workforce Productivity
  documentation:
    dag_purpose: |
      This DAG loads and cleans the Capta AI conversation evaluations generated by
      the MonalisaAIEvaluationPerformer rpa.

workflow:
  layer: clean
  type: query_delta
  load_spark_job: monalisa_capta_ai_evaluations_load
  custom_schema: monalisa_capta_ai_evaluations
  spark_job_arguments:
  - "{dag_name}"
  - "{environment}"
  - "{bucket}"
  - "{schema}"
  - "{{ get_date_param(dag_run, macros.ds_add(ds, -1), 'load_start_date') }}"
  - "{{ get_date_param(dag_run, macros.ds_add(ds, -1), 'load_end_date') }}"
  - "{table_name}"
  - "{partitions}"
  default_extraction_type: incremental
  default_partitions: [year, month, day]
  tables_customization:
    monalisa_capta_ai_evaluations:
      merge_on: [id_reference]
