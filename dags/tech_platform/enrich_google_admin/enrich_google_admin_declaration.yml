dag:
  name: enrich_google_admin
  schedule_start_date: 2026, 7, 2
  schedule_interval: 0 4 * * *
  owner: Tech Platform Cyber Security
  documentation:
    dag_purpose: |
      Enriched current-state Google Admin managed devices from clean: latest ingest partition within
      the batch window and one row per device (not a historical partition stack). Covers both mobile
      devices (iOS/Android via Admin SDK) and all endpoints (Windows, macOS, Linux, Chrome OS via
      Cloud Identity Devices API).

workflow:
  type: query_delta
  layer: enrich
  default_extraction_type: full
  default_partitions: []
  execution_timeout_hours: 4
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, -1), 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  tables_customization:
    mobile_devices:
      extraction_type: full
      merge_on: []
      partitions: []
    cloud_identity_devices:
      extraction_type: full
      merge_on: []
      partitions: []
  default_table_privileges:
    auditlogs:
      - ALL PRIVILEGES
