database_name: datalake_access_logs_clean
table_name: istio
description: Table with Envoy access logs.
domain: Tech Platform
owner: identityplatform-team@quintoandar.com.br
columns:
  namespace:
    lineage:
      - s3_auditlogs_bucket/proxy/.../istio-proxy/namespace
    description: Kubernetes namespace
  pod_name:
    lineage:
      - s3_auditlogs_bucket/proxy/.../istio-proxy/pod_name
    description: Kubernetes pod name
  request_traceparent:
    lineage:
      - s3_auditlogs_bucket/proxy/.../istio-proxy/traceparent
    description: Request trace id
  id_trace:
    lineage:
      - s3_auditlogs_bucket/proxy/.../istio-proxy/traceparent
    description: Request trace id
  reques_method:
    lineage:
      - s3_auditlogs_bucket/proxy/.../istio-proxy/method
    description: Request method
  request_user_agent:
    lineage:
      - s3_auditlogs_bucket/proxy/.../istio-proxy/reqeust_user_agent
    description: Request user agent
  request_x_forwarded_for:
    lineage:
      - s3_auditlogs_bucket/proxy/.../istio-proxy/x_forwarded_for
    description: Request forwarded for IPs
  request_path:
    lineage:
      - s3_auditlogs_bucket/proxy/.../istio-proxy/path
    description: Request path
  ts_event:
    lineage:
      - s3_auditlogs_bucket/proxy/.../istio-proxy/start_time
    description: Request start time
  request_duration_ms:
    lineage:
      - s3_auditlogs_bucket/proxy/.../istio-proxy/duration
    description: Request duration
  response_flags:
    lineage:
      - s3_auditlogs_bucket/proxy/.../istio-proxy/response_flags
    description: Response Flags
  response_code:
    lineage:
      - s3_auditlogs_bucket/proxy/.../istio-proxy/response_code
    description: Response Code
  app:
    lineage:
      - s3_auditlogs_bucket/proxy/.../istio-proxy/app
    description: App that handled the request
  request_id:
    lineage:
      - s3_auditlogs_bucket/proxy/.../istio-proxy/id_request
    description: Request ID
  uuid_person_principal_user:
    lineage:
      - s3_auditlogs_bucket/proxy/.../istio-proxy/result.principal_info.user.personUUID
    description: Person UUID extracted from the JWT payload
  id_principal_user:
    lineage:
      - s3_auditlogs_bucket/proxy/.../istio-proxy/result.principal_info.user.id
    description: Main user ID extracted from the JWT payload
  principal_user_email:
    lineage:
      - s3_auditlogs_bucket/proxy/.../istio-proxy/result.principal_info.user.email
    description: Email extracted from the JWT payload of the requesting user
  principal_user_issuer:
    lineage:
      - s3_auditlogs_bucket/proxy/.../istio-proxy/result.principal_info.user.iss
    description: JWT token issuer identifier (e.g. gandalf)
  principal_user_roles:
    lineage:
      - s3_auditlogs_bucket/proxy/.../istio-proxy/result.principal_info.user.roles
    description: Roles assigned to the user in the JWT payload
  id_principal_user_impersonated_by:
    lineage:
      - s3_auditlogs_bucket/proxy/.../istio-proxy/result.principal_info.user.sudoed_by_id
    description: ID of the user who impersonated this principal
  principal_user_sub:
    lineage:
      - s3_auditlogs_bucket/proxy/.../istio-proxy/result.principal_info.user.sub
    description: JWT subject claim identifying the principal (e.g. internal-bot)
  principal_identities_json:
    lineage:
      - s3_auditlogs_bucket/proxy/.../istio-proxy/result.principal_info.user.identities
    description: JSON object of linked principal identities by provider
  principal_service:
    lineage:
      - s3_auditlogs_bucket/proxy/.../istio-proxy/result.principal_info.service
    description: mTLS service identity (SPIFFE URI) of the downstream peer
  response_code_details:
    lineage:
      - s3_auditlogs_bucket/proxy/.../istio-proxy/result.response_code_details
    description: Envoy response code details explaining the response outcome
