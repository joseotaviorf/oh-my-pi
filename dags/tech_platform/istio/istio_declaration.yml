dag:
  name: istio
  schedule_start_date: 2024, 10, 1
  schedule_interval: 0 * * * *
  owner: Tech Platform Cyber Security
  documentation:
    dag_purpose: |
      This dag extracts and cleans istio access logs.

workflow:
  layer: clean
  type: query_delta
  load_spark_job: istio_logs_load
  custom_schema: access_logs
  spark_job_arguments:
    - "{dag_name}"
    - "{environment}"
    - "{bucket}"
    - "{schema}"
    - "{{ ts }}"
    - "{table_name}"
    - "{partitions}"
  default_extraction_type: incremental
  default_partitions: [year, month, day, hour]
  tables_customization:
    istio:
      merge_on: [year, month, day, hour, id_request]
  default_table_privileges:
    auditlogs: ["ALL PRIVILEGES"]

cluster:
  type: consolidation_g_general_photon_cluster
  custom_configurations:
    spark_conf:
      # Required to parse Istio audit log JSON entries with empty string values.
      spark.sql.legacy.json.allowEmptyString.enabled: "true"

      # --- S3 client tuning -------------------------------------------------
      # The job reads many tiny .gz files per hour; the dominant cost is S3
      # round-trip latency, not bandwidth. Bump the per-JVM S3A thread pool
      # and connection pool so each executor can saturate its NIC with many
      # concurrent GETs instead of waiting on the default 10/15.
      spark.hadoop.fs.s3a.threads.max: "64"
      spark.hadoop.fs.s3a.connection.maximum: "200"

      # --- Partition discovery (LIST) --------------------------------------
      # Default is spark.default.parallelism, which is tiny on small workers.
      # Force a higher fanout so the recursive LIST against the source bucket
      # is parallelized across many threads instead of serialized on the
      # driver.
      spark.sql.sources.parallelPartitionDiscovery.parallelism: "200"

      # --- File grouping into tasks ----------------------------------------
      # Default 128 MB packs many tiny .gz files into a single task, hurting
      # parallelism, failure recovery and S3-thread utilization. Drop to
      # 16 MB and lower the per-file open-cost estimate so Spark plans many
      # small, balanced tasks instead of a few fat ones.
      spark.sql.files.maxPartitionBytes: "16777216"
      spark.sql.files.openCostInBytes: "1048576"
  access_control_list:
    group_name: auditlogs
    permission_level: CAN_MANAGE
  databricks_conn_id: databricks_new
