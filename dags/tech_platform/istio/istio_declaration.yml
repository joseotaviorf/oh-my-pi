dag:
  name: istio
  schedule_start_date: 2024, 10, 1
  schedule_interval: 0 * * * *
  owner: Tech Platform Cyber Security
  documentation:
    dag_purpose: |
      This dag extracts and cleans istio access logs.

workflow:
  layer: clean
  type: query_delta
  load_spark_job: istio_logs_load
  custom_schema: access_logs
  spark_job_arguments:
    - "{dag_name}"
    - "{environment}"
    - "{bucket}"
    - "{schema}"
    - "{{ ts }}"
    - "{table_name}"
    - "{partitions}"
  default_extraction_type: incremental
  default_partitions: [year, month, day, hour]
  tables_customization:
    istio:
      merge_on: [year, month, day, hour, id_request]
  default_table_privileges:
    auditlogs: ["ALL PRIVILEGES"]

cluster:
  type: consolidation_m_general_single_node_cluster
  custom_configurations:
    spark_conf:
      spark.sql.legacy.json.allowEmptyString.enabled: "true"
  access_control_list:
    group_name: auditlogs
    permission_level: CAN_MANAGE
  databricks_conn_id: databricks_new
