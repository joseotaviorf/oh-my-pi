cluster:
  type: consolidation_xs_memory_cluster
  databricks_conn_id: databricks_new
  access_control_list:
    group_name: auditlogs
    permission_level: CAN_MANAGE
  custom_configurations:
    spark_conf:
      spark.sql.legacy.json.allowEmptyString.enabled: 'true'
      spark.hadoop.fs.s3a.threads.max: '64'
      spark.hadoop.fs.s3a.connection.maximum: '200'
      spark.sql.sources.parallelPartitionDiscovery.parallelism: '400'
      spark.sql.files.maxPartitionBytes: '67108864'
      spark.sql.files.openCostInBytes: '1048576'
    num_workers: 5
    driver_node_type_id: m7g.large
