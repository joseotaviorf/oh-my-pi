dag:
  name: devlake
  owner: Tech Platform Engineering Productivity
  catchup: false
  schedule_start_date: "2026, 1, 1"
  schedule_interval: 0 4 * * *
  documentation:
    dag_purpose: |
      Ingests core DevLake tables from MySQL into the datalake (raw + clean layers).
      Source: DevLake RDS (devlake-prod.ciuoqxapzjot.us-east-1.rds.amazonaws.com).
      Tables: pull_requests, pr_custom_metrics, pull_request_team, pull_request_commits, pull_request_comments, repos, teams, users.
      Runs daily at 4 AM UTC; serves as the upstream dependency for dw_devlake.
workflow:
  type: cdc
  layer: raw
  database_type: mysql
  dbutils_secret_key: DEVLAKE_DB
  lineage_product_database_name: devlake
  custom_schema: devlake
  source_schema: devlake
  tables_customization:
    pull_requests:
      raw_primary_keys: [id]
      clean_table_name: pull_requests
      clean_primary_keys: [id_pr]
    pr_custom_metrics:
      raw_primary_keys: [id]
      clean_table_name: pr_custom_metrics
      clean_primary_keys: [id_pr]
    pull_request_team:
      raw_primary_keys: [base_repo_id, pull_request_key, team_id]
      clean_table_name: pull_request_team
      clean_primary_keys: [id_repo, pr_key, id_team]
    repos:
      raw_primary_keys: [id]
      clean_table_name: repos
      clean_primary_keys: [id_repo]
    teams:
      raw_primary_keys: [id]
      clean_table_name: teams
      clean_primary_keys: [id_team]
    pull_request_commits:
      raw_primary_keys: [commit_sha, pull_request_id]
      clean_table_name: pull_request_commits
      clean_primary_keys: [commit_sha, id_pr]
    pull_request_comments:
      raw_primary_keys: [id]
      clean_table_name: pull_request_comments
      clean_primary_keys: [id_comment]
    users:
      raw_primary_keys: [id]
      clean_table_name: users
      clean_primary_keys: [id_user]
