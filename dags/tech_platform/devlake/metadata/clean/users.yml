database_name: datalake_devlake_clean
table_name: users
owner: luciano.holanda@quintoandar.com.br
domain: Tech Platform
description: Standardized catalog user records from DevLake, synced from Backstage. One row per Backstage user in scope. The github_username column enables attribution of GitHub activity (PRs, commits) to organizational identities. user_chapter holds Backstage spec.chapter for functional breakdowns. Used in dw_devlake as the source for dim_user (role-playing for author, merger, and future assignee dimensions).
columns:
  id_user:
    description: DevLake user ID (stable identifier from Backstage)
    lineage:
      - datalake_devlake_raw.users.id
  user_email:
    description: Corporate email address from Backstage
    lineage:
      - datalake_devlake_raw.users.email
  github_username:
    description: GitHub username associated with this person when present in Backstage
    lineage:
      - datalake_devlake_raw.users.github_user
  user_name:
    description: Display name of the person from Backstage
    lineage:
      - datalake_devlake_raw.users.name
  user_chapter:
    description: Backstage functional chapter (e.g. engineering, data, design). Nullable when not set in catalog.
    lineage:
      - datalake_devlake_raw.users.chapter
