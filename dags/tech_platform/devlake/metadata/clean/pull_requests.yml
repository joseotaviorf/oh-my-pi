database_name: datalake_devlake_clean
table_name: pull_requests
owner: luciano.holanda@quintoandar.com.br
domain: Tech Platform
description: Standardized GitHub pull requests from DevLake. One row per pull request. Columns renamed to follow QuintoAndar naming conventions (id_ prefix for keys, ts_ for timestamps, is_ for booleans). Primary source for PR cycle time and engineering velocity analysis.
columns:
  id_pr:
    description: Stable DevLake surrogate identifier for the GitHub pull request in the engineering metrics pipeline.
    lineage:
      - datalake_devlake_raw.pull_requests.id
  id_repo:
    description: DevLake surrogate repo ID (FK to datalake_devlake_clean.repos.id_repo)
    lineage:
      - datalake_devlake_raw.pull_requests.base_repo_id
  pr_key:
    description: GitHub PR number within the repository
    lineage:
      - datalake_devlake_raw.pull_requests.pull_request_key
  pr_title:
    description: Human-readable GitHub pull request title captured by DevLake for search and velocity reporting.
    lineage:
      - datalake_devlake_raw.pull_requests.title
  pr_status:
    description: "PR status: OPEN, MERGED, or CLOSED"
    lineage:
      - datalake_devlake_raw.pull_requests.status
  pr_base_branch:
    description: Target branch name (e.g. main, master)
    lineage:
      - datalake_devlake_raw.pull_requests.base_ref
  id_author_user:
    description: DevLake user ID of the PR author (FK to datalake_devlake_clean.users.id_user)
    lineage:
      - datalake_devlake_raw.pull_requests.author_id
  author_name:
    description: GitHub username of the PR author
    lineage:
      - datalake_devlake_raw.pull_requests.author_name
  id_merged_by_user:
    description: DevLake user ID of the user who merged the PR (FK to datalake_devlake_clean.users.id_user)
    lineage:
      - datalake_devlake_raw.pull_requests.merged_by_id
  merged_by_name:
    description: GitHub username of the user who merged the PR
    lineage:
      - datalake_devlake_raw.pull_requests.merged_by_name
  is_merged:
    description: "Derived from status: TRUE when PR status is MERGED"
    lineage:
      - datalake_devlake_raw.pull_requests.status
  pr_additions:
    description: Number of lines added in the PR
    lineage:
      - datalake_devlake_raw.pull_requests.additions
  pr_deletions:
    description: Number of lines deleted in the PR
    lineage:
      - datalake_devlake_raw.pull_requests.deletions
  pr_type:
    description: "PR type from conventional commit prefix: feat, fix, chore, refactor, docs, test, style, perf"
    lineage:
      - datalake_devlake_raw.pull_requests.x_type
  ts_created:
    description: Timestamp when the PR was created
    lineage:
      - datalake_devlake_raw.pull_requests.created_date
  is_draft:
    description: True when the PR is in draft state
    lineage:
      - datalake_devlake_raw.pull_requests.is_draft
  ts_merged:
    description: Timestamp when the PR was merged (null if not merged)
    lineage:
      - datalake_devlake_raw.pull_requests.merged_date
