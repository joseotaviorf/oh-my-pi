database_name: datalake_devlake_raw
table_name: users
owner: luciano.holanda@quintoandar.com.br
domain: Tech Platform
description: Raw snapshot of catalog users synced daily from Backstage by the devlake-automations sync-users-and-teams cronjob. The github_user column is a custom addition that maps corporate identity to GitHub username, enabling PR authorship attribution. The chapter column stores Backstage spec.chapter when present.
columns:
  id:
    description: DevLake user ID (stable identifier from Backstage)
  email:
    description: Corporate email address from Backstage profile
  github_user:
    description: GitHub username when present (custom column added by devlake-automations)
  name:
    description: Display name from Backstage
  chapter:
    description: Backstage spec.chapter (functional chapter). Populated by sync-users-and-teams after migration adding the column.
