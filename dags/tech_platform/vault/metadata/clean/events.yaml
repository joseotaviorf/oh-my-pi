database_name: datalake_vault_audit_logs
table_name: events
description: |
  Clean HashiCorp Vault audit events parsed from gzipped JSON request logs in S3.
  One row per Vault API operation with authentication context, policy evaluation outcome,
  and request metadata for secrets-management compliance and security investigations.
domain: Tech Platform
owner: thiago.costa@quintoandar.com.br
columns:
  ts_event:
    lineage:
      - s3_auditlogs_bucket.time
    description: UTC timestamp when Vault recorded the audited API operation.
  id_request:
    lineage:
      - s3_auditlogs_bucket.request.id
    description: Unique Vault request identifier used to correlate related audit entries.
  type:
    lineage:
      - s3_auditlogs_bucket.type
    description: Vault audit event category, such as request, response, or service-level audit type.
  time:
    lineage:
      - s3_auditlogs_bucket.time
    description: Raw RFC3339 timestamp string from the Vault audit payload before normalization.
  display_name:
    lineage:
      - s3_auditlogs_bucket/auth.display_name
    description: Human-readable name of the authenticated Vault entity that performed the operation.
  policies:
    lineage:
      - s3_auditlogs_bucket/auth.policies
    description: Array of Vault ACL policy names attached to the token at authentication time.
  token_policies:
    lineage:
      - s3_auditlogs_bucket/auth.token_policies
    description: Array of policy names embedded directly on the token used for the request.
  allowed:
    lineage:
      - s3_auditlogs_bucket/auth.policy_results.allowed
    description: Policy evaluation outcome indicating whether Vault permitted the requested operation.
  granting_policies:
    lineage:
      - s3_auditlogs_bucket/auth.policy_results.granting_policies
    description: Structured list of Vault policies that granted access for the evaluated request.
  role:
    lineage:
      - s3_auditlogs_bucket/auth.metadata.role
    description: Authentication role metadata associated with the token, such as approle or kubernetes role.
  entity_id:
    lineage:
      - s3_auditlogs_bucket/auth.entity_id
    description: Stable Vault identity entity identifier linked to the authenticated caller.
  token_type:
    lineage:
      - s3_auditlogs_bucket/auth.token_type
    description: Vault token class used for the request, such as service, batch, or default token.
  token_ttl:
    lineage:
      - s3_auditlogs_bucket/auth.token_ttl
    description: Remaining time-to-live in seconds configured on the token at request time.
  token_issue_time:
    lineage:
      - s3_auditlogs_bucket/auth.token_issue_time
    description: Timestamp when the Vault token was originally issued to the authenticated entity.
  request_id:
    lineage:
      - s3_auditlogs_bucket.request.id
    description: Duplicate of the Vault request identifier preserved from the nested request object.
  client_id:
    lineage:
      - s3_auditlogs_bucket.request.client_id
    description: Vault client identifier associated with the API caller when present in the audit log.
  operation:
    lineage:
      - s3_auditlogs_bucket.request.operation
    description: Vault API operation attempted, such as read, write, delete, or list on a secret path.
  mount_point:
    lineage:
      - s3_auditlogs_bucket.request.mount_point
    description: Vault secrets engine mount path targeted by the audited API call.
  mount_type:
    lineage:
      - s3_auditlogs_bucket.request.mount_type
    description: Secrets engine type backing the mount, such as kv, database, or transit.
  namespace:
    lineage:
      - s3_auditlogs_bucket.request.namespace.id
    description: Vault enterprise namespace identifier scoping the audited request when enabled.
  path:
    lineage:
      - s3_auditlogs_bucket.request.path
    description: Full logical secret or configuration path accessed within the Vault mount.
  remote_address:
    lineage:
      - s3_auditlogs_bucket.request.remote_address
    description: IP address of the remote client that initiated the Vault API request.
  remote_port:
    lineage:
      - s3_auditlogs_bucket.request.remote_port
    description: TCP port of the remote client connection to the Vault API endpoint.
  year:
    lineage:
      - s3_auditlogs_bucket.time
    description: Partition year derived from ts_event; filter on this column for partition pruning.
  month:
    lineage:
      - s3_auditlogs_bucket.time
    description: Partition month derived from ts_event; filter on this column for partition pruning.
  day:
    lineage:
      - s3_auditlogs_bucket.time
    description: Partition day derived from ts_event; filter on this column for partition pruning.
  hour:
    lineage:
      - s3_auditlogs_bucket.time
    description: Partition hour derived from ts_event; filter on this column for partition pruning.
