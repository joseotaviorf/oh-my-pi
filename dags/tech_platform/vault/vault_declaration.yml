dag:
  name: vault
  schedule_start_date: 2025, 07, 29
  schedule_interval: 0 1 * * *
  owner: Tech Platform Cyber Security
  documentation:
    dag_purpose: |
      This DAG loads and cleans Vault audit logs.

workflow:
  layer: clean
  type: query_delta
  custom_schema: vault_audit_logs
  spark_job_arguments:
    - "{dag_name}"
    - "{environment}"
    - "{bucket}"
    - "{schema}"
    - "{{ ts }}"
    - "{table_name}"
    - "{partitions}"
  default_extraction_type: incremental
  default_partitions: [year, month, day]
  has_hive_sync: false
  tables_customization:
    events:
      load_spark_job: events_load
      merge_on: [year, month, day, id_request]
  default_table_privileges:
    auditlogs: ["ALL PRIVILEGES"]

