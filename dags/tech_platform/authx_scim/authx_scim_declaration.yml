dag:
  name: authx_scim
  schedule_start_date: 2025, 02, 03
  schedule_interval: 0 1 * * *
  owner: Tech Platform Cyber Security
  documentation:
    dag_purpose: |
      This DAG extracts authx-scim data and injects into the datalake
workflow:
  type: cdc
  layer: raw
  dbutils_secret_key: AUTHX-SCIM_DB
  database_type: postgres
  source_schema: public
  source_database: authx-scim
  custom_schema: authx_scim
  tables_customization:
    users: {}
    entitlements: {}
    user_entitlements: {}
    users_audit: {}
    openapis: {}
  default_table_privileges:
    auditlogs: ["ALL PRIVILEGES"]
cluster:
  type: emr_7_12_min_general_2_workers_cluster
  custom_configurations:
    driver_node_type_id: m7a.xlarge
    node_type_id: r7a.xlarge
    num_task_workers: 1
