database_name: datalake_authx_scim_clean
table_name: users
description: |
  Clean user identities provisioned through the AuthX SCIM service from upstream identity sources.
  One row per SCIM user with lifecycle timestamps for identity platform audits and access reviews.
domain: Tech Platform
owner: luciane.lopes@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_authx_scim_raw.users.id
    description: Surrogate primary key of the SCIM user record in the AuthX identity store.
  source:
    lineage:
      - datalake_authx_scim_raw.users.source
    description: Upstream identity provider or connector slug that originated the SCIM user account.
  email:
    lineage:
      - datalake_authx_scim_raw.users.user_name
    description: Canonical login email (SCIM userName) used to match corporate and application accounts.
  active:
    lineage:
      - datalake_authx_scim_raw.users.active
    description: Boolean flag indicating whether the SCIM user is currently active for provisioning flows.
  ts_created:
    lineage:
      - datalake_authx_scim_raw.users.created_at
    description: UTC timestamp when the user record was first created in AuthX SCIM.
  ts_updated:
    lineage:
      - datalake_authx_scim_raw.users.updated_at
    description: UTC timestamp of the most recent attribute update on the SCIM user.
  ts_deleted:
    lineage:
      - datalake_authx_scim_raw.users.deleted_at
    description: UTC soft-delete timestamp when the user was deprovisioned; null while active.
