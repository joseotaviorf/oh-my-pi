database_name: datalake_authx_scim_clean
table_name: users
description: This table contains the users from the authx-scim database
domain: Tech Platform
owner: identityplatform-team@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_authx_scim_raw.users.id
    description: Unique user identifier
  source:
    lineage:
      - datalake_authx_scim_raw.users.source
    description: The source of where the user comes from
  email:
    lineage:
      - datalake_authx_scim_raw.users.user_name
