database_name: datalake_authx_scim_clean
table_name: users_audit
description: |
  Clean change-history audit trail for SCIM user lifecycle operations in AuthX.
  One row per CREATE, UPDATE, DELETE, or REACTIVATE action with payload snapshot for compliance review.
domain: Tech Platform
owner: luciane.lopes@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_authx_scim_raw.users_audit.id
    description: Surrogate primary key of the user audit event in the AuthX SCIM store.
  user_id:
    lineage:
      - datalake_authx_scim_raw.users_audit.user_id
    description: Foreign key to the SCIM user record that was created, updated, or deprovisioned.
  method:
    lineage:
      - datalake_authx_scim_raw.users_audit.method
    description: Lifecycle operation performed — CREATE, UPDATE, DELETE, or REACTIVATE on the user.
  data:
    lineage:
      - datalake_authx_scim_raw.users_audit.data
    description: JSON snapshot of user attributes captured at the time of the audited operation.
  ts_created:
    lineage:
      - datalake_authx_scim_raw.users_audit.created_at
    description: UTC timestamp when the audited user lifecycle operation was recorded.
