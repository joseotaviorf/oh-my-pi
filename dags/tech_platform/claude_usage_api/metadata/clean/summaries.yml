database_name: datalake_claude_usage_clean
table_name: summaries
owner: gabriel.berger@quintoandar.com.br
domain: Tech Platform
description: |
  Claude Enterprise organization-level activity summaries for QuintoAndar's workforce.
  One row per dt_starting and dt_ending after deduplication from overlapping raw loads.
  Flattens vendor JSON from the Analytics summaries endpoint into typed columns.
columns:
  count_assigned_seats:
    description: Number of seats currently assigned to organization members as of this snapshot.
    lineage:
      - datalake_claude_usage_raw.summaries.payload

  count_pending_invites:
    description: Number of pending invitations to join the organization as of this snapshot.
    lineage:
      - datalake_claude_usage_raw.summaries.payload

  count_daily_active_users:
    description: Number of users with any Claude token consumption on the day.
    lineage:
      - datalake_claude_usage_raw.summaries.payload

  count_weekly_active_users:
    description: Number of users with Claude token consumption in the trailing 7-day rolling window.
    lineage:
      - datalake_claude_usage_raw.summaries.payload

  count_monthly_active_users:
    description: Number of users with Claude token consumption in the trailing 30-day rolling window.
    lineage:
      - datalake_claude_usage_raw.summaries.payload

  pct_daily_adoption:
    description: Percentage of assigned seats active on the day (daily active users divided by assigned seat count, times 100).
    lineage:
      - datalake_claude_usage_raw.summaries.payload

  pct_weekly_adoption:
    description: Percentage of assigned seats active in the trailing 7-day window (weekly active users divided by assigned seat count, times 100).
    lineage:
      - datalake_claude_usage_raw.summaries.payload

  pct_monthly_adoption:
    description: Percentage of assigned seats active in the trailing 30-day window (monthly active users divided by assigned seat count, times 100).
    lineage:
      - datalake_claude_usage_raw.summaries.payload

  count_chat_daily_active_users:
    description: Number of users with Claude.ai chat activity on the day.
    lineage:
      - datalake_claude_usage_raw.summaries.payload

  count_chat_weekly_active_users:
    description: Number of users with Claude.ai chat activity in the trailing 7-day rolling window.
    lineage:
      - datalake_claude_usage_raw.summaries.payload

  count_chat_monthly_active_users:
    description: Number of users with Claude.ai chat activity in the trailing 30-day rolling window.
    lineage:
      - datalake_claude_usage_raw.summaries.payload

  count_claude_code_daily_active_users:
    description: Number of users with Claude Code activity on the day.
    lineage:
      - datalake_claude_usage_raw.summaries.payload

  count_claude_code_weekly_active_users:
    description: Number of users with Claude Code activity in the trailing 7-day rolling window.
    lineage:
      - datalake_claude_usage_raw.summaries.payload

  count_claude_code_monthly_active_users:
    description: Number of users with Claude Code activity in the trailing 30-day rolling window.
    lineage:
      - datalake_claude_usage_raw.summaries.payload

  count_claude_design_daily_active_users:
    description: Number of users with Claude Design activity on the day.
    lineage:
      - datalake_claude_usage_raw.summaries.payload

  count_claude_design_weekly_active_users:
    description: Number of users with Claude Design activity in the trailing 7-day rolling window.
    lineage:
      - datalake_claude_usage_raw.summaries.payload

  count_claude_design_monthly_active_users:
    description: Number of users with Claude Design activity in the trailing 30-day rolling window.
    lineage:
      - datalake_claude_usage_raw.summaries.payload

  count_cowork_daily_active_users:
    description: Number of users with Cowork activity on the day.
    lineage:
      - datalake_claude_usage_raw.summaries.payload

  count_cowork_weekly_active_users:
    description: Number of users with Cowork activity in the trailing 7-day rolling window.
    lineage:
      - datalake_claude_usage_raw.summaries.payload

  count_cowork_monthly_active_users:
    description: Number of users with Cowork activity in the trailing 30-day rolling window.
    lineage:
      - datalake_claude_usage_raw.summaries.payload

  count_office_agent_daily_active_users:
    description: Number of users with Office Agent activity (Excel, Outlook, PowerPoint, or Word) on the day.
    lineage:
      - datalake_claude_usage_raw.summaries.payload

  count_office_agent_weekly_active_users:
    description: Number of users with Office Agent activity (Excel, Outlook, PowerPoint, or Word) in the trailing 7-day rolling window.
    lineage:
      - datalake_claude_usage_raw.summaries.payload

  count_office_agent_monthly_active_users:
    description: Number of users with Office Agent activity (Excel, Outlook, PowerPoint, or Word) in the trailing 30-day rolling window.
    lineage:
      - datalake_claude_usage_raw.summaries.payload

  count_science_daily_active_users:
    description: Number of users with Claude Science activity on the day.
    lineage:
      - datalake_claude_usage_raw.summaries.payload

  count_science_weekly_active_users:
    description: Number of users with Claude Science activity in the trailing 7-day rolling window.
    lineage:
      - datalake_claude_usage_raw.summaries.payload

  count_science_monthly_active_users:
    description: Number of users with Claude Science activity in the trailing 30-day rolling window.
    lineage:
      - datalake_claude_usage_raw.summaries.payload

  count_science_entitled_users:
    description: Number of users with a Claude Science seat entitlement (per-seat RBAC) as of this snapshot, independent of whether Claude Science is actively used.
    lineage:
      - datalake_claude_usage_raw.summaries.payload

  dt_starting:
    description: Start date (UTC) of the aggregation period this summary snapshot covers.
    lineage:
      - datalake_claude_usage_raw.summaries.payload

  dt_ending:
    description: End date (UTC, exclusive) of the aggregation period this summary snapshot covers.
    lineage:
      - datalake_claude_usage_raw.summaries.payload

  ts_load:
    description: Timestamp when the Spark api_ingestion job wrote the source raw row.
    lineage:
      - datalake_claude_usage_raw.summaries.ts_load

  year:
    description: Ingestion partition year, derived from the vendor's starting_at date in the API payload (date_filter_column), not the load timestamp.
    lineage:
      - datalake_claude_usage_raw.summaries.year

  month:
    description: Ingestion partition month, derived from the vendor's starting_at date in the API payload (date_filter_column), not the load timestamp.
    lineage:
      - datalake_claude_usage_raw.summaries.month

  day:
    description: Ingestion partition day, derived from the vendor's starting_at date in the API payload (date_filter_column), not the load timestamp.
    lineage:
      - datalake_claude_usage_raw.summaries.day
