---
table_name: datalake_claude_usage_clean.user_cost
alert_channel: PEOPLE_ALERTS

table_level_validations:
  has_size:
    greater_than: 1
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: -10
    less_than_or_equal_to: 25
    severity_level: Error

column_level_validations:
  dt_starting:
    is_complete:
      severity_level: Warning

  dt_ending:
    is_complete:
      severity_level: Warning

  id_user:
    is_complete:
      severity_level: Warning

  currency:
    is_complete:
      severity_level: Warning

  one_row_per_user_currency_and_period:
    custom:
      # Grain uniqueness: exactly one row per id_user, currency, dt_starting, and dt_ending after deduplication.
      constraint: |-
        (SELECT COUNT(*)
         FROM (
           SELECT id_user, currency, dt_starting, dt_ending
           FROM datalake_claude_usage_clean.user_cost
           GROUP BY id_user, currency, dt_starting, dt_ending
           HAVING COUNT(*) > 1
         )
        ) = 0
      severity_level: Error
