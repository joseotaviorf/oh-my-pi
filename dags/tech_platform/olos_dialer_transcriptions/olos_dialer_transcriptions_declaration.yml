dag:
  name: olos_dialer_transcriptions
  schedule_start_date: 2026, 07, 02
  schedule_interval: 0 10 * * *
  owner: Tech Platform Workforce Productivity
  documentation:
    dag_purpose: |
      This DAG loads and cleans audio transcriptions of Olos dialer (outbound)
      calls generated by the MonalisaAudioAITranscriptionPerformer rpa.

workflow:
  layer: clean
  type: query_delta
  load_spark_job: olos_dialer_transcriptions_load
  custom_schema: olos_dialer_transcriptions
  spark_job_arguments:
  - "{dag_name}"
  - "{environment}"
  - "{bucket}"
  - "{schema}"
  - "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, -2), 'load_start_date') }}"
  - "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  - "{table_name}"
  - "{partitions}"
  default_extraction_type: incremental
  default_partitions: [year, month, day]
  tables_customization:
    olos_dialer_transcriptions:
      merge_on: [id_call]
