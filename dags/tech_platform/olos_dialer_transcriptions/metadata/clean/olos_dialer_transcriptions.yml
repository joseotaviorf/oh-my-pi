database_name: datalake_olos_dialer_transcriptions_clean
table_name: olos_dialer_transcriptions
description: Cleaned audio transcriptions of Olos dialer (outbound) calls generated by the MonalisaAudioAITranscriptionPerformer. One row per call (id_call); the stored values reflect the latest transcription analysis for that call. Partitioned by the call/audio date (year/month/day). Used for outbound contact quality and conversation analytics.
domain: Tech Platform
owner: rpa-team@quintoandar.com.br
columns:
  id_call:
    lineage:
      - s3_monalisa_bucket/olos_dialer_transcriptions.id_call
    description: Unique identifier of the Olos dialer call the transcription belongs to.
  id_analysis:
    lineage:
      - s3_monalisa_bucket/olos_dialer_transcriptions.analysis_id
    description: Identifier of the latest audio AI analysis that produced the stored transcription for the call (random per analysis; not a uniqueness key).
  transcription:
    lineage:
      - s3_monalisa_bucket/olos_dialer_transcriptions.transcription
    description: Full text transcription of the outbound call audio.
  ts_analyzed:
    lineage:
      - s3_monalisa_bucket/olos_dialer_transcriptions.ts_analysis
    description: Timestamp when the audio analysis that generated the transcription was performed.
  year:
    lineage:
      - s3_monalisa_bucket/olos_dialer_transcriptions.year
    description: Year of the call/audio date, taken from the ingested S3 day partition (year=). Reflects when the call happened, not when it was transcribed. Partition key.
  month:
    lineage:
      - s3_monalisa_bucket/olos_dialer_transcriptions.month
    description: Month of the call/audio date, taken from the ingested S3 day partition (month=). Partition key.
  day:
    lineage:
      - s3_monalisa_bucket/olos_dialer_transcriptions.day
    description: Day of the call/audio date, taken from the ingested S3 day partition (day=). Partition key.
