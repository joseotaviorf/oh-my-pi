dag:
  name: application_audit_logs
  schedule_start_date: 2026, 01, 02
  schedule_interval: 0 * * * *
  owner: Tech Platform Cyber Security
  documentation:
    dag_purpose: |
      This dag extracts and cleans applications audit logs.

workflow:
  layer: clean
  type: query_delta
  load_spark_job: application_audit_logs_load
  custom_schema: application_audit_logs
  spark_job_arguments:
    - "{dag_name}"
    - "{environment}"
    - "{bucket}"
    - "{schema}"
    - "{{ ts }}"
    - "{table_name}"
    - "{partitions}"
    - "--table-privileges"
    - "{table_privileges}"
  default_extraction_type: incremental
  default_partitions: [year, month, day, hour]
  tables_customization:
    logs:
      merge_on: [year, month, day, hour, id_trace, id_log]
  default_table_privileges:
    auditlogs: ["ALL PRIVILEGES"]

