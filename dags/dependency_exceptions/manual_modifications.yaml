bietlejuice.benvi_manager_clean:
  # Clean SQL reads datalake_benvi_manager_raw.lake_mirror. That raw table has no
  # metadata file, so the query scanner cannot map it to a producer. Depend on
  # the CDC DAG's load-clean-lake-mirror (dump after raw). The dependency
  # validator only accepts tables that exist as query/metadata in the producer
  # DAG. Use the plain URI so every import REST trigger can start projections,
  # not only the first run of the day.
  add:
    - bietlejuice.benvi_manager:load-clean-lake-mirror
bietlejuice.jira_open_incidents_report:
  # Spark job SQL is not scanned by the query-file dependency generator.
  add:
    - bietlejuice.enrich_jira:load-enrich-issues:first-run-of-day
bietlejuice.jira_escalation_hierarchy:
  # Spark job SQL is not scanned by the query-file dependency generator (queries are
  # inline Python). Reads datalake_jira.issues (enrich_jira) and dw_people.dim_employee /
  # dw_people.dim_management_hierarchy (the "public" People subdomain — dw_employee_details
  # is access-restricted). Documentation/lineage only — the DAG is cron-scheduled (09:00),
  # not dataset-triggered.
  add:
    - bietlejuice.enrich_jira:load-enrich-issues:first-run-of-day
    - bietlejuice.dw_people:load-dw-people-dim-employee:first-run-of-day
    - bietlejuice.dw_people:load-dw-people-dim-management-hierarchy:first-run-of-day
bietlejuice.enrich_agents_matias:
  # HTML transcript LEFT JOINs knowledge_base.bot_content for article titles only.
  # Drop the Airflow wait so the muted CDC DAG can stay on the Jira Ops mute list.
  remove:
    - bietlejuice.knowledge_base:load-clean-bot-content:first-run-of-day
bietlejuice.enrich_jira:
  # jira now runs at 00:00 AND 08:00 (second run added for jira_open_incidents_report's
  # 09:00 cron). Swap the default ":first-run-of-day" edge for the plain one so enrich_jira
  # re-runs after the 08:00 pull too, instead of only reacting to the first run of the day.
  add:
    - bietlejuice.jira:load-clean-issues
  remove:
    - bietlejuice.jira:load-clean-issues:first-run-of-day
bietlejuice.amplitude_subpartitioned:
  # Queries read the base Delta table datalake_amplitude_events_clean.events directly (to
  # restore partition pruning) instead of the datalake_amplitude_clean.events SELECT * view
  # that amplitude_new declares as its output, so the generator can no longer infer this edge.
  # The data dependency on amplitude_new's clean-events load is real; keep it.
  add:
    - bietlejuice.amplitude_new:load-clean-events:first-run-of-day
