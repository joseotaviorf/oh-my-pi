---
bietlejuice.amplitude:
  is_static: false
  custom_task_names:
    - task_name: load-subpartitioned-event-tables-to-clean
      table_name_condition_regex: \d+_\w+_events
bietlejuice.dw_country:
  is_static: true
bietlejuice.dw_datamarts_spark.static:
  is_static: true
bietlejuice.dw_date:
  is_static: true
bietlejuice.enrich_public_date:
  is_static: true
bietlejuice.enrich_static_files:
  is_static: true
bietlejuice.enrich_talk_to_agent:
  is_static: true
bietlejuice.enrich_velo_omie:
  is_static: true
bietlejuice.velo_omie:
  is_static: true

bietlejuice.gsheets: &gsheets-default
  is_static: false
  custom_task_names:
    - task_name: done-{slugged_layer}-{slugged_table_name}
      table_name_condition_regex: .*
bietlejuice.gsheets_agents: *gsheets-default
bietlejuice.gsheets_benvi: *gsheets-default
bietlejuice.gsheets_cross: *gsheets-default
bietlejuice.gsheets_fintech: *gsheets-default
bietlejuice.gsheets_for_rent: *gsheets-default
bietlejuice.gsheets_for_rent_targets: *gsheets-default
bietlejuice.gsheets_for_sale: *gsheets-default
bietlejuice.gsheets_growth: *gsheets-default
bietlejuice.gsheets_growth_intraday: *gsheets-default
bietlejuice.gsheets_growth_targets: *gsheets-default
bietlejuice.gsheets_support_and_service: *gsheets-default
bietlejuice.gsheets_static:
  <<: *gsheets-default
  is_static: true
