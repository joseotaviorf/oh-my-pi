owner: guilherme.sacramento@quintoandar.com.br
domain: Fintech
columns:
  id_offer_partner:
    lineage:
      - datalake_nazare_raw.offer_partner.id
    description: Internal identifier of the offer–partner association in Nazare.
  id_partner:
    lineage:
      - datalake_nazare_raw.offer_partner.partner_id
    description: Nazare partner identifier linked to the offer.
  id_offer:
    lineage:
      - datalake_nazare_raw.offer_partner.offer_id
    description: Nazare offer identifier this partner participates in.
  agent_role:
    lineage:
      - datalake_nazare_raw.offer_partner.role
