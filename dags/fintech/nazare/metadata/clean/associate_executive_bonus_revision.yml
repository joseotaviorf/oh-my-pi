---
database_name: datalake_nazare_clean
table_name: associate_executive_bonus_revision
description: Revision history for Nazare associate executive bonus rules, storing the bonus fee (gross advance) of each revision used in revenue-share calculations with executives.
owner: guilherme.sacramento@quintoandar.com.br
domain: Fintech
columns:
  id_associate_executive_bonus:
    lineage:
      - datalake_nazare_raw.associate_executive_bonus_revision.id
    description: Identifier of the associate executive bonus rule this revision belongs to.
  revision:
    lineage:
      - datalake_nazare_raw.associate_executive_bonus_revision.revision
    description: Sequential revision number of the bonus configuration.
  gross_advance:
    lineage:
      - datalake_nazare_raw.associate_executive_bonus_revision.bonus_fee
    description: Bonus fee (gross advance) applied in this revision of the associate executive bonus rule.
  ts_invalidated:
    lineage:
      - datalake_nazare_raw.associate_executive_bonus_revision.invalidated_at
    description: Timestamp when this revision was invalidated in Nazare; null means the revision is still valid.
  ts_created:
    lineage:
      - datalake_nazare_raw.associate_executive_bonus_revision.created_at
    description: Timestamp when this revision was created in Nazare.
