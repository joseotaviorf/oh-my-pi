---
database_name: datalake_nazare_clean
table_name: hub_bonus_revision
description: Revision history for Nazare hub bonus rules, storing the bonus fee (gross advance) of each revision used in revenue-share calculations.
owner: guilherme.sacramento@quintoandar.com.br
domain: Fintech
columns:
  id_hub_bonus:
    lineage:
      - datalake_nazare_raw.hub_bonus_revision.id
    description: Identifier of the hub bonus rule this revision belongs to.
  revision:
    lineage:
      - datalake_nazare_raw.hub_bonus_revision.revision
    description: Sequential revision number of the hub bonus configuration.
  gross_advance:
    lineage:
      - datalake_nazare_raw.hub_bonus_revision.bonus_fee
    description: Bonus fee (gross advance) applied in this revision of the hub bonus rule.
  ts_invalidated:
    lineage:
      - datalake_nazare_raw.hub_bonus_revision.invalidated_at
    description: Timestamp when this revision was invalidated in Nazare; null means the revision is still valid.
  ts_created:
    lineage:
      - datalake_nazare_raw.hub_bonus_revision.created_at
    description: Timestamp when this revision was created in Nazare.
