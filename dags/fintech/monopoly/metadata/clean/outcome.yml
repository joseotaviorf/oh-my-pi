database_name: datalake_monopoly_clean
table_name: outcome
description:
  One row per outcome in the Fintech clean layer, sourced from
  datalake_monopoly_clean for payments, billing, and financial operations
  reporting.
owner: juliana.hocihara@quintoandar.com.br
domain: Fintech
columns:
  id:
    lineage:
      - datalake_monopoly_raw.outcome.id
    description: Financial attribute representing id on the outcome dataset.
  id_person_sale:
    lineage:
      - datalake_monopoly_raw.outcome.person_sale_id
    description: Identifier for the person sale referenced by this financial record.
  id_revenue_share:
    lineage:
      - datalake_monopoly_raw.outcome.revenue_share_id
    description: Identifier for the revenue share referenced by this financial record.
  event:
    lineage:
      - datalake_monopoly_raw.outcome.event
    description: Financial attribute representing event on the outcome dataset.
  amount:
    lineage:
      - datalake_monopoly_raw.outcome.amount
    description: Monetary amount in Brazilian Reais for the financial transaction or balance.
  outcome_status:
    lineage:
      - datalake_monopoly_raw.outcome.status
    description: Financial attribute representing outcome status on the outcome dataset.
  observations:
    lineage:
      - datalake_monopoly_raw.outcome.observations
    description: Financial attribute representing observations on the outcome dataset.
  dt_due:
    lineage:
      - datalake_monopoly_raw.outcome.due_date
    description: Calendar date associated with due in the financial workflow.
  ts_created:
    lineage:
      - datalake_monopoly_raw.outcome.created_at
    description: Timestamp when created occurred in the upstream fintech system.
  ts_updated:
    lineage:
      - datalake_monopoly_raw.outcome.updated_at
    description: Timestamp when updated occurred in the upstream fintech system.
