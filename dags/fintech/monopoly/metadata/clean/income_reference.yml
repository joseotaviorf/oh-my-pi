database_name: datalake_monopoly_clean
table_name: income_reference
description:
  One row per income reference in the Fintech clean layer, sourced from
  datalake_monopoly_clean for payments, billing, and financial operations
  reporting.
owner: juliana.hocihara@quintoandar.com.br
domain: Fintech
columns:
  id:
    lineage:
      - datalake_monopoly_raw.income_reference.id
    description: Financial attribute representing id on the income_reference dataset.
  id_income:
    lineage:
      - datalake_monopoly_raw.income_reference.income_id
    description: Identifier for the income referenced by this financial record.
  income_from:
    lineage:
      - datalake_monopoly_raw.income_reference.from
    description: Financial attribute representing income from on the income_reference dataset.
  amount:
    lineage:
      - datalake_monopoly_raw.income_reference.amount
    description: Monetary amount in Brazilian Reais for the financial transaction or balance.
  dt_income:
    lineage:
      - datalake_monopoly_raw.income_reference.income_date
    description: Calendar date associated with income in the financial workflow.
  ts_created:
    lineage:
      - datalake_monopoly_raw.income_reference.created_at
    description: Timestamp when created occurred in the upstream fintech system.
  ts_updated:
    lineage:
      - datalake_monopoly_raw.income_reference.updated_at
    description: Timestamp when updated occurred in the upstream fintech system.
