dag:
  name: monopoly
  owner: Data Fintech
  schedule_interval: 0 0,8,12 * * *
  documentation:
    dag_purpose: |
      Process data from Monopoly database (postgresql), retrieved using the CDC process.
      [Monopoly](https://github.com/quintoandar/monopoly) is a microservice responsible for payment and charge business rules of selling houses.
workflow:
  type: cdc
  layer: raw
  database_type: postgres
  tables_customization:
    accounting_entry:
      clean_table_name: accounting_entry
    income_reference:
      clean_table_name: income_reference
    income_status_log:
      clean_table_name: income_status_log
    income:
      clean_table_name: income
    nota_fiscal_emission_error:
      clean_table_name: nota_fiscal_emission_error
    outcome_reference:
      clean_table_name: outcome_reference
    outcome_status_log:
      clean_table_name: outcome_status_log
    outcome:
      clean_table_name: outcome
    person_sale:
      clean_table_name: person_sale
    person:
      clean_table_name: person
    revenue_share:
      clean_table_name: revenue_share
    sale_revision:
      clean_table_name: sale_revision
    sale_transaction:
      clean_table_name: sale_transaction
    sale:
      clean_table_name: sale
cluster:
  type: databricks_16_4_med_memory_cluster
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
