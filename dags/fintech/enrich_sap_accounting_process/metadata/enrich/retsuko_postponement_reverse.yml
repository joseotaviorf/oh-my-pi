database_name: datalake_sap_accounting_process
table_name: retsuko_postponement_reverse
owner: guilherme.sacramento@quintoandar.com.br
domain: Fintech
description:
  Table to track the reverse route of account 211407 (postponed invoice - PP), identifying postings that exist in the SAP ledger but that the forward straw cannot see, since retsuko_postponement starts from the Retsuko entry.
  The anchor is the whole account rather than a list of accounting rules, on purpose - any rule that starts posting to 211407 surfaces here instead of disappearing from the reconciliation.
  Three populations end up in this table. Postings whose entry exists but sits on a tenant owned invoice are the mirror of the account divergence bucket in the forward straw and carry that same status, since SAP booked them as PP while the ownership proxy reads them as IQ. Postings whose entry has no postponement record at all are genuine reverse straw failures. Postings with no finance entity entry are grouped by transaction and split between batch postings that reached the gateway without an entry id and adjustments typed straight into SAP by a user.
  Postings with no entry id whose gateway hash belongs to a dispatch of an entry already covered by retsuko_postponement are excluded on purpose. They are not unexplained postings - they are the same accounting event the forward straw already reconciles, and reporting them here would count the amount twice and turn a reconciled entry into a false failure.
  Together with retsuko_postponement this table partitions account 211407 with no overlap and no gap - the two tables sum to the ledger total for the account to the cent.
  All four assertion flags are FALSE by construction, so the table is read through accounting_process_status and error_description for root-cause analysis.
columns:
  id_accounting_process:
    description: Unique key for each record on this table, formatted as 'RE-RTSK-PSTP-{id_finance_entity_entry}' for entry level records and 'RE-RTSK-PSTP-MAN-{id_transaction}' for postings with no finance entity entry.
    lineage:
      - datalake_pas.ledger.id_finance_entity_entry
  id_business_entity:
    description: Business key for the contract as recorded in the SAP ledger.
    lineage:
      - datalake_pas.ledger.id_business_entity
  id_finance_entity:
    description: Business key for the invoice as recorded in the SAP ledger.
    lineage:
      - datalake_pas.ledger.id_finance_entity
  id_finance_entity_entry:
    description: Business key for the accounting entry in the SAP ledger. NULL for the records grouped by transaction, which have no entry id in the ledger.
    lineage:
      - datalake_pas.ledger.id_finance_entity_entry
  version:
    description: Version identifier from the source system, kept for schema compatibility with the forward straw. Always NULL here, since these records are read from SAP rather than from a source dispatch.
    lineage:
      - datalake_sap_accounting_process.retsuko_postponement_reverse.version
  business_unit:
    description: Identifier created in this table to segment the business unit, fixed as for rent.
    lineage:
      - datalake_sap_accounting_process.retsuko_postponement_reverse.business_unit
  source_name:
    description: Origin system label, fixed as S4 because these records are anchored on SAP rather than on a source event, following the convention of the other reverse straws.
    lineage:
      - datalake_sap_accounting_process.retsuko_postponement_reverse.source_name
  accounting_type:
    description: Type indicator used to segregate accounts, fixed as postponement to match the forward straw.
    lineage:
      - datalake_sap_accounting_process.retsuko_postponement_reverse.accounting_type
  account_number:
    description: Identifier of accounts used by controllership accounting process in SAP, fixed as 211407.
    lineage:
      - datalake_pas.ledger.account_number
  accounting_name:
    description: Human readable name for the SAP account, fixed as postponed invoice PP.
    lineage:
      - datalake_sap_accounting_process.retsuko_postponement_reverse.accounting_name
  source_amount:
    description: Value from the source system. Always NULL here, since these postings have no postponement dispatch that this table can attribute to account 211407.
    lineage:
      - datalake_sap_accounting_process.retsuko_postponement_reverse.source_amount
  sap_amount:
    description: Value recorded in SAP, summed over the 211407 ledger lines that share the same finance entity entry, or the same transaction for the records with no entry id.
    lineage:
      - datalake_pas.ledger.debit_credit
  is_completeness:
    description: Indicates whether the posting has a matching source dispatch on the PP route. Always FALSE in this table.
    lineage:
      - datalake_sap_accounting_process.retsuko_postponement_reverse.is_completeness
  is_correctness:
    description: TRUE if the deviation between source and SAP amounts is under R$0.05. Always FALSE here, since there is no source amount to compare against.
    lineage:
      - datalake_sap_accounting_process.retsuko_postponement_reverse.is_correctness
  is_temporality:
    description: TRUE if the SAP reference date falls in the accepted window around the source trigger. Always FALSE here, since there is no source trigger date.
    lineage:
      - datalake_sap_accounting_process.retsuko_postponement_reverse.is_temporality
  is_compliance:
    description: TRUE if completeness, correctness and temporality are all TRUE. Always FALSE here.
    lineage:
      - datalake_sap_accounting_process.retsuko_postponement_reverse.is_compliance
  accounting_process_status:
    description: "Classification of accounting status. 'account divergence' for postings whose postponement entry sits on a tenant owned invoice, mirroring the same status in the forward straw; 'reverse straw failure' for every other record."
    lineage:
      - datalake_sap_accounting_process.retsuko_postponement_reverse.accounting_process_status
  error_description:
    description: "Textual reason for the outcome. 'dispatched as IQ postponed invoice - accounted in 211407' marks the divergence records; 'source not dispatched by retsuko postponement' covers postings whose entry has no postponement record; 'source dispatched without finance entity entry' covers batch postings that reached the gateway with no entry id; 'manual transaction' covers adjustments typed straight into SAP, which have neither gateway hash nor finance entity; jobs that reached the gateway in error report the job type together with the webhook error or job status."
    lineage:
      - datalake_sap_accounting_process.retsuko_postponement_reverse.error_description
  accrual_year_month:
    description: Account reference in the format YYYYMM taken from the SAP ledger.
    lineage:
      - datalake_pas.ledger.accrual_year_month
  dt_source_trigger:
    description: Date of the source event that triggered the accounting entry. Always NULL here, since these postings have no source dispatch on the PP route.
    lineage:
      - datalake_sap_accounting_process.retsuko_postponement_reverse.dt_source_trigger
  dt_sap_reference:
    description: Reference date of the 211407 SAP posting.
    lineage:
      - datalake_pas.ledger.dt_reference
  dt_sap_created:
    description: Creation date of the 211407 SAP posting.
    lineage:
      - datalake_pas.ledger.dt_created
