database_name: datalake_sap_accounting_process
table_name: reverse_accounts_420003_420019_420020_420025_611012
owner: ae-finance-fintech@quintoandar.com.br
domain: fintech
description:
  Table to track reverse accounting entries for specific SAP accounts (420003, 420019, 420020, 420025, 611012) that exist in SAP but are missing in the source system (SeuBarriga/Retsuko).
  It identifies transactions that were manually created in SAP or have synchronization issues between source and SAP systems.
  The final output includes a status classification and failure reason to support monitoring and root-cause analysis for reverse accounting scenarios.
columns:
  id_accounting_process:
    description: Unique key for each record on this table, generated by concatenating 'RE-RTSK-RRA' with finance entity entry/entity and account number
    lineage:
      - .id_accounting_process
  id_business_entity:
    description: Business key for the contract, unique identifier for integration with external systems.
    lineage:
      - datalake_pas.ledger.id_business_entity
  id_finance_entity:
    description: Business key for the invoice, unique identifier for integration with external systems.
    lineage:
      - datalake_pas.ledger.id_finance_entity
  id_finance_entity_entry:
    description: Business key for the entry, unique identifier for integration with external systems.
    lineage:
      - datalake_pas.ledger.id_finance_entity_entry
  version:
    description: Identifier of the versions from source system (SeuBarriga), could be v1 or v2.
    lineage:
      - datalake_retsuko_clean.sap_entity.version
  business_unit:
    description: Identifier created into this table for segmented the business unit (e.g. for rent).
    lineage:
      - datalake_sap_accounting_process.reverse_accounts_420003_420019_420020_420025_611012.business_unit
  source_name:
    description: Origin system of the transaction (e.g. S4).
    lineage:
      - datalake_sap_accounting_process.reverse_accounts_420003_420019_420020_420025_611012.source_name
  accounting_type:
    description: Information of type using for segregated accounts (e.g. revenue accounting).
    lineage:
      - datalake_sap_accounting_process.reverse_accounts_420003_420019_420020_420025_611012.accounting_type
  account_number:
    description: Identifier of accounts used by controllership accounting process in SAP.
    lineage:
      - datalake_pas.ledger.account_number
  accounting_name:
    description: Human readable name for SAP accounts based on bill-items in retsuko.
    lineage:
      - datalake_retsuko.entry.bill_item
  source_amount:
    description: Value from the source system (e.g. SeuBarriga) considering business rules of the account as trigger and bill-items.
    lineage:
      - datalake_retsuko.entry.amount
  sap_amount:
    description: Value recorded in SAP.
    lineage:
      - datalake_pas.ledger.debit_credit
  is_completeness:
    description: Indicates whether there is a corresponding entry/invoice in SAP. Always FALSE for reverse accounts.
    lineage:
      - datalake_sap_accounting_process.reverse_accounts_420003_420019_420020_420025_611012.is_completeness
  is_correctness:
    description: TRUE if the difference between source and SAP amount is less than R$0.05. NULL for reverse accounts.
    lineage:
      - datalake_sap_accounting_process.reverse_accounts_420003_420019_420020_420025_611012.is_correctness
  is_temporality:
    description: TRUE if the SAP date is within 3 days after the source date. NULL for reverse accounts.
    lineage:
      - datalake_sap_accounting_process.reverse_accounts_420003_420019_420020_420025_611012.is_temporality
  is_compliance:
    description: TRUE if completeness, correctness, and temporality checks are all TRUE. Always FALSE for reverse accounts.
    lineage:
      - datalake_sap_accounting_process.reverse_accounts_420003_420019_420020_420025_611012.is_compliance
  accounting_process_status:
    description: Classification of accounting status (e.g. reverse failure).
    lineage:
      - datalake_sap_accounting_process.reverse_accounts_420003_420019_420020_420025_611012.accounting_process_status
  error_description:
    description: Textual reason for accounting process failure (manual transaction, transaction missing in sap entity, wrong account number).
    lineage:
      - datalake_retsuko_clean.sap_entity.failed_reason
      - datalake_sap_gateway_clean.sync_sap_job.status
  accrual_year_month:
    description: Account reference in the format YYYYMM.
    lineage:
      - datalake_pas.ledger.accrual_year_month
  dt_source_trigger:
    description: Trigger date based on accounting workflow rules.
    lineage:
      - datalake_retsuko.entry.ts_created
      - datalake_retsuko.invoice.ts_paid
  dt_sap_reference:
    description: Reference date in SAP associated with accrual.
    lineage:
      - datalake_pas.ledger.dt_reference
  dt_sap_created:
    description: Creation date of transaction in SAP.
    lineage:
      - datalake_pas.ledger.dt_created 