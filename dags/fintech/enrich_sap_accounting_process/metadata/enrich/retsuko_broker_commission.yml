database_name: datalake_sap_accounting_process
table_name: retsuko_broker_commission
owner: guilherme.sacramento@quintoandar.com.br
domain: Fintech
description:
  Table to track the accounting route of account 211408 (broker commission to transfer), fed exclusively by Seu Barriga. It anchors on the Retsuko entry and follows it through the SAP gateway into the ledger, so it reports whether every brokerage commission the source created reached accounting.
  The account is a payable to the broker and moves in two opposite legs, each one carried by its own Retsuko entry - the entry that runs from the landlord account to the contract account credits the account and recognises the commission, and the entry that runs from the contract account back to the landlord account debits it and settles the transfer. No entry ever carries both legs, so the direction of the entry is a deterministic discriminator and every entry in scope maps to exactly one posting on the account, with the amounts matching to the cent.
  Five bill items feed the account - brokerage-adm-partner, brokerage-adm-partner-postponed, brokerage-fee-tax-ir-adm-partner, brokerage-partner-select and brokerage-partner-select-postponed - and only the landlord leg of each one reaches 211408. Entries of the same bill items running on any other direction, such as contract to adm-partner or quinto-andar to contract, belong to other accounts and are out of scope.
  Recognition happens at bill item creation only, so the funnel starts at entry.ts_created and the sap_entity leg is restricted to the 'new-accounting-entries' event.
  The ledger is matched on the finance entity entry and, when the posting carries no entry id, on the gateway hash of the dispatch. Part of the account was posted by batch loads that reached SAP through the gateway but lost the entry key on the way, and matching only by entry would report them as 'sap not found' while the money is in fact in the account. The hash leg reads only the postings with no entry id, so the two legs never read the same ledger line.
  A large share of the entries carries the 'skipped' status in the source, meaning the origin decided not to dispatch them, and none of them has ever been posted to the account. They are reported under the 'source skipped' status instead of being blamed on the source or on the gateway, which keeps a deliberate decision of the origin separate from a genuine dispatch problem.
columns:
  id_accounting_process:
    description: Unique key for each record on this table, formatted as 'RTSK-BRKC-{id_finance_entity_entry}-{account_number}-{row_number}'.
    lineage:
      - datalake_retsuko.entry.id_external
  id_business_entity:
    description: Business key for the contract, taken from the Retsuko contract external id.
    lineage:
      - datalake_retsuko_clean.contract.id_external
  id_finance_entity:
    description: Business key for the invoice that owns the commission entry.
    lineage:
      - datalake_retsuko.invoice.id_external
  id_finance_entity_entry:
    description: Business key for the Retsuko entry. This is the grain of the table and the key the SAP ledger carries back in id_finance_entity_entry.
    lineage:
      - datalake_retsuko.entry.id_external
  version:
    description: Version of the accounting contract used by the source when dispatching the entry to the gateway.
    lineage:
      - datalake_retsuko_clean.sap_entity.version
  business_unit:
    description: Identifier created in this table to segment the business unit, fixed as for rent.
    lineage:
      - datalake_sap_accounting_process.retsuko_broker_commission.business_unit
  source_name:
    description: Product responsible for sending the accounting information, fixed as seu barriga.
    lineage:
      - datalake_sap_accounting_process.retsuko_broker_commission.source_name
  accounting_type:
    description: Type indicator used to segregate accounts, fixed as broker commission.
    lineage:
      - datalake_sap_accounting_process.retsuko_broker_commission.accounting_type
  account_number:
    description: Identifier of accounts used by controllership accounting process in SAP, fixed as 211408.
    lineage:
      - datalake_sap_accounting_process.retsuko_broker_commission.account_number
  accounting_name:
    description: Human readable name for the SAP account, fixed as broker commission to transfer.
    lineage:
      - datalake_sap_accounting_process.retsuko_broker_commission.accounting_name
  source_amount:
    description: Value of the commission entry as recorded by Retsuko. It carries the opposite sign of sap_amount, since the credit leg of the account is fed by an entry running towards the contract and the debit leg by an entry running back to the landlord.
    lineage:
      - datalake_retsuko.entry.amount
  sap_amount:
    description: Value recorded in SAP, summed over the 211408 ledger lines that share the same finance entity entry, or that carry the gateway hash of the dispatch when the posting has no entry id. Each entry in scope produces a single posting, so this is a one to one comparison against the source.
    lineage:
      - datalake_pas.ledger.debit_credit
  is_completeness:
    description: Indicates whether the entry was found in the 211408 ledger. FALSE for dispatch failures and also for the entries the source skipped, since the amount did not reach this account.
    lineage:
      - datalake_sap_accounting_process.retsuko_broker_commission.is_completeness
  is_correctness:
    description: TRUE if the deviation between source and SAP amounts is under R$0.05.
    lineage:
      - datalake_sap_accounting_process.retsuko_broker_commission.is_correctness
  is_temporality:
    description: TRUE if the SAP reference date falls in the same month as the source trigger, or in the following month within three business days.
    lineage:
      - datalake_sap_accounting_process.retsuko_broker_commission.is_temporality
  is_compliance:
    description: TRUE if completeness, correctness and temporality are all TRUE.
    lineage:
      - datalake_sap_accounting_process.retsuko_broker_commission.is_compliance
  accounting_process_status:
    description: "Classification of accounting status. 'success' when the entry reached account 211408; 'source skipped' when the origin marked the entry as skipped and never dispatched it, which is a decision of the origin rather than a failure; 'source failure', 'gateway failure' and 'unknown failure' follow the same meaning as the other Retsuko straws."
    lineage:
      - datalake_sap_accounting_process.retsuko_broker_commission.accounting_process_status
  error_description:
    description: "Textual reason for the outcome. 'entry not dispatched by decision of the source' marks the skipped records; the remaining values follow the standard funnel vocabulary of source not found, gateway not found, sap not found and the failure reason reported by the source or by the gateway webhook."
    lineage:
      - datalake_sap_accounting_process.retsuko_broker_commission.error_description
  accrual_year_month:
    description: Account reference in the format YYYYMM taken from the invoice.
    lineage:
      - datalake_retsuko.invoice.accrual_year_month
  dt_source_trigger:
    description: Creation date of the Retsuko entry, which is the event that starts this funnel.
    lineage:
      - datalake_retsuko.entry.ts_created
  dt_sap_reference:
    description: Reference date of the 211408 SAP posting.
    lineage:
      - datalake_pas.ledger.dt_reference
  dt_sap_created:
    description: Creation date of the 211408 SAP posting.
    lineage:
      - datalake_pas.ledger.dt_created
  dt_filter_end:
    description: Always NULL for this source. dt_filter_end means the date on which the position was settled or cancelled, and the settlement of this payable arrives as a separate Retsuko entry with its own row on this table, not as a second movement on the same key, so there is no settlement date to attach to the original record. Use dt_sap_reference when the posting date is what you need.
    lineage:
      - datalake_sap_accounting_process.retsuko_broker_commission.dt_filter_end
