---
database_name: datalake_sap_accounting_process
table_name: kill_queue_reservation_issuance
owner: guilherme.sacramento@quintoandar.com.br
domain: Fintech
description: "Enriched data from kill queue reservation issuance process, tracking compliance between source and SAP accounting data"
columns:
  id_accounting_process:
    description: "Unique identifier for the accounting process, combining kill queue ID with account number"
    lineage:
      - datalake_kill_queue_clean.reservation.id
      - datalake_accounting_funnel.ledger.account_number
  id_business_entity:
    description: Identifier for the business entity referenced by this financial record.
    lineage:
      - datalake_kill_queue_clean.reservation.id_tenant
  id_finance_entity:
    description: Identifier for the finance entity referenced by this financial record.
    lineage:
      - datalake_kill_queue_clean.reservation.id
  id_finance_entity_entry:
    description: "Finance entity entry ID (currently NULL)"
  business_unit:
    description: "Business unit identifier (for rent)"
  source_name:
    description: "Source system name (kill queue)"
  accounting_type:
    description: "Type of accounting record (invoice)"
  account_number:
    description: "SAP account number (420006 for reservation fee)"
    lineage:
      - datalake_accounting_funnel.ledger.account_number
  accounting_name:
    description: "SAP accounting name (reservation fee)"
    lineage:
      - datalake_accounting_funnel.ledger.account_number
  accrual_year_month:
    description: "Accrual year and month for the accounting period"
    lineage:
      - datalake_accounting_funnel.ledger.accrual_year_month
  status:
    description: "Processing status: SUCCESS, SG FAILURE, or SOURCE FAILURE"
    lineage:
      - datalake_kill_queue_clean.reservation.id
      - datalake_accounting_funnel.ledger.id_finance_entity
      - datalake_sap_gateway_clean.feature.id_source
  source_amount:
    description: "Amount from kill queue source system"
    lineage:
      - datalake_kill_queue_clean.reservation.value
  sap_amount:
    description: "Amount recorded in SAP accounting system"
    lineage:
      - datalake_accounting_funnel.ledger.debit_credit
  is_completeness_compliance:
    description: "Boolean indicating if the record exists in both source and SAP"
    lineage:
      - datalake_kill_queue_clean.reservation.id
      - datalake_accounting_funnel.ledger.id_finance_entity
  is_correctness_compliance:
    description: "Boolean indicating if source and SAP amounts match within 0.05 tolerance"
    lineage:
      - datalake_kill_queue_clean.reservation.value
      - datalake_accounting_funnel.ledger.debit_credit
  is_temporality_compliance:
    description: "Boolean indicating if SAP reference date is within 30 days of source trigger"
    lineage:
      - datalake_kill_queue_clean.reservation.ts_created
      - datalake_accounting_funnel.ledger.dt_reference
  is_compliance:
    description: "Overall compliance indicator when all three compliance checks pass"
    lineage:
      - datalake_kill_queue_clean.reservation.id
      - datalake_accounting_funnel.ledger.id_finance_entity
      - datalake_kill_queue_clean.reservation.value
      - datalake_accounting_funnel.ledger.debit_credit
      - datalake_kill_queue_clean.reservation.ts_created
      - datalake_accounting_funnel.ledger.dt_reference
  dt_source_trigger:
    description: "Date when the source record was created/triggered"
    lineage:
      - datalake_kill_queue_clean.reservation.ts_created
  dt_sap_created:
    description: "Date when the record was created in SAP"
    lineage:
      - datalake_accounting_funnel.ledger.dt_created
  dt_sap_reference:
    description: "Reference date in SAP accounting system"
    lineage:
      - datalake_accounting_funnel.ledger.dt_reference
