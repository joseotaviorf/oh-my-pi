database_name: datalake_sap_accounting_process
table_name: retsuko_invoice_unified
owner: ae-finance-fintech@quintoandar.com.br
domain: fintech
description:
  Table to track revenue accounts that generates unified NFs, so it's follow the invoices' route between source (SeuBarriga/Retsuko) and SAP, considering sap gateway payload system.
  It applies business rules for IPO to assess completeness, correctness (up to R$0.05 deviation), and temporality (within 3 days).
  The final output includes a status classification and failure reason to support monitoring and root-cause analysis.
columns:
  id_accounting_process:
    description: Unique key for each record on this table
    lineage:
      - .id_accounting_process
  id_business_entity:
    description: Business key for the contract, unique identifier for integration with external systems.
    lineage:
      - datalake_retsuko_clean.contract.id_external
  id_finance_entity:
    description: Business key for the invoice, unique identifier for integration with external systems.
    lineage:
      - datalake_retsuko.invoice.id_external
  id_finance_entity_entry:
    description: Business key for the entry, unique identifier for integration with external systems.
    lineage:
      - datalake_retsuko.entry.id_external
  version:
    description: Identifier of doc_entry launched on SAP to find the consolidated invoice in Gateway tables
    lineage:
      - datalake_sap_gateway_clean.consolidated_invoice.doc_entry
  business_unit:
    description: Identifier created into this table for segmented the business unit (e.g. for rent).
    lineage:
      - datalake_sap_accounting_process.retsuko_invoice.business_unit
  source_name:
    description: Origin system of the transaction (e.g. seu barriga).
    lineage:
      - datalake_sap_accounting_process.retsuko_invoice.source_name
  accounting_type:
    description: Information of type using for segregated accounts (e.g. invoice or revenue share).
    lineage:
      - datalake_sap_accounting_process.retsuko_invoice.accounting_type
  account_number:
    description: Identifier of accounts used by controllership accounting process in SAP.
    lineage:
      - datalake_pas.ledger.account_number
  accounting_name:
    description: Human readbale name for SAP accounts based on bill-items in retsuko.
    lineage:
      - datalake_sap_accounting_process.retsuko_invoice.accounting_name
  source_amount:
    description: Value from the source system (e.g. SeuBarriga) considering business rules of the account as trigger and bill-items.
    lineage:
      - datalake_retsuko.entry.amount
  sap_amount:
    description: Value recorded in SAP.
    lineage:
      - datalake_pas.ledger.debit_credit
  is_completeness:
    description: Indicates whether there is a corresponding entry/invoice in SAP.
    lineage:
      - datalake_sap_accounting_process.retsuko_invoice.is_completeness
  is_correctness:
    description: TRUE if the difference between source and SAP amount is less than R$0.05.
    lineage:
      - datalake_sap_accounting_process.retsuko_invoice.is_correctness
  is_temporality:
    description: TRUE if the SAP date is within 3 days after the source date.
    lineage:
      - datalake_sap_accounting_process.retsuko_invoice.is_temporality
  is_compliance:
    description: TRUE if completeness, correctness, and temporality checks are all TRUE.
    lineage:
      - datalake_sap_accounting_process.retsuko_invoice.is_compliance
  accounting_process_status:
    description: Classification of accounting status (e.g. success, source_failure, gateway_failure).
    lineage:
      - datalake_sap_accounting_process.retsuko_invoice.accounting_process_status
  error_description:
    description: Textual reason for accounting process failure (JSON).
    lineage:
      - datalake_retsuko_clean.sap_entity.failed_reason
  accrual_year_month:
    description: Account reference in the format YYYYMM.
    lineage:
      - datalake_retsuko.invoice.accrual_year_month
  dt_source_trigger:
    description: Trigger date based on accounting workflow rules.
    lineage:
      - datalake_retsuko.entry.accrual_year_month
  dt_sap_reference:
    description: Reference date in SAP associated with accrual.
    lineage:
      - datalake_pas.ledger.dt_reference
  dt_sap_created:
    description: Creation date of transaction in SAP.
    lineage:
      - datalake_pas.ledger.dt_created
