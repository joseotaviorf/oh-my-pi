database_name: datalake_sap_accounting_process
table_name: retsuko_third_parties_reverse
owner: guilherme.sacramento@quintoandar.com.br
domain: Fintech
description:
  Table to track reverse third parties accounts (brokerage and pro guarantor) accounting transactions,
  identifying cases where entries exist in SAP Ledger but do not have a corresponding match in the
  Seu Barriga/Retsuko source system. These are classified as 'reverse straw failure' transactions,
  indicating potential data inconsistencies or manual entries in SAP that were not originated from
  the Seu Barriga/Retsuko system. The table supports monitoring and root-cause analysis for these
  reverse third parties entries. Note that transactions with error_description 'source-rental-guarantee'
  or 'manual transaction' are excluded from the final output.
columns:
  id_accounting_process:
    description: Unique key for each record on this table, formatted as 'RE-RTSK-TP-{id_transaction}-{account_number}-{row_number}' for deduplication
    lineage:
      - datalake_pas.ledger.id_transaction
      - datalake_pas.ledger.account_number
  id_business_entity:
    description: Business key for the contract, unique identifier for integration with external systems.
    lineage:
      - datalake_pas.ledger.id_business_entity
  id_finance_entity:
    description: Business key for the invoice, unique identifier for integration with external systems.
    lineage:
      - datalake_pas.ledger.id_finance_entity
  id_finance_entity_entry:
    description: Business key for the entry, unique identifier for integration with external systems.
    lineage:
      - datalake_pas.ledger.id_finance_entity_entry
  version:
    description: Identifier of the versions from source system (SeuBarriga), could be v1 or v2. NULL for reverse transactions as there is no corresponding SeuBarriga entry.
    lineage:
      - datalake_retsuko_clean.sap_entity.version
  business_unit:
    description: Identifier created into this table for segmented the business unit. Always 'for rent' for records in this table.
    lineage:
      - datalake_sap_accounting_process.retsuko_third_parties_reverse.business_unit
  source_name:
    description: Origin system of the transaction. Always 'S4' for reverse transactions as they originate from SAP.
    lineage:
      - datalake_sap_accounting_process.retsuko_third_parties_reverse.source_name
  accounting_type:
    description: Information of type using for segregated accounts. Always 'third parties' for records in this table.
    lineage:
      - datalake_sap_accounting_process.retsuko_third_parties_reverse.accounting_type
  account_number:
    description: Identifier of accounts used by controllership accounting process in SAP (e.g. 211413, 211415).
    lineage:
      - datalake_pas.ledger.account_number
  accounting_name:
    description: Human readable name for SAP accounts based on bill-items in retsuko. Can be 'Brokerage to be discounted - New Model' or 'Revenue to be considered - Pro Guarantor' based on account_number.
    lineage:
      - datalake_sap_accounting_process.retsuko_third_parties_reverse.accounting_name
  source_amount:
    description: Value from the source system (SeuBarriga). NULL for reverse transactions as there is no corresponding SeuBarriga entry.
    lineage:
      - datalake_retsuko.entry.amount
  sap_amount:
    description: Value recorded in SAP Ledger.
    lineage:
      - datalake_pas.ledger.debit_credit
  accounting_balance:
    description: Net SAP ledger balance for the finance entity entry and account number, calculated as the sum of all debit_credit values in the SAP ledger for that id_finance_entity_entry and account_number combination.
    lineage:
      - datalake_pas.ledger.debit_credit
  is_completeness:
    description: Indicates whether there is a corresponding entry/invoice in SAP. Always FALSE for reverse transactions.
    lineage:
      - datalake_sap_accounting_process.retsuko_third_parties_reverse.is_completeness
  is_correctness:
    description: TRUE if the difference between source and SAP amount is less than R$0.05. Always FALSE for reverse transactions.
    lineage:
      - datalake_sap_accounting_process.retsuko_third_parties_reverse.is_correctness
  is_temporality:
    description: TRUE if the SAP date is within 3 days after the source date. Always FALSE for reverse transactions.
    lineage:
      - datalake_sap_accounting_process.retsuko_third_parties_reverse.is_temporality
  is_compliance:
    description: TRUE if completeness, correctness, and temporality checks are all TRUE. Always FALSE for reverse transactions.
    lineage:
      - datalake_sap_accounting_process.retsuko_third_parties_reverse.is_compliance
  accounting_process_status:
    description: Classification of accounting status. Always 'reverse straw failure' for records in this table.
    lineage:
      - datalake_sap_accounting_process.retsuko_third_parties_reverse.accounting_process_status
  error_description:
    description: Textual reason for accounting process failure. Can be 'source-rental-guarantee', 'manual transaction', 'transaction missing in sap gateway', 'transaction missing in sap entity', or 'wrong account number or postponed entry'. Note that 'source-rental-guarantee' and 'manual transaction' are excluded from the final output.
    lineage:
      - datalake_sap_accounting_process.retsuko_third_parties_reverse.error_description
      - datalake_pas.ledger.source_client
      - datalake_pas.ledger.created_by
  accrual_year_month:
    description: Account reference in the format YYYYMM from SAP Ledger.
    lineage:
      - datalake_pas.ledger.accrual_year_month
  dt_source_trigger:
    description: Trigger date based on accounting workflow rules in SeuBarriga. NULL for reverse transactions as there is no SeuBarriga entry.
    lineage:
      - datalake_retsuko.entry.ts_created
  dt_sap_reference:
    description: Reference date in SAP associated with accrual.
    lineage:
      - datalake_pas.ledger.dt_reference
  dt_sap_created:
    description: Creation date of transaction in SAP.
    lineage:
      - datalake_pas.ledger.dt_created
