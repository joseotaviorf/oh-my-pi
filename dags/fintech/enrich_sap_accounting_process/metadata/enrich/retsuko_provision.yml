database_name: datalake_sap_accounting_process
table_name: retsuko_provision
owner: guilherme.sacramento@quintoandar.com.br
domain: Fintech
description:
  Table to track revenue accounts provision, following the route between source (Seu Barriga/Retsuko) and SAP, considering SAP Gateway payload system.
  It applies business rules for IPO to assess completeness, correctness (up to R$0.05 deviation), and temporality (same calendar month as the source trigger, or the next month with at most three Brazilian business days between trigger and SAP reference dates).
  The final output includes a status classification and failure reason to support monitoring and root-cause analysis.
columns:
  id_accounting_process:
    description: Unique key for each record on this table
    lineage:
      - .id_accounting_process
  id_business_entity:
    description: Business key for the contract, unique identifier for integration with external systems.
    lineage:
      - datalake_retsuko_clean.contract.id_external
  id_finance_entity:
    description: Business key for the invoice, unique identifier for integration with external systems.
    lineage:
      - datalake_retsuko.invoice.id_external
  id_finance_entity_entry:
    description: Business key for the entry, unique identifier for integration with external systems.
    lineage:
      - datalake_retsuko.entry.id_external
  version:
    description: Identifier of the versions from source system (SeuBarriga), could be v1 or v2.
    lineage:
      - datalake_retsuko_clean.sap_entity.version
  business_unit:
    description: Identifier created into this table for segmented the business unit (e.g. for rent).
    lineage:
      - datalake_sap_accounting_process.retsuko_provision.business_unit
  source_name:
    description: Origin system of the transaction (e.g. seu barriga).
    lineage:
      - datalake_sap_accounting_process.retsuko_provision.source_name
  accounting_type:
    description: Information of type using for segregated accounts (e.g. invoice, provision or revenue share).
    lineage:
      - datalake_sap_accounting_process.retsuko_provision.accounting_type
  account_number:
    description: Identifier of accounts used by controllership accounting process in SAP.
    lineage:
      - datalake_pas.ledger.account_number
  accounting_name:
    description: Human readbale name for SAP accounts based on bill-items in retsuko.
    lineage:
      - datalake_sap_accounting_process.retsuko_provision.accounting_name
  source_amount:
    description: Value from the source system (e.g. SeuBarriga) considering business rules of the account as trigger and bill-items.
    lineage:
      - datalake_retsuko.entry.amount
  sap_amount:
    description: Value recorded in SAP.
    lineage:
      - datalake_pas.ledger.debit_credit
  is_completeness:
    description: Indicates whether there is a corresponding entry/invoice in SAP.
    lineage:
      - datalake_sap_accounting_process.retsuko_provision.is_completeness
  is_correctness:
    description: TRUE if the difference between source and SAP amount is less than R$0.05.
    lineage:
      - datalake_sap_accounting_process.retsuko_provision.is_correctness
  is_temporality:
    description: TRUE if dt_sap_reference and dt_source_trigger are in the same calendar month, or if dt_sap_reference is in the month immediately after dt_source_trigger and there are at most three Brazilian business days (datalake_quintoandar.aux_date) between the two dates, inclusive. FALSE if either date is NULL or neither rule applies.
    lineage:
      - datalake_pas.ledger.dt_reference
      - datalake_quintoandar.aux_date.is_brz_business_day
  is_compliance:
    description: TRUE if completeness, correctness, and temporality checks are all TRUE.
    lineage:
      - datalake_sap_accounting_process.retsuko_provision.is_compliance
  accounting_process_status:
    description: Classification of accounting status (e.g. success, source_failure, gateway_failure).
    lineage:
      - datalake_sap_accounting_process.retsuko_provision.accounting_process_status
  error_description:
    description: Textual reason for accounting process failure (JSON).
    lineage:
      - datalake_retsuko_clean.sap_entity.failed_reason
      - datalake_sap_gateway_clean.webhook_log.errors
  accrual_year_month:
    description: Account reference in the format YYYYMM.
    lineage:
      - datalake_retsuko.invoice.accrual_year_month
  dt_source_trigger:
    description: Trigger date based on accounting workflow rules.
    lineage:
      - datalake_retsuko.entry.ts_created
  dt_sap_reference:
    description: Reference date in SAP associated with accrual.
    lineage:
      - datalake_pas.ledger.dt_reference
  dt_sap_created:
    description: Creation date of transaction in SAP.
    lineage:
      - datalake_pas.ledger.dt_created
