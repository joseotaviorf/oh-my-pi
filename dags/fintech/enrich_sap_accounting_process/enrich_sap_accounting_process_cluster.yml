cluster:
  type: emr_7_12_consolidation_l_general_fleet_cluster
  custom_configurations:
    spark_conf:
      spark.driver.maxResultSize: "0"
      spark.driver.memory: "24g"
      spark.driver.memoryOverhead: "4g"
    autotermination_minutes: 20
    core_nodes:
      target_on_demand: 2
      target_spot: 0
      instance_types:
        - m6g.4xlarge
        - m7g.4xlarge
    task_nodes:
      instance_types:
        - m6g.4xlarge
        - m7g.4xlarge
      target_on_demand: 0
      target_spot: 1
      allocation_strategy: price-capacity-optimized
      bid_price_percentage: 100
