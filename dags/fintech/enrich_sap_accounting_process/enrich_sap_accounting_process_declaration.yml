---
dag:
  name: enrich_sap_accounting_process
  schedule_start_date: 2020, 7, 1
  owner: Data Fintech
workflow:
  type: query_delta
  layer: enrich
  default_table_privileges:
      de-fintech-sap-owners:
        - SELECT
        - APPLY TAG
        - MODIFY
      prod-read-write:
        - SELECT
cluster:
  type: custom_cluster
  databricks_conn_id: databricks_new_env
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    driver_node_type_id: r5a.2xlarge
    node_type_id: r5a.4xlarge
    num_workers: 3
    spark_version: 16.4.x-scala2.12
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: "quintoandar_{{ var.value.environment }}"
