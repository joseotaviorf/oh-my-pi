cluster:
  type: emr_7_12_consolidation_m_general_fleet_cluster
  custom_configurations:
    spark_conf:
      # Prevent AQE from coalescing heavy union/join stages into too few tasks
      # (same failure mode as enrich_accounting_funnel / enrich_payments_platform:
      # default advisory 256MB left one skewed partition owning the step for 30+ min).
      spark.sql.adaptive.advisoryPartitionSizeInBytes: "33554432"
      spark.sql.shuffle.partitions: "800"
      spark.speculation: "true"
      spark.speculation.multiplier: "3"
      spark.speculation.quantile: "0.75"
    core_nodes:
      target_on_demand: 3
      target_spot: 0
      instance_types:
        - m6g.2xlarge
        - m7g.2xlarge
