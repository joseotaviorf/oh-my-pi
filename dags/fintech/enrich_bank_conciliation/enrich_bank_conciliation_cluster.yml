cluster:
  # Keep XL capacity (same class as enrich_accounting_funnel). step_concurrency=1
  # serialized all enrich loads and raised DAG wall clock above the ~20m target;
  # allow limited parallelism now that the OR-join rewrite made collections ~3m.
  type: emr_7_12_consolidation_xl_general_fleet_cluster
  custom_configurations:
    step_concurrency_level: 2
    core_nodes:
      target_on_demand: 4
      target_spot: 0
      instance_types:
        - m6g.8xlarge
        - m7g.8xlarge
    task_nodes:
      target_on_demand: 0
      target_spot: 4
      allocation_strategy: price-capacity-optimized
      bid_price_percentage: 100
      instance_types:
        - m6g.8xlarge
        - m7g.8xlarge
    spark_conf:
      # Keep BHJ disabled — fleet base is -1; make explicit.
      spark.sql.autoBroadcastJoinThreshold: "-1"
      spark.sql.adaptive.autoBroadcastJoinThreshold: "-1"
      # Avoid AQE collapsing heavy stages into too few tasks.
      spark.sql.adaptive.advisoryPartitionSizeInBytes: "16777216"
      spark.sql.shuffle.partitions: "800"
      spark.speculation: "true"
      spark.speculation.multiplier: "3"
      spark.speculation.quantile: "0.75"
