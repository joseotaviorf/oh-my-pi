---
database_name: datalake_bank_conciliation
table_name: for_rent_cashout
owner: ae-finance-fintech@quintoandar.com.br
domain: Fintech
description: Table containing bank reconciliation data for For Rent cash-out payments, comparing bank statements, CAP payments, and SAP entries.
columns:
  id_company_use:
    description: 'Unique identifier for the payment, derived from company_use in various source systems'
    lineage:
    - datalake_nexxera.cnab_payments.company_use
    - datalake_accounting_funnel.payment_platforms.reference_1
    - datalake_pas.ledger.id_external_payment
    - datalake_sap_gateway.sap_payload.id_external_payment
  hash:
    description: 'Hash values from SAP ledger entries for tracking purposes'
    lineage:
    - datalake_pas.ledger.hash
  bank_account_number:
    description: 'Bank account number from Nexxera CNAB payments'
    lineage:
    - datalake_nexxera.cnab_payments.bank_account
  sap_account_number:
    description: 'SAP account number from ledger entries'
    lineage:
    - datalake_pas.ledger.account_number
  last_occurrence_code:
    description: 'Last occurrence code from Nexxera CNAB payments'
    lineage:
    - datalake_nexxera.cnab_payments.occurrence_code
  bank_paid_amount:
    description: 'Amount paid according to bank statements from Nexxera'
    lineage:
    - datalake_nexxera.cnab_payments.paid_amount
  cap_paid_amount:
    description: 'Amount recorded in CAP payment platform'
    lineage:
    - datalake_accounting_funnel.payment_platforms.paid_amount
  sap_paid_amount:
    description: 'Amount recorded in SAP system for financial entries'
    lineage:
    - datalake_pas.ledger.debit_credit
  is_vans_compliance:
    description: 'Boolean flag indicating if Vans compliance requirements are met'
    lineage:
    - datalake_nexxera.cnab_payments
    - datalake_accounting_funnel.payment_platforms
    - datalake_pas.ledger
  is_reconcilied:
    description: 'Boolean flag indicating if the payment is reconciled between bank and SAP'
    lineage:
    - datalake_nexxera.cnab_payments
    - datalake_pas.ledger
  dt_bank_paid:
    description: 'Date when the payment was made according to bank statements'
    lineage:
    - datalake_nexxera.cnab_payments.dt_paid
  dt_cap_paid:
    description: 'Date when the payment was recorded in CAP platform'
    lineage:
    - datalake_accounting_funnel.payment_platforms.dt_paid
  dt_sap_paid:
    description: 'Date when the payment was recorded in SAP system'
    lineage:
    - datalake_pas.ledger.dt_reference
  dt_sap_tax:
    description: 'Tax date from SAP ledger entries'
    lineage:
    - datalake_pas.ledger.dt_tax
  dt_paid:
    description: 'Payment date from the combined source systems'
    lineage:
    - datalake_nexxera.cnab_payments.dt_paid
    - datalake_accounting_funnel.payment_platforms.dt_paid
    - datalake_pas.ledger.dt_reference
