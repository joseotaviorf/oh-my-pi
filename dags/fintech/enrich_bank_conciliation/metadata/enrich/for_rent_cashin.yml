---
database_name: datalake_bank_conciliation
table_name: for_rent_cashin
owner: ae-finance-fintech@quintoandar.com.br
domain: Fintech
description: Table containing bank reconciliation data for For Rent cash-in payments, comparing bank statements, Retsuko billing, Vans checkout, and SAP entries.
columns:
  id_company_use:
    description: 'Unique identifier for the payment, derived from company_use in various source systems'
    lineage:
    - datalake_nexxera.cnab_charges.document_number
    - datalake_retsuko.invoice.payment_company_use_number
    - datalake_checkout_clean.boleto.your_number
    - datalake_vans_clean.boleto.company_use
    - datalake_vans_clean.boleto.document_number
    - datalake_pas.ledger.id_external_payment
  id_invoice:
    description: 'Invoice identifier from Retsuko'
    lineage:
    - datalake_retsuko.invoice.id_external
  hash:
    description: "Hash values from SAP ledger entries for tracking purposes"
    lineage:
    - datalake_pas.ledger.hash
  bank_number:
    description: 'Bank document identifier from CNAB charges'
    lineage:
    - datalake_nexxera.cnab_charges.document_number
  bank_account_number:
    description: "Bank account number from Nexxera CNAB charges"
    lineage:
      - datalake_nexxera.cnab_charges.bank_account
  sap_account_number:
    description: "SAP account number from ledger entries"
    lineage:
    - datalake_pas.ledger.account_number
  payment_method:
    description: 'Payment method used in checkout sources'
    lineage:
    - datalake_checkout_clean.boleto
    - datalake_vans_clean.boleto
  payment_status:
    description: 'Payment status in checkout sources'
    lineage:
    - datalake_checkout_clean.boleto.status
    - datalake_vans_clean.boleto.status
  bank_amount:
    description: "Amount received in bank statements from Nexxera"
    lineage:
      - datalake_nexxera.cnab_charges.net_amount
  retsuko_amount:
    description: "Amount recorded in Retsuko billing system"
    lineage:
      - datalake_retsuko.invoice.paid_amount
  vans_checkout_amount:
    description: "Amount recorded in Vans checkout system from boleto payments"
    lineage:
      - datalake_checkout_clean.boleto.paid_amount
      - datalake_vans_clean.boleto.paid_amount
  sap_amount:
    description: "Amount recorded in SAP system for financial entries"
    lineage:
      - datalake_pas.ledger.debit_credit
  status_bank:
    description: "Status indicating if the payment was recorded in bank statements (ok/not recorded)"
    lineage:
      - datalake_nexxera.cnab_charges
  status_retsuko:
    description: "Status comparing bank and Retsuko amounts and dates (ok/not recorded/recorded with divergent date or value)"
    lineage:
      - datalake_retsuko.invoice
  status_vans_checkout:
    description: "Status comparing bank and Vans checkout amounts and dates (ok/not recorded/recorded with divergent date or value)"
    lineage:
      - datalake_checkout_clean.boleto
      - datalake_vans_clean.boleto
  status_sap:
    description: "Status comparing bank and SAP amounts and dates (ok/not recorded/recorded with divergent date or value)"
    lineage:
      - datalake_pas.ledger
  is_reconciled:
    description: "Boolean flag indicating if the payment is fully reconciled across all systems"
    lineage:
      - datalake_nexxera.cnab_charges
      - datalake_pas.ledger
      - datalake_checkout_clean.boleto
      - datalake_vans_clean.boleto
      - datalake_retsuko.invoice
  is_bank_concilied_detail:
    description: >-
      Text reason for bank conciliation outcome (concilied, missing bank or SAP,
      SAP duplication, missing Vans checkout or Retsuko, or SAP paid before bank).
    lineage:
      - datalake_nexxera.cnab_charges
      - datalake_itau_statements_clean.statement_067000392216
      - datalake_retsuko.invoice
      - datalake_checkout_clean.boleto
      - datalake_checkout_clean.bolecode
      - datalake_vans_clean.boleto
      - datalake_pas.ledger
  sap_error_detail:
    description: >-
      When SAP is not recorded, explains diagnosis from Retsuko invoice presence,
      sap_entity status, and SAP gateway sync or webhook errors.
    lineage:
      - datalake_retsuko.invoice.id_external
      - datalake_retsuko_clean.sap_entity.status
      - datalake_retsuko_clean.sap_entity.failed_reason
      - datalake_sap_gateway_clean.feature
      - datalake_sap_gateway_clean.sync_sap_job.status
      - datalake_sap_gateway_clean.webhook_log.errors
  dt_bank_paid:
    description: "Date when the payment was received in bank statements"
    lineage:
      - datalake_nexxera.cnab_charges.dt_credit
  dt_retsuko_paid:
    description: "Date when the payment was recorded in Retsuko billing system"
    lineage:
      - datalake_retsuko.invoice.ts_paid
      - dw_public.dim_date.next_brz_fintech_business_day
  dt_vans_checkout_paid:
    description: "Date when the payment was recorded in Vans checkout system"
    lineage:
      - datalake_checkout_clean.boleto.ts_paid
      - datalake_vans_clean.boleto.dt_paid
      - dw_public.dim_date.next_brz_fintech_business_day
  dt_sap_paid:
    description: "Date when the payment was recorded in SAP system"
    lineage:
      - datalake_pas.ledger.dt_tax
  dt_paid:
    description: >-
      Consolidated payment date (first non-null among bank, SAP, Retsuko, and
      Vans or Checkout sources).
    lineage:
      - datalake_nexxera.cnab_charges.dt_credit
      - datalake_itau_statements_clean.statement_067000392216.date_accounting
      - datalake_pas.ledger.dt_tax
      - datalake_retsuko.invoice.ts_paid
      - dw_public.dim_date.next_brz_fintech_business_day
      - datalake_checkout_clean.boleto.ts_paid
      - datalake_checkout_clean.bolecode.ts_paid
      - datalake_vans_clean.boleto.dt_paid
