---
database_name: datalake_monopoly_homolog
table_name: sale
owner: herivelto.junior@quintoandar.com.br
domain: fintech
description: Enriched table with Monopoly and Vendas infos to check an offer total cash flow.
columns:
  id_offer:
    description: Offer ID.
    lineage:
      - datalake_offer.sale_offer.id_offer
  sale_price_agreed:
    description: Final price agreed for this offer
    lineage:
      - datalake_offer.sale_offer.sale_price_agreed
  brokerage_fee:
    description: Percentage of brokerage fee
    lineage:
      - datalake_offer.sale_offer.brokerage_fee
  brokerage_amount:
    description: Brokerage fee * Sale Price Agreed
    lineage:
      - datalake_offer.sale_offer.brokerage_fee
      - datalake_offer.sale_offer.sale_price_agreed
  total_cash_flow_amount:
    description: Total CashFlow for this offer.
    lineage:
      - datalake_monopoly_clean.income_reference.amount
      - datalake_monopoly_clean.outcome_reference.amount
  delta_total_cash_flow_to_broakerage_amount:
    description: Difference between calculated and real one from Monopoly. Differences occurs because of decimal differences on brokerage fee number.
    lineage:
      - datalake_offer.sale_offer.brokerage_fee
      - datalake_offer.sale_offer.sale_price_agreed
      - datalake_monopoly_clean.income_reference.amount
      - datalake_monopoly_clean.outcome_reference.amount
  cash_flow_amount_when_payment_allowed:
    description: Cash value that should be on QuintoAndar's account.
    lineage:
      - datalake_offer.sale_offer.brokerage_fee
      - datalake_offer.sale_offer.sale_price_agreed
  is_payment_allowed:
    description: If the CashFlow is equal to the calculated one this flag is set to True.
  dt_sale_agreement_signed:
    description: Date when CCV was signed.
    lineage:
      - datalake_offer.sale_offer.dt_sale_agreement_signed
  dt_total_cash_flow_amount_last_updated:
    description: Last sale transaction date.
    lineage:
      - datalake_monopoly_clean.sale_transaction.ts_created
  dt_occurence:
    description: Sale transaction date.
    lineage:
      - datalake_monopoly_clean.sale_transaction.ts_created
