dag:
  name: velo_neurotech_pj
  schedule_interval: 0 3 * * *
  owner: Data Fintech
  documentation:
    dag_purpose: pj neurotech data
workflow:
  type: custom_ingestion
  layer: raw
  load_spark_job: load_incremental_data_into_datalake_raw
  default_partitions: [year, month, day]

  spark_job_arguments:
  - "{environment}"
  - "{bucket}"
  - "{dag_name}"
  - "{{ data_interval_start | ds }}"
  - "{table_name}"
  - "{partitions}"

  tables_customization:
    logs_pj_credit_granting:
      partitions: [year, month, day]
      extra_spark_job_arguments:
      - DadosConcessaoCreditoPJAPI
    logs_pj_scoping_policy:
      partitions: [year, month, day]
      extra_spark_job_arguments:
      - DadosAlcadaPJAPI

cluster:
  type: databricks_13_3_med_general_cluster
  custom_libraries:
  - whl: "{artifacts_bucket}/velo-neurotech-api-client-python/quintoandar_velo_neurotech_api_client-0.3.2-py2.py3-none-any.whl"
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
