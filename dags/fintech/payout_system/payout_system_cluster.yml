cluster:
  type: consolidation_xs_memory_cluster
  databricks_conn_id: databricks_new
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE
  custom_configurations:
    aws_attributes:
      ebs_volume_size: 200
    num_workers: 3
    driver_node_type_id: m7g.2xlarge
validation:
  cluster:
    type: emr_7_12_consolidation_xs_memory_cluster
    custom_configurations:
      aws_attributes:
        ebs_volume_size: 200
      core_nodes:
        instance_count: 1
      task_nodes:
        instance_count: 2
      master_node_type_id: m7g.2xlarge
      spark_conf:
        spark.driver.memory: 6g
        spark.driver.memoryOverhead: 2g
        spark.yarn.am.memory: 1g
