dag:
  name: payout_system
  schedule_start_date: 2025, 1, 1
  schedule_interval: 0 7,10,13,16,18 * * *
  owner: Data Fintech
  documentation:
    dag_purpose: |
      Process data from the Payout System database (PostgreSQL), retrieved using the CDC process.
      The Payout System manages payment requests, bank submissions, payees, flows,
      async payment-request batch ingestion, Ledger/ERP sync jobs, and related
      audit and status history for fintech payout operations.
workflow:
  type: cdc
  layer: raw
  database_type: postgres
  source_database: payout-system
  source_schema: public
  custom_schema: payout_system
  dbutils_secret_key: PAYOUT-SYSTEM_DB
  lineage_product_database_name: payout_system
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, 1), 'load_end_date') }}"
  tables_customization:
    bank_submission:
      clean_table_name: bank_submission
      transactional_datatype_overrides:
        total_amount: decimal(38,20)
    bank_submission_item: {}
    bank_submission_file: {}
    flow: {}
    payee: {}
    payment_audit_log: {}
    payment_method_config: {}
    payment_method_data: {}
    payment_request:
      clean_table_name: payment_request
      transactional_datatype_overrides:
        due_amount: decimal(38,20)
        paid_amount: decimal(38,20)
    payment_request_batch: {}
    payment_request_batch_chunk: {}
    payment_status_history: {}
    payout_sync_job: {}
    reason: {}
    requester_payment_method: {}
