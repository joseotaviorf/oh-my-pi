database_name: datalake_payout_system_clean
table_name: requester
owner: juliana.hocihara@quintoandar.com.br
domain: Fintech
description: Requester (client/system that creates payment requests; code, name, metadata).
columns:
  id:
    description: Primary key of the requester.
    lineage:
      - datalake_payout_system_raw.requester.id
  code:
    description: Financial attribute representing code on the requester dataset.
    lineage:
      - datalake_payout_system_raw.requester.code
  name:
    description: Financial attribute representing name on the requester dataset.
    lineage:
      - datalake_payout_system_raw.requester.name
  metadata:
    description: Additional metadata/configuration as JSON.
    lineage:
      - datalake_payout_system_raw.requester.metadata
  ts_created:
    description: Record creation timestamp (UTC).
    lineage:
      - datalake_payout_system_raw.requester.created_at
  ts_updated:
    description: Record last update timestamp (UTC).
    lineage:
      - datalake_payout_system_raw.requester.updated_at
  ts_disabled:
    description: Deactivation timestamp (UTC); NULL when active.
    lineage:
      - datalake_payout_system_raw.requester.disabled_at
