database_name: datalake_payout_system_clean
table_name: payment_audit_log
owner: juliana.hocihara@quintoandar.com.br
domain: Fintech
description: Audit trail for payment request changes (field-level old/new value, principal, trace).
columns:
  id:
    description: Primary key of the audit log entry.
    lineage:
      - datalake_payout_system_raw.payment_audit_log.id
  id_payment_request:
    description: FK to payment_request.
    lineage:
      - datalake_payout_system_raw.payment_audit_log.payment_request_id
  id_entity:
    description: Affected entity ID (optional).
    lineage:
      - datalake_payout_system_raw.payment_audit_log.entity_id
  id_correlation:
    description: Correlation ID for distributed tracing.
    lineage:
      - datalake_payout_system_raw.payment_audit_log.correlation_id
  audit_type:
    description: Type or category of the audit.
    lineage:
      - datalake_payout_system_raw.payment_audit_log.audit_type
  entity_type:
    description: Financial attribute representing entity type on the payment_audit_log dataset.
    lineage:
      - datalake_payout_system_raw.payment_audit_log.entity_type
  field_name:
    description: Name of the changed field.
    lineage:
      - datalake_payout_system_raw.payment_audit_log.field_name
  old_value:
    description: Financial attribute representing old value on the payment_audit_log dataset.
    lineage:
      - datalake_payout_system_raw.payment_audit_log.old_value
  new_value:
    description: Financial attribute representing new value on the payment_audit_log dataset.
    lineage:
      - datalake_payout_system_raw.payment_audit_log.new_value
  change_reason:
    description: Financial attribute representing change reason on the payment_audit_log dataset.
    lineage:
      - datalake_payout_system_raw.payment_audit_log.change_reason
  trace_id:
    description: Trace ID for request tracking.
    lineage:
      - datalake_payout_system_raw.payment_audit_log.trace_id
  principal:
    description: Principal identifier (user, system, service account).
    lineage:
      - datalake_payout_system_raw.payment_audit_log.principal
  principal_type:
    description: Type of principal (USER, SYSTEM, SERVICE, API_KEY).
    lineage:
      - datalake_payout_system_raw.payment_audit_log.principal_type
  ts_payment_request_created:
    description: Payment request partition key (created_at).
    lineage:
      - datalake_payout_system_raw.payment_audit_log.payment_request_created_at
  ts_changed:
    description: Timestamp of the change (UTC).
    lineage:
      - datalake_payout_system_raw.payment_audit_log.changed_at
  ts_created:
    description: Record creation timestamp (UTC).
    lineage:
      - datalake_payout_system_raw.payment_audit_log.created_at
  ts_updated:
    description: Record last update timestamp (UTC).
    lineage:
      - datalake_payout_system_raw.payment_audit_log.updated_at
