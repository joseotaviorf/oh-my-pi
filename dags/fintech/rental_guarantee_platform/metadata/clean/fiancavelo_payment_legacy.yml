database_name: datalake_rental_guarantee_platform_clean
table_name: fiancavelo_payment_legacy
domain: Fintech
owner: juliana.hocihara@quintoandar.com.br
description: |
  Clean-layer legacy FiancaVelo payment charges ingested from Rental Guarantee Platform,
  representing Velo 2.0 billing invoices not yet migrated to QuintoCred 3.0. Grain is one
  row per payment identifier, keeping only the latest version by update timestamp. Used by
  Fintech analytics for QuintoCred payment reconciliation, PDD aging, and cross-system
  migration reporting. Partitioned by year, month, and day on ingestion date — always filter
  on all three partition columns in WHERE clauses to enable partition pruning.
columns:
  id:
    description: |
      Legacy FiancaVelo payment record identifier from the source billing system.
    lineage:
    - datalake_rental_guarantee_platform_raw.fiancavelo_payment_legacy.id
    description: Primary key of the legacy Velo record ingested from raw FiancaVelo
      tables.
  id_propose:
    description: |
      Foreign key to the legacy FiancaVelo rental guarantee proposal tied to this charge.
    lineage:
    - datalake_rental_guarantee_platform_raw.fiancavelo_payment_legacy.propose
    description: Foreign key referencing the legacy Velo rental guarantee proposal.
  id_subscription:
    description: |
      Recurring subscription identifier when this charge belongs to a subscription billing cycle.
    lineage:
    - datalake_rental_guarantee_platform_raw.fiancavelo_payment_legacy.subscription
    description: Foreign key referencing the legacy Velo subscription billed by the
      payment.
  id_user_insert:
    description: |
      Source user identifier that originally created the payment record in FiancaVelo.
    lineage:
    - datalake_rental_guarantee_platform_raw.fiancavelo_payment_legacy.userinsert
    description: User identifier that originally inserted the legacy Velo record.
  id_user_update:
    description: |
      Source user identifier that last modified the payment record in FiancaVelo.
    lineage:
    - datalake_rental_guarantee_platform_raw.fiancavelo_payment_legacy.userupdate
    description: User identifier that last updated the legacy Velo record.
  customer:
    description: |
      External customer identifier assigned by the payment gateway for the billed party.
    lineage:
    - datalake_rental_guarantee_platform_raw.fiancavelo_payment_legacy.customer
    description: Customer identifier in the legacy Velo payment gateway payload.
  payment_link:
    description: |
      Hosted checkout URL generated by the payment gateway for this invoice.
    lineage:
      - datalake_rental_guarantee_platform_raw.fiancavelo_payment_legacy.paymentlink
  invoice_url:
    description: |
      Public invoice or boleto URL exposed to the tenant for this charge.
    lineage:
      - datalake_rental_guarantee_platform_raw.fiancavelo_payment_legacy.invoiceurl
  unicid:
    description: |
      Legacy UNICID business key used to reconcile charges across Velo billing systems.
    lineage:
    - datalake_rental_guarantee_platform_raw.fiancavelo_payment_legacy.unicid
    description: Unique payment identifier assigned by the legacy Velo billing gateway.
  description:
    description: |
      Free-text invoice comments or line description entered in the legacy billing UI.
    lineage:
    - datalake_rental_guarantee_platform_raw.fiancavelo_payment_legacy.description
    description: Free-text description of the legacy Velo payment charge.
  gateway:
    description: |
      Payment processor or acquirer channel code used to collect this charge.
    lineage:
    - datalake_rental_guarantee_platform_raw.fiancavelo_payment_legacy.gateway
    description: Payment gateway provider handling the legacy Velo charge.
  status:
    description: |
      Raw payment lifecycle status code as stored in the legacy FiancaVelo database.
    lineage:
    - datalake_rental_guarantee_platform_raw.fiancavelo_payment_legacy.status
    description: Payment status returned by the legacy Velo billing integration.
  quintocred_status:
    description: |
      QuintoCred-normalized payment status mapped from the legacy Velo status vocabulary.
    lineage:
    - datalake_rental_guarantee_platform_raw.fiancavelo_payment_legacy.quintocred_status
    description: QuintoCred normalized status mapped from the legacy Velo payment.
  billing_type:
    description: |
      Legacy Velo billing type code indicating how this charge is categorized for collection.
    lineage:
    - datalake_rental_guarantee_platform_raw.fiancavelo_payment_legacy.billingtype
    description: Billing type code used for the legacy Velo subscription charge.
  quintocred_billing_type:
    description: |
      QuintoCred billing type label aligned to the legacy Velo billing type for migration.
    lineage:
    - datalake_rental_guarantee_platform_raw.fiancavelo_payment_legacy.quintocred_billing_type
    description: QuintoCred normalized billing type mapped from legacy Velo payments.
  value:
    description: |
      Gross invoice amount charged to the tenant before gateway fees, in Brazilian reais.
    lineage:
    - datalake_rental_guarantee_platform_raw.fiancavelo_payment_legacy.value
    description: Gross payment amount charged in the legacy Velo billing record.
  netvalue:
    description: |
      Net amount received after payment gateway fees and taxes are deducted, in Brazilian reais.
    lineage:
    - datalake_rental_guarantee_platform_raw.fiancavelo_payment_legacy.netvalue
    description: Net payment amount after fees in the legacy Velo billing record.
  is_active:
    description: |
      Boolean flag indicating whether the payment row is active in the legacy source system.
    lineage:
    - datalake_rental_guarantee_platform_raw.fiancavelo_payment_legacy.active
    description: Boolean flag indicating whether the legacy Velo record remains active.
  ts_due:
    description: |
      Timestamp when the invoice was due for payment according to the billing schedule.
    lineage:
      - datalake_rental_guarantee_platform_raw.fiancavelo_payment_legacy.duedate
  ts_due_original:
    description: |
      Original due timestamp before any due-date extension or renegotiation in legacy Velo.
    lineage:
    - datalake_rental_guarantee_platform_raw.fiancavelo_payment_legacy.originalduedate
    description: Original due timestamp before changes to the legacy payment schedule.
  ts_client_payment:
    description: |
      Timestamp when the tenant payment was recorded by the gateway or bank reconciliation.
    lineage:
    - datalake_rental_guarantee_platform_raw.fiancavelo_payment_legacy.clientpaymentdate
    description: Timestamp when the client completed payment in legacy Velo.
  ts_confirmed:
    description: |
      Timestamp when the payment gateway confirmed settlement of this charge.
    lineage:
    - datalake_rental_guarantee_platform_raw.fiancavelo_payment_legacy.confirmeddate
    description: Timestamp when the legacy Velo payment was confirmed by the gateway.
  ts_created:
    description: |
      Timestamp when the invoice was first created in the legacy FiancaVelo billing system.
    lineage:
    - datalake_rental_guarantee_platform_raw.fiancavelo_payment_legacy.datecreated
    description: Timestamp when the legacy Velo payment record was created.
  ts_inserted:
    description: |
      Timestamp when the row was inserted into the legacy FiancaVelo operational database.
    lineage:
    - datalake_rental_guarantee_platform_raw.fiancavelo_payment_legacy.dateinsert
    description: Timestamp when the legacy Velo record was first inserted in source.
  ts_updated:
    description: |
      Timestamp of the latest update to this payment row in the legacy source database.
    lineage:
    - datalake_rental_guarantee_platform_raw.fiancavelo_payment_legacy.dateupdate
    description: Timestamp when the legacy Velo record was last updated in source.
  year:
    description: |
      Ingestion partition year — filter on year, month, and day together for partition pruning.
    lineage:
    - datalake_rental_guarantee_platform_raw.fiancavelo_payment_legacy.year
    description: Column year on fiancavelo_payment_legacy.
  month:
    description: |
      Ingestion partition month — filter on year, month, and day together for partition pruning.
    lineage:
    - datalake_rental_guarantee_platform_raw.fiancavelo_payment_legacy.month
    description: Column month on fiancavelo_payment_legacy.
  day:
    description: |
      Ingestion partition day — filter on year, month, and day together for partition pruning.
    lineage:
    - datalake_rental_guarantee_platform_raw.fiancavelo_payment_legacy.day
    description: Column day on fiancavelo_payment_legacy.
description: Legacy Velo subscription payments migrated from FiancaVelo raw billing
  tables.
