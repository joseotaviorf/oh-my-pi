---
database_name: datalake_rental_guarantee_platform_clean
table_name: delinquency
description:
  QuintoCred is the name given to Velo after its acquisition by QuintoAndar in 2021. As of 2023, the Velo brand was replaced by QuintoCred.
  In June 2025, QuintoCred's core operations were shut down, leaving only the debt collection services active. In the first quarter of 2026, the decision was made to terminate the collection operations by July 31, 2026.
  Therefore, it is important to understand that all Velo and QuintoCred systems are considered legacy, and consequently, the involved tables are as well.
  One row per delinquency in the QuintoCred rental guarantee product, tracking
  underwriting, charges, renewals, and collections for landlord protection
  policies.
owner: guilherme.sacramento@quintoandar.com.br
domain: Fintech
columns:
  id:
    lineage:
      - datalake_rental_guarantee_platform_raw.delinquency.id
    description: QuintoCred rental guarantee attribute describing id in the policy lifecycle.
  id_propose:
    lineage:
      - datalake_rental_guarantee_platform_raw.delinquency.propose
    description: Identifier for the propose referenced by this financial record.
  id_status:
    lineage:
      - datalake_rental_guarantee_platform_raw.delinquency.status
    categories:
      "0": "REGISTERED - First status, when the delinquency is created"
      "1": "RECOVERING - The delinquency was sent to Recupera"
      "2": "PROGRESS - Legacy status from 2.0, not used anymore"
      "3": "FINISHED - The delinquency was paid (with gain or loss)"
      "4": "UNDER_AGREEMENT - A confirmed agreement between QuintoCred and the defaulter"
      "5": "REQUESTED_AGREEMENT - Agreement requested but not confirmed yet"
      "6": "ACTIVE_FALSE - The delinquency has active as false"
      "7": "FORGIVEN - The delinquency was forgiven"
    description: Identifier for the status referenced by this financial record.
  id_type:
    lineage:
      - datalake_rental_guarantee_platform_raw.delinquency.type
    categories:
      "0": "SIGNATURE - represents a signature delinquency, wich happens when the contract monthly wasnt paid"
      "1": "GUARANTEE - represents a guarantee delinquency"
      "2": "TERMINATION - represents a termination delinquency"
      "3": "BILLING - represents a billing delinquency"
      "4": "RENEWAL - DEPRECATED"
      "5": "RENEWAL_MONTH - represents the monthly bill of renewal, renewals are monthly by default"
      "6": "ACTIVATION_PARTIAL_LINK - represents a partial link activation debt of migrated contract from asaas"
    description: Identifier for the type referenced by this financial record.
