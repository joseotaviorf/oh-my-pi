database_name: datalake_rental_guarantee_platform_clean
table_name: credit_analysis
description:
  QuintoCred is the name given to Velo after its acquisition by QuintoAndar in 2021. As of 2023, the Velo brand was replaced by QuintoCred.
  In June 2025, QuintoCred's core operations were shut down, leaving only the debt collection services active. In the first quarter of 2026, the decision was made to terminate the collection operations by July 31, 2026.
  Therefore, it is important to understand that all Velo and QuintoCred systems are considered legacy, and consequently, the involved tables are as well.
  One row per credit analysis in the QuintoCred rental guarantee product,
  tracking underwriting, charges, renewals, and collections for landlord
  protection policies.
