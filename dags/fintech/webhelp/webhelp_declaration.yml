dag:
  name: webhelp
  schedule_start_date: 2024, 2, 7
  schedule_interval: 30 5 * * *
  owner: Data Fintech
  documentation:
    dag_purpose: |
      Ingestion of Webhelp data saved in parquet format files stored in
      an Azure Bucket (wasbs://lake-quinto-andar-sftp). Webhelp is an external
      company that is responsible for the collection of defaulting customers.
      The data will be used in the Collection Recovery analysis.
      Tribe: Portfolio Management.
      Get more information at: https://drive.google.com/drive/u/0/folders/1KQu5e2Qk6Waa05S46kdUMZpnsm3vUQ0T
workflow:
  layer: raw
  type: custom_ingestion
  load_spark_job: load_webhelp_raw
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, ds, 'load_end_date') }}"
  spark_job_arguments:
  - "{environment}"
  - "{bucket}"
  - "{dag_name}"
  - lake-quinto-andar-sftp
  - "COBRANCA"
  - parquet
  - "{table_name}"
  - "{load_start_date}"
  - "{load_end_date}"
  - "{extraction_type}"
  - "{partitions}"
  tables_customization:
    historicos_clientes:
      clean_table_name: historical_customers
      extraction_type: incremental
      partitions: ["year", "month", "day"]
      extra_spark_job_arguments:
      - partition_folder
    ocorrencias_clientes:
      clean_table_name: customer_occurrences
      extraction_type: incremental
      partitions: ["year", "month", "day"]
      extra_spark_job_arguments:
      - partition_folder
    analise_operadores:
      clean_table_name: operator_analysis
      extraction_type: incremental
      partitions: ["year", "month", "day"]
      extra_spark_job_arguments:
      - partition_folder
    titulos:
      clean_table_name: titles
      extraction_type: full
      partitions: []
      extra_spark_job_arguments:
      - partition_folder
    parcelas:
      clean_table_name: installments
      extraction_type: full
      partitions: []
      extra_spark_job_arguments:
      - partition_folder
    login:
      clean_table_name: login
      extraction_type: full
      partitions: []
      extra_spark_job_arguments:
      - general_folder
    estagios:
      clean_table_name: stages
      extraction_type: full
      partitions: []
      extra_spark_job_arguments:
      - general_folder
    tipo_contrato:
      clean_table_name: contract_type
      extraction_type: full
      partitions: []
      extra_spark_job_arguments:
      - general_folder
    credores:
      clean_table_name: creditors
      extraction_type: full
      partitions: []
      extra_spark_job_arguments:
      - general_folder
    devedores:
      clean_table_name: debtors
      extraction_type: full
      partitions: []
      extra_spark_job_arguments:
      - general_folder
    grupo_ocorrencias:
      clean_table_name: group_occurrences
      extraction_type: full
      partitions: []
      extra_spark_job_arguments:
      - general_folder
    importacao:
      clean_table_name: import
      extraction_type: full
      partitions: []
      extra_spark_job_arguments:
      - general_folder
cluster:
  type: databricks_13_3_med_general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
