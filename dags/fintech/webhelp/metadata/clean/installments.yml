---
database_name: datalake_webhelp_clean
table_name: installments
owner: juliana.hocihara@quintoandar.com.br
domain: Fintech
description: |
  Installment lines of defaulted contracts under active collection in the Webhelp CRM.
  Tracks due amounts, payment status, and whether each line belongs to a renegotiation plan.
columns:
  id_installment:
    description: Primary key of the installment in the Webhelp CRM.
    lineage:
      - datalake_webhelp_raw.parcelas.cod_parc
  id_title:
    description: Foreign key to the defaulted contract (title) this installment belongs to.
    lineage:
      - datalake_webhelp_raw.parcelas.cod_tit
  installment_number:
    description: Sequential installment number within the contract payment schedule.
    lineage:
      - datalake_webhelp_raw.parcelas.numero_parc
  ts_entry_installment:
    description: Timestamp when the installment entered the Webhelp collection portfolio.
    lineage:
      - datalake_webhelp_raw.parcelas.dt_entrada_parc
  is_returned:
    description: When true, the installment was returned to QuintoAndar and is no longer under Webhelp collection.
    lineage:
      - datalake_webhelp_raw.parcelas.devolvido_parc
  is_payment_in_installments:
    description: When true, the line is part of a renegotiation/installment plan rather than the original debt.
    lineage:
      - datalake_webhelp_raw.parcelas.parcelado_parc
  is_paid:
    description: When true, the installment was fully settled; when false, it remains open in collection.
    lineage:
      - datalake_webhelp_raw.parcelas.quitado_parc
  due_amount:
    description: Outstanding monetary amount due on this collection installment.
    lineage:
      - datalake_webhelp_raw.parcelas.vr_parc
  ts_due:
    description: Due date of the installment in the Webhelp CRM.
    lineage:
      - datalake_webhelp_raw.parcelas.vcto_parc
  ts_inclusion:
    description: Timestamp when the installment was included in the Webhelp CRM batch.
    lineage:
      - datalake_webhelp_raw.parcelas.dt_bord_parc
  id_import:
    description: Foreign key to the import batch that loaded this installment into Webhelp.
    lineage:
      - datalake_webhelp_raw.parcelas.cod_imp
  ts_load:
    description: Timestamp when this row was loaded into the clean Webhelp layer.
