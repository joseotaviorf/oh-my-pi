---
database_name: datalake_webhelp_clean
table_name: import
owner: juliana.hocihara@quintoandar.com.br
domain: Fintech
description: |
  Batch import jobs that loaded debtor, title, and installment files from QuintoAndar
  into the Webhelp collection CRM via SFTP parquet drops.
columns:
  id_import:
    description: Primary key of the import batch in the Webhelp CRM.
    lineage:
      - datalake_webhelp_raw.importacao.cod_imp
  file_name:
    description: Name of the parquet file imported into Webhelp for this batch load.
    lineage:
      - datalake_webhelp_raw.importacao.nome_arq
  ts_import:
    description: Timestamp when the import batch was processed in the Webhelp CRM.
    lineage:
      - datalake_webhelp_raw.importacao.data_imp
  ts_load:
    description: Timestamp when this row was loaded into the clean Webhelp layer.
