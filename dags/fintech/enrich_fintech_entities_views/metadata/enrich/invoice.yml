database_name: datalake_fintech_entities_views
table_name: invoice
description: Rental invoice records prepared for the fintech entities catalog, linking
  bills to contracts, users, and activity status.
domain: Fintech
owner: marcus.silva@quintoandar.com.br
columns:
  id_entity:
    lineage:
    - datalake_retsuko_clean.invoice.id
    description: Invoice used as the entity identifier in the catalog.
  id_house:
    lineage:
    - core_contract.contract.id_house
    description: Property linked to the invoice contract.
  id_contract:
    lineage:
    - core_contract.contract.id_contract
    description: Rental contract billed by the invoice.
  id_user:
    lineage:
    - datalake_retsuko_clean.account.id_main_user
    - core_contract.contract.id_tenant
    - core_contract.contract.id_owner
    description: Tenant or landlord user associated with the billed party.
  entity:
    description: Fixed catalog label identifying this as a rental invoice entity.
  persona:
    description: Whether the billed party is the tenant or the owner.
    lineage:
    - datalake_retsuko_clean.account.type
  business_context:
    description: Fixed commercial context for rental invoices.
  properties:
    lineage:
    - datalake_retsuko_clean.invoice.status
    - datalake_retsuko_clean.invoice.ts_created
    description: JSON snapshot of invoice status and creation time for the catalog.
  is_active:
    description: Whether the invoice is still open and actionable.
    lineage:
    - datalake_retsuko_clean.invoice.status
  ts_created:
    lineage:
    - datalake_retsuko_clean.invoice.ts_created
    description: When the invoice was created in the billing pipeline.
  ts_updated:
    lineage:
    - datalake_retsuko_clean.invoice.ts_retsuko_updated
    description: When the invoice was last updated in the billing pipeline.
