database_name: datalake_fintech_entities_views
table_name: invoice
description: >
  Enriched view of FR_INVOICE entities with persona derived from account type (TENANT, OWNER).
  Consumed by enrich_transactional_entities consolidation.
domain: Fintech
owner: isadora.gallerani@quintoandar.com.br
columns:
  id_entity:
    lineage:
      - datalake_retsuko_clean.invoice.id
    description: Invoice id serving as the entity identifier.
  id_house:
    lineage:
      - core_contract.contract.id_house
    description: House id derived from the associated contract.
  id_contract:
    lineage:
      - core_contract.contract.id_contract
    description: Contract id associated with the invoice.
  id_user:
    lineage:
      - datalake_retsuko_clean.account.id_main_user
      - core_contract.contract.id_tenant
      - core_contract.contract.id_owner
    description: User id derived from account type (tenant or landlord).
  entity:
    description: Fixed value 'FR_INVOICE'.
  persona:
    description: TENANT or OWNER (derived from retsuko account type).
  business_context:
    description: Fixed value 'RENT'.
  properties:
    lineage:
      - datalake_retsuko_clean.invoice.status
      - datalake_retsuko_clean.invoice.ts_created
    description: JSON with invoice status and creation timestamp.
  is_active:
    description: TRUE for status 'open', FALSE for divergent-payment/not-payable/written-down/canceled/paid.
  ts_created:
    lineage:
      - datalake_retsuko_clean.invoice.ts_created
    description: Timestamp when the invoice was created.
  ts_updated:
    lineage:
      - datalake_retsuko_clean.invoice.ts_retsuko_updated
    description: Timestamp when the invoice was last updated in Retsuko.
