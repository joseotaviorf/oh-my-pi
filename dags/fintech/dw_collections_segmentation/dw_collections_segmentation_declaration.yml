dag:
  name: dw_collections_segmentation
  schedule_start_date: 2025, 8, 8
  owner: Data Fintech
  documentation:
    dag_purpose: |
      Creates tables for collections segmentation analysis in QuintoAndar context.
      Contains tables for timeline analysis and wallet segmentation for collections operations.
workflow:
  type: query_delta
  layer: dw
  custom_schema: collections_segmentation
  default_extraction_type: incremental
  default_partitions: [year, month, day]
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, -30), 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, 1), 'load_end_date') }}"
  execution_timeout_hours: 14
  inner_dependencies:
    fact_contract_features_timeline:
      - fact_contract_wallet_timeline
    fact_contract_wallet_timeline:
      - fact_invoice_wallet_timeline
  tables_customization:
    fact_invoice_wallet_timeline:
      z_order_by: [dt_reference, sk_contract, sk_invoice]
    fact_contract_wallet_timeline:
      z_order_by: [dt_reference, sk_contract]
    fact_contract_features_timeline:
      z_order_by: [dt_reference, sk_contract]
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: r5d.4xlarge
    node_type_id: r5d.8xlarge
    spark_version: 16.4.x-scala2.12
    num_workers: 4
  databricks_conn_id: databricks_new_env
