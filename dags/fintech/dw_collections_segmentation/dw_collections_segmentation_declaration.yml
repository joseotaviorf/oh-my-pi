dag:
  name: dw_collections_segmentation
  schedule_start_date: 2025, 8, 8
  owner: Data Fintech
  documentation:
    dag_purpose: |
      Creates tables for collections segmentation analysis in QuintoAndar context.
      Contains tables for timeline analysis and wallet segmentation for collections operations.
workflow:
  type: query_delta
  layer: dw
  custom_schema: collections_segmentation
  inner_dependencies:
    fact_contract_features_timeline:
      - fact_contract_wallet_timeline
    fact_contract_wallet_timeline:
      - fact_invoice_wallet_timeline
  tables_customization:
    fact_invoice_wallet_timeline:
      z_order_by: [dt_reference, sk_contract, sk_invoice]
      partitions: [year, month, day]
    fact_contract_wallet_timeline:
      z_order_by: [dt_reference, sk_contract]
      partitions: [year, month, day]
    fact_contract_features_timeline:
      z_order_by: [dt_reference, sk_contract]
      partitions: [year, month, day]
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: r5d.2xlarge
    node_type_id: m5d.8xlarge
    spark_version: 13.3.x-scala2.12
    num_workers: 4
    spark_conf:
      spark.sql.sources.partitionOverwriteMode: static
