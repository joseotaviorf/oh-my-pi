cluster:
  type: emr_7_12_consolidation_xl_memory_cluster
  custom_configurations:
    # Memory-bound workload (window storm on fact_contract_features_timeline).
    # Fewer, larger executors per r7g.8xlarge (256 GB) reduce shuffle spill vs 8×24g.
    # Cost-saving spot/OD mix: 1 CORE on-demand + 3 TASK spot (~75% spot).
    # num_workers is the TOTAL (CORE + TASK), so 4 = 1 CORE + 3 TASK.
    num_workers: 4
    num_task_workers: 3
    spark_conf:
      # Driver (m7g.xlarge — 4 vCPU / 16 GB)
      spark.driver.memory: 12g
      spark.driver.cores: "4"
      spark.driver.memoryOverhead: 4g
      # Workers: r7g.8xlarge (32 vCPU / 256 GB each).
      # 3 executors/worker × 8 cores × (48g heap + 8g overhead) ≈ 168 GB used / node.
      spark.executor.memory: 48g
      spark.executor.cores: "8"
      spark.executor.memoryOverhead: 8g
      # 4 workers × 3 executors/worker = 12 executors max.
      spark.dynamicAllocation.minExecutors: "6"
      spark.dynamicAllocation.maxExecutors: "12"
      # Widen shuffle for contract-partitioned windows; AQE coalesces small partitions.
      spark.sql.shuffle.partitions: "384"
      spark.sql.adaptive.coalescePartitions.enabled: "true"
