---
database_name: dw_collections_segmentation
table_name: fact_contract_wallet_timeline
owner: bianca.martins@quintoandar.com.br
domain: Fintech
description: |
  Daily timeline of contracts in QuintoAndar collections context with wallet segmentation metrics.
  Contains comprehensive contract-level information including evictions, collection efforts, negotiations,
  and aggregated wallet metrics across multiple delay methodologies for collections analysis.
columns:
  sk_contract_wallet_timeline:
    description: Record unique identification (surrogate key)
    lineage:
      - dw_collections_segmentation.fact_invoice_wallet_timeline.sk_contract
      - dw_collections_segmentation.fact_invoice_wallet_timeline.dt_reference
  sk_contract:
    description: Contract identifier (surrogate key)
    lineage:
      - dw_collections_segmentation.fact_invoice_wallet_timeline.sk_contract
  dt_reference:
    description: Reference date for the timeline
  reference_contract_status:
    description: Contract status at the reference date (Active/Finished)
  max_delay_contaminated_contract_t1:
    description: Maximum delay with contamination at contract level using T1 methodology
  max_delay_contaminated_contract_t2:
    description: Maximum delay with contamination at contract level using T2 methodology
  max_delay_original_invoices_t1:
    description: Maximum delay for original invoices using T1 methodology
  max_delay_deal_invoices_t1:
    description: Maximum delay for deal invoices using T1 methodology
  max_delay_original_invoices_t2:
    description: Maximum delay for original invoices using T2 methodology
  max_delay_deal_invoices_t2:
    description: Maximum delay for deal invoices using T2 methodology
  max_delay_contaminated_contract_t3_losses:
    description: Maximum delay with contamination for loss calculations using T3 methodology
  max_open_delay_contaminated_contract_t3_losses:
    description: Maximum open delay with contamination for loss calculations using T3 methodology
  n_overdue_monthlys_t1:
    description: Number of overdue monthly invoices using T1 methodology
  n_overdue_deals_t1:
    description: Number of overdue deal invoices using T1 methodology
  n_overdue_others_t1:
    description: Number of overdue other invoices using T1 methodology
  n_overdue_monthlys_t2:
    description: Number of overdue monthly invoices using T2 methodology
  n_overdue_deals_t2:
    description: Number of overdue deal invoices using T2 methodology
  n_overdue_others_t2:
    description: Number of overdue other invoices using T2 methodology
  sum_overdue_monthlys_t2:
    description: Sum of overdue monthly invoice amounts using T2 methodology
  sum_overdue_deals_t2:
    description: Sum of overdue deal invoice amounts using T2 methodology
  sum_overdue_others_t2:
    description: Sum of overdue other invoice amounts using T2 methodology
  has_negotiation_in_contract:
    description: Flag indicating if contract has any negotiation
  sum_monthly_overdue_days_paid_t1:
    description: Sum of days overdue for monthly invoices that were paid using T1 methodology
  count_monthly_overdue_invoices_paid_t1:
    description: Count of monthly overdue invoices that were paid using T1 methodology
  days_since_ending:
    description: Number of days since contract ended
  days_since_contract_start:
    description: Number of days since contract started
  n_reparos_invoices:
    description: Number of invoices with repair bill items
  n_condominio_invoices:
    description: Number of invoices with condominium bill items
  n_condominio_open_invoices:
    description: Number of open invoices with condominium bill items
  open_condominio_balance:
    description: Open balance amount for condominium bill items
  n_multa_recisoria_invoices:
    description: Number of invoices with termination fine bill items
  n_multa_recisoria_open_invoices:
    description: Number of open invoices with termination fine bill items
  open_multa_recisoria_balance:
    description: Open balance amount for termination fine bill items
  n_acordo_invoices:
    description: Number of invoices with agreement bill items
  n_acordo_open_invoices:
    description: Number of open invoices with agreement bill items
  open_acordo_balance:
    description: Open balance amount for agreement bill items
  n_rental_core_invoices:
    description: Number of invoices with rental core bill items
  n_rental_core_open_invoices:
    description: Number of open invoices with rental core bill items
  open_rental_core_balance:
    description: Open balance amount for rental core bill items
  n_reparos_open_invoices:
    description: Number of open invoices with repair bill items
  open_reparos_balance:
    description: Open balance amount for repair bill items
  n_multas_ongoing_invoices:
    description: Number of invoices with ongoing fine bill items
  n_multas_ongoing_open_invoices:
    description: Number of open invoices with ongoing fine bill items
  open_multas_ongoing_balance:
    description: Open balance amount for ongoing fine bill items
  n_utilidades_invoices:
    description: Number of invoices with utilities bill items
  n_utilidades_open_invoices:
    description: Number of open invoices with utilities bill items
  open_utilidades_balance:
    description: Open balance amount for utilities bill items
  n_outros_invoices:
    description: Number of invoices with other bill items
  n_outros_open_invoices:
    description: Number of open invoices with other bill items
  open_outros_balance:
    description: Open balance amount for other bill items
  cpc:
    description: Total CPC (contact completions) for the contract on reference date
    lineage:
      - dw_collection_recovery_quintoandar.fact_collection.total_cpc
  alo:
    description: Total ALO (contact attempts) for the contract on reference date
    lineage:
      - dw_collection_recovery_quintoandar.fact_collection.total_alo
  has_app_events:
    description: Flag indicating if contract has app events on reference date
    lineage:
      - datalake_collections_quintoandar.delinquency_app_events.id_amplitude
  has_app_events_overdue:
    description: Flag indicating if contract has overdue-related app events on reference date
    lineage:
      - datalake_collections_quintoandar.delinquency_app_events.id_amplitude
  qt_app_events:
    description: Quantity of app events for the contract on reference date
    lineage:
      - datalake_collections_quintoandar.delinquency_app_events.id_amplitude
  qt_app_events_overdue:
    description: Quantity of overdue-related app events for the contract on reference date
    lineage:
      - datalake_collections_quintoandar.delinquency_app_events.id_amplitude
  promessas:
    description: Quantity of promises (negotiations without the payment of the first installment) for the contract on reference date
    lineage:
      - dw_collection_recovery_quintoandar.fact_negotiation.sk_negotiation
  qt_acordo_quebrado:
    description: Quantity of broken agreements for the contract
    lineage:
      - dw_collection_recovery_quintoandar.fact_negotiation.negotiation_status
  qt_promessa_quebrada_fp:
    description: Quantity of broken first payment promises for the contract
    lineage:
      - dw_collection_recovery_quintoandar.fact_negotiation
  qt_aco_desconto:
    description: Quantity of discount agreements for the contract
    lineage:
      - dw_collection_recovery_quintoandar.fact_negotiation.discount_to_original_amount
  id_process_evictions:
    description: Eviction process identifier when contract has active eviction
    lineage:
      - datalake_gsheets_clean.evictions_base.id_process
  has_overdue_balance_over0_t1_at_ending:
    description: Flag indicating if contract has any overdue balance using T1 methodology at ending
  has_overdue_balance_over5_t1_at_ending:
    description: Flag indicating if contract has overdue balance over 5 days using T1 methodology at ending
  has_overdue_balance_over0_t2_at_ending:
    description: Flag indicating if contract has any overdue balance using T2 methodology at ending
  has_overdue_balance_over5_t2_at_ending:
    description: Flag indicating if contract has overdue balance over 5 days using T2 methodology at ending
  has_overdue_balance_over0_t3_at_ending:
    description: Flag indicating if contract has any overdue balance using T3 methodology at ending
  has_overdue_balance_over5_t3_at_ending:
    description: Flag indicating if contract has overdue balance over 5 days using T3 methodology at ending
  is_evictions:
    description: Flag indicating if contract has active eviction process
    lineage:
      - datalake_gsheets_clean.evictions_base
  n_anchor_invoices_not_negativable:
    description: Number of anchor invoices that are not eligible for negative operations
  n_invoices_negativable:
    description: Number of invoices eligible for negative operations
  n_first_invoices_open:
    description: Number of first invoices that are open
  has_fpd_in_wallet:
    description: Flag indicating if contract has first payment default in wallet
  array_open_invoices:
    description: Array of open invoice identifiers for the contract
    lineage:
      - dw_collections_segmentation.fact_invoice_wallet_timeline.sk_invoice
  array_paid_invoices:
    description: Array of paid invoice identifiers for the contract
    lineage:
      - dw_collections_segmentation.fact_invoice_wallet_timeline.sk_invoice
  array_negotiated_invoices:
    description: Array of negotiated invoice identifiers for the contract
    lineage:
      - dw_collections_segmentation.fact_invoice_wallet_timeline.sk_invoice
  n_monthly_invoices:
    description: Number of monthly invoices for the contract
    lineage:
      - dw_collections_segmentation.fact_invoice_wallet_timeline.invoice_type
  n_invoices_paid:
    description: Number of invoices paid for the contract
    lineage:
      - dw_collections_segmentation.fact_invoice_wallet_timeline.payment_status
  n_invoices_paid_ontime_t2:
    description: Number of invoices paid on time using T2 methodology
    lineage:
      - dw_collections_segmentation.fact_invoice_wallet_timeline.payment_status
  n_overdue_invoices_paid_t2:
    description: Number of overdue invoices paid using T2 methodology
    lineage:
      - dw_collections_segmentation.fact_invoice_wallet_timeline.payment_status
  n_invoices_paid_ontime_t1:
    description: Number of invoices paid on time using T1 methodology
    lineage:
      - dw_collections_segmentation.fact_invoice_wallet_timeline.payment_status
  n_overdue_invoices_paid_t1:
    description: Number of overdue invoices paid using T1 methodology
    lineage:
      - dw_collections_segmentation.fact_invoice_wallet_timeline.payment_status
  n_monthly_invoices_paid_ontime_t2:
    description: Number of monthly invoices paid on time using T2 methodology
    lineage:
      - dw_collections_segmentation.fact_invoice_wallet_timeline.payment_status
  n_monthly_invoices_paid_ontime_t1:
    description: Number of monthly invoices paid on time using T1 methodology
    lineage:
      - dw_collections_segmentation.fact_invoice_wallet_timeline.payment_status
  n_monthly_overdue_invoices_paid_t2:
    description: Number of monthly overdue invoices paid using T2 methodology
    lineage:
      - dw_collections_segmentation.fact_invoice_wallet_timeline.payment_status
  n_monthly_overdue_invoices_paid_t1:
    description: Number of monthly overdue invoices paid using T1 methodology
    lineage:
      - dw_collections_segmentation.fact_invoice_wallet_timeline.payment_status
  n_monthly_invoices_created:
    description: Number of monthly invoices created for the contract
    lineage:
      - dw_collections_segmentation.fact_invoice_wallet_timeline.dt_begin
  n_invoices_in_wallet:
    description: Total number of invoices in the contract wallet
    lineage:
      - dw_collections_segmentation.fact_invoice_wallet_timeline.sk_invoice
  monthly_income:
    description: Monthly income of the contract proponent
    lineage:
      - datalake_sorting_hat_clean.proponent.monthly_income
  open_wallet_overdue_t1:
    description: Open wallet amount overdue using T1 methodology
  open_wallet_overdue_t2:
    description: Open wallet amount overdue using T2 methodology
  open_wallet_overdue_t3:
    description: Open wallet amount overdue using T3 methodology
  wallet_overdue_t2:
    description: Wallet amount overdue using T2 methodology
  debts_in_income_share_t2:
    description: Ratio of overdue wallet amount to monthly income using T2 methodology
  overdue_recovered_amount_t2:
