---
database_name: dw_collections_segmentation
table_name: fact_contract_wallet_timeline
owner: bianca.martins@quintoandar.com.br
domain: Fintech
description: |
  Daily timeline of contracts in QuintoAndar collections context with wallet segmentation metrics.
  Contains comprehensive contract-level information including evictions, collection efforts, negotiations,
  and aggregated wallet metrics across multiple delay methodologies for collections analysis.
columns:
  id_contract:
    description: Contract identifier
    lineage:
      - dw_collections_segmentation.fact_invoice_wallet_timeline.id_contract
  id_process_evictions:
    description: Eviction process identifier when contract has active eviction
    lineage:
      - datalake_gsheets_clean.evictions_base.id_process
  contract_status_beginning_of_month:
    description: Contract status at the beginning of the reference month (Active/Finished)
  reference_contract_status:
    description: Contract status at the reference date (Active/Finished)
  is_pipeturn_day:
    description: Flag indicating if reference date is the pipeline turn day for the month
  is_first_day:
    description: Flag indicating if reference date is the first day of the month
  is_last_day:
    description: Flag indicating if reference date is the last day of the month
  is_quitacao_t1:
    description: Flag indicating if contract achieved quitação (full payment) using T1 methodology
  is_quitacao_t2:
    description: Flag indicating if contract achieved quitação (full payment) using T2 methodology
  is_quitacao_t3:
    description: Flag indicating if contract achieved quitação (full payment) using T3 methodology
  is_regular_t1:
    description: Flag indicating if contract is regular (no overdue balance) using T1 methodology
  is_current_at_month_start_t1:
    description: Flag indicating if contract was current at month start using T1 methodology
  num_has_negotiation_in_contract:
    description: Flag indicating if contract has any negotiation (0 or 1)
  n_anchor_invoices_not_negativable:
