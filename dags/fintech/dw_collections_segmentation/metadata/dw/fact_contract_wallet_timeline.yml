    lineage:
      - dw_rent.dim_contract.condo
      - dw_rent.dim_contract.rent
      - dw_rent.dim_contract.iptu
  open_wallet_to_due_deals:
    description: Total amount of open deal debt that is not overdue yet considering T1 contamination methodology, i.e it is to-due
  open_wallet_to_due_deals_at_reference_month:
    description: Total amount of open deal debt that has due date equivalent or before the reference month of observation
  open_wallet_to_due_deals_at_future_month:
