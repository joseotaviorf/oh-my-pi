database_name: dw_collections_segmentation
table_name: fact_contract_wallet_timeline
owner: juliana.hocihara@quintoandar.com.br
domain: Fintech
description: |-
  Daily timeline of contracts in QuintoAndar collections context with wallet segmentation metrics. Grain is one row per contract and reference date, aggregated from dw_collections_segmentation.fact_invoice_wallet_timeline (invoice-level wallet timeline). Contains contract-level eviction, collection-effort, negotiation, and wallet metrics across delay methodologies used in collections analysis.
  Delay methodologies: T1 is delay from the nominal due date of invoices — a deal that restructures older debt into future installments can therefore show T1 < 0 (not overdue yet). T2 is delay contamination that anchors ongoing deal installments to the delay of the negotiated debt, so the same deal can show T2 > 0 while T1 < 0. When the contract has no multiple deal installments, T1 equals T2.
columns:
  sk_contract_wallet_timeline:
    description: Record unique identification (surrogate key)
    lineage:
    - dw_collections_segmentation.fact_invoice_wallet_timeline.sk_contract
    - dw_collections_segmentation.fact_invoice_wallet_timeline.dt_reference
  sk_contract:
    description: Contract identifier (surrogate key)
    lineage:
    - dw_collections_segmentation.fact_invoice_wallet_timeline.sk_contract
  dt_reference:
    description: Reference date for the timeline
    lineage:
    - dw_collections_segmentation.fact_invoice_wallet_timeline.dt_reference
  reference_contract_status:
    description: Contract status at the reference date (Active/Finished)
    lineage:
    - dw_collections_segmentation.fact_invoice_wallet_timeline.dt_contract_annulled
    - dw_collections_segmentation.fact_invoice_wallet_timeline.dt_reference
  max_delay_contaminated_contract_t1:
    description: 'Maximum invoice delay at contract level using T1 methodology: delay from the nominal
      due date of each invoice (dt_due). Deal installments due in the future can be T1 < 0 even when they
      represent older negotiated debt.'
    lineage:
    - dw_collections_segmentation.fact_invoice_wallet_timeline.invoice_delay_t1
  max_delay_contaminated_contract_t2:
    description: 'Maximum invoice delay at contract level using T2 methodology: delay contamination that
      anchors ongoing deal installments to the delay of the negotiated (parent) debt. A deal can therefore
      show T2 > 0 while T1 < 0. When the contract has no multi-installment deal structure, T1 equals T2.'
    lineage:
    - dw_collections_segmentation.fact_invoice_wallet_timeline.invoice_delay_t2
  max_delay_original_invoices_t1:
    description: Maximum T1 delay among original (non-deal-child) invoices, using nominal due dates.
    lineage:
    - dw_collections_segmentation.fact_invoice_wallet_timeline.invoice_delay_t1
    - dw_collections_segmentation.fact_invoice_wallet_timeline.is_child_negotiation
  max_delay_deal_invoices_t1:
    description: Maximum T1 delay among deal-child invoices, using each installment nominal due date.
    lineage:
    - dw_collections_segmentation.fact_invoice_wallet_timeline.invoice_delay_t1
    - dw_collections_segmentation.fact_invoice_wallet_timeline.is_child_negotiation
  max_delay_original_invoices_t2:
    description: Maximum T2 delay among original (non-deal-child) invoices, with delay contamination.
    lineage:
    - dw_collections_segmentation.fact_invoice_wallet_timeline.invoice_delay_t2
    - dw_collections_segmentation.fact_invoice_wallet_timeline.is_child_negotiation
  max_delay_deal_invoices_t2:
    description: Maximum T2 delay among deal-child invoices, anchored to the negotiated debt delay.
    lineage:
    - dw_collections_segmentation.fact_invoice_wallet_timeline.invoice_delay_t2
    - dw_collections_segmentation.fact_invoice_wallet_timeline.is_child_negotiation
  max_delay_contaminated_contract_t3_losses:
    description: Maximum delay with contamination for loss calculations using T3 methodology
    lineage:
    - dw_collections_segmentation.fact_invoice_wallet_timeline.contract_delay_t3_losses
  max_open_delay_contaminated_contract_t3_losses:
