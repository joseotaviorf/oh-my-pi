  open_wallet_overdue_t1:
    description: Open wallet amount overdue using T1 methodology
  overdue_recovered_amount_t1:
    description: Amount recovered from overdue invoices using T1 methodology
  on_time_paid_amount_t1:
    description: Amount paid on time using T1 methodology
  wallet_on_time_t2:
    description: Wallet amount paid on time using T2 methodology
  wallet_overdue_t2:
    description: Wallet amount overdue using T2 methodology
  open_wallet_on_time_t2:
    description: Open wallet amount on time using T2 methodology
  open_wallet_overdue_t2:
    description: Open wallet amount overdue using T2 methodology
  overdue_recovered_amount_t2:
    description: Amount recovered from overdue invoices using T2 methodology
  on_time_paid_amount_t2:
    description: Amount paid on time using T2 methodology
  wallet_on_time_t3:
    description: Wallet amount paid on time using T3 methodology
  wallet_overdue_t3:
