  open_wallet:
    description: Total open wallet amount for the contract
  wallet:
    description: Total wallet amount for the contract
  recovered_amount:
    description: Total recovered amount for the contract
  wallet_on_time_t1:
    description: Wallet amount paid on time using T1 methodology
  wallet_overdue_t1:
    description: Wallet amount overdue using T1 methodology
  debts_in_income_share_t1:
    description: Ratio of overdue wallet amount to monthly income using T1 methodology
  open_wallet_on_time_t1:
    description: Open wallet amount on time using T1 methodology
  overdue_recovered_amount_t1:
    description: Amount recovered from overdue invoices using T1 methodology
  on_time_paid_amount_t1:
    description: Amount paid on time using T1 methodology
  wallet_on_time_t2:
    description: Wallet amount paid on time using T2 methodology
  open_wallet_on_time_t2:
    description: Open wallet amount on time using T2 methodology
  on_time_paid_amount_t2:
    description: Amount paid on time using T2 methodology
  wallet_on_time_t3:
    description: Wallet amount paid on time using T3 methodology
  wallet_overdue_t3:
    description: Wallet amount overdue using T3 methodology
  open_wallet_on_time_t3:
    description: Open wallet amount on time using T3 methodology
  overdue_recovered_amount_t3:
    description: Amount recovered from overdue invoices using T3 methodology
  on_time_paid_amount_t3:
    description: Amount paid on time using T3 methodology
  max_open_delay_contaminated_contract_t1:
    description: Maximum open delay with contamination at contract level using T1 methodology
  max_open_delay_contaminated_contract_t2:
    description: Maximum open delay with contamination at contract level using T2 methodology
  rent:
    description: Rent value of the contract
    lineage:
      - dw_rent.dim_contract.rent
  condo:
    description: CONDO value of the contract
    lineage:
      - dw_rent.dim_contract.condo
  iptu:
    description: IPTU value of the contract
    lineage:
      - dw_rent.dim_contract.iptu
  contract_guarantee:
    description: Type of guarantee associated with the rental contract
    lineage:
      - dw_rent.dim_contract.guarantee
  package_amount:
