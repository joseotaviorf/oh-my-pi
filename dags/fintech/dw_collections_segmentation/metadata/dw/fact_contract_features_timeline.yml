    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.qt_acordo_quebrado
  acc_broken_promessas_lifetime:
    description: Accumulated number of broken promises (promessas quebradas) over the contract lifetime
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.qt_promessa_quebrada_fp
  acc_deals_principal_discount_lifetime:
    description: Accumulated number of deals with principal amount discount (forgiveness) over the contract lifetime
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.qt_aco_desconto
  acc_sum_monthly_overdue_days_paid_t1:
    description: Accumulated sum of days overdue for monthly invoices paid using T1 methodology over contract lifetime
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.sum_monthly_overdue_days_paid_t1
  acc_count_monthly_overdue_invoices_paid_t1:
    description: Accumulated count of monthly overdue invoices paid using T1 methodology over contract lifetime
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.count_monthly_overdue_invoices_paid_t1
  acc_n_monthly_invoices_l12m:
    description: Accumulated number of monthly invoices over the last 12 months
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_monthly_invoices
  acc_n_monthly_invoices_paid_ontime_t2_l12m:
    description: Accumulated number of monthly invoices paid on time (T2) over the last 12 months
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_monthly_invoices_paid_ontime_t2
  acc_n_monthly_invoices_paid_ontime_t1_l12m:
    description: Accumulated number of monthly invoices paid on time (T1) over the last 12 months
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_monthly_invoices_paid_ontime_t1
  acc_n_monthly_overdue_invoices_paid_t2_l12m:
    description: Accumulated number of monthly overdue invoices paid (T2) over the last 12 months
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_monthly_overdue_invoices_paid_t2
  acc_n_monthly_overdue_invoices_paid_t1_l12m:
    description: Accumulated number of monthly overdue invoices paid (T1) over the last 12 months
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_monthly_overdue_invoices_paid_t1
  acc_n_invoices_paid_ontime_t2_l12m:
    description: Accumulated number of all invoices paid on time (T2) over the last 12 months
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_invoices_paid_ontime_t2
  acc_n_invoices_paid_ontime_t1_l12m:
    description: Accumulated number of all invoices paid on time (T1) over the last 12 months
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_invoices_paid_ontime_t1
  acc_n_overdue_invoices_paid_t2_l12m:
    description: Accumulated number of overdue invoices paid (T2) over the last 12 months
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_overdue_invoices_paid_t2
  acc_n_overdue_invoices_paid_t1_l12m:
    description: Accumulated number of overdue invoices paid (T1) over the last 12 months
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_overdue_invoices_paid_t1
  acc_count_monthly_invoices_created:
    description: Accumulated count of monthly invoices created over the last 12 months
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_monthly_invoices_created
  acc_count_monthly_invoices_paid_ontime_t1:
    description: Accumulated count of monthly invoices paid on time (T1) over the last 12 months
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_monthly_invoices_paid_ontime_t1
  n_evictions_processes_lifetime:
    description: Number of distinct eviction processes accumulated over contract lifetime
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.id_process_evictions
  has_overdue_balance_over0_t1_at_ending_ffill:
    description: Forward fill from has_overdue_balance_over0_t1_at_ending - indicates if contract ever had overdue balance over 0 days using T1 methodology at ending
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.has_overdue_balance_over0_t1_at_ending
  has_overdue_balance_over5_t1_at_ending_ffill:
    description: Forward fill from has_overdue_balance_over5_t1_at_ending - indicates if contract ever had overdue balance over 5 days using T1 methodology at ending
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.has_overdue_balance_over5_t1_at_ending
  avg_days_overdue_invoices_paid_t1:
    description: Average days overdue for invoices paid - calculated as ACC_SUM_MONTHLY_OVERDUE_DAYS_PAID_T1 divided by ACC_COUNT_MONTHLY_OVERDUE_INVOICES_PAID_T1
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.sum_monthly_overdue_days_paid_t1
      - dw_collections_segmentation.fact_contract_wallet_timeline.count_monthly_overdue_invoices_paid_t1
  share_monthly_paid_ontime_t1:
    description: Share of monthly invoices paid on time using T1 methodology - ratio of monthly invoices paid on time to total monthly invoices created
    lineage:
      - dw_collections_segmentation.fact_contract_features_timeline.acc_count_monthly_invoices_paid_ontime_t1
      - dw_collections_segmentation.fact_contract_features_timeline.acc_count_monthly_invoices_created
  pct_monthly_paid_ontime_t2_l12m:
    description: Percentage of monthly invoices paid on time (T2) over last 12 months
    lineage:
      - dw_collections_segmentation.fact_contract_features_timeline.acc_n_monthly_invoices_paid_ontime_t2_l12m
      - dw_collections_segmentation.fact_contract_features_timeline.acc_n_monthly_invoices_l12m
  pct_monthly_paid_ontime_t1_l12m:
    description: Percentage of monthly invoices paid on time (T1) over last 12 months
    lineage:
      - dw_collections_segmentation.fact_contract_features_timeline.acc_n_monthly_invoices_paid_ontime_t1_l12m
      - dw_collections_segmentation.fact_contract_features_timeline.acc_n_monthly_invoices_l12m
  pct_invoices_paid_ontime_t2_l12m:
    description: Percentage of all invoices (not just monthly) paid on time (T2) over last 12 months
    lineage:
      - dw_collections_segmentation.fact_contract_features_timeline.acc_n_invoices_paid_ontime_t2_l12m
      - dw_collections_segmentation.fact_contract_features_timeline.acc_n_overdue_invoices_paid_t2_l12m
  pct_invoices_paid_ontime_t1_l12m:
    description: Percentage of all invoices (not just monthly) paid on time (T1) over last 12 months
    lineage:
      - dw_collections_segmentation.fact_contract_features_timeline.acc_n_invoices_paid_ontime_t1_l12m
      - dw_collections_segmentation.fact_contract_features_timeline.acc_n_overdue_invoices_paid_t1_l12m
  mob_months:
    description: Months on books - number of months since contract start date calculated as the difference in years and months between reference date and contract start
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.dt_reference
      - dw_collections_segmentation.fact_contract_wallet_timeline.dt_contract_start
  n_days_over1_t2_l180:
    description: Number of days with delay greater than 1 day (T2 methodology) over the last 180 days
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.max_delay_contaminated_contract_t2
  monthly_income:
    description: Sum of monthly income from proponentes (contract holders) who will reside in the property
    lineage:
      - datalake_sorting_hat_clean.proponent.monthly_income
      - dw_rent.fact_listing_rent_flows.sk_proposal
      - dw_rent.fact_listing_rent_flows.sk_contract
      - dw_rent.dim_contract.sk_contract
  package_amount:
    description: Sum of RENT, CONDO and IPTU of contract
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.package_amount
  wallet_overdue_t2:
    description: Total overdue amount in wallet using T2 contamination methodology
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.wallet_overdue_t2
  open_wallet_to_due_deals:
    description: Total amount of open deal debt that is not overdue yet considering T1 contamination methodology, i.e it is to-due
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.open_wallet_to_due_deals
  overdue_recovered_amount_t2:
    description: Total amount recovered from overdue invoices using T2 methodology
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.overdue_recovered_amount_t2
  tree_class:
    description: |
      Decision tree classification by contract status and T2 max delay (days). TREE 0: Active with delay 0-3; TREE 1: Active
      with delay 4-30; TREE 2: Active with delay over 30; TREE 3: Ended with delay up to 30; TREE 4: Ended with delay
      31 or more; NO_TREE: any other combination. Used for reporting and legacy comms-style logic (distinct from
      macro_segmentation-based freezing of prob_payment).
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.reference_contract_status
      - dw_collections_segmentation.fact_contract_wallet_timeline.max_delay_contaminated_contract_t2
  prob_payment_at_dt_reference:
    description: |
      Payment probability band calculated at each reference date before macro-segment freezing. Combines rule-based
      branches with collections score v3 thresholds on payment_probability_propagated (per contract status and delay
      bucket). Active stock contracts use a 0.38 score threshold for HIGH versus LOW. Values: VERY_HIGH, HIGH, MEDIUM,
      LOW, VERY_LOW, or NULL-prefixed states depending on phase.
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.reference_contract_status
      - dw_collections_segmentation.fact_contract_wallet_timeline.max_delay_contaminated_contract_t2
      - dw_collections_segmentation.fact_contract_features_timeline.avg_days_overdue_invoices_paid_t1
      - dw_collections_segmentation.fact_contract_features_timeline.n_days_over1_t2_l180
      - dw_collections_segmentation.fact_contract_features_timeline.acc_broken_promessas_lifetime
      - dw_collections_segmentation.fact_contract_wallet_timeline.days_since_ending
      - datalake_sorting_hat_clean.proponent.monthly_income
      - dw_collections_segmentation.fact_contract_features_timeline.acc_max_n_repairs
      - dw_collections_segmentation.fact_contract_features_timeline.acc_broken_multiple_deals_lifetime
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_rental_core_invoices
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_acordo_invoices
      - dw_collections_segmentation.fact_contract_features_timeline.acc_cpc_l90
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_reparos_invoices
      - dw_collections_segmentation.fact_contract_features_timeline.share_monthly_paid_ontime_t1
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_invoices_in_wallet
      - datalake_collections_score_batch_inference_clean.collections_score_v3_output.payment_probability
  legacy_prob_payment_at_dt_reference:
    description: |
      Legacy rule-based payment probability band computed at each reference date (no ML thresholds). Uses the same
      contract, delay, MOB, eviction, and behavioral inputs as the historical segmentation rules before the collections
      score model; values include VERY_HIGH, HIGH, MEDIUM, LOW, VERY_LOW, and NULL-prefixed states by contract phase.
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.reference_contract_status
      - dw_collections_segmentation.fact_contract_wallet_timeline.max_delay_contaminated_contract_t2
      - dw_collections_segmentation.fact_contract_features_timeline.avg_days_overdue_invoices_paid_t1
      - dw_collections_segmentation.fact_contract_features_timeline.n_days_over1_t2_l180
      - dw_collections_segmentation.fact_contract_features_timeline.acc_broken_promessas_lifetime
      - dw_collections_segmentation.fact_contract_features_timeline.acc_max_n_repairs
      - dw_collections_segmentation.fact_contract_features_timeline.acc_broken_multiple_deals_lifetime
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_rental_core_invoices
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_acordo_invoices
      - dw_collections_segmentation.fact_contract_features_timeline.acc_cpc_l90
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_reparos_invoices
      - dw_collections_segmentation.fact_contract_features_timeline.share_monthly_paid_ontime_t1
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_invoices_in_wallet
  prob_payment:
    description: |
      Frozen payment probability band within each macro_segmentation island: the first prob_payment_at_dt_reference
      value after a macro segment transition is repeated for every day until macro_segmentation changes (UNCLASSIFIED
      yields NULL). Distinct from the raw model score columns payment_probability and payment_probability_propagated.
    lineage:
      - dw_collections_segmentation.fact_contract_features_timeline.prob_payment_at_dt_reference
      - dw_collections_segmentation.fact_contract_features_timeline.macro_segmentation
  segmentation_with_prob_payment_at_dt_reference:
    description: |
      Detailed contract segmentation using the daily calculated payment probability (prob_payment_at_dt_reference).
      This segmentation changes daily as contract conditions evolve. Active stock contracts with an ongoing deal are
      classified deterministically as active-stock-risk-deal-new-monthly when new original debt is unpaid, including
      when both debt types are unpaid, or active-stock-risk-deal-unpaid when only the deal installment is unpaid.
      Active stock contracts without a deal retain the high/low labels driven by the daily collections score band.
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.reference_contract_status
      - dw_collections_segmentation.fact_contract_wallet_timeline.max_delay_contaminated_contract_t2
      - dw_collections_segmentation.fact_contract_wallet_timeline.is_evictions
      - dw_collections_segmentation.fact_contract_wallet_timeline.has_fpd_in_wallet_general
      - dw_collections_segmentation.fact_contract_wallet_timeline.has_negotiation_in_contract
      - dw_collections_segmentation.fact_contract_wallet_timeline.max_delay_contaminated_contract_t1
      - dw_collections_segmentation.fact_contract_features_timeline.mob_months
      - dw_collections_segmentation.fact_contract_features_timeline.prob_payment_at_dt_reference
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_overdue_monthlys_t1
      - dw_collections_segmentation.fact_contract_wallet_timeline.max_delay_original_invoices_t1
      - dw_collections_segmentation.fact_contract_wallet_timeline.max_delay_deal_invoices_t1
  segmentation:
    description: |
      Detailed contract segmentation using the frozen payment probability band (prob_payment), constant within each
      macro_segmentation island. Deal-risk branches are deterministic: active-stock-risk-deal-new-monthly identifies
      unpaid new original debt and takes precedence when both debt types are unpaid; active-stock-risk-deal-unpaid
      identifies an unpaid deal installment only. No-deal active stock branches retain high/low labels based on the
      frozen collections score band. Evictions contracts retain their timing and probability sub-segments.
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.reference_contract_status
      - dw_collections_segmentation.fact_contract_wallet_timeline.max_delay_contaminated_contract_t2
      - dw_collections_segmentation.fact_contract_wallet_timeline.is_evictions
      - dw_collections_segmentation.fact_contract_wallet_timeline.has_fpd_in_wallet_general
      - dw_collections_segmentation.fact_contract_wallet_timeline.has_negotiation_in_contract
      - dw_collections_segmentation.fact_contract_wallet_timeline.max_delay_contaminated_contract_t1
      - dw_collections_segmentation.fact_contract_features_timeline.mob_months
      - dw_collections_segmentation.fact_contract_features_timeline.prob_payment
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_overdue_monthlys_t1
      - dw_collections_segmentation.fact_contract_wallet_timeline.max_delay_original_invoices_t1
      - dw_collections_segmentation.fact_contract_wallet_timeline.max_delay_deal_invoices_t1
  t1_delay_bucket:
    description: Bucketed categorization of T1 delay into ranges (Current, 1-30, 31-60, 61-90, 91-180, >180 days)
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.max_delay_contaminated_contract_t1
  t2_delay_bucket:
    description: Bucketed categorization of T2 delay into ranges (Current, 1-30, 31-60, 61-90, 91-180, >180 days)
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.max_delay_contaminated_contract_t2
  segment_comms:
    description: Communication segmentation for collections strategy - includes categories like FPD, NEW DEFAULTER, EVEX, CORLEONES, PURGATORIUM, SLIPPERS, SNOWBALL, SINKING ENDED, TITANIC ENDED, etc.
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.max_delay_contaminated_contract_t2
      - dw_collections_segmentation.fact_contract_wallet_timeline.reference_contract_status
      - dw_collections_segmentation.fact_contract_wallet_timeline.days_since_contract_start
      - dw_collections_segmentation.fact_contract_wallet_timeline.is_evictions
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_anchor_invoices_not_negativable
      - dw_collections_segmentation.fact_contract_wallet_timeline.max_delay_original_invoices_t1
      - dw_collections_segmentation.fact_contract_wallet_timeline.max_delay_deal_invoices_t1
      - dw_collections_segmentation.fact_contract_wallet_timeline.has_negotiation_in_contract
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_overdue_monthlys_t1
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_overdue_others_t1
  dt_month_start:
    description: First day of the calendar month containing dt_reference; supports monthly features and reporting alongside timeline rows.
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.dt_reference
  dt_contract_start:
    description: Calendar date associated with contract start in the financial workflow.
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.dt_contract_start
  lead_23_n_quitacao_t1:
    description: |
      Collections model target variable. Count of days in the forward window from the current
      dt_reference through the next 23 timeline rows (ROWS BETWEEN 0 FOLLOWING AND 23 FOLLOWING)
      where the contract shows a T1 quitacao: overdue recovered amount under T1 is positive and
      there is no open overdue T1 balance in the wallet (same rule as is_quitacao_t1 on wallet timeline).
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.overdue_recovered_amount_t1
      - dw_collections_segmentation.fact_contract_wallet_timeline.open_wallet_overdue_t1
      - dw_collections_segmentation.fact_contract_wallet_timeline.dt_reference
      - dw_collections_segmentation.fact_contract_wallet_timeline.sk_contract
  year:
    description: Year extracted from dt_reference
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.dt_reference
  month:
    description: Month extracted from dt_reference
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.dt_reference
  day:
    description: Day extracted from dt_reference
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.dt_reference
  ts_load:
    description: Timestamp when the record was loaded into the table
  flag_broken_installment_deal:
    description: Flag indicating if an active deal is broken specifically because an installment (deal invoice) is overdue (T1 > 0).
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.has_negotiation_in_contract
      - dw_collections_segmentation.fact_contract_wallet_timeline.max_delay_deal_invoices_t1
  flag_broken_deal_by_new_original_debt:
    description: Flag indicating if an active deal is broken because a new original debt (non-deal invoice) is overdue (T1 > 0).
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.has_negotiation_in_contract
      - dw_collections_segmentation.fact_contract_wallet_timeline.max_delay_original_invoices_t1
  flag_broken_global_deal:
    description: Flag indicating if an active deal is globally broken, either by a delayed installment or a new original debt.
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.has_negotiation_in_contract
      - dw_collections_segmentation.fact_contract_wallet_timeline.max_delay_original_invoices_t1
      - dw_collections_segmentation.fact_contract_wallet_timeline.max_delay_deal_invoices_t1
  macro_segmentation:
    description: |
      High-level classification of the contract state (e.g., active-current, active-stock-pre-evictions,
      evictions, ended-stock-361over) evaluated before payment probabilities are applied. Active contracts enter
      active-stock-pre-evictions when the wallet has more than one overdue monthly invoice or a broken ongoing deal;
      delay above 30 days alone instead maps eligible contracts to active-stock-hold. First-payment-default remains
      in active-new-defaulter-first-payment-default only while T2 delay is at most 30 days and those stock-at-risk
      conditions are not met. Evictions contracts always map to the single macro label evictions; tactical evictions
      sub-segments are derived downstream in segmentation.
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.reference_contract_status
      - dw_collections_segmentation.fact_contract_wallet_timeline.max_delay_contaminated_contract_t2
      - dw_collections_segmentation.fact_contract_wallet_timeline.max_delay_contaminated_contract_t1
      - dw_collections_segmentation.fact_contract_wallet_timeline.is_evictions
      - dw_collections_segmentation.fact_contract_wallet_timeline.has_fpd_in_wallet_general
      - dw_collections_segmentation.fact_contract_wallet_timeline.has_negotiation_in_contract
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_overdue_monthlys_t1
  next_macro_segmentation:
    description: The macro_segmentation classification for the contract on the next chronological reference date (LEAD value).
    lineage:
      - dw_collections_segmentation.fact_contract_features_timeline.macro_segmentation
  last_macro_segmentation:
    description: The macro_segmentation classification for the contract on the previous chronological reference date (LAG value).
    lineage:
      - dw_collections_segmentation.fact_contract_features_timeline.macro_segmentation
  flag_first_day_new_macro_segment:
    description: Boolean flag indicating if the current reference date is the first day the contract entered its current macro_segmentation state.
    lineage:
      - dw_collections_segmentation.fact_contract_features_timeline.macro_segmentation
      - dw_collections_segmentation.fact_contract_features_timeline.last_macro_segmentation
  flag_last_day_macro_segment:
    description: Boolean flag indicating if the current reference date is the last day the contract will remain in its current macro_segmentation state before transitioning.
    lineage:
      - dw_collections_segmentation.fact_contract_features_timeline.macro_segmentation
      - dw_collections_segmentation.fact_contract_features_timeline.next_macro_segmentation
  days_in_macro_segmentation:
    description: |
      1-based day index within the current macro_segmentation island (same sk_contract, macro_segmentation, and
      contiguous date streak). Adjusted so the count resets correctly when entering a macro segment mid-stream
      (rn_prob_payment_by_tree_entrance logic).
    lineage:
      - dw_collections_segmentation.fact_contract_features_timeline.macro_segmentation
      - dw_collections_segmentation.fact_contract_wallet_timeline.dt_reference
      - dw_collections_segmentation.fact_contract_wallet_timeline.sk_contract
  days_in_segmentation:
    description: |
      1-based day index within the current fine-grained segmentation island (same sk_contract, segmentation label, and
      contiguous date streak after micro-segmentation row numbering).
    lineage:
      - dw_collections_segmentation.fact_contract_features_timeline.segmentation
      - dw_collections_segmentation.fact_contract_wallet_timeline.dt_reference
      - dw_collections_segmentation.fact_contract_wallet_timeline.sk_contract
  payment_probability_propagated:
    description: |
      Last non-null collections model payment probability carried forward along the contract timeline (LAST_VALUE over
      dt_reference). Used when a given date has no fresh inference row so scoring rules still see a defined probability.
    lineage:
      - datalake_collections_score_batch_inference_clean.collections_score_v3_output.payment_probability
      - dw_collections_segmentation.fact_contract_wallet_timeline.dt_reference
  payment_probability_at_entrance:
    description: |
      Raw propagated collections score frozen at macro-segment entry: the payment_probability_propagated value on the
      first day of each macro_segmentation island (except active-current and ended-current, which use the daily value).
      Used to classify evictions early sub-segments and to anchor entrance-based decision rules.
    lineage:
      - dw_collections_segmentation.fact_contract_features_timeline.payment_probability_propagated
      - dw_collections_segmentation.fact_contract_features_timeline.macro_segmentation
  major_segmentation:
    description: |
      Macro-level rollup for dashboard grouping. Collapses active-new-defaulter-special into active-new-defaulter;
      all other macro_segmentation values pass through unchanged.
    lineage:
      - dw_collections_segmentation.fact_contract_features_timeline.macro_segmentation
  hyper_segmentation:
    description: |
      Hyper-level rollup grouping active tactical segments into active-segments, ended tactical segments into
      ended-segments, and all evictions macro contracts into evictions; other labels pass through unchanged.
    lineage:
      - dw_collections_segmentation.fact_contract_features_timeline.segmentation
      - dw_collections_segmentation.fact_contract_features_timeline.macro_segmentation
  clustered_segmentation:
    description: |
      Clustered tactical rollup for dashboard building. Groups both deterministic deal-risk reasons into
      active-stock-risk-deal and both score-based no-deal risk bands into active-stock-risk-nodeal. It also rolls up
      MOB3 and low new-defaulter timing, good-payer, and early-evictions sub-segments.
    lineage:
      - dw_collections_segmentation.fact_contract_features_timeline.segmentation
  payment_probability:
    description: |
      Raw payment probability from collections score v3 batch inference for this contract and dt_reference (latest
      inference by ts_inference when duplicates exist). Joined from collections_score_v3_output; distinct from prob_payment
      and prob_payment_at_dt_reference, which are discrete bands.
    lineage:
      - datalake_collections_score_batch_inference_clean.collections_score_v3_output.payment_probability
  flag_source:
    description: Source indicator from the collections score v3 inference output describing how the score row was produced.
    lineage:
      - datalake_collections_score_batch_inference_clean.collections_score_v3_output.flag_source
  flag_full_repair:
    description: True when every invoice in the wallet is a repair invoice (n_reparos_invoices equals n_invoices_in_wallet).
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_reparos_invoices
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_invoices_in_wallet
