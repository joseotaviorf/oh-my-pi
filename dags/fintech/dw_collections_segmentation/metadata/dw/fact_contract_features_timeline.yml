---
database_name: dw_collections_segmentation
table_name: fact_contract_features_timeline
owner: bianca.martins@quintoandar.com.br
domain: Fintech
description: |
  Essential contract features timeline for machine learning and advanced analytics in QuintoAndar collections context.
  Contains key accumulated features, calculated metrics, and forward-fill variables optimized for risk modeling
  and collection strategy analysis. This table focuses on the most critical features for predictive analytics.

  This table implements a frozen payment probability logic where probability values are calculated on the first day
  a contract enters each decision tree class (based on status and delay range) and remain constant until the contract
  moves to a different tree or until month end. This provides stable segmentation for operational and strategic planning.
columns:
  sk_contract_features_timeline:
    description: Record unique identification (surrogate key)
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.sk_contract
      - dw_collections_segmentation.fact_contract_wallet_timeline.dt_reference
  sk_contract:
    description: Contract surrogate key identifier
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.sk_contract
  dt_reference:
    description: Reference date for the timeline
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.dt_reference
  reference_contract_status:
    description: Contract status at the reference date (Ativo/Finalizado)
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.reference_contract_status
  max_delay_contaminated_contract_t1:
    description: Maximum Contract Delay within T1 Contamination methodology
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.max_delay_contaminated_contract_t1
  sum_monthly_overdue_days_paid_t1:
    description: Sum of DELAY VALUE (number of days in delay) from invoices recovered in that day, considering T1 contamination
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.sum_monthly_overdue_days_paid_t1
  count_monthly_overdue_invoices_paid_t1:
    description: COUNT of DELAY Invoices recovered in that day, considering T1 contamination
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.count_monthly_overdue_invoices_paid_t1
  days_since_ending:
    description: Number of days since contract finalization
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.days_since_ending
  max_delay_contaminated_contract_t2:
    description: Maximum Contract Delay within T2 Contamination methodology
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.max_delay_contaminated_contract_t2
  max_delay_original_invoices_t1:
    description: Maximum delay of original (non-deal) invoices using T1 contamination methodology
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.max_delay_original_invoices_t1
  max_delay_deal_invoices_t1:
    description: Maximum delay of deal/negotiation invoices using T1 contamination methodology
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.max_delay_deal_invoices_t1
  n_overdue_monthlys_t1:
    description: Number of overdue monthly rent invoices using T1 methodology
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_overdue_monthlys_t1
  n_overdue_others_t1:
    description: Number of overdue non-monthly (other types) invoices using T1 methodology
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_overdue_others_t1
  days_since_contract_start:
    description: Number of days since contract start
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.days_since_contract_start
  n_reparos_invoices:
    description: Number of repair invoices
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_reparos_invoices
  n_rental_core_invoices:
    description: Number of core rental invoices (monthly rent)
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_rental_core_invoices
  n_acordo_invoices:
    description: Number of deal/negotiation invoices
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_acordo_invoices
  n_invoices_in_wallet:
    description: Total number of invoices currently in the contract wallet
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_invoices_in_wallet
  n_monthly_invoices:
    description: Number of monthly invoices
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_monthly_invoices
  n_monthly_invoices_created:
    description: Number of monthly invoices created
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_monthly_invoices_created
  n_invoices_paid:
    description: Number of invoices paid
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_invoices_paid
  n_invoices_paid_ontime_t2:
    description: Number of invoices paid on time using T2 methodology
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_invoices_paid_ontime_t2
  n_overdue_invoices_paid_t2:
    description: Number of overdue invoices paid using T2 methodology
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_overdue_invoices_paid_t2
  n_invoices_paid_ontime_t1:
    description: Number of invoices paid on time using T1 methodology
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_invoices_paid_ontime_t1
  n_overdue_invoices_paid_t1:
    description: Number of overdue invoices paid using T1 methodology
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_overdue_invoices_paid_t1
  n_monthly_invoices_paid_ontime_t2:
    description: Number of monthly invoices paid on time using T2 methodology
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_monthly_invoices_paid_ontime_t2
  n_monthly_invoices_paid_ontime_t1:
    description: Number of monthly invoices paid on time using T1 methodology
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_monthly_invoices_paid_ontime_t1
  n_monthly_overdue_invoices_paid_t2:
    description: Number of monthly overdue invoices paid using T2 methodology
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_monthly_overdue_invoices_paid_t2
  n_monthly_overdue_invoices_paid_t1:
    description: Number of monthly overdue invoices paid using T1 methodology
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_monthly_overdue_invoices_paid_t1
  n_first_invoices_open:
    description: Number of first invoices that are still open
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_first_invoices_open
  cpc:
    description: Contact completion count
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.cpc
  qt_acordo_quebrado:
    description: Quantity of broken agreements
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.qt_acordo_quebrado
  id_process_evictions:
    description: Eviction process identifier
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.id_process_evictions
  has_overdue_balance_over0_t1_at_ending:
    description: Flag indicating if contract had overdue balance over 0 days using T1 methodology at ending
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.has_overdue_balance_over0_t1_at_ending
  has_overdue_balance_over5_t1_at_ending:
    description: Flag indicating if contract had overdue balance over 5 days using T1 methodology at ending
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.has_overdue_balance_over5_t1_at_ending
  has_overdue_balance_over0_t2_at_ending:
    description: Flag indicating if contract had overdue balance over 0 days using T2 methodology at ending
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.has_overdue_balance_over0_t2_at_ending
  has_overdue_balance_over5_t2_at_ending:
    description: Flag indicating if contract had overdue balance over 5 days using T2 methodology at ending
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.has_overdue_balance_over5_t2_at_ending
  has_overdue_balance_over0_t3_at_ending:
    description: Flag indicating if contract had overdue balance over 0 days using T3 methodology at ending
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.has_overdue_balance_over0_t3_at_ending
  has_overdue_balance_over5_t3_at_ending:
    description: Flag indicating if contract had overdue balance over 5 days using T3 methodology at ending
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.has_overdue_balance_over5_t3_at_ending
  is_evictions:
    description: Flag indicating if contract has eviction process
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.is_evictions
  has_negotiation_in_contract:
    description: Flag indicating if the contract has any active negotiation/deal
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.has_negotiation_in_contract
  has_fpd_in_wallet:
    description: Flag indicating if contract has first payment default (FPD) in wallet
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.has_fpd_in_wallet
  n_anchor_invoices_not_negativable:
    description: Number of anchor invoices that are not negativable
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_anchor_invoices_not_negativable
  array_open_invoices:
    description: Array of open invoice IDs
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.array_open_invoices
  array_paid_invoices:
    description: Array of paid invoice IDs
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.array_paid_invoices
  array_negotiated_invoices:
    description: Array of negotiated (written-down) invoice IDs
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.array_negotiated_invoices
  acc_max_n_repairs:
    description: Max number of repair invoices within contract wallet considering contract lifetime and dataset time range (accumulated)
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_reparos_invoices
  acc_cpc_l90:
    description: Sum of CPC (contact completions) over the last 90 days (accumulated rolling window)
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.cpc
  acc_broken_multiple_deals_lifetime:
    description: Number of broken multiple installments deals in lifetime accumulated
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.qt_acordo_quebrado
  acc_broken_promessas_lifetime:
    description: Accumulated number of broken promises (promessas quebradas) over the contract lifetime
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.qt_promessa_quebrada_fp
  acc_deals_principal_discount_lifetime:
    description: Accumulated number of deals with principal amount discount (forgiveness) over the contract lifetime
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.qt_aco_desconto
  acc_sum_monthly_overdue_days_paid_t1:
    description: Accumulated sum of days overdue for monthly invoices paid using T1 methodology over contract lifetime
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.sum_monthly_overdue_days_paid_t1
  acc_count_monthly_overdue_invoices_paid_t1:
    description: Accumulated count of monthly overdue invoices paid using T1 methodology over contract lifetime
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.count_monthly_overdue_invoices_paid_t1
  acc_n_monthly_invoices_l12m:
    description: Accumulated number of monthly invoices over the last 12 months
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_monthly_invoices
  acc_n_monthly_invoices_paid_ontime_t2_l12m:
    description: Accumulated number of monthly invoices paid on time (T2) over the last 12 months
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_monthly_invoices_paid_ontime_t2
  acc_n_monthly_invoices_paid_ontime_t1_l12m:
    description: Accumulated number of monthly invoices paid on time (T1) over the last 12 months
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_monthly_invoices_paid_ontime_t1
  acc_n_monthly_overdue_invoices_paid_t2_l12m:
    description: Accumulated number of monthly overdue invoices paid (T2) over the last 12 months
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_monthly_overdue_invoices_paid_t2
  acc_n_monthly_overdue_invoices_paid_t1_l12m:
    description: Accumulated number of monthly overdue invoices paid (T1) over the last 12 months
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_monthly_overdue_invoices_paid_t1
  acc_n_invoices_paid_ontime_t2_l12m:
    description: Accumulated number of all invoices paid on time (T2) over the last 12 months
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_invoices_paid_ontime_t2
  acc_n_invoices_paid_ontime_t1_l12m:
    description: Accumulated number of all invoices paid on time (T1) over the last 12 months
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_invoices_paid_ontime_t1
  acc_n_overdue_invoices_paid_t2_l12m:
    description: Accumulated number of overdue invoices paid (T2) over the last 12 months
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_overdue_invoices_paid_t2
  acc_n_overdue_invoices_paid_t1_l12m:
    description: Accumulated number of overdue invoices paid (T1) over the last 12 months
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_overdue_invoices_paid_t1
  acc_count_monthly_invoices_created:
    description: Accumulated count of monthly invoices created over the last 12 months
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_monthly_invoices_created
  acc_count_monthly_invoices_paid_ontime_t1:
    description: Accumulated count of monthly invoices paid on time (T1) over the last 12 months
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_monthly_invoices_paid_ontime_t1
  n_evictions_processes_lifetime:
    description: Number of distinct eviction processes accumulated over contract lifetime
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.id_process_evictions
  has_overdue_balance_over0_t1_at_ending_ffill:
    description: Forward fill from has_overdue_balance_over0_t1_at_ending - indicates if contract ever had overdue balance over 0 days using T1 methodology at ending
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.has_overdue_balance_over0_t1_at_ending
  has_overdue_balance_over5_t1_at_ending_ffill:
    description: Forward fill from has_overdue_balance_over5_t1_at_ending - indicates if contract ever had overdue balance over 5 days using T1 methodology at ending
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.has_overdue_balance_over5_t1_at_ending
  avg_days_overdue_invoices_paid_t1:
    description: Average days overdue for invoices paid - calculated as ACC_SUM_MONTHLY_OVERDUE_DAYS_PAID_T1 divided by ACC_COUNT_MONTHLY_OVERDUE_INVOICES_PAID_T1
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.sum_monthly_overdue_days_paid_t1
      - dw_collections_segmentation.fact_contract_wallet_timeline.count_monthly_overdue_invoices_paid_t1
  share_monthly_paid_ontime_t1:
    description: Share of monthly invoices paid on time using T1 methodology - ratio of monthly invoices paid on time to total monthly invoices created
    lineage:
      - dw_collections_segmentation.fact_contract_features_timeline.acc_count_monthly_invoices_paid_ontime_t1
      - dw_collections_segmentation.fact_contract_features_timeline.acc_count_monthly_invoices_created
  pct_monthly_paid_ontime_t2_l12m:
    description: Percentage of monthly invoices paid on time (T2) over last 12 months
    lineage:
      - dw_collections_segmentation.fact_contract_features_timeline.acc_n_monthly_invoices_paid_ontime_t2_l12m
      - dw_collections_segmentation.fact_contract_features_timeline.acc_n_monthly_invoices_l12m
  pct_monthly_paid_ontime_t1_l12m:
    description: Percentage of monthly invoices paid on time (T1) over last 12 months
    lineage:
      - dw_collections_segmentation.fact_contract_features_timeline.acc_n_monthly_invoices_paid_ontime_t1_l12m
      - dw_collections_segmentation.fact_contract_features_timeline.acc_n_monthly_invoices_l12m
  pct_invoices_paid_ontime_t2_l12m:
    description: Percentage of all invoices (not just monthly) paid on time (T2) over last 12 months
    lineage:
      - dw_collections_segmentation.fact_contract_features_timeline.acc_n_invoices_paid_ontime_t2_l12m
      - dw_collections_segmentation.fact_contract_features_timeline.acc_n_overdue_invoices_paid_t2_l12m
  pct_invoices_paid_ontime_t1_l12m:
    description: Percentage of all invoices (not just monthly) paid on time (T1) over last 12 months
    lineage:
      - dw_collections_segmentation.fact_contract_features_timeline.acc_n_invoices_paid_ontime_t1_l12m
      - dw_collections_segmentation.fact_contract_features_timeline.acc_n_overdue_invoices_paid_t1_l12m
  mob_months:
    description: Months on books - number of months since contract start date calculated as the difference in years and months between reference date and contract start
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.dt_reference
      - dw_collections_segmentation.fact_contract_wallet_timeline.dt_contract_start
  n_days_over1_t2_l180:
    description: Number of days with delay greater than 1 day (T2 methodology) over the last 180 days
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.max_delay_contaminated_contract_t2
  monthly_income:
    description: Sum of monthly income from proponentes (contract holders) who will reside in the property
    lineage:
      - datalake_sorting_hat_clean.proponent.monthly_income
      - dw_rent.fact_listing_rent_flows.sk_proposal
      - dw_rent.fact_listing_rent_flows.sk_contract
      - dw_rent.dim_contract.sk_contract
  wallet_overdue_t2:
    description: Total overdue amount in wallet using T2 contamination methodology
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.wallet_overdue_t2
  overdue_recovered_amount_t2:
    description: Total amount recovered from overdue invoices using T2 methodology
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.overdue_recovered_amount_t2
  tree_class:
    description: |
      Decision tree classification based on contract status and delay range. Used to determine when payment probability should be frozen.
      Possible values: TREE 0 (Active 0-3 days), TREE 1 (Active 4-30 days), TREE 2 (Completed 0-30 days),
      TREE 3 (Completed 31-90 days), TREE 4 (Completed 90+ days), NO_TREE (Active 30+ days)
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.reference_contract_status
      - dw_collections_segmentation.fact_contract_wallet_timeline.max_delay_contaminated_contract_t2
  prob_payment_at_dt_reference:
    description: |
      Payment probability calculated at each reference date before freezing. This is the raw probability calculation
      that changes daily based on current contract conditions. Values: VERY_HIGH, HIGH, MEDIUM, LOW, VERY_LOW,
      or NULL variations for different contract states
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.reference_contract_status
      - dw_collections_segmentation.fact_contract_wallet_timeline.max_delay_contaminated_contract_t2
      - dw_collections_segmentation.fact_contract_features_timeline.avg_days_overdue_invoices_paid_t1
      - dw_collections_segmentation.fact_contract_features_timeline.n_days_over1_t2_l180
      - dw_collections_segmentation.fact_contract_features_timeline.acc_broken_promessas_lifetime
      - dw_collections_segmentation.fact_contract_wallet_timeline.days_since_ending
      - datalake_sorting_hat_clean.proponent.monthly_income
      - dw_collections_segmentation.fact_contract_features_timeline.acc_max_n_repairs
      - dw_collections_segmentation.fact_contract_features_timeline.acc_broken_multiple_deals_lifetime
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_rental_core_invoices
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_acordo_invoices
      - dw_collections_segmentation.fact_contract_features_timeline.acc_cpc_l90
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_reparos_invoices
      - dw_collections_segmentation.fact_contract_features_timeline.share_monthly_paid_ontime_t1
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_invoices_in_wallet
  prob_payment:
    description: |
      Frozen payment probability for the month. This value is set on the first day a contract enters each tree class
      and remains constant until the contract moves to a different tree or until month end. For contracts outside
      defined trees (e.g., Active 30+), maintains the last probability from the previous tree entry.
    lineage:
      - dw_collections_segmentation.fact_contract_features_timeline.prob_payment_at_dt_reference
      - dw_collections_segmentation.fact_contract_features_timeline.tree_class
      - dw_collections_segmentation.fact_contract_features_timeline.dt_month_start
  segmentation_with_prob_payment_at_dt_reference:
    description: |
      Detailed contract segmentation using the daily calculated payment probability (prob_payment_at_dt_reference).
      This segmentation changes daily as contract conditions evolve. Includes categories like active-new-defaulter-early-high,
      ended-stock-roll1-low, evictions, etc., differentiated by status, delay range, and daily probability assessment
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.reference_contract_status
      - dw_collections_segmentation.fact_contract_wallet_timeline.max_delay_contaminated_contract_t2
      - dw_collections_segmentation.fact_contract_wallet_timeline.is_evictions
      - dw_collections_segmentation.fact_contract_wallet_timeline.has_fpd_in_wallet
      - dw_collections_segmentation.fact_contract_wallet_timeline.has_negotiation_in_contract
      - dw_collections_segmentation.fact_contract_wallet_timeline.max_delay_contaminated_contract_t1
      - dw_collections_segmentation.fact_contract_features_timeline.mob_months
      - dw_collections_segmentation.fact_contract_features_timeline.prob_payment_at_dt_reference
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_overdue_monthlys_t1
      - dw_collections_segmentation.fact_contract_wallet_timeline.max_delay_original_invoices_t1
      - dw_collections_segmentation.fact_contract_wallet_timeline.max_delay_deal_invoices_t1
      - dw_collections_segmentation.fact_contract_features_timeline.acc_deals_principal_discount_lifetime
  segmentation:
    description: |
      Detailed contract segmentation using the frozen monthly payment probability (prob_payment). This is the stable
      segmentation that uses the probability frozen at tree entry and remains constant within each tree/month period.
      Includes same categories as segmentation_with_prob_payment_at_dt_reference but with frozen probability logic
    lineage:
      - dw_collections_segmentation.fact_contract_wallet_timeline.reference_contract_status
      - dw_collections_segmentation.fact_contract_wallet_timeline.max_delay_contaminated_contract_t2
      - dw_collections_segmentation.fact_contract_wallet_timeline.is_evictions
      - dw_collections_segmentation.fact_contract_wallet_timeline.has_fpd_in_wallet
      - dw_collections_segmentation.fact_contract_wallet_timeline.has_negotiation_in_contract
      - dw_collections_segmentation.fact_contract_wallet_timeline.max_delay_contaminated_contract_t1
      - dw_collections_segmentation.fact_contract_features_timeline.mob_months
      - dw_collections_segmentation.fact_contract_features_timeline.prob_payment
      - dw_collections_segmentation.fact_contract_wallet_timeline.n_overdue_monthlys_t1
      - dw_collections_segmentation.fact_contract_wallet_timeline.max_delay_original_invoices_t1
      - dw_collections_segmentation.fact_contract_wallet_timeline.max_delay_deal_invoices_t1
