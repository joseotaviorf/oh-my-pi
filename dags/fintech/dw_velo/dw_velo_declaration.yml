dag:
  name: dw_velo
  schedule_start_date: 2020,08,29
  owner: Data Fintech
workflow:
  type: query_delta
  layer: dw
  custom_schema: velo
  has_load_to_redshift_task: false
  inner_dependencies:
    fact_derived_velo_propose_claim_mob:
      - fact_velo_propose
      - fact_velo_occurrence
      - dim_velo_junk
      - fact_velo_transaction_entries
      - dim_velo_transaction
      - dim_velo_transaction_category
      - dim_velo_omie_client
cluster:
  type: databricks_12_2_med_general_cluster
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: "quintoandar_{{ var.value.environment }}"
