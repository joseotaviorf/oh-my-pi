database_name: dw_velo
table_name: dim_velo_user
description: |
  QuintoCred is the name given to Velo after its acquisition by QuintoAndar in 2021. As of 2023, the Velo brand was replaced by QuintoCred.
  In June 2025, QuintoCred's core operations were shut down, leaving only the debt collection services active. In the first quarter of 2026, the decision was made to terminate the collection operations by July 31, 2026.
  Therefore, it is important to understand that all Velo and QuintoCred systems are considered legacy, and consequently, the involved tables are as well.

  Dimension with details of the user of the Velo Platform system. Sometimes
  the user is the agent of the purpose.
domain: Fintech
owner: guilherme.sacramento@quintoandar.com.br
columns:
  sk_user:
    lineage:
      - datalake_velo.user.id_user
    description: User's identification number (ID)
  uuid_user:
    lineage:
      - datalake_velo.user.uuid_user
    description: Unique identifier (UUID) of the user generated in the Product Database.
  name:
    lineage:
      - datalake_velo.user.name
    description: Full name of the Velo platform user or guarantee proponent.
  email:
    lineage:
      - datalake_velo.user.email
    description: Contact email registered in the Velo platform or Omie client record.
  user_role:
    lineage:
      - datalake_velo.user.user_role
    description: User's role in Velo's platform
    categories:
      Administrador: ""
      Administrador Rede: ""
      Administrador Velo: ""
      Analista de propostas: ""
      Aprovador: ""
      Assinatura: ""
      Cobrança: ""
      Colaborador: ""
      Coordenador BDR: ""
      Corretor: ""
      Customer Success: ""
      Executivo: ""
      Financeiro: ""
      Juridico: ""
      Marketing: ""
      Pré-cadastro: ""
      Sistema: ""
      Suporte l: ""
      Suporte lll: ""
  is_legacy:
    lineage:
      - datalake_velo.user.is_legacy
    description: If the propose's comes from Velo 2.0 systems (TRUE = 2.0, FALSE = QuintoCred;3.0)
  ts_created:
    lineage:
      - datalake_velo.user.ts_created
    description: Moment (timestamp) when the user was created in Velo's platform
  ts_load:
    description: Moment (timestamp) when the table was last loaded
