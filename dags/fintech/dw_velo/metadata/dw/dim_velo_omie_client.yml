owner: guilherme.sacramento@quintoandar.com.br
domain: Fintech
description: |
  QuintoCred is the name given to Velo after its acquisition by QuintoAndar in 2021. As of 2023, the Velo brand was replaced by QuintoCred.
  In June 2025, QuintoCred's core operations were shut down, leaving only the debt collection services active. In the first quarter of 2026, the decision was made to terminate the collection operations by July 31, 2026.
  Therefore, it is important to understand that all Velo and QuintoCred systems are considered legacy, and consequently, the involved tables are as well.

  Omie is a third-party financial reconciliation service for Velo 2.0. It contains accounts payable and accounts receivable data.
  Until Jan 31, 2023: Accounts Payable and Accounts Receivable
  From Feb 01, 2023 onwards: Accounts Receivable. SAP took over Accounts Payable at this point, including for Velo 2.0
  Accounts Receivable Payment Dates
  These are the dates the funds are received in the bank:
  Pix: Instant
  Boleto: 1 business day
  Credit card: 30 calendar days after the customer's payment date
  Accounts Payable Payment Dates
  These are the dates we actually make the payment:
  The payment date coincides with the cash settlement date.

  Clients (tenants, landlords, brokers) registered in Omie ERP for Velo guarantee
  billing, accounting entries, and tax document issuance.
