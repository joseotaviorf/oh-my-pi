---
database_name: dw_velo
table_name: fact_velo_occurrence
owner: athos.sampayo@quintoandar.com.br
domain: fintech
description: Fact table responsible for the Occurrence context of Velo
columns:
  sk_occurrence:
    description: Table's unique SK.
    lineage:
      - datalake_velo.occurrence.id_occurrence
  sk_propose:
    description: ID connecting table to propose table.
    lineage:
      - datalake_velo.occurrence.id_propose
  sk_client:
    description: ID connecting table to propose_person table.
    lineage:
      - datalake_velo.occurrence.id_client
  sk_occurrence_type:
    description: ID connecting table to junk table.
    lineage:
      - datalake_velo.occurrence.id_occurrence_type
  sk_occurrence_status:
    description: ID connecting table to junk table.
    lineage:
      - datalake_velo.occurrence.id_occurrence_status
  id_unicid:
    description: Business ID for UNICID.
    lineage:
      - datalake_velo.occurrence.id_unicid
  ids_accounting_entry:
    description: Array of Business IDs associated for this occurrence in Robin-Hood.
    lineage:
      - datalake_velo.occurrence.ids_accounting_entry
  description:
    description: Description comments for this occurrence.
    lineage:
      - datalake_velo.occurrence.description
  invoice_url:
    description: URL of charged invoice.
    lineage:
      - datalake_velo.occurrence.invoice_url
  due_amount:
    description: Amount that is due.
    lineage:
      - datalake_velo.occurrence.due_amount
  due_amount_original:
    description: Amount that was originally due.
    lineage:
      - datalake_velo.occurrence.due_amount_original
  paid_amount:
    description: Amount that was paid.
    lineage:
      - datalake_velo.occurrence.paid_amount
  is_valid:
    description: Boolean flag for when this occurrence is valid to be used on any business process. Usually a visible register but that does not follows a specific business flow yet.
    lineage:
      - datalake_velo.occurrence.is_valid
  is_legacy:
    description: If the propose's comes from Velo 2.0 systems (TRUE = 2.0, FALSE = QuintoCred;3.0)
    lineage:
      - datalake_velo.occurrence.is_legacy
  dt_due:
    description: Date that occurrence is/was due, according to 3.0 rules.
    lineage:
      - datalake_velo.occurrence.dt_due
  dt_due_legacy:
    description: Date that occurrence is/was due, according to 2.0 rules.
    lineage:
      - datalake_velo.occurrence.dt_due_legacy
  dt_bill_month:
    description: Reference month for the bill.
    lineage:
      - datalake_velo.occurrence.dt_bill_month
  dt_payment_scheduled:
    description: Date that the payment was scheduled.
    lineage:
      - datalake_velo.occurrence.dt_payment_scheduled
  ts_paid:
    description: Timestamp that occurrence invoice was paid, if existent.
    lineage:
      - datalake_velo.occurrence.ts_paid
  ts_created:
    description: Timestamp that the occurrence was created.
    lineage:
      - datalake_velo.occurrence.ts_created
  ts_load:
    description: Load timestamp
