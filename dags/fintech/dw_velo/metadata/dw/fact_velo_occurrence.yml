---
database_name: dw_velo
table_name: fact_velo_occurrence
owner: guilherme.sacramento@quintoandar.com.br
domain: Fintech
description: |
  QuintoCred is the name given to Velo after its acquisition by QuintoAndar in 2021. As of 2023, the Velo brand was replaced by QuintoCred.
  In June 2025, QuintoCred's core operations were shut down, leaving only the debt collection services active. In the first quarter of 2026, the decision was made to terminate the collection operations by July 31, 2026.
  Therefore, it is important to understand that all Velo and QuintoCred systems are considered legacy, and consequently, the involved tables are as well.

  An Occurrence happens after an IQ default, activating Velo's guarantee, which pays the PP the amount due. After that, the IQ must negotiate with Velo and pay this amount.
  An Occurrence will always have an associated Contract.
  An Occurrence should relate to a Payment. We know there is a gap at this point, with only 56% of Occurrences being linkable.

  Delinquency occurrences (claims) on active QuintoCred guarantee contracts,
  tracking recovery status, amounts due/paid, and Robin-Hood accounting references.
columns:
  sk_occurrence:
    description: Surrogate key of the Velo delinquency occurrence fact row.
    lineage:
      - datalake_velo.occurrence.id_occurrence
  sk_propose:
    description: Foreign key to the guarantee proposal that originated this occurrence.
    lineage:
      - datalake_velo.occurrence.id_propose
  sk_client:
    description: Foreign key to the client (proponent) person associated with the occurrence.
    lineage:
      - datalake_velo.occurrence.id_client
  sk_occurrence_type:
    description: Foreign key to the Velo junk dimension for the occurrence classification code.
    lineage:
      - datalake_velo.occurrence.id_occurrence_type
  sk_occurrence_status:
    description: Foreign key to the Velo junk dimension for the occurrence classification code.
    lineage:
      - datalake_velo.occurrence.id_occurrence_status
  id_unicid:
    description: Legacy Unicid system identifier used to reconcile Velo 2.0 records with QuintoCred 3.0.
    lineage:
      - datalake_velo.occurrence.id_unicid
  ids_accounting_entry:
    description: Array of Business IDs associated for this occurrence in Robin-Hood.
    lineage:
      - datalake_velo.occurrence.ids_accounting_entry
  type:
      description: Describes the category of the delinquency.
      categories:
        SIGNATURE: Related to the signature.
        GUARANTEE: Involves a guarantee.
        TERMINATION: Tied to termination.
        BILLING: Related to billing.
        RENEWAL: Concerns a renewal.
        RENEWAL_MONTH: A monthly renewal.
        ACTIVATION_PARTIAL_LINK: Activation with partial linking.
      lineage:
      - datalake_velo.occurrence.type
  status:
      description: Represents the current state of the delinquency.
      categories:
        REGISTERED: The delinquency is recorded.
        RECOVERING: The process of recovering is underway.
        PROGRESS: The delinquency is in progress.
        FINISHED: The process has been completed.
        UNDER_AGREEMENT: There is an agreement in place.
        REQUESTED_AGREEMENT: An agreement is requested but not yet confirmed.
        ACTIVE_FALSE: The delinquency is inactive.
        FORGIVEN: The delinquency has been forgiven.
      lineage:
      - datalake_velo.occurrence.status
  description:
    description: Description comments for this occurrence.
    lineage:
      - datalake_velo.occurrence.description
  invoice_url:
    description: URL of the payment or occurrence invoice generated by the billing gateway.
    lineage:
      - datalake_velo.occurrence.invoice_url
  due_amount:
    description: Total amount due on the payment or occurrence invoice.
    lineage:
      - datalake_velo.occurrence.due_amount
  due_amount_original:
    description: Amount that was originally due.
    lineage:
      - datalake_velo.occurrence.due_amount_original
  paid_amount:
    description: Amount actually paid on the occurrence invoice after discounts or adjustments.
    lineage:
      - datalake_velo.occurrence.paid_amount
  discount_amount:
    description: Discount amount, obtained by substracting the paid amount from the due amount.
    lineage:
      - datalake_velo.occurrence.discount_amount
  is_valid:
    description: Boolean flag for when this occurrence is valid to be used on any business process. Usually a visible register but that does not follows a specific business flow yet.
    lineage:
      - datalake_velo.occurrence.is_valid
  is_legacy:
    description: If the propose's comes from Velo 2.0 systems (TRUE = 2.0, FALSE = QuintoCred;3.0)
    lineage:
      - datalake_velo.occurrence.is_legacy
  dt_due:
    description: Date that occurrence is/was due, according to 3.0 rules.
    lineage:
      - datalake_velo.occurrence.dt_due
  dt_due_legacy:
    description: Date that occurrence is/was due, according to 2.0 rules.
    lineage:
      - datalake_velo.occurrence.dt_due_legacy
  dt_bill_month:
    description: Reference month for the bill.
    lineage:
      - datalake_velo.occurrence.dt_bill_month
  dt_payment_scheduled:
    description: Date that the payment was scheduled.
    lineage:
      - datalake_velo.occurrence.dt_payment_scheduled
  ts_paid:
    description: Timestamp that occurrence invoice was paid, if existent.
    lineage:
      - datalake_velo.occurrence.ts_paid
  ts_created:
    description: Timestamp that the occurrence was created.
    lineage:
      - datalake_velo.occurrence.ts_created
  ts_load:
    description: Timestamp when this row was loaded into the Velo DW table by the ETL pipeline.
