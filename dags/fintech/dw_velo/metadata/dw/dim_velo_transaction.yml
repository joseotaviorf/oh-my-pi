database_name: dw_velo
table_name: dim_velo_transaction
description: Dimension with the general details of the transaction
domain: Fintech
owner: ae-fintech@quintoandar.com.br
columns:
  sk_transaction:
    lineage:
    - datalake_velo.transaction_entries.id_trasaction
    description: Transaction ID
  project:
    lineage:
    - datalake_velo.transaction_entries.project
    description: Project name on OMIE
  status:
    lineage:
    - datalake_velo.transaction_entries.status
    description: Status of the transaction
    categories:
      A VENCER: transaction to be due
      ATRASADO: overdue transaction
      PAGO: paid transaction
      RECEBIDO: Receivable transaction
      VENCE HOJE: transaction that expires today
  transaction_type:
    lineage:
    - datalake_velo.transaction_entries.transaction_type
    description: Transaction type
    categories:
      CONTA_A_PAGAR: Payable account
      CONTA_A_RECEBER: Receivable account
  transaction_purpose:
    lineage:
    - datalake_velo.transaction_entries.transaction_purpose
    description: Purpose of transaction
    categories:
      ongoing: transaction from an unfinished account
      rescisão: transaction from an finished account
  installment:
    lineage:
    - datalake_velo.transaction_entries.installment
    description: Wich installment the transaction relates
  total_expected_installments:
    lineage:
    - datalake_velo.transaction_entries.total_expected_installments
    description: Number of total installments expected to be paid by all transactions
      related to this one
  is_project_receivable_created:
    lineage:
    - datalake_velo.transaction_entries.is_project_receivable_created
    description: Has a transaction receivable created
  is_project_receivable_greater_than_payable:
    lineage:
    - datalake_velo.transaction_entries.is_project_receivable_greater_than_payable
    description: Transaction has the received amount greater than the amount payable
  ts_load:
    description: Load timestamp
