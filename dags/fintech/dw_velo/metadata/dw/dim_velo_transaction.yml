database_name: dw_velo
table_name: dim_velo_transaction
description: Dimension with the general details of the transaction
domain: Fintech
owner: ae-fintech@quintoandar.com.br
columns:
  sk_transaction:
    lineage:
    - datalake_velo.transaction_entries.id_trasaction
    description: ''
  project:
    lineage:
    - datalake_velo.transaction_entries.project
    description: Project name on OMIE
  status:
    lineage:
