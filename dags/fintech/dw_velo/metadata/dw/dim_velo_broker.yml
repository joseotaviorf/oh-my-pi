database_name: dw_velo
table_name: dim_velo_broker
description: Dimension with Brokers companies details.
domain: Fintech
owner: ae-fintech@quintoandar.com.br
columns:
  sk_broker:
    lineage:
    - datalake_velo.broker.id_broker
    description: Broker's identification number (ID)
  broker_comercial_name:
    lineage:
    - datalake_velo.broker.broker_comercial_name
    description: Broker's comercial name
  broker_name:
    lineage:
    - datalake_velo.broker.broker_name
    description: Broker's name
  street:
    lineage:
      - datalake_velo.broker.street
    description: Broker's establishment street
  number:
    lineage:
      - datalake_velo.broker.number
    description: Broker's establishment address number
  complement:
    lineage:
      - datalake_velo.broker.complement
    description: Broker's establishment address complement
  neighborhood:
    lineage:
      - datalake_velo.broker.neighborhood
    description: Broker's establishment address neighborhood
  city:
    lineage:
    - datalake_velo.broker.city
    description: Broker's establishment city
  state:
    lineage:
    - datalake_velo.broker.state
    description: Broker's establishment state
  country_code:
    lineage:
    - datalake_velo.broker.country_code
    description: Broker's establishment country
  zipcode:
    lineage:
    - datalake_velo.broker.zipcode
    description: Broker's establishment zipcode
  geolocation:
    lineage:
    - datalake_velo.broker.geolocation
    description: Broker's establishment geolocation
  creci:
    lineage:
    - datalake_velo.broker.creci
    description: Broker's certification number (CRECI)
  cnpj:
    lineage:
    - datalake_velo.broker.cnpj
    description: Broker's document number (CNPJ)
  is_broker_active:
    lineage:
    - datalake_velo.broker.is_broker_active
    description: Identify if the broker is active in Velo's platform
  is_legacy:
    lineage:
    - datalake_velo.broker.is_legacy
    description: If the propose's comes from Velo 2.0 systems (TRUE = 2.0, FALSE = QuintoCred;3.0)
  ts_created:
    lineage:
    - datalake_velo.broker.ts_created
    description: Moment (timestamp) when the broker was created in Velo's platform
  ts_load:
    description: Moment (timestamp) when the table was last loaded
