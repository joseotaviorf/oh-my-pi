database_name: dw_velo
table_name: fact_velo_transaction_entries
description: Fact table focused on the Entries added to transactions from Velo, registered
  on OMIE systems.
domain: Fintech
owner: guilherme.sacramento@quintoandar.com.br
columns:
  sk_transaction_entry:
    lineage:
    - datalake_velo.transaction_entries.id_transaction_entry
    description: Transaction entry's identification number (ID)
  sk_transaction:
    lineage:
    - datalake_velo.transaction_entries.id_transaction
    description: Transaction's identification number (ID). This key connects to the table dw_velo.dim_velo_transaction
  sk_category:
    lineage:
    - datalake_velo.transaction_entries.id_category
    description: Category's identification number (ID). This key connects to the table dw_velo.dim_velo_transaction_category
  sk_propose:
    lineage:
    - datalake_velo.transaction_entries.id_propose
    description: Propose's identification number (ID). This key connects to the table dw_velo.fact_velo_propose
  sk_bank_account:
    lineage:
    - datalake_velo.transaction_entries.id_bank_account
    description: Bank account's identification number (ID). This key connects to the table dw_velo.dim_velo_omie_bank_account
  sk_omie_client:
    lineage:
    - datalake_velo.transaction_entries.id_omie_client
    description: Omie client's identification number (ID). This key connects to the table dw_velo.dim_velo_omie_client
  percent_amount_from_transaction:
    lineage:
    - datalake_velo.transaction_entries.percent_amount_from_transaction
    description: Ratio between the entry due amount by the transaction's total due amount
  due_amount:
    lineage:
    - datalake_velo.transaction_entries.due_amount
    description: Velo platform attribute describing due amount for condominium billing reconciliation.
  paid_amount:
    lineage:
    - datalake_velo.transaction_entries.paid_amount
    description: Velo platform attribute describing paid amount for condominium billing reconciliation.
  is_occurency:
    lineage:
    - datalake_velo.transaction_entries.is_occurency
    description: If this entry is related to a ocurrency
  dt_issue:
    lineage:
    - datalake_velo.transaction_entries.dt_issue
    description: Date when the transaction was issued
  dt_register:
    lineage:
    - datalake_velo.transaction_entries.dt_register
    description: Date when the transaction was registered
  dt_due:
    lineage:
    - datalake_velo.transaction_entries.dt_due
    description: Transaction due date. Expected date that the transaction will be received in the bank account. For PIX it is instantly, for bank ticket usually takes 1 business day and for credit card takes 30 running days (compared to the bank slip due date)
  dt_paid:
    lineage:
    - datalake_velo.transaction_entries.dt_paid
    description: Transaction payment date. It indicates when the transaction was received in the bank account. For PIX it is instantly, for bank ticket usually takes 1 business day and for credit card takes 30 running days
  ts_created:
    lineage:
    - datalake_velo.transaction_entries.ts_created
    description: Moment (timestamp) when the transaction was created
  ts_modified:
    lineage:
    - datalake_velo.transaction_entries.ts_modified
    description: Moment (timestamp) when the transaction was modified last
  ts_load:
    description: Moment (timestamp) when the table was last loaded
