database_name: dw_velo
table_name: fact_velo_propose
description: Fact table focused on the Propose and Contracts of Velo systems
domain: Fintech
owner: ae-fintech@quintoandar.com.br
columns:
  sk_propose:
    lineage:
      - datalake_velo.propose.id_propose
      - datalake_velo.propose_legacy.id_propose
    description: Propose's identification number (ID)
  sk_propose_values:
    lineage:
      - datalake_velo.propose.id_propose_values
      - datalake_velo.propose_legacy.id_propose_values
    description: Propose values' identification number (ID). This key connects to the table dw_velo.dim_velo_propose_values
  sk_broker:
    lineage:
      - datalake_velo.propose.id_broker
      - datalake_velo.propose_legacy.id_broker
    description: Broker's identification number (ID). This key connects to the table dw_velo.dim_velo_broker
  sk_house:
    lineage:
      - datalake_velo.propose.id_house
      - datalake_velo.propose_legacy.id_house
    description: House's identification number (ID). This key connects to the table dw_velo.dim_velo_house
  sk_propose_company:
    lineage:
      - datalake_velo.propose.id_propose_company
      - datalake_velo.propose_legacy.id_propose_company
    description: Company's identification number (ID). This key connects to the table dw_velo.dim_velo_propose_company
  sk_agent:
    lineage:
      - datalake_velo.propose.id_agent
      - datalake_velo.propose_legacy.id_agent
    description: Agent's identification number (ID). This key connects to the table dw_velo.dim_velo_user
  sk_primary_person:
    lineage:
      - datalake_velo.propose.id_primary_person
      - datalake_velo.propose_legacy.id_primary_person
    description: Primary person's identification number (ID). This key connects to the table dw_velo.dim_velo_propose_person considering only propose's primary person
  sk_origin:
    lineage:
      - datalake_velo.propose.id_origin
      - datalake_velo.propose_legacy.id_origin
    description: Origin's identification number (ID). It indicates if the the propose was made by a person or by a business and this key connects to the table dw_velo.dim_velo_junk
  sk_propose_status:
    lineage:
      - datalake_velo.propose.id_propose_status
      - datalake_velo.propose_legacy.id_propose_status
    description: Propose status' identification number (ID). This key connects to the table dw_velo.dim_velo_junk
  sk_guarantee_status:
    lineage:
      - datalake_velo.propose.id_guarantee_status
      - datalake_velo.propose_legacy.id_guarantee_status
    description: Guarantee status' identification number (ID). This key connects to the table dw_velo.dim_velo_junk
  sk_propose_type:
    lineage:
      - datalake_velo.propose.id_propose_type
      - datalake_velo.propose_legacy.id_propose_type
    description: Propose type's identification number (ID). It indicates if the propose is residential or commercial this key connects to the table dw_velo.dim_velo_junk
  count_persons_included:
    lineage:
      - datalake_velo.propose.count_persons_included
      - datalake_velo.propose_legacy.count_persons_included
    description: How many persons were included on the propose
  percentage_income_from_primary_person:
    lineage:
      - datalake_velo.propose.percentage_income_from_primary_person
      - datalake_velo.propose_legacy.percentage_income_from_primary_person
    description:
      The percentage of the primary person is realted to the total declared
      income of all persons related to the propose
  avg_serasa_score:
    lineage:
      - datalake_velo.propose.avg_serasa_score
      - datalake_velo.propose_legacy.avg_serasa_score
    description: Average serasa score of the persons included on the propose
  avg_risk_score:
    lineage:
      - datalake_velo.propose.avg_risk_score
      - datalake_velo.propose_legacy.avg_risk_score
    description: Average risk score of the persons included on the propose
  avg_declared_income:
    lineage:
      - datalake_velo.propose.avg_declared_income
      - datalake_velo.propose_legacy.avg_declared_income
    description: Average declared income of the persons included on the propose
  total_declared_income:
    lineage:
      - datalake_velo.propose.total_declared_income
      - datalake_velo.propose_legacy.total_declared_income
    description: Total declared income of the persons included on the propose
  dti:
    lineage:
      - datalake_velo.propose.dti
      - datalake_velo.propose_legacy.dti
    description: Debt-to-income ratio. Indicates the ratio between the debt value by all the gross monthly income declared
  total_paid_amount:
    lineage:
      - datalake_velo.propose.total_paid_amount
      - datalake_velo.propose_legacy.total_paid_amount
    description: Propose's total paid value
  total_expected_amount:
    lineage:
      - datalake_velo.propose.total_expected_amount
      - datalake_velo.propose_legacy.total_expected_amount
    description: Propose's total payable value
  total_due_amount:
    lineage:
      - datalake_velo.propose.total_due_amount
      - datalake_velo.propose_legacy.total_due_amount
    description: Propose's total due value (not paid)
  total_occurrences_due_amount:
    lineage:
      - datalake_velo.propose.total_occurrences_due_amount
      - datalake_velo.propose_legacy.total_occurrences_due_amount
    description: Propose's total payable occurrences value
  total_occurrences_paid_amount:
    lineage:
      - datalake_velo.propose.total_occurrences_paid_amount
      - datalake_velo.propose_legacy.total_occurrences_paid_amount
    description: Propose's total paid occurrences value
  total_payments:
    lineage:
      - datalake_velo.propose.total_payments
      - datalake_velo.propose_legacy.total_payments
    description: Propose's quantity of invoices
  total_payments_paid:
    lineage:
      - datalake_velo.propose.total_payments_paid
      - datalake_velo.propose_legacy.total_payments_paid
    description: Propose's quantity of payments (paid invoices)
  total_payments_expired:
    lineage:
      - datalake_velo.propose.total_payments_expired
      - datalake_velo.propose_legacy.total_payments_expired
    description: Propose's quantity of overdue invoices
  total_occurrences:
    lineage:
      - datalake_velo.propose.total_occurrences
      - datalake_velo.propose_legacy.total_occurrences
    description: Propose's quantity of occurrences
  occurrences_solved:
    lineage:
      - datalake_velo.propose.occurrences_solved
      - datalake_velo.propose_legacy.occurrences_solved
    description: Propose's quantity of occurrences solved (paid)
  is_contract:
    lineage:
      - datalake_velo.propose.is_contract
      - datalake_velo.propose_legacy.is_contract
    description: If the propose has been turned into a contract
  is_direct_billing:
    lineage:
      - datalake_velo.propose.is_direct_billing
      - datalake_velo.propose_legacy.is_direct_billing
    description: If the propose uses the direct billing model
  is_grace_period_cancelled:
    lineage:
      - datalake_velo.propose.is_grace_period_cancelled
      - datalake_velo.propose_legacy.is_grace_period_cancelled
    description: If the propose's grace period has expired
  is_legacy:
    lineage:
      - datalake_velo.propose.is_legacy
      - datalake_velo.propose_legacy.is_legacy
    description: If the propose's comes from Velo 2.0 systems (TRUE = 2.0, FALSE = QuintoCred;3.0)
  is_3p:
    lineage:
      - datalake_velo.propose.is_3p
      - datalake_velo.propose_legacy.is_3p
    description: If the propose's comes 3P flow
  dt_last_payment:
    lineage:
      - datalake_velo.propose.dt_last_payment
      - datalake_velo.propose_legacy.dt_last_payment
    description: Propose's last payment date
  dt_contract_started:
    lineage:
      - datalake_velo.propose.dt_contract_started
      - datalake_velo.propose_legacy.dt_contract_started
    description: Date of when status of the contract started
  dt_ended:
    lineage:
      - datalake_velo.propose.dt_ended
      - datalake_velo.propose_legacy.dt_ended
    description: Date of when status of the propose or the contract ended
  dt_next_renewal:
    description: Date when the contract will next be renewed
    lineage:
      - datalake_velo.propose_legacy.dt_next_renewal
  dt_analyst_annulment_input:
    lineage:
      - datalake_velo.propose.dt_analyst_annulment_input
      - datalake_velo.propose_legacy.dt_analyst_annulment_input
    description: Date of when status of the propose/contract ended was included on system
  dt_ended_official:
    lineage:
      - datalake_velo.propose.dt_analyst_annulment_input
      - datalake_velo.propose_legacy.dt_analyst_annulment_input
      - datalake_velo.propose.dt_ended
      - datalake_velo.propose_legacy.dt_ended
    description: If the contract has a rescission delinquency then dt_analyst_annulment_input else dt_ended.
  ts_propose_started:
    lineage:
      - datalake_velo.propose.ts_propose_started
      - datalake_velo.propose_legacy.ts_propose_started
    description: Timestamp of when the propose has started
  ts_waiting_new_docs:
    lineage:
      - datalake_velo.propose.ts_waiting_new_docs
      - datalake_velo.propose_legacy.ts_waiting_new_docs
    description: Timestamp of when the propose has started waiting for new docs
  ts_evaluation_started:
    lineage:
      - datalake_velo.propose.ts_evaluation_started
      - datalake_velo.propose_legacy.ts_evaluation_started
    description: Timestamp of when the propose's evaluation has started
  ts_rejected:
    lineage:
      - datalake_velo.propose.ts_rejected
      - datalake_velo.propose_legacy.ts_rejected
    description: Timestamp of when the propose has been rejected
  ts_sign_started:
    lineage:
      - datalake_velo.propose.ts_sign_started
      - datalake_velo.propose_legacy.ts_sign_started
    description: Timestamp of when the propose has been signed
  ts_signed:
    lineage:
      - datalake_velo.propose.ts_signed
      - datalake_velo.propose_legacy.ts_signed
    description: Timestamp of when the propose has finished being signed (to turn into a contract)
  ts_paid:
    lineage:
      - datalake_velo.propose.ts_paid
      - datalake_velo.propose_legacy.ts_paid
    description: Timestamp of when the propose has been paid (to turn into a contract)
  ts_activation:
    lineage:
      - datalake_velo.propose.ts_activation
      - datalake_velo.propose_legacy.ts_activation
    description: Timestamp of when the propose has been activated
  ts_secured:
    lineage:
      - datalake_velo.propose.ts_secured
      - datalake_velo.propose_legacy.ts_secured
    description: Timestamp of when the propose has been secured
  ts_activation_analysis:
    lineage:
      - datalake_velo.propose.ts_activation_analysis
      - datalake_velo.propose_legacy.ts_activation_analysis
    description: Timestamp of when the propose had been activated, but was still in analysis
  ts_secure_pending:
    lineage:
      - datalake_velo.propose.ts_secure_pending
      - datalake_velo.propose_legacy.ts_secure_pending
    description: Timestamp of when the propose has started waiting to be secured
  ts_load:
    description: Moment (timestamp) when the table was last loaded
  risk_category_neurotech:
    description: Category of the last risk analysis rating from neurotech.
    lineage:
      - datalake_velo.propose.risk_category_neurotech
      - datalake_velo.propose_legacy.risk_category_neurotech
  max_hspn:
    description: Maximum hspn value of the propose.
    lineage:
      - datalake_velo.propose.max_hspn
      - datalake_velo.propose_legacy.max_hspn
  min_hspn:
    description: Minimum hspn value of the propose.
    lineage:
      - datalake_velo.propose.min_hspn
      - datalake_velo.propose_legacy.min_hspn
  last_analysis_result:
    description: Category of the result from the last analysis.
    lineage:
      - datalake_velo.propose.last_analysis_result
      - datalake_velo.propose_legacy.last_analysis_result
