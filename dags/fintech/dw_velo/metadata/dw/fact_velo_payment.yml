---
database_name: dw_velo
table_name: fact_velo_payment
owner: guilherme.sacramento@quintoandar.com.br
domain: Fintech
description: |
  QuintoCred is the name given to Velo after its acquisition by QuintoAndar in 2021. As of 2023, the Velo brand was replaced by QuintoCred.
  In June 2025, QuintoCred's core operations were shut down, leaving only the debt collection services active. In the first quarter of 2026, the decision was made to terminate the collection operations by July 31, 2026.
  Therefore, it is important to understand that all Velo and QuintoCred systems are considered legacy, and consequently, the involved tables are as well.

  A Payment is a unique record of a charge, even if it was paid in installments. It can be a charge related to the rent guarantee subscription (e.g., standard monthly IQ payment), or to an Occurrence (e.g., reimbursement by the IQ of what Velo paid to the PP after an IQ default).
  A Payment must have an associated Contract.
  A Payment may be associated with an Occurrence.

  Payment invoices for Velo guarantee subscriptions and direct-billing charges,
  tracking gateway status, due/net amounts, and settlement dates per proposal.
columns:
  sk_payment:
    description: Surrogate key of the Velo payment invoice fact row.
    lineage:
      - datalake_velo.payment.id_payment
  sk_propose:
    description: Foreign key to the guarantee proposal associated with this payment.
    lineage:
      - datalake_velo.payment.id_propose
  sk_occurrence:
    description: Foreign key to the delinquency occurrence linked to this payment, when applicable.
    lineage:
      - datalake_velo.payment.id_occurrence
  sk_propose_values:
    description: Foreign key to the pricing and coverage amounts of the related proposal.
    lineage:
      - datalake_velo.payment.id_propose_values
  sk_billing_type:
    description: Foreign key to the Velo junk dimension for the payment classification code.
    lineage:
      - datalake_velo.payment.id_billing_type
  sk_payment_type:
    description: Foreign key to the Velo junk dimension for the payment classification code.
    lineage:
      - datalake_velo.payment.id_payment_type
  sk_status:
    description: Foreign key to the Velo junk dimension for the payment classification code.
    lineage:
      - datalake_velo.payment.id_status
  sk_payment_gateway:
    description: Foreign key to the Velo junk dimension for the payment classification code.
    lineage:
      - datalake_velo.payment.id_payment_gateway
  sk_payment_category:
    description: Foreign key to the Velo junk dimension for the payment classification code.
    lineage:
      - datalake_velo.payment.id_payment_category
  id_customer:
    description: Velo customer identifier in the billing/subscription system.
    lineage:
      - datalake_velo.payment.id_customer
  id_unicid:
    description: Legacy Unicid system identifier used to reconcile Velo 2.0 records with QuintoCred 3.0.
    lineage:
      - datalake_velo.payment.id_unicid
  id_subscription:
    description: Subscription identifier when the payment belongs to a recurring guarantee plan.
    lineage:
      - datalake_velo.payment.id_subscription
  billing_type:
    description: Human-readable billing model label (e.g. subscription, direct billing, guarantee fee).
    lineage:
      - datalake_velo.payment.billing_type
  payment_type:
    description: Human-readable payment method or charge type for the invoice.
    lineage:
      - datalake_velo.payment.payment_type
  status:
    description: Payment invoice status in the Velo billing gateway (e.g. pending, paid, refunded, chargeback).
    lineage:
      - datalake_velo.payment.status
  payment_gateway:
    description: Payment gateway provider that processed the invoice (e.g. Asaas, Iugu, Pix).
    lineage:
      - datalake_velo.payment.payment_gateway
  payment_category:
    description: Business category of the charge (e.g. activation, recurring subscription, refund).
    lineage:
      - datalake_velo.payment.payment_category
  invoice_url:
    description: URL of the payment or occurrence invoice generated by the billing gateway.
    lineage:
      - datalake_velo.payment.invoice_url
  description:
    description: Description comments for this invoice.
    lineage:
      - datalake_velo.payment.description
  due_amount:
    description: Total amount due on the payment or occurrence invoice.
    lineage:
      - datalake_velo.payment.due_amount
  net_amount:
    description: Amount that Velo receives after removing payment gateway taxes.
    lineage:
      - datalake_velo.payment.net_amount
  is_paid_late:
    description: Boolean flag for when dt_paid if after dt_due.
    lineage:
      - datalake_velo.payment.is_paid_late
  is_due_modified:
    description: Boolean flag for when dt_due has been modified.
    lineage:
      - datalake_velo.payment.is_due_modified
  is_occurrence:
    description: Boolean flag for when the is an occurrence linked to this invoice.
    lineage:
      - datalake_velo.payment.is_occurrence
  is_direct_billing:
    description: Boolean flag for when this payment is from the direct billing model.
    lineage:
      - datalake_velo.payment.is_direct_billing
  is_legacy:
    description: If the propose's comes from Velo 2.0 systems (TRUE = 2.0, FALSE = QuintoCred;3.0)
    lineage:
      - datalake_velo.payment.is_legacy
  dt_created:
    description: Date that invoice was created.
    lineage:
      - datalake_velo.payment.dt_created
  dt_due:
    description: Date that invoice was due.
    lineage:
      - datalake_velo.payment.dt_due
  dt_due_original:
    description: Date that invoice was due originally, if was changed in the middle time.
    lineage:
      - datalake_velo.payment.dt_due_original
  dt_paid:
    description: Date that invoice was paid.
    lineage:
      - datalake_velo.payment.dt_paid
  dt_payment_confirmed:
    description: Date that invoice had it's payment confirmed by the payment gateway.
    lineage:
      - datalake_velo.payment.dt_payment_confirmed
  ts_updated:
    description: Timestamp that the invoice register was last updated on the database.
    lineage:
      - datalake_velo.payment.ts_updated
  ts_load:
    description: Timestamp when this row was loaded into the Velo DW table by the ETL pipeline.
