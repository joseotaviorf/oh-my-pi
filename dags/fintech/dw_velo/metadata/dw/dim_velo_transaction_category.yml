database_name: dw_velo
table_name: dim_velo_transaction_category
description: |
  QuintoCred is the name given to Velo after its acquisition by QuintoAndar in 2021. As of 2023, the Velo brand was replaced by QuintoCred.
  In June 2025, QuintoCred's core operations were shut down, leaving only the debt collection services active. In the first quarter of 2026, the decision was made to terminate the collection operations by July 31, 2026.
  Therefore, it is important to understand that all Velo and QuintoCred systems are considered legacy, and consequently, the involved tables are as well.

  Omie ERP accounting category mapping for Velo transactions, including financial
  nature and DRE (income statement) classification labels.
domain: Fintech
owner: guilherme.sacramento@quintoandar.com.br
columns:
  sk_category:
    lineage:
    - datalake_velo.transaction_category.id_category
    description: SK of the category on Omie ERP
  description:
    lineage:
    - datalake_velo.transaction_category.description
    description: Omie ERP category name applied to Velo payable/receivable transactions.
  nature_description:
    lineage:
    - datalake_velo.transaction_category.nature_description
    description: Financial Nature associated with the category
  dre_description:
    lineage:
    - datalake_velo.transaction_category.dre_description
    description: Description of the category when used on DRE Report
  ts_load:
    description: Timestamp when this category row was loaded into the Velo DW table.
