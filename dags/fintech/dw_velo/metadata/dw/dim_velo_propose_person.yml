database_name: dw_velo
table_name: dim_velo_propose_person
description: Details of persons related to the contract
domain: Fintech
owner: ae-fintech@quintoandar.com.br
columns:
  sk_person:
    lineage:
    - datalake_velo.propose_person.id_person
    description: Person's identification number (ID)
  name:
    lineage:
    - datalake_velo.propose_person.name
    description: Person's name
  email:
    lineage:
    - datalake_velo.propose_person.email
    description: Person's email
  phone:
    lineage:
    - datalake_velo.propose_person.phone
    description: Person's phone
  bureau_name:
    lineage:
    - datalake_velo.propose_person.bureau_name
    description: Name of the bureau that analysed the person score
  document:
    lineage:
    - datalake_velo.propose_person.document
    description: Person's document number (CPF)
  serasa_score:
    lineage:
    - datalake_velo.propose_person.serasa_score
    description: Person's Serasa Score in the moment of propose's credit score evaluation
  risk_score:
    lineage:
    - datalake_velo.propose_person.risk_score
    description: Person's risk score cluster ID
  risk_classification:
    lineage:
    - datalake_velo.propose_person.risk_classification
    description: Person's risk score cluster description
  score_personal_value:
    lineage:
    - datalake_velo.propose_person.score_personal_value
    description: Person's bureau score in the moment of propose's credit score evaluation
  declared_income:
    lineage:
    - datalake_velo.propose_person.declared_income
    description: Person's declared income
  requested_income:
    lineage:
    - datalake_velo.propose_person.requested_income
    description: Person's requested income
  dt_birth:
    lineage:
    - datalake_velo.propose_person.dt_birth
    description: Person's date of birth
  is_legacy:
    lineage:
    - datalake_velo.propose_person.is_legacy
    description: If the propose's comes from Velo 2.0 systems (TRUE = 2.0, FALSE = QuintoCred;3.0)
  ts_load:
    description: Moment (timestamp) when the table was last loaded
