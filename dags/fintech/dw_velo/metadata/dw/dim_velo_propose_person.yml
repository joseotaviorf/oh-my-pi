database_name: dw_velo
table_name: dim_velo_propose_person
description: |
  QuintoCred is the name given to Velo after its acquisition by QuintoAndar in 2021. As of 2023, the Velo brand was replaced by QuintoCred.
  In June 2025, QuintoCred's core operations were shut down, leaving only the debt collection services active. In the first quarter of 2026, the decision was made to terminate the collection operations by July 31, 2026.
  Therefore, it is important to understand that all Velo and QuintoCred systems are considered legacy, and consequently, the involved tables are as well.

  Natural persons (tenants, co-signers, guarantors) on a QuintoCred guarantee
  proposal with credit bureau scores, declared income, and contact details.
domain: Fintech
owner: guilherme.sacramento@quintoandar.com.br
columns:
  sk_person:
    lineage:
      - datalake_velo.propose_person.id_person
      - datalake_velo.propose_person_legacy.id_person
    description: Person's identification number (ID)
  name:
    lineage:
      - datalake_velo.propose_person.name
      - datalake_velo.propose_person_legacy.name
    description: Full name of the Velo platform user or guarantee proponent.
  email:
    lineage:
      - datalake_velo.propose_person.email
      - datalake_velo.propose_person_legacy.email
    description: Contact email registered in the Velo platform or Omie client record.
  phone:
    lineage:
      - datalake_velo.propose_person.phone
      - datalake_velo.propose_person_legacy.phone
    description: Contact phone number of the guarantee proponent on the proposal.
  bureau_name:
    lineage:
      - datalake_velo.propose_person.bureau_name
      - datalake_velo.propose_person_legacy.bureau_name
    description: Name of the bureau that analysed the person score
  document:
    lineage:
      - datalake_velo.propose_person.document
      - datalake_velo.propose_person_legacy.document
    description: Person's document number (CPF)
  serasa_score:
    lineage:
      - datalake_velo.propose_person.serasa_score
      - datalake_velo.propose_person_legacy.serasa_score
    description: Person's Serasa Score in the moment of propose's credit score evaluation
  risk_score:
    lineage:
      - datalake_velo.propose_person.risk_score
      - datalake_velo.propose_person_legacy.risk_score
    description: Person's risk score cluster ID
  risk_classification:
    lineage:
      - datalake_velo.propose_person.risk_classification
      - datalake_velo.propose_person_legacy.risk_classification
    description: Person's risk score cluster description
  score_personal_value:
    lineage:
      - datalake_velo.propose_person.score_personal_value
      - datalake_velo.propose_person_legacy.score_personal_value
    description: Person's bureau score in the moment of propose's credit score evaluation
  declared_income:
    lineage:
      - datalake_velo.propose_person.declared_income
      - datalake_velo.propose_person_legacy.declared_income
    description: Person's declared income
  requested_income:
    lineage:
      - datalake_velo.propose_person.requested_income
      - datalake_velo.propose_person_legacy.requested_income
    description: Person's requested income
  dt_birth:
    lineage:
      - datalake_velo.propose_person.dt_birth
      - datalake_velo.propose_person_legacy.dt_birth
    description: Person's date of birth
  is_legacy:
    lineage:
      - datalake_velo.propose_person.is_legacy
      - datalake_velo.propose_person_legacy.is_legacy
    description: If the propose's comes from Velo 2.0 systems (TRUE = 2.0, FALSE = QuintoCred;3.0)
  ts_load:
    description: Moment (timestamp) when the table was last loaded
