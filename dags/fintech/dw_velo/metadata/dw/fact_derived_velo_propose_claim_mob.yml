  dt_ca:
    description: Timestamp of when the propose has been signed (based on ts_sign_started)
  dt_cs:
    description: Date of when status of the contract started (based on dt_contract_started)
  dt_first_claim:
    description: Date when the first claim of this propose was registered
  dt_last_claim:
    description: Date when the last claim of this propose was registered
  total_mob_count:
    description: Quantity of months this propose had claims
  total_mob_value:
    description: Total sum value of claims made by this propose
  cohort_age_mob_actual:
    description: Actual contract age of the contract in months (bases on the current date - dt_contract_started)
