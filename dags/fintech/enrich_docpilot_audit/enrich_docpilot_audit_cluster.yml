cluster:
  # Name-map from consolidation_s_memory → emr_7_12_consolidation_s_memory_fleet.
  # Prior Databricks: 3 workers; keep +0 vs preset core for sampling / window workload.
  type: emr_7_12_consolidation_s_memory_fleet_cluster
  custom_configurations:
    core_nodes:
      target_on_demand: 3
      target_spot: 0
      instance_types:
        - r6g.xlarge
        - r7g.xlarge
        - r6i.xlarge
