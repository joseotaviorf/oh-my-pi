---
database_name: datalake_docpilot_audit
table_name: labeling_data
owner: isabella.santos@quintoandar.com.br
domain: Fintech
description: >
  Weekly sample of rental credit analyses selected for documentation quality audit,
  with proposal, proponent, analyst, and up to ten income document files prepared for manual labeling.
columns:
  id_proposal:
    description: Rental proposal identifier selected in the credit audit sample and matched to DocX income documents.
    lineage:
      - datalake_sorting_hat_clean.credit_analysis_version.id_proposal
      - datalake_docx_clean.document.reference_properties
  name:
    description: Applicant full name from the identity document submitted in rental documentation (PII).
    lineage:
      - datalake_docx_clean.document.attributes
  type:
    description: Category of the credit analysis decision included in the sample.
    lineage:
      - datalake_sorting_hat_clean.credit_analysis_version.type
  ts_credit_analysis_updated:
    description: Timestamp of the latest credit analysis version included in the audit sample.
    lineage:
      - datalake_sorting_hat_clean.credit_analysis_version.ts_updated
  result:
    description: Credit analysis outcome from the manual review workflow.
    lineage:
      - datalake_sorting_hat_clean.credit_analysis_version.result
  reason:
    description: Reason code explaining the credit analysis outcome.
    lineage:
      - datalake_sorting_hat_clean.credit_analysis_version.reason
  analyst:
    description: Name of the analyst who performed the manual credit review.
    lineage:
      - datalake_sorting_hat_clean.checklist_item.input_source_name
      - datalake_sorting_hat_clean.analysis_request.id_external
  document_1:
    description: First income document file name attached to the proposal folder.
    lineage:
      - datalake_docx_clean.document.attributes
  document_2:
    description: Second income document file name attached to the proposal folder.
    lineage:
      - datalake_docx_clean.document.attributes
  document_3:
    description: Third income document file name attached to the proposal folder.
    lineage:
      - datalake_docx_clean.document.attributes
  document_4:
    description: Fourth income document file name attached to the proposal folder.
    lineage:
      - datalake_docx_clean.document.attributes
  document_5:
    description: Fifth income document file name attached to the proposal folder.
    lineage:
      - datalake_docx_clean.document.attributes
  document_6:
    description: Sixth income document file name attached to the proposal folder.
    lineage:
      - datalake_docx_clean.document.attributes
  document_7:
    description: Seventh income document file name attached to the proposal folder.
    lineage:
      - datalake_docx_clean.document.attributes
  document_8:
    description: Eighth income document file name attached to the proposal folder.
    lineage:
      - datalake_docx_clean.document.attributes
  document_9:
    description: Ninth income document file name attached to the proposal folder.
    lineage:
      - datalake_docx_clean.document.attributes
  document_10:
    description: Tenth income document file name attached to the proposal folder.
    lineage:
      - datalake_docx_clean.document.attributes
