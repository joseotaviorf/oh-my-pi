dag:
  name: cyber_complement
  owner: Data Fintech
  documentation:
    dag_purpose: |
      ingestion of cyber system tables about debts and collections.
      cyber folder that contains all details about the system: https://drive.google.com/drive/folders/1qkegwyyddsnj37hdoa2yh8fz52cftfhx?usp=drive_link
workflow:
  layer: raw
  type: custom_ingestion
  load_spark_job: load_cyber_raw
  custom_schema: cyber
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, 2), 'load_end_date') }}"
  default_extraction_type: full
  spark_job_arguments:
    - "{environment}"
    - "{bucket}"
    - "{schema}"
    - "{table_name}"
    - "{load_start_date}"
    - "{load_end_date}"
    - "{extraction_type}"
    - "{partitions}"
  tables_customization:
    delqmst:
      clean_table_name: delinquent_master
      extraction_type: incremental
      partitions: [year, month, day]
      extra_spark_job_arguments:
        - "['DMHOSTUP', 'DMQCHGDT', 'DMQCHGDT2', 'DMQCHGDT3', 'DMQCHGDT4', 'DMQCHGDT5', 'DMQCHGDT6']"
        - False
        - "[]"
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: r5.xlarge
    node_type_id: r5a.large
    num_workers: 3
    spark_version: 16.4.x-scala2.12
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
  custom_libraries:
    - jar: "{artifacts_bucket}/jars/ojdbc8.jar"
  databricks_conn_id: databricks_new
