dag:
  name: cyber_complement
  schedule_start_date: 2024, 8, 1
  schedule_interval: 10 7 * * *
  owner: Data Fintech
  documentation:
    dag_purpose: |
      ingestion of cyber system tables about debts and collections.
      cyber folder that contains all details about the system: https://drive.google.com/drive/folders/1qkegwyyddsnj37hdoa2yh8fz52cftfhx?usp=drive_link
workflow:
  layer: raw
  type: custom_ingestion
  load_spark_job: load_cyber_raw
  custom_schema: cyber
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, -4), 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, 2), 'load_end_date') }}"
  default_extraction_type: full
  spark_job_arguments:
    - "{environment}"
    - "{bucket}"
    - "{schema}"
    - "{table_name}"
    - "{load_start_date}"
    - "{load_end_date}"
    - "{extraction_type}"
    - "{partitions}"
  tables_customization:
    agrtype:
      clean_table_name: agreement_type
      raw_extraction_type: incremental
      raw_partitions: [year, month, day]
      clean_extraction_type: full
      merge_on: ["id_agreement_type"]
      extra_spark_job_arguments:
        - "[]"
        - False
        - "[]"
    tb_campanha_contrato:
      clean_table_name: campaign_contracts
      extraction_type: full
      partitions: []
      extra_spark_job_arguments:
        - "[]"
        - False
        - "[]"
    tb_campanha:
      clean_table_name: campaign
      extraction_type: full
      partitions: []
      extra_spark_job_arguments:
        - "[]"
        - False
        - "[]"
    tb_grupo_agency:
      clean_table_name: agency_group
      extraction_type: full
      partitions: []
      extra_spark_job_arguments:
        - "[]"
        - False
        - "[]"
    agtpdsc:
      clean_table_name: agreement_type_discount
      extraction_type: full
      partitions: []
      extra_spark_job_arguments:
        - "[]"
        - False
        - "[]"
    que_dectbl:
      clean_table_name: segmentation_decision_tree
      extraction_type: full
      partitions: []
      extra_spark_job_arguments:
        - "[]"
        - False
        - "[]"
    que_dectbl3:
      clean_table_name: agreement_decision_tree
      extraction_type: full
      partitions: []
      extra_spark_job_arguments:
