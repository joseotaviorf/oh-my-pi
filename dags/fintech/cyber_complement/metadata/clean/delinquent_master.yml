---
database_name: datalake_cyber_clean
table_name: delinquent_master
owner: bianca.martins@quintoandar.com.br
domain: Fintech
description: |
  Master table with contract data. Table granularity - id_contract + contract_group.
  Records can be updated and DMHOSTUP (ts_last_update) informs the date of the last update.
  The DMAGENCY (id_agency) column will be filled with the corresponding agency group code. To identify which agency belong to each group, it is necessary to consult the TB_GRUPO_AGENCY (datalake_cyber_clean.agency_group) table.
columns:
  id_client:
    description: "ID client (CPF/CNPJ). TF: client.documentNumber where client-type = 'main-tenant'"
    lineage:
      - datalake_cyber_raw.delqmst.DMSSNUM
  id_contract:
    description: "ID (key) to identify the Cyber ​​Contract (unique, even in exchange of ownership). ID contract = ID Contract (TF: contract.external-id) + Contract Group (ID Product debtor.product-code) + Revision"
    lineage:
      - datalake_cyber_raw.delqmst.DMACCT
  id_agency:
    description: "Agency identifier assigned to the account for collection"
    lineage:
      - datalake_cyber_raw.delqmst.DMAGENCY
  id_product:
