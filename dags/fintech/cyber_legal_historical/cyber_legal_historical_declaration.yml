dag:
  name: cyber_legal_historical
  schedule_start_date: 2025, 8, 1
  schedule_interval: 0 8 * * *
  owner: Data Fintech
  callback_by_task: False
  documentation:
    dag_purpose: |
      ingestion of Cyber Legal system tables about debts and collections.
workflow:
  layer: raw
  type: custom_ingestion
  load_spark_job: load_cyber_raw
  custom_schema: cyber_legal_historical
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  default_extraction_type: full
  spark_job_arguments:
    - "{environment}"
    - "{bucket}"
    - "{dag_name}"
    - "{table_name}"
    - "{load_start_date}"
    - "{load_end_date}"
    - "{extraction_type}"
    - "{partitions}"
  tables_customization:
    case:
      clean_table_name: historical_case_status
      extraction_type: incremental
      partitions: [year, month, day]
      extra_spark_job_arguments:
        - "['CESTATDT', 'CEDTUPD']"
        - False
        - "[]"
    caseuda:
      clean_table_name: historical_case_uda
      extraction_type: incremental
      partitions: [year, month, day]
      extra_spark_job_arguments:
        - "['CUDATE', 'CUREVGERAL', 'CUULTDT']"
        - False
        - "[]"
