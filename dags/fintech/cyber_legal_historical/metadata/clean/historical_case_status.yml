---
database_name: datalake_cyber_legal_historical_clean
table_name: historical_case_status
owner: ae-finance-fintech@quintoandar.com.br
domain: Fintech
description: "Table containing CyberLegal cases change of status history."
columns:
  id_case:
    description: "Legal case number - Primary key"
    lineage:
      - datalake_cyber_legal_historical_raw.case.CECASENO
  id_dossier:
    description: "Dossier number - Business primary key"
    lineage:
      - datalake_cyber_legal_historical_raw.case.CEDOSSIERID
  id_client:
    description: "Client unique identification (CPF/CNPJ)"
    lineage:
      - datalake_cyber_legal_historical_raw.case.CESSNUM
  case_status:
    description: "Legal process status (New, Active, Finalized, Pending, Completed)"
    lineage:
      - datalake_cyber_legal_historical_raw.case.CESTATUS
  closure_reason:
    description: "Reason for case closure when status is Finalized or Completed."
    lineage:
      - datalake_cyber_legal_historical_raw.case.CEREASON
  closure_result:
    description: "Result of the case closure when status is Finalized or Completed."
    lineage:
      - datalake_cyber_legal_historical_raw.case.CERESULT
  dt_status_changed:
    description: "Date when case status changed"
    lineage:
      - datalake_cyber_legal_historical_raw.case.CESTATDT
  ts_updated:
    description: "Timestamp of the last update"
    lineage:
      - datalake_cyber_legal_historical_raw.case.CEDTUPD
  year:
    description: "Year of the record"
    lineage:
      - datalake_cyber_legal_historical_raw.case.year
  month:
    description: "Month of the record"
    lineage:
      - datalake_cyber_legal_historical_raw.case.month
  day:
    description: "Day of the record"
    lineage:
      - datalake_cyber_legal_historical_raw.case.day
  ts_load:
    description: "Timestamp when record was loaded into the clean layer"
