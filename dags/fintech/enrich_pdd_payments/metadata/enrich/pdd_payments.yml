---
database_name: datalake_pdd_payments
table_name: pdd_payments
owner: ae-finance-fintech@quintoandar.com.br
domain: Fintech
description: PDD data from Retsuko and Vans. Each line is an invoice to be paid or paid.
columns:
  id_invoice:
    description: Invoice identification number
    lineage:
      - datalake_retsuko.invoice.id_external
  id_contract:
    description: Contract identification number
    lineage:
      - datalake_retsuko_clean.contract.id_external
  frequency:
    description: Invoice's type description
    lineage:
      - datalake_retsuko.invoice.purpose
  payment_status:
    description: Invoice payment status description
    lineage:
      - datalake_retsuko.invoice.status
  user:
    description: Type of user
    lineage:
      - datalake_retsuko_clean.account.type
  pd_range:
    description: Description of PD range
  flag_risk:
    description: Flag indicating the degree of risk
  due_amount:
    description: Due amount of invoice
    lineage:
      - datalake_retsuko.invoice.due_amount
  paid_amount:
    description: Paid amount of invoice
    lineage:
      - datalake_retsuko.invoice.paid_amount
  original_amount:
    description: Original amount of invoice
    lineage:
      - datalake_vans_clean.boleto.due_amount
      - datalake_vans_clean.payment.due_amount
  pdd:
    description: PDD calculation
  days_until_due:
    description: Number of days until the invoice is overdue
  delta_days:
    description: Calculation of days between payment day and due date
  delta_days_contaminated:
    description: Calculation of days between payment day and minimum due date
  accrual_year_month:
    description: Competence of invoice, i.e expectation of month for cash flow
    lineage:
      - datalake_retsuko.invoice.accrual_year_month
  dt_sent:
    description: Date the invoice was sent
    lineage:
      - datalake_retsuko.invoice.ts_sent
  dt_due:
    description: Invoice due date
    lineage:
      - datalake_retsuko.invoice.ts_due
  dt_paid:
    description: Invoice payment date
    lineage:
      - datalake_retsuko.invoice.ts_paid
  dt_probable_created:
    description: Probable creation date
    lineage:
      - datalake_retsuko.invoice.accrual_year_month
      - datalake_retsuko.invoice.ts_created
  dt_probable_due:
    description: probable due date
    lineage:
      - datalake_retsuko.invoice.dt_due
  dt_min_contract_due:
    description: Minimum date of contract due
    lineage:
      - datalake_retsuko.invoice.dt_due
  ts_created:
    description: Creation timestamp
    lineage:
      - datalake_retsuko.invoice.ts_created
  ts_canceled:
    description: Cancelation timestamp
    lineage:
      - datalake_retsuko.invoice.ts_canceled
  year:
    description: Reference year
  month:
    description: Reference month
  day:
    description: Reference day
