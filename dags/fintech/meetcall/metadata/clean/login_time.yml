database_name: datalake_meetcall_clean
table_name: login_time
owner: bianca.martins@quintoandar.com.br
domain: fintech
description: This table contains data related to the work hours of Meetcall employees. It includes key metrics such as pause time, logged-in duration, talk time, and idle time. The data can be used to monitor operator productivity, understand workload patterns, and support operational decision-making related to workforce management.
columns:
  id_record:
    description: Unique identifier of the login record
    lineage:
      - datalake_meetcall_raw.dadosloginlogout.id_registro
  id_operator_cyber:
    description: Cyber operator login
    lineage:
      - datalake_meetcall_raw.dadosloginlogout.id_operador_cyber
  id_operator:
    description: MeetCall operator login
    lineage:
      - datalake_meetcall_raw.dadosloginlogout.id_operador_assessoria
  email_operator:
    description: Email address associated with the operator
    lineage:
      - datalake_meetcall_raw.dadosloginlogout.email_operador
  portfolio:
    description: Portfolio (cell) the operator was assigned to on the given day, representing the area of collection activity.
    lineage:
      - datalake_meetcall_raw.dadosloginlogout.celula
  total_pause_time:
    description: Total time the operator spent on pause
    lineage:
      - datalake_meetcall_raw.dadosloginlogout.tempo_total_pausa
  total_logged_time:
    description: Total time the operator was logged into the system
    lineage:
      - datalake_meetcall_raw.dadosloginlogout.tempo_total_logado
  total_talk_time:
    description: Total time the operator spent on calls
    lineage:
      - datalake_meetcall_raw.dadosloginlogout.tempo_total_falado
  total_idle_time:
    description: Total time the operator was logged in without handling contacts
    lineage:
      - datalake_meetcall_raw.dadosloginlogout.tempo_total_disponivel
  dt_reference:
    description: Date of the login time record
    lineage:
      - datalake_meetcall_raw.dadosloginlogout.data_registro
  ts_login:
    description: Timestamp of the earliest login time of the day
    lineage:
      - datalake_meetcall_raw.dadosloginlogout.hora_login
  ts_logout:
    description: Timestamp of the latest logout time of the day
    lineage:
      - datalake_meetcall_raw.dadosloginlogout.hora_logout
  year:
    description: Partition column representing the year of the event
    lineage:
      - datalake_meetcall_raw.dadosloginlogout.year
  month:
    description: Partition column representing the month of the event
    lineage:
      - datalake_meetcall_raw.dadosloginlogout.month
  day:
    description: Partition column representing the day of the event
    lineage:
      - datalake_meetcall_raw.dadosloginlogout.day
  ts_load:
    description: Timestamp of data load execution
