database_name: datalake_iaf_clean
table_name: distribution_hist
description:
  One row per distribution hist in the Fintech clean layer, sourced from
  datalake_iaf_clean for payments, billing, and financial operations
  reporting.
owner: juliana.hocihara@quintoandar.com.br
domain: Fintech
columns:
  id:
    lineage:
      - datalake_iaf_raw.vi_319_tb_distribuicao_hist.id
    description: Financial attribute representing id on the distribution_hist dataset.
  dt_distribution_days:
    lineage:
      - datalake_iaf_raw.vi_319_tb_distribuicao_hist.data_distri_dias
    description: Calendar date associated with distribution days in the financial workflow.
  dt_distribution_2:
    lineage:
      - datalake_iaf_raw.vi_319_tb_distribuicao_hist.data_distri2
    description: Calendar date associated with distribution 2 in the financial workflow.
  process:
    lineage:
      - datalake_iaf_raw.vi_319_tb_distribuicao_hist.processo
    description: Financial attribute representing process on the distribution_hist dataset.
  user_distribution:
    lineage:
      - datalake_iaf_raw.vi_319_tb_distribuicao_hist.usuario_distri
    description: Financial attribute representing user distribution on the distribution_hist dataset.
  charger:
    lineage:
      - datalake_iaf_raw.vi_319_tb_distribuicao_hist.cobrador
    description: Financial attribute representing charger on the distribution_hist dataset.
  dt_exit:
    lineage:
      - datalake_iaf_raw.vi_319_tb_distribuicao_hist.data_saida
    description: Calendar date associated with exit in the financial workflow.
  ts_updated:
    lineage:
      - datalake_iaf_raw.vi_319_tb_distribuicao_hist.last_update
    description: Timestamp when updated occurred in the upstream fintech system.
