---
database_name: dw_audit_ifrs
table_name: fact_liability_contracts
description: >-
  Monthly IFRS / ECL liability-side fact from closing × contract snapshot × liability EAD/LGD
  lookup (ead_lgd_liability clean sheet). Passivos-style pipeline without bureau joins.
owner: marcos.mota@quintoandar.com.br
domain: Fintech
columns:
  sk_contract:
    lineage:
      - dw_public_snapshot.dim_contract_snapshot.sk_contract
    description: Surrogate contract key from contract snapshot (grain aligned to snapshot closing month).
  dt_closing:
    lineage:
      - dw_losses.fact_closing.dt_closing
      - dw_public_snapshot.dim_contract_snapshot.ts_snapshot
    description: >-
      Closing calendar date (month-end convention); aligned between fact_closing and snapshot via
      date_trunc(month, ts_snapshot) minus one day where applicable.
  dt_start:
    lineage:
      - dw_public_snapshot.dim_contract_snapshot.dt_start
    description: Contract operational start date from snapshot.
  dt_annulment:
    lineage:
      - dw_public_snapshot.dim_contract_snapshot.dt_annulment
    description: Contract annulment date when present on snapshot.
  closing_month_status:
    lineage:
      - dw_public_snapshot.dim_contract_snapshot.status
    description: Contract lifecycle status on snapshot (Ativo / Finalizado) carried as closing-month label.
  first_rent_charged:
    lineage:
      - dw_public_snapshot.dim_contract_snapshot.first_rent_charged
    description: First rent charged reference from contract snapshot.
  rent:
    lineage:
      - dw_public_snapshot.dim_contract_snapshot.rent
    description: Rent amount from contract snapshot.
  invoice_account_type:
    lineage:
      - dw_losses.fact_delay.user
    description: >-
      Invoice account role from delay path via aggregated closing join (tenant when delay user is null).
  is_early_bird:
    description: >-
      True when snapshot contract is Ativo and no aggregated closing/assets row exists for that month
      (early-bird style bridge flag).
  guarantee_group:
    lineage:
      - dw_public_snapshot.dim_contract_snapshot.guarantee
    description: Paid vs Free guarantee grouping mapped from snapshot guarantee product codes.
  is_ongoing_contract:
    lineage:
      - dw_public_snapshot.dim_contract_snapshot.status
    description: True when snapshot status equals Ativo for ongoing-contract semantics.
  delay_contamined_range:
    lineage:
      - dw_losses.fact_delay.delay_contamined_range
      - dw_losses.fact_losses.delay_contaminated_range
    description: >-
      Contaminated delay bucket label; may use sentinel is_early_bird when invoice delay is null on active
      snapshot contracts.
  initial_delay_stage:
    lineage:
      - dw_losses.fact_delay.delay_contamined_range
      - dw_losses.fact_losses.delay_contaminated_range
    description: Macro Stage 1–3 / Other mapping from delay bucket labels used in ECL staging.
  exposure_at_default:
    lineage:
      - datalake_gsheets_clean.ead_lgd_liability.exposure_at_default
    description: Exposure-at-default coefficient from liability EAD/LGD sheet after second-pass lookup join.
  loss_given_default:
    lineage:
      - dw_losses.fact_closing.is_contract_write_off
      - datalake_gsheets_clean.ead_lgd_liability.loss_given_default
    description: >-
      LGD coefficient after liability-sheet lookup (write-off forces 1.0 upstream in closing aggregates).
  due_amount:
    lineage:
      - dw_losses.fact_closing.due_amount
    description: >-
      Sum of scaled closing due amounts by snapshot contract-month after excluding write-off invoice rows
      in aggregation rules.
  ts_load:
    description: Warehouse load timestamp for the materialized row.
