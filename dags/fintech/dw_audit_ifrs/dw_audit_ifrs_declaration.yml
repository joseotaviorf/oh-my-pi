dag:
  name: dw_audit_ifrs
  schedule_start_date: 2024, 1, 1
  owner: Data Fintech
  documentation:
    dag_purpose: |
      Materializes tables from the dw_audit_ifrs schema for IFRS/ECL exercises and audits,
      taking contract facts (assets and liabilities) from the DW and EAD/LGD spreadsheets.
workflow:
  type: query_delta
  layer: dw
  custom_schema: audit_ifrs
  default_extraction_type: full
  default_partitions: []
  has_load_to_redshift_task: false
  short_circuit_customization:
    function: CHECK_IS_FIRST_BUSINESS_DAY_OF_MONTH
cluster:
  type: databricks_16_4_med_io-memory_photon_cluster
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE
  databricks_conn_id: databricks_new_env
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: "quintoandar_{{ var.value.environment }}"
