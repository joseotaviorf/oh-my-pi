cluster:
  type: emr_7_12_consolidation_l_memory_single_node_fleet_cluster
  custom_libraries:
  - whl: '{artifacts_bucket}/sap-4hana-api-client-python/quintoandar_sap_4hana_api_client-0.1.0-py2.py3-none-any.whl'
  - pypi:
      package: numpy==1.26.4
  - pypi:
      package: pyarrow==15.0.2
  custom_configurations:
    aws_attributes:
      ebs_volume_size: 200
    # Preset pins spark.driver.memory at 12g regardless of r6g.4xlarge.
    # Journal entries are collected on the driver (~7.6M rows/day) then
    # createDataFrame + JSON write; 8g/12g heaps OOM (Java heap space).
    spark_conf:
      spark.driver.memory: 32g
      spark.driver.memoryOverhead: 8g
