---
database_name: datalake_invoice
table_name: invoice_entries
owner: ae-finance-fintech@quintoandar.com.br
domain: fintech
description: "Table containing data from invoice entries"
columns:
  id:
    description: "Invoice entry ID"
    lineage:
      - datalake_retsuko_clean.entry.id_external
  id_external_reversed_entry:
    description: "External reversed entry ID"
    lineage:
      - datalake_retsuko_clean.entry.id_external_reversed_entry
  id_invoice:
    description: "Invoice ID"
    lineage:
      - datalake_retsuko_clean.invoice.id_external
  id_contract:
    description: "Contract ID"
    lineage:
      - datalake_retsuko_clean.contract.id_external
  id_contract_user:
    description: "Contract user ID"
    lineage:
      - datalake_ebdb_clean.rent_flow.id_client
      - datalake_ebdb_clean.house.id_user
      - datalake_ebdb_clean.partner_agent.id_user
      - datalake_ebdb_clean.partner_agent.id_partner
  id_region:
    description: "Region ID"
    lineage:
      - datalake_ebdb_clean.house.id_region
  id_created_date:
