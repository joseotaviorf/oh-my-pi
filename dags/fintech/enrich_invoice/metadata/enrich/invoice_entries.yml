    lineage:
      - datalake_retsuko_clean.entry.ts_created
  id_due_date:
    description: "Due date ID"
    lineage:
      - datalake_retsuko_clean.invoice.ts_due
  id_paid_date:
    description: "Pay date ID"
    lineage:
      - datalake_retsuko_clean.invoice.ts_paid
  brl_entry_due_amount:
    description: "Entry due amount in BRL"
    lineage:
      - datalake_retsuko_clean.entry.amount
  brl_entry_paid_amount:
    description: "Entry paid amount in BRL"
  ts_created:
    description: "Timestamp of creation"
    lineage:
      - datalake_retsuko_clean.entry.ts_created
