---
database_name: datalake_invoice
table_name: invoice_all
owner: juliana.hocihara@quintoandar.com.br
domain: Fintech
description: "Table containing data from invoice linking with data from its contract"
columns:
  id_invoice_entry:
    description: Identifier for the invoice entry referenced by this financial record.
    lineage:
      - datalake_invoice.invoice_entries.id
  id_region:
    description: Identifier for the region referenced by this financial record.
    lineage:
      - datalake_invoice.invoice_entries.id_region
  id_contract:
    description: Rental or sale contract identifier linking this financial record to the lease agreement.
    lineage:
      - datalake_ebdb_contract.contract.id
  rent:
    description: Financial attribute representing rent on the invoice_all dataset.
    lineage:
      - datalake_ebdb_contract.contract.rent
  version:
    description: Financial attribute representing version on the invoice_all dataset.
    lineage:
      - datalake_ebdb_contract.contract.contract_version
  guarantee:
    description: Financial attribute representing guarantee on the invoice_all dataset.
    lineage:
      - datalake_ebdb_contract.contract.guarantee
  description:
    description: Human-readable description of the financial transaction or ledger entry.
    lineage:
      - datalake_retsuko.invoice_entry.description
  bill_item:
    description: Financial attribute representing bill item on the invoice_all dataset.
    lineage:
      - datalake_retsuko.invoice_entry.entry_type
  frequency:
    description: Financial attribute representing frequency on the invoice_all dataset.
    lineage:
      - datalake_retsuko.invoice_info.invoice_frequency
  status:
    description: Current lifecycle status of the financial entity in the upstream operational system.
    lineage:
      - datalake_retsuko.invoice_info.payment_status
  invoice_account_type:
    description: "Invoice account type description"
    lineage:
      - datalake_retsuko.invoice_info.user
  sb_value:
    description: Financial attribute representing sb value on the invoice_all dataset.
  sign_value:
    description: Financial attribute representing sign value on the invoice_all dataset.
  is_b2b:
    description: "Boolean that indicates if it's b2b"
    lineage:
      - datalake_ebdb_contract.contract_b2b.is_b2b
  is_created_before_third_business_day:
    description: "Boolean that indicates if the invoice was created before third business day"
  dt_third_business_day:
    description: "Date of third business day"
    lineage:
      - datalake_quintoandar.aux_date.date
  dt_contract_month_signed:
    description: "Year and month of contract signing"
    lineage:
      - datalake_ebdb_contract.contract.ts_signed
  dt_contract_month_started:
    description: "Year and month when the contract started"
    lineage:
      - datalake_ebdb_contract.contract.dt_started
  dt_invoice_paid:
    description: "Date when invoice was paid"
    lineage:
      - datalake_invoice.invoice_entries.id_paid_date
  accrual_year_month:
    description: Financial attribute representing accrual year month on the invoice_all dataset.
    lineage:
      - datalake_retsuko.invoice_entry.accrual_year_month
  dt_next_accrual:
    description: "Next accural date"
    lineage:
      - datalake_retsuko.invoice_entry.accrual_year_month
  ts_created:
    description: "Timestamp of creation"
    lineage:
      - datalake_retsuko.invoice.ts_created
      - datalake_invoice.invoice_entries.id_created_date
  dt_created_for_filter:
    description: "Date of creation to be used on filters"
    lineage:
      - datalake_invoice.invoice_entries.id_created_date
