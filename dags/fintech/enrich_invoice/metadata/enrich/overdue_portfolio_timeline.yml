---
database_name: datalake_invoice
table_name: overdue_portfolio_timeline
owner: athos.sampayo@quintoandar.com.br
domain: fintech
description: The table contains information about the daily timeline of overdue invoices
columns:
  id_contract:
    lineage:
      - datalake_invoice.invoice_entries.id_contract
    description: Contract ID
  id_invoice:
    lineage:
      - datalake_invoice.invoice_entries.id_invoice
    description: Invoice ID
  contract_status:
    lineage:
      - datalake_ebdb_contract.contract.dt_termination
      - datalake_quintoandar.aux_date.date
    description: Contract status
  contract_version:
    lineage:
      - datalake_ebdb_contract.contract.contract_version
    description: Version of the contract
  contract_guarantee:
    lineage:
      - datalake_ebdb_contract.contract.guarantee_type
    description: Original guarantee type of the contract
  contract_guarantee_type:
    lineage:
      - datalake_ebdb_contract.contract.guarantee_type
    description: Contract Guarantee Type
    categories:
      Paid: Paid guarantee
      Brokerage Only: Contract is brokerage only
      Free: Without paid guarantee
  contract_age:
    lineage:
      - datalake_quintoandar.aux_date.date
      - datalake_ebdb_contract.contract.dt_started
    description: Age of contract
  condo_payer:
    lineage:
      - datalake_ebdb_contract.contract.paying_condo
    description: Who is responsible to make the payment of the condo
    categories:
      Inquilino: The tenant is responsible for making the payment of the condo.
      Proprietario: The property owner is responsible for making the payment of the condo.
      QuintoAndar: QuintoAndar is responsible for making the payment of the condo.
      "null": If the responsible for making the payment of the condo is null.
  city_name:
    lineage:
      - datalake_region.region.city_name
    description: City name of the region.
  short_region_name:
    lineage:
      - datalake_region.region.short_region_name
    description: Short region name.
  city_group:
    lineage:
      - datalake_region.region.city_group
    description: City group of the region.
  invoice_type:
    lineage:
      - datalake_retsuko.invoice_info.invoice_frequency
    description: Invoice's type frequency - monthly, extra, pos rental, onboarding, early termination...
  user:
    lineage:
      - datalake_retsuko.invoice_info.invoice_user
    description: Who is responsible for paying the invoice
  bill_items:
    lineage:
      - datalake_retsuko.invoice_entry.entry_type
      - datalake_retsuko.invoice_entry.brl_entry_due_amount
    description: Bill items
  payment_status:
    lineage:
      - datalake_retsuko.invoice_info.payment_status
    description: Payment status on the reference date
  debtor_type:
    description: "Debtor type: Flow or Stock"
  monthly_income_declared:
    lineage:
      - datalake_proposal.proposal.income
    description: Total income declared by tenants prospects
  package_amount:
    lineage:
      - datalake_proposal.proposal.package
    description: Total package value, rent + condominium + iptu + home_insurance
  dti:
    lineage:
      - datalake_proposal.proposal.dti
    description: Debt-to-income, fraction between package value over tenants' total declared revenue
  due_amount:
    lineage:
      - datalake_retsuko.invoice.due_amount
    description: Invoice due amount
  paid_amount:
    lineage:
      - datalake_retsuko.invoice.paid_amount
    description: Invoice paid amount
  recovered_amount:
    lineage:
      - datalake_retsuko.invoice.due_amount
      - datalake_retsuko.invoice.ts_paid
      - datalake_quintoandar.aux_date.date
    description: Amount recovered between reference month start and reference date
  contract_overdue_invoices:
    description: Contract overdue invoices
  contract_debt:
    description: Contract debt
  delay_invoice_at_reference:
    description: Delay invoice at reference
  delay_invoice_at_closure:
    description: Delay invoice at closure
  delay_contamined_at_closure:
    description: Delay contamined at closure
  delay_contamined_range:
    description: Delay contamined range
  business_day:
    lineage:
      - datalake_quintoandar.aux_date.working_days_in_month
    description: Number of business day on reference months
  ts_invoice_created:
    lineage:
      - datalake_retsuko.invoice.ts_created
    description: Invoice date of creation
  dt_contract_due_date_min:
    description: Minimum due date of contract
  dt_contract_started:
    lineage:
      - datalake_ebdb_contract.contract.dt_started
    description: Contract starting date
  dt_contract_annulled:
    lineage:
      - datalake_ebdb_contract.contract.dt_termination
    description: Contract annulled date
  dt_invoice_due:
    lineage:
      - datalake_retsuko.invoice.ts_due
    description: Invoice due date
  dt_invoice_due_adjust:
    lineage:
      - datalake_quintoandar.aux_date.week_day
      - datalake_quintoandar.aux_date.is_brz_holiday
      - datalake_retsuko.invoice.ts_due
    description: Invoice due date adjust for next business day
  dt_invoice_paid:
    lineage:
      - datalake_retsuko.invoice.ts_paid
    description: Invoice paid date
  dt_month_start:
    lineage:
      - datalake_quintoandar.aux_date.month_start
    description: The first day of the month of reference date
  dt_month_end:
    lineage:
      - datalake_quintoandar.aux_date.month_end
    description: The last day of the month of reference date
  dt_week_start:
    lineage:
      - datalake_quintoandar.aux_date.week_start
    description: The date the week starts based of the reference date
  dt_week_end:
    lineage:
      - datalake_quintoandar.aux_date.week_end
    description: The date the week ends based of the reference date
  dt_reference:
    lineage:
      - datalake_quintoandar.aux_date.date
    description: Invoice timeline reference date
