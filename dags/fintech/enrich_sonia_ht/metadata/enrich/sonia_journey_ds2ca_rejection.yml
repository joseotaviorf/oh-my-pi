database_name: datalake_sonia_ht
table_name: sonia_journey_ds2ca_rejection
description: |
  This table holds the latest group assignment (Control/Test) for the DS2CA
  rejection experiment per user from the HighTouch audit journey.
  One row per user is kept, preferring Test over Control when both exist.
domain: For Rent
owner: isabella.santos@quintoandar.com.br
columns:
  id_row_instance:
    lineage:
      - hightouch_planner.journey_log_83b9e284127644299f5b4fe9c292e826.row_instance_id
    description: "Unique identifier of the journey instance"
  id_row:
    lineage:
      - hightouch_planner.journey_log_83b9e284127644299f5b4fe9c292e826.row_id
    description: "Primary key reference from HighTouch journey logs."
  id_user:
    lineage:
      - hightouch_audit.sync_changelog.fields.id_user
      - hightouch_planner.journey_log_83b9e284127644299f5b4fe9c292e826.row_id
    description: "User identifier, from fields JSON or fallback to row_id."
  id_proposal:
    lineage:
      - hightouch_audit.sync_changelog.fields.id_proposal_931d6c
    description: "Proposal identifier from audit journey fields."
  rejection_reason:
    lineage:
      - hightouch_audit.sync_changelog.fields.party_rejection_reasons_80ff5f
    description: "Rejection reason from audit journey fields."
  timestamp:
    lineage:
      - hightouch_planner.journey_log_83b9e284127644299f5b4fe9c292e826.timestamp
    description: "Timestamp of the journey transition."
  started_at:
    lineage:
      - hightouch_audit.sync_runs.started_at
    description: "When the HighTouch sync run started for this journey instance."
  finished_at:
    lineage:
      - hightouch_audit.sync_runs.finished_at
    description: "When the HighTouch sync run finished for this journey instance."
  id_sync:
    lineage:
      - hightouch_audit.sync_changelog.sync_id
    description: "Identifier of the HighTouch sync definition."
  id_sync_run:
    lineage:
      - hightouch_audit.sync_changelog.sync_run_id
    description: "Identifier of the specific HighTouch sync run."
  group_name:
    lineage:
      - hightouch_planner.journey_metadata_83b9e284127644299f5b4fe9c292e826.node_name
    description: "Audit experiment group: Control or Test."
    categories:
      "Control": user in AUDIT CONTROL
      "Test": user in AUDIT EXPERIMENT
