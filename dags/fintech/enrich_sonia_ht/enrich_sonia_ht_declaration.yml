---
dag:
  name: enrich_sonia_ht
  schedule_start_date: 2025, 9, 30
  owner: Data Fintech
  documentation:
    dag_purpose: |
      This DAG creates the enriched tables for the HighTouch data source.
      It runs once a day to keep the dataset up to date for downstream processes.
workflow:
  type: query_delta
  layer: enrich
cluster:
  type: databricks_16_4_min_memory_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: "quintoandar_{{ var.value.environment }}"
