---
dag:
  name: enrich_sonia_ht
  owner: Data Fintech
  schedule_interval: "30 11,20 * * *"
  documentation:
    dag_purpose: |
      This DAG creates the enriched tables for the HighTouch data source.
      It runs twice a day to keep the dataset up to date for downstream processes.
workflow:
  type: query_delta
  layer: enrich
  inner_dependencies:
    sonia_journey_user_group:
      - sonia_journey_log
cluster:
  type: databricks_16_4_min_memory_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: "quintoandar_{{ var.value.environment }}"
