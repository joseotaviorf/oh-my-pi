---
database_name: datalake_accounting_funnel
table_name: accounts_payable
owner: guilherme.sacramento@quintoandar.com.br
domain: Fintech
description: "Table containing accounts payable data"
columns:
  id_entry:
    description: "Invoice entry (credit or debit) registered in an invoice. Default value: NULL"
  id_invoice:
    description: "Invoice registered in SeuBarriga. Default value: NULL"
  sk_invoice_reversed_entry:
    description: "When an entry is created to cancel another entry, this field is filled with the Id of the canceled one. Default value: NULL"
  sk_contract:
    lineage:
      - datalake_payable_accounts_transactions_clean.accounts_payable.supplier_description
    description: "Contract related to an invoice"
  version:
    lineage:
      - dw_rent.dim_contract.version
    description: Financial attribute representing version on the accounts_payable dataset.
  accounting_version:
    description: "Not visible on CAP, it's used to match the number of columns in Invoice_all table"
  is_contract_b2b:
    lineage:
      - dw_rent.dim_contract.version
    description: "Flag indicating if the contract is shared with partners"
  locale:
    lineage:
      - dw_public.dim_region.city_name
    description: City name recorded on the accounts_payable dataset.
  localidade:
    lineage:
      - datalake_gsheets_clean.cod_locale.id_locale
    description: City ID recorded on the accounts_payable dataset.
  guarantee:
    lineage:
      - dw_rent.dim_contract.guarantee
    description: "Type/Insurer hired"
  rental_administrator:
    lineage:
      - dw_rent.dim_contract.rental_administrator
    description: "Type of administration of the property"
  is_rental_paid_in_advance:
    lineage:
      - dw_payment.dim_invoice_entry.is_rental_paid_in_advance
    description: "Some versions of contracts have variation in the payment method (aka mora/paga, paga/mora)"
  bill_item:
    description: "Bill item. Default value: cap"
  description:
    lineage:
      - datalake_vans_clean.payment.company_use
    description: "Description based on payment reason classification of bill item CAP"
  has_negotiation:
    description: "Indicates whether the invoice has an agreement or not (value 0). Default value: 0"
  has_installments:
    description: "Indicates whether the invoice has more then 1 installment or not (value 0). Default value: 0"
  purpose:
    description: "Invoice frequency type to be sent. Default value: monthly"
  invoice_account_type:
    description: "Description of invoice account type. Default value: NULL"
  from_account_type:
    description: "From account type in the invoice entry. Default value: quinto-andar"
  to_account_type:
    description: "To account type in the invoice entry . Default value: supplier"
  account_type:
    description: "The account type. Default value: supplier"
  account_classification:
    description: "Indicates the account classification based on bill item. Default value: payable"
  status:
    description: "Description of payment status. Default value: paid"
  closing_mode:
    description: "Description that shows if closing is automatic or manual. Default value: cap"
  due_amount:
    lineage:
      - datalake_payable_accounts_transactions_clean.accounts_payable.paid_amount
    description: "Invoice entry due value, considering debit or credit related to the contract cash flow"
  invoice_due_amount:
    lineage:
      - datalake_payable_accounts_transactions_clean.accounts_payable.paid_amount
    description: "Invoice due value, considering debit or credit related to the contract cash flow"
  accrual_year_month:
    lineage:
      - datalake_payable_accounts_transactions_clean.accounts_payable.accrual_year_month
    description: "Expense reference month"
  entry_accrual_year_month:
    lineage:
      - datalake_payable_accounts_transactions_clean.accounts_payable.accrual_year_month
    description: "Entry expense reference month"
  entry_creation_accrual_year_month:
    lineage:
      - datalake_payable_accounts_transactions_clean.accounts_payable.accrual_year_month
    description: "Entry creation expense reference month"
  entry_created_date:
    lineage:
      - datalake_payable_accounts_transactions_clean.accounts_payable.dt_paid
    description: Financial attribute representing entry created date on the accounts_payable dataset.
  invoice_created_date:
    description: Financial attribute representing invoice created date on the accounts_payable dataset.
  invoice_due_date:
    description: Financial attribute representing invoice due date on the accounts_payable dataset.
  invoice_paid_date:
    description: Financial attribute representing invoice paid date on the accounts_payable dataset.
  invoice_paid_date_next_business_day:
    description: "First business day after the invoice payment"
  invoice_canceled_date:
    description: Financial attribute representing invoice canceled date on the accounts_payable dataset.
  contract_start:
    lineage:
      - dw_rent.dim_contract.dt_start
    description: "Begining of contract date"
  contract_annulment:
    lineage:
      - dw_rent.dim_contract.dt_annulment
    description: "Annulment of contract date"
  ended_before_started:
    description: "If the contract annulment happened before the start"
    lineage:
      - dw_rent.dim_contract.dt_start
      - dw_rent.dim_contract.dt_annulment
  pp_pays:
    description: "Flag indicating PP pays. Default value: FALSE"
  entry_sort_ascend:
    description: "Sorting column for entries ordering by ascending. Default value: NULL"
  entry_by_accrual_sort_ascend:
    description: "Sorting column for entries by accrual ordering by ascending. Default value: NULL"
  is_cap:
    description: "Flag indicating if the register is cap. Default value: TRUE"
  ts_load:
    description: "Timestamp when the data was loaded"
