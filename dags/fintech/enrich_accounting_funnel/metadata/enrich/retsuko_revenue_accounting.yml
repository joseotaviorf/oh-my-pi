---
database_name: datalake_accounting_funnel
table_name: retsuko_revenue_accounting
owner: ae-finance-fintech@quintoandar.com.br
domain: Fintech
description: "This table brings retsuko side revenue (property damage fine, rental anticipation fee, fine and interest) that suppose to create an accounting entry in SAP's and check if it was created"
columns:
  id_retsuko_revenue_accounting:
    lineage:
      - datalake_retsuko.invoice_info.id_external
    description: "JE is from Journal Entry + ID external from Retsuko's Entry/Invoice (Invoice if Fine-and-Interest) + 1 is a virtual ID to identify Seu Barriga + ID to identify revenue line"
  id_business_entity:
    lineage:
      - datalake_retsuko_clean.contract.id
    description: "ID to identify contract. It's de the external one in Main Database"
  id_finance_entity:
    lineage:
      - datalake_retsuko.invoice_info.id_external
    description: "External ID from Retusko's Invoice Table"
  id_finance_entity_entry:
    lineage:
      - datalake_retsuko.entry.id_external
    description: "External ID from Retusko's Entry Table"
  version:
    lineage:
      - datalake_retsuko_clean.sap_entity.version
    description: "Accounting Version"
  source_name:
    description: "Product's name that is responsible to send Invoice's information"
  revenue_name:
    description: "What kind of revenue it refers to"
  accrual_year_month:
    lineage:
      - datalake_retsuko.invoice.accrual_year_month
    description: "Accrual year month from Retsuko's invoice"
  status:
    lineage:
      - datalake_accounting_funnel.ledger.hash
      - datalake_sap_gateway_clean.id_feature
    description: "Indicates, if broken, which source had failed: SG - SAP Gateway, SB - Seu Barriga"
  source_amount:
    lineage:
      - datalake_retsuko.invoice.amount
    description: "Invoiceable amount from the revenue line"
  sap_amount:
    lineage:
      - datalake_accounting_funnel.ledger.debit_credit
    description: "Amount that was credited in the respective revenue account"
  account_number:
    lineage:
      - datalake_accounting_funnel.ledger.account_number
    description: "Account Number from SAP"
  is_completeness_compliance:
    lineage:
      - datalake_accounting_funnel.ledger.hash
      - datalake_sap_gateway_clean.id_feature
    description: "Indicates if the funnel is complete: same ID throught all products until arrive in SAP"
  is_correctness_compliance:
    lineage:
      - datalake_accounting_funnel.ledger.debit_credit
      - datalake_retsuko.invoice.amount
      - datalake_retsuko.entry.amount
    description: "Boolean that indicated if the correct amount from Retsuko's valid invoice, arrived in the correct destination in SAP"
  is_temporality_compliance:
    lineage:
      - datalake_accounting_funnel.ledger.dt_created
      - datalake_retsuko.invoice.ts_paid
      - datalake_retsuko.invoice.ts_created
  is_compliance:
    lineage:
      - datalake_accounting_funnel.ledger.dt_created
      - datalake_retsuko.invoice.ts_created
      - datalake_retsuko.invoice.ts_paid
      - datalake_accounting_funnel.ledger.debit_credit
      - datalake_retsuko.invoice.amount
      - datalake_retsuko.entry.amount
      - datalake_accounting_funnel.ledger.hash
      - datalake_sap_gateway_clean.id_feature
  dt_source_trigger:
    lineage:
      - datalake_retsuko.invoice.ts_created
    description: "Date that the invoice was created in Retusko"
  dt_sap_created:
    lineage:
      - datalake_accounting_funnel.ledger.dt_created
    description: "Date that the entry was created in SAP. If more than one entry, it's considered the most recent date"
  dt_sap_reference:
    lineage:
      - datalake_accounting_funnel.ledger.dt_reference
    description: "Date that the entry was referenced in SAP. If more than one entry, it's considered the most recent date"
