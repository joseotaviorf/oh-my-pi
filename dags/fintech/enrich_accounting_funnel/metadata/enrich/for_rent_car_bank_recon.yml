---
database_name: datalake_accounting_funnel
table_name: for_rent_car_bank_recon
owner: ae-finance-fintech@quintoandar.com.br
domain: Fintech
description: "This model was created to do For Rent accounts receivable bank recon"
columns:
  id_company_use:
    lineage:
      - datalake_nexxera.cnab_charges.document_number
      - datalake_checkout_clean.boleto.your_number
      - datalake_vans_clean.boleto.company_use
      - datalake_vans_clean.boleto.document_number
      - datalake_pas.ledger.id_external_payment
    description: "Unique code to identify bank payments"
  bank_amount:
    lineage:
      - datalake_nexxera.cnab_charges.net_amount
    description: "Paid_amount from Bank"
  retsuko_amount:
    lineage:
      - datalake_retsuko.invoice.paid_amount
    description: "Paid amount from Retsuko"
  vans_checkout_amount:
    lineage:
      - datalake_vans_clean.boleto.paid_amount
      - datalake_checkout_clean.boleto.paid_amount
    description: "Paid amount from Vans and Checkout"
  sap_amount:
    lineage:
      - datalake_pas.ledger.debit_credit
    description: "Paid amount from SAP - Ledger"
  status_bank:
    description: "If TRUE, Bank is recorded"
  status_vans_checkout:
    description: "If TRUE, Bank is matching in company_use, paid_amount and dt_paid"
  status_retsuko:
    description: "If TRUE, Retsuko is matching in company_use, paid_amount and dt_paid"
  status_sap:
    description: "If TRUE, SAP is matching in company_use, paid_amount and dt_paid"
  is_reconciled:
    description: "If TRUE, Bank, Retsuko, Vans/Checkout and SAP are matching in company_use, paid_amount and dt_paid"
  dt_bank_paid:
    lineage:
      - datalake_nexxera.cnab_charges.dt_paid
    description: "Paid date from Bank"
  dt_retsuko_paid:
    lineage:
      - dw_public.dim_date.next_brz_fintech_business_day
    description: "Paid date from Retsuko"
  dt_vans_checkout_paid:
    lineage:
      - datalake_checkout_clean.boleto.ts_paid
      - datalake_vans_clean.boleto.dt_paid
    description: "Paid date from Vans and Checkout"
  dt_sap_paid:
    lineage:
      - datalake_pas.ledger.dt_tax
    description: "Paid date from SAP/Ledger - TaxDate"
