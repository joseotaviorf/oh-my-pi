---
database_name: datalake_accounting_funnel
table_name: invoice_all
owner: guilherme.sacramento@quintoandar.com.br
domain: Fintech
description: "Enriched invoice and entry data for the accounting funnel, sourced from DW payment and Retsuko (Seu Barriga replica)"
columns:
  id_entry:
    lineage:
      - dw_payment.fact_invoice_entries.sk_invoice_entry
    description: "Invoice entry (credit or debit) registered in an invoice"
  sk_invoice_reversed_entry:
    lineage:
      - dw_payment.dim_invoice_entry.sk_invoice_reversed_entry
    description: "When an entry is created to cancel another entry, this field is filled with the Id of the canceled one"
  id_invoice:
    lineage:
      - dw_payment.fact_invoice_entries.sk_invoice
    description: "Invoice identifier from Seu Barriga (Retsuko replica)"
  sk_contract:
    lineage:
      - dw_payment.fact_invoice_entries.sk_contract
    description: "Contract related to an invoice"
  accounting_transaction_identifier:
    lineage:
      - dw_payment.dim_invoice_entry.accounting_transaction_identifier
    description: "Transactional entries are created in pairs (on the IQ and PP invoice). This hash can identify this pair."
  version:
    lineage:
      - dw_rent.dim_contract.version
    description: Contract version active when the invoice was issued.
  accounting_version:
    lineage:
      - datalake_retsuko.entry.accounting_version
    description: "Information about sync with ERP Gateway"
  ended_before_started:
    description: "If the contract annulment happened before the start"
    lineage:
      - dw_rent.dim_contract.dt_start
      - datalake_ebdb_clean.contract.dt_termination
  is_contract_b2b:
    lineage:
      - dw_rent.dim_contract.is_contract_b2b
    description: "Flag indicating if the contract is shared with partners"
  locale:
    lineage:
      - dw_public.dim_region.city_name
    description: "Name from the City"
  localidade:
    lineage:
      - datalake_gsheets_clean.cod_locale.id_locale
    description: "ID from the City"
  guarantee:
    lineage:
      - dw_rent.dim_contract.guarantee
    description: "Type/Insurer hired"
  rental_administrator:
    lineage:
      - dw_rent.dim_contract.rental_administrator
    description: "Type of administration of the property"
  contract_status:
    lineage:
      - dw_rent.dim_contract.status
    description: "Contract status description"
  is_rental_paid_in_advance:
    lineage:
      - dw_payment.dim_invoice_entry.is_rental_paid_in_advance
    description: "Some versions of contracts have variation in the payment method (aka mora/paga, paga/mora)"
  is_reversed:
    description: "Flag that indicates if a entry was create to reverse (cancel) another entry or if that entry was reversed by another entry"
    lineage:
      - datalake_retsuko.entry
  is_not_invoiceable_inconsiderable:
    description: "Flag that indicates, if true, that a entry is a not-invoiceable/reversed insconsiderable"
    lineage:
      - datalake_retsuko.entry
  is_write_off:
    lineage:
      - dw_payment.dim_invoice_entry.is_write_off
    description: "Flag that indicates if an invoice was written off"
  bill_item:
    lineage:
      - dw_payment.dim_invoice_entry.entry_type
    description: Bill item type code for the invoice entry (e.g. rent, brokerage, condo).
  description:
    lineage:
      - dw_payment.dim_invoice_entry.description
    description: "Invoice entry title as shown in invoice"
  has_negotiation:
    lineage:
      - dw_payment.dim_invoice_entry.description
    description: "Indicates whether the invoice has an agreement (value 1) or not (value 0)"
  has_installments:
    lineage:
      - dw_payment.dim_invoice_entry.description
    description: "Indicates whether the invoice has more then 1 installment (value 1) or not (value 0)"
  purpose:
    lineage:
      - dw_payment.dim_invoice.frequency
    description: "Invoice frequency type to be sent, such as monthly, extra or pos"
  invoice_account_type:
    lineage:
      - dw_payment.dim_invoice.user
    description: "Description of invoice account type"
  from_account_type:
    lineage:
      - dw_payment.dim_invoice_entry.from_account_type
    description: "From account type in the invoice entry (contract or stakeholder)"
  to_account_type:
    lineage:
      - dw_payment.dim_invoice_entry.to_account_type
    description: "To account type in the invoice entry  (contract or stakeholder)"
  producer:
    lineage:
      - dw_payment.dim_invoice_entry.producer
    description: "Rotine that produces the entry"
  account_type:
    lineage:
      - dw_payment.dim_invoice_entry.from_account_type
      - dw_payment.dim_invoice_entry.to_account_type
    description: "The account type: landlord, tenant or other."
  account_classification:
    lineage:
      - dw_payment.dim_invoice_entry.entry_type
      - dw_payment.dim_invoice_entry.from_account_type
      - dw_payment.dim_invoice_entry.to_account_type
      - dw_payment.dim_invoice.payment_status
      - dw_payment.dim_invoice.due_amount
    description: "Indicates the account classification based on bill item:  receivable or payable."
  status:
    description: "Description of payment status"
    lineage:
      - dw_payment.fact_invoice_entries.sk_invoice
      - dw_payment.dim_invoice.payment_status
  payment_status:
    description: "Invoice payment process status from Retsuko (distinct from invoice status); e.g. chargeback vs. canceled"
    lineage:
      - datalake_retsuko.invoice.payment_status
  reason:
    description: "When invoice purpose is extras, identifies what the invoice is about"
    lineage:
      - datalake_retsuko.invoice.reason
  closing_mode:
    lineage:
      - dw_payment.dim_invoice.closing_mode
    description: "Description that shows if closing is automatic or manual"
  paid_via:
    lineage:
      - dw_payment.dim_invoice.paid_via
    description: "Description of how the invoice was paid"
  type:
    lineage:
      - dw_rent.dim_contract.type
    description: Contract type from dim_contract (e.g. for rent).
  due_amount:
    lineage:
      - dw_payment.fact_invoice_entries.brl_entry_due_amount
    description: "Invoice entry due value, considering debit or credit related to the contract cash flow"
  invoice_due_amount:
    lineage:
      - dw_payment.fact_invoice_entries.due_amount
    description: "Invoice due value, considering debit or credit related to the contract cash flow"
  invoice_paid_amount:
    lineage:
      - dw_payment.fact_invoice_entries.paid_amount
    description: Total amount paid on the invoice.
  accrual_year_month:
    lineage:
      - dw_payment.dim_invoice.accrual_year_month
      - dw_payment.dim_invoice_entry.from_account_type
      - dw_payment.dim_invoice_entry.to_account_type
      - dw_payment.fact_invoice_entries.ts_created
    description: "Expense reference month"
  invoice_accrual_year_month:
    lineage:
      - dw_payment.dim_invoice.accrual_year_month
    description: "Invoice expense reference month"
  entry_accrual_year_month:
    lineage:
      - dw_payment.dim_invoice_entry.accrual_year_month
    description: "Entry expense reference month"
  entry_due_year_month:
    lineage:
      - dw_payment.dim_invoice_entry.due_year_month
    description: Year-month (YYYYMM) from dim_invoice_entry.due_year_month used for entry due scheduling.
  entry_creation_accrual_year_month:
    lineage:
      - dw_payment.dim_invoice_entry.accrual_year_month
    description: "Entry creation expense reference month"
  entry_created_date:
    lineage:
      - dw_public.dim_date.date
    description: Calendar date when the invoice entry was created.
  invoice_created_date:
    lineage:
      - dw_payment.dim_invoice.ts_created
    description: Calendar date when the invoice was created in Seu Barriga.
  invoice_due_date:
    lineage:
      - dw_payment.dim_invoice.dt_due
    description: Due date of the invoice payment.
  invoice_sent_date:
    lineage:
      - dw_payment.dim_invoice.dt_sent
    description: Date when the invoice was sent to the tenant or landlord.
  invoice_paid_date:
    lineage:
      - dw_payment.dim_invoice.dt_paid
    description: Date when the invoice was marked as paid.
  invoice_write_off_date:
    lineage:
      - dw_payment.dim_invoice.dt_write_off
    description: "Date when the invoice was written off"
  invoice_canceled_date:
    lineage:
      - dw_payment.dim_invoice.ts_canceled
    description: Cancellation timestamp from Seu Barriga (ts_canceled) converted to date when the invoice was voided.
  invoice_reversal_date:
    lineage:
      - datalake_retsuko.entry.ts_created
    description: "Date when a entry was reversed (canceled) by another one"
  invoice_paid_date_next_business_day:
    lineage:
      - dw_public.dim_date.date
    description: "First business day after the invoice payment"
  real_invoice_paid_date:
    description: "Real invoice paid date considering payment method (immediate for some methods, next business day for others)"
    lineage:
      - dw_payment.dim_invoice.paid_via
      - dw_payment.dim_invoice.dt_paid
      - dw_public.dim_date.date
  contract_start:
    lineage:
      - dw_rent.dim_contract.dt_start
    description: "Begining of contract date"
  contract_annulment:
    lineage:
      - datalake_ebdb_clean.contract.dt_termination
    description: "Annulment of contract date"
  ts_load:
    description: "Timestamp when the data was loaded"
