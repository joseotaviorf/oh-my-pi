---
database_name: datalake_accounting_funnel
table_name: for_rent_contract_brokerage
owner: guilherme.sacramento@quintoandar.com.br
domain: Fintech
description: "This table calculates brokerage by type to all For Rent's contracts"
columns:
  id_contract:
    lineage:
      - datalake_ebdb_clean.contract.id
    description: Rental or sale contract identifier linking this financial record to the lease agreement.
  rental_administrator:
    lineage:
      - datalake_ebdb_clean.contract.contract_rent_model
    description: "Rental administrator type extracted from contract_rent_model.rentalAdministrator."
  rent:
    lineage:
      - datalake_ebdb_clean.contract_aud.rent
    description: "Indicates the first rent amount - used to calculate brokerage"
  first_rent_commission_fee:
    lineage:
      - datalake_ebdb_clean.contract.fist_rent_comission_fee
    description: "First rent percentage from brokerage. Not all contracts are 100 perc"
  5A_brokerage_share:
    description: "Indicates 5A brokerage split share in percentage"
  agent_brokerage_share:
    lineage:
      - datalake_big_agent.brokerage_share_history.agent_brokerage_share
    description: |
     Agent brokerage split share at first brokerage invoice date, from brokerage_share_history
     point-in-time (revision on or before invoice date).
  ciq_brokerage_share:
    lineage:
      - datalake_ebdb_clean.contract_partnership_data.brokerage_split_percentage
    description: "Indicates CIQ brokerage split share in percentage"
  select_brokerage_share:
    lineage:
      - datalake_ebdb_clean.contract_partnership_data.brokerage_split_percentage
    description: "Indicates SELECT brokerage split share in percentage"
  3p_brokerage_share:
    description: "Indicates 3P brokerage split share in percentage. At the moment it was created, it was always 50 perc of the rent"
  5A_brokerage_amount:
    lineage:
      - datalake_ebdb_clean.contract_aud.rent
      - datalake_ebdb_clean.contract.fist_rent_comission_fee
    description: "Indicates 5A brokerage split share in percentage in amount of cash"
  agent_brokerage_amount:
    lineage:
      - datalake_big_agent.brokerage_share_history.agent_brokerage_share
      - datalake_ebdb_clean.contract_aud.rent
    description: "Agent brokerage amount derived from first rent and agent_brokerage_share at signature."
  ciq_brokerage_amount:
    lineage:
      - datalake_ebdb_clean.contract_partnership_data.brokerage_split_percentage
      - datalake_ebdb_clean.contract_aud.rent
      - datalake_ebdb_clean.contract.fist_rent_comission_fee
    description: "Indicates CIQ brokerage split share in percentage in amount of cash"
  select_brokerage_amount:
    lineage:
      - datalake_ebdb_clean.contract_partnership_data.brokerage_split_percentage
      - datalake_ebdb_clean.contract_aud.rent
      - datalake_ebdb_clean.contract.fist_rent_comission_fee
    description: "Indicates SELECT brokerage split share in percentage in amount of cash"
  3p_brokerage_amount:
    lineage:
      - datalake_ebdb_clean.contract_aud.rent
      - datalake_ebdb_clean.contract.fist_rent_comission_fee
    description: "Indicates 3P brokerage split share in percentage in amount of cash"
  dt_contract_started:
    lineage:
      - datalake_ebdb_clean.contract.dt_started
    description: "Indicates when the contract started"
  dt_contract_annulment:
    lineage:
      - datalake_ebdb_clean.contract.dt_termination
    description: "Contract termination date used for annulment brokerage adjustments."