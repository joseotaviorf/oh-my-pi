cluster:
  type: emr_7_12_consolidation_xl_general_fleet_cluster
  custom_configurations:
    spark_conf:
      spark.driver.maxResultSize: "0"
      spark.driver.memory: "24g"
      spark.driver.memoryOverhead: "4g"
      # load-enrich-accounts-payable: 256MB advisory coalesced the union stage
      # to 12 tasks on a ~256 vCPU fleet, so one partition owned the step for
      # 30+ min. Same fix as enrich_payments_platform.
      spark.sql.adaptive.advisoryPartitionSizeInBytes: "33554432"
      spark.sql.shuffle.partitions: "800"
      spark.speculation: "true"
      spark.speculation.multiplier: "3"
      spark.speculation.quantile: "0.75"
    autotermination_minutes: 20
    core_nodes:
      target_on_demand: 4
      target_spot: 0
    task_nodes:
      target_on_demand: 0
      target_spot: 4
      allocation_strategy: price-capacity-optimized
      bid_price_percentage: 100
