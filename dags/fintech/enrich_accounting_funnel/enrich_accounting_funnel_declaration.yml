---
dag:
  name: enrich_accounting_funnel
  schedule_start_date: 2020, 7, 1
  owner: Data Fintech
workflow:
  type: query_delta
  layer: enrich
  inner_dependencies:
    for_rent_brokerage_transfer:
      - invoice_all
      - for_rent_contract_brokerage
    monopoly_invoice_issuance:
      - ledger
    cap_union_invoice:
      - accounts_payable_partitioned
      - invoice_all
cluster:
  type: custom_cluster
  databricks_conn_id: databricks_new_env
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    driver_node_type_id: m5d.8xlarge
    node_type_id: m5d.4xlarge
    num_workers: 4
    spark_version: 16.4.x-scala2.12
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: "quintoandar_{{ var.value.environment }}"
