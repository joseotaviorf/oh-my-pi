database_name: datalake_velo
table_name: house_legacy
owner: guilherme.sacramento@quintoandar.com.br
domain: Fintech
description:
  QuintoCred is the name given to Velo after its acquisition by QuintoAndar in 2021. As of 2023, the Velo brand was replaced by QuintoCred.
  In June 2025, QuintoCred's core operations were shut down, leaving only the debt collection services active. In the first quarter of 2026, the decision was made to terminate the collection operations by July 31, 2026.
  Therefore, it is important to understand that all Velo and QuintoCred systems are considered legacy, and consequently, the involved tables are as well.
  Table with House realted to the contract details (2.0 only)
columns:
  id_house:
    description: "House identification number (ID)"
    lineage:
      - datalake_rental_guarantee_platform_clean.fiancavelo_property_legacy.id
  type:
    description: "Property type description"
  street:
    description: Property address street
    lineage:
      - datalake_rental_guarantee_platform_clean.fiancavelo_property_legacy.street
  number:
    description: Property address number
    lineage:
      - datalake_rental_guarantee_platform_clean.fiancavelo_property_legacy.number
  complement:
    description: Property address complement
    lineage:
      - datalake_rental_guarantee_platform_clean.fiancavelo_property_legacy.complement
  neighborhood:
    description: Property address neighborhood
    lineage:
      - datalake_rental_guarantee_platform_clean.fiancavelo_property_legacy.neighborhood
  city:
    description: "City where the property is located"
    lineage:
      - datalake_rental_guarantee_platform_clean.fiancavelo_property_legacy.city
  state:
    description: "State where the property is located"
    lineage:
      - datalake_ebdb_clean.state.abbreviation
