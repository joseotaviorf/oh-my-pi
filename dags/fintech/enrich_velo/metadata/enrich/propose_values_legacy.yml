database_name: datalake_velo
table_name: propose_values_legacy
owner: guilherme.sacramento@quintoandar.com.br
domain: Fintech
description:
  QuintoCred is the name given to Velo after its acquisition by QuintoAndar in 2021. As of 2023, the Velo brand was replaced by QuintoCred.
  In June 2025, QuintoCred's core operations were shut down, leaving only the debt collection services active. In the first quarter of 2026, the decision was made to terminate the collection operations by July 31, 2026.
  Therefore, it is important to understand that all Velo and QuintoCred systems are considered legacy, and consequently, the involved tables are as well.
  Table containing Velo's proposes detailed info (only 2.0 not migrated proposes)
columns:
  id_propose_values:
    description: ProposeValues's identification number (ID)
    lineage:
      - datalake_rental_guarantee_platform_clean.fiancavelo_propose_legacy.id
      - datalake_rental_guarantee_platform_clean.company_plan.id
      - datalake_rental_guarantee_platform_clean.plan.id
  subscription_type:
    description: Category type of the subscription. Usually monthly or annual
  plan_type:
    description: Propose's plan type. Usually Business or Residential.
    lineage:
      - datalake_rental_guarantee_platform_clean.business_type.name
  activator_type:
    description: Propose's activator type name. This may not exist in QuintoCred.
    lineage:
    description: Category type of the amount paid to activate the guarantee
  plan:
    description: Propose's plan name.
    lineage:
      - datalake_rental_guarantee_platform_clean.plan.plan_name
  activator_amount:
    description: Propose's value paid to activate the contract. This marks the start of the propose as a contract.
    lineage:
      - datalake_rental_guarantee_platform_clean.fiancavelo_propose_legacy.activator_value
  subscription_installments:
    description: Number of installments on the subscription
  activator_amount:
    description: Amount paid to activate the guarantee
  monthly_guarantee:
    description: Monthly total amount of the guarantee
  annual_guarantee:
    description: Annual total amount of the guarantee
  rent_amount:
    description: Velo platform attribute describing rent amount for condominium billing reconciliation.
  condo_amount:
    description: Velo platform attribute describing condo amount for condominium billing reconciliation.
  light_amount:
    description: Velo platform attribute describing light amount for condominium billing reconciliation.
  water_amount:
    description: Velo platform attribute describing water amount for condominium billing reconciliation.
  phone_amount:
    description: Velo platform attribute describing phone amount for condominium billing reconciliation.
  iptu_amount:
    description: Velo platform attribute describing iptu amount for condominium billing reconciliation.
  other_amount:
    description: Velo platform attribute describing other amount for condominium billing reconciliation.
  total_package_amount:
    description: Velo platform attribute describing total package amount for condominium billing reconciliation.
  plan_percent:
    description: Percentage of the plan in comparison to the package
    lineage:
      - datalake_rental_guarantee_platform_clean.plan.pricing
  plan_coverage:
    description: Velo platform attribute describing plan coverage for condominium billing reconciliation.
    lineage:
      - datalake_rental_guarantee_platform_clean.plan.coverage
  plan_damage:
    description: Velo platform attribute describing plan damage for condominium billing reconciliation.
    lineage:
      - datalake_rental_guarantee_platform_clean.plan.damage
  plan_commission:
    description: Velo platform attribute describing plan commission for condominium billing reconciliation.
    lineage:
      - datalake_rental_guarantee_platform_clean.plan.comission
  is_legacy:
    description: If the propose comes from Velo 2.0 systems (TRUE = 2.0, FALSE = QuintoCred;3.0)
