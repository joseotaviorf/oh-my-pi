database_name: datalake_velo
table_name: propose_values_legacy
owner: ae-finance-fintech@quintoandar.com.br
domain: Fintech
description: "Table containing Velo's proposes detailed info (only 2.0 not migrated proposes)"
columns:
  id_propose_values:
    description: ProposeValues's identification number (ID)
    lineage:
      - datalake_rental_guarantee_platform_clean.fiancavelo_propose_legacy.id
      - datalake_rental_guarantee_platform_clean.company_plan.id
      - datalake_rental_guarantee_platform_clean.plan.id
  subscription_type:
    description: Category type of the subscription. Usually monthly or annual
  plan_type:
    description: Propose's plan type. Usually Business or Residential.
    lineage:
      - datalake_rental_guarantee_platform_clean.business_type.name
  activator_type:
    description: Propose's activator type name. This may not exist in QuintoCred.
    lineage:
    description: Category type of the amount paid to activate the guarantee
  plan:
    description: Propose's plan name.
    lineage:
      - datalake_rental_guarantee_platform_clean.plan.plan_name
  activator_amount:
    description: Propose's value paid to activate the contract. This marks the start of the propose as a contract.
    lineage:
      - datalake_rental_guarantee_platform_clean.fiancavelo_propose_legacy.activator_value
  subscription_installments:
    description: Number of installments on the subscription
  activator_amount:
    description: Amount paid to activate the guarantee
  monthly_guarantee:
    description: Monthly total amount of the guarantee
  annual_guarantee:
    description: Annual total amount of the guarantee
  rent_amount:
    description: Rent amount
  condo_amount:
    description: Condo amount
  light_amount:
    description: Light amount
  water_amount:
    description: Water amount
  phone_amount:
    description: Phone amount
  iptu_amount:
    description: IPTU amount
  other_amount:
    description: Other amount
  total_package_amount:
    description: Total package amount
  plan_percent:
    description: Percentage of the plan in comparison to the package
    lineage:
      - datalake_rental_guarantee_platform_clean.plan.pricing
  plan_coverage:
    description: Propose plan coverage.
    lineage:
      - datalake_rental_guarantee_platform_clean.plan.coverage
  plan_damage:
    description: Propose plan damage.
    lineage:
      - datalake_rental_guarantee_platform_clean.plan.damage
  plan_commission:
    description: Propose plan comission.
    lineage:
      - datalake_rental_guarantee_platform_clean.plan.comission
  is_legacy:
    description: If the propose comes from Velo 2.0 systems (TRUE = 2.0, FALSE = QuintoCred;3.0)
