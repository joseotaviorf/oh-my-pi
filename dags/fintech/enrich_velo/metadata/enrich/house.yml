database_name: datalake_velo
table_name: house
owner: guilherme.sacramento@quintoandar.com.br
domain: Fintech
description: >-
  QuintoCred is the name given to Velo after its acquisition by QuintoAndar in 2021.
  As of 2023, the Velo brand was replaced by QuintoCred. Find out more at:
  https://docs.google.com/document/d/1n0kpXiUlM3rJDcwcPm7gfCT-rXo7WVDDvSBxdPPn3cc/edit?tab=t.0#heading=h.ysolfio837u9
  In June 2025, QuintoCred's core operations were shut down, leaving only the
  debt collection services active. In the first quarter of 2026, the decision was
  made to terminate the collection operations by July 31, 2026. Therefore, it is
  important to understand that all Velo and QuintoCred systems are considered legacy,
  and consequently, the involved tables are as well. Table with House realted to
  the contract details
columns:
  id_house:
    description: House identification number (ID)
    lineage:
      - datalake_rental_guarantee_platform_clean.property_propose.id
  type:
    description: Property type description
    lineage:
      - datalake_rental_guarantee_platform_clean.property_type.name
  street:
    description: Property address street
    lineage:
      - datalake_rental_guarantee_platform_clean.address.street
  number:
    description: Property address number
    lineage:
      - datalake_rental_guarantee_platform_clean.address.number
  complement:
    description: Property address complement
    lineage:
      - datalake_rental_guarantee_platform_clean.address.complement
  neighborhood:
    description: Property address neighborhood
    lineage:
      - datalake_rental_guarantee_platform_clean.address.neighborhood
  city:
    description: City where the property is located
    lineage:
      - datalake_rental_guarantee_platform_clean.address.city
  state:
    description: State where the property is located
    lineage:
      - core_region.region.state_abbreviation
      - datalake_rental_guarantee_platform_clean.address.state
  country_code:
    description: Country Code where the property is located
    lineage:
      - core_region.region.country_code
  zipcode:
    description: Postal code (ZIP) of the property address.
    lineage:
      - datalake_rental_guarantee_platform_clean.address.zip_code
  is_legacy:
    description: If the propose's comes from Velo 2.0 systems (TRUE = 2.0, FALSE = QuintoCred;3.0)
