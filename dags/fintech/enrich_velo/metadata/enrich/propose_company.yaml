---
database_name: datalake_velo
table_name: propose_company
description: Dimension with details of the company that signed the contract (existance optional)
domain: Fintech
owner: ae-fintech@quintoandar.com.br
columns:
  id_company:
    description: Company's identification number (ID) when the propose is for a business
    lineage:
      - datalake_rental_guarantee_platform_clean.tenant_company.id
  company_name:
    description: Company's name when the propose is for a business
    lineage:
      - datalake_company_clean.company.trade_name
  street:
    description: Company's street address when the propose is for a business
    lineage:
      - datalake_company_clean.address.public_area
  number:
    description: Company's number address when the propose is for a business
    lineage:
      - datalake_company_clean.address.number
  complement:
    description: Company's complement address when the propose is for a business
    lineage:
      - datalake_company_clean.address.complement
  neighborhood:
    description: Company's neighborhood address when the propose is for a business
    lineage:
      - datalake_company_clean.address.neighborhood
  city:
    description: Company's city when the propose is for a business
    lineage:
      - datalake_company_clean.address.city
  state:
    description: Company's state when the propose is for a business
    lineage:
      - datalake_ebdb_clean.state.abbreviation
      - datalake_company_clean.address.state
  country_code:
    description: Company's country code when the propose is for a business
    lineage:
      - datalake_ebdb_clean.country.code
  zipcode:
    description: Company's zipcode when the propose is for a business
    lineage:
      - datalake_company_clean.address.zip_code
  geolocation:
    description: latitude and longitude - Company's geolocation when the propose is for a business
    lineage:
  cnpj:
    description: Company's document number (CNPJ) when the propose is for a business
    lineage:
      - datalake_company_clean.document.identification_number
  is_legacy:
    description: If the propose's comes from Velo 2.0 systems (TRUE = 2.0, FALSE = QuintoCred;3.0)
  ts_created:
    description: Timestamp that client company register was created
    lineage:
      - datalake_rental_guarantee_platform_clean.tenant_company.ts_created
  ts_updated:
    description: Timestamp that client company register was last updated
    lineage:
      - datalake_rental_guarantee_platform_clean.tenant_company.ts_updated
