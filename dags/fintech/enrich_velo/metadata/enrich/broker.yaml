database_name: datalake_velo
table_name: broker
owner: ae-finance-fintech@quintoandar.com.br
domain: fintech
description: "Table containing brokers companies details"
columns:
  id_broker:
    description: "Broker's identification number (ID)"
    lineage:
      - datalake_velo_clean.fiancavelo_realestate.id
  broker_comercial_name:
    description: "Broker's comercial name"
    lineage:
      - datalake_velo_clean.clientes_company.comercial_name
  broker_name:
    description: "Broker's name"
    lineage:
      - datalake_velo_clean.clientes_company.name
  street:
    description: "Broker's establishment street"
    lineage:
      - datalake_velo_clean.clientes_address.street
  number:
    description: "Broker's establishment address number"
    lineage:
      - datalake_velo_clean.clientes_address.number
  complement:
    description: "Broker's establishment address complement"
    lineage:
      - datalake_velo_clean.clientes_address.complement
  neighborhood:
    description: "Broker's establishment address neighborhood"
    lineage:
      - datalake_velo_clean.clientes_address.neighborhood
  city:
    description: "Broker's establishment city"
    lineage:
      - datalake_velo_clean.clientes_address.city
  state:
    description: "Broker's establishment state"
    lineage:
      - datalake_velo_clean.clientes_address.state
  country_code:
    description: "Broker's establishment country code"
    lineage:
      - datalake_ebdb_clean.country.code
  zipcode:
    description: "Broker's establishment zipcode"
    lineage:
      - datalake_velo_clean.clientes_address.zipcode
  geolocation:
    description: "Broker's establishment geolocation"
    lineage:
      - datalake_velo_clean.clientes_address.geolocation
  creci:
    description: "Broker's certification number (CRECI)"
    lineage:
      - datalake_velo_clean.fiancavelo_realestate.creci
  cnpj:
    description: "Broker's document number (CNPJ)"
    lineage:
      - datalake_velo_clean.clientes_company.document
  is_broker_active:
    description: "Identify if the broker is active in Velo's platform"
    lineage:
      - datalake_velo_clean.fiancavelo_realestate.is_active
  ts_created:
    description: "Moment (timestamp) when the broker was created in Velo's platform"
    lineage:
      - datalake_velo_clean.fiancavelo_realestate.ts_inserted
