---
database_name: datalake_velo
table_name: occurrence
owner: athos.sampayo@quintoandar.com.br
domain: fintech
description: Enriched table responsible for the occurrence context of Velo
columns:
  id_occurrence:
    description: Table's unique ID.
    lineage:
      - datalake_rental_guarantee_platform_clean.delinquency.id
  id_propose:
    description: ID connecting table to propose table.
    lineage:
      - datalake_rental_guarantee_platform_clean.delinquency.id_propose
  id_client:
    description: ID connecting table to propose_person table.
    lineage:
  id_occurrence_type:
    description: ID connecting table to junk table.
    lineage:
      - datalake_velo.junk.id_junk
  id_occurrence_status:
    description: ID connecting table to junk table.
    lineage:
      - datalake_velo.junk.id_junk
  id_unicid:
    description: Business ID for UNICID.
    lineage:
      - datalake_rental_guarantee_platform_clean.delinquency.id_unicid
  ids_accounting_entry:
    description: Array of Business IDs associated for this occurrence in Robin-Hood.
    lineage:
      - datalake_robin_hood.accounting_entry.id
  type:
      description: Describes the category of the delinquency.
      categories:
        SIGNATURE: Related to the signature.
        GUARANTEE: Involves a guarantee.
        TERMINATION: Tied to termination.
        BILLING: Related to billing.
        RENEWAL: Concerns a renewal.
        RENEWAL_MONTH: A monthly renewal.
        ACTIVATION_PARTIAL_LINK: Activation with partial linking.
      lineage:
      - datalake_rental_guarantee_platform_clean.delinquency.type
  status:
      description: Represents the current state of the delinquency.
      categories:
        REGISTERED: The delinquency is recorded.
        RECOVERING: The process of recovering is underway.
        PROGRESS: The delinquency is in progress.
        FINISHED: The process has been completed.
        UNDER_AGREEMENT: There is an agreement in place.
        REQUESTED_AGREEMENT: An agreement is requested but not yet confirmed.
        ACTIVE_FALSE: The delinquency is inactive.
        FORGIVEN: The delinquency has been forgiven.
      lineage:
      - datalake_rental_guarantee_platform_clean.delinquency.status
  description:
    description: Description comments for this occurrence.
    lineage:
      - datalake_rental_guarantee_platform_clean.delinquency.description
  invoice_url:
    description: URL of charged invoice.
    lineage:
      - datalake_rental_guarantee_platform_clean.delinquency.invoice_url
  due_amount:
    description: Amount that is due.
    lineage:
      - datalake_rental_guarantee_platform_clean.delinquency.value
  due_amount_original:
    description: Amount that was originally due.
    lineage:
      - datalake_rental_guarantee_platform_clean.delinquency.original_value
  paid_amount:
    description: Amount that was paid.
    lineage:
      - datalake_rental_guarantee_platform_clean.delinquency.amount_paid
  discount_amount:
    description: Discount amount, obtained by substracting the paid amount from the due amount.
  is_valid:
    description: Boolean flag for when this occurrence is valid to be used on any business process. Usually a visible register but that does not follows a specific business flow yet.
    lineage:
      - datalake_rental_guarantee_platform_clean.delinquency.is_valid
  is_legacy:
    description: If the propose's comes from Velo 2.0 systems (TRUE = 2.0, FALSE = QuintoCred;3.0)
  dt_due:
    description: Date that occurrence is/was due, according to 3.0 rules.
    lineage:
      - datalake_rental_guarantee_platform_clean.delinquency.dt_due
  dt_due_legacy:
    description: Date that occurrence is/was due, according to 2.0 rules.
    lineage:
      - datalake_rental_guarantee_platform_clean.delinquency.dt_due
  dt_bill_month:
    description: Reference month for the bill.
    lineage:
      - datalake_rental_guarantee_platform_clean.delinquency.dt_bill_month
  dt_payment_scheduled:
    description: Date that the payment was scheduled.
    lineage:
      - datalake_rental_guarantee_platform_clean.delinquency.dt_payment_scheduled
  ts_paid:
    description: Timestamp that the occurrence was completed paid.
      - datalake_rental_guarantee_platform_clean.delinquency.dt_paid
  ts_created:
    description: Timestamp that the occurrence was created.
    lineage:
      - datalake_rental_guarantee_platform_clean.delinquency.ts_created
