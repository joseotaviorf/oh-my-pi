---
database_name: datalake_velo
table_name: payment
owner: athos.sampayo@quintoandar.com.br
domain: Fintech
description: Enriched table focused on the Payments context for Velo.
columns:
  id_payment:
    description: Table's unique ID.
    lineage:
      - datalake_rental_guarantee_platform_clean.payment.id
      - datalake_rental_guarantee_platform_clean.agreement_payment.id
  id_propose_values:
    description: ID connecting table to propose_values table.
    lineage:
      - datalake_rental_guarantee_platform_clean.propose.id
      - datalake_rental_guarantee_platform_clean.company_plan.id
      - datalake_rental_guarantee_platform_clean.plan.id
  id_propose:
    description: ID connecting table to propose table.
    lineage:
      - datalake_rental_guarantee_platform_clean.payment.id_propose
      - datalake_rental_guarantee_platform_clean.delinquency.id_propose
  id_occurrence:
    description: ID connecting table to occurrence table.
    lineage:
      - datalake_rental_guarantee_platform_clean.delinquency.id
      - datalake_velo.occurrence.id_occurrence
  id_billing_type:
    description: ID connecting table to junk table.
    lineage:
      - datalake_velo.junk.id_junk
  id_payment_type:
    description: ID connecting table to junk table.
    lineage:
      - datalake_velo.junk.id_junk
  id_status:
    description: ID connecting table to junk table.
    lineage:
      - datalake_velo.junk.id_junk
  id_payment_gateway:
    description: ID connecting table to junk table.
    lineage:
      - datalake_velo.junk.id_junk
  id_payment_category:
    description: ID connecting table to junk table.
    lineage:
      - datalake_velo.junk.id_junk
  id_customer:
    description: Business ID for Customer.
    lineage:
      - datalake_rental_guarantee_platform_clean.payment.customer
  id_unicid:
    description: Business ID for UNICID.
    lineage:
      - datalake_rental_guarantee_platform_clean.payment.unicid
  id_subscription:
    description: Business ID for Subscription.
    lineage:
      - datalake_rental_guarantee_platform_clean.payment.id_subscription
  billing_type:
    description: Billing type description.
    lineage:
      - datalake_rental_guarantee_platform_clean.payment.billing_type
      - datalake_rental_guarantee_platform_clean.agreement_payment.billing_type
  payment_type:
    description: Payment type description.
    lineage:
      - datalake_rental_guarantee_platform_clean.payment.billing_type
  status:
    description: Status description.
    lineage:
      - datalake_rental_guarantee_platform_clean.payment.status
      - datalake_rental_guarantee_platform_clean.agreement_payment.status
  payment_gateway:
    description: Payment gateway description.
    lineage:
      - datalake_rental_guarantee_platform_clean.payment.gateway
  payment_category:
    description: Payment category description.
    lineage:
      - datalake_rental_guarantee_platform_clean.payment.product_type
  invoice_url:
    description: URL of charged invoice.
    lineage:
      - datalake_rental_guarantee_platform_clean.payment.invoice_url
  description:
    description: Description comments for this invoice.
    lineage:
      - datalake_rental_guarantee_platform_clean.payment.description
  due_amount:
    description: Amount that is due.
    lineage:
      - datalake_rental_guarantee_platform_clean.payment.value
      - datalake_rental_guarantee_platform_clean.agreement_payment.value
  net_amount:
    description: Amount that Velo receives after removing payment gateway taxes.
  is_paid_late:
    description: Boolean flag for when dt_paid if after dt_due.
  is_due_modified:
    description: Boolean flag for when dt_due has been modified.
  is_occurrence:
    description: Boolean flag for when there is an occurrence related to this invoice.
  is_direct_billing:
    description: Boolean flag for when this payment is from the direct billing model.
  is_legacy:
    description: If the propose's comes from Velo 2.0 systems (TRUE = 2.0, FALSE = QuintoCred;3.0)
  dt_created:
    description: Date that invoice was created.
    lineage:
      - datalake_rental_guarantee_platform_clean.payment.ts_created
      - datalake_rental_guarantee_platform_clean.agreement_payment.ts_created
  dt_due:
    description: Date that invoice was due.
    lineage:
      - datalake_rental_guarantee_platform_clean.payment.ts_due
      - datalake_rental_guarantee_platform_clean.agreement_payment.dt_due
  dt_due_original:
    description: Date that invoice was due originally, if was changed in the middle time.
    lineage:
  dt_paid:
    description: Date that invoice was paid.
    lineage:
      - datalake_rental_guarantee_platform_clean.payment.ts_client_payment
      - datalake_rental_guarantee_platform_clean.agreement_payment.dt_paid
  dt_payment_confirmed:
    description: Date that invoice had it's payment confirmed by the payment gateway.
    lineage:
  ts_updated:
    description: Timestamp that the invoice register was last updated on the database.
    lineage:
      - datalake_rental_guarantee_platform_clean.payment.ts_updated
      - datalake_rental_guarantee_platform_clean.agreement_payment.ts_updated
