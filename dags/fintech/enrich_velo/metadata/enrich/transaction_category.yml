database_name: datalake_velo
table_name: transaction_category
owner: guilherme.sacramento@quintoandar.com.br
domain: Fintech
description:
  QuintoCred is the name given to Velo after its acquisition by QuintoAndar in 2021. As of 2023, the Velo brand was replaced by QuintoCred.
  In June 2025, QuintoCred's core operations were shut down, leaving only the debt collection services active. In the first quarter of 2026, the decision was made to terminate the collection operations by July 31, 2026.
  Therefore, it is important to understand that all Velo and QuintoCred systems are considered legacy, and consequently, the involved tables are as well.
  Dimension with the details of the category
columns:
  id_category:
    description: Category's identification number (ID). This key connects to the table velo_transaction_entries
    lineage:
      - datalake_velo_omie_clean.categories.id_category
  description:
    description: Human-readable description of the financial transaction or ledger entry.
    lineage:
      - datalake_velo_omie_clean.categories.description
  nature_description:
    description: category use recommendation
    lineage:
      - datalake_velo_omie_clean.categories.nature_description
  dre_description:
    description: description used in the DRE
    lineage:
      - datalake_velo_omie_clean.categories.dre_description
