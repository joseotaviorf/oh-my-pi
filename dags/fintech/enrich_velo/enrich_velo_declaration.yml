---
dag:
  name: enrich_velo
  schedule_start_date: 2022, 8, 28
  owner: Data Fintech
  documentation:
    dag_purpose: |
      Creates enriched tables for Velo Propose and Transactions context.
workflow:
  type: query_delta
  layer: enrich
  inner_dependencies:
    transaction_entries:
      - propose
      - propose_person
    propose:
      - junk
      - payment
      - occurrence
      - propose_person
    payment:
      - junk
    propose_values:
      - junk
      - payment
    payment_legacy:
      - junk
    occurrence:
      - junk
    propose_legacy:
      - junk
      - payment_legacy
      - propose_person_legacy

cluster:
  type: databricks_13_3_med_memory_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
