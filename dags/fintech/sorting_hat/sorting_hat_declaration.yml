dag:
  name: sorting_hat
  owner: Data Fintech
  schedule_interval: 0 0 * * *
  documentation:
    dag_purpose: |
      Sorting Hat is a microservice responsible for credit policy and analysis for tenants' rental process. This DAG brings its data from a postgreSQL database.
workflow:
  type: cdc
  layer: raw
  database_type: postgres
  custom_schema: sorting_hat
  source_database: sortinghat
  dbutils_secret_key: SORTING_HAT_DB
  tables_customization:
    AnalysisMachine:
      clean_table_name: analysis_machine
      get_table_metrics:
        count: id
        max: created_at
        min: created_at
    AnalysisRequestData:
      clean_table_name: analysis_request_data
      get_table_metrics:
        count: id
        max: created_at
        min: created_at
    AnalysisRequestProponentData:
      clean_table_name: analysis_request_proponent_data
      get_table_metrics:
        count: id
        max: created_at
        min: created_at
    AnalysisRequest:
      clean_table_name: analysis_request
      get_table_metrics:
        count: id
        max: created_at
        min: created_at
    AnalysisStateGroup:
      clean_table_name: analysis_state_group
      get_table_metrics:
        count: id
        max: created_at
        min: created_at
    AnalysisState:
      clean_table_name: analysis_state
      get_table_metrics:
        count: id
        max: created_at
        min: created_at
    ChecklistGroup:
      clean_table_name: checklist_group
      get_table_metrics:
        count: id
        max: created_at
        min: created_at
    ChecklistItem:
      clean_table_name: checklist_item
      get_table_metrics:
        count: id
        max: created_at
        min: created_at
    ChecklistDecision:
      clean_table_name: checklist_decision
      get_table_metrics:
        count: id
        max: created_at
        min: created_at
    Checklist:
      clean_table_name: checklist
      get_table_metrics:
        count: id
        max: created_at
        min: created_at
    ExternalScore:
      clean_table_name: external_score
      get_table_metrics:
        count: id
        max: created_at
        min: created_at
        avg: value
    PolicyReport:
      clean_table_name: policy_report
      get_table_metrics:
        count: id
        max: created_at
        min: created_at
    Variant:
      clean_table_name: variant
    CreditAnalysis:
      clean_table_name: credit_analysis
    CreditAnalysis_Version:
      clean_table_name: credit_analysis_version
    EarlyCreditAnalysis:
      clean_table_name: early_credit_analysis
    Experiment:
      clean_table_name: experiment
    Offer:
      clean_table_name: offer
    ProcessedMessage:
      clean_table_name: processed_message
    Proponent:
      clean_table_name: proponent
    Proponent_Version:
      clean_table_name: proponent_version
    Proposal:
      clean_table_name: proposal
    ProposalError:
      clean_table_name: proposal_error
    Proposal_Version:
      clean_table_name: proposal_version
    message:
      clean_table_name: message
    ScreeningResult:
      clean_table_name: screening_result
    ScreeningResult_Version:
      clean_table_name: screening_result_version
    User:
      clean_table_name: user
cluster:
  type: databricks_12_2_med_general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
