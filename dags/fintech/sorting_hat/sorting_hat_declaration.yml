dag:
  name: sorting_hat
  owner: Data Fintech
  schedule_interval: 0 8,12,16,21 * * *
  documentation:
    dag_purpose: |
      Sorting Hat is a microservice responsible for credit policy and analysis for tenants' rental process. This DAG brings its data from a postgreSQL database.
workflow:
  type: cdc
  layer: raw
  database_type: postgres
  custom_schema: sorting_hat
  source_database: sortinghat
  dbutils_secret_key: SORTINGHAT_DB
  tables_customization:
    AnalysisMachine:
      clean_table_name: analysis_machine
    AnalysisRequestData:
      clean_table_name: analysis_request_data
    AnalysisRequestProponentData:
      clean_table_name: analysis_request_proponent_data
    AnalysisRequest:
      clean_table_name: analysis_request
    AnalysisStateGroup:
      clean_table_name: analysis_state_group
    AnalysisState:
      clean_table_name: analysis_state
    ChecklistGroup:
      clean_table_name: checklist_group
    ChecklistItem:
      clean_table_name: checklist_item
    ChecklistDecision:
      clean_table_name: checklist_decision
    Checklist:
      clean_table_name: checklist
    ExternalScore:
      clean_table_name: external_score
    PolicyReport:
      clean_table_name: policy_report
    Variant:
      clean_table_name: variant
    CreditAnalysis:
      clean_table_name: credit_analysis
    CreditAnalysis_Version:
      clean_table_name: credit_analysis_version
    EarlyCreditAnalysis:
      clean_table_name: early_credit_analysis
    Experiment:
      clean_table_name: experiment
    Offer:
      clean_table_name: offer
    ProcessedMessage:
      clean_table_name: processed_message
      clean_primary_keys: ["id_subscriber", "id_message"]
    Proponent:
      clean_table_name: proponent
    Proponent_Version:
      clean_table_name: proponent_version
    Proposal:
      clean_table_name: proposal
    ProposalError:
      clean_table_name: proposal_error
    Proposal_Version:
      clean_table_name: proposal_version
    message:
      clean_table_name: message
    ScreeningResult:
      clean_table_name: screening_result
    ScreeningResult_Version:
      clean_table_name: screening_result_version
    User:
      clean_table_name: user
cluster:
  type: databricks_16_4_med_2xlarge_general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
