database_name: datalake_sorting_hat_clean
table_name: proponent_version
domain: Fintech
description: Versioned proponent profile and PII (contact, income, scores) for rental credit proposals in Sorting Hat.
columns:
  id:
    lineage:
      - datalake_sorting_hat_raw.proponent_version.id
    description: Primary key of this proponent version snapshot row.
  id_end_transaction:
    lineage:
      - datalake_sorting_hat_raw.proponent_version.end_transaction_id
    description: Closing transaction id when the rental deal reached a terminal state.
  id_proposal:
    lineage:
      - datalake_sorting_hat_raw.proponent_version.proposal_id
    description: Proposal that this proponent profile belongs to at this version.
  id_screening_result:
    lineage:
      - datalake_sorting_hat_raw.proponent_version.screening_result_id
    description: Screening outcome row linked to this proponent snapshot.
  id_transaction:
    lineage:
      - datalake_sorting_hat_raw.proponent_version.transaction_id
    description: Open transaction id for the deal while underwriting is in progress.
  address:
    lineage:
      - datalake_sorting_hat_raw.proponent_version.address
    description: Street name for the proponent residential address on the form.
  address_number:
    lineage:
      - datalake_sorting_hat_raw.proponent_version.address_number
    description: Street number for the proponent residential address.
  bairro:
    lineage:
      - datalake_sorting_hat_raw.proponent_version.bairro
    description: Neighborhood (bairro) of the proponent address in Brazil.
  cell_phone:
    lineage:
      - datalake_sorting_hat_raw.proponent_version.cell_phone
    description: Mobile phone number provided by the proponent for contact.
  city:
    lineage:
      - datalake_sorting_hat_raw.proponent_version.city
    description: City of the proponent residential address.
  complement:
    lineage:
      - datalake_sorting_hat_raw.proponent_version.complement
    description: Apartment, block, or complement details for the address line.
  cpf:
    lineage:
      - datalake_sorting_hat_raw.proponent_version.cpf
    description: Brazilian individual taxpayer id (CPF) for the proponent.
  documentation_analysis:
    lineage:
      - datalake_sorting_hat_raw.proponent_version.documentation_analysis
    description: Status or notes from document verification for this proponent version.
  email:
    lineage:
      - datalake_sorting_hat_raw.proponent_version.email
    description: Email address supplied by the proponent for notifications.
  employer_name:
    lineage:
      - datalake_sorting_hat_raw.proponent_version.employer_name
    description: Employer or company name declared for income verification.
  employer_phone:
    lineage:
      - datalake_sorting_hat_raw.proponent_version.employer_phone
    description: Phone contact for the employer reference check.
  extra_income_origin:
    lineage:
      - datalake_sorting_hat_raw.proponent_version.extra_income_origin
    description: Source category for income beyond the primary salary.
  gender:
    lineage:
      - datalake_sorting_hat_raw.proponent_version.gender
    description: Gender self-identification captured on the rental application.
  income_nature:
    lineage:
      - datalake_sorting_hat_raw.proponent_version.income_nature
    description: Employment type or income regime (CLT, PJ, informal, etc.).
  location_motive:
    lineage:
      - datalake_sorting_hat_raw.proponent_version.location_motive
    description: Declared reason or context for choosing the residential location (e.g., work, study).
  marital_status:
    lineage:
      - datalake_sorting_hat_raw.proponent_version.marital_status
    description: Marital status used for household and policy rules.
  mother_name:
    lineage:
      - datalake_sorting_hat_raw.proponent_version.mother_name
    description: Mother full name for identity validation in underwriting.
  name:
    lineage:
      - datalake_sorting_hat_raw.proponent_version.name
    description: Full legal name of the rental proponent on this version.
  nationality:
    lineage:
      - datalake_sorting_hat_raw.proponent_version.nationality
    description: Nationality or citizenship declared by the proponent.
  occupation_area:
    lineage:
      - datalake_sorting_hat_raw.proponent_version.occupation_area
    description: Broad occupation segment used for income benchmarking.
  operation_type:
    lineage:
      - datalake_sorting_hat_raw.proponent_version.operation_type
    description: Business operation context for this proponent snapshot.
  phone:
    lineage:
      - datalake_sorting_hat_raw.proponent_version.phone
    description: Landline or alternate phone for the proponent.
  profession:
    lineage:
      - datalake_sorting_hat_raw.proponent_version.profession
    description: Job title or profession declared by the proponent.
  residence_condition:
    lineage:
      - datalake_sorting_hat_raw.proponent_version.residence_condition
    description: Tenure type at the current address (owned, rented, family, etc.).
  second_doc_issuer:
    lineage:
      - datalake_sorting_hat_raw.proponent_version.second_doc_issuer
    description: Issuing authority for the secondary identity document.
  second_doc_number:
    lineage:
      - datalake_sorting_hat_raw.proponent_version.second_doc_number
    description: Number of the secondary identity document (RG, CNH, etc.).
  second_doc_type:
    lineage:
      - datalake_sorting_hat_raw.proponent_version.second_doc_type
    description: Type of secondary document used for KYC in this application.
  state:
    lineage:
      - datalake_sorting_hat_raw.proponent_version.state
    description: State (UF) of the proponent residential address.
  zipcode:
    lineage:
      - datalake_sorting_hat_raw.proponent_version.zipcode
    description: Postal code (CEP) for the proponent address.
  boavista_score:
    lineage:
      - datalake_sorting_hat_raw.proponent_version.boavista_score
    description: Boa Vista bureau score used in affordability and risk rules.
  extra_income_value:
    lineage:
      - datalake_sorting_hat_raw.proponent_version.extra_income_value
    description: Declared extra monthly income amount in BRL.
  monthly_income:
    lineage:
      - datalake_sorting_hat_raw.proponent_version.monthly_income
    description: Declared primary monthly income in BRL for the proponent.
  residence_time:
    lineage:
      - datalake_sorting_hat_raw.proponent_version.residence_time
