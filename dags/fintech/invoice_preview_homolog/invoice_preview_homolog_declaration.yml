---
dag:
  name: invoice_preview_homolog
  schedule_start_date: 2020, 11, 1
  schedule_interval: 0 8 * * *
  owner: Data Fintech
  documentation:
    dag_purpose: |
      Retrieves data from Invoice Preview CSVs generated by SeuBarriga service.
workflow:
  layer: raw
  type: custom_ingestion
  load_spark_job: load_csv_into_datalake
  spark_job_arguments:
    - "{environment}"
    - "{bucket}"
    - "{dag_name}"
    - s3://5a-seubarriga/prod/report
    - "{{ ds }}"
    - "{table_name}"
  default_extraction_type: incremental
  default_partitions:
    - year
    - month
    - day
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, ds, 'load_end_date') }}"
  tables_customization:
    invoice_preview:
      extra_spark_job_arguments:
        - csv
        - header: "true"
          escape: '"'
          multiLine: "true"
cluster:
  type: databricks_13_3_med_general_cluster
