dag:
  name: dw_credit_analysis
  schedule_start_date: 2020,02,20
  owner: Data Fintech
workflow:
  type: query_delta
  layer: dw
  custom_schema: credit
  spark_session_configs:
    udfs: [FINTECHOPS_WORK_MIN_SLA]
  tables_customization:
    dim_drop_reason:
      custom_schema: public
  inner_dependencies:
    fact_proposal_credit_flows:
      - dim_drop_reason
      - fact_early_credit
      - fact_offer_early_credit
cluster:
  type: custom_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    driver_node_type_id: m5d.2xlarge
    node_type_id: m5d.2xlarge
    num_workers: 4
    spark_version: 13.3.x-scala2.12
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: "quintoandar_{{ var.value.environment }}"
