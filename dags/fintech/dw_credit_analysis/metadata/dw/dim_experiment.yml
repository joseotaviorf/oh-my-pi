database_name: dw_credit
table_name: dim_experiment
description: Dimension of Sorting Hat A/B credit policy experiments, including name, description, run status, and active window (start/end dates), used to track and analyze credit engine tests.
domain: Fintech
owner: isabella.santos@quintoandar.com.br
columns:
  id_experiment:
    lineage:
      - datalake_sorting_hat_clean.experiment.id
    description: Primary key of the Sorting Hat credit policy experiment; join to dim_variant via id_experiment.
  experiment_name:
    lineage:
      - datalake_sorting_hat_clean.experiment.name
    description: Short label of the experiment as configured in Sorting Hat A/B test tooling.
  experiment_description:
    lineage:
      - datalake_sorting_hat_clean.experiment.description
    description: Free-text description of the Sorting Hat credit policy experiment (truncated to 500 characters in the DW).
  is_experiment_running:
    lineage:
      - datalake_sorting_hat_clean.experiment.ts_started
      - datalake_sorting_hat_clean.experiment.ts_ended
    description: "Boolean indicating if the experiment is running (TRUE) or not (FALSE)."
  has_experiment_ran_last_month:
    lineage:
      - datalake_sorting_hat_clean.experiment.ts_started
      - datalake_sorting_hat_clean.experiment.ts_ended
    description: "Boolean indicating if the experiment has runned at least one month ago."
  has_experiment_ran_last_3_months:
    lineage:
      - datalake_sorting_hat_clean.experiment.ts_started
      - datalake_sorting_hat_clean.experiment.ts_ended
    description: "Boolean indicating if the experiment has runned at least 3 months ago."
  has_experiment_ran_last_6_months:
    lineage:
      - datalake_sorting_hat_clean.experiment.ts_started
      - datalake_sorting_hat_clean.experiment.ts_ended
    description: "Boolean indicating if the experiment has runned at least 6 months ago."
  has_experiment_ran_last_year:
    lineage:
      - datalake_sorting_hat_clean.experiment.ts_started
      - datalake_sorting_hat_clean.experiment.ts_ended
    description: "Boolean indicating if the experiment has runned last year."
  ts_experiment_started:
    lineage:
      - datalake_sorting_hat_clean.experiment.ts_started
    description: "Date/time in which the experiment started."
  ts_experiment_ended:
    lineage:
      - datalake_sorting_hat_clean.experiment.ts_ended
    description: "Date/time in which the experiment ended."
  ts_load:
    description: "Timestamp when row was loaded."
