database_name: dw_credit
table_name: fact_closing_working_minutes
description: This table stores the working minutes calculation between credit approved and contract signature for the Closing team.
domain: Fintech
owner: isabella.santos@quintoandar.com.br
columns:
  sk_contract:
    lineage:
    -  dw_rent.fact_listing_rent_flows.sk_contract
    description: Key of the contract.
  sk_proposal:
    lineage:
    - dw_rent.fact_listing_rent_flows.sk_proposal
    description: Key of proposal. This column can be used to join with the table dw_rent.dim_proposal to get the proposal details, or any other table that contains the proposal ID from EBDB (main).
  working_min_credit_approved_to_contract_created:
    lineage:
      - datalake_ebdb_contract.contract
    description: Number of working minutes between the credit analysis last approval and the contract creation.
  working_min_credit_approved_to_contract_signed:
    lineage:
      - datalake_ebdb_contract.contract
    description: Number of working minutes between the credit analysis last approval and the contract signature.
  working_min_contract_created_to_contract_signed:
    lineage:
      - datalake_ebdb_contract.contract
    description: Number of working minutes between the contract creation and the contract signature.
  is_contract_signed:
    lineage:
      - datalake_ebdb_contract.contract.ts_signed
    description: Boolean indicating if the contract was signed.
  ts_credit_analysis_approved:
    lineage:
      - datalake_ebdb_proposal.proposal.ts_credit_approved_last
    description: Timestamp of the credit analysis approval event.
  ts_contract_created:
    lineage:
      - datalake_ebdb_contract.contract.ts_created
    description: Timestamp of the contract creation.
  ts_contract_signed:
    lineage:
      - datalake_ebdb_contract.contract.ts_signed
    description: Timestamp os the contract signature.
  ts_load:
    description: Timestamp of data recorded in the table.
