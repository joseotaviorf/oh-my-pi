database_name: dw_credit
table_name: dim_credit_analysis
description: This table takes all credit analysis from Sorting Hat to a given proposal
  and all of its properties
domain: Fintech
owner: fernando.araujo@quintoandar.com.br
columns:
  id_credit_analysis:
    lineage:
    - datalake_credit_analysis.credit_analysis.id_credit_analysis
    description: Credit Analysis ID
  id_proposal:
    lineage:
    - datalake_credit_analysis.credit_analysis.id_proposal
    description: Proposal ID
  id_analyst:
    lineage:
    - datalake_credit_analysis.credit_analysis.id_analyst
    description: Analyst ID
  bypass:
    lineage:
    - datalake_credit_analysis.credit_analysis.bypass
    description: Indicate the reason that led a credit analysis to receive the bypass
      treatment (if conditions apply)
    categories:
      FOREIGNER: Indicates when a proposal contains a proponent from another country
      HIGH_INCOME: Indicates when the total income from subset is above the defined
        threshold (25k)
      LOW_DTI: Indicates when the DTI is less then the defined threshold (0.1)
      MANUAL: Indicates the case in which was made a bypass via manual credit analysis
      MISSING_5A_SCORE: Indicates when the proposal does not have an internal score
        available
      MISSING_EXTERNAL_SCORE: Indicates when one or more proponents does not have
        scores available on Serasa/Boavista
      OCCUPATION_AREA: Indicates when some proponent have occupation_area = COMMUNICATION
        and one or more proponents have income nature defined as AUTONOMOUS or BUSINESSMAN
      RECENT_TENANT: Indicates when one or more proponents have a contract with 5A
        in the last 6 months
      RELIABLE_EX_TENANT: Indicates when one or more proponents was classified as
        a reliable ex-tenant
      RELIABLE_TENANT: Indicates when one or more proponents was classified as a reliable
        tenant
      RENTAL_GUARANTEE: Indicates when the proposal have a guarantee from Rental Guarantee
        product
  category:
    lineage:
    - datalake_credit_analysis.credit_analysis.category
    description: ''
  category_within_ca:
    lineage:
    - datalake_credit_analysis.credit_analysis.category_within_ca
    description: ''
  category_within_proposal:
    lineage:
    - datalake_credit_analysis.credit_analysis.category_within_proposal
    description: ''
  documentation_policy:
    lineage:
    - datalake_credit_analysis.credit_analysis.documentation_policy
    description: Indicates what documentation policy was applied to a given credit
      analysis
    categories:
      FULL_CONTROL_GROUP: Cases in which a FULL documentation policy is requested
        to remove the bias on Credit Decision ML models
      FULL: Documentation is requested and fully analyzed. This is the option that
        might result in more bias as it requests documentation and a thorough analysis
        is made, thus eliminating people with insufficient income, invalid informed
        income, income that is difficult to validate (informal workers) and etc
      FLEX: Documentation is requested, but is not thoroughly analyzed. This reduces
        a bit the conversion when compared with LIGHT_APPROVAL, as it requires documents
        to be sent. It has a certain level of analysis and helps to filter some income
        outliers.
      LIGHT_APPROVAL: It includes a personal document check and sometimes a manual
        analysis is made
  guarantee_category:
    lineage:
    - datalake_credit_analysis.credit_analysis.guarantee_category
    description: ''
  level:
    lineage:
    - datalake_credit_analysis.credit_analysis.level
    description: ''
    categories:
      LEVEL_1: ''
      LEVEL_2: ''
  liquidity:
    lineage:
    - datalake_credit_analysis.credit_analysis.liquidity
    description: ''
    categories:
      A: ''
      B: ''
      C: ''
      D: ''
  paid_guarantee_type:
    lineage:
    - datalake_credit_analysis.credit_analysis.paid_guarantee_type
    description: ''
    categories:
      DEPOSIT: Caucao guarantee type
      INSURANCE: Seguro Fianca guarantee type
      PRO_GUARANTOR: Fianca garantida guarantee type
      STANDALONE: Brokerage Only guarantee type
  standalone_factor:
    lineage:
    - datalake_credit_analysis.credit_analysis.standalone_factor
    description: Indicates the standalone factor applied to a given credit analysis
      (If it's a standalone proposal)
    categories:
      Standalone High: ''
      Standalone Low: ''
  reason:
    lineage:
    - datalake_credit_analysis.credit_analysis.reason
    description: Indicates the reason that led to a credit analysis disapproval
  risk_category:
    lineage:
    - datalake_credit_analysis.credit_analysis.risk_category
    description: Indicates the risk category defined to a given credit analysis. The
      definition of each letter is done by the Credit Ops team
    categories:
      A: ''
      B: ''
      C: ''
      D: ''
      E: ''
      F: ''
  internal_score:
    lineage:
    - datalake_credit_analysis.credit_analysis.internal_score
    description: Indicates the internal score defined to a given credit analysis
  max_bypass:
    lineage:
    - datalake_credit_analysis.credit_analysis.max_bypass
    description: Indicates the if there is a bypass category applied to a given proposal
      (if conditions apply)
  result:
    lineage:
    - datalake_credit_analysis.credit_analysis.result
    description: Indicates the result applied to a given credit analysis
    categories:
      ADVISABLE: status given when a manual evaluator requests a doument resend, but
        leaves the recommendation to approve
      APPROVED: ''
      INADVISABLE: status given when a manual evaluator requests a doument resend,
        but leaves the recommendation to reject
      NEW: usually indicates a new proposal. If it got to closing, look for other
        clues to approved or rejected
      REJECTED: ''
  credit_decision_cluster:
    lineage:
    - datalake_credit_analysis.credit_analysis.credit_decision_cluster
    description: Indicates the decision cluster applied to a given credit analysis
    categories:
      Brokerage Only: ''
      Clear-No: ''
      Deposit: ''
      Error: ''
      Free: ''
      Insurance: ''
      Insurance or Deposit: ''
      Pro Guarantor: ''
      Pro Guarantor or Deposit: ''
      bypass: ''
      bypass max: ''
      ea_approved: ''
  is_manual_analysis:
    lineage:
    - datalake_credit_analysis.credit_analysis.is_manual_analysis
    description: Indicates if a given credit analysis received a manual analysis
  is_reprocessed:
    lineage:
    - datalake_credit_analysis.credit_analysis.is_reprocessed
    description: Indicates if a given credit analysis was reprocessed
  ts_credit_analysis_created:
    lineage:
    - datalake_credit_analysis.credit_analysis.ts_credit_analysis_created
    description: Timestamp of a credit analysis creation
  ts_load:
    description: Timestamp of data recorded in the table
