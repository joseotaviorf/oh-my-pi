database_name: dw_credit
table_name: dim_credit_analysis
description:
  "This table takes all credit analysis from Sorting Hat to a given proposal
  and all of its properties."
domain: Fintech
owner: isabella.santos@quintoandar.com.br
columns:
  id_credit_analysis:
    lineage:
      - datalake_credit_analysis.credit_analysis.id_credit_analysis
    description: "Credit Analysis ID. This ID can be used in any join with the credit analysis ID from Sorting Hat."
  id_proposal:
    lineage:
      - datalake_credit_analysis.credit_analysis.id_proposal
    description: "Proposal ID. This column can be used to join with the table dw_rent.dim_proposal to get the proposal details, or any other table that contains the proposal ID from EBDB (main)."
  id_analysis_request:
    lineage:
      - datalake_credit_analysis.credit_engine_analysis_request.id_analysis_request
    description: "ID of the analysis request processed by the credit engine from Sorting Hat. This column may be null when the credit analysis was processed by the old credit engine."
  id_checklist:
    lineage:
      - datalake_credit_analysis.credit_engine_checklist.id_checklist
    description: "ID of the current checklist. The checklist is an entity with all checks (manual or automatic) associated to an analysis request from Sorting Hat. This column may be null when the credit analysis was processed by the old credit engine."
  id_analyst:
    lineage:
      - datalake_credit_analysis.credit_analysis.id_analyst
    description: "Analyst ID. This column may be null with the credit analysis was processed automatically."
  bypass:
    lineage:
      - datalake_credit_analysis.credit_analysis.bypass
    description:
      "Indicate the reason that led a credit analysis to receive the bypass treatment (if conditions apply). When an analysis is bypassed it may skip a few steps of the funnel and it will be analysed by the credit desk."
    categories:
      FOREIGNER: "Indicates when a proposal contains a proponent from another country."
      HIGH_INCOME:
        "Indicates when the total income from subset is above the defined
        threshold (25k)."
      LOW_DTI: "Indicates when the DTI is less then the defined threshold (0.1)."
      MANUAL: "Indicates the case in which was made a bypass via manual credit analysis."
      MISSING_5A_SCORE:
        "Indicates when the proposal does not have an internal score
        available."
      MISSING_EXTERNAL_SCORE:
        "Indicates when one or more proponents does not have
        scores available on Serasa/Boavista."
      OCCUPATION_AREA:
        "Indicates when some proponent have occupation_area = COMMUNICATION
        and one or more proponents have income nature defined as AUTONOMOUS or BUSINESSMAN."
      RECENT_TENANT:
        "Indicates when one or more proponents have a contract with 5A
        in the last 6 months."
      RELIABLE_EX_TENANT:
        "Indicates when one or more proponents was classified as
        a reliable ex-tenant."
      RELIABLE_TENANT:
        "Indicates when one or more proponents was classified as a reliable
        tenant."
      RENTAL_GUARANTEE:
        "Indicates when the proposal have a guarantee from Rental Guarantee
        product."
  category:
    lineage:
      - datalake_credit_analysis.credit_analysis.category
    description: "Guarantee policy identification. 0 marks a Free guarantee, null indicates a Clear No reject and all others are accessible via dim_credit.dim_guarantee_policy."
  category_within_ca:
    lineage:
      - datalake_credit_analysis.credit_analysis.category_within_ca
    description: "Max guarantee policy identification looking credit_analysis_version."
  category_within_proposal:
    lineage:
      - datalake_credit_analysis.credit_analysis.category_within_proposal
    description: "Max guarantee policy identification looking credit_analysis_version and grouping by proposal."
  documentation_policy:
    lineage:
      - datalake_credit_analysis.credit_analysis.documentation_policy
    description:
      "Indicates what documentation policy was applied to a given credit
      analysis."
    categories:
      FULL_CONTROL_GROUP:
        "Cases in which a FULL documentation policy is requested
        to remove the bias on Credit Decision ML models."
      FULL:
        "Documentation is requested and fully analyzed. This is the option that
        might result in more bias as it requests documentation and a thorough analysis
        is made, thus eliminating people with insufficient income, invalid informed
        income, income that is difficult to validate (informal workers) and etc."
      FLEX:
        "Documentation is requested, but is not thoroughly analyzed. This reduces
        a bit the conversion when compared with LIGHT_APPROVAL, as it requires documents
        to be sent. It has a certain level of analysis and helps to filter some income
        outliers."
      LIGHT_APPROVAL:
        "It includes a personal document check and sometimes a manual
        analysis is made."
  guarantee_category:
    lineage:
      - datalake_credit_analysis.credit_analysis.guarantee_category
    description: "Guarantee policy identification from Rental Guarantee microsservice, meaning, they are only present on paid guarantee options."
  level:
    lineage:
      - datalake_credit_analysis.credit_analysis.level
    description: "Level of analysis required by the credit table."
    categories:
      LEVEL_1: "It's the default level and any analyst can evaluate"
      LEVEL_2: "Indicates a more problematic situation that should be evaluated by an experienced analyst."
  paid_guarantee_type:
    lineage:
      - datalake_credit_analysis.credit_analysis.paid_guarantee_type
    description: "Given the options of paid guarantee given, which one was chosen."
    categories:
      DEPOSIT: "Caucao guarantee type."
      INSURANCE: "Seguro Fianca guarantee type."
      PRO_GUARANTOR: "Fianca garantida guarantee type."
      STANDALONE: "Brokerage Only guarantee type."
  standalone_factor:
    lineage:
      - datalake_credit_analysis.credit_analysis.standalone_factor
    description:
      "Indicates the standalone factor applied to a given credit analysis
      (If it's a standalone proposal)."
    categories:
      Standalone High: "More expensive option we have for standalone contracts."
      Standalone Low: "Cheapest option we have for standalone contracts."
  reason:
    lineage:
      - datalake_credit_analysis.credit_analysis.reason
    description: "Indicates the reason that led to a credit analysis rejection."
  risk_category_canon:
    lineage:
      - datalake_credit_analysis.credit_analysis.risk_category_canon
    description: "New risk score given by the credit model."
  risk_category:
    lineage:
      - datalake_credit_analysis.credit_analysis.risk_category
    description:
      "Indicates the risk category defined to a given credit analysis. The
      definition of each letter is done by the Credit Ops team. It was deprecated in favor to risk_category_canon."
    categories:
      A: "Best people evaluated"
      B: "Riskier people, but enough to have access to free guarantee"
      C: "Riskier than B, it's given the cheapest paid options dependending on the city."
      D: "Riskier than C, it's given more expensive paid options. Also depends on the city."
      E: "Riskier than D, its given the deposit option, factor dependending on the city."
      F: "Riskier than E, clear-no."
  internal_score:
    lineage:
      - datalake_credit_analysis.credit_analysis.internal_score
    description: "Indicates the internal score defined to a given credit analysis."
  max_bypass:
    lineage:
      - datalake_credit_analysis.credit_analysis.max_bypass
    description:
      "Indicates the if there is a bypass category applied to a given proposal
      (if conditions apply)."
  result:
    lineage:
      - datalake_credit_analysis.credit_analysis.result
    description: "Indicates the result applied to a given credit analysis."
    categories:
      ADVISABLE:
        "status given when a manual evaluator requests a doument resend, but
        leaves the recommendation to approve."
      APPROVED: "Approved"
      INADVISABLE:
        "status given when a manual evaluator requests a doument resend,
        but leaves the recommendation to reject"
      NEW:
        "usually indicates a new proposal. If it got to closing, look for other
        clues to approved or rejected"
      REJECTED: "Rejected"
  guarantee_offered:
    description: "If the tenant prospect is not a clear no by income reasons, 5A offers one or more type of guarantee.  The offered guarantee can be paid or free. This column indicates which guarantee was offered to the TP after the evaluation process. The guarantee offered might be null if the credit analysis was transfered or had a later approval to free."
    categories:
      FREE: "The offered guarantee is free"
      PRO_GUARANTOR: "The offered guarantee is the paid guarantee PRO_GUARANTOR"
      DEPOSIT: "The offered guarantee is the paid guarantee DEPOSIT"
      INSURANCE: "The offered guarantee is the paid guarantee INSURANCE"
      STANDALONE: "The offered guarantee is the paid guarantee STANDALONE"
      THIRD_PARTY_GUARANTEE: "The offered guarantee is the paid guarantee THIRD_PARTY_GUARANTEE"
      INSURANCE_OR_DEPOSIT: "The offered guarantee is the paid guarantee INSURANCE or DEPOSIT"
      PRO_GUARANTOR_OR_DEPOSIT: "The offered guarantee is the paid guarantee PRO_GUARANTOR or DEPOSIT"
      CLEAR_NO: "The guarantee was denied to the TP and it could not be offered. It may happen for income reasons, fraud risk or other reasons evaluated by the credit model"
      UNDEFINED: "The offered guarantee could not be calculated. In this case the guarantee category is -1"
  guarantee_accepted:
    lineage:
      - datalake_credit_analysis.credit_analysis_proposals.paid_guarantee_type
    description: "This column indicates the guarantee type accepted by the tenant prospect after a positive evaluation. For paid guarantee, the TP has to accept the offered guarantee to move to the Document Sent step. Free guarantees are automatically accepted. When the TP does not accept the guarantee offered this column is tagged with NOT ACCEPTED. The guarantee accpeted corresponds to the decision made to the last credit analysis submitted within the proposal."
    categories:
      FREE: "The accepted guarantee is free"
      PRO_GUARANTOR: "The accepted guarantee is the paid guarantee PRO_GUARANTOR"
      DEPOSIT: "The accepted guarantee is the paid guarantee DEPOSIT"
      INSURANCE: "The accepted guarantee is the paid guarantee INSURANCE"
      STANDALONE: "The accepted guarantee is the paid guarantee STANDALONE"
      THIRD_PARTY_GUARANTEE: "The accepted guarantee is the paid guarantee THIRD_PARTY_GUARANTEE"
      CLEAR_NO: "When no guarantee was accepted, as it was denied by some reason (such as income reasons)"
      NOT_ACCEPTED: "When 5A has offered a paid guarantee to the TP, but the person has not accepted it."
  is_manual_analysis:
    lineage:
      - datalake_credit_analysis.credit_analysis.is_manual_analysis
    description: "Indicates if a given credit analysis received a manual analysis"
  is_reprocessed:
    lineage:
      - datalake_credit_analysis.credit_analysis.is_reprocessed
    description: "Indicates if a given credit analysis was reprocessed."
  is_bypass:
    description: "True if the analysis was bypassed."
  ts_credit_analysis_created:
    lineage:
      - datalake_credit_analysis.credit_analysis.ts_credit_analysis_created
    description: "Timestamp of a credit analysis creation."
  ts_guarantee_accepted:
    lineage:
      - datalake_credit_analysis.credit_analysis.ts_guarantee_accepted
    description: "Timestamp of the date in which the guarantee was accepted by the tenant prospect."
  ts_load:
    description: "Timestamp of data recorded in the table."
