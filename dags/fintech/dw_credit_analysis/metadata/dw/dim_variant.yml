database_name: dw_credit
table_name: dim_variant
description: Dimension of Sorting Hat credit engine experiment variants, one row per variant, linked to parent experiments via id_experiment, with name, description, and traffic allocation share.
domain: Fintech
owner: isabella.santos@quintoandar.com.br
columns:
  id_variant:
    lineage:
      - datalake_sorting_hat_clean.variant.id
    description: Primary key of the Sorting Hat A/B experiment variant assigned to credit analyses (early credit and proposal underwriting).
  id_experiment:
    lineage:
      - datalake_sorting_hat_clean.variant.id_experiment
    description: Foreign key to the parent Sorting Hat experiment that owns this traffic-split variant.
  variant_name:
    lineage:
      - datalake_sorting_hat_clean.variant.name
    description: Human-readable label of the experiment variant (policy branch) shown in Sorting Hat configuration.
  variant_description:
    lineage:
      - datalake_sorting_hat_clean.variant.description
    description: Longer explanation of what this variant changes or tests within the parent experiment.
  variant_percentage_paticipation_on_test:
    lineage:
      - datalake_sorting_hat_clean.variant.percentage
    description: Percentage of experiment traffic allocated to this variant during the A/B test.
  ts_load:
    description: "Timestamp of data recorded in the table"
