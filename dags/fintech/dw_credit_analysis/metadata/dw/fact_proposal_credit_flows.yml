database_name: dw_credit
table_name: fact_proposal_credit_flows
description:
  This table presents each line as a proposal-credit_analysis with dates
  from the process and partitions by user, personal document and listings, which facilitate
  the aggregation by different grains
domain: Fintech
owner: isabella.santos@quintoandar.com.br
columns:
  sk_client:
    lineage:
      - dw_rent.fact_listing_rent_flows.sk_client
    description: "Key of client that sent an offer or booked a visit."
  sk_house_listing:
    lineage:
      - dw_rent.fact_listing_rent_flows.sk_house_listing
    description: "Listining identification, created by data team. A new version is given to a house after it was rented or unpublished."
  sk_house:
    lineage:
      - dw_rent.fact_listing_rent_flows.sk_house_listing
    description: "Id of the house."
  sk_contract:
    lineage:
      - dw_rent.fact_listing_rent_flows.sk_contract
    description: "Key of contract. This column can be used to join with the table dw_rent.dim_contract to get the contract details. When the sk_contract value is -1, it means that the contract has not been created yet."
  sk_contract_created_date:
    lineage:
      - dw_rent.fact_listing_rent_flows.sk_contract_signed_date
    description: "Key of date when contract was created."
  sk_contract_signed_date:
    lineage:
      - dw_rent.fact_listing_rent_flows.sk_contract_signed_date
    description: "Key of date when contract was signed."
  sk_credit_analysis:
    lineage:
      - datalake_credit_analysis.credit_analysis.id_credit_analysis
    description: "Key of the credit analysis."
  sk_early_credit_analysis:
    lineage:
      - dw_credit.fact_early_credit.early_credit_analysis
    description: "Key of the last early credit analysis created 1 month before the offer submitted date."
  sk_analysis_request:
    lineage:
      - datalake_credit_analysis.credit_engine_analysis_request.id_analysis_request
    description: "Key of the analysis request processed by the credit engine. This column may be -1 when the credit analysis was processed by the old credit engine."
  sk_checklist:
    lineage:
      - datalake_credit_analysis.credit_engine_checklist.id_checklist
    description: "Key of the current checklist. The checklist is an entity with all checks (manual or automatic) associated to an analysis request. This column may be -1 when the credit analysis was processed by the old credit engine."
  sk_credit_analysis_approved_date:
    lineage:
      - dw_rent.fact_listing_rent_flows.sk_credit_analysis_approved_date
    description: "Key of date when credit analysis was approved."
  sk_credit_evaluation_approved_date:
    lineage:
      - dw_rent.fact_listing_rent_flows.sk_last_credit_evaluation_negative
    description:
      "Key of the date when credit evaluation was approved. This field should
      be used on Evaluation Positive (EP) on credit funnel as it contains the logic
      for paid guarantees as well as for free guarantee."
  sk_first_credit_analysis:
    lineage:
      - datalake_credit_analysis.credit_analysis_proposals.id_first_credit_analysis
    description: "Key for the first credit analysis to a given proposal."
  sk_first_variant:
    lineage:
      - datalake_credit_analysis.credit_analysis_proposals.id_first_variant
    description: "Key for the first model variant to a given proposal."
  sk_last_variant_not_null:
    lineage:
      - datalake_credit_analysis.credit_analysis_proposals.id_last_variant_not_null
    description: "Key for the last model variant to a given proposal."
  sk_guarantee_category:
    lineage:
      - datalake_credit_analysis.credit_analysis.category
    description: "Key for the guarantee category presented."
  sk_guarantee_paid_date:
    lineage:
      - dw_rent.fact_listing_rent_flows.sk_guarantee_paid_date
    description: "Key of date of guarantee paid."
  sk_guarantee_accepted_date:
    lineage:
      - datalake_credit_analysis.credit_analysis.ts_guarantee_accepted
    description: "Guarantee acceptance key date."
  sk_last_credit_analysis:
    lineage:
      - datalake_credit_analysis.credit_analysis_proposals.id_last_credit_analysis
    description: "Key for the last credit analysis to a given proposal."
  sk_last_credit_evaluation_init:
    lineage:
      - dw_rent.fact_listing_rent_flows.sk_contract_signed_date
    description: "Key of date when credit evaluation last was initiated."
  sk_last_credit_evaluation_negative:
    lineage:
      - dw_rent.fact_listing_rent_flows.sk_last_credit_evaluation_negative
    description: "Key of date when credit evaluation last was negative."
  sk_last_credit_evaluation_positive:
    lineage:
      - dw_rent.fact_listing_rent_flows.sk_last_credit_evaluation_positive
    description: "Key of date when credit evaluation last was positive."
  sk_offer:
    lineage:
      - dw_rent.fact_listing_rent_flows.sk_offer
    description: "Key of offer."
  sk_offer_approved_date:
    lineage:
      - dw_rent.fact_listing_rent_flows.sk_offer_approved_date
    description: "Key of date when offer was approved by owner."
  sk_offer_submitted_date:
    lineage:
      - dw_rent.fact_listing_rent_flows.sk_offer_submitted_date
    description: "Key of date when offer was submitted by client."
  sk_proposal:
    lineage:
      - dw_rent.fact_listing_rent_flows.sk_proposal
    description: "Key of proposal (offer that was accepted)."
  sk_region:
    lineage:
      - dw_rent.fact_listing_rent_flows.sk_region
    description: "Key of house region."
  sk_tenant_doc_complete_date:
    lineage:
      - dw_rent.fact_listing_rent_flows.sk_tenant_doc_complete_date
    description: "Key of date when tenant doc was completed."
  sk_tenant_first_doc_sent_date:
    lineage:
      - dw_rent.fact_listing_rent_flows.sk_tenant_first_doc_sent_date
    description: "Key of date when client sent first documentation."
  sk_drop_reason:
    lineage:
      - dw_public.dim_drop_reason.id
    description: "dw_public.dim_drop_reason Primary Key"
  sk_early_credit_created:
    lineage:
      - dw_credit.fact_early_credit.dt_early_credit_created
    description: "Key of date when early credit analysis was created."
  sk_early_credit_expired:
    lineage:
      - dw_credit.fact_early_credit.dt_early_credit_expired
    description: "Key of date when early credit analysis was expired. The expiration date happens 30 days after the early credit creation date."
  sk_dim_drop_reason:
    lineage:
      - dw_public.dim_drop_reason.id
    description: "Key of the drop reason. This column can be used to join with the table dw_public.dim_drop_reason to get the drop reason description."
  funnel_step:
    lineage:
      - dw_rent.fact_listing_rent_flows.funnel_step
    description: "The funnel step where this flow is in/has stoppped."
  funnel_drop_step:
    description: "The funnel step where the client has dropped."
    categories:
      EC2OS: "The client dropped between EC and OS"
      OS2OA: "The client dropped between OS and OA"
      OA2ES: "The client dropped between OA and ES"
      ES2EP: "The client dropped between ES and EP"
      EP2DS: "The client dropped between EP and DS"
      DS2CA: "The client dropped between DS and CA"
      CA2CS: "The client dropped between CA and CS"
  funnel_drop_step_ordered:
    description: "Same as the funnel_drop_step but in alphabetical order."
  client_max_funnel_drop_step:
    description: "Only the last funnel_drop_step that the client reached by month."
  guarantee_offered:
    description: "If the tenant prospect is not a clear no by income reasons, 5A offers one or more type of guarantee.  The offered guarantee can be paid or free. This column indicates which guarantee was offered to the TP after the evaluation process. The guarantee offered might be null if the credit analysis was transfered or had a later approval to free."
    categories:
      FREE: "The offered guarantee is free"
      PRO_GUARANTOR: "The offered guarantee is the paid guarantee PRO_GUARANTOR"
      DEPOSIT: "The offered guarantee is the paid guarantee DEPOSIT"
      INSURANCE: "The offered guarantee is the paid guarantee INSURANCE"
      STANDALONE: "The offered guarantee is the paid guarantee STANDALONE"
      THIRD_PARTY_GUARANTEE: "The offered guarantee is the paid guarantee THIRD_PARTY_GUARANTEE"
      INSURANCE_OR_DEPOSIT: "The offered guarantee is the paid guarantee INSURANCE or DEPOSIT"
      PRO_GUARANTOR_OR_DEPOSIT: "The offered guarantee is the paid guarantee PRO_GUARANTOR or DEPOSIT"
      CLEAR_NO: "The guarantee was denied to the TP and it could not be offered. It may happen for income reasons, fraud risk or other reasons evaluated by the credit model"
      UNDEFINED: "The offered guarantee could not be calculated. In this case the guarantee category is -1"
  guarantee_accepted:
    lineage:
      - datalake_credit_analysis.credit_analysis_proposals.paid_guarantee_type
    description: "This column indicates the guarantee type accepted by the tenant prospect after a positive evaluation. For paid guarantee, the TP has to accept the offered guarantee to move to the Document Sent step. Free guarantees are automatically accepted. When the TP does not accept the guarantee offered this column is tagged with NOT ACCEPTED. The guarantee accpeted corresponds to the decision made to the last credit analysis submitted within the proposal."
    categories:
      FREE: "The accepted guarantee is free"
      PRO_GUARANTOR: "The accepted guarantee is the paid guarantee PRO_GUARANTOR"
      DEPOSIT: "The accepted guarantee is the paid guarantee DEPOSIT"
      INSURANCE: "The accepted guarantee is the paid guarantee INSURANCE"
      STANDALONE: "The accepted guarantee is the paid guarantee STANDALONE"
      THIRD_PARTY_GUARANTEE: "The accepted guarantee is the paid guarantee THIRD_PARTY_GUARANTEE"
      CLEAR_NO: "When no guarantee was accepted, as it was denied by some reason (such as income reasons)"
      NOT_ACCEPTED: "When 5A has offered a paid guarantee to the TP, but the person has not accepted it"
  ec_flag:
    description: "Quantity of events or users in the early credit stage."
  os_flag:
    description: "Quantity of events or users in the offer sent stage."
  oa_flag:
    description: "Quantity of events or users in the offer approved stage."
  es_flag:
    description: "Quantity of events or users in the evaluation star stage."
  ep_flag:
    description: "Quantity of events or users in the evaluation positive stage."
  ds_flag:
    description: "Quantity of events or users in the document sent stage."
  ca_flag:
    description: "Quantity of events or users in the credit approved stage."
  cs_flag:
    description: "Quantity of events or users in the contract signed stage."
  is_guarantee_accepted:
    lineage:
      - datalake_rental_guarantee.guarantee
    description: "Indicates if a guarantee was accepted (TRUE) or not (FALSE)"
  is_first_credit_evaluation:
    description: "Indicates if the row presents the first credit evaluation."
  is_last_credit_evaluation:
    description: "Indicates if the row presents the last credit evaluation."
  is_bypass:
    description: "True if the analysis was bypassed."
  is_early_credit:
    description: "Indicates if the offer had an early credit analysis 1 month before the offer submitted date."
  is_user_version:
    description: "True to the user version of the funnel, this flag contain the filters: rental_administrator = QUINTOANDAR, country code = BR and is_last_credit_evaluation = TRUE"
  dt_early_credit_created:
    lineage:
      - dw_credit.fact_early_credit.dt_early_credit_created
    description: "Date when the last early credit analysis was created 1 month before de offer submitted date."
  dt_early_credit_expired:
    lineage:
      - dw_credit.fact_early_credit.dt_early_credit_expired
    description: "Date when early credit analysis was expired. The expiration date happens 30 days after the early credit creation date."
  country_code:
    lineage:
      - dw_rent.dim_house_listing.country_code
    description: Country code related to the listing's country of origin.
    categories:
      BR: Brazil's country code
      MX: Mexico's country code
  rental_administrator:
    lineage:
      - dw_rent.dim_house_listing.rental_administrator
    description: The rental administrator of the house.
    categories:
      OWNER: Owner is the rental administrator, which means that the contract is brokerage-only.
      QUINTOANDAR: Default rental administrator, which is QuintoAndar.
      THIRD_PARTY: The rental administrator is a third party real estate agency.
  is_direct_offer:
    lineage:
      - dw_rent.dim_rent_flow_type.first_touchpoint
    description: "True if the sk_client has not visited the sk_house before sending the proposal."
  is_early_demand:
    lineage:
      - dw_public.dim_house_listing.ts_early_demand_started
    description: "True if the sk_house has an early demand."
  is_resend_request:
    lineage:
      - datalake_ebdb_clean.proposal_aud.is_proposal
    description: "True if the sk_proposal has any resend request."
  is_single_tenant:
    lineage:
      - datalake_sorting_hat_clean.proponent
    description: "True if the proposal has only one tenant."
  total_proposal_proponents:
    lineage:
      - datalake_sorting_hat_clean.proponent
    description: "The number of proponents in a proposal."
  dt_last_credit_evaluation_init:
    lineage:
      - dw_rent.fact_listing_rent_flows.sk_contract_signed_date
    description: "Key of date when credit evaluation last was initiated."
  dt_tenant_first_doc_sent_date:
    lineage:
      - dw_rent.fact_listing_rent_flows.sk_tenant_first_doc_sent_date
    description: "Key of date when client sent first documentation."
  dt_offer_submitted_date:
    lineage:
      - dw_rent.fact_listing_rent_flows.sk_offer_submitted_date
    description: "Date when offer was submitted by the TP."
  dt_offer_approved_date:
    lineage:
      - dw_rent.fact_listing_rent_flows.sk_offer_approved_date
    description: "Date when offer was approved."
  dt_tenant_doc_complete_date:
    lineage:
      - dw_rent.fact_listing_rent_flows.sk_tenant_doc_complete_date
    description: "Date when the TP completed the documentation."
  dt_credit_evaluation_approved_date:
    lineage:
      - dw_rent.fact_listing_rent_flows.sk_last_credit_evaluation_negative
    description: "Date when the credit evaluation was approved."
  dt_credit_analysis_approved_date:
    lineage:
      - dw_rent.fact_listing_rent_flows.sk_credit_analysis_approved_date
    description: "Date when the credit analysis was approved."
  dt_guarantee_accepted_date:
    lineage:
      - datalake_credit_analysis.credit_analysis.ts_guarantee_accepted
    description: "Date when the guarantee was accepted."
  dt_guarantee_paid_date:
    lineage:
      - dw_rent.fact_listing_rent_flows.sk_guarantee_paid_date
    description: "Date when the guarantee was paid."
  dt_contract_created_date:
    lineage:
      - dw_rent.fact_listing_rent_flows.sk_contract_created_date
    description: "Date when the contract was created."
  dt_contract_signed_date:
    lineage:
      - dw_rent.fact_listing_rent_flows.sk_contract_signed_date
    description: "Date when the contract was signed."
  dt_reference:
    lineage:
      - dw_rent.fact_listing_rent_flows.sk_offer_submitted_date
    description: "Date used to create a reference between early credit created and offer submitted date in superset"
  ts_load:
    description: "Timestamp of data recorded in the table."
