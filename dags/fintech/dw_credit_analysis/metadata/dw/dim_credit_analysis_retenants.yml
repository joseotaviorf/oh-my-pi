database_name: dw_credit
table_name: dim_credit_analysis_retenants
description: "This table contains the information about retenants per credit analysis. All users (retenants and new users) who completed the evaluation process (ES) are considered in this table."
domain: Fintech
owner: isabella.santos@quintoandar.com.br
columns:
  sk_credit_analysis:
    lineage:
      - datalake_sorting_hat_clean.credit_analysis.id_credit_analysis
    description: "Credit Analysis ID. This column is the primary key of the table and can be joined with the credit analysis ID.."
  contract_age:
    lineage:
      - datalake_ebdb_contract.contract.dt_termination
      - datalake_sorting_hat_clean.proposal.ts_created
    description: "Contract age in months. It is calculated as the difference between the contract annulment date and the latest proposal creation date of a retenant"
  any_proponent:
    description: "Classification of the proposal based on the proponents CPF and the previous contract, if applied. If any proponent present in the proposal has ever signed a contract with QuintoAndar, the proposal is classified as 'retenant'. Otherwise none of the proponents has ever signed a contract, which means that they are new users."
  main_proponent:
    description: "Classification of the proposal based on the proponents CPF and the previous contract, if applied. If the main proponent present in the proposal has ever signed a contract with QuintoAndar, the proposal is classified as 'retenant'. Otherwise the main proponent of the proposal is a new user."
  main_proponent_with_more_proponents_in_proposal:
    description: "Classification of the proposal based on the proponents CPF and the previous contract, if applied. If the main proponent present in the proposal has ever signed a contract with QuintoAndar, and there are more proponents in the proposal than in the previous one, this column is classified as 'retenant'. Otherwise the main proponent of the proposal is a new user."
  main_proponent_with_different_proponents_in_proposal:
    description: "Classification of the proposal based on the proponents CPF and the previous contract, if applied. If the main proponent present in the proposal has ever signed a contract with QuintoAndar, and there are different proponents CPF in the proposal, this column is classified as 'retenant'. Otherwise the main proponent of the proposal is a new user."
  main_proponent_with_fewer_proponents_in_proposal:
    description: "Classification of the proposal based on the proponents CPF and the previous contract, if applied. If the main proponent present in the proposal has ever signed a contract with QuintoAndar, and there are less proponents in the proposal than in the previous one, this column is classified as 'retenant'. Otherwise the main proponent of the proposal is a new user."
  equal_proponents_in_proposal:
    description: "Classification of the proposal based on the proponents CPF and the previous contract, if applied. If the main proponent present in the proposal has ever signed a contract with QuintoAndar, and all proponents in the proposal are the same as in the previous one, this column is classified as 'retenant'. Otherwise it is classified as new user."
  retenant_policy:
    description: "Indicates which policy was applied to the proposal: the new retenant policy or the old one. All proposals created before 2023-12-06 are classified as 'old_retenant_policy'."
  dt_contract_annulment:
    lineage:
      - datalake_ebdb_contract.contract.dt_termination
    description: "Contract termination date."
  ts_proposal_created:
    lineage:
      - datalake_sorting_hat_clean.proposal.ts_created
    description: "Timestamp of the proposal creation date."
  ts_last_contract_created:
    lineage:
      - datalake_ebdb_contract.contract.ts_created
    description: "Timestamp of the contract creation date. It may be null for new users."
  ts_load:
    description: "Timestamp of data recorded in the table."
