database_name: dw_credit
table_name: dim_guarantee_policy
description: Dimension of rental guarantee risk categories and policy parameters (guarantee/deposit factors, allowed guarantee types) used to interpret credit engine category outputs.
domain: Fintech
owner: isabella.santos@quintoandar.com.br
columns:
  id_guarantee_category:
    lineage:
      - datalake_rental_guarantee_clean.risk_category.category_level
    description: "Indicates the ID of the guarantee category in Rental Guarantee. Should
      be used as key to category on datalake_sorting_hat_clean.credit_analysis and
      to score on datalake_rental_guarantee.guarantee."
  id_risk_category:
    lineage:
      - datalake_rental_guarantee_clean.risk_category.id
    description: Internal surrogate key of the risk category row in Rental Guarantee; distinct from category_level used as guarantee category ID.
  guarantee_factor:
    lineage:
      - datalake_rental_guarantee_clean.risk_category.guarantee_factor
    description: Guarantee premium factor from Rental Guarantee risk category catalog (risk_category.guarantee_factor).
  deposit_factor:
    lineage:
      - datalake_rental_guarantee_clean.risk_category.deposit_factor
    description: Deposit factor from Rental Guarantee risk category catalog (risk_category.deposit_factor).
  category_description:
    lineage:
      - datalake_rental_guarantee_clean.risk_category.category_description
    description: Text label of the guarantee risk category as defined in Rental Guarantee (risk_category.category_description).
  is_guarantee_allowed:
    lineage:
      - datalake_rental_guarantee_clean.risk_category.is_guarantee_allowed
    description: "Indicates if the paid guarantee is an option."
  is_deposit_allowed:
    lineage:
      - datalake_rental_guarantee_clean.risk_category.is_deposit_allowed
    description: "Indicates if the deposit is allowed."
  ts_guarantee_category_created:
    lineage:
      - datalake_rental_guarantee_clean.risk_category.ts_created
    description: "Date/time in which the category was created."
  ts_guarantee_category_updated:
    lineage:
      - datalake_rental_guarantee_clean.risk_category.ts_updated
    description: "Date/time in which the category was updated."
  ts_load:
    description: "Timestamp of data recorded in the table"
