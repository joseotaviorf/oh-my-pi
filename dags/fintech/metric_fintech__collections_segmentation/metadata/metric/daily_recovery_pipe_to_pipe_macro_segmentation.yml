database_name: metric_fintech
table_name: daily_recovery_pipe_to_pipe_macro_segmentation
description: 'Daily recovery metrics by macro segmentation on a pipe-to-pipe basis. Shows cumulative recovery
  from one pipe day (the day in the month when rental invoices are due) to the next pipe day (pipe-to-pipe
  window), rather than from the first to the last calendar day of the month. Grain is major_segmentation
  from fact_contract_features_timeline — an intermediate level between raw theoretical segmentation and
  hyper buckets. Main goal: show the T2 recovery rate (recovered_amount over due_amount) under the T2
  delay contamination methodology. Restricted to the last 6 months to keep the pipeline lightweight.'
domain: Fintech
owner: juliana.hocihara@quintoandar.com.br
columns:
  segment:
    lineage:
    - dw_collections_segmentation.fact_contract_features_timeline.major_segmentation
    description: Macro rollup from fact_contract_features_timeline.major_segmentation (special new-defaulter
      collapsed into the parent new-defaulter label; other macro labels pass through).
    dimension: true
  rn_business_day:
    description: Row number used to deduplicate rows by segment, pipe period and business-day offset since
      pipe, keeping the most recent reference date first.
    dimension: true
  n_business_days_since_pipe:
    description: Number of Brazilian fintech business days elapsed since the pipe-period start (the day
      after the pipe day), within the same segment and pipe period.
    dimension: true
  days_to_pipe:
    description: Number of calendar days between the reference date and the pipe-period start (day after
      the pipe day), 1-based.
    dimension: true
  n_contracts_at_reference:
    description: Number of distinct contracts in the macro segment at the reference date.
    metric:
      name: Contracts at Reference
      description: Number of distinct contracts in the macro segment at the reference date.
      acronym: CAR
      is_additive: true
      business_stage: Collections
      hierarchy: Contract analysis
      approved_by: juliana.hocihara@quintoandar.com.br
      link_to_metric: ''
  n_contracts_acc:
    description: Accumulated number of distinct contracts in the macro segment from invoice creation until
      the observation date.
    metric:
      name: Accumulated Contracts
      description: Accumulated number of distinct contracts in the macro segment from invoice creation
        until the observation date.
      acronym: AC
      is_additive: true
      business_stage: Collections
      hierarchy: Contract analysis
      approved_by: juliana.hocihara@quintoandar.com.br
      link_to_metric: ''
  n_invoices_DT2_at_reference:
    description: Number of distinct invoices with delay T2 (overdue) in the macro segment at the reference
      date.
    metric:
      name: Invoices Delay T2 at Reference
      description: Number of distinct invoices with delay T2 (overdue) in the macro segment at the reference
        date.
      acronym: IDT2AR
      is_additive: true
      business_stage: Collections
      hierarchy: Invoice analysis
      approved_by: juliana.hocihara@quintoandar.com.br
      link_to_metric: ''
  n_invoices_DT2_acc:
    description: Accumulated number of distinct invoices with delay T2 (overdue) in the macro segment
      from invoice creation until the observation date.
    metric:
      name: Accumulated Invoices Delay T2
      description: Accumulated number of distinct invoices with delay T2 (overdue) in the macro segment
        from invoice creation until the observation date.
      acronym: AIDT2
      is_additive: true
      business_stage: Collections
      hierarchy: Invoice analysis
      approved_by: juliana.hocihara@quintoandar.com.br
      link_to_metric: ''
  recovered_invoices_DT2_acc:
    description: Accumulated number of distinct recovered invoices with delay T2 (overdue) in the macro
      segment from invoice creation until the observation date.
    metric:
      name: Accumulated Recovered Invoices Delay T2
      description: Accumulated number of distinct recovered invoices with delay T2 (overdue) in the macro
        segment from invoice creation until the observation date.
      acronym: ARIDT2
      is_additive: true
      business_stage: Collections
      hierarchy: Invoice analysis
      approved_by: juliana.hocihara@quintoandar.com.br
      link_to_metric: ''
  due_amount_DT2_at_reference:
    description: Total due amount for invoices with delay T2 (overdue) in the macro segment at the reference
      date.
    metric:
      name: Due Amount Delay T2 at Reference
      description: Total due amount for invoices with delay T2 (overdue) in the macro segment at the reference
        date.
      acronym: DADT2AR
      is_additive: true
      business_stage: Collections
      hierarchy: Financial analysis
      approved_by: juliana.hocihara@quintoandar.com.br
      link_to_metric: ''
  due_amount_DT2_acc:
    description: Accumulated total due amount for invoices with delay T2 (overdue) in the macro segment
      from invoice creation until the observation date.
    metric:
      name: Accumulated Due Amount Delay T2
      description: Accumulated total due amount for invoices with delay T2 (overdue) in the macro segment
        from invoice creation until the observation date.
      acronym: ADADT2
      is_additive: true
      business_stage: Collections
      hierarchy: Financial analysis
      approved_by: juliana.hocihara@quintoandar.com.br
      link_to_metric: ''
  recovered_amount_DT2_acc:
    description: Accumulated total recovered amount for invoices with delay T2 (overdue) in the macro
      segment from invoice creation until the observation date.
    metric:
      name: Accumulated Recovered Amount Delay T2
      description: Accumulated total recovered amount for invoices with delay T2 (overdue) in the macro
        segment from invoice creation until the observation date.
      acronym: ARADT2
      is_additive: true
      business_stage: Collections
      hierarchy: Financial analysis
      approved_by: juliana.hocihara@quintoandar.com.br
      link_to_metric: ''
  recovery_rate_amount_t2:
    description: Accumulated recovery rate on T2-delayed amount, computed as recovered_amount_DT2_acc
      divided by due_amount_DT2_acc.
    metric:
      name: Recovery Rate Amount T2
      description: Accumulated recovery rate on T2-delayed amount for the macro segment, from invoice
        creation until the observation date.
      acronym: RRAT2
      is_additive: false
      business_stage: Collections
      hierarchy: Financial analysis
      approved_by: juliana.hocihara@quintoandar.com.br
      link_to_metric: ''
  is_brz_fintech_business_day:
    lineage:
    - dw_public.dim_date.is_brz_fintech_business_day
    description: Flag indicating whether the reference date is a Brazilian fintech business day.
    dimension: true
  next_brz_fintech_business_day:
    lineage:
    - dw_public.dim_date.next_brz_fintech_business_day
    description: Next Brazilian fintech business day after the reference date.
    dimension: true
  dt_pipe_period_start:
    lineage:
    - dw_collections_segmentation.fact_contract_wallet_timeline.dt_pipe
    description: First day of the pipe-to-pipe period (the day after the pipe day) that the reference
      date belongs to.
    dimension: true
  dt_pipe:
    lineage:
    - dw_collections_segmentation.fact_contract_wallet_timeline.dt_pipe
    description: Pipe date indicating when the contract entered the collections pipeline.
    dimension: true
  dt_reference:
    lineage:
    - dw_public.dim_date.date
    description: Reference date for the metrics observation.
    dimension: true
  ts_load:
    description: Timestamp when the record was loaded into the table.
    dimension: true
