dag:
  name: metric_fintech__collections_segmentation
  schedule_start_date: 2025, 12, 1
  owner: Data Fintech
workflow:
  type: query_delta
  layer: metric
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: r5a.8xlarge
    node_type_id: r5a.8xlarge
    num_workers: 4
    spark_version: 16.4.x-scala2.12
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
