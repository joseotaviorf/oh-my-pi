database_name: datalake_pixar
table_name: refund
description: Enriched table with refund data, filtered by the most recent update date.
domain: Fintech
owner: juliana.hocihara@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_pixar_clean.refund.id
    description: "Identification number of the refund"
  id_charge:
    lineage:
      - datalake_pixar_clean.refund.id_charge
    description: "Identification number of the charge"
  amount:
    lineage:
      - datalake_pixar_clean.refund.amount
    description: Monetary amount in Brazilian Reais for the financial transaction or balance.
  status:
    lineage:
      - datalake_pixar_clean.refund.status
    description: Current lifecycle status of the financial entity in the upstream operational system.
  ts_created:
    lineage:
      - datalake_pixar_clean.refund.ts_created
    description: "Timestamp when the refund was created"
  ts_updated:
    lineage:
      - datalake_pixar_clean.refund.ts_updated
    description: "Update timestamp"
