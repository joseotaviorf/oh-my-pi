---
database_name: datalake_lending_clean
table_name: installment_status
owner: nilton.nakate@quintoandar.com.br
domain: Fintech
description: Status history of loan installments, one row per status transition sourced from datalake_lending_raw.installment_status, tracking how each installment moved through payment states over time.
columns:
  id:
    lineage:
      - datalake_lending_raw.installment_status.id
    description: Primary key of the installment status.
  id_installment:
    lineage:
      - datalake_lending_raw.installment_status.installment_id
    description: Foreign key to the installment whose status transition this row records.
  status:
    lineage:
      - datalake_lending_raw.installment_status.status
    description: Status value the installment transitioned to at this point in time (e.g. paid, overdue).
  payment_source:
    lineage:
      - datalake_lending_raw.installment_status.payment_source
    description: Source of the payment that triggered the installment status.
  payment_reason:
    lineage:
      - datalake_lending_raw.installment_status.payment_reason
    description: Reason associated with the installment payment status.
  ts_created:
    lineage:
      - datalake_lending_raw.installment_status.created_at
    description: Timestamp when the installment status was created.
