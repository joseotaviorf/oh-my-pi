dag:
  name: lending
  owner: Data Fintech
  schedule_interval: 0 21 * * *
  documentation:
    dag_purpose: |
      Ingest the S3 data from lending and clean them for the datalake
workflow:
  type: cdc
  layer: raw
  database_type: postgres
  source_schema: public
  tables_customization:
    deal:
      clean_table_name: deal
    deal_collateral:
      clean_table_name: deal_collateral
    deal_proponent:
      clean_table_name: deal_proponent
    deal_financial_info:
      clean_table_name: deal_financial_info
    deal_status:
      clean_table_name: deal_status
    installment_status:
      clean_table_name: installment_status
    installments:
      clean_table_name: installments
    installment_charge:
      clean_table_name: installment_charge
    offer_cohort:
      clean_table_name: offer_cohort
    offer_cohort_member:
      clean_table_name: offer_cohort_member
    product:
      clean_table_name: product
    user_consent:
      clean_table_name: user_consent
    offer_term:
      clean_table_name: offer_term
    webhook_request:
      clean_table_name: webhook_request
    asset:
      clean_table_name: asset
    credit_line:
      clean_table_name: credit_line
    credit_line_draw:
      clean_table_name: credit_line_draw
    credit_line_draw_status:
      clean_table_name: credit_line_draw_status
    credit_line_status:
      clean_table_name: credit_line_status
