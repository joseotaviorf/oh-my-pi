    lineage:
      - datalake_docpilot_raw.incomeextraction_version.extracted_data
  errors:
    description: Failure details recorded at this revision.
    lineage:
      - datalake_docpilot_raw.incomeextraction_version.errors
  operation_type:
    description: Type of change applied (insert, update, or delete).
