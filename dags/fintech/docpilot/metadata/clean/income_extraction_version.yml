columns:
  id_external:
    description: "The income extraction external source identifier"
    lineage:
      - datalake_docpilot_raw.incomeextraction_version.id_external
  id_transactional:
    description: "The transactional identifier"
    lineage:
      - datalake_docpilot_raw.incomeextraction_version.transactional_id
  id_end_transactional:
    description: "The end transactional identifier"
    lineage:
      - datalake_docpilot_raw.incomeextraction_version.end_transactional_id
  external_source:
    description: "External source"
    lineage:
      - datalake_docpilot_raw.incomeextraction_version.external_source
  processing_result:
    description: "The processing result of an income extraction"
    lineage:
      - datalake_docpilot_raw.incomeextraction_version.processing_result
  documents_type:
    description: "The type of processed document (ie bank statement or payslip)"
    lineage:
      - datalake_docpilot_raw.incomeextraction_version.documents_type
  extracted_data:
    description: "The data extracted from the submitted document"
    lineage:
      - datalake_docpilot_raw.incomeextraction_version.extracted_data
  errors:
