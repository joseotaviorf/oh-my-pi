    lineage:
      - datalake_docpilot_raw.incomeextraction_version.ts_created_mod
  ts_updated_mod:
    description: "The income_extraction_version update date"
    lineage:
      - datalake_docpilot_raw.incomeextraction_version.ts_updated_mod
