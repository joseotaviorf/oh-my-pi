    lineage:
      - datalake_docpilot_raw.incomeextraction_version.extracted_data_mod
  errors_mod:
    description: Whether the failure details changed in this revision.
    lineage:
      - datalake_docpilot_raw.incomeextraction_version.errors_mod
  ts_created:
