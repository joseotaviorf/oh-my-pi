---
database_name: datalake_docpilot_clean
table_name: processed_message
owner: marcus.silva@quintoandar.com.br
domain: Fintech
description: Record of queue messages already handled by the income extraction worker, used to avoid processing the same message twice.
columns:
  id_subscriber:
    description: Name of the worker consumer that handled the queue message.
    lineage:
      - datalake_docpilot_raw.processedmessage.subscriber_id
  id_message:
    description: Unique identifier of the queue message that was handled.
    lineage:
      - datalake_docpilot_raw.processedmessage.message_id
  ts_created:
    description: When the message was marked as processed.
    lineage:
      - datalake_docpilot_raw.processedmessage.created_at
