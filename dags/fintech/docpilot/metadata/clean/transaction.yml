description: Versioning metadata for income reading changes, recording when each batch of changes was issued and which source originated it.
columns:
  id:
    description: Identifier of the versioning batch for income reading changes.
    lineage:
      - datalake_docpilot_raw.transaction.id
  remote_addr:
    description: Network address from which the change batch was recorded.
    lineage:
      - datalake_docpilot_raw.transaction.remote_addr
  ts_issued:
    description: When the change batch was issued.
    lineage:
      - datalake_docpilot_raw.transaction.issued_at
