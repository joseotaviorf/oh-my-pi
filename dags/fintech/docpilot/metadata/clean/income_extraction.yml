---
database_name: datalake_docpilot_clean
table_name: income_extraction
owner: marcus.silva@quintoandar.com.br
domain: Fintech
description: Results of automated income reading from payslips and bank statements submitted in rental documentation, including processing outcome, document kind, extracted values, and errors.
columns:
  id_external:
    description: Unique identifier of the income document in the upstream documentation system.
    lineage:
      - datalake_docpilot_raw.incomeextraction.id_external
  external_source:
    description: System that submitted the document for income reading (e.g. rental documentation).
    lineage:
      - datalake_docpilot_raw.incomeextraction.external_source
  processing_result:
    description: Overall outcome of the income reading (fully successful, partially successful, or failed).
    lineage:
      - datalake_docpilot_raw.incomeextraction.processing_result
  documents_type:
    description: Kind of income document processed (payslip or bank statement).
    lineage:
      - datalake_docpilot_raw.incomeextraction.documents_type
  extracted_data:
    description: Structured income values and metadata parsed from the submitted files.
    lineage:
      - datalake_docpilot_raw.incomeextraction.extracted_data
  errors:
    description: Structured details of any failure encountered during income reading.
    lineage:
      - datalake_docpilot_raw.incomeextraction.errors
  ts_created:
    description: When the income reading record was first created.
    lineage:
      - datalake_docpilot_raw.incomeextraction.ts_created
  ts_updated:
    description: When the income reading record was last modified.
    lineage:
      - datalake_docpilot_raw.incomeextraction.ts_updated
