database_name: datalake_credit_analysis
table_name: credit_analysis
description: "Enrich table with the credit analysis information"
owner: felipe.chies@quintoandar.com.br
domain: Fintech
columns:
  id_credit_analysis:
    lineage:
      - datalake_sorting_hat_clean.credit_analysis.id_credit_analysis
    description: "Credit analysis id coming from credit analysis clean table(sorting hat)"
  id_proposal:
    lineage:
      - datalake_sorting_hat_clean.credit_analysis.id_proposal
    description: "proposal id from sorting hat microsservice, the same on EBDB and Rental Guarantee."
  id_analyst:
    lineage:
      - datalake_sorting_hat_clean.credit_analysis.id_analyst
    description: "Analyst id coming from credit analysis clean table(sorting hat)"
  bypass:
    lineage:
      - datalake_sorting_hat_clean.credit_analysis.bypass
    description: "Bypass reason"
  category:
    lineage:
      - datalake_sorting_hat_clean.credit_analysis.category
    description: "Category information coming from credit analysis clean table(sorting hat)"
  category_within_ca:
    lineage:
      - datalake_sorting_hat_clean.credit_analysis_version.category
    description: "Same as the category but with the max_ca_category information when the category is null"
  category_within_proposal:
    lineage:
      - datalake_sorting_hat_clean.credit_analysis_version.category
    description: "Same as the category_within_ca but with the last category available on credit_analysis_proposals when the category_within_ca is null"
  documentation_policy:
    lineage:
      - datalake_sorting_hat_clean.credit_analysis.type
    description: "Type information coming from credit analysis clean table(sorting hat)"
  guarantee_category:
    lineage:
      - datalake_credit_analysis.credit_analysis_proposals.guarantee_category
    description: "Category information coming from credit analysis proposals."
  level:
    lineage:
      - datalake_sorting_hat_clean.credit_analysis.level
    description: "level information of the guarantee"
  liquidity:
    lineage:
      - datalake_credit_analysis.credit_analysis_proposals.liquidity
    description: "Liquidity information of the proposal."
  paid_guarantee_type:
    lineage:
      - datalake_credit_analysis.credit_analysis_proposals.paid_guarantee_type
    description: "Type of the paid guarantee"
  standalone_factor:
    lineage:
      - datalake_rental_guarantee_clean.risk_category.category_level
    description: "Standalone factor of the proposal"
  reason:
    lineage:
      - datalake_sorting_hat_clean.credit_analysis.reason
    description: "Reason of the analysis"
  risk_category:
    lineage:
      - datalake_credit_analysis.credit_analysis_proposals.risk_category
    description: "Risk score given by the model result plus the credit policy. Useful, but deprecated in favor to risk_category_canon."
  risk_category_canon:
    lineage:
      - datalake_sorting_hat_clean.screening_result.risk_category_canon
    description: "New risk score given by the credit model."
  internal_score:
    lineage:
      - datalake_credit_analysis.credit_analysis_proposals.internal_score
    description: "Old credit model (internal-score) deprecated."
  max_bypass:
    lineage:
      - datalake_credit_analysis.credit_analysis_proposals.max_bypass
    description: "Bypass reason, if there is one, aggregated by proposal."
  max_ca_category:
    lineage:
      - datalake_sorting_hat_clean.credit_analysis_version.category
    description: "Max ca_category information of the guarantee"
  result:
    lineage:
      - datalake_sorting_hat_clean.credit_analysis.result
    description: "Result of the analysis"
  guarantee_offered:
    description: "If the tenant prospect is not a clear no by income reasons, 5A offers one or more type of guarantee.  The offered guarantee can be paid or free. This column indicates which guarantee was offered to the TP after the evaluation process. The guarantee offered might be null if the credit analysis was transfered or had a later approval to free."
    categories:
      FREE: "The offered guarantee is free"
      PRO_GUARANTOR: "The offered guarantee is the paid guarantee PRO_GUARANTOR"
      DEPOSIT: "The offered guarantee is the paid guarantee DEPOSIT"
      INSURANCE: "The offered guarantee is the paid guarantee INSURANCE"
      STANDALONE: "The offered guarantee is the paid guarantee STANDALONE"
      THIRD_PARTY_GUARANTEE: "The offered guarantee is the paid guarantee THIRD_PARTY_GUARANTEE"
      INSURANCE_OR_DEPOSIT: "The offered guarantee is the paid guarantee INSURANCE or DEPOSIT"
      PRO_GUARANTOR_OR_DEPOSIT: "The offered guarantee is the paid guarantee PRO_GUARANTOR or DEPOSIT"
      CLEAR_NO: "The guarantee was denied to the TP and it could not be offered. It may happen for income reasons, fraud risk or other reasons evaluated by the credit model"
      UNDEFINED: "The offered guarantee could not be calculated. In this case the guarantee category is -1"
  guarantee_accepted:
    lineage:
      - datalake_credit_analysis.credit_analysis_proposals.paid_guarantee_type
    description: "This column indicates the guarantee type accepted by the tenant prospect after a positive evaluation. For paid guarantee, the TP has to accept the offered guarantee to move to the Document Sent step. Free guarantees are automatically accepted. When the TP does not accept the guarantee offered this column is tagged with NOT ACCEPTED. The guarantee accpeted corresponds to the decision made to the last credit analysis submitted within the proposal."
    categories:
      FREE: "The accepted guarantee is free"
      PRO_GUARANTOR: "The accepted guarantee is the paid guarantee PRO_GUARANTOR"
      DEPOSIT: "The accepted guarantee is the paid guarantee DEPOSIT"
      INSURANCE: "The accepted guarantee is the paid guarantee INSURANCE"
      STANDALONE: "The accepted guarantee is the paid guarantee STANDALONE"
      THIRD_PARTY_GUARANTEE: "The accepted guarantee is the paid guarantee THIRD_PARTY_GUARANTEE"
      CLEAR_NO: "When no guarantee was accepted, as it was denied by some reason (such as income reasons)"
      NOT_ACCEPTED: "When 5A has offered a paid guarantee to the TP, but the person has not accepted it."
  is_manual_analysis:
    description: "True if the analysis is manual"
  is_bypass:
    description: "True if the analysis was bypassed."
  is_reprocessed:
    description: "True if the analysis is reprocessed"
  ts_guarantee_accepted:
    lineage:
      - datalake_credit_analysis.credit_analysis_proposals.ts_guarantee_accepted
    description: "Timestamp of the date in which the guarantee was accepted by the tenant prospect."
  ts_credit_analysis_created:
    lineage:
      - datalake_sorting_hat_clean.credit_analysis.ts_created
    description: "Credit analysdis creation timestamp."
