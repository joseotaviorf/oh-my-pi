database_name: datalake_credit_analysis
table_name: credit_engine_analysis_request
owner: isabella.santos@quintoandar.com.br
domain: Fintech
description: One row per analysis request data snapshot submitted to the Sorting Hat credit engine, with external source context (proposal or credit evaluation) and attributes used for automated approval or rejection.
columns:
  id_analysis_request:
    lineage:
      - datalake_sorting_hat_clean.analysis_request.id
    description: Primary key of the analysis request submitted to the Sorting Hat credit engine.
  id_external:
    lineage:
      - datalake_sorting_hat_clean.analysis_request.id_external
    description: Identifier of the external entity driving the request — DocX credit evaluation ID or EBDB proposal ID depending on source type.
  id_proposal:
    lineage:
      - datalake_sorting_hat_clean.analysis_request.id_external
    description: Rental proposal ID when the external source is PROPOSAL (same as id_external in that case).
  id_state_machine:
    lineage:
      - datalake_sorting_hat_clean.analysis_request_data.id_state_machine
    description:  "Foreign key to the related state machine id that retrieved the data. Since there will be a machine for each event, this field identifies the flow that collected the info"
  id_source:
    lineage:
      - datalake_sorting_hat_clean.analysis_request_data.id_source
    description: "Entity ID related to the source. Ex: ‘1234’ could be the unico check process id stored in docx."
  id_credit_analysis:
    lineage:
      - datalake_sorting_hat_clean.analysis_request_data.attributes
    description: Sorting Hat credit analysis ID extracted from request attributes when available.
  id_house:
    lineage:
      - datalake_sorting_hat_clean.analysis_request_data.attributes
    description: EBDB house/listing identifier extracted from request attributes.
  id_offer_firestore:
    lineage:
      - datalake_sorting_hat_clean.analysis_request_data.attributes
    description: Firestore offer document identifier extracted from request attributes.
  bypass:
    lineage:
      - datalake_sorting_hat_clean.analysis_request_data.attributes
    description: Bypass flag from request attributes indicating policy checks were skipped for this request.
  internal_score:
    lineage:
      - datalake_sorting_hat_clean.analysis_request_data.attributes
    description: Legacy internal QuintoAndar credit score from request attributes.
  risk_category:
    lineage:
      - datalake_sorting_hat_clean.analysis_request_data.attributes
    description: Legacy risk score from model plus policy in request attributes; prefer risk_category_canon in downstream tables.
  documentation_policy:
    lineage:
      - datalake_sorting_hat_clean.analysis_request_data.attributes
    description: "Documentation analysis type"
    categories:
      LIGHT_APPROVAL: ""
      FLEX: ""
      FULL: ""
      FULL_CONTROL_GROUP: ""
  category:
    lineage:
      - datalake_sorting_hat_clean.analysis_request_data.attributes
    description: Guarantee category ID from request attributes; join dw_credit.dim_guarantee_policy.
  guarantee_type:
    lineage:
      - datalake_sorting_hat_clean.analysis_request_data.attributes
    description: Guarantee type extracted from request attributes (DEPOSIT, PRO_GUARANTOR, INSURANCE, etc.).
    categories:
      INSURANCE: ""
      DEPOSIT: ""
      PRO_GUARANTOR: ""
      STANDALONE: ""
      THIRD_PARTY_GUARANTEE: ""
  package_value:
    lineage:
      - datalake_sorting_hat_clean.analysis_request_data.attributes
    description: Total monthly rental package (rent + fees + IPTU) submitted for credit evaluation.
  analysis_request_result:
    lineage:
      - datalake_sorting_hat_clean.analysis_request.result
    description: "Result of the analysis request. It can be null when no automatic or manual result is available"
    categories:
      APPROVED: ""
      REJECTED: ""
  business_context:
    lineage:
      - datalake_sorting_hat_clean.analysis_request.business_context
    description: Business context identifier for the analysis request (from Sorting Hat analysis_request.business_context).
  version:
    lineage:
      - datalake_sorting_hat_clean.analysis_request_data.version
    description: "Incremental integer identifying the change of version of the analysis request"
  source_entity:
    lineage:
      - datalake_sorting_hat_clean.analysis_request_data.source_entity
    description: Upstream entity type that supplied data for this request attribute snapshot.
    categories:
      PROPOSAL_DOCUMENTATION: ""
      CONTRACT: ""
      INVOICE: ""
      UNICO_CHECK_PROCESS: ""
      IDWALL_REPORT: ""
      EMAILAGE_RESULT: ""
      INTEGRATION_REPORT: ""
      PROPOSAL: ""
      OFFER: ""
      PROPOSAL_TENANT_DOC_STATUS: ""
      PROPOSAL_CREDIT_ANALYSIS_RESULT: ""
      GUARANTEE: ""
      RECENTLY_ANALYZED_PROPOSALS: ""
  ts_analysis_request_created:
    lineage:
      - datalake_sorting_hat_clean.analysis_request.ts_created
    description: "Analysis request created timestamp"
  ts_analysis_request_updated:
    lineage:
      - datalake_sorting_hat_clean.analysis_request_data.ts_updated
    description: "Analysis request updated timestamp"