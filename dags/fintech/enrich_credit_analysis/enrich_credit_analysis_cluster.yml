cluster:
  type: emr_7_12_consolidation_m_memory_fleet_cluster
  custom_configurations:
    core_nodes:
      target_on_demand: 4
      target_spot: 0
      instance_types:
        - r6g.2xlarge
        - r7g.2xlarge
        - r6i.2xlarge
    task_nodes:
      target_on_demand: 0
      target_spot: 3
      allocation_strategy: price-capacity-optimized
      bid_price_percentage: 100
      instance_types:
        - r6g.2xlarge
        - r7g.2xlarge
        - r6i.2xlarge
    spark_conf:
      spark.sql.autoBroadcastJoinThreshold: "104857600"
      spark.sql.adaptive.autoBroadcastJoinThreshold: "104857600"
      spark.sql.adaptive.advisoryPartitionSizeInBytes: "33554432"
      spark.sql.shuffle.partitions: "560"
      spark.dynamicAllocation.maxExecutors: "17"
      spark.speculation: "true"
      spark.speculation.multiplier: "3"
      spark.speculation.quantile: "0.75"
    autotermination_minutes: 20
