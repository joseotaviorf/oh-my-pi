---
dag:
  name: enrich_credit_analysis
  schedule_start_date: 2020, 7, 1
  owner: Data Fintech
  documentation:
    dag_purpose: |
      Creates enriched tables for the `Credit Analysis` context.
workflow:
  type: query_delta
  layer: enrich
  inner_dependencies:
    credit_analysis:
      - credit_analysis_proposals
cluster:
  type: databricks_13_3_med_general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: "quintoandar_{{ var.value.environment }}"
