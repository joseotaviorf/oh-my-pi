dag:
  name: enrich_losses
  schedule_start_date: 2020, 7, 1
  owner: Data Fintech
  documentation:
    dag_purpose: |
      Creates enriched tables for the `Losses` context, which aims to analyze NPV for Rental Contracts, initially.
      This Dag has a table from the DW as a dependency!
workflow:
  type: query_delta
  layer: enrich
  short_circuit_customization:
    function: CHECK_IS_FIRST_BUSINESS_DAY_OF_MONTH
  inner_dependencies:
    closing:
      - bill_items
    delay:
      - closing
    provision:
      - delay
cluster:
  type: custom_cluster
  databricks_conn_id: databricks_new_env
  custom_configurations:
    driver_node_type_id: r5d.4xlarge
    node_type_id: r5d.8xlarge
    num_workers: 5
    spark_version: 16.4.x-scala2.12
