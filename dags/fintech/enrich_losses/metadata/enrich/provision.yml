database_name: datalake_losses
table_name: provision
description: 'Part of the Losses enrich pipeline. Losses measures the monthly variation of provisioned
  balance for rental contracts. The mathematical steps are: closing (month-end open wallet snapshot) →
  delay (contract-level delay contamination) → provision_factor (lookup of factors 0–1) → provision (open
  invoices at dt_closing with provisioned balance). Summing provisioned balance by closing month yields
  the Losses KPI. provision joins delay to provision_factor and materializes, for each open invoice at
  dt_closing, the applicable provision_factor and provisioned balances (factor × due_amount) across delay-rule
  variants. The operational Losses number is obtained by grouping this table and summing the selected
  provision_balance for the closing month. Note: provision_factor values in this join follow the pre-2026
  Accounting methodology (see provision_factor); closing and delay inputs remain valid.'
owner: juliana.hocihara@quintoandar.com.br
domain: Fintech
