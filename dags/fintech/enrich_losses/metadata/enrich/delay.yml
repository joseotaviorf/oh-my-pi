database_name: datalake_losses
table_name: delay
description: 'Part of the Losses enrich pipeline. Losses measures the monthly variation of provisioned
  balance for rental contracts. The mathematical steps are: closing (month-end open wallet snapshot) →
  delay (contract-level delay contamination) → provision_factor (lookup of factors 0–1) → provision (open
  invoices at dt_closing with provisioned balance). Summing provisioned balance by closing month yields
  the Losses KPI. delay starts from closing (and historical_closing where applicable) and computes contract-level
  delay contamination for open invoices at dt_closing, including deal/negotiation anchors from Trato Feito
  and legacy Retsuko acordo entries. Contaminated delay ranges drive which provision factor applies downstream.'
owner: juliana.hocihara@quintoandar.com.br
domain: Fintech
columns:
  id_invoice:
    lineage:
    - datalake_losses.closing.id_invoice
    - datalake_losses.historical_closing.id_invoice
    description: Invoice identifier in the billing or payments platform.
  id_contract:
    lineage:
    - datalake_losses.closing.id_contract
    - datalake_losses.historical_closing.id_contract
    description: Rental or sale contract identifier linking this financial record to the lease agreement.
  accrual_year_month:
    lineage:
    - datalake_losses.closing.accrual_year_month
    - datalake_losses.historical_closing.accrual_year_month
    description: String with Year number and Month number 'yyyymm' related to the sent date.
  deal_delay_rule_a:
    description: Rule A related to the delay of the payment. In this rule we contaminate all deals invoices
      by the anchor in the negoation and keep the natural debt rolling despite the deal being paid
    lineage:
    - datalake_losses.closing.dt_due
    - datalake_losses.closing.dt_closing
    - datalake_trato_feito_clean.negotiation.ts_created
    - datalake_retsuko.invoice.ts_due
  deal_delay_rule_b:
    description: Rule B related to the delay of the payment. In this rule if the deal is broken we only
      worsen the roll rate if the deal invoice surpasses the delay at the moment in the negotiation.
    lineage:
    - datalake_losses.closing.dt_due
    - datalake_losses.closing.dt_closing
    - datalake_trato_feito_clean.negotiation.ts_created
    - datalake_retsuko.invoice.ts_due
  deal_delay_rule_c:
    description: Rule C related to the delay of the payment. In this rule if the deal is broken then the
      dealis contaminated as of rule A, if not we maintain at the delay at the moment in the negotiation.
    lineage:
    - datalake_losses.closing.dt_due
    - datalake_losses.closing.dt_closing
    - datalake_trato_feito_clean.negotiation.ts_created
    - datalake_retsuko.invoice.ts_due
  deal_delay_rule_d:
    description: Rule D related to the delay of the payment. In this rule if the deal is broken then the
      invoice is contaminated as the delay of the invoice plus the delay at the moment in the negotiation.
    lineage:
    - datalake_losses.closing.dt_due
    - datalake_losses.closing.dt_closing
    - datalake_trato_feito_clean.negotiation.ts_created
    - datalake_retsuko.invoice.ts_due
  deal_delay_rule_e:
    description: Rule E related to the delay of the payment. In this rule if ANY INVOICE is delayed and
      the contract has a active negotiation then the invoice is contaminated as the delay of the invoice
      plus the delay at the moment in the negotiation.
    lineage:
    - datalake_losses.closing.dt_due
    - datalake_losses.closing.dt_closing
    - datalake_trato_feito_clean.negotiation.ts_created
    - datalake_retsuko.invoice.ts_due
  deal_order:
    description: Information related to the deal position.
    lineage:
    - datalake_trato_feito_clean.negotiation.ts_created
    - datalake_losses.closing.id_contract
  deal_status:
    description: Financial attribute representing deal status on the delay dataset.
    lineage:
