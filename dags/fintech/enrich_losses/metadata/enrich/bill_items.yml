---
database_name: datalake_losses
table_name: bill_items
description: "Enrich table with the invoice's bill items"
owner: bianca.martinss@quintoandar.com.br
domain: fintech
columns:
  id_invoice:
    lineage:
      - dw_payment_snapshot.fact_invoice_entries_snapshot.sk_invoice
    description: Invoice ID.
  id_contract:
    lineage:
      - dw_payment_snapshot.fact_invoice_entries_snapshot.id
    description: Contract ID.
  bill_item_name:
    lineage:
      - dw_payment_snapshot.dim_invoice_entry_snapshot.entry_type
    description: Invoice entry type according to bill_item
  bill_item_cluster_name:
    lineage:
      - dw_payment_snapshot.dim_invoice_entry_snapshot.entry_type
    description: A suggestion of group/cluster of bill items. This category was defined by our Data Analytics and Analytics Engineering team. Feel free to use another one.
    categories:
      NEGOTIATION: "Bill items that represent the invoice as a negotiation of a previous debt. Bill items included: DEBIT-NEGOTIATION, COLLECTIONS-NEGOTIATION"
      CONDOMINIUM_DELIQUENCY: "Bill items associated with expenses of condominium, this cluster representes single-time charges due to process of internalization of condominium debt by 5A from the landlord. Bill items included: CONDOMINIUM-5A-PAID, CONDOMINIUM-DEFAULTING, CONDOMINIUM-USAGE"
      EARLY_TERMINATION_FEE: "Bill items that represent the charge due to early termination of contract. Bill items included: EARLY-TERMINATION-FEE"
      FINE: "Bill items that represent late fees due to previous delay. Bill items included: PROPERTY-DAMAGE-FINE, FINE-AND-INTEREST"
      RENTAL_CORE: "Bill items that build the monthly invoices in general. Bill items included: SERVICE-FEE, HOME-INSURANCE, RENTAL, IPTU, IPTU-ADJUSTMENT, IPCA-RENTAL, CONDOMINIUM"
      REPAIR: "Bill items associated with repairs in the house. Bill items included: RESIDENTIAL-PROTECTION-5A-ACQUITTANCE, RESIDENTIAL-PROTECTION-5A-FUND-TRANSFER, REPAIR-OFFBOARDING, REPAIR-ONGOING, NON-PROTECTION-5A, REPAIR-WORK"
      UTILITY_DELIQUENCY: "Bill items that represent default in light, water and/ or gas. Bill items included: LIGHT-WATER-OR-GAS, UTILITIES-DEFAULTING"
      GUARANTEE_RENOVATION: "Bill items dedicated to the charge of guarantee past 12 months from the beginning of the contract. They are charged monthly. Bill items included: RENTAL-GUARANTEE-FEE, PRO-GUARANTOR-5A-INSTALLMENT"
      UNCLASSIFIED: "All bill items not categorized as one of the above options."
  bill_item_due_amount:
    lineage:
      - dw_payment_snapshot.fact_invoice_entries_snapshot.brl_entry_due_amount
    description: Invoice entry due value, considering debit or credit related to the contract cash flow
  dt_closing:
    lineage:
      - dw_public.dim_date.month_end
    description: Last day of the month.
