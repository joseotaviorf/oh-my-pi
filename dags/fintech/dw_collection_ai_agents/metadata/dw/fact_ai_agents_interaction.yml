database_name: dw_collection_ai_agents
table_name: fact_ai_agents_interaction
description: AI agents interaction fact table — one row per chatbot session with bot info, Matthew agent flags (V1, V1.5, V2, and dynamically detected V3-or-later versions), trace context, business signals unified across the V2 observation and V3+ matthew_mcp_observations sources, user wallet snapshot and 2-day post-session payment / overdue-recovery for the user, plus the agglutinated conversation string.
domain: Fintech
owner: juliana.hocihara@quintoandar.com.br
columns:
  id_session:
    lineage:
      - datalake_ai_collections_quintoandar.sessions.id_session
    description: "Internal session ID from the chatbot system."
  id_sauron_session:
    lineage:
      - datalake_ai_collections_quintoandar.sessions.id_sauron_session
    description: "Sauron session ID associated with the chatbot session."
  id_external:
    lineage:
      - datalake_ai_collections_quintoandar.sessions.id_external
    description: "External (Langfuse) session ID used for integration with Langfuse traces and observations."
  id_ticket:
    lineage:
      - datalake_ai_collections_quintoandar.sessions.id_ticket
    description: "Customer support ticket ID associated with the session, when escalated."
  id_user:
    lineage:
      - datalake_ai_collections_quintoandar.sessions.id_user
    description: "Identifier of the user that interacted with the chatbot in this session."
  bot:
    lineage:
      - datalake_ai_collections_quintoandar.sessions.bot
    description: "Bot type that handled the session (matthew or wall-e)."
  first_queue:
    lineage:
      - datalake_ai_collections_quintoandar.sessions.first_queue
    description: "First customer support queue that handled the session."
  last_queue:
    lineage:
      - datalake_ai_collections_quintoandar.sessions.last_queue
    description: "Last customer support queue that handled the session."
  ai_agent_source:
    lineage:
      - datalake_ai_collections_quintoandar.sessions.ai_agent_source
    description: "Source of the AI agent for the session: 'Matthew in Whatsapp', 'Matthew in Chat' when any V1, V1.5, V2, or V3-or-later Matthew signal is detected on a wall-e session, or 'Wall-e'."
  ai_agent_source_legacy:
    lineage:
      - datalake_ai_collections_quintoandar.sessions.ai_agent_source_legacy
    description: "Legacy source of the AI agent for the session, derived from the Langfuse score (value > 0) under SessionContainsMatthewAgentEvaluator or MatthewVersionEvaluator (the latter encodes the version: 0=none, 1=V1, 1.5=V1.5, 2=V2). Kept to reproduce historical metrics that pre-date the observation-based logic; it does not encode V3-or-later agents, which are detected by ai_agent_source and matthew_version."
  is_matthew_in_session:
    lineage:
      - datalake_ai_collections_quintoandar.sessions.is_matthew_in_session
    description: "Boolean flag indicating that any Matthew agent version was detected via observation signals: a V2-or-later collections-agent input or a V1/V1.5 DebtRetrieverTool, UserDebtClassifierTool, or DebtFinderTool signal. Strictly narrower than ai_agent_source because historical bot='matthew' sessions without traces can have ai_agent_source='Matthew in Whatsapp' and is_matthew_in_session=FALSE. For 'was Matthew involved' use ai_agent_source <> 'Wall-e'."
  flag_matthew_talked_to_user:
    lineage:
      - datalake_ai_collections_quintoandar.sessions.flag_matthew_talked_to_user
    description: "1 when Matthew actually spoke to the user in the session, unified across all Matthew agent versions; else 0. Matthew as the WhatsApp host always counts. Inside the Wall-e host, Matthew must be detected and relay a message through the V3-or-later ReactPlanner TalkToUserTool or the legacy V2 CollectionsInput 'RESPOND EXACTLY' instruction. Distinguishes user engagement from sessions where the collections agent only ran tools internally."
  matthew_version:
    lineage:
      - datalake_ai_collections_quintoandar.sessions.matthew_version
    description: "Detected Matthew agent version propagated from sessions. Versioned collectionsagentv<number>input observations dynamically produce V3, V4, V5, and later values, with collectionsagentv1input mapped to V3 for rollout compatibility; legacy signals produce V2, V1.5, or V1. NULL means no version signal, including some historical Whatsapp sessions without traces, and should be handled as an explicit unknown bucket."
  flag_eval_matthew_in_chat:
    lineage:
      - datalake_ai_collections_quintoandar.sessions.flag_eval_matthew_in_chat
    description: "Boolean flag indicating that a V2-or-later Matthew collections agent was active inside an in-app chat session (bot=wall-e plus a recognized collections-agent input). Narrower than is_matthew_in_session and retained as the experiment-eligibility flag."
  is_escalation:
    lineage:
      - datalake_ai_collections_quintoandar.sessions.is_escalation
    description: "Boolean flag indicating that the session was escalated to a human agent."
  flag_session_with_trace:
    lineage:
      - datalake_ai_collections_quintoandar.sessions.flag_session_with_trace
    description: "Boolean flag indicating that the session has at least one Langfuse trace recorded."
  notif_ts_extracted:
    lineage:
      - datalake_ai_collections_quintoandar.sessions.notif_ts_extracted
    description: "Timestamp of the most recent user notification at the time the session started."
  notif_text_extracted:
    lineage:
      - datalake_ai_collections_quintoandar.sessions.notif_text_extracted
    description: "Text of the most recent user notification at the time the session started."
  notif_template_extracted:
    lineage:
      - datalake_ai_collections_quintoandar.sessions.notif_template_extracted
    description: "Template name of the most recent user notification at the time the session started."
  user_roles_raw:
    lineage:
      - datalake_ai_collections_quintoandar.sessions.user_roles_raw
    description: "Raw user roles JSON value seen on the first Langfuse trace input."
  is_tenant:
    lineage:
      - datalake_ai_collections_quintoandar.sessions.is_tenant
    description: "1 if the user_roles seen on the first trace input contains TENANT, else 0."
  is_owner:
    lineage:
      - datalake_ai_collections_quintoandar.sessions.is_owner
    description: "1 if the user_roles seen on the first trace input contains OWNER, else 0."
  is_owner_only:
    lineage:
      - datalake_ai_collections_quintoandar.sessions.is_owner_only
    description: "1 if the user_roles seen on the first trace input contains OWNER and does NOT contain TENANT, else 0."
  max_delay_contaminated_contract_t2:
    lineage:
      - dw_collection_ai_agents.fact_user_wallet_timeline.max_delay_contaminated_contract_t2
    description: "Maximum delay in days for contaminated contracts (Window 2 days) for this user at the session date."
  user_wallet:
    lineage:
      - dw_collection_ai_agents.fact_user_wallet_timeline.user_wallet
    description: "Total open wallet amount in BRL for the user across all contracts at the session date (sum of wallet across the user's contracts in fact_user_wallet_timeline). Used to size the debt the Matthew session is trying to recover."
  user_wallet_overdue_t2:
    lineage:
      - dw_collection_ai_agents.fact_user_wallet_timeline.user_wallet_overdue_t2
    description: "Total overdue wallet amount for the user at the session date (Window 2 days)."
  flag_user_delay:
    lineage:
      - dw_collection_ai_agents.fact_user_wallet_timeline.user_wallet_overdue_t2
    description: "User payment status at session date: 'delay' when user_wallet_overdue_t2 > 0, otherwise 'current'."
  n_contracts:
    lineage:
      - dw_collection_ai_agents.fact_user_wallet_timeline.n_contracts
    description: "Total number of contracts associated with the user at the session date (wallet snapshot). For the count of contracts the V3-or-later MCP agent saw during the conversation, use n_contracts_mcp."
  active_contracts:
    lineage:
      - dw_collection_ai_agents.fact_user_wallet_timeline.active_contracts
    description: "Number of active contracts for the user at the session date."
  contracts:
    lineage:
      - dw_collection_ai_agents.fact_user_wallet_timeline.contracts
    description: "Array of all contract IDs associated with the user at the session date."
  user_overdue_recovered_amount_t2_w_2:
    lineage:
      - dw_collection_ai_agents.fact_user_wallet_timeline.user_overdue_recovered_amount_t2_w_2
    description: "Overdue amount in BRL recovered for the user within a 2-day window starting at the session date (sum across the user's contracts of overdue_recovered_amount_t2 plus the next day, from fact_user_wallet_timeline). Used to compare recovery outcomes across Matthew V2 and V3-or-later sessions."
  user_payment_w_2:
    lineage:
      - dw_collection_ai_agents.fact_user_wallet_timeline.user_payment_w_2
    description: "Total payment amount in BRL recovered for the user within a 2-day window starting at the session date (sum across the user's contracts of recovered_amount plus the next day, from fact_user_wallet_timeline). Used to compare payment outcomes across Matthew V2 and V3-or-later sessions."
  array_open_invoices:
    lineage:
      - dw_collection_ai_agents.fact_user_wallet_timeline.array_open_invoices
    description: "Flattened array of all open invoices across the user's contracts at the session date."
  array_negotiated_invoices:
    lineage:
      - dw_collection_ai_agents.fact_user_wallet_timeline.array_negotiated_invoices
    description: "Flattened array of all negotiated invoices across the user's contracts at the session date."
  array_paid_invoices:
    lineage:
      - dw_collection_ai_agents.fact_user_wallet_timeline.array_paid_invoices
    description: "Flattened array of all paid invoices across the user's contracts at the session date."
  send_proposal_count:
    lineage:
      - datalake_ai_collections_quintoandar.matthew_mcp_observations.send_proposal_count
      - datalake_ai_collections_quintoandar.observation.send_proposal_count
    description: "Number of negotiation proposals presented to the user during the session, unified across versions. V3 onward: distinct Langfuse traces with a successful simulate_negotiation_v1 in matthew_mcp_observations; V2: count of send_proposal observations. 0 when neither source has activity."
  flag_handle_segments_without_proposals:
    lineage:
      - datalake_ai_collections_quintoandar.matthew_mcp_observations.n_contracts_negotiation_options_not_found
      - datalake_ai_collections_quintoandar.observation.flag_handle_segments_without_proposals
    description: "1 when the agent had a customer segment but no negotiation options to offer, unified across versions. V3 onward: matthew_mcp_observations.n_contracts_negotiation_options_not_found > 0; V2: the handle_segments_without_proposals observation. 0 otherwise."
  handle_negotiation_cancelled_count:
    lineage:
      - datalake_ai_collections_quintoandar.observation.confirm_negotiation_count_v3
      - datalake_ai_collections_quintoandar.matthew_mcp_observations.flag_create_negotiation
      - datalake_ai_collections_quintoandar.observation.handle_negotiation_cancelled_count
    description: "Whether a negotiation was confirmed by the user but ultimately not created (cancelled), unified across versions. V3 onward: 1 when the user confirmed (confirm_negotiation_count_v3 > 0) but no negotiation was created (flag_create_negotiation = 0); V2: count of handle_negotiation_cancelled observations. 0 otherwise."
  confirm_negotiation_count:
    lineage:
      - datalake_ai_collections_quintoandar.observation.confirm_negotiation_count_v3
      - datalake_ai_collections_quintoandar.observation.confirm_negotiation_count
    description: "Number of user-confirmed negotiation offers, unified across versions. V3 onward: confirm_negotiation_count_v3 (count of create_negotiation_v1 TOOL observations with null output, each a confirmation prompt); V2: count of confirm_negotiation observations. 0 when no observations recorded."
  flag_create_negotiation:
    lineage:
      - datalake_ai_collections_quintoandar.matthew_mcp_observations.flag_create_negotiation
      - datalake_ai_collections_quintoandar.observation.flag_create_negotiation
    description: "1 when a debt negotiation was successfully created in the session (the main success outcome), unified across versions. V3 onward: matthew_mcp_observations.flag_create_negotiation (a create_negotiation_v1 call succeeded); V2: the create_negotiation observation. 0 otherwise."
  flag_fetch_financial_data:
    lineage:
      - datalake_ai_collections_quintoandar.matthew_mcp_observations.n_financial_context_calls
      - datalake_ai_collections_quintoandar.observation.flag_debt_retriever_tool
      - datalake_ai_collections_quintoandar.observation.flag_debt_finder_tool
      - datalake_ai_collections_quintoandar.observation.flag_user_debt_classifier_tool
      - datalake_ai_collections_quintoandar.observation.flag_has_fetch_collections_data
    description: "1 when the agent fetched the user's financial/collections context in the session, unified across versions. V3 onward: matthew_mcp_observations.n_financial_context_calls > 0 (get_financial_context_v1, the single MCP tool that replaced the V2 fetch/debt tools); V2: OR of flag_debt_retriever_tool, flag_debt_finder_tool, flag_user_debt_classifier_tool, flag_has_fetch_collections_data. 0 otherwise. For granular V2 flags or V3+ MCP call counts, query observation or matthew_mcp_observations directly."
  flag_fetch_financial_data_error:
    lineage:
      - datalake_ai_collections_quintoandar.matthew_mcp_observations.flag_fetch_financial_data_error
      - datalake_ai_collections_quintoandar.observation.flag_has_collections_data_error
      - datalake_ai_collections_quintoandar.observation.flag_has_finance_fetch_error
    description: "1 when fetching the user's financial/collections context failed in the session, unified across versions. V3 onward: matthew_mcp_observations.flag_fetch_financial_data_error (any get_financial_context_v1 downstream call failed, excluding HTTP 404); V2: OR of flag_has_collections_data_error and flag_has_finance_fetch_error. 0 otherwise."
  flag_has_fetch_contracts:
    lineage:
      - datalake_ai_collections_quintoandar.matthew_mcp_observations.n_financial_context_calls
      - datalake_ai_collections_quintoandar.observation.flag_has_fetch_contracts
    description: "1 when the agent attempted to fetch the user's contracts, unified across versions. V3 onward: matthew_mcp_observations.n_financial_context_calls > 0 (contracts are fetched inside get_financial_context_v1); V2: the fetch_contracts observation. 0 otherwise."
  flag_handle_no_contracts:
    lineage:
      - datalake_ai_collections_quintoandar.matthew_mcp_observations.n_contracts
      - datalake_ai_collections_quintoandar.observation.flag_handle_no_contracts
    description: "1 when the user had no contracts available to the agent, unified across versions. V3 onward: matthew_mcp_observations.n_contracts = 0 (GetContracts returned an empty array; NULL n_contracts, meaning no successful call, yields 0); V2: the handle_no_contracts observation. 0 otherwise."
  flag_get_yearly_paid_invoices_report_tool:
    lineage:
      - datalake_ai_collections_quintoandar.matthew_mcp_observations.n_annual_tax_report_calls
      - datalake_ai_collections_quintoandar.matthew_mcp_observations.n_paid_invoices_report_calls
      - datalake_ai_collections_quintoandar.observation.flag_get_yearly_paid_invoices_report_tool
    description: "1 when the yearly paid-invoices (IR / Imposto de Renda) report tool was invoked, unified across versions. V3 onward: n_annual_tax_report_calls > 0 OR n_paid_invoices_report_calls > 0 (get_annual_tax_report_v1 was renamed from get_paid_invoices_annual_report_v1); V2: the get_yearly_paid_invoices_report_tool observation. 0 otherwise. Keeps the V2 node name because it already existed in this table."
  flag_negotiation_proposer_tool:
    lineage:
      - datalake_ai_collections_quintoandar.matthew_mcp_observations.n_simulate_negotiation_calls
      - datalake_ai_collections_quintoandar.observation.flag_negotiation_proposer_tool
    description: "1 when the agent ran the negotiation proposer / simulation, unified across versions. V3 onward: matthew_mcp_observations.n_simulate_negotiation_calls > 0 (simulate_negotiation_v1); V2: the NegotiationProposerTool observation. 0 otherwise."
  flag_ongoing_deal_renegotiation_request_helper:
    lineage:
      - datalake_ai_collections_quintoandar.matthew_mcp_observations.n_ongoing_negotiation_calls
      - datalake_ai_collections_quintoandar.observation.flag_ongoing_deal_renegotiation_request_helper
    description: "1 when the user requested to renegotiate an ongoing deal, unified across versions. V3 onward: matthew_mcp_observations.n_ongoing_negotiation_calls > 0 (get_ongoing_negotiation_information_v1); V2: the ongoing_deal_renegotiation_request_helper observation. 0 otherwise."
  flag_handle_non_tenant:
    lineage:
      - datalake_ai_collections_quintoandar.sessions.is_owner_only
      - datalake_ai_collections_quintoandar.observation.flag_handle_non_tenant
    description: "1 when the user is not a tenant, unified across versions. V3 onward: sessions.is_owner_only = 1 (the tenant gate moved to the host, so the collections agent is not called for non-tenants); V2: the handle_non_tenant observation. 0 otherwise."
  flag_empty_invoices_mismatch:
    lineage:
      - datalake_ai_collections_quintoandar.matthew_mcp_observations.flag_all_empty_invoices
      - dw_collection_ai_agents.fact_user_wallet_timeline.array_open_invoices
      - dw_collection_ai_agents.fact_user_wallet_timeline.array_paid_invoices
      - dw_collection_ai_agents.fact_user_wallet_timeline.array_negotiated_invoices
    description: "Data-quality cross-check for V3-or-later MCP agents. 1 when the agent saw only empty invoices (flag_all_empty_invoices_mcp = 1) yet the user wallet snapshot at the session date has invoices; else 0. Flags sessions where the agent's financial context disagreed with the wallet timeline."
  flag_no_contracts_mismatch:
    lineage:
      - datalake_ai_collections_quintoandar.observation.flag_handle_no_contracts
      - datalake_ai_collections_quintoandar.matthew_mcp_observations.n_contracts
      - dw_collection_ai_agents.fact_user_wallet_timeline.n_contracts
    description: "Data-quality cross-check. 1 when the agent concluded the user had no contracts (V2 flag_handle_no_contracts = 1 or V3+ n_contracts_mcp = 0) yet the user wallet snapshot shows contracts (fact_user_wallet_timeline.n_contracts > 0); else 0."
  flag_has_prorated_rent:
    lineage:
      - datalake_ai_collections_quintoandar.observation.has_prorated_rent_error
    description: "1 when an annual-tax / paid-invoices report tool output in the session mentioned prorated-rent adjustments that prevent a clean invoice summary; else 0. Sourced from Langfuse TOOL output and available for V2 and V3-or-later sessions."
  flag_outbound_responsibility_helper:
    lineage:
      - datalake_ai_collections_quintoandar.observation.flag_outbound_responsibility_helper
    description: "1 when the Matthew host invoked outbound_debt_responsibility_denial_helper at least once in the session (user denied responsibility for an outbound debt reminder); else 0. Matthew WhatsApp host signal only."
  flag_authentication_helper:
    lineage:
      - datalake_ai_collections_quintoandar.observation.flag_authentication_helper
    description: "1 when the Matthew host invoked authentication_helper at least once in the session (WhatsApp login guidance after auth failure or user login confusion); else 0. Distinct from authentication_failure_helper. Matthew WhatsApp host signal only."
  eval_payin_resolution:
    lineage:
      - datalake_ai_collections_quintoandar.matthew_payin_evals.eval_payin_resolution
    description: "Latest PayinResolutionEvaluator numeric outcome for Matthew WhatsApp sessions (1 = pay-in conversation resolved, 0 = not resolved). NULL when the session was not sampled by the online eval job or the evaluator did not run. Discrete 0/1 encoding — never average; compute the rate of 1s among judged sessions. Always NULL for Matthew-in-Chat."
    categories:
      "0": Pay-in conversation judged as not resolved.
      "1": Pay-in conversation judged as resolved.
  eval_payin_failure_diagnosis:
    lineage:
      - datalake_ai_collections_quintoandar.matthew_payin_evals.eval_payin_failure_diagnosis
    description: "Latest PayinFailureDiagnosisEval categorical label for why the pay-in conversation failed or was out of scope. NULL when the session was not judged. Always NULL for Matthew-in-Chat. Do not treat NULL as a negative."
    categories:
      FORA_DE_ESCOPO: Conversation judged out of Matthew pay-in scope.
      SEM_CONTRATO: Failure attributed to no contract found.
      SEM_CAPACIDADE: Failure attributed to Matthew lacking capability for the request.
      FALHA_DE_COMPORTAMENTO: Failure attributed to agent behavior in the conversation.
  eval_payin_frustration:
    lineage:
      - datalake_ai_collections_quintoandar.matthew_payin_evals.eval_payin_frustration
    description: "Latest PayinFrustrationEval categorical label for user frustration in the pay-in conversation. NULL when the session was not judged. Always NULL for Matthew-in-Chat. Do not treat NULL as a negative."
    categories:
      SEM_FRUSTRACAO: No frustration detected.
      FRUSTRACAO_GERAL: General frustration, not directed at the bot.
      FRUSTRACAO_COM_O_BOT: Frustration directed at the bot.
  is_notification_reply:
    lineage:
      - datalake_ai_collections_quintoandar.observation.is_notification_reply
    description: "1 if the session contains the outbound_payload_from_dto observation (reply to a Matthew-driven reminder), else 0 (absent or no observations recorded)."
  flag_escalation_attempted:
    lineage:
      - datalake_ai_collections_quintoandar.sessions.flag_escalation_attempted
    description: "1 if the agent ATTEMPTED to escalate the user to human support in the session (any trace emitted a human_escalation response, $.responses[0].response_type = 'human_escalation' in traces.output); else 0. This is the agent's attempt, not the outcome: an attempt only becomes an actual escalation when it happens within human-support working hours, which is why this can be 1 while is_escalation is false. Propagated from the enrich sessions table, aggregated over every trace of the session and derived name-agnostically from the trace output, so it is independent of which agent/tool produced the escalation (escalate_tool, HumanEscalationAgentV7Input, etc.)."
  matthew_declared_escalation_reason:
    lineage:
      - datalake_ai_collections_quintoandar.sessions.matthew_declared_escalation_reason
    description: "Free-text reason the agent gave for attempting to escalate the user to human support, propagated from the enrich sessions table. Populated whenever flag_escalation_attempted = 1, regardless of whether it resulted in an actual escalation. NULL when no trace in the session emitted a human_escalation response."
  matthew_declared_escalation_queue:
    lineage:
      - datalake_ai_collections_quintoandar.sessions.matthew_declared_escalation_queue
    description: "Queue the agent attempted to route the escalation to, propagated from the enrich sessions table. Reflects the agent's intended target when flag_escalation_attempted = 1, not necessarily where the session was actually routed. Distinct from first_queue / last_queue, which are the queues that actually handled the session. NULL when no trace in the session emitted a human_escalation response."
  ts_first_observation:
    lineage:
      - datalake_ai_collections_quintoandar.observation.ts_first_observation
    description: "Timestamp of the first Langfuse observation recorded for the session."
  ts_last_observation:
    lineage:
      - datalake_ai_collections_quintoandar.observation.ts_last_observation
    description: "Timestamp of the last Langfuse observation recorded for the session."
  n_contracts_mcp:
    lineage:
      - datalake_ai_collections_quintoandar.matthew_mcp_observations.n_contracts
    description: "V3 onward. Number of rental contracts the MCP agent saw for the user during the conversation (GetContracts response length inside get_financial_context_v1). NULL for V2 sessions or when no successful GetContracts call exists; 0 means no contracts. For the wallet-snapshot contract count use n_contracts."
  flag_all_empty_invoices_mcp:
    lineage:
      - datalake_ai_collections_quintoandar.matthew_mcp_observations.flag_all_empty_invoices
    description: "V3 onward. 1 when every GetInvoicesForContract / GetDetailedBills downstream call returned empty (nothing to collect), 0 when at least one returned a non-empty response, NULL when neither call type appears in the session or for V2 sessions."
  user_segment:
    lineage:
      - datalake_ai_collections_quintoandar.matthew_mcp_observations.user_segment
    description: "V3 onward. ChargeHub customer segment guiding how the MCP agent should approach the debt (e.g. EVICTIONS). NULL for V2 sessions or when no GetCustomerSegment call exists."
  negotiation_options_list:
    lineage:
      - datalake_ai_collections_quintoandar.matthew_mcp_observations.negotiation_options_list
    description: "V3 onward. JSON array text of available negotiation option keys offered to the customer (e.g. [\"pixleto-1x-lpf\",\"cc-lpf\"]) from the first successful non-empty GetNegotiationOptions call. NULL for V2 sessions or when no eligible options were returned."
  created_negotiation_option_key:
    lineage:
      - datalake_ai_collections_quintoandar.matthew_mcp_observations.created_negotiation_option_key
    description: "V3 onward. Negotiation option key the customer chose when a deal was closed. NULL for V2 sessions or when no successful create_negotiation_v1 call occurred."
  created_negotiation_payment_method:
    lineage:
      - datalake_ai_collections_quintoandar.matthew_mcp_observations.created_negotiation_payment_method
    description: "V3 onward. Payment method used when a deal was closed (BOLETO, PIX or CREDIT_CARD). NULL for V2 sessions or when no successful create_negotiation_v1 call occurred."
  flag_negotiation_created_missing_payment_info:
    lineage:
      - datalake_ai_collections_quintoandar.matthew_mcp_observations.flag_negotiation_created_missing_payment_info
    description: "V3 onward. 1 when a deal was created but the final payment instructions were likely never shown to the customer (no successful GetOngoingNegotiation without an empty response was recorded after creation); else 0. NULL for V2 sessions."
  ts_first_mcp_call:
    lineage:
      - datalake_ai_collections_quintoandar.matthew_mcp_observations.ts_first_mcp_call
    description: "V3 onward. Timestamp of the earliest MCP tool request in the session. NULL for V2 sessions."
  ts_last_mcp_call:
    lineage:
      - datalake_ai_collections_quintoandar.matthew_mcp_observations.ts_last_mcp_call
    description: "V3 onward. Timestamp of the latest MCP tool request in the session. NULL for V2 sessions."
  matthew_model:
    lineage:
      - datalake_ai_collections_quintoandar.matthew_llm_metrics.matthew_model
    description: "LLM model used by the collections agent in the session (e.g. openai/gpt-4o-2024-11-20, openai/gpt-5.4-mini-2026-03-17). One model per session. Primary dimension for comparing Matthew across models. Distinct from matthew_version (agent architecture generation). NULL when no collections-agent LLM call was recorded."
  matthew_host_version:
    lineage:
      - datalake_ai_collections_quintoandar.matthew_llm_metrics.matthew_host_version
    description: "Matthew WhatsApp host planner version tag from the first Host - HostPlanner GENERATION in the session: V1 for openai/gpt-4o-2024-11-20, V2 for openai/gpt-5.6-luna. NULL for other host models, Matthew-in-Chat (Wall-e host), or when no host planner call exists. Distinct from matthew_version (collections-agent architecture) and matthew_model (collections-agent LLM)."
  n_agent_messages:
    lineage:
      - datalake_ai_collections_quintoandar.matthew_llm_metrics.n_agent_messages
    description: "Number of messages (Langfuse traces) in the session in which the collections agent called the LLM at least once."
  n_llm_calls:
    lineage:
      - datalake_ai_collections_quintoandar.matthew_llm_metrics.n_llm_calls
    description: "Total number of collections-agent LLM calls in the session."
  total_llm_cost:
    lineage:
      - datalake_ai_collections_quintoandar.matthew_llm_metrics.total_llm_cost
    description: "Total cost in USD of all LLM calls in the session (collections agent plus host-side moderator and answer processor)."
  total_collections_agent_cost:
    lineage:
      - datalake_ai_collections_quintoandar.matthew_llm_metrics.total_collections_agent_cost
    description: "Total cost in USD of the collections-agent LLM calls in the session (excludes host-side moderator and answer-processor LLM cost)."
  total_message_latency_sum:
    lineage:
      - datalake_ai_collections_quintoandar.matthew_llm_metrics.total_message_latency_sum
    description: "Sum in seconds of total message wall-clock latency across the session's agent messages."
  collections_agent_latency_sum:
    lineage:
      - datalake_ai_collections_quintoandar.matthew_llm_metrics.collections_agent_latency_sum
    description: "Sum in seconds of collections-agent total latency across the session's agent messages (time spent inside the collections agent per message)."
  collections_agent_llm_latency_sum:
    lineage:
      - datalake_ai_collections_quintoandar.matthew_llm_metrics.collections_agent_llm_latency_sum
    description: "Sum in seconds of collections-agent LLM call latency across the session."
  flag_session_had_timeout:
    lineage:
      - datalake_ai_collections_quintoandar.matthew_llm_metrics.flag_session_had_timeout
    description: "1 if any message in the session had a collections-agent timeout (collections-agent-input observation with level = 'ERROR'), else 0."
  full_conversation:
    lineage:
      - datalake_ai_collections_quintoandar.messages.full_conversation
    description: "Single string with all session messages prefixed by their role or user identifier and joined by newline, ordered chronologically; intended for downstream LLM analysis."
  dt_session_created:
    lineage:
      - datalake_ai_collections_quintoandar.sessions.dt_session_created
    description: "Date when the session was created."
  ts_created:
    lineage:
      - datalake_ai_collections_quintoandar.sessions.ts_created
    description: "Timestamp when the session was created."
  ts_updated:
    lineage:
      - datalake_ai_collections_quintoandar.sessions.ts_updated
    description: "Timestamp when the session was last updated."
