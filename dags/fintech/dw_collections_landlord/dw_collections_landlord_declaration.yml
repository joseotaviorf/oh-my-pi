dag:
  name: dw_collections_landlord
  schedule_start_date: 2025, 12, 5
  owner: Data Fintech
  documentation:
    dag_purpose: Creates tables for collections landlord analysis in QuintoAndar context.
workflow:
  type: query_delta
  layer: dw
  custom_schema: collections_landlord
  default_extraction_type: incremental
  default_partitions: [year, month, day]
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, -30), 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, 1), 'load_end_date') }}"
  inner_dependencies:
    fact_landlord_deal_installment_match:
      - fact_invoice_landlord_portfolio
    fact_overdue_portfolio_timeline:
      - fact_landlord_deal_installment_match
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: r5d.2xlarge
    node_type_id: m5d.8xlarge
    spark_version: 16.4.x-scala2.12
    num_workers: 4
  databricks_conn_id: databricks_new_env
