    description: Invoice due date
  dt_due_adjusted:
    lineage:
    - dw_collections_segmentation.fact_invoice_landlord_portfolio.dt_due_adjusted
    description: Adjusted due date after payment term changes on the overdue invoice.
  dt_created:
