database_name: dw_collections_landlord
table_name: fact_overdue_portfolio_timeline
description: Timeline of overdue portfolio data for landlords with invoice status
  evolution and recovery tracking
domain: Fintech
owner: juliana.hocihara@quintoandar.com.br
columns:
  sk_overdue_portfolio_timeline:
    lineage:
    - dw_collections_landlord.fact_invoice_landlord_portfolio.id_invoice
    - dw_collections_landlord.fact_invoice_landlord_portfolio.id_contract
    - dw_collections_landlord.fact_invoice_landlord_portfolio.dt_reference
    description: Surrogate key of the table. It is generated by concatenating the
      invoice ID, contract ID, and the reference date (formatted as 'yyyyMMdd').
  flag_delay:
    lineage:
    - dw_collections_segmentation.fact_invoice_landlord_portfolio.dt_due
    - dw_collections_segmentation.fact_invoice_landlord_portfolio.dt_end
    description: Flag indicating if invoice is delayed on the reference date
  flag_delay_t1:
    lineage:
    - dw_collections_segmentation.fact_invoice_landlord_portfolio.dt_due
    - dw_collections_segmentation.fact_landlord_deal_installment_match.dt_due_deal
    description: Flag indicating if invoice is delayed considering original or deal
      invoice due date
  delay_t2:
    lineage:
    - dw_collections_segmentation.fact_invoice_landlord_portfolio.dt_due
    description: Delay in days (T2) calculated from due date to reference date
  dt_reference:
    lineage:
    - dw_collections_segmentation.fact_invoice_landlord_portfolio.dt_begin
    - dw_collections_segmentation.fact_invoice_landlord_portfolio.dt_end
    description: Reference date for the timeline snapshot
  id_invoice:
    lineage:
    - dw_collections_segmentation.fact_invoice_landlord_portfolio.id_invoice
    description: External invoice identifier in the overdue portfolio timeline grain.
  id_contract:
    lineage:
    - dw_collections_segmentation.fact_invoice_landlord_portfolio.id_contract
    description: External contract identifier linked to the overdue portfolio invoice.
  dt_begin:
    lineage:
    - dw_collections_segmentation.fact_invoice_landlord_portfolio.dt_begin
    description: Invoice begin date
  dt_ended_official:
    lineage:
    - dw_collections_segmentation.fact_invoice_landlord_portfolio.dt_end
    - dw_collections_segmentation.fact_landlord_deal_installment_match.dt_end_deal
    description: Official end date of invoice considering deal extension
  flag_deal_existence:
    lineage:
    - dw_collections_segmentation.fact_landlord_deal_installment_match.id_invoice_deal
    description: Flag indicating if a deal invoice exists for the original invoice
  flag_days_extended_outside_invoice:
    lineage:
    - dw_collections_segmentation.fact_invoice_landlord_portfolio.dt_end
    description: Flag indicating if reference date extends beyond invoice end date
  invoice_status_timeline:
    lineage:
    - dw_collections_segmentation.fact_invoice_landlord_portfolio.status
    - dw_collections_segmentation.fact_landlord_deal_installment_match.status_deal
    description: Invoice status on the timeline (open, paid, canceled, deal-open,
      deal-paid, etc.)
  invoice_life_status_timeline:
    lineage:
    - dw_collections_segmentation.fact_invoice_landlord_portfolio.status
    - dw_collections_segmentation.fact_landlord_deal_installment_match.dt_paid_deal
    description: Invoice life status on timeline (original-life or deal-extended-life)
  flag_deal_installment_match:
    lineage:
    - dw_collections_segmentation.fact_invoice_landlord_portfolio.tipo_fat
    - dw_collections_segmentation.fact_landlord_deal_installment_match.id_invoice_deal
    description: Flag indicating deal installment match classification
  tipo_fat:
    lineage:
    - dw_collections_segmentation.fact_invoice_landlord_portfolio.tipo_fat
    description: Invoice type (original_invoice or deal_invoice)
  flag_invoice_nulled_by_encontro:
    lineage:
    - dw_collections_segmentation.fact_invoice_landlord_portfolio.flag_invoice_nulled_by_encontro
    description: Flag indicating if invoice was nulled by encontro de contas
  due_amount_adjustment:
    lineage:
    - dw_collections_segmentation.fact_invoice_landlord_portfolio.due_amount_adjustment
    description: Adjusted due amount after corrections on the overdue invoice.
  invoice_user:
    lineage:
    - dw_collections_segmentation.fact_invoice_landlord_portfolio.invoice_user
    description: Type of invoice user (landlord) in the overdue portfolio snapshot.
  id_account:
    lineage:
    - dw_collections_segmentation.fact_invoice_landlord_portfolio.id_account
    description: Retsuko account identifier associated with the overdue invoice.
  status:
    lineage:
    - dw_collections_segmentation.fact_invoice_landlord_portfolio.status
    description: Operational status of the overdue invoice at the timeline reference
      date.
  payment_status:
    lineage:
    - dw_collections_segmentation.fact_invoice_landlord_portfolio.payment_status
    description: Payment settlement status of the overdue invoice record.
  purpose:
    lineage:
    - dw_collections_segmentation.fact_invoice_landlord_portfolio.purpose
    description: Business purpose code explaining why the overdue invoice was issued.
  reason:
    lineage:
    - dw_collections_segmentation.fact_invoice_landlord_portfolio.reason
    description: Reason code describing the overdue invoice billing context.
  country_code:
    lineage:
    - dw_collections_segmentation.fact_invoice_landlord_portfolio.country_code
    description: ISO country code of the overdue invoice billing jurisdiction.
  due_amount:
    lineage:
    - dw_collections_segmentation.fact_invoice_landlord_portfolio.due_amount
    description: Monetary amount still outstanding on the overdue invoice.
  paid_amount:
    lineage:
    - dw_collections_segmentation.fact_invoice_landlord_portfolio.paid_amount
    description: Monetary amount already paid against the overdue invoice.
  accrual_year_month:
    lineage:
    - dw_collections_segmentation.fact_invoice_landlord_portfolio.accrual_year_month
    description: Accrual year-month period assigned to the overdue invoice.
  dt_end:
    lineage:
