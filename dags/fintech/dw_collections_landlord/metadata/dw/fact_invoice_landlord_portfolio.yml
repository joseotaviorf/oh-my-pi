database_name: dw_collections_landlord
table_name: fact_invoice_landlord_portfolio
description: Invoices from landlords for rent to be collected within collections journey with bill items breakdown and invoice status information
domain: Fintech
owner: juliana.hocihara@quintoandar.com.br
columns:
  id_invoice:
    lineage:
    - datalake_retsuko.invoice.id_external
    description: External invoice identifier
  invoice_user:
    lineage:
    - datalake_retsuko.invoice_info.invoice_user
    description: Type of invoice user (landlord)
  id_contract:
    lineage:
