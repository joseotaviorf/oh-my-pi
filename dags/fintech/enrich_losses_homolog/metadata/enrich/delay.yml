---
database_name: datalake_losses_homolog
table_name: delay
description: "Enrich table with the losses model informations for the fact tables"
owner: felipe.chies@quintoandar.com.br
domain: fintech
columns:
  id_invoice:
    lineage:
      - datalake_losses_homolog.closing.id_invoice
      - datalake_losses_homolog.historical_closing.id_invoice
    description: Id of the invoice.
  id_contract:
    lineage:
      - datalake_losses_homolog.closing.id_contract
      - datalake_losses_homolog.historical_closing.id_contract
    description: Id of the contract.
  accrual_year_month:
    lineage:
      - datalake_losses_homolog.closing.accrual_year_month
      - datalake_losses_homolog.historical_closing.accrual_year_month
    description: String with Year number and Month number 'yyyymm' related to the sent date.
  deal_delay_rule_a:
    description: Rule A related to the delay of the payment. In this rule we contaminate all deals invoices by the anchor in the negoation and keep the natural debt rolling despite the deal being paid
  deal_delay_rule_b:
    description: Rule B related to the delay of the payment. In this rule if the deal is broken we only worsen the roll rate if the deal invoice surpasses the delay at the moment in the negotiation.
  deal_delay_rule_c:
    description: Rule C related to the delay of the payment. In this rule if the deal is broken then the dealis contaminated as of rule A, if not we maintain at the delay at the moment in the negotiation.
  deal_delay_rule_d:
    description: Rule D related to the delay of the payment. In this rule if the deal is broken then the invoice is contaminated as the delay of the invoice plus the delay at the moment in the negotiation.
  deal_delay_rule_e:
    description: Rule E related to the delay of the payment. In this rule if ANY INVOICE is delayed and the contract has a active negotiation then the invoice is contaminated as the delay of the invoice plus the delay at the moment in the negotiation.
  deal_order:
    description: Information related to the deal position.
  deal_status:
    description: Status of the deal.
  delay_at_deal_creation:
    description: Date difference between deal_anchor_due_date and dt_created_deal.
  bigger_anchor_deal_at_contract:
    description: The worst debt in active negotiation for the contact.
  delay_contaminated_range_rule_a:
    description: Minimun value for deal_delay_rule_A.
  delay_contaminated_range_rule_b:
    description: Minimun value for deal_delay_rule_B.
  delay_contaminated_range_rule_c:
    description: Minimun value for deal_delay_rule_C.
  delay_contaminated_range_rule_d:
    description: Minimun value for deal_delay_rule_D.
  delay_contaminated_range_rule_e:
    description: Minimun value for deal_delay_rule_E.
  delay_invoice_range_a:
    description: Delay invoice applied range according to the deal_delay_rule information.
  delay_invoice_range_b:
    description: Delay invoice applied range according to the deal_delay_rule information.
  delay_invoice_range_d:
    description: Delay invoice applied range according to the deal_delay_rule information.
  delay_invoice_range_e:
    description: Delay invoice applied range according to the deal_delay_rule information.
  delay_invoice_range:
    description: Delay invoice range being applied to the invoice.
  delay_contamined_range_a:
    description: Range of the delay in days according to the pd_range_rule information.
  delay_contamined_range_b:
    description: Range of the delay in days according to the pd_range_rule information.
  delay_contamined_range_d:
    description: Range of the delay in days according to the pd_range_rule information.
  delay_contamined_range_e:
    description: Range of the delay in days according to the pd_range_rule information.
  delay_contamined_range:
    description: Range of the delay in days being applied to the invoice.
  delta_days:
    description: Date difference between dt_due_adjs and dt_closing.
  due_amount:
    lineage:
      - datalake_losses_homolog.closing.due_amount
      - datalake_losses_homolog.historical_closing.due_amount
    description: Total value of the invoice.
  frequency:
    lineage:
      - datalake_losses_homolog.closing.frequency
      - datalake_losses_homolog.historical_closing.frequency
    description: Frequency of the payment.
  payment_status:
    lineage:
      - datalake_losses_homolog.closing.payment_status
      - datalake_losses_homolog.historical_closing.payment_status
    description: Invoice status of payment i.e if it is open, paid, canceled or was written down
  invoice_competence_renegotiated:
    description: Competence information of the renegotiation of the invoice.
  full_delay_at_deal:
    description: Date difference between deal_anchor_due_date and dt_closing.
  guarantee_type:
    description: Guarantee information related to the invoice.
  pd_range_rule_a:
    description: Range of the delay in days related to Rule A.
  pd_range_rule_b:
    description: Range of the delay in days related to Rule B.
  pd_range_rule_c:
    description: Range of the delay in days related to Rule C.
  pd_range_rule_d:
    description: Range of the delay in days related to Rule D.
  pd_range_rule_e:
    description: Range of the delay in days related to Rule E.
  risk_type:
    description: Risk type of the deal.
  user:
    lineage:
      - datalake_losses_homolog.closing.user
      - datalake_losses_homolog.historical_closing.user
    description: User information related to the invoice.
  is_before_started:
    lineage:
      - datalake_losses_homolog.closing.is_before_started
      - datalake_losses_homolog.historical_closing.is_before_started
    description: Flag to show if the date is before started.
  is_contract_with_deal:
    description: Flag to show if the contract had deal.
  is_hr:
    description: Flag to identify if the deal is high risk.
  is_invoice_deal:
    description: Flag to identify if the invoice has deal.
  is_international:
    lineage:
      - datalake_losses_homolog.closing.is_international
      - datalake_losses_homolog.historical_closing.is_international
    description: Flag to show if the invoice is international.
  is_writtendown_in_dead_time:
    lineage:
      - datalake_losses_homolog.closing.is_writtendown_in_dead_time
      - datalake_losses_homolog.historical_closing.is_writtendown_in_dead_time
    description: Flag to show if the invoice is writtendown in dead time.
  has_repair_offboarding_bill_item:
    description: Flag to indicate the existence of 'repair offboarding' bill item for an invoice
  dt_closing:
    lineage:
      - datalake_losses_homolog.closing.dt_closing
      - datalake_losses_homolog.historical_closing.dt_closing
    description: Last day of the month.
  dt_created_deal:
    description: Date of the deal creation.
  dt_due_adjs:
    description: Due date of the deal.
  dt_due_deal_anchor:
    description: Due date of the deal anchor.
  dt_due_general_accrual:
    description: Due date accrual.
  dt_paid_adjs:
    description: Payment date of the deal.
  dt_snapshot:
    lineage:
      - datalake_losses_homolog.closing.dt_snapshot
      - datalake_losses_homolog.historical_closing.dt_snapshot
    description: Date of the snapshot.
