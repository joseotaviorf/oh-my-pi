inner_dependencies:
  tickets:
    - tickets_history
tables:
  group_memberships:
    is_incremental: false
  groups:
    is_incremental: false
  organizations:
    is_incremental: false
  satisfaction_ratings:
    is_incremental: false
  ticket_fields:
    is_incremental: false
  ticket_metrics:
    is_incremental: false
  tickets_history:
    no_raw: true
    is_incremental: true
    has_create_external_table: false
    partition_cols: ["year", "month", "day"]
  tickets:
    is_incremental: false
    partition_cols: ["year", "month", "day"]
  users:
    is_incremental: false
  ticket_audits:
    is_incremental: true
    partition_cols: ["year", "month", "day"]

custom_cluster:
  driver_node_type_id: r5d.large
  node_type_id: r5d.large
  runtime_engine: PHOTON
  autoscale:
    min_workers: 2
    max_workers: 6
  spark_conf:
    spark.driver.maxResultSize: "0"
