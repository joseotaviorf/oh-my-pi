database_name: datalake_velo_zendesk_clean
table_name: organizations
description:
  The Zendesk service was discontinued in July 2026.
  One row per organizations from the Velo property management and condominium
  billing platform, ingested for QuintoAndar fintech reconciliation and
  accounts payable analytics.
