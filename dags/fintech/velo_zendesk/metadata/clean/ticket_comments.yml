database_name: datalake_velo_zendesk_clean
table_name: ticket_comments
domain: Fintech
description: "Table containing comments from Velo Zendesk tickets"
columns:
  id:
    description: "Ticket comment identification number (ID)"
    lineage:
      - datalake_velo_zendesk_raw.ticket_comments.id
  id_audit:
    description: "Ticket audit identification number (ID)"
    lineage:
      - datalake_velo_zendesk_raw.ticket_comments.audit_id
  id_author:
    description: "ID of the author of the comment"
    lineage:
      - datalake_velo_zendesk_raw.ticket_comments.author_id
  id_ticket:
    description: "Ticket identification number (ID)"
    lineage:
      - datalake_velo_zendesk_raw.ticket_comments.ticket_id
  attachments:
    description: "Attachments included in the comment"
    lineage:
      - datalake_velo_zendesk_raw.ticket_comments.attachments
  body:
    description: "HTML body of the comment"
    lineage:
      - datalake_velo_zendesk_raw.ticket_comments.body
  plain_body:
    description: "Plain text body of the comment"
    lineage:
      - datalake_velo_zendesk_raw.ticket_comments.plain_body
  event_type:
    description: "Zendesk event type that originated the comment"
    lineage:
      - datalake_velo_zendesk_raw.ticket_comments.event_type
  type:
    description: "Type of the comment event"
    lineage:
      - datalake_velo_zendesk_raw.ticket_comments.type
  via:
    description: "Channel metadata for the comment"
    lineage:
      - datalake_velo_zendesk_raw.ticket_comments.via
  is_public:
    description: "Flag indicating if the comment is public or internal"
    lineage:
      - datalake_velo_zendesk_raw.ticket_comments.public
  dt_extracted:
    description: "Date when the comment was extracted"
    lineage:
      - datalake_velo_zendesk_raw.ticket_comments.dt
  ts_created:
    description: "Timestamp when the comment was created"
    lineage:
      - datalake_velo_zendesk_raw.ticket_comments.created_at
  year:
    description: "Year when the comment was extracted"
    lineage:
      - datalake_velo_zendesk_raw.ticket_comments.dt
  month:
    description: "Month when the comment was extracted"
    lineage:
      - datalake_velo_zendesk_raw.ticket_comments.dt
  day:
    description: "Day when the comment was extracted"
    lineage:
      - datalake_velo_zendesk_raw.ticket_comments.dt
