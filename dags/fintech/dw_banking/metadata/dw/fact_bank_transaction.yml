database_name: dw_bank # legacy schema
table_name: fact_bank_transaction
description: fact table containing bank transaction keys and indicators
domain: Fintech
owner: ae-finance-fintech@quintoandar.com.br
columns:
  sk_bank_transaction:
    lineage:
      - datalake_ebdb_clean.account_transaction.id
    description: "Table's unique identification number"
  sk_bank_account:
    lineage:
      - datalake_ebdb_clean.account_transaction.id_account
    description: "Identification number of the account"
  sk_user_recipient:
    lineage:
      - datalake_ebdb_clean.user.id
