  id_house:
    lineage:
      - datalake_ebdb_clean.account_transaction.id_house
    description: "House identification number"
  value:
    lineage:
      - datalake_ebdb_clean.account_transaction.value
    description: "Transaction value"
  type:
    lineage:
      - datalake_ebdb_clean.account_transaction.type
    description: "Transaction type description"
  ts_transaction:
    lineage:
      - datalake_ebdb_clean.account_transaction.ts_transaction
    description: "Timestamp when the transaction occured"
  ts_updated:
    lineage:
      - datalake_ebdb_clean.account_transaction.ts_updated
    description: "Update timestamp"
  ts_created:
    lineage:
      - datalake_ebdb_clean.account_transaction.ts_created
