---
dag:
  name: enrich_docpilot
  schedule_start_date: 2024, 10, 30
  owner: Data Fintech
  documentation:
    dag_purpose: |
      This DAG creates the full table for DocPilot data enrichment, with information about income extraction processing.
workflow:
  type: query_delta
  layer: enrich
cluster:
  type: databricks_12_2_med_general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: "quintoandar_{{ var.value.environment }}"
