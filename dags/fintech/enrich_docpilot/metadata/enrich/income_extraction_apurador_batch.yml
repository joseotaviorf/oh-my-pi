database_name: datalake_docpilot
table_name: income_extraction_apurador_batch
owner: thalbert.miranda@quintoandar.com.br
domain: Fintech
description: "Enriched batch-level view of DocPilot Apurador income extraction runs, with flattened business_output and pipeline_metadata JSON plus the latest matching legacy income_extraction record per proposal (id_external). One row per batch execution; used by Fintech credit analytics to compare legacy vs Apurador outcomes and monitor handler performance."
columns:
  id_batch:
    lineage:
      - datalake_docpilot_clean.income_extraction_batch.id
    description: "Unique identifier of the Apurador income extraction batch in DocPilot."
  id_external:
    lineage:
      - datalake_docpilot_clean.income_extraction_batch.id_external
    description: "Proposal or document package identifier from the upstream system (e.g. DOCX document_id)."
  external_source:
    lineage:
      - datalake_docpilot_clean.income_extraction_batch.external_source
    description: "Upstream system that submitted the income documentation for processing."
  apurador_status:
    lineage:
      - datalake_docpilot_clean.income_extraction_batch.status
    description: "Overall outcome of the Apurador income extraction batch run."
    categories:
      SUCCESS: All selected documents were extracted and used by the business handler.
      PARTIAL_SUCCESS: The batch completed with some documents excluded or failed.
      FAILURE: The batch failed with no documents used in the final outcome.
      SKIPPED: Apurador income extraction was not executed for the selected document type.
  apurador_error_type:
    lineage:
      - datalake_docpilot_clean.income_extraction_batch.error_type
    description: "Machine-readable error category when the Apurador batch ended in a controlled failure."
  apurador_error:
    lineage:
      - datalake_docpilot_clean.income_extraction_batch.error
    description: "Structured error payload associated with the Apurador batch outcome."
  apurador_output_schema_version:
    lineage:
      - datalake_docpilot_clean.income_extraction_batch.output_schema_version
    description: "Version of the business_output JSON schema persisted for the batch."
  apurador_analysis:
    lineage:
      - datalake_docpilot_clean.income_extraction_batch.business_output
    description: "Free-text analysis summary produced by the Apurador business handler."
  apurador_extracted_income_json:
    lineage:
      - datalake_docpilot_clean.income_extraction_batch.business_output
    description: "JSON map of reference period to net extracted income from the Apurador business_output."
  apurador_gross_income_json:
    lineage:
      - datalake_docpilot_clean.income_extraction_batch.business_output
    description: "JSON map of reference period to gross income from the Apurador business_output."
  apurador_committed_income_json:
    lineage:
      - datalake_docpilot_clean.income_extraction_batch.business_output
    description: "JSON map of reference period to committed income from the Apurador business_output."
  apurador_commit_hash:
    lineage:
      - datalake_docpilot_clean.income_extraction_batch.pipeline_metadata
    description: "Git commit hash of the DocPilot deployment that processed the batch."
  apurador_handler_type:
    lineage:
      - datalake_docpilot_clean.income_extraction_batch.pipeline_metadata
    description: "Type of business handler invoked by the Apurador pipeline for this batch."
  apurador_handler_name:
    lineage:
      - datalake_docpilot_clean.income_extraction_batch.pipeline_metadata
    description: "Name of the first business handler in the Apurador pipeline metadata handlers array."
  apurador_handler_prompt:
    lineage:
      - datalake_docpilot_clean.income_extraction_batch.pipeline_metadata
    description: "Prompt identifier or text of the first business handler in the Apurador pipeline."
  apurador_handler_version:
    lineage:
      - datalake_docpilot_clean.income_extraction_batch.pipeline_metadata
    description: "Version of the first business handler in the Apurador pipeline metadata."
  legacy_processing_result:
    lineage:
      - datalake_docpilot_clean.income_extraction.processing_result
    description: "Latest legacy income extraction processing outcome for the same id_external."
    categories:
      SUCCESS: Income extraction completed successfully in the legacy pipeline.
      FAILURE: Income extraction failed in the legacy pipeline.
      PARTIAL_SUCCESS: Income extraction partially succeeded in the legacy pipeline.
  legacy_documents_type:
    lineage:
      - datalake_docpilot_clean.income_extraction.documents_type
    description: "Document type processed by the latest matching legacy income extraction record."
  legacy_extracted_income_json:
    lineage:
      - datalake_docpilot_clean.income_extraction.extracted_data
    description: "JSON map of reference period to net income from the latest legacy extracted_data."
  legacy_gross_income_json:
    lineage:
      - datalake_docpilot_clean.income_extraction.extracted_data
    description: "JSON map of reference period to gross income from the latest legacy extracted_data."
  legacy_committed_income_json:
    lineage:
      - datalake_docpilot_clean.income_extraction.extracted_data
    description: "JSON map of reference period to committed income from the latest legacy extracted_data."
  legacy_first_error_type:
    lineage:
      - datalake_docpilot_clean.income_extraction.errors
    description: "Type of the first error in the latest legacy income extraction errors array."
  apurador_n_periods:
    lineage:
      - datalake_docpilot_clean.income_extraction_batch.pipeline_metadata
    description: "Number of income periods diagnosed by the Apurador pipeline handler."
  apurador_median_extracted_income:
    lineage:
      - datalake_docpilot_clean.income_extraction_batch.pipeline_metadata
    description: "Median extracted income across periods reported in Apurador pipeline diagnostics."
  legacy_error_count:
    lineage:
      - datalake_docpilot_clean.income_extraction.errors
    description: "Count of errors in the latest legacy income extraction errors array."
  has_apurador_income_map:
    lineage:
      - datalake_docpilot_clean.income_extraction_batch.business_output
    description: "True when business_output contains a non-null extracted_income map."
  has_legacy_record:
    lineage:
      - datalake_docpilot_clean.income_extraction.id_external
    description: "True when a legacy income_extraction record exists for the same id_external."
  is_latest_batch_for_external:
    description: "True when this batch is the most recent Apurador run for the given id_external and external_source; filter on this column to exclude historical reruns."
  dt_apurador_reference:
    lineage:
      - datalake_docpilot_clean.income_extraction_batch.business_output
    description: "Reference date extracted from the Apurador business_output JSON for the income analysis window."
  dt_legacy_reference:
    lineage:
      - datalake_docpilot_clean.income_extraction.extracted_data
    description: "Reference date from the latest legacy extracted_data JSON for the same proposal."
  ts_batch_created:
    lineage:
      - datalake_docpilot_clean.income_extraction_batch.ts_created
    description: "Timestamp when the Apurador batch record was created in DocPilot."
  ts_legacy_created:
    lineage:
      - datalake_docpilot_clean.income_extraction.ts_created
    description: "Creation timestamp of the latest matching legacy income extraction record."
  ts_legacy_updated:
    lineage:
      - datalake_docpilot_clean.income_extraction.ts_updated
    description: "Last update timestamp of the latest matching legacy income extraction record."
  ts_load:
    description: "Timestamp when this enrich table row was loaded by the DAG."
