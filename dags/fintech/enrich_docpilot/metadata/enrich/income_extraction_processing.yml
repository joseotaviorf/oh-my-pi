database_name: datalake_docpilot
table_name: income_extraction_processing
owner: isabella.santos@quintoandar.com.br
domain: Fintech
description: "This table stores the results returned by DocPilot regarding the processing of an income extraction. Each line represents the income extracted (net or gross) from a document in a reference month."
columns:
  id_document:
    lineage:
      - datalake_docpilot_clean.income_extraction.id_external
    description: "Unique document ID attributed to a document processed by Docpilot. It corresponds to the document ID from Docx."
  id_proposal:
    lineage:
      - datalake_docx_clean.document.id_context_external
    description: "Proposal ID attributed to a document processed by Docpilot. A proposal can have more than one document id, since it may have more than one proponent."
  id_user:
    lineage:
      - datalake_ebdb_user.user.id
    description: "User ID from the person who submitted the income documentation to be processed by Docpilot. Only the main user (i.e the user who created an account and has a CPF record in the user table) will have a user ID."
  cpf:
    lineage:
      - datalake_docx.personal_documentation
    description: "Proponent CPF number."
  external_source:
    lineage:
      - datalake_docpilot_clean.income_extraction.external_source
    description: "The external source of the extracted incomes (i.e: DOCX)."
  processing_result:
    lineage:
      - datalake_docpilot_clean.income_extraction.processing_result
    description: "The processing result generated by Docpilot."
    categories:
      SUCCESS: When the income extraction is successful
      FAILURE: When there is any failure in the income extraction process
      PARTIAL_SUCCESS: When the income extraction is partially successful
  documents_type:
    lineage:
      - datalake_docpilot_clean.income_extraction.documents_type
    description: "The type of document to be processed."
    categories:
      PAYSLIP: ""
      BANK_STATEMENT: ""
  number_of_errors:
    lineage:
      - datalake_docpilot_clean.income_extraction.extracted_data
    description: "Count of validation issues found while DocPilot extracted income from the document."
  file_path:
    lineage:
      - datalake_docpilot_clean.income_extraction.extracted_data
    description: "The file path of the processed document."
  number_of_processed_documents:
    lineage:
      - datalake_docpilot_clean.income_extraction.extracted_data
    description: "The number of documents submitted."
  error_type:
    lineage:
      - datalake_docpilot_clean.income_extraction.errors
    description: "The type of error found."
  processing_errors:
    lineage:
      - datalake_docpilot_clean.income_extraction.errors
    description: "The processing type of error found."
  error_file_path:
    lineage:
      - datalake_docpilot_clean.income_extraction.errors
    description: "The file path of a document with error."
  detected_layout:
    lineage:
      - datalake_docpilot_clean.income_extraction.errors
    description: "The layout detected when Docpilot does not support the file layout."
  statement_type:
    lineage:
      - datalake_docpilot_clean.income_extraction.extracted_data
    description: "Category of bank statement format detected when processing the income document."
  llm_normalized_bank_name:
    lineage:
      - datalake_docpilot_clean.income_extraction.errors
    description: "Normalized Bank name detected by LLM."
  llm_bank_name:
    lineage:
      - datalake_docpilot_clean.income_extraction.errors
    description: "Bank name detected by LLM."
  llm_document_type:
    lineage:
      - datalake_docpilot_clean.income_extraction.errors
    description: "Document type detected by LLM."
    categories:
      PAYSLIP: ""
      BANK_STATEMENT: ""
      OTHERS: ""
  net_income:
    lineage:
      - datalake_docpilot_clean.income_extraction.extracted_data
    description: "The raw net income extracted from a document in a reference month."
  gross_income:
    lineage:
      - datalake_docpilot_clean.income_extraction.extracted_data
    description: "The raw gross income extracted from a document in a reference month."
  processed_net_income:
    lineage:
      - datalake_docpilot_clean.income_extraction.extracted_data
    description: "The net income for a reference month after DocPilot processing, applying established rules. For payslips, this includes the original document’s net income plus the highest advance value ('advance') to estimate the total monthly amount. If more than one payslip exists for the same month, all incomes for that month will be replaced with the highest value found among them."
  processed_gross_income:
    lineage:
      - datalake_docpilot_clean.income_extraction.extracted_data
    description: "The gross income for a reference month after DocPilot processing, applying established rules. If more than one payslip exists for the same month, all incomes for that month will be replaced with the highest value found among them."
  committed_income:
    lineage:
      - datalake_docpilot_clean.income_extraction.extracted_data
    description: "The commited income extracted from a document in a reference month."
  advance:
    lineage:
      - datalake_docpilot_clean.income_extraction.extracted_data
    description: "The maximum advance value from a payslip"
  avg_net_income:
    lineage:
      - datalake_docpilot_clean.income_extraction.extracted_data
    description: "The average of the net income extracted from a document in a period."
  avg_gross_income:
    lineage:
      - datalake_docpilot_clean.income_extraction.extracted_data
    description: "The average of the gross income extracted from a document in a period."
  avg_committed_income:
    lineage:
      - datalake_docpilot_clean.income_extraction.extracted_data
    description: "The average of the committed income extracted from a document in a period."
  median_net_income:
    lineage:
      - datalake_docpilot_clean.income_extraction.extracted_data
    description: "The median of the net income extracted from a document in a period."
  median_gross_income:
    lineage:
      - datalake_docpilot_clean.income_extraction.extracted_data
    description: "The median of the gross income extracted from a document in a period."
  median_committed_income:
    lineage:
      - datalake_docpilot_clean.income_extraction.extracted_data
    description: "The median of the committed income extracted from a document in a period."
  reference_period:
    lineage:
      - datalake_docpilot_clean.income_extraction.extracted_data
    description: "Month or period the extracted income amount refers to, matching the document reference period."
  reference_date:
    lineage:
      - datalake_docpilot_clean.income_extraction.extracted_data.reference_date
    description: "Reference date of the extracted income entry within the document period."
  is_suspicious:
    lineage:
      - datalake_docpilot_clean.income_extraction.extracted_data
    description: "Based on the metadata analysis, indicates if there is any suspicious document."
  is_dates_divergent:
    lineage:
      - datalake_docpilot_clean.income_extraction.extracted_data
    description: "Whether metadata analysis found inconsistent dates within the document."
  is_main_user:
    lineage:
      - datalake_ebdb_user.user.id
    description: "Based on the existance of a user ID, it indicates if the user is the main user responsible to submit the income document."
  dt_document_date:
    lineage:
      - datalake_docpilot_clean.income_extraction.extracted_data
    description: "Issue or reference date extracted from the payslip or bank statement."
  dt_document_start_date:
    lineage:
      - datalake_docpilot_clean.income_extraction.extracted_data
    description: "Start date of the bank statement period covered by the document."
  dt_document_end_date:
    lineage:
      - datalake_docpilot_clean.income_extraction.extracted_data
    description: "End date of the bank statement period covered by the document."
  ts_created:
    lineage:
      - datalake_docpilot_clean.income_extraction.ts_created
    description: "When the income extraction record was first created in DocPilot."
  ts_updated:
    lineage:
      - datalake_docpilot_clean.income_extraction.ts_updated
    description: "When the income extraction record was last updated in DocPilot."
  ts_load:
    description: "When this row was loaded into the enrich layer by the ETL pipeline."
