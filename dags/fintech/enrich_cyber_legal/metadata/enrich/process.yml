---
database_name: datalake_cyber_legal
table_name: process
owner: juliana.hocihara@quintoandar.com.br
domain: Fintech
description:
  Enriched legal cases from the Cyber Legal platform, covering court proceedings,
  eviction context, attorneys, and financial exposure.
columns:
  id_case:
    description: Identifier of the legal case in Cyber Legal.
    lineage:
      - datalake_cyber_legal_clean.case.id_case
  id_contract_cyber:
    description: Contract identifier in the Cyber collections system.
    lineage:
      - datalake_cyber_legal_clean.case_account.id_contract
  id_contract:
    description: QuintoAndar rental contract linked to the case.
    lineage:
      - datalake_cyber_clean.contracts.id_contract_external
  id_process:
    description: Court dossier or process number.
    lineage:
      - datalake_cyber_legal_clean.case.id_dossier
  id_court:
    description: Court handling the case.
    lineage:
      - datalake_cyber_legal_clean.case.id_court
  court_name:
    description: Official name of the court where the legal case is filed and processed.
    lineage:
      - datalake_cyber_legal_clean.court.court_name
  process_type:
    description: Normalized case type (eviction, execution, or repossession claim).
    lineage:
      - datalake_cyber_legal_clean.case.case_type
  id_agency:
    description: Law firm or agency assigned to the case.
    lineage:
      - datalake_cyber_legal_clean.case.id_attorney_agency
  agency_name:
    description: Name of the assigned law firm or agency.
    lineage:
      - datalake_cyber_clean.agency.agency_name
  internal_lawyer:
    description: QuintoAndar attorney responsible for the case.
    lineage:
      - datalake_cyber_legal_clean.case.id_responsible_attorney
  external_lawyer:
    description: External attorney working on the case.
    lineage:
      - datalake_cyber_legal_clean.case.id_external_attorney
  supervising_lawyer:
    description: Supervising attorney overseeing the case.
    lineage:
      - datalake_cyber_legal_clean.case.id_supervisor_attorney
  contract_evictions_status:
    description: Whether the account is with an agency or already in court for eviction.
    lineage:
      - datalake_cyber_clean.delinquent_master.flag_account_in_agency_or_court
  evictions_label:
    description: Eviction classification label for the contract.
    lineage:
      - datalake_cyber_clean.delinquent_master.evictions_label
  eviction_step:
    description: Current step in the eviction workflow.
    lineage:
      - datalake_cyber_clean.contracts.eviction_step
  eviction_law_firm:
    description: Law firm handling eviction proceedings.
    lineage:
      - datalake_cyber_clean.contracts.eviction_law_firm
  reason_eviction:
    description: Stated reason for initiating eviction.
    lineage:
      - datalake_cyber_clean.contracts.reason_eviction
  process_start_comment:
    description: Notes recorded when the legal process was opened.
    lineage:
      - datalake_cyber_legal_clean.case_notification_log.request_comment
  process_end_comment:
    description: Notes recorded when the legal process was closed.
    lineage:
      - datalake_cyber_legal_clean.case.close_comment
  case_comment:
    description: General notes about the case.
    lineage:
      - datalake_cyber_legal_clean.case.case_comment
  case_status:
    description: Current status of the legal case.
    lineage:
      - datalake_cyber_legal_clean.case.case_status
  case_subtype:
    description: Subtype of the legal action.
    lineage:
      - datalake_cyber_legal_clean.case_uda.process_subtype
  court_division:
    description: Court division or chamber handling the case.
    lineage:
      - datalake_cyber_legal_clean.case_uda.court_division_name
  jurisdiction:
    description: Judicial district where the case is filed.
    lineage:
      - datalake_cyber_legal_clean.case_uda.judicial_district_name
  case_result:
    description: Outcome code when the case was closed.
    lineage:
      - datalake_cyber_legal_clean.case.closure_result
  case_result_description:
    description: Human-readable description of the case outcome.
    lineage:
      - datalake_cyber_legal_clean.values_list.value_description
  case_final_result:
    description: Final closure reason code.
    lineage:
      - datalake_cyber_legal_clean.case.closure_reason
  case_final_description:
    description: Human-readable description of the final closure reason.
    lineage:
      - datalake_cyber_legal_clean.values_list.value_description
  case_amount:
    description: Original lawsuit amount claimed.
    lineage:
      - datalake_cyber_legal_clean.case.lawsuit_amount
  provisioned_value:
    description: Amount provisioned for potential loss on the case.
    lineage:
      - datalake_cyber_legal_clean.case_uda.provisioned_amount
  updated_case_value:
    description: Updated claim value after adjustments.
    lineage:
      - datalake_cyber_legal_clean.case_uda.updated_cause_value_amount
  recovered_amount:
    description: Cash amount recovered through the legal process.
    lineage:
      - datalake_cyber_legal_clean.case.cash_recovered_amount
  dt_status_changed:
    description: Date of the last status change.
    lineage:
      - datalake_cyber_legal_clean.case.dt_status_changed
  dt_lawsuit:
    description: Date the lawsuit was filed.
    lineage:
      - datalake_cyber_legal_clean.case.dt_lawsuit_filed
  dt_case_acceptance:
    description: Date the case was accepted for proceedings.
    lineage:
      - datalake_cyber_legal_clean.case.dt_case_accepted
  dt_case_completion:
    description: Date the case was completed or declared unrecoverable.
    lineage:
      - datalake_cyber_legal_clean.case.dt_unrecoverable_declaration
  dt_agency_assignment:
    description: Date the case was assigned to the law firm.
    lineage:
      - datalake_cyber_legal_clean.case.dt_case_assigned
  city:
    description: City where the case is processed.
    lineage:
      - datalake_cyber_legal_clean.case.city
  state:
    description: State where the case is processed.
    lineage:
      - datalake_cyber_legal_clean.case.state
  ts_updated:
    description: When the case was last updated in Cyber Legal.
    lineage:
      - datalake_cyber_legal_clean.case.ts_updated
  input_type:
    description: Reason the case was opened, resolved to a display label when available.
    lineage:
      - datalake_cyber_legal_clean.case_uda.reason
      - datalake_cyber_legal_clean.values_list.value_description
  original_process_type:
    description: Original process type before normalization.
    lineage:
      - datalake_cyber_legal_clean.case.process_type
  total_package_amount:
    description: Total delinquent balance package for the contract.
    lineage:
      - datalake_cyber_clean.delinquent_master.total_package_amount
  contract_status:
    description: Contract status in the Cyber collections system.
    lineage:
      - datalake_cyber_clean.contracts.contract_status
  overdue_amount:
    description: Outstanding overdue balance on the contract.
    lineage:
      - datalake_cyber_clean.delinquent_master.overdue_amount
  ts_contract_end:
    description: When the linked rental contract ended.
    lineage:
      - datalake_cyber_clean.contracts.ts_contract_end
  ldt_resolution:
    description: Lead time from case opening to resolution.
    lineage:
      - datalake_cyber_legal_clean.case.ldt_resolution
  ldt_stock:
    description: Lead time the case remained in the active portfolio.
    lineage:
      - datalake_cyber_legal_clean.case.ldt_stock
  id_court_case:
    description: Court case number from the extended case record.
    lineage:
      - datalake_cyber_legal_clean.case_uda.id_court_case
