---
database_name: datalake_cyber_legal
table_name: alerts
owner: juliana.hocihara@quintoandar.com.br
domain: Fintech
description: "Enriched table containing alert information from CyberLegal system, including alert details, process information, contract data, and calculated fields for alert status, lead time, and aging classification."
columns:
  id_alert:
    description: "Alert identifier - Primary key"
    lineage:
      - datalake_cyber_legal_clean.case_alert.id_alert
  id_case:
    description: "Case number associated with the alert"
    lineage:
      - datalake_cyber_legal_clean.case_alert.id_case
  id_contract_cyber:
    description: "Contract identifier in CyberCredit system, validated to ensure numeric format"
    lineage:
      - datalake_cyber_legal.process.id_contract_cyber
  id_contract:
    description: "External contract identifier, derived from contracts table or validated id_contract_cyber"
    lineage:
      - datalake_cyber_legal_clean.contracts.id_contract_external
      - datalake_cyber_legal.process.id_contract_cyber
  process_type:
    description: "Type of legal process or case classification"
    lineage:
      - datalake_cyber_legal.process.process_type
  alert_type_code:
    description: "Alert type code - Has LOV (List of Values)"
    lineage:
      - datalake_cyber_legal_clean.case_alert.alert_type_code
  alert_type_description:
    description: Financial attribute representing alert type description on the alerts dataset.
    lineage:
      - datalake_cyber_legal_clean.values_list.value_description
  alert_comment:
    description: "Reason why the alert was generated"
    lineage:
      - datalake_cyber_legal_clean.case_alert.alert_comment
  agency_name:
    description: "Name of the attorney agency assigned to the legal case"
    lineage:
      - datalake_cyber_legal.process.agency_name
  id_generating_attorney:
    description: "Attorney who generated the alert"
    lineage:
      - datalake_cyber_legal_clean.case_alert.id_generating_attorney
  id_revising_attorney:
    description: "Attorney who reviewed the alert"
    lineage:
      - datalake_cyber_legal_clean.case_alert.id_revising_attorney
  alert_creator:
    description: "Attorney who created the alert"
    lineage:
      - datalake_cyber_legal_clean.case_alert.alert_creator
  alert_type:
    description: "Classification of alert creation type: 'SISTEMA' for system-generated alerts (when alert_creator is NULL or 'SISTEMA'), 'MANUAL' for manually created alerts"
  is_reviewed:
    description: "Alert review status (TRUE=Reviewed, FALSE=Not reviewed)"
    lineage:
      - datalake_cyber_legal_clean.case_alert.is_reviewed
  task_status:
    description: "Status of the alert task: 'A vencer' if alert expiration date is greater than or equal to review date, 'Vencida' if alert expiration date is less than review date"
  lead_time:
    description: "Number of days between alert expiration date and review date (positive values indicate alerts reviewed after expiration, negative values indicate alerts reviewed before expiration)"
  aging:
    description: "Aging classification of the alert based on lead time: 'a) Vence hoje', 'b) A vencer (1 a 3 dias)', 'c) A vencer (4 a 7 dias)', 'd) A vencer (8+ dias)', 'e) Vencida (1 a 3 dias)', 'f) Vencida (4 a 7 dias)', 'g) Vencida (8+ dias)'"
  dt_created:
    description: "Date when the alert was generated"
    lineage:
      - datalake_cyber_legal_clean.case_alert.dt_created
  month_created:
    description: "Month when the alert was created (truncated to first day of the month)"
    lineage:
      - datalake_cyber_legal_clean.case_alert.dt_created
  dt_alert_expired:
    description: "Alert expiration date"
    lineage:
      - datalake_cyber_legal_clean.case_alert.dt_alert_expired
  dt_reviewed:
    description: "Date when the alert was reviewed"
    lineage:
      - datalake_cyber_legal_clean.case_alert.dt_reviewed
  last_process_stage:
    description: Financial attribute representing last process stage on the alerts dataset.
    lineage:
      - datalake_cyber_legal.process_stages.stage_description
  contract_status:
    description: Financial attribute representing contract status on the alerts dataset.
    lineage:
      - datalake_cyber_legal.process.contract_status
