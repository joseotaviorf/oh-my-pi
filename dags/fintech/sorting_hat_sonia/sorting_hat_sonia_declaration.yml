dag:
  name: sorting_hat_sonia
  owner: Data Fintech
  schedule_interval: 0 8,12,14,16,21 * * *
  documentation:
    dag_purpose: |
      CDC orchestration for Sorting Hat clean tables consumed by the AI Agent Sonia:
      credit analysis, proponent, proposal, checklist (and related), analysis machine, and analysis request.
      Writes to datalake_sorting_hat_clean (same schema as sorting_hat).
workflow:
  type: cdc
  layer: raw
  database_type: postgres
  custom_schema: sorting_hat
  source_database: sortinghat
  dbutils_secret_key: SORTINGHAT_DB
  tables_customization:
    AnalysisMachine:
      clean_table_name: analysis_machine
    AnalysisRequest:
      clean_table_name: analysis_request
    ChecklistGroup:
      clean_table_name: checklist_group
    ChecklistItem:
      clean_table_name: checklist_item
    ChecklistDecision:
      clean_table_name: checklist_decision
    Checklist:
      clean_table_name: checklist
    CreditAnalysis:
      clean_table_name: credit_analysis
    Proponent:
      clean_table_name: proponent
    Proposal:
      clean_table_name: proposal
