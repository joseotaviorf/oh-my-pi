database_name: datalake_sorting_hat_clean
table_name: checklist_item
domain: Fintech
description: Individual checklist inputs (values, sources, compliance) under a checklist group in Sorting Hat.
columns:
  id:
    lineage:
      - datalake_sorting_hat_raw.checklistitem.id
    description: Primary key of a single checklist item row.
  id_checklist_group:
    lineage:
      - datalake_sorting_hat_raw.checklistitem.checklist_group_id
    description: Parent checklist group that owns this line-item check.
  id_input_source:
    lineage:
      - datalake_sorting_hat_raw.checklistitem.input_source_id
    description: Identifier of the analyst or automated source that supplied the input.
  input_description:
    lineage:
      - datalake_sorting_hat_raw.checklistitem.input_description
    description: Human-readable label describing what evidence this item captures.
  input_source_name:
    lineage:
      - datalake_sorting_hat_raw.checklistitem.input_source_name
    description: Display name of the person or integration providing the value.
  input_source_type:
    lineage:
      - datalake_sorting_hat_raw.checklistitem.input_source_type
    description: Category of the input source (analyst, OCR, API, etc.).
  input_type:
    lineage:
      - datalake_sorting_hat_raw.checklistitem.input_type
    description: Data type expected for this checklist item (text, boolean, file ref).
  input_value:
    lineage:
      - datalake_sorting_hat_raw.checklistitem.input_value
    description: Captured value or reference proving compliance for this item.
  status:
    lineage:
      - datalake_sorting_hat_raw.checklistitem.status
    description: Review status of this checklist item (pending, approved, rejected).
  type:
    lineage:
      - datalake_sorting_hat_raw.checklistitem.type
    description: Business classification of the checklist item within the template.
  is_compliant:
    lineage:
      - datalake_sorting_hat_raw.checklistitem.is_compliant
    description: Whether this specific item passed automated or manual validation.
  ts_created:
    lineage:
      - datalake_sorting_hat_raw.checklistitem.created_at
    description: Timestamp when this checklist item row was created.
  ts_updated:
    lineage:
      - datalake_sorting_hat_raw.checklistitem.updated_at
    description: Timestamp when this checklist item row was last updated.
