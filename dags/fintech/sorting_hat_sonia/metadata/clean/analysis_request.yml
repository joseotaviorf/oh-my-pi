database_name: datalake_sorting_hat_clean
table_name: analysis_request
domain: Fintech
description: Credit analysis request header (external ids, business context, enterprise group, outcome) from Sorting Hat.
columns:
  id:
    lineage:
      - datalake_sorting_hat_raw.analysisrequest.id
    description: Primary key of the analysis request in Sorting Hat.
  id_external:
    lineage:
      - datalake_sorting_hat_raw.analysisrequest.external_id
    description: Identifier from the upstream system that originated the credit request.
  business_context:
    lineage:
      - datalake_sorting_hat_raw.analysisrequest.business_context
    description: Business line or product context (e.g. rental) for policy routing.
  enterprise_group:
    lineage:
      - datalake_sorting_hat_raw.analysisrequest.enterprise_group
    description: Enterprise or holding group used for multi-brand credit policies.
  external_source:
    lineage:
      - datalake_sorting_hat_raw.analysisrequest.external_source
    description: System or channel that submitted this analysis request payload.
  result:
    lineage:
      - datalake_sorting_hat_raw.analysisrequest.result
    description: Aggregated outcome or summary JSON after the workflow completes.
  ts_created:
    lineage:
      - datalake_sorting_hat_raw.analysisrequest.created_at
    description: Timestamp when the analysis request was first persisted.
  ts_updated:
    lineage:
      - datalake_sorting_hat_raw.analysisrequest.updated_at
    description: Timestamp when the analysis request was last updated.
