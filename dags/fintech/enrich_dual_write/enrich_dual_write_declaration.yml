---
dag:
  name: enrich_dual_write
  owner: Data Fintech
  documentation:
    dag_purpose: |
      Creates enriched tables for invoice and entry details from both Retsuko and Billing systems.
      This DAG supports the dual write scenario by providing unified views of invoice data with
      complete entry-level details, including account types, bill items, amounts, and timestamps
      from both legacy (Retsuko) and new (Billing) systems.

workflow:
  type: query_delta
  layer: enrich
cluster:
  type: custom_cluster
  databricks_conn_id: databricks_new_env
  custom_configurations:
    driver_node_type_id: r5d.2xlarge
    node_type_id: r5d.2xlarge
    num_workers: 3
    spark_version: 16.4.x-scala2.12
