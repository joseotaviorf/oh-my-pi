---
database_name: dw_fintech_auditing
table_name: quintocred_ifrs_recurring_payment
owner: ae-finance-fintech@quintoandar.com.br
domain: fintech
description: "dw_velo.quintocred_ifrs_recurring_payment monthly snapshot. Snapshots are taken the day after the first business day from the month."
columns:
  origin_table:
    description: "Source table of payment information for each line. Possible tables : Omie, Payment, Invoice (direct billing information), Delinquency and Sap"
    lineage:
      - dw_velo.quintocred_ifrs_occurrence.origin_table
  sk_propose:
    description: "Proposal ID related to payment information"
    lineage:
      - dw_velo.quintocred_ifrs_occurrence.sk_propose
  sk_propose_20:
    description: "Proposal ID related to payment information"
    lineage:
      - dw_velo.quintocred_ifrs_occurrence.sk_propose_20
  sk_delinquency:
    description: "Delinquency ID from the delinquency table"
    lineage:
      - dw_velo.quintocred_ifrs_occurrence.sk_delinquency
  sk_transaction:
    description: "Delinquency ID from the delinquency table"
    lineage:
      - dw_velo.quintocred_ifrs_occurrence.sk_transaction
  sk_key:
    description: "ID created concatenating sk_propose and fatura_id for direct billing proposes"
    lineage:
      - dw_velo.quintocred_ifrs_occurrence.sk_key
  client_cpf_cnpj:
    description: "For 3.0 cases, it will be the delinquency entry id, for 2.0 cases, it will be the delinquency id."
    lineage:
      - dw_velo.quintocred_ifrs_occurrence.client_cpf_cnpj
  dt_register:
    description: "Delinquency creation date"
    lineage:
      - dw_velo.quintocred_ifrs_occurrence.dt_register
  dt_register_ajustada:
    description: "For 3.0 cases, it will be delinquency creation date (dt_register) , for 2.0 cases, it will be the dt_due."
    lineage:
      - dw_velo.quintocred_ifrs_occurrence.dt_register_ajustada
  dt_due:
    description: "Due date of the original invoice that became delinquent"
    lineage:
      - dw_velo.quintocred_ifrs_occurrence.dt_due
  dt_paid:
    description: "Date of the most recent payment of the default."
    lineage:
      - dw_velo.quintocred_ifrs_occurrence.dt_paid
  dias_atraso:
    description: "Number of days that the invoice is overdue, calculated by the difference between the due date of the original charge and the date of the most recent payment."
    lineage:
      - dw_velo.quintocred_ifrs_occurrence.dias_atraso
  due_amount:
    description: "Amount of the original unpaid charge."
    lineage:
      - dw_velo.quintocred_ifrs_occurrence.due_amount
  due_amount_ajustado:
    description: "For some cases of 2.0, the original value of the delinquency includes 11% interest. In this column, this was readjusted and interest was removed."
    lineage:
      - dw_velo.quintocred_ifrs_occurrence.due_amount_ajustado
  paid_amount:
    description: "Delinquency amount paid"
    lineage:
      - dw_velo.quintocred_ifrs_occurrence.paid_amount
  open_amount:
    description: "Difference between the amount paid and the original invoice amount"
    lineage:
      - dw_velo.quintocred_ifrs_occurrence.open_amount
  open_amount_ajustado:
    description: "Difference between the amount paid and the original invoice amount ( considering the due_amount_ajustado)"
    lineage:
      - dw_velo.quintocred_ifrs_occurrence.open_amount_ajustado
  discount_value:
    description: "value of the discount given when paying the delinquency"
    lineage:
      - dw_velo.quintocred_ifrs_occurrence.discount_value
  bill_item:
    description: "discrimination of delinquency entry (condominium, energy bill, contractual termination fine, fire insurance, garbage fee, gas bill, IPTU, others, damage to property, rent, water bill)"
    lineage:
      - dw_velo.quintocred_ifrs_occurrence.bill_item
  provisional_group:
    description: "column that identifies whether the delinquency refers to Guarantee or Termination"
    lineage:
      - dw_velo.quintocred_ifrs_occurrence.provisional_group
  is_danos_imovel:
    description: "column that identifies whether the delinquency refers to a charge for damage to the property"
    lineage:
      - dw_velo.quintocred_ifrs_occurrence.is_danos_imovel
  is_contract_active:
    description: "column that identifies whether the contract is active"
    lineage:
      - dw_velo.quintocred_ifrs_occurrence.is_contract_active
  dt_contract_started:
    description: "contract start date"
    lineage:
      - dw_velo.quintocred_ifrs_occurrence.dt_contract_started
  dt_contract_ended:
    description: "Contract cancellation date"
    lineage:
      - dw_velo.quintocred_ifrs_occurrence.dt_contract_ended
  valor_pacote:
    description: "total value of the package (rent + condo + water+IPTU+etc)"
    lineage:
      - dw_velo.quintocred_ifrs_occurrence.valor_pacote
  is_delinquency_renovacao:
    description: "column that signals whether it is a Renewal delinquency"
    lineage:
      - dw_velo.quintocred_ifrs_occurrence.is_delinquency_renovacao
  is_perdao_divida:
    description: "column that indicates whether it is a delinquency whose debt was forgiven"
    lineage:
      - dw_velo.quintocred_ifrs_occurrence.is_perdao_divida
  ts_snapshot:
    description: "Timestamp that snapshot was taken."
  day:
    description: "Day of the date the snapshot was taken."
  month:
    description: "Month of the date the snapshot was taken"
  year:
    description: "Year of the date the snapshot was taken"
