---
dag:
  name: enrich_bureaus
  schedule_start_date: 2020, 7, 1
  owner: Data Fintech
  documentation:
    dag_purpose: |
      Creates enriched tables for the `Bureau` context, transforming data for each of 5A's bureau provider and consolidating them into `all_bureau_analysis` table.
workflow:
  type: query
  layer: enrich
  inner_dependencies:
    all_bureau_analysis:
      - boavista_bureau_analysis
      - boavista_p4_bureau_analysis
      - serasa_bureau_analysis
      - neoway_bureau_analysis
      - bigdatacorp_bureau_analysis
      - transunion_bureau_analysis
      - transunion_income_features
    transunion_bureau_analysis:
      - transunion_internal_integration_report
cluster:
  type: databricks_12_2_med_io-memory_cluster
