database_name: datalake_bureaus
table_name: neoway_bureau_analysis
owner: ae-finance-fintech@quintoandar.com.br
domain: Fintech
description: Table with all bureau features received from Neoway for a person, in proposal granularity.
columns:
  id_proposal:
    lineage:
      - datalake_static_files_raw.bureaus_neoway_historical_raw.id_proposal
      - datalake_sorting_hat_clean.credit_analysis.id_proposal
    description: Proposal ID
  id_proponent:
    lineage:
      - datalake_sorting_hat_clean.proponent.id_proponent
    description: Proponent ID
  cpf:
    lineage:
      - datalake_static_files_raw.bureaus_neoway_historical_raw.cpf
      - datalake_arquivo_confidencial_clean.integration_report_aud.cpf 
    description: CPF
  neoway_estimated_income_low:
    lineage:
      - datalake_static_files_raw.bureaus_neoway_historical_raw.estimated_income_neoway_low
      - datalake_arquivo_confidencial_clean.integration_report_aud.attributes.neoway_lower_value
    description: Lower limit of income range calculated by Neoway
  neoway_estimated_income_midpoint:
    lineage:
      - datalake_static_files_raw.bureaus_neoway_historical_raw.estimated_income_neoway_midpoint
    description: Average limit of income range estimated by Neoway
  neoway_estimated_income_upper:
    lineage:
      - datalake_static_files_raw.bureaus_neoway_historical_raw.estimated_income_neoway_upper
      - datalake_arquivo_confidencial_clean.integration_report_aud.attributes.neoway_upper_value
    description: Upper limit of income range estimated by Neoway
