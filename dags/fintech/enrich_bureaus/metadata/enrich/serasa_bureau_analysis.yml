database_name: datalake_bureaus
table_name: serasa_bureau_analysis
owner: ae-finance-fintech@quintoandar.com.br
domain: Fintech
description: Table with all bureau features received from Serasa for a person, in proposal granularity.
columns:
  id_proposal:
    lineage:
      - datalake_static_files_raw.bureaus_serasa_historical_raw.id_proposal
      - datalake_sorting_hat_clean.credit_analysis.id_proposal
    description: Proposal ID
  id_proponent:
    lineage:
      - datalake_static_files_raw.bureaus_serasa_historical_raw.id_proponent
      - datalake_sorting_hat_clean.proponent.id_proponent  
    description: Proponent ID
  cpf:
    lineage:
      - datalake_static_files_raw.bureaus_serasa_historical_raw.cpf
      - datalake_arquivo_confidencial_clean.integration_report_aud.cpf
    description: CPF
  serasa_score_csba:
    lineage:
      - datalake_static_files_raw.bureaus_serasa_historical_raw.SCORE_CSBA
      - datalake_sorting_hat_clean.proponent.serasa_score  
      - datalake_arquivo_confidencial_clean.integration_report_aud.attributes.score
    description: Serasa Score CSBA
  serasa_score_hspn:
    lineage:
      - datalake_static_files_raw.bureaus_serasa_historical_raw.SCORE_HSPN
      - datalake_arquivo_confidencial_clean.integration_report_aud.attributes.score
    description: Serasa Score HSPN
