---
database_name: datalake_collections_aud
table_name: contract_aud_daily
owner: bianca.martins@quintoandar.com.br
domain: Fintech
description: "Daily snapshot of contract audit data with only the latest record per contract per day. Deduplicates multiple transactions within the same day to provide a single daily state."
columns:
  id_contract:
    description: "Contract ID"
    lineage:
      - datalake_collections_aud.contract_aud.id_contract
  country_code:
    description: "Country code where the house is located"
    lineage:
      - datalake_collections_aud.contract_aud.country_code
  guarantee:
    description: "Type of guarantee for the contract"
    lineage:
      - datalake_collections_aud.contract_aud.guarantee
  status:
    description: "Current status of the contract"
    lineage:
      - datalake_collections_aud.contract_aud.status
  dt_termination_original:
    description: "Original termination date of the contract"
    lineage:
      - datalake_collections_aud.contract_aud.dt_termination_original
  dt_annulment:
    description: "Effective annulment date, considering termination process completion"
    lineage:
      - datalake_collections_aud.contract_aud.dt_annulment
  dt_started:
    description: "Contract start date"
    lineage:
      - datalake_collections_aud.contract_aud.dt_started
  ts_signature:
    description: "Timestamp when contract was signed"
    lineage:
      - datalake_collections_aud.contract_aud.ts_signature
  ts_analyst_annulment_input:
    description: "Timestamp when analyst input was made for contract annulment"
    lineage:
      - datalake_collections_aud.contract_aud.ts_analyst_annulment_input
  ts_database_transaction:
    description: "Timestamp of database transaction"
    lineage:
      - datalake_collections_aud.contract_aud.ts_database_transaction
  ts_snapshot:
    description: "Timestamp of CDC transaction snapshot"
    lineage:
      - datalake_collections_aud.contract_aud.ts_snapshot
  year:
    description: "Year from database transaction"
    lineage:
      - datalake_collections_aud.contract_aud.year
  month:
    description: "Month from database transaction"
    lineage:
      - datalake_collections_aud.contract_aud.month
  day:
    description: "Day from database transaction"
    lineage:
      - datalake_collections_aud.contract_aud.day
  ts_load:
    description: "Timestamp when record was loaded"
    lineage:
      - "Derived from NOW()"
