---
database_name: datalake_collections_aud
table_name: contract_aud_at_closing
owner: bianca.martins@quintoandar.com.br
domain: Fintech
description: "Historical snapshot of contract audit data at month end closing. Each contract is replicated for every month from its first transaction until termination (or current date), with the most recent information available for each month."
columns:
  id_contract:
    description: "Contract ID"
    lineage:
      - datalake_collections_aud.contract_aud_daily.id_contract
  country_code:
    description: "Country code where the house is located"
    lineage:
      - datalake_collections_aud.contract_aud_daily.country_code
  guarantee:
    description: "Type of guarantee for the contract"
    lineage:
      - datalake_collections_aud.contract_aud_daily.guarantee
  status:
    description: "Current status of the contract"
    lineage:
      - datalake_collections_aud.contract_aud_daily.status
  dt_termination_original:
    description: "Original termination date of the contract"
    lineage:
      - datalake_collections_aud.contract_aud_daily.dt_termination_original
  dt_annulment:
    description: "Effective annulment date, considering termination process completion"
    lineage:
      - datalake_collections_aud.contract_aud_daily.dt_annulment
  dt_started:
    description: "Contract start date"
    lineage:
      - datalake_collections_aud.contract_aud_daily.dt_started
  ts_signature:
    description: "Timestamp when contract was signed"
    lineage:
      - datalake_collections_aud.contract_aud_daily.ts_signature
  ts_analyst_annulment_input:
    description: "Timestamp when analyst input was made for contract annulment"
    lineage:
      - datalake_collections_aud.contract_aud_daily.ts_analyst_annulment_input
  dt_closing:
    description: "Month end closing date - last day of the month for this snapshot"
    lineage:
      - "Derived from LAST_DAY(dt_month_start)"
  ts_database_transaction:
    description: "Timestamp of database transaction"
    lineage:
      - datalake_ebdb_transactional.contrato.ts_database_transaction
  ts_snapshot:
    description: "Timestamp of CDC transaction snapshot"
    lineage:
      - datalake_ebdb_transactional.contrato.ts_cdc_transaction
  year:
    description: "Year extracted from month start date"
    lineage:
      - "Derived from YEAR(dt_month_start)"
  month:
    description: "Month extracted from month start date"
    lineage:
      - "Derived from MONTH(dt_month_start)"
  day:
    description: "Day of month end closing (last day of month)"
    lineage:
      - "Derived from DAY(LAST_DAY(dt_month_start))"
  ts_load:
    description: "Timestamp when record was loaded"
    lineage:
      - "Derived from NOW()"
