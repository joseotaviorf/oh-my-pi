---
database_name: datalake_proponent
table_name: proponent
owner: giuseppe.giovanelli@quintoandar.com.br
domain: Fintech
description: "Table that brings information about the proponent from many systems, joining them by CPF."
columns:
  id_proponent:
    lineage:
      - datalake_docx_clean.credit_evaluation_proponent.cpf
      - datalake_docx_clean.credit_evaluation.id_proposal
    description: "id proponent formed based on the encryption of proponent cpf and proosal's id."
  id_proponent_docx:
    lineage:
      - datalake_docx_clean.credit_evaluation_proponent.id
    description: "Proponent ID docx"
  id_proponent_sorting_hat:
    lineage:
      - datalake_sorting_hat_clean.proponent.id
    description: "Sorting Hat Proponent ID"
  id_proponent_ebdb:
    lineage:
      - datalake_ebdb_clean.proponent_proposal.id
    description: "EBDB Proponent ID"
  cpf:
    lineage:
      - datalake_docx_clean.credit_evaluation_proponent.cpf
    description: "CPF"
  name:
    lineage:
      - datalake_docx_clean.credit_evaluation_proponent.name
    description: "Proponent's declared name."
  id_proposal:
    lineage:
      - datalake_docx_clean.credit_evaluation.id_proposal
    description: "Proposal's identification from DOCX, which is the same on EBDB and Sorting Hat."
  monthly_income:
    lineage:
      - datalake_docx_clean.credit_evaluation_proponent.monthly_income
    description: "Proponent declared monthly income on DOCX."
  occupation_area:
    lineage:
      - datalake_docx_clean.credit_evaluation_proponent.occupation_area
    description: "Proponent's declared job category."
  is_going_to_reside:
    lineage:
      - datalake_sorting_hat_clean.proponent.is_going_to_reside
    description: "Information fro Sorting Hat about whether a proponent intention is to live or not at the house."
  serasa_csba_score:
    lineage:
      - datalake_arquivo_confidencial_clean.integration_report_aud.attributes
    description: "Proponent Serasa CSBA score, based on market negative database."
  serasa_hspi_score:
    lineage:
      - datalake_arquivo_confidencial_clean.integration_report_aud.attributes
    description: "Proponent Serasa HSPI score, blend of positive and negative market classification."
  boavista_old_score:
    lineage:
      - datalake_arquivo_confidencial_clean.integration_report_aud.attributes
    description: "Proponent Boavista score from older model, it's no longer used on credit analysis as from apr/23."
  boavista_positive_score:
    lineage:
      - datalake_arquivo_confidencial_clean.integration_report_aud.attributes
    description: "Proponent Boavista score based on cadastro postivo."
  scr_mob1_operation_data:
    lineage:
      - datalake_arquivo_confidencial_clean.integration_report_aud.attributes
    description: "Proponent SCR data from the previous month from the consultation. For more info on SCR check ."
  big_id_score:
    lineage:
      - datalake_arquivo_confidencial_clean.integration_report_aud.attributes
    description: "Proponent Big ID documentation score. For proposals with 2 or more tenants, it checks if the documentation sent does indeed belongs to the person."
  unico_score:
    lineage:
      - datalake_arquivo_confidencial_clean.unico_check_process.score
    description: "Proponent Unico's documentation score. For proposals with only 1 tenant, it checks if the documentation sent does indeed belongs to the person."
  unico_status:
    lineage:
      - datalake_arquivo_confidencial_clean.unico_check_process.status
    description: "Proponent Unico's documentation status. For proposals with only 1 tenant, it checks if the documentation sent does indeed belongs to the person."
  has_biometry_unico:
    lineage:
      - datalake_arquivo_confidencial_clean.unico_check_process.has_biometry
    description: "Unico's flag to indicate if it used the mobile biometry to check documents validity."
  unico_liveness:
    lineage:
      - datalake_arquivo_confidencial_clean.unico_check_process.liveness
    description: "Unico's result indicating if is eas detected some moviment before the selfie is taken."
  unico_face_match:
    lineage:
      - datalake_arquivo_confidencial_clean.unico_check_process.face_match
    description: "Unico's flag to indicate if it used the doc image and selfie are a match."
  idwall_matrix_name:
    lineage:
      - datalake_arquivo_confidencial_clean.documentation_report.matrix_name
    description: "IDwall profile to check document RG or CNH."
  idwall_report_result:
    lineage:
      - datalake_arquivo_confidencial_clean.documentation_report.report_result
    description: "IDwall documentation final result."
  idwall_report_status:
    lineage:
      - datalake_arquivo_confidencial_clean.documentation_report.report_status
    description: "IDwall documentation analysis status."
  emailage_email:
    lineage:
      - datalake_arquivo_confidencial_clean.emailage_result_aud.email
    description: "Lowered email characters."
  emailage_score:
    lineage:
      - datalake_arquivo_confidencial_clean.emailage_result_aud.score
    description: "Emailage alnalysis result."
  is_main_proponent:
    lineage:
      - datalake_docx_clean.credit_evaluation_proponent.proponent_type
    description: "Flag indicating if said proponent is marked as USER on DOCX."
