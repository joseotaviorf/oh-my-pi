---
database_name: datalake_proponent
table_name: main_proponent_proposal
owner: giuseppe.giovanelli@quintoandar.com.br
domain: Fintech
description: "Table that brings only the main proponent for each proposal."
columns:
  id_proponent:
    lineage:
      - datalake_proponent.proponent.id_proponent
    description: "id proponent formed based on the encryption of proponent cpf and proposal's id."
  id_proposal:
    lineage:
      - datalake_proponent.proponent.id_proposal
    description: "Proposal's identification from DOCX, which is the same on EBDB and Sorting Hat."
  cpf:
    lineage:
      - datalake_proponent.proponent.cpf
    description: "Proponent's personal document number."
  id_proponent_docx:
    lineage:
      - datalake_proponent.proponent.id_proponent_docx
    description: "Proponent's identification from credit_evaluation_proponent table on DOCX."
  id_proponent_sorting_hat:
    lineage:
      - datalake_proponent.proponent.id_proponent_sorting_hat
    description: "Proponent's identification from Proponent table on Sorting Hat."
  id_proponent_ebdb:
    lineage:
      - datalake_proponent.proponent.id_proponent_ebdb
    description: "Proponent's identification from proponent_proposal table on EBDB."