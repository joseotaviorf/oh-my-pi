    lineage: []
  previous_credit_denial_queue_description:
    description: "Human-readable name of the previous credit denial queue from queue_decision_tree."
    lineage: []
  creditor:
    description: "Product line (QuintoAndar or QuintoCred) derived from contract group on the contract master record."
    lineage: []
  eviction_queue_description:
    description: "Human-readable eviction queue name decoded from queue_decision_tree for eviction_queue."
    lineage: []
  campaign_label:
