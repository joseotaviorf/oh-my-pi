---
dag:
  name: enrich_cyber
  schedule_start_date: 2024, 9, 1
  owner: Data Fintech
  documentation:
    dag_purpose: |
      Enrich pipe for Cyber
workflow:
  type: query_delta
  layer: enrich
  inner_dependencies:
    negotiation:
      - debt_negotiation_mapping
    contracts:
      - queue_decision_tree
    queue_timeline:
      - contracts
cluster:
  type: databricks_13_3_med_general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: "quintoandar_{{ var.value.environment }}"
