---
dag:
  name: enrich_cyber
  schedule_start_date: 2024, 9, 1
  owner: Data Fintech
  documentation:
    dag_purpose: |
      Enrich pipe for Cyber
workflow:
  type: query_delta
  layer: enrich
  inner_dependencies:
    contract_agency_distribution:
      - agencies
    negotiation:
      - debt_negotiation_mapping
    contracts:
      - queue_decision_tree
    queue_timeline:
      - contracts
    agency_timeline:
      - contract_agency_distribution
    historical_tree_timeline:
      - queue_decision_tree
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, -1), 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, 2), 'load_end_date') }}"
  tables_customization:
    historical_tree_timeline:
      extraction_type: incremental
      partitions: [year, month, day]
