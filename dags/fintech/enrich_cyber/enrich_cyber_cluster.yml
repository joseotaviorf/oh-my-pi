cluster:
  type: emr_7_12_consolidation_xl_memory_fleet_cluster
  custom_configurations:
    step_concurrency_level: 4
    aws_attributes:
      ebs_volume_size: 200
    core_nodes:
      target_on_demand: 6
      target_spot: 0
      instance_types:
        - r6g.8xlarge
        - r7g.8xlarge
        - r6i.8xlarge
    task_nodes:
      instance_types:
        - r6g.8xlarge
        - r7g.8xlarge
        - r6i.8xlarge
      target_on_demand: 0
      target_spot: 6
      allocation_strategy: price-capacity-optimized
      bid_price_percentage: 100
    spark_conf:
      spark.sql.adaptive.advisoryPartitionSizeInBytes: "16777216"
      spark.sql.shuffle.partitions: "800"
      spark.speculation: "true"
      spark.speculation.multiplier: "3"
      spark.speculation.quantile: "0.75"
