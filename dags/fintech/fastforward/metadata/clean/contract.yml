database_name: datalake_fastforward_clean
table_name: contract
description:
  One row per contract in the Fintech clean layer, sourced from
  datalake_fastforward_clean for payments, billing, and financial operations
  reporting.
owner: juliana.hocihara@quintoandar.com.br
domain: Fintech
columns:
  id:
    lineage:
      - datalake_fastforward_raw.contract.id
    description: Financial attribute representing id on the contract dataset.
  id_external:
    lineage:
      - datalake_fastforward_raw.contract.external_id
    description: Identifier for the external referenced by this financial record.
  id_landlord:
    lineage:
      - datalake_fastforward_raw.contract.landlord_id
    description: Identifier for the landlord referenced by this financial record.
  id_owner:
    lineage:
      - datalake_fastforward_raw.contract.owner_id
    description: Identifier for the owner referenced by this financial record.
  id_house:
    lineage:
      - datalake_fastforward_raw.contract.house_id
    description: Property listing identifier linking the financial event to the rented or sold unit.
  id_brokerage_fee:
    lineage:
      - datalake_fastforward_raw.contract.brokerage_fee_id
    description: Identifier for the brokerage fee referenced by this financial record.
  id_installment_plan:
    lineage:
      - datalake_fastforward_raw.contract.installment_plan_id
    description: Identifier for the installment plan referenced by this financial record.
  is_off_limits:
    lineage:
      - datalake_fastforward_raw.contract.off_limits
    description: Indicates whether off limits applies to this financial record.
  ts_started:
    lineage:
      - datalake_fastforward_raw.contract.start_date
    description: Timestamp when started occurred in the upstream fintech system.
  ts_created:
    lineage:
      - datalake_fastforward_raw.contract.created_at
    description: Timestamp when created occurred in the upstream fintech system.
  ts_updated:
    lineage:
      - datalake_fastforward_raw.contract.updated_at
    description: Timestamp when updated occurred in the upstream fintech system.
  ts_ended:
    lineage:
      - datalake_fastforward_raw.contract.end_date
    description: Timestamp when ended occurred in the upstream fintech system.
