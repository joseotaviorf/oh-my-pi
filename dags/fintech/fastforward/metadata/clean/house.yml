database_name: datalake_fastforward_clean
table_name: house
description:
  One row per house in the Fintech clean layer, sourced from
  datalake_fastforward_clean for payments, billing, and financial operations
  reporting.
owner: juliana.hocihara@quintoandar.com.br
domain: Fintech
columns:
  id:
    lineage:
      - datalake_fastforward_raw.house.id
    description: Financial attribute representing id on the house dataset.
  id_external:
    lineage:
      - datalake_fastforward_raw.house.external_id
    description: Identifier for the external referenced by this financial record.
  id_address:
    lineage:
      - datalake_fastforward_raw.house.address_id
    description: Identifier for the address referenced by this financial record.
  cover_image_url:
    lineage:
      - datalake_fastforward_raw.house.cover_image_url
    description: Financial attribute representing cover image url on the house dataset.
  ts_created:
    lineage:
      - datalake_fastforward_raw.house.created_at
    description: Timestamp when created occurred in the upstream fintech system.
  ts_updated:
    lineage:
      - datalake_fastforward_raw.house.updated_at
    description: Timestamp when updated occurred in the upstream fintech system.
