database_name: datalake_fastforward_clean
table_name: address
description:
  One row per address in the Fintech clean layer, sourced from
  datalake_fastforward_clean for payments, billing, and financial operations
  reporting.
owner: juliana.hocihara@quintoandar.com.br
domain: Fintech
columns:
  id:
    lineage:
      - datalake_fastforward_raw.address.id
    description: Financial attribute representing id on the address dataset.
  state:
    lineage:
      - datalake_fastforward_raw.address.uf
    description: Financial attribute representing state on the address dataset.
  city:
    lineage:
      - datalake_fastforward_raw.address.city
    description: Financial attribute representing city on the address dataset.
  complement:
    lineage:
      - datalake_fastforward_raw.address.complement
    description: Financial attribute representing complement on the address dataset.
  neighborhood:
    lineage:
      - datalake_fastforward_raw.address.neighborhood
    description: Financial attribute representing neighborhood on the address dataset.
  street:
    lineage:
      - datalake_fastforward_raw.address.street
    description: Financial attribute representing street on the address dataset.
  ts_created:
    lineage:
      - datalake_fastforward_raw.address.created_at
    description: Timestamp when created occurred in the upstream fintech system.
  ts_updated:
    lineage:
      - datalake_fastforward_raw.address.updated_at
    description: Timestamp when updated occurred in the upstream fintech system.
