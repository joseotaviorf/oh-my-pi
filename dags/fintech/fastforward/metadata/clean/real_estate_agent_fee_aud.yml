database_name: datalake_fastforward_clean
table_name: real_estate_agent_fee_aud
description: Historical record of changes to agent brokerage fee records.
owner: marcus.silva@quintoandar.com.br
domain: Fintech
columns:
  id_real_estate_agent_fee:
    lineage:
      - datalake_fastforward_raw.real_estate_agent_fee_aud.id
    description: Unique identifier of the agent fee record.
  id_agent:
    lineage:
      - datalake_fastforward_raw.real_estate_agent_fee_aud.agent_id
    description: Real estate agent receiving the fee.
  id_contract:
    lineage:
      - datalake_fastforward_raw.real_estate_agent_fee_aud.contract_id
    description: Rental contract the fee is associated with.
  rev:
    lineage:
      - datalake_fastforward_raw.real_estate_agent_fee_aud.rev
    description: Sequential number identifying this change snapshot in the audit history.
  rev_end:
    lineage:
      - datalake_fastforward_raw.real_estate_agent_fee_aud.revend
    description: Next audit snapshot that replaced this one, if the record was later updated.
  fee:
    lineage:
      - datalake_fastforward_raw.real_estate_agent_fee_aud.fee
    description: Brokerage fee amount in Brazilian reais.
  month:
    lineage:
      - datalake_fastforward_raw.real_estate_agent_fee_aud.month
    description: Month the fee refers to.
  year:
    lineage:
      - datalake_fastforward_raw.real_estate_agent_fee_aud.year
    description: Year the fee refers to.
