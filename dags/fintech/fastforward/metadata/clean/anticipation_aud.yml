  id_promo_fee:
    lineage:
      - datalake_fastforward_raw.anticipation_aud.promo_fee_id
    description: Identifier for the promo fee referenced by this financial record.
  rev:
    lineage:
      - datalake_fastforward_raw.anticipation_aud.rev
    description: Financial attribute representing rev on the anticipation_aud dataset.
  rev_end:
    lineage:
      - datalake_fastforward_raw.anticipation_aud.revend
    description: Financial attribute representing rev end on the anticipation_aud dataset.
  fee:
    lineage:
      - datalake_fastforward_raw.anticipation_aud.fee
    description: Financial attribute representing fee on the anticipation_aud dataset.
  amount:
    lineage:
      - datalake_fastforward_raw.anticipation_aud.amount
    description: Monetary amount in Brazilian Reais for the financial transaction or balance.
  status:
    lineage:
      - datalake_fastforward_raw.anticipation_aud.status
