database_name: datalake_fastforward_clean
table_name: anticipation_aud
description:
  One row per anticipation aud in the Fintech clean layer, sourced from
  datalake_fastforward_clean for payments, billing, and financial operations
  reporting.
owner: juliana.hocihara@quintoandar.com.br
domain: Fintech
columns:
  id:
    lineage:
      - datalake_fastforward_raw.anticipation_aud.id
    description: Financial attribute representing id on the anticipation_aud dataset.
  id_invoice:
    lineage:
      - datalake_fastforward_raw.anticipation_aud.invoice_id
    description: Invoice identifier in the billing or payments platform.
  id_contract:
    lineage:
      - datalake_fastforward_raw.anticipation_aud.contract_id
