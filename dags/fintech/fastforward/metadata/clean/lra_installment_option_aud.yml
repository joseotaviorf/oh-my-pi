database_name: datalake_fastforward_clean
table_name: lra_installment_option_aud
description: Historical record of changes to rent anticipation payment plan options.
owner: marcus.silva@quintoandar.com.br
domain: Fintech
columns:
  id:
    lineage:
      - datalake_fastforward_raw.lra_installment_option_aud.id
    description: Unique identifier of the payment plan option.
  rev:
    lineage:
      - datalake_fastforward_raw.lra_installment_option_aud.rev
    description: Sequential number identifying this change snapshot in the audit history.
  rev_type:
    lineage:
      - datalake_fastforward_raw.lra_installment_option_aud.revtype
    description: "Type of change recorded (new record, update, or deletion)."
  installments:
    lineage:
      - datalake_fastforward_raw.lra_installment_option_aud.installments_number
    description: Number of installments in this plan.
  monthly_interest_rate:
    lineage:
      - datalake_fastforward_raw.lra_installment_option_aud.monthly_interest
    description: Monthly interest rate applied to this plan.
  option_bucket:
    lineage:
      - datalake_fastforward_raw.lra_installment_option_aud.option_bucket
    description: Pricing group used to categorize this plan option.
  months_anticipated:
    lineage:
      - datalake_fastforward_raw.lra_installment_option_aud.months_anticipated
    description: Number of rent months covered by the anticipation.
  ts_valid_from:
    lineage:
      - datalake_fastforward_raw.lra_installment_option_aud.valid_from
    description: Date when this plan option becomes available.
  ts_valid_until:
    lineage:
      - datalake_fastforward_raw.lra_installment_option_aud.valid_until
    description: Date when this plan option expires.
