database_name: datalake_fastforward_clean
table_name: installment_plan
description:
  One row per installment plan in the Fintech clean layer, sourced from
  datalake_fastforward_clean for payments, billing, and financial operations
  reporting.
owner: juliana.hocihara@quintoandar.com.br
domain: Fintech
columns:
  id:
    lineage:
      - datalake_fastforward_raw.installment_plan.id
    description: Financial attribute representing id on the installment_plan dataset.
  installments:
    lineage:
      - datalake_fastforward_raw.installment_plan.number_of_installments
    description: Financial attribute representing installments on the installment_plan dataset.
  interest_rate:
    lineage:
      - datalake_fastforward_raw.installment_plan.interest_rate
    description: Financial attribute representing interest rate on the installment_plan dataset.
  min_installment_value:
    lineage:
      - datalake_fastforward_raw.installment_plan.min_installment_value
    description: Financial attribute representing min installment value on the installment_plan dataset.
  ts_created:
    lineage:
      - datalake_fastforward_raw.installment_plan.created_at
    description: Timestamp when created occurred in the upstream fintech system.
  ts_updated:
    lineage:
      - datalake_fastforward_raw.installment_plan.updated_at
    description: Timestamp when updated occurred in the upstream fintech system.
