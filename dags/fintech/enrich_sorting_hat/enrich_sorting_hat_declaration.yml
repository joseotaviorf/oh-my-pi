---
dag:
  name: enrich_sorting_hat
  schedule_start_date: 2019, 5, 31
  owner: Data Fintech
  documentation:
    dag_purpose: |
      This DAG creates the enriched tables from Sorting Hat, our microservice responsible for Credit policy and analysis.
workflow:
  type: query_delta
  layer: enrich
cluster:
  type: databricks_13_3_med_general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
