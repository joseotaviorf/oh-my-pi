---
query_export_xlsx: "SELECT
  id_house AS houseId,
  dt_transaction AS transDate,
  trasaction_type AS transType,
  transaction_situation AS transSituation,
  iptu AS iptuNumber,
  transaction_amount AS transAmount,
  address,
  address_number AS addressNumber,
  address_complement AS addressComplement,
  address_neighborhood AS neighborhood,
  address_zipcode AS zipcode,
  house_type AS houseType,
  useful_area AS usefulArea,
  total_area AS totalArea,
  construction_year AS constructionYear,
  terrain_area AS terrainArea,
  parking_slots AS qtyParkingLot,
  bedrooms AS qtyDorms,
  bathrooms AS qtyBaths
  FROM
  datalake_dai_report.dai_report;"
out_path: "s3://5a-simba/prod/DAI/DAI_{}_{:02d}.xlsx"
