---
database_name: datalake_dai_report
table_name: dai_report
description: Monthly export for São Paulo DAI (Declaração de Atividades Imobiliárias)
  tax reporting, combining sale and rental transactions in the city.
domain: Fintech
owner: marcus.silva@quintoandar.com.br
columns:
  id_house:
    lineage:
    - dw_house.dim_house.sk_house
    - datalake_ebdb_clean.house.id
    description: Property identifier (warehouse key for sales, platform id for rentals).
  trasaction_type:
    lineage: []
    description: DAI transaction type code (sale or rent).
  transaction_situation:
    lineage: []
    description: DAI situation code indicating a completed transaction.
  iptu:
    lineage: []
    description: IPTU tax amount reported (placeholder zero in this export).
  transaction_amount:
    lineage:
    - dw_sale.dim_sale_agreement.sale_price_agreed
    - datalake_ebdb_clean.contract.rent
    description: Transaction value (sale price or monthly rent).
  address:
    lineage:
    - dw_house.dim_house.address
    - datalake_ebdb_clean.house.address
    description: Street name of the property.
  address_number:
    lineage:
    - dw_house.dim_house.number
    - datalake_ebdb_clean.house.number
    description: Street number of the property.
  address_complement:
    lineage:
    - dw_house.dim_house.complement
    - datalake_ebdb_clean.house.complement
    description: Address complement (apartment, block, etc.).
  address_neighborhood:
    lineage:
    - dw_house.dim_house.neighborhood
    - datalake_ebdb_clean.house.neighborhood
    description: Neighborhood of the property.
  address_zipcode:
    lineage:
    - dw_house.dim_house.zipcode
    - datalake_ebdb_clean.house.zipcode
    description: Postal code of the property.
  house_type:
    lineage:
    - dw_house.dim_house.type
    - datalake_ebdb_clean.house.type
    description: DAI property type code (house, apartment, or other).
  useful_area:
    lineage:
    - dw_house.dim_house.total_area
    - datalake_ebdb_clean.house.total_area
    description: Usable area of the property in square meters.
  total_area:
    lineage:
    - dw_house.dim_house.total_area
    - datalake_ebdb_clean.house.total_area
    description: Total built area in square meters.
  terrain_area:
    lineage:
    - dw_house.dim_house.construction_area
    - datalake_ebdb_clean.house.land_area
    description: Land area in square meters.
  parking_slots:
    lineage:
    - dw_house.dim_house.parking_slots
    - datalake_ebdb_clean.house.parking_slots
    description: Number of parking spaces.
  bedrooms:
    lineage:
      - dw_house.dim_house.bedrooms
      - datalake_ebdb_clean.house.bedrooms
    description: Count of bedrooms in the property for DAI reporting.
  bathrooms:
    lineage:
      - dw_house.dim_house.bathrooms
      - datalake_ebdb_clean.house.bathrooms
    description: Count of bathrooms in the property for DAI reporting.
  construction_year:
    lineage: []
    description: Construction year reported to DAI (placeholder when unknown).
  dt_transaction:
    lineage:
    - dw_public.dim_date.date
    - datalake_ebdb_clean.contract.ts_signed
    description: Date the transaction was completed (sale signing or lease signing).
