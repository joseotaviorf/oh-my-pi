---
database_name: dw_collection_recovery
table_name: fact_overdue_portfolio_timeline
description: The table contains information about the portfolio of overdue invoices. The invoice is inserted into the table 1 day after its due date, and it's replicated every day until the day the debt is paid or written down.
domain: Fintech
owner: ae-finance-fintech@quintoandar.com.br
columns:
  id_contract:
    lineage:
      - datalake_invoice.overdue_portfolio_timeline.id_contract
    description: Contract ID
  id_invoice:
    lineage:
      - datalake_invoice.overdue_portfolio_timeline.id_invoice
    description: Invoice ID
  id_proposal:
    lineage:
      - datalake_invoice.overdue_portfolio_timeline.id_invoice
    description: Proposal ID
  contract_status:
    lineage:
      - datalake_invoice.overdue_portfolio_timeline.contract_status
    description: Contract status
  invoice_type:
    lineage:
      - datalake_invoice.overdue_portfolio_timeline.invoice_type
    description: Invoice's type frequency - monthly, extra, pos rental, onboarding, early termination...
  payment_status:
    lineage:
      - datalake_invoice.overdue_portfolio_timeline.payment_status
    description: Payment status on the reference date
    categories:
      open: ""
      paid: ""
      written-down: ""
      divergent-payment: ""
  debtor_type:
    lineage:
      - datalake_invoice.overdue_portfolio_timeline.debtor_type
