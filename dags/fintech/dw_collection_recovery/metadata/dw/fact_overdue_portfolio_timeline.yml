  due_amount:
    lineage:
      - datalake_invoice.overdue_portfolio_timeline.due_amount
    description: Invoice due amount
  paid_amount:
    lineage:
      - datalake_invoice.overdue_portfolio_timeline.paid_amount
    description: Invoice paid amount
  recovered_amount:
    lineage:
      - datalake_invoice.overdue_portfolio_timeline.recovered_amount
