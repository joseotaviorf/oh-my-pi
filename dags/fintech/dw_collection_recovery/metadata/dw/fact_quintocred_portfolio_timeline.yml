---
database_name: dw_collection_recovery
table_name: fact_quintocred_portfolio_timeline
owner: ae-finance-fintech@quintoandar.com.br
domain: fintech
description: The table contains a timeline view of the collections portfolio for QuintoCred context.
columns:
  sk_propose:
    description: 'Surrogate key of table. Propose ID from QuintoCred'
    lineage:
    - datalake_velo.collections_wallet.id_propose
  name:
    description: 'Name of the client being charged'
    lineage:
    - datalake_velo.collections_wallet.name
  document:
    description: 'Document number of the client'
    lineage:
    - datalake_velo.collections_wallet.document
  mob:
    description: 'Mob calculated between the date of reference (dt_base)'
    lineage:
    - datalake_velo.collections_wallet.mob
  type_description_array:
    description: 'Array containing all the delinquencies types considered to decide the major_type'
    lineage:
    - datalake_velo.collections_wallet.type_description_array
  major_type:
    description: 'Major type for this debt'
    lineage:
    - datalake_velo.collections_wallet.major_type
  team_negotiation:
    description: 'Team that made the negotiation'
  team_distribution:
    description: 'Team that received the debt via distribution'
    lineage:
    - datalake_recupera.changes_debts_distribution
  total_delinquency_amount:
    description: 'Total SUM of delinquencies amount for this debt'
    lineage:
    - datalake_velo.collections_wallet.total_delinquency_amount
  total_original_value:
    description: 'Total SUM of delinquencies original amount for this debt'
    lineage:
    - datalake_velo.collections_wallet.total_original_value
  total_amount_paid:
    description: 'Total SUM of delinquencies paid amount for this debt'
    lineage:
    - datalake_velo.collections_wallet.total_amount_paid
  amount_paid_added:
    description: 'Total SUM of delinquencies paid amount added on this dt_base for this debt'
    lineage:
    - datalake_velo.collections_wallet.amount_paid_added
  total_open_amount:
    description: 'Total SUM of delinquencies open amount for this debt at this dt_base'
    lineage:
    - datalake_velo.collections_wallet.total_open_amount
  is_finished_array:
    description: 'Array containing all the delinquencies is_finished status'
    lineage:
    - datalake_velo.collections_wallet.is_finished_array
  has_month_eviction:
    description: 'If this contract has any eviction issued this dt_base month'
    lineage:
    - datalake_velo.collections_wallet.has_month_eviction
  dt_ended_propose:
    description: 'dt_ended for this propose'
    lineage:
    - datalake_velo.collections_wallet.dt_ended_propose
  dt_base:
    description: 'Major date for this table, it maintains the timeline for each debt'
    lineage:
    - datalake_velo.collections_wallet.dt_base
  dt_paid_array:
    description: 'Array containing all the delinquencies dt_paid on this dt_base'
    lineage:
    - datalake_velo.collections_wallet.dt_paid_array
