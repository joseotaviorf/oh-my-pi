database_name: dw_collection_recovery
table_name: fact_debt
description: |
  It contains information about the debt, in granularity of invoice per debtor and contract, i.e, which invoices have been negotiated, even if the invoice has not yet expired, and which invoices have not yet been negotiated.
  An invoice can have 1 or more negotiations. 1 negotiation can include 1 or more invoices (from seu barriga).
  Also an invoice can be negotiated to more than one debtor, usually in case of a broken first negotation.
  If an extra invoice (installment of a negotiation created in SeuBarriga) is due, it will also be registered in this table.
domain: Fintech
owner: ae-finance-fintech@quintoandar.com.br
columns:
  sk_debt:
    lineage:
      - datalake_recupera_clean.creditor_pending.id_creditor
      - datalake_recupera_clean.complementary_records.id_creditor
      - datalake_recupera_clean.creditor_pending.id_installment
      - datalake_recupera_clean.complementary_records.id_installment
    description: Surrogate key of table. It is a sequencial number based on the id_creditor and id_installment.
  id_contract:
    lineage:
      - datalake_recupera_clean.creditor_pending.id_contract
      - datalake_recupera_clean.complementary_records.id_contract
    description: Contract ID (Propose ID on QuintoCred)
  id_invoice:
    lineage:
      - datalake_recupera_clean.creditor_pending.id_installment
      - datalake_recupera_clean.complementary_records.id_installment
    description: When on QuintoAndar, SeuBarriga original invoice ID. When on QuintoCred, Rental Guarantee Platform delinquency ID.
  creditor:
    lineage:
      - datalake_recupera_clean.creditor_pending.id_creditor
      - datalake_recupera_clean.complementary_records.id_creditor
    description: Creditor - IQ QuintoAndar, IQ QuintoCred or PP QuintoAndar
  invoice_payment_status:
    lineage:
      - datalake_retsuko.invoice.status
      - datalake_velo.junk.desc_lvl_1
    description: When QuintoAndar, Retsuko's current invoice status; When QuintoCred, Rental Guarantee Platform current delinquency status;
    categories:
      open: "QuintoAndar"
      paid: "QuintoAndar"
      written-down: "QuintoAndar"
      canceled: "QuintoAndar"
      not-payable: "QuintoAndar"
      divergent-payment: "QuintoAndar"
      registered: "QuintoCred - First status, when the delinquency is created"
      under_agreement: "QuintoCred - The delinquency was sent to Recupera"
      requested_agreement: "QuintoCred - Legacy status from 2.0, not used anymore"
      progress: "QuintoCred - The delinquency was paid (with gain or loss)"
      finished: "QuintoCred - A confirmed agreement between QuintoCred and the defaulter"
      recovering: "QuintoCred - Agreement requested but not confirmed yet"
  invoice_status:
    lineage:
      - datalake_retsuko.invoice.substatus
    description: Retsuko's current invoice substatus. Non-existant for QuintoCred.
    categories:
      debt: ""
      ongoing-negotiation: ""
      none: ""
  invoice_due_amount:
    lineage:
      - datalake_retsuko.invoice.due_amount
      - datalake_velo.occurrence.due_amount
    description: Invoice due amount
  invoice_paid_amount:
    lineage:
      - datalake_retsuko.invoice.paid_amount
      - datalake_velo.occurrence.paid_amount
    description: Invoice paid amount. This field will be filled int for rows where the original invoice is paid or the status is written down and there is a negotiation
  invoice_dt_due:
    lineage:
      - datalake_retsuko.invoice.ts_due
      - datalake_velo.occurrence.dt_due_legacy
      - datalake_velo.occurrence.dt_due
    description: Invoice due date
  dt_paid:
    lineage:
      - datalake_retsuko.invoice.ts_paid
      - datalake_velo.occurrence.ts_paid
    description: Invoice paid date. This field will be filled int for rows where the original invoice is paid or the status is written down and there is a negotiation
  ts_load:
    description: Timestamp of when the data was inserted into the table
