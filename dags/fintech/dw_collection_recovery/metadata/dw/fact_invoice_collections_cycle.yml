---
database_name: dw_collection_recovery
table_name: fact_invoice_collections_cycle
owner: ae-finance-fintech@quintoandar.com.br
domain: Fintech
description: Table contains all the important events of invoice in collections cycle
columns:
  sk_collections_cycle:
    description: "Surrogate key of table. It is the Invoice ID."
    lineage:
      - datalake_retsuko.invoice.id_contract_external
  id_contract:
    description: "Contract ID"
    lineage:
      - datalake_retsuko.invoice.id_contract_external
  id_customer:
    description: "Customer ID (CPF)"
    lineage:
      - datalake_recupera_clean.contracts.id_customer
  id_invoice:
    description: "Invoice ID"
    lineage:
      - datalake_retsuko.invoice.id_external
  id_negotiation_originated_invoice:
    description: "The ID Negotiation that generated the extra invoice. It will be filled in if the invoice was created in a negotiated"
    lineage:
      - dw_collection_recovery.fact_negotiation.sk_negotiation
      - dw_collection_recovery.fact_negotiation.id_negotiation_trato_feito
  id_negotiation:
    description: "ID Negotiation (agreement). It will be filled in if the invoice has been negotiated"
    lineage:
      - dw_collection_recovery.fact_negotiation.sk_negotiation
      - dw_collection_recovery.fact_negotiation.id_negotiation_trato_feito
  has_renegotiated:
    description: "ID Negotiation (agreement). It will be filled in if the invoice has been negotiated"
    lineage:
      - dw_collection_recovery.fact_negotiation.sk_negotiation
      - dw_collection_recovery.fact_negotiation.id_negotiation_trato_feito
  invoice_status:
    description: "Invoice status"
    categories:
      open: ""
      paid: ""
      written-down: "It is used to indicate that the invoice has been negotiated"
      canceled: ""
      not-payable: "zero value invoice (due-amount=0). It behaves as an open invoice but there is no charge or transfer that can be done. "
      divergent-payment: "invoice that was paid but the amount paid is different than the value of the invoice."
    lineage:
      - datalake_retsuko.invoice.status
  invoice_type:
    description: "Invice type (purpose)"
    categories:
      early-termination: ""
      extra: ""
      monthly: ""
      onboarding: ""
      pos-rental: ""
      estate-agent-services: ""
    lineage:
      - datalake_retsuko.invoice.purpose
  negotiation_status:
    description: "Status of the most recent negotiation (i.e, the one that has not been cancelled)"
    lineage:
      - dw_collection_recovery.fact_negotiation.negotiation_status
  total_negotiations:
    description: "Quantity of negotations for each invoice"
    lineage:
      - dw_collection_recovery.fact_negotiation.id_negotiation_trato_feito
  total_negotiation_installments:
    description: "Quantity of installment of the most recent negotiation (i.e, the one that has not been cancelled)"
    lineage:
      - dw_collection_recovery.fact_negotiation.number_of_installments
  total_paid_negotiation_installments:
    description: "Quantity of paid installment of the most recent negotiation (i.e, the one that has not been cancelled)"
    lineage:
      - dw_collection_recovery.fact_negotiation.paid_installments
  negotiation_amount:
    description: "Total Amount (R$) of the most recent negotiation (i.e, the one that has not been cancelled)"
    lineage:
      - dw_collection_recovery.fact_negotiation.negotiated_amount
  invoice_due_amount:
    description: "Invice Due Amount"
    lineage:
      - datalake_retsuko.invoice.due_amount
  paid_amount:
    description: "Invoice Paid Amount"
    lineage:
      - datalake_retsuko.invoice.paid_amount
  accrual_year_month:
    description: "Competence of invoice, i.e expectation of month for cash flow"
    lineage:
      - datalake_retsuko.invoice.accrual_year_month
  dt_invoice_created:
    description: "invoice creation date"
    lineage:
      - datalake_retsuko.invoice.ts_created
  dt_invoice_due:
    description: "Invoice due date"
    lineage:
      - datalake_retsuko.invoice.ts_due
  dt_debt_creation:
    description: "Debt creation date"
    lineage:
      - datalake_retsuko.invoice.ts_due
      - dw_public.dim_date.week_day
      - dw_public.dim_date.is_brz_holiday
  dt_paid:
    description: "Date when the invoice was paid"
    lineage:
      - datalake_retsuko.invoice.ts_paid
  dt_written_down:
    description: "Date when the invoice was written down (pt: baixada)"
    lineage:
      - datalake_retsuko.invoice.ts_paid
      - datalake_retsuko.invoice.status
  dt_original_debt_paid:
    description: "Date when the original debt of all negotiations was paid"
    lineage:
      - dw_collection_recovery.fact_negotiation.ts_paid_all
  dt_canceled:
    description: "Date when the invoice was canceled"
    lineage:
      - datalake_retsuko.invoice.ts_canceled
  dt_negotiation_created:
    description: "Date when the negotiation was created"
    lineage:
      - dw_collection_recovery.fact_negotiation.dt_promisse
  dt_expect_finish_negotiation:
    description: "Date when the negotiation is expected to finish (due date of the last installment)"
    lineage:
      - dw_collection_recovery.fact_negotiation.dt_expected_end
  ts_load:
    description: "Timestamp of when the data was inserted into the table"
