dag:
  name: velo_zendesk_homolog
  schedule_start_date: 2019, 9, 9
  schedule_interval: 0 0 * * *
  owner: Data Fintech
  documentation:
    dag_purpose: |
      Load data of the Velo's Zendesk to the Clean layer, the Raw layer is loaded by Stitch. Zendesk is responsible for the tickets of the customer services.
workflow:
  layer: raw
  type: custom_ingestion
  load_spark_job: add_partitions_to_raw_tables
  inner_dependencies:
    tickets_history:
      - tickets
  spark_job_arguments:
    - "{environment}"
    - "{bucket}"
    - "{{ ds }}"
    - "{{ next_ds }}"
    - "{table_name}"

  default_partitions: [year, month, day]
  tables_customization:
    group_memberships:
      extraction_type: full
      z_order_by: [id_group_membership]
    groups:
      extraction_type: full
      z_order_by: [id_group]
    organizations:
      extraction_type: full
      z_order_by: [id_organization]
    satisfaction_ratings:
      extraction_type: full
      z_order_by: [id_satisfaction_rating]
    ticket_fields:
      extraction_type: full
      z_order_by: [id_ticket_field]
    ticket_metrics:
      extraction_type: full
      z_order_by: [id_ticket]
    tickets_history:
      extraction_type: incremental
      raw_table_dependency: tickets
      z_order_by: [id_ticket]
    tickets:
      extraction_type: full
      z_order_by: [id_ticket]
    users:
      extraction_type: full
      z_order_by: [id_user]
    ticket_audits:
      extraction_type: incremental
      z_order_by: [id_ticket]

cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: r5d.large
    node_type_id: r5d.large
    spark_version: 13.3.x-scala2.12
    spark_conf:
      spark.driver.maxResultSize: "0"
    autoscale:
      min_workers: 2
      max_workers: 6
