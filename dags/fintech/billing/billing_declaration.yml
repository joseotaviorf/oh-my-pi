dag:
  name: billing
  schedule_start_date: 2025, 9, 1
  schedule_interval: 0 8,13 * * *
  owner: Data Fintech
  documentation:
    dag_purpose: |
      This DAG load tables from Billing, the service that calculates the revenue with external partners and executives.
workflow:
  type: cdc
  layer: raw
  database_type: postgres
  source_schema: public
  dbutils_secret_key: BILLING_DB
  lineage_product_database_name: billing
  tables_customization:
    account:
      clean_table_name: account
      raw_primary_keys: [id]
      clean_primary_keys: [id]
    contract_revision:
      source_schema: contract
      raw_primary_keys: [id]
      clean_primary_keys: [id]
      clean_table_name: contract_revision
    contract:
      source_schema: contract
      raw_primary_keys: [id]
      clean_primary_keys: [id]
      clean_table_name: contract
    entry:
      clean_table_name: entry
      transactional_datatype_overrides:
        amount: decimal(38,20)
    invoice:
      clean_table_name: invoice
      transactional_datatype_overrides:
        due_amount: decimal(38,20)
    recurrence_phase_control:
      clean_table_name: recurrence_phase_control
    recurrence_phase_execution:
      clean_table_name: recurrence_phase_execution
    recurrence_phase_revision:
      clean_table_name: recurrence_phase_revision
    recurrence_phase:
      clean_table_name: recurrence_phase
    recurrence_revision:
      clean_table_name: recurrence_revision
cluster:
  type: databricks_16_4_med_2xlarge_general_cluster
