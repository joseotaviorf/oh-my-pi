database_name: datalake_billing_clean
table_name: contract
owner: guilherme.sacramento@quintoandar.com.br
domain: Fintech
description: |
  Billing contract instance bound to a recurrence UUID, representing an active revenue-share
  agreement with an external partner or executive. Tracks lifecycle status and the current
  contract revision used to generate invoices and ledger entries.
columns:
  id:
    description: Surrogate key of the billing contract in the Billing service.
    lineage:
      - datalake_billing_raw.contract.id
  uuid_recurrence:
    description: UUID of the parent billing recurrence that defines the agreement terms.
    lineage:
      - datalake_billing_raw.contract.recurrence_uuid
  status:
    description: Lifecycle status of the contract (e.g. active, suspended, terminated).
    lineage:
      - datalake_billing_raw.contract.status
  current_revision:
    description: Latest processed revision number of the contract terms and payload.
    lineage:
      - datalake_billing_raw.contract.current_revision
  ts_created:
    description: Timestamp when the billing contract was created in the Billing service.
    lineage:
      - datalake_billing_raw.contract.created_at
  ts_updated:
    description: Timestamp of the most recent update to the contract status or revision pointer.
    lineage:
      - datalake_billing_raw.contract.updated_at
