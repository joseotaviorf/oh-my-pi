database_name: datalake_billing_clean
table_name: recurrence_revision
owner: guilherme.sacramento@quintoandar.com.br
domain: Fintech
description: Versioned terms of a recurring charge plan, including currency and payment
  timing rules.
columns:
  id:
    description: Internal identifier of the recurrence terms version.
    lineage:
    - datalake_billing_raw.recurrence_revision.id
  id_recurrence:
    description: Recurring charge plan these terms belong to.
    lineage:
    - datalake_billing_raw.recurrence_revision.recurrence_id
  revision:
    description: Sequential version number of the recurrence terms.
    lineage:
    - datalake_billing_raw.recurrence_revision.revision
  currency:
    description: Currency used for all charges under this version.
    lineage:
    - datalake_billing_raw.recurrence_revision.currency
  min_number_of_days_to_pay:
    description: Minimum number of days allowed for payment after a charge is issued.
    lineage:
    - datalake_billing_raw.recurrence_revision.min_number_of_days_to_pay
  type_of_min_number_days_to_pay:
    description: Rule that defines how the minimum payment period is counted.
    lineage:
    - datalake_billing_raw.recurrence_revision.type_of_min_number_days_to_pay
  metadata:
    description: Additional structured attributes not mapped to dedicated columns.
    lineage:
    - datalake_billing_raw.recurrence_revision.metadata
  dt_start_charge:
    description: First date from which the recurrence may start generating charges.
    lineage:
    - datalake_billing_raw.recurrence_revision.start_charge_date
  ts_createed:
    description: When this terms version was first registered.
    lineage:
    - datalake_billing_raw.recurrence_revision.created_at
