database_name: datalake_billing_clean
table_name: recurrence_revision
domain: Fintech
description: Data from the recurrence revision table containing revision details, currency information, and payment terms
columns:
  id:
    description: Unique identifier of the recurrence revision record
    lineage:
      - datalake_billing_raw.recurrence_revision.id
  id_recurrence:
    description: Identifier of the related recurrence
    lineage:
      - datalake_billing_raw.recurrence_revision.recurrence_id
  revision:
    description: Revision number of the recurrence
    lineage:
      - datalake_billing_raw.recurrence_revision.revision
  currency:
    description: Currency code for the recurrence
    lineage:
      - datalake_billing_raw.recurrence_revision.currency
  min_number_of_days_to_pay:
    description: Minimum number of days required for payment
    lineage:
      - datalake_billing_raw.recurrence_revision.min_number_of_days_to_pay
  type_of_min_number_days_to_pay:
    description: Type classification for the minimum payment days
    lineage:
      - datalake_billing_raw.recurrence_revision.type_of_min_number_days_to_pay
  metadata:
    description: Free form metadata associated with the revision
    lineage:
      - datalake_billing_raw.recurrence_revision.metadata
  dt_start_charge:
    description: Start date for charging the recurrence
    lineage:
      - datalake_billing_raw.recurrence_revision.start_charge_date
  ts_createed:
    description: Record creation timestamp
    lineage:
      - datalake_billing_raw.recurrence_revision.created_at
