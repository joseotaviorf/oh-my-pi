database_name: datalake_billing_clean
table_name: recurrence_phase_execution
owner: guilherme.sacramento@quintoandar.com.br
domain: Fintech
description: Records each execution cycle that bills items for a phase revision, including
  run status and accrual timing.
columns:
  id:
    description: Internal identifier of the phase execution run.
    lineage:
    - datalake_billing_raw.recurrence_phase_execution.id
  id_external:
    description: External reference used to correlate this run with downstream billing
      systems.
    lineage:
    - datalake_billing_raw.recurrence_phase_execution.external_id
  id_recurrence_phase_revision:
    description: Phase configuration version executed in this run.
    lineage:
    - datalake_billing_raw.recurrence_phase_execution.recurrence_phase_revision_id
  status:
    description: Execution state (e.g. created, open, closed, canceled, or failed).
    lineage:
    - datalake_billing_raw.recurrence_phase_execution.status
  status_reason:
    description: Explanation when the execution did not complete successfully.
    lineage:
    - datalake_billing_raw.recurrence_phase_execution.status_reason
  dt_accrual:
    description: Accrual month billed by this execution run.
    lineage:
    - datalake_billing_raw.recurrence_phase_execution.accrual
  dt_opened:
    description: Calendar date when the execution was opened.
    lineage:
    - datalake_billing_raw.recurrence_phase_execution.opened_at
  dt_closed:
    description: Calendar date when the execution was closed.
    lineage:
    - datalake_billing_raw.recurrence_phase_execution.closed_at
  ts_created:
    description: When the execution run was first registered.
    lineage:
    - datalake_billing_raw.recurrence_phase_execution.created_at
  ts_updated:
    description: When the execution run was last changed.
    lineage:
    - datalake_billing_raw.recurrence_phase_execution.updated_at
