database_name: datalake_billing_clean
table_name: recurrence_phase_revision
owner: guilherme.sacramento@quintoandar.com.br
domain: Fintech
description: Versioned configuration of a billing phase, defining charge periodicity,
  schedule boundaries, and lifecycle status.
columns:
  id:
    description: Internal identifier of the phase configuration version.
    lineage:
    - datalake_billing_raw.recurrence_phase_revision.id
  id_recurrence_phase:
    description: Billing phase this configuration version applies to.
    lineage:
    - datalake_billing_raw.recurrence_phase_revision.recurrence_phase_id
  revision:
    description: Sequential version number within the phase.
    lineage:
    - datalake_billing_raw.recurrence_phase_revision.revision
  period:
    description: Billing periodicity for this version (e.g. monthly or quarterly).
    lineage:
    - datalake_billing_raw.recurrence_phase_revision.period
  index:
    description: Order of this version among sibling phases in the same recurrence.
    lineage:
    - datalake_billing_raw.recurrence_phase_revision.index
  status:
    description: Whether this phase version is still active or has ended.
    lineage:
    - datalake_billing_raw.recurrence_phase_revision.status
  status_reason:
    description: Explanation when the phase version was ended or changed.
    lineage:
    - datalake_billing_raw.recurrence_phase_revision.status_reason
  metadata:
    description: Additional structured attributes not mapped to dedicated columns.
    lineage:
    - datalake_billing_raw.recurrence_phase_revision.metadata
  dt_start_charge:
    description: First date from which charges are allowed under this version.
    lineage:
    - datalake_billing_raw.recurrence_phase_revision.start_charge
  dt_end_charge:
    description: Last date until which charges are allowed under this version.
    lineage:
    - datalake_billing_raw.recurrence_phase_revision.end_charge
  dt_open:
    description: Calendar day of the month when the billing window opens.
    lineage:
    - datalake_billing_raw.recurrence_phase_revision.open_date
  dt_close:
    description: Calendar day of the month when the billing window closes.
    lineage:
    - datalake_billing_raw.recurrence_phase_revision.close_date
  ts_created:
    description: When this configuration version was first registered.
    lineage:
    - datalake_billing_raw.recurrence_phase_revision.created_at
