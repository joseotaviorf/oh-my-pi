database_name: datalake_billing_clean
table_name: recurrence
owner: guilherme.sacramento@quintoandar.com.br
domain: Fintech
description: |
  Root billing recurrence entity defining the commercial agreement template for partner and
  executive revenue share. Carries business context, originating source system, and the
  revision chain from which contracts and invoices are generated.
columns:
  id:
    description: Surrogate key of the billing recurrence in the Billing service.
    lineage:
      - datalake_billing_raw.recurrence.id
  uuid_recurrence:
    description: Stable UUID used to link contracts and downstream billing artifacts to this recurrence.
    lineage:
      - datalake_billing_raw.recurrence.recurrence_uuid
  business_entity_id:
    description: Identifier of the commercial entity (partner or executive) covered by this recurrence.
    lineage:
      - datalake_billing_raw.recurrence.business_entity_id
  source:
    description: Upstream system or channel that created the recurrence (e.g. partner portal, batch import).
    lineage:
      - datalake_billing_raw.recurrence.source
  business_context:
    description: Product or business line the recurrence applies to (e.g. rent, sale, partner program).
    lineage:
      - datalake_billing_raw.recurrence.business_context
  current_revision:
    description: Latest processed revision number of the recurrence terms and configuration.
    lineage:
      - datalake_billing_raw.recurrence.current_revision
  idempotency_key:
    description: Key guaranteeing idempotent creation of the recurrence when retried by upstream systems.
    lineage:
      - datalake_billing_raw.recurrence.idempotency_key
  ts_created:
    description: Timestamp when the billing recurrence was created in the Billing service.
    lineage:
      - datalake_billing_raw.recurrence.created_at
  ts_updated:
    description: Timestamp of the most recent update to the recurrence record.
    lineage:
      - datalake_billing_raw.recurrence.updated_at
