database_name: datalake_credit_journey_experience
table_name: credit_evaluation_listing_page
owner: isabella.santos@quintoandar.com.br
domain: Fintech
description: Aggregated Amplitude events for the listing card entry points into the credit evaluation journey (anchor clicked/viewed).
columns:
  id_session:
    lineage:
    - datalake_amplitude_clean.170698_evaluation_anchor_clicked_events.id_session
    - datalake_amplitude_clean.170698_evaluation_anchor_viewed_events.id_session
    description: Amplitude session identifier.
  id_amplitude:
    lineage:
    - datalake_amplitude_clean.170698_evaluation_anchor_clicked_events.id_amplitude
    - datalake_amplitude_clean.170698_evaluation_anchor_viewed_events.id_amplitude
    description: Amplitude event unique identifier.
  id_user:
    lineage:
    - datalake_amplitude_clean.170698_evaluation_anchor_clicked_events.id_user
    - datalake_amplitude_clean.170698_evaluation_anchor_viewed_events.id_user
    description: User identifier from Amplitude.
  event_name:
    lineage:
    - datalake_amplitude_clean.170698_evaluation_anchor_clicked_events.event_type
    - datalake_amplitude_clean.170698_evaluation_anchor_viewed_events.event_type
    description: Event type name from Amplitude.
  event_source:
    description: High-level source label for the card.
  city:
    lineage:
    - datalake_amplitude_clean.170698_evaluation_anchor_clicked_events.city
    - datalake_amplitude_clean.170698_evaluation_anchor_viewed_events.city
    description: City in which the user is located.
  region:
    lineage:
    - datalake_amplitude_clean.170698_evaluation_anchor_clicked_events.region
    - datalake_amplitude_clean.170698_evaluation_anchor_viewed_events.region
    description: Region in which the user is located.
  country:
    lineage:
    - datalake_amplitude_clean.170698_evaluation_anchor_clicked_events.country
    - datalake_amplitude_clean.170698_evaluation_anchor_viewed_events.country
    description: Country in which the user is located.
  device_family:
    lineage:
    - datalake_amplitude_clean.170698_evaluation_anchor_clicked_events.device_family
    - datalake_amplitude_clean.170698_evaluation_anchor_viewed_events.device_family
    description: Device used by the user to access the app.
  version_name:
    lineage:
    - datalake_amplitude_clean.170698_evaluation_anchor_clicked_events.version_name
    - datalake_amplitude_clean.170698_evaluation_anchor_viewed_events.version_name
    description: App version name.
  credit_passport_city_name:
    lineage:
    - datalake_amplitude_clean.170698_evaluation_anchor_clicked_events.event_properties.city_name
    - datalake_amplitude_clean.170698_evaluation_anchor_viewed_events.event_properties.city_name
    description: City name selected by the user to to the Credit Passport.
  entry_point:
    lineage:
    - datalake_amplitude_clean.170698_evaluation_anchor_clicked_events.event_properties.anchor_variant
    - datalake_amplitude_clean.170698_evaluation_anchor_viewed_events.event_properties.anchor_variant
    description: Entry point variant extracted from properties.
  entry_point_position:
    lineage:
    - datalake_amplitude_clean.170698_evaluation_anchor_clicked_events.event_properties.anchor_position
    - datalake_amplitude_clean.170698_evaluation_anchor_viewed_events.event_properties.anchor_position
    description: Entry point position in the listing.
  user_pre_approved_value:
    lineage:
    - datalake_amplitude_clean.170698_evaluation_anchor_clicked_events.event_properties.preapproved_value
    - datalake_amplitude_clean.170698_evaluation_anchor_viewed_events.event_properties.preapproved_value
    description: Pre-approved value informed to the user.
  source:
    description: Source type extracted or derived from event properties.
  source_value:
    lineage:
    - datalake_amplitude_clean.170698_evaluation_anchor_clicked_events.event_properties.source_value
    - datalake_amplitude_clean.170698_evaluation_anchor_viewed_events.event_properties.source_value
    description: Source value extracted from event properties. It can be the listing value or the offer value.
  current_page:
    lineage:
    - datalake_amplitude_clean.170698_evaluation_anchor_viewed_events.event_properties.current_page
    description: Current page where the event happened (when available).
  is_early_credit:
    lineage:
    - datalake_amplitude_clean.170698_evaluation_anchor_clicked_events.event_properties.early_credit
    - datalake_amplitude_clean.170698_evaluation_anchor_viewed_events.event_properties.early_credit
    description: Flag indicating Early Credit context.
  is_credit_passport:
    lineage:
    - datalake_amplitude_clean.170698_evaluation_anchor_clicked_events.event_properties.credit_passport
    - datalake_amplitude_clean.170698_evaluation_anchor_clicked_events.event_properties.credit_evaluation
    - datalake_amplitude_clean.170698_evaluation_anchor_viewed_events.event_properties.credit_passport
    - datalake_amplitude_clean.170698_evaluation_anchor_viewed_events.event_properties.credit_evaluation
    description: Flag indicating Credit Passport context (from credit_passport or credit_evaluation).
  ts_event:
    lineage:
    - datalake_amplitude_clean.170698_evaluation_anchor_clicked_events.ts_event
    - datalake_amplitude_clean.170698_evaluation_anchor_viewed_events.ts_event
    description: Event timestamp.
  year:
    lineage:
    - datalake_amplitude_clean.170698_evaluation_anchor_clicked_events.year
    - datalake_amplitude_clean.170698_evaluation_anchor_viewed_events.year
    description: Partition column year.
  month:
    lineage:
    - datalake_amplitude_clean.170698_evaluation_anchor_clicked_events.month
    - datalake_amplitude_clean.170698_evaluation_anchor_viewed_events.month
    description: Partition column month.
  day:
    lineage:
    - datalake_amplitude_clean.170698_evaluation_anchor_clicked_events.day
    - datalake_amplitude_clean.170698_evaluation_anchor_viewed_events.day
    description: Partition column day.
