database_name: dw_credit_evers
table_name: fact_credit_evers_original_due_date
owner: guilherme.sacramento@quintoandar.com.br
domain: Fintech
description: Credit Evers (delinquency) contracts with original due date. It reports Ever 'limpo', i.e, contains only monthly and onboarding invoices.
columns:
  id_contract_ebdb:
    lineage:
      - datalake_invoice.credit_invoice_original_due_date.id_contract_ebdb
    description: "External ID of contract, i.e from main"
  id_contract_retsuko:
    lineage:
      - dw_credit_evers.fact_ever_invoices.id_contract_retsuko
    description: "Internal ID of contract, i.e from retsuko"
  id_proposal:
    lineage:
      - datalake_invoice.credit_invoice_original_due_date.id_proposal
    description: "Proposal ID of contract"
  invoice_anchor:
    description: "First invoice of the reference contract"
  invoice_origin:
    description: "Last invoice of the reference contract"
  months_of_contract:
    description: "Age of contracts in month, if ended, the total age"
  contract_mob_number:
    description: "Auxiliary array for explode the contract by its monthly age classifications"
  contract_ever_number:
    description: "Auxiliary array for explode the contract by its delay classification"
  num_overs_in_mob_window:
    description: "Operation that determines how many times the contract had an invoice positively over in delay by age evolution"
  total_due_amount_in_mob_window:
    description: "Operation that determines how much money the contract had over in delay by maximum age in mob view"
  num_total_overs:
    description: "Operation that determines how many times the contract had an invoice positively over in delay to maximum age"
  total_due_amount:
    description: "Operation that determines how much money the contract had over in delay by maximum age"
  is_ever:
    description: "Operation that determines if the delay of invoice is higher than the auxiliary ever classification columns and takes the maximum"
  is_agreement:
    description: "Operation that determines if the ever was an agreement"
  ts_signature:
    lineage:
      - datalake_invoice.credit_invoice_original_due_date.ts_signature
    description: "Date that the contract started"
  dt_reference:
    description: "ts_signarute + contract_mob_number"
  dt_contract_updated:
    lineage:
      - datalake_invoice.credit_invoice_original_due_date.dt_contract_updated
    description: "Last date that the contract had informations updated in main"
  dt_cancellation:
    description: "Date cancellation when the contract was an agreement"
