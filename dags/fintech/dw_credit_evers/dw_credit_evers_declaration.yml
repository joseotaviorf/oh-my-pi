dag:
  name: dw_credit_evers
  schedule_start_date: 2024,09,03
  owner: Data Fintech
  documentation:
    dag_purpose:
      "The Ever concept determines whether a tenant on 5A is a delinquent or not. A
      given contract is considered an EverXMobY if it has at least one invoice overdue
      by X days in the first Y months of the contract.

      This concept is closely related to the concept of an Over invoice. This table
      will bring benefits to Credit Analytics Team and Data Products Team, in order
      to produce Machine Learning models."
workflow:
  type: query_delta
  layer: dw
  short_circuit_customization:
    function: CHECK_IS_LAST_BUSINESS_DAY_OF_MONTH
  custom_schema: credit_evers
  spark_session_configs:
    udfs: [FINTECHOPS_WORK_MIN_SLA]
cluster:
  type: databricks_13_3_med_general_cluster
