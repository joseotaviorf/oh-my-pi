dag:
  name: dw_credit_evers
  schedule_start_date: 2024,09,03
  owner: Data Fintech
  documentation:
    dag_purpose:
      "The Ever concept determines whether a tenant on 5A is a delinquent or not. A
      given contract is considered an EverXMobY if it has at least one invoice overdue
      by X days in the first Y months of the contract.

      This concept is closely related to the concept of an Over invoice. This table
      will bring benefits to Credit Analytics Team and Data Products Team, in order
      to produce Machine Learning models.

      The DAG is triggered once a month, on the first day following the first business day of the month."
workflow:
  type: query_delta
  layer: dw
  short_circuit_customization:
    function: CHECK_IS_FIRST_BUSINESS_DAY_OF_MONTH
  custom_schema: credit_evers
  inner_dependencies:
    fact_credit_evers_original_due_date:
      - fact_ever_invoices
    fact_ever_clean:
      - fact_credit_overdue_invoices
    fact_ever_full:
      - fact_credit_overdue_invoices
    fact_ever:
      - fact_ever_clean
      - fact_ever_full
  spark_session_configs:
    udfs: [FINTECHOPS_WORK_MIN_SLA]
cluster:
  type: databricks_13_3_med_general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: "quintoandar_{{ var.value.environment }}"
