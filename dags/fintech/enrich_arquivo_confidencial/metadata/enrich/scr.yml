database_name: datalake_arquivo_confidencial
table_name: scr
owner: giuseppe.giovanelli@quintoandar.com.br
domain: fintech
description: "Table with SCR data broken by Months on Booking (mob) and version."
columns:
  id:
    description: "Identification from integration report table."
    lineage:
        - datalake_arquivo_confidencial_clean.integration_report.id
  cpf:
    description: "Personal identification from main proponent."
    lineage:
        - datalake_arquivo_confidencial_clean.integration_report.cpf
  version:
    description: "Numer of times certain cpf data were registered on the table for a particular provider."
    lineage:
        - datalake_arquivo_confidencial_clean.integration_report.version
  mob:
    description: "Months on Booking. Commom name for designating number of months before an event."
    lineage:
        - datalake_arquivo_confidencial_clean.integration_report.mob
  reference_date:
    description: "Year month of the credit limits data."
    lineage:
        - datalake_arquivo_confidencial_clean.integration_report.reference_date
  value:
    description: "SCR property value."
    lineage:
        - datalake_arquivo_confidencial_clean.integration_report.raw_data
  domain:
    description: "SCR data identification regarding type and time."
    lineage:
        - datalake_arquivo_confidencial_clean.integration_report.raw_data
  modality:
    description: "SCR data identification of balance operation group."
    lineage:
        - datalake_arquivo_confidencial_clean.integration_report.raw_data
  submodality:
    description: "SCR data identification of balance operation detail."
    lineage:
        - datalake_arquivo_confidencial_clean.integration_report.raw_data
  domain_group:
    description: "SCR domain grouping based on status."
    lineage:
        - datalake_arquivo_confidencial_clean.integration_report.raw_data
  modality_description:
    description: "SCR data balance operation group."
    lineage:
        - datalake_arquivo_confidencial_clean.integration_report.raw_data
  submodality_description:
    description: "SCR data balance operation detail."
    lineage:
        - datalake_arquivo_confidencial_clean.integration_report.raw_data
  linked_to_foreign_currency:
    description: "If data is informed on foreign currency."
    lineage:
        - datalake_arquivo_confidencial_clean.integration_report.raw_data
  ts_created:
    description: "Date information was created"
    lineage:
        - datalake_arquivo_confidencial_clean.integration_report.ts_created
  ts_updated:
    description: "Date information was last updated."
    lineage:
        - datalake_arquivo_confidencial_clean.integration_report.ts_updated
  ts_next_updated:
    description: "Next date the cpf had its data updated"
    lineage:
        - datalake_arquivo_confidencial_clean.integration_report.ts_updated
