database_name: datalake_arquivo_confidencial
table_name: scr
owner: isabella.santos@quintoandar.com.br
domain: Fintech
description: >
  Exploded QI Tech Bacen SCR operations from Arquivo Confidencial aud,
  one row per CPF/Mob/reference_date/operation item for credit screening.
columns:
  id:
    description: FK to integration_report_aud.
    lineage:
      - datalake_arquivo_confidencial_clean.integration_report_aud.id
  cpf:
    description: Brazilian individual taxpayer registry number (CPF) (PII).
    lineage:
      - datalake_arquivo_confidencial_clean.integration_report_aud.cpf
  rev_end:
    description: Envers end revision; null means current version.
    lineage:
      - datalake_arquivo_confidencial_clean.integration_report_aud.rev_end
  mob:
    description: Months-on-book rank of SCR reference_date per CPF load (1 = newest).
    lineage:
      - datalake_arquivo_confidencial_clean.integration_report_aud.raw_data
      - datalake_arquivo_confidencial_clean.integration_report_aud.ts_created
  reference_date:
    description: Year-month of the SCR snapshot inside the provider payload.
    lineage:
      - datalake_arquivo_confidencial_clean.integration_report_aud.raw_data
  has_scr_attributes:
    description: 1 if attributes contain SCR data; else 0.
    lineage:
      - datalake_arquivo_confidencial_clean.integration_report_aud.attributes
  value:
    description: Operation balance for domain/modality/submodality (BRL; cents × 0.01).
    lineage:
      - datalake_arquivo_confidencial_clean.integration_report_aud.raw_data
  domain:
    description: Bacen SCR maturity bucket — a vencer (110–190), vencido (205–290), or credit limit (20/40).
    lineage:
      - datalake_arquivo_confidencial_clean.integration_report_aud.raw_data
  modality:
    description: Bacen SCR modality code (product/operation group).
    lineage:
      - datalake_arquivo_confidencial_clean.integration_report_aud.raw_data
  submodality:
    description: Bacen SCR submodality code (product/operation detail).
    lineage:
      - datalake_arquivo_confidencial_clean.integration_report_aud.raw_data
  domain_group:
    description: Provider grouping of the SCR domain.
    lineage:
      - datalake_arquivo_confidencial_clean.integration_report_aud.raw_data
  modality_description:
    description: Human-readable modality label from the provider.
    lineage:
      - datalake_arquivo_confidencial_clean.integration_report_aud.raw_data
  submodality_description:
    description: Human-readable submodality label from the provider.
    lineage:
      - datalake_arquivo_confidencial_clean.integration_report_aud.raw_data
  linked_to_foreign_currency:
    description: Whether the operation is flagged as foreign-currency linked.
    lineage:
      - datalake_arquivo_confidencial_clean.integration_report_aud.raw_data
  financial_institution_count:
    description: Number of financial institutions in the SCR report.
    lineage:
      - datalake_arquivo_confidencial_clean.integration_report_aud.raw_data
  start_relationship_date:
    description: Start date of the CPF relationship in the Bacen SCR.
    lineage:
      - datalake_arquivo_confidencial_clean.integration_report_aud.raw_data
  ts_created:
    description: Timestamp when the integration_report_aud row was created.
    lineage:
      - datalake_arquivo_confidencial_clean.integration_report_aud.ts_created
  ts_updated:
    description: Revision timestamp from rev_info for this aud row.
    lineage:
      - datalake_arquivo_confidencial_clean.rev_info.ts_created
  ts_next_updated:
    description: Next revision timestamp for the same CPF/Mob (LEAD over ts_updated).
    lineage:
      - datalake_arquivo_confidencial_clean.rev_info.ts_created
