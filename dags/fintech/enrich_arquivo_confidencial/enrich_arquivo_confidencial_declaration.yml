---
dag:
  name: enrich_arquivo_confidencial
  schedule_start_date: 2023, 1, 26
  owner: Data Fintech
  documentation:
    dag_purpose: |
      Creates enriched tables for Arquivo Confidencial data.
workflow:
  type: query_delta
  layer: enrich
  inner_dependencies:
    scr_pivot:
      - scr
cluster:
  type: databricks_12_2_min_io-memory_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
