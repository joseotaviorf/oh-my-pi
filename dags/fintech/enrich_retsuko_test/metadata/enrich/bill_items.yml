---
database_name: datalake_retsuko_test
table_name: bill_items
owner: leticia.silveira@quintoandar.com.br
domain: fintech
description: "Granular table by bill items with data from the last 3 years"
columns:
  id_contract:
    description: "contract identification"
    lineage:
      - datalake_retsuko_clean_test.contract.id_external
      - datalake_retsuko_test.invoice.id_contract
      - datalake_retsuko_clean_test.contract.id
  id_invoice:
    description: "invoice identification"
    lineage:
      - datalake_retsuko_test.invoice.id_external
      - datalake_retsuko_test.entry.id_invoice
  purpose:
    description: "purpose of this invoice item"
    lineage:
      - datalake_retsuko_test.invoice.purpose
  payment_status:
    description: "payment status of the invoice"
    lineage:
      - datalake_retsuko_test.invoice.status
  bill_item:
    description: "name of the bill item, that is, what the item of invoice refers to"
    lineage:
      - datalake_retsuko_test.entry.bill_item
  bill_item_description:
    description: "bill item description"
    lineage:
      - datalake_retsuko_test.entry.description
  bill_item_cluster_name:
    description: "name of the cluster that groups certain types of bill item (business rule defined for bill-item cohort calculation)"
    categories:
      "CONDOMINIO": Bill items associated with expenses of condominium, this cluster representes single-time charges due to process of internalization of condominium debt by 5A from the landlord
      "MULTA-RECISORIA": Bill items that represent the charge due to early termination of contract
      "ACORDO": Bill items that represent the invoice as a nagoation of a previous debt
      "RENTAL-CORE": Bill items that build the monthly invoices in general
      "REPAROS": Bill items associated with repairs in the house
      "MULTAS ONGOING": Bill items that represent late fees due to previous delay
      "UTILIDADES": Bill items that represent default in light, water and/ or gas
  value_sign_bill_item:
    description: "sign value of bill item, positive means its a due value TO 5A, and negative means its a due value FROM 5A"
    lineage:
      - datalake_retsuko_clean_test.account.type
  from_account_type:
    description: "type of account being billed, i.e type of account from where the debt is charged"
  to_account_type:
    description: "type of account being credited, i.e type of account to where the debt is due"
  due_amount:
    description: "invoice amount, negative means its a due value TO 5A, and positive means its a due value FROM 5A"
    lineage:
      - datalake_retsuko_test.invoice.due_amount
  accrual_year_month:
    description: "accumulate invoice month and year"
    lineage:
      - datalake_retsuko_test.entry.accrual_year_month
  accrual_year_month_invoice:
    description: "accumulate invoice month and year"
    lineage:
      - datalake_retsuko_test.invoice.accrual_year_month
  dt_created:
    description: "creation date of invoice"
    lineage:
      - datalake_retsuko_test.invoice.ts_created
  dt_sent:
    description: "sent date of invoice"
    lineage:
      - datalake_retsuko_test.invoice.ts_sent
  dt_due:
    description: "due date of invoice"
    lineage:
      - datalake_retsuko_test.invoice.ts_due
  dt_paid:
    description: "paid date of invoice"
    lineage:
      - datalake_retsuko_test.invoice.ts_paid
  dt_canceled:
    description: "invoice cancellation date"
    lineage:
      - datalake_retsuko_test.invoice.ts_canceled
