---
database_name: dw_public
table_name: dim_date
owner: fintech-ae@quintoandar.com.br
domain: cross
description: Table that has all base structures for hadling dates on QuintoAndar
columns:
  sk_date:
    description: Date ID (%Y%m%d format)
    lineage:
      - datalake_quintoandar.aux_date.id_date
  day:
    description: Day of month
    lineage:
      - datalake_quintoandar.aux_date.day
  day_of_year:
    description: Integer that represents the day of the year
    lineage:
      - datalake_quintoandar.aux_date.day_of_year
  week_day:
    description: The number of the day of the week. The day is given as an integer, ranging from 0 (Sunday) to 6 (Saturday)
    lineage:
      - datalake_quintoandar.aux_date.week_day
  weekday_name:
    description: "The name of the day of the week. Values: Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday"
    lineage:
      - datalake_quintoandar.aux_date.weekday_name
  calendar_week:
    description: Week number of a year
    lineage:
      - datalake_quintoandar.aux_date.calendar_week
  weekend:
    description: Indicates wheter is weekend or weekday
    lineage:
      - datalake_quintoandar.aux_date.weekend
  month:
    description: Number of the month
    lineage:
      - datalake_quintoandar.aux_date.month
  month_name:
    description: Name of the month
    lineage:
      - datalake_quintoandar.aux_date.month_name
  bimester:
    description: Number of the bimester.
    categories:
      "1": January to February
      "2": March to April
      "3": May to June
      "4": July to August
      "5": September to October
      "6": November to December
    lineage:
      - datalake_quintoandar.aux_date.bimester
  bimester_name:
    description: Name of the bimester.
    lineage:
      - datalake_quintoandar.aux_date.bimester_name
  quarter:
    description: The quarter of the year.
    categories:
      "1": January to March
      "2": April to June
      "3": July to September
      "4": October to December
    lineage:
      - datalake_quintoandar.aux_date.quarter
  brz_season:
    description: "The season in Brazil: Summer, Autumn, Winter, Sprint"
    lineage:
      - datalake_quintoandar.aux_date.brz_season
  year:
    description: Year
    lineage:
      - datalake_quintoandar.aux_date.year
  year_calendar_week:
    description: Week number/year
    lineage:
      - datalake_quintoandar.aux_date.year_calendar_week
  year_month:
    description: Year/month
    lineage:
      - datalake_quintoandar.aux_date.year_month
  year_quarter:
    description: Year/quarter
    lineage:
      - datalake_quintoandar.aux_date.year_quarter
  working_days_in_month:
    description: Cumulative sum of business days in the month counting from the first day to the day in question (date field)
    lineage:
      - datalake_quintoandar.aux_date.working_days_in_month
  working_days_in_month_fintech:
    description: Cumulative sum of business days, based on bank calendar (Fintech), in the month counting from the first day to the day in question (date field)
    lineage:
      - datalake_quintoandar.aux_date.working_days_in_month_fintech
  total_working_days_in_month:
    description: The total of working days in a month
    lineage:
      - datalake_quintoandar.aux_date.total_working_days_in_month
  total_working_days_in_month_fintech:
    description: The total of working days in a month based on bank calendar (Fintech)
    lineage:
      - datalake_quintoandar.aux_date.total_working_days_in_month_fintech
  total_days_in_month:
    description: The total of days in a month
    lineage:
      - datalake_quintoandar.aux_date.total_days_in_month
  is_brz_holiday:
    description: Indicates whether the day is a brazilian nacional holiday not. The dates listed as holidays are the same dates Google Calendar reports as holidays.
    lineage:
      - datalake_quintoandar.aux_date.is_brz_holiday
  is_brz_fintech_holiday:
    description: "Brazilian bank holidays used for fintech models. Disregards holidays: Carnival end, Black Awareness Day, Christmas Eve"
    lineage:
      - datalake_quintoandar.aux_date.is_brz_fintech_holiday
  is_brz_business_day:
    description: Indicates, based on the fields weekend and is_brz_holiday, whether the day is a brazilian business day or not. The dates listed as business days are the same dates reported by Google Calendar based on the Brazilian national holiday calendar.
    lineage:
      - datalake_quintoandar.aux_date.is_brz_business_day
  is_brz_fintech_business_day:
    description: Indicates, based on the fields weekend and is_brz_fintech_holiday, whether the day is a brazilian business day or not. The dates listed as business days are the same dates reported by Google Calendar based on the Brazilian national holiday calendar.
    lineage:
      - datalake_quintoandar.aux_date.is_brz_fintech_business_day
  next_brz_business_day:
    description: Indicates, based on the fields weekend and is_brz_holiday, the next brazilian business day.
    lineage:
      - datalake_quintoandar.aux_date.next_brz_business_day
  next_brz_fintech_business_day:
    description: Indicates, based on the fields weekend and is_brz_fintech_holiday, the next brazilian business day
    lineage:
      - datalake_quintoandar.aux_date.next_brz_fintech_business_day
  is_mx_holiday:
    description: Indicates whether is a mexican holiday or not
    lineage:
      - datalake_quintoandar.aux_date.is_mx_holiday
  mx_holiday_name:
    description: Name of the mexican holiday
    lineage:
      - datalake_quintoandar.aux_date.mx_holiday_name
  date:
    description: Date in %Y-%m-%d format
    lineage:
      - datalake_quintoandar.aux_date.date
  brz_date:
    description: Date in %d/%m/%Y format
    lineage:
      - datalake_quintoandar.aux_date.brz_date
  universal_date:
    description: Date in %Y/%m/%d format
    lineage:
      - datalake_quintoandar.aux_date.universal_date
  week_start:
    description: The day when the week starts
    lineage:
      - datalake_quintoandar.aux_date.week_start
  week_end:
    description: The day when the week ended
    lineage:
      - datalake_quintoandar.aux_date.week_end
  month_start:
    description: The first day of the month
    lineage:
      - datalake_quintoandar.aux_date.month_start
  month_end:
    description: The last day of the month.
    lineage:
      - datalake_quintoandar.aux_date.month_end
  bimester_start:
    description: The first day of the bimester.
    lineage:
      - datalake_quintoandar.aux_date.bimester_start
  bimester_end:
    description: The last day of the bimester.
    lineage:
      - datalake_quintoandar.aux_date.bimester_end
  days_since_beginning_of_month:
    description: Difference between the first day of the month and the date referred to (date - month_start)
    lineage:
      - datalake_quintoandar.aux_date.days_since_beginning_of_month
  days_until_end_of_month:
    description: Difference between the last day of the month and the date referred to (month_end - date)
    lineage:
      - datalake_quintoandar.aux_date.days_until_end_of_month
  last_day:
    description: Previous day (date - 1 day).
    lineage:
      - datalake_quintoandar.aux_date.last_day
  last_week:
    description: Previous week (date - 7 days)
    lineage:
      - datalake_quintoandar.aux_date.last_week
  last_2_weeks:
    description: Previous 2 weeks (date - 14 days)
    lineage:
      - datalake_quintoandar.aux_date.last_2_weeks
  last_4_weeks:
    description: Previous 4 weeks (date - 28 days)
    lineage:
      - datalake_quintoandar.aux_date.last_4_weeks
  last_month:
    description: Previous month (date - 1 month)
    lineage:
      - datalake_quintoandar.aux_date.last_month
  last_quarter:
    description: Previous quarter (date - 3 month)
    lineage:
      - datalake_quintoandar.aux_date.last_quarter
  last_year:
    description: Previous year (date - 1 year)
    lineage:
      - datalake_quintoandar.aux_date.last_year
