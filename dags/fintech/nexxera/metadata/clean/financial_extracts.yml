database_name: datalake_nexxera_clean
table_name: financial_extracts
owner: juliana.hocihara@quintoandar.com.br
domain: Fintech
description: 'Table containing all financial extract files from itaú and bradesco.
  Link to documentation: https://docs.google.com/document/d/1ZQpHdTUPdi_gxhroiyHkJRYX96XM_8Y1_ggSKte69ds/edit#heading=h.20gk8wb7m9e1'
columns:
  id_bank:
    lineage:
    - datalake_nexxera_raw.financial_extracts.id_bank
    description: Bank code identifying Itaú or Bradesco in the CNAB financial extract file.
  id_service_batch:
    lineage:
    - datalake_nexxera_raw.financial_extracts.id_service_batch
    description: Service batch number assigned in the CNAB financial extract header.
  record_type:
    lineage:
    - datalake_nexxera_raw.financial_extracts.record_type
    description: CNAB record type code identifying the financial extract segment layout.
  record_sequence_number:
    lineage:
    - datalake_nexxera_raw.financial_extracts.metadata
    description: Sequential register number parsed from the financial extract metadata field.
  segment_type:
    lineage:
    - datalake_nexxera_raw.financial_extracts.metadata
    description: CNAB segment type character parsed from the financial extract metadata.
  instruction_code:
    lineage:
    - datalake_nexxera_raw.financial_extracts.metadata
    description: Bank instruction code parsed from the financial extract metadata field.
  compensation_code:
    lineage:
    - datalake_nexxera_raw.financial_extracts.metadata
    description: Compensation code parsed from the financial extract metadata field.
  description:
    lineage:
    - datalake_nexxera_raw.financial_extracts.metadata
    description: Full raw metadata line from the financial extract file.
  ts_ingested:
    lineage:
    - datalake_nexxera_raw.financial_extracts.year
    - datalake_nexxera_raw.financial_extracts.month
    - datalake_nexxera_raw.financial_extracts.day
    description: Timestamp when the financial extract record was ingested.
  year:
    lineage:
    - datalake_nexxera_raw.financial_extracts.year
    description: Partition year of the financial extract ingestion.
  month:
    lineage:
    - datalake_nexxera_raw.financial_extracts.month
    description: Partition month of the financial extract ingestion.
  day:
    lineage:
    - datalake_nexxera_raw.financial_extracts.day
    description: Partition day of the financial extract ingestion.
