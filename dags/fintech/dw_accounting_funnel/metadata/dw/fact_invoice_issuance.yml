---
database_name: dw_accounting_funnel
table_name: fact_invoice_issuance
owner: ae-finance-fintech@quintoandar.com.br
domain: Fintech
description: "This table brings all retsuko bills that suppose to create an invoice in SAP's and check if it was created"
columns:
  sk_invoice_issuance:
    lineage:
      - datalake_accounting_funnel.retsuko_invoice_issuance.id_retsuko_invoice_issuance
    description: "IN is from Invoice + ID Finance Entity from the source + ID to identify source + ID to identify revenue line"
  id_business_entity:
    lineage:
      - datalake_accounting_funnel.retsuko_invoice_issuance.id_business_entity
    description: "ID to identify Business Entity from the source"
  id_finance_entity:
    lineage:
      - datalake_accounting_funnel.retsuko_invoice_issuance.id_finance_entity
    description: "ID to identify Finance Entity from the source"
  source_name:
    description: "Product's name that is responsible to send Invoice's information"
  revenue_name:
    description: "What kind of revenue it refers to"
  accrual_year_month:
    lineage:
      - datalake_accounting_funnel.retsuko_invoice_issuance.accrual_year_month
    description: "Accrual year month from Retsuko's invoice"
  source_amount:
    lineage:
      - datalake_accounting_funnel.retsuko_invoice_issuance.source_amount
    description: "Invoiceable amount from the revenue line"
  sap_amount:
    lineage:
      - datalake_accounting_funnel.retsuko_invoice_issuance.sap_amount
    description: "Amount that was credited in the respective revenue account"
  is_compliance:
    lineage:
      - datalake_accounting_funnel.retsuko_invoice_issuance.is_compliance
    description: "Boolean that indicated if the correct amount from source, arrived in the correct destination in SAP"
  dt_source_created:
    lineage:
      - datalake_accounting_funnel.retsuko_invoice_issuance.dt_source_created
    description: "Date that finance entity was created in source"
  dt_source_paid:
    lineage:
      - datalake_accounting_funnel.retsuko_invoice_issuance.dt_source_paid
    description: "Date that finance entity was paid in source"
  dt_sap_created:
    lineage:
      - datalake_accounting_funnel.retsuko_invoice_issuance.dt_sap_created
    description: "Date that the entry was created in SAP. If more than one entry, it's considered the most recent date."
  dt_sap_reference:
    lineage:
      - datalake_accounting_funnel.retsuko_invoice_issuance.dt_sap_reference
    description: "Date that the entry was referenced in SAP. If more than one entry, it's considered the most recent date."