dag:
  name: pixar
  schedule_start_date: 2020, 8, 11
  schedule_interval: 0 3,8,12 * * *
  owner: Data Fintech
  documentation:
    dag_purpose: |
      This DAG creates the full tables for Pixar, the integration with PIX payment services.
workflow:
  type: cdc
  layer: raw
  has_hive_sync: false
  database_type: postgres
  source_schema: public
  source_database: pixar
  custom_schema: pixar
  dbutils_secret_key: PIXAR_DB
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, 1), 'load_end_date') }}"
  tables_customization:
    account: {}
    charge: {}
    charge_status_log: {}
    refund: {}
