dag:
  name: pixar
  owner: Data Fintech
  schedule_interval: 0 3 * * *
workflow:
  type: database_pull_delta
  layer: raw
  database_type: postgres
  tables_customization:
    account:
      clean_table_name: account
    charge:
      clean_table_name: charge
    refund:
      clean_table_name: refund
cluster:
  type: databricks_12_2_med_general_cluster
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE
