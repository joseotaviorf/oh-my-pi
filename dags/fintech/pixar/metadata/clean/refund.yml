database_name: datalake_pixar_clean
table_name: refund
description:
  One row per refund in the Fintech clean layer, sourced from
  datalake_pixar_clean for payments, billing, and financial operations
  reporting.
owner: juliana.hocihara@quintoandar.com.br
domain: Fintech
columns:
  id:
    lineage:
      - datalake_pixar_raw.refund.id
    description: Financial attribute representing id on the refund dataset.
  id_charge:
    lineage:
      - datalake_pixar_raw.refund.charge_id
    description: Charge identifier for a billed amount owed by tenant, owner, or QuintoCred.
  amount:
    lineage:
      - datalake_pixar_raw.refund.amount
    description: Monetary amount in Brazilian Reais for the financial transaction or balance.
  status:
    lineage:
      - datalake_pixar_raw.refund.status
    description: Current lifecycle status of the financial entity in the upstream operational system.
  ts_created:
    lineage:
      - datalake_pixar_raw.refund.created_at
    description: Timestamp when created occurred in the upstream fintech system.
  ts_updated:
    lineage:
      - datalake_pixar_raw.refund.updated_at
    description: Timestamp when updated occurred in the upstream fintech system.
