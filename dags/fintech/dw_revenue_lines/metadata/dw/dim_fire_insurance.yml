database_name: dw_revenue_lines
table_name: dim_fire_insurance
description: One row per dim fire insurance in the Fintech data warehouse layer, sourced from dw_revenue_lines for payments, billing, and financial operations reporting.
domain: Fintech
owner: juliana.hocihara@quintoandar.com.br
columns:
  sk_contract:
    description: "Contract identification number"
    lineage:
    - datalake_revenue_lines.fire_insurance.id_contract
  sk_invoice:
    description: "Invoice identification number"
    lineage:
    - datalake_revenue_lines.fire_insurance.id_invoice
  accrual_year_month:
    description: "String with Year number and Month number 'yyyymm' related to the entry date."
    lineage:
    - datalake_revenue_lines.fire_insurance.accrual_year_month
  comission_factor:
    description: "Factor to be considered on the comission formula"
    lineage:
    - datalake_revenue_lines.fire_insurance.comission_factor
  guarantee:
    description: "Contract guarantee information"
    lineage:
    - datalake_revenue_lines.fire_insurance.guarantee
  origin_fact:
    description: Financial attribute representing origin fact on the dim_fire_insurance dataset.
    lineage:
    - datalake_revenue_lines.fire_insurance.origin_fact
  raw_payment_amount:
    description: Financial attribute representing raw payment amount on the dim_fire_insurance dataset.
    lineage:
    - datalake_revenue_lines.fire_insurance.raw_payment_amount
  rent:
    description: "Rent information from the contract"
    lineage:
    - datalake_revenue_lines.fire_insurance.rent
  revenue_comission:
    description: "Result of the comission formula"
    lineage:
    - datalake_revenue_lines.fire_insurance.revenue_comission
  dt_annulment:
    description: "Type of the guarantee"
    lineage:
    - datalake_revenue_lines.fire_insurance.dt_annulment
  dt_start:
    description: "Timestamp of the guarantee created date"
    lineage:
    - datalake_revenue_lines.fire_insurance.dt_start
  ts_load:
    description: Timestamp when the row was materialized into the governance lake by the ETL pipeline.
    lineage: []