database_name: dw_revenue_lines
table_name: dim_long_term_rental_anticipation
description: This For Rent addon makes it possible to our client (PP) to anticipate
  more than one rent - LRA
domain: Fintech
owner: juliana.hocihara@quintoandar.com.br
columns:
  sk_long_term_rental_anticipation:
    lineage:
    - datalake_revenue_lines.long_term_rental_anticipation.id_lra
    description: Key of longterm anticipation
  id_contract_ebdb:
    lineage:
    - datalake_revenue_lines.long_term_rental_anticipation.id_contract_ebdb
    description: Id of the contract in main
  months_anticipated:
    lineage:
    - datalake_revenue_lines.long_term_rental_anticipation.months_anticipated
    description: Number of rental months that were anticipated
  installment:
    lineage:
    - datalake_revenue_lines.long_term_rental_anticipation.installment
    description: Number of the installment given a specific month
  total_installments:
    lineage:
    - datalake_revenue_lines.long_term_rental_anticipation.total_installments
    description: Number of installments that the lra value was divided
  total_rent:
    lineage:
    - datalake_revenue_lines.long_term_rental_anticipation.total_rent
    description: Total amount of anticipation requested by PP
  nbr_transactions_signed:
    lineage:
    - datalake_revenue_lines.long_term_rental_anticipation.nbr_transactions_signed
    description: Number of times that the same PP asked for a anticipation (LRA).
      In theory there could only be one, but in practice it happens differently
  prod_theorical_amount:
    lineage:
    - datalake_revenue_lines.long_term_rental_anticipation.prod_theorical_amount
    description: Amortization amount calculated by the LRA product
  prod_theorical_fee:
    lineage:
    - datalake_revenue_lines.long_term_rental_anticipation.prod_theorical_fee
    description: Interest amount calculated by the LRA product
  invoice_theorical_amount:
    lineage:
    - datalake_revenue_lines.long_term_rental_anticipation.mova_invoice_theorical_amount
    description: Amortization amount that appears on the invoice from MOVA source
  invoice_paid_amount:
    lineage:
    - datalake_revenue_lines.long_term_rental_anticipation.mova_invoice_paid_amount
    description: Amortization amount that whas paid from MOVA source
  invoice_theorical_fee:
    lineage:
    - datalake_revenue_lines.long_term_rental_anticipation.mova_invoice_theorical_fee
    description: Interest amount that appears on the invoice from MOVA source
  invoice_paid_fee:
    lineage:
    - datalake_revenue_lines.long_term_rental_anticipation.mova_invoice_paid_fee
    description: Interest amount that whas paid from MOVA source
  accrual_year_month:
    lineage:
    - datalake_revenue_lines.long_term_rental_anticipation.accrual_year_month
    description: Financial attribute representing accrual year month on the dim_long_term_rental_anticipation dataset.
  dt_due:
    lineage:
    - datalake_revenue_lines.long_term_rental_anticipation.dt_due
    description: Invoice's due date
  dt_paid:
    lineage:
    - datalake_revenue_lines.long_term_rental_anticipation.dt_paid
    description: Invoice's paid date
  dt_created:
    lineage:
    - datalake_revenue_lines.long_term_rental_anticipation.dt_created
    description: Date of when longterm anticipation was created
  dt_signed:
    lineage:
    - datalake_revenue_lines.long_term_rental_anticipation.dt_signed
    description: Date that LRA's contract was signed
  ts_load:
    description: Timestamp of when the data was loaded to this table
