database_name: dw_revenue_lines
table_name: dim_month_rental_anticipation
description: This For Rent addon makes it possible to our client (PP) to anticipate
  one rent - MRA
domain: Fintech
owner: juliana.hocihara@quintoandar.com.br
columns:
  sk_month_rental_anticipation:
    lineage:
    - datalake_revenue_lines.month_rental_anticipation.id_mra
    description: Key of one month anticipation
  id_contract_ebdb:
    lineage:
    - datalake_revenue_lines.month_rental_anticipation.id_contract_ebdb
    description: Id of the contract in main
  nbr_transactions_accepted:
    lineage:
    - datalake_revenue_lines.month_rental_anticipation.nbr_transactions_accepted
    description: If it's recurrent, how many times it have occured
  prod_theorical_amount:
    lineage:
    - datalake_revenue_lines.month_rental_anticipation.prod_theorical_amount
    description: Amortization amount calculated by the MRA product
  prod_theorical_fee:
    lineage:
    - datalake_revenue_lines.month_rental_anticipation.prod_theorical_fee
    description: Interest amount calculated by the MRA product
  invoice_theorical_amount:
    lineage:
    - datalake_revenue_lines.month_rental_anticipation.invoice_theorical_amount
    description: Amortization amount that appears on the invoice
  invoice_theorical_fee:
    lineage:
    - datalake_revenue_lines.month_rental_anticipation.invoice_theorical_fee
    description: Interest amount that appears on the invoice
  invoice_paid_amount:
    lineage:
    - datalake_revenue_lines.month_rental_anticipation.invoice_paid_amount
    description: Amortization amount that whas paid
  invoice_paid_fee:
    lineage:
    - datalake_revenue_lines.month_rental_anticipation.invoice_paid_fee
    description: Interest amount that whas paid
  accrual_year_month:
    lineage:
    - datalake_revenue_lines.month_rental_anticipation.accrual_year_month
    description: Financial attribute representing accrual year month on the dim_month_rental_anticipation dataset.
  dt_created:
    lineage:
    - datalake_revenue_lines.month_rental_anticipation.dt_created
    description: Date of when anticipation was created
  dt_accepted:
    lineage:
    - datalake_revenue_lines.month_rental_anticipation.dt_accepted
    description: Date that the current MRA what accepted
  dt_first_accepted:
    lineage:
    - datalake_revenue_lines.month_rental_anticipation.dt_first_accepted
    description: PPs first accepted MRA
  dt_due_fee:
    lineage:
    - datalake_revenue_lines.month_rental_anticipation.dt_due_fee
    description: Invoice's paid date
  dt_paid_fee:
    lineage:
    - datalake_revenue_lines.month_rental_anticipation.dt_paid_fee
    description: Invoice's paid date
  ts_load:
    description: Timestamp of when the data was loaded to this table
