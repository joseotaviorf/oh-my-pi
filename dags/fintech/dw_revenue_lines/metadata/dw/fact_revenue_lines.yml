database_name: dw_revenue_lines
table_name: fact_revenue_lines
description: Fact table for the Revenue lines model with the data related to all the dimensions.
domain: Fintech
owner: juliana.hocihara@quintoandar.com.br
columns:
  sk_revenue_lines:
    description: Surrogate key of the table.
  sk_contract:
    lineage:
      - datalake_revenue_lines.brokerage_fee.id_contract_ebdb
      - datalake_revenue_lines.brokerage_finance.id_contract_ebdb
      - datalake_revenue_lines.credit_card_payment.id_contract_ebdb
      - datalake_revenue_lines.fire_insurance.id_contract
      - datalake_revenue_lines.late_payments.id_contract
      - datalake_revenue_lines.long_term_rental_anticipation.id_contract_ebdb
      - datalake_revenue_lines.management_fee.id_contract_ebdb
      - datalake_revenue_lines.month_rental_anticipation.id_contract_ebdb
      - datalake_revenue_lines.rental_guarantee.id_contract
      - dw_rent.fact_listing_rent_flows.sk_contract
      - datalake_revenue_lines.service_fee.id_contract_ebdb
    description: Id of the contract, used as the foreign key to link with the dimensions.
  accrual_year_month:
    lineage:
      - datalake_revenue_lines.brokerage_fee.accrual_year_month
      - datalake_revenue_lines.brokerage_finance.accrual_year_month
      - datalake_revenue_lines.fire_insurance.accrual_year_month
      - datalake_revenue_lines.management_fee.accrual_year_month
      - datalake_revenue_lines.month_rental_anticipation.accrual_year_month
      - datalake_revenue_lines.rental_guarantee.accrual_year_month
      - datalake_revenue_lines.reservation.accrual_year_month
      - datalake_revenue_lines.service_fee.accrual_year_month
    description: Id of the contract, used as the foreign key to link with the dimensions.
  revenue_amount:
    description: Total volume of revenue related to the contract.
  revenue_source:
    description: Source information of the data, can be any dimension of the model.
  dt_month_ref:
    description: Reference month of the data.
  ts_load:
    description: Timestamp when the row was materialized into the governance lake by the ETL pipeline.
    lineage: []
