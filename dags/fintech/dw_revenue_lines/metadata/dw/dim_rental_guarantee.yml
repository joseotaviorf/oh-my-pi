database_name: dw_revenue_lines
table_name: dim_rental_guarantee
description: Rental guarantees
domain: Fintech
owner: ae-finance-fintech@quintoandar.com.br
columns:
  sk_rental_guarantee:
    lineage:
    - datalake_revenue_lines.rental_guarantee.id_guarantee
    description: Key of guarantee transaction
  id_contract_ebdb:
    lineage:
    - datalake_revenue_lines.rental_guarantee.id_contract_ebdb
    description: Id of the contract in main
  id_charge:
    lineage:
    - datalake_revenue_lines.rental_guarantee.id_charge
    description: Charge ID
  guarantee_status:
    lineage:
    - datalake_revenue_lines.rental_guarantee.guarantee_status
    description: Status of the guarantee
    categories:
      ACTIVE: ''
      CANCELED: ''
      CREATED: ''
      ENDED: ''
      WAITING_REFUND: ''
  charge_status:
    lineage:
    - datalake_revenue_lines.rental_guarantee.charge_status
    description:  Only CAPTURE charges (valid ones) are here because it's a revenue model. 
    categories:
      CAPTURED: ''
  charge_type:
    lineage:
    - datalake_revenue_lines.rental_guarantee.charge_type
    description: How charge was paid
    categories:
      BILL: ''
      CREDIT_CARD: ''
      PIX: ''
  total_installments:
    lineage:
    - datalake_revenue_lines.rental_guarantee.total_installments
    description: Number of installments that the guarantee value was divided
  monthly_revenue:
    lineage:
    - datalake_revenue_lines.rental_guarantee.monthly_revenue
    description: Monthly calculated revenue
  accrual_year_month:
    lineage:
    - datalake_revenue_lines.rental_guarantee.accrual_year_month
    description: Reference year-month
  contract_status:
    lineage:
    - datalake_revenue_lines.rental_guarantee.contract_status
    description: Contract Status
    categories:
      ATIVO: ''
      FINALIZADO: ''
  ts_guarantee_created:
    lineage:
    - datalake_revenue_lines.rental_guarantee.ts_guarantee_created
    description: Timestamp of guarantee created
  ts_load:
    description: Load timestamp
