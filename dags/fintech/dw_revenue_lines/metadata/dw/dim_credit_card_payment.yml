database_name: dw_revenue_lines
table_name: dim_credit_card_payment
description: This For Rent addon opportunizes our clients to pay using credit card
  - CCP
domain: Fintech
owner: juliana.hocihara@quintoandar.com.br
columns:
  sk_credit_card_payment:
    lineage:
    - datalake_revenue_lines.credit_card_payment.id_ccp
    description: Key of credit card payment transaction
  id_contract_ebdb:
    lineage:
    - datalake_revenue_lines.credit_card_payment.id_contract_ebdb
    description: Id of the contract in main
  status:
    lineage:
    - datalake_revenue_lines.credit_card_payment.status
    description: Current lifecycle status of the financial entity in the upstream operational system.
  brand_name:
    lineage:
    - datalake_revenue_lines.credit_card_payment.brand_name
    description: Financial attribute representing brand name on the dim_credit_card_payment dataset.
  type_paid:
    lineage:
    - datalake_revenue_lines.credit_card_payment.type_paid
    description: Payment type choose, sight or installments
    categories:
      installments: Payments divided into monthly installments
      sight: Only one payment, full payment
  installments:
    lineage:
    - datalake_revenue_lines.credit_card_payment.installments
    description: Number of installments that the rental value was divided
  invoice_theorical_amount:
    lineage:
    - datalake_revenue_lines.credit_card_payment.invoice_theorical_amount
    description: Financial attribute representing invoice theorical amount on the dim_credit_card_payment dataset.
  invoice_paid_amount:
    lineage:
    - datalake_revenue_lines.credit_card_payment.invoice_paid_amount
    description: Invoice total amount paid
  invoice_paid_fee:
    lineage:
    - datalake_revenue_lines.credit_card_payment.invoice_paid_fee
    description: Fee from CCP transaction paid
  accrual_year_month:
    lineage:
    - datalake_revenue_lines.credit_card_payment.accrual_year_month
    description: Financial attribute representing accrual year month on the dim_credit_card_payment dataset.
  dt_ccp_created:
    lineage:
    - datalake_revenue_lines.credit_card_payment.dt_ccp_created
    description: Date of rental payment opted to be via credit card
  dt_due:
    lineage:
    - datalake_revenue_lines.credit_card_payment.dt_due
    description: Invoice's due date
  dt_paid:
    lineage:
    - datalake_revenue_lines.credit_card_payment.dt_paid
    description: Date when it was paid by a credit card
  ts_load:
    description: Timestamp of when the data was loaded to this table
