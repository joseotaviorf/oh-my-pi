database_name: dw_revenue_lines
table_name: fact_contract_revenues
description: Fact table that join all the revenue lines sk and total amount of due/paid revenue by month and contract.
domain: Fintech
owner: ae-finance-fintech@quintoandar.com.br
columns:
  sk_contract_revenue:
    lineage:
    - datalake_revenue_lines.contract_revenues.sk_contract
    description: Id from ebdb contract table
  sk_late_payments_rent:
    lineage:
    - datalake_revenue_lines.contract_revenues.sk_late_payments_rent
    description: Id to join with dim_late_payments
  sk_late_payments_condo:
    lineage:
    - datalake_revenue_lines.contract_revenues.sk_late_payments_condo
    description: Id to join with dim_late_payments
  sk_month_rental_anticipation:
    lineage:
    - datalake_revenue_lines.contract_revenues.sk_month_rental_anticipation
    description: Id to join with dim_month_rental_anticipation
  sk_long_term_rental_anticipation:
    lineage:
    - datalake_revenue_lines.contract_revenues.sk_long_term_rental_anticipation
    description: Id to join with dim_long_term_rental_anticipation
  sk_brokerage_finance:
    lineage:
    - datalake_revenue_lines.contract_revenues.sk_brokerage_finance
    description: Id to join with dim_brokerage_finance
  sk_reservation:
    lineage:
    - datalake_revenue_lines.contract_revenues.sk_reservation
    description: Id to join with dim_reservation
  sk_credit_card_payment:
    lineage:
    - datalake_revenue_lines.contract_revenues.sk_credit_card_payment
    description: Id to join with dim_credit_card_payment
  sk_rental_guarantee:
    lineage:
    - datalake_revenue_lines.contract_revenues.sk_rental_guarantee
    description: Id to join with dim_rental_guarantee - sk_rental_guarantee
  sk_rental_guarantee_charge:
    lineage:
    - datalake_revenue_lines.contract_revenues.sk_rental_guarantee_charge
    description: Id to join with dim_rental_garantee table - id_charge
  sk_month_start:
    lineage:
    - datalake_revenue_lines.contract_revenues.sk_month_start
    description: First day of revenue accrual in YYYYMMDD format
  due_monthly_revenue:
    lineage:
    - datalake_revenue_lines.contract_revenues.due_monthly_revenue
    description: Sum of all contracts due revenue in the reference month
  paid_monthly_revenue:
    lineage:
    - datalake_revenue_lines.contract_revenues.paid_monthly_revenue
    description: Sum of all contracts paid revenue in the reference month
  ts_load:
    description: Timestamp of the load into datalake
