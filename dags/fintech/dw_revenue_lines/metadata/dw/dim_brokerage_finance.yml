database_name: dw_revenue_lines
table_name: dim_brokerage_finance
description: This For Rent addon makes it possible to our clients to split brokerage
  fee - BFI
domain: Fintech
owner: juliana.hocihara@quintoandar.com.br
columns:
  sk_brokerage_finance:
    lineage:
    - datalake_revenue_lines.brokerage_finance.id_bfi
    description: Key of brokerage finance
  id_contract_ebdb:
    lineage:
    - datalake_revenue_lines.brokerage_finance.id_contract_ebdb
    description: Id of the contract in main
  prod_theorical_amount:
    lineage:
    - datalake_revenue_lines.brokerage_finance.prod_theorical_amount
    description: Amortization amount calculated by the BFI product
  prod_theorical_fee:
    lineage:
    - datalake_revenue_lines.brokerage_finance.prod_theorical_fee
    description: Interest amount calculated by the BFI product
  invoice_theorical_amount:
    lineage:
    - datalake_revenue_lines.brokerage_finance.invoice_theorical_amount
    description: Amortization amount that appears on the invoice
  invoice_paid_amount:
    lineage:
    - datalake_revenue_lines.brokerage_finance.invoice_paid_amount
    description: Amortization amount that whas paid
  invoice_theorical_fee:
    lineage:
    - datalake_revenue_lines.brokerage_finance.invoice_theorical_fee
    description: Interest amount that appears on the invoice
  invoice_paid_fee:
    lineage:
    - datalake_revenue_lines.brokerage_finance.invoice_paid_fee
    description: Interest amount that whas paid
  total_installments:
    lineage:
    - datalake_revenue_lines.brokerage_finance.total_installments
    description: Total installments chosen by the PP
  premium_fee:
    lineage:
    - datalake_revenue_lines.brokerage_finance.premium_fee
    description: Fee charged for financing. Varies according to the number of installments
  real_state_agent_share:
    lineage:
    - datalake_revenue_lines.brokerage_finance.real_state_agent_share
    description: It's the agent brokerage share. Important because in BFI V1 we only
      finance 5A brokerage share
  accrual_year_month:
    lineage:
    - datalake_revenue_lines.brokerage_finance.accrual_year_month
    description: Financial attribute representing accrual year month on the dim_brokerage_finance dataset.
  dt_bf_created:
    lineage:
    - datalake_revenue_lines.brokerage_finance.dt_bf_created
    description: Date of brokerage payment opted to be divided
  dt_due_fee:
    lineage:
    - datalake_revenue_lines.brokerage_finance.dt_due_fee
    description: Calendar date associated with due fee in the financial workflow.
  dt_paid_fee:
    lineage:
    - datalake_revenue_lines.brokerage_finance.dt_paid_fee
    description: Date of fee payment
  ts_load:
    description: Timestamp of when the data was loaded to this table
