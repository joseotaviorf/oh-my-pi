database_name: dw_revenue_lines
table_name: dim_late_payments
owner: juliana.hocihara@quintoandar.com.br
domain: Fintech
description: "Fines for late payment of the rent invoice: 10% for late payment, plus 1% a.m. charged daily"
columns:
  sk_late_payments:
    description: "Surrogate key for late payments composed by invoice entries id, id_contract, and reference year-month"
    lineage:
      - datalake_revenue_lines.late_payments.id_late_payments
  id_contract:
    description: "Id of the contract in main"
    lineage:
      - datalake_revenue_lines.late_payments.id_contract
  type_late:
    description: "Rental or condo late"
    lineage:
      - datalake_revenue_lines.late_payments.type_late
    categories:
      condo: Bill-item 'property damage fine' and description ilike '%quebra contratual%'
      payment: Bill-item 'fine and interest'
  invoice_theorical_amount:
    description: "Total amount that appears on the invoice"
    lineage:
      - datalake_revenue_lines.late_payments.invoice_theorical_amount
  invoice_paid_amount:
    description: "Invoice total amount was paid"
    lineage:
      - datalake_revenue_lines.late_payments.invoice_paid_amount
  accrual_year_month:
    description: Financial attribute representing accrual year month on the dim_late_payments dataset.
    lineage:
      - datalake_revenue_lines.late_payments.accrual_year_month
  dt_created:
    description: Calendar date associated with created in the financial workflow.
    lineage:
      - datalake_revenue_lines.late_payments.dt_created
  dt_due:
    description: "Invoice's due date"
    lineage:
      - datalake_revenue_lines.late_payments.dt_due
  dt_paid:
    description: "Invoice's paid date"
    lineage:
      - datalake_revenue_lines.late_payments.dt_paid
  ts_load:
    description: "Timestamp which the data was loaded"
