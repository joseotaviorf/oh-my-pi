dag:
  name: dw_revenue_lines
  schedule_start_date: 2022,03,29
  owner: Data Fintech
workflow:
  type: query
  layer: dw
  custom_schema: revenue_lines
  has_load_to_redshift_task: false
cluster:
  type: custom_cluster
  custom_configurations:
    autotermination_minutes: 20
    driver_node_type_id: r5d.xlarge
    node_type_id: r5d.xlarge
    runtime_engine: PHOTON
    spark_version: 13.3.x-scala2.12
    num_workers: 2
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE