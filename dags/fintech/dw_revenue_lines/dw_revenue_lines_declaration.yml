dag:
  name: dw_revenue_lines
  schedule_start_date: 2022,03,29
  owner: Data Fintech
workflow:
  type: query_delta
  layer: dw
  custom_schema: revenue_lines
  has_load_to_redshift_task: false
cluster:
  type: custom_cluster
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: "quintoandar_{{ var.value.environment }}"
    autotermination_minutes: 20
    driver_node_type_id: r5d.xlarge
    node_type_id: r5d.xlarge
    runtime_engine: PHOTON
    spark_version: 13.3.x-scala2.12
    num_workers: 2
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE
  databricks_conn_id: databricks_new
    