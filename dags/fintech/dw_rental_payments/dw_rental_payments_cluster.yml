cluster:
  type: emr_7_12_consolidation_s_memory_fleet_cluster
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE
  custom_configurations:
    # client-mode drivers: one per concurrent EMR step on the master.
    master_node_type_id: r6g.2xlarge
    step_concurrency_level: 2
    aws_attributes:
      ebs_volume_size: 200
    core_nodes:
      target_on_demand: 5
      target_spot: 0
      instance_types:
      - r6g.xlarge
      - r7g.xlarge
      - r6i.xlarge
    task_nodes:
      instance_types:
      - r6g.xlarge
      - r7g.xlarge
      - r6i.xlarge
      target_on_demand: 0
      target_spot: 2
      allocation_strategy: price-capacity-optimized
      bid_price_percentage: 100
    spark_conf:
      spark.sql.adaptive.advisoryPartitionSizeInBytes: "16777216"
      spark.sql.shuffle.partitions: "400"
      spark.speculation: "true"
      spark.speculation.multiplier: "3"
      spark.speculation.quantile: "0.75"
