database_name: dw_rental_payments
table_name: dim_bill_item
owner: ae-finance-fintech@quintoandar.com.br
domain: Fintech
description: "This table contains information about the bill items of an invoice"
columns:
  sk_invoice:
    description: Identification of invoices and key to join with invoice granularity tables
    lineage:
      - datalake_retsuko.bill_items.id_invoice
  bill_item:
    description: Bill item on an invoice
    lineage:
      - datalake_retsuko.bill_items.bill_item
  bill_item_description:
    description: Description of the bill item on an invoice
    lineage:
      - datalake_retsuko.bill_items.bill_item_description
  bill_item_group:
    description: A suggestion of group/cluster of bill items. This category was defined by our Data Analytics and Data Engineering team. Feel free to use another one.
    categories:
      ACORDO: "Bill items that represent the invoice as a negotiation of a previous debt. Bill items included: DEBIT-NEGOTIATION"
      CONDOMINIO: "Bill items associated with expenses of condominium, this cluster representes single-time charges due to process of internalization of condominium debt by 5A from the landlord. Bill items included: CONDOMINIUM-5A-PAID, CONDOMINIUM-DEFAULTING, CONDOMINIUM-USAGE"
      MULTA-RECISORIA: "Bill items that represent the charge due to early termination of contract. Bill items included: EARLY-TERMINATION-FEE"
      MULTAS ONGOING: "Bill items that represent late fees due to previous delay. Bill items included: PROPERTY-DAMAGE-FINE, FINE-AND-INTEREST"
      RENTAL-CORE: "Bill items that build the monthly invoices in general. Bill items included: SERVICE-FEE, HOME-INSURANCE, RENTAL, IPTU, CONDOMINIUM"
      REPAROS: "Bill items associated with repairs in the house. Bill items included: RESIDENTIAL-PROTECTION-5A-ACQUITTANCE, RESIDENTIAL-PROTECTION-5A-FUND-TRANSFER"
      UTILIDADES: "Bill items that represent default in light, water and/ or gas. Bill items included: LIGHT-WATER-OR-GAS, UTILITIES-DEFAULTING"
      OUTROS: "All bill items not categorized as one of the above options."
    lineage:
      - datalake_retsuko.bill_items.bill_item_cluster_name
  bill_item_due_amount:
    description: Amount of the bill item considering the financial balance in the invoice. Some bill items can be negatively charged (negative sign in value) meaning they act as a credit due to adjustments with the tenant from previous billing.
    lineage:
      - datalake_retsuko.bill_items.value_sign_bill_item
  ts_load:
    description: Timestamp of data insertion in the table
