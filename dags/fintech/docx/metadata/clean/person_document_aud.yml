---
database_name: datalake_docx_clean
table_name: person_document_aud
owner: marcus.silva@quintoandar.com.br
domain: Fintech
description: Historical record of changes to a person's submitted documents.
columns:
  id:
    description: Unique identifier of the person's document.
    lineage:
    - datalake_docx_raw.person_document_aud.id
  rev:
    description: Sequential number identifying this change snapshot in the audit history.
    lineage:
    - datalake_docx_raw.person_document_aud.rev
  id_person:
    description: Person who submitted this document.
    lineage:
    - datalake_docx_raw.person_document_aud.person_id
  rev_type:
    description: "Type of change recorded (new record, update, or deletion)."
    lineage:
    - datalake_docx_raw.person_document_aud.revtype
  rev_end:
    description: Next audit snapshot that replaced this one, if the record was later updated.
    lineage:
    - datalake_docx_raw.person_document_aud.revend
  type:
    description: Document category such as identity proof, income proof, or contact information.
    lineage:
    - datalake_docx_raw.person_document_aud.type
  country_code:
    description: Country whose document rules apply.
    lineage:
    - datalake_docx_raw.person_document_aud.country_code
  mod_country_code:
    description: Whether the country changed in this revision.
    lineage:
    - datalake_docx_raw.person_document_aud.country_code_mod
  mod_type:
    description: Whether the document category changed in this revision.
    lineage:
    - datalake_docx_raw.person_document_aud.type_mod
  mod_info_list:
    description: Whether the document fields changed in this revision.
    lineage:
    - datalake_docx_raw.person_document_aud.info_list_mod
  mod_person:
    description: Whether the linked person changed in this revision.
    lineage:
    - datalake_docx_raw.person_document_aud.person_mod
