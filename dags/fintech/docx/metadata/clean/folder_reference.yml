database_name: datalake_docx_clean
table_name: folder_reference
description: Relationships linking two documentation folders, such as tenant to property or buyer to offer.
owner: marcus.silva@quintoandar.com.br
domain: Fintech
columns:
  id:
    lineage:
      - datalake_docx_raw.folder_reference.id
    description: Unique identifier of the folder relationship.
  id_folder_reference_type:
    lineage:
      - datalake_docx_raw.folder_reference.folder_reference_type_id
    description: Type of relationship between the folders (e.g. tenant proponent, spouse, buyer).
  id_source_folder:
    lineage:
      - datalake_docx_raw.folder_reference.source_folder_id
    description: Folder where the relationship originates.
  id_target_folder:
    lineage:
      - datalake_docx_raw.folder_reference.target_folder_id
    description: Folder the relationship points to.
  reference_properties:
    lineage:
      - datalake_docx_raw.folder_reference.reference_properties
    description: Additional details about the relationship, such as proposal or invitee data.
  ts_documentation_sent:
    lineage:
      - datalake_docx_raw.folder_reference.documentation_send_date
    description: When documentation was sent for this relationship.
  ts_created:
    lineage:
      - datalake_docx_raw.folder_reference.created_at
    description: When this record was first created.
  ts_updated:
    lineage:
      - datalake_docx_raw.folder_reference.updated_at
    description: When this record was last modified.
