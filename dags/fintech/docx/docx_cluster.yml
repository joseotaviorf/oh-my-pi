cluster:
  type: emr_7_12_consolidation_m_memory_fleet_cluster
  custom_configurations:
    core_nodes:
      instance_types:
      - r6g.2xlarge
      - r7g.2xlarge
      - r6i.2xlarge
      target_on_demand: 2
      target_spot: 0
    spark_conf:
      spark.driver.memory: 12g
      spark.driver.memoryOverhead: 2g
      spark.sql.shuffle.partitions: '200'
      spark.dynamicAllocation.maxExecutors: '2'
