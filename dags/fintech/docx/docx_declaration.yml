dag:
  name: docx
  owner: Data Fintech
  documentation:
    dag_purpose: |
      Extraction of Docx tables into data lake, in which the data is related to the credit evaluation process. Docx is the backend application for documents and credit simulation.
  schedule_interval: 0 0 * * *
workflow:
  type: cdc
  layer: raw
  database_type: postgres
  custom_schema: docx
  dbutils_secret_key: DOCX_DB
  tables_customization:
    credit_evaluation:
      get_table_metrics:
        count: id
    credit_evaluation_aud: {}
    credit_evaluation_proponent:
      get_table_metrics:
        count: id
    credit_evaluation_proponent_aud: {}
    document: {}
    document_aud: {}
    document_context: {}
    document_type: {}
    folder: {}
    folder_aud: {}
    folder_reference: {}
    folder_reference_aud: {}
    folder_reference_type: {}
    folder_type: {}
    machine_state: {}
    message: {}
    processed_message: {}
    revinfo:
      clean_table_name: rev_info
    simulation: {}
    simulation_user: {}
    user_tenant_flow: {}
cluster:
  type: databricks_13_3_med_general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
