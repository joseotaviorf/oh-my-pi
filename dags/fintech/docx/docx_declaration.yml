dag:
  name: docx
  owner: Data Fintech
  documentation:
    dag_purpose: |
      Extraction of Docx tables into data lake, in which the data is related to the credit evaluation process. Docx is the backend application for documents and credit simulation.
  schedule_interval: 0 0 * * *
workflow:
  type: cdc
  layer: raw
  database_type: postgres
  custom_schema: docx
  dbutils_secret_key: DOCX_DB
  tables_customization:
    credit_evaluation:
      get_table_metrics:
        count: id
    credit_evaluation_aud:
      clean_table_name: credit_evaluation_aud
      raw_primary_keys: ["id", "rev"]
    credit_evaluation_proponent:
      get_table_metrics:
        count: id
    credit_evaluation_proponent_aud:
      clean_table_name: credit_evaluation_proponent_aud
      raw_primary_keys: ["id", "rev"]
    document: {}
    document_aud: {}
    document_context: {}
    document_type: {}
    folder: {}
    folder_aud: {}
    folder_reference: {}
    folder_reference_aud: {}
    folder_reference_type: {}
    folder_type: {}
    group_authorization: {}
    group_authorization_aud:
      clean_table_name: group_authorization_aud
      raw_primary_keys: ["id", "rev"]
    group: {}
    group_aud:
      clean_table_name: group_aud
      raw_primary_keys: ["id", "rev"]
    group_member: {}
    group_member_aud:
      clean_table_name: group_member_aud
      raw_primary_keys: ["id", "rev"]
    machine_state: {}
    machine_state_aud:
      clean_table_name: machine_state_aud
      raw_primary_keys: ["id", "rev"]
    message: {}
    processed_message: {}
    revinfo:
      clean_table_name: rev_info
    simulation: {}
    simulation_user: {}
    user_tenant_flow: {}
    person: {}
    person_aud:
      clean_table_name: person_aud
      raw_primary_keys: ["id", "rev"]
    person_document: {}
    person_document_aud:
      clean_table_name: person_document_aud
      raw_primary_keys: ["id", "rev"]
    person_document_info: {}
    person_document_info_aud:
      clean_table_name: person_document_info_aud
      raw_primary_keys: ["id", "rev"]
cluster:
  type: custom_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    driver_node_type_id: m5d.2xlarge
    node_type_id: m5d.2xlarge
    num_workers: 3
    spark_version: 13.3.x-scala2.12
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
