dag:
  name: betopera
  schedule_start_date: 2022, 8, 23
  schedule_interval: 0 3 * * *
  owner: Data Fintech
  documentation:
    dag_purpose: |
      This DAG creates the incremental tables for betopera, the integration with Insurance providers.
workflow:
  type: cdc
  layer: raw
  database_type: postgres
  dbutils_secret_key: BETOPERA_DB
  lineage_product_database_name: betopera
  tables_customization:
    certificate_aud:
      clean_table_name: certificate_aud
      raw_primary_keys: ["id", "rev"]
    certificate_request_aud:
      clean_table_name: certificate_request_aud
      raw_primary_keys: ["id", "rev"]
    certificate_request: {}
    certificate: {}
    endorsement_aud:
      clean_table_name: endorsement_aud
      raw_primary_keys: ["id", "rev"]
    endorsement: {}
    insurance_aud:
      clean_table_name: insurance_aud
      raw_primary_keys: ["id", "rev"]
    insurance: {}
    insurance_optout_aud:
      clean_table_name: insurance_optout_aud
      raw_primary_keys: ["id", "rev"]
    insurance_optout: {}
    payment_aud:
      clean_table_name: payment_aud
      raw_primary_keys: ["id", "rev"]
    payment: {}
    reminder: {}
    reminder_aud:
      clean_table_name: reminder_aud
      raw_primary_keys: ["id", "rev"]
    renewal: {}
    revinfo:
      clean_table_name: rev_info
    tenant_invoice_item:
      clean_table_name: tenant_invoice_item
      raw_primary_keys: ["id"]
    tenant_invoice_item_aud:
      clean_table_name: tenant_invoice_item_aud
      raw_primary_keys: ["id", "rev"]
    api_audit_log:
      clean_table_name: api_audit_log
      raw_primary_keys: ["id"]
    billing:
      clean_table_name: billing
      raw_primary_keys: ["id"]
    billing_entry:
      clean_table_name: billing_entry
      raw_primary_keys: ["id"]
    billing_fee_type:
      clean_table_name: billing_fee_type
      raw_primary_keys: ["id"]
    billing_aud:
      clean_table_name: billing_aud
      raw_primary_keys: ["id", "rev"]
    billing_entry_aud:
      clean_table_name: billing_entry_aud
      raw_primary_keys: ["id", "rev"]
    billing_fee_type_aud:
      clean_table_name: billing_fee_type_aud
      raw_primary_keys: ["id", "rev"]
cluster:
  type: emr_7_12_min_memory_3_workers_cluster
  custom_configurations:
    driver_node_type_id: m7a.xlarge
    num_task_workers: 1
