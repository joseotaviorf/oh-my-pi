dag:
  name: betopera
  schedule_start_date: 2022, 8, 23
  schedule_interval: 0 3 * * *
  owner: Data Fintech
  documentation:
    dag_purpose: |
      This DAG creates the incremental tables for betopera, the integration with Insurance providers.
workflow:
  type: cdc
  layer: raw
  database_type: postgres
  dbutils_secret_key: BETOPERA_DB
  lineage_product_database_name: betopera
  tables_customization:
    certificate_aud:
      clean_table_name: certificate_aud
      raw_primary_keys: ["id", "rev"]
    certificate_request_aud:
      clean_table_name: certificate_request_aud
      raw_primary_keys: ["id", "rev"]
    certificate_request: {}
    certificate: {}
    endorsement_aud:
      clean_table_name: endorsement_aud
      raw_primary_keys: ["id", "rev"]
    endorsement: {}
    insurance_aud:
      clean_table_name: insurance_aud
      raw_primary_keys: ["id", "rev"]
    insurance: {}
    payment_aud:
      clean_table_name: payment_aud
      raw_primary_keys: ["id", "rev"]
    payment: {}
    reminder: {}
    reminder_aud:
      clean_table_name: reminder_aud
      raw_primary_keys: ["id", "rev"]
    renewal: {}
    revinfo:
      clean_table_name: rev_info
    tenant_invoice_item:
      clean_table_name: tenant_invoice_item
      raw_primary_keys: ["id"]
    api_audit_log:
      clean_table_name: api_audit_log
      raw_primary_keys: ["id"]
cluster:
  type: databricks_16_4_min_memory_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
