dag:
  name: betopera
  schedule_start_date: 2022, 8, 23
  schedule_interval: 0 3 * * *
  owner: Data Fintech
  documentation:
    dag_purpose: |
      This DAG creates the incremental tables for betopera, the integration with Insurance providers.
workflow:
  type: cdc
  layer: raw
  database_type: postgres
  dbutils_secret_key: BETOPERA_DB
  lineage_product_database_name: betopera
  tables_customization:
    certificate_aud: {}
    certificate_request_aud: {}
    certificate_request: {}
    certificate: {}
    endorsement_aud: {}
    endorsement: {}
    insurance_aud: {}
    insurance: {}
    payment_aud: {}
    payment: {}
    reminder: {}
    reminder_aud: {}
    revinfo:
      clean_table_name: rev_info
cluster:
  type: databricks_13_3_med_general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
