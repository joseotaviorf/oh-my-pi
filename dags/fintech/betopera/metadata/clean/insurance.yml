database_name: datalake_betopera_clean
table_name: insurance
owner: juliana.hocihara@quintoandar.com.br
domain: Fintech
description: "Clean insurance records from Betopera with contract and status attributes."
columns:
  id:
    lineage:
      - datalake_betopera_raw.insurance.id
    description: "Unique identifier of the insurance record."
  id_idempotency:
    lineage:
      - datalake_betopera_raw.insurance.idempotency_id
    description: "Idempotency identifier used to avoid duplicate insurance processing."
  source_type_code:
    lineage:
      - datalake_betopera_raw.insurance.source_type_code
    description: "Code that identifies the source type of the insurance record."
  status:
    lineage:
      - datalake_betopera_raw.insurance.status
    description: "Current status of the insurance record."
  version:
    lineage:
      - datalake_betopera_raw.insurance.version
    description: "Version number of the insurance record."
  contract_version:
    lineage:
      - datalake_betopera_raw.insurance.contract_version
    description: "Version of the contract associated with the insurance."
  contract_guarantee:
    lineage:
      - datalake_betopera_raw.insurance.contract_guarantee
    description: "Guarantee type or guarantee details defined in the insurance contract."
  ts_created:
    lineage:
      - datalake_betopera_raw.insurance.created_at
    description: "Timestamp when the insurance record was created."
  ts_updated:
    lineage:
      - datalake_betopera_raw.insurance.updated_at
    description: "Timestamp when the insurance record was last updated."
  year:
    lineage:
      - datalake_betopera_raw.insurance.year
    description: "Partition year of the source record."
  month:
    lineage:
      - datalake_betopera_raw.insurance.month
    description: "Partition month of the source record."
  day:
    lineage:
      - datalake_betopera_raw.insurance.day
    description: "Partition day of the source record."
