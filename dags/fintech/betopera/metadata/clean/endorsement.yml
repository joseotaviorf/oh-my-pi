database_name: datalake_betopera_clean
table_name: endorsement
description:
  One row per endorsement in the Fintech clean layer, sourced from
  datalake_betopera_clean for payments, billing, and financial operations
  reporting.
owner: juliana.hocihara@quintoandar.com.br
domain: Fintech
columns:
    id:
        lineage:
            - datalake_betopera_raw.endorsement.id
        description: Financial attribute representing id on the endorsement dataset.
    id_certificate:
        lineage:
            - datalake_betopera_raw.endorsement.certificate_id
        description: Identifier for the certificate referenced by this financial record.
    process_info:
        lineage:
            - datalake_betopera_raw.endorsement.process_info
        description: Financial attribute representing process info on the endorsement dataset.
    type:
        lineage:
            - datalake_betopera_raw.endorsement.type
        description: Financial attribute representing type on the endorsement dataset.
    status:
        lineage:
            - datalake_betopera_raw.endorsement.status
        description: Current lifecycle status of the financial entity in the upstream operational system.
    ts_created:
        lineage:
            - datalake_betopera_raw.endorsement.created_at
        description: Timestamp when created occurred in the upstream fintech system.
    ts_updated:
        lineage:
            - datalake_betopera_raw.endorsement.updated_at
        description: Timestamp when updated occurred in the upstream fintech system.
    year:
        lineage:
            - datalake_betopera_raw.endorsement.year
        description: Year partition derived from the source event timestamp for incremental loading.
    month:
        lineage:
            - datalake_betopera_raw.endorsement.month
        description: Month partition derived from the source event timestamp for incremental loading.
    day:
        lineage:
            - datalake_betopera_raw.endorsement.day
        description: Day partition derived from the source event timestamp for incremental loading.
