---
database_name: datalake_cyber_clean
table_name: bill
owner: juliana.hocihara@quintoandar.com.br
domain: Fintech
description: Table for storing debts (contract invoices). Table granularity - invoice entries or invoice (depends on the filter of invoice_or_entry field).
columns:
  id_contract:
    description: "ID contract = ID Contract (TF: contract.external-id) + Contract Group (ID Product debtor.product-code) + Revision"
    lineage:
      - datalake_cyber_raw.tb_parcela.PAACCT
  id_invoice:
    description: "ID Invoice. TF: bill.external_id"
    lineage:
      - datalake_cyber_raw.tb_parcela.PAIDPARC
  id_boleto:
    description: "Bill (boleto) ID in the legacy system. TF: bill.boleto_identifier"
    lineage:
      - datalake_cyber_raw.tb_parcela.PAIDBOL
  id_entry:
    description: "Entry ID. TF: bill.entries.id"
    lineage:
      - datalake_cyber_raw.tb_parcela.PABICODIGO
  boleto_number:
    description: Financial attribute representing boleto number on the bill dataset.
    lineage:
      - datalake_cyber_raw.tb_parcela.PANUMDOBOL
  our_number:
    description: Financial attribute representing our number on the bill dataset.
    lineage:
      - datalake_cyber_raw.tb_parcela.PANOSSNUM
  our_number_boleto:
    description: Financial attribute representing our number boleto on the bill dataset.
    lineage:
      - datalake_cyber_raw.tb_parcela.PANOSNUMBOL
  invoice_or_entry:
    description: Financial attribute representing invoice or entry on the bill dataset.
    lineage:
      - datalake_cyber_raw.tb_parcela.CASE WHEN PATIPO = "P" THEN "Parcela" WHEN PATIPO
        = "B" THEN "Entry" ELSE PATIPO END
  contract_group:
    description: "Contract Group (QuintoAndar or QuintoCred). TF: debtor.group"
    lineage:
      - datalake_cyber_raw.tb_parcela.PAACCTG
  invoice_status:
    description: Financial attribute representing invoice status on the bill dataset.
    lineage:
      - "datalake_cyber_raw.tb_parcela.CASE WHEN PASTATUS = 1 THEN \"Ativa (em aberto)\"\
        \ WHEN PASTATUS = 2 THEN \"Paga\" WHEN PASTATUS = 3 THEN \"Cancelada\" WHEN\
        \ PASTATUS = 4 THEN \"Pausa\" WHEN PASTATUS = 5 THEN \"Previamente negociada\"\
        \ WHEN PASTATUS = 6 THEN \"Em negocia\xE7\xE3o\" ELSE PASTATUS END"
  retsuko_status:
    description: Financial attribute representing retsuko status on the bill dataset.
    lineage:
      - datalake_cyber_raw.tb_parcela.PASTATFA
  purpose:
    description: Financial attribute representing purpose on the bill dataset.
    lineage:
      - datalake_cyber_raw.tb_parcela.PATPDIV
  pause_reason:
    description: Financial attribute representing pause reason on the bill dataset.
    lineage:
      - datalake_cyber_raw.tb_parcela.PAINDMOTPA
  account_type:
    description: Financial attribute representing account type on the bill dataset.
    lineage:
      - datalake_cyber_raw.tb_parcela.PATPCONTA
  accrual_year_month:
    description: Financial attribute representing accrual year month on the bill dataset.
    lineage:
      - datalake_cyber_raw.tb_parcela.PAAMENVFA
  is_negative_bureaus:
    description: "Same as bill.negative in Trato Feito database"
    lineage:
      - datalake_cyber_raw.tb_parcela.CASE WHEN PAINDNEG = "S" THEN TRUE ELSE FALSE
        END
  is_tenant_first_invoice:
    description: Indicates whether tenant first invoice applies to this financial record.
    lineage:
      - datalake_cyber_raw.tb_parcela.CASE WHEN PAINDPRIFA = "S" THEN TRUE ELSE FALSE
        END
  has_previously_negotiated:
    description: Indicates whether previously negotiated applies to this financial record.
    lineage:
      - datalake_cyber_raw.tb_parcela.CASE WHEN PAPREVNEG = "S" THEN TRUE ELSE FALSE
        END
  bank_code:
    description: Financial attribute representing bank code on the bill dataset.
    lineage:
      - datalake_cyber_raw.tb_parcela.PACODBANBOL
  bank_digit:
    description: Financial attribute representing bank digit on the bill dataset.
    lineage:
      - datalake_cyber_raw.tb_parcela.PADIGBANBOL
  bank_name:
    description: Financial attribute representing bank name on the bill dataset.
    lineage:
      - datalake_cyber_raw.tb_parcela.PANOMBANBOL
  company_agency_account_digit:
    description: Financial attribute representing company agency account digit on the bill dataset.
    lineage:
      - datalake_cyber_raw.tb_parcela.PACODAGBOL
  charge_barcode:
    description: Financial attribute representing charge barcode on the bill dataset.
    lineage:
      - datalake_cyber_raw.tb_parcela.CONCAT(PALINDIG1, '.', PALINDIG2, ' ', PALINDIG3,
        '.', PALINDIG4, ' ', PALINDIG5, '.', PALINDIG6, ' ', PALINDIG7, ' ', PALINDIG8)
  charge_instructions:
    description: Financial attribute representing charge instructions on the bill dataset.
    lineage:
      - datalake_cyber_raw.tb_parcela.CONCAT(PALININSTBOL1, PALININSTBOL2, PALININSTBOL3,
        PALININSTBOL4, PALININSTBOL5, PALININSTBOL6, PALININSTBOL7, PALININSTBOL8)
  payment_location_boleto:
    description: Financial attribute representing payment location boleto on the bill dataset.
    lineage:
      - datalake_cyber_raw.tb_parcela.PALOCPAGBOL
  type_transferor:
    description: Financial attribute representing type transferor on the bill dataset.
    lineage:
      - datalake_cyber_raw.tb_parcela.CASE WHEN PATPPECEBOL = "F" THEN "Fisica" WHEN
        PATPPECEBOL = "J" THEN "Juridica" ELSE PATPPECEBOL END
  type_transferor_document:
    description: Financial attribute representing type transferor document on the bill dataset.
    lineage:
      - datalake_cyber_raw.tb_parcela.CASE WHEN PATPDOPCBOL = "1" THEN "CNPJ" WHEN PATPDOPCBOL
        = "2" THEN "CPF" ELSE PATPDOPCBOL END
  transferor_document:
    description: Financial attribute representing transferor document on the bill dataset.
    lineage:
      - datalake_cyber_raw.tb_parcela.PADOCPECEBOL
  transferor_name:
    description: Financial attribute representing transferor name on the bill dataset.
    lineage:
      - datalake_cyber_raw.tb_parcela.PANOCEBOL
  drawer_type:
    description: Financial attribute representing drawer type on the bill dataset.
    lineage:
      - datalake_cyber_raw.tb_parcela.CASE WHEN PATPPESABOL = "F" THEN "Fisica" WHEN
        PATPPESABOL = "J" THEN "Juridica" ELSE PATPPESABOL END
  drawer_document_type:
    description: Financial attribute representing drawer document type on the bill dataset.
    lineage:
      - datalake_cyber_raw.tb_parcela.CASE WHEN PATPDPSABOL = "1" THEN "CNPJ" WHEN PATPDPSABOL
        = "2" THEN "CPF" ELSE PATPDPSABOL END
  drawer_document:
    description: Financial attribute representing drawer document on the bill dataset.
    lineage:
      - datalake_cyber_raw.tb_parcela.PADOPESABOL
  drawer_name:
    description: Financial attribute representing drawer name on the bill dataset.
    lineage:
      - datalake_cyber_raw.tb_parcela.PANOSABOL
  bill_record_sequence_2:
    description: Financial attribute representing bill record sequence 2 on the bill dataset.
    lineage:
      - datalake_cyber_raw.tb_parcela.PASEREARBOL
  bill_record_sequence_3:
    description: Financial attribute representing bill record sequence 3 on the bill dataset.
    lineage:
      - datalake_cyber_raw.tb_parcela.PASEQREARBOL
  due_amount:
    description: Financial attribute representing due amount on the bill dataset.
    lineage:
      - datalake_cyber_raw.tb_parcela.PAVLRORI
  main_amount:
    description: "Main amount (valor principal)"
    lineage:
      - datalake_cyber_raw.tb_parcela.PAVLPRINC
  interest_amount:
    description: "Interest Amount (Valor de Jusos Residuais)"
    lineage:
      - datalake_cyber_raw.tb_parcela.PAVLJUR
  fine_amount:
    description: Financial attribute representing fine amount on the bill dataset.
    lineage:
      - datalake_cyber_raw.tb_parcela.PAVLMUL
  entry_title:
    description: Financial attribute representing entry title on the bill dataset.
    lineage:
      - datalake_cyber_raw.tb_parcela.PABITITULO
  entry_description:
    description: Financial attribute representing entry description on the bill dataset.
    lineage:
      - datalake_cyber_raw.tb_parcela.PABIDESC
  entry_amount:
    description: "TF: bill.entries.id"
    lineage:
      - datalake_cyber_raw.tb_parcela.PABIVALOR
  bill_amount:
    description: Financial attribute representing bill amount on the bill dataset.
    lineage:
      - datalake_cyber_raw.tb_parcela.PAVLRBOL
  bill_discount_amount:
    description: Financial attribute representing bill discount amount on the bill dataset.
    lineage:
      - datalake_cyber_raw.tb_parcela.PAVLDESCBOL
  bill_deductions_amount:
    description: Financial attribute representing bill deductions amount on the bill dataset.
    lineage:
      - datalake_cyber_raw.tb_parcela.PAVLDEDUBOL
  bill_fees_amount:
    description: Financial attribute representing bill fees amount on the bill dataset.
    lineage:
      - datalake_cyber_raw.tb_parcela.PAVLRMOMUBOL
  bill_additions_amount:
    description: Financial attribute representing bill additions amount on the bill dataset.
    lineage:
      - datalake_cyber_raw.tb_parcela.PAVLACRBOL
  bill_total_amount:
    description: Financial attribute representing bill total amount on the bill dataset.
    lineage:
      - datalake_cyber_raw.tb_parcela.PAVLRTOBOL
  ts_creation:
    description: Timestamp when creation occurred in the upstream fintech system.
    lineage:
      - datalake_cyber_raw.tb_parcela.PADTCRIPA
  ts_due:
    description: "Original debt due date"
    lineage:
      - datalake_cyber_raw.tb_parcela.PADTVENORI
  ts_installment_due:
    description: "Invoice due date"
    lineage:
      - datalake_cyber_raw.tb_parcela.PADTVENC
  ts_due_boleto:
    description: Timestamp when due boleto occurred in the upstream fintech system.
    lineage:
      - datalake_cyber_raw.tb_parcela.PADTVENCBOL
  ts_entry_due:
    description: Timestamp when entry due occurred in the upstream fintech system.
    lineage:
      - datalake_cyber_raw.tb_parcela.PABIDTVENC
  ts_sent:
    description: Timestamp when sent occurred in the upstream fintech system.
    lineage:
      - datalake_cyber_raw.tb_parcela.PADTENVFA
  ts_limit_pause:
    description: Timestamp when limit pause occurred in the upstream fintech system.
    lineage:
      - datalake_cyber_raw.tb_parcela.PADTLIMPA
  ts_issue_boleto:
    description: Timestamp when issue boleto occurred in the upstream fintech system.
    lineage:
      - datalake_cyber_raw.tb_parcela.PADTDOCBOL
  ts_entry_insert:
    description: Timestamp when entry insert occurred in the upstream fintech system.
    lineage:
      - datalake_cyber_raw.tb_parcela.PABIDTINSERT
  ts_entry_update:
    description: Timestamp when entry update occurred in the upstream fintech system.
    lineage:
      - datalake_cyber_raw.tb_parcela.PABIDTUPDATE
  ts_insert:
    description: Timestamp when insert occurred in the upstream fintech system.
    lineage:
      - datalake_cyber_raw.tb_parcela.PADTINSERT
  ts_update:
    description: Timestamp when update occurred in the upstream fintech system.
    lineage:
      - datalake_cyber_raw.tb_parcela.PADTUPDATE
  ts_load:
    description: Timestamp when the row was materialized into the governance lake by the ETL pipeline.
    lineage:
      - datalake_cyber_raw.tb_parcela.NOW()
  is_bill_item_deleted:
    description: Indicates whether bill item deleted applies to this financial record.
    lineage: []
  ts_bill_item_deleted:
    description: Timestamp when bill item deleted occurred in the upstream fintech system.
    lineage: []
  year:
    description: Year partition derived from the source event timestamp for incremental loading.
    lineage: []
  day:
    description: Day partition derived from the source event timestamp for incremental loading.
    lineage: []
  eviction_costs_amount:
    description: Financial attribute representing eviction costs amount on the bill dataset.
    lineage: []
  creditor:
    description: Financial attribute representing creditor on the bill dataset.
    lineage: []
  eviction_honorarium_amount:
    description: Financial attribute representing eviction honorarium amount on the bill dataset.
    lineage: []
  month:
    description: Month partition derived from the source event timestamp for incremental loading.
    lineage: []
  ts_record_updated:
    description: Timestamp when record updated occurred in the upstream fintech system.
    lineage: []
