---
database_name: datalake_cyber_clean
table_name: bureau_history
owner: bianca.martins@quintoandar.com.br
domain: Fintech
description: |
  Table containing data from the bureau derogation and rehabilitation history.
  Stores the history of movements (Negativation/Rehabilitation) with their breakdowns (Rejection Treatment; Audit Log; Manual Requests).
columns:
  action_code:
    description: "Action: NEG = Negativation or REA = Rehabilitation"
    lineage:
      - datalake_cyber_raw.tb_historico_bureau.CD_ACAO_BUREAU
  requesting_user:
    description: "User: 'Automatic' (when generated by the negativation/rehabilitation network) or Login informed in the forced negativation/rehabilitation file"
    lineage:
      - datalake_cyber_raw.tb_historico_bureau.CD_USU_SOL
  ts_request:
    description: "Request sending date - Date sent to Bureau"
    lineage:
      - datalake_cyber_raw.tb_historico_bureau.DT_SOLICITACAO
  ts_action_date:
    description: "Action date - Date of 'Return from Negativation/Rehabilitation' confirmation"
    lineage:
      - datalake_cyber_raw.tb_historico_bureau.DT_ACAO
  movement_status:
    description: "Status: C = Confirmed, R = Rejected, A = Awaiting Return"
    lineage:
      - datalake_cyber_raw.tb_historico_bureau.IN_SITUACAO_MOV
  bureau_code:
    description: "Bureau code that received the action record"
    lineage:
      - datalake_cyber_raw.tb_historico_bureau.CD_BUREAU
  origin_indicator:
    description: "Type: 'Batch' - Origin of the request"
    lineage:
      - datalake_cyber_raw.tb_historico_bureau.IN_ORIGEM_SOL
  return_code:
    description: "Return code: Reason identified in Bureau files"
    lineage:
      - datalake_cyber_raw.tb_historico_bureau.CD_RET_BUREAU
  return_description:
    description: "Return description: Literal description of the code"
    lineage:
      - datalake_cyber_raw.tb_historico_bureau.DS_RET_BUREAU
  client_cpf_cnpj:
    description: "Client code: CPF/CNPJ of the client being negatived"
    lineage:
      - datalake_cyber_raw.tb_historico_bureau.CD_CPFCNPJ_CLI
  person_type:
    description: "Person type: F = Physical Person, J = Legal Entity"
    lineage:
      - datalake_cyber_raw.tb_historico_bureau.TP_PESSOA_CLI
  remittance_number:
    description: "Remittance number sent"
    lineage:
      - datalake_cyber_raw.tb_historico_bureau.NR_REMESSA
  group_code:
    description: "Group: QuintoAndar uses group '1' and QuintoCred uses group '2'"
    lineage:
      - datalake_cyber_raw.tb_historico_bureau.CD_GRUPO
  contract_number:
    description: "Contract number sent in the load (DELQMST.DMACCT)"
    lineage:
      - datalake_cyber_raw.tb_historico_bureau.CD_CONTRATO
  company_code:
    description: "Company code configured in CyberFinancial in the 'Company Registration' screen of CyberBureau"
    lineage:
      - datalake_cyber_raw.tb_historico_bureau.CD_EMPRESA
  policy_code:
    description: "Negativation/Rehabilitation queue code marked by the negativation network"
    lineage:
      - datalake_cyber_raw.tb_historico_bureau.CD_POLITICA
  installment_amount:
    description: "Contract value"
    lineage:
      - datalake_cyber_raw.tb_historico_bureau.VL_PARCELA
  ts_installment_due_date:
    description: "Contract due date"
    lineage:
      - datalake_cyber_raw.tb_historico_bureau.DT_VENC_PARC
  delay_days:
    description: "Contract delay days on the day of negativation"
    lineage:
      - datalake_cyber_raw.tb_historico_bureau.QT_DIA_ATRASO
  guarantor_indicator:
    description: "Flag indicating if it's a guarantor"
    lineage:
      - datalake_cyber_raw.tb_historico_bureau.IN_AVAL_ACIONA
  bureau_contract_number:
    description: "Contract number in Bureau"
    lineage:
      - datalake_cyber_raw.tb_historico_bureau.CD_CTR_BUREAU
  installment_number:
    description: "Number of the negatived installment"
    lineage:
      - datalake_cyber_raw.tb_historico_bureau.NR_PARCELA
