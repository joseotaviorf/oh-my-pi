---
database_name: datalake_cyber_clean
table_name: olos_dialer_label_decision_tree
owner: juliana.hocihara@quintoandar.com.br
domain: Fintech
description: |
  Label decision tree for Olos Dialer portfolio segmentation. Part of the LBL_DECTBLX series (lbl_dectbl1) used to calculate and update portfolio segmentation labels for credit qualification and dialer routing.
columns:
  group:
    description: "Account group identifier for decision tree classification"
    lineage:
      - datalake_cyber_raw.lbl_dectbl1.acct_grp
  level:
    description: "Decision tree level indicator for hierarchical rule processing"
    lineage:
      - datalake_cyber_raw.lbl_dectbl1.level1
  test:
    description: "Test condition identifier for rule evaluation"
    lineage:
      - datalake_cyber_raw.lbl_dectbl1.test
  sequence:
    description: "Sequence number for ordering rule execution"
    lineage:
      - datalake_cyber_raw.lbl_dectbl1.sequence
  comment:
    description: "Descriptive comment for the decision rule"
    lineage:
      - datalake_cyber_raw.lbl_dectbl1.comment1
  field_1:
    description: "First field name used in the decision condition"
    lineage:
      - datalake_cyber_raw.lbl_dectbl1.LOWER(field_1)
  operator:
    description: "Comparison operator for evaluating the condition"
    lineage:
      - datalake_cyber_raw.lbl_dectbl1.CASE WHEN LOWER(op) = '.eq.' THEN '=' WHEN LOWER(op) = '.ge.'
        THEN '>=' WHEN LOWER(op) = '.gt.' THEN '>' WHEN LOWER(op) = '.le.' THEN '<=' WHEN LOWER(op) = '.lt.'
        THEN '<' WHEN LOWER(op) = '.ne.' THEN '!=' ELSE LOWER(op) END
  field_2:
    description: "Second field name or value for comparison"
    lineage:
      - datalake_cyber_raw.lbl_dectbl1.LOWER(field_2)
  field_2_flag:
    description: "Flag indicating how field_2 should be interpreted"
    lineage:
      - datalake_cyber_raw.lbl_dectbl1.LOWER(field_2_flag)
  field_3:
    description: "Third field name or value for additional condition"
    lineage:
      - datalake_cyber_raw.lbl_dectbl1.LOWER(field_3)
  field_3_flag:
    description: "Flag indicating how field_3 should be interpreted"
    lineage:
      - datalake_cyber_raw.lbl_dectbl1.LOWER(field_3_flag)
  or_flag:
    description: "Boolean flag for OR logic in compound conditions"
    lineage:
      - datalake_cyber_raw.lbl_dectbl1.or_flag
  num_return:
    description: "Numeric return value when condition is met"
    lineage:
      - datalake_cyber_raw.lbl_dectbl1.num_return
  next_level:
    description: "Next decision tree level to evaluate"
    lineage:
      - datalake_cyber_raw.lbl_dectbl1.next_level
  nxt_return:
    description: "Return value to use at the next level"
    lineage:
      - datalake_cyber_raw.lbl_dectbl1.nxt_return
  queue:
    description: "Queue identifier or label value for segmentation"
    lineage:
      - datalake_cyber_raw.lbl_dectbl1.queue
  ts_load:
    description: "Timestamp when the record was loaded"
