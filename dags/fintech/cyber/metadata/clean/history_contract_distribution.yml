---
database_name: datalake_cyber_clean
table_name: history_contract_distribution
owner: juliana.hocihara@quintoandar.com.br
domain: Fintech
description: |
  Historical table with agency redistribution performance. Table granularity - id_contract + contract_group.
  New records are inserted with each new distribution, maintaining the complete history of distributions.
  The table is only updated when agency/advisory is updated. At this point, the table is filled in with the photo of the contract with its appropriate information (queue..)
columns:
  id_contract:
    description: "ID contract = ID Contract (TF: contract.external-id) + Contract Group (ID Product debtor.product-code) + Revision"
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_ACCT
  id_client:
    description: "ID Client = CPF (TF: client.document)"
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_SSNUM
  contract_group:
    description: Financial attribute representing contract group on the history_contract_distribution dataset.
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_ACCTG
  cpf_cnpj_client:
    description: Financial attribute representing cpf cnpj client on the history_contract_distribution dataset.
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_CPFCNPJ
  head_office:
    description: Financial attribute representing head office on the history_contract_distribution dataset.
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_MATRIZ
  regional:
    description: Financial attribute representing regional on the history_contract_distribution dataset.
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_REGIONAL
  branch:
    description: Financial attribute representing branch on the history_contract_distribution dataset.
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_FILIAL
  collection_phase:
    description: Financial attribute representing collection phase on the history_contract_distribution dataset.
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_FASE_COBRANCA
  delay_contamined_days:
    description: "Days beteween the olders invoice due date (delinquency_master.ts_due_oldest_invoice = delqmst.dmdlqdt) and TODAY.  It's the same as delinquency_master.delay_contamined_days (DELQMST.DMDAYS)"
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_DIASATRASO
  selection_criteria:
    description: "These values ​​are queues defined by QuintoAndar to identify the type of charging/collection action in the decision tree. delinquent_master.segmentation_queue (DELQMST.DMQUE)"
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_CRIT_SELECAO
  year_month:
    description: "Safra format YYYYMM"
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_REFSAFRA
  agency:
    description: Financial attribute representing agency on the history_contract_distribution dataset.
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_ASSESSORIA
  new_agency:
    description: Financial attribute representing new agency on the history_contract_distribution dataset.
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_NOVA_ASSESSORIA
  new_status:
    description: Financial attribute representing new status on the history_contract_distribution dataset.
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_NOVO_STATUS
  year_month_received:
    description: Financial attribute representing year month received on the history_contract_distribution dataset.
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_ANOMES_RECEB
  year_month_recovered:
