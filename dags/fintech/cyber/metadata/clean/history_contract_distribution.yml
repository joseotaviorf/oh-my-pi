    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_DESEMPENHO
  segmentation_queue:
    description: "Same as 'delinquent_master.current_queue'"
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_QUE1
  commission_queue:
    description: "Queue 2. In Recupera this would be the distributor. A contract can be in more than one queue. Same as 'delinquent_master.current_queue_2'"
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_QUE2
  agreement_queue:
    description: "Queue 3. In Recupera this would be the distributor. A contract can be in more than one queue. Same as 'delinquent_master.current_queue_3'"
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_QUE3
  digital_channel_queue:
    description: "Queue 4. In Recupera this would be the distributor. A contract can be in more than one queue. Same as 'delinquent_master.current_queue_4'"
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_QUE4
  eviction_queue:
