---
database_name: datalake_cyber_clean
table_name: agreement_decision_tree
owner: juliana.hocihara@quintoandar.com.br
domain: Fintech
description: |
  Decision tree table for agreement queue assignment logic containing rules and conditions for routing accounts to appropriate agreement queues.
columns:
  group:
    description: "Account group identifier for decision tree classification"
    lineage:
      - datalake_cyber_raw.que_dectbl3.acct_grp
  level:
    description: "Decision tree level indicator for hierarchical rule processing"
    lineage:
      - datalake_cyber_raw.que_dectbl3.level1
  test:
    description: "Test condition identifier for rule evaluation"
    lineage:
      - datalake_cyber_raw.que_dectbl3.test
  sequence:
    description: "Sequence number for ordering rule execution"
    lineage:
      - datalake_cyber_raw.que_dectbl3.sequence
  comment:
    description: "Descriptive comment for the decision rule"
    lineage:
      - datalake_cyber_raw.que_dectbl3.comment1
  field_1:
    description: "First field name used in the decision condition"
    lineage:
      - datalake_cyber_raw.que_dectbl3.LOWER(field_1)
  operator:
    description: "Comparison operator for evaluating the condition"
    lineage:
      - datalake_cyber_raw.que_dectbl3.CASE WHEN op = '.eq.' THEN '=' WHEN op = '.ge.'
        THEN '>=' WHEN op = '.gt.' THEN '>' WHEN op = '.le.' THEN '<=' WHEN op = '.lt.'
        THEN '<' WHEN op = '.ne.' THEN '!=' ELSE op END
  field_2:
    description: "Second field name or value for comparison"
    lineage:
      - datalake_cyber_raw.que_dectbl3.LOWER(field_2)
  field_2_flag:
    description: "Flag indicating how field_2 should be interpreted"
    lineage:
      - datalake_cyber_raw.que_dectbl3.LOWER(field_2_flag)
  field_3:
    description: "Third field name or value for additional condition"
    lineage:
      - datalake_cyber_raw.que_dectbl3.LOWER(field_3)
  field_3_flag:
    description: "Flag indicating how field_3 should be interpreted"
    lineage:
      - datalake_cyber_raw.que_dectbl3.LOWER(field_3_flag)
  or_flag:
    description: "Boolean flag for OR logic in compound conditions"
    lineage:
      - datalake_cyber_raw.que_dectbl3.or_flag
  num_return:
    description: "Numeric return value when condition is met"
    lineage:
      - datalake_cyber_raw.que_dectbl3.num_return
  next_level:
    description: "Next decision tree level to evaluate"
    lineage:
      - datalake_cyber_raw.que_dectbl3.next_level
  nxt_return:
    description: "Return value to use at the next level"
    lineage:
      - datalake_cyber_raw.que_dectbl3.nxt_return
  queue:
    description: "Queue identifier for account routing"
    lineage:
      - datalake_cyber_raw.que_dectbl3.queue
  ts_load:
    description: Timestamp when the row was materialized into the governance lake by the ETL pipeline.
    lineage: []
