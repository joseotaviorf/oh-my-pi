---
database_name: datalake_cyber_clean
table_name: agreement_type
owner: bianca.martins@quintoandar.com.br
domain: Fintech
description: |
  Configuration table containing types of agreements available in the system with their rules, parameters, and conditions for contract negotiations.
columns:
  id_agreement_type:
    description: "Agreement type identifier code"
    lineage:
      - datalake_cyber_raw.agrtype.AGTYPE
  contract_group:
    description: "Contract group classification"
    lineage:
      - datalake_cyber_raw.agrtype.AGACCTG
  agreement_type_description:
    description: "Descriptive name of the agreement type"
    lineage:
      - datalake_cyber_raw.agrtype.AGNAME
  payments_to_be_forgiven:
    description: "Number of payments to be forgiven in the agreement"
    lineage:
      - datalake_cyber_raw.agrtype.AGCNDPAYN
  fullfilled_payments_to_forgive:
    description: "Number of fulfilled payments required to forgive debt"
    lineage:
      - datalake_cyber_raw.agrtype.AGCNDPAYM
  min_delay_days:
    description: "Minimum days of delay that the contract must have to be available for this type of agreement"
    lineage:
      - datalake_cyber_raw.agrtype.AGDMDAYSMIN
  max_delay_days:
    description: "Maximum days of delay that the contract must have to be available for this type of agreement"
    lineage:
      - datalake_cyber_raw.agrtype.AGDMDAYSMAX
  order_classification:
    description: "This is the sort order of the agreement. There is a standard agreement and it always has to be presented as the first one on the CyberAgreements screen."
    lineage:
      - datalake_cyber_raw.agrtype.AGSORTORD
  missed_payments_to_break_agreement:
    description: "Number of missed payments that will break the agreement"
    lineage:
      - datalake_cyber_raw.agrtype.AGBREAK
  consecutive_payments_received:
    description: "Number of consecutive payments received initially"
    lineage:
      - datalake_cyber_raw.agrtype.AGCSINITNT
  notify_central_system_periodically:
    description: "Flag to notify central system periodically about agreement status"
    lineage:
      - datalake_cyber_raw.agrtype.AGCSPERNT
  payment_type:
    description: "Type of payment structure for the agreement"
    lineage:
      - datalake_cyber_raw.agrtype.AGPYTYPE
  days_from_date_inicial_payment:
    description: "Number of days from agreement date to first payment due date"
    lineage:
      - datalake_cyber_raw.agrtype.AGINITPYDAYS
  min_down_payment_percentage:
    description: "Minimum percentage required for down payment"
    lineage:
      - datalake_cyber_raw.agrtype.AGINITPYMINP
  max_percentage_initial_payment:
    description: "Maximum percentage allowed for initial payment"
    lineage:
      - datalake_cyber_raw.agrtype.AGINITPYMAXP
  days_until_last_payment:
    description: "Number of days until the last payment is due"
    lineage:
      - datalake_cyber_raw.agrtype.AGLSTPYDAYS
  agreement_interest_rate:
    description: "Interest rate applied to the agreement installments"
    lineage:
      - datalake_cyber_raw.agrtype.AGRATE
  fine_rate:
    description: "Fine Rate in case of delay in payment of the Agreement installment"
    lineage:
      - datalake_cyber_raw.agrtype.AGRATE2
  free_days:
    description: "Number of grace period days with no charges"
    lineage:
      - datalake_cyber_raw.agrtype.AGGRDAYS
  max_installments:
    description: "Maximum number of installments allowed"
    lineage:
      - datalake_cyber_raw.agrtype.AGMAXPMTS
  valid_frequencies:
    description: "Valid payment frequency options for the agreement"
    lineage:
      - datalake_cyber_raw.agrtype.AGFREQ
  ts_start_agreement:
    description: "Start date when agreement type becomes valid"
    lineage:
      - datalake_cyber_raw.agrtype.AGINITDT
  ts_end_agreement:
    description: "End date when agreement type expires"
    lineage:
      - datalake_cyber_raw.agrtype.AGENDDT
  min_payment_amount:
    description: "Minimum payment amount required for the agreement"
    lineage:
      - datalake_cyber_raw.agrtype.AGMININITPY
  fees:
    description: "Tax rate or fees applied to the agreement"
    lineage:
      - datalake_cyber_raw.agrtype.AGTAXRATE
  valid_period:
    description: "Period in days that the agreement remains valid"
    lineage:
      - datalake_cyber_raw.agrtype.AGVALPER
  flag:
    description: "Self-cure flag indicating automatic resolution capability"
    lineage:
      - datalake_cyber_raw.agrtype.AGSELFCURE
  AGSTATUS:
    description: "Status of the agreement type configuration"
    lineage:
      - datalake_cyber_raw.agrtype.AGSTATUS
  AGMINPAR:
    description: "Minimum number of installments allowed"
    lineage:
      - datalake_cyber_raw.agrtype.AGMINPAR
  agreement_channel:
    description: "Check existing settings in the Multichannel story."
    lineage:
      - datalake_cyber_raw.agrtype.AGCANALNEG
  payment_method:
    description: "BOL = bank slip, CAR = Credit card, DCO = debit account"
    lineage:
      - datalake_cyber_raw.agrtype.AGFORMAPAG
