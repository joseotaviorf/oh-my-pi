---
database_name: datalake_cyber_clean
table_name: agreement_installments
owner: juliana.hocihara@quintoandar.com.br
domain: Fintech
description: Table with information on the installments of the agreement. Table granularity - installment of agreement.
columns:
  id_agreement:
    description: "ID agreement. PK of table"
    lineage:
      - datalake_cyber_raw.agpmtdet.APAHID
  id_agreement_installment:
    description: Identifier for the agreement installment referenced by this financial record (ID agreement installment = ID Agreement + Installment number).
    lineage:
      - datalake_cyber_raw.agpmtdet.APAHID
      - datalake_cyber_raw.agpmtdet.APDETID
  status:
    description: Current lifecycle status of the financial entity in the upstream operational system.
    categories:
      Programado: "Same as 'registered' in Trato Feito"
      Quebrado: "Same as 'canceled' or 'expired' in Trato Feito"
      Concluído: "Same as 'paid' in Trato Feito"
    lineage:
      - datalake_cyber_raw.agpmtdet.APFLAG
  revalued_payment_flag:
    description: Financial attribute representing revalued payment flag on the agreement_installments dataset.
    lineage:
      - datalake_cyber_raw.agpmtdet.APFLAG2
  installment_number:
    description: "Installment number.'0' is reported for down payment or for the first installment when there is no down payment"
    lineage:
      - datalake_cyber_raw.agpmtdet.APDETID
  amount_to_pay:
    description: Financial attribute representing amount to pay on the agreement_installments dataset.
    lineage:
      - datalake_cyber_raw.agpmtdet.APAMT
  payment_amount:
    description: Financial attribute representing payment amount on the agreement_installments dataset.
    lineage:
      - datalake_cyber_raw.agpmtdet.APAMTPAY
  amortization_amount:
    description: "Amount that will be amortized"
    lineage:
      - datalake_cyber_raw.agpmtdet.APAMZAMT
  credit_card_fee_amount:
    description: "Credit Card Fee “prorated” per installment of the agreement"
    lineage:
      - datalake_cyber_raw.agpmtdet.APINTTAXAMT
  honorarium_amount:
    description: "Honorarium amount. Stores the value of the fees/honorarium (AGRHDR.AGRHONO) distributed equally between all installments of the agreement, placing the difference in cents in the last installment of the agreement."
    lineage:
      - datalake_cyber_raw.agpmtdet.APHONO
  ts_start_payment_term:
    description: Timestamp when start payment term occurred in the upstream fintech system.
    lineage:
      - datalake_cyber_raw.agpmtdet.APINDATE
  ts_due_installment:
    description: Timestamp when due installment occurred in the upstream fintech system.
    lineage:
      - datalake_cyber_raw.agpmtdet.APDUEDT
  ts_load:
    description: Timestamp when the row was materialized into the governance lake by the ETL pipeline.
    lineage: []
  installment_interest_amount:
    description: Financial attribute representing installment interest amount on the agreement_installments dataset.
    lineage: []
  agreement_balance_amount:
    description: Financial attribute representing agreement balance amount on the agreement_installments dataset.
    lineage: []
  source:
    description: Financial attribute representing source on the agreement_installments dataset.
    lineage: []
