---
database_name: datalake_cyber_clean
table_name: debtor
owner: juliana.hocihara@quintoandar.com.br
domain: Fintech
description: |
  This table stores information about people related to the debtor. The first 3 relationships
  are generally co-debtors who add and update each other to and from the host system via update (process
  load with the beb045 program).
columns:
  id_client:
    description: "CPF/CNPJ of the Related Person. TF: client.document"
    lineage:
      - datalake_cyber_raw.relations.RERSSNUM
  id_contract:
    description: "ID contract = ID Contract (TF: contract.external-id) + Contract Group (ID Product debtor.product-code) + Revision"
    lineage:
      - datalake_cyber_raw.relations.RERACCT
  contract_group:
    description: Financial attribute representing contract group on the debtor dataset (TF debtor.group).
