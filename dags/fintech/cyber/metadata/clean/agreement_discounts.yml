      - datalake_cyber_raw.agdscdet.ADDISCT
  ts_load:
    description: Timestamp when the row was materialized into the governance lake by the ETL pipeline.
    lineage: []
  source:
    description: Financial attribute representing source on the agreement_discounts dataset.
    lineage: []
