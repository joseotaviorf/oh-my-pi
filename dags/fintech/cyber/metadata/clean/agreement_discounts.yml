columns:
  id_agreement:
    description: "ID agreement. PK of table"
    lineage:
      - datalake_cyber_raw.agdscdet.ADID
  field:
    description: "CyberFinancial field parameterized in the type of agreement"
    lineage:
      - datalake_cyber_raw.agdscdet.ACFIELD
  field_name:
    description: Financial attribute representing field name on the agreement_discounts dataset.
    categories:
      "Parcelas Vencidas": "VALOR DO PRINCIPAL DO SOMATÓRIO DAS PARCELAS"
      "Juros Acordo": "VALOR DE JUROS DO CONTRATO"
      "Multa Acordo": "VALOR DE MULTA DO CONTRATO"
    lineage:
      - datalake_cyber_raw.agdscdet.ADFIELD
  arithmetic_operator:
    description: Financial attribute representing arithmetic operator on the agreement_discounts dataset.
    lineage:
      - datalake_cyber_raw.agdscdet.ADOP
  amount_without_discount:
    description: Financial attribute representing amount without discount on the agreement_discounts dataset.
    lineage:
      - datalake_cyber_raw.agdscdet.ADORVL
  amount_with_discount:
    description: "Negotiated amount with discounts applied."
