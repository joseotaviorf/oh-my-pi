---
database_name: datalake_cyber_clean
table_name: agreements
owner: bianca.martins@quintoandar.com.br
domain: Fintech
description: Negotiation information. Table granularity - id_agreement.
columns:
  id_agreement:
    description: "Agreement identifier. Table PK (Primary Key)"
    lineage:
      - datalake_cyber_raw.agrhdr.AHID
  id_client:
    description: "ID Client (CPF). To get the ID Contract, please use table `contracts_agreements`"
    lineage:
      - datalake_cyber_raw.agrhdr.AHACCT
  id_user:
    description: "Identifies who created the agreement"
    lineage:
      - datalake_cyber_raw.agrhdr.AHCOLLID
  agreement_type:
    description: "Agreement type. Same as delinquent_master.agreement_type (DELQMST.DMAGTYPE)"
    lineage:
      - datalake_cyber_raw.agrhdr.AHTYPE
  contract_group:
    description: "Contract Group"
    lineage:
      - datalake_cyber_raw.agrhdr.AHACCTG
  authorized_by_manager:
    description: "Manager who authorized the agreement."
    lineage:
      - datalake_cyber_raw.agrhdr.AHAUTCOLLID
  frequency:
    description: "Frequency/Periodicity"
    categories:
      weekly: "weekly"
      daily: "daily"
      monthly: "monthly"
      bimonthly: "bimonthly"
      quarterly: "quarterly"
    lineage:
      - datalake_cyber_raw.agrhdr.AHFREQ
  number_of_installments:
    description: "Number of Installments of the Agreement, not counting the Down Payment"
    lineage:
      - datalake_cyber_raw.agrhdr.AHPRD
  status:
    description: "Agreement status"
    categories:
      Autorizado: "Same as Offset in Trato Feito"
      Cancelado: "Same as Canceled in Trato Feito"
      Finalizado: "Same as Finished in Trato Feito"
      Pendente: "Pendente"
    lineage:
      - datalake_cyber_raw.agrhdr.AHSTATUS
  type_interest_quota:
    description: "Type of interest quotas"
    lineage:
      - datalake_cyber_raw.agrhdr.AHPYTYPE
  contact_type:
    description: "Type of contact made by the advisory/agency to create the negotiation"
    categories:
      BackOfc: Negociação Backoffice
      AVirtual: Negociação Agente Virtuall, utiliza tecnologia mais limitada com interações pré-programadas e sem IA avançada.
      Chatbot: Negociação Chatbot
      Discador: Negociação Discador
      E-mail: Negociação E-mail
      IAPortal: Negociação Portal IA, conduzida por uma inteligência artificial que proporciona uma experiência mais fluida e personalizada.
      IAWpp: Negociação WhatsApp IA
      Portal: Negociação Portal
      Manual: Negociação Discador Manual
      WhatsApp: Negociação WhatsApp
    lineage:
      - datalake_cyber_raw.agrhdr.AHCTTYPE
  notify_central_system:
    description: "Notify Central System"
    lineage:
      - datalake_cyber_raw.agrhdr.AHCSPERNT
  payments_to_notify:
    description: "Payments to notify"
    lineage:
      - datalake_cyber_raw.agrhdr.AHCSINITNT
  number_payments_to_exempt:
    description: "Number Payments to exempt"
    lineage:
      - datalake_cyber_raw.agrhdr.AHCNDPAYN
  required_number_payments_to_exempt:
    description: "Required Number Payments to exempt"
    lineage:
      - datalake_cyber_raw.agrhdr.AHCNDPAYM
  broken_payments:
    description: "broken Payments"
    lineage:
      - datalake_cyber_raw.agrhdr.AHBREAK
  total_negotiated_amount_with_fees:
    description: "Total Negotiated Value of the Agreement with Fees"
    lineage:
      - datalake_cyber_raw.agrhdr.AHTOTPMT
  total_negotiated_amount_without_fees:
    description: "Amount Payable without fees/honorarium"
    lineage:
      - datalake_cyber_raw.agrhdr.AHTOTPMTSH
  honorarium_amount:
    description: "Fees (honorários) amount."
    lineage:
      - datalake_cyber_raw.agrhdr.AGRHONO
  installment_interest_rate:
    description: "Agreement installment interest rate"
    lineage:
      - datalake_cyber_raw.agrhdr.AHRATE
  additional_interest_rate:
    description: "Additional contract interest rate. It is only used when payment was made during the grace period."
    lineage:
      - datalake_cyber_raw.agrhdr.AHRATE2
  payment_type_after_free_term:
    description: "payment_type_after_free_term"
    lineage:
      - datalake_cyber_raw.agrhdr.AHGRPERTY
  level_agreement_authorization:
    description: "Level that can authorize the agreement"
    lineage:
      - datalake_cyber_raw.agrhdr.AHLVL
  exception:
    description: "Exception when the agreement was created"
    lineage:
      - datalake_cyber_raw.agrhdr.AHEXCP
  payment_method:
    description: "Payment method selected during agreement creation"
    lineage:
      - datalake_cyber_raw.agrhdr.AHFORMAPAG
  times_accordion_updated:
    description: "times_accordion_updated"
    lineage:
      - datalake_cyber_raw.agrhdr.AHNUMUP
  percentage_paid_agreement:
    description: "percentage_paid_agreement"
    lineage:
      - datalake_cyber_raw.agrhdr.AHFLFLVL
  ts_agreement:
    description: "ts_agreement"
    lineage:
      - datalake_cyber_raw.agrhdr.AHREGDT
  ts_agreement_creation:
    description: "ts_agreement_creation"
    lineage:
      - datalake_cyber_raw.agrhdr.AHDT
  ts_authorized:
    description: "ts_authorized"
    lineage:
      - datalake_cyber_raw.agrhdr.AHAUTDT
  ts_status_update:
    description: "Date on which the status of the agreement changed, both online and by batch program"
    lineage:
      - datalake_cyber_raw.agrhdr.AHSTADT
  manager_updated_status:
    description: "Manager who changed the status of the agreement with online programs; When using batch programs, the value 'HOST' is assigned."
    lineage:
      - datalake_cyber_raw.agrhdr.AHSTACOLL
