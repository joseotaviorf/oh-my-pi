---
database_name: datalake_cyber_clean
table_name: logs_valid_result_code
owner: juliana.hocihara@quintoandar.com.br
domain: Fintech
description: |
  Reference table that relates Action, Result, and Complement codes (VALCODES). Stores valid result codes for each action code, used to determine which activities are related to a specific code. Related to ACTVERTB table.
columns:
  action_type:
    description: "Type of action code classification"
    lineage:
      - datalake_cyber_raw.valcodes.VCACTYPE
  id_action:
    description: Identifier for the action referenced by this financial record.
    lineage:
      - datalake_cyber_raw.valcodes.VCACCODE
  result_type:
    description: "Type of result code classification"
    lineage:
      - datalake_cyber_raw.valcodes.VCRCTYPE
  id_result:
    description: Identifier for the result referenced by this financial record.
    lineage:
      - datalake_cyber_raw.valcodes.VCRCCODE
  comment_pre_defined:
    description: "Pre-defined comment text for the code combination"
    lineage:
      - datalake_cyber_raw.valcodes.VCCMTPREFIX
  group:
    description: "Group identifier (* for General, N for specific group, J for CyberLegal)"
    lineage:
      - datalake_cyber_raw.valcodes.VCACCTG
  module:
    description: "Module that uses the code (CyberLegal or All others)"
    lineage:
      - datalake_cyber_raw.valcodes.CASE
        WHEN UPPER(VCMODULE) = 'L' THEN 'CyberLegal'
        WHEN UPPER(VCMODULE) = 'N' THEN 'Todos os demais'
        ELSE UPPER(VCMODULE)
        END
  ts_load:
    description: "Timestamp when the record was loaded"
