    lineage:
      - datalake_cyber_raw.pmtfil.PMTDFLAG
  trandefs_sequence:
    description: Financial attribute representing trandefs sequence on the payments dataset.
    lineage:
      - datalake_cyber_raw.pmtfil.PMTDSEQ
  trandefs_percentage:
    description: Financial attribute representing trandefs percentage on the payments dataset.
