---
database_name: datalake_cyber_clean
table_name: payments
owner: juliana.hocihara@quintoandar.com.br
domain: Fintech
description: Table granularity - installments of the negotiation that were paid
columns:
  id_contract:
    description: "ID contract = ID Contract (TF: contract.external-id) + Contract Group (ID Product debtor.product-code) + Revision"
    lineage:
      - datalake_cyber_raw.pmtfil.PMACCT
  id_agreement_installment:
    description: "In case of payment of negotiation ('Pagamento Acordo' value for payment_type), this field is filled with the negotiation + installment number. Otherwise, this field will be filled with the ID of the original invoice that was amortized in the payment (used for 5C) "
    lineage:
      - datalake_cyber_raw.pmtfil.PMTDDESC
  id_payment:
    description: "Payment ID. It is the datalake_trato_clean.payment.id column. To get 'our number' information, get it from table datalake_trato_clean.installment_charge"
    lineage:
      - datalake_cyber_raw.pmtfil.PMID
  contract_group:
    description: Financial attribute representing contract group on the payments dataset.
    lineage:
      - datalake_cyber_raw.pmtfil.PMACCTG
  payment_type:
    description: Financial attribute representing payment type on the payments dataset.
    lineage:
      - datalake_cyber_raw.pmtfil.PMTCODE
  manager:
    description: Financial attribute representing manager on the payments dataset.
    lineage:
      - datalake_cyber_raw.pmtfil.PMCOLLID
  queue:
    description: Financial attribute representing queue on the payments dataset.
    lineage:
      - datalake_cyber_raw.pmtfil.PMQUE
  payment_method:
    description: "Payment method code (Boleto, PIX, Credit Card)"
    lineage:
      - datalake_cyber_raw.pmtfil.PMBATCH
  agency:
    description: Financial attribute representing agency on the payments dataset.
    lineage:
      - datalake_cyber_raw.pmtfil.PMAGENCY
  error_code:
