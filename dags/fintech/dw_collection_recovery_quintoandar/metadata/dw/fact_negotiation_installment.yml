database_name: dw_collection_recovery_quintoandar
table_name: fact_negotiation_installment
domain: Fintech
owner: juliana.hocihara@quintoandar.com.br
description: "This table contains all installments for generated negotiations"
columns:
  sk_negotiation_installment:
    lineage:
      - datalake_collections_quintoandar.installment.id_contract
      - datalake_collections_quintoandar.installment.id_negotiation_installment
    description: "Surrogate key for the negotiation installment, formed by concatenating the contract ID and the negotiation installment ID. This serves as the table's primary key."
  sk_negotiation:
    lineage:
      - datalake_collections_quintoandar.installment.id_contract
      - datalake_collections_quintoandar.installment.id_negotiation
    description: "Surrogate key for the parent negotiation, serving as a foreign key to the `fact_negotiation` table."
  sk_contract:
    lineage:
      - datalake_collections_quintoandar.installment.id_contract
    description: "Surrogate key for the contract associated with this installment, linking to the `dim_contract` table."
  id_negotiation:
    lineage:
      - datalake_collections_quintoandar.installment.id_negotiation
    description: "The unique identifier of the negotiation this installment belongs to."
  id_installment:
    lineage:
      - datalake_collections_quintoandar.installment.id_negotiation_installment
    description: "The unique identifier for this specific negotiation installment."
  id_installment_trato_feito:
    lineage:
      - datalake_collections_quintoandar.installment.id_installment_trato_feito
    description: "The unique identifier for this installment within the Trato-Feito system."
  id_invoice_extra:
    lineage:
      - datalake_collections_quintoandar.installment.id_invoice_extra
      - datalake_retsuko.invoice.id_external
    description: "The ID of the extra invoice created in Seu Barriga as part of this negotiation installment."
  installment_number:
    lineage:
      - datalake_collections_quintoandar.installment.installment_number
    description: "The sequential number of this installment within its negotiation (e.g., 1 for the first installment, 2 for the second)."
  our_number:
    lineage:
      - datalake_collections_quintoandar.installment.our_number
    description: "Our reference number for the payment, used to reconcile payments received via Nexxera CNAB files."
  creditor:
    lineage:
      - datalake_collections_quintoandar.installment.creditor
    description: "The entity to whom the debt is owed (e.g., IQ QuintoAndar, PP QuintoAndar)."
  source:
    lineage:
      - datalake_collections_quintoandar.installment.source
    description: "The source system or origin of the installment data."
  installment_status:
    lineage:
      - datalake_collections_quintoandar.installment.installment_status
      - datalake_nexxera.cnab_charges_recupera.occurrence_code
      - datalake_retsuko.invoice.status
    description: "The current status of the installment."
    categories:
      expired: "The installment negotiation was broken before the installment was paid."
      paid: "The installment was paid and accounted for. This status can also be derived when a pending/registered installment is confirmed by Nexxera."
      pending: "The accounting registration of the installment (accounting-installment) is still pending."
      registered: "The accounting record for the installment was created (the extra invoice was created in SeuBarriga)."
      canceled: "The installment was canceled."
      failed: "Internal processing error related to the installment."
      ignored: "The installment was manually ignored."
  payment_method:
    lineage:
      - datalake_collections_quintoandar.installment.payment_method
    description: "The method chosen for paying this installment (e.g., 'CARTÃO DE CRÉDITO', 'BOLETO', 'PIX')."
  main_amount:
    lineage:
      - datalake_collections_quintoandar.installment.main_amount
    description: "The principal amount of the debt associated with this installment, before any fees or discounts."
  updated_balance:
    lineage:
      - datalake_collections_quintoandar.installment.updated_balance
    description: "The updated balance of the debt after this installment's creation or payment."
  fine_amount:
    lineage:
      - datalake_collections_quintoandar.installment.fine_amount
    description: "The fine amount (multa) applied to this installment."
  interest_fee_amount:
    lineage:
      - datalake_collections_quintoandar.installment.interest_fee_amount
    description: "The interest fee amount (juros) applied to this installment."
  debts_fee_amount:
    lineage:
      - datalake_collections_quintoandar.installment.debts_fee_amount
    description: "The total amount of various debts/fees included in this installment."
  credit_card_fee_amount:
    lineage:
      - datalake_collections_quintoandar.installment.credit_card_fee_amount
    description: "The credit card processing fee specific to this installment."
  installment_costs:
    lineage:
      - datalake_collections_quintoandar.installment.installment_costs
    description: "Additional costs associated with this installment."
  installment_lawyers_fee:
    lineage:
      - datalake_collections_quintoandar.installment.installment_lawyers_fee
    description: "Lawyers' fees specifically allocated to this installment."
  debt_amount:
    lineage:
      - datalake_collections_quintoandar.installment.main_amount
      - datalake_collections_quintoandar.installment.debts_fee_amount
    description: "The total debt amount for this installment, calculated as the main amount plus other debt fees."
  discount_amount:
    lineage:
      - datalake_collections_quintoandar.installment.discount_amount
      - datalake_collections_quintoandar.installment.source
      - datalake_collections_quintoandar.installment.main_amount
      - datalake_collections_quintoandar.installment.debts_fee_amount
      - datalake_collections_quintoandar.installment.amount_to_pay
    description: "The total discount amount applied to this specific installment."
  discount_to_original:
    lineage:
      - datalake_collections_quintoandar.installment.discount_to_original_amount
      - datalake_collections_quintoandar.installment.discount_amount
      - datalake_collections_quintoandar.installment.debts_fee_amount
      - datalake_collections_quintoandar.installment.credit_card_fee_amount
    description: "The portion of the total discount applied specifically to the original main amount of the installment."
  net_amount:
    lineage:
      - datalake_collections_quintoandar.installment.main_amount
      - datalake_collections_quintoandar.installment.discount_to_original_amount
      - datalake_collections_quintoandar.installment.discount_amount
      - datalake_collections_quintoandar.installment.debts_fee_amount
      - datalake_collections_quintoandar.installment.credit_card_fee_amount
    description: "The net amount of the installment after applying the discount to the original amount."
  amount_to_pay:
    lineage:
      - datalake_collections_quintoandar.installment.amount_to_pay
    description: "The final total amount that needs to be paid for this installment, after all calculations (fees, discounts)."
  paid_amount:
    lineage:
      - datalake_collections_quintoandar.installment.paid_amount
      - datalake_nexxera.cnab_charges_recupera.net_amount
      - datalake_collections_quintoandar.installment.installment_status
    description: "The actual amount that has been paid for this installment."
  dt_creation:
    lineage:
      - datalake_collections_quintoandar.installment.dt_creation
    description: "The date when this installment record was created."
  dt_due:
    lineage:
      - datalake_collections_quintoandar.installment.dt_due
      - datalake_nexxera.cnab_charges_recupera.dt_due
    description: "The official due date for this installment."
  dt_paid:
    lineage:
      - datalake_collections_quintoandar.installment.dt_paid
      - datalake_nexxera.cnab_charges_recupera.dt_occurrence_code
      - datalake_retsuko.invoice.ts_paid
      - datalake_collections_quintoandar.installment.installment_status
    description: "The date when this installment was paid."
  dt_canceled:
    lineage:
      - datalake_collections_quintoandar.installment.dt_canceled
      - datalake_collections_quintoandar.installment.installment_status
    description: "The date when this installment was canceled."
  ts_load:
    description: "Timestamp indicating when this record was loaded or last updated in the table."
