database_name: dw_collection_recovery_quintoandar
table_name: dim_debtor
description: Debtor data
domain: Fintech
owner: ae-finance-fintech@quintoandar.com.br
columns:
  sk_debtor:
    lineage:
      - datalake_recupera_clean.records.id_customer
    description: Customer ID (CPF). Table surrogate key
  customer_name:
    lineage:
      - datalake_recupera_clean.records.customer_name
    description: Customer Name
  creditor:
    lineage:
      - datalake_recupera_clean.operational_records.id_creditor
    description: "Creditor. IQ QuintoAndar, IQ QuintoCred or PP QuintoAndar"
  distribution:
    lineage:
      - datalake_recupera_clean.operational_records.id_distribution
    description: Distribution ID from which the customer was retrieved
  operator:
    lineage:
      - datalake_recupera_clean.operational_records.id_operator
    description: Operator who made the last contact
  advisory:
    lineage:
      - datalake_recupera_clean.operational_records.advisory_code
    description: "Current Advisory to whom the debt was distributed. Read more about it at https://drive.google.com/drive/folders/16D-Vlq_rpJS6UcopwysJGcWtEU_h-fHY?usp=drive_link"
    categories:
      QPASCHWS: Assessoria Paschoalotto, Operação de Cobrança QuintoAndar
      V5IAFWS: Assessoria IAF, Operação de Cobrança QuintoCred para Credor 5 (Plataforma 3.0)
      V5PASCHW: Assessoria Paschoalotto, Operação de Cobrança QuintoCred para Credor 5 (Plataforma 3.0)
      VPASCHWS: Assessoria Paschoalotto, Operação de Cobrança QuintoCred para Credor 3 (Plataforma 2.0)
      VIAFWS: Assessoria IAF, Operação de Cobrança QuintoCred para Credor 3 (Plataforma 2.0)
  distributor:
    lineage:
      - datalake_recupera_clean.operational_records.distributor_code
    description: Current Distributor responsible for the debt. Get the updates list and more details at https://drive.google.com/drive/folders/1RRgiOjAVyo_Nv2okeKOfM_Z0KZzliCcG?usp=drive_link
  status:
    lineage:
      - datalake_recupera_clean.status.status_description
    description: Debt status
  distribution_phase:
    lineage:
      - datalake_recupera_clean.operational_records.distribution_phase
    description: Number of the distribution phase in which the customer is
  type_boleto_delivery:
    lineage:
      - datalake_recupera_clean.records.type_boleto_delivery
    description: Indicates the type of invoice delivery to customer.
  dt_customer_registration:
    lineage:
      - datalake_recupera_clean.records.dt_customer_registration
    description: Customer registration date in the system
  ts_load:
    description: "Timestamp of when the data was inserted into the table"
