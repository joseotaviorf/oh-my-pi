database_name: dw_collection_recovery_quintoandar
table_name: fact_collection
domain: Fintech
owner: juliana.hocihara@quintoandar.com.br
description: "This table contain events of interaction in the collections journey between BPOs and the debtors"
columns:
  sk_collection:
    lineage:
      - datalake_cyber.collection.id_customer
      - datalake_cyber.collection.id_contract_external
      - datalake_cyber.collection.creditor
      - datalake_cyber.collection.id_operator
      - datalake_cyber.collection.action
      - datalake_cyber.collection.ts_occurrence
      - datalake_recupera.collection.id_customer
      - datalake_recupera.collection.id_contract
      - datalake_recupera.collection.id_creditor
      - datalake_recupera.collection.operator_name
      - datalake_recupera.collection.id_occurrence
      - datalake_recupera.collection.ts_occurrence
    description: "Surrogate key of the collection action. It is a unique hash generated from customer ID, contract ID, creditor, operator ID, action, and occurrence date to ensure uniqueness."
  sk_debtor:
    lineage:
      - datalake_cyber.collection.id_customer
      - datalake_recupera.collection.id_customer
    description: "Customer document (CPF). Foreign key to `dim_debtor` table."
  sk_contract:
    lineage:
      - datalake_cyber.collection.id_contract_external
      - datalake_recupera.collection.id_contract
    description: "Contract ID related to the collection action."
  sk_operator:
    lineage:
      - datalake_cyber.collection.id_operator
      - datalake_recupera.collection.operator_name
    description: "The ID of the operator who performed the collection occurrence. Foreign key to `dim_operator` table (implicit)."
  operator_agency:
    lineage:
      - datalake_cyber.collection.operator_agency
      - datalake_recupera.collection.operator_name
      - datalake_recupera_clean.operators.id_operator_registration
    description: "The registration code or agency associated with the operator"
  source:
    lineage:
      - datalake_cyber.collection
      - datalake_recupera.collection
    description: "The source system from which the collection data originated ('Cyber' or 'Recupera')."
  action:
    lineage:
      - datalake_cyber.collection.action
      - datalake_recupera.collection.id_occurrence
    description: "The primary action performed during the collection attempt."
  action_code_type:
    lineage:
      - datalake_cyber.collection.action_code_type
    description: "The type code of the collection action, specific to the 'Cyber' source."
  action_description:
    lineage:
      - datalake_cyber.collection.action_description
      - datalake_recupera.collection.occurrence
    description: "A descriptive text for the collection action (e.g., ACORDO PARCELADO, EM NEGOCIACAO)."
  result:
    lineage:
      - datalake_cyber.collection.result
    description: "The result of the collection action, specific to the 'Cyber' source."
  result_code_type:
    lineage:
      - datalake_cyber.collection.result_code_type
    description: "The type code of the collection result, specific to the 'Cyber' source."
  result_description:
    lineage:
      - datalake_cyber.collection.result_description
    description: "A descriptive text for the collection result, specific to the 'Cyber' source."
  complement:
    lineage:
      - datalake_cyber.collection.complement
    description: "Complementary information for the collection action, specific to the 'Cyber' source."
  complement_code_type:
    lineage:
      - datalake_cyber.collection.complement_code_type
    description: "The type code of the complement information, specific to the 'Cyber' source."
  complement_description:
    lineage:
      - datalake_cyber.collection.complement_description
    description: "A descriptive text for the complement information, specific to the 'Cyber' source."
  total_esforco:
    lineage:
      - datalake_cyber.collection.esforco
      - datalake_recupera.collection.esforco
    description: "Total number of dialer attempts made during collection for a specific occurrence. Used to calculate the spin rate."
  total_alo:
    lineage:
      - datalake_cyber.collection.alo
      - datalake_recupera.collection.alo
    description: |
      Total number of times a call was answered (by the correct person or not) at the contact provided by the debtor.
  total_cpc:
    lineage:
      - datalake_cyber.collection.cpc
      - datalake_recupera.collection.cpc
    description: |
      Total number of times the operator successfully contacted the correct person.
  total_promisse:
    lineage:
      - datalake_cyber.collection.promessa
      - datalake_recupera.collection.promisse
    description: |
      Total number of times the debtor made a promise to pay the debt.
  total_agreement:
    lineage:
      - datalake_cyber.collection.promessa
      - datalake_recupera.collection.agreement
    description: |
      Total number of times an agreement/negotiation was created.
  total_failure:
    lineage:
      - datalake_recupera.collection.failure
    description: |
      Total number of times an error occurred during the collection attempt (e.g., call failures).
      Occurrence IDs typically categorized as 'insucesso': CLNLOCAL, NATENDE, OCUPADO, FAX, LIGAMUDA, QUEDALIG.
  dt_occurrence:
    lineage:
      - datalake_cyber.collection.ts_occurrence
      - datalake_recupera.collection.ts_occurrence
    description: "The date when the collection occurrence happened."
  year:
    lineage:
      - datalake_cyber.collection.ts_occurrence
      - datalake_recupera.collection.ts_occurrence
    description: "The year of the collection occurrence."
  month:
    lineage:
      - datalake_cyber.collection.ts_occurrence
      - datalake_recupera.collection.ts_occurrence
    description: "The month of the collection occurrence."
  day:
    lineage:
      - datalake_cyber.collection.ts_occurrence
      - datalake_recupera.collection.ts_occurrence
    description: "The day of the collection occurrence."
  ts_load:
    description: "Timestamp indicating when this record was loaded or last updated in the table."
  creditor:
    lineage: []
    description: Debt collection attribute describing creditor for recovery workflow tracking.
