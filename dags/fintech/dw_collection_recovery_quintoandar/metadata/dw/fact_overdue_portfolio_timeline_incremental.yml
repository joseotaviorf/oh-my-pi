database_name: dw_collection_recovery_quintoandar
table_name: fact_overdue_portfolio_timeline_incremental
domain: Fintech
owner: juliana.hocihara@quintoandar.com.br
description: The table contains information about the portfolio of overdue
  invoices. The invoice is inserted into the table 1 day after its due date, and
  it's replicated every day until last day of the month in which  the debt is paid or written down.
  This table is a mirror of the fact_overdue_portfolio_timeline table, but with incremental loading to minimize computing
  Use day, month, year for partition pruning 
columns:
  sk_overdue_portfolio_timeline:
    lineage:
      - datalake_collections_quintoandar.overdue_portfolio_timeline.id_invoice
      - datalake_collections_quintoandar.overdue_portfolio_timeline.id_contract
      - datalake_collections_quintoandar.overdue_portfolio_timeline.dt_reference
    description: "Surrogate key of the table. It is generated by concatenating the
      invoice ID, contract ID, and the reference date (formatted as
      'yyyyMMdd')."
  sk_region:
    lineage:
      - datalake_collections_quintoandar.overdue_portfolio_timeline.id_region
    description: "Region ID associated with the contract."
  sk_contract:
    lineage:
      - datalake_collections_quintoandar.overdue_portfolio_timeline.id_contract
    description: Data warehouse surrogate key for contract used in fintech dimensional joins.
  sk_negotiation:
    lineage:
      - datalake_collections_quintoandar.overdue_portfolio_timeline.payment_status
      - datalake_collections_quintoandar.invoice_portfolio.id_invoice
      - datalake_collections_quintoandar.invoice_portfolio.id_contract
      - datalake_collections_quintoandar.invoice_portfolio.id_negotiation_child
      - dw_collection_recovery_quintoandar.fact_negotiation.sk_negotiation
    description: "Surrogate key of the negotiation. This field is populated if the
      invoice `payment_status` is 'written-down' and there is an associated
      negotiation."
  sk_origin_negotiation:
    lineage:
      - datalake_collections_quintoandar.overdue_portfolio_timeline.invoice_type
      - datalake_collections_quintoandar.overdue_portfolio_timeline.id_contract
      - datalake_collections_quintoandar.overdue_portfolio_timeline.id_negotiation_parent
    description: "Surrogate key for the original negotiation from which an 'extra'
      invoice (installment) originated. This is populated only for 'extra' type
      invoices."
  sk_agency:
    lineage:
      - datalake_collections_quintoandar.overdue_portfolio_timeline.dt_reference
      - datalake_collections_quintoandar.overdue_portfolio_timeline.dt_invoice_paid
      - datalake_collections_quintoandar.overdue_portfolio_timeline.id_agency # From add_all_dimensions
      - datalake_cyber.contract_agency_distribution.id_agency
      - datalake_cyber.contract_agency_distribution.id_contract
      - datalake_cyber.contract_agency_distribution.dt_start_interval
      - datalake_cyber.contract_agency_distribution.dt_end_interval
    description: "Surrogate key for the agency. If the reference date is on or after
      the invoice paid date, it reflects the agency from the 'last valid
      partner' logic; otherwise, it's the agency from the
      `overdue_portfolio_timeline`."
  id_invoice:
    lineage:
      - datalake_collections_quintoandar.overdue_portfolio_timeline.id_invoice
    description: "Surrogate key for identifying an invoice in for rent for a given contract"
  id_proposal:
    lineage:
      - datalake_collections_quintoandar.overdue_portfolio_timeline.id_proposal
    description: "Surrogate key for identifying a proposal in for rent for a given contract"
  negotiation_installment_number:
    lineage:
      - datalake_collections_quintoandar.overdue_portfolio_timeline.invoice_type
      - datalake_collections_quintoandar.overdue_portfolio_timeline.negotiation_installment_number
    description: "The installment number of the negotiation, populated only for
      'extra' type invoices that are part of a negotiation."
  contract_status:
    lineage:
      - datalake_collections_quintoandar.overdue_portfolio_timeline.contract_status
    description: "If a contract is active or ended in a given dt_reference of the timeline"
  invoice_type:
    lineage:
      - datalake_collections_quintoandar.overdue_portfolio_timeline.invoice_type
    description: "Invoice's type or frequency (e.g., monthly, extra, pos rental,
      onboarding, early termination)."
  payment_status:
    lineage:
      - datalake_collections_quintoandar.overdue_portfolio_timeline.payment_status
    description: "Payment status of the invoice on the reference date."
    categories:
      open: "Invoice is currently open/unpaid."
      paid: "Invoice has been paid."
      written-down: "Invoice has been written down as unrecoverable."
      divergent-payment: "Invoice was paid, but the amount received differs from the due amount."
  reason:
    lineage:
      - datalake_collections_quintoandar.overdue_portfolio_timeline.reason
    description: "Reason for the current state or action related to the invoice."
  paid_via:
    lineage:
      - datalake_collections_quintoandar.overdue_portfolio_timeline.paid_via
    description: "Method by which the invoice was paid (e.g., Pix, Boleto, Credit Card)."
  is_ssn:
    lineage:
      - datalake_collections_quintoandar.overdue_portfolio_timeline.has_app_action_event
      - datalake_collections_quintoandar.overdue_portfolio_timeline.reason
      - datalake_collections_quintoandar.overdue_portfolio_timeline.payment_status
      - negotiation_data.is_ssn_boletao
    description: "Boolean to indicate if the invoice was paid through Self Service
      Negotiation (SSN). This includes cases where an app action event occurred
      and payment was made, or if it was a 'BOSSN' written-down payment."
  recovery_channel:
    lineage:
      - datalake_collections_quintoandar.overdue_portfolio_timeline.recovery_channel
    description: "The channel through which the debt recovery attempt was made."
  debtor_type:
    lineage:
      - datalake_collections_quintoandar.overdue_portfolio_timeline.debtor_type
    description: "Debtor type: Flow or Stock."
    categories:
      Flow: "Customers who are new to the portfolio. The day they enter is the first
        day of overdue (first business day after due date)."
      Stock: "Customers who were already in the portfolio in the last month. Cut-off
        date for this reference is the first day of the month."
  delay_contamined_at_closure:
    lineage:
      - datalake_collections_quintoandar.overdue_portfolio_timeline.delay_contamined_at_closure
    description: "Delay (in days) at the time of closure, which helps define the
      `delay_contract_range` and `delay_contamined_range`."
  delay_contamined_range:
    lineage:
      - datalake_collections_quintoandar.overdue_portfolio_timeline.delay_contamined_range
    description: "Range indicating the delay (in days) based on the contract's
      overall overdue status, not just individual invoices."
  delay_contract_range:
    lineage:
      - datalake_collections_quintoandar.overdue_portfolio_timeline.delay_contract_range
    description: "Same delay range as `delay_contamined_range`, used for PDD
      (Provision for Doubtful Debts) calculations. It is based on the contract's
      delay."
  delay_invoice_at_reference:
    lineage:
      - datalake_collections_quintoandar.overdue_portfolio_timeline.delay_invoice_at_reference
    description: "Delay (in days) of the specific invoice at the given reference date."
  delay_first_payment_default:
    lineage:
      - datalake_collections_quintoandar.overdue_portfolio_timeline.delay_first_payment_default
    description: "Delay (in days) since the first payment default occurred for the
      contract."
  contract_overdue_invoices:
    lineage:
      - datalake_collections_quintoandar.overdue_portfolio_timeline.contract_overdue_invoices
    description: "Total number of overdue invoices for a given contract on the
      reference date."
  due_amount:
    lineage:
      - datalake_collections_quintoandar.overdue_portfolio_timeline.due_amount
    description: "The original due amount of the invoice."
  paid_amount:
    lineage:
      - datalake_collections_quintoandar.overdue_portfolio_timeline.paid_amount
    description: "The amount that has been paid for the invoice."
  recovered_amount:
    lineage:
      - datalake_collections_quintoandar.overdue_portfolio_timeline.recovered_amount
    description: "The gross amount recovered for the invoice between the start of
      the reference month and the reference date."
  net_recovered_amount:
    lineage:
      - datalake_collections_quintoandar.overdue_portfolio_timeline.payment_status
      - datalake_collections_quintoandar.overdue_portfolio_timeline.recovered_amount
      - dw_collection_recovery_quintoandar.fact_negotiation.net_paid_amount
      - dw_collection_recovery_quintoandar.fact_negotiation.original_debt_amount
      - datalake_collections_quintoandar.invoice_portfolio.id_invoice
      - datalake_collections_quintoandar.invoice_portfolio.id_contract
      - datalake_collections_quintoandar.invoice_portfolio.id_negotiation_child
    description: "The net amount recovered for the invoice. This accounts for the
      negotiation's net rate if the invoice was written down and part of a
      negotiation."
  contract_debt:
    lineage:
      - datalake_collections_quintoandar.overdue_portfolio_timeline.contract_debt
    description: "The total outstanding debt for the contract on the reference date."
  business_day:
    lineage:
      - datalake_collections_quintoandar.overdue_portfolio_timeline.business_day
    description: "The count of working days accumulated up to the reference date."
  is_last_business_days:
    lineage:
      - datalake_collections_quintoandar.overdue_portfolio_timeline.is_last_business_days
    description: "Boolean indicating if this is the most recent record among those
      with the same business day, invoice, and month, used for deduplication per
      business day."
  is_write_off:
    lineage:
      - datalake_collections_quintoandar.overdue_portfolio_timeline.is_write_off
    description: "Boolean indicating if the invoice has been written off."
  is_contract_write_off:
    lineage:
      - datalake_collections_quintoandar.overdue_portfolio_timeline.is_contract_write_off
    description: "Boolean indicating if the entire contract has been written off."
  is_first_payment_default:
    lineage:
      - datalake_collections_quintoandar.overdue_portfolio_timeline.is_first_payment_default
    description: "Boolean indicating if this invoice represents the first payment
      default for the contract."
  has_app_action_event:
    description: "Boolean to indicate if there was an app action event (e.g.,
      opening the app, viewing contract/invoice page) within 5 days before the
      invoice payment date."
    lineage:
      - datalake_collections_quintoandar.overdue_portfolio_timeline.has_app_action_event
  advisory:
    lineage:
      - datalake_collections_quintoandar.overdue_portfolio_timeline.dt_reference
      - datalake_collections_quintoandar.overdue_portfolio_timeline.dt_invoice_paid
      - datalake_recupera.contract_advisory_distribution.partner
      - datalake_recupera.contract_advisory_distribution.id_contract
      - datalake_recupera.contract_advisory_distribution.dt_snapshot
      - datalake_cyber.contract_agency_distribution.main_agency_name
      - datalake_cyber.contract_agency_distribution.id_contract
      - datalake_cyber.contract_agency_distribution.dt_start_interval
      - datalake_cyber.contract_agency_distribution.dt_end_interval
    description: "The name of the advisory firm responsible for the contract on the
      reference date. Uses a fallback logic based on Cyber agencies and Recupera
      partners, prioritized by date."
  segmentation_queue:
    lineage:
      - datalake_collections_quintoandar.overdue_portfolio_timeline.dt_reference
      - datalake_collections_quintoandar.overdue_portfolio_timeline.dt_invoice_paid
      - datalake_cyber.queue_timeline.segmentation_queue
      - datalake_cyber.queue_timeline.id_contract_external
    description: "The ID of the segmentation queue the contract belonged to on the
      reference date. If the reference date is on or after the invoice paid
      date, it reflects the queue from the 'last valid partner' logic."
  segmentation_queue_description:
    lineage:
      - datalake_collections_quintoandar.overdue_portfolio_timeline.dt_reference
      - datalake_collections_quintoandar.overdue_portfolio_timeline.dt_invoice_paid
      - datalake_cyber.queue_timeline.segmentation_queue_description
      - datalake_cyber.queue_timeline.id_contract_external
    description: "Description of the segmentation queue the contract belonged to on
      the reference date. If the reference date is on or after the invoice paid
      date, it reflects the description from the 'last valid partner' logic."
  agreement_queue:
    lineage:
      - datalake_collections_quintoandar.overdue_portfolio_timeline.dt_reference
      - datalake_collections_quintoandar.overdue_portfolio_timeline.dt_invoice_paid
      - datalake_cyber.queue_timeline.agreement_queue
      - datalake_cyber.queue_timeline.id_contract_external
    description: "The ID of the agreement queue the contract belonged to on the
      reference date. If the reference date is on or after the invoice paid
      date, it reflects the queue from the 'last valid partner' logic."
  agreement_queue_description:
    lineage:
      - datalake_collections_quintoandar.overdue_portfolio_timeline.dt_reference
      - datalake_collections_quintoandar.overdue_portfolio_timeline.dt_invoice_paid
      - datalake_cyber.queue_timeline.agreement_queue_description
      - datalake_cyber.queue_timeline.id_contract_external
    description: "Description of the agreement queue the contract belonged to on the
      reference date. If the reference date is on or after the invoice paid
      date, it reflects the description from the 'last valid partner' logic."
  eviction_queue:
    lineage:
      - datalake_collections_quintoandar.overdue_portfolio_timeline.dt_reference
      - datalake_collections_quintoandar.overdue_portfolio_timeline.dt_invoice_paid
      - datalake_cyber.queue_timeline.eviction_queue
      - datalake_cyber.queue_timeline.id_contract_external
    description: "The ID of the eviction queue the contract belonged to on the
      reference date. If the reference date is on or after the invoice paid
      date, it reflects the queue from the 'last valid partner' logic."
  eviction_queue_description:
    lineage:
      - datalake_collections_quintoandar.overdue_portfolio_timeline.dt_reference
      - datalake_collections_quintoandar.overdue_portfolio_timeline.dt_invoice_paid
      - datalake_cyber.queue_timeline.eviction_queue_description
      - datalake_cyber.queue_timeline.id_contract_external
    description: "Description of the eviction queue the contract belonged to on the
      reference date. If the reference date is on or after the invoice paid
      date, it reflects the description from the 'last valid partner' logic."
  is_most_recent_record_month:
    lineage:
      - datalake_collections_quintoandar.overdue_portfolio_timeline.id_contract
      - datalake_collections_quintoandar.overdue_portfolio_timeline.id_invoice
      - datalake_collections_quintoandar.overdue_portfolio_timeline.dt_month_start
      - datalake_collections_quintoandar.overdue_portfolio_timeline.dt_reference
    description: "Boolean to indicate if the invoice record is the most recent (last
      `dt_reference`) within its contract, invoice, and month (`dt_month_start`)
      combination. Used for deduplication."
  dt_invoice_paid:
    lineage:
      - datalake_collections_quintoandar.overdue_portfolio_timeline.dt_invoice_paid
    description: "The date when the invoice was paid."
  dt_invoice_due:
    lineage:
      - datalake_collections_quintoandar.overdue_portfolio_timeline.dt_invoice_due
    description: "The original due date of the invoice."
  dt_invoice_due_adjust:
    lineage:
      - datalake_collections_quintoandar.overdue_portfolio_timeline.dt_invoice_due_adjust
    description: "The invoice due date adjusted to the next business day, if applicable."
  dt_write_off:
    lineage:
      - datalake_collections_quintoandar.overdue_portfolio_timeline.dt_write_off
    description: "The date when the invoice was written off as unrecoverable."
  dt_month_start:
    lineage:
      - datalake_collections_quintoandar.overdue_portfolio_timeline.dt_month_start
    description: "The first day of the month corresponding to the `dt_reference`."
  dt_month_end:
    lineage:
      - datalake_collections_quintoandar.overdue_portfolio_timeline.dt_month_end
    description: "The last day of the month corresponding to the `dt_reference`."
  dt_reference:
    lineage:
      - datalake_collections_quintoandar.overdue_portfolio_timeline.dt_reference
    description: "The daily reference date for the overdue portfolio snapshot."
  year:
    lineage:
      - datalake_collections_quintoandar.overdue_portfolio_timeline.dt_reference
    description: "The year corresponding to the `dt_reference`."
  month:
    lineage:
      - datalake_collections_quintoandar.overdue_portfolio_timeline.dt_reference
    description: "The month corresponding to the `dt_reference`."
  day:
    lineage:
      - datalake_collections_quintoandar.overdue_portfolio_timeline.dt_reference
    description: "The day corresponding to the `dt_reference`."
  ts_load:
    description: "Timestamp indicating when the record was loaded into this table."
