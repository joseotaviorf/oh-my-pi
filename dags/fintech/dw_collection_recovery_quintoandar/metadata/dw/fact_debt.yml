database_name: dw_collection_recovery_quintoandar
table_name: fact_debt
domain: Fintech
owner: ae-finance-fintech@quintoandar.com.br
description: |
  It contains information about the debts negotiated, in granularity of invoice per contract, i.e, which invoices have been negotiated, even if the invoice has not yet expired.
  An invoice can have 1 or more negotiations, in case of a broken negotiation (i.e a promisse not paid). 1 negotiation can include 1 or more invoices (from seu barriga).
  If an extra invoice (installment of a negotiation) is overdue, it will also be registered in this table.
columns:
  sk_debt:
    lineage:
      - debts.id_contract
      - debts.id_invoice
      - retsuko.id_contract
    description: "Surrogate key of the debt, formed by concatenating the contract ID and invoice ID. This serves as the table's primary key."
  id_contract:
    lineage:
      - debts.id_contract
      - retsuko.id_contract
      - datalake_debt_recovery.debt.id_contract
      - datalake_recupera_clean.creditor_pending.id_contract
      - datalake_recupera_clean.complementary_records.id_contract
      - datalake_recupera_clean.complementary_records_written_down.id_contract
      - datalake_cyber.debt_negotiated.id_contract
      - datalake_retsuko.invoice.id_contract_external
    description: "The unique identifier for the contract associated with the debt."
  id_invoice:
    lineage:
      - debts.id_invoice
      - retsuko.id_invoice
      - datalake_debt_recovery.debt.id_invoice
      - datalake_recupera_clean.creditor_pending.id_installment
      - datalake_recupera_clean.complementary_records.id_installment
      - datalake_recupera_clean.complementary_records_written_down.id_installment
      - datalake_cyber.debt_negotiated.id_invoice
      - datalake_retsuko.invoice.id_external
    description: "When on QuintoAndar, this is the SeuBarriga original invoice ID."
  creditor:
    lineage:
      - debts.creditor
      - retsuko.creditor
      - datalake_debt_recovery.debt.debtor
      - datalake_recupera_clean.creditor_pending.id_creditor
      - datalake_recupera_clean.complementary_records.id_creditor
      - datalake_recupera_clean.complementary_records_written_down.id_creditor
      - datalake_cyber.debt_negotiated.creditor
      - datalake_retsuko.invoice_info.invoice_user
    description: "The creditor for this debt (e.g., IQ QuintoAndar, PP QuintoAndar)."
  payment_status:
    lineage:
      - retsuko.payment_status
      - datalake_retsuko.invoice.payment_status
    description: "Retsuko's payment status for the invoice."
  invoice_status:
    lineage:
      - debts.invoice_status
      - retsuko.invoice_status
      - datalake_debt_recovery.debt.external_status
      - datalake_cyber.debt_negotiated.invoice_status
      - datalake_retsuko.invoice.status
    description: "The current status of the invoice. For QuintoAndar, it's Retsuko's invoice status."
    categories:
      open: "QuintoAndar - Invoice is open."
      paid: "QuintoAndar - Invoice has been paid."
      written-down: "QuintoAndar - Invoice has been written down."
      canceled: "QuintoAndar - Invoice has been canceled."
      not-payable: "QuintoAndar - Zero-value invoice (due-amount=0) that behaves as open but cannot be charged or transferred."
      divergent-payment: "QuintoAndar - Invoice paid with an amount different from its value."
  sub_status:
    lineage:
      - retsuko.sub_status
      - datalake_debt_recovery.debt.external_sub_status
      - datalake_retsuko.invoice.substatus
    description: "Retsuko's current invoice sub-status."
    categories:
      debt: "Indicates the invoice is an active debt."
      ongoing-negotiation: "Indicates there is an active negotiation for this invoice."
      none: "No specific sub-status."
  due_amount:
    lineage:
      - debts.due_amount
      - retsuko.due_amount
      - datalake_debt_recovery.debt.due_amount
      - datalake_cyber.debt_negotiated.due_amount
      - datalake_retsuko.invoice.due_amount
    description: "The original due amount of the invoice."
  interest_fee_amount:
    lineage:
      - debts.interest_fee_amount
      - datalake_debt_recovery.debt.interest_fee_amount
      - datalake_cyber.debt_negotiated.interest_fee_amount
    description: "The interest fee amount (juros) applied to the debt."
  fine_fee_amount:
    lineage:
      - debts.fine_fee_amount
      - datalake_debt_recovery.debt.fine_fee_amount
      - datalake_cyber.debt_negotiated.fine_fee_amount
    description: "The fine fee amount (multa) applied to the debt."
  discount_amount:
    lineage:
      - debts.discount_amount
      - datalake_debt_recovery.debt.discount_amount
    description: "The total discount amount applied to the debt."
  debt_amount:
    lineage:
      - debts.debt_amount
      - datalake_debt_recovery.debt.debt_amount
      - datalake_cyber.debt_negotiated.debt_amount
    description: "The total debt amount, calculated as `due_amount` + `interest_fee_amount` + `fine_fee_amount` - `discount_amount`."
  paid_amount:
    lineage:
      - debts.paid_amount
      - retsuko.paid_amount
      - datalake_debt_recovery.debt.paid_amount
      - datalake_retsuko.invoice.paid_amount
    description: "The total amount that has been paid for this invoice. This field is populated when the original invoice is paid or its status is 'written-down' with an associated negotiation."
  source:
    lineage:
      - debts.source
      - retsuko.source
      - datalake_debt_recovery.debt.source
      - datalake_recupera_clean.creditor_pending.id_creditor
      - datalake_recupera_clean.complementary_records.id_creditor
      - datalake_recupera_clean.complementary_records_written_down.id_creditor
      - datalake_cyber.debt_negotiated.source
      - datalake_retsuko.invoice.id_external
    description: "The primary source system where the debt information originates (e.g., 'Trato Feito', 'Cyber', 'Recupera', 'Retsuko', or a combination if sourced from multiple)."
  dt_due:
    lineage:
      - debts.dt_due
      - retsuko.dt_due
      - datalake_debt_recovery.debt.dt_due
      - datalake_cyber.debt_negotiated.dt_invoice_due
      - datalake_retsuko.invoice.ts_due
    description: "The original due date of the invoice."
  dt_paid:
    lineage:
      - debts.dt_paid
      - retsuko.dt_paid
      - datalake_debt_recovery.debt.dt_paid
      - datalake_retsuko.invoice.ts_paid
    description: "The date when the invoice was paid. This field is populated for rows where the original invoice is paid or its status is 'written-down' with an associated negotiation."
  ts_load:
    description: "Timestamp indicating when this record was loaded or last updated in the table."
