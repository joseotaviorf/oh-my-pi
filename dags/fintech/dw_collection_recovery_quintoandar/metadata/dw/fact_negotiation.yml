database_name: dw_collection_recovery_quintoandar
table_name: fact_negotiation
description: Negotiations of Debt Recovery
domain: Fintech
owner: ae-finance-fintech@quintoandar.com.br
columns:
  sk_negotiation:
    lineage:
      - datalake_recupera.negotiation.id_negotiation
      - datalake_debt_recovery.negotiation.id_negotiation
    description: "Recupera negotiation ID. Table surrogate key"
  sk_debtor:
    lineage:
      - datalake_recupera.negotiation.customer_document
    description: "Document (CPF) of the debtor. Foreign key to fact_negotiation"
  id_negotiation_trato_feito:
    lineage:
      - datalake_debt_recovery.negotiation.id_negotiation
    description: "Trato-Feito negotiation ID"
  id_negotiation_external:
    lineage:
      - datalake_recupera.negotiation.id_negotiation
    description: "Recupera negotiation ID"
  id_contract:
    lineage:
      - datalake_debt_recovery.negotiation.id_contract
      - datalake_recupera.negotiation.id_contract
    description: "Contract ID"
  id_operator:
    lineage:
      - datalake_recupera.negotiation.id_operator
    description: "Operator that made the negotiation"
  creditor:
    lineage:
      - datalake_recupera.negotiation.id_creditor
      - datalake_debt_recovery.negotiation.debtor
    description: "Creditor. IQ QuintoAndar, IQ QuintoCred or PP QuintoAndar"
  is_invalid_negotiation:
    lineage:
      - datalake_recupera.negotiation.id_contract
    description: Indicates if the negotiation is invalid
  invalid_reason:
    lineage:
      - datalake_recupera.negotiation.id_contract
    description: The reason for the negotiation being invalid
  agreement_type:
    lineage:
      - datalake_recupera.negotiation.agreement_type
    description: "The type of the agreement, see options for more context"
    categories:
      Em assessoria por um operador interno: Customer appears in the advisory portfolio, but the agreement was made internally (internal collection operation, access to the self-negotiation portal, campaign letter [boletagem])
      Em assessoria por um operador de assessoria: Agreement generated by the advisory, through its various channels
      Fora de assessoria: Customer is not included in the advisory portfolio, agreement generated internally
  advisory:
    lineage:
      - datalake_recupera.negotiation.advisory
    description: "Advisory code that was responsible for the negotiation"
    categories:
      QPASCHWS: Paschoalotto, QuintoAndar Collection Operation
      V5PASCHW: Paschoalotto, QuintoCred Collection Operation for Creditor 5 (Plataform 3.0)
      VPASCHWS: Paschoalotto, QuintoCred Collection Operation for Creditor 3 (Plataform 2.0)
      V5IAFWS: IAF, QuintoCred Collection Operation for Creditor 5 (Plataform 3.0)
      VIAFWS: IAF, QuintoCred Collection Operation for Creditor 3 (Plataform 2.0)
  origin_agreement:
    lineage:
      - datalake_recupera.negotiation.origin_agreement
    description: "Origin of the agreement"
    categories:
      Assessoria: "Advisory"
      Carta_Campanha: "These are agreements that are paid in installments through bank slips (boletos)"
      Portal_Autonegociação: ""
      Operador: "Internal collection operator"
  campaign_code:
    lineage:
      - datalake_recupera.negotiation.campaign_code
    description: "Campaign code. It is filled out if the origin_agreement value is Carta_Campanha"
  is_recurrent_debtor:
    lineage:
      - datalake_debt_recovery.negotiation.is_contract_recurrent_debtor
    description: "Boolean that indicates whether the contract already had other debts or not."
  negotiation_status:
    lineage:
      - datalake_debt_recovery.negotiation.status
    description: "Trato Feito negotiation status"
    categories:
      broken: "When one installment of a negotiation is not paid, but the first installment was paid, the negotiation is considered broken and the unpaid installments become bills"
      finished: "All negotiation installments have been paid. If a negotiation has only 1 installment, the status changes directly from started to finished (it will never be offset)."
      ignored: "Exception case, the negotiation was manually ignored."
      offset: "If a negotiation has more than 1 installment, when the first one is paid the status changes from started to offset (compensadas)."
      started: "There was a successful call to create a negotiation and it is registered in the database."
      invalid: "When Recupera sends the negotiations, but an inconsistency is found, the status is changed to invalid and manual processing is required. Example of inconsistency: the original invoice included in the agreement is no longer available on SeuBarriga"
      canceled: "When none of the installment of a negotiation is paid, the status changes from started to canceled."
      failed: "Internal processing error. Intermediate state for unexpected errors, for example SeuBarriga is down, but theoretically the negotiation should leave this state after the next attempt"
  negotiation_classification:
    lineage:
      - datalake_trato_feito_clean.debt.id_external
      - datalake_recupera.negotiation.number_of_installments
      - datalake_debt_recovery.negotiation.status
    description: "Negotiation Classification based on the negotiation status, number of original invoices negotiated and the total installments created in the negotiation"
    categories:
      ACORDO: When the total invoices negotiated >=1  and the number of created installmente > 1
      QUITAÇÃO: When the total invoices negotiated > 1  and the number of created installmente = 1
      SUBSTITUIÇÃO: When the total invoices negotiated = 1  and the number of created installmente = 1
      PROMESSA QUEBRADA: When the negotiation status is canceled, i.e, the first installment is overdue and none of the installments have been paid.
      PROMESSA: When the negotiation status is started, i.e, the first installment isn't overdue yet and none of the installment have been paid.
  agreement_promise:
    lineage:
      - datalake_recupera.negotiation.agreement_promise
    description: "Promisse agreement. It can be 'acordo' or 'promessa'."
  promisse_payment_method:
    lineage:
      - datalake_recupera.negotiation.promisse_payment_method
    description: "Type of promise to pay. It can be cartão, boleto or pix."
  agreement_in_delay:
    lineage:
      - datalake_recupera.negotiation.agreement_in_delay
    description: "Delayed agreement"
  is_down_payment_paid:
    lineage:
      - datalake_recupera.negotiation.down_payment
    description: "Indicates if the first installment (entry) of the negotiation was paid."
  is_renegotiation:
    lineage:
      - datalake_debt_recovery.negotiation.is_renegotiation
    description: "Boolean to indicate if the negotiation is a renegotiation, i.e, there was a previous negotiation"
  is_ssn:
    lineage:
      - datalake_debt_recovery.negotiation.collector
    description: "Boolean to indicate if the negotiation is an SSN - Self Service Negotiation. It it also known by data team as BOSSN (boletão)"
  has_been_renegotiated:
    lineage:
      - datalake_trato_feito_clean.debt.id_negotiation
    description: "Boolean to indicate if the negotiation has already being renegotiated after the negotiation was broken or canceled"
  delay_contamined_range:
    lineage:
      - datalake_debt_recovery.negotiation.ts_created_at
      - datalake_recupera.negotiation.dt_promisse
      - datalake_trato_feito_clean.debt.dt_due
      - datalake_recupera_clean.creditor_pending.dt_installment_due_date
    description: "Delay Contamined Range calculated based on dt_promisse and dt_due_invoice_anchor"
  total_invoices_negotiated:
    lineage:
      - datalake_trato_feito_clean.debt.id_external
      - datalake_recupera_clean.creditor_pending.id_installment
    description: Total of original invoices included in the negotiation
  number_of_installments:
    lineage:
      - datalake_debt_recovery.negotiation.qt_installments
      - datalake_recupera.negotiation.number_of_installments
    description: "Total installment of the negotiation"
  paid_installments:
    lineage:
      - datalake_debt_recovery.negotiation.qt_installments_paid
      - datalake_recupera.negotiation.paid_installments
    description: "Number of paid installments of the negotiation"
  breached_installments:
    lineage:
      - datalake_debt_recovery.negotiation.qt_installments
      - datalake_debt_recovery.negotiation.qt_installments_paid
      - datalake_recupera.negotiation.breached_installments
    description: "Total of negotiation installments broken. Calculation if negotiation status is broken: total installment -  paid installments"
  original_debt_amount:
    lineage:
      - datalake_debt_recovery.negotiation.negotiation_original_amount
      - datalake_recupera.negotiation.original_debt_amount
    description: Original debt amount (Total due amount from Seu Barriga of all invoices negotiated )
  fine_fee_amount:
    lineage:
      - datalake_debt_recovery.negotiation.fine_fee_amount
      - datalake_recupera.negotiation.expense_amount
      - datalake_recupera.negotiation.original_debt_amount
      - datalake_recupera.negotiation.interest_fee_amount
      - datalake_recupera.negotiation.adm_fee_amount
    description: Fine fee amount (multa)
  interest_fee_amount:
    lineage:
      - datalake_debt_recovery.negotiation.interest_fee_amount
      - datalake_recupera.negotiation.interest_fee_amount
    description: Interest fee amount (juros)
  credit_card_fee_amount:
    lineage:
      - datalake_debt_recovery.negotiation.credit_card_fee_amount
      - datalake_recupera.negotiation.adm_fee_amount
    description: Credit card fee amount
  total_debt_amount:
    lineage:
      - datalake_recupera.negotiation.expense_amount
      - datalake_debt_recovery.negotiation.negotiation_original_amount
      - datalake_debt_recovery.negotiation.fine_fee_amount
      - datalake_debt_recovery.negotiation.interest_fee_amount
      - datalake_debt_recovery.negotiation.credit_card_fee_amount
    description: "Total debt amount that is going to be negotiated, i.e, original amount + fees. It ignores the credit card fee"
  total_discount_amount:
    lineage:
      - datalake_debt_recovery.negotiation.negotiation_discount_amount
      - datalake_recupera.negotiation.negotiation_discount_amount
    description: "Discount Amount, considering all fees applied to the negotiation."
  discount_to_fees_amount:
    lineage:
      - datalake_debt_recovery.negotiation.negotiation_discount_amount
      - datalake_recupera.negotiation.negotiation_discount_amount
      - datalake_debt_recovery.negotiation.fine_fee_amount
      - datalake_recupera.negotiation.expense_amount
      - datalake_recupera.negotiation.original_debt_amount
      - datalake_recupera.negotiation.interest_fee_amount
      - datalake_recupera.negotiation.adm_fee_amount
      - datalake_debt_recovery.negotiation.interest_fee_amount
      - datalake_recupera.negotiation.interest_fee_amount
    description: Discount applied to interest fee + fine fee
  discount_to_original_amount:
    lineage:
      - datalake_debt_recovery.negotiation.negotiation_discount_amount
      - datalake_recupera.negotiation.negotiation_discount_amount
      - datalake_debt_recovery.negotiation.fine_fee_amount
      - datalake_recupera.negotiation.expense_amount
      - datalake_recupera.negotiation.original_debt_amount
      - datalake_recupera.negotiation.interest_fee_amount
      - datalake_recupera.negotiation.adm_fee_amount
      - datalake_debt_recovery.negotiation.interest_fee_amount
      - datalake_recupera.negotiation.interest_fee_amount
    description: Discount applied to original (main) amount
  negotiated_amount:
    lineage:
      - datalake_recupera.negotiation.negotiated_amount
      - datalake_debt_recovery.negotiation.total_expected_amount
    description: "Negotiation Amount"
  negotiated_to_be_due_amount:
    lineage:
      - datalake_recupera.negotiation.negotiated_to_be_due_amount
    description: "Negotiation to be due amount, i.e, the sum of due amount of all installments that are open and is not overdue"
  negotiated_overdue_amount:
    lineage:
      - datalake_recupera.negotiation.negotiated_overdue_amount
    description: "Negotiation overdue amount, i.e, the sum of due amount of all installments that are open and is overdue"
  down_payment_amount:
    lineage:
      - datalake_recupera.negotiation.down_payment_amount
    description: "Down Payment (Entry) amount"
  down_payment_amount_without_fees:
    lineage:
      - datalake_recupera.negotiation.down_payment_amount_without_fees
    description: "Down Payment (Entry) amount without fees"
  paid_amount:
    lineage:
      - datalake_debt_recovery.negotiation.paid_amount
      - datalake_recupera.negotiation.total_amount_paid
    description: "Total paid amount"
  total_next_due:
    lineage:
      - datalake_recupera.negotiation.total_next_due
    description: "Total amount on the next due date"
  sla_debt_anchor_to_promisse_payment:
    lineage:
      - datalake_debt_recovery.negotiation.ts_first_payment
      - datalake_recupera.negotiation.dt_down_payment
      - datalake_trato_feito_clean.debt.dt_due
      - datalake_recupera_clean.creditor_pending.dt_installment_due_date
    description: "SLA calculated based on dt_due_invoice_anchor and dt_down_payment"
  sla_promisse_payment_to_negotiation_ending:
    lineage:
      - datalake_debt_recovery.negotiation.ts_first_payment
      - datalake_recupera.negotiation.dt_down_payment
      - datalake_debt_recovery.negotiation.ts_breach
      - datalake_debt_recovery.negotiation.ts_paid_all
      - datalake_recupera.negotiation.dt_cancellation
      - datalake_recupera.negotiation.dt_paid_all
    description: "SLA calculated based on dt_down_payment and dt_ending"
  sla_debt_anchor_to_promisse:
    lineage:
      - datalake_debt_recovery.negotiation.ts_created_at
      - datalake_recupera.negotiation.dt_promisse
      - datalake_trato_feito_clean.debt.dt_due
      - datalake_recupera_clean.creditor_pending.dt_installment_due_date
    description: "SLA calculated based on dt_promisse and dt_due_invoice_anchor"
  dt_due_invoice_anchor:
    lineage:
      - datalake_trato_feito_clean.debt.dt_due
      - datalake_recupera_clean.creditor_pending.dt_installment_due_date
    description: "the due date of the anchor invoice, i.e, the minimum due date of all original invoices included in the negotiation"
  dt_promisse:
    lineage:
      - datalake_debt_recovery.negotiation.ts_created_at
      - datalake_recupera.negotiation.dt_promisse
    description: "Negotiation creation date / promisse date"
  dt_due_promisse:
    lineage:
      - datalake_recupera.negotiation.dt_due_promisse
    description: "Due date of the promisse, i.e, the due date of the first installment of the negotiation"
  dt_cancellation:
    lineage:
      - datalake_debt_recovery.negotiation.ts_breach
      - datalake_recupera.negotiation.dt_cancellation
    description: "Negotiation cancelation date."
  dt_down_payment:
    lineage:
      - datalake_debt_recovery.negotiation.ts_first_payment
      - datalake_recupera.negotiation.dt_down_payment
    description: "First installment payment date"
  dt_next_due:
    lineage:
      - datalake_recupera.negotiation.dt_next_due
    description: "Next due date"
  dt_paid_all_installments:
    lineage:
      - datalake_debt_recovery.negotiation.ts_paid_all
      - datalake_recupera.negotiation.dt_paid_all
    description: "Date when all installment have been paid"
  dt_expected_ending:
    lineage:
      - datalake_debt_recovery.negotiation.dt_expected_end
      - datalake_recupera.negotiation.dt_negotiation_expected_end
    description: "Date expected to finalize the negotiation, i.e, the due date of the last installment"
  dt_ending:
    lineage:
      - datalake_debt_recovery.negotiation.ts_breach
      - datalake_debt_recovery.negotiation.ts_paid_all
      - datalake_recupera.negotiation.dt_cancellation
      - datalake_recupera.negotiation.dt_paid_all
    description: When the negotiation finished. It will happen when all installments has been paid or when the negotiation is canceled.
  ts_load:
    description: "Timestamp of when the data was inserted into the table"
