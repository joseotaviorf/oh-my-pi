database_name: dw_collection_recovery_quintoandar
table_name: fact_negotiation
description: "Table containing of negotiation done in collections for TENANTS in For Rent. A negotiation is the process in which an expired or sum of debts is transformed into new installment by negotiation options"
domain: Fintech
owner: juliana.hocihara@quintoandar.com.br
columns:
  sk_negotiation:
    lineage:
      - datalake_collections_quintoandar.negotiation.id_contract
      - datalake_collections_quintoandar.negotiation.id_negotiation
    description: "Negotiation surrogate key, a unique identifier constructed from the contract ID and negotiation ID."
  sk_contract:
    lineage:
      - datalake_collections_quintoandar.negotiation.id_contract
    description: "Contract surrogate key, representing the unique identifier for the contract involved in the negotiation."
  sk_debtor:
    lineage:
      - datalake_collections_quintoandar.negotiation.id_debtor
    description: "Debtor surrogate key, identifying the unique debtor associated with the negotiation."
  sk_operator:
    lineage:
      - datalake_collections_quintoandar.negotiation.id_operator
      - datalake_paschoalotto_clean.agreement_detail.id_installment
      - datalake_paschoalotto_clean.contract.id_contract
      - datalake_paschoalotto_clean.debt.id_contract_quintoandar
      - datalake_paschoalotto_clean.user.login_name
    description: "Surrogate key for the operator responsible for the negotiation, including specific Paschoalotto operators."
  id_negotiation:
    lineage:
      - datalake_collections_quintoandar.negotiation.id_negotiation
    description: "Unique identifier for the negotiation."
  id_negotiation_trato_feito:
    lineage:
      - datalake_collections_quintoandar.negotiation.id_negotiation_trato_feito
    description: Identifier for the negotiation trato feito referenced by this financial record.
  id_manager_authorized:
    lineage:
      - datalake_collections_quintoandar.negotiation.id_manager_authorized
    description: "Identifier for the manager who authorized the negotiation."
  id_campaign:
    lineage:
      - datalake_collections_quintoandar.negotiation.id_campaign
    description: "Identifier for the campaign associated with the negotiation."
  creditor:
    lineage:
      - datalake_collections_quintoandar.negotiation.creditor
    description: "The creditor involved in the negotiation. Examples include IQ QuintoAndar or PP QuintoAndar."
  source:
    lineage:
      - datalake_collections_quintoandar.negotiation.source
    description: "The source system or origin of the negotiation data."
  is_not_standard_negotiation:
    lineage:
      - datalake_collections_quintoandar.negotiation.is_not_standard_negotiation
    description: "Boolean flag indicating if this is a non-standard negotiation."
  not_standard_reason:
    lineage:
      - datalake_collections_quintoandar.negotiation.not_standard_reason
    description: "The reason provided if the negotiation is categorized as non-standard."
  agreement_type:
    lineage:
      - datalake_collections_quintoandar.negotiation.agreement_type
    description: "The type of the agreement, providing context on how it was established."
    categories:
      Em assessoria por um operador interno: Customer appears in the advisory portfolio, but the agreement was made internally (internal collection operation, access to the self-negotiation portal, campaign letter [boletagem])
      Em assessoria por um operador de assessoria: Agreement generated by the advisory, through its various channels
      Fora de assessoria: Customer is not included in the advisory portfolio, agreement generated internally
  agreement_type_description:
    lineage:
      - datalake_collections_quintoandar.negotiation.agreement_type_description
    description: "Detailed description of the agreement type."
  advisory:
    lineage:
      - datalake_collections_quintoandar.negotiation.advisory
    description: "Advisory code that was responsible for the negotiation."
  origin_agreement:
    lineage:
      - datalake_collections_quintoandar.negotiation.origin_agreement
    description: Debt collection attribute describing origin agreement for recovery workflow tracking.
    categories:
      Assessoria: "Advisory"
      Carta_Campanha: "These are agreements that are paid in installments through bank slips (boletos)"
      Portal_Autonegociação: ""
      Operador: "Internal collection operator"
  campaign_status:
    lineage:
      - datalake_collections_quintoandar.negotiation.campaign_status
    description: "The current status of the campaign related to this negotiation."
  broken_reason:
    lineage:
      - datalake_collections_quintoandar.negotiation.broken_reason
    description: "The reason why the negotiation was broken, if applicable."
  negotiation_status:
    lineage:
      - datalake_collections_quintoandar.negotiation.negotiation_status
    description: "The current status of the negotiation from Trato Feito."
    categories:
      broken: "When one installment of a negotiation is not paid, but the first installment was paid, the negotiation is considered broken and the unpaid installments become bills."
      finished: "All negotiation installments have been paid. If a negotiation has only 1 installment, the status changes directly from started to finished (it will never be offset)."
      ignored: "Exception case, the negotiation was manually ignored."
      offset: "If a negotiation has more than 1 installment, when the first one is paid the status changes from started to offset (compensadas)."
      started: "The client agreed to the debt negotiation but has not yet paid the first installment. This is a temporary status until the first payment is confirmed."
      invalid: "When Recupera sends the negotiations, but an inconsistency is found, the status is changed to invalid and manual processing is required. Example of inconsistency: the original invoice included in the agreement is no longer available on SeuBarriga."
      canceled: "When none of the installment of a negotiation is paid, the status changes from started to canceled."
      failed: "Internal processing error. Intermediate state for unexpected errors, for example SeuBarriga is down, but theoretically the negotiation should leave this state after the next attempt."
      manual-action-required: "Temporary status for negotiations where there was an error processing payments, specifically when the promised first payment (down payment) was not received."
      broken-by-client: "The negotiation was broken due to a request from the client."
  negotiation_classification:
    lineage:
      - datalake_collections_quintoandar.negotiation.negotiation_status
      - dw_collection_recovery_quintoandar.bridge_map_debt_negotiation.sk_negotiation
      - dw_collection_recovery_quintoandar.fact_debt.id_invoice
      - datalake_collections_quintoandar.negotiation.number_of_installments
      - dw_collection_recovery_quintoandar.fact_negotiation_installment.dt_paid
      - datalake_collections_quintoandar.negotiation.dt_down_payment
    description: "Negotiation Classification based on the negotiation status, number of original invoices negotiated, and the total installments created in the negotiation."
    categories:
      ACORDO: "When the total invoices negotiated >=1 and the number of created installments > 1."
      QUITAÇÃO: "When the total invoices negotiated > 1 and the number of created installments = 1."
      SUBSTITUIÇÃO: "When the total invoices negotiated = 1 and the number of created installments = 1."
      PROMESSA QUEBRADA: "When the negotiation status is canceled, meaning the first installment is overdue and none of the installments have been paid."
      PROMESSA: "When the negotiation status is started, meaning the first installment isn't overdue yet and none of the installments have been paid."
  promisse_payment_method:
    lineage:
      - datalake_collections_quintoandar.negotiation.promisse_payment_method
      - dw_collection_recovery_quintoandar.fact_negotiation_installment.payment_method
    description: "Type of promise to pay for the first installment. Can be 'CARTÃO DE CRÉDITO', 'BOLETO', or 'PIX'."
  payment_method:
    lineage:
      - datalake_collections_quintoandar.negotiation.payment_method
    description: "The primary payment method used for the negotiation."
  is_renegotiation:
    lineage:
      - datalake_collections_quintoandar.negotiation.is_renegotiation
    description: "Boolean to indicate if the negotiation is a renegotiation, meaning there was a previous negotiation for the same debt."
  has_been_renegotiated:
    lineage:
      - datalake_debt_recovery.installment.id_negotiation
      - datalake_debt_recovery.installment.id_contract
      - datalake_trato_feito_clean.accounting_installment.id_installment
      - datalake_trato_feito_clean.debt.id_external
    description: "Boolean to indicate if the negotiation has already been renegotiated after the negotiation was broken or canceled."
  delay_contamined_range:
    lineage:
      - datalake_collections_quintoandar.negotiation.dt_promisse
      - dw_collection_recovery_quintoandar.bridge_map_debt_negotiation.sk_negotiation
      - dw_collection_recovery_quintoandar.fact_debt.dt_due
    description: "Delay Contaminated Range, calculated based on the difference between the negotiation promise date and the anchor invoice due date."
  total_invoices_negotiated:
    lineage:
      - dw_collection_recovery_quintoandar.bridge_map_debt_negotiation.sk_negotiation
      - dw_collection_recovery_quintoandar.bridge_map_debt_negotiation.sk_debt
      - dw_collection_recovery_quintoandar.fact_debt.id_invoice
    description: "Total number of original invoices included in the negotiation."
  number_of_installments:
    lineage:
      - datalake_collections_quintoandar.negotiation.number_of_installments
    description: "Total number of installments agreed upon in the negotiation."
  paid_installments:
    lineage:
      - datalake_collections_quintoandar.negotiation.paid_installments
    description: "Number of installments that have been successfully paid for this negotiation."
  breached_installments:
    lineage:
      - datalake_collections_quintoandar.negotiation.breached_installments
    description: "Total number of negotiation installments broken. Calculation if negotiation status is broken: total installment - paid installments."
  original_debt_amount:
    lineage:
      - datalake_collections_quintoandar.negotiation.original_debt_amount
    description: "The original total due amount from Seu Barriga for all invoices included in the negotiation."
  fine_fee_amount:
    lineage:
      - datalake_collections_quintoandar.negotiation.fine_fee_amount
    description: "The amount of the fine fee (multa) applied to the negotiation."
  interest_fee_amount:
    lineage:
      - datalake_collections_quintoandar.negotiation.interest_fee_amount
    description: "The amount of the interest fee (juros) applied to the negotiation."
  credit_card_fee_amount:
    lineage:
      - datalake_collections_quintoandar.negotiation.credit_card_fee_amount
    description: Debt collection attribute describing credit card fee amount for recovery workflow tracking.
  installment_eviction_costs:
    lineage:
      - datalake_collections_quintoandar.negotiation.installment_eviction_costs
    description: "Costs related to eviction included in the installment."
  installment_lawyers_fee:
    lineage:
      - datalake_collections_quintoandar.negotiation.installment_lawyers_fee
    description: "Lawyers' fees included in the installment."
  total_debt_amount:
    lineage:
      - datalake_collections_quintoandar.negotiation.total_debt_amount
    description: "The total debt amount that is going to be negotiated, including original amount, fine fee, and interest fee, but excluding the credit card fee."
  total_discount_amount:
    lineage:
      - datalake_collections_quintoandar.negotiation.total_discount_amount
      - datalake_collections_quintoandar.negotiation.source
      - datalake_collections_quintoandar.negotiation.negotiated_amount
      - datalake_collections_quintoandar.negotiation.total_debt_amount
    description: "The total discount amount applied to the negotiation, considering all fees."
  discount_to_fees_amount:
    lineage:
      - datalake_collections_quintoandar.negotiation.discount_to_fees_amount
      - datalake_collections_quintoandar.negotiation.total_discount_amount
      - datalake_collections_quintoandar.negotiation.fine_fee_amount
      - datalake_collections_quintoandar.negotiation.interest_fee_amount
    description: "The portion of the total discount specifically applied to interest and fine fees."
  discount_to_credit_fee_amount:
    lineage:
      - datalake_collections_quintoandar.negotiation.discount_to_credit_fee_amount
      - datalake_collections_quintoandar.negotiation.credit_card_fee_amount
      - datalake_collections_quintoandar.negotiation.total_discount_amount
      - datalake_collections_quintoandar.negotiation.fine_fee_amount
      - datalake_collections_quintoandar.negotiation.interest_fee_amount
    description: "The portion of the total discount specifically applied to the credit card fee."
  discount_to_original_amount:
    lineage:
      - datalake_collections_quintoandar.negotiation.discount_to_original_amount
      - datalake_collections_quintoandar.negotiation.total_discount_amount
      - datalake_collections_quintoandar.negotiation.fine_fee_amount
      - datalake_collections_quintoandar.negotiation.interest_fee_amount
      - datalake_collections_quintoandar.negotiation.credit_card_fee_amount
    description: "The portion of the total discount specifically applied to the original (main) debt amount."
  negotiated_amount:
    lineage:
      - datalake_collections_quintoandar.negotiation.negotiated_amount
    description: "The final amount agreed upon in the negotiation after all discounts."
  down_payment_original_amount:
    lineage:
      - dw_collection_recovery_quintoandar.fact_negotiation_installment.main_amount
      - datalake_collections_quintoandar.negotiation.down_payment_original_amount
    description: "The original amount of the down payment (first installment) before any discounts."
  down_payment_amount:
    lineage:
      - dw_collection_recovery_quintoandar.fact_negotiation_installment.amount_to_pay
      - datalake_collections_quintoandar.negotiation.down_payment_amount
    description: "The actual amount to be paid for the down payment (first installment) after discounts."
  down_payment_net_amount:
    lineage:
      - dw_collection_recovery_quintoandar.fact_negotiation_installment.net_amount
      - datalake_collections_quintoandar.negotiation.down_payment_net_amount
      - datalake_collections_quintoandar.negotiation.original_debt_amount
      - datalake_collections_quintoandar.negotiation.number_of_installments
      - datalake_collections_quintoandar.negotiation.discount_to_original_amount
    description: "The net amount of the down payment, which is the down payment amount without any fees."
  down_payment_net_amount_paid:
    lineage:
      - dw_collection_recovery_quintoandar.fact_negotiation_installment.net_amount
      - datalake_collections_quintoandar.negotiation.down_payment_net_amount
      - datalake_collections_quintoandar.negotiation.dt_down_payment
      - datalake_collections_quintoandar.negotiation.original_debt_amount
      - datalake_collections_quintoandar.negotiation.number_of_installments
      - datalake_collections_quintoandar.negotiation.discount_to_original_amount
    description: Debt collection attribute describing down payment net amount paid for recovery workflow tracking.
  net_paid_amount:
    lineage:
      - datalake_collections_quintoandar.negotiation.promisse_payment_method
      - datalake_collections_quintoandar.negotiation.number_of_installments
      - datalake_collections_quintoandar.negotiation.dt_down_payment
      - datalake_collections_quintoandar.negotiation.original_debt_amount
      - datalake_collections_quintoandar.negotiation.discount_to_original_amount
      - datalake_collections_quintoandar.negotiation.down_payment_net_amount_paid
    description: "The total net amount paid for the negotiation, considering payment method and installment type."
  paid_amount:
    lineage:
      - datalake_collections_quintoandar.negotiation.paid_amount
    description: "The total cumulative amount paid for all installments of the negotiation."
  dt_due_invoice_anchor:
    lineage:
      - dw_collection_recovery_quintoandar.bridge_map_debt_negotiation.sk_negotiation
      - dw_collection_recovery_quintoandar.bridge_map_debt_negotiation.sk_debt
      - dw_collection_recovery_quintoandar.fact_debt.dt_due
    description: "The due date of the anchor invoice, which is the minimum due date among all original invoices included in the negotiation."
  contact_type:
    lineage:
      - datalake_collections_quintoandar.negotiation.contact_type
    description: "Contact channel used during the negotiation."
  ts_promisse:
    lineage:
      - datalake_collections_quintoandar.negotiation.ts_promisse
    description: "Timestamp when the negotiation promise was made."
  dt_promisse:
    lineage:
      - datalake_collections_quintoandar.negotiation.dt_promisse
      - datalake_paschoalotto_clean.agreement_detail.dt_emission
    description: "The date when the negotiation promise was made or the negotiation was created."
  dt_due_promisse:
    lineage:
      - datalake_collections_quintoandar.negotiation.dt_due_promisse
    description: "The due date of the first installment (promise to pay) of the negotiation."
  dt_cancellation:
    lineage:
      - datalake_collections_quintoandar.negotiation.dt_cancellation
      - datalake_collections_quintoandar.negotiation.negotiation_status
    description: "The date when the negotiation was canceled, if applicable."
  dt_down_payment:
    lineage:
      - datalake_collections_quintoandar.negotiation.dt_down_payment
      - dw_collection_recovery_quintoandar.fact_negotiation_installment.dt_paid
    description: "The date when the first installment (down payment) of the negotiation was paid."
  dt_paid_all_installments:
    lineage:
      - datalake_collections_quintoandar.negotiation.dt_paid_all_installments
    description: "The date when all installments of the negotiation were fully paid."
  dt_expected_ending:
    lineage:
      - datalake_collections_quintoandar.negotiation.dt_expected_ending
    description: "The expected date for the negotiation to be finalized, corresponding to the due date of the last installment."
  dt_ending:
    lineage:
      - datalake_collections_quintoandar.negotiation.dt_paid_all_installments
      - datalake_collections_quintoandar.negotiation.dt_cancellation
    description: "The actual end date of the negotiation, which is either when all installments are paid or when the negotiation is canceled."
  ts_load:
    description: "Timestamp indicating when this record was loaded or last updated in the table."
