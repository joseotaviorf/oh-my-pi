database_name: dw_collection_recovery_quintoandar
table_name: dim_agency
owner: juliana.hocihara@quintoandar.com.br
domain: Fintech
description: Dimension table containing agency and agency group information for collection recovery analysis.
columns:
  sk_agency:
    description: "Surrogate key for the agency, derived directly from the `id_agency` field from the source `agencies` table."
    lineage:
      - datalake_cyber.agencies.id_agency
  sk_main_agency:
    description: "Surrogate key for the main agency within the group, derived from the `id_main_agency` field from the source `agencies` table."
    lineage:
      - datalake_cyber.agencies.id_main_agency
  id_agencies_group:
    description: "Identifier for the group of agencies, which is a sorted array containing all agency IDs belonging to that group."
    lineage:
      - datalake_cyber.agencies.id_agencies_group
  main_agency_name:
    description: "The name of the main agency within the group."
    lineage:
      - datalake_cyber.agencies.main_agency_name
  main_agency_type:
    description: "The type classification of the main agency within the group."
    lineage:
      - datalake_cyber.agencies.main_agency_type
  agencies_name_group:
    description: "A sorted array containing the names of all agencies that are part of this specific group."
    lineage:
      - datalake_cyber.agencies.agencies_name_group
  ts_start:
    description: "Timestamp indicating the start date of the main agency or the agency itself, as recorded in the source system."
    lineage:
      - datalake_cyber.agencies.ts_start
  ts_load:
    description: "Timestamp indicating when the record was loaded into this dimension table. This timestamp reflects the time of ingestion into the data warehouse."
