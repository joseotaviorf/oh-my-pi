      - bridge_map_debt_negotiation
      - fact_debt
      - fact_negotiation_installment
    fact_overdue_portfolio_timeline:
      - bridge_map_debt_negotiation
      - fact_debt
      - fact_negotiation
      - fact_negotiation_installment
    fact_overdue_portfolio_timeline_incremental:
      - bridge_map_debt_negotiation
      - fact_debt
      - fact_negotiation
      - fact_negotiation_installment
    fact_renegotiations:
      - bridge_map_debt_negotiation
      - fact_debt
      - fact_negotiation
      - fact_negotiation_installment
  tables_customization:
