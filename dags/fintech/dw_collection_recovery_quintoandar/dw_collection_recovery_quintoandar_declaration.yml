dag:
  name: dw_collection_recovery_quintoandar
  schedule_start_date: 2023,11,11
  owner: Data Fintech
workflow:
  type: query_delta
  layer: dw
  custom_schema: collection_recovery_quintoandar
  inner_dependencies:
    fact_negotiation:
      - bridge_map_debt_negotiation
      - fact_debt
      - fact_negotiation_installment
    fact_overdue_portfolio_timeline:
      - bridge_map_debt_negotiation
      - fact_debt
      - fact_negotiation
cluster:
  type: custom_cluster
  custom_configurations:
    autotermination_minutes: 20
    driver_node_type_id: r5d.xlarge
    node_type_id: r5d.xlarge
    runtime_engine: PHOTON
    num_workers: 3
    spark_version: 12.2.x-scala2.12
    aws_attributes:
      first_on_demand: 1
      spot_bid_price_percent: 100
      zone_id: us-east-1d
      ebs_volume_size: 200
      availability: SPOT_WITH_FALLBACK
