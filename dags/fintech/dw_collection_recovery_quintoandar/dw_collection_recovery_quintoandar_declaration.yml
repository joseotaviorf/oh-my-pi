dag:
  name: dw_collection_recovery_quintoandar
  schedule_start_date: 2023,11,11
  owner: Data Fintech
workflow:
  type: query_delta
  layer: dw
  custom_schema: collection_recovery_quintoandar
  spark_session_configs:
    udfs: [FINTECH_COLLECTIONS_RENEGOTIATION]
  inner_dependencies:
    fact_negotiation:
      - bridge_map_debt_negotiation
      - fact_debt
      - fact_negotiation_installment
    fact_overdue_portfolio_timeline:
      - bridge_map_debt_negotiation
      - fact_debt
      - fact_negotiation
      - fact_negotiation_installment
    fact_renegotiations:
      - bridge_map_debt_negotiation
      - fact_debt
      - fact_negotiation
      - fact_negotiation_installment
cluster:
  type: custom_cluster
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: "quintoandar_{{ var.value.environment }}"
    autotermination_minutes: 20
    driver_node_type_id: r5d.xlarge
    node_type_id: c4.8xlarge
    num_workers: 3
    spark_version: 13.3.x-scala2.12
    aws_attributes:
      first_on_demand: 1
      spot_bid_price_percent: 100
      zone_id: us-east-1d
      ebs_volume_size: 200
      availability: SPOT_WITH_FALLBACK
  databricks_conn_id: databricks_new
