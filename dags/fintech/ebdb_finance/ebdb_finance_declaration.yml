dag:
  name: ebdb_finance
  schedule_start_date: 2021, 2, 20
  schedule_interval: 10 21,8,12 * * *
  owner: Data Fintech
  documentation:
    dag_purpose: Extraction of EBDB tables related to Finance into data lake. EBDB is the main database for QuintoAndar.
workflow:
  type: cdc
  layer: raw
  database_type: mysql
  source_database: ebdb
  custom_schema: ebdb
  source_schema: ebdb
  tables_customization:
    ContaCorrente:
      clean_table_name: account
    OperacaoContaCorrente:
      clean_table_name: account_transaction
    Banco:
      clean_table_name: bank
    BankAccountValidation:
      clean_table_name: bank_account_validation
    BypassTerm:
      clean_table_name: bypass_term
      clean_primary_keys: ["id"]
    BypassTerm_AUD:
      clean_table_name: bypass_term_aud
      clean_primary_keys: ["id", "rev"]
    FinancialData:
      clean_table_name: financial_data
  extra_query_template_params:
    load_end_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, 1), 'load_end_date') }}"
