database_name: datalake_ebdb_clean
table_name: bypass_term_aud
description: |
  Hibernate Envers audit history of bypass-term records, capturing each insert, update, or
  delete to owner waiver acceptance on the first visit booked (VB). Used to reconstruct when
  an owner signed or changed the bypass term for compliance and dispute investigations.
owner: guilherme.sacramento@quintoandar.com.br
domain: Fintech
columns:
  id:
    description: Surrogate key of the bypass-term record as stored in the audited revision.
    lineage:
      - datalake_ebdb_raw.bypass_term_aud.id
  id_user:
    description: Identifier of the property owner (EBDB user) associated with the audited bypass term.
    lineage:
      - datalake_ebdb_raw.bypass_term_aud.usuario_id
  rev:
    description: Hibernate Envers revision id; join to rev_info for the audit transaction timestamp and actor.
    lineage:
      - datalake_ebdb_raw.bypass_term_aud.REV
  rev_type:
    description: Hibernate Envers revision type indicating whether the audit row captures an insert, update, or delete.
    categories:
      "0" : Create
      "1" : Update
      "2" : Delete
    lineage:
      - datalake_ebdb_raw.bypass_term_aud.REVTYPE
  confirmation_code:
    description: Confirmation token stored on the bypass term at the time of this audit revision.
    lineage:
      - datalake_ebdb_raw.bypass_term_aud.confirmation_code
  mod_id_user:
    description: Flag indicating whether the owner user identifier changed in this audit revision.
    lineage:
      - datalake_ebdb_raw.bypass_term_aud.usuario_id_MOD
  mod_confirmation_code:
    description: Flag indicating whether the confirmation code changed in this audit revision.
    lineage:
      - datalake_ebdb_raw.bypass_term_aud.confirmation_code_MOD
  mod_is_term_signed:
    description: Flag indicating whether the term-signed boolean changed in this audit revision.
    lineage:
      - datalake_ebdb_raw.bypass_term_aud.signed_term_MOD
  mod_ts_term_signed:
    description: Flag indicating whether the term-signed timestamp changed in this audit revision.
    lineage:
      - datalake_ebdb_raw.bypass_term_aud.signed_time_mod
  is_term_signed:
    description: Boolean flag stored at this revision indicating whether the owner had signed the waiver.
    lineage:
      - datalake_ebdb_raw.bypass_term_aud.signed_term
  ts_term_signed:
    description: Timestamp of the owner bypass-term signature as recorded in this audit revision.
    lineage:
      - datalake_ebdb_raw.bypass_term_aud.signed_time
  ts_created:
    description: Timestamp when the bypass-term source record was originally created, preserved in this revision.
    lineage:
      - datalake_ebdb_raw.bypass_term_aud.created_at
