database_name: datalake_ebdb_clean
table_name: paymentrules
domain: Fintech
description: Payment rules linked to a Portability record in EBDB, defining who pays the condo fee and which charges are paid in advance.
columns:
  id:
    description: Unique identifier for the payment rules record.
    lineage:
      - datalake_ebdb_raw.paymentrules.id
  id_portability:
    description: Foreign key to the Portability record these payment rules belong to.
    lineage:
      - datalake_ebdb_raw.paymentrules.portability_id
  condo_payer:
    description: Party responsible for paying the condominium fee, such as Tenant or Owner.
    lineage:
      - datalake_ebdb_raw.paymentrules.condopayer
  is_condo_paid_in_advance:
    description: Indicates whether the condominium fee is paid in advance for this portability.
    lineage:
      - datalake_ebdb_raw.paymentrules.condopaidinadvance
  is_rental_paid_in_advance:
    description: Indicates whether the rent is paid in advance for this portability.
    lineage:
      - datalake_ebdb_raw.paymentrules.rentalpaidinadvance
  is_iptu_paid_in_advance:
    description: Indicates whether the property tax (IPTU) is paid in advance for this portability.
    lineage:
      - datalake_ebdb_raw.paymentrules.iptupaidinadvance
  is_home_insurance_in_advance:
    description: Indicates whether the home insurance is paid in advance for this portability.
    lineage:
      - datalake_ebdb_raw.paymentrules.homeinsuranceinadvance
  ts_created:
    description: Timestamp when the payment rules record was created in EBDB.
    lineage:
      - datalake_ebdb_raw.paymentrules.criadoem
  ts_updated:
    description: Timestamp when the payment rules record was last updated in EBDB.
    lineage:
      - datalake_ebdb_raw.paymentrules.atualizadoem
