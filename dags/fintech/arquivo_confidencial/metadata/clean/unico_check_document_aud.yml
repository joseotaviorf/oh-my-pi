database_name: datalake_arquivo_confidencial_clean
table_name: unico_check_document_aud
description: Audit history of Unico check documents.
owner: isabella.santos@quintoandar.com.br
domain: Fintech
columns:
  id:
    lineage:
      - datalake_arquivo_confidencial_raw.unico_check_document_aud.id
    description: Primary key of the Unico check document.
  id_unico_check_process:
    lineage:
      - datalake_arquivo_confidencial_raw.unico_check_document_aud.unico_check_process_id
    description: FK to the Unico check process.
  rev:
    lineage:
      - datalake_arquivo_confidencial_raw.unico_check_document_aud.rev
    description: Envers revision id.
  rev_type:
    lineage:
      - datalake_arquivo_confidencial_raw.unico_check_document_aud.revtype
    description: Envers revision type.
  rev_end:
    lineage:
      - datalake_arquivo_confidencial_raw.unico_check_document_aud.revend
    description: Envers end revision.
  typed:
    lineage:
      - datalake_arquivo_confidencial_raw.unico_check_document_aud.typed
    description: Flag indicating whether Unico treated the capture as a typed identity document.
  type:
    lineage:
      - datalake_arquivo_confidencial_raw.unico_check_document_aud.type
    description: Identity document category returned by Unico (e.g. RG, CNH, passport).
  ocr:
    lineage:
      - datalake_arquivo_confidencial_raw.unico_check_document_aud.ocr
    description: OCR payload extracted from the document.
  ts_created:
    lineage:
      - datalake_arquivo_confidencial_raw.unico_check_document_aud.created_at
    description: Timestamp when the Unico identity-document capture was first stored.
  year:
    lineage:
      - datalake_arquivo_confidencial_raw.unico_check_document_aud.year
    description: Partition year.
  month:
    lineage:
      - datalake_arquivo_confidencial_raw.unico_check_document_aud.month
    description: Partition month.
  day:
    lineage:
      - datalake_arquivo_confidencial_raw.unico_check_document_aud.day
    description: Partition day.
