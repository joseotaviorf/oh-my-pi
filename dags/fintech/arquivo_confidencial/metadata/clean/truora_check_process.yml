database_name: datalake_arquivo_confidencial_clean
table_name: truora_check_process
description: This table contains information, provided by Truora for credit analysis, of the KYC (Know Your Customer) process.
domain: International
owner: bruna.prates@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_arquivo_confidencial_raw.truora_check_process.id
    description: ID of the report.
  id_process:
    lineage:
      - datalake_arquivo_confidencial_raw.truora_check_process.process_id
    description: Truora's process ID for reference.
  id_external:
    lineage:
      - datalake_arquivo_confidencial_raw.truora_check_process.external_id
    description: ID reference to Docx folder table.
  api_key:
    lineage:
      - datalake_arquivo_confidencial_raw.truora_check_process.api_key
    description: Token used by the user to access the process.
  document_value:
    lineage:
      - datalake_arquivo_confidencial_raw.truora_check_process.document_value
    description: User's RFC (Registro Federal de Contribuyentes) document number.
  status:
    lineage:
      - datalake_arquivo_confidencial_raw.truora_check_process.status
    description: Status of the KYC (Know Your Customer) process.
    categories:
      STARTED: The process has started.
      FINISHED: The process has finished.
  result:
    lineage:
      - datalake_arquivo_confidencial_raw.truora_check_process.result
    description: Result of the KYC (Know Your Customer) process.
    categories:
      null: The process has not yet been finished.
      SUCCESS: The result is successful.
      FAILED: The result is failure.
  payload:
    lineage:
      - datalake_arquivo_confidencial_raw.truora_check_process.payload
    description: Full Truora JSON webhook.
  version:
    lineage:
      - datalake_arquivo_confidencial_raw.truora_check_process.version
    description: The version of the report, i.e., the number of times it has been updated.
  ts_expiration:
    lineage:
      - datalake_arquivo_confidencial_raw.truora_check_process.expiration_date
    description: Timestamp of api_key expiration.
  ts_created:
    lineage:
      - datalake_arquivo_confidencial_raw.truora_check_process.created_at
    description: The timestamp of when the report was created.
  ts_updated:
    lineage:
      - datalake_arquivo_confidencial_raw.truora_check_process.updated_at
    description: The timestamp of when the report was updated.
  year:
    lineage:
      - datalake_arquivo_confidencial_raw.truora_check_process.updated_at
    description: Year of when the report was created. It's also a partition of this table.
  month:
    lineage:
      - datalake_arquivo_confidencial_raw.truora_check_process.updated_at
    description: Month of when the report was created. It's also a partition of this table.
  day:
    lineage:
      - datalake_arquivo_confidencial_raw.truora_check_process.updated_at
    description: Day of when the report was created. It's also a partition of this table.
