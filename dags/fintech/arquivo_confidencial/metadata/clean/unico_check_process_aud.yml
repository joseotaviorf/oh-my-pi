  rev:
    lineage:
      - datalake_arquivo_confidencial_raw.unico_check_process_aud.rev
    description: Envers revision id.
  rev_type:
    lineage:
      - datalake_arquivo_confidencial_raw.unico_check_process_aud.revtype
    description: Envers revision type.
  rev_end:
    lineage:
      - datalake_arquivo_confidencial_raw.unico_check_process_aud.revend
    description: Envers end revision.
  external_source:
    lineage:
      - datalake_arquivo_confidencial_raw.unico_check_process_aud.external_source
