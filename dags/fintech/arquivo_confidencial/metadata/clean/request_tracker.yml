database_name: datalake_arquivo_confidencial_clean
table_name: request_tracker
owner: isabella.santos@quintoandar.com.br
description: Tracks each Arquivo Confidencial provider request (cache vs fetch).
domain: Fintech
columns:
  id:
    lineage:
      - datalake_arquivo_confidencial_raw.request_tracker.id
    description: "Unique identifier for the request tracker"
  id_integration_report:
    lineage:
      - datalake_arquivo_confidencial_raw.request_tracker.integration_report_id
    description: "Unique identifier for the integration report"
  business_unit:
    lineage:
      - datalake_arquivo_confidencial_raw.request_tracker.business_unit
    description: "Business unit that originated the request"
  version:
    lineage:
      - datalake_arquivo_confidencial_raw.request_tracker.version
    description: Optimistic-lock version of this Arquivo Confidencial provider request row.
  is_cached:
    lineage:
      - datalake_arquivo_confidencial_raw.request_tracker.is_cached
    description: "Boolean flag indicating if the request was served from cache (true) or fetched from provider (false)"
  success:
    lineage:
      - datalake_arquivo_confidencial_raw.request_tracker.success
    description: "Boolean flag indicating if the request was successful"
  ts_created:
    lineage:
      - datalake_arquivo_confidencial_raw.request_tracker.created_at
    description: "Timestamp when the request tracker was created"
  ts_updated:
    lineage:
      - datalake_arquivo_confidencial_raw.request_tracker.updated_at
    description: "Timestamp when the request tracker was updated"
  year:
    lineage:
      - datalake_arquivo_confidencial_raw.request_tracker.year
    description: Partition year.
  month:
    lineage:
      - datalake_arquivo_confidencial_raw.request_tracker.month
    description: Partition month.
  day:
    lineage:
      - datalake_arquivo_confidencial_raw.request_tracker.day
    description: Partition day.
