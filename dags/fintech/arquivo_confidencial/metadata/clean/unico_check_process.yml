database_name: datalake_arquivo_confidencial_clean
table_name: unico_check_process
description: |
  This cleaned table consolidates Unico check process records, preserving
  identifiers, process metadata, and extracted attributes from the raw source
  `datalake_arquivo_confidencial_raw.unico_check_process`.

  The table standardizes field names, maintains lineage to the raw dataset,
  and exposes the full `attributes` JSON, which contains liveness, face match,
  status, score, and other biometric evaluation details.
domain: Fintech
owner: luana.silvia@quintoandar.com.br

columns:
  id:
    lineage:
      - datalake_arquivo_confidencial_raw.unico_check_process.id
    description: "Unique identifier of the check process record."

  id_external:
    lineage:
      - datalake_arquivo_confidencial_raw.unico_check_process.external_id
    description: "External ID used by the provider to reference the check process."

  id_process:
    lineage:
      - datalake_arquivo_confidencial_raw.unico_check_process.process_id
    description: "Identifier of the internal process associated with the biometric check."

  version:
    lineage:
      - datalake_arquivo_confidencial_raw.unico_check_process.version
    description: "Version number of the check process flow used by Unico."

  external_source:
    lineage:
      - datalake_arquivo_confidencial_raw.unico_check_process.external_source
    description: "Source system that triggered the Unico check process."

  attributes:
    lineage:
      - datalake_arquivo_confidencial_raw.unico_check_process.attributes
    description: |
      JSON payload containing detailed metadata from the biometric check,
      including fields such as:
        - liveness evaluation
        - face match score
        - process status
        - risk score
        - additional provider-level diagnostic information.

      This is the raw, untransformed structure received from Unico.

  liveness:
    lineage:
      - datalake_arquivo_confidencial_raw.unico_check_process.attributes
    description: "Extracted field from attributes JSON indicating the liveness result."

  face_match:
    lineage:
      - datalake_arquivo_confidencial_raw.unico_check_process.attributes
    description: "Extracted field representing similarity score between submitted photos."

  status:
    lineage:
      - datalake_arquivo_confidencial_raw.unico_check_process.attributes
    description: "Status returned by the Unico biometric process."

  score:
    lineage:
      - datalake_arquivo_confidencial_raw.unico_check_process.attributes
    description: "Biometric evaluation score extracted from the attributes JSON."

  has_biometry:
    lineage:
      - datalake_arquivo_confidencial_raw.unico_check_process.attributes
    description: "Flag extracted from attributes indicating whether biometry data was present."

  ts_created:
    lineage:
      - datalake_arquivo_confidencial_raw.unico_check_process.created_at
    description: "Timestamp indicating when the biometric check was created."

  ts_updated:
    lineage:
      - datalake_arquivo_confidencial_raw.unico_check_process.updated_at
    description: "Timestamp of the last update to the biometric check process."

  year:
    lineage:
      - datalake_arquivo_confidencial_raw.unico_check_process.year
    description: "Partition field representing the event year."

  month:
    lineage:
      - datalake_arquivo_confidencial_raw.unico_check_process.month
    description: "Partition field representing the event month."

  day:
    lineage:
      - datalake_arquivo_confidencial_raw.unico_check_process.day
    description: "Partition field representing the event day."
