dag:
  name: arquivo_confidencial
  schedule_interval: 0 3 * * *
  owner: Data Fintech
  documentation:
    dag_purpose: |
      This DAG extracts data from Arquivo Confidencial, a service responsible to track user personal info using SaaS platforms.
workflow:
  type: cdc
  layer: raw
  database_type: mysql
  source_schema: arquivoconfidencial
  dbutils_secret_key: ARQUIVO_CONFIDENCIAL_DB
  lineage_product_database_name: arquivoconfidencial
  tables_customization:
    documentation_report:
      clean_table_name: documentation_report
    documentation_report_aud:
      clean_table_name: documentation_report_aud
    documents:
      clean_table_name: documents
    emailage_result:
      clean_table_name: emailage_result
    emailage_result_aud:
      clean_table_name: emailage_result_aud
    integration_report:
      clean_table_name: integration_report
    integration_report_aud:
      clean_table_name: integration_report_aud
    presumed_income_report:
      clean_table_name: presumed_income_report
    presumed_income_report_aud:
      clean_table_name: presumed_income_report_aud
    request_tracker:
      clean_table_name: request_tracker
    revinfo:
      clean_table_name: rev_info
    unico_check_document:
      clean_table_name: unico_check_document
    unico_check_document_aud:
      clean_table_name: unico_check_document_aud
    unico_check_process:
      clean_table_name: unico_check_process
    unico_check_process_aud: {}
cluster:
  type: databricks_12_2_med_general_cluster
