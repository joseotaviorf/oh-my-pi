dag:
  name: arquivo_confidencial
  schedule_interval: 0 3 * * *
  owner: Data Fintech
  documentation:
    dag_purpose: |
      This DAG extracts data from Arquivo Confidencial, a service responsible to track user personal info using SaaS platforms.
workflow:
  type: cdc
  layer: raw
  database_type: mysql
  source_database: arquivoconfidencial
  source_schema: arquivoconfidencial
  dbutils_secret_key: ARQUIVOCONFIDENCIAL_DB
  lineage_product_database_name: arquivoconfidencial
  tables_customization:
    documentation_report: {}
    documentation_report_aud: {}
    documents: {}
    emailage_result: {}
    emailage_result_aud: {}
    presumed_income_report: {}
    presumed_income_report_aud: {}
    request_tracker: {}
    revinfo:
      clean_table_name: rev_info
    unico_check_document: {}
    unico_check_document_aud: {}
    unico_check_process: {}
    unico_check_process_aud: {}
cluster:
  type: custom_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    driver_node_type_id: m5d.xlarge
    node_type_id: r5.xlarge
    num_workers: 3
    spark_version: 13.3.x-scala2.12
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
