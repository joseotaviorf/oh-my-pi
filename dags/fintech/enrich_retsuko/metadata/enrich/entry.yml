---
database_name: datalake_retsuko
table_name: entry
owner: athos.sampayo@quintoandar.com.br
domain: fintech
description: "Information about entries from invoices"
columns:
  id:
    description: "Entry ID (credit or debt) regisrered in an invoice"
    lineage:
      - datalake_retsuko_clean.entry.id
  id_external:
    description: "External ID"
    lineage:
      - datalake_retsuko_clean.entry.id_external
  id_invoice:
    description: "Invoice ID"
    lineage:
      - datalake_retsuko_clean.entry.id_invoice
  id_contract:
    description: "Cotract ID associated with the invoice"
    lineage:
      - datalake_retsuko_clean.entry.id_contract
  id_from_account:
    description: "Account ID in which the entry is coming from"
    lineage:
      - datalake_retsuko_clean.entry.id_from_account
  id_to_account:
    description: "Account ID in which the entry is going to"
    lineage:
      - datalake_retsuko_clean.entry.id_to_account
  id_external_reversed_entry:
    description: "If the entry was created to cancel (reverse) other entry, with this ID you can track the original one that was reversed"
    lineage:
      - datalake_retsuko_clean.entry.id_external_reversed_entry
  id_audit:
    description: "Audit ID associated with an entry"
    lineage:
      - datalake_retsuko_clean.entry.id_audit
  accounting_transaction_identifier:
    description: "Transactional entries are created in pairs (on the IQ and PP invoice). This hash can identify this pair."
    lineage:
      - datalake_retsuko_clean.entry.accounting_transaction_identifier
  accounting_version:
    description: "Identify accounting version in entry creation"
  amount:
    description: "Entry amount"
    lineage:
      - datalake_retsuko_clean.entry.amount
  bill_item:
    description: "Name of the bill item, that is, what the item of invoice refers to"
    lineage:
      - datalake_retsuko_clean.entry.bill_item
  description:
    description: "Invoice entry title as shown in invoice"
    lineage:
      - datalake_retsuko_clean.entry.description
  producer:
    description: "Routine that created the entry"
    lineage:
      - datalake_retsuko_clean.entry.producer
    categories:
      brokerage-estate-agent-postponed: ""
      early-termination: ""
      early-termination-v2: ""
      estate-agent: ""
      extra: ""
      fine-and-interest: ""
      manual: ""
      manual-pos-rental: ""
      monthly-routine: ""
      non-specified: ""
      onboarding-routine: ""
      onboarding-routine-delayed: ""
      payment-adjustment: ""
      postponement: ""
      sporadic-routine: ""
  status:
    description: "Indicates if a entry is related to an invoice (success) or not - not-invoiceable - (pending)"
    lineage:
      - datalake_retsuko_clean.entry.status
  accrual_year_month:
    description: "Expense reference month"
    lineage:
      - datalake_retsuko_clean.entry.accrual_year_month
  due_year_month:
    description: "Year and month in which the entry is due to"
    lineage:
      - datalake_retsuko_clean.entry.due_year_month
  ts_created:
    description: "Entry creation timestamp"
    lineage:
      - datalake_retsuko_clean.entry.ts_created
  ts_synced:
    description: "Date that indicates when the entry was synced from SB to Retsuko"
    lineage:
      - datalake_retsuko_clean.entry.ts_synced
  ts_retsuko_updated:
    description: "Entry update timestamp"
    lineage:
      - datalake_retsuko_clean.entry.ts_retsuko_updated
  ts_database_transaction:
    description: "Retsuko's Transaction Timestamp"
    lineage:
      - datalake_retsuko_clean.entry.ts_database_transaction
