database_name: datalake_retsuko
table_name: monthly_closing_checks
owner: guilherme.sacramento@quintoandar.com.br
domain: Fintech
description: Checks, alerts, and validation results from Seu Barriga's monthly invoice closing process.
columns:
  id:
    description: Internal identifier of the monthly closing check.
    lineage:
      - datalake_retsuko_clean.monthly_closing_checks.id
  id_external:
    description: External identifier of the monthly closing check.
    lineage:
      - datalake_retsuko_clean.monthly_closing_checks.id_external
  id_contract:
    description: Internal contract ID in Retsuko associated with the check.
    lineage:
      - datalake_retsuko_clean.monthly_closing_checks.id_contract
  checks:
    description: Structured payload with checks, alerts, and validation details for the monthly closing.
    lineage:
      - datalake_retsuko_clean.monthly_closing_checks.checks
  accrual_year_month:
    description: Reference year-month for invoice accrual (YYYY-MM).
    lineage:
      - datalake_retsuko_clean.monthly_closing_checks.accrual_year_month
  ts_created:
    description: Timestamp when the monthly closing check was created.
    lineage:
      - datalake_retsuko_clean.monthly_closing_checks.ts_created
  ts_updated:
    description: Timestamp of the last update to the monthly closing check.
    lineage:
      - datalake_retsuko_clean.monthly_closing_checks.ts_updated
