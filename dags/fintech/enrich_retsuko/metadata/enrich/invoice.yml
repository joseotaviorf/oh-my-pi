---
database_name: datalake_retsuko
table_name: invoice
owner: athos.sampayo@quintoandar.com.br
domain: fintech
description: "Information about invoices issued by SeuBarriga for renting contracts."
columns:
  id:
    description: "Invoice ID"
    lineage:
      - datalake_retsuko_clean.invoice.id
  id_external:
    description: "External ID"
    lineage:
      - datalake_retsuko_clean.invoice.id_external
  id_original_invoice_external:
    description: "Indicates the first invoice create to an entry. It's very important in cancel causes, to not lose track."
    lineage:
      - datalake_retsuko_clean.invoice.id_original_invoice_external
  id_account:
    description: "Account ID"
    lineage:
      - datalake_retsuko_clean.invoice.id_account
  id_contract:
    description: "The Seu Barriga's internal contract ID reference of an invoice"
    lineage:
      - datalake_retsuko_clean.invoice.id_contract
  id_contract_external:
    description: "Most used ID to identify contracts. It is the MAIN (system that generates 5A contracts) Contract ID"
    lineage:
      - datalake_retsuko_clean.contract.id_external
  id_audit:
    description: "Latest audit ID associated with an invoice entry"
    lineage:
      - datalake_retsuko_clean.entry.id_audit
  id_checkout_order:
    description: "External ID that indicates the Order in Checkout product"
    lineage:
      - datalake_retsuko_clean.invoice.id_checkout_order
  id_checkout_charge:
    description: "External ID that indicates the Charge in Checkout product"
    lineage:
      - datalake_retsuko_clean.invoice.id_checkout_charge
  status:
    description: "Invoice's status"
    lineage:
      - datalake_retsuko_clean.invoice.status
    categories:
      canceled: The invoice is canceled, and there's no more values to be paid
      divergent-payment:
        The invoice was paid with a different value than the due
        amount in an invoice_paid_date
      not-payable:
        The net invoice value of all the entries is zero, therefore the
        invoice can not be paid. Yet the invoice has an invoice_due_date. In onboarding
        and monthly invoices, this status can appear when a postponed value is created
        in order to the tenant invoice not to become a payable or to the landlord
        invoice not to become a receivable
      open: The invoice is not paid yet
      paid: The invoice was paid
      written-down:
        The invoice was not paid and it was written down, the invoice_paid_date
        is the written down date. The process is done in general to not consider anymore
        the due amount (it's not going to be paid anymore or it has a negotiation)
  payment_status:
    description: "Invoice's payment status. Different from 'status' column that indicates the invoice's status, this column give you information about the payment process itself. Like, in a chargeback case, status will be 'canceled', and payment_status will be 'chargeback'."
    lineage:
      - datalake_retsuko_clean.invoice.payment_status
  substatus:
    description: "It's used to set negotiations/debts status"
    lineage:
      - datalake_retsuko_clean.invoice.substatus
    categories:
      none: ""
      debt: ""
      ongoing-negotiation: ""
  negotiation_status:
    description: "Description of negotiation status"
    lineage:
      - datalake_retsuko_clean.invoice.negotiation_status
  paid_via:
    description: "Invoice payment method categories"
    lineage:
      - datalake_retsuko_clean.invoice.paid_via
    categories:
      bank-transfer: ""
      cardif: ""
      checkout-boleto: ""
      cnab: ""
      credit-card: ""
      internet-banking: ""
      mercado-pago: ""
      non-specified: ""
      paypal: ""
      recupera: ""
      recupera-credit-card: ""
      recupera-pix: ""
      robin-hood: ""
      unknown: ""
  purpose:
    description: "Invoice purpose"
    lineage:
      - datalake_retsuko_clean.invoice.purpose
    categories:
      early-termination: ""
      extra: ""
      monthly: ""
      onboarding: ""
      pos-rental: ""
      estate-agent-services: ""
  closing_mode:
    description: "Description that shows if closing is automatic or manual"
    lineage:
      - datalake_retsuko_clean.invoice.closing_mode
    categories:
      auto: ""
      manual: ""
      non-specified: ""
  reason:
    description: "Invoices that have the purpose field filled in with the value extras must have the reason field filled in to identify what that invoice is about."
    categories:
      condominium-nonpayment: ""
      damages-bills: ""
      wrong-charges: ""
      negotiation-recupera: ""
      agreement: ""
      pending-balance-correction: ""
      non-specified: "reason not specified"
    lineage:
      - datalake_retsuko_clean.invoice.reason
  country_code:
    description: "Country Code: BR or MX"
    lineage:
      - datalake_retsuko_clean.contract.country_code
  due_amount:
    description: "Invoice amount, negative means its a due value TO 5A, and positive means its a due value FROM 5A"
    lineage:
      - datalake_retsuko_clean.invoice.due_amount
  paid_amount:
    description: "Amount paid in the invoice"
    lineage:
      - datalake_retsuko_clean.invoice.paid_amount
  payment_paid_interest_amount:
    description: "Amount of interest after payment"
    lineage:
      - datalake_retusko_clean.invoice.payment_paid_interest_amount
  payment_paid_fine_amount:
    description: "Amount of fine after payment"
    lineage:
      - datalake_retusko_clean.invoice.payment_paid_fine_amount
  accrual_year_month:
    description: "Expense reference month"
    lineage:
      - datalake_retsuko_clean.invoice.accrual_year_month
  should_request_boleto:
    description: "Boolean field that indicates if a bill creation request should be done"
    lineage:
      - datalake_retusko_clean.invoice.should_request_boleto
  sispag_file:
    description: "File that Seu Barriga created with Vans to communicate with bank"
    lineage:
      - datalake_retsuko_clean.invoice.sispag_file
  payment_company_use_number:
    description: "Company_use works as an ID to identifies the bill created in the bank"
    lineage:
      - datalake_retusko_clean.invoice.payment_company_use_number
  payment_bank_code:
    description: "Paying Bank Code"
    lineage:
      - datalake_retusko_clean.invoice.payment_bank_code
  dt_due_adjusted:
    description: "Invoice due date adjusted based on the fintech (bank) holidays."
    lineage:
      - datalake_quintoandar.aux_date.week_day
      - datalake_quintoandar.aux_date.is_brz_holiday
      - datalake_retsuko.invoice.ts_due
  ts_paid:
    description: "Timestamp in which invoice was paid, for payable invoices"
    lineage:
      - datalake_retsuko_clean.invoice.ts_paid
  ts_payment_confirmation:
    description: "Date that we received bank payment confirmation - In CNAB cases, it's different from ts_paid"
    lineage:
      - datalake_retsuko_clean.invoice.ts_payment_confirmation
  ts_payment_event:
    description: "It's used in payment reversal cases. This date will be the information received data - not necessary the payment reversal date"
    lineage:
      - datalake_retsuko_clean.invoice.ts_payment_event
  ts_payment_divergent_fixed:
    description: "Date that the payment divergent was fixed"
    lineage:
      - datalake_retsuko_clean.invoice.ts_payment_divergent_fixed
  ts_payment_processing:
    description: "Data that the payment was processed"
    lineage:
      - datalake_retsuko_clean.invoice.ts_payment_processing
  ts_payment_credit:
    description: "Date that the payment was credited in our bank account, in CNAB cases, after two business day in general"
    lineage:
      - datalake_retsuko_clean.invoice.ts_payment_credit
  ts_canceled:
    description: "Invoice cancellation timestamp"
    lineage:
      - datalake_retsuko_clean.invoice.ts_canceled
  ts_sent:
    description: "Invoice sent to timestamp"
    lineage:
      - datalake_retsuko_clean.invoice.ts_sent
  ts_due:
    description: Invoice due to timestamp"
    lineage:
      - datalake_retsuko_clean.invoice.ts_due
  ts_nf_requested:
    description: "Indicates when Seu Barriga requested erp solution to issue the NFe"
    lineage:
      - datalake_retsuko_clean.invoice.ts_nf_requested
  ts_created:
    description: "Invoice creation timestamp"
    lineage:
      - datalake_retsuko_clean.invoice.ts_created
  ts_retsuko_updated:
    description: "Invoice last update timestamp"
    lineage:
      - datalake_retsuko_clean.invoice.ts_retsuko_updated
