---
dag:
  name: enrich_retsuko
  owner: Data Fintech
  documentation:
    dag_purpose: |
      Prepares **finantial** data from the [Retsuko](github.com/quintoandar/retsuko) for business utilization. Retrieve data from Retsuko database (postgresql).
      [Retsuko](https://github.com/quintoandar/retsuko) is responsible to Extract financial data, Transform and Load it (ETL) in Metabase to be able to generate financial reports.
      It does not create or owns any information and it is not its purpose to do that. All the data it has comes from other financial services (today is only [SeuBarriga](https://github.com/quintoandar/seubarriga)).
      This DAG is triggered once per day via Mediator, after `retsuko` DAG.
workflow:
  type: query_delta
  layer: enrich
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, -7), 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, 1), 'load_end_date') }}"
  inner_dependencies:
    bill_items:
      - invoice
    debt_forgiveness:
      - bill_items
    bill_item_flags:
      - bill_items
      - invoice
      - entry
    invoice_entry:
      - entry
    invoice_info:
      - invoice
    invoice:
      - entry
  tables_customization:
    bill_item_flags:
      extraction_type: incremental
