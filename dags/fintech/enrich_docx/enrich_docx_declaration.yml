---
dag:
  name: enrich_docx
  schedule_start_date: 2020, 7, 1
  owner: Data Fintech
  documentation:
    dag_purpose: |
      Creates the enriched tables for the source `Docx`. This DAG enriches the credit evaluation data to track the result of the user's credit for a proposal.
workflow:
  type: query_delta
  layer: enrich
cluster:
  type: custom_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    driver_node_type_id: m5d.xlarge
    node_type_id: r5.xlarge
    num_workers: 3
    spark_version: 13.3.x-scala2.12
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: "quintoandar_{{ var.value.environment }}"
