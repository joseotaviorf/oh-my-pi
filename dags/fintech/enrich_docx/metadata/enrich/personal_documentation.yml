database_name: datalake_docx
table_name: personal_documentation
owner: isabella.santos@quintoandar.com.br
domain: Fintech
description: "Table with the personal documentation of the tenant"
columns:
  id:
    lineage:
      - datalake_docx_clean.document.id
    description: Credit analysis attribute describing id in the tenant underwriting workflow.
  id_folder:
    lineage:
      - datalake_docx_clean.document.id_folder
    description: Identifier for the folder referenced by this financial record.
  id_document_type:
    lineage:
      - datalake_docx_clean.document.id_document_type
    description: Identifier for the document type referenced by this financial record.
  id_document_context:
    lineage:
      - datalake_docx_clean.document.id_document_context
    description: Identifier for the document context referenced by this financial record.
  id_context_external:
    lineage:
      - datalake_docx_clean.document.id_context_external
    description: "Id external of the document context"
  cpf:
    lineage:
      - datalake_docx_clean.document.attributes
    description: Brazilian individual taxpayer registry number (CPF) used for identity verification (PII).
  document_type:
    lineage:
      - datalake_docx_clean.document.id_document_type
    description: Credit analysis attribute describing document type in the tenant underwriting workflow.
    categories:
      RG: ""
      CPF: ""
      CNH: ""
      RNE: ""
      PERSONAL_DATA: ""
      INCOME_DATA: ""
      ADDRESS: ""
  document_context:
    lineage:
      - datalake_docx_clean.document.id_document_context
    description: Credit analysis attribute describing document context in the tenant underwriting workflow.
    categories:
      Owner: ""
      Tenant: ""
      Affiliate: ""
      Buyer: ""
      Seller: "" 
  full_name:
    lineage:
      - datalake_docx_clean.document.attributes
    description: Credit analysis attribute describing full name in the tenant underwriting workflow.
  email:
    lineage:
      - datalake_docx_clean.document.attributes
    description: Credit analysis attribute describing email in the tenant underwriting workflow.
  telephone_number:
    lineage:
      - datalake_docx_clean.document.attributes
    description: Credit analysis attribute describing telephone number in the tenant underwriting workflow.
  cell_phone_number:
    lineage:
      - datalake_docx_clean.document.attributes
    description: "Tenant cell phone number" 
  marital_status:
    lineage:
      - datalake_docx_clean.document.attributes
    description: Credit analysis attribute describing marital status in the tenant underwriting workflow.
  rent_reason:
    lineage:
      - datalake_docx_clean.document.attributes
    description: Credit analysis attribute describing rent reason in the tenant underwriting workflow.
  attributes:
    lineage:
      - datalake_docx_clean.document.attributes
    description: Credit analysis attribute describing attributes in the tenant underwriting workflow.
  attachments:
    lineage:
      - datalake_docx_clean.document.attachments
    description: Credit analysis attribute describing attachments in the tenant underwriting workflow.
  will_reside:
    lineage:
      - datalake_docx_clean.document.attributes
    description: Credit analysis attribute describing will reside in the tenant underwriting workflow.
  ts_created:
    lineage:
      - datalake_docx_clean.document.ts_created
    description: "Creation timestamp"
  ts_updated:
    lineage:
      - datalake_docx_clean.document.ts_updated
    description: Timestamp when updated occurred in the upstream fintech system.