database_name: datalake_docx
table_name: identity_documentation
owner: isabella.santos@quintoandar.com.br
domain: Fintech
description: "Table with the identity documentation of the tenant"
columns:
  id_document:
    lineage:
      - datalake_docx_clean.document.id
    description: Identifier for the document referenced by this financial record.
  id_folder:
    lineage:
      - datalake_docx_clean.document.id_folder
    description: Identifier for the folder referenced by this financial record.
  id_document_type:
    lineage:
      - datalake_docx_clean.document.id_document_type
    description: Identifier for the document type referenced by this financial record.
  id_proposal:
    lineage:
      - datalake_docx_clean.document.id_context_external
    description: Credit or rental guarantee proposal identifier from the underwriting flow.
  document_number:
    lineage:
      - datalake_docx_clean.document.attributes
    description: Credit analysis attribute describing document number in the tenant underwriting workflow.
  cpf:
    lineage:
      - datalake_docx_clean.document.attributes
    description: "CPF from personal data (document_type = 7)"
  document_type:
    lineage:
      - datalake_docx_clean.document_type.name
    description: Credit analysis attribute describing document type in the tenant underwriting workflow.
    categories:
      RG: ""
      CPF: ""
      CNH: ""
      RNE: ""
  document_context:
    lineage:
      - datalake_docx_clean.document_context.name
    description: Credit analysis attribute describing document context in the tenant underwriting workflow.
    categories:
      Owner: ""
      Tenant: ""
      Affiliate: ""
      Buyer: ""
      Seller: ""
  mother_name:
    lineage:
      - datalake_docx_clean.document.attributes
    description: Credit analysis attribute describing mother name in the tenant underwriting workflow.
  nationality:
    lineage:
      - datalake_docx_clean.document.attributes
    description: Credit analysis attribute describing nationality in the tenant underwriting workflow.
  country_of_origin:
    lineage:
      - datalake_docx_clean.document.attributes
    description: "Tenant country of origin"
  folder_type:
    lineage:
      - datalake_docx_clean.folder_type.name
    description: "Type of folder from personal data"
  attributes:
    lineage:
      - datalake_docx_clean.document.attributes
    description: Credit analysis attribute describing attributes in the tenant underwriting workflow.
  attachments:
    lineage:
      - datalake_docx_clean.document.attachments
    description: Credit analysis attribute describing attachments in the tenant underwriting workflow.
  dt_birth:
    lineage:
      - datalake_docx_clean.document.attributes
    description: "Tenant birth date"
  is_new_rg:
    lineage:
      - datalake_docx_clean.document.attributes
    description: "Boolean flag indicating if this is a new RG"
  is_digital:
    lineage:
      - datalake_docx_clean.document.attributes
    description: "Boolean flag indicating if this is a digital document"
  ts_created:
    lineage:
      - datalake_docx_clean.document.ts_created
    description: "Creation timestamp"
  ts_updated:
    lineage:
      - datalake_docx_clean.document.ts_updated
    description: Timestamp when updated occurred in the upstream fintech system.
