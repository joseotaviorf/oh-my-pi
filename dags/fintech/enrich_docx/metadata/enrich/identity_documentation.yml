database_name: datalake_docx
table_name: identity_documentation
owner: isabella.santos@quintoandar.com.br
domain: Fintech
description: "Table with the identity documentation of the tenant"
columns:
  id_document:
    lineage:
      - datalake_docx_clean.document.id
    description: "Id of the identity documentation"
  id_folder:
    lineage:
      - datalake_docx_clean.document.id_folder
    description: "Id of the folder"
  id_document_type:
    lineage:
      - datalake_docx_clean.document.id_document_type
    description: "Id of the document type"
  id_proposal:
    lineage:
      - datalake_docx_clean.document.id_context_external
    description: "Id of the proposal"
  document_number:
    lineage:
      - datalake_docx_clean.document.attributes
    description: "Tenant document number"
  cpf:
    lineage:
      - datalake_docx_clean.document.attributes
    description: "CPF from personal data (document_type = 7)"
  document_type:
    lineage:
      - datalake_docx_clean.document_type.name
    description: "Document type"
    categories:
      RG: ""
      CPF: ""
      CNH: ""
      RNE: ""
  document_context:
    lineage:
      - datalake_docx_clean.document_context.name
    description: "Document context"
    categories:
      Owner: ""
      Tenant: ""
      Affiliate: ""
      Buyer: ""
      Seller: ""
  mother_name:
    lineage:
      - datalake_docx_clean.document.attributes
    description: "Tenant mother name"
  nationality:
    lineage:
      - datalake_docx_clean.document.attributes
    description: "Tenant nationality"
  country_of_origin:
    lineage:
      - datalake_docx_clean.document.attributes
    description: "Tenant country of origin"
  folder_type:
    lineage:
      - datalake_docx_clean.folder_type.name
    description: "Type of folder from personal data"
  attributes:
    lineage:
      - datalake_docx_clean.document.attributes
    description: "Documentation attributes"
  attachments:
    lineage:
      - datalake_docx_clean.document.attachments
    description: "Documentation attachments"
  dt_birth:
    lineage:
      - datalake_docx_clean.document.attributes
    description: "Tenant birth date"
  is_new_rg:
    lineage:
      - datalake_docx_clean.document.attributes
    description: "Boolean flag indicating if this is a new RG"
  is_digital:
    lineage:
      - datalake_docx_clean.document.attributes
    description: "Boolean flag indicating if this is a digital document"
  ts_created:
    lineage:
      - datalake_docx_clean.document.ts_created
    description: "Creation timestamp"
  ts_updated:
    lineage:
      - datalake_docx_clean.document.ts_updated
    description: "Updated timestamp"
