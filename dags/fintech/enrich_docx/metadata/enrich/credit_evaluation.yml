database_name: datalake_docx
table_name: credit_evaluation
owner: isabella.santos@quintoandar.com.br
domain: Fintech
description: "Table with the credit evaluation of the tenant"
columns:
  id:
    lineage:
      - datalake_docx_clean.credit_evaluation.id
    description: "Id of the income documentation"
  id_proposal:
    lineage:
      - datalake_docx_clean.credit_evaluation.id_proposal
    description: Credit or rental guarantee proposal identifier from the underwriting flow.
  id_house:
    lineage:
      - datalake_docx_clean.credit_evaluation.id_house
    description: Property listing identifier linking the financial event to the rented or sold unit.
  id_user:
    lineage:
      - datalake_docx_clean.credit_evaluation.id_user
    description: QuintoAndar user identifier associated with this financial transaction or account.
  id_group:
    lineage:
      - datalake_docx_clean.credit_evaluation.id_group
    description: "Id of the group of tenants that are part of a credit passport."
  id_city:
    lineage:
      - datalake_docx_clean.credit_evaluation.id_city
    description: "Id of the city within the credit passport is valid."
  reason:
    lineage:
      - datalake_docx_clean.credit_evaluation.reason
    description: Credit analysis attribute describing reason in the tenant underwriting workflow.
  scope:
    lineage:
      - datalake_docx_clean.credit_evaluation.scope
    description: "Scope of the credit evaluation. The credit model can evaluate a credit risk based on the house information or city."
  limit_value:
    lineage:
      - datalake_docx_clean.credit_evaluation.limit_value
    description: "The credit value risk that the user is interested in being evaluated for."
  proponent_group_type:
    lineage:
      - datalake_docx_clean.credit_evaluation.proponent_group_type
    description: Credit analysis attribute describing proponent group type in the tenant underwriting workflow.
    categories:
      MYSELF: "Indicates that the user is interested in renting a property alone"
      MYSELF_WITH_OTHERS: "When the user is interested in renting a property with other proponents."
      OTHERS: "When the user is renting a house on behalf of others."
  result:
    lineage:
      - datalake_docx_clean.credit_evaluation.result
    description: Credit analysis attribute describing result in the tenant underwriting workflow.
    categories:
      PRE_APPROVED: ""
      REGULAR: ""
      PRE_REJECTED: ""
      INVALID_SCORE: ""
  status:
    lineage:
      - datalake_docx_clean.credit_evaluation.status
    description: Current lifecycle status of the financial entity in the upstream operational system.
    categories:
      NOT_SENT: ""
      PROCESSING: ""
      FINISHED: ""
      FAILED: ""
  proposal_last_result:
    lineage:
      - datalake_docx_clean.credit_evaluation.result
    description: Credit analysis attribute describing proposal last result in the tenant underwriting workflow.
  proposal_number_evaluations:
    lineage:
      - datalake_docx_clean.credit_evaluation.id
    description: "Number of distinct evaluations submitted within the proposal"
  group_last_result:
    lineage:
      - datalake_docx_clean.credit_evaluation.result
    description: Credit analysis attribute describing group last result in the tenant underwriting workflow.
  group_number_evaluations:
    lineage:
      - datalake_docx_clean.credit_evaluation.id
    description: "Number of distinct evaluations submitted within the group"
  ts_created:
    lineage:
      - datalake_docx_clean.credit_evaluation.ts_created
    description: "Creation timestamp"
  ts_updated:
    lineage:
      - datalake_docx_clean.credit_evaluation.ts_updated
    description: Timestamp when updated occurred in the upstream fintech system.
  ts_expires:
    lineage:
      - datalake_docx_clean.credit_evaluation.ts_expires
    description: "Timestamp of the group expiration"
  ts_proposal_first_credit_evaluation_positive:
    lineage:
      - datalake_docx_clean.credit_evaluation.result
      - datalake_docx_clean.credit_evaluation.ts_updated
    description: Timestamp when proposal first credit evaluation positive occurred in the upstream fintech system.
  ts_proposal_last_credit_evaluation_positive:
    lineage:
      - datalake_docx_clean.credit_evaluation.result
      - datalake_docx_clean.credit_evaluation.ts_updated
    description: Timestamp when proposal last credit evaluation positive occurred in the upstream fintech system.
  ts_group_first_credit_evaluation_positive:
    lineage:
      - datalake_docx_clean.credit_evaluation.result
      - datalake_docx_clean.credit_evaluation.ts_updated
    description: Timestamp when group first credit evaluation positive occurred in the upstream fintech system.
  ts_group_last_credit_evaluation_positive:
    lineage:
      - datalake_docx_clean.credit_evaluation.result
      - datalake_docx_clean.credit_evaluation.ts_updated
    description: Timestamp when group last credit evaluation positive occurred in the upstream fintech system.
