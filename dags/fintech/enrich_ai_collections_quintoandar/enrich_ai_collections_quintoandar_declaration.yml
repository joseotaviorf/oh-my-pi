dag:
  name: enrich_ai_collections_quintoandar
  schedule_start_date: 2026, 4, 29
  owner: Data Fintech
  documentation:
    dag_purpose: |
      Enrich layer for the Collections AI Agents (Matthew) analytics:
      builds session universe, per-session observation summary, an
      LLM-friendly agglutinated conversation string per id_sauron_session,
      online Payin evaluator scores for Matthew WhatsApp sessions
      (matthew_payin_evals), and Matthew voice call timeline/session
      tables (matthew_voice_events, matthew_voice_sessions) for prod
      traces tagged matthew + online_call.

workflow:
  type: query_delta
  layer: enrich
  custom_schema: ai_collections_quintoandar
  default_extraction_type: incremental
  default_partitions: [year, month, day]
  execution_timeout_hours: 5
  tables_customization:
    sessions:
      merge_on: [id_external]
      z_order_by: [ts_updated, id_external]
    observation:
      merge_on: [id_langfuse_session]
      z_order_by: [id_langfuse_session]
    messages:
      merge_on: [id_external]
      z_order_by: [id_external]
    mcp_tool_logs:
      merge_on: [id_request, id_trace, call_index]
      partitions: [year, month, day]
      z_order_by: [ts_request, id_trace, mcp_tool_name, id_langfuse_session]
    matthew_mcp_observations:
      merge_on: [id_langfuse_session]
      partitions: [year, month, day]
      z_order_by: [id_langfuse_session]
    matthew_llm_metrics:
      merge_on: [id_langfuse_session]
      partitions: [year, month, day]
      z_order_by: [id_langfuse_session]
    matthew_payin_evals:
      merge_on: [id_langfuse_session]
      partitions: [year, month, day]
      z_order_by: [id_langfuse_session]
    matthew_voice_events:
      merge_on: [id_langfuse_session, id_observation]
      partitions: [year, month, day]
      z_order_by: [id_langfuse_session, ts_started]
      incremental_optimize: true
    matthew_voice_sessions:
      merge_on: [id_langfuse_session]
      partitions: [year, month, day]
      z_order_by: [id_langfuse_session]
      incremental_optimize: true
  inner_dependencies:
    sessions:
      - observation
    messages:
      - sessions
    matthew_mcp_observations:
      - mcp_tool_logs
    matthew_voice_sessions:
      - matthew_voice_events
