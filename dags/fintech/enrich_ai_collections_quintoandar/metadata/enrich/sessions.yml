database_name: datalake_ai_collections_quintoandar
table_name: sessions
description: Universe of chatbot sessions that could contain Matthew (collections AI agent) interactions, with the AI agent source derived from Langfuse observation flags and trace presence. One row per SSS session (id_sss_session), falling back to id_session when SSS id is absent.
domain: Fintech
owner: juliana.hocihara@quintoandar.com.br
columns:
  id_session:
    lineage:
      - datalake_chatbot.sessions.id_session
    description: "Internal session ID from the chatbot enrich layer."
  id_sauron_session:
    lineage:
      - datalake_chatbot.sessions.id_sauron_session
    description: "Sauron session ID associated with the chatbot session."
  id_sss_session:
    lineage:
      - datalake_chatbot.sessions.id_sss_session
    description: "Support Session Service (SSS) public_id propagated from chatbot sessions. Primary deduplication key for this table; falls back to id_session when absent."
  id_external:
    lineage:
      - datalake_chatbot.sessions.id_langfuse_session
    description: "External (Langfuse) session ID used to integrate with Langfuse traces and observations."
  id_ticket:
    lineage:
      - datalake_chatbot.sessions.id_ticket
    description: "Customer support ticket ID associated with the session, when escalated."
  id_user:
    lineage:
      - datalake_chatbot.sessions.id_user
    description: "Identifier of the user that interacted with the chatbot in this session."
  bot:
    lineage:
      - datalake_chatbot.sessions.bot
    description: "Bot type that handled the session (matthew or wall-e)."
  first_queue:
    lineage:
      - datalake_chatbot.sessions.first_queue
    description: "First customer support queue that handled the session."
  last_queue:
    lineage:
      - datalake_chatbot.sessions.last_queue
    description: "Last customer support queue that handled the session."
  ai_agent_source:
    lineage:
      - datalake_chatbot.sessions.bot
      - datalake_ai_collections_quintoandar.observation.flag_collections_agent_input
      - datalake_ai_collections_quintoandar.observation.flag_debt_retriever_tool
      - datalake_ai_collections_quintoandar.observation.flag_user_debt_classifier_tool
      - datalake_ai_collections_quintoandar.observation.flag_debt_finder_tool
    description: "Source of the AI agent for the session: 'Matthew in Whatsapp' when bot=matthew, 'Matthew in Chat' when bot=wall-e and any Matthew detection signal is present (a V2-or-later collections-agent input, V1.5 DebtRetrieverTool/UserDebtClassifierTool, or V1 DebtFinderTool), otherwise 'Wall-e'."
  ai_agent_source_legacy:
    lineage:
      - datalake_chatbot.sessions.bot
      - datalake_langfuse_clean.scores.value
      - datalake_langfuse_clean.scores.name
    description: "Legacy source of the AI agent for the session, derived from the Langfuse score (value > 0) under either the older SessionContainsMatthewAgentEvaluator or the newer MatthewVersionEvaluator (which encodes the version: 0=none, 1=V1, 1.5=V1.5, 2=V2). Kept to reproduce historical metrics that pre-date the observation-based logic; it does not encode V3-or-later agents, which are detected by ai_agent_source and matthew_version."
  is_matthew_in_session:
    lineage:
      - datalake_ai_collections_quintoandar.observation.flag_collections_agent_input
      - datalake_ai_collections_quintoandar.observation.flag_debt_retriever_tool
      - datalake_ai_collections_quintoandar.observation.flag_user_debt_classifier_tool
      - datalake_ai_collections_quintoandar.observation.flag_debt_finder_tool
    description: "Boolean flag indicating that any Matthew agent version was detected in the session via observation signals, derived from a V2-or-later collections-agent input or the V1/V1.5 DebtRetrieverTool, UserDebtClassifierTool, and DebtFinderTool signals. This is observation-derived only and is strictly narrower than ai_agent_source: historical bot='matthew' sessions without recorded traces can have ai_agent_source='Matthew in Whatsapp' and is_matthew_in_session=FALSE. For the canonical 'Matthew was involved' question use ai_agent_source <> 'Wall-e'."
  flag_matthew_talked_to_user:
    lineage:
      - datalake_chatbot.sessions.bot
      - datalake_ai_collections_quintoandar.observation.flag_collections_agent_input
      - datalake_ai_collections_quintoandar.observation.flag_debt_retriever_tool
      - datalake_ai_collections_quintoandar.observation.flag_user_debt_classifier_tool
      - datalake_ai_collections_quintoandar.observation.flag_debt_finder_tool
      - datalake_ai_collections_quintoandar.observation.flag_react_planner_talk_to_user
      - datalake_ai_collections_quintoandar.observation.flag_collectionsinput_talk_to_user
    description: "1 when Matthew actually spoke to the user in the session, unified across all generations; else 0. When Matthew is the WhatsApp host (bot='matthew') it always counts. Inside the Wall-e host, Matthew must be detected and relay a message through the V3-or-later CollectionsAgentV<number> - ReactPlanner TalkToUserTool or the legacy V2 CollectionsInput 'RESPOND EXACTLY' instruction. This distinguishes user engagement from sessions where the collections agent only ran tools internally."
  matthew_version:
    lineage:
      - datalake_ai_collections_quintoandar.observation.flag_collectionsinput_agent
      - datalake_ai_collections_quintoandar.observation.collections_agent_version
      - datalake_ai_collections_quintoandar.observation.flag_debt_retriever_tool
      - datalake_ai_collections_quintoandar.observation.flag_user_debt_classifier_tool
      - datalake_ai_collections_quintoandar.observation.flag_debt_finder_tool
    description: "Detected Matthew agent version. Versioned collectionsagentv<number>input observations produce their embedded version dynamically (V3, V4, V5, and later), with the rollout name collectionsagentv1input mapped to V3. CollectionsInput produces V2, DebtRetrieverTool/UserDebtClassifierTool produce V1.5, and DebtFinderTool produces V1; NULL means no version signal. Versioned inputs take precedence over V2, V1.5, and V1. Historical Whatsapp sessions without traces can have matthew_version=NULL and should be handled as an explicit unknown bucket."
  flag_eval_matthew_in_chat:
    lineage:
      - datalake_chatbot.sessions.bot
      - datalake_ai_collections_quintoandar.observation.flag_collections_agent_input
    description: "Boolean flag indicating that a V2-or-later Matthew collections agent was active inside an in-app chat session, derived from bot=wall-e plus any recognized collections-agent input observation. Narrower than is_matthew_in_session and retained as the experiment-eligibility field."
  is_escalation:
    lineage:
      - datalake_chatbot.sessions.is_escalated
    description: "Boolean flag indicating that the session was escalated to a human agent."
  flag_escalation_attempted:
    lineage:
      - datalake_langfuse_clean.traces.output
    description: "1 if the agent ATTEMPTED to escalate the session to human support, i.e. any of its prod traces emitted a human_escalation response (detected via GET_JSON_OBJECT(traces.output, '$.responses[0].response_type') = 'human_escalation'); else 0. Aggregated over every trace of the session and derived name-agnostically from the trace output, so it is independent of which agent/tool produced the escalation (escalate_tool, HumanEscalationAgentV7Input, future renames). This is the agent's attempt, not the outcome: an attempt only becomes an actual escalation when it happens within human-support working hours, which is why this can be 1 while is_escalation is false."
  matthew_declared_escalation_reason:
    lineage:
      - datalake_langfuse_clean.traces.output
    description: "Free-text reason the agent gave for attempting to escalate the session to human support, extracted from the escalating trace output at $.responses[0].content.hybrid_content.metadata[0].escalation_reason. Populated whenever flag_escalation_attempted = 1 (the attempt), regardless of whether it resulted in an actual escalation. NULL when no trace in the session emitted a human_escalation response. When more than one trace escalates in the same session, MAX() picks one reason lexicographically — rare, but not deterministic."
  matthew_declared_escalation_queue:
    lineage:
      - datalake_langfuse_clean.traces.output
    description: "Queue the agent attempted to route the escalation to, extracted from the escalating trace output at $.responses[0].content.hybrid_content.metadata[0].queue_name (e.g. 'OPS COBRANCA ATIVO [POS]'). Populated whenever flag_escalation_attempted = 1; it reflects the agent's intended target, not necessarily where the session was actually routed. Distinct from first_queue / last_queue, which are the queues that actually handled the session on the chatbot platform. NULL when no trace in the session emitted a human_escalation response. When more than one trace escalates in the same session, MAX() picks one queue lexicographically — rare, but not deterministic."
  flag_session_with_trace:
    lineage:
      - datalake_langfuse_clean.traces.id_session
    description: "Boolean flag indicating that the session has at least one Langfuse trace recorded (derived directly from datalake_langfuse_clean.traces, independent from observations)."
  notif_ts_extracted:
    lineage:
      - datalake_langfuse_clean.traces.input
    description: "Timestamp of the most recent user notification at the time the session started, extracted from the first Langfuse trace input JSON ($.user_context.user_last_notifications[0].sent_at)."
  notif_text_extracted:
    lineage:
      - datalake_langfuse_clean.traces.input
    description: "Text of the most recent user notification at the time the session started, extracted from the first Langfuse trace input JSON ($.user_context.user_last_notifications[0].text)."
  notif_template_extracted:
    lineage:
      - datalake_langfuse_clean.traces.input
    description: "Template name of the most recent user notification at the time the session started, extracted from the first Langfuse trace input JSON ($.user_context.user_last_notifications[0].template)."
  user_roles_raw:
    lineage:
      - datalake_langfuse_clean.traces.input
    description: "Raw user roles JSON value seen on the first Langfuse trace input ($.user_context.user_roles), kept verbatim for downstream parsing. user_roles is constant per session, so the first trace value is sufficient."
  is_tenant:
    lineage:
      - datalake_langfuse_clean.traces.input
    description: "1 if the user_roles seen on the first trace input contains TENANT, else 0."
  is_owner:
    lineage:
      - datalake_langfuse_clean.traces.input
    description: "1 if the user_roles seen on the first trace input contains OWNER, else 0."
  is_owner_only:
    lineage:
      - datalake_langfuse_clean.traces.input
    description: "1 if the user_roles seen on the first trace input contains OWNER and does NOT contain TENANT, else 0."
  dt_session_created:
    lineage:
      - datalake_chatbot.sessions.ts_created
    description: "Date when the session was created (extracted from ts_created)."
  ts_created:
    lineage:
      - datalake_chatbot.sessions.ts_created
    description: "Timestamp when the chatbot session was created."
  ts_updated:
    lineage:
      - datalake_chatbot.sessions.ts_updated
    description: "Timestamp when the chatbot session was last updated; used as the incremental watermark."
  year:
    lineage:
      - datalake_chatbot.sessions.ts_updated
    description: "Table partition calendar year derived from ts_updated when the enrich row was materialized."
  month:
    lineage:
      - datalake_chatbot.sessions.ts_updated
    description: "Table partition calendar month derived from ts_updated when the enrich row was materialized."
  day:
    lineage:
      - datalake_chatbot.sessions.ts_updated
    description: "Table partition calendar day of month derived from ts_updated when the enrich row was materialized."
