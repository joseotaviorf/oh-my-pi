database_name: datalake_ai_collections_quintoandar
table_name: observation
description: Per-session summary of Langfuse observations for Matthew (collections AI agent) sessions, with flags grouping negotiation flow signals, technical-state signals, and trace volume aggregates.
domain: Fintech
owner: juliana.hocihara@quintoandar.com.br
columns:
  id_langfuse_session:
    lineage:
      - datalake_langfuse_clean.traces.id_session
    description: "Langfuse session identifier, joining back to enrich_ai_collections_quintoandar.sessions.id_external."
  flag_ask_user_preferences:
    lineage:
      - datalake_langfuse_clean.observations.name
    description: "1 if the agent asked the user for preferences (ask_user_preferences observation) at least once in the session, else 0."
  send_proposal_count:
    lineage:
      - datalake_langfuse_clean.observations.name
    description: "Number of times the agent sent a negotiation proposal (send_proposal observation) during the session."
  flag_handle_segments_without_proposals:
    lineage:
      - datalake_langfuse_clean.observations.name
    description: "1 if the agent reached the handle_segments_without_proposals state at least once during the session, else 0."
  handle_negotiation_cancelled_count:
    lineage:
      - datalake_langfuse_clean.observations.name
    description: "Number of times the agent reached the handle_negotiation_cancelled state during the session."
  confirm_negotiation_count:
    lineage:
      - datalake_langfuse_clean.observations.name
    description: "Number of times the agent emitted a confirm_negotiation observation, signalling user-confirmed offers."
  flag_create_negotiation:
    lineage:
      - datalake_langfuse_clean.observations.name
    description: "1 if the agent emitted a create_negotiation observation at least once in the session, else 0."
  flag_collectionsinput_agent:
    lineage:
      - datalake_langfuse_clean.observations.name
    description: "1 if the session contains the CollectionsInput observation (canonical Matthew V2 session entrypoint), else 0."
  flag_collectionsinputv3_agent:
    lineage:
      - datalake_langfuse_clean.observations.name
    description: "Compatibility flag for the Matthew V3 entrypoint. 1 when the session contains collectionsagentv1input or collectionsagentv3input, else 0; collectionsagentv1input is retained because it was emitted for V3 during rollout. This field intentionally remains V3-specific; use flag_collections_agent_input for version-neutral detection."
  flag_collections_agent_input:
    lineage:
      - datalake_langfuse_clean.observations.name
    description: "1 when the session contains any Matthew collections-agent input entrypoint, else 0. Matches the legacy V2 collectionsinput observation and versioned names following collectionsagentv<number>input, including V3, V4, and future versions."
  collections_agent_version:
    lineage:
      - datalake_langfuse_clean.observations.name
    description: "Highest numeric Matthew version detected from collectionsagentv<number>input observations in the session. The rollout name collectionsagentv1input maps to version 3; other names use their embedded number. NULL when only the legacy V2 collectionsinput entrypoint is present."
  is_notification_reply:
    lineage:
      - datalake_langfuse_clean.observations.name
    description: "1 if the session contains the outbound_payload_from_dto observation, indicating a reply triggered by a notification."
  flag_has_collections_data_error:
    lineage:
      - datalake_langfuse_clean.observations.name
      - datalake_langfuse_clean.observations.type
    description: "1 if the session contains a handle_collections_data_error observation of type CHAIN or TOOL, signalling a collections data fetch failure."
  flag_has_finance_fetch_error:
    lineage:
      - datalake_langfuse_clean.observations.name
    description: "1 if the session contains a handle_finance_fetch_error observation, signalling a failure when fetching finance data for the user."
  flag_has_fetch_collections_data:
    lineage:
      - datalake_langfuse_clean.observations.name
      - datalake_langfuse_clean.observations.type
    description: "1 if the session contains a fetch_collections_data observation of type CHAIN or TOOL, signalling a collections data fetch attempt."
  flag_handle_no_contracts:
    lineage:
      - datalake_langfuse_clean.observations.name
      - datalake_langfuse_clean.observations.type
    description: "1 if the session contains a handle_no_contracts observation of type CHAIN or TOOL, signalling that no contracts were available for the user."
  flag_has_fetch_contracts:
    lineage:
      - datalake_langfuse_clean.observations.name
      - datalake_langfuse_clean.observations.type
    description: "1 if the session contains a fetch_contracts observation of type CHAIN or TOOL, signalling a contracts fetch attempt."
  flag_payment_allegation_tool:
    lineage:
      - datalake_langfuse_clean.observations.name
    description: "1 if the session invoked the PaymentAllegationTool tool at least once, else 0."
  flag_debt_retriever_tool:
    lineage:
      - datalake_langfuse_clean.observations.name
    description: "1 if the session invoked the DebtRetrieverTool tool at least once, else 0."
  flag_user_debt_classifier_tool:
    lineage:
      - datalake_langfuse_clean.observations.name
    description: "1 if the session invoked the UserDebtClassifierTool tool at least once, else 0."
  flag_debt_finder_tool:
    lineage:
      - datalake_langfuse_clean.observations.name
    description: "1 if the session invoked the DebtFinderTool tool at least once, else 0."
  flag_get_yearly_paid_invoices_report_tool:
    lineage:
      - datalake_langfuse_clean.observations.name
    description: "1 if the session invoked the get_yearly_paid_invoices_report_tool tool at least once, else 0."
  flag_negotiation_proposer_tool:
    lineage:
      - datalake_langfuse_clean.observations.name
    description: "1 if the session invoked the NegotiationProposerTool tool at least once, else 0."
  flag_react_planner_talk_to_user:
    lineage:
      - datalake_langfuse_clean.observations.name
      - datalake_langfuse_clean.observations.output
    description: "1 if the session contains at least one CollectionsAgentV<number> - ReactPlanner observation whose output JSON carries a TalkToUserToolInput tool call, signalling that a V3-or-later Matthew planner chose to send a message directly to the user; else 0. This signal is 0 for V1/V1.5/V2 sessions."
  flag_collectionsinput_talk_to_user:
    lineage:
      - datalake_langfuse_clean.observations.name
      - datalake_langfuse_clean.observations.output
    description: "1 if the session contains at least one 'CollectionsInput' observation whose output values array carries the legacy V2 verbatim-relay instruction (detected via GET_JSON_OBJECT(output, '$.values') LIKE '%RESPOND EXACTLY%'), signalling that the Matthew V2 collections sub-agent handed the host a message to relay to the user; else 0. Legacy V2 signal — the CollectionsInput 'RESPOND EXACTLY' mechanism is the counterpart of the V3-or-later ReactPlanner TalkToUserTool captured by flag_react_planner_talk_to_user."
  flag_debt_summary_display_helper:
    lineage:
      - datalake_langfuse_clean.observations.name
    description: "1 if the session reached the debt_summary_display_helper helper at least once, else 0."
  flag_original_invoice_values_disagreement_helper:
    lineage:
      - datalake_langfuse_clean.observations.name
    description: "1 if the session reached the original_invoice_values_disagreement_helper helper, signalling that the user disagreed with the original invoice values."
  flag_ongoing_deal_renegotiation_request_helper:
    lineage:
      - datalake_langfuse_clean.observations.name
    description: "1 if the session reached the ongoing_deal_renegotiation_request_helper helper, signalling that the user requested to renegotiate an ongoing deal."
  flag_handle_non_tenant:
    lineage:
      - datalake_langfuse_clean.observations.name
    description: "1 if the session reached the handle_non_tenant state, signalling that the user is not a tenant."
  flag_escalation_attempted:
    lineage:
      - datalake_langfuse_clean.traces.output
    description: "1 if the agent ATTEMPTED to escalate the user to human support in the session, i.e. any of its traces emitted a human_escalation response (detected via GET_JSON_OBJECT(traces.output, '$.responses[0].response_type') = 'human_escalation'); else 0. This is the agent's attempt, not the outcome: an attempt only becomes an actual escalation when it happens within human-support working hours, which is why this can be 1 while the session's is_escalation is false. Derived name-agnostically from the trace output, so it is independent of which agent/tool produced the escalation (escalate_tool, HumanEscalationAgentV7Input, and future renames)."
  matthew_declared_escalation_reason:
    lineage:
      - datalake_langfuse_clean.traces.output
    description: "Free-text reason the agent gave for attempting to escalate the user to human support, extracted from the escalating trace output at $.responses[0].content.hybrid_content.metadata[0].escalation_reason. Populated whenever flag_escalation_attempted = 1 (the escalation attempt), regardless of whether it resulted in an actual escalation. NULL when no trace in the session emitted a human_escalation response. When more than one trace escalates in the same session, MAX() picks one reason lexicographically — rare, but not deterministic."
  matthew_declared_escalation_queue:
    lineage:
      - datalake_langfuse_clean.traces.output
    description: "Queue the agent attempted to route the escalation to, extracted from the escalating trace output at $.responses[0].content.hybrid_content.metadata[0].queue_name (e.g. 'OPS COBRANÇA ATIVO [POS]'). Populated whenever flag_escalation_attempted = 1 (the escalation attempt); it reflects the agent's intended target, not necessarily where the session was actually routed. Distinct from first_queue / last_queue, which are the queues that actually handled the session on the chatbot platform. NULL when no trace in the session emitted a human_escalation response. When more than one trace escalates in the same session, MAX() picks one queue lexicographically — rare, but not deterministic."
  confirm_negotiation_count_v3:
    lineage:
      - datalake_langfuse_clean.observations.name
      - datalake_langfuse_clean.observations.output
    description: Count of Langfuse TOOL observations where obs.name = create_negotiation_v1
      and obs.output IS NULL; each null output represents one confirmation prompt sent to
      the user before the deal is committed. This is the MCP-based equivalent of
      confirm_negotiation_count for the new BFB agent (V3+). Zero when no such observation
      appears in the session.
  has_prorated_rent_error:
    lineage:
      - datalake_langfuse_clean.observations.output
      - datalake_langfuse_clean.observations.type
    description: "1 if any Langfuse TOOL observation output in the session contains the
      prorated rent error text (pattern: '%prorated rent%' or '%adjustments to the rent
      value%'). This error is raised by the annual-tax / paid-invoices report tools when a
      contract has rent value adjustments that prevent a clean invoice summary. Matches both
      the V2 graph-node tool (get_yearly_paid_invoices_report_tool) and the V3+ MCP tools
      (get_annual_tax_report_v1, get_paid_invoices_annual_report_v1), so it is populated for
      V2 and V3-or-later sessions. Sourced from a sibling CTE scoped to TOOL observations only; 0 when
      no matching output is found."
  ts_first_observation:
    lineage:
      - datalake_langfuse_clean.observations.ts_started
    description: "Timestamp of the first tracked Langfuse observation recorded for the session (over the named observations aggregated in this table)."
  ts_last_observation:
    lineage:
      - datalake_langfuse_clean.observations.ts_ended
    description: "Timestamp of the last tracked Langfuse observation recorded for the session (over the named observations aggregated in this table)."
  year:
    lineage:
      - datalake_langfuse_clean.observations.ts_ended
      - datalake_langfuse_clean.observations.ts_started
    description: "Table partition calendar year from the maximum of observation end/start timestamps aggregated per Langfuse session."
  month:
    lineage:
      - datalake_langfuse_clean.observations.ts_ended
      - datalake_langfuse_clean.observations.ts_started
    description: "Table partition calendar month from the maximum of observation end/start timestamps aggregated per Langfuse session."
  day:
    lineage:
      - datalake_langfuse_clean.observations.ts_ended
      - datalake_langfuse_clean.observations.ts_started
    description: "Table partition calendar day from the maximum of observation end/start timestamps aggregated per Langfuse session."
