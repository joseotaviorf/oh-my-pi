dag:
  name: dw_evictions
  schedule_start_date: 2025,02,11
  owner: Data Fintech
  documentation:
    dag_purpose: Creates tables for evictions analysis in QuintoAndar context.
workflow:
  type: query_delta
  layer: dw
  custom_schema: evictions
  default_extraction_type: full
cluster:
  type: databricks_16_4_med_general_cluster
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE
  databricks_conn_id: databricks_new_env
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: "quintoandar_{{ var.value.environment }}"
