database_name: dw_evictions
table_name: fact_evictions
description: Fact table containing comprehensive eviction cases data aggregated by case, including case details, agency information, court data, process phases, expenses, financial information, and calculated lead times. Includes detailed stage information with dates and expenses for each process stage, enriched with contract wallet timeline data.
domain: Fintech
owner: juliana.hocihara@quintoandar.com.br
