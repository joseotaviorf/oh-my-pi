---
database_name: dw_evictions
table_name: fact_expenses
description: Fact table containing expense information from the cyber legal system, including case details, agency information, expense type descriptions, and expense status tracking. Based on 'Relatório de Custas - Fechamento de Lote'.
domain: Fintech
owner: juliana.hocihara@quintoandar.com.br
columns:
  sk_case:
    description: "Unique case identifier linking the expense to a specific legal case."
    lineage:
      - datalake_cyber_legal.expenses.id_case
  id_invoice:
    description: "Invoice identifier code - Mandatory field provided by attorney."
    lineage:
      - datalake_cyber_legal.expenses.id_invoice
  id_agency:
    description: "Agency identifier associated with the expense, linking to the agency responsible for the case."
    lineage:
      - datalake_cyber_legal.expenses.id_agency
  sk_expense:
    description: "Sequential expense identifier within the procedural stage."
    lineage:
      - datalake_cyber_legal.expenses.id_expense
  id_contract:
    description: "Account number that associates with the case."
    lineage:
      - datalake_cyber_legal.expenses.id_contract
  id_process:
    description: "Dossier number - Business primary key of the legal case."
    lineage:
      - datalake_cyber_legal.expenses.id_process
  id_stage:
    description: "Procedural stage identifier where expense is being registered."
    lineage:
      - datalake_cyber_legal.expenses.id_stage
  stage_description:
    description: "Description of the stage where the expense was registered."
    lineage:
      - datalake_cyber_legal.expenses.stage_description
  id_attorney:
    description: "Attorney or manager who registered the expense."
    lineage:
      - datalake_cyber_legal.expenses.id_attorney
  id_supervisor_attorney:
    description: "Supervisor attorney or manager who authorized the expense."
    lineage:
      - datalake_cyber_legal.expenses.id_supervisor_attorney
  invoice_description:
    description: "Invoice description provided by attorney."
    lineage:
      - datalake_cyber_legal.expenses.invoice_description
  action:
    description: "Type of legal process or case classification (process_type from case table)."
    lineage:
      - datalake_cyber_legal.expenses.action
  expense_type:
    description: "Expense type as parameterized in CyberEngine and selected by attorney."
    lineage:
      - datalake_cyber_legal.expenses.expense_type
  expense_subtype:
    description: "Expense subtype as parameterized in CyberEngine."
    lineage:
      - datalake_cyber_legal.expenses.expense_subtype
  expense_type_description:
    description: "Human-readable description of the expense type, enriched from the values list."
    lineage:
      - datalake_cyber_legal.expenses.expense_type_description
  agency_name:
    description: "Human-readable name of the agency associated with the expense."
    lineage:
      - datalake_cyber_legal.expenses.agency_name
  debtor_name:
    description: "Name of the debtor in the associated legal case."
    lineage:
      - datalake_cyber_legal.expenses.debtor_name
  case_type:
    description: "Type of legal case associated with the expense."
    lineage:
      - datalake_cyber_legal.expenses.case_type
  expense_amount:
    description: "Monetary amount of the expense in the original currency."
    lineage:
      - datalake_cyber_legal.expenses.expense_amount
  expense_description:
    description: "Detailed description of the specific expense, providing additional context about the expense purpose."
    lineage:
      - datalake_cyber_legal.expenses.expense_description
  is_authorized:
    description: "Expense authorization flag (TRUE=authorized, FALSE=not authorized)."
    lineage:
      - datalake_cyber_legal.expenses.is_authorized
  is_payment_made:
    description: "Payment made flag indicating if payment was realized (TRUE/FALSE)."
    lineage:
      - datalake_cyber_legal.expenses.is_payment_made
  is_reimbursed:
    description: "Expense reimbursement status (TRUE=reimbursed, FALSE=not reimbursed)."
    lineage:
      - datalake_cyber_legal.expenses.is_reimbursed
  dt_lauch:
    description: "Date when the expense was captured in the system (launch date)."
    lineage:
      - datalake_cyber_legal.expenses.dt_lauch
  dt_expense_real:
    description: "Invoice date when expense was actually incurred - Mandatory field."
    lineage:
      - datalake_cyber_legal.expenses.dt_expense_real
  dt_authorized:
    description: "Date of expense authorization or rejection."
    lineage:
      - datalake_cyber_legal.expenses.dt_authorized
  dt_reimbursed:
    description: "Date when the expense was reimbursed, indicating completion of the expense process."
    lineage:
      - datalake_cyber_legal.expenses.dt_reimbursed
  dt_recovered:
    description: "Date when expense was recovered from client."
    lineage:
      - datalake_cyber_legal.expenses.dt_recovered
  ts_load:
    description: "Timestamp when the record was loaded into the data warehouse."
    lineage:
      - datalake_evictions.dim_expenses.ts_load
