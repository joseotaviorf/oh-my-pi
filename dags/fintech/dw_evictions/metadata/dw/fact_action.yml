---
database_name: dw_evictions
table_name: fact_action
description: Fact table containing action information from CyberLegal system, including action, result, and complement.
domain: Fintech
owner: juliana.hocihara@quintoandar.com.br
columns:
  sk_case:
    description: "Unique surrogate key for the legal case."
    lineage:
      - datalake_cyber_legal_clean.logs_juridical.id_case
  contract:
    description: "External contract identifier for the account under legal proceedings."
    lineage:
      - datalake_cyber_legal.evictions_base.contract
  office:
    description: "Office of the attorney assigned to the legal case."
    lineage:
      - datalake_cyber_legal.evictions_base.office
  last_stage:
    description: "Last stage of the legal case."
    lineage:
      - datalake_cyber_legal.evictions_base.last_stage
  action:
    description: "Action code identifier."
    lineage:
      - datalake_cyber_legal.evictions_base.action
  action_description:
    description: "Description of the action (Arbitral, Extrajudicial or Judicial)"
    lineage:
      - datalake_cyber_legal.evictions_base.action_description
  result:
    description: "Result code identifier."
    lineage:
      - datalake_cyber_legal.evictions_base.result
  result_description:
    description: "Description of the case result"
    lineage:
      - datalake_cyber_legal.evictions_base.result_description
  complement:
    description: "Complement code identifier."
    lineage:
      - datalake_cyber_legal.evictions_base.complement
  complement_description:
    description: "Description of the complement (Carta)"
    lineage:
      - datalake_cyber_legal.evictions_base.complement_description
  comment:
    description: "Comment registered for the legal action."
    lineage:
      - datalake_cyber_legal_clean.logs_juridical.comment
  ts_activity:
    description: "Timestamp when the legal activity occurred."
    lineage:
      - datalake_cyber_legal_clean.logs_juridical.ts_activity
