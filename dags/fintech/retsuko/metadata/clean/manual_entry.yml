database_name: datalake_retsuko_clean
table_name: manual_entry
owner: guilherme.sacramento@quintoandar.com.br
domain: Fintech
description: Clean-layer table sourced from Retsuko, a replica of the Seu Barriga rental billing system. Audit and manual accounting entries from Seu Barriga.
columns:
  id:
    lineage:
      - datalake_retsuko_raw.manual_entry.id
    description: Financial attribute representing id on the manual_entry dataset.
  id_contract:
    lineage:
      - datalake_retsuko_raw.manual_entry.contract_id
    description: Contract ID from Retsuko source. It can't be joined with contract table from EBDB.
  id_from_account:
    lineage:
      - datalake_retsuko_raw.manual_entry.from_account
    description: ID account from Retsuko source. It can't be joined with user table from EBDB.
  id_to_account:
    lineage:
      - datalake_retsuko_raw.manual_entry.to_account
    description: ID account from Retsuko source. It can't be joined with user table from EBDB.
  id_external:
    lineage:
      - datalake_retsuko_raw.manual_entry.external_id
    description: Identifier for the external referenced by this financial record.
  id_from_entry:
    lineage:
      - datalake_retsuko_raw.manual_entry.from_entry
    description: Origin ID entry from Retsuko source.
  id_to_entry:
    lineage:
      - datalake_retsuko_raw.manual_entry.to_entry
    description: Receiver ID entry from Retsuko source.
  id_audit:
    lineage:
      - datalake_retsuko_raw.manual_entry.audit
    description: Identifier for the audit referenced by this financial record.
  producer:
    lineage:
      - datalake_retsuko_raw.manual_entry.producer
    description: Producer type of the entry.
  type:
    lineage:
      - datalake_retsuko_raw.manual_entry.type
    description: Financial attribute representing type on the manual_entry dataset.
  description:
    lineage:
      - datalake_retsuko_raw.manual_entry.description
    description: Description of the entry bill.
  amount:
    lineage:
      - datalake_retsuko_raw.manual_entry.amount
    description: Amount value of the bill.
  installment_number:
    lineage:
      - datalake_retsuko_raw.manual_entry.installment_number
    description: Financial attribute representing installment number on the manual_entry dataset.
  installment_total_number:
    lineage:
      - datalake_retsuko_raw.manual_entry.installment_total_number
    description: Financial attribute representing installment total number on the manual_entry dataset.
  installment_total_amount:
    lineage:
      - datalake_retsuko_raw.manual_entry.installment_total_amount
    description: Total installment number of the all entries.
  is_removed:
    lineage:
      - datalake_retsuko_raw.manual_entry.is_removed
    description: Boolean value to check if the record was removed.
  source_external_id:
    lineage:
      - datalake_retsuko_raw.manual_entry.source_external_id
    description: External identifier of the manual entry in its originating source system.
  normality_control:
    lineage:
      - datalake_retsuko_raw.manual_entry.normality_control
    description: Normality control flag or code associated with the manual entry record.
  source:
    lineage:
      - datalake_retsuko_raw.manual_entry.source
    description: Origin system or channel that produced the manual entry.
  accrual_year_month:
    lineage:
      - datalake_retsuko_raw.manual_entry.accrual_year_month
    description: Financial attribute representing accrual year month on the manual_entry dataset.
  dt_accrued:
    lineage:
      - datalake_retsuko_raw.manual_entry.accrued_date
    description: Competence date of the entry.
  ts_last_operation:
    lineage:
      - datalake_retsuko_raw.manual_entry.last_operation_date
    description: Timestamp of the last operation date.
  ts_retsuko_created:
    lineage:
      - datalake_retsuko_raw.manual_entry.retsuko_created_at
    description: Timestamp when the manual entry row was created in Retsuko.
  ts_retsuko_updated:
    lineage:
      - datalake_retsuko_raw.manual_entry.retsuko_updated_at
    description: Timestamp when the manual entry row was last updated in Retsuko.
  ts_created:
    lineage:
      - datalake_retsuko_raw.manual_entry.created_at
    description: Record creation timestamp in the upstream source system.
  ts_updated:
    lineage:
      - datalake_retsuko_raw.manual_entry.updated_at
    description: Last update timestamp of the record in the upstream source system.
