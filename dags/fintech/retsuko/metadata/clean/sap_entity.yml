database_name: datalake_retsuko_clean
table_name: sap_entity
description:
  Clean-layer table sourced from Retsuko, a replica of the Seu Barriga rental billing system.
  SAP integration entities synced from Seu Barriga financial operations.
owner: guilherme.sacramento@quintoandar.com.br
domain: Fintech
