      - datalake_retsuko_raw.recurrent_credit_card.cancel_reason
    description: Financial attribute representing cancel reason on the recurrent_credit_card dataset.
  service_fee:
    lineage:
      - datalake_retsuko_raw.recurrent_credit_card.service_fee
    description: Financial attribute representing service fee on the recurrent_credit_card dataset.
  charge_day:
    lineage:
      - datalake_retsuko_raw.recurrent_credit_card.charge_day
    description: Financial attribute representing charge day on the recurrent_credit_card dataset.
  active_from_year_month:
    lineage:
      - datalake_retsuko_raw.recurrent_credit_card.active_from_year_month
