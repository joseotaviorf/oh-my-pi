database_name: datalake_retsuko_clean
table_name: recurrent_credit_card
description:
  Clean-layer table sourced from Retsuko, a replica of the Seu Barriga rental billing system.
  Recurrent credit card subscriptions managed through Seu Barriga.
owner: guilherme.sacramento@quintoandar.com.br
domain: Fintech
columns:
  id:
    lineage:
      - datalake_retsuko_raw.recurrent_credit_card.id
    description: Financial attribute representing id on the recurrent_credit_card dataset.
  status:
