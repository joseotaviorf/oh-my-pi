database_name: datalake_retsuko_clean
table_name: payment_block
owner: guilherme.sacramento@quintoandar.com.br
domain: Fintech
description: Clean-layer table sourced from Retsuko, a replica of the Seu Barriga rental billing system. Contracts with blocked payments, such as judicial orders.
columns:
  id:
    description: "primary key for joins in retsuko"
    lineage:
      - datalake_retsuko_raw.payment_block.id
  id_external:
    description: "id that classifies the payment blocked in other systems"
    lineage:
      - datalake_retsuko_raw.payment_block.external_id
  id_contract:
    description: Rental or sale contract identifier linking this financial record to the lease agreement.
    lineage:
      - datalake_retsuko_raw.payment_block.contract_id
  id_activated_by_audit:
    description: Identifier for the activated by audit referenced by this financial record.
    lineage:
      - datalake_retsuko_raw.payment_block.activated_by_audit_id
  id_deactivated_by_audit:
    description: Identifier for the deactivated by audit referenced by this financial record.
    lineage:
      - datalake_retsuko_raw.payment_block.deactivated_by_audit_id
  ticket_number:
    description: "ticket number related to the paymet block from jira application"
    lineage:
      - datalake_retsuko_raw.payment_block.ticket_number
  reason:
    description: "specifies the kind of payment block (e.g.: judicial-order)"
    lineage:
      - datalake_retsuko_raw.payment_block.reason
  description:
    description: "optional that brings some reasons about the payment_blocked"
    lineage:
      - datalake_retsuko_raw.payment_block.description
  status:
    description: "The blocking marker can be active or inactive."
    lineage:
      - datalake_retsuko_raw.payment_block.status
  ts_activated:
    description: "datetime of blocking activation"
    lineage:
      - datalake_retsuko_raw.payment_block.activated_at
  ts_deactivated:
    description: "datetime of blocking deactivation"
    lineage:
      - datalake_retsuko_raw.payment_block.deactivated_at
  ts_synced:
    description: "datetime of payment block synced in database"
    lineage:
      - datalake_retsuko_raw.payment_block.synced_at
