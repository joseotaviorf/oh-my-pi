database_name: datalake_retsuko_clean
table_name: early_termination_fee
owner: guilherme.sacramento@quintoandar.com.br
domain: Fintech
description: Clean-layer table sourced from Retsuko, a replica of the Seu Barriga rental billing system. Fee installments for early termination (amounts, due dates, linked invoice and entries).
columns:
  id:
    description: "Primary key for joins in retsuko"
    lineage:
      - datalake_retsuko_raw.early_termination_fee.id
  id_external:
    description: "Fee row identifier in upstream systems"
    lineage:
      - datalake_retsuko_raw.early_termination_fee.external_id
  id_version_external:
    description: Identifier for the version external referenced by this financial record.
    lineage:
      - datalake_retsuko_raw.early_termination_fee.version_external_id
  id_early_termination_external:
    description: "External id of the parent early termination"
    lineage:
      - datalake_retsuko_raw.early_termination_fee.early_termination_external_id
  id_manual_entry_external:
    description: "External id of the related manual entry"
    lineage:
      - datalake_retsuko_raw.early_termination_fee.manual_entry_external_id
  id_external_reversed_entry:
    description: "If created to reverse another entry, external id of the original entry"
    lineage:
      - datalake_retsuko_raw.early_termination_fee.reversed_entry_external_id
  version_type:
    description: Financial attribute representing version type on the early_termination_fee dataset.
    lineage:
      - datalake_retsuko_raw.early_termination_fee.version_type
  accrual_year_month:
    description: "Accrual period for the fee installment"
    lineage:
      - datalake_retsuko_raw.early_termination_fee.accrual_year_month
  due_amount:
    description: "Amount due for this installment"
    lineage:
      - datalake_retsuko_raw.early_termination_fee.due_amount
  installment_number:
    description: Financial attribute representing installment number on the early_termination_fee dataset.
    lineage:
      - datalake_retsuko_raw.early_termination_fee.installment_number
  id_invoice_external:
    description: "External id of the related invoice"
    lineage:
      - datalake_retsuko_raw.early_termination_fee.invoice_external_id
  ts_due:
    description: "Due date of the installment"
    lineage:
      - datalake_retsuko_raw.early_termination_fee.due_date
  ts_published:
    description: "Datetime when the fee row was published"
    lineage:
      - datalake_retsuko_raw.early_termination_fee.published_at
  ts_retsuko_created:
    description: "Datetime when the row was created in Retsuko"
    lineage:
      - datalake_retsuko_raw.early_termination_fee.retsuko_created_at
  ts_retsuko_updated:
    description: "Datetime when the row was last updated in Retsuko"
    lineage:
      - datalake_retsuko_raw.early_termination_fee.retsuko_updated_at
