---
database_name: datalake_retsuko_clean
table_name: entry
owner: ae-finance-fintech@quintoandar.com.br
domain: Fintech
description: Data from the entry table containing invoice entry information and status details
columns:
  id:
    description: "Unique identifier of the entry in Retsuko"
    lineage:
      - datalake_retsuko_raw.entry.id
  id_external:
    description: "External identifier of the entry in the source system"
    lineage:
      - datalake_retsuko_raw.entry.external_id
  id_invoice:
    description: "Identifier of the invoice associated to this entry"
    lineage:
      - datalake_retsuko_raw.entry.invoice_id
  id_contract:
    description: "Identifier of the contract related to this entry"
    lineage:
      - datalake_retsuko_raw.entry.contract_id
  id_from_account:
    description: "Source account identifier debited in the transaction"
    lineage:
      - datalake_retsuko_raw.entry.from_account_id
  id_to_account:
    description: "Destination account identifier credited in the transaction"
    lineage:
      - datalake_retsuko_raw.entry.to_account_id
  id_external_reversed_entry:
    description: "If the entry was created to cancel (reverse) other entry, with this ID you can track the original one that was reversed"
    lineage:
      - datalake_retsuko_raw.entry.reversed_entry_external_id
  id_audit:
    description: "Audit event identifier associated to this entry"
    lineage:
      - datalake_retsuko_raw.entry.audit_id
  accounting_transaction_identifier:
    description: "Transactional entries are created in pairs (on the IQ and PP invoice). This hash can identify this pair."
    lineage:
      - datalake_retsuko_raw.entry.accounting_transaction_identifier
  amount:
    description: "Monetary amount of the entry"
    lineage:
      - datalake_retsuko_raw.entry.amount
  bill_item:
    description: "Billing item associated with the entry"
    lineage:
      - datalake_retsuko_raw.entry.bill_item
  description:
    description: "Free-text description of the entry"
    lineage:
      - datalake_retsuko_raw.entry.description
  status:
    description: "Indicates if a entry is not-invoiceable (pending) or not (success)"
    lineage:
      - datalake_retsuko_raw.entry.status
  producer:
    description: "System or service that produced the entry"
    lineage:
      - datalake_retsuko_raw.entry.producer
  is_not_invoicable:
    description: "Indicates if a entry is not-invoiceable"
    lineage:
      - datalake_retsuko_raw.entry.not_invoicable
  accrual_year_month:
    description: "Accrual period in year-month (YYYYMM)"
    lineage:
      - datalake_retsuko_raw.entry.accrual_year_month
  due_year_month:
    description: "Due period in year-month (YYYYMM)"
    lineage:
      - datalake_retsuko_raw.entry.due_year_month
  ts_created:
    description: "Creation timestamp in the source system"
    lineage:
      - datalake_retsuko_raw.entry.created_at
  ts_synced:
    description: "Date that indicates when the entry was synced from SB to Retsuko"
    lineage:
      - datalake_retsuko_raw.entry.synced_at
  ts_retsuko_created:
    description: "Creation timestamp of the entry in Retsuko"
    lineage:
      - datalake_retsuko_raw.entry.retsuko_created_at
  ts_retsuko_updated:
    description: "Last update timestamp of the entry in Retsuko"
    lineage:
      - datalake_retsuko_raw.entry.retsuko_updated_at
  year:
    description: Year information
    lineage:
      - datalake_retsuko_raw.entry.year
  month:
    description: Month information
    lineage:
      - datalake_retsuko_raw.entry.month
  day:
    description: Day information
    lineage:
      - datalake_retsuko_raw.entry.day
