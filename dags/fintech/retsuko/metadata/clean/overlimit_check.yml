database_name: datalake_retsuko_clean
table_name: overlimit_check
owner: guilherme.sacramento@quintoandar.com.br
domain: Fintech
description: Clean-layer table sourced from Retsuko, a replica of the Seu Barriga rental billing system. Records of overlimit verification and resolution linked to agreements and contracts (reference entity, status, verifier and fixer).
columns:
  id:
    description: "Primary key for joins in retsuko"
    lineage:
      - datalake_retsuko_raw.overlimit_check.id
  id_external:
    description: "External identifier of the overlimit check in upstream systems"
    lineage:
      - datalake_retsuko_raw.overlimit_check.external_id
  id_contract:
    description: "Identifier of the related contract"
    lineage:
      - datalake_retsuko_raw.overlimit_check.contract_id
  cdc_transaction_id:
    description: "CDC replication transaction identifier from the source change event that produced or updated this overlimit check row"
    lineage:
      - datalake_retsuko_raw.overlimit_check.cdc_transaction_id
  id_reference:
    description: "Identifier of the referenced entity (e.g. agreement or related record)"
    lineage:
      - datalake_retsuko_raw.overlimit_check.reference_id
  reference_type:
    description: "Type of the referenced entity discriminating what reference_id points to"
    lineage:
      - datalake_retsuko_raw.overlimit_check.reference_type
  status:
    description: "Current status of the overlimit check workflow"
    lineage:
      - datalake_retsuko_raw.overlimit_check.status
  id_verified_by:
    description: "Identifier of the actor or system that verified the overlimit condition"
    lineage:
      - datalake_retsuko_raw.overlimit_check.verified_by
  ts_verified:
    description: "Datetime when the overlimit check was verified"
    lineage:
      - datalake_retsuko_raw.overlimit_check.verified_at
  id_fixed_by:
    description: "Identifier of the actor or system that applied the fix for the overlimit"
    lineage:
      - datalake_retsuko_raw.overlimit_check.fixed_by
  ts_fixed:
    description: "Datetime when the overlimit issue was fixed"
    lineage:
      - datalake_retsuko_raw.overlimit_check.fixed_at
  ts_jira_sent:
    description: "Datetime when the overlimit check was sent to Jira for operational follow-up"
    lineage:
      - datalake_retsuko_raw.overlimit_check.jira_sent_at
  ts_created:
    description: "Record creation datetime in source"
    lineage:
      - datalake_retsuko_raw.overlimit_check.created_at
  ts_updated:
    description: "Record last update datetime in source"
    lineage:
      - datalake_retsuko_raw.overlimit_check.updated_at
  op_cdc:
    description: "CDC operation type for this overlimit check row (insert, update, or delete)"
    lineage:
      - datalake_retsuko_raw.overlimit_check.op_cdc
    categories:
      r: "Read or snapshot of an existing overlimit check"
      c: "Creation of a new overlimit check"
      u: "Update to an existing overlimit check"
      d: "Deletion of an overlimit check"
  ts_cdc_transaction:
    description: "Timestamp when the CDC connector captured the overlimit check change event"
    lineage:
      - datalake_retsuko_raw.overlimit_check.ts_cdc_transaction
  ts_database_transaction:
    description: "Timestamp when the source database committed the overlimit check change"
    lineage:
      - datalake_retsuko_raw.overlimit_check.ts_database_transaction
