dag:
  name: retsuko
  schedule_start_date: 2021, 2, 20
  schedule_interval: 0 8 * * *
  owner: Data Fintech
  documentation:
    dag_purpose: |
      Process data from Retsuko database (postgresql), retrieved using the CDC process. [Retsuko](https://github.com/quintoandar/retsuko) is responsible
      for Extracting financial data, Transforming and Loading it (ETL) into Databricks and Trino to be able to generate financial reports.
      It does not create or own any information and it is not its purpose to do that. All the data it has comes from other financial
      services (today is only [SeuBarriga](https://github.com/quintoandar/seubarriga)).
workflow:
  type: cdc
  layer: raw
  database_type: postgres
  source_database: retsuko
  source_schema: public
  custom_schema: retsuko
  dbutils_secret_key: RETSUKO_DB
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, macros.ds_add(ds, 1), 'load_end_date') }}"
  tables_customization:
    account:
      get_table_metrics:
        count: external_id
    audit:
      get_table_metrics:
        count: id
    boleto:
      get_table_metrics:
        count: external_id
        max: retsuko_updated_at
    contract:
      get_table_metrics:
        count: external_id
    credit_card_payment:
      get_table_metrics:
        count: external_id
    entry:
      get_table_metrics:
        count: external_id
        max: retsuko_updated_at
    file: {}
    invoice:
      get_table_metrics:
        count: external_id
        max: retsuko_updated_at
    invoice_entry:
      raw_primary_keys: [invoice_id, entry_id]
      get_table_metrics:
        count: entry_id
        max: created_at
    manual_entry: {}
    monthly_closing_checks:
      get_table_metrics:
        count: id
    recurrent_credit_card: {}
    sap_entity:
      get_table_metrics:
        count: id
cluster:
  type: custom_cluster
  custom_configurations:
    autotermination_minutes: 20
    driver_node_type_id: r5.xlarge
    node_type_id: r5.xlarge
    num_workers: 3
    spark_version: 12.2.x-scala2.12
    aws_attributes:
      first_on_demand: 1
      spot_bid_price_percent: 100
      zone_id: us-east-1d
      ebs_volume_size: 200
      availability: SPOT_WITH_FALLBACK
