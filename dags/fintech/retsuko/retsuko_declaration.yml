dag:
  name: retsuko
  owner: Data Fintech
  schedule_interval: 0 8 * * *
  documentation:
    dag_purpose: |
      Retrieve data from Retsuko database (postgresql). [Retsuko](https://github.com/quintoandar/retsuko) is responsible to Extract financial data, Transform and Load it (ETL) in Metabase to be able to generate financial reports. It does not create or owns any information and it is not its purpose to do that. All the data it has comes from other financial services (today is only [SeuBarriga](https://github.com/quintoandar/seubarriga)).
workflow:
  type: database_pull
  layer: raw
  database_type: postgres
  custom_schema: retsuko
  dbutils_secret_key: RETSUKO_DB
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, macros.ds_add(ds, 1), 'load_end_date') }}"
  tables_customization:
    account:
      extraction_type: full
      get_table_metrics:
        count: external_id
    boleto:
      date_filter_column: retsuko_updated_at
      extraction_type: incremental
      partitions: ["year", "month", "day"]
      get_table_metrics:
        count: external_id
        max: retsuko_updated_at
    contract:
      extraction_type: full
      get_table_metrics:
        count: external_id
    credit_card_payment:
      extraction_type: full
      get_table_metrics:
        count: external_id
    entry:
      date_filter_column: retsuko_updated_at
      extraction_type: incremental
      partitions: ["year", "month", "day"]
      get_table_metrics:
        count: external_id
        max: retsuko_updated_at
    file:
      extraction_type: full
    invoice:
      date_filter_column: retsuko_updated_at
      extraction_type: incremental
      partitions: ["year", "month", "day"]
      get_table_metrics:
        count: external_id
        max: retsuko_updated_at
    manual_entry:
      extraction_type: full
    monthly_closing_checks:
      extraction_type: full
      get_table_metrics:
        count: id
    recurrent_credit_card:
      extraction_type: full
    sap_entity:
      extraction_type: full
      get_table_metrics:
        count: id
cluster:
  type: databricks_12_2_med_general_cluster
