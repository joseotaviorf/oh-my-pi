---
database_name: datalake_debt_recovery
table_name: debt
owner: juliana.hocihara@quintoandar.com.br
domain: Fintech
description:
  Enriched view of overdue invoice lines included in a debt-recovery negotiation,
  with bill status and fee breakdown.
columns:
  id_invoice:
    description: Overdue invoice linked to the debt line.
    lineage:
      - datalake_trato_feito_clean.debt.id_external
  id_contract:
    description: Rental contract associated with the negotiation.
    lineage:
      - datalake_trato_feito_clean.negotiation.id_debtor_external
  debtor:
    description:
      Who owes the debt, combining debtor origin and role (e.g. tenant
      or landlord).
    lineage:
      - datalake_trato_feito_clean.debtor.origin
      - datalake_trato_feito_clean.debtor.type
  our_number:
    description: Bank slip identifier for the linked bill.
    lineage:
      - datalake_trato_feito_clean.bill.our_number
  external_sub_status:
    description: Detailed collections status reported by the external agency.
    lineage:
      - datalake_trato_feito_clean.bill.external_sub_status
  external_status:
    description: High-level collections status reported by the external agency.
    lineage:
      - datalake_trato_feito_clean.bill.external_status
  purpose:
    description: Bill frequency type (e.g. monthly rent or extra charge).
    lineage:
      - datalake_trato_feito_clean.bill.purpose
  due_amount:
    description:
      Amount due on the bill, falling back to the original debt when the
      bill amount is missing.
    lineage:
      - datalake_trato_feito_clean.debt.original_amount
      - datalake_trato_feito_clean.bill.due_amount
  interest_fee_amount:
    description: Interest applied to the overdue amount.
    lineage:
      - datalake_trato_feito_clean.debt.interest_fee_amount
  fine_fee_amount:
    description: Late-payment fine applied to the overdue amount.
    lineage:
      - datalake_trato_feito_clean.debt.fine_fee_amount
  discount_amount:
    description: Discount granted on the debt line.
    lineage:
      - datalake_trato_feito_clean.debt.discount_amount
  debt_amount:
    description: Total owed after interest and fines, minus discounts.
    lineage:
      - datalake_trato_feito_clean.debt.original_amount
      - datalake_trato_feito_clean.debt.interest_fee_amount
      - datalake_trato_feito_clean.debt.fine_fee_amount
      - datalake_trato_feito_clean.debt.discount_amount
  paid_amount:
    description: Amount already paid on the linked bill.
    lineage:
      - datalake_trato_feito_clean.bill.paid_amount
  dt_due:
    description: Due date of the linked bill.
    lineage:
      - datalake_trato_feito_clean.bill.dt_due
  dt_paid:
    description: Date when the linked bill was paid.
    lineage:
      - datalake_trato_feito_clean.bill.dt_paid
  dt_created:
    description: Date when the linked bill was created.
    lineage:
      - datalake_trato_feito_clean.bill.ts_created
  dt_debt_created:
    description: Date when the debt line was registered in recovery.
    lineage:
      - datalake_trato_feito_clean.debt.ts_created
  ts_load:
    description: When this enriched row was loaded by the pipeline.
    lineage:
      - datalake_trato_feito_clean.debt.NOW()
