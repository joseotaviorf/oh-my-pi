---
database_name: datalake_debt_recovery
table_name: negotiation
owner: athos.sampayo@quintoandar.com.br
domain: fintech
description: "Enrich table focused on Negotiation context for Debt Recovery"
columns:
  id_negotiation:
    description: "Negotiation unique ID"
    lineage:
      - datalake_trato_feito_clean.negotiation.id
  id_negotiation_recupera:
    description: "The negotiation ID from Recupera"
    lineage:
      - datalake_trato_feito_clean.negotiation.id_collector_external
  id_contract:
    description: "Contract unique ID"
    lineage:
      - datalake_trato_feito_clean.negotiation.id_debtor_external
  status:
    description: "Status of the negotiation"
    lineage:
      - datalake_trato_feito_clean.negotiation.status
  qt_installments:
    description: "Amount of Installments"
    lineage:
      - datalake_trato_feito_clean.installment.id
  qt_installments_paid:
    description: "Amount of paid installments"
    lineage:
      - datalake_trato_feito_clean.installment.id
  total_expected_amount:
    description: "Installment total amount"
    lineage:
      - datalake_trato_feito_clean.installment.total_amount
  paid_amount:
    description: "Installment paid amount"
    lineage:
      - datalake_trato_feito_clean.installment.total_amount
  negotiation_original_amount:
    description: "Negotiation original amount"
    lineage:
      - datalake_trato_feito_clean.debt.original_amount
  negotiation_discount_amount:
    description: "Negotiation discount amount"
    lineage:
      - datalake_trato_feito_clean.debt.discount_amount
  negotiation_fees_amount:
    description: "Negotiation fees amount"
    lineage:
      - datalake_trato_feito_clean.debt.interest_fee_amount
      - datalake_trato_feito_clean.debt.fine_fee_amount
  breached_installment:
    description: "Breached installment number"
  is_contract_recurrent_debtor:
    description: "Indicates if it is a recurrent contract debtor"
    lineage:
      - datalake_trato_feito_clean.negotiation.id_debtor_external
  has_renegotiated:
    description: "Indicates if there was a renegotiation"
    lineage:
      - datalake_trato_feito_clean.accounting_installment.id
  dt_expected_end:
    description: "Installment due date"
    lineage:
      - datalake_trato_feito_clean.installment.dt_due
  ts_paid_all:
    description: "Timestamp indicating when all installments have been paid"
    lineage:
      - datalake_trato_feito_clean.installment.ts_updated
  ts_breach:
    description: "Timestamp indicating when a breach occurred"
    lineage:
      - datalake_trato_feito_clean.installment.ts_expired
  ts_created_at:
    description: "Timestamp for when negotiation was created"
    lineage:
      - datalake_trato_feito_clean.negotiation.ts_created
