  residual_costs_without_discount:
    description: Residual costs amount without discount (camposDesconto campo U1VLCUSREAG, vlrSemDesconto).
    lineage:
      - datalake_trato_feito_clean.billing.payload
  agreement_costs_with_discount:
    description: Agreement costs amount with discount (camposDesconto campo U1VLCUSTASAG, vlrComDesconto).
    lineage:
