dag:
  name: invoice_preview
  schedule_start_date: 2020, 11, 1
  schedule_interval: 0 9,16 * * *
  owner: Data Fintech
  documentation:
    dag_purpose: |
      Retrieves data from Invoice Preview CSVs generated by SeuBarriga service.
      SeuBarriga exports run daily at ~01:00 BRT. A second afternoon batch is sent on
      billing days (22nd through month-end); on days 1-21 the 16:00 run finds no separate
      afternoon batch on S3 and skips the raw write (morning snapshot preserved).
      This DAG ingests at 09:00 the morning export (partition overwrite) and at 16:00
      the afternoon batch only when it exists (partition append). Raw and clean both
      split batches from the Unix timestamp prefix in invoice_filename (hour BRT before
      12:00 morning, else afternoon) so a long morning dump is ingested in full.
      Stakeholders consume validation-ready
      snapshots from datalake_invoice_preview.invoice_preview (enrich_invoice_preview DAG):
      morning export_slot only. The clean table keeps both batches for pipeline debugging.
    additional_information: |
      ### Manual backfill (Trigger DAG w/ config)

      Set `load_start_date` / `load_end_date` in the trigger form (or JSON conf) and add
      `export_slot` to force morning or afternoon without depending on trigger time:

      ```json
      {
        "run_type": "test_run",
        "load_start_date": "2026-07-27",
        "load_end_date": "2026-07-27",
        "export_slot": "morning"
      }
      ```

      - `morning`: overwrite partition with morning CSVs (use for enrich stakeholders).
      - `afternoon`: append afternoon CSVs when a separate batch exists on S3.
      - Omit `export_slot` (or use scheduled runs): inferred from job start hour BRT.
workflow:
  layer: raw
  type: custom_ingestion
  load_spark_job: load_csv_into_datalake
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_end | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_end | ds, 'load_end_date') }}"
  spark_job_arguments:
  - "{environment}"
  - "{bucket}"
  - "{dag_name}"
  - s3://5a-seubarriga/prod/report
  - "{load_start_date}"
  - "{load_end_date}"
  - "{table_name}"
  default_extraction_type: incremental
  default_partitions: [year, month, day]
  tables_customization:
    invoice_preview:
      extra_spark_job_arguments:
      - csv
      - header: "true"
        escape: '"'
        multiLine: "true"
      - "--export-slot"
      - "{{ dag_run.conf.get('export_slot', 'auto') if dag_run.conf else 'auto' }}"
