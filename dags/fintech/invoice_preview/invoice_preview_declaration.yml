dag:
  name: invoice_preview
  schedule_start_date: 2020, 11, 1
  schedule_interval: 0 9,16 * * *
  owner: Data Fintech
  documentation:
    dag_purpose: |
      Retrieves data from Invoice Preview CSVs generated by SeuBarriga service.
      SeuBarriga exports run daily at ~01:00 BRT and, when available, a second batch
      at ~12:00 BRT. This DAG ingests at 09:00 (~09:30 in the lake) the morning export
      (partition overwrite, export_slot=morning) and again at 16:00 (~16:30) the afternoon
      batch only (partition append, export_slot=afternoon) when a separate afternoon batch
      exists on S3. Morning and afternoon loads keep distinct ts_load values in clean.
      Stakeholders consume validation-ready snapshots from
      datalake_invoice_preview.invoice_preview (enrich_invoice_preview DAG): a full-refresh
      table with the morning export_slot batch only (no partition filter required), including
      invoice_filename. Applies sign convention, blocked rename, and latest morning ts_load
      on the most recent load day. The clean table datalake_invoice_preview_clean.invoice_preview
      remains the raw-ingestion-aligned history for pipeline debugging.
workflow:
  layer: raw
  type: custom_ingestion
  load_spark_job: load_csv_into_datalake
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_end | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_end | ds, 'load_end_date') }}"
  spark_job_arguments:
  - "{environment}"
  - "{bucket}"
  - "{dag_name}"
  - s3://5a-seubarriga/prod/report
  - "{load_start_date}"
  - "{load_end_date}"
  - "{table_name}"
  default_extraction_type: incremental
  default_partitions: [year, month, day]
  tables_customization:
    invoice_preview:
      extra_spark_job_arguments:
      - csv
      - header: "true"
        escape: '"'
        multiLine: "true"
