dag:
  name: invoice_preview
  schedule_start_date: 2020, 11, 1
  schedule_interval: 0 8,15 * * *
  owner: Data Fintech
  documentation:
    dag_purpose: |
      Retrieves data from Invoice Preview CSVs generated by SeuBarriga service.
      SeuBarriga exports run daily at ~01:00 BRT and, when available, a second batch
      at ~12:00 BRT. This DAG ingests the latest export batch at 08:00 (~08:30 in the
      lake) and again at 15:00 (~15:30) so stakeholders can consume morning and afternoon
      snapshots from datalake_invoice_preview_clean.invoice_preview.
workflow:
  layer: raw
  type: custom_ingestion
  load_spark_job: load_csv_into_datalake
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  spark_job_arguments:
  - "{environment}"
  - "{bucket}"
  - "{dag_name}"
  - s3://5a-seubarriga/prod/report
  - "{load_start_date}"
  - "{load_end_date}"
  - "{table_name}"
  default_extraction_type: incremental
  default_partitions: [year, month, day]
  tables_customization:
    invoice_preview:
      extra_spark_job_arguments:
      - csv
      - header: "true"
        escape: '"'
        multiLine: "true"
