---
database_name: datalake_collections_score_batch_inference_clean
table_name: collections_score_v3_output
owner: marcus.silva@quintoandar.com.br
domain: Fintech
description: Daily batch output of the collections scoring model, predicting payment
  likelihood per rental contract.
columns:
  id_contract:
    lineage:
    - datalake_collections_score_batch_inference_raw.collections_score_v3_output.output_data
    description: Rental contract scored by the model.
  model_name:
    lineage:
    - datalake_collections_score_batch_inference_raw.collections_score_v3_output.model_name
    description: Name of the scoring model that produced the result.
  model_version:
    lineage:
    - datalake_collections_score_batch_inference_raw.collections_score_v3_output.model_service
    description: Deployed version of the scoring model.
  payment_probability:
    lineage:
    - datalake_collections_score_batch_inference_raw.collections_score_v3_output.output_data
    description: Estimated probability that the contract will pay overdue amounts.
  score:
    lineage:
    - datalake_collections_score_batch_inference_raw.collections_score_v3_output.output_data
    description: Integer collections risk score derived from model output.
  flag_source:
    description: Environment label for the inference run (production scoring).
  dt_reference:
    lineage:
    - datalake_collections_score_batch_inference_raw.collections_score_v3_output.output_data
    description: Reference date used as input snapshot for the score.
  ts_inference:
    lineage:
    - datalake_collections_score_batch_inference_raw.collections_score_v3_output.timestamp
    description: When the batch scoring job finished for this contract.
  year:
    lineage:
    - datalake_collections_score_batch_inference_raw.collections_score_v3_output.year
    description: Year partition of the inference batch.
  month:
    lineage:
    - datalake_collections_score_batch_inference_raw.collections_score_v3_output.month
    description: Month partition of the inference batch.
  day:
    lineage:
    - datalake_collections_score_batch_inference_raw.collections_score_v3_output.day
    description: Day partition of the inference batch.
