dag:
  name: collections_score_batch_inference
  schedule_start_date: 2026, 3, 12
  schedule_interval: 0 2 * * *
  owner: Data Fintech
  criticality: High
  sla_deadline_localtime: "11:00"
  documentation:
    dag_purpose: Loads batch inference collections data into our Data Lake.

workflow:
  layer: raw
  type: custom_ingestion
  load_spark_job: load_parquet_into_datalake
  spark_job_arguments:
    - "{environment}"
    - "{bucket}"
    - "{schema}"
    - "{load_start_date}"
    - "{load_end_date}"
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, 1), 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, 2), 'load_end_date') }}"
  has_hive_sync: false
  execution_timeout_hours: 5
  default_extraction_type: incremental
  tables_customization:
    collections_score_v3_output:
      clean_partitions:
        - year
        - month
        - day

