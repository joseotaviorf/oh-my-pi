cluster:
  type: emr_7_12_consolidation_xs_memory_fleet_cluster
  emr_task_retries: 4
  emr_retry_delay_seconds: 1200
  custom_libraries:
  - pypi:
      package: numpy==1.26.4
  - pypi:
      package: pyarrow==15.0.2
  custom_configurations:
    aws_attributes:
      ebs_volume_size: 200
    spark_conf:
      spark.sql.execution.arrow.pyspark.enabled: 'false'
    task_nodes:
      instance_types:
      - r6g.xlarge
      - r7g.xlarge
      - r6i.xlarge
      target_on_demand: 0
      target_spot: 1
      allocation_strategy: price-capacity-optimized
      bid_price_percentage: 100
    core_nodes:
      target_on_demand: 2
      target_spot: 0
      instance_types:
      - r6g.xlarge
      - r7g.xlarge
      - r6i.xlarge
