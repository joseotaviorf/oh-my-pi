cluster:
  type: consolidation_xs_memory_cluster
  databricks_conn_id: databricks_new
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE
  custom_libraries:
  - pypi:
      package: numpy==1.26.4
  - pypi:
      package: pyarrow==15.0.2
  custom_configurations:
    aws_attributes:
      ebs_volume_size: 200
    spark_conf:
      spark.sql.execution.arrow.pyspark.enabled: 'false'
    num_workers: 3
    driver_node_type_id: r7g.xlarge
validation:
  cluster:
    type: emr_7_12_consolidation_xs_memory_fleet_cluster
    custom_configurations:
      task_nodes:
        instance_types:
        - r6g.xlarge
        - r7g.xlarge
        - r6i.xlarge
        target_on_demand: 0
        target_spot: 1
        allocation_strategy: price-capacity-optimized
        bid_price_percentage: 100
      core_nodes:
        target_on_demand: 2
        target_spot: 0
        instance_types:
        - r6g.xlarge
        - r7g.xlarge
        - r6i.xlarge
      aws_attributes:
        ebs_volume_size: 200
      spark_conf:
        spark.sql.execution.arrow.pyspark.enabled: 'false'
  allow_custom_spark_job: true
