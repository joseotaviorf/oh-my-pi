dag:
  name: itau_statements
  schedule_start_date: 2024, 8, 1
  schedule_interval: 0 2 * * *
  owner: Data Fintech
  documentation:
    dag_purpose: |
      Ingestion of Itau Statements API
workflow:
  layer: raw
  type: custom_ingestion
  load_spark_job: load_raw
  spark_job_arguments:
  - "{environment}"
  - "{bucket}"
  - "{dag_name}"
  - "{table_name}"
  - "{load_start_date}"
  - "{load_end_date}"
  - "{partitions}"
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, ds, 'load_end_date') }}"
  tables_customization:
    statement_879200452685:
      extraction_type: incremental
      partitions: ["year", "month", "day"]
      extra_spark_job_arguments:
      - statement_id: "879200452685"
    statement_879200452586:
      extraction_type: incremental
      partitions: ["year", "month", "day"]
      extra_spark_job_arguments:
      - statement_id: "879200452586"
    statement_879200494588:
      extraction_type: incremental
      partitions: ["year", "month", "day"]
      extra_spark_job_arguments:
      - statement_id: "879200494588"
    statement_067000392216:
      extraction_type: incremental
      partitions: ["year", "month", "day"]
      extra_spark_job_arguments:
      - statement_id: "067000392216"

cluster:
  type: databricks_13_3_med_general_cluster
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
