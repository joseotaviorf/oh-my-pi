---
database_name: datalake_recupera_homolog_clean
table_name: detail_movement
description: |
  "It stores all the payments of a debt.

  It contains all the original invoices (from table 'complementary_records') received through Recupera.
  Whenever a payment is made, whether with a negotiation or not (receipt made for original invoice), the original paid
  invoices are inserted in this table.

  In the event of an agreement, an installment may not be paid off in full. In this case,
  a line is inserted with amortization information and with the amount paid and the principal proportional to the payment. When
  there is another payment, a new line is inserted, with another receipt number.

  Original table name: TBL_MOVIMENTO_DETALHE.
  Get the original fields names at [Recupera - Mapeamento de tabelas e campos - Original x Datalake](https://docs.google.com/spreadsheets/d/1yaqkdlfQPrQhW30L46miKKcLD99T4OV6svHJHXIYA6Q/edit?usp=sharing)"
owner: bianca.martins@quintoandar.com.br
domain: fintech
columns:
  id_site:
    description: "Receipt location code. It is the PK (Primary Key) of the table."
    lineage:
      - datalake_recupera_homolog_raw.detail_movement.id_site
  dt_written_down:
    description: "Movement date (date at which it was written down). It is the PK (Primary Key) of the table."
    lineage:
      - datalake_recupera_homolog_raw.detail_movement.dt_written_down
  id_sequence_number:
    description: |
      "Sequence number - for the case of amortization of agreement.
      In this case we can have the same original installment several times,
      one for each receipt and this field prevents the key from duplicating.

      It represents the processing sequence as import control.

      It is the PK (Primary Key) of the table."
    lineage:
      - datalake_recupera_homolog_raw.detail_movement.id_sequence_number
  id_creditor:
