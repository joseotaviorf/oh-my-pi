---
database_name: datalake_recupera_homolog_clean
table_name: historical
description: |
  "Table containing registered occurrences.

  Original table name: TBL_HISTORICOS.
  Get the original fields names at [Recupera - Mapeamento de tabelas e campos - Original x Datalake](https://docs.google.com/spreadsheets/d/1yaqkdlfQPrQhW30L46miKKcLD99T4OV6svHJHXIYA6Q/edit?usp=sharing)"
owner: bianca.martins@quintoandar.com.br
domain: fintech
columns:
  id_historical:
    description: "History Code. It is the PK (Primary Key) of the table."
    lineage:
      - datalake_recupera_homolog_raw.historical.id_historical
  historical_description:
    description: "History Description"
    lineage:
      - datalake_recupera_homolog_raw.historical.historical_description
  has_complement:
    description: |
      "Indicates whether or not the historical requests a complement.
      If yes (True), a screen to fill in the text will be displayed when
      the occurrence is made. If not (False) then typing a complement will not be allowed. "
    lineage:
      - datalake_recupera_homolog_raw.historical.has_complement
  id_historical_situation:
    description: "Situation associated with history. The history will change the situation to it. It is the FK (Foreign Key) of the table."
    lineage:
      - datalake_recupera_homolog_raw.historical.id_historical_situation
  is_exportable_occurence:
    description: "Indicates whether it is an exportable occurrence or not (normal Occurrence)"
    lineage:
      - datalake_recupera_homolog_raw.historical.is_exportable_occurence
  ts_inclusion:
    description: "Date of inclusion of history"
    lineage:
      - datalake_recupera_homolog_raw.historical.ts_inclusion
  ts_last_registration:
    description: "Date of the last registration update"
    lineage:
      - datalake_recupera_homolog_raw.historical.ts_last_registration
  operator_name:
    description: "Operator name that made the last update"
    lineage:
      - datalake_recupera_homolog_raw.historical.operator_name
  is_preferencial_phone_updated:
    description: |
      "Indicates whether it updates the preferred phone or not.
      If you update after making the occurrence the
      phone used for dialing will be placed as the preferred phone"
    lineage:
      - datalake_recupera_homolog_raw.historical.is_preferencial_phone_updated
  attempt_sold_out:
    description: "Amount of attempts sold out"
    lineage:
      - datalake_recupera_homolog_raw.historical.attempt_sold_out
  minutes_agenda:
    description: "Number of minutes of the agenda (automatic or scheduled)"
    lineage:
      - datalake_recupera_homolog_raw.historical.minutes_agenda
  is_automatic_agenda:
    description: "Indicates if it is automatic agenda or not"
    lineage:
      - datalake_recupera_homolog_raw.historical.is_automatic_agenda
  is_scheduled_agenda:
    description: "Indicates whether it is scheduled agenda or not"
    lineage:
      - datalake_recupera_homolog_raw.historical.is_scheduled_agenda
  is_next_call_triggered:
    description: |
      "Indicates whether the next call is triggered or not. After making the occurrence,
      it calls the next customer automatically (active operator)"
    lineage:
      - datalake_recupera_homolog_raw.historical.is_next_call_triggered
  is_effective_contact:
    description: "Indicated wheter it is a effective contact or not (for monitoring purposes)"
    lineage:
      - datalake_recupera_homolog_raw.historical.is_effective_contact
  agenda_interval:
    description: |
      "Schedule break period type (only to show on the screen, because in the
      bank the period is stored in minutes in the field minutes_agenda)"
    lineage:
      - datalake_recupera_homolog_raw.historical.agenda_interval
  is_time_monitored:
    description: "Indicates whether it counts average time, that is, whether it monitors time or not"
    lineage:
      - datalake_recupera_homolog_raw.historical.is_time_monitored
  average_call_time:
    description: "Average call time. Store in seconds"
    lineage:
      - datalake_recupera_homolog_raw.historical.average_call_time
  historical_type:
    description: "Type of history"
    lineage:
      - datalake_recupera_homolog_raw.historical.historical_type
  is_contract_linked:
    description: |
      "Indicates whether or not the contract is linked (calls or not the contract selection screen and
      inserts in the table of historical contracts)"
    lineage:
      - datalake_recupera_homolog_raw.historical.is_contract_linked
  is_withdrawn_property:
    description: |
      "Indicates whether to withdraw property or not.
      When the operator calls a record, the id_operator field
      of table 'operational_records' is changed to his code, with this flag it is indicated that
      when performing this historical the id_operator field is changed to the distributor
      from which the operator picked up the customer. This prevents the operator from forming a 'wallet'.
      Note: It is known from which distributor the customer came from the field
      distributor_code from table 'operational_records'"
    lineage:
      - datalake_recupera_homolog_raw.historical.is_withdrawn_property
  block_installment:
    description: "Indicates whether it blocks or unblock installment"
    lineage:
      - datalake_recupera_homolog_raw.historical.block_installment
  block_installment_days:
    description: "Indicates the amount of days that will maintain the installment block."
    lineage:
      - datalake_recupera_homolog_raw.historical.block_installment_days
  eficiency_days:
    description: "Number of days to measure efficiency"
    lineage:
      - datalake_recupera_homolog_raw.historical.eficiency_days
  measure_efficiency_agreement:
    description: "Indicates the form of efficiency measurement of agreements"
    lineage:
      - datalake_recupera_homolog_raw.historical.measure_efficiency_agreement
  measure_efficiency_receipts:
    description: "Indicates the form of measuring the efficiency of receipts"
    lineage:
      - datalake_recupera_homolog_raw.historical.measure_efficiency_receipts
  is_efficiency_measured:
    description: "Indicates whether the efficiency is measured or not"
    lineage:
      - datalake_recupera_homolog_raw.historical.is_efficiency_measured
  is_only_business_days:
    description: "Only business days (for days to be added to the scheduled schedule)"
    lineage:
      - datalake_recupera_homolog_raw.historical.is_only_business_days
  to_measure_efficiency:
    description: "Indicates whether to measure efficiency"
    lineage:
      - datalake_recupera_homolog_raw.historical.to_measure_efficiency
  is_occurence_exported:
    description: "If the occurrence is exported to advisory"
    lineage:
      - datalake_recupera_homolog_raw.historical.is_occurence_exported
  max_days_return_form:
    description: "Maximum amount of days to schedule with the return of the form to the operator."
    lineage:
      - datalake_recupera_homolog_raw.historical.max_days_return_form
  is_mandatory_phone:
    description: "Indicates whether it should be mandatory to associate a phone number"
    lineage:
      - datalake_recupera_homolog_raw.historical.is_mandatory_phone
  attempts_inactivate_phone:
    description: "Number of attempts to inactivate the phone without success in the call."
    lineage:
      - datalake_recupera_homolog_raw.historical.attempts_inactivate_phone
  billing_regulation:
    description: "Suspension/release code (billing regulation)"
    lineage:
      - datalake_recupera_homolog_raw.historical.billing_regulation
  is_correct_person_contacted:
    description: "Indicates if it is contact with the right person"
    lineage:
      - datalake_recupera_homolog_raw.historical.is_correct_person_contacted
