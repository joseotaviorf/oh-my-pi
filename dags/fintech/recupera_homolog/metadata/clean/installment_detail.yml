---
database_name: datalake_recupera_homolog_clean
table_name: installment_detail
description: |
  "Contains details of the installment of a negotiation by contract.
  There is a row for each contract and installment.
  Thus, it is possible to identify how the installment values are divided by contract.
  This table is complementary to table 'installment' and the sum of the amounts per installment
  must be the same in both tables.

  Original table name: TBL_PARCELAMENTO_DETALHE.
  Get the original fields names at [Recupera - Mapeamento de tabelas e campos - Original x Datalake](https://docs.google.com/spreadsheets/d/1yaqkdlfQPrQhW30L46miKKcLD99T4OV6svHJHXIYA6Q/edit?usp=sharing)"
owner: bianca.martins@quintoandar.com.br
domain: fintech
columns:
  id_installment:
    description: "Installment code. It is the PK (Primary Key) of the table."
    lineage:
      - datalake_recupera_homolog_raw.installment_detail.id_installment
  dt_expiration_installment_agreement:
    description: "Expiration Date of the installment of the agreement. It is the PK (Primary Key) of the table."
    lineage:
      - datalake_recupera_homolog_raw.installment_detail.dt_expiration_installment_agreement
  id_creditor:
    description: "Creditor code. It is the PK (Primary Key) and FK (Foreign Key) of the table."
    categories:
      "1": QuintoAndar
      "3": QuintoCred, faturas da plataforma 2.0
      "5": QuintoCred, faturas da plataforma 3.0
    lineage:
      - datalake_recupera_homolog_raw.installment_detail.id_creditor
  id_customer:
