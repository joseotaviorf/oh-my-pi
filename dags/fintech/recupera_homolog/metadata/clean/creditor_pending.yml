---
database_name: datalake_recupera_homolog_clean
table_name: creditor_pending
description: |
  "It contains the original invoices of each receipt (records found in the 'complementary_records' or 'complementary_records_written_down' tables) and its
  installments.

  Receipt originals (without installments): the 'installment_code' field is null and the value of 'is_installment' field is False.
  Installment originals: the installment_code field, when filled in, indicates which installment includes these originals. In this case,
  the 'receipt_code' field remains blank, as there is a possibility that an original installment is
  divided into more than one receipt.

  Example
  An original invoice and 3 installments of the agreement: there will be one row in the table and there will be receipt for just one field.
  Therefore the receipt code must be searched in the 'installment' table.
  The value True for field 'is_installment' indicates that it is the original of an installment.

  Original table name: TBL_CREDOR_PENDENCIA.
  Get the original fields names at [Recupera - Mapeamento de tabelas e campos - Original x Datalake](https://docs.google.com/spreadsheets/d/1yaqkdlfQPrQhW30L46miKKcLD99T4OV6svHJHXIYA6Q/edit?usp=sharing)"
owner: bianca.martins@quintoandar.com.br
domain: fintech
