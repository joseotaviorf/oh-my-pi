---
database_name: datalake_recupera_homolog_clean
table_name: receipt
description: |
  "Stores all receipts issued by the system.
  Receipts can be a bank slip, a DI, a cash receipt at the counter, a check.
  In this table there is only one line per receipt.
  Once a receipt has been issued, it will never be deleted from this table.

  Original table name: TBL_RECEBIMENTOS.
  Get the original fields names at [Recupera - Mapeamento de tabelas e campos - Original x Datalake](https://docs.google.com/spreadsheets/d/1yaqkdlfQPrQhW30L46miKKcLD99T4OV6svHJHXIYA6Q/edit?usp=sharing)"
owner: bianca.martins@quintoandar.com.br
domain: fintech
columns:
  id_receipt:
    description: "Receipt code. It is the PK (Primary Key) of the table"
    lineage:
      - datalake_recupera_homolog_raw.receipt.id_receipt
  ts_inclusion:
    description: "Date of inclusion of the receipt. This date is not the same as that"
    lineage:
      - datalake_recupera_homolog_raw.receipt.ts_inclusion
  dt_paid:
    description: "Date of payment. The forecast date is inserted. When payment is made this date is exchanged to the date that effectively occurred"
    lineage:
      - datalake_recupera_homolog_raw.receipt.dt_paid
  amount_paid:
    description: "Amount paid. The amount to be paid is inserted. When payment is made this amount is exchanged for the amount effectively paid"
    lineage:
      - datalake_recupera_homolog_raw.receipt.amount_paid
  amount_fine:
    description: "Fine value"
    lineage:
      - datalake_recupera_homolog_raw.receipt.amount_fine
  interest_fee_amount:
    description: "Interest Value - When payment is made, if the amount is higher than expected, the difference will be added in this field"
    lineage:
      - datalake_recupera_homolog_raw.receipt.interest_fee_amount
  adm_fee_amount:
    description: "Administrative rate value"
    lineage:
      - datalake_recupera_homolog_raw.receipt.adm_fee_amount
  revenue_amount:
    description: "Revenue value"
    lineage:
      - datalake_recupera_homolog_raw.receipt.revenue_amount
  transfer_amount:
    description: "Transfer value"
    lineage:
      - datalake_recupera_homolog_raw.receipt.transfer_amount
  discount_amount:
    description: "Discount amount applied – When payment is made, if the amount is less than expected, the difference will be added in this field"
    lineage:
      - datalake_recupera_homolog_raw.receipt.discount_amount
  type_receipt:
    description: Type of receipt made.
    lineage:
      - datalake_recupera_homolog_raw.receipt.type_receipt
  id_operator:
    description: "Operator code that received the receipt. It is the FK (Foreign Key) of the table"
    lineage:
      - datalake_recupera_homolog_raw.receipt.id_operator
  auth_code:
    description: "Authorization code"
    lineage:
      - datalake_recupera_homolog_raw.receipt.auth_code
  bank_code:
    description: "Bank Code (filled only for receiving in check)"
    lineage:
      - datalake_recupera_homolog_raw.receipt.bank_code
  bank_agency_number:
    description: "Agency number (filled only for receiving in check)"
    lineage:
      - datalake_recupera_homolog_raw.receipt.bank_agency_number
  bank_account_number:
    description: "Account number (filled only for receiving in check)"
    lineage:
      - datalake_recupera_homolog_raw.receipt.bank_account_number
  check_number:
    description: "Check number (filled only for receiving in check)"
    lineage:
      - datalake_recupera_homolog_raw.receipt.check_number
  compensation:
    description: "Compensation (filled only for receiving in check)"
    lineage:
      - datalake_recupera_homolog_raw.receipt.compensation
  customer_name:
    description: "Customer name"
    lineage:
      - datalake_recupera_homolog_raw.receipt.customer_name
  customer_document:
    description: "Customer CPF"
    lineage:
      - datalake_recupera_homolog_raw.receipt.customer_document
  written_down_indicator:
    description: "Low indicator. When the receipt is reversed this field will not change"
    lineage:
      - datalake_recupera_homolog_raw.receipt.written_down_indicator
  is_receipt_finalized:
    description: "Indicates whether the receipt was finalized"
    lineage:
      - datalake_recupera_homolog_raw.receipt.is_receipt_finalized
  cmc7_number:
    description: "CMC7 number"
    lineage:
      - datalake_recupera_homolog_raw.receipt.cmc7_number
  refund_reason_description:
    description: "Description of the refund reason (only if the receipt is refunded)"
    lineage:
      - datalake_recupera_homolog_raw.receipt.refund_reason_description
  refund_reason_code:
    description: "Reversal reason code (only if the receipt is reversed)"
    lineage:
      - datalake_recupera_homolog_raw.receipt.refund_reason_code
  dt_expected_transfer:
    description: "Expected Date for Transfer"
    lineage:
      - datalake_recupera_homolog_raw.receipt.dt_expected_transfer
  calculation_index_code:
    description: "Index code used in the calculation"
    lineage:
      - datalake_recupera_homolog_raw.receipt.calculation_index_code
  index_quotation_amount:
    description: "Index quotation value"
    lineage:
      - datalake_recupera_homolog_raw.receipt.index_quotation_amount
  id_customer:
    description: "Customer Identifier Code"
    lineage:
      - datalake_recupera_homolog_raw.receipt.id_customer
  expense_amount:
    description: "Expense value"
    lineage:
      - datalake_recupera_homolog_raw.receipt.expense_amount
  receipt_observation:
    description: "Observation of Receipt"
    lineage:
      - datalake_recupera_homolog_raw.receipt.receipt_observation
  dt_redeposit:
    description: "Check redeposition date"
    lineage:
      - datalake_recupera_homolog_raw.receipt.dt_redeposit
  id_collection_operator:
    description: "Collection Operator Code (operator that called the registration - for commissioning). It is the FK (Foreign Key) of the table"
    lineage:
      - datalake_recupera_homolog_raw.receipt.id_collection_operator
  debt_type_indicator:
    description: "Debt Type Indicator"
    lineage:
      - datalake_recupera_homolog_raw.receipt.debt_type_indicator
  id_site:
    description: "Local code that made the receipt. It is the FK (Foreign Key) of the table"
    lineage:
      - datalake_recupera_homolog_raw.receipt.id_site
  type_receipt_original:
    description: "When the reversal or payment occurs the type_receipt field is changed, however this field continues with the original flag"
    lineage:
      - datalake_recupera_homolog_raw.receipt.type_receipt_original
  amount_paid_original:
    description: "After payment, amount_paid is changed to the amount actually paid, this field however is not changed."
    lineage:
      - datalake_recupera_homolog_raw.receipt.amount_paid_original
  dt_paid_original:
    description: "After payment the expected payment date is changed to the date the payment actually occurred, but this field is not changed allowing to consult the original date."
    lineage:
      - datalake_recupera_homolog_raw.receipt.dt_paid_original
