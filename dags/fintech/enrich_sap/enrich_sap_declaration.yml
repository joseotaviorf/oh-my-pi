---
dag:
  name: enrich_sap
  schedule_start_date: 2022, 10, 25
  owner: Data Fintech
workflow:
  type: query_delta
  layer: enrich
  custom_schema: pas
  tables_customization:
    journal_entries:
      z_order_by: ["id_transaction"]
    invoices:
      z_order_by: ["id_transaction"]
    incoming_payments:
      z_order_by: ["id_transaction"]
    journal_entry_lines:
      z_order_by: ["id_transaction"]
    invoice_lines:
      z_order_by: ["id_transaction"]
    incoming_payments_lines:
      z_order_by: ["id_transaction"]
  inner_dependencies:
    ledger:
      - ledger_new_template
      - 4hana_journal_entries_bank_account
    4hana_journal_entries_bank_account:
      - 4hana_journal_entries
    ledger_new_template:
      - incoming_payments_lines
      - incoming_payments
      - invoice_lines
      - invoices
      - journal_entries
      - journal_entry_lines
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: m5d.4xlarge
    node_type_id: m5d.4xlarge
    runtime_engine: PHOTON
    spark_version: 13.3.x-scala2.12
    autoscale:
      min_workers: 3
      max_workers: 8
