cluster:
  # Name-map from consolidation_l_memory → emr_7_12_consolidation_l_memory_fleet.
  # Prior Databricks: r7gd.4xlarge Photon, autoscale 5–8 workers.
  type: emr_7_12_consolidation_l_memory_fleet_cluster
  custom_configurations:
    core_nodes:
      target_on_demand: 5
      target_spot: 0
      instance_types:
        - r6g.4xlarge
        - r7g.4xlarge
        - r6i.4xlarge
    task_nodes:
      target_on_demand: 0
      target_spot: 2
      allocation_strategy: price-capacity-optimized
      bid_price_percentage: 100
      instance_types:
        - r6g.4xlarge
        - r7g.4xlarge
        - r6i.4xlarge
    spark_conf:
      spark.sql.shuffle.partitions: "400"
      spark.dynamicAllocation.maxExecutors: "28"
