dag:
  name: rental_guarantee
  owner: Data Fintech
  schedule_interval: 0 0 * * *
workflow:
  type: database_pull_delta
  layer: raw
  database_type: postgres
  custom_schema: rental_guarantee
  dbutils_secret_key: RENTAL_GUARANTEE_DB
  tables_customization:
    charge_aud: {}
    charge:
      clean_table_name: charge
      date_filter_column: updated_at
      extraction_type: incremental
      partitions: [year, month, day]
    guarantee_aud: {}
    guarantee:
      clean_table_name: guarantee
      get_table_metrics:
        count: id
      date_filter_column: updated_at
      extraction_type: incremental
      partitions: [year, month, day]
    renewal: {}
    revinfo:
      clean_table_name: rev_info
      date_filter_column: revtstmp
      extraction_type: incremental
      unixtime_measure: milliseconds
      partitions: [year, month, day]
    risk_category_aud: {}
    risk_category: {}
    sap: {}
    message: {}
    processed_message: {}
cluster:
  type: databricks_13_3_med_general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
