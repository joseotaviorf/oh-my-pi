dag:
  name: rental_guarantee
  owner: Data Fintech
  schedule_interval: 0 0,8,12 * * *
  documentation:
    dag_purpose: |
      This DAG handles the ingestion of our raw and clean data for our Rental Guarantee Microservice, which is a Microservice that was created to offer new possibilities for Tenants to be a part of 5A, when they weren’t approved in our credit policies. For more information about the Database please refer to [the repository](https://github.com/quintoandar/rental-guarantee).
workflow:
  type: cdc
  layer: raw
  database_type: postgres
  custom_schema: rental_guarantee
  source_database: rentalguarantee
  dbutils_secret_key: RENTAL_GUARANTEE_DB
  tables_customization:
    charge_aud:
      clean_table_name: charge_aud
      raw_primary_keys: ["id", "rev"]
    guarantee_aud:
      clean_table_name: guarantee_aud
      raw_primary_keys: ["id", "rev"]
    guarantee:
      clean_table_name: guarantee
      date_filter_column: updated_at
      extraction_type: incremental
      partitions: [year, month, day]
    invoice: {}
    invoice_aud:
      clean_table_name: invoice_aud
      raw_primary_keys: ["id", "rev"]
    renewal: {}
    revinfo:
      clean_table_name: rev_info
      date_filter_column: revtstmp
      extraction_type: incremental
      unixtime_measure: milliseconds
      partitions: [year, month, day]
    risk_category_aud:
      clean_table_name: risk_category_aud
      raw_primary_keys: ["id", "rev"]
    risk_category: {}
    sap: {}
    message: {}
    processed_message: {}
