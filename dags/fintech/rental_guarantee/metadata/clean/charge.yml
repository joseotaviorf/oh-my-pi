database_name: datalake_rental_guarantee_clean
table_name: charge
domain: Fintech
description: "Cleaned charges generated by the Rental Guarantee product, including payment method, status, and ingestion timestamps."
columns:
  id:
    lineage:
      - datalake_rental_guarantee_raw.charge.id
    description: "Unique identifier of the charge."
  id_guarantee:
    lineage:
      - datalake_rental_guarantee_raw.charge.guarantee_id
    description: "Identifier of the related guarantee."
  id_checkout_order:
    lineage:
      - datalake_rental_guarantee_raw.charge.checkout_order_id
    description: "Identifier of the Checkout order associated with this charge."
  cancellation_reason:
    lineage:
      - datalake_rental_guarantee_raw.charge.cancellation_reason
    description: "Reason the charge was canceled, when applicable."
  card_token:
    lineage:
      - datalake_rental_guarantee_raw.charge.card_token
    description: "Masked token representing the card used for the payment, when applicable."
  emv:
    lineage:
      - datalake_rental_guarantee_raw.charge.emv
    description: "EMV-related payload or data for card transactions, when available."
  installments:
    lineage:
      - datalake_rental_guarantee_raw.charge.installments
    description: "Number of installments configured for the charge."
  pix_link:
    lineage:
      - datalake_rental_guarantee_raw.charge.pix_link
    description: "PIX payment link generated for the charge, when applicable."
  qr_code:
    lineage:
      - datalake_rental_guarantee_raw.charge.qr_code
    description: "QR code payload for PIX payment, when applicable."
  charge_status:
    lineage:
      - datalake_rental_guarantee_raw.charge.status
    description: "Current processing status of the charge."
  charge_type:
    lineage:
      - datalake_rental_guarantee_raw.charge.type
    description: "Type/category of the charge (e.g., initial, renewal)."
  refund_amount:
    lineage:
      - datalake_rental_guarantee_raw.charge.refund_amount
    description: "Amount refunded for this charge, if any."
  external_source:
    lineage:
      - datalake_rental_guarantee_raw.charge.external_source
    description: "External system that originated the charge, when present."
  checkout_order_hash:
    lineage:
      - datalake_rental_guarantee_raw.charge.checkout_order_hash
    description: "Hash reference for the associated Checkout order."
  ts_created:
    lineage:
      - datalake_rental_guarantee_raw.charge.created_at
    description: "Creation timestamp of the charge in the source system."
  ts_updated:
    lineage:
      - datalake_rental_guarantee_raw.charge.updated_at
    description: "Last update timestamp of the charge in the source system."
  year:
    lineage:
      - datalake_rental_guarantee_raw.charge.year
    description: "Partition column: event year."
  month:
    lineage:
      - datalake_rental_guarantee_raw.charge.month
    description: "Partition column: event month."
  day:
    lineage:
      - datalake_rental_guarantee_raw.charge.day
    description: "Partition column: event day."
