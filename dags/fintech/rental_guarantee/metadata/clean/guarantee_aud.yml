  ts_paid:
    lineage:
      - datalake_rental_guarantee_raw.guarantee_aud.paid_at
    description: Timestamp when the guarantee payment was confirmed.
  ts_payment_expired:
    lineage:
      - datalake_rental_guarantee_raw.guarantee_aud.payment_expires_at
    description: Timestamp when the payment window for the guarantee expires.
  ts_started:
    lineage:
      - datalake_rental_guarantee_raw.guarantee_aud.begins_at
    description: Timestamp when guarantee coverage begins.
