cluster:
  type: emr_7_12_consolidation_s_memory_fleet_cluster
  custom_configurations:
    spark_conf:
      spark.driver.memory: 16g
      spark.driver.memoryOverhead: 4g
      spark.yarn.am.memory: 4g
    master_node_type_id: r6g.2xlarge
    task_nodes:
      instance_types:
      - r6g.xlarge
      - r7g.xlarge
      - r6i.xlarge
      target_on_demand: 0
      target_spot: 1
      allocation_strategy: price-capacity-optimized
      bid_price_percentage: 100
    core_nodes:
      target_on_demand: 2
      target_spot: 0
      instance_types:
      - r6g.xlarge
      - r7g.xlarge
      - r6i.xlarge
