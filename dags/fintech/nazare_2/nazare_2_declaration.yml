---
dag:
  name: nazare_2
  schedule_start_date: 2022, 8, 23
  owner: Data Fintech
  schedule_interval: 0 12 * * *
  documentation:
    dag_purpose: |
      This DAG load tables from Nazare, the service that calculates the Revenue Share with external partners and executives.
workflow:
  type: database_pull
  layer: raw
  database_type: postgres
  custom_schema: nazare
  dbutils_secret_key: NAZARE_DB
  tables_customization:
    offer:
      clean_table_name: offer
    offer_agent:
      clean_table_name: offer_agent
    offer_partner:
      clean_table_name: offer_partner
    partner:
      clean_table_name: partner
    revenue_share_by_participant:
      clean_table_name: revenue_share_by_participant
    revenue_share_file:
      clean_table_name: revenue_share_file
    revenue_share_file_importation_error:
      clean_table_name: revenue_share_file_importation_error
    tier_bonus:
      clean_table_name: tier_bonus
    tier_bonus_revision:
      clean_table_name: tier_bonus_revision
    tier_partner:
      clean_table_name: tier_partner
    tier_partner_revision:
      clean_table_name: tier_partner_revision
cluster:
  type: databricks_13_3_min_general_cluster
