dag:
  name: dw_collection_recovery_quintocred
  schedule_start_date: 2023,11,11
  owner: Data Fintech
workflow:
  type: query_delta
  layer: dw
  custom_schema: collection_recovery_quintocred
  inner_dependencies:
    fact_proposal_signature_payment_timeline:
      - fact_contract_payment_signature_timeline
    fact_portfolio_timeline:
      - fact_negotiation_installment
      - fact_negotiation
      - dim_wallet_distribution
cluster:
  type: custom_cluster
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: "quintoandar_{{ var.value.environment }}"
    autotermination_minutes: 20
    driver_node_type_id: r5d.4xlarge
    node_type_id: r5d.4xlarge
    num_workers: 3
    spark_version: 13.3.x-scala2.12
  databricks_conn_id: databricks_new
