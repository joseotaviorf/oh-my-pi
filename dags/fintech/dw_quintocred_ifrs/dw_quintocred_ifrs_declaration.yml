dag:
  name: dw_quintocred_ifrs
  schedule_start_date: 2020,08,29
  owner: Data Fintech
workflow:
  type: query_delta
  layer: dw
  custom_schema: velo
  inner_dependencies:
    quintocred_aging_occurrence:
      - quintocred_ifrs_occurrence
    quintocred_aging_recurring_payment_no_renewal:
      - quintocred_ifrs_recurring_payment
    quintocred_aging_recurring_payment_renewal:
      - quintocred_ifrs_recurring_payment
  has_load_to_redshift_task: false
cluster:
  type: databricks_12_2_min_memory_cluster
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: "quintoandar_{{ var.value.environment }}"
