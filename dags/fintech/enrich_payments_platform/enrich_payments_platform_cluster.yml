cluster:
  type: emr_7_12_consolidation_m_memory_fleet_cluster
  custom_configurations:
    # EMR load-enrich-payment: ShuffleMapStage stuck (~20 partitions, ~98
    # min/task) vs ~7 min on Databricks. NVMe (gd) for shuffle spill I/O;
    # pack 2 execs/node; serialize steps so payment owns the fleet.
    # First retry after the webhook equi-join rewrite — slightly over-sized
    # (12 nodes / 24 execs) until a stable run lands, then right-size.
    step_concurrency_level: 1
    core_nodes:
      target_on_demand: 12
      target_spot: 0
      instance_types:
      # Local NVMe (gd/id) — shuffle spill off EBS. ARM-first alternate
      # (r6gd/r7gd → r6id) taken on a capacity fallback.
      - r6gd.2xlarge
      - r7gd.2xlarge
    spark_conf:
      # Preset is 24g+4g overhead → ~1 exec/node on 64GB (YARN Reserved).
      # 18g+3g packs 2 execs × 12 nodes = 24 under maxExecutors.
      spark.executor.memory: "18g"
      spark.executor.memoryOverhead: "3g"
      # EMR fleet base disables broadcasts (-1); small dim joins (gsheets,
      # requester, store) benefit from re-enabling at 100MB.
      spark.sql.autoBroadcastJoinThreshold: "104857600"
      spark.sql.adaptive.autoBroadcastJoinThreshold: "104857600"
      # 256MB advisory coalesced stage 278 to only 20 tasks — too coarse.
      spark.sql.adaptive.advisoryPartitionSizeInBytes: "33554432"
      spark.sql.shuffle.partitions: "800"
      spark.dynamicAllocation.maxExecutors: "24"
      spark.speculation: "true"
      spark.speculation.multiplier: "3"
      spark.speculation.quantile: "0.75"
