---
database_name: datalake_recupera
table_name: negotiation_wallet
owner: juliana.hocihara@quintoandar.com.br
domain: Fintech
description: |-
  Frozen legacy Recupera negotiation attributes for wallet-timeline and segmentation use
  cases. Slim projection of datalake_recupera.negotiation with origin_agreement and status
  normalization. Full refresh snapshot; Recupera is no longer an active negotiation source.
columns:
  id_negotiation:
    description: Recupera negotiation identifier.
    lineage:
      - datalake_recupera.negotiation.id_negotiation
  id_contract:
    description: Rental contract identifier from Recupera negotiation enrich.
    lineage:
      - datalake_recupera.negotiation.id_contract
  advisory:
    description: Advisory agency code associated with the negotiation.
    lineage:
      - datalake_recupera.negotiation.advisory
  origin_agreement:
    description: Normalized negotiation origin channel for wallet segmentation.
    lineage:
      - datalake_recupera.negotiation.origin_agreement
  promisse_payment_method:
    description: Payment method promised at negotiation creation.
    lineage:
      - datalake_recupera.negotiation.promisse_payment_method
  negotiation_status:
    description: Normalized negotiation lifecycle status (finished, broken, offset, etc.).
    lineage:
      - datalake_recupera.negotiation.negotiation_status
  down_payment_amount:
    description: BRL value of the first installment (entrada) promised at Recupera agreement creation, from installment 000.
    lineage:
      - datalake_recupera.negotiation.down_payment_amount
  original_debt_amount:
    description: Original debt amount before negotiation discounts and fees.
    lineage:
      - datalake_recupera.negotiation.original_debt_amount
  dt_promisse:
    description: Date the negotiation promise was created.
    lineage:
      - datalake_recupera.negotiation.dt_promisse
  dt_down_payment:
    description: Date the down payment was received.
    lineage:
      - datalake_recupera.negotiation.dt_down_payment
  ts_load:
    description: Timestamp when the frozen snapshot was last materialized.
    lineage:
      - datalake_recupera.negotiation_wallet.NOW()
