---
database_name: datalake_recupera
table_name: invoice_debt_negotiation
owner: juliana.hocihara@quintoandar.com.br
domain: Fintech
description: |-
  Frozen legacy mapping of QuintoAndar invoices to Recupera negotiation IDs, built from
  creditor_pending and complementary_records clean tables. Full refresh snapshot for
  historical debt-recovery joins; Recupera is no longer an active negotiation source.
columns:
  id_invoice:
    description: Retsuko invoice identifier (installment id in Recupera clean sources).
    lineage:
      - datalake_recupera_clean.creditor_pending.id_installment
      - datalake_recupera_clean.complementary_records.id_installment
      - datalake_recupera_clean.complementary_records_written_down.id_installment
  id_contract:
    description: Rental contract identifier associated with the invoice.
    lineage:
      - datalake_recupera_clean.creditor_pending.id_contract
      - datalake_recupera_clean.complementary_records.id_contract
      - datalake_recupera_clean.complementary_records_written_down.id_contract
  id_negotiation:
    description: Recupera negotiation (installment) code linked to the invoice.
    lineage:
      - datalake_recupera_clean.creditor_pending.installment_code
      - datalake_recupera_clean.complementary_records.installment_code
      - datalake_recupera_clean.complementary_records_written_down.installment_code
  source:
    description: Fixed source label for legacy Recupera mappings.
    lineage:
      - datalake_recupera.invoice_debt_negotiation.source
  priority:
    description: Priority used when merging with Trato Feito debt mappings (Recupera = 2).
    lineage:
      - datalake_recupera.invoice_debt_negotiation.priority
  ts_load:
    description: Timestamp when the frozen snapshot was last materialized.
    lineage:
      - datalake_recupera.invoice_debt_negotiation.NOW()
