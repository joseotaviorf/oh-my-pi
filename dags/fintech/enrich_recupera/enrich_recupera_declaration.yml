---
dag:
  name: enrich_recupera
  schedule_start_date: 2023, 9, 10
  owner: Data Fintech
  documentation:
    dag_purpose: |
      Enrich pipe for Recupera data.
workflow:
  type: query_delta
  layer: enrich
  inner_dependencies:
    changes_debts_distribution:
      - snapshot_daily_debts
  tables_customization:
    collection:
      extraction_type: incremental
      partitions:
        - year
        - month
        - day
    snapshot_daily_debts:
      extraction_type: incremental
      partitions:
        - year
        - month
        - day
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, 1), 'load_end_date') }}"
cluster:
  type: custom_cluster
  databricks_conn_id: databricks_new_env
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    driver_node_type_id: m5d.4xlarge
    node_type_id: m5d.4xlarge
    num_workers: 4
    runtime_engine: PHOTON
    spark_version: 13.3.x-scala2.12
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: "quintoandar_{{ var.value.environment }}"
