---
dag:
  name: nazare_1
  schedule_start_date: 2022, 8, 23
  owner: Data Fintech
  schedule_interval: 0 12 * * *
  documentation:
    dag_purpose: |
      This DAG load tables from Nazare, the service that calculates the Revenue Share with external partners and executives.
workflow:
  type: database_pull
  layer: raw
  database_type: postgres
  custom_schema: nazare
  dbutils_secret_key: NAZARE_DB
  tables_customization:
    advance:
      clean_table_name: advance
    agent:
      clean_table_name: agent
    associate_executive_bonus:
      clean_table_name: associate_executive_bonus
    associate_executive_bonus_revision:
      clean_table_name: associate_executive_bonus_revision
    brokerage_fee_baseline:
      clean_table_name: brokerage_fee_baseline
    brokerage_fee_baseline_revision:
      clean_table_name: brokerage_fee_baseline_revision
    business_unit:
      clean_table_name: business_unit
    campaign:
      clean_table_name: campaign
    hub_bonus:
      clean_table_name: hub_bonus
    hub_bonus_revision:
      clean_table_name: hub_bonus_revision
cluster:
  type: databricks_13_3_min_general_cluster
