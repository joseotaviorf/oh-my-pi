  id_business_key:
    lineage:
      - datalake_payments_platform.payment.id_business_key
    description: "Unique business key combining charge ID and datasource"
  id_charge:
    lineage:
      - datalake_payments_platform.payment.id_charge
    description: "ID of the charge in the payment system"
  id_order:
    lineage:
      - datalake_payments_platform.payment.id_order
    description: "ID of the order associated with the payment"
  id_contract:
    lineage:
      - datalake_payments_platform.payment.id_contract
    description: "ID of the contract associated with the payment"
  id_person:
    lineage:
      - datalake_payments_platform.payment.id_person
    description: "ID of the person making the payment"
  id_invoice:
    lineage:
      - datalake_payments_platform.payment.id_invoice
