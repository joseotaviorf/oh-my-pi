database_name: datalake_collections_quintoandar
table_name: operators
owner: juliana.hocihara@quintoandar.com.br
domain: Fintech
description: Consolidated table of operators from multiple sources, including internal and external operators,
  with standardized agency and company names.
columns:
  id_agency:
    description: Identifier for the agency associated with the operator, assigned based on the data source.
    lineage:
    - datalake_paschoalotto_clean.user.id_agency
    - datalake_webhelp_clean.login.id_agency
    - datalake_cyber.users.id_agency
    - datalake_grb_clean.operators.id_agency
    - datalake_meetcall_clean.operators.id_agency
  user_name:
    description: Full name of the operator, converted to uppercase for standardization.
    lineage:
    - datalake_paschoalotto_clean.user.full_name
    - datalake_webhelp_clean.login.person_name
    - datalake_cyber.users.user_name
    - datalake_grb_clean.operators.name
    - datalake_meetcall_clean.operators.name
  user_email:
    description: Email address of the operator, converted to lowercase for consistency.
    lineage:
    - datalake_recupera_clean.operators.operator_login_code
    - datalake_paschoalotto_clean.user.email
    - datalake_webhelp_clean.login.email
    - datalake_cyber.users.user_email
    - datalake_grb_clean.operators.email
  user_type:
    description: 'Operator type classification: Interno for Recupera/internal operators, Externo for agency
      operators, or the Cyber source user_type when available.'
    lineage:
    - datalake_cyber.users.user_type
  agency_name:
    description: Standardized agency/desk name (e.g. COBRANÇA_INTERNA, PASCHOALOTTO, WEBHELP, BULGARELLI,
      MEETCALL), from Cyber when available or assigned by source.
    lineage:
    - datalake_cyber.users.agency_name
  ts_user_created:
    description: Timestamp when the operator was created/admitted in the source system (Recupera inclusion,
      Cyber creation, or GRB/MeetCall admission date).
    lineage:
    - datalake_recupera_clean.operators.ts_operator_inclusion
    - datalake_cyber.users.ts_user_created
    - datalake_grb_clean.operators.dt_admission
    - datalake_meetcall_clean.operators.dt_admission
  source:
    description: Upstream system that provided the operator record (Recupera, Paschoalotto, Webhelp, Cyber,
      BULGARELLI, MeetCall). Used with priority to deduplicate operators.
    lineage:
    - datalake_recupera_clean.operators.id_operator
    - datalake_paschoalotto_clean.user.login_name
    - datalake_webhelp_clean.login.id_login
    - datalake_cyber.users.id_user
    - datalake_grb_clean.operators.id_operator_cyber
    - datalake_meetcall_clean.operators.id_operator_cyber
  ts_load:
    description: Timestamp when the row was loaded into this enrich table.
  agency_type:
    description: Agency type classification. Sourced from Cyber when available; set to Assessoria Convencional
      for external agency operators.
    lineage:
    - datalake_cyber.users.agency_type
  company_name:
    description: Company/organization name of the operator, derived from Recupera registration/login rules
      or source-specific company mapping (Paschoalotto, Webhelp, Cyber, Bulgarelli, MeetCall).
    lineage:
    - datalake_recupera_clean.operators.id_operator_registration
    - datalake_recupera_clean.operators.operator_login_code
    - datalake_cyber.users.company_name
  id_operator:
    description: Operator identifier standardized across Recupera, Paschoalotto, Webhelp, Cyber, Bulgarelli
      (GRB), and MeetCall sources.
    lineage:
    - datalake_recupera_clean.operators.id_operator
    - datalake_paschoalotto_clean.user.login_name
    - datalake_webhelp_clean.login.id_login
    - datalake_cyber.users.id_user
    - datalake_grb_clean.operators.id_operator_cyber
    - datalake_meetcall_clean.operators.id_operator_cyber
  user_department:
    description: Operator department. Sourced from Cyber when available; set to Assessoria for external
      agency operators.
    lineage:
    - datalake_cyber.users.user_department
