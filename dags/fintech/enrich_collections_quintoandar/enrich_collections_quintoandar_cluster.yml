cluster:
  type: emr_7_12_consolidation_m_memory_fleet_cluster
  custom_configurations:
    aws_attributes:
      ebs_volume_size: 300
    spark_conf:
      spark.driver.memory: 12g
      spark.driver.memoryOverhead: 3g
      spark.yarn.am.memory: 4g
      spark.sql.shuffle.partitions: "384"
    core_nodes:
      target_on_demand: 3
      target_spot: 0
      instance_types:
        - r6g.2xlarge
        - r7g.2xlarge
        - r6i.2xlarge
    task_nodes:
      instance_types:
        - r6g.2xlarge
        - r7g.2xlarge
        - r6i.2xlarge
      target_on_demand: 0
      target_spot: 2
      allocation_strategy: price-capacity-optimized
      bid_price_percentage: 100
