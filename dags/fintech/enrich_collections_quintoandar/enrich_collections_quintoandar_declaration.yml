---
dag:
  name: enrich_collections_quintoandar
  schedule_start_date: 2025, 3, 14
  owner: Data Fintech
  documentation:
    dag_purpose: |
      Creates enriched tables for QuintoAndar Collection context.
workflow:
  type: query_delta
  layer: enrich
  default_extraction_type: incremental
  default_partitions: [year, month, day]
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, macros.ds_add(ds, -1), 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, ds, 'load_end_date') }}"
  inner_dependencies:
    invoice_portfolio:
      - delinquency_app_events
      - debt_negotiated
      - installment
      - negotiation
  tables_customization:
    invoice_portfolio:
      extraction_type: full
      partitions: []
    debt_negotiated:
      extraction_type: full
      partitions: []
    installment:
      extraction_type: full
      partitions: []
    negotiation:
      extraction_type: full
      partitions: []
cluster:
  type: custom_cluster
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: "quintoandar_{{ var.value.environment }}"
      spark.databricks.delta.constraints.allowUnenforcedNotNull.enabled: true
    autotermination_minutes: 20
    driver_node_type_id: m5a.xlarge
    node_type_id: m5a.xlarge
    num_workers: 2
    spark_version: 13.3.x-scala2.12
  databricks_conn_id: databricks_new
