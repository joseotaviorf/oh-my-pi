---
dag:
  name: enrich_collections_quintoandar
  schedule_start_date: 2025, 3, 14
  owner: Data Fintech
  documentation:
    dag_purpose: |
      Creates enriched tables for QuintoAndar Collection context.
workflow:
  type: query_delta
  layer: enrich
  default_extraction_type: full
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start |
      ds, -1), 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  inner_dependencies:
    invoice_portfolio:
      - delinquency_app_events
      - debt_negotiated
      - installment
      - negotiation
    overdue_portfolio_timeline:
      - invoice_portfolio
    collection_events:
      - operators
  tables_customization:
    delinquency_app_events:
      extraction_type: incremental
      partitions: [ year, month, day ]
