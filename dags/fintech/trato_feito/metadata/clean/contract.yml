---
database_name: datalake_trato_feito_clean
table_name: contract
owner: juliana.hocihara@quintoandar.com.br
domain: Fintech
description: "Table to store contracts that may or may not be sent to the collector. See more details at: https://docs.google.com/document/d/1cOK7WBXbYwc7qT1WhPfGqZuOEKTU3z7VQ41SKoVTKK4/"
columns:
  id:
    description: "Unique identifier"
    lineage:
      - datalake_trato_feito_raw.contract.id
  id_external:
    description: "Entity ID in its source domain, in the case of a rental contract, user ID in Main"
    lineage:
      - datalake_trato_feito_raw.contract.external_id
  id_imovel:
    description: "ID of the property associated with the contract on main"
    lineage:
      - datalake_trato_feito_raw.contract.imovel_id
  id_debtor:
    description: Identifier for the debtor referenced by this financial record.
    lineage:
      - datalake_trato_feito_raw.contract.debtor_id
  sync_status:
    description: "Entity synchronization status with the collector"
    lineage:
      - datalake_trato_feito_raw.contract.sync_status
  cyber_sync_status:
    description: "Synchronization status of the contract payload exchanged with the Cyber collections platform during recovery"
    lineage:
      - datalake_trato_feito_raw.contract.cyber_sync_status
  guarantee:
    description: "Type of rental guarantee associated with the contract"
    lineage:
      - datalake_trato_feito_raw.contract.guarantee
  external_status:
    description: "Contract status, in the case of a rental contract, is the status in the main"
    lineage:
      - datalake_trato_feito_raw.contract.external_status
  version:
    description: "Version number assigned to the contract record in Trato Feito, incremented on each source update"
    lineage:
      - datalake_trato_feito_raw.contract.version
  rental_administrator:
    description: "Contract administration model"
    lineage:
      - datalake_trato_feito_raw.contract.rental_administrator
  consultancy:
    description: "Consultancy agency responsible for managing or mediating collections actions and negotiations on the contract"
    lineage:
      - datalake_trato_feito_raw.contract.consultancy
  rev:
    description: "Revision number"
    lineage:
      - datalake_trato_feito_raw.contract.rev
  rental_amount:
    description: "Monthly rental amount in Brazilian reais, as registered on the contract when ingested from Trato Feito"
    lineage:
      - datalake_trato_feito_raw.contract.rental_amount
  iptu_installments:
    description: "IPTU installment amount"
    lineage:
      - datalake_trato_feito_raw.contract.iptu_installments
  iptu_amount:
    description: "Property tax (IPTU) amount in Brazilian reais associated with the rental contract from Trato Feito"
    lineage:
      - datalake_trato_feito_raw.contract.iptu_amount
  condominium_amount:
    description: "Monthly condominium fee in Brazilian reais associated with the rental contract as stored in Trato Feito"
    lineage:
      - datalake_trato_feito_raw.contract.condominium_amount
  total_amount:
    description: "Total contracted monthly amount in BRL combining rent, IPTU, and condominium charges for the contract"
    lineage:
      - datalake_trato_feito_raw.contract.total_amount
  dt_guarantee_start:
    description: "Guarantee effective date"
    lineage:
      - datalake_trato_feito_raw.contract.guarantee_start_date
  dt_end:
    description: "End date of the contract term"
    lineage:
      - datalake_trato_feito_raw.contract.end_date
  dt_expected_end:
    description: "Expected date for the contract to end"
    lineage:
      - datalake_trato_feito_raw.contract.expected_end_date
  dt_start:
    description: "When the contract started"
    lineage:
      - datalake_trato_feito_raw.contract.start_date
  dt_termination:
    description: "When the contract terminated"
    lineage:
      - datalake_trato_feito_raw.contract.termination_date
  ts_created:
    description: "Timestamp when the contract record was first created in the Trato Feito source application"
    lineage:
      - datalake_trato_feito_raw.contract.created_at
  ts_updated:
    description: "Timestamp when the contract record was last modified in the Trato Feito source application"
    lineage:
      - datalake_trato_feito_raw.contract.updated_at
  ts_last_received:
    description: "Entity last synchronized at"
    lineage:
      - datalake_trato_feito_raw.contract.last_received_at
  rev:
    description: Financial attribute representing rev on the contract dataset.
    lineage: []
  ts_consultancy_updated:
    description: Timestamp when consultancy updated occurred in the upstream fintech system.
    lineage: []
  total_amount:
    description: Financial attribute representing total amount on the contract dataset.
    lineage: []
