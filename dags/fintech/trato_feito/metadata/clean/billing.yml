description: Stores data about billing campaign (boletagem). Billing campaign is similar to a negotiation in the promise phase, in which the debts must not be modified, and the first installment payment closes the deal. But, instead of handling one at a time, there can be several billings for the same contract/debts and, potentially, one of them will become a negotiation if the first installment is paid.
