dag:
  name: trato_feito
  owner: Data Fintech
  schedule_interval: 0 3 * * *
  documentation:
    dag_purpose: |
      [Trato Feito](https://github.com/quintoandar/trato-feito) is a microservice that manages the negotiation flows between QuintoAndar and its debtors.
workflow:
  type: database_pull
  layer: raw
  database_type: postgres
  custom_schema: trato_feito
  dbutils_secret_key: TRATO_FEITO_DB
  lineage_product_database_name: tratofeito
  tables_customization:
    accounting_installment:
      get_table_metrics:
        count: id
    bill:
      get_table_metrics:
        count: id
    client: {}
    contract: {}
    debt:
      get_table_metrics:
        count: id
    debtor: {}
    eviction_data:
      get_table_metrics:
        count: id
    eviction:
      get_table_metrics:
        count: id
    evictions_report: {}
    installment:
      get_table_metrics:
        count: id
    installment_charges: {}
    negotiation:
      get_table_metrics:
        count: id
    payment: {}
    collector_load: {}
    collector: {}
    events_batch: {}
    status_sync: {}
    document_generation: {}
    document_generation_aud: {}
cluster:
  type: databricks_13_3_med_general_cluster
