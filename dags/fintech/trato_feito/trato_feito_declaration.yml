dag:
  name: trato_feito
  schedule_interval: 0 3,8,12 * * *
  owner: Data Fintech
  documentation:
    dag_purpose: |
      [Trato Feito](https://github.com/quintoandar/trato-feito) is a microservice that manages the negotiation flows between QuintoAndar and its debtors.
workflow:
  type: cdc
  layer: raw
  database_type: postgres
  source_schema: public
  dbutils_secret_key: TRATOFEITO_DB
  lineage_product_database_name: tratofeito
  source_database: tratofeito
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, 0), 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, 1), 'load_end_date') }}"
  tables_customization:
    accounting_installment: {}
    audience:
      raw_primary_keys: [id]
      clean_primary_keys: [id_communication_audience]
    bill: {}
    billing: {}
    client: {}
    contract: {}
    debt: {}
    debtor: {}
    eviction_data: {}
    eviction: {}
    evictions_report: {}
    eviction_aud: {}
    installment: {}
    installment_charges: {}
    negotiation: {}
    payment: {}
    collector_load: {}
    collector: {}
    events_batch: {}
    status_sync: {}
    rollout_cyber_contract: {}
    communication_sequence: {}
    communication_step: {}
    segment: {}
    segment_distribution: {}
    segment_distribution_history: {}
    segment_filter: {}
    segmentation_features: {}
    pause_collection: {}
    contract_segmentation_features: {}
    contract_segment_distribution: {}
    contract_segment_distribution_history: {}
    customer_segment_distribution: {}
    customer_segment_distribution_history: {}
    negotiation_option: {}
    audience_negotiation_option: {}
    legal_process: {}
    # legal_process_document_generation: {}
    legal_process_history: {}
