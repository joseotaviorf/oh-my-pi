dag:
  name: trato_feito
  schedule_interval: 0 3 * * *
  owner: Data Fintech
  documentation:
    dag_purpose: |
      [Trato Feito](https://github.com/quintoandar/trato-feito) is a microservice that manages the negotiation flows between QuintoAndar and its debtors.
workflow:
  type: cdc
  layer: raw
  database_type: postgres
  source_schema: public
  dbutils_secret_key: TRATOFEITO_DB
  lineage_product_database_name: tratofeito
  source_database: tratofeito
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, macros.ds_add(ds, 0), 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, macros.ds_add(ds, 1), 'load_end_date') }}"
  tables_customization:
    accounting_installment:
      get_table_metrics:
        count: "id"
    bill:
      get_table_metrics:
        count: "id"
    billing:
      get_table_metrics:
        count: "id"
    client:
      get_table_metrics:
        count: "id"
    contract:
      get_table_metrics:
        count: "id"
    debt:
      get_table_metrics:
        count: "id"
    debtor:
      get_table_metrics:
        count: "id"
    eviction_data:
      get_table_metrics:
        count: "id"
    eviction:
      get_table_metrics:
        count: "id"
    evictions_report:
      get_table_metrics:
        count: "id"
    eviction_aud: {}
    installment:
      get_table_metrics:
        count: "id"
    installment_charges:
      get_table_metrics:
        count: "id"
    negotiation:
      get_table_metrics:
        count: "id"
    payment:
      get_table_metrics:
        count: "id"
    collector_load: {}
    collector:
      get_table_metrics:
        count: "id"
    events_batch: {}
    status_sync: {}
    document_generation: {}
    document_generation_aud: {}
    rollout_cyber_contract: {}
    comms: {}
cluster:
  type: custom_cluster
  custom_configurations:
    autotermination_minutes: 20
    driver_node_type_id: r5.xlarge
    node_type_id: r5.xlarge
    num_workers: 3
    spark_version: 13.3.x-scala2.12
    aws_attributes:
      first_on_demand: 1
      spot_bid_price_percent: 100
      zone_id: us-east-1d
      ebs_volume_size: 200
      availability: SPOT_WITH_FALLBACK
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
  databricks_conn_id: databricks_new
