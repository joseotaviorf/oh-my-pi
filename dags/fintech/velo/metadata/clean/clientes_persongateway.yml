---
database_name: datalake_velo_clean
table_name: clientes_persongateway
owner: guilherme.sacramento@quintoandar.com.br
domain: Fintech
description: |
  QuintoCred is the name given to Velo after its acquisition by QuintoAndar in 2021. As of 2023, the Velo brand was replaced by QuintoCred.
  In June 2025, QuintoCred's core operations were shut down, leaving only the debt collection services active. In the first quarter of 2026, the decision was made to terminate the collection operations by July 31, 2026.
  Therefore, it is important to understand that all Velo and QuintoCred systems are considered legacy, and consequently, the involved tables are as well.
  Links Velo persons to payment-gateway and invoicing customer identifiers. Grain: one row per person-to-gateway mapping. Used for legacy payment reconciliation.
columns:
  id:
    description: "Primary key of the person-gateway link in Velo."
    lineage:
      - datalake_velo_raw.clientes_persongateway.id
  id_user_insert:
    description: "Velo user id that created the mapping row."
    lineage:
      - datalake_velo_raw.clientes_persongateway.userinsert
  id_user_update:
    description: "Velo user id that last updated the mapping row."
    lineage:
      - datalake_velo_raw.clientes_persongateway.userupdate
  id_person:
    description: "Foreign key to the Velo person (clientes_person) being mapped."
    lineage:
      - datalake_velo_raw.clientes_persongateway.person
  id_bank_gateway:
    description: "Identifier of the payment gateway configuration in Velo."
    lineage:
      - datalake_velo_raw.clientes_persongateway.gateway
  id_invoice_customer:
    description: "Invoicing customer id assigned by the gateway or billing provider."
    lineage:
      - datalake_velo_raw.clientes_persongateway.customer
  is_active:
    description: "True when the person-gateway mapping is active."
    lineage:
      - datalake_velo_raw.clientes_persongateway.active
  ts_inserted:
    description: "Timestamp when the mapping row was first inserted in Velo."
    lineage:
      - datalake_velo_raw.clientes_persongateway.dateinsert
  ts_updated:
    description: "Timestamp of the last update to the mapping row in Velo."
    lineage:
      - datalake_velo_raw.clientes_persongateway.dateupdate
