---
database_name: datalake_velo_clean
table_name: clientes_person
owner: guilherme.sacramento@quintoandar.com.br
domain: Fintech
description: |
  QuintoCred is the name given to Velo after its acquisition by QuintoAndar in 2021. As of 2023, the Velo brand was replaced by QuintoCred.
  In June 2025, QuintoCred's core operations were shut down, leaving only the debt collection services active. In the first quarter of 2026, the decision was made to terminate the collection operations by July 31, 2026.
  Therefore, it is important to understand that all Velo and QuintoCred systems are considered legacy, and consequently, the involved tables are as well.
  Clean natural-person profiles from the Velo clientes module. Grain: one row per person. Supports legacy QuintoCred credit analysis and collections (contains PII).
columns:
  id:
    description: "Primary key of the person in the legacy Velo clientes module."
    lineage:
      - datalake_velo_raw.clientes_person.id
  id_user_insert:
    description: "Velo user id that created the person row."
    lineage:
      - datalake_velo_raw.clientes_person.userinsert
  id_user_update:
    description: "Velo user id that last updated the person row."
    lineage:
      - datalake_velo_raw.clientes_person.userupdate
  name:
    description: "Full name of the person as registered in Velo."
    lineage:
      - datalake_velo_raw.clientes_person.name
  document:
    description: "CPF or personal tax document number."
    lineage:
      - datalake_velo_raw.clientes_person.document
  email:
    description: "Email address registered for the person in Velo."
    lineage:
      - datalake_velo_raw.clientes_person.email
  mother:
    description: "Mother's name collected for credit bureau checks in legacy workflows."
    lineage:
      - datalake_velo_raw.clientes_person.mother
  phone:
    description: "Primary phone number of the person."
    lineage:
      - datalake_velo_raw.clientes_person.phone
  rental:
    description: "Rental-related flag or reference on the person profile."
    lineage:
      - datalake_velo_raw.clientes_person.rental
  is_foreigner:
    description: "True when the person is flagged as foreign (estrangeiro) in Velo."
    lineage:
      - datalake_velo_raw.clientes_person.estrangeiro
  is_active:
    description: "True when the person profile is active in Velo."
    lineage:
      - datalake_velo_raw.clientes_person.active
  dt_birth:
    description: "Date of birth of the person."
    lineage:
      - datalake_velo_raw.clientes_person.birth
  ts_inserted:
