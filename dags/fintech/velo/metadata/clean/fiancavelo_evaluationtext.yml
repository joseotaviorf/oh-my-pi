---
database_name: datalake_velo_clean
table_name: fiancavelo_evaluationtext
owner: guilherme.sacramento@quintoandar.com.br
domain: Fintech
description: |
  QuintoCred is the name given to Velo after its acquisition by QuintoAndar in 2021. As of 2023, the Velo brand was replaced by QuintoCred.
  In June 2025, QuintoCred's core operations were shut down, leaving only the debt collection services active. In the first quarter of 2026, the decision was made to terminate the collection operations by July 31, 2026.
  Therefore, it is important to understand that all Velo and QuintoCred systems are considered legacy, and consequently, the involved tables are as well.
  Free-text evaluation notes attached to rental-guarantee proposals in FiancaVelo. Grain: one row per evaluation text entry. Supports underwriting audit trails.
columns:
  id:
    description: "Primary key of the evaluation text in FiancaVelo."
    lineage:
      - datalake_velo_raw.fiancavelo_evaluationtext.id
  id_propose:
    description: "Foreign key to the rental-guarantee proposal being evaluated."
    lineage:
      - datalake_velo_raw.fiancavelo_evaluationtext.propose
  id_type:
    description: "Evaluation text category or type identifier."
    lineage:
      - datalake_velo_raw.fiancavelo_evaluationtext.type
  id_user_insert:
    description: "Velo user id that created the evaluation note."
    lineage:
      - datalake_velo_raw.fiancavelo_evaluationtext.userinsert
  id_user_update:
    description: "Velo user id that last updated the evaluation note."
    lineage:
      - datalake_velo_raw.fiancavelo_evaluationtext.userupdate
  description:
    description: "Underwriter or analyst free-text comment for the proposal evaluation."
    lineage:
      - datalake_velo_raw.fiancavelo_evaluationtext.description
  is_active:
    description: "True when the evaluation text record is active."
    lineage:
      - datalake_velo_raw.fiancavelo_evaluationtext.active
  ts_inserted:
    description: "Timestamp when the evaluation text was first inserted in Velo."
    lineage:
      - datalake_velo_raw.fiancavelo_evaluationtext.dateinsert
  ts_updated:
    description: "Timestamp of the last update to the evaluation text in Velo."
    lineage:
      - datalake_velo_raw.fiancavelo_evaluationtext.dateupdate
