---
database_name: datalake_revenue_lines_homolog
table_name: late_payments
owner: ae-finance-fintech@quintoandar.com.br
domain: Fintech
description: "Fines for late payment of the rent invoice: 10% for late payment, plus 1% a.m. charged daily"
columns:
  id_late_payments:
    description: "ID for late payments composed by invoice entries id, id_contract, and reference year-month"
    lineage:
      - datalake_invoice.invoice_entries.id_invoice_entry
      - datalake_invoice.invoice_entries.id_contract
      - datalake_invoice.invoice_entries.datalake_retsuko.invoice
  id_contract:
    description: "Id of the contract in main"
    lineage:
      - datalake_invoice.invoice_entries.id_contract
  type_late:
    description: "Rental or condo late"
  invoice_theorical_amount:
    description: "Total amount that appears on the invoice"
    lineage:
      - datalake_invoice.invoice_entries.brl_entry_due_amount
  invoice_paid_amount:
    description: "Invoice total amount was paid"
    lineage:
      - datalake_invoice.invoice_entries.brl_entry_due_amount
      - datalake_invoice.invoice_entries.brl_entry_paid_amount
  accrual_year_month:
    description: "Reference year-month"
    lineage:
      - datalake_retsuko.invoice.accrual_year_month
  dt_created:
    description: "Entry created date"
    lineage:
      - datalake_invoice.invoice_entries.ts_created
  dt_due:
    description: "Invoice's due date"
    lineage:
      - datalake_quintoandar.aux_date.date
  dt_paid:
    description: "Invoice's paid date"
    lineage:
      - datalake_quintoandar.aux_date.date
