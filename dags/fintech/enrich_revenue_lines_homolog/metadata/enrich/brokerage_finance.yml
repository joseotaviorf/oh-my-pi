---
database_name: datalake_revenue_lines_homolog
table_name: brokerage_finance
owner: ae-finance-fintech@quintoandar.com.br
domain: fintech
description: "This For Rent addon makes it possible to our clients to split brokeragefee - BFI"
columns:
  id_bfi:
    description: "BFI ID"
    lineage:
      - datalake_owner_fees_clean.contract_brokerage_fee.id
  id_contract_ebdb:
    description: "Id of the contract in main"
    lineage:
      - datalake_invoice.invoice_entries.id_contract
  rent:
    description: Rent value of the contract.
    lineage:
      - datalake_ebdb_contract.contract.rent
  prod_theorical_amount:
    description: "Amortization amount calculated by the BFI product"
  prod_theorical_fee:
    description: "Interest amount calculated by the BFI product"
  invoice_theorical_amount:
    description: "Amortization amount that appears on the invoice"
  invoice_paid_amount:
    description: "Amortization amount that whas paid"
  invoice_theorical_fee:
    description: "Interest amount that appears on the invoice"
  invoice_paid_fee:
    description: "Interest amount that whas paid"
  total_installments:
    description: "Number of total installments"
    lineage:
      - datalake_owner_fees_clean.contract_brokerage_fee.installment_number
  premium_fee:
    description: "Fee charged for financing. Varies according to the number of installments"
    lineage:
      - datalake_owner_fees_clean.contract_brokerage_fee.premium_fee
  real_state_agent_share:
    description:
      "It's the agent brokerage share. Important because in BFI V1 we only
      finance 5A brokerage share"
    lineage:
      - datalake_ebdb_clean.contract.agent_brokerage_share
      - datalake_owner_fees_clean.contract.real_state_agent_share
  accrual_year_month:
    description: "Reference year-month"
    lineage:
      - datalake_retsuko.invoice.accrual_year_month
  dt_bf_created:
    description: "Date of brokerage payment opted to be divided"
    lineage:
      - datalake_owner_fees_clean.contract_brokerage_fee.ts_created
  dt_due_fee:
    description: "Fee due date"
    lineage:
      - ddatalake_quintoandar.aux_date.date
  dt_paid_fee:
    description: "Date of fee payment"
    lineage:
      - ddatalake_quintoandar.aux_date.date
