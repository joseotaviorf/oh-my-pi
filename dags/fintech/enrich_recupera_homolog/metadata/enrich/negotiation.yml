---
database_name: datalake_recupera_homolog
table_name: negotiation
owner: ae-finance-fintech@quintoandar.com.br
domain: Fintech
description: "This table represents the Recupera report called NEGOCIAC and contains information about the negotiation."
columns:
  id_creditor:
    description: Creditor ID
    categories:
      "1": QuintoAndar
      "3": QuintoCred, faturas da plataforma 2.0
      "5": QuintoCred, faturas da plataforma 3.0
    lineage:
      - datalake_recupera_clean.installment.id_creditor
  id_contract:
    description: Contract ID. Original field name = CONTRATO
    lineage:
      - datalake_recupera_clean.installment_detail.id_contract
  id_negotiation:
    description: Negotiation ID. Original field name = CODIGO_PARCELAMENTO
    lineage:
      - datalake_recupera_clean.installment.id_installment
  id_operator:
    description: Operator ID. Original field name = Operador
    lineage:
      - datalake_recupera_clean.installment.id_operator
  creditor:
    description: Creditor - IQ QuintoAndar, IQ QuintoCred or PP QuintoAndar
    lineage:
      - datalake_recupera_clean.installment.id_creditor
  is_special_installment:
    lineage:
      - datalake_recupera_clean.negotiation.is_special_installment
    description: "Indicates if it is a special installment. Special installment is created most of the time by BackOffice team to adjust write-offs. This type of installment eliminates all calculations, allowing the operator to create any type of negotiation"
  customer_document:
    description: Customer Document. Original field name = CPF
    lineage:
      - datalake_recupera_clean.records.customer_document
  customer_name:
    description: Customer Name. Original field name = NOME
    lineage:
      - datalake_recupera_clean.records.customer_name
  status:
    description: Negotiation Status ID. Original field name = Status
    lineage:
      - datalake_recupera_clean.operational_records.collesction_customer_situation
  status_description:
    description: Debt collection status description. Original field name = DESCRICAO_STATUS
    lineage:
      - datalake_recupera_clean.status.status_description
  negotiation_status:
    description: Negotiation Status. Original field name = STATUS_ACORDO
    lineage:
      - datalake_recupera_clean.installment_canceled.id_installment
      - datalake_recupera_clean.installment.installment_situation
  campaign_code:
    description: Campaign Code. It is filled in if the origin_agreement is carta_campanha. Original field name = CODIGO_CAMPANHA
    lineage:
      - datalake_recupera_clean.historical_records.occurence_description
  promisse_payment_method:
    description: Type of promise to pay. Original field name = FORMA_PAGTO_PROMESSA
    lineage:
      - datalake_recupera_clean.installment.boleto_emission_indicator
  origin_agreement:
    description: Origin of the agreement. Original field name = Origem_Acordo
    lineage:
      - datalake_recupera_clean.operators.operator_type
      - datalake_recupera_clean.historical_records.occurence_description
      - datalake_recupera_clean.installment.id_operator
  advisory:
    description: Advisory. Original field name = Assessoria
    lineage:
      - datalake_recupera_clean.installment.advisory_code
  agreement_type:
    description: The type of the agreement, see options for more context
    categories:
      Em assessoria por um operador interno: Customer appears in the advisory portfolio, but the agreement was made internally (internal collection operation, access to the self-negotiation portal, campaign letter [boletagem])
      Em assessoria por um operador de assessoria: Agreement generated by the advisory, through its various channels
      Fora de assessoria: Customer is not included in the advisory portfolio, agreement generated internally
    lineage:
      - datalake_recupera_clean.installment.agreement_type
  down_payment:
    description: Indicates whether the initial payment was made. Original field name = ENTRADA_PAGA
    lineage:
      - datalake_recupera_clean.receipt.id_receipt
  agreement_in_delay:
    description: Delayed agreement. Original field name = ACORDO_EM_ATRASO
    lineage:
      - datalake_recupera_clean.installment.installment_situation
      - datalake_recupera_clean.installment.dt_due
  agreement_promise:
    description: Promisse agreement. Original field name = PROMESSA_ACORDO
    lineage:
      - datalake_recupera_clean.installment.installment_number
      - datalake_recupera_clean.installment.installment_situation
  number_of_installments:
    description: Total number of installlments. Original field name = Qtde_Parcelas
    lineage:
      - datalake_recupera_clean.installment.installments_amount
  paid_installments:
    description: "Number of paid installments of the negotiation"
    lineage:
      - datalake_recupera_clean.installment.id_installment
  breached_installments:
    description: "If a negotiation was broken, it will be the total installment of the negotiation"
    lineage:
      - datalake_recupera_clean.installment.installments_amount
  original_debt_amount:
    description: Original debt amount. Original field name = valor_debito_original
    lineage:
      - datalake_recupera_clean.installment.main_amount
  interest_fee_amount:
    description: Interest fee amount (juros)
    lineage:
      - datalake_recupera_clean.installment.interest_fee_amount
  adm_fee_amount:
    description: Credit Card Fee (3.5% * negotiated_amount)
    lineage:
      - datalake_recupera_clean.installment.adm_fee_amount
  fine_fee_amount:
    description: Fine fee amount (multa). This value is calculated by the difference in Payment x Main Amount. Deducting first the Credit Card Fee, second the Interest and the remaining amount counts as a Fine. Calculation = negotiated_amount - original_debt_amount - adm_fee_amount - interest_fee_amount
    lineage:
      - datalake_recupera_clean.installment.amount_fine
  expense_amount:
    description: Expense amount (original invoice amount + all the fees), i.e, the total amount without discounts.
    lineage:
      - datalake_recupera_clean.installment.expense_amount
  negotiation_discount_amount:
    description: Negotiation discount amount, i.e expense_amount - negotiated_amount. Original field name = Valor_Desconto_Acordo
    lineage:
      - datalake_recupera_clean.installment.discount_amount
  negotiated_amount:
    description: Total negotiated amount. Original field name = Valor_Total_Negociado
    lineage:
      - datalake_recupera_clean.installment.amount_to_pay
  negotiated_to_be_due_amount:
    description: Negotiation to be due amount, i.e, the sum of due amount of all installments that are open and is not overdue. Original field name = VALOR_A_VENCER
    lineage:
      - datalake_recupera_clean.installment.amount_to_pay
      - datalake_recupera_clean.installment.installment_situation
  negotiated_overdue_amount:
    description: Negotiation overdue amount, i.e, the sum of due amount of all installments that are open and is overdue. Original field name = VALOR_EM_ATRASO
    lineage:
      - datalake_recupera_clean.installment.amount_to_pay
      - datalake_recupera_clean.installment.installment_situation
  down_payment_amount:
    description: Indicated the down payment amount. Original field name = Valor_Entrada
    lineage:
      - datalake_recupera_clean.installment.installment_number
      - datalake_recupera_clean.installment.amount_to_pay
  total_amount_paid:
    description: Total paid amount. Original field name = TOTAL_PAGO
    lineage:
      - datalake_recupera_clean.installment.amount_to_pay
  total_next_due:
    description: Total amount on the next due date . Original field name = Total_Proximo_vencimento
    lineage:
      - datalake_recupera_clean.installment.amount_to_pay
  dt_cancellation:
    description: Cancelation date. Original field name = Data_Cancelamento
    lineage:
      - datalake_recupera_clean.installment_canceled.ts_canceled_installment
  dt_next_due:
    description: Next due date. Original field name = Proximo_vencimento
    lineage:
      - datalake_recupera_clean.installment.installment_situation
      - datalake_recupera_clean.installment.dt_due
  dt_promisse:
    description: Installment Creation Date. Original field name = DATA_DA_PROMESSA
    lineage:
      - datalake_recupera_clean.installment.dt_installment
  dt_due_promisse:
    description: Installment Due date. Original field name = Vencimento_da_Promessa
    lineage:
      - datalake_recupera_clean.installment.dt_due
  dt_negotiation_expected_end:
    description: "Date expected to finalize the negotiation, i.e, the due date of the last installment"
    lineage:
      - datalake_recupera_clean.installment.dt_due
  dt_down_payment:
    description: "Date when the first installment was paid"
    lineage:
      - datalake_recupera_clean.installment.dt_paid
  dt_paid_all:
    description: "Date when all installment have been paid"
    lineage:
      - datalake_recupera_clean.installment.dt_paid
  ts_snapshot:
    description: Timestamp when the data was loaded
  year:
    description: Year when the data was loaded
  month:
    description: Month when the data was loaded
  day:
    description: Day when the data was loaded
