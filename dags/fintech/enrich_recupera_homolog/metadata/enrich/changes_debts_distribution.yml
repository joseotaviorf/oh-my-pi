---
database_name: datalake_recupera_homolog
table_name: changes_debts_distribution
owner: ae-finance-fintech@quintoandar.com.br
domain: Fintech
description: "This table captures the debts movements between the distributions and advisories, that can call partners. It is created based on table 'snapshot_daily_debts' (Recupera report called P6)"
columns:
  creditor:
    lineage:
      - datalake_recupera_homolog.snapshot_daily_debts.id_creditor
    description: Creditor code.
  id_contract:
    lineage:
      - datalake_recupera_homolog.snapshot_daily_debts.id_contract
    description: Contract ID.
  partner:
    lineage:
      - datalake_recupera_homolog.snapshot_daily_debts.advisory
      - datalake_recupera_homolog.snapshot_daily_debts.distributor
    description: Partner. It is the categorization of the advisory or distributor (COELESCE between this 2).
  dt_start_interval:
    lineage:
      - datalake_recupera_homolog.snapshot_daily_debts.ts_snapshot
    description: Start date interval. It is the date when the debt moved to a partner.
  dt_end_interval:
    lineage:
      - datalake_recupera_homolog.snapshot_daily_debts.ts_snapshot
    description: End date interval. It is the date when the debt moved from a partner.
  ts_load:
    description: Timestamp when the data was loaded
