database_name: datalake_retsuko_clean
table_name: account
owner: bianca.martins@quintoandar.com.br
domain: Fintech
description: "Clean layer table containing account information from SeuBarriga for financial operations.
  This table stores bank account details associated with contracts and users."
columns:
  id:
    description: "Unique account identifier"
    lineage:
      - datalake_retsuko_raw.account.id
  id_external:
    description: "External account identifier from SeuBarriga"
    lineage:
      - datalake_retsuko_raw.account.external_id
  id_contract:
    description: "Contract identifier associated with this account.
      Joins with Retsuko's contract table, not directly with EBDB's contract table."
    lineage:
      - datalake_retsuko_raw.account.contract_id
  id_main_user:
    description: "Main user identifier associated with this account.
      It's the EBDB's user id."
    lineage:
      - datalake_retsuko_raw.account.external_main_user_id
  bank_code:
    description: "Bank code identifier"
    lineage:
      - datalake_retsuko_raw.account.bank_code
  type:
    description: "Account type"
    lineage:
      - datalake_retsuko_raw.account.type
  is_savings:
    description: "Boolean field indicating if this is a savings account"
    lineage:
      - datalake_retsuko_raw.account.is_savings
  ts_bank_info_updated:
    description: "Timestamp when bank information was last updated"
    lineage:
      - datalake_retsuko_raw.account.bank_info_updated_at
