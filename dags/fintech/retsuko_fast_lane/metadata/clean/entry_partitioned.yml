---
database_name: datalake_retsuko_clean
table_name: entry_partitioned
owner: guilherme.sacramento@quintoandar.com.br
domain: Fintech
description: |
  Clean layer table containing accounting entries from Retsuko (partitioned by time).
  Each record represents a financial movement between accounts, linked to invoices and contracts.
  Data comes from SeuBarriga and is synced via CDC. Updated every 1 hour, between 7h30 AM to 22h30 AM BRT.
columns:
  id:
    description: "Unique identifier of the entry in Retsuko"
    lineage:
      - datalake_retsuko_raw.entry_partitioned.id
  id_external:
    description: "External identifier of the entry in the source system (SeuBarriga)"
    lineage:
      - datalake_retsuko_raw.entry_partitioned.external_id
  id_invoice:
    description: "Identifier of the invoice associated to this entry"
    lineage:
      - datalake_retsuko_raw.entry_partitioned.invoice_id
  id_contract:
    description: "Identifier of the contract related to this entry"
    lineage:
      - datalake_retsuko_raw.entry_partitioned.contract_id
  id_from_account:
    description: "Source account identifier debited in the transaction"
    lineage:
      - datalake_retsuko_raw.entry_partitioned.from_account_id
  id_to_account:
    description: "Destination account identifier credited in the transaction"
    lineage:
      - datalake_retsuko_raw.entry_partitioned.to_account_id
  id_external_reversed_entry:
    description: "If the entry was created to cancel (reverse) other entry, with this ID you can track the original one that was reversed"
    lineage:
      - datalake_retsuko_raw.entry_partitioned.reversed_entry_external_id
  id_audit:
    description: "Audit event identifier associated to this entry"
    lineage:
      - datalake_retsuko_raw.entry_partitioned.audit_id
  accounting_transaction_identifier:
    description: "Transactional entries are created in pairs (on the IQ and PP invoice). This hash can identify this pair."
    lineage:
      - datalake_retsuko_raw.entry_partitioned.accounting_transaction_identifier
  amount:
    description: "Monetary amount of the entry in cents"
    lineage:
      - datalake_retsuko_raw.entry_partitioned.amount
  bill_item:
    description: "Type of invoice item (e.g., rental, condominium, fine-and-interest); identifies what the entry refers to"
    lineage:
      - datalake_retsuko_raw.entry_partitioned.bill_item
  description:
    description: "Free-text description of the entry, shown on the invoice"
    lineage:
      - datalake_retsuko_raw.entry_partitioned.description
  status:
    description: "Indicates if an entry is not-invoiceable (pending) or not (success)"
    lineage:
      - datalake_retsuko_raw.entry_partitioned.status
  producer:
    description: "Routine that created the entry (e.g., monthly-routine, manual, early-termination, onboarding-routine)"
    lineage:
      - datalake_retsuko_raw.entry_partitioned.producer
  accrual_year_month:
    description: "Accrual period in year-month format (YYYYMM); expense reference month"
    lineage:
      - datalake_retsuko_raw.entry_partitioned.accrual_year_month
  due_year_month:
    description: "Due period in year-month format (YYYYMM); month when the charge is due"
    lineage:
      - datalake_retsuko_raw.entry_partitioned.due_year_month
  ts_created:
    description: "Timestamp when the entry was created in the source system"
    lineage:
      - datalake_retsuko_raw.entry_partitioned.created_at
  ts_synced:
    description: "Date that indicates when the entry was synced from SB to Retsuko"
    lineage:
      - datalake_retsuko_raw.entry_partitioned.synced_at
  ts_retsuko_created:
    description: "Timestamp when the entry was created in Retsuko system"
    lineage:
      - datalake_retsuko_raw.entry_partitioned.retsuko_created_at
  ts_retsuko_updated:
    description: "Timestamp when the entry was last updated in Retsuko system"
    lineage:
      - datalake_retsuko_raw.entry_partitioned.retsuko_updated_at
  year:
    description: "Partition year for table partitioning"
    lineage:
      - datalake_retsuko_raw.entry_partitioned.year
  month:
    description: "Partition month for table partitioning"
    lineage:
      - datalake_retsuko_raw.entry_partitioned.month
  day:
    description: "Partition day for table partitioning"
    lineage:
      - datalake_retsuko_raw.entry_partitioned.day
