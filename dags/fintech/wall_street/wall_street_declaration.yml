dag:
  name: wall_street
  schedule_start_date: 2020, 12, 21
  schedule_interval: 0 6 * * *
  owner: Data Fintech
  documentation:
    dag_purpose: |
      This DAG creates the full tables for Wall Street, a hub that integrates with financial servide providers.
workflow:
  type: cdc
  layer: raw
  custom_schema: wall_street
  database_type: mysql
  source_database: wallstreet
  source_schema: wallstreet
  lineage_product_database_name: wallstreet
  dbutils_secret_key: WALL_STREET_DB
  tables_customization:
    Blocklist:
      clean_table_name: blocklist
      primary_keys: ["id"]
    Charge:
      clean_table_name: charge
      primary_keys: ["id"]
    Charge_AUD:
      clean_table_name: charge_aud
      primary_keys: ["id", "rev"]
    ChargeMundipagg:
      clean_table_name: charge_mundipagg
      primary_keys: ["id"]
    Chargeback:
      clean_table_name: chargeback
      primary_keys: ["id"]
    ChargebackNotification:
      clean_table_name: chargeback_notification
      primary_keys: ["id"]
    CreditCard:
      clean_table_name: creditcard
      primary_keys: ["id"]
    Invoice:
      clean_table_name: invoice
      primary_keys: ["id"]
    InvoiceSubscriptionItem:
      clean_table_name: invoice_subscription_item
      primary_keys: ["id"]
    Subscription:
      clean_table_name: subscription
      primary_keys: ["id"]
    SubscriptionItem:
      clean_table_name: subscription_item
      primary_keys: ["id"]
    Store:
      clean_table_name: store
      primary_keys: ["id"]
cluster:
  type: databricks_12_2_med_general_cluster
  custom_libraries:
    - jar: "{artifacts_bucket}/mysql-connector-java/mysql-connector-java-5.1.47.jar"
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
