database_name: datalake_wall_street_clean
table_name: charge_aud
owner: juliana.hocihara@quintoandar.com.br
domain: Fintech
description: "Audit log of charge records from Wall Street, including revision
  metadata and field-level change tracking."
columns:
  id:
    lineage:
      - datalake_wall_street_raw.charge_aud.id
    description: "Unique identifier of the charge."
  id_external:
    lineage:
      - datalake_wall_street_raw.charge_aud.externalid
    description: "External identifier for the charge."
  rev:
    lineage:
      - datalake_wall_street_raw.charge_aud.rev
    description: "Revision identifier."
  rev_type:
    lineage:
      - datalake_wall_street_raw.charge_aud.revtype
    description: Financial attribute representing rev type on the charge_aud dataset.
  rev_end:
    lineage:
      - datalake_wall_street_raw.charge_aud.revend
    description: "Revision end identifier."
  acquire:
    lineage:
      - datalake_wall_street_raw.charge_aud.acquire
    description: Financial attribute representing acquire on the charge_aud dataset.
  id_acquire:
    lineage:
      - datalake_wall_street_raw.charge_aud.acquireid
    description: Identifier for the acquire referenced by this financial record.
  charge_status:
    lineage:
      - datalake_wall_street_raw.charge_aud.chargestatus
    description: Financial attribute representing charge status on the charge_aud dataset.
  acquire_charge_status:
    lineage:
      - datalake_wall_street_raw.charge_aud.acquirechargestatus
    description: Financial attribute representing acquire charge status on the charge_aud dataset.
  acquire_auth_code:
    lineage:
      - datalake_wall_street_raw.charge_aud.acquireauthcode
    description: "Acquire authorization code."
  acquire_nsu:
    lineage:
      - datalake_wall_street_raw.charge_aud.acquirensu
    description: Financial attribute representing acquire nsu on the charge_aud dataset.
  id_acquire_transaction:
    lineage:
      - datalake_wall_street_raw.charge_aud.acquiretid
    description: Identifier for the acquire transaction referenced by this financial record.
  ts_paid:
    lineage:
      - datalake_wall_street_raw.charge_aud.paidat
    description: "Timestamp when the charge was paid."
  ts_updated:
    lineage:
      - datalake_wall_street_raw.charge_aud.lastupdate
    description: "Timestamp when the charge was updated."
