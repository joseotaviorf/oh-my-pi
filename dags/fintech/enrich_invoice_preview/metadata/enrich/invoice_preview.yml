---
database_name: datalake_invoice_preview
table_name: invoice_preview
owner: sonia.gondo@quintoandar.com.br
domain: Fintech
description: |
  Stakeholder-ready SeuBarriga invoice preview snapshot for Brazil. Fully refreshed on
  each run with the morning export only: most recent load partition day and highest
  ts_load among export_slot=morning rows (afternoon append loads in clean are excluded).
  Applies sign convention for validation, blocked rename, payment_installment parsing,
  and exposes invoice_filename for export traceability. For historical loads use
  datalake_invoice_preview_clean.invoice_preview.
columns:
  id_contract:
    description: EBDB contract identifier for the rental contract associated with the preview billing line.
    lineage:
      - datalake_invoice_preview_clean.invoice_preview.id_contract
  contract_version:
    description: Contract version string exported by SeuBarriga for the preview row.
    lineage:
      - datalake_invoice_preview_clean.invoice_preview.contract_version
  blocked:
    description: Whether the contract is blocked from invoicing in the preview snapshot, aligned with SeuBarriga export naming.
    lineage:
      - datalake_invoice_preview_clean.invoice_preview.is_blocked
  is_not_invoiceable:
    description: Whether SeuBarriga marked this preview billing line as not invoiceable, from the CSV not-invoiceable flag.
    lineage:
      - datalake_invoice_preview_clean.invoice_preview.is_not_invoiceable
  paid_from:
    description: Payer or origin side of the preview billing line as exported by SeuBarriga.
    lineage:
      - datalake_invoice_preview_clean.invoice_preview.paid_from
  paid_to:
    description: Counterparty or destination side of the preview billing line as exported by SeuBarriga.
    lineage:
      - datalake_invoice_preview_clean.invoice_preview.paid_to
  payment_description:
    description: Human-readable description of the preview billing line as shown in SeuBarriga.
    lineage:
      - datalake_invoice_preview_clean.invoice_preview.payment_description
  amount:
    description: Signed monetary amount of the preview line; negative when paid_from is Proprietario or Inquilino.
    lineage:
      - datalake_invoice_preview_clean.invoice_preview.paid_amount
      - datalake_invoice_preview_clean.invoice_preview.paid_from
  item_category:
    description: SeuBarriga item or category code for the preview entry, such as rent or utilities.
    lineage:
      - datalake_invoice_preview_clean.invoice_preview.item_category
  year_month:
    description: Accrual year-month of the preview entry as an integer in YYYYMM format.
    lineage:
      - datalake_invoice_preview_clean.invoice_preview.entry_accrual_year_month
  dt_due:
    description: Due date of the preview entry as exported by SeuBarriga.
    lineage:
      - datalake_invoice_preview_clean.invoice_preview.dt_due
  dt_tenant_due:
    description: Tenant invoice due date recorded in the preview snapshot.
    lineage:
      - datalake_invoice_preview_clean.invoice_preview.dt_tenant_due
  dt_tenant_paid:
    description: Tenant paid date recorded in the preview export when a payment date is available.
    lineage:
      - datalake_invoice_preview_clean.invoice_preview.dt_tenant_paid
  tenant_status:
    description: Preview status label for the tenant-side monthly invoice in SeuBarriga.
    lineage:
      - datalake_invoice_preview_clean.invoice_preview.tenant_status
  dt_landlord_due:
    description: Landlord invoice due date recorded in the preview snapshot.
    lineage:
      - datalake_invoice_preview_clean.invoice_preview.dt_landlord_due
  dt_landlord_paid:
    description: Landlord paid date recorded in the preview export when a payment date is available.
    lineage:
      - datalake_invoice_preview_clean.invoice_preview.dt_landlord_paid
  landlord_status:
    description: Preview status label for the landlord-side monthly invoice in SeuBarriga.
    lineage:
      - datalake_invoice_preview_clean.invoice_preview.landlord_status
  payment_purpose:
    description: Invoice purpose code exported by SeuBarriga for the preview billing line.
    lineage:
      - datalake_invoice_preview_clean.invoice_preview.payment_purpose
  dt_tenant_invoice_created_at:
    description: Date the tenant monthly invoice was created, when already present in the preview export.
    lineage:
      - datalake_invoice_preview_clean.invoice_preview.dt_tenant_invoice_created_at
  dt_landlord_invoice_created_at:
    description: Date the landlord monthly invoice was created, when already present in the preview export.
    lineage:
      - datalake_invoice_preview_clean.invoice_preview.dt_landlord_invoice_created_at
  ts_load:
    description: Timestamp of the selected morning clean snapshot batch (latest ts_load among export_slot=morning rows on the most recent load partition day).
    lineage:
      - datalake_invoice_preview_clean.invoice_preview.ts_load
  invoice_filename:
    description: Source CSV filename of the SeuBarriga invoice preview export for the selected snapshot batch.
    lineage:
      - datalake_invoice_preview_clean.invoice_preview.invoice_filename
  invoice_accrual_year_month:
    description: Accrual year-month parsed from the source invoice preview CSV filename.
    lineage:
      - datalake_invoice_preview_clean.invoice_preview.invoice_accrual_year_month
  country:
    description: Country code associated with the contract; only Brazil rows are materialized in this table.
    lineage:
      - datalake_invoice_preview_clean.invoice_preview.country
  last_modified_by_name:
    description: Display name of the SeuBarriga user who last changed this preview billing line in the selected morning snapshot.
    lineage:
      - datalake_invoice_preview_clean.invoice_preview.last_modified_by_name
  last_modified_by_email:
    description: Email of the SeuBarriga user who last changed this preview billing line in the selected morning snapshot.
    lineage:
      - datalake_invoice_preview_clean.invoice_preview.last_modified_by_email
  ts_created:
    description: Timestamp when this preview billing line was created in SeuBarriga, as recorded in the clean snapshot.
    lineage:
      - datalake_invoice_preview_clean.invoice_preview.ts_created
  payment_installment:
    description: Installment number parsed from payment_description when it contains parcela; defaults to 1 otherwise.
    lineage:
      - datalake_invoice_preview_clean.invoice_preview.payment_description
  year:
    description: Load partition year of the selected snapshot batch in the clean table (metadata only; table is not partitioned).
    lineage:
      - datalake_invoice_preview_clean.invoice_preview.year
  month:
    description: Load partition month of the selected snapshot batch in the clean table (metadata only; table is not partitioned).
    lineage:
      - datalake_invoice_preview_clean.invoice_preview.month
  day:
    description: Load partition day of the selected snapshot batch in the clean table (metadata only; table is not partitioned).
    lineage:
      - datalake_invoice_preview_clean.invoice_preview.day
