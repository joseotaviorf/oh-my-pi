dag:
  name: trato_feito_auxiliar
  owner: Data Fintech
  schedule_interval: 0 3 * * *
  documentation:
    dag_purpose: |
      [Trato Feito](https://github.com/quintoandar/trato-feito) is a microservice that manages the negotiation flows between QuintoAndar and its debtors. This DAG is responsible to extract auxiliar tables, i.e, not essencial for business analysis.
workflow:
  type: database_pull
  layer: raw
  database_type: postgres
  custom_schema: trato_feito
  dbutils_secret_key: TRATO_FEITO_DB
  lineage_product_database_name: tratofeito
  tables_customization:
    collector_load: {}
    collector: {}
    events_batch: {}
    status_sync: {}
    document_generation: {}
    document_generation_aud: {}
cluster:
  type: databricks_10_4_med_general_cluster
