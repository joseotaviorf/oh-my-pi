---
database_name: datalake_cyber_clean
table_name: bureau_rejections
owner: bianca.martins@quintoandar.com.br
domain: Fintech
description: |
  Stores information about contracts that were rejected by the bureau.
  Contains the rejection code and the rejected record. Rejected records are stored for later treatment by the BackOffice area.
columns:
  ts_billing_cycle:
    description: "Billing cycle date"
    lineage:
      - datalake_cyber_bureau_raw.tb_rejeicoes_bureau.DT_CICLO_COBRANCA
  cpf_cnpj:
    description: "Client CPF/CNPJ"
    lineage:
      - datalake_cyber_bureau_raw.tb_rejeicoes_bureau.CD_CPFCNPJ_CLI
  person_type:
    description: "Person type: Physical Person or Legal Entity"
    lineage:
      - datalake_cyber_bureau_raw.tb_rejeicoes_bureau.TP_PESSOA_CLI
  remittance_number:
    description: "Remittance number associated with the rejection"
    lineage:
      - datalake_cyber_bureau_raw.tb_rejeicoes_bureau.NR_REMESSA
  id_bureau:
    description: "Bureau ID that rejected the record"
    lineage:
      - datalake_cyber_bureau_raw.tb_rejeicoes_bureau.CD_BUREAU
  id_company:
    description: "Company ID"
    lineage:
      - datalake_cyber_bureau_raw.tb_rejeicoes_bureau.CD_EMPRESA
  contract_group:
    description: "Contract group: 1 for QuintoAndar, 2 for QuintoCred"
    lineage:
      - datalake_cyber_bureau_raw.tb_rejeicoes_bureau.CD_GRUPO
  creditor:
    description: "Creditor name: QuintoAndar or QuintoCred"
    lineage:
      - datalake_cyber_bureau_raw.tb_rejeicoes_bureau.CD_GRUPO
  id_contract:
    description: "Contract number that was rejected"
    lineage:
      - datalake_cyber_bureau_raw.tb_rejeicoes_bureau.CD_CONTRATO
  contract_bureau_code:
    description: "Contract code as registered in the bureau"
    lineage:
      - datalake_cyber_bureau_raw.tb_rejeicoes_bureau.CD_CTR_BUREAU
  reason_code:
    description: "Rejection reason code from the bureau"
    lineage:
      - datalake_cyber_bureau_raw.tb_rejeicoes_bureau.CD_MOTIVO
  detail_line:
