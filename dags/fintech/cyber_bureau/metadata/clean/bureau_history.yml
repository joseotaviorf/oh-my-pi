database_name: datalake_cyber_bureau_clean
table_name: bureau_history
owner: juliana.hocihara@quintoandar.com.br
domain: Fintech
description:
  Bureau derogation and rehabilitation history with negativation and rehabilitation
  movements.
columns:
  requesting_user:
    description: "User: 'Automatic' (when generated by the negativation/rehabilitation network) or Login informed in the forced negativation/rehabilitation file"
    lineage:
      - datalake_cyber_bureau_raw.tb_historico_bureau.CD_CTR_BUREAU
  movement_status:
    description: "Status: C = Confirmed, R = Rejected, A = Awaiting Return"
    lineage:
      - datalake_cyber_bureau_raw.tb_historico_bureau.IN_SITUACAO_MOV
  origin_indicator:
    description: "Type: 'Batch' - Origin of the request"
    lineage:
      - datalake_cyber_bureau_raw.tb_historico_bureau.IN_ORIGEM_SOL
  return_description:
    description: return_description field from the Cyber Bureau history feed.
    lineage:
      - datalake_cyber_bureau_raw.tb_historico_bureau.DS_RET_BUREAU
  person_type:
    description: person_type field from the Cyber Bureau history feed.
    lineage:
      - datalake_cyber_bureau_raw.tb_historico_bureau.TP_PESSOA_CLI
  remittance_number:
    description: Financial attribute representing remittance number on the bureau_history dataset.
    lineage:
      - datalake_cyber_bureau_raw.tb_historico_bureau.NR_REMESSA
  installment_amount:
    description: "Contract value"
    lineage:
      - datalake_cyber_bureau_raw.tb_historico_bureau.VL_PARCELA
  ts_installment_due_date:
    description: Timestamp when installment due date occurred in the upstream fintech system.
    lineage:
      - datalake_cyber_bureau_raw.tb_historico_bureau.VL_PARCELA
  ts_request:
    description: Timestamp when the bureau negativation or rehabilitation request was submitted.
    lineage:
      - datalake_cyber_bureau_raw.tb_historico_bureau.DT_SOLICITACAO
  delay_days:
    description: delay_days field from the Cyber Bureau history feed.
    lineage:
      - datalake_cyber_bureau_raw.tb_historico_bureau.QT_DIA_ATRASO
  installment_number:
    description: "Number of the negatived installment"
    lineage:
      - datalake_cyber_bureau_raw.tb_historico_bureau.NR_PARCELA
  ts_load:
    description: Timestamp when the row was materialized into the governance lake by the ETL pipeline.
    lineage: []
  ts_bureau_return:
    description: Timestamp when bureau return occurred in the upstream fintech system.
    lineage:
      - datalake_cyber_bureau_raw.tb_historico_bureau.DT_RET_BUREAU
  guarantor_sequence_number:
    description: Financial attribute representing guarantor sequence number on the bureau_history dataset.
    lineage:
      - datalake_cyber_bureau_raw.tb_historico_bureau.NU_SEQAVAL
  id_pac:
    description: Identifier for the pac referenced by this financial record.
    lineage:
      - datalake_cyber_bureau_raw.tb_historico_bureau.CD_PAC
  id_company:
    description: Identifier for the company referenced by this financial record.
    lineage:
      - datalake_cyber_bureau_raw.tb_historico_bureau.CD_EMPRESA
  id_return:
    description: Identifier for the return referenced by this financial record.
    lineage:
      - datalake_cyber_bureau_raw.tb_historico_bureau.CD_RET_BUREAU
  id_guarantor_account:
    description: Identifier for the guarantor account referenced by this financial record.
    lineage:
      - datalake_cyber_bureau_raw.tb_historico_bureau.CD_CONTA_AVAL
  contract_group:
    description: Financial attribute representing contract group on the bureau_history dataset.
    lineage:
      - datalake_cyber_bureau_raw.tb_historico_bureau.CD_GRUPO
  is_guarantor:
    description: Indicates whether guarantor applies to this financial record.
    lineage:
      - datalake_cyber_bureau_raw.tb_historico_bureau.IN_AVAL_ACIONA
  id_contract:
    description: Rental or sale contract identifier linking this financial record to the lease agreement.
    lineage:
      - datalake_cyber_bureau_raw.tb_historico_bureau.CD_CONTRATO
  max_delay_days:
    description: Financial attribute representing max delay days on the bureau_history dataset.
    lineage:
      - datalake_cyber_bureau_raw.tb_historico_bureau.QT_DIA_MAXIMO
  is_legacy_sending:
    description: Indicates whether legacy sending applies to this financial record.
    lineage:
      - datalake_cyber_bureau_raw.tb_historico_bureau.IN_ENVIO_LEGADO
  cpf_cnpj:
    description: Financial attribute representing cpf cnpj on the bureau_history dataset.
    lineage:
      - datalake_cyber_bureau_raw.tb_historico_bureau.CD_CPFCNPJ_CLI
  ts_movement:
    description: Timestamp when movement occurred in the upstream fintech system.
    lineage:
      - datalake_cyber_bureau_raw.tb_historico_bureau.DT_MOVIMENTO
  creditor:
    description: Financial attribute representing creditor on the bureau_history dataset.
    lineage:
      - datalake_cyber_bureau_raw.tb_historico_bureau.CD_GRUPO
  is_sent_by_quinto:
    description: Indicates whether sent by quinto applies to this financial record.
    lineage:
      - datalake_cyber_bureau_raw.tb_historico_bureau.ENVIADOQUINTO
  min_delay_days:
    description: Financial attribute representing min delay days on the bureau_history dataset.
    lineage:
      - datalake_cyber_bureau_raw.tb_historico_bureau.QT_DIA_MINIMO
  id_bureau:
    description: Identifier for the bureau referenced by this financial record.
    lineage:
      - datalake_cyber_bureau_raw.tb_historico_bureau.CD_BUREAU
  id_contract_bureau:
    description: Identifier for the contract bureau referenced by this financial record.
    lineage:
      - datalake_cyber_bureau_raw.tb_historico_bureau.CD_CTR_BUREAU
  id_policy:
    description: Identifier for the policy referenced by this financial record.
    lineage:
      - datalake_cyber_bureau_raw.tb_historico_bureau.CD_POLITICA
  id_contract_unit:
    description: Identifier for the contract unit referenced by this financial record.
    lineage:
      - datalake_cyber_bureau_raw.tb_historico_bureau.CD_UNIDADE_CTR
  id_action:
    description: Identifier for the action (NEG = Negativation or REA = Rehabilitation)
    lineage:
      - datalake_cyber_bureau_raw.tb_historico_bureau.CD_ACAO_BUREAU
  id_register_remittance:
    description: Identifier for the register remittance referenced by this financial record.
    lineage:
      - datalake_cyber_bureau_raw.tb_historico_bureau.ID_REG_REMESSA
