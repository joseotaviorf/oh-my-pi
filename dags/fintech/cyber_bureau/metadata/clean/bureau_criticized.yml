      - datalake_cyber_bureau_raw.tb_criticados_mnr.CD_BUREAU
  id_company:
    description: "Company ID"
    lineage:
      - datalake_cyber_bureau_raw.tb_criticados_mnr.CD_EMPRESA
  installment_number:
    description: "Installment number"
    lineage:
      - datalake_cyber_bureau_raw.tb_criticados_mnr.NR_PARCELA
  installment_amount:
