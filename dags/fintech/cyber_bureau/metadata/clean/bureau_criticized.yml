      - datalake_cyber_bureau_raw.tb_criticados_mnr.DT_SOLICITACAO
  contract_group:
    description: "Contract group: 1 for QuintoAndar, 2 for QuintoCred"
    lineage:
      - datalake_cyber_bureau_raw.tb_criticados_mnr.CD_GRUPO
  creditor:
    description: "Creditor name: QuintoAndar or QuintoCred"
    lineage:
      - datalake_cyber_bureau_raw.tb_criticados_mnr.CD_GRUPO
  id_contract:
    description: "Contract number that was criticized"
    lineage:
      - datalake_cyber_bureau_raw.tb_criticados_mnr.CD_CONTRATO
  id_policy:
    description: "Policy ID (negativation/rehabilitation queue)"
    lineage:
      - datalake_cyber_bureau_raw.tb_criticados_mnr.CD_POLITICA
  bureau_action_description:
