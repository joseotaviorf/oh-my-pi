database_name: datalake_cyber_bureau_clean
table_name: bureau_agency
owner: juliana.hocihara@quintoandar.com.br
domain: Fintech
description: 'Stores company data (QuintoAndar/QuintoCred) that will be used in the
  negativation and rehabilitation processes.

  This table is parameterized via screen in CyberEngine.

  '
columns:
  id_company:
    description: Identifier of the QuintoAndar or QuintoCred company used in bureau
      negativation.
    lineage:
    - datalake_cyber_bureau_raw.tb_empresa.CD_EMPRESA
  company_name:
    description: Legal name of the company configured in CyberEngine for bureau operations.
    lineage:
    - datalake_cyber_bureau_raw.tb_empresa.NM_EMPRESA
  company_cnpj:
    description: Company CNPJ (tax identification number)
    lineage:
    - datalake_cyber_bureau_raw.tb_empresa.CD_EMP_CNPJ
  ts_load:
    description: Timestamp when the record was loaded into the clean layer.
