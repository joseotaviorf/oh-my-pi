---
database_name: dw_liquidity
table_name: fact_house_rent_liquidity
owner: andressa.apio@quintoandar.com.br
domain: Fintech
description: Fact table containing rent liquidity scores for house listings, generated by the rent liquidity model.
columns:
  sk_house:
    description: Surrogate key of the house.
    lineage:
      - wonka.house_rent_liquidity__latest.id
  sk_house_listing:
    description: Surrogate key of the most recent house listing associated with the liquidity score.
    lineage:
      - wonka.house_rent_liquidity__latest.latest_house_listing_id
  rent_liquidity_model_version:
    description: Version of the rent liquidity model used to generate the score.
    lineage:
      - wonka.house_rent_liquidity__latest.rent_liquidity_model_version
  rent_liquidity_score:
    description: Liquidity score calculated by the rent liquidity model for the house listing.
    lineage:
      - wonka.house_rent_liquidity__latest.rent_liquidity_score
  ts_publicated:
    description: Timestamp indicating when the house listing was published.
    lineage:
      - wonka.house_rent_liquidity__latest.ts_publicated
  ts_created:
    description: Timestamp indicating when the liquidity score record was created.
    lineage:
      - wonka.house_rent_liquidity__latest.timestamp
  ts_load:
    description: Timestamp indicating when the data was loaded into the data warehouse.
