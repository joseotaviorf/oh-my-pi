    description: "Date on which the position was settled or cancelled - the reference date of the SAP ledger movement that closed the accumulated balance of this id_finance_entity_entry and account_number (payment, write-off, chargeback, refund or reversal). NULL while the position is still open, so filtering by dt_filter_end for a period returns only positions that were actually closed in that period, and a NULL means the position had no settlement - never that the signal is missing for a closed one. Unlike dt_filter, which stays on the posting date of this row's version, dt_filter_end looks at every movement of the position regardless of version. Only the sources whose SAP accounts carry a settlement signal populate it: retsuko_transactional, retsuko_transactional_third_parties, retsuko_third_parties, retsuko_provision and retsuko_revenue_share. It is always NULL for every other accounting type (monopoly, kill queue, bank settlement, reverse accounts, reverse straw, postponement, retsuko_invoice, retsuko_invoice_unified, retsuko_revenue_accounting, retsuko_write_off, rental_guarantee_invoice, retsuko_broker_commission), so a NULL on those rows means the signal does not exist for that source rather than an open position."
  ts_load:
    description: "Timestamp of when the data was inserted into the table"