---
database_name: datalake_cyber_legal_clean
table_name: legal_batch
owner: juliana.hocihara@quintoandar.com.br
domain: Fintech
description: "Table containing information about closed batches with authorized expenses."
columns:
  id_legal_batch:
    description: "Unique identifier of the legal batch"
    lineage:
      - datalake_cyber_legal_raw.legal_batch.LLCODIGO
  batch_type:
    description: "Number of the batch type (1,2 or 3)"
    lineage:
      - datalake_cyber_legal_raw.legal_batch.LLTIPO
  batch_status:
    description: "Status of the batch (A, F or P)"
    lineage:
      - datalake_cyber_legal_raw.legal_batch.LLSTATUS
  dt_creation:
    description: "Date and time when the legal batch was created"
    lineage:
      - datalake_cyber_legal_raw.legal_batch.LLDATACRIACAO
  dt_closed:
    description: "Date and time when the legal batch was closed"
    lineage:
      - datalake_cyber_legal_raw.legal_batch.LLDATAFECHAMENTO
  dt_print:
    description: "Date and time when the legal batch was printed"
    lineage:
      - datalake_cyber_legal_raw.legal_batch.LLDATAIMPRESSAO
  dt_approval:
    description: "Date and time when the legal batch was approved"
    lineage:
      - datalake_cyber_legal_raw.legal_batch.LLDATAAPROVACAO
  dt_payment:
    description: "Date and time when the legal batch was paid"
    lineage:
      - datalake_cyber_legal_raw.legal_batch.LLDATAPAGAMENTO
  dt_canceled:
    description: "Date and time when the legal batch was canceled"
    lineage:
      - datalake_cyber_legal_raw.legal_batch.LLDATACANCELAMENTO
  office:
    description: "Office where the legal batch was created"
    lineage:
      - datalake_cyber_legal_raw.legal_batch.LLESCRITORIO
  origin:
    description: "Source channel code indicating how expense items were grouped into this batch (e.g. office or automated import)."
    lineage:
      - datalake_cyber_legal_raw.legal_batch.LLORIGEM
  quantity:
    description: "Quantity of registers in the batch"
    lineage:
      - datalake_cyber_legal_raw.legal_batch.LLQTD
  value:
    description: "Total value of the batch in BRL"
    lineage:
      - datalake_cyber_legal_raw.legal_batch.LLVALOR
  dt_rejected:
    description: "Date and time when the legal batch was rejected"
    lineage:
      - datalake_cyber_legal_raw.legal_batch.LLDATAREJEICAO
  invoice_number:
    description: "Invoice number if exists"
    lineage:
      - datalake_cyber_legal_raw.legal_batch.LLNOTAFISCAL
  dt_issued:
    description: "Date and time when the legal batch was issued"
    lineage:
      - datalake_cyber_legal_raw.legal_batch.LLDATAEMISSAO
  conpag_programming:
    description: "Date and time when the legal batch was programmed for payment"
    lineage:
      - datalake_cyber_legal_raw.legal_batch.LLPROGRAMACAOCONPAG
  bank:
    description: "Bank where the legal batch is associated"
    lineage:
      - datalake_cyber_legal_raw.legal_batch.LLBANCON
  user_created:
    description: "CyberLegal operator login recorded when the expense batch was first opened in the source system (LLUSUARIOC)."
    lineage:
      - datalake_cyber_legal_raw.legal_batch.LLUSUARIOC
  user_closed:
    description: "User who finalized the legal batch"
    lineage:
      - datalake_cyber_legal_raw.legal_batch.LLUSUARIOF
  code_vw:
    description: "External integration reference code used by the VW payment interface in CyberCredit/CyberLegal."
    lineage:
      - datalake_cyber_legal_raw.legal_batch.LLCODVW
  user_printed:
    description: "CyberLegal operator login recorded when the batch documents were printed for payment processing (LLUSUARIOI)."
    lineage:
      - datalake_cyber_legal_raw.legal_batch.LLUSUARIOI
  user_approved:
    description: "CyberLegal operator login who authorized the batch for payment after review (LLUSUARIOAP)."
    lineage:
      - datalake_cyber_legal_raw.legal_batch.LLUSUARIOAP
  user_rejected:
    description: "CyberLegal operator login who rejected the batch during the approval workflow (LLUSUARIOR)."
    lineage:
      - datalake_cyber_legal_raw.legal_batch.LLUSUARIOR
