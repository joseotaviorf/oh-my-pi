---
database_name: datalake_cyber_legal_clean
table_name: values_list_catalog
owner: juliana.hocihara@quintoandar.com.br
domain: Fintech
description: |
  This table contains the definition and catalog of valid value lists available in the CyberFinancial system.
  It defines which fields have predefined values and their characteristics.
  Used for data validation, dropdown population, and business rule enforcement.
columns:
  id_value:
    description: "Unique identifier of the values list"
    lineage:
      - datalake_cyber_raw.lov.LVID
  field_with_predefined_values:
    description: "Name of the field that has predefined values"
    lineage:
      - datalake_cyber_raw.lov.LVFIELD
  max_length:
    description: "Maximum allowed length for the field"
    lineage:
      - datalake_cyber_raw.lov.LVLENGTH
  name:
    description: "Descriptive name of the values list"
    lineage:
      - datalake_cyber_raw.lov.LVNAME
  field_data_type:
    description: "Field data type in the database (e.g., VARCHAR2, NUMBER)"
    lineage:
      - datalake_cyber_raw.lov.LVTYPE
