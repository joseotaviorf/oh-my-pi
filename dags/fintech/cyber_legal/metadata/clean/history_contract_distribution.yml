---
database_name: datalake_cyber_legal_homolog_clean
table_name: history_contract_distribution
owner: juliana.hocihara@quintoandar.com.br
domain: Fintech
description: |
  Historical table with agency redistribution performance. Table granularity - id_contract + contract_group.
  New records are inserted with each new distribution, maintaining the complete history of distributions.
  The table is only updated when agency/advisory is updated. At this point, the table is filled in with the photo of the contract with its appropriate information (queue..)
columns:
  id_contract:
    description: "ID contract = ID Contract (TF: contract.external-id) + Contract Group (ID Product debtor.product-code) + Revision"
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_ACCT
  id_client:
    description: "ID Client = CPF (TF: client.document)"
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_SSNUM
  contract_group:
    description: "Contract group identifier. Values: '1' = QuintoAndar, '2' = QuintoCred"
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_ACCTG
  creditor:
    description: "Creditor name derived from contract group. Values: '1' = QuintoAndar, '2' = QuintoCred"
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_ACCTG
  cpf_cnpj_client:
    description: "Client CPF or CNPJ document number"
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_CPFCNPJ
  head_office:
    description: "Head office identifier (matriz)"
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_MATRIZ
  regional:
    description: "Regional identifier"
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_REGIONAL
  branch:
    description: "Branch identifier (filial)"
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_FILIAL
  collection_phase:
    description: "Collection phase identifier (fase de cobrança)"
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_FASE_COBRANCA
  delay_contamined_days:
    description: "Days beteween the olders invoice due date (delinquency_master.ts_due_oldest_invoice = delqmst.dmdlqdt) and TODAY.  It's the same as delinquency_master.delay_contamined_days (DELQMST.DMDAYS)"
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_DIASATRASO
  selection_criteria:
    description: "These values ​​are queues defined by QuintoAndar to identify the type of charging/collection action in the decision tree. delinquent_master.segmentation_queue (DELQMST.DMQUE)"
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_CRIT_SELECAO
  year_month:
    description: "Safra format YYYYMM"
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_REFSAFRA
  agency:
    description: "Agency/advisory identifier responsible for the contract collection"
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_ASSESSORIA
  new_agency:
    description: "New agency/advisory identifier after redistribution"
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_NOVA_ASSESSORIA
  status:
    description: "Contract Status. Same as deliquent_master.contract_status (delqmst.DMSTATUS)"
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_STATUS
  new_status:
    description: "New contract status after redistribution"
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_NOVO_STATUS
  year_month_received:
    description: "Year and month when payment was received, format YYYYMM (ano/mês recebido)"
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_ANOMES_RECEB
  year_month_recovered:
    description: "Year and month when contract was recovered, format YYYYMM (ano/mês recuperado)"
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_ANOMES_RECUPERADO
  zero_installment_flag:
    description: "Flag indicating if the contract has zero installment (prestação zero)"
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_IN_PRESTACAO_ZERO
  flag_performance:
    description: "Performance flag indicating collection performance metrics"
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_DESEMPENHO
  segmentation_queue:
    description: "Same as 'delinquent_master.current_queue'"
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_QUE1
  commission_queue:
    description: "Queue 2. In Recupera this would be the distributor. A contract can be in more than one queue. Same as 'delinquent_master.current_queue_2'"
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_QUE2
  agreement_queue:
    description: "Queue 3. In Recupera this would be the distributor. A contract can be in more than one queue. Same as 'delinquent_master.current_queue_3'"
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_QUE3
  digital_channel_queue:
    description: "Queue 4. In Recupera this would be the distributor. A contract can be in more than one queue. Same as 'delinquent_master.current_queue_4'"
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_QUE4
  eviction_queue:
    description: "Queue 5. In Recupera this would be the distributor. A contract can be in more than one queue. Same as 'delinquent_master.current_queue_5'"
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_QUE5
  credit_denial_queue:
    description: "Queue 6. In Recupera this would be the distributor. A contract can be in more than one queue. Same as 'delinquent_master.current_queue_6'"
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_QUE6
  olos_dialer_label:
    description: "Label 1: Olos dialer label for automated calling system"
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_LABEL1
  label_2:
    description: "Label 2: Additional classification label"
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_LABEL2
  campaign_label:
    description: "Label 3: Campaign label for collection campaigns"
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_LABEL3
  serasa_limpa_nome_label:
    description: "Label 4: Serasa Limpa Nome label indicating clean credit status"
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_LABEL4
  evictions_label:
    description: "Label 5: Evictions label for contracts in eviction phase"
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_LABEL5
  label_6:
    description: "Label 6: Additional classification label"
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_LABEL6
  debt_amount:
    description: "Total debt amount (valor da dívida)"
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_VL_DIVIDA
  new_debt_amount:
    description: "New debt amount after redistribution (valor da nova dívida)"
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_VL_NOVA_DIVIDA
  balance_due_amount:
    description: "Balance due amount (valor do saldo devido)"
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_VL_SLD_DEVIDO
  new_balance_due_amount:
    description: "New balance due amount after redistribution (valor do novo saldo devido)"
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_VL_NOVO_SLD_DEVIDO
  accumulated_amount_received:
    description: "Accumulated amount received (valor recebido acumulado)"
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_VL_RECEB_ACUM
  received_amount_month:
    description: "Amount received in the month (valor recebido no mês)"
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_VL_RECEB_NO_MES
  recovered_amount:
    description: "Recovered amount (valor recuperado)"
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_VL_RECUPERADO
  new_installments_amount:
    description: "New installments amount (valor das novas prestações)"
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_VL_NOVAS_PREST
  paid_amount_the_biggest:
    description: "Largest paid amount (valor pago a maior)"
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_VL_PAGO_A_MAIOR
  excluded_amount:
    description: "Excluded amount (valor excluído)"
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_VL_EXCLUIDO
  ts_distribution:
    description: "Timestamp of contract distribution (data de disponibilização)"
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_DT_DISPONIBILIZACAO
  ts_redistribution:
    description: "Timestamp of contract redistribution (data de nova disponibilização)"
    lineage:
      - datalake_cyber_raw.tb_historico_disponibilizacao.HD_DT_NOVA_DISPONIB
  ts_load:
    description: "Timestamp when the record was loaded into the table"
    lineage: []
