dag:
  name: cyber_legal
  schedule_start_date: 2025, 8, 1
  schedule_interval: 0 8 * * *
  owner: Data Fintech
  callback_by_task: False
  documentation:
    dag_purpose: |
      ingestion of Cyber Legal system tables about debts and collections.
workflow:
  layer: raw
  type: custom_ingestion
  load_spark_job: load_cyber_raw
  custom_schema: cyber_legal
  extra_query_template_params:
    load_start_date:
      "{{ get_date_param(dag_run, macros.ds_add(data_interval_start |
      ds, 0), 'load_start_date') }}"
    load_end_date:
      "{{ get_date_param(dag_run, macros.ds_add(data_interval_start |
      ds, 2), 'load_end_date') }}"
  default_extraction_type: full
  spark_job_arguments:
    - "{environment}"
    - "{bucket}"
    - "{dag_name}"
    - "{table_name}"
    - "{load_start_date}"
    - "{load_end_date}"
    - "{extraction_type}"
    - "{partitions}"
  execution_timeout_hours: 14
  tables_customization:
    case:
      clean_table_name: case
      raw_extraction_type: incremental
      raw_partitions: [year, month, day]
      clean_extraction_type: full
      merge_on: [id_case]
      extra_spark_job_arguments:
        - "['CEDTUPD']"
        - False
        - "[]"
    casetype:
      clean_table_name: case_type
      extraction_type: full
      partitions: []
      extra_spark_job_arguments:
        - "[]"
        - False
        - "[]"
    castadf:
      clean_table_name: case_stage_definition
      extraction_type: full
      partitions: []
      extra_spark_job_arguments:
        - "[]"
        - False
        - "[]"
    court:
      clean_table_name: court
      extraction_type: full
      partitions: []
      extra_spark_job_arguments:
        - "[]"
        - False
        - "[]"
    cantfylg:
      clean_table_name: case_notification_log
      raw_extraction_type: incremental
      raw_partitions: [year, month, day]
      clean_extraction_type: full
      merge_on: [id_notification_request, id_notification_sequence]
      extra_spark_job_arguments:
        - "['CNDTUPD']"
        - True
        - "[]"
    caseuda:
      clean_table_name: case_uda
      extraction_type: full
      partitions: []
      extra_spark_job_arguments:
        - "[]"
        - True
        - "[]"
    casestag:
      clean_table_name: case_stage
      raw_extraction_type: incremental
      raw_partitions: [year, month, day]
      clean_extraction_type: full
      merge_on: [id_case, id_stage]
      extra_spark_job_arguments:
        - "['CSDTUPD']"
        - True
        - "[]"
    caseacct:
      clean_table_name: case_account
      raw_extraction_type: incremental
      raw_partitions: [year, month, day]
      clean_extraction_type: full
      merge_on: [id_case, id_contract_group, id_contract]
      extra_spark_job_arguments:
        - "['CCDTUPD']"
        - True
        - "[]"
    caalert:
      clean_table_name: case_alert
      raw_extraction_type: incremental
      raw_partitions: [year, month, day]
      clean_extraction_type: full
      merge_on: [id_alert]
      extra_spark_job_arguments:
        - "['ALDTUPD']"
        - True
        - "[]"
    caexpns:
      clean_table_name: case_expense
      extraction_type: full
      partitions: []
      extra_spark_job_arguments:
        - "[]"
        - True
        - "[]"
    cardacct:
      clean_table_name: card_account
      extraction_type: full
      partitions: []
      extra_spark_job_arguments:
        - "[]"
        - False
        - "[]"
    carqdoc:
      clean_table_name: case_required_document
      extraction_type: full
      partitions: []
      extra_spark_job_arguments:
        - "[]"
        - False
        - "[]"
    lov:
      clean_table_name: values_list_catalog
      extraction_type: full
      partitions: []
      extra_spark_job_arguments:
        - "[]"
        - False
        - "[]"
    lov_vals:
      clean_table_name: values_list
      extraction_type: full
      partitions: []
      extra_spark_job_arguments:
        - "[]"
        - False
        - "[]"
    actfil:
      clean_table_name: logs_juridical
      extraction_type: incremental
      partitions: [year, month, day]
      extra_spark_job_arguments:
        - "['ACENTDTE', 'ACACTDTE']"
        - True
        - "[]"
    tb_lote_legal:
      clean_table_name: legal_batch
      extraction_type: full
      partitions: []
      extra_spark_job_arguments:
        - "[]"
        - False
        - "[]"
    document:
      clean_table_name: document
      extraction_type: incremental
      partitions: [year, month, day]
      extra_spark_job_arguments:
        - "['DOADDDT']"
        - True
        - "[]"
    tb_desp_doc:
      clean_table_name: expense_document
      extraction_type: full
      partitions: []
      extra_spark_job_arguments:
        - "[]"
        - False
        - "[]"
