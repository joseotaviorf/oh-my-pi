      - datalake_owner_fees_raw.contract_aud.revtype
    description: Financial attribute representing rev type on the contract_aud dataset.
  rev_end:
    lineage:
      - datalake_owner_fees_raw.contract_aud.revend
    description: Financial attribute representing rev end on the contract_aud dataset.
  real_state_agent_share:
    lineage:
      - datalake_owner_fees_raw.contract_aud.real_state_agent_share
