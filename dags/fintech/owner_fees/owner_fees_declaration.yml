dag:
  name: owner_fees
  schedule_start_date: 2020, 8, 10
  schedule_interval: 0 5 * * *
  owner: Data Fintech
  documentation:
    dag_purpose: |
      This DAG creates the tables from [Ownerfees](https://github.com/quintoandar/owner-fees), a service that deals with fees related to the contract, listing and bills that are charged to the owner.
workflow:
  type: cdc
  layer: raw
  has_hive_sync: false
  database_type: postgres
  source_schema: public
  source_database: ownerfees
  custom_schema: owner_fees
  dbutils_secret_key: OWNERFEES_DB
  lineage_product_database_name: ownerfees
  tables_customization:
    admin_fee_option: {}
    admin_fee_option_aud: {}
    contract: {}
    contract_aud: {}
    contract_brokerage_fee: {}
    contract_brokerage_fee_aud: {}
    house: {}
    house_aud: {}
    house_brokerage_fee: {}
    house_brokerage_fee_aud: {}
    user_rev_info: {}
    users: {}
    users_aud: {}
cluster:
  type: databricks_13_3_med_mem_driver_min_memory_2_nodes_cluster
