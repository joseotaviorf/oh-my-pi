    lineage:
      - datalake_fintech_order_raw.event_info.external_id
  source:
    description: Source system or origin of the event info
    lineage:
      - datalake_fintech_order_raw.event_info.source
  event:
    description: Event type or category associated with the event info
    lineage:
      - datalake_fintech_order_raw.event_info.event
  ts_generated:
    description: Timestamp when the event info was generated or created in the source system
    lineage:
      - datalake_fintech_order_raw.event_info.generated_at
  ts_created:
    description: Timestamp when the event info record was created in the database
    lineage:
      - datalake_fintech_order_raw.event_info.created_at
