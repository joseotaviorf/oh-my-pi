---
table_name: dw_debt_recovery_staging.fact_installment
alert_channel: "#alerts-de-airflow-dags"
is_incremental:
  incremental_date_column: ts_load
  incremental_date_mask: yyyy-MM-dd
table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error
column_level_validations:
  id_installment:
    is_complete:
      severity_level: Error
    is_unique:
      severity_level: Error
  id_negotiation:
    is_complete:
      severity_level: Error
  ts_load:
    is_complete:
      severity_level: Error
