database_name: dw_debt_recovery
table_name: fact_negotiation
description: Negotiations of Debt Recovery
domain: Fintech
owner: ae-finance-fintech@quintoandar.com.br
columns:
  breached_installment:
    lineage:
    - datalake_debt_recovery.negotiation.breached_installment
    description: When the negotiation is breached, the installment number that was
      breached
  dt_expected_end:
    lineage:
    - datalake_debt_recovery.negotiation.dt_expected_end
    description: Date due of the last installment of this negotiation
  has_renegotiated:
    lineage:
    - datalake_debt_recovery.negotiation.has_renegotiated
    description: Boolean if this negotiation has already being renegotiated after
      breach (if the case)
  id_contract:
    lineage:
    - datalake_debt_recovery.negotiation.id_contract
    description: ''
  id_negotiation:
    lineage:
    - datalake_debt_recovery.negotiation.id_negotiation
    description: ''
  is_contract_recurrent_debtor:
    lineage:
    - datalake_debt_recovery.negotiation.is_contract_recurrent_debtor
    description: Boolean if this contract already had other debts
  negotiation_discount_amount:
    lineage:
    - datalake_debt_recovery.negotiation.negotiation_discount_amount
    description: Sum of all discount amount applied on debt related to this negotiation
  negotiation_fees_amount:
    lineage:
    - datalake_debt_recovery.negotiation.negotiation_fees_amount
    description: Sum of all fees amount applied on debt related to this negotiation
  negotiation_original_amount:
    lineage:
    - datalake_debt_recovery.negotiation.negotiation_original_amount
    description: Sum of all original debt amount related to this negotiation
  paid_amount:
    lineage:
    - datalake_debt_recovery.negotiation.paid_amount
    description: Sum of all PAID installments total_amount from this negotiation
  qt_installments:
    lineage:
    - datalake_debt_recovery.negotiation.qt_installments
    description: ''
  qt_installments_paid:
    lineage:
    - datalake_debt_recovery.negotiation.qt_installments_paid
    description: ''
  status:
    lineage:
    - datalake_debt_recovery.negotiation.status
    description: ''
    categories:
      broken: ''
      finished: ''
      ignored: ''
      invalid: ''
      offset: ''
      started: ''
  total_expected_amount:
    lineage:
    - datalake_debt_recovery.negotiation.total_expected_amount
    description: Sum of all installments total_amount from this negotiation
  ts_breach:
    lineage:
    - datalake_debt_recovery.negotiation.ts_breach
    description: If breached, the timestamp of the first installment not paid that
      went to bill TratoFeito table and was not paid.
  ts_created_at:
    lineage:
    - datalake_debt_recovery.negotiation.ts_created_at
    description: Timestamp of creation of negotiation
  ts_paid_all:
    lineage:
    - datalake_debt_recovery.negotiation.ts_paid_all
    description: If all installments are paid, the timestamp of last payment
  day:
    description: Day of ts_load
  month:
    description: Month of ts_load
  ts_load:
    description: Timestamp of load. Important to be used as a filter to “photo of
      that day” as this model is incremental
  year:
    description: Year of ts_load
