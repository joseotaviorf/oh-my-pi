database_name: dw_debt_recovery
table_name: fact_installment
description: Installments of negotiations
domain: Fintech
owner: ae-finance-fintech@quintoandar.com.br
columns:
  days_paid_late:
    lineage:
    - datalake_debt_recovery.installment.ts_paid_difference
    description: 'How many days the installment was paid late. This metric will only
      consider business days difference, nor any day. Eg: If paid on weekend, will
      not be considered late.'
  dt_due:
    lineage:
    - datalake_debt_recovery.installment.dt_due
    description: Due date
  id_installment:
    lineage:
    - datalake_debt_recovery.installment.id
    description: Installment ID
  id_negotiation:
    lineage:
    - datalake_debt_recovery.installment.id_negotiation
    description: Negotiation ID
  payment_type:
    lineage:
    - datalake_debt_recovery.installment.payment_type
    description: How installment was paid
    categories:
      boleto: ''
      credit-card: ''
  purpose:
    lineage:
    - datalake_debt_recovery.installment.purpose
    description: Reason of existence of this installment. Comes from retsuko.invoice
    categories:
      extra: ''
  status:
    lineage:
    - datalake_debt_recovery.installment.status
    description: Invoice status
    categories:
      expired: ''
      paid: ''
      pending: ''
      registered: ''
  total_amount:
    lineage:
    - datalake_debt_recovery.installment.total_amount
    description: Invoice total amount to be paid
  ts_paid:
    lineage:
    - datalake_debt_recovery.installment.ts_paid
    description: Timestamp of the date installment was paid, if the case.
  day:
    description: Day of ts_load
  month:
    description: Month of ts_load
  ts_load:
    description: Timestamp of load. Important to be used as a filter to “photo of
      that day” as this model is incremental
  year:
    description: Year of ts_load
