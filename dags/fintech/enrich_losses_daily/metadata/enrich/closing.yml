---
database_name: datalake_losses_daily
table_name: closing
description: "Enrich table with the losses model informations for the fact tables"
owner: felipe.chies@quintoandar.com.br
domain: fintech
columns:
  id_invoice:
    lineage:
    - datalake_retsuko.invoice.sk_invoice
    description: Id of the invoice. 
  id_contract:
    lineage:   
    - datalake_ebdb_contract.contract.id
    description: Id of the contract. 
  accrual_year_month:
    lineage:   
    - datalake_retsuko.invoice.accrual_year_month
    description: String with Year number and Month number 'yyyymm' related to the sent date.
  due_amount:
    lineage:   
    - datalake_retsuko.invoice.due_amount
    description: Total value of the invoice. 
  frequency: 
    lineage:   
    - datalake_retsuko.invoice.frequency
    description: Frequency of the payment. 
  is_guarantee_paid:
    description: Flag to show if the guarantee is paid. 
  is_before_started:
    description: Flag to show if the date is before started. 
  is_before_started_raw:
    description: Flag to show if the date is before started. 
  is_canceled_in_dead_time:
    description: Flag to show if the invoice is canceled in dead time. 
  is_international:
    description: Flag to show if the invoice is international.
  is_paid_in_closing_day:
    description: Flag to show if the invoice is paid within the closing day.
  is_writtendown_in_dead_time:
    description: Flag to show if the invoice is writtendown in the deadtime.
  payment_status:
    lineage:   
    - datalake_retsuko.invoice.payment_status
    description: Status of the invoice payment. 
  user:
    lineage:   
    - datalake_retsuko.invoice.user
    description: User information related to the invoice. 
  origin_factor:
    description: Origin of the data, currently can come from the historical table or the snapshot.
  dt_closing:
    lineage:
      - dw_public.dim_date.month_end
    description: Last day of the month.
  dt_due: 
    lineage:   
    - datalake_retsuko.invoice.dt_due
    description: Due date of the invoice. 
  dt_paid: 
    lineage:   
    - datalake_retsuko.invoice.dt_paid
    description: Payment completed date of the invoice. 
  dt_snapshot:
    lineage:
    - datalake_retsuko.invoice.ts_snapshot
    description: Date of the snapshot.