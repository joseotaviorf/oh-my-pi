    description: Indicates the document type of cpf_cnpj column (1=CPF or 2=CNPJ)
    lineage:
      - datalake_nexxera_clean.cnab_charges_341.id_document_type
  bank_agency:
    description: Bank branch (agency) number from the CNAB charge return.
    lineage:
      - datalake_nexxera_clean.cnab_charges_341.bank_agency
  bank_account:
    description: Bank account number receiving the CNAB charge payment.
    lineage:
      - datalake_nexxera_clean.cnab_charges_341.bank_account
  account_verification_digit:
    description: Bank account verification digit
    lineage:
      - datalake_nexxera_clean.cnab_charges_341.account_verification_digit
  cpf_cnpj:
    description: Document number
    lineage:
      - datalake_nexxera_clean.cnab_charges_341.cpf_cnpj
  company_use:
    description: Number created by 5A to identify transaction
    lineage:
      - datalake_nexxera_clean.cnab_charges_341.company_use
