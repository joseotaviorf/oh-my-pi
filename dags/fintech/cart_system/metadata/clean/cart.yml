database_name: datalake_cart_system_clean
table_name: cart
owner: guilherme.sacramento@quintoandar.com.br
domain: Fintech
description: Shopping carts that group chargeable items before checkout, tied to a
  business entity and commercial context.
columns:
  id:
    description: Internal identifier of the cart.
    lineage:
    - datalake_cart_system_raw.cart.id
  id_business_entity:
    description: Business entity (e.g. contract or offer) that owns the cart.
    lineage:
    - datalake_cart_system_raw.cart.business_entity_id
  uuid_cart:
    description: Stable public identifier of the cart.
    lineage:
    - datalake_cart_system_raw.cart.cart_uuid
  business_context:
    description: Commercial flow where the cart was created (e.g. rental offer or
      condominium).
    lineage:
    - datalake_cart_system_raw.cart.business_context
  status:
    description: Cart lifecycle state (open, closed, canceled, or deleted).
    lineage:
    - datalake_cart_system_raw.cart.status
  currency:
    description: Currency used for all items in the cart.
    lineage:
    - datalake_cart_system_raw.cart.currency
  source:
    description: Originating system or channel that created the cart.
    lineage:
    - datalake_cart_system_raw.cart.source
  metadata:
    description: Additional structured attributes not mapped to dedicated columns.
    lineage:
    - datalake_cart_system_raw.cart.metadata
  ts_created:
    description: When the cart was first created.
    lineage:
    - datalake_cart_system_raw.cart.created_at
  ts_updated:
    description: When the cart was last changed.
    lineage:
    - datalake_cart_system_raw.cart.updated_at
