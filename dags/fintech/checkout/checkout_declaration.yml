dag:
  name: checkout
  owner: Data Fintech
  schedule_interval: 0 3 * * *
workflow:
  type: database_pull_delta
  layer: raw
  database_type: postgres
  tables_customization:
    bank_account:
      clean_table_name: bank_account
    bolecode:
      clean_table_name: bolecode
    boleto:
      clean_table_name: boleto
    boleto_webhook:
      clean_table_name: boleto_webhook
    charge:
      clean_table_name: charge
    charge_status_log:
      clean_table_name: charge_status_log
    credit_card:
      clean_table_name: credit_card
    credit_card_capture_attempt:
      clean_table_name: credit_card_capture_attempt
    credit_card_fee:
      clean_table_name: credit_card_fee
    credit_card_fee_installment:
      clean_table_name: credit_card_fee_installment
    credit_card_webhook:
      clean_table_name: credit_card_webhook
    order:
      clean_table_name: order
    payment_config:
      clean_table_name: payment_config
    payment_gateway_error:
      clean_table_name: payment_gateway_error
    permission:
      clean_table_name: permission
    pix:
      clean_table_name: pix
    pix_refund:
      clean_table_name: pix_refund
    pix_webhook:
      clean_table_name: pix_webhook
    refund_attempt:
      clean_table_name: refund_attempt
    requester:
      clean_table_name: requester
    requester_role:
      clean_table_name: requester_role
    role:
      clean_table_name: role
    role_permission:
      clean_table_name: role_permission
    webhook:
      clean_table_name: webhook
cluster:
  type: databricks_12_2_med_general_photon_cluster
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
