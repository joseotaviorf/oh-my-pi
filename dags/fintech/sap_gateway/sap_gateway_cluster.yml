cluster:
  type: emr_7_12_consolidation_l_memory_fleet_cluster
  custom_configurations:
    # Cap concurrent Spark steps across 14 CDC tables on a shared l_memory fleet.
    step_concurrency_level: 2
    spark_conf:
      # Was 8 on single-node (~10+ GiB/partition with 86 GiB shuffle) — primary spill driver.
      spark.sql.shuffle.partitions: '256'
