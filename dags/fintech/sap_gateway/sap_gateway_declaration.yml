dag:
  name: sap_gateway
  schedule_start_date: 2020,10,1
  schedule_interval: 0 7 * * *
  owner: Data Fintech
  documentation:
    dag_purpose: |
      This DAG creates the raw and clean layer to import data from SAP Gateway. SAP Gateway is an structure used to connect devices, environments, and platforms to SAP systems.
workflow:
  type: cdc
  layer: raw
  database_type: postgres
  source_schema: public
  custom_schema: sap_gateway
  source_database: sapgateway
  dbutils_secret_key: SAP_GATEWAY_DB
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, 1), 'load_end_date') }}"
  tables_customization:
    account:
      run_optimize: false
    address:
      run_optimize: false
    business_partner:
      run_optimize: false
    card_code:
      run_optimize: false
    consolidated_invoice:
      run_optimize: false
    feature:
      run_optimize: false
    invoice:
      run_optimize: false
    operation:
      run_optimize: false
    person:
      run_optimize: false
    rule_account_type:
      run_optimize: false
    rule_modifier:
      run_optimize: false
    rule:
      run_optimize: false
    sync_sap_job:
      run_optimize: false
    webhook_log:
      run_optimize: false
