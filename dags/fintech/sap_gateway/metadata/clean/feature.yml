---
database_name: datalake_sap_gateway_clean
table_name: feature
owner: guilherme.sacramento@quintoandar.com.br
domain: Fintech
description: Clean-layer feature records in SAP Gateway representing upstream billing transactions queued for SAP S/4HANA synchronization.
columns:
  id_feature:
    description: Unique identifier of the feature record in the clean layer.
    lineage:
      - datalake_sap_gateway_raw.feature.id
  id_source:
    description: Identifier of the source system or origin of the feature.
    lineage:
      - datalake_sap_gateway_raw.feature.source_id
  id_business_entity:
    description: Identifier of the business entity associated with the feature.
    lineage:
      - datalake_sap_gateway_raw.feature.business_entity_id
  id_finance_entity:
    description: Identifier of the finance entity associated with the feature.
    lineage:
      - datalake_sap_gateway_raw.feature.finance_entity_id
  id_external_payment:
    description: External payment identifier when applicable.
    lineage:
      - datalake_sap_gateway_raw.feature.external_payment_id
  uuid:
    description: Universally unique identifier for the feature record.
    lineage:
      - datalake_sap_gateway_raw.feature.uuid
  source:
    description: Source system or channel that originated the feature.
    lineage:
      - datalake_sap_gateway_raw.feature.source
  transaction_type:
    description: Type of transaction represented by the feature.
    lineage:
      - datalake_sap_gateway_raw.feature.transaction_type
  metadata:
    description: Additional metadata associated with the feature record.
    lineage:
      - datalake_sap_gateway_raw.feature.metadata
  request_payload:
    description: Raw request payload containing entries and amounts.
    lineage:
      - datalake_sap_gateway_raw.feature.request_payload
  sync_sap_status:
    description: Status of the synchronization with SAP system.
    lineage:
      - datalake_sap_gateway_raw.feature.sync_sap_status
  source_client:
    description: Client or application that sent the request.
    lineage:
      - datalake_sap_gateway_raw.feature.source_client
  user_type:
    description: Type or role of the user associated with the feature.
    lineage:
      - datalake_sap_gateway_raw.feature.user_type
  finance_entity_type:
    description: Type of the finance entity (e.g. tenant, landlord).
    lineage:
      - datalake_sap_gateway_raw.feature.finance_entity_type
  entry_amount:
