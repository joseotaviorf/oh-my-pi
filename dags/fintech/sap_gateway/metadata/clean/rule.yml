---
database_name: datalake_sap_gateway_clean
table_name: rule
owner: guilherme.sacramento@quintoandar.com.br
domain: Fintech
description: Clean-layer accounting rules in SAP Gateway defining posting behavior, person types, cost centers, and invoice generation flags.
columns:
  id_rule:
    description: Primary key of the accounting rule in SAP Gateway clean layer.
    lineage:
    - datalake_sap_gateway_raw.rule.id
  rule_name:
    description: Human-readable name of the accounting rule.
    lineage:
    - datalake_sap_gateway_raw.rule."name"
  type:
    description: Rule type classification in SAP Gateway (e.g. invoice, provision).
    lineage:
    - datalake_sap_gateway_raw.rule."type"
  person_type:
    description: Counterparty person type the rule applies to (e.g. tenant, landlord).
    lineage:
    - datalake_sap_gateway_raw.rule.person_type
  cost_center:
    description: SAP cost center assigned to postings generated by this rule.
    lineage:
    - datalake_sap_gateway_raw.rule.cost_center
  business_place:
    description: SAP business place assigned to postings generated by this rule.
    lineage:
    - datalake_sap_gateway_raw.rule.business_place
  sequence_code:
    description: Fiscal document sequence code used when the rule generates invoices.
    lineage:
    - datalake_sap_gateway_raw.rule.sequence_code
  is_active:
    description: Indicates whether the accounting rule is currently active in SAP Gateway.
    lineage:
    - datalake_sap_gateway_raw.rule.active
  is_credit_person:
    description: Indicates whether the rule applies to the credit-side counterparty person.
    lineage:
    - datalake_sap_gateway_raw.rule.credit_person
  is_debit_person:
    description: Indicates whether the rule applies to the debit-side counterparty person.
    lineage:
    - datalake_sap_gateway_raw.rule.debit_person
  has_send_invoice:
    description: Indicates whether the rule triggers fiscal invoice (NF) generation in SAP.
    lineage:
    - datalake_sap_gateway_raw.rule.send_invoice
  ts_created:
    description: Timestamp when the accounting rule was created in SAP Gateway.
    lineage:
    - datalake_sap_gateway_raw.rule.created_at
  ts_updated:
    description: Timestamp when the accounting rule was last updated in SAP Gateway.
    lineage:
    - datalake_sap_gateway_raw.rule.updated_at
