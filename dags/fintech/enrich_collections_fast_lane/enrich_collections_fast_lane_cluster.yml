cluster:
  type: emr_7_12_consolidation_m_general_fleet_cluster
  custom_configurations:
    master_node_type_id: r6g.2xlarge
    aws_attributes:
      ebs_volume_size: 200
    core_nodes:
      target_on_demand: 3
      target_spot: 0
      instance_types:
      - m6g.2xlarge
      - m7g.2xlarge
    spark_conf:
      spark.sql.shuffle.partitions: "300"
      spark.driver.memory: 24g
      spark.driver.memoryOverhead: 4g
      spark.driver.maxResultSize: "8g"
