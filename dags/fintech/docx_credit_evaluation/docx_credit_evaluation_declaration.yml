dag:
  name: docx_credit_evaluation
  owner: Data Fintech
  schedule_interval: 0 0 * * *
workflow:
  type: database_pull
  layer: raw
  database_type: postgres
  custom_schema: docx
  dbutils_secret_key: DOCX_DB
  tables_customization:
    credit_evaluation_aud: {}
    credit_evaluation_proponent_aud: {}
    credit_evaluation_proponent:
      get_table_metrics:
        count: id
    credit_evaluation:
      get_table_metrics:
        count: id
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: m5a.xlarge
    node_type_id: m5a.2xlarge
    num_workers: 4
