---
database_name: datalake_robin_hood
table_name: accounting_entry_recon_removals
description:
  One row per accounting entry that the Fintech backoffice flagged to be skipped in Robin Hood
  accounting reconciliation, enriched with the attributes of the excluded entry so reconciliation
  reporting can filter and explain known divergences without joining back to the clean layer.
  Both sides come from the Robin Hood digital wallet database via CDC. Reversing an exclusion is a
  hard delete in the source, so the dataset always reflects only the currently active exclusions,
  and the presence of the row is the ignore signal itself.
owner: juliana.hocihara@quintoandar.com.br
domain: Fintech
columns:
  id_recon_removal:
    lineage:
      - datalake_robin_hood_clean.accounting_entry_recon_removals.id
    description:
      Sequential identifier of the exclusion record, generated by Robin Hood when the backoffice
      registers the accounting entry as ignored in reconciliation. Primary key of this dataset.
  id_accounting_entry:
    lineage:
      - datalake_robin_hood_clean.accounting_entry_recon_removals.id_accounting_entry
      - datalake_robin_hood_clean.accounting_entry.id
    description:
      Identifier of the accounting entry excluded from reconciliation, referencing
      datalake_robin_hood.accounting_entry. Unique in this dataset, so the same entry can be
      flagged at most once, and it is also the key used to bring in the entry attributes.
  id_external:
    lineage:
      - datalake_robin_hood_clean.accounting_entry.id_external
    description:
      Identifier of the excluded accounting entry in the external system that originated it, used
      to trace the ignored divergence back to its source platform.
  id_source:
    lineage:
      - datalake_robin_hood_clean.accounting_entry.id_source
    description:
      Identifier of the accounting entry source, referencing
      datalake_robin_hood.accounting_entry_source, which tells which product flow originated the
      excluded entry (for example ciq-listing-purchase).
  id_payee:
    lineage:
      - datalake_robin_hood_clean.accounting_entry.id_payee
    description:
      Identifier of the payee on the excluded accounting entry, referencing
      datalake_robin_hood.payee. Identifies who would have received or owed the ignored amount.
  id_context:
    lineage:
      - datalake_robin_hood_clean.accounting_entry.id_context
    description:
      Identifier of the business context the excluded accounting entry belongs to, grouping
      entries that Robin Hood settles together in the same operation.
  recon_removal_reason:
    lineage:
      - datalake_robin_hood_clean.accounting_entry_recon_removals.reason
    description:
      Free-text justification registered by the backoffice for excluding the accounting entry from
      reconciliation, such as a known divergence already settled outside the platform. Optional in
      the source, so it can be null.
  requested_by:
    lineage:
      - datalake_robin_hood_clean.accounting_entry.requested_by
    description:
      Actor that requested the excluded accounting entry in Robin Hood, either the calling service
      or the backoffice user, used to attribute the entry to whoever created it.
  description:
    lineage:
      - datalake_robin_hood_clean.accounting_entry.description
    description:
      Free-text description of the excluded accounting entry as registered in Robin Hood,
      explaining what is being charged or paid.
  source_bill_item:
    lineage:
      - datalake_robin_hood_clean.accounting_entry.source_bill_item
    description:
      Reference to the item in the source billing system that originated the excluded accounting
      entry, tying the entry to the specific charge line it settles.
  locale:
    lineage:
      - datalake_robin_hood_clean.accounting_entry.locale
    description:
      Locale of the excluded accounting entry, identifying the country or market whose
      reconciliation process the entry belongs to.
  type:
    lineage:
      - datalake_robin_hood_clean.accounting_entry.type
    description:
      Classification of the excluded accounting entry in Robin Hood, which determines how its
      amount is treated in billing, payout, and reconciliation.
  cost_center_code:
    lineage:
      - datalake_robin_hood_clean.accounting_entry.cost_center_code
    description:
      Accounting cost center code assigned to the excluded entry, used by Finance to know which
      cost center the ignored divergence would otherwise have hit.
  accrual_year_month:
    lineage:
      - datalake_robin_hood_clean.accounting_entry.accrual_year_month
    description:
      Year and month in which the excluded entry is recognised for accrual accounting, placing the
      exclusion in the correct accrual competence period.
  accounting_year_month:
    lineage:
      - datalake_robin_hood_clean.accounting_entry.accounting_year_month
    description:
      Year and month in which the excluded entry is booked in the accounting ledger, which is the
      period whose reconciliation report skips this entry.
  recon_removal_op_cdc:
    lineage:
      - datalake_robin_hood_clean.accounting_entry_recon_removals.op_cdc
    description:
      CDC operation type of the last change captured for the exclusion record. Deletes matter here
      because undoing an exclusion is a hard delete in the source database.
    categories:
      r: "Read or snapshot of an existing reconciliation removal"
      c: "Creation of a new reconciliation removal"
      u: "Update to an existing reconciliation removal"
      d: "Deletion of a reconciliation removal, meaning the exclusion was undone"
  accounting_entry_op_cdc:
    lineage:
      - datalake_robin_hood_clean.accounting_entry.op_cdc
    description:
      CDC operation type of the last change captured for the excluded accounting entry itself,
      telling whether the entry was created, updated, or deleted in Robin Hood.
    categories:
      r: "Read or snapshot of an existing accounting entry"
      c: "Creation of a new accounting entry"
      u: "Update to an existing accounting entry"
      d: "Deletion of an accounting entry"
  due_amount:
    lineage:
      - datalake_robin_hood_clean.accounting_entry.due_amount
    description:
      Monetary amount due on the excluded accounting entry, in the currency of its locale. This is
      the value the reconciliation report leaves out while the exclusion is active.
  dt_occurrence:
    lineage:
      - datalake_robin_hood_clean.accounting_entry.dt_occurrence
    description:
      Calendar date on which the excluded accounting entry economically occurred, independent of
      when it was created in Robin Hood or booked in the ledger.
  ts_recon_removal_created:
    lineage:
      - datalake_robin_hood_clean.accounting_entry_recon_removals.ts_created
    description:
      Moment the exclusion was registered in Robin Hood. There is no end timestamp because
      reversing the exclusion deletes the row, so this is the only date available to audit when an
      entry started being ignored.
  ts_recon_removal_cdc_transaction:
    lineage:
      - datalake_robin_hood_clean.accounting_entry_recon_removals.ts_cdc_transaction
    description:
      Timestamp when the CDC connector captured the change event for the exclusion record, used to
      measure ingestion lag on the exclusion signal.
  ts_recon_removal_database_transaction:
    lineage:
      - datalake_robin_hood_clean.accounting_entry_recon_removals.ts_database_transaction
    description:
      Timestamp when the source database committed the change to the exclusion record, the
      authoritative moment the exclusion was persisted.
  ts_accounting_entry_synced:
    lineage:
      - datalake_robin_hood_clean.accounting_entry.ts_synced
    description:
      Moment the excluded accounting entry was synced to the downstream accounting system. Null
      while the entry has not been sent, which is itself a common cause of reconciliation
      divergence.
  ts_accounting_entry_blocked:
    lineage:
      - datalake_robin_hood_clean.accounting_entry.ts_blocked
    description:
      Moment the excluded accounting entry was blocked in Robin Hood, preventing it from being
      settled. Null when the entry was never blocked.
  ts_accounting_entry_created:
    lineage:
      - datalake_robin_hood_clean.accounting_entry.ts_created
    description:
      Moment the excluded accounting entry itself was created in Robin Hood. Compared against
      ts_recon_removal_created it shows how long the entry existed before being ignored.
  ts_accounting_entry_cdc_transaction:
    lineage:
      - datalake_robin_hood_clean.accounting_entry.ts_cdc_transaction
    description:
      Timestamp when the CDC connector captured the change event for the excluded accounting
      entry.
  ts_accounting_entry_database_transaction:
    lineage:
      - datalake_robin_hood_clean.accounting_entry.ts_database_transaction
    description:
      Timestamp when the source database committed the change to the excluded accounting entry.
  accounting_entry_metadata:
    lineage:
      - datalake_robin_hood_clean.accounting_entry.metadata
    description:
      Raw JSON payload of the excluded accounting entry, carrying the product identifiers Robin
      Hood does not flatten into columns (lead, house, contract, and offer). Read it with
      GET_JSON_OBJECT, or prefer datalake_robin_hood.accounting_entry where those keys are already
      extracted into columns.
