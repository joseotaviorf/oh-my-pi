---
dag:
  name: enrich_robin_hood
  schedule_start_date: 2020, 8, 29
  owner: Data Fintech
  documentation:
    dag_purpose:
      "Enrich pipe for Robin Hood, a digital wallet that has two main features:
      users financial data management and management of payment requests."
workflow:
  type: query_delta
  layer: enrich
cluster:
  type: databricks_12_2_med_general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
