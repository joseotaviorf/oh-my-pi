---
dag:
  name: payable_accounts_transactions
  schedule_interval: 0 3 * * *
  owner: Data Fintech
  documentation:
    dag_purpose: This DAG brings CAP (Contas a Pagar) data, a agregation of Accounts Payable XLSX Sheets for current and last year.
workflow:
  type: custom_ingestion
  layer: raw
  load_spark_job: load_sheets_into_datalake

  spark_job_arguments:
    - "{environment}"
    - "{bucket}"
    - "{dag_name}"
    - "accounts_payable"
    - "1ld0eXsjU9d74TcPhqE8XgsD7xMslRwkV"
    - "['Competência', 'Pagamento', 'Valor Bruto', '# Doc. / NF', 'Fornecedor', 'Cost And Profit Center', 'Revenue and Cost Elements', 'Banco', 'Conta']"

  tables_customization:
    accounts_payable: {}

cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: r5d.2xlarge
    node_type_id: r5d.xlarge
    num_workers: 3
    spark_version: 13.3.x-scala2.12

  custom_libraries:
    - whl: "{artifacts_bucket}/gsheets-api-client-python/quintoandar_gsheets_api_client-0.3.0-py2.py3-none-any.whl"
    - pypi:
        package: "google-api-python-client==2.48.0"
    - pypi:
        package: "google-auth==2.23.0"
    - pypi:
        package: "pandas==1.3.5"
    - pypi:
        package: "openpyxl==3.0.10"
    - pypi:
        package: "pyxlsb==1.0.9"
