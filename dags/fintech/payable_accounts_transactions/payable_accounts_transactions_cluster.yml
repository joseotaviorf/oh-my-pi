cluster:
  type: consolidation_s_memory_cluster
  databricks_conn_id: databricks_new
  custom_libraries:
  - whl: '{artifacts_bucket}/gsheets-api-client-python/quintoandar_gsheets_api_client-0.3.0-py2.py3-none-any.whl'
  - pypi:
      package: google-api-python-client==2.48.0
  - pypi:
      package: google-auth==2.23.0
  - pypi:
      package: openpyxl==3.1.5
  - pypi:
      package: pyxlsb==1.0.9
  custom_configurations:
    num_workers: 3
    spark_version: 16.4.x-scala2.12
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
      spark.scheduler.taskSetBlacklistTimeout: 1200000
validation:
  cluster:
    type: emr_7_12_consolidation_s_memory_fleet_cluster
    custom_configurations:
      task_nodes:
        instance_types:
        - r6g.xlarge
        - r7g.xlarge
        - r6i.xlarge
        target_on_demand: 0
        target_spot: 1
        allocation_strategy: price-capacity-optimized
        bid_price_percentage: 100
      core_nodes:
        target_on_demand: 2
        target_spot: 0
        instance_types:
        - r6g.xlarge
        - r7g.xlarge
        - r6i.xlarge
      spark_conf:
        spark.scheduler.taskSetBlacklistTimeout: 1200000
  allow_custom_spark_job: true
