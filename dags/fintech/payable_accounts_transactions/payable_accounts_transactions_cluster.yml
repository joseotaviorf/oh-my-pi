cluster:
  type: emr_7_12_consolidation_s_memory_fleet_cluster
  custom_libraries:
  - whl: '{artifacts_bucket}/gsheets-api-client-python/quintoandar_gsheets_api_client-0.3.0-py2.py3-none-any.whl'
  - pypi:
      package: google-api-python-client==2.48.0
  - pypi:
      package: google-auth==2.23.0
  - pypi:
      package: openpyxl==3.1.5
  - pypi:
      package: pyxlsb==1.0.9
  custom_configurations:
    spark_conf:
      spark.scheduler.taskSetBlacklistTimeout: 1200000
    task_nodes:
      instance_types:
      - r6g.xlarge
      - r7g.xlarge
      - r6i.xlarge
      target_on_demand: 0
      target_spot: 1
      allocation_strategy: price-capacity-optimized
      bid_price_percentage: 100
    core_nodes:
      target_on_demand: 2
      target_spot: 0
      instance_types:
      - r6g.xlarge
      - r7g.xlarge
      - r6i.xlarge
