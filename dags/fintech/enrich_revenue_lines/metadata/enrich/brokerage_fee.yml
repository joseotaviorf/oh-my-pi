---
database_name: datalake_revenue_lines
table_name: brokerage_fee
owner: juliana.hocihara@quintoandar.com.br
domain: Fintech
description: "Table containing brokerage fee and payment data by contract"
columns:
  id_contract_ebdb:
    description: Identifier for the contract ebdb referenced by this financial record.
    lineage:
      - dw_rent.dim_contract.sk_contract
  id_invoice_entry:
    description: Identifier for the invoice entry referenced by this financial record.
    lineage:
      - ddatalake_retsuko.invoice_entry.id_invoice_entry
  brokerage_share:
    description: Financial attribute representing brokerage share on the brokerage_fee dataset.
  contract_guarantee:
    description: "Type of the contract guarantee."
    lineage:
      - dw_rent.dim_contract.guarantee
  invoice_payment_status:
    description: "Description of the invoice payment status"
    lineage:
      - datalake_retsuko.invoice_info.payment_status
  first_rental_commission:
    description: "Commission value from first rental"
    lineage:
      - dw_rent.dim_contract.first_rental_commission
  agent_brokerage_share:
    description: Financial attribute representing agent brokerage share on the brokerage_fee dataset.
    lineage:
      - dw_rent.dim_contract.agent_brokerage_share
  brokerage_split_percentage:
    description: Financial attribute representing brokerage split percentage on the brokerage_fee dataset.
    lineage:
      - datalake_ebdb_clean.contract_partnership_data.brokerage_split_percentage
  select_agent_brokerage_split_percentage:
    description: "Split Percentage for the brokerage fee, just for SELECT agent (partner_type = EXECUTIVE_FOR_RENT)"
    lineage:
      - datalake_ebdb_clean.contract_partnership_data.brokerage_split_percentage
  prod_theorical_amount:
    description: "Total amount that appears on the invoice"
  invoice_theorical_amount:
    description: "Amortization amount that appears on the invoice"
  invoice_paid_amount:
    description: Financial attribute representing invoice paid amount on the brokerage_fee dataset.
  accrual_year_month:
    description: Financial attribute representing accrual year month on the brokerage_fee dataset.
    lineage:
      - datalake_retsuko.invoice.accrual_year_month
  dt_due:
    description: "Invoice's due date"
    lineage:
      - datalake_retsuko.invoice_info.ts_due
  dt_paid:
    description: "Invoice's paid date"
    lineage:
      - datalake_retsuko.invoice_info.ts_paid
  dt_contract_start:
    description: Calendar date associated with contract start in the financial workflow.
    lineage:
      - dw_rent.dim_contract.dt_start
