cluster:
  # 11 independent enrich tables; step_concurrency=1 serialized loads after EMR migration.
  type: emr_7_12_consolidation_s_memory_fleet_cluster
  custom_configurations:
    step_concurrency_level: 2
    aws_attributes:
      ebs_volume_size: 200
    core_nodes:
      target_on_demand: 4
      target_spot: 0
      instance_types:
      - r6g.xlarge
      - r7g.xlarge
      - r6i.xlarge
    task_nodes:
      instance_types:
      - r6g.xlarge
      - r7g.xlarge
      - r6i.xlarge
      target_on_demand: 0
      target_spot: 4
      allocation_strategy: price-capacity-optimized
      bid_price_percentage: 100
    spark_conf:
      spark.sql.adaptive.advisoryPartitionSizeInBytes: "16777216"
      spark.sql.shuffle.partitions: "800"
      spark.speculation: "true"
      spark.speculation.multiplier: "3"
      spark.speculation.quantile: "0.75"
