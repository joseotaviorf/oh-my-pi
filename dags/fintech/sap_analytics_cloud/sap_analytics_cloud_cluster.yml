cluster:
  type: emr_7_12_consolidation_m_memory_single_node_fleet_cluster
  custom_libraries:
  - pypi:
      package: numpy==1.26.4
  - pypi:
      package: pyarrow==15.0.2
  # The SAC export is loaded one month per run, partitioned by the month the
  # data belongs to. Dynamic partitionOverwriteMode scopes the overwrite to
  # that month, which is what lets months accumulate and lets any single month
  # be reloaded without touching the others. Static would replace the whole
  # table on every run, leaving only the month that ran last. The raw job
  # verifies this setting at runtime before writing.
  custom_configurations:
    spark_conf:
      spark.sql.sources.partitionOverwriteMode: dynamic
    aws_attributes:
      ebs_volume_size: 200
