dag:
  name: sap_analytics_cloud
  schedule_start_date: 2026, 9, 1
  schedule_interval: 0 9 * * *
  owner: Data Fintech
  documentation:
    dag_purpose: |
      Ingestion of SAP Analytics Cloud (SAC) planning and reporting data via the SAC API,
      landing the raw payload and exposing a normalized clean layer for controllership use.

      Each run loads a single accounting month, filtered at the API, and writes it to that
      month's partition. The unfiltered export moves at roughly 0.9 MB/s, so pulling the
      whole model did not finish within two hours, while one month takes about 25 minutes.
      The daily schedule therefore keeps refreshing the current month; earlier months are
      loaded by backfilling this DAG over their dates, one month per run.
workflow:
  layer: raw
  type: custom_ingestion
  load_spark_job: load_raw
  spark_job_arguments:
  - "{environment}"
  - "{bucket}"
  - "{dag_name}"
  - "{table_name}"
  - "{load_end_date}"
  - "{partitions}"
  extra_query_template_params:
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  tables_customization:
    allocations:
      extraction_type: incremental
      partitions: ["year", "month"]
      extra_spark_job_arguments:
      - table_api_path: "api/v1/dataexport/providers/sac/Cvocdn23av1lgcbskqikj76rs38/FactData"
