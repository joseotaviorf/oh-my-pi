dag:
  name: sap_analytics_cloud
  schedule_start_date: 2026, 9, 1
  schedule_interval: 0 2 * * *
  owner: Data Fintech
  documentation:
    dag_purpose: |
      Ingestion of SAP Analytics Cloud (SAC) planning and reporting data via the SAC API,
      landing the raw payload and exposing a normalized clean layer for controllership use.
workflow:
  layer: raw
  type: custom_ingestion
  load_spark_job: load_raw
  spark_job_arguments:
  - "{environment}"
  - "{bucket}"
  - "{dag_name}"
  - "{table_name}"
  - "{load_start_date}"
  - "{load_end_date}"
  - "{partitions}"
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, -7), 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  tables_customization:
    allocations:
      extraction_type: incremental
      partitions: ["year", "month", "day"]
      extra_spark_job_arguments:
      - table_api_path: "api/v1/dataexport/providers/sac/M002_Allocations"
