---
database_name: datalake_gsheets_clean
table_name: manual_payment
description:
  Google Sheets intake for manual utility payment requests curated by Fintech
  Operations. One row per concessionária invoice handled outside automated CNAB
  flows, with contract, ticket, billing dates, barcode, and payment context.
  Consumed to monitor manual payment tratativas and accounting reconciliation.
owner: sonia.gondo@quintoandar.com.br
domain: Fintech
columns:
  creation_timestamp:
    lineage:
      - datalake_gsheets_raw.manual_payment.timestamp
    description: Timestamp when the manual payment request was submitted in the Google Sheet.
  termination_date:
    lineage:
      - datalake_gsheets_raw.manual_payment.data_de_rescisao
    description: Contract termination date associated with the manual payment case.
  billing_period_start_date:
    lineage:
      - datalake_gsheets_raw.manual_payment.data_inicio
    description: Start date of the utility billing period covered by the manual payment request.
  billing_period_end_date:
    lineage:
      - datalake_gsheets_raw.manual_payment.data_final
    description: End date of the utility billing period covered by the manual payment request.
  due_date:
    lineage:
      - datalake_gsheets_raw.manual_payment.data_de_vencimento
    description: Due date of the utility invoice to be paid manually.
  payment_record_date:
    lineage:
      - datalake_gsheets_raw.manual_payment.data
    description: Date when the manual payment was recorded in the Google Sheets workflow.
  request_id:
    lineage:
      - datalake_gsheets_raw.manual_payment.solicitacao
    description: Identifier of the manual payment request in the Google Sheets intake form.
  contract_id:
    lineage:
      - datalake_gsheets_raw.manual_payment.contrato
    description: Rental contract identifier linked to the manual payment request.
  property_id:
    lineage:
      - datalake_gsheets_raw.manual_payment.imovel
    description: Property listing identifier linked to the manual payment request.
  ticket_id:
    lineage:
      - datalake_gsheets_raw.manual_payment.ticket_da_tratativa
    description: Support ticket identifier for the manual payment tratativa.
  botcity_execution_id:
    lineage:
      - datalake_gsheets_raw.manual_payment.id_da_botcity
    description: BotCity RPA execution identifier for the automated manual-payment workflow.
  processing_time_seconds:
    lineage:
      - datalake_gsheets_raw.manual_payment.temp_med_s
    description: Average processing time in seconds recorded for the manual payment workflow.
  formatted_invoice_value:
    lineage:
      - datalake_gsheets_raw.manual_payment.format_inv_amount
    description: Invoice amount formatted for display or downstream payment processing.
  task_name:
    lineage:
      - datalake_gsheets_raw.manual_payment.tarefa
    description: Operational task name associated with processing the manual payment.
  contract_status:
    lineage:
      - datalake_gsheets_raw.manual_payment.status_do_contrato
    description: Contract status at the time the manual payment request was handled.
  analyst_email:
    lineage:
      - datalake_gsheets_raw.manual_payment.analista
    description: Email of the Fintech analyst who submitted or validated the manual payment.
  cost_center_name:
    lineage:
      - datalake_gsheets_raw.manual_payment.centro_de_custo
    description: Cost center assigned to the manual utility payment expense.
  utility_company_name:
    lineage:
      - datalake_gsheets_raw.manual_payment.nome_da_concessionaria
    description: Name of the utility company issuing the bill to be paid manually.
  invoice_amount:
    lineage:
      - datalake_gsheets_raw.manual_payment.valor_da_conta
    description: Utility bill amount as recorded in the Google Sheets intake form.
  barcode_number:
    lineage:
      - datalake_gsheets_raw.manual_payment.cod_de_barras
    description: Barcode number of the utility bill for manual payment.
  invoice_file_url:
    lineage:
      - datalake_gsheets_raw.manual_payment.upload_da_conta
    description: URL or file reference for the uploaded utility invoice document.
  case_summary:
    lineage:
      - datalake_gsheets_raw.manual_payment.resumo
    description: Short summary describing the manual payment case context.
  expense_type:
    lineage:
      - datalake_gsheets_raw.manual_payment.despesa
    description: Expense category associated with the manual utility payment.
  billing_charge_type:
    lineage:
      - datalake_gsheets_raw.manual_payment.tipo_de_cobranca
    description: Billing charge type applied to the manual payment (tenant, landlord, etc.).
  execution_status:
    lineage:
      - datalake_gsheets_raw.manual_payment.status_do_pagamento
    description: Payment processing status of the manual payment request in the Fintech workflow.
  internal_notes:
    lineage:
      - datalake_gsheets_raw.manual_payment.observacao
    description: Free-text operational notes captured for the manual payment request.
  accounting_system_log:
    lineage:
      - datalake_gsheets_raw.manual_payment.lancamentos_sr_barriga
    description: Accounting postings log reference from the Sr. Barriga system.
  barcode_bank_validation_status:
    lineage:
      - datalake_gsheets_raw.manual_payment.validacao_banco_do_codigo_de_barras
    description: Result of the barcode bank-code validation rule applied in the Google Sheet.
  barcode_length_validation_status:
    lineage:
      - datalake_gsheets_raw.manual_payment.validacao_tamanho_do_codigo_de_barras
    description: Result of the barcode length validation rule applied in the Google Sheet.
  duplicate_validation_status:
    lineage:
      - datalake_gsheets_raw.manual_payment.validacao_duplicidade
    description: Result of the duplicate-payment validation rule applied in the Google Sheet.
  final_check_status:
    lineage:
      - datalake_gsheets_raw.manual_payment.check_final
    description: Overall final validation status for the manual payment row in the Google Sheet.
  tenant_charge_start_date:
    lineage:
      - datalake_gsheets_raw.manual_payment.data_de_inicio_da_cobranca_ao_iq
    description: Start date of the billing period charged to the tenant (inquilino).
  tenant_charge_end_date:
    lineage:
      - datalake_gsheets_raw.manual_payment.data_final_da_cobranca_ao_iq
    description: End date of the billing period charged to the tenant (inquilino).
  landlord_charge_start_date:
    lineage:
      - datalake_gsheets_raw.manual_payment.data_de_inicio_da_cobranca_ao_pp
    description: Start date of the billing period charged to the landlord (proprietário).
  landlord_charge_end_date:
    lineage:
      - datalake_gsheets_raw.manual_payment.data_final_da_cobranca_ao_pp
    description: End date of the billing period charged to the landlord (proprietário).
