database_name: datalake_gsheets_clean
table_name: for_sale_bypass_revenue_control
description: >
  Google Sheets bypass revenue control workbook curated by Fintech Operations
  on the Controle Receita tab. One row per For Sale bypass offer with deal,
  commission, installment, and partner transfer details used in financial
  reconciliation and bypass revenue recognition workflows.
owner: sonia.gondo@quintoandar.com.br
domain: Fintech
columns:
  id_offer:
    lineage:
      - datalake_gsheets_raw.for_sale_bypass_revenue_control.id
    description: For Sale offer identifier tracked in the bypass revenue control sheet.
  payment_status:
    lineage:
      - datalake_gsheets_raw.for_sale_bypass_revenue_control.status_repasse_parceiros
    description: Partner transfer status for the bypass deal, such as Realizado or Pendente.
  installment_plan:
    lineage:
      - datalake_gsheets_raw.for_sale_bypass_revenue_control.parcelado
    description: Installment plan label or flag recorded for the bypass revenue row.
  installment_status_1:
    lineage:
      - datalake_gsheets_raw.for_sale_bypass_revenue_control.status_parcela_1
    description: Payment status of the first installment in the bypass revenue control row.
  installment_status_2:
    lineage:
      - datalake_gsheets_raw.for_sale_bypass_revenue_control.status_parcela_2
    description: Payment status of the second installment in the bypass revenue control row.
  installment_status_3:
    lineage:
      - datalake_gsheets_raw.for_sale_bypass_revenue_control.status_parcela_3
    description: Payment status of the third installment in the bypass revenue control row.
  installment_status_4:
    lineage:
      - datalake_gsheets_raw.for_sale_bypass_revenue_control.status_parcela_4
    description: Payment status of the fourth installment in the bypass revenue control row.
  installment_status_5:
    lineage:
      - datalake_gsheets_raw.for_sale_bypass_revenue_control.status_parcela_5
    description: Payment status of the fifth installment in the bypass revenue control row.
  installment_status_6:
    lineage:
      - datalake_gsheets_raw.for_sale_bypass_revenue_control.status_parcela_6
    description: Payment status of the sixth installment in the bypass revenue control row.
  brokerage_amount:
    lineage:
      - datalake_gsheets_raw.for_sale_bypass_revenue_control.valor_do_acordo
    description: Agreed brokerage amount in Brazilian reais for the bypass deal.
  brokerage_estate_agent_amount_1:
    lineage:
      - datalake_gsheets_raw.for_sale_bypass_revenue_control.comissao_cr_175
    description: CR commission component in Brazilian reais for the bypass revenue row.
  brokerage_estate_agent_amount_2:
    lineage:
      - datalake_gsheets_raw.for_sale_bypass_revenue_control.valor_comissao_en_4
    description: EN commission component in Brazilian reais for the bypass revenue row.
  brokerage_estate_agent_amount_3:
    lineage:
      - datalake_gsheets_raw.for_sale_bypass_revenue_control.valor_comissao_ea_05
    description: EA commission component in Brazilian reais for the bypass revenue row.
  brokerage_estate_agent_amount_4:
    lineage:
      - datalake_gsheets_raw.for_sale_bypass_revenue_control.valor_comissao_ciq_667
    description: CIQ commission component in Brazilian reais for the bypass revenue row.
  brokerage_estate_agent_amount_5:
    lineage:
      - datalake_gsheets_raw.for_sale_bypass_revenue_control.valor_comissao_tqc_20
    description: TQC commission component in Brazilian reais for the bypass revenue row.
  accounting_commission:
    lineage:
      - datalake_gsheets_raw.for_sale_bypass_revenue_control.comissao_escritorio_parceiro
    description: Partner office accounting commission in Brazilian reais for the bypass deal.
  brokerage_quinto_andar_amount_without_accounting_commission:
    lineage:
      - datalake_gsheets_raw.for_sale_bypass_revenue_control.comissao_quintoandar
    description: QuintoAndar brokerage share in Brazilian reais before partner office commission.
  broker_payment:
    lineage:
      - datalake_gsheets_raw.for_sale_bypass_revenue_control.total_repassado
    description: Total partner amount transferred in Brazilian reais for the bypass offer.
  installment_amount_1:
    lineage:
      - datalake_gsheets_raw.for_sale_bypass_revenue_control.parcela_1
    description: First installment amount in Brazilian reais recorded for the bypass deal.
  installment_amount_2:
    lineage:
      - datalake_gsheets_raw.for_sale_bypass_revenue_control.parcela_2
    description: Second installment amount in Brazilian reais recorded for the bypass deal.
  installment_amount_3:
    lineage:
      - datalake_gsheets_raw.for_sale_bypass_revenue_control.parcela_3
    description: Third installment amount in Brazilian reais recorded for the bypass deal.
  installment_amount_4:
    lineage:
      - datalake_gsheets_raw.for_sale_bypass_revenue_control.parcela_4
    description: Fourth installment amount in Brazilian reais recorded for the bypass deal.
  installment_amount_5:
    lineage:
      - datalake_gsheets_raw.for_sale_bypass_revenue_control.parcela_5
    description: Fifth installment amount in Brazilian reais recorded for the bypass deal.
  installment_amount_6:
    lineage:
      - datalake_gsheets_raw.for_sale_bypass_revenue_control.parcela_6
    description: Sixth installment amount in Brazilian reais recorded for the bypass deal.
