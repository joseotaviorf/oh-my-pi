  dt_payment_3:
    lineage:
      - datalake_gsheets_raw.for_sale_bypass_revenue_control.data_do_pagamento_3
    description: Payment date of the fourth installment in the bypass revenue control row.
  dt_payment_4:
    lineage:
      - datalake_gsheets_raw.for_sale_bypass_revenue_control.data_do_pagamento_4
    description: Payment date of the fifth installment in the bypass revenue control row.
  dt_payment_5:
    lineage:
