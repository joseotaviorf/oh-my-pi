database_name: datalake_gsheets_clean
table_name: provider_pricing
owner: guilherme.sacramento@quintoandar.com.br
domain: Fintech
description: Cleaned and standardized provider pricing data with validated types, dates, and boolean values for financial product pricing analysis
columns:
  external_product_code:
    description: Unique identifier for the product in the external provider system
    lineage:
      - datalake_gsheets_raw.provider_pricing.external_product_code
  product_name:
    description: Human-readable name of the product or service being priced
    lineage:
      - datalake_gsheets_raw.provider_pricing.product_name
  provider_code:
    description: Short code identifier for the provider company or vendor
    lineage:
      - datalake_gsheets_raw.provider_pricing.provider_code
  provider:
    description: Full name of the provider company offering the product or service
    lineage:
      - datalake_gsheets_raw.provider_pricing.provider
  unit_price:
    description: Base price per unit for the product or service in decimal format
    lineage:
      - datalake_gsheets_raw.provider_pricing.unit_price
  included_monthly:
    description: Monthly included quantity or allowance included in the base price
    lineage:
      - datalake_gsheets_raw.provider_pricing.included_monthly
  included_annual:
    description: Annual included quantity or allowance included in the base price
    lineage:
      - datalake_gsheets_raw.provider_pricing.included_annual
  exceed_unit_price:
    description: Price per unit charged when usage exceeds the included monthly or annual limits
    lineage:
      - datalake_gsheets_raw.provider_pricing.exceed_unit_price
  is_group_feature:
    description: Boolean flag indicating if this product is a group-level feature or add-on
    lineage:
      - datalake_gsheets_raw.provider_pricing.is_group_feature
  group_feature:
    description: Name or identifier of the group feature if this is a group-level product
    lineage:
      - datalake_gsheets_raw.provider_pricing.group_feature
  group_feature_price:
    description: Additional price charged for the group feature when applicable
    lineage:
      - datalake_gsheets_raw.provider_pricing.group_feature_price
  weight:
    description: Weighting factor or priority value used for pricing calculations or sorting
    lineage:
      - datalake_gsheets_raw.provider_pricing.weight
  valid_from:
    description: Start date when this pricing configuration becomes effective
    lineage:
      - datalake_gsheets_raw.provider_pricing.valid_from
  valid_to:
    description: End date when this pricing configuration expires or becomes invalid
    lineage:
      - datalake_gsheets_raw.provider_pricing.valid_to
