cluster:
  type: consolidation_l_general_cluster
  databricks_conn_id: databricks_new_env
  custom_configurations:
    autotermination_minutes: 20
    driver_node_type_id: r7g.xlarge
    num_workers: 3
    spark_version: 16.4.x-scala2.12
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
validation:
  cluster:
    type: emr_7_12_consolidation_l_general_cluster
    custom_configurations:
      core_nodes:
        instance_count: 1
      task_nodes:
        instance_count: 2
      master_node_type_id: r7g.xlarge
      spark_conf:
        spark.driver.memory: 6g
        spark.driver.memoryOverhead: 1g
        spark.yarn.am.memory: 2g
