cluster:
  type: emr_7_12_consolidation_l_general_fleet_cluster
  custom_configurations:
    autotermination_minutes: 20
    spark_version: 16.4.x-scala2.12
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    master_node_type_id: r6g.xlarge
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
      spark.driver.memory: 6g
      spark.driver.memoryOverhead: 1g
      spark.yarn.am.memory: 2g
    core_nodes:
      target_on_demand: 2
      target_spot: 0
      instance_types:
      - m6g.4xlarge
      - m7g.4xlarge
    task_nodes:
      instance_types:
      - m6g.4xlarge
      - m7g.4xlarge
      target_on_demand: 0
      target_spot: 1
      allocation_strategy: price-capacity-optimized
      bid_price_percentage: 100
