    description: To account type in the invoice entry  (contract or stakeholder)
    categories:
      adm partner: ''
      contract: ''
      contract estate agent: ''
      contract expenses: ''
      contract iptu: ''
      landlord: ''
      missing account: ''
      personal estate agent: ''
      quinto andar: ''
      reservation: ''
      tenant: ''
      third party partner: ''
  accounting_account:
    lineage:
    - datalake_retsuko.invoice_entry.accounting_account
    description: Accounting account in SAP in which entry will be destined (as defined
      in automatic integration)
    categories:
      adjustment agreement adm fee: ''
      adjustment agreement adm partner adm fee: ''
      adjustment agreement rental: ''
      adm fee: ''
      adm fee tax ir adm partner: ''
      adm fee tax ir quinto andar: ''
      adm fee tax pcc quinto andar: ''
      adm partner adm fee: ''
      adm-fee-taxes: ''
      advance: ''
      brokerage adm partner: ''
      brokerage estate agent: ''
      brokerage fee tax ir adm partner: ''
      brokerage fee tax ir quinto andar: ''
      brokerage installment: ''
      brokerage installment fee: ''
      brokerage quintoandar: ''
      brokerage quintoandar taxes: ''
      campaign: ''
      campaign discount: ''
      collections negotiation: ''
      condo: ''
      condominium defaulting: ''
      debit negotiation: ''
      early termination fee: ''
      estate agent adjustment: ''
      fine and interest: ''
      home insurance: ''
      installment lra: ''
      insurance guarantee: ''
      ipca adm fee: ''
      ipca adm partner adm fee: ''
      ipca rental: ''
      iptu: ''
      iva brokerage estate agent: ''
      iva brokerage quinto andar: ''
      light water or gas: ''
      loss: ''
      non protection 5a: ''
      others: ''
      payment adjustment: ''
      postponement: ''
      property-damage-fine: ''
      protection-5A-acquittance: ''
      protection-5A-fund-transfer: ''
      rental: ''
      rental anticipation: ''
      rental anticipation fee: ''
      rental guarantee fee: ''
      rental guarantee fee refund: ''
      repair offboarding: ''
      repair ongoing: ''
      reservation: ''
      service fee: ''
      utilities defaulting: ''
  producer:
    lineage:
    - datalake_retsuko.invoice_entry.producer
    description: Rotine that produces the entry
    categories:
      brokerage-estate-agent-postponed: ''
      early-termination: ''
      early-termination-v2: ''
      estate-agent: ''
      extra: ''
      fine-and-interest: ''
      manual: ''
      manual-pos-rental: ''
      monthly-routine: ''
      non-specified: ''
      onboarding-routine: ''
      onboarding-routine-delayed: ''
      payment-adjustment: ''
      postponement: ''
      sporadic-routine: ''
  description:
    lineage:
    - datalake_retsuko.invoice_entry.description
    description: Invoice entry title as shown in invoice
  is_rental_paid_in_advance:
    lineage:
    - datalake_retsuko.invoice_entry.is_rental_paid_in_advance
    description: Some versions of contracts have variation in the payment method (aka
      mora/paga, paga/mora)
  invoice_entry_revenue:
    lineage:
    - datalake_invoice.invoice_revenues.invoice_entry_revenue
    description: Indicates which revenue line the entry belongs to
    categories:
      brokerage_financing_fee: ''
      partner_revenue_share_brokerage: ''
      partner_revenue_share_management: ''
      rental_CIQ_commission: ''
      rental_agents_commission: ''
      rental_brokerage_fee_5A: ''
      rental_management_fee_5A: ''
  accrual_year_month:
    lineage:
    - datalake_retsuko.invoice_entry.accrual_year_month
    description: Expense reference month
  due_year_month:
    lineage:
    - datalake_retsuko.invoice_entry.due_year_month
    description: Expense due month
  ts_load:
    description: Timestamp which the data was loaded
