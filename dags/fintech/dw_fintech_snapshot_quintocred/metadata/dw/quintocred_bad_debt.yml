database_name: dw_fintech_snapshot_quintocred
table_name: quintocred_bad_debt
owner: guilherme.sacramento@quintoandar.com.br
domain: Fintech
description:
  QuintoCred is the name given to Velo after its acquisition by QuintoAndar in 2021. As of 2023, the Velo brand was replaced by QuintoCred.
  In June 2025, QuintoCred's core operations were shut down, leaving only the debt collection services active. In the first quarter of 2026, the decision was made to terminate the collection operations by July 31, 2026.
  Therefore, it is important to understand that all Velo and QuintoCred systems are considered legacy, and consequently, the involved tables are as well.
  One row per quintocred bad debt in the QuintoCred rental guarantee product, tracking underwriting, charges, renewals, and collections for landlord protection policies.
columns:
  origin_table:
    description: "Source table of payment information for each line. Possible tables : Omie, Payment, Invoice (direct billing information), Delinquency and Sap"
  origin_platform:
    description: "IF the sk_propose is less than 5000000 then PLATAFORM_2.0 else PLATAFORM_3.0"
  sk_propose:
    description: "Proposal ID related to payment information"
  sk_propose_20:
    description: "Proposal ID related to payment information"
  sk_transaction:
    description: "Delinquency ID from the delinquency table"
  sk_key:
    description: "ID created according to the source sk_transaction (omie, sap, asaas), sk_delinquency (delinquency), sk_propose + id billing_report (direct billing)"
  id_type:
    description: Identifier for the type referenced by this financial record.
  id_type_class:
    description: Identifier for the type class referenced by this financial record.
  client_cpf_cnpj:
    description: "For 3.0 cases, it will be the delinquency entry id, for 2.0 cases, it will be the delinquency id."
  bill_item:
    description: "discrimination of delinquency entry (condominium, energy bill, contractual termination fine, fire insurance, garbage fee, gas bill, IPTU, others, damage to property, rent, water bill)"
  provisional_group:
    description: "column that identifies whether the delinquency refers to Guarantee or Termination"
  payment_classification:
    description: "Indicates whether the delinquency is still 'PENDING' or if the payment was made in the reference month 'PAID IN THE REFENRENCE MONTH', 'OTHER' for other cases"
  due_amount:
    description: "Amount of the original unpaid charge."
  paid_amount:
    description: QuintoCred rental guarantee attribute describing paid amount in the policy lifecycle.
  open_amount:
    description: "Difference between the amount paid and the original invoice amount"
  discount_value:
