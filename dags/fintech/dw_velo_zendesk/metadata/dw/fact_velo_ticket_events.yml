database_name: dw_velo
table_name: fact_velo_ticket_events
owner: ae-finance-fintech@quintoandar.com.br
domain: fintech
description: "Table containing zendesk tickets events"
columns:
  sk_ticket_audit:
    description: "Ticket audit identification number (ID)"
    lineage:
      - datalake_velo_zendesk_clean.ticket_audits.id
  sk_ticket:
    description: "Ticket identification number (ID)"
    lineage:
      - datalake_velo_zendesk_clean.ticket_audits.ticket_id
  sk_author:
    description: "ID of the author of the event"
    lineage:
      - datalake_velo_zendesk_clean.ticket_audits.author_id
  id_event:
    description: "ID of the event"
    lineage:
      - datalake_velo_zendesk_raw.ticket_audits.event
  event_type:
    description: "Type of the event (it can be a comment, creation exclusion, status update, triggers, etc.)"
    lineage:
      - datalake_velo_zendesk_raw.ticket_audits.event
  field_name:
    description: "Name of the field where the event was applied"
    lineage:
      - datalake_velo_zendesk_raw.ticket_audits.event
  previous_value:
    description: "Value before the event"
    lineage:
      - datalake_velo_zendesk_raw.ticket_audits.event
  value:
    description: "Value after the event"
    lineage:
      - datalake_velo_zendesk_raw.ticket_audits.event
  event_via:
    description: "Via of the event (web, whatsapp, mobile, etc.)"
    lineage:
      - datalake_velo_zendesk_clean.ticket_audits.via
  sequence_number:
    description: "Sequence number of the event"
    lineage:
      - datalake_velo_zendesk_clean.ticket_audits._sdc_sequence
  table_version:
    description: "Number of table version (normally 0)"
    lineage:
      - datalake_velo_zendesk_clean.ticket_audits._sdc_table_version
  is_public:
    description: "Flag indicating if the comment is public or internal"
    lineage:
      - datalake_velo_zendesk.ticket_audits.is_public
  dt_extracted:
    description: "Date when the event was extracted"
    lineage:
      - datalake_velo_zendesk_clean.ticket_audits.dt
  ts_batched:
    description: "Timestamp of when the event was batched"
    lineage:
      - datalake_velo_zendesk_clean.ticket_audits._sdc_batched_at
  ts_received:
    description: "Timestamp of when the event was received"
    lineage:
      - datalake_velo_zendesk_clean.ticket_audits._sdc_received_at
  ts_created:
    description: "Timestamp of when the event was received"
    lineage:
      - datalake_velo_zendesk_clean.ticket_audits.created_at
  ts_created_local:
    description: "Timestamp of when the event was received in Brasilia Timezone"
    lineage:
      - datalake_velo_zendesk.ticket_audits.ts_created_local
  ts_load:
    description: "Timestamp when the register was loaded"
    lineage:
      - datalake_velo_zendesk_clean.ticket_audits.ts_load
