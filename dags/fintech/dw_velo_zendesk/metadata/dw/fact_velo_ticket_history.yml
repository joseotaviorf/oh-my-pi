database_name: dw_velo
table_name: fact_velo_ticket_history
owner: ae-finance-fintech@quintoandar.com.br
domain: fintech
description: "Table containing zendesk tickets historical information"
columns:
  sk_ticket:
    description: "Ticket identification number (ID)"
    lineage:
      - datalake_velo_zendesk.ticket_details.id_ticket
  sk_main_ticket:
    description: "Main ticket id related to the current ticket"
    lineage:
      - datalake_velo_zendesk.ticket_details.description
  sk_assignee:
    description: "Identification number of the agent assigned to the ticket"
    lineage:
      - datalake_velo_zendesk.ticket_details.id_assignee
  sk_requester:
    description: "Identification number of the requester"
    lineage:
      - datalake_velo_zendesk.ticket_details.id_requester
  sk_submitter:
    description: "Identification number of the submitter"
    lineage:
      - datalake_velo_zendesk.ticket_details.id_submitter
  sk_delinquency:
    description: "Identification number of the delinquency related to the ticket"
    lineage:
      - datalake_velo_zendesk.ticket_details.id_delinquency
  request_error:
    description: "Description of the error on the request (for example, missing documents)"
    lineage:
      - datalake_velo_zendesk.ticket_details.request_error
  request_type:
    description: "Request type description (termination, non-payment, etc.)"
    lineage:
      - datalake_velo_zendesk.ticket_details.request_type
  cancellation_reason:
    description: "Description of the reason of cancellation"
    lineage:
      - datalake_velo_zendesk.ticket_details.cancellation_reason
  rejection_reason:
    description: "Description of the reason of the request rejection"
    lineage:
      - datalake_velo_zendesk.ticket_details.rejection_reason
  broker_name:
    description: "Broker name"
    lineage:
      - datalake_velo_zendesk.ticket_details.broker_name
  contact_reason:
    description: "Main reason of contact"
    lineage:
      - datalake_velo_zendesk.ticket_details.contact_reason
  tenant_name:
    description: "Tenant name related to the ticket"
    lineage:
      - datalake_velo_zendesk.ticket_details.tenant_name
  client_request:
    description: "Description of client request"
    lineage:
      - datalake_velo_zendesk.ticket_details.client_request
  group_name:
    description: "Ticket group name (team that will handle the request)"
    lineage:
      - datalake_velo_zendesk.ticket_details.name
  ticket_type:
    description: "Ticket type (problem or incident)"
    lineage:
      - datalake_velo_zendesk.ticket_details.type
  sk_group:
    description: "Ticket group id (team that will handle the request)"
    lineage:
      - datalake_velo_zendesk.ticket_details.id_group
  satisfaction_rating:
    description: "Ticket satisfaction rating evaluation"
    lineage:
      - datalake_velo_zendesk.ticket_details.satisfaction_rating
  satisfaction_reason:
    description: "Reason of satisfaction rating evaluation"
    lineage:
      - datalake_velo_zendesk.ticket_details.satisfaction_reason
  satisfaction_comments:
    description: "Comments of satisfaction rating evaluation"
    lineage:
      - datalake_velo_zendesk.ticket_details.satisfaction_comments
  smiley_scale:
    description: "Satisfaction rating based on smiley scale"
    lineage:
      - datalake_velo_zendesk.ticket_details.smiley_scale
  ticket_order:
    description: "Order of the current register according to ticket timeline"
  priority:
    description: "Priority description of the ticket (low, normal, high or urgent)"
    lineage:
      - datalake_velo_zendesk.ticket_details.priority
  recipient:
    description: "Recipient e-mail"
    lineage:
      - datalake_velo_zendesk.ticket_details.recipient
  is_last_register:
    description: "Flag indicating if the current register is the most updated from ticket timeline"
    lineage:
      - datalake_velo_zendesk.ticket_details.recipient
  ticket_via:
    description: "Via in which the ticket was opened (web, whatsapp, mobile, etc.)"
    lineage:
      - datalake_velo_zendesk.ticket_details.ticket_via
  short_request_type:
    description: "Short description of the request type"
    lineage:
      - datalake_velo_zendesk.ticket_details.short_request_type
  description:
    description: "Ticket text content"
    lineage:
      - datalake_velo_zendesk.ticket_details.description
  ticket_url:
    description: "Ticket URL"
    lineage:
      - datalake_velo_zendesk.ticket_details.url_ticket
  tags:
    description: "Tags linked to the ticket"
    lineage:
      - datalake_velo_zendesk.ticket_details.tags
  ticket_status:
    description: "Ticket status (opened, closed, new, etc.)"
    categories:
      new: when the ticket is created.
      open: when the ticket was assigned to an analyst.
      pending: when a response from the user is pending.
      hold: when on hold (rarely used).
      deleted: when it was deleted by the analyst.
      solved: when the analyst marks the ticket as resolved (in this status it is possible to reopen it if necessary).
      closed: when the ticket has been closed (after going through the resolved status), when this happens, it is not possible to reopen it.
    lineage:
      - datalake_velo_zendesk.ticket_details.status
  subject:
    description: "Ticket e-mail subject"
    lineage:
      - datalake_velo_zendesk.ticket_details.subject
  has_incidents:
    description: "Flag indicating if the ticket has incidents related"
    lineage:
      - datalake_velo_zendesk.ticket_details.has_incidents
  is_public:
    description: "Flag indicating if the ticket is public"
    lineage:
      - datalake_velo_zendesk.ticket_details.is_public
  has_payment_forwarded:
    description: "Flag indicating if the ticket has payment forwarded. Filled in the moment when the ticket is closed"
    lineage:
      - datalake_velo_zendesk.ticket_details.has_payment_forwarded
  ts_created:
    description: "Timestamp when the ticket was created"
    lineage:
      - datalake_velo_zendesk.ticket_details.ts_created
  ts_created_local:
    description: "Timestamp when the ticket was created in Brasilia timezone"
    lineage:
      - datalake_velo_zendesk.ticket_details.ts_created_local
  ts_updated:
    description: "Timestamp when the ticket was updated"
    lineage:
      - datalake_velo_zendesk.ticket_details.ts_updated
  ts_updated_local:
    description: "Timestamp when the ticket was updated in Brasilia timezone"
    lineage:
      - datalake_velo_zendesk.ticket_details.ts_updated_local
  dt_extracted:
    description: "Date when the ticket was extracted"
    lineage:
      - datalake_velo_zendesk.ticket_details.dt_extracted
  ts_load:
    description: "Timestamp when the ticket was loaded"
    lineage:
      - datalake_velo_zendesk.ticket_details.ts_load
  request_responsible:
    description: "Name of the responsible for the request"
    lineage:
      - datalake_velo_zendesk.ticket_details.request_responsible
  request_channel:
    description: "Channel where the request was made"
    lineage:
      - datalake_velo_zendesk.ticket_details.request_channel
  exception_type:
    description: "Exception type"
    lineage:
      - datalake_velo_zendesk.ticket_details.exception_type
  payment_period:
    description: "Period the payment has to be made"
    lineage:
      - datalake_velo_zendesk.ticket_details.payment_period
  dt_request:
    description: "Date when the request was made"
    lineage:
      - datalake_velo_zendesk.ticket_details.dt_request
