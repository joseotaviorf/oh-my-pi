database_name: dw_velo
table_name: dim_velo_ticket_users
owner: ae-finance-fintech@quintoandar.com.br
domain: fintech
description: "Table containing zendesk users data"
columns:
  sk_ticket_user:
    description: "Zendesk user identification number (different from rgp users)"
    lineage:
      - datalake_velo_zendesk_clean.users.id_user
  sk_organization:
    description: "Zendesk user organization identification number"
    lineage:
      - datalake_velo_zendesk_clean.users.id_organization
  sk_default_group:
    description: "Zendesk user default group identification number (the group names are described on datalake_velo_zendesk_clean.groups)"
    lineage:
      - datalake_velo_zendesk_clean.users.id_default_group
  url_user:
    description: "Zendesk user URL profile"
    lineage:
      - datalake_velo_zendesk_clean.users.url_user
  user_name:
    description: "Zendesk user name"
    lineage:
      - datalake_velo_zendesk_clean.users.name
  user_email:
    description: "Zendesk user email"
    lineage:
      - datalake_velo_zendesk_clean.users.email
  user_phone:
    description: "Zendesk user phone number"
    lineage:
      - datalake_velo_zendesk_clean.users.phone
  time_zone:
    description: "Zendesk user local timezone"
    lineage:
      - datalake_velo_zendesk_clean.users.time_zone
  tags:
    description: "Zendesk user related tags"
    lineage:
      - datalake_velo_zendesk_clean.users.tags
  role:
    description: "Zendesk user role (agent, admin or end-user)"
    lineage:
      - datalake_velo_zendesk_clean.users.role
  role_type:
    description: "Zendesk user role type description"
    lineage:
      - datalake_velo_zendesk_clean.users.role_type
  signature:
    description: "Zendesk user signature used on their comments"
    lineage:
      - datalake_velo_zendesk_clean.users.signature
  locale:
    description: "Zendesk user local abbreviation (pt-br)"
    lineage:
      - datalake_velo_zendesk_clean.users.locale
  is_verified:
    description: "Flag indicating if the Zendesk user is verified"
    lineage:
      - datalake_velo_zendesk_clean.users.is_verified
  is_active:
    description: "Flag indicating if the Zendesk user is active"
    lineage:
      - datalake_velo_zendesk_clean.users.is_active
  is_shared_phone_number:
    description: "Flag indicating if the Zendesk user has a shared phone number"
    lineage:
      - datalake_velo_zendesk_clean.users.is_shared_phone_number
  is_permanently_deleted:
    description: "Flag indicating if the Zendesk user is permanently deleted"
    lineage:
      - datalake_velo_zendesk_clean.users.is_permanently_deleted
  ts_last_login:
    description: "Timestamp when the Zendesk user last logged into his account"
    lineage:
      - datalake_velo_zendesk_clean.users.ts_last_login
  ts_created:
    description: "Timestamp when the Zendesk user profile was created"
    lineage:
      - datalake_velo_zendesk_clean.users.ts_created
  ts_created_local:
    description: "Timestamp when the Zendesk user profile was created in Brasilia timezone"
    lineage:
      - datalake_velo_zendesk_clean.users.ts_created_local
  ts_updated:
    description: "Timestamp when the register was last updated"
    lineage:
      - datalake_velo_zendesk_clean.users.ts_updated
  ts_load:
    description: "Timestamp when the register was loaded"
    lineage:
      - datalake_velo_zendesk_clean.users.ts_load
