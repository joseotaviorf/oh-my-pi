---
database_name: datalake_cyber_audit_log_raw
table_name: audit_log
owner: juliana.hocihara@quintoandar.com.br
domain: Fintech
description: >-
  Raw incremental ingest of the Oracle AUDIT_LOG table from CyberFinancial, one row per
  user or system action. Grain is the audit event identifier (ALID) plus source origin.
  Consumed by the clean audit_log table for security investigations, compliance audits,
  and user-activity traceability in Fintech collections workflows.
columns:
  ALID:
    description: Primary key of the audit event in the CyberFinancial Oracle source table.
  ALUSER:
    description: Login or user code that performed the audited action in CyberFinancial.
    tags:
      - Confidential
  ALPATH:
    description: Application path, endpoint, or module invoked during the audited operation.
  ALMETHOD:
    description: HTTP verb or database operation type executed for the audited request.
  ALRECORD:
    description: Serialized payload or record snapshot affected by the audited action.
    tags:
      - Confidential
  ALIP:
    description: Client IP address observed when the audited action was executed.
    tags:
      - Confidential
  ALDATE:
    description: Timestamp when the audited action occurred in the CyberFinancial system.
  source:
    description: >-
      Origin of the ingested row within the Cyber audit log pipeline, distinguishing the
      live Oracle table from the historical purge backup.
    categories:
      Original Table: Row loaded from the main Oracle AUDIT_LOG table.
      Purge Table: Row loaded from the Oracle AUDIT_LOG_ESP purge backup table.
  ts_ingestion:
    description: Timestamp when the Spark ingestion job wrote the row into the raw lake.
  table_partition:
    description: >-
      Partition driver derived from ALDATE during ingestion; used to derive year, month,
      and day hive partitions for incremental loads.
  year:
    description: Calendar year partition derived from table_partition at ingestion time.
  month:
    description: Calendar month partition derived from table_partition at ingestion time.
  day:
    description: Calendar day partition derived from table_partition at ingestion time.
