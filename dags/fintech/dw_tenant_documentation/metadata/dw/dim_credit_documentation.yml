database_name: dw_quintoandar
table_name: dim_credit_documentation
owner: giuseppe.giovanelli@quintoandar.com.br
domain: Fintech 
description: "Dimension table with proposals with documentation sent."
columns:
  sk_proposal:
    lineage:
      - datalake_ebdb_clean.proposal.id
    description: "Proposal identification from EBDB."
  sk_credit_evaluation:
    lineage:
      - datalake_docx_clean.credit_evaluation.id
    description: "First credit analysis identifier from Sorting Hat."
  documents_needed:
    lineage:
      - datalake_ebdb_clean.proposal_document.type
    description: "Set of documents type."
  documents_status:
    lineage:
      - datalake_ebdb_clean.proposal_document.tenant_documentation_status
    description: "Tenant documentation status, APPROVED or NOT APPROVED."
  ts_credit_started:
    lineage:
      - datalake_docx_clean.credit_evaluation.ts_created
    description: "Credit evaluation start date on DOCX."
  ts_credit_updated:
    lineage:
      - datalake_docx_clean.credit_evaluation.ts_updated
    description: "Credit evaluation last update date on DOCX."
  ts_load:
    description: "Date when the row was loaded."