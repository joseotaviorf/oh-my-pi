database_name: dw_quintoandar
table_name: fact_tenant_proponent_documentation
owner: giuseppe.giovanelli@quintoandar.com.br
domain: Fintech
description: "Fact table focused on anlysing documentation flow on EBDB."
columns:
  sk_proponent:
    lineage:
      - datalake_ebdb_clean.proponent_proposal.id
    description: "Proponent identification from EBDB."
  sk_proposal:
    lineage:
      - datalake_ebdb_clean.proponent_proposal.id_proposal
    description: "Proposal identification from EBDB."
  sk_first_document_sent_date:
    lineage:
      - datalake_ebdb_clean.proposal_document.ts_created
    description: "First key date tenant documentation sent registered on EBDB."
  sk_first_document_resent_date:
    lineage:
      - datalake_ebdb_clean.proponent_info_resend_request.ts_created
    description: "First key date tenant documentation resent registered on EBDB."
  sk_last_document_resent_date:
    lineage:
      - datalake_ebdb_clean.proponent_info_resend_request.ts_created
    description: "Last key date tenant documentation resent registered on EBDB."
  amount_documents_needed:
    lineage:
      - datalake_ebdb_clean.proposal_document.type
    description: "Distinct count of document types"
  amount_documents_sent:
    lineage:
      - datalake_ebdb_clean.proposal_document.id
      - datalake_ebdb_clean.proponent_info_resend_request.id
    description: "Sum of rows on proposal_document and proponent_info_resend_request"
  is_resent:
    lineage:
      - datalake_ebdb_clean.proponent_info_resend_request.ts_created
    description: "Flag that checks if there is a ts_created on EBDB."
  ts_first_documents_sent:
    lineage:
      - datalake_ebdb_clean.proposal_document.ts_created
    description: "First time tenant documentation sent registered on EBDB."
  ts_first_document_resent:
    lineage:
      - datalake_ebdb_clean.proponent_info_resend_request.ts_created
    description: "First date tenant documentation resent registered on EBDB."
  ts_last_document_resent:
    lineage:
      - datalake_ebdb_clean.proponent_info_resend_request.ts_created
    description: "Last date tenant documentation resent registered on EBDB."
  ts_load:
    description: "Date row was loaded."