database_name: dw_quintoandar
table_name: fact_tenant_document_status
owner: giuseppe.giovanelli@quintoandar.com.br
domain: Fintech
description: "Fact table focused on analysing documentation flow on EBDB."
columns:
  sk_document:
    lineage:
      - datalake_ebdb_clean.proposal_document.id
      - datalake_ebdb_clean.proponent_info_resend_request_aud.id_proposal_document
    description: "Document identification from EBDB's proposal_document table."
  sk_proponent:
    lineage:
      - datalake_ebdb_clean.proponent_info_resend_request_aud.id_proponent_proposal
      - datalake_ebdb_clean.proponent_proposal.id
    description: "Proponent identification from EBDB's proposal_document table."
  sk_proposal:
    lineage:
      - datalake_ebdb_clean.proponent_proposal.id_proposal
      - datalake_ebdb_clean.proposal_aud.id_proposal
    description: "Proposal identification from EBDB's proposal_document table."
  sk_document_status_date:
    lineage:
      - datalake_ebdb_clean.user_revision_entity.ts_revision
    description: "Document status set date key."
  document_type:
    lineage:
      - datalake_ebdb_clean.proposal_document.type
      - datalake_ebdb_clean.proponent_info_resend_request_aud.proponent_info_type
    description: "Document type from EBDB's proposal_document table."
  status:
    lineage:
      - datalake_ebdb_clean.proposal_aud.tenant_documentation_status
    description: "Tenant documentation status from EBDB's tenant_documentation_status table."
  resend_document_reason:
    lineage:
      - datalake_ebdb_clean.proponent_info_resend_request_aud.resend_document_reason
    description: "Reason tenant documentation needed to be resent from EBDB."
  resend_rank:
    lineage:
      - datalake_ebdb_clean.proponent_info_resend_request_aud.proponent_info_type
      - datalake_ebdb_clean.proponent_info_resend_request_aud.id_proponent_proposal
    description: "Count of requests registered on proponent_info_resend_request_aud by proposal and information type."
  days_between_current_and_last_doc_status:
    lineage:
      - datalake_ebdb_clean.user_revision_entity.ts_revision
    description: "Days between status alteration by documentation."
  ts_document_status:
    lineage:
      - datalake_ebdb_clean.user_revision_entity.ts_revision
    description: "Document status set date."
  ts_load:
    description: "Date table row was loaded."
  