cluster:
  type: emr_7_12_consolidation_l_memory_fleet_cluster
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    master_node_type_id: r6g.2xlarge
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
      spark.driver.memory: 8g
      spark.driver.memoryOverhead: 2g
      spark.yarn.am.memory: 2g
    aws_attributes:
      ebs_volume_size: 200
    core_nodes:
      target_on_demand: 2
      target_spot: 0
      instance_types:
      - r6g.4xlarge
      - r7g.4xlarge
      - r6i.4xlarge
    task_nodes:
      instance_types:
      - r6g.4xlarge
      - r7g.4xlarge
      - r6i.4xlarge
      target_on_demand: 0
      target_spot: 1
      allocation_strategy: price-capacity-optimized
      bid_price_percentage: 100
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE
