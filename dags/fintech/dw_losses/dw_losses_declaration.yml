dag:
  name: dw_losses
  schedule_start_date: 2022,08,01
  owner: Data Fintech
workflow:
  type: query_delta
  layer: dw
  custom_schema: losses
  has_load_to_redshift_task: false
  inner_dependencies:
    fact_losses:
      - fact_provision
      - fact_closing
    fact_write_off_eligible:
      - fact_losses
cluster:
  type: databricks_13_3_med_general_photon_cluster
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: "quintoandar_{{ var.value.environment }}"
