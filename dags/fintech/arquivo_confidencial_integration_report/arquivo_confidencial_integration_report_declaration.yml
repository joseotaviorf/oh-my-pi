dag:
  name: arquivo_confidencial_integration_report
  owner: Data Fintech
  schedule_interval: 0 3 * * *
  documentation:
    dag_purpose: |
      This DAG imports the table integration_report_aud from [Arquivo Confidencial](https://github.com/quintoandar/arquivo-confidencial), a service responsible to track user personal info using SaaS platforms. **This DAG was created as a short-term solution to process the data from integration_report_aud, which has an extremelly large JSON column (attributes) not compatible with CDC infrastructure. This DAG will be soon deprecated.**
workflow:
  type: custom_ingestion
  layer: raw
  load_spark_job: load_incremental_arquivo_confidencial_raw
  custom_schema: "arquivo_confidencial"
  spark_job_arguments:
  - "{environment}"
  - "{bucket}"
  - "{dag_name}"
  - "{schema}"
  - "{table_name}"
  tables_customization:
    integration_report:
      partitions: ["year", "month", "day"]
      extraction_type: incremental
      extra_spark_job_arguments:
      - "updated_at"
      - "{{ data_interval_start | ds }}"
    integration_report_aud:
      partitions: ["year", "month", "day"]
      extraction_type: incremental
      extra_spark_job_arguments:
        - "created_at"
        - "{{ data_interval_start | ds }}"
cluster:
  type: custom_cluster
  databricks_conn_id: databricks_new
  custom_libraries:
    - jar: "{artifacts_bucket}/mysql-connector-java/mysql-connector-java-5.1.47.jar"
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    driver_node_type_id: m5d.xlarge
    node_type_id: r5.xlarge
    num_workers: 3
    spark_version: 13.3.x-scala2.12
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
