database_name: datalake_owner_fees_homolog
table_name: contract_brokerage_fee
description: This table deduplicates the clean table of our datalake.
  It contains the information about the Brokerage Fee of the Owner Fees contracts.
domain: Fintech
owner: ae-finance-fintech@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_owner_fees_clean.contract_brokerage_fee.id
    description: Unique ID of the table
  id_contract:
    lineage:
      - datalake_owner_fees_clean.contract_brokerage_fee.id_contract
    description: Contract ID of Owner Fees service. It cannot be joined with EBDB Contract.
  charge_delay_in_days:
    lineage:
      - datalake_owner_fees_clean.contract_brokerage_fee.charge_delay_in_days
    description: Number of days in delay.
  installment_number:
    lineage:
      - datalake_owner_fees_clean.contract_brokerage_fee.installment_number
    description: Number of the installment.
  brokerage_fee:
    lineage:
      - datalake_owner_fees_clean.contract_brokerage_fee.brokerage_fee
    description: Fee value of the brokerage.
  premium_fee:
    lineage:
      - datalake_owner_fees_clean.contract_brokerage_fee.premium_fee
    description: Fee charged for financing. Varies according to the number of installments.
  down_payment:
    lineage:
      - datalake_owner_fees_clean.contract_brokerage_fee.down_payment
    description: Down payment fee. It's the percentage to be paid at the beginning.
  version:
    lineage:
      - datalake_owner_fees_clean.contract_brokerage_fee.version
    description: Version of the Owner Fees's contract.
  ts_created:
    lineage:
      - datalake_owner_fees_clean.contract_brokerage_fee.ts_created
    description: Timestamp when the register was created.
  ts_updated:
    lineage:
      - datalake_owner_fees_clean.contract_brokerage_fee.ts_updated
    description: Timestamp when the register was updated for the last time.
