---
database_name: datalake_robin_hood_clean
table_name: accounting_entry_recon_removals
description:
  One row per accounting entry that the Fintech backoffice flagged to be skipped
  in Robin Hood reconciliation queries, ingested via CDC from the Robin Hood
  digital wallet database. The presence of the row is the ignore signal itself,
  so it does not change the accounting entry fact, the payment lifecycle, IRRF
  withholding, or the SAP sync. Reversing an exclusion is a hard delete of the
  row, so the dataset always reflects only the currently active exclusions and
  is used by accounting reconciliation reporting to filter out known divergences.
owner: juliana.hocihara@quintoandar.com.br
domain: Fintech
columns:
  id:
    lineage:
      - datalake_robin_hood_raw.accounting_entry_recon_removals.id
    description:
      Sequential identifier of the exclusion record, generated by Robin Hood when
      the backoffice registers the accounting entry as ignored in reconciliation.
  id_accounting_entry:
    lineage:
      - datalake_robin_hood_raw.accounting_entry_recon_removals.accounting_entry_id
    description:
      Identifier of the accounting entry excluded from reconciliation, referencing
      datalake_robin_hood_clean.accounting_entry. Unique in this dataset, so the
      same entry can be flagged at most once.
  reason:
    lineage:
      - datalake_robin_hood_raw.accounting_entry_recon_removals.reason
    description:
      Free-text justification registered by the backoffice for excluding the
      accounting entry from reconciliation, such as a known divergence already
      settled outside the platform. Optional in the source, so it can be null.
  ts_created:
    lineage:
      - datalake_robin_hood_raw.accounting_entry_recon_removals.created_at
    description:
      Moment the exclusion was registered in Robin Hood. There is no end
      timestamp because reversing the exclusion deletes the row, so this is the
      only date available to audit when an entry started being ignored.
  op_cdc:
    lineage:
      - datalake_robin_hood_raw.accounting_entry_recon_removals.op_cdc
    description:
      CDC operation type for this reconciliation removal row (insert, update, or
      delete). Deletes matter here because undoing an exclusion is a hard delete
      in the source database.
    categories:
      r: "Read or snapshot of an existing reconciliation removal"
      c: "Creation of a new reconciliation removal"
      u: "Update to an existing reconciliation removal"
      d: "Deletion of a reconciliation removal, meaning the exclusion was undone"
  ts_cdc_transaction:
    lineage:
      - datalake_robin_hood_raw.accounting_entry_recon_removals.ts_cdc_transaction
    description:
      Timestamp when the CDC connector captured the reconciliation removal change
      event.
  ts_database_transaction:
    lineage:
      - datalake_robin_hood_raw.accounting_entry_recon_removals.ts_database_transaction
    description:
      Timestamp when the source database committed the reconciliation removal
      change.
