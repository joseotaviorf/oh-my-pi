database_name: datalake_robin_hood_clean
table_name: tax
description:
  One row per tax in the Fintech clean layer, sourced from
  datalake_robin_hood_clean for payments, billing, and financial operations
  reporting.
owner: juliana.hocihara@quintoandar.com.br
domain: Fintech
columns:
  id:
    lineage:
      - datalake_robin_hood_raw.tax.id
    description: Financial attribute representing id on the tax dataset.
  id_payee:
    lineage:
      - datalake_robin_hood_raw.tax.payee_id
    description: Identifier for the payee referenced by this financial record.
  due_amount:
    lineage:
      - datalake_robin_hood_raw.tax.due_amount
    description: Financial attribute representing due amount on the tax dataset.
  accounting_year_month:
    lineage:
      - datalake_robin_hood_raw.tax.accounting_year_month
    description: Financial attribute representing accounting year month on the tax dataset.
  ts_created:
    lineage:
      - datalake_robin_hood_raw.tax.created_at
    description: Timestamp when created occurred in the upstream fintech system.
  ts_disabled:
    lineage:
      - datalake_robin_hood_raw.tax.disabled_at
    description: Timestamp when disabled occurred in the upstream fintech system.
  ts_blocked:
    lineage:
      - datalake_robin_hood_raw.tax.blocked_at
    description: Timestamp when blocked occurred in the upstream fintech system.
