database_name: datalake_rental_guarantee
table_name: charge
owner: juliana.hocihara@quintoandar.com.br
domain: Fintech
description: "Table containing information on the amount charged to the tenant related to the standalone guarantee (fiança simples). Read more about it at: https://drive.google.com/drive/folders/1VTdZtORa_crcT4P20F4lDHFNO7u15HVL"
columns: 
  id:
    description: "Charge unique identifier in rentalguarantee database"
    lineage: 
      - datalake_rental_guarantee_clean.charge.id
  id_guarantee:
    description: "Identifier in the rentalguarantee database of the guarantee which a charge belongs to"
    lineage: 
      - datalake_rental_guarantee_clean.charge.id_guarantee
  cancellation_reason:
    description: "Charge cancelation reason"
    lineage: 
      - datalake_rental_guarantee_clean.charge.cancellation_reason
  card_token:
    description: "Token generated by the MundiPagg API to perform charges and authorizations w/o exchanging the credit card info"
    lineage: 
      - datalake_rental_guarantee_clean.charge.card_token
  emv:
    description: "Charge emv when payment type is Pix"
    lineage: 
      - datalake_rental_guarantee_clean.charge.emv
  installments:
    description: "The total of installments to charge the tenant, defaults to 1"
    lineage: 
      - datalake_rental_guarantee_clean.charge.installments
  pix_link:
    description: "Charge payment link when type is Pix"
    lineage: 
      - datalake_rental_guarantee_clean.charge.pix_link
  qr_code:
    description: "Charge QR code when payment type is Pix"
    lineage: 
      - datalake_rental_guarantee_clean.charge.qr_code
  charge_status:
    description: QuintoCred rental guarantee attribute describing charge status in the policy lifecycle.
    lineage: 
      - datalake_rental_guarantee_clean.charge.charge_status
  charge_type:
    description: "Charge payment type: - CREDIT_CARD - PIX - BILL"
    lineage: 
      - datalake_rental_guarantee_clean.charge.charge_type
  refund_amount:
    description: "Amount that should be refunded"
    lineage: 
      - datalake_rental_guarantee_clean.charge.refund_amount
  ts_created:
    description: "Creation timestamp"
    lineage: 
      - datalake_rental_guarantee_clean.charge.ts_created
  ts_updated:
    description: "Last update timestamp"
    lineage: 
      - datalake_rental_guarantee_clean.charge.ts_updated
  year:
    description: "Partition year"
    lineage: 
      - datalake_rental_guarantee_clean.charge.year
  month:
    description: "Partition month"
    lineage: 
      - datalake_rental_guarantee_clean.charge.month
  day:
    description: "Partition day"
    lineage: 
      - datalake_rental_guarantee_clean.charge.day
