database_name: datalake_rental_guarantee
table_name: guarantee
owner: juliana.hocihara@quintoandar.com.br
domain: Fintech
description: "Table containing data on standalone guarantee (fiança simples) as a guarantee of payment to the owner. Read more about it at: https://drive.google.com/drive/folders/1VTdZtORa_crcT4P20F4lDHFNO7u15HVL"
columns:
  id:
    description: "Guarantee unique identifier in rentalguarantee database"
    lineage:
      - datalake_rental_guarantee_clean.guarantee.id
  id_contract_ebdb:
    description: "Identifier in the EBDB database of the contract which a guarantee belongs to. This info is only filled when the contract is active"
    lineage:
      - datalake_rental_guarantee_clean.guarantee.id_contract_ebdb
  id_documentation_ebdb:
    description: "Identifier in the EBDB database of the documentation which a guarantee belongs to"
    lineage:
      - datalake_rental_guarantee_clean.guarantee.id_documentation_ebdb
  id_house_ebdb:
    description: "Identifier in the EBDB database of the house related to the guarantee"
    lineage:
      - datalake_rental_guarantee_clean.guarantee.id_house_ebdb
  id_tenant_ebdb:
    description: "Identifier in the EBDB database of the tenant related to the guarantee"
    lineage:
      - datalake_rental_guarantee_clean.guarantee.id_tenant_ebdb
  cancellation_reason:
    description: "Guarantee cancelation reason"
    lineage:
      - datalake_rental_guarantee_clean.guarantee.cancellation_reason
  guarantee_source:
    description: "Guarantee creation source"
    lineage:
      - datalake_rental_guarantee_clean.guarantee.guarantee_source
  guarantee_status:
    description: "Current status of the given guarantee"
    lineage:
      - datalake_rental_guarantee_clean.guarantee.guarantee_status
  guarantee_type:
    description: "Guarantee type, allowed values - PRO_GUARANTOR , for pro guarantor - DEPOSIT , for deposit - STANDALONE , for standalone guarantee Info about guarantee type is sent to guarantee table at main where possible values are: - RentalDeposit , para o Caução - Standalone , for standalone guarantee - PRO_GUARANTOR , for pro guarantor guarantee"
    lineage:
      - datalake_rental_guarantee_clean.guarantee.guarantee_type
  base_value:
    description: "Base value in cents required to create a guarantee (It's rent value, not package value)"
    lineage:
      - datalake_rental_guarantee_clean.guarantee.base_value
  final_value:
    description: "Final value in cents based on base value and score"
    lineage:
      - datalake_rental_guarantee_clean.guarantee.final_value
  score:
    description: "Credit analysis result required to create a guarantee"
    lineage:
      - datalake_rental_guarantee_clean.guarantee.score
  has_accepted_terms_and_conditions:
    description: "When users accepted the terms and conditions in the payment rules page before get into the payments page"
    lineage:
      - datalake_rental_guarantee_clean.guarantee.accepted_terms_and_conditions
  ts_created:
    description: "Creation timestamp"
    lineage:
      - datalake_rental_guarantee_clean.guarantee.ts_created
  ts_updated:
    description: "Last update timestamp"
    lineage:
      - datalake_rental_guarantee_clean.guarantee.ts_updated
  ts_billed:
    description: "Timestamp of billing to tenant. Only filled when guarantee type is DEPOSIT"
    lineage:
      - datalake_rental_guarantee_clean.guarantee.ts_billed
  ts_cancellation_requested:
    description: "Guarantee cancelation requested timestamp"
    lineage:
      - datalake_rental_guarantee_clean.guarantee.ts_cancellation_requested
  ts_expired:
    description: "Date when the guarantee will be expired. Obs: updates everytime the field dataInicio from the Contrato table from EBDB is updated"
    lineage:
      - datalake_rental_guarantee_clean.guarantee.ts_expired
  ts_paid:
    description: "Guarantee payment timestamp"
    lineage:
      - datalake_rental_guarantee_clean.guarantee.ts_paid
  ts_payment_expired:
    description: "Guarantee payment expiration date"
    lineage:
      - datalake_rental_guarantee_clean.guarantee.ts_payment_expired
  ts_started:
    description: "Guarantee vigency begining timestamp"
    lineage:
      - datalake_rental_guarantee_clean.guarantee.ts_started
