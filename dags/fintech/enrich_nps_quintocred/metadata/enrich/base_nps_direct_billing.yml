database_name: datalake_nps_quintocred
table_name: base_nps_direct_billing
owner: guilherme.sacramento@quintoandar.com.br
domain: Fintech
description: Monthly broker-level snapshot for QuintoCred NPS eligibility restricted to
  direct-billing proposals, one row per real-estate broker for the current reference
  month. Mirrors base_nps metrics but counts only proposes flagged with is_direct_billing.
  Used by the Fintech NPS squad to survey broker partners on the direct-billing funnel.
columns:
  id_broker:
    description: QuintoCred broker identifier used as the grain of the direct-billing
      NPS eligibility snapshot.
    lineage:
    - datalake_velo.broker.id_broker
  contracts:
    description: Count of distinct active direct-billing contracts linked to the broker
      at the reference month.
    lineage:
    - datalake_velo.propose.id_propose
    - datalake_velo.propose.is_contract
    - datalake_velo.propose.is_direct_billing
    - datalake_velo.propose.dt_contract_started
    - datalake_velo.propose.dt_ended
    - datalake_velo.propose_legacy.id_propose
    - datalake_velo.propose_legacy.is_contract
    - datalake_velo.propose_legacy.is_direct_billing
    - datalake_velo.propose_legacy.dt_contract_started
    - datalake_velo.propose_legacy.dt_ended
  p_generated_at_month:
    description: Direct-billing proposals created by the broker in the reference month.
    lineage:
    - datalake_velo.propose.id_propose
    - datalake_velo.propose.ts_propose_started
    - datalake_velo.propose.is_direct_billing
    - datalake_velo.propose_legacy.id_propose
    - datalake_velo.propose_legacy.ts_propose_started
    - datalake_velo.propose_legacy.is_direct_billing
  p2c_at_month:
    description: Direct-billing proposals converted to contracts in the reference month.
    lineage:
    - datalake_velo.propose.id_propose
    - datalake_velo.propose.is_contract
    - datalake_velo.propose.is_direct_billing
