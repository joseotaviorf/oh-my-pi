database_name: datalake_nps_quintocred
table_name: base_nps
owner: guilherme.sacramento@quintoandar.com.br
domain: Fintech
description: Monthly broker-level snapshot for QuintoCred NPS eligibility, one row per
  real-estate broker for the current reference month. Aggregates proposal-to-contract
  funnel metrics, rolling three- and six-month production windows, and months-on-books
  from Velo propose history. Consumed by the Fintech NPS squad to select broker partners
  for satisfaction surveys.
columns:
  id_broker:
    description: QuintoCred broker identifier used as the grain of the NPS eligibility
      snapshot.
    lineage:
    - datalake_velo.broker.id_broker
  contracts:
    description: Count of distinct active rental-guarantee contracts linked to the broker
      at the reference month.
    lineage:
    - datalake_velo.propose.id_propose
    - datalake_velo.propose.is_contract
    - datalake_velo.propose.dt_contract_started
    - datalake_velo.propose.dt_ended
    - datalake_velo.propose_legacy.id_propose
    - datalake_velo.propose_legacy.is_contract
    - datalake_velo.propose_legacy.dt_contract_started
    - datalake_velo.propose_legacy.dt_ended
  p_generated_at_month:
    description: Proposals created by the broker in the reference month.
    lineage:
    - datalake_velo.propose.id_propose
    - datalake_velo.propose.ts_propose_started
    - datalake_velo.propose_legacy.id_propose
    - datalake_velo.propose_legacy.ts_propose_started
  p2c_at_month:
    description: Proposals converted to contracts in the reference month (proposal-to-contract).
    lineage:
    - datalake_velo.propose.id_propose
    - datalake_velo.propose.is_contract
    - datalake_velo.propose.ts_propose_started
    - datalake_velo.propose_legacy.id_propose
    - datalake_velo.propose_legacy.is_contract
    - datalake_velo.propose_legacy.ts_propose_started
  drop_p2c_at_month:
    description: Proposals created in the reference month that did not convert to a contract.
    lineage:
    - datalake_velo.propose.id_propose
    - datalake_velo.propose.is_contract
    - datalake_velo.propose.ts_propose_started
    - datalake_velo.propose_legacy.id_propose
    - datalake_velo.propose_legacy.is_contract
    - datalake_velo.propose_legacy.ts_propose_started
  contracts_beginning_and_ending_at_month:
    description: Contracts that both started and ended within the same reference month.
    lineage:
    - datalake_velo.propose.id_propose
    - datalake_velo.propose.is_contract
    - datalake_velo.propose.ts_propose_started
