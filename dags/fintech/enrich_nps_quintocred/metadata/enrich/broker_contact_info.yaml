database_name: datalake_nps_quintocred
table_name: broker_contact_info
owner: ae-finance-fintech@quintoandar.com.br
domain: fintech
description: "This table brings the brokers contact info (email and phone)"
columns:
  id_broker:
    description: "Broker's identification number (ID)"
    lineage:
      - datalake_velo.broker.id_broker
  id_realtor:
    description: "Realtor's identification number (ID)"
    lineage:
      - datalake_velo.user.uuid_user
  broker_name:
    description: "Broker's name"
    lineage:
      - datalake_velo.broker.broker_name
  broker_comercial_name:
    description: "Broker's comercial name"
    lineage:
      - datalake_velo.broker.broker_comercial_name
  document:
    description: "Broker's document number (CNPJ)"
    lineage:
      - datalake_velo.broker.cnpj
  realtor:
    description: "Realtor's full name"
    lineage:
      - datalake_velo.user.name
  email:
    description: "Realtor's e-mail"
    lineage:
      - datalake_velo.user.email
  phone:
    description: "Broker's phone"
    lineage:
      - datalake_person_clean.contact_info.contact_info
  profile:
    description: "User's role in Velo's platform"
    lineage:
      - datalake_velo.user.user_role
