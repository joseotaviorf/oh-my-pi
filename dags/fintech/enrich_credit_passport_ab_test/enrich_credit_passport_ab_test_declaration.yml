---
dag:
  name: enrich_credit_passport_ab_test
  schedule_start_date: 2025, 8, 22
  owner: Data Fintech
  documentation:
    dag_purpose: |
      Creates the enriched tables to segment the users into test, control or noise groups to follow-up the credit passport ab test. This DAG will be deprecated aftter the credit passport is released to 100% of the users.
workflow:
  type: query_delta
  layer: enrich
  custom_schema: docx
cluster:
  type: databricks_16_4_min_memory_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: "quintoandar_{{ var.value.environment }}"
      spark.databricks.delta.constraints.allowUnenforcedNotNull.enabled: true
    autotermination_minutes: 20
