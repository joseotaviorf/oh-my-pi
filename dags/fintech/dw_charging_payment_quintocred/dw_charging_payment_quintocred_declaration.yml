dag:
  name: dw_charging_payment_quintocred
  schedule_start_date: 2024,10,01
  owner: Data Fintech
workflow:
  type: query_delta
  layer: dw
  custom_schema: charging_payment_quintocred
  has_load_to_redshift_task: false
  inner_dependencies:
    fact_payment_delinquency:
      - fact_direct_billing
      - fact_charging_payment
      - fact_delinquecy
    fact_theoretical_payment_delinquency:
      - fact_propose_timeline
      - fact_payment_delinquency
    fact_payment_full:
      - fact_accounting_funnel
      - fact_theoretical_payment_delinquency
    fact_renewal:
      - fact_payment_full
      - fact_renewal_base
    fact_bad_debt:
      - fact_propose_timeline
cluster:
  type: custom_cluster
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: "quintoandar_{{ var.value.environment }}"
      spark.databricks.delta.constraints.allowUnenforcedNotNull.enabled: true
    autotermination_minutes: 20
    driver_node_type_id: r5d.2xlarge
    node_type_id: r5d.4xlarge
    num_workers: 2
    spark_version: 13.3.x-scala2.12
  databricks_conn_id: databricks_new
