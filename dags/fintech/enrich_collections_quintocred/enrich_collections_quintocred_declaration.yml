---
dag:
  name: enrich_collections_quintocred
  schedule_start_date: 2022, 8, 28
  owner: Data Fintech
  documentation:
    dag_purpose: |
      Creates enriched tables for QuintoCred Collection context.
workflow:
  type: query_delta
  layer: enrich
  inner_dependencies:
    delinquency_timeline:
      - status_timeline
    mob_delinquency_timeline:
      - delinquency_timeline
    major_type_distribution:
      - delinquency_timeline
      - mob_delinquency_timeline
    collections_wallet:
      - delinquency_timeline
      - major_type_distribution
      - mob_delinquency_timeline
cluster:
  type: custom_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    driver_node_type_id: m5d.4xlarge
    node_type_id: m5d.4xlarge
    spark_version: 13.3.x-scala2.12
    num_workers: 4
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: "quintoandar_{{ var.value.environment }}"
