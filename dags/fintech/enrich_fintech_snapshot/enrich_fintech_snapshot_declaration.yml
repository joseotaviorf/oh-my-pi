---
dag:
  name: enrich_fintech_snapshot
  schedule_start_date: 2020, 7, 1
  owner: Data Fintech
  documentation:
    dag_purpose: |
      This DAG creates a snapshot of several tables in order to provide "time travel" for Finance Team.
      This DAG is triggered when execution_date is the first business day, monthly, via Mediator.
workflow:
  type: query
  layer: enrich
  default_extraction_type: incremental
  default_partitions: [year, month, day]
  short_circuit_customization:
    function: CHECK_IS_FIRST_BUSINESS_DAY_OF_MONTH
    execution_date: "{{ macros.ds_add(ds, 1) }}"
cluster:
  type: databricks_13_3_med_general_photon_cluster
