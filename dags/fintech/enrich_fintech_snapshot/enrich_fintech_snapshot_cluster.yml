cluster:
  type: consolidation_l_general_cluster
  databricks_conn_id: databricks_new_env
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
    aws_attributes:
      ebs_volume_size: 200
    spark_version: 13.3.x-scala2.12
    num_workers: 3
    runtime_engine: PHOTON
    node_type_id: m7gd.4xlarge
    driver_node_type_id: m7g.2xlarge
validation:
  cluster:
    type: emr_7_12_consolidation_l_general_fleet_cluster
    custom_configurations:
      core_nodes:
        target_on_demand: 2
        target_spot: 0
        instance_types:
        - m6gd.4xlarge
      task_nodes:
        instance_types:
        - m6gd.4xlarge
        target_on_demand: 0
        target_spot: 1
        allocation_strategy: price-capacity-optimized
        bid_price_percentage: 100
      aws_attributes:
        ebs_volume_size: 200
