---
database_name: datalake_recupera_clean
table_name: complementary_records
description: |
  "This table contains all the customer's active debts.
  When paid in installments, the debt will be written down when the installment is settled (liquidado)
  or canceled (in the event that, with the amortization of the amount paid, this installment has been paid).

  Original table name: TBL_REGISTROS_COMPLEMENTOS"
owner: bianca.martins@quintoandar.com.br
domain: fintech
columns:
  id_creditor:
    description: "Creditor code. It is the PK (Primary Key) of the table."
    categories:
      "1": QuintoAndar
      "3": QuintoCred, faturas da plataforma 2.0
      "5": QuintoCred, faturas da plataforma 3.0
    lineage:
      - datalake_recupera_raw.complementary_records.id_creditor
  id_customer:
    description: "Customer Identifier Code. It is the PK (Primary Key) of the table."
    lineage:
      - datalake_recupera_raw.complementary_records.id_customer
  id_product:
    description: "Product code. It is the PK (Primary Key) of the table."
    lineage:
      - datalake_recupera_raw.complementary_records.id_product
  bank_branch_code:
    description: "Bank branch code - completed with the sent in the load"
    lineage:
      - datalake_recupera_raw.complementary_records.bank_branch_code
  bank_account_number:
    description: "Bank account number - filled with sent in the load"
    lineage:
      - datalake_recupera_raw.complementary_records.bank_account_number
  id_contract:
    description: "Contract Identifier Code. It is the PK (Primary Key) of the table."
    lineage:
      - datalake_recupera_raw.complementary_records.id_contract
  dt_contract_start:
    description: "Start date"
    lineage:
      - datalake_recupera_raw.complementary_records.dt_contract_start
  dt_debt_due_date:
    description: "Debt due date"
    lineage:
      - datalake_recupera_raw.complementary_records.dt_debt_due_date
  installment_number:
    description: "Installment number"
    lineage:
      - datalake_recupera_raw.complementary_records.installment_number
  dt_last_debt_correction:
    description: "Date of last debt correction"
    lineage:
      - datalake_recupera_raw.complementary_records.dt_last_debt_correction
  dt_paid:
    description: "Date of payment"
    lineage:
      - datalake_recupera_raw.complementary_records.dt_paid
  main_amount:
    description: "Main value - original debt value"
    lineage:
      - datalake_recupera_raw.complementary_records.main_amount
  corrected_amount:
    description: "Corrected Value – corrected value up to the date of the last correction"
    lineage:
      - datalake_recupera_raw.complementary_records.corrected_amount
  minimun_amount:
    description: "Minimum value - filled with the one sent in the load"
    lineage:
      - datalake_recupera_raw.complementary_records.minimun_amount
  amount_paid:
    description: "Amount paid"
    lineage:
      - datalake_recupera_raw.complementary_records.amount_paid
  payment_option:
    description: "No caso de opção de pagamento, vem aqui o número da opção"
    lineage:
      - datalake_recupera_raw.complementary_records.payment_option
  installments_amount:
    description: "Number of installments of the contract (plan)"
    lineage:
      - datalake_recupera_raw.complementary_records.installments_amount
  ts_last_debt_update:
    description: "Date of the last debt update - whenever the installment is sent in the load this field is updated"
    lineage:
      - datalake_recupera_raw.complementary_records.ts_last_debt_update
  type_pendency_debt:
    description: "Indicates the type of pending this debt. When the installment or deposit is canceled, the flag returns to null"
    lineage:
      - datalake_recupera_raw.complementary_records.type_pendency_debt
  installment_code:
    description: "Installment code: quando houver parcelamento em andamento o código do parcelamento ficará neste campo (ao mesmo tempo que o type_pendency_debt fica 'PA'). Com o cancelamento do acordo este campo volta a ser nulo"
    lineage:
      - datalake_recupera_raw.complementary_records.installment_code
  id_installment:
    description: "Installment unique id. It is the PK (Primary Key) of the table."
    lineage:
      - datalake_recupera_raw.complementary_records.id_installment
