---
database_name: datalake_recupera_clean
table_name: email_records
description: |
  "Tables with customer emails.
  The table is loaded by customer load and it can also be updated via telecharging.
  Email types can be registered, however those inserted by the load are automatically registered by the system (TBL_TIPOS_EMAIL).

  Original table name: TBL_REGISTROS_EMAIL.
  Get the original fields names at [Recupera - Mapeamento de tabelas e campos - Original x Datalake](https://docs.google.com/spreadsheets/d/1yaqkdlfQPrQhW30L46miKKcLD99T4OV6svHJHXIYA6Q/edit?usp=sharing)"
owner: juliana.hocihara@quintoandar.com.br
domain: Fintech
columns:
  id_creditor:
    description: "Creditor code. It is the PK (Primary Key) and FK (Foreign Key) of the table."
    categories:
      "1": IQ QuintoAndar. Status - valid
      "2": PP QuintoAndar. Status - discontinued
      "3": IQ QuintoCred 2.0. Status - valid
      "4": IQ QuintoAndar. Status - discontinued
      "5": QuintoCred 3.0. Status - valid
      "6": PP QuintoAndar. Status - discontinued (test API)
      "7": IQ QuintoAndar. Status - discontinued (test API)
      "8": IQ QuintoAndar. Status - discontinued (test API)
      "9": IQ QuintoAndar. Status - discontinued (test API)
    lineage:
      - datalake_recupera_raw.email_records.id_creditor
  id_customer:
    description: "Customer Identifier Code. It is the PK (Primary Key) and FK (Foreign Key) of the table."
    lineage:
      - datalake_recupera_raw.email_records.id_customer
  customer_email:
    description: "Email. It is the PK (Primary Key) of the table."
    lineage:
      - datalake_recupera_raw.email_records.customer_email
  type:
    description: "Category label of the customer email address in Recupera CRM."
    lineage:
      - datalake_recupera_raw.email_records.type
  is_preferred_email:
    description: "Indicates whether this email is marked as preferred for the customer."
    lineage:
      - datalake_recupera_raw.email_records.is_preferred_email
  is_email_inactive:
    description: "Indicates whether the customer email is marked inactive in Recupera."
    categories:
      S: "Inactive"
      Nulo: "Active"
    lineage:
      - datalake_recupera_raw.email_records.is_email_inactive
  customer_name:
    description: "Customer name in preferred email"
    lineage:
      - datalake_recupera_raw.email_records.customer_name
  ts_load:
    description: Timestamp when the row was materialized into the governance lake by the ETL pipeline.
    lineage: []
