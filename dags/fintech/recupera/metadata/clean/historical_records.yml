---
database_name: datalake_recupera_clean
table_name: historical_records
description: |
  "This table contains the occurrences made.
  They can be system occurrences (automatically inserted by
  the automatic execution programs, as can be the occurrences inserted
  by the operators directly in the telecobrança.

  Original table name: TBL_REGISTROS_HISTORICOS"
owner: bianca.martins@quintoandar.com.br
domain: fintech
columns:
  id_creditor:
    description: "Creditor code. It is the PK (Primary Key) and FK (Foreign Key) of the table."
    categories:
      "1": QuintoAndar
      "3": QuintoCred, faturas da plataforma 2.0
      "5": QuintoCred, faturas da plataforma 3.0
    lineage:
      - datalake_recupera_raw.historical_records.id_creditor
  id_customer:
    description: "Customer Identifier Code. It is the PK (Primary Key) and FK (Foreign Key) of the table."
    lineage:
      - datalake_recupera_raw.historical_records.id_customer
  ts_occurrence:
    description: "Date of occurrence. It is the PK (Primary Key) of the table."
    lineage:
      - datalake_recupera_raw.historical_records.ts_occurrence
  historical_code:
    description: "Occurence. Get the description of all values at https://drive.google.com/drive/folders/1mXSEjDl7Sc-fkQC9GANJlGsmy2-VRy3w?usp=drive_link"
    lineage:
      - datalake_recupera_raw.historical_records.historical_code
  situation_occurrence:
    description: "Occurrence status – to which the occurrence is associated, if any. Field id_historical_situation table 'historical' "
    lineage:
      - datalake_recupera_raw.historical_records.situation_occurrence
  operator_name:
    description: "Operator code that made the occurrence - in the case of automatic occurrences the code is system"
    lineage:
      - datalake_recupera_raw.historical_records.operator_name
  monitorable_occurence:
    description: "Monitorable occurrences - appear in the monitor module"
    lineage:
      - datalake_recupera_raw.historical_records.monitorable_occurence
  occurence_description:
    description: "Description in the occurrence"
    lineage:
      - datalake_recupera_raw.historical_records.occurence_description
  ts_call_start:
    description: "Beginning of the phone call. for autodial operations only"
    lineage:
      - datalake_recupera_raw.historical_records.ts_call_start
  ts_call_end:
    description: "End of the phone call. for autodial operations only"
    lineage:
      - datalake_recupera_raw.historical_records.ts_call_end
