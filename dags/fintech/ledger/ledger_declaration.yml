dag:
  name: ledger
  schedule_start_date: 2025, 9, 17
  schedule_interval: 0 12 * * *
  owner: Data Fintech
  documentation:
    dag_purpose: |
      This DAG load tables from Ledger, the service that register all financial transactions.
workflow:
  type: cdc
  layer: raw
  database_type: postgres
  source_schema: public
  dbutils_secret_key: LEDGER_DB
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, 1), 'load_end_date') }}"
  lineage_product_database_name: ledger
  tables_customization:
    account:
      clean_table_name: account
      transactional_datatype_overrides:
        balance: decimal(38,20)
    entry:
      clean_table_name: entry
      transactional_datatype_overrides:
        amount: decimal(38,20)
    transaction: {}
    message: {}
    idempotency_record:
      raw_primary_keys: [key]
      clean_primary_keys: [key]
      clean_table_name: idempotency_record
      merge_on: [key]
cluster:
  type: databricks_13_3_med_general_cluster