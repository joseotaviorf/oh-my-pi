database_name: datalake_ledger_clean
table_name: account
owner: guilherme.sacramento@quintoandar.com.br
domain: Fintech
description: |
  Ledger chart-of-accounts entry in the QuintoAndar Ledger service. Each account has a
  hierarchical name tree, currency, optional balance tracking, and overdraft rules used
  to record double-entry financial movements across Fintech products.
columns:
  id_account:
    description: UUID (v7) primary key identifying the ledger account.
    lineage:
      - datalake_ledger_raw.account.id
  name:
    description: Human-readable account name in the ledger chart of accounts.
    lineage:
      - datalake_ledger_raw.account.name
  name_tree:
    description: Account path in ltree format enabling hierarchical searches across nested ledger accounts.
    lineage:
      - datalake_ledger_raw.account.name_tree
  type:
    description: Ledger account type enum defining whether the account is asset, liability, revenue, or expense.
    lineage:
      - datalake_ledger_raw.account.type
  currency:
    description: Currency in which the account balance is denominated (currency_type enum).
    lineage:
      - datalake_ledger_raw.account.currency
  track_balance:
    description: When true, the account balance is updated on every transaction; when false, balance updates are skipped for performance on high-volume internal accounts.
    lineage:
      - datalake_ledger_raw.account.track_balance
  balance:
    description: Current account balance stored as NUMERIC(40,10) when balance tracking is enabled.
    lineage:
      - datalake_ledger_raw.account.balance
  allows_overdraft:
    description: When true, the account may hold a negative balance up to configured overdraft limits.
    lineage:
      - datalake_ledger_raw.account.allows_overdraft
  metadata:
    description: JSONB payload with additional account configuration and integration metadata.
    lineage:
      - datalake_ledger_raw.account.metadata
  ts_created:
    description: Timestamp when the ledger account was created in the Ledger service.
    lineage:
      - datalake_ledger_raw.account.created_at
  ts_updated:
    description: Timestamp of the most recent update to the ledger account record.
    lineage:
      - datalake_ledger_raw.account.updated_at
