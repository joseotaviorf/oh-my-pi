database_name: datalake_ledger_clean
table_name: account
domain: Fintech
description: Data from the account table containing account information and balance details
columns:
  id_account:
    description: id column stores the unique identifier of the account using UUID (V7) format
    lineage:
      - datalake_ledger_raw.account.id
  name:
    description: id column stores the unique identifier of the account using UUID (V7) format
    lineage:
      - datalake_ledger_raw.account.name
  name_tree:
    description: name_tree column stores the name of the account in ltree format, which allows the creation of a hierarchical structure. It should be used for complex searching
    lineage:
      - datalake_ledger_raw.account.name_tree
  type:
    description: name_tree column stores the name of the account in ltree format, which allows the creation of a hierarchical structure. It should be used for complex searching
    lineage:
      - datalake_ledger_raw.account.type
  currency:
    description: currency column stores the currency of the account using currency_type enum
    lineage:
      - datalake_ledger_raw.account.currency
  track_balance:
    description: track_balance column stores whether the account should track its balance or not. When false, the account will not update its balance after every new transaction. It is a performance enhancer to avoid locks on frequently used accounts that we do not need to track the balance. For internal (engineering team) use only
    lineage:
      - datalake_ledger_raw.account.track_balance
  balance:
    description: balance column stores the current balance of the account, it is a NUMERIC(40, 10)
    lineage:
      - datalake_ledger_raw.account.balance
  allows_overdraft:
    description: allows_overdraft column stores whether the account allows overdraft or not, if it is true, the account can have a negative balance
    lineage:
      - datalake_ledger_raw.account.allows_overdraft
  metadata:
    description: metadata column stores additional information about the account in JSONB format
    lineage:
      - datalake_ledger_raw.account.metadata
  ts_created:
    description: column stores the date and time when the account was created
    lineage:
      - datalake_ledger_raw.account.created_at
  ts_updated:
    description: column stores the date and time when the account was last updated
    lineage:
      - datalake_ledger_raw.account.updated_at
