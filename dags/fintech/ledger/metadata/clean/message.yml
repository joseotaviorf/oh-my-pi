database_name: datalake_ledger_clean
table_name: message
owner: guilherme.sacramento@quintoandar.com.br
domain: Fintech
description: |
  Outbox messages produced by the QuintoAndar Ledger after transactions are committed,
  queued for asynchronous publishing to downstream consumers (Kafka topics or webhooks).
columns:
  id_message:
    description: UUID primary key of the outbox message in the Ledger service.
    lineage:
      - datalake_ledger_raw.message.id
  id_incremental:
    description: Monotonic incremental identifier used to order message delivery within a partition.
    lineage:
      - datalake_ledger_raw.message.incremental_id
  destination:
    description: Target topic or endpoint where the ledger event should be published.
    lineage:
      - datalake_ledger_raw.message.destination
  headers:
    description: Message headers propagated to the downstream consumer (content-type, trace IDs, etc.).
    lineage:
      - datalake_ledger_raw.message.headers
  payload:
    description: Serialized ledger event body published to the destination consumer.
    lineage:
      - datalake_ledger_raw.message.payload
  published:
    description: Flag indicating whether the outbox relay successfully published the message.
    lineage:
      - datalake_ledger_raw.message.published
  message_partition:
    description: Kafka partition (or shard) assigned to the message for ordered delivery.
    lineage:
      - datalake_ledger_raw.message.message_partition
  creation_time:
    description: Epoch timestamp when the message was enqueued in the ledger outbox.
    lineage:
      - datalake_ledger_raw.message.creation_time
  ts_creation_datetime:
    description: Datetime when the outbox message was created, derived from creation_time.
    lineage:
      - datalake_ledger_raw.message.creation_datetime
