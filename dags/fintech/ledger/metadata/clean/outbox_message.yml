database_name: datalake_ledger_clean
table_name: outbox_message
domain: Fintech
description: Data from the outbox_message table containing outbox message details and event information
columns:
  id_outbox_message:
    description: id column stores the unique identifier of the message using UUID (V7) format
    lineage:
      - datalake_ledger_raw.outbox_message.id
  id_aggregate:
    description: aggregate_id column stores the unique identifier of the aggregate that generated the message, eg. 12345678-1234-1234-1234-123456789012
    lineage:
      - datalake_ledger_raw.outbox_message.aggregate_id
  partition_key:
    description: partition_key column stores the partition key of the message, this is used to route the message to the correct partition in the message broker
    lineage:
      - datalake_ledger_raw.outbox_message.partition_key
  aggregate_type:
    description: aggregate_type column stores the type of the aggregate that generated the message, eg. account, transaction
    lineage:
      - datalake_ledger_raw.outbox_message.aggregate_type
  event_type:
    description: event_type column stores the type of the message, eg. account_created, transaction_created
    lineage:
      - datalake_ledger_raw.outbox_message.event_type
  payload:
    description: payload column stores the payload of the message, this is the data that will be sent to the message broker
    lineage:
      - datalake_ledger_raw.outbox_message.payload
  tracing_span_context:
    description: tracing_span_context column stores the tracing span context of the message, this is used for tracing the operation across the systems including Debezium
    lineage:
      - datalake_ledger_raw.outbox_message.tracing_span_context
  created_at_unix:
    description: column stores the timestamp of the message in milliseconds since epoch and it is used by debezium as event timestamp
    lineage:
      - datalake_ledger_raw.outbox_message.created_at_unix
  ts_created_at:
    description: created_at column stores the timestamp of the message using the postgres timestamp type
    lineage:
      - datalake_ledger_raw.outbox_message.created_at
