database_name: datalake_ledger_clean
table_name: entry
owner: guilherme.sacramento@quintoandar.com.br
domain: Fintech
description: |
  Debit or credit line within a ledger transaction, linking a monetary amount to a named
  account in the QuintoAndar Ledger. Each transaction contains one or more entries that
  must balance to zero across accounts.
columns:
  id_entry:
    description: Integer identifier of the entry within its parent ledger transaction.
    lineage:
      - datalake_ledger_raw.entry.id
  id_transaction:
    description: UUID (v7) of the parent ledger transaction grouping this entry with others.
    lineage:
      - datalake_ledger_raw.entry.transaction_id
  account_name:
    description: Name of the ledger account affected by this entry; foreign key to the account table.
    lineage:
      - datalake_ledger_raw.entry.account_name
  amount:
    description: Monetary amount of the entry stored as NUMERIC(40,10) in the account currency.
    lineage:
      - datalake_ledger_raw.entry.amount
  type:
    description: Entry direction/type enum (debit or credit) within the double-entry movement.
    lineage:
      - datalake_ledger_raw.entry.type
  metadata:
    description: JSONB payload with additional context about the entry (source system, references, tags).
    lineage:
      - datalake_ledger_raw.entry.metadata
