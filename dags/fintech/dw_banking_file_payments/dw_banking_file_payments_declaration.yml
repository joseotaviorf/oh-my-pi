dag:
  name: dw_banking_file_payments
  schedule_start_date: 2020,08,29
  owner: Data Fintech
workflow:
  type: query_delta
  layer: dw
  custom_schema: payment
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: r5d.2xlarge
    node_type_id: r5d.4xlarge
    num_workers: 3
    spark_version: 16.4.x-scala2.12
    aws_attributes:
      ebs_volume_size: 200
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: "quintoandar_{{ var.value.environment }}"
  databricks_conn_id: databricks_new_env
