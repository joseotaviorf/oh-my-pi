database_name: dw_payment
table_name: fact_banking_file_payments
description: Fact table that gathers the information from the bank van (van bancária).
  System that makes two-way communication between 5A and bank
domain: Fintech
owner: ae-finance-fintech@quintoandar.com.br
columns:
  sk_banking_file_payment:
    lineage:
    - datalake_vans_clean.boleto.id
    - datalake_vans_clean.payment.id
    - datalake_vans_clean.payment_boleto.id
    - datalake_vans_clean.boleto.company_use
    - datalake_vans_clean.payment.company_use
    - datalake_vans_clean.payment_boleto.company_use
    description: Banking file payment id from three transaction types recorded in
      Vans DB
  sk_invoice:
    lineage:
    - datalake_vans_clean.boleto.id_related_document
    - datalake_vans_clean.payment.id_related_document
    - datalake_vans_clean.payment_boleto.id_related_document
    description: ''
  sk_payment_request:
    lineage:
    - datalake_vans_clean.boleto.id_related_document
    - datalake_vans_clean.payment.id_related_document
    - datalake_vans_clean.payment_boleto.id_related_document
    description: Payment request id related to the baking file payment, when the related
      document is from type payment request
  sk_contract:
    lineage:
    - datalake_vans_clean.boleto.company_use
    - datalake_vans_clean.payment.company_use
    - datalake_vans_clean.payment_boleto.company_use
    description: ''
  sk_company_use:
    lineage:
    - datalake_vans_clean.boleto.company_use
    - datalake_vans_clean.payment.company_use
    - datalake_vans_clean.payment_boleto.company_use
    description: Company use name registered in the banking file payment as an internal
      billet identifier
  sk_occurrence_code:
    lineage:
    - datalake_vans_clean.boleto.occurrence_code
    - datalake_vans_clean.payment.occurrence_code
    - datalake_vans_clean.payment_boleto.occurrence_code
    description: Return code defined and provided by the bank involved in transation
      to classify the paid status and its errors
  sk_charge_payer_user:
    lineage:
    - datalake_vans_clean.boleto.payer_document
    description: Payer personal id (CPF) registered for charging transactions only,
      in anonymized format
  sk_transfer_payee_user:
    lineage:
    - datalake_vans_clean.payment.payee_document
    description: Payee personal id (CPF) registered for transfer transactions only,
      in anonymized format
  sk_account_payable_corporate_user:
    lineage:
    - datalake_vans_clean.payment_boleto.payee_name
    description: Payee corporate name registered for accounts payable only, in anonymized
      format
  is_payee_savings_acc:
    lineage:
    - datalake_vans_clean.payment.has_payee_savings_acc
    description: ''
  sk_created_date:
    lineage:
    - datalake_vans_clean.boleto.ts_created
    - datalake_vans_clean.payment.ts_created
    - datalake_vans_clean.payment_boleto.ts_created
    description: ''
  sk_issued_date:
    lineage:
    - datalake_vans_clean.boleto.ts_issued
    - datalake_vans_clean.payment.ts_issued
    description: ''
  sk_updated_date:
    lineage:
    - datalake_vans_clean.boleto.ts_updated
    - datalake_vans_clean.payment.ts_updated
    - datalake_vans_clean.payment_boleto.ts_updated
    description: ''
  sk_due_date:
    lineage:
    - datalake_vans_clean.boleto.dt_due
    - datalake_vans_clean.payment.dt_dued
    description: ''
  sk_fine_due_date:
    lineage:
    - datalake_vans_clean.boleto.dt_fine_due
    description: ''
  sk_paid_date:
    lineage:
    - datalake_vans_clean.boleto.dt_paid
    - datalake_vans_clean.payment.dt_paid
    - datalake_vans_clean.payment_boleto.dt_paid
    description: ''
  brl_due_amount:
    lineage:
    - datalake_vans_clean.boleto.due_amount
    - datalake_vans_clean.payment.due_amount
    description: ''
  brl_paid_amount:
    lineage:
    - datalake_vans_clean.boleto.paid_amount
    - datalake_vans_clean.payment.paid_amount
    - datalake_vans_clean.payment_boleto.paid_amount
    description: ''
  brl_fine_amount:
    lineage:
    - datalake_vans_clean.boleto.fine_amount
    description: ''
  brl_one_day_interest:
    lineage:
    - datalake_vans_clean.boleto.one_day_interest
    description: ''
  brl_charged_interest:
    lineage:
    - datalake_vans_clean.boleto.interest
    description: ''
  ts_load:
    description: ''
