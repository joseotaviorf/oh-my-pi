---
dag:
  name: paschoalotto_report
  schedule_start_date: 2024, 8, 27
  schedule_interval: 15 11 * * *
  owner: Data Fintech
  documentation:
    dag_purpose: |
      Ingestion of Paschoalotto reports.
      The data will be used in the Collection Recovery analysis.
      Tribe: Portfolio Management.
      In case we don't find any files, an alert will be sent to the Google Chat channel: Fintech Data Quality Alerts with the missing tables.
workflow:
  layer: raw
  type: custom_ingestion
  custom_schema: paschoalotto
  load_spark_job: load_paschoalotto_report_raw
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, ds, 'load_end_date') }}"
  spark_job_arguments:
    - "{environment}"
    - "{bucket}"
    - "{schema}"
    - 5a-paschoalotto
    - parquet
    - "{table_name}"
    - "{load_start_date}"
    - "{load_end_date}"
    - "{extraction_type}"
    - "{partitions}"
  tables_customization:
    tb_arquivo_ret:
      clean_table_name: collection_actions
      extraction_type: incremental
      partitions: ["year", "month", "day"]
    tb_arquivo_tempos:
      clean_table_name: operator_logged_duration
      extraction_type: incremental
      partitions: ["year", "month", "day"]
cluster:
  type: custom_cluster
  custom_configurations:
    autotermination_minutes: 20
    driver_node_type_id: m5a.2xlarge
    node_type_id: m5a.xlarge
    num_workers: 3
    spark_version: 13.3.x-scala2.12
    aws_attributes:
      first_on_demand: 1
      spot_bid_price_percent: 100
      zone_id: us-east-1d
      ebs_volume_size: 200
      availability: SPOT_WITH_FALLBACK
