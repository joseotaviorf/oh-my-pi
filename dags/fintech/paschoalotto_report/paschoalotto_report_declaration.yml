dag:
  name: paschoalotto_report
  schedule_start_date: 2024, 8, 27
  schedule_interval: 15 11 * * *
  owner: Data Fintech
  documentation:
    dag_purpose: |
      Ingestion of Paschoalotto reports.
      The data will be used in the Collection Recovery analysis.
      Tribe: Portfolio Management.
      In case we don't find any files, an alert will be sent to the Google Chat channel: Fintech Data Quality Alerts with the missing tables.
workflow:
  layer: raw
  type: custom_ingestion
  custom_schema: paschoalotto
  load_spark_job: load_paschoalotto_report_raw
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  spark_job_arguments:
  - "{environment}"
  - "{bucket}"
  - "{schema}"
  - 5a-paschoalotto
  - parquet
  - "{table_name}"
  - "{load_start_date}"
  - "{load_end_date}"
  - "{extraction_type}"
  - "{partitions}"
  tables_customization:
    tb_arquivo_ret:
      clean_table_name: collection_actions
      extraction_type: incremental
      partitions: ["year", "month", "day"]
    tb_arquivo_tempos:
      clean_table_name: operator_logged_duration
      extraction_type: incremental
      partitions: ["year", "month", "day"]
cluster:
  type: databricks_13_3_med_general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
