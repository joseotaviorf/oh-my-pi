dag:
  name: sap_gateway_homolog
  schedule_start_date: 2020,10,1
  owner: Data Fintech
  documentation:
    dag_purpose: |
      This DAG creates the raw and clean layer to import data from SAP Gateway. SAP Gateway is an structure used to connect devices, environments, and platforms to SAP systems.
workflow:
  type: cdc
  layer: raw
  database_type: postgres
  source_schema: public
  custom_schema: sap_gateway_homolog
  source_database: sapgateway
  dbutils_secret_key: SAP_GATEWAY_DB
  tables_customization:
    account: {}
    address: {}
    business_partner: {}
    card_code: {}
    consolidated_invoice: {}
    consolidated_journal_entry_lines: {}
    consolidated_journal_entry: {}
    feature: {}
    invoice: {}
    journal_entry_lines: {}
    journal_entry: {}
    operation: {}
    person: {}
    rule_account_type: {}
    rule_modifier: {}
    rule: {}
    sync_sap_job: {}
    webhook_log: {}
cluster:
  type: databricks_13_3_med_general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
