---
database_name: datalake_vans_clean
table_name: bank_payment_requested_by
owner: juliana.hocihara@quintoandar.com.br
domain: Fintech
description: |
  Routing rules that bind QuintoAndar upstream systems to Vans bank payment accounts.
  Defines which requesting service and payment method may use each bank account, including
  fallback routing when the primary account is unavailable.
columns:
  id:
    description: Primary key of the bank payment routing rule in Vans.
    lineage:
      - datalake_vans_raw.bankpaymentrequestedby.id
  id_bank_payment:
    description: Foreign key to the Vans bank payment account authorized for this requester.
    lineage:
      - datalake_vans_raw.bankpaymentrequestedby.bank_payment_id
  id_payment_method:
    description: Foreign key to the payment method (e.g. TED, DOC) allowed for this routing rule.
    lineage:
      - datalake_vans_raw.bankpaymentrequestedby.payment_method_id
  requested_by:
    description: Upstream QuintoAndar system or product code that initiates payments through Vans.
    lineage:
      - datalake_vans_raw.bankpaymentrequestedby.requested_by
  is_active:
    description: When true, this routing rule is currently enabled for payment requests.
    lineage:
      - datalake_vans_raw.bankpaymentrequestedby.active
  is_fallback:
    description: When true, this rule is used as secondary routing when the primary bank account fails.
    lineage:
      - datalake_vans_raw.bankpaymentrequestedby.fallback
