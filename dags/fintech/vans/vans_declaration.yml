---
dag:
  name: vans
  schedule_interval: 0 8 * * *
  owner: Data Fintech
  documentation:
    dag_purpose: This DAG creates the full tables for Vans, the integration with VAN service, responsible for the exchange with financial agents.
workflow:
  type: database_pull
  layer: raw
  database_type: postgres
  custom_schema: vans
  dbutils_secret_key: VANS_DB
  tables_customization:
        bank: {}
        bankboleto:
          clean_table_name: bank_boleto
        bankboletorequestedby:
          clean_table_name: bank_boleto_requested_by
        bankpayment:
          clean_table_name: bank_payment
        bankpaymentrequestedby:
          clean_table_name: bank_payment_requested_by
        boleto: {}
        boleto_file: {}
        boletoournumbercounter:
          clean_table_name: boleto_our_number_counter
        file: {}
        file_payment: {}
        file_paymentboleto:
          clean_table_name: file_payment_boleto
        payment: {}
        paymentboleto:
          clean_table_name: payment_boleto

cluster:
  type: databricks_12_2_med_memory_cluster
