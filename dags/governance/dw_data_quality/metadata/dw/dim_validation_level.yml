database_name: dw_data_quality
table_name: dim_validation_level
description: >
  Dimension of Inmetro data-quality validation scope derived from distinct
  validation_level, database, table, and column tuples in datalake_data_quality.validations.
  Each row identifies where a rule applies — at table level or on a specific column.
  Loaded incrementally by dw_data_quality; surrogate key is generated on insert.
domain: Cross
owner: bruna.prates@quintoandar.com.br
columns:
  validation_level:
    description: Scope of the Inmetro validation rule — whether checks apply to the whole table or to an individual column.
    categories:
      table: Validation is applied at table level.
      column: Validation is applied at column level.
    lineage:
      - datalake_data_quality.validations.validation_level
  database:
    description: Hive schema name of the bietlejuice table where the validation rule is configured.
    lineage:
      - datalake_data_quality.validations.database
  table:
    description: Table name within the database where the validation rule is applied.
    lineage:
      - datalake_data_quality.validations.table
  column:
    description: Name of the table column. It's 'N/A' for table validation level.
    lineage:
      - datalake_data_quality.validations.column
