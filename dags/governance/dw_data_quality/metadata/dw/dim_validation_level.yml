database_name: dw_data_quality
table_name: dim_validation_level
description: This dimension table has the level of the data quality validation and its schema, i.e., which table or column it's applied to.
  Each line is the unique schema of the validation level applied, identified by the sk_validation_level.
domain: Cross
owner: bruna.prates@quintoandar.com.br
columns:
  sk_validation_level:
    description: Primary key of the table, uniquely identifying a validation level schema. It's generated by Spark while data is being inserted.
  validation_level:
    description: The level of validation.
    categories:
      table: Validation is applied at table level.
      column: Validation is applied at column level.
    lineage:
      - datalake_data_quality.validations.validation_level
  database:
    description: Name of the database.
    lineage:
      - datalake_data_quality.validations.database
  table:
    description: Name of the table.
    lineage:
      - datalake_data_quality.validations.table
  column:
    description: Name of the table column. It's 'N/A' for table validation level.
    lineage:
      - datalake_data_quality.validations.column
