database_name: dw_data_quality
table_name: dim_validation_type
description: This dimension table has the type of data quality validations applied by Inmetro.
  Each line is an unique type of validation, identified by the sk_validation_type.
domain: Cross
owner: bruna.prates@quintoandar.com.br
columns:
  sk_validation_type:
    description: Primary key of the table, uniquely identifying a validation type. It's generated by Spark while data is being inserted.
  validation_type:
    description: Type of validation applied.
    lineage:
      - datalake_data_quality.validations.validation_type
