database_name: datalake_anonymization_validation
table_name: manual_validation
owner: vitor.carneiro@quintoandar.com.br
domain: Data Ops & Governance
description: >
  Enriched manual PII classification decisions maintained in the anonymization governance
  Google Sheet and loaded from datalake_gsheets_clean. Each row validates whether a lake
  column contains personal data and, when applicable, records RAE exception metadata.
  Grain is one row per id_entity (database.table.column) per ingestion. Partitioned by
  year, month, day derived from ts_ingested.
columns:
  id_entity:
    lineage:
      - datalake_gsheets_clean.anonymization_manual_validation.id_entity
    description: Composite key built from database_name, table_name, and column_name for the evaluated field.
  manual_eval:
    lineage:
      - datalake_gsheets_clean.anonymization_manual_validation.manual_eval
    description: Human-assigned PII category used to drive anonymization rules for the column.
    categories:
      "Telefone": PII data, indicate the column is a telefone number.
      "Email": PII data, indicate the column is an user email.
      "Endereço/CEP": PII data, indicate the column is an user address.
      "Nome": PII data, indicate the column is an user name.
      "CPF/RG/CNPJ": PII data, indicate the column is an brazilian document.
      "Other": PII data, indicate the column have a pii data but not classified yet.
      "Entidade de classe": PII data, indicate the column is and job class, like creci.
      "Dados bancários": PII data, indicate colunns have bank information.
      "RAE": PII data, RAE is Record of Anonymization Exceptions, indicate the column is an exception and must be desnonymizate.
      "N/A": Indicate the column is not a PII data.
  requester:
    lineage:
      - datalake_gsheets_clean.anonymization_manual_validation.requester
    description: Email of the person who requested a Record of Anonymization Exception for this column.
  aproved_by:
    lineage:
      - datalake_gsheets_clean.anonymization_manual_validation.aproved_by
    description: Email of the governance reviewer who approved the manual PII classification or RAE exception.
  justification:
    lineage:
      - datalake_gsheets_clean.anonymization_manual_validation.justification
    description: Business rationale explaining why the column is exempt from standard anonymization rules.
  ts_ingested:
    lineage:
      - datalake_gsheets_clean.anonymization_manual_validation.ts_ingested
    description: Timestamp when the manual evaluation row was ingested from the Google Sheet source.
  year:
    lineage:
      - datalake_gsheets_clean.anonymization_manual_validation.ts_ingested
    description: Year of the load date, used for Hive partitioning — include in filters for partition pruning.
  month:
    lineage:
      - datalake_gsheets_clean.anonymization_manual_validation.ts_ingested
    description: Month of the load date, used for Hive partitioning — include in filters for partition pruning.
  day:
    lineage:
      - datalake_gsheets_clean.anonymization_manual_validation.ts_ingested
    description: Day of the load date, used for Hive partitioning — include in filters for partition pruning.
