---
database_name: transformation_hefesto_test_curated
table_name: spoc_offboarding_contracts
domain: Data Ops & Governance
owner: gustavo.alencar@quintoandar.com.br
description: |
  Throwaway pilot copy of datalake_hefesto.spoc_offboarding_contracts: one row per SPOC
  portfolio for an id_contract/id_termination pair (more than one analyst can share a
  pair, which yields a unique id_portfolio). Exists only to exercise the transformation
  curated grade; the query is byte-identical to production enrich so hop-1 can diff the
  two. Not a production dataset — consumers should read datalake_hefesto. Deleted at
  pilot teardown.
columns:
  id_portfolio:
    lineage:
      - datalake_hefesto_clean.worker_portfolio.id_portfolio
    description: Portfolio unique id for each analyst of id_termination and id_contract
  id_contract:
    lineage:
      - datalake_hefesto_clean.worker_portfolio_unit.origin_identifier
      - datalake_hefesto_clean.worker_portfolio.id_contract
    description: Identifier for the contract referenced by this record.
  id_termination:
    lineage:
      - datalake_hefesto_clean.worker_portfolio_unit.metadata
      - datalake_hefesto_clean.worker_portfolio.id_entity_origin
    description: Contract termination identification
  id_worker:
    lineage:
      - datalake_hefesto_clean.worker_portfolio.id_worker
    description: Hefesto identification for the analyst responsable for the portfolio
  id_worker_twilio:
    lineage:
      - datalake_hefesto_clean.worker.id_worker_twilio
    description: Twilio unique identifier for each analyst
  id_analyst:
    lineage:
      - datalake_support_users.analysts.email
    description: ID analyst identification based on email
  id_user:
    lineage:
      - datalake_hefesto_clean.worker_portfolio.id_user
    description: Contract user identification
  user_persona:
    lineage:
      - datalake_hefesto_clean.worker_portfolio_unit.user_persona
    description: The contract persona of the portfolio
      Can assume 'tenant' or 'owner'
  worker_email:
    lineage:
      - datalake_support_users.analysts.email
    description: Business value representing worker email on the spoc_offboarding_contracts enrich dataset.
  portfolio_status:
    lineage:
      - datalake_hefesto_clean.worker_portfolio_unit.status
    description: Business value representing portfolio status on the spoc_offboarding_contracts enrich dataset.
  analyst_organization:
    lineage:
      - datalake_support_users.analysts.organization
    description: Organization which tthe analyst works for
  entity_origin:
    lineage:
      - datalake_hefesto_clean.worker_portfolio.entity_origin
    description: Which contract process is the origin of the portfolio.
      The only value currently assumed is 'OFFBOARDING'
  ts_updated:
    lineage:
      - datalake_hefesto_clean.worker_portfolio_unit.ts_updated
    description: Timestamp from when the portfolio was updated
