dag:
  name: jira
  owner: Data Governance
  schedule_start_date: 2020, 6, 1
  schedule_interval: "0 0 * * *"
  documentation:
    dag_purpose: This DAG imports, via API extraction, the tables for Jira, our platform for managing project lifecycles.
workflow:
  type: custom_ingestion
  layer: raw
  load_spark_job: load_{extraction_type}_data_into_datalake_raw
  default_extraction_type: incremental
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  spark_job_arguments:
    - "{environment}" # env
    - "{bucket}" # datalake_bucket
    - "{dag_name}" # source
    - "{load_start_date}" # load_start_date
    - "{table_name}"
  tables_customization:
    projects:
      extraction_type: full
    issues:
      extraction_type: incremental
      partitions: ["year", "month", "day"]
cluster:
  type: custom_cluster
  custom_libraries:
    - whl: "{artifacts_bucket}/jira-api-client-python/quintoandar_jira_api_client-0.2.1-py2.py3-none-any.whl"
  custom_configurations:
    driver_node_type_id: r5d.4xlarge
    node_type_id: r5d.2xlarge
    num_workers: 3
    spark_version: 13.3.x-scala2.12
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
  databricks_conn_id: databricks_new
