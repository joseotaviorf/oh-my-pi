dag:
  name: jira
  owner: Data Governance
  schedule_start_date: 2020, 6, 1
  # Two runs/day. Each run re-fetches every issue updated yesterday or today,
  # regardless of project or status, so late status transitions are not missed.
  schedule_interval: "0 0,8 * * *"
  documentation:
    dag_purpose: This DAG imports Jira issues and projects through the Jira REST API for platform lifecycle tracking.
workflow:
  type: custom_ingestion
  layer: raw
  load_spark_job: load_{extraction_type}_data_into_datalake_raw
  default_extraction_type: incremental
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_end | ds, -1), 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_end | ds, 'load_end_date') }}"
  spark_job_arguments:
    - "{environment}" # env
    - "{bucket}" # datalake_bucket
    - "{dag_name}" # source
    - "{load_start_date}" # load_start_date
    - "{load_end_date}"
    - "{table_name}"
    - "{partitions}"
  tables_customization:
    projects:
      extraction_type: full
    issues:
      extraction_type: incremental
      partitions: ["year", "month", "day"]
      extra_spark_job_arguments:
        - endpoint_enum: ISSUE_JQL_SEARCH
          # jql_query_filter: 'project IN ("DEI")'
