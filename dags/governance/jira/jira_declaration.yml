dag:
  name: jira
  owner: Data Governance
  schedule_start_date: 2020, 6, 1
  schedule_interval: "0 0 * * *"
  documentation:
    dag_purpose: This DAG imports, via API extraction, the tables for Jira, our platform for managing project lifecycles.
workflow:
  type: custom_ingestion
  layer: raw
  load_spark_job: load_{extraction_type}_data_into_datalake_raw
  default_extraction_type: incremental
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  spark_job_arguments:
    - "{environment}" # env
    - "{bucket}" # datalake_bucket
    - "{dag_name}" # source
    - "{load_start_date}" # load_start_date
    - "{load_end_date}"
    - "{table_name}"
    - "{partitions}"
  tables_customization:
    projects:
      extraction_type: full
    issues:
      extraction_type: incremental
      partitions: ["year", "month", "day"]
      extra_spark_job_arguments:
        - endpoint_enum: ISSUE_JQL_SEARCH
          # PROVISIONAL: scope daily incremental extraction down to the PAY
          # project only, to control ingestion volume while the historical
          # reprocessing of other projects is planned/validated.
          # TODO: remove this line (restoring full ingestion) once that work
          # is done. Tracking: <link to ticket/PR here>.
          jql_query_filter: 'project IN ("PAY")'
