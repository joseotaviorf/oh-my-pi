database_name: datalake_jira_clean
table_name: projects
owner: luisa.ladeira@quintoandar.com.br
domain: Data Ops & Governance
description: >
  Full-refresh clean-layer snapshot of Jira projects extracted via the Jira REST API by the jira DAG
  (daily 00:00 UTC). Grain is one row per project id. Supports project inventory and engineering
  governance reporting.
columns:
  avatar_urls:
    lineage:
      - datalake_jira_raw.projects.avatarurls
    description: JSON map of avatar image URLs for the project at different display sizes.
  id_entity:
    lineage:
      - datalake_jira_raw.projects.entityid
    description: UUID entity identifier used by Jira to reference the project across systems.
  expand:
    lineage:
      - datalake_jira_raw.projects.expand
    description: Comma-separated list of Jira API expand parameters included in the project response payload.
  id:
    lineage:
      - datalake_jira_raw.projects.id
    description: Numeric internal identifier assigned to the project by Jira.
  is_private:
    lineage:
      - datalake_jira_raw.projects.isprivate
    description: Boolean flag indicating whether the project visibility is restricted to authorized users only.
  key:
    lineage:
      - datalake_jira_raw.projects.key
    description: Short uppercase project key used as prefix in issue keys (for example DEI or DATA).
  name:
    lineage:
      - datalake_jira_raw.projects.name
    description: Display name of the Jira project as shown in the UI.
  project_type_key:
    lineage:
      - datalake_jira_raw.projects.projecttypekey
    description: Jira project type classification key (for example software, business, or service_desk).
  properties:
    lineage:
      - datalake_jira_raw.projects.properties
    description: JSON object with additional project configuration properties returned by the Jira API.
  self:
    lineage:
      - datalake_jira_raw.projects.self
    description: REST API URL endpoint that uniquely identifies this project resource in Jira.
  is_simplified:
    lineage:
      - datalake_jira_raw.projects.simplified
    description: Boolean flag indicating whether the project uses Jira next-gen simplified workflow and board layout.
  style:
    lineage:
      - datalake_jira_raw.projects.style
    description: Jira project layout style (for example classic or next-gen) that determines board and workflow behavior.
  uuid:
    lineage:
      - datalake_jira_raw.projects.uuid
    description: Globally unique identifier for the project, stable across Jira instances and integrations.
