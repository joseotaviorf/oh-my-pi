---
database_name: datalake_dashboard_governance
table_name: dashboard_metadata
owner: vitor.carneiro@quintoandar.com.br
domain: Data Ops & Governance
description: >
  Daily snapshot of Metabase dashboard metadata enriched with collection path, owner email,
  view activity, and linked chart ids. Built from datalake_metabase_clean sources as of the
  load partition date. Grain is one row per dashboard id per load date. Partitioned by year,
  month, day.
columns:
  platform:
    description: BI platform identifier for the dashboard source (metabase).
  id_dashboard:
    lineage:
      - datalake_metabase_clean.report_dashboard.id
      - datalake_looker_clean.dashboards.id
    description: Stable identifier of the Metabase dashboard in the source BI platform.
  dashboard_path:
    lineage:
      - datalake_metabase_clean.collection.location
      - datalake_looker_clean.folders.path
    description: Human-readable collection path showing where the dashboard is organized in Metabase.
  title:
    lineage:
      - datalake_metabase_clean.report_dashboard.name
      - datalake_looker_clean.dashboards.title
    description: Human-readable dashboard title as shown to users in Metabase collections.
  description:
    lineage:
      - datalake_metabase_clean.report_dashboard.description
      - datalake_looker_clean.dashboards.description
    description: Free-text description authored in Metabase explaining the dashboard purpose and contents.
  views:
    lineage:
      - datalake_metabase_clean.view_log.id_model
    description: Cumulative count of view events recorded for the dashboard up to the load date.
  ownership:
    lineage:
      - datalake_metabase_clean.core_user.email
      - datalake_looker_clean.users.email
    description: Work email of the Metabase user who created or owns the dashboard record.
  domain:
    lineage:
      - datalake_metabase_clean.collection.name
      - datalake_metabase_clean.collection.location
    description: QuintoAndar business domain inferred from the dashboard collection path (null when not mapped).
  status:
    lineage:
      - datalake_metabase_clean.report_dashboard.is_archived
      - datalake_metabase_clean.view_log.ts_last_view
    description: Lifecycle status of the dashboard — ACTIVE when recently viewed and not archived, DEPRECATED otherwise.
  ids_charts:
    lineage:
      - datalake_metabase_clean.report_dashboard_card.id_card
      - datalake_looker_clean.dashboard_elements.id
    description: Array of Metabase question ids currently attached to the dashboard layout.
  last_view:
    lineage:
      - datalake_metabase_clean.view_log.ts_last_view
      - datalake_looker_clean.dashboards.last_accessed_at
    description: Timestamp of the most recent view event for the dashboard before the load date.
  dashboard_url:
    lineage:
      - datalake_metabase_clean.report_dashboard.id
      - datalake_looker_clean.dashboards.url
    description: Direct HTTPS link to open the dashboard in the QuintoAndar Metabase instance.
  dt_updated:
    lineage:
      - datalake_looker_clean.dashboards.year
      - datalake_looker_clean.dashboards.month
      - datalake_looker_clean.dashboards.day
    description: Reference date of the governance snapshot, equal to the DAG load partition date.
  year:
    lineage:
      - datalake_looker_clean.dashboards.year
    description: Year of the load date, used for Hive partitioning — include in filters for partition pruning.
  month:
    lineage:
      - datalake_looker_clean.dashboards.year
    description: Month of the load date, used for Hive partitioning — include in filters for partition pruning.
  day:
    lineage:
      - datalake_looker_clean.dashboards.year
    description: Day of the load date, used for Hive partitioning — include in filters for partition pruning.
