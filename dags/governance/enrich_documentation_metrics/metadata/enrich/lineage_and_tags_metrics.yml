---
database_name: datalake_documentation_metrics
table_name: lineage_and_tags_metrics
owner: vitor.carneiro@quintoandar.com.br
domain: Data Ops & Governance
description: >
  Enriched lineage and tag coverage metrics built from documentation_metrics clean tables
  (metastore inventory joined with bucket-sourced lineage_and_tags and dag_metadata signals).
  Rebuilt when enrich_documentation_metrics runs after the daily documentation_metrics ingest
  (05:00 UTC). Grain is one row per layer, database, and table per load date. Partitioned
  by year, month, day — filter on ingestion date for partition pruning.
columns:
  layer:
    description: Data lake layer of the table whose lineage and tag coverage is being measured.
    lineage:
      - datalake_documentation_metrics_clean.columns_metastore.layer
  database_name:
    description: Hive schema name of the table whose lineage and tag coverage row is reported.
    lineage:
      - datalake_documentation_metrics_clean.columns_metastore.database_name
  table_name:
    description: Table name within database_name for the lineage and tag coverage metrics row.
    lineage:
      - datalake_documentation_metrics_clean.columns_metastore.table_name
  has_lineage:
    description: Boolean flag indicating whether governance metadata declares upstream lineage for this table from lineage_and_tags or dag_metadata sources.
    lineage:
      - datalake_documentation_metrics_clean.dag_metadata.has_lineage
      - datalake_documentation_metrics_clean.lineage_and_tags.has_lineage
  has_tags:
    description: Boolean flag indicating whether governance metadata YAML declares classification tags on this table.
    lineage:
      - datalake_documentation_metrics_clean.lineage_and_tags.has_tags
  dt_ingested:
    description: Calendar date when the documentation metrics snapshot was loaded, derived from year, month, and day partitions.
    lineage:
      - datalake_documentation_metrics_clean.categories_documentation.year
      - datalake_documentation_metrics_clean.categories_documentation.month
      - datalake_documentation_metrics_clean.categories_documentation.day
  year:
    description: Year of the data load date, used for Hive partitioning — include in filters for partition pruning.
    lineage:
      - datalake_documentation_metrics_clean.columns_metastore.year
  month:
    description: Month of the data load date, used for Hive partitioning — include in filters for partition pruning.
    lineage:
      - datalake_documentation_metrics_clean.columns_metastore.month
  day:
    description: Day of the data load date, used for Hive partitioning — include in filters for partition pruning.
    lineage:
      - datalake_documentation_metrics_clean.columns_metastore.day
