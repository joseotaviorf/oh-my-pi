cluster:
  type: consolidation_xs_general_cluster
  databricks_conn_id: databricks_new
  custom_libraries:
  - pypi:
      package: acryl-datahub==1.3.1.7.post3
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
    num_workers: 3
    driver_node_type_id: r7g.large
validation:
  cluster:
    type: emr_7_12_consolidation_xs_general_fleet_cluster
    custom_configurations:
      task_nodes:
        instance_types:
        - m6g.xlarge
        - m7g.xlarge
        target_on_demand: 0
        target_spot: 1
        allocation_strategy: price-capacity-optimized
        bid_price_percentage: 100
      core_nodes:
        target_on_demand: 2
        target_spot: 0
        instance_types:
        - m6g.xlarge
        - m7g.xlarge
  allow_custom_spark_job: true
