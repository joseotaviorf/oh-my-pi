---
database_name: datalake_superset
table_name: lake_tables_usage
owner: isadora.gallerani@quintoandar.com.br
domain: Data Ops & Governance
description: >
  Incremental mapping of Superset datasets to datalake tables referenced in their SQL.
  Regex extraction over sql_code is validated against dag_inventory so only real lake
  tables are kept. Grain is one row per dataset id and lake table per load date; a dataset
  may appear on multiple rows. Partitioned by year, month, day.
columns:
  id_dataset:
    lineage:
      - datalake_superset_clean.tables.id
    description: Superset dataset identifier (called table in Superset UI), distinct from datalake table names.
  id_lake_table:
    lineage:
      - datalake_superset_clean.tables.sql_code
    description: Fully qualified datalake table reference parsed from the dataset SQL, formatted as schema.table.
  dataset_name:
    lineage:
      - datalake_superset_clean.tables.table_name
    description: Display name of the Superset dataset whose SQL references the mapped lake table.
  ts_created:
    lineage:
      - datalake_superset_clean.tables.ts_created
    description: Timestamp when the Superset dataset was originally created in the source system.
  ts_changed:
    lineage:
      - datalake_superset_clean.tables.ts_changed
    description: Timestamp of the most recent change to the Superset dataset definition or SQL.
  year:
    lineage:
      - datalake_superset_clean.tables.year
    description: Year of the load date, used for Hive partitioning — include in filters for partition pruning.
  month:
    lineage:
      - datalake_superset_clean.tables.month
    description: Month of the load date, used for Hive partitioning — include in filters for partition pruning.
  day:
    lineage:
      - datalake_superset_clean.tables.day
    description: Day of the load date, used for Hive partitioning — include in filters for partition pruning.
