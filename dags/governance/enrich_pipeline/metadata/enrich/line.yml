database_name: datalake_pipeline
table_name: line
owner: isadora.gallerani@quintoandar.com.br
domain: Cross
description: >
  Full-refresh enrich-layer dimension of bi-etl-ejuice Airflow DAG owner lines, built by
  enrich_pipeline from Airflow log events. Grain is one row per line, keyed by id_line. Each line
  is derived from the earliest DAG event for a normalized owner name. Supports pipeline ownership
  and SLA reporting.
columns:
  id_line:
    description: Surrogate key (MD5 hash) that uniquely identifies the DAG owner line across pipeline models.
  line_name:
    lineage:
      - datalake_airflow.dag.owners
    description: Human-readable name of the DAG owner line as declared in Airflow, with the airflow prefix removed.
  is_data_line:
    description: Boolean flag indicating whether the line belongs to a recognized Data area Analytics Engineering team.
  ts_line_first_event:
    lineage:
      - datalake_airflow.log.ts_event
    description: Timestamp of the earliest Airflow log event recorded for any DAG owned by this line.
