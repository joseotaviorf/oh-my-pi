---
database_name: datalake_pipeline
table_name: line
description: This dimension table has all the lines responsible for DAGs, identified by the id_line.
  In order to create the id_line, we looked for the first DAG event of each line.
domain: Cross
owner: isadora.gallerani@quintoandar.com.br
columns:
  id_line:
    description: Unique id that identifies the line.
  line_name:
    lineage:
      - datalake_airflow.dag.owners
    description: Name of the line.
  is_data_line:
    description: Boolean flag indicating if the line is from the Data area, related to an Analytics Engineering team.
  ts_line_first_event:
    lineage:
      - datalake_airflow.log.ts_event
    description: Timestamp of when the line's first DAG event happened.