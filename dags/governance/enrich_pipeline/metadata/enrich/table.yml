database_name: datalake_pipeline
table_name: table
owner: isadora.gallerani@quintoandar.com.br
domain: Cross
description: >
  Full-refresh enrich-layer inventory of tables loaded by bi-etl-ejuice Airflow DAGs (excluding
  reverse layer), built by enrich_pipeline from dag inventory and pipeline DAG metadata. Grain is
  one row per table, DAG, and task combination. Supports data catalog and pipeline dependency
  reporting.
columns:
  id_table:
    lineage:
      - datalake_dag_inventory_clean.table.table
    description: Composite table identifier (schema.table) from dag inventory; not unique because multiple DAGs may load the same table.
  id_dag:
    lineage:
      - datalake_pipeline.dag.id_dag
    description: Airflow DAG identifier that loads this table, matching the DAG name in Composer.
  id_task:
    lineage:
      - datalake_dag_inventory_clean.table.task
    description: Airflow task name within id_dag responsible for creating or updating this table.
  id_line:
    lineage:
      - datalake_pipeline.dag.id_line
    description: Surrogate key of the DAG owner line; joins to datalake_pipeline.line.
  table_name:
    lineage:
      - datalake_dag_inventory_clean.table.table
    description: Unqualified table name extracted from the dag inventory table identifier.
  schema:
    lineage:
      - datalake_dag_inventory_clean.table.table
    description: Hive schema name extracted from the dag inventory table identifier.
  layer:
    lineage:
      - datalake_dag_inventory_clean.table.layer
    description: Data lake layer of the table (for example raw, clean, enrich, dw, or metric).
  criticality:
    lineage:
      - datalake_dag_inventory_clean.table.criticality
    description: >
      Resolved criticality of the table: its tables_customization override when set,
      otherwise the producing DAG's declared tier. NULL when the load task was built
      before the param existed.
    categories:
      Critical: 'Critical tier'
      High: 'High tier'
      Medium: 'Medium tier'
      Low: 'Low tier'
  sla_deadline_localtime:
    lineage:
      - datalake_dag_inventory_clean.table.sla_deadline_localtime
    description: Declared table-specific SLA deadline in São Paulo wall-clock time.
  avg_file_size_in_bytes:
    lineage:
      - datalake_dag_inventory_clean.table.avg_file_size_in_bytes
    description: Average file size in bytes for the table as reported by the latest dag inventory snapshot.
  is_delta:
    lineage:
      - datalake_dag_inventory_clean.table.is_delta
    description: Boolean flag indicating whether the table is stored in Delta Lake format.
  is_active:
    description: Boolean flag indicating whether the table appeared in the most recent dag inventory snapshot.
  is_certified_layer:
    description: Boolean flag indicating whether the table is in a certified layer (dw or metric, excluding datamarts).
  dt_last_updated:
    lineage:
      - datalake_dag_inventory_clean.table.year
      - datalake_dag_inventory_clean.table.month
      - datalake_dag_inventory_clean.table.day
    description: Date of the dag inventory snapshot that last recorded this table.
