database_name: datalake_pipeline
table_name: table_sla_information
owner: jose.rferreira@quintoandar.com
domain: Data Ops & Governance
description: >
  Daily delivery status for every active table of every active, unpaused DAG. Each row is
  judged against a resolved São Paulo deadline: the DAG's declared deadline when the table
  inherits that DAG's tier, 08:00 for Critical and High, and 11:00 for Medium and Low. Grain
  is one row per table, producing DAG, and snapshot date.
columns:
  id_table:
    lineage:
      - datalake_pipeline.table.id_table
    description: Fully qualified table identifier emitted as the Airflow Dataset URI.
  id_dag:
    lineage:
      - datalake_pipeline.table.id_dag
    description: Airflow DAG identifier that produces the table.
  id_task:
    lineage:
      - datalake_pipeline.table.id_task
    description: Airflow load task that produces the table and emits its Dataset event.
  id_line:
    lineage:
      - datalake_pipeline.dag_sla_information.id_line
    description: Surrogate key of the producing DAG's owner line.
  schema_name:
    lineage:
      - datalake_pipeline.table.schema
    description: Unqualified schema containing the produced table.
  table_name:
    lineage:
      - datalake_pipeline.table.table_name
    description: Unqualified name of the produced table.
  layer:
    lineage:
      - datalake_pipeline.table.layer
    description: Data platform layer containing the table.
  table_criticality:
    lineage:
      - datalake_pipeline.table.criticality
      - datalake_pipeline.dag_sla_information.criticality
    description: >
      Resolved table tier, always resolved: can override the producing DAG when declared,
      otherwise inherits the DAG tier, falling back to Medium.
    categories:
      Critical: 'Critical tier'
      High: 'High tier'
      Medium: 'Medium tier'
      Low: 'Low tier'
  dag_criticality:
    lineage:
      - datalake_pipeline.dag_sla_information.criticality
    description: >
      Producing DAG's own tier, Medium when the DAG declares none. A High DAG remains High
      when it contains Critical tables.
    categories:
      Critical: 'Critical tier'
      High: 'High tier'
      Medium: 'Medium tier'
      Low: 'Low tier'
  sla_deadline_localtime:
    lineage:
      - datalake_pipeline.table.sla_deadline_localtime
      - datalake_pipeline.table.criticality
      - datalake_pipeline.dag_sla_information.criticality
      - datalake_pipeline.dag_sla_information.sla_deadline_localtime
    description: >
      Resolved table delivery deadline as São Paulo wall-clock HH:MM, never NULL. A declared
      table deadline wins; otherwise use the DAG deadline when the table tier matches the DAG
      tier, 08:00 for Critical and High, and 11:00 for Medium and Low.
  is_intraday_dag:
    lineage:
      - datalake_pipeline.dag_sla_information.is_intraday_dag
    description: Whether the producing DAG runs hourly or more frequently.
  is_delivered:
    lineage:
      - datalake_airflow.log.ts_event
    description: Whether the producing load task logged a success during the snapshot delivery cycle.
  is_inside_declared_sla:
    lineage:
      - datalake_airflow.log.ts_event
      - datalake_pipeline.table.sla_deadline_localtime
      - datalake_pipeline.dag_sla_information.sla_deadline_localtime
    description: >
      Whether the first delivery met the resolved deadline. NULL only when that deadline has
      not yet passed and no delivery exists; FALSE after the deadline or for a late delivery.
  minutes_after_deadline:
    lineage:
      - datalake_airflow.log.ts_event
      - datalake_pipeline.table.sla_deadline_localtime
      - datalake_pipeline.dag_sla_information.sla_deadline_localtime
    description: Signed minutes from the resolved deadline to first delivery; negative means early.
  ts_deadline_brt:
    lineage:
      - datalake_pipeline.dag_sla_information.dt_snapshot
      - datalake_pipeline.table.sla_deadline_localtime
      - datalake_pipeline.table.criticality
      - datalake_pipeline.dag_sla_information.criticality
      - datalake_pipeline.dag_sla_information.sla_deadline_localtime
    description: Resolved snapshot deadline represented as a São Paulo wall-clock timestamp.
  ts_first_delivery_brt:
    lineage:
      - datalake_airflow.log.ts_event
    description: First successful load-task completion timestamp in São Paulo time during the delivery cycle.
  dt_snapshot:
    lineage:
      - datalake_pipeline.dag_sla_information.dt_snapshot
    description: Date whose resolved delivery deadline is being evaluated.
  ts_load:
    description: Timestamp when enrich_pipeline wrote this SLA snapshot.
  year:
    lineage:
      - datalake_pipeline.dag_sla_information.dt_snapshot
    description: Year component of dt_snapshot used for partition pruning.
  month:
    lineage:
      - datalake_pipeline.dag_sla_information.dt_snapshot
    description: Month component of dt_snapshot used for partition pruning.
  day:
    lineage:
      - datalake_pipeline.dag_sla_information.dt_snapshot
    description: Day component of dt_snapshot used for partition pruning.
