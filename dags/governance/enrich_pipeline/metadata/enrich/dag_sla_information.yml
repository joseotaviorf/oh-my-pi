database_name: datalake_pipeline
table_name: dag_sla_information
owner: isadora.gallerani@quintoandar.com.br
domain: Cross
description: >
  Incremental enrich-layer daily snapshot of per-DAG SLA status for bi-etl-ejuice Airflow DAGs,
  built by enrich_pipeline from dag runs, pause events, and Google Sheet exclusion lists. Grain is
  one row per DAG and snapshot date. Partitioned by year, month, day — filter on snapshot date.
  Supports SLA debugging and line-level pipeline metrics.
columns:
  id_dag:
    lineage:
      - datalake_pipeline.dag.id_dag
    description: Airflow DAG identifier, matching the DAG name in Composer.
  id_line:
    lineage:
      - datalake_pipeline.dag.id_line
    description: Surrogate key of the DAG owner line; joins to datalake_pipeline.line.
  criticality:
    lineage:
      - datalake_pipeline.dag.criticality
    description: >
      DAG tier carried from datalake_pipeline.dag. Untagged DAGs are Medium.
      This is the DAG's own tier; a Critical table never raises it.
    categories:
      Critical: 'Critical tier'
      High: 'High tier'
      Medium: 'Medium tier'
      Low: 'Low tier'
  sla_deadline_localtime:
    lineage:
      - datalake_pipeline.dag.sla_deadline_localtime
    description: Declared delivery deadline as São Paulo wall-clock HH:MM; NULL when the DAG declares no deadline.
  is_active:
    lineage:
      - datalake_pipeline.dag.ts_first_event
      - datalake_airflow.dag.ts_last_scheduler_ran
    description: Boolean flag indicating whether the DAG was active on the snapshot date.
  is_active_and_unpaused:
    lineage:
      - datalake_astro_clean.dag.is_paused
      - datalake_airflow.log.event
    description: Boolean flag indicating whether the DAG was active and unpaused, meaning a run was expected.
  is_executed:
    lineage:
      - datalake_pipeline.dag_run.id_dag
      - datalake_pipeline.dag_run.ts_data_interval_started
    description: Boolean flag indicating whether the DAG had at least one run on the snapshot date.
  is_special_scheduler:
    lineage:
      - datalake_gsheets_clean.dags_special_scheduler.id_dag
    description: Boolean flag indicating whether the DAG is listed in the special scheduler Google Sheet.
  is_special_scheduler_executed:
    lineage:
      - datalake_gsheets_clean.dags_special_scheduler.id_dag
      - datalake_pipeline.dag_run.ts_data_interval_started
      - datalake_pipeline.dag_run.is_manual_run
      - datalake_pipeline.dag_run.is_first_run_ever
    description: >
      Boolean flag indicating whether a special-scheduler DAG had a non-manual,
      non-first-ever run on the snapshot date (manual and first-ever runs do not
      re-enter the SLA denominator via special_exec).
  is_in_sla_exclusion_list:
    lineage:
      - datalake_gsheets_clean.dags_sla_exclusion_list.dag
      - datalake_pipeline.dag.id_dag
    description: >
      Boolean flag indicating whether the DAG is excluded from Data SLA via the exclusion Google Sheet
      or by name suffix __validation (shadow/validation DAGs for EMR and cluster resize).
  is_in_ignoring_list:
    lineage:
      - datalake_gsheets_clean.dags_special_scheduler.id_dag
      - datalake_gsheets_clean.dags_sla_exclusion_list.dag
      - datalake_pipeline.dag.id_dag
      - datalake_pipeline.dag_run.is_first_execution_inside_sla
    description: >
      Boolean flag indicating whether the DAG is excluded from SLA calculation (exclusion list,
      __validation shadow DAGs, special scheduler without run, or first-run null SLA).
  is_inside_sla:
    lineage:
      - datalake_pipeline.dag_run.is_first_execution_inside_sla
    description: Boolean flag indicating whether the DAG first successful execution completed within SLA on the snapshot date.
  is_outside_sla:
    lineage:
      - datalake_pipeline.dag_run.is_first_execution_inside_sla
    description: Boolean flag indicating whether the DAG first successful execution missed SLA on the snapshot date.
  is_null_sla:
    lineage:
      - datalake_pipeline.dag_run.is_first_execution_inside_sla
      - datalake_gsheets_clean.dags_special_scheduler.id_dag
      - datalake_gsheets_clean.dags_sla_exclusion_list.dag
    description: Boolean flag indicating whether SLA status is null because the DAG is ignored or had no evaluable run.
  is_inside_declared_sla:
    lineage:
      - datalake_pipeline.dag_run.ts_last_table_task_successful_brt
      - datalake_pipeline.dag.sla_deadline_localtime
    description: >
      Whether the last table task succeeded by the DAG's declared São Paulo deadline.
      NULL means undecided: no deadline, the DAG is paused, or the deadline has not been reached yet.
  has_possible_problem:
    lineage:
      - datalake_pipeline.dag_run.is_first_execution_inside_sla
      - datalake_astro_clean.dag.is_paused
      - datalake_gsheets_clean.dags_special_scheduler.id_dag
      - datalake_gsheets_clean.dags_sla_exclusion_list.dag
    description: Boolean flag highlighting DAGs that are active and unpaused but lack a clear SLA classification, useful for debugging.
  is_run_successful:
    lineage:
      - datalake_pipeline.dag_run.state
    description: Boolean flag indicating whether the DAG run on the snapshot date ended in success state.
  is_run_failed:
    lineage:
      - datalake_pipeline.dag_run.state
    description: Boolean flag indicating whether the DAG run on the snapshot date ended in failed state.
  is_manual_run:
    lineage:
      - datalake_pipeline.dag_run.is_manual_run
    description: Boolean flag indicating whether the DAG run on the snapshot date was manually triggered.
  is_run_triggered_by_mediator:
    lineage:
      - datalake_pipeline.dag_run.is_triggered_by_mediator
    description: Boolean flag indicating whether the DAG run on the snapshot date was triggered by the Mediator.
  is_intraday_dag:
    lineage:
      - datalake_astro_clean.dag.schedule_interval
    description: Boolean flag indicating whether the DAG schedule is intraday (hourly or more frequent).
  dt_snapshot:
    lineage:
      - datalake_quintoandar.aux_date.date
    description: Calendar date of the daily SLA evaluation snapshot, one row per active DAG per date.
  dt_run:
    lineage:
      - datalake_pipeline.dag_run.ts_data_interval_started
    description: Data interval date of the DAG run evaluated for SLA, typically D-1 relative to the snapshot.
  ts_first_execution_success:
    lineage:
      - datalake_pipeline.dag_run.ts_first_execution_success
    description: UTC timestamp of the first successful task state in the DAG run, accounting for re-triggers and manual clears.
  ts_first_execution_success_brt:
    lineage:
      - datalake_pipeline.dag_run.ts_first_execution_success_brt
    description: Brasilia timezone timestamp of the first successful task state in the DAG run.
  ts_last_table_task_successful:
    lineage:
      - datalake_pipeline.dag_run.ts_last_table_task_successful
    description: UTC timestamp when the last table task succeeded, set only when all table tasks met SLA.
  ts_last_table_task_successful_brt:
    lineage:
      - datalake_pipeline.dag_run.ts_last_table_task_successful_brt
    description: Brasilia timezone timestamp when the last table task succeeded within SLA.
  year:
    lineage:
      - datalake_quintoandar.aux_date.date
    description: Year component of dt_snapshot, used for Hive partitioning — include in filters for partition pruning.
  month:
    lineage:
      - datalake_quintoandar.aux_date.date
    description: Month component of dt_snapshot, used for Hive partitioning — include in filters for partition pruning.
  day:
    lineage:
      - datalake_quintoandar.aux_date.date
    description: Day component of dt_snapshot, used for Hive partitioning — include in filters for partition pruning.
