---
dag:
  name: enrich_pipeline
  schedule_start_date: 2024, 4, 1
  schedule_interval: 0 7-13,16,18 * * *
  owner: Data Governance
  documentation:
    dag_purpose: "This DAG consolidates data from our bi-etl-ejuice Airflow pipeline, based on the DAG data extraction from Composer."
workflow:
  type: query_delta
  layer: enrich
  tables_customization:
    dag_run:
      extraction_type: full
    dag_sla_information:
      partitions: [year, month, day]
      extraction_type: incremental
      extra_query_template_params:
          load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
          load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
    dag:
      extraction_type: full
    line:
      extraction_type: full
    table:
      extraction_type: full
  inner_dependencies:
    dag:
      - dag_run
      - line
    dag_sla_information:
      - dag
      - dag_run
    table:
      - dag
cluster:
  type: databricks_12_2_med_general_photon_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
