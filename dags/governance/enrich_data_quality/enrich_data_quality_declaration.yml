---
dag:
  name: enrich_data_quality
  schedule_start_date: 2022, 1, 1
  owner: Data Governance
  documentation:
    dag_purpose: |
      This DAG consolidates the data quality validations from Inmetro applied to bietlejuice DAGs.
      It's very important to BE CAREFUL when performing any reprocessing, as a table in this DAG performs a retroactive calculation
      that depends on its own values on the previous day.
workflow:
  type: query_delta
  layer: enrich
  default_extraction_type: incremental
  default_partitions:
    - id_dag
    - year
    - month
    - day
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, -1), 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"