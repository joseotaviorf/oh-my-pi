database_name: datalake_looker_temp
table_name: sql_rent_metrics_monthly_regional_migrated
owner: giuseppe.giovanelli@quintoandar.com.br
domain: Data Ops & Governance
description: Temporary table sql_rent_metrics_monthly_regional_migrated from Looker.
columns:
  pk:
    description: Key of region
  sk_region:
    description: Key of region
  listing_category_start:
    description: Category that house listing started as
  month:
    description: Coincident Month
  ongoing_listings:
    description: Count of unique listings with status published on each month.
  new_rentals:
    description: Sum of signed contracts that started (generated revenue) on each
      month.
  new_contracts_signed:
    description: Sum of the contracts that were signed (not necessarily generated
      revenue) on each month.
  ongoing_rentals:
    description: Count of unique signed contracts that started and were active on
      each month.
  new_listings:
    description: Count of new listings on each month.
