database_name: datalake_looker_temp
table_name: sql_rent_demand_funnel_flows
owner: giuseppe.giovanelli@quintoandar.com.br
domain: Data Ops & Governance
description: Temporary table sql_rent_demand_funnel_flows from Looker.
columns:
  funnel_first_touchpoint:
    description: First event of rent flow
  had_flow_tta:
    description: Flag to identify if rent flow had event talk to agent
  had_flow_visit:
    description: Flag to identify if rent flow had event visit booked
  had_flow_direct_offer:
    description: "Boolean flag indicating if the rent flow had any direct offer (DO)\
      \ event, which means that the first event\n      of the rent flow was a DO"
  flow_type:
    description: Type of rent flow (events in rent flow)
  sk_client:
    description: Key of client
  sk_house_listing:
    description: Key of house listing
  sk_rent_flow:
    description: Key of rent flow
  funnel_flow:
    description: Rent highest intent flow
  dt_first_direct_offer:
    description: Date of funnel first direct offer
  dt_first_offer:
    description: Date of funnel first offer
  dt_first_visit_in_person:
    description: Date of funnel first visit in person
  dt_first_visit_booked:
    description: Date of funnel first visit booked
  dt_first_visit_completed:
    description: Date of funnel first visit completed
  first_ts:
    description: Time of funnel first touchpoint
  direct_offers:
    description: Total direct offers in rent flow
  offers:
    description: Total offers in rent flow
  visits_in_person:
    description: Total visits in person in rent flow
  talk_to_agent:
    description: Total talks to agent in rent flow
  visits_booked:
    description: Total visits booked in rent flow
  visits_completed:
    description: Total visits completed in rent flow
  total_listings:
    description: Number of listings
  total_clients:
    description: Number of clients
  total_rent_flows:
    description: Number of rent flows
