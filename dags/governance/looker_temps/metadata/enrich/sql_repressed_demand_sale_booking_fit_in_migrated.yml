database_name: datalake_looker_temp
table_name: sql_repressed_demand_sale_booking_fit_in_migrated
owner: giuseppe.giovanelli@quintoandar.com.br
domain: Data Ops & Governance
description: Temporary table sql_repressed_demand_sale_booking_fit_in_migrated from
  Looker.
columns:
  sk_user_house_date_slot:
    description: Table primary key, aggregate user id, house id and slot infos
  region_code:
    description: Region code where visit fitting was solicited.
  city:
    description: City where visit fitting was solicited.
  city_group:
    description: "Group of cities and neighborhoods (e.g. RMSP: Regi\xE3o Metropolitana\
      \ de S\xE3o Paulo) where visit fitting was solicited."
  neighborhood:
    description: Neighborhood where visit fitting was solicited.
  slot_number:
    description: Number of the slot of time for which visit fitting is being requested.
  slot_hour:
    description: The hour for which visit fitting is being requested.
  time_range:
    description: The time range for which visit fitting is being requested.
  id_house:
    description: ID of the house being request for visit fitting.
  id_user:
    description: ID of the user requesting for visit fitting.
  slot:
    description: The date for which visit fitting is being requested.
  event:
    description: The date when visit fitting request was created.
  encaixes:
    description: Sum of visit fitting request fractions.
  encaixes_realized:
    description: Sum of visit fitting request fractions that originated a booking.
  encaixes_not_realized:
    description: Sum of visit fitting request fractions that didn't originate a booking
  encaixes_not_realized_cant_find_another_agent:
    description: Sum of visit fitting request fractions that originate a booking but
      were canceled after due to can't find another agent reason.
  encaixes_not_realized_calendar:
    description: Sum of visit fitting request fractions that didn't originate a booking
      due to lack of hours on house calendar
  encaixes_not_realized_block:
    description: Sum of visit fitting request fractions that didn't originate a booking
      due to house being blocked
  encaixes_not_realized_suspension:
    description: Sum of visit fitting request fractions that didn't originate a booking
      due to house being suspended
  encaixes_not_realized_block_or_suspension:
    description: Sum of visit fitting request fractions that didn't originate a booking
      due to house being suspended or blocked
  encaixes_not_realized_block_or_suspension_or_calendar:
    description: Sum of visit fitting request fractions that didn't originate a booking
      due to house being suspended or blocked or lack of hours on house calendar
  encaixes_not_realized_house_without_slots:
    description: Sum of visit fitting request fractions that didn't originate a booking
      due to house without slot available on target day
  encaixes_not_realized_by_agent:
    description: Sum of visit fitting request fractions that didn't originate a booking
      due to agent without slot available on target day.
  encaixes_not_realized_by_visit_rent:
    description: Sum of visit fitting request fractions that didn't originate a booking
      due to slot be busy with rent.
  visitors:
    description: Count of distinct visitors that request a visit fitting
  houses:
    description: Count of distinct houses that had a request for visit fitting
