database_name: datalake_looker_temp
table_name: sql_sale_actual_target_events_migrated
owner: giuseppe.giovanelli@quintoandar.com.br
domain: Data Ops & Governance
description: Temporary table sql_sale_actual_target_events_migrated from Looker.
columns:
  pk_date:
    description: Date as primary key
  halfyear:
    description: Number representing the first and second half of the year
  city_group:
    description: Name of city_group as defined on dim_region table
  origin_before_offer:
    description: Origin Before Offer
  origin_after_offer:
    description: Origin After Offer.
  hub_visit:
    description: Hub Visit.
  hub_offer:
    description: Hub Offer.
  campaign:
    description: Campaign from supply funnel.
  mkt_channel:
    description: Marketing channel from supply funnel.
  mkt_origin:
    description: Marketing origin from supply funnel.
  mkt_type:
    description: Marketing type from supply funnel.
  lead_context:
    description: Lead context from supply funnel.
  lead_processing_operation:
    description: Operation that treated the lead (IS, FSS, B2B, CIQ).
  form_of_payment:
    description: Form of payment from demand funnel.
  first_origin_demand:
    description: First origin from the demand funnel
  supply_3p_partner:
    description: 3P supply partner name
  demand_3p_partner:
    description: 3P demand partner name
  is_3p_supply:
    description: Flag if supply belongs to a 3P partner, either from Rede QuintoAndar
      or Casa Mineira.
  is_3p_supply_5a:
    description: Flag if supply belongs to a 3P partner, specifically from Rede QuintoAndar
      (as opposed to Casa Mineira).
  is_3p_supply_bh:
    description: Flag if supply belongs to a 3P partner, specifically from Casa Mineira
      (3P BH, as opposed to Rede QuintoAndar).
  is_3p_demand:
    description: Shows whether the demand comes from a 3P partner (demand) or not
  3p_context:
    description: Describes the funnel side of the QuintoAndar (3P) partner(s) involved
      in the booking. Returns \"QuintoAndar\" when there's no other part involved
  metric_name:
    description: List of sale funnel metrics names to be used in a specific format
  conversion_name:
    description: List of sale funnel conversions names to be used in a specific format
  date:
    description: Dates
  ts_load:
    description: Timestamp of when this data row was last loaded
  leads:
    description: Count of leads on the period
  prospects:
    description: Count of lead prospects on the period
  new_buyer_prospects:
    description: Number of new buyer prospects (users that performed a talk to agent,
      booked a visit or submitted an offer for the first time) with intent for sale
  first_contacts:
    description: Count of lead prospects that had a first contact on the period
