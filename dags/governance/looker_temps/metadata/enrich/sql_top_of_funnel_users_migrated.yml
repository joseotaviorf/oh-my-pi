database_name: datalake_looker_temp
table_name: sql_top_of_funnel_users_migrated
owner: giuseppe.giovanelli@quintoandar.com.br
domain: Data Ops & Governance
description: Temporary table sql_top_of_funnel_users_migrated from Looker.
columns:
  pkey:
    description: Primary key
  sk_region:
    description: Key of region
  id_house:
    description: ID of house
  id_tof_user:
    description: ID of top of funnel user
  id_first_interaction:
    description: ID of top of funnel user in it's first interaction
  business_context:
    description: Business context the user interacted with
  mkt_category:
    description: Category of user interaction
  mkt_flow:
    description: Type of flow in the marketing funnel by the user
  mkt_completion:
    description: Type of flow in the marketing funnel completion by the user
  mkt_origin:
    description: Origin level of the taxonomy (used to describe the product used)
  mkt_channel:
    description: Channel level of the Taxonomy (used to describe the type of the channel)
  mkt_medium:
    description: Medium level of the taxonomy (used to describe the midia strategy)
  mkt_source:
    description: Source level of the taxonomy (used to describe the midia used)
  mkt_platform:
    description: Type of device used
  app_type:
    description: Type of device used
  utm_medium:
    description: Results utm_medium (carries the midia strategy)
  utm_source:
    description: Results utm_source (carries the midia used)
  utm_campaign:
    description: Results utm_campaign (carries the campaign name)
  utm_content:
    description: Identifies what specifically was clicked to bring the user to the
      site.
  utm_term:
    description: Identifies search terms that brought the lead
  branded:
    description: Identifies whether the campaign contains a brand term
  event:
    description: Coincident date
  tof_users:
    description: Count of distinct users or devices with search_page_viewed, listing_page_viewed
      or schedule_page_viewed events in the period
  new_tof_users:
    description: Count of distinct users or devices doing a search_page_viewed, listing_page_viewed
      or schedule_page_viewed event for the first time
