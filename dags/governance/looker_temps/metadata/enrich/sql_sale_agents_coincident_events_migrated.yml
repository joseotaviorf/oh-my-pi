database_name: datalake_looker_temp
table_name: sql_sale_agents_coincident_events_migrated
owner: giuseppe.giovanelli@quintoandar.com.br
domain: Data Ops & Governance
description: Temporary table sql_sale_agents_coincident_events_migrated from Looker.
columns:
  pk:
    description: primary key
  weekday_name:
    description: Name of week day
  is_last_day_of_month:
    description: primary key
  sk_agent:
    description: The unique agent ID
  sk_region:
    description: Key to identify region associated with house or lead
  sk_house:
    description: ID of the house.
  id_work_contract:
    description: The unique ID for workcontract
  has_active_contract:
    description: Check if the agent has active contract in the period
  partner_3p_supply:
    description: 3P supply partner name
  partner_3p_demand:
    description: 3P demand partner name
  is_3p_supply:
    description: Flag if supply belongs to a 3P partner
  is_3p_demand:
    description: Flag if visit was booked by a 3P demand agent
  3p_context:
    description: Describes the funnel side of the QuintoAndar (3P) partner(s) involved
      in the booking. Returns \"QuintoAndar\" when there's no other part involved
  days_to_activation:
    description: Days between work contract started and first Visit Booked
  date:
    description: Coincident date
  booking_work_contract_start:
    description: Start date of the agent`s work contract during Visit Booked
  booking_work_contract_end:
    description: End date of the agent`s work contract during Visit Booked
  visits_booked:
    description: Count distinct of visits booked on the period
  visits_completed:
    description: Count distinct of visits completed on the period
  offer_submitted:
    description: Count distinct of offers submitted on the period
  offer_accepted:
    description: Count distinct of offers accepted on the period
  sale_agreement_signed:
    description: Count distinct of sale agreements signed on the period
  daily_accredited_agents:
    description: Count of distinct agents with active workcontract in the end of the
      period (Use only with contract info)
  weekly_accredited_agents:
    description: Count of distinct agents with active workcontract in the end of the
      period (Use only with contract info)
  monthly_accredited_agents:
    description: Count of distinct agents with active workcontract in the end of the
      period (Use only with contract info)
  active_agents:
    description: Count of unique agents that booked a visit in the period
  weekly_engaged_agents:
    description: Count agents that booked visits in two consecutive weeks (Use only
      with contract info)
  monthly_engaged_agents:
    description: Count agents that booked visits in two consecutive months (Use only
      with contract info)
  daily_active_over_accredited_agents:
    description: Proportion of active agents among accredited agents (Use only with
      contract info)
  weekly_active_over_accredited_agents:
    description: Proportion of active agents among accredited agents (Use only with
      contract info)
  monthly_active_over_accredited_agents:
    description: Proportion of active agents among accredited agents (Use only with
      contract info)
  weekly_engaged_over_accretited_agents:
    description: Proportion of weekly engaged agents among accredited agents (Use
      only with contract info)
  monthly_engaged_over_accretited_agents:
    description: Proportion of monthly engaged agents among accredited agents (Use
      only with contract info)
  weekly_engaged_over_active_agents:
    description: Proportion of weekly engaged agents among active agents (Use only
      with contract info)
  monthly_engaged_over_active_agents:
    description: Proportion of monthly engaged agents among active agents (Use only
      with contract info)
