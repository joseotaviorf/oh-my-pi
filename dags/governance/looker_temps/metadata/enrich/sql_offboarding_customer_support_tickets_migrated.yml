database_name: datalake_looker_temp
table_name: sql_offboarding_customer_support_tickets_migrated
owner: giuseppe.giovanelli@quintoandar.com.br
domain: Data Ops & Governance
description: Temporary table sql_offboarding_customer_support_tickets_migrated from
  Looker.
columns:
  sk_termination:
    description: Unique ID for each termination
  most_frequent_channel:
    description: The contact channel that was more frequently used, considering all
      termination tickets
  total_number_of_tickets:
    description: Number of tickets relating to the termination, considering the cases
      where the first, last or main ticket department is related to Offboarding themes
  number_of_tenant_tickets:
    description: Number of tickets opened by a tenant
  number_of_rent_owner_tickets:
    description: Number of tickets opened by a rent owner
  number_of_front_tickets:
    description: Number of Front Office tickets relating to the termination
  number_of_back_tickets:
    description: Number of Back Office tickets relating to the termination
  number_of_undefined_tickets:
    description: Number of tickets without the definition if it was for Front or Back
      office
  number_of_ended_tickets:
    description: Number of tickets with the closed or solved status
  number_of_ongoing_tickets:
    description: Number of tickets with the status open or new
  number_of_on_hold_tickets:
    description: Number of tickets with the status pending or hold
  number_of_deleted_tickets:
    description: Number of tickets with the status deleted
  avg_ticket_csat_score:
    description: Average CSAT score of all tickets that were answered
