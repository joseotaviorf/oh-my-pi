database_name: datalake_looker_temp
table_name: sql_repressed_demand_fitting
owner: giuseppe.giovanelli@quintoandar.com.br
domain: Data Ops & Governance
description: Temporary table sql_repressed_demand_fitting from Looker.
columns:
  sk_key:
    description: primary key
  region_code:
    description: Region where encaixed was solicited
  city:
    description: City where encaixed was solicited
  city_group:
    description: "A grouping of city or clusters of cities and neighborhoods (RMSP:\
      \ Regi\xE3o Metropolitana de S\xE3o Paulo)."
  slot:
    description: Slot of time which visit booking was requested by tenant prospect.
  hour:
    description: Visit scheduling hour (0, 1, 2, ... 23).
  faixa_de_horario:
    description: A grouping of hours about date scheduled.
  house_id:
    description: Key of house.
  user_id:
    description: Key of user.
  encaixes_nao_realizados_por_bloqueio_suspensao_agenda:
    description: Fit in request fractions that didn't originate a booking due to house
      being suspended or blocked or lack of hours on house calendar
  visit_date:
    description: Visit date fit in requested.
  event_date:
    description: The reference on date scheduling.
  date_hour:
    description: The reference on date and hour scheduling.
  encaixes:
    description: Sum of fit in request fractions.
  encaixes_realized:
    description: Sum of fit in request fractions that originated a booking.
  encaixes_not_realized:
    description: Sum of fit in request fractions that didn't originate a booking
  encaixes_not_realized_cant_find_another_agent:
    description: Sum of fit in request fractions that didn't originate a booking
  encaixes_not_realized_calendar:
    description: Sum of fit in request fractions that didn't originate a booking due
      to lack of hours on house calendar
  encaixes_not_realized_block:
    description: Sum of fit in request fractions that didn't originate a booking due
      to house being blocked
  encaixes_not_realized_suspension:
    description: Sum of fit in request fractions that didn't originate a booking due
      to house being suspended
  encaixes_not_realized_block_or_suspension:
    description: Sum of fit in request fractions that didn't originate a booking due
      to house being suspended or blocked
  encaixes_not_realized_block_or_suspension_or_calendar:
    description: Sum of fit in request fractions that didn't originate a booking due
      to house being suspended or blocked or lack of hours on house calendar
  encaixes_not_realized_house_without_slots:
    description: Sum of fit in request fractions that didn't originate a booking due
      to house without slot available on target day
  encaixes_not_realized_by_agent:
    description: Sum of fit in request fractions that didn't originate a booking due
      to agent without slot available on target day.
  encaixes_not_realized_by_visit_sale:
    description: Sum of fit in request fractions that didn't originate a booking due
      to slot be busy.
  visitors:
    description: Count of distinct visitors that request a fit in
  houses:
    description: Count of distinct houses that had a request for fit in
