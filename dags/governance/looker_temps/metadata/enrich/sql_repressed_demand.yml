database_name: datalake_looker_temp
table_name: sql_repressed_demand
owner: giuseppe.giovanelli@quintoandar.com.br
domain: Data Ops & Governance
description: Temporary table sql_repressed_demand from Looker.
columns:
  sk_key:
    description: primary key
  region_code:
    description: Used mainly by agents team. A region code is a grouping of several
      sub-regions. This field is used by the agents team, for agent allocation and
      other purposes.
  city:
    description: The name for the city where this region is in.
  city_group:
    description: "A grouping of city or clusters of cities and neighborhoods (for\
      \ example, RMSP: Regi\xE3o Metropolitana de S\xE3o Paulo)."
  slot:
    description: Slot of time which visit booking was requested by tenant prospect.
  hour:
    description: visit scheduling hour (0, 1, 2, ... 23).
  faixa:
    description: A grouping of hours about date scheduled.
  repressed_demand:
    description: The reference on date scheduling.
  load:
    description: Timestamp of data recorded in the table
  bookings:
    description: Sum of booking involving the hour and region_code on the date.
  encaixes:
    description: Sum of fit in request fractions.
  encaixes_realized:
    description: Sum of fit in request fractions realized.
  encaixes_not_realized:
    description: Sum of fit in request fractions not realized.
  encaixes_not_realized_cant_find_another_agent:
    description: Sum of fit in request fractions not realized.
  encaixes_not_realized_calendar:
    description: Sum of fit in request fractions that didn't originate a booking due
      to lack of hours on house calendar.
  encaixes_not_realized_block:
    description: Sum of fit in request fractions that didn't originate a booking due
      to house being blocked.
  encaixes_not_realized_suspension:
    description: Sum of fit in request fractions that didn't originate a booking due
      to house being suspended.
  encaixes_not_realized_block_or_suspension:
    description: Sum of fit in request fractions that didn't originate a booking due
      to house being suspended or blocked.
  encaixes_not_realized_block_or_suspension_or_calendar:
    description: Sum of fit in request fractions that didn't originate a booking due
      to house being suspended or blocked or lack of hours on house calendar.
  encaixes_not_realized_house_without_slots:
    description: Sum of fit in request fractions that didn't originate a booking due
      to house without slot available on target day.
  encaixes_not_realized_by_agent:
    description: Sum of fit in request fractions that didn't originate a booking due
      to agent without slot available on target day.
  encaixes_not_realized_by_visit_sale:
    description: Sum of fit in request fractions that didn't originate a booking due
      to slot be busy.
