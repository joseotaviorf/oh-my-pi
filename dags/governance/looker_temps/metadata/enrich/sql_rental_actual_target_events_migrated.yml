database_name: datalake_looker_temp
table_name: sql_rental_actual_target_events_migrated
owner: giuseppe.giovanelli@quintoandar.com.br
domain: Data Ops & Governance
description: Temporary table sql_rental_actual_target_events_migrated from Looker.
columns:
  pk_date:
    description: Date as primary key
  halfyear:
    description: Number representing the first and second half of the year
  tier:
    description: Name of tier as defined on dim_region table
  country_code:
    description: Name of country_code as defined on dim_region table
  city_group:
    description: Name of city_group as defined on dim_region table
  is_b2b_supply:
    description: Flag B2B to supply
  is_b2b_demand:
    description: Information to classify demand events
  mkt_origin:
    description: Marketing origin from Supply.
  mkt_origin_detailed:
    description: Combination of mkt_origin and mkt_channel, at mkt_channel level only
      for Owner PWA. For management reports.
  mkt_channel:
    description: Marketing channel from Supply.
  sales_company:
    description: Sales company that acted the lead.
  lead_context:
    description: Lead context from Supply.
  lead_origin:
    description: Lead origin in EBDB.
  lead_processing_operation:
    description: Operation that treated the lead (IS, FSS, B2B, CIQ).
  first_touchpoint:
    description: Funnel first touchpoint from Demand.
  is_guarantee:
    description: Flag based on guarantee flow.
  is_expansion:
    description: Flag to indicate if the city group is from expansion
  metric_name:
    description: List of rental funnel metrics names to be used in a specific format
  conversion_name:
    description: List of rental funnel conversions names to be used in a specific
      format
  date:
    description: Date of event
  dt_load:
    description: Date of when this data row was last loaded
  leads:
    description: Count of leads on the period
  prospects:
    description: Count of lead prospects on the period
  qualifieds:
    description: Count of qualifieds leads on the period
  available_qualifieds:
    description: Count of available qualifieds leads on the period
  opportunities:
    description: Count of lead opportunities on the period
  first_listings:
    description: Count of first listings on the period
  ongoing_listing:
    description: Count of ongoing listings on the period
  visits_booked:
    description: Count distinct of visits booked on the period
  visits_completed:
    description: Count distinct of visits completed on the period
  offer_submitted:
    description: Count distinct of offers submitted on the period
  offer_accepted:
    description: Count distinct of offers accepted on the period
  credit_evaluation_init:
    description: Count distinct of proposals that initiated the credit evaluation
      on the period
  credit_evaluation_positive:
    description: Count distinct of proposals that had credit evaluation positive on
      the period
  doc_sent:
    description: Count distinct of proposals that first sent documentation on the
      period
  credit_approved:
    description: Count distinct of credit approved on the period [considering credit
      rules before credit evaluation implementation (July of 2020)]
  contract_created:
    description: Count distinct of contracts created on the period
  contract_signed:
    description: Count distinct of signed contracts on the period
  contract_ended:
    description: Count distinct of ended contracts on the period
  new_tenant_prospect:
    description: Number of new tenant prospects (users that performed a talk to agent,
      booked a visit or submitted an offer for the first time) for rental houses
  total_listings:
    description: Number of total listings published (First Listings + Re-Listings
      + Recovered).
  new_tenant_prospect_target:
    description: Target of new tenant prospects for performance marketing
  prospects_target:
    description: Target for lead prospects on the period
  qualifieds_target:
    description: Target for qualifieds leads on the period
  available_qualifieds_target:
    description: Target for available qualifieds leads on the period
  opportunities_target:
    description: Target for lead opportunities on the period
  first_listings_target:
    description: Target for first listings on the period
  ongoing_listings_target:
    description: Target for ongoing listings on the period
  visits_booked_target:
    description: Target for visits booked on the period
  visits_completed_target:
    description: Target for visits completed on the period
  offer_submitted_target:
    description: Target for offers submitted on the period
  offer_accepted_target:
    description: Target for offers accepted on the period
  doc_sent_target:
    description: Target for documentation sent on the period
  credit_evaluation_initiated_target:
    description: Target for proposals that had initiated the credit evaluation on
      the period
  credit_evaluation_positive_target:
    description: Target for proposals that had credit evaluation positive on the period
  credit_approved_target:
    description: Target for credit approved on the period
  contract_signed_target:
    description: Target for contracts signed on the period
  total_listings_target:
    description: Target for total listings on the period
