database_name: datalake_looker_temp
table_name: sql_temp_supply_flows_migrated
owner: giuseppe.giovanelli@quintoandar.com.br
domain: Data Ops & Governance
description: Temporary table sql_temp_supply_flows_migrated from Looker.
columns:
  sk_lead_listing_flows:
    description: Combination of lead id and business context of origin.
  sk_house_listing:
    description: Key to identify house's listing in website
  sk_house_listing_flow:
    description: Key to identify house's listing flow
  sk_lead:
    description: Key to identify lead
  sk_region:
    description: Key to identify region associated with house or lead
  sk_user_lead_affiliate:
    description: Key to identify affiliate who indicated the lead
  is_spinver:
    description: Column to identify if correspond a Spinver channel or not.
  mkt_channel:
    description: Marketing channel as defined by the lead taxonomy
  mkt_completion:
    description: Marketing completion as defined by the lead taxonomy
  mkt_source:
    description: Marketing source as defined by the lead taxonomy
  mkt_medium:
    description: Marketing medium as defined by the lead taxonomy
  mkt_origin:
    description: Marketing origin as defined by the lead taxonomy
  sourcing_ops:
    description: Category of operation which treated the lead
  lead_origin:
    description: Lead origin in EBDB
  supply_mkt_origin_detailed:
    description: Combination of mkt_origin and mkt_channel, at mkt_channel level only
      for Owner PWA. For management reports
  lead_context:
    description: 'Lead context of treatment: B2B, FSS or IS'
  lead_processing_operation:
    description: Operation that treated the lead
  sales_company:
    description: Sales company that acted the lead
  funnel_drop_reason:
    description: Description of the reason for the lead or house to be in its current
      funnel step.
  context_lead:
    description: Business context of lead
  context_prospect:
    description: Business context of prospect
  context_qualified:
    description: Business context of qualified
  context_opportunity:
    description: Business context of opportunity
  context_first_listing:
    description: Business context of first listing
  lead_discard:
    description: Lead discard reason
  prospect_discard:
    description: Prospect, qualified or available qualified discard reason
  prospect_status:
    description: Prospect status (DISCARDED, CONVERTED, NEW, PROSPECTING).
  origin_table:
    description: Table of origin of listing flow
  sk_lead_date:
    description: Key to identify date of lead
  sk_prospect_date:
    description: Key to identify date of lead passing through discard algorithm
  sk_qualified_date:
    description: Key to identify date of qualification of a lead according to 5A criteria
  sk_available_qualified_date:
    description: Key to identify date of qualification of a house availability.
  sk_opportunity_date:
    description: Key to identify date of opportunity (ie date of house's first job
      created).
  sk_first_listing_date:
    description: Key to identify date of first listing of a house in our website
  lead:
    description: Date of lead
  prospect:
    description: Date of lead passing through discard algorithm
  qualified:
    description: Date of qualification of a lead according to 5A criteria
  available_qualified:
    description: Date of qualification of a house availability
  opportunity:
    description: Date of opportunity (ie date of house's first job created)
  first_listing:
    description: Date of first listing of a house in our website
  leads:
    description: 'Number of leads: count of sk_lead_date >= 0'
  prospects:
    description: 'Number of prospects: count of sk_prospect_date >= 0'
  qualifieds:
    description: 'Number of qualifieds: count of sk_qualified_date >= 0'
  available_qualifieds:
    description: 'Number of available qualifieds: count of sk_available_qualified_date
      >= 0'
  opportunities:
    description: 'Number of opportunities: count of sk_opportunity_date >= 0'
  first_listings:
    description: 'Number of first listings: count of sk_first_listing_date >= 0'
