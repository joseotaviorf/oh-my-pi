  team_lead_name:
    description: Team Lead Name
  consultant_name:
    description: Consultant Name
  agent_name:
    description: Agent Name
  sold_or_rented_by_5A:
    description: Flag - if the house was sold or rented by 5A then true
  last_depublication_date:
    description: Date of the last depuplication of the house
  offer_submitted_date:
    description: Date of offer submission
  offer_accepted_date:
    description: Date of offer acception
  offer_dismissed_date:
    description: Date of offer dismissed
  sale_agreement_signed_date:
    description: Date when the sale agreement was signed
  offer_submitted_sum:
    description: Sum of all offer submitted
  offer_accepted_sum:
    description: Sum of all offer accepted
  sale_agreement_signed_sum:
    description: Sum of all sale agreement signed
  avg_first_discount:
    description: Average of first discount
