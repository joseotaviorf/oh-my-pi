database_name: datalake_looker_temp
table_name: sql_rede_offers_migrated
owner: giuseppe.giovanelli@quintoandar.com.br
domain: Data Ops & Governance
description: Temporary table sql_rede_offers_migrated from Looker.
columns:
  sk_offer:
    description: Offer ID
  sk_house:
    description: House ID
  house_status:
    description: House status
  partner_3p_supply:
    description: Name of thee partner 3P supply
  partner_3p_demand:
    description: Name of thee partner 3P demand
  is_3p_supply:
    description: Flag - if the visit is from 3P supply then true
  is_3p_demand:
    description: Flag - if the visit is from 3P demand then true
  offer_submitted:
    description: Offer submitted (1 if true and 0 if false)
  offer_accepted:
    description: Offer accepted (1 if true and 0 if false)
  offer_dismissed:
    description: Offer dismissed (1 if true and 0 if false)
  sale_agreement_signed:
    description: Sale agreement signed (1 if true and 0 if false)
  first_discount_proposed:
    description: First discount (%) proposed in given offer
  last_discount_proposed:
    description: Last discount (%) proposed in given offer
  price:
    description: Offer price
  first_price_offered_by_buyer:
    description: First price proposed in given offer
  last_price_offered_by_buyer:
    description: Last price proposed in given offer
  sk_agent:
    description: Agent (3P) ID
  id_user_agent:
    description: User ID
