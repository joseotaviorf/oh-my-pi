database_name: datalake_looker_temp
table_name: sql_rede_visits_migrated
owner: giuseppe.giovanelli@quintoandar.com.br
domain: Data Ops & Governance
description: Temporary table sql_rede_visits_migrated from Looker.
columns:
  id_booking:
    description: Booking ID
  sk_house:
    description: House ID
  sk_agent:
    description: Agent ID
  sk_user_agent:
    description: User Agent ID
  agent_name:
    description: Agent Name
  partner_3p_supply:
    description: Name of thee partner 3P supply
  partner_3p_demand:
    description: Name of thee partner 3P demand
  is_3p_supply:
    description: Flag - if the visit is from 3P supply then true
  is_3p_demand:
    description: Flag - if the visit is from 3P demand then true
  user_sale_booking_creator:
    description: User that created the booking
  first_update_source:
    description: Source that first updated the booking
  cancelled_by:
    description: The one who canceled the visit
  owner_arrived:
    description: If the owner arrived at the visit then true
  booking_status:
    description: Status of the booking
  listing_status:
    description: Status of the listing
  cancellation_reason:
    description: Reason of the visit cancellation
  house_unpublished_reason:
    description: Reason of the house unpublish
  days_vb2unp:
    description: Days between visit booked and unpublish
  sold_or_rented_by_5A:
    description: Flag - if the house was sold or rented by 5A then true
  visit_creation_date:
    description: Timestamp of the creation of the visit
  visit_scheduling_date:
    description: Timestamp of the scheduling of the visit
  visit_cancel_date:
    description: Timestamp of the cancelling of the visit
  last_depublication_date:
    description: Date of the last depuplication of the house
  vb_demand:
    description: Count of visits booked from 3P demand
  agent_count:
    description: Count of agents
  visit_with_unpublish_10days:
    description: Count of visits with unpublished listing with <= 10 days from visit
      creation date
  visit_with_unpublish_20days:
    description: Count of visits with unpublished listing with <= 20 days from visit
      creation date
  houses_with_unpublish_less_10days:
    description: Count of houses with unpublished listing with <= 10 days from visit
      creation date
  houses_with_unpublish_between_10_and_20_days:
    description: Count of houses with unpublished listing between 10 and 20 days from
      visit creation date
  distinct_houses_visited:
    description: Distinct count of houses visited
  visits_cancelled_by_agent:
    description: Count of visits with unpublished listing with <= 20 days from visit
      creation date
