database_name: datalake_looker_temp
table_name: sql_sale_closing_ops_targets_migrated
owner: giuseppe.giovanelli@quintoandar.com.br
domain: Data Ops & Governance
description: Temporary table sql_sale_closing_ops_targets_migrated from Looker.
columns:
  sk_offer:
    description: SK Offer
  sla_target_sale_agreement_signed_to_house_registry_ended:
    description: SLA for Sale Agreement Signed to House Registry Ended (MA)
  sla_target_sale_agreement_signed_to_legal_analysis_ended:
    description: SLA for Sale Agreement Signed to Legal Analysis Ended (DD)
  sla_target_sale_agreement_signed_to_notes_registry_ended:
    description: SLA for Sale Agreement Signed to Notes Registry Ended (CRN)
  sla_target_sale_agreement_signed_to_house_registry_started:
    description: SLA for Sale Agreement Signed to House Registry Started (CRI Start)
  is_realized_target_sale_agreement_signed_to_house_registry_started:
    description: Is realized in the current month (regardless of when the target is)
  is_realized_without_advances_target_sale_agreement_signed_to_house_registry_started:
    description: Is realized in the current month AND the target is not after the
      current month
  is_stock_target_sale_agreement_signed_to_house_registry_started:
    description: Is stock for the current month (not realized and target is for this
      month or before)
  is_realized_without_advances_or_stock_target_sale_agreement_signed_to_house_registry_started:
    description: Is stock or is realized this month and target is not for after the
      current month
  is_realized_or_stock_target_sale_agreement_signed_or_bank_legal_analysis_started_to_house_registry_started:
    description: Is realized this month or is stock this month (target is this month
      or before). This is the broadest and encompasses all other.
  sla_target_sale_agreement_signed_to_bank_legal_analysis_started:
    description: SLA for Sale Agreement Signed to Bank Legal Analysis Started
  sla_target_sale_agreement_signed_to_financing_started:
    description: SLA for Sale Agreement Signed to Financing Started
  target_sale_agreement_signed_to_house_registry_ended:
    description: Target Date for Sale Agreement Signed to House Registry Ended (MA)
  target_sale_agreement_signed_to_legal_analysis_ended:
    description: Target Date for Sale Agreement Signed to Legal Analysis Ended (DD)
  target_sale_agreement_signed_to_notes_registry_ended:
    description: Target Date for Sale Agreement Signed to Notes Registry Ended (CRN)
  target_sale_agreement_signed_to_house_registry_started:
    description: Target Date for Sale Agreement Signed to House Registry Started (CRI
      Start)
  target_sale_agreement_signed_to_bank_legal_analysis_started:
    description: Target Date for Sale Agreement Signed to Bank Legal Analysis Started
  target_sale_agreement_signed_to_financing_started:
    description: Target Date for Sale Agreement Signed to Financing Started
  count_is_realized_target_sale_agreement_signed_or_bank_legal_analysis_started_to_house_registry_started:
    description: Count realized in the current month (regardless of when the target
      is)
  count_is_stock_target_sale_agreement_signed_or_bank_legal_analysis_started_to_house_registry_started:
    description: Count stock for the current month (not realized and target is for
      this month or before)
  count_is_realized_without_advances_target_sale_agreement_signed_or_bank_legal_analysis_started_to_house_registry_started:
    description: Count is realized this month (target is for the current month or
      before)
  ? count_is_realized_without_advances_or_stock_target_sale_agreement_signed_or_bank_legal_analysis_started_to_house_registry_started
  : description: Count is stock or is realized this month (target is for the current
      month or before)
  count_is_realized_or_stock_target_sale_agreement_signed_or_bank_legal_analysis_started_to_house_registry_started:
    description: Count is realized this month (regardless of target date) OR is stock
      this month (target is this month or before). This is the broadest and encompasses
      all other.
