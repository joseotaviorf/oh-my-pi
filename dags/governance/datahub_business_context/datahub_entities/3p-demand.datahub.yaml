spec_version: 1
kind: data_product_curated_entity

product_display_name: "3P Demand"
product_description: |
  3P Demand is the demand-side sub-funnel of QuintoAndar's Marketplace (Broker XP) — the
  journey of a buyer or tenant brought into the platform by a partner imobiliária. Two business
  models: 3P Demand (TSC — partner brings buyer, is_3p_demand = TRUE) and 3P Lead Gen
  (CQA — QuintoAndar hands lead to partner agent, is_3p_lead_gen = TRUE). Focus is For Sale
  (Visit → Offer → CCV); For Rent 3P Demand is partially exposed (visit-level only).

  Default analytical scope: is_3p_demand = TRUE OR is_3p_lead_gen = TRUE OR is_3p_supply = TRUE
  (the "broad three-flag" scope). Restricting to only is_3p_demand OR is_3p_lead_gen excludes
  supply-only Marketplace rows (BM_3P_SUPPLY_1P_DEMAND_AGENT) and underestimates headline volumes.
  Narrow the scope only when the user explicitly requests a subset.

  Funnel entry — Buyer Prospect Window: a buyer enters the 3P funnel when their first booking
  materialises a window in dw_sale.dim_buyer_prospect_3p_history. Windows are typed as NBP
  (first window per demand_type for that buyer) or RBP (reactivation after ≥ 90 idle days).
  This table is demand-side only — no is_3p_supply_type exists. Use it as the top of funnel
  for all per-prospect analyses; it does not appear in fact_visits or fact_offers directly.

  Primary fact tables for For Sale: dw_sale.fact_visits (Visit Booked / Completed / Cancelled)
  and dw_sale.fact_offers (Offer Submitted → Accepted → CCV). Both carry is_3p_supply/demand/lead_gen
  and sk_broker_supply / sk_broker_demand. Bridge visits to offers via sk_booking (1:N — a booking
  can produce multiple offers). CCV is offer-grain: dim_sale_agreement is an attribute extension of
  fact_offers, not a separate fact.

  Two conversion measurement modes: coincident (same-period numerator and denominator — for volume
  / operational dashboards) and cohort (denominator bucketed by origin month, numerator accumulates
  cumulatively M0, M1, M2 ... — for true conversion-rate analyses). Always disclose the mode used
  and NULL right-censored cells on recent cohorts.

  Structural exception for demand-broker-grain queries (GROUP BY sk_broker_demand): is_3p_supply-only
  rows have sk_broker_demand = -1 and cannot be attributed. Use the two-flag filter in those cases.

  Further detail and table routing: docs/llm_context/business_entities/3p_demand.md

data_product_id: 3p-demand
domain_urn: urn:li:domain:growth

structured_property:
  qualified_name: br.com.quintoandar.datahub.3p-demand.golden_query
  legacy_qualified_names_to_drop:
    - br.com.quintoandar.datahub.3p-demand.golden_query_url

golden_query:
  stable_urn: urn:li:query:986f07a6-1d76-40f0-947b-53cb7c241dae
  name: "Query 1 — Stage-conversion rates split by 3P configuration"
  description: >-
    Conversion across the canonical funnel (VB → VC → OS → OA → CCV) per 3P configuration,
    using COUNT FILTER on per-stage timestamps from fact_visits and fact_offers. Default
    three-flag scope; configurations derived from is_3p_supply/demand/lead_gen.
    Source: docs/llm_context/business_entities/3p_demand.md
  subjects:
    - schema: dw_sale
      table: fact_visits
    - schema: dw_sale
      table: fact_offers
  sql: |
    WITH config AS (
        SELECT
            sk_booking,
            sk_visit,
            is_3p_demand,
            is_3p_lead_gen,
            is_3p_supply,
            ts_booking_created,
            ts_visit_completed
        FROM dw_sale.fact_visits
        WHERE is_3p_demand = TRUE OR is_3p_lead_gen = TRUE OR is_3p_supply = TRUE
    ),
    visit_metrics AS (
        SELECT
            CASE
                WHEN is_3p_demand   AND     is_3p_supply  THEN '3P_DEMAND + 3P_SUPPLY'
                WHEN is_3p_demand   AND NOT is_3p_supply  THEN '3P_DEMAND + 1P_SUPPLY'
                WHEN is_3p_lead_gen AND     is_3p_supply  THEN '3P_LEAD_GEN + 3P_SUPPLY'
                WHEN is_3p_lead_gen AND NOT is_3p_supply  THEN '3P_LEAD_GEN + 1P_SUPPLY'
                WHEN is_3p_supply   AND NOT is_3p_demand AND NOT is_3p_lead_gen THEN '3P_SUPPLY + 1P_DEMAND'
            END                                                              AS three_p_configuration,
            COUNT(*) FILTER (WHERE ts_booking_created  IS NOT NULL)          AS visits_booked,
            COUNT(*) FILTER (WHERE ts_visit_completed  IS NOT NULL)          AS visits_completed
        FROM config
        GROUP BY 1
    ),
    offer_metrics AS (
        SELECT
            CASE
                WHEN o.is_3p_demand   AND     o.is_3p_supply  THEN '3P_DEMAND + 3P_SUPPLY'
                WHEN o.is_3p_demand   AND NOT o.is_3p_supply  THEN '3P_DEMAND + 1P_SUPPLY'
                WHEN o.is_3p_lead_gen AND     o.is_3p_supply  THEN '3P_LEAD_GEN + 3P_SUPPLY'
                WHEN o.is_3p_lead_gen AND NOT o.is_3p_supply  THEN '3P_LEAD_GEN + 1P_SUPPLY'
                WHEN o.is_3p_supply   AND NOT o.is_3p_demand AND NOT o.is_3p_lead_gen THEN '3P_SUPPLY + 1P_DEMAND'
            END                                                              AS three_p_configuration,
            COUNT(*) FILTER (WHERE o.ts_offer_submitted       IS NOT NULL)   AS offers_submitted,
            COUNT(*) FILTER (WHERE o.ts_offer_accepted        IS NOT NULL)   AS offers_accepted,
            COUNT(*) FILTER (WHERE o.ts_sale_agreement_signed IS NOT NULL)   AS ccvs_signed
        FROM dw_sale.fact_offers AS o
        WHERE o.is_3p_demand = TRUE OR o.is_3p_lead_gen = TRUE OR o.is_3p_supply = TRUE
        GROUP BY 1
    )
    SELECT
        COALESCE(v.three_p_configuration, o.three_p_configuration) AS three_p_configuration,
        v.visits_booked,
        v.visits_completed,
        o.offers_submitted,
        o.offers_accepted,
        o.ccvs_signed
    FROM       visit_metrics AS v
    FULL JOIN  offer_metrics AS o USING (three_p_configuration)
    ORDER BY v.visits_booked DESC NULLS LAST

datasets:
  - schema: dw_sale
    table: dim_buyer_prospect_3p_history
  - schema: dw_sale
    table: fact_visits
  - schema: dw_sale
    table: fact_offers
  - schema: dw_sale
    table: dim_offer
  - schema: dw_sale
    table: dim_sale_agreement
  - schema: dw_sale
    table: fact_buyer_prospects
  - schema: dw_sale
    table: fact_sale_demand_event
  - schema: dw_sale
    table: dim_sale_event_type
  - schema: dw_sale
    table: dim_buyer_prospect_type
  - schema: dw_visit
    table: fact_visits
  - schema: dw_visit
    table: dim_visit
  - schema: dw_visit
    table: fact_visit_events
  - schema: dw_visit
    table: fact_visit_schedules
  - schema: dw_visit
    table: dim_post_visit_demand
  - schema: dw_visit
    table: dim_visit_funnel
  - schema: dw_public
    table: dim_booking

glossary_terms:
  parent_node_urn: urn:li:glossaryNode:growth
  terms:
    - id: buyer_prospect_3p
      name: "Buyer Prospect (3P)"
      description: >-
        A For Sale buyer who has at least one scheduled visit in the 3P demand funnel. Tracked
        in dw_sale.dim_buyer_prospect_3p_history (SCD2). Each row is one window: (sk_buyer,
        demand_type, version). Do not use dim_sale_agreement.is_3p_demand alone to identify
        these — the table lacks is_3p_lead_gen and is not prospect-grain.
    - id: nbp_new_buyer_prospect
      name: "NBP (New Buyer Prospect)"
      description: >-
        The first window a buyer has ever opened for a given demand_type in the 3P funnel.
        buyer_prospect_type = 'NBP', always version = 1 per (sk_buyer, demand_type).
        The window is materialised by the first booking (VISIT-sourced) or a CRM-side
        prospect declaration (BUYER_COMPANY_RELATION). Distinct from is_buyer_first_offer.
      related_terms:
        - urn: urn:li:glossaryTerm:buyer_prospect_3p
          relationship: isA
    - id: rbp_recovery_buyer_prospect
      name: "RBP (Recovery Buyer Prospect)"
      description: >-
        A reactivation window opened after the buyer has been idle for ≥ 90 days since their
        last event in that demand_type. buyer_prospect_type = 'RBP', version ≥ 2.
      related_terms:
        - urn: urn:li:glossaryTerm:buyer_prospect_3p
          relationship: isA
    - id: visit_booked_vb
      name: "VB (Visit Booked)"
      description: >-
        A visit booking created for a 3P transaction. Source: dw_sale.fact_visits.ts_booking_created.
        Abbreviation VB in dim_sale_event_type. Only bookings with dim_booking.type = 'Visita'
        count for the demand funnel — filter out Vistoria, SessaoFotos, CheckUpLar.
    - id: visit_completed_vc
      name: "VC (Visit Completed)"
      description: >-
        A visit that was successfully completed. Source: dw_sale.fact_visits.ts_visit_completed IS NOT NULL.
        Abbreviation VC in dim_sale_event_type. The most common cohort metric for operational quality
        (VB2VC rate).
    - id: ccv_sale_agreement_signed
      name: "CCV (Compromisso de Compra e Venda / Sale Agreement Signed)"
      description: >-
        The terminal success event — all parties signed the sale agreement. Source: dw_sale.fact_offers.ts_sale_agreement_signed.
        Abbreviation CCV in dim_sale_event_type. CCV is offer-grain: dim_sale_agreement extends
        fact_offers via sk_offer, not a separate fact. Note: dim_sale_agreement lacks is_3p_lead_gen —
        bridge via fact_offers to identify Lead Gen CCVs.
    - id: coincident_vs_cohort_views
      name: "Coincident vs Cohort Conversion Views"
      description: >-
        Two valid modes for every conversion metric in 3P Demand. Coincident: same-period numerator
        and denominator — for volume / share / operational dashboards. Cohort: denominator bucketed
        by origin month, numerator cumulates across M0, M1, M2 ... — for true conversion-rate
        analyses. Always disclose the mode and NULL right-censored columns (do not zero-fill).
    - id: broad_three_flag_scope
      name: "Default 3P Scope (three flags)"
      description: >-
        The working definition of a Marketplace-touched transaction: is_3p_demand = TRUE OR
        is_3p_lead_gen = TRUE OR is_3p_supply = TRUE. Restricting to only is_3p_demand OR
        is_3p_lead_gen excludes BM_3P_SUPPLY_1P_DEMAND_AGENT rows and underestimates headline
        volumes. Narrow only when the user is explicit or when the structural exception applies
        (GROUP BY sk_broker_demand).

