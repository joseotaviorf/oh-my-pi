spec_version: 1
kind: data_product_curated_entity

product_display_name: Customer Support Contacts
product_description: |
  A contact is a direct interaction between a customer and a support agent — either a call or
  a chat session. Contacts are the real-time component of the Support & Services domain,
  representing the Front Office side of operations.

  Contacts flow through the following system architecture:
  1. Customer initiates contact via call or chat
  2. Calls go through BigFone (IVR / call management) → Twilio (real-time handling)
  3. Chats go through Greenseer/Wall-E (chatbots) → if escalated, Sauron session → Twilio
     (real-time handling)
  4. At the end of every Front Office interaction, a ticket is generated in Zendesk

  Further detail and table routing: docs/llm_context/business_entities/contact.md

data_product_id: customer-support-contacts
domain_urn: urn:li:domain:support_and_services

structured_property:
  qualified_name: br.com.quintoandar.datahub.customer_support_contacts.golden_query
  legacy_qualified_names_to_drop:
    - br.com.quintoandar.datahub.customer_support_contacts.golden_query_url

golden_query:
  stable_urn: urn:li:query:30e8c511-5006-4c35-b2c4-2bfa8e538cc9
  name: "Query 1 — Unified contacts with channel and status"
  description: >-
    All customer contacts (calls + chats) with channel and department context.
    Source: docs/llm_context/business_entities/contact.md
  subjects:
    - schema: dw_customer_support
      table: fact_customer_contacts
    - schema: dw_customer_support
      table: dim_channel
    - schema: dw_customer_support
      table: dim_department
  sql: |
    SELECT DISTINCT
        fc.*,
        dc.channel AS channel_dim,
        dc.direction,
        dd.department,
        dd.journey_step
    FROM dw_customer_support.fact_customer_contacts AS fc
    LEFT JOIN dw_customer_support.dim_channel AS dc
        ON fc.channel = dc.channel
    LEFT JOIN dw_customer_support.dim_department AS dd
        ON fc.sk_department = dd.sk_department
    WHERE fc.ts_task_created >= TIMESTAMP '2025-01-01'

datasets:
  - schema: datalake_chatbot
    table: messages
  - schema: datalake_chatbot
    table: sessions
  - schema: datalake_customer_support
    table: calls
  - schema: datalake_customer_support
    table: chat_aht
  - schema: datalake_customer_support
    table: chats
  - schema: datalake_customer_support
    table: ivr_interactions
  - schema: dw_customer_support
    table: dim_channel
  - schema: dw_customer_support
    table: dim_chatbot
  - schema: dw_customer_support
    table: dim_department
  - schema: dw_customer_support
    table: fact_chat_messages
  - schema: dw_customer_support
    table: fact_chat_metrics
  - schema: dw_customer_support
    table: fact_customer_contacts
  - schema: dw_customer_support
    table: fact_ivr_interactions
  - schema: dw_customer_support
    table: fact_task_metrics
  - schema: dw_customer_support
    table: fact_user_blocks

documentation_link:
  label: Business entity documentation (contact.md)
  url: >-
    https://github.com/quintoandar/bi-etl-ejuice/blob/master/docs/llm_context/business_entities/contact.md

glossary_terms:
  parent_node_urn: urn:li:glossaryNode:customer_support
  terms:
    - id: contact_entity
      name: "Contact (Contato / Atendimento)"
      description: >-
        A direct interaction between a customer and a support agent — either a call or a
        chat session. Contacts are the real-time (Front Office) unit of Support & Services.
        Also called contato, atendimento, or interação. Table: dw_customer_support.fact_customer_contacts.
    - id: contact_call
      name: "Call (Ligação / Chamada)"
      description: >-
        A voice contact routed through BigFone (IVR) and Twilio. The billing unit is a
        reservation — a new reservation is created each time the call transfers to a different
        analyst. Table: dw_customer_support.fact_customer_contacts (channel = 'call').
      related_terms:
        - urn: urn:li:glossaryTerm:contact_entity
          relationship: isA
    - id: contact_chat
      name: "Chat (Conversa / Bate-Papo)"
      description: >-
        A text contact via WhatsApp or in-app chat, routed through Greenseer/Wall-E bots and
        Twilio. The billing unit is a task — each client-to-analyst interaction is a task.
        Table: dw_customer_support.fact_customer_contacts (channel = 'chat').
      related_terms:
        - urn: urn:li:glossaryTerm:contact_entity
          relationship: isA
    - id: contact_escalation
      name: "Escalation (Escalação / Transbordo)"
      description: >-
        A chatbot interaction that could not be resolved automatically and was transferred to
        a human agent (Twilio). A Sauron session is created. Contrast with retention (no human).
      related_terms:
        - urn: urn:li:glossaryTerm:contact_entity
          relationship: hasA
    - id: contact_retention
      name: "Retention (Retenção)"
      description: >-
        A chatbot interaction resolved without human intervention — no Sauron session created.
        Tracked in datalake_chatbot.sessions. Not included in fact_customer_contacts.
      related_terms:
        - urn: urn:li:glossaryTerm:contact_entity
          relationship: isA
