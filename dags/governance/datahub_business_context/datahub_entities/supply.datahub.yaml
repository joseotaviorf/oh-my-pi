spec_version: 1
kind: data_product_curated_entity

product_display_name: "Supply"
product_description: |
  Supply represents all channels and products QuintoAndar uses to acquire property owners
  and generate new listings on the platform, covering both for-rent (RENT) and for-sale
  (SALE) contexts. It tracks the owner journey from initial lead capture through a
  six-stage funnel to the creation of the first active listing.

  Six-stage lifecycle (cd_funnel_step):
  1. lead — owner contact is registered.
  2. prospect — lead is validated; prospecting begins.
  3. qualified — property evaluated and considered eligible.
  4. av_qualified — property availability confirmed.
  5. opportunity — lead ready for listing activation.
  6. first_listing — first property listing is created.

  Leads may be discarded at any step, reprocessed through recovery flows, or accelerated
  by operations. RENT and SALE flows are tracked separately via nm_business_context.

  Primary analytical table: dw_growth.obt_supply (1 row per lead × funnel step × business
  context). Start here for most funnel analyses.

  Acquisition channels (acquisition_origin):
  - rede / 3P: third-party broker network.
  - ciq: in-house broker agents (CIQ).
  - 1P: QuintoAndar-owned channels (ownerlanding, homelanding, ownerpropertyregistration,
    price calculators, referrals).
  - operations: IS team or Isaias bot (NEVER use acquisition_origin='operations' to identify
    Isaias — use tp_origin_acquisition = 'isaias').

  Isaias three lead populations (NEVER conflate them):
  - Created: tp_origin_acquisition = 'isaias' (bot originated the lead).
  - Retrieved: any lead in isaias_conversational_flow.id_lead_retrieved (bot re-engaged
    a lead from any origin).
  - Touchpoint (union): created OR retrieved.

  Company report origin (company_report_origin): canonical channel label for dashboards.
  Reads acquisition_origin for early funnel (lead/prospect) and conversion_origin for
  qualified+. Prefer this field for channel-level reporting.

  Table grain:
  - obt_supply: 1 row per lead × funnel step × business context (full refresh daily).
    Default starting point.
  - fact_supply_events: 1 row per supply event; links to all dim tables via sk_* keys.
  - dim_funnel_step: funnel step labels and order (cd_funnel_step, funnel_order).
  - dim_supply_discards: discard reason descriptions.

  Conversion methods:
  - Coincident date (default): anchor on the date the conversion event occurred
    (obt.date where cd_funnel_step = 'opportunity' or 'first_listing').
  - Cohort (explicit request only): anchor on the date the lead was created.

  Critical rules:
  - Always filter nm_business_context ('RENT' or 'SALE') when the question is modality-specific.
  - sk_chat_session in obt_supply is VARCHAR (sentinel '-1' for no session).
  - source_environment filter for Isaias sessions: use ONLY the explicit list of environment
    values — NEVER use LIKE '%isaias%'. Full list in supply.md.
  - is_full_process must be derived from Langfuse orchestrator_init observation, not from
    isaias_conversational_flow.is_full_process (incomplete for historical sessions).
  - Never use acquisition_origin = 'operations' to identify Isaias leads — it groups Isaias
    with other ops channels. Use tp_origin_acquisition = 'isaias'.
  - Session-based metrics require the UNION ALL event-ledger pattern (see Golden Query 7 in MD).

  Query 2 (Isaias conversion analysis) and further queries in source doc.

  Further detail and table routing: docs/llm_context/business_entities/supply.md

data_product_id: supply
domain_urn: urn:li:domain:growth

structured_property:
  qualified_name: br.com.quintoandar.datahub.supply.golden_query
  legacy_qualified_names_to_drop:
    - br.com.quintoandar.datahub.supply.golden_query_url

golden_query:
  stable_urn: urn:li:query:d2200c86-3938-402c-9586-15d16d6b771b
  name: "Query 1 — Funnel breakdown by channel and business context"
  description: >-
    Supply funnel with counts per stage, broken down by company_report_origin and
    nm_business_context. Uses obt_supply. Start with coincident-date conversion (default).
    Source: docs/llm_context/business_entities/supply.md
  subjects:
    - schema: dw_growth
      table: obt_supply
  sql: |
    SELECT
        DATE_TRUNC('month', obt.date) AS month_ref,
        obt.nm_business_context,
        obt.company_report_origin,
        obt.cd_funnel_step,
        COUNT(DISTINCT obt.sk_lead) AS total_leads
    FROM dw_growth.obt_supply AS obt
    WHERE obt.date >= DATE '2025-01-01'
        AND obt.nm_business_context = 'RENT'
    GROUP BY 1, 2, 3, 4
    ORDER BY 1 DESC, 4

datasets:
  - schema: dw_growth
    table: obt_supply
  - schema: dw_growth
    table: fact_supply_events
  - schema: dw_growth
    table: dim_acquisition_lead
  - schema: dw_growth
    table: dim_funnel_step
  - schema: dw_growth
    table: dim_supply_discards
  - schema: datalake_chatbot
    table: isaias_conversational_flow

glossary_terms:
  parent_node_urn: urn:li:glossaryNode:growth
  terms:
    - id: supply_entity
      name: "Supply (Captação / Aquisição de Proprietários)"
      description: >-
        The owner acquisition funnel that tracks property owners from lead capture through
        the first active listing. Also called captação or aquisição de proprietários.
        Primary table: dw_growth.obt_supply. Covers both RENT and SALE contexts.
    - id: supply_lead
      name: "Lead (Supply)"
      description: >-
        An owner who expressed interest; the earliest funnel stage.
        cd_funnel_step = 'lead'. Distinct from a marketing lead — this is the first
        registered owner contact in the supply funnel.
      related_terms:
        - urn: urn:li:glossaryTerm:supply_entity
          relationship: hasA
    - id: supply_opportunity
      name: "Oportunidade (Supply Opportunity)"
      description: >-
        A qualified lead ready to list the property. cd_funnel_step = 'opportunity'.
        The operational threshold between qualification and listing activation. Also called
        oportunidade in Portuguese.
      related_terms:
        - urn: urn:li:glossaryTerm:supply_entity
          relationship: hasA
    - id: supply_first_listing
      name: "Primeira Captação (First Listing)"
      description: >-
        The moment the first property listing is created and published.
        cd_funnel_step = 'first_listing'. The final funnel conversion event and the
        primary L2FL (Lead to First Listing) outcome metric.
      related_terms:
        - urn: urn:li:glossaryTerm:supply_entity
          relationship: hasA
    - id: supply_ciq
      name: "CIQ (In-House Broker Channel)"
      description: >-
        QuintoAndar's in-house broker agent channel. acquisition_origin = 'ciq' or
        nm_supply_source = 'CIQ'. Agents in the CIQ channel directly prospect and
        qualify property owners.
      related_terms:
        - urn: urn:li:glossaryTerm:supply_entity
          relationship: hasA
    - id: supply_1p
      name: "1P (First-Party Channels)"
      description: >-
        QuintoAndar-owned acquisition channels: owner landing pages (ownerlanding,
        homelanding), owner property registration, price calculators, and referrals (Indica Aí).
        nm_supply_source = '1P'. Contrast with 3P (rede) which is the broker partner network.
      related_terms:
        - urn: urn:li:glossaryTerm:supply_entity
          relationship: hasA
    - id: supply_rede_3p
      name: "Rede / 3P (Third-Party Broker Network)"
      description: >-
        Third-party broker partner network acquisition channel. acquisition_origin = 'rede'
        or nm_supply_source = '3P'. For detailed 3P analysis, use the 3P Supply entity
        (dw_3p_supply schema).
      related_terms:
        - urn: urn:li:glossaryTerm:supply_entity
          relationship: hasA
    - id: supply_descarte
      name: "Descarte (Discard)"
      description: >-
        A lead dropped from the supply funnel at any stage. Reason codes in
        dw_growth.dim_supply_discards (cd_discard_reason → human-readable description).
        Discarded leads may be re-entered via reprocessamento (recovery flow).
      related_terms:
        - urn: urn:li:glossaryTerm:supply_entity
          relationship: hasA
    - id: supply_reprocessamento
      name: "Reprocessamento (Recovery Flow)"
      description: >-
        A discarded lead re-entered into the supply funnel. tp_reprocessing column in
        obt_supply. company_report_origin = 'Reprocessamento' when tp_reprocessing != '-1'.
      related_terms:
        - urn: urn:li:glossaryTerm:supply_entity
          relationship: hasA
    - id: supply_company_report_origin
      name: "Company Report Origin"
      description: >-
        Canonical channel label for management dashboards. Combines acquisition_origin
        (for early funnel: lead/prospect) and conversion_origin (for qualified+) into a
        single human-readable channel. Use this for channel-level reporting in dashboards.
        For granular sub-segmentation, use planning_cluster.

documentation_link:
  label: "Business entity documentation (supply.md)"
  url: >-
    https://github.com/quintoandar/bi-etl-ejuice/blob/master/docs/llm_context/business_entities/supply.md
