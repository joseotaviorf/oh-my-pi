spec_version: 1
kind: data_product_curated_entity

product_display_name: "Ticket (Customer Support)"
product_description: |
  A ticket is a customer support request tracked in Zendesk and the central entity of the
  Support & Services (S&S) domain. Virtually every S&S metric, dashboard, and operational
  workflow is anchored to a ticket.

  Ticket creation channels:
  - Email: customer sends an email; Zendesk creates the ticket directly.
  - Call: after a phone interaction (IVR / BigFone → Twilio); BigFone generates the ticket.
  - Chat (in-app or WhatsApp): after a chat interaction; QuintoMessenger generates the ticket.
  - Internal / API: some tickets are created programmatically by internal systems.

  Operational categories:
  - Front Office (FO): real-time interactions (calls and chats handled via Twilio). A ticket is
    generated in Zendesk at the end of every Front Office interaction.
  - Back Office (BO): demands requiring longer analysis time (repairs, payments, operational
    processes). Handled asynchronously.
  Filter column: fact_tickets.front_or_back.

  Taxonomy system: analysts manually classify each resolved ticket into theme (macro) and
  theme_detail (micro). This classification drives SLA targets and ticket rate weights.
  The taxonomy lifecycle system is called Hogwarts. Taxonomies are defined in the "Central
  Ops" spreadsheet. SLA follows hierarchy: tag > theme > journey.

  Table grain:
  - fact_tickets: 1 row per ticket (central entity).
  - dim_ticket: 1 row per ticket (descriptive attributes: tags, status, subject).
  - fact_ticket_events: 1 row per ticket state change event.
  - fact_tickets_backlog: 1 row per ticket per day (while open, for SLA breach tracking).
  - dim_taxonomy: 1 row per taxonomy classification; join via sk_taxonomy.

  Key joins:
  - fact_tickets ft + dim_ticket dt ON ft.sk_ticket = dt.sk_ticket
  - fact_tickets ft + dim_taxonomy dtx ON ft.sk_taxonomy = dtx.sk_taxonomy
  - fact_tickets ft + dim_department dd ON ft.sk_main_department = dd.sk_department
  - fact_tickets ft + dim_analyst da ON ft.sk_last_analyst = da.sk_analyst

  Key metrics: ticket volume (by ts_created or ts_closed), DSAT (metric_ss__tickets.dsat),
  FCR — First Contact Resolution (metric_ss__tickets.fcr), recontact rate
  (metric_ss__tickets.recontact), escalation rate (metric_ss__tickets.escalation),
  SLA compliance (fact_tickets_backlog.is_backlog_within_sla), ticket rate weight
  (fact_tickets.ticket_rate_weight), taxonomy coverage (% tickets with sk_taxonomy filled),
  DSAT by taxonomy (dim_taxonomy.theme/theme_detail).

  Critical rules:
  - Use sk_main_department (not sk_department) for dim_department joins.
  - Use sk_last_analyst or sk_first_analyst (not sk_analyst) for dim_analyst joins.
  - Taxonomy columns in dim_taxonomy are 'theme' and 'theme_detail' — NOT 'taxonomy_macro'
    or 'taxonomy_micro'.
  - fact_ticket_csat.id_ticket == fact_tickets.sk_ticket (same value, different column names).
  - NEVER use dw_customer_support.fact_sessions_chatbot — it is deprecated. Use
    datalake_chatbot.sessions for chatbot behavior and session-grain analysis.
  - Offboarding queues have a 21-day SLA by default.

  Query 2 (Ticket volume and SLA compliance by theme) from source doc:
    SELECT dtx.theme, dtx.theme_detail, dtx.journey,
        COUNT(*) AS total_tickets,
        AVG(CAST(ft.is_ticket_rate AS INTEGER)) AS ticket_rate_pct
    FROM dw_customer_support.fact_tickets AS ft
    LEFT JOIN dw_customer_support.dim_taxonomy AS dtx
        ON ft.sk_taxonomy = dtx.sk_taxonomy
    WHERE ft.ts_created >= DATE '2025-01-01'
    GROUP BY dtx.theme, dtx.theme_detail, dtx.journey
    ORDER BY total_tickets DESC

  Further detail and table routing: docs/llm_context/business_entities/ticket.md

data_product_id: ticket
domain_urn: urn:li:domain:support_and_services

structured_property:
  qualified_name: br.com.quintoandar.datahub.ticket.golden_query
  legacy_qualified_names_to_drop:
    - br.com.quintoandar.datahub.ticket.golden_query_url

golden_query:
  stable_urn: urn:li:query:13d5e9f0-96c3-4ed4-be3d-da906784ebce
  name: "Query 1 — Base ticket pattern with descriptive attributes"
  description: >-
    Standard ticket base with taxonomy, department, and channel context. Central starting
    point for S&S analytics. Includes first and last CSAT scores directly from fact_tickets.
    Source: docs/llm_context/business_entities/ticket.md
  subjects:
    - schema: dw_customer_support
      table: fact_tickets
    - schema: dw_customer_support
      table: dim_ticket
    - schema: dw_customer_support
      table: dim_taxonomy
    - schema: dw_customer_support
      table: dim_department
  sql: |
    SELECT
        ft.sk_ticket,
        ft.sk_contract,
        ft.sk_first_analyst,
        ft.sk_last_analyst,
        ft.channel,
        ft.front_or_back,
        ft.csat_score,
        ft.first_csat_score,
        ft.is_ticket_rate,
        ft.ticket_rate_weight,
        dt.status,
        dt.tags,
        dtx.theme,
        dtx.theme_detail,
        dtx.journey,
        dtx.sub_journey,
        dd.department,
        dd.journey_step,
        ft.ts_created,
        ft.ts_closed
    FROM dw_customer_support.fact_tickets AS ft
    LEFT JOIN dw_customer_support.dim_ticket AS dt
        ON ft.sk_ticket = dt.sk_ticket
    LEFT JOIN dw_customer_support.dim_taxonomy AS dtx
        ON ft.sk_taxonomy = dtx.sk_taxonomy
    LEFT JOIN dw_customer_support.dim_department AS dd
        ON ft.sk_main_department = dd.sk_department
    WHERE ft.ts_created >= DATE '2025-01-01'

datasets:
  - schema: dw_customer_support
    table: fact_tickets
  - schema: dw_customer_support
    table: dim_ticket
  - schema: dw_customer_support
    table: fact_ticket_events
  - schema: dw_customer_support
    table: fact_tickets_backlog
  - schema: dw_customer_support
    table: dim_taxonomy
  - schema: dw_customer_support
    table: dim_department
  - schema: dw_customer_support
    table: dim_analyst

glossary_terms:
  parent_node_urn: urn:li:glossaryNode:customer_support
  terms:
    - id: ticket_support
      name: "Ticket (Support Request)"
      description: >-
        A customer support request tracked in Zendesk. Central entity of the S&S domain.
        Also called chamado, solicitação, or demanda. Table: dw_customer_support.fact_tickets.
    - id: ticket_front_office
      name: "Front Office (FO)"
      description: >-
        Real-time support interactions handled via Twilio — calls (IVR/BigFone) and chats
        (in-app/WhatsApp). A Zendesk ticket is generated at the end of every FO interaction.
        Filter: fact_tickets.front_or_back = 'Front Office'.
      related_terms:
        - urn: urn:li:glossaryTerm:ticket_support
          relationship: hasA
    - id: ticket_back_office
      name: "Back Office (BO)"
      description: >-
        Asynchronous support demands requiring longer analysis — repairs, payments, operational
        processes. Handled via Zendesk tickets without real-time interaction.
        Filter: fact_tickets.front_or_back = 'Back Office'.
      related_terms:
        - urn: urn:li:glossaryTerm:ticket_support
          relationship: hasA
    - id: ticket_chamado
      name: "Chamado / Solicitação / Demanda"
      description: >-
        Portuguese synonyms for ticket. All three terms map to the Zendesk ticket entity
        (dw_customer_support.fact_tickets). 'Chamado' is the most common operational term.
      related_terms:
        - urn: urn:li:glossaryTerm:ticket_support
          relationship: isA
    - id: ticket_back_ticket
      name: "Back-Ticket"
      description: >-
        A follow-up ticket linked to a previously resolved ticket, indicating unresolved
        issues or escalations. Signals recurring contact for the same issue. Used in
        recontact rate measurement (metric_ss__tickets.recontact).
    - id: ticket_taxonomy_hogwarts
      name: "Taxonomy / Hogwarts"
      description: >-
        The topic classification system applied to tickets by analysts (theme → theme_detail).
        Hogwarts is the internal system that governs taxonomy lifecycle (active/inactive) and
        surfaces available classification options to analysts in the ticket interface.
        Taxonomies are defined in the "Central Ops" spreadsheet. Taxonomy drives SLA targets
        and ticket_rate_weight. Columns in dim_taxonomy: theme (macro), theme_detail (micro).
    - id: ticket_fcr
      name: "FCR (First Contact Resolution)"
      description: >-
        Percentage of tickets resolved on the first contact, without requiring a follow-up.
        Pre-aggregated in metric_ss__tickets.fcr. High FCR indicates efficient resolution;
        low FCR indicates complex issues or poor resolution quality.
    - id: ticket_recontact
      name: "Recontact Rate"
      description: >-
        Rate of customers who contact support more than once for the same unresolved issue.
        Related to back-tickets. Pre-aggregated in metric_ss__tickets.recontact. Indicates
        unresolved issues that require multiple interactions.
    - id: ticket_rate
      name: "Ticket Rate"
      description: >-
        A weight assigned to each ticket based on its taxonomy and channel, used to
        normalize analyst performance metrics. Complex tickets (high ticket_rate_weight)
        earn more credit. Flags: fact_tickets.is_ticket_rate (whether this ticket counts)
        and fact_tickets.ticket_rate_weight (numeric weight value).
    - id: ticket_sla
      name: "SLA (Ticket)"
      description: >-
        Service Level Agreement target for ticket resolution time. SLA resolution hierarchy:
        tag-level SLA (most specific) > theme-level SLA > journey-level SLA. Offboarding
        queues have a default 21-day SLA. Daily breach tracking: fact_tickets_backlog
        (is_backlog_within_sla). SLA targets are sourced from gsheets_clean.taxonomy_sla.

