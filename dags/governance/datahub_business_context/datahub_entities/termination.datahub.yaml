spec_version: 1
kind: data_product_curated_entity

product_display_name: "Termination"
product_description: |
  A termination represents the formal process of ending a rental contract at QuintoAndar.
  It is one of the most complex journeys in the platform, spanning multiple stages and
  involving tenant, landlord, and QuintoAndar operations.

  Termination lifecycle:
  1. Termination request — tenant initiates the process (fact_terminations.ts_termination_request).
  2. Fee calculation — early termination fees and discounts are determined
     (fact_terminations.fee_final_amount, fee_discount_percentage).
  3. Exit inspection — technical property inspection linked via fact_terminations.sk_exit_inspection.
  4. Repair analysis — damages go through AR (Automatic Repair), Review, and AC (Contestation
     Analysis) stages.
  5. Report review and budget approval — landlord and tenant review and approve the final report.
  6. Mediation (when needed) — human mediator resolves disputes
     (dim_termination.has_mediation_ticket).
  7. Vacancy and relisting — property is vacated; may be relisted via fact_house_listing_terminations.
  8. Termination closure — process finalized (fact_terminations.ts_termination_finished).

  Not all terminations follow every step. Some are canceled, some skip inspection (opt-out),
  and some are resolved quickly through early agreements.

  Table grain:
  - fact_terminations: 1 row per termination (core entity).
  - dim_termination: 1 row per termination (descriptive: status, reason, category).
  - obt_offboarding: 1 row per termination, pre-joined with inspection + repairs + report +
    discounts/bandaid + mediation + agreement. Use this for cross-entity queries without manual JOINs.
    Note: obt_offboarding already filters out CANCELED terminations.
  - fact_house_listing_terminations: relisting (sk_next_house_listing_consolidated <> -1) and
    rerental (sk_next_contract <> -1) funnel after termination.

  Three critical date columns:
  - ts_termination_request: when the tenant requested termination.
  - dt_termination: planned vacancy date.
  - ts_termination_finished: when the process was closed.

  Key metrics: termination volume per month, termination reason distribution
  (dim_termination.termination_reason), mediation rate (has_mediation_ticket), average time
  from request to vacancy (leadtime_request_to_vacancy), terminations with tenant repairs
  (has_repairs), relisting rate (is_relisting), end-to-end leadtime (obt_offboarding.leadtime_total).

  Critical rules:
  - Always filter dim_termination.status <> 'CANCELED' for effective volume.
  - Use obt_offboarding for cross-entity data — avoid rebuilding the multi-table JOIN manually.
  - For bandaid analysis: filter has_discount_agreement = TRUE in obt_offboarding.
    model_discount_type distinguishes AUTOMATIC_BANDAID (instant) vs OFFERED_DISCOUNT (approval
    required), but both are the same "bandaid" product feature.
  - Inspection JOINs require CAST rule and Dedup rule — see Inspection entity.

  Further detail and table routing: docs/llm_context/business_entities/termination.md

data_product_id: termination
domain_urn: urn:li:domain:for_rent

structured_property:
  qualified_name: br.com.quintoandar.datahub.termination.golden_query
  legacy_qualified_names_to_drop:
    - br.com.quintoandar.datahub.termination.golden_query_url

golden_query:
  stable_urn: urn:li:query:e1867757-282a-4440-b31e-935ea1b0925b
  name: "Query 1 — obt_offboarding with contract details"
  description: >-
    Terminations with inspection, repair, and contract context using obt_offboarding
    (pre-joined, no manual JOINs needed). Excludes CANCELED terminations (already filtered
    in obt). Source: docs/llm_context/business_entities/termination.md
  subjects:
    - schema: dw_offboarding
      table: obt_offboarding
    - schema: dw_rent
      table: dim_contract_person
  sql: |
    SELECT
        obt.sk_termination,
        obt.sk_contract,
        obt.ts_termination_request,
        obt.dt_termination,
        obt.ts_termination_finished,
        obt.leadtime_total,
        obt.has_repairs,
        obt.has_agreement,
        obt.final_tenant_inspection_cost,
        obt.has_discount_agreement,
        obt.model_discount_type,
        obt.is_relisting,
        dcp.person_name AS tenant_name
    FROM dw_offboarding.obt_offboarding AS obt
    LEFT JOIN dw_rent.dim_contract_person AS dcp
        ON obt.sk_contract = dcp.sk_contract
        AND dcp.person_type = 'TENANT'
    WHERE obt.ts_termination_finished >= DATE '2025-01-01'

datasets:
  - schema: dw_offboarding
    table: fact_terminations
  - schema: dw_offboarding
    table: dim_termination
  - schema: dw_offboarding
    table: obt_offboarding
  - schema: dw_offboarding
    table: fact_house_listing_terminations
  - schema: datalake_terminator
    table: termination
  - schema: datalake_offboarding
    table: mediations
  - schema: datalake_offboarding
    table: nps_agg
  - schema: datalake_inspections
    table: automatic_discounts

glossary_terms:
  parent_node_urn: urn:li:glossaryNode:offboarding
  terms:
    - id: termination_entity
      name: "Termination (Rescisão / Distrato)"
      description: >-
        The formal process of ending a rental contract at QuintoAndar. Also called
        rescisão, distrato, or cancelamento de contrato. Tracked in
        dw_offboarding.fact_terminations + dim_termination.
    - id: termination_rescisao
      name: "Rescisão / Distrato / Cancelamento"
      description: >-
        Portuguese synonyms for termination. Rescisão is the most common legal term;
        distrato is used when both parties mutually agree; cancelamento de contrato is
        the generic form. All map to dw_offboarding.fact_terminations.
      related_terms:
        - urn: urn:li:glossaryTerm:termination_entity
          relationship: isA
    - id: offboarding_journey
      name: "Offboarding"
      description: >-
        Context-dependent term. In quantitative questions ('how many offboardings?'), treat
        as synonym for termination. In organizational contexts, offboarding refers to the
        broader journey encompassing termination, exit inspection, repair reports, relisting,
        and other post-termination processes. Table: dw_offboarding.
    - id: termination_bandaid
      name: "Bandaid (Automatic Discount)"
      description: >-
        ML-driven discount system that automatically reduces the tenant's repair cost during
        offboarding to expedite resolution. ALL bandaids are automatic (product-driven).
        Filter: has_discount_agreement = TRUE in obt_offboarding.
        model_discount_type distinguishes AUTOMATIC_BANDAID (instant) vs OFFERED_DISCOUNT
        (offered for approval) — both are the same product. Do NOT filter by model_discount_type
        for generic 'bandaid' questions. For discount details: datalake_inspections.automatic_discounts
        (enrich) via uuid_inspection.
    - id: automatic_bandaid
      name: "AUTOMATIC_BANDAID"
      description: >-
        model_discount_type value indicating the bandaid discount was applied instantly
        without requiring user interaction. Contrast with OFFERED_DISCOUNT. Both represent
        the same bandaid product feature; this column only distinguishes application mode.
      related_terms:
        - urn: urn:li:glossaryTerm:termination_bandaid
          relationship: isA
    - id: offered_discount
      name: "OFFERED_DISCOUNT"
      description: >-
        model_discount_type value indicating the bandaid discount was offered to the tenant
        for approval before being applied. Contrast with AUTOMATIC_BANDAID. Both represent
        the same bandaid product feature; this column only distinguishes application mode.
      related_terms:
        - urn: urn:li:glossaryTerm:termination_bandaid
          relationship: isA
    - id: inspection_laudo
      name: "Laudo (Repair Report)"
      description: >-
        The repair report produced after an exit inspection documenting identified damages,
        costs, and party responsibilities. Table: dw_inspections.fact_report_inspections.
        Contains timestamps for each review stage (AR, Review, Budget Approval) and
        per-party access and approval flags. See Inspection entity for full details.
    - id: termination_relisting
      name: "Relisting"
      description: >-
        The property is relisted for a new rental after a termination.
        Table: dw_offboarding.fact_house_listing_terminations.
        Flag: sk_next_house_listing_consolidated <> -1 indicates a relisting occurred.
        Leadtime: days_termination_to_contract_signed.
      related_terms:
        - urn: urn:li:glossaryTerm:termination_entity
          relationship: hasA
    - id: termination_rerental
      name: "Rerental"
      description: >-
        A new contract is signed for the same property after a termination.
        Table: dw_offboarding.fact_house_listing_terminations.
        Flag: sk_next_contract <> -1 indicates a rerental. Part of the relisting funnel:
        relisting is the listing event, rerental is the conversion (contract signed).
      related_terms:
        - urn: urn:li:glossaryTerm:termination_relisting
          relationship: hasA

documentation_link:
  label: "Business entity documentation (termination.md)"
  url: >-
