spec_version: 1
kind: data_product_curated_entity

product_display_name: "Recovery — Collections (For-Rent Tenants)"
product_description: |
  Recovery analytics for tenants on the For-Rent (FR) product. Recovery measures how much
  overdue debt is collected from defaulting customers and how that performance evolves over time.

  Scope: For-Rent tenants ONLY. Recovery for landlords on FR or buyers on For-Sale (FS)
  are out of scope — they have their own data models and recovery semantics.

  ~95% of what QuintoAndar collects is rental debt, emitted monthly. That cadence justifies a
  monthly wallet view as the default reporting unit.

  Two analytical lenses — decide BEFORE writing a query:
  1. Snapshot view: given the wallet on day X (every defaulting customer at that moment), how much
     had been recovered N days later? Use for: forecasting roll-down, cohort follow-up of a
     single closing date.
  2. Cohort / MTD accumulated view: for a target month, how much of all overdue debt that came to be
     DURING the month was recovered WITHIN the month? Use for: monthly performance vs targets,
     MTD comparisons, 'what is April's recovery rate today?' questions.

  WHY NAIVE RATIOS MISLEAD IN COHORT VIEW: once an invoice is paid, it leaves the open wallet.
  By month end the denominator only contains what was NOT recovered. You must ACCUMULATE both
  due and recovered amounts across all defaulting events in the month. The metric_fintech.daily_recovery_*
  tables already encode this accumulation logic.

  Always prefer metric_fintech.daily_recovery_* tables as the starting point — they encode cohort
  accumulation, segment alignment, and n_business_days_since_pipe for cross-month parity.

  Segmentation four-tier hierarchy (most granular → highest summary):
  1. Basic: includes Early/Late timing and PoP (Probability of Payment). Operational deep-dive.
  2. Clustered: removes Early/Late timing. Operational segments without timing dimension.
  3. Macro: also removes PoP breakdown (Very High / High / Medium / Low). Strategic reporting.
  4. Hyper: collapses to Active / Ended / Evictions. Executive summary.
  Each level has a materialized recovery table: metric_fintech.daily_recovery_segmentation,
  daily_recovery_segmentation_clustered, daily_recovery_macro_segmentation, daily_recovery_hyper_segmentation.
  Plus Chargehub-audience variant: metric_fintech.daily_recovery_chargehub_audiences.

  Data flow (segment data propagates sequentially):
  1. Data Lake → analytical segmentation (dw_collections_segmentation).
  2. Chargehub → receives segments, applies domain refinements (audiences).
  3. Cyber → consumes finalized segment data from Chargehub.

  Table grain:
  - metric_fintech.daily_recovery_*: 1 row per segment × dt_reference (pre-materialized).
    Use first for most questions.
  - fact_invoice_wallet_timeline: 1 row per invoice per day. due_amount stored NEGATIVE —
    always use ABS(due_amount).
  - fact_contract_wallet_timeline: 1 row per contract per day; includes dt_pipe.
  - fact_contract_features_timeline: official segmentation per contract per day.
  - datalake_debt_recovery.segmentation_distribution: live operational Chargehub segments.

  MTD cross-month parity: align by n_business_days_since_pipe (preferred for operational
  dashboards) or running_days. The get_parity_table() helper encodes this logic.

  Key metrics: recovery rate amount T2 (recovered_amount_DT2_acc / due_amount_DT2_acc),
  wallet size (n_contracts_acc, n_invoices_DT2_acc, due_amount_DT2_acc), MoB comparisons
  (VAR_M1/VAR_M2/VAR_AVG4 columns in parity table), Chargehub audience distribution.

  Critical rules:
  - Always filter invoice_delay_t2 > 0 for the operational recovery universe (DT2 standard).
  - Always use ABS(due_amount) — stored with negative sign in fact_invoice_wallet_timeline.
  - Always include the 6-month partition guard:
    MAKE_DATE(year, month, day) >= DATE_TRUNC('month', CURRENT_DATE) - INTERVAL '6' MONTHS.
  - Exclude segmentation IN ('active-current', 'ended-current') and require wallet > 0.
  - Do NOT confuse fact_contract_features_timeline.segmentation (analytical) with Chargehub
    audience_name (operational) — aligned but NOT identical due to system sync delays.
  - For Chargehub audiences: deduplicate segmentation_distribution by
    (id_contract, dt_last_appearance) ORDER BY (ts_entered_segment DESC, ts_entered_audience DESC).
  - When computing MoM recovery, use LAST_VALUE(..., TRUE) OVER (...) to back-fill segment
    and amount features after invoices leave the daily timeline (once paid).

  Query 3 (Chargehub audiences variant) and Query 4 (Ad-hoc range with back-fill) and
  Query 5 (MTD parity helper) are detailed in source doc.

  Further detail and table routing: docs/llm_context/business_entities/recovery_collections_fr_tenants.md

data_product_id: recovery-collections-fr-tenants
domain_urn: urn:li:domain:fintech

structured_property:
  qualified_name: br.com.quintoandar.datahub.recovery_collections.golden_query
  legacy_qualified_names_to_drop:
    - br.com.quintoandar.datahub.recovery_collections.golden_query_url

golden_query:
  stable_urn: urn:li:query:a8045983-34a1-4079-8be4-dc4c5dc94bbc
  name: "Query 1 — Materialized monthly recovery (use first)"
  description: >-
    For most questions, start here. metric_fintech.daily_recovery_hyper_segmentation already
    encodes cohort accumulation and business-day alignment. Filter dt_month_ref for current month.
    Swap table for other segmentation levels (macro, basic, clustered, chargehub_audiences).
    Source: docs/llm_context/business_entities/recovery_collections_fr_tenants.md
  subjects:
    - schema: metric_fintech
      table: daily_recovery_hyper_segmentation
  sql: |
    SELECT *
    FROM metric_fintech.daily_recovery_hyper_segmentation
    -- or daily_recovery_macro_segmentation
    -- or daily_recovery_segmentation
    -- or daily_recovery_segmentation_clustered
    -- or daily_recovery_chargehub_audiences
    WHERE dt_month_ref = DATE_TRUNC('month', CURRENT_DATE)

datasets:
  - schema: dw_collections_segmentation
    table: fact_invoice_wallet_timeline
  - schema: dw_collections_segmentation
    table: fact_contract_wallet_timeline
  - schema: dw_collections_segmentation
    table: fact_contract_features_timeline
  - schema: datalake_debt_recovery
    table: segmentation_distribution
  - schema: dw_public
    table: dim_date

glossary_terms:
  parent_node_urn: urn:li:glossaryNode:fintech
  terms:
    - id: recovery_rate
      name: "Recovery Rate (Taxa de Recuperação)"
      description: >-
        recovered_amount / due_amount over a defined wallet and time range. In cohort/MTD
        view: recovered_amount_DT2_acc / due_amount_DT2_acc. Must use the accumulated
        denominators — naive end-of-month ratios are misleading because paid invoices leave
        the wallet. Column: recovery_rate_amount_t2 in metric_fintech.daily_recovery_* tables.
    - id: recovery_wallet
      name: "Wallet (Carteira de Cobrança)"
      description: >-
        The set of overdue invoices (and their contracts) being tracked for collection.
        In analytical tables: the population filtered by invoice_delay_t2 > 0 and
        segmentation NOT IN ('active-current', 'ended-current'). At contract grain:
        fact_contract_wallet_timeline.wallet > 0. Pre-materialized wallet metrics in
        metric_fintech.daily_recovery_* columns: due_amount_DT2_at_reference,
        n_contracts_at_reference.
      related_terms:
        - urn: urn:li:glossaryTerm:recovery_rate
          relationship: hasA
    - id: recovery_dt_pipe
      name: "DT_Pipe (Billing Pipe Reference Date)"
      description: >-
        The 'billing pipe' reference date — the operational anchor used to align
        month-over-month recovery comparisons. Column: fact_contract_wallet_timeline.dt_pipe
        (same for all contracts within a month). Critical for parity analysis:
        n_business_days_since_pipe ensures days are compared at equivalent pipeline positions
        across months, not by raw calendar day.
      related_terms:
        - urn: urn:li:glossaryTerm:recovery_wallet
          relationship: hasA
    - id: recovery_mob
      name: "MoB (Month-over-Month Offset)"
      description: >-
        Month-over-Month offset for recovery parity comparisons. MoB 0 = current month,
        MoB 1 = previous month, MoB 2 = two months ago. Used in the parity query to align
        the same business-day position across months for fair MTD comparisons.
    - id: recovery_hyper_segmentation
      name: "Hyper Segmentation"
      description: >-
        Highest-level summary segmentation: collapses everything into Active, Ended, and
        Evictions. Executive summary level. Table: metric_fintech.daily_recovery_hyper_segmentation.
        For more granularity: macro (removes PoP), basic (includes Early/Late and PoP).
      related_terms:
        - urn: urn:li:glossaryTerm:recovery_wallet
          relationship: hasA
    - id: recovery_macro_segmentation
      name: "Macro Segmentation"
      description: >-
        Strategic/portfolio reporting segmentation. Removes the PoP (Probability of Payment)
        breakdown from the basic segmentation but keeps more detail than Hyper.
        Table: metric_fintech.daily_recovery_macro_segmentation. Column in
        fact_contract_features_timeline: macro_segmentation.
      related_terms:
        - urn: urn:li:glossaryTerm:recovery_hyper_segmentation
          relationship: hasA
    - id: recovery_chargehub
      name: "Chargehub (Domain Audience System)"
      description: >-
        Domain system that receives segment data from the Data Lake and applies operational
        refinements to produce audiences. The operational live view of segments. Use
        datalake_debt_recovery.segmentation_distribution for Chargehub audiences.
        Dedup: PARTITION BY (id_contract, dt_last_appearance) ORDER BY
        (ts_entered_segment DESC, ts_entered_audience DESC).
    - id: recovery_pop
      name: "PoP (Probability of Payment)"
      description: >-
        Probability of Payment classification: Very High / High / Medium / Low. Assigned per
        contract-day by the segmentation model. Included in Basic segmentation but removed
        in Macro and Hyper. Column: fact_contract_features_timeline.prob_payment.
    - id: recovery_dt2
      name: "DT2 / Delay-T2"
      description: >-
        Invoice delay methodology that considers deal/negotiation status (contaminated delay).
        The operational standard for recovery analytics. Column: invoice_delay_t2 in
        fact_invoice_wallet_timeline. Always filter invoice_delay_t2 > 0 for the recovery
        universe. Contrast with T1 (raw delay) and T3 (more aggressive contamination).

