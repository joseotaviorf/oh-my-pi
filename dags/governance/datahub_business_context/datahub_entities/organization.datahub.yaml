spec_version: 1
kind: data_product_curated_entity

product_display_name: "Organization"
product_description: |
  Organization is the People Data Warehouse schema for organizational reference data: cost centers
  and teams (with Codex attributes), business units, and the public job catalog. These dimensions
  classify headcount and power joins from dw_employee_details.fact_assignment_snapshots.

  dim_cost_center is SCD Type 2 with full attribute history and validity windows. dim_business_unit
  and dim_job are current-state catalogs only.

  Sources: PIN (HR org structures, jobs) and SAP/Codex (financial taxonomy on cost centers).
  SLA: D-1 by 08:00 BRT.

  Cost center attributes: fixed (derived from cost_center_code — structure, team, business, product,
  brand) vs variable (chapter, line, owner_l1/l2/l3_name, headcount_type) which trigger new versions.

  Critical rules:
  - Without is_current = TRUE on dim_cost_center, joins return all historical versions and
    duplicate headcount.
  - owner_l1_name / owner_l2_name / owner_l3_name on cost centers describe the unit's leadership,
    not each employee's personal reporting chain in dim_management_hierarchy.
  - Job compensation bands are in dw_compensation, not in dim_job.
  - Business unit transfers create new assignments in PIN — do not expect BU changes on the same assignment_number.
  - Out of scope: employee PII (dw_employee_details), compensation bands (dw_compensation).

  Key metrics: headcount by vertical, active cost centers, employees per business unit,
  cost centers by HRBP.

  Further detail and table routing: docs/llm_context/business_entities/organization.md

data_product_id: organization
domain_urn: urn:li:domain:people

structured_property:
  qualified_name: br.com.quintoandar.datahub.organization.golden_query
  legacy_qualified_names_to_drop:
    - br.com.quintoandar.datahub.organization.golden_query_url

golden_query:
  stable_urn: urn:li:query:3721c61c-c02a-476b-9a51-40c9e60ce3d6
  name: "Query 1 — Active cost centers by vertical"
  description: >-
    Lists current cost centers filtered by vertical using dim_cost_center with is_current = TRUE.
    Source: docs/llm_context/business_entities/organization.md
  subjects:
    - schema: dw_organization
      table: dim_cost_center
  sql: |
    SELECT
        cc.cost_center_code,
        cc.cost_center_name,
        cc.team,
        cc.chapter,
        cc.vertical,
        cc.headcount_type,
        cc.is_active
    FROM dw_organization.dim_cost_center AS cc
    WHERE cc.vertical = 'Tech'
      AND cc.is_current = TRUE
    ORDER BY cc.cost_center_name

datasets:
  - schema: dw_organization
    table: dim_cost_center
  - schema: dw_organization
    table: dim_business_unit
  - schema: dw_organization
    table: dim_job
  - schema: dw_employee_details
    table: fact_assignment_snapshots

glossary_terms:
  parent_node_urn: urn:li:glossaryNode:people
  terms:
    - id: organization_entity
      name: "Organization (Cost Center / BU / Job)"
      description: >-
        People DW schema for organizational reference: cost centers, business units, and jobs.
        Schema: dw_organization. Joins to fact_assignment_snapshots via sk_cost_center_version,
        sk_business_unit, and sk_job_version.
    - id: organization_cost_center
      name: "Cost center / Centro de custo / Time"
      description: >-
        Cost center and team dimension with SCD Type 2 history. Table: dim_cost_center. Always
        filter is_current = TRUE for present-day analysis. Business key: cost_center_code.
      related_terms:
        - urn: urn:li:glossaryTerm:organization_entity
          relationship: hasA
    - id: organization_business_unit
      name: "Business unit / Unidade de negócio"
      description: >-
        Legal affiliation branch within a country. Current-state catalog in dim_business_unit.
        Join on sk_business_unit from assignment snapshots.
      related_terms:
        - urn: urn:li:glossaryTerm:organization_entity
          relationship: hasA
    - id: organization_job
      name: "Job / Cargo / Função"
      description: >-
        Public job catalog with family and career track. Current state in dim_job. Compensation
        bands are in dw_compensation, not here.
      related_terms:
        - urn: urn:li:glossaryTerm:organization_entity
          relationship: hasA
    - id: organization_codex
      name: "Codex"
      description: >-
        SAP/Codex-sourced financial and taxonomy attributes integrated into dim_cost_center.
        Official reference spreadsheet maintained by Finance/People planning.
      related_terms:
        - urn: urn:li:glossaryTerm:organization_cost_center
          relationship: hasA

documentation_link:
  label: "Business entity documentation (organization.md)"
  url: >-
    https://github.com/quintoandar/bi-etl-ejuice/blob/master/docs/llm_context/business_entities/organization.md
