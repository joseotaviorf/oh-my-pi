spec_version: 1
kind: data_product_curated_entity

product_display_name: "3P Supply (Broker Supply Platform)"
product_description: |
  3P Supply is the third-party (rede) sub-funnel of QuintoAndar's supply chain — properties
  brought into the platform by partner real-estate brokers via the BSP (Broker Supply Platform).
  It tracks each partner-submitted lead from ingestion in the BSP, through business validation
  and availability checks, to the first listing publication. Source of truth for L2FL on the
  rede channel and for identifying actionable supply opportunities.

  The dw_3p_supply schema is a star schema: fact_lead_3p_flows (central fact) + three dimensions
  (dim_current_conversion_funnel, dim_lead_3p, dim_lead_3p_image_inspection).
  Fact grain: lead × business_context (sk_lead_3p_flow = id_lead_3p * 10 for SALE, * 10 + 1 for RENT).

  Six-stage lifecycle (canonical analytical order):
  1. Lead ingested in BSP — ts_lead_created.
  2. Business validation in BSP — current_bsp_status + reason_macro (eligibility pendings).
  3. Photo processing in BSP — ts_first_processing_photos_in_bsp.
  4. Registered from BSP to main — ts_first_registered_from_bsp_to_main; sk_house populated.
  5. Availability check on main — ts_availability_check_start / ts_availability_check_end.
  6. First listing published — ts_first_listing (current_conversion_funnel = 'FIRST_LISTING').

  Actual journey is NOT linear: leads can skip stages, stop in terminal states, move backward
  after main-side events, or be marked as DUPLICATE. Always use current state from
  dim_current_conversion_funnel.current_conversion_funnel, not stage numbers.

  Conversion funnel groups (NEVER mix ordering):
  BSP block (early): UNPUBLISHED_BSP, SUSPENDED_BSP, DISCARDED_BSP, OTHER (terminal/post-main),
    then NOT_CONVERTED_BSP, OPPORTUNITY (actionable), then PROCESSING_PHOTOS, REGISTERED_BSP.
  Main block (later): AVAILABILITY_CHECK_START, AVAILABILITY_CHECK_END, FIRST_LISTING.

  Valid-lead logic — decision tree:
  - APPLY for conversion-rate denominators (L2FL, lead-to-opportunity, etc.):
    (ts_partner_contract_start IS NULL AND is_valid_first_lead = TRUE) OR is_current_valid_first_lead = TRUE.
  - DO NOT APPLY for raw BSP universe: lead stock/inventory, stuck-reason analysis,
    opportunity lists, funnel stage distributions.
  - NEVER apply valid-lead filter to the numerator (first listings count) — only to denominator.
  - L2FL can exceed 100% if the published lead was filtered as invalid but reached first listing.

  reason_macro — ONLY semantically valid for current_bsp_status = 'NOT_CONVERTED':
  - DUPLICATED: matches existing house.
  - NO_OPERATIONAL_INTEREST: out of scope — NOT actionable.
  - PHOTOS: image issues (actionable).
  - OWNER_INFO: missing/invalid owner contact (actionable).
  - LISTING_INFO: incomplete location, blueprint, IPTU (actionable).
  - OTHER / N/A: unclassified or no reason.

  Key metrics: L2FL rate, opportunity count (is_opportunity = TRUE), funnel drop-off rates,
  time-in-stage, reason_macro distribution for NOT_CONVERTED leads, partner performance
  (L2FL by partner using is_current_valid_first_lead for current-contract view).

  Critical rules:
  - Join fact_lead_3p_flows ↔ dim_current_conversion_funnel on sk_lead_3p_flow (NOT sk_lead_3p —
    one lead can have two flows: RENT + SALE, which would fan out counts).
  - Always filter business_context ('RENT' or 'SALE') when the question is modality-specific.
  - Sentinel value -1 for missing surrogate keys (sk_house, sk_broker, etc.) — filter <> -1.
  - reason_macro is meaningless for statuses other than NOT_CONVERTED — co-filter.
  - current_conversion_funnel = 'FIRST_LISTING' only proves the lead was published ONCE;
    use current_main_status to know if it's currently active.
  - Enrich layer (datalake_3p_supply) is for lineage debugging only — use DW tables.

  Further detail and table routing: docs/llm_context/business_entities/3p_supply.md

data_product_id: 3p-supply
domain_urn: urn:li:domain:growth

structured_property:
  qualified_name: br.com.quintoandar.datahub.3p_supply.golden_query
  legacy_qualified_names_to_drop:
    - br.com.quintoandar.datahub.3p_supply.golden_query_url

golden_query:
  stable_urn: urn:li:query:b6d2a734-d439-44e2-94b3-e8bfcd7c3d21
  name: "Query 1 — Lead funnel stage distribution (all leads)"
  description: >-
    Count of all leads by current_conversion_funnel stage and business_context. Does NOT
    apply valid-lead filter (raw BSP universe for funnel distribution). Joins
    fact_lead_3p_flows to dim_current_conversion_funnel on sk_lead_3p_flow.
    Source: docs/llm_context/business_entities/3p_supply.md
  subjects:
    - schema: dw_3p_supply
      table: fact_lead_3p_flows
    - schema: dw_3p_supply
      table: dim_current_conversion_funnel
  sql: |
    SELECT
        dcf.business_context,
        dcf.current_conversion_funnel,
        dcf.current_bsp_status,
        COUNT(*) AS total_leads,
        SUM(CASE WHEN f.is_opportunity THEN 1 ELSE 0 END) AS opportunity_leads
    FROM dw_3p_supply.fact_lead_3p_flows AS f
    INNER JOIN dw_3p_supply.dim_current_conversion_funnel AS dcf
        ON f.sk_lead_3p_flow = dcf.sk_lead_3p_flow
    GROUP BY 1, 2, 3
    ORDER BY total_leads DESC

datasets:
  - schema: dw_3p_supply
    table: fact_lead_3p_flows
  - schema: dw_3p_supply
    table: dim_current_conversion_funnel
  - schema: dw_3p_supply
    table: dim_lead_3p
  - schema: dw_3p_supply
    table: dim_lead_3p_image_inspection

glossary_terms:
  parent_node_urn: urn:li:glossaryNode:growth
  terms:
    - id: bsp_platform
      name: "BSP (Broker Supply Platform)"
      description: >-
        The partner-broker portal where third-party real estate brokers submit property leads
        to QuintoAndar. Also called portal do parceiro. BSP-side timestamps are suffixed
        '_in_bsp' (e.g. ts_discarded_in_bsp, ts_first_not_converted_in_bsp).
    - id: bsp_status_enum
      name: "BSP Status"
      description: >-
        Current status of a lead in the BSP: PROCESSING (photos being processed),
        NOT_CONVERTED (pending with reasons), REGISTERED (transferred to main), UNPUBLISHED,
        SUSPENDED, DISCARDED. Column: dim_current_conversion_funnel.current_bsp_status.
    - id: draft_listing
      name: "Draft Listing (Rascunho de Anúncio)"
      description: >-
        A 3P lead once it reaches the main system (after ts_first_registered_from_bsp_to_main).
        The listing draft has its own lifecycle: EDITING, WAITING_CONFIRMATION, PUBLISHED, etc.
        Status in current_main_status. sk_listing_draft_status = -1 when the lead never
        reached main.
    - id: l2fl_valid_lead
      name: "Valid First Lead (is_valid_first_lead)"
      description: >-
        Deduplication flag that identifies the first lead all-time for a given
        (lead_hash, uuid_company, business_context) combination. Use ONLY in the DENOMINATOR
        of conversion-rate metrics (L2FL, lead-to-opportunity). NEVER apply to stock,
        drop-reason, opportunity-list, or funnel-distribution queries.
    - id: l2fl_current_valid_lead
      name: "Current Valid First Lead (is_current_valid_first_lead)"
      description: >-
        Like is_valid_first_lead but scoped to the current partner contract period:
        first lead per (lead_hash, uuid_company, business_context, ts_partner_contract_start).
        Use for partner performance analysis under their current contract.
      related_terms:
        - urn: urn:li:glossaryTerm:l2fl_valid_lead
          relationship: isA
    - id: lead_opportunity
      name: "Lead Opportunity (Oportunidade / Backlog)"
      description: >-
        An actionable 3P lead defined as: current_bsp_status = 'NOT_CONVERTED' AND
        is_eligible_pending = TRUE AND is_not_eligible_pending = FALSE. The partner can
        fix the blocking reasons. is_opportunity = TRUE. Also called oportunidade, backlog,
        or opportunities in the 3P domain.
      related_terms:
        - urn: urn:li:glossaryTerm:bsp_platform
          relationship: hasA
    - id: bsp_reason_macro
      name: "Reason Macro"
      description: >-
        High-level classification of BSP blocking reason for NOT_CONVERTED leads.
        ONLY meaningful when current_bsp_status = 'NOT_CONVERTED'. Categories: DUPLICATED,
        NO_OPERATIONAL_INTEREST (not actionable), PHOTOS, OWNER_INFO, LISTING_INFO (actionable),
        OTHER, N/A. Always co-filter with current_bsp_status = 'NOT_CONVERTED'.
      related_terms:
        - urn: urn:li:glossaryTerm:lead_opportunity
          relationship: hasA
    - id: l2fl_rate
      name: "L2FL (Lead to First Listing Rate)"
      description: >-
        Primary 3P supply conversion metric: COUNT(ts_first_listing IS NOT NULL) /
        COUNT(valid-lead denominator). Denominator applies valid-lead deduplication.
        Numerator is unfiltered. Can exceed 100% due to cohort instability (see 3p_supply.md).

