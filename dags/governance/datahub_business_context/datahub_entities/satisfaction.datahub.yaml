spec_version: 1
kind: data_product_curated_entity

product_display_name: "Satisfaction (CSAT)"
product_description: |
  CSAT (Customer Satisfaction) measures per-ticket and per-interaction satisfaction across
  all contact channels in the Support & Services domain. Data is collected from four
  independent sources and unified into a single analytical layer.

  The four CSAT sources:
  1. Zendesk — email/ticket-based CSAT JSON embedded in the ticket.
  2. Survicate — in-app and email post-interaction surveys (inspections, repairs, lockbox,
     scheduling, keys, photo, Salesforce, Zendesk email).
  3. BigFone — call (IVR) CSAT steps collected during/after phone interactions.
     Three branches with different score semantics — always use the normalized layer.
  4. Chat FUP — post-chat follow-up ratings and survey answers.
  Additionally: manual CSAT from Google Sheets (inspection/onboarding surveys).

  All sources are normalized to a common scale (good/bad → 1/5 score) in the enrich layer
  and unified in dw_satisfaction_rating.

  Table grain:
  - fact_answer: 1 row per survey answer (all channels unified, single source of truth).
  - fact_ticket_csat: 1 row per ticket with first and last CSAT scores.
  - fact_analyst_answers: 1 row per analyst satisfaction survey answer (Single Station).
  - dim_survey: 1 row per survey definition; join via sk_survey.
  - dim_answer: 1 row per answer attributes (tags, comments, score descriptions).

  Key joins:
  - Ticket CSAT: fact_ticket_csat.id_ticket = fact_tickets.sk_ticket (note: different column names)
  - Full CSAT: fact_answer.sk_survey = dim_survey.sk_survey
  - Analyst satisfaction: fact_analyst_answers.sk_analyst = dim_analyst.sk_analyst

  Key metrics: CSAT score per channel/department/ticket, DSAT (dissatisfaction rate,
  pre-aggregated in metric_ss__tickets.dsat), CSAT by journey (dim_survey.service_context),
  analyst CSAT (facility/time/support dimensions), improvement tags distribution.

  Critical rules:
  - Do NOT query individual per-channel enrich tables (zendesk_surveys, bigfone_surveys, etc.)
    for cross-channel analysis — always use fact_answer (DW) or satisfaction_answers (enrich).
  - Do NOT compare raw BigFone scores with Zendesk scores without normalization — BigFone has
    3 branches with different score semantics; the DW layer normalizes them.
  - fact_ticket_csat.id_ticket == fact_tickets.sk_ticket (same value, different column names).
  - CSAT ≠ NPS: CSAT is per-ticket/per-interaction (dw_satisfaction_rating); NPS is brand
    loyalty measured via Tracksale campaigns (dw_customer_satisfaction). Do not confuse them.
  - fact_tickets.csat_score already carries the last CSAT — use that when you don't need the
    full fact_ticket_csat join.

  Further detail and table routing: docs/llm_context/business_entities/satisfaction.md

data_product_id: satisfaction
domain_urn: urn:li:domain:support_and_services

structured_property:
  qualified_name: br.com.quintoandar.datahub.satisfaction.golden_query
  legacy_qualified_names_to_drop:
    - br.com.quintoandar.datahub.satisfaction.golden_query_url

golden_query:
  stable_urn: urn:li:query:b8a4a892-b757-4b92-8076-6413190c0a50
  name: "Query 1 — Ticket-level CSAT with department context"
  description: >-
    CSAT per ticket with department and journey context. Joins fact_tickets to
    fact_ticket_csat on sk_ticket and to dim_department for department attributes.
    Note: fact_ticket_csat uses id_ticket (= sk_ticket) as join key.
    Source: docs/llm_context/business_entities/satisfaction.md
  subjects:
    - schema: dw_customer_support
      table: fact_tickets
    - schema: dw_satisfaction_rating
      table: fact_ticket_csat
    - schema: dw_customer_support
      table: dim_department
  sql: |
    SELECT
        ft.sk_ticket,
        ft.sk_contract,
        dd.department,
        dd.journey_step,
        csat.first_csat_score,
        csat.last_csat_score,
        csat.last_csat_comment,
        ft.ts_created,
        ft.ts_closed
    FROM dw_customer_support.fact_tickets AS ft
    INNER JOIN dw_satisfaction_rating.fact_ticket_csat AS csat
        ON ft.sk_ticket = csat.sk_ticket
    LEFT JOIN dw_customer_support.dim_department AS dd
        ON ft.sk_main_department = dd.sk_department
    WHERE ft.ts_created >= DATE '2025-01-01'

datasets:
  - schema: dw_satisfaction_rating
    table: fact_answer
  - schema: dw_satisfaction_rating
    table: fact_ticket_csat
  - schema: dw_satisfaction_rating
    table: fact_analyst_answers
  - schema: dw_satisfaction_rating
    table: dim_survey
  - schema: dw_satisfaction_rating
    table: dim_answer
  - schema: datalake_satisfaction_rating
    table: zendesk_surveys
  - schema: datalake_satisfaction_rating
    table: survicate_surveys
  - schema: datalake_satisfaction_rating
    table: bigfone_surveys
  - schema: datalake_satisfaction_rating
    table: chat_fup_surveys

glossary_terms:
  parent_node_urn: urn:li:glossaryNode:customer_support
  terms:
    - id: csat
      name: "CSAT (Customer Satisfaction Score)"
      description: >-
        Per-ticket or per-interaction satisfaction score, normalized across all channels
        (Zendesk, Survicate, BigFone, Chat FUP). Good/bad normalized to 1/5 score.
        Primary analytical table: dw_satisfaction_rating.fact_answer.
        Do not confuse with NPS (brand loyalty via Tracksale), which is a separate entity.
    - id: csat_dsat
      name: "DSAT (Dissatisfaction Rate)"
      description: >-
        Proportion of bad CSAT ratings over total. Pre-aggregated in metric_ss__tickets.dsat.
        This is the primary operational KPI for satisfaction monitoring in the S&S domain.
      related_terms:
        - urn: urn:li:glossaryTerm:csat
          relationship: hasA
    - id: csat_zendesk
      name: "CSAT Zendesk"
      description: >-
        CSAT ratings collected from email/ticket interactions in Zendesk. Source:
        datalake_satisfaction_rating.zendesk_surveys (enrich). The CSAT JSON is embedded
        in the ticket data. Normalized and included in dw_satisfaction_rating.fact_answer.
      related_terms:
        - urn: urn:li:glossaryTerm:csat
          relationship: isA
    - id: csat_survicate
      name: "CSAT Survicate"
      description: >-
        CSAT ratings from post-interaction surveys dispatched by Survicate covering
        inspections, repairs, lockbox, scheduling, keys, photo, Salesforce, and Zendesk
        email. Source: datalake_satisfaction_rating.survicate_surveys (enrich).
        Normalized and included in dw_satisfaction_rating.fact_answer.
      related_terms:
        - urn: urn:li:glossaryTerm:csat
          relationship: isA
    - id: csat_bigfone
      name: "CSAT BigFone"
      description: >-
        CSAT collected from phone (IVR/call) interactions via BigFone. Has 3 branches
        with different score semantics — raw scores are NOT comparable to other channels.
        Always use the normalized enrich/DW layer. Source:
        datalake_satisfaction_rating.bigfone_surveys (enrich).
      related_terms:
        - urn: urn:li:glossaryTerm:csat
          relationship: isA
    - id: csat_chat_fup
      name: "CSAT Chat FUP"
      description: >-
        Post-chat follow-up CSAT ratings and survey answers from chat interactions (in-app
        and WhatsApp). Source: datalake_satisfaction_rating.chat_fup_surveys (enrich).
        FUP = follow-up survey sent after the chat session closes.
      related_terms:
        - urn: urn:li:glossaryTerm:csat
          relationship: isA
    - id: analyst_csat
      name: "Analyst CSAT (Single Station)"
      description: >-
        Internal survey measuring analyst satisfaction with the Single Station analyst
        platform across three dimensions: facility (ease of performing tasks), time
        (time spent on tasks), and support (documentation and support quality).
        Stored in dw_satisfaction_rating.fact_analyst_answers; free-text in
        improvements_suggestions column.
    - id: csat_single_station
      name: "Single Station"
      description: >-
        QuintoAndar's internal analyst platform used by S&S analysts to handle tickets,
        calls, and tasks. The platform itself is rated by analysts via the Analyst CSAT
        survey (dw_satisfaction_rating.fact_analyst_answers), distinct from
        customer-facing CSAT.
    - id: csat_pesquisa_satisfacao
      name: "Pesquisa de Satisfação (Satisfaction Survey)"
      description: >-
        Generic term for any satisfaction survey dispatched to customers post-interaction.
        In DataHub: maps to dw_satisfaction_rating.dim_survey for metadata and
        dw_satisfaction_rating.fact_answer for answers. dim_survey.survey_name and
        service_context describe the specific survey.

documentation_link:
  label: "Business entity documentation (satisfaction.md)"
  url: >-
    https://github.com/quintoandar/bi-etl-ejuice/blob/master/docs/llm_context/business_entities/satisfaction.md
