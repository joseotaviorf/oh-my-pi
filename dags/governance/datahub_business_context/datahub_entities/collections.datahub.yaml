glossary_terms:
  parent_node_urn: urn:li:glossaryNode:fintech
  terms:
    - id: collections_overdue_portfolio
      name: "Overdue Portfolio (Carteira Inadimplente)"
      description: >-
        The set of invoices that are past due but not yet written off, tracked daily in
        dw_collection_recovery_quintoandar.fact_overdue_portfolio_timeline. Each invoice
        enters the portfolio one day after its due date and is replicated daily until paid,
        renegotiated, or written down. Use is_most_recent_record_month = true to collapse
        to one row per invoice per month-end.
    - id: acordo
      name: "Acordo (Negotiated Payment Plan)"
      description: >-
        A structured payment agreement between QuintoAndar and the debtor, typically covering
        multiple installments. Created in Trato Feito and tracked in
        dw_collection_recovery_quintoandar.fact_negotiation (negotiation_classification = 'ACORDO').
        Installments are stored in fact_negotiation_installment. A broken acordo can trigger
        renegotiation, tracked in fact_renegotiations.
      related_terms:
        - urn: urn:li:glossaryTerm:collections_overdue_portfolio
          relationship: hasA
    - id: promessa
      name: "Promessa (Promise to Pay)"
      description: >-
        A debtor's commitment to pay before the first installment of an acordo is confirmed.
        Encoded as negotiation_classification = 'PROMESSA' in fact_negotiation and as
        total_promisse in fact_collection. A broken promise (PROMESSA QUEBRADA) may transition
        to a new negotiation or eviction track.
    - id: ssn_bossn
      name: "SSN / BOSSN (Self-Service Negotiation)"
      description: >-
        Digital self-service negotiation flows that allow debtors to propose and accept
        payment plans without agent intervention. Identified by is_ssn = true on
        dw_collection_recovery_quintoandar.fact_overdue_portfolio_timeline. BOSSN is the
        back-office variant of the same flow.
    - id: assessoria
      name: "Assessoria (Third-Party Advisory Collection)"
      description: >-
        External collection agencies (e.g. Cyber, Paschoalotto, Webhelp) engaged for
        advanced-stage or legal recovery. Indicated by the advisory flag on fact_negotiation
        and the recovery_channel / segmentation_queue columns on fact_overdue_portfolio_timeline.
        Agency metadata is in dim_agency; operator metadata in dim_operator.
    - id: delay_methodology_t1_t2_t3
      name: "Delay Methodology T1 / T2 / T3"
      description: >-
        Three distinct delay calculation methodologies used in dw_collections_segmentation.
        T1 is the baseline invoice delay. T2 adds deal/negotiation contamination and aligns
        with operational roll-rate metrics. T3 applies contract-level contamination used for
        wallet and losses views. Column names in fact_invoice_wallet_timeline and
        fact_contract_wallet_timeline explicitly encode the methodology
        (e.g. invoice_delay_t1, invoice_delay_t2, max_delay_contaminated_contract_t2).
        Always specify which methodology a metric uses.
    - id: flow_stock_debtor
      name: "Flow vs Stock (Debtor Type)"
      description: >-
        Operational segmentation of overdue invoices. Flow (Fluxo) = invoices that became
        overdue in the current month (new entries). Stock (Estoque) = invoices already
        overdue from prior months. Encoded as debtor_type on
        dw_collection_recovery_quintoandar.fact_overdue_portfolio_timeline. Used in roll-rate
        and recovery-rate dashboards to separate new delinquency from accumulated debt.
    - id: net_recovered_amount
      name: "Net Recovered Amount"
      description: >-
        Recovery amount adjusted for the negotiation net rate when the invoice was
        previously written down (PDD). Differs from recovered_amount, which reflects
        nominal cash received. Use net_recovered_amount when computing recovery rates
        against provisioned AR (dw_losses universe) to avoid overstating recovery on
        discounted deals. Column on fact_overdue_portfolio_timeline.
    - id: fpd_first_payment_default
      name: "FPD (First Payment Default)"
      description: >-
        Indicator that the first installment of a new rental contract was not paid on time.
        Stored as delay_first_payment_default on
        dw_collection_recovery_quintoandar.fact_overdue_portfolio_timeline and as an
        FPD flag on dw_collections_segmentation.fact_contract_wallet_timeline. A key
        early-warning signal for tenant credit risk.

