spec_version: 1
kind: data_product_curated_entity

product_display_name: "Collections"
product_description: |
  Collections (Cobrança) is the operational domain focused on recovering overdue payments
  from tenants and landlords: reminders, outbound contact, deal structuring (acordos),
  self-service negotiation (SSN), and legal/eviction tracks. The debt remains accounts
  receivable on the balance sheet but is flagged as past due until paid, renegotiated,
  or written off.

  Four DW schemas power this domain. dw_collection_recovery_quintoandar is the primary
  recovery model — it holds the daily overdue invoice timeline (fact_overdue_portfolio_timeline),
  collection touches (fact_collection), debt at invoice grain (fact_debt), negotiation headers
  and installments (fact_negotiation / fact_negotiation_installment), a bridge table linking
  debts to negotiations, and a renegotiation chain fact. dw_collections_landlord covers
  landlord-side overdue invoices (Retsuko), bill-item decomposition, and deal installment
  matching. dw_collections_segmentation provides wallet segmentation and the three delay
  methodologies (T1 / T2 / T3) via invoice-day, contract-day, and ML-oriented feature
  timelines. dw_evictions models Cyber Legal eviction cases with stage SLAs, expenses, alerts,
  and juridical log actions.

  Key metrics: DSO (days sales outstanding), roll rates between delay buckets, recovery rates
  (including net_recovered_amount for negotiation-adjusted write-downs), contact KPIs (CPC,
  ALO, promessas), eviction lead times, and segmentation-driven queue routing
  (segmentation_queue, agreement_queue, eviction_queue).

  Critical rules:
  - Use is_most_recent_record_month = true on fact_overdue_portfolio_timeline for one row
    per invoice per month when deduplicating to the latest day in the month.
  - Specify T1 vs T2 vs T3 explicitly in dw_collections_segmentation — column names encode
    the methodology and mixing them silently changes metric definitions.
  - Schema is dw_collection_recovery_quintoandar (not dw_collections_recovery_quintoandar).
  - When mixing AR and pre-PDD invoices, document whether net_recovered_amount vs
    recovered_amount is required (negotiation-adjusted written-down logic).
  - Matthew (AI collections agent) interaction flags such as has_matthew_interaction appear
    on the overdue portfolio timeline; for session-grain AI analytics see matthew.md.

  Further detail and table routing: docs/llm_context/business_entities/collections.md

data_product_id: collections
domain_urn: urn:li:domain:fintech

structured_property:
  qualified_name: br.com.quintoandar.datahub.collections.golden_query
  legacy_qualified_names_to_drop:
    - br.com.quintoandar.datahub.collections.golden_query_url

golden_query:
  stable_urn: urn:li:query:f04e12aa-b3d5-41cb-8f81-ad11c2392168
  name: "Query 1 — AR recovery rate (overdue portfolio consolidated)"
  description: >-
    Consolidates dw_losses.fact_accounts_receivable with overdue invoices not yet on that
    table for the same month using fact_overdue_portfolio_timeline, computing AR recovery
    rate by delay bucket (AR 0-90 vs AR 90+) over the trailing 13 month-ends.
    Source: docs/llm_context/business_entities/collections.md
  subjects:
    - schema: dw_losses
      table: fact_accounts_receivable
    - schema: dw_collection_recovery_quintoandar
      table: fact_overdue_portfolio_timeline
    - schema: dw_losses
      table: fact_delay
  sql: |
    WITH fact_ar_consolidated AS (
        SELECT
            sk_invoice,
            delay_contamined_range AS delay_range,
            invoice_amount AS due_amount,
            COALESCE(net_recovered, 0) AS net_recovered_amount,
            date_add('day', -1, date_trunc('month', dt_month_recovery)) AS dt_closing
        FROM dw_losses.fact_accounts_receivable

        UNION ALL

        SELECT
            a.id_invoice,
            COALESCE(c.delay_contamined_range, a.delay_contract_range),
            a.due_amount,
            COALESCE(a.net_recovered_amount, 0),
            COALESCE(c.dt_closing, date_add('day', -1, a.dt_month_start))
        FROM dw_collection_recovery_quintoandar.fact_overdue_portfolio_timeline AS a
        LEFT JOIN dw_losses.fact_accounts_receivable AS b
            ON a.id_invoice = b.sk_invoice
            AND last_day_of_month(b.dt_month_recovery) = a.dt_month_end
        LEFT JOIN dw_losses.fact_delay AS c
            ON a.sk_contract = c.sk_contract
            AND date_add('day', -1, a.dt_month_start) = c.dt_closing
        WHERE b.sk_invoice IS NULL
          AND a.is_most_recent_record_month = true
    )

    SELECT
        date_trunc('day', CAST(dt_closing AS TIMESTAMP)) AS dt_closing,
        CASE
            WHEN delay_range IN ('a. Current', 'b. 1-30', 'c. 31-60', 'd. 61-90') THEN 'AR 0-90'
            ELSE 'AR 90+'
        END AS okr_bucket,
        SUM(net_recovered_amount) / NULLIF(SUM(due_amount), 0) AS ar_recovery_rate
    FROM fact_ar_consolidated
    WHERE dt_closing BETWEEN last_day_of_month(date_add('month', -13, current_date))
                        AND last_day_of_month(date_add('month', -1, current_date))
    GROUP BY 1, 2
    ORDER BY 1 DESC, 2

