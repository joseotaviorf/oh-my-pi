spec_version: 1
kind: data_product_curated_entity

product_display_name: "Closing"
product_description: |
  Closing (CC2CS — Contract Created to Contract Signed) is the final step of the For Rent
  pre-contract journey. At this stage, a contract is generated for an accepted proposal and
  sent to signatories — tenants, landlords, dwellers, sponsors (guarantors), and partners —
  who can request changes, refuse, or sign it. Closing is what materialises a deal: the bridge
  between a proposal and an active rental contract.

  Lifecycle stages (tracked via dim_contract.status and closing_status):
  1. Draft — contract created (status = 'Minuta', closing_status = 'RedacaoContrato').
  2. Sent for signature — draft approved, sent to all signatories (status = 'PreAssinaturas',
     closing_status = 'ContratoEnviado').
  3. Signed — all parties signed (status = 'Ativo', closing_status = 'ContratoAssinado',
     ts_signature IS NOT NULL).
  4. Cancelled before signing — closing fails (status = 'Cancelado', ts_canceled).
  5. Finalized after signing — contract ends lifecycle (status = 'Finalizado').

  Not all closings reach signature. Some are cancelled (OWNER_GAVE_UP_RENTING,
  TENANT_DOESNT_AGREE, SIG_DEADLINE_EXPIRED, etc. in cancellation_reason); others
  go through multiple draft revisions when signatories request changes.

  Critical rules:
  - dim_contract does NOT carry sk_house, sk_tenant, or sk_owner — those live in
    dw_rent.fact_contracts. JOIN via sk_contract whenever house, tenant, or owner is needed.
  - A contract is "signed" when closing_status = 'ContratoAssinado' OR ts_signature IS NOT NULL.
    status = 'Ativo' is correct only for currently-active signed contracts — it excludes signed
    contracts later finalized or cancelled.
  - dim_contract includes drafts, pre-signature, and cancelled rows — filter explicitly for
    signed deals.
  - datalake_signatures_clean.signature/agreement_document carry no id_contract — bridge via
    dim_contract.ts_signature and closing_status for contract-grain signing analysis.
  - CC2CS leadtime is pre-computed in dw_rent.fact_listing_rent_flows.cc2cs_working_minutes
    (working minutes from creation to signature) — do not recalculate manually.

  Key metrics: contracts signed per period, signing rate, CC2CS leadtime (cc2cs_working_minutes),
  cancellation rate by reason, signatory distribution by contract_role, Early Demand rent flows,
  annulment rate before entrance date.

  Further detail and table routing: docs/llm_context/business_entities/closing.md

data_product_id: closing
domain_urn: urn:li:domain:for_rent

structured_property:
  qualified_name: br.com.quintoandar.datahub.closing.golden_query
  legacy_qualified_names_to_drop:
    - br.com.quintoandar.datahub.closing.golden_query_url

golden_query:
  stable_urn: urn:li:query:1ee845f2-6beb-41a1-b20e-101de1cf2c9c
  name: "Query 1 — Contracts signed in a period"
  description: >-
    How many contracts were signed yesterday, last week, or this year. Filters dim_contract
    by signed state (closing_status = 'ContratoAssinado') and ts_signature date range.
    Source: docs/llm_context/business_entities/closing.md
  subjects:
    - schema: dw_rent
      table: dim_contract
  sql: |
    SELECT
        DATE(dc.ts_signature) AS dt_signed,
        COUNT(*)              AS total_signed
    FROM dw_rent.dim_contract AS dc
    WHERE dc.closing_status = 'ContratoAssinado'
      AND dc.ts_signature >= DATE '2026-01-01'
    GROUP BY DATE(dc.ts_signature)
    ORDER BY dt_signed DESC

datasets:
  - schema: dw_rent
    table: dim_contract
  - schema: dw_rent
    table: fact_contracts
  - schema: dw_rent
    table: fact_contract_people
  - schema: dw_rent
    table: fact_listing_rent_flows
  - schema: dw_rent
    table: dim_offer
  - schema: dw_rent
    table: dim_house_listing
  - schema: datalake_terminator_clean
    table: termination
  - schema: datalake_ebdb_clean
    table: contract_person
  - schema: datalake_signatures_clean
    table: signature

glossary_terms:
  parent_node_urn: urn:li:glossaryNode:for_rent
  terms:
    - id: closing_entity
      name: "Closing (Fechamento de Contrato)"
      description: >-
        The contract-closing process that ends with a signed rental contract. Tracked in
        dw_rent.dim_contract via closing_status and ts_signature. Also called fechamento,
        fechamento de contrato, or CC2CS (Contract Created to Contract Signed). The stage
        between proposal acceptance and an active rental contract.
    - id: cc2cs_metric
      name: "CC2CS (Contract Created to Contract Signed)"
      description: >-
        The closing stage as a whole, or the closing leadtime metric: working minutes from
        contract creation to signature. Pre-computed in dw_rent.fact_listing_rent_flows.cc2cs_working_minutes.
        Do not recompute manually — the pre-computed value already excludes non-working hours.
      related_terms:
        - urn: urn:li:glossaryTerm:closing_entity
          relationship: hasA
    - id: ca2cs_metric
      name: "CA2CS (Credit Approved to Contract Signed)"
      description: >-
        Metric connecting the credit approval stage with the closing stage — the share of
        credit approvals that eventually become signed contracts.
      related_terms:
        - urn: urn:li:glossaryTerm:closing_entity
          relationship: hasA
    - id: minuta_draft
      name: "Minuta (Contract Draft)"
      description: >-
        The contract draft stage. Identified in dw_rent.dim_contract by status = 'Minuta'
        and closing_status = 'RedacaoContrato'. The contract is being written and has not
        yet been sent to signatories.
      related_terms:
        - urn: urn:li:glossaryTerm:closing_entity
          relationship: isA
    - id: contrato_assinado
      name: "Contrato Assinado (Signed Contract)"
      description: >-
        A contract where all signatories have signed. Identified by closing_status = 'ContratoAssinado'
        or ts_signature IS NOT NULL in dw_rent.dim_contract. Equivalent to status = 'Ativo'
        for currently-active signed contracts, but closing_status is preferred for the broader
        "has ever been signed" question.
      related_terms:
        - urn: urn:li:glossaryTerm:closing_entity
          relationship: isA
    - id: signatory_role
      name: "Signatório (Signatory)"
      description: >-
        A person involved in signing the contract. One row per person per contract in
        dw_rent.fact_contract_people, identified by contract_role. Roles: tenant (inquilino/locatário),
        landlord (proprietário/locador), sponsor/guarantor (fiador), dweller (morador), partner (imobiliária parceira).
    - id: early_demand
      name: "Early Demand"
      description: >-
        A listing that starts a new rent flow (proposal → closing) before the previous contract
        on the same house finishes its termination process. Detection: new proposal date falls
        between datalake_terminator_clean.termination.ts_created (termination request) and
        dt_termination (scheduled end) for the same house. The house is still published
        (dim_house_listing.status = 'PUBLISHED') while the previous contract is still Ativo.

documentation_link:
  label: "Business entity documentation (closing.md)"
  url: >-
