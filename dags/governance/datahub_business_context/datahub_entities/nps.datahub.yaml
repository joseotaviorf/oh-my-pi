spec_version: 1
kind: data_product_curated_entity

product_display_name: "NPS"
product_description: |
  NPS (Net Promoter Score) measures overall customer loyalty and brand perception at
  QuintoAndar. It is collected through structured campaigns dispatched via the Tracksale
  platform — NOT from per-ticket interactions (that is CSAT, a separate entity under
  dw_satisfaction_rating).

  NPS campaigns target specific customer segments at key moments in the journey. Each
  campaign dispatch asks "How likely are you to recommend QuintoAndar?" on a 0–10 scale:
  - 0–6: detractor
  - 7–8: passive
  - 9–10: promoter
  NPS score = % Promoters - % Detractors (never use average score).

  Each NPS answer may include a free-text justification explaining the score, stored in
  fact_nps_answer_justifications joined via sk_nps_answer.

  Table grain:
  - fact_nps_dispatches: 1 row per dispatch (one survey sent to one customer).
  - fact_nps_customer_metrics: 1 row per customer (aggregated NPS metrics).
  - fact_nps_answer_justifications: 1 row per justification text; join via sk_nps_answer.
  - dim_nps_campaign: 1 row per NPS campaign definition.
  - dim_nps_answer: 1 row per answer; contains score_category (promoter/passive/detractor).

  Key join patterns:
  - Campaign: fact_nps_dispatches.sk_nps_campaign = dim_nps_campaign.sk_nps_campaign
  - Answer: fact_nps_dispatches.sk_nps_answer = dim_nps_answer.sk_nps_answer
  - Justification: fact_nps_answer_justifications.sk_nps_answer = fact_nps_dispatches.sk_nps_answer

  Key metrics: NPS score (% promoters - % detractors), response rate
  (dispatches answered / total), NPS by campaign (journey-moment segmentation),
  NPS trend per period, detractor volume, justification analysis (free-text from
  fact_nps_answer_justifications).

  Critical rules:
  - Use dim_nps_answer.score_category (lower case: 'promoter', 'passive', 'detractor')
    for classification — never use raw score thresholds directly without this dimension.
  - Always use sk_nps_campaign and sk_nps_answer with the nps_ prefix — not sk_campaign
    or sk_answer (those do not exist in this schema).
  - Do not confuse NPS (brand loyalty via Tracksale) with CSAT (per-ticket satisfaction,
    schema dw_satisfaction_rating) — they are entirely separate.
  - Low response rates make NPS unreliable — always report response rate alongside score.
  - Offboarding NPS is also in datalake_offboarding.nps and nps_agg (see Termination entity).

  Query 2 (NPS by campaign) from source doc:
    SELECT dnc.name, dnc.customer_journey, dnc.business_context,
        COUNT(*) AS total_responses,
        SUM(CASE WHEN dna.score_category = 'promoter' THEN 1 ELSE 0 END) AS promoters,
        SUM(CASE WHEN dna.score_category = 'passive'  THEN 1 ELSE 0 END) AS passives,
        SUM(CASE WHEN dna.score_category = 'detractor' THEN 1 ELSE 0 END) AS detractors,
        (CAST(SUM(CASE WHEN dna.score_category = 'promoter' THEN 1 ELSE 0 END) AS DOUBLE)
         - CAST(SUM(CASE WHEN dna.score_category = 'detractor' THEN 1 ELSE 0 END) AS DOUBLE))
         / COUNT(*) * 100 AS nps_score
    FROM dw_customer_satisfaction.fact_nps_dispatches AS fnd
    INNER JOIN dw_customer_satisfaction.dim_nps_answer AS dna ON fnd.sk_nps_answer = dna.sk_nps_answer
    LEFT JOIN  dw_customer_satisfaction.dim_nps_campaign AS dnc ON fnd.sk_nps_campaign = dnc.sk_nps_campaign
    WHERE fnd.is_answered = true AND dna.ts_answered >= DATE '2025-01-01'
    GROUP BY 1, 2, 3

  Further detail and table routing: docs/llm_context/business_entities/nps.md

data_product_id: nps
domain_urn: urn:li:domain:support_and_services

structured_property:
  qualified_name: br.com.quintoandar.datahub.nps.golden_query
  legacy_qualified_names_to_drop:
    - br.com.quintoandar.datahub.nps.golden_query_url

golden_query:
  stable_urn: urn:li:query:8ffaaa5b-5cf0-457c-ba64-471a9de7a8e2
  name: "Query 1 — Monthly NPS trend"
  description: >-
    NPS score trend by month. Uses dim_nps_answer.score_category (lower case) for
    promoter/detractor classification. Formula: (promoters - detractors) / total * 100.
    Source: docs/llm_context/business_entities/nps.md
  subjects:
    - schema: dw_customer_satisfaction
      table: fact_nps_dispatches
    - schema: dw_customer_satisfaction
      table: dim_nps_answer
  sql: |
    SELECT
        date_trunc('month', CAST(dna.ts_answered AS TIMESTAMP)) AS month_answered,
        COUNT(*) AS total_responses,
        SUM(CASE WHEN dna.score_category = 'promoter' THEN 1 ELSE 0 END) AS promoters,
        SUM(CASE WHEN dna.score_category = 'detractor' THEN 1 ELSE 0 END) AS detractors,
        (CAST(SUM(CASE WHEN dna.score_category = 'promoter' THEN 1 ELSE 0 END) AS DOUBLE)
         - CAST(SUM(CASE WHEN dna.score_category = 'detractor' THEN 1 ELSE 0 END) AS DOUBLE))
         / COUNT(*) * 100 AS nps_score
    FROM dw_customer_satisfaction.fact_nps_dispatches AS fnd
    INNER JOIN dw_customer_satisfaction.dim_nps_answer AS dna
        ON fnd.sk_nps_answer = dna.sk_nps_answer
    WHERE fnd.is_answered = true
        AND dna.ts_answered >= DATE '2025-01-01'
    GROUP BY 1

datasets:
  - schema: dw_customer_satisfaction
    table: fact_nps_dispatches
  - schema: dw_customer_satisfaction
    table: fact_nps_customer_metrics
  - schema: dw_customer_satisfaction
    table: fact_nps_answer_justifications
  - schema: dw_customer_satisfaction
    table: dim_nps_campaign
  - schema: dw_customer_satisfaction
    table: dim_nps_answer
  - schema: datalake_tracksale_clean
    table: answer
  - schema: datalake_tracksale_clean
    table: campaign
  - schema: datalake_tracksale_clean
    table: dispatch

glossary_terms:
  parent_node_urn: urn:li:glossaryNode:customer_satisfaction
  terms:
    - id: nps_score
      name: "NPS Score"
      description: >-
        Net Promoter Score formula: % Promoters (score 9–10) minus % Detractors (score 0–6)
        multiplied by 100. Never use average score. Always use dim_nps_answer.score_category
        (lower case: 'promoter', 'passive', 'detractor') for classification.
    - id: nps_promoter
      name: "Promoter (NPS)"
      description: >-
        A customer who gave a score of 9 or 10 in an NPS survey. Positive signal for brand
        loyalty. In DataHub: dim_nps_answer.score_category = 'promoter'.
      related_terms:
        - urn: urn:li:glossaryTerm:nps_score
          relationship: hasA
    - id: nps_passive
      name: "Passive (NPS)"
      description: >-
        A customer who gave a score of 7 or 8 in an NPS survey. Neither promotes nor
        detracts. Not included in the NPS score calculation.
        In DataHub: dim_nps_answer.score_category = 'passive'.
      related_terms:
        - urn: urn:li:glossaryTerm:nps_score
          relationship: hasA
    - id: nps_detractor
      name: "Detractor (NPS)"
      description: >-
        A customer who gave a score of 0–6 in an NPS survey. Negative signal subtracted
        from the NPS score. In DataHub: dim_nps_answer.score_category = 'detractor'.
      related_terms:
        - urn: urn:li:glossaryTerm:nps_score
          relationship: hasA
    - id: nps_campaign
      name: "NPS Campaign"
      description: >-
        A structured NPS survey program dispatched via Tracksale targeting a specific
        customer segment at a specific journey moment (e.g. post-move-in, post-offboarding).
        Metadata in dim_nps_campaign: name, main_channel, business_context, customer_journey,
        purpose, customer_type, metric_group. Join key: sk_nps_campaign.
    - id: nps_justificativa
      name: "Justificativa (NPS Justification)"
      description: >-
        Free-text feedback explaining the NPS score, stored in
        dw_customer_satisfaction.fact_nps_answer_justifications. Grain: 1 row per
        justification text. Join via sk_nps_answer. Useful for qualitative analysis of
        detractor root causes (filter dim_nps_answer.score_category = 'detractor').
    - id: nps_tracksale
      name: "Tracksale"
      description: >-
        The external survey platform used by QuintoAndar to dispatch NPS campaigns and
        collect answers. Raw NPS data from Tracksale lives in tracksale_clean.answer,
        tracksale_clean.campaign, and tracksale_clean.dispatch. The DW tables
        (dw_customer_satisfaction.*) are the analytical layer built on top of these raws.
    - id: nps_response_rate
      name: "NPS Response Rate"
      description: >-
        Percentage of dispatched NPS surveys that received an answer:
        COUNT(*) WHERE is_answered = true / COUNT(*) total dispatches. A low response rate
        makes NPS results unreliable and must be reported alongside the NPS score itself.
        Column: fact_nps_dispatches.is_answered.
    - id: nps_vs_csat
      name: "NPS vs CSAT distinction"
      description: >-
        NPS = overall brand loyalty measured via Tracksale campaigns (dw_customer_satisfaction).
        CSAT = per-ticket or per-interaction satisfaction from multiple sources
        (dw_satisfaction_rating). These are entirely separate entities in separate DW schemas
        and must not be confused or compared directly.

