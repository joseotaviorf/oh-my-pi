# ==============================================================================
# DataHub YAML schema reference — spec_version: 1
# ==============================================================================
#
# Entity configs are NOT committed per entity. CI generates ephemeral YAML from
# docs/llm_context/{business_entities,metric_entities}/{entity}.md via:
#   packages/bietlejuice-compiler/scripts/ci_cd/generate_and_push_datahub_entities.py
#
# Authoring flow:
#   1. Write / update the entity .md (see _TEMPLATE.md in the matching directory)
#   2. Push to master (or run the generate script locally) — CI publishes to DataHub
#   3. Verify: uv run python dags/governance/datahub_business_context/smoke_test_datahub.py
#
# Each golden query's stable_urn is assigned deterministically by CI (uuid5 from entity
# slug for query 0, uuid5 from "slug:N" for the rest). Author them as "TBD".
#
# Domain vs metric:
#   domain — from business_entities/_TEMPLATE.md; requires `datasets:` (primary-owner tables)
#   metric — from metric_entities/_TEMPLATE.md; Trino + Superset URNs from ## Superset Golden Assets
#            linked as reference assets on the product Summary; add `related_data_products:`
#
# ==============================================================================

spec_version: 1
kind: data_product_curated_entity

product_display_name: "{Human-readable name}"
product_description: |
  ...

data_product_id: {entity_slug_kebab}
domain_urn: urn:li:domain:{domain}
lifecycle_stage: prod  # draft | review | prod | deprecated
data_product_type: domain  # domain | metric

# Ownership — CI-injected from the `## Ownership` section of the entity .md; do NOT
# hand-author. Emails become DataHub owners on the Data Product:
#   data_owner   -> ownership type Business Owner (urn:li:ownershipType:__system__business_owner)
#   data_steward -> ownership type Data Steward   (urn:li:ownershipType:__system__data_steward)
# The block is declaratively synced (owners removed from the .md are removed in DataHub);
# omit it when the .md has no resolvable @quintoandar.com.br emails. An owner who has no
# CorpUser yet (never used DataHub) is auto-provisioned as a minimal stub before assignment.
# owners:
#   data_owner:
#     - {data_owner_email@quintoandar.com.br}
#   data_steward:
#     - {data_steward_email@quintoandar.com.br}

# MBR — metric products only; CI-injected from the `## MBR` section of the metric .md;
# do NOT hand-author. Each name becomes a value of the `data_product.mbr` structured
# property (multi-valued, filterable in DataHub). Declaratively synced: a metric with no
# `## MBR` section has any previous value cleared. Omit the block when not part of any MBR.
# mbr:
#   - {MBR Name}

structured_property:
  qualified_name: br.com.quintoandar.datahub.data_product.golden_query
  legacy_qualified_names_to_drop:
    - br.com.quintoandar.datahub.{entity_slug_kebab}.golden_query
    - br.com.quintoandar.datahub.{entity_slug_kebab}.golden_query_url

golden_queries:
  - stable_urn: "TBD"          # CI assigns the deterministic URN per query (uuid5)
    name: "Query 1 — ..."
    description: >-
      ...
    subjects:
      - schema: ...
        table: ...
    sql: |
      ...
  - stable_urn: "TBD"
    name: "Query 2 — ..."
    description: >-
      ...
    subjects:
      - schema: ...
        table: ...
    sql: |
      ...

# Domain entities only — primary-owner Trino/Databricks tables.
datasets:
  - schema: ...
    table: ...

# Metric entities — Trino/Databricks + Superset URNs from ## Superset Golden Assets.
# datasets:
#   - schema: sandbox
#     table: nps_fr
#   - urn: urn:li:dataset:(urn:li:dataPlatform:superset,{id},PROD)

# Metric entities only — upstream business entity data product ids (kebab-case).
# related_data_products:
#   - nps
#   - supply

glossary_terms:
  parent_node_urn: urn:li:glossaryNode:{domain}
  terms:
    - id: {term_slug}
      name: "..."
      description: >-
        ...

documentation_link:
  label: "Business entity documentation ({entity}.md)"  # or "Metric entity documentation ..."
  url: >-
    https://github.com/quintoandar/bi-etl-ejuice/blob/master/docs/llm_context/business_entities/{entity}.md
