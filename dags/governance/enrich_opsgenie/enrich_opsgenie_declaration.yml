---
dag:
  name: enrich_opsgenie
  schedule_start_date: 2020, 1, 1
  owner: Data Governance
  documentation:
    dag_purpose: Get data from JiraOps alerts and Jira incidents to monitor Data Engineering Incidents.
workflow:
  type: query_delta
  layer: enrich
  inner_dependencies:
    alerts:
      - jira_alert_actions
    acordamentos:
      - alerts
    incidents:
      - alerts
  tables_customization:
    alerts:
      extraction_type: incremental
      partitions: [year, month, day]
    acordamentos:
      extraction_type: full
    incidents:
      extraction_type: incremental
      partitions: [year, month, day]
cluster:
  type: databricks_12_2_min_memory_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
