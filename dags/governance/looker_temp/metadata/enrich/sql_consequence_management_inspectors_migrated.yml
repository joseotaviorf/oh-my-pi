database_name: datalake_looker_temp
table_name: sql_consequence_management_inspectors_migrated
owner: giuseppe.giovanelli@quintoandar.com.br
domain: Data Ops & Governance
description: Temporary table sql_consequence_management_inspectors_migrated from Looker.
columns:
  sk_inspector:
    description: key of inspector
  name:
    description: Name of inspector
  email:
    description: Email of inspector
  company:
    description: Company of inspector
  regional_inspection:
    description: Regional Inspections is a grouping of cities for operational purposes.
      Used by the regionals inspection operation team
  city_name:
    description: Regional Inspections is a grouping of cities for operational purposes.
      Used by the regionals inspection operation team
  active:
    description: If the inspector is active or deactivate
  total_csat_response:
    description: total of csat responss in respective week
  inspector_registered_end:
    description: Date of end as inspector
  inspector_registered_start:
    description: Date of start as inspector
  scheduling_week:
    description: Date of scheduling inspection
  score_blocked_schedule:
    description: Score for closing the schedule on the day of the inspection
  score_cancel_in_D0:
    description: Score for cancel inspection on the day of the inspection
  score_conversion:
    description: Score for realize inspections
  score_sync_in_24h:
    description: Score for sync inspection in 24h
  score_no_show:
    description: Score for No Show inpections
  score_dsat_tags:
    description: "Score for DSAT answers that contains at least one of the tags: 'Detalhes\
      \ das fotos dos itens do im\xF3vel' and 'Coment\xE1rios do vistoriador sobre\
      \ os itens do im\xF3vel'."
  schedule_closing_in_D0_in_onboarding:
    description: Number of onboarding inspections canceled due to schedule closure
      in D0 (difference of days between cancellation date and scheduling date)
  percentage_schedule_closing_in_D0_in_onboarding:
    description: Percentage of onboarding inspections canceled due to schedule closure
      in D0 (difference of days between cancellation date and scheduling date)
  schedule_closing_in_D0_in_offboarding:
    description: Number of offboarding inspections canceled due to schedule closure
      in D0 (difference of days between cancellation date and scheduling date)
  percentage_schedule_closing_in_D0_in_offboarding:
    description: Percentage of offboarding inspections canceled due to schedule closure
      in D0 (difference of days between cancellation date and scheduling date)
  onboarding_inspection_cancel_in_D0:
    description: Number of onboarding inspections canceled in D0 (difference of days
      between cancellation date and scheduling date)
  percentage_onboarding_inspection_cancel_in_D0:
    description: Percentage of onboarding inspections canceled in D0 (difference of
      days between cancellation date and scheduling date)
  offboarding_inspection_cancel_in_D0:
    description: Number of offboarding inspections canceled in D0 (difference of days
      between cancellation date and scheduling date)
  percentage_offboarding_inspection_cancel_in_D0:
    description: Percentage of offboarding inspections canceled in D0 (difference
      of days between cancellation date and scheduling date)
  onboarding_inspection_sync_in_same_day:
    description: Number of onboarding inspections synced in the same day
  percentage_onboarding_inspection_sync_in_same_day:
    description: Number of onboarding inspections synced in the same day
  offboarding_inspection_sync_in_same_day:
    description: Number of offboarding inspections synced in the same day
  percentage_offboarding_inspection_sync_in_same_day:
    description: Number of offboarding inspections synced in the same day
  onboarding_inspection_no_show:
    description: Number of onboarding inspections canceled due inspector didn't show
      up
  percentage_onboarding_inspection_no_show:
    description: Percentage of onboarding inspections canceled due inspector didn't
      show up
  offboarding_inspection_no_show:
    description: Number of offboarding inspections canceled due inspector didn't show
      up
  percentage_offboarding_inspection_no_show:
    description: Percentage of offboarding inspections canceled due inspector didn't
      show up
  onboarding_inspection_done:
    description: Number of onboarding inspections done
  percentage_onboarding_inspection_done:
    description: Percentage of onboarding inspections done
  offboarding_inspection_done:
    description: Number of offboarding inspections done
  percentage_offboarding_inspection_done:
    description: Percentage of offboarding inspections done
