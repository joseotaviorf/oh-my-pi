database_name: datalake_looker_temp
table_name: sql_inspections_onboarding_migrated
owner: giuseppe.giovanelli@quintoandar.com.br
domain: Data Ops & Governance
description: Temporary table sql_inspections_onboarding_migrated from Looker.
columns:
  sk_contract:
    description: The id of the contract associated with this inspection
  sk_inspection:
    description: The id of the inspection
  sk_booking:
    description: The booking id associated with this inspection
  status:
    description: The current status of the inspection, if it is scheduled, done, etc.
  type:
    description: The type of this inspection.  The main ones are Entrance and Exit
      inspection
  inspection:
    description: The date when the inspection was done and the photos were uploaded
      by the inspector
  inspection_scheduled:
    description: Date when the inspection was expected to happen
  expired:
    description: The id of the date of expiration of inspection
  owner_approved:
    description: Date when owner approved the inspection
  tenant_approved:
    description: Date when tenant approved the inspection
  last_synced:
    description: Last timestamp of when the inspection synced
  first_synced:
    description: First timestamp of when the inspection synced
  inspection_created:
    description: Date when the inspection booking was created. Can be used to define,
      for example, how many days the entrance inspection is booked before the contract
      start date
  inspection_expired:
    description: Date of when the inspection expires. Users (inspectors, tenants,
      owners) can add comments before this date. After this date the inspection will
      be closed for comments
