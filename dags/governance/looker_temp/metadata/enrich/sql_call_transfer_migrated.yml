database_name: datalake_looker_temp
table_name: sql_call_transfer_migrated
owner: giuseppe.giovanelli@quintoandar.com.br
domain: Data Ops & Governance
description: Temporary table sql_call_transfer_migrated from Looker.
columns:
  sk_call:
    description: Unique identifier for the call
  sk_task:
    description: Unique identifier for the task
  previous_department:
    description: The previous department
  origin_department:
    description: The department that made the transfer
  transferred_department:
    description: The department that received the transfer
  origin_company:
    description: The company that made the transfer
  transferred_company:
    description: The company that received the transfer
  origin_agent:
    description: The agent that made the transfer
  transferred_agent:
    description: The agent that received the transfer
  task_order:
    description: The order of the task in the call
  is_first_task:
    description: Whether is the first answered task in the call
  is_last_task:
    description: Whether is the last answered task in the call
  is_transferred_task:
    description: Whether the task was transferred or not
  is_received_from_other_departments:
    description: The volume of answered tasks received from others departments
  is_received_from_same_department:
    description: The volume of answered tasks received from the same departments
  answered_transferred_tasks:
    description: The volume of answered tasks transferred
  answered_tasks_directly_from_ura:
    description: The volume of first answered tasks
  answered_tasks_from_other_departments:
    description: The volume of answered tasks received from others departments
  answered_tasks_from_internal_transfer:
    description: The volume of answered tasks received from the same departments
