database_name: datalake_looker_temp
table_name: sql_aux_inspections_analise_1_migrated
owner: giuseppe.giovanelli@quintoandar.com.br
domain: Data Ops & Governance
description: Temporary table sql_aux_inspections_analise_1_migrated from Looker.
columns:
  sk_contract:
    description: The id of the contract associated with this inspection
  sk_inspection:
    description: The id of the inspection
  id_house:
    description: house id (the same house can have multiple listings)
  is_b2b:
    description: True if house comes from a b2b partner
  comments_inspectors:
    description: Number of comments by inspectors in review inspection
  comments_owner:
    description: Number of comments by owner in review inspection
  inspector_name:
    description: Full name of user
  analyst_name:
    description: Full name of user
  is_owner_approved:
    description: If the property owner approved the inspection
  house_total_area:
    description: Total area in squared meters
  is_house_furnished:
    description: Is house listing furnished
  nps_tenant:
    description: Number of MPS by tenant in review inspection
  nps_owner:
    description: Number of MPS by owner in review inspection
  regional_inspection:
    description: Regional Inspections is a grouping of cities for operational purposes.
      Used by the regionals inspection operation team
  city_name:
    description: The name for the city where this region is in
  action_type:
    description: The task's action categories
  termination:
    description: Date indicating when the termination is supposed to happen as asked
      by tenant
  inspection_scheduled:
    description: Date when the inspection was expected to happen
  last_synced:
    description: Last timestamp of when the inspection synced
  start:
    description: Timestamp of task start event
  completed:
    description: Timestamp of task completion event
  termination_finished:
    description: Timestamp indicating the event of finishing the termination. When
      the status is set to done and all repairs is finished. Differs from contract
      ending
  answered:
    description: Date in which the NPS customer has answered the survey, if they decided
      to do so.
