database_name: datalake_looker_temp
table_name: sql_aux_agents_migrated
owner: giuseppe.giovanelli@quintoandar.com.br
domain: Data Ops & Governance
description: Temporary table sql_aux_agents_migrated from Looker.
columns:
  sk_user_agent:
    description: Key of user agent
  sk_agent:
    description: Key of agent
  permanently_disqualified:
    description: Flag indicating if agent was permanently disqualified
  days_since_activation_week:
    description: Number of days between activation week and current date
  disqualification_reason:
    description: Details about last agent's disqualification reason
  suspension_reason:
    description: Details about last agent's suspension reason
  status:
    description: Agent's actual status on Visits Ops flow
  agent_actual_type:
    description: Indicates if the agent is old or new hire on actual date. We consider
      an agent a new hire within 4 weeks of activation.
  actual_contract_type:
    description: Returns the name of the agent's current contract
  last_area:
    description: Returns the date the Agent was most recently allocated to the region
  load:
    description: Timestamp of when this data row was last loaded
  accreditation:
    description: Date when agent was activated on Visits Ops flow
  activation:
    description: Date when agent was activated on Visits Ops flow
  activation_week:
    description: Date when agent was activated on Visits Ops flow
  frame_activation_week:
    description: Date when agent was activated increased on 4 weeks, fixing new hire
      period on Visits Ops flow
  last_disqualification:
    description: Last date when agent was disqualified on Visits Ops flow
  last_disqualification_return:
    description: Last date when agent return after being disqualified on Visits Ops
      flow
  last_suspension:
    description: Last date when agent was suspended on Visits Ops flow
  last_suspension_return:
    description: Last date when agent was suspended on Visits Ops flow
  contract:
    description: Last date the agent's contract was updated
