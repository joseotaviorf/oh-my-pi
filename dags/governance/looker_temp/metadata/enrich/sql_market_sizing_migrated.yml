database_name: datalake_looker_temp
table_name: sql_market_sizing_migrated
owner: giuseppe.giovanelli@quintoandar.com.br
domain: Data Ops & Governance
description: Temporary table sql_market_sizing_migrated from Looker.
columns:
  pk:
    description: Primary Key
  microregion:
    description: A grouping of city or clusters of cities and neighborhoods as defined
      by IBGE
  city_group:
    description: "A grouping of city or clusters of cities and neighborhoods (RMSP:\
      \ Regi\xE3o Metropolitana de S\xE3o Paulo)"
  neighborhood_analysis:
    description: Date related to neighborhoods analysis metrics
  households_neighborhood_qa:
    description: Volume of private households in a region where 5A is present, considering
      neighborhoods as the referencial of presence
  households_neighborhood_total:
    description: Volume of private households in a region, considering neighborhoods
      as the referencial
  neighborhood_presence:
    description: Ratio between households_neighborhood_qa and households_neighborhood_total
      representing the percentage of neighborhoods where 5A is present in a given
      region
  households_cities_qa:
    description: Volume of private households in a region where 5A is present, considering
      cities as the referencial of presence
  households_cities_total:
    description: Volume of private households in a region, considering cities as the
      referencial of presence
  city_presence:
    description: Ratio between households_cities_qa and households_cities_total representing
      the percentage of cities where 5A is present in a given region
  vacant_residential_units:
    description: Number of Vacant Residential Units in a region for a given date
  market_sizing_presence:
    description: Product between neighborhood presence, city presence and vacant residential
      units
