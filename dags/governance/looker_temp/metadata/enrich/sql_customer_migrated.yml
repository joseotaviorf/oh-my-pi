database_name: datalake_looker_temp
table_name: sql_customer_migrated
owner: giuseppe.giovanelli@quintoandar.com.br
domain: Data Ops & Governance
description: Temporary table sql_customer_migrated from Looker.
columns:
  id_customer_context:
    description: Artificial key to enable models relationship, considering id of user
      or cpf when missing.
  sk_user:
    description: User ID of the customer, if they have login at QuintoAndar.
  customer_name:
    description: Name of the customer, if they have login at QuintoAndar.
  customer_email:
    description: Email of the customer, if they have login at QuintoAndar.
  sk_personal_document:
    description: Personal document ID (such as CPF or CNPJ) of customer, if registered.
  age:
    description: Customer's age, if provided in any of their registers.
  gender:
    description: Customer's gender, if provided in any of their registers.
  marital_status:
    description: Customer's marital status, if provided when creating contracts.
  has_houses:
    description: Flag to indicate whether customer has houses, thus is an owner at
      QuintoAndar.
  has_tenant_app:
    description: Flag to indicate whether customer has tenant app, thus might be a
      tenant.
  last_contract_role:
    description: Role that customer has exerced in their last contract, such as owner,
      tenant, partner, dweller.
  is_contract_user:
    description: Flag to indicate whether the person is the contract main user (main
      owner or main tenant).
  is_first_contract:
    description: Flag to indicate whether the last contract is also the first for
      that customer.
  has_lived:
    description: Flag to indicate whether the customer has lived in their last contract
  has_ongoing_contract:
    description: Flag to indicate whether the customer has ongoing contracts.
  is_agent:
    description: Flag to indicate whether the customer is an agent at QuintoAndar
      (has agent ID).
  is_rent_agent:
    description: Flag to indicate whether the customer is a rent agent at QuintoAndar.
  is_sale_agent:
    description: Flag to indicate whether the customer is a sale agent at QuintoAndar.
  is_photographer:
    description: Flag to indicate whether the customer is an photographer at QuintoAndar
      (has photographer ID).
  is_salesperson:
    description: Flag to indicate whether the customer is an salesperson at QuintoAndar
      (has salesperson ID).
  is_affiliate:
    description: Flag to indicate whether the customer is an affiliate at QuintoAndar
      (has affiliate ID).
  is_doorman:
    description: Flag to indicate whether the customer is an doorman at QuintoAndar
      (has doorman ID).
  contracts_created:
    description: Number of contracts ever created involving the customer in any role,
      independent of status.
