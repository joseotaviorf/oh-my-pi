database_name: datalake_looker_temp
table_name: sql_invoices_migrated
owner: giuseppe.giovanelli@quintoandar.com.br
domain: Data Ops & Governance
description: Temporary table sql_invoices_migrated from Looker.
columns:
  sk_invoice:
    description: Invoice registered in SeuBarriga
  frequency:
    description: Invoice frequency type to be sent
  invoice_user:
    description: User type related to the invoice rather than contract
  status:
    description: Invoice payment status
  due_amount:
    description: Invoice due amount in Brazilian reais
  paid_amount:
    description: Invoice paid amount in Brazilian reais
  entry_due_amount:
    description: The total amount due in invoice entries in Brazilian reais
  entry_paid_amount:
    description: The total amount paid in invoice entries in Brazilian reais
  days_between_invoice_created_to_due:
    description: Difference between created date to due date in days
  days_between_invoice_created_to_paid:
    description: Difference between created date to paid date in days
  days_between_invoice_due_to_paid:
    description: Difference between created date to paid date in days
  invoice_created:
    description: The date in which invoice will be created
  invoice_due:
    description: The date in which invoice will be due
  invoice_paid:
    description: The date in which invoice was paid, if it is the case of its status
  invoices:
    description: Count all invoices created
  invoices_paid:
    description: Count all invoices that were paid
  invoices_open:
    description: Count all invoices that are open
  monthly_invoices_created:
    description: Count all invoices that are sent monthly
  monthly_invoices_paid:
    description: Count all monthly invoices that were paid
  onboarding_invoices_created:
    description: Count all invoices that are sent during onboarding
  onboarding_invoices_paid:
    description: Count all onboarding invoices that were paid
  brl_invoices_negative_due_amount:
    description: Total invoice due amount to be transferred to others and debited
      internally in Brazilian reais
  brl_invoices_negative_paid_amount:
    description: Total invoice amount paid to others and debited internally in Brazilian
      reais
  brl_invoices_positive_due_amount:
    description: Total invoice due amount to be charged from others and credited internally
      in Brazilian reais
  brl_invoices_positive_paid_amount:
    description: Total invoice amount paid from others and credited internally in
      Brazilian reais
  total_entry_due_amount:
    description: Total invoice amount due in Brazilian reais
  total_entry_paid_amount:
    description: Total invoice amount due in Brazilian reais
