database_name: datalake_looker_temp
table_name: sql_growth_plaquinhas_contacts
owner: giuseppe.giovanelli@quintoandar.com.br
domain: Data Ops & Governance
description: Temporary table sql_growth_plaquinhas_contacts from Looker.
columns:
  id_contact:
    description: Contact key, from chatbot or fact_calls dimensional model (Twillio).
  id_user:
    description: Id user of the contactant, when it exists.
  contact_channel:
    description: Channel through which the user made contact.
  contact:
    description: Date on which the user contacted QuintoAndar.
  count_contacts:
    description: Count of distinct contacts made to Plaquinhas phone number or chats
      about Plaquinhas.
