dag:
  name: superset_internal
  schedule_start_date: 2024, 3, 1
  schedule_interval: 0 0 * * *
  owner: Data Governance
workflow:
  type: database_pull
  layer: raw
  custom_schema: superset
  database_type: postgres
  default_extraction_type: incremental
  default_partitions: ["year", "month", "day"]
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, ds, 'load_end_date') }}"
  dbutils_secret_key: SUPERSET_DB
  tables_customization:
    ab_role:
      extraction_type: full
      partitions: []
    ab_user:
      date_filter_column: changed_on
    ab_user_role:
      extraction_type: full
      partitions: []
    logs:
      date_filter_column: dttm
    saved_query:
      date_filter_column: changed_on
    query:
      date_filter_column: changed_on

cluster:
  type: databricks_12_2_min_general_cluster
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE
