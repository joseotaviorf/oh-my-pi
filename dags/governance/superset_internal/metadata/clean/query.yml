---
database_name: datalake_superset_clean
table_name: query
owner: vitor.carneiro@quintoandar.com.br
domain: Data Ops & Governance
description: >
  Clean-layer snapshot of SQL Lab query executions in Apache Superset replicated from the Superset
  PostgreSQL query table via CDC (superset_internal, daily 00:00 UTC). Grain is one row per executed
  or attempted query per load date. Partitioned by year, month, day — filter on execution date.
  Used for governance analytics on ad-hoc query volume, performance, errors, and user behavior.
columns:
  id:
    lineage:
      - datalake_superset_raw.query.id
    description: Primary key from Superset query identifying a distinct SQL Lab execution attempt record.
  id_client:
    lineage:
      - datalake_superset_raw.query.client_id
    description: Browser session client identifier assigned by Superset SQL Lab for the query tab.
  id_database:
    lineage:
      - datalake_superset_raw.query.database_id
    description: Foreign key to the Superset database connection selected as the query execution target.
  id_sql_editor:
    lineage:
      - datalake_superset_raw.query.sql_editor_id
    description: Identifier of the SQL Lab editor tab session that initiated this query execution.
  id_user:
    lineage:
      - datalake_superset_raw.query.user_id
    description: Foreign key to ab_user.id for the Superset account that submitted the SQL Lab query.
  tmp_table_name:
    lineage:
      - datalake_superset_raw.query.tmp_table_name
    description: Name of the temporary table created when the query runs as CREATE TABLE AS SELECT (CTAS).
  tab_name:
    lineage:
      - datalake_superset_raw.query.tab_name
    description: User-visible label of the SQL Lab tab where the query was composed and executed.
  status:
    lineage:
      - datalake_superset_raw.query.status
    description: Execution outcome of the query (for example success, failed, running, or timed_out).
  schema:
    lineage:
      - datalake_superset_raw.query.schema
    description: Target database schema selected in SQL Lab for query execution context.
  sql:
    lineage:
      - datalake_superset_raw.query.sql
    description: Full SQL statement submitted by the user in SQL Lab before engine-specific rewriting.
  select_sql:
    lineage:
      - datalake_superset_raw.query.select_sql
    description: SELECT portion of the submitted SQL, extracted when Superset splits CTAS statements.
  executed_sql:
    lineage:
      - datalake_superset_raw.query.executed_sql
    description: SQL statement actually sent to the database engine after Superset preprocessing and limits.
  limit:
    lineage:
      - datalake_superset_raw.query.limit
    description: Maximum number of rows Superset requested the engine to return for this query run.
  select_as_cta:
    lineage:
      - datalake_superset_raw.query.select_as_cta
    description: Boolean flag indicating whether the user chose to persist results as a new table (CTAS).
  select_as_cta_used:
    lineage:
      - datalake_superset_raw.query.select_as_cta_used
    description: Boolean flag indicating whether the CTAS option was applied during this execution.
  progress:
    lineage:
      - datalake_superset_raw.query.progress
    description: Percentage of query execution completed as reported by Superset (typically 0 or 100).
  rows:
    lineage:
      - datalake_superset_raw.query.rows
    description: Number of result rows returned by the query engine for this execution.
  error_message:
    lineage:
      - datalake_superset_raw.query.error_message
    description: Error text surfaced to the user when the query failed in SQL Lab or the database engine.
  results_key:
    lineage:
      - datalake_superset_raw.query.results_key
    description: Cache key Superset uses to retrieve stored query results from the async results backend.
  tracking_url:
    lineage:
      - datalake_superset_raw.query.tracking_url
    description: URL pointing to query execution details in the Superset async worker or engine UI.
  extra_json:
    lineage:
      - datalake_superset_raw.query.extra_json
    description: JSON blob with supplemental execution metadata (columns, engine logs, or Celery task info).
  tmp_schema_name:
    lineage:
      - datalake_superset_raw.query.tmp_schema_name
    description: Schema name where a CTAS temporary table would be created for this query run.
  ctas_method:
    lineage:
      - datalake_superset_raw.query.ctas_method
    description: Strategy Superset used to materialize CTAS results (for example TABLE or VIEW).
  limiting_factor:
    lineage:
      - datalake_superset_raw.query.limiting_factor
    description: Component that capped result size (for example QUERY, DROPDOWN, or NOT_LIMITED).
  ts_start_running:
    lineage:
      - datalake_superset_raw.query.start_running_time
    description: Unix epoch timestamp when the query began executing on the database engine.
  ts_end_result_backend:
    lineage:
      - datalake_superset_raw.query.end_result_backend_time
    description: Timestamp when query results were fully written to the Superset async results backend.
  ts_start:
    lineage:
      - datalake_superset_raw.query.start_time
    description: Unix epoch timestamp when Superset accepted and queued the query for execution.
  ts_changed:
    lineage:
      - datalake_superset_raw.query.changed_on
    description: Timestamp when this query record was last updated in Superset (UTC).
  ts_end:
    lineage:
      - datalake_superset_raw.query.end_time
    description: Unix epoch timestamp when query execution finished (success or failure).
  year:
    lineage:
      - datalake_superset_raw.query.year
    description: Year of the data load date, used for Hive partitioning — include in filters for partition pruning.
  month:
    lineage:
      - datalake_superset_raw.query.month
    description: Month of the data load date, used for Hive partitioning — include in filters for partition pruning.
  day:
    lineage:
      - datalake_superset_raw.query.day
    description: Day of the data load date, used for Hive partitioning — include in filters for partition pruning.
