---
database_name: datalake_superset_clean
table_name: saved_query
owner: vitor.carneiro@quintoandar.com.br
domain: Data Ops & Governance
description: >
  Clean-layer snapshot of personal SQL Lab saved queries in Apache Superset replicated from the
  Superset PostgreSQL saved_query table via CDC (superset_internal, daily 00:00 UTC). Grain is one
  row per saved query per load date. Queries are private to their creator in Superset. Partitioned
  by year, month, day — filter on ingestion date. Supports reuse-pattern and SQL-governance analytics.
columns:
  id:
    lineage:
      - datalake_superset_raw.saved_query.id
    description: Primary key from Superset saved_query identifying a personal SQL Lab bookmark record.
  id_user:
    lineage:
      - datalake_superset_raw.saved_query.id_user
    description: Foreign key to ab_user.id for the Superset account that owns this saved query.
  id_database:
    lineage:
      - datalake_superset_raw.saved_query.id_database
    description: Foreign key to the Superset database connection targeted by the saved SQL statement.
  uuid:
    lineage:
      - datalake_superset_raw.saved_query.uuid
    description: Universally unique identifier assigned by Superset for stable saved-query references.
  label:
    lineage:
      - datalake_superset_raw.saved_query.label
    description: Human-readable title assigned by the user to label the saved SQL Lab query.
  schema:
    lineage:
      - datalake_superset_raw.saved_query.schema
    description: Default database schema context stored with the saved query for SQL Lab execution.
  sql:
    lineage:
      - datalake_superset_raw.saved_query.sql
    description: Full SQL statement stored in the saved query and executed from SQL Lab when reopened.
  description:
    lineage:
      - datalake_superset_raw.saved_query.description
    description: Free-text note from the creator explaining the business purpose of the saved query.
  id_user_changed:
    lineage:
      - datalake_superset_raw.saved_query.id_user_changed
    description: Foreign key to ab_user.id for the account that last edited this saved query definition.
  id_user_created:
    lineage:
      - datalake_superset_raw.saved_query.id_user_created
    description: Foreign key to ab_user.id for the account that originally created this saved query.
  extra_json:
    lineage:
      - datalake_superset_raw.saved_query.extra_json
    description: JSON blob with additional Superset metadata attached to the saved query record.
  last_run:
    lineage:
      - datalake_superset_raw.saved_query.last_run
    description: Timestamp of the most recent execution of this saved query in SQL Lab (null if never run).
  rows:
    lineage:
      - datalake_superset_raw.saved_query.rows
    description: Row count returned by the last execution of this saved query in SQL Lab.
  template_parameters:
    lineage:
      - datalake_superset_raw.saved_query.template_parameters
    description: JSON map of Jinja template parameters configured for parameterized saved queries.
  ts_created:
    lineage:
      - datalake_superset_raw.saved_query.ts_created
    description: Timestamp when the saved query record was first created in Superset (UTC).
  ts_changed:
    lineage:
      - datalake_superset_raw.saved_query.ts_changed
    description: Timestamp when the saved query definition was last modified in Superset (UTC).
  year:
    lineage:
      - datalake_superset_raw.saved_query.year
    description: Year of the data load date, used for Hive partitioning — include in filters for partition pruning.
  month:
    lineage:
      - datalake_superset_raw.saved_query.month
    description: Month of the data load date, used for Hive partitioning — include in filters for partition pruning.
  day:
    lineage:
      - datalake_superset_raw.saved_query.day
    description: Day of the data load date, used for Hive partitioning — include in filters for partition pruning.
