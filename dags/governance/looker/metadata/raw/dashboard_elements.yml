---
database_name: datalake_looker_raw
table_name: dashboard_elements
owner: rafael.augusto@quintoandar.com.br
domain: Data Ops & Governance
description: This table contains informations about dashboard elements from Looker
columns:
  id:
    description: Dashboard element id
  title:
    description: name of the dashboard element
  type:
    description: The type of the dashboard element
    categories:
      button: If the dashboard element is a button
      text: If the dashboard element is a text
      data: If the dashboard element is a dataset
      vis: If the dashboard element is a visualization
  dashboard_id:
    description: The dashboard that the element belongs to
  look_id:
    description: Id of the Look the dashboard element was built from
  query_id:
    description: Id of the query used by the dashboard id
  year:
    description: ingestion year
  month:
    description: ingestion month
  day:
    description: ingestion day
