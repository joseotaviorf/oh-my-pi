database_name: datalake_trino
table_name: query_information
owner: isadora.gallerani@quintoandar.com.br
domain: Data Ops & Governance
description: >
  Incremental enrich-layer snapshot of Trino query events exported from Databricks
  data_platform_metrics by enrich_trino (daily 05:00 UTC). Grain is one row per query and referenced
  table per execution date. Partitioned by year, month, day — filter on extraction date. Supports
  query observability and table usage analytics.
columns:
  id_query:
    lineage:
      - data_platform_metrics.trino_query_log_events_metrics_clean_batch.queryId
    description: Unique Trino query identifier assigned at execution time; not unique in this table because queries may reference multiple tables.
  id_table:
    lineage:
      - data_platform_metrics.trino_query_log_events_metrics_clean_batch.referenced_table
    description: Fully qualified table reference (schema.table) used by the query, one row per referenced table.
  tool:
    lineage:
      - data_platform_metrics.trino_query_log_events_metrics_clean_batch.resourceGroupId
    description: BI or analytics tool that submitted the query (for example Metabase, Superset, Looker, or DataHub).
  id_slice_superset:
    lineage:
      - data_platform_metrics.trino_query_log_events_metrics_clean_batch.query
    description: Superset chart slice identifier parsed from the query text when the query originates from Superset.
  id_metabase_card:
    lineage:
      - data_platform_metrics.trino_query_log_events_metrics_clean_batch.query
    description: Metabase card identifier parsed from the query text when the query originates from Metabase.
  user:
    lineage:
      - data_platform_metrics.trino_query_log_events_metrics_clean_batch.resourceGroupId
    description: Username of the person or service account that executed the query in Trino.
  state:
    lineage:
      - data_platform_metrics.trino_query_log_events_metrics_clean_batch.state
    description: Final execution state of the Trino query (for example FINISHED, FAILED, or RUNNING).
  execution_time:
    lineage:
      - data_platform_metrics.trino_query_log_events_metrics_clean_batch.execution_time
    description: Wall-clock duration of the query execution in seconds.
  database_name:
    lineage:
      - data_platform_metrics.trino_query_log_events_metrics_clean_batch.referencedTables
    description: Hive schema name of a table referenced by the query; a single query may produce multiple rows with different schemas.
  table_name:
    lineage:
      - data_platform_metrics.trino_query_log_events_metrics_clean_batch.referencedTables
    description: Unqualified table name referenced by the query; paired with database_name to identify the accessed relation.
  execution_hour:
    lineage:
      - data_platform_metrics.trino_query_log_events_metrics_clean_batch.hour
    description: Hour of the day (0–23) when the query execution started.
  dt_extraction:
    lineage:
      - data_platform_metrics.trino_query_log_events_metrics_clean_batch.year
      - data_platform_metrics.trino_query_log_events_metrics_clean_batch.month
      - data_platform_metrics.trino_query_log_events_metrics_clean_batch.day
    description: Calendar date when the query log event was extracted into the datalake.
  ts_execution_started:
    lineage:
      - data_platform_metrics.trino_query_log_events_metrics_clean_batch.execution_start_time
    description: Timestamp when Trino began executing the query.
  ts_execution_ended:
    lineage:
      - data_platform_metrics.trino_query_log_events_metrics_clean_batch.execution_end_time
    description: Timestamp when Trino finished or terminated the query execution.
  year:
    lineage:
      - data_platform_metrics.trino_query_log_events_metrics_clean_batch.year
    description: Year of the extraction date, used for Hive partitioning — include in filters for partition pruning.
  month:
    lineage:
      - data_platform_metrics.trino_query_log_events_metrics_clean_batch.month
    description: Month of the extraction date, used for Hive partitioning — include in filters for partition pruning.
  day:
    lineage:
      - data_platform_metrics.trino_query_log_events_metrics_clean_batch.day
    description: Day of the extraction date, used for Hive partitioning — include in filters for partition pruning.
