---
database_name: datalake_trino
table_name: trino_detractor_queries
owner: herivelto.junior@quintoandar.com.br
domain: Data Ops & Governance
description: This table materialize query executions considered detractor according to the thresholds defined on the DAG.
columns:
  id_superset_dashboard:
    lineage:
      - data_platform_metrics.trino_query_log_events_metrics_clean_batch.session
    description: Superset Dashboard ID.
  superset_slice_id:
    lineage:
      - data_platform_metrics.trino_query_log_events_metrics_clean_batch.session
    description: Superset Slice ID.
  slice_name:
    lineage:
      - datalake_superset.slices.slice_name
    description: Slice name.
  last_owner:
    lineage:
      - datalake_superset.slices.last_owner
    description: Slice Last owner.
  line:
    lineage:
      - datalake_superset.slices.company_line
    description: Chart Line Owner.
  source:
    lineage:
      - data_platform_metrics.trino_query_log_events_metrics_clean_batch.session
    description: Query Data Viz Source.
  query_id:
    lineage:
      - data_platform_metrics.trino_query_log_events_metrics_clean_batch.queryId
    description: Trino query ID.
  internal_network_input_data_size_GB:
    lineage:
      - data_platform_metrics.trino_query_log_events_metrics_clean_batch.internal_network_input_data_size_bytes
    description: Network Input Data.
  cpu_time_sec:
    lineage:
      - data_platform_metrics.trino_query_log_events_metrics_clean_batch.total_cpu_time
    description: CPU time used to process this query.
  execution_time_sec:
    lineage:
      - data_platform_metrics.trino_query_log_events_metrics_clean_batch.execution_time
    description: Query total execution time.
  input_data_gb:
    lineage:
      - data_platform_metrics.trino_query_log_events_metrics_clean_batch.processed_input_data_bytes
    description: Input Data read from S3 for this query.
  peak_total_memory_gb:
    lineage:
      - data_platform_metrics.trino_query_log_events_metrics_clean_batch.peak_total_memory_reservation_bytes
    description: Peak cluster memory used to process this query.
  number_stages:
    lineage:
      - data_platform_metrics.trino_query_log_events_metrics_clean_batch.number_stages
    description: Query total stages.
  is_saturday:
    lineage:
      - data_platform_metrics.trino_query_log_events_metrics_clean_batch.created_time
    description: Flag marking if this execution was on saturday.
  ts_execution_start:
    lineage:
      - data_platform_metrics.trino_query_log_events_metrics_clean_batch.execution_start_time
    description: Timestamp from when this query started its execution.
  ts_execution_end:
    lineage:
      - data_platform_metrics.trino_query_log_events_metrics_clean_batch.ts_execution_end
    description: Timestamp from when this query finished its execution.
  year:
    lineage:
      - data_platform_metrics.trino_query_log_events_metrics_clean_batch.year
    description: Year which the metrics were collected.
  month:
    lineage:
      - data_platform_metrics.trino_query_log_events_metrics_clean_batch.month
    description: Month which the metrics were collected.
  day:
    lineage:
      - data_platform_metrics.trino_query_log_events_metrics_clean_batch.day
    description: Day which the metrics were collected.
