database_name: datalake_trino
table_name: table_usage_information
owner: luisa.ladeira@quintoandar.com.br
domain: Data Ops & Governance
description: >
  Incremental enrich-layer daily aggregation of Trino table access counts, built by enrich_trino
  from datalake_trino.query_information. Grain is one row per schema, table, and extraction date.
  Partitioned by year, month, day — filter on extraction date. Supports data catalog popularity
  and usage governance metrics.
columns:
  database_name:
    lineage:
      - datalake_trino.query_information.database_name
    description: Hive schema name of the table that was accessed through Trino queries.
  table_name:
    lineage:
      - datalake_trino.query_information.table_name
    description: Unqualified table name that was accessed; paired with database_name to identify the relation.
  count_visualization:
    description: Count of distinct Trino queries that referenced this table on the extraction date.
  year:
    lineage:
      - datalake_trino.query_information.year
    description: Year of the extraction date, used for Hive partitioning — include in filters for partition pruning.
  month:
    lineage:
      - datalake_trino.query_information.month
    description: Month of the extraction date, used for Hive partitioning — include in filters for partition pruning.
  day:
    lineage:
      - datalake_trino.query_information.day
    description: Day of the extraction date, used for Hive partitioning — include in filters for partition pruning.
