---
database_name: datalake_anonymization
table_name: pii_scan_results
owner: vitor.carneiro@quintoandar.com.br
domain: Data Ops & Governance
description: Table with sample scan results.
columns:
  layer:
    lineage:
      - datalake_documentation_metrics_clean.columns_metastore.layer
    description: This column indicates the layer of this table
  database_name:
    lineage:
      - datalake_documentation_metrics_clean.columns_metastore.database_name
    description: This column indicates the schema name of the table
  table_name:
    lineage:
      - datalake_documentation_metrics_clean.columns_metastore.table_name
    description: This column indicates the name of the tables
  column_name:
    lineage:
      - datalake_documentation_metrics_clean.columns_metastore.column_name
    description: This column indicates the name of the column
  scan_status:
    lineage:
      - datalake_anonymization.columns_sample_data.sample
    description: >
      Scan completeness for the entity partition row. COMPLETE means Presidio
      analyzed the sampled values; SAMPLE_TOO_BIG means the JSON sample exceeded
      the size limit and was not fully scanned (DPLT-969).
  sample_value:
    description: Value analyzed by the analyzer.
  sample_values_entity_found:
    description: Indicate which entity the analyzer found for this sample value
  score:
    description: This column indicates the score for this entity.
  ts_ingest:
    description: Indicate the ingestion time, the timestamp this table was updated
  year:
    description: This column indicates the year this table was updated
  month:
    description: This column indicates the month in which the table was updated
  day:
    description: This column indicates the day the table was updated
