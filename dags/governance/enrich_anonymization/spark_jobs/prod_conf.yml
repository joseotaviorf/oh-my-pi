# Source: https://github.com/microsoft/presidio/blob/main/presidio-analyzer/presidio_analyzer/conf/example_recognizers.yaml
# Documentation: https://microsoft.github.io/presidio/analyzer/adding_recognizers/

# DPLT-978 / DPLT-1362: bilingual NER is staged in forno_conf.yml first. Prod intentionally
# omits the `nlp` block, so the loader falls back to the English-only default
# (en_core_web_lg, single pass) and prod behaviour is unchanged. Promote the forno `nlp`
# block here only after the DPLT-1046 precision/recall delta report justifies the switch.
recognizers:
  # DPLT-968: weak patterns below SCORE_THRESHOLD (0.6); final BRAZIL_CPF via check-digit filter.
  - name: "Brazil CPF Recognizer"
    supported_language: "en"
    patterns:
      - name: "Brazil CPF Regex (weak)"
        regex: "\\b\\d{3}\\.?\\d{3}\\.?\\d{3}-?\\d{2}\\b"
        score: 0.55
      - name: "Brazil CPF column name Regex (weak)"
        regex: ".*cpf.*"
        score: 0.55
    context:
      - cpf
    supported_entity: "BRAZIL_CPF"
  # DPLT-967: weak patterns stay below SCORE_THRESHOLD (0.6); final BRAZIL_RG via brazil_rg_heuristics.
  - name: "Brazil RG Recognizer"
    supported_language: "en"
    patterns:
      - name: "Brazil RG regex (legacy candidate)"
        regex: "(^\\d{1,2}).?(\\d{3}).?(\\d{3})-?(\\d{1}|X|x$)"
        score: 0.55
      - name: "Brazil RG column name Regex (legacy candidate)"
        regex: "(?:^|_)(rg|identidade|numero_rg|rg_numero)(?:_|$)"
        score: 0.55
    supported_entity: "BRAZIL_RG"
  # DPLT-968: weak patterns below SCORE_THRESHOLD (0.6); final BRAZIL_CNPJ via check-digit filter.
  - name: "Brazil CNPJ Recognizer"
    supported_language: "en"
    patterns:
      - name: "Brazil CNPJ regex (weak)"
        regex: "(^\\d{2}\\.\\d{3}\\.\\d{3}\\/\\d{4}\\-\\d{2}$)"
        score: 0.55
      - name: "Brazil CNPJ column name Regex (weak)"
        regex: "cnpj|CNPJ|cnpj_.*"
        score: 0.55
    supported_entity: "BRAZIL_CNPJ"
  - name: "Brazil Location Recognizer"
    supported_language: "en"
    patterns:
      - name: "Brazil CEP Regex (weak)"
        regex: "\\b\\d{5}-?\\d{3}\\b"
        score: 0.85
      - name: "Brazil CEP column name Regex (weak)"
        regex: ".*cep.*"
        score: 0.85
      - name: "Address column name regex (weak)"
        regex: "\\b(address|addr|street|st|road|rd|avenue|ave|boulevard|blvd|lane|way|drive|place|city|state|endereço|endereco|rua|rua_|avenida|av|logradouro|bairro|cidade|estado|neighborhood|complement|complemento|Apto|apto|apto_|bloco|casa|torre|Torre)\\b"
        score: 0.55
      - name: "Zip Code column name regex (weak)"
        regex: "\\b(zip(_)?code|zip|postal(_)?code|postcode|cep|código(_)?postal|cod(_)?postal)\\b"
        score: 0.85
    context:
      - CEP
      - cep
      - Rua
      - Avenida
      - Av
      - Av.
    supported_entity: "LOCATION"
  - name: "Brazil Phone Number Recognizer"
    supported_language: "en"
    patterns:
      - name: "Phone Number column name regex (weak)"
        regex: "(?:^|_)(?:phone|telefone|celular|whatsapp|mobile|fone|phone_number|mobile_number|cell_phone|numero_telefone)(?:_|$)|(?:^|_)phone(?:_|$)"
        score: 0.55
    context:
      - Phone Number
      - Telefone
      - Celular
      - Whatsapp
    supported_entity: "PHONE_NUMBER"
  - name: "Brazil Email Recognizer"
    supported_language: "en"
    patterns:
      - name: "Email column name regex (weak)"
        regex: "(?:^|_)(?:mail|email|e_mail|correio)(?:_|$)|(?:^|_)email(?:_|$)|_email$"
        score: 0.85
      - name: "Email value regex (weak)"
        regex: "\\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}\\b"
        score: 0.85
    context:
      - Email
      - E-mail
      - email
    supported_entity: "EMAIL_ADDRESS"
  - name: "Brazil Name Recognizer"
    supported_language: "en"
    patterns:
      # DPLT-970/971: column-name signal only; avoid bare ``name`` matching pod_name/ticket_number.
      - name: "Person name column (standalone, weak)"
        regex: "^(?:name|nome|full_name|first_name|last_name|nome_completo|sobrenome)$"
        score: 0.55
      - name: "Person name column (role prefix, weak)"
        regex: "(?:^|_)(?:user|usuario|agent|customer|client|cliente|tenant|person|pessoa|author|holder|contact|contato)_(?:name|nome)$"
        score: 0.55
      - name: "Person name column (nome_ prefix, weak)"
        regex: "(?:^|_)nome_[a-z0-9_]+$"
        score: 0.55
    context:
      - Nome
      - Name
    supported_entity: "PERSON"

  - name: "Brazil Birth Date Recognizer"
    supported_language: "en"
    patterns:
      - name: "Birth Date column name regex (weak)"
        regex: "\\b(dob|date(_of)?_birth|birth(_)?date|data(_de)?_nascimento|nascimento|dn|birthdate)\\b"
        score: 0.85
    context:
      - Nascimento
      - Aniversario
      - Birth Date
    supported_entity: "BIRTH_DATE"
skip_list:
  - datalake_amplitude_clean.events
  - datalake_amplitude_events_clean.events
  - datalake_amplitude_backup_clean.events
  - sandbox.base_final
  - sandbox.base_funil
  - sandbox.base_funnel_payment
  - sandbox.base_rent
  - sandbox.base_sale
  - sandbox.ciq_embaixadores_funnel_payment
  - sandbox.consultant_rent
  - sandbox.consultant_sale
  - sandbox.contract_rent
  - sandbox.daily_sale
  - sandbox.dates
  - sandbox.dim_listing_rent
  - sandbox.dim_listing_sale
  - sandbox.grouped_rent
  - sandbox.grouped_sale
  - sandbox.house_parsed
  - sandbox.integrity_engine_embaixadores
  - sandbox.rent_status
  - sandbox.sale_status
  - sandbox.supply
  - sandbox.vw_planning_performance_fact_daily_target_normalized
