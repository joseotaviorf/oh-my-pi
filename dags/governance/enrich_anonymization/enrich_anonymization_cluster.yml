cluster:
  type: emr_7_12_consolidation_xs_memory_fleet_cluster
  custom_configurations:
    spark_conf:
      spark.sql.execution.arrow.pyspark.enabled: true
      spark.databricks.delta.constraints.allowUnenforcedNotNull.enabled: true
    core_nodes:
      target_on_demand: 2
      target_spot: 0
      instance_types:
      - r6g.xlarge
      - r7g.xlarge
      - r6i.xlarge
    task_nodes:
      instance_types:
      - r6g.xlarge
      - r7g.xlarge
      - r6i.xlarge
      target_on_demand: 0
      target_spot: 1
      allocation_strategy: price-capacity-optimized
      bid_price_percentage: 100
    init_scripts:
    - s3:
        destination: '{{ var.value.artifacts_bucket }}/bi-etl-ejuice/init_script_anonymization.sh'
      args:
      - '{{ var.value.artifacts_bucket }}'
      - '{{ var.value.databricks_s3_bucket }}'
      - '{{ dag.dag_id }}'
  custom_libraries:
  - pypi:
      package: presidio_analyzer==2.2.357
  - pypi:
      package: numpy==1.26.4
  - whl: '{artifacts_bucket}/spacy-models/en_core_web_lg-3.7.1-py3-none-any.whl'
