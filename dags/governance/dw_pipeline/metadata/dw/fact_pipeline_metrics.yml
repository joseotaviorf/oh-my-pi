database_name: dw_pipeline
table_name: fact_pipeline_metrics
owner: isadora.gallerani@quintoandar.com.br
domain: Cross
description: >
  Incremental DW fact table of daily pipeline SLA and execution metrics aggregated by DAG owner
  line, loaded by dw_pipeline from datalake_pipeline.dag_sla_information. Grain is one row per
  line and snapshot date. Partitioned by year, month, day — filter on snapshot date. Supports
  line-level SLA dashboards and operational reporting.
columns:
  sk_line:
    lineage:
      - datalake_pipeline.dag_sla_information.id_line
    description: Surrogate key of the DAG owner line; joins to dw_pipeline.dim_line.
  sk_snapshot_date:
    lineage:
      - datalake_pipeline.dag_sla_information.dt_snapshot
    description: Date key in yyyyMMdd format for the snapshot date; joins to dw_public.dim_date.
  sla:
    lineage:
      - datalake_pipeline.dag_sla_information.is_inside_sla
      - datalake_pipeline.dag_sla_information.is_active_and_unpaused
      - datalake_pipeline.dag_sla_information.is_in_ignoring_list
      - datalake_pipeline.dag_sla_information.is_special_scheduler_executed
      - datalake_pipeline.dag_sla_information.is_intraday_dag
    description: Line SLA percentage calculated as DAGs inside SLA divided by eligible active unpaused DAGs plus special-scheduler DAGs that executed, excluding ignored DAGs.
  total_active_dags:
    lineage:
      - datalake_pipeline.dag_sla_information.id_dag
      - datalake_pipeline.dag_sla_information.is_active
    description: Count of distinct active DAGs owned by the line on the snapshot date.
  total_active_unpaused_dags:
    lineage:
      - datalake_pipeline.dag_sla_information.id_dag
      - datalake_pipeline.dag_sla_information.is_active_and_unpaused
    description: Count of distinct active and unpaused DAGs expected to run on the snapshot date.
  total_dags_executed:
    lineage:
      - datalake_pipeline.dag_sla_information.id_dag
      - datalake_pipeline.dag_sla_information.is_executed
    description: Count of distinct DAGs that had at least one execution on the snapshot date.
  total_dags_special_scheduler:
    lineage:
      - datalake_pipeline.dag_sla_information.id_dag
      - datalake_pipeline.dag_sla_information.is_special_scheduler
    description: Count of distinct DAGs listed in the special scheduler Google Sheet on the snapshot date.
  total_dags_special_scheduler_executed:
    lineage:
      - datalake_pipeline.dag_sla_information.id_dag
      - datalake_pipeline.dag_sla_information.is_special_scheduler_executed
    description: Count of distinct special-scheduler DAGs that actually executed on the snapshot date.
  total_intraday_dags:
    lineage:
      - datalake_pipeline.dag_sla_information.id_dag
      - datalake_pipeline.dag_sla_information.is_intraday_dag
    description: Count of distinct active DAGs with intraday schedules (hourly or more frequent) on the snapshot date.
  total_dags_in_sla_exclusion_list:
    lineage:
      - datalake_pipeline.dag_sla_information.id_dag
      - datalake_pipeline.dag_sla_information.is_in_sla_exclusion_list
    description: Count of distinct active DAGs in the SLA exclusion Google Sheet on the snapshot date.
  total_dags_ignoring_list:
    lineage:
      - datalake_pipeline.dag_sla_information.id_dag
      - datalake_pipeline.dag_sla_information.is_in_ignoring_list
    description: Count of distinct active DAGs excluded from SLA calculation (exclusion list, special scheduler without run, or null SLA).
  total_dags_inside_sla:
    lineage:
      - datalake_pipeline.dag_sla_information.id_dag
      - datalake_pipeline.dag_sla_information.is_inside_sla
    description: Count of distinct active DAGs marked as inside SLA on the snapshot date.
  total_dags_outside_sla:
    lineage:
      - datalake_pipeline.dag_sla_information.id_dag
      - datalake_pipeline.dag_sla_information.is_outside_sla
    description: Count of distinct active DAGs marked as outside SLA on the snapshot date.
  total_dags_null_sla:
    lineage:
      - datalake_pipeline.dag_sla_information.id_dag
      - datalake_pipeline.dag_sla_information.is_null_sla
    description: Count of distinct active DAGs with null SLA status on the snapshot date.
  total_success_dags:
    lineage:
      - datalake_pipeline.dag_sla_information.id_dag
      - datalake_pipeline.dag_sla_information.is_run_successful
    description: Count of distinct DAGs with a successful run on the snapshot date.
  total_failed_dags:
    lineage:
      - datalake_pipeline.dag_sla_information.id_dag
      - datalake_pipeline.dag_sla_information.is_run_failed
    description: Count of distinct DAGs with a failed run on the snapshot date.
  total_dags_with_manual_run:
    lineage:
      - datalake_pipeline.dag_sla_information.id_dag
      - datalake_pipeline.dag_sla_information.is_manual_run
    description: Count of distinct DAGs that had a manually triggered run on the snapshot date.
  total_dags_triggered_by_mediator:
    lineage:
      - datalake_pipeline.dag_sla_information.id_dag
      - datalake_pipeline.dag_sla_information.is_run_triggered_by_mediator
    description: Count of distinct DAGs whose run was triggered by the Mediator on the snapshot date.
  total_raw_clean_dags:
    lineage:
      - datalake_pipeline.dag_sla_information.id_dag
      - datalake_pipeline.dag.layer
    description: Count of distinct active DAGs in the raw/clean layer on the snapshot date.
  total_raw_clean_dags_excuted:
    lineage:
      - datalake_pipeline.dag_sla_information.id_dag
      - datalake_pipeline.dag_sla_information.is_executed
      - datalake_pipeline.dag.layer
    description: Count of distinct raw/clean layer DAGs that executed on the snapshot date.
  total_enrich_dags:
    lineage:
      - datalake_pipeline.dag_sla_information.id_dag
      - datalake_pipeline.dag.layer
    description: Count of distinct active DAGs in the enrich layer on the snapshot date.
  total_enrich_dags_executed:
    lineage:
      - datalake_pipeline.dag_sla_information.id_dag
      - datalake_pipeline.dag_sla_information.is_executed
      - datalake_pipeline.dag.layer
    description: Count of distinct enrich layer DAGs that executed on the snapshot date.
  total_dw_dags:
    lineage:
      - datalake_pipeline.dag_sla_information.id_dag
      - datalake_pipeline.dag.layer
    description: Count of distinct active DAGs in the dw layer on the snapshot date.
  total_dw_dags_executed:
    lineage:
      - datalake_pipeline.dag_sla_information.id_dag
      - datalake_pipeline.dag_sla_information.is_executed
      - datalake_pipeline.dag.layer
    description: Count of distinct dw layer DAGs that executed on the snapshot date.
  total_metric_dags:
    lineage:
      - datalake_pipeline.dag_sla_information.id_dag
      - datalake_pipeline.dag.layer
    description: Count of distinct active DAGs in the metric layer on the snapshot date.
  total_metric_dags_executed:
    lineage:
      - datalake_pipeline.dag_sla_information.id_dag
      - datalake_pipeline.dag_sla_information.is_executed
      - datalake_pipeline.dag.layer
    description: Count of distinct metric layer DAGs that executed on the snapshot date.
  total_reverse_dags:
    lineage:
      - datalake_pipeline.dag_sla_information.id_dag
      - datalake_pipeline.dag.layer
    description: Count of distinct active DAGs in the reverse layer on the snapshot date.
  total_reverse_dags_executed:
    lineage:
      - datalake_pipeline.dag_sla_information.id_dag
      - datalake_pipeline.dag_sla_information.is_executed
      - datalake_pipeline.dag.layer
    description: Count of distinct reverse layer DAGs that executed on the snapshot date.
  total_datamart_dags:
    lineage:
      - datalake_pipeline.dag_sla_information.id_dag
      - datalake_pipeline.dag.is_datamart
    description: Count of distinct active DAGs loading datamarts on the snapshot date.
  total_datamart_dags_executed:
    lineage:
      - datalake_pipeline.dag_sla_information.id_dag
      - datalake_pipeline.dag_sla_information.is_executed
      - datalake_pipeline.dag.is_datamart
    description: Count of distinct datamart-loading DAGs that executed on the snapshot date.
  dt_snapshot:
    lineage:
      - datalake_pipeline.dag_sla_information.dt_snapshot
    description: Calendar date of the daily pipeline metrics snapshot, aligned to the dag_sla_information dt_snapshot.
  ts_load:
    description: Timestamp when this fact row was loaded into the DW by the dw_pipeline DAG.
  year:
    lineage:
      - datalake_pipeline.dag_sla_information.dt_snapshot
    description: Year component of dt_snapshot, used for Hive partitioning — include in filters for partition pruning.
  month:
    lineage:
      - datalake_pipeline.dag_sla_information.dt_snapshot
    description: Month component of dt_snapshot, used for Hive partitioning — include in filters for partition pruning.
  day:
    lineage:
      - datalake_pipeline.dag_sla_information.dt_snapshot
    description: Day component of dt_snapshot, used for Hive partitioning — include in filters for partition pruning.
