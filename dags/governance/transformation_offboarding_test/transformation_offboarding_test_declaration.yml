---
dag:
  name: transformation_offboarding_test
  schedule_interval: null
  schedule_start_date: 2026, 9, 11
  owner: Data Governance
  catchup: false
  documentation:
    dag_purpose: |
      Throwaway pilot copy of the mediations table from
      dags/for_rent/enrich_offboarding, used to exercise the new `transformation`
      layer (grade curated) without touching production.

      Writes transformation_offboarding_test_curated.mediations under
      s3a://{bucket}/transformation/offboarding_test/curated/, colliding with
      datalake_offboarding on neither database name nor S3 prefix.

      Unlike the other two transformation copies, this query is not byte-identical
      to production: it reads transformation_terminator_test_curated.termination
      instead of datalake_terminator.termination. That is deliberate — it puts a
      transformation-classified schema on the source side of a transformation DAG,
      so source-layer policy evaluates the transformation-reads-transformation
      edge. Hop-1 vs production must run after the terminator copy; there is no
      cross-DAG sensor (pilot DAGs are excluded from dependencies.yaml).

      Manual trigger only. Delete this DAG together with the pilot exclusion
      constant in bietlejuice.governance.layer_taxonomy_pilot once the taxonomy
      pilot is verified.
workflow:
  type: query_delta
  layer: transformation
  transformation_grade: curated
  custom_schema: offboarding_test
  has_hive_sync: true
  tables_customization:
    mediations:
      merge_on: ["id_termination"]
      z_order_by: ["ts_termination_updated", "id_termination"]
