dag:
  name: metabase
  schedule_start_date: 2020, 6, 1
  schedule_interval: 0 5,8,12 * * *
  owner: Data Governance
  documentation:
    dag_purpose: |
      This DAG imports the tables from Metabase, our data visualization tool. We extract metadata from Metabase in order       to analyze user behavior and have a better control of what is being created there.
workflow:
  type: cdc
  layer: raw
  database_type: postgres
  dbutils_secret_key: METABASE_DB
  lineage_product_database_name: metabase
  tables_customization:
    core_user:
      clean_table_name: core_user
    metabase_database:
      clean_table_name: metabase_database
    metabase_field:
      clean_table_name: metabase_field
    metabase_table:
      clean_table_name: metabase_table
    pulse:
      clean_table_name: pulse
    pulse_channel:
      clean_table_name: pulse_channel
    report_dashboard:
      clean_table_name: report_dashboard
    report_dashboardcard:
      clean_table_name: report_dashboard_card
    permissions:
      clean_table_name: permissions
      clean_primary_keys: ["id"]
    permissions_group:
      clean_table_name: permissions_group
      clean_primary_keys: ["id"]
    permissions_group_membership:
      clean_table_name: permissions_group_membership
      clean_primary_keys: ["id"]
    collection:
      clean_table_name: collection
    pulse_card:
      clean_table_name: pulse_card
    pulse_channel_recipient:
      clean_table_name: pulse_channel_recipient
    query:
      clean_table_name: query
    query_execution:
      clean_table_name: query_execution
    revision:
      clean_table_name: revision
    view_log:
      clean_table_name: view_log
