database_name: datalake_metabase_clean
table_name: report_dashboard
owner: vitor.carneiro@quintoandar.com.br
domain: Data Ops & Governance
description: >
  Clean-layer snapshot of Metabase dashboards replicated from the Metabase PostgreSQL
  report_dashboard table via CDC (metabase DAG, ingest at 05:00, 08:00, and 12:00 UTC). Grain is
  one row per dashboard per load date. Partitioned by year, month, day — filter on ingestion date.
  Supports governance analytics on dashboard ownership, embedding, and archival status.
columns:
  id:
    lineage:
      - datalake_metabase_raw.report_dashboard.id
    description: Primary key from Metabase report_dashboard identifying a distinct analytics dashboard artifact.
  id_user_creator:
    lineage:
      - datalake_metabase_raw.report_dashboard.creator_id
    description: Foreign key to core_user.id for the account that originally created the dashboard in Metabase.
  id_collection:
    lineage:
      - datalake_metabase_raw.report_dashboard.collection_id
    description: Foreign key to collection.id for the folder where the dashboard is stored in the content hierarchy.
  name:
    lineage:
      - datalake_metabase_raw.report_dashboard.name
    description: User-defined title of the dashboard displayed in Metabase navigation and sharing dialogs.
  description:
    lineage:
      - datalake_metabase_raw.report_dashboard.description
    description: Free-text summary authored in Metabase explaining the dashboard purpose and intended audience.
  position:
    lineage:
      - datalake_metabase_raw.report_dashboard.position
    description: Legacy sort index for the dashboard within Metabase listing views (largely superseded by collection_position).
  collection_position:
    lineage:
      - datalake_metabase_raw.report_dashboard.collection_position
    description: Sort order of the dashboard within its parent collection folder in the Metabase UI.
  parameters:
    lineage:
      - datalake_metabase_raw.report_dashboard.parameters
    description: JSON array of dashboard-level filter parameters wired to underlying question cards.
  embedding_params:
    lineage:
      - datalake_metabase_raw.report_dashboard.embedding_params
    description: JSON map of signed embedding parameters required when the dashboard is embedded in external apps.
  is_archived:
    lineage:
      - datalake_metabase_raw.report_dashboard.archived
    description: Boolean flag indicating the dashboard was archived and hidden from default Metabase browsing.
  has_show_in_getting_started:
    lineage:
      - datalake_metabase_raw.report_dashboard.show_in_getting_started
    description: When true, the dashboard is featured in Metabase Getting Started onboarding for new users.
  is_enabled_for_embedding:
    lineage:
      - datalake_metabase_raw.report_dashboard.enable_embedding
    description: When true, the dashboard can be embedded in external applications via Metabase signed embedding.
  ts_created:
    lineage:
      - datalake_metabase_raw.report_dashboard.created_at
    description: Timestamp when the dashboard was first saved in Metabase (UTC).
  ts_updated:
    lineage:
      - datalake_metabase_raw.report_dashboard.updated_at
    description: Timestamp when dashboard layout, filters, or metadata were last modified in Metabase (UTC).
  year:
    lineage:
      - datalake_metabase_raw.report_dashboard.year
    description: Year of the data load date, used for Hive partitioning — include in filters for partition pruning.
  month:
    lineage:
      - datalake_metabase_raw.report_dashboard.month
    description: Month of the data load date, used for Hive partitioning — include in filters for partition pruning.
  day:
    lineage:
      - datalake_metabase_raw.report_dashboard.day
    description: Day of the data load date, used for Hive partitioning — include in filters for partition pruning.
