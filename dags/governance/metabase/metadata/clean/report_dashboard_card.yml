database_name: datalake_metabase_clean
table_name: report_dashboard_card
owner: vitor.carneiro@quintoandar.com.br
domain: Data Ops & Governance
description: >
  Clean-layer snapshot of question cards placed on Metabase dashboards, replicated from the
  Metabase PostgreSQL report_dashboardcard table via CDC (metabase DAG, ingest at 05:00, 08:00,
  and 12:00 UTC). Grain is one row per card placement on a dashboard per load date. Partitioned
  by year, month, day — filter on ingestion date. Supports governance analytics on dashboard
  composition and visualization layout.
columns:
  id:
    lineage:
      - datalake_metabase_raw.report_dashboardcard.id
    description: Primary key from Metabase report_dashboardcard identifying a distinct card placement on a dashboard grid.
  id_card:
    lineage:
      - datalake_metabase_raw.report_dashboardcard.card_id
    description: Foreign key to report_card.id for the saved question rendered in this dashboard tile.
  id_dashboard:
    lineage:
      - datalake_metabase_raw.report_dashboardcard.dashboard_id
    description: Foreign key to report_dashboard.id for the dashboard that contains this card placement.
  id_entity:
    lineage:
      - datalake_metabase_raw.report_dashboardcard.entity_id
    description: Stable UUID Metabase assigns to the dashboard tile for cross-version references and embedding.
  size_x:
    lineage:
      - datalake_metabase_raw.report_dashboardcard.sizex
    description: Width of the dashboard tile measured in Metabase grid columns on the layout canvas.
  size_y:
    lineage:
      - datalake_metabase_raw.report_dashboardcard.sizey
    description: Height of the dashboard tile measured in Metabase grid rows on the layout canvas.
  row:
    lineage:
      - datalake_metabase_raw.report_dashboardcard.row
    description: Zero-based row coordinate of the tile top-left corner on the Metabase dashboard grid.
  column:
    lineage:
      - datalake_metabase_raw.report_dashboardcard.col
    description: Zero-based column coordinate of the tile top-left corner on the Metabase dashboard grid.
  parameter_mappings:
    lineage:
      - datalake_metabase_raw.report_dashboardcard.parameter_mappings
    description: JSON wiring map connecting dashboard filter parameters to fields on the underlying question card.
  visualization_settings:
    lineage:
      - datalake_metabase_raw.report_dashboardcard.visualization_settings
    description: JSON blob of chart formatting overrides such as colors, axes, and labels applied on the dashboard tile.
  ts_created:
    lineage:
      - datalake_metabase_raw.report_dashboardcard.created_at
    description: Timestamp when the card was first added to the dashboard layout in Metabase (UTC).
  ts_updated:
    lineage:
      - datalake_metabase_raw.report_dashboardcard.updated_at
    description: Timestamp when tile size, position, or visualization settings were last changed in Metabase (UTC).
  year:
    lineage:
      - datalake_metabase_raw.report_dashboardcard.year
    description: Year of the data load date, used for Hive partitioning — include in filters for partition pruning.
  month:
    lineage:
      - datalake_metabase_raw.report_dashboardcard.month
    description: Month of the data load date, used for Hive partitioning — include in filters for partition pruning.
  day:
    lineage:
      - datalake_metabase_raw.report_dashboardcard.day
    description: Day of the data load date, used for Hive partitioning — include in filters for partition pruning.
