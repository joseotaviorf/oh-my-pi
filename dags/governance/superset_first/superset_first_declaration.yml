dag:
  name: superset_first
  schedule_start_date: 2024, 3, 1
  schedule_interval: 0 0 * * *
  owner: Data Governance
workflow:
  type: database_pull
  layer: raw
  custom_schema: superset
  database_type: postgres
  default_extraction_type: incremental
  default_partitions: ["year", "month", "day"]
  dbutils_secret_key: SUPERSET_DB
  tables_customization:
    ab_role:
      extraction_type: full
      partitions: []
    ab_user:
      date_filter_column: changed_on
    ab_user_role:
      extraction_type: full
      partitions: []
    logs:
      date_filter_column: dttm
    sql_metrics:
      date_filter_column: changed_on
    sqltable_user:
      extraction_type: full
      partitions: []
    table_columns:
      date_filter_column: changed_on
    table_schema:
      date_filter_column: changed_on
    tables:
      date_filter_column: changed_on
cluster:
  type: databricks_10_4_min_general_cluster
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE

