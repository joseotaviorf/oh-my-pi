---
database_name: datalake_fairness_assessment
table_name: fairness_assessment
owner: vitor.carneiro@quintoandar.com.br
domain: Data Ops & Governance
description: >
  Per-table FAIRness MVP assessment scoped to productive bi-etl-ejuice tables in
  ``datalake_dag_inventory_clean.table`` (dag like ``bietlejuice%``, layers raw/clean/enrich/dw/core/metric),
  joined to ``documentation_metrics`` (``tables_documentation``, ``columns_documentation``),
  ``columns_metastore`` snapshot, ``org_chart``, and DataHub GraphQL; grain one row per
  (database_name, table_name, year, month, day). See column descriptions below.
columns:
  database_name:
    lineage:
      - datalake_dag_inventory_clean.table.table
      - datalake_documentation_metrics_clean.tables_documentation.database_name
    description: Spark metastore schema name of the assessed table (from dag inventory FQN).
  table_name:
    lineage:
      - datalake_dag_inventory_clean.table.table
      - datalake_documentation_metrics_clean.tables_documentation.table_name
    description: Table name in the metastore schema (from dag inventory FQN).
  checks_result_json:
    description: |
      JSON map of requirement_id to {"passed": bool, "reason": string|null, optional "detail"}. **MVP gate**
      (``MVP_TIER2_SCOPED_REQUIREMENT_IDS``): F1-01, F1-02, F1-03,
      F2-01, F4-01, A1.2-03, I1-02, **F2-02**, **I1-01**. **F1-02** — detects multiple (dag, task) rows in
      ``datalake_dag_inventory_clean.table`` producing the same FQN on the inventory partition for
      ``load_start_date``; fails with ``duplicate_fqn_in_assessment_universe`` when ``fqn_occurrence_count > 1``.
      **F2-01** — owner email present and valid format,
      active employee (at most one ownership failure: ``owner_missing``, ``owner_email_invalid_format``,
      ``owner_not_active_employee``), non-empty ``domain`` from ``tables_documentation`` matching the same
      CI Yamale allowlist as metadata ``domain`` (``METADATA_DOMAIN_CI_ALLOWLIST_PATTERN`` in
      ``bietlejuice.governance.fairness_assessment.constants``; empty domain → ``domain_missing`` only;
      non-empty but not in allowlist → ``domain_not_in_allowlist``), and non-empty table description
      (``table_description_missing``). On failure, ``reason`` is a stable comma-join of failure codes in
      that order and ``detail`` may include ``failure_codes`` (same list).       **F2-02** — column description richness (``assess_column_description_quality``) on
      ``columns_documentation`` rows excluding partition fields ``year``, ``month``, ``day``; failure reasons
      ``no_column_docs_in_lake``, ``column_description_not_substantive``; optional detail
      ``insufficient_column_names`` and ``insufficient_columns`` (per-column ``reason_code``).
      **I1-01** — bidirectional name alignment vs the latest ``columns_metastore`` snapshot; reasons
      ``undocumented_columns`` (physical name missing from documentation), ``documented_not_in_physical``
      (documented name absent from physical snapshot), or comma-joined when both; optional detail arrays
      ``undocumented_columns`` and ``documented_not_in_physical``; reason
      ``spark_schema_not_in_columns_metastore_snapshot`` when the FQN is absent from that snapshot.
      **I3-01** / **I3-02** (DataHub) are emitted
      for observability when GraphQL is configured; they do not affect the MVP tier score. F1-03 uses the same
      ``columns_metastore`` snapshot (presence of FQN); F4-01 uses DataHub ``dataset.exists``. I1-02 and A1.2-03 use the assigned
      datacontract URN signal on the Databricks entity. See the historical spike doc for F4-01 and A1-03
      context.
  tier_achieved:
    description: |
      MVP mode: 2 if all checks in ``MVP_TIER2_SCOPED_REQUIREMENT_IDS`` pass, 1 if all Tier-1 active
      checks (``TIER1_ACTIVE_REQUIREMENT_IDS``) pass but F2-02 or I1-01 fail, 0 if any Tier-1 check fails.
      Values 3 and 4 are reserved for a future full cumulative tiering mode when the engine emits them.
  fqn_occurrence_count:
    description: |
      Number of rows in ``datalake_dag_inventory_clean.table`` (dag, task pairs) that produce this FQN on
      the inventory partition for ``load_start_date``. Expected ``1`` (single producing pipeline); ``>1``
      indicates conflicting ingestion tasks.
    lineage:
      - datalake_dag_inventory_clean.table.dag
      - datalake_dag_inventory_clean.table.task
  is_active_employee:
    description: |
      True when normalized owner email matches org_chart.work_email for a row with assignment_status_type = 'ACTIVE'.
    lineage:
      - datalake_people_public.org_chart.work_email
      - datalake_people_public.org_chart.assignment_status_type
  has_data_contract:
    description: |
      When DataHub GraphQL is configured: True if the Databricks dataset's ``institutionalMemory`` labels
      contain an assigned data contract URN (``urn:prod:datacontract:``).
      False when DataHub is not configured, ``dataset.exists`` is false, or only the placeholder
      "[Data Contract] No data contract assigned" appears (no datacontract URN).
  table_description_is_substantive:
    description: |
      True when ``assess_table_description_quality`` finds enough non-boilerplate vocabulary beyond
      schema/table name tokens. False for empty, short, or generic PT/EN echo text. Heuristic only; does
      not replace F2-01. No separate TDQ JSON column is stored on this table.
  columns_description_is_substantive:
    description: |
      True if and only if the column-documentation snapshot (latest ``doc_dt`` join for this FQN) has at
      least one documented column in the lake and **every** such column passes
      ``assess_column_description_quality`` with ``is_substantive`` (independent of how F2-02 combines with
      physical schema). If there are zero column docs in that snapshot, false.
  tiering_rules_version:
    description: Version tag for FAIRness tier ID sets (``TIERING_RULES_VERSION`` in ``bietlejuice.governance.fairness_assessment.constants``; referenced from the Spark job).
  ts_assessed:
    description: UTC timestamp when the assessment row was produced in the Spark job.
  year:
    lineage:
      - datalake_dag_inventory_clean.table.year
    description: Partition — FAIR assessment run day (year), aligned to ``load_start_date``.
  month:
    lineage:
      - datalake_dag_inventory_clean.table.month
    description: Partition — FAIR assessment run day (month), aligned to ``load_start_date``.
  day:
    lineage:
      - datalake_dag_inventory_clean.table.day
    description: Partition — FAIR assessment run day (day of month), aligned to ``load_start_date``.
