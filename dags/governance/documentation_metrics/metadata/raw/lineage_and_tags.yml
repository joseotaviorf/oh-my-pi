---
database_name: datalake_documentation_metrics_raw
table_name: lineage_and_tags
owner: vitor.carneiro@quintoandar.com.br
domain: Data Ops & Governance
description: Raw ingest of lineage and tag coverage from metadata/all_lineage_tags_data.yml in the data-documentation S3 bucket, loaded daily by documentation_metrics after CI publishes metadata on merge.
columns:
  database_name:
    description: Hive schema name of the table whose lineage and tag coverage was exported.
  table_name:
    description: Table name within database_name for the lineage and tag coverage row.
  has_lineage:
    description: Boolean flag indicating whether governance metadata declares upstream lineage for this table.
  has_tags:
    description: Boolean flag indicating whether governance metadata declares classification tags on this table.
  year:
    description: Year of the data load date, used for Hive partitioning.
  month:
    description: Month of the data load date, used for Hive partitioning.
  day:
    description: Day of the data load date, used for Hive partitioning.
