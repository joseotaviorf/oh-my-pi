database_name: datalake_documentation_metrics_clean
table_name: dag_metadata
owner: vitor.carneiro@quintoandar.com.br
domain: Data Ops & Governance
description: >
  Daily snapshot of bietlejuice Airflow DAG metadata parsed from repo declarations at
  documentation_metrics job runtime (not from the documentation bucket). Ingested incrementally
  each day (05:00 UTC). Grain is one row per layer, dag_name, and database_name per load date.
  Partitioned by year, month, day — filter on ingestion date for partition pruning.
columns:
  layer:
    lineage:
      - datalake_documentation_metrics_raw.dag_metadata.layer
    description: Data lake layer (raw, clean, core, enrich, dw, metric) associated with the DAG and table.
  dag_name:
    lineage:
      - datalake_documentation_metrics_raw.dag_metadata.dag_name
    description: Airflow DAG name in bi-etl-ejuice that owns or produces tables in the registered database.
  database_name:
    lineage:
      - datalake_documentation_metrics_raw.dag_metadata.database_name
    description: Hive schema name of tables produced or maintained by the registered DAG at this layer.
  has_lineage_from_product:
    lineage:
      - datalake_documentation_metrics_raw.dag_metadata.has_lineage_from_product
    description: Deprecated flag indicating whether the DAG ingests lineage from product databases. No longer used in coverage metrics.
  owner:
    lineage:
      - datalake_documentation_metrics_raw.dag_metadata.owner
    description: Team or contact name associated with the DAG in Airflow, as registered for governance tracking.
  year:
    lineage:
      - datalake_documentation_metrics_raw.dag_metadata.year
    description: Year of the data load date, used for Hive partitioning — include in filters for partition pruning.
  month:
    lineage:
      - datalake_documentation_metrics_raw.dag_metadata.month
    description: Month of the data load date, used for Hive partitioning — include in filters for partition pruning.
  day:
    lineage:
      - datalake_documentation_metrics_raw.dag_metadata.day
    description: Day of the data load date, used for Hive partitioning — include in filters for partition pruning.
