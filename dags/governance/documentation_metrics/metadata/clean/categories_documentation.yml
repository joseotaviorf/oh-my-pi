database_name: datalake_documentation_metrics_clean
table_name: categories_documentation
owner: vitor.carneiro@quintoandar.com.br
domain: Data Ops & Governance
description: >
  Daily snapshot of category-tagged columns read from governance YAML in the data-documentation
  S3 bucket (documentation/ prefix). YAML is published on each bi-etl-ejuice metadata deploy
  (CI upload_metadata_files_into_s3) and ingested incrementally by documentation_metrics
  (daily 05:00 UTC). Grain is one row per layer, table, column, and category value per load
  date. Partitioned by year, month, day — filter on ingestion date. Supports documentation
  quality metrics for classified fields.
columns:
  layer:
    lineage:
      - datalake_documentation_metrics_raw.categories_documentation.layer
    description: Data lake layer of the table whose categorized column is being evaluated.
  database_name:
    lineage:
      - datalake_documentation_metrics_raw.categories_documentation.database_name
    description: Hive schema name of the table containing the categorized column.
  table_name:
    lineage:
      - datalake_documentation_metrics_raw.categories_documentation.table_name
    description: Table name within database_name for the categorized column row.
  column_name:
    lineage:
      - datalake_documentation_metrics_raw.categories_documentation.column_name
    description: Name of the column that carries a category classification tag in governance metadata.
  value:
    lineage:
      - datalake_documentation_metrics_raw.categories_documentation.value
    description: Category tag value assigned to the column in governance metadata (for example pii or confidential).
  has_description:
    lineage:
      - datalake_documentation_metrics_raw.categories_documentation.has_description
    description: Boolean flag indicating whether the categorized column has a non-empty description in governance metadata.
  year:
    lineage:
      - datalake_documentation_metrics_raw.categories_documentation.year
    description: Year of the data load date, used for Hive partitioning — include in filters for partition pruning.
  month:
    lineage:
      - datalake_documentation_metrics_raw.categories_documentation.month
    description: Month of the data load date, used for Hive partitioning — include in filters for partition pruning.
  day:
    lineage:
      - datalake_documentation_metrics_raw.categories_documentation.day
    description: Day of the data load date, used for Hive partitioning — include in filters for partition pruning.
