database_name: datalake_documentation_metrics_clean
table_name: tables_documentation
owner: vitor.carneiro@quintoandar.com.br
domain: Data Ops & Governance
description: >
  Daily snapshot of table-level governance metadata (domain, owner, description) read from
  governance YAML in the data-documentation S3 bucket (metadata/ prefix). YAML is published
  on each bi-etl-ejuice metadata deploy (CI upload_metadata_files_into_s3) and ingested
  incrementally by documentation_metrics (daily 05:00 UTC). Grain is one row per database_name
  and table_name per ingestion date. Partitioned by year, month, day — filter on load date.
  Used for documentation coverage and FAIR tiering.
columns:
  database_name:
    lineage:
      - datalake_documentation_metrics_raw.tables_documentation.database_name
    description: Hive schema name of the table whose governance metadata is being tracked.
  table_name:
    lineage:
      - datalake_documentation_metrics_raw.tables_documentation.table_name
    description: Table name within database_name for the governance metadata row.
  domain:
    lineage:
      - datalake_documentation_metrics_raw.tables_documentation.domain
    description: FAIR domain allowlist value assigned to the table in governance metadata YAML.
  owner:
    lineage:
      - datalake_documentation_metrics_raw.tables_documentation.owner
    description: Corporate email of the person or team responsible for the table as declared in governance metadata.
  table_description:
    lineage:
      - datalake_documentation_metrics_raw.tables_documentation.table_description
    description: Substantive table description from governance metadata explaining grain, source, and business purpose.
  year:
    lineage:
      - datalake_documentation_metrics_raw.tables_documentation.year
    description: Year of the data load date, used for Hive partitioning — include in filters for partition pruning.
  month:
    lineage:
      - datalake_documentation_metrics_raw.tables_documentation.month
    description: Month of the data load date, used for Hive partitioning — include in filters for partition pruning.
  day:
    lineage:
      - datalake_documentation_metrics_raw.tables_documentation.day
    description: Day of the data load date, used for Hive partitioning — include in filters for partition pruning.
