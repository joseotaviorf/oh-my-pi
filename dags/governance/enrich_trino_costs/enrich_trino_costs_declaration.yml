---
dag:
  name: enrich_trino_costs
  schedule_start_date: 2024, 6, 20
  schedule_interval: 0 5 * * *
  owner: Data Governance
  documentation:
    dag_purpose: |
      Exports Trino usage data from data_platform_metrics table in Databricks and joins with clusters costs from AWS table.
workflow:
  type: query_delta
  layer: enrich
  default_extraction_type: incremental
  default_partitions: [year, month, day]
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, ds, 'load_end_date') }}"
cluster:
  type: databricks_13_3_med_general_2_workers_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
