---
database_name: datalake_trino_costs
table_name: trino_costs_per_line
owner: luisa.ladeira@quintoandar.com.br
domain: Data Ops & Governance
description: >
  Daily Trino compute cost allocated to company lines by proportional share of processed
  input bytes. Query logs from data_platform_metrics are joined to org chart emails and
  cost center directory lines; AWS CUR costs tagged to Trino are split by usage. Grain is
  one row per company line and reference date. Partitioned by year, month, day via dim_date.
columns:
  year_quarter:
    lineage:
      - dw_public.dim_date.year_quarter
    description: Calendar year and quarter label for the cost reference date from dim_date.
  quarter:
    lineage:
      - dw_public.dim_date.quarter
    description: Calendar quarter number (1–4) for the cost reference date from dim_date.
  line:
    lineage:
      - datalake_gsheets_clean.cost_center_directory.line
    description: Company line from the cost center directory, mapped from the query author's work email.
  total_processed_input_data_gbytes:
    lineage:
      - data_platform_metrics.trino_query_log_events_metrics_clean_batch.processed_input_data_bytes
    description: Sum of Trino processed input bytes converted to gigabytes for queries attributed to this line on the reference date.
  proportional_cost_in_dollars:
    lineage:
      - cost_usage_reports.aws_costs_new.line_item_unblended_cost
    description: Share of daily Trino AWS unblended cost assigned to the line based on its processed data fraction.
  dt_created:
    lineage:
      - data_platform_metrics.trino_query_log_events_metrics_clean_batch.created_time
    description: Reference calendar date used to aggregate query volume and allocate platform cost.
  year:
    lineage:
      - dw_public.dim_date.year
    description: Year of the cost reference date from dim_date, used for Hive partitioning — include in filters for partition pruning.
  month:
    lineage:
      - dw_public.dim_date.month
    description: Month of the cost reference date from dim_date, used for Hive partitioning — include in filters for partition pruning.
  day:
    lineage:
      - dw_public.dim_date.day
    description: Day of the cost reference date from dim_date, used for Hive partitioning — include in filters for partition pruning.
