---
database_name: datalake_trino_costs
table_name: trino_costs_per_line
owner: herivelto.junior@quintoandar.com.br
domain: Data Ops & Governance
description: This table contains information about Trino costs per line based on the processed data.
columns:
  year_quarter:
    lineage:
      - dw_public.dim_date.year_quarter
    description: Year and Quarter for this entry date.
  quarter:
    lineage:
      - dw_public.dim_date.quarter
    description: Quarter for this entry date.
  line:
    lineage:
      - datalake_gsheets_clean.cost_center_directory.line
    description: Line name.
  total_processed_input_data_gbytes:
    lineage:
      - data_platform_metrics.trino_query_log_events_metrics_clean_batch.processed_input_data_bytes
    description: Total processed data for this line on each day on Trino.
  proportional_cost_in_dollars:
    lineage:
      - cost_usage_reports.aws_costs_new.line_item_unblended_cost
    description: Total cost divided divided by each line proportional usage based on the processed data.
  dt_created:
    lineage:
      - data_platform_metrics.trino_query_log_events_metrics_clean_batch.created_time
    description: Reference date for costs sum.
