---
database_name: datalake_jira_ops_clean
table_name: alert_log
description: >
  Table containing alert logs generated by the data pipeline, used for monitoring 
  and diagnosing issues in ingestion and transformation processes.
domain: Data Governance
owner: leonardo.soares@quintoandar.com.br
columns:
  id_alert:
    lineage:
      - datalake_jira_ops_raw.alert_log.alert_id
    description: Unique identifier for each alert entry in the log.
  log_type:
    lineage:
      - datalake_jira_ops_raw.alert_log.logtype
    description: Type or category of the alert log (e.g., error, warning, info).
  log:
    lineage:
      - datalake_jira_ops_raw.alert_log.log
    description: Detailed message or content of the alert log.
  owner:
    lineage:
      - datalake_jira_ops_raw.alert_log.owner
    description: User or system responsible for generating or owning the alert.
  ts_log:
    lineage:
      - datalake_jira_ops_raw.alert_log.logtime
    description: Timestamp indicating when the alert log was generated.
  dt_load:
    description: Full ingestion date representing when the data was loaded.
  year:
    lineage:
      - datalake_jira_ops_raw.alert_log.year
    description: Year of the data load date, used for data partitioning in the storage layer.
  month:
    lineage:
      - datalake_jira_ops_raw.alert_log.month
    description: Month of the data load date, used for data partitioning in the storage layer.
  day:
    lineage:
      - datalake_jira_ops_raw.alert_log.day
    description: Day of the data load date, used for data partitioning in the storage layer.