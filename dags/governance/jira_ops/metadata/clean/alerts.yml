database_name: datalake_jira_ops_clean
table_name: alerts
description: >
  Table containing alerts generated by monitored integrations within the data pipeline, 
  used for incident tracking, prioritization, and resolution of events.
domain: Data Ops & Governance
owner: leonardo.soares@quintoandar.com.br
columns:
  id_alert:
    lineage:
      - datalake_jira_ops_raw.alerts.id
    description: Unique identifier for the alert.
  id_alias:
    lineage:
      - datalake_jira_ops_raw.alerts.alias
    description: Alternative identifier for the alert, often used for referencing.
  id_tiny:
    lineage:
      - datalake_jira_ops_raw.alerts.tinyid
    description: Shortened version of the alert ID, typically used in URLs or UI.
  message:
    lineage:
      - datalake_jira_ops_raw.alerts.message
    description: Main message or content describing the alert.
  entity:
    lineage:
      - datalake_jira_ops_raw.alerts.entity
    description: The entity or component associated with the alert.
  source:
    lineage:
      - datalake_jira_ops_raw.alerts.source
    description: System or integration source from which the alert was generated.
  status:
    lineage:
      - datalake_jira_ops_raw.alerts.status
    description: Current status of the alert (e.g., open, closed, acknowledged).
  tags:
    lineage:
      - datalake_jira_ops_raw.alerts.tags
    description: Labels or keywords associated with the alert for categorization.
  integration_type:
    lineage:
      - datalake_jira_ops_raw.alerts.integrationtype
    description: Type of integration that triggered the alert.
  integration_name:
    lineage:
      - datalake_jira_ops_raw.alerts.integrationname
    description: Name of the integration that triggered the alert.
  count:
    lineage:
      - datalake_jira_ops_raw.alerts.count
    description: Number of occurrences of this alert.
  owner:
    lineage:
      - datalake_jira_ops_raw.alerts.owner
    description: User or team responsible for handling the alert.
  priority:
    lineage:
      - datalake_jira_ops_raw.alerts.priority
    description: Priority level assigned to the alert (e.g., P1, P2, P3).
  responders:
    lineage:
      - datalake_jira_ops_raw.alerts.responders
    description: List of users or teams designated to respond to the alert.
  actions:
    lineage:
      - datalake_jira_ops_raw.alerts.actions
    description: Available actions or operations that can be performed on the alert.
  is_snoozed:
    lineage:
      - datalake_jira_ops_raw.alerts.snoozed
    description: Indicates whether the alert has been snoozed (temporarily silenced).
  is_seen:
    lineage:
      - datalake_jira_ops_raw.alerts.seen
    description: Indicates whether the alert has been viewed.
  is_acknowledged:
    lineage:
      - datalake_jira_ops_raw.alerts.acknowledged
    description: Indicates whether the alert has been acknowledged by a responder.
  ts_last_occured:
    lineage:
      - datalake_jira_ops_raw.alerts.lastoccuredat
    description: Timestamp of the last time the alert occurred.
  ts_created:
    lineage:
      - datalake_jira_ops_raw.alerts.createdat
    description: Timestamp of when the alert was originally created.
  ts_updated:
    lineage:
      - datalake_jira_ops_raw.alerts.updatedat
    description: Timestamp of the most recent update to the alert.
  dt_load:
    description: Full ingestion date representing when the data was loaded.
  year:
    lineage:
      - datalake_jira_ops_raw.alerts.year
    description: Year of the data load date, used for data partitioning.
  month:
    lineage:
      - datalake_jira_ops_raw.alerts.month
    description: Month of the data load date, used for data partitioning.
  day:
    lineage:
      - datalake_jira_ops_raw.alerts.day
    description: Day of the data load date, used for data partitioning.
