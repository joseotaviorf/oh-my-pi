dag:
  name: jira_ops
  owner: Data Governance
  schedule_start_date: 2020, 6, 1
  schedule_interval: "0 0 * * *"
  documentation:
    dag_purpose: This DAG imports, via API extraction, the tables for Jira, our platform for managing project lifecycles.
workflow:
  type: custom_ingestion
  layer: raw
  load_spark_job: load_jira_ops_data_into_datalake_raw
  default_extraction_type: incremental
  default_partitions: ["year", "month", "day"]
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  spark_job_arguments:
    - "{environment}"
    - "{bucket}"
    - "{dag_name}"
    - "{load_start_date}"
    - "{load_end_date}"
    - "{partitions}"
    - "{table_name}"
  raw_inner_dependencies:
    alert_log:
      - alerts
  tables_customization:
    alerts:
      extra_spark_job_arguments:
        - endpoint_enum: LIST_ALERTS
          jql_query_filter: 'responders: "Analytics Engineering"'
    alert_log:
      extra_spark_job_arguments:
        - endpoint_enum: LIST_ALERT_LOG
          feedback_config: 
            table: datalake_jira_ops_raw.alerts
            seleted_column: id
            feedback_key: alert_id
            date_column_filter: createdAt
cluster:
  type: custom_cluster
  custom_libraries:
    - whl: "{artifacts_bucket}/jira-api-client-python/quintoandar_jira_api_client-0.3.0-py2.py3-none-any.whl"
  custom_configurations:
    driver_node_type_id: r5d.4xlarge
    node_type_id: r5d.2xlarge
    num_workers: 3
    spark_version: 13.3.x-scala2.12
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
  databricks_conn_id: databricks_new
