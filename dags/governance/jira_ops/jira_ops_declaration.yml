dag:
  name: jira_ops
  owner: Data Governance
  schedule_start_date: 2020, 6, 1
  schedule_interval: "0 0 * * *"
  documentation:
    dag_purpose: This DAG imports, via API extraction, the tables for Jira, our platform for managing project lifecycles.
workflow:
  type: custom_ingestion
  layer: raw
  load_spark_job: load_jira_ops_data_into_datalake_raw
  default_extraction_type: incremental
  default_partitions: ["year", "month", "day"]
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_end | ds, 'load_end_date') }}"
  spark_job_arguments:
    - "{environment}"
    - "{bucket}"
    - "{dag_name}"
    - "{load_start_date}"
    - "{load_end_date}"
    - "{partitions}"
    - "{table_name}"
  raw_inner_dependencies:
    alert_log:
      - alerts
    schedules_override:
      - schedules
    schedules_timeline:
      - schedules
    responders_account:
      - schedules_timeline
    user_account:
      - responders_account
  tables_customization:
    alerts:
      extra_spark_job_arguments:
        - endpoint_enum: LIST_ALERTS
          params:
            cloud_id: cloud_id_secret
            size: 100
          jql_query_filter: 'responders: "Data Engineering"'
    alert_log:
      extra_spark_job_arguments:
        - endpoint_enum: LIST_ALERT_LOG
          params:
            cloud_id: cloud_id_secret
            size: 100
          feedback_config: 
            table: datalake_jira_ops_raw.alerts
            seleted_column: id
            feedback_key: alert_id
            date_column_filter: createdAt
    schedules:
      extraction_type: full
      partitions: []
      extra_spark_job_arguments:
        - endpoint_enum: LIST_SCHEDULES
          params:
            cloud_id: cloud_id_secret
    schedules_timeline:
      extra_spark_job_arguments:
        - endpoint_enum: GET_SCHEDULES_TIMELINE
          params:
            cloud_id: cloud_id_secret
            interval: 1
            interval_unit: week
            date: "{{ data_interval_end | ds }}T00:00:00Z"
            expand: "base, forwarding, override"
          feedback_config: 
            table: datalake_jira_ops_raw.schedules
            seleted_column: id
            feedback_key: schedule_id
            date_column_filter: dt_load
    schedules_override:
      extra_spark_job_arguments:
        - endpoint_enum: LIST_SCHEDULES_OVERRIDES
          params:
            cloud_id: cloud_id_secret
          feedback_config: 
            table: datalake_jira_ops_raw.schedules
            seleted_column: id
            feedback_key: schedule_id
            date_column_filter: dt_load
    user_account:
      extra_spark_job_arguments:
        - endpoint_enum: GET_USER
          params:
            expand: "groups, applicationRoles"
          feedback_config:
            table: datalake_jira_ops_raw.responders_account
            seleted_column: id_account
            feedback_key: accountId
            date_column_filter: dt_load
          api_enum: JIRA
          consumer: jira_users
    responders_account:
      load_spark_job: load_responders_account_into_datalake_raw
      extra_spark_job_arguments:
        - feedback_config:
            timeline_table: datalake_jira_ops_raw.schedules_timeline
            override_table: datalake_jira_ops_raw.schedules_override
            date_column_filter: dt_load
