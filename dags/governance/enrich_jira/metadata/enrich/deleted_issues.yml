---
database_name: datalake_jira
table_name: deleted_issues
description: >
  Append-only log of Jira issues that were hard-deleted after being present in datalake_jira.issues.
  Only projects listed in enrich_jira_declaration.yml (tables_customization.deleted_issues) are
  scanned daily. Grain is one row per deleted issue key; dt_deleted reflects the DAG run date when
  the deletion was first detected, not necessarily the exact moment of deletion in Jira.
domain: Data Ops & Governance
owner: luisa.ladeira@quintoandar.com.br
columns:
  id_issue:
    description: >
      Jira issue key (project prefix and numeric id) for an issue confirmed hard-deleted via the
      Jira API after it was previously loaded into datalake_jira.issues.
  dt_deleted:
    description: >
      Date when the enrich_jira DAG first detected the issue missing from Jira. Because the job
      runs once daily, this approximates the deletion date and may lag the actual removal. History
      starts on 2024-09-25 when the table was created.
