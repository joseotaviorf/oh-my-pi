---
database_name: datalake_jira
table_name: issues
description: Detailed information from the Issues created in Jira
domain: Data Ops & Governance
owner: luisa.ladeira@quintoandar.com.br

columns:
  id_issue:
    lineage:
      - datalake_jira_clean.issues.key
    description: Unique identifier of the issue in Jira
  id_parent_issue:
    lineage:
      - datalake_jira_clean.issues.fields
    description: Identifier of the parent issue, if it's a sub-task
  id_project:
    lineage:
      - datalake_jira_clean.issues.fields
    description: Internal Jira project ID related to the issue
  summary:
    lineage:
      - datalake_jira_clean.issues.fields
    description: Short title or summary of the issue
  issue_description:
    lineage:
      - datalake_jira_clean.issues.fields
    description: Detailed description of the issue
  project_name:
    lineage:
      - datalake_jira_clean.issues.fields
    description: Name of the Jira project the issue belongs to
  issue_type:
    lineage:
      - datalake_jira_clean.issues.fields
    description: Type of the issue (e.g., Bug, Task, Story)
  current_status:
    lineage:
      - datalake_jira_clean.issues.fields
    description: Current status of the issue (e.g., To Do, In Progress, Done)
  current_status_category:
    lineage:
      - datalake_jira_clean.issues.fields
    description: High-level status category (e.g., To Do, In Progress, Done)
  assignee:
    lineage:
      - datalake_jira_clean.issues.fields
    description: Person currently assigned to the issue
  assignee_account_id:
    lineage:
      - datalake_jira_clean.issues.fields
    description: Atlassian accountId of the currently assigned person, used to resolve identity across Jira Cloud APIs (e.g. email lookup) without relying on the display name.
  reporter:
    lineage:
      - datalake_jira_clean.issues.fields
    description: Person who created or reported the issue
  owner_person:
    lineage:
      - datalake_jira_clean.issues.fields
    description: Person responsible for the issue resolution
  team_name:
    lineage:
      - datalake_jira_clean.issues.fields
    description: Name of the team handling the issue
  priority:
    lineage:
      - datalake_jira_clean.issues.fields
    description: Priority level assigned to the issue
  criticality:
    lineage:
      - datalake_jira_clean.issues.fields
    description: "Custom 'Criticality' select field (customfield_35959): Critical/High/Medium/Low. Null for projects that don't have this field on their issue type (e.g. no allowedValues configured)."
  resolution:
    lineage:
      - datalake_jira_clean.issues.fields
    description: Resolution status of the issue (e.g., Fixed, Won't Fix)
  root_cause_resolution:
    lineage:
      - datalake_jira_clean.issues.fields
    description: Description of how the root cause was addressed
  incident_category:
    lineage:
      - datalake_jira_clean.issues.fields
    description: Category of the incident reported in the issue
  incident_owner:
    lineage:
      - datalake_jira_clean.issues.fields
    description: >
      Team or person accountable for the incident. Defaults to the DAG owner but may be
      manually reassigned to another team (Jira custom field customfield_31231).
  old_incident_owner:
    lineage:
      - datalake_jira_clean.issues.fields
    description: >
      Legacy Jira custom field previously used to populate the incident owner (customfield_12078).
      Deactivated; retained for historical analysis only.
  dag_owner:
    lineage:
      - datalake_jira_clean.issues.fields
    description: >
      DAG owner value from DAGOwnerEnum, filled by post-callback automation
      (Jira custom field customfield_30283).
  incident_status:
    lineage:
      - datalake_jira_clean.issues.fields
    description: Current status of the incident as recorded in the JIRA custom field.
  sla_affected:
    lineage:
      - datalake_jira_clean.issues.fields
    description: Indicates whether the incident impacts the defined Service Level Agreement (SLA).
  last_cycle:
    lineage:
      - datalake_jira_clean.issues.fields
    description: Most recent cycle information associated with the issue
  labels:
    lineage:
      - datalake_jira_clean.issues.fields
    description: Tags or labels associated with the issue
  cycles:
    lineage:
      - datalake_jira_clean.issues.fields
    description: Sprints or cycles the issue was part of
  tech_debt_category:
    lineage:
      - datalake_jira_clean.issues.fields
    description: DPE Tech Debt custom field, used to identify the tech debt category
  tech_debt_size:
    lineage:
      - datalake_jira_clean.issues.fields
    description: DPE Tech Debt custom field, used to identify the tech debt size
  tech_debt_urgency:
    lineage:
      - datalake_jira_clean.issues.fields
    description: DPE Tech Debt custom field, used to identify the tech debt urgency
  tech_debt_user_impact:
    lineage:
      - datalake_jira_clean.issues.fields
    description: DPE Tech Debt custom field, used to identify the tech debt user impact
  tech_debt_blockage:
    lineage:
      - datalake_jira_clean.issues.fields
    description: DPE Tech Debt custom field, used to identify the tech debt blockage
  tech_debt_uncertainty:
    lineage:
      - datalake_jira_clean.issues.fields
    description: DPE Tech Debt custom field, used to identify the tech debt uncertainty
  tech_debt_cumulativeness:
    lineage:
      - datalake_jira_clean.issues.fields
    description: DPE Tech Debt custom field, used to identify the tech debt cumulativeness
  tech_debt_complexity:
    lineage:
      - datalake_jira_clean.issues.fields
    description: DPE Tech Debt custom field, used to identify the tech debt complexity
  story_points:
    lineage:
      - datalake_jira_clean.issues.fields
    description: Number of story points assigned to the issue
  story_points_estimate:
    lineage:
      - datalake_jira_clean.issues.fields
    description: Initial estimate of story points for the issue
  is_flagged:
    lineage:
      - datalake_jira_clean.issues.fields
    description: True when the issue has an active Jira flag (customfield_10400).
  is_deleted:
    description: Flag to identify if the issue was deleted
  dt_deleted:
    description: Date when the issue was deleted
  dt_started:
    lineage:
      - datalake_jira_clean.issues.fields
    description: Timestamp when work on the issue started
  ts_created:
    lineage:
      - datalake_jira_clean.issues.fields
    description: Timestamp when the issue was created
  ts_updated:
    lineage:
      - datalake_jira_clean.issues.fields
    description: Timestamp when the issue was last updated in Jira.
  ts_resolved:
    lineage:
      - datalake_jira_clean.issues.fields
    description: Timestamp when the issue was resolved
