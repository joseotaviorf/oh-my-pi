---
database_name: datalake_trino_detractor
table_name: weekly_detractor_queries
owner: herivelto.junior@quintoandar.com.br
domain: Data Ops & Governance
description: This table materialize query executions considered detractor according to the thresholds defined on the DAG.
columns:
  id_superset_dashboard:
    lineage:
      - datalake_trino.trino_detractor_queries.id_superset_dashboard
    description: Superset dashboard Id
  superset_slice_id:
    lineage:
      - datalake_trino.trino_detractor_queries.superset_slice_id
    description: Superset slice Id
  dashboard_name:
    lineage:
      - datalake_trino.trino_detractor_queries.dashboard_name
    description: Dashboard Name
  slice_name:
    lineage:
      - datalake_trino.trino_detractor_queries.slice_name
    description: Slice name
  executor_email:
    lineage:
      - datalake_trino.trino_detractor_queries.executor_user
    description: User e-mail that executed the query
  last_owner_email:
    lineage:
      - datalake_trino.trino_detractor_queries.last_owner
    description: Last owner's email
  week_start:
    lineage:
      - dw_public.dim_date.week_start
    description: Week that this user became a detractor
  detractor_runs:
    description: Detractor executions of week
  is_detractor:
    description: Whether this user is considered a detractor or not for this query
  superset_runs:
    description: How many times the query ran on a given week
  count_detractors:
    description: How many times this user is being considered as a detractor.
  ts_last_detractor_of_week:
    lineage:
      - datalake_trino.trino_detractor_queries.ts_execution_start
    description: Last detractor run on a given week.
  ts_last_superset_run_of_week:
    lineage:
      - datalake_superset_clean.logs.ts_event
    description: Last query execution on a given week.
