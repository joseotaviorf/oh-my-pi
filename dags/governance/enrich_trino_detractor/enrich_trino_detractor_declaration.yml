---
dag:
  name: enrich_trino_detractor
  schedule_start_date: 2022, 5, 5
  owner: Data Governance
  documentation:
    dag_purpose: |
      Exports Trino usage data from data_platform_metrics table in Databricks
workflow:
  type: query
  layer: enrich
  default_extraction_type: incremental
  default_partitions: [year, month, day]
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, ds, 'load_end_date') }}"
    detractor_start_date: "2024-09-02"
  short_circuit_customization:
    function: CHECK_IS_SPECIFIC_WEEKDAY
    function_params:
      weekday: 0
cluster:
  type: databricks_12_2_med_general_photon_cluster
