dag:
  name: jira_open_incidents_report
  owner: Data Governance
  schedule_start_date: 2026, 8, 13
  schedule_interval: "0 9 * * *"
  documentation:
    dag_purpose: |
      Daily (9am BRT) digest of open DEI incident cards (current_status_category
      != 'Done'). Snapshot grain is one row per open incident. Google Chat digest is a
      Line (incident_owner) leaderboard: count, newest/oldest age, on going
      (card workflow In Progress), unassigned, description not filled. Open =
      on going + backlog; concluded (Done) is excluded. Posts to space
      "agents-data-alarms" via Notification Hub (generic cardsV2 route, webhook base co-located
      in spark_jobs/{environment}_conf.yml).
workflow:
  type: query_delta
  layer: enrich
  custom_schema: jira_reports
  load_spark_job: report_open_incidents
  tables_customization:
    open_incidents_snapshot:
      spark_job_arguments:
        - "{environment}"
        - "{bucket}"
        - "{dag_name}"
        - "{schema}"
        - "{{ data_interval_start }}"
      partitions: [year, month, day]
