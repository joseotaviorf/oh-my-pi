dag:
  name: jira_open_incidents_report
  owner: Data Governance
  schedule_start_date: 2026, 8, 13
  # Cron, not dataset-triggered: fixed 09:00 delivery so the digest reflects same-day
  # cards. Relies on jira's 08:00 run + enrich_jira (see dependency_exceptions/
  # manual_modifications.yaml) finishing within the hour; it does not wait on that
  # dataset event.
  schedule_interval: "0 9 * * *"
  documentation:
    dag_purpose: |
      Digest of open DEI incident cards (current_status_category != 'Done').
      Cron-scheduled at 09:00 America/Sao_Paulo (not dataset-triggered), so delivery
      time is fixed and does not depend on enrich_jira's dataset chain finishing.
      Snapshot grain is one row per open incident. Google Chat digest has two blocks:
      a summary (date, total open, unassigned, not filled) and a per-domain
      (incident_owner) breakdown with count + newest/oldest age, each domain linked to
      its pre-filtered DEI board ("Tech Platform" domains merged into one unlinked
      line). Open = on going + backlog; concluded (Done) is excluded. Posts to space
      "DAG_Rotation" via Notification Hub (generic cardsV2 route, webhook base co-located
      in spark_jobs/{environment}_conf.yml).
workflow:
  type: query_delta
  layer: enrich
  custom_schema: jira_reports
  load_spark_job: report_open_incidents
  tables_customization:
    open_incidents_snapshot:
      spark_job_arguments:
        - "{environment}"
        - "{bucket}"
        - "{dag_name}"
        - "{schema}"
        - "{{ data_interval_start }}"
      partitions: [year, month, day]
