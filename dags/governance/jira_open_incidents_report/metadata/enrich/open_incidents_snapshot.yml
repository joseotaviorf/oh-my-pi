database_name: datalake_jira_reports
table_name: open_incidents_snapshot
owner: gustavo.rompe@quintoandar.com.br
domain: Data Ops & Governance
description: >
  Daily snapshot of open DEI incident cards (current_status_category != 'Done')
  at the time the jira_open_incidents_report DAG ran. One row per open incident per report
  run — audit trail for the Google Chat digest sent to the DAG_Rotation space.
columns:
  id_issue:
    lineage:
      - datalake_jira.issues.id_issue
    description: Jira issue key (e.g. DEI-1234) of the open incident.
  summary:
    lineage:
      - datalake_jira.issues.summary
    description: Incident card summary/title at the time of the report run.
  assignee:
    lineage:
      - datalake_jira.issues.assignee
    description: Display name of the card's assignee at the time of the report run.
  incident_owner:
    lineage:
      - datalake_jira.issues.incident_owner
    description: Owning team/Line value (Jira custom field) at the time of the report run.
  ts_created:
    lineage:
      - datalake_jira.issues.ts_created
    description: Timestamp the incident card was created, used to compute how long it has been open.
  issue_description:
    lineage:
      - datalake_jira.issues.issue_description
    description: >
      Jira description body at report time (ADF JSON or markdown). Used to detect
      whether Problem/Cause/Solution is still the pre-filled on-call template.
  current_status:
    lineage:
      - datalake_jira.issues.current_status
    description: >
      Jira card workflow status name at report time (Backlog, On going, Concluded,
      or locale equivalents such as Tarefas pendentes / Em andamento).
  current_status_category:
    lineage:
      - datalake_jira.issues.current_status_category
    description: >
      Jira status category at report time. Open digest is To Do (backlog) plus
      In Progress (on going); Done (concluded) is excluded.
  year:
    lineage: []
    description: Year the report DAG ran, used for Delta partitioning — filter for partition pruning.
  month:
    lineage: []
    description: Month the report DAG ran, used for Delta partitioning — filter for partition pruning.
  day:
    lineage: []
    description: Day the report DAG ran, used for Delta partitioning — filter for partition pruning.
