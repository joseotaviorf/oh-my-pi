database_name: datalake_gsheets_clean
table_name: anonymization_manual_validation
owner: augusto.torres@quintoandar.com.br
domain: Data Ops & Governance
description: Information about anonymization manual validation.
columns:
  id_entity:
    lineage:
      - datalake_gsheets_raw.anonymization_manual_validation.id_entity
    description: Id entity, field composed by database_name, table_name and column_name.
  manual_eval:
    lineage:
      - datalake_gsheets_raw.anonymization_manual_validation.manual_eval
    description: Manual result. Used to anonymize columns.
    categories:
      "Telefone": PII data, indicate the column is a telefone number.
      "Email": PII data, indicate the column is an user email.
      "Endereço/CEP": PII data, indicate the column is an user address.
      "Nome": PII data, indicate the column is an user name.
      "CPF/RG/CNPJ": PII data, indicate the column is an brazilian document.
      "Other": PII data, indicate the column have a pii data but not classified yet.
      "Entidade de classe": PII data, indicate the column is and job class, like creci.
      "Dados bancários": PII data, indicate colunns have bank information.
      "RAE": PII data, RAE is Record of Anonymization Exceptions, indicate the column is an exception and must be desnonymizate.
      "N/A": Indicate the column is not a PII data.
    requester:
      lineage:
        - datalake_gsheets_raw.anonymization_manual_validation.id_entity.requester
      description: Case is a RAE, Record of Anonymization Exceptions, this column indicate the email of who request the exception
    aproved_by:
      lineage:
        - datalake_gsheets_raw.anonymization_manual_validation.id_entity.aproved_by
      description: Who validated the field as a PII, if is a RAE, Record of Anonymization Exceptions, case indicate who aproove the exception.
    justification:
      lineage:
        - datalake_gsheets_raw.anonymization_manual_validation.id_entity.justification
      description: Indicate why this columns is a exception in the Anonymization proccess.
  ts_ingested:
    lineage:
      - datalake_gsheets_raw.anonymization_manual_validation.ts_ingested
    description: Timestamp represent the manual eval ingestion time.
