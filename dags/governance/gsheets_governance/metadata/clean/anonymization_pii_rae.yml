database_name: datalake_gsheets_clean
table_name: anonymization_pii_rae
owner: vitor.carneiro@quintoandar.com.br
domain: Data Ops & Governance
description: >
  Clean layer of Record of Anonymization Exception (RAE) cases maintained in the governance Google
  Sheet and ingested by gsheets_governance. Each row documents a column exempt from standard PII
  anonymization, including approval workflow, LGPD impact, and review dates. Grain is one row per
  id_rae.
columns:
  id_rae:
    lineage:
      - datalake_gsheets_raw.anonymization_pii_rae.rae_id
    description: Unique identifier of the RAE exception case in the governance spreadsheet.
  full_columns_name:
    lineage:
      - datalake_gsheets_raw.anonymization_pii_rae.full_columns_name
    description: Fully qualified column name (database.table.column) covered by the RAE exception.
  exception_type:
    lineage:
      - datalake_gsheets_raw.anonymization_pii_rae.exception_type
    description: Category or cause explaining why the column qualifies as an anonymization exception.
  has_pii:
    lineage:
      - datalake_gsheets_raw.anonymization_pii_rae.contains_pii
    description: Boolean indicating whether the column actually contains PII (false for false positives).
  data_subject_type:
    lineage:
      - datalake_gsheets_raw.anonymization_pii_rae.data_subject_type
    description: LGPD data-subject classification applied to the column under the exception.
  requester:
    lineage:
      - datalake_gsheets_raw.anonymization_pii_rae.requester
    description: Person who submitted the RAE use case for governance review.
  justification:
    lineage:
      - datalake_gsheets_raw.anonymization_pii_rae.justification
    description: Business justification for exempting the column from anonymization.
  comments:
    lineage:
      - datalake_gsheets_raw.anonymization_pii_rae.comments
    description: Additional notes from the requester supporting the RAE submission.
  status:
    lineage:
      - datalake_gsheets_raw.anonymization_pii_rae.status
    description: Current workflow status of the RAE case (for example pending, approved, or rejected).
  lgpd_impact:
    lineage:
      - datalake_gsheets_raw.anonymization_pii_rae.lgpd_impact
    description: Indicates whether the approved exception removes the column from anonymization pipelines.
  focal_points:
    lineage:
      - datalake_gsheets_raw.anonymization_pii_rae.focal_points
    description: Governance contacts responsible for ongoing review of the RAE case.
  approved_by:
    lineage:
      - datalake_gsheets_raw.anonymization_pii_rae.approved_by
    description: Person who formally approved the RAE exception for production use.
  dt_activation:
    lineage:
      - datalake_gsheets_raw.anonymization_pii_rae.date_of_activation
    description: Date when the column was removed from anonymization following RAE approval.
  dt_approval:
    lineage:
      - datalake_gsheets_raw.anonymization_pii_rae.approval_date
    description: Date when the RAE case received final governance approval.
  dt_last_reviewed:
    lineage:
      - datalake_gsheets_raw.anonymization_pii_rae.last_review
    description: Date of the most recent periodic review of the active RAE exception.
  pull_request:
    lineage:
      - datalake_gsheets_raw.anonymization_pii_rae.pull_request
    description: URL or reference to the bi-etl-ejuice pull request implementing the approved RAE change.
