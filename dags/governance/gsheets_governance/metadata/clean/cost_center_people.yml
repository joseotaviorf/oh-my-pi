database_name: datalake_gsheets_clean
table_name: cost_center_people
owner: gustavo.alencar@quintoandar.com.br
domain: Data Ops & Governance
description: >
  Clean assignment of employees to cost centers, sourced from the cost_center_people Google Sheet
  via gsheets_governance. Grain is one row per work_email and cost_center pair.
columns:
  work_email:
    lineage:
      - datalake_gsheets_raw.cost_center_people.work_email
    description: Corporate email address of the employee assigned to the cost center.
  cost_center:
    lineage:
      - datalake_gsheets_raw.cost_center_people.cost_center
    description: Cost center code linked to the employee for finance and organizational reporting.
