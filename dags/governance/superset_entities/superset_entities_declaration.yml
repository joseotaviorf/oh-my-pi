dag:
  name: superset_entities
  schedule_start_date: 2024, 3, 1
  schedule_interval: 0 0 * * *
  owner: Data Governance
workflow:
  type: database_pull_delta
  layer: raw
  custom_schema: superset
  has_hive_sync: true
  database_type: postgres
  default_extraction_type: incremental
  default_partitions: ["year", "month", "day"]
  dbutils_secret_key: SUPERSET_DB
  tables_customization:
    dashboard_slices:
      extraction_type: full
      partitions: []
    dashboard_user:
      extraction_type: full
      partitions: []
    dashboards:
      date_filter_column: changed_on
    slice_user:
      extraction_type: full
      partitions: []
    slices:
      date_filter_column: changed_on
    sql_metrics:
      date_filter_column: changed_on
    sqlatable_user:
      extraction_type: full
      partitions: []
    table_columns:
      date_filter_column: changed_on
    table_schema:
      date_filter_column: changed_on
    tables:
      date_filter_column: changed_on
    tag:
      date_filter_column: changed_on
    tagged_object:
      date_filter_column: changed_on
cluster:
  type: databricks_12_2_min_general_cluster
  custom_configurations:
    driver_node_type_id: m5a.xlarge
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE

  databricks_conn_id: databricks_new
