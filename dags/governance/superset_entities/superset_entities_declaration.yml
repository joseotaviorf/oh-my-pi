dag:
  name: superset_entities
  schedule_start_date: 2024, 3, 1
  schedule_interval: 0 0 * * *
  owner: Data Governance
workflow:
  type: cdc
  layer: raw
  custom_schema: superset
  has_hive_sync: true
  database_type: postgres
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  dbutils_secret_key: SUPERSET_DB
  tables_customization:
    dashboard_slices:
      clean_table_name: dashboard_slices
    dashboard_user:
      clean_table_name: dashboard_user
    dashboards:
      clean_table_name: dashboards
    slice_user:
      clean_table_name: slice_user
    slices:
      clean_table_name: slices
    sql_metrics:
      clean_table_name: sql_metrics
    sqlatable_user:
      clean_table_name: sqlatable_user
    table_columns:
      clean_table_name: table_columns
    table_schema:
      clean_table_name: table_schema
    tables:
      clean_table_name: tables
    tag:
      clean_table_name: tag
    tagged_object:
      clean_table_name: tagged_object
cluster:
  type: databricks_16_4_min_general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    driver_node_type_id: m5a.xlarge
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE
