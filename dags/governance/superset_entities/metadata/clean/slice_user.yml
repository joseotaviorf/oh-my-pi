---
database_name: datalake_superset_clean
table_name: slice_user
owner: vitor.carneiro@quintoandar.com.br
domain: Data Ops & Governance
description: >
  Clean-layer snapshot of Apache Superset chart ownership assignments replicated from the Superset
  PostgreSQL slice_user junction table via CDC (superset_entities, daily 00:00 UTC). Grain is one
  row per chart-owner user pairing. Full snapshot without date partitions — use for governance
  analytics on chart stewardship and accountable ownership coverage.
columns:
  id:
    lineage:
      - datalake_superset_raw.slice_user.id
    description: Primary key from Superset slice_user identifying a distinct chart-owner assignment record.
  id_user:
    lineage:
      - datalake_superset_raw.slice_user.user_id
    description: Foreign key to ab_user.id for the Superset account designated as owner of the chart.
  id_slice:
    lineage:
      - datalake_superset_raw.slice_user.slice_id
    description: Foreign key to slices.id for the chart assigned to the owner user.
