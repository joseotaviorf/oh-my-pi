---
database_name: datalake_superset_clean
table_name: slices
owner: vitor.carneiro@quintoandar.com.br
domain: Data Ops & Governance
description: >
  Clean-layer snapshot of Apache Superset chart (slice) definitions replicated from the Superset
  PostgreSQL slices table via CDC (superset_entities, daily 00:00 UTC). Grain is one row per chart
  per load date. Partitioned by year, month, day — filter on ingestion date. Supports governance
  analytics on chart inventory, visualization types, dataset bindings, and certification status.
columns:
  id:
    lineage:
      - datalake_superset_raw.slices.id
    description: Primary key from Superset slices identifying a distinct chart (slice) record.
  id_datasource:
    lineage:
      - datalake_superset_raw.slices.datasource_id
    description: Foreign key to tables.id for the Superset dataset that supplies data to this chart.
  id_user_created:
    lineage:
      - datalake_superset_raw.slices.created_by_fk
    description: Foreign key to ab_user.id for the Superset account that originally created the chart.
  id_user_changed:
    lineage:
      - datalake_superset_raw.slices.changed_by_fk
    description: Foreign key to ab_user.id for the account that last modified the chart configuration.
  id_user_last_saved:
    lineage:
      - datalake_superset_raw.slices.last_saved_by_fk
    description: Foreign key to ab_user.id for the account that last explicitly saved the chart in the editor.
  slice_name:
    lineage:
      - datalake_superset_raw.slices.slice_name
    description: User-visible chart title displayed in Superset dashboards, chart lists, and exports.
  datasource_type:
    lineage:
      - datalake_superset_raw.slices.datasource_type
    description: Datasource category backing the chart (typically table for physical or virtual datasets).
  datasource_name:
    lineage:
      - datalake_superset_raw.slices.datasource_name
    description: Fully qualified name of the Superset dataset bound to this chart at snapshot time.
  viz_type:
    lineage:
      - datalake_superset_raw.slices.viz_type
    description: Superset visualization plugin identifier (for example bar, line, big_number, or pivot_table).
  params:
    lineage:
      - datalake_superset_raw.slices.params
    description: JSON configuration defining metrics, dimensions, filters, and visualization-specific options.
  description:
    lineage:
      - datalake_superset_raw.slices.description
    description: Free-text description of the chart purpose, business context, or usage notes.
  cache_timeout:
    lineage:
      - datalake_superset_raw.slices.cache_timeout
    description: Chart-level cache duration in seconds before Superset refreshes query results.
  perm:
    lineage:
      - datalake_superset_raw.slices.perm
    description: Permission string encoding the fully qualified dataset path required to access this chart.
  schema_perm:
    lineage:
      - datalake_superset_raw.slices.schema_perm
    description: Permission string for the database schema associated with the chart datasource.
  uuid:
    lineage:
      - datalake_superset_raw.slices.uuid
    description: Globally unique identifier assigned to the chart for API references and embedding.
  external_url:
    lineage:
      - datalake_superset_raw.slices.external_url
    description: URL pointing to the authoritative chart definition when managed outside Superset.
  query_context:
    lineage:
      - datalake_superset_raw.slices.query_context
    description: JSON payload describing the query execution context, including form data and result format.
  certified_by:
    lineage:
      - datalake_superset_raw.slices.certified_by
    description: Name or team label of the person or group that certified the chart as trusted for consumption.
  certification_details:
    lineage:
      - datalake_superset_raw.slices.certification_details
    description: Free-text notes explaining the certification rationale, scope, or responsible team.
  is_managed_externally:
    lineage:
      - datalake_superset_raw.slices.is_managed_externally
    description: Boolean flag indicating whether chart content is owned and updated by an external system.
  ts_created:
    lineage:
      - datalake_superset_raw.slices.created_on
    description: Timestamp when the chart record was first created in Superset (UTC).
  ts_changed:
    lineage:
      - datalake_superset_raw.slices.changed_on
    description: Timestamp when the chart configuration was last updated in Superset (UTC).
  ts_last_saved:
    lineage:
      - datalake_superset_raw.slices.last_saved_at
    description: Timestamp of the most recent explicit save action on the chart in the Superset editor (UTC).
  year:
    lineage:
      - datalake_superset_raw.slices.year
    description: Year of the data load date, used for Hive partitioning — include in filters for partition pruning.
  month:
    lineage:
      - datalake_superset_raw.slices.month
    description: Month of the data load date, used for Hive partitioning — include in filters for partition pruning.
  day:
    lineage:
      - datalake_superset_raw.slices.day
    description: Day of the data load date, used for Hive partitioning — include in filters for partition pruning.
