---
database_name: datalake_superset_clean
table_name: tables
owner: vitor.carneiro@quintoandar.com.br
domain: Data Ops & Governance
description: >
  Clean-layer snapshot of Apache Superset dataset (sqlatable) definitions replicated from the
  Superset PostgreSQL tables table via CDC (superset_entities, daily 00:00 UTC). Grain is one row
  per dataset per load date. Partitioned by year, month, day — filter on ingestion date. Supports
  governance analytics on dataset inventory, SQL definitions, cache settings, and schema bindings.
columns:
  id:
    lineage:
      - datalake_superset_raw.tables.id
    description: Primary key from Superset tables identifying a distinct dataset (sqlatable) record.
  id_database:
    lineage:
      - datalake_superset_raw.tables.database_id
    description: Foreign key to the Superset database connection that hosts the underlying physical or virtual table.
  id_user_created:
    lineage:
      - datalake_superset_raw.tables.created_by_fk
    description: Foreign key to ab_user.id for the Superset account that originally registered the dataset.
  id_user_changed:
    lineage:
      - datalake_superset_raw.tables.changed_by_fk
    description: Foreign key to ab_user.id for the account that last modified the dataset configuration.
  table_name:
    lineage:
      - datalake_superset_raw.tables.table_name
    description: Dataset name as displayed in Superset chart builders and dataset management screens.
  main_dttm_col:
    lineage:
      - datalake_superset_raw.tables.main_dttm_col
    description: Name of the primary datetime column Superset uses for time-range filters on this dataset.
  offset:
    lineage:
      - datalake_superset_raw.tables.offset
    description: Time offset in seconds applied to the main datetime column for timezone or reporting adjustments.
  description:
    lineage:
      - datalake_superset_raw.tables.description
    description: Free-text business description of the dataset purpose, grain, and intended consumers.
  is_featured:
    lineage:
      - datalake_superset_raw.tables.is_featured
    description: Deprecated Superset flag formerly used to highlight datasets on the homepage (no longer active).
  cache_timeout:
    lineage:
      - datalake_superset_raw.tables.cache_timeout
    description: Dataset-level cache duration in seconds before Superset re-executes underlying queries.
  default_endpoint:
    lineage:
      - datalake_superset_raw.tables.default_endpoint
    description: Default Superset UI route opened when navigating directly to this dataset.
  schema:
    lineage:
      - datalake_superset_raw.tables.schema
    description: Database schema name where the physical table or view backing the dataset resides.
  sql_code:
    lineage:
      - datalake_superset_raw.tables.sql
    description: SQL statement defining a virtual dataset when the datasource is a custom query rather than a physical table.
  params:
    lineage:
      - datalake_superset_raw.tables.params
    description: JSON parameters for dataset-level configuration such as remote cache or certification metadata.
  perm:
    lineage:
      - datalake_superset_raw.tables.perm
    description: Permission string encoding the fully qualified dataset path used for Superset access control.
  filter_select_enabled:
    lineage:
      - datalake_superset_raw.tables.filter_select_enabled
    description: Boolean flag indicating whether ad-hoc filter dropdowns are enabled for this dataset in Explore.
  fetch_values_predicate:
    lineage:
      - datalake_superset_raw.tables.fetch_values_predicate
    description: SQL predicate appended when Superset loads distinct values for filter dropdowns on this dataset.
  is_sqllab_view:
    lineage:
      - datalake_superset_raw.tables.is_sqllab_view
    description: Boolean flag indicating whether the dataset was created as a saved SQL Lab view.
  template_params:
    lineage:
      - datalake_superset_raw.tables.template_params
    description: Jinja template parameters available for dynamic SQL substitution in virtual datasets.
  schema_perm:
    lineage:
      - datalake_superset_raw.tables.schema_perm
    description: Permission string for the database schema associated with this dataset.
  extra:
    lineage:
      - datalake_superset_raw.tables.extra
    description: JSON blob with supplemental dataset metadata such as certification tags or engine hints.
  uuid:
    lineage:
      - datalake_superset_raw.tables.uuid
    description: Globally unique identifier assigned to the dataset for API references and external integrations.
  is_managed_externally:
    lineage:
      - datalake_superset_raw.tables.is_managed_externally
    description: Boolean flag indicating whether dataset definitions are owned and updated by an external system.
  external_url:
    lineage:
      - datalake_superset_raw.tables.external_url
    description: URL pointing to the authoritative dataset definition when managed outside Superset.
  normalize_columns:
    lineage:
      - datalake_superset_raw.tables.normalize_columns
    description: Boolean flag indicating whether Superset normalizes column names to lowercase on ingest.
  ts_created:
    lineage:
      - datalake_superset_raw.tables.created_on
    description: Timestamp when the dataset record was first created in Superset (UTC).
  ts_changed:
    lineage:
      - datalake_superset_raw.tables.changed_on
    description: Timestamp when the dataset configuration was last updated in Superset (UTC).
  year:
    lineage:
      - datalake_superset_raw.tables.year
    description: Year of the data load date, used for Hive partitioning — include in filters for partition pruning.
  month:
    lineage:
      - datalake_superset_raw.tables.month
    description: Month of the data load date, used for Hive partitioning — include in filters for partition pruning.
  day:
    lineage:
      - datalake_superset_raw.tables.day
    description: Day of the data load date, used for Hive partitioning — include in filters for partition pruning.
