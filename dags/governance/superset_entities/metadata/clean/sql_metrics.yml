---
database_name: datalake_superset_clean
table_name: sql_metrics
owner: vitor.carneiro@quintoandar.com.br
domain: Data Ops & Governance
description: >
  Clean-layer snapshot of Apache Superset dataset metric definitions replicated from the Superset
  PostgreSQL sql_metrics table via CDC (superset_entities, daily 00:00 UTC). Grain is one row per
  metric per load date. Partitioned by year, month, day — filter on ingestion date. Supports
  governance analytics on metric inventory, aggregation expressions, and dataset-level KPI coverage.
columns:
  id:
    lineage:
      - datalake_superset_raw.sql_metrics.id
    description: Primary key from Superset sql_metrics identifying a distinct dataset metric record.
  id_table:
    lineage:
      - datalake_superset_raw.sql_metrics.table_id
    description: Foreign key to tables.id for the Superset dataset that owns this metric definition.
  id_user_created:
    lineage:
      - datalake_superset_raw.sql_metrics.created_by_fk
    description: Foreign key to ab_user.id for the Superset account that originally created the metric.
  id_user_changed:
    lineage:
      - datalake_superset_raw.sql_metrics.changed_by_fk
    description: Foreign key to ab_user.id for the account that last modified the metric definition.
  metric_name:
    lineage:
      - datalake_superset_raw.sql_metrics.metric_name
    description: Internal metric identifier referenced in Superset chart configurations and SQL expressions.
  verbose_name:
    lineage:
      - datalake_superset_raw.sql_metrics.verbose_name
    description: Human-readable label displayed for the metric in Superset Explore and chart tooltips.
  metric_type:
    lineage:
      - datalake_superset_raw.sql_metrics.metric_type
    description: Superset metric classification (for example count, sum, or custom) governing default behavior.
  expression:
    lineage:
      - datalake_superset_raw.sql_metrics.expression
    description: SQL or Superset expression that computes the metric value from underlying dataset columns.
  description:
    lineage:
      - datalake_superset_raw.sql_metrics.description
    description: Free-text business definition explaining what the metric measures and how it should be interpreted.
  d3format:
    lineage:
      - datalake_superset_raw.sql_metrics.d3format
    description: D3 number format string controlling how metric values render in charts (for example ,.2f or $,.0f).
  warning_text:
    lineage:
      - datalake_superset_raw.sql_metrics.warning_text
    description: User-facing caution message displayed alongside the metric when data quality or usage caveats apply.
  extra:
    lineage:
      - datalake_superset_raw.sql_metrics.extra
    description: JSON blob with supplemental metric metadata such as certification tags or engine-specific hints.
  uuid:
    lineage:
      - datalake_superset_raw.sql_metrics.uuid
    description: Globally unique identifier assigned to the metric for API references and external integrations.
  currency:
    lineage:
      - datalake_superset_raw.sql_metrics.is_currency
    description: Boolean flag indicating whether the metric represents a monetary value requiring currency formatting.
  ts_created:
    lineage:
      - datalake_superset_raw.sql_metrics.created_on
    description: Timestamp when the metric record was first created in Superset (UTC).
  ts_changed:
    lineage:
      - datalake_superset_raw.sql_metrics.changed_on
    description: Timestamp when the metric definition was last updated in Superset (UTC).
  year:
    lineage:
      - datalake_superset_raw.sql_metrics.year
    description: Year of the data load date, used for Hive partitioning — include in filters for partition pruning.
  month:
    lineage:
      - datalake_superset_raw.sql_metrics.month
    description: Month of the data load date, used for Hive partitioning — include in filters for partition pruning.
  day:
    lineage:
      - datalake_superset_raw.sql_metrics.day
    description: Day of the data load date, used for Hive partitioning — include in filters for partition pruning.
