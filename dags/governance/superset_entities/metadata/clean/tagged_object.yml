---
database_name: datalake_superset_clean
table_name: tagged_object
owner: vitor.carneiro@quintoandar.com.br
domain: Data Ops & Governance
description: >
  Clean-layer snapshot of Apache Superset tag-to-object associations replicated from the Superset
  PostgreSQL tagged_object table via CDC (superset_entities, daily 00:00 UTC). Grain is one row per
  tag assignment per load date. Partitioned by year, month, day — filter on ingestion date. Supports
  governance analytics on content labeling coverage; the tagging feature has limited adoption at QuintoAndar.
columns:
  id:
    lineage:
      - datalake_superset_raw.tagged_object.id
    description: Primary key from Superset tagged_object identifying a distinct tag-to-object link record.
  id_tag:
    lineage:
      - datalake_superset_raw.tagged_object.tag_id
    description: Foreign key to tag.id for the label applied to the Superset content object.
  id_object:
    lineage:
      - datalake_superset_raw.tagged_object.object_id
    description: Primary key of the tagged Superset entity (dashboard, chart, or dataset) within its object type.
  id_user_created:
    lineage:
      - datalake_superset_raw.tagged_object.created_by_fk
    description: Foreign key to ab_user.id for the Superset account that applied the tag to the object.
  id_user_changed:
    lineage:
      - datalake_superset_raw.tagged_object.changed_by_fk
    description: Foreign key to ab_user.id for the account that last modified the tag assignment.
  object_type:
    lineage:
      - datalake_superset_raw.tagged_object.object_type
    description: Superset entity class being tagged (for example dashboard, chart, or dataset).
  ts_created:
    lineage:
      - datalake_superset_raw.tagged_object.created_on
    description: Timestamp when the tag assignment was first created in Superset (UTC).
  ts_changed:
    lineage:
      - datalake_superset_raw.tagged_object.changed_on
    description: Timestamp when the tag assignment was last updated in Superset (UTC).
  year:
    lineage:
      - datalake_superset_raw.tagged_object.year
    description: Year of the data load date, used for Hive partitioning — include in filters for partition pruning.
  month:
    lineage:
      - datalake_superset_raw.tagged_object.month
    description: Month of the data load date, used for Hive partitioning — include in filters for partition pruning.
  day:
    lineage:
      - datalake_superset_raw.tagged_object.day
    description: Day of the data load date, used for Hive partitioning — include in filters for partition pruning.
