---
database_name: datalake_superset_clean
table_name: table_columns
owner: vitor.carneiro@quintoandar.com.br
domain: Data Ops & Governance
description: >
  Clean-layer snapshot of Apache Superset dataset column definitions replicated from the Superset
  PostgreSQL table_columns table via CDC (superset_entities, daily 00:00 UTC). Grain is one row per
  column per load date. Partitioned by year, month, day — filter on ingestion date. Supports
  governance analytics on dataset schema coverage, column types, and Explore filter configuration.
columns:
  id:
    lineage:
      - datalake_superset_raw.table_columns.id
    description: Primary key from Superset table_columns identifying a distinct dataset column record.
  id_table:
    lineage:
      - datalake_superset_raw.table_columns.table_id
    description: Foreign key to tables.id for the Superset dataset that contains this column definition.
  id_user_created:
    lineage:
      - datalake_superset_raw.table_columns.created_by_fk
    description: Foreign key to ab_user.id for the Superset account that originally registered the column.
  id_user_changed:
    lineage:
      - datalake_superset_raw.table_columns.changed_by_fk
    description: Foreign key to ab_user.id for the account that last modified the column metadata.
  column_name:
    lineage:
      - datalake_superset_raw.table_columns.column_name
    description: Physical or logical column name as exposed to Superset charts and SQL on the dataset.
  type:
    lineage:
      - datalake_superset_raw.table_columns.type
    description: Superset data type assigned to the column (for example VARCHAR, BIGINT, or DATETIME).
  groupby:
    lineage:
      - datalake_superset_raw.table_columns.groupby
    description: Boolean flag indicating whether the column is available as a dimension for grouping in Explore.
  filterable:
    lineage:
      - datalake_superset_raw.table_columns.filterable
    description: Boolean flag indicating whether the column can be used as a filter control in Superset Explore.
  description:
    lineage:
      - datalake_superset_raw.table_columns.description
    description: Free-text business description of the column meaning, grain, and valid value ranges.
  expression:
    lineage:
      - datalake_superset_raw.table_columns.expression
    description: SQL expression defining a calculated column when the field is derived rather than physical.
  verbose_name:
    lineage:
      - datalake_superset_raw.table_columns.verbose_name
    description: Human-readable label displayed for the column in Superset chart builders and tooltips.
  python_date_format:
    lineage:
      - datalake_superset_raw.table_columns.python_date_format
    description: Python strftime pattern Superset uses to parse and format datetime values for this column.
  uuid:
    lineage:
      - datalake_superset_raw.table_columns.uuid
    description: Globally unique identifier assigned to the column for API references and external integrations.
  extra:
    lineage:
      - datalake_superset_raw.table_columns.extra
    description: JSON blob with supplemental column metadata such as certification tags or engine hints.
  advanced_data_type:
    lineage:
      - datalake_superset_raw.table_columns.advanced_type
    description: Extended Superset data type classification for specialized rendering or validation rules.
  is_dttm:
    lineage:
      - datalake_superset_raw.table_columns.is_dttm
    description: Boolean flag indicating whether Superset treats this column as a datetime dimension.
  is_active:
    lineage:
      - datalake_superset_raw.table_columns.is_active
    description: Boolean flag indicating whether the column is enabled and visible in Superset Explore.
  ts_created:
    lineage:
      - datalake_superset_raw.table_columns.created_ons
    description: Timestamp when the column record was first created in Superset (UTC).
  ts_changed:
    lineage:
      - datalake_superset_raw.table_columns.changed_on
    description: Timestamp when the column metadata was last updated in Superset (UTC).
  year:
    lineage:
      - datalake_superset_raw.table_columns.year
    description: Year of the data load date, used for Hive partitioning — include in filters for partition pruning.
  month:
    lineage:
      - datalake_superset_raw.table_columns.month
    description: Month of the data load date, used for Hive partitioning — include in filters for partition pruning.
  day:
    lineage:
      - datalake_superset_raw.table_columns.day
    description: Day of the data load date, used for Hive partitioning — include in filters for partition pruning.
