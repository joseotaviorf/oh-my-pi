---
table_name: datalake_tars.datahub_lookup_quality
alert_channel: "#alerts-de-airflow-dags"
is_incremental:
  incremental_date_column: dt_lookup
  incremental_date_mask: yyyy-MM-dd

table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Warning

column_level_validations:
  id_lookup:
    is_complete:
      severity_level: Error
  id_session:
    is_complete:
      severity_level: Error
  year:
    is_complete:
      severity_level: Error
  month:
    is_complete:
      severity_level: Error
  day:
    is_complete:
      severity_level: Error
