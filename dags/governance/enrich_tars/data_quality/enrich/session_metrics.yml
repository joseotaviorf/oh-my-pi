---
table_name: datalake_tars.session_metrics
alert_channel: "#alerts-de-airflow-dags"
is_incremental:
  incremental_date_column: dt_session
  incremental_date_mask: yyyy-MM-dd

table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: -30
    less_than_or_equal_to: 50
    severity_level: Warning

column_level_validations:
  id_session:
    is_complete:
      severity_level: Error
    is_unique:
      severity_level: Error
  query_count:
    has_min_value:
      greater_than_or_equal_to: 1
      severity_level: Error
  user:
    is_complete:
      severity_level: Error
  year:
    is_complete:
      severity_level: Error
  month:
    is_complete:
      severity_level: Error
  day:
    is_complete:
      severity_level: Error
