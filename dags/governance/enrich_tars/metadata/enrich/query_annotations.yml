---
database_name: datalake_tars
table_name: query_annotations
owner: aurelio.nogueira@quintoandar.com.br
domain: Data Ops & Governance
description: >
  Query-grain annotation table for Tars (the AI data analyst). Each row is one
  trino_query Vector event from datalake_tars_clean.vector_logs, enriched with
  Trino user and query_id recovered via a best-effort join to
  data_platform_metrics.trino_query_complete on session_id + ordinal within the day
  (60s–10min tolerance). Covers session identity, intent category, DataHub context
  depth, and execution outcome. Partitioned daily; Vector sink started 2026-08-12.
columns:
  id_query:
    lineage:
      - data_platform_metrics.trino_query_complete.query_id
      - datalake_tars_clean.vector_logs.id_session
    description: >
      Trino query identifier when the join succeeds; otherwise a synthetic
      vector-{session}-{rank} id so the grain stays one Vector trino_query event.
  id_session:
    lineage:
      - datalake_tars_clean.vector_logs.id_session
    description: Tars conversation session identifier from the Vector event.
  is_synthetic_session:
    lineage:
      - datalake_tars_clean.vector_logs.id_session
    description: True when the session id uses the no-session-* synthetic prefix.
  session_source:
    lineage:
      - datalake_tars_clean.vector_logs.session_source
    description: Client that triggered the Tars session (e.g. claude, cursor, unknown).
  user:
    lineage:
      - data_platform_metrics.trino_query_complete.user
    description: QuintoAndar email recovered from Trino telemetry for the session (unknown if unmatched).
  user_question:
    lineage:
      - datalake_tars_clean.vector_logs.user_question
    description: Original natural-language question from the Vector trino_query payload.
  response_category:
    lineage:
      - datalake_tars_clean.vector_logs.response_category
    description: Tars response category (data_query, debug, data_catalog, unknown).
  business_domain:
    lineage:
      - datalake_tars_clean.vector_logs.business_domain
    description: Raw business domain as classified by Tars (free text; may contain aliases).
  business_domain_normalized:
    lineage:
      - datalake_tars_clean.vector_logs.business_domain
    description: Canonical business domain mapped for dashboard grouping (For Rent, Fintech, Growth, etc.).
  query_state:
    lineage:
      - data_platform_metrics.trino_query_complete.query_state
      - datalake_tars_clean.vector_logs.status
    description: Trino query execution state when joined; otherwise FINISHED/FAILED from Vector status.
  error_name:
    lineage:
      - data_platform_metrics.trino_query_complete.error_name
      - datalake_tars_clean.vector_logs.error_class
    description: Trino error name or Vector error_class when the query failed.
  is_success:
    lineage:
      - datalake_tars_clean.vector_logs.status
      - data_platform_metrics.trino_query_complete.query_state
    description: True when Vector status is success or Trino query_state is FINISHED.
  execution_time_sec:
    lineage:
      - data_platform_metrics.trino_query_complete.execution_time
      - datalake_tars_clean.vector_logs.duration_ms
    description: Query wall-clock time in seconds (Trino execution_time preferred, else duration_ms/1000).
  row_count:
    lineage:
      - datalake_tars_clean.vector_logs.row_count
    description: Number of rows returned by the trino_query event, when reported by the Vector client. Null if unknown.
  response_bytes:
    lineage:
      - datalake_tars_clean.vector_logs.response_bytes
    description: Response payload size in bytes for the Trino tool call, when reported by the Vector client.
  has_tars_comment:
    lineage:
      - datalake_tars_clean.vector_logs.event_type
    description: Always true for Vector-sourced rows (kept for schema compatibility with older consumers).
  urn_count:
    lineage:
      - datalake_tars_clean.vector_logs.datahub_urns
    description: Total number of DataHub URNs on the Vector event.
  data_product_count:
    lineage:
      - datalake_tars_clean.vector_logs.datahub_urns
    description: Number of DataHub Data Product URNs on the event.
  dataset_count:
    lineage:
      - datalake_tars_clean.vector_logs.datahub_urns
    description: Number of DataHub Dataset URNs on the event.
  context_mode:
    lineage:
      - datalake_tars_clean.vector_logs.datahub_urns
    description: >
      Depth of DataHub context used. no_datahub = no URNs; dataset_only = at least one dataset URN
      but no Data Product; with_data_product = at least one Data Product URN.
  depth_tier:
    lineage:
      - datalake_tars_clean.vector_logs.datahub_urns
    description: Tiered context depth (L0=none, L1=datasets only, L2=1 product, L3=2 products, L4=3+ products).
  datahub_urns:
    lineage:
      - datalake_tars_clean.vector_logs.datahub_urns
    description: Array of DataHub URNs attributed to this query (exploded by datahub_asset_usage).
  ts_started:
    lineage:
      - datalake_tars_clean.vector_logs.ts_event
      - data_platform_metrics.trino_query_complete.execution_start_time
    description: Timestamp when the query started (Trino preferred, else Vector ts_event).
  ts_ended:
    lineage:
      - datalake_tars_clean.vector_logs.ts_event
      - data_platform_metrics.trino_query_complete.end_time
    description: Timestamp when the query ended (Trino preferred, else Vector ts_event).
  year:
    lineage:
      - datalake_tars_clean.vector_logs.year
    description: Partition year of the Vector event UTC date.
  month:
    lineage:
      - datalake_tars_clean.vector_logs.month
    description: Partition month of the Vector event UTC date.
  day:
    lineage:
      - datalake_tars_clean.vector_logs.day
    description: Partition day of the Vector event UTC date.
