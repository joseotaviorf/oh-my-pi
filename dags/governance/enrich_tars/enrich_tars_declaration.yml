dag:
  name: enrich_tars
  schedule_start_date: 2026, 6, 18
  schedule_interval: 0 6 * * *
  owner: Data Governance
  documentation:
    dag_purpose: |
      Parses Tars (the AI data analyst) usage from Vector conversation logs in
      datalake_tars_clean.vector_logs (hybrid join to trino_query_complete for user /
      query_id), materialising query-grain annotations, turn latency/quality (plus a
      turn_activity table consolidating both into one Superset-friendly row per
      turn), session-grain metrics (incl. client surface/language), DataHub asset
      usage, a product-topic coverage map, DataHub catalog lookup/tool-call
      reliability, raw-table schema verification detail, own-instrumentation health
      (protocol gaps and turn_end failure outcomes), and user-submitted feedback
      (open text + 1-5 Likert score). Powers the TARS: Usage and Context Coverage
      Superset dashboard.
workflow:
  observability:
    enabled: true
  type: query_delta
  layer: enrich
  default_extraction_type: incremental
  default_partitions: [year, month, day]
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  inner_dependencies:
    session_metrics:
    - query_annotations
    - turn_metrics
    - turn_quality
    turn_activity:
    - turn_metrics
    - turn_quality
    datahub_asset_usage:
    - query_annotations
    product_topic_coverage:
    - datahub_asset_usage
    - datahub_product_glossary
  tables_customization:
    datahub_product_glossary:
      extraction_type: full
      partitions: []
