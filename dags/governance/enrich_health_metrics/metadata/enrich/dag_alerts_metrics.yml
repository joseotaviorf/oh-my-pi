database_name: datalake_health_metrics
table_name: dag_alerts_metrics
owner: wesley.doliveira@quintoandar.com.br
domain: Data Governance
description: WIP
columns:
  dag_name:
    description: DAG's name.
    lineage:
      - datalake_airflow.dag.dag_name
  dag_owner:
    description: DAG's owner.
    lineage:
      - datalake_airflow.dag.owners
  dag_layer:
    description: WIP
    lineage:
      - datalake_dag_inventory_clean.table
  dt_executed:
    description: Execution date.
    lineage:
      - datalake_quintoandar.aux_date.date
  qt_failed_airflow_tasks:
    description: Quantity of failed Airflow tasks during DAG's execution.
    lineage:
      - datalake_airflow.task_fail.dag_name
      - datalake_airflow.task_fail.ts_executed
  qt_opsgenie_alerts:
    description: Quantity of OpsGenie alerts during DAG's execution.
    lineage:
      - datalake_opsgenie_clean.alerts.dag_name
      - datalake_opsgenie_clean.alerts.ts_created
  qt_opsgenie_on_call_alerts:
    description: Quantity of OpsGenie alerts during on-call DAG's execution.
    lineage:
      - datalake_opsgenie_clean.alerts.dag_name
      - datalake_opsgenie_clean.alerts.ts_created
  qt_cluster_cpu_alerts:
    description: Quantity of CPU usage Databricks cluster alerts during DAG's execution.
    lineage:
      - datalake_alert_manager_clean.alerts_databricks_cluster.dag_name
      - datalake_alert_manager_clean.alerts_databricks_cluster.alert_name
  qt_cluster_memory_swap_alerts:
    description: Quantity of memory SWAP usage Databricks cluster alerts during DAG's execution.
    lineage:
      - datalake_alert_manager_clean.alerts_databricks_cluster.dag_name
      - datalake_alert_manager_clean.alerts_databricks_cluster.alert_name
  qt_dei_incidents:
    description: Quantity of DEI incidents associated with DAG.
    lineage:
      - datalake_jira.issues.dag_name
      - datalake_jira.issues.ts_created
  qt_failed_data_quality_tests:
    description: Quantity of Data Quality tests failed.
    lineage:
      - datalake_inmetro_clean.data_validations.database
      - datalake_inmetro_clean.data_validations.table
      - datalake_dag_inventory_clean.table.suite_result
