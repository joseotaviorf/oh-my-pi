database_name: datalake_health_metrics
table_name: dag_historical_executions
owner: wesley.doliveira@quintoandar.com.br
domain: Data Governance
description: This table contains the historical of each DAG execution.
columns:
  dag_name:
    description: Unique name identifier of the executed DAG.
    lineage:
      - datalake_airflow.log.id_dag
  dag_owner:
    description: Name of the owner or team responsible for the DAG.
    lineage:
      - datalake_airflow.dag.owners
  dag_layer:
    description: Processing layer of the DAG.
    lineage:
      - datalake_dag_inventory_clean.table
  dt_executed:
    description: Date on which the DAG was executed.
    lineage:
      - datalake_airflow.log.ts_executed
  ts_dag_started:
    description: Timestamp marking the start of the DAG execution.
    lineage:
      - datalake_airflow.log.ts_event
  ts_dag_ended:
    description: Timestamp marking the end of the DAG execution.
    lineage:
      - datalake_airflow.log.ts_event
  duration_in_minutes:
    description: Total duration of the DAG execution in minutes.
    lineage:
      - datalake_airflow.log.ts_event
