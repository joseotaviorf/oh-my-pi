---
dag:
  name: enrich_health_metrics
  schedule_start_date: 2019, 1, 1
  schedule_interval: 0 12 * * *
  owner: Data Governance
  documentation:
    dag_purpose: The enrich purpose is to concatenate information about DAG's health.
workflow:
  type: query
  layer: enrich
  inner_dependencies:
    daily_sla_metrics:
      - dag_historical_executions
    top_reference_sla_days:
      - daily_sla_metrics
    dag_execution_metrics:
      - dag_historical_executions
      - top_reference_sla_days
    table_historical_executions:
      - dag_historical_executions
    table_execution_metrics:
      - table_historical_executions
      - top_reference_sla_days
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: m5a.xlarge
    node_type_id: m5a.2xlarge
    autoscale:
      min_workers: 1
      max_workers: 3
    spark_version: 12.2.x-scala2.12
