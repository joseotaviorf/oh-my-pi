dag:
  name: enrich_rental_management
  schedule_start_date: 2020, 7, 1
  owner: Data ForRent
  documentation:
    dag_purpose: |
      This DAG is responsible for the creation of AUD tables using CDC.
      Also it's responsible for the enriched tables related for the rental_management.
workflow:
  type: query_delta
  layer: enrich
  default_extraction_type: incremental
  default_partitions: [year, month, day]
  tables_customization:
    condo_monitoring_actions_aud: {}
    condo_monitoring_eligibility_aud: {}
    invoice_aud: {}
cluster:
  type: databricks_13_3_med_general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
