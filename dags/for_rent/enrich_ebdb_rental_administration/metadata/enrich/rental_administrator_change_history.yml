---
database_name: datalake_ebdb_rental_administration
table_name: rental_administrator_change_history
description: Information about administrator changes. Each line brings the rental
  administrator of a house and the start and end date of the administration.
domain: For Rent
owner: gustavo.brunelli@quintoandar.com.br
columns:
  id_house:
    lineage:
    - datalake_ebdb_clean.rental_administrator_change_request_aud.id_house
    description: Property identifier from EBDB linking the administrator change to the affected listing.
  country_code:
    lineage:
    - datalake_ebdb_country.house.country_code
    description: Country code of the house
  previous_rental_administrator:
    lineage:
    - datalake_ebdb_clean.rental_administrator_change_request_aud.old_rental_administrator
    description: Rental administrator responsible before the recorded change.
  rental_administrator:
    lineage:
    - datalake_ebdb_clean.rental_administrator_change_request_aud.new_rental_administrator
    description: Current rental administrator responsible for the property.
    categories:
      OWNER: Owner is the rental administrator, which means that the listing is brokerage-only
      QUINTOANDAR: Default rental administrator, which is QuintoAndar
  ts_started:
    lineage:
    - datalake_ebdb_clean.rental_administrator_change_request_aud.ts_created
    description: Start timestamp of the administration
  ts_ended:
    lineage:
    - datalake_ebdb_clean.rental_administrator_change_request_aud.ts_created
    description: End timestamp of the administration
  id_rental_administrator_change_request:
    description: EBDB request identifier for the workflow that transferred rental administration responsibility.
