dag:
  name: enrich_ebdb_pricing
  owner: Data ForRent
  schedule_start_date: 2020, 8, 29
  documentation:
    dag_purpose: |
      The purpose of this DAG is to allocate the tables related to house rental prices on the platform.
workflow:
  type: query_delta
  layer: enrich
  tables_customization:
    listing_price_change:
      merge_on: [ 'id_house', 'id_house_listing', 'id_revision', 'business_context' ]
    listing_prediction_changes:
      merge_on: [ 'id_house', 'id_house_listing', 'id_revision', 'business_context' ]
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: r5d.2xlarge
    node_type_id: r5d.xlarge
    num_workers: 2
    runtime_engine: PHOTON
    spark_version: 13.3.x-scala2.12
