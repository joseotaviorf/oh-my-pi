database_name: datalake_ebdb_country
table_name: house
description: Information related to the counrty of origin of a house.
domain: For Rent
owner: gustavo.silva@quintoandar.com.br
columns:
  id_house:
    lineage:
    - datalake_ebdb_clean.house.id
    description: Primary key of the property in EBDB, used to join country and regional attributes.
  id_country:
    lineage:
    - datalake_ebdb_clean.country.id
    description: Foreign key to the country dimension for geographic reporting.
  id_state:
    lineage:
    - datalake_ebdb_clean.house.id_state
    description: Foreign key to the Brazilian state where the property is registered in EBDB.
  id_region:
    lineage:
    - datalake_ebdb_clean.house.id_region
    description: Foreign key to the QuintoAndar operations region that groups the property.
  country_code:
    lineage:
    - datalake_ebdb_clean.country.code
    description: ISO country code for geographic filtering of the analytical metric.
  ts_created:
    lineage:
    - datalake_ebdb_clean.house.dt_creation
    description: Timestamp of when the house was created.
  ts_updated:
    lineage:
    - datalake_ebdb_clean.house.ts_updated
    description: Timestamp of when the house suffered an update.
