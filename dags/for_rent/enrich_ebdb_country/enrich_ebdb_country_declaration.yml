dag:
    name: enrich_ebdb_country
    schedule_start_date: 2020, 7, 1
    owner: Data International
    documentation: 
        dag_purpose: |
            Creates enriched tables in order to relate different entities to the country of origin, where the source is the EBDB. 
            Every table is partitioned by the `country_code`, some may have extra partitions.
workflow:
    type: query
    layer: enrich
    tables_customization:
        house:
          partitions: [country_code]
        user:
          partitions: [country_code]
cluster:
    type: custom_cluster
    custom_configurations:
        driver_node_type_id: m5a.xlarge
        node_type_id: m5a.xlarge
        num_workers: 2
        spark_version: 12.2.x-scala2.12
