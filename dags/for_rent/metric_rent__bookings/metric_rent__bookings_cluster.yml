cluster:
  type: consolidation_m_general_cluster
  databricks_conn_id: databricks_new
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: USER_ISOLATION
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
    num_workers: 3
    aws_attributes:
      ebs_volume_size: 200
validation:
  cluster:
    type: consolidation_s_memory_cluster
    databricks_conn_id: databricks_new
    access_control_list:
      group_name: analytics-engineers
      permission_level: CAN_MANAGE
    custom_configurations:
      aws_attributes:
        ebs_volume_size: 200
      data_security_mode: USER_ISOLATION
      num_workers: 3
      node_type_id: r7g.xlarge
      driver_node_type_id: m7g.2xlarge
