---
database_name: metric_rent
table_name: bookers_daily_by_sk_region
description: Daily table that contains the amount of bookers (sk_client) that scheduled a booking segmented by sk_region.
domain: For Rent
owner: gustavo.brunelli@quintoandar.com.br
columns:
  booking_created_date:
    lineage:
      - dw_public.dim_date.date
    description: Date when users scheduled a booking.
    dimension: True
  sk_region:
    lineage:
      - dw_rent.fact_listing_rent_flows.sk_region
    description: Surrogate key of the region used to segment this rental metric.
    dimension: True
  country_code:
    lineage:
      - dw_rent.fact_listing_rent_flows.country_code
    description: ISO country code for geographic filtering of the analytical metric.
    dimension: True
  bookers:
    description: Amount of users that scheduled a booking on a day segmented by region.
    metric:
      name: TP Bookers Daily by SK Region
      description: 
        Amount of users that scheduled a booking on a day segmented by sk_region.
        This amount is calculated by the count distinct of sk_client from fact_listing_rent_flows,
        segmented by country_code and sk_region.
        Also, there is a filter removing the sk_booking_created_date < -1.
      acronym: TP Bookers
      is_additive: False
      business_stage: Demand
      hierarchy: User analisys
      approved_by: augusto.torres@quintoandar.com.br
      link_to_metric: ""
