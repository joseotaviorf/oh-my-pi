---
database_name: metric_rent
table_name: bookers_weekly
description: Weekly table that contains the amount of bookers (sk_client) that scheduled a booking.
domain: For Rent
owner: gustavo.brunelli@quintoandar.com.br
columns:
  week:
    lineage:
      - dw_public.dim_date.date
    description: Week date when users scheduled a booking.
    dimension: True
  country_code:
    lineage:
      - dw_rent.fact_listing_rent_flows.country_code
    description: ISO country code for geographic filtering of the analytical metric.
    dimension: True
  bookers:
    description: Amount of users that scheduled a booking on a week.
    metric:
      name: TP Bookers Weekly
      description: Amount of users that scheduled a booking on a week.
        This amount is calculated by the count distinct of sk_client from fact_listing_rent_flows,
        segmented by country_code.
        Also, there is a filter removing the sk_booking_created_date < -1.
      acronym: TP Bookers
      is_additive: False
      business_stage: Demand
      hierarchy: User analisys
      approved_by: augusto.torres@quintoandar.com.br
      link_to_metric: https://quintoandar.sa.looker.com/looks/4760
