database_name: metric_rent
table_name: ppmulti_new_first_listings_weekly
description:
  Table to count new first listings of PPs Multi (owners with 5 or more ongoing properties on the date) on a weekly basis. Here, we use the
  event milestone registered on the table fact_house_listing_flows - sk_first_listing_date.
domain: For Rent
owner: mariana.kralco@quintoandar.com.br
columns:
  week:
    lineage:
      - dw_public.dim_date.date
    description: Week when the listing started.
    dimension: True
  country_code:
    lineage:
      - dw_rent.dim_contract.country_code
    description: Country code of the house.
    dimension: True
  new_first_listings:
    description: Weekly amount of new first listings of PPs Multi (owners with 5 or more ongoing properties on the date).
    metric:
      name: PP Multi New First Listing Weekly
      description: Weekly accumulated sum of the listings of PPs Multi (owners with 5 or more ongoing properties on the date) with category First Listings (version 1)
      acronym: NFL
      is_additive: True
      business_stage: Supply
      hierarchy: operations mgmt
      approved_by: mariana.kralco@quintoandar.com.br
      link_to_metric: "https://metabase.quintoandar.com.br/question/99396"
