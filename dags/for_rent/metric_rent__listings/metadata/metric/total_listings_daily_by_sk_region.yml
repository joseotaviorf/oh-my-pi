---
database_name: metric_rent
table_name: total_listings_daily_by_sk_region
description: Daily table that has the amount of listings that were published on each day segmented by the sk_region of the listings.
domain: For Rent
owner: gustavo.alencar@quintoandar.com.br
columns:
  day:
    lineage:
      - dw_rent.dim_house_listing.ts_publication
    description: Date when the listing version was published.
    dimension: True
  sk_region:
    lineage:
      - dw_public.dim_region.sk_region
    description: Unique key (sk) of the house's region.
    dimension: True
  country_code:
    lineage:
      - dw_public.dim_region.country_code
    description: Country code of the house.
    dimension: True
  total_listings:
    description: Count of unique listings that where published on the referenced date.
    metric:
      name: Total Listings Daily
      description:
        Count of unique listings (sk_house_listing from dim_house_listing) that where published on the referenced date, segmented by the sk_region of the listings.
        Attention to listings without city group and/or city name, they must be removed from the result.
        Also, there is a filter removing the listings that does not contain the ts_publication value.
      acronym: TL
      is_additive: True
      business_stage: Demand
      hierarchy: User analysis
      approved_by: fernanda.fernandes@quintoandar.com.br
      link_to_metric: "https://docs.google.com/spreadsheets/d/1QjOGPW8lyTWV2BXxZTGUHPY8XCOcas14QTWi39-RElY/edit#gid=271103810"
