dag:
  name: godfather
  schedule_start_date: 2019, 10, 1
  schedule_interval: 0 0 * * *
  owner: Data ForRent
workflow:
  type: database_pull
  layer: raw
  database_type: postgres
  dbutils_secret_key: ENV_GODFATHER
  lineage_product_database_name: godfather
  tables_customization:
    offer:
      db_schema: business
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: i3.2xlarge
    node_type_id: m5a.4xlarge
    num_workers: 2
    spark_version: 13.3.x-scala2.12
