cluster:
  type: consolidation_l_memory_cluster
  databricks_conn_id: databricks_new_env
  custom_configurations:
    autotermination_minutes: 20
    driver_node_type_id: r7g.xlarge
    num_workers: 3
    aws_attributes:
      first_on_demand: 1
      spot_bid_price_percent: 100
      zone_id: us-east-1d
      ebs_volume_size: 200
      availability: SPOT_WITH_FALLBACK
    spark_version: 16.4.x-scala2.12
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
validation:
  cluster:
    type: emr_7_12_consolidation_l_memory_cluster
    custom_configurations:
      core_nodes:
        instance_count: 1
      task_nodes:
        instance_count: 2
      master_node_type_id: r7g.xlarge
      spark_conf:
        spark.driver.memory: 3g
        spark.driver.memoryOverhead: 512m
        spark.yarn.am.memory: 1g
      aws_attributes:
        ebs_volume_size: 200
