dag:
  name: dw_rent_demand_events_snapshot
  schedule_start_date: 2014,06,17
  owner: Data ForRent
workflow:
  type: query_delta
  layer: dw
  custom_schema: rent_snapshot
  default_extraction_type: incremental
  default_partitions: ["country_code", "year", "month", "day"]
  has_load_to_redshift_task: false
  inner_dependencies:
    coincident_events_volume_changes_snapshot:
      - rent_demand_events_snapshot
  tables_customization:
    coincident_events_volume_changes_snapshot:
      extra_query_template_params:
        "MAKE_DATE(year, month, day)": "DATE_ADD(DATE('{year}-{month}-{day}'), 1)"
    rent_cohort_conversions_snapshot:
      extra_query_template_params:
        "DATE(ts_snapshot)": "DATE_ADD(DATE('{year}-{month}-{day}'), 1)"
    rent_demand_events_snapshot:
      extra_query_template_params:
        "DATE(ts_snapshot)": "DATE_ADD(DATE('{year}-{month}-{day}'), 1)"
cluster:
  type: custom_cluster
  custom_configurations:
    autotermination_minutes: 20
    driver_node_type_id: r5d.2xlarge
    node_type_id: r5d.4xlarge
    num_workers: 3
    aws_attributes:
        first_on_demand: 1
        spot_bid_price_percent: 100
        zone_id: us-east-1d
        ebs_volume_size: 200
        availability: SPOT_WITH_FALLBACK
    spark_version: 12.2.x-scala2.12
