dag:
  name: dw_rent_demand_events_snapshot
  schedule_start_date: 2014,06,17
  owner: Data ForRent
workflow:
  type: query
  layer: dw
  custom_schema: rent_snapshot
  default_partitions: ["country_code", "year", "month", "day"]
  default_extraction_type: incremental
  has_load_to_redshift_task: false
  inner_dependencies:
    coincident_events_time_variations:
      - rent_demand_events_snapshot
cluster:
  type: databricks_10_4_med_general_cluster
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE
