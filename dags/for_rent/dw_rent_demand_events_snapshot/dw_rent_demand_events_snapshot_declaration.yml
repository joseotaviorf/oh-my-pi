dag:
  name: dw_rent_demand_events_snapshot
  schedule_start_date: 2014,06,17
  owner: Data ForRent
workflow:
  type: query
  layer: dw
  custom_schema: rent_snapshot
  default_extraction_type: incremental
  default_partitions: ["country_code", "year", "month", "day"]
  has_load_to_redshift_task: false
  inner_dependencies:
    coincident_events_volume_changes_snapshot:
      - rent_demand_events_snapshot
  tables_customization:
    coincident_events_volume_changes_snapshot:
      extra_query_template_params:
        "MAKE_DATE(year, month, day)": "DATE_ADD(MAKE_DATE({year}, {month}, {day}), 1)"
cluster:
  type: databricks_10_4_med_fixed_workers_2xlarge_general_photon_cluster
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE
