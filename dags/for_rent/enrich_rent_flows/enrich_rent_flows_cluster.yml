cluster:
  type: emr_7_12_consolidation_xs_memory_fleet_cluster
  custom_configurations:
    aws_attributes:
      availability: ON_DEMAND
    spark_conf:
      spark.sql.sources.partitionOverwriteMode: static
      spark.driver.memory: 12g
      spark.driver.memoryOverhead: 2g
    task_nodes:
      instance_types:
      - r6g.xlarge
      - r7g.xlarge
      - r6i.xlarge
      target_on_demand: 1
      target_spot: 0
    core_nodes:
      target_on_demand: 2
      target_spot: 0
      instance_types:
      - r6g.xlarge
      - r7g.xlarge
      - r6i.xlarge
