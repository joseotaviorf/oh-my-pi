dag:
    name: enrich_proposal
    owner: Data ForRent
    schedule_start_date: 2020, 7, 1
    documentation:
      dag_purpose: |
            This DAG creates the enriched table for the Proposal context.
            Data used in enrichment is from EBDB, Sorting Hat and Rental Guarantee extractions.
workflow:
    type: query
    layer: enrich
    default_extraction_type: full
    default_partitions: [country_code]
cluster:
    type: custom_cluster
    custom_configurations:
      driver_node_type_id: m5a.2xlarge
      node_type_id: m5a.4xlarge
      num_workers: 2
      spark_version: 12.2.x-scala2.12
