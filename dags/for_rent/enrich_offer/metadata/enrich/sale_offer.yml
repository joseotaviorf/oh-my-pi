---
database_name: datalake_offer
table_name: sale_offer
owner: gustavo.brunelli@quintoandar.com.br
domain: For Sale
description: |
  Consolidates general data of the For Sale offer process from Sales Flow (main source), Work
  Contract, EBDB, and other services. A significant share of attributes and dates still comes from
  datalake_firestore.sale_offer and datalake_firestore.monday — static tables from the deprecated
  enrich_sale_firestore pipeline (legacy Firestore/Monday system inactive since 2024). Fields with
  lineage from datalake_firestore.* are historical only and are not updated for new offers.
columns:
  id_offer:
    lineage:
      - datalake_firestore.sale_offer.id
      - datalake_sale_offer_flows.sale_offer_flows.id_offer
      - datalake_gsheets.sale_hub_offer.id_offer
    description: Offer unique identifier. Values from datalake_firestore reflect a static snapshot only (legacy system inactive since 2024).
  id_sale_flow:
    lineage:
      - datalake_firestore.sale_offer.id_sale_flow
      - datalake_sale_offer_flows.sale_offer_flows.id_sale_flow
    description: Identification key for the sales flow linked to an offer. Values from datalake_firestore reflect a static snapshot only (legacy system inactive since 2024).
  id_buyer:
    lineage:
      - datalake_firestore.sale_offer.id_buyer
      - datalake_sale_offer_flows.sale_offer_flows.id_buyer
      - datalake_gsheets.sale_hub_offer.id_buyer
    description: Identification key of the user who sent the offer. Values from datalake_firestore reflect a static snapshot only (legacy system inactive since 2024).
  id_house:
    lineage:
      - datalake_firestore.sale_offer.id_house
      - datalake_sale_offer_flows.sale_offer_flows.id_house
      - datalake_gsheets.sale_hub_offer.id_house
    description: Identification key of the house linked to the offer. Values from datalake_firestore reflect a static snapshot only (legacy system inactive since 2024).
  id_owner:
    lineage:
      - datalake_firestore.sale_offer.id_owner
      - datalake_sale_offer_flows.sale_offer_flows.id_seller
      - datalake_gsheets.sale_hub_offer.id_owner
    description: House owner to whom an offer has been sent. Values from datalake_firestore reflect a static snapshot only (legacy system inactive since 2024).
  id_region:
    lineage:
      - datalake_firestore.sale_offer.id_region
      - datalake_gsheets.sale_hub_offer.id_region
      - datalake_ebdb_listing.house.id_region
    description: Identification key of the region where the house in question is located. Values from datalake_firestore reflect a static snapshot only (legacy system inactive since 2024).
  id_agent:
    lineage:
      - datalake_visit.visit_schedules.id_agent
    description: Broker identification key linked to the offer.
  id_team_lead:
    lineage:
      - datalake_sale_offer_flows.sale_offer_flows.sk_team_lead
    description: Team lead ID user on SalesFlow tables
  id_user_consultant:
    lineage:
      - datalake_sale_offer_flows.sale_offer_flows.id_user_consultant
      - datalake_ebdb_user.user.id
    description: Deal Maker user ID on main (EBDB) tables
  id_user_agent:
    lineage:
      - datalake_sale_offer_flows.sale_offer_flows.id_user_agent
    description: Broker identification key linked to the offer on main tables (EBDB)
  id_consultant:
    lineage:
      - datalake_firestore.monday.id_consultant
      - datalake_sale_offer_flows.sale_offer_flows.id_consultant
    description: Deal Maker user ID on SalesFlow tables Values from datalake_firestore reflect a static snapshot only (legacy system inactive since 2024).
  id_user_secretariat_booking_creator:
    lineage:
      - datalake_secretariat.secretariat_allocation_history.id_secretariat_user
    description: Id of the secretariat user that created the booking
  id_user_secretariat_on_offer_submitted_date:
    lineage:
      - datalake_secretariat.buyer_secretariat_changes.id_external_responsible
    description: Id of the secretariat user associated with the buyer when the offer was submitted
  id_user_secretariat_on_offer_accepted_date:
    lineage:
      - datalake_secretariat.buyer_secretariat_changes.id_external_responsible
    description: Id of the secretariat user associated with the buyer when the offer was accepted
  id_user_secretariat_on_offer_dismissed_date:
    lineage:
      - datalake_secretariat.buyer_secretariat_changes.id_external_responsible
    description: Id of the secretariat user associated with the buyer when the offer was dismissed
  id_user_secretariat_on_sale_agreement_created_date:
    lineage:
      - datalake_secretariat.buyer_secretariat_changes.id_external_responsible
    description: Id of the secretariat user associated with the buyer when the sale agreement was created
  id_user_secretariat_on_sale_agreement_signed_date:
    lineage:
      - datalake_secretariat.buyer_secretariat_changes.id_external_responsible
    description: Id of the secretariat user associated with the buyer when the sale agreement was signed
  id_user_last_secretariat:
    lineage:
      - datalake_secretariat.buyer_secretariat_changes.id_external_responsible
    description: Id of the last secretariat user associated with the buyer
  id_booking:
    lineage:
      - datalake_visit.visit_schedules.id_schedule
    description: Booking identification key linked to an offer.
  id_closing_specialist:
    lineage:
      - datalake_firestore.monday.id_closing_specialist
      - datalake_sale_offer_flows.sale_offer_flows.id_closing_specialist
    description: User ID that participated on the CCV step on main (EBDB) tables Values from datalake_firestore reflect a static snapshot only (legacy system inactive since 2024).
  id_vendas:
    lineage:
      - datalake_sale_offer_flows.sale_offer_flows.id_sales_flow
    description: ID of the sales_flow in the SalesFlow DB (Vendas)
  id_pendency:
    lineage:
      - datalake_sale_offer_flows.sale_offer_flows.id_pendency
    description: Identification key for this offer pendencies on table pendency
  id_business_unit:
    lineage:
      - datalake_sale_offer_flows.sale_offer_flows.id_hub
      - datalake_gsheets_clean.sale_business_unit_standardization.id_business_unit_teams
    description: Identification key of the business unit where the buyer was served.
  sk_broker_supply:
    lineage:
      - datalake_visit.visit_business_model.sk_broker_supply
    description: "Surrogate key of the supply-side broker (core_brokers) when the business model implies 3P supply. Propagated from booking, sourced from visit_business_model."
  sk_broker_demand:
    lineage:
      - datalake_visit.visit_business_model.sk_broker_demand
    description: "Surrogate key of the demand-side broker (core_brokers) when the business model implies 3P demand or lead gen. Propagated from booking, sourced from visit_business_model."
  id_company_supply:
    lineage:
      - datalake_visit.visit_business_model.id_company_supply
    description: DEPRECATED - always NULL since the datalake_company.company_sks (enrich_company) deprecation; kept for schema compatibility. Use sk_broker_supply and dw_brokers.dim_broker instead.
  uuid_company_supply:
    lineage:
      - datalake_ebdb_listing.house.uuid_company
    description: UUID of the supply partner in the company domain
  id_company_demand:
    lineage:
      - datalake_visit.visit_business_model.id_company_demand
    description: DEPRECATED - always NULL since the datalake_company.company_sks (enrich_company) deprecation; kept for schema compatibility. Use sk_broker_demand and dw_brokers.dim_broker instead.
  pendency:
    lineage:
      - datalake_sale_offer_flows.sale_offer_flows.pendency
    description: Human-readable label of the blocking pendency currently assigned to the offer in SalesFlow.
  ccv_type:
    description: Type of financed sale agreement considering which financial product it has contracted.
  pendency_type:
    lineage:
      - datalake_sale_offer_flows.sale_offer_flows.pendency_type
    description: Category of the active pendency that determines which operation team must resolve it.
  opportunities_of_the_week:
    lineage:
      - datalake_sale_offer_flows.sale_offer_flows.opportunities_of_the_week
    description: "In For Sale it's every lead qualified in the week for the CRI or MA process. In Rent is every listing published, with at least one scheduled in the week. This information is not used by the For Sale operation team, because of the new business model of Closing Assistance."
  team_lead_name:
    lineage:
      - datalake_gsheets.sale_hub_offer.team_lead_name
      - datalake_sale_offer_flows.sale_offer_flows.team_lead_name
    description: Display name of the SalesFlow team lead responsible for the offer funnel.
  consultant_name:
