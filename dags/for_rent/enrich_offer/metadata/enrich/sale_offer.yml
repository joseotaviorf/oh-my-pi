  sk_company_supply:
    lineage:
      - datalake_company.company_sks.sk_company
    description:
      Surrogate Key of the company in Rede QuintoAndar associated with
      the house. Can be joined with dw_rede.dim_company.
  sk_company_demand:
    lineage:
      - datalake_company.company_sks.sk_company
    description:
      Surrogate Key of the company in Rede QuintoAndar associated with
      the agent. Can be joined with dw_rede.dim_company.
  id_company_demand:
    lineage:
      - datalake_ebdb_work_contract.work_contract.id_company_hubspot
