  early_keys_status:
    lineage:
      - datalake_firestore.monday.early_keys_status
    description: Early keys status. Deprecated. Sourced from datalake_firestore static snapshot (legacy Firestore/Monday system inactive since 2024).
  tags_from_salesflow:
