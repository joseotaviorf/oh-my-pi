  offer_flow:
    lineage:
      - datalake_gsheets.sale_hub_offer.offer_flow
      - datalake_sale_offer_flows.sale_offer_flows.offer_flow
    description: Information about which flow this offer is following
  business_unit:
    lineage:
      - datalake_gsheets.sale_hub_offer.offer_flow
      - datalake_gsheets_clean.sale_business_unit_standardization.hub_name_teams
