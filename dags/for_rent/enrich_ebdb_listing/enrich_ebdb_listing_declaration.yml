dag:
  name: enrich_ebdb_listing
  schedule_start_date: 2020, 7, 1
  owner: Data ForSale
  documentation:
    dag_purpose: |
      Creates enriched tables for the context `Listing` of EBDB.
      This DAG is triggered by Mediator and loads the table via full load.
workflow:
  type: query_delta
  layer: enrich
  inner_dependencies:
    agents_with_keys:
    - house_listing
    - house_entrance_history
    - house
    house:
    - house_entrance
    house_listing:
    - house_listing_early_demand
    - listing_business_context
    - house_entrance_history
    - lbc_status_version_order
    - house_listing_status
    - house_listing_category
    - house_listing_special_conditions
    house_listing_category:
    - lbc_status_version_order
    house_listing_early_demand:
    - house_listing_category
    house_listing_fees:
    - house_listing
    house_listing_special_conditions:
    - house_listing_category
    house_listing_status:
    - house_status_version_order
    - lbc_status_version_order
    house_status:
    - house_listing
    lbc_status_version_order:
    - business_context_history
    - house_status_version_order
  tables_customization:
    agents_with_keys:
      partitions:
      - country_code
    business_context_history:
      partitions:
      - country_code
      - business_context
    house:
      partitions:
      - country_code
    house_entrance_history:
      partitions:
      - country_code
    house_listing:
      partitions:
      - country_code
    house_listing_category:
      partitions:
      - country_code
    house_listing_early_demand:
      partitions:
      - country_code
    house_listing_fees:
      partitions:
      - country_code
    house_listing_special_conditions:
      partitions:
      - country_code
    house_listing_status:
      partitions:
      - country_code
    house_status_version_order:
      partitions:
      - country_code
    lbc_status_version_order:
      partitions:
      - country_code
    listing_business_context:
      partitions:
      - country_code
      - business_context
    listing_business_context_status_history:
      partitions:
      - country_code
      - business_context
    listing_business_context_suspension_history:
      partitions:
      - country_code
      - business_context
    portability:
      partitions:
      - country_code
    rent_listing:
      partitions:
      - country_code
cluster:
  type: custom_cluster
  custom_configurations:
    autotermination_minutes: 20
    driver_node_type_id: m5d.2xlarge
    node_type_id: r5d.2xlarge
    num_workers: 3
    spark_conf:
      spark.sql.broadcastTimeout: 1200
      spark.sql.sources.partitionOverwriteMode: static
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
    aws_attributes:
      first_on_demand: 1
      spot_bid_price_percent: 100
      zone_id: us-east-1d
      ebs_volume_size: 200
      availability: SPOT_WITH_FALLBACK
    spark_version: 12.2.x-scala2.12
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
  databricks_conn_id: databricks_new
