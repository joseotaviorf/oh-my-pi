---
database_name: datalake_ebdb_listing
table_name: house_listing
description: Information related to ForRent listings. Each line is an unique listing 
  related to a house. The tuple [id_house_listing, id_house] must be unique.
domain: For Rent
owner: jonas.fiorini@quintoandar.com.br
columns:
  id_house_listing:
    lineage:
      - datalake_ebdb_listing.lbc_status_version_order.id_house
      - datalake_ebdb_listing.lbc_status_version_order.listing_version
    description: Id of the house listing.
  id_house:
    lineage:
      - datalake_ebdb_listing.lbc_status_version_order.id_house
    description: Id of the house.
  id_contract:
    lineage:
      - datalake_ebdb_contract.contract.id
    description: Id of the contract.
  country_code:
    lineage:
      - datalake_ebdb_listing.lbc_status_version_order.country_code
    description: Country code.
  version:
    lineage:
      - datalake_ebdb_listing.lbc_status_version_order.listing_version
    description: Listing version.
  status:
    lineage:
      - datalake_ebdb_listing.lbc_status_version_order.status
    description: Listing status.
  status_reason:
    lineage:
      - datalake_ebdb_listing.lbc_status_version_order.status_reason
    description: Listing status reason.
  rent_type:
    description: Indicates if a re-listing resulted in a re-rental or the termination 
      was canceled and the listing was rented with the old contract or it wasn't rented at all.
  rent:
    lineage:
      - datalake_ebdb_clean.house_aud.rent
    description: Listing last rent price.
  last_originals_type:
    lineage:
      - datalake_ebdb_clean.special_condition.special_condition_type
    description: Indicates the last Originals type of this listing.
    categories:
      OriginalsReady: House is ready to be part of the Originals Program
      OriginalsReno: House needs a remodeling to be part of the Originals Program
  last_iorent_type:
    lineage:
      - datalake_ebdb_clean.special_condition.special_condition_type
    description: Column indicating last type related to I/ORent program (this program
      was deprecated in 2021 for new houses).
    categories:
      IRent: Status related to I/ORent Program (this program was deprecated in 2021
        for new houses)
      ORent: Status related to I/ORent Program (this program was deprecated in 2021
        for new houses)
  nr_renting:
    lineage:
      - datalake_ebdb_contract.contract.id
    description: Number of rent contracts from this house.
  who_is_living:
    lineage:
      - datalake_ebdb_listing.house_entrance_history.name
    description: Who is living in the house.
  is_exclusive:
    lineage:
      - datalake_ebdb_clean.special_condition_aud.ts_opted_in
    description: Flag indicating if this is a Exclusive listing.
  is_extended_rental:
    lineage:
      - datalake_ebdb_listing.house_listing_category.is_extended_rental
    description: Boolean indicating if the contract termination was canceled after relisting as early demand.
  is_originals_active:
    lineage:
      - datalake_ebdb_clean.special_condition_aud.ts_opted_in
      - datalake_ebdb_clean.special_condition_aud.ts_opted_out
    description: Once the listing has been flagged as Originals, it says whether it
      is current active.
  is_iorent_active:
    lineage:
      - datalake_ebdb_clean.special_condition_aud.ts_opted_in
      - datalake_ebdb_clean.special_condition_aud.ts_opted_out
    description: Once the listing has been flagged as IORent, it says whether it is
      current active.
  ts_listing_version_start:
    lineage:
      - datalake_ebdb_listing.lbc_status_version_order.ts_state_started
    description: Timestamp when this listing version started.
  ts_listing_version_end:
    lineage:
      - datalake_ebdb_listing.lbc_status_version_order.ts_state_ended
    description: Timestamp when this listing version ended.
  ts_entrance_started:
    lineage:
      - datalake_ebdb_listing.house_entrance_history.ts_entrance_started
    description: Timestamp when entrance started.
  ts_last_unpublished:
    lineage:
      - datalake_ebdb_listing.lbc_status_version_order.ts_state_started
    description: Timestamp when this listing was last unpublished.
  dt_last_exclusive_opted_in:
    lineage:
      - datalake_ebdb_clean.special_condition_aud.ts_opted_in
    description: Timestamp when was the last time this listing had opted in to Exclusive.
  dt_last_exclusive_opted_out:
    lineage:
      - datalake_ebdb_clean.special_condition_aud.ts_opted_out
    description: Timestamp when was the last time this listing had opted out from
      Exclusive.
  dt_last_originals_opted_in:
    lineage:
      - datalake_ebdb_clean.special_condition_aud.ts_opted_in
    description: Timestamp when was the last time this listing had opted in to Originals.
  dt_last_originals_opted_out:
    lineage:
      - datalake_ebdb_clean.special_condition_aud.ts_opted_out
    description: Timestamp when was the last time this listing had opted out from
      Originals.
  dt_last_iorent_opted_in:
    lineage:
      - datalake_ebdb_clean.special_condition_aud.ts_opted_in
    description: Timestamp when was the last time this listing had opted in to I/ORent
      program (this program was deprecated in 2021 for new houses).
  dt_last_iorent_opted_out:
    lineage:
      - datalake_ebdb_clean.special_condition_aud.ts_opted_out
    description: Timestamp when was the last time this listing had opted out from
      I/ORent program (this program was deprecated in 2021 for new houses).
  ts_contract_signed:
    lineage:
      - datalake_ebdb_contract.contract.ts_signed
    description: Timestamp when contract was signed.
  dt_contract_annulment:
    lineage:
      - datalake_ebdb_contract.contract.dt_termination
    description: Date when the contract was terminated.
  ts_next_contract_signed:
    lineage:
      - datalake_ebdb_contract.contract.ts_signed
    description: Timestamp of when this house's next contract was signed.
  dt_stranded:
    lineage:
      - datalake_ebdb_listing.house_listing_status.ts_status_started
      - datalake_ebdb_listing.lbc_status_version_order.ts_state_started
    description: Date when this listing was stranded. A listing is considered stranded
      after at least 8 week published and no contract signed.
  is_early_demand:
    lineage:
      - datalake_ebdb_listing.house_listing_early_demand.is_early_demand
    description: Flag indicating if the listing is available for early demand, that
      means it is available for visit/offer during contract termination.
  is_early_relisting:
    description: Flag indicating if the listing has passed by any early relisting
      phase.
  is_last_version:
    description: Flag indicating if this is the listing last version.
  listing_category:
    lineage:
      - datalake_ebdb_listing.house_listing_category.listing_category
    description: Inform the relationship history of this house with the company.
    categories:
      First Listing: Is the first time this listing is being published on the platform
      Re-listing: This house was listed before and is listed again after being rented
      Recovered: This house was taken down from the platform and is being published
        again
  order_renting:
    description: Is the position of this renting contract in this house's lifecycle.
  ts_early_demand_started:
    lineage:
      - datalake_ebdb_listing.house_listing_early_demand.ts_early_demand_started
    description: Timestamp when the listing became early demand.
  ts_first_publication:
    lineage:
      - datalake_ebdb_listing.lbc_status_version_order.ts_state_started
    description: Timestamp of the first time this house was published.
