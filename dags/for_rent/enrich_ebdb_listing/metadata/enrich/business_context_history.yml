database_name: datalake_ebdb_listing
table_name: business_context_history
description: Information about listing's status and suspension_reason. Each line has
  the initial and final date where a house had a specific status and suspension_reason
  in listing_business_context_aud table.
domain: For Rent
owner: jonas.fiorini@quintoandar.com.br
columns:
  id_house:
    lineage:
    - datalake_ebdb_clean.listing_business_context_aud.id_house
    description: Id of the house
  id_user_modified_by:
    lineage:
    - datalake_ebdb_clean.user_revision_entity.id_user
    description: Id of the user that made the modification.
  rev:
    lineage:
    - datalake_ebdb_clean.listing_business_context_aud.rev
    description: Revision identificator
  country_code:
    lineage:
    - datalake_ebdb_country.house.country_code
    description: Country code of the house
  business_context:
    lineage:
    - datalake_ebdb_clean.listing_business_context_aud.business_context
    description: Business context of the house
    categories:
      RENT: '#N/A'
      SALE: '#N/A'
      Undefined: '#N/A'
  status:
    lineage:
    - datalake_ebdb_clean.listing_business_context_aud.status
    description: Status of the house
  status_reason:
    lineage:
    - datalake_ebdb_clean.listing_business_context_aud.status_reason
    description: Reason of the house status (a change on this columns not necessarily
      represents a status change)
  suspension_reason:
    lineage:
    - datalake_ebdb_clean.listing_business_context_aud.suspension_reason
    description: Reason of the house suspension (a change on this columns not necessarily
      represents a status change)
  ts_state_started:
    description: Timestamp when this status and suspension reason started
  ts_state_ended:
    description: Timestamp when this status and suspension reason ended
