database_name: datalake_ebdb_listing
table_name: house_listing_category
description: Information related to ForRent listings. Each line is an unique listing
  with the listing categorization.
domain: For Rent
owner: jonas.fiorini@quintoandar.com.br
columns:
  country_code:
    lineage:
    - datalake_ebdb_listing.lbc_status_version_order.country_code
    description: Country code of the house.
  id_house_listing:
    lineage:
    - datalake_ebdb_listing.lbc_status_version_order.id_house
    - datalake_ebdb_listing.lbc_status_version_order.listing_version
    description: Id of the listing.
  id_house:
    lineage:
    - datalake_ebdb_listing.lbc_status_version_order.id_house
    description: Id of the house.
  is_extended_rental:
    lineage: 
    - datalake_ebdb_listing.lbc_status_version_order.is_extended_rental
    description: Boolean indicating if the contract termination was canceled after relisting as early demand.
  is_brokerage_only_decommissioned:
    lineage: 
    - datalake_ebdb_listing.lbc_status_version_order.is_brokerage_only_decommissioned
    description: "Boolean indicating if this listing was decommissioned from the Brokerage Only program. If the listing is re-published after decommissioned in the same version, this flag will be false."
  listing_category:
    description: Categorization of the listing based on the house history in the platform.
    categories:
      First Listing: Its the first time this house is being listed.
      Re-Listing: This house was already listed on the platform in the past.
      Recovered: This house is being listed after at least 12 weeks outside of the platform.
  revision_reason:
    lineage:
    - datalake_ebdb_listing.lbc_status_version_order.revision_reason
    description: Reason why an user changed some aspect of the house listing.
  status:
    lineage:
    - datalake_ebdb_listing.lbc_status_version_order.status
    description: Status of the listing.
  status_history:
    lineage:
    - datalake_ebdb_listing.lbc_status_version_order.status
    description: Previous status of the listing.
  status_reason:
    lineage:
    - datalake_ebdb_listing.lbc_status_version_order.status_reason
    description: Reason of the listing status.
  ts_status_changed:
    lineage:
    - datalake_ebdb_listing.lbc_status_version_order.ts_state_started
    description: Timestamp when the status changed.
  ts_listing_version_start:
    lineage:
    - datalake_ebdb_listing.lbc_status_version_order.ts_state_started
    description: Timestamp when the listing version started.
  ts_listing_version_end:
    lineage:
    - datalake_ebdb_listing.lbc_status_version_order.ts_state_ended
    description: Timestamp when the listing version ended.
  ts_last_unpublished:
    lineage:
    - datalake_ebdb_listing.lbc_status_version_order.ts_state_started
    description: Timestamp of the last time the house was unpublished.
  version:
    lineage:
    - datalake_ebdb_listing.lbc_status_version_order.listing_version
    description: Version of the listing.
