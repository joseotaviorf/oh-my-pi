---
tables:
  - table_name: agents_with_keys
    partitions: [country_code]
  - table_name: business_context_history
    partitions: [country_code, business_context]
  - table_name: house
    partitions: [country_code]
  - table_name: house_entrance_history
    partitions: [country_code]
  - table_name: house_listing
    partitions: [country_code]
  - table_name: house_listing_category
    partitions: [country_code]
  - table_name: house_listing_early_demand
    partitions: [country_code]
  - table_name: house_listing_fees
    partitions: [country_code]
  - table_name: house_listing_special_conditions
    partitions: [country_code]
  - table_name: house_listing_status
    partitions: [country_code]
  - table_name: house_status
  - table_name: house_status_version_order
    partitions: [country_code]
  - table_name: lbc_status_version_order
    partitions: [country_code]
  - table_name: listing_business_context
    partitions: [country_code, business_context]
  - table_name: listing_business_context_status_history
    partitions: [country_code, business_context]
  - table_name: listing_business_context_suspension_history
    partitions: [country_code, business_context]
  - table_name: portability
    partitions: [country_code]
  - table_name: rent_listing
    partitions: [country_code]

custom_cluster:
  driver_node_type_id: m5d.2xlarge
  node_type_id: r5d.2xlarge
  runtime_engine: PHOTON
  num_workers: 3
  spark_conf:
    spark.sql.broadcastTimeout: 1200
  aws_attributes:
    ebs_volume_size: 200
    availability: ON_DEMAND

inner_dependencies:
  agents_with_keys:
    - house_listing
  house_listing:
    - house_status_version_order
    - lbc_status_version_order
    - house_listing_status
    - listing_business_context_status_history
    - business_context_history
    - house_listing_category
    - house_listing_special_conditions
  house_listing_category:
    - lbc_status_version_order
  house_listing_early_demand:
    - house_listing_category
  house_listing_fees:
    - house_listing
  house_listing_special_conditions:
    - house_listing_category
  house_listing_status:
    - house_status_version_order
    - lbc_status_version_order
  house_status:
    - house_listing
  lbc_status_version_order:
    - business_context_history
