dag:
  name: benvi_manager_clean
  schedule_start_date: 2026, 9, 14
  catchup: false
  owner: Data ForRent
  documentation:
    dag_purpose: |
      Projects datalake_benvi_manager_raw.lake_mirror into one Superlogica resource
      table per resource_code. No cron. Dataset-triggered after
      bietlejuice.benvi_manager:load-clean-lake-mirror succeeds on an Impact
      Downstream Dependents (or reprocessing) run.
workflow:
  type: query_delta
  layer: clean
  custom_schema: benvi_manager
  default_extraction_type: full
