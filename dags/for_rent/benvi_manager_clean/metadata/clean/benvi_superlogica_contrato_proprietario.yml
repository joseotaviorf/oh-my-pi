database_name: datalake_benvi_manager_clean
table_name: benvi_superlogica_contrato_proprietario
domain: For Rent
owner: arthur.andrade@quintoandar.com
description: |
  One row per beneficiary owner attached to a rental contract, exploded from the
  proprietarios_beneficiarios array on the Superlogica CONTRACT payload. This is the
  relationship the RAW contratos_proprietarios spreadsheet tab holds and it had no lake table
  before. It carries the ownership share in nm_fracao_prb and the whole payout instruction,
  bank branch, account and pix key included. Those and the owner personal columns are governed
  by Trino column-level ACL.
columns:
  id:
    description: >-
      Source BIGSERIAL of the parent CONTRACT record in
      datalake_benvi_manager_raw.lake_mirror.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.id
  id_contrato_con:
    description: >-
      Vendor identifier of the parent CONTRACT record the array hangs off. Join it back to the
      parent projection.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.vendor_natural_key
  id_imovel_imo:
    description: >-
      Property unit the parent contract is signed on, carried down from the parent payload so
      the entry reads without a second join.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  nr_item:
    description: >-
      One based position of the entry inside the vendor array, so the original ordering
      survives the explode.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  st_fantasia_pes:
    description: >-
      Vendor text value fantasia held on the person record inside the Superlogica CONTRACT
      proprietarios_beneficiarios payload. Personal or banking detail, read access governed by
      Trino column-level ACL.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
