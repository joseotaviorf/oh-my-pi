database_name: datalake_benvi_manager_clean
table_name: benvi_superlogica_imovel
domain: For Rent
owner: arthur.andrade@quintoandar.com
description: |
  Superlogica PROPERTY projection at one row per managed unit, widened to the whole vendor
  payload so the RAW imoveis spreadsheet tab becomes a lake query. The three gestor columns
  are derived from the first entry of the imoveis_gestores array, reproducing the extraction
  script rule Gestor principal, so the shape matches the spreadsheet exactly. Street address,
  owner and manager contact columns are personal detail governed by Trino column-level ACL.
columns:
  id:
    description: >-
      Source BIGSERIAL from datalake_benvi_manager_raw.lake_mirror, one row per landed vendor
      record.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.id
  id_imovel_imo:
    description: >-
      Primary vendor key for this resource, mirrored from the PROPERTY lake_mirror natural key
      and identical to the payload id_imovel_imo.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.vendor_natural_key
      - datalake_benvi_manager_raw.lake_mirror.payload
  id_gestor_ges:
    description: >-
      Identifier of the principal property manager, taken from the first entry of the
      imoveis_gestores array exactly as the extraction script derives it. Absent as a flat
      vendor key.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  st_nome_ges:
    description: >-
      Name of the principal property manager, derived from imoveis_gestores[0]. Personal
      detail, read access governed by Trino column-level ACL.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  st_email_ges:
    description: >-
      Work email of the principal property manager, derived from imoveis_gestores[0]. Personal
      detail, read access governed by Trino column-level ACL.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  identificador_imo:
    description: >-
      Legacy alias of st_identificador_imo kept for existing consumers. Business code shown on
      the unit.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  endereco_imo:
    description: >-
      Legacy alias of st_endereco_imo kept for existing consumers. Street address of the unit,
      personal detail.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  cidade_imo:
    description: "Legacy alias of st_cidade_imo kept for existing consumers. City the unit sits in."
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  estado_imo:
    description: >-
      Legacy alias of st_estado_imo kept for existing consumers. Two letter state the unit
      sits in.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  id_filial_fil:
    description: "Vendor identifier filial fil as the Superlogica PROPERTY payload spells it."
