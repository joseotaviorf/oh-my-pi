database_name: datalake_benvi_manager_clean
table_name: benvi_superlogica_despesa
domain: For Rent
owner: arthur.andrade@quintoandar.com
description: |
  Union of the Superlogica contract expenses and the vacant unit expenses at one row per
  expense entry, widened to every key either endpoint sends. When the same launch id arrives
  from both endpoints the contract expense wins, which is the rule the daily extraction
  already applies. resource_code records which endpoint produced the surviving row.
columns:
  id:
    description: >-
      Source BIGSERIAL from datalake_benvi_manager_raw.lake_mirror, one row per landed vendor
      record.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.id
  id_lancamento_imod:
    description: "Vendor expense launch identifier and the grain of this projection."
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.vendor_natural_key
  resource_code:
    description: >-
      Which vendor endpoint produced the surviving row, contract expenses or vacant unit
      expenses.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.resource_code
  competencia:
    description: >-
      Vendor attribute competencia as the Superlogica CONTRACT_EXPENSE/VACANT_PROPERTY_EXPENSE
      payload spells it.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  credito_reembolso:
