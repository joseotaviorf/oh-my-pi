database_name: datalake_benvi_manager_clean
table_name: benvi_superlogica_locatario
domain: For Rent
owner: arthur.andrade@quintoandar.com
description: |
  Superlogica TENANT projection at one row per tenant person, widened to the whole vendor
  payload so the RAW locatarios spreadsheet tab maps straight onto this projection. Names,
  documents, addresses, contact channels and bank account columns are personal or banking
  detail: they are projected here and Trino column-level ACL is the access control, the same
  rule benvi_superlogica_cobranca already applies to the debtor columns.
columns:
  id:
    description: >-
      Source BIGSERIAL from datalake_benvi_manager_raw.lake_mirror, one row per landed vendor
      record.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.id
  id_pessoa_pes:
    description: >-
      Primary vendor key for this resource, mirrored from the TENANT lake_mirror natural key
      and identical to the payload id_pessoa_pes.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.vendor_natural_key
      - datalake_benvi_manager_raw.lake_mirror.payload
  nome_pes:
    description: >-
      Legacy alias of st_nome_pes kept for existing consumers. Full person name, personal
      detail governed by Trino column-level ACL.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  st_nome_pes:
    description: >-
      Vendor text value nome held on the person record inside the Superlogica TENANT payload.
      Personal or banking detail, read access governed by Trino column-level ACL.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
