      - datalake_benvi_manager_raw.lake_mirror.vendor_natural_key
  id_contrato_con:
    description: Parent contract id from the composite key.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.vendor_natural_key
  id_checklist_chk:
    description: Checklist id from the composite key.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.vendor_natural_key
  id_checklistitem_chi:
    description: Checklist item id from the composite key.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.vendor_natural_key
  ts_synced:
    description: When benvi-manager last landed this vendor row.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.synced_at
