database_name: datalake_benvi_manager_clean
table_name: benvi_superlogica_imovel_proprietario
domain: For Rent
owner: arthur.andrade@quintoandar.com
description: |
  One row per beneficiary owner of a property unit, exploded from the
  proprietarios_beneficiarios array on the Superlogica PROPERTY payload. This is the
  relationship the RAW imoveis_proprietarios spreadsheet tab holds and it had no lake table
  before. Ownership shares live in nm_fracao_prb and nm_fracao_rcb, and the payout instruction
  travels with each owner. Owner personal and banking columns are governed by Trino
  column-level ACL.
columns:
  id:
    description: >-
      Source BIGSERIAL of the parent PROPERTY record in
      datalake_benvi_manager_raw.lake_mirror.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.id
  id_imovel_imo:
    description: >-
      Vendor identifier of the parent PROPERTY record the array hangs off. Join it back to the
      parent projection.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.vendor_natural_key
  nr_item:
    description: >-
      One based position of the entry inside the vendor array, so the original ordering
      survives the explode.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  id_gestor_ges:
    description: >-
      Vendor identifier gestor held on the assigned property manager inside the Superlogica
      PROPERTY proprietarios_beneficiarios payload.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  st_nome_ges:
    description: >-
      Vendor text value nome held on the assigned property manager inside the Superlogica
      PROPERTY proprietarios_beneficiarios payload. Personal or banking detail, read access
      governed by Trino column-level ACL.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  st_email_ges:
    description: >-
      Vendor text value email held on the assigned property manager inside the Superlogica
      PROPERTY proprietarios_beneficiarios payload. Personal or banking detail, read access
      governed by Trino column-level ACL.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  st_celular_ges:
