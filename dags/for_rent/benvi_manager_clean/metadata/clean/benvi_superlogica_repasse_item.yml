database_name: datalake_benvi_manager_clean
table_name: benvi_superlogica_repasse_item
domain: For Rent
owner: arthur.andrade@quintoandar.com
description: |
  Exploded PAYOUT.payload.repasse_item. Grain is one payout line per payout
  and array position. Parent key is id_repasse_rep. Remaining nested keys
  stay in item_payload. Not a Superlogica HTTP call.
columns:
  id:
    description: Parent lake_mirror BIGSERIAL of the PAYOUT row.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.id
  id_repasse_rep:
    description: Parent payout vendor id. Join to repasse.id_repasse_rep.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.vendor_natural_key
  nr_item:
    description: One-based position of this object inside payload.repasse_item.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  id_recebimento_recb:
    description: Charge id on the payout line when Superlogica linked a boleto.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  vl_repasse:
    description: Line amount as a vendor string when present on the nested object.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  item_payload:
    description: Full nested payout line as JSON for keys not projected.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  ts_synced:
    description: When benvi-manager last landed the parent PAYOUT row.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.synced_at
