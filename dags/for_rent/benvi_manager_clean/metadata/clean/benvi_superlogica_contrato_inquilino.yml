database_name: datalake_benvi_manager_clean
table_name: benvi_superlogica_contrato_inquilino
domain: For Rent
owner: arthur.andrade@quintoandar.com
description: |
  One row per tenant attached to a rental contract, exploded from the inquilinos array on the
  Superlogica CONTRACT payload. This is the relationship the RAW contratos_inquilinos
  spreadsheet tab holds and it had no lake table before. A contract can carry several tenants,
  with fl_principal_inq marking the main one and nm_fracao_inq their share. Names, documents,
  addresses and contact channels are personal detail governed by Trino column-level ACL.
columns:
  id:
    description: >-
      Source BIGSERIAL of the parent CONTRACT record in
      datalake_benvi_manager_raw.lake_mirror.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.id
  id_contrato_con:
    description: >-
      Vendor identifier of the parent CONTRACT record the array hangs off. Join it back to the
      parent projection.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.vendor_natural_key
  id_imovel_imo:
    description: >-
      Property unit the parent contract is signed on, carried down from the parent payload so
      the entry reads without a second join.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  nr_item:
    description: >-
      One based position of the entry inside the vendor array, so the original ordering
      survives the explode.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  id_sacado_sac:
    description: >-
      Vendor identifier sacado held on the sacado, the billed debtor inside the Superlogica
      CONTRACT inquilinos payload.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  st_fantasia_pes:
    description: >-
      Vendor text value fantasia held on the person record inside the Superlogica CONTRACT
      inquilinos payload. Personal or banking detail, read access governed by Trino
      column-level ACL.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
