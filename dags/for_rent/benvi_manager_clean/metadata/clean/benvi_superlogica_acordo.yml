database_name: datalake_benvi_manager_clean
table_name: benvi_superlogica_acordo
domain: For Rent
owner: arthur.andrade@quintoandar.com
description: |
  Superlogica AGREEMENT projection at one row per instalment of a debt settlement, widened to
  the whole vendor payload so the RAW acordos spreadsheet tab becomes a lake query. The vendor
  calls the instalment id id_parcela_acp while the spreadsheet calls it id_recebimento_recb;
  both names are exposed and every value matches a benvi_superlogica_cobranca row. Debtor name
  and document are personal detail governed by Trino column-level ACL.
columns:
  id:
    description: >-
      Source BIGSERIAL from datalake_benvi_manager_raw.lake_mirror, one row per landed vendor
      record.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.id
  vendor_natural_key:
    description: >-
      Composite vendor key the ingestion assembles as settlement id joined to instalment id
      with a pipe.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.vendor_natural_key
  id_acordo_aco:
    description: >-
      Settlement agreement identifier. Groups the instalments that belong to one
      renegotiation.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.vendor_natural_key
  id_parcela_acp:
    description: >-
      Vendor instalment identifier of the settlement. Every value resolves to a receivable in
      benvi_superlogica_cobranca.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  id_recebimento_recb:
    description: >-
      Same instalment identifier under the name the extraction spreadsheet uses. Kept so a
      query written against the spreadsheet ports without a rename.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  id_recebimento_recb1:
    description: >-
      Duplicate of the instalment identifier the vendor portal emits twice. Reproduced so the
      spreadsheet shape lines up column for column.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  id_sacado_sac:
    description: "Billed debtor of the settlement. Join to benvi_superlogica_locatario.id_sacado_sac."
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  id_pessoa_pes:
    description: >-
      Tenant person resolved from the sacado so settlements read against the tenant
      projection.
    lineage:
      - datalake_benvi_manager_clean.benvi_superlogica_locatario.id_pessoa_pes
  id_contrato_con:
    description: "Rental contract behind the instalment, denormalized from the charge projection."
    lineage:
      - datalake_benvi_manager_clean.benvi_superlogica_cobranca.id_contrato_con
  nm_nfse_not:
    description: >-
      Vendor numeric value nfse held on the fiscal invoice inside the Superlogica AGREEMENT
      payload.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  nm_nfe_not:
    description: >-
      Vendor numeric value nfe held on the fiscal invoice inside the Superlogica AGREEMENT
      payload.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  id_nota_not:
    description: >-
      Vendor identifier nota held on the fiscal invoice inside the Superlogica AGREEMENT
      payload.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  st_sincro_sac:
    description: >-
      Vendor text value sincro held on the sacado, the billed debtor inside the Superlogica
      AGREEMENT payload.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  fl_tipo_acoi:
    description: "Vendor status or boolean flag tipo acoi as the Superlogica AGREEMENT payload spells it."
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  dt_competencia_recb:
    description: >-
      Calendar date competencia held on the receivable charge inside the Superlogica AGREEMENT
      payload.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  dt_vencimento_recb:
    description: >-
      Calendar date vencimento held on the receivable charge inside the Superlogica AGREEMENT
      payload.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  vl_total_recb:
    description: >-
      Monetary amount in BRL total held on the receivable charge inside the Superlogica
      AGREEMENT payload.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  dt_liquidacao_recb:
    description: >-
      Calendar date liquidacao held on the receivable charge inside the Superlogica AGREEMENT
      payload.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  fl_status_recb:
    description: >-
      Vendor status or boolean flag status held on the receivable charge inside the
      Superlogica AGREEMENT payload.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  st_label_recb:
    description: >-
      Vendor text value label held on the receivable charge inside the Superlogica AGREEMENT
      payload.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  id_acordo_aco1:
    description: "Vendor identifier acordo aco1 as the Superlogica AGREEMENT payload spells it."
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  st_descricao_aco:
    description: >-
      Vendor text value descricao held on the debt settlement agreement inside the Superlogica
