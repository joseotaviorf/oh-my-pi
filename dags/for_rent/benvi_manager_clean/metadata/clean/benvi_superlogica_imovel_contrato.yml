database_name: datalake_benvi_manager_clean
table_name: benvi_superlogica_imovel_contrato
domain: For Rent
owner: arthur.andrade@quintoandar.com
description: |
  One row per rental contract the vendor lists under a property unit, exploded from the
  contratos array on the Superlogica PROPERTY payload. This is the relationship the RAW
  imoveis_contratos spreadsheet tab holds and it had no lake table before. It gives the
  letting history of a unit without scanning the contract projection, rent value, guarantee
  and fire insurance window included.
columns:
  id:
    description: >-
      Source BIGSERIAL of the parent PROPERTY record in
      datalake_benvi_manager_raw.lake_mirror.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.id
  id_imovel_imo:
    description: >-
      Vendor identifier of the parent PROPERTY record the array hangs off. Join it back to the
      parent projection.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.vendor_natural_key
  nr_item:
    description: >-
      One based position of the entry inside the vendor array, so the original ordering
      survives the explode.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  id_contrato_con:
    description: >-
      Vendor identifier contrato held on the rental contract inside the Superlogica PROPERTY
      contratos payload.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  fl_ativo_con:
    description: >-
      Vendor status or boolean flag ativo held on the rental contract inside the Superlogica
      PROPERTY contratos payload.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  dt_inicio_con:
    description: >-
      Calendar date inicio held on the rental contract inside the Superlogica PROPERTY
      contratos payload.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  dt_ocupacao_con:
    description: >-
      Calendar date ocupacao held on the rental contract inside the Superlogica PROPERTY
      contratos payload.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  dt_fim_con:
