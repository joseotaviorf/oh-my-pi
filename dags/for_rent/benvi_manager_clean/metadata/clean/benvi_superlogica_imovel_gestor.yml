database_name: datalake_benvi_manager_clean
table_name: benvi_superlogica_imovel_gestor
domain: For Rent
owner: arthur.andrade@quintoandar.com
description: |
  One row per property manager assigned to a unit, exploded from the imoveis_gestores array on
  the Superlogica PROPERTY payload. This is the relationship the RAW imoveis_gestores
  spreadsheet tab holds and it had no lake table before. The first entry is the principal
  manager that benvi_superlogica_imovel denormalizes into its three gestor columns. Manager
  name, work email and mobile are personal detail governed by Trino column-level ACL.
columns:
  id:
    description: >-
      Source BIGSERIAL of the parent PROPERTY record in
      datalake_benvi_manager_raw.lake_mirror.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.id
  id_imovel_imo:
    description: >-
      Vendor identifier of the parent PROPERTY record the array hangs off. Join it back to the
      parent projection.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.vendor_natural_key
  nr_item:
    description: >-
      One based position of the entry inside the vendor array, so the original ordering
      survives the explode.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  id_gestor_ges:
    description: >-
      Vendor identifier gestor held on the assigned property manager inside the Superlogica
      PROPERTY imoveis_gestores payload.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  st_email_ges:
    description: >-
      Vendor text value email held on the assigned property manager inside the Superlogica
      PROPERTY imoveis_gestores payload. Personal or banking detail, read access governed by
      Trino column-level ACL.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  st_nome_ges:
    description: >-
      Vendor text value nome held on the assigned property manager inside the Superlogica
      PROPERTY imoveis_gestores payload. Personal or banking detail, read access governed by
      Trino column-level ACL.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  st_celular_ges:
    description: >-
      Vendor text value celular held on the assigned property manager inside the Superlogica
      PROPERTY imoveis_gestores payload. Personal or banking detail, read access governed by
      Trino column-level ACL.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  st_departamentos:
    description: >-
      Vendor text value departamentos as the Superlogica PROPERTY imoveis_gestores payload
      spells it.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  item_payload:
    description: >-
      Whole array entry re encoded as JSON, so a vendor key added later is still readable
      before anyone widens this projection.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  ts_synced:
    description: >-
      Wall clock moment benvi-manager last landed the parent vendor record into the raw
      mirror.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.synced_at
