database_name: datalake_benvi_manager_clean
table_name: benvi_superlogica_contrato
domain: For Rent
owner: arthur.andrade@quintoandar.com
description: |
  Superlogica CONTRACT rows from lake_mirror.
columns:
  id:
    description: Source BIGSERIAL from integration_superlogica.lake_mirror.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.id
  id_contrato_con:
    description: Vendor contract id.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.vendor_natural_key
  codigo_contrato:
    description: Contract code from vendor payload.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  id_imovel_imo:
    description: Related property id from vendor payload.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  fl_ativo:
    description: Whether the contract is active.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  dt_rescisao:
    description: Termination date from vendor payload.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  ts_synced:
    description: When benvi-manager last landed this vendor row.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.synced_at
