database_name: datalake_benvi_manager_clean
table_name: benvi_superlogica_contrato
domain: For Rent
owner: arthur.andrade@quintoandar.com
description: |
  Superlogica CONTRACT projection at one row per rental contract. Every key the vendor puts on
  the payload is projected so the daily extraction spreadsheet tab RAW contratos can be
  replaced by a lake query instead of rewritten. Tenant, owner and manager names plus bank and
  document columns are personal or banking detail: the column exists here and Trino
  column-level ACL is the access control, matching benvi_superlogica_cobranca. Date columns
  are parsed from the vendor MM/dd/yyyy and yyyy-MM-dd shapes.
columns:
  id:
    description: >-
      Source BIGSERIAL from datalake_benvi_manager_raw.lake_mirror, one row per landed vendor
      record.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.id
  id_contrato_con:
    description: >-
      Primary vendor key for this resource, mirrored from the CONTRACT lake_mirror natural key
      and identical to the payload id_contrato_con.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.vendor_natural_key
      - datalake_benvi_manager_raw.lake_mirror.payload
  fl_ativo:
    description: >-
      Legacy alias of fl_ativo_con kept for existing consumers. 1 marks a live contract, 0 a
      closed one.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  dt_rescisao:
    description: >-
      Legacy alias of dt_rescisao_con kept for existing consumers. Termination day, empty
      while the lease runs.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  id_imovel_imo:
    description: >-
      Vendor identifier imovel held on the property unit inside the Superlogica CONTRACT
      payload.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
