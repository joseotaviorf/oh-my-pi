database_name: datalake_benvi_manager_clean
table_name: benvi_superlogica_inadimplencia_cobranca
domain: For Rent
owner: arthur.andrade@quintoandar.com
description: |
  Parity projection for the RAW inadimplencia tab of the daily extraction spreadsheet, at one
  row per overdue charge. The vendor delinquency endpoint answers at debtor grain, so the
  spreadsheet tab is built by keeping the overdue unsettled charges of every flagged debtor.
  That rule is reproduced here. The existing benvi_superlogica_inadimplencia keeps its
  contract grain shape untouched because consumers already read it. dias_atraso recomputes
  against the run date and valorcorrigido repeats the debtor total on each of their charges,
  so it must never be summed across rows.
columns:
  id:
    description: "Source BIGSERIAL from datalake_benvi_manager_raw.lake_mirror of the underlying charge."
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.id
  id_recebimento_recb:
    description: "Vendor receivable identifier of the overdue charge and the grain of this projection."
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.vendor_natural_key
  id_sacado_sac:
    description: >-
      Billed debtor the vendor delinquency report flagged. Join to
      benvi_superlogica_locatario.id_sacado_sac.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  id_contrato_con:
    description: "Rental contract the overdue charge was issued under. Join to benvi_superlogica_contrato."
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  st_nomeref_sac:
    description: >-
      Vendor text value nomeref held on the sacado, the billed debtor inside the Superlogica
      CHARGE payload. Personal or banking detail, read access governed by Trino column-level
      ACL.
    lineage:
