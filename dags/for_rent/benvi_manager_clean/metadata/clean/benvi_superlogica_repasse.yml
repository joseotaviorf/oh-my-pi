database_name: datalake_benvi_manager_clean
table_name: benvi_superlogica_repasse
domain: For Rent
owner: arthur.andrade@quintoandar.com
description: |
  Superlogica PAYOUT projection at one row per owner payout, widened to the whole vendor
  payload so the RAW repasses spreadsheet tab becomes a lake query. fonte_extracao is the
  provenance constant the daily extraction stamps on every row and is reproduced here so the
  shapes line up. Owner and tenant names plus bank account columns are personal or banking
  detail governed by Trino column-level ACL.
columns:
  id:
    description: >-
      Source BIGSERIAL from datalake_benvi_manager_raw.lake_mirror, one row per landed vendor
      record.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.id
  id_repasse_rep:
    description: "Vendor payout identifier, the PAYOUT lake_mirror natural key. Grain of this projection."
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.vendor_natural_key
  id_contrato_con:
    description: "Rental contract the payout settles. Join to benvi_superlogica_contrato."
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  codigo_contrato:
    description: >-
      Business contract code denormalized from the contract projection so a payout reads
      without a second join.
    lineage:
      - datalake_benvi_manager_clean.benvi_superlogica_contrato.codigo_contrato
  id_recebimento_recb:
    description: "Receivable charge the payout derives from. Join to benvi_superlogica_cobranca."
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  id_sacado_sac:
    description: "Billed debtor behind the originating charge, denormalized from the charge projection."
    lineage:
      - datalake_benvi_manager_clean.benvi_superlogica_cobranca.id_sacado_sac
  id_locatario_pes:
    description: >-
      Tenant person the payout traces back to. Join to
      benvi_superlogica_locatario.id_pessoa_pes.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  nome_pes:
    description: >-
      Tenant name denormalized from the tenant projection. Personal detail, read access
      governed by Trino column-level ACL.
    lineage:
      - datalake_benvi_manager_clean.benvi_superlogica_locatario.nome_pes
  id_imovel_imo:
    description: >-
      Vendor identifier imovel held on the property unit inside the Superlogica PAYOUT
      payload.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
