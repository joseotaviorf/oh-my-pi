database_name: datalake_benvi_manager_clean
table_name: benvi_superlogica_manutencao
domain: For Rent
owner: arthur.andrade@quintoandar.com
description: |
  Superlogica MAINTENANCE projection at one row per maintenance order, widened to the whole
  vendor payload so the RAW manutencoes spreadsheet tab becomes a lake query. Join
  id_imovel_imo to benvi_superlogica_imovel and id_manutencao_man to
  benvi_superlogica_manutencao_historico for the note trail.
columns:
  id:
    description: >-
      Source BIGSERIAL from datalake_benvi_manager_raw.lake_mirror, one row per landed vendor
      record.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.id
  id_manutencao_man:
    description: >-
      Primary vendor key for this resource, mirrored from the MAINTENANCE lake_mirror natural
      key and identical to the payload id_manutencao_man.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.vendor_natural_key
      - datalake_benvi_manager_raw.lake_mirror.payload
  id_imovel_imo:
    description: >-
      Vendor identifier imovel held on the property unit inside the Superlogica MAINTENANCE
      payload.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  st_identificador_imo:
    description: >-
      Vendor text value identificador held on the property unit inside the Superlogica
      MAINTENANCE payload.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  st_tipo_imo:
    description: >-
      Vendor text value tipo held on the property unit inside the Superlogica MAINTENANCE
      payload.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  st_endereco_imo:
    description: >-
      Vendor text value endereco held on the property unit inside the Superlogica MAINTENANCE
      payload. Personal or banking detail, read access governed by Trino column-level ACL.
    lineage:
      - datalake_benvi_manager_raw.lake_mirror.payload
  st_numero_imo:
