database_name: datalake_ebdb_contract
table_name: contract_b2b
description: Information related to ForRent contracts B2B. Each line is an unique
  contract
domain: For Rent
owner: gustavo.brunelli@quintoandar.com.br
columns:
  id_contract:
    lineage:
    - datalake_ebdb_clean.contract.id
    description: Id of the contract, which must be unique.
  country_code:
    lineage:
    - datalake_ebdb_country.house.country_code
    description: ISO country code of the property linked to the B2B rent contract.
  contract_plan:
    lineage:
    - datalake_ebdb_clean.contract_partnership_data.contract_plan
    description: Partnership plan tier negotiated with the B2B partner on the contract.
  contract_partner_type:
    lineage:
    - datalake_ebdb_clean.contract_partnership_data.partner_type
    description: Type of partner related to the contract.
  administration_split_percentage:
    lineage:
    - datalake_ebdb_clean.contract_partnership_data.administration_split_percentage
    description: The administrative percentage of the contract.
  brokerage_split_percentage:
    lineage:
    - datalake_ebdb_clean.contract_partnership_data.brokerage_split_percentage
    description: Percentage of brokerage commission allocated to partners on the contract.
  b2b_type:
    description: Type of the B2B client origin related to the contract.
    categories:
      online: The B2B client makes a recommendation of a property to be listed at QuintoAndar (referral).
      prime: The B2B client registers the property at QuintoAndar.
  b2b_prime_type:
    description: Type of B2B client prime from which comes the contract.
    categories:
      advanced_negotiation: The B2B client sends QuintoAndar the properties and tenants (advanced negotiation), the properties are listed and the contract process continues.
      batch: The B2B client sends QuintoAndar properties in batches, they are listed and the contract process continues.
      portability: The B2B client transfers active contracts to be renewed with QuintoAndar.
      standard: The B2B client registers property by property at QuintoAndar.
  partner_quantity:
    description: Quantity of partners responsible for this contract. It can be one
      or zero operational partner and zero or many executive partners.
  is_executive_partner:
    description: Boolean that indicates if this contract had an executive partner
      from Select Program.
  is_b2b:
    description: Boolean that indicates if the affiliate responsible is B2B.
  is_contract_b2b:
    description: Boolean that indicates if is a PRIME partner.
