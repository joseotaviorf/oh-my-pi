---
dag:
  name: enrich_ebdb_contract
  schedule_start_date: 2020, 7, 1
  owner: Data ForRent
  documentation:
    dag_purpose: |
      Creates enriched tables for the context `Contract` of ebdb.
      This DAG is triggered by Mediator and loads the table via full load.
workflow:
  type: query
  layer: enrich
  default_partitions:
  - country_code
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: m5a.2xlarge
    node_type_id: c5d.9xlarge
    num_workers: 2
    spark_version: 12.2.x-scala2.12
    spark_conf:
      spark.sql.sources.partitionOverwriteMode: static
