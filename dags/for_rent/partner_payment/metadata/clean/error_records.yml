---
database_name: datalake_partner_payment_clean
table_name: error_records
description: |
  This table contains the errors that need manual attention.
owner: gustavo.silva@quintoandar.com.br
domain: For Rent
columns:
  id:
    lineage:
      - datalake_partner_payment_raw.error_records.id
    description: "ID of the table, it’s the primary key."
  id_operation_event:
    lineage:
      - datalake_partner_payment_raw.error_records.operation_event_id
    description: Foreign key to the Partner Payment operation event that triggered this error.
  id_operation_payment:
    lineage:
      - datalake_partner_payment_raw.error_records.operation_payment_id
    description: Foreign key to the operation payment record associated with this error.
  id_agent_payment:
    lineage:
      - datalake_partner_payment_raw.error_records.agent_payment_id
    description: Foreign key to the agent payment consolidation affected by this error.
  version:
    lineage:
      - datalake_partner_payment_raw.error_records.version
    description: Optimistic locking revision counter for concurrent update safety.
  error_date:
    lineage:
      - datalake_partner_payment_raw.error_records.error_date
    description: Date when the error occurred.
  status:
    lineage:
      - datalake_partner_payment_raw.error_records.status
    description: Status assigned to the error record when it is created.
  message_error:
    lineage:
      - datalake_partner_payment_raw.error_records.message_error
    description: Detailed error text returned by the payment processing system.
  error_category:
    lineage:
      - datalake_partner_payment_raw.error_records.error_category
    description: Classification grouping errors by type for manual triage and routing.
  source_reference:
    lineage:
      - datalake_partner_payment_raw.error_records.source_reference
    description: Reference to the source where the error is addressed.
  ts_created:
    lineage:
      - datalake_partner_payment_raw.error_records.created_at
    description: Timestamp of the creation of the error.
  ts_updated:
    lineage:
      - datalake_partner_payment_raw.error_records.updated_at
    description: Timestamp of the update of the error.
