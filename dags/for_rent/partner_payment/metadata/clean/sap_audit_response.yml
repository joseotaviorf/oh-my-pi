---
database_name: datalake_partner_payment_clean
table_name: sap_audit_response
description: |
  Audit records for requests and callbacks of the Partner Payment service integration with SAP.
  One row per SAP integration event (bill or transfer). Used by the For Rent data team to trace
  request, response, and callback lifecycle and HTTP status.
owner: data-for-rent@quintoandar.com.br
domain: For Rent
columns:
  id:
    lineage:
      - datalake_partner_payment_raw.sap_audit_response.id
    description: Primary key. Unique identifier of the SAP audit record in the transactional source.
  id_bill:
    lineage:
      - datalake_partner_payment_raw.sap_audit_response.bill_id
    description: Foreign key to the bill related to this SAP audit record.
  id_unique:
    lineage:
      - datalake_partner_payment_raw.sap_audit_response.unique_id
    description: Unique identifier shared with SAP for correlating request and callback events.
  version:
    lineage:
      - datalake_partner_payment_raw.sap_audit_response.version
    description: Optimistic locking revision counter for concurrent update safety.
  status:
    lineage:
      - datalake_partner_payment_raw.sap_audit_response.status
    description: HTTP status code returned in the SAP integration response.
  event_type:
    lineage:
      - datalake_partner_payment_raw.sap_audit_response.event_type
    description: SAP event type indicating whether the record refers to a bill or a transfer.
  ts_request:
    lineage:
      - datalake_partner_payment_raw.sap_audit_response.request_date
    description: Timestamp of when the request was sent to SAP.
  ts_response:
    lineage:
      - datalake_partner_payment_raw.sap_audit_response.response_date
    description: Timestamp of when the response was received from SAP.
  ts_callback:
    lineage:
      - datalake_partner_payment_raw.sap_audit_response.callback_date
    description: Timestamp of when the callback notification was received from SAP.
  ts_created:
    lineage:
      - datalake_partner_payment_raw.sap_audit_response.created_at
    description: Timestamp of the record creation in the source system.
  ts_updated:
    lineage:
      - datalake_partner_payment_raw.sap_audit_response.updated_at
    description: Timestamp of the last update to the record in the source system.
  op_cdc:
    lineage:
      - datalake_partner_payment_raw.sap_audit_response.op_cdc
    description: CDC operation type captured by the Debezium change-data-capture stream.
    categories:
      r: Read/snapshot - initial load of existing records.
      c: Create - new record inserted.
      u: Update - existing record modified.
      d: Delete - record removed.
  ts_cdc_transaction:
    lineage:
      - datalake_partner_payment_raw.sap_audit_response.ts_cdc_transaction
    description: Wall-clock timestamp when the CDC connector captured this change event.
  ts_database_transaction:
    lineage:
      - datalake_partner_payment_raw.sap_audit_response.ts_database_transaction
    description: Timestamp of the originating database transaction before CDC propagation.
