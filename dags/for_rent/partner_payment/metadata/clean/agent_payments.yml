---
database_name: datalake_partner_payment_clean
table_name: agent_payments
description: |
  This table contains the corrections related to previous payments.
owner: data-for-rent@quintoandar.com.br
domain: For Rent
columns:
  id:
    lineage:
      - datalake_partner_payment_raw.agent_payments.id
    description: ID of the table, it’s the primary key.
  id_user:
    lineage:
      - datalake_partner_payment_raw.agent_payments.user_id
    description: ID of the user.
  uuid_company:
    lineage:
      - datalake_partner_payment_raw.agent_payments.company_uuid
    description: UUID of the company.
  id_agent:
    lineage:
      - datalake_partner_payment_raw.agent_payments.agent_id
    description: ID of the agent.
  version:
    lineage:
      - datalake_partner_payment_raw.agent_payments.version
    description: Agent Payment version. 
  source_error_reference:
    lineage:
      - datalake_partner_payment_raw.agent_payments.source_error_reference
    description: Reference of a source where an error is detailed.
  status:
    lineage:
      - datalake_partner_payment_raw.agent_payments.status
    description: Status of the agent payment.
  total_basic_payments:
    lineage:
      - datalake_partner_payment_raw.agent_payments.total_basic_payments
    description: Consolidated amount related to the operations (inspections or photo sessions) executed by the agent.
  total_campaign_payments:
    lineage:
      - datalake_partner_payment_raw.agent_payments.total_campaign_payments
    description: Consolidated amount related to the campaigns to be paid to the agent.
  total_discounts:
    lineage:
      - datalake_partner_payment_raw.agent_payments.total_discounts
    description: Consolidated amount related to the discounts (D0, D-1, etc.) to be paid to the agent.
  total_agenda_availability:
    lineage:
      - datalake_partner_payment_raw.agent_payments.total_agenda_availability
    description: Consolidated amount related to the available agenda to be paid to the agent with fixed contract type.
  total_corrections:
    lineage:
      - datalake_partner_payment_raw.agent_payments.total_corrections
    description: Consolidated amount related to the errors, detected in previous payments, to be paid to the agent.
  dt_payment:
    lineage:
      - datalake_partner_payment_raw.agent_payments.payment_date
    description: Date when the system execute the payment consolidation or closing.
  ts_created:
    lineage:
      - datalake_partner_payment_raw.agent_payments.created_at
    description: Timestamp of the creation of the agent payment.
  ts_updated:
    lineage:
      - datalake_partner_payment_raw.agent_payments.updated_at
    description: Timestamp of the update of the agent payment.