---
database_name: datalake_partner_payment_clean
table_name: campaigns
description: |
  This table contains the campaigns to be paid to the agents (inspector or photographer).
owner: data-for-rent@quintoandar.com.br
domain: For Rent
columns:
  id:
    lineage:
      - datalake_partner_payment_raw.campaigns.id
    description: ID of the table, it’s the primary key.
  id_agent_payment:
    lineage:
      - datalake_partner_payment_raw.campaigns.agent_payment_id
    description: ID of the agent payment record where it is consolidated the campaign.
  id_agent:
    lineage:
      - datalake_partner_payment_raw.campaigns.agent_id
    description: ID of the agent.
  version:
    lineage:
      - datalake_partner_payment_raw.campaigns.version
    description: Campaign version.
  description:
    lineage:
      - datalake_partner_payment_raw.campaigns.description
    description: Text about the concept of the category of the campaign.
  amount:
    lineage:
      - datalake_partner_payment_raw.campaigns.amount
    description: Amount of the campaign to be paid to the agent.
  name:
    lineage:
      - datalake_partner_payment_raw.campaigns.name
    description: Name of the campaign.
  approving_user:
    lineage:
      - datalake_partner_payment_raw.campaigns.approving_user
    description: Email of the user that approved the amount of the campaign to be paid to the agent.
  source_reference:
    lineage:
      - datalake_partner_payment_raw.campaigns.source_reference
    description: Reference of a source where the campaign is detailed. 
  agent_type:
    lineage:
      - datalake_partner_payment_raw.campaigns.agent_type
    description: Type of the agent related to the campaign (inspection or photo session).
  business_source:
    lineage:
      - datalake_partner_payment_raw.campaigns.business_source
    description: Source of the business, related with the cost center, where this campaign will be applied.
  dt_campaign:
    lineage:
      - datalake_partner_payment_raw.campaigns.campaign_date
    description: Date of the campaign.
  ts_created:
    lineage:
      - datalake_partner_payment_raw.campaigns.created_at
    description: Timestamp of the creation of the campaign.
  ts_updated:
    lineage:
      - datalake_partner_payment_raw.campaigns.updated_at
    description: Timestamp of the update of the campaign.