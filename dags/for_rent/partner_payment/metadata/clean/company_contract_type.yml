---
database_name: datalake_partner_payment_clean
table_name: company_contract_type
description: |
  This table contains the contract type for companies paid through Partner Payment service.
  Each row represents the active contract configuration for a company, defining how inspection
  agents associated with that company are paid (contract type, payment mode, and validity period).
owner: data-for-rent@quintoandar.com.br
domain: For Rent
columns:
  id:
    lineage:
      - datalake_partner_payment_raw.company_contract_type.id
    description: Auto-generated primary key for the company contract type record.
  uuid_company:
    lineage:
      - datalake_partner_payment_raw.company_contract_type.company_uuid
    description: UUID of the company this contract type is associated with.
  agent_type:
    lineage:
      - datalake_partner_payment_raw.company_contract_type.agent_type
    description: Indicates to which agent type the contract belongs to (e.g. inspector, photographer).
  contract_type:
    lineage:
      - datalake_partner_payment_raw.company_contract_type.contract_type
    description: The contract type identifier that determines the payment structure applied to the company's agents.
  availability_payment_mode:
    lineage:
      - datalake_partner_payment_raw.company_contract_type.availability_payment_mode
    description: The payment mode for the agenda availability component for the company's agents.
  version:
    lineage:
      - datalake_partner_payment_raw.company_contract_type.version
    description: Optimistic locking version of the record. Incremented on each update.
  dt_contract_start:
    lineage:
      - datalake_partner_payment_raw.company_contract_type.contract_start_date
    description: Date from which this contract type configuration becomes effective for the company.
  dt_contract_end:
    lineage:
      - datalake_partner_payment_raw.company_contract_type.contract_end_date
    description: Date on which this contract type configuration expires. Null when there is no defined end date.
  ts_created:
    lineage:
      - datalake_partner_payment_raw.company_contract_type.created_at
    description: Timestamp when the company contract type record was created in the source system.
  ts_updated:
    lineage:
      - datalake_partner_payment_raw.company_contract_type.updated_at
    description: Timestamp when the company contract type record was last updated in the source system.
