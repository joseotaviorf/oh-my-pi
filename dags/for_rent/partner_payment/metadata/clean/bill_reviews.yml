---
database_name: datalake_partner_payment_clean
table_name: bill_reviews
description: |
  Reviews submitted for bills in the Partner Payment service.
  One row per review. Primary key: id. Related to bills via id_bill (FK to bills).
owner: data-for-rent@quintoandar.com.br
domain: For Rent
columns:
  id:
    lineage:
      - datalake_partner_payment_raw.bill_reviews.id
    description: Primary key. Unique identifier of the bill review in the transactional source.
  id_bill:
    lineage:
      - datalake_partner_payment_raw.bill_reviews.bill_id
    description: Foreign key to datalake_partner_payment_clean.bills. Identifies the bill associated with this review.
  id_source:
    lineage:
      - datalake_partner_payment_raw.bill_reviews.source_id
    description: Identifier of the review record in the external source system.
  id_jira_issue:
    lineage:
      - datalake_partner_payment_raw.bill_reviews.jira_issue_id
    description: Foreign key to the Jira Issue table. Identifies the Jira issue linked to this review.
  version:
    lineage:
      - datalake_partner_payment_raw.bill_reviews.version
    description: Record version used for optimistic concurrency control.
  status:
    lineage:
      - datalake_partner_payment_raw.bill_reviews.status
    description: Current status of the bill review (e.g. pending, approved, rejected).
  source:
    lineage:
      - datalake_partner_payment_raw.bill_reviews.source
    description: Name of the source system where the review was performed.
  ts_reviewed:
    lineage:
      - datalake_partner_payment_raw.bill_reviews.reviewed_at
    description: Timestamp of when the bill review was completed.
  ts_created:
    lineage:
      - datalake_partner_payment_raw.bill_reviews.created_at
    description: Timestamp of the review record creation in the source system.
  ts_updated:
    lineage:
      - datalake_partner_payment_raw.bill_reviews.updated_at
    description: Timestamp of the last update to the review record in the source system.
