dag:
  name: partner_payment
  schedule_start_date: 2024, 7, 1
  schedule_interval: 30 5 * * *
  owner: Data ForRent
  documentation:
    dag_purpose: |
      This DAG retrieves data from the partner_payment database, which is a source of payments data for inspection agents.
workflow:
  type: cdc
  layer: raw
  database_type: postgres
  source_schema: public
  dbutils_secret_key: PARTNER_PAYMENT_DB
  tables_customization:
    operation_event:
      clean_table_name: operation_event
    operation_payments:
      clean_table_name: operation_payments
      transactional_datatype_overrides:
        house_area: "DECIMAL(38, 10)"
        house_reference: "DECIMAL(38, 10)"
        base_meter_value: "DECIMAL(38, 10)"
        additional_meter_value: "DECIMAL(38, 10)"
        total_meter_value: "DECIMAL(38, 10)"
        total_add_ons: "DECIMAL(38, 10)"
        fixed_value: "DECIMAL(38, 10)"
        meters_base_reference: "DECIMAL(38, 10)"
        meters_additional_reference: "DECIMAL(38, 10)"
        meters_total: "DECIMAL(38, 10)"
        additionals_total: "DECIMAL(38, 10)"
        fixed_reference: "DECIMAL(38, 10)"
    additionals:
      clean_table_name: additionals
      transactional_datatype_overrides:
        quantity: "DECIMAL(38, 10)"
        amount: "DECIMAL(38, 10)"
        additional_amount: "DECIMAL(38, 10)"
    error_records:
      clean_table_name: error_records
    agenda_availability:
      clean_table_name: agenda_availability
    campaigns:
      clean_table_name: campaigns
    agent_payments:
      clean_table_name: agent_payments
    agent_payment_corrections:
      clean_table_name: agent_payment_corrections
    discounts:
      clean_table_name: discounts
    payments_period:
      clean_table_name: payments_period
    photo_session_details:
      clean_table_name: photo_session_details
cluster:
  type: databricks_16_4_med_general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}