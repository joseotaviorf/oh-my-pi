---
database_name: datalake_rental_transact_clean
table_name: transact_flow
description: This table has the current state of each transact flow. Each line is a different transact flow.
domain: For Rent
owner: gustavo.brunelli@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_rental_transact_raw.transact_flow.id
    description: Surrogate key identifying this transact flow record in the rental_transact pipeline.
  id_house:
    lineage:
      - datalake_rental_transact_raw.transact_flow.house_external_id
    description: External listing identifier from EBDB linking the transact flow to a property.
  status:
    lineage:
      - datalake_rental_transact_raw.transact_flow.status
    description: Current lifecycle stage of the rental transact flow (draft, active, or completed).
  ts_created:
    lineage:
      - datalake_rental_transact_raw.transact_flow.created_at
    description: Record creation date
  ts_updated:
    lineage:
      - datalake_rental_transact_raw.transact_flow.updated_at
    description: Record update date
