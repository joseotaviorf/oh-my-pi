---
database_name: datalake_rental_transact_clean
table_name: advance_payment
description: This table consolidates advance payment information related to the ForRent operation.
  Each line should be unique and identified by the id column.
domain: For Rent
owner: gustavo.brunelli@quintoandar.com.br
columns:
  id:
    lineage:
    - datalake_rental_transact_raw.advance_payment.id
    description: Unique id of the advance payment.
  uuid_advance_payment:
    lineage:
    - datalake_rental_transact_raw.advance_payment.advance_payment_uuid
    description: Global UUID assigned to the advance payment in Rental Transact, used to trace the payment across services.
  id_house_external:
    lineage:
    - datalake_rental_transact_raw.advance_payment.house_external_id
    description: External house id - joins with EBDB's house id.
  id_tenant_external:
    lineage:
    - datalake_rental_transact_raw.advance_payment.tenant_external_id
    description: External tenant id - joins with Person's user id.
  id_owner_external:
    lineage:
    - datalake_rental_transact_raw.advance_payment.owner_external_id
    description: External owner id - joins with Person's user id.
  uuid_offer:
    lineage:
    - datalake_rental_transact_raw.advance_payment.rent_flow_uuid
    description: UUID of the rent flow/offer.
  status:
    lineage:
    - datalake_rental_transact_raw.advance_payment.status
    description: Current status of the advance payment.
  rejection_reason:
    lineage:
    - datalake_rental_transact_raw.advance_payment.rejection_reason
    description: Rejection reason of the advance payment, if it has any.
  payment_percentage:
    lineage:
    - datalake_rental_transact_raw.advance_payment.payment_percentage
    description: Percentage of the payment amount.
  payment_amount:
    lineage:
    - datalake_rental_transact_raw.advance_payment.payment_amount
    description: Monetary value of the payment transaction in local currency.
  ts_created:
    lineage:
    - datalake_rental_transact_raw.advance_payment.created_at
    description: Timestamp of the advance payment creation.
  ts_updated:
    lineage:
    - datalake_rental_transact_raw.advance_payment.updated_at
    description: Timestamp of the advance payment update.
  ts_expires:
    lineage:
    - datalake_rental_transact_raw.advance_payment.expires_at
    description: Timestamp of when the advance payment expires.
  ts_cancelled:
    lineage:
    - datalake_rental_transact_raw.advance_payment.cancelled_at
    description: Timestamp of when the advance payment was cancelled.
