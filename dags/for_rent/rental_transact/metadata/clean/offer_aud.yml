database_name: datalake_rental_transact_clean
table_name: offer_aud
description: This table consolidates the audition of offer information related to the ForRent operation.
  Each line should be unique audition identified by the rev column.
domain: For Rent
owner: jonas.fiorini@quintoandar.com.br
columns:
  id:
    lineage:
    - datalake_rental_transact_raw.offer_aud.id
    description: Offer id.
  id_firestore_offer:
    lineage:
    - datalake_rental_transact_raw.offer_aud.firestore_offer_id
    description: Firestore's offer id.
  id_house_external:
    lineage:
    - datalake_rental_transact_raw.offer_aud.house_external_id
    description: External house id - joins with EBDB's house id.
  id_tenant_external:
    lineage:
    - datalake_rental_transact_raw.offer_aud.tenant_external_id
    description: External tenant id - joins with Person's user id.
  id_owner_external:
    lineage:
    - datalake_rental_transact_raw.offer_aud.owner_external_id
    description: External owner id - joins with Person's user id.
  id_resident_info:
    lineage:
    - datalake_rental_transact_raw.offer_aud.resident_info_id
    description: Resident info id. Joins with resident_info table.
  uuid_offer:
    lineage:
    - datalake_rental_transact_raw.offer_aud.offer_uuid
    description: Offer uuid.
  rev:
    lineage:
    - datalake_rental_transact_raw.offer_aud.rev
    description: Revision of the offer, unique id of the modification.
      Can be joined with table rev_info to get more details.
  rev_type:
    lineage:
    - datalake_rental_transact_raw.offer_aud.revtype
    description: Type of the revision.
    categories:
      '0': Create
      '1': Update
      '2': Delete
  rev_end:
    lineage:
    - datalake_rental_transact_raw.offer_aud.revend
    description: Id of the revision that replaced the current entry.
  status:
    lineage:
    - datalake_rental_transact_raw.offer_aud.status
    description: Current status of the offer.
  type:
    lineage:
    - datalake_rental_transact_raw.offer_aud.type
    description: Type of the offer.
  iteration:
    lineage:
    - datalake_rental_transact_raw.offer_aud.iteration
    description: Iteration of the offer.
  turn:
    lineage:
    - datalake_rental_transact_raw.offer_aud.turn
    description: Whose turn is on the offer negotiation.
  rejection_reason:
    lineage:
    - datalake_rental_transact_raw.offer_aud.rejection_reason
    description: Rejection reason of the offer, if it has any.
  original_rent_value:
    lineage:
    - datalake_rental_transact_raw.offer_aud.original_rent_value
    description: Original rent value asked by the owner.
  mod_id_tenant_external:
    lineage:
    - datalake_rental_transact_raw.offer_aud.tenant_external_id_mod
    description: Boolean flag indicating if the id_tenant_external column was updated in the revision.
  mod_id_owner_external:
    lineage:
    - datalake_rental_transact_raw.offer_aud.owner_external_id_mod
    description: Boolean flag indicating if the id_owner_external column was updated in the revision.
  mod_status:
    lineage:
    - datalake_rental_transact_raw.offer_aud.status_mod
    description: Boolean flag indicating if the status column was updated in the revision.
  mod_iteration:
    lineage:
    - datalake_rental_transact_raw.offer_aud.iteration_mod
    description: Boolean flag indicating if the iteration column was updated in the revision.
  mod_turn:
    lineage:
    - datalake_rental_transact_raw.offer_aud.turn_mod
    description: Boolean flag indicating if the turn column was updated in the revision.
  mod_ts_expiration:
    lineage:
    - datalake_rental_transact_raw.offer_aud.expires_at_mod
    description: Boolean flag indicating if the ts_expiration column was updated in the revision.
  ts_created:
    lineage:
    - datalake_rental_transact_raw.offer_aud.created_at
    description: Timestamp of the offer creation.
  ts_updated:
    lineage:
    - datalake_rental_transact_raw.offer_aud.updated_at
    description: Timestamp of the offer update.
  ts_expiration:
    lineage:
    - datalake_rental_transact_raw.offer_aud.expires_at
    description: Timestamp of when the offer will expire.
  