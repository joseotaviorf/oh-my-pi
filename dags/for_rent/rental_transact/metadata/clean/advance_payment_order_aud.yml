---
database_name: datalake_rental_transact_clean
table_name: advance_payment_order_aud
description: This table contains the audit history for advance payment order records in the ForRent operation.
  Each line represents a historical version of an order and is identified by id and rev columns.
domain: For Rent
owner: gustavo.brunelli@quintoandar.com.br
columns:
  id:
    lineage:
    - datalake_rental_transact_raw.advance_payment_order_aud.id
    description: Unique id of the advance payment order.
  id_external_order:
    lineage:
    - datalake_rental_transact_raw.advance_payment_order_aud.external_order_id
    description: External order id from the payment system.
  id_advance_payment:
    lineage:
    - datalake_rental_transact_raw.advance_payment_order_aud.advance_payment_id
    description: Foreign key reference to the advance payment.
  id_external_charge:
    lineage:
    - datalake_rental_transact_raw.advance_payment_order_aud.external_charge_id
    description: External charge id from the payment system.
  rev:
    lineage:
    - datalake_rental_transact_raw.advance_payment_order_aud.rev
    description: Revision number for this audit entry.
  revend:
    lineage:
    - datalake_rental_transact_raw.advance_payment_order_aud.revend
    description: End revision number for this audit entry.
  revtype:
    lineage:
    - datalake_rental_transact_raw.advance_payment_order_aud.revtype
    description: "Type of revision (0=ADD, 1=MOD, 2=DEL)."
  status:
    lineage:
    - datalake_rental_transact_raw.advance_payment_order_aud.status
    description: Current status of the advance payment order.
  installments:
    lineage:
    - datalake_rental_transact_raw.advance_payment_order_aud.installments
    description: Number of installments for this payment order.
  payment_amount:
    lineage:
    - datalake_rental_transact_raw.advance_payment_order_aud.payment_amount
    description: Monetary value of the payment transaction in local currency.
  unique_hash:
    lineage:
    - datalake_rental_transact_raw.advance_payment_order_aud.unique_hash
    description: Unique hash identifier for the order.
  mod_ts_paid:
    lineage:
    - datalake_rental_transact_raw.advance_payment_order_aud.paid_at_mod
    description: Flag indicating if paid_at was modified in this revision.
  mod_status:
    lineage:
    - datalake_rental_transact_raw.advance_payment_order_aud.status_mod
    description: Flag indicating if status was modified in this revision.
  mod_payment_method:
    lineage:
    - datalake_rental_transact_raw.advance_payment_order_aud.payment_method_mod
    description: Flag indicating if payment_method was modified in this revision.
  mod_installments:
    lineage:
    - datalake_rental_transact_raw.advance_payment_order_aud.installments_mod
    description: Flag indicating if installments was modified in this revision.
  mod_payment_amount:
    lineage:
    - datalake_rental_transact_raw.advance_payment_order_aud.payment_amount_mod
    description: Flag indicating if payment_amount was modified in this revision.
  ts_created:
    lineage:
    - datalake_rental_transact_raw.advance_payment_order_aud.created_at
    description: Timestamp when the order was originally created.
  ts_updated:
    lineage:
    - datalake_rental_transact_raw.advance_payment_order_aud.updated_at
    description: Timestamp when the order was last updated.
  ts_paid:
    lineage:
    - datalake_rental_transact_raw.advance_payment_order_aud.paid_at
    description: Timestamp when the order was paid.
