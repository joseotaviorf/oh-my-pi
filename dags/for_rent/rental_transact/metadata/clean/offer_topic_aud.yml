---
database_name: datalake_rental_transact_clean
table_name: offer_topic_aud
description: This table consolidates the audition of offer topic information related to the ForRent operation.
  Each line should be unique audition identified by the rev column.
domain: For Rent
owner: gustavo.brunelli@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_rental_transact_raw.offer_topic_aud.id
    description: Surrogate key identifying this offer topic aud record in the rental_transact pipeline.
  uuid_offer_topic:
    lineage:
      - datalake_rental_transact_raw.offer_topic_aud.offer_topic_uuid
    description: Global UUID identifying a negotiation topic thread within a rental offer.
  id_offer:
    lineage:
      - datalake_rental_transact_raw.offer_topic_aud.offer_id
    description: Surrogate key of the parent rental offer that owns this negotiation topic.
  id_firestore:
    lineage:
      - datalake_rental_transact_raw.offer_topic_aud.firestore_id
    description: Document identifier of the topic in the Firestore negotiation store.
  rev:
    lineage:
      - datalake_rental_transact_raw.offer_topic_aud.rev
    description: Revision of the offer topic, unique id of the modification. Can be joined with table rev_info to get more details.
  rev_end:
    lineage:
      - datalake_rental_transact_raw.offer_topic_aud.revend
    description: Id of the revision that replaced the current entry.
  rev_type:
    lineage:
      - datalake_rental_transact_raw.offer_topic_aud.revtype
    description: Envers operation type for this revision (insert, update, or delete).
    categories:
      '0': Create
      '1': Update
      '2': Delete
  status:
    lineage:
      - datalake_rental_transact_raw.offer_topic_aud.status
    description: Lifecycle stage of the negotiation topic (open, resolved, or closed).
  type:
    lineage:
      - datalake_rental_transact_raw.offer_topic_aud.type
    description: Subject of the negotiation thread, such as price, repairs, or property changes.
    categories:
      PRICE: Topic related to rental price negotiation.
      ADD: Topic related to add something in the house.
      REPAIR: Topic related to repair something of the house.
      MODIFY: Topic related to modify something of the house.
      REMOVE: Topic related to remove something of the house.
  mod_status:
    lineage:
      - datalake_rental_transact_raw.offer_topic_aud.status_mod
    description: Boolean flag indicating if the status column was updated in the revision.
  ts_created:
    lineage:
      - datalake_rental_transact_raw.offer_topic_aud.created_at
    description: Timestamp of the offer topic creation.
  ts_updated:
    lineage:
      - datalake_rental_transact_raw.offer_topic_aud.updated_at
    description: Timestamp of the offer topic update.
