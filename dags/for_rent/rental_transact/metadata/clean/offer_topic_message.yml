---
database_name: datalake_rental_transact_clean
table_name: offer_topic_message
description: This table consolidates offer topic message information related to the ForRent operation.
  Each line should be unique and identified by the id column.
domain: For Rent
owner: gustavo.brunelli@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_rental_transact_raw.offer_topic_message.id
    description: Surrogate key identifying a single message posted within an offer topic thread.
  uuid_offer_topic_message:
    lineage:
      - datalake_rental_transact_raw.offer_topic_message.offer_topic_message_uuid
    description: Business UUID identifying a message within an offer topic thread.
  id_offer_topic:
    lineage:
      - datalake_rental_transact_raw.offer_topic_message.offer_topic_id
    description: Foreign key to the negotiation topic this message belongs to.
  id_firestore:
    lineage:
      - datalake_rental_transact_raw.offer_topic_message.firestore_id
    description: Document identifier of the message in the Firestore negotiation store.
  comment:
    lineage:
      - datalake_rental_transact_raw.offer_topic_message.comment
    description: Free-text note written by the tenant or owner during topic negotiation.
  iteration:
    lineage:
      - datalake_rental_transact_raw.offer_topic_message.iteration
    description: Negotiation round number when this message was posted in the topic thread.
  actor_role:
    lineage:
      - datalake_rental_transact_raw.offer_topic_message.actor_role
    description: "Message author's role on the negotiation."
    categories:
      SUPPLY: Owner.
      DEMAND: Tenant prospect.
  proposed_rent_value:
    lineage:
      - datalake_rental_transact_raw.offer_topic_message.proposed_rent_value
    description: Monthly rent amount proposed in this message, in local currency.
  ts_created:
    lineage:
      - datalake_rental_transact_raw.offer_topic_message.created_at
    description: Timestamp of the offer topic message creation.
  ts_updated:
    lineage:
      - datalake_rental_transact_raw.offer_topic_message.updated_at
    description: Timestamp of the offer topic message update.
