dag:
  name: rental_transact
  schedule_start_date: 2024, 7, 1
  schedule_interval: 30 1 * * *
  owner: Data ForRent
  documentation:
    dag_purpose: |
      This DAG retrieves data from the Rental Offer project (database rental_transact), which is a source of ForRent offers and negotiation.
workflow:
  type: cdc
  layer: raw
  database_type: postgres
  source_schema: public
  dbutils_secret_key: RENTAL_TRANSACT_DB
  has_clean_soft_delete: true
  tables_customization:
    event_log:
      clean_table_name: event_log
      raw_primary_keys: [id]
      clean_primary_keys: [id]
    offer:
      clean_table_name: offer
      raw_primary_keys: [id]
      clean_primary_keys: [id]
    offer_aud:
      clean_table_name: offer_aud
    offer_topic:
      clean_table_name: offer_topic
      raw_primary_keys: [id]
      clean_primary_keys: [id]
    offer_topic_aud:
      clean_table_name: offer_topic_aud
    offer_topic_message:
      clean_table_name: offer_topic_message
      raw_primary_keys: [id]
      clean_primary_keys: [id]
    offer_topic_message_aud:
      clean_table_name: offer_topic_message_aud
    resident_info:
      clean_table_name: resident_info
      raw_primary_keys: [id]
      clean_primary_keys: [id]
    resident_info_aud:
      clean_table_name: resident_info_aud
    revinfo:
      clean_table_name: rev_info
      raw_primary_keys: [rev]
      clean_primary_keys: [rev]
    transact_flow:
      clean_table_name: transact_flow
      raw_primary_keys: [id]
      clean_primary_keys: [id]
    transact_flow_aud:
      clean_table_name: transact_flow_aud
      raw_primary_keys: [id]
      clean_primary_keys: [id]
cluster:
  type: databricks_13_3_med_memory_2_workers_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
