dag:
  name: enrich_rental_transact
  schedule_start_date: 2025, 1, 22
  owner: Data ForRent
  documentation:
    dag_purpose: This DAG creates the enriched tables of the Offer context from Rental Transact database.
workflow:
  type: query_delta
  layer: enrich
  default_extraction_type: incremental
  default_partitions: [year, month, day]
cluster:
  type: databricks_12_2_min_io-memory_photon_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
