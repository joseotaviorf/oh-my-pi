---
database_name: datalake_rental_transact
table_name: offer
description: Enrich table for the offers from Rental Transact database.
domain: For Rent
owner: gustavo.brunelli@quintoandar.com.br
columns:
  id_offer:
    lineage:
      - datalake_rental_transact_clean.offer.id
    description: Offer identifier from Rental Transact database.
  id_offer_topic:
    lineage:
      - datalake_rental_transact_clean.offer_topic.id
    description: Identifier of the negotiation topic thread linked to this rental offer.
  id_firestore:
    lineage:
      - datalake_rental_transact_clean.offer.id_firestore_offer
    description: Document identifier of the offer in the Firestore operational store.
  id_tenant:
    lineage:
      - datalake_rental_transact_clean.offer.id_tenant_external
    description: House tenant user ID.
  id_owner:
    lineage:
      - datalake_rental_transact_clean.offer.id_owner_external
    description: House owner user ID.
  id_house:
    lineage:
      - datalake_rental_transact_clean.offer.id_house_external
    description: House identifier from Rental Transact database.
  original_condo:
    lineage:
      - datalake_ebdb_clean.house.condo
    description: Original condominium value.
  original_home_insurance:
    lineage:
      - datalake_ebdb_clean.house.insurance_value
    description: Original house insurance value.
  original_iptu:
    lineage:
      - datalake_ebdb_clean.house.iptu
    description: Monthly property tax (IPTU) amount from the listing before negotiation began.
  original_rent:
    lineage:
      - datalake_rental_transact_clean.offer.original_rent_value
    description: "Monthly rent amount proposed on the listing before counter-offers started."
  payment_flow_type:
    lineage:
      - datalake_rental_transact_clean.offer.payment_flow_type
    description: Defines whether the tenant pays via standard billing or advance payment checkout.
    categories:
      NONE: No payment flow type specified.
      ADVANCE_PAYMENT: Payment flow uses advance payment.
  original_iptu_value:
    lineage:
      - datalake_rental_transact_clean.offer.original_iptu_value
    description: Original IPTU (property tax) value from the offer.
  original_condominium_value:
    lineage:
      - datalake_rental_transact_clean.offer.original_condominium_value
    description: Original condominium fee value before offer negotiation.
  original_home_insurance_value:
    lineage:
      - datalake_rental_transact_clean.offer.original_home_insurance_value
    description: Monthly residential insurance premium from the listing before negotiation began.
  original_tenant_service_fee_value:
    lineage:
      - datalake_rental_transact_clean.offer.original_tenant_service_fee_value
    description: Tenant service fee charged on the listing before any offer adjustments.
  rent:
    lineage:
      - datalake_rental_transact_clean.offer_topic_message.proposed_rent_value
      - datalake_rental_transact_clean.offer.original_rent_value
    description: Last proposed offer rent value.
  status:
    lineage:
      - datalake_rental_transact_clean.offer.status
    description: Current processing state of the record in the source workflow.
  turn:
    lineage:
      - datalake_rental_transact_clean.offer.turn
    description: Indicates whose turn it is.
    categories:
      SUPPLY: Owner's turn.
      DEMAND: Tenant's turn.
  iteration:
    lineage:
      - datalake_rental_transact_clean.offer.iteration
    description: "Current counter-offer round number within the rental negotiation thread."
  rejection_reason:
    lineage:
      - datalake_rental_transact_clean.offer.rejection_reason
    description: Business reason recorded when the landlord or tenant declined the offer.
  type:
    lineage:
      - datalake_rental_transact_clean.offer.type
    description: Classification code defining the entity role or category.
  number_of_cohabitants:
    lineage:
      - datalake_rental_transact_clean.resident_info.number_of_cohabitants
    description: Number of cohabitants including the tenant.
  tenant_description:
    lineage:
      - datalake_rental_transact_clean.resident_info.introduction
    description: Tenant description manually filled by the tenant.
  qtd_topics_negotiated:
    description: Number of topics negotiated.
  first_rent_offered_by_tenant:
    lineage:
      - datalake_rental_transact_clean.offer_topic_message_aud.proposed_rent_value
    description: First rent value proposed by the tenant prospect.
  first_rent_offered_by_owner:
    lineage:
      - datalake_rental_transact_clean.offer_topic_message_aud.proposed_rent_value
    description: First rent value proposed by the owner.
  last_rent_offered_by_tenant:
    lineage:
      - datalake_rental_transact_clean.offer_topic_message_aud.proposed_rent_value
    description: Last rent value proposed by the tenant prospect.
  last_rent_offered_by_owner:
    lineage:
      - datalake_rental_transact_clean.offer_topic_message_aud.proposed_rent_value
    description: Last rent value proposed by the owner.
  last_proposed_rent_value:
    lineage:
      - datalake_rental_transact_clean.offer_topic_message_aud.proposed_rent_value
    description: Last rent value proposed by any actor.
  ts_first_iteration:
    lineage:
      - datalake_rental_transact_clean.offer_topic_message_aud.ts_created
    description: Timestamp of the first negotiation iteration.
  ts_last_iteration:
    lineage:
      - datalake_rental_transact_clean.offer_topic_message_aud.ts_created
    description: Timestamp of the last negotiation iteration.
  ts_created:
    lineage:
      - datalake_rental_transact_clean.offer.ts_created
    description: Timestamp of the offer creation.
  ts_updated:
    lineage:
      - datalake_rental_transact_clean.offer.ts_updated
    description: Timestamp of the offer last update.
  ts_expiration:
    lineage:
      - datalake_rental_transact_clean.offer.ts_expiration
    description: Timestamp of when the offer expirates.
  ts_analyzed:
    lineage:
      - datalake_rental_transact_clean.rev_info.ts_rev
    description: Timestamp of the first time the offer was analyzed by the owner (REJECTED or ACCEPTED).
  year:
    description: "Year of the offer creation. It's also a table partition."
  month:
    description: "Month of the offer creation. It's also a table partition."
  day:
    description: "Day of the offer creation. It's also a table partition."
