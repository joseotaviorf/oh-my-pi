---
database_name: datalake_rental_transact
table_name: offer_topic_message
description: Enrich table for the offers topic messages from Rental Transact database.
domain: For Rent
owner: gustavo.brunelli@quintoandar.com.br
columns:
  id_topic_message:
    lineage:
      - datalake_rental_transact_clean.offer_topic_message.id
    description: Identifier of a single message posted within an offer negotiation topic.
  uuid_offer_topic_message:
    lineage:
      - datalake_rental_transact_clean.offer_topic_message.uuid_offer_topic_message
    description: Business UUID identifying a message within an offer negotiation topic.
  id_offer_topic:
    lineage:
      - datalake_rental_transact_clean.offer_topic_message.id_offer_topic
    description: Identifier of the negotiation topic that groups related offer messages.
  id_firestore:
    lineage:
      - datalake_rental_transact_clean.offer_topic_message.id_firestore
    description: Document identifier of the topic message in the Firestore operational store.
  iteration:
    lineage:
      - datalake_rental_transact_clean.offer_topic_message.iteration
    description: Offer topic iteration number.
  max_topic_iteration:
    lineage:
      - datalake_rental_transact_clean.offer_topic_message.iteration
    description: Last topic iteration number of this offer.
  actor_role:
    lineage:
      - datalake_rental_transact_clean.offer_topic_message.actor_role
    description: Role of the actor responsible for the iteration.
  proposed_rent_value:
    lineage:
      - datalake_rental_transact_clean.offer_topic_message.proposed_rent_value
    description: Proposed rent value on this iteration.
  comment:
    lineage:
      - datalake_rental_transact_clean.offer_topic_message.comment
    description: "Free-text note left by the actor on this negotiation iteration."
  ts_created:
    lineage:
      - datalake_rental_transact_clean.offer_topic_message.ts_created
    description: Timestamp of when the message was created.
  ts_updated:
    lineage:
      - datalake_rental_transact_clean.offer_topic_message.ts_updated
    description: Timestamp of when the message was updated.
  year:
    description: Year of the offer topic message creation. It's also a table partition.
  month:
    description: Month of the offer topic message creation. It's also a table partition.
  day:
    description: Day of the offer topic message creation. It's also a table partition.
