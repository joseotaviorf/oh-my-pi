dag:
  name: dw_listing
  schedule_start_date: 2021,08,02
  owner: Data ForSale
workflow:
  type: query_delta
  layer: dw
  custom_schema: rent
  default_partitions: [country_code]
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, ds, 'load_end_date') }}"
  inner_dependencies:
    fact_house_listing_daily_infos:
    - fact_house_listing_daily_available_hours
  tables_customization:
    dim_condo:
      partitions: []
      custom_schema: public
    fact_house_listing_daily_infos:
      partitions: ["country_code", "year", "month", "day"]
      extraction_type: incremental
    fact_house_listing_daily_available_hours:
      partitions: ["year", "month", "day"]
      extraction_type: incremental
      custom_schema: listing
cluster:
  type: custom_cluster
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE
  databricks_conn_id: databricks_new
  custom_configurations:
    driver_node_type_id: m5d.2xlarge
    node_type_id: c7i.2xlarge
    num_workers: 3
    runtime_engine: PHOTON
    spark_version: 12.2.x-scala2.12
    aws_attributes:
      ebs_volume_size: 200
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.sql.shuffle.partitions: 220
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
