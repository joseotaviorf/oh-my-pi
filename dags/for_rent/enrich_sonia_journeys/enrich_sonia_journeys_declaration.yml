---
dag:
  name: enrich_sonia_journeys
  owner: Data ForRent
  schedule_start_date: 2026, 4, 8
  documentation:
    dag_purpose: |
      Non-materialized enrich views for Sonia journeys.
      Includes contract closing, docs demand resend and docs rejection journeys with context enrichment
      and deterministic binning for experiments.
workflow:
  type: query_view
  layer: enrich
  sync: [databricks, trino]
  sql_dialect: databricks
cluster:
  type: databricks_16_4_xmin_view_cluster
  databricks_conn_id: databricks_new_env
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: "quintoandar_{{ var.value.environment }}"
