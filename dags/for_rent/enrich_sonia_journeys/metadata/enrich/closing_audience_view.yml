---
database_name: datalake_sonia_journeys
table_name: closing_audience_view
description: |
  Enrich view for Sonia closing journey. One row per contract signatory
  from rent_flow_tenant_contract_sent and rent_flow_owner_contract_sent CDP events
  (from 2026-04-24 onward). Joins later "signed" and "canceled" related events,
  besides EBDB house address. Covers all signatories regardless of eligibility;
  the is_participant flag marks those meeting Sonia entry criteria. Feeds SFMC
  for follow-up closing communications.
domain: For Rent
owner: gustavo.brunelli@quintoandar.com.br
columns:
  pk_rent_flow_person:
    lineage:
      - datalake_cdp_clean.transactional.event_properties
    description: "Synthetic primary key concatenating id_rent_flow and id_contract_person, uniquely identifying one signatory row per rent flow per contract person."
  id_house:
    lineage:
      - datalake_cdp_clean.transactional.event_properties
    description: House identifier parsed from the id_house field of the contract-sent event payload.
  id_contract:
    lineage:
      - datalake_cdp_clean.transactional.event_properties
    description: Contract identifier parsed from the id_contract field of the contract-sent event payload.
  id_contract_person:
    lineage:
      - datalake_cdp_clean.transactional.event_properties
    description: Contract person identifier from id_contract_person in the event payload. Join key to closing_contract_person_view.
  id_rent_flow:
    lineage:
      - datalake_cdp_clean.transactional.event_properties
    description: Rent flow UUID string parsed from the id_rent_flow field of the contract-sent event payload.
  uuid_person:
    lineage:
      - datalake_cdp_clean.transactional.event_properties
    description: "Person UUID of the signatory parsed from the uuid_person field of the event payload. Nullable when the signatory has no platform account. Nullability drives contract-level gate evaluation: a contract where every signatory is non-null satisfies Gate 1; a contract with any null satisfies Gate 2."
  address_text:
    lineage:
      - datalake_ebdb_clean.house.address
      - datalake_ebdb_clean.house.number
    description: House street address and number concatenated as a display string, sourced from EBDB house table.
  user_role:
    lineage:
      - datalake_cdp_clean.transactional.event_name
    description: Signatory role in the contract. Either tenant or owner, derived from the CDP source event name.
  is_canceled:
    lineage:
      - datalake_cdp_clean.transactional.event_name
      - datalake_cdp_clean.transactional.ts_event
    description: "True when a rent_flow_contract_canceled event exists for the same rent flow. Contract-level cancellation flag applied to all signatories."
  is_signed:
    lineage:
      - datalake_cdp_clean.transactional.event_name
      - datalake_cdp_clean.transactional.event_properties
      - datalake_cdp_clean.transactional.ts_event
    description: |
      True when the MAX timestamp of rent_flow_tenant_contract_signed or rent_flow_owner_contract_signed
      events for the same rent flow and contract person is strictly after ts_last_sent.
  is_removed:
    lineage:
      - datalake_cdp_clean.transactional.event_name
      - datalake_cdp_clean.transactional.event_properties
      - datalake_cdp_clean.transactional.ts_event
    description: |
      True when an owner_removed_from_contract or tenant_removed_from_contract mainstreamer event
      exists for the same id_contract_person with ts_event strictly after ts_last_sent.
  is_participant:
    lineage:
      - datalake_cdp_clean.transactional.event_properties
    description: "True when the signatory meets any of the three independently-expandable Sonia Closing gates (OR logic): Gate 0 (number_of_signatories = 2, independently tunable threshold), Gate 1 (all signatories in the contract are registered, i.e. every uuid_person NOT NULL), or Gate 2 (the contract has at least one unregistered signatory, i.e. any uuid_person IS NULL). Gates 1 and 2 are evaluated at contract level — every signatory row in the contract inherits the same gate result. Thresholds are constants in the SQL (0-100, 0 = blocked, 100 = fully open); raise each independently to expand that audience segment without retroactively changing earlier buckets."
  n_sent:
    lineage:
      - datalake_cdp_clean.transactional.event_name
    description: Number of contract-sent events fired for this rent flow and contract person. Greater than 1 indicates resends.
  ts_first_sent:
    lineage:
      - datalake_cdp_clean.transactional.ts_event
    description: "Timestamp of the earliest contract-sent event for this signatory, formatted as yyyy-MM-dd HH:mm:ss."
  ts_last_sent:
    lineage:
      - datalake_cdp_clean.transactional.ts_event
    description: "Timestamp of the most recent contract-sent event for this signatory, formatted as yyyy-MM-dd HH:mm:ss."
  ts_canceled:
    lineage:
      - datalake_cdp_clean.transactional.ts_event
    description: "Timestamp of the rent_flow_contract_canceled event formatted as yyyy-MM-dd HH:mm:ss. Null when no cancellation occurred after ts_sent."
  ts_signed:
    lineage:
      - datalake_cdp_clean.transactional.ts_event
    description: |
      Timestamp of the per-signatory contract-signed event formatted as yyyy-MM-dd HH:mm:ss.
      Null when this signatory has not yet signed after ts_sent.
  ts_removed:
    lineage:
      - datalake_cdp_clean.transactional.ts_event
    description: |
      Timestamp of the events indicating signatory removal formatted as yyyy-MM-dd HH:mm:ss. 
      Null when the signatory was not removed or removal occurred before ts_sent.
