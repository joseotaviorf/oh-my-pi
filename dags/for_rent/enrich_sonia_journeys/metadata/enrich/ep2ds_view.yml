database_name: datalake_sonia_journeys
table_name: ep2ds_view
description: |
  Enrich view for Sonia ep2ds journey, returning users with positive rent flow credit
  events that still do not have documentation submitted or documentation canceled.
domain: For Rent
owner: data-for-rent@quintoandar.com.br
columns:
  pk_event_user:
    lineage:
      - datalake_cdp_clean.transactional.id_event
      - datalake_cdp_clean.transactional.id_person
    description: Primary key concatenating id_event and uuid_user.
  id_event:
    lineage:
      - datalake_cdp_clean.transactional.id_event
    description: CDP event identifier from rent flow credit positive events.
  id_rent_flow:
    lineage:
      - datalake_cdp_clean.transactional.event_properties
    description: Rent flow identifier from rent flow credit positive events.
  id_user:
    lineage:
      - datalake_cdp_clean.transactional.id_user
    description: User identifier associated with the rent flow event.
  uuid_user:
    lineage:
      - datalake_cdp_clean.transactional.id_person
    description: User UUID (id_person) associated with the rent flow event.
  id_proposal:
    lineage:
      - datalake_cdp_clean.transactional.event_properties.id_documentation
    description: Proposal documentation identifier from credit positive event properties.
  documentation_url:
    lineage:
      - datalake_cdp_clean.transactional.event_properties.id_documentation
    description: Sonia documentation link built from id_proposal with fixed Sonia tracking parameters.
  id_house:
    lineage:
      - datalake_cdp_clean.transactional.event_properties.id_house
    description: House identifier associated with the rent flow.
  is_active_rent_flow:
    lineage:
      - datalake_cdp_clean.transactional.event_name
    description: Indicates whether the rent flow is active based on absence of documentation canceled event.
  documentation_sent:
    lineage:
      - datalake_cdp_clean.transactional.event_name
    description: Indicates whether documentation submitted event exists for the rent flow.
  has_answered:
    lineage:
      - datalake_copilot_service_clean.session.id_user
      - datalake_copilot_service_clean.session.ts_created
      - datalake_copilot_service_clean.message.channel
      - datalake_cdp_clean.transactional.ts_event
    description: Indicates whether the user has answered Sonia WhatsApp after the positive evaluation timestamp.
  user_email:
    lineage:
      - datalake_ebdb_clean.user.email
    description: User email address.
  user_phone:
    lineage:
      - datalake_ebdb_clean.user.main_phone
    description: User phone number.
  user_first_name:
    lineage:
      - datalake_ebdb_clean.user.name
    description: User first name extracted from the full EBDB user name.
  address_text:
    lineage:
      - datalake_ebdb_clean.house.address
      - datalake_ebdb_clean.house.number
    description: Concatenated house street address and number.
  binning_value:
    lineage:
      - datalake_cdp_clean.transactional.id_person
    description: Deterministic 0-99 hash bucket of uuid_user for experiment split assignment.
  ts_evaluation_positive:
    lineage:
      - datalake_cdp_clean.transactional.ts_event
      - datalake_cdp_clean.transactional.event_name
    description: Latest timestamp of rent flow credit positive event.
  ts_documentation_sent:
    lineage:
      - datalake_cdp_clean.transactional.ts_event
      - datalake_cdp_clean.transactional.event_name
      - datalake_cdp_clean.transactional.event_properties.id_rent_flow
    description: Latest documentation submitted event timestamp for the rent flow.
