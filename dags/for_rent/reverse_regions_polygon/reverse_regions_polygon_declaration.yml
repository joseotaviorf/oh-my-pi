dag:
  name: reverse_regions_polygon
  schedule_start_date: 2022,7,12
  owner: Data ForRent
  documentation:
    dag_purpose: |
      Creates geo json files for polygons of the regions from ebdb and saves
      them in a s3 bucket.
      To create this geojson file, it uses Apache Sedona libs to get some functions to use in query (ST_PolygonFromText, ST_AsGeoJSON).
      And then creates the topojson file to upload it to 5a-looker bucket.
      This file has a polygon data of the sk_regions that we use.
workflow:
  type: access
  layer: reverse
  load_spark_job: create_regions_polygon_topojson
  spark_job_arguments:
  - "{environment}"
  - "{bucket}"
  - "{dag_name}"   # dag_name
  - "regions_polygon"   #source
  - "s3://5a-looker/subregion_polygons_new"   # output_file_path
  - "5a_subregion_polygons.topojson"   # output_file_name
  - "{{ data_interval_start | ds }}"   # execution_date
  tables_customization:
    regions_polygon_topojson: {}
