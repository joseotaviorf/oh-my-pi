dag:
  name: reverse_regions_polygon
  schedule_start_date: 2022,7,12
  owner: Data ForRent
  documentation:
    dag_purpose: |
      Creates geo json files for polygons of the regions from ebdb and saves
      them in a s3 bucket.
      To create this geojson file, it uses Apache Sedona libs to get some functions to use in query (ST_PolygonFromText, ST_AsGeoJSON).
      And then creates the topojson file to upload it to 5a-looker bucket.
      This file has a polygon data of the sk_regions that we use.
workflow:
  type: access
  layer: reverse
  load_spark_job: create_regions_polygon_topojson
  spark_job_arguments:
  - "{environment}"
  - "{bucket}"
  - "{dag_name}"   # dag_name
  - "regions_polygon"   #source
  - "s3://5a-looker/subregion_polygons_new"   # output_file_path
  - "5a_subregion_polygons.topojson"   # output_file_name
  - "{{ ds }}"   # execution_date
  tables_customization:
    regions_polygon_topojson: {}
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: m5a.xlarge
    node_type_id: m5a.xlarge
    spark_version: 13.3.x-scala2.12
    num_workers: 2
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
  custom_libraries:
  - maven:
      coordinates: "org.apache.sedona:sedona-python-adapter-3.0_2.12:1.2.1-incubating"
  - maven:
      coordinates: "org.apache.sedona:sedona-viz-3.0_2.12:1.2.1-incubating"
  - maven:
      coordinates: "org.apache.sedona:sedona-viz-3.0_2.12:1.2.1-incubating"
  - maven:
      coordinates: "org.datasyslab:geotools-wrapper:1.3.0-27.2"
  - pypi:
      package: "pytopojson==1.0.0"
  - pypi:
      package: "apache-sedona"
  databricks_conn_id: databricks_new
