database_name: datalake_rental_historical_follow_up
table_name: house_weekly_entrance_info
description: Every line is a week for a property with entry history information.
domain: For Rent
owner: E ForRent@quintoandar.com.br
columns:
  id_house:
    lineage:
    - datalake_ebdb_clean.house.id
    description: House ID.
  house_entrance_history:
    lineage:
    - datalake_ebdb_clean.house_aud.doorman_type
    description: What type of operation related to the doorman activity.
    categories:
      Diurno: ''
      horas24: ''
      NaoHaPorteiro: ''
      None: ''
      Noturno: ''
  key_location_history:
    lineage:
    - datalake_ebdb_clean.access_authorization_type.name
    description: Where the key is located in a certain week.
    categories:
      KeysWithAgent: ''
      Password: ''
      OwnerPresent: ''
      KeysLocker: ''
      None: ''
      FrontDoor: ''
      LockBox: ''
  key_type_history:
    lineage:
    - datalake_ebdb_clean.key_type.name
    description: What type of key is necessary to access the house in a certain week.
    categories:
      Password: ''
      None: ''
      Common: ''
      Biometry: ''
  who_is_living_history:
    lineage:
    - datalake_ebdb_clean.occupant_type.name
    description: Who is living in this house listing in a certain week.
    categories:
      Tenant: ''
      Empty: ''
      Owner: ''
      None: ''
  dt_week_start:
    lineage:
    - datalake_quintoandar.aux_date.week_start
  dt_week_end:
    lineage:
    - datalake_quintoandar.aux_date.week_end
  dt_week_ended:
    description: Week end date (always a sunday).
  dt_week_started:
    description: Week start date (always a monday).
