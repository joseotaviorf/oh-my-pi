database_name: datalake_rental_historical_follow_up
table_name: house_weekly_entrance_info
description: Every line is a week for a property with entry history information.
domain: For Rent
owner: E ForRent@quintoandar.com.br
columns:
  id_house:
    lineage:
      - datalake_ebdb_clean.house.id
    description: House ID.
  house_entrance_history:
    lineage:
      - datalake_ebdb_clean.house_aud.doorman_type
    description: What type of operation related to the doorman activity.
    categories:
      Diurno: Doorman present only during the day.
      horas24: Doorman present 24 hours a day.
      NaoHaPorteiro: No doorman.
      None: Unknown.
      Noturno: Doorman present only at night.
  key_location_history:
    lineage:
      - datalake_ebdb_listing.house_entrance_history.key_location
    description: Where the key is located in a certain week.
    categories:
      FrontDoor: Key is located at front door.
      KeysLocker: Keys Locker.
      KeysWithAgent: Keys is located with agent.
      LockBox: Key is located at Lockbox.
      None: Unknown.
      OwnerPresent: The key is located with the Owner.
      Password: Password.
  key_type_history:
    lineage:
      - datalake_ebdb_listing.house_entrance_history.key_type
    description: What type of key is necessary to access the house in a certain week.
    categories:
      Biometry: Biometry
      Common: Regular key
      None: Unknown
      Password: Password
  who_is_living_history:
    lineage:
      - datalake_ebdb_listing.house_entrance_history.occupant_type
    description: Who is living in this house listing in a certain week.
    categories:
      Tenant: 'The tenant is living in the house'
      Empty: 'The house is empty'
      Owner: 'The owner is living in the house'
      None: ''
  dt_week_ended:
    description: Week end date (always a sunday).
    lineage:
      - datalake_quintoandar.aux_date.week_end
  dt_week_started:
    description: Week start date (always a monday).
    lineage:
    - datalake_quintoandar.aux_date.week_start
