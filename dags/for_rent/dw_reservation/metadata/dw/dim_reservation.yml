database_name: dw_rent
table_name: dim_reservation
description: QuintoAndar allows tenants to reserve properties by making a payment.
  Each line is a reservation attempt. This table contains just rent context.
  The source of the data comes from kill_queue microservice
domain: For Rent
owner: gustavo.brunelli@quintoandar.com.br
columns:
  sk_reservation:
    lineage:
    - datalake_kill_queue.reservation.id_reservation
    description: Unique ID of reservation from kill queue, it's the primary key of this table.
  id_reservation:
    lineage:
    - datalake_kill_queue.reservation.id_reservation
    description: Unique ID of reservation from kill queue, it's the same as the primary key of this table.
  version:
    lineage:
    - datalake_kill_queue.reservation.version
    description: Optimistic locking revision counter for concurrent update safety.
  attempt:
    lineage:
    - datalake_kill_queue.reservation.attempt
    description: Number of tries of user.
  status:
    lineage:
    - datalake_kill_queue.reservation.status
    description: Current lifecycle status of the rental reservation in Kill Queue.
    categories:
      CANCELED: Rent flow was interrupted at some point.
      CHARGED: The value was charged from customer.
      FAILED: The charging failed.
      FINISHED: Rent flow completed, contract was signed.
      RETURNED: Value was returned to the customer.
      START: Reservation has just started, credit card info wasn't filled yet.
      TOKEN_RECEIVED: Credit card info sent to MundiPagg and authorization token was saved.
  cancellation_reason:
    lineage:
    - datalake_kill_queue.reservation.cancellation_reason
    description: Reason why reservation was cancelled if status is equal to 'CANCELED' or 'RETURNED'.
  value:
    lineage:
    - datalake_kill_queue.reservation.value
    description: Value paid by tentant for the reservation fee.
  installments:
    lineage:
    - datalake_kill_queue.reservation.installments
    description: Number of installments in which the reservation value was divided.
  is_ongoing:
    lineage:
    - datalake_kill_queue.reservation.is_ongoing
    description: Flag which indicates if reservation is still open (when status is either equal to 'CHARGED' or 'TOKEN_RECEIVED').
  ts_created:
    lineage:
    - datalake_kill_queue.reservation.ts_created
    description: Timestamp of when reservation was created.
  ts_updated:
    lineage:
    - datalake_kill_queue.reservation.ts_updated
    description: Timestamp of when the reservation was updated.
