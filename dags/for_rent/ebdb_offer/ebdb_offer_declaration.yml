dag:
  name: ebdb_offer
  schedule_start_date: 2021, 2, 20
  schedule_interval: 30 21,8,12,14,16 * * *
  owner: Data ForRent
  documentation:
    dag_purpose: Extraction of EBDB tables related to Offer into data lake. EBDB is the main database for QuintoAndar.
workflow:
  type: cdc
  layer: raw
  custom_schema: ebdb
  database_type: mysql
  source_database: ebdb
  source_schema: ebdb
  tables_customization:
    InstantOffer:
      clean_table_name: instant_offer
    InstantOffer_AUD:
      clean_table_name: instant_offer_aud
    Offer:
      clean_table_name: offer
    Offer_AUD:
      clean_table_name: offer_aud
  extra_query_template_params:
    load_end_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, 1), 'load_end_date') }}"
cluster:
  type: databricks_16_4_med_general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
