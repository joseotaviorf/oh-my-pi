database_name: datalake_signatures_test_clean
table_name: recipient
description: This table contains the information about the recipient.
domain: For Rent
owner: kleber.inoue@quintoandar.com.br
columns:
  id:
    description: The unique identifier for the recipient.
    lineage:
      - datalake_signatures_test_raw.recipient.id
  id_internal_reference:
    description: The unique identifier for the internal reference.
    lineage:
      - datalake_signatures_test_raw.recipient.internal_reference_id
  id_external_reference:
