---
table_name: dw_public.dim_house_listing
alert_channel: "#alerts-de-airflow-dags"
table_level_validations:
  has_size:
    greater_than: 1500000
    severity_level: Error
column_level_validations:
  sk_house_listing:
    is_complete:
      severity_level: Error
    is_unique:
      severity_level: Error
  id_house:
    has_completeness:
      greater_than: 0.99 # Won't be 100% because of the default row
  short_id_house:
    has_completeness:
      greater_than: 0.99 # Won't be 100% because of the default row
  consultant_type:
    has_completeness:
      greater_than: 0.99
