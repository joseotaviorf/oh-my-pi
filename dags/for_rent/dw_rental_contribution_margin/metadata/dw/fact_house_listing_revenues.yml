database_name: dw_rental_contribution_margin
table_name: fact_house_listing_revenues
description: |
  This table shows the revenues of each contract and competence month.
  Each row represents the revenues of the contract in a month. So we can have repeated
  ID contracs and ID house_listing
domain: For Rent
owner: gustavo.brunelli@quintoandar.com.br
columns:
  sk_house_listing_revenue:
    description:
      Primary key for the table. It is generated artificially in the ETL,
      so it has no meaning or correspondence in any product.
  id_contract:
    lineage:
    - datalake_invoice.invoice_entries.id_contract
    - datalake_revenue_lines.long_term_rental_anticipation.id_contract_ebdb
    - datalake_revenue_lines.rental_guarantee.id_contract
    - dw_rent.fact_listing_rent_flows.sk_contract
    description: Natural key that represents the contract ID.
  id_house_listing:
    lineage:
    - datalake_ebdb_listing.house_listing.id_house_listing
    - datalake_listing_contracts.listing_contracts.id_house_listing
    - datalake_revenue_lines.reservation.id_house_listing
    description: Natural key that represents the house listing ID.
  id_house:
    lineage:
    - datalake_ebdb_contract.contract.id_house
    - datalake_listing_contracts.listing_contracts.id_house
    - datalake_revenue_lines.reservation.id_house
    description: Natural key that represents the house ID.
  country_code:
    lineage:
      - datalake_ebdb_country.house.country_code
    description: ISO country code for geographic filtering of the analytical metric.
  contract_lifetime:
    description:
      The difference between the month when the contract started and competence
      month of the revenue.
  rent_value_invoice:
    description: Rent value of the contract charged from tenant.
  rental_management:
    description: Management fee value charged from landlord.
  rental_brokerage:
    description:
      First rental commission value. We receive this value just on the
      first competence month of the contract.
  insurance_commission:
    description: Home/fire insurance revenue.
  late_payments:
    description: LP (late payment) revenue.
  addons_service_fee:
    description: Service fee value charged from tenant.
  addons_mra:
    description: Extra MRA (month rental anticipation) revenue.
  addons_lra:
    description: Extra LRA (long term rental anticipation) revenue.
  addons_bfi:
    description: Extra BFI (brokerage finance) revenue.
  addons_ccp:
    description: Extra CCP (credit card payment) net revenue.
  addons_guarantee:
    description: Extra Rental Guarantee revenue. Excluding STANDALONE guarantee type.
  addons_new_business_revenue:
    description: Extra Rental Guarantee revenue. Including STANDALONE guarantee type.
  addons_reserve:
    description: Extra reservation revenue comes from kill_queue service.
  agents_commission:
    description: Agents commission share value that is passed to agents. It's the sum of 'rental agents' and 'ciq select' from brokerage share column. (Negative value).
  affiliates_commission:
    description: Affiliates commission share value that is passed to CIQ. (Negative value).
  partner_share_brokerage:
    description:
      Commission paid to affiliates/B2B partners. We receive this value
      just on the first competence month of the contract. (Negative value).
  partner_share_management:
    description: Administration fee paid to partners when the contract is linked with affiliates/B2B. (Negative value).
  net_revenue_pre_taxes:
    description: The net revenue calculated from all the revenues (gross_revenue + addons_revenue + total_revenue_discounts).
  gross_revenue:
    description: Gross revenue calculated by adding the management_fee, brokerage_fee, insurance_commission and addons revenues columns.
  addons_revenue_total:
    description: Addons revenue calculated by adding the addons_service_fee, addons_mra, addons_lra, addons_bfi, addons_ccp, addons_guarantee, addons_new_business_revenue, addons_reserve columns.
  revenue_share_total:
    description: Discount revenue calculated by adding the agents_commission, brokerage_partner_share, management_partner_share columns. This column has negative value.
  quarter:
    lineage:
      - dw_public.dim_date.quarter
    description: Quarter of the revenue's competence month.
  accrual_year_month:
    lineage:
      - datalake_retsuko.invoice.accrual_year_month
    description: Competence month of the revenue.
  dt_month_start:
    lineage:
      - dw_public.dim_date.month_start
    description: Month start date of the revenue's compentece month.
  ts_load:
    description: Time when the table was loaded.
