---
dag:
  name: enrich_ongoing_terminations_snapshot
  schedule_start_date: 2024, 7, 31
  owner: Data ForRent
  documentation:
    dag_purpose: This DAG creates a snapshot of the ongoing contract terminations.
workflow:
  type: query_delta
  layer: enrich
  tables_customization:
    ongoing_terminations_stock_snapshot:
      partitions:
      - year
      - month
      - day
cluster:
  type: databricks_12_2_med_general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
