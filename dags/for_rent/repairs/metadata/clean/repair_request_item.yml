database_name: datalake_repairs_clean
table_name: repair_request_item
description: |
  This table contains the repair request items for the repairs service.
  The table contains data related to repair requests and associated expenses.
  It includes details such as the description of the repair item, urgency status, and timestamps for creation and updates.
  This data can be used to track repair requests over time, analyze trends in repair expenses, and assess the urgency of various requests.
domain: For Rent
owner: gustavo.silva@quintoandar.com.br
columns:
  id:
    description: Unique identifier of the repair request line item record.
    lineage:
      - datalake_repairs_raw.repair_request_item.id
  id_expense:
    description: The unique identifier for the expense associated with the repair request item.
    lineage:
      - datalake_repairs_raw.repair_request_item.expense_id
  id_repair_request:
    description: The unique identifier for the repair request associated with the repair request item.
    lineage:
      - datalake_repairs_raw.repair_request_item.repair_request_id
  id_diagnosis:
    description: The unique identifier for the diagnosis associated with the repair request item.
    lineage:
      - datalake_repairs_raw.repair_request_item.diagnosis_id
  repair_item_description:
    description: Free-text description of the maintenance issue reported for this line.
    lineage:
      - datalake_repairs_raw.repair_request_item.description
  is_urgent:
    description: Legacy column meant to flag whether the repair affects habitability; not mapped by the current application entity, always defaults to false, and is no longer set by any active code path.
    lineage:
      - datalake_repairs_raw.repair_request_item.is_urgent
  responsible:
    description: Party responsible for paying or executing this repair line item.
    lineage:
      - datalake_repairs_raw.repair_request_item.responsible
  ts_created:
    description: Timestamp when the repair line item was created in Repairs.
    lineage:
      - datalake_repairs_raw.repair_request_item.created_at
  ts_updated:
    description: The timestamp for the update of the repair request item.
    lineage:
      - datalake_repairs_raw.repair_request_item.updated_at
  year:
    description: Year partition derived from the line item creation timestamp.
    lineage:
      - datalake_repairs_raw.repair_request_item.year
  month:
    description: Month partition derived from the line item creation timestamp.
    lineage:
      - datalake_repairs_raw.repair_request_item.month
  day:
    description: Day partition derived from the line item creation timestamp.
    lineage:
      - datalake_repairs_raw.repair_request_item.day
