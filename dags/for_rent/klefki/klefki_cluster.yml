cluster:
  type: consolidation_xs_memory_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
    num_workers: 3
    driver_node_type_id: r7g.2xlarge
    aws_attributes:
      ebs_volume_size: 200
validation:
  cluster:
    type: emr_7_12_consolidation_xs_memory_cluster
    custom_configurations:
      aws_attributes:
        ebs_volume_size: 200
      core_nodes:
        instance_count: 1
      task_nodes:
        instance_count: 2
      master_node_type_id: r7g.2xlarge
      spark_conf:
        spark.driver.memory: 12g
        spark.driver.memoryOverhead: 4g
        spark.yarn.am.memory: 2g
