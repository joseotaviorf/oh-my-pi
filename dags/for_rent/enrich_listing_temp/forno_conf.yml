---
tables:
  - table_name: dim_house_listing_house
    partitions: [country_code]
  - table_name: fact_listing_rent_flows_house
    partitions: [country_code]
  - table_name: fact_house_listings_house
    partitions: [country_code]
  - table_name: fact_house_listing_status_house
    partitions: [country_code]
  - table_name: house_listing_status_house
    partitions: [country_code]
  - table_name: house_listing
    partitions: [country_code]

custom_cluster:
  driver_node_type_id: m5a.2xlarge
  node_type_id: m5a.4xlarge
  num_workers: 3

inner_dependencies:
  dim_house_listing_house:
    - house_listing
  fact_listing_rent_flows_house:
    - dim_house_listing_house
  fact_house_listings_house:
    - house_listing
    - house_listing_status_house
  fact_house_listing_status_house:
    - house_listing_status_house
    - house_listing
  house_listing:
    - house_listing_status_house
