---
tables:
  - table_name: dim_house_listing_lbc
    partitions: [country_code]
  - table_name: fact_listing_rent_flows_lbc
    partitions: [country_code]
  - table_name: fact_house_listings_lbc
    partitions: [country_code]
  - table_name: fact_house_listing_status_lbc
    partitions: [country_code]
  - table_name: house_listing_status_lbc
    partitions: [country_code]
  - table_name: lbc_house_listing
    partitions: [country_code]

custom_cluster:
  driver_node_type_id: m4.xlarge
  node_type_id: m4.2xlarge
  autoscale:
    min_workers: 1
    max_workers: 3

inner_dependencies:
  dim_house_listing_lbc:
    - lbc_house_listing
  fact_listing_rent_flows_lbc:
    - dim_house_listing_lbc
  fact_house_listings_lbc:
    - lbc_house_listing
    - house_listing_status_lbc
  fact_house_listing_status_lbc:
    - house_listing_status_lbc
    - lbc_house_listing