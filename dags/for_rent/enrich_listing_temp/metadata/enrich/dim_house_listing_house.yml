      LOCKER: "Access through a locker"
      OWNER: "The key is with the owner"
      TENANT: "The key is with the tenant"
      INSPECTOR: "The key is with the inspector"
      PHOTOGRAPHER: "The key is with the photographer"
      AGENT: "The key is with the agent"
      EXTERNAL_RESPONSIBLE: "The key is with an external responsible"
      PARTNER: "The key is with the partner"
