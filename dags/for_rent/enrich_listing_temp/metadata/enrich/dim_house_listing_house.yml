      OWNER_CONSEQUENCES_MANAGEMENT: "Owner consequences management."
      OWNER_DOESNT_AGREE: "Owner does't agree."
      OWNER_GAVE_UP_RENTING: "Owner gave up renting."
      OWNER_GAVE_UP_SALE: "Owner gave up sale."
