    description: "House listing rent value in local currency."
  house_rent:
    lineage:
    - datalake_ebdb_listing.house.rent
    description: "House latest rent value."
  house_neighborhood:
    lineage:
    - datalake_ebdb_listing.house.neighborhood
    description: "House listing nighborhood."
  house_zipcode:
    lineage:
