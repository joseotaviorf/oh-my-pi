      OWNER_RENTING_WITH_OTHER_COMPANY: "Owner is renting with other company."
      OWNER_REQUESTED_TERMINATION: "Owner requested termination."
      OWNER_SELLING_HOUSE: "Owner is selling the house."
      REMOVED_FROM_CONTEXT_BEFORE_PUBLISHING: "Removed from context before publishing."
      UNKNOWN_NULL_VALUE: "Unknown or null value."
