dag:
  name: enrich_listing_temp
  schedule_start_date: 2022, 10, 18
  owner: Data ForSale
  documentation:
    dag_purpose: |
      Creates enriched tables for the context `Listing` of EBDB.
      This is a temporary DAG to create tables similar to house_listing and dim_house_listing to be tested before replacing the original ones.
      This DAG is triggered by Mediator and loads the table via full load.
workflow:
  type: query_delta
  layer: enrich
  inner_dependencies:
    dim_house_listing_house:
    - house_listing
    fact_listing_rent_flows_house:
    - dim_house_listing_house
    fact_house_listings_house:
    - house_listing
    - house_listing_status_house
    fact_house_listing_status_house:
    - house_listing_status_house
    - house_listing
    house_listing:
    - house_listing_status_house
  tables_customization:
    dim_house_listing_house:
      partitions:
      - country_code
    fact_listing_rent_flows_house:
      partitions:
      - country_code
    fact_house_listings_house:
      partitions:
      - country_code
    fact_house_listing_status_house:
      partitions:
      - country_code
    house_listing_status_house:
      partitions:
      - country_code
    house_listing:
      partitions:
      - country_code
cluster:
  type: databricks_12_2_med_io-memory_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
