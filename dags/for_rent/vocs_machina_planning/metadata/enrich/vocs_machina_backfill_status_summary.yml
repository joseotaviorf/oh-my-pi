database_name: datalake_vocs_machina_planning
table_name: vocs_machina_backfill_status_summary
domain: For Rent
owner: data-ae-for-rent@quintoandar.com.br
description: >
  Per-prompt rollup of vocs_machina_backfill_status (VOCS-34), meant as the
  single cheap "is there backlog?" check quintoml reads before deciding to
  trigger more backfill work. Materialized as a real Delta table (Slice 3,
  via DatalakeTaskGroup) over vocs_machina_backfill_status -- see that
  table's metadata for the row-level definitions this aggregates. Its load
  task's dataset outlet (load-enrich-vocs-machina-backfill-status-summary) is
  the cross-repo contract quintoml subscribes to.
columns:
  prompt_id:
    description: Identifier of the vocs-machina prompt this row summarizes.
    lineage:
      - datalake_vocs_machina_planning.vocs_machina_backfill_status.prompt_id
  missing_count:
    description: >
      Number of (day, prompt_hash) partitions for this prompt where
      inference_status = "missing", i.e. quintoml has not finalized them yet.
    lineage:
      - datalake_vocs_machina_planning.vocs_machina_backfill_status.inference_status
  done_count:
    description: >
      Number of partitions for this prompt where inference_status = "done".
    lineage:
      - datalake_vocs_machina_planning.vocs_machina_backfill_status.inference_status
  oldest_missing_age_days:
    description: >
      Largest age_days among this prompt's "missing" partitions (how old the
      oldest unfinished backlog is), or NULL if the prompt has no missing
      partitions.
    lineage:
      - datalake_vocs_machina_planning.vocs_machina_backfill_status.age_days
      - datalake_vocs_machina_planning.vocs_machina_backfill_status.inference_status
