---
table_name: dw_rent.dim_contract
alert_channel: "#alerts-de-airflow-dags"
table_level_validations:
  has_size:
    greater_than: 400000
    severity_level: Error
column_level_validations:
  sk_contract:
    is_unique:
      severity_level: Error
    is_complete:
      severity_level: Error
  id_contract:
    is_unique:
      severity_level: Error
    has_completeness:
      greater_than: 0.99 # Won't be 100% because of the default row
