database_name: dw_rent
table_name: dim_contract
description: Information about ForRent contracts. Each line is a unique contract.
domain: For Rent
owner: kleber.inoue@quintoandar.com.br
columns:
  sk_contract:
    lineage:
      - datalake_ebdb_contract.contract.id
    description: Key of the contract, which must be unique.
  id_contract:
    lineage:
      - datalake_ebdb_contract.contract.id
    description: Id of the contract, which is the same as the sk_contract.
  country_code:
    lineage:
      - datalake_ebdb_contract.contract.country_code
    description: Country code related to the contract's country of origin.
    categories:
      BR: Brazil's country code.
      MX: Mexico's country code.
  rent:
    lineage:
      - datalake_ebdb_contract.contract.rent
    description: Monthly rent value as specified in the contract (this value is updated if the contract is adjusted).
  first_rent_charged:
    lineage:
      - datalake_ebdb_contract.contract.first_rent_charged
    description: Value of the first rent charged (the currency type is related to the country of the contract).
  day_month_due:
    lineage:
      - datalake_ebdb_contract.contract.billing_day_of_month
    description: Day of the month in which the charge of the rental happens.
  guarantee:
    lineage:
      - datalake_ebdb_contract.contract.guarantee_type
    description: Company or guarantor from the contract.
    categories:
      BrasilCap: Company BrasilCap responsible for the contract guarantee.
      Deposito: Responsible for the contract guarantee.
      Fiador: Responsible for the contract guarantee.
      OutroTipoFiador: Responsible for the contract guarantee.
      PortoSeguro: Company PortoSeguro responsible for the contract guarantee.
      RentalGuarantee: Responsible for the contract guarantee.
      SeguroFairfax: Company Fairfax responsible for the contract guarantee.
      SeguroFiancaCardiff: Company Cardiff responsible for the contract guarantee.
  type:
    lineage:
      - datalake_ebdb_contract.contract.type
    description: Type of assurance of the contract.
    categories:
      DealOnly: Contract without QuintoAndar administration and services (old product).
      FullService: Standard contract with QuintoAndar administration and services.
  status:
    lineage:
      - datalake_ebdb_contract.contract.status
    description: Current status of the contract.
    categories:
      Ativo: The contract is active.
      Cancelado: The contract has been canceled.
      Finalizado: The contract was active for a period and has been terminated.
      Minuta: The contract is in draft.
      PreAssinaturas: The contract is in pre signature, which means it was sent and is waiting for signatures.
  rental_administrator:
    lineage:
      - datalake_ebdb_contract.contract.rental_administrator
    description: The rental administrator of the contract/house.
    categories:
      OWNER: Owner is the rental administrator, which means that the contract is brokerage-only.
      QUINTOANDAR: Default rental administrator, which is QuintoAndar.
  condo_payer:
    lineage:
      - datalake_ebdb_contract.contract.paying_condo
    description: Who is responsible to make the payment of the condo.
    categories:
      Inquilino: The tenant is responsible for making the payment of the condo.
      Proprietario: The property owner is responsible for making the payment of the condo.
      QuintoAndar: QuintoAndar is responsible for making the payment of the condo.
      "null": If the responsible for making the payment of the condo is null.
  condo_responsible:
    lineage:
      - datalake_ebdb_contract.contract.responsible_for_condo
    description: Who is responsible to pay the amount of the condo.
    categories:
      Inquilino: The tenant is responsible for paying the condo.
      Proprietario: The property owner is responsible for paying the condo.
      QuintoAndar: QuintoAndar is responsible for paying the condo.
      "null": If the responsible of paying the condo is null.
  iptu_payer:
    lineage:
      - datalake_ebdb_contract.contract.paying_iptu
    description: Who is responsible to make the payment of the IPTU (if the country of origin has it).
    categories:
      Inquilino: The tenant is responsible for making the payment of the IPTU.
      Proprietario: The property owner is responsible for making the payment of the IPTU.
      QuintoAndar: QuintoAndar is responsible for making the payment of the IPTU.
      "null": If the responsible for making the payment of the IPTU is null.
  iptu_responsible:
    lineage:
      - datalake_ebdb_contract.contract.responsible_for_iptu
    description: Who is responsible to pay the amount of the IPTU (if the country of origin has it).
    categories:
      Inquilino: The tenant is responsible for paying the IPTU.
      Proprietario: The property owner is responsible for paying the IPTU.
      QuintoAndar: QuintoAndar is responsible for paying the IPTU.
      "null": If the responsible of paying the IPTU is null.
  rental_insurance_installments:
    lineage:
      - datalake_ebdb_contract.contract.rental_guarantee_installment
    description: Rental guarantee installments number of the contract.
  rental_insurance_value:
    lineage:
      - datalake_ebdb_contract.contract.rental_guarantee_value
    description: The value of the rental guarantee (the currency type is related to the country of the contract).
  home_insurance_installments:
    lineage:
      - datalake_ebdb_contract.contract.home_insurance_installment
    description: Installments number for paying the home insurance in the contract.
  home_insurance_value:
    lineage:
      - datalake_ebdb_contract.contract.home_insurance_value
    description: Value of the home insurance (the currency type is related to the country of the contract).
  first_rental_commission:
    lineage:
      - datalake_ebdb_contract.contract.fist_rent_comission_fee
    description:
      The rent value paid as a comission (the currency type is related to the country of the contract), in decimals.
      The commission is paid in full to the real estate agent
  monthly_administration_fee:
    lineage:
      - datalake_ebdb_contract.contract.monthly_administration_fee
    description: The percentage QuintoAndar charges as the monthly administration fee for this contract.
  condo:
    lineage:
      - datalake_ebdb_contract.contract.condo_price
    description: Monthly condominium fee.
  iptu:
    lineage:
      - datalake_ebdb_contract.contract.iptu
    description: Iptu price, if the country of origin has it (the currency type is also related to the country).
  tenant_service_fee:
    lineage:
      - datalake_ebdb_contract.contract.tenant_service_fee
    description: Rent percentage paid monthly by the tenant as a Service Fee.
  agent_brokerage_share:
    lineage:
      - datalake_ebdb_contract.contract.agent_brokerage_share
    description: The monthly value splitted between QuintoAndar/Brokerage Partners (CIQ and Partner), in decimals.
  signature_type:
    lineage:
      - datalake_ebdb_contract.contract.signature_type
    description: Type of the signature used in the contract
    categories:
      Eletronica: Eletronic signature (e.g. Docusign).
      "null": If the signature type is null.
  closing_status:
    lineage:
      - datalake_ebdb_contract.contract.status_closing
    description: Contract's closing status.
    categories:
      ApoliceSolicitada: Insurance policy requested.
      ChavesEntregues: Keys were handed over to the tenant.
      ContratoAssinado: The contract is signed.
      ContratoEnviado: The contract was sent.
      EntregaDeChavesAgendada: Keys' handover to the tenant is scheduled.
      PendenciaMinuta: The contract draft has a pendency.
      RedacaoContrato: The contract is being written/created.
  cancellation_reason:
    lineage:
      - datalake_ebdb_contract.contract.cancellation_reason
    description: Reason of the contract's cancellation.
    categories:
      DISAGREEMENT: The parts disagree.
      INCORRECT_INFO: There was some incorrent information on the listing related to the contract.
      OTHERS: Other reason.
      OWNER_DELAY: Owner delayed the response.
      OWNER_DOESNT_AGREE: Owner does not agree with the contract.
      OWNER_GAVE_UP_RENTING: Owner does not want to rent anymore.
      OWNER_PREFERS_OTHER: Property owner prefers another tenant.
      OWNER_RENTING_WITH_OTHER_COMPANY: Owner started renting with another company.
      OWNER_SELLING_HOUSE: Owner does not want to rent anymore because is selling the property.
      OWNER_UNABLE_TO_LEAVE: Owner can't leave the property.
      PRICE_MODIFICATION: The rental price has changed.
      SIG_DEADLINE_EXPIRED: The deadline to sign the contract has expired.
      TENANT_BUYING_HOUSE: The tenant is buying a property and gave up renting.
      TENANT_DELAY: Tenant delayed the response.
      TENANT_DOESNT_AGREE: Tenant does not agree with the contract.
      TENANT_GAVE_UP_RENTING: Tenant does not want to rent anymore.
      TENANT_PREFERS_OTHER: Tenant prefers another QuintoAndar's listed property.
      TENANT_RENTING_WITH_OTHER_COMPANY: Tenant started renting with another company.
      TENANT_UNABLE_TO_LEAVE: Tenant can't leave the property.
      UNREACHABLE: One of the parts was unreachable.
      VALIDITY_DATES: Disagreements happened regarding the contract's period.
  version:
    lineage:
      - datalake_ebdb_contract.contract.contract_version
    description: Contract version according to a set of business rules.
    categories:
      v0: Version V0
      v1: Version V1
      v10: Version V10
      v10.1: Version V10.1
      v10.2: Version V10.2
      v10.3: Version V10.3
      v10.4: Version V10.4
      v10.5: "#N/A"
      v10.6: "#N/A"
      v10.7: "#N/A"
      v2: Version V2
      v3: Version V3
      v4: Version V4
      v5: Version V5
      v6: Version V6
      v7: Version V7
      v8: Version V8
      v8.1: Version V8.1
      v9: Version V9
      v9.1: Version V9.1
      v9.2: Version V9.2
      vP.1: Version VP.1
  is_b2b:
    lineage:
      - datalake_ebdb_contract.contract_b2b.is_b2b
      - datalake_b2b.house_listing.is_b2b
    description: Boolean indicating if the contract comes from B2B business.
  is_contract_b2b:
    lineage:
      - datalake_ebdb_contract.contract_b2b.is_contract_b2b
    description: Boolean indicating if the partner is prime type.
  contract_partner_type:
    lineage:
      - datalake_ebdb_contract.contract_b2b.contract_partner_type
    description: Type of partner related to the contract.
  b2b_type:
    lineage:
      - datalake_ebdb_contract.contract_b2b.b2b_type
    description: Type of the B2B client origin related to the contract.
    categories:
      online: The B2B client makes a recommendation of a property to be listed at QuintoAndar (referral).
      prime: The B2B client registers the property at QuintoAndar.
  b2b_prime_type:
    lineage:
      - datalake_ebdb_contract.contract_b2b.b2b_prime_type
    description: Type of B2B client prime from which comes the contract.
    categories:
      advanced_negotiation: The B2B client sends QuintoAndar the properties and tenants (advanced negotiation), the properties are listed and the contract process continues.
      batch: The B2B client sends QuintoAndar properties in batches, they are listed and the contract process continues.
      portability: The B2B client transfers active contracts to be renewed with QuintoAndar.
      standard: The B2B client registers property by property at QuintoAndar.
  contract_plan:
    lineage:
      - datalake_ebdb_contract.contract_b2b.contract_plan
    description: Type of contract plan.
  value_segment:
    lineage:
      - datalake_ebdb_contract.contract.value_segment
    description: Rent categorization based on value.
    categories:
      LOW: Rent lower than R$1500,00.
      MEDIUM: Rent between R$1500,01 and R$2499,99.
      HIGH: Rent higher than R$2500,00.
      UNDEFINED: Undefined.
  administration_split_percentage:
    lineage:
      - datalake_ebdb_contract.contract_b2b.administration_split_percentage
    description: The administrative percentage of the contract.
  brokerage_split_percentage:
    lineage:
      - datalake_ebdb_contract.contract_b2b.brokerage_split_percentage
    description: The brokerage percentage of the contract.
  is_ongoing_contract:
    lineage:
      - datalake_ebdb_contract.contract.is_ongoing_contract
    description: Boolean indicating if the contract is still ongoing (active).
  is_tenant_service_fee_opt_out:
    lineage:
      - datalake_ebdb_contract.contract.is_tenant_service_fee_opt_out
    description: Boolean indicating if the contract's tenant service fee has been opted out.
  is_exit_inspection_opted_out:
    lineage:
      - datalake_ebdb_contract.contract.is_exit_inspection_opted_out
    description: Boolean indicating if the exit inspection is opted out.
  is_repair_tenant_duty:
    description: Boolean identifying whether repairs are due by the Tenant.
    lineage:
      - datalake_terminator.termination.has_repair_by_tenant_needed
  is_anomaly:
    lineage:
      - datalake_ebdb_contract.contract.is_contract_anomaly
    description: Boolean indicating if this contract termination is an anomaly.
  dt_start:
    lineage:
      - datalake_ebdb_contract.contract.dt_started
    description: Start date of the contract.
  dt_entrance:
    lineage:
      - datalake_ebdb_contract.contract.dt_entered
    description: Date of when tenant will move into the property as defined in the contract.
  dt_intended_end:
    lineage:
      - datalake_ebdb_contract.contract.dt_contract_expected_end
    description: Intended end date of the contract.
  dt_annulment:
    lineage:
      - datalake_ebdb_contract.contract.dt_termination
    description:
      Date of the annulment from the contract. The contract being annulled means that it ended
      after signature, which can be between the signatures and the contract's start or after the start.
      At this point, the tenant already left the property.
  ts_termination_requested:
    lineage:
      - datalake_terminator.termination.ts_termination_request
    description: Timestamp of when the termination was requested.
  ts_created:
    lineage:
      - datalake_ebdb_contract.contract.ts_created
    description: Timestamp of when the contract was created.
  ts_updated:
    lineage:
      - datalake_ebdb_contract.contract.ts_updated
    description: Timestamp of when the contract was last updated.
  ts_expected_termination:
    lineage:
      - datalake_ebdb_contract.contract.ts_expected_termination
    description: Timestamp of when the tenant expects to leave the property.
  ts_signature:
    lineage:
      - datalake_ebdb_contract.contract.ts_signed
    description: Timestamp of when the contract was signed.
  ts_draft_approved:
    lineage:
      - datalake_ebdb_contract.contract.ts_minuta_approved
    description: Timestamp of when the contract draft was approved.
  ts_canceled:
    lineage:
      - datalake_ebdb_contract.contract.ts_canceled
    description:
      Timestamp of when the contract was cancelled. The contract being
      canceled means that it was ended before the signature.
  ts_tenant_service_fee_opt_out:
    lineage:
      - datalake_ebdb_contract.contract.ts_tenant_service_fee_opt_out
    description: Timestamp of when tenant service fee opt out was created.
  ts_analyst_annulment_input:
    lineage:
      - datalake_ebdb_contract.contract.ts_analyst_annulment_input
    description: Timestamp of the analyst's annulment input.
  dt_ended_rental_confirmed:
    lineage:
      - datalake_ebdb_contract.contract.dt_ended_rental_confirmed
    description: Date when the ended rental was confirmed.
  ts_load:
    description: Timestamp of when this data row was last loaded.
