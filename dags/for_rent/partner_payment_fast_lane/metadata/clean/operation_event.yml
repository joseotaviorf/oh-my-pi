---
database_name: datalake_partner_payment_clean
table_name: operation_event
description: |
  This table contains the events performed by the inspection agents payment system.
owner: gustavo.silva@quintoandar.com.br
domain: For Rent
columns:
  id:
    lineage:
      - datalake_partner_payment_raw.operation_event.id
    description: "ID of the table, it's the primary key."
  id_operation:
    description: Identifier of the source inspection or photo-session operation linked to this event.
    lineage:
      - datalake_partner_payment_raw.operation_event.operation_id
  id_agent_type:
    description: Identifier of the agent role type associated with this operation event.
    lineage:
      - datalake_partner_payment_raw.operation_event.agent_type_id
  uuid_operation:
    description: Universally unique identifier of the source operation in the payment system.
    lineage:
      - datalake_partner_payment_raw.operation_event.operation_uuid
  version:
    description: Optimistic locking revision counter for concurrent update safety.
    lineage:
      - datalake_partner_payment_raw.operation_event.version 
  ts_created:
    description: Timestamp of the creation of the event.
    lineage:
      - datalake_partner_payment_raw.operation_event.created_at
  ts_updated:
    description: Timestamp of the update of the event. 
    lineage:
      - datalake_partner_payment_raw.operation_event.updated_at
