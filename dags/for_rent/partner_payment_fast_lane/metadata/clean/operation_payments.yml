---
database_name: datalake_partner_payment_clean
table_name: operation_payments
description: |
  This table contains the payment information to be made to the agent.
owner: data-for-rent@quintoandar.com.br
domain: For Rent
columns:
  id:
    lineage:
      - datalake_partner_payment_raw.operation_payments.id
    description: ID of the table, it’s the primary key.
  id_user:
    lineage:
      - datalake_partner_payment_raw.operation_payments.user_id
    description: Internal user identifier of the agent in the Partner Payment system.
  id_operation_event:
    lineage:
      - datalake_partner_payment_raw.operation_payments.operation_event_id
    description: Foreign key referencing the operation event that triggered this payment record. Null when no specific event is linked.
  uuid_person:
    lineage:
      - datalake_partner_payment_raw.operation_payments.person_uuid
    description: UUID identifying the person (agent) in the person identity service.
  id_operation:
    lineage:
      - datalake_partner_payment_raw.operation_payments.operation_id
    description: Identifier of the source operation (inspection or photo session) this payment is for.
  id_house:
    lineage:
      - datalake_partner_payment_raw.operation_payments.house_id
    description: Identifier of the property (house) where the operation was performed.
  id_operating_city:
    lineage:
      - datalake_partner_payment_raw.operation_payments.operating_city_id
    description: Identifier of the city where the operation was performed, used for regional pricing.
  id_agent:
    lineage:
      - datalake_partner_payment_raw.operation_payments.agent_id
    description: Identifier of the inspection or photo-session agent who performed the operation.
  id_agent_payment:
    lineage:
      - datalake_partner_payment_raw.operation_payments.agent_payment_id
    description: Foreign key referencing the agent payment batch this operation payment belongs to.
  id_bill:
    lineage:
      - datalake_partner_payment_raw.operation_payments.bill_id
    description: Foreign key referencing the bill associated with this operation payment. Null until the payment is assigned to a bill.
  uuid_company:
    lineage:
      - datalake_partner_payment_raw.operation_payments.company_uuid
    description: UUID of the company the agent belongs to at the time of the operation.
  currency:
    lineage:
      - datalake_partner_payment_raw.operation_payments.currency
    description: ISO 4217 currency code for the payment amounts (e.g. BRL).
  version:
    lineage:
      - datalake_partner_payment_raw.operation_payments.version
    description: Optimistic locking version of the record. Incremented on each update.
  agent_type:
    lineage:
      - datalake_partner_payment_raw.operation_payments.agent_type
    description: Type of agent who performed the operation (e.g. INSPECTOR, PHOTOGRAPHER).
  agent_status:
    lineage:
      - datalake_partner_payment_raw.operation_payments.agent_status
    description: Employment status of the agent at the time the payment was recorded (e.g. ACTIVE, INACTIVE).
  contract_type:
    lineage:
      - datalake_partner_payment_raw.operation_payments.contract_type
    description: Contract type of the agent, which determines the payment calculation model applied (e.g. FIXED, VARIABLE).
  operation_type:
    lineage:
      - datalake_partner_payment_raw.operation_payments.operation_type
    description: Category of the operation performed (e.g. INSPECTION, PHOTO_SESSION). Drives the applicable payment rules.
  operation_agent_status:
    lineage:
      - datalake_partner_payment_raw.operation_payments.operation_agent_status
    description: Status of the agent's participation in this specific operation (e.g. CONFIRMED, CANCELLED).
  house_area:
    lineage:
      - datalake_partner_payment_raw.operation_payments.house_area
    description: Area of the property in square meters, used as an input factor for meter-based payment calculations.
  house_reference:
    lineage:
      - datalake_partner_payment_raw.operation_payments.house_reference
    description: Human-readable reference code for the property (house) where the operation was performed.
  meters_base_reference:
    lineage:
      - datalake_partner_payment_raw.operation_payments.meters_base_reference
    description: Amount to be paid in relation to the base area considered for a house.
  meters_additional_reference:
    lineage:
      - datalake_partner_payment_raw.operation_payments.meters_additional_reference
    description: Percentage to be paid related to the area that exceeds the base area of the house.
  meters_total:
    lineage:
      - datalake_partner_payment_raw.operation_payments.meters_total
    description: The total amount to be paid for the house total area.
  additionals_total:
    lineage:
      - datalake_partner_payment_raw.operation_payments.additionals_total
    description: The total amount to be paid for additional charges.
  fixed_reference:
    lineage:
      - datalake_partner_payment_raw.operation_payments.fixed_reference
    description: Additional fixed amount considered to the calculate of the payment.
  operation_business:
    lineage:
      - datalake_partner_payment_raw.operation_payments.operation_business
    description: Reference to the business source of the operation.
  status:
    lineage:
      - datalake_partner_payment_raw.operation_payments.status
    description: The status of the operation payment within its processing lifecycle (e.g. CREATED, APPROVED, CANCELLED).
  dt_schedule:
    lineage:
      - datalake_partner_payment_raw.operation_payments.schedule_date
    description: Date when the operation was scheduled.
  ts_created:
    lineage:
      - datalake_partner_payment_raw.operation_payments.created_at
    description: Timestamp of the creation of the operation payment.
  ts_updated:
    lineage:
      - datalake_partner_payment_raw.operation_payments.updated_at
    description: Timestamp of the update of the operation payment.