---
database_name: datalake_partner_payment_clean
table_name: jira_issues
description: |
  This table contains the jira issues that are read from the Jira projects we integrate with.
owner: gustavo.silva@quintoandar.com.br
domain: For Rent
columns:
  id:
    lineage:
      - datalake_partner_payment_raw.jira_issues.id
    description: "ID of the table, it's the primary key."
  issue_key:
    lineage:
      - datalake_partner_payment_raw.jira_issues.issue_key
    description: Human-readable Jira issue key (e.g. PP-1234) used to reference the ticket.
  agent_type:
    lineage:
      - datalake_partner_payment_raw.jira_issues.agent_type
    description: Indicates to which agent type the issue belongs to.
  issue_type:
    lineage:
      - datalake_partner_payment_raw.jira_issues.issue_type
    description: Jira issue classification (e.g. bug, task) defining how the ticket is processed.
  version:
    lineage:
      - datalake_partner_payment_raw.jira_issues.version
    description: Optimistic locking revision counter for concurrent update safety.
  ts_created:
    lineage:
      - datalake_partner_payment_raw.jira_issues.created_at
    description: Timestamp of the record creation action.
  ts_updated:
    lineage:
      - datalake_partner_payment_raw.jira_issues.updated_at
    description: Timestamp of the record update action.
