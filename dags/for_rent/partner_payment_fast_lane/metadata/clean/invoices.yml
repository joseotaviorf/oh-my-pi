---
database_name: datalake_partner_payment_clean
table_name: invoices
description: |
  Clean mirror of the invoices table from the Partner Payment service.
  One row per invoice. Primary key: id. Related to bills via id_bill (FK to bills).
  Tracks invoice documents stored in BlobVault and their internal processing status.
owner: gustavo.silva@quintoandar.com.br
domain: For Rent
columns:
  id:
    lineage:
      - datalake_partner_payment_raw.invoices.id
    description: Primary key. Unique identifier of the invoice in the transactional source.
  id_bill:
    lineage:
      - datalake_partner_payment_raw.invoices.bill_id
    description: Foreign key to bills. Identifies the bill associated with this invoice.
  uuid_blobvault_invoice:
    lineage:
      - datalake_partner_payment_raw.invoices.blobvault_invoice_id
    description: UUID identifying the invoice document file stored in BlobVault.
  status:
    lineage:
      - datalake_partner_payment_raw.invoices.status
    description: Internal processing status of the invoice within the Partner Payment system (e.g. pending, processed, rejected).
  invoice_receipt_number:
    lineage:
      - datalake_partner_payment_raw.invoices.invoice_receipt_number
    description: The receipt number returned by the payment provider after the invoice is processed. Null until the payment provider acknowledges the invoice.
  version:
    lineage:
      - datalake_partner_payment_raw.invoices.version
    description: Record version used for optimistic concurrency control in the source system.
  errors:
    lineage:
      - datalake_partner_payment_raw.invoices.errors
    description: Details of errors encountered while processing the invoice, if any (e.g. BlobVault upload failure or payment provider rejection).
  dt_upload:
    lineage:
      - datalake_partner_payment_raw.invoices.upload_date
    description: Most recent date the invoice document was uploaded to BlobVault.
  ts_created:
    lineage:
      - datalake_partner_payment_raw.invoices.created_at
    description: Timestamp of the invoice record creation in the source system.
  ts_updated:
    lineage:
      - datalake_partner_payment_raw.invoices.updated_at
    description: Timestamp of the last update to the invoice record in the source system.
