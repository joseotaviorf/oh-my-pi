dag:
  name: partner_payment_fast_lane
  schedule_start_date: 2024, 7, 1
  schedule_interval: "0 8-18/2 * * *"
  owner: Data ForRent
  documentation:
    dag_purpose: |
      This DAG retrieves high-frequency operational data from the partner_payment database every 2 hours,
      running at the top of the hour from 11:00 to 21:00 UTC (schedule: 0 8-18/2 * * * BRT = 11:00-21:00 UTC).
      It covers transactional and financial tables that require frequent updates.
workflow:
  type: cdc
  layer: raw
  database_type: postgres
  source_schema: public
  custom_schema: partner_payment
  dbutils_secret_key: PARTNER_PAYMENT_DB
  tables_customization:
    bills:
      clean_table_name: bills
    availabilities:
      clean_table_name: availabilities
    jira_issues:
      clean_table_name: jira_issues
    jira_remunerations:
      clean_table_name: jira_remunerations
    operation_payments:
      clean_table_name: operation_payments
    operation_event:
      clean_table_name: operation_event
    additionals:
      clean_table_name: additionals
cluster:
  type: databricks_16_4_med_general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
