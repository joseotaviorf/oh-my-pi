cluster:
  type: consolidation_xl_memory_single_node_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
    driver_node_type_id: r7g.12xlarge
    aws_attributes:
      ebs_volume_size: 200
validation:
  cluster:
    type: emr_7_12_consolidation_xl_memory_single_node_cluster
    custom_configurations:
      master_node_type_id: r7g.12xlarge
