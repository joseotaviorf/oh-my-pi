---
database_name: datalake_ebdb_clean
table_name: inspection_photo_item
description: Photo attachments linked to inspection checklist items in EBDB, including
  reference metadata and item type.
domain: For Rent
owner: gustavo.silva@quintoandar.com.br
columns:
  id:
    lineage:
    - datalake_ebdb_raw.fotoitemvistoria.id
    description: Primary key of the inspection photo item record.
  id_item:
    lineage:
    - datalake_ebdb_raw.fotoitemvistoria.item_id
    description: Inspection checklist item this photo is attached to.
  id_ref:
    lineage:
    - datalake_ebdb_raw.fotoitemvistoria.refid
    description: Reference identifier for the photo source entity.
  checklist_item:
    lineage:
    - datalake_ebdb_raw.fotoitemvistoria.checklistitem
    description: Checklist item label associated with the photo.
  name:
    lineage:
    - datalake_ebdb_raw.fotoitemvistoria.nome
    description: Display name of the photo item.
  type:
    lineage:
    - datalake_ebdb_raw.fotoitemvistoria.tipo
    description: Photo item type in the inspection workflow.
  ts_created:
    lineage:
    - datalake_ebdb_raw.fotoitemvistoria.criadoem
    description: Timestamp when the photo item was created in EBDB.
  ts_updated:
    lineage:
    - datalake_ebdb_raw.fotoitemvistoria.atualizadoem
    description: Timestamp of the last update to the photo item.
