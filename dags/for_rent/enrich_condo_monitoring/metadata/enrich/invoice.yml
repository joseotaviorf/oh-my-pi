database_name: datalake_condo_monitoring
table_name: invoice
description: Enrich layer table for invoice from the enrich_condo_monitoring pipeline used in For Rent analytics.
domain: For Rent
owner: gustavo.silva@quintoandar.com.br
columns:
  id_invoice:
    lineage:
      - datalake_rental_management_clean.invoice.id
    description: Surrogate key of the condominium invoice record tracked by the Condo Monitoring product for payment follow-up.
  id_contract:
    lineage:
      - datalake_rental_management_clean.invoice.id_contract
    description: ID of the contract related to the invoice.
  issuer_cnpj:
    lineage:
      - datalake_rental_management_clean.invoice.raw_data
    description: CNPJ tax identifier of the invoice issuing organization.
  status:
    lineage:
      - datalake_condo_monitoring.communication.id_communication
    description: Current processing state of the record in the source workflow.
  issuer_name:
    lineage:
      - datalake_rental_management_clean.invoice.raw_data
    description: Legal name of the condominium administrator or management company that issued the boleto payment slip.
  barcode:
    lineage:
      - datalake_rental_management_clean.invoice.raw_data
    description: Numeric barcode printed on the boleto, used to identify the payment slip at banks and payment gateways.
  communications_sent:
    lineage:
      - datalake_condo_monitoring.communication.communication_type
    description: Array column to indicate the communications sent to the user.
  communication_funnel_step_reached:
    description: Column to indicate the funnel step reached by the communication.
    categories:
      REMINDER: Just the reminder communication was sent.
      WARNING: The warning communication was sent, but this doesn't mean that the reminder communication was sent as well.
      COMMUNICATION_NOT_FOUND: No communication was found.
  value:
    lineage:
      - datalake_rental_management_clean.invoice.id_contract
    description: Total amount due on the condominium invoice in Brazilian reais, as reported by the rental management source system.
  was_reminder_comm_required:
    description: Boolean flag to indicate if a reminder communication was required.
  was_warning_comm_required:
    description: Boolean flag to indicate if a warning communication was required.
  dt_due:
    lineage:
      - datalake_rental_management_clean.invoice.dt_due
    description: Date due of the invoice.
  ts_issued:
    lineage:
      - datalake_rental_management_clean.invoice.ts_created
    description: Timestamp of when the invoice was created/issued.
  ts_paid:
    lineage:
      - datalake_rental_management.invoice_aud.ts_updated
    description: Timestamp of when the invoice was paid.
