dag:
    name: enrich_listing_contracts
    owner: Data ForRent
    schedule_start_date: 2019, 5, 31
    documentation:
      dag_purpose: |
            This DAG has the goal to unify information related to listings and its contracts.
workflow:
    type: query
    layer: enrich
    default_extraction_type: full
    default_partitions: [country_code]
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: r5d.large
    node_type_id: r5d.large
    runtime_engine: PHOTON
    num_workers: 2
    spark_version: 12.2.x-scala2.12
    spark_conf:
      spark.sql.sources.partitionOverwriteMode: static
