dag:
  name: enrich_listing_contracts
  owner: Data ForRent
  schedule_start_date: 2019, 5, 31
  documentation:
    dag_purpose: |
      This DAG has the goal to unify information related to listings and its contracts.
workflow:
  type: query_delta
  layer: enrich
  default_extraction_type: full
  default_partitions: [country_code]
cluster:
  type: consolidation_s_general_single_node_cluster
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
  databricks_conn_id: databricks_new_env
