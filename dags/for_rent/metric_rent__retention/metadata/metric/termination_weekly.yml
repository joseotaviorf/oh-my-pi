---
database_name: metric_rent
table_name: termination_weekly
description: Weekly contract termination metrics.
domain: For Rent
owner: jonas.fiorini@quintoandar.com.br
columns:
  dt_week_termination_finished:
    lineage:
      - dw_retention.dim_termination.ts_termination_finished
    description: Week when the contract termination was finished.
    dimension: True
  country_code:
    lineage:
      - dw_rent.dim_contract.country_code
    description: Country code of the house.
    dimension: True
  category:
    lineage:
      - dw_rent.dim_contract.value_segment
    description: Rent value segment.
    categories:
      LOW: Rent lower than R$1500,00.
      MEDIUM: Rent between R$1500,01 and R$2499,99.
      HIGH: Rent higher than R$2500,00.
      UNDEFINED: Undefined.
      OVERALL: All rent value. LOW, MEDIUM, HIGH and UNDEFINED included in OVERALL category.
    dimension: True
  repair_resolution_class:
    description: Repair resolution class.
    categories:
      with_repair: Some house repair was necessary.
      without_repair: None house repair was necessary.
      OVERALL: All repair resolution classes.
    dimension: True
  total_terminations:
    description: Total volume of contract terminations.
    metric:
      name: Weekly Total Volume Of Terminations
      description: Total volume of contract terminations.
      acronym: WTVT
      is_additive: True
      business_stage: Offboarding
      hierarchy: User analysis
      approved_by: pilar.valente@quintoandar.com.br
      link_to_metric: ""
  leadtime_offboarding:
    description: Average days of offboarding's leadtime.
    metric:
      name: Weekly Average of Offboarding's Leadtime
      description: Average days of offboarding's leadtime.
      acronym: WAOL
      is_additive: False
      business_stage: Offboarding
      hierarchy: User analysis
      approved_by: pilar.valente@quintoandar.com.br
      link_to_metric: ""