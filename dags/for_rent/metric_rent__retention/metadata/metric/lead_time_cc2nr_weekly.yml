---
database_name: metric_rent
table_name: lead_time_cc2nr_weekly
description: Weekly table with median leadtime between the contract creation and the date when the contract started or the entrance date.
domain: For Rent
owner: kleber.inoue@quintoandar.com.br
columns:
  dt_reference_week:
    lineage:
      - dw_rent.dim_contract.dt_start
      - dw_rent.dim_contract.dt_entrance
    description: Week date of the contract started or entrance date.
    dimension: True
  value_segment:
    lineage:
      - dw_rent.dim_contract.value_segment
    description: "Category of rent value."
    categories:
      LOW: Rent lower than R$1500,00.
      MEDIUM: Rent between R$1500,01 and R$2499,99.
      HIGH: Rent higher than R$2500,00.
      UNDEFINED: Undefined.
      OVERALL: All rent value. LOW, MEDIUM, HIGH and UNDEFINED included in OVERALL category.
    dimension: True
  country_code:
    lineage:
      - dw_retention.dim_contract.country_code
    description: "Country code of the house."
    dimension: True
  median_leadtime:
    description: Weekly median value of the days between the contract's create date and the start/entrance date.
    metric:
      name: Lead Time - CC2NR
      description: Weekly median value of the days between the contract's create date and the start/entrance date.
      acronym: LTCC2NRW
      is_additive: True
      business_stage: Demand
      hierarchy: User analysis
      approved_by: pilar.valente@quintoandar.com.br
      link_to_metric: ""
  volume_contracts:
    description: Weekly volume of contracts that were terminated.
    metric:
      name: Weekly Total Contracts Terminated
      description: Weekly volume of contracts that were terminated.
      acronym: WCT
      is_additive: True
      business_stage: Offboarding
      hierarchy: User analysis
      approved_by: pilar.valente@quintoandar.com.br
      link_to_metric: ""