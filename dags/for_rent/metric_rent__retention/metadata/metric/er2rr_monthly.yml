---
database_name: metric_rent
table_name: er2rr_monthly
description: Monthly calculated metrics of Ended Rental (ER) to Re-rental (RR).
domain: For Rent
owner: jonas.fiorini@quintoandar.com.br
columns:
  dt_reference_month:
    lineage:
      - dw_rent.dim_contract.dt_ended_rental_confirmed
    description: "Month of the ended rental or listing maturation."
    dimension: True
  category:
    lineage:
      - dw_rent.dim_contract.value_segment
    description: "Rent value category based on its value."
    categories:
      LOW: Rent lower than R$1500,00.
      MEDIUM: Rent between R$1500,01 and R$2499,99.
      HIGH: Rent higher than R$2500,00.
      UNDEFINED: Undefined.
      OVERALL: All rent value. LOW, MEDIUM, HIGH and UNDEFINED included in OVERALL category.
    dimension: True
  country_code:
    lineage:
      - dw_rent.dim_contract.country_code
    description: "Country code of the house."
    dimension: True
  administrator:
    description: "Group of administration. This column was created to understand if the Brokerage Only program are influencing the ER2RR metric"
    categories:
      WITH BO: The calculation are including Brokerage Only (OWNER)
      WITHOUT BO: The calculation are not including Brokerage Only (OWNER)
    dimension: True
  ended_rentals:
    description: "Volume of ended rentals that happended in the month being referenced."
    metric:
      name: Monthly Ended Rentals
      description: "Volume of ended rentals that happended in the month being referenced."
      acronym: ER
      is_additive: True
      business_stage: Demand
      hierarchy: User analysis
      approved_by: camila.simoes@quintoandar.com.br
      link_to_metric: ""
  rerentals:
    description: "Volume of re-rentals that happended in the month being referenced."
    metric:
      name: Monthly Re-Rentals
      description: "Volume of re-rentals that happended in the month being referenced."
      acronym: RR
      is_additive: True
      business_stage: Demand
      hierarchy: User analysis
      approved_by: camila.simoes@quintoandar.com.br
      link_to_metric: ""
