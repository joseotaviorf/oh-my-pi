---
database_name: metric_rent
table_name: er2rr_monthly
description: Monthly calculated metrics of Ended Rental (ER) to Re-rental (RR).
domain: For Rent
owner: jonas.fiorini@quintoandar.com.br
columns:
  month_ref:
    lineage:
      - dw_rent.dim_contract.ts_analyst_annulment_input
      - dw_rent.dim_contract.dc.dt_annulment
    description: "Month of the ended rental."
    dimension: True
  category:
    lineage:
      - dw_rent.dim_contract.value_segment
    description: "Rent value category based on its value."
    categories:
      LOW: Rent lower than R$1500,00.
      MEDIUM: Rent between R$1500,01 and R$2499,99.
      HIGH: Rent higher than R$2500,00.
      UNDEFINED: Undefined.
    dimension: True
  ended_rentals:
    description: "Volume of ended rentals that happended in the month being referenced."
    metric:
      name: Monthly Ended Rentals
      description: "Volume of ended rentals that happended in the month being referenced."
      acronym: ER
      is_additive: True
      business_stage: Demand
      hierarchy: User analysis
      approved_by: camila.simoes@quintoandar.com.br
      link_to_metric: ""
  rerentals:
    description: "Volume of re-rentals that happended in the month being referenced."
    metric:
      name: Monthly Re-Rentals
      description: "Volume of re-rentals that happended in the month being referenced."
      acronym: RR
      is_additive: True
      business_stage: Demand
      hierarchy: User analysis
      approved_by: camila.simoes@quintoandar.com.br
      link_to_metric: ""
  ER2RR_4W:
    description: "Percentage of re-rentals that happended in less than 4 weeks (28 days) after the ended rental in the month being referenced."
    metric:
      name: Percentage of Ended Rental to Re-Rental in Less Than 4 Weeks
      description: "Percentage of re-rentals that happended in less than 4 weeks (28 days) after the ended rental in the month being referenced."
      acronym: ER2RR_4W
      is_additive: False
      business_stage: Demand
      hierarchy: User analysis
      approved_by: camila.simoes@quintoandar.com.br
      link_to_metric: ""
  ER2RR_12W:
    description: "Percentage of re-rentals that happended in less than 12 weeks (84 days) after the ended rental in the month being referenced."
