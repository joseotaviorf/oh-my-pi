---
database_name: metric_rent
table_name: open_reports_monthly
description: Monthly volume / percentage of tenant, landlord and total inspections the access review filtering inspection_type = 'offboarding' and status = 'reviewed'.
domain: For Rent
owner: kleber.inoue@quintoandar.com.br
columns:
  dt_month_reference:
    lineage:
      - dw_inspections.fact_report_review.ts_reviewed
    description: Month when the inspection was reviewed.
    dimension: True
  country_code:
    lineage:
      - dw_rent.dim_contract.country_code
    description: Country code of the house.
    dimension: True
  category:
    lineage:
      - dw_rent.dim_contract.value_segment
    description: Rent value segment.
    categories:
      LOW: Rent lower than R$1500,00.
      MEDIUM: Rent between R$1500,01 and R$2499,99.
      HIGH: Rent higher than R$2500,00.
      UNDEFINED: Undefined.
      OVERALL: All rent value. LOW, MEDIUM, HIGH and UNDEFINED included in OVERALL category.
    dimension: True
  inspections_tenant_review:
    description: Monthly volume of inspections which the tenant has access to review.
    metric:
      name: Monthly Volume of Inspections - Tenant Access Review
      description: Monthly volume of inspections which the tenant has access to review.
        It's the count of sk_inspections when the has_tenant_access_review column is true, 
        filtering the inspection_type = 'offboarding' and status = 'reviewed'.
      acronym: MVITAR
      is_additive: True
      business_stage: Offboarding
      hierarchy: User analysis
      approved_by: pilar.valente@quintoandar.com.br
      link_to_metric: ""
  inspections_landlord_review:
    description: Monthly volume of inspections which the landlord has access to review.
    metric:
      name: Monthly Volume of Inspections - Landlord Access Review
      description: Monthly volume of inspections which the landlord has access to review.
        It's the count of sk_inspections when the has_owner_access_review column is true, 
        filtering the inspection_type = 'offboarding' and status = 'reviewed'.
      acronym: MVILAR
      is_additive: True
      business_stage: Offboarding
      hierarchy: User analysis
      approved_by: pilar.valente@quintoandar.com.br
      link_to_metric: ""
  inspections_both_review:
    description: Monthly volume of inspections which the tenant and landlord have access to review.
    metric:
      name: Monthly Volume of Inspections - Landlord and Tenant Access Review
      description: Monthly volume of inspections which the tenant and landlord have access to review.
        It's the count of sk_inspections when the has_owner_access_review and has_tenant_access_review columns are true, 
        filtering the inspection_type = 'offboarding' and status = 'reviewed'.
      acronym: MVITLAR
      is_additive: True
      business_stage: Offboarding
      hierarchy: User analysis
      approved_by: pilar.valente@quintoandar.com.br
      link_to_metric: ""
  inspections_both_without_review:
    description: Monthly volume of inspections which the tenant and landlor don't have access to review.
    metric:
      name: Monthly Volume of Inspections - Landlord and Tenant Without Access Review
      description: Monthly volume of inspections which the tenant and landlord don't have access to review.
        It's the count of sk_inspections when the has_owner_access_review and has_tenant_access_review columns are false, 
        filtering the inspection_type = 'offboarding' and status = 'reviewed'.
      acronym: MVILTWOAR
      is_additive: True
      business_stage: Offboarding
      hierarchy: User analysis
      approved_by: pilar.valente@quintoandar.com.br
      link_to_metric: ""
  total_inspections:
    description: Monthly total volume of inspections.
    metric:
      name: Monthly Total Volume of Inspections
      description: Monthly volume of inspections.
        It's the count of sk_inspections filtering the inspection_type = 'offboarding' and status = 'reviewed'.
      acronym: MTVI
      is_additive: True
      business_stage: Offboarding
      hierarchy: User analysis
      approved_by: pilar.valente@quintoandar.com.br
      link_to_metric: ""
  pct_inpsections_tenant_review:
    description: Monthly percentage of inspections which the tenant has access to review.
    metric:
      name: Monthly Percentage of Inspections - Tenant Access Review
      description: Monthly percentage of inspections which the tenant has access to review.
        It's the division of sk_inspections when the has_tenant_access_review column is true with total inspections
        filtering the inspection_type = 'offboarding' and status = 'reviewed'.
      acronym: MPITAR
      is_additive: False
      business_stage: Offboarding
      hierarchy: User analysis
      approved_by: pilar.valente@quintoandar.com.br
      link_to_metric: ""
  pct_inspections_landlord_review:
    description: Monthly percentage of inspections which the landlord has access to review.
    metric:
      name: Monthly Percentage of Inspections - Landlord Access Review
      description: Monthly percentage of inspections which the landlord has access to review.
        It's the division of sk_inspections when the has_landlord_access_review column is true with total inspections
        filtering the inspection_type = 'offboarding' and status = 'reviewed'.
      acronym: MPILAR
      is_additive: False
      business_stage: Offboarding
      hierarchy: User analysis
      approved_by: pilar.valente@quintoandar.com.br
      link_to_metric: ""
  pct_inspections_both_without_review:
    description: Monthly percentage of inspections which the landlord and tenant don't have access to review.
    metric:
      name: Monthly Percentage of Inspections - Landlord and Tenant Without Access Review
      description: Monthly percentage of inspections which the landlord and tenant don't have access to review.
        It's the division of sk_inspections when the has_owner_access_review and has_tenant_access_review columns are false with total inspections, 
        filtering the inspection_type = 'offboarding' and status = 'reviewed'.
      acronym: MPILTWOAR
      is_additive: False
      business_stage: Offboarding
      hierarchy: User analysis
      approved_by: pilar.valente@quintoandar.com.br
      link_to_metric: ""
  pct_tenant_landlord_with_review:
    description: Monthly percentage of inspections which the landlord and tenant have access to review.
    metric:
      name: Monthly Percentage of Inspections - Landlord and Tenant With Access Review
      description: Monthly percentage of inspections which the landlord and tenant have access to review.
        It's the division of sk_inspections when the has_owner_access_review and has_tenant_access_review columns are true with total inspections * 2, 
        filtering the inspection_type = 'offboarding' and status = 'reviewed'.
      acronym: MPILTWAR
      is_additive: False
      business_stage: Offboarding
      hierarchy: User analysis
      approved_by: pilar.valente@quintoandar.com.br
      link_to_metric: ""