---
database_name: metric_rent
table_name: er2rr_weekly_by_city_group
description: Weekly calculated metrics of Ended Rental (ER) to Re-rental (RR) segmented by City Group.
domain: For Rent
owner: kleber.inoue@quintoandar.com.br
columns:
  dt_reference_Week:
    lineage:
      - dw_rent.dim_contract.dt_ended_rental_confirmed
    description: "Week of the ended rental or listing maturation."
    dimension: True
  category:
    lineage:
      - dw_rent.dim_contract.value_segment
    description: "Rent value category based on its value."
    categories:
      LOW: Rent lower than R$1500,00.
      MEDIUM: Rent between R$1500,01 and R$2499,99.
      HIGH: Rent higher than R$2500,00.
      UNDEFINED: Undefined.
      OVERALL: All rent value. LOW, MEDIUM, HIGH and UNDEFINED included in OVERALL category.
    dimension: True
  country_code:
    lineage:
      - dw_rent.dim_contract.country_code
    description: "Country code of the house."
    dimension: True
  administrator:
    description: "Group of administration. This column was created to understand if the Brokerage Only program are influencing the ER2RR metric"
    categories:
      WITH BO: The calculation are including Brokerage Only (OWNER)
      WITHOUT BO: The calculation are not including Brokerage Only (OWNER)
    dimension: True
  city_group:
    lineage:
      - dw_public.dim_region.city_group
    description: "City group of the house which was in a offboarding step."
    dimension: True
  ended_rentals:
    description: "Volume of ended rentals that happended in the week being referenced segmented by city group."
    metric:
      name: Weekly Ended Rentals by City Group
      description: "Volume of ended rentals that happended in the week being referenced segmented by city group."
      acronym: ER
      is_additive: True
      business_stage: Demand
      hierarchy: User analysis
      approved_by: camila.simoes@quintoandar.com.br
      link_to_metric: ""
  rerentals:
    description: "Volume of re-rentals that happended in the week being referenced segmented by city group."
    metric:
      name: Weekly Re-Rentals by City Group
      description: "Volume of re-rentals that happended in the week being referenced segmented by city group."
      acronym: RR
      is_additive: True
      business_stage: Demand
      hierarchy: User analysis
      approved_by: camila.simoes@quintoandar.com.br
      link_to_metric: ""
  rr_4w:
    description: "Volume of re-rentals in 4 weeks that happended in the week being referenced segmented by city group."
    metric:
