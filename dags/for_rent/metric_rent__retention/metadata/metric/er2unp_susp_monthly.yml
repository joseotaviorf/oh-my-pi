---
database_name: metric_rent
table_name: er2unp_susp_monthly
description: Monthly calculated metrics of Ended Rental (ER) to UNPUBLISHED or SUSPENDED (except rented).
domain: For Rent
owner: jonas.fiorini@quintoandar.com.br
columns:
  dt_reference_month:
    lineage:
      - dw_rent.dim_contract.ts_analyst_annulment_input
      - dw_rent.dim_contract.dt_annulment
    description: "Month of the ended rental."
    dimension: True
  country_code:
    lineage:
      - dw_rent.dim_contract.country_code
    description: "Country code of the house."
    dimension: True
  rent_segment:
    description: "Rent value segmentation."
    categories:
      LOW: Rent lower than R$1500,00.
      MEDIUM: Rent between R$1500,01 and R$2499,99.
      HIGH: Rent higher than R$2500,00.
      OVERALL: All rent value. LOW, MEDIUM and HIGH included in OVERALL segment.
    dimension: True
  unp_susp_1w:
    description: "Volume of listings UNPUBLISHED or SUSPENDED (except rented) after 1 week of the ended rental confirmed."
