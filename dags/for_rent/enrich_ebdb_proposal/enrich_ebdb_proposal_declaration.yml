dag:
  name: enrich_ebdb_proposal
  schedule_start_date: 2020, 7, 1
  owner: Data ForRent
  documentation:
    dag_purpose: |
      Creates enriched tables for the context `Proposal` of ebdb, like pre proposal.
      This DAG is triggered by Mediator and loads the table via full load.
      All the output tables are partitioned by `country_code`.
workflow:
  type: query_delta
  layer: enrich
  default_partitions:
  - country_code
cluster:
  type: databricks_12_2_min_xlarge_io-memory_photon_cluster
  custom_configurations:
    spark_conf:
      spark.sql.sources.partitionOverwriteMode: static
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
  databricks_conn_id: databricks_new
