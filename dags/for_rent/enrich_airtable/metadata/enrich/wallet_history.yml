---
database_name: datalake_airtable
table_name: wallet_history
description: Table with the historical association of CIQs and account management analysts (wallets).
  Each line represents an association between a partner (CIQ) and an analyst during a period.
domain: For Rent
owner: gustavo.alencar@quintoandar.com.br
columns:
  id_airtable_record:
    description: ID of the airtable record.
    lineage:
      - datalake_airtable_clean.wallet_history.id_airtable_record
  id_partner:
    description: ID of the partner (CIQ).
    lineage:
      - datalake_airtable_clean.wallet_history.id_partner
  category:
    description: Category of the wallet. Cluster to group CIQs based on productivity.
    lineage:
      - datalake_airtable_clean.wallet_history.category
  wallet:
    description: Name of the account management analyst responsible for the CIQ.
    lineage:
      - datalake_airtable_clean.wallet_history.wallet
  dt_started:
    description: Date when the CIQ was linked to the wallet.
    lineage:
      - datalake_airtable_clean.wallet_history.dt_started
  dt_ended:
    description: Date when the CIQ was removed from the wallet.
    lineage:
      - datalake_airtable_clean.wallet_history.dt_ended
  ts_updated:
    description: Date of the update.
    lineage:
      - datalake_airtable_clean.wallet_history.ts_updated
  year:
    description: Year, partition of the table. It can be used to enhance the query's performance.
    lineage:
      - datalake_airtable_clean.wallet_history.year
  month:
    description: Month, partition of the table. It can be used to enhance the query's performance.
    lineage:
      - datalake_airtable_clean.wallet_history.month
  day:
    description: Day, partition of the table. It can be used to enhance the query's performance.
    lineage:
      - datalake_airtable_clean.wallet_history.day