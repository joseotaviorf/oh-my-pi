---
database_name: dw_datamarts
table_name: rental_marketplace_flows
owner: gustavo.alencar@quintoandar.com.br
domain: For Rent
description: A datamart tracking rental flows in 5A context.
columns:
  week_start:
    description: This column represents the starting date of a week.
    lineage:
      - dw_public.dim_date.week_start
  sk_region:
    description: This column contains the surrogate key (SK) associated with a region.
    lineage:
      - datalake_listing_temp.fact_house_listings_house.sk_region
      - dw_datamarts.rent_flow_interactions.sk_region
      - dw_rent.fact_listing_rent_flows.sk_region
  sk_house_listing:
    description: TThis column contains the surrogate key (SK) associated with a house listing.
    lineage:
      - datalake_listing_temp.fact_house_listing_status_house.sk_house_listing
      - dw_datamarts.rent_flow_interactions.sk_house_listing
      - dw_rent.fact_listing_rent_flows.sk_house_listing
  sk_client:
    description: This column contains the surrogate key (SK) associated with a sk_client.
    lineage:
      - dw_datamarts.rent_flow_interactions.sk_client
      - dw_datamarts.tenant_prospect_status.sk_client
      - dw_rent.fact_listing_rent_flows.sk_client
  listing_cummulative_rent_flows:
    description:
      Number of cummulative distinct rent flows that the listing received until the indicated week.
      Calculated by the sum of the listing_weekly_rent_flows of the week indicated plus previous weeks.
  listing_weekly_rent_flows:
    description: Number of distinct rent flows that the listing received on the indicated week.
  status_last_week_short:
    description:
      Listing status on the previous week. This is a short and treated version of the original status
      based on the status itself and the change reason.
  status_short:
    description:
      Listing status on the indicated week. This is a short and treated version of the original status
      based on the status itself and the change reason.
  is_active_tp:
    description: Flag to indicate if the tenant prospect is active or not.
  had_demand:
    description: Flag to indicate if the listing had demand funnel events.
  rent_flows:
    description: Number of ongoing rent flows that the pair listing - sk_client had on the indicated week.
  visits_booked:
    description: Number of visits booked that the pair listing - sk_client had on the indicated week.
  offers_submitted:
    description: Number of offers submiited that the pair listing - sk_client had on the indicated week.
  offers_accepted:
    description: Number of offers accepted that the pair listing - sk_client had on the indicated week.
  credits_approved:
    description: Number of credit analysis approved that the pair listing - sk_client had on the indicated week.
  contracts_signed:
    description: Number of contracts signed that the pair listing - sk_client had on the indicated week.
