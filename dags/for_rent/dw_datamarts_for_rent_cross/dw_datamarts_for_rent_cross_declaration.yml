dag:
  name: dw_datamarts_for_rent_cross
  owner: Data ForRent
  documentation: 
    dag_purpose: |
      Creates/updates the datamart tables, for the context of Rent, in data lake.
workflow:
  type: query_delta
  layer: dw
  custom_schema: datamarts
cluster:
  type: databricks_12_2_med_mem_driver_high_mem_nodes
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
