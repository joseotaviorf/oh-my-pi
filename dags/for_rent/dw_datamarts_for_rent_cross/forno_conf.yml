  #     runs_on: <backend-to-run-the-query> E.g: redshift or athena
  rental_demand_events_funnel_flows:
    dw:
      <<: *redshift_anchor
      table: rental_demand_events_funnel_flows
  rental_events_funnel:
    dw:
      <<: *redshift_anchor
