---
database_name: datalake_region
table_name: region
description: Table that contains information related to all regions that QuintoAndar group has operation for both contexts, Rent and Sale.
domain: For Rent
owner: gustavo.brunelli@quintoandar.com.br
columns:
  id:
    lineage:
      - core_region.region.id_region
    description: Unique id that identifies the region.
  id_city:
    lineage:
      - core_region.region.id_city_region
    description: "City id of the region (city-level region id resolved along the parent hierarchy)."
  id_macro_region:
    lineage:
      - core_region.region.id_macro_region
    description: Macro region id of the region (immediate parent region id when applicable).
  id_state:
    lineage:
      - core_region.region.id_state
    description: "Id of the region's state. It only comes from the region (itself or associated) that is at level = Cidade (city)."
  id_country:
    lineage:
      - core_region.region.id_country
    description: Numeric country identifier from Region Core for the geopolitical territory of this row.
  country_code:
    lineage:
      - core_region.region.country_code
    description: Two-letter ISO country code (BR, MX) for filtering and partitioning regional analytics.
    categories:
      BR: Brazil's country code
      MX: Mexico's country code
  level:
    lineage:
      - core_region.region.level
    description: The geopolitical subdivision that the region belongs to.
    categories:
      Cidade: The region is a city.
      MacroRegiao: The region is a macroregion.
      SubRegiao: The region is a subregion.
  name:
    lineage:
      - core_region.region.region_name
      - datalake_gsheets_clean.auxiliary_region.neighbourhood
    description: Display name of the geographic region (neighbourhood, subregion, or city label).
  macro_region_name:
    lineage:
      - core_region.region.region_name
    description: Name of the macro region of the region (parent row region_name when joined on id_macro_region).
  city_name:
    lineage:
      - core_region.region.city_region_name
      - datalake_gsheets_clean.auxiliary_region.city
    description: Human-readable city name for regional reporting.
  city_group:
    lineage:
      - datalake_gsheets_clean.auxiliary_region.city_group
    description: Commercial metropolitan grouping (RMSP, Rio de Janeiro) used for demand targets and reporting.
  city_ddd:
    lineage:
      - core_region.region.region_phone_ddd
      - datalake_gsheets_clean.auxiliary_region.ddd
    description: City DDD of the region. Telephone area code from Main region configuration when present, otherwise from auxiliary sheet.
  region_code:
    lineage:
      - datalake_gsheets_clean.auxiliary_region.region_code
    description: "The region code, also related to agents' operation."
  region_code_deprecated:
    lineage:
      - datalake_gsheets_clean.auxiliary_region.region_code_deprecated
    description: "The region code related to photographers' operation."
  region_code_inspector:
    lineage:
      - datalake_gsheets_clean.auxiliary_region.region_code_inspector
    description: "The region code related to inspectors' operation."
  short_region_name:
    lineage:
      - core_region.region.state_abbreviation
    description: State abbreviation for the region (e.g. SP, RJ). Sourced from the Region Core Model.
  greater_region:
    lineage:
      - core_region.region.city_region_name
      - datalake_gsheets_clean.auxiliary_region.city
    description: Greater region related to the region (metro grouping derived from coalesced city name and sheet override).
  regional:
    lineage:
      - datalake_gsheets_clean.auxiliary_region.regional
    description: The regional related to the region.
  regional_deprecated:
    lineage:
      - datalake_gsheets_clean.auxiliary_region.regional_deprecated
    description: An old regional classification, deprecated.
  regional_inspection:
    lineage:
      - datalake_gsheets_clean.auxiliary_region.regional_inspection
    description: "The regional related to the inspections' operation."
  tier:
    lineage:
      - datalake_gsheets_clean.auxiliary_region.tier
    description: The region classification in tiers, related to its city.
  country_name:
    lineage:
      - core_region.region.country_name
    description: Country name of the region (English display for Brazil and Mexico; other countries from core model).
    categories:
      Brazil: Country is Brazil.
      Mexico: Country is Mexico.
  is_city:
    lineage:
      - core_region.region.level
    description: Boolean related to if the region is or not a city.
  has_rent_operation:
    lineage:
      - core_region.region.has_rent_operation
    description: Boolean indicating if QuintoAndar operates with ForRent context in the given region (a region can be exclusive to Rent, exclusive to Sale or served by both contexts). If true, indicates that there is Rent operation in the region.
  has_sale_operation:
    lineage:
      - core_region.region.has_sale_operation
    description: Boolean indicating if QuintoAndar operates with ForSale context in the given region (a region can be exclusive to Rent, exclusive to Sale or served by both contexts). If true, indicates that there is Sale operation in the region.
  ts_created:
    lineage:
      - core_region.region.ts_region_created
    description: Timestamp of when the region was created.
  ts_updated:
    lineage:
      - core_region.region.ts_region_updated
    description: Timestamp of when the region was updated.
  sk_core_region:
    lineage:
      - core_region.region.sk_core_region
    description: Surrogate key of the region in the Region Core Model; stable join key to core_region.region.
  country_default_timezone:
    lineage:
      - core_region.region.country_default_timezone
    description: "Default timezone for the region's country from Main."
  year:
    lineage:
      - core_region.region.year
    description: Year partition component from region last update timestamp (aligned with core_region.region).
  month:
    lineage:
      - core_region.region.month
    description: Month partition component from region last update timestamp (aligned with core_region.region).
  day:
    lineage:
      - core_region.region.day
    description: Day partition component from region last update timestamp (aligned with core_region.region).
