database_name: datalake_region
table_name: city_groups_per_periods
description: Enrich table containing paired combinations of regions and dates, starting on 2019.
domain: Cross
owner: matheus.baroni@quintoandar.com.br
columns:
  country_code:
    lineage:
      - datalake_region.region.country_code
    description: Country code
  country_name:
    lineage:
      - datalake_region.region.country_name
    description: Full name of the country region
  city_group:
    lineage:
      - datalake_region.region.city_group
    description: City group
  year:
    lineage:
      - datalake_quintoandar.aux_date.year
    description: Year
  dt_month_started:
    lineage:
      - datalake_quintoandar.aux_date.month_start
    description: Date of the month start
  dt_weekly_started:
    lineage:
      - datalake_quintoandar.aux_date.week_start
    description: Date of the week start
