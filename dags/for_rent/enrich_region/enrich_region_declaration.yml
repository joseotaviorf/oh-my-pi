dag:
  name: enrich_region
  schedule_start_date: 2020, 7, 1
  documentation:
    dag_purpose: |
      Creates enriched tables for the context `Region`.
  owner: Data ForRent
workflow:
  type: query_delta
  layer: enrich
  default_partitions:
    - country_code
  tables_customization:
    region:
      has_hive_sync: false
cluster:
  type: databricks_16_4_med_general_photon_cluster
  custom_configurations:
    spark_conf:
      spark.sql.sources.partitionOverwriteMode: static
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
  databricks_conn_id: databricks_new_env
