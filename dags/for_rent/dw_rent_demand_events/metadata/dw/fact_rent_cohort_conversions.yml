database_name: dw_rent
table_name: fact_rent_cohort_conversions
description: "Transactional fact table that registers a row for each conversion in
  the funnel of ForRent demand. All types of conversions that shows up in this table
  are described in the dimension dw_rent.dim_rent_cohort_conversion_type.
  The goal of this table is to make it easy to analyze cohort conversions that happened. Along with the conversion,
  it's possible to analyze the event and its dimensions (rent flow, tenant prospect, etc.) by joining with the
  dw_rent.fact_rent_demand_events using the sk_base_event/sk_conversion_event and the respective sk_base_event_type/
  sk_conversion_event_type.
  This table also has the unconverted events (for example, a visit booked that didn't become a visit completed) marked
  with sk_convertion_event and sk_conversion_event_type as 0 and the keys sk_conversion_date, days_to_conversion and
  weeks_to_conversion will be -1.
  Each line is an unique cohort conversion."
domain: For Rent
owner: jonas.fiorini@quintoandar.com.br
columns:
  sk_cohort_conversion:
    lineage:
      - dw_rent.fact_rent_demand_events.sk_event
      - dw_rent.fact_rent_demand_events.sk_event_type
    description: "Unique key consolidated with the base event id + base event type id +
      base event coverted id + base event type converted id. Every id is splitted by a single '-'.
      (e.g sk_base_event - sk_base_event_type - sk_conversion_event - sk_conversion_event_type).
      If the event hasn't converted, the rule will be sk_base_event - sk_base_event_type - 0 - 0."
  sk_cohort_type:
    lineage:
      - dw_rent.fact_rent_demand_events.sk_event_type
    description: "Key that indicates the type of cohort conversion. It joins with dw_rent.dim_rent_cohort_conversion_type."
  sk_base_event:
    lineage:
      - dw_rent.fact_rent_demand_events.sk_event
    description: "Key of the base event. It joins with dw_rent.fact_rent_demand_events."
  sk_base_event_type:
    lineage:
      - dw_rent.fact_rent_demand_events.sk_event_type
    description: "Key of the base event type (indicating if the event is a VB, OS, etc.). It joins with dw_rent.fact_rent_demand_events."
  sk_conversion_event:
    lineage:
      - dw_rent.fact_rent_demand_events.sk_event
    description: "Key of the conversion event. It joins with dw_rent.fact_rent_demand_events.
      If the event hasn't converted, it will be 0."
  sk_conversion_event_type:
    lineage:
      - dw_rent.fact_rent_demand_events.sk_event_type
    description: "Key of the conversion event type (indicating if the event is a VC, OS, etc.). It joins with dw_rent.fact_rent_demand_events.
      If the event hasn't converted, it will be 0."
  sk_base_event_date:
    lineage:
      - dw_rent.fact_rent_demand_events.sk_event_date
    description: "Date key of the base event's date (e.g. visit's booking date, offer's submitted date, etc.)."
  sk_conversion_date:
    lineage:
      - dw_rent.fact_rent_demand_events.sk_event_date
    description: "Date key of the event's conversion date (e.g. visit's booking to completed date, etc.).
      If the event hasn't converted, it will be -1."
  country_code:
    lineage:
      - dw_rent.fact_rent_demand_events.country_code
    description: "Country code related to the event."
  days_to_conversion:
    description: "Days between the base event and the conversion event dates. If the event hasn't converted, it will be -1."
  weeks_to_conversion:
    description: "Weeks between the base event and the conversion event dates. If the event hasn't converted, it will be -1."
  ts_load:
    description: "Load date."
