dag:
  name: dw_rent_demand_events
  schedule_start_date: 2014,06,17
  owner: Data ForRent
workflow:
  type: query_delta
  layer: dw
  custom_schema: rent
  has_load_to_redshift_task: false
  inner_dependencies:
    fact_rent_cohort_conversions:
    - fact_rent_demand_events
  tables_customization:
    fact_rent_demand_events:
      partitions: [country_code, year, month, day]
    fact_rent_cohort_conversions:
      partitions: [country_code]
cluster:
  type: databricks_12_2_min_io-general_photon_cluster
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
