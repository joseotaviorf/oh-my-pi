database_name: datalake_b2b
table_name: house_listing
description: Enrich layer table for house listing from the enrich_b2b pipeline used in For Rent analytics.
  B2B.
domain: For Rent
owner: gustavo.brunelli@quintoandar.com.br
columns:
  id_house:
    lineage:
    - datalake_ebdb_clean.house.id
    description: ID of the house from EBDB.
  id_house_listing:
    lineage:
    - datalake_house_listing.house_listing.id_house_listing
    description: Foreign key to the house listing associated with this record.
  id_contract:
    lineage:
    - datalake_house_listing.house_listing.id_contract
    description: ID of the contract created for this house during this listing version.
  b2b_type:
    description: B2B partner program classification for the listing such as online, prime, or none.
    categories:
      online: The partner type associated to the house/listing is B2BPartner.
      prime: The partner type associated to the house/listing is PRIME.
      'null': The house/listing is not B2B or the active status of the partner agent is inactive.
  b2b_prime_type:
    description: Type of the B2B Prime, the value is filled only if the partner type is PRIME.
  is_b2b:
    description: Boolean value to check if the house is B2B.
  is_portability:
    description: Boolean value to check if the listing if from a portability.
