  troublesome_entrance:
    lineage:
    - datalake_booking.booking.troublesome_entrance_problem
    description: If it was not possible to enter the property to visit (succesful_entrance
      = 0), then this column lists the reason why it was not possible to enter
  checkin_status:
    lineage:
    - datalake_booking.booking.checkin_status
    description: Show status of whatsapp confirmation of visit. Only visits booked
