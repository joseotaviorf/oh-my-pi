    - datalake_booking.booking.agent_absence_reason
    description: '[Deprecated] Describes the reason why agent did not show up (by
      agent app follow up)'
  owner_missing_reason:
    lineage:
    - datalake_booking.booking.owner_missing_reason
    description: '[Deprecated] Describes the reason why owner did not show up (by
