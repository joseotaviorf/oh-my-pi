database_name: dw_public
table_name: dim_tenant_booking_review
description: After a visit, tenants review the agent accompanying the visit and the
  property they visited. Each line is a tenant review for a specific visit.
domain: For Rent
owner: gustavo.alencar@quintoandar.com.br
columns:
  sk_tenant_booking_review:
    lineage:
    - datalake_booking.booking_review.id_booking
    description: Key of tenant booking review.
  id_tenant_booking_review:
    lineage:
    - datalake_booking.booking_review.id_booking
    description: Key of tenant booking review
  review_status:
    lineage:
    - datalake_booking.booking_review.review_status
    description: Status of the tenant booking review
    categories:
      DISMISSED: ''
      DONE: ''
      PENDING: ''
  visit_not_happened_reason:
    lineage:
    - datalake_booking.booking_review.visit_not_happened_reason
    description: Reason for visit not happened.
  wrong_listing_info:
    lineage:
    - datalake_booking.booking_review.wrong_listing_info
    description: Wrong listing info reported by the tenant if he thinks listing is
      not accurate to the actual house.
  no_offer_intent_reason:
    lineage:
    - datalake_booking.booking_review.no_offer_intent_reason
    description: The reason why the tenant does not want to make an offer for the
      house visited.
  painting:
    lineage:
    - datalake_booking.booking_review.painting
    description: The score given by the tenant about the paiting of the house visited
      (range 1-5).
  cost_benefit:
    lineage:
    - datalake_booking.booking_review.cost_benefit
    description: The score given by the tenant about the cost benefit of the house
      visited (range 1-5).
  conservation:
    lineage:
    - datalake_booking.booking_review.conservation
    description: The score given by the tenant about the conservation of the house
      visited (range 1-5).
  cleaning:
    lineage:
    - datalake_booking.booking_review.cleaning
    description: The score given by the tenant about the cleanliness of the house
      visited (range 1-5).
  furniture:
    lineage:
    - datalake_booking.booking_review.furniture
    description: The score given by the tenant about the furniture of the house visited,
      if the house has furniture (range 1-5).
  natural_light:
    lineage:
    - datalake_booking.booking_review.natural_light
    description: The score given by the tenant about the natural light of the house
      visited (range 1-5).
  indoor_silence:
    lineage:
    - datalake_booking.booking_review.indoor_silence
    description: The score given by the tenant about the indoor silence of the house
      visited (range 1-5).
  agent_performance:
    lineage:
    - datalake_booking.booking_review.agent_performance
    description: The score given by the tenant about the performance of the agent
      (range 1-5).
  visit_type:
    lineage:
    - datalake_booking.booking_review.visit_type
    description: The type of the visit (presential or video).
    categories:
      presential: ''
      video: ''
  comment:
    lineage:
    - datalake_booking.booking_review.comment
    description: Tenants' comments about the visit (free-form entry field).
  is_listing_accurate:
    lineage:
    - datalake_booking.booking_review.is_listing_accurate
    description: If the listing info is corresponding with the actual property characteristics
  is_offer_intent:
    lineage:
    - datalake_booking.booking_review.is_offer_intent
    description: If the tenant has intention of making an offer for the house visited.
  does_want_same_agent:
    lineage:
    - datalake_booking.booking_review.does_want_same_agent
    description: If tenant wants to be attended by the same agent on  future visits
  ts_load:
    description: Timestamp in which the register was loaded in database
