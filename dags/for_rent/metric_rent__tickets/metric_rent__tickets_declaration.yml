dag:
  name: metric_rent__tickets
  schedule_start_date: 2023,07,13
  owner: Data ForRent
  documentation:
    dag_purpose: "This DAG consolidates the main metrics related to the Ticket Rate (FLUX) context."
workflow:
  type: query_delta
  layer: metric
  custom_schema: rent
cluster:
  type: databricks_13_3_med_io-general_cluster
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
