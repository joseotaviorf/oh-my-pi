---
database_name: metric_rent
table_name: total_tickets
description: Daily total tickets.
  This metric is being built with some specific filters for the FLUX context and is used to calculate Ticket Rate. The granularity is by contact_theme_detail and day.
domain: For Rent
owner: gustavo.silva@quintoandar.com.br
columns:
  dt_started:
    lineage:
      - dw_customer_support.customer_contacts.ts_task_created
      - dw_customer_support.fact_tickets.ts_solved
    description: Reference month first day.
    dimension: True
  contact_theme_tag:
    lineage:
      - dw_customer_support.dim_taxonomy.theme
    description: Theme of the ticket (aka. macro_taxonomy).
    dimension: True
  contact_theme_detail:
    lineage:
      - dw_customer_support.dim_taxonomy.theme_detail
    description: Theme detail of the ticket (aka. micro_taxonomy).
    dimension: True
  ticket_type:
    lineage:
      - dw_customer_support.dim_department.front_or_back
    description: Type of the ticket.
    categories:
      front: Front ticket.
      back: Back ticket.
    dimension: True
  journey:
    lineage:
      - dw_customer_support.dim_taxonomy.journey
    description: Journey of the ticket.
    dimension: True
  sub_journey:
    lineage:
      - dw_customer_support.dim_taxonomy.sub_journey
    description: Sub journey of the ticket.
    dimension: True
  line_owner:
    lineage:
      - dw_customer_support.dim_taxonomy.line_owner
    description: Line owner of the ticket.
    dimension: True
  team:
    lineage:
      - dw_customer_support.dim_department.team
    description: Team responsible for the ticket.
    dimension: True
  department:
    lineage:
      - dw_customer_support.dim_department.department
    description: Department responsible for the ticket.
    dimension: True
  total_abandoned_calls_distributed:
    description: Volume of tickets resulted from abandoned calls daily being proportionally distributed to this taxonomy.
    metric:
      name: Total Abandoned Calls Distributed Daily
      description: Volume of tickets resulted from abandoned calls daily.
      acronym: TACD
      is_additive: True
      business_stage: CX
      hierarchy: User analysis
      approved_by: marcus.pinto@quintoandar.com.br
      link_to_metric: ""
  total_tickets_identified:
    description: Count of unique CX's tickets by contact_theme_detail.
      Only considers tickets that had the taxonomy filled in after attendance.
    metric:
      name: Total Tickets Daily
      description: Count of unique CX's tickets.
      acronym: TTI
      is_additive: True
      business_stage: CX
      hierarchy: User analysis
      approved_by: marcus.pinto@quintoandar.com.br
      link_to_metric: ""
  total_tickets_distributed:
    description: Count of unique CX's tickets without contact_theme_detail,
      considering idle cases or in which the attendance was not classified (null taxonomy), and, proportionally distributed to this taxonomy.
    metric:
      name: Total Tickets Distributed Daily
      description: Count of unique CX's tickets without contact_theme_detail and proportionally distributed to this taxonomy.
      acronym: TTD
      is_additive: True
      business_stage: CX
      hierarchy: User analysis
      approved_by: marcus.pinto@quintoandar.com.br
      link_to_metric: ""
  total_tickets_proportional:
    description: Sum of total_tickets_identified, total_abandoned_calls_distributed and total_tickets_distributed.
    metric:
      name: Total Tickets Proportional Daily
      description: Volume of unique CX's tickets attributed to this taxonomy daily.
      acronym: TTP
      is_additive: True
      business_stage: CX
      hierarchy: User analysis
      approved_by: marcus.pinto@quintoandar.com.br
      link_to_metric: ""
