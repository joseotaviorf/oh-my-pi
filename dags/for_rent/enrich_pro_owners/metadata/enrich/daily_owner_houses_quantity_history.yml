---
database_name: datalake_pro_owners
table_name: daily_owner_houses_quantity_history
description: Historical enriched table for rent context (PP Multi - Pro owner). Each
  row contains the changes of owner's quantity houses per day, just considering rent
  and excluding b2b houses. Starting from March 2026, the PP Multi active status
  (is_pp_multi_active) and account manager (id_account_manager) are derived from
  the PP Multi management system (pp_multi_user) instead of the legacy
  user_pro_owner_aud audit table. Historical partitions prior to this change retain
  the original values. Backfill caveat - if a past partition is reprocessed, these
  two columns will reflect the current state of pp_multi_user, not the historical
  state on that date.
domain: For Rent
owner: gustavo.silva@quintoandar.com.br
columns:
  id_owner:
    lineage:
    - datalake_ebdb_user.user_merge.id_user
    - datalake_pro_owners.house_b2b_history.id_user
    description: EBDB user identifier of the landlord whose daily published house count is tracked.
  id_account_manager:
    lineage:
    - datalake_rental_management_clean.pp_multi_user.account_manager_id
    description: Id user of the account manager associated to an id_owner. Sourced from pp_multi_user when status is ACTIVE, NULL otherwise.
  country_code:
    lineage:
    - datalake_ebdb_country.user.country_code
    description: ISO country code for geographic filtering of the analytical metric.
  houses_published:
    description: Quantity of distincts houses that the owner has on a respective day with status 'publicado' or 'PUBLISHED'.
  houses_suspended:
    description: Quantity of distincts houses that the owner has on a respective day with status 'suspenso' or 'SUSPENDED' but it's not rented.
  houses_rented:
    description: Quantity of distincts houses that the owner has on a respective day with status 'alugado' or 'SUSPENDED' but rented.
  houses_unpublished:
    description: Quantity of distincts houses that the owner has on a respective day with status 'despublicado' or 'UNPUBLISHED'.
  houses_in_edition:
    description: Quantity of distincts houses that the owner has on a respective day with status 'edicao' or 'EDITING'.
  houses_opted_out:
    description: Quantity of distincts houses that the owner has on a respective day with status 'excluido' or 'OPTED_OUT'.
  ongoing_houses:
    description: Quantity of distincts houses that the owner has on a respective day with status 'publicado', 'alugado' and 'suspenso'.
  total_houses:
    description: Quantity of distincts houses that the owner has on a respective day independent of the status.
  brokerage_only_houses:
    description: Quantity of distincts houses that the owner had and that is managed by the owner (rental_administration = OWNER, which means it's a Brokerage Only house).
  quintoandar_houses:
    description: Quantity of distincts houses that the owner had and that is managed by QuintoAndar (rental_administration = QUINTOANDAR).
  third_party_houses:
    description: Quantity of distincts houses that the owner had and the house is from a third party supply. (rental_administration = THIRD_PARTY).
  is_merged_user:
    description: Boolean flag to check if the user is merged from another user.
  is_pp_multi_active:
    lineage:
    - datalake_rental_management_clean.pp_multi_user.status
    description: Boolean flag indicating if the owner has status ACTIVE in the PP Multi system (pp_multi_user).
  dt_houses_owned:
    lineage:
    - datalake_quintoandar.aux_date.date
    description: The date of the PP's house quantity.
  year:
    description: Year value of the date reference. Also, it's a partition.
  month:
    description: Month value of the date reference. Also, it's a partition.
  day:
    description: Day value of the date reference. Also, it's a partition.
