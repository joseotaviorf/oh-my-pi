---
custom_cluster:
  driver_node_type_id: m5d.xlarge
  node_type_id: m5d.2xlarge
  runtime_engine: PHOTON
  autoscale:
    min_workers: 1
    max_workers: 4
inner_dependencies:
  daily_owner_houses_quantity_history:
    - house_b2b_history
  daily_owner_version:
    - daily_owner_houses_quantity_history
    - pro_owner_history
  owner_houses_quantity_history:
    - house_b2b_history
  tracking_weekly_changes:
    - owner_houses_quantity_history
incremental_tables:
  - daily_owner_houses_quantity_history
  - daily_owner_version
  - tracking_weekly_changes
partition_cols:
  daily_owner_houses_quantity_history: ["year", "month", "day", "country_code"]
  daily_owner_version: ["year", "month", "day"]
  tracking_weekly_changes: ["year", "month", "day"]
