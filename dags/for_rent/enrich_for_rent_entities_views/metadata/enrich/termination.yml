database_name: datalake_for_rent_entities_views
table_name: termination
description: >
  Enriched view of FR_TERMINATION entities with persona expansion (OWNER, TENANT).
  Consumed by enrich_transactional_entities consolidation.
domain: For Rent
owner: isadora.gallerani@quintoandar.com.br
columns:
  id_entity:
    lineage:
      - datalake_terminator_clean.termination.id
    description: Termination id serving as the entity identifier.
  id_house:
    lineage:
      - core_contract.contract.id_house
    description: House id derived from the associated contract.
  id_contract:
    lineage:
      - datalake_terminator_clean.termination.id_contract
    description: Contract id associated with the termination.
  id_user:
    lineage:
      - core_contract.contract.id_owner
      - core_contract.contract.id_tenant
    description: User id (owner or tenant) from the associated contract.
  entity:
    description: Fixed value 'FR_TERMINATION'.
  persona:
    description: OWNER or TENANT.
  business_context:
    description: Fixed value 'RENT'.
  properties:
    lineage:
      - datalake_terminator_clean.termination.status
      - datalake_terminator_clean.termination.ts_created
    description: JSON with termination status and creation timestamp.
  is_active:
    description: TRUE for REQUESTED/INSPECTION_* statuses, FALSE for DONE/CANCELED.
  ts_created:
    lineage:
      - datalake_terminator_clean.termination.ts_created
    description: Timestamp when the termination was created.
  ts_updated:
    lineage:
      - datalake_terminator_clean.termination.ts_updated
    description: Timestamp when the termination was last updated.
