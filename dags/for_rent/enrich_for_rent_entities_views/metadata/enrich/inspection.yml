database_name: datalake_for_rent_entities_views
table_name: inspection
description: >
  Enriched view of FR_INSPECTION entities with persona expansion (OWNER, TENANT, AGENT_INSPECTOR).
  Consumed by enrich_transactional_entities consolidation.
domain: For Rent
owner: isadora.gallerani@quintoandar.com.br
columns:
  id_entity:
    lineage:
      - datalake_ebdb_clean.inspection.id
    description: Inspection id serving as the entity identifier.
  id_house:
    lineage:
      - datalake_ebdb_clean.inspection.id_house
    description: House id related to the inspection.
  id_contract:
    lineage:
      - datalake_ebdb_clean.inspection.id_contract
    description: Contract id associated with the inspection.
  id_user:
    lineage:
      - core_contract.contract.id_owner
      - core_contract.contract.id_tenant
      - datalake_ebdb_clean.inspection.id_user_inspector
    description: User id (owner, tenant, or inspector) associated with the inspection.
  entity:
    description: Fixed value 'FR_INSPECTION'.
  persona:
    description: OWNER, TENANT, or AGENT_INSPECTOR.
  business_context:
    description: Fixed value 'RENT'.
  properties:
    lineage:
      - datalake_ebdb_clean.inspection.status
      - datalake_ebdb_clean.inspection.dt_inspected
      - datalake_ebdb_clean.booking.dt_booking
    description: JSON with inspection status and date (dt_inspected or dt_booking).
  is_active:
    description: TRUE for Agendada/Comentada/EmAcordo/EmRevisao/Nova, FALSE for Finalizada/Cancelada/ContratoCancelado/Revisada.
  ts_created:
    lineage:
      - datalake_ebdb_clean.inspection.ts_created
    description: Timestamp when the inspection was created.
  ts_updated:
    lineage:
      - datalake_ebdb_clean.inspection.ts_updated
    description: Timestamp when the inspection was last updated.
