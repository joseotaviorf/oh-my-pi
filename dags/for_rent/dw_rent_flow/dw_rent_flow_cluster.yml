cluster:
  type: consolidation_m_general_cluster
  databricks_conn_id: databricks_new_env
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE
  custom_configurations:
    aws_attributes:
      ebs_volume_size: 200
    spark_conf:
      spark.sql.sources.partitionOverwriteMode: static
      spark.sql.shuffle.partitions: 256
    data_security_mode: USER_ISOLATION
    num_workers: 3
    runtime_engine: PHOTON
    driver_node_type_id: r6g.xlarge
validation:
  cluster:
    type: consolidation_s_memory_cluster
    databricks_conn_id: databricks_new_env
    access_control_list:
      group_name: analytics-engineers
      permission_level: CAN_MANAGE
    custom_configurations:
      aws_attributes:
        ebs_volume_size: 200
      spark_conf:
        spark.sql.sources.partitionOverwriteMode: static
        spark.sql.shuffle.partitions: 256
      data_security_mode: USER_ISOLATION
      num_workers: 3
      runtime_engine: PHOTON
      node_type_id: r7g.xlarge
      driver_node_type_id: r7g.xlarge
