---
database_name: dw_rent
table_name: dim_rent_flow_taxonomy
description: Dimension table containing the marketing taxonomy used to categorise rent
  flow demand leads by acquisition strategy, classifying each lead of origin (Tenant
  Prospect for Rent or Buyer Prospect for Sale) across channel, medium, source, and
  platform dimensions. Each row represents a unique taxonomy combination and is used
  by Growth and Rent Flow teams to attribute demand performance to the correct marketing
  investment.
domain: Growth
owner: gabriel.salla@quintoandar.com
columns:
  sk_rent_flow_taxonomy:
    lineage:
    - datalake_gsheets_clean.taxonomy_demand.id
    description: Unique id that identifies the rent flow taxonomy. It's the primary key of the table.
  id_rent_flow_taxonomy:
    lineage:
    - datalake_gsheets_clean.taxonomy_demand.id
    description: Unique id that identifies the rent flow taxonomy. It's the same as the primary key.
  mkt_category:
    lineage:
    - datalake_gsheets_clean.taxonomy_demand.category
    description: The interpretation of how the TP/BP is attributed to the acquisition strategy.
    categories:
      Inbound: Marketing strategy related to reaching clients through relevant content.
      Not Mapped: A more traditional marketing strategy, focused on reaching clients through physical and digital advertising.
  mkt_flow:
    lineage:
    - datalake_gsheets_clean.taxonomy_demand.flow
    description: Indicates the standard flow related to the TP/BP.
    categories:
      Non-Self Service: Indicates that the TP/BP went directly to the Inside Sales team (through affiliates, doorman, etc.).
      Not Mapped: Indicates that the TP/BP has an unmapped flow.
      Other: Indicates that the TP/BP has an other flow.
      Self-Service: Indicates that the TP/BP started by the property owner through the Owner PWA.
      Full Self Service: Full self-service flow variant observed in production taxonomy.
      Full Self-Service: Hyphenated full self-service flow variant.
  mkt_completion:
    lineage:
    - datalake_gsheets_clean.taxonomy_demand.completion
    description: Indicates the completion of the flow taxonomy related to the TP/BP.
    categories:
      Full Self-Service: Indicates that the property owner did the full rent flow alone, without contact with the Inside Sales team.
      Non-Self Service: Indicates that the TP/BP went directly to the Inside Sales team (through affiliates, doorman, etc.).
      Not Mapped: Indicates that the TP/BP has an unmapped flow.
      Other: Reflects directly the mkt_flow value.
  mkt_origin:
    lineage:
    - datalake_gsheets_clean.taxonomy_demand.origin
    description: Indicates the product from which the TP/BP came from.
    categories:
      Tenants PWA: The web app for QuintoAndar's tenants.
      Paid Acquisition: Paid media acquisition origin for rent demand.
      Secretaria: Secretary or assisted-service acquisition origin.
  mkt_channel:
    lineage:
    - datalake_gsheets_clean.taxonomy_demand.channel
    description: The second level of taxonomy, indicating which was the media channel used for the acquisition of the TP/BP.
  mkt_medium:
    lineage:
    - datalake_gsheets_clean.taxonomy_demand.medium
    description: Indicates the strategy or method related to the acquisition of the TP/BP.
    categories:
      Agents: Lead acquired through agents.
      Branding: Lead acquired through branding.
      CX: Lead acquired through the customer support team.
      Direct: Lead directly acquired.
      Display: Lead acquired through display.
      Lost Tracking: Lead acquired through lost tracking.
      Not Mapped: It wasn't possible to map the strategy.
      Notifications: Lead acquired through notifications.
      Online Classifieds: Lead acquired through online classifieds.
      Other: Lead acquired through other strategy.
      Performance Max: Lead acquired through performance max.
      Portals: Lead acquired through portals.
      Retargeting: Lead acquired through retargeting.
      SEM branded: Lead acquired through SEM branded.
      SEM non-branded: Lead acquired through SEM non-branded.
      SEO branded: Lead acquired through SEO branded.
      SEO non-branded: Lead acquired through SEO non-branded.
      Shared: Lead acquired through shared.
  mkt_source:
    lineage:
    - datalake_gsheets_clean.taxonomy_demand.source
    description: Indicates the source marketing media from which the TP/BP came from.
  mkt_platform:
    lineage:
    - datalake_gsheets_clean.taxonomy_demand.platform
    description: Indicates the platform from which the TP/BP came from.
    categories:
      Amp: The Amplitude platform.
      App Android: The QuintoaAndar's Android app.
      App iOS: The QuintoAndar's iOS app.
      Lost Tracking: Lead came through lost tracking.
      Not Mapped: A platform that wasn't possible to map.
      Other: Lead came through other platform.
      Web Desktop: The QuintoAndar's website page through a desktop computer.
      Web Mobile: The QuintoAndar's website page through a mobile phone.
  ts_load:
    description: Timestamp indicating the data load into our system. It has nothing related to the rent flow taxonomy itself.
