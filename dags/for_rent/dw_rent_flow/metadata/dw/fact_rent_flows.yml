  country_code:
    lineage:
      - datalake_rent_flows.rent_flows.country_code
    description:
      Country code of the rent flow, related to the property. Also, a partition of this table --
      if you're using this column as a filter, make sure to be one of the first filters, it will improve the
      query's performance.
  days_first_touchpoint_to_last:
    description: Amount of days between the first touchpoint date to the last event of the rent flow.
  days_since_last_event:
