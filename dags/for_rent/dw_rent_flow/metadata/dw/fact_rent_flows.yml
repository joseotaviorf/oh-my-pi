database_name: dw_rent
table_name: fact_rent_flows
description:
  Fact table that contains information related to a rent flow (which is the tuple [property, tenant prospect]),
  mostly related about its metrics. If desired to understand characteristics of the rent flow, it's necessary to join with
  the dw_rent.dim_rent_flow_type using the key sk_rent_flow_type.
  Each line is an unique rent flow (sk_rent_flow).
  This table is partitioned by the country_code column, so make sure to use it as one of the first filters of the query
  in order to improve its performance.
domain: For Rent
owner: jonas.fiorini@quintoandar.com.br
columns:
  sk_rent_flow:
    lineage:
      - datalake_rent_flows.rent_flows.id_rent_flow
    description:
      Id of the rent flow, also the PK of the table. Each line should be an unique rent flow.
      Joins with dw_rent.fact_listing_rent_flows.
  sk_rent_flow_type:
    lineage:
      - datalake_rent_flows.rent_flows_types.id_rent_flow_type
    description:
      Unique but mutable id that makes possible to identify the type of the rent flow and its combinations.
      To reach this information, it's necessary to use this key to join with the dw_rent.dim_rent_flow_type.
      This id should be used only to connect with mentioned dim table in order to identify the rent flow type and its
      characteristics, but never used for analysis (as for example, filtering data by it).
  sk_house:
    lineage:
      - datalake_rent_flows.rent_flows.id_house
    description: Id of the property. Joins with dw_rent.dim_house_listing
  sk_tenant_prospect:
    lineage:
      - datalake_rent_flows.rent_flows.id_tenant_prospect
    description: Id of the tenant prospect. Joins with dw_public.dim_user.
  sk_owner:
    lineage:
      - datalake_rent_flows.rent_flows.id_owner
    description: Id of the property owner. Joins with dw_public.dim_user.
  sk_first_booking:
    lineage:
      - datalake_rent_flows.rent_flows.id_booking
    description: Id of the first booking. Joins with dw_public.dim_booking.
  sk_last_booking:
    lineage:
      - datalake_rent_flows.rent_flows.id_booking
    description: Id of the most recent booking. Joins with dw_public.dim_booking.
  sk_first_reservation:
    lineage:
      - datalake_rent_flows.rent_flows.id_reservation
    description: Id of the first reservation. Joins with dw_rent.dim_reservation.
  sk_last_reservation:
    lineage:
      - datalake_rent_flows.rent_flows.id_reservation
    description: Id of the most recent reservation. Joins with dw_rent.dim_reservation.
  sk_first_offer:
    lineage:
      - datalake_rent_flows.rent_flows.id_offer
    description: Id of the first offer. Joins with dw_rent.dim_offer.
  sk_last_offer:
    lineage:
      - datalake_rent_flows.rent_flows.id_offer
    description: Id of the most recent offer. Joins with dw_rent.dim_offer.
  sk_first_proposal:
    lineage:
      - datalake_rent_flows.rent_flows.id_proposal
    description: Id of the first proposal. Joins with dw_rent.dim_proposal.
  sk_last_proposal:
    lineage:
      - datalake_rent_flows.rent_flows.id_proposal
    description: Id of the most recent proposal. Joins with dw_rent.dim_proposal.
  sk_first_contract:
    lineage:
      - datalake_rent_flows.rent_flows.id_contract
    description: Id of the first contract. Joins with dw_rent.dim_contract.
  sk_last_contract:
    lineage:
      - datalake_rent_flows.rent_flows.id_contract
    description: Id of the most recent contract. Joins with dw_rent.dim_contract.
  sk_region:
    lineage:
      - datalake_rent_flows.rent_flows.id_region
    description: Id of the property region. Joins with dw_public.dim_region.
  sk_company_supply:
    lineage:
      - datalake_rede_company.company_sks.sk_company
    description: Key of the Rede company that owns the house related to the rent flow. Can be joined with dw_rede.dim_company.
  sk_first_event_date:
    lineage:
      - datalake_rent_flows.rent_flows.ts_rent_flow_event
    description: Date of when happened the first event of the rent flow (touchpoint), transformed into an id.
  sk_first_booking_created_date:
