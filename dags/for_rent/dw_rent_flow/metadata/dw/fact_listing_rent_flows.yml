database_name: dw_public
table_name: fact_listing_rent_flows
description: Fact table that contains each rent flow (starting on booking creation
  or offer submitted, ending on contract signed). Each line is a rent flow from booking
  creation to contract signature
domain: For Rent
owner: E ForRent@quintoandar.com.br
columns:
  ods_id:
    lineage:
    - datalake_ebdb_rent_flow.rent_flow.id_house_rent_flow
    description: Id of rent flow
  sk_house_listing:
    lineage:
    - datalake_ebdb_rent_flow.rent_flow.id_house
    - dw_public.dim_house_listing.version
    description: Key of house listing
  sk_region:
    lineage:
    - datalake_ebdb_listing.house.id_region
    description: Key of house region
  sk_condo:
    lineage:
    - datalake_ebdb_listing.house.id_condo_parent
    description: Key of building where house is in
  sk_rent_flow:
    lineage:
    - datalake_ebdb_rent_flow.rent_flow.id_rent_flow
    description: Key of rent flow
  sk_booking:
    lineage:
    - datalake_ebdb_rent_flow.rent_flow.id_booking
    description: Key of booking (visit scheduled)
  sk_tenant_booking_review:
    lineage:
