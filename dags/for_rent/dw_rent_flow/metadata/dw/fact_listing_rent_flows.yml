      partner's user
  sk_user_agent:
    lineage:
    - datalake_ebdb_rent_flow.rent_flow.id_user_agent
    description: Key of agent responsible for visit
  sk_client:
    lineage:
    - datalake_ebdb_rent_flow.rent_flow.id_client
    description: Key of client that sent an offer or booked a visit
  sk_visit:
    lineage:
    - datalake_ebdb_rent_flow.rent_flow.id_visit
    description: Key of visit scheduled confirmation
  sk_offer:
    lineage:
    - dw_public.dim_offer.sk_offer
    description: Key of offer
  sk_reservation:
    lineage:
    - datalake_kill_queue.reservation.id_reservation
    description: Key of reservation
  sk_proposal:
    lineage:
    - datalake_ebdb_rent_flow.rent_flow.id_proposal
    description: Key of proposal (offer that was accepted)
  sk_contract:
    lineage:
    - dw_public.dim_contract.sk_contract
    description: Key of contract
  sk_rent_flow_taxonomy:
    lineage:
