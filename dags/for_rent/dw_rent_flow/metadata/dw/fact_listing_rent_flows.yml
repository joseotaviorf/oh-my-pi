database_name: dw_rent
table_name: fact_listing_rent_flows
description:
  Fact table that contains events (visit(s), offer(s), etc.) of a rent flow, starting the flow on the booking creation or direct offer submitted.
  It's very important to keep in mind that every line of this table is related to an event of the rent flow and it's possible to occur more than one event per type in the same rent flow, e.g. multiple bookings within the same rent flow.
  Each line is a rent flow composed by house listing + tenant prospect + event related to the rent flow.
domain: For Rent
owner: isadora.gallerani@quintoandar.com.br
columns:
  ods_id:
    lineage:
      - datalake_ebdb_rent_flow.rent_flow.id_house_rent_flow
    description: Unique and mutable sequential id, assigning a value to each line. It is not directly related to the rent flow.
  sk_house_listing:
    lineage:
      - datalake_ebdb_rent_flow.rent_flow.id_house
      - dw_rent.dim_house_listing.version
    description: Key of the house listing related to the rent flow.
  sk_region:
    lineage:
      - datalake_ebdb_listing.house.id_region
    description: Key of the region related to the rent flow's house.
  sk_condo:
    lineage:
      - datalake_ebdb_listing.house.id_condo_parent
    description: Key of the condominium/building where the rent flow's house is located, if it has one.
  sk_rent_flow:
    lineage:
      - datalake_ebdb_rent_flow.rent_flow.id_rent_flow
    description: Key that identifies the rent flow.
  sk_booking:
    lineage:
      - datalake_ebdb_rent_flow.rent_flow.id_booking
    description: Key of the booking (visit scheduled) related to the rent flow. A rent flow can have none, one or more bookings related.
  sk_tenant_booking_review:
    lineage:
      - datalake_ebdb_rent_flow.rent_flow.id_booking
    description: Key of the tenant's booking review. A rent flow can have none, one or more reviews related.
  sk_owner:
    lineage:
      - datalake_ebdb_rent_flow.rent_flow.id_owner
    description: Key of the user who is the house owner/responsible. The key can also be the partner user related to the property.
  sk_user_agent:
    lineage:
      - datalake_ebdb_rent_flow.rent_flow.id_user_agent
    description: Key of the agent related to a visit during the rent flow, if it has one. A rent flow can have none, one or more agents related.
  sk_client:
    lineage:
      - datalake_ebdb_rent_flow.rent_flow.id_client
    description: Key of the tenant prospect that booked the first vist or sent the direct offer.
  sk_visit:
    lineage:
      - datalake_ebdb_rent_flow.rent_flow.id_visit
    description: Key of the visit scheduled on the rent flow. A rent flow can have none, one or more visits related.
  sk_offer:
    lineage:
      - dW_rent.dim_offer.sk_offer
    description: Key of the offer related to the rent flow. A rent flow can have none, one or more offers related.
  sk_reservation:
    lineage:
      - datalake_kill_queue.reservation.id_reservation
    description: Key of the reservation related to the rent flow. A rent flow can have none, one or more reservations related.
  sk_proposal:
    lineage:
      - datalake_ebdb_rent_flow.rent_flow.id_proposal
    description: Key of the proposal related to the rent flow, an offer that was accepted. A rent flow can have none, one or more proposals related.
  sk_contract:
    lineage:
      - datalake_ebdb_contract.contract.id
    description: Key of the contract related to the rent flow. A rent flow can have none, one or more contracts related.
  sk_rent_flow_taxonomy:
    lineage:
      - dw_public.dim_booking.sk_rent_flow_taxonomy
    description: Key of the rent flow taxonomy related to the rent flow. A rent flow can have none, one or more taxonomies related.
  sk_company_supply:
    lineage:
      - datalake_rede_company.company_sks.sk_company
    description: Key of the Rede company that owns the house related to the rent flow. Can be joined with dw_rede.dim_company.
  sk_house_first_listing_date:
    lineage:
      - datalake_ebdb_rent_flow.rent_flow.dt_house_first_listing
    description: Key of the the first listing date of the property related to the rent flow. It's the date of the first listing of the property transformed into a number.
  sk_house_listing_date:
    lineage:
      - datalake_ebdb_listing.house_listing.ts_listing_version_start
    description: Key of the house listing date of the present version related to the rent flow. It's the date of the listing's version start transformed into a number.
  sk_house_listing_de_publication_date:
    lineage:
      - datalake_ebdb_listing.house_listing.ts_last_unpublished
    description: Key of the house listing depublication date of the present version related to the rent flow. It's the date of the listing's version depublication transformed into a number.
  sk_house_listing_first_offer_submitted_date:
    lineage:
      - dw_rent.dim_offer.dt_created
    description: Key of the property's first offer submitted date. It's important to notice that this date is related to the house's first offer submitted, not the house listing.
  sk_booking_created_date:
    lineage:
      - datalake_ebdb_rent_flow.rent_flow.dt_booking_created
    description: Key of the booking's date when the visit was scheduled. It's the date of the booking date transformed into a number. A rent flow can have none, one or more booking creation dates.
  sk_visit_date:
    lineage:
      - datalake_ebdb_rent_flow.rent_flow.dt_visit
    description: Key of the date when the visit is intended to happen. It's the date of the chosen visit day transformed into a number. A rent flow can have none, one or more visit dates.
  sk_agent_sign_up_date:
    lineage:
      - datalake_ebdb_rent_flow.rent_flow.dt_agent_sign_up
    description: Key of the date when the agent related to the rent flow's event signed up in the platform. It's the date of the agent's sign up transformed into a number. A rent flow can have none, one or more agent's sign up date, because it can have more than one agent related.
  sk_client_sign_up_date:
    lineage:
      - datalake_ebdb_rent_flow.rent_flow.dt_client_sign_up
    description: Key of the date when the tenant prospect signed up in the platform. It's the sign up date transformed into a number.
  sk_offer_submitted_date:
    lineage:
      - dw_rent.dim_offer.dt_first_sent
    description: Key of the date when the offer was submitted by the tenant prospect. It's the offer's submitted date transformed into a number. A rent flow can have none, one or more offer's submitted dates.
  sk_min_offer_submitted_date:
    lineage:
      - dw_rent.dim_offer.dt_first_sent
    description: Key of the first date when an offer was submitted by the tenant prospect in the rent flow. It's the first offer's submitted date transformed into a number.
  sk_offer_approved_date:
    lineage:
      - datalake_ebdb_rent_flow.rent_flow.dt_analysis
    description: Key of the date when an offer was approved by the property owner. It's the offer's approved date transformed into a number. A rent flow can have none, one or more offer's approved dates.
  sk_reservation_created_date:
    lineage:
      - datalake_kill_queue.reservation.ts_created
    description: Key of the date when a house listing was reserved by the tenant prospect. It's the reservation's creation date transformed into a number. A rent flow can have none, one or more reservation's created dates.
  sk_proposal_approved_date:
    lineage:
      - datalake_ebdb_rent_flow.rent_flow.dt_proposal_approved
    description: Key of the date when the proposal was approved, which means that all steps (documentation and credit analysis) are approved. It's the proposal's approved date transformed into a number. A rent flow can have none, one or more proposal's approved dates.
  sk_proposal_processed_date:
    lineage:
      - datalake_proposal.proposal.ts_processed
    description: Key of the date when the proposal was processed, which means that all steps (documentation and credit analysis) are finished. It's the proposal's processed date transformed into a number. A rent flow can have none, one or more proposal's processed dates.
  sk_tenant_first_doc_sent_date:
    lineage:
      - datalake_proposal.proposal.ts_tenant_first_doc_sent
      - datalake_proposal.proposal.ts_tenant_auto_first_doc_sent
    description: Key of the date when the tenant prospect first sent the documentation related to the rent flow. It's the client's first documentation sent date transformed into a number.
  sk_tenant_manual_first_doc_sent_date:
    lineage:
      - datalake_proposal.proposal.ts_tenant_first_doc_sent
    description: Key of the date when the tenant prospect first manually sent the documentation related to the rent flow. It's the client's first manual documentation sent date transformed into a number.
  sk_tenant_auto_first_doc_sent_date:
    lineage:
      - datalake_proposal.proposal.ts_tenant_auto_first_doc_sent
    description: Key of the date when the tenant prospect first automatically sent the documentation related to the rent flow. It's the client's first automatic documentation sent date transformed into a number.
  sk_tenant_first_doc_complete_date:
    lineage:
      - datalake_proposal.proposal.ts_tenant_first_doc_complete
    description: Key of the date when the tenant prospect first completed the documentation. It's the client's first completed documentation date transformed into a number.
  sk_tenant_last_doc_complete_date:
    lineage:
      - datalake_proposal.proposal.ts_tenant_last_doc_complete
    description: Key of the date when the tenant prospect completed the last documentation. It's the client's last completed documentation date transformed into a number.
  sk_tenant_doc_complete_date:
    lineage:
      - datalake_proposal.proposal.ts_tenant_last_doc_complete
    description: Key of the date when the tenant prospect documentation was completed. It's the client's documentation completed date transformed into a number. A rent flow can have none, one or more documentation completed dates.
  sk_contract_created_date:
    lineage:
      - datalake_ebdb_contract.contract.ts_created
    description: Key of the date when the contract related to the rent flow was created. It's the contract's creation date transformed into a number. A rent flow can have none, one or more contract's created dates.
  sk_contract_signed_date:
    lineage:
      - datalake_ebdb_contract.contract.ts_signed
    description: Key of the date when the contract related to the rent flow was signed. It's the contract's signed date transformed into a number. A rent flow can have none, one or more contract's signed dates.
  sk_contract_annulment_date:
    lineage:
      - datalake_ebdb_contract.contract.dt_termination
    description: Key of the date when the contract related to the rent flow was terminated. It's the contract's termination date transformed into a number. A rent flow can have none, one or more contract's termination dates.
  sk_contract_canceled_date:
    lineage:
      - datalake_ebdb_contract.contract.ts_canceled
    description: Key of the date when the contract related to the rent flow was canceled. It's the contract's cancelation date transformed into a number. A rent flow can have none, one or more contract's canceled dates.
  sk_credit_analysis_first_init_date:
    lineage:
      - datalake_proposal.proposal.ts_credit_analysis_first_init
    description: Key of the date when the first credit analysis started for the proposal. It's the first credit analysis' init date transformed into a number. A rent flow can have none, one or more first credit analysis' init dates.
  sk_credit_analysis_last_init_date:
    lineage:
      - datalake_proposal.proposal.dt_credit_analysis_last_init
    description: Key of the date when the last credit analysis started for the proposal. It's the last credit analysis' init date transformed into a number. A rent flow can have none, one or more last credit analysis' init dates.
  sk_credit_analysis_init_date:
    lineage:
      - datalake_proposal.proposal.ts_credit_analysis_last_init
    description: Key of the date of the credit analysis init for the proposal. It's the credit analysis' init date transformed into a number. A rent flow can have none, one or more credit analysis' init dates.
  sk_credit_analysis_first_end_date:
    lineage:
      - datalake_proposal.proposal.ts_credit_analysis_first_end
    description: Key of the date when the first credit analysis ended for the proposal. It's the first credit analysis' ended date transformed into a number. A rent flow can have none, one or more first credit analysis' ended dates.
  sk_credit_analysis_last_end_date:
    lineage:
      - datalake_proposal.proposal.dt_credit_analysis_last_end
    description: Key of the date when the last credit analysis ended for the proposal. It's the last credit analysis' ended date transformed into a number. A rent flow can have none, one or more last credit analysis' ended dates.
  sk_credit_analysis_end_date:
    lineage:
      - datalake_proposal.proposal.ts_credit_analysis_last_end
    description: Key of the date when the credit analysis ended for the proposal. It's the credit analysis' ended date transformed into a number. A rent flow can have none, one or more credit analysis' ended dates.
  sk_credit_analysis_approved_date:
    lineage:
      - datalake_proposal.proposal.ts_credit_approved_last
    description: Key of the date when the credit analysis was approved. It's the credit analysis' approved date transformed into a number. A rent flow can have none, one or more credit analysis' approved dates.
  sk_first_credit_evaluation_init:
    lineage:
      - datalake_proposal.proposal.ts_credit_evaluation_first_init
    description: Key of the date when the first credit evaluation was initiated related to the proposal. It's the first credit evaluation's init date transformed into a number. A rent flow can have none, one or more first credit evaluation's init dates.
  sk_last_credit_evaluation_init:
    lineage:
      - datalake_proposal.proposal.ts_credit_evaluation_last_init
    description: Key of the date when the last credit evaluation was initiated related to the proposal. It's the last credit evaluation's init date transformed into a number. A rent flow can have none, one or more last credit evaluation's init dates.
  sk_first_credit_evaluation_positive:
    lineage:
      - datalake_proposal.proposal.ts_first_credit_evaluation_positive
    description: Key of the date when the first credit evaluation was positive related to the proposal. It's the first positive credit evaluation date transformed into a number. A rent flow can have none, one or more first positive credit evaluation's dates.
  sk_last_credit_evaluation_positive:
    lineage:
      - datalake_proposal.proposal.ts_last_credit_evaluation_positive
    description: Key of the date when the last credit evaluation was positive related to the proposal. It's the last positive credit evaluation date transformed into a number. A rent flow can have none, one or more last positive credit evaluation's dates.
  sk_first_credit_evaluation_negative:
    lineage:
      - datalake_proposal.proposal.ts_credit_evaluation_first_negative
    description: Key of the date when the first credit evaluation was negative related to the proposal. It's the first negative credit evaluation date transformed into a number. A rent flow can have none, one or more first negative credit evaluation's dates.
  sk_last_credit_evaluation_negative:
    lineage:
      - datalake_proposal.proposal.ts_credit_evaluation_last_negative
    description: Key of the date when the last credit evaluation was negative related to the proposal. It's the last negative credit evaluation date transformed into a number. A rent flow can have none, one or more last negative credit evaluation's dates.
  sk_guarantee_date:
    lineage:
      - datalake_proposal.proposal.ts_guarantee
    description: Key of the date when the tenant prospect opted for the Rental Guarantee. It's the date of when the Rental Guarantee was processed in our system, transformed into a number. A rent flow can have none, one or more guarantee's dates.
  sk_first_doc_analysis_approved:
    lineage:
      - datalake_proposal.proposal.ts_doc_analysis_first_approved
    description: Key of the date when the first documentation analysis was approved. It's the documentation analysis' approval date transformed into a number. A rent flow can have none, one or more first documentation analysis' approved dates.
  sk_last_doc_analysis_approved:
    lineage:
      - datalake_proposal.proposal.ts_doc_analysis_last_approved
    description: Key of the date when the last documentation analysis was approved. It's the last documentation analysis' approval date transformed into a number. A rent flow can have none, one or more last documentation analysis' approved dates.
  sk_first_doc_analysis_rejected:
    lineage:
      - datalake_proposal.proposal.ts_doc_analysis_first_rejected
    description: Key of the date when the first documentation analysis was rejected. It's the documentation analysis' rejection date transformed into a number. A rent flow can have none, one or more documentation analysis' rejected dates.
  sk_last_doc_analysis_rejected:
    lineage:
      - datalake_proposal.proposal.ts_doc_analysis_last_rejected
    description: Key of the date when the last documentation analysis was rejected. It's the last documentation analysis' rejection date transformed into a number. A rent flow can have none, one or more last documentation analysis' rejected dates.
  sk_guarantee_paid_date:
    lineage:
      - datalake_proposal.proposal.ts_guarantee_paid
    description: Key of the date of when the guarantee was paid. It's the guarantee's pay date transformed into a number. A rent flow can have none, one or more guarantees paid dates.
  sk_agent_review_rating_date:
    lineage:
      - datalake_ebdb_agents.agents_review.ts_rating_created
    description: Key of the agent review rating date related to a booked visit of the rent flow. It's the agent's review rating date transformed into a number. A rent flow can have none, one or more agent's review rating dates.
  country_code:
    lineage:
      - datalake_ebdb_listing.house.country_code
    description: Country code of origin related to the property of the rent flow. It must be the same value for all events in the same property.
  visit_created_type:
    lineage:
      - datalake_ebdb_rent_flow.rent_flow.visit_created_type
    description: The origin type of the visit creation related to the rent flow. A rent flow can have none, one or more values, since many visits from different origins may happen.
    categories:
      Admin: Visit was created through Admin, our internal service.
      CidadeAlerta: Visit was automatically created through a schedule slot request from the Cidade Alerta internal product (which is deprecated).
      Corretores: Visit was created through the Agents app.
      Encaixe: Visit was created from a schedule slot request.
      Inquilinos: Visit was created through the Tenants app.
      SelfServiceWeb: Visit was created through our PWA, which means that the tenant prospect created it.
  booking_utm_campaign:
    lineage:
      - dw_public.dim_booking.utm_campaign
    description: The UTM value used to identify the campaign in the media related to the booking. A rent flow can have none, one or more values, since many bookings from different campaigns may happen.
  booking_utm_content:
    lineage:
      - dw_public.dim_booking.utm_content
    description: The UTM value that identifies what specifically was clicked in a campaign media to bring the tenant prospect to our platform. Is often used for A/B testing and content-targeted ads. A rent flow can have none, one or more values, since many bookings from different campaigns may happen.
  booking_utm_term:
    lineage:
      - dw_public.dim_booking.utm_term
    description: The UTM value that identifies search terms that brought the tenant prospect to our platform. A rent flow can have none, one or more values, since many bookings from different campaigns may happen.
  funnel_step:
    description: The funnel step where the rent flow is in or has stoppped.
    categories:
      contract_created: The rent flow is in/stopped at contract creation.
      contract_signed: The rent flow is in/stopped with contract signed.
      credit_approved: The rent flow is in/stopped with credit approved.
      document_completed: The rent flow is in/stopped with complete documentation.
      document_sent: The rent flow is in/stopped with documentation sent.
      offer_aproved: The rent flow is in/stopped with offer approved.
      offer_submitted: The rent flow is in/stopped with offer submission.
      visit_booked: The rent flow is in/stopped with visit booked.
      visit_completed: The rent flow is in/stopped with visit completed.
  funnel_step_drop_reason:
    lineage:
      - datalake_ebdb_contract.contract.cancellation_reason
      - dw_rent.dim_offer.rejection_reason
      - datalake_proposal.proposal.rejection_reason
      - dw_public.dim_booking.cancellation_reason
    description: The reason of why the rent flow has stopped in the actual funnel step. A rent flow can have none, one or more values of drop reason.
  flg_visit_completed:
    lineage:
      - datalake_ebdb_rent_flow.rent_flow.is_visit_completed
    description: Boolean flag that indicates if the tenant prospect and agent were present in the visit, which means that the visit was completed.
  flg_visit_performed:
    lineage:
      - datalake_ebdb_rent_flow.rent_flow.is_visit_performed
    description: Boolean flag that indicates if only the agent was present in the visit or if the owner didn't show up on a visit to a property with entrance restrictions, which means that the visit didn't happen.
  flg_visit_created_from_app:
    lineage:
      - datalake_ebdb_rent_flow.rent_flow.is_visit_created_from_app
    description: Boolean flag that indicates if the visit was created from the app.
  flg_visit_last_updated_from_app:
    lineage:
      - datalake_ebdb_rent_flow.rent_flow.is_visit_last_updated_from_app
    description: Boolean flag that indicates if the last visit's update was from the app.
  days_booking_created_to_contract_signed:
    description: Number of days between the booking creation and the contract signed.
  days_booking_created_to_visit:
    description: Number of days between the booking creation and the visit completed (tenant prospect and agent were present in the visit).
  days_booking_created_to_offer_submitted:
    description: Number of days between the booking creation and the offer submitted.
  days_contract_created_to_contract_signed:
    description: Number of days between the contract creation and the contract signed.
  days_credit_approved_to_closing_processed:
    description: Number of days between the credit analysis approval and the closing processed.
  days_credit_approved_to_contract_created:
    description: Number of days between the tenant prospect credit analysis approval and contract created.
  days_credit_approved_to_contract_signed:
    description: Number of days between the tenant prospect credit analysis approval and contract signed.
  days_doc_completed_to_credit_processed:
    description: Number of days between the tenant prospect completed documentation sent and credit analysis processed related to the proposal.
  days_first_doc_sent_to_credit_processed:
    description: Number of days between the tenant prospect first documentation sent and the credit analysis processed related to the proposal.
  days_first_doc_sent_to_doc_completed:
    description: Number of days between the tenant prospect first documentation sent and have completed documentation sent related to the proposal.
  days_house_listing_to_contract_signed:
    description: Number of days between the start of the house listing version and the contract signed.
  days_house_listing_to_visit:
    description: Number of days between the start of the house listing version and the visit booked date.
  days_insurance_approved_to_contract_signed:
    description: Number of days between the insurance approval and the contract signed.
  days_offer_approved_to_contract_signed:
    description: Number of days between the offer approval and the contract signed.
  days_offer_approved_to_credit_init:
    description: Number of days between the offer approval and the credit analysis init related to the proposal.
  days_offer_approved_to_doc_contact:
    description: Number of days between the offer approval and the proposal processed/documentation sent.
  days_offer_approved_to_doc_first_sent:
    description: Number of days between the offer approval and the tenant prospect first documentation sent.
  days_offer_approved_to_owner_doc_sent:
    description: Number of days between the offer approval and the property owner documentation sent.
  days_offer_approved_to_tenant_first_doc_sent:
    description: Number of days between the offer approval and the tenant prospect first documentation sent.
  days_offer_submitted_to_contract_signed:
    description: Number of days between the offer submission and the contract signed.
  days_offer_submitted_to_internal_analysis:
    description: Number of days between the offer submission and the internal analysis started.
  days_offer_submitted_to_offer_approved:
    description: Number of days between the offer submission and the offer approval.
  days_tenant_doc_completed_to_credit_approved:
    description: Number of days between the tenant prospect completed documentation sent and the credit analysis approval.
  days_tenant_first_doc_sent_to_doc_completed:
    description: Number of days between the tenant prospect first documentation sent and the completed documentation sent.
  days_tenant_first_doc_sent_to_insurance_approved:
    description: Number of days between the tenant prospect first documentation sent and the insurance approval.
  days_user_created_to_visit:
    description: Number of days between the tenant prospect sign up date into our platform and the visit completed (tenant prospect and agent were present in the visit).
  days_visit_to_contract_signed:
    description: Number of days between the visit booked date and the contract signed.
  days_visit_to_offer_submitted:
    description: Number of days between the visit booked date and the offer submitted.
  reservation_attempts:
    description: The number of attempts that the tenant prospect did to reserve the property.
  working_min_credit_approved_to_contract_created:
    description: Number of working minutes between the credit analysis last approval and the contract creation.
  working_min_credit_approved_to_contract_signed:
    description: Number of working minutes between the credit analysis last approval and the contract signature.
  working_min_contract_created_to_contract_signed:
    description: Number of working minutes between the contract creation and the contract signature.
  ts_load:
    description: Timestamp indicating the data load into our system. It has nothing related to the rent flow itself.
