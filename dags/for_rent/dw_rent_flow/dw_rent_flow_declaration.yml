dag:
  name: dw_rent_flow
  schedule_start_date: 2021,11,14
  owner: Data ForRent
workflow:
  type: query
  layer: dw
  custom_schema: public
  spark_session_configs:
    udfs: [FINTECHOPS_WORK_MIN_SLA]
  tables_customization:
