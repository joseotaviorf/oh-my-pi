dag:
  name: dw_rent_flow
  schedule_start_date: 2021,11,14
  owner: Data ForRent
workflow:
  type: query_delta
  layer: dw
  custom_schema: rent
  spark_session_configs:
    udfs: [FINTECHOPS_WORK_MIN_SLA]
  tables_customization:
    dim_rent_flow_type:
      partitions: [country_code, first_touchpoint]
    fact_listing_rent_flows:
      partitions: [country_code]
    fact_rent_flows:
      partitions: [country_code]
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: m5d.4xlarge
    node_type_id: m5d.8xlarge
    runtime_engine: PHOTON
    num_workers: 2
    spark_version: 12.2.x-scala2.12
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE
