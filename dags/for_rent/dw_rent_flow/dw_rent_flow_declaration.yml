dag:
  name: dw_rent_flow
  schedule_start_date: 2021,11,14
  owner: Data ForRent
workflow:
  type: query_delta
  layer: dw
  custom_schema: rent
  spark_session_configs:
    udfs: [FINTECHOPS_WORK_MIN_SLA]
  tables_customization:
    dim_rent_flow_type:
      partitions: [country_code, first_touchpoint]
    fact_listing_rent_flows:
      partitions: [country_code]
    fact_rent_flows:
      partitions: [country_code]
cluster:
  type: databricks_12_2_med_io-general_photon_cluster
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE
  custom_configurations:
    spark_conf:
      spark.sql.shuffle.partitions: 256
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
  databricks_conn_id: databricks_new
