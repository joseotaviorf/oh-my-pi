database_name: datalake_ebdb_clean
table_name: pro_owner_fee_aud
owner: kleber.inoue@quintoandar.com.br
description: Table that contains the historical changes of the table pro_owner_fee.
  The id_pro_owner column may contain duplicated IDs due to the changes.
domain: For Rent
columns:
  id:
    lineage:
      - datalake_ebdb_raw.proownerfee_aud.id
    description: ID of the PP Multi's owners/landlords administration fee. Also this table's primary key.
  id_user_pro_owner:
    lineage:
      - datalake_ebdb_raw.proownerfee_aud.user_pro_owner_id
    description: ID related to UserProOwner table.
      It can be joined with the ID table from datalake_ebdb_clean.user_pro_owner
  rev:
    lineage:
      - datalake_ebdb_raw.proownerfee_aud.rev
    description: ID of the change. It can be joined with user_revision_entity table using the id column.
  revtype:
    lineage:
      - datalake_ebdb_raw.proownerfee_aud.revtype
    description: Type of the table update.
    categories:
      "0": The record was inserted.
      "1": The record was updated.
      "2": The record was deleted.
  adm_fee:
    lineage:
      - datalake_ebdb_raw.proownerfee_aud.adm_fee
    description: Owner's/Landlord's administration fee.
  is_active:
    lineage:
      - datalake_ebdb_raw.proownerfee_aud.active
    description: Boolean flag to check if it's active.
  mod_id_user_pro_owner:
    lineage:
      - datalake_ebdb_raw.proownerfee_aud.user_pro_owner_id_mod
    description: Column to check if the id_user_pro_owner column was updated.
  mod_adm_fee:
    lineage:
      - datalake_ebdb_raw.proownerfee_aud.adm_fee_mod
    description: Column to check if the adm_fee column was updated.
  mod_is_active:
    lineage:
      - datalake_ebdb_raw.proownerfee_aud.active_mod
    description: Column to check if the is_active column was updated.