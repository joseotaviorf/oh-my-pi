database_name: datalake_ebdb_clean
table_name: consumption_bill_aud
description: AUD Consumptions bill table from EBDB source.
  It registers the consumptions types of the houses with it's and owner's info.
domain: For Rent
owner: kleber.inoue@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_ebdb_raw.contaconsumo_aud.id
    description: ID of the consumption bill. It's the primary key of the table.
  id_house:
    lineage:
      - datalake_ebdb_raw.contaconsumo_aud.imovel_id
    description: ID of the house from EBDB source.
  id_supplier:
    lineage:
      - datalake_ebdb_raw.contaconsumo_aud.supplier_id
    description: ID of the bill supplier.
  rev:
    lineage:
      - datalake_ebdb_raw.contaconsumo_aud_aud.rev
    description: Column indicating the revision of the register. It can be joined with the rev column of the user_revision_entity table to check the changes.
  rev_type:
    lineage:
      - datalake_ebdb_raw.contaconsumo_aud_aud.revtype
    description: Column indicating the revision type of the register.
  installation_code:
    lineage:
      - datalake_ebdb_raw.contaconsumo_aud.codigoinstalacao
    description: Installation code.
  type:
    lineage:
      - datalake_ebdb_raw.contaconsumo_aud.tipo
    description: Type of the consumption bill.
  type_charging_bill:
    lineage:
      - datalake_ebdb_raw.contaconsumo_aud.chargingBillType
    description: Type of the charging bill.
  titularity:
    lineage:
      - datalake_ebdb_raw.contaconsumo_aud.titularidade
    description: Name of the company or person that is responsible for the bill.
  transfer_register:
    lineage:
      - datalake_ebdb_raw.contaconsumo_aud.transferRegister
    description: Register transfer record to check if the bill was transfered.
  cpf_holder:
    lineage:
      - datalake_ebdb_raw.contaconsumo_aud.cpftitular
    description: CPF (Individal Taxpayer Registration) of the holder.
  zip_code:
    lineage:
      - datalake_ebdb_raw.contaconsumo_aud.endereco_cep
    description: Zip code of the house.
  address:
    lineage:
      - datalake_ebdb_raw.contaconsumo_aud.endereco_logradouro
    description: House's address.
  number:
    lineage:
      - datalake_ebdb_raw.contaconsumo_aud.endereco_numero
    description: House's number.
  complement:
    lineage:
      - datalake_ebdb_raw.contaconsumo_aud.endereco_complemento
    description: House's complement.
  neighborhood:
    lineage:
      - datalake_ebdb_raw.contaconsumo_aud.endereco_bairro
    description: House's neighborhood.
  city:
    lineage:
      - datalake_ebdb_raw.contaconsumo_aud.endereco_cidade
    description: House's city.
  is_condo_included:
    lineage:
      - datalake_ebdb_raw.contaconsumo_aud.isInclusaCondominio
    description: Boolean flag to check if the consumption is included on condominium.
  is_turned_on:
    lineage:
      - datalake_ebdb_raw.contaconsumo_aud.isligado
    description: Boolean flag to check if the consumption is turned on.
  mod_transfer_register:
    lineage:
      - datalake_ebdb_raw.contaconsumo_aud.transferregister_mod
    description: Boolean column indicating if the transfer_register column was changed.
