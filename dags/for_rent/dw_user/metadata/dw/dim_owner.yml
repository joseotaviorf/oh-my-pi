database_name: dw_public
table_name: dim_owner
description: >
  Dimension table with one row per unique house owner (landlord) in QuintoAndar's rental
  platform, sourced from datalake_ebdb_listing.house. Contains contact details (email, phone)
  used by operations and owner relationship management. Joinable with dim_user via
  sk_owner = sk_user. Partitioned by country_code.
domain: Growth
owner: isadora.gallerani@quintoandar.com.br
columns:
  sk_owner:
    lineage:
      - datalake_ebdb_listing.house.id_user
    description: Primary key of the table, ID user of the house owner. It's the EBDB.Usuario.id. 
      Joins with dim_user.sk_user.
  country_code:
    lineage:
      - datalake_ebdb_listing.house.country_code
    description: Country code of the house owner. It's also a table partition.
  contact_email:
    lineage:
      - datalake_ebdb_listing.house.contact_email
    description: Contact email of the house owner.
  contact_phone_1:
    lineage:
      - datalake_ebdb_listing.house.contact_phone_1
    description: Primary contact phone of the house owner.
  contact_phone_2:
    lineage:
      - datalake_ebdb_listing.house.contact_phone_2
    description: Secondary contact phone of the house owner.
  ts_load:
    description: Timestamp of when this data was loaded.