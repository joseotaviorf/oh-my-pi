database_name: dw_public
table_name: dim_owner
description: Dimension table containing house owner's information. Each row corresponds to a unique house owner.
domain: For Rent
owner: jonas.fiorini@quintoandar.com.br
columns:
  sk_owner:
    lineage:
      - datalake_ebdb_listing.house.id_user
    description: ID user of the house owner.
  country_code:
    lineage:
      - datalake_ebdb_listing.house.country_code
    description: Country code of the house owner. It's also a table partition.
  contact_email:
    lineage:
      - datalake_ebdb_listing.house.contact_email
    description: Contact email of the house owner.
  contact_phone_1:
    lineage:
      - datalake_ebdb_listing.house.contact_phone_1
    description: Primary contact phone of the house owner.
  contact_phone_2:
    lineage:
      - datalake_ebdb_listing.house.contact_phone_2
    description: Secondary contact phone of the house owner.
  ts_load:
    description: Timestamp of when this data was loaded.