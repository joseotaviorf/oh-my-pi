database_name: dw_public
table_name: dim_user_doorman
description: Information about doormen (a subset of all affiliates) registered at QuintoAndar. Each line is a user doorman.
domain: For Rent
owner: 'kleber.inoue@quintoandar.com'
columns:
  sk_user_doorman:
    lineage:
    - datalake_ebdb_user.user_doorman.id
    description: Unique ID of doorman, which is not equal to sk_user. To get sk_user, needs
      to join with dim_user by using sk_user_affiliate key. It's the primary key of this table.
  sk_user_affiliate:
    lineage:
    - datalake_ebdb_user.user_doorman.id_affiliate_data
    description: Key to join table with dim_user_affiliate. (dim_user_doorman.sk_user_affiliate
      = dim_user.dados_afiliado_id).
  id_user_doorman:
    lineage:
    - datalake_ebdb_user.user_doorman.id
    description: Unique ID of doorman, it's the primary key of this table and has the same value of sk_user_doorman.
  occupation_id:
    lineage:
    - datalake_ebdb_user.user_doorman.id_doorman_occupation
    description: Doorman Occupation ID.
  work_place_id:
    lineage:
    - datalake_ebdb_user.user_doorman.id_place
    description: Id of the place where doorman works.
  country_code:
    lineage:
    - datalake_ebdb_user.user_doorman.country_code
    description: Country code of the doorman. It's also a table partition.
    categories:
      BR: Brazil's country code.
      MX: Mexico's country code.
  work_address:
    lineage:
    - datalake_ebdb_user.user_doorman.work_address
    description: Address where doorman works (Free-form entry).
  work_street:
    lineage:
    - datalake_ebdb_user.user_doorman.work_street
    description: Street name where doorman works (Standardized).
  work_house_number:
    lineage:
    - datalake_ebdb_user.user_doorman.work_house_number
    description: Street number where doorman works.
  work_neighbourhood:
    lineage:
    - datalake_ebdb_user.user_doorman.work_neighborhood
    description: Neighborhood where doorman works.
  work_city:
    lineage:
    - datalake_ebdb_user.user_doorman.work_city
    description: City where doorman works.
  work_state:
    lineage:
    - datalake_ebdb_user.user_doorman.work_state
    description: State where doorman works.
  work_lat:
    lineage:
    - datalake_ebdb_user.user_doorman.lat
    description: Latitude of the place where doorman works.
  work_lng:
    lineage:
    - datalake_ebdb_user.user_doorman.lng
    description: Longitude of the place where doorman works.
  recruiter:
    lineage:
    - datalake_ebdb_user.user_doorman.recruiter
    description: Name of the person who recruited doorman.
  subscription_source:
    lineage:
    - datalake_ebdb_user.user_doorman.subscription_source
    description: Defines if doorman was captured offline, organic or captured by call
      center.
  occupation_name:
    lineage:
    - datalake_ebdb_user.user_doorman.occupation_name
    description: Doorman Occupation description.
    categories:
      APARTMENT_MANAGER: The doorman is the manager of the apartment.
      CLEANER: The doorman is the cleaner of the build.
      DOORMAN: The user is the doorman of the build.
      GUARD: The user is the guard of the build.
      JANITOR: The user is the janitor of the build.
      OTHER: Other occupation name.
      PROPERTY_MANAGER: The user is manager of the property.
  is_active:
    lineage:
    - datalake_ebdb_user.user_doorman.is_active
    description: Flag which indicates if user joined doorman program. If ts_joined
      program is not null, then it is true. It does not indicates whether doorman
      is still registered in the affiliates program.
  ts_created:
    lineage:
    - datalake_ebdb_user.user_doorman.ts_created
    description: Timestamp of the moment when doorman user was created.
  ts_updated:
    lineage:
    - datalake_ebdb_user.user_doorman.ts_updated
    description: Timestamp of the moment when doorman user was updated.
  ts_joined_program:
    lineage:
    - datalake_ebdb_user.user_doorman.ts_joined
    description: Timestamp of the moment when the doorman joined the program.
  ts_load:
    description: Timestamp of data load event (UTC timezone).