database_name: dw_public
table_name: dim_user_doorman
description: Information about doormen (a subset of all affiliates) registered at
  QuintoAndar. Each line is a user doorma
domain: For Rent
owner: ''
columns:
  sk_user_doorman:
    lineage:
    - datalake_ebdb_user.user_doorman.id
    description: Key of doorman, which is not equal to sk_user. To get sk_user, needs
      to join with dim_user by using sk_user_affiliate key.
  sk_user_affiliate:
    lineage:
    - datalake_ebdb_user.user_doorman.id_affiliate_data
    description: Key to join table with dim_user_affiliate. (dim_user_doorman.sk_user_affiliate
      = dim_user.dados_afiliado_id)
  id_user_doorman:
    lineage:
    - datalake_ebdb_user.user_doorman.id
    description: Key of doorman
  occupation_id:
    lineage:
    - datalake_ebdb_user.user_doorman.id_doorman_occupation
    description: Doorman Occupation ID
  work_place_id:
    lineage:
    - datalake_ebdb_user.user_doorman.id_place
    description: Id of the place where doorman works
  country_code:
    lineage:
    - datalake_ebdb_user.user_doorman.country_code
    description: Country code of the doorman
    categories:
      BR: Brazil's country code
      MX: Mexico's country code
  work_address:
    lineage:
    - datalake_ebdb_user.user_doorman.work_address
    description: Address where doorman works (Free-form entry)
  work_street:
    lineage:
    - datalake_ebdb_user.user_doorman.work_street
    description: Street name where doorman works (Standardized)
  work_house_number:
    lineage:
    - datalake_ebdb_user.user_doorman.work_house_number
    description: Street number where doorman works
  work_neighbourhood:
    lineage:
