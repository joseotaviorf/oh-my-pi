database_name: dw_quintoandar
table_name: dim_user_sales_rep
description: >
  Dimension table with one row per Inside Sales representative contracted by QuintoAndar's
  partner companies, sourced from datalake_ebdb_user.user_sales_rep. Contains identity,
  contact, and employment data (company, start date, active status) for sales rep users.
  Might contain PII data.
  Used by Growth analytics to track sales rep performance and tenure. Partitioned by country_code.
domain: Growth
owner: isadora.gallerani@quintoandar.com.br
columns:
  sk_user_sales_rep:
    lineage:
    - datalake_ebdb_user.user_sales_rep.id_user_sales_rep
    description: "Unique identifier of the user sales rep from the Main/EBDB database."
  country_code:
    lineage:
      - datalake_ebdb_user.user_sales_rep.country_code
    description: "Country code related to the user. It's also a table partition."
  name:
    lineage:
    - datalake_ebdb_user.user_sales_rep.name
    description: "Full name of the Inside Sales representative as registered in QuintoAndar's system."
  email:
    lineage:
    - datalake_ebdb_user.user_sales_rep.email
    description: "Corporate email address of the sales rep, used for internal identification and communication."
  phone_number:
    lineage:
    - datalake_ebdb_user.user_sales_rep.phone_number
    description: "Contact phone number of the sales rep registered in the system for operational communication."
  admin_type:
    lineage:
    - datalake_ebdb_user.user_sales_rep.admin_type
    description: "Permission level granted to the sales rep user, controlling which internal tools and modules they can access."
    categories:
      Admin: 'Full administrative access to the system.'
      AtendimentoParceiros: 'Access restricted to partner service operations.'
      Normal: 'Standard access level for regular sales rep operations.'
      Sudo: 'Superuser access with elevated permissions across the system.'
  sales_company:
    lineage:
    - datalake_ebdb_user.user_sales_rep.sales_company
    description: "Inside Sales company of the user."
  is_sales_rep_active:
    lineage:
    - datalake_ebdb_user.user_sales_rep.is_sales_rep_active
    description: "Boolean indicating if the sales rep is active in our company."
  dt_sales_rep_started:
    lineage:
    - datalake_ebdb_user.user_sales_rep.dt_sales_rep_started
    description: "Date of then when the sales rep started working with us."
  ts_load:
    description: "Timestamp indicating the load of the data into our system."
