database_name: datalake_kill_queue
table_name: user
description: The table contains the users of Kill Queue micro-service. It receives the
  last update of a record. We're deduplicating the repeated IDs in this table, because
  our raw/clean DAG makes the ingestion via incremental load.
domain: For Rent
owner: gustavo.silva@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_kill_queue_clean.user.id
    description: ID user of Kill Queue micro-service. It's the primary key of this table.
  id_main:
    lineage:
      - datalake_kill_queue_clean.user.id_main
    description: ID user of EBDB (Main) source.
  cell_phone:
    lineage:
      - datalake_kill_queue_clean.user.cell_phone
    description: Cellphone number of the user.
  cpf:
    lineage:
      - datalake_kill_queue_clean.user.cpf
    description: CPF (Individual Taxpayer Registration) of the user.
  email:
    lineage:
      - datalake_kill_queue_clean.user.email
    description: Primary email address registered for the Kill Queue user profile.
  name:
    lineage:
      - datalake_kill_queue_clean.user.name
    description: Full name of the tenant or owner stored in Kill Queue.
  version:
    lineage:
      - datalake_kill_queue_clean.user.version
    description: Optimistic locking revision counter for concurrent update safety.
  ts_created:
    lineage:
      - datalake_kill_queue_clean.user.ts_created
    description: Timestamp when the user was created.
  ts_updated:
    lineage:
      - datalake_kill_queue_clean.user.ts_updated
    description: Timestamp when the user was updated for the last time.
  year:
    lineage:
      - datalake_kill_queue_clean.user.year
    description: Year value of the update timestamp. It's not a partition!
  month:
    lineage:
      - datalake_kill_queue_clean.user.month
    description: Month value of the update timestamp. It's not a partition!
  day:
    lineage:
      - datalake_kill_queue_clean.user.day
    description: Day value of the update timestamp. It's not a partition!
