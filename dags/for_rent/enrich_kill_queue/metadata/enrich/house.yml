database_name: datalake_kill_queue
table_name: house
description: The table contains the houses of Kill Queue micro-service. It receives the
  last update of a record. We're deduplicating the repeated IDs in this table, because
  our raw/clean DAG makes the ingestion via incremental load.
domain: For Rent
owner: gustavo.silva@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_kill_queue_clean.house.id
    description: ID of the house from Kill Queue micro-service. It's the primary key of this table.
  id_main:
    lineage:
      - datalake_kill_queue_clean.house.id_main
    description: "EBDB main database house id for cross-system joins."
  id_owner:
    lineage:
      - datalake_kill_queue_clean.house.id_owner
    description: ID user of the owner. It can be joined with user table through the id_main field.
  id_region:
    lineage:
      - datalake_kill_queue_clean.house.id_region
    description: Region id where the Kill Queue property is located.
  city:
    lineage:
      - datalake_kill_queue_clean.house.city
    description: City component of the property address in Kill Queue.
  complement:
    lineage:
      - datalake_kill_queue_clean.house.complement
    description: Address complement such as apartment or block identifier.
  house_number:
    lineage:
      - datalake_kill_queue_clean.house.house_number
    description: Street number component of the property address in Kill Queue.
  street_address:
    lineage:
      - datalake_kill_queue_clean.house.street_address
    description: Street name of the property address registered in Kill Queue.
  state:
    lineage:
      - datalake_kill_queue_clean.house.state
    description: Brazilian state abbreviation for the property address.
  version:
    lineage:
      - datalake_kill_queue_clean.house.version
    description: "Optimistic-lock version of the Kill Queue house record."
  floor:
    lineage:
      - datalake_kill_queue_clean.house.floor
    description: Floor or level number of the unit within the building.
  rent_price:
    lineage:
      - datalake_kill_queue_clean.house.rent_price
    description: Listed monthly rent price for the property in Kill Queue.
  reservation_fee:
    lineage:
      - datalake_kill_queue_clean.house.reservation_fee
    description: Reservation fee percentage charged to secure the listing.
  is_reservation_allowed:
    lineage:
      - datalake_kill_queue_clean.house.is_reservation_allowed
    description: Boolean indicating whether the reservation is allowed for the house.
  ts_created:
    lineage:
      - datalake_kill_queue_clean.house.ts_created
    description: Timestamp when the Kill Queue house record was first created.
  ts_updated:
    lineage:
      - datalake_kill_queue_clean.house.ts_updated
    description: Timestamp of the latest update received from Kill Queue.
  year:
    lineage:
      - datalake_kill_queue_clean.house.year
    description: Calendar year extracted from ts_updated; not a table partition column.
  month:
    lineage:
      - datalake_kill_queue_clean.house.month
    description: Calendar month extracted from ts_updated; not a table partition column.
  day:
    lineage:
      - datalake_kill_queue_clean.house.day
    description: Calendar day extracted from ts_updated; not a table partition column.
