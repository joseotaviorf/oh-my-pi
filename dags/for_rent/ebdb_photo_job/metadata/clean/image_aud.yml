---
database_name: datalake_ebdb_clean
table_name: image_aud
description: Table with auditory data from house images.
domain: For Rent
owner: gustavo.brunelli@quintoandar.com.br
columns:
  id_image:
    lineage:
      - datalake_ebdb_raw.imagem_aud.id
    description: Identifier of the house image row being audited.
  id_house:
    lineage:
      - datalake_ebdb_raw.imagem_aud.imovel_id
    description: Listing (house) the audited image belongs to.
  rev:
    lineage:
      - datalake_ebdb_raw.imagem_aud.rev
    description: Revision's id. Can be joined with datalake_ebdb_clean.user_revision_entity.id.
  rev_type:
    lineage:
      - datalake_ebdb_raw.imagem_aud.revtype
    description: Envers operation type for this revision (insert, update, or delete).
  subtitle:
    lineage:
      - datalake_ebdb_raw.imagem_aud.legenda
    description: Caption text shown with the image at the time of this revision.
  name:
    lineage:
      - datalake_ebdb_raw.imagem_aud.nome
    description: Image filename at the time of this audit revision.
  image_order:
    lineage:
      - datalake_ebdb_raw.imagem_aud.ordem
    description: Position of this image on the sequence of images related to this house.
  is_main:
    lineage:
      - datalake_ebdb_raw.imagem_aud.principal
    description: Boolean indicating if this is the main image of this house.
  mod_image_variants:
    lineage:
      - datalake_ebdb_raw.imagem_aud.imageVariants_MOD
    description: Boolean indicating if this row correspond to some house variants modification.
