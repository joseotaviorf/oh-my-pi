database_name: dw_public
table_name: dim_offer
description: Tenants make offers to owners when they want to rent the properties.
  If an offer is accepted, it becomes a proposal (see dim_proposal table). Each line
  is an offer
domain: For Rent
owner: matheus.baroni@quintoandar.com.br
columns:
  sk_offer:
    lineage:
    - dw_rent.dim_offer.sk_offer
    description: Key of offer (id_offer)
  id_offer:
    lineage:
    - dw_rent.dim_offer.id_offer
    description: ID of offer on ebdb
  id_godfather:
    lineage:
    - dw_rent.dim_offer.id_godfather
    description: ID of godfather database
  id_firestore:
    lineage:
    - dw_rent.dim_offer.id_firestore
    description: Last value on negotiation
  id_user:
    lineage:
    - dw_rent.dim_offer.id_user
    description: ID of tentant
  id_property:
    lineage:
    - dw_rent.dim_offer.id_property
    description: ID of house
  country_code:
    lineage:
    - dw_rent.dim_offer.country_code
    description: Country code related to the offer's country of origin
    categories:
      BR: Brazil's country code
      MX: Mexico's country code
  editing:
    lineage:
    - dw_rent.dim_offer.editing
    description: Who's turn of editing the offer
    categories:
      EdicaoInquilino: Waiting the tenant's turn to make an edit to the offer
      EdicaoProprietario: Waiting the owner's turn to make an edit to the offer
      Finalizado: Edits are finalized
      Owner: Waiting the owner's turn to make an edit to the offer
      Tenant: Waiting the tenant's turn to make an edit to the offer
  status:
    lineage:
    - dw_rent.dim_offer.status
    description: Offer status
    categories:
      Aprovada: Offer approved by the owner
      EmNegociacao: Offer still in negotiation
      Rejeitada: Offer rejected by the owner
  rejection_reason:
    lineage:
    - dw_rent.dim_offer.rejection_reason
    description: Reason which offer was rejected
    categories:
      HouseReserved: The house was reserved by another tenant, dropping all other
        offers for the same house
      NDA: 'NDA'
      OwnerCustomReason: Owner custom reason
      OwnerDoesntAcceptPets: The owner does not accept pets
      OwnerDoesntAgreeNumberOfResidents: Owner does not agree with the number of residents
      OwnerDoesntAgreeWithConditions: Owner does not agree with conditions
      OwnerDoesntAgreeWithValue: Owner does not agree with value (price)
      OwnerGaveUpRenting: Owner gave up renting
      OwnerHasOtherOngoingFlows: Owner has other ongoing flows
      OwnerMissedLimitReached: Limit for owner missed was reached
      OwnerRejected: Owner rejected
      OwnerRentedForAnotherTenant5A: The owner ended up renting for another QuintoAndar
        tenant
      OwnerRentedForAnotherTenantOutside: The owner ended up renting for another tenant
        outside of QuintoAndar
      OwnerSoldHouse: The owner sold the house
      OwnerStalled: Owner stalled
      PropertyRented5A: House was already rented in QuintoAndar
      StartOffer: Start offer
      TenantDoesntAgreeWithConditions: Tenant does not agree with conditions
      TenantDoesntAgreeWithValue: Tenant does not agree with value (price)
      TenantGaveUpApartment: Tenant gave up apartment
      TenantGaveUpRenting: Tenant gave up renting
      TenantRejected: Tenant was rejected
      TenantRented5A: '-'
      TenantRentedAnother5A: Tenant rented another house in QuintoAndar
      TenantRentedAnotherOutside: Tenant rented outside of QuintoAndar
      TenantStalled: Tenant stalled
      UnpublishedHouse: Unpublished house
  type:
    lineage:
    - dw_rent.dim_offer.type
    description: type of offer that was made
    categories:
      Custom: 'When the tenant asks the owner to make changes to the property of any
        type (example: painting, removing furniture, doing renovations, etc.)'
      Express: When the tenant accepts the price and all conditions asked by the owner
        and makes no other requests
      Other: Other
      Price: When the tenant accepts all the conditions asked by the owner but wants
        to negotiate the rental price
  app_type:
    lineage:
    - dw_rent.dim_offer.app_type
    description: Amplitude's app type
    categories:
      amp: amp
      android: android
      android_flutter: android (flutter)
      ios: ios
      web_desktop: web (desktop)
      web_mobile: web (mobile)
  app_version_name: 
    lineage:
      - dw_rent.dim_offer.app_version_name
    description: Version name of the app associated with the offer's event on Amplitude.
  utm_source:
    lineage:
    - dw_rent.dim_offer.utm_source
    description: UTM used to track the advertising source
  utm_medium:
    lineage:
    - dw_rent.dim_offer.utm_medium
    description: UTM used to track the advertising medium
  utm_campaign:
    lineage:
    - dw_rent.dim_offer.utm_campaign
    description: UTM used to identify the campaign in the media
  utm_content:
    lineage:
    - dw_rent.dim_offer.utm_content
    description: Identifies what specifically was clicked to bring the user to the
      site, such as a banner ad or a text link. It is often used for A/B testing and
      content-targeted ads
  utm_term:
    lineage:
    - dw_rent.dim_offer.utm_term
    description: Identifies search terms that brought the lead
  final_attribution_origin:
    lineage:
    - dw_rent.dim_offer.final_attribution_origin
    description: Final attribution origin
    categories:
      CX: CX
      Secretaria: Secretaria
      Web: Web
      old_attribution: Old attribution (not mapped)
  mkt_category:
    lineage:
    - dw_rent.dim_offer.mkt_category
    description: standard category from the booking
  mkt_flow:
    lineage:
    - dw_rent.dim_offer.mkt_flow
    description: Type of flow in the marketing funnel by the lead
  mkt_completion:
    lineage:
    - dw_rent.dim_offer.mkt_completion
    description: Type of completion of marketing funnel by the lead
  mkt_origin:
    lineage:
    - dw_rent.dim_offer.mkt_origin
    description: Origin of the lead in the marketing funnel
  mkt_channel:
    lineage:
    - dw_rent.dim_offer.mkt_channel
    description: Channel level of the Taxonomy (used to describe the type of the channel)
  mkt_medium:
    lineage:
    - dw_rent.dim_offer.mkt_medium
    description: Medium level of the taxonomy (used to describe the midia strategy)
  mkt_source:
    lineage:
    - dw_rent.dim_offer.mkt_source
    description: Source level of the taxonomy (used to describe the midia used)
  mkt_platform:
    lineage:
    - dw_rent.dim_offer.mkt_platform
    description: Platform use by the lead in the marketing funnel
  last_offered_rent:
    lineage:
    - dw_rent.dim_offer.last_offered_rent
    description: Last value on negotiation
  original_rent:
    lineage:
    - dw_rent.dim_offer.original_rent
    description: Rent value set on listing
  original_condo:
    lineage:
    - dw_rent.dim_offer.original_condo
    description: Condo value set on listing
  is_instant_offer:
    lineage:
    - dw_rent.dim_offer.is_instant_offer
    description: Flag Is_Instat_Offer. Instant Offers are offers that are automatically
      accepted, demanding no action by the owner (according to some specific the criteria)
  first_rent_offered_by_tenant:
    lineage:
    - dw_rent.dim_offer.first_rent_offered_by_tenant
    description: First value offer by tenant
  first_rent_offered_by_owner:
    lineage:
    - dw_rent.dim_offer.first_rent_offered_by_owner
    description: First value offer by owner
  last_rent_offered_by_tenant:
    lineage:
    - dw_rent.dim_offer.last_rent_offered_by_tenant
    description: Last value offer by tentant
  last_rent_offered_by_owner:
    lineage:
    - dw_rent.dim_offer.last_rent_offered_by_owner
    description: Last value offer by owner
  number_of_tenants:
    lineage:
    - dw_rent.dim_offer.number_of_tenants
    description: Number of tenants in the offer
  number_of_kids:
    lineage:
    - dw_rent.dim_offer.number_of_kids
    description: Number of kids
  rental_reason:
    lineage:
    - dw_rent.dim_offer.rental_reason
    description: Rental reason
    categories:
      LeavingHome: Leaving home
      Job: Job relocation
      IncreasingFamily: Increasing family
      Independency: Independency
      FamilyOrFriendsProximity: Proximity to family or friends
      Other: Other
  rental_urgency:
    lineage:
    - dw_rent.dim_offer.rental_urgency
    description: Rental urgency
    categories:
      NotHurry: Not in a hurry
      AsSoonAsPossible: As soon as possible
      NextThreeMonths: In the next three months
      NextMonth: In the next month
  tenant_description:
    lineage:
    - dw_rent.dim_offer.tenant_description
    description: Offer's description
  tenant_pets_info:
    lineage:
    - dw_rent.dim_offer.tenant_pets_info
    description: Description of tenent's pets
  tenant_type:
    lineage:
    - dw_rent.dim_offer.tenant_type
    description: Tenant type (Friends, Family or Alone)
    categories:
      Friends: 'Friends'
      Family: 'Family'
      Alone: 'Alone'
  has_pets:
    lineage:
    - dw_rent.dim_offer.has_pets
    description: True if tenant has pets
  ts_email_sent_to_owner:
    lineage:
    - dw_rent.dim_offer.ts_email_sent_to_owner
    description: Timestamp when the email about the offer was sent to the owner
  last_updated_date:
    lineage:
    - dw_rent.dim_offer.last_updated_date
    description: Date of last update on offer
  expiration_date:
    lineage:
    - dw_rent.dim_offer.expiration_date
    description: Date of offer expiration
  dt_analysis:
    lineage:
    - dw_rent.dim_offer.dt_analysis
    description: Date of owner decision regarding offer, rejecting or approving
  dt_first_sent:
    lineage:
    - dw_rent.dim_offer.dt_first_sent
    description: Date of offer sent
  dt_created:
    lineage:
    - dw_rent.dim_offer.dt_created
    description: Date of pre-offer creation
  dt_updated:
    lineage:
    - dw_rent.dim_offer.dt_updated
    description: Date of offer last update
  dt_timestamp:
    lineage:
      - dw_rent.dim_offer.dt_timestamp
    description: Date when record was update
  flg_branded:
    lineage:
      - dw_rent.dim_offer.flg_branded
    description: If this booking came from a branded campaign as defined by the lead
      taxonomy
  offer_submitted:
    lineage:
      - dw_rent.dim_offer.offer_submitted
    description: True for offer submitted
