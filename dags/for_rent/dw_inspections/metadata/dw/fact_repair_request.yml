---
database_name: dw_inspections
table_name: fact_repair_request
description: |
  This table provides indicators of the current status of the repair request, such as:
  whether the repair was contested, who will absorb the costs involved, whether there
  is related media, etc.
domain: For Rent
owner: gustavo.silva@quintoandar.com.br
columns:
  sk_repair_request:
    lineage:
      - datalake_inspections.repair_request.id_repair_request
    description: Repair Request unique identifier (number)
  sk_contestation:
    lineage:
      - datalake_inspections.repair_request.id_contestation
    description: Identification key of the contestation related to the repair request.
  sk_item_group:
    lineage:
      - datalake_inspections.repair_request.id_item_group
    description: Item Group unique identifier.
  sk_room:
    lineage:
      - datalake_inspections.repair_request.id_room
    description: Room unique identifier captured in the source operational system.
  sk_assessment:
    lineage:
      - datalake_inspections.repair_request.id_assessment
    description: Unique identifier of an Assessment.
  sk_inspection:
    lineage:
      - datalake_inspections.repair_request.id_inspection
    description: Inspection unique identifier.
  sk_contract:
    lineage:
      - datalake_inspections.repair_request.id_contract
    description: Contract identification key associated with the inspection this repair request belongs to.
  sk_requester:
    lineage:
      - datalake_inspections.repair_request.id_requester
    description: Author of repair request
  sk_granted_by:
    lineage:
      - datalake_inspections.repair_request.id_granted_by
    description: Reviewer who assessed whether a repair was exempted. Being an owner or member of AN1
  sk_contestation_requester:
    lineage:
      - datalake_inspections.repair_request.id_contestation_requester
    description: Identification key of the user who made the contestation.
  total_tenant_contestation:
    lineage:
      - datalake_inspections.repair_request.total_tenant_contestation
    description: Numerical information indicating the total number of objections made by the tenant during the review.
  total_tenant_budget_approval_contestation:
    lineage:
      - datalake_inspections.repair_request.total_tenant_budget_approval_contestation
    description: Numerical information indicating the total number of objections made by the tenant during the budget approval step.
  total_owner_budget_approval_contestation:
    lineage:
      - datalake_inspections.repair_request.total_owner_budget_approval_contestation
    description: Numerical information indicating the total number of objections made by the owner during the budget approval step.
  has_media:
    lineage:
      - datalake_inspections.report_review_media.id_media
    description: Indicates whether media was generated for the repair request
  has_tenant_contestation:
    lineage:
      - datalake_inspections.repair_request.total_tenant_contestation
    description: Indicates that there are objections from the tenant to the repair request during the review.
  has_tenant_budget_approval_contestation:
    lineage:
      - datalake_inspections.repair_request.total_tenant_budget_approval_contestation
    description: Boolean information indicating whether the tenant contested the repair in question at the budget approval stage.
  has_owner_budget_approval_contestation:
    lineage:
      - datalake_inspections.repair_request.total_owner_budget_approval_contestation
    description: Boolean information indicating whether the owner contested the repair in question at the budget approval stage.
  is_cost_absorbed_by_company:
    lineage:
      - datalake_inspections.repair_request.is_cost_absorbed_by_company
    description: The cost of the repair will be absorbed by the 5A
  is_cost_absorbed_by_tenant:
    lineage:
      - datalake_inspections.repair_request.is_cost_absorbed_by_tenant
    description: Indicates whether the tenant bears the repair cost, derived as true when the repair responsibility is TENANT and the request was not exempted.
  is_cost_absorbed_by_owner:
    lineage:
      - datalake_inspections.repair_request.is_cost_absorbed_by_owner
    description: Indicates whether the property owner bears the repair cost, derived as true when the repair responsibility is OWNER or the request was exempted.
  is_exempted:
    lineage:
      - datalake_inspections.repair_request.is_exempted
    description: Indicates whether the repair suggested by the AN1 team was exempted by the owner or a analyst
  is_exempted_by_owner_from_budget:
    lineage:
      - datalake_inspections.repair_request.is_exempted_by_owner_from_budget
    description: Indicates whether the repair was exempted by the owner at the budget approval stage.
  is_exempted_by_owner:
    lineage:
      - datalake_inspections.repair_request.is_exempted_by_owner
    description: Indicates whether the repair was exempted by the property owner, true when the granting reviewer type is OWNER and the request is flagged as exempted.
  is_requested_by_owner:
    lineage:
      - datalake_inspections.repair_request.is_requested_by_owner
    description: Indicates whether the repair request was opened by the property owner, true when the requesting reviewer type is OWNER.
  is_finished:
    lineage:
      - datalake_inspections.repair_request.is_finished
    description: Indicates whether the repair request was reviewed and finalized by an admin during the contestation analysis (AC) stage. In the source system it is set to true only when an admin updates the repair while the inspection is in contestation analysis; repairs that never reach that stage stay false. Despite the name, it does not mean the physical repair was completed.
  has_automatically_identified:
    lineage:
      - datalake_inspections.repair_request.has_automatically_identified
    description: "Boolean indicating whether this repair request was automatically drafted from inspector tags (tag-based flow). This flow predates Kirk and is unrelated to Kirk's AI-based repair report creation and to repair pricing automation."
  has_automatic_identification_accepted:
    lineage:
      - datalake_inspections.repair_request.has_automatic_identification_accepted
    description: "Boolean indicating whether the automatically drafted repair request (from the tag-based flow) was accepted. This flow predates Kirk and is unrelated to Kirk's AI-based repair report creation and to repair pricing automation."
  ts_granted:
    lineage:
      - datalake_inspections.repair_request.ts_granted
    description: Indicates the time at which the repair request exempted assessment was made
  ts_created:
    lineage:
      - datalake_inspections.repair_request.ts_created
    description: Record creation date captured in the source operational system.
  ts_updated:
    lineage:
      - datalake_inspections.repair_request.ts_updated
    description: Record update date captured in the source operational system.
  ts_load:
    description: Date and time when the data was loaded.
  year:
    lineage:
      - datalake_inspections.repair_request.year
    description: Year of update date captured in the source operational system.
  month:
    lineage:
      - datalake_inspections.repair_request.month
    description: Month of update date captured in the source operational system.
  day:
    lineage:
      - datalake_inspections.repair_request.day
    description: Day of update date captured in the source operational system.
