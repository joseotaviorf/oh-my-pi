---
database_name: dw_inspections
table_name: dim_reviewer
description: Data referring to the reviewers of the inspection report.
  Each row is a unique item, identified by the sk_reviewer column.
domain: For Rent
owner: gustavo.silva@quintoandar.com.br
columns:
  sk_reviewer:
    description: Review unique identifier (number)
    lineage:
      - datalake_inspections.reviewer.id_reviewer
  sk_user:
    description: ID of the user who performed the review
    lineage:
      - datalake_inspections.reviewer.id_user
  reviewer_type:
    lineage:
      - datalake_inspections.reviewer.reviewer_type
    description: The types of reviewers captured in the source operational system.
    categories:
      OWNER: Owner of the property.
      TENANT: Tenant of the property.
      ADMIN: Team of Repair Analysis.
  ts_created:
    description: This date refers to the creation of the reviewer.
    lineage:
      - datalake_inspections.reviewer.ts_created
  ts_updated:
    description: Timestamp of the most recent update to the reviewer record in the source system.
    lineage:
      - datalake_inspections.reviewer.ts_updated
  ts_load:
    description: Date and time when the data was loaded.
  year:
    description: Year of update date captured in the source operational system.
    lineage:
      - datalake_inspections.reviewer.ts_updated
  month:
    description: Month of update date captured in the source operational system.
    lineage:
      - datalake_inspections.reviewer.ts_updated
  day:
    description: Day of update date captured in the source operational system.
    lineage:
      - datalake_inspections.reviewer.ts_updated
