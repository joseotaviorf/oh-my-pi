---
database_name: dw_inspections
table_name: dim_repair_request
description: Dimension describing each repair request at its most recent state (one row per repair request, deduplicated by ts_updated), including type, cost, responsibility, service, and the item/room it refers to.
domain: For Rent
owner: gustavo.silva@quintoandar.com.br
columns:
  id_repair_request:
    lineage:
      - datalake_inspections.repair_request.id_repair_request
    description: Repair Request unique identifier (number)
  type:
    lineage:
      - datalake_inspections.repair_request.type
    description: >
      Cause or nature of the item identified on the inspection report. It is not a
      closed enum of process actions (repair, clean, take away, give back, other),
      and values are written with underscores. The column is open-ended, holding
      dozens of distinct values. The ten most frequent on
      dw_inspections.dim_repair_request are PREEXISTING, OTHER, REPAIR,
      MALFUNCTIONING, LACK_OF_MAINTENANCE, DIRT, STRUCTURAL_DAMAGE, ABSENT_ITEM,
      MILD_DAMAGE and STRUCTURAL_MOISTURE. Query the column for the full current
      list before relying on any fixed set of values.
  cost:
    lineage:
      - datalake_inspections.repair_request.cost
    description: Most recent repair cost in BRL for the repair request.
  repair_type:
    lineage:
      - datalake_inspections.repair_request.type
    description: >
      Mirror of type (same source column). No diverging rows versus type in the full
      history of dw_inspections.dim_repair_request. Use type as the canonical field
      in new queries. Physical deprecation is an engineering follow-up and is not
      part of this documentation change.
  comment:
    lineage:
      - datalake_inspections.repair_request.comment
    description: Commentary detailing the repair needed
  responsibility:
    lineage:
      - datalake_inspections.repair_request.responsibility
    description: Descriptive information indicating who is responsible for the repair request.
  repair_service:
    lineage:
      - datalake_inspections.repair_request.repair_service
    description: >
      Repair service requested. Values are not normalized at source: leading/trailing
      spaces, capitalization variants, and numbered suffixes are common. Distinct counts
      without TRIM(UPPER(...)) overestimate real cardinality. Source-side or DW-side
      normalization is an engineering follow-up, not covered here.
  item_name:
    lineage:
      - datalake_inspections.repair_request.item_name
    description: >
      Name of the item to be repaired. Values are not normalized at source:
      leading/trailing spaces, capitalization variants, and numbered suffixes are common
      (for example Armários, Armário, Armários 2, Armario). Distinct counts without
      TRIM(UPPER(...)) overestimate real cardinality. Source-side or DW-side
      normalization is an engineering follow-up, not covered here.
  room_name:
    lineage:
      - datalake_inspections.repair_request.room_name
    description: Room name where the item is located
  ts_created:
    lineage:
      - datalake_inspections.repair_request.ts_created
    description: Creation date captured in the source operational system.
  ts_updated:
    lineage:
      - datalake_inspections.repair_request.ts_updated
    description: Updated date in timestamp format
  ts_load:
    description: Date and time when the data was loaded.
  year:
    lineage:
      - datalake_inspections.repair_request.year
    description: Year of update date captured in the source operational system.
  month:
    lineage:
      - datalake_inspections.repair_request.month
    description: Month of update date captured in the source operational system.
  day:
    lineage:
      - datalake_inspections.repair_request.day
    description: Day of update date captured in the source operational system.
