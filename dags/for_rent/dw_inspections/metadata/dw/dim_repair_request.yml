---
database_name: dw_inspections
table_name: dim_repair_request
description: Dimension describing each repair request at its most recent state (one row per repair request, deduplicated by ts_updated), including type, cost, responsibility, service, and the item/room it refers to.
domain: For Rent
owner: gustavo.silva@quintoandar.com.br
columns:
  id_repair_request:
    lineage:
      - datalake_inspections.repair_request.id_repair_request
    description: Repair Request unique identifier (number)
  type:
    lineage:
      - datalake_inspections.repair_request.type
    description: "Type of action requested in the repair request, indicating whether the item should be repaired, cleaned, removed, replaced, or another action (see categories)."
    categories:
      REPAIR: Make item repair.
      CLEAN: Clean the item.
      TAKE AWAY: Remove item left in the property.
      GIVE BACK: Replace item that was in the property.
      OTHER: Other types not listed.
  cost:
    lineage:
      - datalake_inspections.repair_request.cost
    description: Most recent repair cost in BRL for the repair request.
  repair_type:
    lineage:
      - datalake_inspections.repair_request.type
    description: Type of repair requested.
  comment:
    lineage:
      - datalake_inspections.repair_request.comment
    description: Commentary detailing the repair needed
  responsibility:
    lineage:
      - datalake_inspections.repair_request.responsibility
    description: Descriptive information indicating who is responsible for the repair request.
  repair_service:
    lineage:
      - datalake_inspections.repair_request.repair_service
    description: Repair service requested
  item_name:
    lineage:
      - datalake_inspections.repair_request.item_name
    description: Name of the item to be repaired
  room_name:
    lineage:
      - datalake_inspections.repair_request.room_name
    description: Room name where the item is located
  ts_created:
    lineage:
      - datalake_inspections.repair_request.ts_created
    description: Creation date captured in the source operational system.
  ts_updated:
    lineage:
      - datalake_inspections.repair_request.ts_updated
    description: Updated date in timestamp format
  ts_load:
    description: Date and time when the data was loaded.
  year:
    lineage:
      - datalake_inspections.repair_request.year
    description: Year of update date captured in the source operational system.
  month:
    lineage:
      - datalake_inspections.repair_request.month
    description: Month of update date captured in the source operational system.
  day:
    lineage:
      - datalake_inspections.repair_request.day
    description: Day of update date captured in the source operational system.
