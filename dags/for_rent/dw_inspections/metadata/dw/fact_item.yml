---
database_name: dw_inspections
table_name: fact_item
description: |
  This fact table relates room, item and item_group dimension data with the most granular information possible,
  so that it is possible to analyze and correlate volumetric indicators, property conditions and even inspection quality.
  Each row is a unique item, identified by the sk_item column.
  It carries surrogate keys and inspection-quality flags only: it does not expose item_type,
  item_group_type or the inspector's answer, so it cannot tell which checklist question a row
  represents or what was answered. Analyses that need the question or the answer — for example
  house_supply (abastecimento) water/gas/electricity utilities-on rates — must use
  datalake_inspections.item plus datalake_inspections.item_issue, or the equivalent
  datalake_inspection_services_clean item graph.
domain: For Rent
owner: gustavo.silva@quintoandar.com.br
columns:
  sk_item:
    description: Item unique identifier captured in the source operational system.
    lineage:
      - datalake_inspections.item.id_item
  sk_previous_item:
    description: "If there is a previous evaluation for the item in the same contract, it will be indicated in this column. It is usually completed in offboarding inspections, bringing information from the onboarding or dispute inspection."
    lineage:
      - datalake_inspections.item.id_previous_item
  sk_external_item:
    description: Item correlational unique identifier in the PWA database.
    lineage:
      - datalake_inspections.item.id_external_item
  sk_item_group:
    description: Item Group unique identifier.
    lineage:
      - datalake_inspections.item.id_item_group
  sk_room:
    description: Room unique identifier captured in the source operational system.
    lineage:
      - datalake_inspections.item.id_room
  sk_assessment:
    description: Unique identifier of an Assessment. This identifier must be unique per inspection, however, for dates prior to August 19, 2023, there is residual data in a product bug. This bug erroneously created more than one Assessment per survey. Therefore, for these cases, the sk_inspection will not be unique. It is observed that the extra Assessments are identical, with no data distinction between them.
    lineage:
      - datalake_inspections.item.id_assessment
  sk_inspection:
    description: Inspection unique identifier.
    lineage:
      - datalake_inspections.item.id_inspection
  has_inspector_comment:
    description: Indicates whether the inspector made any comments about this item.
  is_present:
    description: Indicates if the issue checklist item was checked by the inspector.
    lineage:
      - datalake_inspections.item.is_present
  is_active:
    description: Indicates if the object is active.
    lineage:
      - datalake_inspections.item.is_active
  ts_created:
    description: Creation date and time captured in the source operational system.
    lineage:
      - datalake_inspections.item.ts_created
  ts_updated:
    description: Update date and time captured in the source operational system.
    lineage:
      - datalake_inspections.item.ts_updated
  ts_load:
    description: Date and time when the data was loaded.
  year:
    description: Year referring to date of update.
    lineage:
      - datalake_inspections.item.year
  month:
    description: Month referring to date of update.
    lineage:
      - datalake_inspections.item.month
  day:
    description: Day referring to date of update.
    lineage:
      - datalake_inspections.item.day
