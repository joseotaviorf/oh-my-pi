---
database_name: dw_inspections
table_name: fact_contestation
description: Dw layer table for fact contestation from the dw_inspections pipeline used in For Rent analytics.
domain: For Rent
owner: gustavo.silva@quintoandar.com.br
columns:
  sk_contestation:
    lineage:
      - datalake_inspection_services_clean.contestation.id_contestation
    description: Auto-incrementing internal ID
  sk_repair_request:
    lineage:
      - datalake_inspection_services_clean.contestation.id_repair_request
    description: ID of the repair the contestation is referring to
  sk_reviewer:
    lineage:
      - datalake_inspection_services_clean.contestation.id_reviewer
    description: Creator of the contestation
  cost:
    lineage:
      - datalake_inspection_services_clean.contestation.cost
    description: Indicates the contestation amount.
  has_media:
    lineage:
      - datalake_inspection_services_clean.contestation.has_media
    description: Indicates whether media was generated for the contestation
  is_contested_by_tenant:
    description: Indicates that the contestation was made by the tenant
  is_contested_by_owner:
    description: Indicates that the contestation was made by the owner
  is_tenant_budget_approval_contestation:
    description: Indicates whether it is a dispute at the budget approval stage made by the tenant.
  is_owner_budget_approval_contestation:
    description: Indicates whether it is a dispute at the budget approval stage made by the owner.
  ts_created:
    lineage:
      - datalake_inspection_services_clean.contestation.ts_created
    description: Record creation date captured in the source operational system.
  ts_updated:
    lineage:
      - datalake_inspection_services_clean.contestation.ts_updated
    description: Record update date captured in the source operational system.
  ts_load:
    description: Date and time when the data was loaded.
  year:
    lineage:
      - datalake_inspection_services_clean.contestation.year
    description: Year of update date captured in the source operational system.
  month:
    lineage:
      - datalake_inspection_services_clean.contestation.month
    description: Month of update date captured in the source operational system.
  day:
    lineage:
      - datalake_inspection_services_clean.contestation.day
    description: Day of update date captured in the source operational system.
