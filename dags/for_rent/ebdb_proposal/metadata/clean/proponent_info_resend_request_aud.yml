---
database_name: datalake_ebdb_clean
table_name: proponent_info_resend_request_aud
description: Hibernate Envers audit history of proponent info resend requests. Each row is one revision with modification flags on resend fields.
domain: For Rent
owner: gustavo.brunelli@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_ebdb_raw.proponentinforesendrequest_aud.id
    description: Surrogate key of the record on EBDB.
  id_proponent_proposal:
    lineage:
      - datalake_ebdb_raw.proponentinforesendrequest_aud.proposalProponentId
    description: Foreign key to the related proponent proposal entity.
  id_proposal_document:
    lineage:
      - datalake_ebdb_raw.proponentinforesendrequest_aud.proposalDocumentId
    description: Foreign key to the related proposal document entity.
  rev:
    lineage:
      - datalake_ebdb_raw.proponentinforesendrequest_aud.REV
    description: Envers revision number; join to user_revision_entity for change context.
  rev_type:
    lineage:
      - datalake_ebdb_raw.proponentinforesendrequest_aud.REVTYPE
    description: Envers operation type for this revision (insert, update, or delete).
  proponent_info_type:
    lineage:
      - datalake_ebdb_raw.proponentinforesendrequest_aud.proponentInfoType
    description: Category of proponent information requested for resend.
  resend_document_reason:
    lineage:
      - datalake_ebdb_raw.proponentinforesendrequest_aud.resendDocumentReason
    description: Reason why the proponent documentation must be resent at this revision.
  description:
    lineage:
      - datalake_ebdb_raw.proponentinforesendrequest_aud.description
    description: Free-text description or explanation for this record.
  mod_proponent_info_type:
    lineage:
      - datalake_ebdb_raw.proponentinforesendrequest_aud.proponentInfoType_MOD
    description: Flag indicating whether the proponent info type field changed in this revision.
  mod_resend_document_reason:
    lineage:
      - datalake_ebdb_raw.proponentinforesendrequest_aud.resendDocumentReason_MOD
    description: Flag indicating whether the resend document reason field changed in this revision.
