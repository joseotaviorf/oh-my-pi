---
database_name: datalake_ebdb_clean
table_name: pre_proposal_aud
description: Hibernate Envers audit history of pre-proposals from EBDB PreProposta_AUD. Each row is one revision with modification flags. Used for FR Transact proposal funnel change tracking.
domain: For Rent
owner: gustavo.brunelli@quintoandar.com.br
columns:
  id_pre_proposal:
    lineage:
      - datalake_ebdb_raw.preproposta_aud.id
    description: Foreign key to the related pre proposal entity.
  rev:
    lineage:
      - datalake_ebdb_raw.preproposta_aud.rev
    description: Envers revision number; join to user_revision_entity for change context.
  rev_type:
    lineage:
      - datalake_ebdb_raw.preproposta_aud.revtype
    description: Envers operation type for this revision (insert, update, or delete).
  has_rental_accepted:
    lineage:
      - datalake_ebdb_raw.preproposta_aud.aceitoaluguel
    description: Boolean flag indicating whether rental accepted applies.
  mod_has_rental_accepted:
    lineage:
      - datalake_ebdb_raw.preproposta_aud.aceitoaluguel_mod
    description: Flag indicating whether the has rental accepted field changed in this revision.
  has_income_proof_accepted:
    lineage:
      - datalake_ebdb_raw.preproposta_aud.aceitocomprovarrenda
    description: Boolean flag indicating whether income proof accepted applies.
  mod_has_income_proof_accepted:
