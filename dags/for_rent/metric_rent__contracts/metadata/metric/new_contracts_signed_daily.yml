---
database_name: metric_rent
table_name: new_contracts_signed_daily
description: |
  Table to count new signed contracts, which are contracts actived or finalized,
  on daily basis. The date reference here is related to contract signature or start.
domain: For Rent
owner: gustavo.brunelli@quintoandar.com.br
columns:
  day:
    lineage:
      - dw_rent.dim_contract.dt_start
      - dw_rent.dim_contract.ts_signature
    description: Day when the contract started or was signed.
    dimension: True
  country_code:
    lineage:
      - dw_rent.dim_contract.country_code
    description: ISO country code for geographic filtering of the analytical metric.
    dimension: True
  new_contracts_signed:
    description: Amount of new signed contracts on a day.
    metric:
      name: New Contracts Signed Daily
      description: Daily accumulated sum of the contracts that were signed.
        (not necessarily generated revenue)
      acronym: NCS
      is_additive: True
      business_stage: Demand
      hierarchy: User analysis
      approved_by: augusto.torres@quintoandar.com.br
      link_to_metric: https://quintoandar.sa.looker.com/looks/4734
