---
database_name: metric_rent
table_name: new_rentals_daily_by_sk_region
description: |
  Table to count new rentals, which are contracts actived or finalized,
  on daily basis. The date reference here is related to contract start or entrance.
  In addition, we have the region dimension embedded here on the column sk_region
  to segment this metric.
domain: For Rent
owner: gustavo.brunelli@quintoandar.com.br
columns:
  rental_date:
    lineage:
      - dw_rent.dim_contract.dt_start
      - dw_rent.dim_contract.dt_entrance
    description: Day when the contract started or the entrance happened
    dimension: True
  sk_region:
    lineage:
      - dw_rent.fact_house_listings.sk_region
    description: Surrogate key of the region used to segment this rental metric.
    dimension: True
  country_code:
    lineage:
      - dw_rent.dim_contract.country_code
    description: ISO country code for geographic filtering of the analytical metric.
    dimension: True
  new_rentals:
    description: Amount of new signed contracts on a day segmented by sk_region.
    metric:
      name: New Rentals Daily
      description: Daily accumulated sum of signed contracts that started (generated revenue)
      acronym: NR
      is_additive: True
      business_stage: Demand
      hierarchy: User analysis
      approved_by: augusto.torres@quintoandar.com.br
      link_to_metric: ""
