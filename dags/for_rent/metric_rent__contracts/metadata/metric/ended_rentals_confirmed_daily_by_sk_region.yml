database_name: metric_rent
table_name: ended_rentals_confirmed_daily_by_sk_region
description: Table to count ended rentals, which are finalized contracts, on daily
  basis. The date reference here is related to contract analyst anullment or anullment.
  In addition, we have the region dimension embedded here on the column sk_region
  to segment this metric.
domain: For Rent
owner: ''
columns:
  contract_annulment_date:
    lineage:
    - dw_public.dim_contract.ts_analyst_annulment_input
    - dw_public.dim_contract.dt_anullment
  sk_region:
    lineage:
    - dw_public.fact_house_listings.sk_region
    description: Region identifier
  day:
    description: day when the contract was anulled.
  ended_rentals_confirmed:
    description: Amount of anulled contracts on a day
