---
database_name: metric_rent
table_name: ended_rentals_confirmed_daily_by_sk_region
description: |
  Table to count ended rentals, which are finalized contracts, on daily
  basis segmented by sk_region. The date reference here is related to contract analyst anullment or anullment.
  In addition, we have the region dimension embedded here on the column sk_region
  to segment this metric.
domain: For Rent
owner: gustavo.brunelli@quintoandar.com.br
columns:
  contract_annulment_date:
    lineage:
      - dw_rent.dim_contract.ts_analyst_annulment_input
      - dw_rent.dim_contract.dt_anullment
    description: Day when the contract was anulled.
    dimension: True
  sk_region:
    lineage:
      - dw_rent.fact_house_listings.sk_region
    description: Surrogate key of the region used to segment this rental metric.
    dimension: True
  country_code:
    lineage:
      - dw_rent.dim_contract.country_code
    description: ISO country code for geographic filtering of the analytical metric.
    dimension: True
  ended_rentals_confirmed:
    description: Amount of anulled contracts on a day segmented by sk_region.
    metric:
      name: Ended Rentals Confirmed Daily by SK Region
      description: 
        Daily accumulated sum of the contracts that were annulled segmented by sk_region
        (based on the date which the offboarding analyst inputs the annulment in the system)
      acronym: ERC
      is_additive: True
      business_stage: Demand
      hierarchy: User analysis
      approved_by: augusto.torres@quintoandar.com.br
      link_to_metric: ""
