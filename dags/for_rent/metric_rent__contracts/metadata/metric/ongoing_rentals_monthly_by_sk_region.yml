---
database_name: metric_rent
table_name: ongoing_rentals_monthly_by_sk_region
description:
  Monthly table that has the amount of unique signed contracts that started and were active at the last day of the month segmented by sk_region.
  Attention to the contracts of type DealOnly (we only had contracts with this type until 2016).
  It was a service only for contracts, without the administration of the rent, therefore only generated brokerage but no
  administration fees and will be accounted once on the day of contract started.
domain: For Rent
owner: kleber.inoue@quintoandar.com.br
columns:
  month_start:
    lineage:
      - dw_public.dim_date.month_start
    description: Month when the contract was with status Ativo or Finalizado.
    dimension: True
  sk_region:
    lineage:
      - dw_rent.fact_house_listings.sk_region
    description: Region identifier.
    dimension: True
  country_code:
    lineage:
      - dw_rent.dim_contract.country_code
    description: Country code of the house.
    dimension: True
  ongoing_rentals:
    description: Amount of signed contracts that started and were active at the last day of the month.
    metric:
      name: Ongoing Rentals Monthly by SK Region
      description:
        Count of unique signed contracts that started and were active at the
        last day of the period (month). Attention to the contracts of type DealOnly
        (we only had contracts with this type until 2016). It was a service only for contracts,
        without the administration of the rent, therefore only generated brokerage but no
        administration fees and will be accounted once on the month of contract
        started.
      acronym: OR
      is_additive: False
      business_stage: Demand
      hierarchy: User analysis
      approved_by: augusto.torres@quintoandar.com.br
      link_to_metric: ""
