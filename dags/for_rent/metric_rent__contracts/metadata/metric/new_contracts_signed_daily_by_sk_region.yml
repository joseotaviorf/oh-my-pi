---
database_name: metric_rent
table_name: new_contracts_signed_daily_by_sk_region
description: |
  Table to count new signed contracts, which are contracts actived or finalized,
  on daily basis segmented by region. The date reference here is related to contract signature or start.
  In addition, we have the region dimension embedded here on the column sk_region
  to segment this metric.
domain: For Rent
owner: gustavo.brunelli@quintoandar.com.br
columns:
  contract_signed_date:
    lineage:
      - dw_rent.dim_contract.dt_start
      - dw_rent.dim_contract.ts_signature
    description: Day when the contract started or was signed, segmented by region.
    dimension: True
  sk_region:
    lineage:
      - dw_rent.fact_house_listings.sk_region
    description: Surrogate key of the region used to segment this rental metric.
    dimension: True
  country_code:
    lineage:
      - dw_rent.dim_contract.country_code
    description: ISO country code for geographic filtering of the analytical metric.
    dimension: True
  new_contracts_signed:
    description: Amount of new signed contracts on a day by region.
    metric:
      name: New Contracts Signed Daily by SK Region
      description: 
        Daily accumulated sum of the contracts that were signed segmented by sk_region
        (not necessarily generated revenue)
      acronym: NCS
      is_additive: True
      business_stage: Demand
      hierarchy: User analysis
      approved_by: augusto.torres@quintoandar.com.br
      link_to_metric: ""
