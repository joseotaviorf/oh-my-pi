database_name: metric_rent
table_name: ppmulti_new_rentals_monthly
description:
  Table to count new rentals of PPs Multi (owners with 5 or more ongoing properties on the date), which are contracts actived or finalized,
  on monthly basis. The date reference here is related to contract start or entrance.
domain: For Rent
owner: mariana.kralco@quintoandar.com.br
columns:
  month:
    lineage:
      - dw_rent.dim_contract.dt_start
      - dw_rent.dim_contract.dt_entrance
    description: month when the contract started or the entrance happened
    dimension: True
  country_code:
    lineage:
      - dw_rent.dim_contract.country_code
    description: Country code of the house.
    dimension: True
  new_rentals:
    description: Amount of new signed contract of PPs Multi (owners with 5 or more ongoing properties on the date) on a month segmented by sk_region.
    metric:
      name: PP Multi New Rentals Monthly
      description: Monthly accumulated sum of signed contracts of PPs Multi (owners with 5 or more ongoing properties on the date) that started (generated revenue)
      acronym: NR
      is_additive: True
      business_stage: Demand
      hierarchy: User analysis
      approved_by: mariana.kralco@quintoandar.com.br
      link_to_metric: "https://metabase.quintoandar.com.br/question/99533"
