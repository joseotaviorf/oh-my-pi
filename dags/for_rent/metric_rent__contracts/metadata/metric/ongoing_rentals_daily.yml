---
database_name: metric_rent
table_name: ongoing_rentals_daily
description: |
  Daily table that has the amount of unique signed contracts that started and were active at the day.
  Attention to the contracts of type DealOnly (we only had contracts with this type until 2016).
  It was a service only for contracts, without the administration of the rent, therefore only generated brokerage but no
  administration fees and will be accounted once on the day of contract started.
domain: For Rent
owner: gustavo.brunelli@quintoandar.com.br
columns:
  day:
    lineage:
      - dw_public.dim_date.date
    description: Date when the contract was with status Ativo or Finalizado.
    dimension: True
  country_code:
    lineage:
      - dw_rent.dim_contract.country_code
    description: ISO country code for geographic filtering of the analytical metric.
    dimension: True
  ongoing_rentals:
    description: Amount of signed contracts that started and were active during the day.
    metric:
      name: Ongoing Rentals Daily
      description: 
        Count of unique signed contracts that started and were active at the
        last day of the period (day). Attention to the contracts of type DealOnly
        (we only had contracts with this type until 2016). It was a service only for contracts,
        without the administration of the rent, therefore only generated brokerage but no
        administration fees and will be accounted once on the day of contract
        started.
      acronym: OR
      is_additive: False
      business_stage: Demand
      hierarchy: User analysis
      approved_by: augusto.torres@quintoandar.com.br
