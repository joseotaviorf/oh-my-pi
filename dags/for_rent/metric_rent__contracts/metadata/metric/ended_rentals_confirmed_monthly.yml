database_name: metric_rent
table_name: ended_rentals_confirmed_monthly
description: Table to count ended rentals, which are finalized contracts, on monthly
  basis. The date reference here is related to contract analyst anullment or anullment.
domain: For Rent
owner: ''
columns:
  month:
    lineage:
    - dw_public.dim_contract.ts_analyst_annulment_input
    - dw_public.dim_contract.dt_anullment
    description: month when the contract was anulled.
  ended_rentals_confirmed:
    description: Amount of anulled contracts on a month
