---
database_name: metric_rent
table_name: ended_rentals_confirmed_daily
description: |
  Table to count ended rentals, which are finalized contracts, on daily
  basis. The date reference here is related to contract analyst anullment or anullment.
domain: For Rent
owner: gustavo.brunelli@quintoandar.com.br
columns:
  day:
    lineage:
      - dw_rent.dim_contract.ts_analyst_annulment_input
      - dw_rent.dim_contract.dt_anullment
    description: Day when the contract was anulled.
    dimension: True
  country_code:
    lineage:
      - dw_rent.dim_contract.country_code
    description: ISO country code for geographic filtering of the analytical metric.
    dimension: True
  ended_rentals_confirmed:
    description: Amount of anulled contracts on a day.
    metric:
      name: Ended Rentals Confirmed Daily
      description: Daily accumulated sum of the contracts that were annulled
        (based on the date which the offboarding analyst inputs the annulment in the system)
      acronym: ERC
      is_additive: True
      business_stage: Demand
      hierarchy: User analysis
      approved_by: augusto.torres@quintoandar.com.br
      link_to_metric: https://quintoandar.sa.looker.com/looks/4741
