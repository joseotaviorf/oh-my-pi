description: |
  Daily table with the accumulated sum of the contracts that were annulled (based on annulment
  date) segmented by sk_region. Due to the nature of the product,
  this metric can change retroactively. After detailed analysis of the
  behaviour of the variable.
domain: For Rent
owner: gustavo.brunelli@quintoandar.com.br
columns:
  contract_annulment_date:
    lineage:
      - dw_rent.dim_contract.dt_anullment
    description: Day when the rental finalized.
    dimension: True
  sk_region:
    lineage:
      - dw_rent.fact_house_listings.sk_region
    description: Surrogate key of the region used to segment this rental metric.
    dimension: True
  country_code:
    lineage:
      - dw_rent.dim_contract.country_code
    description: ISO country code for geographic filtering of the analytical metric.
    dimension: True
  ended_rentals:
    description: Daily accumulated sum of the contracts that were annulled (based on annulment date) segmented by sk_region.
    metric:
      name: Ended Rentals Daily by SK Region
      description: 
        Daily accumulated sum of the contracts that were annulled (based on annulment date)
        segmented by sk_region. Due to the nature of the product, this metric can change retroactively.
      acronym: ER RG
      is_additive: True
