database_name: metric_rent
table_name: new_rentals_monthly
description: Table to count new rentals, which are contracts actived or finalized,
  on monthly basis. The date reference here is related to contract start or entrance.
domain: For Rent
owner: ''
columns:
  month:
    lineage:
    - dw_public.dim_contract.dt_start
    - dw_public.dim_contract.dt_entrance
    description: month when the contract started or the entrance happened
  new_rentals:
    description: Amount of new rentals on a month
