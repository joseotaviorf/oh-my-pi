---
database_name: metric_rent
table_name: new_contracts_signed_weekly
description: |
  Table to count new signed contracts, which are contracts actived or finalized,
  on weekly basis. The date reference here is related to contract signature or start.
domain: For Rent
owner: gustavo.brunelli@quintoandar.com.br
columns:
  week:
    lineage:
      - dw_rent.dim_contract.dt_start
      - dw_rent.dim_contract.ts_signature
    description: Week date when the contract started or was signed.
    dimension: True
  country_code:
    lineage:
      - dw_rent.dim_contract.country_code
    description: ISO country code for geographic filtering of the analytical metric.
    dimension: True
  new_contracts_signed:
    description: Amount of new signed contracts on a week.
    metric:
      name: New Contracts Signed Weekly
      description: Weekly accumulated sum of the contracts that were signed.
        (not necessarily generated revenue)
      acronym: NCS
      is_additive: True
      business_stage: Demand
      hierarchy: User analysis
      approved_by: augusto.torres@quintoandar.com.br
      link_to_metric: https://quintoandar.sa.looker.com/looks/4754
