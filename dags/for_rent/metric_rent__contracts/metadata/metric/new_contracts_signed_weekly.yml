database_name: metric_rent
table_name: new_contracts_signed_weekly
description: Table to count new signed contracts, which are contracts actived or finalized,
  on weekly basis. The date reference here is related to contract signature or start.
domain: For Rent
owner: ''
columns:
  week:
    lineage:
    - dw_public.dim_contract.dt_start
    - dw_public.dim_contract.ts_signature
    description: day when the contract started or was signed.
  new_contracts_signed:
    description: Amount of new signed contracts on a day
