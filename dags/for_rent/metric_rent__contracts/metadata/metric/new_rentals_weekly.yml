---
database_name: metric_rent
table_name: new_rentals_weekly
description: |
  Table to count new rentals, which are contracts actived or finalized,
  on weekly basis. The date reference here is related to contract start or entrance.
domain: For Rent
owner: gustavo.brunelli@quintoandar.com.br
columns:
  week:
    lineage:
      - dw_rent.dim_contract.dt_start
      - dw_rent.dim_contract.dt_entrance
    description: week when the contract started or the entrance happened
    dimension: True
  country_code:
    lineage:
      - dw_rent.dim_contract.country_code
    description: ISO country code for geographic filtering of the analytical metric.
    dimension: True
  new_rentals:
    description: Amount of new signed contracts on a week segmented by sk_region.
    metric:
      name: New Rentals Weekly
      description: Weekly accumulated sum of signed contracts that started (generated revenue)
      acronym: NR
      is_additive: True
      business_stage: Demand
      hierarchy: User analysis
      approved_by: augusto.torres@quintoandar.com.br
      link_to_metric: https://quintoandar.sa.looker.com/looks/4755
