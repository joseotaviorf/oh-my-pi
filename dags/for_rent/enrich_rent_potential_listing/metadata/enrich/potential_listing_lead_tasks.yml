database_name: datalake_rent_potential_listing
table_name: potential_listing_lead_tasks
description: Table with information about listing lead tasks, such as user responsible for the task,
  creation and closing dates and inside sales intervention.
domain: For Rent
owner: gustavo.alencar@quintoandar.com.br
columns:
  id:
    description: ID of the listing flow.
    lineage:
      - datalake_listing_flow.listing_flows_with_reprocessed_leads.id
  id_user_sales_rep:
    description: ID of the sales rep.
    lineage:
      - datalake_listing_flow.listing_flows_with_reprocessed_leads.id_rep
      - datalake_crm_lead.lead_tasks.id_rep
  id_user_first_task_assignee:
    description: ID of the user assigned to the first listing lead task.
    lineage:
      - datalake_crm_lead.lead_tasks.id_rep
  id_user_last_task_assignee:
    description: ID of the user assigned to the last listing lead task.
    lineage:
      - datalake_crm_lead.lead_tasks.id_rep
  first_isales_intervention:
    description: Indicates the first inside sales intervention (Lead or Photojob).
  dt_first_task_created_date:
    description: Date when the first listing lead task was created.
    lineage:
      - datalake_listing_flow.listing_flows_with_reprocessed_leads.dt_lead
      - datalake_crm_lead.lead_tasks.ts_created
  dt_first_task_closed_date:
    description: Date when the first listing lead task was closed.
    lineage:
      - datalake_listing_flow.listing_flows_with_reprocessed_leads.dt_lead
      - datalake_crm_lead.lead_tasks.ts_created
  dt_last_task_created_date:
    description: Date when the last listing lead task was created.
    lineage:
      - datalake_listing_flow.listing_flows_with_reprocessed_leads.dt_lead
      - datalake_crm_lead.lead_tasks.ts_created
  dt_last_task_closed_date:
    description: Date when the last listing lead task was closed.
    lineage:
      - datalake_listing_flow.listing_flows_with_reprocessed_leads.dt_lead
      - datalake_crm_lead.lead_tasks.ts_created
  has_isales_intervention:
    description: Flag indicating if the task had inside sales intervention.
  has_fup_photo_task:
    description: Flag indicating if there is a photojob follow up task.
    lineage:
      - datalake_listing_jobs.house_photo_job_tasks.has_fup_photo