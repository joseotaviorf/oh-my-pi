dag:
  name: heimdall
  schedule_start_date: 2019, 5, 31
  schedule_interval: 30 0 * * *
  owner: Data ForRent
  documentation:
    dag_purpose: |
      This DAG extracts data from [Heimdall](https://github.com/quintoandar/heimdall),
      a financial hub to integrate the payments related tasks into a contract life cycle.
      This DAG is triggered by Airflow and loads the table via full load.
workflow:
  type: database_pull_delta
  layer: raw
  database_type: mongo
  dbutils_secret_key: HEIMDALL_DB
  tables_customization:
    activity:
      clean_table_name: activity
cluster:
  type: databricks_16_4_med_io-general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
