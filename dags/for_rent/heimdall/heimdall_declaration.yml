---
dag:
  name: heimdall
  schedule_start_date: 2019, 5, 31
  schedule_interval: 30 0 * * *
  owner: Data ForRent
  documentation: 
    dag_purpose: |
      This DAG extracts data from [Heimdall](https://github.com/quintoandar/heimdall),
      a financial hub to integrate the payments related tasks into a contract life cycle.
      This DAG is triggered by Airflow and loads the table via full load.
workflow:
  type: database_pull
  layer: raw
  database_type: mongo
  dbutils_secret_key: HEIMDALL_DB
  tables_customization:
    activity:
      clean_table_name: activity
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: m5a.2xlarge
    node_type_id: m5a.xlarge
    num_workers: 2
    spark_version: 12.2.x-scala2.12
