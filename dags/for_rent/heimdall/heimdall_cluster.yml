cluster:
  type: consolidation_xs_memory_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    num_workers: 3
    driver_node_type_id: r7g.2xlarge
validation:
  cluster:
    type: emr_7_12_consolidation_xs_memory_fleet_cluster
    custom_configurations:
      master_node_type_id: r6g.2xlarge
      task_nodes:
        instance_types:
        - r6g.xlarge
        - r7g.xlarge
        - r6i.xlarge
        target_on_demand: 0
        target_spot: 1
        allocation_strategy: price-capacity-optimized
        bid_price_percentage: 100
      core_nodes:
        target_on_demand: 2
        target_spot: 0
        instance_types:
        - r6g.xlarge
        - r7g.xlarge
        - r6i.xlarge
      spark_conf:
        # Mongo full pull materializes documents in the PySpark driver process.
        # EMR submit is client mode: the driver runs on the master node, not in the
        # YARN AM. Leave AM at the fleet default (~1g); do not size it like the driver.
        spark.driver.memory: 24g
        spark.driver.memoryOverhead: 8g
