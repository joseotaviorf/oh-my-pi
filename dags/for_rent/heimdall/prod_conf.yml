---
partition_cols: ["year", "month", "day"]

dag_documentation:
  dag_purpose:
    "This DAG extracts data from [Heimdall](https://github.com/quintoandar/heimdall),
    a financial hub to integrate the payments related tasks into a contract life cycle."

custom_cluster:
  driver_node_type_id: m5a.2xlarge
  node_type_id: m5a.xlarge
  autoscale:
    max_workers: 2
    min_workers: 1

tables:
  # <raw_table_name>:
  #   clean_table_name: <clean_table_name>
  #   is_incremental: <is_incremental>
  #   date_column: <date_column> #optional
  #   unixtime_measure: <unixtime_measure> #optional
  activity:
    clean_table_name: activity
    is_incremental: False
