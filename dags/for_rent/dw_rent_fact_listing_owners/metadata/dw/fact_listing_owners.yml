database_name: dw_quintoandar
table_name: fact_listing_owners
description: Table with calculated rent flow metrics, each row is an owner of a property.
domain: For Rent
owner: mariana.kralco@quintoandar.com.br
columns:
  sk_listing_owner:
    lineage:
      - datalake_listing_owners.rental_metrics.id_listing_owner
    description: User ID of the property owner
  sk_first_booking_date:
    lineage:
      - datalake_listing_owners.rental_metrics.ts_first_booking
    description: Date ID (%Y%m%d format) of first booking creation
  sk_first_contract_signed_date:
    lineage:
      - datalake_listing_owners.rental_metrics.ts_first_contract_signed
    description: Date ID (%Y%m%d format) of first contract signed
  sk_first_listing_registered_date:
    lineage:
      - datalake_listing_owners.rental_metrics.ts_first_listing_registered
    description: Date ID (%Y%m%d format) of first listing registered
  sk_first_offer_accepted_date:
    lineage:
      - datalake_listing_owners.rental_metrics.ts_first_offer_accepted
    description: Date ID (%Y%m%d format) of first offer accepted
  sk_first_offer_received_date:
    lineage:
      - datalake_listing_owners.rental_metrics.ts_first_offer_received
    description: Date ID (%Y%m%d format) of first offer received
  sk_first_visit_date:
    lineage:
      - datalake_listing_owners.rental_metrics.dt_first_visited
    description: Date ID (%Y%m%d format) of first completed visit
  sk_last_booking_date:
    lineage:
      - datalake_listing_owners.rental_metrics.ts_last_booking
    description: Date ID (%Y%m%d format) of last booking
  sk_last_contract_signed_date:
    lineage:
      - datalake_listing_owners.rental_metrics.ts_last_contract_signed
    description: Date ID (%Y%m%d format) of last contract signed
  sk_last_listing_registered_date:
    lineage:
      - datalake_listing_owners.rental_metrics.ts_last_listing_registered
    description: Date ID (%Y%m%d format) of last listing registered
  sk_last_offer_accepted_date:
    lineage:
      - datalake_listing_owners.rental_metrics.ts_last_offer_accepted
    description: Date ID (%Y%m%d format) of last offer accepted
  sk_last_offer_received_date:
    lineage:
      - datalake_listing_owners.rental_metrics.ts_last_offer_received
    description: Date ID (%Y%m%d format) of last offer received
  sk_last_visit_date:
    lineage:
      - datalake_listing_owners.rental_metrics.dt_last_visited
    description: Date ID (%Y%m%d format) of last completed visit
  contracts_annuled:
    description: Number of contracts with status = 'Finalizado'
  contracts_cancelled:
    description: Number of contracts with status = 'Cancelado'
  contracts_signed:
    description: Number of contracts with status in ('Ativo', 'Finalizado')
  contracts_to_be_signed:
    description: Number of contracts with status in ('Minuta', 'PreAssinaturas')
  listings_published:
    description: Number of versions of listings published
  ongoing_contracts:
    description: Number of contracts that were signed and were active
  ongoing_listings:
    description: Number of listings with status = 'PUBLISHED'
  offers_accepted:
    description: Number of offers that were accepted, that is, the number of proposals.
  offers_negotiating:
    description: Sum of all offers with status = 'EmNegociacao'
  offers_received:
    description: Number of offers received.
  offers_rejected:
    description: Sum of all offers with status = 'Rejeitada'
  properties_registered:
    description: Number of properties owned by the owner
  proposals_approved:
    description: Sum of all proposals with status = 'Aprovada'
  proposals_rejected:
    description: Sum of all proposals with status = 'Rejeitada'
  reservations_received:
    description: Sum of all reservations with status in ('CANCELED', 'FINISHED', 'RETURNED')
  ts_load:
    description: Timestamp in which the register was loaded into database
  visits_booked:
    description: Count of unique booking visits
  visits_cancelled:
    description: Sum of canceled visits
  visits_expected_to_happen:
    description: Sum of visits that were not completed and not canceled
  visits_received:
    description: Sum of completed visits