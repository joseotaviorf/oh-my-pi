---
database_name: datalake_gsheets_clean
table_name: demand_targets_2024
description: For Rent demand funnel volume targets for 2024 from Google Sheets. One row per city group, date, and funnel dimension with stage-level goal counts.
domain: For Rent
owner: isadora.gallerani@quintoandar.com.br
columns:
  city_group:
    description: Geographic city cluster used to group demand and budget planning targets.
    lineage:
      - datalake_gsheets_raw.demand_targets_2024.city_group
  dt_target:
    description: Calendar date the demand funnel target volume applies to.
    lineage:
      - datalake_gsheets_raw.demand_targets_2024.date
  business_type:
    description: Business type of the listing related to the event (ASP, CIQ, B2B or Core).
    lineage:
      - datalake_gsheets_raw.demand_targets_2024.business_type
  rent_flow_origin:
    description: Origin (first touchpoint) of the rent flow related to the event.
    lineage:
      - datalake_gsheets_raw.demand_targets_2024.rent_flow_origin
  rental_administrator:
    description: Who is responsible for administrating the contract (QuintoAndar, Third party or Brokerage Only).
    lineage:
      - datalake_gsheets_raw.demand_targets_2024.rental_administrator
  visits_booked:
    description: Count of tenant visits scheduled during the reporting period.
    lineage:
      - datalake_gsheets_raw.demand_targets_2024.visits_booked  
  visits_completed:
    description: Target volume of visits completed.
    lineage:
      - datalake_gsheets_raw.demand_targets_2024.visits_completed
  offers_submitted:
    description: Target volume of offers submitted.
    lineage:
      - datalake_gsheets_raw.demand_targets_2024.offers_submitted
  offers_accepted:
    description: Target volume of offers accepted.
    lineage:
      - datalake_gsheets_raw.demand_targets_2024.offers_accepted
  evaluation_started:
    description: Target volume of evaluations started.
    lineage:
      - datalake_gsheets_raw.demand_targets_2024.evaluation_started
  evaluation_positive:
    description: Target volume of evaluations positive.
    lineage:
      - datalake_gsheets_raw.demand_targets_2024.evaluation_positive
  documentation_sent:
    description: Target volume of documentations sent.
    lineage:
      - datalake_gsheets_raw.demand_targets_2024.documentation_sent
  credit_approved:
    description: Target volume of credit analysis approved.
    lineage:
      - datalake_gsheets_raw.demand_targets_2024.credit_approved
  contracts_signed:
    description: Target volume of contracts signed.
    lineage:
      - datalake_gsheets_raw.demand_targets_2024.contracts_signed
