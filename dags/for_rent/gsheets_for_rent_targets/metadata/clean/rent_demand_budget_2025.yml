database_name: datalake_gsheets_clean
table_name: rent_demand_budget_2025
description: For Rent demand budget targets for 2025 from Google Sheets. One row per city group and budget period with planned funnel volumes.
domain: For Rent
owner: isadora.gallerani@quintoandar.com.br
columns:
  business_type:
    lineage:
      - datalake_gsheets_raw.rent_demand_budget_2025.business_type
    description: Business type of the listing related to the event (ASP, CIQ, B2B or Core).
  city_group:
    lineage:
      - datalake_gsheets_raw.rent_demand_budget_2025.city_group
    description: Geographic city cluster used to group demand and budget planning targets.
  contracts_signed:
    lineage:
      - datalake_gsheets_raw.rent_demand_budget_2025.contracts_signed
    description: Budget volume of contracts signed.
  credit_approved:
    lineage:
      - datalake_gsheets_raw.rent_demand_budget_2025.credit_approved
    description: Budget volume of credit analysis approved.
  date:
    lineage:
      - datalake_gsheets_raw.rent_demand_budget_2025.date
    description: Calendar date the planning target volume applies to.
  documentation_sent:
    lineage:
      - datalake_gsheets_raw.rent_demand_budget_2025.documentation_sent
    description: Budget volume of documentations sent.
  evaluation_positive:
    lineage:
      - datalake_gsheets_raw.rent_demand_budget_2025.evaluation_positive
    description: Budget volume of evaluations positive.
  evaluation_started:
    lineage:
      - datalake_gsheets_raw.rent_demand_budget_2025.evaluation_started
    description: Budget volume of evaluations started.
  offers_accepted:
    lineage:
      - datalake_gsheets_raw.rent_demand_budget_2025.offers_accepted
    description: Budget volume of offers accepted.
  offers_submitted:
    lineage:
      - datalake_gsheets_raw.rent_demand_budget_2025.offers_submitted
    description: Budget volume of offers submitted.
  rent_flow_origin:
    lineage:
      - datalake_gsheets_raw.rent_demand_budget_2025.rent_flow_origin
    description: Origin (first touchpoint) of the rent flow related to the event.
  rental_administrator:
    lineage:
      - datalake_gsheets_raw.rent_demand_budget_2025.rental_administrator
    description: Who is responsible for administrating the contract (QuintoAndar, Third party or Brokerage Only).
  visits_booked:
    lineage:
      - datalake_gsheets_raw.rent_demand_budget_2025.visits_booked
    description: Count of tenant visits scheduled during the reporting period.
  visits_completed:
    lineage:
      - datalake_gsheets_raw.rent_demand_budget_2025.visits_completed
    description: Budget volume of visits completed.
