dag:
  name: enrich_pp_multi
  schedule_start_date: 2025,08,28
  owner: Data ForRent
workflow:
  type: query_delta
  layer: enrich
  tables_customization:
    pp_multi_classification_history:
      partitions:
        - year
        - month
        - day
      extraction_type: incremental
cluster:
  type: databricks_16_4_med_2xlarge_general_cluster
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE
  databricks_conn_id: databricks_new_env
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: USER_ISOLATION
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
      spark.databricks.delta.constraints.allowUnenforcedNotNull.enabled: true
