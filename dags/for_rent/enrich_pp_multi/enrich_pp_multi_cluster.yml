cluster:
  type: emr_7_12_consolidation_m_memory_fleet_cluster
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE
  custom_configurations:
    aws_attributes:
      ebs_volume_size: 200
    # Keep OSS Delta NOT NULL via spark_conf (not emr_configurations): custom
    # emr_configurations lists replace the preset wholesale and wipe Glue/Delta
    # classifications. Translator allowlists spark.databricks.delta.* into
    # spark-defaults while still stripping UC-only spark.databricks.* keys.
    spark_conf:
      spark.databricks.delta.constraints.allowUnenforcedNotNull.enabled: true
    core_nodes:
      target_on_demand: 3
      target_spot: 0
      instance_types:
      - r6g.2xlarge
      - r7g.2xlarge
      - r6i.2xlarge
