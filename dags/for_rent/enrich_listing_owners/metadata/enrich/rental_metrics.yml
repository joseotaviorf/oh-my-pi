database_name: datalake_listing_owners
table_name: rental_metrics
description: Table with calculated rent flow metrics, each row is an owner
domain: For Rent
owner: mariana.kralco@quintoandar.com.br
columns:
  id_listing_owner:
    lineage:
      - datalake_ebdb_listing.house.id_user 
    description: User ID of the property owner
  contracts_annuled:
    description: Sum of all contracts with status = 'Finalizado'
  contracts_cancelled:
    description: Sum of all contracts with status = 'Cancelado'
  contracts_signed:
    description: Sum of all contracts with status in ('Ativo', 'Finalizado')
  contracts_to_be_signed:
    description: Sum of all contracts with status in ('Minuta', 'PreAssinaturas')
  dt_first_visited:
    lineage:
      - datalake_booking.booking.dt_booking 
    description: Date of first completed visit
  dt_last_visited:
    lineage:
      - datalake_booking.booking.dt_booking  
    description: Date of last completed visit
  listings_published:
    description: Number of versions of listings published
  offers_accepted:
    description: Count unique IDs of proposals
  offers_negotiating:
    description: Sum of all offers with status = 'EmNegociacao'
  offers_received:
    description: Count unique IDs of offers
  offers_rejected:
    description: Sum of all offers with status = 'Rejeitada'
  ongoing_contracts:
    description: Sum of contracts that were signed and were active 
  ongoing_listings:
    description: Sum of listings with status = 'PUBLISHED' 
  properties_registered:
    description: Number of properties owned by the owner
  proposals_approved:
    description: Sum of all proposals with status = 'Aprovada'
  proposals_rejected:
    description: Sum of all proposals with status = 'Rejeitada'
  reservations_received:
    description: Sum of all reservations with status in ('CANCELED', 'FINISHED', 'RETURNED')
  ts_first_booking:
    lineage:
      - datalake_booking.booking.ts_created
    description: Datetime of first booking creation
  ts_first_contract_signed:
    lineage:
      - datalake_ebdb_contract.contract.ts_signed
    description: Datetime of first contract signed
  ts_first_listing_registered:
    lineage:
      - datalake_ebdb_listing.listing_business_context.ts_created
    description: Datetime of first listing registered
  ts_first_offer_accepted:
    lineage:
      - datalake_ebdb_clean.proposal.ts_created
    description: Datetime of first offer accepted
  ts_first_offer_received:
    lineage:
      - datalake_offer.offer.ts_created
    description: Datetime of first offer received
  ts_last_booking:
    lineage:
      - datalake_booking.booking.ts_created
    description: Datetime of last booking
  ts_last_contract_signed:
    lineage:
      - datalake_ebdb_contract.contract.ts_signed
    description: Datetime of last contract signed
  ts_last_listing_registered:
    lineage:
      - datalake_ebdb_listing.listing_business_context.ts_created
    description: Datetime of last listing registered
  ts_last_offer_accepted:
    lineage:
      - datalake_ebdb_clean.proposal.ts_created
    description: Datetime of last offer accepted
  ts_last_offer_received:
    lineage:
      - datalake_offer.offer.ts_created
    description: Datetime of last offer received
  ts_load:
    description: Timestamp in which the register was loaded into database
  visits_booked:
    description: Count of unique booking visits
  visits_cancelled:
    description: Sum of canceled visits
  visits_expected_to_happen:
    description: Sum of visits that were not completed and not canceled
  visits_received:
    description: Sum of completed visits