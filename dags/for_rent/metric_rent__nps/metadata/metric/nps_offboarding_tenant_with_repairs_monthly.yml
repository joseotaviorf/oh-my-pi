---
database_name: metric_rent
table_name: nps_offboarding_tenant_with_repairs_monthly
description: Monthly NPS of tenants with contract termination with repair needed.
domain: For Rent
owner: kleber.inoue@quintoandar.com.br
columns:
  dt_month_answered:
    lineage:
      - dw_public.dim_date.date
    description: Month date of NPS answer.
    dimension: True
  category:
    lineage:
      - dw_rent.dim_contract.value_segment
    description: "Category of rent value."
    categories:
      LOW: Rent lower than R$1500,00.
      MEDIUM: Rent between R$1500,01 and R$2499,99.
      HIGH: Rent higher than R$2500,00.
      UNDEFINED: Undefined.
      OVERALL: All rent value. LOW, MEDIUM, HIGH and UNDEFINED included in OVERALL category.
    dimension: True
  country_code:
    lineage:
      - dw_rent.dim_contract.country_code
    description: Country code of the house related to the contract.
  promoters_repairs_needed:
    description: "Monthly volume of promoters among tenants that answered the NPS survey after a contract termination with the need of repairs. To be in promoter category, the score should be greater or equal than 9."
    metric:
      name: Total Monthly Promoters Among Tenants With Repair
      description: "Monthly volume of promoters among tenants that answered the NPS survey after a contract termination with the need of repairs. To be in promoter category, the score should be higher or equal than 9."
