      hierarchy: User analysis
      approved_by: pilar.valente@quintoandar.com.br
      link_to_metric: ""
  detractors_repairs_needed:
    description: "Monthly volume of detractors among tenants that answered the NPS survey after a contract termination with the need of repairs. To be in detractor category the score should be less than 7."
    metric:
      name: Total Monthly Detractors Among Tenants With Repair
      description: "Monthly volume of detractors among tenants that answered the NPS survey after a contract termination with the need of repairs. To be in detractor category the score should be less than 7."
