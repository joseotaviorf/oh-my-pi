database_name: dw_public
table_name: dim_proposal
description: A proposal is an offer (see dim_offer table) made by a tenant which has
  been accepted by the property owner. Proposals are the last step before becoming
  contracts. Each line is a proposal
domain: For Rent
owner: conrado.fabri@quintoandar.com.br
columns:
  sk_proposal:
    lineage:
    - dw_rent.dim_proposal.sk_proposal
    description: Key of proposal
  id_proposal:
    lineage:
    - dw_rent.dim_proposal.id_proposal
    description: Key of proposal
  country_code:
    lineage:
    - dw_rent.dim_proposal.country_code
    description: Country code related to the proposal's country of origin
    categories:
      BR: Brazil's country code
      MX: Mexico's country code
  guarantee:
    lineage:
    - dw_rent.dim_proposal.guarantee
    description: Guarantee (BrasilCap, Deposito, Fiador, OutroTipoFiador, PortoSeguro,
      SeguroFairfax, SeguroFiancaCardiff / today only SeguroFairFax)
    categories:
      BrasilCap: '-'
      Deposito: '-'
      Fiador: '-'
      OutroTipoFiador: '-'
      PortoSeguro: '-'
      RentalGuarantee: '-'
      SeguroFairfax: '-'
      SeguroFiancaCardiff: '-'
      Standalone: '-'
      RentalDeposit: '-'
      PRO_GUARANTOR: '-'
  status:
    lineage:
    - dw_rent.dim_proposal.status
    description: Proposal Status (PreMinuta, EmAnalise, Aprovada, Rejeitada, Nova)
    categories:
      Aprovada: 'Approved'
      EmAnalise: 'Analysis'
      Nova: 'New'
      PreMinuta: 'Draft'
      Rejeitada: 'Rejected'
  status_doc_tenant:
    lineage:
    - dw_rent.dim_proposal.status_doc_tenant
    description: Tenant document status (Analise5a, AnaliseCredito, Aprovado, NaoEnviado,
      RecusadoCredito, ReenvioDocumentos, StandBy)
    categories:
      Analise5a: 'QuintoAndar analysis (credit desk / mesa de crédito)'
      AnaliseCredito: 'Credit evaluation'
      Aprovado: 'Approved'
      NaoEnviado: 'Docs not sent'
      RecusadoCredito: 'Credit evaluation rejected'
      ReenvioDocumentos: 'Docs resent'
      StandBy: 'Stand by'
  status_doc_owner:
    lineage:
    - dw_rent.dim_proposal.status_doc_owner
    description: Owner document status (Analise5a, Aprovado, NaoEnviado, ReenvioDocumentos)
  rejection_reason:
    lineage:
    - dw_rent.dim_proposal.rejection_reason
    description: Reason for rejecting the proposal
    categories:
      CreditEvaluationRejected: Credit evaluation rejected
      HouseReserved: House was reserved
      NDA: NDA
      OwnerGaveUpOffer: Owner gave up offer
      OwnerGaveUpRenting: Owner gave up renting
      OwnerGaveUpTenant: Owner gave up tenant
      OwnerNoContact: Owner did not make contact
      OwnerRentedForAnotherTenant5A: The owner ended up renting for another QuintoAndar
        tenant
      OwnerRentedForAnotherTenantOutside: The owner ended up renting for another tenant
        outside of QuintoAndar
      OwnerSoldApartment: Owner sold the propoerty
      OwnerStalled: Owner stalled
      TenantDocumentationRejected: Tenant docs rejected
      TenantFailedPayment: Tenant failed guarantee payment
      TenantGaveUpApartment: Tenant gave up apartment
      TenantGaveUpRenting: Tenant gave up renting
      TenantNewOffer: '-'
      TenantNoContact: Tenant did not make contact
      TenantNoReserved: '-'
      TenantRentedAnother5A: Tenant rented another house in QuintoAndar
      TenantRentedAnotherOutside: Tenant rented outside of QuintoAndar
      TenantStalled: Tenant stalled
  result_credit_evaluation:
    lineage:
    - dw_rent.dim_proposal.result_credit_evaluation
    description: '[New column to consider the credit evaluation step which started
      in ''2020-06-08''] Status of the last credit evaluation'
    categories:
      PRE_APPROVED: Pre approved
      PRE_REJECTED: Pre rejected
      REGULAR: Regular
  status_sortinghat:
    lineage:
    - dw_rent.dim_proposal.status_sortinghat
    description: Credit analysis status (ADVISABLE, APPROVED, INADVISABLE, NEW, REJECTED)
    categories:
      ADVISABLE: Advisable
      APPROVED: Approved
      INADVISABLE: Inadvisable
      NEW: New
      REJECTED: Rejected
  renting_proposal_value:
    lineage:
    - dw_rent.dim_proposal.rent_proposal_value
    description: Rent proposal value (R$)
  tenant_document_sent_count:
    lineage:
    - dw_rent.dim_proposal.tenant_document_sent_count
    description: Count how many times the tenant has sent the documentation
  credit_evaluation_count:
    lineage:
    - dw_rent.dim_proposal.credit_evaluation_count
    description: Number of Credit Evaluations the TP tried for that Proposal
  tenant_document_sent:
    lineage:
    - dw_rent.dim_proposal.tenant_document_sent
    description: '1: Tenant sent document / 0: Tenant did not send document'
  tenant_contract_accepted:
    lineage:
    - dw_rent.dim_proposal.tenant_contract_accepted
    description: '1: Tenant accepted contract / 0: Tenant did not accept contract'
  owner_contract_accepted:
    lineage:
    - dw_rent.dim_proposal.owner_contract_accepted
    description: '1: Owner accepted contract / 0: Owner did not accept contract'
  owner_document_sent:
    lineage:
    - dw_rent.dim_proposal.owner_document_sent
    description: '1: Owner sent document / 0: Owner did not send document'
  flg_doc_reused:
    lineage:
    - dw_rent.dim_proposal.flg_doc_reused
    description: '[deprecated] 1: Doc was reused / 0: Doc was not reused'
  dt_proposal:
    lineage:
    - dw_rent.dim_proposal.dt_proposal
    description: Date of proposal creation (dt_created)
  dt_proposal_approved:
    lineage:
    - dw_rent.dim_proposal.dt_proposal_approved
    description: Date of proposal approval
  ts_processed:
    lineage:
    - dw_rent.dim_proposal.dt_processed
    description: Date of the end of the proposal phase
  dt_created:
    lineage:
    - dw_rent.dim_proposal.dt_created
    description: Date of proposal creation (dt_proposal)
  dt_updated:
    lineage:
    - dw_rent.dim_proposal.dt_updated
    description: Date of proposal update
  dt_tenant_document_sent:
    lineage:
    - dw_rent.dim_proposal.dt_tenant_document_sent
    description: Date of tenant documentation sent
  dt_owner_document_sent:
    lineage:
    - dw_rent.dim_proposal.dt_owner_document_sent
    description: Date of documentation sent by tenant
  dt_tenant_first_document_sent:
    lineage:
    - dw_rent.dim_proposal.dt_tenant_first_document_sent
    description: Date of tenat first doc sent if not automatic send
  dt_tenant_auto_first_doc_sent:
    lineage:
    - dw_rent.dim_proposal.dt_tenant_auto_first_doc_sent
    description: Date of tenat first doc sent if automatic send
  dt_credit_analysis_first_init:
    lineage:
    - dw_rent.dim_proposal.dt_credit_analysis_first_init
    description: '[Deprecated after 2020-06-08. Only use this column to query data
      from before this date.] Date when the first credit analysis started for the
      proposal  (Status of ''AnaliseCredito'' or ''Analise5a'' if after ''2020-01-02'')'
  dt_credit_analysis_init:
    lineage:
    - dw_rent.dim_proposal.dt_credit_analysis_init
    description: Date of credit analysis init
  dt_credit_analysis_first_end:
    lineage:
    - dw_rent.dim_proposal.dt_credit_analysis_first_end
    description: '[Deprecated after 2020-06-08. Only use this column to query data
      from before this date.] Date when the first credit analysis ended for the proposal
      (Possible Credit Analysis Status: ''Aprovado'', ''RecusadoCredito'', ''StandBy'')'
  dt_credit_analysis_end:
    lineage:
    - dw_rent.dim_proposal.dt_credit_analysis_end
    description: Date of credit analysis end
  dt_credit_last_approved:
    lineage:
    - dw_rent.dim_proposal.dt_credit_last_approved
    description: '[Deprecated after 2020-06-08. Only use this column to query data
      from before this date.] Date when the last credit analysis result = ''Aprovado''
      for the Tenant Documentation'
  dt_tenant_first_doc_complete:
    lineage:
    - dw_rent.dim_proposal.dt_tenant_first_doc_complete
    description: '[Deprecated after Credit Evaluation started] Since then this column
      equals the credit_evaluation_last_init'
  dt_tenant_last_doc_complete:
    lineage:
    - dw_rent.dim_proposal.dt_tenant_last_doc_complete
    description: '[Deprecated after Credit Evaluation started] Prior to the credit
      evaluation it represented the last approval of the documentation before the
      credit analysis. Since then this column equals the credit_evaluation_last_init'
  dt_first_credit_evaluation_init:
    lineage:
    - dw_rent.dim_proposal.dt_first_credit_evaluation_init
    description: '[New column to consider the credit evaluation step which started
      in ''2020-06-08''] Date when the first credit evaluation for the proposal started'
  dt_last_credit_evaluation_init:
    lineage:
    - dw_rent.dim_proposal.dt_last_credit_evaluation_init
    description: '[New column to consider the credit evaluation step which started
      in ''2020-06-08''] Date when the last credit evaluation for the proposal started'
  dt_first_credit_evaluation_negative:
    lineage:
    - dw_rent.dim_proposal.dt_first_credit_evaluation_negative
    description: '[New column to consider the credit evaluation step which started
      in ''2020-06-08''] Date of the first tenant documentation rejection on the new
      evaluation process'
  dt_last_credit_evaluation_negative:
    lineage:
    - dw_rent.dim_proposal.dt_last_credit_evaluation_negative
    description: '[New column to consider the credit evaluation step which started
      in ''2020-06-08''] Date of the last tenant document rejection on the new evaluation
      process'
  dt_guarantee:
    lineage:
    - dw_rent.dim_proposal.dt_guarantee
    description: Date the tenant opted for the RentalGuarantee
  dt_first_doc_analysis_approved:
    lineage:
    - dw_rent.dim_proposal.dt_first_doc_analysis_approved
    description: '[New column to consider the credit evaluation step which started
      in ''2020-06-08''] Minimun date when the tenant documentation was approved on
      the new evaluation process'
  dt_last_doc_analysis_approved:
    lineage:
    - dw_rent.dim_proposal.dt_last_doc_analysis_approved
    description: '[New column to consider the credit evaluation step which started
      in ''2020-06-08''] Maximun date when the tenant documentation was approved on
      the new evaluation process'
  dt_first_doc_analysis_rejected:
    lineage:
    - dw_rent.dim_proposal.dt_first_doc_analysis_rejected
    description: '[New column to consider the credit evaluation step which started
      in ''2020-06-08''] Minimun date when the tenant documentation was rejected on
      the new evaluation process'
  dt_last_doc_analysis_rejected:
    lineage:
    - dw_rent.dim_proposal.dt_last_doc_analysis_rejected
    description: '[New column to consider the credit evaluation step which started
      in ''2020-06-08''] Maximun date when the tenant documentation was rejected on
      the new evaluation process'
  dt_guarantee_paid:
    lineage:
    - dw_rent.dim_proposal.dt_guarantee_paid
    description: Date the tenant paid the RentalGuarantee
  dt_first_credit_evaluation_positive:
    lineage:
    - dw_rent.dim_proposal.dt_first_credit_evaluation_positive
    description: '[New column to consider the credit evaluation step which started
      in ''2020-06-08''] Date of the first time tenant documentation was approved
      for that proposal - status ''Pre Approved'' or ''Regular'''
  dt_last_credit_evaluation_positive:
    lineage:
    - dw_rent.dim_proposal.dt_last_credit_evaluation_positive
    description: '[New column to consider the credit evaluation step which started
      in ''2020-06-08''] Date of the last time tenant documentation was approved for
      that proposal - status ''Pre Approved'' or ''Regular'''
  dt_credit_analysis_last_init:
    lineage:
    - dw_rent.dim_proposal.dt_credit_analysis_last_init
    description: '[Deprecated after 2020-06-08. Only use this column to query data
      from before this date.] Date when the last credit analysis  started for the
      proposal  (Status of ''AnaliseCredito'' or ''Analise5a'' if after ''2020-01-02'')'
  dt_credit_analysis_last_end:
    lineage:
    - dw_rent.dim_proposal.dt_credit_analysis_last_end
    description: '[Deprecated after 2020-06-08. Only use this column to query data
      from before this date.] Date when the last credit analysis ended for the proposal
      (Possible Credit Analysis Status: ''Aprovado'', ''RecusadoCredito'', ''StandBy'')'
  dt_tenant_doc_complete:
    lineage:
    - dw_rent.dim_proposal.dt_tenant_doc_complete
    description: '[Deprecated after Credit Evaluation started] Prior to the credit
      evaluation it represented the firt approval of the documentation before the
      credit analysis. Since then this column equals the credit_evaluation_first_init'
  ts_entrance:
    lineage:
    - dw_rent.dim_proposal.ts_entrance
    description: Date of entrance
  dt_timestamp:
    lineage:
      - dw_rent.dim_proposal.dt_timestamp
    description: Timestamp of when the table was last processed.
  ts_load:
    lineage:
      - dw_rent.dim_proposal.ts_load
    description: Timestamp of when the table was last processed.
  dti:
    lineage:
    - dw_rent.dim_proposal.dti
    description: Rent-to-Income Ratio (= package_amount / monthly_income_declared)
  monthly_income_declared:
    lineage:
    - dw_rent.dim_proposal.monthly_income_declared
    description: Income declared by proponent, in local currency
  package_amount:
    lineage:
    - dw_rent.dim_proposal.package_amount
    description: Proposal package amount (rent + condo + iptu + insurance), in local currency
