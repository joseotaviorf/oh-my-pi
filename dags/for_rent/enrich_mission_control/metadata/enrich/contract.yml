---
database_name: datalake_mission_control
table_name: contract
owner: gustavo.silva@quintoandar.com.br
domain: For Rent
description: Table that contains the contracts of Mission Control source.
  This table deduplicates the IDs that comes from raw/clean layer due to incremental load.
columns:
  id_contract:
    description: ID of the contract and it's the same of EBDB. It's the primary key of the table.
    lineage:
    - datalake_mission_control_clean.contract.id_contract
  id_house:
    description: ID of the house. It can be joined with the id_house from EBDB.
    lineage:
    - datalake_mission_control_clean.contract.id_house
  id_google_drive:
    description: Google Drive folder identifier storing contract documents in Mission Control.
    lineage:
    - datalake_mission_control_clean.contract.id_google_drive
  id_property_address:
    description: ID of the property's address.
    lineage:
    - datalake_mission_control_clean.contract.id_property_address
  id_mailing_address:
    description: Address record identifier used for mailing correspondence on this rental contract.
    lineage:
    - datalake_mission_control_clean.contract.id_mailing_address
  id_landlord_account:
    description: ID of the landlord's account.
    lineage:
    - datalake_mission_control_clean.contract.id_landlord_account
  id_tenant_account:
    description: ID of the tenant's account.
    lineage:
    - datalake_mission_control_clean.contract.id_tenant_account
  id_landlord_user:
    description: ID user of the landlord. It can be joined with user table from EBDB.
    lineage:
    - datalake_mission_control_clean.contract.landlord_user_id
  id_tenant_user:
    description: ID user of the tenant. It can be joined with user table from EBDB.
    lineage:
    - datalake_mission_control_clean.contract.id_tenant_user
  id_condo_manager:
    description: Identifier of the condominium administrator responsible for the rented property.
    lineage:
    - datalake_mission_control_clean.contract.id_condo_manager
  id_payment_info:
    description: Payment profile identifier used to collect rent charges for this contract.
    lineage:
    - datalake_mission_control_clean.contract.id_info_payment
  id_partner:
    description: "Third-party partner identifier when the lease was originated through a channel partner."
    lineage:
    - datalake_mission_control_clean.contract.id_partner
  id_external:
    description: ID of the EBDB contract. It has the same ID of id_contract column.
    lineage:
    - datalake_mission_control_clean.contract.id_external
  status:
    description: Current workflow status of the rental contract within Mission Control operations.
    lineage:
    - datalake_mission_control_clean.contract.status
  guarantee:
    description: Type of financial guarantee backing the rental contract obligations.
    lineage:
    - datalake_mission_control_clean.contract.guarantee
  condominium_from_account_type:
    description: Account type responsible to pay the condominium.
    lineage:
    - datalake_mission_control_clean.contract.condominium_from_account_type
  iptu_from_account_type:
    description: Account type responsible to pay the IPTU (property tax).
    lineage:
    - datalake_mission_control_clean.contract.iptu_from_account_type
  iptu_to_account_type:
    description: Account type responsible to receive the IPTU (property tax).
    lineage:
    - datalake_mission_control_clean.contract.iptu_to_account_type
  condominium_payer:
    description: Account type responsible to pay the condominium.
    lineage:
    - datalake_mission_control_clean.contract.condominium_payer
  cover_image_url:
    description: HTTPS URL of the listing cover photo associated with this rental contract.
    lineage:
    - datalake_mission_control_clean.contract.cover_image_url
  version:
    description: Optimistic locking revision counter for concurrent update safety.
    lineage:
    - datalake_mission_control_clean.contract.version
  contract_rent_model:
    description: Type of the rental administrator.
    lineage:
    - datalake_mission_control_clean.contract.contract_rent_model
  landlord_transfer_funds_day:
    description: Day of the month when landlord receives the funds.
    lineage:
    - datalake_mission_control_clean.contract.landlord_transfer_funds_day
  tenant_charge_day:
    description: Day of the month when tenant is charged.
    lineage:
    - datalake_mission_control_clean.contract.tenant_charge_day
  condominium_amount:
    description: Monthly condominium fee amount configured on the rental contract.
    lineage:
    - datalake_mission_control_clean.contract.condominium_amount
  brokerage_fee:
    description: Brokerage commission amount charged when the rental contract was signed.
    lineage:
    - datalake_mission_control_clean.contract.brokerage_fee
  iptu_installments:
    description: Number of IPTU (property tax) installments.
    lineage:
    - datalake_mission_control_clean.contract.iptu_installments
  iptu_amount:
    description: IPTU (property tax) value.
    lineage:
    - datalake_mission_control_clean.contract.iptu_amount
  rental_amount:
    description: Rent value.
    lineage:
    - datalake_mission_control_clean.contract.rental_amount
  administration_fee:
    description: Administration fee value (porcentage).
    lineage:
    - datalake_mission_control_clean.contract.administration_fee
  monthly_discount:
    description: Recurring discount subtracted from the monthly rent billing amount.
    lineage:
    - datalake_mission_control_clean.contract.monthly_discount
  home_insurance_amount:
    description: Monthly residential insurance premium amount included in the contract.
    lineage:
    - datalake_mission_control_clean.contract.home_insurance_amount
  can_chat:
    description: Boolean value to check if the landlord/tenant is open to chat.
    lineage:
    - datalake_mission_control_clean.contract.can_chat
  is_auto_igpm:
    description: Boolean value to check if the contract has auto IGPM active.
    lineage:
    - datalake_mission_control_clean.contract.is_auto_igpm
  is_deleted:
    description: Boolean value to check if the record is deleted.
    lineage:
    - datalake_mission_control_clean.contract.is_deleted
  ts_created:
    description: Timestamp of the contract creation.
    lineage:
    - datalake_mission_control_clean.contract.ts_created
  ts_updated:
    description: Timestamp when the register was updated.
    lineage:
    - datalake_mission_control_clean.contract.ts_updated
  ts_last_synced:
    description: Timestamp of the contract's last sync.
    lineage:
    - datalake_mission_control_clean.contract.ts_last_synced
  ts_charge_started:
    description: Timestamp of when the charged started.
    lineage:
    - datalake_mission_control_clean.contract.ts_charge_started
  ts_period_started:
    description: Timestamp of when the period started.
    lineage:
    - datalake_mission_control_clean.contract.ts_period_started
  ts_period_ended:
    description: Timestamp of when the period ended.
    lineage:
    - datalake_mission_control_clean.contract.ts_period_ended
