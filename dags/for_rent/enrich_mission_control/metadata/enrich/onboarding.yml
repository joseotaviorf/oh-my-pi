---
database_name: datalake_mission_control
table_name: onboarding
owner: gustavo.silva@quintoandar.com.br
domain: For Rent
description: Once a contract is signed, an entity Onboarding is created and we can related to the contract from EBDB (Main).
columns:
  id:
    description: ID of the onboarding. It's the primary key of the table.
    lineage:
    - datalake_mission_control_clean.onboarding.id
  id_contract:
    description: ID of the EBDB's contract (Main).
    lineage:
    - datalake_mission_control_clean.onboarding.id_contract
  id_google_drive:
    description: Google Drive folder where onboarding checklist documents are stored.
    lineage:
    - datalake_mission_control_clean.onboarding.id_google_drive
  status:
    description: "Current progress status of the post-signature tenant onboarding workflow."
    lineage:
    - datalake_mission_control_clean.onboarding.status
  property_type:
    description: Dwelling category such as apartment or house for the onboarded listing.
    lineage:
    - datalake_mission_control_clean.onboarding.property_type
  key_location:
    description: Key location of the property.
    lineage:
    - datalake_mission_control_clean.onboarding.key_location
  key_location_details:
    description: Structured details describing where property keys should be returned.
    lineage:
    - datalake_mission_control_clean.onboarding.key_location_details
  version:
    description: Optimistic locking revision counter for concurrent update safety.
    lineage:
    - datalake_mission_control_clean.onboarding.version
  is_deleted:
    description: Boolean flag to check if the onboarding is deleted.
    lineage:
    - datalake_mission_control_clean.onboarding.is_deleted
  ts_created:
    description: Timestamp of the onboarding's creation.
    lineage:
    - datalake_mission_control_clean.onboarding.ts_created
  ts_updated:
    description: Timestmap of the last onboarding's update.
    lineage:
    - datalake_mission_control_clean.onboarding.ts_updated
  ts_last_synced:
    description: Timestamp of the last sync.
    lineage:
    - datalake_mission_control_clean.onboarding.ts_last_synced
