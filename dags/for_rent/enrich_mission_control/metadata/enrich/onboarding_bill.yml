---
database_name: datalake_mission_control
table_name: onboarding_bill
owner: gustavo.silva@quintoandar.com.br
domain: For Rent
description: Table that contains the bills (energy, water, etc)
columns:
  id:
    description: Primary key identifying a utility bill registered during rental onboarding.
    lineage:
    - datalake_mission_control_clean.onboarding_bill.id
  id_address:
    description: Service address identifier where this utility bill applies.
    lineage:
    - datalake_mission_control_clean.onboarding_bill.id_address
  id_onboarding:
    description: Onboarding workflow identifier that groups this utility bill transfer step.
    lineage:
    - datalake_mission_control_clean.onboarding_bill.id_onboarding
  id_supplier:
    description: "ID of the supplier, it can be NULL."
    lineage:
    - datalake_mission_control_clean.onboarding_bill.id_supplier
  id_supplier_city:
    description: Municipality identifier of the utility provider serving this address.
    lineage:
    - datalake_mission_control_clean.onboarding_bill.id_supplier_city
  id_google_drive:
    description: Google Drive folder storing scanned copies of this utility bill.
    lineage:
    - datalake_mission_control_clean.onboarding_bill.id_google_drive
  id_google_drive_file:
    description: ID of the Google's Drive file.
    lineage:
    - datalake_mission_control_clean.onboarding_bill.id_google_drive_file
  status:
    description: Processing status of the utility bill handover during onboarding.
    lineage:
    - datalake_mission_control_clean.onboarding_bill.status
  type:
    description: Utility category such as water, gas, or electricity for this bill record.
    lineage:
    - datalake_mission_control_clean.onboarding_bill.type
  ownership:
    description: The owner's name which is related to the bill.
    lineage:
    - datalake_mission_control_clean.onboarding_bill.ownership
  ownership_cpf:
    description: Owner's CPF (Brazilian Individual Taxpayer Registry) related to the bill.
    lineage:
    - datalake_mission_control_clean.onboarding_bill.ownership_cpf
  installation_code:
    description: Provider installation or consumer unit code printed on the utility bill.
    lineage:
    - datalake_mission_control_clean.onboarding_bill.installation_code
  total_debit:
    description: Debit value left from the bill.
    lineage:
    - datalake_mission_control_clean.onboarding_bill.total_debit
  is_on:
    description: Boolean value if the bill is on.
    lineage:
    - datalake_mission_control_clean.onboarding_bill.is_on
  is_active:
    description: Boolean value if the bill is active.
    lineage:
    - datalake_mission_control_clean.onboarding_bill.is_active
  is_deleted:
    description: Boolean value if the bill is deleted.
    lineage:
    - datalake_mission_control_clean.onboarding_bill.is_deleted
  ts_created:
    description: Timestamp of the bill's creation.
    lineage:
    - datalake_mission_control_clean.onboarding_bill.ts_created
  ts_updated:
    description: Timestamp when the bill was updated.
    lineage:
    - datalake_mission_control_clean.onboarding_bill.ts_updated
