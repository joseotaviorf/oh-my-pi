---
database_name: datalake_rental_listing_metrics
table_name: cohort_listings_20w
description: Metrics associated with the listing opened by weekly cohorts
domain: For Rent
owner: camila.simoes@quintoandar.com.br

columns:
  id_cohort_listing:
    description: Listing record ID in the metrics table by cohort
    lineage:
      - datalake_rental_listing_metrics.cohort_listings_weekly.id_cohort_listing
  city_group:
    description: A grouping of city or clusters of cities and neighborhoods (RMSP - Região Metropolitana de São Paulo).
    lineage:
      - datalake_rental_listing_metrics.cohort_listings_weekly.city_group
  consultant_type:
    description: type of the CIQ
    categories:
      ASP: House has an ASP manager assigned(similar to CIQ Manager)
      CIQ_FULL: House is fully managed by the CIQ
      CIQ_MANAGER: House has a CIQ manager assigned
      Core: Standard agents model
    lineage:
      - datalake_rental_listing_metrics.cohort_listings_weekly.consultant_type
  entry_condition:
    description: How to access the property
    lineage:
      - datalake_rental_listing_metrics.cohort_listings_weekly.entry_condition
  exclusivity:
    description: Definition of the listings exclusivity condition (5A exclusive or not)
    lineage:
      - datalake_rental_listing_metrics.cohort_listings_weekly.exclusivity
  hybrid:
    description: Identifies whether the listing is only available for rent or if it is also for sale
    categories:
      Hibrido: Available for rent and sale
      For Rent: Available for rent only
    lineage:
      - datalake_rental_listing_metrics.cohort_listings_weekly.hybrid
  listing_category_start:
    description: Category that house listing started.
    categories:
      First Listing: The house is being listed for the first time
      Re-Listing: Has had a previous listing
      Recovered: Has had a previous listing and is being listed again after more than 84 days of being unpublished
    lineage:
      - datalake_rental_listing_metrics.cohort_listings_weekly.listing_category_start
  mkt_completion:
    description: Indicates the completion of the flow taxonomy related to the TP/BP.
    categories:
      Full Self-Service: Indicates that the property owner did the full rent flow alone, without contact with the Inside Sales team.
      Non-Self Service: Indicates that the TP/BP went directly to the Inside Sales team (through affiliates, doorman, etc.).
      Not Mapped: Indicates that the TP/BP has an unmapped flow.
      Other: Reflects directly the mkt_flow value.
    lineage:
      - datalake_rental_listing_metrics.cohort_listings_weekly.mkt_completion
  mkt_origin:
    description: Indicates the origin of the listing (or lead)
    lineage:
      - datalake_rental_listing_metrics.cohort_listings_weekly.mkt_origin
  depub_1w:
    description: Number of listings unpublished within 1 week of publication date
    lineage:
      - datalake_rental_listing_metrics.cohort_listings_weekly.depub_w
  imoveis_1w:
    description: Number of listings published within 1 week of publication date
    lineage:
      - datalake_rental_listing_metrics.cohort_listings_weekly.imoveis_w
  list_w_cs_1w:
    description: Number of listings with contract signed within 1 week of publication date
    lineage:
      - datalake_rental_listing_metrics.cohort_listings_weekly.list_w_cs
  suspenso_1w:
    description: Number of listings suspended within 1 week of publication date
    lineage:
      - datalake_rental_listing_metrics.cohort_listings_weekly.suspenso_w
  l2r_1w:
    description: Percentage represented by the ratio between the properties published on the date under analysis that were rented within a period of 1 week after the date of publication by the total number of properties with the date of publication on the date under analysis
    lineage:
      - datalake_rental_listing_metrics.cohort_listings_weekly.l2r_w
  l2s_1w:
    description: Percentage represented by the ratio between the properties suspended on the date under analysis that were rented within a period of 1 week after the date of publication by the total number of properties with the date of publication on the date under analysis
    lineage:
      - datalake_rental_listing_metrics.cohort_listings_weekly.l2s_w
  l2u_1w:
    description: Percentage represented by the ratio between the properties unpublished on the date under analysis that were rented within a period of 1 week after the date of publication by the total number of properties with the date of publication on the date under analysis
    lineage:
      - datalake_rental_listing_metrics.cohort_listings_weekly.l2u_w
  churn_1w:
    description: Number of listings registered as churn within 1 week of publication date
    lineage:
       - datalake_rental_listing_metrics.cohort_listings_weekly.churn_1w
