---
database_name: datalake_rental_listing_metrics
table_name: cohort_listings_weekly
description: Metrics associated with the listing opened by weekly cohorts
domain: For Rent
owner: jonas.fiorini@quintoandar.com.br
columns:
  id_cohort_listing_week:
    lineage:
      - dw_public.dim_house_listing.ts_listing_version_start
      - dw_public.dim_house_listing.listing_category_start
      - datalake_region.region.city_group
      - datalake_rental_historical_follow_up.house_listings_daily_info.is_for_rent
      - datalake_rental_historical_follow_up.house_listings_daily_info.is_for_sale
      - dw_public.fact_house_listing_flows.mkt_completion
      - dw_public.fact_house_listing_flows.mkt_origin
      - datalake_rental_historical_follow_up.house_listings_daily_info.first_key_location
      - datalake_rental_historical_follow_up.house_listings_daily_info.doorman_type
      - datalake_ebdb_clean.occupant_type.name
      - datalake_rental_historical_follow_up.house_listings_daily_info.consultant_type
      - datalake_rental_historical_follow_up.house_listings_daily_info.is_exclusive
    description: Composed ID of the cohort listing and week.
  id_cohort_listing:
    lineage:
      - dw_public.dim_house_listing.ts_listing_version_start
      - dw_public.dim_house_listing.listing_category_start
      - datalake_region.region.city_group
      - datalake_rental_historical_follow_up.house_listings_daily_info.is_for_rent
      - datalake_rental_historical_follow_up.house_listings_daily_info.is_for_sale
      - dw_public.fact_house_listing_flows.mkt_completion
      - dw_public.fact_house_listing_flows.mkt_origin
      - datalake_rental_historical_follow_up.house_listings_daily_info.first_key_location
      - datalake_rental_historical_follow_up.house_listings_daily_info.doorman_type
      - datalake_ebdb_clean.occupant_type.name
      - datalake_rental_historical_follow_up.house_listings_daily_info.consultant_type
      - datalake_rental_historical_follow_up.house_listings_daily_info.is_exclusive
    description: Composed ID of the cohort listing.
  city_group:
    lineage:
      - datalake_region.region.city_group
    description: City group of the house.
  consultant_type:
    lineage:
      - datalake_rental_historical_follow_up.house_listings_daily_info.consultant_type
    description: Indicates the house consultant type.
    categories:
      ASP: House has an ASP manager assigned (similar to CIQ Manager).
      CIQ_FULL: House is fully managed by the CIQ.
      CIQ_MANAGER: House has a CIQ manager assigned.
  entry_condition:
    lineage:
      - datalake_rental_historical_follow_up.house_listings_daily_info.first_key_location
      - datalake_rental_historical_follow_up.house_listings_daily_info.doorman_type
      - datalake_ebdb_clean.occupant_type.name
    description: Indicates how to get in the house.
  exclusivity:
    lineage:
      - datalake_rental_historical_follow_up.house_listings_daily_info.is_exclusive
    description: Indicates if the house is listed exclusively with QuintoAndar.
    categories:
      Exclusivo: Is listed exclusively with QuintoAndar.
      Nao Exclusivo: Is not listed exclusively with QuintoAndar.
  hybrid:
    lineage:
      - datalake_rental_historical_follow_up.house_listings_daily_info.is_for_rent
      - datalake_rental_historical_follow_up.house_listings_daily_info.is_for_sale
    description: Indicates if the listing is only for rent or hybrid.
    categories:
      For Rent: Listing is rent only.
      Hybrid: Listing is for rent and sale.
  listing_category_start:
    lineage:
      - dw_public.dim_house_listing.listing_category_start
    description: Category that house listing started as.
    categories:
      First Listing: Is the first time this house is being published.
      Re-Listing: House was published again after being rented.
      Recovered: House was published after being more than 84 days unpublished.
  mkt_completion:
    lineage:
      - dw_public.fact_house_listing_flows.mkt_completion
    description: The lead's marketing completion as defined by the lead taxonomy.
    categories:
      Full Self-Service: The owner has done the entire listing process through Owner PWA App (including photo job scheduling), with no contact from Inside Sales.
      Non Self-Service: The lead went directly to the Inside Sales team and suffered convertions there.
      Not Mapped: Not mapped completion.
      Other: Other completion.
      Recovered Self-Service: The owner dropped at some point beforing scheduling the photo job, so Inside Sales contacted the owner.
  mkt_origin:
    lineage:
      - dw_public.fact_house_listing_flows.mkt_origin
    description: The lead's marketing origin as defined by the lead taxonomy.
    categories:
      B2B: B2B origin.
      Backend: Backend origin.
      CIQ: CIQ origin.
      Doorman: Doorman origin.
      Inbound: Inbound origin.
      Indica Aí - Agents: Indica Ai Agents program.
      Indica Aí - General: Indica Ai General program.
      Other: Other origin.
      Owner PWA: Owner PWA app origin.
      Price Calculator: Price Calculator origin.
  depub_w:
    lineage:
      - datalake_rental_historical_follow_up.house_listings_daily_info.id_house_listing
    description: Number of unpublished listings weekly.
  imoveis_w:
    lineage:
      - datalake_rental_historical_follow_up.house_listings_daily_info.id_house_listing
    description: Total number of listings weekly.
  list_w_cs_w:
    lineage:
      - datalake_rental_historical_follow_up.house_listings_daily_info.id_house_listing
    description: Number of rented listings weekly.
  suspenso_w:
    lineage:
      - datalake_rental_historical_follow_up.house_listings_daily_info.id_house_listing
    description: Number of suspended listings weekly.
  weeks_since_listing_started:
    description: Number of weeks since the listing started.
  dt_listing_month_started:
    lineage:
      - dw_public.dim_house_listing.ts_listing_version_start
    description: Month when the listing started.
  dt_listing_week_started:
    lineage:
      - dw_public.dim_house_listing.ts_listing_version_start
    description: Week when the listing started.