database_name: datalake_kirk_clean
table_name: ai_inspection_analysis
domain: For Rent
owner: gustavo.silva@quintoandar.com.br
description: |
  Kirk AI inspection analysis results for rental move-out inspections, including identified
  repairs and error payloads when automated analysis fails.
columns:
  id_inspection:
    description: Inspection UUID from the inspection service linked to this Kirk analysis.
    lineage:
      - datalake_kirk_raw.ai_inspection_analysis.external_id
  id_contract:
    description: Rental contract identifier associated with the inspected property.
    lineage:
      - datalake_kirk_raw.ai_inspection_analysis.contract_id
  id_analysis:
    description: Unique Kirk analysis record identifier for this inspection run.
    lineage:
      - datalake_kirk_raw.ai_inspection_analysis.id
  analysis_status:
    description: Processing outcome of the Kirk analysis, such as completed or failed.
    lineage:
      - datalake_kirk_raw.ai_inspection_analysis.analysis_status
  identified_repairs:
    description: JSON payload listing repair items automatically detected by the Kirk model.
    lineage:
      - datalake_kirk_raw.ai_inspection_analysis.identified_repairs
  ts_created:
    description: Timestamp when Kirk registered the AI inspection analysis request.
    lineage:
      - datalake_kirk_raw.ai_inspection_analysis.created_at
  ts_updated:
    description: Timestamp when the analysis record was last modified in Kirk.
    lineage:
      - datalake_kirk_raw.ai_inspection_analysis.updated_at
  error_details:
    description: JSON payload with failure diagnostics when the automated analysis could not finish.
    lineage:
      - datalake_kirk_raw.ai_inspection_analysis.error_details
  model_version:
    description: Kirk computer-vision model version used to score the inspection photos.
    lineage:
      - datalake_kirk_raw.ai_inspection_analysis.model_version
  policy_version:
    description: Business policy ruleset version applied when classifying identified repairs.
    lineage:
      - datalake_kirk_raw.ai_inspection_analysis.policy_version
