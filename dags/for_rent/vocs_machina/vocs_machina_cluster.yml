cluster:
  type: emr_7_12_consolidation_xs_memory_single_node_cluster
  custom_configurations:
    spark_conf:
      # vocs-machina writes its timestamp columns (submitted_at, ts_classified)
      # as pandas datetime64[ns] -> Parquet INT64 (TIMESTAMP(NANOS,true)). Since
      # Spark 3.2 (SPARK-40819) the Parquet reader refuses NANOS and raises
      # [PARQUET_TYPE_ILLEGAL]. This legacy flag restores pre-3.2 behaviour:
      # such columns are read as LongType (nanoseconds since epoch); the spark
      # job then casts them back to TimestampType (see _cast_nanos_timestamps).
      spark.sql.legacy.parquet.nanosAsLong: "true"
