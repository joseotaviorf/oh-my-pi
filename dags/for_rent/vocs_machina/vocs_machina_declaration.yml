dag:
  name: vocs_machina
  schedule_start_date: 2026, 6, 1
  catchup: false
  owner: Data ForRent
  documentation:
    dag_purpose: |
      Ingests daily parquet exports from the vocs-machina LLM classification job
      (Data Science S3) into the raw datalake, then promotes to a Delta clean table
      for Trino and Superset access.

      S3 path pattern: post-contract/vocs-machina/raw/year=*/month=*/day=*/prompt_id=*/prompt_hash=*/
      One row per (feedback_id, prompt_id, prompt_hash) per day. Only finalized partitions are
      ingested: the read is restricted to part-*.parquet, so partial-*.parquet checkpoints from
      an in-progress/crashed vocs-machina partition (no _SUCCESS) are never picked up.

      Scheduling: dataset-driven. Triggered after quintoml.post_contract.vocs_machina.inference
      emits :first-run-of-day. See dags/dependencies.yaml. Each dataset-triggered run scans the
      inclusive calendar window [data_interval_start - 90 days, data_interval_start], matching the
      max backfill_days across active vocs-machina prompts. That window covers the routine forward
      day and any historical partitions quintoml finalized within the prompt backfill horizon, so
      backfill catch-up does not require a separate manual DagRun.

      Manual conf: load_start_date and load_end_date (YYYY-MM-DD, inclusive) in DagRun JSON conf
      override the default window for exceptional cases (e.g. re-ingesting after a clean-table
      incident, or a day older than 90 days before the triggering event). The Spark job reads one day
      per partition, derives year/month/day from the load date, and merges idempotently on
      (feedback_id, prompt_id, prompt_hash, year, month, day) by newest ts_load.

workflow:
  layer: raw
  type: custom_ingestion
  custom_schema: vocs_machina
  load_spark_job: load_vocs_machina_raw
  default_partitions: [year, month, day]
  default_extraction_type: incremental
  # Conservative placeholder (framework default is 2h) — Forno couldn't measure real
  # 90-day-window duration (no test data in Forno's raw bucket); real headroom gets
  # validated from the first post-merge production run against the actual backlog.
  execution_timeout_hours: 4
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, -90), 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"

  spark_job_arguments:
    - "{environment}"
    - "{bucket}"
    - "{schema}"
    - s3://data-science.s3.data.quintoandar.com.br/post-contract/vocs-machina
    - "{load_start_date}"
    - "{load_end_date}"
    - "{table_name}"
    - "{partitions}"
    - parquet

  tables_customization:
    vocs_machina:
      merge_on: [id_feedback, id_prompt, prompt_hash, year, month, day]
      # ts_classified is frozen once vocs-machina finalizes a partition (_SUCCESS marker),
      # so this only updates a row when it's genuinely a different classification, not on
      # every re-scan of the 90-day window. ts_load (ingestion-time, always fresh) would make
      # every matched row look "newer" on every run, forcing a full-window MERGE rewrite daily.
      when_matched_update_condition: source.ts_classified > target.ts_classified
      partitions: [year, month, day]
