database_name: datalake_terminator_clean
table_name: termination_step
description: >
  One row per macro step in the contract termination workflow. Tracks the progression
  through each major stage of the offboarding process for a given termination,
  including step sequencing and timing. Source system is the Terminator service.
domain: For Rent
owner: gustavo.silva@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_terminator_raw.termination_step.id
    description: Primary key uniquely identifying this termination workflow step in the Terminator system.
  id_termination:
    lineage:
      - datalake_terminator_raw.termination_step.termination_id
    description: Foreign key referencing the parent termination record this step belongs to in the Terminator system.
  step:
    lineage:
      - datalake_terminator_raw.termination_step.step
    description: The step in the termination process.
  ts_created:
    lineage:
      - datalake_terminator_raw.termination_step.created_at
    description: The creation timestamp of the termination step.
  ts_updated:
    lineage:
      - datalake_terminator_raw.termination_step.updated_at
    description: The update timestamp of the termination step.
  year:
    lineage:
      - datalake_terminator_raw.termination_step.year
    description: Year extracted from the termination step creation date. Partition column.
  month:
    lineage:
      - datalake_terminator_raw.termination_step.month
    description: Month extracted from the termination step creation date. Partition column.
  day:
    lineage:
      - datalake_terminator_raw.termination_step.day
    description: Day extracted from the termination step creation date. Partition column.
