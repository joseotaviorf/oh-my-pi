database_name: datalake_terminator_clean
table_name: negotiation
description:
  One row per negotiation in the contract termination (offboarding) workflow
  managed by the Terminator service. Tracks step progression, fees, and
  inspection outcomes.
owner: gustavo.silva@quintoandar.com.br
domain: For Rent
columns:
  id:
    lineage:
      - datalake_terminator_raw.negotiation.id
    description: Primary surrogate identifier for the entity row in this support and service dataset.
  id_termination:
    lineage:
      - datalake_terminator_raw.negotiation.termination_id
    description: Identifier for the termination referenced by this record.
  has_landlord_comment:
    lineage:
      - datalake_terminator_raw.negotiation.has_landlord_comment
    description: Boolean flag indicating whether has landlord comment applies to this support service record.
  needs_repair_by_tenant:
    lineage:
      - datalake_terminator_raw.negotiation.needs_repair_by_tenant
    description: Attribute of the termination workflow describing needs repair by tenant.
  repair_resolution:
    lineage:
      - datalake_terminator_raw.negotiation.repair_resolution
    description: Attribute of the termination workflow describing repair resolution.
  repair_cost:
    lineage:
      - datalake_terminator_raw.negotiation.repair_cost
    description: Attribute of the termination workflow describing repair cost.
  tenant_repair_costs_info:
    lineage:
      - datalake_terminator_raw.negotiation.tenant_repair_costs_info
    description: Attribute of the termination workflow describing tenant repair costs info.
  ts_created:
    lineage:
      - datalake_terminator_raw.negotiation.created_at
    description: Timestamp when the record was first created in the upstream source system.
  ts_updated:
    lineage:
      - datalake_terminator_raw.negotiation.updated_at
    description: Timestamp of the most recent update to the record in the upstream source system.
