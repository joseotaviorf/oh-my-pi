database_name: datalake_terminator_clean
table_name: checklist_item
description: The git that a termination is expected to fulfill according to its characteristics.
domain: For Rent
owner: gustavo.silva@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_terminator_raw.checklist_item.id
    description: The ID of the termination checklist_item.
  id_termination:
    lineage:
      - datalake_terminator_raw.checklist_item.termination_id
    description: Identifier for the termination referenced by this record.
  checklist_item:
    lineage:
      - datalake_terminator_raw.checklist_item.name
    description: The name of the checklist.
  is_active:
    lineage:
      - datalake_terminator_raw.checklist_item.active
    description: If de checklit is active.
  is_done:
    lineage:
      - datalake_terminator_raw.checklist_item.done
    description: If the checklist is done.
  ts_created:
    lineage:
      - datalake_terminator_raw.checklist_item.created_at
    description: The creation timestamp of the termination checklist.
  ts_updated:
    lineage:
      - datalake_terminator_raw.checklist_item.updated_at
    description: The update timestamp of the termination checklist.
  month:
    lineage: []
    description: Month partition for incremental loading and partition pruning.
  day:
    lineage: []
    description: Day partition for incremental loading and partition pruning.
  year:
    lineage: []
    description: Year partition for incremental loading and partition pruning.
