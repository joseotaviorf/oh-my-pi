dag:
  name: condominium_payments
  owner: Data ForRent
  schedule_start_date: 2022, 4, 7
  schedule_interval: 0 0 * * *
  documentation:
    dag_purpose: Retrieve data from Condominium Payments database (postgresql) [Condominium Payments](https://github.com/quintoandar/infrastructure /blob/master/vault/database/postgres/prod/condominium-payments-api/main.tf) into data lake. This data comes from Condominium Payments API [Condominium Payments API](https://github.com/quintoandar/condominium-payments-api). Condominium Payments is an API that checks non-payment reports and keeps business rules related to the workflow of condominium-related payments.

workflow:
  type: database_pull_delta
  layer: raw
  database_type: postgres
  lineage_product_database_name: condominium_payments
  tables_customization:
    attachment:
      clean_table_name: attachment
    boleto:
      clean_table_name: invoice
    boleto_aud:
      clean_table_name: invoice_aud
    boleto_issuer:
      clean_table_name: invoice_issuer
    boleto_issuer_aud:
      clean_table_name: invoice_issuer_aud
    boleto_user:
      clean_table_name: invoice_user
    boleto_user_aud:
      clean_table_name: invoice_user_aud
    boleto_user_issuer:
      clean_table_name: invoice_user_issuer
    boleto_user_issuer_aud:
      clean_table_name: invoice_user_issuer_aud
    internalization:
      clean_table_name: internalization
    non_payment_report_invoice:
      clean_table_name: non_payment_report_invoice
    non_payment_report:
      clean_table_name: non_payment_report
    condo_monitoring_actions:
      clean_table_name: condo_monitoring_actions
    condo_monitoring_actions_aud:
      clean_table_name: condo_monitoring_actions_aud
    condo_monitoring_eligibility:
      clean_table_name: condo_monitoring_eligibility
    condo_monitoring_eligibility_aud:
      clean_table_name: condo_monitoring_eligibility_aud
    revinfo:
      clean_table_name: rev_info
cluster:
  type: databricks_12_2_min_memory_photon_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
