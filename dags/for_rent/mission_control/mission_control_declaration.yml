dag:
  name: mission_control
  schedule_start_date: 2021, 2, 20
  schedule_interval: 30 0 * * *
  owner: Data ForRent
  documentation:
    dag_purpose: Extraction and load database mission_control (MySQL) responsible for the onboarding and ongoing journey of our tenants and landlords.
workflow:
  type: cdc
  layer: raw
  custom_schema: mission_control
  database_type: mysql
  source_database: missioncontrol
  source_schema: missioncontrol
  lineage_product_database_name: missioncontrol
  dbutils_secret_key: MISSION_CONTROL_DB
  tables_customization:
    Contract:
      clean_table_name: contract
    ContractPerson:
      clean_table_name: contract_person
    Onboarding:
      clean_table_name: onboarding
    OnboardingAction:
      clean_table_name: onboarding_action
    OnboardingBill:
      clean_table_name: onboarding_bill
    OnboardingTask:
      clean_table_name: onboarding_task
    OnboardingTaskTypes:
      clean_table_name: onboarding_task_types
    User:
      clean_table_name: user
cluster:
  type: databricks_12_2_med_general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
