---
database_name: datalake_mission_control_clean
table_name: onboarding_task
owner: gustavo.silva@quintoandar.com.br
domain: For Rent
description: |
  Tasks that tenants and owners should do when they're in onboarding step.
  These tasks can be an inspection booking, change the bills ownership, etc.
  Due to incremental load, this table contains duplicated IDs.
columns:
  id:
    description: Primary key of an onboarding checklist task in Mission Control.
    lineage:
      - datalake_mission_control_raw.onboardingtask.id
  id_onboarding:
    description: Onboarding workflow identifier that owns this checklist task.
    lineage:
      - datalake_mission_control_raw.onboardingtask.onboarding_id
  id_task_type:
    description: Reference to the template defining the task type and responsible party.
    lineage:
      - datalake_mission_control_raw.onboardingtask.task_type_id
  reference_date_field:
    description: Source column name used as the reference date for metric aggregation.
    lineage:
      - datalake_mission_control_raw.onboardingtask.reference_date_field
  title:
    description: "Human-readable title displayed for this onboarding checklist task."
    lineage:
      - datalake_mission_control_raw.onboardingtask.title
  status:
    description: Completion status of the onboarding task in the operational workflow.
    lineage:
      - datalake_mission_control_raw.onboardingtask.status
  start_offset:
    description: It's related to the start deadline of the task.
    lineage:
      - datalake_mission_control_raw.onboardingtask.start_offset
  end_offset:
    description: It's related to the end deadline of the task.
    lineage:
      - datalake_mission_control_raw.onboardingtask.end_offset
  id_deleted:
    description: Whether the onboarding task record was soft-deleted in Mission Control.
    lineage:
      - datalake_mission_control_raw.onboardingtask.deleted
  dt_started:
    description: Date of when task should initiate.
    lineage:
      - datalake_mission_control_raw.onboardingtask.start_date
  dt_due:
    description: Date limit when the task should be completed.
    lineage:
      - datalake_mission_control_raw.onboardingtask.due_date
  ts_created:
    description: Timestamp of the task's creation.
    lineage:
      - datalake_mission_control_raw.onboardingtask.created_on
  ts_updated:
    description: Timestamp of when the task was updated.
    lineage:
      - datalake_mission_control_raw.onboardingtask.updated_on
  year:
    description: Year integer value of the record's update. Also it's a partition.
    lineage:
      - datalake_mission_control_raw.onboardingtask.year
  month:
    description: Month integer value of the record's update. Also it's a partition.
    lineage:
      - datalake_mission_control_raw.onboardingtask.month
  day:
    description: Day integer value of the record's update. Also it's a partition.
    lineage:
      - datalake_mission_control_raw.onboardingtask.day
