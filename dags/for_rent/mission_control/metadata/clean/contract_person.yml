---
database_name: datalake_mission_control_clean
table_name: contract_person
owner: gustavo.silva@quintoandar.com.br
domain: For Rent
description: Information about users who have an associated contract.
  Each line is a user with their personal information (Name, email, CPF) and their user type,
  as well as information about the type of contract associated with them.
columns:
  id:
    description: ID of the person participating in the contract.
    lineage:
      - datalake_mission_control_raw.contractperson.id
  id_contract:
    description: ID of the contract. It can be joined with dw_rent.dim_contract.
    lineage:
      - datalake_mission_control_raw.contractperson.contract_id
  id_address:
    description: "Address record identifier for the contract participant's registered location."
    lineage:
      - datalake_mission_control_raw.contractperson.address_id
  id_user:
    description: EBDB platform user identifier linking this person to their QuintoAndar account.
    lineage:
      - datalake_mission_control_raw.contractperson.user_id
  contract_type:
    description: ID of the mailing address.
    lineage:
      - datalake_mission_control_raw.contractperson.contract_type
  person_type:
    description: Type of person (TENANT or LANDLORD)
    lineage:
      - datalake_mission_control_raw.contractperson.type
  full_name:
    description: Legal full name of the person participating in the rental contract.
    lineage:
      - datalake_mission_control_raw.contractperson.name
  phone_number:
    description: Primary phone contact for reaching the contract participant.
    lineage:
      - datalake_mission_control_raw.contractperson.phone_number
  document_number:
    description: Government-issued identity document number of the contract person.
    lineage:
      - datalake_mission_control_raw.contractperson.document_number
  is_deleted:
    description: Boolean value to check if the record is deleted.
    lineage:
      - datalake_mission_control_raw.contractperson.deleted
  ts_created:
    description: Timestamp of the contractperson creation.
    lineage:
      - datalake_mission_control_raw.contractperson.created_on
  ts_updated:
    description: Timestamp when the register was updated.
    lineage:
      - datalake_mission_control_raw.contractperson.updated_on
  year:
    description: "Year integer value of the record's update. Also it's a partition."
    lineage:
      - datalake_mission_control_raw.contractperson.year
  month:
    description: "Month integer value of the record's update. Also it's a partition."
    lineage:
      - datalake_mission_control_raw.contractperson.month
  day:
    description: "Day integer value of the record's update. Also it's a partition."
    lineage:
      - datalake_mission_control_raw.contractperson.day
