dag:
  name: firestore
  schedule_start_date: 2021, 09, 20
  schedule_interval: 0 0 * * *
  owner: Data ForRent
workflow:
  layer: raw
  type: custom_ingestion
  load_spark_job: load_firestore_raw
  spark_job_arguments:
  - "{environment}"
  - "{bucket}"
  - "{dag_name}"
  default_extraction_type: incremental
  default_partitions: [year, month, day]
  tables_customization:
    monday:
      extra_spark_job_arguments:
        - mondayBoard-audit-data-engineering-subscription   #subscription_id
        - monday    #table_name
    rent_offer:
      extra_spark_job_arguments:
        - offers-audit-data-engineering-subscription   #subscription_id
        - rent_offer    #table_name
    sale_offer:
      extra_spark_job_arguments:
        - domainSaleOffer-audit-data-engineering-subscription   #subscription_id
        - sale_offer    #table_name
cluster:
  type: custom_cluster
  custom_libraries:
    - pypi:
        package: "google-cloud-pubsub==2.5.0"
    - pypi:
        package: "google-auth==2.23"
  custom_configurations:
    driver_node_type_id: r5d.4xlarge
    node_type_id: r5d.2xlarge
    num_workers: 2
    spark_version: 13.3.x-scala2.12
    aws_attributes:
      availability: ON_DEMAND
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
  databricks_conn_id: databricks_new
