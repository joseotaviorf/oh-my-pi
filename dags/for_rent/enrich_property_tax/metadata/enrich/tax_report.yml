database_name: datalake_property_tax
table_name: tax_report
description: The table represents the yearly IPTU update of a house. It receives the
  last update of a record. We're deduplicating the repeated IDs in this table, because
  our raw/clean DAG makes the ingestion via incremental load.
domain: For Rent
owner: data-for-rent@quintoandar.com.br
columns:
  id:
    lineage:
    - datalake_property_tax_clean.tax_report.id
    description: Unique id that identifies the record of the table itself.
  id_contract_ebdb:
    lineage:
    - datalake_property_tax_clean.tax_report.id_contract_ebdb
    description: Contract ID of ebdb source.
  id_house_ebdb:
    lineage:
    - datalake_property_tax_clean.tax_report.id_house_ebdb
    description: House ID of ebdb source.
  status:
    lineage:
    - datalake_property_tax_clean.tax_report.status
    description: Status of the update
    categories:
      tax-report.status/pending: Update status is pending
      tax-report.status/finished: Update status is finished
  last_year_amount:
    lineage:
    - datalake_property_tax_clean.tax_report.last_year_amount
    description: Last year IPTU value
  year_tax_report:
    lineage:
    - datalake_property_tax_clean.tax_report.year_tax_report
    description: Update year of house's IPTU.
  ts_created:
    lineage:
    - datalake_property_tax_clean.tax_report.ts_created
    description: Record creation date.
  ts_updated:
    lineage:
    - datalake_property_tax_clean.tax_report.ts_updated
    description: Record updated date.
