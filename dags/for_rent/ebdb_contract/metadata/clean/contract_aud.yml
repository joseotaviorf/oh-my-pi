      - datalake_ebdb_raw.contrato_aud.datafimcontratoprevisto_mod
    description: Envers flag indicating whether ts_contract_expected_end changed in this revision.
  mod_dt_termination:
    lineage:
      - datalake_ebdb_raw.contrato_aud.datarescisao_mod
    description: Envers flag indicating whether dt_termination changed in this revision.
  mod_ts_signed:
    lineage:
      - datalake_ebdb_raw.contrato_aud.dataassinado_mod
    description: Envers flag indicating whether ts_signed changed in this revision.
  mod_ts_electronic_contract_sent:
    lineage:
      - datalake_ebdb_raw.contrato_aud.datacontratoeletronicoenviado_mod
    description: Envers flag indicating whether ts_electronic_contract_sent changed in this revision.
  mod_ts_expected_termination:
    lineage:
      - datalake_ebdb_raw.contrato_aud.datarescisaoprevista_mod
    description: Envers flag indicating whether ts_expected_termination changed in this revision.
  mod_is_relisting_enabled:
    lineage:
      - datalake_ebdb_raw.contrato_aud.relistingenabled_mod
    description: Envers flag indicating whether is_relisting_enabled changed in this revision.
  has_home_insurance:
    lineage:
      - datalake_ebdb_raw.contrato_aud.comseguroresidencial
    description: Flag indicating whether home insurance is included at this revision.
  has_contract_amendment:
    lineage:
      - datalake_ebdb_raw.contrato_aud.termoaditivoadicionado
    description: Flag indicating whether an additive contract amendment was added.
  is_relisting_enabled:
    lineage:
      - datalake_ebdb_raw.contrato_aud.relistingenabled
    description: Flag indicating whether early relisting is enabled for this contract.
  dt_entered:
    lineage:
      - datalake_ebdb_raw.contrato_aud.dataentrada
    description: Date when the tenant is scheduled to enter the property at this revision.
  dt_started:
    lineage:
      - datalake_ebdb_raw.contrato_aud.datainicio
    description: Contract start date at this revision.
  ts_contract_expected_end:
    lineage:
      - datalake_ebdb_raw.contrato_aud.datafimcontratoprevisto
    description: Expected contract end timestamp at this revision.
  dt_termination:
    lineage:
      - datalake_ebdb_raw.contrato_aud.datarescisao
    description: Actual contract termination date at this revision.
  ts_signed:
    lineage:
      - datalake_ebdb_raw.contrato_aud.dataassinado
    description: Timestamp when the contract was signed at this revision.
  ts_minuta_approved:
    lineage:
      - datalake_ebdb_raw.contrato_aud.dataminutaaprovada
    description: Timestamp when the contract draft (minuta) was approved.
  ts_electronic_contract_sent:
    lineage:
      - datalake_ebdb_raw.contrato_aud.datacontratoeletronicoenviado
    description: Timestamp when the electronic contract was sent for signature.
  ts_ownership_swapped:
    lineage:
      - datalake_ebdb_raw.contrato_aud.datatrocatitularidade
    description: Timestamp when contract ownership was swapped to a new tenant.
  ts_expected_termination:
    lineage:
      - datalake_ebdb_raw.contrato_aud.datarescisaoprevista
    description: Timestamp when contract termination is expected at this revision.
  ts_fair_fax_start:
    lineage:
      - datalake_ebdb_raw.contrato_aud.fairfaxstartdate
    description: Timestamp when Fairfax home insurance coverage started for this contract.
