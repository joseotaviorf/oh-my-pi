database_name: datalake_ebdb_clean
table_name: portability_aud
description: Hibernate Envers audit history of portability requests from EBDB Portability_AUD. Each row is one revision of a portability record; join rev to user_revision_entity.
domain: For Rent
owner: gustavo.brunelli@quintoandar.com.br
columns:
  id_portability:
    lineage:
      - datalake_ebdb_raw.portability_aud.id
    description: Foreign key to the portability request record being audited at this revision.
  rev:
    lineage:
      - datalake_ebdb_raw.portability_aud.rev
    description: Envers revision id; join to user_revision_entity for the user and timestamp of the change.
  rev_type:
    lineage:
      - datalake_ebdb_raw.portability_aud.revtype
    description: Envers revision type for this audit row (0 create, 1 update, 2 delete).
  dt_contract_ended:
    lineage:
      - datalake_ebdb_raw.portability_aud.contractfinaldate
    description: Existing lease end date at this revision.
  mod_dt_contract_ended:
    lineage:
      - datalake_ebdb_raw.portability_aud.contractfinaldate_mod
    description: Envers flag indicating whether dt_contract_ended changed in this revision.
  contract_observations:
    lineage:
      - datalake_ebdb_raw.portability_aud.contractobservations
    description: Lease observation notes at this revision.
  mod_contract_observations:
    lineage:
      - datalake_ebdb_raw.portability_aud.contractobservations_mod
    description: Envers flag indicating whether contract_observations changed in this revision.
  dt_contract_started:
    lineage:
      - datalake_ebdb_raw.portability_aud.contractstartdate
    description: Existing lease start date at this revision.
  mod_dt_contract_started:
    lineage:
      - datalake_ebdb_raw.portability_aud.contractstartdate_mod
    description: Envers flag indicating whether dt_contract_started changed in this revision.
  current_condo_fee:
    lineage:
      - datalake_ebdb_raw.portability_aud.currentcondofee
    description: Reported condominium fee at this revision.
  mod_current_condo_fee:
    lineage:
      - datalake_ebdb_raw.portability_aud.currentcondofee_mod
    description: Envers flag indicating whether current_condo_fee changed in this revision.
  current_iptu_twelth:
    lineage:
      - datalake_ebdb_raw.portability_aud.currentiptutwelth
    description: Reported monthly IPTU equivalent at this revision.
  mod_current_iptu_twelth:
    lineage:
      - datalake_ebdb_raw.portability_aud.currentiptutwelth_mod
    description: Envers flag indicating whether current_iptu_twelth changed in this revision.
  current_rent:
