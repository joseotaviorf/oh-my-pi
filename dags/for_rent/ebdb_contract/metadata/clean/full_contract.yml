database_name: datalake_ebdb_clean
table_name: full_contract
description: Extended rental contract financial terms from EBDB ContratoFull. One row per contract with administration fees, guarantees, and payment details. Consumed by enrich contract and For Rent billing analytics.
domain: For Rent
owner: gustavo.brunelli@quintoandar.com.br
columns:
  ts_agent_comission_calculated:
    lineage:
      - datalake_ebdb_raw.contratofull.datacalculocomissaocorretor
    description: Timestamp when the real estate agent commission was calculated.
  owner_pay_day_of_month:
    lineage:
      - datalake_ebdb_raw.contratofull.diamespagarproprietario
    description: Day of the month when the owner receives rental payouts.
  rental_guarantee_installment:
    lineage:
      - datalake_ebdb_raw.contratofull.parcelasegurofianca
    description: Number of installments for the rental guarantee premium.
  id:
    lineage:
      - datalake_ebdb_raw.contratofull.id
    description: Surrogate key of the full contract financial record on EBDB.
  dt_discount_ended:
    lineage:
      - datalake_ebdb_raw.contratofull.fimdesconto
    description: End date of any promotional discount on the contract.
  dt_discount_started:
    lineage:
      - datalake_ebdb_raw.contratofull.iniciodesconto
    description: Start date of any promotional discount on the contract.
  discount:
    lineage:
      - datalake_ebdb_raw.contratofull.valordesconto
    description: Promotional discount value applied to the contract.
  responsible_for_iptu:
    lineage:
      - datalake_ebdb_raw.contratofull.responsaveliptu
    description: Party responsible for the IPTU amount on this contract.
  iptu_installment:
    lineage:
      - datalake_ebdb_raw.contratofull.pagtoiptu_parcelas
    description: Number of IPTU payment installments configured.
  iptu:
    lineage:
      - datalake_ebdb_raw.contratofull.pagtoiptu_valor
    description: IPTU payment amount configured on the contract.
  rental_pay_guarantee_installment:
    lineage:
      - datalake_ebdb_raw.contratofull.pagtosegurofianca_parcelas
    description: Number of installments for rental guarantee payments.
  rental_guarantee:
    lineage:
      - datalake_ebdb_raw.contratofull.pagtosegurofianca_valor
    description: Rental guarantee premium value on the contract.
  monthly_administration_fee:
    lineage:
      - datalake_ebdb_raw.contratofull.taxaadministracaomensal
    description: Monthly administration fee as a decimal percentage.
  bank_agency:
    lineage:
      - datalake_ebdb_raw.contratofull.agenciabanco
    description: Bank branch agency number for owner payouts.
  commission:
    lineage:
      - datalake_ebdb_raw.contratofull.comissao
    description: Brokerage commission amount on the contract.
  bank_account:
    lineage:
      - datalake_ebdb_raw.contratofull.contabanco
    description: Bank account number for owner payouts.
  dt_entered:
    lineage:
      - datalake_ebdb_raw.contratofull.dataentrada
    description: Date when the tenant entered the property per the contract.
  dt_ended:
    lineage:
      - datalake_ebdb_raw.contratofull.datafim
    description: Date when the contract ended or is scheduled to end.
  dt_started:
    lineage:
      - datalake_ebdb_raw.contratofull.datainicio
    description: Contract start date for billing and rental terms.
  bank_name:
    lineage:
      - datalake_ebdb_raw.contratofull.nomebanco
    description: Financial institution name where the owner receives contract payouts.
  paying_iptu:
    lineage:
      - datalake_ebdb_raw.contratofull.paganteiptu
    description: Party responsible for making IPTU payments.
  condo_price:
    lineage:
      - datalake_ebdb_raw.contratofull.valorcondominio
    description: Monthly condominium fee amount on the contract.
  value_iptu:
    lineage:
      - datalake_ebdb_raw.contratofull.valoriptu
    description: Monthly IPTU value amount on the contract.
  price_index_type:
    lineage:
      - datalake_ebdb_raw.contratofull.priceindextype
    description: Rent adjustment index type (e.g. IGPM) applied to the contract.
  ts_igpm_notice_sent:
    lineage:
      - datalake_ebdb_raw.contratofull.enviadoavisodeigpmem
    description: Timestamp when the IGPM rent adjustment notice was sent.
  is_auto_igpm:
    lineage:
      - datalake_ebdb_raw.contratofull.autoigpm
    description: Flag indicating whether IGPM adjustment is applied automatically.
  adm_fee_charge_type:
    lineage:
      - datalake_ebdb_raw.contratofull.admfeechargetype
    description: Administration fee charge model applied to the contract.
  promotional_adm_fee:
    lineage:
      - datalake_ebdb_raw.contratofull.promotionaladmfee
    description: Promotional administration fee percentage during a promotional period.
  promotional_period:
    lineage:
      - datalake_ebdb_raw.contratofull.promotionalperiod
    description: Duration in months of the promotional administration fee.
  home_insurance_type:
    lineage:
      - datalake_ebdb_raw.contratofull.homeinsurancetype
    description: Home insurance product type linked to the contract.
  owner_benefit_installment:
    lineage:
      - datalake_ebdb_raw.contratofull.ownerbenefit_parcelas
    description: Number of installments for owner benefit payments.
  owner_benefit:
    lineage:
      - datalake_ebdb_raw.contratofull.ownerbenefit_valor
    description: Owner benefit monetary value on the contract.
  id_last_igpm_adjustment:
    lineage:
      - datalake_ebdb_raw.contratofull.lastigpmadjustment_id
    description: Foreign key to the most recent IGPM adjustment record.
  dt_vacancy:
    lineage:
      - datalake_ebdb_raw.contratofull.vacancydate
    description: Date when the property became vacant under this contract.
  reservation_price:
    lineage:
      - datalake_ebdb_raw.contratofull.reservationvalue
    description: Reservation deposit value held for the contract.
