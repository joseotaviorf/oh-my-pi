---
partition_size: 1024

custom_cluster:
  node_type_id: m5a.2xlarge
  driver_node_type_id: m5a.2xlarge
  num_workers: 3
  spark_conf:
    "spark.sql.shuffle.partitions": "200"
#    "spark.hadoop.fs.s3a.connection.maximum": 480
  cluster_source: "API"
  aws_attributes:
    availability: ON_DEMAND

tables:
  - raw_table_name: assinatura
    clean_table_name: signature
  - raw_table_name: contractnegotiation
    clean_table_name: contract_negotiation
  - raw_table_name: contractpartnershipdata
    clean_table_name: contract_partnership_data
  - raw_table_name: contractversion
    clean_table_name: contract_version
  - raw_table_name: contrato
    clean_table_name: contract
  - raw_table_name: contrato_aud
    clean_table_name: contract_aud
  - raw_table_name: contratofull
    clean_table_name: full_contract
  - raw_table_name: contratopessoa
    clean_table_name: contract_person
  - raw_table_name: contratopessoa_aud
    clean_table_name: contract_person_aud
  - raw_table_name: portability
    clean_table_name: portability
  - raw_table_name: portability_aud
    clean_table_name: portability_aud
  - raw_table_name: workcontract
    clean_table_name: work_contract
