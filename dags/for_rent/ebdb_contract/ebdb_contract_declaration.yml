dag:
  name: ebdb_contract
  schedule_start_date: 2021, 2, 20
  schedule_interval: 10 21,8,12 * * *
  owner: Data ForRent
  documentation:
    dag_purpose: Extraction of EBDB tables related to Contract into data lake. EBDB is the main database for QuintoAndar.
workflow:
  type: cdc
  layer: raw
  custom_schema: ebdb
  database_type: mysql
  source_database: ebdb
  source_schema: ebdb
  tables_customization:
    Contrato_AUD:
      clean_table_name: contract_aud
    ContractNegotiation:
      clean_table_name: contract_negotiation
    ContratoPessoa_AUD:
      clean_table_name: contract_person_aud
    ContratoPessoa:
      clean_table_name: contract_person
    ContractStartDateRequest:
      clean_table_name: contract_start_date_request
    ContractVersion:
      clean_table_name: contract_version
    IGPM:
      clean_table_name: price_index
    ContratoFull:
      clean_table_name: full_contract
    ContratoFull_AUD:
      clean_table_name: full_contract_aud
    Portability_AUD:
      clean_table_name: portability_aud
    Portability:
      clean_table_name: portability
    Assinatura:
      clean_table_name: signature
    WorkContract:
      clean_table_name: work_contract
  extra_query_template_params:
    load_end_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, 1), 'load_end_date') }}"
