dag:
  name: ebdb_contract
  schedule_start_date: 2021, 2, 20
  schedule_interval: 10 21 * * *
  owner: Data ForRent
  documentation:
    dag_purpose: Extraction of EBDB tables related to Contract into data lake. EBDB is the main database for QuintoAndar.
workflow:
  type: cdc
  layer: raw
  custom_schema: ebdb
  database_type: mysql
  source_database: ebdb
  source_schema: ebdb
  tables_customization:
    Contrato_AUD:
      clean_table_name: contract_aud
    ContractNegotiation:
      clean_table_name: contract_negotiation
    ContractPartnershipData:
      clean_table_name: contract_partnership_data
    ContratoPessoa_AUD:
      clean_table_name: contract_person_aud
    ContratoPessoa:
      clean_table_name: contract_person
    ContractStartDateRequest:
      clean_table_name: contract_start_date_request
    ContractVersion:
      clean_table_name: contract_version
    Contrato:
      clean_table_name: contract
    ContratoFull:
      clean_table_name: full_contract
    ContratoFull_AUD:
      clean_table_name: full_contract_aud
    Portability_AUD:
      clean_table_name: portability_aud
    Portability:
      clean_table_name: portability
    Assinatura:
      clean_table_name: signature
    WorkContract:
      clean_table_name: work_contract      
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: m5a.2xlarge
    node_type_id: m5a.xlarge
    num_workers: 3
    spark_version: 13.3.x-scala2.12
    aws_attributes:
        ebs_volume_size: 200
