dag:
  name: dw_offboarding
  schedule_start_date: 2024, 05, 28
  owner: Data ForRent
  criticality: High
  documentation:
    dag_purpose: |
      Dag for the purpose of consulting information related to terminations.
      obt_offboarding used to be built here too; it now lives in the dedicated
      dw_offboarding_obt DAG, which is triggered only after fact_terminations and
      dim_termination finish here, avoiding stale (d-1) OBT reads caused by the two
      DAGs racing without an explicit ordering.

workflow:
  type: query_delta
  layer: dw
  custom_schema: offboarding
  default_extraction_type: incremental
  default_partitions: [year, month, day]
  tables_customization:
    fact_terminations:
      z_order_by: [sk_termination]
      merge_on: [sk_termination]
    dim_termination:
      z_order_by: [sk_termination]
      merge_on: [sk_termination]
    fact_house_listing_terminations:
      z_order_by: [sk_termination]
      extraction_type: full
      partitions: []
