database_name: datalake_ebdb_clean
table_name: suspected_unavailability_listings_aud
description: Audit table for all HSM submissions of sanitization of ongoing listings. This HSM consists in sending a message via Whatsapp to listings potentially unavailable for the visit in ForSale. Each row is a different send .
domain: For Sale
owner: bruna.prates@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_ebdb_raw.SuspectedUnavailabilityListing_AUD.id
    description: Unique identifier of each HSM sent to a listing.
  id_listing_business_context:
    lineage:
      - datalake_ebdb_raw.SuspectedUnavailabilityListing_AUD.id_listing_business_context
    description: Foreign key reffering to the listing business context ID.
  id_house:
    lineage:
      - datalake_ebdb_raw.SuspectedUnavailabilityListing_AUD.house_id
    description: Foreign key referring to the house ID.
  rev:
    lineage:
      - datalake_ebdb_raw.SuspectedUnavailabilityListing_AUD.REV
    description: Revision identifier
  rev_type:
    lineage:
      - datalake_ebdb_raw.SuspectedUnavailabilityListing_AUD.REVTYPE
    description: Revision type
  contact_attempts:
    lineage:
      - datalake_ebdb_raw.SuspectedUnavailabilityListing_AUD.contact_attempts
    description: Number of messages sent by Whatsapp to the listing owner.
  is_confirmed:
    lineage:
      - datalake_ebdb_raw.SuspectedUnavailabilityListing_AUD.listing_confirmed
    description: Boolean indicating whether the owner has responded that the listing is still active and available for sale.
  mod_id_listing_business_context:
    lineage:
      - datalake_ebdb_raw.SuspectedUnavailabilityListing_AUD.id_listing_business_context_MOD
    description: If id_listing_business_context column has modified.
  mod_id_house:
    lineage:
      - datalake_ebdb_raw.SuspectedUnavailabilityListing_AUD.house_id_MOD
    description: If id_house column has modified.
  mod_contact_attempts:
    lineage:
      - datalake_ebdb_raw.SuspectedUnavailabilityListing_AUD.contact_attempts_MOD
    description: If contact_attempts column has modified.
  mod_is_confirmed:
    lineage:
      - datalake_ebdb_raw.SuspectedUnavailabilityListing_AUD.listing_confirmed_MOD
    description: If is_confirmed column has modified.
  mod_ts_last_contact_attempt:
    lineage:
      - datalake_ebdb_raw.SuspectedUnavailabilityListing_AUD.last_contact_attempt_at_MOD
    description: If ts_last_contact_attempt column has modified.
  mod_ts_confirmed:
    lineage:
      - datalake_ebdb_raw.SuspectedUnavailabilityListing_AUD.listing_confirmed_at_MOD
    description: If ts_confirmed column has modified.
  ts_last_contact_attempt:
    lineage:
      - datalake_ebdb_raw.SuspectedUnavailabilityListing_AUD.last_contact_attempt_at
    description: Timestamp o f the last time that Whatsapp has sent a message to the listing owner.
  ts_confirmed:
    lineage:
      - datalake_ebdb_raw.SuspectedUnavailabilityListing_AUD.listing_confirmed_at
    description: Timestamp of the time that the owner has confirmed that the listing is active and available for sale
  ts_created:
    lineage:
      - datalake_ebdb_raw.SuspectedUnavailabilityListing_AUD.created_at
    description: Timestamp of raw has created.
