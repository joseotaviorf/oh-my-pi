---
database_name: datalake_inspection_services_clean
table_name: invoice_discount
description: |
  This table contains the discount evaluation details. Each row represents an evaluation
  on whether to apply a discount or not. Some discounts are applied automatically, while
  others depend on user approval.
domain: For Rent
owner: gustavo.silva@quintoandar.com.br
columns:
  uuid_discount:
    lineage:
      - datalake_inspection_services_raw.invoice_discount.discount_uuid
    description: The discount UUID. It's the primary key.
  id_contract:
    lineage:
      - datalake_inspection_services_raw.invoice_discount.contract_id
    description: The contract ID.
  uuid_inspection:
    lineage:
      - datalake_inspection_services_raw.invoice_discount.inspection_uuid
    description: The inspection UUID.
  id_checkpoint:
    lineage:
      - datalake_inspection_services_raw.invoice_discount.checkpoint_id
    description: |
      The checkpoint ID identifies the customer journey step where the discount was informed/adopted.
    categories:
      REVIEW: Discount applied at the 1st review stage due to disagreement.
      REVIEW_COMPULSORY: Discount applied at the 1st review stage due to lack of response.
      BUDGET_REVIEW: Discount applied at the 2nd review stage due to disagreement.
      BUDGET_REVIEW_COMPULSORY: Discount applied at the 2nd review stage due to lack of response.
      TENANT_AC_REVIEW: Discount applied at the 2nd review stage, offered type (interactive, subject to user approval).
      BUDGET_REVIEW_SINGLE_CLEAR_JOURNEY: Discount applied at the 2nd review stage in the legacy non-priced AR journey.
  discount_type:
    lineage:
      - datalake_inspection_services_raw.invoice_discount.discount_type
    description: Classification of the discount type.
    categories:
      OFFERED_DISCOUNT: Discounts offered to the user for approval.
      AUTOMATIC_BANDAID: Discounts applied automatically.
  inspection_cost:
    lineage:
      - datalake_inspection_services_raw.invoice_discount.inspection_cost
    description: |
      The sum of the cost of all repairs identified, budgeted, and non-exempted in the inspection.
  disputed_inspection_cost:
    lineage:
      - datalake_inspection_services_raw.invoice_discount.disputed_inspection_cost
    description: |
      The sum of the cost of repairs identified, budgeted, non-exempted, and contested by the tenant,
      therefore in dispute.
  discount_value:
    lineage:
      - datalake_inspection_services_raw.invoice_discount.discount_value
    description: The discount value calculated by the system.
  discount_hash:
    lineage:
      - datalake_inspection_services_raw.invoice_discount.discount_hash
    description: The hash of the discount request from Bandaid ML Service.
  discount_value_type:
    lineage:
      - datalake_inspection_services_raw.invoice_discount.discount_value_type
    description: The type of discount value informed by Bandaid ML.
    categories:
      partial: Discount does not cover the total inspection cost or the disputed amount.
      total: Discount covers the total inspection cost or the disputed amount.
      no_discount: Discount application was denied by the system.
  has_tenant_approval:
    lineage:
      - datalake_inspection_services_raw.invoice_discount.tenant_approval
    description: Indicates if the tenant approved the inspection billed amount.
  has_landlord_approval:
    lineage:
      - datalake_inspection_services_raw.invoice_discount.landlord_approval
    description: Indicates if the landlord approved the inspection billed amount.
  has_landlord_repair_request:
    lineage:
      - datalake_inspection_services_raw.invoice_discount.landlord_repair_request
    description: Indicates if the landlord requested a repair.
  is_eviction:
    lineage:
      - datalake_inspection_services_raw.invoice_discount.is_eviction
    description: Indicates if the inspection is an eviction.
  is_spoc:
    lineage:
      - datalake_inspection_services_raw.invoice_discount.is_spoc
    description: Indicates if the context is SPOC.
  is_discount_accepted:
    lineage:
      - datalake_inspection_services_raw.invoice_discount.discount_accepted
    description: Indicates if the discount was accepted or refused.
  discount_reviewed_value:
    lineage:
      - datalake_inspection_services_raw.invoice_discount.discount_reviewed_value
    description: |
      The discount value after restriction evaluations calculated at persist/update time.
      This is the final discount value.
  discount_acceptance_by:
    lineage:
      - datalake_inspection_services_raw.invoice_discount.discount_acceptance_by
    description: Type of client who accepted the discount.
  tenant_cost:
    lineage:
      - datalake_inspection_services_raw.invoice_discount.tenant_cost
    description: Value assigned as the tenant's responsibility.
  company_cost:
    lineage:
      - datalake_inspection_services_raw.invoice_discount.company_cost
    description: Value assigned as QuintoAndar's responsibility.
  landlord_cost:
    lineage:
      - datalake_inspection_services_raw.invoice_discount.landlord_cost
    description: Value assigned as the landlord's responsibility.
  unassigned_cost:
    lineage:
      - datalake_inspection_services_raw.invoice_discount.unassigned_cost
    description: Value whose responsibility has not been defined.
  landlord_receivables:
    lineage:
      - datalake_inspection_services_raw.invoice_discount.landlord_receivables
    description: Value that the landlord should receive.
  exempted_cost:
    lineage:
      - datalake_inspection_services_raw.invoice_discount.exempted_cost
    description: Discount value granted (exempted from payment).
  dt_discount_accepted:
    lineage:
      - datalake_inspection_services_raw.invoice_discount.discount_accepted_at
    description: The date when the discount was accepted or refused.
  ts_created:
    lineage:
      - datalake_inspection_services_raw.invoice_discount.created_at
    description: The creation timestamp.
  ts_updated:
    lineage:
      - datalake_inspection_services_raw.invoice_discount.updated_at
    description: The last update timestamp.
