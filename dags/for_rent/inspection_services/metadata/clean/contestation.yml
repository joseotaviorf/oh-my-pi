---
database_name: datalake_inspection_services_clean
table_name: contestation
description: |
  When an repair of an object is requested and the tenant understand it
  as improper, it is possible to contest the repair request.
domain: For Rent
owner: gustavo.silva@quintoandar.com.br
columns:
  id_contestation:
    lineage:
      - datalake_inspection_services_raw.contestation.id
    description: Auto-incrementing internal ID
  id_repair_request:
    lineage:
      - datalake_inspection_services_raw.contestation.repair_request_id
    description: ID of the repair request being contested by the reviewer (tenant or owner) as improper, unfair, or with a disputed responsibility/cost.
  id_reviewer:
    lineage:
      - datalake_inspection_services_raw.contestation.reviewer_id
    description: Creator of the contestation
  uuid:
    lineage:
      - datalake_inspection_services_raw.contestation.uuid
    description: Auto-incrementing external ID
  comment:
    lineage:
      - datalake_inspection_services_raw.contestation.comment
    description: Contestation description
  reason:
    lineage:
      - datalake_inspection_services_raw.contestation.reason
    description: >
      Reason or justification for the contestation. This is the usable field for why
      the repair was contested.
    categories:
      SAME: Written by the current flow.
      OTHER: Written by the current flow.
      REPAIR_NEGOTIATED: Written by the current flow.
      VALUE_HIGHER_THAN_EXPECTED: Written by the current flow. The enum name alone is not a confirmed product definition.
      DISAGREE: Legacy. Only appears on rows loaded from the historical snapshot, never on rows written by the current flow.
  origin:
    lineage:
      - datalake_inspection_services_raw.contestation.origin
    description: Descriptive information that indicates when the contestation occurred.
    categories:
      REVIEW: If the contestation occurred at the time of review.
      BUDGET_APPROVAL: If the contestation occurred at the time of budget approval process.
  type:
    lineage:
      - datalake_inspection_services_raw.contestation.type
    description: >
      Legacy contestation type. The current flow almost never fills this column, so it
      is not a reliable way to classify contestations. Use reason for the contestation
      motive.
    categories:
      RESPONSIBILITY: Contestation of who is responsible for the repair.
      COST: Contestation of the cost of the repair.
  cost:
    lineage:
      - datalake_inspection_services_raw.contestation.cost
    description: Float type information indicating the disputed value.
  ts_created:
    lineage:
      - datalake_inspection_services_raw.contestation.created_at
    description: Record creation date
  ts_updated:
    lineage:
      - datalake_inspection_services_raw.contestation.updated_at
    description: Record update date
  op_cdc:
    lineage:
      - datalake_inspection_services_raw.contestation.op_cdc
    description: >
      CDC operation captured by Debezium for this row version, appended by the clean
      CDC load. Used to tell an initial snapshot apart from a change written by the
      source system.
    categories:
      r: Read/snapshot - row present at the initial load of the table.
      c: Create - record inserted in the source system.
      u: Update - record modified in the source system.
      d: Delete - record removed in the source system. Not kept as a row here; the CDC merge deletes the matching row instead.
  ts_cdc_transaction:
    lineage:
      - datalake_inspection_services_raw.contestation.ts_cdc_transaction
    description: >
      Timestamp when the CDC connector captured this change event. Drives the
      incremental load window and can be compared against ts_database_transaction to
      measure ingestion lag.
  ts_database_transaction:
    lineage:
      - datalake_inspection_services_raw.contestation.ts_database_transaction
    description: >
      Timestamp of the originating transaction in the source database, before CDC
      propagation. Represents when the change actually happened in the product.
  year:
    lineage:
      - datalake_inspection_services_raw.contestation.year
    description: Year of update date
  month:
    lineage:
      - datalake_inspection_services_raw.contestation.month
    description: Month of update date
  day:
    lineage:
      - datalake_inspection_services_raw.contestation.day
    description: Day of update date
