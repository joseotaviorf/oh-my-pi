---
database_name: datalake_inspection_services_clean
table_name: annotation_aud
description: Audit table for annotations, tracking all changes (insertions, updates, deletions) made to annotation records over time.
domain: For Rent
owner: gustavo.silva@quintoandar.com.br
columns:
  uuid_inspection:
    description: Unique identifier of the inspection (UUID format) that this annotation belongs to.
    lineage:
      - datalake_inspection_services_raw.annotation_aud.inspection_uuid
  rev:
    description: Foreign key of the RevInfo table, which indicates when the record was changed.
    lineage:
      - datalake_inspection_services_raw.annotation_aud.rev
  rev_type:
    description: Indicates whether the line refers to an inclusion, alteration or deletion.
    categories:
      "0": Inclusion operation.
      "1": Alteration operation.
      "2": Deletion operation.
    lineage:
      - datalake_inspection_services_raw.annotation_aud.revtype
  rev_end:
    description: Indicates the end of a revision period for this record.
    lineage:
      - datalake_inspection_services_raw.annotation_aud.revend
  key:
    description: The annotation key that identifies the type or category of the annotation.
    lineage:
      - datalake_inspection_services_raw.annotation_aud.key
  value:
    description: The annotation value containing the actual data or information associated with the key.
    lineage:
      - datalake_inspection_services_raw.annotation_aud.value
  created_by_email:
    description: Email address of the user who created this annotation.
    lineage:
      - datalake_inspection_services_raw.annotation_aud.created_by_email
  mod_ts_created:
    description: Modified timestamp for the creation date, indicating when this field was changed.
    lineage:
      - datalake_inspection_services_raw.annotation_aud.created_at_mod
  mod_ts_updated:
    description: Modified timestamp for the update date, indicating when this field was changed.
    lineage:
      - datalake_inspection_services_raw.annotation_aud.updated_at_mod
  mod_value:
    description: Modified value field, indicating when this field was changed.
    lineage:
      - datalake_inspection_services_raw.annotation_aud.value_mod
  ts_created:
    description: Timestamp when the register was created.
    lineage:
      - datalake_inspection_services_raw.annotation_aud.created_at
  ts_updated:
    description: Timestamp when the register was last updated.
    lineage:
      - datalake_inspection_services_raw.annotation_aud.updated_at
