---
database_name: datalake_inspection_services_clean
table_name: repair_analysis_aud
description: Audit history table for repair analysis records, capturing every state change with Hibernate Envers revision tracking and modified-flag columns.
domain: For Rent
owner: gustavo.silva@quintoandar.com.br
columns:
  id_repair_analysis:
    lineage:
      - datalake_inspection_services_raw.repair_analysis_aud.id
    description: Identifier of the repair analysis record at this revision.
  id_inspection:
    lineage:
      - datalake_inspection_services_raw.repair_analysis_aud.inspection_id
    description: Foreign key referencing the inspection associated with this repair analysis at this revision.
  id_pricing_table_configuration:
    lineage:
      - datalake_inspection_services_raw.repair_analysis_aud.pricing_table_configuration_id
    description: Foreign key referencing the pricing table configuration at this revision. Nullable when no configuration was assigned.
  id_region:
    lineage:
      - datalake_inspection_services_raw.repair_analysis_aud.region
    description: Identifier of the pricing region (city group) at this revision.
  status:
    lineage:
      - datalake_inspection_services_raw.repair_analysis_aud.status
    description: Status of the repair analysis state machine at this revision.
    categories:
      START: Analysis has been initiated and is awaiting processing.
      AI_ANALYSIS: Automated AI analysis is in progress via the Kirk service.
      MANUAL_REPAIR_ANALYSIS: Manual analysis is being performed by a specialist.
      AUTOMATIC_REPAIR_PRICING: Automated pricing is being applied to the identified repairs.
      END: Repair analysis has been completed.
  property_area:
    lineage:
      - datalake_inspection_services_raw.repair_analysis_aud.property_area
    description: Area of the property in square meters at this revision.
  rent_value:
    lineage:
      - datalake_inspection_services_raw.repair_analysis_aud.rent_value
    description: Monthly rent value of the property in BRL at this revision.
  city_group_multiplier:
    lineage:
      - datalake_inspection_services_raw.repair_analysis_aud.city_group_multiplier
    description: Pricing multiplier based on the city group at this revision.
  rent_multiplier:
    lineage:
      - datalake_inspection_services_raw.repair_analysis_aud.rent_multiplier
    description: Pricing multiplier based on the rent value at this revision.
  rev:
    lineage:
      - datalake_inspection_services_raw.repair_analysis_aud.rev
    description: Foreign key of the RevInfo table, indicating when this revision was recorded.
  rev_type:
    lineage:
      - datalake_inspection_services_raw.repair_analysis_aud.revtype
    description: Envers revision type indicating whether this row represents an insertion (0), modification (1), or deletion (2).
  rev_end:
    lineage:
      - datalake_inspection_services_raw.repair_analysis_aud.revend
    description: End revision number for this record version, used by Envers validity audit strategy.
  mod_id_inspection:
    lineage:
      - datalake_inspection_services_raw.repair_analysis_aud.inspection_mod
    description: Boolean flag indicating whether the inspection association was modified in this revision.
  mod_id_pricing_table_configuration:
    lineage:
      - datalake_inspection_services_raw.repair_analysis_aud.pricing_table_configuration_mod
    description: Boolean flag indicating whether the pricing table configuration was modified in this revision.
  mod_status:
    lineage:
      - datalake_inspection_services_raw.repair_analysis_aud.status_mod
    description: Boolean flag indicating whether the status field was modified in this revision.
  mod_id_region:
    lineage:
      - datalake_inspection_services_raw.repair_analysis_aud.region_mod
    description: Boolean flag indicating whether the region field was modified in this revision.
  mod_property_area:
    lineage:
      - datalake_inspection_services_raw.repair_analysis_aud.property_area_mod
    description: Boolean flag indicating whether the property area field was modified in this revision.
  mod_rent_value:
    lineage:
      - datalake_inspection_services_raw.repair_analysis_aud.rent_value_mod
    description: Boolean flag indicating whether the rent value field was modified in this revision.
  mod_city_group_multiplier:
    lineage:
      - datalake_inspection_services_raw.repair_analysis_aud.city_group_multiplier_mod
    description: Boolean flag indicating whether the city group multiplier was modified in this revision.
  mod_rent_multiplier:
    lineage:
      - datalake_inspection_services_raw.repair_analysis_aud.rent_multiplier_mod
    description: Boolean flag indicating whether the rent multiplier was modified in this revision.
  mod_ts_created:
    lineage:
      - datalake_inspection_services_raw.repair_analysis_aud.created_at_mod
    description: Boolean flag indicating whether the created_at timestamp was modified in this revision.
  mod_ts_updated:
    lineage:
      - datalake_inspection_services_raw.repair_analysis_aud.updated_at_mod
    description: Boolean flag indicating whether the updated_at timestamp was modified in this revision.
  ts_created:
    lineage:
      - datalake_inspection_services_raw.repair_analysis_aud.created_at
    description: Timestamp when the repair analysis record was created.
  ts_updated:
    lineage:
      - datalake_inspection_services_raw.repair_analysis_aud.updated_at
    description: Timestamp when the repair analysis record was last updated at this revision.
  year:
    lineage:
      - datalake_inspection_services_raw.repair_analysis_aud.year
    description: Year of the update date, used for partitioning.
  month:
    lineage:
      - datalake_inspection_services_raw.repair_analysis_aud.month
    description: Month of the update date, used for partitioning.
  day:
    lineage:
      - datalake_inspection_services_raw.repair_analysis_aud.day
    description: Day of the update date, used for partitioning.
