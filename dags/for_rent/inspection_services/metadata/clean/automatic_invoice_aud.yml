---
database_name: datalake_inspection_services_clean
table_name: automatic_invoice_aud
description: |
  Audit table containing the history of changes for automatic invoices from the inspection services.
domain: For Rent
owner: gustavo.silva@quintoandar.com.br
columns:
  id_automatic_invoice:
    lineage:
      - datalake_inspection_services_raw.automatic_invoice_aud.id
    description: ID of the table. It's the primary key.
  uuid_inspection:
    lineage:
      - datalake_inspection_services_raw.automatic_invoice_aud.inspection_uuid
    description: UUID of the inspection.
  id_contract:
    lineage:
      - datalake_inspection_services_raw.automatic_invoice_aud.contract_id
    description: ID of the contract.
  rev:
    lineage:
      - datalake_inspection_services_raw.automatic_invoice_aud.rev
    description: Foreign key of the RevInfo table, which indicates when the record was changed.
  rev_end:
    lineage:
      - datalake_inspection_services_raw.automatic_invoice_aud.rev_end
    description: Foreign key of the RevInfo table, which indicates the next revision of the record.
  rev_type:
    lineage:
      - datalake_inspection_services_raw.automatic_invoice_aud.revtype
    description: Indicates whether the line refers to an inclusion, alteration or deletion.
    categories:
      "0": Inclusion operation.
      "1": Alteration operation.
      "2": Deletion operation.
  payment_method:
    lineage:
      - datalake_inspection_services_raw.automatic_invoice_aud.payment_method
    description: Payment method used for the invoice.
  tag:
    lineage:
      - datalake_inspection_services_raw.automatic_invoice_aud.tag
    description: |
      Automatic invoice tag that identifies the invoice generation context.
    categories:
      EARLY_BOTH_AGREE: Owner and tenant agree on the repair budget after the Repair Analysis (AR) stage.
      OFFERED_DISCOUNT: Discount offered to the tenant.
      AUTOMATIC_BANDAID: Discount automatically applied to the tenant.
      BUDGET_APPROVAL_BOTH_AGREE: Owner and tenant agree on the repair budget after the Contestation Analysis (AC) stage.
  tenant_cost:
    lineage:
      - datalake_inspection_services_raw.automatic_invoice_aud.tenant_cost
    description: Amount to be paid by the tenant.
  owner_cost:
    lineage:
      - datalake_inspection_services_raw.automatic_invoice_aud.owner_cost
    description: Amount the owner will receive.
  installments:
    lineage:
      - datalake_inspection_services_raw.automatic_invoice_aud.installments
    description: Number of installments for the payment.
  mod_uuid_inspection:
    lineage:
      - datalake_inspection_services_raw.automatic_invoice_aud.inspection_uuid_mod
    description: Boolean column indicating if the uuid_inspection column has been modified.
  mod_id_contract:
    lineage:
      - datalake_inspection_services_raw.automatic_invoice_aud.contract_id_mod
    description: Boolean column indicating if the id_contract column has been modified.
  mod_payment_method:
    lineage:
      - datalake_inspection_services_raw.automatic_invoice_aud.payment_method_mod
    description: Boolean column indicating if the payment_method column has been modified.
  mod_tag:
    lineage:
      - datalake_inspection_services_raw.automatic_invoice_aud.tag_mod
    description: Boolean column indicating if the tag column has been modified.
  mod_tenant_cost:
    lineage:
      - datalake_inspection_services_raw.automatic_invoice_aud.tenant_cost_mod
    description: Boolean column indicating if the tenant_cost column has been modified.
  mod_owner_cost:
    lineage:
      - datalake_inspection_services_raw.automatic_invoice_aud.owner_cost_mod
    description: Boolean column indicating if the owner_cost column has been modified.
  mod_installments:
    lineage:
      - datalake_inspection_services_raw.automatic_invoice_aud.installments_mod
    description: Boolean column indicating if the installments column has been modified.
  mod_ts_created:
    lineage:
      - datalake_inspection_services_raw.automatic_invoice_aud.created_at_mod
    description: Boolean column indicating if the ts_created column has been modified.
  mod_ts_updated:
    lineage:
      - datalake_inspection_services_raw.automatic_invoice_aud.updated_at_mod
    description: Boolean column indicating if the ts_updated column has been modified.
  ts_created:
    lineage:
      - datalake_inspection_services_raw.automatic_invoice_aud.created_at
    description: Timestamp when the automatic invoice was created.
  ts_updated:
    lineage:
      - datalake_inspection_services_raw.automatic_invoice_aud.updated_at
    description: Timestamp when the record was last updated.