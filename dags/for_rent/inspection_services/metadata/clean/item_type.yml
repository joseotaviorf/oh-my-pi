---
database_name: datalake_inspection_services_clean
table_name: item_type
description: Behind the standardized types of item that we can have within the application.
domain: For Rent
owner: gustavo.silva@quintoandar.com.br
columns:
  id_item_type:
    lineage:
      - datalake_inspection_services_raw.item_type.id
    description: Item Type unique identifier (number)
  id_item_group_type:
    lineage:
      - datalake_inspection_services_raw.item_type.item_group_type_id
    description: Indicates the type of object that has the type of problem
  display_type:
    lineage:
      - datalake_inspection_services_raw.item_type.display_type
    description: Shows the component that renders this type of problem -
    categories:
      COUNTER: Registers the number of parts with problems.
      OPTION_DESCRIPTION: chipchoice with comment option.
      CHECK_DESCRIPTION: checklist option with description.
      CHECK: checklist option.
      OVERVIEW: Displays the overview of the item.
      CHIP_CHOICE_SINGLE: chipchoice with single select option.
      OVERVIEW_WITH_CONDITIONS: overview with option to record conditions.
      DEFAULT: overview with comment option.
  media_type:
    lineage:
      - datalake_inspection_services_raw.item_type.media_type
    description: Media format allowed when documenting this item type problem, such as photos.
    categories:
      PHOTO: images
  type:
    lineage:
      - datalake_inspection_services_raw.item_type.type
    description: >
      Name of what the item question is about. For damage items it is the problem name; for
      non-damage checklist groups it is the subject being asked about — house_supply
      (abastecimento) uses water, gas and electricity. This identifies the question only; the
      inspector's answer is in item_issue and its issue_type.
  number_order:
    lineage:
      - datalake_inspection_services_raw.item_type.order
    description: Defines the display order for the inspector
  is_allow_comments:
    lineage:
      - datalake_inspection_services_raw.item_type.allow_comments
    description: Allows inspector comments
  is_allow_media:
    lineage:
      - datalake_inspection_services_raw.item_type.allow_media
    description: Allows upload of photos of the inspector
  is_deleted:
    lineage:
      - datalake_inspection_services_raw.item_type.deleted
    description: Identifies whether the record is deleted
  is_show_label:
    lineage:
      - datalake_inspection_services_raw.item_type.show_label
    description: Whether to show a descriptive label for this problem type in the inspector UI.
  ts_created:
    lineage:
      - datalake_inspection_services_raw.item_type.created_at
    description: Creation date
  ts_updated:
    lineage:
      - datalake_inspection_services_raw.item_type.updated_at
    description: Update date
  year:
    lineage:
      - datalake_inspection_services_raw.item_type.year
    description: Year of update date.
  month:
    lineage:
      - datalake_inspection_services_raw.item_type.month
    description: Month of update date.
  day:
    lineage:
      - datalake_inspection_services_raw.item_type.day
    description: Day of update date.
