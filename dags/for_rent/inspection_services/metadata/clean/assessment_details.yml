---
database_name: datalake_inspection_services_clean
table_name: assessment_details
description: >-
  EAV (Entity-Attribute-Value) detail records for property inspection assessments. Each row is an
  attribute-value pair for an assessment. Records are immutable; when an optional attribute has no
  value its row does not exist (value is never null). An assessment can have up to 2 review phases,
  each generating up to 3 rows, so a single id_assessment may have up to 6 rows. Currently the only
  type in use is 'MEDIATION'; additional types may be introduced in the future. Filter on
  id_assessment + type together to leverage the source index.
domain: For Rent
owner: gustavo.silva@quintoandar.com.br
columns:
  id_assessment_detail:
    description: "Primary key. Unique auto-generated identifier for each assessment detail record."
    lineage:
      - datalake_inspection_services_raw.assessment_details.id
  id_assessment:
    description: "Foreign key to datalake_inspection_services_clean.assessment. Indexed at the source — always filter together with type."
    lineage:
      - datalake_inspection_services_raw.assessment_details.assessment_id
  type:
    description: "Category of the assessment detail. Indexed at the source. Currently always 'MEDIATION'; additional types may be added in the future."
    lineage:
      - datalake_inspection_services_raw.assessment_details.type
  attribute:
    description: >-
      Attribute name within the given type. For type = 'MEDIATION', possible values are:
      'MEDIATION_REQUIRED' (always present), 'MEDIATION_MOMENT' (always present),
      'MEDIATION_REASON' (optional — row absent when there is no reason to record).
    lineage:
      - datalake_inspection_services_raw.assessment_details.attribute
  value:
    description: >-
      Value of the attribute. Never null. Semantics by attribute:
      - MEDIATION_REQUIRED: 'true' | 'false'
      - MEDIATION_MOMENT: 'FIRST_REVIEW' | 'SECOND_REVIEW'
      - MEDIATION_REASON (non-exhaustive): 'COMPULSORY_OWNER_APPROVAL' (contract is compulsory),
        'BUDGET_APPROVAL_WITHOUT_AUTOMATIC_INVOICE', 'AUTOMATIC_INVOICE_APPLICABLE',
        'EARLY_MEDIATION_REQUIRED'
    lineage:
      - datalake_inspection_services_raw.assessment_details.value
  ts_created:
    description: "Timestamp when the assessment detail record was created in the source system."
    lineage:
      - datalake_inspection_services_raw.assessment_details.created_at
  year:
    description: "Year of the CDC update date, used as partition column."
    lineage:
      - datalake_inspection_services_raw.assessment_details.year
  month:
    description: "Month of the CDC update date, used as partition column."
    lineage:
      - datalake_inspection_services_raw.assessment_details.month
  day:
    description: "Day of the CDC update date, used as partition column."
    lineage:
      - datalake_inspection_services_raw.assessment_details.day
