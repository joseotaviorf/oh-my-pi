---
database_name: datalake_inspection_services_clean
table_name: automatic_invoice
description: This table contains information about the automatic invoices from the inspection services.
domain: For Rent
owner: gustavo.silva@quintoandar.com.br
columns:
  id_automatic_invoice:
    lineage:
      - datalake_inspection_services_raw.automatic_invoice.id
    description: ID of the table. It's the primary key.
  uuid_inspection:
    lineage:
      - datalake_inspection_services_raw.automatic_invoice.inspection_uuid
    description: UUID of the inspection.
  id_contract:
    lineage:
      - datalake_inspection_services_raw.automatic_invoice.contract_id
    description: ID of the contract.
  payment_method:
    lineage:
      - datalake_inspection_services_raw.automatic_invoice.payment_method
    description: Payment method used for the invoice.
  tag:
    lineage:
      - datalake_inspection_services_raw.automatic_invoice.tag
    description: |
      Automatic invoice tag that identifies the invoice generation context.
    categories:
      EARLY_BOTH_AGREE: Owner and tenant agree on the repair budget after the Repair Analysis (AR) stage.
      OFFERED_DISCOUNT: Discount offered to the tenant.
      AUTOMATIC_BANDAID: Discount automatically applied to the tenant.
      BUDGET_APPROVAL_BOTH_AGREE: Owner and tenant agree on the repair budget after the Contestation Analysis (AC) stage.
  tenant_cost:
    lineage:
      - datalake_inspection_services_raw.automatic_invoice.tenant_cost
    description: Amount to be paid by the tenant.
  owner_cost:
    lineage:
      - datalake_inspection_services_raw.automatic_invoice.owner_cost
    description: Amount the owner will receive.
  installments:
    lineage:
      - datalake_inspection_services_raw.automatic_invoice.installments
    description: Number of installments for the payment.
  ts_created:
    lineage:
      - datalake_inspection_services_raw.automatic_invoice.created_at
    description: Timestamp when the automatic invoice was created.
  ts_updated:
    lineage:
      - datalake_inspection_services_raw.automatic_invoice.updated_at
    description: Timestamp when the record was last updated.