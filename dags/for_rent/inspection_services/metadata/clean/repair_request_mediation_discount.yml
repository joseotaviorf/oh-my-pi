---
database_name: datalake_inspection_services_clean
table_name: repair_request_mediation_discount
description: >
  Individual discount lines applied during a repair request mediation process, each representing
  either a global discount (covering the entire mediation) or a per-repair (ITEM) discount linked
  to a specific repair request. One mediation may have multiple discount lines. Consumed by the
  For Rent domain to understand the breakdown of negotiated discounts in repair billing settlements.
domain: For Rent
owner: gustavo.silva@quintoandar.com.br
columns:
  id_repair_request_mediation_discount:
    lineage:
      - datalake_inspection_services_raw.repair_request_mediation_discount.id
    description: Unique internal identifier for the repair request mediation discount line.
  id_repair_request_mediation:
    lineage:
      - datalake_inspection_services_raw.repair_request_mediation_discount.repair_request_mediation_id
    description: Identifier of the mediation this discount line belongs to; foreign key to repair_request_mediation.
  id_repair_request:
    lineage:
      - datalake_inspection_services_raw.repair_request_mediation_discount.repair_request_id
    description: Identifier of the specific repair request this discount applies to; NULL for GLOBAL-scoped discounts.
  uuid:
    lineage:
      - datalake_inspection_services_raw.repair_request_mediation_discount.uuid
    description: Public UUID identifier for this discount line.
  scope:
    lineage:
      - datalake_inspection_services_raw.repair_request_mediation_discount.scope
    description: Scope of the discount — GLOBAL applies to the whole mediation, ITEM applies to a single repair request.
  reason:
    lineage:
      - datalake_inspection_services_raw.repair_request_mediation_discount.reason
    description: Business reason for the discount (e.g. NEGOTIATION), classifying why the discount was granted during mediation.
  discount_currency:
    lineage:
      - datalake_inspection_services_raw.repair_request_mediation_discount.discount_currency
    description: Currency of the discount_amount (e.g. BRL).
  discount_amount:
    lineage:
      - datalake_inspection_services_raw.repair_request_mediation_discount.discount_amount
    description: Monetary value of the discount applied in this line, expressed in discount_currency.
  is_active:
    lineage:
      - datalake_inspection_services_raw.repair_request_mediation_discount.active
    description: Whether this discount line is logically active; false means the line was soft-deleted and excluded from applied totals.
  ts_created:
    lineage:
      - datalake_inspection_services_raw.repair_request_mediation_discount.created_at
    description: Timestamp when this discount line was first created.
  ts_updated:
    lineage:
      - datalake_inspection_services_raw.repair_request_mediation_discount.updated_at
    description: Timestamp of the last update to this discount line record.
  year:
    lineage:
      - datalake_inspection_services_raw.repair_request_mediation_discount.year
    description: Year of update date.
  month:
    lineage:
      - datalake_inspection_services_raw.repair_request_mediation_discount.month
    description: Month of update date.
  day:
    lineage:
      - datalake_inspection_services_raw.repair_request_mediation_discount.day
    description: Day of update date.
