---
database_name: datalake_inspection_services_clean
table_name: issue_type
description: Behind the standardized subtypes of item issues that we can have within the application.
domain: For Rent
owner: gustavo.silva@quintoandar.com.br
columns:
  id_issue_type:
    lineage:
      - datalake_inspection_services_raw.issue_type.id
    description: Issue Type unique identifier (number)
  id_item_type:
    lineage:
      - datalake_inspection_services_raw.issue_type.item_type_id
    description: Indicates the type of problem that has the sub-type of problem
  inspection_type:
    lineage:
      - datalake_inspection_services_raw.issue_type.inspection_type
    description: Inspection type (onboarding, offboarding, verification, or portability) this issue subtype applies to.
  repair_suggestion:
    lineage:
      - datalake_inspection_services_raw.issue_type.repair_suggestion
    description: This column would keep repair suggestions for presentation in the report, but this functionality was not integrated
  responsibility:
    lineage:
      - datalake_inspection_services_raw.issue_type.responsibility
    description: This column would keep the person responsible for the damage, but this functionality was not implemented
  severity:
    lineage:
      - datalake_inspection_services_raw.issue_type.severity
    description: This column would store the degree of severity of data in the objects, but this functionality was not implemented
  type:
    lineage:
      - datalake_inspection_services_raw.issue_type.type
    description: >
      Name of the answer the inspector can select for an item question. For damage items it is the
      problem sub-type; for non-damage checklist groups it is the answer itself — house_supply
      (abastecimento) uses yes, no and it_was_not_possible_to_test to state whether water, gas or
      electricity was on at the visit. Which utility the answer refers to comes from
      item_type.type, reached through item_issue.id_item.
  require_manual_analysis:
    lineage:
      - datalake_inspection_services_raw.issue_type.require_manual_analysis
    description: This column presents whether this issue type needs to undergo a manual assessment
  number_order:
    lineage:
      - datalake_inspection_services_raw.issue_type.order
    description: Defines the display order for the inspector
  is_enabled:
    lineage:
      - datalake_inspection_services_raw.issue_type.enabled
    description: Indicates whether this issue type is enabled for use in inspections.
  is_protected:
    lineage:
      - datalake_inspection_services_raw.issue_type.protected
    description: Indicates whether this issue type is protected from deletion or modification.
  is_deleted:
    lineage:
      - datalake_inspection_services_raw.issue_type.deleted
    description: Identifies whether the record is deleted
  ts_created:
    lineage:
      - datalake_inspection_services_raw.issue_type.created_at
    description: Creation date
  ts_updated:
    lineage:
      - datalake_inspection_services_raw.issue_type.updated_at
    description: Update date
  year:
    lineage:
      - datalake_inspection_services_raw.issue_type.year
    description: Year of update date.
  month:
    lineage:
      - datalake_inspection_services_raw.issue_type.month
    description: Month of update date.
  day:
    lineage:
      - datalake_inspection_services_raw.issue_type.day
    description: Day of update date.
