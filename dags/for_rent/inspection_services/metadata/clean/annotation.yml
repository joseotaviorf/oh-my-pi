---
database_name: datalake_inspection_services_clean
table_name: annotation
description: |
  One row per inspection UUID and annotation key from the inspections-service PostgreSQL database.
  Stores flexible key-value metadata attached to property inspections, mainly feature-rollout and
  A/B test group assignments (for example automatic-repair-pricing eligibility, repair-mediation
  rollout, and single-clear-journey flows). Consumed by dw_inspections and offboarding analytics via
  uuid_inspection joins.
domain: For Rent
owner: gustavo.silva@quintoandar.com.br
columns:
  uuid_inspection:
    description: Unique identifier of the inspection (UUID format) that this annotation belongs to.
    lineage:
      - datalake_inspection_services_raw.annotation.inspection_uuid
  key:
    description: The annotation key that identifies the type or category of the annotation.
    lineage:
      - datalake_inspection_services_raw.annotation.key
  value:
    description: The annotation value containing the actual data or information associated with the key.
    lineage:
      - datalake_inspection_services_raw.annotation.value
  created_by_email:
    description: Email address of the user who created this annotation.
    lineage:
      - datalake_inspection_services_raw.annotation.created_by_email
  ts_created:
    description: Timestamp when the register was created.
    lineage:
      - datalake_inspection_services_raw.annotation.created_at
  ts_updated:
    description: Timestamp when the register was last updated.
    lineage:
      - datalake_inspection_services_raw.annotation.updated_at
