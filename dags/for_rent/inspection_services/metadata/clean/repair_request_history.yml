---
database_name: datalake_inspection_services_clean
table_name: repair_request_history
description: Clean table with the objective of ingesting the historical information of the repair request, coming from the inspection services database.
domain: For Rent
owner: gustavo.silva@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_inspection_services_raw.repair_request_history.id
    description: Unique identification key for the record in the repair request history.
  id_repair_request:
    lineage:
      - datalake_inspection_services_raw.repair_request_history.repair_request_id
    description: Repair request identification key.
  id_reviewer:
    lineage:
      - datalake_inspection_services_raw.repair_request_history.reviewer_id
    description: Reviewer identification key.
  id_granted_by:
    lineage:
      - datalake_inspection_services_raw.repair_request_history.granted_by_id
    description: Reviewer who assessed whether a repair was exempted. Being an owner or member of AN1.
  id_last_reviewer:
    lineage:
      - datalake_inspection_services_raw.repair_request_history.last_reviewer_id
    description: Identification key of the last reviewer of the repair request.
  uuid:
    lineage:
      - datalake_inspection_services_raw.repair_request_history.uuid
    description: Repair Request unique identifier (uuid).
  cost:
    lineage:
      - datalake_inspection_services_raw.repair_request_history.cost_amount
    description: Cost amount in the repair request, sourced from cost_amount in the raw layer.
  cost_currency:
    lineage:
      - datalake_inspection_services_raw.repair_request_history.cost_currency
    description: Currency used in the repair quotation.
    categories:
      ARS: Argentine Peso
      BRL: Brazilian Real
      MXN: Mexican Peso
      PAB: Panamanian Balboa
      PEN: Peruvian Sol
      USD: United States Dollar
  cost_source:
    lineage:
      - datalake_inspection_services_raw.repair_request_history.cost_source
    description: Indicates whether the pricing originated from manual (OPS team) or automatic (InspectionsService).
    categories:
      MANUAL: Manual pricing by OPS team
      AUTOMATIC: Automatic pricing by InspectionsService
  title:
    lineage:
      - datalake_inspection_services_raw.repair_request_history.title
    description: Information about the item linked to the repair request.
  origin:
    lineage:
      - datalake_inspection_services_raw.repair_request_history.origin
    description: Descriptive information indicating at which stage the request arose.
    categories:
      REPAIR_ANALYSIS: Repair analysis stage (AR).
      OWNER_REVIEW: Owner review stage.
      CONTESTATION_ANALYSIS: Contestation analysis stage (AC).
      BUDGET_APPROVAL: Budget approval stage.
  repair_service:
    lineage:
      - datalake_inspection_services_raw.repair_request_history.repair_service
    description: Descriptive information indicating which service was requested in the repair request.
  type:
    lineage:
      - datalake_inspection_services_raw.repair_request_history.type
    description: Type of action requested in the repair request, indicating whether the item should be repaired, cleaned, removed, replaced, or another action (see categories).
    categories:
      REPAIR: Make item repair.
      CLEAN: Clean the item.
      TAKE AWAY: Remove item left in the property.
      GIVE BACK: Replace item that was in the property.
      OTHER: Other types not listed.
  comment:
    lineage:
      - datalake_inspection_services_raw.repair_request_history.comment
    description: Commentary detailing the repair needed.
  responsibility:
    lineage:
      - datalake_inspection_services_raw.repair_request_history.responsibility
    description: Indicates who will be responsible for the repair, as well as whether QuintoAndar will absorb a repair.
  is_from_analysis:
    lineage:
      - datalake_inspection_services_raw.repair_request_history.from_analysis
    description: Indicates whether the repair request was created by AN1.
  is_exempted:
    lineage:
      - datalake_inspection_services_raw.repair_request_history.exempted
    description: Indicates whether the repair suggested by the AN1 team was exempted by the owner or a member of AN1.
  ts_created:
    lineage:
      - datalake_inspection_services_raw.repair_request_history.created_at
    description: Creation date.
  ts_updated:
    lineage:
      - datalake_inspection_services_raw.repair_request_history.updated_at
    description: Update date.
  year:
    lineage:
      - datalake_inspection_services_raw.repair_request_history.year
    description: Year of update date.
  month:
    lineage:
      - datalake_inspection_services_raw.repair_request_history.month
    description: Month of update date.
  day:
    lineage:
      - datalake_inspection_services_raw.repair_request_history.day
    description: Day of update date.
