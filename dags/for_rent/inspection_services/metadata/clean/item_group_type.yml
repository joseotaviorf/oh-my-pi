---
database_name: datalake_inspection_services_clean
table_name: item_group_type
description: It brings the standard types of item group that we can have within the application.
domain: For Rent
owner: gustavo.silva@quintoandar.com.br
columns:
  id_item_group_type:
    lineage:
      - datalake_inspection_services_raw.item_group_type.id
    description: Item Group Type unique identifier
  type:
    lineage:
      - datalake_inspection_services_raw.item_group_type.type
    description: >
      Name of the object or checklist block evaluated in the inspection. Usually a physical object
      (window, door, floor), but also non-physical blocks — house_supply groups the water, gas and
      electricity questions (abastecimento) that the app renders in the general_information room.
      This is the entry point for filtering the item graph down to a specific checklist block.
  review_instruction:
    lineage:
      - datalake_inspection_services_raw.item_group_type.review_instruction
    description: Text that will be displayed on the report for owners and tenants
  is_deletable:
    lineage:
      - datalake_inspection_services_raw.item_group_type.deletable
    description: Identifies whether the record can be deleted via IS
  is_deleted:
    lineage:
      - datalake_inspection_services_raw.item_group_type.deleted
    description: Identifies whether the record is deleted
  is_p3ml:
    lineage:
      - datalake_inspection_services_raw.item_group_type.p3ml
    description: Boolean information indicating whether the item is part of the P3ML (floor, door, wall, furniture and cleaning)
  ts_created:
    lineage:
      - datalake_inspection_services_raw.item_group_type.created_at
    description: Creation date
  ts_updated:
    lineage:
      - datalake_inspection_services_raw.item_group_type.updated_at
    description: Update date
  year:
    lineage:
      - datalake_inspection_services_raw.item_group_type.year
    description: Year of update date.
  month:
    lineage:
      - datalake_inspection_services_raw.item_group_type.month
    description: Month of update date.
  day:
    lineage:
      - datalake_inspection_services_raw.item_group_type.day
    description: Day of update date.
