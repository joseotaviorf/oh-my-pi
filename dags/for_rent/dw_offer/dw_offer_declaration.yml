dag:
  name: dw_offer
  schedule_start_date: 2021,08,02
  owner: Data ForRent
workflow:
  type: query_delta
  layer: dw
  custom_schema: rent
  tables_customization:
    dim_offer:
      partitions: [country_code]
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: r5d.xlarge
    node_type_id: r5d.xlarge
    num_workers: 2
    runtime_engine: PHOTON
    spark_version: 12.2.x-scala2.12
    spark_conf:
      spark.sql.sources.partitionOverwriteMode: static
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
  databricks_conn_id: databricks_new
