  utm_content:
    lineage:
    - datalake_amplitude_clean.170698_offer_submitted_events.up_utm_content
    - datalake_amplitude_clean.170135_offer_submitted_events.up_utm_content
    - datalake_amplitude_clean.183049_offer_submitted_events.up_utm_content
    - datalake_tracked_events.attribution_cross_channel.final_attribution_content
    description: Identifies what specifically was clicked to bring the user to the
      site, such as a banner ad or a text link. It is often used for A/B testing and
      content-targeted ads
  utm_term:
    lineage:
    - datalake_amplitude_clean.170698_offer_submitted_events.up_utm_term
    - datalake_amplitude_clean.170135_offer_submitted_events.up_utm_term
    - datalake_amplitude_clean.183049_offer_submitted_events.up_utm_term
    - datalake_tracked_events.attribution_cross_channel.final_attribution_term
    description: Identifies search terms that brought the lead
  final_attribution_origin:
    lineage:
    - datalake_tracked_events.attribution_cross_channel.final_attribution_origin
