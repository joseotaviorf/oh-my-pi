    - datalake_amplitude_clean.170135_offer_submitted_events.up_utm_medium
    - datalake_amplitude_clean.183049_offer_submitted_events.up_utm_medium
    - datalake_tracked_events.attribution_cross_channel.final_attribution_medium
    description: UTM used to track the advertising medium
