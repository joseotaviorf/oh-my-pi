database_name: dw_public
table_name: dim_offer
description: Tenants make offers to owners when they want to rent the properties.
  If an offer is accepted, it becomes a proposal (see dim_proposal table). Each line
  is an offer
domain: For Rent
owner: sayuri.matsumoto@quintoandar.com.br
columns:
  sk_offer:
    lineage:
    - datalake_offer.offer.id_offer_context
    - datalake_ebdb_proposal.pre_proposal.id_offer_context
    description: key of offer
  id_offer:
    lineage:
    - datalake_offer.offer.id
    - datalake_ebdb_proposal.pre_proposal.id
    description: ID of offer on ebdb
  id_godfather:
    lineage:
    - datalake_offer.offer.id_godfather
    description: ID of godfather database
  id_firestore:
    lineage:
    - datalake_offer.offer.id_firestore
    description: Last value on negotiation
  id_user:
    lineage:
    - datalake_offer.offer.id_client
    - datalake_ebdb_proposal.pre_proposal.id_user
    description: ID of tentant
  id_property:
    lineage:
    - datalake_offer.offer.id_house
    - datalake_ebdb_proposal.pre_proposal.id_house
    description: ID of house
  country_code:
    lineage:
    - datalake_ebdb_proposal.pre_proposal.country_code
    - datalake_offer.offer.country_code
    description: Country code related to the offer's country of origin
    categories:
      BR: Brazil's country code
      MX: Mexico's country code
  editing:
    lineage:
    - datalake_offer.offer.turn
    - datalake_ebdb_proposal.pre_proposal.edition
    description: Who's turn of editing the offer
    categories:
      EdicaoInquilino: Waiting the tenant's turn to make an edit to the offer
      EdicaoProprietario: Waiting the owner's turn to make an edit to the offer
      Finalizado: Edits are finalized
      Owner: Waiting the owner's turn to make an edit to the offer
      Tenant: Waiting the tenant's turn to make an edit to the offer
  status:
    lineage:
    - datalake_offer.offer.status
    - datalake_ebdb_proposal.pre_proposal.status
    description: Offer status
    categories:
      Aprovada: Offer approved by the owner
      EmNegociacao: Offer still in negotiation
      Rejeitada: Offer rejected by the owner
  rejection_reason:
    lineage:
    - datalake_offer.offer.rejection_reason
    - datalake_ebdb_proposal.pre_proposal.rejection_reason
    description: Reason which offer was rejected
    categories:
      HouseReserved: The house was reserved by another tenant, dropping all other
        offers for the same house
      NDA: ''
      OwnerCustomReason: ''
      OwnerDoesntAcceptPets: ''
      OwnerDoesntAgreeNumberOfResidents: ''
      OwnerDoesntAgreeWithConditions: ''
      OwnerDoesntAgreeWithValue: ''
      OwnerGaveUpRenting: ''
      OwnerHasOtherOngoingFlows: ''
      OwnerMissedLimitReached: ''
      OwnerRejected: ''
      OwnerRentedForAnotherTenant5A: The owner ended up renting for another QuintoAndar
        tenant
      OwnerRentedForAnotherTenantOutside: The owner ended up renting for another tenant
        outside of QuintoAndar
      OwnerSoldHouse: The owner sold the house
      OwnerStalled: ''
      PropertyRented5A: ''
      StartOffer: ''
      TenantDoesntAgreeWithConditions: ''
      TenantDoesntAgreeWithValue: ''
      TenantGaveUpApartment: ''
      TenantGaveUpRenting: ''
      TenantRejected: ''
      TenantRented5A: ''
      TenantRentedAnother5A: ''
      TenantRentedAnotherOutside: ''
      TenantStalled: ''
      UnpublishedHouse: ''
  type:
    lineage:
    - datalake_offer.offer.type
    description: type of offer that was made
    categories:
      Custom: 'When the tenant asks the owner to make changes to the property of any
        type (example: painting, removing furniture, doing renovations, etc.)'
      Express: When the tenant accepts the price and all conditions asked by the owner
        and makes no other requests
      Other: ''
      Price: When the tenant accepts all the conditions asked by the owner but wants
        to negotiate the rental price
  app_type:
    lineage:
    - datalake_amplitude_clean.170698_offer_submitted_events.up_app_type
    - datalake_amplitude_clean.170135_offer_submitted_events.up_app_type
    - datalake_amplitude_clean.183049_offer_submitted_events.up_app_type
    - datalake_tracked_events.attribution_cross_channel.final_attribution_app_type
    description: Amplitude's app type
    categories:
      amp: ''
      android: ''
      android_flutter: '#N/A'
      ios: ''
      web_desktop: ''
      web_mobile: ''
  utm_source:
    lineage:
    - datalake_amplitude_clean.170698_offer_submitted_events.up_utm_source
    - datalake_amplitude_clean.170135_offer_submitted_events.up_utm_source
    - datalake_amplitude_clean.183049_offer_submitted_events.up_utm_source
    - datalake_tracked_events.attribution_cross_channel.final_attribution_source
