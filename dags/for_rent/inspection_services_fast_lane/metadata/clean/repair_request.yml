---
database_name: datalake_inspection_services_clean
table_name: repair_request
description:
  This table provides information on repair requests after the inspection
  process.
domain: For Rent
owner: gustavo.silva@quintoandar.com.br
columns:
  id_repair_request:
    lineage:
      - datalake_inspection_services_raw.repair_request.id
    description: Repair Request unique identifier (number)
  id_reviewer:
    lineage:
      - datalake_inspection_services_raw.repair_request.reviewer_id
    description: Author of repair request
  id_main:
    lineage:
      - datalake_inspection_services_raw.repair_request.main_id
    description: Item id in Main monolith
  responsibility:
    lineage:
      - datalake_inspection_services_raw.repair_request.responsibility
    description: Indicates who will be responsible for the repair, as well as whether QuintoAndar will absorb a repair
  id_item_group:
    lineage:
      - datalake_inspection_services_raw.repair_request.item_group_id
    description: Object that will need repairs
  id_granted_by:
    lineage:
      - datalake_inspection_services_raw.repair_request.granted_by_id
    description:
      Reviewer who assessed whether a repair was exempted. Being an owner
      or member of AN1
  id_repair_suggestion:
    lineage:
      - datalake_inspection_services_raw.repair_request.repair_suggestion_id
    description: Repair suggestion identification key.
  uuid:
    lineage:
      - datalake_inspection_services_raw.repair_request.uuid
    description: Repair Request unique identifier (uuid)
  type:
    lineage:
      - datalake_inspection_services_raw.repair_request.type
    description: >
      Cause or nature of the item identified on the inspection report. It is not a
      closed enum of process actions (repair, clean, take away, give back, other),
      and values are written with underscores. The column is open-ended, holding
      dozens of distinct values. The ten most frequent on
      dw_inspections.dim_repair_request are PREEXISTING, OTHER, REPAIR,
      MALFUNCTIONING, LACK_OF_MAINTENANCE, DIRT, STRUCTURAL_DAMAGE, ABSENT_ITEM,
      MILD_DAMAGE and STRUCTURAL_MOISTURE. Query the column for the full current
      list before relying on any fixed set of values.
  comment:
    lineage:
      - datalake_inspection_services_raw.repair_request.comment
    description: Commentary detailing the repair needed
  repair_service:
    lineage:
      - datalake_inspection_services_raw.repair_request.repair_service
    description: Service provider or company responsible for performing the repair work
  title:
    lineage:
      - datalake_inspection_services_raw.repair_request.title
    description: Title or name describing the repair request and its purpose
  cost:
    lineage:
      - datalake_inspection_services_raw.repair_request.cost_amount
    description: Cost of a repair. This value is assigned exclusively by QuintoAndar through manual pricing and automatic pricing steps
  cost_currency:
    lineage:
      - datalake_inspection_services_raw.repair_request.cost_currency
    description: Currency used in the repair quotation
    categories:
      ARS: Argentine Peso
      BRL: Brazilian Real
      MXN: Mexican Peso
      PAB: Panamanian Balboa
      PEN: Peruvian Sol
      USD: United States Dollar
  cost_source:
    lineage:
      - datalake_inspection_services_raw.repair_request.cost_source
    description: Indicates whether the pricing originated from manual (OPS team) or automatic (InspectionsService)
    categories:
      MANUAL: Manual pricing by OPS team
      AUTOMATIC: Automatic pricing by InspectionsService
  is_exempted:
    lineage:
      - datalake_inspection_services_raw.repair_request.exempted
    description:
      Indicates whether the repair suggested by the AN1 team was exempted
      by the owner or a member of AN1
  is_exempted_from_budget:
    lineage:
      - datalake_inspection_services_raw.repair_request.is_exempted_from_budget
    description: Boolean information indicating whether the exemption occurred at the budget approval stage.
  is_from_analysis:
    lineage:
      - datalake_inspection_services_raw.repair_request.from_analysis
    description: Indicates whether the repair request was created by AN1
  is_finished:
    lineage:
      - datalake_inspection_services_raw.repair_request.finished
    description: Indicates whether the repair request was reviewed and finalized by an admin during the contestation analysis (AC) stage. In the source system it is set to true only when an admin updates the repair while the inspection is in contestation analysis; repairs that never reach that stage stay false. Despite the name, it does not mean the physical repair was completed.
  has_automatically_identified:
    lineage:
      - datalake_inspection_services_raw.repair_request.automatically_identified
    description: |
      Boolean indicating whether this repair request was automatically drafted from inspector
      tags (tag-based flow). This flow predates Kirk and is unrelated to Kirk's
      AI-based repair report creation and to repair pricing automation.
  has_automatic_identification_accepted:
    lineage:
      - datalake_inspection_services_raw.repair_request.automatic_identification_accepted
    description: |
      Boolean indicating whether the automatically drafted repair request (from the
      tag-based flow) was accepted. This flow predates Kirk and is unrelated to Kirk's
      AI-based repair report creation and to repair pricing automation.
  ts_granted:
    lineage:
      - datalake_inspection_services_raw.repair_request.granted_at
    description:
      Indicates the time at which the repair request exempted assessment
      was made
  ts_created:
    lineage:
      - datalake_inspection_services_raw.repair_request.created_at
    description: Creation date
  ts_updated:
    lineage:
      - datalake_inspection_services_raw.repair_request.updated_at
    description: Update date
  op_cdc:
    lineage:
      - datalake_inspection_services_raw.repair_request.op_cdc
    description: >
      CDC operation captured by Debezium for this row version, appended by the clean
      CDC load. Used to tell an initial snapshot apart from a change written by the
      source system.
    categories:
      r: Read/snapshot - row present at the initial load of the table.
      c: Create - record inserted in the source system.
      u: Update - record modified in the source system.
      d: Delete - record removed in the source system. Not kept as a row here; the CDC merge deletes the matching row instead.
  ts_cdc_transaction:
    lineage:
      - datalake_inspection_services_raw.repair_request.ts_cdc_transaction
    description: >
      Timestamp when the CDC connector captured this change event. Drives the
      incremental load window and can be compared against ts_database_transaction to
      measure ingestion lag.
  ts_database_transaction:
    lineage:
      - datalake_inspection_services_raw.repair_request.ts_database_transaction
    description: >
      Timestamp of the originating transaction in the source database, before CDC
      propagation. Represents when the change actually happened in the product.
  year:
    lineage:
      - datalake_inspection_services_raw.repair_request.year
    description: Year of update date.
  month:
    lineage:
      - datalake_inspection_services_raw.repair_request.month
    description: Month of update date.
  day:
    lineage:
      - datalake_inspection_services_raw.repair_request.day
    description: Day of update date.
