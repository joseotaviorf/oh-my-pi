---
database_name: datalake_gsheets_clean
table_name: ongoing_listings_target
columns:
  business_context:
    description: Business context of the listing.
    lineage:
      - datalake_gsheets_raw.ongoing_listings_targets.business_context
  city_group:
    description: City group of the listing.
    lineage:
      - datalake_gsheets_raw.ongoing_listings_targets.city_group
  rental_administrator:
    description: Rental administrator of the listing.
    lineage:
      - datalake_gsheets_raw.ongoing_listings_targets.rental_administrator
  depublications:
    description: Volume of despublciations.
    lineage:
      - datalake_gsheets_raw.ongoing_listings_targets.depublications
  ongoing_listings:
    description: Volume of ongoing listings (listings with "PUBLISHED" status).
    lineage:
      - datalake_gsheets_raw.ongoing_listings_targets.ongoing_listings
  recovered:
    description: Volume of recovered listings (listings returning from "UNPUBLISHED" status after more then 12 weeks with such status).
    lineage:
      - datalake_gsheets_raw.ongoing_listings_targets.recovered
  relisting:
    description: Volume of relistings (listings returning to "PUBLISHED" status after a rental).
    lineage:
      - datalake_gsheets_raw.ongoing_listings_targets.relisting
  suspensions:
    description: Volume of suspended listings.
    lineage:
      - datalake_gsheets_raw.ongoing_listings_targets.suspensions
  ended_rentals:
    description: Volume of contracts with end date (dt_annulment) in the target date.
    lineage:
      - datalake_gsheets_raw.ongoing_listings_targets.ended_rentals
  erc:
    description: Volume of contracts with end confirmation (ts_analyst_annulment_input) in the target date.
    lineage:
      - datalake_gsheets_raw.ongoing_listings_targets.erc
  ongoing_rentals:
    description: Volume of ongoing contracts in the target date (New Rental date <= Target date < Ended Rental date)
    lineage:
      - datalake_gsheets_raw.ongoing_listings_targets.ongoing_rentals
  new_rental:
    description: Volume of contracts not canceled with term starting or entrance date in the target date.
    lineage:
      - datalake_gsheets_raw.ongoing_listings_targets.new_rental
  new_first_rental:
    description: Volume of first property contracts not canceled with term starting or entrance date in the target date.
    lineage:
      - datalake_gsheets_raw.ongoing_listings_targets.new_first_rental
  dt_created:
    description: Target date.
    lineage:
      - datalake_gsheets_raw.ongoing_listings_targets.date
