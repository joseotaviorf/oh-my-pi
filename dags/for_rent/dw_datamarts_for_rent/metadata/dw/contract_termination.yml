database_name: dw_datamarts_for_rent
table_name: contract_termination
description: ''
domain: For Rent
owner: ''
columns:
  sk_termination:
    lineage:
    - datalake_terminator_clean.termination.id
    description: The key tocontract termination.
  sk_contract:
    lineage:
    - datalake_terminator_clean.termination.id_contract
    description: The key to contract.
  sk_exit_inspection:
    lineage:
    - datalake_terminator_clean.termination.id_exit_inspection
    description: The key for the completed exit inspection for the ending contract.
  sk_house_listing:
    lineage:
    - dw_public.fact_house_listings.sk_house_listing
    description: The key of house listing.
  sk_region:
    lineage:
    - dw_public.fact_house_listings.sk_region
    description: Key to identify the region associated with the termination.
  sk_application_user:
    lineage:
    - datalake_terminator_clean.application_user.id_external
  sk_workflow_assignee:
    lineage:
    - datalake_terminator_clean.termination_workflow.id_current_assignee
    description: User ID of the person assigned to the thermination workflow.
  reason:
    lineage:
    - datalake_terminator_clean.termination.feedback
    description: The reason for the termination.
    categories:
      DISLIKES_QUINTOANDAR: ''
      JOB_TRANSFER: ''
      MOVING_OWN_HOUSE: ''
      MOVING_TO_FRIENDS_OR_FAMILY: ''
      NEEDS_CHANGE: ''
      OPT_OUT: ''
      OTHER: ''
      OWNER_LEAVING_QUINTOANDAR: ''
      OWNER_MOVING_IN: ''
      OWNER_SELLING: ''
      PERSONAL_MATTERS: ''
      PROBLEMS_WITH_HOUSE: ''
      RENT_INCREASED: ''
  feedback:
    lineage:
    - datalake_terminator_clean.termination.feedback
    description: Contains more information about the termination, like churn info
      and the next destination of the tenant.
  requested_by:
    lineage:
    - datalake_terminator_clean.termination.requested_by
    description: The client who created the termination request.
    categories:
      LANDLORD: ''
      TENANT: ''
  status:
    lineage:
    - datalake_terminator_clean.termination.status
    description: Current status of the termination request.
    categories:
      CANCELED: ''
      DONE: ''
      INSPECTION_CANCELED: ''
      INSPECTION_CONFIRMED: ''
      INSPECTION_FINISHED: ''
      INSPECTION_SCHEDULED: ''
      INSPECTION_UNDER_REVIEW: ''
      REQUESTED: ''
  source:
    lineage:
    - datalake_terminator_clean.termination.source
    description: Defines where the termination was requested.
  cancellation_info:
    lineage:
    - datalake_terminator_clean.termination.cancellation_info
    description: Termination cancellation details.
  rescheduling_history:
    lineage:
    - datalake_terminator_clean.termination.rescheduling_history
    description: Termination date alteration details.
  churn_reason:
    lineage:
    - datalake_terminator_clean.termination.feedback
    description: Reason for the tenant leaving 5A.
    categories:
      BUDGET: ''
      QUINTOANDAR: ''
      NO_MATCHES: ''
      UNCOVERED_REGION: ''
  next_property:
    lineage:
    - datalake_terminator_clean.termination.feedback
    description: Tenants next rental.
    categories:
      DIRECTLY_WITH_OWNER: ''
      FRIENDS_OR_FAMILY: ''
      NOT_DECIDED: ''
      OTHER_REAL_ESTATE_AGENCY: ''
      QUINTOANDAR: ''
  property_issue:
    lineage:
    - datalake_terminator_clean.termination.feedback
    description: Issue related to the property.
    categories:
      ELECTRICAL: ''
      INFILTRATION: ''
      INTERNET: ''
      NEIGHBORHOOD: ''
      OTHER: ''
      OWNER: ''
      UTILITIES: ''
  b2b_type:
    lineage:
    - dw_public.dim_contract.b2b_type
    description: Type of B2B partner.
  b2b_prime_type:
    lineage:
    - dw_public.dim_contract.b2b_prime_type
    description: Type of B2B prime partner.
  workflow_current_step:
    lineage:
    - datalake_terminator_clean.termination_workflow.current_step
    description: Terminator internal status indicating the workflow evolution.
  tenant_key_location:
    lineage:
    - datalake_terminator_clean.termination.tenant_keys_location
    description: Tenant keys location to be found by inspection.
    categories:
      GATEHOUSE: ''
      LOCKBOX: ''
      OTHER: ''
      PERSON: ''
      UNINFORMED: ''
  tenant_key_detail:
    lineage:
    - datalake_terminator_clean.termination.tenant_keys_location
    description: Details about where the tenant left the keys after leaving the property.
  owner_key_detail:
    lineage:
    - datalake_terminator_clean.termination.owner_keys_location
    description: Details on the delivery of the tenant's keys to the owner after the
      inspection.
  repair_resolution:
    lineage:
    - datalake_terminator_clean.negotiation.repair_resolution
    description: Indication of how the repair was made.
    categories:
      FINANCIAL_DEAL: ''
      FORGIVEN_BY_LANDLORD: ''
      NO_REPAIR_NEEDED: ''
      PROTECTION_5A: ''
      REIMBURSED_BY_5A: ''
      REPAIRED_BY_5A: ''
      TENANT_DUTY: ''
  repair_cost:
    lineage:
    - datalake_terminator_clean.negotiation.repair_cost
    description: ''
  utility_bill_info:
    lineage:
    - datalake_terminator_clean.termination.utility_bill_info
    description: Information collected on Workflow indicating the landlord choice
      for consumption bills after termination.
  completed_utility_attachments:
    lineage:
    - datalake_terminator_clean.utility_bill.type
  pending_utility_attachments:
    lineage:
    - datalake_terminator_clean.utility_bill.type
  utility_bill_in_condominium:
    lineage:
    - datalake_terminator_clean.utility_bill.type
  application_user_name:
    lineage:
    - datalake_terminator_clean.application_user.name
  application_user_email:
    lineage:
    - datalake_terminator_clean.application_user.email
  fee_discount_percentage:
    lineage:
    - datalake_terminator_clean.termination_fee_negotiation.discount_percentage
  fee_discount_value:
    lineage:
    - datalake_terminator_clean.termination_fee_negotiation.discount_value
  fee_final_amount:
    lineage:
    - datalake_terminator_clean.termination_fee_negotiation.final_amount
  fee_number_of_installments:
    lineage:
    - datalake_terminator_clean.termination_fee_negotiation.number_of_installments
  fee_payment_option:
    lineage:
    - datalake_terminator_clean.termination_fee_negotiation.payment_option
  fee_negotiation_status:
    lineage:
    - datalake_terminator_clean.termination_fee_negotiation.status
  is_b2b:
    lineage:
    - dw_public.dim_contract.is_b2b
    description: Boolean to indicate if the contract is in a B2B partner.
  has_automatically_closed_task:
    lineage:
    - datalake_terminator_clean.termination_workflow.has_automatically_closed_task
  has_exit_inspection:
    lineage:
    - datalake_terminator_clean.termination.has_exit_inspection
    description: Information collected on Workflow, boolean to indicate if the owner
      exempted the inspection.
  has_repairs:
    lineage:
    - datalake_terminator_clean.negotiation.has_landlord_comment
    description: Boolean to flag presence of comments made by owner on the exit inspection.
  is_repair_tenant_duty:
    lineage:
    - datalake_terminator_clean.negotiation.needs_repair_by_tenant
    description: Boolean to flag if there is repairs that must be done by the tenant.
  is_relisting:
    lineage:
    - datalake_terminator_clean.termination.is_relisting
    description: Information collected on workflow, where the owner can opt-out the
      relisting, but the default value is true.
  dt_termination:
    lineage:
    - datalake_terminator_clean.termination.dt_termination
    description: The date set by the requester to end the contract.
  dt_last_rescheduled:
    lineage:
    - datalake_terminator_clean.termination_aud.ts_updated
    description: The date when the dt_termination were reschedule for the last time.
  dt_last_inspection_synched:
    lineage:
    - dw_public.fact_inspection_bookings.sk_inspected_date
  dt_negotiation_updated:
    lineage:
    - datalake_terminator_clean.negotiation.ts_updated
    description: The date when details from phase 2 (repairs or end of termination)
      were updated by analyst.
  ts_fee_negotiation_created:
    lineage:
    - datalake_terminator_clean.termination_fee_negotiation.ts_created
  ts_fee_negotiation_updated:
    lineage:
    - datalake_terminator_clean.termination_fee_negotiation.ts_updated
  ts_created:
    lineage:
    - datalake_terminator_clean.termination.ts_created
    description: The timestamp when the termination was requested.
  ts_canceled:
    lineage:
    - datalake_terminator_clean.termination.ts_canceled
    description: The timestamp when termination was canceled (if canceled).
  ts_termination_finished:
    lineage:
    - datalake_terminator_clean.negotiation.ts_updated
    - datalake_terminator_clean.termination_aud.ts_updated
    description: ''
  ts_updated:
    lineage:
    - datalake_terminator_clean.termination.ts_updated
    description: ''
  type:
    description: Defines if termination is automatic, semi-automatic or manual.
    categories:
      Automatic: ''
      Manual: ''
      Semi-automatic: ''
  leadtime_request_to_vacancy:
    description: Time between the termination request and termination date.
  leadtime_vacancy_to_finish:
    description: Time between termination date and termination finished.
  is_before_contract_start:
    description: Boolean to indicate if the termination request was made before the
      contract start.
  has_prior_notice_fine:
    description: Boolean to indicate if the request was made with at least 30 days
      in advance.
  has_one_year_fine:
    description: Boolean to indicate if the request was made before 12 months of contract.
  has_been_rescheduled:
    description: ''
  is_termination_canceled:
    description: Boolean to flag if the termination was canceled.
  is_workflow:
    description: ''
  is_carteirizado:
    description: ''
  ts_load:
    description: ''
