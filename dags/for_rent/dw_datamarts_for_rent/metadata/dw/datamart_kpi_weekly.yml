  bookers_weekly:
    description: Number of clients who booked a visit on the week. Since it is the
      count of unique clients, it is not additive.
  ended_rentals_confirmed_weekly:
    description: Accumulated sum of the contracts that were annulled (based on the
      date which the offboarding analyst inputs the annulment in the system) on the
      week. This metric was developed because it cannot change retroactively. The
      data team recommends Ended Rentals Confirmed for less granular monitoring (monthly
      and over) | additive metric.
  ended_rentals_weekly:
    description: Accumulated sum of the contracts that were annulled (based on annulment
      date) on the week. Due to the nature of the product, this metric can change
      retroactively. The data team recommends Ended Rentals for more granular monitoring
      (daily and weekly) | additive metric.
  listing_to_contract_signed_weekly:
    description: ''
  new_bookers_weekly:
    description: Number of clients who booked their first visit ever on the week |
      additive metric.
  new_contracts_signed_weekly:
    description: Accumulated sum of the contracts that were signed (not necessarily
      generated revenue) on the week | additive metric.
  new_first_listings_weekly:
    description: Accumulated sum of the listings with category First Listings (version
      1) on the week | additive metric.
  new_rentals_weekly:
    description: Accumulated sum of signed contracts that started (generated revenue)
      on the week | additive metric.
  ongoing_contracts_weekly:
    description: Count of unique contracts that were signed and were active on the
      week. Attention to the contracts of type DealOnly (we only had contracts with
      this type until 2016). It was a service only for contracts, without the administration
      of the rent, therefore only generated brokerage but no administration fees and
      will be accounted once on the week of contract signed | non-additive.
  ongoing_listings_weekly:
    description: Count of unique listings with status published on the week. Attention
      to listings without city group and/or city name, they must be removed from the
      result | non-additive.
  ongoing_rentals_weekly:
    description: Count of unique signed contracts that started and were active on
      the week. Attention to the contracts of type DealOnly (we only had contracts
      with this type until 2016). It was a service only for contracts, without the
      administration of the rent, therefore only generated brokerage but no administration
      fees and will be accounted once on the week of contract started | non-additive.
  re_rentals_weekly:
    description: Count of New Rentals, on the week, in houses which already had a
      previous contract signed | additive.
  ts_load:
    description: ''
  visits_booked_per_ongoing_listings_weekly:
    description: ''
