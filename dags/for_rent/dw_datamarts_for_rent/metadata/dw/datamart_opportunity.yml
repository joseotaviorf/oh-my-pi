database_name: dw_datamarts_for_rent
table_name: datamart_opportunity
description: Every line is an opportunity on house listing flow
domain: For Rent
owner: heloisa.santos@quintoandar.com.br
columns:
  sk_house_listing:
    lineage:
    - dw_public.fact_house_listing_flows.sk_house_listing
    description: Key of house listing
  sk_opportunity_date:
    lineage:
    - dw_public.fact_house_listing_flows.sk_opportunity_date
    description: Key to identify date of opportunity (ie date of house's first photo
      job created)
  sk_first_listing_date:
    lineage:
    - dw_public.fact_house_listing_flows.sk_first_listing_date
    description: Key to identify date of first listing of a house in our website
  sk_region:
    lineage:
    - dw_public.fact_house_listing_flows.sk_region
    description: Key to identify region associated with the opportunity
  sk_lead:
    lineage:
    - dw_public.fact_house_listing_flows.sk_lead
    description: Key to identify lead
  sk_first_photo_job:
    lineage:
    - dw_public.dim_photo_job.sk_photo_job
    description: Key to identify house's first photo job
  sk_last_photo_job:
    lineage:
    - dw_public.fact_house_listing_flows.sk_first_photo_job
    description: Key to identify house's last photo job
  creation_origin:
    lineage:
    - dw_public.dim_photo_job.creation_origin
    description: Origin of the first photo job (IS, Owner, etc)
  days_opportunity_to_listing:
    lineage:
    - dw_public.fact_house_listing_flows.days_opportunity_to_listing
    description: Days between first photo job creation date and first listing date
  avg_days_photo_job_created_after_cancel:
    description: Average number of days between a reported problem or the cancellation
      of a photo job and scheduling the following photo job
  days_first_photo_job_scheduled:
    description: Days between first photo job creation and the date that the job was
      scheduled to happen
  opp_origin:
    description: Identify the opperation that converted the opportunity
  photo_jobs_number:
    description: Number of jobs that was scheduled for the opportunity
  photo_jobs_reschedules:
    description: Number os jobs that was rescheduled for the opportunity
