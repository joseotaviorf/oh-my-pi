database_name: datalake_rental_transact_test_clean
table_name: offer
description: This table consolidates offer information related to the ForRent operation.
  Each line should be unique and identified by the id column.
  This table is updated every 30 minutes.
domain: For Rent
owner: kleber.inoue@quintoandar.com.br
columns:
  id:
    lineage:
    - datalake_rental_transact_test_raw.offer.id
    description: Offer id. This key should be unique.
  id_firestore_offer:
    lineage:
    - datalake_rental_transact_test_raw.offer.firestore_offer_id
    description: Firestore's offer id.
  id_house_external:
    lineage:
    - datalake_rental_transact_test_raw.offer.house_external_id
    description: External house id - joins with EBDB's house id.
  id_tenant_external:
    lineage:
    - datalake_rental_transact_test_raw.offer.tenant_external_id
    description: External tenant id - joins with Person's user id.
  id_owner_external:
    lineage:
    - datalake_rental_transact_test_raw.offer.owner_external_id
    description: External owner id - joins with Person's user id.
  id_resident_info:
    lineage:
    - datalake_rental_transact_test_raw.offer.resident_info_id
    description: Resident info id. Joins with resident_info table.
  uuid_offer:
    lineage:
    - datalake_rental_transact_test_raw.offer.offer_uuid
    description: Offer uuid.
  status:
    lineage:
    - datalake_rental_transact_test_raw.offer.status
    description: Current status of the offer.
  type:
    lineage:
    - datalake_rental_transact_test_raw.offer.type
    description: Type of the offer.
  iteration:
    lineage:
    - datalake_rental_transact_test_raw.offer.iteration
    description: Iteration of the offer.
  turn:
    lineage:
    - datalake_rental_transact_test_raw.offer.turn
    description: Whose turn is on the offer negotiation.
  rejection_reason:
    lineage:
    - datalake_rental_transact_test_raw.offer.rejection_reason
    description: Rejection reason of the offer, if it has any.
  original_rent_value:
    lineage:
    - datalake_rental_transact_test_raw.offer.original_rent_value
    description: Original rent value asked by the owner.
  ts_created:
    lineage:
    - datalake_rental_transact_test_raw.offer.created_at
    description: Timestamp of the offer creation.
  ts_updated:
    lineage:
    - datalake_rental_transact_test_raw.offer.updated_at
    description: Timestamp of the offer update.
  ts_expiration:
    lineage:
    - datalake_rental_transact_test_raw.offer.expires_at
    description: Timestamp of when the offer will expire.
  