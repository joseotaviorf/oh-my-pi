database_name: datalake_rental_transact_clean
table_name: offer
description: This table consolidates offer information related to the ForRent operation.
  Each line should be unique and identified by the id column.
  This table is updated every 30 minutes.
domain: For Rent
owner: gustavo.brunelli@quintoandar.com.br
columns:
  id:
    lineage:
    - datalake_rental_transact_raw.offer.id
    description: Offer id. This key should be unique.
  id_firestore_offer:
    lineage:
    - datalake_rental_transact_raw.offer.firestore_offer_id
    description: Document identifier for this offer in Google Cloud Firestore, used by the Rental Transact service as its primary external key.
  id_house_external:
    lineage:
    - datalake_rental_transact_raw.offer.house_external_id
    description: External house id - joins with EBDB's house id.
  id_tenant_external:
    lineage:
    - datalake_rental_transact_raw.offer.tenant_external_id
    description: External tenant id - joins with Person's user id.
  id_owner_external:
    lineage:
    - datalake_rental_transact_raw.offer.owner_external_id
    description: External owner id - joins with Person's user id.
  id_resident_info:
    lineage:
    - datalake_rental_transact_raw.offer.resident_info_id
    description: Resident info id. Joins with resident_info table.
  uuid_offer:
    lineage:
    - datalake_rental_transact_raw.offer.offer_uuid
    description: Universally unique identifier assigned to the rental offer for cross-service correlation across the transact workflow.
  status:
    lineage:
    - datalake_rental_transact_raw.offer.status
    description: Current processing state of the record in the source workflow.
  type:
    lineage:
    - datalake_rental_transact_raw.offer.type
    description: Classification code defining the entity role or category.
  iteration:
    lineage:
    - datalake_rental_transact_raw.offer.iteration
    description: Current negotiation round number between tenant and owner on this offer, incremented with each counterproposal.
  turn:
    lineage:
    - datalake_rental_transact_raw.offer.turn
    description: Whose turn is on the offer negotiation.
  rejection_reason:
    lineage:
    - datalake_rental_transact_raw.offer.rejection_reason
    description: Rejection reason of the offer, if it has any.
  original_rent_value:
    lineage:
    - datalake_rental_transact_raw.offer.original_rent_value
    description: Original rent value asked by the owner.
  payment_flow_type:
    lineage:
    - datalake_rental_transact_raw.offer.payment_flow_type
    description: Billing model selected for the offer, indicating whether checkout uses standard billing or advance payment before contract signing.
    categories:
      NONE: No payment flow type specified.
      ADVANCE_PAYMENT: Payment flow uses advance payment.
  original_iptu_value:
    lineage:
    - datalake_rental_transact_raw.offer.original_iptu_value
    description: Original IPTU (property tax) value.
  original_condominium_value:
    lineage:
    - datalake_rental_transact_raw.offer.original_condominium_value
    description: Original condominium fee value before offer negotiation.
  original_home_insurance_value:
    lineage:
    - datalake_rental_transact_raw.offer.original_home_insurance_value
    description: Monthly residential insurance premium from the listing before negotiation began.
  original_tenant_service_fee_value:
    lineage:
    - datalake_rental_transact_raw.offer.original_tenant_service_fee_value
    description: Tenant brokerage fee in BRL recorded when the offer was first created, before negotiation updates to pricing components.
  ts_created:
    lineage:
    - datalake_rental_transact_raw.offer.created_at
    description: Timestamp of the offer creation.
  ts_updated:
    lineage:
    - datalake_rental_transact_raw.offer.updated_at
    description: Timestamp of the offer update.
  ts_expiration:
    lineage:
    - datalake_rental_transact_raw.offer.expires_at
    description: Timestamp of when the offer will expire.
