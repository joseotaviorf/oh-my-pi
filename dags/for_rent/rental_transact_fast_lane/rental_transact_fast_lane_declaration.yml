dag:
  name: rental_transact_fast_lane
  schedule_start_date: 2024, 7, 1
  schedule_interval: 0,30 * * * *
  owner: Data ForRent
  criticality: Critical
  sla_deadline_localtime: "08:00"
  documentation:
    dag_purpose: |
      This DAG retrieves data from the Rental Offer project (database rental_transact), which is a source of ForRent offers and negotiation.
      This DAG has only tables that must run every 30 minutes.
workflow:
  type: cdc
  layer: raw
  database_type: postgres
  source_database: rental_transact
  source_schema: public
  custom_schema: rental_transact
  dbutils_secret_key: RENTAL_TRANSACT_DB
  has_soft_delete: true
  execution_timeout_hours: 0.5
  tables_customization:
    offer:
      clean_table_name: offer
      raw_primary_keys: [id]
      clean_primary_keys: [id]
