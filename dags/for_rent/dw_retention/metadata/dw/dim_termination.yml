database_name: dw_retention
table_name: dim_termination
description: Dimension table containing contract termination information. Each row corresponds to a unique termination process.
domain: For Rent
owner: jonas.fiorini@quintoandar.com.br
columns:
  sk_termination:
    lineage:
      - datalake_offboarding.contract_termination.id_termination
    description: ID of the contract termination.
  repair_cost:
    lineage:
      - datalake_offboarding.contract_termination.repair_cost
    description: Cost of repairs.
  status:
    lineage:
      - datalake_offboarding.contract_termination.status
    description: Status of the contract termination.
  category:
    description: Termination category, which will be depreciated in favor of the characteristics.
    lineage:
      - datalake_offboarding.contract_termination.category
  send_utility_bills_receipt:
    lineage:
      - datalake_offboarding.contract_termination.send_utility_bills_receipt
    description: Status of the bills receipt.
  attachment_type_list:
    lineage:
      - datalake_offboarding.contract_termination.attachment_type_list
    description: List of the attachment's type associated to the termination.
  requested_by:
    lineage:
      - datalake_offboarding.contract_termination.requested_by
    description: Identifies who requested to leave the property.
    categories:
      TENANT: Requested by the tenant.
      QUINTOANDAR: Requested by Quinto Andar.
      LANDLORD: Requested by the landlord.
  dt_ended_termination:
    lineage:
      - datalake_offboarding.contract_termination.dt_ended_termination
    description: End date of the contract's termination.
  ts_created:
    lineage:
      - datalake_offboarding.contract_termination.ts_created
    description: Timestamp of when the contract termination was requested.
  ts_load:
    description: Timestamp of when this data was loaded.