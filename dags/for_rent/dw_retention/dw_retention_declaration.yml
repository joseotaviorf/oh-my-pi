dag:
  name: dw_retention
  schedule_start_date: 2024,03,07
  owner: Data ForRent
  documentation:
    dag_purpose: |
      This DAG loads to DW our Retention Data Model.
      This DAG is triggered by Mediator and loads the tables via full load.
workflow:
  type: query_delta
  layer: dw
  custom_schema: retention
  tables_customization:
    fact_owner_retention:
      partitions: [country_code]
    fact_ongoing_terminations_snapshots:
      extraction_type: incremental
      partitions: [year, month, day]
      extra_query_template_params:
        load_start_date: "{{ get_date_param(dag_run, ds, 'load_start_date') }}"
        load_end_date: "{{ get_date_param(dag_run, ds, 'load_end_date') }}"
  inner_dependencies:
    fact_contract_termination:
      - dim_termination
      - dim_nps_answer
cluster:
  type: databricks_12_2_med_2xlarge_general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
