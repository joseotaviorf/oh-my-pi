dag:
  name: rental_management
  schedule_start_date: 2024, 7, 1
  schedule_interval: 30 1,5 * * *
  owner: Data ForRent
  documentation:
    dag_purpose: |
      This DAG retrieves data from the rental_management database, which is a source of ForRent Post Contract data.
      This database contains data related to Condo Monitoring, Managed Rental features.

      Some tables are updated around 4am on production database, that's why we have the schedule_interval set to 30 1,5 * * * to catch the data.
workflow:
  type: cdc
  layer: raw
  database_type: postgres
  source_schema: public
  dbutils_secret_key: RENTAL_MANAGEMENT_DB
  tables_customization:
    boleto:
      clean_table_name: invoice
    boleto_address:
      clean_table_name: invoice_address
    boleto_identification:
      clean_table_name: invoice_identification
    boleto_issuer:
      clean_table_name: invoice_issuer
    boleto_user:
      clean_table_name: invoice_user
    boleto_user_issuer:
      clean_table_name: invoice_user_issuer
    condo_monitoring_actions: {}
    condo_monitoring_eligibility: {}
    key_holder_preference: {}
    key_location_preference: {}
    key_location_preference_log: {}
    key_location_return_address: {}
    third_party_bills: {}
    billback:
      transactional_datatype_overrides:
        contractual_penalty: "DECIMAL(38, 10)"
        amount: "DECIMAL(38, 10)"
    pp_multi_user: {}
    pp_multi_fee:
      transactional_datatype_overrides:
        adm_fee: "DECIMAL(38, 10)"
    pp_multi_audit_log:
      transactional_datatype_overrides:
        previous_adm_fee: "DECIMAL(38, 10)"
        new_adm_fee: "DECIMAL(38, 10)"
cluster:
  type: databricks_16_4_med_general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
