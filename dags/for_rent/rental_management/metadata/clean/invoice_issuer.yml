---
database_name: datalake_rental_management_clean
table_name: invoice_issuer
description: |
  This table contains the issuers of the invoices.
owner: gustavo.silva@quintoandar.com.br
domain: For Rent
columns:
  id:
    lineage:
      - datalake_rental_management_raw.boleto_issuer.id
    description: Surrogate primary key of the invoice issuer record. The issuer is the condo administrator or bill beneficiary registered to receive the invoice's payment, not a bank.
  name:
    lineage:
      - datalake_rental_management_raw.boleto_issuer.name
    description: Legal or trade name of the condo administrator or bill beneficiary registered as the invoice issuer. Defaults to a generic administrator label when not informed.
  document:
    lineage:
      - datalake_rental_management_raw.boleto_issuer.document
    description: Tax identifier (CPF or CNPJ) of the condo administrator or bill beneficiary registered as the invoice issuer.
  document_type:
    lineage:
      - datalake_rental_management_raw.boleto_issuer.document_type
    description: Tax document category of the issuer, such as CPF or CNPJ.
  ts_created:
    lineage:
      - datalake_rental_management_raw.boleto_issuer.created_at
    description: Timestamp of the creation of the invoice issuer.
  ts_updated:
    lineage:
      - datalake_rental_management_raw.boleto_issuer.updated_at
    description: Timestamp of the update of the invoice issuer.
