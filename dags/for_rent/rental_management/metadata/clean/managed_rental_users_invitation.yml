---
database_name: datalake_rental_management_clean
table_name: managed_rental_users_invitation
description: |
  Invitation channel and acceptance timestamps for managed rental users pending enrollment.
owner: gustavo.silva@quintoandar.com.br
domain: For Rent
columns:
  id:
    lineage:
      - datalake_rental_management_raw.managed_rental_users_invitation.id
    description: Surrogate primary key of the managed rental user invitation record.
  id_managed_rental_users:
    lineage:
      - datalake_rental_management_raw.managed_rental_users_invitation.managed_rental_users_id
    description: Foreign key to the managed rental user receiving the invitation.
  email:
    lineage:
      - datalake_rental_management_raw.managed_rental_users_invitation.email
    description: Email address used to deliver or validate the invitation.
  phone:
    lineage:
      - datalake_rental_management_raw.managed_rental_users_invitation.phone
    description: Phone number used to deliver or validate the invitation.
  version:
    lineage:
      - datalake_rental_management_raw.managed_rental_users_invitation.version
    description: Optimistic locking revision counter for concurrent update safety.
  ts_last_sent:
    lineage:
      - datalake_rental_management_raw.managed_rental_users_invitation.last_sent_at
    description: Timestamp when the invitation was last sent to the recipient.
  ts_accepted:
    lineage:
      - datalake_rental_management_raw.managed_rental_users_invitation.accepted_at
    description: Timestamp when the invitation was accepted by the recipient.
  ts_created:
    lineage:
      - datalake_rental_management_raw.managed_rental_users_invitation.created_at
    description: Timestamp when the invitation record was created.
  ts_updated:
    lineage:
      - datalake_rental_management_raw.managed_rental_users_invitation.updated_at
    description: Timestamp when the invitation record was last updated.
