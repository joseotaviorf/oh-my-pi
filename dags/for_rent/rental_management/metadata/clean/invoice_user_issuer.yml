---
database_name: datalake_rental_management_clean
table_name: invoice_user_issuer
description: |
  This table contains the users issuers associated with the invoices.
owner: gustavo.silva@quintoandar.com.br
domain: For Rent
columns:
  id:
    lineage:
      - datalake_rental_management_raw.boleto_user_issuer.id
    description: Surrogate primary key linking a payer profile to an invoice issuer.
  id_invoice_user:
    lineage:
      - datalake_rental_management_raw.boleto_user_issuer.boleto_user_id
    description: ID of the invoice user captured in the source operational system.
  id_invoice_issuer:
    lineage:
      - datalake_rental_management_raw.boleto_user_issuer.boleto_issuer_id
    description: Foreign key to the invoice issuer (condo administrator or bill beneficiary) configured for this payer, not a bank.
  id_contract:
    lineage:
      - datalake_rental_management_raw.boleto_user_issuer.contract_id
    description: ID of the contract captured in the source operational system.
  request_status:
    lineage:
      - datalake_rental_management_raw.boleto_user_issuer.request_status
    description: Request status captured in the source operational system.
  version:
    lineage:
      - datalake_rental_management_raw.boleto_user_issuer.version
    description: Optimistic locking revision counter for concurrent update safety.
  dt_monitoring_started:
    lineage:
      - datalake_rental_management_raw.boleto_user_issuer.monitoring_start_date
    description: Timestamp when condo invoice monitoring started for this payer-issuer-contract enrollment. Source column is a timestamp, not a calendar date.
  dt_due:
    lineage:
      - datalake_rental_management_raw.boleto_user_issuer.due_date
    description: Due date of the invoice.
  ts_created:
    lineage:
      - datalake_rental_management_raw.boleto_user_issuer.created_at
    description: Timestamp of the creation of the invoice user issuer.
  ts_updated:
    lineage:
      - datalake_rental_management_raw.boleto_user_issuer.updated_at
    description: Timestamp of the update of the invoice user issuer.
  ts_last_received_event:
    lineage:
      - datalake_rental_management_raw.boleto_user_issuer.last_received_event_at
    description: Last time a webhook event was handled for this invoice user issuer stream; used for integration silence detection.
