---
database_name: datalake_rental_management_clean
table_name: key_location_return_address
description: Table containing about the key location return addresses, including the key location return address ID, the zip code, the street name, the number, the neighborhood, the complement, the city, the state, the creation timestamp, and the update timestamp.
domain: For Rent
owner: gustavo.silva@quintoandar.com.br
columns:
  id:
    description: Surrogate primary key of the postal address for returning property keys.
    lineage:
      - datalake_rental_management_raw.key_location_return_address.id
  zip_code:
    description: Postal code where keys must be returned after contract termination.
    lineage:
      - datalake_rental_management_raw.key_location_return_address.zip_code
  street_name:
    description: Thoroughfare name for the key return destination address.
    lineage:
      - datalake_rental_management_raw.key_location_return_address.street_name
  number:
    description: Street number for the key return destination address.
    lineage:
      - datalake_rental_management_raw.key_location_return_address.number
  neighborhood:
    description: Bairro or district name within the city for the mailing address where rental property keys must be returned at contract end.
    lineage:
      - datalake_rental_management_raw.key_location_return_address.neighborhood
  complement:
    description: Address complement such as apartment or block for key return.
    lineage:
      - datalake_rental_management_raw.key_location_return_address.complement
  city:
    description: City where keys must be returned after contract termination.
    lineage:
      - datalake_rental_management_raw.key_location_return_address.city
  state:
    description: State or region of the key return destination address.
    lineage:
      - datalake_rental_management_raw.key_location_return_address.state
  ts_created:
    description: Creation timestamp related to the register.
    lineage:
      - datalake_rental_management_raw.key_location_return_address.created_at
  ts_updated:
    description: Last update timestamp related to the register.
    lineage:
      - datalake_rental_management_raw.key_location_return_address.updated_at
