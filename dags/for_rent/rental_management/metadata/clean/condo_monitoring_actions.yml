  id_contract:
    description: ID of the contract captured in the source operational system.
    lineage:
      - datalake_rental_management_raw.condo_monitoring_actions.contract_id
  id_action_main_user:
    description: ID of the user that performed the action.
    lineage:
      - datalake_rental_management_raw.condo_monitoring_actions.action_main_user_id
  action_type:
    description: Type of action performed.
    lineage:
      - datalake_rental_management_raw.condo_monitoring_actions.action_type
  action_main_user_email:
    description: Email of the user that performed the action.
    lineage:
      - datalake_rental_management_raw.condo_monitoring_actions.action_main_user_email
  action_system:
    description: System that performed the action.
    lineage:
      - datalake_rental_management_raw.condo_monitoring_actions.action_system
  invoice_user_name:
