      - datalake_rental_management_raw.condo_monitoring_actions.boleto_issuer_document
  version:
    description: Optimistic locking revision counter for concurrent update safety.
    lineage:
      - datalake_rental_management_raw.condo_monitoring_actions.version
  ts_created:
    description: Timestamp of the creation of the condo monitoring action.
    lineage:
      - datalake_rental_management_raw.condo_monitoring_actions.created_at
  ts_updated:
