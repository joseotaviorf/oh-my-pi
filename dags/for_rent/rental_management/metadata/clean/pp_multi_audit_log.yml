---
database_name: datalake_rental_management_clean
table_name: pp_multi_audit_log
description: |
  Audit log of enrollment and management-fee events for PP Multi landlords (e.g. enrollment
  activated/deactivated, account manager assigned, management fee added/updated), including the
  status/fee values before and after each change.
owner: gustavo.silva@quintoandar.com.br
domain: For Rent
columns:
  id:
    description: Surrogate primary key of the PP Multi audit log entry.
    lineage:
      - datalake_rental_management_raw.pp_multi_audit_log.id
  id_pp_multi_user:
    description: Foreign key to the PP Multi enrollment (pp_multi_user) this audit entry refers to.
    lineage:
      - datalake_rental_management_raw.pp_multi_audit_log.pp_multi_user_id
  id_triggered_by:
    description: ID of the user or service account that triggered the audited event.
    lineage:
      - datalake_rental_management_raw.pp_multi_audit_log.triggered_by_id
  id_pp_multi_fee:
    description: Foreign key to the PP Multi management fee record affected by this audit entry, when applicable.
    lineage:
      - datalake_rental_management_raw.pp_multi_audit_log.pp_multi_fee_id
  execution_type:
    description: Whether the audited event was triggered manually (MANUAL) or by an automated process (AUTOMATIC).
    lineage:
      - datalake_rental_management_raw.pp_multi_audit_log.execution_type
  event_log_type:
    description: Type of PP Multi event recorded (e.g. ACTIVATE_PP_MULTI, ADD_ACCOUNT_MANAGER, UPDATE_MANAGEMENT_FEE, PERSON_MERGED).
    lineage:
      - datalake_rental_management_raw.pp_multi_audit_log.event_log_type
  description:
    description: Human-readable description of the audited event.
    lineage:
      - datalake_rental_management_raw.pp_multi_audit_log.description
  previous_status:
    description: PP Multi enrollment status before the audited event.
    lineage:
      - datalake_rental_management_raw.pp_multi_audit_log.previous_status
  new_status:
    description: PP Multi enrollment status after the audited event.
    lineage:
      - datalake_rental_management_raw.pp_multi_audit_log.new_status
  previous_adm_fee:
    description: Management fee amount before the audited event.
    lineage:
      - datalake_rental_management_raw.pp_multi_audit_log.previous_adm_fee
  new_adm_fee:
    description: Management fee amount after the audited event.
    lineage:
      - datalake_rental_management_raw.pp_multi_audit_log.new_adm_fee
  is_previous_fee_active:
    description: Indicates whether the management fee was active before the audited event.
    lineage:
      - datalake_rental_management_raw.pp_multi_audit_log.previous_fee_active
  is_new_fee_active:
    description: Indicates whether the management fee is active after the audited event.
    lineage:
      - datalake_rental_management_raw.pp_multi_audit_log.new_fee_active
  ts_created:
    description: Timestamp when the audit log entry was created.
    lineage:
      - datalake_rental_management_raw.pp_multi_audit_log.created_at
