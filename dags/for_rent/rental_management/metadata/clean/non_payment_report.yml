---
database_name: datalake_rental_management_clean
table_name: non_payment_report
description: |
  Non-payment reports filed for rental contracts. One row per report. Links a boleto (invoice) or third-party bill
  that was not paid on time. Used to track overdue payment escalation, request origin (support vs self-service),
  and lifecycle status of the report.
owner: data-for-rent@quintoandar.com.br
domain: For Rent
columns:
  id:
    description: Primary key identifier of the non-payment report.
    lineage:
      - datalake_rental_management_raw.non_payment_report.id
  id_invoice:
    description: Foreign key to the invoice (boleto) table. Nullable when the report is not linked to an invoice.
    lineage:
      - datalake_rental_management_raw.non_payment_report.boleto_id
  id_original_invoice:
    description: Foreign key to the original invoice (boleto) before any reissuing. Nullable.
    lineage:
      - datalake_rental_management_raw.non_payment_report.original_boleto_id
  id_contract:
    description: Foreign key to the contract associated with this non-payment report.
    lineage:
      - datalake_rental_management_raw.non_payment_report.contract_id
  id_third_party_bills:
    description: Foreign key to the third-party bill linked to this report. Nullable and unique per report.
    lineage:
      - datalake_rental_management_raw.non_payment_report.third_party_bills_id
  digitable_line:
    description: Digitable line (barcode string) of the bill associated with this report.
    lineage:
      - datalake_rental_management_raw.non_payment_report.digitable_line
  request_origin:
    description: Origin channel of the non-payment report request.
    categories:
      Support: Report filed via customer support (CX).
      SelfService: Report filed directly by the landlord through self-service.
    lineage:
      - datalake_rental_management_raw.non_payment_report.request_origin
  status:
    description: Lifecycle status of the non-payment report.
    categories:
      CREATED: Report has been created but files are not yet committed.
      FILES_COMMITTED: Attachments have been committed to the report.
      PAYMENT_REQUESTED: Payment has been requested for the associated third-party bill.
      PAYMENT_PLANNED: Third-party bill linked but payment not yet requested.
      DUPLICATED: Report identified as a duplicate of another existing report.
    lineage:
      - datalake_rental_management_raw.non_payment_report.status
  version:
    description: Optimistic locking version counter for the non-payment report.
    lineage:
      - datalake_rental_management_raw.non_payment_report.version
  dt_due:
    description: Due date of the unpaid bill referenced by this report.
    lineage:
      - datalake_rental_management_raw.non_payment_report.due_date
  dt_original_dues:
    description: Array of due dates from the original invoice (boleto).
    lineage:
      - datalake_rental_management_raw.non_payment_report.original_due_dates
  ts_created:
    description: Timestamp of the creation of the non-payment report.
    lineage:
      - datalake_rental_management_raw.non_payment_report.created_at
  ts_updated:
    description: Timestamp of the last update of the non-payment report.
    lineage:
      - datalake_rental_management_raw.non_payment_report.updated_at
