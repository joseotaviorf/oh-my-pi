---
database_name: datalake_rental_management_clean
table_name: key_location_preference_log
description: Table containing about the key location preference logs, every change in the key location preference is logged.
domain: For Rent
owner: gustavo.silva@quintoandar.com.br
columns:
  id:
    description: Key location preference log ID. It's a auto-incremented ID.
    lineage:
      - datalake_rental_management_raw.key_location_preference_log.id
  id_key_location_preference:
    description: Foreign key for key_location_preference table.
    lineage:
      - datalake_rental_management_raw.key_location_preference_log.key_location_preference_id
  author_user_type:
    description: Author user type captured in the source operational system.
    categories:
      PERSON: Who is doing the change is an identifiable person. When we're able to get the user logged in, we will use the personUUID.
      SERVICE: Who is doing the change is a service.
    lineage:
      - datalake_rental_management_raw.key_location_preference_log.author_user_type
  author_user_change_identifier:
    description: When available (author_user_type = PERSON), person UUID who performed the change.
    lineage:
      - datalake_rental_management_raw.key_location_preference_log.author_user_change_identifier
  event_log_type:
    description: Event log type captured in the source operational system.
    categories:
      INITIAL_LOCATION_PREFERENCE_OPT_OUT: The initial event occurs when we use a Reminder at D-5 to consult the endpoint eligibility and the tenant's input, and decide that it is an OPT_OUT scenario (e.g., we have easy entry access). FRONTDOOR, LOCKBOX, PASSWORD.
      OPT_OUT_CHANGED_PREFERENCE: In the scenario where the event INITIAL_LOCATION_PREFERENCE_OPT_OUT occurred, the user can still change the key location preference. This event should log this change.
      INITIAL_LOCATION_PREFERENCE_OPT_IN: At D-5, we can't use an entry access, so the LL will need to inform how to receive the keys. LOCKER, EXTERNAL.
      OPT_IN_LL_PREFERENCE_INFORMED: In the scenario where the event INITIAL_LOCATION_PREFERENCE_OPT_IN occurred, the user needs to inform the preference on how to receive the keys.
      TT_INFORMED_PASSWORD: Even after the initial event, TT can still inform us about where they're going to leave the keys, if it's the password, we need to change the preference on our side.
    lineage:
      - datalake_rental_management_raw.key_location_preference_log.event_log_type
  channel:
    description: Channel where the event occurred.
    categories:
      MAGIC_LINK: The event occurred through the magic link 2.0.
      LANDLORD_NATIVE: The event occurred through the Flutter app.
      LANDLORD_WEB: The event occurred through the landlord Flutter web app.
    lineage:
      - datalake_rental_management_raw.key_location_preference_log.channel
  description:
    description: An open text field to add more context about the reason for this change. Can be automatically generated by the service or include some input by the user who is performing the action.
    lineage:
      - datalake_rental_management_raw.key_location_preference_log.description
  ts_created:
    description: Log timestamp creation captured in the source operational system.
    lineage:
      - datalake_rental_management_raw.key_location_preference_log.created_at
