    description: Foreign key to the non-payment report.
    lineage:
      - datalake_rental_management_raw.non_payment_report_attachment.non_payment_report_id
  id_attachment:
    description: Foreign key to the attachment.
    lineage:
      - datalake_rental_management_raw.non_payment_report_attachment.attachment_id
