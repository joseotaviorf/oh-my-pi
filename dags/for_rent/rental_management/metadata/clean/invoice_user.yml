---
database_name: datalake_rental_management_clean
table_name: invoice_user
owner: gustavo.silva@quintoandar.com.br
domain: For Rent
description: |
  This table contains the users associated with the invoices.
columns:
  id:
    description: Surrogate key identifying this invoice user record in the rental_management pipeline.
    lineage:
      - datalake_rental_management_raw.boleto_user.id
  id_external:
    lineage:
      - datalake_rental_management_raw.boleto_user.external_id
    description: Identifier assigned by the external billing platform for this payer profile.
  id_main_user:
    description: ID of the user captured in the source operational system.
    lineage:
      - datalake_rental_management_raw.boleto_user.main_user_id
  request_status:
    description: Request status captured in the source operational system.
    lineage:
      - datalake_rental_management_raw.boleto_user.request_status
  version:
    description: Optimistic locking revision counter for concurrent update safety.
    lineage:
      - datalake_rental_management_raw.boleto_user.version
  is_active:
    description: Boolean column that indicates if the invoice user is active.
    lineage:
      - datalake_rental_management_raw.boleto_user.active
  ts_created:
    description: Timestamp of the creation of the invoice user.
    lineage:
      - datalake_rental_management_raw.boleto_user.created_at
  ts_updated:
    description: Timestamp of the update of the invoice user.
    lineage:
      - datalake_rental_management_raw.boleto_user.updated_at
