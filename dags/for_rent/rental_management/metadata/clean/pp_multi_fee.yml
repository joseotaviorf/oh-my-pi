---
database_name: datalake_rental_management_clean
table_name: pp_multi_fee
description: |
  Management (administration) fee configuration for PP Multi landlords — the multi-property
  ownership relationship program. One row per fee record linked to a pp_multi_user enrollment;
  a landlord can have at most one active fee at a time.
owner: gustavo.silva@quintoandar.com.br
domain: For Rent
columns:
  id:
    description: Surrogate primary key of the PP Multi management fee record.
    lineage:
      - datalake_rental_management_raw.pp_multi_fee.id
  id_pp_multi_user:
    description: Foreign key to the PP Multi enrollment (pp_multi_user) this fee belongs to.
    lineage:
      - datalake_rental_management_raw.pp_multi_fee.pp_multi_user_id
  version:
    description: Optimistic locking revision counter for concurrent update safety.
    lineage:
      - datalake_rental_management_raw.pp_multi_fee.version
  adm_fee:
    description: Management fee amount charged to the landlord under the PP Multi program.
    lineage:
      - datalake_rental_management_raw.pp_multi_fee.adm_fee
  is_active:
    description: Indicates whether this management fee configuration is currently active.
    lineage:
      - datalake_rental_management_raw.pp_multi_fee.active
  ts_created:
    description: Timestamp when the management fee record was created.
    lineage:
      - datalake_rental_management_raw.pp_multi_fee.created_at
  ts_updated:
    description: Timestamp of the last update to the management fee record.
    lineage:
      - datalake_rental_management_raw.pp_multi_fee.updated_at
