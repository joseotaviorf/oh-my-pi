---
database_name: datalake_rental_management_clean
table_name: invoice_identification
description: |
  This table contains information about the identification of the invoices.
owner: gustavo.silva@quintoandar.com.br
domain: For Rent
columns:
  id:
    description: Surrogate key identifying this invoice identification record in the rental_management pipeline.
    lineage:
      - datalake_rental_management_raw.boleto_identification.id
  id_invoice:
    description: ID of the invoice captured in the source operational system.
    lineage:
      - datalake_rental_management_raw.boleto_identification.id_invoice
  status:
    description: Status of the invoice captured in the source operational system.
    lineage:
      - datalake_rental_management_raw.boleto_identification.status
  status_reason:
    description: Explanation code for the current invoice identification status outcome.
    lineage:
      - datalake_rental_management_raw.boleto_identification.status_reason
  version:
    description: Optimistic locking revision counter for concurrent update safety.
    lineage:
      - datalake_rental_management_raw.boleto_identification.version
  ts_identified:
    description: Timestamp of the identification of the invoice.
    lineage:
      - datalake_rental_management_raw.boleto_identification.identified_at
  ts_created:
    description: Timestamp of the creation of the register.
    lineage:
      - datalake_rental_management_raw.boleto_identification.created_at
  ts_updated:
    description: Timestamp of the update of the register.
    lineage:
      - datalake_rental_management_raw.boleto_identification.updated_at
