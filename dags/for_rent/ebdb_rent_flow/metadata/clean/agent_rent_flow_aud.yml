database_name: datalake_ebdb_clean
table_name: agent_rent_flow_aud
domain: For Rent
owner: gustavo.brunelli@quintoandar.com.br
description: Audit table for agent rent flow containing historical changes and modifications.
columns:
  id_agent:
    description: Agent user id assigned to the rent flow at this Envers audit revision.
    lineage:
      - datalake_ebdb_raw.fluxolocacao_dadosagente_aud.agentes_id
  id_rent_flow:
    description: Rent flow id affected by the agent assignment change in this revision.
    lineage:
      - datalake_ebdb_raw.fluxolocacao_dadosagente_aud.fluxolocacao_id
  rev:
    description: Envers revision number; join to user_revision_entity for change context.
    lineage:
      - datalake_ebdb_raw.fluxolocacao_dadosagente_aud.rev
  rev_type:
    description: Envers operation type for this revision (insert, update, or delete).
    categories:
      "0" : Create
      "1" : Update
      "2" : Delete
    lineage:
      - datalake_ebdb_raw.fluxolocacao_dadosagente_aud.revtype
