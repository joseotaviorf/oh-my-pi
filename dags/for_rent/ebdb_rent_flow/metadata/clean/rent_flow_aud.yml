database_name: datalake_ebdb_clean
table_name: rent_flow_aud
description: Envers audit history of EBDB rent flow (fluxolocacao) records, one row per field change revision.
domain: For Rent
owner: gustavo.brunelli@quintoandar.com.br
columns:
  id_rent_flow:
    lineage:
      - datalake_ebdb_raw.fluxolocacao_aud.id
    description: Rent flow id whose fluxolocacao row changed in this Envers revision.
  id_client:
    lineage:
      - datalake_ebdb_raw.fluxolocacao_aud.cliente_id
    description: Tenant prospect user id captured at this audited revision.
  id_manager:
    lineage:
      - datalake_ebdb_raw.fluxolocacao_aud.gerente_id
    description: Account manager user id captured at this audited revision.
  id_house:
    lineage:
      - datalake_ebdb_raw.fluxolocacao_aud.imovel_id
    description: Property id associated with the rent flow at this audited revision.
  id_current_offer:
    lineage:
      - datalake_ebdb_raw.fluxolocacao_aud.currentoffer_id
    description: Linked offer id stored in the rent flow at this audited revision.
  id_current_contract:
    lineage:
      - datalake_ebdb_raw.fluxolocacao_aud.currentcontrato_id
    description: Linked contract id stored in the rent flow at this audited revision.
  id_current_proposal:
    lineage:
      - datalake_ebdb_raw.fluxolocacao_aud.currentproposta_id
    description: Linked proposal id stored in the rent flow at this audited revision.
  rev:
    lineage:
      - datalake_ebdb_raw.fluxolocacao_aud.rev
    description: Envers revision number; join to user_revision_entity for change context.
  rev_type:
    lineage:
      - datalake_ebdb_raw.fluxolocacao_aud.revtype
    description: Envers operation type for this revision (insert, update, or delete).
  mod_ts_ignore_before:
    lineage:
      - datalake_ebdb_raw.fluxolocacao_aud.ignorarantesde_mod
    description: Flag indicating whether the ts ignore before field changed in this revision.
  status:
    lineage:
      - datalake_ebdb_raw.fluxolocacao_aud.status
    description: Rent flow pipeline status value recorded in this Envers audit revision.
  mod_status:
    lineage:
      - datalake_ebdb_raw.fluxolocacao_aud.status_mod
    description: Flag indicating whether the status field changed in this revision.
  mod_agents:
    lineage:
      - datalake_ebdb_raw.fluxolocacao_aud.agentes_mod
    description: Flag indicating whether the agents field changed in this revision.
  mod_id_client:
    lineage:
      - datalake_ebdb_raw.fluxolocacao_aud.cliente_mod
    description: Flag indicating whether the id client field changed in this revision.
  mod_id_manager:
    lineage:
      - datalake_ebdb_raw.fluxolocacao_aud.gerente_mod
    description: Flag indicating whether the id manager field changed in this revision.
  mod_id_house:
    lineage:
      - datalake_ebdb_raw.fluxolocacao_aud.imovel_mod
    description: Flag indicating whether the id house field changed in this revision.
  is_step_rejected:
    lineage:
      - datalake_ebdb_raw.fluxolocacao_aud.etaparejeitada
    description: Whether the rent flow step was marked rejected at this revision.
  mod_is_step_rejected:
    lineage:
      - datalake_ebdb_raw.fluxolocacao_aud.etaparejeitada_mod
    description: Flag indicating whether the is step rejected field changed in this revision.
  has_no_iptu:
    lineage:
      - datalake_ebdb_raw.fluxolocacao_aud.withoutiptu
    description: IPTU exemption flag value recorded at this audited revision.
  mod_has_no_iptu:
    lineage:
      - datalake_ebdb_raw.fluxolocacao_aud.withoutiptu_mod
    description: Flag indicating whether the has no iptu field changed in this revision.
  mod_id_current_offer:
    lineage:
      - datalake_ebdb_raw.fluxolocacao_aud.currentofferid_mod
    description: Flag indicating whether the id current offer field changed in this revision.
  mod_id_current_contract:
    lineage:
      - datalake_ebdb_raw.fluxolocacao_aud.currentcontratoid_mod
    description: Flag indicating whether the id current contract field changed in this revision.
  mod_id_current_proposal:
    lineage:
      - datalake_ebdb_raw.fluxolocacao_aud.currentpropostaid_mod
    description: Flag indicating whether the id current proposal field changed in this revision.
  ts_ignore_before:
    lineage:
      - datalake_ebdb_raw.fluxolocacao_aud.ignorarantesde
    description: "Ignore-before cutoff timestamp value at this audited revision."
