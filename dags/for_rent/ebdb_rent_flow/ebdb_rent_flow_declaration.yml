dag:
  name: ebdb_rent_flow
  schedule_start_date: 2021, 2, 20
  schedule_interval: 10 21 * * *
  owner: Data ForRent
  documentation:
    dag_purpose: Extraction of EBDB tables related to Rent Flow into data lake. EBDB is the main database for QuintoAndar.
workflow:
  type: cdc
  layer: raw
  database_type: mysql
  source_database: ebdb
  source_schema: ebdb
  custom_schema: ebdb
  tables_customization:
    FluxoLocacao:
      clean_table_name: rent_flow
    FluxoLocacao_AUD:
      clean_table_name: rent_flow_aud
    FluxoLocacao_DadosAgente:
      clean_table_name: agent_rent_flow
    Onboarding:
      clean_table_name: onboarding
cluster:
  type: databricks_12_2_med_2xlarge_general_cluster
