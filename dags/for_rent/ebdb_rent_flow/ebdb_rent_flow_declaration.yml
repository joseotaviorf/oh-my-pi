dag:
  name: ebdb_rent_flow
  schedule_start_date: 2021, 2, 20
  schedule_interval: 10 21,8,12 * * *
  owner: Data ForRent
  documentation:
    dag_purpose: Extraction of EBDB tables related to Rent Flow into data lake. EBDB is the main database for QuintoAndar.
workflow:
  type: cdc
  layer: raw
  database_type: mysql
  source_database: ebdb
  source_schema: ebdb
  custom_schema: ebdb
  tables_customization:
    FluxoLocacao:
      clean_table_name: rent_flow
    FluxoLocacao_AUD:
      clean_table_name: rent_flow_aud
    FluxoLocacao_DadosAgente:
      clean_table_name: agent_rent_flow
    FluxoLocacao_DadosAgente_AUD:
      clean_table_name: agent_rent_flow_aud
  extra_query_template_params:
    load_end_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, 1), 'load_end_date') }}"
cluster:
  type: databricks_16_4_med_general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
