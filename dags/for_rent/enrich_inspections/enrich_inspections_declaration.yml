dag:
  name: enrich_inspections
  schedule_start_date: 2022, 1, 19
  owner: Data ForRent
  criticality: High
  documentation:
    dag_purpose: |
      This DAG is responsible for the union tables between new Inspection Services data and old PWA data,
      as well as the construction of metrics through this data.

workflow:
  type: query_delta
  layer: enrich
  inner_dependencies:
    inspection_booking:
      - appointment_inspection
      - main_inspection_booking
    item:
      - item_group
    item_issue:
      - item
    item_media:
      - item
    item_review:
      - item
    report_approval:
      - reviewer
  tables_customization:
    appointment_inspection:
      criticality: Critical
      partitions: [year, month, day]
      extraction_type: incremental
      z_order_by: [id_appointment]
      merge_on: [id_appointment]
    inspection_booking:
      extraction_type: full
    inspection_status_change: {}
    inspector_reports:
      partitions: [year, month, day]
      extraction_type: incremental
      z_order_by: [id_report]
      merge_on: [id_report]
    item_group:
      partitions: [year, month, day]
      extraction_type: incremental
      z_order_by: [id_item_group]
      merge_on: [id_item_group]
    item_issue:
      partitions: [year, month, day]
      extraction_type: incremental
      z_order_by: [id_item_issue]
      merge_on: [id_item_issue]
    item_media:
      partitions: [year, month, day]
      extraction_type: incremental
      z_order_by: [id_item_media]
      merge_on: [id_item_media]
    item_review:
      partitions: [year, month, day]
      extraction_type: incremental
    item:
      partitions: [year, month, day]
      extraction_type: incremental
      z_order_by: [id_item]
      merge_on: [id_item]
    repair_exempted:
      partitions: [year, month, day]
      extraction_type: incremental
    repair_request:
      z_order_by: [id_repair_request]
    report_approval: {}
    report_approvals:
      partitions: [year, month, day]
      extraction_type: incremental
      z_order_by: [id_inspection]
      merge_on: [id_inspection]
    report_review_media:
      partitions: [year, month, day]
      extraction_type: incremental
    room:
      partitions: [year, month, day]
      extraction_type: incremental
    reviewer:
      criticality: Critical
      partitions: [year, month, day]
      extraction_type: incremental
      merge_on: [id_reviewer]
    automatic_discounts:
      criticality: Critical
      extraction_type: full
      merge_on: [id_contract]

