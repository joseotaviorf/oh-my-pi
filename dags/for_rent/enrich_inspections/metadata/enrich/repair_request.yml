---
database_name: datalake_inspections
table_name: repair_request
description: Enrichment table that unifies and applies business rules to repair request context data.
domain: For Rent
owner: data-ae-for-rent@quintoandar.com.br
columns:
  id_repair_request:
    lineage:
      - datalake_inspection_services_clean.repair_request.id_repair_request
    description: Repair Request unique identifier (number)
  id_inspection:
    lineage:
      - datalake_inspection_services_clean.inspection.id_inspection
    description: Inspection identification key.
  id_contract:
    lineage:
      - datalake_inspection_services_clean.inspection
    description: Contract identification key.
  id_contestation:
    lineage:
      - datalake_inspection_services_clean.contestation.id_contestation
    description: Identification key of the contestation related to the repair request.
  id_item_group:
    lineage:
      - datalake_inspection_services_clean.repair_request.id_item_group
    description: Item Group unique identifier.
  id_room:
    lineage:
      - datalake_inspection_services_clean.room.id_room
    description: Room unique identifier.
  id_assessment:
    lineage:
      - datalake_inspection_services_clean.assessment.id_assessment
    description: Unique identifier of an Assessment.
  id_requester:
    lineage:
      - datalake_inspection_services_clean.repair_request.id_reviewer
    description: Author of repair request
  id_granted_by:
    lineage:
      - datalake_inspection_services_clean.repair_request.id_granted_by
    description:
      Reviewer who assessed whether a repair was exempted. Being an owner
      or member of AN1
  id_contestation_requester:
    lineage:
      - datalake_inspection_services_clean.contestation.id_reviewer
    description: Identification key of the user who made the contestation.
  requester_type:
    lineage:
      - datalake_inspection_services_clean.reviewer.reviewer_type
    description: Role type of the user who opened the repair request (e.g. TENANT, OWNER, ADMIN, INSPECTIONS_SERVICE).
  granted_type:
    lineage:
      - datalake_inspection_services_clean.reviewer.reviewer_type
    description: Role type of the reviewer who granted or assessed the exemption for the repair request (e.g. OWNER, ADMIN).
  type:
    lineage:
      - datalake_inspection_services_clean.repair_request.type
    description: Type of action requested in the repair request, indicating whether the item should be repaired, cleaned, removed, replaced, or another action (see categories).
    categories:
      REPAIR: Make item repair.
      CLEAN: Clean the item.
      TAKE AWAY: Remove item left in the property.
      GIVE BACK: Replace item that was in the property.
      OTHER: Other types not listed.
  item_name:
    lineage:
      - datalake_inspection_services_clean.repair_request.name
    description: Name of the item to be repaired
  room_name:
    lineage:
      - datalake_inspection_services_clean.repair_request.room_name
    description: Room name where the item is located
  cost:
    lineage:
      - datalake_inspection_services_clean.repair_request.cost
    description: Most recent repair cost in BRL for the repair request.
  repair_type:
    lineage:
      - datalake_inspection_services_clean.repair_request.type
    description: Type of repair requested
  comment:
    lineage:
      - datalake_inspection_services_clean.repair_request.comment
    description: Commentary detailing the repair needed
  responsibility:
    lineage:
      - datalake_inspection_services_clean.repair_request.responsibility
    description: Descriptive information indicating who is responsible for the repair request.
  repair_service:
    lineage:
      - datalake_inspection_services_clean.repair_request.repair_service
    description: Repair service requested
  total_media:
    lineage:
      - datalake_inspections.report_review_media.id_media
    description: Count of distinct media files (photos or videos) associated with the repair request.
  total_tenant_contestation:
    lineage:
      - datalake_inspection_services_clean.contestation.id_contestation
    description: Numerical information indicating the total number of objections made by the tenant during the review.
  total_tenant_budget_approval_contestation:
    lineage:
      - datalake_inspection_services_clean.contestation.id_contestation
    description: Numerical information indicating the total number of objections made by the tenant during the budget approval step.
  total_owner_budget_approval_contestation:
    lineage:
      - datalake_inspection_services_clean.contestation.id_contestation
    description: Numerical information indicating the total number of objections made by the owner during the budget approval step.
  is_cost_absorbed_by_company:
    lineage:
      - datalake_inspection_services_clean.repair_request.responsibility
      - datalake_inspection_services_clean.repair_request.is_exempted
    description: The cost of the repair will be absorbed by the 5A
  is_cost_absorbed_by_tenant:
    lineage:
      - datalake_inspection_services_clean.repair_request.responsibility
      - datalake_inspection_services_clean.repair_request.is_exempted
    description: Indicates whether the tenant bears the repair cost, derived as true when the repair responsibility is TENANT and the request was not exempted.
  is_cost_absorbed_by_owner:
    lineage:
      - datalake_inspection_services_clean.repair_request.responsibility
      - datalake_inspection_services_clean.repair_request.is_exempted
    description: Indicates whether the property owner bears the repair cost, derived as true when the repair responsibility is OWNER or the request was exempted.
  is_exempted:
    lineage:
      - datalake_inspection_services_clean.repair_request.is_exempted
    description:
      Indicates whether the repair suggested by the AN1 team was exempted
      by the owner or a analyst
  is_exempted_by_owner_from_budget:
    lineage:
      - datalake_inspection_services_clean.repair_request.is_exempted_from_budget
    description: Flag that indicates whether the repair request was exempted by the owner in the budget approval stage.
  is_exempted_by_owner:
    lineage:
      - datalake_inspection_services_clean.repair_request.is_exempted
      - datalake_inspection_services_clean.reviewer.reviewer_type
    description: Indicates whether the repair was exempted by the property owner, true when the granting reviewer type is OWNER and the request is flagged as exempted.
  is_requested_by_owner:
    lineage:
      - datalake_inspection_services_clean.reviewer.reviewer_type
    description: Indicates whether the repair request was opened by the property owner, true when the requesting reviewer type is OWNER.
  exempted_on_ar:
    lineage:
      - datalake_inspection_services_clean.repair_request.is_finished
      - datalake_inspection_services_clean.repair_request.is_exempted
      - datalake_inspection_services_clean.reviewer.reviewer_type
    description: Indicates whether the repair was exempted specifically during the Repair Analysis (AR) stage, derived as true when the request is exempted, is not yet finished (AC stage not reached), and the granting reviewer is an admin.
  is_finished:
    lineage:
      - datalake_inspection_services_clean.repair_request.is_finished
    description: Indicates whether the repair request was reviewed and finalized by an admin during the contestation analysis (AC) stage. In the source system it is set to true only when an admin updates the repair while the inspection is in contestation analysis; repairs that never reach that stage stay false. Despite the name, it does not mean the physical repair was completed.
  has_automatically_identified:
    lineage:
      - datalake_inspection_services_clean.repair_request.has_automatically_identified
    description: |
      Boolean indicating whether this repair request was automatically drafted from inspector
      tags (tag-based flow). This flow predates Kirk and is unrelated to Kirk's
      AI-based repair report creation and to repair pricing automation.
  has_automatic_identification_accepted:
    lineage:
      - datalake_inspection_services_clean.repair_request.has_automatic_identification_accepted
    description: |
      Boolean indicating whether the automatically drafted repair request (from the
      tag-based flow) was accepted. This flow predates Kirk and is unrelated to Kirk's
      AI-based repair report creation and to repair pricing automation.
  ts_granted:
    lineage:
      - datalake_inspection_services_clean.repair_request.ts_granted
    description:
      Indicates the time at which the repair request exempted assessment
      was made
  ts_created:
    lineage:
      - datalake_inspection_services_clean.repair_request.ts_created
    description: Record creation date
  ts_updated:
    lineage:
      - datalake_inspection_services_clean.repair_request.ts_updated
    description: Record update date
  year:
    lineage:
      - datalake_inspection_services_clean.repair_request.year
    description: Year of update date
  month:
    lineage:
      - datalake_inspection_services_clean.repair_request.month
    description: Month of update date
  day:
    lineage:
      - datalake_inspection_services_clean.repair_request.day
    description: Day of update date
