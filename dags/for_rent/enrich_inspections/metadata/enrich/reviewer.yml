---
database_name: datalake_inspections
table_name: reviewer
description: Data on inspection reviewers and the history of their approvals/failures in inspection reports
domain: For Rent
owner: data-ae-for-rent@quintoandar.com.br
columns:
  id_reviewer:
    lineage:
      - datalake_inspection_services_clean.reviewer.id_reviewer
    description: Review unique identifier (number)
  id_user:
    lineage:
      - datalake_inspection_services_clean.reviewer.id_user
    description: Id of the user who performed the review
  id_assessment:
    lineage:
      - datalake_inspection_services_clean.reviewer.id_assessment
    description: Assessment unique identifier.
  id_previous_assessment:
    lineage:
      - datalake_inspection_services_clean.assessment.id_previous_assessment
    description:
      If there was any previous assessment for the same contract, it will
      be indicated in this column. Usually references an assessment from an onboarding
      or contestation inspection.
  id_inspection:
    lineage:
      - datalake_inspection_services_clean.assessment.id_inspection
    description: Inspection unique identifier
  reviewer_type:
    lineage:
      - datalake_inspection_services_clean.reviewer.reviewer_type
    description: The types of reviewers.
    categories:
      OWNER: Owner of the property.
      TENANT: Tenant of the property.
      ADMIN: Team of Repair Analysis.
  approval_reason:
    lineage:
      - datalake_inspection_services_clean.reviewer.approval_reason
    description: Reason why the reviewer approved or disapproved
  approval_comment:
    lineage:
      - datalake_inspection_services_clean.reviewer.approval_comment
    description: Reviewer's comment about approving or disapproving
  approval_type:
    lineage:
      - datalake_inspection_services_clean.reviewer.approval_type
    description: This field differentiates whether the reviewer came from review, repair analysis, contestation analysis or budget approval
    categories:
      REVIEW: Approval made by the analyst, owner or tenant, after completing the review of the inspection report and the required repairs.
      REPAIR_ANALYSIS: Approval made by the analyst, after completing the analysis of the inspection report and creating repair requests
      CONTESTATION_ANALYSIS: Approval made by the analyst, after completing the dispute analyzes and new repair requests made by the owner and tenant
  is_approved:
    lineage:
      - datalake_inspection_services_clean.reviewer.is_approved
    description: Indicates whether the owner completed the review manually
  dt_limit_revision:
    lineage:
      - datalake_inspection_services_clean.assessment.dt_owner_limit_revision
      - datalake_inspection_services_clean.assessment.dt_tenant_limit_revision
    description: Deadline for the person to review the inspection report.
      This column only contains this information for tenants and owners
  ts_approved:
    lineage:
      - datalake_inspection_services_clean.reviewer.ts_approved
    description: Timestamp of when it was approved
  ts_created:
    lineage:
      - datalake_inspection_services_clean.reviewer.ts_created
    description: Creation date
  ts_updated:
    lineage:
      - datalake_inspection_services_clean.reviewer.ts_updated
    description: Update date
  year:
    lineage:
      - datalake_inspection_services_clean.reviewer.year
    description: Year of update date.
  month:
    lineage:
      - datalake_inspection_services_clean.reviewer.month
    description: Month of update date.
  day:
    lineage:
      - datalake_inspection_services_clean.reviewer.day
    description: Day of update date.
