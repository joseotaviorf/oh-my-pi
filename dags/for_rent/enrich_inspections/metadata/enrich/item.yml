---
database_name: datalake_inspections
table_name: item
description: |
  Denormalized, deduplicated view of the inspections-service item questions — one row per item
  (latest ts_updated wins), already carrying item_type, item_group_type, room_name and the
  assessment/inspection keys, so most analyses do not need to walk the clean item graph.
  Rows are damage sub-items or sub-conditions (breakdowns, humidity, door problem) and also
  non-damage checklist questions, including the house_supply (abastecimento) water, gas and
  electricity chips — this table does reflect the current Flutter inspector app.
  It holds the questions only. The inspector's answer is in datalake_inspections.item_issue
  (column issue_type); measuring fill rates or utilities-on from this table alone counts
  rendered questions as answered and overstates the result.
domain: For Rent
owner: gustavo.silva@quintoandar.com.br
columns:
  id_item:
    description: Item unique identifier captured in the source operational system.
    lineage:
      - datalake_inspection_services_clean.item.id_item
  id_previous_item:
    description: "If there is a previous evaluation for the item in the same contract, it will be indicated in this column. It is usually completed in offboarding inspections, bringing information from the onboarding or dispute inspection."
    lineage:
      - datalake_inspection_services_clean.item.id_previous_item
  id_item_type:
    description: Item Type unique identifier.
    lineage:
      - datalake_inspection_services_clean.item_type.id_item_type
  id_item_group:
    description: Item Group unique identifier.
    lineage:
      - datalake_inspection_services_clean.item.id_item_group
  id_external_item:
    description: Item correlational unique identifier in the PWA database.
    lineage:
      - datalake_inspection_services_clean.item.id_main
  id_room:
    description: Room unique identifier captured in the source operational system.
    lineage:
      - datalake_inspection_services_clean.room.id_room
  id_assessment:
    description: Unique identifier of an Assessment. This identifier must be unique per inspection, however, for dates prior to August 19, 2023, there is residual data in a product bug. This bug erroneously created more than one Assessment per survey. Therefore, for these cases, the id_inspection will not be unique. It is observed that the extra Assessments are identical, with no data distinction between them.
    lineage:
      - datalake_inspection_services_clean.room.id_assessment
  id_inspection:
    description: Inspection unique identifier.
    lineage:
      - datalake_inspection_services_clean.inspection.id_inspection
  id_inspector:
    description: Unique identifier of the inspector responsible for carrying out the inspection.
    lineage:
      - datalake_inspection_services_clean.inspection.id_inspector
  uuid:
    description: Item unique identifier (uuid).
    lineage:
      - datalake_inspection_services_clean.item.uuid
  item_type:
    description: >
      Name of what the item question is about, captured in the source operational system. For
      damage items it is the problem name; for non-damage checklist groups it is the subject being
      asked about — house_supply (abastecimento) uses water, gas and electricity. Identifies the
      question only; the answer is issue_type in datalake_inspections.item_issue.
    lineage:
      - datalake_inspection_services_clean.item_type.type
  media_type:
    description: Supported media type captured in the source operational system.
    categories:
      PHOTO: images
    lineage:
      - datalake_inspection_services_clean.item_type.media_type
  display_type:
    description: Shows the component that renders this type of problems.
    categories:
      COUNTER: Registers the number of parts with problems.
      OPTION_DESCRIPTION: chipchoice with comment option.
      CHECK_DESCRIPTION: checklist option with description.
      CHECK: checklist option.
      OVERVIEW: Displays the overview of the item.
      CHIP_CHOICE_SINGLE: chipchoice with single select option.
      OVERVIEW_WITH_CONDITIONS: overview with option to record conditions.
      DEFAULT: overview with comment option.
    lineage:
      - datalake_inspection_services_clean.item_type.display_type
  room_name:
    description: Descriptive name of the room (typed by inspector).
    lineage:
      - datalake_inspection_services_clean.room.room_name
  item_group_name:
    description: Description of the item group, for example floor, paint, lighting, etc. (typed by inspector).
    lineage:
      - datalake_inspections.item_group.item_group_name
  item_group_type:
    description: Name of the object evaluated in the inspection.
    lineage:
      - datalake_inspections.item_group.item_group_type
  comment:
    description: Displays a inspector's comment.
    lineage:
      - datalake_inspection_services_clean.item.comment
  is_present:
    description: >
      Indicates if the issue checklist item was checked by the inspector. Only meaningful for
      check-style questions (display_type CHECK or CHECK_DESCRIPTION). It is NULL for chip-style
      questions such as the house_supply water/gas/electricity chips (display_type
      CHIP_CHOICE_SINGLE), where the chosen option is an item_issue row instead. Do not use it as
      a general "the inspector answered" flag.
    lineage:
      - datalake_inspection_services_clean.item.is_present
  count:
    description: Indicates the number of parts with problems.
    lineage:
      - datalake_inspection_services_clean.item.count
  is_active:
    description: >
      Indicates if the object is active. Not populated for every kind of question — it is NULL on
      house_supply rows, for example, so a WHERE is_active = TRUE filter silently returns no rows
      for those items. Filter on the item and issue types you need instead.
    lineage:
      - datalake_inspection_services_clean.item.is_active
  ts_created:
    description: Creation date and time captured in the source operational system.
    lineage:
      - datalake_inspection_services_clean.item.ts_created
  ts_updated:
    description: Update date and time captured in the source operational system.
    lineage:
      - datalake_inspection_services_clean.item.ts_updated
  year:
    description: Year referring to date of update.
    lineage:
      - datalake_inspection_services_clean.item.year
  month:
    description: Month referring to date of update.
    lineage:
      - datalake_inspection_services_clean.item.month
  day:
    description: Day referring to date of update.
    lineage:
      - datalake_inspection_services_clean.item.day
