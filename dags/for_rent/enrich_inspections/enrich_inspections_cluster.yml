cluster:
  type: emr_7_12_consolidation_l_general_fleet_cluster
  custom_configurations:
    # Was defaulting to StepConcurrencyLevel 4 (~12 first-wave tables queued
    # PENDING); doubled, matching the fix pattern used on dw_evictions /
    # enrich_ai_collections_quintoandar. See PR description for the full analysis.
    step_concurrency_level: 8
    master_node_type_id: m6g.8xlarge
    core_nodes:
      target_on_demand: 2
      target_spot: 0
      # NVMe (gd) absorbs the inspector_reports fan-out spill; gp3 at 125 MB/s
      # was the only scratch path. ARM-first alternate (m6gd/m7gd → m6id)
      # taken on a capacity fallback.
      instance_types:
        - m6gd.8xlarge
        - m7gd.8xlarge
    task_nodes:
      target_on_demand: 0
      target_spot: 2
      instance_types:
        - m6gd.8xlarge
        - m7gd.8xlarge
      allocation_strategy: price-capacity-optimized
      bid_price_percentage: 100
    spark_conf:
      # emr_spark_base pins this to -1, so the four small type-lookup joins
      # became SortMergeJoins over the already-exploded fan-out instead of
      # BroadcastHashJoins. Same knobs + values as dw_listing_cluster.yml.
      spark.sql.autoBroadcastJoinThreshold: "104857600"
      spark.sql.adaptive.autoBroadcastJoinThreshold: "104857600"
      # emr_spark_base fixes this at 100, and AQE only coalesces below the
      # initial count, so it was a hard parallelism ceiling for the fan-out
      # joins and the SELECT DISTINCT.
      spark.sql.shuffle.partitions: "400"
      spark.speculation: "true"
      spark.speculation.multiplier: "3"
      spark.speculation.quantile: "0.75"
