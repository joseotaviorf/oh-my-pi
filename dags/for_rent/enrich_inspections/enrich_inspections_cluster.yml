cluster:
  type: emr_7_12_consolidation_l_general_fleet_cluster
  custom_configurations:
    # Was defaulting to StepConcurrencyLevel 4 (~12 first-wave tables queued
    # PENDING); doubled, matching the fix pattern used on dw_evictions /
    # enrich_ai_collections_quintoandar. See PR description for the full analysis.
    step_concurrency_level: 8
    master_node_type_id: m6g.8xlarge
    core_nodes:
      target_on_demand: 2
      target_spot: 0
      instance_types:
        - m6g.8xlarge
        - m7g.8xlarge
    task_nodes:
      target_on_demand: 0
      target_spot: 2
      instance_types:
        - m6g.8xlarge
        - m7g.8xlarge
      allocation_strategy: price-capacity-optimized
      bid_price_percentage: 100
