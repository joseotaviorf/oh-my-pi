---
database_name: datalake_mission_control_test_clean
table_name: contract_person
owner: "allan.melao@quintoandar.com.br"
domain: For Rent
description: Information about users who have an associated contract.
  Each line is a user with their personal information (Name, email, CPF) and their user type,
  as well as information about the type of contract associated with them.
columns:
  id:
    description: ID of the person participating in the contract.
    lineage:
      - datalake_mission_control_test_raw.contractperson.id
  id_contract:
    description: ID of the contract. It can be joined with dw_rent.dim_contract.
    lineage:
      - datalake_mission_control_test_raw.contractperson.contract_id
  id_address:
    description: ID of the address.
    lineage:
      - datalake_mission_control_test_raw.contractperson.address_id
  id_user:
    description: ID of the user.
    lineage:
      - datalake_mission_control_test_raw.contractperson.user_id
  contract_type:
    description: ID of the mailing address.
    lineage:
      - datalake_mission_control_test_raw.contractperson.contract_type
  person_type:
    description: Type of person (TENANT or LANDLORD)
    lineage:
      - datalake_mission_control_test_raw.contractperson.type
  full_name:
    description: Full name of the person.
    lineage:
      - datalake_mission_control_test_raw.contractperson.name
  phone_number:
    description: Phone number of the person.
    lineage:
      - datalake_mission_control_test_raw.contractperson.phone_number
  document_number:
    description: Document number of the person.
    lineage:
      - datalake_mission_control_test_raw.contractperson.document_number
  is_deleted:
    description: Boolean value to check if the record is deleted.
    lineage:
      - datalake_mission_control_test_raw.contractperson.deleted
  ts_created:
    description: Timestamp of the contractperson creation.
    lineage:
      - datalake_mission_control_test_raw.contractperson.created_on
  ts_updated:
    description: Timestamp when the register was updated.
    lineage:
      - datalake_mission_control_test_raw.contractperson.updated_on
  year:
    description: Year integer value of the record's update. Also it's a partition.
    lineage:
      - datalake_mission_control_test_raw.contractperson.year
  month:
    description: Month integer value of the record's update. Also it's a partition.
    lineage:
      - datalake_mission_control_test_raw.contractperson.month
  day:
    description: Day integer value of the record's update. Also it's a partition.
    lineage:
      - datalake_mission_control_test_raw.contractperson.day
