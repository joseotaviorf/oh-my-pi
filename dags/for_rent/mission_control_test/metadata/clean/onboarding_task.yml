      - datalake_mission_control_test_raw.onboardingtask.due_date
  ts_created:
    description: Timestamp of the task's creation.
    lineage:
      - datalake_mission_control_test_raw.onboardingtask.created_on
  ts_updated:
    description: Timestamp of when the task was updated.
    lineage:
      - datalake_mission_control_test_raw.onboardingtask.updated_on
  year:
    description: Year integer value of the record's update. Also it's a partition.
    lineage:
      - datalake_mission_control_test_raw.onboardingtask.year
  month:
    description: Month integer value of the record's update. Also it's a partition.
    lineage:
      - datalake_mission_control_test_raw.onboardingtask.month
  day:
