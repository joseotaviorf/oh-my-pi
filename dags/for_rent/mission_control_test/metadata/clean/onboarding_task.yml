---
database_name: datalake_mission_control_test_clean
table_name: onboarding_task
owner: "kleber.inoue@quintoandar.com.br"
domain: For Rent
description:
  Tasks that tenants and owners should do when they're in onboarding step.
  These tasks can be an inspection booking, change the bills ownership, etc.
  Due to incremental load, this table contains duplicated IDs.
columns:
  id:
    description: ID of the task.
    lineage:
      - datalake_mission_control_test_raw.onboardingtask.id
  id_onboarding:
    description: ID of the onboarding.
    lineage:
      - datalake_mission_control_test_raw.onboardingtask.onboarding_id
  id_task_type:
    description: ID of the task's type.
    lineage:
      - datalake_mission_control_test_raw.onboardingtask.task_type_id
  reference_date_field:
    description: Reference of the date field.
    lineage:
      - datalake_mission_control_test_raw.onboardingtask.reference_date_field
  title:
    description: Title of the task.
    lineage:
      - datalake_mission_control_test_raw.onboardingtask.title
  status:
    description: Status of the task.
    lineage:
      - datalake_mission_control_test_raw.onboardingtask.status
  start_offset:
    description: It's related to the start deadline of the task.
    lineage:
      - datalake_mission_control_test_raw.onboardingtask.start_offset
  end_offset:
    description: It's related to the end deadline of the task.
    lineage:
      - datalake_mission_control_test_raw.onboardingtask.end_offset
  is_deleted:
    description: Boolean flag to check if the task was deleted.
    lineage:
      - datalake_mission_control_test_raw.onboardingtask.deleted
  dt_started:
