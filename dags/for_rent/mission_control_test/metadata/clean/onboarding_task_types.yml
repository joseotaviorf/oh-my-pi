---
database_name: datalake_mission_control_test_clean
table_name: onboarding_task_types
owner: "kleber.inoue@quintoandar.com.br"
domain: For Rent
description: Table that stores the types of the onboarding tasks.
  Due to incremental load, this table contains duplicated IDs.
columns:
  id:
    description: ID of the task's type. It's the primary key of the table.
    lineage:
      - datalake_mission_control_test_raw.onboardingtasktypes.id
  user_type:
    description: Type of the user which the task is attributed to.
    categories:
      LANDLORD: Landlord
      TENANT: Tenant
    lineage:
      - datalake_mission_control_test_raw.onboardingtasktypes.user_type
  type:
    description: Type of the task.
    lineage:
      - datalake_mission_control_test_raw.onboardingtasktypes.type
  is_active:
    description: Boolean flag to check if the task is active.
    lineage:
      - datalake_mission_control_test_raw.onboardingtasktypes.active
  ts_created:
    description: Timestamp of the task's creation.
    lineage:
      - datalake_mission_control_test_raw.onboardingtasktypes.created_on
  ts_updated:
    description: Timestamp of the task's update.
    lineage:
      - datalake_mission_control_test_raw.onboardingtasktypes.updated_on
  year:
    description: Year integer value of the record's update. Also it's a partition.
    lineage:
      - datalake_mission_control_test_raw.onboardingtasktypes.year
  month:
    description: Month integer value of the record's update. Also it's a partition.
    lineage:
      - datalake_mission_control_test_raw.onboardingtasktypes.month
  day:
    description: Day integer value of the record's update. Also it's a partition.
    lineage:
      - datalake_mission_control_test_raw.onboardingtasktypes.day
