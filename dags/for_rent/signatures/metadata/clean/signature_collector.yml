database_name: datalake_signatures_clean
table_name: signature_collector
description: |
  Clean CDC copy of signature collector batches from the Signatures Postgres service, one row
  per orchestrated signing workflow that groups related agreement documents and recipients.
  Tracks batch lifecycle from start through dispatch to completion. Linked to individual
  signature rows and used to analyze end-to-end electronic signing operations in For Rent.
domain: For Rent
owner: gustavo.brunelli@quintoandar.com.br
columns:
  id:
    description: Primary key of the signature collector batch record in the Signatures service.
    lineage:
      - datalake_signatures_raw.signature_collector.id
  id_external_reference:
    description: Identifier of the upstream business process or entity that owns this signing batch.
    lineage:
      - datalake_signatures_raw.signature_collector.external_reference_id
  external_reference_name:
    description: Human-readable label of the business object linked through id_external_reference for this collector.
    lineage:
      - datalake_signatures_raw.signature_collector.external_reference_name
  version:
    description: Optimistic-locking revision number incremented whenever the collector row is updated in Signatures.
    lineage:
      - datalake_signatures_raw.signature_collector.version
  status:
    description: Overall workflow state of the collector batch, such as draft, in progress, completed, or cancelled.
    lineage:
      - datalake_signatures_raw.signature_collector.status
  ts_started:
    description: Timestamp when the collector workflow began processing signature requests (UTC).
    lineage:
      - datalake_signatures_raw.signature_collector.started_at
  ts_completed:
    description: Timestamp when all required signatures in the batch were finished; null while the workflow is open (UTC).
    lineage:
      - datalake_signatures_raw.signature_collector.completed_at
  ts_sent:
    description: Timestamp when the collector dispatched signature invitations to recipients (UTC).
    lineage:
      - datalake_signatures_raw.signature_collector.sent_at
  ts_created:
    description: Timestamp when the collector record was first created in the Signatures service (UTC).
    lineage:
      - datalake_signatures_raw.signature_collector.created_at
  ts_updated:
    description: Timestamp of the most recent update to the collector record in Signatures (UTC).
    lineage:
      - datalake_signatures_raw.signature_collector.updated_at
  year:
    description: Ingestion partition year derived from CDC load time; filter on this column for partition pruning.
    lineage:
      - datalake_signatures_raw.signature_collector.year
  month:
    description: Ingestion partition month derived from CDC load time; filter on this column for partition pruning.
    lineage:
      - datalake_signatures_raw.signature_collector.month
  day:
    description: Ingestion partition day derived from CDC load time; filter on this column for partition pruning.
    lineage:
      - datalake_signatures_raw.signature_collector.day
