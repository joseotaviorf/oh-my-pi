dag:
  name: signatures
  schedule_start_date: 2020, 7, 27
  schedule_interval: 0 6 * * *
  owner: Data ForRent
workflow:
  type: database_pull
  layer: raw
  database_type: postgres
  default_extraction_type: incremental
  default_partitions: [year, month, day]
  dbutils_secret_key: SIGNATURES_DB
  lineage_product_database_name: signatures
  tables_customization:
    agreement_document:
      date_filter_column: updated_at
    agreement_document_aud:
      date_filter_column: updated_at
    recipient:
      date_filter_column: updated_at
    recipient_aud:
      date_filter_column: updated_at
    revinfo:
      clean_table_name: rev_info
      date_filter_column: revtstmp
      unixtime_measure: milliseconds
    signature:
      date_filter_column: updated_at
    signature_aud:
      date_filter_column: updated_at
    signature_collector_aud:
      date_filter_column: updated_at
    signature_collector:
      date_filter_column: updated_at
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: m5a.2xlarge
    node_type_id: r5a.2xlarge
    num_workers: 2