dag:
  name: signatures
  schedule_start_date: 2020, 7, 27
  schedule_interval: 0 6 * * *
  owner: Data ForRent
workflow:
  type: database_pull_delta
  layer: raw
  database_type: postgres
  default_extraction_type: incremental
  default_partitions: [year, month, day]
  dbutils_secret_key: SIGNATURES_DB
  lineage_product_database_name: signatures
  tables_customization:
    agreement_document:
      date_filter_column: updated_at
    agreement_document_aud:
      date_filter_column: updated_at
    recipient:
      date_filter_column: updated_at
    recipient_aud:
      date_filter_column: updated_at
    revinfo:
      clean_table_name: rev_info
      date_filter_column: revtstmp
      unixtime_measure: milliseconds
    signature:
      date_filter_column: updated_at
    signature_aud:
      date_filter_column: updated_at
    signature_collector_aud:
      date_filter_column: updated_at
    signature_collector:
      date_filter_column: updated_at
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: m5a.xlarge
    node_type_id: r5a.large
    num_workers: 2
    spark_version: 12.2.x-scala2.12
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
  databricks_conn_id: databricks_new
