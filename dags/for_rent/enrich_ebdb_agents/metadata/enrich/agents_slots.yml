database_name: datalake_ebdb_agents
table_name: agents_slots
description: Table for the criation of the fact_agent_allocations. Contains infos
  on agent allocation hours on the slot granularity
domain: For Rent
owner: eduardo.bastiani@quintoandar.com.br
columns:
  id_agent:
    lineage:
    - datalake_ebdb_agents.agents_weekly_schedule_history.id_agent
  agent_type:
    lineage:
    - datalake_ebdb_agents.agents_weekly_schedule_history.agent_type
    description: Type of agent
    categories:
      CheckUpLar: ''
      SessaoFotos: ''
      Visita: ''
      Vistoria: ''
      VistoriaQuarteirizada: '#N/A'
  day_of_week:
    lineage:
    - datalake_ebdb_agents.agents_weekly_schedule_history.day_of_week
  last_change_reason:
    lineage:
    - datalake_ebdb_agents.agents_specific_weekly_schedule.is_available_slot
    - datalake_ebdb_agents.agents_specific_weekly_schedule.is_off_work
    - datalake_ebdb_agents.agents_specific_weekly_schedule.ts_updated
    - datalake_ebdb_agents.agents_weekly_schedule_history.is_available_slot
    - datalake_ebdb_agents.agents_weekly_schedule_history.ts_slot
    - datalake_ebdb_agents.agents_weekly_schedule_history.ts_updated
    description: Last change in hour allocation, 'day off' means that agent won't
      be available in that hour, even if it's flag as allocated
    categories:
      ? ''
      : ''
      96 hours: ''
      day off: ''
      specific: ''
      visit: ''
  slot_number:
    lineage:
    - datalake_ebdb_agents.agents_weekly_schedule_history.slot_number
    description: Slot number on day 8:00 = 0, 08:15 = 1 ...
  is_active:
    lineage:
    - datalake_ebdb_clean.agent_data_aud.is_active
  is_available_specific_slot:
    lineage:
    - datalake_ebdb_agents.agents_specific_weekly_schedule.is_available_slot
    - datalake_ebdb_agents.agents_specific_weekly_schedule.is_off_work
    - datalake_ebdb_agents.agents_weekly_schedule_history.is_available_slot
  is_available_slot:
    lineage:
    - datalake_ebdb_agents.agents_specific_weekly_schedule.is_available_slot
    - datalake_ebdb_agents.agents_specific_weekly_schedule.is_off_work
    - datalake_ebdb_agents.agents_specific_weekly_schedule.ts_updated
    - datalake_ebdb_agents.agents_weekly_schedule_history.is_available_slot
    - datalake_ebdb_agents.agents_weekly_schedule_history.ts_slot
    - datalake_ebdb_agents.agents_weekly_schedule_history.ts_updated
  is_available_slot_24h:
    lineage:
    - datalake_ebdb_agents.agents_specific_weekly_schedule.is_available_slot
    - datalake_ebdb_agents.agents_specific_weekly_schedule.is_off_work
    - datalake_ebdb_agents.agents_specific_weekly_schedule.ts_updated
    - datalake_ebdb_agents.agents_weekly_schedule_history.is_available_slot
    - datalake_ebdb_agents.agents_weekly_schedule_history.ts_slot
    - datalake_ebdb_agents.agents_weekly_schedule_history.ts_updated
  is_specif_update:
    lineage:
    - datalake_ebdb_agents.agents_specific_weekly_schedule.is_available_slot
    - datalake_ebdb_agents.agents_specific_weekly_schedule.is_off_work
    - datalake_ebdb_agents.agents_weekly_schedule_history.is_available_slot
  is_time_window_update:
    lineage:
    - datalake_ebdb_agents.agents_specific_weekly_schedule.is_available_slot
    - datalake_ebdb_agents.agents_specific_weekly_schedule.is_off_work
    - datalake_ebdb_agents.agents_specific_weekly_schedule.ts_updated
    - datalake_ebdb_agents.agents_weekly_schedule_history.is_available_slot
    - datalake_ebdb_agents.agents_weekly_schedule_history.ts_slot
    - datalake_ebdb_agents.agents_weekly_schedule_history.ts_updated
  ts_last_specific_updated:
    lineage:
    - datalake_ebdb_agents.agents_specific_weekly_schedule.is_available_slot
    - datalake_ebdb_agents.agents_specific_weekly_schedule.ts_updated
    - datalake_ebdb_agents.agents_weekly_schedule_history.is_available_slot
  ts_last_weekly_updated:
    lineage:
    - datalake_ebdb_agents.agents_weekly_schedule_history.ts_updated
  ts_slot:
    lineage:
    - datalake_ebdb_agents.agents_weekly_schedule_history.ts_slot
  year:
    lineage:
    - datalake_ebdb_agents.agents_weekly_schedule_history.ts_slot
  month:
    lineage:
    - datalake_ebdb_agents.agents_weekly_schedule_history.ts_slot
  day:
    lineage:
    - datalake_ebdb_agents.agents_weekly_schedule_history.ts_slot
  agent_id:
    description: Dados Agente ID
  available_slot:
    description: Slot allocated 96 hours in advance
  available_slot_24h:
    description: Slot allocated 24 hours in advance
  dow:
    description: Day of the Week of slot allocation
  has_visit:
    description: ''
  history_status:
    description: ''
  last_specific_update:
    description: ''
  last_weekly_update:
    description: Type of agent
  planner_status:
    description: ''
  self_service_visit:
    description: ''
  slot_dt:
    description: Day of slot allocation
  specific_slot:
    description: Slot allocated 0 hours in advance
  specific_update:
    description: ''
  ss_available_slot:
    description: ''
  time_window_update:
    description: ''
  visit_update:
    description: ''
