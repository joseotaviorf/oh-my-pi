database_name: dw_rent
table_name: dim_proposal
description: A proposal is an offer (see dim_offer table) made by a tenant which has
  been accepted by the property owner. Proposals are the last step before becoming
  contracts. Each line is a proposal
domain: For Rent
owner: gustavo.brunelli@quintoandar.com.br
columns:
  sk_proposal:
    lineage:
    - datalake_proposal.proposal.id
    description: Surrogate key identifying this dim proposal record in the dw_proposal pipeline.
  id_proposal:
    lineage:
    - datalake_proposal.proposal.id
    description: Foreign key referencing the related proposal entity.
  country_code:
    lineage:
    - datalake_proposal.proposal.country_code
    description: ISO country code for geographic filtering of the analytical metric.
    categories:
      BR: Brazil's country code
      MX: Mexico's country code
  guarantee:
    lineage:
    - datalake_proposal.proposal.guarantee
    description: Guarantee (BrasilCap, Deposito, Fiador, OutroTipoFiador, PortoSeguro, SeguroFairfax, SeguroFiancaCardiff / today only SeguroFairFax)
    categories:
      BrasilCap: '-'
      Deposito: '-'
      Fiador: '-'
      OutroTipoFiador: '-'
      PortoSeguro: '-'
      RentalGuarantee: '-'
      SeguroFairfax: '-'
      SeguroFiancaCardiff: '-'
      Standalone: '-'
      RentalDeposit: '-'
      PRO_GUARANTOR: '-'
  status:
    lineage:
    - datalake_proposal.proposal.status
    description: Proposal Status (PreMinuta, EmAnalise, Aprovada, Rejeitada, Nova)
    categories:
      Aprovada: 'Approved'
      EmAnalise: 'Analysis'
      Nova: 'New'
      PreMinuta: 'Draft'
      Rejeitada: 'Rejected'
  status_doc_tenant:
    lineage:
    - datalake_proposal.proposal.tenant_documentation_status
    description: Tenant document status (Analise5a, AnaliseCredito, Aprovado, NaoEnviado, RecusadoCredito, ReenvioDocumentos, StandBy)
    categories:
      Analise5a: 'QuintoAndar analysis (credit desk / mesa de crédito)'
      AnaliseCredito: 'Credit evaluation'
      Aprovado: 'Approved'
      NaoEnviado: 'Docs not sent'
      RecusadoCredito: 'Credit evaluation rejected'
      ReenvioDocumentos: 'Docs resent'
      StandBy: 'Stand by'
  status_doc_owner:
    lineage:
    - datalake_proposal.proposal.owner_documentation_status
    description: Owner document status (Analise5a, Aprovado, NaoEnviado, ReenvioDocumentos)
  rejection_reason:
    lineage:
    - datalake_proposal.proposal.rejection_reason
    description: Reason for rejecting the proposal
    categories:
      CreditEvaluationRejected: Credit evaluation rejected
      HouseReserved: House was reserved
      NDA: NDA
      OwnerGaveUpOffer: Owner gave up offer
      OwnerGaveUpRenting: Owner gave up renting
      OwnerGaveUpTenant: Owner gave up tenant
      OwnerNoContact: Owner did not make contact
      OwnerRentedForAnotherTenant5A: The owner ended up renting for another QuintoAndar
        tenant
      OwnerRentedForAnotherTenantOutside: The owner ended up renting for another tenant
        outside of QuintoAndar
      OwnerSoldApartment: Owner sold the propoerty
      OwnerStalled: Owner stalled
      TenantDocumentationRejected: Tenant docs rejected
      TenantFailedPayment: Tenant failed guarantee payment
      TenantGaveUpApartment: Tenant gave up apartment
      TenantGaveUpRenting: Tenant gave up renting
      TenantNewOffer: '-'
      TenantNoContact: Tenant did not make contact
      TenantNoReserved: '-'
      TenantRentedAnother5A: Tenant rented another house in QuintoAndar
      TenantRentedAnotherOutside: Tenant rented outside of QuintoAndar
      TenantStalled: Tenant stalled
  result_credit_evaluation:
    lineage:
    - datalake_proposal.proposal.last_result
    description: '[New column to consider the credit evaluation step which started in ''2020-06-08''] Status of the last credit evaluation'
    categories:
      PRE_APPROVED: Pre approved
      PRE_REJECTED: Pre rejected
      REGULAR: Regular
  status_sortinghat:
    lineage:
    - datalake_proposal.proposal.status_sorting_hat
    description: Credit analysis status (ADVISABLE, APPROVED, INADVISABLE, NEW, REJECTED)
    categories:
      ADVISABLE: Advisable
      APPROVED: Approved
      INADVISABLE: Inadvisable
      NEW: New
      REJECTED: Rejected
  renting_proposal_value:
    lineage:
    - datalake_proposal.proposal.rent_proposal
    description: Rent proposal value (R$)
  tenant_document_sent_count:
    lineage:
    - datalake_proposal.proposal.tenant_doc_sent_count
    description: Count how many times the tenant has sent the documentation
  credit_evaluation_count:
    lineage:
    - datalake_proposal.proposal.number_evaluations
    description: Number of Credit Evaluations the TP tried for that Proposal
  tenant_document_sent:
    lineage:
    - datalake_proposal.proposal.has_tenant_sent_documentation
    description: Flag indicating whether required tenant documents were submitted.
  tenant_contract_accepted:
    lineage:
    - datalake_proposal.proposal.has_tenant_accepted_contract
    description: Flag indicating whether the tenant accepted the rental contract terms.
  owner_contract_accepted:
    lineage:
    - datalake_proposal.proposal.has_owner_accepted_contract
    description: Flag indicating whether the owner accepted the rental contract terms.
  owner_document_sent:
    lineage:
    - datalake_proposal.proposal.has_owner_sent_documentation
    description: Flag indicating whether required owner documents were submitted.
  flg_doc_reused:
    lineage:
    - datalake_proposal.proposal.is_doc_reused
    description: '[deprecated] 1: Doc was reused / 0: Doc was not reused'
  dt_proposal:
    lineage:
    - datalake_proposal.proposal.ts_proposal
    description: Date of proposal creation (dt_created)
  dt_proposal_approved:
    lineage:
    - datalake_proposal.proposal.ts_approved
    description: Date of proposal approval
  ts_processed:
    lineage:
    - datalake_proposal.proposal.ts_processed
    description: Date of the end of the proposal phase
  dt_created:
    lineage:
    - datalake_proposal.proposal.ts_created
    description: Date of proposal creation (dt_proposal)
  dt_updated:
    lineage:
    - datalake_proposal.proposal.ts_updated
    description: Calendar date for the updated attribute on this record.
  dt_tenant_document_sent:
    lineage:
    - datalake_proposal.proposal.ts_documentation_sent
    description: Date of tenant documentation sent
  dt_owner_document_sent:
    lineage:
    - datalake_proposal.proposal.ts_owner_documentation_sent
    description: Date of documentation sent by tenant
  dt_tenant_first_document_sent:
    lineage:
    - datalake_proposal.proposal.ts_tenant_first_doc_sent
    description: Date of tenat first doc sent if not automatic send
  dt_tenant_auto_first_doc_sent:
    lineage:
    - datalake_proposal.proposal.ts_tenant_auto_first_doc_sent
    description: Date of tenat first doc sent if automatic send
  dt_credit_analysis_first_init:
    lineage:
    - datalake_proposal.proposal.ts_credit_analysis_first_init
    description: '[Deprecated after 2020-06-08. Only use this column to query data from before this date.] Date when the first credit analysis started for the proposal  (Status of ''AnaliseCredito'' or ''Analise5a'' if after ''2020-01-02'')'
  dt_credit_analysis_init:
    lineage:
    - datalake_proposal.proposal.ts_credit_analysis_last_init
    description: Date of credit analysis init
  dt_credit_analysis_first_end:
    lineage:
    - datalake_proposal.proposal.ts_credit_analysis_first_end
    description: '[Deprecated after 2020-06-08. Only use this column to query data from before this date.] Date when the first credit analysis ended for the proposal (Possible Credit Analysis Status: ''Aprovado'', ''RecusadoCredito'', ''StandBy'')'
  dt_credit_analysis_end:
    lineage:
    - datalake_proposal.proposal.ts_credit_analysis_last_end
    description: Date of credit analysis end
  dt_credit_last_approved:
    lineage:
    - datalake_proposal.proposal.ts_credit_approved_last
    description: '[Deprecated after 2020-06-08. Only use this column to query data from before this date.] Date when the last credit analysis result = ''Aprovado'' for the Tenant Documentation'
  dt_tenant_first_doc_complete:
    lineage:
    - datalake_proposal.proposal.ts_tenant_first_doc_complete
    description: '[Deprecated after Credit Evaluation started] Since then this column equals the credit_evaluation_last_init'
  dt_tenant_last_doc_complete:
    lineage:
    - datalake_proposal.proposal.ts_tenant_last_doc_complete
    description: '[Deprecated after Credit Evaluation started] Prior to the credit evaluation it represented the last approval of the documentation before the credit analysis. Since then this column equals the credit_evaluation_last_init'
  dt_first_credit_evaluation_init:
    lineage:
    - datalake_proposal.proposal.ts_credit_evaluation_first_init
    description: '[New column to consider the credit evaluation step which started in ''2020-06-08''] Date when the first credit evaluation for the proposal started'
  dt_last_credit_evaluation_init:
    lineage:
    - datalake_proposal.proposal.ts_credit_evaluation_last_init
    description: '[New column to consider the credit evaluation step which started in ''2020-06-08''] Date when the last credit evaluation for the proposal started'
  dt_first_credit_evaluation_negative:
    lineage:
    - datalake_proposal.proposal.ts_credit_evaluation_first_negative
    description: '[New column to consider the credit evaluation step which started in ''2020-06-08''] Date of the first tenant documentation rejection on the new evaluation process'
  dt_last_credit_evaluation_negative:
    lineage:
    - datalake_proposal.proposal.ts_credit_evaluation_last_negative
    description: '[New column to consider the credit evaluation step which started in ''2020-06-08''] Date of the last tenant document rejection on the new evaluation process'
  dt_guarantee:
    lineage:
    - datalake_proposal.proposal.ts_guarantee
    description: Date the tenant opted for the RentalGuarantee
  dt_first_doc_analysis_approved:
    lineage:
    - datalake_proposal.proposal.ts_doc_analysis_first_approved
    description: '[New column to consider the credit evaluation step which started in ''2020-06-08''] Minimun date when the tenant documentation was approved on the new evaluation process'
  dt_last_doc_analysis_approved:
    lineage:
    - datalake_proposal.proposal.ts_doc_analysis_last_approved
    description: '[New column to consider the credit evaluation step which started in ''2020-06-08''] Maximun date when the tenant documentation was approved on the new evaluation process'
  dt_first_doc_analysis_rejected:
    lineage:
    - datalake_proposal.proposal.ts_doc_analysis_first_rejected
    description: '[New column to consider the credit evaluation step which started in ''2020-06-08''] Minimun date when the tenant documentation was rejected on the new evaluation process'
  dt_last_doc_analysis_rejected:
    lineage:
    - datalake_proposal.proposal.ts_doc_analysis_last_rejected
    description: '[New column to consider the credit evaluation step which started in ''2020-06-08''] Maximun date when the tenant documentation was rejected on the new evaluation process'
  dt_guarantee_paid:
    lineage:
    - datalake_proposal.proposal.ts_guarantee_paid
    description: Date the tenant paid the RentalGuarantee
  dt_first_credit_evaluation_positive:
    lineage:
    - datalake_proposal.proposal.ts_first_credit_evaluation_positive
    description: '[New column to consider the credit evaluation step which started in ''2020-06-08''] Date of the first time tenant documentation was approved for that proposal - status ''Pre Approved'' or ''Regular'''
  dt_last_credit_evaluation_positive:
    lineage:
    - datalake_proposal.proposal.ts_last_credit_evaluation_positive
    description: '[New column to consider the credit evaluation step which started in ''2020-06-08''] Date of the last time tenant documentation was approved for that proposal - status ''Pre Approved'' or ''Regular'''
  dt_credit_analysis_last_init:
    lineage:
    - datalake_proposal.proposal.dt_credit_analysis_last_init
    description: '[Deprecated after 2020-06-08. Only use this column to query data from before this date.] Date when the last credit analysis  started for the proposal  (Status of ''AnaliseCredito'' or ''Analise5a'' if after ''2020-01-02'')'
  dt_credit_analysis_last_end:
    lineage:
    - datalake_proposal.proposal.dt_credit_analysis_last_end
    description: '[Deprecated after 2020-06-08. Only use this column to query data from before this date.] Date when the last credit analysis ended for the proposal (Possible Credit Analysis Status: ''Aprovado'', ''RecusadoCredito'', ''StandBy'')'
  dt_tenant_doc_complete:
    lineage:
    - datalake_proposal.proposal.ts_tenant_last_doc_complete
    description: '[Deprecated after Credit Evaluation started] Prior to the credit evaluation it represented the firt approval of the documentation before the credit analysis. Since then this column equals the credit_evaluation_first_init'
  ts_entrance:
    lineage:
    - datalake_proposal.proposal.ts_entrance
    description: Timestamp marking the entrance event for this record.
  dt_timestamp:
    description: Timestamp of when the table was last processed.
  ts_load:
    description: Timestamp of when the table was last processed.
  dti:
    lineage:
    - datalake_proposal.proposal.dti
    description: Rent-to-Income Ratio (= package_amount / monthly_income_declared)
  monthly_income_declared:
    lineage:
    - datalake_proposal.proposal.income
    description: Income declared by proponent, in local currency
  package_amount:
    lineage:
    - datalake_proposal.proposal.package
    description: Proposal package amount (rent + condo + iptu + insurance), in local currency
  country_code:
    lineage:
    - datalake_proposal.proposal.country_code
    description: ISO country code for geographic filtering of the analytical metric.
    categories:
      BR: Brazil's country code
      MX: Mexico's country code
