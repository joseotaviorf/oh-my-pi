---
database_name: dw_rent
table_name: dim_proposal_person
description: This table has each person related to a rental proposal.
  Each line is as unique sk_proposal_person.
domain: For Rent
owner: gustavo.brunelli@quintoandar.com.br
columns:
  sk_proposal_person:
    lineage:
      - datalake_ebdb_proposal.proposal_person.id_proposal_person
    description: Key that identifies the person of the proposal. Each line should be an unique sk_proposal_person.
  full_name:
    lineage:
      - datalake_ebdb_proposal.proposal_person.full_name
    description: Legal full name of the proposal participant.
  phone_number:
    lineage:
      - datalake_ebdb_proposal.proposal_person.phone_number
    description: Primary phone number of the proposal participant.
  email:
    lineage:
      - datalake_ebdb_proposal.proposal_person.email
    description: Email address used for communication about this record.
  personal_document:
    lineage:
      - datalake_ebdb_proposal.proposal_person.personal_document
    description: Personal document number of the person.
  personal_document_type:
    lineage:
      - datalake_ebdb_proposal.proposal_person.personal_document_type
    description: Identity document type provided by the participant, such as RG or RNE.
  employment_bond:
    lineage:
      - datalake_ebdb_proposal.proposal_person.employment_bond
    description: Type of the person's actual employment bond.
  number_of_dependents:
    lineage:
      - datalake_ebdb_proposal.proposal_person.number_of_dependents
    description: Declared count of financial dependents for the participant.
  current_house_situation:
    lineage:
      - datalake_ebdb_proposal.proposal_person.current_house_situation
    description: Current house situation in which the person is living.
  has_contributed_to_current_house:
    lineage:
      - datalake_ebdb_proposal.proposal_person.has_contributed_to_current_house
    description: Boolean flag indicating if the person contributes to the current house in which it's living.
  gender:
    lineage:
      - datalake_ebdb_proposal.proposal_person.gender
    description: Self-reported gender identity captured during the rental proposal application, used for demographic analysis of applicants.
  marital_status:
    lineage:
      - datalake_ebdb_proposal.proposal_person.marital_status
    description: The person's current marital status.
  state_code:
    lineage:
      - datalake_ebdb_proposal.proposal_person.state_code
    description: Brazilian state abbreviation for the participant address.
  dt_birth:
    lineage:
      - datalake_ebdb_proposal.proposal_person.dt_birth
    description: Birth date of the person.
  ts_created:
    lineage:
      - datalake_ebdb_proposal.proposal_person.ts_created
    description: Timestamp of when the data was created.
  ts_updated:
    lineage:
      - datalake_ebdb_proposal.proposal_person.ts_updated
    description: Timestamp of when the data was updated.
  ts_load:
    description: Timestamp of when the data was loaded into our systems.
