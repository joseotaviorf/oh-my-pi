cluster:
  type: consolidation_xs_memory_cluster
  databricks_conn_id: databricks_new_env
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE
  custom_configurations:
    aws_attributes:
      ebs_volume_size: 200
    num_workers: 3
    runtime_engine: PHOTON
    driver_node_type_id: m7g.xlarge
validation:
  cluster:
    type: emr_7_12_consolidation_xs_memory_cluster
    custom_configurations:
      core_nodes:
        instance_count: 1
      task_nodes:
        instance_count: 2
      master_node_type_id: m7g.xlarge
      spark_conf:
        spark.driver.memory: 3g
        spark.driver.memoryOverhead: 1g
        spark.yarn.am.memory: 512m
      aws_attributes:
        ebs_volume_size: 200
