database_name: dw_public
table_name: dim_photo_job
description: A photo job is when QuintoAndar sends a photographer to take photos of a property for listing. Each line is a photo job
domain: For Rent
owner: data-ae-for-rent@quintoandar.com.br

columns:
  sk_photo_job:
    lineage:
      - datalake_ebdb_photo_jobs.photo_job.id
    description: key of photo job
  id:
    lineage:
      - datalake_ebdb_photo_jobs.photo_job.id
    description: key of photo job
  imovel_id:
    lineage:
      - datalake_ebdb_photo_jobs.photo_job.id_house
    description: key of the house to be photographed
  rep_id:
    lineage:
      - datalake_ebdb_photo_jobs.photo_job.id_rep
    description: sales rep that created the photo job
  photographer_id:
    lineage:
      - datalake_ebdb_photo_jobs.photo_job.id_photographer
    description: key of the photographer responsible for the photo job
  user_cancel_id:
    lineage:
      - datalake_ebdb_photo_jobs.photo_job.id_user_who_canceled
    description: id of user that cancelled the photo job
  country_code:
    lineage:
      - datalake_ebdb_photo_jobs.photo_job.country_code
    description: Country code of the photo job
    categories:
      BR: Brazil's country code
      MX: Mexico's country code
  job_status:
    lineage:
      - datalake_ebdb_photo_jobs.photo_job.job_status
    description: status to identify the job status (Cancelado, ComProblema, etc)
    categories:
      Aceito: "#N/A"
      Agendado: ""
      Cancelado: ""
      ComProblema: ""
      Completado: ""
      DesignadoFotografo: ""
      FotosTiradas: ""
      Iniciado: ""
      NaoListado: ""
      Novo: ""
      Publicado: ""
  creation_origin:
    lineage:
      - datalake_ebdb_photo_jobs.photo_job.creation_origin
    description: origin of the photo job (IS, Owner, etc)
    categories:
      Admin: ""
      Fotografo: ""
      InsideSales_external: "#N/A"
      InsideSales_internal: "#N/A"
      Prop: ""
      Teste: ""
  scheduling_instructions:
    lineage:
      - datalake_ebdb_photo_jobs.photo_job.booking_instructions
    description: Instructions for the photojob who ordered, if the owner will be present or not
  photo_shoot_contact_name:
    lineage:
      - datalake_ebdb_photo_jobs.photo_job.photo_session_contact_name
    description: name reference of person to contact about the photo job
  photo_shoot_email:
    lineage:
      - datalake_ebdb_photo_jobs.photo_job.photo_session_email
    description: email of person to contact about the photo job
  photo_shoot_phone:
    lineage:
      - datalake_ebdb_photo_jobs.photo_job.photo_session_phone
    description: primary phone of person to contact about the photo job
  photo_shoot_second_phone:
    lineage:
      - datalake_ebdb_photo_jobs.photo_job.photo_session_secondary_phone
    description: secondary phone of person to contact about the photo job
  key_withdraw:
    lineage:
      - datalake_ebdb_photo_jobs.photo_job.key_pick_up
    description: info about who holds the key for the photographer
    categories:
      Outros: ""
      Portaria: ""
      Proprietario: ""
  key_comments:
    lineage:
      - datalake_ebdb_photo_jobs.photo_job.key_others
    description: comments about key retrieval
  photographer_name:
    lineage:
      - datalake_ebdb_photo_jobs.photo_job.photographer_name
    description: name of the photographer responsible for the photo job
  photographer_email:
    lineage:
      - datalake_ebdb_photo_jobs.photo_job.photographer_email
    description: email of the photographer responsible for the photo job
  photographer_contract_type:
    lineage:
      - datalake_ebdb_photo_jobs.photo_job.contract_type
    description: identify whether the photographer has a Freelance or CLT contract
    categories:
      CLT: ""
      Freelancer: ""
  photographer_problem_reason:
    lineage:
      - datalake_ebdb_photo_jobs.photo_job.problem
    description: Problem that the photographer encountered in the job
    categories:
      Alugado: ""
      ApartamentoBanguncado: ""
      Duplicado: ""
      ForaDoPadrao: ""
      IMOVEL_COMERCIAL: ""
      IMOVEL_EM_CONDICAO_INSEGURA: ""
      IMPREVISTO_FOTOGRAFO: ""
      LOCALIZACAO_PERIGOSA: ""
      NaoCompareceu: ""
      Outros: ""
      PROBLEMAS_NO_ENVIO_DE_FOTOS: ""
      PROBLEMA_COM_ENDERECO: ""
      ProprietarioCancelou: ""
      Reforma: ""
      SemAutorizacao: ""
      SemChaves: ""
      SemContato: ""
      Vendido: ""
  user_sender_type:
    lineage:
      - datalake_ebdb_photo_jobs.photo_job.photo_sender_user_type
    description: User type who sent the photojob
    categories:
      OWNER: ""
      PHOTOGRAPHER: ""
  cancel_reason:
    lineage:
      - datalake_ebdb_photo_jobs.photo_job.cancellation_reason
