---
dag:
  name: enrich_rent_demand_events
  schedule_start_date: 2014, 6, 17
  owner: Data ForRent
  documentation:
    dag_purpose: |
      Creates an enriched table containing the ForRent demand events, in which each line is an event related to the scope.
      This DAG is triggered by Mediator and loads the table via full load.
workflow:
  type: query
  layer: enrich
  default_partitions:
      - country_code
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: m5d.xlarge
    node_type_id: m5d.xlarge
    runtime_engine: PHOTON
    num_workers: 3
    spark_version: 12.2.x-scala2.12
    spark_conf:
      spark.sql.sources.partitionOverwriteMode: static
