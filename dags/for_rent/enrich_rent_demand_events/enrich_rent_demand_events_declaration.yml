dag:
  name: enrich_rent_demand_events
  schedule_start_date: 2014, 6, 17
  owner: Data ForRent
  criticality: Critical
  documentation:
    dag_purpose: |
      Creates an enriched table containing the ForRent demand events, in which each line is an event related to the scope.
      This DAG is triggered by Mediator and loads the table via full load.
workflow:
  type: query_delta
  layer: enrich
  default_partitions:
    - country_code
