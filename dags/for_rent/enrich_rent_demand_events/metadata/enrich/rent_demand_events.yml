---
database_name: datalake_rent_demand_events
table_name: rent_demand_events
description: "This table shows the demand events of For Rent, each line is an event related to the scope and its partitioned by the country_code."
domain: For Rent
owner: isadora.gallerani@quintoandar.com.br
columns:
  id_event:
    lineage:
      - datalake_booking.booking.id
      - datalake_ebdb_contract.contract.id
      - datalake_offer.offer.id_offer_context
      - datalake_proposal.proposal.id
    description: "Id of the event."
  id_booking:
    lineage:
      - datalake_booking.booking.id
      - datalake_ebdb_rent_flow.rent_flow.id_booking
    description: "Id of the booking."
  id_offer:
    lineage:
      - datalake_ebdb_rent_flow.rent_flow.id_offer_context
      - datalake_offer.offer.id
    description: "Id of the offer (it's the id_offer_context, created on the offer's pipeline)."
  id_proposal:
    lineage:
      - datalake_ebdb_rent_flow.rent_flow.id_proposal
      - datalake_proposal.proposal.id
    description: "Id of the proposal."
  id_contract:
    lineage:
      - datalake_ebdb_contract.contract.id
      - datalake_ebdb_rent_flow.rent_flow.id_contract
    description: "Id of the contract."
  id_event_type:
    description: "Id of the event type."
    categories:
      '1': "Id of the visit booked (VB) event."
      '2': "Id of the visit completed (VC) event."
      '3': "Id of the offer submitted (OS) event."
      '4': "Id of the offer accepted/approved (OA) event."
      '5': "Id of the evaluation started (ES) event."
      '6': "Id of the evaluation positive (EP) event."
      '7': "Id of the documentation sent (DS) event."
      '8': "Id of the credit approved (CA) event."
      '9': "Id of the contract signed (CS) event."
  id_tenant_prospect:
    lineage:
      - datalake_booking.booking.id_visitor
      - datalake_ebdb_rent_flow.rent_flow.id_client
      - datalake_offer.offer.id_client
    description: "Id of the tenant prospect (TP)."
  id_house:
    lineage:
      - datalake_booking.booking.id_house
      - datalake_ebdb_contract.contract.id_house
      - datalake_ebdb_rent_flow.rent_flow.id_house
      - datalake_offer.offer.id_house
    description: "Id of the property."
  id_agent:
    lineage:
      - datalake_booking.booking.id_agent
      - datalake_ebdb_rent_flow.rent_flow.id_user_agent
    description: "Id of the agent."
  id_rent_flow:
    lineage:
      - datalake_booking.booking.id_rent_flow
      - datalake_ebdb_rent_flow.rent_flow.id_rent_flow
      - datalake_offer.offer.id_rent_flow
    description: "Id of the rent flow."
  id_house_listing:
    lineage:
      - datalake_ebdb_rent_flow.rent_flow.id_house
    description: "Id of the house listing. The id is generated inside the query to assure the right contract to the listing."
  id_region:
    lineage:
      - datalake_ebdb_listing.house.id_region
    description: "Id of the region."
  id_owner:
    lineage:
      - datalake_ebdb_listing.house.id_user
    description: "Id of the property owner."
  id_owner_version:
    lineage:
      - datalake_pro_owners.daily_owner_version.id_owner_version
    description: "ID of the property owner's version. We're not versioning the owners that are B2B, so a NULL values can exist."
  is_during_termination:
    description: "Boolean flag indicating if the event happened between the listing's version start date and the listing's
      previous version contract end date.
      This flag may help understanding events during Early Demand, for example."
  ts_event:
    lineage:
      - datalake_booking.booking.ts_created
      - datalake_booking.booking.ts_booking_utc
      - datalake_ebdb_contract.contract.ts_signed
      - datalake_offer.offer.ts_first_sent
      - datalake_offer.offer.ts_analyzed
      - datalake_proposal.proposal.ts_credit_evaluation_first_init
      - datalake_proposal.proposal.ts_first_credit_evaluation_positive
      - datalake_proposal.proposal.ts_tenant_auto_first_doc_sent
      - datalake_proposal.proposal.ts_tenant_first_doc_sent
      - datalake_proposal.proposal.ts_credit_approved_last
    description: "Id of the event date."
  country_code:
    lineage:
      - datalake_ebdb_listing.house.country_code
    description: "Country code information. Also, a partition of the table."
  event_year:
    description: "Year information of the event date."
  event_month:
    description: "Month information of the event date."
  event_day:
    description: "Day information of the event date."
