---
database_name: datalake_rent_demand_events
table_name: rent_demand_events
description: "This table shows the demand events of For Rent, each line is an event related to the scope and is partitioned by the country_code."
domain: For Rent
owner: gustavo.brunelli@quintoandar.com.br
columns:
  id_event:
    lineage:
      - datalake_booking.booking.id
      - datalake_docx_clean.message.payload
      - datalake_ebdb_clean.visit_status_log.id_visit
      - datalake_ebdb_contract.contract.id
      - datalake_offer.offer.id_offer_context
      - datalake_proposal.proposal.id
      - datalake_rental_transact.advance_payment.id
    description: "Id of the event (which could be the id of a booking, offer, proposal, contract, visit, or advance payment)."
  id_booking:
    lineage:
      - datalake_booking.booking.id
      - datalake_ebdb_rent_flow.rent_flow.id_booking
      - datalake_ebdb_clean.visit_status_log.id_schedule
    description: Booking identifier from EBDB when the demand event relates to a scheduled property visit.
  id_visit:
    lineage:
      - datalake_booking.booking.id_visit
      - datalake_ebdb_clean.visit_status_log.id_visit
    description: Visit identifier linking the demand event to the completed or scheduled property showing.
  id_offer:
    lineage:
      - datalake_ebdb_rent_flow.rent_flow.id_offer_context
      - datalake_offer.offer.id
    description: "Id of the offer (it's the id_offer_context, created on the offer's pipeline)."
  id_proposal:
    lineage:
      - datalake_docx_clean.message.payload
      - datalake_ebdb_rent_flow.rent_flow.id_proposal
      - datalake_proposal.proposal.id
    description: Accepted-offer proposal identifier when the demand event relates to tenant documentation or credit.
  id_contract:
    lineage:
      - datalake_ebdb_contract.contract.id
      - datalake_ebdb_rent_flow.rent_flow.id_contract
    description: Rental contract identifier when the demand event records signing or creation milestones.
  id_advance_payment:
    lineage:
      - datalake_rental_transact.advance_payment.id
    description: Advance payment transaction identifier from Rental Transact for reservation fee events.
  id_event_type:
    description: Numeric code mapping to the demand funnel milestone (visit booked, offer submitted, contract signed, etc.).
    categories:
      "1": "Id of the visit booked (VB) event."
      "2": "Id of the visit completed (VC) event."
      "3": "Id of the offer submitted (OS) event."
      "4": "Id of the offer accepted/approved (OA) event."
      "5": "Id of the evaluation started (ES) event."
      "6": "Id of the evaluation positive (EP) event."
      "7": "Id of the documentation sent (DS) event."
      "8": "Id of the credit approved (CA) event."
      "9": "Id of the contract signed (CS) event."
      "10": "Id of the contract created (CC) event."
      "11": "Id of the visit requested event."
      "12": "Id of the visit scheduled event."
      "13": "Id of the visit rescheduled event."
      "14": "Id of the visit done event."
      "15": "Id of the advance payment created event."
      "16": "Id of the advance payment pending event."
      "17": "Id of the advance payment processing event."
      "18": "Id of the advance payment paid event."
      "19": "Id of the advance payment canceled event."
      "20": "Id of the advance payment processing refund event."
      "21": "Id of the advance payment refunded event."
      "22": "Id of the advance payment chargeback event."
      "23": "Id of the advance payment finished event."
      "24": "Id of the advance payment retained event."
  id_tenant_prospect:
    lineage:
      - datalake_booking.booking.id_visitor
      - datalake_ebdb_rent_flow.rent_flow.id_client
      - datalake_offer.offer.id_client
      - datalake_ebdb_clean.visit.id_visitor
    description: Id of the tenant prospect (TP).
  id_house:
    lineage:
      - datalake_booking.booking.id_house
      - datalake_ebdb_contract.contract.id_house
      - datalake_ebdb_rent_flow.rent_flow.id_house
      - datalake_offer.offer.id_house
      - datalake_ebdb_clean.visit.id_house
    description: Property identifier for the listing involved in this For Rent demand funnel event.
  id_agent:
    lineage:
      - datalake_ebdb_rent_flow.rent_flow.id_user_agent
      - datalake_ebdb_clean.visit.id_agent
    description: "Id of the user that is the agent. Notice that it's not the id_agent, but the id_user of the agent (which comes from the EBDB's User table, column id). This was necessary in order to join with the fact_listing_rent_flows model, which already uses the agent's user id."
  id_rent_flow:
    lineage:
      - datalake_booking.booking.id_rent_flow
      - datalake_ebdb_rent_flow.rent_flow.id_rent_flow
      - datalake_offer.offer.id_rent_flow
    description: Rent funnel identifier grouping visit, offer, and contract touchpoints for the same prospect.
  id_schedule:
    lineage:
      - datalake_ebdb_clean.visit_status_log.id_schedule
    description: Schedule ID. Can be joined with id_booking.
  id_house_listing:
    lineage:
      - datalake_ebdb_listing.house_listing.id_house_listing
    description: Versioned listing identifier active when the demand event occurred.
  id_region:
    lineage:
      - datalake_ebdb_listing.house.id_region
    description: Geographic region identifier of the property, joinable to datalake_region.region.
  id_owner:
    lineage:
      - datalake_ebdb_listing.house.id_user
    description: Id of the property owner.
  id_owner_category:
    lineage:
      - datalake_pro_owners.owner_category.id_owner_category
    description: "ID of the property owner's version. We're not versioning the owners that are B2B, so NULL values can exist."
  uuid_company:
    lineage:
      - datalake_ebdb_listing.house.uuid_company
    description: UUID of the Rede company.
  id_company_hubspot:
    lineage:
      - datalake_ebdb_listing.house.id_company_hubspot
    description: Id of the Rede company in Hubspot.
  partner_3p_supply:
    lineage:
      - datalake_ebdb_listing.house.partner_3p_supply
    description: Short name of the Rede company.
  is_during_termination:
    description: "Boolean flag indicating if the event happened between the termination request date and the listing's previous version contract end date (dt_termination). This flag may help understanding events during Early Demand, for example."
  ts_event:
    lineage:
      - datalake_booking.booking.ts_created
      - datalake_booking.booking.ts_booking_utc
      - datalake_docx_clean.message.payload
      - datalake_ebdb_contract.contract.ts_created
      - datalake_ebdb_contract.contract.ts_signed
      - datalake_offer.offer.ts_first_sent
      - datalake_offer.offer.ts_analyzed
      - datalake_proposal.proposal.ts_credit_evaluation_first_init
      - datalake_proposal.proposal.ts_first_credit_evaluation_positive
      - datalake_proposal.proposal.ts_tenant_auto_first_doc_sent
      - datalake_proposal.proposal.ts_tenant_first_doc_sent
      - datalake_proposal.proposal.ts_credit_approved_last
      - datalake_ebdb_clean.visit_status_log.ts_created
      - datalake_rental_transact.advance_payment.ts_rev
    description: "Timestamp of when the event happened."
  country_code:
    lineage:
      - datalake_ebdb_listing.house.country_code
    description: "Country code information. Also, a partition of the table.
      Use it as the first filter of your query in order to improve the performance of your results."
  event_year:
    description: "Year information of the event date."
  event_month:
    description: "Month information of the event date."
  event_day:
    description: "Day information of the event date."
