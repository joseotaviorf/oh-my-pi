database_name: datalake_ebdb_clean
table_name: suspicious_listings
description: Table for all HSM submissions of sanitization of ongoing listings. This HSM consists in sending a message via Whatsapp to listings potentially unavailable for the visit in ForSale. Each row is a different send .
owner: data-for-sale@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_ebdb_raw.SuspiciousListing.id
    description: Unique identifier of each HSM sent to a listing.
  id_house:
    lineage:
      - datalake_ebdb_raw.SuspiciousListing.house_id
    description: Foreign key referring to the house ID. 
  contact_attempts:
    lineage:
      - datalake_ebdb_raw.SuspiciousListing.contact_attempts
    description: Number of messages sent by Whatsapp to the listing owner.
  is_confirmed:
    lineage:
      - datalake_ebdb_raw.SuspiciousListing.listing_confirmed
    description: Boolean indicating whether the owner has responded that the listing is still active and available for sale.
  ts_last_contact_attempt:
    lineage:
      - datalake_ebdb_raw.SuspiciousListing.last_contact_attempt_at
    description: Timestamp o f the last time that Whatsapp has sent a message to the listing owner.
  ts_created:
    lineage:
      - datalake_ebdb_raw.SuspiciousListing.created_at
    description: Timestamp of the first sent for that listing.
  ts_updated:
    lineage:
      - datalake_ebdb_raw.SuspiciousListing.updated_at
    description: Timestamp of the last time that the listing was updated.