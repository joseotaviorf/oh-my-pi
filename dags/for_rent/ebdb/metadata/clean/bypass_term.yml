database_name: datalake_ebdb_clean
table_name: bypass_term
description: This table has the data related to the bypass term signed by the owner on the first VB (visit booked).
owner: herivelto.junior@quintoandar.com.br
domain: Data ForSale
columns:
  id:
    description: Unique ID for this record.
    lineage:
      - datalake_ebdb_raw.bypass_term.id
  id_user:
    description: User ID on main tables.
    lineage:
      - datalake_ebdb_raw.bypass_term.usuario_id
  confirmation_code:
    description: Unique code generated when the owner signs the term.
    lineage:
      - datalake_ebdb_raw.bypass_term.confirmation_code
  is_term_signed:
    description: Boolean indicating if the owner signed the term.
    lineage:
      - datalake_ebdb_raw.bypass_term.signed_term
  ts_term_signed:
    description: Timestamp inidicating when the code was signed.
    lineage:
      - datalake_ebdb_raw.bypass_term.signed_time
  ts_created:
    description: Timestamp that indicates when this entry was created.
    lineage:
      - datalake_ebdb_raw.bypass_term.created_at
  ts_updated:
    description: Timestamp that indicates when this entry was last updated.
    lineage:
      - datalake_ebdb_raw.bypass_term.updated_at
