database_name: dw_listing
table_name: dim_price_predicted
description: Dimensional table that consolidates all the information about the prices predicted by the calculator to a house listing.
domain: Cross
owner: bruna.prates@quintoandar.com.br
columns:
  sk_price_predicted:
    description: Primary key of the table, uniquely identifying a price prediction.
    lineage:
      - datalake_ebdb_pricing.listing_prediction_changes.id_prediction_change
  min_price:
    lineage:
      - datalake_ebdb_pricing.listing_prediction_changes.calculator_min_price
    description: Minimum price estimated by the calculator output. May also be referred to as 'p_10'.
  p20_price:
    lineage:
      - datalake_ebdb_pricing.listing_prediction_changes.calculator_p20_price
    description: Estimated price related to the 20% percentile of the calculator's output. May also be referred to as just 'p_20'.
  p30_price:
    lineage:
      - datalake_ebdb_pricing.listing_prediction_changes.calculator_p30_price
    description: Estimated price related to the 30% percentile of the calculator's output. May also be referred to as just 'p_30'.
  p40_price:
    lineage:
      - datalake_ebdb_pricing.listing_prediction_changes.calculator_p40_price
    description: Estimated price related to the 40% percentile of the calculator's output. May also be referred to as just 'p_40'.
  estimated_price:
    lineage:
      - datalake_ebdb_pricing.listing_prediction_changes.calculator_price
    description: Most likely estimated price of the calculator's output for the listing. Can also be referred to as just 'p_50'.
  p60_price:
    lineage:
      - datalake_ebdb_pricing.listing_prediction_changes.calculator_p60_price
    description: Estimated price related to the 60% percentile of the calculator's output. May also be referred to as just 'p_60'.
  p70_price:
    lineage:
      - datalake_ebdb_pricing.listing_prediction_changes.calculator_p70_price
    description: Estimated price related to the 70% percentile of the calculator's output. May also be referred to as just 'p_70'.
  p80_price:
    lineage:
      - datalake_ebdb_pricing.listing_prediction_changes.calculator_p80_price
    description: Estimated price related to the 80% percentile of the calculator's output. May also be referred to as just 'p_80'.
  max_price:
    lineage:
      - datalake_ebdb_pricing.listing_prediction_changes.calculator_max_price
    description: Maximum price estimated by the calculator's output. May also be referred to as 'p_90'.
  certainty:
    lineage:
      - datalake_ebdb_pricing.listing_prediction_changes.calculator_certainty
    description: Certainty level of the prediction calculated by the calculator.
    categories:
      HIGH: If the prediction has a low confidence interval, having a high certainty in the prediction.
      MEDIUM: If the prediction has a medium confidence interval, having a medium certainty in the prediction.
      LOW: If the prediction has a high confidence interval, having a low certainty in the prediction.
      NONE: If the prediction has no certainty at all.
  business_context:
    lineage:
      - datalake_ebdb_pricing.listing_prediction_changes.business_context
    description: Listing business context.
    categories:
      RENT: For rent.
      SALE: For sale.
  is_last_prediction:
    lineage:
      - datalake_ebdb_pricing.listing_prediction_changes.is_last_prediction
    description: Boolean indicating whether is the most recent prediction.
  is_last_prediction_of_day:
    lineage:
      - datalake_ebdb_pricing.listing_prediction_changes.is_last_prediction_of_day
    description: Boolean indicating whether is the most recent prediction of the day.
  ts_load:
    description: Timestamp of when the table was loaded.
