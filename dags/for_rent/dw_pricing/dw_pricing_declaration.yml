dag:
  name: dw_pricing
  schedule_start_date: 2022, 1, 1
  owner: Data ForSale
  documentation:
    dag_purpose: "This DAG loads to DW the pricing modeling, i.e., all the changes made to a listing price."
workflow:
  type: query_delta
  layer: dw
  custom_schema: listing
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: r5d.2xlarge
    node_type_id: r5d.xlarge
    num_workers: 2
    spark_version: 13.3.x-scala2.12
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
  databricks_conn_id: databricks_new
