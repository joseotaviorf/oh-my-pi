dag:
  name: dw_repairs
  schedule_start_date: 2022,12,31
  owner: Data ForRent
  criticality: High
  sla_deadline_localtime: "08:00"
  documentation:
    dag_purpose: |
      This modeling aims to provide operational information related to ongoing repair tickets.
workflow:
  type: query_delta
  layer: dw
  custom_schema: repairs
  default_extraction_type: full
  tables_customization:
    fact_ongoing_repairs:
      z_order_by:
        [
          sk_ticket,
          sk_request,
          sk_contract,
          sk_user,
          sk_agent,
          sk_budget_sender,
        ]
      merge_on: [sk_ticket]
    dim_ongoing_repairs:
      z_order_by: [sk_ticket]
