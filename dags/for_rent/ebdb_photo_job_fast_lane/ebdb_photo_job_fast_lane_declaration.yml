dag:
  name: ebdb_photo_job_fast_lane
  schedule_start_date: 2024,01,01
  schedule_interval: 0,30 * * * *
  owner: Data ForRent
  documentation:
    dag_purpose: |
      Fast lane DAG for high-frequency extraction of photographer_job table into data lake.
      This DAG runs every 30 minutes to provide near real-time updates for photo job data.
      EBDB is the main database for QuintoAndar.
workflow:
  type: cdc
  layer: raw
  database_type: mysql
  dbutils_secret_key: EBDB_DB
  source_database: ebdb
  source_schema: ebdb
  custom_schema: ebdb
  tables_customization:
    JobFotografo:
      clean_table_name: photographer_job
      raw_primary_keys: [id]
      clean_primary_keys: [id]
  extra_query_template_params:
    load_end_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, 1), 'load_end_date') }}"
