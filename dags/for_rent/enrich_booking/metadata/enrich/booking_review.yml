---
database_name: datalake_booking
table_name: booking_review
description: Enriched table that consolidates the booking review. Each line is a review for a specific booking.
domain: For Rent
owner: bruna.prates@quintoandar.com.br
columns:
  id_booking:
    description: Id of the booking.
    lineage:
      - datalake_ebdb_clean.booking.id
  review_status:
    description: Status of the booking review.
    categories:
      PENDING: 'Booking review pending, not yet answered.'
      DISMISSED: 'Booking review not answered.'
      DONE: 'Booking review has already been answered.'
    lineage:
      - datalake_insider_clean.review.status
  review_type:
    description: The type of the booking review. It concerns what the review is about and by whom it was done.
    lineage:
      - datalake_insider_clean.review.type
  visit_not_happened_reason:
    description: The reason why the visit didn't happen.
  wrong_listing_info:
    description: The wrong listing information reported if something in the listing does not correspond to the real house.
  no_offer_intent_reason:
    description: The reason why an offer was not made for the house.
  painting:
    description: The score (range 1-5) given regarding the painting of the house.
  cost_benefit:
    description: The score (range 1-5) given regarding the cost benefit of the house.
  conservation:
    description: The score (range 1-5) given regarding the conservation of the house.
  cleaning:
    description: The score (range 1-5) given regarding the cleanliness of the house.
  furniture:
    description: The score (range 1-5) given regarding the furniture of the house. If the house has no furniture, then it's null.
  natural_light:
    description: The score (range 1-5) given regarding the natural light of the house.
  indoor_silence:
    description: The score (range 1-5) given regarding the indoor silence of the house.
  agent_performance:
    description: The score (range 1-5) given regarding the performance of the agent.
  does_want_same_agent:
    description: Boolean indicating whether the tenant wants to be attended by the same agent on future visits.
  visit_type:
    description: The type of the visit.
    categories:
      presential: 'The visit is in-person'
      video: 'The visit is virtual'
  comment:
    description: Comments about the visit, answered to in free-form input field.
    lineage:
      - datalake_insider_clean.review.comment
  is_listing_accurate:
    description: Boolean indicating whether the listing corresponds to the real house.
  is_offer_intent:
    description: Boolean indicating whether there is an intention to make an offer for the house.
