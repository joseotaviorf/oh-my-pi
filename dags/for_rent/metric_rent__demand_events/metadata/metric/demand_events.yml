database_name: metric_rent
table_name: demand_events
description: This table contains the aggregated sum of demand events of For Rent, each line has the total volume of events related to the scope within the aggregation.
domain: For Rent
owner: jonas.fiorini@quintoandar.com.br
columns:
  halfyear:
    lineage:
    - dw_rent_snapshot.rent_demand_events_snapshot.halfyear
    description: 1 if the event month is from the first half of the year and 2 if it is from the last half.
    dimension: True
  quarter:
    lineage:
    - dw_rent_snapshot.rent_demand_events_snapshot.quarter
    description: Quarter information of the event date.
    dimension: True
  business_type:
    lineage:
    - dw_rent_snapshot.rent_demand_events_snapshot.business_type
    description: Business type related to the listing of the event.
    dimension: True
  city_group:
    lineage:
    - dw_rent_snapshot.rent_demand_events_snapshot.city_group
    description: Group which the city of the event belongs.
    dimension: True
  tier:
    lineage:
    - dw_rent_snapshot.rent_demand_events_snapshot.tier
    description: Tier information based on the city group of the event.
    dimension: True
  listing_category_start:
    lineage:
    - dw_rent_snapshot.rent_demand_events_snapshot.listing_category_start
    description: Listing category start information of the event.
    dimension: True
  rent_flow_origin:
    lineage:
    - dw_rent_snapshot.rent_demand_events_snapshot.rent_flow_origin
    description: Funnel first touchpoint information related to the event.
    dimension: True
  rental_administrator:
    lineage:
    - dw_rent_snapshot.rent_demand_events_snapshot.rental_administrator
    description: Rental administrator related to the event.
    dimension: True
  visits_booked:
    lineage:
    - dw_rent_snapshot.rent_demand_events_snapshot.visits_booked
    description: Total volume of visits booked within the aggregation.
    metric:
      name: Visits Booked
      description: Total volume of visits booked within the aggregation.
      acronym: VB
      is_additive: True
      business_stage: Demand
      hierarchy: Executive
      approved_by: sarah.rsilva@quintoandar.com.br
      link_to_metric: 'https://quintoandar.sa.looker.com/explore/sale_event/sale_demand_event?qid=VriFdAhegLapblm5xS3W0i&origin_space=2129&toggle=vis'
  visits_completed:
    lineage:
    - dw_rent_snapshot.rent_demand_events_snapshot.visits_completed
    description: Total volume of visits completed within the aggregation.
    metric:
      name: Visits Completed
      description: Total volume of visits completed within the aggregation.
      acronym: VC
      is_additive: True
      business_stage: Demand
      hierarchy: Operations Mgmt
      approved_by: bruno.choumar@quintoandar.com.br
      link_to_metric: 'https://quintoandar.sa.looker.com/looks/5320'
  offers_submitted:
    lineage:
    - dw_rent_snapshot.rent_demand_events_snapshot.offers_submitted
    description: Total volume of offers submitted within the aggregation.
    metric:
      name: Offers Submitted
      description: Total volume of offers submitted within the aggregation.
      acronym: OS
      is_additive: True
      business_stage: Demand
      hierarchy: Operations Mgmt
      approved_by: bruno.choumar@quintoandar.com.br
      link_to_metric: 'https://quintoandar.sa.looker.com/looks/5320'
  offers_accepted:
    lineage:
    - dw_rent_snapshot.rent_demand_events_snapshot.offers_accepted
    description: Total volume of offers accepted within the aggregation.
    metric:
      name: Offers Accepted
      description: Total volume of offers accepted within the aggregation.
      acronym: OA
      is_additive: True
      business_stage: Demand
      hierarchy: Operations Mgmt
      approved_by: bruno.choumar@quintoandar.com.br
      link_to_metric: 'https://quintoandar.sa.looker.com/looks/5320'
  evaluation_started:
    lineage:
    - dw_rent_snapshot.rent_demand_events_snapshot.evaluation_started
    description: Total volume of evaluations started within the aggregation.
    metric:
      name: Evaluation Started
      description: Total volume of evaluations started within the aggregation.
      acronym: ES
      is_additive: True
      business_stage: Demand
      hierarchy: operations mgmt
      approved_by: 'gustavo.geiger@quintoandar.com.br'
      link_to_metric: 'https://metabase.quintoandar.com.br/question#'
  evaluation_positive:
    lineage:
    - dw_rent_snapshot.rent_demand_events_snapshot.evaluation_positive
    description: Total volume of evaluations positive within the aggregation.
    metric:
      name: Evaluation Positive
      description: Total volume of evaluations positive within the aggregation.
      acronym: EP
      is_additive: True
      business_stage: Demand
      hierarchy: operations mgmt
      approved_by: 'gustavo.geiger@quintoandar.com.br'
      link_to_metric: 'https://metabase.quintoandar.com.br/question#'
  documentation_sent:
    lineage:
    - dw_rent_snapshot.rent_demand_events_snapshot.documentation_sent
    description: Total volume of documentations sent within the aggregation.
    metric:
      name: Documentation Sent
      description: Total volume of documentations sent within the aggregation.
      acronym: DS
      is_additive: True
      business_stage: Demand
      hierarchy: Operations Mgmt
      approved_by: bruno.choumar@quintoandar.com.br
      link_to_metric: 'https://quintoandar.sa.looker.com/looks/5320'
  credit_approved:
    lineage:
    - dw_rent_snapshot.rent_demand_events_snapshot.credit_approved
    description: Total volume of credits approved within the aggregation.
    metric:
      name: Credit Approved
      description: Total volume of credits approved within the aggregation.
      acronym: CA
      is_additive: True
      business_stage: Demand
      hierarchy: Operations Mgmt
      approved_by: bruno.choumar@quintoandar.com.br
      link_to_metric: 'https://quintoandar.sa.looker.com/looks/5320'
  contracts_created:
    lineage:
      - dw_rent_snapshot.rent_demand_events_snapshot.contracts_created
    description: Total volume of contracts created within the aggregation.
    metric:
      name: Contract Created
      description: Total volume of contracts created within the aggregation.
      acronym: CC
      is_additive: True
      business_stage: Demand
      hierarchy: Executive
      approved_by: matheus.madeira@quintoandar.com.br
      link_to_metric: ''
  contracts_signed:
    lineage:
    - dw_rent_snapshot.rent_demand_events_snapshot.contracts_signed
    description: Total volume of contracts signed within the aggregation.
    metric:
      name: Contract Signed
      description: Total volume of contracts signed within the aggregation.
      acronym: CS
      is_additive: True
      business_stage: Demand
      hierarchy: Executive
      approved_by: bruno.choumar@quintoandar.com.br
      link_to_metric: 'https://quintoandar.sa.looker.com/looks/5320'
  has_guarantee:
    lineage:
    - dw_rent_snapshot.rent_demand_events_snapshot.has_guarantee
    description: Boolean indicating if there's a guarantee related to the event.
    dimension: True
  dt_event:
    lineage:
    - dw_rent_snapshot.rent_demand_events_snapshot.dt_event
    description: Date of the event.
    dimension: True
  dt_week_started:
    lineage:
    - dw_rent_snapshot.rent_demand_events_snapshot.dt_week_started
    description: Week date of the event.
    dimension: True
  country_code:
    lineage:
    - dw_rent_snapshot.rent_demand_events_snapshot.country_code
    description: Country code information.
    dimension: True
  ts_load:
    description: Load date.
    dimension: True
