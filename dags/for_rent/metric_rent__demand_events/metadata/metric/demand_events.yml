database_name: metric_rent
table_name: demand_events
description: This table contains the aggregated sum of demand events of For Rent, each line has the total volume of events related to the scope within the agregation.
domain: For Rent
owner: felipe.chies@quintoandar.com.br
columns:
  business_type:
    lineage:
    - datalake_metric_rent_demand_event.metric_rent_demand_event.business_type
    description: Business type related to the listing of the event.
    dimension: True
  city_group:
    lineage:
    - datalake_metric_rent_demand_event.metric_rent_demand_event.city_group
    description: Group which the city of the event belongs.
    dimension: True
  guarantee:
    lineage:
    - datalake_metric_rent_demand_event.metric_rent_demand_event.guarantee
    description: Guarantee information related to the event.
    dimension: True
  halfyear:
    lineage:
    - datalake_metric_rent_demand_event.metric_rent_demand_event.halfyear
    description: 1 if the event month is from the first half of the year and 2 if it is from the last half.
    dimension: True
  listing_category_start:
    lineage:
    - datalake_metric_rent_demand_event.metric_rent_demand_event.listing_category_start
    description: Listing category start information of the event.
    dimension: True
  quarter:
    lineage:
    - datalake_metric_rent_demand_event.metric_rent_demand_event.quarter
    description: Quarter information of the event date.
    dimension: True
  rent_flow_origin:
    lineage:
    - datalake_metric_rent_demand_event.metric_rent_demand_event.rent_flow_origin
    description: Funnel first touchpoint information related to the event.
    dimension: True
  rental_administrator:
    lineage:
    - datalake_metric_rent_demand_event.metric_rent_demand_event.rental_administrator
    description: Rental administrator related to the event.
    dimension: True
  tier:
    lineage:
    - datalake_metric_rent_demand_event.metric_rent_demand_event.tier
    description: Tier information based on the city group of the event.
    dimension: True
  visits_booked:
    lineage:
    - datalake_metric_rent_demand_event.metric_rent_demand_event.visits_booked
    description: Total volume of visits booked within the aggregation.
    metric:
      name: Visits Booked
      description: Total volume of visits booked within the aggregation.
      acronym: VB
      is_additive: True
      business_stage: Demand
      hierarchy: Executive
      approved_by: sarah.rsilva@quintoandar.com.br
      link_to_metric: 'https://quintoandar.sa.looker.com/explore/sale_event/sale_demand_event?qid=VriFdAhegLapblm5xS3W0i&origin_space=2129&toggle=vis'
  visits_completed:
    lineage:
    - datalake_metric_rent_demand_event.metric_rent_demand_event.visits_completed
    description: Total volume of visits completed within the aggregation.
    metric:
      name: Visits Completed
      description: Total volume of visits completed within the aggregation.
      acronym: VC
      is_additive: True
      business_stage: Demand
      hierarchy: Operations Mgmt
      approved_by: bruno.choumar@quintoandar.com.br
      link_to_metric: 'https://quintoandar.sa.looker.com/looks/5320'
  offers_submitted:
    lineage:
    - datalake_metric_rent_demand_event.metric_rent_demand_event.offers_submitted
    description: Total volume of offers submitted within the aggregation.
    metric:
      name: Offers Submitted
      description: Total volume of offers submitted within the aggregation.
      acronym: OS
      is_additive: True
      business_stage: Demand
      hierarchy: Operations Mgmt
      approved_by: bruno.choumar@quintoandar.com.br
      link_to_metric: 'https://quintoandar.sa.looker.com/looks/5320'
  offers_accepted:
    lineage:
    - datalake_metric_rent_demand_event.metric_rent_demand_event.offers_accepted
    description: Total volume of offers accepted within the aggregation.
    metric:
      name: Offers Accepted
      description: Total volume of offers accepted within the aggregation.
      acronym: OA
      is_additive: True
      business_stage: Demand
      hierarchy: Operations Mgmt
      approved_by: bruno.choumar@quintoandar.com.br
      link_to_metric: 'https://quintoandar.sa.looker.com/looks/5320'
  evaluation_started:
    lineage:
    - datalake_metric_rent_demand_event.metric_rent_demand_event.evaluation_started
    description: Total volume of evaluations started within the aggregation.
    metric:
      name: Evaluation Started
      description: Total volume of evaluations started within the aggregation.
      acronym: ES
      is_additive: True
      business_stage: Demand
      hierarchy: operations mgmt
      approved_by: 'gustavo.geiger@quintoandar.com.br'
      link_to_metric: 'https://metabase.quintoandar.com.br/question#'
  evaluation_positive:
    lineage:
    - datalake_metric_rent_demand_event.metric_rent_demand_event.evaluation_positive
    description: Total volume of evaluations positive within the aggregation.
    metric:
      name: Evaluation Positive
      description: Total volume of evaluations positive within the aggregation.
      acronym: EP
      is_additive: True
      business_stage: Demand
      hierarchy: operations mgmt
      approved_by: 'gustavo.geiger@quintoandar.com.br'
      link_to_metric: 'https://metabase.quintoandar.com.br/question#'
  documentation_sent:
    lineage:
    - datalake_metric_rent_demand_event.metric_rent_demand_event.documentation.sent
    description: Total volume of documentations sent within the aggregation.
    metric:
      name: Documentation Sent
      description: Total volume of documentations sent within the aggregation.
      acronym: DS
      is_additive: True
      business_stage: Demand
      hierarchy: Operations Mgmt
      approved_by: bruno.choumar@quintoandar.com.br
      link_to_metric: 'https://quintoandar.sa.looker.com/looks/5320'
  credit_approved:
    lineage:
    - datalake_metric_rent_demand_event.metric_rent_demand_event.credit_approved
    description: Total volume of credits approved within the aggregation.
    metric:
      name: Credit Approved
      description: Total volume of credits approved within the aggregation.
      acronym: CA
      is_additive: True
      business_stage: Demand
      hierarchy: Operations Mgmt
      approved_by: bruno.choumar@quintoandar.com.br
      link_to_metric: 'https://quintoandar.sa.looker.com/looks/5320'
  contracts_signed:
    lineage:
    - datalake_metric_rent_demand_event.metric_rent_demand_event.contracts_signed
    description: Total volume of contracts signed within the aggregation.
    metric:
      name: Contract Signed
      description: Total volume of contracts signed within the aggregation.
      acronym: CS
      is_additive: True
      business_stage: Demand
      hierarchy: Executive
      approved_by: bruno.choumar@quintoandar.com.br
      link_to_metric: 'https://quintoandar.sa.looker.com/looks/5320'
  dt_event:
    lineage:
    - datalake_metric_rent_demand_event.metric_rent_demand_event.dt_event
    description: Date of the event.
    dimension: True
  dt_week_started:
    lineage:
    - datalake_metric_rent_demand_event.metric_rent_demand_event.dt_week_started
    description: Week date of the event.
    dimension: True
  year:
    lineage:
    - datalake_metric_rent_demand_event.metric_rent_demand_event.year
    description: Year information of the event date.
    dimension: True
  month:
    lineage:
    - datalake_metric_rent_demand_event.metric_rent_demand_event.month
    description: Month information of the event date.
    dimension: True
  day:
    lineage:
    - datalake_metric_rent_demand_event.metric_rent_demand_event.day
    description: Day information of the event date.
    dimension: True
  country_code: 
    lineage:
    - datalake_metric_rent_demand_event.metric_rent_demand_event.country_code
    description: Country code information.
    dimension: True
  ts_load:
    description: Load date.
    dimension: True