database_name: metric_rent
table_name: cohort_conversions_volumes
description: This table contains the volume of ForRent Demand events that were converted or not.
  Each line has the total volume of the cohort related to the scope within the aggregation.
domain: For Rent
owner: jonas.fiorini@quintoandar.com.br
columns:
  halfyear:
    lineage:
      - dw_rent_snapshot.rent_cohort_conversions_snapshot.halfyear
    description: 1 if the base event month is from the first half of the year and 2 if it is from the last half.
    dimension: True
  quarter:
    lineage:
      - dw_rent_snapshot.rent_cohort_conversions_snapshot.quarter
    description: Quarter information of the base event date.
    dimension: True
  business_type:
    lineage:
      - dw_rent_snapshot.rent_cohort_conversions_snapshot.business_type
    description: Business type related to the listing of the base event.
    dimension: True
  city_group:
    lineage:
      - dw_rent_snapshot.rent_cohort_conversions_snapshot.city_group
    description: Group which the city of the base event belongs.
    dimension: True
  tier:
    lineage:
      - dw_rent_snapshot.rent_cohort_conversions_snapshot.tier
    description: Tier information based on the city group of the base event.
    dimension: True
  listing_category_start:
    lineage:
      - dw_rent_snapshot.rent_cohort_conversions_snapshot.listing_category_start
    description: Listing category start information of the base event.
    dimension: True
  rent_flow_origin:
    lineage:
      - dw_rent_snapshot.rent_cohort_conversions_snapshot.rent_flow_origin
    description: Funnel first touchpoint information related to the base event.
    dimension: True
  rental_administrator:
    lineage:
      - dw_rent_snapshot.rent_cohort_conversions_snapshot.rental_administrator
    description: Rental administrator related to the base event.
    dimension: True
  weeks_to_conversion:
    lineage:
      - dw_rent_snapshot.rent_cohort_conversions_snapshot.weeks_to_conversion
    description: Weeks to conversion, which means how many weeks the base event too the be converted.
      If the week to conversion is -1, it means that the event wasn't converted yet.
    dimension: True
  vb_unconverted:
    lineage:
      - dw_rent_snapshot.rent_cohort_conversions_snapshot.vb_unconverted
    description: Volume of unconverted visits booked within the aggregation.
    metric:
      name: Visit Booked Unconverted
      description: The volume of scheduled visits that weren't converted yet.
      acronym: ''
      is_additive: False
      business_stage: Demand
      hierarchy: Operations Mgmt
      approved_by: matheus.madeira@quintoandar.com.br
      link_to_metric: ''
  vc_unconverted:
    lineage:
      - dw_rent_snapshot.rent_cohort_conversions_snapshot.vc_unconverted
    description: Volume of unconverted visits completed within the aggregation.
    metric:
      name: Visit Completed Unconverted
      description: The volume of completed visits that weren't converted yet.
      acronym: ''
      is_additive: False
      business_stage: Demand
      hierarchy: Operations Mgmt
      approved_by: matheus.madeira@quintoandar.com.br
      link_to_metric: ''
  os_unconverted:
    lineage:
      - dw_rent_snapshot.rent_cohort_conversions_snapshot.os_unconverted
    description: Volume of unconverted offers submitted within the aggregation.
    metric:
      name: Offer Submitted Unconverted
      description: The volume of submitted offers that weren't converted yet.
      acronym: ''
      is_additive: False
      business_stage: Demand
      hierarchy: Operations Mgmt
      approved_by: matheus.madeira@quintoandar.com.br
      link_to_metric: ''
  oa_unconverted:
