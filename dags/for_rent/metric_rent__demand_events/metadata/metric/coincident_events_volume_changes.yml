database_name: metric_rent
table_name: coincident_events_volume_changes
description: This table contains the aggregated sum of coincident events of For Rent, based on a time variation which allows
  to understand data updates through time (historical data being retroactively updated).
  The D-1 reference type refers to the current day load looking to the events that happened on the day before. The columns that shows the volume
  differences for this time visualization are always null;
  The W1-W5 reference type refers to the current day load looking to the events that happened one to five weeks ago. The column that shows the
  volume differences for this time visualization is comparing to the end of week's load of the related week. For example, if we're currently on
  the week of 28/08/23. The W1-W5 weeks goes from 24/07/23 to 21/08/23. In order to check the load differences, we're calculating the current day load
  volume for the mentioned related weeks minus the load volume that happened on the last day of each week (which in this case would be the load of
  the days 30/07 for the W1 week, 06/08 for the W2, 13/08 for the W3, 20/08 for the W4 and 27/08 for the W5);
  The LM (Last Month) reference type refers to the current day load looking to the events that happened on the past month. The columns that shows the
  volume differences for this time visualization are comparing to the load that happened on the last day of the previous month;
  The LQ (Last Quarter) reference type refers to the current day load looking to the events that happened on the past quarter. The columns that shows the
  volume differences for this time visualization are comparing to the load that happened on the last day of the previous quarter;
  The LY (Last Year) reference type refers to the current day load looking to the events that happened on the past year. The columns that shows the
  volume differences for this time visualization are comparing to the load that happened on the last day of the previous year (e.g. the load of
  December 31 of the past year).
  This table is partitioned by country_code, year, month and day columns -- which should be used in analysis, following that order, to improve the
  query's performance.
  Each line has the total volume of the coincident events on different days within several dimensions.
domain: For Rent
owner: jonas.fiorini@quintoandar.com.br
columns:
  reference_type:
    lineage:
      - dw_rent_snapshot.coincident_events_volume_changes_snapshot.reference_type
    description: Reference type of the current time visualization.
    categories:
      D-1: Current day load looking to the events that happened on the day before (D-1).
      W1-W5: Current day load looking to the events that happened on one to five weeks ago.
      LM: Current day load looking to the events that happened on the last month.
      LQ: Current day load looking to the events that happened on the last quarter.
      LY: Current day load looking to the events that happened on the last year.
    dimension: True
  visits_booked:
    lineage:
      - dw_rent_snapshot.coincident_events_volume_changes_snapshot.visits_booked
    description: Total volume of visits booked within the aggregation.
    metric:
      name: Visits Booked
      description: Total volume of visits booked within the aggregation.
      acronym: VB
      is_additive: True
      business_stage: Demand
      hierarchy: Executive
      approved_by: sarah.rsilva@quintoandar.com.br
      link_to_metric: 'https://quintoandar.sa.looker.com/explore/sale_event/sale_demand_event?qid=VriFdAhegLapblm5xS3W0i&origin_space=2129&toggle=vis'
  diff_vb:
    lineage:
      - dw_rent_snapshot.coincident_events_volume_changes_snapshot.diff_vb
    description: The volume difference of the visits booked within the aggregation, compared to the present day load of the reference type.
      Every reference type has a different time window to visualize the differences (e.g. for D-1 it has no difference check (it's always null),
      but for W1-W5 it checks the data volume load of the end of the week of each week in focus, comparing to the present day load related to
      these weeks. For LM, it checks the data volume load of the last day of the previous month, comparing to the present day load related to
      the past month. For LQ, it checks the data volume load of the last day of the previous quarter, comparing to the present day load related to
      the past quarter. For LY, it checks the data volume load of the last day of the previous year, comparing to the present day load related to
      the past year. Follows the same rule for all difference check columns).
    dimension: True
  percentage_diff_vb:
    lineage:
      - dw_rent_snapshot.coincident_events_volume_changes_snapshot.percentage_diff_vb
    description: The difference amount of VBs in percentage.
    dimension: True
  visits_completed:
