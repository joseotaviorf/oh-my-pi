dag:
  name: enrich_repairs
  schedule_start_date: 2023, 11, 24
  owner: Data ForRent
  documentation:
    dag_purpose: This dag aims to execute the bases related to the repair ongoing flow.
workflow:
  type: query_delta
  layer: enrich
  default_extraction_type: full
  tables_customization:
    repair_tickets:
      z_order_by: [id_ticket, id_request, id_contract]
      merge_on: [id_ticket]
    ongoing_repair_tickets:
      z_order_by: [id_ticket, id_request, id_contract]
