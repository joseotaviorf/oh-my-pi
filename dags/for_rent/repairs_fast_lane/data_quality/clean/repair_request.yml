alert_channel: "#alerts-de-airflow-dags"
table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error
column_level_validations:
  id:
    is_unique:
      severity_level: Error
    is_complete:
      severity_level: Error
  id_contract:
    is_complete:
      severity_level: Error
  id_house:
    has_completeness:
      greater_than: 0.80
      severity_level: Error
  status:
    has_completeness:
      greater_than: 0.90
      severity_level: Error
  ts_created:
    is_complete:
      severity_level: Error
  ts_updated:
    is_complete:
      severity_level: Error