dag:
  name: enrich_offboarding
  schedule_start_date: 2020, 7, 1
  owner: Data ForRent
  criticality: Critical
  sla_deadline_localtime: "08:00"
  documentation:
    dag_purpose: Compile different tables of offboading context, to better elaborate questions about it.
workflow:
  type: query_delta
  layer: enrich
  inner_dependencies:
    customer_support:
      - ongoing
    consolidate_data:
      - budgeting_window
      - customer_support
      - inspection_analysis
      - ongoing
      - tickets
      - nps_agg
    inspection_analysis:
      - ongoing
    ongoing:
      - contract_termination
    nps:
      - contract_termination
    nps_agg:
      - nps
    tickets:
      - ongoing
    mediations:
      - contract_termination
  tables_customization:
    mediations:
      merge_on: ["id_termination"]
      z_order_by: ["ts_termination_updated", "id_termination"]
