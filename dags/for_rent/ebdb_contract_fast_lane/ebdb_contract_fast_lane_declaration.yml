dag:
  name: ebdb_contract_fast_lane
  schedule_start_date: 2024,01,01
  schedule_interval: 0,30 * * * *
  owner: Data ForRent
  documentation:
    dag_purpose: |
      DAG containing tables from Contract context that are running every 30 minutes.
workflow:
  type: cdc
  layer: raw
  database_type: mysql
  dbutils_secret_key: EBDB_DB
  source_database: ebdb
  source_schema: ebdb
  custom_schema: ebdb_test
  tables_customization:
    Contrato:
      clean_table_name: contract
      clean_primary_keys: [id]
      clean_z_order_by: [id_user, id_house]
cluster:
  type: custom_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    driver_node_type_id: r-fleet.xlarge
    node_type_id: r-fleet.xlarge
    num_workers: 2
    spark_version: 13.3.x-scala2.12
    aws_attributes:
      availability: ON_DEMAND
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
