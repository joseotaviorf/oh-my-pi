dag:
  name: property_tax
  schedule_start_date: 2020, 7, 20
  schedule_interval: 0 3 * * *
  owner: Data ForRent
  documentation:
    dag_purpose: This DAG brings [PropertyTax](https://github.com/quintoandar/property-tax) data, service responsible for updating municipal taxes for ongoing contracts.
workflow:
  type: cdc
  layer: raw
  database_type: postgres
  dbutils_secret_key: PROPERTY_TAX_DB
  source_schema: public
  tables_customization:
    tax_report:
      database_column_alias:
        year: year_tax_report
    report_version: {}
    report_item: {}
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: m5a.xlarge
    node_type_id: m5a.xlarge
    num_workers: 2
    spark_version: 13.3.x-scala2.12
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
  databricks_conn_id: databricks_new
