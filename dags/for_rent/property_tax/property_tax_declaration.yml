dag:
  name: property_tax
  schedule_start_date: 2020, 7, 20
  schedule_interval: 0 3,8,12 * * *
  owner: Data ForRent
  documentation:
    dag_purpose: This DAG brings [PropertyTax](https://github.com/quintoandar/property-tax) data, service responsible for updating municipal taxes for ongoing contracts.
workflow:
  source_database: propertytax
  custom_schema: property_tax
  type: cdc
  layer: raw
  database_type: postgres
  dbutils_secret_key: PROPERTY_TAX_DB
  source_schema: public
  tables_customization:
    tax_report:
      database_column_alias:
        year: year_tax_report
    report_version: {}
    report_item: {}
