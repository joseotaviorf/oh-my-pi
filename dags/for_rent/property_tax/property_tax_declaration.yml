---
dag:
  name: property_tax
  schedule_start_date: 2020, 7, 20
  schedule_interval: 0 3 * * *
  owner: Data ForRent
workflow:
  type: database_pull_delta
  layer: raw
  database_type: postgres
  dbutils_secret_key: PROPERTY_TAX_DB
  default_extraction_type: incremental
  default_partitions: ["year", "month", "day"]
  tables_customization:
    tax_report:
      date_filter_column: updated_at
      read_from_sql: True
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: m5a.xlarge
    node_type_id: m5a.large
    num_workers: 1
    spark_version: 13.3.x-scala2.12
