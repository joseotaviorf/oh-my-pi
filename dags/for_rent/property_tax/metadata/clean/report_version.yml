---
database_name: datalake_property_tax_clean
table_name: report_version
description: Represents each IPTU update submission.
  A tax_report is associated with at least one report_version.
  Up to two (if the updated value is edited).
domain: For Rent
owner: gustavo.silva@quintoandar.com.br
columns:
  id_report_version:
    lineage:
      - datalake_property_tax_raw.report_version.id
    description: Primary key of a single IPTU update submission sent by landlord or tenant.
  id_tax_report:
    lineage:
      - datalake_property_tax_raw.report_version.tax_report_id
    description: Foreign key linking the submission to the annual IPTU report for the house.
  id_author:
    lineage:
      - datalake_property_tax_raw.report_version.author_id
    description: ID user who sent the report.
  tenant_email_status:
    lineage:
      - datalake_property_tax_raw.report_version.tenant_email_status
    description: Delivery and acknowledgment status of the IPTU update email sent to the tenant.
    categories:
      report-version.tenant-email-status/ready-to-send: The report is ready to send.
      report-version.tenant-email-status/manually-sent: The report was sent manually.
      report-version.tenant-email-status/canceled: The report was canceled.
      report-version.tenant-email-status/sent: The report was sent.
  landlord_email_status:
    lineage:
      - datalake_property_tax_raw.report_version.landlord_email_status
    description: Landlord's report status.
    categories:
      report-version.landlord-email-status/ready-to-send: The report is ready to send.
      report-version.landlord-email-status/manually-sent: The report was sent manually.
      report-version.landlord-email-status/canceled: The report was canceled.
      report-version.landlord-email-status/sent: The report was sent.
  ts_created:
    lineage:
      - datalake_property_tax_raw.report_version.created_at
    description: Timestamp when the register was created.
  ts_sent:
    lineage:
      - datalake_property_tax_raw.report_version.sent_at
    description: Timestamp when the report was sent.
  ts_tenant_email_sent:
    lineage:
      - datalake_property_tax_raw.report_version.tenant_email_sent_at
    description: Timestamp when the tenant submited the report.
  ts_landlord_email_sent:
    lineage:
      - datalake_property_tax_raw.report_version.landlord_email_sent_at
    description: Timestamp when the landlord submited the report.
