---
database_name: datalake_property_tax_clean
table_name: report_item
description: Represents each item that composes the property's IPTU.
  A report_version is associated with at least one report_item, referring to the IPTU
  of the property. Additional IPTUs (e.g. parking spaces) are also represented as a report_item.
domain: For Rent
owner: gustavo.silva@quintoandar.com.br
columns:
  id_report_item:
    lineage:
      - datalake_property_tax_raw.report_item.id
    description: Primary key of the IPTU line item within a property tax report version.
  id_report_version:
    lineage:
      - datalake_property_tax_raw.report_item.report_version_id
    description: Foreign key linking the IPTU item to its parent report submission.
  id_external_document:
    lineage:
      - datalake_property_tax_raw.report_item.document_external_id
    description: Identifier of the supporting document stored in the external document service.
  "description":
    lineage:
      - datalake_property_tax_raw.report_item.description
    description: Free-text description of the IPTU report item from the property tax source.
  is_finished:
    lineage:
      - datalake_property_tax_raw.report_item.finished
    description: Boolean flag indicating if the report was finished.
  value:
    lineage:
      - datalake_property_tax_raw.report_item.value
    description: Monetary amount declared for this IPTU line item in Brazilian reais.
  installments:
    lineage:
      - datalake_property_tax_raw.report_item.installments
    description: Count of payment installments configured for this IPTU charge.
  ts_created:
    lineage:
      - datalake_property_tax_raw.report_item.created_at
    description: Timestamp when the register was created.
