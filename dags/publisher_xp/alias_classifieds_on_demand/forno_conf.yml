dag_documentation:
  dag_purpose:
    "Alias Classifieds on-demand pipeline (forno). Runs alias_classifieds and
    alias_classifieds_publisher for a specific company or publisher. Requires
    'company_uuid' or 'publisher_id' in dag_run.conf. Triggered manually via
    the Airflow UI or REST API — never runs automatically."
kafka_bootstrap_servers: lkc-256gpm-jv0e34.us-east-1.aws.glb.confluent.cloud:9092
kafka_topic: prod_alias.listing.ingest.event

custom_cluster:
  driver_node_type_id: m5d.large
  node_type_id: m5d.large
  num_workers: 1
  spark_version: 16.4.x-scala2.12
  aws_attributes:
    ebs_volume_size: 200
    instance_profile_arn: "{{ var.value.instance_profile_secret_arn_vespucio }}"
  init_scripts:
    - s3:
        destination: "{{ var.value.artifacts_bucket }}/bi-etl-ejuice/init_script.sh"
        region: "us-east-1"
  spark_conf:
    spark.driver.extraJavaOption: "-verbose:gc -XX:+PrintGCDetails -XX:+PrintGCDateStamps -XX:+UseG1GC"
    spark.executor.extraJavaOptions: "-verbose:gc -XX:+PrintGCDetails -XX:+PrintGCDateStamps -XX:+UseG1GC"
    spark.executor.heartbeatInterval: "100s"
    spark.network.timeout: "600s"
    spark.metrics.appStatusSource.enabled: "true"
    spark.eventLog.enabled: "false"
