dag_documentation:
  dag_purpose:
    "Alias Classifieds on-demand pipeline (prod). Runs alias_classifieds and
    alias_classifieds_publisher for a specific company or publisher. Requires
    'company_uuid' or 'publisher_id' in dag_run.conf. Triggered manually via
    the Airflow UI or REST API — never runs automatically."
