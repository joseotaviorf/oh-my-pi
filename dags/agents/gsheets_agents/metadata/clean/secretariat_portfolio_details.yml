---
database_name: datalake_gsheets_clean
table_name: secretariat_portfolio_details
description:
  The secretariat_portfolio and secretariat_portfolio_details tables are used to record the service relationship between secretaries and For Sale brokers. 
  Each broker and their clients are served by a dedicated secretary, who provides support to both with the aim of facilitating the For Sale journey.

  Both secretaries and brokers serve a portfolio of regions or business units, or a grouping of these units. However, the association of these portfolios 
  with Agents changes over time, making it necessary to record the relationship between portfolios, broker and secretary per month.

  This table, secretariat_portfolio_details, records the history of secretaries' allocations per month in the portfolios, in addition to 
  indicating who their direct supervisor is.
domain: Data Agents
owner: data-ae-agents@quintoandar.com.br
columns:
  email_secretary:
    lineage:
      - datalake_gsheets_raw.secretariat_portfolio_details.email_secretary
    description: Secretary's email.
  email_supervisor:
    lineage:
      - datalake_gsheets_raw.secretariat_portfolio_details.email_supervisor
    description: Secretary's Supervisor Email.
  portfolio_group:
    lineage:
      - datalake_gsheets_raw.secretariat_portfolio_details.portfolio_group
    description: 
      A portfolio group may refer to a grouping of business units or regions, which is served by the secretary during a given period.
      Only the secretary can serve several portfolios, while the broker is dedicated to the clients of a single portfolio.
  portfolio:
    lineage:
      - datalake_gsheets_raw.secretariat_portfolio_details.portfolio
    description: A portfolio may refer to a business unit or a region, which is served by the secretary in the determined period.
  dt_reference:
    lineage:
      - datalake_gsheets_raw.secretariat_portfolio_details.dt_reference
    description: Reference date for the month in which this association of secretary, supervisor and portfolios is valid.
