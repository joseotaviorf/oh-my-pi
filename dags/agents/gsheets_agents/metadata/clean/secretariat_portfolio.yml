---
database_name: datalake_gsheets_clean
table_name: secretariat_portfolio
description: 
  The secretariat_portfolio and secretariat_portfolio_details tables are used to record the service relationship between secretaries and For Sale brokers. 
  Each broker and their clients are served by a dedicated secretary, who provides support to both with the aim of facilitating the For Sale journey.

  Both secretaries and brokers serve a portfolio of regions or business units, or a grouping of these units. However, the association of these portfolios 
  with Agents changes over time, making it necessary to record the relationship between portfolios, broker and secretary per month.

  This table, secretariat_portfolio, records the relationship of who the broker is, which portfolio they are serving and which month this association refers to.
domain: Data Agents
owner: data-ae-agents@quintoandar.com.br
columns:
  id_agent:
    lineage:
      - datalake_gsheets_raw.secretariat_portfolio.sk_user_agent
    description: Unique Agent ID.
  portfolio:
    lineage:
      - datalake_gsheets_raw.secretariat_portfolio.portfolio
    description: A portfolio can refer to a business unit or a region, which is served by the broker in the determined period.
  dt_reference:
    lineage:
      - datalake_gsheets_raw.secretariat_portfolio.dt_reference
    description: Reference date for the month in which this association of broker and portfolio is valid.
