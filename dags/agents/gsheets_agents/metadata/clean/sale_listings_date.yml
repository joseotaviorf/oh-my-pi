database_name: datalake_gsheets_clean
table_name: sale_listings_date
description:
  Provides allocation dates for sale listings recorded via GSheets.
  Each row represents a listing and its allocation date.
domain: Agents
owner: gustavo.rompe@quintoandar.com.br
columns:
  id_listing:
    lineage:
      - datalake_gsheets_raw.sale_listings_date.listing_id
    description: QuintoAndar listing identifier for the for-sale property tracked in the agent allocation spreadsheet.
  dt_alloc:
    lineage:
      - datalake_gsheets_raw.sale_listings_date.dt_alloc
    description: Calendar date when the sale listing was assigned to an agent according to the GSheets allocation log.
  ts_load:
    description: Date when the table data was updated.
