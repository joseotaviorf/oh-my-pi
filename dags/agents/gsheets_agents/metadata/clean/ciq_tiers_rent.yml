database_name: datalake_gsheets_clean
table_name: ciq_tiers_rent
description: Table containing the calculation of Tiers and monthly Revenue Share values for CIQs in the Rent context.
  The table in question may not follow the tiering rules used in the datalake. 
  It is the sole responsibility of the CIQ Experience team.
domain: Agents
owner: gustavo.rompe@quintoandar.com.br
columns:
  id_user:
    description: Unique identifier of the user (CIQ member) in the Rent context.
    lineage:
      - datalake_gsheets_raw.ciq_tiers_rent.id_user
  id_partner:
    description: Unique identifier of the partner in the partner structure.
    lineage:
      - datalake_gsheets_raw.ciq_tiers_rent.id_partner
  status_ciq:
    description: CIQ status for the partnership; de-registrations stop at the last valid partnership.
    lineage:
      - datalake_gsheets_raw.ciq_tiers_rent.status_ciq
  ciq_type:
    description: Type/category of the CIQ partnership.
    lineage:
      - datalake_gsheets_raw.ciq_tiers_rent.ciq_type
  city_group_partner:
    description: Operating city for agents or main acquisition city for the Only segment.
    lineage:
      - datalake_gsheets_raw.ciq_tiers_rent.city_group_partner
  dt_start_audit:
    description: Start date for the audit period considered in the calculation.
    lineage:
      - datalake_gsheets_raw.ciq_tiers_rent.dt_start_audit
  dt_end_audit:
    description: End date for the audit period considered in the calculation.
    lineage:
      - datalake_gsheets_raw.ciq_tiers_rent.dt_end_audit
  n_fl:
    description: Total number of First Listings captured in the period.
    lineage:
      - datalake_gsheets_raw.ciq_tiers_rent.n_fl
  n_fl_valid:
    description: Number of First Listings considered valid (published for at least 15 days).
    lineage:
      - datalake_gsheets_raw.ciq_tiers_rent.n_fl_valid
  dt_start_validity:
    description: Start date for the payment value validity period.
    lineage:
      - datalake_gsheets_raw.ciq_tiers_rent.dt_start_validity
  dt_end_validity:
    description: End date for the payment value validity period.
    lineage:
      - datalake_gsheets_raw.ciq_tiers_rent.dt_end_validity
  rev_share:
    description: Default Revenue Share value paid for valid outcomes.
    lineage:
      - datalake_gsheets_raw.ciq_tiers_rent.rev_share
  ts_updated:
    description: Timestamp of the last update to this record.
    lineage:
      - datalake_gsheets_raw.ciq_tiers_rent.ts_updated
  ts_load:
    description: Date when the table data was updated.