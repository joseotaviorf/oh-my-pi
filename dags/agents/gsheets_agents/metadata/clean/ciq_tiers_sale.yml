database_name: datalake_gsheets_clean
table_name: ciq_tiers_sale
description: Table containing the calculation of Tiers and quarterly Revenue Share values for CIQs in the Sale context.
  The table in question may not follow the tiering rules used in the datalake. 
  It is the sole responsibility of the CIQ Experience team.
domain: Agents
owner: gustavo.rompe@quintoandar.com.br
columns:
  id_user:
    description: Unique identifier of the user (CIQ member) in the Sale context.
    lineage:
      - datalake_gsheets_raw.ciq_tiers_sale.id_user
  id_partner:
    description: Unique identifier of the partner in the partner structure.
    lineage:
      - datalake_gsheets_raw.ciq_tiers_sale.id_partner
  status_ciq:
    description: CIQ status for the partnership; de-registrations stop at the last valid partnership.
    lineage:
      - datalake_gsheets_raw.ciq_tiers_sale.status_ciq
  ciq_type:
    description: Type/category of the CIQ partnership.
    lineage:
      - datalake_gsheets_raw.ciq_tiers_sale.ciq_type
  city_group_partner:
    description: Operating city for agents or main acquisition city for the Only segment.
    lineage:
      - datalake_gsheets_raw.ciq_tiers_sale.city_group_partner
  dt_start_audit:
    description: Start date for the audit period considered in the calculation.
    lineage:
      - datalake_gsheets_raw.ciq_tiers_sale.dt_start_audit
  dt_end_audit:
    description: End date for the audit period considered in the calculation.
    lineage:
      - datalake_gsheets_raw.ciq_tiers_sale.dt_end_audit
  n_ccvs:
    description: Total number of purchase and sale agreements (CCVs) in the period.
    lineage:
      - datalake_gsheets_raw.ciq_tiers_sale.n_ccvs
  n_ccvs_ht:
    description: Number of High Ticket purchase and sale agreements (CCVs) in the period.
    lineage:
      - datalake_gsheets_raw.ciq_tiers_sale.n_ccvs_ht
  value_vgv:
    description: Total sales value (VGV) aggregated for the period.
    lineage:
      - datalake_gsheets_raw.ciq_tiers_sale.value_vgv
  value_vgv_ht:
    description: Total sales value for High Ticket transactions (VGV HT) aggregated for the period.
    lineage:
      - datalake_gsheets_raw.ciq_tiers_sale.value_vgv_ht
  dt_start_validity:
    description: Start date for the Revenue Share validity period.
    lineage:
      - datalake_gsheets_raw.ciq_tiers_sale.dt_start_validity
  dt_end_validity:
    description: End date for the Revenue Share validity period.
    lineage:
      - datalake_gsheets_raw.ciq_tiers_sale.dt_end_validity
  rev_share_default:
    description: Default Revenue Share value paid for valid outcomes.
    lineage:
      - datalake_gsheets_raw.ciq_tiers_sale.rev_share_default
  rev_share_ht:
    description: Revenue Share value applicable to High Ticket properties (may match default by range).
    lineage:
      - datalake_gsheets_raw.ciq_tiers_sale.rev_share_ht
  value_ht_reference:
    description: Reference value used to classify a transaction as High Ticket for a specific region.
    lineage:
      - datalake_gsheets_raw.ciq_tiers_sale.value_ht_reference
  ts_updated:
    description: Timestamp of the last update to this record.
    lineage:
      - datalake_gsheets_raw.ciq_tiers_sale.ts_updated
  ts_load:
    description: Date when the table data was updated.