database_name: datalake_gsheets_clean
table_name: ciq_portfolio
description:
  Contains CIQ partner allocations to clusters and portfolios.
  Each row maps a CIQ partner to the cluster and the user's portfolio where it belongs.
domain: Agents
owner: gustavo.rompe@quintoandar.com.br
columns:
  id_partner:
    description: Id partner of CIQ.
    lineage:
      - datalake_gsheets_raw.ciq_portfolio.ciq_id
  portfolio_user_name:
    description: User's portfolio in which it is allocated.
    lineage:
      - datalake_gsheets_raw.ciq_portfolio.carteira
  cluster_name:
    description: Cluster of CIQ.
    lineage:
      - datalake_gsheets_raw.ciq_portfolio.cluster
  ts_created:
    description: Date the record was created in the spreadsheet. The first occurrence of the record is considered as the allocation date in the portfolio.
    lineage:
      - datalake_gsheets_raw.ciq_portfolio.ts_load
  year:
    description: Partition column (year) for the table load date.
    lineage:
      - datalake_gsheets_raw.ciq_portfolio.ts_load
  month:
    description: Partition column (month) for the table load date.
    lineage:
      - datalake_gsheets_raw.ciq_portfolio.ts_load
  day:
    description: Partition column (day) for the table load date.
    lineage:
      - datalake_gsheets_raw.ciq_portfolio.ts_load
  ts_load:
    description: Date when the table data was updated.