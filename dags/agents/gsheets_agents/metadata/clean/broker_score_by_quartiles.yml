---
database_name: datalake_gsheets_clean
table_name: broker_score_by_quartiles
description: |
  Contains broker scores grouped by performance quartiles.
  Note: The source spreadsheet is generated from the datalake; it should not be used as a dependency for other tables.
domain: Agents
owner: data-ae-agents@quintoandar.com.br
columns:
  id_user_agent:
    description: Unique identifier of the user associated with the broker
    lineage:
      - datalake_gsheets_raw.brokerage_fee_tiers.sk_user_agent
  id_agent:
    description: Unique identifier of the broker (agent)
    lineage:
      - datalake_gsheets_raw.brokerage_fee_tiers.sk_agent
  month_description:
    description: Human-readable month description for the score record
    lineage:
      - datalake_gsheets_raw.brokerage_fee_tiers.mes_descritivo
  square:
    description: Hub region or location related to the broker
    lineage:
      - datalake_gsheets_raw.brokerage_fee_tiers.praca
  hub:
    description: Name of the hub where the broker operates
    lineage:
      - datalake_gsheets_raw.brokerage_fee_tiers.hub
  quartile:
    description: Performance quartile assigned to the broker (1 lowest, 4 highest)
    lineage:
      - datalake_gsheets_raw.brokerage_fee_tiers.quartil
  score_gp:
    description: Performance score (general performance - GP) for the broker
    lineage:
      - datalake_gsheets_raw.brokerage_fee_tiers.score_gp
  month:
    description: Numeric month associated with the quartile classification
    lineage:
      - datalake_gsheets_raw.brokerage_fee_tiers.mes
  year:
    description: Year associated with the quartile classification
    lineage:
      - datalake_gsheets_raw.brokerage_fee_tiers.ano
  ts_load:
    description: Date when the table data was updated.
  