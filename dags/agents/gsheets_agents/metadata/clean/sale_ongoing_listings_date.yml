database_name: datalake_gsheets_clean
table_name: sale_ongoing_listings_date
description:
  Provides ongoing allocation dates for sale listings recorded via GSheets.
  Each row represents a listing currently in progress and its allocation date.
domain: Agents
owner: gustavo.rompe@quintoandar.com.br
columns:
  id_listing:
    lineage:
      - datalake_gsheets_raw.sale_ongoing_listings_date.listing_id
    description: QuintoAndar listing identifier for the in-progress sale property in the ongoing allocation spreadsheet.
  dt_alloc:
    lineage:
      - datalake_gsheets_raw.sale_ongoing_listings_date.dt_alloc
    description: Calendar date when the ongoing sale listing was allocated to an agent per the spreadsheet record.
  ts_load:
    description: Date when the table data was updated.
