---
database_name: datalake_tiers
table_name: ciq_first_listing
description: |
  Dataset of houses recommended by CIQ consultants (SALE and RENT) with first listing
  information, duplicate/ hybrid rules evaluation, invalidation reasons, and compliance to the
  15-day publication or contract rule. Includes publication/unpublication timestamps and
  contextual fields for both current and previously duplicated houses.
domain: Agents
owner: data-ae-agents@quintoandar.com.br
columns:
  id_house:
    lineage:
      - datalake_listing_deduplication.valid_first_listing.id_house
    description: Unique identifier of the house.
  id_previous_duplicated_house:
    lineage:
      - datalake_listing_deduplication.valid_first_listing.id_house_duplicated
    description: Identifier of the immediately previous duplicated house, when applicable.
  id_user:
    lineage:
      - datalake_listing_deduplication.valid_first_listing.id_user_listing_registrant_rent
      - datalake_listing_deduplication.valid_first_listing.id_user_listing_registrant_sale
    description: CIQ user who created the first listing for the given business context.
  uuid_person:
    lineage:
      - datalake_listing_deduplication.valid_first_listing.uuid_person_rent
      - datalake_listing_deduplication.valid_first_listing.uuid_person_sale
    description: Person-level UUID of the CIQ user.
  id_partner:
    lineage:
      - datalake_listing_deduplication.valid_first_listing.id_partner_rent
      - datalake_listing_deduplication.valid_first_listing.id_partner_sale
    description: Partner identifier associated with the CIQ user, if any.
  id_agent:
    lineage:
      - datalake_listing_deduplication.valid_first_listing.id_agent_rent
      - datalake_listing_deduplication.valid_first_listing.id_agent_sale
    description: Agent identifier associated with the CIQ user.
  id_ciq_user_rent_duplicated_house:
    lineage:
      - datalake_listing_deduplication.valid_first_listing.id_user_listing_registrant_rent
    description: CIQ user who created the RENT listing for the previous duplicated house.
  id_ciq_user_sale_duplicated_house:
    lineage:
      - datalake_listing_deduplication.valid_first_listing.id_user_listing_registrant_sale
    description: CIQ user who created the SALE listing for the previous duplicated house.
  business_context:
    description: Business context of the record ('RENT' or 'SALE').
    categories:
      RENT: Rent context
      SALE: Sale context
  consultant_type:
    lineage:
      - datalake_listing_deduplication.valid_first_listing.consultant_type_rent
      - datalake_listing_deduplication.valid_first_listing.consultant_type_sale
    description: CIQ profile (e.g., CIQ_FULL, CIQ_MANAGER).
  house_listing_status:
    lineage:
      - datalake_listing_deduplication.valid_first_listing.house_listing_status
    description: Aggregated final status for the current house considering RENT/SALE contexts and contracts.
  house_listing_status_duplicated_house:
    lineage:
      - datalake_listing_deduplication.valid_first_listing.house_listing_status
    description: Aggregated final status for the previous duplicated house.
  supply_source:
    lineage:
      - datalake_listing_deduplication.valid_first_listing.supply_source
    description: Overall supply source for the current house.
  supply_source_by_context:
    lineage:
      - datalake_listing_deduplication.valid_first_listing.supply_source_rent
      - datalake_listing_deduplication.valid_first_listing.supply_source_sale
    description: Overall supply source for the current house by context.
  supply_source_duplicated_house:
    lineage:
      - datalake_listing_deduplication.valid_first_listing.supply_source
    description: Overall supply source for the previous duplicated house.
  days_between_fl_hybrid:
    lineage:
      - datalake_listing_deduplication.valid_first_listing.days_between_fl_hybrid
    description: Absolute difference in days between RENT and SALE first listings for hybrid houses.
  hybrid_creation_order:
    lineage:
      - datalake_listing_deduplication.valid_first_listing.hybrid_creation_order
    description: "Creation order for hybrid houses: 'RENT > SALE', 'SALE > RENT', or 'CREATED AS A HYBRID'."
  invalidation_reasons:
    description: Array of messages describing why a record is not valid according to duplication, hybrid, Indica AI, or general rule checks.
  is_first_listing_valid:
    description: Boolean indicating if the record meets all rules for a valid first listing in its context.
  is_valid_duplicated:
    description: Indicates whether duplication conditions are satisfied for validity.
  is_valid_hybrid:
    description: Indicates whether hybrid-specific conditions are satisfied for validity in the context.
  is_invalid_by_indica_ai:
    lineage:
      - datalake_listing_deduplication.valid_first_listing.is_indica_ai
    description: True when the listing was captured via Indica AI, which invalidates the first listing.
  is_compliance_general_rule:
    description: Compliance to the general rule (remain published 15 days or have a signed/draft contract in the period), scoped to the context.
  is_hybrid_house:
    lineage:
      - datalake_listing_deduplication.valid_first_listing.is_hybrid_house
    description: True when the house has both RENT and SALE contexts.
  is_signed_contract_within_60_days:
    lineage:
      - datalake_listing_deduplication.valid_first_listing.is_signed_cs_within_60_days
      - datalake_listing_deduplication.valid_first_listing.is_signed_ccv_within_60_days
    description: Boolean flag indicating if a RENT contract (CS) or SALE agreement (CCV) was signed within 60 days after the first listing.
  dt_compliance_general_rule:
    lineage:
      - datalake_listing_deduplication.valid_first_listing.dt_15_published_accumulated_days_rent
      - datalake_listing_deduplication.valid_first_listing.dt_15_published_accumulated_days_sale
      - datalake_listing_deduplication.valid_first_listing.ts_first_contract_signed_rent
      - datalake_listing_deduplication.valid_first_listing.ts_first_contract_signed_sale
      - datalake_listing_deduplication.valid_first_listing.ts_created_draft_contract_rent
    description: Date that satisfies the general rule (15 accumulated published days or the first signed/draft contract).
  dt_15_published_accumulated_days:
    lineage:
      - datalake_listing_deduplication.valid_first_listing.dt_15_published_accumulated_days_rent
      - datalake_listing_deduplication.valid_first_listing.dt_15_published_accumulated_days_sale
    description: Date when 15 accumulated published days were reached (within the first 60 days) for the context.
  ts_first_contract_signed:
    lineage:
      - datalake_listing_deduplication.valid_first_listing.ts_first_contract_signed_rent
      - datalake_listing_deduplication.valid_first_listing.ts_first_contract_signed_sale
    description: First contract signed timestamp for the given business context.
  ts_created_draft_contract:
    lineage:
      - datalake_listing_deduplication.valid_first_listing.ts_created_draft_contract_rent
    description: Draft contract creation timestamp (only for RENT; NULL for SALE).
  ts_original_first_listing:
    lineage:
      - datalake_listing_deduplication.valid_first_listing.ts_first_listing_rent
      - datalake_listing_deduplication.valid_first_listing.ts_first_listing_sale
    description: Original first listing timestamp for the given business context.
  ts_final_first_listing:
    lineage:
      - datalake_listing_deduplication.valid_first_listing.ts_first_listing_rent
      - datalake_listing_deduplication.valid_first_listing.ts_initial_first_listing_sale
    description: Final first listing timestamp used for validity evaluation.
  ts_last_depublication:
    lineage:
      - datalake_listing_deduplication.valid_first_listing.ts_last_depublication
    description: Last depublication timestamp across contexts for the current house.
  ts_last_depublication_duplicated_house:
    lineage:
      - datalake_listing_deduplication.valid_first_listing.ts_last_depublication
    description: Last depublication timestamp across contexts for the previous duplicated house.
