---
database_name: datalake_tiers
table_name: metric_events
description: |
  Consolidated metric events for agent performance. It unifies OFFER and PROSPECT
  domain events with metric period mapping (simple and compound), including validity,
  invalidation (when applicable), and supporting identifiers. First Listing metrics
  (FL_FS, FL_FR) map houses to calendar-month periods using
  ciq_first_listing.dt_compliance_general_rule. FL_FS and FL_FR use the same attribution
  window: one calendar day after ts_interval_started through one calendar day after
  ts_interval_ended, so the two-day grace is not inflated by timezone on month-end.
  Other metrics use DATE() on source timestamps.
domain: Agents
owner: gustavo.rompe@quintoandar.com.br
columns:
  id_metric_event:
    description: Deterministic hash identifier for the metric event row.
  id_user:
    lineage:
      - datalake_tiers.agent_offers.id_user
      - datalake_tiers.agent_prospects.id_user
      - datalake_tiers.ciq_first_listing.id_user
    description: |
      Main/admin (ebdb) user identifier associated with the event attribution.
      Note: also used to join the user registry to enrich with uuid_person.
  id_agent:
    lineage:
      - datalake_tiers.agent_offers.id_agent
      - datalake_tiers.agent_prospects.id_agent
      - datalake_tiers.ciq_first_listing.id_agent
    description: Agent unique identifier.
  uuid_person:
    lineage:
      - datalake_tiers.agent_offers.uuid_person
      - datalake_tiers.agent_prospects.uuid_person
      - datalake_tiers.ciq_first_listing.uuid_person
    description: Person-level UUID from main/admin (ebdb) for the user in this event.
  id_external_domain:
    lineage:
      - datalake_tiers.agent_offers.id_offer
      - datalake_tiers.agent_prospects.id_prospect
      - datalake_tiers.ciq_first_listing.id_house
    description: |
      External identifier according to the domain: offer id for OFFER domain
      or prospect id for PROSPECT domain.
  id_metric_period:
    lineage:
      - datalake_tiers.metric_period.id
    description: Identifier of the metric period used to classify the event.
  external_domain:
    description: |
      Source domain of the event. Possible values: "OFFER" or "PROSPECT".
  agent_profile:
    lineage:
      - datalake_tiers.agent_offers.agent_profile
    description: Agent role for the event attribution (AGENT, NEGOTIATION_EXECUTIVE or CIQ).
  partial_metric:
    description: |
      Partial/primary metric component used for compound metrics (e.g., "CCV", "OS_BY", "BP").
      Null for simple metrics.
  final_metric:
    lineage:
      - datalake_tiers.metric_period.metric
    description: |
      Final metric label from the metric period mapping (e.g., "CCV", "GMV",
      "CCV_TQC", "CCV_CIQ", "OS_BY", "OS2CCV_BY", "BP2CCV", "BP", "TP", "FL_FS", "FL_FR").
  cumulative_value_type:
    description: Label describing the cumulative value meaning when applicable (e.g., "Sale price agreed" for GMV). Null for non-cumulative metrics.
  cumulative_value:
    description: Numeric cumulative value when applicable (e.g., GMV). Null for non-cumulative metrics.
  reason:
    description: |
      Human-readable reason that validates the event. Possible values include:
      "CONTRACT SIGNED", "CONTRACT CANCELLED AFTER SIGNED", "OFFER SUBMITED",
      and "NEW OR RECOVERED PROSPECT".
  is_valid:
    lineage:
      - datalake_tiers.ciq_first_listing.is_first_listing_valid
    description: Indicates whether the event is valid for the target metric/period.
  is_compound_metric_part:
    description: Flags whether the record composes a compound metric mapping.
  is_cumulative_metric:
    description: Flags whether the record represents a cumulative metric value.
  dt_become_valid:
    lineage:
      - datalake_tiers.ciq_first_listing.dt_compliance_general_rule
      - datalake_tiers.agent_offers.ts_contract_signed
      - datalake_tiers.agent_offers.ts_offer_submitted
      - datalake_tiers.agent_prospects.ts_event
    description: |
      Date when the event becomes valid for the metric period (contract signed,
      offer submitted or prospect event date, depending on the domain/metric).
  ts_invalidation:
    lineage:
      - datalake_tiers.metric_period.dt_end
      - datalake_tiers.agent_offers.dt_contract_cancelled
    description: Timestamp when the event became invalid (e.g., contract cancelled), when applicable.
  ts_updated:
    lineage:
      - datalake_tiers.agent_offers.ts_updated
      - datalake_tiers.agent_prospects.ts_event
    description: Record update timestamp used for partition derivations and recency checks.
  year:
    lineage:
      - datalake_tiers.metric_period.dt_init
    description: Partition year derived from the metric period start date (dt_init).
  month:
    lineage:
      - datalake_tiers.metric_period.dt_init
    description: Partition month derived from the metric period start date (dt_init).
  day:
    lineage:
      - datalake_tiers.metric_period.dt_init
    description: Partition day derived from the metric period start date (dt_init).

