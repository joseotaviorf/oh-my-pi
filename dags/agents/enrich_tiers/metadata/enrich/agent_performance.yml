---
database_name: datalake_tiers
table_name: agent_performance
description: |
  Aggregated performance metrics per agent and metric period, derived from metric_events
  (simple, invalid and compound metrics). Each row represents a metric value for an
  agent in a given metric period.
domain: Agents
owner: gustavo.rompe@quintoandar.com.br
columns:
  id_user:
    lineage:
      - datalake_tiers.metric_events.id_user
    description: |
      Main/admin (ebdb) user identifier associated with the agent.
  id_agent:
    lineage:
      - datalake_tiers.metric_events.id_agent
    description: Agent unique identifier.
  uuid_person:
    lineage:
      - datalake_tiers.metric_events.uuid_person
    description: Person-level UUID from main/admin (ebdb) for the agent.
  id_metric_period:
    lineage:
      - datalake_tiers.metric_period.id
    description: Identifier of the metric period.
  metric_name:
    description: Metric name aggregated (e.g., CCV, GMV, CCV_TQC, CCV_CIQ, OS_BY, OS2CCV_BY, BP2CCV, BP, TP, and INVALID variants).
  metric_value:
    description: Aggregated metric value for the period (count or ratio depending on the metric definition).
  is_valid:
    lineage:
      - datalake_tiers.metric_events.is_valid
    description: Indicates whether the metric value is valid for the period and definition.
  dt_metric_period_started:
    lineage:
      - datalake_tiers.metric_period.dt_init
    description: Start date of the metric period window (`dt_*` lake naming; same semantics as metric period start).
  dt_metric_period_ended:
    lineage:
      - datalake_tiers.metric_period.dt_end
    description: End date of the metric period window.
  dt_last_processing:
    description: Date on which this record was last written by the pipeline (CURRENT_DATE at job execution time).
  year:
    lineage:
      - datalake_tiers.metric_period.dt_init
    description: Partition year derived from metric period start (dt_metric_period_started).
  month:
    lineage:
      - datalake_tiers.metric_period.dt_init
    description: Partition month derived from metric period start.
  day:
    lineage:
      - datalake_tiers.metric_period.dt_init
    description: Partition day derived from metric period start.
