---
database_name: datalake_tiers
table_name: metric_period
description: |
  Reference table of metric validity periods by calendar month for the Agents domain.
  Each row represents a metric label and its validity window (start/end) for a
  given month. Identifiers are deterministic hashes of (metric, dt_init).
domain: Agents
owner: gustavo.rompe@quintoandar.com.br
columns:
  id:
    description: Deterministic hash identifier of (metric, dt_init).
  metric:
    description: Metric label (e.g., CCV, GMV, OS_BY, BP2CCV, TP2CS).
  status:
    description: Period status. Set as "VALID" for generated rows.
  dt_init:
    lineage:
      - datalake_quintoandar.aux_date.month_start
    description: Start date of the monthly validity window for the metric.
  dt_end:
    lineage:
      - datalake_quintoandar.aux_date.month_end
    description: End date of the monthly validity window for the metric.
  ts_interval_started:
    lineage:
      - datalake_quintoandar.aux_date.month_start
    description: >
      UTC-aligned start timestamp of the metric window (month start plus 3 hours).
      FL_FS and FL_FR in metric_events join on dt_compliance_general_rule between
      DATE(ts_interval_started) and DATE(ts_interval_ended), and on the calendar month
      of ts_original_first_listing matching DATE_TRUNC('MONTH', ts_interval_started).
  ts_interval_ended:
    lineage:
      - datalake_quintoandar.aux_date.month_end
    description: >
      UTC-aligned end timestamp of the metric window (month end at 23:59:59 plus 3 hours).
      For FL_FS and FL_FR, adds two days after that UTC offset for compliance grace at
      month boundaries; other metrics use month end plus 3 hours only.
  ts_created:
    lineage:
      - datalake_quintoandar.aux_date.month_start
    description: Creation timestamp derived from the period start date.
  ts_updated:
    description: Record update timestamp (generation time).
  year:
    lineage:
      - datalake_quintoandar.aux_date.month_start
    description: Partition year derived from dt_init.
  month:
    lineage:
      - datalake_quintoandar.aux_date.month
    description: Month number derived from dt_init.