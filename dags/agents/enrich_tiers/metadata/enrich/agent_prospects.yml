---
database_name: datalake_tiers
table_name: agent_prospects
description: |
  Maps new or recovered prospects attributed to agents for key conversion events.
  Granularity is per agent, prospect and day for the first occurrence of each
  conversion event type within the flow.
domain: Agents
owner: gustavo.rompe@quintoandar.com.br
columns:
  id_agent:
    lineage:
      - datalake_demand_flows.prospect_daily_results.id_agent
    description: Agent unique identifier.
  id_user:
    lineage:
      - datalake_ebdb_user.user.id
    description: |
      User unique identifier.
      Attention: This ID refers to the user in main/admin/ebdb.
  uuid_person:
    lineage:
      - datalake_ebdb_user.user.uuid_person
    description: Person-level UUID from main/admin (ebdb) for the user.
  id_prospect:
    lineage:
      - datalake_demand_flows.prospect_daily_results.id_prospect
    description: |
      Prospect unique identifier.
      Attention: This ID refers to the user in main/admin/ebdb.
  business_context:
    lineage:
      - datalake_demand_flows.prospect_daily_results.business_context
    description: Context in witch the interaction with the prospect happened.
  event_name:
    lineage:
      - datalake_demand_flows.prospect_daily_results.event_name
    description: Name of the demand prospect conversion event.
  ts_event:
    lineage:
      - datalake_demand_flows.prospect_daily_results.ts_event
    description: Timestamp in which the interaction with the prospect happened.
  year:
    lineage:
      - datalake_demand_flows.prospect_daily_results.year
    description: Year when the event happened.
  month:
    lineage:
      - datalake_demand_flows.prospect_daily_results.month
    description: Month when the event happened.
  day:
    lineage:
      - datalake_demand_flows.prospect_daily_results.day
    description: Day when the event happened.
