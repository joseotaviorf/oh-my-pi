---
dag:
  name: enrich_tiers
  schedule_start_date: 2024, 5, 22
  owner: Data Agents
  documentation:
    dag_purpose: Creates the basis for calculating metrics for agent tiering.
workflow:
  type: query_delta
  layer: enrich
  inner_dependencies:
    agent_offers_signed:
      - ciq_first_listing
    agent_performance:
      - agent_offers_signed
      - ciq_first_listing
  default_extraction_type: incremental
  default_partitions: [year, month, day]
  tables_customization:
    agent_performance:
      extraction_type: incremental
      partitions: [year, bimester]
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, ds, 'load_end_date') }}"
cluster:
  type: databricks_12_2_med_general_cluster
