---
dag:
  name: enrich_tiers
  schedule_start_date: 2024, 5, 22
  owner: Data Agents
  criticality: Critical
  documentation:
    dag_purpose: Creates the basis for calculating metrics for agent tiering.
workflow:
  type: query_delta
  layer: enrich
  inner_dependencies:
    agent_allocation:
      - metric_period
    agent_offers:
      - ciq_first_listing
    agent_performance:
      - metric_events
    metric_events:
      - agent_allocation
      - agent_offers
      - agent_prospects
  default_extraction_type: incremental
  default_partitions: [year, month, day]
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, -60), 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  tables_customization:
    agent_allocation:
      merge_on: [id_metric_period, id_user]
      z_order_by: [id_metric_period, id_user]
    agent_performance:
      merge_on: [id_metric_period, id_user, is_valid]
      z_order_by: [id_metric_period, id_user, is_valid]
    metric_events:
      merge_on: [id_metric_event]
      z_order_by: [id_metric_period, id_user]
    metric_period:
      partitions: [year, month]
    ciq_first_listing:
      partitions: []
      extraction_type: full
