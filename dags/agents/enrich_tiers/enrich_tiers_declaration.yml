---
dag:
  name: enrich_tiers
  schedule_start_date: 2024, 5, 22
  owner: Data Agents
  documentation:
    dag_purpose: Creates the basis for calculating metrics for agent tiering.
workflow:
  type: query_delta
  layer: enrich
  inner_dependencies:
    agent_offers:
      - ciq_first_listing
    agent_performance:
      - agent_offers
      - agent_prospects
      - ciq_first_listing
  default_extraction_type: incremental
  default_partitions: [year, bimester]
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
cluster:
  type: databricks_12_2_med_general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
