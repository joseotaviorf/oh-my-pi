---
table_name: datalake_agents_matias.eval_session_bundle
alert_channel: "#alerts-de-airflow-dags"

table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error

column_level_validations:
  id_session:
    is_complete:
      severity_level: Error
    is_unique:
      severity_level: Error
  id_langfuse_session:
    is_complete:
      severity_level: Error
    is_unique:
      severity_level: Error
  session_start_ts:
    is_complete:
      severity_level: Error
  # No check on `conversation`: it is a doubly-nested ArrayType(StructType(...))
  # (items embed `traces`, which embed `observations`). Deequ's analyzers reject
  # nested columns (WrongColumnTypeException) and crash the whole DQ run. The build
  # coalesces conversation to an empty array, so it is never null anyway.
