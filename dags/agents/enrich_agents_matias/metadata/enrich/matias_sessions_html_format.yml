---
database_name: datalake_agents_matias
table_name: matias_sessions_html_format
description: |
  One row per Langfuse chatbot session (grain: id_session = id_langfuse_session)
  for broker hosts ian, dominic and matias. Assembles a renderable HTML transcript
  from datalake_chatbot.sessions plus Langfuse traces, observations and scores,
  so product/QA can inspect the conversation, tool/agent path, knowledge-base
  hits and automatic eval cards without parsing nested JSON. Notifications
  attached to the first-trace user_context are included when present.
  Conversation bubbles are labelled "Matias" in the HTML even when host_name
  is ian or dominic. Merge key: id_session. Partitioned by year/month/day of
  session_started_at (chatbot session created timestamp).
domain: Agents
owner: leticia.machado@quintoandar.com.br
columns:
  id_session:
    description: >
      Langfuse external session identifier (id_langfuse_session) used as the
      table grain and join key back to traces, observations and scores.
    lineage:
      - datalake_chatbot.sessions.id_langfuse_session
  id_user:
    description: >
      Identifier of the broker (end-user) who owned the chatbot session.
    lineage:
      - datalake_chatbot.sessions.id_user
  session_started_at:
    description: >
      Timestamp when the chatbot session was created in datalake_chatbot.sessions
      (ts_created), used as session start in the HTML summary and as the source
      of the year/month/day partitions.
    lineage:
      - datalake_chatbot.sessions.ts_created
  host_name:
    description: >
      Chatbot host tag of the session. Restricted in SQL to ian, dominic and
      matias (the Matias product family).
    lineage:
      - datalake_chatbot.sessions.host_tag
    categories:
      ian: Matias host tag used on the ian environment.
      dominic: Matias host tag used on the dominic / broker chatbot environment.
      matias: Matias host tag used on the matias environment.
  is_escalated:
    description: >
      Whether the session was handed off to human support, taken from
      datalake_chatbot.sessions.is_escalated.
    lineage:
      - datalake_chatbot.sessions.is_escalated
  conversation_with_traces_html:
    description: >
      Full HTML transcript of the session including Langfuse traces:
      automatic eval cards, summary bar (date, message count, average latency,
      trace count, session id), date pill, inbound Jaiminho notification cards
      when present, and each turn (user bubble, Matias reply with latency/cost,
      agents/tools/errors) plus per-observation blocks (LLM generations and
      knowledge-base articles used). Intended for detailed QA; heavier than
      conversation_html.
    lineage:
      - datalake_chatbot.sessions.id_langfuse_session
      - datalake_langfuse_clean.traces.id_trace
      - datalake_langfuse_clean.traces.id_session
      - datalake_langfuse_clean.traces.ts_created
      - datalake_langfuse_clean.traces.input
      - datalake_langfuse_clean.traces.output
      - datalake_langfuse_clean.observations.id_observation
      - datalake_langfuse_clean.observations.id_trace
      - datalake_langfuse_clean.observations.ts_started
      - datalake_langfuse_clean.observations.ts_ended
      - datalake_langfuse_clean.observations.output
      - datalake_langfuse_clean.observations.name
      - datalake_langfuse_clean.observations.type
      - datalake_langfuse_clean.observations.level
      - datalake_langfuse_clean.observations.cost_details
      - datalake_langfuse_clean.scores.id_session
      - datalake_langfuse_clean.scores.name
      - datalake_langfuse_clean.scores.value
      - datalake_langfuse_clean.scores.string_value
      - datalake_knowledge_base_clean.bot_content.id_content
      - datalake_knowledge_base_clean.bot_content.title
  conversation_html:
    description: >
      Lighter HTML transcript of the same session: summary bar, date pill,
      inbound notification cards and user/Matias turns with agents, tools and
      errors — without eval cards and without per-observation LLM/KB detail.
      Use this when the full observation dump is not needed.
    lineage:
      - datalake_chatbot.sessions.id_langfuse_session
      - datalake_langfuse_clean.traces.id_trace
      - datalake_langfuse_clean.traces.id_session
      - datalake_langfuse_clean.traces.ts_created
      - datalake_langfuse_clean.traces.input
      - datalake_langfuse_clean.traces.output
      - datalake_langfuse_clean.observations.id_trace
      - datalake_langfuse_clean.observations.ts_started
      - datalake_langfuse_clean.observations.ts_ended
      - datalake_langfuse_clean.observations.name
      - datalake_langfuse_clean.observations.type
      - datalake_langfuse_clean.observations.level
      - datalake_langfuse_clean.observations.cost_details
      - datalake_knowledge_base_clean.bot_content.id_content
      - datalake_knowledge_base_clean.bot_content.title
  evals:
    description: >
      HTML block of the latest Langfuse automatic-eval cards for the session
      (frustration, naturalness, friction, resolution, labor litigation risk,
      AI resistance, plus leftover score names). Empty string when the session
      has no scores. This is rendered HTML, not the evals struct used in
      eval_session_bundle / matias_session_summary.
    lineage:
      - datalake_langfuse_clean.scores.id_session
      - datalake_langfuse_clean.scores.name
      - datalake_langfuse_clean.scores.value
      - datalake_langfuse_clean.scores.string_value
  year:
    description: Partition year derived from session_started_at.
    lineage:
      - datalake_chatbot.sessions.ts_created
  month:
    description: Partition month derived from session_started_at.
    lineage:
      - datalake_chatbot.sessions.ts_created
  day:
    description: Partition day derived from session_started_at.
    lineage:
      - datalake_chatbot.sessions.ts_created
