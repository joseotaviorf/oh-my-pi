dag:
  name: enrich_agents_matias
  schedule_start_date: 2026, 5, 29
  schedule_interval: 0 4 * * *
  owner: Data Agents
  documentation:
    dag_purpose: |
      Enrich Matias product analytics with data from CDP comms and Chatbot sessions.
workflow:
  type: query_delta
  layer: enrich
  default_extraction_type: incremental
  default_partitions: [year, month, day]
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, -2), 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  spark_job_arguments:
    - "{environment}"
    - "{bucket}"
    - "{schema}"
    - "{dag_name}"
    - "{table_name}"
    - "{load_start_date}"
    - "{load_end_date}"
    - "prod"
  inner_dependencies:
    # matias_session_summary and matias_sessions_html_format read eval_session_bundle
    # — must run after it finishes, not in parallel, or they would persist stale/partial
    # rows for the same load window.
    matias_session_summary:
      - eval_session_bundle
    matias_sessions_html_format:
      - eval_session_bundle
  tables_customization:
    outbound_messages_sessions:
      merge_on: [id_notification]
      z_order_by: [ts_notification_sent, id_user]
    matias_sessions_html_format:
      z_order_by: [id_session, is_escalated]
      load_spark_job: load_matias_sessions_html_format
    eval_session_bundle:
      load_spark_job: load_eval_session_bundle
    matias_session_summary:
      load_spark_job: load_matias_session_summary
