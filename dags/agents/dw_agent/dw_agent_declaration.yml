dag:
  name: dw_agent
  owner: Data Agents
  documentation:
      dag_purpose: This DAG creates tables that summarize the agent context models.
workflow:
  type: query_delta
  layer: dw
  custom_schema: agent
  tables_customization:
    dim_agent_region:
      custom_schema: public
    dim_agent:
      custom_schema: public
    fact_visit_agent_performance:
      partitions: [year, month, day]
      extraction_type: incremental
      merge_on: [sk_agent_performance]
      z_order_by: [sk_agent, sk_agent_performance]
cluster:
  type: databricks_13_3_med_general_2_workers_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
