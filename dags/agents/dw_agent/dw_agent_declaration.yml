dag:
  name: dw_agent
  owner: Data Agents
  criticality: High
  sla_deadline_localtime: "08:00"
  documentation:
    dag_purpose: This DAG creates tables that summarize the agent context models.
workflow:
  type: query_delta
  layer: dw
  custom_schema: agent
  tables_customization:
    dim_agent_region:
      custom_schema: public
    dim_agent:
      custom_schema: public
    fact_visit_agent_performance:
      partitions: [year, month, day]
      extraction_type: incremental
      merge_on: [sk_agent_performance]
      z_order_by: [sk_agent, sk_agent_performance]
      incremental_optimize: True
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
