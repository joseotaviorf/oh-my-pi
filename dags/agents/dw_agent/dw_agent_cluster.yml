cluster:
  type: emr_7_12_consolidation_s_general_cluster
  custom_configurations:
    # Cost-saving spot/OD mix: 1 CORE on-demand + 2 TASK spot (~67% spot).
    # Master stays ON_DEMAND (m7g.xlarge) per emr_consolidation_base anchor.
    core_nodes:
        instance_count: 1
    task_nodes:
        instance_count: 2
    spark_conf:
      # Master / YARN RM (m7g.xlarge — 4 vCPU / 16 GB)
      spark.driver.memory: 8g
      spark.driver.cores: "4"
      # Workers are m7g.xlarge (4 vCPU / 16 GB each); 3 workers (1 CORE + 2 TASK).
      # 1 exec/worker × 4 cores = 4 cores fully utilized.
      # 1 × 10g (8g heap + 2g overhead) = 10 GB used / 16 GB per worker (6 GB OS headroom).
      spark.executor.memory: 8g
      spark.executor.cores: "4"
      # 3 workers × 1 exec/worker = 3 execs max.
      spark.dynamicAllocation.minExecutors: "2"
      spark.dynamicAllocation.maxExecutors: "3"
