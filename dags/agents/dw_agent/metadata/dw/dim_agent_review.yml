database_name: dw_public
table_name: dim_agent_review
description: Dimension table containing information about an agent's review related to a visit booked.
domain: For Rent
owner: bruna.prates@quintoandar.com.br
columns:
  sk_agent_review:
    lineage:
    - datalake_ebdb_agents.agents_review.id_booking
    description: ID of the booking. It can be joined with dw_public.dim_booking.
  sk_booking:
    lineage:
    - datalake_ebdb_agents.agents_review.id_booking
    description: ID of the booking. It can be joined with dw_public.dim_booking.
  rating:
    lineage:
    - datalake_ebdb_agents.agents_review.rating
    description: Rating (range 0-5) given to the real state agent review.
  tag_other:
    lineage:
    - datalake_ebdb_agents.agents_review.tag_other
    description: Complementary information of the review.
  flg_punctuality:
    lineage:
    - datalake_ebdb_agents.agents_review.is_punctual
    description: Integer (0 or 1) indicating whether the review is related to the agent's punctuality.
  flg_agent_well_informed:
    lineage:
    - datalake_ebdb_agents.agents_review.is_agent_well_informed
    description: Integer (0 or 1) indicating whether the review is related to the agent being well informed.
  flg_kindness:
    lineage:
    - datalake_ebdb_agents.agents_review.is_kind
    description: Integer (0 or 1) indicating whether the review is related to the agent being kind.
  flg_no_kindness:
    lineage:
    - datalake_ebdb_agents.agents_review.is_not_kind
    description: Integer (0 or 1) indicating whether the review is related to the agent not being kind.
  flg_house_as_listing:
    lineage:
    - datalake_ebdb_agents.agents_review.is_house_as_listing
    description: Integer (0 or 1) indicating whether the review is related to the property being the same as announced on the listing.
  flg_house_not_as_listing:
    lineage:
    - datalake_ebdb_agents.agents_review.is_house_not_as_listing
    description: Integer (0 or 1) indicating whether the review is related to the property not being the same as announced on the listing.
  flg_other_reason_positive:
    lineage:
    - datalake_ebdb_agents.agents_review.is_other_positive_reason
    description: Integer (0 or 1) indicating whether the review is related to another positive reason.
  flg_other_reason_negative:
    lineage:
    - datalake_ebdb_agents.agents_review.is_other_negative_reason
    description: Integer (0 or 1) indicating whether the review is related to another negative reason.
  flg_agent_late:
    lineage:
    - datalake_ebdb_agents.agents_review.is_agent_late
    description: Integer (0 or 1) indicating whether the review is related to the agent being late to the visit.
  flg_agent_with_no_info:
    lineage:
    - datalake_ebdb_agents.agents_review.is_agent_without_inf
    description: Integer (0 or 1) indicating whether the review is related to the agent not having much information.
  ts_created:
    lineage:
    - datalake_ebdb_agents.agents_review.ts_rating_created
    description: Timestamp of when the review was created.
  ts_load:
    description: Timestamp of when this table was loaded.
