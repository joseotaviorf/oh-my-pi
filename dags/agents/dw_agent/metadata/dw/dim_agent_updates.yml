database_name: dw_public
table_name: dim_agent_updates
description: SCD Type 2 dimension table tracking historical changes to agent attributes. Each row represents a version of an attribute value with validity timestamps, enabling point-in-time analysis of agent data changes.
domain: Agents
owner: vitor.musachio@quintoandar.com.br
columns:
  sk_agent_update:
    lineage:
    - datalake_ebdb_clean.agent_data_aud.id
    - datalake_ebdb_clean.agent_data_aud.rev
    description: Surrogate key uniquely identifying each attribute version record, generated as a hash of agent id, attribute name, version number, and validity timestamps.
  sk_agent:
    lineage:
    - datalake_ebdb_clean.agent_data_aud.id
    description: Foreign key to the agent dimension (dim_agent). Identifies which agent this attribute change belongs to.
  sk_company:
    lineage:
    - datalake_company.company_sks.sk_company
    description: Foreign key to company dimension. Returns -1 when no company is associated. Only populated when attribute_name is 'uuid_company'.
  attribute_name:
    description: Name of the agent attribute being tracked. Possible values include id_work_contract, id_preferred_region, uuid_company, profile, agent_type, position_in_real_estate_agency, real_estate_agency, creci_number, code, is_active, is_blocked_schedule_edition, is_passive_lead_receiver, is_service_link_active, has_opted_for_online_support.
    categories:
      id_work_contract: Work contract identifier
      id_preferred_region: Preferred region identifier
      uuid_company: Company UUID
      profile: Agent profile (e.g., CAR_LONG_DISTANCE, BUS_LONG_DISTANCE)
      agent_type: Agent type classification
      position_in_real_estate_agency: Position in real estate agency
      real_estate_agency: Real estate agency name
      creci_number: CRECI registration number
      code: Agent code
      is_active: Agent active status
      is_blocked_schedule_edition: Schedule edition blocked status
      is_passive_lead_receiver: Passive lead receiver status
      is_service_link_active: Service link active status
      has_opted_for_online_support: Online support opt-in status
  attribute_value:
    description: Value of the attribute at this version. All values are cast to string for uniformity.
  version_number:
    lineage:
    - datalake_ebdb_clean.agent_data_aud.rev
    description: Sequential version number for this attribute, starting at 1 for the first recorded value and incrementing with each change.
  is_current:
    lineage:
    - datalake_ebdb_clean.agent_data_aud.rev
    description: Boolean flag indicating if this is the current (most recent) version of the attribute. True when ts_end is null.
  ts_start:
    lineage:
    - datalake_ebdb_clean.user_revision_entity.ts_revision
    description: Timestamp when this attribute version became effective. Formatted as 'yyyy-MM-dd HH:mm:ss.SSS+00:00'.
  ts_end:
    lineage:
    - datalake_ebdb_clean.user_revision_entity.ts_revision
    description: Timestamp when this attribute version was superseded by a newer version. Null for current versions. Formatted as 'yyyy-MM-dd HH:mm:ss.SSS+00:00'.
  ts_load:
    description: Timestamp of when the table was last processed.