database_name: dw_public
table_name: dim_agent
description: Dimension table containing agent data with foreign keys to person, user, company, and 3P broker (core_brokers) dimensions. Contains only agents (users with agent_data_id not null).
domain: Agents
owner: gustavo.rompe@quintoandar.com.br
columns:
  sk_agent:
    lineage:
    - datalake_ebdb_clean.agent_data.id
    description: Surrogate key of agent from agent_data table.
  sk_person:
    lineage:
    - datalake_person.person_sks.sk_person
    description: Foreign key to person dimension. Returns -1 when no person is associated.
  sk_user:
    lineage:
    - datalake_ebdb_user.user.id
    description: Foreign key to user table. Returns -1 when no user is associated.
  sk_broker:
    lineage:
    - core_brokers.brokers.sk_broker
    description: Foreign key to the 3P broker dimension (core brokers), matched by agent company UUID. Returns -1 when no broker row exists for the company.
  id_user:
    lineage:
    - datalake_ebdb_user.user.id
    description: User ID associated with the agent.
  agent_code:
    lineage:
    - datalake_ebdb_clean.agent_data.code
    description: Human-readable agent code from EBDB agent_data used for internal identification and reporting.
  agent_profile:
    lineage:
    - datalake_ebdb_clean.agent_data.profile
    description: Agent profile, such as CAR_LONG_DISTANCE or BUS_LONG_DISTANCE.
  agent_type:
    lineage:
    - datalake_ebdb_clean.agent_data_types.types
    description: Concatenated types of the agent (e.g., visit, inspection, photo session). Can contain multiple types.
  agent_type_main:
    lineage:
    - datalake_ebdb_clean.agent_data.agent_type
    description: Agent type from agent_data Main's table. Primary classification of agent role.
  contract_name:
    lineage:
    - datalake_ebdb_clean.work_contract.contract_name
    description: Name of the agent's current work contract with brackets removed.
  creci_number:
    lineage:
    - datalake_ebdb_clean.agent_data.creci_number
    description: CRECI number (Regional Council for Real Estate Brokers) of the agent.
  rede_partner:
    lineage:
    - datalake_company.company_sks.extracted_3p_tag
    description: Name of the partner if this is a Rede contract. DEPRECATED, use sk_broker to join dw_brokers.dim_broker and read broker_name.
  is_agent_active:
    lineage:
    - datalake_ebdb_clean.agent_data.is_active
    description: If the agent is still registered as an agent (same as is_active).
  is_user_active:
    lineage:
    - datalake_ebdb_user.user.is_active
    description: If the associated user is active.
  is_blocked:
    lineage:
    - datalake_ebdb_user.user.is_blocked
    description: If the associated user is blocked.
  is_3p_agent:
    lineage:
    - datalake_ebdb_clean.agent_data.agent_type
    description: Flag indicating if agent is a third-party agent (agent_type = 'CORRETOR_REDE').
  is_rent_agent:
    lineage:
    - datalake_ebdb_user.agent_data.is_rent_agent
    description: If the agent works with rental properties.
  is_sale_agent:
    lineage:
    - datalake_ebdb_user.agent_data.is_sale_agent
    description: If the agent works with property sales.
  is_affiliate_active:
    lineage:
    - datalake_ebdb_user.affiliate_data.is_active
    description: If user is an affiliate, indicates whether they are still registered in the affiliates program.
  is_photographer_active:
    lineage:
    - datalake_ebdb_clean.photographer_data.is_active
    description: If user is a photographer, indicates whether they are still active as photographer.
  is_tenant:
    lineage:
    - datalake_ebdb_user.user.is_tenant
    description: If the user is a tenant with QuintoAndar.
  is_passive_lead_receiver:
    lineage:
    - datalake_ebdb_clean.agent_data.is_passive_lead_receiver
    description: If the agent is configured to receive passive leads.
  is_service_link_active:
    lineage:
    - datalake_ebdb_clean.agent_data.is_service_link_active
    description: If the agent's service link is currently active.
  has_3p_member_profile_active:
    lineage:
    - core_brokers.brokers_profile.profile_status
    - core_brokers.brokers_profile.profile
    description: True when the person has an active third_party_agent brokers_profile row for their broker (profile_status = 'ACTIVE', profile = 'third_party_agent').
  has_3p_member_profile_pending:
    lineage:
    - core_brokers.brokers_profile.profile_status
    - core_brokers.brokers_profile.profile
    description: True when the person has a pending third_party_agent brokers_profile row for their broker (profile_status IN 'PENDING CONFIRMATION' or 'PENDING INVITATION', profile = 'third_party_agent').
  ts_created:
    lineage:
    - datalake_ebdb_clean.agent_data.ts_created
    description: Timestamp of when the agent record was created.
  ts_updated:
    lineage:
    - datalake_ebdb_clean.agent_data.ts_updated
    description: Timestamp of when the agent record was last updated.
  ts_load:
    description: Timestamp of when the table was last processed.