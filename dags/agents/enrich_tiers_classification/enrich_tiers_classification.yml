---
dag:
  name: enrich_tiers_classification
  schedule_start_date: 2024, 5, 22
  owner: Data Agents
  documentation:
    dag_purpose: Creates the basis for calculating metrics for agent tiering.
workflow:
  type: query_delta
  layer: enrich
  inner_dependencies:
    tiers:
      - operation_points
  default_extraction_type: incremental
  default_partitions: [year, bimester]
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, ds, 'load_end_date') }}"
cluster:
  type: databricks_12_2_med_general_cluster
