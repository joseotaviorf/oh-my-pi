---
dag:
  name: enrich_agent
  schedule_start_date: 2026, 4, 1
  owner: Data Agents
  documentation:
    dag_purpose: Enrichment of users data originating from Hub Services.
workflow:
  type: query_delta
  layer: enrich
  custom_schema: agent_accreditation
  inner_dependencies:
    prospect_step_validation:
      - prospect_agent
      - qualification_step
      - signup_profile_conflict
      - contract_process
    prospect_agent:
      - qualification_step
      - contract_process
    agent:
      - prospect_agent
      - agent_event_log
    agent_daily:
      - agent
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  tables_customization:
    signup_profile_conflict:
      extraction_type: incremental
      partitions: [year, month, day]
    agent_event_log:
      extraction_type: incremental
      merge_on: [id_event_log]
      partitions: [year, month, day]
    agent_daily:
      extraction_type: incremental
      merge_on: [id_agent_daily]
      partitions: [year, month, day]
    agent_history:
      extraction_type: incremental
      merge_on: [id_snapshot]
      partitions: [dt_reference]
      z_order_by: [id_unified_agent, id_agent]
