---
dag:
  name: enrich_agent
  schedule_start_date: 2026, 4, 1
  owner: Data Agents
  documentation:
    dag_purpose: Enrichment of users data originating from Hub Services.
workflow:
  type: query_delta
  layer: enrich
  custom_schema: agent_accreditation
  inner_dependencies:
    prospect_step_validation:
      - agent
      - prospect_agent
      - qualification_step
      - signup_profile_conflict
      - contract_process
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  tables_customization:
    signup_profile_conflict:
      extraction_type: incremental
      partitions: [year, month, day]
    agent_event_log:
      extraction_type: incremental
      merge_on: [id_event_log]
      partitions: [year, month, day]
cluster:
  type: databricks_16_4_min_memory_cluster
  databricks_conn_id: databricks_new_env
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
