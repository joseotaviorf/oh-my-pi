---
database_name: datalake_agent_accreditation
table_name: prospect_agent
domain: Agents
owner: gustavo.rompe@quintoandar.com.br
description: Prospect agent enriched with linked EBDB agent id when the person already has an agent, hub business unit and parent region ids derived from QuintoAndar prospect region types, and questionnaire fields (CRECI, availability, context preferences).
columns:
  id_prospect_agent:
    lineage:
      - datalake_ebdb_clean.prospect_agent.id
    description: Unique identifier of the prospect agent record.
  id_agent:
    lineage:
      - datalake_ebdb_clean.agent.id
    description: Agent identifier when the prospect person matches an existing EBDB agent.
  id_qualification:
    lineage:
      - datalake_agent_accreditation.qualification_step.id_qualification
    description: Qualification identifier when the prospect person matches an existing EBDB qualification.
  id_business_unit:
    lineage:
      - datalake_ebdb_clean.quintoandar_prospect_agent.id_primary_operating_region
      - datalake_ebdb_clean.quintoandar_prospect_agent.primary_operating_region_type
    description: Primary operating region id when the region type is HUB; otherwise null.
  id_region:
    lineage:
      - datalake_ebdb_clean.quintoandar_prospect_agent.id_parent_operating_region
      - datalake_ebdb_clean.quintoandar_prospect_agent.parent_operating_region_type
    description: Parent operating region id when the parent region type is REGION; otherwise null.
  uuid_prospect:
    lineage:
      - datalake_ebdb_clean.prospect_agent.uuid_prospect
    description: Prospect UUID in the source system.
  uuid_person:
    lineage:
      - datalake_ebdb_clean.prospect_agent.uuid_person
    description: Person UUID linked to the prospect.
  legal_entity_type:
    lineage:
      - datalake_ebdb_clean.prospect_agent.legal_entity_type
    description: Legal entity type of the prospect (e.g., individual or company).
  status:
    lineage:
      - datalake_ebdb_clean.prospect_agent.status
    description: Current status of the prospect agent onboarding workflow.
  qualification_state:
    lineage:
      - datalake_agent_accreditation.qualification_step.qualification_state
    description: Current status of the qualification workflow.
  creci_validation_status:
    lineage:
      - datalake_agent_accreditation.qualification_step.step_status
    description: Current status of the CRECI validation step.
  contract_signature_status:
    lineage:
      - datalake_agent_accreditation.contract_process.signature_status
    description: Current status of the signature contract document.
  contract_template_name:
    lineage:
      - datalake_agent_accreditation.contract_process.contract_template_name
    description: Name of the contract template used for the last contract process.
  business_association:
    lineage:
      - datalake_ebdb_clean.prospect_agent.business_association
    description: Business association category for the prospect agent.
  business_context_applied:
    lineage:
      - datalake_ebdb_clean.quintoandar_prospect_agent.business_context_of_interest
    description: Business context of interest as captured in the QuintoAndar prospect questionnaire.
  quintoandar_knowledge:
    lineage:
      - datalake_ebdb_clean.prospect_agent.quintoandar_knowledge
    description: Declared knowledge level about QuintoAndar.
  social:
    lineage:
      - datalake_ebdb_clean.prospect_agent.social
    description: Social profile or link information provided by the prospect.
  creci:
    lineage:
      - datalake_ebdb_clean.quintoandar_prospect_agent.creci
    description: CRECI license number from the QuintoAndar prospect questionnaire.
  creci_uf:
    lineage:
      - datalake_ebdb_clean.quintoandar_prospect_agent.creci_uf
    description: State (UF) of the CRECI license.
  commuting_method:
    lineage:
      - datalake_ebdb_clean.quintoandar_prospect_agent.commuting_method
    description: Commuting method from the QuintoAndar prospect questionnaire.
  referral_code:
    lineage:
      - datalake_ebdb_clean.quintoandar_prospect_agent.referral_code
    description: Referral code from the QuintoAndar prospect questionnaire.
  maximum_acquisition_per_month:
    lineage:
      - datalake_ebdb_clean.quintoandar_prospect_agent.maximum_acquisition_per_month
    description: Maximum acquisition per month from the QuintoAndar prospect questionnaire.
  minimum_acquisition_per_month:
    lineage:
      - datalake_ebdb_clean.quintoandar_prospect_agent.minimum_acquisition_per_month
    description: Minimum acquisition per month from the QuintoAndar prospect questionnaire.
  maximum_available_days:
    lineage:
      - datalake_ebdb_clean.quintoandar_prospect_agent.maximum_available_days
    description: Maximum available days from the QuintoAndar prospect questionnaire.
  minimum_available_days:
    lineage:
      - datalake_ebdb_clean.quintoandar_prospect_agent.minimum_available_days
    description: Minimum available days from the QuintoAndar prospect questionnaire.
  years_of_experience:
    lineage:
      - datalake_ebdb_clean.quintoandar_prospect_agent.maximum_years_of_experience
    description: Maximum years of experience from the QuintoAndar prospect questionnaire.
  is_available_on_weekends:
    lineage:
      - datalake_ebdb_clean.quintoandar_prospect_agent.is_available_on_weekends
    description: Whether the prospect is available on weekends (QuintoAndar prospect questionnaire).
  is_accepted_alternative_context:
    lineage:
      - datalake_ebdb_clean.quintoandar_prospect_agent.is_accepted_alternative_context
    description: Whether the prospect accepts alternative business contexts.
  is_accepted_alternative_region:
    lineage:
      - datalake_ebdb_clean.quintoandar_prospect_agent.is_accepted_alternative_region
    description: Whether the prospect accepts alternative operating regions.
  is_last_prospect_person_converted:
    lineage:
      - datalake_ebdb_clean.prospect_agent.status
      - datalake_ebdb_clean.prospect_agent.ts_created
    description: When a person has multiple prospect onboarding journeys, TRUE on the converted record with the latest ts_created for that uuid_person; FALSE on non-converted rows and on older converted records for the same person.
  ts_creci_validation_approved:
    lineage:
      - datalake_agent_accreditation.qualification_step.ts_changed
    description: Timestamp when the CRECI validation step was approved.
  ts_contract_process_initiated:
    lineage:
      - datalake_agent_accreditation.contract_process.ts_initiated
    description: Timestamp when the contract process was initiated.
  ts_contract_signed:
    lineage:
      - datalake_agent_accreditation.contract_process.ts_signed
    description: Timestamp when the contract was signed.
  ts_contract_process_finished:
    lineage:
      - datalake_agent_accreditation.contract_process.ts_finished
    description: Timestamp when the contract process was finished.
  ts_created:
    lineage:
      - datalake_ebdb_clean.prospect_agent.ts_created
    description: Timestamp when the prospect agent record was created.
  ts_updated:
    lineage:
      - datalake_ebdb_clean.prospect_agent.ts_updated
    description: Timestamp when the prospect agent record was last updated.
