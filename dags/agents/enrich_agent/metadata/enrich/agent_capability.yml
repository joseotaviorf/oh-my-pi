---
database_name: datalake_agent_accreditation
table_name: agent_capability
domain: Agents
owner: data-ae-agents@quintoandar.com.br
description: |
  Enriched agent capabilities from EBDB joined to demand visit management settings when present.
  Each row is one capability instance with type, status, optional business context, and creation timestamp.
columns:
  id_capability:
    lineage:
      - datalake_ebdb_clean.capability.id
    description: Unique identifier of the capability record (primary key).
  id_agent:
    lineage:
      - datalake_ebdb_clean.capability.id_agent
    description: Agent identifier that owns the capability.
  type:
    lineage:
      - datalake_ebdb_clean.capability.type
    description: Capability type (e.g. "DEMAND_VISIT_MANAGEMENT", "DEMAND_VISIT_MANAGEMENT").
  status:
    lineage:
      - datalake_ebdb_clean.capability.status
    description: Current status of each capability.
  business_context:
    lineage:
      - datalake_ebdb_clean.demand_visit_management_capability_settings.business_context
    description: Business context from demand visit management capability settings.
  ts_created:
    lineage:
      - datalake_ebdb_clean.capability.ts_created
    description: Timestamp when the capability was created.
  ts_updated:
    lineage:
      - datalake_ebdb_clean.capability.ts_updated
    description: Timestamp when the capability was last updated.
