---
dag:
  name: enrich_ebdb_agents_contracts
  schedule_start_date: 2020, 7, 1
  owner: Data Agents
  documentation:
    dag_purpose: |
      Enrich agent work-contract history (contracts, 3P, activations/suspensions, coincident
      contexts, unified changes). Split from enrich_ebdb_agents so contract loads are not
      blocked by PFA/PPA or geo upstreams.
workflow:
  type: query_delta
  layer: enrich
  custom_schema: ebdb_agents
  inner_dependencies:
    agent_unified_contract_changes:
      - agent_coincident_business_contexts
      - agents_activations_suspensions_contracts_changes
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  tables_customization:
    agents_activations_suspensions_contracts_changes:
      extraction_type: incremental
      partitions:
        - year
        - month
        - day
