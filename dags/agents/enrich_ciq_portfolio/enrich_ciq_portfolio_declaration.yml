dag:
  name: enrich_ciq_portfolio
  schedule_start_date: 2024,9,1
  owner: Data Agents
  documentation:
    dag_purpose: |
      Enrich CIQ portfolio table from gsheets. Split from enrich_ciq so portfolio
      is not blocked by identity or listing-purchase upstreams.
workflow:
  type: query_delta
  layer: enrich
  custom_schema: ciq
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
