database_name: datalake_airtable_test_clean
table_name: activations
description: This table contains information about the activation. We still having
  some information about agents, but the main subject here is the activation.
domain: For Rent
owner: guilherme.cunha@quintoandar.com.br
columns:
  id_activations:
    lineage:
    - datalake_airtable_test_raw.activations.id
    description: Our identifier of activations.
  id_airtable_record:
    lineage:
    - datalake_airtable_test_raw.activations.id
    description: Airtable identifier. It doesn't have any correspondence with our
      internals identifiers.
  activation_status:
    lineage:
    - datalake_airtable_test_raw.activations.status_ativacao
    description: Current status of the activation.
  actuation_state:
    lineage:
    - datalake_airtable_test_raw.activations.estado_de_atuacao
    description: State where the agent is working.
  agent_complete_name:
    lineage:
    - datalake_airtable_test_raw.activations.nome_completo
    description: Agent full name.
  agent_creci:
    lineage:
    - datalake_airtable_test_raw.activations.creci
    description: Agent's creci identifier.
  agent_email:
    lineage:
    - datalake_airtable_test_raw.activations.email
    description: Agent's email address.
  agent_phone_number:
    lineage:
    - datalake_airtable_test_raw.activations.telefone
    description: Agent's phone number.
  chosen_region:
    lineage:
    - datalake_airtable_test_raw.activations.regiao_escolhida
    description: Region code where the agent wants to work.
  cpf:
    lineage:
    - datalake_airtable_test_raw.activations.cpf
    description: Agent's cpf.
  giving_up_reason:
    lineage:
    - datalake_airtable_test_raw.activations.desistencia_motivo
  model:
    lineage:
    - datalake_airtable_test_raw.activations.modalidade
    description: It's the business context. Could be Locaçao, Vendas or Vendas HUB.
  original_lead:
    lineage:
    - datalake_airtable_test_raw.activations.lead_original
    description: It's a list of id_airtable_record to the table leads.
  region:
    lineage:
    - datalake_airtable_test_raw.activations.regiao
    description: When the agent chose the region.
  region_first_option:
    lineage:
    - datalake_airtable_test_raw.activations.1_opcao
    description: The region code of the agent's first option.
  region_second_option:
    lineage:
    - datalake_airtable_test_raw.activations.2_opcao
    description: The region code of the agent's second option.
  has_activation_notification:
    lineage:
    - datalake_airtable_test_raw.activations.aviso_ativacao
    description: Boolean about the notification existence.
  has_welcome_email:
    lineage:
    - datalake_airtable_test_raw.activations.email_boasvindas
    description: Boolean about the email welcome existence.
  has_whats_pocket:
    lineage:
    - datalake_airtable_test_raw.activations.whats_pocket
    description: Boolean about the whats existence.
  dt_agency_confirmation:
    lineage:
    - datalake_airtable_test_raw.activations.confirmacao_de_agenda
    description: When the agency confirmed.
  dt_birth:
    lineage:
    - datalake_airtable_test_raw.activations.data_de_nascimento
    description: Agent's bithday.
  dt_contract_sent:
    lineage:
    - datalake_airtable_test_raw.activations.envio_de_contrato
    description: When the contract was sent.
  dt_giving_up:
    lineage:
    - datalake_airtable_test_raw.activations.data_desistencia
    description: When the agent gave up.
  dt_id_creation:
    lineage:
    - datalake_airtable_test_raw.activations.criacao_id
    description: When the agent's id was created.
  dt_jitex_requested:
    lineage:
    - datalake_airtable_test_raw.activations.solicitacao_jitex
    description: When the jitex request happened.
  dt_kit_received:
    lineage:
    - datalake_airtable_test_raw.activations.recebimento_kit
    description: When the kit was received by the agent.
  dt_signed:
    lineage:
    - datalake_airtable_test_raw.activations.assinatura
    description: When the contract was signed.
  dt_week_accreditated:
    lineage:
    - datalake_airtable_test_raw.activations.semana_de_credenciamento
    description: Week of the accreditation.
  ts_updated:
    lineage:
    - datalake_airtable_test_raw.activations.last_modified
    description: Last Timestamp when the record was updated.
  year:
    lineage:
    - datalake_airtable_test_raw.activations.year
    description: year when this record was created or updated. It's a partition.
  month:
    lineage:
    - datalake_airtable_test_raw.activations.month
    description: month when this record was created or updated.It's a partition.
  day:
    lineage:
    - datalake_airtable_test_raw.activations.day
    description: day when this record was created or updated. It's a partition.
  given_up_reason:
    description: Agent's 13 reasons to give up the activation.
