database_name: datalake_airtable_test_clean
table_name: jira_tickets
description: This table contains information about cr_occurences.
domain: For Rent
owner: guilherme.cunha@quintoandar.com.br
columns:
  id_agent:
    lineage:
    - datalake_airtable_test_raw.jira_tickets.id_do_corretor
    description: Agent's identifier.
  id_airtable_record:
    lineage:
    - datalake_airtable_test_raw.jira_tickets.id_airtable_record
    description: Airtable identifier. It doesn't have any correspondence with our
      internals identifiers.
  id_ql_agent:
    lineage:
    - datalake_airtable_test_raw.jira_tickets.ql_id_do_agente
    description: Agent's identifier.
  id_issue:
    lineage:
    - datalake_airtable_test_raw.jira_tickets.issue_key
    description: Issue's identifier.
  activated:
    lineage:
    - datalake_airtable_test_raw.jira_tickets.ativos
    description: List of Airtable's records to the table activated.
  cpf:
    lineage:
    - datalake_airtable_test_raw.jira_tickets.cpf_from_ativos
    description: Agent's cpf
  description:
    lineage:
    - datalake_airtable_test_raw.jira_tickets.descricao
    description: Description about the issue.
  open_in_jira:
    lineage:
    - datalake_airtable_test_raw.jira_tickets.open_in_jira
    description: What we have on Jira. It's a json.
  permanent_deaccreditation:
    lineage:
    - datalake_airtable_test_raw.jira_tickets.descredenciamento_permanente
    description: It is Sim or Não.
  ql_agent_complete_name:
    lineage:
    - datalake_airtable_test_raw.jira_tickets.ql_nome_completo_do_corretor
    description: Agent's full name.
  ql_agent_line:
    lineage:
    - datalake_airtable_test_raw.jira_tickets.ql_seguimento_do_corretor
    description: What is the kind of line of the agent, could be Locação, Vendas or
      Vendas | HUB.
  ql_agent_region:
    lineage:
    - datalake_airtable_test_raw.jira_tickets.ql_regiao_de_atuacao
    description: What is the region code of the agent work.
  ql_agent_type:
    lineage:
    - datalake_airtable_test_raw.jira_tickets.ql_tipo_agent
    description: Type of agent. Could be OLD Or New Hire.
  ql_deaccreditation_reason:
    lineage:
    - datalake_airtable_test_raw.jira_tickets.ql_motivo_descredenciamento
    description: The reason why the deaccreditation happened.
  ql_solicitation_type:
    lineage:
    - datalake_airtable_test_raw.jira_tickets.ql_tipo_de_solicitacao
    description: Type of socilitation.
  ql_suspension_type:
    lineage:
    - datalake_airtable_test_raw.jira_tickets.ql_tipo_de_suspensao
    description: type of suspension.
  responsible:
    lineage:
    - datalake_airtable_test_raw.jira_tickets.responsavel
    description: Who is responsible for this issue.
  summary:
    lineage:
    - datalake_airtable_test_raw.jira_tickets.resumo
    description: Summary about the issue.
  dt_begin:
    lineage:
    - datalake_airtable_test_raw.jira_tickets.ql_data_inicial
    description: When the issue started.
  dt_deaccreditated:
    lineage:
    - datalake_airtable_test_raw.jira_tickets.data_descredenciamento
    description: When the deaccreditation happened.
  dt_deaccreditation_return:
    lineage:
    - datalake_airtable_test_raw.jira_tickets.data_retorno_descred
    description: When the return from the deaccreditation happened.
  dt_end:
    lineage:
    - datalake_airtable_test_raw.jira_tickets.ql_data_final
    description: When the isseu ended.
  ts_created:
    lineage:
    - datalake_airtable_test_raw.jira_tickets.created
    description: When the record was created.
  ts_updated:
    lineage:
    - datalake_airtable_test_raw.jira_tickets.last_modified
    description: When the record was updated.
  year:
    lineage:
    - datalake_airtable_test_raw.jira_tickets.year
    description: year when the record was created or updated. It's a partition.
  month:
    lineage:
    - datalake_airtable_test_raw.jira_tickets.month
    description: month when the record was created or udpated. It's a partition.
  day:
    lineage:
    - datalake_airtable_test_raw.jira_tickets.day
    description: day when the record was created or updated. It's a partition.
