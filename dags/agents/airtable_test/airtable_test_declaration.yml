cluster:
  type: custom_cluster
  custom_libraries:
    - whl: "{artifacts_bucket}/airtable-api-client-python/quintoandar_airtable_api_client-0.1.0-py2.py3-none-any.whl"
  custom_configurations:
    driver_node_type_id: m5a.2xlarge
    node_type_id: m5a.2xlarge
    num_workers: 2
    spark_version: 12.2.x-scala2.12
    spark_conf:
      spark.sql.legacy.json.allowEmptyString.enabled: "true"
