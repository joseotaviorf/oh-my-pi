  dt_load:
    lineage:
      - datalake_big_agent_clean.tier.ts_created
    description: Load reference date derived from the tier creation timestamp.
  year:
    lineage:
      - datalake_big_agent_clean.tier.ts_created
    description: Partition year derived from ts_created.
  month:
    lineage:
      - datalake_big_agent_clean.tier.ts_created
    description: Partition month derived from ts_created.
  day:
    lineage:
      - datalake_big_agent_clean.tier.ts_created
    description: Partition day derived from ts_created.
