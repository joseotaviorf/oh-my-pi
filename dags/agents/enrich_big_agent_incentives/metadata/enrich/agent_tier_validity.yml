  qualifier_min_points_sale:
    lineage:
      - datalake_big_agent.tier_rule.qualifier_min_points_sale
    description: Minimum trigger points for the FL_FS operation on the qualifier score rule of the assigned tier.
  qualifier_min_points_tqc:
    lineage:
