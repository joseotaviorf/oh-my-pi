  classifier_min_points_tqc:
    lineage:
      - datalake_big_agent.tier_rule.classifier_min_points_tqc
    description: Minimum trigger points for the TQC operation on the classifier score rule of the assigned tier.
  classifier_multiplier_cs:
    lineage:
      - datalake_big_agent.tier_rule.classifier_multiplier_cs
    description: Points multiplier for the CS operation on the classifier score rule of the assigned tier.
  classifier_multiplier_fl_rent:
    lineage:
      - datalake_big_agent.tier_rule.classifier_multiplier_fl_rent
    description: Points multiplier for the FL_FR operation on the classifier score rule of the assigned tier.
  classifier_multiplier_ccv:
