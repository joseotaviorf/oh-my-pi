  qualifier_max_points_tqc:
    lineage:
      - datalake_big_agent.tier_rule.qualifier_max_points_tqc
    description: Maximum points cap for the TQC operation on the qualifier score rule of the assigned tier.
  qualifier_min_points_cs:
    lineage:
