database_name: datalake_big_agent
table_name: earnings
description: |
  Enriched Big Agent earnings from new_earnings joined to earning sources, earning
  invalidations, revenue share, unresolved earnings, and partner tier assignment. One row
  per calculated earning updated within the load window, with contract or sales flow
  context, receiver identifiers, tier and revenue share classification, and monetary
  amounts rounded to two decimals.
domain: Agents
owner: gustavo.rompe@quintoandar.com.br
columns:
  id_earning:
    lineage:
      - datalake_big_agent_clean.new_earnings.id
    description: Primary identifier of the earning record in Big Agent.
  id_unresolved_earning:
    lineage:
      - datalake_big_agent.unresolved_earnings.id_unresolved_earning
    description: |
      Identifier of the unresolved earning marked is_first_solved_by_earning for this earning's
      source, receiver, receiver type, and incentive system, when such a solved record exists.
  id_earning_invalidation:
    lineage:
      - datalake_big_agent_clean.earning_invalidations.id
    description: Identifier of the invalidation record for this earning, when the earning was invalidated.
  id_replacement_earning:
    lineage:
      - datalake_big_agent_clean.earning_invalidations.id_replaced_by
    description: Identifier of the earning that replaced this one after invalidation, when applicable.
  id_earning_source:
    lineage:
      - datalake_big_agent_clean.new_earnings.id_earning_source
    description: Identifier of the earning source that originated this earning.
  id_revenue_share:
    lineage:
      - datalake_big_agent_clean.new_earnings.id_revenue_share
    description: Revenue share identifier linked to the earning calculation.
  id_tier_earning_configuration:
    lineage:
      - datalake_big_agent_clean.new_earnings.id_tier_earning_configuration
    description: Identifier of the tier earning configuration used to calculate this earning, when applicable.
  id_contract:
    lineage:
      - datalake_big_agent_clean.earning_sources.id_external_domain
      - datalake_big_agent_clean.earning_sources.external_domain_type
    description: EBDB contract identifier when the earning source external domain type is RENT_CONTRACT.
  id_sales_flow:
    lineage:
      - datalake_big_agent_clean.earning_sources.id_external_domain
      - datalake_big_agent_clean.earning_sources.external_domain_type
    description: Sales flow identifier when the earning source external domain type is SALES_FLOW.
  id_invalidation_author:
    lineage:
      - datalake_big_agent_clean.earning_invalidations.author
    description: Person identifier extracted from the invalidation author JSON when the actor type is PERSON; otherwise null.
  id_author:
    lineage:
      - datalake_big_agent_clean.new_earnings.id_author
      - datalake_big_agent_clean.new_earnings.author_role
    description: Author identifier from the earning payload when author_role is not SYSTEM; otherwise null.
  id_tier:
    lineage:
      - datalake_big_agent.partner_tier.id_tier
      - datalake_big_agent.revenue_share.id_tier
    description: Tier identifier, preferring the agent's current partner tier assignment and falling back to the tier linked through revenue share.
  id_partner_tier:
    lineage:
      - datalake_big_agent.partner_tier.id_partner_tier
    description: Identifier of the partner tier assignment valid for the agent receiver at the earning creation date.
  id_incentive_engine:
    lineage:
      - datalake_big_agent.revenue_share.id_incentive_engine
      - datalake_big_agent.tier_rule.id_incentive_engine
    description: |
      Incentive engine identifier linked to the earning, preferring revenue share and falling back
      to the tier rule when the partner tier path supplies the engine context.
  id_house:
    lineage:
      - datalake_sales_flow_clean.house.id_external
      - datalake_ebdb_clean.contract.id_house
    description: House identifier resolved from sales flow or rent contract on the earning source.
  id_offer:
    lineage:
      - datalake_sales_flow_clean.offer.id_firestore
    description: Firestore offer identifier when the earning source is linked to a sales flow offer.
  id_offer_business_unit:
    lineage:
      - datalake_sales_flow_clean.offer.id_hub
    description: Business unit (hub) identifier of the offer on the sales flow path.
  id_partner_tier_business_unit:
    lineage:
      - datalake_big_agent.tier_rule.id_business_unit
    description: Business unit identifier from the tier rule linked to the partner tier assignment.
  uuid_cart:
    lineage:
      - datalake_big_agent_clean.earning_sources.uuid_external_cart
    description: Cart UUID from the earning source external cart when a matching cart exists.
  uuid_company:
    lineage:
      - datalake_big_agent_clean.new_earnings.id_external_receiver
      - datalake_big_agent_clean.new_earnings.external_receiver_type
    description: Company receiver UUID when external_receiver_type is COMPANY; otherwise null.
  uuid_person:
    lineage:
      - datalake_big_agent_clean.new_earnings.id_external_receiver
      - datalake_big_agent_clean.new_earnings.external_receiver_type
    description: Agent receiver person UUID when external_receiver_type is AGENT; otherwise null.
  business_context:
    lineage:
      - datalake_big_agent_clean.earning_sources.external_domain_type
    description: Business context derived from external domain type as RENT for RENT_CONTRACT or SALE for SALES_FLOW.
  domain_type:
    lineage:
      - datalake_big_agent_clean.earning_sources.external_domain_type
    description: External domain type discriminator from the earning source (for example RENT_CONTRACT or SALES_FLOW).
  incentive_system:
    lineage:
      - datalake_big_agent_clean.new_earnings.incentive_system
    description: >
      Incentive system label that produced this earning from the Big Agent incentives engine.
    categories:
      DEMAND_CONVERSION_FS: Sale demand-conversion earning.
      DEMAND_ACQUISITION_FS: Sale TQC demand-acquisition earning.
      SUPPLY_ACQUISITION_FS: Sale CIQ supply-acquisition earning.
      DEMAND_CONVERSION_FR: Rent demand-conversion earning.
      DEMAND_ACQUISITION_FR: Rent TQA demand-acquisition earning.
      SUPPLY_ACQUISITION_FR: Rent supply-acquisition earning.
      NEGOTIATION_FS: Sale negotiation-executive earning when configured in Big Agent.
      BUSINESS_OPERATOR_SUPPLY_CONVERSION_FS: Sale associated-executive earning when configured in Big Agent.
  calculated_from:
    lineage:
      - datalake_big_agent_clean.new_earnings.calculated_from
    description: Basis used to calculate the earning (amount or percentage).
  currency:
    lineage:
      - datalake_big_agent_clean.new_earnings.currency
    description: Currency code applied to monetary fields on the earning.
  external_receiver_type:
    lineage:
      - datalake_big_agent_clean.new_earnings.external_receiver_type
    description: Type discriminator for the external receiver.
  earning_status:
    lineage:
      - datalake_big_agent_clean.new_earnings.status
    description: Processing status of the earning record.
  earning_status_reason:
    lineage:
      - datalake_big_agent_clean.new_earnings.reason
    description: Business reason attached to the earning status when applicable.
  invalidation_reason:
    lineage:
      - datalake_big_agent_clean.earning_invalidations.reason
    description: Business reason attached to the earning invalidation when applicable.
  invalidation_description:
    lineage:
      - datalake_big_agent_clean.earning_invalidations.invalidation_description
    description: Free-text description explaining the earning invalidation when applicable.
  unresolved_earning_reason:
    lineage:
      - datalake_big_agent.unresolved_earnings.reason
    description: Business reason from the linked unresolved earning queue item that preceded this earning's calculation.
  performance_evaluation_period:
    lineage:
      - datalake_big_agent.revenue_share.performance_evaluation_period
    description: Performance evaluation period of the incentive system configuration. For example, P2M (last 2 months).
  tier_validity_period:
    lineage:
      - datalake_big_agent.revenue_share.tier_validity_period
    description: Tier validity period of the incentive system configuration. For example, P2M (next 2 months).
  revenue_share_type:
    lineage:
      - datalake_big_agent.revenue_share.revenue_share_type
    description: Revenue share type configured on the linked revenue share record (for example TIER, CRCC, FIFTY).
  revenue_share_value:
    lineage:
      - datalake_big_agent.revenue_share.revenue_share_value
    description: Configured revenue share value from the linked revenue share record.
  tier_name:
    lineage:
      - datalake_big_agent.partner_tier.tier_name
    description: Display name of the tier assigned to the agent receiver at the earning creation date.
  base_amount:
    lineage:
      - datalake_big_agent_clean.earning_sources.base_amount
    description: Base monetary amount from the earning source before revenue share calculation.
  revenue_share_total_amount:
    lineage:
      - datalake_big_agent_clean.earning_sources.revenue_share_total_amount
    description: Total revenue share amount configured on the earning source.
  brokerage_fee:
    lineage:
      - datalake_sales_flow_clean.brokerage.brokerage_fee
      - datalake_big_agent_clean.new_earnings.revenue_percentage
    description: |
      Brokerage fee percentage for the transaction context: sales-flow brokerage fee on SALE
      or sum of revenue_percentage for the earning source for each incentive system on RENT.
  calculation_base_amount:
    lineage:
      - datalake_big_agent_clean.earning_sources.revenue_share_total_amount
      - datalake_big_agent_clean.earning_sources.base_amount
      - datalake_big_agent_clean.new_earnings.calculated_from
    description: |
      Monetary base used to calculate the earning. Built by choosing revenue_share_total_amount
      when calculated_from is REVENUE_SHARE_TOTAL_AMOUNT, otherwise base_amount.
  revenue_amount:
    lineage:
      - datalake_big_agent_clean.new_earnings.revenue_amount
    description: Revenue amount calculated for this earning, rounded to two decimal places.
  revenue_percentage:
    lineage:
      - datalake_big_agent_clean.new_earnings.revenue_percentage
    description: Revenue percentage calculated for this earning (brokerage share component), rounded to two decimal places.
  author_role:
    lineage:
      - datalake_big_agent_clean.new_earnings.author_role
    description: Role of the author in the incentive system (for example agent or system roles).
  author_channel:
    lineage:
      - datalake_big_agent_clean.new_earnings.author_channel
    description: Channel through which the author acted.
  author_on_behalf_of_role:
    lineage:
      - datalake_big_agent_clean.new_earnings.author_on_behalf_of_role
    description: Role of the actor on whose behalf the earning was authored.
  is_authored_by_system:
    lineage:
      - datalake_big_agent_clean.new_earnings.author_role
    description: True when author_role is SYSTEM.
  is_manual_calculation:
    lineage:
      - datalake_big_agent_clean.new_earnings.reason
    description: True when the earning status reason is MANUAL_CALCULATION.
  is_invalid:
    lineage:
      - datalake_big_agent_clean.new_earnings.status
      - datalake_big_agent_clean.earning_invalidations.id
    description: True when the earning status is INVALIDATED or an invalidation record exists for the earning.
  is_calculated:
    lineage:
      - datalake_big_agent_clean.new_earnings.status
    description: True when the earning status is CALCULATED.
  is_3p_lead_gen_offer:
    lineage:
      - datalake_big_agent_clean.new_earnings.is_3p_lead_gen_offer
    description: True when the earning source is linked to a 3p lead gen offer.
  is_fifty_revenue_share:
    lineage:
      - datalake_big_agent.revenue_share.revenue_share_type
    description: True when the revenue share type is FIFTY.
  is_crcc_revenue_share:
    lineage:
      - datalake_big_agent.revenue_share.revenue_share_type
    description: True when the revenue share type is CRCC.
  is_tier_revenue_share:
    lineage:
      - datalake_big_agent.revenue_share.revenue_share_type
    description: True when the revenue share type is TIER.
  dt_payment_due:
    lineage:
      - datalake_big_agent_clean.new_earnings.dt_payment_due
    description: Date when the payment for this earning is due.
  dt_tier_reference:
    lineage:
      - datalake_big_agent.partner_tier.dt_validity_started
    description: Partner tier validity start date used as the tier reference for this earning.
  ts_unresolved_earning_solved:
    lineage:
      - datalake_big_agent.unresolved_earnings.ts_solved
    description: Timestamp when the linked unresolved earning queue item was marked solved.
  ts_created:
    lineage:
      - datalake_big_agent_clean.new_earnings.ts_created
    description: Timestamp when the earning was created in Big Agent.
  ts_invalidated:
    lineage:
      - datalake_big_agent_clean.earning_invalidations.ts_invalidated
    description: Timestamp when the earning was invalidated in Big Agent.
  ts_sent_to_finance:
    lineage:
      - datalake_big_agent_clean.earning_sources.ts_sent_to_finance
    description: Timestamp when the earning was sent to finance in Big Agent.
  ts_contract_signed:
    lineage:
      - datalake_sales_flow_clean.ccv.ts_signed
      - datalake_ebdb_clean.contract.ts_signed
    description: >
      Contract signature timestamp from the linked sale CCV or rent contract; null when the
      earning has no signed contract in the source domain.
  ts_updated:
    lineage:
      - datalake_big_agent_clean.new_earnings.ts_updated
    description: Timestamp when the earning was last updated in Big Agent.
  year:
    lineage:
      - datalake_big_agent_clean.new_earnings.ts_created
    description: Partition year derived from ts_created.
  month:
    lineage:
      - datalake_big_agent_clean.new_earnings.ts_created
    description: Partition month derived from ts_created.
  day:
    lineage:
      - datalake_big_agent_clean.new_earnings.ts_created
    description: Partition day derived from ts_created.
