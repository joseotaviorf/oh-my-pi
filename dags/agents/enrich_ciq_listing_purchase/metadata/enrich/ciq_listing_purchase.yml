---
database_name: datalake_ciq
table_name: ciq_listing_purchase
description: >
  CIQ listing-purchase enrich: one row per signed rent id_contract (house_listing path, RENT LBC or
  legacy NULL context) plus separate SALE-context rows for duplicity only (not eligible for payment).
  Robin Hood listing-purchase payment and AAREDE-470 initial pricing apply on the rent arm; consultant
  is the last CIQ on the listing from house_listing_consultant (is_last_ciq_on_listing), same grain as FL Valid.
domain: Agents
owner: anne.macedo@quintoandar.com.br
columns:
  id_listing_purchase:
    description: >
      Surrogate key (XXHASH64) over house, house listing, partner, CIQ user, business context,
      and consultant type for the listing-purchase grain.
    lineage:
      - core_house.house.id_house
      - datalake_ebdb_listing.house_listing.id_house_listing
      - datalake_big_agent.house_listing_consultant.id_partner
  id_house:
    description: House identifier in CIQ capture context.
    lineage:
      - core_house.house.id_house
  id_partner:
    description: >
      Partner company of the last CIQ on the listing (house_listing_consultant.is_last_ciq_on_listing);
      used as the Compra de Carteira payment partner key.
    lineage:
      - datalake_big_agent.house_listing_consultant.id_partner
  id_house_listing:
    description: House listing id from the rent listing version joined to contract.
    lineage:
      - datalake_ebdb_listing.house_listing.id_house_listing
  id_contract:
    description: >
      Rent contract id from house_listing on RENT rows; NULL on SALE duplicity rows because SALE
      captures an offer rather than a rent contract.
    lineage:
      - datalake_ebdb_listing.house_listing.id_contract
  id_offer:
    description: >
      Latest non-canceled sale offer id from the CCV selected for SALE duplicity rows; NULL on RENT
      rows.
    lineage:
      - datalake_sale_offer.sale_offer.id_offer
  id_owner:
    description: Owner user id from core house.
    lineage:
      - core_house.house.id_owner
  id_ciq_user:
    description: >
      Platform user of the last CIQ attributed to the listing version; null when the listing has no
      last-CIQ row in house_listing_consultant or the last CIQ row has no id_user. Rows with null
      id_ciq_user are not eligible for Compra de Carteira payment.
    lineage:
      - datalake_big_agent.house_listing_consultant.id_user
  id_internal_agent:
    description: Big-agent internal agent id linked to CIQ enrollment.
    lineage:
      - datalake_big_agent.agent_enrollment.id_internal_agent
  id_enrollment:
    description: Big-agent enrollment id for CIQ assignment.
    lineage:
      - datalake_big_agent.house_listing_consultant.id_enrollment
  id_accounting_entry:
    description: >
      Robin Hood accounting entry id when matched on rent id_contract and
      1p-portfolio-purchase source (id_house is null on manual Compra de Carteira payouts).
    lineage:
      - datalake_robin_hood.accounting_entry.id
  id_address_parsed_duplicity:
    description: Parsed address duplicity key from listing deduplication (id_address_parsed_short).
    lineage:
      - datalake_listing_deduplication.listing_deduplication.id_address_parsed_short
  id_atlas_duplicity:
    description: Property-dedup duplicity output id when Atlas marks the house.
    lineage:
      - datalake_listing_deduplication.atlas_house_deduplication.id_duplicity
  address:
    description: Full parsed address string from listing deduplication.
    lineage:
      - datalake_listing_deduplication.listing_deduplication.address_full
  parsed_first_listing_order:
    description: First listing order from address-parsed deduplication for ordering captures on the same key.
    lineage:
      - datalake_listing_deduplication.listing_deduplication.first_listing_order
  city_name:
    description: Normalized city name resolved from core house city and region reference tables.
    lineage:
      - core_house.house.city
      - datalake_region.region.city_name
  city_group:
    description: Commercial city group used for regional pricing segmentation.
    lineage:
      - datalake_region.region.city_group
  supply_source:
    description: Rent supply funnel origin label at funnel step six (CIQ or other channel).
    lineage:
      - datalake_ciq.ciq_supply_events_tracking.company_report_origin
  business_context:
    description: >
      RENT or SALE from listing_business_context on payment/duplicity rows; NULL on legacy rent
      contracts when the house has no listing_business_context row (explicit not-eligible).
    lineage:
      - datalake_ebdb_clean.listing_business_context.business_context
  consultant_type:
    description: >
      CIQ consultant type from house_listing_consultant last CIQ on the listing (CIQ_FULL, PRO_ACQUIRER,
      Core, or other Big Agent tiers); null when the listing has no last-CIQ row.
    lineage:
      - datalake_big_agent.house_listing_consultant.consultant_type
  listing_status:
    description: >
      Listing status (uppercased for consistent comparisons) from house listing version or listing
      business context fallback.
    lineage:
      - datalake_ebdb_listing.house_listing.status
      - datalake_ebdb_clean.listing_business_context.status
  listing_category:
    description: >
      Rent listing version category from house listing (First Listing, Re-Listing, Recovered, or null),
      used to identify relist cycles for CIQ portfolio analytics.
    lineage:
      - datalake_ebdb_listing.house_listing.listing_category
  contract_status:
    description: Contract status from core contract.
    lineage:
      - core_contract.contract.status
  initial_pricing_type_reason:
    description: >
      Full human-readable initial pricing segment from the AAREDE-470 transition rules: not-eligible
      when business context is not RENT, consultant is not CIQ_FULL or PRO_ACQUIRER, there is no signed contract yet,
      there is no active CIQ agent user on the last listing CIQ row (id_ciq_user is null), or the contract was signed
      before 2026-07-01; not-eligible when the house has a rent contract in house_listing
      but no row in listing_business_context (legacy data gap, surfaced explicitly); hybrid when the house converted from sale to rent;
      new-listings when published and rented after the transition; ongoing-listings when published
      before the transition with no previous contract and first rented after it; ongoing-rentals when
      published before the transition with a previous contract and re-rented after it.
    lineage:
      - datalake_ebdb_clean.listing_business_context.business_context
      - datalake_ebdb_clean.listing_business_context.ts_first_publication
      - datalake_big_agent.house_listing_consultant.consultant_type
      - datalake_listing_deduplication.valid_first_listing.hybrid_creation_order
      - datalake_ebdb_listing.house_listing.ts_contract_signed
  initial_pricing_type:
    description: >
      Commercial segment prefix parsed from initial_pricing_type_reason
      (hybrid, new-listings, ongoing-rentals, ongoing-listings, or not-eligible), before acquisition
      and duplicity rules in listing_purchase_pricing are applied.
    lineage:
      - datalake_ebdb_clean.listing_business_context.business_context
      - datalake_ebdb_clean.listing_business_context.ts_first_publication
      - datalake_big_agent.house_listing_consultant.consultant_type
      - datalake_listing_deduplication.valid_first_listing.hybrid_creation_order
      - datalake_ebdb_listing.house_listing.ts_contract_signed
  amount_paid:
    description: Due amount on the matched Robin Hood accounting entry when present.
    lineage:
      - datalake_robin_hood.accounting_entry.due_amount
  total_days_since_house_inactived:
    description: >
      Days between listing version start and end when the listing version is in a qualifying inactive
      state; zero when not inactive.
    lineage:
      - datalake_ebdb_listing.house_listing.ts_listing_version_start
      - datalake_ebdb_listing.house_listing.ts_listing_version_end
      - datalake_ebdb_listing.house_listing.status
      - datalake_ebdb_listing.house_listing.status_reason
  total_days_since_publish:
    description: >
      Calendar days from ts_publicated to the load date for this listing version; null when
      ts_publicated is missing.
    lineage:
      - datalake_ebdb_listing.house_listing.ts_publicated
  has_similiar_house_by_address_parsed:
    description: True when listing deduplication flags the house as duplicated on parsed address.
    lineage:
      - datalake_listing_deduplication.listing_deduplication.has_duplicates
  has_similiar_house_by_atlas:
    description: True when an Atlas house deduplication row exists for this house.
    lineage:
      - datalake_listing_deduplication.atlas_house_deduplication.id_duplicity
  has_republication:
    description: True when a later house listing version exists after the current one.
    lineage:
      - datalake_ebdb_listing.house_listing.ts_listing_version_start
  is_first_contract_signed_by_house:
    description: True when this listing version is the first signed contract on the house.
    lineage:
      - datalake_ebdb_listing.house_listing.ts_contract_signed
  is_last_contract_signed_by_house:
    description: True when this listing version is the most recent signed contract on the house.
    lineage:
      - datalake_ebdb_listing.house_listing.ts_contract_signed
  is_last_house_listing:
    description: True when this row is the last house listing version on the house.
    lineage:
      - datalake_ebdb_listing.house_listing.is_last_version
  is_house_inactive:
    description: >
      True when the house listing version is OPTED_OUT or UNPUBLISHED with status_reason different
      from RENTED.
    lineage:
      - datalake_ebdb_listing.house_listing.status
      - datalake_ebdb_listing.house_listing.status_reason
  is_paid:
    description: True when a non-blocked Robin Hood payment occurrence exists.
    lineage:
      - datalake_robin_hood.accounting_entry.dt_occurrence
  dt_paid:
    description: Payment occurrence date from Robin Hood when paid.
    lineage:
      - datalake_robin_hood.accounting_entry.dt_occurrence
  dt_contract_termination:
    description: Contract termination date from core contract when present.
    lineage:
      - core_contract.contract.dt_termination
  ts_contract_signed:
    description: Contract signature timestamp from house listing.
    lineage:
      - datalake_ebdb_listing.house_listing.ts_contract_signed
  ts_contract_signed_local_tz:
    description: >
      Contract signature timestamp in America/Sao_Paulo. Same instant used for the 2026-07-01
      compra de carteira transition when classifying initial_pricing_type (ongoing vs new listings).
    lineage:
      - datalake_ebdb_listing.house_listing.ts_contract_signed
  ts_next_contract_signed:
    description: Next contract signature timestamp on the same house when present.
    lineage:
      - datalake_ebdb_listing.house_listing.ts_contract_signed
  ts_previous_contract_signed:
    description: Previous contract signature timestamp on the same house (LAG by listing version).
    lineage:
      - datalake_ebdb_listing.house_listing.ts_contract_signed
  ts_publicated:
    description: >
      Timestamp when this rent listing version was published; for Re-Listing rows this anchors the
      start of the new publish event after a prior rental cycle.
    lineage:
      - datalake_ebdb_listing.house_listing.ts_publicated
  ts_house_inactived:
    description: Listing version start timestamp when the version is in qualifying inactive state; null otherwise.
    lineage:
      - datalake_ebdb_listing.house_listing.ts_listing_version_start
  ts_house_registration:
    description: Timestamp when the CIQ agency row was created for the house.
    lineage:
      - datalake_big_agent.house_consultant_history.ts_agency_created
  ts_first_listing:
    description: First publication timestamp from listing business context.
    lineage:
      - datalake_ebdb_clean.listing_business_context.ts_first_publication
  ts_first_listing_local_tz:
    description: >
      First rent publication timestamp in America/Sao_Paulo from listing business context. Reference
      for payment transition rules (new-listings vs ongoing-listings) alongside initial_pricing_type.
    lineage:
      - datalake_ebdb_clean.listing_business_context.ts_first_publication
  ts_load:
    description: Timestamp when this enrich row was materialized.
  year:
    description: Partition year from agency registration timestamp.
    lineage:
      - datalake_big_agent.house_consultant_history.ts_agency_created
  month:
    description: Partition month from agency registration timestamp.
    lineage:
      - datalake_big_agent.house_consultant_history.ts_agency_created
  day:
    description: Partition day from agency registration timestamp.
    lineage:
      - datalake_big_agent.house_consultant_history.ts_agency_created
