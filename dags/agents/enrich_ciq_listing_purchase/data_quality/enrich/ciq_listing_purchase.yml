---
table_name: datalake_ciq.ciq_listing_purchase
alert_channel: "#agents-data-alarms"
column_level_validations:
  id_house:
    is_complete:
      severity_level: Error
    custom:
      constraint: |-
        (SELECT COUNT(*) FROM (
          SELECT id_house, id_contract, id_partner
          FROM datalake_ciq.ciq_listing_purchase
          GROUP BY id_house, id_contract, id_partner
          HAVING COUNT(*) > 1
        )) = 0
      severity_level: Error
  id_partner:
    is_complete:
      severity_level: Error
  id_address_parsed_duplicity:
    is_complete:
      severity_level: Warning
  id_house_listing:
    is_complete:
      severity_level: Warning
  id_contract:
    is_complete:
      severity_level: Warning
