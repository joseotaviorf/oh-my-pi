---
database_name: datalake_agenda_allocation
table_name: agents_slots_hourly
description: Table with information about the agents allocated slots hourly.
domain: Agents
owner: gustavo.rompe@quintoandar.com.br
columns:
  id_agent:
    description: QuintoAndar field agent identifier (EBDB dados_agente_id) whose hourly allocation counts are aggregated in this row.
    lineage:
      - datalake_agenda_allocation.agents_slots.id_agent
  agent_type:
    description: Agent type according to the activity performed by the agent.
    lineage:
      - datalake_agenda_allocation.agents_slots.agent_type
  day_of_week:
    description: Day of the week (starting at 1 for Monday).
    lineage:
      - datalake_agenda_allocation.agents_slots.day_of_week
  allocated_slots:
    description: Number of allocated slots for the hour.
    lineage:
      - datalake_agenda_allocation.agents_slots.last_change_reason
      - datalake_agenda_allocation.agents_slots.is_available_slot_24h
  specific_allocated_slots:
    description: Number of specific allocated slots for the hour.
    lineage:
      - datalake_agenda_allocation.agents_slots.last_change_reason
      - datalake_agenda_allocation.agents_slots.is_available_specific_slot
  ts_slot_hour:
    description: Hour-level timestamp (start of hour) used to roll up 15-minute slot allocations for the agent on that weekday.
    lineage:
      - datalake_agenda_allocation.agents_slots.ts_slot
  year:
    description: Year of the slot.
    lineage:
      - datalake_agenda_allocation.agents_slots.ts_slot
  month:
    description: Month of the slot.
    lineage:
      - datalake_agenda_allocation.agents_slots.ts_slot
  day:
    description: Day of the slot.
    lineage:
      - datalake_agenda_allocation.agents_slots.ts_slot
