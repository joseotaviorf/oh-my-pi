---
database_name: datalake_agenda_allocation
table_name: slots_base_time
description: Each row of this table is a possible time slot, starting on 2019-01-01. 
  A slot is a 15 minute slice of an hour (e.g. 07:00, 07:15, 07:30 and 07:45).
domain: Agents
owner: gustavo.rompe@quintoandar.com.br
columns:
  day_of_week:
    description: Day of week (starting on mondays)
  slot_number:
    description: Sequential 15-minute index within the business day, counting from 08:00 (0) in 15-minute steps up to 21:00.
  ts_slot:
    description: Absolute timestamp for each generated 15-minute interval from 07:00 through 21:00, starting 2019-01-01 through two months ahead.
