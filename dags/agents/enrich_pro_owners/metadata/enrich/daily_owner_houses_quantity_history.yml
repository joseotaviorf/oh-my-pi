database_name: datalake_pro_owners
table_name: daily_owner_houses_quantity_history
description: Historical enriched table for rent context (PP Multi - Pro owner). Each
  row contains the changes of owner's quantity houses per day, just considering rent
  and excluding b2b houses.
domain: Data Agents
owner: data-ae-agents@quintoandar.com.br
columns:
  id_owner:
    lineage:
    - datalake_ebdb_user.user_merge.id_user
    - datalake_pro_owners.house_b2b_history.id_user
    description: Id user of the owner.
  id_account_manager:
    lineage:
    - datalake_ebdb_clean.user_pro_owner_aud.id_account_manager
    description: Id user of the account manager associated to an id_owner of a specific day.
  country_code:
    lineage:
    - datalake_ebdb_country.user.country_code
    description: Country code of the user.
  rental_administrator:
    lineage:
    - datalake_ebdb_listing.rent_listing.rental_administrator
    description: The rental administrator of the house.
  houses_published:
    description: Quantity of distincts houses that the owner has on a respective day with status 'publicado' or 'PUBLISHED'.
  houses_suspended:
    description: Quantity of distincts houses that the owner has on a respective day with status 'suspenso' or 'SUSPENDED' but it's not rented.
  houses_rented:
    description: Quantity of distincts houses that the owner has on a respective day with status 'alugado' or 'SUSPENDED' but rented.
  houses_unpublished:
    description: Quantity of distincts houses that the owner has on a respective day with status 'despublicado' or 'UNPUBLISHED'.
  houses_in_edition:
    description: Quantity of distincts houses that the owner has on a respective day with status 'edicao' or 'EDITING'.
  houses_opted_out:
    description: Quantity of distincts houses that the owner has on a respective day with status 'excluido' or 'OPTED_OUT'.
  ongoing_houses:
    description: Quantity of distincts houses that the owner has on a respective day with status 'publicado', 'alugado' and 'suspenso'.
  total_houses:
    description: Quantity of distincts houses that the owner has on a respective day independent of the status.
  brokerage_only_houses:
    description: Quantity of distincts houses that the owner had and that is
      managed by the owner (rental_administration = OWNER, which
      means it's a Brokerage Only house).
  quintoandar_houses:
    description: Quantity of distincts houses that the owner had and that is
      managed by QuintoAndar (rental_administration = QUINTOANDAR).
  third_party_houses:
    description: Quantity of distincts houses that the owner had and the house is
      from a third party supply. (rental_administration = THIRD_PARTY).
  is_merged_user:
    description: Boolean flag to check if the user is merged from another user.
  is_pp_multi_active:
    description: Boolean flag to check if the customer is a PP Multi and is active.
  dt_houses_owned:
    lineage:
    - datalake_quintoandar.aux_date.date
    description: The date of the PP's house quantity.
  year:
    description: Year value of the date reference. Also, it's a partition.
  month:
    description: Month value of the date reference. Also, it's a partition.
  day:
    description: Day value of the date reference. Also, it's a partition.
