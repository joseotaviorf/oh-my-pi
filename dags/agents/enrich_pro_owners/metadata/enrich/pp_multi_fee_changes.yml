---
database_name: datalake_pro_owners
table_name: pp_multi_fee_changes
description: Table with historical information about the PP Multi's administration fee.
  Each line represents the change of the adminstration_fee or is_active colum.
domain: Data Agents
owner: data-ae-agents@quintoandar.com.br
columns:
  id_owner:
    lineage:
      - datalake_ebdb_clean.user_pro_owner.id_user
    description: ID user of the PP Multi (ProOwner).
  administration_fee:
    lineage:
      - datalake_ebdb_clean.pro_owner_fee_aud.adm_fee
    description: Owner's/Landlord's administration fee.
  is_active:
    lineage:
      - datalake_ebdb_clean.pro_owner_fee_aud.is_active
    description: Boolean flag to check if the adminstration fee is active.
  is_last_status_of_day:
    description: Boolean flag to indicate of the status is the last one of the day.
  ts_adm_fee_started:
    description: Timestamp of when the status started.
    lineage:
      - datalake_ebdb_user.user_revision_entity.ts_revision
  ts_adm_fee_ended:
    description: Timestamp of when the status ended.
    lineage:
      - datalake_ebdb_user.user_revision_entity.ts_revision
