      - dw_visit.fact_visits.sk_house_entrance
      - dw_visit.fact_visits.sk_last_associated_agent
      - dw_house.dim_house_entrance_history.key_location
      - dw_house.dim_house_entrance_history.sk_user_key_holder
      - dw_house.dim_house_entrance_history.event_type
  total_visit_vbba:
    description: >
      Same as total_visit, restricted to visits flagged as VBBA (Visit Booked
      By Agent). Attributed to fact_visits.sk_user_agent_vbba (the agent who
      booked the visit), not to the visit's last associated agent.
    lineage:
      - dw_visit.fact_visits.num_visit_booked
      - dw_visit.dim_visit.is_vbba
      - dw_visit.fact_visits.sk_user_agent_vbba
  total_reschedule_vbba:
    description: >
      Same as total_reschedule, restricted to VBBA visits (see
      total_visit_vbba for the agent attribution rule).
    lineage:
      - dw_visit.fact_visits.nbr_reschedule
      - dw_visit.dim_visit.is_vbba
      - dw_visit.fact_visits.sk_user_agent_vbba
  total_visit_canceled_vbba:
    description: >
      Same as total_visit_canceled, restricted to VBBA visits (see
      total_visit_vbba for the agent attribution rule).
    lineage:
      - dw_visit.fact_visits.num_visit_canceled
      - dw_visit.dim_visit.is_visit_canceled
      - dw_visit.dim_visit.is_vbba
      - dw_visit.fact_visits.sk_user_agent_vbba
  total_visit_completed_vbba:
    description: >
      Same as total_visit_completed, restricted to VBBA visits (see
      total_visit_vbba for the agent attribution rule).
    lineage:
