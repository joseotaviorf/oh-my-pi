    lineage:
      - dw_visit.dim_visit.has_visit_finisher_status
      - dw_visit.dim_visit_schedule.ts_next_schedule_created
      - dw_house.dim_house_entrance_history.key_location
      - dw_house.dim_house_entrance_history.sk_user_key_holder
      - dw_house.dim_house_entrance_history.event_type
  total_offer_submitted_crcc:
    description: >
      Same as total_offer_submitted, restricted to CRCC schedules (see
      total_schedule_crcc).
    lineage:
      - datalake_sale_offer.sale_offer.ts_offer_submitted
      - dw_visit.dim_visit_schedule.ts_next_schedule_created
      - dw_house.dim_house_entrance_history.key_location
      - dw_house.dim_house_entrance_history.sk_user_key_holder
      - dw_house.dim_house_entrance_history.event_type
  total_offer_accepted_crcc:
    description: >
      Same as total_offer_accepted, restricted to CRCC schedules (see
      total_schedule_crcc).
    lineage:
      - datalake_sale_offer.sale_offer.ts_offer_accepted
      - dw_visit.dim_visit_schedule.ts_next_schedule_created
      - dw_house.dim_house_entrance_history.key_location
      - dw_house.dim_house_entrance_history.sk_user_key_holder
      - dw_house.dim_house_entrance_history.event_type
  total_agreement_signed_crcc:
    description: >
      Same as total_agreement_signed, restricted to CRCC schedules (see
      total_schedule_crcc).
    lineage:
      - datalake_sale_offer.sale_offer.ts_sale_agreement_signed
      - datalake_sale_offer.sale_offer.ts_sale_agreement_canceled
      - dw_visit.dim_visit_schedule.ts_next_schedule_created
      - dw_house.dim_house_entrance_history.key_location
      - dw_house.dim_house_entrance_history.sk_user_key_holder
      - dw_house.dim_house_entrance_history.event_type
  total_schedule_vbba:
    description: >
      Same as total_schedule, restricted to schedules flagged as VBBA
      (Visit Booked By Agent).
    lineage:
      - dw_visit.fact_visit_schedules.is_booking
      - dw_visit.fact_visit_schedules.is_schedule_vbba
  total_reschedule_vbba:
    description: >
      Same as total_reschedule, restricted to VBBA schedules.
    lineage:
      - dw_visit.dim_visit_schedule.ts_next_schedule_created
      - dw_visit.fact_visit_schedules.is_schedule_vbba
  total_visit_canceled_vbba:
    description: >
      Same as total_visit_canceled, restricted to VBBA schedules.
    lineage:
      - dw_visit.dim_visit_schedule.ts_next_schedule_created
      - dw_visit.fact_visits.num_visit_canceled
      - dw_visit.fact_visit_schedules.is_schedule_vbba
  total_visit_completed_vbba:
    description: >
      Same as total_visit_completed, restricted to VBBA schedules.
    lineage:
      - dw_visit.dim_visit_schedule.ts_next_schedule_created
      - dw_visit.fact_visits.num_visit_completed
      - dw_visit.fact_visit_schedules.is_schedule_vbba
  total_visit_unsuccessful_vbba:
