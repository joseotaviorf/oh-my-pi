---
database_name: "dw_agent_performance"
table_name: "agent_visit_funnel"
description: >
  Daily agent visit funnel table. Grain is one row per (uuid_person, date_ref),
  where uuid_person is the agent's person UUID and date_ref is the visit
  creation/demand reference date. Aggregates visit funnel counters (booked,
  rescheduled, canceled, completed, unsuccessful, stalled, not finished, offer
  submitted/accepted, sale agreement signed) from
  datalake_agent_performance.visit_funnel_event, split into four cuts:
  overall, PFA (agent is the house's fixed/preferred agent), CRCC (agent
  currently holds the house key) and VBBA (visit booked by agent). The
  overall/PFA/CRCC cuts attribute visits to the last associated agent; the VBBA
  cut attributes to the agent who booked the visit. Loaded incrementally by DAG
  dw_agent_visit_funnel, merged on sk_agent_visit_funnel (MD5 of uuid_person,
  date_ref).
domain: "Agents"
owner: "guilherme.rocha@quintoandar.com.br"
columns:
  sk_agent_visit_funnel:
    description: >
      Surrogate key for the row, computed as MD5(uuid_person || date_ref).
      Deterministic given the grain and used as the MERGE key (see
      merge_on: [sk_agent_visit_funnel] in the declaration).
    lineage:
      - datalake_agent_performance.visit_funnel_event.uuid_person_last_associated_agent
      - datalake_agent_performance.visit_funnel_event.dt_visit_created
      - dw_agent.fact_agent_daily.uuid_person
      - dw_agent.fact_agent_daily.dt_ref
  uuid_person:
    description: >
      Person UUID of the agent. Grain key alongside date_ref. Sourced from
      visit_funnel_event for visit-driven rows, and from dw_agent.fact_agent_daily
      for days the agent was allowed to receive demand visits with no visit
      activity in the load window.
    lineage:
      - datalake_agent_performance.visit_funnel_event.uuid_person_last_associated_agent
      - dw_agent.fact_agent_daily.uuid_person
  date_ref:
    description: >
      Reference date of the funnel snapshot. For visit-driven rows, the visit
      creation date when ts_source_updated falls within the load window; for
      demand-allowance rows with no visit activity, the fact_agent_daily
      reference date.
    lineage:
      - datalake_agent_performance.visit_funnel_event.dt_visit_created
      - datalake_agent_performance.visit_funnel_event.ts_source_updated
      - dw_agent.fact_agent_daily.dt_ref
  total_visit:
    description: >
      Count of visits booked by the agent whose creation date is the
      reference date.
    lineage:
      - datalake_agent_performance.visit_funnel_event.is_visit_booked
  total_reschedule:
    description: >
      Number of reschedules accumulated by visits created on the reference
      date.
    lineage:
      - datalake_agent_performance.visit_funnel_event.nbr_reschedule
  total_visit_canceled:
    description: >
      Count of visits canceled among visits created on the reference date.
    lineage:
      - datalake_agent_performance.visit_funnel_event.is_visit_canceled
  total_visit_completed:
    description: >
      Count of visits completed among visits created on the reference date.
    lineage:
      - datalake_agent_performance.visit_funnel_event.is_visit_completed
  total_visit_unsuccessful:
    description: >
      Count of visits marked unsuccessful among visits created on the
      reference date.
    lineage:
      - datalake_agent_performance.visit_funnel_event.is_visit_unsuccessful
  total_visit_stalled:
    description: >
      Count of visits marked as stalled among visits created on the reference
      date.
    lineage:
      - datalake_agent_performance.visit_funnel_event.is_visit_stalled
  total_visit_not_finished:
    description: >
      Count of visits created on the reference date that have not yet reached
      a finisher status (completed, canceled, unsuccessful or stalled).
    lineage:
      - datalake_agent_performance.visit_funnel_event.is_visit_not_finished
  total_offer_submitted:
    description: >
      Count of visits created on the reference date where the visitor
      submitted a sale offer.
    lineage:
      - datalake_agent_performance.visit_funnel_event.is_offer_submitted
  total_offer_accepted:
    description: >
      Count of visits created on the reference date where the submitted sale
      offer was accepted.
    lineage:
      - datalake_agent_performance.visit_funnel_event.is_offer_accepted
  total_agreement_signed:
    description: >
      Count of visits created on the reference date where a sale agreement
      was signed and not later canceled.
    lineage:
      - datalake_agent_performance.visit_funnel_event.is_agreement_signed
  avg_hours_booked_to_completed:
    description: >
      Average elapsed hours from visit booking (ts_visit_created) to visit
      completion (ts_visit_done) among completed visits created on the
      reference date. Null when no qualifying visits exist for the agent-day.
    lineage:
      - datalake_agent_performance.visit_funnel_event.ts_visit_created
      - datalake_agent_performance.visit_funnel_event.ts_visit_done
      - datalake_agent_performance.visit_funnel_event.is_visit_completed
  avg_hours_completed_to_offer_submitted:
    description: >
      Average elapsed hours from visit completion (ts_visit_done) to sale
      offer submission (ts_offer_submitted) among visits with an offer
      submitted, for visits created on the reference date. Null when no
      qualifying visits exist for the agent-day.
    lineage:
      - datalake_agent_performance.visit_funnel_event.ts_visit_done
      - datalake_agent_performance.visit_funnel_event.ts_offer_submitted
      - datalake_agent_performance.visit_funnel_event.is_offer_submitted
  total_visit_pfa:
    description: >
      Same as total_visit, restricted to visits where the agent is the
      house's fixed/preferred agent (PFA).
    lineage:
      - datalake_agent_performance.visit_funnel_event.is_visit_booked
      - datalake_agent_performance.visit_funnel_event.is_pfa_visit
  total_reschedule_pfa:
