---
database_name: "dw_agent_performance"
table_name: "agent_visit_funnel"
description: >
  Daily agent visit funnel table. Grain is one row per (uuid_person, date_ref),
  where uuid_person is the agent's person UUID and date_ref is the visit
  creation/demand reference date. Aggregates visit funnel counters (booked,
  rescheduled, canceled, completed, unsuccessful, stalled, not finished, offer
  submitted/accepted, sale agreement signed) sourced from dw_visit fact/dim
  tables, datalake_sale_offer.sale_offer and dw_house.dim_house_entrance_history,
  split into four cuts: overall, PFA (agent is the house's fixed/preferred
  agent), CRCC (agent currently holds the house key per house_entrance_history)
  and VBBA (visit booked by agent). The overall/PFA/CRCC cuts attribute a visit
  to its last associated agent (fact_visits.sk_last_associated_agent); the VBBA
  cut instead attributes it to the agent who booked the visit on the visitor's
  behalf (fact_visits.sk_user_agent_vbba), which can be a different agent.
  Loaded incrementally (workflow.type: query_delta) by DAG
  dw_agent_visit_funnel, merged on sk_agent_visit_funnel (derived from
  uuid_person, date_ref).
domain: "Agents"
owner: "guilherme.rocha@quintoandar.com.br"
columns:
  sk_agent_visit_funnel:
    description: >
      Surrogate key for the row, computed as MD5(uuid_person || date_ref).
      Deterministic given the grain and used as the MERGE key (see
      merge_on: [sk_agent_visit_funnel] in the declaration).
    lineage:
      - dw_public.dim_user.uuid_person
      - dw_agent.fact_agent_daily.uuid_person
      - dw_visit.dim_visit.dt_created
      - dw_agent.fact_agent_daily.dt_ref
  uuid_person:
    description: >
      Person UUID of the agent. Grain key alongside date_ref. Sourced from
      dw_public.dim_user (joined on the last associated agent's sk_user) for
      visit-driven rows, and directly from dw_agent.fact_agent_daily for days
      the agent was allowed to receive demand visits with no visit activity in
      the load window.
    lineage:
      - dw_public.dim_user.uuid_person
      - dw_agent.fact_agent_daily.uuid_person
  date_ref:
    description: >
      Reference date of the funnel snapshot. For visit-driven rows, the visit
      creation date, included when the greatest of the visit/offer update
      timestamps falls within the load window and the visit's business
      context is SALE; for demand-allowance rows with no visit activity, the
      fact_agent_daily reference date.
    lineage:
      - dw_visit.dim_visit.dt_created
      - dw_visit.dim_visit.dt_updated
      - datalake_sale_offer.sale_offer.ts_updated
      - dw_agent.fact_agent_daily.dt_ref
  total_visit:
    description: >
      Count of visits booked by the agent whose creation date is the
      reference date.
    lineage:
      - dw_visit.fact_visits.num_visit_booked
  total_reschedule:
    description: >
      Number of reschedules accumulated by visits created on the reference
      date.
    lineage:
      - dw_visit.fact_visits.nbr_reschedule
  total_visit_canceled:
    description: >
      Count of visits canceled among visits created on the reference date.
    lineage:
      - dw_visit.fact_visits.num_visit_canceled
  total_visit_completed:
    description: >
      Count of visits completed among visits created on the reference date.
    lineage:
      - dw_visit.fact_visits.num_visit_completed
  total_visit_unsuccessful:
    description: >
      Count of visits marked unsuccessful among visits created on the
      reference date.
    lineage:
      - dw_visit.fact_visits.num_visit_unsuccessful
  total_visit_stalled:
    description: >
      Count of visits marked as stalled among visits created on the reference
      date.
    lineage:
      - dw_visit.dim_visit.is_visit_stalled
  total_visit_not_finished:
    description: >
      Count of visits created on the reference date that have not yet reached
      a finisher status (completed, canceled, unsuccessful or stalled).
    lineage:
      - dw_visit.dim_visit.has_visit_finisher_status
  total_offer_submitted:
    description: >
      Count of visits created on the reference date where the visitor
      submitted a sale offer, matched via the visit or the fifty/reschedule
      visit external id.
    lineage:
      - datalake_sale_offer.sale_offer.ts_offer_submitted
      - datalake_sale_offer.sale_offer.id_visit_external
      - datalake_sale_offer.sale_offer.id_visit_fifty_external
  total_offer_accepted:
    description: >
      Count of visits created on the reference date where the submitted sale
      offer was accepted.
    lineage:
      - datalake_sale_offer.sale_offer.ts_offer_accepted
      - datalake_sale_offer.sale_offer.id_visit_external
      - datalake_sale_offer.sale_offer.id_visit_fifty_external
  total_agreement_signed:
    description: >
      Count of visits created on the reference date where a sale agreement
      was signed and not later canceled.
    lineage:
      - datalake_sale_offer.sale_offer.ts_sale_agreement_signed
      - datalake_sale_offer.sale_offer.ts_sale_agreement_canceled
  total_visit_pfa:
    description: >
      Same as total_visit, restricted to visits where the agent is the
      house's fixed/preferred agent (PFA).
    lineage:
      - dw_visit.fact_visits.num_visit_booked
      - dw_visit.fact_visits.sk_last_associated_agent
      - dw_visit.fact_visits.sk_user_fixed_agent
  total_reschedule_pfa:
    description: >
      Same as total_reschedule, restricted to PFA visits.
    lineage:
      - dw_visit.fact_visits.nbr_reschedule
      - dw_visit.fact_visits.sk_last_associated_agent
      - dw_visit.fact_visits.sk_user_fixed_agent
  total_visit_canceled_pfa:
    description: >
      Same as total_visit_canceled, restricted to PFA visits.
    lineage:
      - dw_visit.fact_visits.num_visit_canceled
      - dw_visit.dim_visit.is_visit_canceled
      - dw_visit.fact_visits.sk_last_associated_agent
      - dw_visit.fact_visits.sk_user_fixed_agent
  total_visit_completed_pfa:
    description: >
      Same as total_visit_completed, restricted to PFA visits.
    lineage:
      - dw_visit.fact_visits.num_visit_completed
      - dw_visit.dim_visit.is_visit_completed
      - dw_visit.fact_visits.sk_last_associated_agent
      - dw_visit.fact_visits.sk_user_fixed_agent
  total_visit_unsuccessful_pfa:
    description: >
      Same as total_visit_unsuccessful, restricted to PFA visits.
    lineage:
      - dw_visit.fact_visits.num_visit_unsuccessful
      - dw_visit.dim_visit.is_visit_unsuccessful
      - dw_visit.fact_visits.sk_last_associated_agent
      - dw_visit.fact_visits.sk_user_fixed_agent
  total_visit_stalled_pfa:
    description: >
      Same as total_visit_stalled, restricted to PFA visits.
    lineage:
      - dw_visit.fact_visits.num_visit_stalled
      - dw_visit.dim_visit.is_visit_stalled
      - dw_visit.fact_visits.sk_last_associated_agent
      - dw_visit.fact_visits.sk_user_fixed_agent
  total_visit_not_finished_pfa:
    description: >
      Same as total_visit_not_finished, restricted to PFA visits.
    lineage:
      - dw_visit.dim_visit.has_visit_finisher_status
      - dw_visit.fact_visits.sk_last_associated_agent
      - dw_visit.fact_visits.sk_user_fixed_agent
  total_offer_submitted_pfa:
    description: >
      Same as total_offer_submitted, restricted to PFA visits.
    lineage:
      - datalake_sale_offer.sale_offer.ts_offer_submitted
      - dw_visit.fact_visits.sk_last_associated_agent
      - dw_visit.fact_visits.sk_user_fixed_agent
  total_offer_accepted_pfa:
    description: >
      Same as total_offer_accepted, restricted to PFA visits.
    lineage:
      - datalake_sale_offer.sale_offer.ts_offer_accepted
      - dw_visit.fact_visits.sk_last_associated_agent
      - dw_visit.fact_visits.sk_user_fixed_agent
  total_agreement_signed_pfa:
    description: >
      Same as total_agreement_signed, restricted to PFA visits.
    lineage:
      - datalake_sale_offer.sale_offer.ts_sale_agreement_signed
      - datalake_sale_offer.sale_offer.ts_sale_agreement_canceled
      - dw_visit.fact_visits.sk_last_associated_agent
      - dw_visit.fact_visits.sk_user_fixed_agent
  total_visit_crcc:
    description: >
      Same as total_visit, restricted to visits where the agent currently
      holds the house key, per house_entrance_history (key_location = AGENT,
      key holder is the agent, event not KEY_HOLDER_DEALLOCATED).
    lineage:
      - dw_visit.fact_visits.num_visit_booked
      - dw_visit.fact_visits.sk_house_entrance
      - dw_visit.fact_visits.sk_last_associated_agent
      - dw_house.dim_house_entrance_history.key_location
      - dw_house.dim_house_entrance_history.sk_user_key_holder
      - dw_house.dim_house_entrance_history.event_type
  total_reschedule_crcc:
    description: >
      Same as total_reschedule, restricted to CRCC visits (see
      total_visit_crcc).
    lineage:
      - dw_visit.fact_visits.nbr_reschedule
      - dw_visit.fact_visits.sk_house_entrance
      - dw_visit.fact_visits.sk_last_associated_agent
      - dw_house.dim_house_entrance_history.key_location
      - dw_house.dim_house_entrance_history.sk_user_key_holder
      - dw_house.dim_house_entrance_history.event_type
  total_visit_canceled_crcc:
    description: >
      Same as total_visit_canceled, restricted to CRCC visits (see
      total_visit_crcc).
    lineage:
      - dw_visit.fact_visits.num_visit_canceled
      - dw_visit.dim_visit.is_visit_canceled
      - dw_visit.fact_visits.sk_house_entrance
      - dw_visit.fact_visits.sk_last_associated_agent
      - dw_house.dim_house_entrance_history.key_location
      - dw_house.dim_house_entrance_history.sk_user_key_holder
      - dw_house.dim_house_entrance_history.event_type
  total_visit_completed_crcc:
