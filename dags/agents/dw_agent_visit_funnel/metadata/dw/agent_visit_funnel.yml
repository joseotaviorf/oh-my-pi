      - dw_visit.fact_visits.sk_last_associated_agent
      - dw_house.dim_house_entrance_history.key_location
      - dw_house.dim_house_entrance_history.sk_user_key_holder
      - dw_house.dim_house_entrance_history.event_type
  total_visit_not_finished_crcc:
