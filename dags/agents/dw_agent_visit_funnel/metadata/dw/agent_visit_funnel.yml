      - dw_visit.dim_visit.ts_visit_stalled
      - dw_visit.fact_visit_schedules.is_schedule_vbba
  total_schedule_not_finished_vbba:
    description: >
      Same as total_schedule_not_finished, restricted to VBBA schedules.
    lineage:
      - dw_visit.dim_visit.has_visit_finisher_status
      - dw_visit.dim_visit_schedule.ts_next_schedule_created
      - dw_visit.fact_visit_schedules.is_schedule_vbba
  total_offer_submitted_vbba:
    description: >
      Same as total_offer_submitted, restricted to VBBA schedules.
    lineage:
