      - dw_visit.dim_visit.is_vbba
      - dw_visit.fact_visits.sk_user_agent_vbba
  year:
    description: >
      Year partition column, extracted from date_ref.
    lineage:
      - dw_visit.dim_visit.dt_created
      - dw_agent.fact_agent_daily.dt_ref
  month:
    description: >
      Month partition column, extracted from date_ref.
    lineage:
