      - datalake_sale_offer.sale_offer.ts_sale_agreement_canceled
      - dw_visit.dim_visit_schedule.ts_next_schedule_created
      - dw_visit.fact_visit_schedules.is_schedule_vbba
  year:
    description: >
      Year partition column, extracted from date_ref.
    lineage:
      - dw_visit.dim_visit_schedule.ts_schedule_created
      - dw_agent.fact_agent_daily.dt_ref
  month:
    description: >
      Month partition column, extracted from date_ref.
    lineage:
      - dw_visit.dim_visit_schedule.ts_schedule_created
      - dw_agent.fact_agent_daily.dt_ref
  day:
    description: >
      Day partition column, extracted from date_ref.
    lineage:
      - dw_visit.dim_visit_schedule.ts_schedule_created
      - dw_agent.fact_agent_daily.dt_ref
