---
database_name: datalake_listing_deduplication
table_name: atlas_house_deduplication
domain: Agents
owner: gustavo.rompe@quintoandar.com.br
description: >
  Enrich projection of property-dedup similar_property evaluations joined to duplicity_output
  verdicts, one row per duplicity outcome keyed by house id (id_property) for Atlas-based CIQ
  listing purchase and deduplication flows.
columns:
  id_duplicity:
    description: Duplicity output id (rules-engine outcome row for the similar-property evaluation).
    lineage:
      - datalake_property_dedup_clean.duplicity_output.id
  id_house:
    description: House id on Main for the property evaluated (similar_property.id_property).
    lineage:
      - datalake_property_dedup_clean.similar_property.id_property
  id_owner:
    description: Owner person id on the evaluated property when present.
    lineage:
      - datalake_property_dedup_clean.similar_property.id_owner
  action_type:
    description: Rules-engine action for this evaluation (BLOCK, ALERT, or ALLOW).
    lineage:
      - datalake_property_dedup_clean.duplicity_output.action_type
    categories:
      BLOCK: Candidate is a confirmed duplicate; publication must not proceed.
      ALERT: Likely duplicate; warning without hard block.
      ALLOW: Candidate is non-blocking for this check.
  duplicity_reason:
    description: Name of the deduplication rule that fired, or PROPERTY_NOT_DUPLICATED when none matched.
    lineage:
      - datalake_property_dedup_clean.duplicity_output.duplicity_reason
  is_same_property_owner:
    description: True when the evaluated listing owner matches the admin who triggered the duplicity check.
    lineage:
      - datalake_property_dedup_clean.similar_property.is_same_property_owner
  ts_action:
    description: Timestamp when the duplicity output row was created.
    lineage:
      - datalake_property_dedup_clean.duplicity_output.ts_created
  ts_created:
    description: Timestamp when the similar_property evaluation row was created.
    lineage:
      - datalake_property_dedup_clean.similar_property.ts_created
  ts_updated:
    description: Last update timestamp on the similar_property evaluation row.
    lineage:
      - datalake_property_dedup_clean.similar_property.ts_updated
