---
database_name: datalake_listing_deduplication
table_name: listing_deduplication
domain: Agents
owner: gustavo.rompe@quintoandar.com.br
description: |
  This table contains deduplication analysis of house listings based on normalized address parsing.
  It processes house data from EBDB, normalizes address complements using complex regex rules,
  and identifies duplicate listings by comparing parsed addresses. The table includes information
  about listing registration, contracts, supply sources, and duplicate relationships.
columns:
  id_address_parsed_short:
    description: MD5 hash of the parsed short address used for efficient address-based grouping and indexing.
      Generated from address_parsed_short to create a unique identifier for each normalized address pattern.
    lineage:
      - datalake_ebdb_clean.house.address
      - datalake_ebdb_clean.house.number
      - datalake_ebdb_clean.house.complement
  id_house:
    description: The unique identifier for each house in the EBDB system.
    lineage:
      - datalake_ebdb_clean.house.id
  id_similar_previous_house:
    lineage:
      - datalake_ebdb_clean.house.id
    description: House id of the immediately previous listing on the same parsed address (first_listing_order minus one).
  id_similar_first_house:
    lineage:
      - datalake_ebdb_clean.house.id
    description: House id of the first listing (order 1) on the same parsed address when this row is part of a duplicate group.
  id_user_listing_registrant_rent:
    description: User identifier who registered the house for rent listing.
    lineage:
      - datalake_ebdb_listing.listing_business_context.user_listing_registrant_rent
  id_user_listing_registrant_sale:
    description: User identifier who registered the house for sale listing.
    lineage:
      - datalake_ebdb_listing.listing_business_context.user_listing_registrant_sale
  address_full:
    description: |
      Pipeline address string used downstream: street, number (digits only in this DAG), raw complement,
      neighborhood, and zipcode. City is not concatenated into this column in house_parsed output.
    lineage:
      - datalake_ebdb_clean.house.address
      - datalake_ebdb_clean.house.number
      - datalake_ebdb_clean.house.complement
      - datalake_ebdb_clean.house.neighborhood
      - datalake_ebdb_clean.house.zipcode
  address_parsed_short:
    description: |
      Short deduplication key: street, digit-normalized number, and parsed complement (normalized text
      and regex-derived parts). Excludes neighborhood, city, and zipcode.
    lineage:
      - datalake_ebdb_clean.house.address
      - datalake_ebdb_clean.house.number
      - datalake_ebdb_clean.house.complement
  supply_source:
    description: Overall supply source prioritizing CIQ when available and aligned to the first listing.
    lineage:
      - datalake_supply_flows.conversion_lookup.supply_source
  supply_source_rent:
    description: Source classification for rent supply (1P, 3P, or CIQ).
    lineage:
      - datalake_supply_flows.conversion_lookup.supply_source
  supply_source_sale:
    description: Source classification for sale supply (1P, 3P, or CIQ).
    lineage:
      - datalake_supply_flows.conversion_lookup.supply_source
  first_listing_order:
    lineage:
      - datalake_ebdb_listing.listing_business_context.ts_first_listing
      - datalake_ebdb_clean.house.address
      - datalake_ebdb_clean.house.number
      - datalake_ebdb_clean.house.complement
    description: Ranking order of listing creation within duplicate address groups, ordered by ts_first_listing.
  is_duplicated:
    lineage:
      - datalake_ebdb_clean.house.address
      - datalake_ebdb_clean.house.number
      - datalake_ebdb_clean.house.complement
    description: Boolean flag indicating whether this house has duplicate listings based on parsed address matching.
  is_first_listing_in_duplicates:
    lineage:
      - datalake_ebdb_listing.listing_business_context.ts_first_listing
      - datalake_ebdb_clean.house.address
      - datalake_ebdb_clean.house.number
      - datalake_ebdb_clean.house.complement
    description: Boolean flag indicating if this is the first listing among duplicates (first_listing_order = 1 and is_duplicated = true).
  ts_first_listing_sale:
    description: Timestamp of the first sale listing creation for this house.
    lineage:
      - datalake_ebdb_listing.listing_business_context.ts_first_listing
  ts_first_listing_rent:
    description: Timestamp of the first rent listing creation for this house.
    lineage:
      - datalake_ebdb_listing.listing_business_context.ts_first_listing
  ts_first_listing:
    description: Earliest timestamp between first rent and sale listing creation.
    lineage:
      - datalake_ebdb_listing.listing_business_context.ts_first_listing
  ts_contract_signed_rent:
    description: Timestamp when the rent contract was signed or created.
    lineage:
      - datalake_ebdb_contract.contract.ts_signed
      - datalake_ebdb_contract.contract.ts_created
  ts_contract_signed_sale:
    description: Timestamp when the sale agreement was signed.
    lineage:
      - datalake_sale_offer.sale_offer.ts_sale_agreement_signed
  ts_load:
    description: Timestamp when this enrich row was materialized.
