---
database_name: datalake_ebdb_clean
table_name: agent_weekly_hours_aud
domain: Agents
owner: gustavo.rompe@quintoandar.com.br
description: |
  Hibernate Envers audit history for recurring weekly visit availability templates per agent in EBDB.
  One row per revision of a HorarioSemanalAgente record with weekday hourly slot flags.
columns:
  id:
    description: Primary key of the weekly hours template entity captured in this audit revision.
    lineage:
      - datalake_ebdb_raw.horariosemanalagente_aud.id
  rev:
    description: Envers revision number identifying the transaction that produced this audit row.
    lineage:
      - datalake_ebdb_raw.horariosemanalagente_aud.rev
  rev_type:
    description: Envers revision type for this audit row (0 create, 1 update, 2 delete).
    lineage:
      - datalake_ebdb_raw.horariosemanalagente_aud.revtype
  ts_updated:
    description: Last update timestamp stored on the weekly template in this audit revision.
    lineage:
      - datalake_ebdb_raw.horariosemanalagente_aud.atualizadoem
  id_agent:
    description: Agent id whose recurring weekly availability is defined in this revision.
    lineage:
      - datalake_ebdb_raw.horariosemanalagente_aud.agente_id
  day_of_week:
    description: Weekday index (EBDB convention) for which the hourly template applies in this revision.
    lineage:
      - datalake_ebdb_raw.horariosemanalagente_aud.diadasemana
  has_hours_between_08_and_09_available:
    description: Whether the weekly template enables the 08:00–09:00 visit slot on this weekday.
    lineage:
      - datalake_ebdb_raw.horariosemanalagente_aud.horarios_disponivel08as09
  has_hours_between_09_and_10_available:
