    lineage:
      - datalake_ebdb_raw.horariosemanalmascara.horarios_disponivel19as20
  ts_created:
    description: Timestamp when the weekly hour mask row was created in EBDB.
    lineage:
      - datalake_ebdb_raw.horariosemanalmascara.criadoem
