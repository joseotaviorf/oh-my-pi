dag:
  name: reverse_tiers
  schedule_start_date: 2024, 8, 23
  owner: Data Agents
  documentation:
    dag_purpose: "Sending of performance categorization data for agents: brokers and trade executors. The data is sent to a bucket, where it will be consumed by Nazaré."
workflow:
  type: load
  layer: reverse
  default_extraction_type: incremental
  default_partitions: ['year', 'bimester']
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, ds, 'load_end_date') }}"
  short_circuit_customization:
    function: CHECK_IS_IN_RANGE_OF_DAYS
    execution_date: "{{ macros.ds_add(ds, 1) }}"
    function_params:
      range_of_days: [1, 15]
cluster:
  type: databricks_12_2_med_general_photon_cluster