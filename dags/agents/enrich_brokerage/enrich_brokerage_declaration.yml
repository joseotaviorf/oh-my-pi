dag:
  name: enrich_brokerage
  schedule_start_date: 2024, 4, 9
  owner: Data Agents
  documentation:
    dag_purpose: |
      This DAG brings data from the brokerage flow to offers

workflow:
  type: query_delta
  layer: enrich
  tables_customization:
    agent_revenue_share:
      custom_schema: agent_payments
      partitions: [dt_updated]
      extraction_type: incremental
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, -1), 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_end | ds, 'load_end_date') }}"
