dag:
  name: big_agent
  schedule_start_date: 2020, 12, 21
  schedule_interval: 0 0 * * *
  owner: Data Agents
  documentation:
    dag_purpose: |
      This DAG imports data from [Big Agent](https://github.com/quintoandar/big-agent), which is an internal microservice responsible for handling the agent and house relationship.
      This DAG is triggered by Airflow and all the output tables are ingested via Incremental load and they are partitioned by year, month and day columns.
workflow:
  type: cdc
  layer: raw
  database_type: postgres
  dbutils_secret_key: BIG_AGENT_DB
  lineage_product_database_name: bigagent
  custom_schema: big_agent
  source_database: bigagent
  source_schema: public
  tables_customization:
    agency: {}
    agency_aud: {}
    agent: {}
    agent_aud: {}
    earnings: {}
    earnings_aud: {}
    enrollment: {}
    enrollment_aud: {}
    external_invoice: {}
    external_invoice_aud: {}
    house: {}
    house_aud: {}
    installment: {}
    installment_aud: {}
    points_rule: {}
    points_rule_aud: {}
    program: {}
    program_aud: {}
    share_rule: {}
    share_rule_aud: {}
    user_revision_entity: {}
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: m5a.xlarge
    node_type_id: m5a.xlarge
    num_workers: 2
    spark_version: 12.2.x-scala2.12
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
  databricks_conn_id: databricks_new
