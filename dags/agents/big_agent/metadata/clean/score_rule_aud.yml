      - datalake_big_agent_raw.score_rule_aud.created_at
    description: Creation timestamp of the raw audit record.
  ts_updated:
    lineage:
      - datalake_big_agent_raw.score_rule_aud.updated_at
    description: Update timestamp of the raw audit record.
  year:
    lineage:
      - datalake_big_agent_raw.score_rule_aud.year
    description: Partition year.
  month:
    lineage:
      - datalake_big_agent_raw.score_rule_aud.month
    description: Partition month.
  day:
    lineage:
      - datalake_big_agent_raw.score_rule_aud.day
    description: Partition day.


