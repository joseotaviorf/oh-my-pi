description: |
  Audit view for score rule changes with revision metadata and modification flags,
  plus creation/update timestamps and partitions.
domain: Agents
owner: data-ae-agents@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_big_agent_raw.score_rule_aud.id
    description: Score rule identifier (audited).
  rev:
    lineage:
      - datalake_big_agent_raw.score_rule_aud.rev
    description: Revision identifier of the audit record.
  rev_type:
    lineage:
      - datalake_big_agent_raw.score_rule_aud.revtype
    description: Revision type (INSERT/UPDATE/DELETE semantics in audit).
  rev_end:
    lineage:
      - datalake_big_agent_raw.score_rule_aud.revend
    description: End revision where this version ceased to be current.
  min_score:
    lineage:
      - datalake_big_agent_raw.score_rule_aud.min_score
