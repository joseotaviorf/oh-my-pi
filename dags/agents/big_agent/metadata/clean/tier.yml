  including creation/update timestamps and partitions.
domain: Agents
owner: data-ae-agents@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_big_agent_raw.tier.id
    description: Tier unique identifier.
  id_incentive_engine:
    lineage:
      - datalake_big_agent_raw.tier.incentive_engine_id
