  id_classifier_score_rule:
    lineage:
      - datalake_big_agent_raw.tier.classifier_score_rule_id
    description: Identifier of the classifier score rule.
  id_qualifier_score_rule:
    lineage:
      - datalake_big_agent_raw.tier.qualifier_score_rule_id
    description: Identifier of the qualifier score rule.
  name:
    lineage:
      - datalake_big_agent_raw.tier.name
    description: Tier name.
  priority:
    lineage:
      - datalake_big_agent_raw.tier.priority
    description: Ordering priority for the tier selection.
  ts_created:
    lineage:
      - datalake_big_agent_raw.tier.created_at
    description: Creation timestamp of the raw record.
  ts_updated:
    lineage:
      - datalake_big_agent_raw.tier.updated_at
    description: Update timestamp of the raw record.
  year:
    lineage:
      - datalake_big_agent_raw.tier.year
    description: Partition year.
  month:
    lineage:
      - datalake_big_agent_raw.tier.month
