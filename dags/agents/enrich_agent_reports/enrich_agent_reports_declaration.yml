dag:
  name: enrich_agent_reports
  schedule_start_date: 2026, 2, 24
  owner: Data Agents
  documentation:
    dag_purpose: |
      Enrich tables for agent reports: OKRs, KPIs and related end-user datasets.
      Builds tables from clean sources via PySpark ETL (read, transform, validate, write to enrich layer).
workflow:
  type: query_delta
  layer: enrich
  custom_schema: agent_reports
  inner_dependencies:
    agent_support_tickets_by_month:
      - agent_status_by_month
    agent_independent_campinas_metrics:
      - agent_status_by_month
    agent_new_agent_activation_metrics:
      - agent_status_by_month
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  spark_job_arguments:
    - "{environment}"
    - "{bucket}"
    - "{schema}"
    - "{dag_name}"
    - "{table_name}"
    - "{load_start_date}"
    - "{load_end_date}"
    - "prod"
  tables_customization:
    agent_status_by_month:
      load_spark_job: load_agent_status_by_month
    agent_support_tickets_by_month:
      load_spark_job: load_agent_support_tickets_by_month
      extra_spark_job_arguments:
        - "18"
    agent_independent_campinas_metrics:
      load_spark_job: load_agent_independent_campinas_metrics
      extra_spark_job_arguments:
        - "18"
    agent_new_agent_activation_metrics:
      load_spark_job: load_agent_new_agent_activation_metrics
      extra_spark_job_arguments:
        - "2"

cluster:
  type: databricks_16_4_med_general_cluster
  databricks_conn_id: databricks_new_env
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
