dag:
  name: enrich_agent_reports
  schedule_start_date: 2026, 2, 24
  owner: Data Agents
  documentation:
    dag_purpose: |
      Enrich tables for agent reports: OKRs, KPIs and related end-user datasets.
      Builds tables from clean sources via PySpark ETL (read, transform, validate, write to enrich layer).
workflow:
  type: query_delta
  layer: enrich
  custom_schema: agent_reports
  inner_dependencies:
    agent_independent_campinas_metrics:
      - agent_status_by_month
    agent_new_agent_activation_metrics:
      - agent_status_by_month
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  spark_job_arguments:
    - "{environment}"
    - "{bucket}"
    - "{schema}"
    - "{dag_name}"
    - "{table_name}"
    - "{load_start_date}"
    - "{load_end_date}"
    - "prod"
  tables_customization:
    agent_status_by_month:
      load_spark_job: load_agent_status_by_month
    agent_independent_campinas_metrics:
      load_spark_job: load_agent_independent_campinas_metrics
      extra_spark_job_arguments:
        - "18"
    agent_new_agent_activation_metrics:
      load_spark_job: load_agent_new_agent_activation_metrics
      extra_spark_job_arguments:
        - "2"
    agent_new_agent_activation_daily:
      load_spark_job: load_agent_new_agent_activation_daily
      # Custom Spark job: the load task creator resolves {load_start_date}/{load_end_date}
      # from workflow-level context (single interval day). Override spark_job_arguments here
      # to inject the 14-day reprocess window (ds-13 .. ds) for this table only.
      spark_job_arguments:
        - "{environment}"
        - "{bucket}"
        - "{schema}"
        - "{dag_name}"
        - "{table_name}"
        - "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, -13), 'load_start_date') }}"
        - "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
        - "prod"
      extra_spark_job_arguments:
        - "4"
        - "2025-01-01"
        - "90"
