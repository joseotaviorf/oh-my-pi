# Data quality rules for agent_new_agent_activation_daily.
# Used by DataQualityTestsPipeline (PyDeequ/inmetro). Aligns with validate_before_write in
# load_agent_new_agent_activation_daily. Error = fail pipeline.
---
table_name: datalake_agent_reports.agent_new_agent_activation_daily
alert_channel: "#agents-data-alarms"

table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error

column_level_validations:
  id_agent:
    is_complete:
      severity_level: Error
  dt_reference:
    is_complete:
      severity_level: Error
    custom:
      constraint: |-
        (SELECT COUNT(*) FROM (
          SELECT id_agent, dt_reference
          FROM datalake_agent_reports.agent_new_agent_activation_daily
          GROUP BY id_agent, dt_reference
          HAVING COUNT(*) > 1
        )) = 0
      severity_level: Error
  is_activated:
    is_complete:
      severity_level: Error
  is_eligible:
    is_complete:
      severity_level: Error
  agent_capacity_segment:
    is_complete:
      severity_level: Error
    is_contained_in:
      values:
        - CAPACITY
        - NON_CAPACITY
      severity_level: Error
  activation_reason:
    is_contained_in:
      values:
        - CIQ
        - TQC
        - VCBA
      severity_level: Error
