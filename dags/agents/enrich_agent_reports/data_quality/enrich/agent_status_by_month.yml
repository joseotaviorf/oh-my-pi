# Data quality rules for agent_status_by_month.
# Used by the DataQualityTestsPipeline (PyDeequ/inmetro). Same semantics as
# pre-persist validation in agent_status_by_month (validate_before_write).
# Severity: Error = fail pipeline; Warning = log and continue.
---
table_name: datalake_agent_reports.agent_status_by_month
alert_channel: "#agents-data-alarms"

table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error

column_level_validations:
  id_user:
    is_complete:
      severity_level: Error
  reference_month:
    is_complete:
      severity_level: Error
    custom:
      constraint: |-
        (SELECT COUNT(*) FROM (
          SELECT id_user, reference_month
          FROM datalake_agent_reports.agent_status_by_month
          GROUP BY id_user, reference_month
          HAVING COUNT(*) > 1
        )) = 0
      severity_level: Error
