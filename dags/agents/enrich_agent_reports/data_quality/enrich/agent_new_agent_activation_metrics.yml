# Data quality rules for agent_new_agent_activation_metrics.
# Used by DataQualityTestsPipeline (PyDeequ/inmetro). Aligns with validate_before_write in
# load_agent_new_agent_activation_metrics. Error = fail pipeline.
---
table_name: datalake_agent_reports.agent_new_agent_activation_metrics
alert_channel: "#alerts-de-airflow-dags"

table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error

column_level_validations:
  id_user:
    is_complete:
      severity_level: Error
  reference_month:
    is_complete:
      severity_level: Error
    custom:
      constraint: |-
        (SELECT COUNT(*) FROM (
          SELECT id_user, reference_month
          FROM datalake_agent_reports.agent_new_agent_activation_metrics
          GROUP BY id_user, reference_month
          HAVING COUNT(*) > 1
        )) = 0
      severity_level: Error
  is_activated:
    is_complete:
      severity_level: Error
