---
database_name: datalake_agent_reports
table_name: agent_status_by_month
description: |
  One row per (id_user, reference_month) with agent status from two sources: CIQ (internal status)
  and Demand (CORRETOR_5A agents from audit). Used for OKRs, KPIs and reporting. Partitioned by
  reference_month; merged on (id_user, reference_month).
domain: Agents
owner: gustavo.rompe@quintoandar.com.br
columns:
  id_user:
    lineage:
      - datalake_ebdb_agents.ciq_users.id_user
      - datalake_ebdb_user.user.id
    description: Unique identifier of the agent user (Demand). May be null for CIQ-only rows.
  id_agent:
    lineage:
      - datalake_ebdb_clean.agent_data_aud.id
      - datalake_ebdb_clean.agent_data.id
    description: Unique identifier of the agent (Demand). Null for CIQ-only rows.
  reference_month:
    description: First day of the month this row refers to (timestamp). Partition key.
  ciq_status:
    lineage:
      - datalake_ebdb_agents.ciq_users.status
    description: Agent status from CIQ for this month. Null when no CIQ record.
  ciq_days_in_status:
    lineage:
      - datalake_ebdb_agents.ciq_users
    description: Number of days in the month the agent had this CIQ status (dominant status by days).
  ciq_status_start:
    lineage:
      - datalake_ebdb_agents.ciq_users.ts_agent_status_start
    description: Start of the CIQ status period that overlaps this month.
  ciq_status_end:
    lineage:
      - datalake_ebdb_agents.ciq_users.ts_agent_status_end
    description: End of the CIQ status period that overlaps this month.
  agent_status:
    lineage:
      - datalake_ebdb_clean.agent_data_aud.is_active
    description: Demand agent status for this month (ACTIVE or INACTIVE). Null when no Demand record.
    categories:
      ACTIVE: Agent was active (is_active = true) for the dominant period in the month.
      INACTIVE: Agent was inactive for the dominant period in the month.
  is_passive_lead_receiver:
    lineage:
      - datalake_ebdb_clean.agent_data_aud.is_passive_lead_receiver
    description: Whether the agent was a passive lead receiver for the dominant status period. Null when no Demand record.
  agent_days_in_status:
    lineage:
      - datalake_ebdb_clean.agent_data_aud
    description: Number of days in the month the agent had this Demand status (dominant period).
  agent_status_start:
    lineage:
      - datalake_ebdb_clean.agent_data_aud.ts_database_transaction
    description: Start of the Demand status period that overlaps this month.
  agent_status_end:
    lineage:
      - datalake_ebdb_clean.agent_data_aud.ts_database_transaction
    description: End of the Demand status period that overlaps this month.
