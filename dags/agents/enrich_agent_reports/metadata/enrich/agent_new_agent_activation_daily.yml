---
database_name: datalake_agent_reports
table_name: agent_new_agent_activation_daily
description: |
  Daily activation fact for newly accredited agents. One row per (id_agent, dt_reference)
  from agent creation through the earlier of the load window end or
  ``max_tracking_days_after_creation`` (default 90) after creation; agents drop out of
  the pipeline once that cap is passed. ``is_eligible`` tags whether the day is still
  inside the activation window. Cohort: agents created on/after the ``cohort_start_date``
  job parameter (2025-01-01), excluding Vistoria / VistoriaQuarteirizada / SessaoFotos
  personas, while their tracking window overlaps the load interval.
  Activation: at least one CIQ valid first listing, TQC self-referral, or VCBA (completed visit
  booked by the agent, id_user_creation = id_user_agent) within ``activation_window_weeks``
  (4) after creation. ``is_activated`` is as-of-day; ``activation_reason`` / ``dt_activated``
  come from the earliest qualifying event (tie-break CIQ > TQC > VCBA). Capacity split via
  ``is_passive_lead_receiver`` reconstructed daily from the agent_data audit history.
  Partitioned by year/month/day; merged on (id_agent, dt_reference).
domain: Agents
owner: gustavo.rompe@quintoandar.com.br
columns:
  id_agent:
    lineage:
      - datalake_ebdb_clean.agent_data.id
    description: Unique identifier of the Demand agent (agent_data). Non-null.
  id_user:
    lineage:
      - datalake_ebdb_user.user.id
    description: Platform user id linked to the agent (min user id per agent, ignoring -1). Null when no user record.
  agent_capacity_segment:
    description: >
      CAPACITY when is_passive_lead_receiver is true on the reference day, NON_CAPACITY otherwise
      (false or unknown). Non-null.
    lineage:
      - datalake_ebdb_clean.agent_data_aud.is_passive_lead_receiver
  activation_reason:
    description: >
      Source of the first qualifying activation event within the window: CIQ (valid first
      listing), TQC (self-referral) or VCBA (completed visit booked by the agent). Null when
      the agent never activated within the window. Static per agent.
    lineage:
      - datalake_tiers.ciq_first_listing.ts_original_first_listing
      - datalake_sale_offer_flows.offer_specialists.ts_agent_lead_referral_updated
      - datalake_visit.visit_schedules.ts_schedule_visit
  activation_window_weeks:
    description: Value of the X-weeks activation window parameter used to build the row (default 4). Non-null.
  total_tqc_count:
    lineage:
      - datalake_sale_offer_flows.offer_specialists
    description: TQC self-referral leads by this agent's user on dt_reference. Non-null, >= 0.
  total_vcba_count:
    lineage:
      - datalake_visit.visit_schedules.id_schedule
    description: >
      Distinct completed visit schedules booked by the agent (id_user_creation = id_user_agent)
      on dt_reference. Non-null, >= 0.
  total_listings_count:
    lineage:
      - datalake_tiers.ciq_first_listing
    description: Valid first listings by this agent's user on dt_reference. Non-null, >= 0.
  is_passive_lead_receiver:
    lineage:
      - datalake_ebdb_clean.agent_data_aud.is_passive_lead_receiver
      - datalake_ebdb_clean.agent_data.is_passive_lead_receiver
    description: >
      Whether the agent was a passive lead receiver on dt_reference, reconstructed from the
      agent_data audit history (fallback to the current agent_data value when no audit period
      covers the day). Nullable.
  is_eligible:
    description: >
      True while dt_reference is on or before dt_activation_deadline (agent still inside the
      activation window); false afterwards. Non-null.
  is_activated:
    description: >
      As-of-day activation flag: false before dt_activated, true from dt_activated onwards.
      Agents that never activated within the window stay false. Non-null.
  dt_reference:
    lineage:
      - datalake_ebdb_clean.agent_data.ts_created
    description: Reference calendar date of the daily snapshot row.
  dt_activation_deadline:
    lineage:
      - datalake_ebdb_clean.agent_data.ts_created
    description: Last day of the activation window (creation date + activation_window_weeks * 7 days). Non-null.
  dt_activated:
    description: >
      Date of the first qualifying activation event within the window (CIQ, TQC or VCBA).
      Null when the agent never activated within the window. Static per agent.
    lineage:
      - datalake_tiers.ciq_first_listing.ts_original_first_listing
      - datalake_sale_offer_flows.offer_specialists.ts_agent_lead_referral_updated
      - datalake_visit.visit_schedules.ts_schedule_visit
  ts_agent_created:
    lineage:
      - datalake_ebdb_clean.agent_data.ts_created
    description: When the Demand agent record was created (cohort anchor). Non-null.
  year:
    description: Partition year derived from dt_reference.
  month:
    description: Partition month derived from dt_reference.
  day:
    description: Partition day derived from dt_reference.
