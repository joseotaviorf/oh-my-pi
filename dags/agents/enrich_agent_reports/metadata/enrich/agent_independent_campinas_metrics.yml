---
database_name: datalake_agent_reports
table_name: agent_independent_campinas_metrics
description: |
  One row per (id_user, reference_month) for Campinas agents: status, TQX referral,
  first valid listing, and derived flags (is_ciq_active_in_month, is_tqx_active_in_month,
  is_ciq_only, is_independent_agent, days_since_agent_created). Incremental merge by
  month window; partitioned by reference_month, merge on (id_user, reference_month).
domain: Agents
owner: data-ae-agents@quintoandar.com.br
columns:
  id_user:
    lineage:
      - datalake_agent_reports.agent_status_by_month.id_user
    description: Unique identifier of the agent user (Demand). Non-null (inner join to Campinas agents).
  id_agent:
    lineage:
      - datalake_agent_reports.agent_status_by_month.id_agent
    description: Unique identifier of the agent (Demand). May be null for CIQ-only.
  reference_month:
    lineage:
      - datalake_agent_reports.agent_status_by_month.reference_month
    description: First day of the month this row refers to (timestamp). Partition key.
  ciq_status:
    lineage:
      - datalake_agent_reports.agent_status_by_month.ciq_status
    description: Agent status from CIQ for this month.
  agent_status:
    lineage:
      - datalake_agent_reports.agent_status_by_month.agent_status
    description: Demand agent status for this month (ACTIVE or INACTIVE).
  is_passive_lead_receiver:
    lineage:
      - datalake_agent_reports.agent_status_by_month.is_passive_lead_receiver
    description: Whether the agent was a passive lead receiver. Null when no Demand record.
  ts_agent_created:
    lineage:
      - datalake_ebdb_clean.agent_data.ts_created
    description: When the agent (Demand) was created. Null when no agent_data.
  ts_ciq_created:
    lineage:
      - datalake_ebdb_clean.partner_agent.ts_created
    description: When the CIQ/partner link was created. Null when no partner_agent.
  ts_first_activation_TQX_referral:
    lineage:
      - datalake_sale_offer_flows.offer_specialists.ts_agent_lead_referral_updated
    description: First TQX (self-referral) lead date for this user (min over all time). Null when no TQX.
  total_tqx_count:
    lineage:
      - datalake_sale_offer_flows.offer_specialists
    description: Count of TQX referrals in the reference month. Non-null, >= 0.
  ts_valid_activation_first_listing:
    lineage:
      - datalake_tiers.ciq_first_listing.ts_original_first_listing
    description: First valid listing activation for this user (min over all time). Null when none.
  total_listings_count:
    lineage:
      - datalake_tiers.ciq_first_listing
    description: Count of valid first listings in the reference month. Non-null, >= 0.
  is_ciq_active_in_month:
    description: True when total_listings_count > 0. Non-null.
  is_tqx_active_in_month:
    description: True when total_tqx_count > 0. Non-null.
  is_ciq_only:
    description: True when ciq_status ACTIVE and agent_status INACTIVE. Non-null.
  is_independent_agent:
    description: True when CIQ active, Demand active, and not passive lead receiver. Non-null.
  days_since_agent_created:
    description: Days from the earlier of ts_agent_created/ts_ciq_created to reference_month. Non-null.
