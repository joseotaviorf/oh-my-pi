---
database_name: datalake_agent_reports
table_name: agent_new_agent_activation_metrics
description: |
  One row per (id_user, reference_month) for new agents: Demand ts_created OR dt_independent_agent_registered
  falls within NEW_AGENT_MAX_DAYS (60) before calendar month-end of ``reference_month`` (``last_day(reference_month)``).
  Enables multi-month backfills: cohort is evaluated per metric month, not only the last month of the run window.
  Covers all agent types nationwide (CIQ-only, FR/FS, and Independent). Tracks activation
  via valid first listing (FL), TQC self-referral visit, or PPA visit (completed booking where
  the agent was the preferred property agent for the visited house at visit time).
  Partitioned by reference_month; merged on (id_user, reference_month).
domain: Agents
owner: data-ae-agents@quintoandar.com.br
columns:
  id_user:
    lineage:
      - datalake_agent_reports.agent_status_by_month.id_user
    description: Unique identifier of the agent user. Non-null (inner join to new agents).
  id_agent:
    lineage:
      - datalake_agent_reports.agent_status_by_month.id_agent
    description: Unique identifier of the agent (Demand). May be null for CIQ-only rows.
  reference_month:
    lineage:
      - datalake_agent_reports.agent_status_by_month.reference_month
    description: First day of the month this row refers to. Partition key.
  ciq_status:
    lineage:
      - datalake_agent_reports.agent_status_by_month.ciq_status
    description: Agent status from CIQ for this month. Null when no CIQ record.
  agent_status:
    lineage:
      - datalake_agent_reports.agent_status_by_month.agent_status
    description: Demand agent status for this month (ACTIVE or INACTIVE). Null when no Demand record.
  is_passive_lead_receiver:
    lineage:
      - datalake_agent_reports.agent_status_by_month.is_passive_lead_receiver
    description: Whether the agent was a passive lead receiver (FR/FS) in the dominant status period. Null when no Demand record.
  dt_independent_agent_registered:
    lineage:
      - datalake_agent_reports.agent_status_by_month.agent_status_start
    description: >
      Date of the last change from is_passive_lead_receiver true to false (i.e., became independent agent).
      Falls back to earlier of ts_agent_created and ts_ciq_created when no such transition exists in the window.
  ts_agent_created:
    lineage:
      - datalake_ebdb_clean.agent_data.ts_created
    description: When the Demand agent record was created. Null when no agent_data.
  ts_ciq_created:
    lineage:
      - datalake_ebdb_clean.partner_agent.ts_created
    description: When the CIQ/partner link was created. Null when no partner_agent.
  ts_first_activation_tqc_referral:
    lineage:
      - datalake_sale_offer_flows.offer_specialists.ts_agent_lead_referral_updated
    description: First TQC self-referral lead date for this user (min over all time). Null when no TQC.
  total_tqc_count:
    lineage:
      - datalake_sale_offer_flows.offer_specialists
    description: Count of TQC self-referral leads in the reference month. Non-null, >= 0.
  ts_valid_activation_first_listing:
    lineage:
      - datalake_tiers.ciq_first_listing.ts_original_first_listing
    description: First valid listing activation for this user (min over all time). Null when none.
  total_listings_count:
    lineage:
      - datalake_tiers.ciq_first_listing
    description: Count of valid first listings in the reference month. Non-null, >= 0.
  total_ppa_count:
    lineage:
      - datalake_visit.visit_schedules.id_schedule
      - datalake_ebdb_agents.preferred_property_agent_relation_history.id_related_agent
    description: >
      Count of distinct completed visit schedules in the month where the agent was the preferred property
      agent (PPA) for the visited house at visit time. Non-null, >= 0.
  ts_first_ppa_activation:
    lineage:
      - datalake_visit.visit_schedules.ts_schedule_visit
      - datalake_ebdb_agents.preferred_property_agent_relation_history.id_related_agent
    description: Timestamp of the first PPA visit ever for this agent (min over all time). Null when none.
  is_ciq_active_in_month:
    description: True when total_listings_count > 0 in the month (FL activation). Non-null.
  is_tqc_active_in_month:
    description: True when total_tqc_count > 0 in the month (TQC self-referral activation). Non-null.
  is_ppa_active_in_month:
    description: >
      True when total_ppa_count > 0 in the month. A PPA visit is a completed visit schedule where
      the agent was the preferred property agent for the visited house at visit time. Non-null.
  is_activated:
    description: True when agent had at least one FL, TQC self-referral VC, or PPA VC in the month. Non-null.
  is_ciq_only:
    description: True when ciq_status is ACTIVE and agent_status is INACTIVE. Non-null.
  is_independent_agent:
    description: True when CIQ active, Demand active, and not passive lead receiver. Non-null.
  agent_type_segment:
    description: >
      Segment label derived from agent status and passivity flag:
      INDEPENDENT (active demand, not passive), FR_FS (active demand, passive),
      CIQ_ONLY (CIQ active, demand not active), OTHER. Nullable.
  agent_business_context:
    description: >
      Business vertical derived from ``agent_data_business_contexts_served`` (clean layer):
      FOR_SALE (SALE or SALE_PRIMARY_MARKET context), FOR_RENT (RENT context),
      FOR_SALE_AND_FOR_RENT when both, UNKNOWN when no matching row or no known context.
    lineage:
      - datalake_ebdb_clean.agent_data_business_contexts_served.business_context
  name_city:
    description: Primary city (level=Cidade) of the agent's registered region, resolved by walking the region parent chain. Takes alphabetically first city when agent has multiple regions. Nullable.
    lineage:
      - datalake_ebdb_clean.agent_region_data
      - datalake_ebdb_clean.region
  days_since_demand_agent_created:
    description: Days from ts_agent_created (Demand/EBDB account creation) to the last day of reference_month. Nullable when no Demand record.
    lineage:
      - datalake_ebdb_clean.agent_data.ts_created
  days_since_ciq_created:
    description: Days from ts_ciq_created (CIQ/partner account creation) to the last day of reference_month. Nullable when no CIQ record.
    lineage:
      - datalake_ebdb_clean.partner_agent.ts_created
  days_since_independent_agent_registered:
    description: Days from dt_independent_agent_registered to the last day of reference_month. Nullable when no independence transition exists.
