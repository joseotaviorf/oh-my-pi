---
database_name: datalake_agent_reports
table_name: agent_support_tickets_by_month
description: |
  One row per (id_user, reference_month) with agent status, listings, visits, support tickets
  and eligibility/activity flags. Extends agent_status_by_month with CIQ/demand metrics and
  ticket aggregates for OKRs and KPIs. Partitioned by reference_month; merged on
  (id_user, id_agent, reference_month).
domain: Agents
owner: data-ae-agents@quintoandar.com.br
columns:
  id_user:
    lineage:
      - datalake_agent_reports.agent_status_by_month.id_user
      - dw_public.dim_user.sk_user
    description: Unique identifier of the agent user (Demand). May be null.
  id_agent:
    lineage:
      - datalake_agent_reports.agent_status_by_month.id_agent
      - dw_public.dim_agent.sk_agent
    description: Unique identifier of the agent (Demand). May be null.
  reference_month:
    lineage:
      - datalake_agent_reports.agent_status_by_month.reference_month
    description: First day of the month this row refers to (timestamp). Partition key.
  total_listings_count:
    lineage:
      - datalake_tiers.ciq_first_listing
    description: Count of CIQ listings for this agent in the month (lookback window). Non-null, >= 0.
  total_visits_count:
    lineage:
      - datalake_visit.visit_schedules
    description: Count of completed visits for this agent in the month (2-month window). Non-null, >= 0.
  is_sale_agent:
    lineage:
      - datalake_ebdb_agents.ciq_agents.is_sale_agent
      - dw_public.dim_agent.is_sale_agent
    description: Whether the agent operates in For Sale context. From business context (latest by ts_updated).
  is_rent_agent:
    lineage:
      - datalake_ebdb_agents.ciq_agents.is_rent_agent
      - dw_public.dim_agent.is_rent_agent
    description: Whether the agent operates in For Rent context. From business context (latest by ts_updated).
  total_tickets:
    lineage:
      - dw_customer_support.fact_tickets
    description: Total inbound support tickets for this user in the reference month. Null when none.
  sum_reopens:
    lineage:
      - dw_customer_support.fact_tickets.reopens
    description: Sum of reopens for those tickets. Null when no tickets.
  ticket_breakdown_aggregated:
    lineage:
      - dw_customer_support.fact_tickets
      - dw_customer_support.dim_taxonomy
    description: Array of structs (channel, step_tag, theme_detail, total_tickets, sum_reopens) per taxonomy.
  is_demand_agent_eligible:
    description: True when agent_status is ACTIVE (demand eligibility). Non-null.
  is_ciq_eligible:
    description: True when ciq_status is ACTIVE. Non-null.
  is_independent_agent:
    description: True when not passive lead receiver, CIQ active, and demand active. Non-null.
  is_agent_active:
    description: >
      True when agent_status is ACTIVE and is_passive_lead_receiver is True (passive lead receiver / FR-FS agent). Non-null.
  is_ciq_active:
    description: True when CIQ active and total_listings_count > threshold. Non-null.
  is_ciq_qualified_active:
    description: True when agent had a valid first listing in the 3-month window for this month. Non-null.
  is_ineligible:
    description: True when both agent_status and ciq_status are INACTIVE. Non-null.
