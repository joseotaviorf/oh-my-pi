cluster:
  type: consolidation_xs_memory_cluster
  databricks_conn_id: databricks_new_env
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.delta.constraints.allowUnenforcedNotNull.enabled: true
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
    num_workers: 3
    driver_node_type_id: m7g.xlarge
validation:
  cluster:
    type: emr_7_12_consolidation_xs_memory_cluster
    custom_configurations:
      core_nodes:
        instance_count: 1
      task_nodes:
        instance_count: 2
      master_node_type_id: m7g.xlarge
      spark_conf:
        spark.driver.memory: 3g
        spark.driver.memoryOverhead: 1g
        spark.yarn.am.memory: 512m
  allow_custom_spark_job: true
