database_name: datalake_hubspot
table_name: thread_conversation
description: |
  Enriched view of HubSpot conversation threads and messages with sender details,
  attachments, status information, contact and owner context. Each row represents
  a message within a thread, ready for analytics and LLM analyses.
domain: Agents
owner: data-ae-agents@quintoandar.com.br
columns:
  id_thread:
    lineage:
      - datalake_hubspot_clean.threads.id_thread
    description: Unique thread identifier.
  id_inbox:
    lineage:
      - datalake_hubspot_clean.threads.id_inbox
    description: Inbox identifier associated with the thread.
  id_thread_message:
    lineage:
      - datalake_hubspot_clean.thread_messages.id_thread_message
    description: Unique message identifier within a thread.
  id_associated_contact:
    lineage:
      - datalake_hubspot_clean.threads.id_associated_contact
    description: Contact ID associated to the thread.
  id_hubspot_owner:
    lineage:
      - datalake_hubspot_clean.contact.properties
    description: HubSpot owner ID associated to the contact.
  contact_name:
    lineage:
      - datalake_hubspot_clean.contact.properties
    description: Contact full name from HubSpot contact properties.
  contact_email:
    lineage:
      - datalake_hubspot_clean.contact.properties
    description: Contact email from HubSpot contact properties.
  owner_name:
    lineage:
      - datalake_hubspot_clean.owner.first_name
      - datalake_hubspot_clean.owner.last_name
    description: HubSpot owner full name.
  direction:
    lineage:
      - datalake_hubspot_clean.thread_messages.direction
    description: Message direction (INCOMING or OUTGOING).
  sender_type:
    lineage:
      - datalake_hubspot_clean.thread_messages.direction
    description: Derived sender type (Contact, Agent/Bot, or System).
  sender_name:
    lineage:
      - datalake_hubspot_clean.thread_messages.senders
    description: Message sender name extracted from senders JSON.
  sender_number:
    lineage:
      - datalake_hubspot_clean.thread_messages.senders
    description: Message sender number extracted from senders JSON.
  message_text:
    lineage:
      - datalake_hubspot_clean.thread_messages.text
    description: Message text with trimming and empty-to-null normalization.
  status:
    lineage:
      - datalake_hubspot_clean.thread_messages.status
    description: Message delivery status (defaults to SUCCESS when null).
  status_failure_details:
    lineage:
      - datalake_hubspot_clean.thread_messages.status
    description: Error message details extracted from status JSON, when present.
  attachments_list:
    lineage:
      - datalake_hubspot_clean.thread_messages.attachments
    description: Collected list of attachment URLs present in the message.
  ts_thread_created:
    lineage:
      - datalake_hubspot_clean.threads.ts_created
    description: Thread creation timestamp.
  ts_thread_updated:
    lineage:
      - datalake_hubspot_clean.threads.ts_latest_message_timestamp
    description: Thread last update timestamp.
  ts_message_created:
    lineage:
      - datalake_hubspot_clean.thread_messages.ts_created
    description: Message creation timestamp.
  ts_message_updated:
    lineage:
      - datalake_hubspot_clean.thread_messages.ts_updated
    description: Message last update timestamp.
  year:
    lineage:
      - datalake_hubspot_clean.thread_messages.ts_created
    description: Partition year from message creation date.
  month:
    lineage:
      - datalake_hubspot_clean.thread_messages.ts_created
    description: Partition month from message creation date.
  day:
    lineage:
      - datalake_hubspot_clean.thread_messages.ts_created
    description: Partition day from message creation date.