dag:
  name: dw_ciq_supply
  owner: Data Agents
  documentation:
    dag_purpose: Dimensional modeling of supply funnel event data, associated with the CIQ context.
workflow:
  type: query_delta
  layer: dw
  custom_schema: ciq_supply
cluster:
  type: databricks_12_2_xmin_memory_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
