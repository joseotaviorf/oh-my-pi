---
database_name: datalake_hub_services
table_name: users
description: |
  Hub Services user rows reconciled to main/ebdb via id_external, with agent identity (id_agent,
  uuid_person) and contact fields coalesced from clean Hub Services users and datalake_ebdb_clean.user.
domain: Agents
owner: data-ae-agents@quintoandar.com.br
columns:
  id_user:
    lineage:
      - datalake_hub_services_clean.users.id
    description: |
      User unique identifier on Hub Services tables.
      Attention: This user ID refers to Hub Services and does not correspond to the main/admin/ebdb user.
  id_main_user:
    lineage:
      - datalake_hub_services_clean.users.id_external
      - datalake_ebdb_user.user_merge.id_user
    description: |
      External user id in main/admin (ebdb), after merge resolution when the Hub id maps via user_merge.
  id_agent:
    lineage:
      - datalake_ebdb_clean.user.id_agent
    description: |
      Agent unique identifier.
      Attention: This ID refers to the agent in main/admin/ebdb.
  uuid_person:
    lineage:
      - datalake_ebdb_clean.user.uuid_person
    description: Unique person UUID in admin/main (person registry identifier).
  name:
    lineage:
      - datalake_hub_services_clean.users.name
      - datalake_ebdb_clean.user.name
    description: Display name, preferring Hub Services clean when present.
  email:
    lineage:
      - datalake_hub_services_clean.users.email
      - datalake_ebdb_clean.user.email
    description: Email, preferring Hub Services clean when present.
  phone_number:
    lineage:
      - datalake_hub_services_clean.users.phone_number
      - datalake_ebdb_clean.user.main_phone
    description: Primary phone; Hub Services phone_number coalesced with ebdb main_phone.
  secondary_phone_number:
    lineage:
      - datalake_ebdb_clean.user.secondary_phone
      - datalake_ebdb_clean.user.main_phone
    description: |
      Secondary phone from ebdb when it differs from main_phone; otherwise null (avoids duplicating the main number).
  cpf:
    lineage:
      - datalake_ebdb_clean.user.cpf
    description: Brazilian CPF document number.
  is_active:
    lineage:
      - datalake_ebdb_clean.user.is_active
    description: Indicates whether this user is active in the admin/main system.
  ts_created:
    lineage:
      - datalake_hub_services_clean.users.ts_created
    description: User data creation datetime in Hub Services clean layer.
  ts_updated:
    lineage:
      - datalake_hub_services_clean.users.ts_updated
    description: User data update datetime in Hub Services clean layer.
  year:
    lineage:
      - datalake_hub_services_clean.users.year
    description: Partition year of the Hub Services users snapshot.
  month:
    lineage:
      - datalake_hub_services_clean.users.month
    description: Partition month of the Hub Services users snapshot.
  day:
    lineage:
      - datalake_hub_services_clean.users.day
    description: Partition day of the Hub Services users snapshot.
