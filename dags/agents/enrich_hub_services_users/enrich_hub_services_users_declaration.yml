---
dag:
  name: enrich_hub_services_users
  schedule_start_date: 2026, 4, 1
  owner: Data Agents
  documentation:
    dag_purpose: Enrichment of users data originating from Hub Services.
workflow:
  type: query_delta
  layer: enrich
  custom_schema: hub_services
cluster:
  type: databricks_16_4_min_memory_cluster
  databricks_conn_id: databricks_new_env
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
