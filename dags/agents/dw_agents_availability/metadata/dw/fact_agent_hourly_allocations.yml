database_name: dw_agent
table_name: fact_agent_hourly_allocations
description: Agent hour allocation on hour granularity
domain: Agents
owner: data-ae-agents@quintoandar.com.br
columns:
  sk_agent:
    lineage:
      - datalake_agenda_allocation.agenda_hourly_allocations.id_agent
    description: sk of agent (agent id)
  sk_slot_date:
    lineage:
      - datalake_agenda_allocation.agenda_hourly_allocations.id_slot_date
    description: sk of agent allocation date
  sk_slot_date_hour:
    lineage:
      - datalake_agenda_allocation.agenda_hourly_allocations.id_slot_date_hour
    description: sk of agent allocation date and hour
  sk_agent_region:
    lineage:
      - datalake_agenda_allocation.agenda_hourly_allocations.id_agent_region
    description: Concatenation of agent id and sk_region
  sk_slot_date_agent:
    lineage:
      - datalake_agenda_allocation.agenda_hourly_allocations.id_slot_date_agent
    description: table primary key, aggregate allocation sk date and dados agent id
  id_work_contract:
    lineage:
      - datalake_agenda_allocation.agenda_hourly_allocations.id_work_contract
    description: Total slots that agent could make available according to its contract
  ts_slot_hour:
    lineage:
      - datalake_agenda_allocation.agenda_hourly_allocations.ts_slot_hour
    description: Timestamp of the agent allocation
  agent_business_context:
    lineage:
      - datalake_agenda_allocation.agenda_hourly_allocations.agent_business_context
    description: Business context of the agent
  is_allocation_available:
    lineage:
      - datalake_agenda_allocation.agenda_hourly_allocations.is_allocation_available
    description: show if that hour could be made available acording to agent contract
  area:
    lineage:
    - datalake_agenda_allocation.agenda_hourly_allocations.area
    description: macro-region that agent has the most neighborhoods available
  ts_first_visit:
    lineage:
    - datalake_agenda_allocation.agenda_hourly_allocations.ts_first_visit_booked
    description: first visit made by the agent
  allocated_slots:
    lineage:
      - datalake_agenda_allocation.agenda_hourly_allocations.allocated_slots
    description: Number of slots allocated 24h in advance
  allocated_slots_0:
    lineage:
      - datalake_agenda_allocation.agenda_hourly_allocations.specific_allocated_slots
    description: Number of slots allocated 0h in advance
  year:
    lineage:
      - datalake_agenda_allocation.agenda_hourly_allocations.year
    description: year (partition)
  month:
    lineage:
      - datalake_agenda_allocation.agenda_hourly_allocations.month
    description: month (partition)
  day:
    lineage:
      - datalake_agenda_allocation.agenda_hourly_allocations.day
    description: day (partition)
  ts_load:
    description: agent contract type
