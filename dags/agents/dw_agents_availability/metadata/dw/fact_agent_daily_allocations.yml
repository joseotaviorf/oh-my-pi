database_name: dw_agent
table_name: fact_agent_daily_allocations
description: Agents hour allocation on day granularity
domain: Data Agents
owner: data-ae-agents@quintoandar.com.br
columns:
  sk_agent:
    lineage:
    - dw_agents_availability.fact_agent_hourly_allocations.sk_agent
    description: sk of agent (agent id)
  sk_slot_date:
    lineage:
    - dw_agents_availability.fact_agent_hourly_allocations.sk_slot_date
    description: sk of agent allocation date
  sk_agent_region:
    lineage:
    - dw_agents_availability.fact_agent_hourly_allocations.sk_agent_region
    description: Concatenation of agent id and sk_region
  sk_slot_date_agent:
    lineage:
    - dw_agents_availability.fact_agent_hourly_allocations.sk_slot_date_agent
    description: table primary key, aggregate allocation sk date and dados agent id
  id_work_contract:
    lineage:
    - dw_agents_availability.fact_agent_hourly_allocations.id_work_contract
    description: Total slots that agent could make available according to its contract
  agent_business_context:
    lineage:
    - dw_agents_availability.fact_agent_hourly_allocations.agent_business_context
    description: Business context of the agent
  max_slots_allocation_available:
    lineage:
    - datalake_ebdb_clean.mask_weekly_hour.has_hours_between_08_and_09_available
    - datalake_ebdb_clean.mask_weekly_hour.has_hours_between_09_and_10_available
    - datalake_ebdb_clean.mask_weekly_hour.has_hours_between_10_and_11_available
    - datalake_ebdb_clean.mask_weekly_hour.has_hours_between_11_and_12_available
    - datalake_ebdb_clean.mask_weekly_hour.has_hours_between_12_and_13_available
    - datalake_ebdb_clean.mask_weekly_hour.has_hours_between_13_and_14_available
    - datalake_ebdb_clean.mask_weekly_hour.has_hours_between_14_and_15_available
    - datalake_ebdb_clean.mask_weekly_hour.has_hours_between_15_and_16_available
    - datalake_ebdb_clean.mask_weekly_hour.has_hours_between_16_and_17_available
    - datalake_ebdb_clean.mask_weekly_hour.has_hours_between_17_and_18_available
    - datalake_ebdb_clean.mask_weekly_hour.has_hours_between_18_and_19_available
    - datalake_ebdb_clean.mask_weekly_hour.has_hours_between_19_and_20_available
    description: table primary key, aggregate allocation sk date and dados agent id
  area:
    lineage:
    - dw_agents_availability.fact_agent_hourly_allocations.area
    description: macro-region that agent has the most neighborhoods available
  ts_first_visit:
    lineage:
    - dw_agents_availability.fact_agent_hourly_allocations.ts_first_visit
    description: first visit made by the agent
  year:
    description: year (partition)
    lineage:
    - dw_agents_availability.fact_agent_hourly_allocations.year
  month:
    description: month (partition)
    lineage:
    - dw_agents_availability.fact_agent_hourly_allocations.month
  day:
    description: day (partition)
    lineage:
    - dw_agents_availability.fact_agent_hourly_allocations.day
  allocated_slots:
    description: Number of slots allocated 24h in advance
  allocated_slots_0:
    description: Number of slots allocated 0h in advance
  ts_load:
    description: timestamp of last time table ran
