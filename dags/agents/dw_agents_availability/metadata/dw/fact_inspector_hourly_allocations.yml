---
database_name: dw_agents_availability
table_name: fact_inspector_hourly_allocations
description: Inspection agent allocation on a hour and region granularity. Each line corresponds to a region (sk_region) and hour slot (ts_hour_slot) of an agent (sk_agent).
domain: Agents
owner: data-ae-agents@quintoandar.com.br
columns:
  sk_agent:
    lineage:
      - datalake_agenda_allocation.agenda_hourly_allocations.id_agent
    description: Id of the agent.
  sk_agent_region:
    lineage:
      - datalake_agenda_allocation.agenda_hourly_allocations.id_agent_region
    description: Id combining agent and region.
  sk_agent_slot_date:
    lineage:
      - datalake_agenda_allocation.agenda_hourly_allocations.id_slot_date_agent
    description: Id combining agent and slot information.
  sk_region:
    lineage:
      - datalake_agenda_allocation.agenda_hourly_allocations.id_region
    description: Id of the region.
  sk_slot_date:
    lineage:
      - datalake_agenda_allocation.agenda_hourly_allocations.id_slot_date
    description: Id of the date slot.
  sk_slot_date_hour:
    lineage:
      - datalake_agenda_allocation.agenda_hourly_allocations.id_slot_date_hour
    description: Id of the hour slot.
  sk_work_contract:
    lineage:
      - datalake_agenda_allocation.agenda_hourly_allocations.id_work_contract
    description: Id of the agent's work contract.
  agent_type:
    lineage:
      - datalake_agenda_allocation.agenda_hourly_allocations.agent_type
    description: Type of the agent.
    categories:
      Vistoria: Agent responsible for the house inspection.
      VistoriaQuarteirizada: Outsourced agent responsible for the house inspection.
  allocated_slots:
    lineage:
      - datalake_agenda_allocation.agenda_hourly_allocations.allocated_slots
    description: Number of the agent's slots allocated.
  specific_allocated_slots:
    lineage:
      - datalake_agenda_allocation.agenda_hourly_allocations.specific_allocated_slots
    description: Number of the agent's specific slots allocated.
  is_allocation_available:
    lineage:
      - datalake_agenda_allocation.agenda_hourly_allocations.is_allocation_available
    description: Boolean indicating if the specific hour slot is available.
  dt_first_inspection:
    lineage:
      - datalake_agenda_allocation.agenda_hourly_allocations.ts_first_inspection_booked
    description: Date of the first inspection booked to this agent.
  ts_slot_hour:
    lineage:
      - datalake_agenda_allocation.agenda_hourly_allocations.ts_slot_hour
    description: Timestamp of the hour slot.
  year:
    lineage:
      - datalake_agenda_allocation.agenda_hourly_allocations.year
    description: Year of the slot. This column is a table partition.
  month:
    lineage:
      - datalake_agenda_allocation.agenda_hourly_allocations.month
    description: Month of the slot. This column is a table partition.
  day:
    lineage:
      - datalake_agenda_allocation.agenda_hourly_allocations.day
    description: Day of the slot. This column is a table partition.
  ts_load:
    description: Timestamp of when this data was loaded.
