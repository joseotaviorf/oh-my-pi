database_name: dw_agent
table_name: fact_photographer_daily_allocations
description: Photographer allocation on a day and region granularity. Each line corresponds to a region (sk_region) and daily slot (day) of a photographer (sk_agent).
domain: Agents
owner: data-ae-agents@quintoandar.com.br
columns:
  sk_agent:
    lineage:
      - dw_agents_availability.fact_photographer_hourly_allocations.sk_agent
    description: Id of the agent.
  sk_slot_date:
    lineage:
      - dw_agents_availability.fact_photographer_hourly_allocations.sk_slot_date
    description: Id of the date slot.
  sk_agent_region:
    lineage:
      - dw_agents_availability.fact_photographer_hourly_allocations.sk_agent_region
    description: Id combining agent and region.
  sk_slot_date_agent:
    lineage:
      - dw_agents_availability.fact_photographer_hourly_allocations.sk_slot_date_agent
    description: Id combining slot and agent information.
  id_work_contract:
    lineage:
      - dw_agents_availability.fact_photographer_hourly_allocations.id_work_contract
    description: Id of the photographer's work contract.
  id_dados_fotografo:
    lineage:
      - dw_agents_availability.fact_photographer_hourly_allocations.id_dados_fotografo
    description: Id of the photographer's personal data.
  max_slots_allocation_available:
    lineage:
      - datalake_ebdb_clean.mask_weekly_hour.has_hours_between_08_and_09_available
      - datalake_ebdb_clean.mask_weekly_hour.has_hours_between_09_and_10_available
      - datalake_ebdb_clean.mask_weekly_hour.has_hours_between_10_and_11_available
      - datalake_ebdb_clean.mask_weekly_hour.has_hours_between_11_and_12_available
      - datalake_ebdb_clean.mask_weekly_hour.has_hours_between_12_and_13_available
      - datalake_ebdb_clean.mask_weekly_hour.has_hours_between_13_and_14_available
      - datalake_ebdb_clean.mask_weekly_hour.has_hours_between_14_and_15_available
      - datalake_ebdb_clean.mask_weekly_hour.has_hours_between_15_and_16_available
      - datalake_ebdb_clean.mask_weekly_hour.has_hours_between_16_and_17_available
      - datalake_ebdb_clean.mask_weekly_hour.has_hours_between_17_and_18_available
      - datalake_ebdb_clean.mask_weekly_hour.has_hours_between_18_and_19_available
      - datalake_ebdb_clean.mask_weekly_hour.has_hours_between_19_and_20_available
    description: Number of hour slots available.
  area:
    lineage:
      - dw_agents_availability.fact_photographer_hourly_allocations.area
    description: Covered area by this photographer.
  year:
    lineage:
      - dw_agents_availability.fact_photographer_hourly_allocations.year
    description: Year of the slot. This column is a table partition.
  month:
    lineage:
      - dw_agents_availability.fact_photographer_hourly_allocations.month
    description: Month of the slot. This column is a table partition.
  day:
    lineage:
      - dw_agents_availability.fact_photographer_hourly_allocations.day
    description: Day of the slot. This column is a table partition.
  allocated_slots:
    description: Number of the photographer's slots allocated.
  allocated_slots_0:
    description: Number of the photographer's specific slots allocated.
  ts_load:
    description: Timestamp of when this data was loaded.
