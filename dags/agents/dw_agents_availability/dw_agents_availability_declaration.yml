dag:
  name: dw_agents_availability
  schedule_start_date: 2020,2,20
  owner: Data Agents
workflow:
  type: query_delta
  layer: dw
  custom_schema: agents_availability
  default_extraction_type: incremental
  default_partitions: [year, month, day]
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
    "DATE(ts_load)": "DATE_ADD(DATE('{load_end_date}'), 1)"
  inner_dependencies:
    fact_inspector_daily_allocations:
      - fact_inspector_hourly_allocations
    fact_agent_daily_allocations:
      - fact_agent_hourly_allocations
    fact_photographer_daily_allocations:
      - fact_photographer_hourly_allocations
  tables_customization:
    fact_agent_daily_allocations:
      custom_schema: agent
    fact_agent_hourly_allocations:
      custom_schema: agent
    fact_photographer_daily_allocations:
      custom_schema: agent
    fact_photographer_hourly_allocations:
      custom_schema: agent
