dag:
  name: enrich_ciq
  schedule_start_date: 2024,9,1
  owner: Data Agents
  documentation:
    dag_purpose: |
        Enrich tables related to the context of CIQ (Consultor Imobiliario QuintoAndar)
workflow:
  type: query_delta
  layer: enrich
  inner_dependencies:
    listing_purchase_exclusion:
      - ciq_listing_purchase
    ciq_agents:
      - ciq_users
    daily_ciq_info:
      - ciq_users
  tables_customization:
    daily_ciq_info:
      extraction_type: incremental
      partitions: [year, month, day]
    ciq_listing_purchase:
      extraction_type: full
      partitions: [year, month, day]
    ciq_agents:
      custom_schema: ebdb_agents
    ciq_users:
      custom_schema: ebdb_agents
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
cluster:
  type: databricks_16_4_min_memory_cluster
  databricks_conn_id: databricks_new_env
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
