database_name: datalake_ebdb_agents
table_name: ciq_users
description: >
  Each row represents a CIQ partner-user status version: active or inactive transitions and user
  changes on Main, with SCD-style validity windows.
domain: Agents
owner: data-ae-agents@quintoandar.com.br
columns:
  id_partner:
    lineage:
      - datalake_ebdb_clean.partner.id
    description: Partner ID (Main)
  id_user:
    lineage:
      - datalake_ebdb_clean.partner_agent_aud.id_user
    description: User ID (Main)
  uuid_company:
    lineage:
      - datalake_ebdb_clean.partner.uuid_company
    description: Company UUID of CIQ into Porfolio Manager.
  uuid_person:
    lineage:
      - datalake_person_clean.person.uuid_person
    description: Person UUID of CIQ.
  name:
    lineage:
      - datalake_ebdb_clean.partner.name
      - datalake_person_clean.person.person_name
    description: Full name of user.
  email:
    lineage:
      - datalake_ebdb_clean.partner.email
      - datalake_person_clean.contact_info.priority
      - datalake_person_clean.contact_info.category
      - datalake_person_clean.contact_info.contact_info
    description: Email of user.
  status:
    lineage:
      - datalake_ebdb_clean.partner_agent_aud.status
    description: Status to identify whether the agent is active or inactive.
  is_active:
    lineage:
      - datalake_ebdb_clean.partner_agent_aud.status
    description: boolean to identify whether the agent is active or inactive.
  is_merge_loser_account:
    lineage:
      - datalake_ebdb_clean.user_merge.is_loser_account
      - datalake_ebdb_clean.user_merge.status
    description: boolean to identify whether the id user of an agent is the loser of a merge process.
  is_last_status:
    description: Characterizes a partner most recent status information.
  ts_agent_created:
    lineage:
      - datalake_ebdb_clean.partner.ts_created
    description: Timestamp of when the CIQ (Partner) was created.
  ts_agent_status_start:
    lineage:
      - datalake_ebdb_user.user_revision_entity.ts_revision
    description: Timestamp of when the status started.
  ts_agent_status_end:
    lineage:
      - datalake_ebdb_user.user_revision_entity.ts_revision
    description: Timestamp of when the status ended.
