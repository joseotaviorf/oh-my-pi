---
dag:
  name: enrich_agent_accreditation
  schedule_start_date: 2024, 1, 1
  owner: Data Agents
  documentation:
    dag_purpose: |
      Tracks and enriches agent operations for accreditation: business context assignments,
      profile type history, and the registration actions log of key changes over time.

      Current scope:
      - Business Context Tracking: historical assignment of business contexts to visit agents.
      - Agent Profile History: revision intervals for agent performance profiles (visit, inspection, etc.).
      - Registration Actions Log: accreditation, de-accreditation, context/profile updates, and related actions.
workflow:
  type: query_delta
  layer: enrich
  default_extraction_type: incremental
  inner_dependencies:
    agent_registration_actions_log:
      - agent_profile
      - business_context
  tables_customization:
    agent_profile:
      merge_on: [id_agent_profile]
      z_order_by: [id_agent_data, ts_revision_started]
    agent_registration_actions_log:
      merge_on: [id_action_log]
      z_order_by: [id_agent, dt_action]
    business_context:
      merge_on: [id_agent_business_context]
      z_order_by: [id_agent, ts_revision_started]
  extra_query_template_params:
      load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
      load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
