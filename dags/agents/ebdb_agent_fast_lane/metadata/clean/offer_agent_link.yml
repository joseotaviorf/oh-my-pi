---
database_name: datalake_ebdb_clean
table_name: offer_agent_link
domain: Agents
owner: gustavo.rompe@quintoandar.com.br
description: Links between agents and offers, tracking which agent is associated with each offer and its source.
columns:
  id:
    lineage:
      - datalake_ebdb_raw.offeragentlink.id
    description: Unique identifier for the offer-agent link record.
  id_offer:
    lineage:
      - datalake_ebdb_raw.offeragentlink.offer_id
    description: Identifier of the offer associated with the agent.
  uuid_agent:
    lineage:
      - datalake_ebdb_raw.offeragentlink.agent_uuid
    description: UUID of the agent linked to the offer.
  offer_source:
    lineage:
      - datalake_ebdb_raw.offeragentlink.offer_source
    description: Source system or channel from which the offer originated.
  ts_created:
    lineage:
      - datalake_ebdb_raw.offeragentlink.created_at
    description: Timestamp when the offer-agent link was created.
  ts_updated:
    lineage:
      - datalake_ebdb_raw.offeragentlink.updated_at
    description: Timestamp when the offer-agent link was last updated.
