database_name: datalake_airtable
table_name: cr_occurrences
description: This table contains information about cr_occurences.
domain: Agents
owner: data-ae-agents@quintoandar.com.br
columns:
  id_airtable_record:
    lineage:
    - datalake_airtable_clean.cr_occurrences.id_airtable_record
    description: Airtable identifier. It doesn't have any correspondence with our
      internals identifiers.
  id_agent:
    lineage:
    - datalake_airtable_clean.cr_occurrences.id_agent
    description: Agent's identifier.
  id_issue:
    lineage:
    - datalake_airtable_clean.cr_occurrences.id_issue
    description: Issue's id.
  department:
    lineage:
    - datalake_airtable_clean.cr_occurrences.department
    description: Department related to the issue.
  description:
    lineage:
    - datalake_airtable_clean.cr_occurrences.description
    description: Free text about the issue.
  ql_agent_complete_name:
    lineage:
    - datalake_airtable_clean.cr_occurrences.ql_agent_complete_name
    description: Agent's full name.
  ql_agent_region:
    lineage:
    - datalake_airtable_clean.cr_occurrences.ql_agent_region
    description: Region code where the agent is working.
  ql_agent_segment:
    lineage:
    - datalake_airtable_clean.cr_occurrences.ql_agent_segment
    description: Can be Locação, Vendas or HUB Vendas.
  ql_ocorrency_category:
    lineage:
    - datalake_airtable_clean.cr_occurrences.ql_ocorrency_category
    description: What kind of occorrency happened.
  ql_occorency_type:
    lineage:
    - datalake_airtable_clean.cr_occurrences.ql_occorency_type
    description: The severity of the occorrency.
  ql_resolution:
    lineage:
    - datalake_airtable_clean.cr_occurrences.ql_resolution
    description: How to solve this.
  ql_ticket_from:
    lineage:
    - datalake_airtable_clean.cr_occurrences.ql_ticket_from
    description: Who is the criminal.
  responsible:
    lineage:
    - datalake_airtable_clean.cr_occurrences.responsible
    description: Who is responsible by this issue.
  summary:
    lineage:
    - datalake_airtable_clean.cr_occurrences.summary
    description: Who done the occorrency and the severity.
  who_is_complaining:
    lineage:
    - datalake_airtable_clean.cr_occurrences.who_is_complaining
    description: Who is complaining.
  ts_created:
    lineage:
    - datalake_airtable_clean.cr_occurrences.ts_created
    description: When this issue was created.
  ts_updated:
    lineage:
    - datalake_airtable_clean.cr_occurrences.ts_updated
    description: When this issue was updated.
  year:
    lineage:
    - datalake_airtable_clean.cr_occurrences.year
    description: year when this record was created. It's a partition.
  month:
    lineage:
    - datalake_airtable_clean.cr_occurrences.month
    description: month when this record was created. It's a partition.
  day:
    lineage:
    - datalake_airtable_clean.cr_occurrences.day
    description: day when this record was created. It's a partition.
