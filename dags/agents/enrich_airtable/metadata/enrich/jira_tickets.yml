database_name: datalake_airtable
table_name: jira_tickets
description: This table contains information about cr_occurences.
domain: Data Agents
owner: data-ae-agents@quintoandar.com.br
columns:
  id_agent:
    lineage:
    - datalake_airtable_clean.jira_tickets.id_agent
    description: Agent's identifier.
  id_airtable_record:
    lineage:
    - datalake_airtable_clean.jira_tickets.id_airtable_record
    description: Airtable identifier. It doesn't have any correspondence with our
      internals identifiers.
  id_ql_agent:
    lineage:
    - datalake_airtable_clean.jira_tickets.id_ql_agent
    description: Agent's identifier.
  id_issue:
    lineage:
    - datalake_airtable_clean.jira_tickets.id_issue
    description: Issue's identifier.
  activated:
    lineage:
    - datalake_airtable_clean.jira_tickets.activated
    description: List of Airtable's records to the table activated.
  cpf:
    lineage:
    - datalake_airtable_clean.jira_tickets.cpf
    description: Agent's cpf
  description:
    lineage:
    - datalake_airtable_clean.jira_tickets.description
    description: Description about the issue.
  open_in_jira:
    lineage:
    - datalake_airtable_clean.jira_tickets.open_in_jira
    description: What we have on Jira. It's a json.
  permanent_deaccreditation:
    lineage:
    - datalake_airtable_clean.jira_tickets.permanent_deaccreditation
    description: It is Sim or Não.
  ql_agent_complete_name:
    lineage:
    - datalake_airtable_clean.jira_tickets.ql_agent_complete_name
    description: Agent's full name.
  ql_agent_line:
    lineage:
    - datalake_airtable_clean.jira_tickets.ql_agent_line
    description: What is the kind of line of the agent, could be Locação, Vendas or
      Vendas | HUB.
  ql_agent_region:
    lineage:
    - datalake_airtable_clean.jira_tickets.ql_agent_region
    description: What is the region code of the agent work.
  ql_agent_type:
    lineage:
    - datalake_airtable_clean.jira_tickets.ql_agent_type
    description: Type of agent. Could be OLD Or New Hire.
  ql_deaccreditation_reason:
    lineage:
    - datalake_airtable_clean.jira_tickets.ql_deaccreditation_reason
    description: The reason why the deaccreditation happened.
  ql_solicitation_type:
    lineage:
    - datalake_airtable_clean.jira_tickets.ql_solicitation_type
    description: Type of socilitation.
  ql_suspension_type:
    lineage:
    - datalake_airtable_clean.jira_tickets.ql_suspension_type
    description: type of suspension.
  responsible:
    lineage:
    - datalake_airtable_clean.jira_tickets.responsible
    description: Who is responsible for this issue.
  summary:
    lineage:
    - datalake_airtable_clean.jira_tickets.summary
    description: Summary about the issue.
  dt_begin:
    lineage:
    - datalake_airtable_clean.jira_tickets.dt_begin
    description: When the issue started.
  dt_deaccreditated:
    lineage:
    - datalake_airtable_clean.jira_tickets.dt_deaccreditated
    description: When the deaccreditation happened.
  dt_deaccreditation_return:
    lineage:
    - datalake_airtable_clean.jira_tickets.dt_deaccreditation_return
    description: When the return from the deaccreditation happened.
  dt_end:
    lineage:
    - datalake_airtable_clean.jira_tickets.dt_end
    description: When the isseu ended.
  ts_created:
    lineage:
    - datalake_airtable_clean.jira_tickets.ts_created
    description: When the record was created.
  ts_updated:
    lineage:
    - datalake_airtable_clean.jira_tickets.ts_updated
    description: When the record was updated.
  year:
    lineage:
    - datalake_airtable_clean.jira_tickets.year
    description: year when the record was created or updated. It's a partition.
  month:
    lineage:
    - datalake_airtable_clean.jira_tickets.month
    description: month when the record was created or udpated. It's a partition.
  day:
    lineage:
    - datalake_airtable_clean.jira_tickets.day
    description: day when the record was created or updated. It's a partition.
