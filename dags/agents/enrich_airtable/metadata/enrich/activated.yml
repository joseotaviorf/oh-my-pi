database_name: datalake_airtable
table_name: activated
description: This table contains information about activated agents. It comes to replace
  the sheet aux_agents.
domain: Data Agents
owner: data-ae-agents@quintoandar.com.br
columns:
  id_airtable_record:
    lineage:
    - datalake_airtable_clean.activated.id_airtable_record
    description: It's the record identifier on Airtable and doesn't have a real meaning
      for the table or the business.
  ids_history:
    lineage:
    - datalake_airtable_clean.activated.ids_history
    description: The id on the historical sheet.
  id_user:
    lineage:
    - datalake_airtable_clean.activated.id_user
    description: agent's id_user.
  accreditations:
    lineage:
    - datalake_airtable_clean.activated.accreditations
    description: Number of accreditations of this agent. It is an int.
  agent_actual_type:
    lineage:
    - datalake_airtable_clean.activated.agent_actual_type
    description: the actual type can be Old or New Hire. It's important to notice
      that we had some questions using the old sheet where this values were lower
      case. Now, there aren't lower.
  agent_creci:
    lineage:
    - datalake_airtable_clean.activated.agent_creci
    description: Agent's creci identifier.
  agent_email:
    lineage:
    - datalake_airtable_clean.activated.agent_email
    description: Agent's email address.
  agent_name:
    lineage:
    - datalake_airtable_clean.activated.agent_name
    description: Agent's full name.
  agent_phone_number:
    lineage:
    - datalake_airtable_clean.activated.agent_phone_number
    description: Agent's phone number.
  disqualification:
    lineage:
    - datalake_airtable_clean.activated.disqualification
    description: A list of id_airtable_record that are foreign key for jira_tickets
  dynamic_status:
    lineage:
    - datalake_airtable_clean.activated.dynamic_status
    description: Current agent status.
  last_area:
    lineage:
    - datalake_airtable_clean.activated.last_area
    description: last area code.
  last_disqualification:
    lineage:
    - datalake_airtable_clean.activated.last_disqualification
    description: Type of disqualification.
  last_disqualification_reason:
    lineage:
    - datalake_airtable_clean.activated.last_disqualification_reason
    description: A reason for the disqualification.
  last_suspension:
    lineage:
    - datalake_airtable_clean.activated.last_suspension
    description: Last type of suspension.
  last_suspension_reason:
    lineage:
    - datalake_airtable_clean.activated.last_suspension_reason
    description: Last reason for suspension.
  permanent_deaccreditation:
    lineage:
    - datalake_airtable_clean.activated.permanent_deaccreditation
    description: It's Sim or Não
  suspensions:
    lineage:
    - datalake_airtable_clean.activated.suspensions
    description: A list of id_airtable_record that are foreign key for jira_tickets.
  suspensions_register:
    lineage:
    - datalake_airtable_clean.activated.suspensions_register
    description: A list of reasons for suspension.
  tickets_jira:
    lineage:
    - datalake_airtable_clean.activated.tickets_jira
    description: A list of id_airtable_record that are foreign key for jira_tickets.
  days_since_activation_week:
    lineage:
    - datalake_airtable_clean.activated.days_since_activation_week
    description: Number of days after the activation. It's an int.
  dt_activated:
    lineage:
    - datalake_airtable_clean.activated.dt_activated
    description: Date when the activation happened.
  dt_last_disqualificated:
    lineage:
    - datalake_airtable_clean.activated.dt_last_disqualificated
    description: Date when the last disqualification happened.
  dt_last_disqualification_returned:
    lineage:
    - datalake_airtable_clean.activated.dt_last_disqualification_returned
    description: Date of the return of the last disqualification.
  dt_last_suspended:
    lineage:
    - datalake_airtable_clean.activated.dt_last_suspended
    description: Date when the last suspension happened.
  dt_last_suspension_returned:
    lineage:
    - datalake_airtable_clean.activated.dt_last_suspension_returned
    description: Date of the return of the last suspension.
  dt_week_accreditated:
    lineage:
    - datalake_airtable_clean.activated.dt_week_accreditated
    description: Week when the accreditation happened.
  ts_updated:
    lineage:
    - datalake_airtable_clean.activated.ts_updated
    description: when this record was last updated.
  year:
    lineage:
    - datalake_airtable_clean.activated.year
    description: year when the record was created or updated. It's a partition.
  month:
    lineage:
    - datalake_airtable_clean.activated.month
    description: month when the record was created or updated. It's a partition.
  day:
    lineage:
    - datalake_airtable_clean.activated.day
    description: day when the record was created or updated. It's a partition.
  cpf:
    description: Agent's cpf.
  number_of_id_user_changes:
    description: Times that the user changes id.
