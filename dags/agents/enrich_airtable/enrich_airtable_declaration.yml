---
dag:
  name: enrich_airtable
  schedule_start_date: 2019, 1, 1
  owner: Data Agents
  documentation: 
    dag_purpose: |
      Creates enriched tables for airtable. For now, it is only deduplicating data from the
      clean layer and bringing the last state of agents information.
      This DAG is triggered by Mediator and loads the table via full load.
workflow:
  type: query_delta
  layer: enrich
cluster:
  type: databricks_12_2_min_xlarge_io-memory_cluster

  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
