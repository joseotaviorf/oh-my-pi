dag:
  name: ebdb_partner
  schedule_interval: 10 21,8,12 * * *
  owner: Data Agents
  criticality: High
  sla_deadline_localtime: "08:00"
  documentation:
    dag_purpose: |
      Extraction of EBDB tables related to Parters into data lake. EBDB is the main database for QuintoAndar.
workflow:
  type: cdc
  layer: raw
  custom_schema: ebdb
  database_type: mysql
  source_database: ebdb
  source_schema: ebdb
  tables_customization:
    Partner:
      clean_table_name: partner
    PartnerAgent:
      clean_table_name: partner_agent
    PartnerAgent_AUD:
      clean_table_name: partner_agent_aud
    DadosAfiliado:
      clean_table_name: affiliate_data
    DadosAfiliado_AUD:
      clean_table_name: affiliate_data_aud
  extra_query_template_params:
    load_end_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, 1), 'load_end_date') }}"
