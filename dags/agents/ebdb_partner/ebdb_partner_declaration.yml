dag:
  name: ebdb_partner
  schedule_interval: 10 21 * * *
  owner: Data Agents
  documentation:
    dag_purpose: |
      Extraction of EBDB tables related to Parters into data lake. EBDB is the main database for QuintoAndar.
workflow:
  type: cdc
  layer: raw
  custom_schema: ebdb
  database_type: mysql
  source_database: ebdb
  source_schema: ebdb
  tables_customization:
    Partner:
      clean_table_name: partner
    PartnerAgent:
      clean_table_name: partner_agent
    PartnerAgent_AUD:
      clean_table_name: partner_agent_aud
    DadosAfiliado:
      clean_table_name: affiliate_data
    DadosAfiliado_AUD:
      clean_table_name: affiliate_data_aud
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: r5a.xlarge
    node_type_id: r5a.xlarge
    num_workers: 2
    spark_version: 12.2.x-scala2.12
