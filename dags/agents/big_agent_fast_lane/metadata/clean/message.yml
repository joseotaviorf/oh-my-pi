---
database_name: datalake_big_agent_clean
table_name: message
description: |
  Messages/delivery with payload and publication metadata, including partitions.
domain: Agents
owner: gustavo.rompe@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_big_agent_raw.message.id
    description: Primary key of the outbox message row in Big Agent.
  id_incremental:
    lineage:
      - datalake_big_agent_raw.message.incremental_id
    description: Monotonic sequence id used by the message broker for ordering deliveries.
  destination:
    lineage:
      - datalake_big_agent_raw.message.destination
    description: Target queue or topic name where the message payload is published.
  headers:
    lineage:
      - datalake_big_agent_raw.message.headers
    description: JSON metadata headers attached to the outbound message envelope.
  payload:
    lineage:
      - datalake_big_agent_raw.message.payload
    description: Message payload content.
  published:
    lineage:
      - datalake_big_agent_raw.message.published
    description: Publication indicator.
  message_partition:
    lineage:
      - datalake_big_agent_raw.message.message_partition
    description: Logical message partition.
  creation_time:
    lineage:
      - datalake_big_agent_raw.message.creation_time
    description: Producer creation timestamp.
  year:
    lineage:
      - datalake_big_agent_raw.message.year
    description: Partition year.
  month:
    lineage:
      - datalake_big_agent_raw.message.month
    description: Partition month.
  day:
    lineage:
      - datalake_big_agent_raw.message.day
    description: Partition day.



