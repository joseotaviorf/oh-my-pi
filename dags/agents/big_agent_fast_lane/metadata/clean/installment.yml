---
database_name: datalake_big_agent_clean
table_name: installment
description: Installment line for an external invoice, with amounts, bank send date,
  and accounting timestamps.
domain: Agents
owner: gustavo.rompe@quintoandar.com.br
columns:
  id:
    lineage:
    - datalake_big_agent_raw.installment.id
    description: Primary key identifier for this record.
  id_external_invoice:
    lineage:
    - datalake_big_agent_raw.installment.external_invoice_id
    description: Parent external invoice for this installment.
  id_earning:
    lineage:
    - datalake_big_agent_raw.installment.earning_id
    description: Related earning record in the incentive engine.
  id_accounting_external:
    lineage:
    - datalake_big_agent_raw.installment.accounting_external_id
    description: External accounting system identifier (cast to bigint).
  uuid_installment:
    lineage:
    - datalake_big_agent_raw.installment.installment_uuid
    description: Business UUID uniquely identifying the installment.
  accrual_year_month:
    lineage:
    - datalake_big_agent_raw.installment.accrual_year_month
    description: Accrual period encoded as year-month for accounting.
  status:
    lineage:
    - datalake_big_agent_raw.installment.status
    description: Current workflow or processing status.
  type:
    lineage:
    - datalake_big_agent_raw.installment.type
    description: Type discriminator for the record within its entity.
  amount:
    lineage:
    - datalake_big_agent_raw.installment.amount
    description: Monetary amount for the installment in the source currency.
  dt_sent_to_bank:
    lineage:
    - datalake_big_agent_raw.installment.send_to_bank_on
    description: Date on which the installment was sent to the bank.
  ts_accounted:
    lineage:
    - datalake_big_agent_raw.installment.accounted_at
    description: Timestamp when the installment was accounted in the finance system.
  ts_created:
    lineage:
    - datalake_big_agent_raw.installment.created_at
    description: Timestamp when the record was created in the source system.
  ts_updated:
    lineage:
    - datalake_big_agent_raw.installment.updated_at
    description: Timestamp when the record was last updated in the source system.
  year:
    lineage:
    - datalake_big_agent_raw.installment.year
    description: Partition year for incremental load.
  month:
    lineage:
    - datalake_big_agent_raw.installment.month
    description: Partition month for incremental load.
  day:
    lineage:
    - datalake_big_agent_raw.installment.day
    description: Partition day for incremental load.
