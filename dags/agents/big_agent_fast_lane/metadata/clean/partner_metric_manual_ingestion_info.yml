database_name: datalake_big_agent_clean
table_name: partner_metric_manual_ingestion_info
description: |
  Records of manually ingested partner metrics, capturing the author, the newly
  created metric, and the optionally superseded metric, with partitions.
domain: Agents
owner: gustavo.rompe@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_big_agent_raw.partner_metric_manual_ingestion_info.id
    description: Primary key of the manual ingestion info record.
  id_partner_metric:
    lineage:
      - datalake_big_agent_raw.partner_metric_manual_ingestion_info.partner_metric_id
    description: FK to the newly created active partner metric produced by this manual ingestion.
  id_replaced_partner_metric:
    lineage:
      - datalake_big_agent_raw.partner_metric_manual_ingestion_info.replaced_partner_metric_id
    description: FK to the previously active partner metric superseded by this ingestion, if any.
  author:
    lineage:
      - datalake_big_agent_raw.partner_metric_manual_ingestion_info.author
    description: JSONB metadata identifying the operations actor who triggered the manual ingestion.
  ts_created:
    lineage:
      - datalake_big_agent_raw.partner_metric_manual_ingestion_info.created_at
    description: Timestamp when this manual ingestion record was created.
  year:
    lineage:
      - datalake_big_agent_raw.partner_metric_manual_ingestion_info.year
    description: Partition year.
  month:
    lineage:
      - datalake_big_agent_raw.partner_metric_manual_ingestion_info.month
    description: Partition month.
  day:
    lineage:
      - datalake_big_agent_raw.partner_metric_manual_ingestion_info.day
    description: Partition day.
