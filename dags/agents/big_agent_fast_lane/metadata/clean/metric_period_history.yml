---
database_name: datalake_big_agent_clean
table_name: metric_period_history
description: |
  Metric periods history with file links, status, and creation timestamp,
  including partitions.
domain: Agents
owner: gustavo.rompe@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_big_agent_raw.metric_period_history.id
    description: Period history identifier.
  id_metric_period:
    lineage:
      - datalake_big_agent_raw.metric_period_history.metric_period_id
    description: Related metric period identifier.
  id_created_by:
    lineage:
      - datalake_big_agent_raw.metric_period_history.created_by
    description: Record creator identifier.
  metric_link_file:
    lineage:
      - datalake_big_agent_raw.metric_period_history.metric_link_file
