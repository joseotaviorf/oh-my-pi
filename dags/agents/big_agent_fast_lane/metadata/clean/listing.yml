---
database_name: datalake_big_agent_clean
table_name: listing
description: |
  Listings with business context and status, including timestamps and partitions.
domain: Agents
owner: gustavo.rompe@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_big_agent_raw.listing.id
    description: Primary key of the property listing mirrored from Big Agent.
  id_house:
    lineage:
      - datalake_big_agent_raw.listing.house_id
    description: Related house identifier.
  business_context:
    lineage:
      - datalake_big_agent_raw.listing.business_context
    description: Demand-side context (SALE or RENT) for the listing in Big Agent.
  status:
    lineage:
      - datalake_big_agent_raw.listing.status
    description: Publication lifecycle status of the listing (published, unpublished, etc.).
  ts_created:
    lineage:
      - datalake_big_agent_raw.listing.created_at
    description: Record creation timestamp.
  ts_updated:
    lineage:
      - datalake_big_agent_raw.listing.updated_at
    description: Record last update timestamp.
  year:
    lineage:
      - datalake_big_agent_raw.listing.year
    description: Partition year.
  month:
    lineage:
      - datalake_big_agent_raw.listing.month
    description: Partition month.
  day:
    lineage:
      - datalake_big_agent_raw.listing.day
    description: Partition day.



