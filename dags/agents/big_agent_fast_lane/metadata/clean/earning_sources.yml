---
database_name: datalake_big_agent_clean
table_name: earning_sources
description: |
  Sources for earnings: external domain and cart UUIDs, amounts, currency, processing status,
  competence date, occurrence time, and audit timestamps, partitioned by load date.
domain: Agents
owner: data-ae-agents@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_big_agent_raw.earning_sources.id
    description: Earning source identifier.
  id_external_domain:
    lineage:
      - datalake_big_agent_raw.earning_sources.external_domain_id
    description: External domain identifier related to the earning source.
  uuid_earning_source:
    lineage:
      - datalake_big_agent_raw.earning_sources.earning_source_uuid
    description: UUID of the earning source.
  uuid_external_cart:
    lineage:
      - datalake_big_agent_raw.earning_sources.external_cart_uuid
    description: UUID of the external cart associated with the earning source.
  external_domain_type:
    lineage:
      - datalake_big_agent_raw.earning_sources.external_domain_type
    description: Type discriminator for the external domain.
  currency:
    lineage:
      - datalake_big_agent_raw.earning_sources.currency
    description: Currency code for monetary fields.
  status:
    lineage:
      - datalake_big_agent_raw.earning_sources.status
    description: Processing status of the earning source.
  failure_reason:
    lineage:
      - datalake_big_agent_raw.earning_sources.failure_reason
    description: Failure reason when processing was not successful.
  base_amount:
    lineage:
      - datalake_big_agent_raw.earning_sources.base_amount
    description: Base amount used to compute earnings.
  revenue_share_total_amount:
    lineage:
      - datalake_big_agent_raw.earning_sources.revenue_share_total_amount
    description: Total amount considered for revenue share.
  dt_competence:
    lineage:
      - datalake_big_agent_raw.earning_sources.competence_date
    description: Business competence date for the earning source (date only).
  ts_occurred:
    lineage:
      - datalake_big_agent_raw.earning_sources.occurred_at
    description: When the earning event occurred (source timestamp).
  ts_created:
    lineage:
      - datalake_big_agent_raw.earning_sources.created_at
    description: Record creation timestamp.
  ts_updated:
    lineage:
      - datalake_big_agent_raw.earning_sources.updated_at
    description: Record last update timestamp.
  year:
    lineage:
      - datalake_big_agent_raw.earning_sources.year
    description: Partition year.
  month:
    lineage:
      - datalake_big_agent_raw.earning_sources.month
    description: Partition month.
  day:
    lineage:
      - datalake_big_agent_raw.earning_sources.day
    description: Partition day.
