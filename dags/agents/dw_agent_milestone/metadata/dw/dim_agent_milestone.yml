database_name: dw_agent_performance
table_name: dim_agent_milestone
description: >
  DW dimension of agent journey milestones. Grain is one row per
  (sk_user, milestone_type). sk_user is the platform user id (id_user) and is the
  MERGE key; id_agent is translated from datalake_agent_accreditation.agent
  (no join to dw_public.dim_agent / sk_agent). Each row stores mandatory
  ts_first / ts_last plus optional entity pointers (sk_entity_first / sk_entity_last
  with a single entity_type = schema.table.column per milestone). Loaded by DAG
  dw_agent_milestone (workflow.type: milestone_delta + shared)
  load_milestone_dimension) on EMR. The milestones: block below allowlists types;
  each entry points at a strategy under
  queries/dw/dim_agent_milestone/milestones/*.sql that emits event rows
  (sk_user, id_agent, ts_event, sk_entity, entity_type). The platform framework
  aggregates min/max ts_event, MERGEs on (sk_user, milestone_type), keeps
  ts_first, id_agent, sk_entity_first, and entity_type sticky on incremental
  runs, and advances ts_last / sk_entity_last only for newer events (late events
  ignored). First run with a missing table full-scans (watermark 1 = 1). DAG conf
  milestones_to_run / bootstrap_milestones select subsets and force full source
  scan + orphan delete for bootstrapped types. Fail-fast: any strategy error aborts
  the whole load. Upstream sources (registry-driven):
  datalake_agent_accreditation revision history (accreditation family);
  datalake_visit.visit_schedules (VB / VC); datalake_tiers.ciq_first_listing
  temporary for FL / FL_VALID (swap planned with AAREDE-503);
  datalake_rent_demand_events (CS); datalake_sale_offer.sale_offer (CCV);
  datalake_ebdb_clean.agent_lead_referral temporary for TQC (swap
  planned with AAREDE-504). Identity joins cast both sides to STRING.
  business_context is not in the grain.
domain: Agents
owner: gustavo.rompe@quintoandar.com.br
milestones:
  sticky_columns:
    - id_agent
  types:
    ACCREDITATION:
      milestone_type: ACCREDITATION
      sql_file: accreditation_events.sql
      scan:
        ts_column: aral.ts_revision
        lookback_days: 2
      params:
        action: Accreditation
    REACCREDITATION:
      milestone_type: REACCREDITATION
      sql_file: accreditation_events.sql
      scan:
        ts_column: aral.ts_revision
        lookback_days: 2
      params:
        action: Re-accreditation
    DEACCREDITATION:
      milestone_type: DEACCREDITATION
      sql_file: accreditation_events.sql
      scan:
        ts_column: aral.ts_revision
        lookback_days: 2
      params:
        action: De-accreditation
    ACTIVATION_AFTER_ACCREDITATION:
      milestone_type: ACTIVATION_AFTER_ACCREDITATION
      sql_file: accreditation_events.sql
      scan:
        ts_column: aral.ts_revision
        lookback_days: 2
      params:
        action: First activation after accreditation
    VB:
      milestone_type: VB
      sql_file: visit_events.sql
      scan:
        ts_column: vs.ts_schedule_confirmed
        lookback_days: 2
      params:
        event_ts_expr: vs.ts_schedule_confirmed
    VC:
      milestone_type: VC
      sql_file: visit_events.sql
      scan:
        ts_column: vs.ts_schedule_completed
        lookback_days: 2
      params:
        event_ts_expr: vs.ts_schedule_completed
    # Temporary upstream: datalake_tiers.ciq_first_listing — swap to AAREDE-503 later.
    FL:
      milestone_type: FL
      sql_file: first_listing_events.sql
      scan:
        ts_column: fl.ts_original_first_listing
        lookback_days: 2
      params:
        event_ts_expr: fl.ts_original_first_listing
    FL_VALID:
      milestone_type: FL_VALID
      sql_file: first_valid_listing_events.sql
      scan:
        ts_column: fl.ts_final_first_listing
        lookback_days: 2
      params:
        event_ts_expr: fl.ts_final_first_listing
    CS:
      milestone_type: CS
      sql_file: contract_signed_rent_events.sql
      scan:
        ts_column: rde.ts_event
        lookback_days: 2
    CCV:
      milestone_type: CCV
      sql_file: contract_signed_sale_events.sql
      scan:
        ts_column: so.ts_sale_agreement_signed
        lookback_days: 2
    # Temporary upstream: agent_lead_referral — swap to AAREDE-504 later.
    # TQA can reuse demand_referral_events.sql with business_context = 'RENT'.
    TQC:
      milestone_type: TQC
      sql_file: demand_referral_events.sql
      scan:
        ts_column: alr.ts_created
        lookback_days: 2
      params:
        business_context: SALE
columns:
  sk_user:
    description: >
      Platform user id (id_user) used as the MERGE grain key with milestone_type.
      Taken from the event source user key and aligned to
      datalake_agent_accreditation.agent.id_user. Same id_user-as-sk_user pattern
      used elsewhere in agent DW facts; not a dim_agent surrogate.
    lineage:
      - datalake_agent_accreditation.agent.id_user
  id_agent:
    description: >
      Canonical accreditation agent id from datalake_agent_accreditation.agent,
      joined on id_user (or id_agent_data for demand referral). Sticky on
      incremental updates; rewritten on bootstrap. Not part of the MERGE grain.
    lineage:
      - datalake_agent_accreditation.agent.id_agent
  milestone_type:
    description: >
      Registry-defined milestone enum (metadata milestones.types milestone_type).
      One row per sk_user per value; allowlisted categories below.
    categories:
      ACCREDITATION: Agent accreditation action
      REACCREDITATION: Agent re-accreditation action
      DEACCREDITATION: Agent de-accreditation action
      ACTIVATION_AFTER_ACCREDITATION: Activation after accreditation (source action label)
      VB: Visit booked (confirmed schedule on enrich visit_schedules, visit_agent)
      VC: Visit completed (enrich visit_schedules, visit_agent)
      FL: Listing published (any; from ciq_first_listing until AAREDE-503)
      FL_VALID: Valid listing (is_first_listing_valid)
      CS: Signed rent contract from rent_demand_events event type 9
      CCV: Signed sale agreement; entity pointer is sale_offer.id_house (id_offer is STRING)
      TQC: TQC (sale) demand lead referral from agent_lead_referral until AAREDE-504
  ts_first:
    description: >
      Timestamp of the first observed occurrence of this milestone for the user.
      Sticky on incremental runs; recomputed from full source history when the
      milestone is listed in bootstrap_milestones (DAG conf). On incremental runs,
      for brand-new users this is the first event inside the scan window.
  ts_last:
    description: >
      Timestamp of the most recent observed occurrence. Incremental: advanced
      only when a new event is strictly later (late events ignored). Bootstrap:
      recomputed with ts_first from the full scan. Also drives the incremental
      source watermark (max ts_last - lookback).
  sk_entity_first:
    description: >
      Source entity id for the event that set ts_first. Interpretable via
      entity_type (schema.table.column). Null when the strategy emits no entity.
  sk_entity_last:
    description: >
      Source entity id for the event that set or last advanced ts_last.
      Same entity_type as sk_entity_first (entity kind is fixed per milestone).
  entity_type:
    description: >
      Fully qualified path of the entity id columns (sk_entity_first /
      sk_entity_last), as schema.table.column (e.g.
      datalake_visit.visit_schedules.id_schedule). Constant per milestone_type;
      sticky on incremental updates. Null when entity pointers are null.
  ts_row_updated:
    description: >
      Pipeline write timestamp when this row was last inserted or updated by the
      load_milestone_dimension Spark job.
