database_name: datalake_big_agent
table_name: external_invoice
description: Table with big agent external invoices info. It receives the
  last update of a record. We're deduplicating the repeated IDs in this table, because
  our raw/clean DAG makes the ingestion via incremental load.
domain: Agents
owner: data-ae-agents@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_big_agent_clean.external_invoice.id
    description: ID of the table. 
  id_earning:
    lineage:
      - datalake_big_agent_clean.external_invoice.id_earning
    description: ID of the earning.
  id_external:
    lineage:
      - datalake_big_agent_clean.external_invoice.id_external
    description: ID of the external invoice. It can be joined with the id_external from Retsuko souce.
  accrual_year_month:
    lineage:
      - datalake_big_agent_clean.external_invoice.accrual_year_month
    description: Competence year and month.
  entries:
    lineage:
      - datalake_big_agent_clean.external_invoice.entries
    description: JSON object field with the information about the entry.
      It contains the ID External from Retsuko's entry table, description, amount, etc.
  purpose:
    lineage:
      - datalake_big_agent_clean.external_invoice.purpose
    description: The purpose of the invoice.
  dt_due:
    lineage:
      - datalake_big_agent_clean.external_invoice.dt_due
    description: Due date of the invoice.
  ts_created_external:
    lineage:
      - datalake_big_agent_clean.external_invoice.ts_created_external
    description: Timestamp of the invoice's creation from Retsuko source.
  ts_created:
    lineage:
      - datalake_big_agent_clean.external_invoice.ts_created
    description: Timestamp of when the register was created.
  ts_updated:
    lineage:
      - datalake_big_agent_clean.external_invoice.ts_updated
    description: Timestamp of when the register was updated for the last time.
  year:
    lineage:
      - datalake_big_agent_clean.external_invoice.year
    description: Year of the ts_updated column. It's not a partition.
  month:
    lineage:
      - datalake_big_agent_clean.external_invoice.month
    description: Month of the ts_updated column. It's not a partition.
  day:
    lineage:
      - datalake_big_agent_clean.external_invoice.day
    description: Day of the ts_updated column. It's not a partition.