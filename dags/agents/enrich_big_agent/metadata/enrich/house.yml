database_name: datalake_big_agent
table_name: house
description: Enrich table that contains all properties registered in big agent service and its relation with mainstream properties (Imovel table). Each row is a property.
domain: Agents
owner: data-ae-agents@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_big_agent_clean.house.id
    description: Big agent house ID (different from mainstream House ID)
  details:
    lineage:
      - datalake_big_agent_clean.house.details
    description: Json that contains houseExternalId (House ID from mainstream)
  ts_created:
    lineage:
      - datalake_big_agent_clean.house.ts_created
    description: Big agent house creation timestamp
  ts_updated:
    lineage:
      - datalake_big_agent_clean.house.ts_updated
    description: Big agent house last update timestamp
  year:
    lineage:
      - datalake_big_agent_clean.house.year
    description: Year from last update date
  month:
    lineage:
      - datalake_big_agent_clean.house.month
    description: Month from last update date
  day:
    lineage:
      - datalake_big_agent_clean.house.day
    description: Day from last update date
