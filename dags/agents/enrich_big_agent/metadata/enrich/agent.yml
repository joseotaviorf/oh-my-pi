database_name: datalake_big_agent
table_name: agent
description: Information about agents (CIQ/ASP) registered at QuintoAndar. Each line is an unique agent. 
domain: Agents
owner: gustavo.rompe@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_big_agent_clean.agent.id
    description: Unique identifier of the agent in Big Agent.
  details:
    lineage:
      - datalake_big_agent_clean.agent.details
    description: Json with some agent details, such as active, registeredAt, userExternalId and partnerExternalId.
  ts_created:
    lineage:
      - datalake_big_agent_clean.agent.ts_created
    description: Agent creation timestamp
  ts_updated:
    lineage:
      - datalake_big_agent_clean.agent.ts_updated
    description: Agent last update timestamp
  year:
    lineage:
      - datalake_big_agent_clean.agent.year
    description: Year from last update date
  month:
    lineage:
      - datalake_big_agent_clean.agent.month
    description: Month from last update date
  day:
    lineage:
      - datalake_big_agent_clean.agent.day
    description: Day from last update date
