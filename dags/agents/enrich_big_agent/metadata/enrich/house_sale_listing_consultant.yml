database_name: datalake_big_agent
table_name: house_sale_listing_consultant
description: History information of House and CIQ by listing version
domain: Agents
owner: data-ae-agents@quintoandar.com.br
columns:
  id_sale_listing:
    lineage:
    - datalake_sale_listings.sale_listing.id_sale_listing
    description: id from house with the listing version
  id_house:
    lineage:
    - datalake_sale_listings.sale_listing.id_house
    description: id from the house
  id_enrollment:
    lineage:
    - datalake_big_agent.house_consultant_history.id_enrollment
    description: Version of the enrollment coming from agency_aud
  id_partner:
    lineage:
    - datalake_big_agent.house_consultant_history.id_partner
    description: id from the partner assigned to the house
  id_user:
    lineage:
    - datalake_big_agent.house_consultant_history.id_user
    description: id of the user responsible for the house
  consultant_type:
    lineage:
    - datalake_big_agent.house_consultant_history.consultant_type
    description: type of the CIQ
    categories:
      ASP: House has an ASP manager assigned(similar to CIQ Manager)
      CIQ_FULL: House is fully managed by the CIQ
      CIQ_MANAGER: House has a CIQ manager assigned
  first_consultant_type:
    lineage:
    - datalake_big_agent.house_consultant_history.consultant_type
    description: first consultant type of the house
    categories:
      ASP: House has an ASP manager assigned(similar to CIQ Manager)
      CIQ_FULL: House is fully managed by the CIQ
      CIQ_MANAGER: House has a CIQ manager assigned
  dt_consultant_started:
    lineage:
    - datalake_big_agent.house_consultant_history.dt_consultant_started
    description: date of the first assignment
  ts_consultant_deleted:
    lineage:
    - datalake_big_agent.house_consultant_history.ts_consultant_deleted
    description: removed date of the consultant
  ts_enrollment_started:
    lineage:
    - datalake_big_agent.house_consultant_history.ts_enrollment_started
    description: date when the enrollment version started
  ts_enrollment_ended:
    lineage:
    - datalake_big_agent.house_consultant_history.ts_enrollment_ended
    description: date when the enrollment version ended
  enrollment_number:
    description: Version of the enrollment also coming from agency_aud
  is_last_ciq_on_listing:
    description: true if it's the last registry of the CIQ
