---
database_name: datalake_big_agent
table_name: house_listing_consultant
description: |
  Unified rent and sale listing consultant attribution built from house_consultant_history,
  with business rules that normalize missing tiers to Core or CIQ_FULL when applicable.
domain: Agents
owner: gustavo.rompe@quintoandar.com.br
columns:
  id_listing:
    lineage:
      - datalake_ebdb_listing.house_listing.id_house_listing
      - datalake_sale_listings.sale_listing.id_sale_listing
    description: Listing identifier in the source domain, mapped from rent house_listing or sale_listing.
  id_house:
    lineage:
      - datalake_ebdb_listing.house_listing.id_house
      - datalake_sale_listings.sale_listing.id_house
    description: EBDB house identifier for the property linked to the listing consultant assignment.
  id_enrollment:
    lineage:
      - datalake_big_agent.house_consultant_history.id_enrollment
    description: Big Agent enrollment version effective for the consultant during the listing interval.
  id_partner:
    lineage:
      - datalake_big_agent.house_consultant_history.id_partner
    description: Partner company identifier of the consultant assigned to the listing interval.
  id_user:
    lineage:
      - datalake_big_agent.house_consultant_history.id_user
    description: QuintoAndar user id of the consultant responsible for the listing interval.
  consultant_type:
    lineage:
      - datalake_big_agent.house_consultant_history.consultant_type
    description: Normalized Big Agent program tier attributed to the listing after analytical override rules.
    categories:
      ASP: House has an ASP manager assigned (similar to CIQ Manager).
      CIQ_FULL: House is fully managed by the CIQ.
      CIQ_MANAGER: House has a CIQ manager assigned.
      Core: No consultant assigned or enrollment ended within the listing window.
  first_consultant_type:
    lineage:
      - datalake_big_agent.house_consultant_history.consultant_type
    description: Program tier of the first consultant ever recorded for the listing before override rules.
    categories:
      ASP: House has an ASP manager assigned (similar to CIQ Manager).
      CIQ_FULL: House is fully managed by the CIQ.
      CIQ_MANAGER: House has a CIQ manager assigned.
      Core: No consultant assigned at the first recorded revision.
  business_context:
    description: Operating context of the listing row, distinguishing rent from sale attribution logic.
    categories:
      RENT: Rent listing version from EBDB house_listing.
      SALE: Sale listing from sale_listings enrich layer.
  is_last_ciq_on_listing:
    description: True when the row is the latest consultant revision attributed to the listing.
  dt_consultant_started:
    lineage:
      - datalake_big_agent.house_consultant_history.dt_consultant_started
    description: Date when the consultant first became associated with the house in Big Agent.
  ts_consultant_deleted:
    lineage:
      - datalake_big_agent.house_consultant_history.ts_consultant_deleted
    description: Timestamp when the consultant association was removed from the house, if applicable.
  ts_enrollment_started:
    lineage:
      - datalake_big_agent.house_consultant_history.ts_enrollment_started
    description: Timestamp when the enrollment version linked to this listing interval started.
  ts_enrollment_ended:
    lineage:
      - datalake_big_agent.house_consultant_history.ts_enrollment_ended
    description: Timestamp when the enrollment version ended for this listing interval, when known.
  ts_listing_version_start:
    lineage:
      - datalake_ebdb_listing.house_listing.ts_listing_version_start
    description: Rent listing version start timestamp used for temporal overlap with consultant history.
  ts_listing_version_end:
    lineage:
      - datalake_ebdb_listing.house_listing.ts_listing_version_end
    description: Rent listing version end timestamp used for temporal overlap with consultant history.
