database_name: datalake_big_agent
table_name: program
description: Table with big agent programs info.
domain: Agents
owner: gustavo.rompe@quintoandar.com.br
columns:
  id:
    description: Surrogate primary key of the Big Agent incentive program definition.
    lineage:
      - datalake_big_agent_clean.program.id
  name:
    description: Display name of the Big Agent program tier (e.g. ASP, CIQ Full, CIQ Manager).
    lineage:
      - datalake_big_agent_clean.program.name
  code:
    description: Short machine-readable program code used in enrollment and commission rules.
    lineage:
      - datalake_big_agent_clean.program.code
  details:
    description: JSON payload with optional program configuration metadata from the Big Agent source.
    lineage:
      - datalake_big_agent_clean.program.details
  ts_created:
    description: Timestamp of when the program was created.
    lineage:
      - datalake_big_agent_clean.program.ts_created
  ts_updated:
    description: Timestamp of when the program was last updated.
    lineage:
      - datalake_big_agent_clean.program.ts_updated
  year:
    description: Year, partition of the table. It can be used to enhance the query's performance.
    lineage:
      - datalake_big_agent_clean.program.year
  month:
    description: Month, partition of the table. It can be used to enhance the query's performance.
    lineage:
      - datalake_big_agent_clean.program.month
  day:
    description: Day, partition of the table. It can be used to enhance the query's performance.
    lineage:
      - datalake_big_agent_clean.program.day