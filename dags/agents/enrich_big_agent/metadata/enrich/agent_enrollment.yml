---
database_name: datalake_big_agent
table_name: agent_enrollment
description: |
  Agent enrollment intervals enriched with EBDB user and partner identifiers, unified agent
  identity keys, program tier, and active-state flags. Incremental loads select agents with
  enrollment updates in the load window, then rebuild all enrollment intervals for those agents.
  Identity attributes resolve via agent_unified_identity on id_partner (partner replace key).
domain: Agents
owner: gustavo.rompe@quintoandar.com.br
columns:
  id_agent_enrollment:
    description: Surrogate key combining Big Agent agent id and enrollment id for merge upserts.
    lineage:
      - datalake_big_agent_clean.agent.id
      - datalake_big_agent_clean.enrollment.id
  id_internal_agent:
    lineage:
      - datalake_big_agent_clean.agent.id
    description: Internal Big Agent identifier of the consultant agent record.
  id_unified_agent:
    lineage:
      - datalake_ebdb_agent_events.agent_unified_identity.id_unified_agent
    description: |
      Unified agent identity surrogate key from agent_unified_identity, resolved by joining the
      preferred partner replace-key row for the agent's id_partner.
  id_agent:
    lineage:
      - datalake_ebdb_agent_events.agent_unified_identity.id_agent
    description: |
      Agent Domain identifier from the preferred partner-keyed unified identity row for the
      enrollment agent's partner, when a matching identity exists.
  id_user:
    lineage:
      - datalake_big_agent_clean.agent.details
      - datalake_ebdb_clean.partner_agent.id_user
    description: QuintoAndar main user id resolved from agent JSON or partner_agent fallback.
  id_partner:
    lineage:
      - datalake_big_agent_clean.agent.details
      - datalake_ebdb_clean.partner_agent.id_partner
    description: EBDB partner company identifier linked to the agent when available.
  id_agent_data:
    lineage:
      - datalake_ebdb_agent_events.agent_unified_identity.id_agent_data
    description: Dados Agente identifier from the preferred partner-keyed unified identity row.
  id_enrollment:
    lineage:
      - datalake_big_agent_clean.enrollment.id
    description: Big Agent enrollment record identifier for the program assignment interval.
  id_program:
    lineage:
      - datalake_big_agent_clean.enrollment.id_program
    description: Program identifier assigned to the agent during this enrollment interval.
  uuid_agent:
    lineage:
      - datalake_ebdb_agent_events.agent_unified_identity.uuid_agent
    description: Business UUID of the agent from the preferred partner-keyed unified identity row.
  uuid_person:
    lineage:
      - datalake_ebdb_agent_events.agent_unified_identity.uuid_person
    description: Person UUID from the preferred partner-keyed unified identity row.
  consultant_type:
    lineage:
      - datalake_big_agent_clean.program.name
    description: Program tier name (for example ASP, CIQ_FULL, or CIQ_MANAGER) for the enrollment.
    categories:
      ASP: Owner advisor program similar to CIQ Manager.
      CIQ_FULL: Agent fully responsible for property publication and management.
      CIQ_MANAGER: Property belongs to owner but is managed by a CIQ.
  is_last_enrollment_by_agent:
    description: True when the row is the most recently updated enrollment interval for the agent.
  is_agent_active:
    lineage:
      - datalake_big_agent_clean.agent.details
    description: Whether the agent is marked active in Big Agent operational JSON at load time.
  ts_enrollment_started:
    lineage:
      - datalake_big_agent_clean.enrollment.ts_created
    description: Timestamp when the enrollment interval started for the agent.
  ts_enrollment_ended:
    lineage:
      - datalake_big_agent_clean.enrollment.ts_updated
    description: Timestamp when the enrollment interval ended, or current time for open intervals.
  ts_agent_registered:
    lineage:
      - datalake_big_agent_clean.agent.details
      - datalake_big_agent_clean.agent.ts_created
    description: Timestamp when the agent was registered in Big Agent.
  ts_agent_updated:
    lineage:
      - datalake_big_agent_clean.agent.ts_updated
    description: Timestamp of the latest agent update carried on the enrollment row.
  year:
    lineage:
      - datalake_big_agent_clean.agent.year
    description: Partition year derived from agent partitions for incremental extraction.
  month:
    lineage:
      - datalake_big_agent_clean.agent.month
    description: Partition month derived from agent partitions for incremental extraction.
  day:
    lineage:
      - datalake_big_agent_clean.agent.day
    description: Partition day derived from agent partitions for incremental extraction.
