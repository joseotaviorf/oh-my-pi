database_name: datalake_big_agent
table_name: enrollment
description: Enrich table that contains the agent enrollment in a program (such as ASP, CIQ_FULL and CIQ_MANAGER).
domain: Data Agents
owner: data-ae-agents@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_big_agent_clean.enrollment.id
    description: Enrollment ID
  id_agent:
    lineage:
      - datalake_big_agent_clean.enrollment.id_agent
    description: Agent ID of the agent enrolled
  id_program:
    lineage:
      - datalake_big_agent_clean.enrollment.id_program
    description: Program ID from datalake_big_agent_clean.program
  details:
    lineage:
      - datalake_big_agent_clean.enrollment.details
    description: Json with some details (usually empty)
  ts_created:
    lineage:
      - datalake_big_agent_clean.enrollment.ts_created
    description: Timestamp of enrollment creation
  ts_updated:
    lineage:
      - datalake_big_agent_clean.enrollment.ts_updated
    description: Timestamp of enrollment last update
  year:
    lineage:
      - datalake_big_agent_clean.enrollment.year
    description: Year from last update date
  month:
    lineage:
      - datalake_big_agent_clean.enrollment.month
    description: Month from last update date
  day:
    lineage:
      - datalake_big_agent_clean.enrollment.day
    description: Day from last update date
