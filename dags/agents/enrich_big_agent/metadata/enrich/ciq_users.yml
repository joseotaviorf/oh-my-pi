database_name: datalake_big_agent
table_name: ciq_users
description: Each line represents a change in the agent's status, 
  if it has changed between active or inactive, or has had any change in its username in main. 
  Agent records can be related to tables in other contexts (BigAgent / Main / Hub Services).
domain: Data Agents
owner: data-ae-agents@quintoandar.com.br
columns:
  id_agent:
    lineage:
      - datalake_big_agent.agent.id
    description: Agent ID (BigAgent)
  id_partner:
    lineage:
      - datalake_big_agent.agent.details
    description: Partner ID (Main)
  id_main_user:
    lineage:
      - datalake_ebdb_user.user.id
    description: User ID (Main)
  id_agent_data:
    lineage:
      - datalake_ebdb_user.user.id_agent
    description:  Agent ID (Main)
  id_hub_services_user:
    lineage:
      - datalake_hub_services.users.id_user
    description: Agent ID (Hub Services)
  name:
    lineage:
      - datalake_ebdb_user.user.name
    description: Full name of user.
  email:
    lineage:
      - datalake_ebdb_user.user.email
    description: Email of user.
  is_active:
    lineage:
      - datalake_big_agent_clean.agent.details
    description: Status to identify wheter the agent is active or not.
  is_user_merged: 
    lineage:
      - datalake_ebdb_user.user_merge.id_user
      - datalake_ebdb_user.user_merge.predecessor_user_list
    description: Informs when the user needed to be merged into main. 
    categories:
      TRUE: The id_main_user provided in the table has already been replaced by the current one.
      FALSE: The id_main_user provided in the table is the one provided by main.
  ts_agent_created:
    lineage:
      - datalake_big_agent.agent.ts_created
    description: Timestamp of when the agent was created
  ts_agent_updated_start:
    lineage:
      - datalake_big_agent.agent.ts_updated
    description: Timestamp of when the agent was updated. 
      A relationship was created between updates, where the end date of the current update is the start date of the next update. 
      Therefore, the most recent update has no end date.
  ts_agent_updated_end: 
    lineage:
      - datalake_big_agent.agent.ts_updated
    description: Timestamp of end update. If its value is null, it is still active.
