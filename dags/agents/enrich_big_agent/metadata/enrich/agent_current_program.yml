---
database_name: datalake_big_agent
table_name: agent_current_program
description: Enrich table containing the program that each agent is currently enrolled in.
domain: Data Agents
owner: data-ae-agents@quintoandar.com.br
columns:
  id_agent:
    lineage:
      - datalake_big_agent_clean.agent.id
    description: Agent ID
  id_user:
    lineage:
      - datalake_ebdb_user.user.id
    description: User ID
  id_partner:
    lineage:
      - datalake_ebdb_clean.partner_agent.id_partner
    description: Partner ID
  consultant_type:
    lineage:
      - datalake_big_agent_clean.program.name
    description: Program enrolled
    categories:
      ASP: Owner advisor, it works a lot like CIQ Manager
      CIQ_FULL: Agent fully responsible for the property, publication and management
      CIQ_MANAGER: House belongs to a client but is managed by a CIQ
  ts_agent_updated:
    lineage:
      - datalake_big_agent_clean.agent.ts_updated
    description: Timestamp of agent last update
  ts_enrollment_updated:
    lineage:
      - datalake_big_agent_clean.enrollment.ts_updated
    description: Timestamp of enrollment last update
