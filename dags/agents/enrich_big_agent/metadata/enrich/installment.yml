database_name: datalake_big_agent
table_name: installment
description: Table with Big Agent's installment info. It receives the
  last update of a record. We're deduplicating the repeated IDs in this table, because
  our raw/clean DAG makes the ingestion via incremental load.
domain: Agents
owner: data-ae-agents@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_big_agent_clean.installment.id
    description: ID of the Big Agent's installment.
  id_external_invoice:
    lineage:
      - datalake_big_agent_clean.installment.id_external_invoice
    description: ID of the invoice.
  id_earning:
    lineage:
      - datalake_big_agent_clean.installment.id_earning
    description: ID of earning. It can be joined with datalake_big_agent.earnings table.
  uuid_installment:
    lineage:
      - datalake_big_agent_clean.installment.uuid_installment
    description: Universal unique ID of the installment.
  type:
    lineage:
      - datalake_big_agent_clean.installment.type
    description: Type of the installment.
    categories:
      CORRECTION: Means that it is a positive amount that will be transferred to the CIQ. Normal installments will be of this type.
      PAYMENT: Means that the amount in the installment should be subtracted from the CIQ.
        Created when an invoice is canceled but its original installment has already been dispatched
        to robin-hood, requiring us to create a new one to correct it.
  amount:
    lineage:
      - datalake_big_agent_clean.installment.amount
    description: Amount value of the installment.
  accrual_year_month:
    lineage:
      - datalake_big_agent_clean.installment.accrual_year_month
    description: Competence year and month.
  status:
    lineage:
      - datalake_big_agent_clean.installment.status
    description: Status of the installment.
    categories:
      CANCELED: The installment is canceled.
      DISPATCHED: The installment was dispatched.
      DISPATCHING: The installment is on dispatching status.
      MANUALLY_CANCELED: The installment was manually canceled.
      PENDING: The installment is pending.
  dt_sent_to_bank:
    lineage:
      - datalake_big_agent_clean.installment.dt_sent_to_bank
    description: Date when the amount was sent to the bank.
  ts_created:
    lineage:
      - datalake_big_agent_clean.installment.ts_created
    description: Timestamp of when the installment was created.
  ts_updated:
    lineage:
      - datalake_big_agent_clean.installment.ts_updated
    description: Timestamp of when the installment was updated for the last time.
  year:
    lineage:
      - datalake_big_agent_clean.installment.year
    description: Year of the ts_updated column. It's not a partition.
  month:
    lineage:
      - datalake_big_agent_clean.installment.month
    description: Month of the ts_updated column. It's not a partition.
  day:
    lineage:
      - datalake_big_agent_clean.installment.day
    description: Day of the ts_updated column. It's not a partition.