database_name: datalake_big_agent
table_name: earnings
description: Table with big agent earnings info. It receives the
  last update of a record. We're deduplicating the repeated IDs in this table, because
  our raw/clean DAG makes the ingestion via incremental load.
domain: Agents
owner: data-ae-agents@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_big_agent_clean.earnings.id
    description: ID of the agent earning.
  id_agency:
    lineage:
      - datalake_big_agent_clean.earnings.id_agency
    description: ID of the agency.
  id_program:
    lineage:
      - datalake_big_agent_clean.earnings.id_program
    description: ID of the program.
  id_house_external:
    lineage:
      - datalake_big_agent_clean.earnings.id_house_external
    description: ID house from EBDB source.
  id_external_receiver:
    lineage:
      - datalake_big_agent_clean.earnings.id_external_receiver
    description: Id of Receiver.
  id_external_domain:
    lineage:
      - datalake_big_agent_clean.earnings.id_external_domain
    description: Id of contract.
  status:
    lineage:
      - datalake_big_agent_clean.earnings.status
    description: Status of the earning.
  type:
    lineage:
      - datalake_big_agent_clean.earnings.type
    description: Type of the earning that came from.
  failure_count:
    lineage:
      - datalake_big_agent_clean.earnings.failure_count
    description: Integer value that counts the failure earnings.
  details:
    lineage:
      - datalake_big_agent_clean.earnings.details
    description: JSON object that contains fields like rentValue, initial and closing date, the remunerationValue (%), contract Id.
  remuneration_value:
    lineage:
      - datalake_big_agent_clean.earnings.remuneration_value
    description: Remuneration value (in percent).
  external_domain_type:
    lineage:
      - datalake_big_agent_clean.earnings.external_domain_type
    description: Type of contract (SALES_FLOW or RENT_CONTRACT).
  external_receiver_type:
    lineage:
      - datalake_big_agent_clean.earnings.external_receiver_type
    description: Type of Receiver (AGENT or Other).
  ts_created:
    lineage:
      - datalake_big_agent_clean.earnings.ts_created
    description: Timestamp of when the register was created.
  ts_updated:
    lineage:
      - datalake_big_agent_clean.earnings.ts_updated
    description: Timestamp of when the register was updated for the last time.
  year:
    lineage:
      - datalake_big_agent_clean.earnings.year
    description: Year of the ts_updated column. It's not a partition.
  month:
    lineage:
      - datalake_big_agent_clean.earnings.month
    description: Month of the ts_updated column. It's not a partition.
  day:
    lineage:
      - datalake_big_agent_clean.earnings.day
    description: Day of the ts_updated column. It's not a partition.