dag:
  name: dw_agent_contract
  schedule_start_date: 2020,8,6
  owner: Data Agents
workflow:
  type: query_delta
  layer: dw
  custom_schema: agent
  default_extraction_type: full
  inner_dependencies:
    fact_agent_contract:
      - dim_work_contract
    fact_daily_accredited_agent:
      - fact_agent_contract
  tables_customization:
