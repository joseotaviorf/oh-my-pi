---
database_name: dw_ciq
table_name: fact_listing_purchase_exclusion
description: >
  DW fact for CIQ listing purchase exclusion alerts: new registrations matched to prior paid captures
  via Atlas and/or address-parsed duplicity, sourced from datalake_ciq.listing_purchase_exclusion enrich.
domain: Agents
owner: gustavo.rompe@quintoandar.com.br
columns:
  sk_house:
    description: House id of the new registration (exclusion candidate).
    lineage:
      - datalake_ciq.listing_purchase_exclusion.id_house
  sk_ciq_user:
    description: CIQ user id on the new registration.
    lineage:
      - datalake_ciq.listing_purchase_exclusion.id_ciq_user
  sk_owner:
    description: Owner user id on the new registration.
    lineage:
      - datalake_ciq.listing_purchase_exclusion.id_owner
  sk_similar_paid_house:
    description: House id of the matched prior paid capture.
    lineage:
      - datalake_ciq.listing_purchase_exclusion.id_similar_paid_house
  sk_paid_ciq_user:
    description: CIQ user id on the paid capture.
    lineage:
      - datalake_ciq.listing_purchase_exclusion.id_paid_ciq_user
  sk_paid_owner:
    description: Owner user id on the paid capture.
    lineage:
      - datalake_ciq.listing_purchase_exclusion.id_paid_owner
  sk_paid_contract:
    description: Contract id on the paid capture.
    lineage:
      - datalake_ciq.listing_purchase_exclusion.id_paid_contract
  sk_accounting_entry:
    description: Accounting entry id on the paid capture.
    lineage:
      - datalake_ciq.listing_purchase_exclusion.id_accounting_entry
  sk_atlas_duplicity:
    description: Atlas duplicity id when applicable.
    lineage:
      - datalake_ciq.listing_purchase_exclusion.id_atlas_duplicity
  sk_address_parsed_duplicity:
    description: Address-parsed duplicity key when applicable.
    lineage:
      - datalake_ciq.listing_purchase_exclusion.id_address_parsed_duplicity
  total_days_since_house_inactived:
    description: Inactive days on the paid row at match time.
    lineage:
      - datalake_ciq.listing_purchase_exclusion.total_days_since_house_inactived
  total_days_inactive_since_contract_termination:
    description: Days from paid inactivity start to contract termination on the paid row.
    lineage:
      - datalake_ciq.listing_purchase_exclusion.total_days_inactive_since_contract_termination
  total_days_inactive_since_paid:
    description: Days from paid inactivity start to payment on the paid row.
    lineage:
      - datalake_ciq.listing_purchase_exclusion.total_days_inactive_since_paid
  is_paid_house_inactive:
    description: Whether the paid capture was in qualifying inactive state.
    lineage:
      - datalake_ciq.listing_purchase_exclusion.is_paid_house_inactive
  is_same_ciq:
    description: True when new and paid rows share the same CIQ user.
    lineage:
      - datalake_ciq.listing_purchase_exclusion.is_same_ciq
  is_same_owner:
    description: True when new and paid rows share the same owner (or Atlas same-owner).
    lineage:
      - datalake_ciq.listing_purchase_exclusion.is_same_owner
  is_address_parsed_similar_house:
    description: True when address-parsed duplicity contributed to the match.
    lineage:
      - datalake_ciq.listing_purchase_exclusion.is_address_parsed_similar_house
  is_atlas_similar_house:
    description: True when Atlas property-dedup contributed to the match.
    lineage:
      - datalake_ciq.listing_purchase_exclusion.is_atlas_similar_house
  is_blocked_by_atlas:
    description: True when Atlas marked the similar house with BLOCK action.
    lineage:
      - datalake_ciq.listing_purchase_exclusion.is_blocked_by_atlas
  dt_paid:
    description: Payment date on the paid capture.
    lineage:
      - datalake_ciq.listing_purchase_exclusion.dt_paid
  dt_paid_contract_termination:
    description: Contract termination date on the paid capture.
    lineage:
      - datalake_ciq.listing_purchase_exclusion.dt_paid_contract_termination
  ts_paid_house_inactived:
    description: Inactivity start timestamp on the paid capture.
    lineage:
      - datalake_ciq.listing_purchase_exclusion.ts_paid_house_inactived
  ts_house_registration:
    description: Registration timestamp for the new house.
    lineage:
      - datalake_ciq.listing_purchase_exclusion.ts_house_registration
  ts_paid_house_registration:
    description: Registration timestamp for the paid house.
    lineage:
      - datalake_ciq.listing_purchase_exclusion.ts_paid_house_registration
  ts_load:
    description: Timestamp when this DW row was materialized.
