---
database_name: dw_ciq
table_name: fact_listing_purchase_duplicity
description: >
  DW fact for CIQ listing purchase similar-house duplicity: anchor captures matched to
  address-parsed peers and/or Atlas duplicity, sourced from datalake_ciq.listing_purchase_duplicity.
  Full reload grain keyed by sk_listing_duplicity.
domain: Agents
owner: anne.macedo@quintoandar.com.br
columns:
  sk_listing_duplicity:
    description: Surrogate key for the anchor-to-peer duplicity comparison row.
    lineage:
      - datalake_ciq.listing_purchase_duplicity.id_listing_duplicity
  sk_listing_purchase:
    description: Listing purchase surrogate key on the anchor capture row.
    lineage:
      - datalake_ciq.listing_purchase_duplicity.id_listing_purchase
  sk_house:
    description: House id of the anchor capture row used for comparison.
    lineage:
      - datalake_ciq.listing_purchase_duplicity.id_house
  sk_ciq_user:
    description: CIQ user id on the anchor capture row.
    lineage:
      - datalake_ciq.listing_purchase_duplicity.id_ciq_user
  sk_owner:
    description: Owner user id on the anchor capture row.
    lineage:
      - datalake_ciq.listing_purchase_duplicity.id_owner
  sk_contract:
    description: Contract id on the anchor capture row when present.
    lineage:
      - datalake_ciq.listing_purchase_duplicity.id_contract
  sk_atlas_duplicity:
    description: Atlas duplicity id when property-dedup flagged the anchor house.
    lineage:
      - datalake_ciq.listing_purchase_duplicity.id_atlas_duplicity
  sk_address_parsed_duplicity:
    description: Address-parsed duplicity key shared with peer houses.
    lineage:
      - datalake_ciq.listing_purchase_duplicity.id_address_parsed_duplicity
  sk_similar_listing_purchase:
    description: Listing purchase surrogate key on the matched peer row.
    lineage:
      - datalake_ciq.listing_purchase_duplicity.id_similar_listing_purchase
  sk_similar_house:
    description: House id of the address-parsed peer with earlier first_listing_order.
    lineage:
      - datalake_ciq.listing_purchase_duplicity.id_similar_house
  sk_similar_house_ciq_user:
    description: CIQ user id on the matched peer row.
    lineage:
      - datalake_ciq.listing_purchase_duplicity.id_similar_house_ciq_user
  sk_similar_house_owner:
    description: Owner user id on the matched peer row.
    lineage:
      - datalake_ciq.listing_purchase_duplicity.id_similar_house_owner
  sk_similar_contract:
    description: Contract id on the matched peer row when present.
    lineage:
      - datalake_ciq.listing_purchase_duplicity.id_similar_contract
  similar_house_listing_status:
    description: Listing status on the matched peer row.
    lineage:
      - datalake_ciq.listing_purchase_duplicity.similar_house_listing_status
  similar_house_consultant_type:
    description: Consultant type on the matched peer row (for example CIQ_FULL).
    lineage:
      - datalake_ciq.listing_purchase_duplicity.similar_house_consultant_type
  similar_house_business_context:
    description: Business context on the matched peer row (for example RENT).
    lineage:
      - datalake_ciq.listing_purchase_duplicity.similar_house_business_context
  atlas_duplicity_action:
    description: Atlas rules-engine action on the anchor row (BLOCK, ALERT, or ALLOW).
    lineage:
      - datalake_ciq.listing_purchase_duplicity.atlas_duplicity_action
  atlas_duplicity_reason:
    description: Atlas deduplication rule name that fired on the anchor row.
    lineage:
      - datalake_ciq.listing_purchase_duplicity.atlas_duplicity_reason
  total_days_since_house_inactived:
    description: Inactive listing-version days on the matched peer row.
    lineage:
      - datalake_ciq.listing_purchase_duplicity.total_days_since_house_inactived
  is_similiar_house_inactive:
    description: True when the matched peer row is in qualifying inactive listing state.
    lineage:
      - datalake_ciq.listing_purchase_duplicity.is_similiar_house_inactive
  is_similiar_house_paid:
    description: True when the matched peer row has a Robin Hood payment occurrence.
    lineage:
      - datalake_ciq.listing_purchase_duplicity.is_similiar_house_paid
  is_same_ciq:
    description: True when anchor and peer rows share the same CIQ user id.
    lineage:
      - datalake_ciq.listing_purchase_duplicity.is_same_ciq
  is_same_owner:
    description: True when anchor and peer share the same owner id or Atlas same-owner flag.
    lineage:
      - datalake_ciq.listing_purchase_duplicity.is_same_owner
  is_address_parsed_duplicity:
    description: True when an address-parsed peer match exists for the anchor row.
    lineage:
      - datalake_ciq.listing_purchase_duplicity.is_address_parsed_duplicity
  is_atlas_atlas_duplicity:
    description: True when an Atlas duplicity row exists on the anchor house.
    lineage:
      - datalake_ciq.listing_purchase_duplicity.is_atlas_atlas_duplicity
  is_publication_blocked_by_atlas:
    description: True when Atlas action_type is BLOCK on the anchor duplicity row.
    lineage:
      - datalake_ciq.listing_purchase_duplicity.is_publication_blocked_by_atlas
  has_similiar_house_republication:
    description: True when the matched peer row has a later republication listing version.
    lineage:
      - datalake_ciq.listing_purchase_duplicity.has_similiar_house_republication
  dt_similiar_house_paid:
    description: Payment date on the matched peer row when paid.
    lineage:
      - datalake_ciq.listing_purchase_duplicity.dt_similiar_house_paid
  dt_similiar_house_contract_termination:
    description: Contract termination date on the matched peer row when present.
    lineage:
      - datalake_ciq.listing_purchase_duplicity.dt_similiar_house_contract_termination
  ts_similiar_house_contract_signed:
    description: Contract signature timestamp on the matched peer row.
    lineage:
      - datalake_ciq.listing_purchase_duplicity.ts_similiar_house_contract_signed
  ts_similiar_house_inactived:
    description: Inactivity start timestamp on the matched peer row when inactive.
    lineage:
      - datalake_ciq.listing_purchase_duplicity.ts_similiar_house_inactived
  ts_house_registration:
    description: CIQ agency registration timestamp for the anchor house row.
    lineage:
      - datalake_ciq.listing_purchase_duplicity.ts_house_registration
  ts_similiar_house_registration:
    description: CIQ agency registration timestamp for the matched peer house row.
    lineage:
      - datalake_ciq.listing_purchase_duplicity.ts_similiar_house_registration
  ts_load:
    description: Timestamp when this DW row was materialized.
