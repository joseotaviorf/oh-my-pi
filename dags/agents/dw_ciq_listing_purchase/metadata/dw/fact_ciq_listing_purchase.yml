---
database_name: dw_ciq
table_name: fact_ciq_listing_purchase
description: >
  Fact for CIQ_FULL and PRO_ACQUIRER (Embaixador) rent listing-purchase rows plus SALE-context
  duplicity rows, joining ciq_listing_purchase with listing_purchase_pricing for acquisition tiers.
  Full enrich snapshot merged on sk_listing_purchase; matched unpaid rows always refresh, and paid
  rows refresh when portfolio-loss fields change (CCV after payment is a valid loss case). Filter
  business_context and consultant_type in downstream queries when only one population should be paid.
domain: Agents
owner: anne.macedo@quintoandar.com.br
columns:
  sk_listing_purchase:
    description: Listing purchase surrogate key on the anchor capture row.
    lineage:
      - datalake_ciq.ciq_listing_purchase.id_listing_purchase
  sk_listing_duplicity:
    description: >
      Surrogate key that links this purchase to dw_ciq.fact_listing_purchase_duplicity when a
      similar house was found by address parse or when an Atlas property-deduplication paid flow
      matched; use that fact for peer-house and duplicity detail columns. Null when neither signal
      produced a duplicity row on the pricing enrich.
    lineage:
      - datalake_ciq.listing_purchase_pricing.id_listing_duplicity
  sk_house:
    description: House surrogate key.
    lineage:
      - datalake_ciq.ciq_listing_purchase.id_house
  sk_house_listing:
    description: House listing surrogate key.
    lineage:
      - datalake_ciq.ciq_listing_purchase.id_house_listing
  sk_previous_listing_paid:
    description: >
      Listing-purchase surrogate key of the most recent prior rent capture on the same house that
      is already paid in Robin Hood (1p-portfolio-purchase). Used to avoid paying Compra de
      Carteira twice on the same property. Null when no prior paid capture exists.
    lineage:
      - datalake_ciq.listing_purchase_pricing.id_previous_listing_paid
  sk_similar_house_paid:
    description: >
      House surrogate key of another house with a similar address that was already purchased
      (paid) in a prior listing-purchase capture; used to avoid buying the same property again.
      Null when no paid similar-address peer was attached on the pricing enrich.
    lineage:
      - datalake_ciq.listing_purchase_pricing.id_similar_house_paid
  sk_contract:
    description: Rent contract surrogate key; NULL on SALE duplicity rows.
    lineage:
      - datalake_ciq.ciq_listing_purchase.id_contract
  sk_offer:
    description: Sale offer surrogate key for SALE duplicity rows; NULL on RENT payment rows.
    lineage:
      - datalake_ciq.ciq_listing_purchase.id_offer
  sk_accounting_entry:
    description: Robin Hood accounting entry id when paid; null while pending.
    lineage:
      - datalake_ciq.ciq_listing_purchase.id_accounting_entry
  sk_partner:
    description: CIQ partner surrogate key.
    lineage:
      - datalake_ciq.ciq_listing_purchase.id_partner
  sk_user:
    description: CIQ user surrogate key (id_ciq_user in enrich).
    lineage:
      - datalake_ciq.ciq_listing_purchase.id_ciq_user
  sk_enrollment:
    description: Enrollment surrogate key from house consultant history.
    lineage:
      - datalake_ciq.ciq_listing_purchase.id_enrollment
  sk_owner:
    description: Owner user surrogate key.
    lineage:
      - datalake_ciq.ciq_listing_purchase.id_owner
  sk_address_parsed_duplicity:
    description: Parsed address duplicity key from listing deduplication.
    lineage:
      - datalake_ciq.ciq_listing_purchase.id_address_parsed_duplicity
  sk_atlas_duplicity:
    description: Atlas property-dedup duplicity id when present.
    lineage:
      - datalake_ciq.ciq_listing_purchase.id_atlas_duplicity
  city_name:
    description: Normalized city name for regional pricing rules.
    lineage:
      - datalake_ciq.ciq_listing_purchase.city_name
  city_group:
    description: Commercial city group for ongoing-rentals segmentation.
    lineage:
      - datalake_ciq.ciq_listing_purchase.city_group
  supply_source:
    description: Rent supply funnel origin label at funnel step six.
    lineage:
      - datalake_ciq.ciq_listing_purchase.supply_source
  consultant_type:
    description: >
      House consultant type at capture (CIQ_FULL or PRO_ACQUIRER for Embaixadores); use to segment
      who receives listing-purchase payment in downstream reports.
    lineage:
      - datalake_ciq.ciq_listing_purchase.consultant_type
  listing_status:
    description: Listing status from house listing or business context.
    lineage:
      - datalake_ciq.ciq_listing_purchase.listing_status
  listing_category:
    description: Rent listing version category passed through from enrich for relist identification.
    lineage:
      - datalake_ciq.ciq_listing_purchase.listing_category
  contract_status:
    description: Contract status from core contract.
    lineage:
      - datalake_ciq.ciq_listing_purchase.contract_status
  payment_status:
    description: >
      Final payment lifecycle from listing_purchase_pricing (not-eligible, paid, or pending), computed
      after the acquisition and duplicity rules are applied on top of the initial pricing segment.
    lineage:
      - datalake_ciq.listing_purchase_pricing.payment_status
  pricing_type:
    description: >
      Final commercial pricing segment prefix from listing_purchase_pricing, after previous-paid-listing
      and similar-house duplicity rules are applied on top of initial_pricing_type.
    lineage:
      - datalake_ciq.listing_purchase_pricing.pricing_type
  pricing_type_reason:
    description: >
      Full human-readable final pricing segment explanation from listing_purchase_pricing, after
      previous-paid-listing and similar-house duplicity rules are applied on top of
      initial_pricing_type_reason.
    lineage:
      - datalake_ciq.listing_purchase_pricing.pricing_type_reason
  acquisition_type:
    description: Acquisition price bucket (full-price, reduced-price, or not-eligible).
    lineage:
      - datalake_ciq.listing_purchase_pricing.acquisition_type
  acquisition_type_reason:
    description: Human-readable acquisition outcome combining pricing and duplicity signals.
    lineage:
      - datalake_ciq.listing_purchase_pricing.acquisition_type_reason
  acquisition_type_resume_pt:
    description: >
      Partner-facing Portuguese summary for Compra de Carteira reports. Prefix from
      acquisition_type ([Preço cheio], [Preço reduzido], [Não elegível]) plus translated
      acquisition_type_reason; unknown English reasons are kept as-is after the prefix.
    lineage:
      - datalake_ciq.listing_purchase_pricing.acquisition_type
      - datalake_ciq.listing_purchase_pricing.acquisition_type_reason
  purchase_value:
    description: Reference listing-purchase amount in BRL from acquisition_type tiers.
    lineage:
      - datalake_ciq.listing_purchase_pricing.purchase_value
  amount_paid:
    description: Paid amount from enrich when Robin Hood matches.
    lineage:
      - datalake_ciq.ciq_listing_purchase.amount_paid
  total_days_since_house_inactived:
    description: Inactive listing-version days when in qualifying inactive state.
    lineage:
      - datalake_ciq.ciq_listing_purchase.total_days_since_house_inactived
  total_days_since_publish:
    description: Calendar days since listing version publication (ts_publicated) from enrich.
    lineage:
      - datalake_ciq.ciq_listing_purchase.total_days_since_publish
  has_similiar_house_by_address_parsed:
    description: True when address-parsed deduplication flags duplicates for the house.
    lineage:
      - datalake_ciq.ciq_listing_purchase.has_similiar_house_by_address_parsed
  has_similiar_house_by_atlas:
    description: True when an Atlas house deduplication row exists for the house.
    lineage:
      - datalake_ciq.ciq_listing_purchase.has_similiar_house_by_atlas
  has_republication:
    description: True when a later house listing version exists after the current one.
    lineage:
      - datalake_ciq.ciq_listing_purchase.has_republication
  is_first_contract_signed_by_house:
    description: True when this listing version is the first signed contract on the house.
    lineage:
      - datalake_ciq.ciq_listing_purchase.is_first_contract_signed_by_house
  is_last_house_listing:
    description: True when this row is the last house listing version on the house.
    lineage:
      - datalake_ciq.ciq_listing_purchase.is_last_house_listing
  is_house_inactive:
    description: True when the listing version is in qualifying inactive state.
    lineage:
      - datalake_ciq.ciq_listing_purchase.is_house_inactive
  portfolio_loss_reason:
    description: >
      Which portfolio-loss rule fired for this row. Null when is_portfolio_loss is false.
      Values: relisting_without_contract_90d (Re-Listing still published without rent contract
      for more than 90 days since publish); ccv_after_post_july_rent_cs (rent CS on/after
      2026-07-01 compra de carteira era and a later non-canceled CCV on the same house).
      Rules are mutually exclusive on one row (90d needs null CS; CCV needs CS).
    categories:
      relisting_without_contract_90d: >
        Re-Listing still published without a signed rent contract and more than 90 days since publish.
      ccv_after_post_july_rent_cs: >
        Rent contract signed on or after 2026-07-01 and a later non-canceled sale agreement (CCV)
        on the same house.
    lineage:
      - datalake_ciq.ciq_listing_purchase.listing_category
      - datalake_ciq.ciq_listing_purchase.listing_status
      - datalake_ciq.ciq_listing_purchase.ts_contract_signed
      - datalake_ciq.ciq_listing_purchase.total_days_since_publish
      - datalake_sale_offer.sale_offer.ts_sale_agreement_signed
      - datalake_sale_offer.sale_offer.is_ccv_canceled
  is_portfolio_loss:
    description: >
      True when any CIQ portfolio-loss rule applies: (1) Re-Listing still published
      (listing_status PUBLISHED or PUBLICADO) without a signed rent contract and
      total_days_since_publish exceeds 90 days; or (2) this row's rent CS is on or after
      2026-07-01 (compra de carteira era) and the same house has a later non-canceled signed
      sale agreement (CCV). Pre-July CS with a later CCV is not loss. See portfolio_loss_reason
      for which rule fired. Rules are mutually exclusive on one row.
    lineage:
      - datalake_ciq.ciq_listing_purchase.listing_category
      - datalake_ciq.ciq_listing_purchase.listing_status
      - datalake_ciq.ciq_listing_purchase.ts_contract_signed
      - datalake_ciq.ciq_listing_purchase.total_days_since_publish
      - datalake_sale_offer.sale_offer.ts_sale_agreement_signed
      - datalake_sale_offer.sale_offer.is_ccv_canceled
  is_eligible:
    description: >
      True when the final pricing_type from listing_purchase_pricing is not not-eligible, after both
      the initial transition rules and the acquisition/duplicity rules are applied.
    lineage:
      - datalake_ciq.listing_purchase_pricing.is_eligible
  is_paid:
    description: Payment presence flag from enrich.
    lineage:
      - datalake_ciq.ciq_listing_purchase.is_paid
  dt_paid:
    description: Payment date from enrich.
    lineage:
      - datalake_ciq.ciq_listing_purchase.dt_paid
  ts_contract_signed:
    description: Contract signature timestamp from enrich.
    lineage:
      - datalake_ciq.ciq_listing_purchase.ts_contract_signed
  ts_contract_signed_local_tz:
    description: >
      Contract signature in America/Sao_Paulo; aligns with transition and portfolio-loss rules that
      compare calendar dates on or after 2026-07-01 in local time.
    lineage:
      - datalake_ciq.ciq_listing_purchase.ts_contract_signed_local_tz
  ts_next_contract_signed:
    description: Next contract signature timestamp on the same house when present.
    lineage:
      - datalake_ciq.ciq_listing_purchase.ts_next_contract_signed
  ts_previous_contract_signed:
    description: Previous contract signature timestamp on the same house when present.
    lineage:
      - datalake_ciq.ciq_listing_purchase.ts_previous_contract_signed
  ts_publicated:
    description: Publication timestamp of this listing version from enrich (relist publish anchor).
    lineage:
      - datalake_ciq.ciq_listing_purchase.ts_publicated
  ts_house_inactived:
    description: Listing version start when inactive; null when the listing is active.
    lineage:
      - datalake_ciq.ciq_listing_purchase.ts_house_inactived
  ts_house_registration:
    description: CIQ agency registration timestamp for the house.
    lineage:
      - datalake_ciq.ciq_listing_purchase.ts_house_registration
  ts_first_listing:
    description: First publication timestamp from listing business context.
    lineage:
      - datalake_ciq.ciq_listing_purchase.ts_first_listing
  ts_first_listing_local_tz:
    description: >
      First rent publication in America/Sao_Paulo; audit reference for compra de carteira pricing
      transition (same source as initial_pricing_type publication cutover).
    lineage:
      - datalake_ciq.ciq_listing_purchase.ts_first_listing_local_tz
  ts_load:
    description: Timestamp when this DW row was materialized.
  year:
    description: Partition year passed through from enrich.
    lineage:
      - datalake_ciq.ciq_listing_purchase.year
  month:
    description: Partition month passed through from enrich.
    lineage:
      - datalake_ciq.ciq_listing_purchase.month
  day:
    description: Partition day passed through from enrich.
    lineage:
      - datalake_ciq.ciq_listing_purchase.day
