dag:
  name: dw_ciq_listing_purchase
  owner: Data Agents
  documentation:
      dag_purpose: Dimensional modeling of CIQ listing purchase data.
workflow:
  type: query_delta
  layer: dw
  custom_schema: ciq
  tables_customization:
    fact_ciq_listing_purchase:
      merge_on: [sk_listing_purchase]
      partitions: [year, month, day]
      # Unpaid rows always refresh. Paid rows refresh only when portfolio-loss fields change
      # (CCV can land after payment under the post-July CS + later CCV rule).
      when_matched_update_condition: >-
        NOT COALESCE(target.is_paid, FALSE)
        OR COALESCE(target.is_portfolio_loss, FALSE) <> COALESCE(source.is_portfolio_loss, FALSE)
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_end | ds, 'load_end_date') }}"
