dag:
  name: dw_ciq_listing_purchase
  owner: Data Agents
  documentation:
      dag_purpose: Dimensional modeling of CIQ listing purchase data.
workflow:
  type: query_delta
  layer: dw
  custom_schema: ciq
  tables_customization:
    fact_ciq_listing_purchase:
      merge_on: [sk_listing_purchase]
      partitions: [ts_updated]
      extraction_type: incremental
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_end | ds, 'load_end_date') }}"
