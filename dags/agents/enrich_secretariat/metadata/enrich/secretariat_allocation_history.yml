---
database_name: datalake_hub_services
table_name: secretariat_allocation_history
description: Table that shows the history of allocation of a secretariat to its team.
domain: Agents
owner: gustavo.rompe@quintoandar.com.br
columns:
  id_secretariat_user:
    lineage:
      - datalake_hub_services.users.id_main_user
    description: ID of the 5a user that is a secretariat.
  id_supervisor_user:
    lineage:
      - datalake_hub_services.users.id_main_user
    description: ID of the 5a user that is the supervisor of the secretariat.
  id_business_unit:
    lineage:
      - datalake_hub_services.member_profile.id_business_unit
    description: HubServices business unit identifier tying the secretariat to a hub team allocation during this relationship period.
  secretariat_name:
    lineage:
      - datalake_hub_services.users.name
    description: Display name of the secretariat user during the allocation interval, sourced from HubServices users.
  secretariat_email:
    lineage:
      - datalake_hub_services.users.email
    description: Email address of the secretariat.
  supervisor_name:
    lineage:
      - datalake_hub_services.users.name
    description: Name of the supervisor responsible for the secretariat.
  supervisor_email:
    lineage:
      - datalake_hub_services.users.email
    description: Email address of the supervisor.
  allocation:
    lineage:
      - datalake_hub_services_clean.business_unit.hub_name
    description: Name of the allocation of the secretariat.
  segment:
    description: Normalized secretariat team segment derived from hub allocation (for example HUB, Growth, 3P, NBP, or Aquisição ForSale).
  profile:
    lineage:
      - datalake_hub_services.member_profile.profile
    description: Name of the profile of the secretariat.
  business_context:
    lineage:
      - datalake_hub_services_clean.business_unit.business_context
    description: Sale or rent operating context of the business unit linked to the secretariat member profile.
  version:
    description: Version of the row. A new version is generated every time the allocation of the secretariat is changed.
  ts_allocation_started:
    lineage:
      - datalake_hub_services.member_profile.ts_relationship_started
    description: Timestamp of the start of the allocation of the secretariat.
  ts_allocation_ended:
    lineage:
      - datalake_hub_services.member_profile.ts_relationship_ended
    description: Timestamp of the end of the allocation of the secretariat. Null if the secretariat is still allocated.