---
database_name: datalake_secretariat
table_name: secretariat_allocation_history
description: |
  History of secretariat team allocations with supervisor, hub, segment, and active-state attributes.
  Each row is one allocation interval per secretariat user; is_last_version flags the current snapshot
  used by downstream models that previously read secretariat_hierarchy.
domain: Agents
owner: gustavo.rompe@quintoandar.com.br
columns:
  id_secretariat_user_version:
    description: |
      Surrogate key for the allocation interval, derived from id_secretariat_user and the ordered
      allocation version within that user history.
    lineage:
      - datalake_hub_services.member_profile.id_main_user
  id_secretariat_user:
    lineage:
      - datalake_hub_services.member_profile.id_main_user
      - datalake_gsheets_clean.secretariat_hierarchy.id_user_5a
    description: QuintoAndar user identifier (EBDB/main) for the secretariat team member.
  id_supervisor_user:
    lineage:
      - datalake_hub_services.member_profile.id_parent_main_user
    description: QuintoAndar user identifier of the supervisor linked to the secretariat in this interval.
  id_business_unit:
    lineage:
      - datalake_hub_services.member_profile.id_business_unit
    description: Hub Services business unit identifier for the secretariat allocation interval.
  secretariat_name:
    lineage:
      - datalake_hub_services.member_profile.name
      - datalake_gsheets_clean.secretariat_hierarchy.secretariat_name
    description: Display name of the secretariat during the allocation interval.
  secretariat_email:
    lineage:
      - datalake_hub_services.member_profile.email
      - datalake_gsheets_clean.secretariat_hierarchy.email
    description: Email address of the secretariat during the allocation interval.
  supervisor_name:
    lineage:
      - datalake_hub_services.member_profile.parent_name
    description: Name of the supervisor responsible for the secretariat in this interval.
  supervisor_email:
    lineage:
      - datalake_hub_services.member_profile.parent_email
    description: Email address of the supervisor in this interval.
  allocation:
    lineage:
      - datalake_hub_services.member_profile.hub_name
      - datalake_gsheets_clean.secretariat_hierarchy.allocation
    description: Hub or team name where the secretariat was allocated in this interval.
  segment:
    description: Normalized secretariat team segment derived from allocation (for example HUB, Growth, or Aquisição ForSale).
  profile:
    lineage:
      - datalake_hub_services.member_profile.profile
    description: Hub Services member profile role assigned to the secretariat in this interval.
  business_context:
    lineage:
      - datalake_hub_services.member_profile.business_context
    description: Sale or rent operating context of the business unit in this interval.
  version:
    description: Sequential allocation version for the secretariat user, ordered by allocation start and end timestamps.
  is_last_version:
    description: True when the row is the latest allocation interval for the secretariat user.
  is_active:
    lineage:
      - datalake_hub_services_clean.member_profile.is_active
      - datalake_gsheets_clean.secretariat_hierarchy.status
    description: Whether the secretariat member profile is active in Hub Services for this interval.
  ts_allocation_started:
    lineage:
      - datalake_hub_services.member_profile.ts_relationship_started
      - datalake_gsheets_clean.secretariat_hierarchy.dt_started
    description: Timestamp when the secretariat allocation interval started.
  ts_allocation_ended:
    lineage:
      - datalake_hub_services.member_profile.ts_relationship_ended
    description: Timestamp when the allocation interval ended. Null when the allocation is still open.
