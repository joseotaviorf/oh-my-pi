---
database_name: datalake_secretariat
table_name: daily_secretariat_allocation
description: |
  Daily snapshot of which secretariat allocation version was effective for each secretariat user on each
  calendar date, derived from secretariat_allocation_history and aux_date.
domain: Agents
owner: gustavo.rompe@quintoandar.com.br
columns:
  id_secretariat_user_version:
    description: Surrogate key of the effective allocation version on the snapshot date.
    lineage:
      - datalake_secretariat.secretariat_allocation_history.id_secretariat_user_version
  id_secretariat_user:
    lineage:
      - datalake_secretariat.secretariat_allocation_history.id_secretariat_user
    description: QuintoAndar user identifier (EBDB/main) for the secretariat team member.
  version:
    lineage:
      - datalake_secretariat.secretariat_allocation_history.version
    description: Allocation version number effective on the snapshot date.
  dt_snapshot:
    lineage:
      - datalake_quintoandar.aux_date.date
    description: Calendar date for which the secretariat allocation version is materialized.
