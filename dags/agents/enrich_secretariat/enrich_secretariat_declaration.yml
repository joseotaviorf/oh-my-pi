---
dag:
  name: enrich_secretariat
  schedule_start_date: 2022, 7, 22
  owner: Data Agents
  documentation:
    dag_purpose: |
      Enriched secretariat layer: allocation history (with current-state flag),
      daily allocation snapshots, and buyer secretariat changes.
      Tables are materialized in datalake_secretariat.
workflow:
  type: query_delta
  layer: enrich
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  inner_dependencies:
    daily_secretariat_allocation:
      - secretariat_allocation_history
  tables_customization:
    buyer_secretariat_changes:
      custom_schema: secretariat
    daily_secretariat_allocation:
      partitions: [dt_snapshot]
      extraction_type: incremental
      custom_schema: secretariat
    secretariat_allocation_history:
      custom_schema: secretariat
