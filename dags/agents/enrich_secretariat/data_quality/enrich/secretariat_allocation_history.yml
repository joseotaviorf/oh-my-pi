---
table_name: datalake_secretariat.secretariat_allocation_history
alert_channel: "#agents-data-alarms"
table_level_validations:
  has_size:
    greater_than: 1000
    severity_level: Error
column_level_validations:
  id_secretariat_user_version:
    is_complete:
      severity_level: Error
    is_unique:
      severity_level: Error
  id_secretariat_user:
    is_complete:
      severity_level: Error
  version:
    is_complete:
      severity_level: Error
  is_last_version:
    is_complete:
      severity_level: Error
  ts_allocation_started:
    is_complete:
      severity_level: Error
