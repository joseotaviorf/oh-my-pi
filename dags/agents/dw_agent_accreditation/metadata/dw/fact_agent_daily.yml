---
database_name: dw_agent
table_name: fact_agent_daily
domain: Agents
owner: anne.macedo@quintoandar.com.br
description: |
  Daily snapshot fact table with one row per agent per reference date. Expands each agent
  accreditation window from agent_history, enriches activation lifecycle flags from
  accreditation events, resolves demand conversion tiers for active agents, and projects
  profile attributes from agent_product. Consumed by Agents squad analytics for
  point-in-time agent capability and accreditation monitoring.
columns:
  sk_agent_daily:
    description: |
      Primary key of the table. Built as XXHASH64 of unified agent identifier and reference
      date from agent_history, uniquely identifying each agent-day snapshot row.
    lineage:
      - datalake_agent_accreditation.agent_history.id_snapshot
  sk_person:
    description: Person surrogate key from the unified agent identity registry.
    lineage:
      - datalake_ebdb_agent_events.agent_unified_identity.sk_person
  sk_agent:
    description: Natural key of the agent in the source transactional system.
    lineage:
      - datalake_ebdb_agent_events.agent_unified_identity.id_agent
  sk_agent_data:
    description: Dados Agente identifier from unified identity when type is DADOS_AGENTE_ID.
    lineage:
      - datalake_ebdb_agent_events.agent_unified_identity.id_agent_data
  sk_partner:
    description: Partner identifier from unified identity when type is PARTNER_ID.
    lineage:
      - datalake_ebdb_agent_events.agent_unified_identity.id_partner
  sk_user:
    description: Main application user id linked to the agent via person UUID and main credential reference.
    lineage:
      - datalake_ebdb_agent_events.agent_unified_identity.id_user
  sk_broker:
    description: |
      Surrogate key of the imobiliária (broker agency) resolved on unified identity for 3P
      agents. Returns -1 when no broker linkage exists.
    lineage:
      - datalake_ebdb_agent_events.agent_unified_identity.sk_broker
  sk_tier_demand_conversion_fr:
    description: |
      Tier identifier for the for rent demand conversion incentive system. Populated only
      when agent_history.is_active is TRUE on the reference date.
    lineage:
      - datalake_big_agent.partner_tier.id_tier
  sk_tier_demand_conversion_fs:
    description: |
      Tier identifier for the for sale demand conversion incentive system. Populated only
      when agent_history.is_active is TRUE on the reference date.
    lineage:
      - datalake_big_agent.partner_tier.id_tier
  profile:
    description: |
      Agent company product profile name from the latest agent_product row for the agent
      (is_lastest_valid).
    lineage:
      - datalake_ebdb_agent_events.agent_product.product_name
  is_agent_active:
    description: |
      True when the agent is in an active accreditation status window on the reference date,
      propagated from agent_history.is_active (accreditation event-segment grain).
    lineage:
      - datalake_agent_accreditation.agent_history.is_active
  is_reactivated:
    description: |
      True on reference dates with an accreditation event when the agent is active and the
      date is not the first ACTIVATED event. Null when no accreditation event occurred that day.
    lineage:
      - datalake_agent_accreditation.agent_history.is_active
      - datalake_ebdb_agent_events.agent_accreditation_events.ts_created
  is_first_activation:
    description: |
      True on reference dates with an accreditation event when the agent is active and the
      date matches the first ACTIVATED event. Null when no accreditation event occurred that day.
    lineage:
      - datalake_agent_accreditation.agent_history.is_active
      - datalake_ebdb_agent_events.agent_accreditation_events.ts_created
  is_deaccredited:
    description: |
      True when an AGENT_DEACCREDITATION event occurred on the reference date. Null when no
      accreditation event occurred that day.
    lineage:
      - datalake_ebdb_agent_events.agent_accreditation_events.event_reason
  is_legacy_agent_migrated:
    description: |
      True when a legacy agent migration event occurred on the reference date. Null when no
      accreditation event occurred that day.
    lineage:
      - datalake_ebdb_agent_events.agent_accreditation_events.event_reason
  is_agent_reenrolled:
    description: |
      True when an inactive legacy agent reenrollment event occurred on the reference date.
      Null when no accreditation event occurred that day.
    lineage:
      - datalake_ebdb_agent_events.agent_accreditation_events.event_reason
  is_passive_lead_receiver:
    description: True when the agent is configured to receive passive leads on the reference date.
    lineage:
      - datalake_agent_accreditation.agent_history.is_passive_lead_receiver
  is_allow_demand_acquisition:
    description: True when demand acquisition capability was enabled on the reference date.
    lineage:
      - datalake_agent_accreditation.agent_history.is_allow_demand_acquisition
  is_allow_demand_visit_management:
    description: True when demand visit management capability was enabled on the reference date.
    lineage:
      - datalake_agent_accreditation.agent_history.is_allow_demand_visit_management
  is_allow_demand_sale:
    description: True when the agent is allowed to perform demand sale on the reference date.
    lineage:
      - datalake_agent_accreditation.agent_history.is_allow_demand_sale
  is_allow_demand_rent:
    description: True when the agent is allowed to perform demand rent on the reference date.
    lineage:
      - datalake_agent_accreditation.agent_history.is_allow_demand_rent
  is_allow_supply_acquisition:
    description: True when supply acquisition capability was enabled on the reference date.
    lineage:
      - datalake_agent_accreditation.agent_history.is_allow_supply_acquisition
  is_allow_supply_conversion_consultancy:
    description: True when supply conversion consultancy capability was enabled on the reference date.
    lineage:
      - datalake_agent_accreditation.agent_history.is_allow_supply_conversion_consultancy
  is_allow_supply_representative:
    description: True when supply representative capability was enabled on the reference date.
    lineage:
      - datalake_agent_accreditation.agent_history.is_allow_supply_representative
  is_allow_supply_midia_management:
    description: True when supply media management capability was enabled on the reference date.
    lineage:
      - datalake_agent_accreditation.agent_history.is_allow_supply_midia_management
  is_allow_supply_integrity_assurance:
    description: True when supply integrity assurance capability was enabled on the reference date.
    lineage:
      - datalake_agent_accreditation.agent_history.is_allow_supply_integrity_assurance
  is_allow_negociation:
    description: True when negotiation capability was enabled on the reference date.
    lineage:
      - datalake_agent_accreditation.agent_history.is_allow_negociation
  is_1p_partnership:
    description: True when affiliation type is autonomous (1P-style partnership flag) on the reference date.
    lineage:
      - datalake_ebdb_agent_events.agent_unified_identity.is_1p_partnership
  is_3p_partnership:
    description: True when affiliation type is company-managed (3P-style partnership flag) on the reference date.
    lineage:
      - datalake_ebdb_agent_events.agent_unified_identity.is_3p_partnership
  has_rent_lead_referral:
    description: |
      True when the agent has at least one tenant lead referral invite on the reference date
      (Traz Quem Aluga program).
    lineage:
      - datalake_agent_accreditation.agent_history.has_rent_lead_referral
  has_rent_lead_referral_confirmed:
    description: |
      True when the agent has at least one confirmed tenant lead referral invite on the
      reference date (Traz Quem Aluga program).
    lineage:
      - datalake_agent_accreditation.agent_history.has_rent_lead_referral_confirmed
  has_sale_lead_referral:
    description: |
      True when the agent has at least one buyer lead referral invite on the reference date
      (Traz Quem Compra program).
    lineage:
      - datalake_agent_accreditation.agent_history.has_sale_lead_referral
  has_sale_lead_referral_confirmed:
    description: |
      True when the agent has at least one confirmed buyer lead referral invite on the
      reference date (Traz Quem Compra program).
    lineage:
      - datalake_agent_accreditation.agent_history.has_sale_lead_referral_confirmed
  dt_reference:
    description: Reference calendar date of the daily snapshot. Joinable with dw_public.dim_date.
    lineage:
      - datalake_agent_accreditation.agent_history.dt_reference
  year:
    description: Year partition derived from dt_reference.
    lineage:
      - datalake_agent_accreditation.agent_history.dt_reference
  month:
    description: Month partition derived from dt_reference.
    lineage:
      - datalake_agent_accreditation.agent_history.dt_reference
  day:
    description: Day partition derived from dt_reference.
    lineage:
      - datalake_agent_accreditation.agent_history.dt_reference
