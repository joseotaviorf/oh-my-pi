---
table_name: dw_agent.dim_prospect_agent
alert_channel: "#agents-data-alarms"
table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error
column_level_validations:
  sk_prospect_agent:
    is_unique:
      severity_level: Error
    is_complete:
      severity_level: Error
  uuid_prospect:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Error
  uuid_person:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Error
  status:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Error
