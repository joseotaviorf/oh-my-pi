    is_complete:
      severity_level: Error
    is_unique:
      severity_level: Error
  sk_qualification:
    is_complete:
      severity_level: Error
  sk_prospect_agent:
    is_complete:
      severity_level: Error
  qualification_state:
    is_complete:
      severity_level: Error
