---
dag:
  name: dw_agent_accreditation
  owner: Data Agents
  documentation:
    dag_purpose: |
      DW layer for agent accreditation models. Projects enrich_agent_accreditation tables
      into dimensional and fact tables for analytics consumption.
workflow:
  type: query_delta
  layer: dw
  custom_schema: agent
  default_extraction_type: full
  tables_customization:
    fact_agent_daily:
      extraction_type: incremental
      merge_on: [sk_agent_daily]
      partitions: [year, month, day]
    fact_agent_daily_temp:
      extraction_type: incremental
      merge_on: [sk_agent_daily]
      partitions: [year, month, day]
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
