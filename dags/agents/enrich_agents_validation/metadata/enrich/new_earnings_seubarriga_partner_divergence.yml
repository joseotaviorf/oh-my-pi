---
database_name: datalake_agents_validation
table_name: new_earnings_seubarriga_partner_divergence
description: |
  Validation table that identifies active RENT_CONTRACT earning sources in the current
  competence month whose Big Agent new_earnings SUPPLY_ACQUISITION_FR revenue percentage
  is out of sync with the partner brokerage fee configured for the contract in Seu Barriga
  (Retsuko). Only earning sources with a non-zero revenue share that finished their first
  day of eventual consistency (ts_occurred before the current day) are considered. The
  table is expected to be empty; any row it produces is a divergence.
domain: Agents
owner: data-ae-agents@quintoandar.com.br
columns:
  id_contract:
    description: Identifier of the rent contract, shared by the earning source and the Seu Barriga contract.
    lineage:
      - datalake_big_agent_clean.earning_sources.id_external_domain
      - datalake_retsuko_clean.contract.id_external
  status:
    description: Status of the Big Agent earning source for this contract.
    lineage:
      - datalake_big_agent_clean.earning_sources.status
  incentive_system_earning_percentage:
    description: |
      Sum of SUPPLY_ACQUISITION_FR revenue percentages from Big Agent new_earnings for this
      earning source, formatted as a percentage string. Null when there is no matching
      new_earnings row.
    lineage:
      - datalake_big_agent_clean.new_earnings.revenue_percentage
      - datalake_big_agent_clean.new_earnings.incentive_system
      - datalake_big_agent_clean.new_earnings.status
  seubarriga_percentage:
    description: |
      Seu Barriga (Retsuko) contract partner brokerage fee, formatted as a percentage
      string. Null when there is no matching Seu Barriga contract.
    lineage:
      - datalake_retsuko_clean.contract.adm_partner_brokerage_fee
  dt_competence:
    description: Business competence date of the earning source.
    lineage:
      - datalake_big_agent_clean.earning_sources.dt_competence
  ts_signed:
    description: Timestamp when the underlying earning source event occurred.
    lineage:
      - datalake_big_agent_clean.earning_sources.ts_occurred
  ts_validated:
    description: Timestamp when this validation run produced the row.
