---
database_name: dw_keys_tracking
table_name: dim_agents_with_keys
description: Information related to Agents. Dimension table about key location, agents and listings. Each line is an unique house listing with the related agent.
domain: Agents
owner: gustavo.geiger@quintoandar.com.br
columns:
  sk_house_listing:
    lineage:
      - datalake_ebdb_listing.agents_with_keys.id_house_listing
    description: Unique house version key.
  sk_agent:
    lineage:
      - datalake_ebdb_listing.agents_with_keys.id_agent
    description: ID of an agent related to the house.
  sk_house:
    lineage:
      - datalake_ebdb_listing.agents_with_keys.id_house
    description: House key.
  all_id_agents:
    lineage:
      - datalake_ebdb_listing.agents_with_keys.all_id_agents
    description: All agents IDs.
  days_cs_to_return:
    lineage:
      - datalake_ebdb_listing.agents_with_keys.days_cs_to_return
    description: Days between the contract signed and the return of the key.
  days_publication_to_attribution:
    lineage:
      - datalake_ebdb_listing.agents_with_keys.days_publication_to_attribution
    description: Days between the publication and the attribution of agent with keys.
  has_keys_with_agent_attributed:
    lineage:
      - datalake_ebdb_listing.agents_with_keys.has_keys_with_agent_attributed
    description: Flag to indicate if the agent was attributed.
  has_keys_with_agent_delivered:
    lineage:
      - datalake_ebdb_listing.agents_with_keys.has_keys_with_agent_delivered
    description: Flag to indicate if the keys were delivered to agent.
  has_keys_with_agent_returned:
    lineage:
      - datalake_ebdb_listing.agents_with_keys.has_keys_with_agent_returned
    description: Flag to indicate if the key was returned.
  is_delivered_on_another_listing:
    lineage:
      - datalake_ebdb_listing.agents_with_keys.is_delivered_on_another_listing
    description: Flag to indicate if the key was delivered to another address.
  is_keys_with_agent_eligible:
    lineage:
      - datalake_ebdb_listing.agents_with_keys.is_keys_with_agent_eligible
    description: Indicates if the house is able to agents with keys.
  is_keys_with_agent_opt_in:
    lineage:
      - datalake_ebdb_listing.agents_with_keys.is_keys_with_agent_opt_in
    description: Flag to indicate if the key was with agent opt in.
  is_fss:
    lineage:
      - datalake_ebdb_listing.agents_with_keys.is_fss
    description: If the user related to the house is the same as the user that registered it in our systems, then true (Full Self Service).
  is_returned_on_time:
    lineage:
      - datalake_ebdb_listing.agents_with_keys.is_returned_on_time
    description: The difference of time between the contract signed and the return of the keys.
  ts_attributed:
    lineage:
      - datalake_ebdb_listing.agents_with_keys.ts_attributed
    description: Timestamp of when the agent was attributed.
  ts_contract_signed:
    lineage:
      - datalake_ebdb_listing.agents_with_keys.ts_contract_signed
    description: Timestamp of when the house contract was signed.
  ts_delivered:
    lineage:
      - datalake_ebdb_listing.agents_with_keys.ts_delivered
    description: Timestamp of when the key was delivered.
  ts_first_vc:
    lineage:
      - dw_public.dim_booking.dt_scheduling
    description: Timestamp of first visit completed.
  ts_first_vc_attributed:
    lineage:
      - dw_public.dim_booking.dt_scheduling
    description: Timestamp of first visit completed after the attribution of agent with keys.
  ts_load:
    description: Timestamp of when this data was loaded.
  ts_optin:
    lineage:
      - datalake_ebdb_listing.agents_with_keys.ts_optin
    description: Timestamp of when the owner has opted for keys with agent.
  ts_publicated:
    lineage:
      - datalake_ebdb_listing.agents_with_keys.ts_publicated
    description: Timestamp of when this listing was publicated.
  ts_returned:
    lineage:
      - datalake_ebdb_listing.agents_with_keys.ts_returned
    description: Timestamp of when the key was returned.
  days_attribution_to_first_vc:
    description: Date difference between the attribution of agent with keys in a house and the first visit completed.
  days_attribution_to_first_vc_agent:
    description: Date difference between the attribution of the program in a house + the first agent and the first visit completed.
  is_delivered_earlier_first_vc_agent:
    description: Flag to indicate if the key was delivered in the day of a first visit completed to the first agent.
  is_delivered_first_vc:
    description: Flag to indicate if the key was delivered before existing a first visit completed.
  is_delivered_first_vc_agent:
    description: Flag to indicate if the key was delivered before existing a first visit completed to the first agent.
