dag:
  name: ebdb_location
  schedule_start_date: 2021, 2, 20
  schedule_interval: 50 21 * * *
  owner: Data Agents
  documentation:
    dag_purpose: Extraction of EBDB tables related to Location into data lake. EBDB is the main database for QuintoAndar.
workflow:
  type: cdc
  layer: raw
  database_type: mysql
  source_database: ebdb
  custom_schema: ebdb
  source_schema: ebdb
  tables_customization:
    Cep:
      clean_table_name: cep
    Country:
      clean_table_name: country
    Estado:
      clean_table_name: state
    Estado_AUD:
      clean_table_name: state_aud
    Local:
      clean_table_name: local
    MapRegiao:
      clean_table_name: map_region
      raw_primary_keys: ["id"]
    Municipio:
      clean_table_name: city
    PoligonoRegiao:
      clean_table_name: polygon_region
    Regiao:
      clean_table_name: region
    Regiao_AUD:
      clean_table_name: region_aud
    Regiao_businessContextsServed:
      clean_table_name: region_business_contexts_served
    Regiao_businessContextsServed_AUD:
      clean_table_name: region_business_contexts_served_aud
    RegionConfig:
      clean_table_name: region_config
cluster:
  type: custom_cluster_with_sedona
  custom_configurations:
    driver_node_type_id: m5a.xlarge
    node_type_id: m5a.xlarge
    num_workers: 3
    spark_version: 12.2.x-scala2.12
    spark_conf:
      spark.serializer: "org.apache.spark.serializer.KryoSerializer"
      spark.sql.extensions: "org.apache.sedona.viz.sql.SedonaVizExtensions,org.apache.sedona.sql.SedonaSqlExtensions"
      spark.kryo.registrator: "org.apache.sedona.core.serde.SedonaKryoRegistrator"
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
  databricks_conn_id: databricks_new
  custom_libraries:
    - maven:
        coordinates: "org.apache.sedona:sedona-python-adapter-3.0_2.12:1.2.1-incubating"
    - maven:
        coordinates: "org.datasyslab:geotools-wrapper:1.1.0-25.2"
    - pypi:
        package: apache-sedona==1.2.1