    description: Validity check performed.
  active_check:
    lineage:
      - datalake_airtable_raw.brokers_indication.consolidado_check_ativo
    description: Validity check performed.
  registration_time_and_lead_worked_check:
    lineage:
      - datalake_airtable_raw.brokers_indication.consolidado_check_tempo_de_inscricao_e_lead_trabalhado
