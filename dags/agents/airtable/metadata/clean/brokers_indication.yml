---
database_name: datalake_airtable_clean
table_name: brokers_indication
description: 
  Raw data relating to Referrals made via the Chama Corretor form. 
  Consolidates all information regarding the Referrer (who indicated) and the Referee. 
  Central base for managing program participants and validity of referrals
domain: Data Agents
owner: data-ae-agents@quintoandar.com.br
columns:
  id_airtable_record:
    lineage:
      - datalake_airtable_raw.brokers_indication.id_airtable_record
    description: Unique record identifier in Airtable view.
  id_admin_recommender:
    lineage:
      - datalake_airtable_raw.brokers_indication.bd_indicante_id_admin
    description: Sk_user_name of the recommender, that is, the person who made the referral.
  id_indication:
    lineage:
      - datalake_airtable_raw.brokers_indication.id_indicacao
    description: Referral identification code, created upon submission of the referral form by the Referrer.
  id_registration_ticket:
    lineage:
      - datalake_airtable_raw.brokers_indication.ticket_inscricao
    description: Ticket generated for the nominator to share with the nominee and to be completed at the time of registration.
  id_admin_indicated_after_indication:
    lineage:
      - datalake_airtable_raw.brokers_indication.bd_indicado_pos_indicacao_id_admin
    description: Referred Sk_user_name.
  recommender_name:
    lineage:
      - datalake_airtable_raw.brokers_indication.nome_de_quem_esta_realizando_a_indicacao
    description: Recommender name.
  recommender_email:
    lineage:
      - datalake_airtable_raw.brokers_indication.email_de_quem_esta_indicando
    description: Recommender email.
  recommender_cpf:
    lineage:
      - datalake_airtable_raw.brokers_indication.cpf_indicante_formato
    description: Recommender CPF.
  recommender_quintoandar_partner_broker:
    lineage:
      - datalake_airtable_raw.brokers_indication.voce_e_um_corretor_parceiro_quintoandar
    description: Question on the nomination form, used to classify recommenders.
  indicated_broker_name:
    lineage:
      - datalake_airtable_raw.brokers_indication.nome_completo_do_indicado
    description: Name of the indicated broker.
  indicated_broker_email:
    lineage:
      - datalake_airtable_raw.brokers_indication.email_do_corretor_indicado
    description: Email of the indicated broker.
  indicated_broker_cpf:
    lineage:
      - datalake_airtable_raw.brokers_indication.cpf_indicado_formato_
    description: CPF of the indicated broker.
  indicated_broker_phone_number:
    lineage:
      - datalake_airtable_raw.brokers_indication.telefone_do_corretor_indicado
    description: Number phone of the indicated broker.
  indicated_broker_square_interest:
    lineage:
      - datalake_airtable_raw.brokers_indication.praca_de_interesse_do_indicado
    description: Square interest of the indicated broker.
  indicated_sla_inscription:
    lineage:
      - datalake_airtable_raw.brokers_indication.sla_inscricao_indicado
    description: Sign-up SLA of the indicated broker.
  chosen_region:
    lineage:
      - datalake_airtable_raw.brokers_indication.regiao_escolhida
    description: Region chosen in the nomination.
  chosen_hub:
    lineage:
      - datalake_airtable_raw.brokers_indication.hub_escolhido
    description: From To Region chosen for default naming.
  status_fup:
    lineage:
      - datalake_airtable_raw.brokers_indication.status_fup
    description: Internal referral status.
  cr_has_registration_in_lp_with_ticket:
    lineage:
      - datalake_airtable_raw.brokers_indication.cr_tem_inscricao_na_lp_com_ticket
    description: Internal referral status.
  reason_for_invalidity:
    lineage:
      - datalake_airtable_raw.brokers_indication.motivo_de_invalidade
    description: Consolidation of the reasons for invalidity of that specific indication.
  indication_general_check:
    lineage:
      - datalake_airtable_raw.brokers_indication.verificacao_geral_da_indicacao_dash
