database_name: datalake_airtable_clean
table_name: historical
description: This table contains information about the historical of activated agents.
domain: Data Agents
owner: data-ae-agents@quintoandar.com.br
columns:
  id_historical:
    lineage:
      - datalake_airtable_raw.historical.id
    description: historical identifier on the sheet.
  id_admin:
    lineage:
      - datalake_airtable_raw.historical.id_admin
    description: admin identifier.
  id_airtable_record:
    lineage:
      - datalake_airtable_raw.historical.id
    description: Airtable identifier.
  id_rental_activated:
    lineage:
      - datalake_airtable_raw.historical.ativados_rental
    description: rental activated identifier.
  agent_creci:
    lineage:
      - datalake_airtable_raw.historical.creci
    description: Agent's creci identifier.
  agent_email:
    lineage:
      - datalake_airtable_raw.historical.email
    description: Agent's email address.
  agent_main_phone_number:
    lineage:
      - datalake_airtable_raw.historical.telefone_principal
    description: Agent's phone number.
  agent_name:
    lineage:
      - datalake_airtable_raw.historical.name
    description: Agent's full name.
  cpf:
    lineage:
      - datalake_airtable_raw.historical.cpf
    description: Agent's cpf.
  model_type:
    lineage:
      - datalake_airtable_raw.historical.modalidade
    description: Agent type could be Locacao, Vendas or Vendas HUB.
  status:
    lineage:
      - datalake_airtable_raw.historical.status
    description: Last status.
  region:
    lineage:
      - datalake_airtable_raw.historical.regiao
    description: Region code where the agent works.
  dt_activated:
    lineage:
      - datalake_airtable_raw.historical.data_ativacao
    description: When the agent was activated.
  dt_contract_sent:
    lineage:
      - datalake_airtable_raw.historical._envio_de_contrato
    description: When the contract was sent.
  dt_contract_signed:
    lineage:
      - datalake_airtable_raw.historical.assinatura_do_contrato
    description: When the contract was signed by the agent.
  dt_week_accreditated:
    lineage:
      - datalake_airtable_raw.historical.semana_de_credenciamento
    description: Week when the accreditation happened.
  ts_updated:
    lineage:
      - datalake_airtable_raw.historical.last_modified
    description: When the record was last updated.
  ts_airtable_record_extracted:
    lineage:
      - datalake_airtable_raw.historical.createdTime
    description: 
      Date when the record was pulled by the Airtable API. 
      This date refers to when the record was created or updated in the tool.
  year:
    lineage:
      - datalake_airtable_raw.historical.year
    description: When the record was created or updated. It's a partition.
  month:
    lineage:
      - datalake_airtable_raw.historical.month
    description: When the record was created or updated. It's a partition.
  day:
    lineage:
      - datalake_airtable_raw.historical.day
    description: When the record was created or updated. It's a partition.
