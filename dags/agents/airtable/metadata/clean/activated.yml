database_name: datalake_airtable_clean
table_name: activated
description: This table contains information about activated agents. It comes to replace
  the sheet aux_agents.
domain: Data Agents
owner: data-ae-agents@quintoandar.com.br
columns:
  id_airtable_record:
    lineage:
      - datalake_airtable_raw.activated.id
    description: It's the record identifier on Airtable and doesn't have a real meaning
      for the table or the business.
  ids_history:
    lineage:
      - datalake_airtable_raw.activated.historico_v2
    description: The id on the historical sheet.
  id_user:
    lineage:
      - datalake_airtable_raw.activated.id_user
    description: agent's id_user.
  accreditations:
    lineage:
      - datalake_airtable_raw.activated.credenciamentos
    description: Number of accreditations of this agent. It is an int.
  agent_actual_type:
    lineage:
      - datalake_airtable_raw.activated.agent_actual_type
    description: the actual type can be Old or New Hire. It's important to notice
      that we had some questions using the old sheet where this values were lower
      case. Now, there aren't lower.
  agent_creci:
    lineage:
      - datalake_airtable_raw.activated.agent_creci
    description: Agent's creci identifier.
  agent_email:
    lineage:
      - datalake_airtable_raw.activated.email
    description: Agent's email address.
  agent_name:
    lineage:
      - datalake_airtable_raw.activated.name
    description: Agent's full name.
  agent_phone_number:
    lineage:
      - datalake_airtable_raw.activated.phone_number
    description: Agent's phone number.
  cpf:
    lineage:
      - datalake_airtable_raw.activated.cpf
    description: Agent's cpf.
  disqualification:
    lineage:
      - datalake_airtable_raw.activated.disqualification
    description: A list of id_airtable_record that are foreign key for jira_tickets
  dynamic_status:
    lineage:
      - datalake_airtable_raw.activated.status_dinamico
    description: Current agent status.
  last_area:
    lineage:
      - datalake_airtable_raw.activated.last_area
    description: last area code.
  last_disqualification:
    lineage:
      - datalake_airtable_raw.activated.last_disqualification
    description: Type of disqualification.
  last_disqualification_reason:
    lineage:
      - datalake_airtable_raw.activated.last_disqualification_reason
    description: A reason for the disqualification.
  last_suspension:
    lineage:
      - datalake_airtable_raw.activated.last_suspension
    description: Last type of suspension.
  last_suspension_reason:
    lineage:
      - datalake_airtable_raw.activated.last_suspension_reason
    description: Last reason for suspension.
  permanent_deaccreditation:
    lineage:
      - datalake_airtable_raw.activated.descred_permanente
    description: It's Sim or Não
  suspensions:
    lineage:
      - datalake_airtable_raw.activated.suspensoes
    description: A list of id_airtable_record that are foreign key for jira_tickets.
  suspensions_register:
    lineage:
      - datalake_airtable_raw.activated.registro_supensoes
    description: A list of reasons for suspension.
  tickets_jira:
    lineage:
      - datalake_airtable_raw.activated.tickets_jira
    description: A list of id_airtable_record that are foreign key for jira_tickets.
  days_since_activation_week:
    lineage:
      - datalake_airtable_raw.activated.days_since_activation_week
    description: Number of days after the activation. It's an int.
  dt_activated:
    lineage:
      - datalake_airtable_raw.activated.activation_date
    description: Date when the activation happened.
  dt_last_disqualificated:
    lineage:
      - datalake_airtable_raw.activated.last_disqualification_date
    description: Date when the last disqualification happened.
  dt_last_disqualification_returned:
    lineage:
      - datalake_airtable_raw.activated.last_disqualification_return_date
    description: Date of the return of the last disqualification.
  dt_last_suspended:
    lineage:
      - datalake_airtable_raw.activated.last_suspension_date
    description: Date when the last suspension happened.
  dt_last_suspension_returned:
    lineage:
      - datalake_airtable_raw.activated.last_supension_return_date
    description: Date of the return of the last suspension.
  dt_week_accreditated:
    lineage:
      - datalake_airtable_raw.activated.accreditation_week
    description: Week when the accreditation happened.
  ts_updated:
    lineage:
      - datalake_airtable_raw.activated.last_modified
    description: when this record was last updated.
  ts_airtable_record_extracted:
    lineage:
      - datalake_airtable_raw.activated.createdTime
    description: 
      Date when the record was pulled by the Airtable API. 
      This date refers to when the record was created or updated in the tool.
  year:
    lineage:
      - datalake_airtable_raw.activated.year
    description: year when the record was created or updated. It's a partition.
  month:
    lineage:
      - datalake_airtable_raw.activated.month
    description: month when the record was created or updated. It's a partition.
  day:
    lineage:
      - datalake_airtable_raw.activated.day
    description: day when the record was created or updated. It's a partition.
