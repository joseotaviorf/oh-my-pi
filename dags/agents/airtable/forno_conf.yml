---
dag_documentation:
  dag_purpose: |
    This DAG creates the raw and clean layer for tables from Airtable. Airtable is a platform that enables
    us to manipulate data with the same flexibility of a sheet, but with a relational database in the
    background. 
  additional_information: |
    To ingest a new base, it must be shared on Airtable with the Data Agents account, with Read-only access. 
    The account is contato.parceiros@quintoandar.com.br
custom_cluster:
  driver_node_type_id: r5a.large
  node_type_id: r5a.large
  num_workers: 3
  spark_version: 12.2.x-scala2.12
clean_partition_cols:
  - year
  - month
  - day
