dag:
  name: airtable
  schedule_start_date: 2020, 12, 21
  schedule_interval: 0 0 * * *
  owner: Data Agents
  documentation:
    dag_purpose: |
      This DAG creates the raw and clean layer for tables from Airtable. Airtable is a platform that enables
      us to manipulate data with the same flexibility of a sheet, but with a relational database in the
      background. 
    additional_information: |
      To ingest a new base, it must be shared on Airtable with the Data Agents account, with Read-only access. 
      The account is contato.parceiros@quintoandar.com.br
workflow:
  layer: raw
  type: custom_ingestion
  load_spark_job: load_airtable_raw
  spark_job_arguments:
  - "{environment}"
  - "{bucket}"
  - "{dag_name}"
  - "{{ data_interval_start | ds }}"
  - "{table_name}"
  - "{partitions}"
  default_extraction_type: incremental
  default_partitions: [year, month, day]
  tables_customization:
    activated:
      extra_spark_job_arguments:
      - base_id: app1Xchm7V2ypMlBQ
        table_id: tblXIVyaK8QFpjLdy
      - view: viwWbSdPz8p3TEow6
    cr_occurrences:
      extra_spark_job_arguments:
      - base_id: app1Xchm7V2ypMlBQ
        table_id: tblswVeTPw5LtSXwl
      - view: viwOosdLmusE800Or
    jira_tickets:
      extra_spark_job_arguments:
      - base_id: app1Xchm7V2ypMlBQ
        table_id: tblZl2bbgWIJpvhA3
      - view: viwcC4sQQzVUDa099
