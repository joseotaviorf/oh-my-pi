dag:
    name: dw_hub_services
    owner: Data Agents
    schedule_start_date: 2024, 5, 1
    documentation:
      dag_purpose: Dimensional modeling of business unit data, operating regions and hub members, coming from Hub Services.  
workflow:
    type: query_delta
    layer: dw
    custom_schema: hub_services
    default_extraction_type: full
    tables_customization:
        dim_profile:
            extraction_type: incremental
            partitions: [year, month, day]
cluster:
    type: databricks_12_2_med_general_photon_cluster
    access_control_list:
        group_name: analytics-engineers
        permission_level: CAN_MANAGE
