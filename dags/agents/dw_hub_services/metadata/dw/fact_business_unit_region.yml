---
database_name: dw_hub_services
table_name: fact_business_unit_region
description: 
  This fact shows the relationship between business units and their regions of operation, 
  indicating whether they are active, when the operation started and ended.
  Each operation relationship is unique by sk_business_unit_region.
domain: Data Agents
owner: data-ae-agents@quintoandar.com.br
columns:
  sk_business_unit_region:
    description: Unique identifier of the relationship between the business unit and the region of operation.
  sk_business_unit:
    lineage:
      - datalake_hub_services_clean.business_unit_region_aud.id_business_unit
    description: Business Unit unique identifier.
  sk_region:
    lineage:
      - datalake_hub_services_clean.business_unit_region_aud.id_region
    description: Region unique identifier.
  is_active:
    description: The business unit's operations in the region are active.
  ts_operations_started:
    lineage:
      - datalake_hub_services_clean.business_unit_region_aud.ts_created
    description: Start of operations of the business unit in the region.
  ts_operations_ended:
    lineage:
      - datalake_hub_services_clean.rev_info.ts_created
      - datalake_hub_services_clean.business_unit_region_aud.ts_created
    description: End of the business unit's operations in the region.
  ts_load:
    description: Date and time when the data was loaded.
