database_name: metric_agents
table_name: weekly_business_context_output_metrics
description: |
  This table presents weekly aggregated metrics to evaluate agent performance in both sales and rental processes. 
  It includes key indicators such as agent's activity days, visit bookings, offer submissions, and lead conversions. 
  The data focuses on evaluating agent productivity, engagement, and success in progressing leads through different stages, 
  such as booking, offers, documents sent, and contracts signed, with a weekly granularity.
domain: Agents
owner: data-ae-agents@quintoandar.com.br
columns:
  business_context:
    lineage:
      - dw_agent.fact_visit_agent_performance.is_rent_agent
    description: Indicates the type of business context, either "RENT" or "SALE".
    dimension: True
