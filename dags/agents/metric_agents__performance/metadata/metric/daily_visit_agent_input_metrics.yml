database_name: metric_agents
table_name: daily_visit_agent_input_metrics
description: |
  This table provides a comprehensive set of performance metrics that analyze agents' effectiveness in both sales and rental processes. 
  The metrics focus on key performance indicators (KPIs) that measure various stages of the business process, from initial lead engagement to final contract signing. 
  Each metric provides insights into the agent's performance, such as engagement with available schedules, booking efficiency, visit cancellations, lead conversion, 
  offer submission, credit approval, and contract signing. These metrics help assess agent productivity, identify potential bottlenecks, and optimize workflow efficiency.
