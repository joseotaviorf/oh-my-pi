---
dag:
  name: enrich_ebdb_agent_events
  schedule_start_date: 2024, 1, 1
  owner: Data Agents
  documentation:
    dag_purpose: |
      Enriches EBDB agent event streams from transactional CDC sources for the Agents domain.
      The pipeline materializes revision-level history tables that track how agent capabilities
      and related settings change over time, enabling downstream accreditation and performance models
      to reconstruct point-in-time agent behavior.

      Current scope:
      - Capability settings events: historical revisions of Demand Visit Management capability
        settings per agent, including business context and passive lead receiver configuration.
workflow:
  type: query_delta
  layer: enrich
  default_extraction_type: incremental
  inner_dependencies:
    agent_accreditation_events:
      - agent_unified_identity
    agent_product:
      - agent_unified_identity
    capability_events:
      - capability_settings
  tables_customization:
    agent_accreditation_events:
      merge_on: [id_event]
      z_order_by: [id_unified_agent, ts_created]
    agent_product:
      merge_on: [id_agent_product]
      z_order_by: [id_unified_agent, ts_started]
    agent_unified_identity:
      extraction_type: full
      z_order_by: [id_unified_agent, id_agent, id_agent_data, id_partner]
    capability_settings:
      merge_on: [id_event_log]
      partitions: [year, month, day]
      z_order_by: [id_agent, ts_started]
    capability_events:
      merge_on: [id_event_log, id_agent]
      z_order_by: [id_agent, ts_started]
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
