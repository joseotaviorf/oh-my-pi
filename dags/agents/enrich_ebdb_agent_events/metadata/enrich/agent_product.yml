---
database_name: datalake_agent
table_name: agent_product
domain: Agents
owner: anne.macedo@quintoandar.com.br
description: |
  Historical company product membership per agent unified identity. One row per product change
  revision for an agent (id_unified_agent), sourced from company member_profile and company_product.
  Tracks product name, active status, deactivation reasons, legacy product flags, and validity
  window (ts_started, ts_ended). Legacy products (e.g. CIQ, PP MULTI) superseded by
  AUTONOMOUS_BROKERAGE_AGENT are flagged via is_legacy_product; revisions before the first
  non-legacy transition are trimmed via ts_legacy_product_limit. Product id 40 (Alias AI/ML) is
  excluded at source because it does not represent the agent profile and coexists with Rede
  Sale and Rede Rent memberships.
columns:
  id_agent_product:
    lineage:
      - datalake_agent.agent_unified_identity.id_unified_agent
      - datalake_company_clean.company.id
      - datalake_company_clean.product.id
      - datalake_company_transactional.member_profile.updated_at
    description: |
      Surrogate key for the agent product revision, generated with XXHASH64 from id_unified_agent,
      id_company, id_product, and ts_updated. Primary merge key for this table.
  id_unified_agent:
    lineage:
      - datalake_agent.agent_unified_identity.id_unified_agent
    description: Foreign key to the unified identity row in agent_unified_identity.
  id_company:
    lineage:
      - datalake_company_clean.company.id
    description: Company identifier from the company domain, resolved via uuid_company on unified identity.
  id_product:
    lineage:
      - datalake_company_clean.product.id
    description: |
      Product identifier from the company product catalog linked to the member profile. Product
      id 40 (Alias) is excluded in the SQL filter because it is an AI/ML association that does
      not represent the agent profile and coexists with Rede Sale and Rede Rent products.
  uuid_person:
    lineage:
      - datalake_agent.agent_unified_identity.uuid_person
    description: Person UUID from unified identity, used to join member_profile in the source query.
  product_name:
    lineage:
      - datalake_company_clean.product.name
    description: Human-readable product name (e.g. company membership profile type) at revision time.
  deactivation_reason:
    lineage:
      - datalake_company_clean.company_product.deactivation_reason
    description: Deactivation reason from company_product when the membership is inactive.
  deactivation_sub_reason:
    lineage:
      - datalake_company_clean.company_product.deactivation_sub_reason
    description: Deactivation sub-reason from company_product when the membership is inactive.
  is_active:
    lineage:
      - datalake_company_clean.company_product.status
    description: True when company_product status is ACTIVE for this agent-product revision.
  is_lastest:
    description: True when this row is the latest product revision for id_unified_agent (prefers active status).
  is_lastest_by_date:
    description: True when this row is the latest product revision for id_unified_agent on the calendar day of ts_started.
  is_legacy_product:
    lineage:
      - datalake_company_clean.product.id
    description: |
      True when the product is a legacy membership profile superseded by AUTONOMOUS_BROKERAGE_AGENT
      (currently product ids 1, 32, and 29 — e.g. CIQ and PP MULTI). These products may remain
      erroneously active in member_profile; flagging them enables historical cleanup while
      ts_legacy_product_limit excludes stale legacy revisions after the first modern product.
  dt_updated:
    lineage:
      - datalake_company_transactional.member_profile.updated_at
    description: Calendar date of the product revision, derived from member_profile update timestamp. Partition key.
  ts_started:
    lineage:
      - datalake_company_transactional.member_profile.updated_at
    description: Timestamp when this product membership revision became effective.
  ts_ended:
    lineage:
      - datalake_company_transactional.member_profile.updated_at
      - datalake_company_clean.company_product.ts_database_transaction
    description: |
      End of the product revision validity window: company_product update timestamp when inactive
      and latest, otherwise day or second before the next revision for the same id_unified_agent.
