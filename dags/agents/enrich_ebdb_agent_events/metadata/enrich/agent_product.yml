---
database_name: datalake_ebdb_agent_events
table_name: agent_product
domain: Agents
owner: anne.macedo@quintoandar.com.br
description: |
  Company product membership per unified agent identity. One row per member_profile
  record linked to agent_unified_identity through uuid_person and company uuid_company.
  Enriches product catalog attributes and company_product deactivation context, and flags
  legacy products (ids 1, 32, 29) versus valid agent-profile products (excludes legacy
  ids and product id 40 Alias). Latest valid product flag supports downstream snapshots.
columns:
  id_agent_product:
    lineage:
      - datalake_ebdb_agent_events.agent_unified_identity.id_unified_agent
      - datalake_company_clean.company.id
      - datalake_company_clean.product.id
      - datalake_company_clean.member_profile.ts_created
    description: |
      Surrogate key for the agent product row, generated with XXHASH64 from id_unified_agent,
      id_company, id_product, and member_profile ts_created. Primary merge key for this table.
  id_unified_agent:
    lineage:
      - datalake_ebdb_agent_events.agent_unified_identity.id_unified_agent
    description: Foreign key to the unified identity row in agent_unified_identity.
  id_agent:
    lineage:
      - datalake_ebdb_agent_events.agent_unified_identity.id_agent
    description: Agent Domain agent identifier from unified identity when present.
  uuid_person:
    lineage:
      - datalake_ebdb_agent_events.agent_unified_identity.uuid_person
    description: Person UUID used to join member_profile with unified identity.
  uuid_company:
    lineage:
      - datalake_ebdb_agent_events.agent_unified_identity.uuid_company
    description: Company UUID from unified identity, used to resolve company and member_profile.
  id_product:
    lineage:
      - datalake_company_clean.product.id
    description: Product identifier from the member_profile company-product link.
  product_name:
    lineage:
      - datalake_company_clean.product.name
    description: Human-readable product name from the company product catalog.
  deactivation_reason:
    lineage:
      - datalake_company_clean.company_product.deactivation_reason
    description: Deactivation reason from company_product when the membership is inactive.
  deactivation_sub_reason:
    lineage:
      - datalake_company_clean.company_product.deactivation_sub_reason
    description: Deactivation sub-reason from company_product when the membership is inactive.
  is_active:
    lineage:
      - datalake_company_clean.member_profile.status
      - datalake_company_clean.company_product.status
      - datalake_company_clean.company_product.deactivation_reason
    description: |
      True when member_profile and company_product are both ACTIVE and company_product has
      no deactivation_reason on the membership link.
  is_legacy_product:
    lineage:
      - datalake_company_clean.product.id
    description: |
      True when the product is a legacy membership profile superseded by
      AUTONOMOUS_BROKERAGE_AGENT (product ids 1, 32, and 29).
  is_valid_product:
    lineage:
      - datalake_company_clean.product.id
    description: |
      True when the product represents a valid agent profile membership, excluding legacy
      product ids (1, 32, 29) and product id 40 (Alias AI/ML).
  is_lastest:
    description: |
      True when this row is the preferred product for id_unified_agent on the current
      snapshot, ranking by valid product flag, active membership, and latest update time.
  is_lastest_by_date:
    description: |
      True when this row is the preferred product for id_unified_agent on the calendar day
      of ts_started, used to reconstruct point-in-time profile in agent_history.
  ts_started:
    lineage:
      - datalake_company_clean.member_profile.ts_created
    description: Timestamp when the member_profile record was created in the company service.
  ts_ended:
    lineage:
      - datalake_company_clean.company_product.ts_database_transaction
      - datalake_company_clean.member_profile.ts_updated
    description: |
      Timestamp when the product membership ended, from company_product deactivation or
      member_profile inactivation when applicable.
  ts_updated:
    lineage:
      - datalake_company_clean.member_profile.ts_updated
      - datalake_ebdb_agent_events.agent_unified_identity.ts_updated
    description: Latest update timestamp from member_profile or unified identity.
