dag:
  name: ebdb_agent
  owner: Data Agents
  criticality: High
  schedule_interval: 20 21,7,11,15 * * *
  documentation:
    dag_purpose: |
      Extraction of EBDB tables related to agents into data lake. EBDB is the main database for QuintoAndar.
workflow:
  type: cdc
  layer: raw
  custom_schema: ebdb
  database_type: mysql
  source_database: ebdb
  source_schema: ebdb
  tables_customization:
    AccreditationContractTemplate:
      clean_table_name: accreditation_contract_template
    AccreditationContractProcess:
      clean_table_name: accreditation_contract_process
    Agent:
      clean_table_name: agent
    AgentEventLog:
      clean_table_name: agent_event_log
    AgentExternalReference:
      clean_table_name: agent_external_reference
    AgentLeadReferral:
      clean_table_name: agent_lead_referral
    AgentLeadReferral_AUD:
      clean_table_name: agent_lead_referral_aud
    AgentWithKeysAllocationParameters:
      clean_table_name: agent_with_keys_allocation_parameters
    AgentWithKeysAllocationParameters_AUD:
      clean_table_name: agent_with_keys_allocation_parameters_aud
    Capability:
      clean_table_name: capability
    ClientPortfolio:
      clean_table_name: client_portfolio
    ClientPortfolioMigration:
      clean_table_name: client_portfolio_migration
    CreciValidation:
      clean_table_name: creci_validation
    DadosAgente:
      clean_table_name: agent_data
    DadosAgente_AUD:
      clean_table_name: agent_data_aud
    DadosAgente_businessContextsServed:
      clean_table_name: agent_data_business_contexts_served
      raw_primary_keys: ["DadosAgente_id", "businessContextsServed"]
    DadosAgente_businessContextsServed_AUD:
      clean_table_name: agent_data_business_contexts_served_aud
    DadosAgente_programs:
      clean_table_name: agent_data_programs
    DadosAgente_programs_AUD:
      clean_table_name: agent_data_programs_aud
    DadosAgente_tipos:
      clean_table_name: agent_data_types
      raw_primary_keys: ["DadosAgente_id", "tipos"]
    DadosAgente_tipos_AUD:
      clean_table_name: agent_data_types_aud
    DadosAgente_Regiao:
      clean_table_name: agent_region_data
    DadosAgente_Regiao_AUD:
      clean_table_name: agent_region_data_aud
    DemandVisitManagementCapabilitySettings:
      clean_table_name: demand_visit_management_capability_settings
    PreferredFixedAgent:
      clean_table_name: preferred_fixed_agent
    PreferredFixedAgent_AUD:
      clean_table_name: preferred_fixed_agent_aud
    ProspectAgent:
      clean_table_name: prospect_agent
    Qualification:
      clean_table_name: qualification
    QualificationStep:
      clean_table_name: qualification_step
    QualificationStepProgress:
      clean_table_name: qualification_step_progress
    QuintoAndarProspectAgent:
      clean_table_name: quintoandar_prospect_agent
  extra_query_template_params:
    load_end_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, 1), 'load_end_date') }}"
