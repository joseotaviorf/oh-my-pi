columns:
  id:
    lineage:
      - datalake_ebdb_raw.ProspectAgent.id
    description: Unique identifier for the prospect agent.
  uuid_prospect:
    lineage:
      - datalake_ebdb_raw.ProspectAgent.prospect_uuid
    description: UUID of the prospect in the source system.
  uuid_person:
    lineage:
      - datalake_ebdb_raw.ProspectAgent.person_uuid
    description: UUID of the related person in the source system.
  legal_entity_type:
    lineage:
      - datalake_ebdb_raw.ProspectAgent.legal_entity_type
    description: Type of legal entity (e.g., individual or company).
  status:
    lineage:
      - datalake_ebdb_raw.ProspectAgent.status
    description: Current status of the prospect agent record.
  business_association:
    lineage:
      - datalake_ebdb_raw.ProspectAgent.business_association
