---
database_name: datalake_ebdb_clean
table_name: agent_event_log
domain: Agents
owner: gustavo.rompe@quintoandar.com.br
description: Event log of agent capability changes and actions, including actor, channel and timestamps.
columns:
  id:
    lineage:
      - datalake_ebdb_raw.agenteventlog.id
    description: Unique identifier for the event record.
  id_agent:
    lineage:
      - datalake_ebdb_raw.agenteventlog.agent_id
    description: Agent identifier associated with the event.
  id_capability:
    lineage:
      - datalake_ebdb_raw.agenteventlog.capability_id
    description: Capability identifier related to the event.
  author_type:
    lineage:
      - datalake_ebdb_raw.agenteventlog.author_type
    description: Type of actor who triggered the event (e.g., agent, system).
  author_identifier:
    lineage:
      - datalake_ebdb_raw.agenteventlog.author_identifier
    description: Unique identifier of the actor who triggered the event.
  author_role:
    lineage:
      - datalake_ebdb_raw.agenteventlog.author_role
    description: Role of the actor who triggered the event.
  channel:
    lineage:
      - datalake_ebdb_raw.agenteventlog.channel
    description: Channel where the action occurred (e.g., app, API, internal).
  reason:
    lineage:
      - datalake_ebdb_raw.agenteventlog.reason
    description: |
      Business reason code for the agent domain event (accreditation, deaccreditation,
      migration, reenrollment, or backfill). Populated by Agent Domain workflows when
      capabilities or agent status change.
    categories:
      AUTONOMOUS_BROKERAGE_AGENT_ACCREDITATION: Standard accreditation flow where a prospect_agent is approved through qualification and a new autonomous brokerage agent is created.
      AUTONOMOUS_BROKERAGE_AGENT_DEACCREDITATION: Standard deaccreditation flow where an autonomous brokerage agent is deactivated.
      AUTONOMOUS_BROKERAGE_AGENT_REENROLLMENT: Reenrollment flow where an existing legacy DadosAgente agent is reused and reactivated.
      PRO_ACQUIRER_ACCREDITATION: Standard accreditation flow for a Pro Acquirer agent profile.
      PRO_ACQUIRER_DEACCREDITATION: Standard deaccreditation flow for a Pro Acquirer agent profile.
      PRO_ACQUIRER_REENROLLMENT: Reenrollment flow for a Pro Acquirer agent profile.
      CIQ_MIGRATION_ACCREDITATION: Initial automatic CIQ migration attempt to the Agent Domain. Fails when data inconsistencies exist (e.g. missing member profile, duplicate records, capability conflicts).
      CIQ_MIGRATION_BACKFILL: CIQ migration reprocessing after manual remediation; re-evaluates the agent and completes migration.
      FIRST_PARTY_DEMAND_AGENT_MIGRATION_ACCREDITATION: Initial automatic 1P demand agent migration attempt to the Agent Domain.
      FIRST_PARTY_DEMAND_AGENT_MIGRATION_BACKFILL: 1P demand agent migration reprocessing after manual remediation.
      THIRD_PARTY_DEMAND_AGENT_MIGRATION_ACCREDITATION: Initial automatic 3P demand agent migration attempt to the Agent Domain.
      THIRD_PARTY_DEMAND_AGENT_MIGRATION_BACKFILL: 3P demand agent migration reprocessing after manual remediation.
  on_behalf_of_role:
    lineage:
      - datalake_ebdb_raw.agenteventlog.on_behalf_of_role
    description: Role on whose behalf the action was performed, if applicable.
  event_type:
    lineage:
      - datalake_ebdb_raw.agenteventlog.event_type
    description: Type of event that occurred.
  ts_occurred:
    lineage:
      - datalake_ebdb_raw.agenteventlog.occurred_at
    description: Timestamp when the event occurred in the source system.
  ts_created:
    lineage:
      - datalake_ebdb_raw.agenteventlog.created_at
    description: Timestamp when the record was created.
  ts_updated:
    lineage:
      - datalake_ebdb_raw.agenteventlog.updated_at
    description: Timestamp when the record was last updated.
  op_cdc:
    description: CDC operation type captured by the PostgreSQL CDC framework for this event row.
    lineage:
      - datalake_ebdb_raw.agenteventlog.op_cdc
    categories:
      r: Read/snapshot - initial load of existing records.
      c: Create - new record inserted.
      u: Update - existing record modified.
      d: Delete - record removed.
  ts_cdc_transaction:
    description: UTC timestamp when the CDC framework captured this agent event change transaction.
    lineage:
      - datalake_ebdb_raw.agenteventlog.ts_cdc_transaction
  ts_database_transaction:
    description: UTC timestamp when the source PostgreSQL database committed this agent event change.
    lineage:
      - datalake_ebdb_raw.agenteventlog.ts_database_transaction

