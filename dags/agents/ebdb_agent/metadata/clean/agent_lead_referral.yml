    lineage:
    - datalake_ebdb_raw.agentleadreferral.agent_id
  id_lead:
    description: Lead User ID. Can JOIN with dim_user sk_user.
    lineage:
    - datalake_ebdb_raw.agentleadreferral.lead_id
  name:
    description: Invited customer name.
    lineage:
    - datalake_ebdb_raw.agentleadreferral.name
  status:
    description: Invite status.
    lineage:
    - datalake_ebdb_raw.agentleadreferral.status
  phone:
    description: Lead phone
    lineage:
    - datalake_ebdb_raw.agentleadreferral.phone
  code:
    description: Code sent to the invited user.
    lineage:
    - datalake_ebdb_raw.agentleadreferral.code
  origin:
    description: Channel through which a lead is captured.
    lineage:
    - datalake_ebdb_raw.agentleadreferral.origin
  ts_created:
    description: Register creation timestamp
    lineage:
    - datalake_ebdb_raw.agentleadreferral.createdAt
  ts_updated:
    description: Register update timestamp
    lineage:
    - datalake_ebdb_raw.agentleadreferral.updatedAt
