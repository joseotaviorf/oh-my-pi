---
database_name: datalake_ebdb_clean
table_name: agent_data_programs_aud
domain: Agents
owner: gustavo.rompe@quintoandar.com.br
description: This table contains audit information about agent elegibility to incentive programs.
columns:
  id:
    lineage:
      - datalake_ebdb_raw.dadosagente_programs_aud.id
    description: Table primary key. Identify the agent <> program relation
  id_agent_data:
    lineage:
      - datalake_ebdb_raw.dadosagente_programs_aud.dados_agent_id
    description: Identification of a 5A agent
  rev:
    lineage:
      - datalake_ebdb_raw.dadosagente_programs_aud.rev
    description: Table primary key. Identification of a revision
  rev_type:
    lineage:
      - datalake_ebdb_raw.dadosagente_programs_aud.revtype
    description: Identification of a revision type(category)
  program:
    lineage:
      - datalake_ebdb_raw.dadosagente_programs_aud.program
    description: Incentive or loyalty program code the agent is enrolled in or evaluated against (e.g. Big Agent tier).
  is_eligible:
    lineage:
      - datalake_ebdb_raw.dadosagente_programs_aud.elegible
    description: Program elegibility status (boolean)
