---
database_name: datalake_ebdb_clean
table_name: qualification
domain: Agents
owner: gustavo.rompe@quintoandar.com.br
description: Agent prospect qualification instance in EBDB, linking a prospect to a qualification template with current state, reason, rejection audit metadata, and timestamps.
columns:
  id:
    lineage:
      - datalake_ebdb_raw.qualification.id
    description: Unique identifier for the qualification record.
  id_agent_prospect:
    lineage:
      - datalake_ebdb_raw.qualification.agent_prospect_id
    description: Foreign key to the agent prospect associated with this qualification.
  id_qualification_template:
    lineage:
      - datalake_ebdb_raw.qualification.qualification_template_id
    description: Identifier of the qualification template applied to this prospect.
  id_author_identifier:
    lineage:
      - datalake_ebdb_raw.qualification.author_identifier
    description: Identifier of the actor who rejected the qualification in the source system, when applicable.
  uuid_qualification:
    lineage:
      - datalake_ebdb_raw.qualification.qualification_uuid
    description: Business UUID for the qualification instance in the source system.
  reason:
    lineage:
      - datalake_ebdb_raw.qualification.reason
    description: Free-text or coded reason for the current qualification outcome or transition.
  state:
    lineage:
      - datalake_ebdb_raw.qualification.state
    description: Current state of the qualification workflow for this prospect.
  author_type:
    lineage:
      - datalake_ebdb_raw.qualification.author_type
    description: Type of actor who rejected the qualification (e.g., USUARIO, SISTEMA), when applicable.
  ts_rejected:
    lineage:
      - datalake_ebdb_raw.qualification.rejected_at
    description: Timestamp when the qualification was rejected, when applicable.
  ts_created:
    lineage:
      - datalake_ebdb_raw.qualification.created_at
    description: Timestamp when the qualification record was created.
  ts_updated:
    lineage:
      - datalake_ebdb_raw.qualification.updated_at
    description: Timestamp when the qualification record was last updated.
  op_cdc:
    lineage:
      - datalake_ebdb_raw.qualification.op_cdc
    description: CDC operation type for this row (insert, update, delete, or snapshot read).
    categories:
      r: Read/snapshot - initial load of existing records.
      c: Create - new record inserted.
      u: Update - existing record modified.
      d: Delete - record removed.
  ts_cdc_transaction:
    lineage:
      - datalake_ebdb_raw.qualification.ts_cdc_transaction
    description: Wall-clock timestamp when the CDC connector captured this change event.
  ts_database_transaction:
    lineage:
      - datalake_ebdb_raw.qualification.ts_database_transaction
    description: Timestamp of the source database transaction that produced this row version.
