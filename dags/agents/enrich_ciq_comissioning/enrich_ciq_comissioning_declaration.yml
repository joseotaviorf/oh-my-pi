dag:
  name: enrich_ciq_comissioning
  schedule_start_date: 2020,7,1
  owner: Data Agents
  documentation:
    dag_purpose: |
        Process enrich tables related to the calculation of commission provision for CIQs (Corretor Imobiliario QuintoAndar)
    additional_information: |
        Tables to be processed
            sale_commission_for_strategic_region - provides information about listings (for sale), informing whether the neighborhood in which it is located is strategic or not, thus implying the amount of commission to be paid to ciq.
            rent_commission_for_strategic_region - provides information about listings (for rent), informing whether the neighborhood in which it is located is strategic or not, thus implying the amount of commission to be paid to ciq.
workflow:
  type: query_delta
  layer: enrich
cluster:
  type: databricks_12_2_min_memory_cluster

