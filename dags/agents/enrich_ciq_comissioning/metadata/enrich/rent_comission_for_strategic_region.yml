---
database_name: datalake_ciq_comissioning
table_name: rent_comission_for_strategic_region
description: Enriched table containing information about regions (neighborhoods), 
  indicating whether or not they are strategic in a given month, in the For rent context.
domain: Data Agents
owner: data-ae-agents@quintoandar.com.br
columns:
  id_house_listing:
    lineage:
      - datalake_ebdb_listing.house_listing.id_house_listing
    description: Id of house listing.
  id_region:
    lineage:
      - datalake_ebdb_listing.house.id_region
    description: Id of the region.
  city_name:
    lineage:
      - datalake_ebdb_listing.house.region_city_name
    description: Name of the city where the neighborhood is located.
  neighborhood_name:
    lineage:
      - datalake_ebdb_listing.house.neighborhood
    description: Name of the neighborhood to be classified.
  is_strategic_region:
    lineage:
      - datalake_gsheets_clean.rent_comission_for_strategic_region.is_strategic_region
    description: Indicates whether the neighborhood in that city is considered strategic or not.
  dt_publication_reference:     
    lineage:
      - datalake_ebdb_listing.house_listing.ts_first_publication
      - datalake_ebdb_listing.house_listing.ts_listing_version_start
    description: Reference year and month of publication of the house. 
        For properties published before October 2023, the date September 2023 was set as the default. 
        Example 1 - publication date on 21-09-2022, the reference year/month will be 2023-09-01. 
        Example 2 - publication date on 21-12-2023, the reference year/month will be 2023-12-01
  ts_publication:
    lineage:
      - datalake_ebdb_listing.house_listing.ts_first_publication
      - datalake_ebdb_listing.house_listing.ts_listing_version_start
    description: House listing publication date of the version.

  