---
database_name: datalake_ciq_comissioning
table_name: sale_comission_for_strategic_region
description: Enriched table containing information about regions (neighborhoods), 
  indicating whether or not they are strategic in a given month, in the For Sale context.
domain: Data Agents
owner: data-ae-agents@quintoandar.com.br
columns:
  id_sale_listing:
    lineage:
      - datalake_sale_listings.sale_listing.id_sale_listing
    description: Id of sale listing.
  id_region:
    lineage:
      - datalake_ebdb_listing.house.id_region
    description: Id of the region.
  city_name:
    lineage:
      - datalake_ebdb_listing.house.city
    description: Name of the city where the neighborhood is located.
  neighborhood_name:
    lineage:
      - datalake_ebdb_listing.house.neighborhood
    description: Name of the neighborhood to be classified.
  is_strategic_region:
    lineage:
      - datalake_gsheets_clean.sale_comission_for_strategic_region.is_strategic_region
    description: Indicates whether the neighborhood in that city is considered strategic or not.
  dt_publication_reference:
    lineage:
      - datalake_ebdb_listing.listing_business_context.ts_first_listing
    description: Reference year and month of publication of the house. 
        For properties published before October 2023, the date September 2023 was set as the default. 
        Example 1 - publication date on 2022-03-10, the reference year/month will be 2023-09-01. 
        Example 2 - publication date on 2023-12-21, the reference year/month will be 2023-12-01.
  ts_first_publication:
    lineage:
      - datalake_ebdb_listing.listing_business_context.ts_first_listing
    description: Timestamp of the house first publication.