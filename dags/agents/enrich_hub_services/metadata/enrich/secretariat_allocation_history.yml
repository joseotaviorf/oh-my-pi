---
database_name: datalake_hub_services
table_name: secretariat_allocation_history
description: Table that shows the history of allocation of a secretariat to its team.
domain: For Sale
owner: gustavo.miller@quintoandar.com.br
columns:
  id_secretariat_user:
    lineage:
      - datalake_gsheets_clean.secretariat_hierarchy.id_user_5a
      - datalake_hub_services_clean.users.id_external
    description: ID of the 5a user that is a secretariat.
  id_business_unit:
    lineage:
      - datalake_hub_services_clean.business_unit.id
    description: ID of the business unit of the secretariat.
  allocation:
    lineage:
      - datalake_hub_services_clean.business_unit.hub_name
    description: Name of the allocation of the secretariat.
  segment:
    description: Segment of the secretariat.
  profile:
    lineage:
      - datalake_hub_services_clean.member_profile_aud.profile
    description: Name of the profile of the secretariat.
  business_context:
    lineage:
      - datalake_hub_services_clean.business_unit.business_context
    description: Business context of the secretariat.
  version:
    description: Version of the row. A new version is generated every time the allocation of the secretariat is changed.
  ts_allocation_started:
    lineage:
      - datalake_hub_services_clean.member_profile_aud.ts_created
    description: Timestamp of the start of the allocation of the secretariat.
  ts_allocation_ended:
    lineage:
      - datalake_hub_services_clean.member_profile_aud.ts_created
    description: Timestamp of the end of the allocation of the secretariat. Null if the secretariat is still allocated.
