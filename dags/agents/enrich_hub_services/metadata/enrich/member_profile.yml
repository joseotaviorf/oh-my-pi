---
database_name: datalake_hub_services
table_name: member_profile
description: |
  History of member profile links with business units and parent members, enriched with external user
  and agent identifiers, hub/region attributes as of relationship end, contact fields, and explicit
  relationship-end timestamps. One row per audit revision (id_revision), deduplicated to the latest
  business unit row per revision for downstream allocation models.
domain: Agents
owner: gustavo.rompe@quintoandar.com.br
columns:
  id_revision:
    lineage:
      - datalake_hub_services_clean.member_profile_aud.id
      - datalake_hub_services_clean.member_profile_aud.id_business_unit
      - datalake_hub_services_clean.member_profile_aud.id_parent_member_profile
      - datalake_hub_services_clean.member_profile_aud.rev
    description: |
      Stable identifier for one audit revision of a member–business unit–parent combination
      (XXHASH64 of profile id, business unit id, coalesced parent profile id, and revision).
  id_member_relationship:
    lineage:
      - datalake_hub_services_clean.member_profile_aud.id
      - datalake_hub_services_clean.member_profile_aud.id_business_unit
      - datalake_hub_services_clean.member_profile_aud.id_parent_member_profile
    description: |
      Stable relationship identifier (XXHASH64 of member profile id, business unit id, and coalesced
      parent member profile id) used to join allocation and hierarchy models. Constant across revisions.
  id_member_profile:
    lineage:
      - datalake_hub_services_clean.member_profile_aud.id
    description: Member profile unique identifier.
  id_user:
    lineage:
      - datalake_hub_services_clean.member_profile_aud.id_user
    description: |
      User unique identifier on Hub Services tables.
      Attention: this user ID refers to Hub Services and does not correspond to the main/admin/ebdb user.
  id_main_user:
    lineage:
      - datalake_hub_services.users.id_main_user
    description: |
      Unique member external user ID (main/admin/ebdb).
      Attention: This ID refers to the user in main/admin/ebdb.
  id_agent:
    lineage:
      - datalake_hub_services.users.id_agent
    description: |
      Agent unique identifier.
      Attention: This ID refers to the agent in main/admin/ebdb.
  uuid_person:
    lineage:
      - datalake_hub_services.users.uuid_person
    description: Person-level UUID from main/admin (ebdb) for this member.
  uuid_company:
    lineage:
      - datalake_ebdb_clean.agent_data.uuid_company
    description: Company UUID from EBDB agent_data for the member agent (brokerage / company identifier).
  id_parent_member_profile:
    lineage:
      - datalake_hub_services_clean.member_profile_aud.id_parent_member_profile
    description: |
      Unique ID of the parent member (personality of the business unit the member reports to).
      Example: if the member is an agent, the parent is often a negotiation executive.
  id_parent_user:
    lineage:
      - datalake_hub_services.users.id_user
    description: |
      Hub Services internal user id for the parent member (latest parent profile row joined to users).
      Attention: Hub Services user id, not main/admin/ebdb user id.
  id_parent_main_user:
    lineage:
      - datalake_hub_services.users.id_main_user
    description: Parent member external user ID (main/admin/ebdb).
  id_parent_agent:
    lineage:
      - datalake_hub_services.users.id_agent
    description: Parent member agent identifier (main/admin/ebdb).
  uuid_parent_person:
    lineage:
      - datalake_hub_services.users.uuid_person
    description: Person-level UUID from main/admin (ebdb) for the parent member.
  id_business_unit:
    lineage:
      - datalake_hub_services_clean.member_profile_aud.id_business_unit
    description: Unique ID of the business unit where the member is allocated.
  id_region:
    lineage:
      - datalake_hub_services.business_unit.id_region
    description: |
      Region id of the business unit row whose region association is valid at relationship end
      (join to enrich business_unit on id_business_unit with ts_region_association_created <= ts_relationship_ended).
  profile:
    lineage:
      - datalake_hub_services_clean.member_profile_aud.profile
    description: Describes the member's profile.
    categories:
      MANAGEMENT_SECRETARIAT: Exclusive ForSale profile. Manages a secretarial team.
      TREATMENT_SECRETARIAT: Exclusive ForSale profile. Works directly on converting new buyer prospects.
      ADMINISTRATIVE_SECRETARIAT: Exclusive ForSale profile. Directly administers a group of secretaries.
      DISTRIBUTION_SECRETARIAT: Exclusive ForSale profile. Directly distributes leads to a group of secretaries.
      NEGOTIATION_EXECUTIVE: Exclusive ForSale profile. Responsible for intermediating the offer negotiation stage between a buyer and seller until it results in a signed contract (CCV).
      AGENT: Can belong to ForSale or ForRent. Acts as a visit broker.
      TREATMENT_SECRETARIAT_NBP: Exclusive ForSale profile. A secretary who works directly on converting new buyer prospects.
      THIRD_PARTY_TREATMENT_SECRETARIAT: Exclusive ForSale profile. Works directly on converting new buyer prospects, but the secretaries are third-party.
      SELECT_EXECUTIVE: Exclusive ForRent profile. Responsible for supporting and managing the work of a group of brokers.
      ASSOCIATED_EXECUTIVE: Exclusive ForSale profile. Responsible for managing the work of a group of business units (HUBs).
      SUPERVISION_SECRETARIAT: Exclusive ForSale profile. Supervises a group of secretaries.
      TREATMENT_SECRETARIAT_TWILIO: Exclusive ForSale profile. Works directly on converting new buyer prospects, with communication via Twilio (a CX tool).
  agent_type:
    lineage:
      - datalake_ebdb_clean.agent_data.agent_type
    description: Agent type from EBDB agent_data for the member's agent id.
  hub_name:
    lineage:
      - datalake_hub_services.business_unit.hub_name
    description: Hub display name from enrich business_unit at relationship end.
  city_group:
    lineage:
      - datalake_hub_services.business_unit.city_group
    description: City group of the hub’s region from enrich business_unit at relationship end.
  city_name:
    lineage:
      - datalake_hub_services.business_unit.city_name
    description: City name of the hub’s region from enrich business_unit at relationship end.
  short_region_name:
    lineage:
      - datalake_hub_services.business_unit.short_region_name
    description: Short region label from enrich business_unit at relationship end.
  lead_types:
    lineage:
      - datalake_hub_services.business_unit.lead_types
    description: Lead types served by the hub from enrich business_unit at relationship end.
  business_context:
    lineage:
      - datalake_hub_services.business_unit.business_context
    description: Commercial line of the business unit (e.g. sale or rent) at relationship end.
    categories:
      sale: Acting on sales.
      rent: Acting on rent.
  name:
    lineage:
      - datalake_hub_services.users.name
    description: Member user display name from Hub Services users.
  email:
    lineage:
      - datalake_hub_services.users.email
    description: Member user email from Hub Services users.
  phone_number:
    lineage:
      - datalake_hub_services.users.phone_number
    description: Member user primary phone from Hub Services users.
  secondary_phone_number:
    lineage:
      - datalake_hub_services.users.secondary_phone_number
    description: Member user secondary phone from Hub Services users when applicable.
  cpf:
    lineage:
      - datalake_hub_services.users.cpf
    description: Member user CPF from Hub Services users.
  parent_name:
    lineage:
      - datalake_hub_services.users.name
    description: Parent member display name from Hub Services users (parent profile row).
  parent_email:
    lineage:
      - datalake_hub_services.users.email
    description: |
      Email address of the parent member (e.g. negotiation executive) from Hub Services users,
      joined via id_parent_member_profile on the latest parent profile row.
  parent_phone_number:
    lineage:
      - datalake_hub_services.users.phone_number
    description: Parent member primary phone from Hub Services users.
  parent_secondary_phone_number:
    lineage:
      - datalake_hub_services.users.secondary_phone_number
    description: Parent member secondary phone from Hub Services users when applicable.
  parent_cpf:
    lineage:
      - datalake_hub_services.users.cpf
    description: |
      CPF of the parent member from Hub Services users, joined via id_parent_member_profile
      on the latest parent profile row.
  is_member_active_in_period:
    lineage:
      - datalake_hub_services_clean.member_profile_aud.is_active
    description: |
      Active flag on the member profile audit row for this revision (member profile is_active in Hub Services clean audit).
  is_latest_relationship_state:
    lineage:
      - datalake_hub_services_clean.member_profile_aud.ts_updated
    description: |
      True when this row is the latest audit revision for the member relationship within the output
  ts_relationship_started:
    lineage:
      - datalake_hub_services_clean.member_profile_aud.ts_created
    description: |
      Timestamp when the member's relationship with the business unit (and parent, when present) began
      for this audit version.
  ts_relationship_ended:
    lineage:
      - datalake_hub_services_clean.member_profile_aud.ts_created
      - datalake_hub_services_clean.member_profile_aud.is_active
      - datalake_hub_services_clean.member_profile_aud.ts_updated
      - datalake_hub_services_clean.rev_info.ts_created
    description: |
      Resolved end timestamp for the member relationship revision (inactive closure, open active to now, or
      revision-driven end from audit history).
  ts_load:
    description: Date and time when the enrich row was materialized (pipeline load time).
