---
dag:
  name: enrich_hub_services
  schedule_start_date: 2022, 7, 22
  owner: Data Agents
  documentation:
    dag_purpose: |
      Enriched Hub Services layer: business unit region, member profiles and hub linkage,
      business unit dimension with region attributes, profile snapshots, and daily
      member–hub allocation for agents and downstream consumers.
workflow:
  type: query_delta
  layer: enrich
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  inner_dependencies:
    member_profile:
      - business_unit
    member_hub_allocation:
      - member_profile
    agent_hub_alocation:
      - member_profile
  tables_customization:
    profile:
      extraction_type: incremental
      partitions: [year, month, day]
    agent_hub_alocation:
      extraction_type: incremental
      partitions: [year, month, day]
    member_hub_allocation:
      extraction_type: incremental
      partitions: [year, month, day]
