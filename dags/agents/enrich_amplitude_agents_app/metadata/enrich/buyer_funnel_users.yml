---
database_name: datalake_amplitude_agents_app
table_name: buyer_funnel_users
description: Daily user-level state across the buyer funnel, aggregated from Agents App search events. Records first/last relevant timestamps and partitions by the processing snapshot date.
domain: Agents
owner: gustavo.rompe@quintoandar.com.br
columns:
  id_amplitude:
    lineage:
      - datalake_amplitude_agents_app.agents_search_events.id_amplitude
    description: Amplitude user identifier aggregated at the user level.
  id_user:
    lineage:
      - datalake_amplitude_agents_app.agents_search_events.id_user
    description: Platform user identifier associated with the Amplitude user.
  ts_first_logged_activity:
    lineage:
      - datalake_amplitude_agents_app.agents_search_events.ts_event
      - datalake_amplitude_agents_app.agents_search_events.id_user
    description: Earliest event timestamp when the user is logged in (id_user present).
  ts_first_sale_activity:
    lineage:
      - datalake_amplitude_agents_app.agents_search_events.ts_event
      - datalake_amplitude_agents_app.agents_search_events.business_context
    description: Earliest event timestamp within the Sale business context.
  ts_first_activity:
    lineage:
      - datalake_amplitude_agents_app.agents_search_events.ts_event
    description: Earliest observed event timestamp within the selected window.
  ts_latest_activity:
    lineage:
      - datalake_amplitude_agents_app.agents_search_events.ts_event
    description: Most recent observed event timestamp within the selected window.
  ts_latest_sale_activity:
    lineage:
      - datalake_amplitude_agents_app.agents_search_events.ts_event
      - datalake_amplitude_agents_app.agents_search_events.business_context
    description: Most recent event timestamp within the Sale business context.
  dt_snapshot:
    description: Snapshot date representing the processed day used to compute the daily state.
  year:
    description: Snapshot partition year, derived from dt_snapshot.
  month:
    description: Snapshot partition month, derived from dt_snapshot.
  day:
    description: Snapshot partition day, derived from dt_snapshot.
