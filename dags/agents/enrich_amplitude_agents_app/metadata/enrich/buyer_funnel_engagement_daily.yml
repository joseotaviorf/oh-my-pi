---
database_name: datalake_amplitude_agents_app
table_name: buyer_funnel_engagement_daily
description: Daily engagement metrics across the buyer funnel for Agents App users, aggregated from search-related events and enriched with UTM taxonomy.
domain: Agents
owner: gustavo.rompe@quintoandar.com.br
columns:
  id_amplitude:
    lineage:
      - datalake_amplitude_agents_app.agents_search_events.id_amplitude
    description: Amplitude user identifier used for event grouping.
  id_region:
    lineage:
      - datalake_amplitude_agents_app.agents_search_events.id_region
    description: Most frequent region associated with the user's events for the day.
  first_utm_medium:
    lineage:
      - datalake_growth_taxonomy.unified_taxonomy_dictionary.medium
      - datalake_amplitude_agents_app.agents_search_events.utm_source
      - datalake_amplitude_agents_app.agents_search_events.utm_medium
      - datalake_amplitude_agents_app.agents_search_events.ts_event
    description: First UTM medium observed for the user during the day, derived via UTM taxonomy join and ordered by event timestamp.
  total_events:
    lineage:
      - datalake_amplitude_agents_app.agents_search_events.event_type
    description: Total number of events generated by the user in the day.
  total_sale_events:
    lineage:
      - datalake_amplitude_agents_app.agents_search_events.business_context
    description: Total number of events within the Sale business context.
  total_sale_events_search_page_viewed:
    lineage:
      - datalake_amplitude_agents_app.agents_search_events.business_context
      - datalake_amplitude_agents_app.agents_search_events.event_type
    description: Sale context events where the search page (or results page) was viewed.
  total_sale_events_search_page_viewed_map:
    lineage:
      - datalake_amplitude_agents_app.agents_search_events.business_context
      - datalake_amplitude_agents_app.agents_search_events.event_type
      - datalake_amplitude_agents_app.agents_search_events.search_type
    description: Sale search page viewed events triggered from map context.
  total_sale_events_search_page_viewed_bar:
    lineage:
      - datalake_amplitude_agents_app.agents_search_events.business_context
      - datalake_amplitude_agents_app.agents_search_events.event_type
      - datalake_amplitude_agents_app.agents_search_events.search_type
    description: Sale search page viewed events triggered from search bar context.
  total_sale_events_search_page_viewed_deeplink:
    lineage:
      - datalake_amplitude_agents_app.agents_search_events.business_context
      - datalake_amplitude_agents_app.agents_search_events.event_type
      - datalake_amplitude_agents_app.agents_search_events.search_type
    description: Sale search page viewed events triggered from deeplink.
  total_sale_events_search_page_viewed_copilot:
    lineage:
      - datalake_amplitude_agents_app.agents_search_events.business_context
      - datalake_amplitude_agents_app.agents_search_events.event_type
      - datalake_amplitude_agents_app.agents_search_events.search_type
    description: Sale search page viewed events triggered from copilot.
  total_sale_events_search_subscription:
    lineage:
      - datalake_amplitude_agents_app.agents_search_events.business_context
      - datalake_amplitude_agents_app.agents_search_events.event_type
    description: Sale events related to alert subscriptions (subscription confirmed).
