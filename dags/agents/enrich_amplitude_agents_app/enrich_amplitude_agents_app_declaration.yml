---
dag:
  name: enrich_amplitude_agents_app
  schedule_start_date: 2024, 5, 22
  owner: Data Agents
  documentation:
    dag_purpose: This DAG processes the amplitude data related to the events generated by the Agents in the mobile application "Agents APP" and on the Tenant's property search website.
workflow:
  type: query_delta
  layer: enrich
  inner_dependencies:
    broker_app_events:
      - agents_native_events
      - agents_search_events
  default_extraction_type: incremental
  default_partitions: [year, month, day]
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, ds, 'load_end_date') }}"
cluster:
  type: databricks_12_2_med_io-general_cluster
