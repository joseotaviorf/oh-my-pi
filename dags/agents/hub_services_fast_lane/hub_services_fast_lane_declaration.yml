dag:
  name: hub_services_fast_lane
  schedule_start_date: 2026, 4, 1
  schedule_interval: 0 0,6,10,14,20 * * *
  owner: Data Agents
  documentation:
    dag_purpose: |
      This DAG imports the tables from [HubServices](https://github.com/quintoandar/hubs), a service that centralizes hub data.
workflow:
  type: cdc
  layer: raw
  database_type: postgres
  dbutils_secret_key: HUBS_DB
  lineage_product_database_name: hubservices
  source_schema: public
  source_database: hubs
  custom_schema: hub_services
  tables_customization:
    member_profile: {}
    users: {}
cluster:
  type: databricks_16_4_small_general_fleet_xlarge_single_node
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
  databricks_conn_id: databricks_new