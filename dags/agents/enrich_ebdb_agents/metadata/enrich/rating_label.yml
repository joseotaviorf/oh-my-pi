---
database_name: datalake_ebdb_agents
table_name: rating_label
description: Table that has rating labels information related to a rental agent or a property.
  Each line is an unique rating label identified by its id.
domain: Agents
owner: data-ae-agents@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_ebdb_clean.rating_label.id
    description: Id of the rating label.
  description:
    lineage:
      - datalake_ebdb_clean.rating_label.description
    description: Description of the rating label.
  label:
    lineage:
      - datalake_ebdb_clean.rating_label.label
    description: The name of the rating label.
  rating_reference:
    lineage:
      - datalake_ebdb_clean.rating_label.rating_reference
    description: The number reference of the rating on the form.
  rating_target:
    lineage:
      - datalake_ebdb_clean.rating_label.rating_target
    description: Who/what is the rating target.
    categories:
      House: The target is the property house.
      RealEstateAgent: The target is the real estate agent.
  order:
    lineage:
      - datalake_ebdb_clean.rating_label.order
    description: The order of the rating label.
  has_complementary_info_requirement:
    lineage:
      - datalake_ebdb_clean.rating_label.has_complementary_info_requirement
    description: Boolean flag indicating if the rating label requires complement information from the person that is fulfilling the form.
  is_active:
    lineage:
      - datalake_ebdb_clean.rating_label.is_active
    description: Boolean flag indicating if the rating label is currently active or not.
  is_label_punctuality:
    description: Boolean flag indicating if the rating label is related to the agent's ponctuality.
  is_label_agent_well_informed:
    description: Boolean flag indicating if the rating label is related to the agent being well informed.
  is_label_kindness:
    description: Boolean flag indicating if the rating label is related to the agent being kind.
  is_label_no_kindness:
    description: Boolean flag indicating if the rating label is related to the agent not being king with the person.
  is_label_house_as_listing:
    description: Boolean flag indicating if the rating label is related to the property being equals to what is announced on the listing.
  is_label_house_not_as_listing:
    description: Boolean flag indicating if the rating label is related to the property not being how it is announced on the listing.
  is_label_other_reason_positive:
    description: Boolean flag indicating if the rating label is related to another reason related to the rating
      (it requires complementary info).
  is_label_other_reason_negative:
    description: Boolean flag indicating if the rating label is related to another reason related to the rating
      (it requires complementary info).
  is_label_agent_late:
    description: Boolean flag indicating if the rating label is related to the agent being late to the visit.
  is_label_agent_with_no_info:
    description: Boolean flag indicating if the rating label is related to the agent not having much information.
  ts_created:
    lineage:
      - datalake_ebdb_clean.rating_label.ts_created
    description: Timestamp of when the rating label was created.
  ts_updated:
    lineage:
      - datalake_ebdb_clean.rating_label.ts_updated
    description: Timestamp of when the rating label was updated.
