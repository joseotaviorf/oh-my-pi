---
database_name: datalake_ebdb_agents
table_name: agents_weekly_schedule_history
description: Enrich table with the weekly schedule history for agent booking. 
  Each row of this table is a time slot for a agent. 
  A slot is a 15 minute slice of an hour (e.g. 08:00, 08:15, 08:30 and 08:45).
domain: Data Agents
owner: data-ae-agents@quintoandar.com.br
columns:
  id_agent:
    lineage:
      - datalake_ebdb_clean.agent_weekly_hours_aud.id_agent
    description: Agent ID (dados_agente_id)
  agent_type:
    lineage:
      - datalake_ebdb_clean.agent_data_types.types
    description: Agent type
    categories:
      Vistoria: Inspection
      Visita: Visit
      VistoriaQuarteirizada: Quarterly inspection
      CheckUpLar: Check-up Lar (repairs)
      SessaoFotos: Photo session
  day_of_week:
    lineage:
      - datalake_ebdb_clean.agent_weekly_hours_aud.day_of_week
    description: Day of week (starting on mondays)
  slot_number:
    lineage:
      - datalake_ebdb_clean.agent_weekly_hours_aud.has_hours_between_08_and_09_available
      - datalake_ebdb_clean.agent_weekly_hours_aud.has_hours_between_09_and_10_available
      - datalake_ebdb_clean.agent_weekly_hours_aud.has_hours_between_10_and_11_available
      - datalake_ebdb_clean.agent_weekly_hours_aud.has_hours_between_11_and_12_available
      - datalake_ebdb_clean.agent_weekly_hours_aud.has_hours_between_12_and_13_available
      - datalake_ebdb_clean.agent_weekly_hours_aud.has_hours_between_13_and_14_available
      - datalake_ebdb_clean.agent_weekly_hours_aud.has_hours_between_14_and_15_available
      - datalake_ebdb_clean.agent_weekly_hours_aud.has_hours_between_15_and_16_available
      - datalake_ebdb_clean.agent_weekly_hours_aud.has_hours_between_16_and_17_available
      - datalake_ebdb_clean.agent_weekly_hours_aud.has_hours_between_17_and_18_available
      - datalake_ebdb_clean.agent_weekly_hours_aud.has_hours_between_18_and_19_available
      - datalake_ebdb_clean.agent_weekly_hours_aud.has_hours_between_19_and_20_available
    description: Slot number (8:00 = 0, 08:15 = 1, 08:30 = 2...)
  is_available_slot:
    lineage:
      - datalake_ebdb_clean.agent_weekly_hours_aud.has_hours_between_08_and_09_available
      - datalake_ebdb_clean.agent_weekly_hours_aud.has_hours_between_09_and_10_available
      - datalake_ebdb_clean.agent_weekly_hours_aud.has_hours_between_10_and_11_available
      - datalake_ebdb_clean.agent_weekly_hours_aud.has_hours_between_11_and_12_available
      - datalake_ebdb_clean.agent_weekly_hours_aud.has_hours_between_12_and_13_available
      - datalake_ebdb_clean.agent_weekly_hours_aud.has_hours_between_13_and_14_available
      - datalake_ebdb_clean.agent_weekly_hours_aud.has_hours_between_14_and_15_available
      - datalake_ebdb_clean.agent_weekly_hours_aud.has_hours_between_15_and_16_available
      - datalake_ebdb_clean.agent_weekly_hours_aud.has_hours_between_16_and_17_available
      - datalake_ebdb_clean.agent_weekly_hours_aud.has_hours_between_17_and_18_available
      - datalake_ebdb_clean.agent_weekly_hours_aud.has_hours_between_18_and_19_available
      - datalake_ebdb_clean.agent_weekly_hours_aud.has_hours_between_19_and_20_available
    description: Boolean indicating if this slot is or was available for booking
  ts_slot:
    lineage:
      - datalake_ebdb_agents.slots_base_time.ts_slot
    description: Timestamp of the slot
  ts_updated:
    lineage:
      - datalake_ebdb_clean.agent_weekly_hours_aud.ts_updated
    description: Timestamp of the last update in the slot
