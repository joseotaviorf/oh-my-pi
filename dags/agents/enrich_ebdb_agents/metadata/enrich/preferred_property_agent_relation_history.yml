database_name: datalake_ebdb_agents
table_name: preferred_property_agent_relation_history
description: This table registers each house-listing preferred property agent relation from start to end date.
domain: Agents
owner: gustavo.rompe@quintoandar.com.br
columns:
  id_house_listing_relation:
    lineage:
      - datalake_ebdb_clean.house_listing_relation_aud.id_house_listing_relation
    description: Primary key - House-listing relation id
  id_house:
    lineage:
      - datalake_ebdb_clean.house_listing_relation_aud.id_house
    description: EBDB property identifier for the listing tied to the Preferred Property Agent; grain is one PPA assignment period per house and business context.
  id_listing_business_context:
    lineage:
      - datalake_ebdb_clean.house_listing_relation_aud.id_listing_business_context
    description: Surrogate key of the rent or sale listing business context row scoped to the house; determines whether the PPA relation applies to RENT or SALE.
  id_user_related_agent:
    lineage:
      - datalake_ebdb_user.user.id
    description: id user (main) of the partner related to the house
  id_related_agent:
    lineage:
      - datalake_ebdb_user.user.id_agent
    description: id agent of the partner related to the house
  business_context:
    lineage:
      - datalake_ebdb_listing.listing_business_context.is_rent_context
      - datalake_ebdb_listing.listing_business_context.is_sale_context
    description: house-listing business context
  ts_relation_started:
    lineage:
      - datalake_ebdb_user.user_revision_entity.ts_revision
    description: For relationships with a creation date of 2025-06-03, the rule works as follows
      It first checks whether the property was published between 2025-02-12 (program launch) and 2025-06-03 (table creation date).If true, the first listing date becomes the relationship start date.
      If false, and the relationship creation date is still 2025-06-03, the rule then checks whether the publication date is before 2025-02-12.If so, it sets 2025-02-12 as the relationship start date.
      Otherwise, it keeps the start date already recorded in the table.
  ts_relation_ended:
    lineage:
      - datalake_ebdb_user.user_revision_entity.ts_revision
    description: relation exclusion date
