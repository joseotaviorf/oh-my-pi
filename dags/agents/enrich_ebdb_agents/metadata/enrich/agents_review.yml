---
database_name: datalake_ebdb_agents
table_name: agents_review
description: Enrich table containing information about an agent's review related to a visit booked.
domain: Agents
owner: data-ae-agents@quintoandar.com.br
columns:
  id_booking:
    lineage:
      - datalake_ebdb_clean.booking.id
    description: ID of the booking. It can be joined with dw_public.dim_booking.
  rating:
    lineage:
      - datalake_ebdb_clean.real_estate_agent_rating.rating
    description: Rating (range 0-5) given to the real state agent review.
  tag_other:
    lineage:
      - datalake_ebdb_clean.real_estate_agent_rating.complementary_info
    description: Complementary information of the review.
  is_punctual:
    lineage:
      - datalake_ebdb_agents.rating_label.is_label_punctuality
    description: Boolean indicating whether the review is related to the agent's punctuality.
  is_agent_well_informed:
    lineage:
      - datalake_ebdb_agents.rating_label.is_label_agent_well_informed
    description: Boolean indicating whether the review is related to the agent being well informed.
  is_kind:
    lineage:
      - datalake_ebdb_agents.rating_label.is_label_kindness
    description: Boolean indicating whether the review is related to the agent being kind.
  is_not_kind:
    lineage:
      - datalake_ebdb_agents.rating_label.is_label_no_kindness
    description: Boolean indicating whether the review is related to the agent not being kind.
  is_house_as_listing:
    lineage:
      - datalake_ebdb_agents.rating_label.is_label_house_as_listing
    description: Boolean indicating whether the review is related to the property being the same as announced on the listing.
  is_house_not_as_listing:
    lineage:
      - datalake_ebdb_agents.rating_label.is_label_house_not_as_listing
    description: Boolean indicating whether the review is related to the property not being the same as announced on the listing.
  is_other_positive_reason:
    lineage:
      - datalake_ebdb_agents.rating_label.is_label_other_reason_positive
    description: Boolean indicating whether the review is related to another positive reason.
  is_other_negative_reason:
    lineage:
      - datalake_ebdb_agents.rating_label.is_label_other_reason_negative
    description: Boolean indicating whether the review is related to another negative reason.
  is_agent_late:
    lineage:
      - datalake_ebdb_agents.rating_label.is_label_agent_late
    description: Boolean indicating whether the review is related to the agent being late to the visit.
  is_agent_without_info:
    lineage:
      - datalake_ebdb_agents.rating_label.is_label_agent_with_no_info
    description: Boolean indicating whether the review is related to the agent not having much information.
  ts_rating_created:
    lineage:
      - datalake_ebdb_clean.real_estate_agent_rating.ts_created
    description: Timestamp of when the review was created.
