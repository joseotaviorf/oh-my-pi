---
database_name: datalake_ebdb_agents
table_name: agent_business_context_history
description: Enrich table that contains the history of agent's relation to sale and rental business contexts. Each row is a period that the agent served in a business context.
domain: Agents
owner: data-ae-agents@quintoandar.com.br
columns:
  id_agent_data:
    lineage:
      - datalake_ebdb_clean.agent_data_business_contexts_served_aud.id_agent_data
    description: Agent ID (dados_agente_id)
  agent_business_context:
    lineage:
      - datalake_ebdb_clean.agent_data_business_contexts_served_aud.business_context
    description: Business context served
    categories:
      RENT: For Rent business context
      SALE: For Sale business context
  ts_agent_business_context_started:
    lineage:
      - datalake_ebdb_clean.user_revision_entity.ts_revision
    description: Timestamp of when the agent started serving in this business context
  ts_agent_business_context_ended:
    lineage:
      - datalake_ebdb_clean.user_revision_entity.ts_revision
    description: Timestamp of when the agent stopped serving in this business context (null if he is currently serving in this business context)