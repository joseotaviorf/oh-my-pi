---
dag:
  name: enrich_ebdb_agents
  schedule_start_date: 2020, 7, 1
  owner: Data Agents
  documentation:
    dag_purpose: Creates enriched tables for the context `Agents` of ebdb. Mainly, related to agents availability/slots.
workflow:
  type: query
  layer: enrich
  inner_dependencies:
    agent_coincident_business_contexts:
    - agent_business_context_history
    agent_unified_contract_changes:
    - agent_coincident_business_contexts
    - agents_activations_suspensions_contracts_changes
    agents_slots:
    - agents_specific_weekly_schedule
    - agents_weekly_schedule_history
    agents_slots_hourly:
    - agents_slots
    agents_weekly_schedule_history:
    - slots_base_time
    agents_review:
    - rating_label
    agent_region_group:
    - agents_region
    - agents_slots
  tables_customization:
    agents_activations_suspensions_contracts_changes:
      extraction_type: incremental
      partitions:
      - year
      - month
      - day
    agent_region_group:
      extraction_type: incremental
      partitions:
      - year
      - month
      - day
    agents_slots:
      extraction_type: incremental
      partitions:
      - year
      - month
      - day
    agents_slots_hourly:
      extraction_type: incremental
      partitions:
      - year
      - month
      - day
cluster:
  type: databricks_12_2_med_general_photon_cluster
