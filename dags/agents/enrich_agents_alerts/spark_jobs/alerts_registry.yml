alerts:
  prospect_waiting_conversion_6h:
    description: Prospect agents stuck in WAITING_CONVERSION for more than 6 hours.
    channel: "#alerts_agent_accreditation"
    cron: "0 * * * *"
    threshold: 0
    severity: Error
    id_column: id_prospect_agent
    value_column: hours_over_threshold
    criteria_sql: |
      SELECT
        pa.id_prospect_agent,
        (UNIX_TIMESTAMP(CURRENT_TIMESTAMP()) - UNIX_TIMESTAMP(pa.ts_updated)) / 3600.0 - 6 AS hours_over_threshold
      FROM datalake_agent_accreditation.prospect_agent AS pa
      WHERE pa.status = 'WAITING_CONVERSION'
        AND pa.ts_updated <= CURRENT_TIMESTAMP() - INTERVAL 6 HOURS
