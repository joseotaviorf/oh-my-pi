database_name: dw_secretariat
table_name: dim_secretariat_user_version
description: Table that shows the history of allocation of a secretariat to its team.
domain: Agents
owner: data-ae-agents@quintoandar.com.br
columns:
  sk_secretariat_user_version:
    description: Primary key of the table, formed by the combination of the secretariat user ID and the allocation version.
  id_secretariat_user:
    description: Secretariat user ID, foreign key to dw_public.dim_user.
    lineage:
      - datalake_hub_services.secretariat_allocation_history.id_secretariat_user
  id_business_unit:
    description: ID of the business unit allocation.
    lineage:
      - datalake_hub_services.secretariat_allocation_history.id_business_unit
  allocation:
    description: Allocation of the secretariat user at the time between ts_allocation_started and ts_allocation_ended.
    lineage:
      - datalake_hub_services.secretariat_allocation_history.allocation
  segment:
    description: Segment of the secretariat user at the time between ts_allocation_started and ts_allocation_ended.
    lineage:
      - datalake_hub_services.secretariat_allocation_history.segment
  latest_allocation:
    description: Most recent allocation of the secretariat user.
    lineage:
      - datalake_hub_services.secretariat_allocation_history.allocation
  latest_segment:
    description: Most recent segment of the secretariat user.
    lineage:
      - datalake_hub_services.secretariat_allocation_history.segment
  profile:
    description: Profile of the secretariat user at the time between ts_allocation_started and ts_allocation_ended.
    lineage:
      - datalake_hub_services.secretariat_allocation_history.profile
  business_context:
    description: Business context of the secretariat user at the time between ts_allocation_started and ts_allocation_ended.
    lineage:
      - datalake_hub_services.secretariat_allocation_history.business_context
  name:
    description: Name of the secretariat user.
    lineage:
      - datalake_ebdb_user.user.name
  email:
    description: Email of the secretariat user.
    lineage:
      - datalake_ebdb_user.user.email
  main_phone:
    description: Main phone of the secretariat user.
    lineage:
      - datalake_ebdb_user.user.main_phone
  country_code:
    description: Country code of the secretariat user.
    lineage:
      - datalake_ebdb_user.user.country_code
  version:
    description: Version of the allocation.
    lineage:
      - datalake_hub_services.secretariat_allocation_history.version
  is_last_version:
    description: Flag that indicates if the allocation is the most recent one.
  ts_allocation_started:
    description: Timestamp of the start of the allocation.
    lineage:
      - datalake_hub_services.secretariat_allocation_history.ts_allocation_started
  ts_allocation_ended:
    description: Timestamp of the end of the allocation. Null if the allocation is still active.
    lineage:
      - datalake_hub_services.secretariat_allocation_history.ts_allocation_ended
  ts_load:
    description: Timestamp of the load of the record.
