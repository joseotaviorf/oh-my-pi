dag:
  name: dw_secretariat_user
  owner: Data Agents
  documentation:
    dag_purpose: Creates tables in dw_secretariat, associated with the context of secretariat user.
workflow:
  type: query_delta
  layer: dw
  custom_schema: secretariat
cluster:
  type: databricks_12_2_xmin_memory_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
