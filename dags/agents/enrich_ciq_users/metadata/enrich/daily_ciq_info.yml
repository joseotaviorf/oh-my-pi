---
database_name: datalake_ciq
table_name: daily_ciq_info
description: |
  Daily snapshot of CIQ partner status and related demand-side agent context (visit broker).
  Expands each ciq_users status interval to calendar days, keeps the latest status version
  per partner per reference date, and enriches with agent profile, business context,
  accreditation, and Portfolio Manager login counts.
domain: Agents
owner: anne.macedo@quintoandar.com.br
columns:
  id_partner:
    description: >
      CIQ partner id from ciq_users for the daily snapshot grain of one row per
      partner per reference date across supply and demand accreditation context.
    lineage:
      - datalake_ebdb_agents.ciq_users.id_partner
  id_user:
    description: >
      User id of the CIQ on the reference date, taken from the latest ciq_users status
      revision whose interval covers dt_reference (is_last_status_by_date).
    lineage:
      - datalake_ebdb_agents.ciq_users.id_user
      - datalake_ebdb_agents.ciq_users.ts_agent_status_start
  id_agent:
    description: >
      Visit-broker agent id when the CIQ is also registered as an agent in ebdb;
      coalesced to -1 when the partner has no agent registration on that day.
    lineage:
      - datalake_ebdb_user.user.id_agent
  id_work_contract:
    description: Unique Work Contract Identifier.
    lineage:
      - datalake_agent_accreditation.agent_registration_actions_log.id_work_contract
  ciq_status:
    description: >
      CIQ active/inactive status on the reference date, from the latest ciq_users status
      revision whose interval covers dt_reference.
    lineage:
      - datalake_ebdb_agents.ciq_users.status
      - datalake_ebdb_agents.ciq_users.ts_agent_status_start
  qty_logins:
    description: Number of login performed by CIQ in Portfolio Manager.
  agent_profile:
    description: >
      Agent performance profile on the reference date, matched over the agent_profile
      ts_revision_started/ts_revision_ended validity window when the CIQ is also an agent.
    lineage:
      - datalake_agent_accreditation.agent_profile.profile
      - datalake_agent_accreditation.agent_profile.ts_revision_started
      - datalake_agent_accreditation.agent_profile.ts_revision_ended
    categories:
      "Visita": "Agents who are responsible for conducting property visits"
      "Inspection": "Agents responsible for conducting property inspections before the tenant moves into the property and after the end of the contract"
      "Photo Session": "Photographer agents responsible for taking photos of the properties that will be published"
      "Quarterly Inspection": "Outsourced agents who are responsible for conducting property visits"
      "CheckUpLar": "Agents responsible for performing/analyzing reported repairs to the properties"
      "N/A" : "The user in question is a CIQ only and has no Agent information."
  business_context:
    description: |
      Business context assigned to the CIQ on the reference date, matched via Dados Agente
      id (`id_agent_data`) over the contiguous revision window; Sale, Rent, or N/A when none applies.
    categories:
      "SALE": "The agent is responsible for conducting visits with potential buyers for properties on sale."
      "RENT": "The agent is responsible for conducting visits with potential tenants for rental properties."
      "N/A": "The agent is not assigned to a specific business context during this period."
    lineage:
      - datalake_agent_accreditation.business_context.business_context
      - datalake_agent_accreditation.business_context.id_agent_data
      - datalake_agent_accreditation.business_context.ts_revision_started
      - datalake_agent_accreditation.business_context.ts_revision_ended
  is_agent_active:
    description: Indicates whether the Agent has an active registration.
    lineage:
      - datalake_agent_accreditation.agent_registration_actions_log.is_active
  accreditation_status:
    description: Describes what action was performed on the Agent registration.
    categories:
      "Accreditation": "The agent has been officially accredited and registered in the system for the first time."
      "First activation after accreditation": "The agent has been activated for the first time after the initial accreditation process."
      "De-accreditation": "The agent's accreditation has been revoked, making them ineligible to operate."
      "Re-accreditation": "The agent has been re-accredited after a previous de-accreditation, restoring their ability to operate."
      "N/A" : "The user in question is a CIQ only and has no Agent accreditation information."
    lineage:
      - datalake_agent_accreditation.agent_registration_actions_log.action
  visit_agent_type:
    description: "Describe the type of Visiting Agent: Whether it is a 5A agent or associated with a partner real estate agency"
    categories:
      "CORRETOR_5A": "Visiting Agents who have a contract directly with 5A."
      "CORRETOR_REDE": "Visiting Agents who are associated with a real estate agency that is a partner of 5A."
      "N/A": "The user in question is a CIQ only and has no Agent information."
    lineage:
      - datalake_agent_accreditation.agent_registration_actions_log.visit_agent_type
  dt_reference:
    description: >
      Calendar date of the daily CIQ snapshot, one row per partner per day between
      ts_agent_status_start and ts_agent_status_end (or load_end_date when still active).
    lineage:
      - datalake_ebdb_agents.ciq_users.ts_agent_status_start
      - datalake_ebdb_agents.ciq_users.ts_agent_status_end
  year:
    description: When the record was created or updated. It's a partition.
    lineage:
      - datalake_quintoandar.aux_date.year
  month:
    description: When the record was created or updated. It's a partition.
    lineage:
      - datalake_quintoandar.aux_date.month
  day:
    description: When the record was created or updated. It's a partition.
    lineage:
      - datalake_quintoandar.aux_date.day