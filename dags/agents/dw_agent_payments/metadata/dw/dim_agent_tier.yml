  qualifier_min_points_fl_rent:
    lineage:
      - datalake_big_agent.tier_rule.qualifier_min_points_fl_rent
    description: Minimum trigger points for the first listing rent operation on the qualifier score rule.
  qualifier_min_points_ccv:
    lineage:
      - datalake_big_agent.tier_rule.qualifier_min_points_ccv
    description: Minimum trigger points for the CCV operation on the qualifier score rule linked to this tier.
  qualifier_min_points_sale:
    lineage:
      - datalake_big_agent.tier_rule.qualifier_min_points_sale
    description: Minimum trigger points for the first listing sale operation on the qualifier score rule.
  qualifier_min_points_tqc:
    lineage:
      - datalake_big_agent.tier_rule.qualifier_min_points_tqc
    description: Minimum trigger points for the TQC operation on the qualifier score rule linked to this tier.
  qualifier_multiplier_cs:
    lineage:
