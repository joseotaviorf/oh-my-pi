database_name: dw_agent_payments
table_name: fact_earnings
description: Fact table projecting Big Agent earnings with contract, sales flow, receiver, and tier context from enrich_big_agent_incentives.
domain: Agents
owner: gustavo.rompe@quintoandar.com.br
columns:
  sk_earning:
    lineage:
    - datalake_big_agent.earnings.id_earning
    description: Primary identifier of the earning record in Big Agent.
  sk_earning_source:
    lineage:
    - datalake_big_agent.earnings.id_earning_source
    description: Identifier of the earning source that originated this earning.
  sk_revenue_share:
    lineage:
    - datalake_big_agent.earnings.id_revenue_share
    description: Revenue share identifier linked to the earning calculation.
  sk_contract:
    lineage:
    - datalake_big_agent.earnings.id_contract
    description: EBDB contract identifier when the earning source external domain type is RENT_CONTRACT.
  sk_sales_flow:
    lineage:
    - datalake_big_agent.earnings.id_sales_flow
    description: Sales flow identifier when the earning source external domain type is SALES_FLOW.
  sk_author:
    lineage:
    - datalake_big_agent.earnings.id_author
    description: Author identifier from the earning payload when author_role is not SYSTEM; otherwise null.
  uuid_cart:
    lineage:
    - datalake_big_agent.earnings.uuid_cart
    description: Cart UUID from the earning source external cart UUID when a matching cart exists.
  sk_business_unit:
    lineage:
    - datalake_big_agent.earnings.id_business_unit
    description: Hub business unit from the linked tier rule when revenue share relation type is TIER; otherwise null.
  uuid_company:
    lineage:
    - datalake_big_agent.earnings.uuid_company
    description: Company receiver UUID when external_receiver_type is COMPANY; otherwise null.
  uuid_person:
    lineage:
    - datalake_big_agent.earnings.uuid_person
    description: Agent receiver person UUID when external_receiver_type is AGENT; otherwise null.
  business_context:
    lineage:
    - datalake_big_agent.earnings.business_context
    description: Business context derived from external domain type as RENT for RENT_CONTRACT or SALE for SALES_FLOW.
  domain_type:
    lineage:
    - datalake_big_agent.earnings.domain_type
    description: External domain type discriminator from the earning source (for example RENT_CONTRACT or SALES_FLOW).
  incentive_system:
    lineage:
    - datalake_big_agent.earnings.incentive_system
    description: Incentive system label that produced this earning (for example DEMAND_CONVERSION_FS).
  calculated_from:
    lineage:
    - datalake_big_agent.earnings.calculated_from
    description: Basis used to calculate the earning (amount or percentage).
  currency:
    lineage:
    - datalake_big_agent.earnings.currency
    description: Currency code applied to monetary fields on the earning.
  external_receiver_type:
    lineage:
    - datalake_big_agent.earnings.external_receiver_type
    description: Type discriminator for the external receiver.
  earning_status:
    lineage:
    - datalake_big_agent.earnings.earning_status
    description: Processing status of the earning record.
  earning_status_reason:
    lineage:
    - datalake_big_agent.earnings.earning_status_reason
    description: Business reason attached to the earning status when applicable.
  invalidation_reason:
    lineage:
    - datalake_big_agent.earnings.invalidation_reason
    description: Business reason attached to the earning invalidation when applicable.
  earning_source_status:
    lineage:
    - datalake_big_agent.earnings.earning_source_status
    description: Processing status of the parent earning source.
  earning_source_status_reason:
    lineage:
    - datalake_big_agent.earnings.earning_source_status_reason
    description: Failure or rejection reason on the earning source when status indicates an error.
  revenue_share_relation_type:
    lineage:
    - datalake_big_agent.earnings.revenue_share_relation_type
    description: Relation type of the revenue share linked to the earning (for example TIER).
  revenue_share_type:
    lineage:
    - datalake_big_agent.earnings.revenue_share_type
    description: Type of the revenue share linked to the earning.
  base_amount:
    lineage:
    - datalake_big_agent.earnings.base_amount
    description: Base monetary amount from the earning source used as calculation input, rounded to two decimal places.
  revenue_share_total_amount:
    lineage:
    - datalake_big_agent.earnings.revenue_share_total_amount
    description: Total revenue share amount configured on the earning source, rounded to two decimal places.
  revenue_amount:
    lineage:
    - datalake_big_agent.earnings.revenue_amount
    description: Revenue amount calculated for this earning, rounded to two decimal places.
  revenue_percentage:
    lineage:
    - datalake_big_agent.earnings.revenue_percentage
    description: Revenue percentage calculated for this earning (brokerage share component), rounded to two decimal places.
  incentive_engine_external_condition_type:
    lineage:
    - datalake_big_agent.earnings.incentive_engine_external_condition_type
    description: External condition type from the linked tier rule when revenue share relation type is TIER; otherwise null.
  tier_name:
    lineage:
    - datalake_big_agent.earnings.tier_name
    description: Display name of the tier linked through the revenue share when relation type is TIER; otherwise null.
  tier_priority:
    lineage:
    - datalake_big_agent.earnings.tier_priority
    description: Priority order of the tier linked through the revenue share when relation type is TIER; otherwise null.
  classifier_min_score:
    lineage:
    - datalake_big_agent.earnings.classifier_min_score
    description: Minimum classifier score from the linked tier rule when revenue share relation type is TIER; otherwise null.
  classifier_resume:
    lineage:
    - datalake_big_agent.earnings.classifier_resume
    description: Array summary of classifier points rules from the linked tier rule when revenue share relation type is TIER; otherwise null.
  qualifier_min_score:
    lineage:
    - datalake_big_agent.earnings.qualifier_min_score
    description: Minimum qualifier score from the linked tier rule when revenue share relation type is TIER; otherwise null.
  qualifier_resume:
    lineage:
    - datalake_big_agent.earnings.qualifier_resume
    description: Array summary of qualifier points rules from the linked tier rule when revenue share relation type is TIER; otherwise null.
  is_authored_by_system:
    lineage:
    - datalake_big_agent.earnings.is_authored_by_system
    description: True when author_role is SYSTEM.
  ts_created:
    lineage:
    - datalake_big_agent.earnings.ts_created
    description: Timestamp when the earning was created in Big Agent.
  ts_invalidated:
    lineage:
    - datalake_big_agent.earnings.ts_invalidated
    description: Timestamp when the earning was invalidated in Big Agent.
  ts_updated:
    lineage:
    - datalake_big_agent.earnings.ts_updated
    description: Timestamp when the earning was last updated in Big Agent.
  dt_load:
    lineage:
    - datalake_big_agent.earnings.dt_load
    description: Load reference date derived from the earning creation timestamp.
  year:
    lineage:
    - datalake_big_agent.earnings.year
    description: Partition year derived from ts_created.
  month:
    lineage:
    - datalake_big_agent.earnings.month
    description: Partition month derived from ts_created.
  day:
    lineage:
    - datalake_big_agent.earnings.day
    description: Partition day derived from ts_created.
