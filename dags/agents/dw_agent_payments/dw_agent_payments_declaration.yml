---
dag:
  name: dw_agent_payments
  schedule_start_date: 2026, 6, 25
  owner: Data Agents
  criticality: High
  documentation:
    dag_purpose: |
      DW layer for Big Agent Incentives Engine. Projects enrich_big_agent_incentives
      tables into dimensional and fact models for analytics consumption.
workflow:
  type: query_delta
  layer: dw
  custom_schema: agent_payments
  default_extraction_type: incremental
  default_partitions: [year, month, day]
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  tables_customization:
    fact_earnings:
      merge_on: [sk_earning]
      z_order_by: [sk_contract, sk_sales_flow, sk_person]
    fact_partner_tier:
      merge_on: [sk_partner_tier]
      z_order_by: [sk_person, sk_tier]
    fact_earning_calculation_log:
      merge_on: [sk_calculation_log]
      z_order_by: [incentive_system]
    dim_tier:
      merge_on: [sk_tier]
      z_order_by: [sk_tier, incentive_system]
    dim_earning_sources:
      merge_on: [sk_earning_source]
      z_order_by: [sk_contract, sk_sales_flow, domain_type]
    fact_partner_payments:
      criticality: Critical
      merge_on: [sk_partner_payment]
      z_order_by: [sk_partner_payment, incentive_system]
