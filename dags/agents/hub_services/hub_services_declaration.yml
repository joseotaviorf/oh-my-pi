dag:
  name: hub_services
  schedule_start_date: 2021, 8, 10
  schedule_interval: 0 0 * * *
  owner: Data Agents
  documentation:
    dag_purpose: |
      This DAG imports the tables from [HubServices](https://github.com/quintoandar/hubs), a service that centralizes hub data.
workflow:
  type: cdc
  layer: raw
  database_type: postgres
  dbutils_secret_key: HUBS_DB
  lineage_product_database_name: hubservices
  source_schema: public
  source_database: hubs
  custom_schema: hub_services
  tables_customization:
    business_unit: {}
    business_unit_aud: {}
    business_unit_region: {}
    business_unit_region_aud: {}
    lead: {}
    lead_aud: {}
    member_profile: {}
    member_profile_aud: {}
    observation: {}
    observation_aud: {}
    region: {}
    region_aud: {}
    reminder: {}
    reminder_aud: {}
    reminder_type: {}
    reminder_type_aud: {}
    responsible: {}
    responsible_aud: {}
    revinfo: 
      clean_table_name: rev_info
    users: {}
    users_aud: {}
    visitor: {}
    visitor_aud: {}
    visitor_event: {}
    visitor_event_aud: {}
    visitor_prospection: {}
    visitor_prospection_aud: {}
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: m5a.xlarge
    node_type_id: m5a.xlarge
    num_workers: 2
    spark_version: 12.2.x-scala2.12
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
  databricks_conn_id: databricks_new