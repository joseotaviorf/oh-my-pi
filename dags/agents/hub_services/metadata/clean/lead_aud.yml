---
database_name: datalake_hub_services_clean
table_name: lead_aud
description: >
  Hibernate Envers audit history of Hub Services lead rows, including field-level change flags. Each row
  represents one revision of a lead and joins to rev_info on rev.
domain: Agents
owner: gustavo.rompe@quintoandar.com.br
columns:
  id:
    description: Lead surrogate key whose audited snapshot is stored in this revision row.
    lineage:
      - datalake_hub_services_raw.lead_aud.id
  id_house:
    description: House identifier associated with the lead at this revision.
    lineage:
      - datalake_hub_services_raw.lead_aud.house_id
  id_visitor:
    description: Visitor identifier linked to the lead at this revision.
    lineage:
      - datalake_hub_services_raw.lead_aud.visitor_id
  id_business_unit:
    description: Performance hub business unit handling the lead at this revision.
    lineage:
      - datalake_hub_services_raw.lead_aud.business_unit_id
  rev:
    description: Envers revision id; join to rev_info for the user and timestamp of the change.
    lineage:
      - datalake_hub_services_raw.lead_aud.rev
  rev_type:
    description: Envers revision type for this audit row (0 create, 1 update, 2 delete).
    lineage:
      - datalake_hub_services_raw.lead_aud.revtype
    categories:
      '0': Create
      '1': Update
      '2': Delete
  rev_end:
    description: Revision id that superseded this audit row, when the entity was updated again.
    lineage:
      - datalake_hub_services_raw.lead_aud.revend
  version:
    description: Optimistic locking version captured in this lead audit revision.
    lineage:
      - datalake_hub_services_raw.lead_aud.version
  message:
    description: Lead note text stored at this revision in Hub Services.
    lineage:
      - datalake_hub_services_raw.lead_aud.message
  business_context:
    description: Commercial line of the lead at this revision, such as rent or sale.
    lineage:
      - datalake_hub_services_raw.lead_aud.business_context
  lead_type:
    description: Hub Services lead type classification at this revision.
    lineage:
      - datalake_hub_services_raw.lead_aud.lead_type
  lead_status:
    description: Workflow status of the lead at this revision.
    lineage:
      - datalake_hub_services_raw.lead_aud.lead_status
  is_cancellation:
    description: Cancellation flag value on the lead at this revision.
    lineage:
      - datalake_hub_services_raw.lead_aud.cancellation
  is_secretariat:
    description: Flag indicating secretariat involvement on the lead at this revision.
    lineage:
      - datalake_hub_services_raw.lead_aud.is_secretariat
  mod_is_cancellation:
    description: Envers flag indicating whether is_cancellation changed in this revision.
    lineage:
      - datalake_hub_services_raw.lead_aud.cancellation_mod
  mod_is_secretariat:
    description: Envers flag indicating whether is_secretariat changed in this revision.
    lineage:
      - datalake_hub_services_raw.lead_aud.is_secretariat_mod
  mod_id_house:
    description: Envers flag indicating whether id_house changed in this revision.
    lineage:
      - datalake_hub_services_raw.lead_aud.house_id_mod
  mod_id_visitor:
    description: Envers flag indicating whether id_visitor changed in this revision.
    lineage:
      - datalake_hub_services_raw.lead_aud.visitor_id_mod
  mod_sent:
    description: Envers flag indicating whether the lead sent status changed in this revision.
    lineage:
      - datalake_hub_services_raw.lead_aud.sent_mod
  mod_message:
    description: Envers flag indicating whether the lead message changed in this revision.
    lineage:
      - datalake_hub_services_raw.lead_aud.message_mod
  ts_created:
    description: UTC timestamp when the lead row was created in the source application.
    lineage:
      - datalake_hub_services_raw.lead_aud.created_at
  ts_updated:
    description: UTC timestamp when the lead row was last updated in the source application.
    lineage:
      - datalake_hub_services_raw.lead_aud.updated_at
  year:
    description: Year partition of the clean load; filter with month and day for partition pruning.
    lineage:
      - datalake_hub_services_raw.lead_aud.year
  month:
    description: Month partition of the clean load; combine with year and day when querying history.
    lineage:
      - datalake_hub_services_raw.lead_aud.month
  day:
    description: Day partition of the clean load; always constrain year, month, and day together.
    lineage:
      - datalake_hub_services_raw.lead_aud.day
