---
database_name: datalake_hub_services_clean
table_name: reminder_type
owner: gustavo.rompe@quintoandar.com.br
domain: Agents
description: >
  Catalog of reminder templates in Hub Services that agents use to classify follow-up tasks. One row per
  reminder type id after deduplicating to the latest update from the Hubs Postgres CDC feed.
columns:
  id:
    description: Primary key of the reminder type in Hub Services.
    lineage:
      - datalake_hub_services_raw.reminder_type.id
  name:
    description: Human-readable label shown to agents when selecting or viewing the reminder type.
    lineage:
      - datalake_hub_services_raw.reminder_type.name
  status:
    description: Lifecycle flag indicating whether the reminder type is active in Hub Services.
    lineage:
      - datalake_hub_services_raw.reminder_type.status
  version:
    description: Optimistic locking version from the Hub Services source row.
    lineage:
      - datalake_hub_services_raw.reminder_type.version
  ts_created:
    description: UTC timestamp when the reminder type was created in Hub Services.
    lineage:
      - datalake_hub_services_raw.reminder_type.created_at
  ts_updated:
    description: UTC timestamp of the last update to the reminder type in Hub Services.
    lineage:
      - datalake_hub_services_raw.reminder_type.updated_at
  op_cdc:
    description: CDC operation type captured by Debezium.
    lineage:
      - datalake_hub_services_raw.reminder_type.op_cdc
    categories:
      r: Read/snapshot - initial load of existing records.
      c: Create - new record inserted.
      u: Update - existing record modified.
      d: Delete - record removed.
  ts_cdc_transaction:
    description: Timestamp when the CDC system captured this transaction (millisecond
      precision).
    lineage:
      - datalake_hub_services_raw.reminder_type.ts_cdc_transaction
  ts_database_transaction:
    description: Timestamp of the original database transaction in the source system.
    lineage:
      - datalake_hub_services_raw.reminder_type.ts_database_transaction
  year:
    description: Year partition of the clean load; filter with month and day for partition pruning.
    lineage:
      - datalake_hub_services_raw.reminder_type.year
  month:
    description: Month partition of the clean load; combine with year and day when querying history.
    lineage:
      - datalake_hub_services_raw.reminder_type.month
  day:
    description: Day partition of the clean load; always constrain year, month, and day together.
    lineage:
      - datalake_hub_services_raw.reminder_type.day
