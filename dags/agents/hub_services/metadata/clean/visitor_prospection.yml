---
database_name: datalake_hub_services_clean
table_name: visitor_prospection
owner: gustavo.rompe@quintoandar.com.br
domain: Agents
description: >
  Denormalized prospection queue row in Hub Services combining visitor, assigned agent, reminder, and lead
  priority fields used to sort agent worklists. One row per prospection id after keeping the latest update.
columns:
  id:
    description: Primary key of the visitor prospection record in Hub Services.
    lineage:
      - datalake_hub_services_raw.visitor_prospection.id
  id_visitor:
    description: Visitor being prospected in the agent queue.
    lineage:
      - datalake_hub_services_raw.visitor_prospection.visitor_id
  id_responsible:
    description: Hub user id of the agent responsible for this prospection task.
    lineage:
      - datalake_hub_services_raw.visitor_prospection.responsible_id
  id_reminder:
    description: Linked reminder id when the prospection row is tied to a scheduled follow-up.
    lineage:
      - datalake_hub_services_raw.visitor_prospection.reminder_id
  id_reminder_type:
    description: Reminder type catalog id denormalized onto the prospection row.
    lineage:
      - datalake_hub_services_raw.visitor_prospection.reminder_type_id
  priority_lead_status:
    description: Lead status bucket used to prioritize the visitor in agent queues.
    lineage:
      - datalake_hub_services_raw.visitor_prospection.priority_lead_status
  priority_lead_type:
    description: Lead type dimension used alongside status for queue ordering rules.
    lineage:
      - datalake_hub_services_raw.visitor_prospection.priority_lead_type
  reminder_type_name:
    description: Display name of the linked reminder type copied for list rendering without joins.
    lineage:
      - datalake_hub_services_raw.visitor_prospection.reminder_type_name
  reminder_status:
    description: Current status of the linked reminder on this prospection row.
    lineage:
      - datalake_hub_services_raw.visitor_prospection.reminder_status
  reminder_creation_method:
    description: How the linked reminder was created (manual, automated, import, etc.).
    lineage:
      - datalake_hub_services_raw.visitor_prospection.reminder_creation_method
  reminder_event_type:
    description: Visitor event type associated with the linked reminder, when applicable.
    lineage:
      - datalake_hub_services_raw.visitor_prospection.reminder_event_type
  sorting_order:
    description: Numeric rank assigned by Hub Services to order this row in agent worklists.
    lineage:
      - datalake_hub_services_raw.visitor_prospection.sorting_order
  version:
    description: Optimistic locking version from the Hub Services source row.
    lineage:
      - datalake_hub_services_raw.visitor_prospection.version
  ts_reminder:
    description: Local date and time when the linked reminder should fire for the agent.
    lineage:
      - datalake_hub_services_raw.visitor_prospection.reminder_date
  ts_created:
    description: UTC timestamp when the prospection row was created in Hub Services.
    lineage:
      - datalake_hub_services_raw.visitor_prospection.created_at
  ts_updated:
    description: UTC timestamp of the last update to the prospection row in Hub Services.
    lineage:
      - datalake_hub_services_raw.visitor_prospection.updated_at
  op_cdc:
    description: CDC operation type captured by Debezium.
    lineage:
      - datalake_hub_services_raw.visitor_prospection.op_cdc
    categories:
      r: Read/snapshot - initial load of existing records.
      c: Create - new record inserted.
      u: Update - existing record modified.
      d: Delete - record removed.
  ts_cdc_transaction:
    description: Timestamp when the CDC system captured this transaction (millisecond
      precision).
    lineage:
      - datalake_hub_services_raw.visitor_prospection.ts_cdc_transaction
  ts_database_transaction:
    description: Timestamp of the original database transaction in the source system.
    lineage:
      - datalake_hub_services_raw.visitor_prospection.ts_database_transaction
  year:
    description: Year partition of the clean load; filter with month and day for partition pruning.
    lineage:
      - datalake_hub_services_raw.visitor_prospection.year
  month:
    description: Month partition of the clean load; combine with year and day when querying history.
    lineage:
      - datalake_hub_services_raw.visitor_prospection.month
  day:
    description: Day partition of the clean load; always constrain year, month, and day together.
    lineage:
      - datalake_hub_services_raw.visitor_prospection.day
