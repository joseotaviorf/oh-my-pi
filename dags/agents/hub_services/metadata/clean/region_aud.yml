---
database_name: datalake_hub_services_clean
table_name: region_aud
description: Audit table, used to keep changes to region records as historical data.
domain: Agents
owner: data-ae-agents@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_hub_services_raw.region_aud.id
    description: Unique identifier of regions.
  id_business_unit:
    lineage:
      - datalake_hub_services_raw.region_aud.business_unit_id
    description: Identification id of the business unit that relates to the regions.
  rev:
    lineage:
      - datalake_hub_services_raw.region_aud.rev
    description: Unique id for this modification and can be joined with table rev_info to get more details.
  rev_type:
    lineage:
      - datalake_hub_services_raw.region_aud.revtype
    description: Modification type.
    categories:
      '0': Create
      '1': Update
      '2': Delete
  rev_end:
    lineage:
      - datalake_hub_services_raw.region_aud.revend
    description: ID of the revision that replaced the current entry.
  version:
    lineage:
      - datalake_hub_services_raw.region_aud.version
    description: Record version, identifies which records are older or newer.
  region_name:
    lineage:
      - datalake_hub_services_raw.region_aud.name
    description: Descriptive data about the name of the region.
  mod_region_name:
    lineage:
      - datalake_hub_services_raw.region_aud.name_mod
    description: Boolean that tells us if the region_name record has been modified
  mod_id_business_unit:
    lineage:
      - datalake_hub_services_raw.region_aud.business_unit_id_mod
    description: Boolean that tells us if the id_business_unit record has been modified
  ts_created:
    lineage:
      - datalake_hub_services_raw.region_aud.created_at
    description: Date the hub record was created
  ts_updated:
    lineage:
      - datalake_hub_services_raw.region_aud.updated_at
    description: Date the hub record was updated.
  year:
    lineage:
      - datalake_hub_services_raw.region_aud.year
    description: Year partition value.
  month:
    lineage:
      - datalake_hub_services_raw.region_aud.month
    description: Month partition value.
  day:
    lineage:
      - datalake_hub_services_raw.region_aud.day
    description: Day partition value.
