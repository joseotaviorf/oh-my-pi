  version:
    lineage:
      - datalake_hub_services_raw.business_unit.version
    description: Record version, identifies which records are older or newer.
  hub_name:
    lineage:
      - datalake_hub_services_raw.business_unit.name
    description: Identification name of each performance hub.
  business_context:
    lineage:
      - datalake_hub_services_raw.business_unit.business_context
