---
database_name: datalake_hub_services_clean
table_name: reminder
owner: gustavo.rompe@quintoandar.com.br
domain: Agents
description: >
  Latest agent reminder scheduled in Hub Services (Hubs Postgres), linked to a visitor and optionally to a
  visitor event. One row per reminder id after keeping the most recent update from raw.
columns:
  id:
    description: Primary key of the reminder in the Hub Services application.
    lineage:
      - datalake_hub_services_raw.reminder.id
  id_visitor:
    description: Visitor who should be contacted when the reminder fires.
    lineage:
      - datalake_hub_services_raw.reminder.visitor_id
  id_event:
    description: Visitor event that contextualizes the reminder, when the task relates to a visit lifecycle step.
    lineage:
      - datalake_hub_services_raw.reminder.event_id
  id_reminder_type:
    description: Foreign key to the reminder type catalog that defines the task template.
    lineage:
      - datalake_hub_services_raw.reminder.reminder_type_id
  status:
    description: Workflow status of the reminder in Hub Services (for example open, done, or canceled).
    lineage:
      - datalake_hub_services_raw.reminder.status
  created_by:
    description: Hub user id of the agent or staff member who created the reminder.
    lineage:
      - datalake_hub_services_raw.reminder.created_by
  closed_by:
    description: Hub user id who closed the reminder when the follow-up was completed or dismissed.
    lineage:
      - datalake_hub_services_raw.reminder.closed_by
  creation_method:
    description: Channel or UI flow used to create the reminder (manual, automated rule, import, etc.).
    lineage:
      - datalake_hub_services_raw.reminder.creation_method
  version:
    description: Optimistic locking version from the Hub Services source row.
    lineage:
      - datalake_hub_services_raw.reminder.version
  ts_reminder:
    description: Local date and time when the agent should act on this reminder in Hub Services.
    lineage:
      - datalake_hub_services_raw.reminder.date
  ts_created:
    description: UTC timestamp when the reminder row was inserted in Hub Services.
    lineage:
      - datalake_hub_services_raw.reminder.created_at
  ts_updated:
    description: UTC timestamp of the last mutation to the reminder in Hub Services.
    lineage:
      - datalake_hub_services_raw.reminder.updated_at
  ts_closed:
    description: UTC timestamp when the reminder was closed in Hub Services, if applicable.
    lineage:
      - datalake_hub_services_raw.reminder.closed_at
  year:
    description: Year partition of the clean load; filter with month and day for partition pruning.
    lineage:
      - datalake_hub_services_raw.reminder.year
  month:
    description: Month partition of the clean load; combine with year and day when querying history.
    lineage:
      - datalake_hub_services_raw.reminder.month
  day:
    description: Day partition of the clean load; always constrain year, month, and day together.
    lineage:
      - datalake_hub_services_raw.reminder.day
