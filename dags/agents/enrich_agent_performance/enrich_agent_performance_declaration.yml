dag:
  name: enrich_agent_performance
  owner: Data Agents
  schedule_start_date: 2026, 8, 28
  catchup: false
  documentation:
    dag_purpose: |
      Agents Performance enrich tables for demand acquisition, supply acquisition, 
      demand conversion and other metrics and concepts related to the quality and overall 
      activities of an agent.
workflow:
  type: query_delta
  layer: enrich
  custom_schema: agent_performance
  default_extraction_type: full
  tables_customization:
    fact_agent_demand_acquisition:
      extraction_type: full
      merge_on:
        - id_referral
        - rev
      z_order_by:
        - valid_from
        - id_user_referring_agent
        - id_lead
    visit_funnel_event:
      extraction_type: incremental
      merge_on: [id_visit]
      partitions: [year, month, day]
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, -2), 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
    reprocess_start_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, -90), 'reprocess_start_date') }}"