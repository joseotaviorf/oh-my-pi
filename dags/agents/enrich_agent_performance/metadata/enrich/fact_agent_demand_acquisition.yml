database_name: datalake_agent_performance
table_name: fact_agent_demand_acquisition
domain: Agents
owner: gustavo.rompe@quintoandar.com.br
description: |
  Accumulating snapshot fact table tracking agent-referred demand performance across sales
  and rental lifecycles. One row per referral audit version state (id_referral + rev).
  Tracks conversion milestones (Visits Booked, Visits Completed, Offers Submitted, Offers Accepted,
  and Rental Contracts Signed) alongside agent attribution flags (Same Agent vs. Different Agent)
  and Offer Specialist alignment metrics. PII attributes are excluded.
columns:
  id_referral:
    lineage:
      - datalake_ebdb_clean.agent_lead_referral_aud.id
    description: Primary key component. Unique identifier of the agent lead referral.
  rev:
    lineage:
      - datalake_ebdb_clean.agent_lead_referral_aud.rev
    description: Primary key component. Revision version number of the referral audit record.
  id_lead:
    lineage:
      - datalake_ebdb_clean.agent_lead_referral_aud.id_lead
      - datalake_sale_demand_events.sale_demand_events.id_buyer
      - datalake_rent_demand_events.rent_demand_events.id_tenant_prospect
    description: Identifier of the invited seeker/lead (buyer for Sale, tenant prospect for Rent).
  id_agent_data_referring:
    lineage:
      - datalake_ebdb_clean.agent_lead_referral_aud.id_agent
    description: Legacy DadosAgente identifier of the referring agent who sent the invite.
  id_user_referring_agent:
    lineage:
      - datalake_ebdb_agent_events.agent_unified_identity.id_user
    description: Unified EBDB user ID of the referring agent, resolved via legacy id_agent_data cross-walk.
  uuid_person_referring_agent:
    lineage:
      - datalake_ebdb_agent_events.agent_unified_identity.uuid_person
    description: Person UUID of the referring agent. Join dim_person at query time for PII attributes.
  referral_status:
    lineage:
      - datalake_ebdb_clean.agent_lead_referral_aud.status
    description: Lifecycle status of the referral at the given revision.
    categories:
      CONFIRMED: Lead accepted the referral.
      PENDING: Referral invite is open.
      EXPIRED: Referral expired without confirmation.
      INACTIVE: Referral marked inactive.
  valid_from:
    lineage:
      - datalake_ebdb_clean.agent_lead_referral_aud.ts_created
    description: Timestamp when this referral revision state became valid.
  valid_to:
    lineage:
      - datalake_ebdb_clean.agent_lead_referral_aud.ts_created
    description: Timestamp when this referral revision state was superseded by a newer revision. Null for active/latest revision.
  previous_status:
    lineage:
      - datalake_ebdb_clean.agent_lead_referral_aud.status
    description: Referral status immediately preceding this revision state.
  business_context:
    lineage:
      - datalake_ebdb_clean.agent_lead_referral_aud.business_context
    description: Business domain of the referral.
    categories:
      SALE: Referral intended for For Sale properties (TQC).
      RENT: Referral intended for For Rent properties (TQA).
  origin:
    lineage:
      - datalake_ebdb_clean.agent_lead_referral_aud.origin
    description: Product channel or feature through which the referral was generated.
    categories:
      REFERRAL: Standard referral code flow.
      SERVICE_LINK: Generated from a service link.
      SCHEDULING_LINK: Generated from a scheduling link.
  id_first_sale_flow:
    lineage:
      - datalake_sale_demand_events.sale_demand_events.id_sale_flow
    description: ID of the first Sale demand flow associated with this referral (from visit or offer).
  id_first_rent_flow:
    lineage:
      - datalake_rent_demand_events.rent_demand_events.id_rent_flow
    description: ID of the first Rent demand flow associated with this referral (from visit or offer).
  has_any_visits:
    description: True when at least one Sale or Rent visit booking event occurred during this referral revision state.
  has_any_offers:
    description: True when at least one Sale or Rent offer submission event occurred during this referral revision state.
  is_visit_same_agent:
    description: |
      Attribution metric for visits. True when the agent handling the first visit equals the referring agent (id_user_referring_agent).
      False when handled by a different agent. Null when no visit occurred.
  is_offer_same_agent:
    description: |
      Attribution metric for offers. True when the agent handling the first offer equals the referring agent (id_user_referring_agent).
      False when handled by a different agent. Null when no offer occurred.
      
  # ---------------------------------------------------------
  # STRUCT 1: invitation_agent_interactions
  # ---------------------------------------------------------
  invitation_agent_interactions:
    description: Struct containing interaction flags and timestamps strictly for events where the referring agent handled the interaction.
    fields:
      has_handled_visit:
        description: True when the referring agent personally conducted/handled at least one visit for this lead.
      has_handled_offer:
        description: True when the referring agent personally submitted/handled at least one offer for this lead.
      ts_sale_visit:
        description: Timestamp of the first Sale visit handled by the referring agent. Null if handled by another agent or no visit occurred.
      ts_sale_offer:
        description: Timestamp of the first Sale offer handled by the referring agent. Null if handled by another agent or no offer occurred.
      ts_rent_visit:
        description: Timestamp of the first Rent visit handled by the referring agent. Null if handled by another agent or no visit occurred.
      ts_rent_offer:
        description: Timestamp of the first Rent offer handled by the referring agent. Null if handled by another agent or no offer occurred.

  # ---------------------------------------------------------
  # STRUCT 2: sale_first_events
  # ---------------------------------------------------------
  sale_first_events:
    description: Struct capturing milestone facts, timestamps, and agent attributions for the first Sale lifecycle events on this referral.
    fields:
      id_booking:
        lineage:
          - datalake_sale_demand_events.sale_demand_events.id_booking
        description: ID of the booking associated with the first Sale visit.
      ts_visit_booked:
        lineage:
          - datalake_sale_demand_events.sale_demand_events.ts_event
        description: Timestamp when the first Sale visit was booked (sk_event_type = 1).
      ts_visit_completed:
        lineage:
          - datalake_sale_demand_events.sale_demand_events.ts_event
        description: Timestamp when the first Sale visit was marked completed (sk_event_type = 2).
      visit_id_agent:
        lineage:
          - datalake_sale_demand_events.sale_demand_events.id_agent
        description: Legacy DadosAgente ID of the agent who handled the first Sale visit.
      visit_id_user:
        lineage:
          - datalake_ebdb_agent_events.agent_unified_identity.id_user
        description: Unified EBDB user ID of the agent who handled the first Sale visit.
      visit_uuid_person:
        lineage:
          - datalake_ebdb_agent_events.agent_unified_identity.uuid_person
        description: Person UUID of the agent who handled the first Sale visit.
      id_offer:
        lineage:
          - datalake_sale_demand_events.sale_demand_events.id_offer
        description: ID of the first Sale offer submitted.
      ts_offer_submitted:
        lineage:
          - datalake_sale_demand_events.sale_demand_events.ts_event
        description: Timestamp when the first Sale offer was submitted (sk_event_type = 3).
      ts_offer_accepted:
        lineage:
          - datalake_sale_demand_events.sale_demand_events.ts_event
        description: Timestamp when the Sale offer was accepted (sk_event_type = 4).
      offer_id_agent:
        lineage:
          - datalake_sale_demand_events.sale_demand_events.id_agent
        description: Legacy DadosAgente ID of the agent who handled the first Sale offer.
      offer_id_user:
        lineage:
          - datalake_ebdb_agent_events.agent_unified_identity.id_user
        description: Unified EBDB user ID of the agent who handled the first Sale offer.
      offer_uuid_person:
        lineage:
          - datalake_ebdb_agent_events.agent_unified_identity.uuid_person
        description: Person UUID of the agent who handled the first Sale offer.

  # ---------------------------------------------------------
  # STRUCT 3: rent_first_events
  # ---------------------------------------------------------
  rent_first_events:
    description: Struct capturing milestone facts, timestamps, and agent attributions for the first Rent lifecycle events on this referral.
    fields:
      id_booking:
        lineage:
          - datalake_rent_demand_events.rent_demand_events.id_booking
        description: ID of the booking associated with the first Rent visit.
      ts_visit_booked:
        lineage:
          - datalake_rent_demand_events.rent_demand_events.ts_event
        description: Timestamp when the first Rent visit was booked (id_event_type = 1).
      ts_visit_completed:
        lineage:
          - datalake_rent_demand_events.rent_demand_events.ts_event
        description: Timestamp when the first Rent visit was marked completed (id_event_type = 2).
      visit_id_agent:
        description: Always null for Rent demand events (Rent uses user IDs directly).
      visit_id_user:
        lineage:
          - datalake_rent_demand_events.rent_demand_events.id_agent
        description: Unified EBDB user ID of the agent who handled the first Rent visit (rent_demand_events.id_agent is id_user directly).
      visit_uuid_person:
        description: Person UUID of the agent who handled the Rent visit. Null for legacy rental events.
      id_offer:
        lineage:
          - datalake_rent_demand_events.rent_demand_events.id_offer
        description: ID of the first Rent offer submitted.
      ts_offer_submitted:
        lineage:
          - datalake_rent_demand_events.rent_demand_events.ts_event
        description: Timestamp when the first Rent offer was submitted (id_event_type = 3).
      id_contract:
        lineage:
          - datalake_rent_demand_events.rent_demand_events.id_contract
        description: ID of the signed Rent contract.
      ts_contract_signed:
        lineage:
          - datalake_rent_demand_events.rent_demand_events.ts_event
        description: Timestamp when the Rent contract was signed (id_event_type = 9).
      offer_id_agent:
        description: Always null for Rent demand events (Rent uses user IDs directly).
      offer_id_user:
        lineage:
          - datalake_rent_demand_events.rent_demand_events.id_agent
        description: Unified EBDB user ID of the agent who handled the first Rent offer (rent_demand_events.id_agent is id_user directly).
      offer_uuid_person:
        description: Person UUID of the agent who handled the Rent offer. Null for legacy rental events.

  # ---------------------------------------------------------
  # STRUCT 4: offer_specialist
  # ---------------------------------------------------------
  offer_specialist:
    description: Struct capturing the Offer Specialist assignment from offer_specialists and alignment with the referring agent.
    fields:
      id_user:
        lineage:
          - datalake_sale_offer_flows.offer_specialists.id_user_agent_lead_referral
        description: EBDB user ID of the Offer Specialist assigned to the lead's sale offer flow.
      has_mismatch:
        description: |
          Boolean flag indicating alignment. True when an Offer Specialist exists (id_user IS NOT NULL)
          and differs from the referring agent (id_user_referring_agent != offer_specialist.id_user).
          False when the referring agent is the assigned specialist. Null when no specialist is assigned.