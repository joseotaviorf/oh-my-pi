database_name: datalake_agent_performance
table_name: fact_agent_demand_acquisition
domain: Agents
owner: gustavo.rompe@quintoandar.com.br
description: |
  Accumulating snapshot fact table tracking agent-referred demand performance across sales
  and rental lifecycles. One row per referral audit version state (id_referral + rev).
  Tracks conversion milestones (Visits Booked, Visits Completed, Offers Submitted, Offers Accepted,
  and Rental Contracts Signed) alongside agent attribution flags (Same Agent vs. Different Agent)
  and Offer Specialist alignment metrics. PII attributes are excluded.
columns:
  id_referral:
    lineage:
      - datalake_ebdb_clean.agent_lead_referral_aud.id
    description: Primary key component. Unique identifier of the agent lead referral.
  rev:
    lineage:
      - datalake_ebdb_clean.agent_lead_referral_aud.rev
    description: Primary key component. Revision version number of the referral audit record.
  id_lead:
    lineage:
      - datalake_ebdb_clean.agent_lead_referral_aud.id_lead
      - datalake_sale_demand_events.sale_demand_events.id_buyer
      - datalake_rent_demand_events.rent_demand_events.id_tenant_prospect
    description: Identifier of the invited seeker/lead (buyer for Sale, tenant prospect for Rent).
  id_agent_data_referring:
    lineage:
      - datalake_ebdb_clean.agent_lead_referral_aud.id_agent
    description: Legacy DadosAgente identifier of the referring agent who sent the invite.
  id_user_referring_agent:
    lineage:
      - datalake_ebdb_agent_events.agent_unified_identity.id_user
    description: Unified EBDB user ID of the referring agent, resolved via legacy id_agent_data cross-walk.
  uuid_person_referring_agent:
    lineage:
      - datalake_ebdb_agent_events.agent_unified_identity.uuid_person
    description: Unique natural person identifier corresponding to the referring agent. Join dim_person at query time for demographics.
  referral_status:
    lineage:
      - datalake_ebdb_clean.agent_lead_referral_aud.status
    description: Lifecycle status of the referral at the given revision.
    categories:
      CONFIRMED: Lead accepted the referral.
      PENDING: Referral invite is open.
      EXPIRED: Referral expired without confirmation.
      INACTIVE: Referral marked inactive.
  valid_from:
    lineage:
      - datalake_ebdb_clean.agent_lead_referral_aud.ts_created
    description: Timestamp when this referral revision state became valid.
  valid_to:
    lineage:
      - datalake_ebdb_clean.agent_lead_referral_aud.ts_created
    description: Timestamp when this referral revision state was superseded by a newer revision. Null for active/latest revision.
  previous_status:
    lineage:
      - datalake_ebdb_clean.agent_lead_referral_aud.status
    description: Referral status immediately preceding this revision state.
  business_context:
    lineage:
      - datalake_ebdb_clean.agent_lead_referral_aud.business_context
    description: Business domain of the referral.
    categories:
      SALE: Referral intended for For Sale properties (TQC).
      RENT: Referral intended for For Rent properties (TQA).
  origin:
    lineage:
      - datalake_ebdb_clean.agent_lead_referral_aud.origin
    description: Product channel or feature through which the referral was generated.
    categories:
      REFERRAL: Standard referral code flow.
      SERVICE_LINK: Generated from a service link.
      SCHEDULING_LINK: Generated from a scheduling link.
  id_first_sale_flow:
    lineage:
      - datalake_sale_demand_events.sale_demand_events.id_sale_flow
    description: ID of the first Sale demand flow associated with this referral (from visit or offer).
  id_first_rent_flow:
    lineage:
      - datalake_rent_demand_events.rent_demand_events.id_rent_flow
    description: ID of the first Rent demand flow associated with this referral (from visit or offer).
  has_any_visits:
    description: True when at least one Sale or Rent visit booking event occurred during this referral revision state.
  has_any_offers:
    description: True when at least one Sale or Rent offer submission event occurred during this referral revision state.
  is_visit_same_agent:
    description: |
      Attribution metric for visits. True when the agent handling the first visit equals the referring agent (id_user_referring_agent).
      False when handled by a different agent. Null when no visit occurred.
  is_offer_same_agent:
    description: |
      Attribution metric for offers. True when the agent handling the first offer equals the referring agent (id_user_referring_agent).
      False when handled by a different agent. Null when no offer occurred.
  is_agreement_same_agent:
    lineage:
      - datalake_sale_demand_events.sale_demand_events.sk_event_type
    description: |
      Attribution metric for the Sale agreement signature (sk_event_type = 6, SALE_AGREEMENT_SIGNED). True when the signing agent
      equals the referring agent (id_user_referring_agent). False when handled by a different agent. Null when no agreement was
      signed yet. Sale only; Rent has no agreement-signed event on this fact (see rent_first_events.ts_contract_signed instead).
  invitation_agent_interactions:
    description: |
      Struct containing interaction flags and timestamps strictly for events where the referring agent handled the interaction.
      Contains fields:
      - has_handled_visit (BOOLEAN): True when referring agent handled a visit.
      - has_handled_offer (BOOLEAN): True when referring agent handled an offer.
      - has_handled_agreement_signed (BOOLEAN): True when referring agent signed the Sale agreement.
      - ts_sale_visit (TIMESTAMP): First Sale visit handled timestamp.
      - ts_sale_offer (TIMESTAMP): First Sale offer handled timestamp.
      - ts_sale_agreement_signed (TIMESTAMP): Sale agreement signed timestamp, when signed by the referring agent.
      - ts_rent_visit (TIMESTAMP): First Rent visit handled timestamp.
      - ts_rent_offer (TIMESTAMP): First Rent offer handled timestamp.
  sale_first_events:
    lineage:
      - datalake_sale_demand_events.sale_demand_events.id_booking
      - datalake_sale_demand_events.sale_demand_events.ts_event
      - datalake_sale_demand_events.sale_demand_events.id_offer
      - datalake_sale_demand_events.sale_demand_events.id_agent
      - datalake_ebdb_agent_events.agent_unified_identity.id_user
      - datalake_ebdb_agent_events.agent_unified_identity.uuid_person
    description: |
      Struct capturing milestone facts, timestamps, and agent attributions for the first Sale lifecycle events on this referral.
      Contains fields:
      - id_booking (LONG): ID of the first Sale visit booking.
      - ts_visit_booked (TIMESTAMP): Timestamp when Sale visit was booked.
      - ts_visit_completed (TIMESTAMP): Timestamp when Sale visit was completed.
      - visit_id_agent (LONG): Legacy DadosAgente ID of visit agent.
      - visit_id_user (LONG): Unified EBDB user ID of visit agent.
      - visit_uuid_person (STRING): Unique natural person identifier corresponding to the agent who conducted the first Sale visit. Join dim_person at query time for agent demographics.
      - id_offer (LONG): ID of the first Sale offer.
      - ts_offer_submitted (TIMESTAMP): Timestamp when Sale offer was submitted.
      - ts_offer_accepted (TIMESTAMP): Timestamp when Sale offer was accepted.
      - offer_id_agent (LONG): Legacy DadosAgente ID of offer agent.
      - offer_id_user (LONG): Unified EBDB user ID of offer agent.
      - offer_uuid_person (STRING): Unique natural person identifier corresponding to the agent who submitted the first Sale offer. Join dim_person at query time for agent demographics.
      - ts_agreement_signed (TIMESTAMP): Timestamp when the Sale agreement was signed (sk_event_type = 6, SALE_AGREEMENT_SIGNED).
      - agreement_id_agent (LONG): Legacy DadosAgente ID of the agent who signed the agreement.
      - agreement_id_user (LONG): Unified EBDB user ID of the agent who signed the agreement.
      - agreement_uuid_person (STRING): Unique natural person identifier corresponding to the agent who signed the Sale agreement. Join dim_person at query time for agent demographics.
  rent_first_events:
    lineage:
      - datalake_rent_demand_events.rent_demand_events.id_booking
      - datalake_rent_demand_events.rent_demand_events.ts_event
      - datalake_rent_demand_events.rent_demand_events.id_offer
      - datalake_rent_demand_events.rent_demand_events.id_contract
      - datalake_rent_demand_events.rent_demand_events.id_agent
    description: |
      Struct capturing milestone facts, timestamps, and agent attributions for the first Rent lifecycle events on this referral.
      Contains fields:
      - id_booking (LONG): ID of the first Rent visit booking.
      - ts_visit_booked (TIMESTAMP): Timestamp when Rent visit was booked.
      - ts_visit_completed (TIMESTAMP): Timestamp when Rent visit was completed.
      - visit_id_agent (LONG): Always null for Rent events.
      - visit_id_user (LONG): Unified EBDB user ID of Rent visit agent.
      - visit_uuid_person (STRING): Person UUID of Rent visit agent.
      - id_offer (LONG): ID of the first Rent offer.
      - ts_offer_submitted (TIMESTAMP): Timestamp when Rent offer was submitted.
      - id_contract (LONG): ID of the signed Rent contract.
      - ts_contract_signed (TIMESTAMP): Timestamp when Rent contract was signed (event type 9).
      - offer_id_agent (LONG): Always null for Rent events.
      - offer_id_user (LONG): Unified EBDB user ID of Rent offer agent.
      - offer_uuid_person (STRING): Person UUID of Rent offer agent.
  offer_specialist:
    lineage:
      - datalake_sale_offer_flows.offer_specialists.id_user_agent_lead_referral
    description: |
      Struct capturing the Offer Specialist assignment from offer_specialists and alignment with the referring agent.
      Contains fields:
      - id_user (LONG): EBDB user ID of the assigned Offer Specialist.
      - has_mismatch (BOOLEAN): True when specialist differs from referring agent.