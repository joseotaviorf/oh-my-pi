---
table_name: datalake_cursor_usage_clean.members
alert_channel: PEOPLE_ALERTS

table_level_validations:
  has_size:
    greater_than: 1
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: -10
    less_than_or_equal_to: 25
    severity_level: Error

column_level_validations:
  id_user:
    is_complete:
      severity_level: Warning

  dt_snapshot:
    is_complete:
      severity_level: Warning

  is_removed:
    is_complete:
      severity_level: Warning

  one_row_per_member_per_snapshot:
    custom:
      # Grain uniqueness: one row per Cursor member identifier and snapshot date.
      constraint: |-
        (SELECT COUNT(*)
         FROM (
           SELECT id_user, dt_snapshot
           FROM datalake_cursor_usage_clean.members
           GROUP BY id_user, dt_snapshot
           HAVING COUNT(*) > 1
         )
        ) = 0
      severity_level: Error
