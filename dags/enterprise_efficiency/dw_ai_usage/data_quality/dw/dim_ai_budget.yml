---
table_name: dw_ai_usage.dim_ai_budget
alert_channel: PEOPLE_ALERTS

table_level_validations:
  has_size:
    greater_than: 1
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: -10
    less_than_or_equal_to: 25
    severity_level: Warning

column_level_validations:
  sk_ai_budget_version:
    is_complete:
      severity_level: Error
    is_unique:
      severity_level: Error
  sk_ai_user:
    is_complete:
      severity_level: Warning
  one_current_row_per_tool_id_user_period_type:
    custom:
      # SCD2 integrity: at most one is_current row per (tool, id_user, period_type).
      constraint: |-
        (SELECT COUNT(*) FROM (
          SELECT
            tool,
            id_user,
            period_type
          FROM dw_ai_usage.dim_ai_budget
          WHERE is_current
          GROUP BY
            tool,
            id_user,
            period_type
          HAVING COUNT(*) > 1
        )) = 0
      severity_level: Warning
  matching_sk_ai_user_dim_ai_user:
    custom:
      # Every sk_ai_user > -1 must exist in dw_ai_usage.dim_ai_user (no orphan FK).
      constraint: |-
        (SELECT COUNT(*)
         FROM (
           SELECT DISTINCT sk_ai_user
           FROM dw_ai_usage.dim_ai_budget
           WHERE sk_ai_user > -1
         ) AS budget_user
         WHERE NOT EXISTS (
           SELECT 1
           FROM dw_ai_usage.dim_ai_user AS user_dim
           WHERE user_dim.sk_ai_user = budget_user.sk_ai_user
         )
        ) = 0
      severity_level: Warning
