---
table_name: dw_ai_usage.fact_ai_usage_daily
alert_channel: PEOPLE_ALERTS

table_level_validations:
  has_size:
    greater_than: 1
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: -10
    less_than_or_equal_to: 25
    severity_level: Warning

column_level_validations:
  sk_ai_usage_daily:
    is_complete:
      severity_level: Error
    is_unique:
      severity_level: Error
  dt_started:
    is_complete:
      severity_level: Warning
  sk_ai_user:
    is_complete:
      severity_level: Warning
  matching_sk_ai_user_dim_ai_user:
    custom:
      # Every sk_ai_user > -1 must exist in dw_ai_usage.dim_ai_user (no orphan FK).
      constraint: |-
        (SELECT COUNT(*)
         FROM (
           SELECT DISTINCT sk_ai_user
           FROM dw_ai_usage.fact_ai_usage_daily
           WHERE sk_ai_user > -1
         ) AS fact_user
         WHERE NOT EXISTS (
           SELECT 1
           FROM dw_ai_usage.dim_ai_user AS user_dim
           WHERE user_dim.sk_ai_user = fact_user.sk_ai_user
         )
        ) = 0
      severity_level: Warning
  matching_sk_ai_model_dim_ai_model:
    custom:
      # Every sk_ai_model > -1 must exist in dw_ai_usage.dim_ai_model (no orphan FK).
      constraint: |-
        (SELECT COUNT(*)
         FROM (
           SELECT DISTINCT sk_ai_model
           FROM dw_ai_usage.fact_ai_usage_daily
           WHERE sk_ai_model > -1
         ) AS fact_model
         WHERE NOT EXISTS (
           SELECT 1
           FROM dw_ai_usage.dim_ai_model AS model_dim
           WHERE model_dim.sk_ai_model = fact_model.sk_ai_model
         )
        ) = 0
      severity_level: Warning
  matching_sk_ai_product_dim_ai_product:
    custom:
      # Every sk_ai_product > -1 must exist in dw_ai_usage.dim_ai_product (no orphan FK).
      constraint: |-
        (SELECT COUNT(*)
         FROM (
           SELECT DISTINCT sk_ai_product
           FROM dw_ai_usage.fact_ai_usage_daily
           WHERE sk_ai_product > -1
         ) AS fact_product
         WHERE NOT EXISTS (
           SELECT 1
           FROM dw_ai_usage.dim_ai_product AS product_dim
           WHERE product_dim.sk_ai_product = fact_product.sk_ai_product
         )
        ) = 0
      severity_level: Warning
