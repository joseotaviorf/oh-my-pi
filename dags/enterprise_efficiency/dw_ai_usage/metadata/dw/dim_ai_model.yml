database_name: dw_ai_usage
table_name: dim_ai_model
owner: gabriel.berger@quintoandar.com.br
domain: Enterprise Efficiency
description: |
  Dimension of distinct AI models observed across tools. Grain: one row per tool and
  model. Scope: covers every model that has ever appeared in usage. A new model
  appears automatically on the next full recompute.
columns:
  sk_ai_model:
    description: Unique key for the (tool, model) combination, a deterministic hash so it never changes across reruns (e.g. 'a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6'). Referenced by fact_ai_usage_daily.sk_ai_model.
    lineage:
      - datalake_ai_usage.usage_daily.tool
      - datalake_ai_usage.usage_daily.model

  tool:
    description: AI tool this model belongs to, matching dim_ai_tool.tool (e.g. 'claude').
    lineage:
      - datalake_ai_usage.usage_daily.tool

  model:
    description: AI model name as reported by the vendor (for example claude-opus-4-6).
    lineage:
      - datalake_ai_usage.usage_daily.model
