database_name: dw_ai_usage
table_name: dim_ai_user
owner: gabriel.berger@quintoandar.com.br
domain: Enterprise Efficiency
description: |
  Conformed AI-tool user dimension preserving each vendor's raw identity (id_user and
  email). Grain: one row per tool and id_user. Scope: covers every tool/id_user
  combination ever seen in usage or spend, including contractors, service accounts,
  former employees, and unresolved identities, so usage and spend are never silently
  lost. email_user is retained as the employee joining key for downstream attribution;
  this dimension does not depend on or duplicate a People employee dimension.
columns:
  sk_ai_user:
    description: Unique key for the (tool, id_user) combination, a deterministic hash so it never changes across reruns (e.g. 'c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8'). Referenced by fact_ai_usage_daily.sk_ai_user, fact_ai_spend_daily.sk_ai_user, and fact_ai_budget_snapshot_daily.sk_ai_user.
    lineage:
      - datalake_ai_usage.usage_daily.tool
      - datalake_ai_usage.usage_daily.id_user

  tool:
    description: AI tool this user identity belongs to, matching dim_ai_tool.tool (e.g. 'claude').
    lineage:
      - datalake_ai_usage.usage_daily.tool

  id_user:
    description: Vendor-stable user identifier as reported in usage and spend (e.g. 'user_01H8XGJ4K2M3N4P5Q6R7S8T9U0').
    lineage:
      - datalake_ai_usage.usage_daily.id_user

  email_user:
    description: |
      Work email address reported by the vendor for this user and the joining key for
      downstream employee attribution (e.g. 'name.last_name@quintoandar.com.br'). The
      value is preserved from usage and spend and may be NULL or unmatched. Downstream
      consumers can enrich current employee attributes by joining email_user to
      dw_people.dim_employee.work_email; the public table is active-only, so historical
      or former employees may remain unmatched.
    lineage:
      - datalake_ai_usage.usage_daily.email_user
