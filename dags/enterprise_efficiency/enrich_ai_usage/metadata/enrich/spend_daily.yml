database_name: datalake_ai_usage
table_name: spend_daily
owner: gabriel.berger@quintoandar.com.br
domain: Enterprise Efficiency
description: |
  Vendor-agnostic daily AI-tool spend, conformed to a contract with no vendor-named
  columns. Grain: one row per tool, id_user, currency, dt_started, and dt_ended.
  Scope: covers Claude. Grain is day x user x currency, a separate population axis
  from usage_daily's day x user x product x model grain; the two tables carry
  independent measures and joining them to re-sum across both fabricates a cost
  allocation the source data doesn't support. Amounts are expressed in USD.
columns:
  tool:
    description: AI tool the spend row belongs to, a literal constant per source (e.g. 'claude').
    # No lineage — hardcoded literal value ('claude') in the SQL.

  id_user:
    description: Identifier of the user the spend row is attributed to, as assigned by the vendor and stable across runs.
    lineage:
      - datalake_claude_usage_clean.user_cost.id_user

  email_user:
    description: Work email address of the user the spend row is attributed to.
    lineage:
      - datalake_claude_usage_clean.user_cost.email_user

  currency:
    description: ISO currency code the spend amounts are denominated in.
    lineage:
      - datalake_claude_usage_clean.user_cost.currency

  sum_discounted_cost_amount:
    description: Discounted spend amount for the period, in USD.
    lineage:
      - datalake_claude_usage_clean.user_cost.sum_discounted_cost_amount

  sum_list_price_amount:
    description: List-price (undiscounted) spend amount for the period, in USD.
    lineage:
      - datalake_claude_usage_clean.user_cost.sum_list_price_amount

  is_actor_deleted:
    description: True when the vendor marks the user as no longer a member of the organization (membership removed or the account itself deleted).
    lineage:
      - datalake_claude_usage_clean.user_cost.is_actor_deleted

  dt_started:
    description: Start date (UTC) of the spend aggregation period this row covers.
    lineage:
      - datalake_claude_usage_clean.user_cost.dt_starting

  dt_ended:
    description: End date (UTC) of the spend aggregation period this row covers, exclusive of that date.
    lineage:
      - datalake_claude_usage_clean.user_cost.dt_ending

  ts_load:
    description: Timestamp when this row was loaded into the enrich layer.
    # No lineage — derived from CURRENT_TIMESTAMP() at load time, not a source column.
