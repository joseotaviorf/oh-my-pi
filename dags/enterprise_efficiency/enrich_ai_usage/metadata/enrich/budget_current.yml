database_name: datalake_ai_usage
table_name: budget_current
owner: gabriel.berger@quintoandar.com.br
domain: Enterprise Efficiency
description: |
  AI-tool budget and spend-limit state, conformed to a vendor-agnostic contract with no
  vendor-named columns. Grain: one row per tool, id_user, and period. Scope: covers
  Claude. This table holds the current snapshot only: the vendor's spend-limit API and
  this table's clean-layer source (datalake_claude_usage_clean.spend_limits) are both
  latest-wins with no date column, so every run fully overwrites this table with the
  present state. A downstream daily snapshot fact captures this table's state on each
  run to build cap-change history; this table itself holds no history.
columns:
  tool:
    description: AI tool the budget row belongs to, a literal constant per source (e.g. 'claude').
    # No lineage — hardcoded literal value ('claude') in the SQL.

  id_user:
    description: Vendor-stable identifier of the user this spend limit governs (the limit's scope, not the actor who set it).
    lineage:
      - datalake_claude_usage_clean.spend_limits.id_user

  period:
    description: Vendor-defined budget period the spend limit applies to (for example a monthly reset window).
    lineage:
      - datalake_claude_usage_clean.spend_limits.period

  currency:
    description: ISO currency code the budget amounts are denominated in.
    lineage:
      - datalake_claude_usage_clean.spend_limits.currency

  sum_spend_limit_amount:
    description: Current spend cap for the period, already converted to USD by the clean layer. Do not re-divide.
    lineage:
      - datalake_claude_usage_clean.spend_limits.sum_spend_limit_amount

  sum_period_to_date_spend:
    description: Amount spent so far in the current period as of this snapshot, already converted to USD by the clean layer. Do not re-divide.
    lineage:
      - datalake_claude_usage_clean.spend_limits.sum_period_to_date_spend

  is_actor_deleted:
    description: Whether the vendor marks the actor who set this limit as no longer a member of the organization (membership removed or the account itself deleted).
    lineage:
      - datalake_claude_usage_clean.spend_limits.is_actor_deleted

  ts_load:
    description: Timestamp when this row was loaded into the enrich layer.
    # No lineage — derived from CURRENT_TIMESTAMP() at load time, not a source column.
