database_name: datalake_claude_usage_clean
table_name: group_members
owner: gabriel.berger@quintoandar.com.br
domain: Enterprise Efficiency
description: |
  Claude Enterprise RBAC group memberships linking QuintoAndar workforce seats to their RBAC groups.
  Current-state snapshot: one row per id_group and id_user from the latest raw ts_load only;
  removed memberships disappear on the next full overwrite because the Admin API returns
  current memberships only. Flattens vendor JSON from the Admin RBAC Group Members endpoint
  into typed columns.
columns:
  id_group:
    description: Vendor RBAC group identifier (rbac_group_...) the membership belongs to (e.g. 'rbac_group_011CReAqK5DGX6fqXqoBSpFn').
    lineage:
      - datalake_claude_usage_raw.group_members.payload

  id_user:
    description: Vendor Claude user identifier (user_...) of the group member (e.g. 'user_011CReAqK5DGX6fqXqoBSpFn').
    lineage:
      - datalake_claude_usage_raw.group_members.payload

  email:
    description: Lowercase, trimmed work email address of the group member; empty values are NULL (e.g. 'jane.doe@quintoandar.com').
    lineage:
      - datalake_claude_usage_raw.group_members.payload

  type_group_member:
    description: Vendor object type discriminator for the record; always rbac_group_member (e.g. 'rbac_group_member').
    lineage:
      - datalake_claude_usage_raw.group_members.payload

  ts_created:
    description: Timestamp when the user was added to the RBAC group.
    lineage:
      - datalake_claude_usage_raw.group_members.payload

  ts_load:
    description: Timestamp when the Spark api_ingestion job wrote the source raw row.
    lineage:
      - datalake_claude_usage_raw.group_members.ts_load
