database_name: datalake_claude_usage_clean
table_name: spend_limits
owner: gabriel.berger@quintoandar.com.br
domain: Enterprise Efficiency
description: |
  Claude Enterprise effective spend limits for QuintoAndar workforce seats. One row
  per member (id_user) and id_spend_limit: the vendor mints a new id_spend_limit only
  when a member's cap is actually reconfigured, never for routine period-to-date spend
  accumulation or period rollover, so this table accumulates the full cap-change
  history rather than holding one row per daily pull. Re-observing an unchanged
  id_spend_limit refreshes its other attributes in place without resetting dt_started.
  Flattens vendor JSON from the Admin spend limits endpoint into typed columns. Does not
  carry period-to-date spend: that figure reconciles closely with the sum of this
  member's own cost rows in datalake_claude_usage_clean.user_cost for the current
  period, so it is derived downstream instead of duplicated here.
columns:
  id_spend_limit:
    description: Vendor identifier for the effective spend limit record (e.g. 'spl_011CReAqK5DGX6fqXqoBSpFn').
    lineage:
      - datalake_claude_usage_raw.spend_limits.payload

  id_user:
    description: Claude user identifier in the spend limit scope when scope type is user (e.g. 'user_011CReAqK5DGX6fqXqoBSpFn').
    lineage:
      - datalake_claude_usage_raw.spend_limits.payload

  id_actor_user:
    description: Claude user identifier for the actor associated with the spend limit (e.g. 'user_011CReAqK5DGX6fqXqoBSpFn').
    lineage:
      - datalake_claude_usage_raw.spend_limits.payload

  id_source_user:
    description: Claude user identifier in the spend limit source when source type is user (e.g. 'user_011CReAqK5DGX6fqXqoBSpFn').
    lineage:
      - datalake_claude_usage_raw.spend_limits.payload

  id_source_rbac_group:
    description: RBAC group identifier in the spend limit source when source type is rbac_group (e.g. 'rbac_group_011CReAqK5DGX6fqXqoBSpFn').
    lineage:
      - datalake_claude_usage_raw.spend_limits.payload

  email_actor:
    description: Lowercase, trimmed work email address for the actor associated with the spend limit; empty values are NULL (e.g. 'jane.doe@quintoandar.com').
    lineage:
      - datalake_claude_usage_raw.spend_limits.payload

  name_actor:
    description: Display name for the actor associated with the spend limit (e.g. 'Jane Doe').
    lineage:
      - datalake_claude_usage_raw.spend_limits.payload

  type_actor:
    description: Vendor actor type for the spend limit record (e.g. 'user_actor').
    lineage:
      - datalake_claude_usage_raw.spend_limits.payload

  type_scope:
    description: Vendor scope type for the spend limit (for example user).
    lineage:
      - datalake_claude_usage_raw.spend_limits.payload

  type_source:
    description: Vendor source type for the spend limit (for example rbac_group).
    lineage:
      - datalake_claude_usage_raw.spend_limits.payload

  seat_tier:
    description: Seat tier associated with the spend limit source when provided by the vendor (e.g. 'standard').
    lineage:
      - datalake_claude_usage_raw.spend_limits.payload

  period_type:
    description: Spend limit period cadence reported by the vendor (for example monthly).
    lineage:
      - datalake_claude_usage_raw.spend_limits.payload

  currency:
    description: Currency code for the spend limit amount (e.g. 'USD').
    lineage:
      - datalake_claude_usage_raw.spend_limits.payload

  sum_spend_limit_amount:
    description: Configured spend limit amount for the period.
    lineage:
      - datalake_claude_usage_raw.spend_limits.payload

  is_actor_deleted:
    description: Whether the vendor marks the associated actor as deleted.
    lineage:
      - datalake_claude_usage_raw.spend_limits.payload

  dt_started:
    description: Date this id_spend_limit was first observed for this member. Not updated when the row's other attributes are later refreshed. The vendor API exposes no timestamp of its own for when a value was computed, so this and ts_load reflect only when QuintoAndar last observed it, not when the vendor last updated it.
    # No lineage — derived from ts_load on first insert, not a source column.

  ts_load:
    description: Timestamp when the Spark api_ingestion job wrote the raw row this version was most recently refreshed from.
    lineage:
      - datalake_claude_usage_raw.spend_limits.ts_load
