---
table_name: datalake_claude_usage_clean.groups
alert_channel: PEOPLE_ALERTS

table_level_validations:
  has_size:
    greater_than: 1
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: -10
    less_than_or_equal_to: 25
    severity_level: Error

column_level_validations:
  id:
    is_complete:
      severity_level: Warning

  one_row_per_id:
    custom:
      # Grain uniqueness: exactly one row per RBAC group id after deduplication.
      constraint: |-
        (SELECT COUNT(*)
         FROM (
           SELECT id
           FROM datalake_claude_usage_clean.groups
           GROUP BY id
           HAVING COUNT(*) > 1
         )
        ) = 0
      severity_level: Error
