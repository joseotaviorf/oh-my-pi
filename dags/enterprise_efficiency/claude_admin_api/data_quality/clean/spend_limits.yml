---
table_name: datalake_claude_usage_clean.spend_limits
alert_channel: PEOPLE_ALERTS

table_level_validations:
  has_size:
    greater_than: 1
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: -10
    less_than_or_equal_to: 25
    severity_level: Error

column_level_validations:
  id_spend_limit:
    is_complete:
      severity_level: Warning

  one_row_per_member_and_spend_limit:
    custom:
      # Grain uniqueness: exactly one row per id_user/id_spend_limit — the same
      # merge_on key used to append cap-change history.
      constraint: |-
        (SELECT COUNT(*)
         FROM (
           SELECT id_user, id_spend_limit
           FROM datalake_claude_usage_clean.spend_limits
           GROUP BY id_user, id_spend_limit
           HAVING COUNT(*) > 1
         )
        ) = 0
      severity_level: Error
