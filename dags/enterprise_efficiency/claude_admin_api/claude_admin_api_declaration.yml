dag:
  name: claude_admin_api
  owner: Tech Platform Enterprise Engineering
  callback_by_task: False
  catchup: false
  schedule_interval: 0 3 * * *
  schedule_start_date: "2026, 8, 18"
  documentation:
    dag_purpose: |
      Claude Enterprise Admin effective spend limits and seat roster for
      QuintoAndar workforce seats.
      Raw layer: one JSON payload per API record per daily load, incremental
      append partitioned by year, month, and day; group_members is membership
      grain after fan-out from groups. Raw retains full ingestion history.
      Clean layer: current-state snapshots only for members, groups, and
      group_members — each filters to the latest ts_load, full-overwrites its
      unpartitioned Delta table, and drops departed users, groups, and
      memberships. Natural grains: id (members, groups), id_group + id_user
      (group_members). spend_limits is the exception: it is a cap-change
      history, incrementally merged on (id_user, id_spend_limit) — the
      vendor mints a new id_spend_limit only when a member's cap is actually
      reconfigured, never for routine period-to-date spend accumulation or
      period rollover, so this key alone separates real cap changes from
      day-to-day spend, with no comparison logic needed in the query.
      dt_started stamps the date an id_spend_limit was first observed and is
      excluded from the match-update, so re-observing an unchanged cap
      refreshes its other attributes without resetting when it started.
      Grain: id_user + id_spend_limit.
      Loads datalake_claude_usage_raw daily at 03:00 America/Sao_Paulo. Auth is
      CLAUDE_ADMIN_API_KEY in the quintoandar secret scope (x-api-key) plus
      anthropic-version 2023-06-01; group and group_members add anthropic-beta
      ce-user-management-2026-07-13. group_members expands from raw groups via
      group_id.

workflow:
  layer: raw
  type: api_ingestion
  custom_schema: claude_usage
  api_base_url: https://api.anthropic.com
  bucket_config_name: people_bucket
  credentials_scope: quintoandar
  has_hive_sync: false
  default_extraction_type: incremental
  default_raw_partitions:
    - year
    - month
    - day
  default_clean_partitions: []
  default_table_privileges:
    people-team:
      - ALL PRIVILEGES

  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"

  http_headers:
    anthropic-version: "2023-06-01"

  authentication:
    strategy: api_key
    secret_key: CLAUDE_ADMIN_API_KEY
    api_key_field: api_key
    location: header
    header_name: x-api-key

  api_policies:
    pagination:
      strategy: none
    rate_limiting:
      strategy: fixed_delay
      delay_seconds: 0.2

  raw_inner_dependencies:
    group_members:
      - groups

  tables_customization:
    spend_limits:
      endpoint_path: v1/organizations/spend_limits/effective
      extraction_type: incremental
      clean_extraction_type: incremental
      merge_on:
        - id_user
        - id_spend_limit
      when_matched_operation:
        id_actor_user: "source.id_actor_user"
        id_source_user: "source.id_source_user"
        id_source_rbac_group: "source.id_source_rbac_group"
        email_actor: "source.email_actor"
        name_actor: "source.name_actor"
        type_actor: "source.type_actor"
        type_scope: "source.type_scope"
        type_source: "source.type_source"
        seat_tier: "source.seat_tier"
        period_type: "source.period_type"
        currency: "source.currency"
        sum_spend_limit_amount: "source.sum_spend_limit_amount"
        is_actor_deleted: "source.is_actor_deleted"
        ts_load: "source.ts_load"
        # dt_started intentionally excluded: preserves the date this
        # id_spend_limit was first observed, instead of resetting it to
        # today on every re-observation of an unchanged cap.
      params: {}
      api_policies:
        pagination:
          strategy: cursor
          cursor_location: param
          cursor_param: page
          cursor_response_path: next_page
          results_response_path: data
          page_size_location: param
          page_size_param: limit
          page_size: 1000
        rate_limiting:
          strategy: fixed_delay
          delay_seconds: 0.2
      vacuum_retention_hours: 168
      vacuum_lite: true

    members:
      endpoint_path: v1/organizations/users
      extraction_type: incremental
      clean_extraction_type: full
      params: {}
      api_policies:
        pagination:
          strategy: cursor
          cursor_location: param
          cursor_param: after_id
          cursor_response_path: last_id
          results_response_path: data
          page_size_location: param
          page_size_param: limit
          page_size: 1000
        rate_limiting:
          strategy: fixed_delay
          delay_seconds: 0.2
      vacuum_retention_hours: 168
      vacuum_lite: true

    groups:
      endpoint_path: v1/organizations/rbac_groups
      extraction_type: incremental
      clean_extraction_type: full
      params: {}
      http_headers:
        anthropic-beta: "ce-user-management-2026-07-13"
      api_policies:
        pagination:
          strategy: cursor
          cursor_location: param
          cursor_param: page
          cursor_response_path: next_page
          results_response_path: data
          page_size_location: param
          page_size_param: limit
          page_size: 1000
        rate_limiting:
          strategy: fixed_delay
          delay_seconds: 0.2
      vacuum_retention_hours: 168
      vacuum_lite: true

    group_members:
      endpoint_path: v1/organizations/rbac_groups/{group_id}/members
      extraction_type: incremental
      clean_extraction_type: full
      execution_timeout_hours: 3
      http_headers:
        anthropic-beta: "ce-user-management-2026-07-13"
      id_expansion:
        source_table: groups
        id_field: id
        path_param: group_id
        correlation_field: group_id
        max_workers: 8
      params: {}
      api_policies:
        pagination:
          strategy: cursor
          cursor_location: param
          cursor_param: page
          cursor_response_path: next_page
          results_response_path: data
          page_size_location: param
          page_size_param: limit
          page_size: 1000
        rate_limiting:
          strategy: fixed_delay
          delay_seconds: 0.2
      vacuum_retention_hours: 168
      vacuum_lite: true
