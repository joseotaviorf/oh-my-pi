dag:
  name: claude_usage_api
  owner: Tech Platform Enterprise Engineering
  callback_by_task: False
  catchup: false
  schedule_interval: 0 3 * * *
  schedule_start_date: "2026, 8, 18"
  documentation:
    dag_purpose: |
      Claude Enterprise Analytics activity, token usage, credit spend, and
      organization summaries for QuintoAndar workforce seats.
      One raw JSON payload per API record per daily load, partitioned by year,
      month, and day.
      Covers members returned by Analytics (usage, cost, activity, and summaries).
      Loads datalake_claude_usage_raw daily at 03:00 America/Sao_Paulo; usage
      uses a 28-day trailing window with exclusive ending_at equal to the
      default load_end_date (interval day), so the latest included day is
      interval day minus one; cost uses the same start and an exclusive
      ending_at of interval day plus one so the latest included day is the
      interval day (console/gsheets D-1); summaries
      use the same start and an exclusive ending_date equal to the default
      load_end_date (interval day), so the latest included day is interval day
      minus one and stays within vendor publish lag;
      activity requests the interval day minus two because the vendor
      publishes that endpoint a day behind and rejects unpublished dates,
      then date_expansion.load_window calls that date once on the schedule.
      Cost and usage exports typically refresh within four hours, but the
      vendor may revise recent values for up to 24 hours and later reconciliation
      can revise historical values; the daily trailing window re-reads recent
      dates to absorb those revisions.
      A triggered conf window (load_start_date / load_end_date) iterates
      every inclusive day so a backfill is not reduced to the end date.
      Auth is CLAUDE_ANALYTICS_API_KEY in the quintoandar secret scope (x-api-key)
      plus anthropic-version 2023-06-01. Usage, cost, and activity paginate
      next_page as query param page; summaries unpack summaries[] without a cursor.
      Bootstraps datalake_claude_usage_clean via user_activity (payload pass-through).

workflow:
  layer: raw
  type: api_ingestion
  custom_schema: claude_usage
  api_base_url: https://api.anthropic.com
  bucket_config_name: people_bucket
  credentials_scope: quintoandar
  has_hive_sync: false
  default_extraction_type: incremental
  default_raw_partitions:
    - year
    - month
    - day
  default_clean_partitions:
    - year
    - month
    - day
  default_table_privileges:
    people-team:
      - ALL PRIVILEGES

  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, -27), 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"

  http_headers:
    anthropic-version: "2023-06-01"

  authentication:
    strategy: api_key
    secret_key: CLAUDE_ANALYTICS_API_KEY
    api_key_field: api_key
    location: header
    header_name: x-api-key

  api_policies:
    pagination:
      strategy: none
    rate_limiting:
      strategy: fixed_delay
      delay_seconds: 0.2

  tables_customization:
    user_usage:
      endpoint_path: v1/organizations/analytics/user_usage_report
      extraction_type: incremental
      merge_on:
        - dt_starting
        - dt_ending
        - id_user
        - model
        - product
      date_filter_column: starting_at
      params:
        bucket_width: 1d
        starting_at: load_start_date
        ending_at: load_end_date
        "group_by[]":
          - product
          - model
      api_policies:
        pagination:
          strategy: cursor
          cursor_location: param
          cursor_param: page
          cursor_response_path: next_page
          results_response_path: data
          page_size_location: param
          page_size_param: limit
          page_size: 1000
        rate_limiting:
          strategy: fixed_delay
          delay_seconds: 0.2
      vacuum_retention_hours: 168
      vacuum_lite: true

    user_cost:
      endpoint_path: v1/organizations/analytics/user_cost_report
      extraction_type: incremental
      merge_on:
        - dt_starting
        - dt_ending
        - id_user
        - currency
      date_filter_column: starting_at
      # Vendor ending_at is exclusive. Shift load_end_date forward one day so
      # the trailing window includes the interval day (D-1 of the scheduled run).
      # Repeat load_start_date: table extras replace the workflow dict.
      extra_query_template_params:
        load_start_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, -27), 'load_start_date') }}"
        load_end_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, 1), 'load_end_date') }}"
      params:
        bucket_width: 1d
        starting_at: load_start_date
        ending_at: load_end_date
      api_policies:
        pagination:
          strategy: cursor
          cursor_location: param
          cursor_param: page
          cursor_response_path: next_page
          results_response_path: data
          page_size_location: param
          page_size_param: limit
          page_size: 1000
        rate_limiting:
          strategy: fixed_delay
          delay_seconds: 0.2
      vacuum_retention_hours: 168
      vacuum_lite: true

    user_activity:
      endpoint_path: v1/organizations/analytics/users
      extraction_type: incremental
      date_format: "%Y-%m-%d"
      # "date" is only the request param name; the response field is last_activity_date.
      date_filter_column: last_activity_date
      # Vendor typically exposes engagement snapshots around 17:00 UTC on the
      # following day and rejects unpublished dates with a 400; shift both
      # ends back two days on scheduled runs so date_expansion.load_window
      # still makes one call. A triggered conf window (load_start_date /
      # load_end_date) iterates every inclusive day.
      extra_query_template_params:
        load_start_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, -2), 'load_start_date') }}"
        load_end_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, -2), 'load_end_date') }}"
      date_expansion:
        param_name: date
        strategy: load_window
      params:
        date: load_end_date
      api_policies:
        pagination:
          strategy: cursor
          cursor_location: param
          cursor_param: page
          cursor_response_path: next_page
          results_response_path: data
          page_size_location: param
          page_size_param: limit
          page_size: 1000
        rate_limiting:
          strategy: fixed_delay
          delay_seconds: 0.2
      vacuum_retention_hours: 168
      vacuum_lite: true

    summaries:
      endpoint_path: v1/organizations/analytics/summaries
      extraction_type: incremental
      merge_on:
        - dt_starting
        - dt_ending
      results_response_path: summaries
      date_filter_column: starting_at
      date_format: "%Y-%m-%d"
      # Vendor engagement snapshots typically become available around 17:00 UTC
      # on the following day. ending_date is exclusive, so default
      # load_end_date (interval day) keeps the latest included day behind that
      # publication window.
      params:
        starting_date: load_start_date
        ending_date: load_end_date
      api_policies:
        pagination:
          strategy: none
        rate_limiting:
          strategy: none
      vacuum_retention_hours: 168
      vacuum_lite: true
