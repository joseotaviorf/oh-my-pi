database_name: datalake_claude_usage_clean
table_name: user_usage
owner: gabriel.berger@quintoandar.com.br
domain: Enterprise Efficiency
description: |
  Claude Enterprise daily token usage by user, model, and product for QuintoAndar workforce seats.
  One row per id_user, model, product, dt_starting, and dt_ending after deduplication from overlapping raw loads.
  Flattens vendor JSON from the Analytics user usage report endpoint into typed columns.
columns:
  id_user:
    description: Claude Enterprise user identifier (user_...) the usage row is attributed to (e.g. 'user_011CReAqK5DGX6fqXqoBSpFn').
    lineage:
      - datalake_claude_usage_raw.user_usage.payload

  email_user:
    description: Lowercase, trimmed work email address of the user the usage row is attributed to; empty values are NULL (e.g. 'jane.doe@quintoandar.com').
    lineage:
      - datalake_claude_usage_raw.user_usage.payload

  name_user:
    description: Display name of the user the usage row is attributed to. Reads "Deleted User" if the account has since been deleted (e.g. 'Jane Doe').
    lineage:
      - datalake_claude_usage_raw.user_usage.payload

  type_actor:
    description: Vendor actor type discriminator for the usage attribution; always user_actor, since this per-user report only attributes usage to named users (e.g. 'user_actor').
    lineage:
      - datalake_claude_usage_raw.user_usage.payload

  model:
    description: Claude model that produced the usage (for example claude-opus-4-6).
    lineage:
      - datalake_claude_usage_raw.user_usage.payload

  product:
    description: Claude product surface that produced the usage (for example chat, claude_code, cowork, office_agent).
    lineage:
      - datalake_claude_usage_raw.user_usage.payload

  count_requests:
    description: Number of API requests included in this row's usage aggregation for the period.
    lineage:
      - datalake_claude_usage_raw.user_usage.payload

  count_output_tokens:
    description: Number of output tokens generated in the period.
    lineage:
      - datalake_claude_usage_raw.user_usage.payload

  count_total_tokens:
    description: Total token count across all token types for the period (input, output, and cache).
    lineage:
      - datalake_claude_usage_raw.user_usage.payload

  count_uncached_input_tokens:
    description: Number of uncached input tokens processed in the period.
    lineage:
      - datalake_claude_usage_raw.user_usage.payload

  count_cache_read_input_tokens:
    description: Number of input tokens read from the prompt cache in the period.
    lineage:
      - datalake_claude_usage_raw.user_usage.payload

  count_cache_creation_1h_tokens:
    description: Number of input tokens used to create 1-hour ephemeral cache entries in the period.
    lineage:
      - datalake_claude_usage_raw.user_usage.payload

  count_cache_creation_5m_tokens:
    description: Number of input tokens used to create 5-minute ephemeral cache entries in the period.
    lineage:
      - datalake_claude_usage_raw.user_usage.payload

  count_web_search_requests:
    description: Number of server-side web search tool requests made in the period.
    lineage:
      - datalake_claude_usage_raw.user_usage.payload

  is_actor_deleted:
    description: Whether the vendor marks the user as no longer a member of the organization (membership removed or the account itself deleted).
    lineage:
      - datalake_claude_usage_raw.user_usage.payload

  dt_starting:
    description: Start date (UTC) of the usage aggregation period this row covers.
    lineage:
      - datalake_claude_usage_raw.user_usage.payload

  dt_ending:
    description: End date (UTC, exclusive) of the usage aggregation period this row covers.
    lineage:
      - datalake_claude_usage_raw.user_usage.payload

  ts_load:
    description: Timestamp when the Spark api_ingestion job wrote the source raw row.
    lineage:
      - datalake_claude_usage_raw.user_usage.ts_load

  year:
    description: Ingestion partition year, derived from the vendor's starting_at date in the API payload (date_filter_column), not the load timestamp.
    lineage:
      - datalake_claude_usage_raw.user_usage.year

  month:
    description: Ingestion partition month, derived from the vendor's starting_at date in the API payload (date_filter_column), not the load timestamp.
    lineage:
      - datalake_claude_usage_raw.user_usage.month

  day:
    description: Ingestion partition day, derived from the vendor's starting_at date in the API payload (date_filter_column), not the load timestamp.
    lineage:
      - datalake_claude_usage_raw.user_usage.day
