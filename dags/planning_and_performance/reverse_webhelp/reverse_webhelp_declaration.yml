dag:
  name: reverse_webhelp
  schedule_start_date: 2023,8,23
  owner: Data Planning and Performance
  documentation:
    dag_purpose: |
      This dag has the purpose of processing and storing the operation follow-up data, related to webhelp services.
workflow:
  type: load
  layer: reverse
  custom_schema: webhelp
  default_extraction_type: incremental
  default_partitions: ["year", "month", "day"]
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, 1), 'load_start_date') }}"
