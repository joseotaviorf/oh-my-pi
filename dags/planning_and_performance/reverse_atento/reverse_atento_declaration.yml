dag:
  name: reverse_atento
  schedule_start_date: 2023,8,23
  owner: Data Planning and Performance
  documentation:
    dag_purpose: |
      This dag has the purpose of sending operation follow-up data, related to Atento services.
workflow:
  layer: reverse
  type: access
  bucket_config_name: planning_and_performance_bucket
  load_spark_job: load_reverse_atento
  spark_job_arguments:
    - "{environment}"
    - "{bucket}"
    - "{dag_name}"
    - "dw_bpo_performance"
    - "{table_name}"
    - "{{ get_date_param(dag_run, data_interval_start | ts, 'load_start_date') }}"
    - "{{ get_date_param(dag_run, data_interval_end | ts, 'load_end_date') }}"
    - "atento"
    - "('atento', 'atn', 'Atento')"
    
  tables_customization:
    backlog_metric: {}
    csat_front: {}
    cases_perspective: {}
    demand_metric: {}
    fcr_metric: {}
    general_metric: {}
    email: {}
    recontact: {}
    tickets_perspective: {}
    speech_call: {}
    speech_chat: {}
    taxonomy: {}
    tmr: {}
    tickets_transferred: {}
    tickets_contract: {}
    twilio_chat_aht: {}
    customer_contacts_session: {}
    backlog_metrics_salesforce: {}