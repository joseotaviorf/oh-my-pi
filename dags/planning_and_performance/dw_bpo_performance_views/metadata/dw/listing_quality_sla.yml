database_name: dw_bpo_performance
table_name: listing_quality_sla
description: Table that contains the listing quality SLA metrics for bpo performance.
domain: Cross
owner: data-pp@quintoandar.com.br
columns:
  id_listing_quality_sla:
    lineage:
      - datalake_listing_jobs.listing_quality_sla.id_listing_quality_sla
    description: The unique identifier of the Listing Quality SLA.
  business_key:
    lineage:
      - datalake_listing_jobs.listing_quality_sla.business_key
    description: Key that represents the data that is concatenated to generate the id_listing_quality_sla,
      in this case we concatenate it as "id_house || id_ticket || dt_uploaded".
  id_ticket:
    lineage:
      - datalake_listing_jobs.listing_quality_sla.id_ticket
    description: Identification key of the service ticket related to listing quality.
  id_house:
    lineage:
      - datalake_listing_jobs.listing_quality_sla.id_house
    description: Identification key of the analyzed house.
  organization:
    lineage:
      - datalake_listing_jobs.listing_quality_sla.agent_organization
    description: Name of the company where the analyst works.
  has_demand:
    lineage:
      - datalake_listing_jobs.listing_quality_sla.has_demand
    description: Boolean information that indicates whether the service generated demand.
  has_task_done:
    lineage:
      - datalake_listing_jobs.listing_quality_sla.has_task_done
    description: Boolean information that indicates whether the service ticket was finalized.
  has_sla_achieved:
    lineage:
      - datalake_listing_jobs.listing_quality_sla.has_sla_achieved
    description: Boolean information that indicates whether the service ticket was completed within the SLA.
  has_backlog:
    lineage:
      - datalake_listing_jobs.listing_quality_sla.has_backlog
    description: Boolean information that indicates whether the service generated backlog.
  has_video:
    lineage:
      - datalake_listing_jobs.listing_quality_sla.has_video
    description: Boolean information that indicates whether the house has video on the platform.
  dt_uploaded:
    lineage:
      - datalake_listing_jobs.listing_quality_sla.dt_uploaded
    description: Date the video was added to the platform.
  dt_ticket_created:
    lineage:
      - datalake_listing_jobs.listing_quality_sla.dt_ticket_created
    description: Date (local) on which the service ticket was created.
  dt_ticket_solved:
    lineage:
      - datalake_listing_jobs.listing_quality_sla.dt_ticket_solved
    description: Date (local) on which the service ticket was resolved.
  year:
    lineage:
      - current_date
    description: Current year.
  month:
    lineage:
      - current_date
    description: Current month.
  day:
    lineage:
      - current_date
    description: Current day.
  ts_load:
    lineage:
      - now()
    description: Timestamp of the load.