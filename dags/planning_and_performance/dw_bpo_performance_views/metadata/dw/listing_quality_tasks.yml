database_name: dw_bpo_performance
table_name: listing_quality_sla
description: Table that contains the listing quality SLA metrics for bpo performance.
domain: Cross
owner: data-pp@quintoandar.com.br
columns:
  id_ticket:
    lineage:
      - datalake_listing_jobs.listing_quality_tasks.id_ticket
    description: Identification key of the service ticket related to listing quality.
  id_photo_job:
    lineage:
      - datalake_listing_jobs.listing_quality_tasks.id_photo_job
    description: Identification key of the photo job related to listing quality.
  id_house:
    lineage:
      - datalake_listing_jobs.listing_quality_tasks.id_house
    description: Identification key of the house involved in the service.
  user_sender:
    lineage:
      - datalake_listing_jobs.listing_quality_tasks.user_sender
    description: Type of user who sent the demand.
  responsible_analyst_name:
    lineage:
      - datalake_listing_jobs.listing_quality_tasks.responsible_analyst_name
    description: Name of the analyst responsible for the service.
  responsible_analyst_email:
    lineage:
      - datalake_listing_jobs.listing_quality_tasks.responsible_analyst_email
    description: Email of the analyst responsible for the service.
  organization:
    lineage:
      - datalake_listing_jobs.listing_quality_tasks.responsible_analyst_organization
    description: Organization of the analyst responsible for the service.
  group_name:
    lineage:
      - datalake_listing_jobs.listing_quality_tasks.group_name
    description: Group the ticket is part of.
  house_classification:
    lineage:
      - datalake_listing_jobs.listing_quality_tasks.house_classification
    description: Descriptive data that indicates the condition of the house.
  house_classification_reason:
    lineage:
      - datalake_listing_jobs.listing_quality_tasks.house_classification_reason
    description: Data in array format with the reasons why the house was
      classified with the data in the house_classification column.
  classification_comments:
    lineage:
      - datalake_listing_jobs.listing_quality_tasks.classification_comments
    description: Additional comments to house rating.
  signboard_location:
    lineage:
      - datalake_listing_jobs.listing_quality_tasks.signboard_location
    description: Location of the signboard.
  status:
    lineage:
      - datalake_listing_jobs.listing_quality_tasks.status
    description: Status of the ticket.
  ts_created:
    lineage:
      - datalake_listing_jobs.listing_quality_tasks.ts_created
    description: Timestamp of the ticket creation.
  ts_created_local:
    lineage:
      - datalake_listing_jobs.listing_quality_tasks.ts_created_local
    description: Timestamp of the ticket creation in local time.
  dt_analyzed_utc:
    lineage:
      - datalake_listing_jobs.listing_quality_tasks.dt_analyzed_utc
    description: Timestamp of the ticket updated in UTC time.
  dt_analyzed:
    lineage:
      - datalake_listing_jobs.listing_quality_tasks.dt_analyzed
    description: Timestamp of the ticket analysis in local time. (utc to local)
  year:
    lineage:
      - current_date
    description: Current year.
  month:
    lineage:
      - current_date
    description: Current month.
  day:
    lineage:
      - current_date
    description: Current day.
  ts_load:
    lineage:
      - now()
    description: Timestamp of the load.