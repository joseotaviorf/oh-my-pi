dag:
  name: reverse_atento_test
  schedule_start_date: 2023,8,23
  owner: Data Planning and Performance
  documentation:
    dag_purpose: |
      This dag has the purpose of sending operation follow-up data, related to Atento services.
workflow:
  layer: reverse
  type: access
  bucket_config_name: planning_and_performance_bucket
  load_spark_job: load_reverse_atento
  spark_job_arguments:
    - "{environment}"
    - "{bucket}"
    - "{dag_name}"
    - "{schema}"
    - "{table_name}"
    - "{{ get_date_param(dag_run, data_interval_start | ts, 'load_start_date') }}"
    - "{{ get_date_param(dag_run, data_interval_end | ts, 'load_end_date') }}"
    - "atento"
    - "(atento', 'atn')"
    
  tables_customization:
    backlog_metric: {}
    csat_front: {}
    demand_metric: {}
    fcr_metric: {}
    general_metric: {}
    recontact_mx: {}
    recontact: {}
    speech_call: {}
    speech_chat: {}
    taxonomy: {}
    tmr: {}
    tickets_transferred: {}
    twilio_chat_aht: {}

cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: r6g.8xlarge
    node_type_id: r6g.4xlarge
    spark_version: 16.4.x-scala2.12
    num_workers: 5
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
  databricks_conn_id: databricks_new