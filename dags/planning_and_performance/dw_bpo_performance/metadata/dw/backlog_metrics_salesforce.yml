database_name: dw_bpo_performance
table_name: backlog_metrics_salesforce
description: A table containing a daily backlog view based on Salesforce operations.
domain: Cross
owner: alef.vieira@quintoandar.com.br
columns:
  date_reference:
    lineage:
      - current_date
    description: History reference date generated by the calendar sequence (used to explode the daily backlog snapshot).
  case_number:
    lineage:
      - datalake_salesforce_clean.events_case.case_number
    description: Unique identification number of the Salesforce case/ticket.
  ts_started:
    lineage:
      - datalake_salesforce_clean.events_case.created_date
    description: Exact date and time when the ticket was created in the ecosystem.
  sk_contract:
    lineage:
      - datalake_salesforce_clean.events_case.contract_id__c
    description: Surrogate Key that identifies the contract associated with the ticket.
  sk_user:
    lineage:
      - dw_public.dim_user.sk_user
      - datalake_salesforce_clean.events_case_member.external_id__c
    description: Unique identifier of the user/client who requested the ticket in the Data Warehouse.
  last_area:
    lineage:
      - sandbox.sla_target_salesforce.area
    description: Last area responsible for the ticket according to the SLA matrix rule.
  front_or_back:
    lineage:
      - sandbox.sla_target_salesforce.front_or_back
    description: Classification of the responsible operational team between front-line service (Front) or internal support (Back).
  last_department:
    lineage:
      - datalake_salesforce_clean.events_case.omni_channel_queue__c
    description: Original Salesforce Omni-Channel queue that was routing the ticket.
  minutes_first_reply_time_business:
    lineage:
      - datalake_salesforce_clean.cases.ts_created
      - datalake_salesforce_clean.email_message.ts_message
    description: Elapsed time in minutes until the first valid reply sent by an agent (calculated by adjusting the timezone by -7 hours).
  subject:
    lineage:
      - datalake_salesforce_clean.events_case.subject
    description: Main subject or title of the ticket entered by the user or system.
  theme:
    lineage:
      - datalake_salesforce_clean.record_types.developer_name
    description: Developer name assigned to the record type, defining the macro-theme of the ticket.
  theme_detail:
    lineage:
      - datalake_salesforce_clean.events_case.type
    description: Detailed case type (sub-classification of the ticket theme).
  sla_tgt:
    lineage:
      - sandbox.sla_target_salesforce.sla_tgt
      - datalake_salesforce_clean.case_milestones.target_response_in_days
    description: Target SLA time (in days) stipulated for the resolution of that specific type of ticket.
  replies:
    lineage:
      - datalake_salesforce_clean.email_message.ts_message
    description: Total number of interactions/email replies sent by agents for the ticket.
  is_ticket_solved_within_sla:
    lineage:
      - datalake_salesforce_clean.events_case.created_date
      - datalake_salesforce_clean.events_case.closed_date
      - sandbox.sla_target_salesforce.sla_tgt
      - datalake_salesforce_clean.case_milestones.target_response_in_days
    description: Boolean flag (TRUE/FALSE) indicating whether the ticket was resolved within the agreed SLA deadline.
  last_agent_email:
    lineage:
      - datalake_salesforce_clean.users.email
    description: Email address of the last agent who owned the case.
  last_agent_organization:
    lineage:
      - datalake_salesforce_clean.users.email
    description: Identifies the agent's partner/outsourced company based on the email domain (e.g., 'webhelp', 'atento', 'aec').
  is_spoc_test:
    lineage:
      - dw_offboarding.fact_terminations.is_spoc_contract
      - dw_offboarding.dim_termination.team
    description: Logical flag indicating whether the contract belongs to the SPOC (Single Point of Contact) project test group.
  is_pp_multi:
    lineage:
      - datalake_salesforce_clean.events_case.is_pp_multi__c
    description: Indicator of whether the ticket is part of the 'PP Multi' modality or product.
  canal_de_entrada:
    lineage:
      - datalake_salesforce_clean.events_case.origin
    description: Inbound channel through which the ticket entered Salesforce (e.g., Web, Email, API).
  platform:
    categories:
        Salesforce: Salesforce Platform
    description: Identification of the data source tool (hardcoded as 'SalesForce').
  supplied_email:
    lineage:
      - datalake_salesforce_clean.events_case.supplied_email
    description: Return email associated with the requester in Salesforce.
  fila_omni_channel:
    lineage:
      - datalake_salesforce_clean.events_case.omni_channel_queue__c
    description: Salesforce Omni-Channel queue name associated with the ticket.
  record_type_name:
    lineage:
      - datalake_salesforce_clean.record_types.record_type_name
    description: Readable name of the Salesforce record type mapped in the ticket.
  ts_solved:
    lineage:
      - datalake_salesforce_clean.events_case.status
      - datalake_salesforce_clean.events_case.last_modified_date
    description: Date and time when the ticket was marked with 'Solved' status. Returns null if the reference date is prior to the solution date.
  ts_closed:
    lineage:
      - datalake_salesforce_clean.events_case.closed_date
    description: Date and time of the definitive ticket closure. Returns null if the reference date is prior to the closure date.
  case_status:
    lineage:
      - datalake_salesforce_clean.events_case.status
    description: Current status of the ticket (returns the actual status on the completion date or 'open' if the ticket was still pending on the reference date).
  days_worked:
    lineage:
      - datalake_quintoandar.aux_date.date
      - datalake_salesforce_clean.events_case.created_date
      - datalake_gsheets_clean.service_city_holidays.dt_holiday
    description: Number of business days elapsed for the ticket on the reference date, excluding weekends and national holidays.
  days_worked_with_days_offs:
    lineage:
      - datalake_salesforce_clean.events_case.created_date
      - datalake_salesforce_clean.events_case.closed_date
    description: Number of calendar days elapsed for the ticket on the reference date, including weekends and holidays.
  days_off:
    lineage:
      - datalake_quintoandar.aux_date.date
      - datalake_gsheets_clean.service_city_holidays.dt_holiday
    description: Number of non-working days (weekends and national holidays) counted between ticket creation and the reference date.
  is_backlog_in_time:
    lineage:
      - datalake_quintoandar.aux_date.date
      - datalake_salesforce_clean.events_case.created_date
      - sandbox.sla_target_salesforce.sla_tgt
      - datalake_salesforce_clean.case_milestones.target_response_in_days
    description: Integer flag (1/0) indicating whether the ticket backlog is within the SLA target on the reference date.
  is_backlog_not_in_time:
    lineage:
      - datalake_quintoandar.aux_date.date
      - datalake_salesforce_clean.events_case.created_date
      - sandbox.sla_target_salesforce.sla_tgt
      - datalake_salesforce_clean.case_milestones.target_response_in_days
    description: Integer flag (1/0) indicating whether the ticket backlog exceeded the SLA target on the reference date.
  dt_first_open:
    lineage:
      - datalake_salesforce_clean.events_case.last_modified_date
    description: First date/time the status changed, indicating the start of handling.
  ts_solved_closed:
    lineage:
      - datalake_salesforce_clean.events_case.last_modified_date
    description: The definitive timestamp of when a case was resolved or closed. The business rule consolidates the completion time by prioritizing first, a bug fix timestamp (for keys logistics cases) second, the exact timestamp of the first status transition to 'Solved' (via event history) and finally, the official 'Closed' date of the ticket.
  is_backlog_not_in_time_3d:
    lineage:
      - dw_support_journey.fact_requests.ts_created
      - datalake_salesforce_clean.events_case.last_modified_date
    description: A binary flag (1 or 0) indicating whether the ticket's lifespan has exceeded 48 hours (approximately 3 operational days). If the ticket is still open, it compares the creation date against the start of the current day. If resolved, it compares the creation date against the resolution date (ts_solved_closed).
  year:
    lineage:
      - current_date
    description: Current year partition column derived at load time.
  month:
    lineage:
      - current_date
    description: Current month partition column derived at load time.
  day:
    lineage:
      - current_date
    description: Current day partition column derived at load time.
  ts_load:
    lineage:
      - now()
    description: Timestamp when this BPO performance record was loaded into the data warehouse.
