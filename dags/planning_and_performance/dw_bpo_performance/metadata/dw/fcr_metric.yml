database_name: dw_bpo_performance
table_name: fcr_metric
description: Table that contains infos to complement the fcr metric for bpo analysis.
domain: Cross
owner: data-pp@quintoandar.com.br
columns:
  sk_ticket:
    lineage:
      - datalake_customer_support.tickets.id_ticket
    description: Ticket identifier associated with the contact.
  ts_started:
    lineage:
      - dw_customer_support.fact_tickets.ts_created
    description: Ticket opening date
  ts_solved:
    lineage:
      - dw_customer_support.fact_tickets.ts_solved
    description: Returns the date the ticket was resolved.
  last_team: 
    lineage: 
      - dw_customer_support.dim_department.team
    description: Returns the last area belonging to the ticket.
  channel:
    lineage:
      - dw_customer_support.fact_tickets.channel
    description: Communication channel of the contact (call or chat).
  last_agent_organization:
    lineage: 
      - dw_customer_support.dim_analyst.agent_organization
    description: Returns the organization of the analyst of the last analyst assigned to the ticket.
  flag_back: 
    lineage: 
      - dw_customer_support.fact_tickets.front_or_back
    description: Indicates whether the ticket belongs to the Back.
  theme_recontact_flag:
    lineage:
      - dw_customer_support.fact_tickets.ts_created
      - dw_customer_support.fact_tickets.sk_user
      - dw_customer_support.dim_department.team
      - dw_customer_support.dim_taxonomy.theme
    description: Indicates whether the customer from that ticket returned within 4 days to discuss the same issue.
  is_pp_multi:
    lineage:
      - datalake_pp_multi.pp_multi_classification_history.pp_multi_classification
    description: Indicates whether the ticket owner is a PP Multi.
  first_resolution_last_agent:
    lineage: 
     - dw_customer_support.fact_tickets.ts_solved
    description: Returns the date of the first resolution by the analyst associated with the ticket. 
  last_department:
    lineage:
      - dw_customer_support.dim_department.department
    description: Returns the last department/queue associated with the ticket. 
  theme_recontact_flag_per_bpo:
    lineage:
      - dw_customer_support.fact_tickets.ts_created
      - dw_customer_support.fact_tickets.sk_user
      - dw_customer_support.dim_department.team
      - dw_customer_support.dim_taxonomy.theme
    description: Indicates whether the customer from that ticket returned within 4 days to discuss the same issue per bpo.
  year:
    lineage:
      - current_date
    description: Current year.
  month:
    lineage:
      - current_date
    description: Current month.
  day:
    lineage:
      - current_date
    description: Current day.
  ts_load:
    lineage:
      - now()
    description: Timestamp of the load.
