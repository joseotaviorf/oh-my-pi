dag:
  name: dw_bpo_performance
  schedule_start_date: 2025, 11, 25
  owner: Data Planning and Performance
  documentation:
    dag_purpose: |
      Creates tables for planning and performance datasets, related to customer support.
workflow:
  type: query_delta
  layer: dw
  custom_schema: bpo_performance
  inner_dependencies:
    cases_perspective:
      - tickets_perspective
  default_extraction_type: full
  default_partitions: [year, month, day]
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, 1), 'load_end_date') }}"
  tables_customization:
    cases_perspective:
      partitions: [year, month, day]
      extraction_type: incremental
      merge_on: [case_number, Platform]
      z_order_by: [case_number]
    backlog_metric:
      partitions: [year, month, day]
      extraction_type: full
    csat_front:
      partitions: [year, month, day]
      extraction_type: full
    demand_metric:
      partitions: [year, month, day]
      extraction_type: full
    fcr_metric:
      partitions: [year, month, day]
      extraction_type: full
    email:
      partitions: [year, month, day]
      extraction_type: full
    general_metric:
      partitions: [year, month, day]
      extraction_type: full
    listing_quality_sla:
      partitions: [year, month, day]
      extraction_type: full
    listing_quality_tasks:
      partitions: [year, month, day]
      extraction_type: full
    nps_offboarding:
      partitions: [year, month, day]
      extraction_type: full
    recontact:
      partitions: [year, month, day]
      extraction_type: full
    repair_tickets:
      partitions: [year, month, day]
      extraction_type: full
    segments_perspective:
      partitions: [year, month, day]
      extraction_type: full
    speech_call:
      partitions: [year, month, day]
      extraction_type: full
    speech_chat:
      partitions: [year, month, day]
      extraction_type: full
    tarefas_salesforce:
      partitions: [year, month, day]
      extraction_type: full
    taxonomy:
      partitions: [year, month, day]
      extraction_type: full
    tickets_contract:
      partitions: [year, month, day]
      extraction_type: full
    tickets_perspective:
      partitions: [year, month, day]
      extraction_type: full
    tickets_transferred:
      partitions: [year, month, day]
      extraction_type: full
    tmr:
      partitions: [year, month, day]
      extraction_type: full
    twilio_chat_aht:
      partitions: [year, month, day]
      extraction_type: full
    twilio_spoc:
      partitions: [year, month, day]
      extraction_type: full
