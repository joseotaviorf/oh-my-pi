dag:
  name: reverse_aec
  schedule_start_date: 2026,1,7
  owner: Data Planning and Performance
  documentation:
    dag_purpose: |
      This dag has the purpose of sending operation follow-up data, related to AeC services.
workflow:
  layer: reverse
  type: access
  bucket_config_name: planning_and_performance_bucket
  gchat_export_summary: true
  load_spark_job: load_reverse_aec
  spark_job_arguments:
    - "{environment}"
    - "{bucket}"
    - "{dag_name}"
    - "dw_bpo_performance"
    - "{table_name}"
    - "{{ get_date_param(dag_run, data_interval_start | ts, 'load_start_date') }}"
    - "{{ get_date_param(dag_run, data_interval_end | ts, 'load_end_date') }}"
    - "aec"
    - "('aec', 'AeC')"
    - "{{ dag_run.run_id }}"
    
  tables_customization:
    backlog_metric: {}
    tickets_contract: {}
    fcr_metric: {}
    cases_perspective: {}
    backlog_metrics_salesforce: {}
    customer_contacts_session: {}
    segments_perspective: {}
    satisfaction_salesforce: {}

