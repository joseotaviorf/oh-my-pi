dag:
  name: reverse_aec
  schedule_start_date: 2026,1,7
  owner: Data Planning and Performance
  documentation:
    dag_purpose: |
      This dag has the purpose of sending operation follow-up data, related to AeC services.
workflow:
  layer: reverse
  type: access
  bucket_config_name: planning_and_performance_bucket
  load_spark_job: load_reverse_aec
  spark_job_arguments:
    - "{environment}"
    - "{bucket}"
    - "{dag_name}"
    - "dw_bpo_performance"
    - "{table_name}"
    - "{{ get_date_param(dag_run, data_interval_start | ts, 'load_start_date') }}"
    - "{{ get_date_param(dag_run, data_interval_end | ts, 'load_end_date') }}"
    - "aec"
    - "('aec', 'AeC')"
    
  tables_customization:
    segments_perspective: {}
    tickets_perspective: {}
    backlog_metric: {}
    tickets_contract: {}

cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: r6g.8xlarge
    node_type_id: r6g.4xlarge
    spark_version: 16.4.x-scala2.12
    num_workers: 3
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
  databricks_conn_id: databricks_new