dag:
  name: reverse_concentrix
  schedule_start_date: 2026,5,26
  owner: Data Planning and Performance
  documentation:
    dag_purpose: |
      This dag has the purpose of processing and storing the operation follow-up data, related to webhelp services.
    additional_information: |
      ### Sending only some datasets (Trigger DAG w/ config)

      By default every table listed in `tables_customization` is exported. To send a
      subset, set `tables` in the run conf:

      ```json
      {
        "load_start_date": "2026-09-01",
        "load_end_date": "2026-09-01",
        "tables": ["segments_perspective", "fcr_metric"]
      }
      ```

      - Omit `tables` (or leave it empty) to export every configured table — this is
        what scheduled runs do.
      - A comma-separated string (`"segments_perspective,fcr_metric"`) also works.
      - The selection is applied by `load_reverse_concentrix`, so every export task
        still runs: the unselected ones exit right away without writing to S3.
      - A name absent from `tables_customization` below matches no table, so the run
        succeeds having exported nothing for it. Check the spelling against that list
        when a run exports fewer files than expected.
workflow:
  layer: reverse
  type: access
  bucket_config_name: planning_and_performance_bucket
  gchat_export_summary: true
  load_spark_job: load_reverse_concentrix
  spark_job_arguments:
    - "{environment}"
    - "{bucket}"
    - "{dag_name}"
    - "dw_bpo_performance"
    - "{table_name}"
    - "{{ get_date_param(dag_run, data_interval_start | ts, 'load_start_date') }}"
    - "{{ get_date_param(dag_run, data_interval_end | ts, 'load_end_date') }}"
    - "cnx"
    - "('webhelp','concentrix','cnx')"
    - "{{ dag_run.run_id }}"
    - "{{ (dag_run.conf.get('tables') if dag_run.conf else none) | tojson }}"

  tables_customization:
    tickets_contract: {}
    cases_perspective: {}
    backlog_metrics_salesforce: {}
    satisfaction_salesforce: {}
    fcr_metric: {}
    customer_contacts_session: {}
    segments_perspective: {}
    offboarding_perspective: {}