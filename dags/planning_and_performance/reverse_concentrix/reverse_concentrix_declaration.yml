dag:
  name: reverse_concentrix
  schedule_start_date: 2026,5,26
  owner: Data Planning and Performance
  documentation:
    dag_purpose: |
      This dag has the purpose of processing and storing the operation follow-up data, related to webhelp services.
workflow:
  layer: reverse
  type: access
  bucket_config_name: planning_and_performance_bucket
  load_spark_job: load_reverse_concentrix
  spark_job_arguments:
    - "{environment}"
    - "{bucket}"
    - "{dag_name}"
    - "dw_bpo_performance"
    - "{table_name}"
    - "{{ get_date_param(dag_run, data_interval_start | ts, 'load_start_date') }}"
    - "{{ get_date_param(dag_run, data_interval_end | ts, 'load_end_date') }}"
    - "cnx"
    - "('webhelp','concentrix','cnx')"

  tables_customization:
    segments_perspective: {}
    tickets_perspective: {}
    tickets_contract: {}
    cases_perspective: {}

cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: r5a.2xlarge
    node_type_id: r5a.2xlarge
    spark_version: 16.4.x-scala2.12
    num_workers: 5
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
  databricks_conn_id: databricks_new

