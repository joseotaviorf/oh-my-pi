dag:
  name: reverse_webhelp_test
  schedule_start_date: 2026,5,7
  owner: Data Planning and Performance
  documentation:
    dag_purpose: |
      This dag has the purpose of processing and storing the operation follow-up data, related to webhelp services.
workflow:
  type: load_access
  layer: reverse
  load_spark_job: load_reverse_webhelp
  spark_job_arguments:
    - "{environment}"
    - "{bucket}"
    - "{dag_name}"
    - "dw_bpo_performance"
    - "{table_name}"
    - "{{ get_date_param(dag_run, data_interval_start | ts, 'load_start_date') }}"
    - "{{ get_date_param(dag_run, data_interval_end | ts, 'load_end_date') }}"
    - "webhelp"
    - "('webhelp','concentrix','cnx')"

  tables_customization:
    segments_perspective: {}
    tickets_perspective: {}
    backlog_metric: {}
    tickets_contract: {}
    cases_perspective: {}


  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, 1), 'load_start_date') }}"
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: r5a.8xlarge
    node_type_id: r5a.4xlarge
    spark_version: 16.4.x-scala2.12
    num_workers: 5
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: USER_ISOLATION
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
  databricks_conn_id: databricks_new

