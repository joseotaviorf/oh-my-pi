database_name: datalake_journey_optimizer_clean
table_name: business_case_policies
description: >
  Clean copy of the business_case_policies configuration table from Journey Optimizer.
  Defines policy versions (rule-based or ML model) attached to each business case.
  Column names follow lake naming conventions (id_*, ts_* prefixes).
  Primary key: id_policy.
domain: Journey Optimizer
owner: vinicius.valves@quintoandar.com
columns:
  id_policy:
    description: Primary key. UUID uniquely identifying this policy version.
    lineage:
      - datalake_journey_optimizer_raw.business_case_policies.policy_id
  id_business_case:
    description: FK to business_case. UUID of the business case this policy belongs to.
    lineage:
      - datalake_journey_optimizer_raw.business_case_policies.business_case_id
  policy_type:
    description: Type of policy strategy (e.g. RULE_BASED, EPSILON_GREEDY, UCB1, RANDOM).
    lineage:
      - datalake_journey_optimizer_raw.business_case_policies.policy_type
  policy_version:
    description: Version label for this policy within the business case, used for rollback and auditing.
    lineage:
      - datalake_journey_optimizer_raw.business_case_policies.policy_version
  spec:
    description: JSON specification of the policy parameters, model config, or rule definitions.
    lineage:
      - datalake_journey_optimizer_raw.business_case_policies.spec
  exploration_budget:
    description: Numeric fraction (0–1) controlling the exploration rate for bandit strategies. Null for rule-based policies.
    lineage:
      - datalake_journey_optimizer_raw.business_case_policies.exploration_budget
  is_active:
    description: Boolean flag indicating whether this is the currently active policy for the business case.
    lineage:
      - datalake_journey_optimizer_raw.business_case_policies.is_active
  ts_created:
    description: Timestamp (with timezone) when this policy version was created.
    lineage:
      - datalake_journey_optimizer_raw.business_case_policies.created_at
