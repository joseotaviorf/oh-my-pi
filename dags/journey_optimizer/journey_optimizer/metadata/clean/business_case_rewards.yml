database_name: datalake_journey_optimizer_clean
table_name: business_case_rewards
description: >
  Clean copy of the business_case_rewards configuration table from Journey Optimizer.
  Reward signal definitions tied to a trigger binding, describing positive outcome criteria.
  Column names follow lake naming conventions (id_*, ts_* prefixes).
  Primary key: id_reward_registry.
domain: Journey Optimizer
owner: vinicius.valves@quintoandar.com.br
columns:
  id_reward_registry:
    description: Primary key. UUID uniquely identifying this reward signal definition.
    lineage:
      - datalake_journey_optimizer_raw.business_case_rewards.reward_registry_id
  id_business_case:
    description: FK to business_case. UUID of the business case this reward definition belongs to.
    lineage:
      - datalake_journey_optimizer_raw.business_case_rewards.business_case_id
  id_trigger_binding:
    description: FK to business_case_trigger_events. UUID of the trigger binding that activates this reward signal.
    lineage:
      - datalake_journey_optimizer_raw.business_case_rewards.trigger_binding_id
  reward_type:
    description: Type classification of the reward signal being defined (e.g. CONVERSION, CLICK, REVENUE).
    lineage:
      - datalake_journey_optimizer_raw.business_case_rewards.reward_type
  value_expression:
    description: Optional expression or formula used to compute the numeric value of a reward observation.
    lineage:
      - datalake_journey_optimizer_raw.business_case_rewards.value_expression
  description:
    description: Optional text describing the business meaning and expected behavior of this reward signal.
    lineage:
      - datalake_journey_optimizer_raw.business_case_rewards.description
  is_active:
    description: Boolean flag indicating whether this reward definition is currently active.
    lineage:
      - datalake_journey_optimizer_raw.business_case_rewards.is_active
  ts_created:
    description: Timestamp (with timezone) when this reward definition was created.
    lineage:
      - datalake_journey_optimizer_raw.business_case_rewards.created_at
  ts_updated:
    description: Timestamp (with timezone) when this reward definition was last updated.
    lineage:
      - datalake_journey_optimizer_raw.business_case_rewards.updated_at
