---
dag_documentation:
  dag_purpose: "[Amazon Cognito](https://aws.amazon.com/pt/cognito/) is an
    identity platform made to authenticate and authorize users. This DAG is
    responsible for ingesting some of its user pools into the data lake, so we
    can know which users actually have access to our services."
tables:
  - table_name: rede_user_pool
    user_pool_id: us-east-1_YGGKO9kNZ
custom_cluster:
  driver_node_type_id: r5a.4xlarge
  node_type_id: r5a.2xlarge
  num_workers: 3
  spark_version: 12.2.x-scala2.12
  aws_attributes:
    ebs_volume_size: 200
    instance_profile_arn: "{{ var.value.instance_profile_secret_arn_cognito_ingestion }}"
