---
database_name: datalake_rede_supply
table_name: simplified_lead_3p_status_changes
domain: Rede
owner: gustavo.miller@quintoandar.com.br
description: 'Unifies all events of lead 3p status changes associated with the business context, calculating everything that CAN be incremental.'
columns:
  id_status_change:
    description: 'Unique identifier of the status change.'
  id_lead_3p:
    lineage:
      - datalake_brokers_supply_processor_clean.lead_3p_aud.id
      - datalake_brokers_supply_processor.lead_3p.id
    description: 'Unique identifier of the lead'
  id_file:
    lineage:
      - datalake_brokers_supply_processor_clean.lead_3p_aud.id_file
      - datalake_brokers_supply_processor.lead_3p.id_file
    description: 'Unique identifier of the file that sent the lead in that business context.'
  id_house:
    lineage:
      - datalake_sale_listings.sale_listing_status.id_house
    description: 'Id of the house.'
  business_context:
    lineage:
      - datalake_ebdb_clean.listing_business_context_aud.business_context
      - datalake_brokers_supply_processor_clean.business_context_detail_aud.business_context
    description: 'Either SALE or RENT.'
    categories:
      SALE: ''
      RENT: ''
  status:
    lineage:
      - datalake_brokers_supply_processor_clean.lead_3p_aud.status
    description: 'Status of the lead'
    categories:
      REGISTERED: 'Registered in Main for publication'
      SUSPENDED: 'Lead suspended'
      WAITING: 'Lead eligible and waiting for owner information'
      PROCESSING: 'Lead in image processing'
      QUEUE: 'Lead awaiting in the duplicate queue'
      NOT_CONVERTED: 'Lead not converted due to ineligibility, enrichment or discard'
  listing_status:
    lineage:
      - datalake_ebdb_clean.listing_business_context_aud.status
      - datalake_ebdb_clean.listing_business_context_aud.status_closing
    description: 'Status of the listing'
  has_owner_info:
    description: 'Whether the lead has owner information at the time of the event'
  is_waiting_for_enrichment:
    description: 'Whether the lead is waiting for enrichment at the time of the event'
  is_ineligible:
    description: 'Whether the lead is ineligible at the time of the event'
  is_discarded:
    description: 'Whether the lead is discarded at the time of the event'
  ts_status_started:
    lineage:
      - datalake_brokers_supply_processor_clean.lead_3p_aud.ts_updated
      - datalake_ebdb_user.user_revision_entity.ts_revision
    description: 'Timestamp of when the status started'
  year:
    lineage:
      - datalake_brokers_supply_processor_clean.lead_3p_aud.year
      - datalake_ebdb_user.user_revision_entity.ts_revision
    description: 'Year of when the status started'
  month:
    lineage:
      - datalake_brokers_supply_processor_clean.lead_3p_aud.month
      - datalake_ebdb_user.user_revision_entity.ts_revision
    description: 'Month of when the status started'
  day:
    lineage:
      - datalake_brokers_supply_processor_clean.lead_3p_aud.day
      - datalake_ebdb_user.user_revision_entity.ts_revision
    description: 'Day of when the status started'
  ts_load:
    description: 'Timestamp of when the row was loaded in the table.'
