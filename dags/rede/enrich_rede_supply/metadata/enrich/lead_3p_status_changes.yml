---
database_name: datalake_rede_supply
table_name: lead_3p_status_changes
domain: Rede
owner: gustavo.miller@quintoandar.com.br
description: 'Unifies all events of lead 3p status changes associated with the business context.'
columns:
  id_status_change:
    lineage:
      - datalake_rede_supply.simplified_lead_3p_status_changes.id_status_change
    description: 'Primary key of the table. Generated with autoincrement.'
  id_lead_3p:
    lineage:
      - datalake_rede_supply.simplified_lead_3p_status_changes.id_lead_3p
    description: 'Unique identifier of the lead.'
  id_company_hubspot:
    lineage:
      - datalake_hubspot_clean.company.id
    description: 'ID of the company in HubSpot associated with this lead and this context.'
  id_file:
    lineage:
      - datalake_rede_supply.simplified_lead_3p_status_changes.id_file
    description: 'Unique identifier of the file that sent the lead in that business context.'
  id_house:
    lineage:
      - datalake_rede_supply.simplified_lead_3p_status_changes.id_house
    description: 'Id of the house.'
  business_context:
    lineage:
      - datalake_rede_supply.simplified_lead_3p_status_changes.business_context
    description: 'Either SALE or RENT.'
    categories:
      SALE: ''
      RENT: ''
  status:
    lineage:
      - datalake_rede_supply.simplified_lead_3p_status_changes.status
      - datalake_rede_supply.simplified_lead_3p_status_changes.listing_status
    description: 'Status of the lead or its listing'
    categories:
      REGISTERED: 'Registered in Main for publication'
      SUSPENDED: 'Lead suspended'
      WAITING: 'Lead eligible and waiting for owner information'
      PROCESSING: 'Lead in image processing'
      QUEUE: 'Lead awaiting in the duplicate queue'
      NOT_CONVERTED: 'Lead not converted due to ineligibility, enrichment or discard'
      PUBLISHED: 'Published in Main'
      UNPUBLISHED: 'Unpublished from Main'
  is_waiting_for_enrichment:
    lineage:
      - datalake_rede_supply.simplified_lead_3p_status_changes.is_waiting_for_enrichment
    description: 'True if the lead is not converted at this point due to an enrichment reason.'
  is_ineligible:
    lineage:
      - datalake_rede_supply.simplified_lead_3p_status_changes.is_ineligible
    description: 'True if the lead is not converted at this point due to an inegibility reason.'
  is_discarded:
    lineage:
      - datalake_rede_supply.simplified_lead_3p_status_changes.is_discarded
    description: 'True if the lead is not converted at this point due to a discard reason.'
  ts_status_started:
    lineage:
      - datalake_rede_supply.simplified_lead_3p_status_changes.ts_status_started
    description: 'Timestamp of when the status started.'
  ts_status_ended:
    lineage:
      - datalake_rede_supply.simplified_lead_3p_status_changes.ts_status_started
    description: 'Timestamp of when the status ended.'
