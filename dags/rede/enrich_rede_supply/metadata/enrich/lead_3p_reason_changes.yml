---
database_name: datalake_rede_supply
table_name: lead_3p_reason_changes
domain: Rede
owner: gustavo.miller@quintoandar.com.br
description: 'Every non-conversion reason associated with a lead and its business context becomes a row in this table, with their validity dates (ts_reason_started and ended)'
columns:
  id_lead_3p:
    lineage:
      - datalake_brokers_supply_processor_clean.lead_3p_aud.id
    description: 'Unique identifier of the lead.'
  id_company_hubspot:
    lineage:
      - datalake_rede_supply.lead_3p_status_changes.id_company_hubspot
    description: 'ID of the company in HubSpot associated with this lead and this context.'
  id_file:
    lineage:
      - datalake_brokers_supply_processor_clean.lead_3p_aud.id_file
    description: 'Unique identifier of the file that sent the lead in that business context.'
  business_context:
    lineage:
      - datalake_brokers_supply_processor_clean.business_context_detail_aud
    description: 'Either SALE or RENT.'
    categories:
      SALE: ''
      RENT: ''
  reason:
    lineage:
      - datalake_brokers_supply_processor_clean.lead_3p_aud.status_reason
    description: 'Name of the reason of non-conversion.'
  reason_type:
    lineage:
      - datalake_gsheets_clean.supply_processor_status_reasons.reason_type
    description: 'Type of reason of non-conversion.'
    categories:
      INELIGIBLE_REASON: 'Lead is ineligible, and will not become a prospect'
      DISCARD_REASON: 'Lead is eligible, but was discarded afterwards'
      ENRICHMENT_REASON: 'Lead can convert, as long as an information is enriched'
  status_when_reason_started:
    lineage:
      - datalake_rede_supply.lead_3p_status_changes.status
    description: 'Status of the lead when this row was created.'
  growth_status_when_reason_started:
    lineage:
      - datalake_rede_supply.lead_3p_status_changes.growth_status
    description: 'Growth status of the lead when this row was created.'
  status_when_reason_ended:
    lineage:
      - datalake_rede_supply.lead_3p_status_changes.status
    description: 'Status of the lead when the validity of this reason ended.'
  growth_status_when_reason_ended:
    lineage:
      - datalake_rede_supply.lead_3p_status_changes.growth_status
    description: 'Growth status of the lead when the validity of this reason ended.'
  is_waiting_for_enrichment_when_reason_started:
    lineage:
      - datalake_rede_supply.lead_3p_status_changes.is_waiting_for_enrichment
    description: 'True if the lead was awaiting for enrichment when this row was created.'
  is_ineligible_when_reason_started:
    lineage:
      - datalake_rede_supply.lead_3p_status_changes.is_ineligible
    description: 'True if the lead was ineligible when this row was created.'
  is_discarded_when_reason_started:
    lineage:
      - datalake_rede_supply.lead_3p_status_changes.is_discarded
    description: 'True if the lead was discarded when this row was created.'
  is_waiting_for_enrichment_when_reason_ended:
    lineage:
      - datalake_rede_supply.lead_3p_status_changes.is_waiting_for_enrichment
    description: 'True if the lead was awaiting for enrichment when the validity of this reason ended.'
  is_ineligible_when_reason_ended:
    lineage:
      - datalake_rede_supply.lead_3p_status_changes.is_ineligible
    description: 'True if the lead was ineligible when the validity of this reason ended.'
  is_discarded_when_reason_ended:
    lineage:
      - datalake_rede_supply.lead_3p_status_changes.is_discarded
    description: 'True if the lead was discarded when the validity of this reason ended.'
  ts_reason_started:
    lineage:
      - datalake_brokers_supply_processor_clean.lead_3p_aud.ts_updated
    description: 'Timestamp of when the reason started applying.'
  ts_reason_ended:
    lineage:
      - datalake_brokers_supply_processor_clean.lead_3p_aud.ts_updated
      - datalake_rede_supply.lead_3p_status_changes.ts_status_started
    description: 'Timestamp of when the reason ended. This can be either due to the requisite being fulfilled, or (in case of enrichment reasons) the lead was discarded
    or considered ineligible afterwards.'
