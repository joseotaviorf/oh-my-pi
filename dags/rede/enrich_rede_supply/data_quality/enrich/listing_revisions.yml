---
table_name: datalake_rede_supply.listing_revisions
alert_channel: "#alerts-de-airflow-dags"
table_level_validations:
  has_size:
    greater_than: 700000
    severity_level: Error
column_level_validations:
  id_house:
    is_complete:
      severity_level: Error
  event_type:
    is_complete:
      severity_level: Error
    is_contained_in:
      values:
        - LISTING_UNPUBLISHED
        - HOUSE_UPDATED
