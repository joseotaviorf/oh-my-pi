---
dag_documentation:
  dag_purpose: Vespúcio is a service that tries to generate a source of truth for condos and houses, joining multiple separate
    sources of data. This DAG is responsible for enriching the sources of data that Vespúcio uses, saving them as delta tables.
    This is currently out of pattern, but creating the DAG is the first step to start adequating it.
tables:
  - ebdb_condo
  - ebdb_house
  - kodak_metadata_condo
  - sindiconet_condo
