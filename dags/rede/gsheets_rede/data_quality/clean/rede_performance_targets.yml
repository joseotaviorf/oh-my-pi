---
table_name: datalake_gsheets_clean.rede_performance_targets
alert_channel: "#alerts-de-airflow-dags"
table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error
column_level_validations:
  month:
    is_complete:
      severity_level: Error
  cohort:
    is_complete:
      severity_level: Warning
  context:
    is_complete:
      severity_level: Warning
    is_contained_in:
      values:
        - demand
        - supply
        - lead_gen