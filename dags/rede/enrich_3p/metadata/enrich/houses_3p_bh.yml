---
database_name: datalake_3p
table_name: houses_3p_bh
description: Table with all the houses in Belo Horizonte owned by Rede QuintoAndar partners. This creates a relationship between listing and partner company. Each line is a house.
domain: Rede
owner: data-for-sale@quintoandar.com.br
columns:
  id_house:
    lineage:
      - datalake_ebdb_listing.house.id
    description: ID QuintoAndar of the house. It can be related to almost all QuintoAndar models.
  internal_admin_info:
    lineage:
      - datalake_ebdb_listing.house.internal_admin_info
    description: Tag identifying the partner company. It can contain the company ID.
  partner:
    lineage:
      - datalake_ebdb_listing.house.partner_3p_supply
    description: Name of the partner who sent the property to QuintoAndar via the Rede.
  ts_load: 
    description: Timestamp of the load.
