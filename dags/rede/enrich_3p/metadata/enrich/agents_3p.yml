---
database_name: datalake_3p
table_name: agents_3p
description: Table of all Rede QuintoAndar partner agents. This creates a relationship between QuintoAndar, agents and partner company. Each line is a agent.
domain: Rede
owner: data-for-sale@quintoandar.com.br
columns:
  id_user:
    lineage:
      - datalake_ebdb_clean.user.id
    description: ID QuintoAndar of the user referring to the Agent (all personas such as buyers, sellers, tenants, agents, employees and so on have an id_user). 
      It can be related to dw_public.dim_user.
  id_agent:
    lineage:
      - datalake_ebdb_clean.user.id_agent
    description: ID QuintoAndar of the agent. It can be related to dw_public.dim_agent.
  id_work_contract:
    lineage:
      - datalake_ebdb_clean.agent_data.id_work_contract
    description: ID QuintoAndar of the work contract. It can be related to dim_work_contract and all other models that have an id_work_contract (mainly Rede).
  contract_name:
    lineage:
      - datalake_ebdb_clean.work_contract.contract_name
    description: Tag that identifies which partner company refers to the agent.
  partner:
    lineage:
      - datalake_ebdb_clean.work_contract.contract_name
    description: Name of the partner the agent works for.
  ts_load:
      description: Timestamp of the load.
  
