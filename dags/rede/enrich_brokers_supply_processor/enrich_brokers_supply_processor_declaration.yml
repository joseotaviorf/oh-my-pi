dag:
  name: enrich_brokers_supply_processor
  schedule_start_date: 2020, 7, 1
  owner: Data Rede
  documentation:
    dag_purpose: |
      Creates enriched tables for the `Supply Processor` Product, responsible for managing Rede Supply leads. Most of the fields, especially in `lead_3p`, are JSON strings, so it is convenient to extract the fields into proper columns.
workflow:
  type: query_delta
  layer: enrich
  inner_dependencies:
    lead_3p:
    - file
    - business_context_detail
cluster:
  type: databricks_12_2_med_general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
