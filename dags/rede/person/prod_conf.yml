---
dag_documentation:
  dag_purpose: This DAG imports the tables from Person, a service that centralizes natural person data.
tables:
  - table_name: address
    date_filter_column: updated_at
    clean_extraction_type: full
  - table_name: address_aud
    date_filter_column: created_at
  - table_name: contact_info
    date_filter_column: updated_at
    clean_extraction_type: full
  - table_name: contact_info_aud
    date_filter_column: created_at
  - table_name: credential_reference
    date_filter_column: updated_at
    clean_extraction_type: full
  - table_name: credential_reference_aud
    date_filter_column: created_at
  - table_name: identity_document
    date_filter_column: updated_at
    clean_extraction_type: full
  - table_name: identity_document_aud
    date_filter_column: created_at
  - table_name: person
    date_filter_column: updated_at
    clean_extraction_type: full
  - table_name: person_aud
    date_filter_column: created_at
  - table_name: person_identity
    date_filter_column: updated_at
    clean_extraction_type: full
  - table_name: person_identity_aud
    date_filter_column: created_at
  - table_name: preference_settings
    date_filter_column: updated_at
    clean_extraction_type: full
  - table_name: preference_settings_aud
    date_filter_column: created_at
  - table_name: revinfo
    clean_table_name: rev_info
    date_filter_column: revtstmp
    unixtime_measure: milliseconds
  - table_name: right_to_be_forgotten
    date_filter_column: updated_at
    clean_extraction_type: full
  - table_name: right_to_be_forgotten_aud
    date_filter_column: created_at
inner_dependencies:
  address:
    - address_aud
  contact_info:
    - contact_info_aud
  credential_reference:
    - credential_reference_aud
  identity_document:
    - identity_document_aud
  person:
    - person_aud
  preference_settings:
    - preference_settings_aud
  right_to_be_forgotten:
    - right_to_be_forgotten_aud

partition_cols: ["year", "month", "day"]
