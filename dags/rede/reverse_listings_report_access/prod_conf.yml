---
sns_topic_arn: arn:aws:sns:us-east-1:632540934959:prod-reports-business-events
database_name: reverse_listings_report
tables:
  sale_listing_traffic:
    event_type: NEW_LISTING_TRAFFIC
  sale_listing_published:
    event_type: NEW_LISTING_PUBLISHED
  sale_ongoing_listings:
    event_type: ONGOING_LISTINGS
  sale_listing_visit_scheduled:
    event_type: NEW_LISTING_VISIT_SCHEDULED
  sale_listing_visit_confirmed:
    event_type: NEW_LISTING_VISIT_CONFIRMED
  sale_listing_offer_sent:
    event_type: NEW_LISTING_OFFER_SENT
  sale_listing_offer_accepted:
    event_type: NEW_LISTING_OFFER_ACCEPTED
  sale_listing_signed_contract:
    event_type: NEW_LISTING_SIGNED_CONTRACT
    
custom_cluster:
  driver_node_type_id: m5a.xlarge
  node_type_id: m5a.xlarge
  num_workers: 3
  spark_version: 12.2.x-scala2.12
  aws_attributes:
      ebs_volume_size: 200
      instance_profile_arn: "{{ var.value.instance_profile_secret_arn_reverse_listings_report }}"
