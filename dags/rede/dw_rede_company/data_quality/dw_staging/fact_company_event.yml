---
table_name: dw_rede.fact_company_event
alert_channel: "#alerts-de-airflow-dags"
table_level_validations:
  has_size:
    greater_than: 14000
    severity_level: Error
column_level_validations:
  sk_company_event:
    is_complete:
      severity_level: Error
    is_unique:
      severity_level: Error
  sk_company_lead:
    has_min_value:
      greater_than: -1
      severity_level: Error
  sk_company_event_type:
    has_min_value:
      greater_than: -1
      severity_level: Error
  sk_company_journey:
    is_complete:
      severity_level: Error
  journey_number:
    is_complete:
      severity_level: Error
  ts_event:
    is_complete:
      severity_level: Error
