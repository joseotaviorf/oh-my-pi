database_name: dw_rede
table_name: fact_company_journey
description: Every row in this table corresponds to a company journey from Rede. A
  journey is specific to a Rede business context (SALE or RENT), and ends when a deal is lost or a membership ends
  in that business context. The columns represent key events in the funnel. This is mostly collected from HubSpot.
domain: Rede
owner: gustavo.miller@quintoandar.com.br
columns:
  sk_company_lead:
    lineage:
    - dw_rede.dim_company_lead.sk_company_lead
    description: Key of the company lead associated with the event. Can be joined with
      dw_rede.dim_company_lead.
  sk_company:
    lineage:
    - dw_rede.dim_company_lead.sk_company
    description: Key of the company associated with the event, if the lead became a member at some point. Can be joined with
      dw_rede.dim_company.
  country_code:
    lineage:
    - dw_rede.dim_company_lead.country_code
    description: Code of the country where the company is located.
  sk_lead_date:
    lineage:
    - datalake_rede_company_event.company_event.ts_event
    description: Date key of when the company became a lead in the journey. In practice,
      the first event in the journey, no matter what it is, will be the lead date.
  sk_prospect_date:
    lineage:
    - datalake_rede_company_event.company_event.ts_event
    description: 'Date key of when the company became a prospect in the journey. This
      includes the status "Prospect", but also any other event that should happen
      after it.'
  sk_pre_qualified_date:
    lineage:
    - datalake_rede_company_event.company_event.ts_event
    description: 'Date key of when the company became a pre qualified in the journey.
      This includes the status "Pre Qualified", but also any other event that should
      happen after it.'
  sk_qualified_date:
    lineage:
    - datalake_rede_company_event.company_event.ts_event
    description: 'Date key of when the company became a qualified in the journey.
      This includes the status "Qualified", but also any other event that should happen
      after it.'
  sk_opportunity_date:
    lineage:
    - datalake_rede_company_event.company_event.ts_event
    description: 'Date key of when the company became an opportunity in the journey.
      This includes the status "Opportunity", but also any other event that should
      happen after it: "Membership Started", "Deal Won", "Awaiting Documents", "Documents
      Received" or "Term Sent".'
  sk_deal_won_date:
    lineage:
    - datalake_rede_company_event.company_event.ts_event
    description: Date key of the event "Deal Won".
  sk_deal_lost_date:
    lineage:
    - datalake_rede_company_event.company_event.ts_event
    description: Date key of the event "Deal Lost".
  sk_awaiting_documents_date:
    lineage:
    - datalake_rede_company_event.company_event.ts_event
    description: Date key of the event "Awaiting Documents".
  sk_term_sent_date:
    lineage:
    - datalake_rede_company_event.company_event.ts_event
    description: Date key of the event "Term Sent".
  sk_membership_started_date:
    lineage:
    - datalake_rede_company_event.company_event.ts_event
    description: Date key of the event "Membership Started".
  sk_demand_onboarding_scheduled_date:
    lineage:
    - datalake_rede_company_event.company_event.ts_event
    description: Date key of the event "Demand Onboarding Scheduled".
  sk_supply_onboarding_scheduled_date:
    lineage:
    - datalake_rede_company_event.company_event.ts_event
    description: Date key of the event "Supply Onboarding Scheduled".
  sk_first_lead_3p_date:
    lineage:
    - datalake_rede_company_event.company_event.ts_event
    description: Date key of the event "First Lead 3P".
  sk_first_listing_date:
    lineage:
    - datalake_rede_company_event.company_event.ts_event
    description: Date key of the event "First Listing".
  sk_first_demand_visit_booked_date:
    lineage:
    - datalake_rede_company_event.company_event.ts_event
    description: Date key of the event "First Demand Visit Booked".
  sk_churn_risk_date:
    lineage:
    - datalake_rede_company_event.company_event.ts_event
    description: Date key of the event "Churn Risk".
  sk_contract_termination_analysis_date:
    lineage:
    - datalake_rede_company_event.company_event.ts_event
    description: Date key of the event "Contract Termination Analysis".
  sk_membership_ended_date:
    lineage:
    - datalake_rede_company_event.company_event.ts_event
    description: Date key of the event "Membership Ended".
  sk_contract_transition_started_date:
    lineage:
    - datalake_rede_company_event.company_event.ts_event
    description: Date key of the event "Contract Transition Started".
  sk_contract_transition_completed_date:
    lineage:
    - datalake_rede_company_event.company_event.ts_event
    description: Date key of the event "Contract Transition Completed".
  sk_churn_date:
    lineage:
    - datalake_rede_company_event.company_event.ts_event
    description: Date key of the event "Churn".
  sk_journey_ended_date:
    lineage:
    - datalake_rede_company_event.company_event.ts_event
    description: Date key of when the journey ended, which can be either "Deal Lost"
      or "Membership Ended".
  journey_number:
    lineage:
    - datalake_rede_company_event.company_event.journey_number
    description: Number of the journey, which ends when a deal is lost or a membership
      ends. It starts from 0 for every company.
  ts_lead:
    lineage:
    - datalake_rede_company_event.company_event.ts_event
    description: Timestamp of when the company became a lead in the journey. In practice,
      the first event in the journey, no matter what it is, will be the lead date.
  ts_prospect:
    lineage:
    - datalake_rede_company_event.company_event.ts_event
    description: 'Timestamp of when the company became a prospect in the journey.
      This includes the status "Prospect" and "Growth Mkt Nutrition" but also any other event that should happen
      after these, described in ts_pre_qualified.'
  ts_pre_qualified:
    lineage:
    - datalake_rede_company_event.company_event.ts_event
    description: 'Timestamp of when the company became a pre qualified in the journey.
      This includes the status "Pre Qualified" and "Negotiation Meeting Pending", but also any other event that should
      happen after these, described in ts_qualified.'
  ts_qualified:
    lineage:
    - datalake_rede_company_event.company_event.ts_event
    description: 'Timestamp of when the company became a qualified in the journey. First of: "Qualified", "Negotiation Meeting Scheduled",
      "Negotiation Meeting Completed", "Negotiation In Progress", or any other event that should happen
      after these, described in ts_opportunity.'
  ts_opportunity:
    lineage:
    - datalake_rede_company_event.company_event.ts_event
    description: 'Timestamp of when the company became an opportunity in the journey.
      This includes the status "Opportunity", but also any other event that should
      happen after it: "Membership Started", "Deal Won", "Awaiting Documents", "Documents
      Received" or "Term Sent".'
  ts_deal_won:
    lineage:
    - datalake_rede_company_event.company_event.ts_event
    description: Timestamp of the event "Deal Won".
  ts_deal_lost:
    lineage:
    - datalake_rede_company_event.company_event.ts_event
    description: Timestamp of the event "Deal Lost".
  ts_awaiting_documents:
    lineage:
    - datalake_rede_company_event.company_event.ts_event
    description: Timestamp of the event "Awaiting Documents".
  ts_term_sent:
    lineage:
    - datalake_rede_company_event.company_event.ts_event
    description: Timestamp of the event "Term Sent".
  ts_membership_started:
    lineage:
    - datalake_rede_company_event.company_event.ts_event
    description: Timestamp of the event "Membership Started".
  ts_demand_onboarding_scheduled:
    lineage:
    - datalake_rede_company_event.company_event.ts_event
    description: Timestamp of the event "Demand Onboarding Scheduled".
  ts_supply_onboarding_scheduled:
    lineage:
    - datalake_rede_company_event.company_event.ts_event
    description: Timestamp of the event "Supply Onboarding Scheduled".
  ts_first_lead_3p:
    lineage:
    - datalake_rede_company_event.company_event.ts_event
    description: Timestamp of the event "First Lead 3P".
  ts_first_listing:
    lineage:
    - datalake_rede_company_event.company_event.ts_event
    description: Timestamp of the event "First Listing".
  ts_first_demand_visit_booked:
    lineage:
    - datalake_rede_company_event.company_event.ts_event
    description: Timestamp of the event "First Demand Visit Booked".
  ts_churn_risk:
    lineage:
    - datalake_rede_company_event.company_event.ts_event
    description: Timestamp of the event "Churn Risk".
  ts_contract_termination_analysis:
    lineage:
    - datalake_rede_company_event.company_event.ts_event
    description: Timestamp of the event "Contract Termination Analysis".
  ts_membership_ended:
    lineage:
    - datalake_rede_company_event.company_event.ts_event
    description: Timestamp of the event "Membership Ended".
  ts_contract_transition_started:
    lineage:
    - datalake_rede_company_event.company_event.ts_event
    description: Timestamp of the event "Contract Transition Started".
  ts_contract_transition_completed:
    lineage:
    - datalake_rede_company_event.company_event.ts_event
    description: Timestamp of the event "Contract Transition Completed".
  ts_churn:
    lineage:
    - datalake_rede_company_event.company_event.ts_event
    description: Timestamp of the event "Churn".
  ts_journey_ended:
    lineage:
    - datalake_rede_company_event.company_event.ts_event
    description: Timestamp of when the journey ended, which can be either "Deal Lost"
      or "Membership Ended".
  sk_company_journey:
    description: Primary key of the table, formed by concatenating the sk_company_lead
      with the business context and the journey number.
  leads_sent_through_supply_processor:
    description: Number of leads sent through Supply Processor between the journey
      start and journey end.
  first_listings:
    description: Number of first listings between the journey start and journey end.
  demand_bookings:
    description: Number of demand visits booked between the journey start and journey
      end.
  days_lead_to_prospect:
    description: Number of days between lead and prospect
  days_lead_to_pre_qualified:
    description: Number of days between lead and pre qualified
  days_lead_to_qualified:
    description: Number of days between lead and qualified
  days_lead_to_opportunity:
    description: Number of days between lead and opportunity
  days_lead_to_deal_won:
    description: Number of days between lead and deal won
  days_lead_to_deal_lost:
    description: Number of days between lead and deal lost
  days_lead_to_awaiting_documents:
    description: Number of days between lead and awaiting documents
  days_lead_to_term_sent:
    description: Number of days between lead and term sent
  days_lead_to_membership_started:
    description: Number of days between lead and membership started
  days_lead_to_demand_onboarding_scheduled:
    description: Number of days between lead and demand onboarding scheduled
  days_lead_to_supply_onboarding_scheduled:
    description: Number of days between lead and supply onboarding scheduled
  days_lead_to_first_lead_3p:
    description: Number of days between lead and first lead 3p
  days_lead_to_first_listing:
    description: Number of days between lead and first listing
  days_lead_to_first_demand_visit_booked:
    description: Number of days between lead and first demand visit booked
  days_lead_to_churn_risk:
    description: Number of days between lead and churn risk
  days_lead_to_contract_termination_analysis:
    description: Number of days between lead and contract termination analysis
  days_lead_to_membership_ended:
    description: Number of days between lead and membership ended
  days_lead_to_contract_transition_started:
    description: Number of days between lead and contract transition started
  days_lead_to_contract_transition_completed:
    description: Number of days between lead and contract transition completed
  days_lead_to_churn:
    description: Number of days between lead and churn
  days_lead_to_journey_ended:
    description: Number of days between lead and journey ended
  ts_load:
    description: Time when the table was loaded.
  business_context:
    lineage:
    - datalake_rede_company_event.company_event.business_context
    description: Business context of the journey. Partition key, so it can be used to
      filter the table efficiently.
