database_name: dw_public
table_name: dim_company_rede_partners
description: Table that describes all QuintoAndar's Rede Companies enriched HubSpot information.
domain: Rede
owner: vitor.musachio@quintoandar.com.br
columns:
  sk_company:
    lineage: 
      - datalake_company.company_sks.sk_company
    description: Surrogate key and unique identifier for the company in the data lakehouse.
  id_company:
    lineage: 
      - datalake_company.company_sks.id_company 
    description: Unique identifier for the company in Company entity.
  id_hubspot:
    lineage: 
      - datalake_hubspot.company_members.id_company
    description: Unique identifier for the company in HubSpot.
  id_account_manager:
    lineage: 
      - datalake_hubspot.company_members.id_account_manager
    description: Unique identifier for the account manager in HubSpot.
  uuid_company:
    lineage: 
      - datalake_company.company_sks.uuid_company
    description: External unique identifier for the company in Company entity.
  company_cnpj:
    lineage: 
      - datalake_company.company_sks.cnpj
    description: Company's CNPJ document, registered in the company's document entity.
  company_city:
    lineage: 
      - datalake_company_clean.address.city
    description: City where the company is located, registered in the company's address entity.
  company_cluster:
    lineage: 
      - datalake_hubspot.company_members.company_cluster
    description: Company's cluster, registered in the HubSpot's entity, according Rede Operations Team classification.
  company_cluster_performance:
    lineage: 
      - datalake_hubspot.company_members.company_cluster_performance
    description: Company's cluster, registered in the HubSpot's entity, according Rede Performance Team classification.
  company_country:
    lineage: 
      - datalake_company_clean.address.country
    description: Country where the company is located, registered in the company's address entity.
  company_integrator_partner:
    lineage: 
      - datalake_company_clean.company.company_name
    description: Name of the supply integrator company, registered in the company's entity. 
  company_name: 
    lineage: 
      - datalake_company_clean.company.company_name
    description: Name of the company, registered in the company's entity.
  company_neigborhood:
    lineage: 
      - datalake_company_clean.address.neighborhood
    description: Neighborhood where the company is located, registered in the company's address entity.
  company_state:
    lineage: 
      - datalake_company_clean.address.state
    description: Address where the company is located, registered in the company's address entity.
  company_status:
    lineage: 
      - datalake_company_clean.company.status
    description: Status of the company, registered in the company's entity. Can be "ACTIVE" or "INACTIVE".
  company_trade_name:
    lineage: 
      - datalake_company_clean.company.trade_name
    description: Company's trade name (as known as "Nome Fantasia"), registered in the company's entity.
  company_zip_code:
    lineage: 
      - datalake_company_clean.address.zip_code
    description: Zip code where the company is located, registered in the company's address entity.
  hubspot_company_name:
    lineage: 
      - datalake_hubspot.company_members.company_name
    description: Company's name registered in Hubspot. This column was previously identified as extract_3p_tag.
  hubspot_crm:
    lineage: 
      - datalake_hubspot.company_members.hubspot_crm
    description: Company's CRM registered in Hubspot. This column was previously identified as crm.
  hubspot_member_category:
    lineage: 
      - datalake_hubspot.company_members.member_category
    description: Company's member category registered in Hubspot. This column was previously identified as member_category.
  hubspot_status:
    lineage: 
      - datalake_hubspot.company_members.sale_lead_status
    description: Company's status registered in Hubspot. Through this column we identify whether a real estate agency is a member or not. This column was previously identified as sale_lead_status.
  is_active_company_rede_partner:
    lineage: 
        - datalake_hubspot.company_members.sale_lead_status
    description: Flag indicating whether the company is an active Rede Partner (True if sale_lead_status = 'Membro'), used to obtain the total active Rede Brokers.
  is_flagged_as_leadgen:
    lineage:
      - datalake_hubspot.company_members.is_flagged_as_leadgen
    description: Flag indicating whether the company is flagged as leadgen in Hubspot.
  ts_membership_start:
    lineage: 
      - datalake_hubspot.membership_updates.hubspot_status
      - datalake_hubspot.membership_updates.ts_start
    description: Date when the company started its membership in Hubspot.
  ts_membership_end:
    lineage: 
      - datalake_hubspot.membership_updates.hubspot_status
      - datalake_hubspot.membership_updates.ts_end
    description: Date when the company ended its membership in Hubspot.
  ts_created:
    lineage: 
      - datalake_company_clean.company.ts_created
    description: Date when the company was created in the company entity.
  ts_updated:
    lineage: 
      - datalake_company_clean.company.ts_updated
    description: Date when the company was updated in the company entity.
  ts_load:
    description: Date when the table data was updated.
