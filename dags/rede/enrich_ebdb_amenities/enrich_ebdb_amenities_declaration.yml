dag:
  name: enrich_ebdb_amenities
  schedule_start_date: 2021, 8, 24
  owner: Data Rede
  documentation:
    dag_purpose: |
      Creates enriched tables for EBDB amenities.
      This DAG is triggered by Mediator and loads the table via full load.
workflow:
  type: query_delta
  layer: enrich
  inner_dependencies:
    pivotted_amenities:
    - amenity_change_history
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: r5a.xlarge
    node_type_id: r5a.xlarge
    num_workers: 3
    spark_version: 12.2.x-scala2.12
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
  databricks_conn_id: databricks_new
