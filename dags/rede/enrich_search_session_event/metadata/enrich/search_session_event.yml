---
database_name: datalake_search_session_event
table_name: search_session_event
domain: Rede
owner: gustavo.miller@quintoandar.com.br
description: Each row of this table corresponds to a house associated with a search. For example if an event in 170698_search_page_viewed_events returned 30 houses, there
  will be 30 rows in this table. Currently, it has only search and listing page viewed events.
columns:
  id_amplitude:
    description: Identifier of the unique user generated by Amplitude.
    lineage:
      - datalake_amplitude_clean.170698_listing_page_viewed_events.id_amplitude
      - datalake_amplitude_clean.170698_search_page_viewed_events.id_amplitude
      - datalake_amplitude_clean.170698_search_results_page_viewed_events.id_amplitude
  id_user:
    description: Identifier of the unique user if they are logged on. Equivalent to dw_public.dim_user.sk_user
    lineage:
      - datalake_amplitude_clean.170698_listing_page_viewed_events.id_user
      - datalake_amplitude_clean.170698_search_page_viewed_events.id_user
      - datalake_amplitude_clean.170698_search_results_page_viewed_events.id_user
  id_search:
    description: Unique identifier of the search that led to that event, generated by Amplitude
    lineage:
      - datalake_amplitude_clean.170698_listing_page_viewed_events.event_properties
      - datalake_amplitude_clean.170698_search_page_viewed_events.id_search
      - datalake_amplitude_clean.170698_search_results_page_viewed_events.id_search
  id_house:
    description: Unique identifier of the house associated with the event
    lineage:
      - datalake_amplitude_clean.170698_listing_page_viewed_events.id_house
      - datalake_amplitude_clean.170698_search_page_viewed_events.ids_search_results_list
      - datalake_amplitude_clean.170698_search_results_page_viewed_events.ids_search_results_list
  event_type:
    description: Type of the event.
    categories:
      'Search': The row represents a house associated with a search
      'Listing Page Viewed': The row represents listing page viewed
  search_rendering_type:
    description: 'Distinguishes between client searches (170698_search_results_page_viewed_events) and server searches (170698_search_page_viewed_events)'
    categories:
      'Server-Side Rendering (SSR)': Also known as "Server Search". Comes from 170698_search_page_viewed_events. It happens when the user arrives in the search page from another page (homepage, google, etc).
        In this case, the first 11 results are returned by the server and there is no effect of pclick (ranking model).
      'Client Search': It happens when the user makes a search from the search page (moving the map, applying a filter, changing the searched location, etc). In this case the pclick has effect in the ranking of results.
  business_context:
    description: Business context of the house
    lineage:
      - datalake_amplitude_clean.170698_listing_page_viewed_events.business_context
      - datalake_amplitude_clean.170698_search_page_viewed_events.business_context
      - datalake_amplitude_clean.170698_search_results_page_viewed_events.business_context
    categories:
      sale: 'ForSale context.'
      rent: 'ForRent context.'
      unknown: 'Context not informed in the event.'
  utm_source:
    description: UTM used to track the advertising source.
    lineage:
      - datalake_amplitude_clean.170698_listing_page_viewed_events.utm_source
      - datalake_amplitude_clean.170698_search_page_viewed_events.utm_source
      - datalake_amplitude_clean.170698_search_results_page_viewed_events.utm_source
  utm_medium:
    description: UTM used to track the advertising medium.
    lineage:
      - datalake_amplitude_clean.170698_listing_page_viewed_events.utm_medium
      - datalake_amplitude_clean.170698_search_page_viewed_events.utm_medium
      - datalake_amplitude_clean.170698_search_results_page_viewed_events.utm_medium
  platform:
    description: Platform where the event happened.
    lineage:
      - datalake_amplitude_clean.170698_listing_page_viewed_events.platform
      - datalake_amplitude_clean.170698_search_page_viewed_events.platform
      - datalake_amplitude_clean.170698_search_results_page_viewed_events.platform
  base_referrer_url: 
    description: Base URL of the referrer, i.e., where the user came from. By base, it means that it normalizes URLs by removing whatever comes
      before :// (like http:// or android-app://), www., and anything after the first "/". For example, https://www.youtube.com/watch becomes youtube.com
    lineage:
      - datalake_amplitude_clean.170698_listing_page_viewed_events.referrer
      - datalake_amplitude_clean.170698_search_page_viewed_events.referrer
      - datalake_amplitude_clean.170698_search_results_page_viewed_events.referrer
  search_location_type:
    description: If the event is a Search, informs how the search was done (i.e., street, neighborhood, coordinates).
    lineage:
      - datalake_amplitude_clean.170698_search_page_viewed_events.search_query_context
      - datalake_amplitude_clean.170698_search_results_page_viewed_events.search_query_context
    categories:
      'city': 'Search by city.'
      'neighborhood': 'Search by neighborhood.'
      'coordinates': 'Search by coordinates.'
      'street': 'Search by street.'
      'poi': 'Search by point of interest.'
      'unknown': 'Search, but by an unknown method.'
      'N/A': 'Not a search.'
  search_view_mode:
    description: 'View mode of the search (i.e., list)'
    lineage:
      - datalake_amplitude_clean.170698_search_page_viewed_events.view_mode
      - datalake_amplitude_clean.170698_search_results_page_viewed_events.view_mode
  search_sort_order:
    description: 'Sort order of the search (i.e., relevance)'
    lineage:
      - datalake_amplitude_clean.170698_search_page_viewed_events.sort_order
      - datalake_amplitude_clean.170698_search_results_page_viewed_events.sort_order
  nr_session_for_user_on_day:
    description: 'Number of the session for that id_amplitude on that day. A session starts after 5 minutes of no events, or a change in business context.'
  ts_event:
    description: 'Timestamp of when the event happened.'
    lineage:
      - datalake_amplitude_clean.170698_listing_page_viewed_events.ts_event
      - datalake_amplitude_clean.170698_search_page_viewed_events.ts_event
      - datalake_amplitude_clean.170698_search_results_page_viewed_events.ts_event
  year:
    description: 'Year of when the event happened.'
    lineage:
      - datalake_amplitude_clean.170698_listing_page_viewed_events.year
      - datalake_amplitude_clean.170698_search_page_viewed_events.year
      - datalake_amplitude_clean.170698_search_results_page_viewed_events.year
  month:
    description: 'Month of when the event happened.'
    lineage:
      - datalake_amplitude_clean.170698_listing_page_viewed_events.month
      - datalake_amplitude_clean.170698_search_page_viewed_events.month
      - datalake_amplitude_clean.170698_search_results_page_viewed_events.month
  day:
    description: 'Day of when the event happened.'
    lineage:
      - datalake_amplitude_clean.170698_listing_page_viewed_events.day
      - datalake_amplitude_clean.170698_search_page_viewed_events.day
      - datalake_amplitude_clean.170698_search_results_page_viewed_events.day