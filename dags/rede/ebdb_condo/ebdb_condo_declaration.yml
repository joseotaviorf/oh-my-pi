dag:
  name: ebdb_condo
  schedule_start_date: 2021, 2, 20
  schedule_interval: 45 21 * * *
  owner: Data Rede
  documentation:
    dag_purpose: Extraction of EBDB tables related to Condo into data lake. EBDB is the main database for QuintoAndar.
workflow:
  type: cdc
  layer: raw
  custom_schema: ebdb
  database_type: mysql
  source_database: ebdb
  source_schema: ebdb
  tables_customization:
    AccessAuthorizationType:
      clean_table_name: access_authorization_type
    AccessType:
      clean_table_name: access_type
    AccessType_AUD:
      clean_table_name: access_type_aud
    Amenidades:
      clean_table_name: amenities
    AmenidadesInfo:
      clean_table_name: info_amenities
    AmenidadesInfo_AUD:
      clean_table_name: info_amenities_aud
    CondicoesEntrada:
      clean_table_name: entrance_conditions
    CondoManager:
      clean_table_name: condo_manager
    CondoManagerEmails:
      raw_primary_keys: ["id", "email"]
      clean_table_name: condo_manager_emails
    CondoManagerPhones:
      raw_primary_keys: ["id", "phones"]
      clean_table_name: condo_manager_phones
    CondoNamesHistory:
      raw_primary_keys: ["id"]
      clean_table_name: condo_names_history
    Condominio:
      clean_table_name: condo
    ContatoCondominio:
      clean_table_name: condo_contact
    Instalacao:
      clean_table_name: condo_amenities
    InstalacaoInfo:
      clean_table_name: info_condo_amenities
    InstalacaoInfo_AUD:
      clean_table_name: info_condo_amenities_aud
cluster:
  type: databricks_12_2_med_general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
