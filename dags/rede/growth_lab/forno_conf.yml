---
dag_documentation:
  dag_purpose: Growth Lab is an initiative that has been trying to understand our supply, using crawler data from Spinver, which
    is in GCP. This DAG is responsible for ingesting the data from GCP to our datalake.
tables:
  - table_name: supply_recurrence
    gcp_bucket_name: growthlab-factory
    prefix_template: supply_recurrence/{yyyy_mm_dd}/supply_recurrence.csv
custom_libraries:
  - pypi:
      package: "google-cloud-storage==2.11.0"
