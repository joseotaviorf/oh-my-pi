---
database_name: datalake_kodak
table_name: image_inspection
description: This table stores detailed information about photo inspections related to Kodak. 
domain: Rede
owner: ae-rede@quintoandar.com.br
columns:
  id:
    description: Unique identifier for the inspection record.
    lineage:
      - datalake_kodak_clean.image_inspection.id
  id_photo:
    description: Unique identifier for the photo being inspected.
    lineage:
      - datalake_kodak_clean.image_inspection.id_photo
  id_duplicate:
    description: Identifier for duplicate photos, if any.
    lineage:
      - datalake_kodak_clean.image_inspection.id_duplicate
  id_house:
    description: Identifier for the house associated with the photo. Foreign key for house tables.
    lineage:
      - datalake_ebdb_clean.house.id
  id_lead_3p:
    description: Identifier for the 3p lead related to the inspection. Foreign key for lead_3p tables.
    lineage:
      - datalake_brokers_supply_processor_clean.lead_3p.id
  deduplication_hash:
    description: Hash value used to detect duplicate photos.
    lineage:
      - datalake_kodak_clean.image_inspection.deduplication_hash
  url:
    description: URL where the photo is stored.
    lineage:
      - datalake_kodak_clean.image_inspection.url
  house_place:
    description: Specific place within the house where the photo was taken.
    lineage:
      - datalake_kodak_clean.image_inspection.house_place
  room_type:
    description: Type of room in the house where the photo was taken.
    lineage:
      - datalake_kodak_clean.image_inspection.room_type
  status:
    description: Current status of the photo inspection.
    lineage:
      - datalake_kodak_clean.image_inspection.status
  description:
    description: Detailed description or comments about the photo.
    lineage:
      - datalake_kodak_clean.image_inspection.description
  framing_score_cluster:
    description: Clustering score for photo framing quality.
    lineage:
      - datalake_kodak_clean.image_inspection_group.framing_score
  width:
    description: Width of the photo in pixels.
    lineage:
      - datalake_kodak_clean.image_inspection.width
  height:
    description: Height of the photo in pixels.
    lineage:
      - datalake_kodak_clean.image_inspection.height
  ratio:
    description: Aspect ratio of the photo.
    lineage:
      - datalake_kodak_clean.image_inspection.ratio
  sharpness:
    description: Sharpness score of the photo.
    lineage:
      - datalake_kodak_clean.image_inspection.sharpness
  brightness:
    description: Brightness level of the photo.
    lineage:
      - datalake_kodak_clean.image_inspection.brightness
  framing:
    description: Framing quality score of the photo.
    lineage:
      - datalake_kodak_clean.image_inspection.framing
  condition:
    description: Overall condition assessment of the photo.
    lineage:
      - datalake_kodak_clean.image_inspection.condition
  ordination:
    description: Order or ranking of the photo among others.
    lineage:
      - datalake_kodak_clean.image_inspection.ordination
  framing_score:
    description: Overall score for the framing of the photo.
    lineage:
      - datalake_kodak_clean.image_inspection_group.framing_score
  is_approved:
    description: Indicates whether the photo is approved. Can be true or false, or null if not applicable.
    lineage:
      - datalake_kodak_clean.image_inspection_group.is_approved
  has_red_flag_watermark:
    description: Indicates if the photo has a watermark. Can be true or false, or null if not applicable.
    lineage:
      - datalake_kodak_clean.image_inspection_group.has_red_flag_watermark
  has_red_flag_compliance:
    description: Indicates if the photo has compliance issues. Can be true or false, or null if not applicable.
    lineage:
      - datalake_kodak_clean.image_inspection_group.has_red_flag_compliance
  has_red_flag_size:
    description: Indicates if the photo size is flagged. Can be true or false, or null if not applicable.
    lineage:
      - datalake_kodak_clean.image_inspection_group.has_red_flag_size
  has_red_flag_sharpness:
    description: Indicates if the photo sharpness is flagged. Can be true or false, or null if not applicable.
    lineage:
      - datalake_kodak_clean.image_inspection_group.has_red_flag_sharpness
  has_red_flag_not_property:
    description: Indicates if the photo does not belong to the property. Can be true or false, or null if not applicable.
    lineage:
      - datalake_kodak_clean.image_inspection_group.has_red_flag_not_property
  has_red_flag_aspect_ratio:
    description: Indicates if the photo aspect ratio is flagged. Can be true or false, or null if not applicable.
    lineage:
      - datalake_kodak_clean.image_inspection_group.has_red_flag_aspect_ratio
  has_red_flag_casamineira:
    description: Indicates if the photo is flagged for issues related to 'casamineira'. Can be true or false, or null if not applicable.
    lineage:
      - datalake_kodak_clean.image_inspection_group.has_red_flag_casamineira
  has_red_flag_media_modification:
    description: Indicates if the photo has been modified. Can be true or false, or null if not applicable.
    lineage:
      - datalake_kodak_clean.image_inspection_group.has_red_flag_media_modification
  has_red_flag_duplicate_image:
    description: Indicates if the photo is flagged as a duplicate image. Can be true or false, or null if not applicable.
    lineage:
      - datalake_kodak_clean.image_inspection_group.has_red_flag_duplicate_image
  has_fault_brightness:
    description: Indicates if the photo has brightness issues. Can be true or false, or null if not applicable.
    lineage:
      - datalake_kodak_clean.image_inspection_group.has_fault_brightness
  has_fault_sharpness:
    description: Indicates if the photo has sharpness issues. Can be true or false, or null if not applicable.
    lineage:
      - datalake_kodak_clean.image_inspection_group.has_fault_sharpness
  has_fault_aspect_ratio:
    description: Indicates if the photo has aspect ratio issues. Can be true or false, or null if not applicable.
    lineage:
      - datalake_kodak_clean.image_inspection_group.has_fault_aspect_ratio
  has_bonus_sharpness:
    description: Indicates if the photo has a bonus for sharpness. Can be true or false, or null if not applicable.
    lineage:
      - datalake_kodak_clean.image_inspection_group.has_bonus_sharpness
  ts_created:
    description: Timestamp when the inspection record was created.
    lineage:
      - datalake_kodak_clean.image_inspection.ts_created
  ts_updated:
    description: Timestamp when the inspection record was last updated.
    lineage:
      - datalake_kodak_clean.image_inspection.ts_updated