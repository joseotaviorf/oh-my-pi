---
database_name: datalake_hubspot_clean
table_name: communication
description: Every time a communication in HubSpot is created or updated, a new row is created in this table (limited to the most recent per day).
domain: Rede
owner: gustavo.miller@quintoandar.com.br
columns:
  id_communication:
    lineage:
      - datalake_hubspot_raw.communication.id
    description: Id of the communication in HubSpot
  properties:
    lineage:
      - datalake_hubspot_raw.communication.properties
    description: String containing a JSON, in which the properties are located.
  properties_with_history:
    lineage:
      - datalake_hubspot_raw.communication.properties_with_history
    description: String containing a JSON, in which the properties (including all of their history of modifications) are located.
  associations:
    lineage:
      - datalake_hubspot_raw.communication.associations
    description: String containing a JSON, in which the associations are located.
  is_archived:
    lineage:
      - datalake_hubspot_raw.communication.archived
    description: True if the object has been archived in HubSpot.
  ts_archived:
    lineage:
      - datalake_hubspot_raw.communication.archived_at
    description: Timestamp of when the object was archived in HubSpot.
  ts_created:
    lineage:
      - datalake_hubspot_raw.communication.created_at
    description: Timestamp of when the object was created in HubSpot.
  ts_updated:
    lineage:
      - datalake_hubspot_raw.communication.updated_at
    description: Timestamp of when the object was updated in HubSpot.
  year:
    lineage:
      - datalake_hubspot_raw.communication.year
    description: Year of when the object was updated in HubSpot.
  month:
    lineage:
      - datalake_hubspot_raw.communication.month
    description: Month of when the object was updated in HubSpot.
  day:
    lineage:
      - datalake_hubspot_raw.communication.day
    description: Day of when the object was updated in HubSpot.
