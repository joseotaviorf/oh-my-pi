---
database_name: datalake_hubspot_clean
table_name: call
description: Every time a call in HubSpot is created or updated, a new row is created in this table (limited to the most recent per day).
domain: Rede
owner: gustavo.miller@quintoandar.com.br
columns:
  id_call:
    lineage:
      - datalake_hubspot_raw.call.id
    description: Id of the call in HubSpot
  properties:
    lineage:
      - datalake_hubspot_raw.call.properties
    description: String containing a JSON, in which the properties are located.
  properties_with_history:
    lineage:
      - datalake_hubspot_raw.call.properties_with_history
    description: String containing a JSON, in which the properties (including all of their history of modifications) are located.
  associations:
    lineage:
      - datalake_hubspot_raw.call.associations
    description: String containing a JSON, in which the associations are located.
  is_archived:
    lineage:
      - datalake_hubspot_raw.call.archived
    description: True if the object has been archived in HubSpot.
  ts_archived:
    lineage:
      - datalake_hubspot_raw.call.archived_at
    description: Timestamp of when the object was archived in HubSpot.
  ts_created:
    lineage:
      - datalake_hubspot_raw.call.created_at
    description: Timestamp of when the object was created in HubSpot.
  ts_updated:
    lineage:
      - datalake_hubspot_raw.call.updated_at
    description: Timestamp of when the object was updated in HubSpot.
  year:
    lineage:
      - datalake_hubspot_raw.call.year
    description: Year of when the object was updated in HubSpot.
  month:
    lineage:
      - datalake_hubspot_raw.call.month
    description: Month of when the object was updated in HubSpot.
  day:
    lineage:
      - datalake_hubspot_raw.call.day
    description: Day of when the object was updated in HubSpot.
