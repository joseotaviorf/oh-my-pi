---
database_name: metric_rede
table_name: completeness_weekly
description: Table containing the Completeness metrics that make up the Rede Performance Score.
domain: Rede
owner: ae-rede@quintoandar.com.br
columns:
  dt_week:
    description: Reference week of the metric result.
    lineage:
      - dw_house.fact_house_information_filling.ts_revision
      - dw_house.fact_house_information_filling.ts_next_revision
      - dw_sale.fact_daily_ongoing_listing.sk_snapshot_date
  partner_name:
    description: Name of Rede partner company registered with HubSpot.
    lineage: 
      - dw_rede.dim_company_cluster.company_name
  company_cluster:
    description: Classification assigned by the Operations team to the Rede partner company.
    lineage:
      - dw_rede.dim_company_cluster.company_cluster
  is_decola_community:
    description: True if the cluster given to the company is part of the "Decola" community, otherwise false.
    lineage:
      - dw_rede.dim_company_cluster.is_decola_community
  is_decola_current_cohort:
    description: True if the current cluster given to the company is part of the "Decola" community, otherwise false.
    lineage:
      - dw_rede.dim_company_cluster.is_decola_current_cohort
  total_amenities_required:
    description: Total volume of amenities planned for a listing.
    metric:
      name: Total Amenities Required
      description: Total volume of amenities planned for a listing.
      business_stage: Rede
      hierarchy: Performance Score
      approved_by: lucas.psantos@quintoandar.com.br
      link_to_metric: ""
  share_completeness:
    description: Percentage of amenities completed in relation to the total planned.
    metric:
      name: Percentage of Completeness
      description: Percentage of amenities completed in relation to the total planned.
      business_stage: Rede
      hierarchy: Performance Score
      approved_by: lucas.psantos@quintoandar.com.br
      link_to_metric: ""