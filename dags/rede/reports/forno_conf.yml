---
dag_documentation:
  dag_purpose: This DAG imports the tables from the Reports Service, which is responsible for
    exposing analytical data in a performatic way for other services outside of the datalake.
tables:
  - table_name: daily_listings_summary
    date_filter_column: updated_at
    raw_extraction_type: incremental
    clean_extraction_type: full
  - table_name: daily_listings_summary_aud
    date_filter_column: updated_at
    raw_extraction_type: incremental
    clean_extraction_type: incremental
  - table_name: processed_event
    date_filter_column: created_at
    raw_extraction_type: incremental
    clean_extraction_type: incremental
inner_dependencies:
  daily_listings_summary:
    - daily_listings_summary_aud

partition_cols: ["year", "month", "day"]
