    raw_extraction_type: incremental
    clean_extraction_type: full
    date_filter_column: updated_at
  image_analysis:
    raw_extraction_type: full
    clean_extraction_type: full
  image_inspection_group:
    raw_extraction_type: incremental
    clean_extraction_type: full
    date_filter_column: updated_at
  image_inspection_group_result:
    raw_extraction_type: incremental
    clean_extraction_type: full
    date_filter_column: updated_at
  group_analysis:
    raw_extraction_type: full
    clean_extraction_type: full
  photo:
    raw_extraction_type: full
    clean_extraction_type: full
  photo_aud:
    raw_extraction_type: full
    clean_extraction_type: full
  photosphere:
    raw_extraction_type: full
    clean_extraction_type: full
    clean_table_name: photo_sphere
  photosphere_aud:
    raw_extraction_type: full
    clean_extraction_type: full
    clean_table_name: photo_sphere_aud
  userrevisionentity:
    raw_extraction_type: full
    clean_extraction_type: full
