dag:
  name: enrich_hubspot_crm
  schedule_start_date: 2021, 8, 24
  owner: Data Rede
  documentation:
    dag_purpose: Creates enriched tables for `hubspot`. Due to limitation of Job Cluster, the enrich_hubspot was separated in two DAGs (enrich_hubspot_management and enrich_hubspot_crm).
workflow:
  type: query_delta
  layer: enrich
  custom_schema: hubspot
  inner_dependencies:
    company:
    - company_contact
    - company_history
    company_contact:
    - contact
    company_members:
    - company
    company_status:
    - company
    contact:
    - contact_history
    contact_status:
    - contact
    deal:
    - deal_history
    deal_stage:
    - deal
    - stage
    pipeline:
    - pipeline_history
    stage:
    - stage_history
    ticket:
    - ticket_history
    ticket_stage:
    - ticket
  tables_customization:
    company_history:
      extraction_type: incremental
      partitions:
      - year
      - month
      - day
    contact_history:
      extraction_type: incremental
      partitions:
      - year
      - month
      - day
    deal_history:
      extraction_type: incremental
      partitions:
      - year
      - month
      - day
    ticket_history:
      extraction_type: incremental
      partitions:
      - year
      - month
      - day
cluster:
  type: databricks_12_2_min_memory_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}