---
database_name: datalake_hubspot
table_name: contact_history
description: This table shows the history about contacts registered in HubSpot. Each row is one change in a contact, limited to the most recent per day. If you want the current row, use datalake_hubspot.contact.
domain: Rede
owner: vitor.musachio@quintoandar.com.br
columns:
  id_contact:
    lineage:
      - datalake_hubspot_clean.contact.id_contact
    description: Unique identifier of the contact.
  id_hubspot_owner:
    lineage:
      - datalake_hubspot_clean.contact.properties
    description: ID of the HubSpot owner associated with the contact.
  id_company:
    lineage:
      - datalake_hubspot_clean.contact.associations
    description: ID of the main company associated with the contact (more than one can be associated.
      That can be seen in datalake_hubspot.company_contact).
  id_ebdb_user:
    lineage:
      - datalake_ebdb_clean.user.id
    description: ID of the EBDB user associated with the contact, matched by email.
  company_associations:
    lineage:
      - datalake_hubspot_clean.contact.associations
    description: IDs and types of the companies associated with the contact.
  hs_analytics_first_touch_converting_campaign:
    lineage:
      - datalake_hubspot_clean.contact.properties
    description: Name of the first campaign that generated a conversion for the contact.
  hs_analytics_last_touch_converting_campaign:
    lineage:
      - datalake_hubspot_clean.contact.properties
    description: Name of the last campaign that generated a conversion for the contact.
  hs_analytics_source:
    lineage:
      - datalake_hubspot_clean.contact.properties
    description: Original source. First visit or interaction with the business.
  hs_analytics_source_data_1:
    lineage:
      - datalake_hubspot_clean.contact.properties
    description: Original source, drill-down 1. Adds more insight about the first visit or interaction with the business.
  hs_analytics_source_data_2:
    lineage:
      - datalake_hubspot_clean.contact.properties
    description: Original source, drill-down 2. Adds more insight about the first visit or interaction with the business.
  hs_latest_source_data_1:
    lineage:
      - datalake_hubspot_clean.contact.properties
    description: Latest source, drill-down 1. Adds more insight about the last visit or interaction with the business.
  hs_latest_source_data_2:
    lineage:
      - datalake_hubspot_clean.contact.properties
    description: Latest source, drill-down 2. Adds more insight about the last visit or interaction with the business.
  first_conversion_event_name:
    lineage:
      - datalake_hubspot_clean.contact.properties
    description: Name of the first conversion event for the contact.
  field_of_business:
    lineage:
      - datalake_hubspot_clean.contact.properties
    description: Field of business of the contact.
  occupation:
    lineage:
      - datalake_hubspot_clean.contact.properties
    description: Occupation of the contact.
    categories:
      Dono/CEO: Owner or CEO of the company.
      Sócio/Diretor: Partner or Director of the company.
      Gerente: Manager of the company.
      Corretor: Broker of the company.
      Marketing: Marketing professional of the company.
      Administrativo: Administrative professional of the company.
      Secretaria de vendas: Sales secretary of the company.
      Outros: Other occupation.
