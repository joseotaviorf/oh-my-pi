dag:
  name: dw_house_amenities
  schedule_start_date: 2020,8,29
  owner: Data Rede
  documentation:
    dag_purpose: |
      This DAG loads data about amenities, such as pool or grill area, into the DW.
workflow:
  type: query
  layer: dw
  custom_schema: house
  default_extraction_type: full
  inner_dependencies:
    fact_house_information_filling:
      - dim_house_amenities_version
      - dim_house_information
cluster:
  type: databricks_12_2_med_general_cluster
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE
