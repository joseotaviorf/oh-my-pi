---
database_name: datalake_reports_validation
table_name: extra_event
owner: gustavo.miller@quintoandar.com.br
domain: Rede
description: Like the other tables in this schema, the goal is to identify divergences between the data in the data lake and the data in the Reports Service,
  received via Reverse ETL. This table, in particular, contains the extra events that were not found in the data lake. This can happen when tables are reprocessed
  during the day AFTER the Reverse ETL has already run, and some events change.
columns:
  id_event:
    lineage:
      - datalake_reports_clean.processed_event.id_event
    description: ID of the event received by the Reports Service, but not present in the data lake anymore.
  ts_processed:
    lineage:
      - datalake_reports_clean.processed_event.ts_created
    description: Timestamp of when the event was processed by the Reports Service.