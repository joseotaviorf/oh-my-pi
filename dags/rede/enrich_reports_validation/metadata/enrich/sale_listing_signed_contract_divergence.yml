---
database_name: datalake_reports_validation
table_name: sale_listing_signed_contract_divergence
owner: gustavo.miller@quintoandar.com.br
domain: Rede
description: Like the other tables in this schema, the goal is to identify divergences between the data in the data lake and the data in the Reports Service,
  received via Reverse ETL. This table, in particular, contains the divergences between the reverse_listings_report.sale_listing_signed_contract table and the ccv
  metric of the daily_listings_summary table in the Reports Service.
columns:
  id_location:
    lineage:
      - reverse_listings_report.sale_listing_signed_contract.location_id
      - datalake_reports_clean.daily_listings_summary.id_location
    description: ID of the region of the listing.
  uuid_company:
    lineage:
      - reverse_listings_report.sale_listing_signed_contract.company_uuid
      - datalake_reports_clean.daily_listings_summary.uuid_company
    description: UUID of the company of the listing.
  count_sent:
    description: Number of sale agreement signed events sent by the Reverse ETL.
  transacted_amount_sent:
    description: Sum of the transaction amounts in sale agreement signed events sent by the Reverse ETL.
  count_received:
    lineage:
      - datalake_reports_clean.daily_listings_summary.ccv
    description: Number of sale agreement signed events received by the Reports Service, according to the daily_listings_summary table.
  transacted_amount_received:
    lineage:
      - datalake_reports_clean.daily_listings_summary.ccvs_transacted_amount
    description: Sum of the transaction amounts in sale agreement signed events received by the Reports Service, according to the daily_listings_summary table.
  dt_entry:
    lineage:
      - reverse_listings_report.sale_listing_signed_contract.ts_event
      - datalake_reports_clean.daily_listings_summary.dt_entry
    description: Date of the events.
  year:
    description: Year of the events.
  month:
    description: Month of the events.
  day:
    description: Day of the events.
