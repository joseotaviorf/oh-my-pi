---
database_name: datalake_reports_validation
table_name: sale_listing_offer_sent_divergence
owner: gustavo.miller@quintoandar.com.br
domain: Rede
description: Like the other tables in this schema, the goal is to identify divergences between the data in the data lake and the data in the Reports Service,
  received via Reverse ETL. This table, in particular, contains the divergences between the reverse_listings_report.sale_listing_offer_sent table and the sale_offers_sent
  metric of the daily_listings_summary table in the Reports Service.
columns:
  id_location:
    lineage:
      - reverse_listings_report.sale_listing_offer_sent.location_id
      - datalake_reports_clean.daily_listings_summary.id_location
    description: ID of the region of the listing.
  uuid_company:
    lineage:
      - reverse_listings_report.sale_listing_offer_sent.company_uuid
      - datalake_reports_clean.daily_listings_summary.uuid_company
    description: UUID of the company of the listing.
  count_sent:
    description: Number of offer sent events sent by the Reverse ETL.
  count_received:
    lineage:
      - datalake_reports_clean.daily_listings_summary.sale_offers_sent
    description: Number of offer sent events received by the Reports Service, according to the daily_listings_summary table.
  dt_entry:
    lineage:
      - reverse_listings_report.sale_listing_offer_sent.ts_event
      - datalake_reports_clean.daily_listings_summary.dt_entry
    description: Date of the events.
  year:
    description: Year of the events.
  month:
    description: Month of the events.
  day:
    description: Day of the events.
