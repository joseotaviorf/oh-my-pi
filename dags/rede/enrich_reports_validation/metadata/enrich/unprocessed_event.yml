---
database_name: datalake_reports_validation
table_name: unprocessed_event
owner: gustavo.miller@quintoandar.com.br
domain: Rede
description: Like the other tables in this schema, the goal is to identify divergences between the data in the data lake and the data in the Reports Service,
  received via Reverse ETL. This table, in particular, contains the events in the data lake that were NOT found in the Reports Service. This can happen if there is any
  problem with the Reverse ETL, or the consumption.
columns:
  id_event:
    lineage:
      - reverse_listings_report.sale_listing_offer_accepted.id
      - reverse_listings_report.sale_listing_offer_sent.id
      - reverse_listings_report.sale_listing_signed_contract.id
      - reverse_listings_report.sale_listing_traffic.id
      - reverse_listings_report.sale_listing_visit_confirmed.id
      - reverse_listings_report.sale_listing_visit_scheduled.id
      - reverse_listings_report.sale_ongoing_listings.id
    description: ID of the event in the data lake, but not received by the Reports Service.
  source:
    description: Event type.
    categories:
      NEW_LISTING_TRAFFIC: Listing page viewed
      ONGOING_LISTINGS: Ongoing listings
      NEW_LISTING_VISIT_SCHEDULED: Visit scheduled
      NEW_LISTING_VISIT_CONFIRMED: Visit confirmed
      NEW_LISTING_OFFER_SENT: Offer sent
      NEW_LISTING_OFFER_ACCEPTED: Offer accepted
      NEW_LISTING_SIGNED_CONTRACT: Signed contract (CCV)
  ts_event:
    lineage:
      - reverse_listings_report.sale_listing_offer_accepted.ts_event
      - reverse_listings_report.sale_listing_offer_sent.ts_event
      - reverse_listings_report.sale_listing_signed_contract.ts_event
      - reverse_listings_report.sale_listing_traffic.ts_event
      - reverse_listings_report.sale_listing_visit_confirmed.ts_event
      - reverse_listings_report.sale_listing_visit_scheduled.ts_event
      - reverse_listings_report.sale_ongoing_listings.ts_event
    description: Timestamp of when the event happened.
  year: 
    description: Year related to the execution of this validation. It is also a partition of this table.
  month:
    description: Month related to the execution of this validation. It is also a partition of this table.
  day:
    description: Day related to the execution of this validation. It is also a partition of this table.