---
dag:
  name: enrich_rede_company
  schedule_start_date: 2020, 8, 29
  owner: Data Rede
  documentation: 
    dag_purpose: |
      Creates tables for the context `enrich_rede_company`, enriching company information from Rede QuintoAndar.
      This data currently comes from HubSpot, but will be joined with the Company database in the future.
      `company_sks` creates surrogate keys for the company dimension. 
      These will be managed by us, and therefore will easily acommodate merging data from different sources.
      This DAG is triggered by Mediator and loads the table via full load.
workflow:
  type: query
  layer: enrich
cluster:
  type: databricks_12_2_med_general_photon_cluster
