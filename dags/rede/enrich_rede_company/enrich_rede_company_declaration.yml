dag:
  name: enrich_rede_company
  schedule_start_date: 2020, 8, 29
  owner: Data Rede
  documentation:
    dag_purpose: Creates tables for the context `enrich_company`, consolidating IDs and creating surrogate keys for the company dimensional model.
workflow:
  type: query_delta
  layer: enrich
  custom_schema: company
cluster:
  type: databricks_12_2_min_memory_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}