dag:
  name: dw_rede_company_lead
  schedule_start_date: 2020,8,29
  owner: Data Rede
workflow:
  type: query_delta
  layer: dw
  custom_schema: rede
  default_extraction_type: full
  has_load_to_redshift_task: false
  inner_dependencies:
    fact_company_event:
    - dim_company_event_type
    - dim_company_lead
    fact_company_journey:
    - dim_company_lead
  tables_customization:
    fact_company_event:
      partitions: [country_code, business_context]
    fact_company_journey:
      partitions: [country_code, business_context]
cluster:
  type: databricks_12_2_min_general_cluster
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
