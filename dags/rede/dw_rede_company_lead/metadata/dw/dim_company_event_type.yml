database_name: dw_rede
table_name: dim_company_event_type
description: This table details characteristics of events that happen within a company
  journey. This includes the treated name of the event, business context, the corresponding status,
  deal or ticket update in HubSpot, what the status was at the time of the event,
  and so on.
domain: Rede
owner: gustavo.miller@quintoandar.com.br
columns:
  sk_company_event_type:
    description: Primary key of the table.
  business_context:
    lineage:
    - datalake_rede_company_event.company_event.business_context
    description: Business context of the event, which can be "Demand", "Supply",
      "Contract" or "Company".
  event:
    lineage:
    - datalake_rede_company_event.company_event.event
    description: Treated name of the event. For example, "Membership Started", "Lead"
      or "Deal Lost".
  event_type:
    lineage:
    - datalake_rede_company_event.company_event.event_type
    description: Type of event, which can be Status, Deal, Supply Onboarding, Demand
      Onboarding or Contract Transition.
  source_type:
    lineage:
    - datalake_rede_company_event.company_event.source_type
    description: Source of the event, which is where the update was performed. For
      example, CRM_UI, BATCH_AUTOMATION, Supply Processor or Main.
  hubspot_event_detail:
    lineage:
    - datalake_rede_company_event.company_event.hubspot_event_detail
    description: What exactly happened in HubSpot to trigger this event. For example
      "Termo Assinado", "Membro", or "Negócio Perdido".
  hubspot_event_origin:
    lineage:
    - datalake_rede_company_event.company_event.hubspot_event_origin
    description: Origin of the event detailed in HubSpot. Can be "Status", "Deal"
      or the name of the ticket pipeline.
  hubspot_company_status:
    lineage:
    - datalake_rede_company_event.company_event.hubspot_company_status
    description: Status of the company at the time of the event.
  hubspot_deal_stage:
    lineage:
    - datalake_rede_company_event.company_event.hubspot_deal_stage
    description: Most recent deal stage of the company at the time of the event.
  hubspot_demand_onboarding_ticket_stage:
    lineage:
    - datalake_rede_company_event.company_event.hubspot_demand_onboarding_ticket_stage
    description: Most recent demand onboarding ticket stage at the time of the event.
  hubspot_supply_onboarding_ticket_stage:
    lineage:
    - datalake_rede_company_event.company_event.hubspot_supply_onboarding_ticket_stage
    description: Most recent supply onboarding ticket stage at the time of the event.
  ts_load:
    description: Time when the table was loaded.
