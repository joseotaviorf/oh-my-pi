database_name: dw_rede
table_name: dim_company_lead
description: This table shows details about company leads registered in HubSpot. Each row represents a partner or
  a potential partner.
domain: Rede
owner: gustavo.miller@quintoandar.com.br
columns:
  sk_company_lead:
    lineage:
    - datalake_rede_company.company_sks.sk_company_lead
    description: Primary key for the table. It is generated artificially in the ETL,
      so it has no meaning or correspondence in any product.
  sk_company:
    lineage:
    - datalake_rede_company.company_sks.sk_company
    description: Foreign key to the company in dw_rede.dim_company.
  id_hubspot:
    lineage:
    - datalake_hubspot.company.id_hubspot
    description: Natural key that represents the company lead, coming from HubSpot.
  uuid_company:
    lineage:
    - datalake_company.company.uuid_company
    description: Unique identifier (UUID) of a company generated in the Company Database.
  company_name:
    lineage:
    - datalake_company.company.company_name
    - datalake_hubspot.company.name
    - datalake_rede_company.company_sks.extracted_3p_tag
    description: Name of the company in HubSpot.
  tag:
    lineage:
    - datalake_hubspot.company.tag
    - datalake_rede_company.company_sks.extracted_3p_tag
    description: Tag that represents the real estate agency in HubSpot. These tags
      come in the format "[3P-<value>]".
  extracted_3p_tag:
    lineage:
    - datalake_company.company.trade_name
    - datalake_hubspot.company.extracted_3p_tag
    - datalake_rede_company.company_sks.extracted_3p_tag
    description: Represents the real estate agency. It is extracted from the tag column,
      like "[3P-<extracted_3p_tag>]"
  sale_lead_status:
    lineage:
    - datalake_hubspot.company.sale_lead_status
    description: Status of the company sale lead in HubSpot.
  rent_lead_status:
    lineage:
    - datalake_hubspot.company.rent_lead_status
    description: Status of the company rent lead in HubSpot.
  product:
    description: Product of interest in Rede QuintoAndar, which can be "3P BH" or
      "3P 5A". It will only be "3P BH" if the team responsible for the deal is "BH
      Sul" or "BH Norte". Otherwise, it will be "3P 5A".
  sale_member_category:
    lineage:
      - datalake_hubspot.company_history.sale_member_category
    description: Category of the member for sale leads.
    categories:
      Prata: 'Silver'
      Ouro: 'Gold'
      Diamante: 'Diamond'
  rent_member_category:
    lineage:
      - datalake_hubspot.company_history.rent_member_category
    description: Category of the member for rent leads.
    categories:
      Prata: 'Silver'
      Ouro: 'Gold'
      Diamante: 'Diamond'
  company_cluster:
    lineage:
    - datalake_hubspot.company.company_cluster
    description: 'Cluster assigned to the company by the Ops team'
  member_type:
    description: 'Type of the member, as in ForSale or ForRent.'
    categories:
      'B2B Sales': ForSale
  address:
    lineage:
    - datalake_company.company.public_area
    - datalake_hubspot.company.address
    description: Address of the company.
  zip_code:
    lineage:
    - datalake_company.company.zip_code
    - datalake_hubspot.company.zip_code
    description: ZIP code of the company.
  city:
    lineage:
    - datalake_company.company.city
    - datalake_hubspot.company.city
    description: City where the company is located.
  state_abbreviation:
    lineage:
    - datalake_hubspot.company.state
    - datalake_company.company.state_abbreviation
    description: State abbreviation where the company is located.
  state:
    lineage:
    - datalake_ebdb_clean.state.name
    - datalake_company.company.state
    - datalake_hubspot.company.state
    description: State where the company is located.
  country:
    lineage:
    - datalake_hubspot.company.country
    - datalake_company.company.country
    description: Country where the company is located.
  country_code:
    lineage:
      - datalake_hubspot.company.country_code
    description: Code of the country where the company is located.
  domain:
    lineage:
    - datalake_hubspot.company.domain
    description: Domain (website) of the company.
  e_mail:
    lineage:
    - datalake_hubspot.company.e_mail
    description: e_mail of the representative of the company.
  phone:
    lineage:
    - datalake_hubspot.company.phone
    description: Main phone number for the company.
  industry:
    lineage:
    - datalake_hubspot.company.industry
    description: What type of industry the company works with.
  life_cycle_stage:
    lineage:
    - datalake_hubspot.company.life_cycle_stage
    description: In which stage the company is in HubSpot.
  mkt_campaign:
    lineage:
    - datalake_hubspot.company.mkt_campaign
    description: Identifies the marketing campaign that brought the lead.
  mkt_channel:
    lineage:
    - datalake_hubspot.company.mkt_channel
    description: Channel level of the Taxonomy (used to describe the type of the channel).
  mkt_content:
    lineage:
    - datalake_hubspot.company.mkt_content
    description: Content of the advertisement.
  mkt_medium:
    lineage:
    - datalake_hubspot.company.mkt_medium
    description: Medium level of the taxonomy (used to describe the media strategy).
  mkt_origin:
    lineage:
    - datalake_hubspot.company.mkt_origin
    description: Origin of the lead in the marketing funnel.
  mkt_source:
    lineage:
    - datalake_hubspot.company.mkt_source
    description: Source level of the taxonomy (used to describe the media used)
  discard_reason:
    lineage:
    - datalake_hubspot.company.discard_reason
    description: Reason why the lead was discarded.
  lead_origin:
    lineage:
    - datalake_hubspot.company.lead_origin
    description: Origin of the lead.
  partnership_type:
    lineage:
    - datalake_hubspot.company.partnership_type
    description: 'Type of partnership with the company. Example: "Imobiliária" or
      "Assessoria"'
  first_conversion_event_name:
    lineage:
    - datalake_hubspot.company.first_conversion_event_name
    description: Name of the first form sent to all contacts associated to this company.
  crm:
    lineage:
    - datalake_hubspot.company.crm
    description: Which CRM the Company uses.
  real_estate_agency_focus:
    lineage:
    - datalake_hubspot.company.real_estate_agency_focus
    description: Focus of the real estate agency, such as "Venda" (Sale), "Locação"
      (Rent) or "Venda e Locação"
  document:
    lineage:
      - datalake_company.company.document
      - datalake_hubspot.company.document
    description: Document of the company.
  cnpj:
    lineage:
    - datalake_company.company.cnpj
    - datalake_hubspot.company.cnpj
    description: CNPJ of the Brasil company.
  rfc:
    lineage:
      - datalake_company.company.rfc
      - datalake_hubspot.company.rfc
    description: RFC of the Mexico company.
  creci:
    lineage:
    - datalake_hubspot.company.creci
    description: CRECI of the real estate agent in contact.
  person_type:
    lineage:
    - datalake_hubspot.company.person_type
    description: PJ (Juridical Person) or PF (Natural person).
  num_associated_deals:
    lineage:
    - datalake_hubspot.company.num_associated_deals
    description: Number of deals associated with the company.
  num_associated_contacts:
    lineage:
    - datalake_hubspot.company.num_associated_contacts
    description: Number of contacts associated with the company.
  monthly_average_new_rental_contracts:
    lineage:
    - datalake_hubspot.company.monthly_average_new_rental_contracts
    description: Monthly average of new rental contracts.
  num_managers:
    lineage:
    - datalake_hubspot.company.num_managers
    description: Number of managers.
  num_managed_properties:
    lineage:
    - datalake_hubspot.company.num_managed_properties
    description: Number of managed properties.
  num_monthly_leads:
    lineage:
    - datalake_hubspot.company.num_monthly_leads
    description: Number of monthly leads.
  average_sale_property_ticket:
    lineage:
    - datalake_hubspot.company.average_sale_property_ticket
    description: Average ticket of a property for sale (R$)
  average_rent_property_ticket:
    lineage:
    - datalake_hubspot.company.average_rent_property_ticket
    description: Average ticket of a property for rent (R$)
  monthly_repayment_volume_in_real:
    lineage:
    - datalake_hubspot.company.monthly_repayment_volume_in_real
    description: Monthly repayment volume (VGV R$)
  monthly_sale_volume_in_real:
    lineage:
    - datalake_hubspot.company.monthly_sale_volume_in_real
    description: Monthly sale volume (R$)
  num_real_estate_agents:
    lineage:
    - datalake_hubspot.company.num_real_estate_agents
    description: Number of real estate agents.
  num_properties_for_sale:
    lineage:
    - datalake_hubspot.company.num_properties_for_sale
    description: Number of properties for sale.
  num_properties_for_rent:
    lineage:
    - datalake_hubspot.company.num_properties_for_rent
    description: Number of properties for rent.
  has_property_advertisement_online:
    lineage:
    - datalake_hubspot.company.has_property_advertisement_online
    description: Whether or not the company advertises properties online.
  is_correspondent_bank:
    lineage:
    - datalake_hubspot.company.is_correspondent_bank
    description: Whether or not the company acts as a correspondent bank.
  is_lost:
    lineage:
    - datalake_hubspot.company.is_lost
    description: Whether or not the lead is lost.
  has_financing:
    lineage:
    - datalake_hubspot.company.has_financing
    description: Whether or not the company works with financing.
  is_for_sale:
    lineage:
    - datalake_hubspot.company.is_for_sale
    description: Whether or not the company works with sale.
  is_for_rent:
    lineage:
    - datalake_hubspot.company.is_for_rent
    description: Whether or not the company works with rent.
  has_partnerships_with_other_agencies:
    lineage:
    - datalake_hubspot.company.has_partnerships_with_other_agencies
    description: Whether or not the company has partnerships with other real estate
      agencies.
  is_archived:
    lineage:
    - datalake_hubspot.company.is_archived
    description: Whether or not the company has been archived on HubSpot.
  ts_first_conversion:
    lineage:
    - datalake_hubspot.company.ts_first_conversion
    description: Time when the first form was sent to all contacts associated to this
      company.
  ts_recent_deal_close:
    lineage:
    - datalake_hubspot.company.ts_recent_deal_close
    description: Time when the last deal was closed with this company.
  ts_hubspot_owner_assigned:
    lineage:
    - datalake_hubspot.company.ts_hubspot_owner_assigned
    description: Time when the HubSpot owner was assigned to this company.
  ts_last_logged_call:
    lineage:
    - datalake_hubspot.company.ts_last_logged_call
    description: Time of the last logged call associated with this company.
  ts_notes_last_updated:
    lineage:
    - datalake_hubspot.company.ts_notes_last_updated
    description: Time when the last note, call, meeting or task was registered for
      this company.
  ts_archived:
    lineage:
    - datalake_hubspot.company.ts_archived
    description: Time when the company was archived in HubSpot.
  ts_created:
    lineage:
    - datalake_company.company.ts_created
    - datalake_hubspot.company.ts_created
    description: Time when the company lead was created in HubSpot or the Company database (first of them).
  ts_updated:
    lineage:
    - datalake_company.company.ts_updated
    - datalake_hubspot.company.ts_updated
    description: Time when the row was last updated.
  is_partner:
    description: Whether or not the company is currently a partner. This means the
      lead status is either "Membro", "Parceiro" or "Em processo tombamento".
  is_sale_partner:
    description: Whether or not the company is currently a partner in Sale. This means the
      sale lead status is either "Membro", "Parceiro" or "Em processo tombamento".
  is_rent_partner:
    description: Whether or not the company is currently a partner in Rent. This means the
      rent lead status is either "Membro", "Parceiro" or "Em processo tombamento".
  is_3p_bh:
    description: Whether or not the team responsible for the deal is either "BH Sul"
      or "BH Norte".
  is_3p_5a:
    description: True if and only if the team responsible for the deal is neither
      "BH Sul" nor "BH Norte".
  ts_load:
    description: Time when the table was loaded.
