---
table_name: dw_rede_staging.dim_lead_3p
alert_channel: "#alerts-de-airflow-dags"
table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error
column_level_validations:
  sk_lead_3p:
    is_complete:
      severity_level: Error
    is_unique:
      severity_level: Error
  id_lead_3p:
    has_completeness:
      greater_than: 0.99 # Won't be 100% because of the default row
    is_unique:
      severity_level: Error
  recurrency_type:
    is_contained_in:
      values:
        - FIRST_BATCH
        - FIRST_MONTH_BATCH
        - RECURRENT
        - COMPLEMENTARY
  growth_status:
    is_contained_in:
      values:
        - Unknown
        - LEAD
        - PROSPECT
        - QUALIFIED
        - OPPORTUNITY
        - FIRST_LISTING
