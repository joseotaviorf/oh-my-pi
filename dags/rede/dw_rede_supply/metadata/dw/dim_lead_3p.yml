---
database_name: dw_rede
table_name: dim_lead_3p
description: A Lead 3P is a property from a real estate agency in Rede QuintoAndar,
  sent through Supply Processor. Each row of this table has descriptive data about
  one unique lead.
domain: Rede
owner: gustavo.miller@quintoandar.com.br
columns:
  sk_lead_3p:
    lineage:
    - datalake_rede_supply.lead_3p_sks.sk_lead_3p
    description: Primary key of the table. It is a unique number generated by the
      ETL to represent the lead, so it does not come from any product.
  id_lead_3p:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.id
    description: ID of the lead in Supply Processor.
  id_lead_first_version_global:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.id_lead_first_version_global
    description: 'Sometimes, the same house might be sent multiple times. Those submissions become different leads, but they share the same lead hash.
      This column identifies the ID of the first lead that contains this lead hash, in Supply Processor.'
  id_lead_first_version_by_company:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.id_lead_first_version_by_company
    description: 'Sometimes, the same house might be sent multiple times. Those submissions become different leads, but they share the same lead hash.
      This column identifies the ID of the first lead that contains this lead hash sent by this particular company, in Supply Processor. It might have been
      sent by other companies before, which would make the id_lead_first_version_global different from this one.'
  id_house:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.id_house
    description: 'Identifier of the house in QuintoAndar, if it has already been created. Can be joined with dw_house.dim_house.'
  id_by_real_estate:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.id_by_real_estate
    - datalake_brokers_supply_processor.lead_3p.id_house_partner
    description: 'Identifier of the lead within the real estate agency.'
  uuid_person_owner_agent:
    lineage:
    - datalake_ebdb_clean.house_listing_relation.id_related
    description: Person UUID of the agent who owns the lead.
  lead_hash:
    lineage:
      - datalake_brokers_supply_processor.lead_3p.lead_hash
    description: 'Sometimes, the same house might be sent multiple times. Those submissions become different leads, but they share the same lead hash.
      This column identifies the lead hash of this lead.'
  sale_status:
    lineage:
    - datalake_rede_supply.lead_3p_status_changes.status
    description: 'Status of the lead or its listing, in the context of ForSale.'
    categories:
      REGISTERED: 'Registered in Main for publication'
      SUSPENDED: 'Lead suspended'
      WAITING: 'Lead eligible and waiting for owner information'
      PROCESSING: 'Lead in image processing'
      QUEUE: 'Lead awaiting in the duplicate queue'
      NOT_CONVERTED: 'Lead not converted due to ineligibility, enrichment or discard'
      PUBLISHED: 'Published in Main'
      UNPUBLISHED: 'Unpublished from Main'
  rent_status:
    lineage:
    - datalake_rede_supply.lead_3p_status_changes.status
    description: 'Status of the lead or its listing, in the context of ForRent.'
    categories:
      REGISTERED: 'Registered in Main for publication'
      SUSPENDED: 'Lead suspended'
      WAITING: 'Lead eligible and waiting for owner information'
      PROCESSING: 'Lead in image processing'
      QUEUE: 'Lead awaiting in the duplicate queue'
      NOT_CONVERTED: 'Lead not converted due to ineligibility, enrichment or discard'
      PUBLISHED: 'Published in Main'
      UNPUBLISHED: 'Unpublished from Main'
  sale_growth_status:
    lineage:
    - datalake_rede_supply.lead_3p_status_changes.growth_status
    description: 'Status of the lead in the growth funnel, in the context of ForSale.'
    categories:
      LEAD: first stage. The lead was just created, but was not approved in the eligibility analysis.
      PROSPECT: second stage. The lead was approved in the eligibility analysis.
      QUALIFIED: third stage. The real estate agency provided information about the owner of the prospect, but it was not approved in analyisis.
      OPPORTUNITY: fourth stage. A qualified lead that was sent to image processing.
      FIRST_LISTING: fifth and final stage. The opportunity was approved, and registered in Main for publication.
  rent_growth_status:
    lineage:
    - datalake_rede_supply.lead_3p_status_changes.growth_status
    description: 'Status of the lead in the growth funnel, in the context of ForRent.'
    categories:
      LEAD: first stage. The lead was just created, but was not approved in the eligibility analysis.
      PROSPECT: second stage. The lead was approved in the eligibility analysis.
      QUALIFIED: third stage. The real estate agency provided information about the owner of the prospect, but it was not approved in analyisis.
      OPPORTUNITY: fourth stage. A qualified lead that was sent to image processing.
      FIRST_LISTING: fifth and final stage. The opportunity was approved, and registered in Main for publication.
  company_name:
    lineage:
    - datalake_hubspot.company.name
    description: Name of the real estate agency.
  company_tag:
    lineage:
    - datalake_hubspot.company.tag_real_estate_agency
    description: Tag of the real estate agency, in the format [3P-name]
  extracted_3p_tag:
    lineage:
    - datalake_hubspot.company.extracted_3p_tag
    description: Content extracted from the tag in company tag, inside [3P-<extracted_3p_tag>]
  sale_integrator_trade_name:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.sale_integrator_trade_name
    description: 'Trade name of the company that integrated the lead, in the context of ForSale.'
  rent_integrator_trade_name:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.rent_integrator_trade_name
    description: 'Trade name of the company that integrated the lead, in the context of ForRent.'
  sale_recurrency_type:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.sale_recurrency_type
    description: Useful to know if the lead, in the context of ForSale, was sent in the first batch or first month,
      if it was captured too long ago but not sent, or captured recently.
    categories:
      FIRST_BATCH: The lead was sent in the first file by the real estate agency
      FIRST_MONTH_BATCH: The lead was sent up to 30 days after the first batch
      COMPLEMENTARY: The lead was sent after the first 30 days, but captured before
        the first batch
      RECURRENT: The lead was captured after the first batch, and sent after the first
        30 days
  rent_recurrency_type:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.rent_recurrency_type
    description: Useful to know if the lead, in the context of ForRent, was sent in the first batch or first month,
      if it was captured too long ago but not sent, or captured recently.
    categories:
      FIRST_BATCH: The lead was sent in the first file by the real estate agency
      FIRST_MONTH_BATCH: The lead was sent up to 30 days after the first batch
      COMPLEMENTARY: The lead was sent after the first 30 days, but captured before
        the first batch
      RECURRENT: The lead was captured after the first batch, and sent after the first
        30 days
  sale_acquisition_team:
    lineage:
    - datalake_rede_lead_acquisition.lead_3p_acquisition.acquisition_team
    description: 'Acquisition team of the lead, in the context of ForSale. It answers the question: was the lead published within
      the first 30 days of membership of the company in that business context (HUNTING), or after that (FARMING)?'
    categories:
      HUNTING: Sale lead published within the first 30 days of membership of the company
        in that business context.
      FARMING: Sale lead published after the first 30 days of membership of the company
        in that business context.
      N/A: Not applicable. The lead was not published.
  rent_acquisition_team:
    lineage:
    - datalake_rede_lead_acquisition.lead_3p_acquisition.acquisition_team
    description: 'Acquisition team of the lead, in the context of ForRent. It answers the question: was the lead published within
      the first 30 days of membership of the company in that business context (HUNTING), or after that (FARMING)?'
    categories:
      HUNTING: Rent lead published within the first 30 days of membership of the company
        in that business context.
      FARMING: Rent lead published after the first 30 days of membership of the company
        in that business context.
      N/A: Not applicable. The lead was not published.
  sale_freshness:
    description: 'Freshness of the lead in the sale context, which is determined by the amount of days between when the lead was sent to Zap Imóveis,
      and when it was sent to Supply Processor.'
    lineage:
      - datalake_rede_lead_crawler.lead_3p_freshness.freshness
    categories:
      'N/A': 'Does not apply. The lead was not found in Zap Imóveis.'
      '< -14': 'The lead was sent to Supply Processor BEFORE Zap Imóveis by more than 14 days.'
      'EARLY_FRESH': 'The lead was sent to Supply Processor BEFORE Zap Imóveis by up to 14 days.'
      'FRESH': 'The lead was sent to Supply Processor AFTER Zap Imóveis by up to 14 days.'
      '15 - 90': 'The lead was sent to Supply Processor AFTER Zap Imóveis by more than 14 days, but up to 90 days.'
      '91 - 180': 'The lead was sent to Supply Processor AFTER Zap Imóveis by more than 90 days, but up to 180 days.'
      '180+': 'The lead was sent to Supply Processor AFTER Zap Imóveis by more than 180 days.'
  rent_freshness:
    description: 'Freshness of the lead in the rent context, which is determined by the amount of days between when the lead was sent to Zap Imóveis,
      and when it was sent to Supply Processor.'
    lineage:
      - datalake_rede_lead_crawler.lead_3p_freshness.freshness
    categories:
      'N/A': 'Does not apply. The lead was not found in Zap Imóveis.'
      '< -14': 'The lead was sent to Supply Processor BEFORE Zap Imóveis by more than 14 days.'
      'EARLY_FRESH': 'The lead was sent to Supply Processor BEFORE Zap Imóveis by up to 14 days.'
      'FRESH': 'The lead was sent to Supply Processor AFTER Zap Imóveis by up to 14 days.'
      '15 - 90': 'The lead was sent to Supply Processor AFTER Zap Imóveis by more than 14 days, but up to 90 days.'
      '91 - 180': 'The lead was sent to Supply Processor AFTER Zap Imóveis by more than 90 days, but up to 180 days.'
      '180+': 'The lead was sent to Supply Processor AFTER Zap Imóveis by more than 180 days.'
  house_category:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.house_category
    description: House category. As of August 2022, this field is completely empty
      (Unknown).
  house_type:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.house_type
    description: House type. For example, "APARTAMENTO", "CASA", "SOBRADO", "OUTRO".
  house_subtype:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.house_subtype
    description: House subtype. As of August 2022, this field is completely empty
      (Unknown).
  front_door_type:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.front_door_type
    description: Time of day for the front door, such as ALL_DAY, DAYTIME, NOCTURNAL,
      NO_FRONT_DOOR, or Unknown.
  house_description:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.house_description
    description: House description.
  country:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.country
    description: Country of origin of the lead. For example, BRL or Portugal.
  state:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.state
    description: State of origin of the lead. Not standardized. For example, "RS",
      or "Rio Grande do Sul".
  city:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.city
    description: City of origin of the lead. Not standardized.
  neighborhood:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.neighborhood
    description: Neighborhood of origin of the lead. Not standardized.
  region_slug:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.region_slug
    description: Slug of the lead's region. Standardized.
  zip_code:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.zip_code
    description: ZIP Code (CEP) of the lead. Format is only digits.
  address:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.address
    description: Address (street name) of the lead.
  number:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.number
    description: Property number of the lead.
  block:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.block
    description: Block where the lead is located.
  tower:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.tower
    description: Tower where the lead is located.
  floor:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.floor
    description: Floor where the lead is located.
  complement:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.complement
    description: Complement for the lead's address.
  reference_point:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.reference_point
    description: Reference point for the lead's address.
  condominium:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.condominium
    description: Condominium where the lead is located.
  owner_person_type:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.owner_person_type
    description: Person type of the lead's owner. For example, "NATURAL_PERSON".
  access_type:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.access_type
    description: Access type of the property. As of August 2022, this field is completely
      empty (Unknown).
  authorization_type:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.authorization_type
    description: Authorization type of the property. For example, "FRONT_DOOR".
  occupant_type:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.occupant_type
    description: Occupant type. For example, "OWNER"
  additional_access_info:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.additional_access_info
    description: Additional access information for the property.
  locker_address:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.locker_address
    description: Address for the property's locker
  password:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.password
    description: Password to enter the property.
  cnpj:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.cnpj
    description: CNPJ of the real estate agency.
  version_global:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.version_global
    description: 'Sometimes, the same house might be sent multiple times. Those submissions become different leads, but they share the same lead hash.
      This column is a counter that indicates how many times the same lead hash has been sent until the current lead, which serves as its version.'
  sale_version_global:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.sale_version_global
    description: 'Sometimes, the same house might be sent multiple times. Those submissions become different leads, but they share the same lead hash.
      This column is a counter that indicates how many times the same lead hash has been sent in the Sale context until the current lead, which serves as its version.'
  rent_version_global:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.rent_version_global
    description: 'Sometimes, the same house might be sent multiple times. Those submissions become different leads, but they share the same lead hash.
      This column is a counter that indicates how many times the same lead hash has been sent in the Rent context until the current lead, which serves as its version.'
  version_by_company:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.version_by_company
    description: 'Sometimes, the same house might be sent multiple times. Those submissions become different leads, but they share the same lead hash.
      This column is a counter that indicates how many times the same lead hash has been sent by this particular company until the current lead, which serves as its version.
      It is not equal to version_global, as the same lead hash might be sent by different companies.'
  sale_version_by_company:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.sale_version_by_company
    description: 'Sometimes, the same house might be sent multiple times. Those submissions become different leads, but they share the same lead hash.
      This column is a counter that indicates how many times the same lead hash has been sent in the Sale context by this particular company until the current lead, which serves as its version.
      It is not equal to sale_version_global, as the same lead hash might be sent by different companies.'
  rent_version_by_company:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.rent_version_by_company
    description: 'Sometimes, the same house might be sent multiple times. Those submissions become different leads, but they share the same lead hash.
      This column is a counter that indicates how many times the same lead hash has been sent in the Rent context by this particular company until the current lead, which serves as its version.
      It is not equal to rent_version_global, as the same lead hash might be sent by different companies.'
  iptu_installment_amount:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.iptu_installment_informations
    description: Price per installment for the payment of IPTU.
  iptu_installment_quantity:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.iptu_installment_informations
    description: How many installments are due for IPTU.
  latitude:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.latitude
    description: Latitude of the lead.
  longitude:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.longitude
    description: Longitude of the lead.
  rent_price:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.rent_price
    description: Rent price for the lead.
  sale_price:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.sale_price
    description: Sale price for the lead.
  total_area:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.total_area
    description: Total area of the property.
  bedrooms:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.bedrooms
    description: Amount of bedrooms in the property.
  suites:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.suites
    description: Amount of suites in the property.
  bathrooms:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.bathrooms
    description: Amount of bathrooms in the property.
  garages:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.garages
    description: Amount of garages in the property.
  is_for_sale:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.is_for_sale
    description: True if the lead is for sale. This is not exclusive with is_for_rent, as both can happen simultaneously.
  is_for_rent:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.is_for_rent
    description: True if the lead is for rent. This is not exclusive with is_for_sale, as both can happen simultaneously.
  has_opted_keys_with_agent:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.has_opted_keys_with_agent
    description: If the lead has keys with agent. As of August 2022, this field is
      completely null.
  has_access_restriction:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.has_access_restriction
    description: If the property has any access restriction. As of August 2022, this
      field is completely null.
  is_furnished:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.is_furnished
    description: If the property is furnished. As of August 2022, this field is completely
      null.
  is_penthouse:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.is_penthouse
    description: If the property is a penthouse.
  is_pet_friendly:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.is_pet_friendly
    description: If the property is pet friendly. As of August 2022, this field is
      completely null.
  is_iptu_not_paid:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.is_iptu_not_paid
    description: If the IPTU is not paid. As of August 2022, this field is completely
      null.
  is_out_of_area:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.is_out_of_area
    description: If the property is out of area. As of August 2022, this field is
      completely null.
  is_habitat:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.is_habitat
    description: If the property is a habitat. As of May 2023, this field is completely false.
  has_balcony:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.has_balcony
    description: If the property is out of area. As of August 2022, this field is
      completely false.
  has_agency_key:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.has_agency_key
    description: If the real estate agency has a key. As of August 2022, this field
      is completely false.
  has_concierge:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.has_concierge
    description: If the property has a concierge. As of August 2022, this field is
      completely false.
  is_fresh_in_sale:
    lineage:
    - datalake_rede_lead_crawler.lead_3p_freshness.is_fresh
    description: 'True if the lead is fresh in the sale context, i.e., was sent to Supply Processor within two weeks of the
      creation in Zap Imóveis, either before or after.'
  is_early_fresh_in_sale:
    lineage:
    - datalake_rede_lead_crawler.lead_3p_freshness.is_early_fresh
    description: 'True if the lead is early fresh in the sale context, i.e., was sent to Supply Processor up to two weeks BEFORE the creation in Zap Imóveis.'
  is_fresh_in_rent:
    lineage:
    - datalake_rede_lead_crawler.lead_3p_freshness.is_fresh
    description: 'True if the lead is fresh in the rent context, i.e., was sent to Supply Processor within two weeks of the
      creation in Zap Imóveis, either before or after.'
  is_early_fresh_in_rent:
    lineage:
    - datalake_rede_lead_crawler.lead_3p_freshness.is_early_fresh
    description: 'True if the lead is early fresh in the rent context, i.e., was sent to Supply Processor up to two weeks BEFORE the creation in Zap Imóveis.'
  is_waiting_for_enrichment:
    lineage:
    - datalake_rede_supply.lead_3p_status_changes.is_waiting_for_enrichment
    description: If the lead has any enrichment reason for not being converted, either in Sale or Rent. Use
      is_waiting_for_enrichment_in_sale or is_waiting_for_enrichment_in_rent, if necessary.
  is_waiting_for_enrichment_in_sale:
    lineage:
    - datalake_rede_supply.lead_3p_status_changes.is_waiting_for_enrichment
    description: If the lead has any enrichment reason for not being converted, in the context of ForSale.
  is_waiting_for_enrichment_in_rent:
    lineage:
    - datalake_rede_supply.lead_3p_status_changes.is_waiting_for_enrichment
    description: If the lead has any enrichment reason for not being converted, in the context of ForRent.
  is_ineligible:
    lineage:
    - datalake_rede_supply.lead_3p_status_changes.is_ineligible
    description: If the lead has any ineligibility reason for not being converted, either in Sale or Rent. Use
      is_ineligible_in_sale or is_ineligible_in_sale, if necessary. 
  is_ineligible_in_sale:
    lineage:
    - datalake_rede_supply.lead_3p_status_changes.is_ineligible
    description: If the lead has any ineligibility reason for not being converted, in the context of ForSale.
  is_ineligible_in_rent:
    lineage:
    - datalake_rede_supply.lead_3p_status_changes.is_ineligible
    description: If the lead has any ineligibility reason for not being converted, in the context of ForRent.
  is_discarded:
    lineage:
    - datalake_rede_supply.lead_3p_status_changes.is_discarded
    description: If the lead has any discard reason for not being converted, either in Sale or Rent. Use
      is_discarded_in_sale or is_discarded_in_rent, if necessary.
  is_discarded_in_sale:
    lineage:
    - datalake_rede_supply.lead_3p_status_changes.is_discarded
    description: If the lead has any discard reason for not being converted, in the context of ForSale.
  is_discarded_in_rent:
    lineage:
    - datalake_rede_supply.lead_3p_status_changes.is_discarded
    description: If the lead has any discard reason for not being converted, in the context of ForRent.
  is_sent_to_main:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.is_sent_to_main
    description: If the lead has been sent to main.
  is_first_version_global:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.is_first_version_global
    description: 'Sometimes, the same house might be sent multiple times. Those submissions become different leads, but they share the same lead hash.
      This column is true if this is the first time this lead hash has been sent.'
  is_first_sale_version_global:
    lineage:
