---
database_name: dw_rede
table_name: fact_lead_3p_status_reason
description: Each row in this table represents a reason why a certain lead is not converted, associated with the lead in the given business context (SALE or RENT).
domain: Rede
owner: vitor.musachio@quintoandar.com.br
columns:
  sk_reason_event:
    description: Primary key of the table.
  sk_lead_3p_flow:
    lineage:
    - datalake_rede_supply.lead_3p_sks.sk_lead_3p
    description: Formed by the concatenation of sk_lead_3p and 00 (SALE) or 01 (RENT).
  sk_lead_3p:
    lineage:
    - datalake_rede_supply.lead_3p_sks.sk_lead_3p
    description: Foreign key to the lead. Can be joined with dw_rede.dim_lead_3p.
  sk_lead_3p_context:
    lineage:
    - dw_rede.dim_lead_3p_context.sk_lead_3p_context
    description: Surrogate key of dw_rede.dim_lead_3p_context. There, you can find the business context of the lead flow (SALE or RENT), and the recurrency type.
  sk_company:
    lineage:
    - datalake_company.company_sks.sk_company
    description: Foreign Key to the company that sent this lead, obtained by looking
      for the CNPJ in HubSpot. Can be joined with dw_rede.dim_company.
  sk_file:
    lineage:
    - datalake_rede_supply.file_sks.sk_file
    description: Foreign Key to the last file that updated this lead. Can be joined
      with dw_rede.dim_file.
  sk_lead_3p_reason:
    lineage:
    - datalake_rede_supply.lead_3p_reasons.sk_lead_3p_reason
    description: Foreign Key to the reason why the lead is not converted. Can be joined
      with dw_rede.dim_lead_3p_reason
  sk_region:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.id_region
    description: Foreign Key to the region of the lead. Can be joined with dw_public.dim_region.
  sk_reason_started_date:
    lineage:
    - datalake_rede_supply.lead_3p_reason_changes.ts_reason_started
    description: Date key for when the reason started applying to the lead.
  sk_reason_ended_date:
    lineage:
    - datalake_rede_supply.lead_3p_reason_changes.ts_reason_ended
    description: 'Date key for when the reason ended. This can happen for two reasons:
      1. The requirement has been met and the condition does not apply anymore. 2.
      It is an enrichment reason, but the lead has been discarded or considered ineligible,
      so it makes no sense to wait for enrichment. To differentiate between the two,
      consult the flag is_requirement_met.'
  sk_status_when_reason_started:
    lineage:
    - datalake_rede_supply.lead_3p_status.sk_status_when_reason_started
    description: Foreign Key to the status of the lead when the reason started. Can
      be joined with dw_rede.dim_lead_3p_status.
  sk_status_when_reason_ended:
    lineage:
    - datalake_rede_supply.lead_3p_status.sk_status_when_reason_ended
    description: Foreign Key to the status of the lead when the reason ended. Can
      be joined with dw_rede.dim_lead_3p_status.
  days_in_reason:
    lineage:
    - datalake_rede_supply.lead_3p_reason_changes.days_in_reason
    description: How many days between reason started and reason ended, rounded down.
      Null if the reason has not ended.
  ts_reason_started:
    lineage:
    - datalake_rede_supply.lead_3p_reason_changes.ts_reason_started
    description: Timestamp for when the reason started applying to the lead.
  ts_reason_ended:
    lineage:
    - datalake_rede_supply.lead_3p_reason_changes.ts_reason_ended
    description: 'Timestamp for when the reason ended. This can happen for two reasons:
      1. The requirement has been met and the condition does not apply anymore. 2.
      It is an enrichment reason, but the lead has been discarded or considered ineligible,
      so it makes no sense to wait for enrichment. To differentiate between the two,
      consult the flag is_requirement_met.'
  is_requirement_met:
    description: True exclusively if the reason has ended because the requirement
      has been met. For example, if there was an enrichment reason for poor quality
      photos, and the real estate agency sent new ones with better quality.
  ts_load:
    description: Time when the table was last processed.