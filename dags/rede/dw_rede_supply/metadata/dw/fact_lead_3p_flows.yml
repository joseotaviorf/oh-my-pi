database_name: dw_rede
table_name: fact_lead_3p_flows
description: 'A Lead 3P is a property from a real estate agency in Rede QuintoAndar,
  sent through Supply Processor. Each row of this table is a Lead 3P with the dates
  for the milestones in the funnel (lead, prospect, qualified, opportunity and first
  listing). There are also foreign keys pointing to the company, file, lead, status,
  and house (if it has been published). '
domain: Rede
owner: gustavo.santos.dxt@quintoandar.com.br
columns:
  sk_lead_3p:
    lineage:
    - datalake_rede_supply.lead_3p_sks.sk_lead_3p
    description: Primary key of the table, same value for dw_rede.dim_lead_3p. It
      is a unique number generated by the ETL to represent the lead.
  sk_file:
    lineage:
    - datalake_rede_supply.file_sks.sk_file
    description: Foreign Key to the last file that updated this lead. Can be joined
      with dw_rede.dim_file.
  sk_company:
    lineage:
    - datalake_rede_company.company_sks.sk_company
    description: Foreign Key to the company that sent this lead, obtained by looking
      for the CNPJ in HubSpot. Can be joined with dw_rede.dim_company.
  sk_lead_3p_status:
    lineage:
    - datalake_rede_supply.lead_3p_status.sk_lead_3p_status
    description: Foreign Key to the current status of the lead. Can be joined with
      dw_rede.dim_lead_3p_status.
  sk_house:
    lineage:
    - datalake_ebdb_clean.house.id
    description: Foreign Key to the house in Main, if the lead was published. Can
      be joined with dw_public.dim_house.
  sk_lead_date:
    lineage:
    - datalake_rede_supply.lead_3p_status_changes.ts_status_started
    description: Date key for when the lead was created in Supply Processor.
  sk_prospect_date:
    lineage:
    - datalake_rede_supply.lead_3p_status_changes.ts_status_started
    description: Date key for when the lead passed through the eligibility analysis.
  sk_qualified_date:
    lineage:
    - datalake_rede_supply.lead_3p_status_changes.ts_status_started
    description: Date key for when the owner information was received.
  sk_opportunity_date:
    lineage:
    - datalake_rede_supply.lead_3p_status_changes.ts_status_started
    description: Date key for when the lead was sent to image analysis.
  sk_registered_date:
    lineage:
    - datalake_rede_supply.lead_3p_status_changes.ts_status_started
  sk_first_listing_date:
    lineage:
    - datalake_rede_supply.lead_3p_status_changes.ts_status_started
    description: Date key for when the lead was registered in Main.
  sk_first_unpublished_date:
    lineage:
    - datalake_rede_supply.lead_3p_status_changes.ts_status_started
  ts_lead:
    lineage:
    - datalake_rede_supply.lead_3p_status_changes.ts_status_started
    description: Timestamp for when the lead was created in Supply Processor.
  ts_prospect:
    lineage:
    - datalake_rede_supply.lead_3p_status_changes.ts_status_started
    description: Timestamp for when the lead passed through the eligibility analysis.
  ts_qualified:
    lineage:
    - datalake_rede_supply.lead_3p_status_changes.ts_status_started
    description: Timestamp for when the owner information was received.
  ts_opportunity:
    lineage:
    - datalake_rede_supply.lead_3p_status_changes.ts_status_started
    description: Timestamp for when the lead was sent to image analysis.
  ts_registered:
    lineage:
    - datalake_rede_supply.lead_3p_status_changes.ts_status_started
  ts_first_listing:
    lineage:
    - datalake_rede_supply.lead_3p_status_changes.ts_status_started
    description: Timestamp for when the lead was registered in Main.
  ts_first_unpublished:
    lineage:
    - datalake_rede_supply.lead_3p_status_changes.ts_status_started
  days_lead_to_prospect:
    description: Amount of days between lead and prospect, rounded down.
  days_lead_to_qualified:
    description: Amount of days between lead and qualified, rounded down.
  days_lead_to_opportunity:
    description: Amount of days between lead and opportunity, rounded down.
  days_lead_to_first_listing:
    description: Amount of days between lead and first listing, rounded down.
  ts_load:
    description: Time when the table was last processed.
