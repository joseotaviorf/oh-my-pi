database_name: dw_rede
table_name: fact_lead_3p_status
description: Each row in this table represents a change in the status of the lead
  3P.
domain: Rede
owner: gustavo.santos.dxt@quintoandar.com.br
columns:
  sk_status_event:
    lineage:
    - datalake_rede_supply.lead_3p_status_changes.id_status_change
    description: Primary key of the table. It is a unique number generated by the
      ETL to represent the status change event.
  sk_lead_3p:
    lineage:
    - datalake_rede_supply.lead_3p_sks.sk_lead_3p
    description: Foreign key to the lead. Can be joined with dw_rede.dim_lead_3p
  sk_file:
    lineage:
    - datalake_rede_supply.file_sks.sk_file
    description: Foreign Key to the last file that updated this lead. Can be joined
      with dw_rede.dim_file.
  sk_company:
    lineage:
    - datalake_rede_company.company_sks.sk_company
    description: Foreign Key to the company that sent this lead, obtained by looking
      for the CNPJ in HubSpot. Can be joined with dw_rede.dim_company.
  sk_house:
    lineage:
    - datalake_rede_supply.lead_3p_status_changes.id_house
    description: Foreign Key to the house in Main, if the lead was published. Can
      be joined with dw_public.dim_house.
  sk_lead_3p_status:
    lineage:
    - datalake_rede_supply.lead_3p_status.sk_lead_3p_status
    description: Foreign Key to the new status of the lead. Can be joined with dw_rede.dim_lead_3p_status.
  sk_status_started_date:
    lineage:
    - datalake_rede_supply.lead_3p_status_changes.ts_status_started
    description: Date key for when the status started.
  sk_status_ended_date:
    lineage:
    - datalake_rede_supply.lead_3p_status_changes.ts_status_ended
    description: Date key for when the status ended.
  days_in_status:
    lineage:
    - datalake_rede_supply.lead_3p_status_changes.days_in_status
    description: How many days between status started and status ended. Null if the
      status has not ended.
  ts_status_started:
    lineage:
    - datalake_rede_supply.lead_3p_status_changes.ts_status_started
    description: Timestamp for when the status started.
  ts_status_ended:
    lineage:
    - datalake_rede_supply.lead_3p_status_changes.ts_status_ended
    description: Timestamp for when the status ended.
  ts_load:
    description: Time when the table was last processed.
