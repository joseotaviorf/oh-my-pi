database_name: dw_rede
table_name: dim_lead_3p_status
description: Junk dimension containing all possible combinations of status in a lead. Each row is a combination of status, growth_status, is_waiting_for_enrichment, is_ineligible and is_discarded.
domain: Rede
owner: vitor.musachio@quintoandar.com.br
columns:
  sk_lead_3p_status:
    lineage:
    - datalake_rede_supply.lead_3p_status.sk_lead_3p_status
    description: Primary key of the table. It is a unique number generated by the
      ETL to represent the status, so it does not come from any product.
  status:
    lineage:
    - datalake_rede_supply.lead_3p_status.status
    description: Status of the lead in Supply Processor, such as "NOT_CONVERTED",
      "WAITING", "PROCESSING" or "REGISTERED". Can also be the status of the listing
      after publication, such as "PUBLISHED" or "UNPUBLISHED".
  growth_status:
    lineage:
    - datalake_rede_supply.lead_3p_status.growth_status
    description: 'Status of the lead in the growth funnel. There are five categories:
      - LEAD: first stage. The lead was just created, but was not approved in the
      eligibility analysis. - PROSPECT: second stage. The lead was approved in the
      eligibility analysis. - QUALIFIED: third stage. The real estate agency provided
      information about the owner of the prospect, but it was not approved in analyisis.
      - OPPORTUNITY: fourth stage. A qualified lead that was sent to image processing.
      - FIRST_LISTING: fifth and final stage. The opportunity was approved, and registered
      in Main for publication.'
  is_waiting_for_enrichment:
    lineage:
    - datalake_rede_supply.lead_3p_status.is_waiting_for_enrichment
    description: Boolean used to tell if the lead currently has any enrichment reason.
  is_ineligible:
    lineage:
    - datalake_rede_supply.lead_3p_status.is_ineligible
    description: Boolean used to tell if the lead currently has any ineligibility
      reason.
  is_discarded:
    lineage:
    - datalake_rede_supply.lead_3p_status.is_discarded
    description: Boolean used to tell if the lead currently has any discard reason.
  waiting_for_enrichment_indicator:
    description: 'String indicator used to tell if the lead currently has any enrichment
      reason. Can contain two values: "WAITING FOR ENRICHMENT" or "NOT WAITING FOR
      ENRICHMENT"'
  ineligible_indicator:
    description: 'String indicator used to tell if the lead currently has any ineligibility
      reason. Can contain two values: "INELIGIBLE" or "ELIGIBLE"'
  discarded_indicator:
    description: 'String indicator used to tell if the lead currently has any discard
      reason. Can contain two values: "DISCARDED" or "NOT DISCARDED"'
  ts_load:
    description: Time when the table was last processed.