---
database_name: dw_rede
table_name: dim_lead_3p_context
description: Dimension containing all possible contexts of a lead flow, including business context and recurrency type.
domain: Rede
owner: vitor.musachio@quintoandar.com.br
columns:
  sk_lead_3p_context:
    description: 'Unique identifier of the lead context'
  business_context:
    description: 'If the lead flow is in the context of SALE or RENT'
    categories:
      SALE: 'Indicates lead flow is SALE'
      RENT: 'Indicates lead flow is RENT'
  recurrency_type:
    description: 'Classifies whether the lead came from the first batch, first month, is recurrent, or is complementary (captured before first batch).'
    categories:
      FIRST_BATCH: 'Lead sent along with the first file'
      FIRST_MONTH_BATCH: 'Lead was sent up to 30 days after the first batch'
      RECURRENT: 'Lead was captured and sent AFTER the first 30 days'
      COMPLEMENTARY: 'Lead was captured BEFORE the first batch, but sent AFTER the first 30 days'
      'N/A': 'Does not apply'
  acquisition_team:
    description: 'Acquisition team of the lead. It answers the question: was the lead published within the first 30 days of membership
      of the company in that business context (HUNTING), or after that (FARMING)?'
    categories:
      HUNTING: Lead published within the first 30 days of membership of the company
        in that business context.
      FARMING: Lead published after the first 30 days of membership of the company
        in that business context.
  integrator_trade_name:
    lineage:
      - datalake_company.company.trade_name
    description: 'Trade name of the company that integrated the lead.'
  freshness:
    description: 'Freshness of the lead, which is determined by the amount of days between when the lead was sent to Zap Imóveis, and when it was sent to
      Supply Processor.'
    lineage:
      - datalake_rede_lead_crawler.lead_3p_freshness.freshness
    categories:
      'N/A': 'Does not apply. The lead was not found in Zap Imóveis.'
      '< -14': 'The lead was sent to Supply Processor BEFORE Zap Imóveis by more than 14 days.'
      'EARLY_FRESH': 'The lead was sent to Supply Processor BEFORE Zap Imóveis by up to 14 days.'
      'FRESH': 'The lead was sent to Supply Processor AFTER Zap Imóveis by up to 14 days.'
      '15 - 90': 'The lead was sent to Supply Processor AFTER Zap Imóveis by more than 14 days, but up to 90 days.'
      '91 - 180': 'The lead was sent to Supply Processor AFTER Zap Imóveis by more than 90 days, but up to 180 days.'
      '180+': 'The lead was sent to Supply Processor AFTER Zap Imóveis by more than 180 days.'
  is_fresh:
    description: 'True if the lead is fresh, i.e., was sent to Supply Processor within two weeks of the creation in Zap Imóveis, either before or after.'
    lineage:
      - datalake_rede_lead_crawler.lead_3p_freshness.is_fresh
  is_early_fresh:
    description: 'True if the lead is early fresh, i.e., was sent to Supply Processor up to two weeks BEFORE the creation in Zap Imóveis.'
    lineage:
      - datalake_rede_lead_crawler.lead_3p_freshness.is_early_fresh
  is_for_sale:
    description: 'True if the lead flow is in the context of ForSale.'
  is_for_rent:
    description: 'True if the lead flow is in the context of ForRent.'
  is_first_batch:
    description: 'True if the lead is from the first batch, i.e., was sent along with the first file.'
  is_first_month_batch:
    description: 'True if the lead is from a first month batch, i.e., was sent up to 30 days after the first batch.'
  is_complementary:
    description: 'True if the lead is complementary, i.e., captured BEFORE the first batch, but sent AFTER the first 30 days.'
  is_recurrent:
    description: 'True if the lead is recurrent, i.e., captured and sent AFTER the first 30 days.'
  is_hunting:
    description: 'True if the lead was published within the first 30 days of membership of the company in that business context.'
  is_farming:
    description: 'True if the lead was published after the first 30 days of membership of the company in that business context.'
  ts_load:
    description: 'Timestamp of when this table loaded last'