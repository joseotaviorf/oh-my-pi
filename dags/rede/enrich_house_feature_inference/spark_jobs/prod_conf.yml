      output: true
    - pattern: perto ao metro
      field: has_metro_or_train_close
      output: true
    - pattern: proximo do metro
      field: has_metro_or_train_close
      output: true
    - pattern: proximo da esta
      field: has_metro_or_train_close
      output: true
    - pattern: perto da esta
      field: has_metro_or_train_close
      output: true
