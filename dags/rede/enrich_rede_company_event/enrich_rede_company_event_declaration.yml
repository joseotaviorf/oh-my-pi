dag:
  name: enrich_rede_company_event
  schedule_start_date: 2020, 8, 29
  owner: Data Rede
  documentation:
    dag_purpose: |
      Creates tables for the context `enrich_rede_company_event`, enriching company event information from Rede QuintoAndar.
      This data currently comes from HubSpot.
      This DAG is triggered by Mediator and loads the table via full load.
workflow:
  type: query_delta
  layer: enrich
cluster:
  type: databricks_12_2_med_general_photon_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
