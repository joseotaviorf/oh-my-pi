---
database_name: datalake_rede_company_event
table_name: company_event
description: Every row in this table corresponds to an event that happened within
  a company journey from Rede, either in the context of Sale or Rent.
  This is mostly collected from HubSpot.
domain: Rede
owner: gustavo.miller@quintoandar.com.br
columns:
  id_company:
    lineage:
      - datalake_booking.booking.id_company_demand
      - datalake_brokers_supply_processor.lead_3p.id_company_hubspot
      - datalake_ebdb_listing.house.id_company_hubspot
      - datalake_hubspot.company_status.id_company
      - datalake_hubspot.deal.id_company
    description: Key of the HubSpot company associated with the event.
  id_journey:
    description: Number of the journey, starting from 0. A journey ends when a deal
      is lost or a membership ends, in a given business context (sale or rent).
  id_deal:
    lineage:
      - datalake_hubspot.deal.id_deal
    description: Key of the HubSpot deal associated with the event.
  id_ticket_demand_onboarding:
    lineage:
      - datalake_hubspot.ticket_stage.id_ticket
    description: Key of the HubSpot demand onboarding ticket associated with the event.
  id_ticket_supply_onboarding:
    lineage:
      - datalake_hubspot.ticket_stage.id_ticket
    description: Key of the HubSpot supply onboarding ticket associated with the event.
  id_user_updated_by:
    lineage:
      - datalake_hubspot.company_status.id_user_updated_by
      - datalake_hubspot.deal_stage.id_user_updated_by
      - datalake_hubspot.ticket_stage.id_user_updated_by
    description: ID of the HubSpot user who caused the event.
  source_type:
    lineage:
      - datalake_hubspot.company_status.source_type
      - datalake_hubspot.deal_stage.source_type
      - datalake_hubspot.ticket_stage.source_type
    description: Source type of the update.
    categories:
      API: ''
      AUTOMATION_PLATFORM: ''
      BATCH_UPDATE: ''
      CRM_UI_BULK_ACTION: ''
      CRM_UI: ''
      IMPORT: ''
      MOBILE_IOS: ''
  business_context:
    description: The business context of the event.
    categories:
      RENT: 'Event in the rent context'
      SALE: 'Event in the sale context'
  event:
    description: Treated name of the event. For example, "Membership Started", "Lead"
      or "Deal Lost".
  event_type:
    description: Type of the event.
    categories:
      Contract Transition: "Rede used to have a quite different contract model when it began. That changed, which put all partners in a transition process to become members with the new contract model. Not all partners agreed to become members."
      Deal: "Events linked to dealing with the company. These can range from contact attempts, growth nurturing, meetings, documentation and contract signing."
      Demand Onboarding: "Events linked to the demand onboarding process. For example: onboarding, first demand received and etc."
      Status: "Referring to the company's journey through the funnel steps of the Rede QuintoAndar business model."
      Supply Onboarding: "Events linked to the supply onboarding process. For example: onboarding, integration, first listings and etc."
  hubspot_event_detail:
    lineage:
      - datalake_hubspot.company_status.lead_status
      - datalake_hubspot.stage.label
    description: What exactly happened in HubSpot to trigger this event. For example
      "Termo Assinado", "Membro", or "Negócio Perdido".
  hubspot_event_origin:
    lineage:
      - datalake_hubspot.pipeline.label
    description: Origin of the event detailed in HubSpot. Can be "Status", "Deal"
      or the name of the ticket pipeline.
  hubspot_company_status:
    lineage:
      - datalake_hubspot.company_status.lead_status
    description: Status of the company at the time of the event.
  hubspot_deal_stage:
    lineage:
      - datalake_hubspot.stage.label
    description: Most recent deal stage of the company at the time of the event.
  hubspot_demand_onboarding_ticket_stage:
    lineage:
      - datalake_hubspot.stage.label
    description: Most recent demand onboarding ticket stage at the time of the event.
  hubspot_supply_onboarding_ticket_stage:
    lineage:
      - datalake_hubspot.stage.label
    description: Most recent supply onboarding ticket stage at the time of the event.
  was_member_before_event:
    description: Whether the company was a member before the event happened.
  ts_event:
    lineage:
      - datalake_booking.booking.ts_created
      - datalake_brokers_supply_processor.lead_3p.ts_created
      - datalake_hubspot.company_status.ts_status_started
      - datalake_hubspot.deal_stage.ts_stage_started
      - datalake_hubspot.ticket_stage.ts_stage_started
      - datalake_sale_listings.ts_first_publication
    description: Timestamp of when the event happened.
