---
database_name: datalake_rede_lead_crawler
table_name: lead_3p_freshness
description: Matches leads from Supply Processor to offers in Zap Imóveis, in order to analyze its freshness.
  A lead is considered fresh when it was sent to Supply Processor for the first time within two weeks of the creation in Zap Imóveis.
domain: Rede
owner: gustavo.miller@quintoandar.com.br
columns:
  id_lead_3p:
    description: Id of the lead 3P.
    lineage:
      - datalake_brokers_supply_processor.lead_3p.id
  id_offer_zap:
    description: Id of the offer in Zap Imóveis
    lineage:
      - datalake_growth_lab_clean.supply_recurrence.id_offer
  business_context:
    description: Whether it is in the SALE or RENT context.
    lineage:
      - datalake_growth_lab_clean.supply_recurrence.business_context
    categories:
      SALE: 'Lead in the SALE context'
      RENT: 'Lead in the RENT context'
  freshness:
    description: 'Freshness of the lead, which is determined by the amount of days between when the lead was sent to Zap Imóveis, and when it was sent to
      Supply Processor.'
    categories:
      'N/A': 'Does not apply. The lead was not found in Zap Imóveis.'
      '< -14': 'The lead was sent to Supply Processor BEFORE Zap Imóveis by more than 14 days.'
      'EARLY_FRESH': 'The lead was sent to Supply Processor BEFORE Zap Imóveis by up to 14 days.'
      'FRESH': 'The lead was sent to Supply Processor AFTER Zap Imóveis by up to 14 days.'
      '15 - 90': 'The lead was sent to Supply Processor AFTER Zap Imóveis by more than 14 days, but up to 90 days.'
      '91 - 180': 'The lead was sent to Supply Processor AFTER Zap Imóveis by more than 90 days, but up to 180 days.'
      '180+': 'The lead was sent to Supply Processor AFTER Zap Imóveis by more than 180 days.'
  is_fresh:
    description: 'True if the lead is fresh, i.e., was sent to Supply Processor within two weeks of the creation in Zap Imóveis, either before or after.'
  is_early_fresh:
    description: 'True if the lead is early fresh, i.e., was sent to Supply Processor up to two weeks BEFORE the creation in Zap Imóveis.'
  days_crawler_to_supply_processor:
    description: 'Amount of days between when the lead was sent to Zap Imóveis, and when it was sent to Supply Processor. If negative, it means the lead
      was sent to Supply Processor BEFORE Zap Imóveis.'
  dt_crawler:
    description: 'Date when the lead was sent to Zap Imóveis.'
    lineage:
      - datalake_growth_lab_clean.supply_recurrence.dt_listing_created
  dt_supply_processor:
    description: 'Date when the lead was sent to Supply Processor.'
    lineage:
      - datalake_brokers_supply_processor.lead_3p.ts_first_rent_version_created_by_company
      - datalake_brokers_supply_processor.lead_3p.ts_first_sale_version_created_by_company
