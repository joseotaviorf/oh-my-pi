database_name: datalake_mexico_rent_supply
table_name: cohort_funnel
description: This table contains the base information about Benvi Mexico's Rent Supply
  cohort funnel, based on a weekly or monthly view.
domain: Benvi
owner: data-international@quintoandar.com.br
columns:
  country_code:
    lineage:
    - datalake_mexico_rent_supply.listing_flow.country_code
    description: Country code of the lead origin. Also, it's a partition for this
      table.
  city_group:
    lineage:
    - datalake_mexico_rent_supply.listing_flow.city_group
    description: City group of the lead origin.
  supply_mkt_origin:
    lineage:
    - datalake_mexico_rent_supply.listing_flow.supply_mkt_origin
    description: Origin of the lead in the marketing funnel.
  supply_mkt_origin_detailed:
    lineage:
    - datalake_mexico_rent_supply.listing_flow.supply_mkt_origin_detailed
    description: Marketing origin detailed of the lead.
  mexico_channel:
    lineage:
    - datalake_mexico_rent_supply.listing_flow.mexico_channel
    description: Name of the marketing channel on the Mexico operation.
  dt_lead_week_started:
    lineage:
    - datalake_mexico_rent_supply.listing_flow.ts_lead
    description: Date of the week start based on the lead creation.
  dt_lead_month_started:
    lineage:
    - datalake_mexico_rent_supply.listing_flow.ts_lead
    description: Date of the month start based on the lead creation.
  aq2o_cohort:
    description: Available qualified to opportunity cohort conversion.
  available_qualifieds_cohort:
    description: Volume of available qualifieds cohort.
  first_listings_cohort:
    description: Volume of first listings cohort.
  l2p_cohort:
    description: Lead to prospect cohort conversion.
  leads:
    description: Volume of leads.
  o2fl_cohort:
    description: Opportunity to first listing cohort conversion.
  opportunities_cohort:
    description: Volume of opportunities cohort.
  p2q_cohort:
    description: Prospect to qualified cohort conversion.
  prospects_cohort:
    description: Volume of prospects cohort.
  q2aq_cohort:
    description: Qualified to available qualified cohort conversion.
  q2o_cohort:
    description: Qualified to opportunity cohort conversion.
  qualifieds_cohort:
    description: Volume of qualifieds cohort.
