database_name: datalake_mexico_rent_supply
table_name: listing_flow
description: This table contains the base information about Benvi Mexico's Rent Listing
  Flow.
domain: Benvi
owner: data-international@quintoandar.com.br
columns:
  id_lead:
    lineage:
    - datalake_listing_flow.listing_flows_with_reprocessed_leads.id_lead
    description: Id of the lead, which may be unique or not because a lead can be
      related to multiple listings.
  id_house_listing:
    lineage:
    - datalake_rent_potential_listing.potential_listing_b2b.id_house_listing
    description: Id of the house listing related to the lead, which may exists or
      not.
  id_region:
    lineage:
    - datalake_listing_flow.listing_flows_with_reprocessed_leads.id_region
    description: Id of the region related to the lead/house of the lead (?).
  country_code:
    lineage:
    - datalake_listing_flow.listing_flows_with_reprocessed_leads.country_code
    description: Country code of the lead origin. Also, it's a partition for this
      table.
  city_group:
    lineage:
    - datalake_region.region.city_group
    description: City group of the lead origin.
  supply_mkt_origin:
    lineage:
    - datalake_gsheets_clean.taxonomy_growth.mkt_origin
    description: Origin of the lead in the marketing funnel.
  supply_mkt_origin_detailed:
    lineage:
    - datalake_gsheets_clean.taxonomy_growth.mkt_channel
    - datalake_gsheets_clean.taxonomy_growth.mkt_origin
    description: Marketing origin detailed of the lead.
  mkt_channel:
    lineage:
    - datalake_gsheets_clean.taxonomy_growth.mkt_channel
    description: Channel level of the Taxonomy, used to describe the type of the channel.
  mexico_channel:
    lineage:
    - datalake_gsheets_clean.taxonomy_growth.mkt_origin
    description: Name of the marketing channel on the Mexico operation.
  lead_origin:
    lineage:
    - datalake_lead.lead.source
    description: Origin of the lead.
  ub_page_name:
    lineage:
    - datalake_lead.lead.unbounce_page_variant
    description: Name of the unbounce page.
  advertiser_name:
    lineage:
    - datalake_lead.lead.advertiser_name
    description: Name of the advertiser.
  ts_lead:
    lineage:
    - datalake_listing_flow.listing_flows_with_reprocessed_leads.ts_lead
    description: Timestamp of the lead's creation.
  ts_prospect:
    lineage:
    - datalake_listing_flow.listing_flows_with_reprocessed_leads.ts_prospect
    description: Timestamp of when the lead became a prospect.
  ts_qualified:
    lineage:
    - datalake_listing_flow.listing_flows_with_reprocessed_leads.ts_qualified
    description: Timestamp of when the prospect became a qualified.
  ts_available_qualified:
    lineage:
    - datalake_listing_flow.listing_flows_with_reprocessed_leads.ts_available_qualified
    description: Timestamp of the available qualified.
  ts_opportunity:
    lineage:
    - datalake_listing_flow.listing_flows_with_reprocessed_leads.ts_opportunity
    description: Timestamp of when the qualified became a opportunity.
  ts_first_listing:
    lineage:
    - datalake_listing_flow.listing_flows_with_reprocessed_leads.ts_first_listing
    description: Timestamp of when the opportunity became a first listing.
