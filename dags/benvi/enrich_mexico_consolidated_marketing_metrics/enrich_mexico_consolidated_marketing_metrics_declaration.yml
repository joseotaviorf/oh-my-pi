dag:
  name: enrich_mexico_consolidated_marketing_metrics
  schedule_start_date: 2022, 6, 1
  documentation:
    dag_purpose: |
      Mexico Consolidated Marketing Metrics DAG groups marketing metrics for QuintoAndar's media channels related to Benvi operation.
      All consolidated tables are united in the `consolidated_media_metrics` query.
      Mediator triggers this DAG and loads the table via incremental load.
  owner: Data International
workflow:
  type: query
  layer: enrich
  inner_dependencies:
    consolidated_media_metrics:
      - facebook_consolidated_metrics
      - google_consolidated_metrics
      - mitula_consolidated_metrics
      - trovit_consolidated_metrics
  default_extraction_type: incremental
  default_partitions: [id_date]
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, macros.ds_add(ds, -6), 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, ds, 'load_end_date') }}"
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: m5a.2xlarge
    node_type_id: m5a.xlarge
    num_workers: 2
    spark_version: 13.3.x-scala2.12
