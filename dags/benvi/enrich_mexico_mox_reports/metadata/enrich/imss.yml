---
database_name: datalake_mexico_mox_reports
table_name: imss
description: This table contains information, provided by MOX for credit analysis, of the user who worked and/or works under the IMSS category
  (equivalent to CLT in Brazil). In order to get an unique line, it's necessary to add all the columns.
domain: International
owner: bruna.prates@quintoandar.com.br
columns:
  curp:
    lineage:
      - datalake_arquivo_confidencial_clean.presumed_income_report_aud.attributes
    description: CURP (Mexico Unique Population Registration Code) of the user.
  nss:
    lineage:
      - datalake_arquivo_confidencial_clean.presumed_income_report_aud.attributes
    description: NSS (Social Security Number) of the user.
  name:
    lineage:
      - datalake_arquivo_confidencial_clean.presumed_income_report_aud.attributes
    description: Name of the user.
  presumed_income:
    lineage:
      - datalake_arquivo_confidencial_clean.presumed_income_report_aud.presumed_income
    description: The presumed income of the user.
  weeks_worked:
    lineage:
      - datalake_arquivo_confidencial_clean.presumed_income_report_aud.attributes
    description: Total time (in weeks) that the user has been working throughout their lifetime.
  weeks_discounted:
    lineage:
      - datalake_arquivo_confidencial_clean.presumed_income_report_aud.attributes
    description: Weeks discounted from the user. This happens when people lose their jobs and borrow money, reducing their total work weeks.
  weeks_recovered:
    lineage:
      - datalake_arquivo_confidencial_clean.presumed_income_report_aud.attributes
    description: Weeks retrieved from the user. This happens when people pay back the borrowed money that reduced their total work weeks, making those weeks back.
  ts_report:
    lineage:
      - datalake_arquivo_confidencial_clean.rev_info.ts_created
    description: Timestamp of when the report was provided for the last time.
  year:
    lineage:
      - datalake_arquivo_confidencial_clean.rev_info.ts_created
    description: Year of when the report was provided for the last time. Also, it's a partition of this table.
  month:
    lineage:
      - datalake_arquivo_confidencial_clean.rev_info.ts_created
    description: Month of when the report was provided for the last time. Also, it's a partition of this table.
  day:
    lineage:
      - datalake_arquivo_confidencial_clean.rev_info.ts_created
    description: Day of when the report was provided for the last time. Also, it's a partition of this table.
