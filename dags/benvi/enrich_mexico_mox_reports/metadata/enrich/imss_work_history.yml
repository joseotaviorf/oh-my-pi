---
database_name: datalake_mexico_mox_reports
table_name: imss_work_history
description: This table contains information, provided by MOX for credit analysis, about the work history of the user who worked and/or works
  under the IMSS category (equivalent to CLT in Brazil). In order to get an unique line, it's necessary to add all the columns.
domain: International
owner: bruna.prates@quintoandar.com.br
columns:
  curp:
    lineage:
      - datalake_arquivo_confidencial_clean.presumed_income_report_aud.attributes
    description: CURP (Mexico Unique Population Registration Code) of the user.
  employer_registry:
    lineage:
      - datalake_arquivo_confidencial_clean.presumed_income_report_aud.attributes
    description: The employer registry of the user.
  company_name:
    lineage:
      - datalake_arquivo_confidencial_clean.presumed_income_report_aud.attributes
    description: The name of the company the user works/worked for.
  federative_entity:
    lineage:
      - datalake_arquivo_confidencial_clean.presumed_income_report_aud.attributes
    description: Federative entity of the company where the user works/worked.
  base_salary_contribution:
    lineage:
      - datalake_arquivo_confidencial_clean.presumed_income_report_aud.attributes
    description: The base salary contribution of the user's respective job.
  monthly_salary:
    lineage:
      - datalake_arquivo_confidencial_clean.presumed_income_report_aud.attributes
    description: The user's monthly salary at the respective job.
  is_current_work:
    lineage:
      - datalake_arquivo_confidencial_clean.presumed_income_report_aud.attributes
    description: Boolean indicating whether the user's respective job is the current one.
  time_worked:
    lineage:
      - datalake_arquivo_confidencial_clean.presumed_income_report_aud.attributes
    description: String indicating the time worked by the user in the respective job. 'Vigente' means its the current work.
  dt_work_started:
    lineage:
      - datalake_arquivo_confidencial_clean.presumed_income_report_aud.attributes
    description: Date the user started this job.
  dt_work_ended:
    lineage:
      - datalake_arquivo_confidencial_clean.presumed_income_report_aud.attributes
    description: Date the user ended this job. 'null' means its the current work.
  ts_report:
    lineage:
      - datalake_arquivo_confidencial_clean.rev_info.ts_created
    description: Timestamp of when the report was provided for the last time.
  year:
    lineage:
      - datalake_arquivo_confidencial_clean.rev_info.ts_created
    description: Year of when the report was provided for the last time. Also, it's a partition of this table.
  month:
    lineage:
      - datalake_arquivo_confidencial_clean.rev_info.ts_created
    description: Month of when the report was provided for the last time. Also, it's a partition of this table.
  day:
    lineage:
      - datalake_arquivo_confidencial_clean.rev_info.ts_created
    description: Day of when the report was provided for the last time. Also, it's a partition of this table.
