---
database_name: datalake_mexico_mox_reports
table_name: issste
description: This table contains information, provided by MOX for credit analysis, of the user who worked and/or works under the ISSSTE category (equivalent to federal employee in Brazil).
domain: International
owner: bruna.prates@quintoandar.com.br
columns:
  curp:
    lineage:
      - datalake_arquivo_confidencial_clean.presumed_income_report_aud.attributes
    description: CURP (Mexico Unique Population Registration Code) of the user. It's an unique identifier for individuals in Mexico.
  nss:
    lineage:
      - datalake_arquivo_confidencial_clean.presumed_income_report_aud.attributes
    description: NSS (Social Security Number) of the user. Uniquely identifies an individual in the social security system.
  rfc:
    lineage:
      - datalake_arquivo_confidencial_clean.presumed_income_report_aud.attributes
    description: RFC (Federal Taxpayer Registry) of the user.
  name:
    lineage:
      - datalake_arquivo_confidencial_clean.presumed_income_report_aud.attributes
    description: Name of the user.
  first_surname:
    lineage:
      - datalake_arquivo_confidencial_clean.presumed_income_report_aud.attributes
    description: First surname of the user.
  second_surname:
    lineage:
      - datalake_arquivo_confidencial_clean.presumed_income_report_aud.attributes
    description: Second surname of the user.
  gender:
    lineage:
      - datalake_arquivo_confidencial_clean.presumed_income_report_aud.attributes
    description: Gender of the user.
    categories:
      MUJER: The user is a woman.
      HOMBRE: The user is a man.
  marital_status:
    lineage:
      - datalake_arquivo_confidencial_clean.presumed_income_report_aud.attributes
    description: Marital status of the user.
    categories:
      SOLTERO (A): The user is single.
      CASADO (A): The user is married.
  is_pensioner:
    lineage:
      - datalake_arquivo_confidencial_clean.presumed_income_report_aud.attributes
    description: Boolean indicating whether the user is a pensioner.
  is_active:
    lineage:
      - datalake_arquivo_confidencial_clean.presumed_income_report_aud.attributes
    description: Boolean indicating the affiliation status of the user, whether is active or inactive.
  presumed_income:
    lineage:
      - datalake_arquivo_confidencial_clean.presumed_income_report_aud.presumed_income
    description: The presumed income of the user.
  type_pension:
    lineage:
      - datalake_arquivo_confidencial_clean.presumed_income_report_aud.presumed_income
    description: Type of pension system of the user.
  time_pension:
    lineage:
      - datalake_arquivo_confidencial_clean.presumed_income_report_aud.presumed_income
    description: Time the user receives pension.
  dt_birth:
    lineage:
      - datalake_arquivo_confidencial_clean.presumed_income_report_aud.presumed_income
    description: Date of birth of the user.
  dt_work_started:
    lineage:
      - datalake_arquivo_confidencial_clean.presumed_income_report_aud.presumed_income
    description: Date the user started this job.
  dt_work_ended:
    lineage:
      - datalake_arquivo_confidencial_clean.presumed_income_report_aud.presumed_income
    description: Date the user ended this job.
  dt_government_work_started:
    lineage:
      - datalake_arquivo_confidencial_clean.presumed_income_report_aud.presumed_income
    description: Date the user joined the federal government.
  ts_report:
    lineage:
      - datalake_arquivo_confidencial_clean.rev_info.ts_created
    description: Timestamp of when the report was provided for the last time.
  year:
    lineage:
      - datalake_arquivo_confidencial_clean.rev_info.year
    description: Year of when the report was provided for the last time. Also, it's a partition of this table.
  month:
    lineage:
      - datalake_arquivo_confidencial_clean.rev_info.month
    description: Month of when the report was provided for the last time. Also, it's a partition of this table.
  day:
    lineage:
      - datalake_arquivo_confidencial_clean.rev_info.day
    description: Day of when the report was provided for the last time. Also, it's a partition of this table.
