---
database_name: datalake_mexico_cib_events
table_name: cib_events
description: This table contains information about the events related to CIBs (Benvi real estate consultant). In order to get an unique line, it's necessary to add all the columns.
domain: International
owner: bruna.prates@quintoandar.com.br
columns:
  id_cib:
    lineage:
      - datalake_big_agent.house_rent_listing_consultant.id_user
    description: ID of the CIB, from EBDB. It's the user external ID from Big Agent
  id_event:
    lineage:
      - datalake_rent_potential_listing.potential_listing_b2b.id_house_listing
      - datalake_rent_demand_events.rent_demand_events.id_house_listing
      - datalake_rent_demand_events.rent_demand_events.id_contract
    description: ID of the event, which can be the house listing or contract ID.
  id_house:
    lineage:
      - datalake_big_agent.house_rent_listing_consultant.id_house
    description: ID of the house related to the CIB.
  id_house_listing:
    lineage:
      - datalake_rent_potential_listing.potential_listing_b2b.id_house_listing
      - datalake_rent_demand_events.rent_demand_events.id_house_listing
    description: ID of the house listing related to the CIB.
  id_contract:
    lineage:
      - datalake_rent_demand_events.rent_demand_events.id_contract
    description: ID of the contract.
  event_type:
    description: The type of the event made by the CIB.
    categories:
      FL: CIB brought a First Listing.
      CS: The listing that CIB manages had a Contract Signed.
  dt_event:
    description: Date of the event made by the CIB.
  year:
    lineage:
      - datalake_quintoandar.aux_date.date
    description: Year of the event made by the CIB. Also, it's a partition of this table.
  month:
    lineage:
      - datalake_quintoandar.aux_date.date
    description: Month of the event made by the CIB. Also, it's a partition of this table.
  day:
    lineage:
      - datalake_quintoandar.aux_date.date
    description: Day of the event made by the CIB. Also, it's a partition of this table.
