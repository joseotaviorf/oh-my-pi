dag:
  name: enrich_mexico_cib_events
  schedule_start_date: 2022, 5, 1
  documentation:
    dag_purpose: |
      This DAG has the goal to monitor the CIB's events.
      This DAG is triggered daily, via Mediator and incremental load.
  owner: Data International
workflow:
  type: query
  layer: enrich
  default_extraction_type: incremental
  default_partitions: [year, month, day]
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: r5a.xlarge
    node_type_id: m5d.xlarge
    num_workers: 2
    spark_version: 13.3.x-scala2.12
