---
database_name: datalake_mexico_marketing_costs
table_name: daily_costs
owner: isadora.gallerani@quintoandar.com.br
domain: International
description: Table that consolidates Benvi's Mexico operation marketing costs extracteds from manual gsheets.
columns:
  origin:
    description: Growth's marketing platform used by Mexico operation. In this case of manual costs, will always be null.
  account_name:
    lineage:
      - datalake_gsheets_clean.mexico_marketing_manual_shared_costs.account_name
    description: The related account name.
  campaign_name:
    lineage:
      - datalake_gsheets_clean.mexico_marketing_manual_shared_costs.campaign_name
    description: Name of the campaign segmentation.
  utm_campaign:
    lineage:
      - datalake_gsheets_clean.mexico_marketing_manual_shared_costs.campaign_name
    description: The UTM campaign applied on growth marketing platform.
  utm_term:
    lineage:
      - datalake_gsheets_clean.mexico_marketing_manual_shared_costs.utm_term
    description: The UTM term applied on growth marketing platform.
  utm_content:
    lineage:
      - datalake_gsheets_clean.mexico_marketing_manual_shared_costs.utm_content
    description: The UTM content applied on growth marketing platform.
  city_group:
    lineage:
      - datalake_gsheets_clean.mexico_marketing_manual_shared_costs.city_group
    description: The city group segmentation.
  campaign_origin_acquisition:
    description: The origin acquisition campaign from which the marketing campaign was intent to destiate effort.
  mkt_category:
    description: The marketing category value, which will always be "Inbound".
  mkt_flow:
    description: The marketing flow value, which will always be "Self-Service".
  mkt_completion:
    description: The marketing completion value, which will always be "Full Self-Service".
  mkt_origin:
    lineage:
      - datalake_gsheets_clean.mexico_marketing_manual_shared_costs.mkt_origin
    description: The marketing origin value.
  mkt_channel:
    lineage:
      - datalake_gsheets_clean.mexico_marketing_manual_shared_costs.mkt_channel
    description: The marketing channel value.
  mkt_medium:
    lineage:
      - datalake_gsheets_clean.mexico_marketing_manual_shared_costs.mkt_medium
    description: The marketing medium value.
  mkt_source:
    lineage:
      - datalake_gsheets_clean.mexico_marketing_manual_shared_costs.mkt_source
    description: The marketing source value.
  mkt_platform:
    description: The marketing platform value.
    categories:
      Desktop: The platform is Dekstop.
      Mobile: The platform is Mobile.
      Other: The platform is another one.
  funnel_side:
    lineage:
      - datalake_gsheets_clean.mexico_marketing_manual_shared_costs.side
    description: Squad resposible for that cost.
  cost:
    description: The cost of the media, considering its raw cost multiplied by the cost factor.
  id_date:
    lineage:
      - datalake_gsheets_clean.mexico_marketing_manual_shared_costs.dt_cost
    description: Id of the segmentation date. It's a partition of this table.
  flow_type:
    description: Type of the cost flow and in this case will always be "manual". It's a partition of this table.