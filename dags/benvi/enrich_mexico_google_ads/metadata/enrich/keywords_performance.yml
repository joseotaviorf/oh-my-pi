database_name: datalake_mexico_google_ads
table_name: keywords_performance
description: Incremental table that contains Google Ads' Keyword's Performance data related to the Benvi operation on Mexico.
domain: International
owner: isadora.gallerani@quintoandar.com.br
columns:
  id_keyword:
    lineage:
      - datalake_google_ads_clean.keywords_performance.id_keyword
    description: Id of the keyword, which could not be unique.
  id_external_customer:
    lineage:
      - datalake_google_ads_clean.keywords_performance.id_external_customer
    description: Id of the external customer.
  id_ad_group:
    lineage:
      - datalake_google_ads_clean.keywords_performance.id_ad_group
    description: Id of the ad group.
  id_campaign:
    lineage:
      - datalake_google_ads_clean.keywords_performance.id_campaign
    description: Id of the campaign.
  campaign_name:
    lineage:
      - datalake_google_ads_clean.keywords_performance.campaign_name
    description: The campaign name.
  ad_group_name:
    lineage:
      - datalake_google_ads_clean.keywords_performance.ad_group_name
    description: The name of the ad group.
  ad_network_type:
    lineage:
      - datalake_google_ads_clean.keywords_performance.ad_network_type
    description: The type of the keyword's network.
  match_type:
    lineage:
      - datalake_google_ads_clean.keywords_performance.match_type
    description: The match type.
  criteria:
    lineage:
      - datalake_google_ads_clean.keywords_performance.criteria
    description: The criteria.
  account_descriptive_name:
    lineage:
      - datalake_google_ads_clean.keywords_performance.account_descriptive_name
    description: The account name related to the keyword.
  account_snake_case:
    lineage:
      - datalake_google_ads_clean.keywords_performance.account_snake_case
    description: The account name related to the keyword, but in snake case.
  report_type:
    lineage:
      - datalake_google_ads_clean.keywords_performance.report_type
    description: The type of report related to the performance.
  device:
    lineage:
      - datalake_google_ads_clean.keywords_performance.device
    description: The device name related to the keyword's performance.
  clicks:
    lineage:
      - datalake_google_ads_clean.keywords_performance.clicks
    description: The amount of clicks.
  cost:
    lineage:
      - datalake_google_ads_clean.keywords_performance.cost
    description: The cost, in Mexico currency (peso).
  impressions:
    lineage:
      - datalake_google_ads_clean.keywords_performance.impressions
    description: The amount of impressions.
  dt_loaded:
    lineage:
      - datalake_google_ads_clean.keywords_performance.dt_loaded
    description: The load date of the keyword's performance.
  dt_created:
    lineage:
      - datalake_google_ads_clean.keywords_performance.dt_created
    description: The creation date of the keyword's performance.