database_name: datalake_mexico_google_ads
table_name: ads_performance
description: Incremental table that contains Google Ads' Ad Performance data related to the Benvi operation on Mexico.
domain: International
owner: isadora.gallerani@quintoandar.com.br
columns:
  id_ad:
    lineage:
      - datalake_google_ads_clean.ads_performance.id_ad
    description: Id of the ad, which could not be unique.
  id_external_customer:
    lineage:
      - datalake_google_ads_clean.ads_performance.id_external_customer
    description: Id of the external customer.
  id_ad_group:
    lineage:
      - datalake_google_ads_clean.ads_performance.id_ad_group
    description: Id of the ad group. 
  id_campaign:
    lineage:
      - datalake_google_ads_clean.ads_performance.id_campaign
    description: Id of the campaign.
  ad_group_name:
    lineage:
      - datalake_google_ads_clean.ads_performance.ad_group_name
    description: The name of the ad group.
  ad_type:
    lineage:
      - datalake_google_ads_clean.ads_performance.ad_type
    description: The type of the ad.
  campaign_name:
    lineage:
      - datalake_google_ads_clean.ads_performance.campaign_name
    description: The campaign name.
  description:
    lineage:
      - datalake_google_ads_clean.ads_performance.description
    description: The description of the ad's performance.
  device:
    lineage:
      - datalake_google_ads_clean.ads_performance.device
    description: The device name related to the ad's performance.
  ad_network_type:
    lineage:
      - datalake_google_ads_clean.ads_performance.ad_network_type
    description: The type of the ad's network.
  account_descriptive_name:
    lineage:
      - datalake_google_ads_clean.ads_performance.account_descriptive_name
    description: The account name related to the ad.
  report_type:
    lineage:
      - datalake_google_ads_clean.ads_performance.report_type
    description: The type of report related to the performance.
  account_snake_case:
    lineage:
      - datalake_google_ads_clean.ads_performance.account_snake_case
    description: The account name related to the ad, but in snake case.
  clicks:
    lineage:
      - datalake_google_ads_clean.ads_performance.clicks
    description: The amount of clicks.
  cost:
    lineage:
      - datalake_google_ads_clean.ads_performance.cost
    description: The cost, in Mexico currency (peso).
  impressions:
    lineage:
      - datalake_google_ads_clean.ads_performance.impressions
    description: The amount of impressions.
  dt_loaded:
    lineage:
      - datalake_google_ads_clean.ads_performance.dt_loaded
    description: The load date of the ad's performance.
  dt_created:
    lineage:
      - datalake_google_ads_clean.ads_performance.dt_created
    description: The creation date of the ad's performance.