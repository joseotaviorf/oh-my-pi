database_name: datalake_mexico_google_ads
table_name: campaigns_performance
description: Incremental table that contains Google Ads' Campaign's Performance data related to the Benvi operation on Mexico.
domain: International
owner: isadora.gallerani@quintoandar.com.br
columns:
  id_external_customer:
    lineage:
      - datalake_google_ads_clean.campaigns_performance.id_external_customer
    description: Id of the external customer.
  id_campaign:
    lineage:
      - datalake_google_ads_clean.campaigns_performance.id_campaign
    description: Id of the campaign, which could not be unique.
  campaign_name:
    lineage:
      - datalake_google_ads_clean.campaigns_performance.campaign_name
    description: The campaign name.
  ad_network_type:
    lineage:
      - datalake_google_ads_clean.campaigns_performance.ad_network_type
    description: The type of the campaign's network.
  account_descriptive_name:
    lineage:
      - datalake_google_ads_clean.campaigns_performance.account_descriptive_name
    description: The account name related to the campaign.
  labels:
    lineage:
      - datalake_google_ads_clean.campaigns_performance.labels
    description: The labels related to the campaign.
  report_type:
    lineage:
      - datalake_google_ads_clean.campaigns_performance.report_type
    description: The type of report related to the performance.
  account_snake_case:
    lineage:
      - datalake_google_ads_clean.campaigns_performance.account_snake_case
    description: The account name related to the campaign, but in snake case.
  device:
    lineage:
      - datalake_google_ads_clean.campaigns_performance.device
    description: The device name related to the campaign's performance.
  clicks:
    lineage:
      - datalake_google_ads_clean.campaigns_performance.clicks
    description: The amount of clicks.
  cost:
    lineage:
      - datalake_google_ads_clean.campaigns_performance.cost
    description: The cost, in Mexico currency (peso).
  impressions:
    lineage:
      - datalake_google_ads_clean.campaigns_performance.impressions
    description: The amount of impressions.
  month:
    lineage:
      - datalake_google_ads_clean.campaigns_performance.month
    description: The month value.
  week:
    lineage:
      - datalake_google_ads_clean.campaigns_performance.week
    description: The week value.
  year:
    lineage:
      - datalake_google_ads_clean.campaigns_performance.year
    description: The year value.
  dt_loaded:
    lineage:
      - datalake_google_ads_clean.campaigns_performance.dt_loaded
    description: The load date of the campaign's performance.
  dt_created:
    lineage:
      - datalake_google_ads_clean.campaigns_performance.dt_created
    description: The creation date of the campaign's performance.
