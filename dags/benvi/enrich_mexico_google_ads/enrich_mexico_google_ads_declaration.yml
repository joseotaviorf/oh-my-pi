dag:
  name: enrich_mexico_google_ads
  schedule_start_date: 2022, 6, 1
  documentation:
    dag_purpose: |
      This DAG retrieves Benvi's mexican marketing campaigns data from Google Ads platform.
      It uses data extracted from [ads-performance](https://github.com/quintoandar/ads-performance) extraction tool, developed by Marketing Tools team.
      Mediator triggers this DAG and loads the table via incremental load.
  owner: Data International
workflow:
  type: query
  layer: enrich
  default_extraction_type: incremental
  default_partitions: [account_snake_case, dt_loaded]
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, macros.ds_add(ds, -6), 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, ds, 'load_end_date') }}"
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: r5d.large
    node_type_id: m5d.large
    num_workers: 2
    spark_version: 13.3.x-scala2.12
