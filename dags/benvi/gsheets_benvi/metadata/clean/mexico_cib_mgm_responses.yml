database_name: datalake_gsheets_clean
table_name: mexico_cib_mgm_responses
description: Google Sheets that containing the CIBs referred by other CIBs (Member get Member) that were registered.
domain: International
owner: bruna.prates@quintoandar.com.br
columns:
  id_cib_that_referred:
    lineage:
      - datalake_gsheets_raw.member_get_member_cib_responses.id_del_cib_que_indico
    description: ID of the CIB that referred another CIB.
  id_cib_referred:
    lineage:
      - datalake_gsheets_raw.member_get_member_cib_responses.id_del_cib_referido
    description: ID of the CIB that was referred.
  name_cib_that_referred:
    lineage:
      - datalake_gsheets_raw.member_get_member_cib_responses.nombre_del_cib_que_indico
    description: Name of the CIB that referred another CIB.
  name_cib_referred:
    lineage:
      - datalake_gsheets_raw.member_get_member_cib_responses.nombre_del_cib_referido
    description: Name of the CIB that was referred.
  name_hunter:
    lineage:
      - datalake_gsheets_raw.member_get_member_cib_responses.hunter
    description: Hunter who contacted the referred CIB.
  ts_registered:
    lineage:
      - datalake_gsheets_raw.member_get_member_cib_responses.timestamp
    description: Timestamp of when the referred CIB was registered.
