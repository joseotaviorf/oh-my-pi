database_name: datalake_gsheets_clean
table_name: mexico_cib_segmentation_rules_segmentation_variables
description: Google Sheets containing the history of CIB's segmentation rules.
domain: International
owner: bruna.prates@quintoandar.com.br
columns:
  id_segmentation:
    lineage:
      - datalake_gsheets_raw.mexico_cib_segmentation_rules_segmentation_variables.id_segmentation
    description: ID of the corresponding segmentation.
  name_segmentation:
    lineage:
      - datalake_gsheets_raw.mexico_cib_segmentation_rules_segmentation_variables.name_segmentation
    description: Name of the corresponding segmentation.
  min_months_registered:
    lineage:
      - datalake_gsheets_raw.mexico_cib_segmentation_rules_segmentation_variables.min_months_registered
    description: The minimum number of months registered to comply with the rule.
  max_months_registered:
    lineage:
      - datalake_gsheets_raw.mexico_cib_segmentation_rules_segmentation_variables.max_months_registered
    description: The maximum number of months registered to comply with the rule.
  min_fl:
    lineage:
      - datalake_gsheets_raw.mexico_cib_segmentation_rules_segmentation_variables.min_value_fl
    description: The minimum quantity of FL (First Listings) to comply with the rule.
  max_fl:
    lineage:
      - datalake_gsheets_raw.mexico_cib_segmentation_rules_segmentation_variables.max_value_fl
    description: The maximum quantity of FL (First Listings) to comply with the rule.
  min_cs:
    lineage:
      - datalake_gsheets_raw.mexico_cib_segmentation_rules_segmentation_variables.min_value_cs
    description: The minimum quantity of CS (Contracts Signed) to comply with the rule.
  max_cs:
    lineage:
      - datalake_gsheets_raw.mexico_cib_segmentation_rules_segmentation_variables.max_value_cs
    description: The maximum quantity of CS (Contracts Signed) to comply with the rule.
  dt_modification:
    lineage:
      - datalake_gsheets_raw.mexico_cib_segmentation_rules_segmentation_variables.dt_modification
    description: The most recent date the corresponding segmentation rule was assigned.
