---
database_name: dw_cib_events
table_name: fact_cib_events
description: Fact table containing information about the events related to CIBs (Benvi real estate consultant). In order to get an unique line, it's necessary to add all the columns.
domain: International
owner: bruna.prates@quintoandar.com.br
columns:
  sk_cib:
    lineage:
      - datalake_mexico_cib_events.cib_events.id_cib
    description: ID of the CIB, from EBDB. It's the user external ID from Big Agent
  sk_segmentation:
    lineage:
      - datalake_mexico_cib_segmentation.cib_segmentation.id_segmentation
    description: ID of the segmentation that CIB fits into, according to the stipulated rules.
  sk_event:
    lineage:
      - datalake_mexico_cib_events.cib_events.id_event
    description: ID of the event, which can be the house listing or contract ID.
  sk_house:
    lineage:
      - datalake_mexico_cib_events.cib_events.id_house
    description: ID of the house related to the CIB.
  sk_house_listing:
    lineage:
      - datalake_mexico_cib_events.cib_events.id_house_listing
    description: ID of the house listing related to the CIB.
  sk_offer:
    lineage:
      - datalake_mexico_cib_events.cib_events.id_offer
    description: ID of the offer accepted.
  sk_contract:
    lineage:
      - datalake_mexico_cib_events.cib_events.id_contract
    description: ID of the contract signed.
  first_listings:
    lineage:
      - datalake_mexico_cib_events.cib_events.event_type
    description: Number of CIB's first listings for unique sk_cib, sk_event, sk_house, sk_house_listing, sk_offer, sk_contract and dt_event.
  offers_accepted:
    lineage:
      - datalake_mexico_cib_events.cib_events.event_type
    description: Number of CIB's offers accepted for unique sk_cib, sk_event, sk_house, sk_house_listing, sk_offer, sk_contract and dt_event.
  contracts_signed:
    lineage:
      - datalake_mexico_cib_events.cib_events.event_type
    description: Number of CIB's contracts signed for unique sk_cib, sk_event, sk_house, sk_house_listing, sk_offer, sk_contract and dt_event.
  dt_event:
    lineage:
      - datalake_mexico_cib_events.cib_events.dt_event
    description: Date of the event made by the CIB.
  year:
    lineage:
      - datalake_mexico_cib_events.cib_events.year
    description: Year of the event made by the CIB. Also, it's a partition of this table.
  month:
    lineage:
      - datalake_mexico_cib_events.cib_events.month
    description: Month of the event made by the CIB. Also, it's a partition of this table.
  day:
    lineage:
      - datalake_mexico_cib_events.cib_events.day
    description: Day of the event made by the CIB. Also, it's a partition of this table.
