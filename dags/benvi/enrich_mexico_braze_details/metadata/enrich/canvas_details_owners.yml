---
database_name: datalake_mexico_braze_details
table_name: canvas_details_owners
description: Enriched table containing information about Braze canvas related to Benvi's Owners
domain: International
owner: guilherme.dorella@quintoandar.com.br
columns:
  id_canvas:
    lineage:
      - datalake_braze_details_clean.canvas_details_owners.id_canvas
    description: The canvas ID as defined in Braze Platform.
  canvas_name:
    lineage:
      - datalake_braze_details_clean.canvas_details_owners.canvas_name
    description: The canvas name as defined in Braze Platform.
  canvas_description:
    lineage:
      - datalake_braze_details_clean.canvas_details_owners.canvas_description
    description: The canvas description as defined in Braze Platform.
  variants:
    lineage:
      - datalake_braze_details_clean.canvas_details_owners.variants
    description: Array of the paths each customer follows on their journey. Canvas supports up to eight variants in a control group.
  schedule_type:
    lineage:
      - datalake_braze_details_clean.canvas_details_owners.schedule_type
    description: Describes what triggers the canvas to be sent.
    categories:
      action_based: When a canvas is sent after a user completes a certain event.
      api_triggered: When a canvas is sent after a API trigger.
      time_based: When a canvas is sent in a scheduled time. 
  steps:
    lineage:
      - datalake_braze_details_clean.canvas_details_owners.steps
    description: Array of marketing decision points that determines the user journey. Within a step, it can be defined triggers or schedule delivery, refine targeting by adding filters or marking exception events and add channels from email to push to webhooks.
  tags:
    lineage:
      - datalake_braze_details_clean.canvas_details_owners.tags
    description: Array of tag names associated with the canvas.
  channels:
    lineage:
      - datalake_braze_details_clean.canvas_details_owners.channels
    description: Array of channels through which the canvas will be sent.
  is_archived:
    lineage:
      - datalake_braze_details_clean.canvas_details_owners.archived
    description: Boolean indicating whether the canvas is archived.
  is_draft:
    lineage:
      - datalake_braze_details_clean.canvas_details_owners.draft
    description: Boolean indicating whether the canvas is a draft.
  ts_first_entry:
    lineage:
      - datalake_braze_details_clean.canvas_details_owners.ts_first_entry
    description: Timestamp of when the canvas had its first entry.
  ts_last_entry:
    lineage:
      - datalake_braze_details_clean.canvas_details_owners.ts_last_entry
    description: Timestamp of when the canvas had its last entry.
  ts_created:
    lineage:
      - datalake_braze_details_clean.canvas_details_owners.ts_created
    description: Timestamp of when the canvas was created.
  ts_updated:
    lineage:
      - datalake_braze_details_clean.canvas_details_owners.ts_updated
    description: Timestamp of when the canvas was last updated.
  year:
    lineage:
      - datalake_braze_details_clean.canvas_details_owners.ts_updated
    description: Year of when the canvas was last updated extracted from timestamp. It's a partition key, so it's performatic to filter or join by this column.
  month:
    lineage:
      - datalake_braze_details_clean.canvas_details_owners.ts_updated
    description: Month of when the canvas was last updated extracted from timestamp. It's a partition key, so it's performatic to filter or join by this column.
  day:
    lineage:
      - datalake_braze_details_clean.canvas_details_owners.ts_updated
    description: Day of when the canvas was last updated extracted from timestamp. It's a partition key, so it's performatic to filter or join by this column.

