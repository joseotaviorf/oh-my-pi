---
database_name: datalake_mexico_braze_details
table_name: canvas_details_refiere_y_gana
description: Enriched table containing information about Refiere y Gana's Braze canvas
domain: International
owner: guilherme.dorella@quintoandar.com.br
columns:
  id_canvas:
    lineage:
      - datalake_braze_details_clean.canvas_details_indica_ai.id_canvas
    description: Canvas ID as given by the Braze Platform.
  canvas_name:
    lineage:
      - datalake_braze_details_clean.canvas_details_indica_ai.canvas_name
    description: The canvas name as defined in Braze Platform.
  canvas_description:
    lineage:
      - datalake_braze_details_clean.canvas_details_indica_ai.canvas_description
    description: The canvas description as defined in Braze Platform.
  variants:
    lineage:
      - datalake_braze_details_clean.canvas_details_indica_ai.variants
    description: The path each customer follows on their journey. Canvas supports up to eight variants with a control group.
  schedule_type:
    lineage:
      - datalake_braze_details_clean.canvas_details_indica_ai.schedule_type
    description: Describes what triggers the canvas to be sent.
    categories:
      action_based: When a canvas is sent after a user completes a certain event.
      api_triggered: When a canvas is sent after a API trigger.
      time_based: When a canvas is sent in a scheduled time. 
  steps:
    lineage:
      - datalake_braze_details_clean.canvas_details_indica_ai.steps
    description: Marketing decision point that determines the user journey. Within a step, it can be defined triggers or schedule delivery, refine targeting by adding filters or marking exception events and add channels from email to push to webhooks.
  tags:
    lineage:
      - datalake_braze_details_clean.canvas_details_indica_ai.tags
    description: The tag names associated with the canvas.
  channels:
    lineage:
      - datalake_braze_details_clean.canvas_details_indica_ai.channels
    description: Array of channels through which the canvas will be sent.
  is_archived:
    lineage:
      - datalake_braze_details_clean.canvas_details_indica_ai.archived
    description: Boolean indicating whether the canvas is archived.
  is_draft:
    lineage:
      - datalake_braze_details_clean.canvas_details_indica_ai.draft
    description: Boolean indicating whether this canvas is a draft.
  ts_first_entry:
    lineage:
      - datalake_braze_details_clean.canvas_details_indica_ai.ts_first_entry
    description: Timestamp of when the canvas has its first entry.
  ts_last_entry:
    lineage:
      - datalake_braze_details_clean.canvas_details_indica_ai.ts_last_entry
    description: Timestamp of when the canvas has its last entry.
  ts_created:
    lineage:
      - datalake_braze_details_clean.canvas_details_indica_ai.ts_created
    description: Timestamp of when the canvas was created.
  ts_updated:
    lineage:
      - datalake_braze_details_clean.canvas_details_indica_ai.ts_updated
    description: Timestamp of when the canvas was last updated.
  year:
    lineage:
      - datalake_braze_details_clean.canvas_details_indica_ai.ts_updated
    description: Year of when the canvas was last updated extracted from timestamp. It's a partition key, so it's performatic to filter or join by this column.
  month:
    lineage:
      - datalake_braze_details_clean.canvas_details_indica_ai.ts_updated
    description: Month of when the canvas was last updated extracted from timestamp. It's a partition key, so it's performatic to filter or join by this column.
  day:
    lineage:
      - datalake_braze_details_clean.canvas_details_indica_ai.ts_updated
    description: Day of when the canvas was last updated extracted from timestamp. It's a partition key, so it's performatic to filter or join by this column.
