---
database_name: datalake_mexico_braze_details
table_name: campaign_details_owners
description: Enriched table containing information about Braze campaigns related to Benvi's Owners
domain: International
owner: guilherme.dorella@quintoandar.com.br
columns:
  id_campaign:
    lineage:
      - datalake_braze_details_clean.campaign_details_owners.id_campaign
    description: The campaign ID as defined by Braze Platform.
  campaign_name:
    lineage:
      - datalake_braze_details_clean.campaign_details_owners.campaign_name
    description: The campaign name as defined by user in Braze Platform.
  campaign_description:
    lineage:
      - datalake_braze_details_clean.campaign_details_owners.campaign_description
    description: The campaign description as defined by user in Braze Platform.
  schedule_type:
    lineage:
      - datalake_braze_details_clean.campaign_details_owners.schedule_type
    description: Describes what triggers the canvas to be sent.
    categories:
      action_based: When a canvas is sent after a user completes a certain event.
      api_triggered: When a canvas is sent after a API trigger.
      time_based: When a canvas is sent in a scheduled time. 
  tags:
    lineage:
      - datalake_braze_details_clean.campaign_details_owners.tags
    description: Array of tag names associated with the campaign.
  channels:
    lineage:
      - datalake_braze_details_clean.campaign_details_owners.channels
    description: Array of channels through which the campaign will be sent.
  conversion_behaviors:
    lineage:
      - datalake_braze_details_clean.campaign_details_owners.conversion_behaviors
    description: Array with information about each conversion event behavior set for the campaign.
  messages:
    lineage:
      - datalake_braze_details_clean.campaign_details_owners.messages
    description: JSON with information about the message sent in the campaign.
  is_archived:
    lineage:
      - datalake_braze_details_clean.campaign_details_owners.archived
    description: Boolean indicating whether the campaign is archived.
  is_draft:
    lineage:
      - datalake_braze_details_clean.campaign_details_owners.draft
    description: Boolean indicating whether the campaign is a draft.
  ts_last_sent:
    lineage:
      - datalake_braze_details_clean.campaign_details_owners.ts_last_sent
    description: Timestamp of when the campaign was sent for the last time.
  ts_first_sent:
    lineage:
      - datalake_braze_details_clean.campaign_details_owners.ts_first_sent
    description: Timestamp of when the campaign was sent for the first time.
  ts_created:
    lineage:
      - datalake_braze_details_clean.campaign_details_owners.ts_created
    description: Timestamp of when the campaign was created.
  ts_updated:
    lineage:
      - datalake_braze_details_clean.campaign_details_owners.ts_updated
    description: Timestamp of when the campaign was last updated.
  year:
    lineage:
      - datalake_braze_details_clean.campaign_details_owners.ts_updated
    description: Year of when the campaign was last updated extracted from timestamp. It's a partition key, so it's performatic to filter or join by this column.
  month:
    lineage:
      - datalake_braze_details_clean.campaign_details_owners.ts_updated
    description: Month of when the campaign was last updated extracted from timestamp. It's a partition key, so it's performatic to filter or join by this column.
  day:
    lineage:
      - datalake_braze_details_clean.campaign_details_owners.ts_updated
    description: Day of when the campaign was last updated extracted from timestamp. It's a partition key, so it's performatic to filter or join by this column.
