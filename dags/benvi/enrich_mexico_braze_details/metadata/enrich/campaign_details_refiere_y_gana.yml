---
database_name: datalake_mexico_braze_details
table_name: campaign_details_refiere_y_gana
description: Enriched table containing information about Refiere y Gana's Braze campaigns
domain: International
owner: guilherme.dorella@quintoandar.com.br
columns:
  id_campaign:
    lineage:
      - datalake_braze_details_clean.campaign_details_indica_ai.id_campaign
    description: Campaign ID as given by the Braze Platform.
  campaign_name:
    lineage:
      - datalake_braze_details_clean.campaign_details_indica_ai.campaign_name
    description: The campaign name as defined in Braze Platform.
  campaign_description:
    lineage:
      - datalake_braze_details_clean.campaign_details_indica_ai.campaign_description
    description: The campaign description as defined in Braze Platform.
  schedule_type:
    lineage:
      - datalake_braze_details_clean.campaign_details_indica_ai.schedule_type
    description: Describes what triggers the campaign to be sent.
    categories:
      action_based: When a campaign is sent after a user completes a certain event.
      api_triggered: When a campaign is sent after a API trigger.
      time_based: When a campaign is sent in a scheduled time. 
  tags:
    lineage:
      - datalake_braze_details_clean.campaign_details_indica_ai.tags
    description: The tag names associated with the campaign.
  channels:
    lineage:
      - datalake_braze_details_clean.campaign_details_indica_ai.channels
    description: Array of channels through which the campaign will be sent.
  conversion_behaviors:
    lineage:
      - datalake_braze_details_clean.campaign_details_indica_ai.conversion_behaviors
    description: Array with information about each conversion event behavior set for the campaign.
  messages:
    lineage:
      - datalake_braze_details_clean.campaign_details_indica_ai.messages
    description: JSON with information about the message sent in that campaign.
  is_archived:
    lineage:
      - datalake_braze_details_clean.campaign_details_indica_ai.archived
    description: Boolean indicating whether the campaign is archived.
  is_draft:
    lineage:
      - datalake_braze_details_clean.campaign_details_indica_ai.draft
    description: Boolean indicating whether this campaign is a draft.
  ts_last_sent:
    lineage:
      - datalake_braze_details_clean.campaign_details_indica_ai.ts_last_sent
    description: Timestamp of when the campaign was sent for the last time.
  ts_first_sent:
    lineage:
      - datalake_braze_details_clean.campaign_details_indica_ai.ts_first_sent
    description: Timestamp of when the campaign was sent for the first time.
  ts_created:
    lineage:
      - datalake_braze_details_clean.campaign_details_indica_ai.ts_created
    description: Timestamp of when the campaign was created.
  ts_updated:
    lineage:
      - datalake_braze_details_clean.campaign_details_indica_ai.ts_updated
    description: Timestamp of when the campaign was last updated.
  year:
    lineage:
      - datalake_braze_details_clean.campaign_details_indica_ai.updated_at
    description: Year of when the campaign was last updated extracted from timestamp. It's a partition key, so it's performatic to filter or join by this column.
  month:
    lineage:
      - datalake_braze_details_clean.campaign_details_indica_ai.updated_at
    description: Month of when the campaign was last updated extracted from timestamp. It's a partition key, so it's performatic to filter or join by this column.
  day:
    lineage:
      - datalake_braze_details_clean.campaign_details_indica_ai.updated_at
    description: Day of when the campaign was last updated extracted from timestamp. It's a partition key, so it's performatic to filter or join by this column.