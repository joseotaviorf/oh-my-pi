dag:
  name: enrich_mexico_braze_details
  schedule_start_date: 2022, 10, 18
  documentation:
    dag_purpose: |
      This DAG creates the incremental enriched table from Braze Details clean tables, by incrementally filtering only what is related to Mexico operation.
      This DAG is triggered once per day via Mediator, after enrich_braze_details DAG.
  owner: Data International
workflow:
  type: query
  layer: enrich
  default_extraction_type: incremental
  default_partitions: [year, month, day]
cluster:
  type: databricks_13_3_min_xlarge_io-memory_cluster
