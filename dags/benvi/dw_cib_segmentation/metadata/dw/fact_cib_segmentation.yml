---
database_name: dw_cib_segmentation
table_name: fact_cib_segmentation
description: Fact table containing information about the segmentation of CIBs (Benvi real estate consultant), calculated
  according to the events made in each month since the registration (number of first listings and contracts signed).
domain: International
owner: bruna.prates@quintoandar.com.br
columns:
  pk_cib_segmentation:
    lineage:
      - datalake_mexico_cib_segmentation.cib_segmentation.id_cib
      - datalake_mexico_cib_segmentation.cib_segmentation.year
      - datalake_mexico_cib_segmentation.cib_segmentation.month
    description: Id of the CIB segmentation (generated on the query using id_cib and the start date of the month in which the CIB will be classified, separated by a dot).
  sk_cib:
    lineage:
      - datalake_mexico_cib_segmentation.cib_segmentation.id_cib
    description: ID of the CIB, from EBDB. It's the user external ID from Big Agent.
  sk_segmentation:
    lineage:
      - datalake_mexico_cib_segmentation.cib_segmentation.id_segmentation
    description: ID of the segmentation that CIB fits into, in the corresponding month (dt_month_started_segmentation), according to the stipulated rules.
  type_calculation:
    lineage:
      - datalake_mexico_cib_segmentation.cib_segmentation.type_calculation
    description: The type of calculation used in the segmentation rule to obtain CIB segmentation.
    categories:
      AVG: 'The calculation is the average occurrence of the event.'
  first_listings:
    lineage:
      - datalake_mexico_cib_segmentation.cib_segmentation.first_listings
    description: Number of CIB's first listings calculated according to the stipulated segmentation rules.
  contracts_signed:
    lineage:
      - datalake_mexico_cib_segmentation.cib_segmentation.contracts_signed
    description: Number of CIB's contracts signed calculated according to the stipulated segmentation rules.
  months_registered:
    lineage:
      - datalake_mexico_cib_segmentation.cib_segmentation.months_registered
    description: Number of months that the CIB has been registered.
  months_calculation:
    lineage:
      - datalake_mexico_cib_segmentation.cib_segmentation.months_calculation
    description: Number of months used in segmentation calculation.
  dt_month_started_segmentation:
    lineage:
      - datalake_mexico_cib_segmentation.cib_segmentation.dt_month_started_segmentation
    description: Start date of the month in which the CIB will be classified with the calculated segmentation.
  dt_started:
    lineage:
      - datalake_mexico_cib_segmentation.cib_segmentation.dt_started
    description: Start date of the period in which the events made by the CIB will be analyzed.
  dt_ended:
    lineage:
      - datalake_mexico_cib_segmentation.cib_segmentation.dt_ended
    description: End date of the period in which the events made by the CIB will be analyzed
  year:
    lineage:
      - datalake_mexico_cib_segmentation.cib_segmentation.year
    description: Year in which the CIB will be classified with the calculated segmentation. Also, it's a partition of this table.
  month:
    lineage:
      - datalake_mexico_cib_segmentation.cib_segmentation.month
    description: Month in which the CIB will be classified with the calculated segmentation. Also, it's a partition of this table.
