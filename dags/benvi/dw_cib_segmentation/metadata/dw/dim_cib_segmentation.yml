---
database_name: dw_cib_segmentation
table_name: dim_cib_segmentation
description: Dimension table containing the possible CIBs (Benvi real estate consultant) segmentations.
domain: International
owner: bruna.prates@quintoandar.com.br
columns:
  sk_segmentation:
    lineage:
      - datalake_mexico_cib_segmentation.cib_segmentation.id_segmentation
    description: ID of the possible segmentation levels that CIBs can fits into, according to the stipulated rules.
  segmentation_name:
    lineage:
      - datalake_mexico_cib_segmentation.cib_segmentation.segmentation
    description: The possible segmentation levels that CIBs can fits into, according to the stipulated rules.
    categories:
      Elite: 'CIB that had an average of 5 or more FL and an average of 1 or more CS in the period analyzed for calculation.'
      Plus: 'CIB that had an average FL greater than 1 in the period analyzed for calculation. Or also the CIB that has been registered for 2 months or less.'
      Inter: 'CIB that had an average FL less than or equal to 1 in the period analyzed for calculation.'
  dt_last_segmentation:
    lineage:
      - datalake_mexico_cib_segmentation.cib_segmentation.dt_month_started_segmentation
    description: The most recent date the corresponding segmentation was assigned.
  year:
    lineage:
      - datalake_mexico_cib_segmentation.cib_segmentation.dt_month_started_segmentation
    description: Year of the most recent date the corresponding segmentation was assigned. Also, it's a partition of this table.
  month:
    lineage:
      - datalake_mexico_cib_segmentation.cib_segmentation.dt_month_started_segmentation
    description: Month of the most recent date the corresponding segmentation was assigned. Also, it's a partition of this table.
