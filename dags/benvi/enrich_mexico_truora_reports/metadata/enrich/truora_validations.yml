---
database_name: datalake_mexico_truora_reports
table_name: truora_validations
description: This table contains information about the validations provided by Truora for KYC (Know Your Client) process.
domain: International
owner: bruna.prates@quintoandar.com.br
columns:
  id_account:
    lineage:
      - datalake_arquivo_confidencial_clean.truora_check_process_aud.payload
    description: ID related to the report of the user. It can be joined with datalake_mexico_truora_reports.truora_user.
  id_validation:
    lineage:
      - datalake_arquivo_confidencial_clean.truora_check_process_aud.payload
    description: ID related to the user validation report, i.e., it's unique per request.
  validation_type:
    lineage:
      - datalake_arquivo_confidencial_clean.truora_check_process_aud.payload
    description: Type of validation applied.
    categories:
      document-validation: Validation is applied to the user document.
      face-recognition: Validation is applied to perform user facial recognition.
      phone-verification: Validation is applied to verify the user's phone.
  validation_status:
    lineage:
      - datalake_arquivo_confidencial_clean.truora_check_process_aud.payload
    description: Status of the validation applied.
    categories:
      success: Validation returned a success result.
      failure: Validation returned a failure result.
      pending: Validation is pending.
  current_step_type:
    lineage:
      - datalake_arquivo_confidencial_clean.truora_check_process_aud.payload
    description: When the validation status is failed, it indicates the type of current step to be performed.
  failure_type:
    lineage:
      - datalake_arquivo_confidencial_clean.truora_check_process_aud.payload
    description: When the validation status is failed, it indicates the type of failure.
  failure_reason:
    lineage:
      - datalake_arquivo_confidencial_clean.truora_check_process_aud.payload
    description: When the validation status is failed, it indicates the reason of failure.
  final_status:
    lineage:
      - datalake_arquivo_confidencial_clean.truora_check_process_aud.status
    description: Final status of user validations.
  final_result:
    lineage:
      - datalake_arquivo_confidencial_clean.truora_check_process_aud.result
    description: Final result of the user based on all validations applied.
  ts_report:
    lineage:
      - datalake_arquivo_confidencial_clean.rev_info.ts_created
    description: Timestamp of when the report was provided.
  year:
    lineage:
      - datalake_arquivo_confidencial_clean.rev_info.year
    description: Year of when the report was provided. Also, it's a partition of this table.
  month:
    lineage:
      - datalake_arquivo_confidencial_clean.rev_info.month
    description: Month of when the report was provided. Also, it's a partition of this table.
  day:
    lineage:
      - datalake_arquivo_confidencial_clean.rev_info.day
    description: Day of when the report was provided. Also, it's a partition of this table.
