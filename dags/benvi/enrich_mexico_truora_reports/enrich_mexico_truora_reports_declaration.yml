dag:
  name: enrich_mexico_truora_reports
  schedule_start_date: 2024,2,1
  owner: Data International
  documentation:
    dag_purpose: "This DAG consolidates the Troura's reports."
workflow:
  type: query_delta
  layer: enrich
  default_extraction_type: incremental
  default_partitions:
    - year
    - month
    - day
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, macros.ds_add(ds, 1), 'load_end_date') }}"
cluster:
  type: databricks_13_3_med_mem_driver_min_memory_2_nodes_cluster
