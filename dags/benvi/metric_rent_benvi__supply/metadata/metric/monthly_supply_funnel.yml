database_name: metric_rent_benvi
table_name: monthly_supply_funnel
description: This table contains monthly metrics related to Benvi Mexico's Rent Supply
  funnel.
domain: Benvi
owner: data-international@quintoandar.com.br
columns:
  country_code:
    lineage:
    - datalake_region.city_groups_per_periods.country_code
    description: Country code of the lead origin. Also, it's a partition for this
      table.
  city_group:
    lineage:
    - datalake_region.city_groups_per_periods.city_group
    description: City group of the lead origin.
  supply_mkt_origin:
    lineage:
    - datalake_mexico_rent_supply.coincident_funnel.supply_mkt_origin
    description: Origin of the lead in the marketing funnel.
  supply_mkt_origin_detailed:
    lineage:
    - datalake_mexico_rent_supply.coincident_funnel.supply_mkt_origin_detailed
    description: Marketing origin detailed of the lead.
  mexico_channel:
    lineage:
    - datalake_mexico_rent_supply.coincident_funnel.mexico_channel
    description: Name of the marketing channel on the Mexico operation.
  dt_month_started:
    lineage:
    - datalake_region.city_groups_per_periods.dt_month_started
    description: Date of the month start based on the lead creation.
  actual_cost:
    description: Actual total budget cost.
  actual_cost_comission:
    description: Comission's actual budget cost.
  aq2o_coincident:
    description: Available qualified to opportunity coincident "conversion".
  available_qualifieds:
    description: Volume of available qualifieds.
  available_qualifieds_targets:
    description: Volume of available qualified targets.
  budget_comission_target:
    description: Comission's actual budget target volume.
  budget_target:
    description: Actual budget target volume without comission.
  budget_total_target:
    description: Actual total budget target volume.
  cost:
    description: Actual budget cost without comission cost.
  first_listings:
    description: Volume of first listings.
  first_listings_targets:
    description: Volume of first listings target.
  l2p_coincident:
    description: Lead to prospect coincident "conversion".
  leads:
    description: Volume of leads.
  leads_targets:
    description: Volume of leads targets.
  leads_ub_human_crawlers:
    description: Volume of leads from human crawlers' unbounce page.
  leads_ub_i24:
    description: Volume of leads from Navent's/i24's unbounce page.
  leads_ub_owner_mx:
    description: Volume of leads from Mexico's Landing Owner unbounce page.
  o2fl_coincident:
    description: Opportunity to first listing coincident "conversion".
  ongoing_listings:
    description: Ongoing listings volume.
  opportunities:
    description: Volume of opportunities.
  opportunities_targets:
    description: Volume of opportunities targets.
  p2fl_coincident:
    description: Prospect to first listing coincident "conversion".
  p2q_coincident:
    description: Prospect to qualified coincident "conversion".
  prospects:
    description: Volume of prospects.
  prospects_targets:
    description: Volume of prospects targets.
  q2aq_coincident:
    description: Qualified to available qualified coincident "conversion".
  q2fl_coincident:
    description: Qualified to first listing coincident "conversion".
  q2o_coincident:
    description: Qualified to opportunity coincident "conversion".
  qualifieds:
    description: Volume of qualifieds.
  qualifieds_targets:
    description: Volume of qualifieds targets.
