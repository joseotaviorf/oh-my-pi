    metric:
      name: Opportunities
      description: Total volume of opportunites.
      acronym: O
      is_additive: True
      business_stage: Supply
      hierarchy: Operations Mgmt
      approved_by: laura.theotonio@quintoandar.com.br
      link_to_metric: 'https://metabase.quintoandar.com.br/question/60980-60980-actual-supply'
  first_listings:
    description: Volume of first listings.
    metric:
      name: First Listings
      description: Total volume of first listings.
      acronym: FL
      is_additive: True
      business_stage: Supply
      hierarchy: Operations Mgmt
      approved_by: laura.theotonio@quintoandar.com.br
      link_to_metric: 'https://metabase.quintoandar.com.br/question/60980-60980-actual-supply'
  l2p_coincident:
