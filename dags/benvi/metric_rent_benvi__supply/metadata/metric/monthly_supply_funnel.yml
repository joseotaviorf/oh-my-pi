database_name: metric_rent_benvi
table_name: monthly_supply_funnel
description: This table contains monthly metrics related to Benvi Mexico's Rent Supply
  funnel.
domain: Benvi
owner: data-international@quintoandar.com.br
columns:
  country_code:
    lineage:
      - datalake_region.city_groups_per_periods.country_code
    description: Country code of the lead origin. Also, it's a partition for this
      table.
    dimension: True
  city_group:
    lineage:
      - datalake_region.city_groups_per_periods.city_group
    description: City group of the lead origin.
    dimension: True
  supply_mkt_origin:
    lineage:
      - datalake_mexico_rent_supply.coincident_funnel.supply_mkt_origin
    description: Origin of the lead in the marketing funnel.
    dimension: True
  supply_mkt_origin_detailed:
    lineage:
      - datalake_mexico_rent_supply.coincident_funnel.supply_mkt_origin_detailed
    description: Marketing origin detailed of the lead.
    dimension: True
  mexico_channel:
    lineage:
      - datalake_mexico_rent_supply.coincident_funnel.mexico_channel
    description: Name of the marketing channel on the Mexico operation.
    dimension: True
  leads:
    description: Volume of leads.
    metric:
      name: Leads
      description: Total volume of leads.
      acronym: L
      is_additive: True
      business_stage: Supply
      hierarchy: Operations Mgmt
      approved_by: laura.theotonio@quintoandar.com.br
      link_to_metric: 'https://metabase.quintoandar.com.br/question/60980-60980-actual-supply'
  prospects:
    description: Volume of prospects.
    metric:
      name: Prospects
      description: Total volume of prospects.
      acronym: P
      is_additive: True
      business_stage: Supply
      hierarchy: Operations Mgmt
      approved_by: laura.theotonio@quintoandar.com.br
      link_to_metric: 'https://metabase.quintoandar.com.br/question/60980-60980-actual-supply'
  qualifieds:
    description: Volume of qualifieds.
    metric:
      name: Qualifieds
      description: Total volume of qualifieds.
      acronym: Q
      is_additive: True
      business_stage: Supply
      hierarchy: Operations Mgmt
      approved_by: laura.theotonio@quintoandar.com.br
      link_to_metric: 'https://metabase.quintoandar.com.br/question/60980-60980-actual-supply'
  available_qualifieds:
    description: Volume of available qualifieds.
    metric:
      name: Available Qualifieds
      description: Total volume of available qualifieds.
      acronym: AQ
      is_additive: True
      business_stage: Supply
      hierarchy: Operations Mgmt
