---
dag:
  name: enrich_mexico_cib_segmentation
  schedule_start_date: 2022, 5, 1
  owner: Data International
  documentation:
    dag_purpose: |
      This DAG has the goal to create the CIB's segmentation.
      This DAG is triggered daily, via Mediator and incremental load.
workflow:
  type: query
  layer: enrich
  default_extraction_type: incremental
  default_partitions:
    - year
    - month
  short_circuit_customization:
    function: CHECK_IS_SPECIFIC_DAY_OF_MONTH
    execution_date: "{{ macros.ds_add(ds, 1) }}"
    function_params:
      day: 1
cluster:
  type: databricks_13_3_min_fixed_workers_general_cluster
