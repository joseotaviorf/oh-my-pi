dag:
  name: enrich_mexico_marketing_automatic_daily_costs
  schedule_start_date: 2022, 6, 1
  documentation:
    dag_purpose: |
      This DAG generates the Benvi's Mexico operation automatic costs (i.e. gathered from medias API/Crawlers) combined with the taxonomy tables and saves its part in the final Fact Marketing Daily Costs aside Enrich Mexico Marketing Manual Daily Costs.
      This is the [pipeline draw](https://www.figma.com/file/2FgsVbpgwtEmnn9RzbYZEU/Mexico-Marketing-Costs-Pipeline?node-id=0-1&t=L4OLMNfrjwCA3tfm-0]) related to the mexican marketing costs pipeline.
      Mediator triggers this DAG and loads the table via incremental load.
  owner: Data International
workflow:
  type: query
  layer: enrich
  custom_schema: mexico_marketing_costs
  default_extraction_type: incremental
  default_partitions: [id_date, flow_type]
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, macros.ds_add(ds, -6), 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, ds, 'load_end_date') }}"
cluster:
  type: databricks_13_3_med_general_3_nodes_cluster
