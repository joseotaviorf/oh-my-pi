database_name: metric_rent_benvi
table_name: weekly_demand_funnel
description: This table contains the base information about Benvi Mexico's Rent Demand
  funnel, based on a weekly view.
domain: Benvi
owner: data-international@quintoandar.com.br
columns:
  country_code:
    lineage:
    - datalake_region.region.country_code
    description: Country code of the region. Also, it's a partition for this table.
  city_group:
    lineage:
    - datalake_region.region.country_name
    description: City group of the region.
  dt_weekly_started:
    lineage:
    - datalake_region.city_groups_per_periods.dt_weekly_started
  actual_cost:
    description: Weekly budget actual cost.
  budget_target:
    description: Weekly budget target volume.
  contracts_signed:
    description: Volume of contracts signed.
  contracts_signed_target:
    description: Contracts signed target volume.
  credits_approved:
    description: Volume of credits approved.
  credits_approved_target:
    description: Credits approved target volume.
  dt_week_started:
    description: Date of the week start.
  new_tenant_prospects:
    description: Volume of new tenant prospects.
  offers_accepted:
    description: Volume of offers accepted.
  offers_accepted_target:
    description: Offers accepted target volume.
  offers_submitted:
    description: Volume of offers submitted.
  offers_submitted_target:
    description: Offers submitted target volume.
  tenant_prospects:
    description: Volume of tenant prospects.
  visits_booked:
    description: Volume of visits booked.
  visits_booked_target:
    description: Visits booked target volume.
  visits_completed:
    description: Volume of visits completed.
  visits_completed_target:
    description: Visits completed target volume.
