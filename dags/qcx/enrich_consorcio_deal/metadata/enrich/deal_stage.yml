---
database_name: datalake_consorcio
table_name: deal_stage
owner: carlos.procha@quintoandar.com.br
domain: QCX
description: >
  Consórcio CRM deal stage visits for deals in datalake_consorcio.deal.
  Grain is one row per deal entering a pipeline stage (id_deal, id_stage,
  ts_entered). Inner-joined to the deal master so the population matches
  unique Consórcio pipeline 737631007 deals. Path table for Funil Cohort
  rollup in datalake_consorcio.deal_milestone. HubSpot deal_stage is the
  upstream. ts_entered / ts_exited are converted to America/Sao_Paulo.
  Partitioned by local ts_entered. Full rebuild daily.
columns:
  id_deal:
    lineage:
      - datalake_consorcio.deal.id_deal
      - datalake_hubspot.deal_stage.id_deal
    description: CRM deal identifier; joins to datalake_consorcio.deal.id_deal.
  id_pipeline:
    lineage:
      - datalake_hubspot.deal_stage.id_pipeline
    description: Funnel / pipeline identifier the stage belongs to (Consórcio 737631007).
  id_stage:
    lineage:
      - datalake_hubspot.deal_stage.id_stage
    description: Stage identifier within the pipeline.
  id_actor:
    lineage:
      - datalake_hubspot.deal_stage.id_user_updated_by
    description: >
      HubSpot owner id of the actor that moved the deal into this stage when the
      change was user-driven (e.g. CRM_UI); joins to datalake_hubspot.owner.id_owner.
      Null for automation/integration changes. Owner name/email are PII-encrypted
      in Trino, so no display label is materialized.
  uuid_lead:
    lineage:
      - datalake_consorcio.deal.uuid_lead
    description: Consórcio lead UUID from the deal master; joins to datalake_consorcio_clean.lead.uuid.
  pipeline_name:
    lineage:
      - datalake_hubspot.pipeline.label
    description: Human-readable pipeline name.
  stage_name:
    lineage:
      - datalake_hubspot.stage.label
    description: Human-readable stage name (e.g. Simulação, Venda fechada).
  change_source:
    lineage:
      - datalake_hubspot.deal_stage.source_type
    description: How the stage change was triggered (e.g. CRM_UI, API, AUTOMATION_PLATFORM, IMPORT).
  ts_entered:
    lineage:
      - datalake_hubspot.deal_stage.ts_stage_started
    description: Timestamp when the deal entered this stage, converted from HubSpot UTC to America/Sao_Paulo.
  ts_exited:
    lineage:
      - datalake_hubspot.deal_stage.ts_stage_ended
    description: Timestamp when the deal left this stage, converted from HubSpot UTC to America/Sao_Paulo; null if still current.
  year:
    description: Partition column — calendar year of ts_entered.
  month:
    description: Partition column — calendar month of ts_entered.
  day:
    description: Partition column — calendar day of ts_entered.
