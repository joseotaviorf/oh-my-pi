dag:
  name: consorcio
  schedule_start_date: 2025, 7, 25
  schedule_interval: 0 1 * * *
  owner: QCX
  documentation:
    dag_purpose: |
      Ingest the S3 data from consorcio and clean them for the datalake
workflow:
  type: cdc
  layer: raw
  database_type: postgres
  source_schema: public
  dbutils_secret_key: CONSORCIO_DB
  tables_customization:
