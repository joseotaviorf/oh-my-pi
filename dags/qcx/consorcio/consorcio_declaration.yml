    #   clean_table_name: consorciado
    # consorciado_quota:
    #   clean_table_name: consorciado_quota
    lead:
      clean_table_name: lead
    # order:
    #   clean_table_name: order
    # order_item:
    #   clean_table_name: order_item
    product:
      clean_table_name: product
cluster:
  type: databricks_13_3_med_general_cluster
