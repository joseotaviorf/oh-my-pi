---
table_name: datalake_consorcio.lead_scoring_population
alert_channel: "#alerts-de-airflow-dags"
table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error
column_level_validations:
  id_deal:
    is_complete:
      severity_level: Error
  one_row_per_deal_and_spec_version:
    custom:
      # Grain is (id_deal, spec_version); partitions coexist. is_unique on
      # id_deal would fail as soon as a second spec is written.
      constraint: |-
        (SELECT COUNT(*)
         FROM (
           SELECT 1
           FROM datalake_consorcio.lead_scoring_population
           GROUP BY id_deal, spec_version
           HAVING COUNT(*) > 1
         )) = 0
      severity_level: Error
  outcome:
    is_complete:
      severity_level: Error
    is_contained_in:
      values: [won, lost, cancelled, open]
      severity_level: Error
  host_name:
    is_complete:
      severity_level: Error
    is_contained_in:
      values: [blip, platconv]
      severity_level: Error
  spec_version:
    is_complete:
      severity_level: Error
  number_of_messages:
    is_complete:
      severity_level: Error
  ts_first_stage:
    is_complete:
      severity_level: Error
