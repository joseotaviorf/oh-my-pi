dag:
  name: enrich_lead_scoring
  schedule_interval: null
  schedule_start_date: 2026, 8, 1
  owner: QCX
  catchup: false
  documentation:
    dag_purpose: |
      Materializes datalake_consorcio.lead_scoring_population: the labelled deal
      population used to develop the Consórcio Behavioral Lead Scoring scorecard.

      Grain is one deal (id_deal); one lead may have several deals. The table holds
      identity, the target label, the handoff population filter, the temporal cutoff
      used by every feature, and the exclusion flags. Conversation features are NOT
      here — they live in a separate table built on top of this one.

      Reads datalake_consorcio.deal (entity, current_stage, ts_lead_created),
      datalake_consorcio.deal_milestone (ts_handoff), and
      datalake_consorcio.deal_stage (other first-hit timestamps, already
      America/Sao_Paulo). Does not convert clocks. Grain matches deal (tests
      and duplicates already dropped).

      Design decisions worth knowing before changing this DAG:

        - Partitioned by spec_version, written with dynamic partition overwrite. Each
          run rebuilds exactly one partition and leaves the others untouched, so
          several populations coexist and an analysis can stay pinned to the one it
          was run against. Re-running the same spec_version is idempotent, which keeps
          retries cheap; bump the version when the spec itself changes, not when a
          build fails.

        - Every row of a partition is rewritten, never appended. Labels mutate: outcome
          flips from open to won/lost, ts_handoff gets filled later, and maturity
          advances with the calendar. An append-only load would freeze stale labels.

        - schedule_interval is explicitly null, not omitted. Omitting it makes the DAG
          fall back to dataset_dependencies and auto-trigger on upstream updates, which
          would defeat the frozen-population intent. During the analysis phase a pinned
          snapshot is worth more than a fresh one: an automatic rebuild would move the
          numbers under the analysis. Add a cron later, if the scorecard reaches
          production and needs monitoring.

        - floor_date scopes the population and is part of its identity, together with
          spec_version. Analysis parameters that are NOT part of that identity — the
          maturity window, the exclusion flags — are deliberately left unapplied here
          and filtered at read time, so changing one does not require a rebuild.

        - ts_handoff is copied from datalake_consorcio.deal_milestone, which fills
          HubSpot skip-steps forward. Null ts_handoff means the lead was handled
          by a human from the beginning; those rows stay in the table. A value
          means the handoff happened, so is_handoff is not stored.

      Parameters (override via DAG conf):
        spec_version         population identifier; also the partition key
        floor_date           earliest ts_first_stage admitted into the population
        platconv_start_date  first day of the Conversational Platform era (host_name)
workflow:
  type: query_delta
  layer: enrich
  custom_schema: consorcio
  default_extraction_type: incremental
  default_partitions: [spec_version]
  extra_query_template_params:
    spec_version: "{{ dag_run.conf.get('spec_version', 1) if dag_run else 1 }}"
    floor_date: "{{ dag_run.conf.get('floor_date', '2025-09-01') if dag_run else '2025-09-01' }}"
    platconv_start_date: "{{ dag_run.conf.get('platconv_start_date', '2026-07-20') if dag_run else '2026-07-20' }}"
