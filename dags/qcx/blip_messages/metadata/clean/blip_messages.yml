---
database_name: datalake_consorcio_clean
table_name: blip_messages
owner: carlos.procha@quintoandar.com.br
domain: QCX
description: >
  Curated Consórcio Blip WhatsApp chat messages for analytical consumers
  (Trino/Superset). Grain is one row per id_message. Schema aligned with
  datalake_consorcio.chat_messages (id_lead, id_bsp, id_crm, id_message,
  host_name, role, content, ts_created, partitions); no id_session because
  Blip JSONL has no Copilot session. id_bsp is the Blip tunnel identity
  (same semantic as chat_messages). Producer raw id_lead is mixed (numeric
  lead.id or lead.uuid); clean id_lead is always bigint lead.id, resolved
  from producer first then the Blip identity bridge (tunnel → WhatsApp
  contact), which reads contact_property via lead.id_contact and falls back
  to the frozen lead_external_data bsp columns for pre-contact-identity
  history. WhatsApp contact and S3 provenance stay out of clean.
  Insert-only MERGE on id_message; empty id_message excluded.
columns:
  id_lead:
    lineage:
      - datalake_consorcio_raw.blip_messages.id_lead
      - datalake_consorcio_clean.lead.id
      - datalake_consorcio_clean.lead.id_contact
      - datalake_consorcio_clean.contact_property.id_contact
      - datalake_consorcio_clean.contact_property.property_value
      - datalake_consorcio_clean.contact_property.property_key
      - datalake_consorcio_clean.lead_external_data.id_bsp_conversation
      - datalake_consorcio_clean.lead_external_data.id_bsp_contact
    description: >
      Consórcio lead primary key (lead.id, bigint). From producer when raw
      id_lead is numeric, or via lead.uuid when raw id_lead is a UUID; otherwise
      from the Blip identity bridge (tunnel then WhatsApp contact), which reads
      contact_property via lead.id_contact and falls back to the frozen
      lead_external_data bsp columns for pre-contact-identity history. Null when
      unresolved.
  id_bsp:
    lineage:
      - datalake_consorcio_raw.blip_messages.id_tunnel
    description: >
      Blip tunnel / conversation identity ({uuid}@tunnel.msging.net); same
      semantic as datalake_consorcio.chat_messages.id_bsp. Null when the
      conversation is WhatsApp-contact-only.
  id_crm:
    lineage:
      - datalake_consorcio_raw.blip_messages.id_crm
      - datalake_consorcio_clean.lead_external_data.id_crm
      - datalake_consorcio_clean.lead_external_data.id_lead
    description: >
      HubSpot CRM deal id paired with the winning id_lead enrichment source,
      looked up on lead_external_data by id_lead (crm_id is not a
      contact_property key); null when no CRM link exists.
  id_message:
    lineage:
      - datalake_consorcio_raw.blip_messages.id_message
    description: >
      Blip message unique id; stable merge key across backfill and incremental.
  host_name:
    lineage:
      - datalake_consorcio_raw.blip_messages.host_name
    description: Blip bot host name (conrado for this export).
  role:
    lineage:
      - datalake_consorcio_raw.blip_messages.role
    description: Message author role lowercased (human, ai, or attendant).
  content:
    lineage:
      - datalake_consorcio_raw.blip_messages.content
    description: Message body text; HSM templates may be JSON-serialized payloads.
  ts_created:
    lineage:
      - datalake_consorcio_raw.blip_messages.ts_created
    description: Message creation timestamp in UTC from Blip.
  year:
    lineage:
      - datalake_consorcio_raw.blip_messages.ts_created
    description: Partition column — calendar year of ts_created.
  month:
    lineage:
      - datalake_consorcio_raw.blip_messages.ts_created
    description: Partition column — calendar month of ts_created.
  day:
    lineage:
      - datalake_consorcio_raw.blip_messages.ts_created
    description: Partition column — calendar day of ts_created.
