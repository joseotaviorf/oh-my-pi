dag:
  name: blip_messages
  schedule_start_date: 2026, 3, 1
  schedule_interval: 0 */6 * * *
  owner: QCX
  catchup: false
  documentation:
    dag_purpose: |
      Ingests Consórcio Blip WhatsApp chat JSONL from the data-science S3 bucket
      into datalake_consorcio_raw.blip_messages (backfill + incremental), then
      indexes curated rows into datalake_consorcio_clean.blip_messages for
      Trino/Superset consumers (raw remains Databricks-only by design).

      Sources (prod bucket data-science.s3.data.quintoandar.com.br):
        - backfill: consorcio/blip/consorciois/backfill/{from_unix}_{to_unix}/batch_*.jsonl
        - incremental: consorcio/blip/consorciois/incremental/{job_start_unix}.jsonl

      Ops artifacts ignored: done.jsonl, errors.jsonl, _SUCCESS (backfill);
      watermark.json, *.errors.jsonl (incremental).

      Row dedupe: within each JSONL, keep the latest ts_created per id_message
      before MERGE; across files, insert-only MERGE on id_message (Blip unique
      id). First ingested row wins; overlapping backfill/incremental exports
      cannot duplicate messages. Clean MERGE source is collapsed to one row
      per id_message with ROW_NUMBER after lead lookups (Delta rejects
      duplicate source keys even on insert-only MERGE).

      File ledger: datalake_consorcio_raw.blip_messages_ingest_files tracks each
      processed S3 object (success/failed + etag). Incremental LIST uses StartAfter
      the max successful job_start_unix. Backfill lists batch_*.jsonl via boto3 and
      skips files already successful in the ledger. The CLI owns when files appear;
      this DAG only records whether each file was ingested. Partial file failures
      fail the Airflow task. Ledger loss triggers a safe full re-scan (still no
      message dupes via id_message).

      Clean schema aligned with datalake_consorcio.chat_messages
      (id_lead, id_bsp, id_crm, id_message, host_name, role, content,
      ts_created, partitions; no id_session). id_bsp is the Blip tunnel
      identity. Producer raw id_lead is mixed (numeric lead.id or UUID);
      clean resolves bigint id_lead from producer first, then the Blip
      identity bridge (tunnel → contact): contact_property via
      lead.id_contact, falling back to the frozen lead_external_data bsp
      columns. WhatsApp contact and S3/ops
      columns stay in raw only. Indexes raw rows with ts_load >=
      load_start_date (default 7 days; override via DAG conf). Insert-only
      merge on id_message; empty id_message excluded.

      Schedule: every 6 hours (America/Sao_Paulo). Manual trigger remains available.

      Urgency: source objects may expire; run promptly while backfill windows are
      still present.

workflow:
  layer: raw
  type: custom_ingestion
  custom_schema: consorcio
  load_spark_job: load_blip_messages_raw
  default_extraction_type: full
  default_partitions: [year, month, day]
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, -7), 'load_start_date') }}"
  spark_job_arguments:
    - "{environment}"
    - "{bucket}"
    - "{schema}"
    - "{table_name}"
    - "{partitions}"
    - "{{ dag_run.run_id if dag_run else 'manual' }}"
  tables_customization:
    blip_messages:
      clean_table_name: blip_messages
      partitions: [year, month, day]
      clean_partitions: [year, month, day]
      merge_on: [id_message]
      when_matched_update_condition: "FALSE"
