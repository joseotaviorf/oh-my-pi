database_name: datalake_insider_clean
table_name: user_revision_entity
description: >
  One row per audit revision entry in the Insider platform, linking a data change
  to the user who triggered it and the timestamp of the revision. Used to attribute
  Hibernate Envers audit revisions (referenced by review_aud.rev) to specific users
  for traceability. Source system is Insider.
domain: For Sale
owner: guilherme.rocha@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_insider_raw.user_revision_entity.id
    description: Revision sequence number that links to the rev field in audit tables (e.g., review_aud.rev).
  id_user:
    lineage:
      - datalake_insider_raw.user_revision_entity.user_id
    description: Identifier of the Insider platform user who triggered the data change recorded in this revision.
  ts_revised:
    lineage:
      - datalake_insider_raw.user_revision_entity.timestamp
    description: Timestamp when the revision was created, converted from Unix milliseconds to datetime (yyyy-MM-dd HH:mm:ss).
  op_cdc:
    lineage:
      - datalake_insider_raw.user_revision_entity.op_cdc
    description: CDC operation type captured by Debezium change-data-capture stream.
    categories:
      r: Read/snapshot - initial load of existing records.
      c: Create - new record inserted.
      u: Update - existing record modified.
      d: Delete - record removed.
  ts_cdc_transaction:
    lineage:
      - datalake_insider_raw.user_revision_entity.ts_cdc_transaction
    description: Wall-clock timestamp when the CDC connector captured this change event (millisecond precision).
  ts_database_transaction:
    lineage:
      - datalake_insider_raw.user_revision_entity.ts_database_transaction
    description: Timestamp of the originating database transaction in the source application before CDC propagation.
