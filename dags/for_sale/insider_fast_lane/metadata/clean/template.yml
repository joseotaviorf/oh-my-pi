database_name: datalake_insider_clean
table_name: template
description: >
  One row per review template configured in the Insider platform. Templates define the
  structure and type of evaluation to be applied, grouping features and resources for
  a specific review context. Only active templates are used to generate new reviews.
  Source system is Insider.
domain: For Sale
owner: guilherme.rocha@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_insider_raw.template.id
    description: Unique identifier for the review template in the Insider platform.
  is_active:
    lineage:
      - datalake_insider_raw.template.active
    description: Boolean flag indicating whether this template is currently active and available to generate new reviews.
  type:
    lineage:
      - datalake_insider_raw.template.type
    description: Type of review template, classifying the evaluation context or methodology it is designed for (e.g., peer review, quality audit).
  op_cdc:
    lineage:
      - datalake_insider_raw.template.op_cdc
    description: CDC operation type captured by Debezium change-data-capture stream.
    categories:
      r: Read/snapshot - initial load of existing records.
      c: Create - new record inserted.
      u: Update - existing record modified.
      d: Delete - record removed.
  ts_cdc_transaction:
    lineage:
      - datalake_insider_raw.template.ts_cdc_transaction
    description: Wall-clock timestamp when the CDC connector captured this change event (millisecond precision).
  ts_database_transaction:
    lineage:
      - datalake_insider_raw.template.ts_database_transaction
    description: Timestamp of the originating database transaction in the source application before CDC propagation.
