database_name: datalake_insider_clean
table_name: resource
description: >
  Lookup table with one row per evaluable resource defined in the Insider platform.
  Resources represent the entities being reviewed (e.g., support agents, teams, or
  service areas) and are referenced by review templates and individual review records.
  Source system is Insider.
domain: For Sale
owner: guilherme.rocha@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_insider_raw.resource.id
    description: Unique identifier for the evaluable resource in the Insider platform.
  name:
    lineage:
      - datalake_insider_raw.resource.name
    description: Internal name of the resource as registered in Insider (e.g., agent group name or service area label).
  translations:
    lineage:
      - datalake_insider_raw.resource.translations
    description: JSON map of locale-to-label translations for the resource name, supporting multilingual display in review interfaces.
  op_cdc:
    lineage:
      - datalake_insider_raw.resource.op_cdc
    description: CDC operation type captured by Debezium change-data-capture stream.
    categories:
      r: Read/snapshot - initial load of existing records.
      c: Create - new record inserted.
      u: Update - existing record modified.
      d: Delete - record removed.
  ts_cdc_transaction:
    lineage:
      - datalake_insider_raw.resource.ts_cdc_transaction
    description: Wall-clock timestamp when the CDC connector captured this change event (millisecond precision).
  ts_database_transaction:
    lineage:
      - datalake_insider_raw.resource.ts_database_transaction
    description: Timestamp of the originating database transaction in the source application before CDC propagation.
