database_name: datalake_casa_mineira_crm_clean
table_name: origin_contact
domain: For Sale
columns:
  id:
    lineage:
    - datalake_casa_mineira_crm_raw.contato_origem.id
    description: Surrogate primary key of the origin contact row in the source system.
  origin_contact_name:
    lineage:
    - datalake_casa_mineira_crm_raw.contato_origem.nome
    description: Display name of the contact origin source.
  origin_contact_slug_name:
    lineage:
    - datalake_casa_mineira_crm_raw.contato_origem.slug
    description: URL-friendly slug identifier for the contact origin source.
  ts_created:
    lineage:
    - datalake_casa_mineira_crm_raw.contato_origem.criado_em
    description: Timestamp when the row was first created in the source operational system.
  ts_disabled:
    lineage:
    - datalake_casa_mineira_crm_raw.contato_origem.desativado_em
    description: Timestamp when the contact origin source was deactivated.
owner: guilherme.rocha@quintoandar.com.br
description: Cleaned snapshot of origin contact sourced from operational systems backing Casa Mineira CRM partner data for For Sale brokerage and franchise operations. One row per origin contact record with standardized names and types in datalake_casa_mineira_crm_clean.
