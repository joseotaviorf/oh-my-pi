database_name: datalake_casa_mineira_crm_clean
table_name: media_contact
domain: For Sale
columns:
  id:
    lineage:
    - datalake_casa_mineira_crm_raw.contato_midia.id
    description: Surrogate primary key of the media contact row in the source system.
  media_contact_name:
    lineage:
    - datalake_casa_mineira_crm_raw.contato_midia.nome
    description: Display name of the media channel that originated the contact.
  media_contact_slug_name:
    lineage:
    - datalake_casa_mineira_crm_raw.contato_midia.slug
    description: URL-friendly slug identifier for the media channel.
  ts_created:
    lineage:
    - datalake_casa_mineira_crm_raw.contato_midia.criado_em
    description: Timestamp when the row was first created in the source operational system.
  ts_disabled:
    lineage:
    - datalake_casa_mineira_crm_raw.contato_midia.desativado_em
    description: Timestamp when the media channel was deactivated.
owner: guilherme.rocha@quintoandar.com.br
description: Cleaned snapshot of media contact sourced from operational systems backing Casa Mineira CRM partner data for For Sale brokerage and franchise operations. One row per media contact record with standardized names and types in datalake_casa_mineira_crm_clean.
