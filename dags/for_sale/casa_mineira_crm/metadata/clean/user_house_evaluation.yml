database_name: datalake_casa_mineira_crm_clean
table_name: user_house_evaluation
domain: For Sale
columns:
  id:
    lineage:
    - datalake_casa_mineira_crm_raw.usuario_avaliacao_imovel.id
    description: Surrogate primary key of the user house evaluation row in the source system.
  id_house:
    lineage:
    - datalake_casa_mineira_crm_raw.usuario_avaliacao_imovel.imovel_id
    description: Foreign key to the property listing involved in the visit or transaction.
  evaluated_by:
    lineage:
    - datalake_casa_mineira_crm_raw.usuario_avaliacao_imovel.avaliado_por
    description: Identifier of the user (agent) who performed the property valuation.
  created_by:
    lineage:
    - datalake_casa_mineira_crm_raw.usuario_avaliacao_imovel.criado_por
    description: Identifier of the user who created this property evaluation record.
  evaluation_sale_price:
    lineage:
    - datalake_casa_mineira_crm_raw.usuario_avaliacao_imovel.preco_avaliacao
    description: Sale price estimated for the property in this evaluation.
  ts_created:
    lineage:
    - datalake_casa_mineira_crm_raw.usuario_avaliacao_imovel.criado_em
    description: Timestamp when the row was first created in the source operational system.
owner: guilherme.rocha@quintoandar.com.br
description: Cleaned snapshot of user house evaluation sourced from operational systems backing Casa Mineira CRM partner data for For Sale brokerage and franchise operations. One row per user house evaluation record with standardized names and types in datalake_casa_mineira_crm_clean.
