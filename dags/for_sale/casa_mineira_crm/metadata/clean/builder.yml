database_name: datalake_casa_mineira_crm_clean
table_name: builder
domain: For Sale
columns:
  id:
    lineage:
    - datalake_casa_mineira_crm_raw.construtora.id
    description: Surrogate primary key of the builder row in the source system.
  builder_name:
    lineage:
    - datalake_casa_mineira_crm_raw.construtora.nome
    description: Name of the real-estate builder or development company.
  builder_slug_name:
    lineage:
    - datalake_casa_mineira_crm_raw.construtora.slug
    description: URL-friendly slug identifier derived from the builder name.
  ts_created:
    lineage:
    - datalake_casa_mineira_crm_raw.construtora.criado_em
    description: Timestamp when the row was first created in the source operational system.
  ts_deleted:
    lineage:
    - datalake_casa_mineira_crm_raw.construtora.deletado_em
    description: Timestamp when the builder record was soft-deleted in the source system.
owner: guilherme.rocha@quintoandar.com.br
description: Cleaned snapshot of builder sourced from operational systems backing Casa Mineira CRM partner data for For Sale brokerage and franchise operations. One row per builder record with standardized names and types in datalake_casa_mineira_crm_clean.
