dag:
  name: reverse_rent_listings_report_load
  schedule_start_date: 2024,1,1
  owner: Data ForSale
  documentation:
    dag_purpose: This DAG collects several events from listings (focused on For Rent Listings). These tables will be used in the DAG reverse_rent_listings_report_access to be sent via SNS to a service called "Member's Area", where they will be displayed as an analytical report for Agents and Brokers partners.
workflow:
  type: load
  layer: reverse
  custom_schema: listings_report
  default_extraction_type: incremental
  default_partitions: ["year", "month", "day"]
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
cluster:
  type: databricks_12_2_med_general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}