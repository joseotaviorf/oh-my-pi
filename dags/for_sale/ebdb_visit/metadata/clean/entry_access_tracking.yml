database_name: datalake_ebdb_clean
table_name: entry_access_tracking
owner: guilherme.rocha@quintoandar.com.br
domain: For Sale
description: Change history of entry-access configuration per house in EBDB. Each row logs who changed access settings and the before/after payload for audit and support analysis.
