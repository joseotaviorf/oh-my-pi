database_name: datalake_ebdb_clean
table_name: visit_fitting
domain: For Sale
columns:
  id:
    description: Surrogate primary key of the visit fitting row in EBDB.
    lineage:
    - datalake_ebdb_raw.VisitFitting.id
  id_visit:
    description: Foreign key referencing visit in the visit scheduling domain.
    lineage:
    - datalake_ebdb_raw.VisitFitting.fitted_visit_id
  id_visitor:
    description: Foreign key referencing visitor in the visit scheduling domain.
    lineage:
    - datalake_ebdb_raw.VisitFitting.visitor_id
  id_house:
    description: Foreign key referencing house in the visit scheduling domain.
    lineage:
    - datalake_ebdb_raw.VisitFitting.house_id
  begin_slot:
    description: Attribute begin slot for the visit fitting entity sourced from EBDB visit services.
    lineage:
    - datalake_ebdb_raw.VisitFitting.begin_slot
  end_slot:
    description: Attribute end slot for the visit fitting entity sourced from EBDB visit services.
    lineage:
    - datalake_ebdb_raw.VisitFitting.end_slot
  business_context:
    description: Business line of the booking, distinguishing For Rent versus For Sale flows.
    lineage:
    - datalake_ebdb_raw.VisitFitting.business_context
  intention:
    description: Attribute intention for the visit fitting entity sourced from EBDB visit services.
    lineage:
    - datalake_ebdb_raw.VisitFitting.intention
  status:
    description: Operational status code of the booking or visit in EBDB at this revision.
    lineage:
    - datalake_ebdb_raw.VisitFitting.status
  channel:
    description: Attribute channel for the visit fitting entity sourced from EBDB visit services.
    lineage:
    - datalake_ebdb_raw.VisitFitting.channel
  request_context:
    description: Attribute request context for the visit fitting entity sourced from EBDB visit services.
    lineage:
    - datalake_ebdb_raw.VisitFitting.request_context
  dt_visit:
    description: Calendar date of visit for this visit-domain record.
    lineage:
    - datalake_ebdb_raw.VisitFitting.visit_date
  ts_expiration:
    description: Timestamp of expiration as recorded in the EBDB operational database.
    lineage:
    - datalake_ebdb_raw.VisitFitting.expiration_date
  ts_created:
    description: Timestamp when the row was created in the EBDB operational database.
    lineage:
    - datalake_ebdb_raw.VisitFitting.criadoEm
  ts_updated:
    description: Timestamp when the row was last updated in the EBDB operational database.
    lineage:
    - datalake_ebdb_raw.VisitFitting.atualizadoEm
owner: guilherme.rocha@quintoandar.com.br
description: Matches visitors to consolidated visits and houses during visit fitting workflows in EBDB. One row per fitting record linking demand participants to visit instances.
