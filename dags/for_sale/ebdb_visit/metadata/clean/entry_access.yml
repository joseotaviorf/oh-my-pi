database_name: datalake_ebdb_clean
table_name: entry_access
owner: guilherme.rocha@quintoandar.com.br
domain: For Sale
description: Configured entry-access rules per house in EBDB (lockbox, keys, concierge, etc.). One row per access setup used by scheduling and check-in flows for property visits.
columns:
  id:
    description: Surrogate primary key of the entry access row in EBDB.
    lineage:
    - datalake_ebdb_raw.EntryAccess.id
  id_house:
    description: Foreign key referencing house in the visit scheduling domain.
    lineage:
    - datalake_ebdb_raw.EntryAccess.house_id
  access_model:
    description: High-level entry model such as owner present, lockbox, or front desk.
    lineage:
    - datalake_ebdb_raw.EntryAccess.access_model
  access_type:
    description: Specific access mechanism configured for the property entry.
    lineage:
    - datalake_ebdb_raw.EntryAccess.access_type
  access_code:
    description: Code or credential reference used to unlock the property when applicable.
    lineage:
    - datalake_ebdb_raw.EntryAccess.access_code
  access_details:
    description: Additional structured instructions for completing property entry.
    lineage:
    - datalake_ebdb_raw.EntryAccess.access_details
  location:
    description: Physical location hint for keys, lockbox, or concierge contact.
    lineage:
    - datalake_ebdb_raw.EntryAccess.location
  ts_created:
    description: Timestamp when the row was created in the EBDB operational database.
    lineage:
    - datalake_ebdb_raw.EntryAccess.created_at
  ts_updated:
    description: Timestamp when the row was last updated in the EBDB operational database.
    lineage:
    - datalake_ebdb_raw.EntryAccess.updated_at
