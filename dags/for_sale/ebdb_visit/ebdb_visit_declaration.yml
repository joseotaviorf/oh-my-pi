dag:
  name: ebdb_visit
  schedule_start_date: 2024,01,01
  schedule_interval: 10 21,8,12 * * *
  owner: Data ForSale
  documentation:
    dag_purpose: |
      Dag containing all tables from the Visits context.
workflow:
  type: cdc
  layer: raw
  database_type: mysql
  source_database: ebdb
  source_schema: ebdb
  custom_schema: ebdb
  tables_customization:
    AppointmentChangeReasonCategory:
      clean_table_name: appointment_change_reason_category
    HorarioSemanalImovel:
      clean_table_name: house_weekly_schedule
    HorarioSemanalImovel_AUD:
      clean_table_name: house_weekly_schedule_aud
    HouseVisitStatus_AUD:
      clean_table_name: house_visit_status_aud
    Agendamento_AUD:
      clean_table_name: booking_aud
    MudancaStatusAgendamento:
      clean_table_name: booking_status_change
    Entrance:
      clean_table_name: entrance
    EntryAccessTracking:
      clean_table_name: entry_access_tracking
      clean_primary_keys: [id]
    EntryAccess:
      clean_table_name: entry_access
      clean_primary_keys: [id]
    FollowUpDetails:
      clean_table_name: follow_up_details
    Imovel_informacoesVisita:
      raw_primary_keys: [Imovel_id, informacoesVisita]
      clean_table_name: house_visit_information
      clean_primary_keys: [id_house, visit_information]
    Imovel_informacoesVisita_AUD:
      clean_table_name: house_visit_information_aud
    KeyHolder:
      clean_table_name: key_holder
      clean_primary_keys: [id]
    UserVisitPreferences:
      clean_table_name: user_visit_preferences
    UserVisitPreferences_AUD:
      clean_table_name: user_visit_preferences_aud
    Visita_AUD:
      clean_table_name: visit_aud
      clean_primary_keys: [id_visit, rev]
    VisitFitting:
      clean_table_name: visit_fitting
    Visitor:
      clean_table_name: visitor
    Visitor_AUD:
      clean_table_name: visitor_aud
  extra_query_template_params:
    load_end_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, 1), 'load_end_date') }}"
