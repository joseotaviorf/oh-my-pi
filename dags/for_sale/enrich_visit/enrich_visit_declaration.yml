dag:
    name: enrich_visit
    owner: Data ForSale
    schedule_start_date: 2024, 1, 1
    documentation:
        dag_purpose: Full load of the context `Visit` models into Enrich with data from ebdb.
workflow:
    type: query_delta
    layer: enrich
    inner_dependencies:
        post_visit_demand:
        - visit_status_events
        post_visit_agent_unified:
        - visit_status_events
        visit_cancellation_unified:
        - visit_status_events
        visit_origin_unified:
        - visit_status_events
        visits:
        - visit_cancellation_unified
        - post_visit_agent_unified
        - visit_origin_unified
        - visit_status_events
        visit_schedules:
        - visit_cancellation_unified
        - post_visit_agent_unified
        - visit_status_events
    execution_timeout_hours: 3
    tables_customization:
        visit_fitting:
            extraction_type: incremental
            partitions: [year, month, day]
            z_order_by: [id, status]
            merge_on: [id]

cluster:
    type: custom_cluster
    custom_configurations:
        driver_node_type_id: r5.2xlarge
        node_type_id: c5.12xlarge
        num_workers: 8
        spark_version: 16.4.x-scala2.12
        single_user_name: "{{ var.value.databricks_single_user_name }}"
        data_security_mode: USER_ISOLATION
        spark_conf:
            spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
    access_control_list:
        group_name: analytics-engineers
        permission_level: CAN_MANAGE
    databricks_conn_id: databricks_new_env
