dag:
    name: enrich_visit
    owner: Data ForSale
    schedule_start_date: 2024, 1, 1
    documentation:
      dag_purpose: Full load of the context `Visit` models into Enrich with data from ebdb.
workflow:
    type: query_delta
    layer: enrich
    tables_customization:
        visit_fitting:
            extraction_type: incremental
            partitions: [year, month, day]
            z_order_by: [id, status]
            merge_on: [id]
cluster:
    type: databricks_12_2_med_general_photon_cluster
    access_control_list:
        group_name: analytics-engineers
        permission_level: CAN_MANAGE
