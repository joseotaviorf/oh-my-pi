dag:
    name: enrich_visit
    owner: Data ForSale
    criticality: High
    sla_deadline_localtime: "08:00"
    schedule_start_date: 2024, 1, 1
    documentation:
        dag_purpose: Full load of the context `Visit` models into Enrich with data from ebdb.
workflow:
    type: query_delta
    layer: enrich
    inner_dependencies:
        post_visit_demand:
        - visit_status_events
        post_visit_agent_unified:
        - visit_status_events
        visit_cancellation_unified:
        - visit_status_events
        visit_origin_unified:
        - visit_status_events
        visits:
        - visit_cancellation_unified
        - post_visit_agent_unified
        - visit_origin_unified
        - visit_status_events
        visit_schedules:
        - visit_cancellation_unified
        - post_visit_agent_unified
        - visit_status_events
    execution_timeout_hours: 3
    tables_customization:
        visit_fitting:
            extraction_type: incremental
            partitions: [year, month, day]
            z_order_by: [id, status]
            merge_on: [id]

