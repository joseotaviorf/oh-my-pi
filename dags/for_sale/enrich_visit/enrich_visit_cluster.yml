cluster:
  type: emr_7_12_consolidation_m_general_fleet_cluster
  custom_configurations:
    master_node_type_id: r6g.2xlarge
    core_nodes:
      target_on_demand: 3
      target_spot: 0
      instance_types:
      - m6g.2xlarge
      - m7g.2xlarge
    spark_conf:
      spark.driver.memory: 6g
      spark.driver.memoryOverhead: 2g
      spark.executor.memory: 10g
      spark.executor.memoryOverhead: 1g
      spark.executor.cores: "3"