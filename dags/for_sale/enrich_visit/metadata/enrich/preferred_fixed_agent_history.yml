database_name: datalake_visit
table_name: preferred_fixed_agent_history
description: This data model is about the history of preferred fixed agent for each visitor.
  Each row is an event of preferred fixed agent of each visitor.
domain: For Sale
owner: guilherme.rocha@quintoandar.com.br
columns:
  id_pfa_history:
    lineage:
      - datalake_ebdb_clean.user_visit_preferences.id_user
      - datalake_ebdb_clean.user.id
      - datalake_ebdb_clean.preferred_fixed_agent_aud.rev
    description: Primary Key of table.
  id_visitor:
    lineage:
      - datalake_ebdb_clean.user_visit_preferences.id_user
    description: ID of visitor.
  id_user_agent:
    lineage:
      - datalake_ebdb_clean.user.id
    description: ID of agent (from user).
  business_context:
    lineage:
      - datalake_ebdb_clean.preferred_fixed_agent.business_context
    description: Business context of preferred fixed agent.
  origin:
    lineage:
      - datalake_ebdb_clean.preferred_fixed_agent.origin
    description: Origin of preferred fixed agent.
  is_enabled:
    lineage:
      - datalake_ebdb_clean.preferred_fixed_agent_aud.is_enabled
    description: True when the preferred fixed agent of visitor is enabled at a given time.
  ts_started:
    lineage:
      - datalake_ebdb_clean.preferred_fixed_agent_aud.rev
    description: When the event started.
  ts_ended:
    lineage:
      - datalake_ebdb_clean.preferred_fixed_agent_aud.rev
    description: When the event ended.
