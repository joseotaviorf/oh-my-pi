database_name: datalake_visit
table_name: visits
description: Information about Rent and Sale visits.
  Each row is an unique visit with the most important information's.
domain: For Sale
owner: matheus.sampaio@quintoandar.com.br
columns:
  id_visit:
    lineage:
      - datalake_ebdb_clean.visit.id
    description: Visit ID for connection to the Visit table
  id_agent:
    lineage:
      - datalake_ebdb_clean.visit.id_agent
    description: Agent user who is following the visit.
  id_visitor:
    lineage:
      - datalake_ebdb_clean.visit.id_visitor
    description: User id of the user is visiting the house.
  id_owner:
    lineage:
      - datalake_ebdb_listing.house.id_user
    description: User ID of the property owner
  id_house:
    lineage:
      - datalake_ebdb_clean.visit.id_house
    description: Id of the house of interest
  id_house_listing:
    lineage:
      - datalake_ebdb_listing.house_listing.id_house_listing
    description: House listing ID
  id_rent_flow:
    description: Id for Rent Flow connection
  id_sale_flow:
    description: Id for Sale Flow connection, junction of visitor with house
  id_company_supply:
    lineage:
      - datalake_ebdb_listing.house_listing.id_company_hubspot
    description: Id of the supply partner in HubSpot
  uuid_company_supply:
    lineage:
      - datalake_ebdb_listing.house_listing.uuid_company
    description: UUID of the supply partner in the company domain
  id_company_demand:
    lineage:
      - datalake_ebdb_work_contract.work_contract.id_company_hubspot
    description: ID of the demand partner from Hubspot.
  id_follow_up:
    description: ID for visit's follow up
  id_entrance_type:
    lineage:
      - datalake_ebdb_clean.entrance.id
    description: ID to know how was the entrance.
  id_first_associated_agent:
    lineage:
      - datalake_ebdb_clean.visit_aud.id_agent
    description: First id_agent associated with visit.
  id_last_associated_agent:
    lineage:
      - datalake_ebdb_clean.visit_aud.id_agent
    description: Last id_agent associated with visit.
  id_user_visit_request:
    lineage:
      - datalake_ebdb_clean.visit_status_log.id_author_user
    description: ID of user who requested the visit.
  code:
    lineage:
      - datalake_ebdb_clean.visit.code
    description: Code for usage in the S&S.
  country_code:
    lineage:
      - datalake_ebdb_listing.house_listing.country_code
    description: Country code.
  type:
    lineage:
      - datalake_ebdb_clean.visit.type
    description: Country code.
  partner_3p_supply:
    lineage:
      - datalake_ebdb_listing.house.partner_3p_supply
    description: Supply partner name
  partner_3p_demand:
    lineage:
      - datalake_ebdb_work_contract.work_contract.3p_partner
    description: Demand partner name
  status:
    lineage:
      - datalake_ebdb_clean.visit.status
    description: Simple last status from Visit.
  computed_status:
    lineage:
      - datalake_ebdb_clean.visit.computed_status
    description: Last computed status from Visit, has to be almost the same of status
  behavior:
    lineage:
      - datalake_ebdb_clean.visit.behavior
    description: What the step of behavior is this visit.
  first_event:
    lineage:
      - datalake_ebdb_clean.visit_status_log.event_type
    description: First event computed from VSL.
  last_event:
    lineage:
      - datalake_ebdb_clean.visit_status_log.event_type
    description: Last event computed from VSL.
    categories:
      ASSISTED_ENTRANCE: When a third person is needed to enter.
      EASY_ENTRANCE: When no third person is needed to enter.
      NOT_CLASSIFIED: Unmapped case.
  slot:
    lineage:
      - datalake_ebdb_clean.visit.slot
    description: Slot is used to take the day of visit.
  slot_count:
    lineage:
      - datalake_ebdb_clean.visit.slot_count
    description: Number of available slots to visit.
  business_context:
    description: Which is the context of this visit.
  booking_type:
    lineage:
      - datalake_ebdb_clean.visit.booking_type
    description: Type of the booking
  business_model:
    lineage:
      - datalake_visit.visit_business_model.business_model
    description: Identify the business model of the visit.
  business_model_supply:
    lineage:
      - datalake_visit.visit_business_model.business_model
    description: Identify if the business model of supply is 1P or 3P.
  business_model_demand:
    lineage:
      - datalake_visit.visit_business_model.business_model
    description: Identify if the business model of demand (agent) is 1P or 3P.
  default_timezone:
    lineage:
      - datalake_ebdb_clean.country.default_timezone
    description: What is the default timezone for this region.
  cancellation_reason:
    lineage:
      - datalake_visit.visit_cancellation_unified.reason
    description: What the reason for the cancellation of this visit.
  cancellation_on_behalf_of:
    lineage:
      - datalake_visit.visit_cancellation_unified.on_behalf_of
    description: In whose name that cancellation status.
  cancellation_channel:
    lineage:
      - datalake_visit.visit_cancellation_unified.cancellation_channel
    description: What the channel for the cancellation of this visit.
  cancellation_author_role:
    lineage:
      - datalake_visit.visit_cancellation_unified.author_user_role
    description: Role of user who cancelled the visit.
  unsuccessful_reason:
    lineage:
      - datalake_visit.post_visit_agent_unified.reason
    description: Reason of visit unsuccessful.
  visit_model:
    description: Visit model of the visit.
    categories:
      REGISTERED: When the visit is registered after after it has occurred
      FITTED: When the visit is fitted. It is already confirmed
      STANDARD: When the visit follows the standard flow
  visit_schedule_type:
    lineage:
      - datalake_ebdb_clean.visit.ts_visit
      - datalake_ebdb_clean.visit_aud.ts_visit
    description: Type of visit schedule based on the time of first schedule and last schedule.
    categories:
      NOT_CHANGED: When the schedule has not been changed (first = last)
      POSTPONED: When the visit was postponed (last > first)
      EARLY: When the visit was earlier (last < first)
  visit_request_channel:
    lineage:
      - datalake_visit.visit_origin_unified.visit_request_channel
    description: Channel when the visit was requested.
  visit_request_on_behalf_of:
    lineage:
      - datalake_ebbd_clean.visit_status_log.on_behalf_of
    description: On whose behalf the request was made.
  visit_request_user_role:
    lineage:
      - datalake_ebbd_clean.visit_status_log.author_user_role
    description: Role of user who requested the visit.
  first_supply_answer_channel:
    lineage:
      - datalake_ebdb_clean.visit_status_log.channel
    description: Channel when owner answer the confirmation for the first time.
  first_supply_answer:
    lineage:
      - datalake_ebdb_clean.visit_status_log.event_type
    description: First confirmation response from owner.
    categories:
      ANSWER_CONFIRMED: Owner confirmed the visit.
      ANSWER_REJECTED: Owner rejected the visit.
  first_tenant_living_answer_channel:
    lineage:
      - datalake_ebdb_clean.visit_status_log.channel
    description: Channel when tenant living answer the confirmation for the first time.
  visit_first_confirmed_channel:
    lineage:
      - datalake_ebdb_clean.visit_status_log.channel
    description: Channel when the visit was confirmed for the first time.
  visit_first_confirmed_user_role:
    lineage:
      - datalake_ebdb_clean.visit_status_log.channel
    description: Role of user who is related to the first visit confirmation.
  first_tenant_livign_answer:
    lineage:
      - datalake_ebdb_clean.visit_status_log.event_type
    description: First confirmation response from tenant living.
    categories:
      ANSWER_CONFIRMED: Tenant living confirmed the visit.
      ANSWER_REJECTED: Tenant living rejected the visit.
  nbr_reschedule:
    description: Number of rescheduling.
  nbr_agent:
    description: Number of agents associated with visit.
  journey_days:
    description: Days until the actual status.
  hours_waiting_for_answers:
    description: Time in hours, spent waiting answers.
  days_waiting_for_answers:
    description: Days until receive the answers.
  has_more_one_agent:
    description: True when the visit has more than one associated agent.
  is_confirmed:
    description: If the visit was confirmed by all.
  is_registered:
    description: If the visit was registered by the agent.
  is_completed:
    description: If the visit is completed.
  is_reschedule:
    description: If this visit is a reschedule.
  is_canceled:
    description: If this visit is canceled.
  is_unsuccessful:
    description: If this visit return unsuccessful.
  is_stalled:
    description: If the visit is stalled.
  is_registered_by_agent:
    description: If the visit was registered by agent.
  is_3p_demand:
    lineage:
      - datalake_visit.visit_business_model.business_model
    description: If this visit is by 3p demand.
  is_3p_supply:
    lineage:
      - datalake_visit.visit_business_model.business_model
    description: If this visit is by 3p supply.
  is_fixed_agent:
    lineage:
      - datalake_visit.preferred_fixed_agent_history.id_pfa_history
    description: True when the visit was requested with the visitor's preferred fixed agent.
  has_finisher_status:
    description: True when the visit has a finisher status.
  has_fup_collected:
    description: True when the visit has a follow up collected.
  has_tenant_living:
    description: If has tenant living in the property.
  is_waiting_for_response:
    description: If this visit is waiting for some response.
  has_entrance_problem:
    description: If this visit has entrance problem.
  has_supply_answered:
    description: If the supply answered (Property's Owner).
  has_supply_confirmed:
    description: If the supply confirmed (Property's Owner).
  has_tenant_answered:
    description: If the tenant answered (If exists).
  has_tenant_confirmed:
    description: If the tenant confirmed (If exists).
  is_cancelled_by_expiration:
    lineage:
      - datalake_visit.visit_cancellation_unified.is_cancelled_by_expiration
    description: True if the visit was cancelled due to expired time.
  has_unsuccessful_demand_attended:
    lineage:
      - datalake_visit.post_visit_agent_unified.has_demand_attended
    description: True if demand (visitor) attended the visit.
  has_unsuccessful_agent_attended:
    lineage:
      - datalake_visit.post_visit_agent_unified.has_agent_attended
    description: True if agent attended the visit.
  has_unsuccessful_supply_attended:
    lineage:
      - datalake_visit.post_visit_agent_unified.has_supply_attended
    description: True if supply (owner) attended the visit.
  dt_visit:
    lineage:
      - datalake_ebdb_clean.visit.dt_visit
    description: Date of visit.
  ts_visit_local_tz:
    lineage:
      - datalake_ebdb_clean.visit.dt_visit
    description: Timestamp of when the visit will happen converted to local timezone.
  ts_created:
    lineage:
      - datalake_ebdb_clean.visit.ts_created
    description: Timestamp of visit creating
  ts_updated:
    lineage:
      - datalake_ebdb_clean.visit.ts_updated
    description: Timestamp of visit updating
  ts_visit:
    lineage:
      - datalake_ebdb_clean.visit.ts_visit
    description: Timestamp of visit
  ts_first_event:
    lineage:
      - datalake_ebdb_clean.visit_status_log.ts_created
    description: Timestamp with the first status of this visit.
  ts_last_event:
    lineage:
      - datalake_ebdb_clean.visit_status_log.ts_created
    description: Timestamp with the last status of this visit.
  ts_visit_requested:
    lineage:
      - datalake_visit.visit_origin_unified.ts_visit_requested
    description: Timestamp with the requested date of this visit.
  ts_visit_registered:
    lineage:
      - datalake_ebdb_clean.visit_status_log.ts_created
    description: Timestamp with the registered date of this visit.
  ts_visit_first_rescheduled:
    lineage:
      - datalake_ebdb_clean.visit_status_log.ts_created
    description: Timestamp with the first reschedule date of this visit.
  ts_visit_rescheduled:
    lineage:
      - datalake_ebdb_clean.visit_status_log.ts_created
    description: Timestamp with the last rescheduled date of this visit.
  ts_visit_supply_answer:
    lineage:
      - datalake_ebdb_clean.visit_status_log.ts_created
    description: Timestamp with the supply (owner) answer date of this visit.
  ts_visit_demand_answer:
    lineage:
      - datalake_ebdb_clean.visit_status_log.ts_created
    description: Timestamp with the demand answer date of this visit.
  ts_visit_agent_answer:
    lineage:
      - datalake_ebdb_clean.visit_status_log.ts_created
    description: Timestamp with the agent answer date of this visit.
  ts_visit_tenant_answer:
    lineage:
      - datalake_ebdb_clean.visit_status_log.ts_created
    description: Timestamp with the tenant answer date of this visit.
  ts_visit_supply_confirmed:
    lineage:
      - datalake_ebdb_clean.visit_status_log.ts_created
    description: Timestamp with the supply (owner) confirmed date of this visit.
  ts_visit_demand_confirmed:
    lineage:
      - datalake_ebdb_clean.visit_status_log.ts_created
    description: Timestamp with the demand confirmed date of this visit.
  ts_visit_agent_confirmed:
    lineage:
      - datalake_ebdb_clean.visit_status_log.ts_created
    description: Timestamp with the agent confirmed date of this visit.
  ts_visit_tenant_confirmed:
    lineage:
      - datalake_ebdb_clean.visit_status_log.ts_created
    description: Timestamp with the tenant confirmed date of this visit.
  ts_visit_confirmed:
    lineage:
      - datalake_ebdb_clean.visit_status_log.ts_created
    description: Timestamp with the confirmation date of this visit.
  ts_visit_first_confirmed:
    description: Timestamp with the first confirmation of this visit.
  ts_visit_last_confirmed:
    lineage:
      - datalake_ebdb_clean.visit_status_log.ts_created
    description: Timestamp with the last confirmation of this visit.
  ts_visit_fup_collected:
    lineage:
      - datalake_ebdb_clean.visit_status_log.ts_created
    description: Timestamp with the follow up collected date of this visit.
  ts_visit_canceled:
    lineage:
      - datalake_visit.visit_cancellation_unified.ts_created
    description: Timestamp with the canceled date of this visit.
  ts_visit_done:
    lineage:
      - datalake_ebdb_clean.visit_status_log.ts_created
    description: Timestamp with the done date of this visit.
  ts_visit_unsuccessful:
    lineage:
      - datalake_ebdb_clean.visit_status_log.ts_created
    description: Timestamp with the unsuccessful date of this visit.
  ts_visit_stalled:
    lineage:
      - datalake_ebdb_clean.visit_status_log.ts_created
    description: Timestamp when the visit was stalled.
  ts_first_visit:
    lineage:
      - datalake_ebdb_clean.visit_aud.ts_visit
    description: Timestamp when the visit was first scheduled.
