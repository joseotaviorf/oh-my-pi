database_name: datalake_visit
table_name: visits
description: Information about Rent and Sale visits. Each row is an unique visit with the most important information's.
domain: For Sale
owner: guilherme.rocha@quintoandar.com.br
columns:
  id_visit:
    lineage:
    - datalake_ebdb_clean.visit.id
    description: Visit ID for connection to the Visit table. Data since 2015.
  id_last_schedule:
    lineage:
    - datalake_visit.visit_status_events.id_schedule
    - datalake_ebdb_clean.booking.id
    description: Last schedule ID of the visit. Data since 2015.
  id_visit_cycle:
    lineage:
      - datalake_ebdb_clean.visit.id_visitor
      - datalake_ebdb_clean.visit.id_house
      - datalake_visit.visit_cancellation_unified.ts_created
      - datalake_visit.post_visit_agent_unified.ts_post_visit_agent
    description: Cycle ID of the visit. Data since 2015.
  id_visit_attempt_cycle:
    lineage:
      - datalake_ebdb_clean.visit.id_visitor
      - datalake_ebdb_clean.visit.id_house
      - datalake_visit.visit_cancellation_unified.ts_created
      - datalake_visit.post_visit_agent_unified.ts_post_visit_agent
    description: Try cycle ID of the visit. Data since 2015.
  id_agent:
    lineage:
    - datalake_ebdb_clean.visit.id_agent
    description: Agent user who is following the visit. Data since 2015.
  id_visitor:
    lineage:
    - datalake_ebdb_clean.visit.id_visitor
    description: User id of the user is visiting the house. Data since 2015.
  id_owner:
    lineage:
    - datalake_ebdb_listing.house.id_user
    description: User ID of the property owner. Data since 2015.
  id_house:
    lineage:
    - datalake_ebdb_clean.visit.id_house
    description: Id of the house of interest. Data since 2015.
  id_house_listing:
    lineage:
    - datalake_ebdb_listing.house_listing.id_house_listing
    description: House listing ID. Data since 2015.
  id_rent_flow:
    description: Id for Rent Flow connection
  id_sale_flow:
    description: Id for Sale Flow connection, junction of visitor with house
  sk_broker_supply:
    lineage:
    - datalake_visit.visit_business_model.sk_broker_supply
    description: Surrogate key of the supply-side broker (core_brokers) when the business model implies 3P supply. From visit_business_model.
  sk_broker_demand:
    lineage:
    - datalake_visit.visit_business_model.sk_broker_demand
    description: Surrogate key of the demand-side broker (core_brokers) when the business model implies 3P demand or lead gen. From visit_business_model.
  id_company_supply:
    lineage:
    - datalake_visit.visit_business_model.id_company_supply
    description: ID of the supply partner from the company domain. Obtained from visit_business_model which consolidates supply partner data. Data since 2020.
  uuid_company_supply:
    lineage:
    - datalake_ebdb_listing.house_listing.uuid_company
    description: UUID of the supply partner in the company domain. Data since 2016.
  id_company_demand:
    lineage:
    - datalake_visit.visit_business_model.id_company_demand
    description: ID of the demand partner from Hubspot. Obtained from visit_business_model which consolidates demand partner data. Data since 2023.
  id_follow_up:
    description: ID for visit's follow up.
  id_first_associated_agent:
    lineage:
    - datalake_ebdb_clean.visit_aud.id_agent
    description: First id_agent associated with visit. Data since 2015.
  id_last_associated_agent:
    lineage:
    - datalake_ebdb_clean.visit_aud.id_agent
    description: Last id_agent associated with visit. Data since 2015.
  id_user_agent_vbba:
    lineage:
    - datalake_visit.visit_status_events.id_user_agent_vbba
    description: ID of user who is related to the VBBA schedule. Data since 2025-11.
  id_user_visit_request:
    lineage:
    - datalake_visit.visit_status_events.id_author_user
    description: ID of user who requested the visit. Data since 2015.
  code:
    lineage:
    - datalake_ebdb_clean.visit.code
    description: Code of visit. Data since 2015.
  country_code:
    lineage:
    - datalake_ebdb_listing.house_listing.country_code
    description: Country code. Data since 2015.
  type:
    lineage:
    - datalake_ebdb_clean.visit.type
    description: Type of visit. Data since 2015.
  partner_3p_supply:
    lineage:
    - datalake_visit.visit_business_model.partner_3p_supply
    description: Supply partner name. Obtained from visit_business_model which consolidates supply partner data. Data since 2020.
  partner_3p_demand:
    lineage:
    - datalake_visit.visit_business_model.partner_3p_demand
    description: Demand partner name. Obtained from visit_business_model which consolidates demand partner data. Data since 2023.
  is_3p_supply:
    lineage:
    - datalake_visit.visit_business_model.is_3p_supply
    description: Boolean flag indicating if the visit has 3P supply partner. Obtained from visit_business_model. Data since 2020.
  is_3p_demand:
    lineage:
    - datalake_visit.visit_business_model.is_3p_demand
    description: Boolean flag indicating if the visit has 3P demand partner. Obtained from visit_business_model. Data since 2020.
  is_3p_lead_gen:
    lineage:
    - datalake_visit.visit_business_model.is_3p_lead_gen
    description: Boolean flag indicating if the visit has 3P lead generation partner. Obtained from visit_business_model. Data since 2020.
  has_3p_access_control:
    lineage:
    - datalake_visit.visit_business_model.has_3p_access_control
    description: Boolean flag indicating if the visit has any 3P access control (supply, demand, or lead gen). Obtained from visit_business_model. Data since 2020.
  status:
    lineage:
    - datalake_ebdb_clean.visit.status
    description: Simple last status from Visit. Data since 2015.
  computed_status_unified:
    lineage:
    - datalake_ebdb_clean.visit.computed_status
    - datalake_ebdb_clean.booking.status
    description: Computed status unified from Visit. Data since 2015.
  computed_status:
    lineage:
    - datalake_visit.visits.computed_status_unified
    description: Computed status unified from Visit. Data since 2015.
  behavior:
    lineage:
    - datalake_ebdb_clean.visit.behavior
    description: What the step of behavior is this visit. Data since 2024-04.
  first_event:
    lineage:
    - datalake_visit.visit_status_events.event_type
    description: First event computed from VSL. Data since 2024-11.
  last_event:
    lineage:
    - datalake_visit.visit_status_events.event_type
    description: Last event computed from VSL. Data since 2024-11.
  slot:
    lineage:
    - datalake_ebdb_clean.visit.slot
    description: Slot is used to take the day of visit. Data since 2015.
  slot_count:
    lineage:
    - datalake_ebdb_clean.visit.slot_count
    description: Number of available slots to visit. Data since 2015.
  business_context:
    description: Which is the context of this visit. Data since 2015.
  booking_type:
    lineage:
    - datalake_ebdb_clean.visit.booking_type
    description: Type of the booking. Data since 2016.
  business_model:
    lineage:
    - datalake_visit.visit_business_model.business_model
    description: Identify the business model of the visit. Data since 2020.
  business_model_supply:
    lineage:
    - datalake_visit.visit_business_model.business_model
    description: Identify if the business model of supply is 1P or 3P. Data since 2020.
  business_model_demand:
    lineage:
    - datalake_visit.visit_business_model.business_model
    description: Identify if the business model of demand (agent) is 1P or 3P. Data since 2020.
  default_timezone:
    lineage:
    - datalake_ebdb_clean.country.default_timezone
    description: What is the default timezone for this region. Data since 2015.
  cancellation_reason:
    lineage:
    - datalake_visit.visit_cancellation_unified.reason
    description: What the reason for the cancellation of this visit. Data since 2016.
  cancellation_on_behalf_of:
    lineage:
    - datalake_visit.visit_cancellation_unified.on_behalf_of
    description: In whose name that cancellation status. Data since 2019.
  cancellation_channel:
    lineage:
    - datalake_visit.visit_cancellation_unified.cancellation_channel
    description: What the channel for the cancellation of this visit. Data since 2019.
  cancellation_type:
    lineage:
    - datalake_visit.visit_cancellation_unified.type
    description: Type of cancellation. It can be before or after the confirmation. Data since 2024-11.
  cancellation_author_role:
    lineage:
    - datalake_visit.visit_cancellation_unified.author_user_role
    description: Role of user who cancelled the visit. Data since 2024-11.
  unsuccessful_reason:
    lineage:
      - datalake_visit.post_visit_agent_unified.unsuccessful_reason
    description: Reason of visit unsuccessful. Data since 2016.
  visit_model:
    description: Visit model of the visit. Data since 2015.
    categories:
      REGISTERED: When the visit is registered after after it has occurred
      FITTED: When the visit is fitted. It is already confirmed
      STANDARD: When the visit follows the standard flow
  visit_schedule_type:
    lineage:
    - datalake_ebdb_clean.visit.ts_visit
    - datalake_ebdb_clean.visit_aud.ts_visit
    description: Type of visit schedule based on the time of first schedule and last schedule. Data since 2015.
    categories:
      NOT_CHANGED: When the schedule has not been changed (first = last)
      POSTPONED: When the visit was postponed (last > first)
      EARLY: When the visit was earlier (last < first)
  visit_request_channel:
    lineage:
    - datalake_visit.visit_origin_unified.visit_request_channel
    description: Channel when the visit was requested. Data since 2016.
  visit_request_on_behalf_of:
    lineage:
    - datalake_visit.visit_status_events.on_behalf_of
