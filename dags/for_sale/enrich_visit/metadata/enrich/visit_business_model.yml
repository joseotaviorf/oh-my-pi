database_name: datalake_visit
table_name: visit_business_model
description: This table contains the business model of the visit with 3P access control indicators.
domain: For Sale
owner: vitor.musachio@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_ebdb_clean.visit_business_model.id
    description: The unique identifier of the visit business model record.
  id_booking:
    lineage:
      - datalake_ebdb_clean.visitor.id_booking
    description: The booking id associated with the agent visitor.
  id_visit:
    lineage:
      - datalake_ebdb_clean.visit_business_model.id_visit
    description: The id of the visit.
  uuid_company:
    lineage:
      - datalake_ebdb_clean.visitor.uuid_company
    description: The company UUID associated with the agent visitor.
  business_model:
    lineage:
      - datalake_ebdb_clean.visit_business_model.business_model
    description: The business model of the visit.
  is_3p_supply:
    lineage:
      - datalake_ebdb_clean.visit_business_model.business_model
    description: Boolean flag indicating whether the business model includes 3P_SUPPLY. Derived from business_model LIKE '%3P_SUPPLY%'.
  is_3p_demand:
    lineage:
      - datalake_ebdb_clean.visit_business_model.business_model
    description: Boolean flag indicating whether the business model includes 3P_DEMAND. Derived from business_model LIKE '%3P_DEMAND%'.
  is_3p_lead_gen:
    lineage:
      - datalake_ebdb_clean.visit_business_model.business_model
    description: Boolean flag indicating whether the business model includes 3P_LEAD_GEN. Derived from business_model LIKE '%3P_LEAD_GEN%'.
  has_3p_access_control:
    lineage:
      - datalake_ebdb_clean.visit_business_model.business_model
    description: Boolean flag indicating whether the business model has any 3P access control. Derived from business_model LIKE '%3P%'.
  ts_created:
    lineage:
      - datalake_ebdb_clean.visit_business_model.ts_created
    description: The timestamp of the visit business model creation.
  ts_updated:
    lineage:
      - datalake_ebdb_clean.visit_business_model.ts_updated
    description: The timestamp of the visit business model update.