database_name: datalake_visit
table_name: visit_schedules
description: Information about Rent and Sale schedules (booking).
  Each row is an unique schedule with the most important information's.
domain: For Sale
owner: guilherme.rocha@quintoandar.com.br
columns:
  id_schedule:
    lineage:
      - datalake_ebdb_clean.visit_status_log.id_schedule
      - datalake_ebdb_clean.booking.id
    description: Booking's Id. Data since 2020.
  id_visit:
    lineage:
      - datalake_ebdb_clean.visit_status_log.id_visit
      - datalake_ebdb_clean.booking.id_visit
    description: Visit's Id. Data since 2020.
  id_visitor:
    lineage:
      - datalake_ebdb_clean.visit.id_visitor
    description: Who is visiting the house.
  id_owner:
    lineage:
      - datalake_ebdb_clean.house.id_user
    description: House's Owner.
  id_house:
    lineage:
      - datalake_ebdb_clean.visit.id_house
    description: Id of house.
  id_user_creation:
    lineage:
      - datalake_ebdb_clean.visit_status_log.id_author_user
      - datalake_ebdb_clean.booking_status_change.id_user
    description: Creator of the schedule. Data since 2020.
  user_role_creation:
    lineage:
      - datalake_ebdb_clean.visit_status_log.author_user_role
    description: User role of who created the schedule.
  id_user_cancelation:
    lineage:
      - datalake_visit.visit_cancellation_unified.id_user
    description: Who canceled the schedule. Data since 2020.
  id_user_agent:
    lineage:
      - datalake_ebdb_clean.visit.id_agent
    description: Is the user Id of the agent.
  id_agent:
    lineage:
      - datalake_ebdb_clean.user.id_agent
    description: Is the id agent of the agent.
  id_fixed_agent:
    lineage:
      - datalake_ebdb_clean.preferred_fixed_agent.id_agent_data
    description: ID of the fixed agent associated with the buyer when the schedule was created.
  id_user_sale_attendence_5a:
    lineage:
      - datalake_hub_services.secretariat_hierarchy.id_user_5a
    description: User id of the secretary who created the schedule.
  id_user_secretariat_on_visit_date:
    lineage:
      - datalake_hub_services.buyer_secretariat_changes.id_external_responsible
    description: User id of the Sales secretary who was responsible for the buyer during the visit date.
  id_user_last_secretariat:
    lineage:
      - datalake_hub_services.buyer_secretariat_changes.id_external_responsible
    description: User id of the last Sales secretary responsible for the buyer.
  id_company_supply:
    lineage:
      - datalake_visit.visit_business_model.id_company_supply
    description: ID of the supply partner from the company domain. Obtained from visit_business_model which consolidates supply partner data.
  id_company_demand:
    lineage:
      - datalake_visit.visit_business_model.id_company_demand
    description: ID of the demand partner from Hubspot. Obtained from visit_business_model which consolidates demand partner data.
  is_3p_supply:
    lineage:
      - datalake_visit.visit_business_model.is_3p_supply
    description: Boolean flag indicating if the visit has 3P supply partner. Obtained from visit_business_model.
  is_3p_demand:
    lineage:
      - datalake_visit.visit_business_model.is_3p_demand
    description: Boolean flag indicating if the visit has 3P demand partner. Obtained from visit_business_model.
  is_3p_lead_gen:
    lineage:
      - datalake_visit.visit_business_model.is_3p_lead_gen
    description: Boolean flag indicating if the visit has 3P lead generation partner. Obtained from visit_business_model.
  has_3p_access_control:
    lineage:
      - datalake_visit.visit_business_model.has_3p_access_control
    description: Boolean flag indicating if the visit has any 3P access control (supply, demand, or lead gen). Obtained from visit_business_model.
  id_succeed_schedule:
    lineage:
      - datalake_ebdb_clean.visit_status_log.id_schedule
      - datalake_ebdb_clean.booking.id
    description: The next schedule case when this schedule have a reschedule.
  id_sale_flow:
    description: ID of the sale flow. Is the concatenation of ID buyer and ID house.
  id_region:
    lineage:
      - datalake_ebdb_clean.house.id_region
    description: ID of the region where house is located.
  visit_code:
    lineage:
      - datalake_ebdb_clean.visit.code
    description: Code of the visit.
  business_context:
    lineage:
      - datalake_ebdb_clean.visit.business_context
    description: Business context of the schedule.
  business_model:
    lineage:
      - datalake_ebdb_clean.visit.business_model
    description: Business model of the visit.
  visit_model:
    lineage:
      - datalake_visit.visit_status_events.event_type
    description: Visit model of the visit.
  visit_fup:
    lineage:
      - datalake_ebdb_clean.booking.visit_fup
    description: The follow up of the visit.
  behavior:
    lineage:
      - datalake_ebdb_clean.visit.behavior
    description: What is the behavior of the visit.
  schedule_origin:
    lineage:
      - datalake_ebdb_clean.visit_status_log.event_type
      - datalake_ebdb_clean.booking.id
    description: If the start of this schedule is from a Request or a Reschedule. Data since 2020.
  channel_creation:
    lineage:
      - datalake_ebdb_clean.visit_status_log.channel
    description: Channel from first event of schedule (VISIT_REQUESTED or VISIT_RESCHEDULED)
  first_confirmed_channel:
    lineage:
      - datalake_ebdb_clean.visit_status_log.channel
    description: Channel from first confirmation of schedule.
  first_confirmed_user_role:
    lineage:
      - datalake_ebdb_clean.visit_status_log.author_user_role
    description: Role of user who is related to the first visit confirmation.
  hub_agent_region:
    lineage:
      - datalake_ebdb_clean.work_contract.contract_name
    description: Name of the contract of the agent associated with the booking, if the contract is from a hub.
  last_confirm_answer_supply:
    description: Last answer of confirmation on behalf of supply.
    categories:
      ANSWER_CONFIRMED: Supply's answer is confirmed for scheduling.
      ANSWER_PENDING: Supply's answer is pending for scheduling.
      ANSWER_REJECTED: Supply's answer is rejected for scheduling.
  last_confirm_answer_demand:
    description: Last answer of confirmation on behalf of demand.
    categories:
      ANSWER_CONFIRMED: Demand's answer is confirmed for scheduling.
      ANSWER_PENDING: Demand's answer is pending for scheduling.
      ANSWER_REJECTED: Demand's answer is rejected for scheduling.
  last_confirm_answer_agent:
    description: Last answer of confirmation on behalf of agent.
    categories:
      ANSWER_CONFIRMED: Agent's answer is confirmed for scheduling.
      ANSWER_PENDING: Agent's answer is pending for scheduling.
      ANSWER_REJECTED: Agent's answer is rejected for scheduling.
  last_confirm_answer_tenant_living:
    description: Last answer of confirmation on behalf of tenant living.
    categories:
      ANSWER_CONFIRMED: Tenant's answer is confirmed for scheduling.
      ANSWER_PENDING: Tenant's answer is pending for scheduling.
      ANSWER_REJECTED: Tenant's answer is rejected for scheduling.
  channel_confirmed_supply:
    description: Channel from supply's confirmation of schedule.
  channel_confirmed_demand:
    description: Channel from demand's confirmation of schedule.
  channel_confirmed_agent:
    description: Channel from agent's confirmation of schedule.
  channel_confirmed_tenant_living:
    description: Channel from tenant's confirmation of schedule.
  is_confirmed_by_supply:
    description: TRUE if the schedule is confirmed by supply.
  is_confirmed_by_demand:
    description: TRUE if the schedule is confirmed by demand.
  is_confirmed_by_agent:
    description: TRUE if the schedule is confirmed by agent.
  is_confirmed_by_tenant_living:
    description: TRUE if the schedule is confirmed by tenant living.
  is_hub_flow:
    description: True if the visit is from an agent with HUB active workcontract.
  is_house_rented:
    lineage:
      - datalake_ebdb_contract.contract.status
    description: True if the house booked had an active rental contract at 5A at the booking date
  is_confirmed:
    lineage:
      - datalake_ebdb_clean.visit_status_log.ts_created
      - datalake_ebdb_clean.booking_status_change.ts_created
    description: If the schedule was confirmed by all. Data since 2020.
  is_completed:
    lineage:
      - datalake_visit.post_visit_agent_unified.event_type
    description: If the schedule is completed.
  is_rescheduled:
    lineage:
      - datalake_ebdb_clean.visit_status_log.ts_created
      - datalake_ebdb_clean.booking_status_change.ts_created
    description: If the schedule is a reschedule. Data since 2020.
  is_canceled:
    lineage:
      - datalake_visit.visit_cancellation_unified.ts_created
    description: If the schedule is canceled. Data since 2020.
  is_unsuccessful:
    lineage:
      - datalake_visit.post_visit_agent_unified.event_type
    description: If the schedule return unsuccessful. Data since 2020.
  has_tenant_living:
    lineage:
      - datalake_ebdb_clean.visit.behavior
    description: TRUE if the visit requires tenant living confirmation.
  days_visit_cancelled_to_visit:
    lineage:
      - datalake_ebdb_clean.visit.dt_visit
      - datalake_visit.visit_cancellation_unified.ts_created
    description: Days between the visit cancelled and the visit. Data since 2020.
  days_visit_booked_to_visit:
    lineage:
      - datalake_ebdb_clean.visit.dt_visit
      - datalake_ebdb_clean.visit_status_log.ts_created
      - datalake_ebdb_clean.booking.ts_created
    description: Days between the visit booked and the visit. Data since 2020.
  days_visit_booked_to_cancelled:
    lineage:
      - datalake_visit.visit_cancellation_unified.ts_created
      - datalake_ebdb_clean.visit_status_log.ts_created
      - datalake_ebdb_clean.booking.ts_created
    description: Days between the booking creation and the visit cancelled date. Data since 2020.
  days_visit_booked_to_visit_completed:
    lineage:
      - datalake_visit.post_visit_agent_unified.ts_post_visit_agent
      - datalake_ebdb_clean.visit_status_log.ts_created
      - datalake_ebdb_clean.booking.ts_created
    description: Days between the booking creation and the visit completed date. Data since 2020.
  ts_visit:
    lineage:
      - datalake_ebdb_clean.visit.ts_visit
    description: Current timestamp when the visit was scheduled.
  ts_schedule_created:
    lineage:
      - datalake_ebdb_clean.visit_status_log.ts_created
      - datalake_ebdb_clean.booking.ts_created
    description: Timestamp of the creation of the schedule. Data since 2020.
  ts_schedule_requested:
    lineage:
      - datalake_ebdb_clean.visit_status_log.ts_created
      - datalake_ebdb_clean.booking.ts_created
    description: Timestamp of the request event. Data since 2020.
  ts_schedule_rescheduled:
    lineage:
      - datalake_ebdb_clean.visit_status_log.ts_created
      - datalake_ebdb_clean.booking.ts_created
    description: Timestamp of the reschedule event. Data since 2020.
  ts_schedule_confirmed:
    lineage:
      - datalake_ebdb_clean.visit_status_log.ts_created
      - datalake_ebdb_clean.booking_status_change.ts_created
    description: Timestamp of the confirmation event. Data since 2020.
  ts_schedule_completed:
    lineage:
      - datalake_visit.post_visit_agent_unified.ts_post_visit_agent
    description: Timestamp of the completed event. Data since 2020.
  ts_schedule_unsuccessful:
    lineage:
      - datalake_visit.post_visit_agent_unified.ts_post_visit_agent
    description: Timestamp with the unsuccessful event. Data since 2020.
  ts_schedule_canceled:
    lineage:
      - datalake_visit.visit_cancellation_unified.ts_created
    description: Timestamp of the canceled event. Data since 2020.
  ts_schedule_visit:
    lineage:
      - datalake_ebdb_clean.visit_aud.ts_visit
      - datalake_ebdb_clean.booking.dt_booking
      - datalake_ebdb_clean.booking.slot_booking
    description: Timestamp when the visit was scheduled for each id_schedule (UTC).
      The slot starts with 0 at 11:00 AM (UTC) and each unit is 15 minutes.
      Data since 2020.
  ts_visit_checkin:
    lineage:
      - datalake_ebdb_clean.visit_checkin.ts_checkin
    description: Visit checkin timestamp.
  ts_buyer_review_rating:
    lineage:
      - datalake_insider_clean.review.dt_creation
    description: Timestamp of the buyer booking review.
  ts_load:
    description: Timestamp of the ingestion.
