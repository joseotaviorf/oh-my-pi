database_name: datalake_visit
table_name: visit_schedules
description: Information about Rent and Sale schedules (booking).
  Each row is an unique schedule with the most important information's.
domain: Data ForSale
owner: matheus.sampaio@quintoandar.com.br
columns:
  id_schedule:
    lineage:
      - datalake_visit.visit_status_events.id_schedule
    description: Booking's Id.
  id_visit:
    lineage:
      - datalake_visit.visit_status_events.id_visit
    description: Visit's Id.
  id_visitor:
    lineage:
      - datalake_ebdb_clean.visit.id_visitor
    description: Who is visiting the house.
  id_owner:
    lineage:
      - datalake_ebdb_clean.house.id_user
    description: House's Owner.
  id_house:
    lineage:
      - datalake_ebdb_clean.visit.id_house
    description: Id of house.
  id_user_creation:
    lineage:
      - datalake_visit.visit_status_events.id_author_user
    description:
      Creator of the schedule.
  id_user_cancelation:
    lineage:
      - datalake_visit.visit_status_events.id_author_user
    description:
      Who canceled the schedule.
  id_user_agent:
    lineage:
      - datalake_ebdb_clean.visit.id_agent
    description: Is the user Id of the agent.
  id_agent:
    lineage:
      - datalake_ebdb_clean.user.id_agent
    description: Is the id agent of the agent.
  id_offer:
    lineage:
      - datalake_offer.sale_offer.id_offer
    description: If the house have a offer, we fill this field.
  id_fixed_agent:
    lineage:
      - datalake_ebdb_clean.preferred_fixed_agent.id_agent_data
    description: ID of the fixed agent associated with the buyer when the schedule was created.
  id_user_sale_attendence_5a:
    lineage:
     - datalake_hub_services.secretariat_hierarchy.id_user_5a
    description: User id of the secretary who created the schedule.
  id_user_secretariat_on_visit_date:
    lineage:
      - datalake_hub_services.buyer_secretariat_changes.id_external_responsible
    description: User id of the Sales secretary who was responsible for the buyer during the visit date.
  id_user_last_secretariat:
    lineage:
      - datalake_hub_services.buyer_secretariat_changes.id_external_responsible
    description: User id of the last Sales secretary responsible for the buyer.
  id_company_supply:
    lineage:
     - datalake_company.company_sks.sk_company
    description: Id of the company in Rede QuintoAndar associated with the house.
  id_company_demand:
    lineage:
     - datalake_company.company_sks.sk_company
    description: Id of the company in Rede QuintoAndar associated with the agent.
  id_succeed_schedule:
    description:
      The next schedule case when this schedule have a reschedule.
  id_sale_flow:
    description: ID of the sale flow. Is the concatenation of ID buyer and ID house.
  id_region:
    lineage:
     - datalake_ebdb_clean.house.id_region
    description: ID of the region where house is located.
  id_business_unit:
    lineage:
      - datalake_sale_visit_hubs.sale_visit_hubs.id_business_unit
    description:
      ID of the business unit associated with the booking. Can be joined with datalake_hub_services_clean.business_unit.
  id_user_en:
    lineage:
      - datalake_sale_visit_hubs.sale_visit_hubs.id_user_en
    description:
      ID of the user of the trading executive.
  visit_code:
    lineage:
      - datalake_ebdb_clean.visit.code
    description:
      Code of the visit.
  business_context:
    lineage:
      - datalake_ebdb_clean.visit.business_context
    description:
      Business context of the schedule.
  business_model:
    lineage:
      - datalake_ebdb_clean.visit.business_model
    description:
      Business model of the visit.
  method:
    lineage:
      - datalake_ebdb_listing.house_entrance_history.key_location
    description:
      How occurred the entry method.
  visit_model:
    lineage:
      - datalake_visit.visit_status_events.event_type
    description:
      Visit model of the visit.
  visit_fup:
    lineage:
      - datalake_ebdb_clean.booking.visit_fup
    description:
      The follow up of the visit.
  behavior:
    lineage:
      - datalake_ebdb_clean.visit.behavior
    description:
      What is the behavior of the visit.
  schedule_origin:
    description:
      If the start of this schedule is from a Request or a Reschedule.
  hub_agent_region:
    lineage:
      - datalake_ebdb_clean.work_contract.contract_name
    description: Name of the contract of the agent associated with the booking, if the contract is from a hub.
  is_hub_flow:
    description: True if the visit is from an agent with HUB active workcontract.
  is_house_rented:
    lineage:
      datalake_ebdb_contract.contract.status
    description:
      True if the house booked had an active rental contract at 5A at the booking date
  days_visit_cancelled_to_visit:
    description:
      Days between the visit cancelled and the visit.
  days_visit_booked_to_visit:
    description:
      Days between the visit booked and the visit.
  days_visit_booked_to_cancelled:
    description:
      Days between the booking creation and the visit cancelled date.
  days_visit_booked_to_visit_completed:
    description:
      Days between the booking creation and the visit completed date.
  hours_booking_to_offer:
    description:
      Hours between the booking created and the first offer.
  hours_visit_to_offer:
    description:
      Hours between the visit completed and the first offer.
  ts_visit:
    description: Time of the visit will happen.
  ts_schedule_created:
    lineage:
      - datalake_ebdb_clean.visit_status_log.ts_event_created
    description:
      Timestamp  of the creation of the schedule.
  ts_schedule_requested:
    lineage:
      - datalake_visit.visit_status_events.ts_event_created
    description:
      Timestamp of the request event.
  ts_schedule_rescheduled:
    lineage:
      - datalake_visit.visit_status_events.ts_event_created
    description:
      Timestamp of the reschedule event.
  ts_schedule_confirmed:
    lineage:
      - datalake_visit.visit_status_events.ts_event_created
    description:
      Timestamp of the confirmation event.
  ts_schedule_completed:
    lineage:
      - datalake_visit.visit_status_events.ts_event_created
    description:
      Timestamp of the completed event.
  ts_schedule_unsuccessful:
    lineage:
      - datalake_visit.visit_status_events.ts_event_created
    description:
      Timestamp with the  event.
  ts_schedule_canceled:
    lineage:
      - datalake_visit.visit_status_events.ts_event_created
    description:
      Timestamp of the canceled event.
  ts_visit_checkin:
    lineage:
      - datalake_ebdb_clean.visit_checkin.ts_checkin
    description:
      Visit checkin timestamp.
    description:
      Timestamp of the agent booking review.
  ts_buyer_review_rating:
    lineage:
      - datalake_insider_clean.review.dt_creation
    description:
      Timestamp of the buyer booking review.
  ts_load:
    description:
      Timestamp of the ingestion.
