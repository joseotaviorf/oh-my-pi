database_name: datalake_legaut_clean
table_name: crawlers_company
description: Corporate legal entity registered as a participant (e.g. current owner, co-owner, or partner company) in a property's legal due-diligence process on Legaut. One row per company entity created within a crawler group, used to route automated document-crawler requests (e.g. corporate registry and tax-clearance lookups) for that company. Not to be confused with the client/platform company that owns a legalization project (see meusite_project.id_company).
domain: For Sale
owner: helder.rodrigues@quintoandar.com.br
columns:
  id:
    lineage:
    - datalake_legaut_raw.crawlers_company.id
    description: Surrogate primary key uniquely identifying the company entity under legal due diligence.
  id_crawler_group:
    lineage:
    - datalake_legaut_raw.crawlers_company.crawlergroup_id
    description: Company this crawler group is investigating. One-to-one foreign key to datalake_legaut_clean.crawlers_crawlergroup, whose `type` categorizes the crawler group's target (e.g. company).
  name:
    lineage:
    - datalake_legaut_raw.crawlers_company.name
    description: Registered legal name (razão social) of the company under due diligence.
  cnpj:
    lineage:
    - datalake_legaut_raw.crawlers_company.cnpj
    description: Brazilian CNPJ tax identification number of the company, used as the primary key to query corporate registry and tax-clearance crawlers.
