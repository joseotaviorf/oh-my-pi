database_name: datalake_legaut_clean
table_name: meusite_state
description: Reference table of Brazilian states used across the Legaut due-diligence workflow, mainly to classify cities (meusite_city) and, indirectly, notary offices. One row per state.
domain: For Sale
columns:
  id:
    lineage:
    - datalake_legaut_raw.meusite_state.id
    description: Surrogate primary key uniquely identifying the state. Referenced by datalake_legaut_clean.meusite_city.
  ibge:
    lineage:
    - datalake_legaut_raw.meusite_state.ibge
    description: IBGE code uniquely identifying this Brazilian state in the official government registry.
  pais:
    lineage:
    - datalake_legaut_raw.meusite_state.pais
    description: Country code to which this state belongs; Legaut operates only in Brazil, so this value is expected to be constant across rows.
  name:
    lineage:
    - datalake_legaut_raw.meusite_state.name
    description: Full official name of the Brazilian state or federative unit.
  uf:
    lineage:
    - datalake_legaut_raw.meusite_state.uf
    description: Two-letter Brazilian state abbreviation (UF), commonly used to build formatted addresses.
  ddd:
    lineage:
    - datalake_legaut_raw.meusite_state.ddd
    description: Telephone area code (DDD) associated with the state.
owner: helder.rodrigues@quintoandar.com.br
