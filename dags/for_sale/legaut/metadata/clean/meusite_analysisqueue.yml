database_name: datalake_legaut_clean
table_name: meusite_analysisqueue
description: Work-queue entry tracking an analyst's assignment to review a unit's legal due-diligence analysis on Legaut. One row per queue entry, used to distribute and monitor analyst workload as units move through the registration-certificate review process.
domain: For Sale
columns:
  id:
    lineage:
    - datalake_legaut_raw.meusite_analysisqueue.id
    description: Surrogate primary key uniquely identifying the analysis-queue entry.
  id_unit:
    lineage:
    - datalake_legaut_raw.meusite_analysisqueue.unit_id
    description: Property unit queued for legal due-diligence analysis. Foreign key to datalake_legaut_clean.meusite_unit.
  id_user:
    lineage:
    - datalake_legaut_raw.meusite_analysisqueue.user_id
    description: Analyst assigned to work on this queue entry. Foreign key to datalake_legaut_clean.accounts_user_email.
  active:
    lineage:
    - datalake_legaut_raw.meusite_analysisqueue.active
    description: Flag indicating whether this analysis-queue entry is currently active and awaiting or undergoing processing (as opposed to closed/historical).
  status:
    lineage:
    - datalake_legaut_raw.meusite_analysisqueue.status
    description: Numeric processing status of this queue entry within the analyst review workflow. No fixed catalog of values is defined in the source application; values should be validated with the data owner before use in reporting.
  tries:
    lineage:
    - datalake_legaut_raw.meusite_analysisqueue.tries
    description: Number of processing attempts made on this analysis-queue entry.
  has_started:
    lineage:
    - datalake_legaut_raw.meusite_analysisqueue.started
    description: Flag indicating whether an analyst has started processing this queue entry.
  ts_created:
    lineage:
    - datalake_legaut_raw.meusite_analysisqueue.created_at
    description: Timestamp when the row was first created in the source operational system.
  ts_updated:
    lineage:
    - datalake_legaut_raw.meusite_analysisqueue.updated_at
    description: Timestamp when the row was last updated in the source operational system.
owner: helder.rodrigues@quintoandar.com.br
