database_name: datalake_legaut_clean
table_name: meusite_document
description: Document produced or uploaded during a unit's legal due-diligence process on Legaut (e.g. a property registration certificate, a due-diligence report, a tax certificate fetched by a crawler, or a file uploaded by the client). One row per document, tracking its type, processing status, and storage location.
domain: For Sale
columns:
  id:
    lineage:
    - datalake_legaut_raw.meusite_document.id
    description: Surrogate primary key uniquely identifying the document.
  id_unit:
    lineage:
    - datalake_legaut_raw.meusite_document.unit_id
    description: Property unit this document belongs to. Foreign key to datalake_legaut_clean.meusite_unit.
  id_user:
    lineage:
    - datalake_legaut_raw.meusite_document.user_id
    description: Internal Legaut user (analyst or system account) who uploaded or generated this document.
  id_crawler_group:
    lineage:
    - datalake_legaut_raw.meusite_document.crawlergroup_id
    description: Crawler group that fetched this document, when it originated from an automated crawler run. Foreign key to datalake_legaut_clean.crawlers_crawlergroup.
  id_assignment:
    lineage:
    - datalake_legaut_raw.meusite_document.assignment_id
    description: Analyst assignment responsible for reviewing this document (external reference to the assignment domain, not modeled in this DAG).
  id_suggested_document:
    lineage:
    - datalake_legaut_raw.meusite_document.suggested_document_id
    description: Suggested-document template this document was created from, i.e. which required document checklist item it fulfills (external reference, not modeled in this DAG).
  id_operation:
    lineage:
    - datalake_legaut_raw.meusite_document.operation_id
    description: For Sale operation this document relates to. Foreign key to datalake_legaut_clean.meusite_operation.
  type:
    lineage:
    - datalake_legaut_raw.meusite_document.type
    description: Kind of document this row represents, i.e. what it contains and why it was collected.
    categories:
      "0": "Property registration certificate (Matricula de Registro de Imoveis)."
      "1": "Due-diligence report (Relatorio)."
      "2": "Result document produced automatically by a crawler run."
      "3": "File uploaded directly by the end user/client."
      "4": "Additional certificate requested during review (Certidao Adicional)."
      "5": "Closing-related file (Arquivo de Closing)."
      "6": "Identity document (RG)."
      "7": "Individual taxpayer document (CPF)."
      "8": "Electricity bill (Conta de Luz)."
      "9": "Water bill (Conta de Agua)."
      "10": "Payment slip fetched by a crawler (Boleto)."
  document_crawler_type:
    lineage:
    - datalake_legaut_raw.meusite_document.document_crawler_type
    description: Crawler type value that produced this document when it came from an automated fetch, aligned with the catalog in datalake_legaut_clean.crawlers_crawlertype.value (soft reference; no fixed enum is defined in the source application).
  status:
    lineage:
    - datalake_legaut_raw.meusite_document.status
    description: Current processing status of this document within the request/fetch workflow.
    categories:
      "0": "Open - the document request is open and pending action."
      "1": "Running - the document is being processed or fetched."
      "2": "Finished - document processing is complete."
      "3": "Not available - the document could not be obtained from the source."
  file_name:
    lineage:
    - datalake_legaut_raw.meusite_document.filename
    description: Original filename of the document uploaded or generated during the due-diligence review.
  document_file_path:
    lineage:
    - datalake_legaut_raw.meusite_document.document_filepath
    description: Storage path where the document file is persisted.
  document_file:
    lineage:
    - datalake_legaut_raw.meusite_document.document_file
    description: Stored file reference of the document.
  obs:
    lineage:
    - datalake_legaut_raw.meusite_document.obs
    description: Free-text observations recorded by analysts about this document.
  description:
    lineage:
    - datalake_legaut_raw.meusite_document.description
    description: Free-text description of the document and its contents.
  slug:
    lineage:
    - datalake_legaut_raw.meusite_document.slug
    description: URL-friendly unique identifier for this document, used in the Legaut application URLs and file storage path.
  ts_created:
    lineage:
    - datalake_legaut_raw.meusite_document.created_at
    description: Timestamp when the row was first created in the source operational system.
  ts_delivered:
    lineage:
    - datalake_legaut_raw.meusite_document.delivered_at
    description: Timestamp when the document was delivered to the requesting party (e.g. the client or the operation stakeholders).
owner: helder.rodrigues@quintoandar.com.br
