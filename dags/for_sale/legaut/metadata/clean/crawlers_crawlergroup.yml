  id_unit:
    lineage:
    - datalake_legaut_raw.crawlers_crawlergroup.unit_id
    description: Foreign key to the property unit under diligence for this crawler group.
  id_which_crawlers:
    lineage:
    - datalake_legaut_raw.crawlers_crawlergroup.which_crawlers_id
    description: Foreign key to the crawler-type set defining which crawlers run for this group.
  id_which_crawlers_overwrite:
    lineage:
    - datalake_legaut_raw.crawlers_crawlergroup.which_crawlers_overwrite_id
    description: Foreign key to the crawler-type set that overrides the default crawlers for this group.
  id_city:
    lineage:
    - datalake_legaut_raw.crawlers_crawlergroup.city_id
    description: Foreign key to the city in datalake_legaut_clean.meusite_city where the documents are sourced.
  obs:
    lineage:
    - datalake_legaut_raw.crawlers_crawlergroup.obs
    description: Free-text observations or notes recorded for this crawler group.
  status:
    lineage:
    - datalake_legaut_raw.crawlers_crawlergroup.status
    description: Current operational status code governing workflow progression for this record.
  type:
    lineage:
    - datalake_legaut_raw.crawlers_crawlergroup.type
    description: Classifier distinguishing record subtype or participant role in the workflow.
owner: helder.rodrigues@quintoandar.com.br
description: Cleaned snapshot of crawlers crawlergroup sourced from operational systems backing Legaut legal automation service data for For Sale contract and document workflows. One row per crawlers crawlergroup record with standardized names and types in datalake_legaut_clean.
