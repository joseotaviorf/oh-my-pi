database_name: datalake_legaut_clean
table_name: crawlers_crawlergroup
domain: For Sale
columns:
  id:
    lineage:
    - datalake_legaut_raw.crawlers_crawlergroup.id
    description: Surrogate primary key of the crawlers crawlergroup row in the source system.
  id_google_drive_folder:
    lineage:
    - datalake_legaut_raw.crawlers_crawlergroup.google_drive_folder_id
    description: Foreign key to the Google Drive folder storing documents for this crawler group.
  id_crawler_group:
    lineage:
    - datalake_legaut_raw.crawlers_crawlergroup.crawlergroup_id
