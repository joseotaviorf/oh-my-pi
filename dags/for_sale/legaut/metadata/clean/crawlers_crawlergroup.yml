database_name: datalake_legaut_clean
table_name: crawlers_crawlergroup
description: Logical grouping of automated document-crawler executions that target the same due-diligence participant (the property itself, its owner, a company, a partner/shareholder, the buyer, or utility bills) within a unit's legal analysis. One row per crawler group, tracking overall completion status and the Google Drive folder where its fetched documents are stored.
domain: For Sale
columns:
  id:
    lineage:
    - datalake_legaut_raw.crawlers_crawlergroup.id
    description: Surrogate primary key uniquely identifying the crawler group.
  id_google_drive_folder:
    lineage:
    - datalake_legaut_raw.crawlers_crawlergroup.google_drive_folder_id
    description: Identifier of the Google Drive folder where documents fetched for this crawler group are stored.
  id_crawler_group:
    lineage:
    - datalake_legaut_raw.crawlers_crawlergroup.crawlergroup_id
    description: Parent crawler group this one is nested under, when the group represents a sub-participant (e.g. a partner nested under a company). Self-referencing foreign key to datalake_legaut_clean.crawlers_crawlergroup.
  id_unit:
    lineage:
    - datalake_legaut_raw.crawlers_crawlergroup.unit_id
    description: Property unit under legal due diligence that this crawler group belongs to. Foreign key to datalake_legaut_clean.meusite_unit.
  id_which_crawlers:
    lineage:
    - datalake_legaut_raw.crawlers_crawlergroup.which_crawlers_id
    description: Rule set defining which crawler types (see datalake_legaut_clean.crawlers_crawlertype) should run by default for this group's participant type and city.
  id_which_crawlers_overwrite:
    lineage:
    - datalake_legaut_raw.crawlers_crawlergroup.which_crawlers_overwrite_id
    description: Rule set that adds or removes specific crawler types on top of the default rule set (id_which_crawlers) for this group.
  id_city:
    lineage:
    - datalake_legaut_raw.crawlers_crawlergroup.city_id
    description: City where the documents for this crawler group are sourced, used to select city-specific crawlers/notary offices. Foreign key to datalake_legaut_clean.meusite_city.
  obs:
    lineage:
    - datalake_legaut_raw.crawlers_crawlergroup.obs
    description: Free-text observations or notes recorded by an analyst for this crawler group.
  status:
    lineage:
    - datalake_legaut_raw.crawlers_crawlergroup.status
    description: Whether all documents expected for this crawler group's participant have been successfully collected.
    categories:
      "0": "Ok - no pending issues; all required documents were successfully collected."
      "1": "Pendencias - one or more documents are still missing or unresolved."
  type:
    lineage:
    - datalake_legaut_raw.crawlers_crawlergroup.type
    description: Kind of due-diligence participant this crawler group investigates.
    categories:
      "0": "property - documents about the property itself."
      "1": "owner - documents about the current property owner."
      "2": "company - documents about a corporate owner entity."
      "3": "partner - documents about a company partner/shareholder."
      "4": "otherfiles - miscellaneous documents not tied to a specific participant."
      "5": "buyer - documents about the property buyer."
      "6": "bills - utility bills and payment slips."
owner: helder.rodrigues@quintoandar.com.br
