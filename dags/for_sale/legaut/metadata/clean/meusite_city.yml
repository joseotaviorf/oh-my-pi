database_name: datalake_legaut_clean
table_name: meusite_city
domain: For Sale
columns:
  id:
    lineage:
    - datalake_legaut_raw.meusite_city.id
    description: Surrogate primary key of the meusite city row in the source system.
  id_state:
    lineage:
    - datalake_legaut_raw.meusite_city.state_id
    description: Foreign key to the state in datalake_legaut_clean.meusite_state this city belongs to.
  ibge:
    lineage:
    - datalake_legaut_raw.meusite_city.ibge
    description: IBGE municipality code uniquely identifying this Brazilian city.
  display:
    lineage:
    - datalake_legaut_raw.meusite_city.display
    description: Formatted city name shown to users in the interface.
  name:
    lineage:
    - datalake_legaut_raw.meusite_city.name
    description: Official name of the city.
owner: helder.rodrigues@quintoandar.com.br
description: Cleaned snapshot of meusite city sourced from operational systems backing Legaut legal automation service data for For Sale contract and document workflows. One row per meusite city record with standardized names and types in datalake_legaut_clean.
