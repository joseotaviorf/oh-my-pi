database_name: datalake_legaut_clean
table_name: meusite_notary
description: Reference table of notary offices (cartorios) handling property registration and closing transactions for units under legal due diligence on Legaut. One row per notary office.
domain: For Sale
columns:
  id:
    lineage:
    - datalake_legaut_raw.meusite_notary.id
    description: Surrogate primary key uniquely identifying the notary office. Referenced by datalake_legaut_clean.meusite_unit and datalake_legaut_clean.meusite_operation.
  id_city:
    lineage:
    - datalake_legaut_raw.meusite_notary.city_id
    description: City where this notary office is located. Foreign key to datalake_legaut_clean.meusite_city.
  name:
    lineage:
    - datalake_legaut_raw.meusite_notary.name
    description: Name of the notary office (cartorio) handling the property registration or transaction.
owner: helder.rodrigues@quintoandar.com.br
