---
database_name: dw_sale
table_name: fact_sale_demand_event
description: 'Transactional fact table that registers a row for each key event in
  the funnel of ForSale demand. All events that show up in this table are present
  in the dimension dw_sale.dim_sale_event_type. The goal of this table is to make
  it easy to analyze multiple types of events together, such as coincident views.
  Along with the event, we have several dimension tables that contextualize it, such
  as the house, the region, the date, the buyer, the seller, the agent, their contract,
  the booking, the offer, companies for Rede Supply and Demand, and the business unit. '
domain: For Sale
owner: ae-for-sale@quintoandar.com.br
columns:
  sk_sale_demand_event:
    description: Primary key of the table, autogenerated incremental number.
  sk_event_type:
    description: Key of the type of event. Can be joined with dw_sale.dim_sale_event_type.
  sk_event_date:
    lineage:
    - dw_sale.fact_visits.sk_booking_created_date
    - dw_sale.fact_visits.sk_visit_canceled_date
    - dw_sale.fact_visits.sk_visit_completed_date
    - dw_sale.fact_offers.sk_offer_submitted_date
    - dw_sale.fact_offers.sk_offer_accepted_date
    - dw_sale.fact_offers.sk_sale_agreement_created_date
    - dw_sale.fact_offers.sk_sale_agreement_signed_date
    - dw_sale.fact_offers.sk_offer_dismissed_date
    description: Date key of when the event happened. Can be joined with dw_public.dim_date.
  sk_booking:
    lineage:
    - dw_sale.fact_visits.sk_booking
    - dw_sale.fact_offers.sk_booking
    description: Key of the associated booking.
  sk_offer:
    lineage:
    - dw_sale.fact_offers.sk_offer
    description: Key of the associated offer.
  sk_house:
    lineage:
    - dw_sale.fact_visits.sk_house
    - dw_sale.fact_offers.sk_house
    description: Key of the associated house.
  sk_region:
    lineage:
    - dw_sale.fact_visits.sk_region
    - dw_sale.fact_offers.sk_region
    description: Key of the associated house's region.
  sk_buyer:
    lineage:
    - dw_sale.fact_visits.sk_buyer
    - dw_sale.fact_offers.sk_buyer
    description: Key of the buyer's user. Can be joined with dw_public.dim_user.
  sk_seller:
    lineage:
    - dw_sale.fact_visits.sk_seller
    - dw_sale.fact_offers.sk_seller
    description: Key of the seller's user. Can be joined with dw_public.dim_user.
  sk_agent:
    lineage:
    - dw_sale.fact_visits.sk_agent
    - dw_sale.fact_offers.sk_agent
    description: 'Key of the agent. Can be joined with dw_public.dim_agent. Note:
      this is NOT the key of the user, so it cannot be joined with the primary key
      of dim_user. However, it can be joined with dw_public.dim_user.dados_agente_id.
      However, that is not recommended, since dim_user is much bigger than dim_agent,
      reducing performance.'
  sk_agent_work_contract:
    lineage:
    - dw_agent.fact_agent_contract.sk_work_contract
    description: 'Key of the agent''s work contract at the start of the funnel. It
      can be joined with dw_agent.dim_work_contract. Note: this is not the same as
      id_work_contract, and cannot be joined with any table other than the dimension
      previously stated. That is because dim_work_contract includes the contract,
      but also aggregate contextual information, such as if the agent is active on
      Main, and the business context (Sale, Rent or both).'
  sk_business_unit:
    lineage:
    - dw_sale.fact_visits.sk_business_unit
    - dw_sale.fact_offers.sk_business_unit
    description: Key of the agent's business context at the start of the funnel. There
      are no associated dimensions yet, but it can be joined with datalake_hub_services_clean.business_unit.
  sk_company_supply:
    lineage:
    - dw_sale.fact_visits.sk_company_supply
    - dw_sale.fact_offers.sk_company_supply
    description: Key of the listing's origin company in Rede Supply, if that is the
      case. It can be joined with dw_rede.dim_company.
  sk_company_demand:
    lineage:
    - dw_sale.fact_visits.sk_company_demand
    - dw_sale.fact_offers.sk_company_demand
    description: Key of the agents's company in Rede Demand at the start of the funnel,
      if that is the case. It can be joined with dw_rede.dim_company.
  sk_secretariat_booking_creator:
    lineage:
    - dw_sale.fact_visits.sk_secretariat_booking_creator
    - dw_sale.fact_offers.sk_secretariat_booking_creator
    description: Surrogate key of the secretariat who created the booking. Can be joined with dw_secretariat.dim_secretariat_user_version,
      on field sk_secretariat_user_version. This allows you to see information about the secretariat in the moment of the creation, such as their team allocation.
  sk_secretariat_on_event:
    lineage:
    - dw_sale.fact_visits.sk_secretariat_on_visit
    - dw_sale.fact_offers.sk_secretariat_on_offer_submitted
    - dw_sale.fact_offers.sk_secretariat_on_offer_accepted
    - dw_sale.fact_offers.sk_secretariat_on_offer_dismissed
    - dw_sale.fact_offers.sk_secretariat_on_sale_agreement_created
    - dw_sale.fact_offers.sk_secretariat_on_sale_agreement_signed
    description: Surrogate key of the secretariat who was associated with the buyer on the date of the event. Can be joined with dw_secretariat.dim_secretariat_user_version,
      on field sk_secretariat_user_version. This allows you to see information about the secretariat in the moment of the event, such as their team allocation.
  sk_last_secretariat:
    lineage:
    - dw_sale.fact_visits.sk_last_secretariat
    - dw_sale.fact_offers.sk_last_secretariat
    description: Surrogate key of the secretariat who was last associated with the buyer. Can be joined with dw_secretariat.dim_secretariat_user_version,
      on field sk_secretariat_user_version.
  sk_buyer_prospect_type:
    lineage:
    - dw_sale.fact_visits.sk_buyer_prospect_type
    - dw_sale.fact_offers.sk_buyer_prospect_type
    description: Surrogate key of the buyer prospect type. Can be joined with dw_sale.dim_buyer_prospect_type.
  sk_listing_price_segment:
    lineage:
    - dw_sale.fact_visits.sk_listing_price_segment
    - dw_sale.fact_offers.sk_listing_price_segment
    description: Surrogate key of the listing price segment. Can be joined with dw_sale.dim_sale_price_segment.
  year:
    lineage:
    - dw_public.dim_date.year
    description: Year of when the event happened.
  month:
    lineage:
    - dw_public.dim_date.month
    description: Month of when the event happened.
  day:
    lineage:
    - dw_public.dim_date.day
    description: Day of when the event happened.
  ts_event:
    lineage:
    - dw_sale.fact_visits.ts_booking_created
    - dw_sale.fact_visits.ts_visit_canceled
    - dw_sale.fact_visits.ts_visit_completed
    - dw_sale.fact_offers.ts_offer_submitted
    - dw_sale.fact_offers.ts_offer_accepted
    - dw_sale.fact_offers.ts_sale_agreement_created
    - dw_sale.fact_offers.ts_sale_agreement_signed
    - dw_sale.fact_offers.ts_offer_dismissed
    description: Timestamp of when the event happened, in UTC.
  ts_load:
    description: Timestamp of when the table loaded a given row.
