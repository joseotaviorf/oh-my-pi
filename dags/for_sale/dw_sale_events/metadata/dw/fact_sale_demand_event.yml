database_name: dw_sale
table_name: fact_sale_demand_event
description: >-
  Transactional fact table with one row per key event in the For Sale demand funnel (visit
  booked, visit completed, offer submitted, offer accepted, sale agreement created, sale
  agreement signed, visit cancelled, offer rejected) — the event catalog is
  dw_sale.dim_sale_event_type, joined via sk_event_type. Grain: one row per (event date, event
  type, offer-or-booking) tuple; sk_sale_demand_event is the surrogate primary key (MD5 hash of
  sk_event_date, sk_event_type, and sk_offer/sk_booking). Built by unpivoting dw_sale.fact_visits
  (booking/visit-anchored events: VISIT_BOOKED, VISIT_COMPLETED, VISIT_CANCELLED) and
  dw_sale.fact_offers (offer-anchored events: OFFER_SUBMITTED, OFFER_ACCEPTED,
  SALE_AGREEMENT_CREATED, SALE_AGREEMENT_SIGNED, OFFER_REJECTED) into a single event stream,
  enriched with the agent's work contract via dw_agent.fact_agent_contract.
  NOTE ON LINEAGE: although this table shares the same 8-event taxonomy and sk_event_type
  numbering as datalake_sale_demand_events.sale_demand_events (the enrich-layer demand-events
  table), it is NOT built directly from that enrich table — verified from this table's own SQL,
  which sources exclusively from dw_sale.fact_visits and dw_sale.fact_offers. The two tables are
  separate/parallel pipelines; do not assume a 1:1 rename/reshape relationship between them, and
  join them only via shared business keys (e.g. buyer/house), never by assuming identical
  lineage. Per the FS Transact business glossary, event_name = VISIT_BOOKED (sk_event_type = 1,
  via dw_sale.dim_sale_event_type) on a 1P row (is_3p_demand = false AND is_3p_supply = false)
  identifies a Buyer Prospect (BP) — this table is the correct source for the "# Buyer Prospect"
  metric. dw_sale.fact_buyer_prospects is NOT the correct source: it is not joined to this table
  in its own SQL and only captures each buyer's first-ever lifetime booking (roughly half of
  monthly BP volume). This table is self-joined (on sk_booking or sk_offer) to build
  dw_sale.fact_sale_cohort_conversion, whose sk_cohort_type foreign key is defined in
  dw_sale.dim_sale_cohort_type. Along with the event, we have several dimension tables that
  contextualize it, such as the house, the region, the date, the buyer, the seller, the agent,
  their contract, the booking, the offer, companies for Rede Supply and Demand, and the business
  unit.
domain: For Sale
owner: guilherme.rocha@quintoandar.com.br
columns:
  sk_sale_demand_event:
    lineage:
    - dw_sale.fact_visits.sk_booking
    - dw_sale.fact_offers.sk_offer
    description: Primary key of the table. Deterministic MD5 hash of sk_event_date, sk_event_type, and the offer key (or the booking key when there is no associated offer, sk_offer = -1) — not an autogenerated incremental number. See sk_event_date and sk_event_type for their own source lineage.
  sk_event_type:
    description: Key of the type of event. Hardcoded literal (1-8, one per UNION ALL branch in this table's SQL); no upstream source column. Can be joined with dw_sale.dim_sale_event_type.
    categories:
      '1': 'VISIT_BOOKED — buyer booked a visit to the house.'
      '2': 'VISIT_COMPLETED — buyer completed the booked visit.'
      '3': 'OFFER_SUBMITTED — buyer submitted a purchase offer.'
      '4': 'OFFER_ACCEPTED — seller accepted the buyer''s offer.'
      '5': 'SALE_AGREEMENT_CREATED — sale agreement (CCV) draft was created.'
      '6': 'SALE_AGREEMENT_SIGNED — sale agreement (CCV) was signed by both parties.'
      '7': 'VISIT_CANCELLED — the previously booked visit was cancelled.'
      '8': 'OFFER_REJECTED — the offer was rejected or dismissed before acceptance.'
  sk_event_date:
    lineage:
    - dw_sale.fact_visits.sk_booking_created_date
    - dw_sale.fact_visits.sk_visit_canceled_date
    - dw_sale.fact_visits.sk_visit_completed_date
    - dw_sale.fact_offers.sk_offer_submitted_date
    - dw_sale.fact_offers.sk_offer_accepted_date
    - dw_sale.fact_offers.sk_sale_agreement_created_date
    - dw_sale.fact_offers.sk_sale_agreement_signed_date
    - dw_sale.fact_offers.sk_offer_dismissed_date
    description: Date key of when the event happened. Can be joined with dw_public.dim_date.
  sk_booking:
    lineage:
    - dw_sale.fact_visits.sk_booking
    - dw_sale.fact_offers.sk_booking
    description: Key of the associated booking.
  sk_visit:
    lineage:
    - dw_sale.fact_visits.sk_visit
    - datalake_booking.booking.id_visit
    description: Key of the associated visit.
  sk_offer:
    lineage:
    - dw_sale.fact_offers.sk_offer
    description: Key of the associated offer.
  sk_house:
    lineage:
    - dw_sale.fact_visits.sk_house
    - dw_sale.fact_offers.sk_house
    description: Key of the associated house.
  sk_region:
    lineage:
    - dw_sale.fact_visits.sk_region
    - dw_sale.fact_offers.sk_region
    description: Key of the associated house's region.
  sk_buyer:
    lineage:
    - dw_sale.fact_visits.sk_buyer
    - dw_sale.fact_offers.sk_buyer
    description: Key of the buyer's user. Can be joined with dw_public.dim_user.
  sk_seller:
    lineage:
    - dw_sale.fact_visits.sk_seller
    - dw_sale.fact_offers.sk_seller
    description: Key of the seller's user. Can be joined with dw_public.dim_user.
  sk_agent:
    lineage:
    - dw_sale.fact_visits.sk_agent
    - dw_sale.fact_offers.sk_agent
    description: 'Key of the agent. Can be joined with dw_public.dim_agent. Note: this is NOT the key of the user, so it cannot be joined with the primary key of dim_user. However, it can be joined with dw_public.dim_user.dados_agente_id. However, that is not recommended, since dim_user is much bigger than dim_agent, reducing performance.'
  sk_agent_work_contract:
    lineage:
    - dw_agent.fact_agent_contract.sk_work_contract
    description: 'Key of the agent''s work contract at the start of the funnel. It can be joined with dw_agent.dim_work_contract. Note: this is not the same as id_work_contract, and cannot be joined with any table other than the dimension previously stated. That is because dim_work_contract includes the contract, but also aggregate contextual information, such as if the agent is active on Main, and the business context (Sale, Rent or both).'
  sk_business_unit:
    lineage:
    - dw_sale.fact_visits.sk_business_unit
    - dw_sale.fact_offers.sk_business_unit
    description: Key of the agent's business context at the start of the funnel. There are no associated dimensions yet, but it can be joined with datalake_hub_services_clean.business_unit.
  sk_broker_supply:
    lineage:
    - dw_sale.fact_visits.sk_broker_supply
    - dw_sale.fact_offers.sk_broker_supply
    description: Surrogate key of the supply-side broker when the business model implies 3P supply.
  sk_broker_demand:
    lineage:
    - dw_sale.fact_visits.sk_broker_demand
    - dw_sale.fact_offers.sk_broker_demand
    description: Surrogate key of the demand-side broker when the business model implies 3P demand or lead gen.
  sk_secretariat_booking_creator:
    lineage:
    - dw_sale.fact_visits.sk_secretariat_booking_creator
    - dw_sale.fact_offers.sk_secretariat_booking_creator
    description: Surrogate key of the secretariat who created the booking. Join with datalake_secretariat.secretariat_allocation_history on id_secretariat_user_version to retrieve team allocation at booking creation time.
  sk_secretariat_on_event:
    lineage:
    - dw_sale.fact_visits.sk_secretariat_on_visit
    - dw_sale.fact_offers.sk_secretariat_on_offer_submitted
    - dw_sale.fact_offers.sk_secretariat_on_offer_accepted
    - dw_sale.fact_offers.sk_secretariat_on_offer_dismissed
    - dw_sale.fact_offers.sk_secretariat_on_sale_agreement_created
    - dw_sale.fact_offers.sk_secretariat_on_sale_agreement_signed
    description: Surrogate key of the secretariat who was associated with the buyer on the date of the event. Join with datalake_secretariat.secretariat_allocation_history on id_secretariat_user_version to retrieve team allocation at event time.
  sk_last_secretariat:
    lineage:
    - dw_sale.fact_visits.sk_last_secretariat
    - dw_sale.fact_offers.sk_last_secretariat
    description: Surrogate key of the secretariat who was last associated with the buyer. Join with datalake_secretariat.secretariat_allocation_history on id_secretariat_user_version to retrieve the latest team allocation.
  sk_buyer_prospect_type:
    lineage:
    - dw_sale.fact_visits.sk_buyer_prospect_type
    - dw_sale.fact_offers.sk_buyer_prospect_type
    description: Surrogate key of the buyer prospect type. Can be joined with dw_sale.dim_buyer_prospect_type.
  sk_listing_price_segment:
    lineage:
    - dw_sale.fact_visits.sk_listing_price_segment
    - dw_sale.fact_offers.sk_listing_price_segment
    description: Surrogate key of the listing price segment. Can be joined with dw_sale.dim_sale_price_segment.
  sale_type:
    lineage:
    - dw_sale.fact_visits.sale_type
    - dw_sale.fact_offers.sale_type
    description: Market type associated with the demand-funnel event. Visit-derived events use the visit classification and offer-derived events use the offer classification. PRIMARY identifies a new-build unit and SECONDARY identifies a resale offer; NULL is preserved for unclassified source rows.
    categories:
      PRIMARY: Event associated with a Primary Market offer or visit.
      SECONDARY: Event associated with a Secondary Market offer or visit.
  is_3p_supply:
    lineage:
    - dw_sale.fact_visits.is_3p_supply
    - dw_sale.fact_offers.is_3p_supply
    description: Boolean flag indicating if the event has a 3P supply partner. A 3P supply partner is a company that provides the property to the QuintoAndar platform.
  is_3p_demand:
    lineage:
    - dw_sale.fact_visits.is_3p_demand
    - dw_sale.fact_offers.is_3p_demand
    description: Boolean flag indicating if the event has a 3P demand partner. A 3P demand partner is a company that provides the buyer to the QuintoAndar platform.
  is_3p_lead_gen:
    lineage:
    - dw_sale.fact_visits.is_3p_lead_gen
    - dw_sale.fact_offers.is_3p_lead_gen
    description: Boolean flag indicating if the event has a 3P lead generation partner. A 3P lead gen partner generates leads that are forwarded to the QuintoAndar platform.
  has_3p_access_control:
    lineage:
    - dw_sale.fact_visits.has_3p_access_control
    - dw_sale.fact_offers.has_3p_access_control
    description: Boolean flag indicating if the event has any 3P access control (supply, demand, or lead gen). True if any of the 3P flags are true.
  year:
    lineage:
    - dw_sale.fact_visits.ts_booking_created
    - dw_sale.fact_visits.ts_visit_canceled
    - dw_sale.fact_visits.ts_visit_completed
    - dw_sale.fact_offers.ts_offer_submitted
    - dw_sale.fact_offers.ts_offer_accepted
    - dw_sale.fact_offers.ts_sale_agreement_created
    - dw_sale.fact_offers.ts_sale_agreement_signed
    - dw_sale.fact_offers.ts_offer_dismissed
    description: Year of when the event happened. Computed as YEAR(ts_event); partition key for the table, performant to filter or join by.
  month:
    lineage:
    - dw_sale.fact_visits.ts_booking_created
    - dw_sale.fact_visits.ts_visit_canceled
    - dw_sale.fact_visits.ts_visit_completed
    - dw_sale.fact_offers.ts_offer_submitted
    - dw_sale.fact_offers.ts_offer_accepted
    - dw_sale.fact_offers.ts_sale_agreement_created
    - dw_sale.fact_offers.ts_sale_agreement_signed
    - dw_sale.fact_offers.ts_offer_dismissed
    description: Month of when the event happened. Computed as MONTH(ts_event); partition key for the table, performant to filter or join by.
  day:
    lineage:
    - dw_sale.fact_visits.ts_booking_created
    - dw_sale.fact_visits.ts_visit_canceled
    - dw_sale.fact_visits.ts_visit_completed
    - dw_sale.fact_offers.ts_offer_submitted
    - dw_sale.fact_offers.ts_offer_accepted
    - dw_sale.fact_offers.ts_sale_agreement_created
    - dw_sale.fact_offers.ts_sale_agreement_signed
    - dw_sale.fact_offers.ts_offer_dismissed
    description: Day of when the event happened. Computed as DAY(ts_event); partition key for the table, performant to filter or join by.
  ts_event:
    lineage:
    - dw_sale.fact_visits.ts_booking_created
    - dw_sale.fact_visits.ts_visit_canceled
    - dw_sale.fact_visits.ts_visit_completed
    - dw_sale.fact_offers.ts_offer_submitted
    - dw_sale.fact_offers.ts_offer_accepted
    - dw_sale.fact_offers.ts_sale_agreement_created
    - dw_sale.fact_offers.ts_sale_agreement_signed
    - dw_sale.fact_offers.ts_offer_dismissed
    description: Timestamp of when the event happened, in UTC.
  ts_load:
    description: Timestamp of when the table loaded a given row.
