database_name: dw_sale
table_name: fact_sale_cohort_conversion
description: >-
  Transactional fact table with one row per (base demand event, first occurrence of a distinct
  subsequent event type) conversion — e.g. a VISIT_BOOKED base event paired with the buyer's
  first VISIT_COMPLETED, OFFER_SUBMITTED, etc. Grain and surrogate key: sk_sale_cohort_conversion
  (base event's sk_sale_demand_event concatenated with the conversion event's sk_event_type).
  Built by self-joining dw_sale.fact_sale_demand_event on sk_booking (when the base event has no
  associated offer, sk_offer = -1) or on sk_offer (otherwise), keeping only the earliest matching
  conversion event per (sk_sale_demand_event, conversion_sk_event_type) pair via a ROW_NUMBER
  filter. sk_cohort_type is a composite key built from both events' sk_event_type plus the
  elapsed week/day buckets, matching dw_sale.dim_sale_cohort_type.sk_cohort_type — join to that
  dimension via sk_cohort_type to get human-readable conversion names/abbreviations and
  day/week groupings. All types of conversions that show up in this table are described in the
  dimension dw_sale.dim_sale_cohort_type. Along with the conversion, we have several dimension
  tables that contextualize it, such as the house, the region, the date, the buyer, the seller,
  the agent, their contract, the booking, the offer, companies for Rede Supply and Demand, and
  the business unit.
domain: For Sale
owner: guilherme.rocha@quintoandar.com.br
columns:
  sk_sale_cohort_conversion:
    lineage:
    - dw_sale.fact_sale_demand_event.sk_sale_demand_event
    - dw_sale.fact_sale_demand_event.sk_event_type
    description: Primary key of this fact, one row per conversion, derived from the base demand event and its conversion event type.
  sk_base_date:
    lineage:
    - dw_sale.fact_sale_demand_event.sk_event_date
    description: Date key of when the base event happened. For example, if it is a VB2VC, this would be the VB date. Can be joined with dw_public.dim_date.
  sk_conversion_date:
    lineage:
    - dw_sale.fact_sale_demand_event.sk_event_date
    description: Date key of when the conversion event happened. For example, if it is a VB2VC, this would be the VC date. Can be joined with dw_public.dim_date.
  sk_booking:
    lineage:
    - dw_sale.fact_sale_demand_event.sk_booking
    description: Key of the associated booking.
  sk_offer:
    lineage:
    - dw_sale.fact_sale_demand_event.sk_offer
    description: Key of the associated offer.
  sk_house:
    lineage:
    - dw_sale.fact_sale_demand_event.sk_house
    description: Key of the associated house.
  sk_region:
    lineage:
    - dw_sale.fact_sale_demand_event.sk_region
    description: Key of the associated house's region.
  sk_buyer:
    lineage:
    - dw_sale.fact_sale_demand_event.sk_buyer
    description: Key of the buyer's user. Can be joined with dw_public.dim_user.
  sk_seller:
    lineage:
    - dw_sale.fact_sale_demand_event.sk_seller
    description: Key of the seller's user. Can be joined with dw_public.dim_user.
  sk_agent:
    lineage:
    - dw_sale.fact_sale_demand_event.sk_agent
    description: 'Key of the agent. Can be joined with dw_public.dim_agent. Note: this is NOT the key of the user, so it cannot be joined with the primary key of dim_user. However, it can be joined with dw_public.dim_user.dados_agente_id. However, that is not recommended, since dim_user is much bigger than dim_agent, reducing performance.'
  sk_agent_work_contract:
    lineage:
    - dw_sale.fact_sale_demand_event.sk_agent_work_contract
    description: 'Key of the agent''s work contract at the start of the funnel. It can be joined with dw_agent.dim_work_contract. Note: this is not the same as id_work_contract, and cannot be joined with any table other than the dimension previously stated. That is because dim_work_contract includes the contract, but also aggregate contextual information, such as if the agent is active on Main, and the business context (Sale, Rent or both).'
  sk_business_unit:
    lineage:
    - dw_sale.fact_sale_demand_event.sk_business_unit
    description: Key of the agent's business context at the start of the funnel. There are no associated dimensions yet, but it can be joined with datalake_hub_services_clean.business_unit.
  sk_broker_supply:
    lineage:
    - dw_sale.fact_sale_demand_event.sk_broker_supply
    description: Surrogate key of the supply-side broker when the business model implies 3P supply.
  sk_broker_demand:
    lineage:
    - dw_sale.fact_sale_demand_event.sk_broker_demand
    description: Surrogate key of the demand-side broker when the business model implies 3P demand or lead gen.
  sk_secretariat_booking_creator:
    lineage:
    - dw_sale.fact_sale_demand_event.sk_secretariat_booking_creator
    description: Surrogate key of the secretariat who created the booking. Join with datalake_secretariat.secretariat_allocation_history on id_secretariat_user_version to retrieve team allocation at booking creation time.
  sk_secretariat_on_event:
    lineage:
    - dw_sale.fact_sale_demand_event.sk_secretariat_on_event
    description: Surrogate key of the secretariat who was associated with the buyer on the date of the event. Join with datalake_secretariat.secretariat_allocation_history on id_secretariat_user_version to retrieve team allocation at event time.
  sk_last_secretariat:
    lineage:
    - dw_sale.fact_sale_demand_event.sk_last_secretariat
    description: Surrogate key of the secretariat who was last associated with the buyer. Join with datalake_secretariat.secretariat_allocation_history on id_secretariat_user_version to retrieve the latest team allocation.
  year:
    lineage:
    - dw_sale.fact_sale_demand_event.year
    description: Year of when the base event happened. It is a partition key, so it is performatic to filter or join by this column.
  month:
    lineage:
    - dw_sale.fact_sale_demand_event.month
    description: Month of when the base event happened. It is a partition key, so it is performatic to filter or join by this column.
  day:
    lineage:
    - dw_sale.fact_sale_demand_event.day
    description: Day of when the base event happened. It is a partition key, so it is performatic to filter or join by this column.
  sk_cohort_type:
    lineage:
    - dw_sale.fact_sale_demand_event.sk_event_type
    - dw_public.dim_date.week_start
    - dw_public.dim_date.date
    description: Composite key of the type of conversion (base event type, conversion event type, week bucket, day bucket). Built by concatenating the base and conversion sk_event_type values with the elapsed week and calendar-day differences computed via dw_public.dim_date. Can be joined with dw_sale.dim_sale_cohort_type.
  days_to_conversion:
    lineage:
    - dw_public.dim_date.date
    description: Amount of calendar days between the base event and the conversion event. Computed as DATEDIFF between the conversion event's and the base event's dw_public.dim_date.date.
  week_number:
    lineage:
    - dw_public.dim_date.week_start
    description: Number of weeks in the conversion range. Not in calendar days! 0 means it converted within the same week (Monday-Sunday), 1 means it converted on the following week, and so on. Computed as DATEDIFF between the conversion event's and the base event's dw_public.dim_date.week_start, divided by 7.
  ts_base_event:
    lineage:
    - dw_sale.fact_sale_demand_event.ts_event
    description: Timestamp when the base event happened, in UTC. For example, if it is a VB2VC, this would be the VB timestamp.
  ts_conversion_event:
    lineage:
    - dw_sale.fact_sale_demand_event.ts_event
    description: Timestamp when the conversion event happened, in UTC. For example, if it is a VB2VC, this would be the VC timestamp.
  ts_load:
    description: Timestamp of when the table loaded a given row.
