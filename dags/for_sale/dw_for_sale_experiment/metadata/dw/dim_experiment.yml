---
database_name: dw_for_sale_experiment
table_name: dim_experiment
owner: guilherme.rocha@quintoandar.com.br
domain: For Sale
description: Dimension table containing experiment metadata for For Sale line experiments.
  Each record represents a unique experiment configuration with its associated metadata and lifecycle information.
columns:
  sk_neotribe_exp:
    lineage:
      - datalake_for_sale_experiment.exp_1_1_visits_boosting_agents.id_neotribe
      - datalake_for_sale_experiment.exp_1_1_visits_boosting_agents.id_experiment
    description: Key combining neotribe and experiment identifiers for unique experiment identification.
  sk_neotribe:
    lineage:
      - datalake_for_sale_experiment.exp_1_1_visits_boosting_agents.id_neotribe
    description: Key for the neotribe conducting the experiment.
  sk_experiment:
    lineage:
      - datalake_for_sale_experiment.exp_1_1_visits_boosting_agents.id_experiment
    description: Key for the specific experiment within the neotribe.
  name_neotribe:
    lineage:
      - datalake_for_sale_experiment.exp_1_1_visits_boosting_agents.name_neotribe
    description: Name of the neotribe responsible for the experiment.
  name_experiment:
    lineage:
      - datalake_for_sale_experiment.exp_1_1_visits_boosting_agents.name_experiment
    description: Descriptive name of the experiment being conducted.
  identifier_type:
    lineage:
      - datalake_for_sale_experiment.exp_1_1_visits_boosting_agents.identifier_type
    description: Type of identifier used for experiment participants (e.g. VISITOR, AGENT, HOUSE).
  business_context:
    lineage:
      - datalake_for_sale_experiment.exp_1_1_visits_boosting_agents.business_context
    description: Business context in which the experiment is being conducted (e.g. RENT, SALE).
  documentation_link:
    lineage:
      - datalake_for_sale_experiment.exp_1_1_visits_boosting_agents.documentation_link
    description: Link to detailed experiment documentation and specifications.
  additional_information:
    lineage:
      - datalake_for_sale_experiment.exp_1_1_visits_boosting_agents.additional_information
    description: Additional context and methodology information about the experiment design and implementation.
  dt_started:
    lineage:
      - datalake_for_sale_experiment.exp_1_1_visits_boosting_agents.dt_started
    description: Start date of the experiment.
  dt_ended:
    lineage:
      - datalake_for_sale_experiment.exp_1_1_visits_boosting_agents.dt_ended
    description: End date of the experiment. NULL indicates an ongoing experiment.
