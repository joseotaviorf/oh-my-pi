---
database_name: datalake_sirena
table_name: messages
description: Table with all the messages that have been sent and processed via Sirena system. We have several fronts of operation that contact a client directly via Whatsapp.
  For this table, each line is a message.
domain: For Sale
owner: data-for-sale@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_sirena_clean.interactions.id
    description: >
      ID of each message sent via Sirena. Each line has its own id
  id_prospect:
    lineage:
      - datalake_sirena_clean.interactions.id_prospect
    description: >
      ID of the prospect being contacted by the agent.
  id_house:
    lineage:
      - datalake_sirena_clean.prospects.last_name
    description: >
      ID of the house being treated in the messages in question. If it is a proactive contact from the user, it will be null.
  id_agent:
    lineage:
      - datalake_sirena_clean.interactions.id_agent
    description: >
      ID of the agent who sent the message.
  prospect_type: 
    description: > 
      Type of prospect being contacted by the agent. Can be one of these:
    categories: 
      Buyer: > 
        If the prospect is a buyer.
      Seller: >
        If the prospect is a seller.
      "null": >
        If a proactive prospect, and we don't know what your intent is.
  prospect_phone:
    description: > 
      Phone number of the prospect being contacted by the agent.
  group_name:
    description: > 
      Which initiative is contacting the user. It could be Documentation Aid, CS, ForSale, Rede, Benvi and other entities. 
  agent_first_name:
    lineage:
      - datalake_sirena_clean.agents.first_name
    description:
      First name of the agent who sent the message.
  agent_last_name:
    lineage:
      - datalake_sirena_clean.agents.last_name
    description: >
      Last name of the agent who sent the message.
  agent_phone:
    lineage:
      - datalake_sirena_clean.agents.phone
    description: >
      Phone number of the agent who sent the message.
  agent_email:
    lineage:
      - datalake_sirena_clean.agents.email 
    description: >
      Email of the agent who sent the message.
  via:
    lineage:
      - datalake_sirena_clean.interactions.via
    description: >
      Channel through which the message was sent. Only WhatsApp.
  message_type: 
    description: > 
      Type of message sent by the agent.
    categories: 
      Anexo: > 
        If the message is an attachment. It can be an audio, an image or a sticker sent via WhatsApp.
      Texto: >
        If the message is a text.
  template:
    lineage:
      - datalake_sirena_clean.interactions.output
    description: >
      UUID of the template sent in the message
  message_content: 
    description: 
      Content of the message sent by the agent.
  is_client:
    description: >
      If the prospect is a client of QuintoAndar.
  is_proactive:
    lineage:
      - datalake_sirena_clean.interactions.is_proactive
    description:
      If you were the person who proactively contacted the agent's number and are not a QuintoAndar client.
  ts_created:
    lineage:
      - datalake_sirena_clean.interactions.ts_created
    description: >
      Timestamp of the message sent. 