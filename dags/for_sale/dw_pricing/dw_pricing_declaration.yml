dag:
  name: dw_pricing
  schedule_start_date: 2022, 1, 1
  owner: Data ForSale
  documentation:
    dag_purpose: "This DAG loads to DW the pricing modeling, i.e., all the changes made to a listing price."
workflow:
  type: query_delta
  layer: dw
  custom_schema: listing
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  spark_job_arguments:
    - "{environment}"
    - "{bucket}"
    - "{schema}"
    - "{dag_name}"
    - "{table_name}"
    - "{load_start_date}"
    - "{load_end_date}"
    - "prod"
  tables_customization:
    dim_pricing:
      load_spark_job: load_dim_pricing
    fact_price_changes:
      load_spark_job: load_fact_price_changes
    dim_price_suggested:
      load_spark_job: load_dim_price_suggested
      merge_on: ['sk_price_suggested']
    fact_price_suggested:
      load_spark_job: load_fact_price_suggested
      merge_on: ['sk_price_suggested']
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: r5d.2xlarge
    node_type_id: r5d.xlarge
    num_workers: 2
    spark_version: 16.4.x-scala2.12
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
  databricks_conn_id: databricks_new_env
