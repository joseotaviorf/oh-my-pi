database_name: datalake_nps_answer_drivers
table_name: answer_drivers
domain: For Sale
columns:
  id_answer:
    lineage:
    - datalake_tracksale.answer.id
    description: Identifier of the Tracksale NPS survey answer linked to its driver entities.
  id_house_listing:
    lineage:
    - datalake_tracksale.answer_tags.tag_value
    - datalake_ebdb_listing.house_listing.id_house_listing
    description: Identifier of the house listing the NPS answer refers to, resolved from the answer house tag.
  id_listing:
    lineage:
    - datalake_ebdb_clean.house.id
    description: Foreign key to the property listing record in the catalog domain.
  id_booking:
    lineage:
    - datalake_tracksale.answer_tags.tag_value
    description: Natural key of the visit booking (agendamento) in EBDB scheduling.
  id_tta:
    lineage:
    - datalake_tracksale.answer_tags.tag_value
    description: Identifier of the talk-to-agent interaction tagged on the NPS answer.
  id_offer_context:
    lineage:
    - datalake_tracksale.answer_tags.tag_value
    description: Identifier of the sale offer tagged on the NPS answer, validated against EBDB and sale offer flows.
  id_contract:
    lineage:
    - datalake_tracksale.answer_tags.tag_value
    description: Identifier of the EBDB contract tagged on the NPS answer.
owner: guilherme.rocha@quintoandar.com.br
description: Enriched answer drivers table combining upstream clean and warehouse sources for Enriched NPS answer driver tables for For Sale customer satisfaction. Rows are shaped for analytics with derived attributes and business keys.
