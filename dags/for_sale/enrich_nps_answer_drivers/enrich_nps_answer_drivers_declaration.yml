---
dag:
  name: enrich_nps_answer_drivers
  schedule_start_date: 2020, 7, 30
  owner: Data ForSale
  documentation:
    dag_purpose: Prepares [Tracksale](https://www.tracksale.co/) and EBDB ([Main's](https://github.com/quintoandar/main) database)
       data for business utilization. Tracksale is an external service that manages NPS data.
workflow:
  type: query_delta
  layer: enrich
cluster:
  type: databricks_12_2_med_general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
