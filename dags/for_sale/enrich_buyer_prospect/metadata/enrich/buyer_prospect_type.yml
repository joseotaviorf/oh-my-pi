---
database_name: datalake_buyer_prospect
table_name: buyer_prospect_category
owner: leonardo.soares@quintoandar.com.br
domain: for_sale
description: Table with categorization of buyer prospects of High Ticket and if is new prospect or recovery.
  prospect
columns:
  id_prospect:
    description: 'Id of the prospect, or buyer.'
    lineage:
    - datalake_demand_flows.buyer_prospect_status.id_buyer_prospect
  id_region:
    description: 'Id of the region of the prospect'
    lineage:
    - datalake_ebdb_clean.house.id_region
  id_first_booking:
    description: 'Id of the first booking of the prospect.'
    lineage:
    - datalake_booking.booking.id_booking
  id_house_first_booking:
    description: 'Id of the house of the first booking of the prospect.'
    lineage:
    - datalake_booking.booking.id_house
  sk_buyer_prospect_type:
    description: 'Surrogate key of the buyer prospect.'
  bp_type:
    description: 'Buyer prospect type, if is new prospect or recovery prospect.'
    categories:
      "NBP": "New Buyer Prospect."
      "RBP": "Recovery Buyer Prospect."
    lineage:
    - datalake_demand_flows.buyer_prospect_status.event_name
  city_group:
    description: 'City group of the prospect.'
    lineage:
    - datalake_demand_flows.buyer_prospect_status.city_group
  price_segment:
    description: 'Segmentation of the ticket of the first visit of the prospect.'
    categories:
      "High Ticket": "High Ticket"
      "Low Ticket": "Low Ticket"
    lineage:
    - datalake_sale_listings.sale_listing_price_changes.price_segment
  ts_activation:
    description: 'Date of activation of the prospect.'
    lineage:
    - atalake_demand_flows.buyer_prospect_status.ts_status_started
  ts_activation_end:
    description: 'Date of end of activation of the prospect.'
    lineage:
    - datalake_demand_flows.buyer_prospect_status.ts_activation_end
  ts_first_booking:
    description: 'Timestamp of the first booking of the prospect.'
    lineage:
    - datalake_booking.booking.ts_created
  ts_load:
    description: 'Timestamp of the load of the data.'
