  follow_up_financing_specialist_name:
    description: FUP Financing Specialist name
    lineage:
      - datalake_sales_flow.offer_specialists.follow_up_financing_specialist_name
  follow_up_financing_specialist_email:
    description: FUP Financing Specialist e-mail
    lineage:
      - datalake_sales_flow.offer_specialists.follow_up_financing_specialist_email
  end_financing_specialist_name:
