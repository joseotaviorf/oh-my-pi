  pendency:
    description: Open pendency or blocker item preventing the sales flow from advancing.
    lineage:
    - datalake_sales_flow_clean.sales_flow_pendency.pendency
  pendency_type:
    description: Type or category of the open pendency blocking the sales flow.
    lineage:
    - datalake_sales_flow_clean.sales_flow_pendency.type
  financing_bank:
    lineage:
    - datalake_sales_flow_clean.mortgage.bank
    description: Bank name used on this offer financing
  opportunities_of_the_week:
    description: In For Sale it's every lead qualified in the week for the CRI or MA process. In Rent is every listing published, with at least one scheduled in the week. This information is not used by the For Sale operation team, because of the new business model of Closing Assistance.
    lineage:
    - datalake_sales_flow_clean.sales_flow_details.opportunities_of_the_week
  flow_step:
    description: Which step this offer is on the sale process.
    lineage:
    - datalake_sales_flow_clean.sales_flow.flow_step
  vendas_offer_status:
    lineage:
    - datalake_sales_flow_clean.offer.status
    description: Offer status as recorded in the Vendas (SalesFlow) offer table, tracking the buyer/seller negotiation lifecycle before a sale agreement (CCV) exists.
    categories:
      DEFAULT: Offer created and not yet processed/triaged.
      OFFER_ONGOING: Offer is in active negotiation between buyer and seller.
      CONTRA_SELLER: Seller has made a counter-offer.
      CONTRA_BUYER: Buyer has made a counter-offer.
      OFFER_ACCEPTED: Offer was accepted by the seller.
      OFFER_REJECTED: Offer was rejected/discarded.
      STAND_BY_BUYER: Negotiation is paused waiting on the buyer.
      STAND_BY_SELLER: Negotiation is paused waiting on the seller.
      NO_CONTACT_BUYER: Buyer could not be reached.
      NO_CONTACT_SELLER: Seller could not be reached.
      OFFER_VALIDATED: Offer passed validation checks.
      INVALID_OFFER: Offer failed validation and was invalidated.
      BROKER_TEST: Test offer created by/for a broker, not a real transaction.
      POST_ACCEPTED_DISPOSAL: Offer was discarded/disposed after having been accepted.
      BROKER_SELLER: Offer flow involving a broker representing the seller.
      NEGOTIATION_OUT_OF_5A: Negotiation is proceeding outside QuintoAndar's standard (5A) model.
      BLANK_CHAT: Negotiation chat was opened but no messages were exchanged.
      OA_VALIDATION: Offer is under validation by the offer-acceptance (OA) process.
  sale_agreement_status:
    lineage:
    - datalake_sales_flow_clean.ccv_flow.status
    description: Current status of the sale agreement (CCV - Contrato de Compra e Venda) flow, tracking drafting and signature after an offer is accepted.
    categories:
      PENDING_DOCUMENTATION: Waiting on buyer/seller documentation before drafting the CCV.
      SEND_TO_CCV_QUEUE: Queued to have the CCV document drafted.
      SEND_TO_BE_SIGNED: CCV draft is ready and sent out for signature.
      SIGNED: CCV has been signed by all required parties.
      LEGAL_PENDING_ISSUES: Blocked on a legal/compliance issue.
      VISIT_REVISIT: Blocked pending a property (re)visit.
      NO_RETURN_FROM_BUYER_OR_SELLER: Blocked because buyer or seller has not responded.
      FINANCIAL_ISSUE: Blocked on a financial issue (e.g. payment/financing problem).
      RIGHT_OF_FIRST_REFUSAL: Blocked pending right-of-first-refusal (direito de preferência) resolution.
      OFFER_UNDER_ANALYSIS: The underlying offer is still under analysis.
      ANOTHER_OFFER_ONGOING: Blocked because another competing offer is in progress for the same house.
      SEND_TO_QUICK_QUEUE: Routed to an expedited processing queue.
      SEND_TO_OPERATIONS_SUPPORT: Routed to operations support for manual handling.
  negotiation_model:
    description: Which SalesFlow negotiation model/channel originated this offer's sales flow (standard Deal Maker-led flow, HUB, or Closing Central). Same raw value as flow_type.
    lineage:
    - datalake_sales_flow_clean.sales_flow.flow_type
    categories:
      DEFAULT: Standard negotiation model, led by a Deal Maker/specialist team.
      HUB: Offer originated through the HUB negotiation channel.
      CLOSING_CENTRAL: Offer originated through the Closing Central channel.
  flow_type:
    description: Raw SalesFlow negotiation model/channel value for this offer's sales flow. Identical source value as negotiation_model, kept for backward compatibility with existing consumers.
    lineage:
    - datalake_sales_flow_clean.sales_flow.flow_type
    categories:
      DEFAULT: Standard negotiation model, led by a Deal Maker/specialist team.
      HUB: Offer originated through the HUB negotiation channel.
      CLOSING_CENTRAL: Offer originated through the Closing Central channel.
  vendas_offer_flow:
    description: >-
      Grouped/simplified version of the negotiation channel for reporting. Built by pattern-matching
      sales_flow.flow_type: any value containing 'HUB' maps to HUB, any value containing 'CENTRAL'
      maps to CENTRAL, and the exact value 'DEFAULT' maps to DEAL_MAKING (any other value yields
      NULL).
    lineage:
    - datalake_sales_flow_clean.sales_flow.flow_type
    categories:
      HUB: Offer is following the HUB negotiation channel.
      CENTRAL: Offer is following the Closing Central negotiation channel.
      DEAL_MAKING: Offer is following the standard, Deal Maker-led negotiation channel.
  has_used_negotiation_chat:
    lineage:
    - datalake_sales_flow_clean.sales_flow.flow_type
    description: If the buyer has used the negotiation chat
  sale_agreement_cancellation_reason:
    lineage:
    - datalake_sales_flow_clean.sales_flow.closing_canceled_reason
    description: Reason why a sales contract was cancelled.
  drop_reason:
    lineage:
    - datalake_sales_flow_clean.offer.discard_reason
    - datalake_sales_flow_clean.reject_reason.reason
    description: >-
      Detailed reason why an offer was discarded/rejected. Built as reject_reason.reason when a
      structured rejection reason exists, falling back to offer.discard_reason otherwise. Both
      source columns are large, evolving enums in SalesFlow (offer.discard_reason has ~60+ values,
      many prefixed OBSOLETE_ and no longer used; reject_reason.reason has ~65 values, about 25
      currently active and the rest marked inactive) — see SalesFlow's DiscardReason and Reason enum
      classes for the authoritative, current value list rather than a static mapping here.
  drop_reason_responsible:
    lineage:
    - datalake_sales_flow_clean.reject_reason.source
    - datalake_sales_flow_clean.offer.discard_reason
    description: >-
      Which party is considered responsible for dropping/rejecting the offer. Built by taking
      reject_reason.source when present (mapped to Buyer/Seller, with LISTING and BROKERS_3P source
      values also falling into Other), otherwise falling back to keyword-matching 'buyer'/'seller' in
      offer.discard_reason; anything else is classified as Other.
    categories:
      Buyer: The buyer is responsible for the offer being dropped.
      Seller: The seller is responsible for the offer being dropped.
      Other: Responsibility could not be attributed to buyer or seller (e.g. listing- or partner-broker-related reasons, or an unclassified reason).
  credit_model:
    lineage:
    - datalake_sales_flow_clean.mortgage.credit_model
    description: Credit/mortgage origination model used for the mortgage financing on this offer (who originates and manages the credit).
    categories:
      ATTA: Mortgage originated internally through QuintoAndar's own credit product (ATTA).
      EXTERNAL: Mortgage originated with an external bank/credit provider, outside ATTA.
      UNDEFINED: Credit model has not yet been defined for this offer.
      INTERNAL: Legacy/deprecated internal credit model, predating ATTA; no longer used for new offers.
  payment_model:
    description: Payment model / operational track used to close the purchase of the property (e.g. cash-only transfer, standard advance payment, instant mortgage, closing assistance).
    lineage:
    - datalake_sales_flow_clean.payment.payment_model
    categories:
      NA: Not applicable / not defined for this offer.
      TRANSFER_BETWEEN_PARTS: Payment happens directly between buyer and seller, without QuintoAndar's standard flow.
      MODEL_5A: Legacy "5A" model (Repasses), where QuintoAndar holds and passes through payments.
      ADVANCED_PAYMENT: Standard payment model with an advance/down payment.
      INSTANT_MORTGAGE: Fast-track mortgage model ("Chave Antecipada") allowing early key delivery.
      CCV_ASSISTANCE: QuintoAndar only assists with the sale agreement (CCV), without managing the full closing.
      BROKERAGE_TERM: Payment is governed by a brokerage term (Termo de Corretagem) rather than the standard flow.
      CLOSING_3P: Closing handled by a partner real-estate agency (Rede) rather than directly by QuintoAndar.
      CLOSING_PRIMARY_MARKET: Closing for a primary-market (new/developer) property purchase.
  payment_method:
    description: Current payment method chosen for the offer, indicating whether the buyer pays cash or uses financing, and whether FGTS funds are used.
    lineage:
    - datalake_sales_flow_clean.payment.payment_method
    categories:
      CASH: Cash purchase, not using FGTS funds.
      CASH_USING_FGTS: Cash purchase using FGTS (severance fund) funds.
      FINANCED: Financed (mortgage) purchase, not using FGTS funds.
      FINANCED_USING_FGTS: Financed (mortgage) purchase using FGTS funds.
      FINANCED_USING_THIRD_COMPANY: Financed through a third-party/outside institution rather than QuintoAndar's standard flow (legacy alias 'FINANCED_OUTSIDE_5A').
      NOT_DEFINED: Payment method not yet decided (legacy alias 'UNDECIDED').
  planned_payment_method:
    lineage:
    - datalake_sales_flow_clean.payment.payment_method
    description: >-
      Payment method the buyer initially planned at offer creation (first recorded value from the
      payment audit history), before any later changes. Same category values as payment_method.
    categories:
      CASH: Cash purchase, not using FGTS funds.
      CASH_USING_FGTS: Cash purchase using FGTS (severance fund) funds.
      FINANCED: Financed (mortgage) purchase, not using FGTS funds.
      FINANCED_USING_FGTS: Financed (mortgage) purchase using FGTS funds.
      FINANCED_USING_THIRD_COMPANY: Financed through a third-party/outside institution rather than QuintoAndar's standard flow (legacy alias 'FINANCED_OUTSIDE_5A').
      NOT_DEFINED: Payment method not yet decided (legacy alias 'UNDECIDED').
