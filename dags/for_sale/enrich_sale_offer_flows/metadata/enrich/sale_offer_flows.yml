database_name: datalake_sale_offer_flows
table_name: sale_offer_flows
owner: herivelto.macedo@quintoandar.com.br
domain: For Sale
description: Enriched table to sales flow database. The purpose of this table is to
  consolidate all offer information from the sales base.
columns:
  id_offer:
    lineage:
      - datalake_sales_flow_clean.offer.id_firestore
    description: Offer unique identifier.
  id_user_consultant:
    lineage:
      - datalake_sales_flow.offer_specialists.id_user_consultant
    description: Deal Maker user ID on main (EBDB) tables
  id_consultant:
    lineage:
      - datalake_sales_flow.offer_specialists.id_consultant
    description: Deal Maker user ID on SalesFlow tables
  id_buyer:
    lineage:
      - datalake_sales_flow_clean.sales_flow.id_buyer
      - datalake_sales_flow_clean.users.id_external
    description: Identification key of the user who sent the offer.
  id_seller:
    lineage:
      - datalake_sales_flow_clean.sales_flow.id_seller
      - datalake_sales_flow_clean.users.id_external
    description: House owner to whom an offer has been sent.
  id_house:
    lineage:
      - datalake_sales_flow_clean.house.id_external
    description: Identification key of the house linked to the offer.
  id_sale_flow:
    lineage:
      - datalake_sales_flow_clean.offer.id_buyer
      - datalake_sales_flow_clean.users.id_external
      - datalake_sales_flow_clean.house.id_external
    description: Identification key for the sales flow linked to an offer. Concat buyer and house.

  id_sales_flow:
    lineage:
      - datalake_firestore.sale_offer.id_sale_flow
    description: Identification key for the sales flow linked to an offer.

  sk_user_team_lead:
    lineage:
      - datalake_sales_flow.offer_specialists.id_user_team_lead
    description: Team lead ID user on main (EBDB) tables
  sk_team_lead:
    lineage:
      - datalake_sales_flow.offer_specialists.id_team_lead
    description: Team lead ID user on SalesFlow tables
  id_user_pre_specialist:
    description: ID user on main (EBDB) tables which the specialist type on datalake_sales_flow_clean.specialist is equal to 'PRE'
    lineage:
      - datalake_sales_flow.offer_specialists.id_user_pre_specialist
  id_pre_specialist:
    description: ID user on SalesFlow tables which the specialist type on datalake_sales_flow_clean.specialist is equal to 'PRE'
    lineage:
      - datalake_sales_flow.offer_specialists.id_pre_specialist
  id_user_post_specialist:
    description: ID user on main (EBDB) tables which the specialist type on datalake_sales_flow_clean.specialist is equal to 'POST'
    lineage:
      - datalake_sales_flow.offer_specialists.id_user_post_specialist
  id_post_specialist:
    description: ID user on SalesFlow tables which the specialist type on datalake_sales_flow_clean.specialist is equal to 'POST'
    lineage:
      - datalake_sales_flow.offer_specialists.id_post_specialist
  id_user_credit_specialist:
    description: ID user on main (EBDB) tables which the specialist type on datalake_sales_flow_clean.specialist is equal to 'CREDIT'
    lineage:
      - datalake_sales_flow.offer_specialists.id_user_credit_specialist
  id_credit_specialist:
    description: ID user on SalesFlow tables which the specialist type on datalake_sales_flow_clean.specialist is equal to 'CREDIT'
    lineage:
      - datalake_sales_flow.offer_specialists.id_credit_specialist
  id_user_start_financing_specialist:
    description: ID user on main (EBDB) tables which the specialist type on datalake_sales_flow_clean.specialist is equal to 'MORTGAGE_START'
    lineage:
      - datalake_sales_flow.offer_specialists.id_user_start_financing_specialist
  id_start_financing_specialist:
    description: ID user on SalesFlow tables which the specialist type on datalake_sales_flow_clean.specialist is equal to 'MORTGAGE_START'
    lineage:
      - datalake_sales_flow.offer_specialists.id_start_financing_specialist
  id_user_follow_up_financing_specialist:
    description: ID user on main (EBDB) tables which the specialist type on datalake_sales_flow_clean.specialist is equal to 'MORTGAGE_FUP'
    lineage:
      - datalake_sales_flow.offer_specialists.id_user_follow_up_financing_specialist
  id_follow_up_financing_specialist:
    description: ID user on SalesFlow tables which the specialist type on datalake_sales_flow_clean.specialist is equal to 'MORTGAGE_FUP'
    lineage:
      - datalake_sales_flow.offer_specialists.id_follow_up_financing_specialist
  id_user_end_financing_specialist:
    description: ID user on main (EBDB) tables which the specialist type on datalake_sales_flow_clean.specialist is equal to 'MORTGAGE_END'
    lineage:
      - datalake_sales_flow.offer_specialists.id_user_end_financing_specialist
  id_end_financing_specialist:
    description: ID user on SalesFlow tables which the specialist type on datalake_sales_flow_clean.specialist is equal to 'MORTGAGE_END'
    lineage:
      - datalake_sales_flow.offer_specialists.id_end_financing_specialist
  id_user_notes_registry_specialist:
    description: ID user on main (EBDB) tables which the specialist type on datalake_sales_flow_clean.specialist is equal to 'CRN'
    lineage:
      - datalake_sales_flow.offer_specialists.id_user_notes_registry_specialist
  id_notes_registry_specialist:
    description: ID user on SalesFlow tables which the specialist type on datalake_sales_flow_clean.specialist is equal to 'CRN'
    lineage:
      - datalake_sales_flow.offer_specialists.id_notes_registry_specialist
  id_user_real_estate_register_specialist:
    description: ID user on main (EBDB) tables which the specialist type on datalake_sales_flow_clean.specialist is equal to 'CRI'
    lineage:
      - datalake_sales_flow.offer_specialists.id_user_real_estate_register_specialist
  id_real_estate_register_specialist:
    description: ID user on SalesFlow tables which the specialist type on datalake_sales_flow_clean.specialist is equal to 'CRI'
    lineage:
      - datalake_sales_flow.offer_specialists.id_real_estate_register_specialist
  id_user_legal_risk_analyst:
    description: ID user on main (EBDB) tables which the specialist type on datalake_sales_flow_clean.specialist is equal to 'LEGAL_RISK'
    lineage:
      - datalake_sales_flow.offer_specialists.id_user_legal_risk_analyst
  id_legal_risk_analyst:
    description: ID user on SalesFlow tables which the specialist type on datalake_sales_flow_clean.specialist is equal to 'LEGAL_RISK'
    lineage:
      - datalake_sales_flow.offer_specialists.id_legal_risk_analyst
  id_user_agent:
    lineage:
      - datalake_sales_flow.offer_specialists.id_user_agent
    description: Broker identification key linked to the offer on main tables (EBDB)
  id_agent:
    description: Broker identification key linked to the offer on SalesFlow specialist table. Although it has the same name, it is NOT
      the same as the id_agent or sk_agent anywhere else other than SalesFlow. Only use it to join with datalake_sale_offer_flows.offer_specialists or
      tables in datalake_sales_flow_clean.
    lineage:
      - datalake_sales_flow.offer_specialists.id_agent
  id_user_post_dd_specialist:
    description: ID user on main (EBDB) tables which the specialist type on datalake_sales_flow_clean.specialist is equal to 'POST_DD'
    lineage:
      - datalake_sales_flow.offer_specialists.id_user_post_dd_specialist
  id_post_dd_specialist:
    description: ID user on SalesFlow tables which the specialist type on datalake_sales_flow_clean.specialist is equal to 'POST_DD'
    lineage:
      - datalake_sales_flow.offer_specialists.id_post_dd_specialist
  id_pendency:
    lineage:
      - datalake_sales_flow_clean.sales_flow_pendency.id
    description: Identification key for this offer pendencies on table pendency
  id_hub:
    description: ID to get more information abou the HUB on HubServices tables.
    lineage:
      - datalake_sales_flow_clean.offer.id_hub
  pendency:
    description: Pendency name
    lineage:
      - datalake_sales_flow_clean.sales_flow_pendency.pendency
  pendency_type:
