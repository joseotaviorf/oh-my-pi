    lineage:
      - datalake_sales_flow_clean.sales_flow_pendency.type
  financing_bank:
    lineage:
      - datalake_sales_flow_clean.mortgage.bank
    description: Bank name used on this offer financing
  opportunities_of_the_week:
    description: In For Sale it's every lead qualified in the week for the CRI or MA process. In Rent is every listing published,
      with at least one scheduled in the week. This information is not used by the For Sale operation team,
      because of the new business model of Closing Assistance.
    lineage:
      - datalake_sales_flow_clean.sales_flow_details.opportunities_of_the_week
