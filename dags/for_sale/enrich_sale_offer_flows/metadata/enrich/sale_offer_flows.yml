database_name: datalake_sale_offer_flows
table_name: sale_offer_flows
owner: helder.rodrigues@quintoandar.com.br
domain: For Sale
description: >-
  Enriched table consolidating For Sale offer information from Sales Flow and related services.
  One row per offer (id_offer), the primary key shared with enrich_sale_offer_flows.offer_specialists
  (specialist assignments) and, downstream of CCV signing, with enrich_sale_closing_flows.closing_flow
  and enrich_sale_salesforce.purchase_sale_contract (the Salesforce mirror of the same deal).
  id_sales_flow is the join key to enrich_sale_offer_flows.sale_offer_status (funnel step/status),
  sale_offer_users and sale_offer_users_info (parties involved in the offer). id_sale_flow links
  back to enrich_sale_flows.sale_flow, the pre-offer discovery journey for the same buyer/house.
  id_house can be joined with dw_house.dim_house and enrich_sale_flows.house_address_data/house_offers;
  id_buyer/id_seller can be joined with dw_public.dim_user. id_sale_flow lineage includes
  datalake_firestore.sale_offer, a static table from the deprecated enrich_sale_firestore pipeline
  (legacy Firestore/Monday system inactive since 2024); Firestore-sourced identifiers reflect
  historical records only.
columns:
  id_offer:
    lineage:
    - datalake_sales_flow_clean.offer.id_firestore
    description: Offer unique identifier.
  id_user_consultant:
    lineage:
    - datalake_sales_flow.offer_specialists.id_user_consultant
    description: Deal Maker user ID on main (EBDB) tables
  id_consultant:
    lineage:
    - datalake_sales_flow.offer_specialists.id_consultant
    description: Deal Maker user ID on SalesFlow tables
  id_buyer:
    lineage:
    - datalake_sales_flow_clean.sales_flow.id_buyer
    - datalake_sales_flow_clean.users.id_external
    description: Identification key of the user who sent the offer.
  id_seller:
    lineage:
    - datalake_sales_flow_clean.sales_flow.id_seller
    - datalake_sales_flow_clean.users.id_external
    description: House owner to whom an offer has been sent.
  id_house:
    lineage:
    - datalake_sales_flow_clean.house.id_external
    description: Identification key of the house linked to the offer.
  id_sale_flow:
    lineage:
    - datalake_sales_flow_clean.offer.id_buyer
    - datalake_sales_flow_clean.users.id_external
    - datalake_sales_flow_clean.house.id_external
    description: Identification key for the sales flow linked to an offer. Concat buyer and house.
  id_sales_flow:
    lineage:
    - datalake_firestore.sale_offer.id_sale_flow
    description: Identification key for the sales flow linked to an offer. Sourced from datalake_firestore static snapshot (legacy Firestore/Monday system inactive since 2024).
  sk_user_team_lead:
    lineage:
    - datalake_sales_flow.offer_specialists.id_user_team_lead
    description: Team lead ID user on main (EBDB) tables
  sk_team_lead:
    lineage:
    - datalake_sales_flow.offer_specialists.id_team_lead
    description: Team lead ID user on SalesFlow tables
  id_user_pre_specialist:
    description: ID user on main (EBDB) tables which the specialist type on datalake_sales_flow_clean.specialist is equal to 'PRE'
    lineage:
    - datalake_sales_flow.offer_specialists.id_user_pre_specialist
  id_pre_specialist:
    description: ID user on SalesFlow tables which the specialist type on datalake_sales_flow_clean.specialist is equal to 'PRE'
    lineage:
    - datalake_sales_flow.offer_specialists.id_pre_specialist
  id_user_post_specialist:
    description: ID user on main (EBDB) tables which the specialist type on datalake_sales_flow_clean.specialist is equal to 'POST'
    lineage:
    - datalake_sales_flow.offer_specialists.id_user_post_specialist
  id_post_specialist:
    description: ID user on SalesFlow tables which the specialist type on datalake_sales_flow_clean.specialist is equal to 'POST'
    lineage:
    - datalake_sales_flow.offer_specialists.id_post_specialist
  id_user_credit_specialist:
    description: ID user on main (EBDB) tables which the specialist type on datalake_sales_flow_clean.specialist is equal to 'CREDIT'
    lineage:
    - datalake_sales_flow.offer_specialists.id_user_credit_specialist
  id_credit_specialist:
    description: ID user on SalesFlow tables which the specialist type on datalake_sales_flow_clean.specialist is equal to 'CREDIT'
    lineage:
