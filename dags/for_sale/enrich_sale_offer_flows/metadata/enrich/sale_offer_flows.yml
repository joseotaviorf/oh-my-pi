    lineage:
    - datalake_sales_flow.offer_specialists.post_dd_specialist_name
  post_dd_specialist_email:
    description: Post DD Specialist e-mail
    lineage:
    - datalake_sales_flow.offer_specialists.post_dd_specialist_email
  closing_status:
    description: Current step of the sales flow's overall closing process, spanning onboarding through post-closing seller payment/cancellation.
    lineage:
    - datalake_sales_flow_clean.sales_flow.status_closing
    categories:
      ONBOARDING: Sales flow just started, initial onboarding of the transaction.
      EARNEST_PAYMENT: Waiting on the earnest/sinal payment.
      DILIGENCE: House/seller due diligence is in progress.
      CREDIT_ANALYSIS: Buyer's mortgage credit is under analysis.
      DOWN_OR_CASH_PAYMENT: Waiting on the down payment or full cash payment.
      DOCS_DELIVERY: Waiting on document delivery.
      FINANCING_ANALYSIS: Financing/mortgage is under bank analysis.
      FINANCING_CONFIRM: Financing terms are being confirmed.
      FINANCING_SIGNATURE: Waiting on financing contract signature.
      CASH_SIGNATURE: Waiting on cash-purchase contract signature.
      EXPENSES_PAYMENT: Waiting on payment of closing expenses (fees/taxes).
      VALUES_TRANSFER_5A: Values are being transferred through QuintoAndar's 5A flow.
      CRI: In the real-estate registry (Cartório de Registro de Imóveis) step.
      SELLER_PAYMENT: Seller has been paid; transaction effectively concluded.
      WAITING_FINANCING_RESOURCES: Waiting for the financing institution to release funds.
      END: Closing process finished.
      DILIGENCE_CANCELED: Transaction was canceled during the diligence step.
      CANCELED: Transaction was canceled.
  house_dilligence_status:
    lineage:
    - datalake_sales_flow_clean.house.house_registration_status
    description: Status of the house's registration/documentation diligence process (Matrícula analysis).
    categories:
      NOT_STARTED: House registration diligence has not started.
      SIMPLE_APPOINTMENT: Simple appointment/note found on the registration (Apontamento Simples).
      NO_APPOINTMENT: No appointment/restriction found on the registration.
      NO_GO_APPOINTMENT: A blocking appointment/restriction was found; diligence fails the house.
      PROCESSING: Registration document is being processed/analyzed.
      DIVERGENT_SELLER: Seller on the registration diverges from the seller in the offer (PP divergente).
      FIDUCIARY_SALE: Property is under a fiduciary sale/alienation (Alienação Fiduciária).
      FIDUCIARY_SALE_DEBTS: Property is under fiduciary sale/alienation and also has associated debts.
      SHARING_ASSETS: Property is under an asset-sharing process (partilha de bens), e.g. divorce/inheritance.
  diligence_appointment_reason:
    description: Concatenated list of diligence appointment reasons for the offer.
    lineage:
    - datalake_sales_flow_clean.diligence_appointment.appointment
  seller_dilligence_status:
    lineage:
    - datalake_sales_flow_clean.diligence.classification
    description: Risk classification of the seller/property diligence analysis for this offer.
    categories:
      NOT_STARTED: Diligence classification has not started.
      NO_APPOINTMENT: No appointment/issue found during diligence.
      LIGHT_APPOINTMENT: A light-severity appointment/issue was found.
      MODERATE_APPOINTMENT: A moderate-severity appointment/issue was found.
      CRITICAL_APPOINTMENT: A critical-severity appointment/issue was found.
      NO_GO_APPOINTMENT: A blocking appointment/issue was found; diligence fails the offer.
      LOW_RISK: Diligence classified the offer as low risk.
      MODERATE_RISK: Diligence classified the offer as moderate risk.
      HIGH_RISK: Diligence classified the offer as high risk.
      NO_GO_HIGH_RISK: Diligence classified the offer as high risk and blocking (no-go).
  report_dilligence_status:
    description: Current step of the diligence report's preparation and delivery workflow.
    lineage:
    - datalake_sales_flow_clean.diligence.step
    categories:
      NOT_STARTED: Diligence report workflow has not started.
      LONG_TERM_PAYMENT: Deprecated legacy step, no longer used.
      REQUEST_DD_LEGAL_RISK: Due-diligence legal risk analysis was requested.
      PROCESSING: Report is being processed.
      PENDING: Deprecated legacy step, no longer used.
      DOC_AVAILABLE: Underlying documentation is available.
      REPORT_UNDER_PREPARATION: Diligence report is being prepared.
      REPORT_AVAILABLE: Diligence report is ready.
      REPORT_SENT_SELLER: Diligence report was sent to the seller.
      REPORT_SENT_BUYER: Diligence report was sent to the buyer.
      CANCELLED: Diligence report workflow was cancelled.
  bank_analysis_status:
    description: Status of the bank's mortgage financing analysis/process for the offer.
    lineage:
    - datalake_sales_flow_clean.mortgage.status
    categories:
      NOT_STARTED: Mortgage process has not started.
      NEW: Mortgage process just created.
      DOCS_PENDING: Waiting on documents from the buyer.
      READY_TO_REVISION: Documents ready for revision.
      STARTED: Mortgage process has started.
      INSPECTION: Property inspection step for the mortgage.
      IQ_INFORMATION: Waiting on information from the tenant (IQ - inquilino).
      FGTS_WITHDRAW: FGTS withdrawal step in progress.
      VALUES_CONFIRMED: Financing values have been confirmed.
      CONTRACT_ISSUANCE: Financing contract is being issued.
      SIGNING: Financing contract is being signed.
      CONTRACT_CORRECTION: Financing contract needs correction.
      SIGNED: Financing contract has been signed.
      CREDIT_ANALYSIS: Credit is under bank analysis.
      BACK_REANALYZING: Bank is re-analyzing the credit (back office reanalysis).
      FRONT_PENDING: Pending action from the front-office/customer-facing step.
  payment_status:
    lineage:
    - datalake_sales_flow_clean.payment.status
    description: Current status of the payment associated with the offer.
  fgts_value:
    lineage:
    - datalake_sales_flow_clean.payment.fgts_value
    description: Fgts value used in the purchase.
  down_payment_value:
    lineage:
    - datalake_sales_flow_clean.payment.down_payment_value
    description: Entry amount paid by the buyer
  has_used_fgts_in_payment:
    lineage:
    - datalake_sales_flow_clean.payment.payment_method
    description: If the buyer has used FGTS in the payment
  entry_amount:
    lineage:
    - datalake_sales_flow_clean.payment.entry_amount
    description: Value paid by the buyer on the beginning of the contract.
  credit_status:
    description: >-
      Status of the buyer's credit analysis for the mortgage. Built by preferring the offer's most
      recent CREDIT_ANALYSIS micro-status name from sale_offer_status (a business-configured status
      value, not a fixed code enum) when available, and falling back to mortgage.credit_status
      otherwise. The categories below only cover the mortgage.credit_status fallback values.
    lineage:
    - datalake_sales_flow_clean.mortgage.credit_status
    - datalake_sale_offer_flows.sale_offer_status.credit_analysis_status_name
    categories:
      NA: Not applicable / no credit process for this offer.
      OPEN_TICKET: A credit-analysis ticket has been opened.
      SIMU_SENT: Financing simulation was sent to the buyer.
      WAITING_DOCUMENTATION: Waiting on buyer documentation for credit analysis.
      BANK_ANALYSIS: Credit is under the bank's analysis.
      APPROVED_CORRESP: Credit approved through a correspondent bank.
      EXTERNAL_CREDIT: Buyer is using an external credit letter (carta de crédito) not managed by QuintoAndar.
      APPROVED_DIFF_COND: Credit approved with different conditions than requested.
      APPROVED_OUTSIDE_5A: Credit approved outside QuintoAndar's standard (5A) flow.
      REJECTED: Credit was rejected (legacy/inactive value).
      CLIENT_ANALYSIS: Credit under the client's own analysis (legacy/inactive value).
  real_estate_register_office_status:
    description: Status at the real estate registry office (cartório de registro de imóveis) for recording the deed/title transfer.
    lineage:
    - datalake_sales_flow_clean.notary.status
    categories:
      NOT_STARTED: Registry process has not started.
      PROTOCOLED: Documents were protocoled (filed) at the registry office.
      REQUIREMENT_NOTE: Registry office issued a requirement note/exigência (legacy/inactive value).
      REGISTERED: Deed/title transfer has been registered.
      WITHDRAWN: Process was withdrawn from the registry office.
      FINISHED: Registry process is finished.
      PENDING: Registry process pending (legacy/inactive value).
      WAITING_SIGNATURE: Waiting on a signature required for registration.
      REQUIREMENT_NOTE_ANSWERED: Requirement note was answered (legacy/inactive value).
      REQUIREMENT_NOTE_PHYSICAL_SEND: Requirement note was physically sent (legacy/inactive value).
      REQUIREMENT_NOTE_PHYSICAL_SEND_ANSWERED: Physically-sent requirement note was answered (legacy/inactive value).
  notary_office_status:
    description: Status at the notary office (cartório de notas) for drafting and signing the offer's public deed (escritura).
    lineage:
    - datalake_sales_flow_clean.cash_payment.status_notary_notes
    categories:
      NOT_STARTED: Notary office process has not started.
      DRAFT_ORDER: Deed draft (minuta) has been ordered.
      DRAFT_AVAILABLE: Deed draft is available.
      DRAFT_IN_REVISION: Deed draft is under revision.
      PAUSED: Process paused at the notary office (legacy/inactive value).
      WAITING_PAYMENT: Waiting on payment of notary fees.
      WAITING_SCHEDULE: Waiting to schedule the signature appointment.
      SCHEDULED_SIGNATURE: Signature appointment has been scheduled.
      SIGNED: Deed has been signed at the notary office.
      OUTSIDE: Handled outside QuintoAndar's standard flow (Por Fora).
      DISTRACT: Process was called off/distracted (legacy/inactive value).
      LONG_TERM_PAYMENT: Legacy long-term payment step (legacy/inactive value).
  notary_office_details:
    description: Notary office status details
    lineage:
    - datalake_sales_flow_clean.cash_payment.crn_details
  tags_from_salesflow:
    description: Tags from the sales flow associated with the offer.
    lineage:
    - datalake_sales_flow_clean.tag.label
  brokerage_fee_payer:
    description: Who will pay the brokerage fee.
    lineage:
    - datalake_sales_flow_clean.brokerage.brokerage_fee_payer
    categories:
      BUYER: Buyer will pay the brokerage fee.
      SELLER: Seller will pay the brokerage fee.
  sale_listing_price:
    lineage:
    - datalake_sales_flow_clean.offer.sale_price
    description: House price sent in the publication by the seller.
  registry_price:
    lineage:
    - datalake_sales_flow_clean.offer.registry_price
    description: Registry value paid on the purchase
  itbi_price:
    lineage:
    - datalake_sales_flow_clean.offer.itbi_price
    description: ITBI value paid on the purchase
  first_price_offered_by_buyer:
    lineage:
    - datalake_sales_flow_clean.offer.offer_price
    description: First value offered by the buyer
  last_price_offered_by_buyer:
    lineage:
    - datalake_sales_flow_clean.offer.offer_price
    description: Last value offered by the buyer
  first_discount_proposed:
    description: First discount percentage proposed by the buyer relative to the sale price.
  last_discount_proposed:
    description: Last discount percentage proposed by the buyer relative to the sale price.
  sale_price_agreed:
    lineage:
    - datalake_sales_flow_clean.offer.final_price
    description: Final value, where the buyer and seller reached a negotiation agreement.
  brokerage_fee:
    lineage:
    - datalake_sales_flow_clean.brokerage.brokerage_fee
    description: Brokerage fee percentage. The default value is 6% of the sale price.
  quinto_andar_brokerage_split:
    lineage:
    - datalake_sales_flow_clean.brokerage.quinto_andar_brokerage_split
    description: QuintoAndar brokerage split percentage.
  days_sale_agreement_created_to_sale_agreement_signed:
    lineage:
    - datalake_sales_flow_clean.ccv_flow.ts_confection_started
    - datalake_sales_flow_clean.ccv_flow.ts_signed
    description: Date difference between sale agreement created and sale agreement signed
  days_offer_accepted_to_sale_agreement_signed:
    lineage:
    - datalake_sales_flow_clean.offer.ts_accepted
    - datalake_sales_flow_clean.ccv_flow.ts_signed
    description: Date difference between offer accepted and sale agreement signed
  days_offer_accepted_to_sale_agreement_created:
    lineage:
    - datalake_sales_flow_clean.offer.ts_accepted
    - datalake_sales_flow_clean.ccv_flow.ts_confection_started
    description: Date difference between offer accepted and sale agreement created
  days_offer_accepted_to_offer_dismissed:
    lineage:
    - datalake_sales_flow_clean.offer.ts_discarded
    - datalake_sales_flow_clean.offer.ts_accepted
    description: Date difference between offer accepted and offer dismissed
  has_seller_debt_payments:
    description: Flag indicating if there are seller payment debts
    lineage:
    - datalake_sales_flow_clean.house.has_seller_debt_payments
  is_ccv_canceled:
    lineage:
    - datalake_sales_flow_clean.sales_flow.is_canceled
    description: Boolean to identify if the cvv is cancelled.
  is_a_rescued_ccv:
    description: >-
      Boolean flag indicating this sales flow's sale agreement (CCV) was cancelled and then
      reopened/rescued. Built by detecting a transition on sales_flow_aud where is_canceled flips
      from TRUE back to FALSE after a prior cancellation with a closing_canceled_reason set.
    lineage:
    - datalake_sales_flow_clean.sales_flow_aud.is_canceled
    - datalake_sales_flow_clean.sales_flow_aud.closing_canceled_reason
    - datalake_sales_flow_clean.sales_flow_aud.ts_updated
  is_a_rescued_offer:
    description: >-
      Boolean flag indicating this offer was discarded/rejected and later re-accepted (rescued),
      rather than being accepted for the first time. Built by comparing offer acceptance and
      discard timestamps in offer_aud history (accepted after a later discard) and, for offers
      without that audit trail, by checking whether the parent sales flow is not canceled but still
      carries a prior cancellation timestamp.
    lineage:
    - datalake_sales_flow_clean.offer_aud.ts_accepted
    - datalake_sales_flow_clean.offer_aud.ts_discarded
    - datalake_sales_flow_clean.sales_flow.is_canceled
    - datalake_sales_flow_clean.sales_flow.ts_canceled
  is_ccv_5a_model:
    lineage:
    - datalake_sales_flow_clean.ccv_flow.is_5a_model
    description: Final price agreed for this offer
  dt_sale_agreement_created:
    lineage:
    - datalake_sales_flow_clean.ccv_flow.ts_confection_started
    description: Date when the CCV was created
  dt_sale_agreement_signed:
    description: Date when the CCV was signed
    lineage:
    - datalake_sales_flow_clean.ccv_flow.ts_signed
  dt_sale_agreement_cancelled:
    lineage:
    - datalake_sales_flow_clean.sales_flow_aud.ts_updated
    description: Date when the CCV was cancelled
  dt_offer_rescued:
    lineage:
    - datalake_sales_flow_clean.sales_flow_aud.ts_updated
    description: Date when the offer as rescued.
  dt_sale_agreement_rescued:
    lineage:
    - datalake_sales_flow_clean.sales_flow_aud.ts_updated
    description: Date when the CCV was rescued
  dt_onboarding_ended:
    description: Date when the onboarding process ended
    lineage:
    - datalake_sales_flow_clean.sales_flow_aud.ts_updated
    - datalake_sale_offer_flows.sale_offer_status.ts_macro_status_end
  dt_diligence_buyer_sent_at:
    description: Date of submission of due diligence document for Buyer's signature. The Seller is the first to receive the document for signature.
    lineage:
    - datalake_sales_flow_clean.diligence.ts_buyer_sent
  dt_diligence_seller_sent_at:
    description: Date of submission of due diligence document for Seller.
    lineage:
    - datalake_sales_flow_clean.diligence.ts_seller_sent
  dt_legal_analysis_ended:
    description: Date when the legal  analysis ended
    lineage:
    - datalake_sales_flow_clean.diligence.ts_buyer_seller_ended
  dt_legaut_analysis_started:
    description: Date when Legaut legal analysis started
    lineage:
    - datalake_sales_flow_clean.diligence.ts_partner_started
  dt_legaut_analysis_ended:
    description: Date when Legaut legal risk analysis ended
    lineage:
    - datalake_sales_flow_clean.diligence.ts_partner_ended
  dt_legal_risk_started:
    description: Date when the legal risk analysis started
    lineage:
    - datalake_sales_flow_clean.diligence.ts_legal_risk_started
  dt_legal_risk_ended:
    description: Date when the legal risk analysis ended
    lineage:
    - datalake_sales_flow_clean.diligence.ts_legal_risk_ended
  dt_bank_legal_analysis_started:
    description: Date when the Bank legal risk analysis started
    lineage:
    - datalake_sales_flow_clean.mortgage.dt_bank_started
  dt_credit_analysis_started:
    description: Date when the credit analysis started
    lineage:
    - datalake_sales_flow_clean.mortgage.dt_credit_started
  dt_credit_analysis_ended:
    description: Date when the credit analysis ended
    lineage:
    - datalake_sales_flow_clean.mortgage.dt_credit_ended
  dt_financing_started:
    description: Date when financing started
    lineage:
    - datalake_sales_flow_clean.mortgage.dt_started
  dt_financing_ended:
    description: Date when financing ended
    lineage:
    - datalake_sales_flow_clean.mortgage.dt_ended
  dt_notes_registry_started:
    description: Date when CRN registration started
    lineage:
    - datalake_sales_flow_clean.cash_payment.ts_crn_started
  dt_notes_registry_ended:
    description: Date when CRN registration ended
    lineage:
    - datalake_sales_flow_clean.cash_payment.ts_crn_ended
  dt_house_registry_started:
    description: Date house registration started
    lineage:
    - datalake_sales_flow_clean.notary.ts_started
  dt_house_registry_ended:
    description: Date house registration ended
    lineage:
    - datalake_sales_flow_clean.notary.ts_ended
  dt_sale_transacton_paid:
    lineage:
    - datalake_sales_flow_clean.mortgage.ts_seller_paid
    - datalake_sales_flow_clean.notary.ts_seller_paid
    description: Date when the seller received the payment from the financing company. In Closing Assistance model, the full closing process is not monitored. After July 2022 there is no date.
  dt_sale_key_delivered:
