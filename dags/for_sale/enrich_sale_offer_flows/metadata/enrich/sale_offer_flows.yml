    lineage:
      - datalake_sales_flow_clean.sales_flow.flow_type
  flow_type:
    description: Where this offer started.
    lineage:
      - datalake_sales_flow_clean.sales_flow.flow_type
  vendas_offer_flow:
    description: Information about which flow this offer is following
  has_used_negotiation_chat:
