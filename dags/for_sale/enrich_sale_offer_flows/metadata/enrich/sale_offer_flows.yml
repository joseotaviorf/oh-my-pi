  id_user_post_dd_specialist:
    description: ID user on main (EBDB) tables which the specialist type on datalake_sales_flow_clean.specialist is equal to 'POST_DD'
    lineage:
    - datalake_sales_flow.offer_specialists.id_user_post_dd_specialist
  id_post_dd_specialist:
    description: ID user on SalesFlow tables which the specialist type on datalake_sales_flow_clean.specialist is equal to 'POST_DD'
    lineage:
    - datalake_sales_flow.offer_specialists.id_post_dd_specialist
  id_pendency:
    lineage:
    - datalake_sales_flow_clean.sales_flow_pendency.id
    description: Identification key for this offer pendencies on table pendency
  id_hub:
    description: ID to get more information abou the HUB on HubServices tables.
    lineage:
