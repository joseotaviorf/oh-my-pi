    description: Date when the Closing Analyst sent a message to the Seller.
  ts_buyer_fup:
    lineage:
    - datalake_sales_flow_clean.sales_flow_details.ts_buyer_fup
    description: Date when the Closing Analyst sent a message to the Buyer.
  ts_signed:
    lineage:
    - datalake_sales_flow_clean.ccv_flow.ts_signed
    description: Date when the CCV was signed
  ts_created:
    lineage:
    - datalake_sales_flow_clean.ccv_flow.ts_created
    description: Date when the CCV was created
  ts_offer_updated:
    lineage:
    - datalake_sales_flow_clean.offer.ts_updated
