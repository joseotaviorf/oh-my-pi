    - datalake_sales_flow_clean.offer.ts_created
    description: Date of creation of the offer in the sales base.
  ts_accepted:
    lineage:
    - datalake_sales_flow_clean.offer.ts_accepted
    description: Date when the offer was accepted by the owner
  ts_discarded:
    lineage:
    - datalake_sales_flow_clean.offer.ts_discarded
    description: Date when the offer was rejected by the owner
  ts_seller_fup:
