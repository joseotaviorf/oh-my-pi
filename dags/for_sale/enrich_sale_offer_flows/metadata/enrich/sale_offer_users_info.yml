database_name: datalake_sale_offer_flows
table_name: sale_offer_users_info
description: >-
  Junk dimension holding every unique combination of sale_offer_users' boolean/status
  characteristics (user role, CCV buyer/signer flags, legal type, original-user, income-partner and
  joint-buyer flags). One row per distinct combination, deduplicated and assigned a stable
  sk_user_info surrogate key so fact tables can join a single small key instead of repeating all
  flag columns. Feeds the sale_offer_flows / user-analytics layer. Built directly from
  enrich_sale_offer_flows.sale_offer_users: there is no shared id column between the two tables —
  consumers join back to sale_offer_users by matching its raw flag columns to look up the
  corresponding sk_user_info.
domain: For Sale
owner: helder.rodrigues@quintoandar.com.br
columns:
  ccv_buyer_status:
    lineage:
    - datalake_sale_offer_flows.sale_offer_users.is_ccv_buyer
    description: Human-readable label for whether this user will be listed on the sale agreement (CCV) document. Built by mapping the boolean is_ccv_buyer flag to a text label.
    categories:
      CCV Buyer: User will be listed as a buyer on the sale agreement document.
      Not a CCV Buyer: User will not be listed on the sale agreement document.
      Unknown: is_ccv_buyer flag was not populated for this user.
  seller_ccv_signer_status:
    lineage:
    - datalake_sale_offer_flows.sale_offer_users.is_seller_ccv_signer
    description: Human-readable label for whether this seller is a required signer of the sale agreement. Built by mapping the boolean is_seller_ccv_signer flag to a text label.
    categories:
      Signer: Seller is a required signer of the sale agreement.
      Not Signer: Seller is not required to sign the sale agreement.
      Unknown: is_seller_ccv_signer flag was not populated for this user.
  buyer_ccv_signer_status:
    lineage:
    - datalake_sale_offer_flows.sale_offer_users.buyer_signer_status
    description: Human-readable label for whether this buyer is a required signer of the sale agreement. Built by mapping the SIGNER/NOT_SIGNER buyer_signer_status value to a text label.
    categories:
      Signer: Buyer is a required signer of the sale agreement.
      Not Signer: Buyer is not required to sign the sale agreement.
      Unknown: buyer_signer_status was not populated (neither SIGNER nor NOT_SIGNER) for this user.
  user_legal_type:
    lineage:
    - datalake_sale_offer_flows.sale_offer_users.is_pj
    description: Human-readable label for whether this user is a legal entity (company) or an individual. Built by mapping the boolean is_pj flag to a text label.
    categories:
      Pessoa Jurídica: User is a legal entity (company / PJ).
      Pessoa Física: User is an individual person (PF).
      Unknown: is_pj flag was not populated for this user.
  original_user_status:
    lineage:
    - datalake_sale_offer_flows.sale_offer_users.is_original_user
    description: Human-readable label for whether this user is the original buyer who made the offer, or (for sellers) the original owner who accepted it. Only one user per user type can hold this status per offer. Built by mapping the boolean is_original_user flag to a text label.
    categories:
      Original user: User is the one who made the offer (buyer) or accepted it (seller).
      Not an original user: User was added later (e.g. invited co-buyer/co-seller), not the original party.
  income_partner_status:
    lineage:
    - datalake_sale_offer_flows.sale_offer_users.is_income_partner
    description: Human-readable label for whether this user is participating in the offer as an income partner (helping a buyer qualify for financing without being a co-owner). Built by mapping the boolean is_income_partner flag to a text label.
    categories:
      Income partner: User is participating as an income partner.
      Not an income partner: User is not an income partner.
      Unknown: is_income_partner flag was not populated for this user.
  joint_buyer_status:
    lineage:
    - datalake_sale_offer_flows.sale_offer_users.has_joint_buyer
    description: Human-readable label for whether this buyer has another user acting as a joint (co-)buyer on the same offer. Built by mapping the boolean has_joint_buyer flag to a text label.
    categories:
      Has a joint buyer: There is another user acting as joint buyer alongside this user.
      Has no joint buyer: There is no joint buyer for this user on this offer.
      Unknown: has_joint_buyer flag was not populated for this user.
  is_ccv_buyer:
    lineage:
    - datalake_sale_offer_flows.sale_offer_users.is_ccv_buyer
    description: Raw boolean flag (source for ccv_buyer_status) from docx databases indicating if this user will be on the sale agreement document.
  is_seller_ccv_signer:
    lineage:
    - datalake_sale_offer_flows.sale_offer_users.is_seller_ccv_signer
    description: Raw boolean flag (source for seller_ccv_signer_status) indicating if this seller is a sale agreement signer.
  buyer_signer_status:
    lineage:
    - datalake_sale_offer_flows.sale_offer_users.buyer_signer_status
    description: Raw SIGNER/NOT_SIGNER value (source for buyer_ccv_signer_status) indicating if this buyer is a required sale agreement signer.
    categories:
      SIGNER: Buyer is a required signer of the sale agreement.
      NOT_SIGNER: Buyer is not required to sign the sale agreement.
  is_pj:
    lineage:
    - datalake_sale_offer_flows.sale_offer_users.is_pj
    description: Raw boolean flag (source for user_legal_type) indicating if this user is a legal entity (true) or an individual (false).
  is_original_user:
    lineage:
    - datalake_sale_offer_flows.sale_offer_users.is_original_user
    description: Raw boolean flag (source for original_user_status) indicating if this user is the one who made the offer (buyer) or accepted it (seller). Only one user per user type can have this flag true for a given offer.
  is_income_partner:
    lineage:
    - datalake_sale_offer_flows.sale_offer_users.is_income_partner
    description: Raw boolean flag (source for income_partner_status) indicating if this user is participating on this offer as an income partner.
  has_joint_buyer:
    lineage:
    - datalake_sale_offer_flows.sale_offer_users.has_joint_buyer
    description: Raw boolean flag (source for joint_buyer_status) indicating if this user has another user acting as a joint buyer for this offer.
  sk_user_info:
    description: Surrogate key of this junk dimension row. Generated as a monotonically increasing id per unique combination of the user characteristic columns in this table (user_type, ccv_buyer_status, signer statuses, legal type, original/income-partner/joint-buyer flags); used to join dim_sale_offer_user_info from fact tables instead of repeating all flags.
  user_type:
    lineage:
    - datalake_sale_offer_flows.sale_offer_users.type
    description: Role this user plays on the offer's sales flow (buyer, seller, or property owner).
    categories:
      BUYER: User is a buyer on this offer.
      SELLER: User is a seller (co-owner) on this offer.
      OWNER: User is the property owner on this offer, distinct from a generic seller.
