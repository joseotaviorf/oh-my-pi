database_name: datalake_sale_offer_flows
table_name: sale_offer_status
domain: For Sale
owner: helder.rodrigues@quintoandar.com.br
description: >-
  Enriched table tracking the current macro/micro status and closing-type funnel position of each
  For Sale offer's sales flow, built from SalesFlow's status, status_record, status_order and
  closing_type tables. One row per (id_sales_flow, id_status) combination, keeping the most recent
  status_record per status. macro_status_name, last_micro_status_name and the closing-type labels
  come from SalesFlow's business-configured status/closing_type reference tables rather than a
  fixed application enum, so their full value set lives in that reference data, not in application
  source code. Used by sale_offer_flows (e.g. credit_analysis_status_name, dt_onboarding_ended) and
  by closing-funnel monitoring to measure how long an offer has spent in its current step.
  id_sales_flow is the same join key used by enrich_sale_offer_flows.sale_offer_flows.id_sales_flow
  and sale_offer_users.id_sales_flow (and, for Firestore-era records, id_firestore).
columns:
  id_sales_flow:
    lineage:
    - datalake_sales_flow_clean.status_record.id_sales_flow
    description: Foreign key to the parent sales flow transaction in the end-of-funnel domain.
  id_firestore:
    lineage:
    - datalake_sales_flow_clean.offer.id_firestore
    description: Firestore offer id linked to the sales flow status record.
  primary_closing_type_label:
    lineage:
    - datalake_sales_flow_clean.closing_type.key
    description: Label of the primary (macro) closing type set on the offer's sales flow.
  secundary_closing_type_label:
    lineage:
    - datalake_sales_flow_clean.closing_type.key
    description: Label of the secondary (micro) closing type set on the offer's sales flow.
  macro_status_name:
    lineage:
    - datalake_sales_flow_clean.status.key
    description: Name of the current macro (parent) status of the offer in the sales flow.
  ordering:
    lineage:
    - datalake_sales_flow_clean.status_order.ordering
    description: Sequence position of the status within the closing type funnel, used to order statuses.
  last_micro_status_name:
    lineage:
    - datalake_sales_flow_clean.status.key
    description: Name of the most recent micro (child) status reached under the current macro status.
  ts_macro_status_start:
    lineage:
    - datalake_sales_flow_clean.status_record.ts_status_start
    description: Timestamp when the offer entered the current macro status.
  ts_macro_status_end:
    lineage:
    - datalake_sales_flow_clean.status_record.ts_status_end
    description: Timestamp when the offer left the current macro status.
  ts_micro_status_last_update:
    lineage:
    - datalake_sales_flow_clean.status_record.ts_updated
    description: Timestamp of the last micro status update for the offer status record.

