---
dag:
  name: enrich_sale_offer_flows
  schedule_start_date: 2021, 12, 1
  owner: Data ForSale
  documentation:
    dag_purpose: Creates enriched tables for the context `sale_offer_flows` enriching from sale_flows.
workflow:
  type: query_delta
  layer: enrich
  inner_dependencies:
    sale_offer_flows:
    - offer_specialists
    - sale_offer_status
    sale_offer_users_info:
    - sale_offer_users
cluster:
  type: databricks_12_2_med_general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
