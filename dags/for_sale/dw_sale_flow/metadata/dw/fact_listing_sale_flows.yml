database_name: dw_sale
table_name: fact_listing_sale_flows
description:
  "Deprecated table, previously used to track the booking/visit flow of a listing.
  In other words, each row represented a booking for a listing, where we have information about the visit and the people involved.
  Today we can track all this information directly in the visits model: dw_sale.fact_visits, dw_public.dim_booking and dw_public.dim_visit."
