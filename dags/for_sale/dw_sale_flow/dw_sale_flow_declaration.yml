dag:
  name: dw_sale_flow
  owner: Data ForSale
workflow:
  type: query
  layer: dw
  custom_schema: sale
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: r5a.large
    node_type_id: m5d.xlarge
    num_workers: 2
    spark_version: 13.3.x-scala2.12
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE
