---
dag:
  name: enrich_amplitude_visit
  schedule_start_date: 2020, 7, 1
  owner: Data ForSale
  documentation: 
    dag_purpose: |
      Enrich visit context events in Amplitude and load into data lake.
      This DAG enriches data coming from Amplitude events that have a visit confirmed.
      Thus, we can have the information about the Urchin Tracking and understand better
      the behavior behind a visit confirmed.
      This DAG is triggered by Mediator and loads the table via full load.
workflow:
  type: query_delta
  layer: enrich
cluster:
  type: databricks_12_2_min_2xlarge_memory_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
