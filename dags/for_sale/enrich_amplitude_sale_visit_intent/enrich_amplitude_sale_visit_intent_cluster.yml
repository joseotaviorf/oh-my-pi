cluster:
  type: consolidation_xs_memory_cluster
  databricks_conn_id: databricks_new_env
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
validation:
  cluster:
    type: emr_7_12_consolidation_l_memory_cluster
    custom_configurations:
      core_nodes:
        instance_count: 2
      task_nodes:
        instance_count: 1
      aws_attributes:
        ebs_volume_size: 200
      spark_conf:
        spark.executor.cores: '2'
        spark.sql.shuffle.partitions: '400'
        spark.dynamicAllocation.maxExecutors: '3'
