---
dag:
  name: enrich_amplitude_sale_visit_intent
  schedule_start_date: 2020, 7, 1
  owner: Data ForSale
  documentation:
    dag_purpose: Enrich sale visit intent context events in Amplitude and load into Data Lake.
      This DAG enriches data coming from Amplitude events that have a Sale context and a visit intent type.
workflow:
  type: query
  layer: enrich
  default_extraction_type: incremental
  default_partitions:
  - year
  - month
  - day
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: r5d.2xlarge
    node_type_id: r5d.xlarge
    num_workers: 6
    runtime_engine: PHOTON
