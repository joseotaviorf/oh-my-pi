---
dag:
  name: enrich_amplitude_sale_visit_intent
  schedule_start_date: 2020, 7, 1
  owner: Data ForSale
  documentation:
    dag_purpose: Enrich sale visit intent context events in Amplitude and load into Data Lake.
      This DAG enriches data coming from Amplitude events that have a Sale context and a visit intent type.
workflow:
  type: query_delta
  layer: enrich
  default_extraction_type: incremental
  default_partitions:
  - year
  - month
  - day
cluster:
  type: databricks_12_2_min_io-memory_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
