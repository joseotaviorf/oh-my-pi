database_name: datalake_datalake_firestore
table_name: sale_offer
description: Sale offer data is deprecated, please do not use this table, only to
  historical data.
domain: For Sale
owner: guilherme.rocha@quintoandar.com.br
columns:
  id:
    lineage:
    - datalake_firestore_clean.sale_offer.id
    description: Offer unique identifier.
  id_sale_flow:
    lineage:
    - datalake_firestore_clean.sale_offer.updated_message
    description: Identification key for the sales flow linked to an offer.
  id_buyer:
    lineage:
    - datalake_firestore_clean.sale_offer.updated_message
    description: Identification key of the user who sent the offer.
  id_house:
    lineage:
    - datalake_firestore_clean.sale_offer.updated_message
    description: Identification key of the house linked to the offer.
  id_owner:
    lineage:
    - datalake_firestore_clean.sale_offer.updated_message
    description: House owner to whom an offer has been sent.
  id_monday_user_last_revision:
    lineage:
    - datalake_firestore_clean.sale_offer.updated_message
    description: User who made the last revision
  brokerage_fee:
    lineage:
    - datalake_firestore_clean.sale_offer.updated_message
    description: Brokerage fee percentage. The default value is 6% of the sale price.
  deed_price:
    lineage:
    - datalake_firestore_clean.sale_offer.updated_message
    description: Registered deed price captured on the Firestore sale offer record.
  earnest_value:
    lineage:
    - datalake_firestore_clean.sale_offer.updated_message
    description: Earnest money deposit value proposed on the Firestore sale offer.
  fgts_value:
    lineage:
    - datalake_firestore_clean.sale_offer.updated_message
    description: Fgts value used in the purchase.
  financing_value:
    lineage:
    - datalake_firestore_clean.sale_offer.updated_message
    description: Value that will be financed.
  itbi_price:
    lineage:
    - datalake_firestore_clean.sale_offer.updated_message
    description: ITBI value paid on the purchase.
  first_price_offered_by_buyer:
    lineage:
    - datalake_firestore_clean.sale_offer.updated_message
    description: First value offered by the buyer.
  sale_price:
    lineage:
    - datalake_firestore_clean.sale_offer.updated_message
    description: Final value, where the buyer and seller reached a negotiation agreement.
  registry_price:
    lineage:
    - datalake_firestore_clean.sale_offer.updated_message
    description: Registry value paid on the purchase.
  planned_payment_method:
    lineage:
    - datalake_firestore_clean.sale_offer.updated_message
    description: Buyer payment instrument initially selected during Firestore offer
      negotiation.
  last_price_offered_by_buyer:
    lineage:
    - datalake_firestore_clean.sale_offer.updated_message
    description: Last value offered by the buyer.
  current_payment_method:
    lineage:
    - datalake_firestore_clean.sale_offer.updated_message
    description: Payment method currently selected on the Firestore sale offer.
  credit_status:
    lineage:
    - datalake_firestore_clean.sale_offer.updated_message
    description: Buyer credit underwriting status on the Firestore sale offer.
  payment_entry_amount:
    lineage:
    - datalake_firestore_clean.sale_offer.updated_message
    description: Value paid by the buyer on the beginning of the contract.
  payment_type:
    lineage:
    - datalake_firestore_clean.sale_offer.updated_message
    description: Payment type classification on the Firestore sale offer negotiation.
  status:
    lineage:
    - datalake_firestore_clean.sale_offer.updated_message
    description: Workflow status of the Firestore sale offer in the closing funnel.
  status_closing:
    lineage:
    - datalake_firestore_clean.sale_offer.updated_message
    description: Offer status, like canceled or credit_analysis.
  status_reason:
    lineage:
    - datalake_firestore_clean.sale_offer.updated_message
    description: Reason explaining the current status of the Firestore sale offer.
  turn:
    lineage:
    - datalake_firestore_clean.sale_offer.updated_message
    description: Negotiation turn counter tracking rounds on the Firestore sale offer.
  first_discount_proposed:
    lineage:
    - datalake_firestore_clean.sale_offer.updated_message
    description: First discount percentage proposed during the sale offer negotiation.
  last_discount_proposed:
    lineage:
    - datalake_firestore_clean.sale_offer.updated_message
    description: Most recent discount percentage proposed on the sale offer.
  has_used_negotiation_chat:
    lineage:
    - datalake_firestore_clean.sale_offer.updated_message
    description: If the buyer has used the negotiation chat.
  has_used_fgts_in_payment:
    lineage:
    - datalake_firestore_clean.sale_offer.updated_message
    description: If the buyer has used FGTS in the payment.
  dt_tenant_left:
    lineage:
    - datalake_firestore_clean.sale_offer.updated_message
    description: Date of the tenant left the offer.
  ts_created:
    lineage:
    - datalake_firestore_clean.sale_offer.updated_message
    description: Created date of the offer.
  ts_updated:
    lineage:
    - datalake_firestore_clean.sale_offer.ts_updated
    description: Updated date of the offer.
  ts_load:
    description: Timestamp when the record was loaded into the clean layer.
