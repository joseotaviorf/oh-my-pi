---
dag:
  name: enrich_atta
  schedule_start_date: 2022, 10, 25
  owner: Data ForSale
  documentation:
    dag_purpose: Creates enriched tables for Atta data. This enrich will mostly apply business rules inherent to the analysis needed.
workflow:
  type: query_delta
  layer: enrich
cluster:
  type: databricks_12_2_min_io-memory_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
