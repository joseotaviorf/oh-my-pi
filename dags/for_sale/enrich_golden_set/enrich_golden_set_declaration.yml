---
dag:
  name: enrich_golden_set
  schedule_start_date: 2022, 7, 14
  owner: Data ForSale
  documentation:
    dag_purpose:
      We want to validate the information we see in Vespúcio. To do this, Growth's Product and Technology teams and Rede QuintoAndar
      created a forms to collect condo (later, houses) data from employees, to gather correct information from these condos.
workflow:
  type: query_delta
  layer: enrich
cluster:
  type: databricks_12_2_min_memory_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
