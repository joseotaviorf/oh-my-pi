database_name: dw_sale
table_name: fact_listing_flows
description: This table covers the entire pre-publication part of the funnel, where we can find all the tags for channels, campaigns, media and other characteristics from the Marketing tables. Table showing all the events and conversion dates from the pre-publication of a listing (from lead to publication). Each row is a listing and all the events up to publication
domain: For Sale
owner: guilherme.rocha@quintoandar.com.br
columns:
  sk_house_listing_flow:
    lineage:
    - datalake_listing_flow.sales_listing_flows_with_reprocessed_leads.id
    description: Surrogate key of the listing flow (one row per listing, from lead to publication). Primary key of this fact.
  sk_condo:
    lineage:
    - datalake_sale_potential_listing.potential_listing_b2b.id_condo
    description: Key to identify condo. Can be joined with dw_public.dim_condo
  sk_lead:
    lineage:
    - datalake_listing_flow.sales_listing_flows_with_reprocessed_leads.id_lead
    description: Key to identify lead. Can be joined with dw_public.dim_lead
  sk_lead_conversion:
    lineage:
    - datalake_listing_flow.sales_listing_flows_with_reprocessed_leads.id_conversion
    description: Key to identify house registration of a lead.
  sk_first_photo_job:
    lineage:
    - datalake_listing_flow.sales_listing_flows_with_reprocessed_leads.id_photo_job
    description: Key to identify house's first photo job. Can be joined with dw_public.dim_photo_job.
  sk_house_listing:
    lineage:
    - datalake_sale_potential_listing.potential_listing_b2b.id_house_listing
    description: Key to identify house's listing in website. Can be joined with dw_rent.dim_house_listing.
  sk_user_house_registrant:
    lineage:
    - datalake_listing_flow.sales_listing_flows_with_reprocessed_leads.id_rep
    description: Key to identify sales rep that either registered house or scheduled its first job.
  sk_user_sales_rep:
    lineage:
    - datalake_sale_potential_listing.potential_listing_lead_tasks.id_user_sales_rep
    description: Key to identify user that was the sale representative.
  sk_user_lead_affiliate:
    lineage:
    - datalake_listing_flow.sales_listing_flows_with_reprocessed_leads.id_affiliate
    - datalake_listing_flow.sales_listing_flows_with_reprocessed_leads.id_user_has_indicated
    description: Key to identify user that referred lead.
  sk_user_first_task_assignee:
    lineage:
    - datalake_sale_potential_listing.potential_listing_lead_tasks.id_user_first_task_assignee
    description: Key to identify user that was assignee of first task.
  sk_user_last_task_assignee:
    lineage:
    - datalake_sale_potential_listing.potential_listing_lead_tasks.id_user_last_task_assignee
    description: Key to identify user that was assignee of last task.
  sk_region:
    lineage:
    - datalake_listing_flow.sales_listing_flows_with_reprocessed_leads.id_region
    description: Key to identify region associated with house or lead. Can be joined with dw_public.dim_region.
  sk_city:
    lineage:
    - dw_public.dim_region.city_id
    - datalake_lead.lead_city_region.id_region
    description: Key to identify city associated with house or lead. Can be joined with dw_public.dim_region.
  sk_partner:
    lineage:
    - datalake_sale_potential_listing.potential_listing_b2b.id_partner
    description: The real estate partner company that we acquired this listing from. Can be joined with dw_public.dim_partner.
  sk_lead_date:
    lineage:
    - datalake_listing_flow.sales_listing_flows_with_reprocessed_leads.ts_lead
    description: Key to identify date of lead.
  sk_sales_company_lead_sent_date:
    lineage:
    - datalake_listing_flow.sales_listing_flows_with_reprocessed_leads.ts_sales_company_sent
    description: Key to identify the date the lead was received from the sales company.
  sk_prospect_date:
    lineage:
    - datalake_listing_flow.sales_listing_flows_with_reprocessed_leads.ts_prospect
    description: Key to identify date of lead passing through discard algorithm.
  sk_first_task_created_date:
    lineage:
    - datalake_sale_potential_listing.potential_listing_lead_tasks.dt_first_task_created_date
    description: Key to identify first task creation date.
  sk_first_task_closed_date:
    lineage:
    - datalake_sale_potential_listing.potential_listing_lead_tasks.dt_first_task_closed_date
    description: Key to identify first task closed date.
  sk_last_task_created_date:
    lineage:
    - datalake_sale_potential_listing.potential_listing_lead_tasks.dt_last_task_created_date
    description: Key to identify last task closed date.
  sk_last_task_closed_date:
    lineage:
    - datalake_sale_potential_listing.potential_listing_lead_tasks.dt_last_task_closed_date
    description: Key to identify last task closed date.
  sk_first_contact_date:
    lineage:
    - datalake_listing_flow.sales_listing_flows_with_reprocessed_leads.ts_first_contact
    description: Key to identify date of lead's first lead revision by a sales rep.
  sk_conversion_date:
    lineage:
    - datalake_listing_flow.sales_listing_flows_with_reprocessed_leads.ts_conversion
    description: Key to identify date of house registration of a lead.
  sk_qualified_date:
    lineage:
    - datalake_listing_flow.sales_listing_flows_with_reprocessed_leads.ts_qualified
    description: Key to identify date of qualification of a lead according to 5A criteria.
  sk_available_qualified_date:
    lineage:
    - datalake_listing_flow.sales_listing_flows_with_reprocessed_leads.ts_qualified
    description: Key to identify date of availability identification date of a qualified lead  according to 5A criteria.
  sk_opportunity_date:
    lineage:
    - datalake_listing_flow.sales_listing_flows_with_reprocessed_leads.ts_opportunity
    description: Key to identify date of opportunity (ie date of house's first job created).
  sk_first_listing_date:
    lineage:
    - datalake_listing_flow.sales_listing_flows_with_reprocessed_leads.ts_first_listing
    description: Key to identify date of first listing of a house in our website.
  sk_discard_date:
    lineage:
    - datalake_listing_flow.sales_listing_flows_with_reprocessed_leads.ts_discarded
    description: Key to identify date of lead discard.
  sk_user_lead_first_discarder:
    lineage:
    - datalake_listing_flow.sales_listing_flows_with_reprocessed_leads.id_user_lead_first_discarder
    description: Key to identify user that discarded lead.
  sk_user_lead_last_discarder:
    lineage:
    - datalake_listing_flow.sales_listing_flows_with_reprocessed_leads.id_user_lead_last_discarder
    description: Key to identify user that discarded lead.
  funnel_drop_reason:
    lineage:
    - datalake_listing_flow.sales_listing_flows_with_reprocessed_leads.funnel_step
    description: Description of the reason for the lead or house to be in its current funnel step.
    categories:
      Alugado: Listing is rented.
      ApartamentoBanguncado: Listig is in bad condition.
      BrokenLeadFlow: Broken lead flow.
      CancelledPhotoJob: Photo job was cancelled.
      DiscardedProspect: Discarded by prospect.
      DiscardedQualified: Discarded by sales rep.
      Duplicado: Listing is duplicated.
      ForaDoPadrao: Listing is out of our standards.
      IMOVEL_COMERCIAL: Listing is commercial.
      IMOVEL_EM_CONDICAO_INSEGURA: Listing is in unsafe condition.
      IMPREVISTO_FOTOGRAFO: Photo job was cancelled due to photographer.
      LOCALIZACAO_PERIGOSA: Bad location.
      Listed: Listing is listed.
      NaoCompareceu: Seller did not show up.
      NaoProcessado: Listing was not processed.
      NoPhotoJob: Listing has no photo job.
      NotListedYet: Listing is not listed yet.
      NotMapped: Reason not mapped.
      OptedOut Qualified: Seller opted out.
      Outros: Other reason.
      PROBLEMAS_NO_ENVIO_DE_FOTOS: Listing with problem sending photos.
      PROBLEMA_COM_ENDERECO: Listing with address problem.
      PhotoJobScheduled: Listing with scheduled photos.
      ProprietarioCancelou: Owner has canceled.
      Reforma: Listing was under refurbishment.
      SemAutorizacao: Listing without entry authorization.
      SemChaves: No keys for the listing entrance.
      SemContato: No contact for listing entry.
      TermsNotAccepted: QuintoAndar terms not accepted by the owner.
      Vendido: Listing already sold.
  hours_lead_to_prospect:
    lineage:
    - datalake_listing_flow.sales_listing_flows_with_reprocessed_leads.hours_lead_to_prospect
    description: Hours between lead creation timestamp and lead passing through discard algorithm timestamp.
  hours_prospect_to_qualified:
    lineage:
    - datalake_listing_flow.sales_listing_flows_with_reprocessed_leads.hours_prospect_to_qualified
    description: Hours between lead passing through discard algorithm timestamp and qualification of a lead according to 5A criteria timestamp.
  hours_lead_to_first_contact:
    lineage:
    - datalake_listing_flow.sales_listing_flows_with_reprocessed_leads.hours_lead_to_first_contact
    description: Hours between lead creation and first lead revision by a sales rep.
  hours_prospect_to_first_contact:
    lineage:
    - datalake_listing_flow.sales_listing_flows_with_reprocessed_leads.hours_prospect_to_first_contact
    description: Hours between prospect timestamp and first lead revision by a sales rep.
  hours_qualified_to_opportunity:
    lineage:
    - datalake_listing_flow.sales_listing_flows_with_reprocessed_leads.hours_qualified_to_opportunity
    description: Hours between qualified timestamp and first photo job creation timestamp.
  hours_opportunity_to_listing:
    lineage:
    - datalake_listing_flow.sales_listing_flows_with_reprocessed_leads.hours_opportunity_to_listing
    description: Hours between first photo job creation timestamp and first listing timestamp.
  hours_lead_to_listing:
    lineage:
    - datalake_listing_flow.sales_listing_flows_with_reprocessed_leads.hours_lead_to_listing
    description: Hours between lead creation and first listing timestamp.
  days_lead_to_prospect:
    lineage:
    - datalake_listing_flow.sales_listing_flows_with_reprocessed_leads.days_lead_to_prospect
    description: Days between lead creation and prospect date.
  days_prospect_to_qualified:
    lineage:
    - datalake_listing_flow.sales_listing_flows_with_reprocessed_leads.days_prospect_to_qualified
    description: Days between prospect date and qualification of a lead according to 5A criteria date.
  days_lead_to_first_contact:
    lineage:
    - datalake_listing_flow.sales_listing_flows_with_reprocessed_leads.days_lead_to_first_contact
    description: Days between lead creation and first lead revision by a sales rep.
  days_prospect_to_first_contact:
    lineage:
    - datalake_listing_flow.sales_listing_flows_with_reprocessed_leads.days_prospect_to_first_contact
    description: Days between prospect date and first lead revision by a sales rep.
  days_qualified_to_opportunity:
    lineage:
    - datalake_listing_flow.sales_listing_flows_with_reprocessed_leads.days_qualified_to_opportunity
    description: Days between qualification of a lead according to 5A criteria date and first photo job creation date.
  days_opportunity_to_listing:
    lineage:
    - datalake_listing_flow.sales_listing_flows_with_reprocessed_leads.days_opportunity_to_listing
    description: Days between first photo job creation date and first listing date.
  days_lead_to_listing:
    lineage:
    - datalake_listing_flow.sales_listing_flows_with_reprocessed_leads.days_lead_to_listing
    description: Days between lead creation and first listing date.
  days_lead_to_processing:
    lineage:
    - datalake_listing_flow.sales_listing_flows_with_reprocessed_leads.days_lead_to_processing
    description: Days between lead creation and discard date or conversion date.
  is_exclusive:
    lineage:
    - datalake_sale_potential_listing.potential_listing_b2b.is_exclusive
    description: Flag which identifies house as exclusive to 5A.
  first_isales_intervention:
    lineage:
    - datalake_sale_potential_listing.potential_listing_lead_tasks.first_isales_intervention
    description: Identification in which step a sales rep intervention occurred (lead or photo).
    categories:
      Lead: If the listing is a sale lead.
      Photojob: If the photographer comments on the sale.
  lead_type:
    lineage:
    - datalake_sale_potential_listing.potential_listing_reprocessed_leads.lead_type
    description: Classification of how the supply lead reached QuintoAndar (for example Afiliado, Agente, Inbound, OpenLink, Organic).
    categories:
      Afiliado: ''
      Agente: ''
      B2BOpenLink: ''
      BrokenOpenLink: ''
      CadastroImobiliario: ''
      Inbound: ''
      LandingMarketing: ''
      LandingOpenLink: ''
      Marketing: ''
      OLX: ''
      OpenLink: ''
      Organic: ''
      Porteiro: ''
      Proporparceria: ''
      Repechage: ''
  lead_origin:
    lineage:
    - datalake_sale_potential_listing.potential_listing_reprocessed_leads.lead_origin
    description: Source channel the supply lead originated from (for example App, Facebook, Form, Landing, OwnerPWA, Crawling).
    categories:
      App: ''
      Crawling: ''
      Desconhecida: ''
      Facebook: ''
      Form: ''
      Inbound: ''
      Ios: ''
      Landing: ''
      LeadEnrichment: ''
      Other: ''
      OwnerPWA: ''
      Planilha: ''
      PriceSuggestion: ''
      Reprocessado: ''
      Trade: ''
  lead_tracking_source:
    lineage:
    - datalake_lead_tracking.lead_first_event_tracking.tracking_source
    - datalake_sale_potential_listing.potential_listing_reprocessed_leads.utm_source
    description: Lead tracking source from Amplitude or lead utm source from EBDB.
  lead_tracking_medium:
    lineage:
    - datalake_lead_tracking.lead_first_event_tracking.tracking_medium
    - datalake_sale_potential_listing.potential_listing_reprocessed_leads.utm_medium
    description: Lead tracking medium from Ampltiude or lead utm medium from EBDB.
  lead_tracking_platform:
    lineage:
    - datalake_lead_tracking.lead_first_event_tracking.tracking_platform
    description: Lead tracking platform from Amplitude.
    categories:
      android: ''
      ios: ''
      web_desktop: ''
      web_mobile: ''
  is_b2b:
    lineage:
    - datalake_listing_flow.sales_listing_flows_with_reprocessed_leads.is_b2b
    - datalake_sale_potential_listing.potential_listing_reprocessed_leads.is_b2b
    description: Flag which identifies if lead/house is from a business partner.
  is_doorman:
    lineage:
    - datalake_listing_flow.sales_listing_flows_with_reprocessed_leads.is_doorman
    description: Flag which identifies if lead/house was referred by a doorman.
  has_isales_intervention:
    lineage:
    - datalake_sale_potential_listing.potential_listing_lead_tasks.has_isales_intervention
    description: Flag which identifies if a sales rep intervention occurred.
  has_fup_photo_task:
    lineage:
    - datalake_sale_potential_listing.potential_listing_lead_tasks.has_fup_photo_task
    description: Flag which identifies if had fup for photo job.
  is_lead_reprocessed:
    lineage:
    - datalake_sale_potential_listing.potential_listing_reprocessed_leads.is_reprocessed
    description: Flag which identifies if lead was originated from a plead revisionous discarded lead.
  affiliate_type:
    lineage:
    - datalake_ebdb_clean.affiliate_data.affiliate_type
    - datalake_listing_flow.sales_listing_flows_with_reprocessed_leads.affiliate_type
    description: Type of affiliate who referred the listing, if any.
    categories:
      Agent: ''
      B2BPartner: ''
      Doorman: ''
      Standard: ''
  is_agent_referral:
    lineage:
    - datalake_gsheets_clean.taxonomy_growth.is_agent_referral
    description: Flag which identifies if lead was referred from agent.
  lead_referring_domain:
    lineage:
    - datalake_lead_tracking.lead_first_event_tracking.tracking_referring_domain
    description: Domain of website which lead was referred from.
  lead_referring_category:
    lineage:
    - datalake_gsheets_clean.taxonomy_growth.lead_referring_category
    description: 'Lead reference category: Agents, Indica Ai, Other or Owner.'
    categories:
      Agents: ''
      Indica Ai: ''
      Other: ''
      Owner: ''
  subscription_source:
    lineage:
    - datalake_ebdb_user.user_doorman.subscription_source
    description: Channel through which the doorman user was subscribed (for example LeadOutbound, Trade, or Desconhecida when unknown).
    categories:
      Desconhecida: ''
      LeadOutbound: ''
      Trade: ''
  mkt_origin:
    lineage:
    - datalake_gsheets_clean.taxonomy_growth.mkt_origin
    description: Marketing origin as defined by the lead taxonomy.
    categories:
      B2B: ''
      Backend: ''
      Doorman: ''
      Inbound: ''
      Indica Aí - Agents: ''
      Indica Aí - General: ''
      Other: ''
      Owner PWA: ''
      Price Calculator: ''
  mkt_channel:
    lineage:
    - datalake_gsheets_clean.taxonomy_growth.mkt_channel
    description: Marketing channel as defined by the lead taxonomy.
  mkt_medium:
    lineage:
    - datalake_gsheets_clean.taxonomy_growth.mkt_medium
    description: Marketing medium as defined by the lead taxonomy.
    categories:
      Branding: ''
      Cross Domain: ''
      Direct: ''
      Direct Referral: ''
      Display: ''
      Doorman User: ''
      Email: ''
      Lost Tracking: ''
      Not Mapped: ''
      Online Classifieds: ''
      Other: ''
      Performance Max: ''
      Pop-Up: ''
      Push: ''
      Retargeting: ''
      SEM branded: ''
      SEM non-branded: ''
      SEO branded: ''
      SEO non-branded: ''
      SMS: ''
      Test: ''
      Whatsapp: ''
  mkt_source:
    lineage:
    - datalake_gsheets_clean.taxonomy_growth.mkt_source
    description: Marketing source as defined by the lead taxonomy.
  lead_context_origin:
    lineage:
    - datalake_listing_flow.sales_listing_flows_with_reprocessed_leads.lead_context_origin
    description: 'Lead context origin: Only Sale, Only Rent, Hybrid or Organic.'
    categories:
      Hybrid: ''
      Only Rent: ''
      Only Sale: ''
      Organic: ''
  ts_opt_out_sale:
    lineage:
    - datalake_listing_flow.sales_listing_flows_with_reprocessed_leads.ts_opt_out_sale
    description: Timestamp relative to when the listing opted out of the Sale business model.
  funnel_step:
    description: Listing flow step that the lead or house is currently in or stopped.
    categories:
      first contact: If the listing is still in the first contact of the lead flow.
      lead: A lead is a user with an intention to advertise who has arrived at QuintoAndar, i.e. a potential seller. The minimum information to characterize a lead is (name + email + telephone + intent). Representing only one person.
      listing: Listing is when the property is finally published on the platform, after going through all the previous steps and validations.
      opportunity: A opportunity is a seller who has already accepted the terms and arranged for the photographer to visit the property to take photos. 'Hello, I accept, the photos can be taken tomorrow!'.
      prospect: A prospect is a lead that has not been discarded by QuintoAndar's algorithm (which assesses whether the listing is within the region of operation; whether the listing is a duplicate) and is suitable to be converted to the next steps in the funnel.
      qualified: A qualified one is when we identify that the owner has his property beyond the area of operation, if the property is non-commercial, available for sale.
  is_branded:
    description: Flag which identifies if utm_campaign is branded.
  is_call_center:
    description: Flag which identifies if lead was sent to call center test in 2018.
  is_cx_direct_register:
    description: Flag which identifies if house was directly registered in the platform by CX.
  is_isales_direct_register:
    description: Flag which identifies if house was directly registered in the platform by Inside Sales.
  is_ops_direct_register:
    description: Flag which identifies if house was registered directly via admin
  ops_agent:
    description: The operations team/agents responsible for the listing.
  listing_rent_status:
    description: Identifies the listing status in the ForRent business model.
    categories:
      Editing: ''
      Not Qualified Yet: ''
      Once Published: ''
      Opted Out: ''
  mkt_branded:
    description: Marketing label of a branded campaign as defined by the lead taxonomy.
    categories:
      Branded: ''
      Other: ''
  mkt_category:
    description: Marketing category as defined by the lead taxonomy.
    categories:
      Inbound: ''
      Other: ''
      Outbound: ''
  mkt_completion:
    description: Marketing completion as defined by the lead taxonomy. 'Full Self-Service' if owner has done entire listing process through owner PWA app (including photo job scheduling) with no contact from Inside Sales. 'Recovered Full Self-Service' if owner dropped at some point beforing scheduling photo job, so Inside Sales contacted him.
    categories:
      Full Self-Service: ''
      Non Self-Service: ''
      Not Mapped: ''
      Other: ''
      Recovered Self-Service: ''
  mkt_flow:
    description: Marketing flow as defined by the lead taxonomy. If lead started in PWA owner app, it is 'Self-Service'. Else (went directly through Inside Sales - example Affilliates), 'Non-Service'.
    categories:
      Non Self-Service: ''
      Other: ''
      Self-Service: ''
  mkt_platform:
    description: Marketing platform as defined by the lead taxonomy.
    categories:
      Not Mapped: ''
      Web Desktop: ''
      Web Mobile: ''
  ts_load:
    description: Last model refresh timestamp.
