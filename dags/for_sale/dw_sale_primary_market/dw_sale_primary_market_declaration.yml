---
dag:
  name: dw_sale_primary_market
  schedule_start_date: 2026, 9, 2
  schedule_interval: 0 21 * * *
  owner: Data ForSale
  documentation:
    dag_purpose: This DAG builds Primary Market DW-layer tables — dim_house_development (house-grain evolution of enrich house_development, adding city_group and incorporadora company_name) and fact_development_negotiation (negotiation-grain evolution of enrich development_negotiation, adding city_group, hub, and EN) — so consumers don't re-derive these segmentations per query.
workflow:
  type: query_delta
  layer: dw
  custom_schema: sale_primary_market
  default_extraction_type: full
  default_partitions: []
