---
database_name: dw_sale_primary_market
table_name: dim_buyer_prospect_market_type
domain: For Sale
description: One row per buyer prospect who has ever touched a Primary Market pilot house, classifying whether that buyer's activation history also touched Secondary market houses. Complements enrich_buyer_prospect.buyer_prospect_type's existing new/recurrent (bp_type) axis with an orthogonal market-exclusivity axis, scoped to Primary Market only.
owner: gustavo.rompe@quintoandar.com.br
columns:
  id_prospect:
    lineage:
      - datalake_buyer_prospect.buyer_prospect_type.id_prospect
    description: Identifier of the buyer prospect.
  bp_market_type:
    lineage:
      - datalake_buyer_prospect.buyer_prospect_type.sale_type
    description: Market-exclusivity classification of the buyer prospect's activation history, within the SQL's bp_window_days lookback.
    categories:
      PRIMARY_EXCLUSIVE: Buyer has only ever activated on Primary Market pilot houses within the window.
      NON_EXCLUSIVE: Buyer has activated on both Primary Market pilot houses and Secondary market houses within the window.
  n_events:
    lineage:
      - datalake_buyer_prospect.buyer_prospect_type.id_buyer_prospect_type
    description: Count of activation events (rows in buyer_prospect_type) considered for this buyer within the window.
  dt_computed:
    lineage:
      - datalake_buyer_prospect.buyer_prospect_type.ts_activation
    description: Date this snapshot was computed. The table is fully recomputed on each daily run, so this reflects the buyer's classification as of that run, not a fixed historical value.
