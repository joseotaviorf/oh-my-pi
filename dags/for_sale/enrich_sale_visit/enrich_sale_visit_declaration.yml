---
dag:
  name: enrich_sale_visit
  schedule_start_date: 2023, 9, 1
  owner: Data ForSale
  documentation:
    dag_purpose: This DAG creates the enriched table for Sale Visit, getting all data about the visit ForSale context that will be used in other enrichs and fact tables.
workflow:
  type: query_delta
  layer: enrich
  tables_customization:
    sale_visit:
      row_filter_column_key: has_3p_access_control
      row_filter: has_3p_access
cluster:
  type: databricks_16_4_med_memory_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: USER_ISOLATION
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
