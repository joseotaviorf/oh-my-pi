---
dag:
  name: enrich_sale_flows
  schedule_start_date: 2020, 8, 29
  owner: Data ForSale
  documentation:
    dag_purpose: This DAG creates the enriched table for Sale Flows, getting all data about the demand ForSale context.
workflow:
  type: query_delta
  layer: enrich
  tables_customization:
    house_address_data:
      partitions: [year, month, day]
      extraction_type: incremental
    house_offers:
      partitions: [year, month, day]
      extraction_type: incremental
    sale_flow: {}
cluster:
  type: databricks_12_2_min_2xlarge_memory_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
