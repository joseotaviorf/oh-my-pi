database_name: datalake_sales_flow_clean
table_name: bypass
owner: helder.rodrigues@quintoandar.com.br
domain: For Sale
description: Table that store possible bypass cases.
columns:
  id:
    description: Bypass case unique ID
    lineage:
    - datalake_sales_flow_raw.bypass.id
  id_house:
    description: House ID on main (EBDB) tables
    lineage:
    - datalake_sales_flow_raw.bypass.house_id
  register_number:
    description: Property registration number identified during bypass analysis.
    lineage:
    - datalake_sales_flow_raw.bypass.register_number
  rating:
    description: Rating assigned to the bypass case during analysis.
    lineage:
    - datalake_sales_flow_raw.bypass.rating
  status:
    description: Bypass analysis status, PROCESSED or PENDING.
    lineage:
    - datalake_sales_flow_raw.bypass.status
  file_path_s3:
    description: Bypass files path on s3.
    lineage:
    - datalake_sales_flow_raw.bypass.filepath_s3
  message:
    description: Message or note generated by the bypass analysis.
    lineage:
    - datalake_sales_flow_raw.bypass.message
  found_data:
    description: OCR data found on documents.
    lineage:
    - datalake_sales_flow_raw.bypass.found_data
  is_bypass:
    description: Flag indicating if is bypass.
    lineage:
    - datalake_sales_flow_raw.bypass.bypass_confirmation
  dt_processing:
    description: Date when the analysis ran.
    lineage:
    - datalake_sales_flow_raw.bypass.processing_date
  ts_created:
    description: Timestamp that indicates when this entry was created.
    lineage:
    - datalake_sales_flow_raw.bypass.created_at
  ts_updated:
    description: Timestamp that indicates when this entry was last updated.
    lineage:
    - datalake_sales_flow_raw.bypass.updated_at
  year:
    description: Partition year when the ETL run loaded this row into the lake table.
    lineage:
    - datalake_sales_flow_raw.bypass.year
  month:
    description: Partition month when the ETL run loaded this row into the lake table.
    lineage:
    - datalake_sales_flow_raw.bypass.month
  day:
    description: Partition day when the ETL run loaded this row into the lake table.
    lineage:
    - datalake_sales_flow_raw.bypass.day
