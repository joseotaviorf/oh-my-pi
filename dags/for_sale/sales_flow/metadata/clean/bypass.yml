database_name: datalake_sales_flow_clean
table_name: bypass
owner: helder.rodrigues@quintoandar.com.br
domain: For Sale
description: Stores "bypass" cases, i.e. situations where a property (house) may be closing a sale outside of QuintoAndar's regular flow, detected by an automated document/registration analysis. Each row represents one analysis run for a given house, including its findings, rating, and confirmation status. (JPA entity — `BypassEntity`, `br.com.quintoandar.salesflow.core.bypass.BypassEntity`)
columns:
  id:
    description: Unique surrogate ID for the bypass case.
    lineage:
    - datalake_sales_flow_raw.bypass.id
  id_house:
    description: House ID (house_id) referencing the property on the main listings tables that this bypass analysis was run against.
    lineage:
    - datalake_sales_flow_raw.bypass.house_id
  register_number:
    description: Property registration (matrícula) number identified during the bypass document analysis.
    lineage:
    - datalake_sales_flow_raw.bypass.register_number
  rating:
    description: Numeric rating (integer score, not a category/string) assigned to the bypass case during analysis.
    lineage:
    - datalake_sales_flow_raw.bypass.rating
  status:
    description: 'Current status of the bypass analysis, backed by the BypassStatus enum. Possible values: PENDING, PROCESSED, REVISED.'
    lineage:
    - datalake_sales_flow_raw.bypass.status
  file_path_s3:
    description: S3 path (filepath_s3) to the files associated with the bypass analysis.
    lineage:
    - datalake_sales_flow_raw.bypass.filepath_s3
  message:
    description: Free-text message or note generated by the bypass analysis process.
    lineage:
    - datalake_sales_flow_raw.bypass.message
  found_data:
    description: Structured data (stored as a JSON/JSONB map of key-value pairs on the entity) extracted from documents during the bypass analysis.
    lineage:
    - datalake_sales_flow_raw.bypass.found_data
  is_bypass:
    description: Boolean flag (bypass_confirmation on the entity) indicating whether the case was confirmed as an actual bypass.
    lineage:
    - datalake_sales_flow_raw.bypass.bypass_confirmation
  dt_processing:
    description: Date/timestamp (processing_date) when the bypass analysis was run.
    lineage:
    - datalake_sales_flow_raw.bypass.processing_date
  ts_created:
    description: Timestamp when the bypass record was created in the source operational system.
    lineage:
    - datalake_sales_flow_raw.bypass.created_at
  ts_updated:
    description: Timestamp when the bypass record was last updated in the source operational system.
    lineage:
    - datalake_sales_flow_raw.bypass.updated_at
  year:
    description: Year when the ETL run loaded this row into the lake table.
    lineage:
    - datalake_sales_flow_raw.bypass.year
  month:
    description: Month when the ETL run loaded this row into the lake table.
    lineage:
    - datalake_sales_flow_raw.bypass.month
  day:
    description: Day when the ETL run loaded this row into the lake table.
    lineage:
    - datalake_sales_flow_raw.bypass.day
