database_name: datalake_sales_flow_clean
table_name: sales_flow_pendency
domain: For Sale
columns:
  id:
    lineage:
    - datalake_sales_flow_raw.sales_flow_pendency.id
    description: Surrogate primary key of the sales flow pendency row in the source system.
  id_sales_flow:
    lineage:
    - datalake_sales_flow_raw.sales_flow_pendency.sales_flow_id
    description: Foreign key to the parent sales flow transaction in the end-of-funnel domain.
  pendency:
    lineage:
    - datalake_sales_flow_raw.sales_flow_pendency.pendency
    description: Open pendency or blocker item preventing the sales flow from advancing.
  type:
    lineage:
    - datalake_sales_flow_raw.sales_flow_pendency.type
    description: Classifier distinguishing record subtype or participant role in the workflow.
  ts_created:
    lineage:
    - datalake_sales_flow_raw.sales_flow_pendency.created_at
    description: Timestamp when the row was first created in the source operational system.
  ts_updated:
    lineage:
    - datalake_sales_flow_raw.sales_flow_pendency.updated_at
    description: Timestamp when the row was last updated in the source operational system.
  year:
    lineage:
    - datalake_sales_flow_raw.sales_flow_pendency.year
    description: Partition year when the ETL run loaded this row into the lake table.
  month:
    lineage:
    - datalake_sales_flow_raw.sales_flow_pendency.month
    description: Partition month when the ETL run loaded this row into the lake table.
  day:
    lineage:
    - datalake_sales_flow_raw.sales_flow_pendency.day
    description: Partition day when the ETL run loaded this row into the lake table.
owner: helder.rodrigues@quintoandar.com.br
description: Cleaned snapshot of sales flow pendency sourced from operational systems backing Sales Flow service managing For Sale operations after an offer is received. One row per sales flow pendency record with standardized names and types in datalake_sales_flow_clean.
