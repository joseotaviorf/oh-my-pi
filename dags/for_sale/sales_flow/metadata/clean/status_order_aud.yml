database_name: datalake_sales_flow_clean
table_name: status_order_aud
domain: For Sale
owner: helder.rodrigues@quintoandar.com.br
description: Status order type aud table.
columns:
  id:
    description: ID microstatus of Closing process
    lineage:
    - datalake_sales_flow_raw.status_order_aud.id
  id_closing_type:
    description: Closing type ID on closing_type Tables
    lineage:
    - datalake_sales_flow_raw.status_order_aud.closing_type_id
  id_status:
    description: ID macrostatus of Closing process on status Tables
    lineage:
    - datalake_sales_flow_raw.status_order_aud.status_id
  rev:
    description: ID of the revision that replaced the current entry.
    lineage:
    - datalake_sales_flow_raw.status_order_aud.rev
  rev_type:
    description: 'Envers revision type code: insert, update, or delete for the audited row.'
    categories:
      '0': Create
      '1': Update
      '2': Delete
    lineage:
    - datalake_sales_flow_raw.status_order_aud.revtype
  rev_end:
    description: ID of the revision that replaced the current entry.
    lineage:
    - datalake_sales_flow_raw.status_order_aud.revend
  ordering:
    description: Ordering of micro and macro status of Closing process, like 1st Offer Sent, 2nd Signature CCV, 3rd Down Payment and etc.
    lineage:
    - datalake_sales_flow_raw.status_order_aud.ordering
  mod_id_closing_type:
    description: Flag indicating if the id_closing_type phone has changed.
    lineage:
    - datalake_sales_flow_raw.status_order_aud.closing_type_id_mod
  mod_id_status:
    description: Flag indicating if the id_status phone has changed.
    lineage:
    - datalake_sales_flow_raw.status_order_aud.status_id_mod
  mod_ordering:
    description: Flag indicating if the ordering phone has changed.
    lineage:
    - datalake_sales_flow_raw.status_order_aud.ordering_mod
  ts_created:
    description: Timestamp that indicates when this entry was created.
    lineage:
    - datalake_sales_flow_raw.status_order_aud.created_at
  ts_updated:
    description: Timestamp that indicates when this entry was last updated.
    lineage:
    - datalake_sales_flow_raw.status_order_aud.updated_at
  year:
    description: Year when the ETL run loaded this row into the lake table.
    lineage:
    - datalake_sales_flow_raw.status_order_aud.year
  month:
    description: Month when the ETL run loaded this row into the lake table.
    lineage:
    - datalake_sales_flow_raw.status_order_aud.month
  day:
    description: Day when the ETL run loaded this row into the lake table.
    lineage:
    - datalake_sales_flow_raw.status_order_aud.day
