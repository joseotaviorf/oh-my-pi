database_name: datalake_sales_flow_clean
table_name: bypass_aud
owner: helder.rodrigues@quintoandar.com.br
domain: For Sale
description: Hibernate Envers audit trail of bypass rows from Sales Flow service managing For Sale operations after an offer is received. Each revision records field-level changes for compliance and operational forensics.
columns:
  id:
    description: Bypass case unique ID
    lineage:
    - datalake_sales_flow_raw.bypass_aud.id
  id_house:
    description: House ID on main (EBDB) tables
    lineage:
    - datalake_sales_flow_raw.bypass_aud.house_id
  rev:
    description: Unique id for this modification and can be joined with table rev_info to get more details.
    lineage:
    - datalake_sales_flow_raw.bypass_aud.rev
  rev_type:
    description: 'Envers revision type code: insert, update, or delete for the audited row.'
    categories:
      '0': Create
      '1': Update
      '2': Delete
    lineage:
    - datalake_sales_flow_raw.bypass_aud.revtype
  rev_end:
    description: ID of the revision that replaced the current entry.
    lineage:
    - datalake_sales_flow_raw.bypass_aud.revend
  register_number:
    description: Audited property registration number identified during bypass analysis.
    lineage:
    - datalake_sales_flow_raw.bypass_aud.register_number
  rating:
    description: Audited rating assigned to the bypass case during analysis.
    lineage:
    - datalake_sales_flow_raw.bypass_aud.rating
  status:
    description: Bypass analysis status, PROCESSED or PENDING.
    lineage:
    - datalake_sales_flow_raw.bypass_aud.status
  file_path_s3:
    description: Bypass files path on s3.
    lineage:
    - datalake_sales_flow_raw.bypass_aud.filepath_s3
  message:
    description: Audited message or note generated by the bypass analysis.
    lineage:
    - datalake_sales_flow_raw.bypass_aud.message
  found_data:
    description: OCR data found on documents.
    lineage:
    - datalake_sales_flow_raw.bypass_aud.found_data
  is_bypass:
    description: Flag indicating if is bypass.
    lineage:
    - datalake_sales_flow_raw.bypass_aud.bypass_confirmation
  mod_status:
    description: Flag indicating if the column status has changed.
    lineage:
    - datalake_sales_flow_raw.bypass_aud.status_mod
  mod_register_number:
    description: Flag indicating if the column register_number has changed.
    lineage:
    - datalake_sales_flow_raw.bypass_aud.register_number_mod
  mod_rating:
    description: Flag indicating if the column rating has changed.
    lineage:
    - datalake_sales_flow_raw.bypass_aud.rating_mod
  mod_processing_date:
    description: Flag indicating if the column processing_date has changed.
    lineage:
    - datalake_sales_flow_raw.bypass_aud.processing_date_mod
  mod_message:
    description: Flag indicating if the column message has changed.
    lineage:
    - datalake_sales_flow_raw.bypass_aud.message_mod
  mod_id_house:
    description: Flag indicating if the column id_house has changed.
    lineage:
    - datalake_sales_flow_raw.bypass_aud.house_id_mod
  mod_found_data:
    description: Flag indicating if the column found_data has changed.
    lineage:
    - datalake_sales_flow_raw.bypass_aud.found_data_mod
  mod_file_path_s3:
    description: Flag indicating if the column file_path_s3 has changed.
    lineage:
    - datalake_sales_flow_raw.bypass_aud.filepath_s3_mod
  mod_is_bypass:
    description: Flag indicating if the column is_bypass has changed.
    lineage:
    - datalake_sales_flow_raw.bypass_aud.bypass_confirmation_mod
  dt_processing:
    description: Date when the analysis ran.
    lineage:
    - datalake_sales_flow_raw.bypass_aud.processing_date
  ts_created:
    description: Timestamp that indicates when this entry was created.
    lineage:
    - datalake_sales_flow_raw.bypass_aud.created_at
  ts_updated:
    description: Timestamp that indicates when this entry was last updated.
    lineage:
    - datalake_sales_flow_raw.bypass_aud.updated_at
  year:
    description: Year when the ETL run loaded this row into the lake table.
    lineage:
    - datalake_sales_flow_raw.bypass_aud.year
  month:
    description: Month when the ETL run loaded this row into the lake table.
    lineage:
    - datalake_sales_flow_raw.bypass_aud.month
  day:
    description: Day when the ETL run loaded this row into the lake table.
    lineage:
    - datalake_sales_flow_raw.bypass_aud.day
