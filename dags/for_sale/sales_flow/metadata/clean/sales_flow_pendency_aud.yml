database_name: datalake_sales_flow_clean
table_name: sales_flow_pendency_aud
domain: For Sale
columns:
  id:
    lineage:
    - datalake_sales_flow_raw.sales_flow_pendency_aud.id
    description: Surrogate primary key of the sales flow pendency aud row in the source system.
  id_sales_flow:
    lineage:
    - datalake_sales_flow_raw.sales_flow_pendency_aud.sales_flow_id
    description: Foreign key to the parent sales flow transaction in the end-of-funnel domain.
  rev:
    lineage:
    - datalake_sales_flow_raw.sales_flow_pendency_aud.rev
    description: Envers revision number grouping field-level changes in this audit snapshot.
  rev_type:
    lineage:
    - datalake_sales_flow_raw.sales_flow_pendency_aud.revtype
    description: 'Envers revision type code: insert, update, or delete for the audited row.'
  rev_end:
    lineage:
    - datalake_sales_flow_raw.sales_flow_pendency_aud.revend
    description: Envers revision end marker when this audited row version was superseded.
  pendency:
    lineage:
    - datalake_sales_flow_raw.sales_flow_pendency_aud.pendency
    description: Open pendency or blocker item preventing the sales flow from advancing.
  type:
    lineage:
    - datalake_sales_flow_raw.sales_flow_pendency_aud.type
    description: Classifier distinguishing record subtype or participant role in the workflow.
  mod_id_sales_flow:
    lineage:
    - datalake_sales_flow_raw.sales_flow_pendency_aud.sales_flow_id_mod
    description: Envers boolean flag indicating whether id sales flow changed in this audit revision.
  mod_type:
    lineage:
    - datalake_sales_flow_raw.sales_flow_pendency_aud.type_mod
    description: Envers boolean flag indicating whether type changed in this audit revision.
  mod_pendency:
    lineage:
    - datalake_sales_flow_raw.sales_flow_pendency_aud.pendency_mod
    description: Envers boolean flag indicating whether pendency changed in this audit revision.
  ts_created:
    lineage:
    - datalake_sales_flow_raw.sales_flow_pendency_aud.created_at
    description: Timestamp when the row was first created in the source operational system.
  ts_updated:
    lineage:
    - datalake_sales_flow_raw.sales_flow_pendency_aud.updated_at
    description: Timestamp when the row was last updated in the source operational system.
  year:
    lineage:
    - datalake_sales_flow_raw.sales_flow_pendency_aud.year
    description: Year when the ETL run loaded this row into the lake table.
  month:
    lineage:
    - datalake_sales_flow_raw.sales_flow_pendency_aud.month
    description: Month when the ETL run loaded this row into the lake table.
  day:
    lineage:
    - datalake_sales_flow_raw.sales_flow_pendency_aud.day
    description: Day when the ETL run loaded this row into the lake table.
owner: helder.rodrigues@quintoandar.com.br
description: Hibernate Envers audit trail of sales flow pendency rows from Sales Flow service managing For Sale operations after an offer is received. Each revision records field-level changes for compliance and operational forensics.
