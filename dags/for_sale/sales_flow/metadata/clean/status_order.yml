database_name: datalake_sales_flow_clean
table_name: status_order
domain: For Sale
owner: helder.rodrigues@quintoandar.com.br
description: Defines the expected sequence of macrostatus stages (e.g. Offer, Sale Agreement, Diligence, Credit) that a closing process goes through for a given closing type (e.g. cash vs. financed). Each row pins one macrostatus to a position (`ordering`) within a specific closing type's workflow, and is the parent of the finer-grained sequence stored in microstatus_order. (JPA entity — `StatusOrder`, `br.com.quintoandar.salesflow.core.status.statusorder.StatusOrder`)
columns:
  id:
    description: Surrogate primary key of the status_order row (BaseEntity.id), generated by the database.
    lineage:
    - datalake_sales_flow_raw.status_order.id
  id_closing_type:
    description: Foreign key to the closing_type table identifying which closing workflow (e.g. cash or financed) this status ordering applies to.
    lineage:
    - datalake_sales_flow_raw.status_order.closing_type_id
  id_status:
    description: Foreign key to the status table, identifying the macrostatus (top-level stage, e.g. Offer, Sale Agreement, Diligence) that this ordering entry represents.
    lineage:
    - datalake_sales_flow_raw.status_order.status_id
  ordering:
    description: Integer position of this macrostatus within the sequence of stages for the given closing type (e.g. 1st Offer Sent, 2nd Signature CCV, 3rd Down Payment).
    lineage:
    - datalake_sales_flow_raw.status_order.ordering
  ts_created:
    description: Timestamp that indicates when this entry was created.
    lineage:
    - datalake_sales_flow_raw.status_order.created_at
  ts_updated:
    description: Timestamp that indicates when this entry was last updated.
    lineage:
    - datalake_sales_flow_raw.status_order.updated_at
  year:
    description: Year when the ETL run loaded this row into the lake table.
    lineage:
    - datalake_sales_flow_raw.status_order.year
  month:
    description: Month when the ETL run loaded this row into the lake table.
    lineage:
    - datalake_sales_flow_raw.status_order.month
  day:
    description: Day when the ETL run loaded this row into the lake table.
    lineage:
    - datalake_sales_flow_raw.status_order.day
