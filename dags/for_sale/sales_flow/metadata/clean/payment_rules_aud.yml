---
database_name: datalake_sales_flow_clean
table_name: payment_rules_aud
domain: For Sale
owner: igor.firmo@quintoandar.com.br
description: Audit table for payment_rules containing historical changes and modifications to payment installment rules.
columns:
  id:
    description: Unique ID for the payment rules record.
    lineage:
      - datalake_sales_flow_raw.payment_rules_aud.id
  rev:
    description: Unique id for this modification and can be joined with table rev_info to get more details.
    lineage:
      - datalake_sales_flow_raw.payment_rules_aud.rev
  rev_type:
    description: Modification type.
    categories:
      "0" : Create
      "1" : Update
      "2" : Delete
    lineage:
      - datalake_sales_flow_raw.payment_rules_aud.revtype
  rev_end:
    description: ID of the revision that replaced the current entry.
    lineage:
      - datalake_sales_flow_raw.payment_rules_aud.revend
  id_payment:
    description: Foreign key to the payment table.
    lineage:
