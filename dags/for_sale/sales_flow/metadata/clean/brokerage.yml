database_name: datalake_sales_flow_clean
table_name: brokerage
description: Brokerage information associated with an offer.
domain: For Sale
owner: helder.rodrigues@quintoandar.com.br
columns:
  id_brokerage:
    lineage:
    - datalake_sales_flow_raw.brokerage.id
    description: Unique identifier of the brokerage record.
  id_sales_flow:
    lineage:
    - datalake_sales_flow_raw.brokerage.sales_flow_id
    description: Foreign key to the parent sales flow transaction in the end-of-funnel domain.
  brokerage_fee_payer:
    lineage:
    - datalake_sales_flow_raw.brokerage.brokerage_fee_payer
    description: Party responsible for paying the brokerage fee.
  brokerage_payment_timeframe:
    lineage:
    - datalake_sales_flow_raw.brokerage.brokerage_payment_timeframe
    description: Agreed timeframe for paying the brokerage fee.
  brokerage_fee:
    lineage:
    - datalake_sales_flow_raw.brokerage.brokerage_fee
    description: Brokerage fee amount charged on the sale.
  quinto_andar_brokerage_split:
    lineage:
    - datalake_sales_flow_raw.brokerage.quinto_andar_brokerage_split
    description: QuintoAndar share of the brokerage fee.
  brokerage_payment_deadline:
    lineage:
    - datalake_sales_flow_raw.brokerage.brokerage_payment_deadline
    description: Deadline date for paying the brokerage fee.
  ts_created:
    lineage:
    - datalake_sales_flow_raw.brokerage.created_at
    description: Timestamp when the row was first created in the source operational system.
  ts_updated:
    lineage:
    - datalake_sales_flow_raw.brokerage.updated_at
    description: Timestamp when the row was last updated in the source operational system.
  year:
    lineage:
    - datalake_sales_flow_raw.brokerage.year
    description: Partition year when the ETL run loaded this row into the lake table.
  month:
    lineage:
    - datalake_sales_flow_raw.brokerage.month
    description: Partition month when the ETL run loaded this row into the lake table.
  day:
    lineage:
    - datalake_sales_flow_raw.brokerage.day
    description: Partition day when the ETL run loaded this row into the lake table.
