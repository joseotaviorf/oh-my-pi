database_name: datalake_sales_flow_clean
table_name: cash_payment_aud
domain: For Sale
columns:
  id_cash_payment_aud:
    lineage:
    - datalake_sales_flow_raw.cash_payment_aud.id
    description: Audited identifier of the cash payment record, matching cash_payment.id_cash_payment in datalake_sales_flow_clean.
  id_payment:
    lineage:
    - datalake_sales_flow_raw.cash_payment_aud.payment_id
    description: Audited foreign key to the parent payment record associated with this cash payment.
  partner_notary:
    lineage:
    - datalake_sales_flow_raw.cash_payment_aud.partner_notary
    description: Audited name or identifier of the partner notary handling this cash payment.
  status_notary_notes:
    lineage:
    - datalake_sales_flow_raw.cash_payment_aud.status_notary_notes
    description: Audited free-text notes on the status of the notary process for this cash payment.
  crn_details:
    lineage:
    - datalake_sales_flow_raw.cash_payment_aud.crn_details
    description: Audited details of the CRN (Central de Registro Nacional) process for this cash payment.
  status_fgts:
    lineage:
    - datalake_sales_flow_raw.cash_payment_aud.status_fgts
    description: Audited status of the FGTS (Fundo de Garantia do Tempo de Servico) process for this cash payment.
  rev:
    lineage:
    - datalake_sales_flow_raw.cash_payment_aud.rev
    description: Envers revision number grouping field-level changes in this audit snapshot.
  rev_type:
    lineage:
    - datalake_sales_flow_raw.cash_payment_aud.revtype
    description: 'Envers revision type code: insert, update, or delete for the audited row.'
  rev_end:
    lineage:
    - datalake_sales_flow_raw.cash_payment_aud.revend
    description: Envers revision end marker when this audited row version was superseded.
  mod_id_payment:
    lineage:
    - datalake_sales_flow_raw.cash_payment_aud.payment_id_mod
    description: Envers boolean flag indicating whether id payment changed in this audit revision.
  mod_partner_notary:
    lineage:
    - datalake_sales_flow_raw.cash_payment_aud.partner_notary_mod
    description: Envers boolean flag indicating whether partner notary changed in this audit revision.
  mod_status_notary_notes:
    lineage:
    - datalake_sales_flow_raw.cash_payment_aud.status_notary_notes_mod
    description: Envers boolean flag indicating whether status notary notes changed in this audit revision.
  mod_ts_crn_started:
    lineage:
    - datalake_sales_flow_raw.cash_payment_aud.crn_started_at_mod
    description: Envers boolean flag indicating whether ts crn started changed in this audit revision.
  mod_ts_crn_returned:
    lineage:
    - datalake_sales_flow_raw.cash_payment_aud.crn_returned_at_mod
    description: Envers boolean flag indicating whether ts crn returned changed in this audit revision.
  mod_ts_crn_ended:
    lineage:
    - datalake_sales_flow_raw.cash_payment_aud.crn_ended_at_mod
    description: Envers boolean flag indicating whether ts crn ended changed in this audit revision.
  mod_crn_details:
    lineage:
    - datalake_sales_flow_raw.cash_payment_aud.crn_details_mod
    description: Envers boolean flag indicating whether crn details changed in this audit revision.
  mod_status_fgts:
    lineage:
    - datalake_sales_flow_raw.cash_payment_aud.status_fgts_mod
    description: Envers boolean flag indicating whether status fgts changed in this audit revision.
  mod_ts_draft_fgts_started:
    lineage:
    - datalake_sales_flow_raw.cash_payment_aud.draft_fgts_started_at_mod
    description: Envers boolean flag indicating whether ts draft fgts started changed in this audit revision.
  mod_ts_draft_fgts_ended:
    lineage:
    - datalake_sales_flow_raw.cash_payment_aud.draft_fgts_ended_at_mod
    description: Envers boolean flag indicating whether ts draft fgts ended changed in this audit revision.
  ts_crn_started:
    lineage:
    - datalake_sales_flow_raw.cash_payment_aud.crn_started_at
    description: Audited timestamp marking when the CRN registration process started for this cash payment.
  ts_crn_returned:
    lineage:
    - datalake_sales_flow_raw.cash_payment_aud.crn_returned_at
    description: Audited timestamp marking when the CRN registration was returned for this cash payment.
  ts_crn_ended:
    lineage:
    - datalake_sales_flow_raw.cash_payment_aud.crn_ended_at
    description: Audited timestamp marking when the CRN registration process ended for this cash payment.
  ts_draft_fgts_started:
    lineage:
    - datalake_sales_flow_raw.cash_payment_aud.draft_fgts_started_at
    description: Audited timestamp marking when the FGTS draft process started for this cash payment.
  ts_draft_fgts_ended:
    lineage:
    - datalake_sales_flow_raw.cash_payment_aud.draft_fgts_ended_at
    description: Audited timestamp marking when the FGTS draft process ended for this cash payment.
  ts_created:
    lineage:
    - datalake_sales_flow_raw.cash_payment_aud.created_at
    description: Timestamp when the row was first created in the source operational system.
  ts_updated:
    lineage:
    - datalake_sales_flow_raw.cash_payment_aud.updated_at
    description: Timestamp when the row was last updated in the source operational system.
  year:
    lineage:
    - datalake_sales_flow_raw.cash_payment_aud.year
    description: Year when the ETL run loaded this row into the lake table.
  month:
    lineage:
    - datalake_sales_flow_raw.cash_payment_aud.month
    description: Month when the ETL run loaded this row into the lake table.
  day:
    lineage:
    - datalake_sales_flow_raw.cash_payment_aud.day
    description: Day when the ETL run loaded this row into the lake table.
owner: helder.rodrigues@quintoandar.com.br
description: Hibernate Envers audit trail of cash payment rows from Sales Flow service managing For Sale operations after an offer is received. Each revision records field-level changes for compliance and operational forensics.
