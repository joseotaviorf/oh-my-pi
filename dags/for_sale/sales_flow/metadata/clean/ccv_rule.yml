database_name: datalake_sales_flow_clean
table_name: ccv_rule
domain: For Sale
owner: helder.rodrigues@quintoandar.com.br
description: Stores business-rule files (and their integrity checksums) tied to a specific version of the CCV contract template. Each row represents one named rule file, its type, and a storage token pointing to the underlying file content. Rows are created when new CCV rule definitions are registered for a given contract template version, used to validate or drive contract generation logic. (JPA entity — CcvRule, in the Sales Flow service)
columns:
  id_ccv_rule:
    lineage:
    - datalake_sales_flow_raw.ccv_rule.id
    description: Primary key of the ccv_rule row (CcvRule entity), one row per business rule file associated with a CCV contract template version.
  ccv_version:
    lineage:
    - datalake_sales_flow_raw.ccv_rule.ccv_version
    description: Version of the CCV contract template that this rule applies to.
  type:
    lineage:
    - datalake_sales_flow_raw.ccv_rule.type
    description: Free-text type/category of the rule, as stored by the source system (plain string field, not a fixed enumeration).
  ccv_rule_name:
    lineage:
    - datalake_sales_flow_raw.ccv_rule.name
    description: Human-readable name of the CCV contract rule.
  storage_hash_token:
    lineage:
    - datalake_sales_flow_raw.ccv_rule.storage_hash_token
    description: Storage token referencing the rule's file content in the document/file storage backend.
  checksum:
    lineage:
    - datalake_sales_flow_raw.ccv_rule.checksum
    description: Checksum used to verify the integrity of the stored CCV rule content.
  ts_created:
    lineage:
    - datalake_sales_flow_raw.ccv_rule.created_at
    description: Timestamp when the row was first created in the source operational system.
  ts_updated:
    lineage:
    - datalake_sales_flow_raw.ccv_rule.updated_at
    description: Timestamp when the row was last updated in the source operational system.
  year:
    lineage:
    - datalake_sales_flow_raw.ccv_rule.year
    description: Year when the ETL run loaded this row into the lake table.
  month:
    lineage:
    - datalake_sales_flow_raw.ccv_rule.month
    description: Month when the ETL run loaded this row into the lake table.
  day:
    lineage:
    - datalake_sales_flow_raw.ccv_rule.day
    description: Day when the ETL run loaded this row into the lake table.
