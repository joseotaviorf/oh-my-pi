database_name: datalake_sales_flow_clean
table_name: status_record
domain: For Sale
owner: helder.rodrigues@quintoandar.com.br
description: The main objective of the table is registered all status changes throughout the sales process. A status can coincide with another status on the same date.
columns:
  id:
    description: Macrostatus ID on status Tables
    lineage:
    - datalake_sales_flow_raw.status_record.id
  id_sales_flow:
    description: Offer ID on SalesFlow tables.
    lineage:
    - datalake_sales_flow_raw.status_record.sales_flow_id
  id_status:
    description: Status ID on status Tables.
    lineage:
    - datalake_sales_flow_raw.status_record.status_id
  ts_status_start:
    description: Date of registration of start of a status.
    lineage:
    - datalake_sales_flow_raw.status_record.status_start_date
  ts_status_end:
    description: Date of registration of finish of a status.
    lineage:
    - datalake_sales_flow_raw.status_record.status_end_date
  ts_created:
    description: Timestamp that indicates when this entry was created.
    lineage:
    - datalake_sales_flow_raw.status_record.created_at
  ts_updated:
    description: Timestamp that indicates when this entry was last updated.
    lineage:
    - datalake_sales_flow_raw.status_record.updated_at
  year:
    description: Partition year when the ETL run loaded this row into the lake table.
    lineage:
    - datalake_sales_flow_raw.status_record.year
  month:
    description: Partition month when the ETL run loaded this row into the lake table.
    lineage:
    - datalake_sales_flow_raw.status_record.month
  day:
    description: Partition day when the ETL run loaded this row into the lake table.
    lineage:
    - datalake_sales_flow_raw.status_record.day
