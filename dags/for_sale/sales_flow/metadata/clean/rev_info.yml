database_name: datalake_sales_flow_clean
table_name: rev_info
domain: For Sale
owner: helder.rodrigues@quintoandar.com.br
description: Table that contains revision information for audited tables.
columns:
  id:
    description: Hibernate Envers revision id; each audited _aud row joins back to this id to identify the revision that produced it.
    lineage:
    - datalake_sales_flow_raw.revinfo.id
  id_user:
    description: User ID associated with the revision.
    lineage:
    - datalake_sales_flow_raw.revinfo.user_id
  id_keycloak:
    description: Keycloak ID associated with the user who made the change.
    lineage:
    - datalake_sales_flow_raw.revinfo.keycloak_id
  id_trace:
    description: Trace ID for request tracking and debugging.
    lineage:
    - datalake_sales_flow_raw.revinfo.trace_id
  ts_created:
    description: Revision timestamp recorded by Envers, converted from the source epoch-millis value to when the audited change was committed.
    lineage:
    - datalake_sales_flow_raw.revinfo.timestamp
  year:
    description: Partition year when the ETL run loaded this row into the lake table.
    lineage:
    - datalake_sales_flow_raw.revinfo.year
  month:
    description: Partition month when the ETL run loaded this row into the lake table.
    lineage:
    - datalake_sales_flow_raw.revinfo.month
  day:
    description: Partition day when the ETL run loaded this row into the lake table.
    lineage:
    - datalake_sales_flow_raw.revinfo.day
