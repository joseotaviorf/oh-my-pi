database_name: datalake_sales_flow_clean
table_name: closing_type_aud
domain: For Sale
owner: helder.rodrigues@quintoandar.com.br
description: Hibernate Envers audit trail of closing type rows from Sales Flow service managing For Sale operations after an offer is received. Each revision records field-level changes for compliance and operational forensics.
columns:
  id:
    description: Surrogate primary key of the closing type aud row in the source system.
    lineage:
    - datalake_sales_flow_raw.closing_type_aud.id
  id_label:
    description: Label of Closing process
    lineage:
    - datalake_sales_flow_raw.closing_type_aud.label_id
  id_parent:
    description: ID to match and identify the macro and micro status in the Closing process.
    lineage:
    - datalake_sales_flow_raw.closing_type_aud.parent_id
  rev:
    description: Unique id for this modification and can be joined with table rev_info to get more details.
    lineage:
    - datalake_sales_flow_raw.closing_type_aud.rev
  rev_type:
    description: 'Envers revision type code: insert, update, or delete for the audited row.'
    categories:
      '0': Create
      '1': Update
      '2': Delete
    lineage:
    - datalake_sales_flow_raw.closing_type_aud.revtype
  rev_end:
    description: ID of the revision that replaced the current entry.
    lineage:
    - datalake_sales_flow_raw.closing_type_aud.revend
  key:
    description: Which offer model (CCV Assistance, Pampas etc), type of financing (External or Internal) and payment method (Financed or Cash).
    lineage:
    - datalake_sales_flow_raw.closing_type_aud.key
  mod_id_label:
    description: Flag indicating if the id_label phone has changed.
    lineage:
    - datalake_sales_flow_raw.closing_type_aud.label_id_mod
  mod_id_parent:
    description: Flag indicating if the id_parent phone has changed.
    lineage:
    - datalake_sales_flow_raw.closing_type_aud.parent_id_mod
  mod_key:
    description: Flag indicating if the key phone has changed.
    lineage:
    - datalake_sales_flow_raw.closing_type_aud.key_mod
  ts_created:
    description: Timestamp that indicates when this entry was created.
    lineage:
    - datalake_sales_flow_raw.closing_type_aud.created_at
  ts_updated:
    description: Timestamp that indicates when this entry was last updated.
    lineage:
    - datalake_sales_flow_raw.closing_type_aud.updated_at
  year:
    description: Partition year when the ETL run loaded this row into the lake table.
    lineage:
    - datalake_sales_flow_raw.closing_type_aud.year
  month:
    description: Partition month when the ETL run loaded this row into the lake table.
    lineage:
    - datalake_sales_flow_raw.closing_type_aud.month
  day:
    description: Partition day when the ETL run loaded this row into the lake table.
    lineage:
    - datalake_sales_flow_raw.closing_type_aud.day
