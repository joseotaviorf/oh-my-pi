---
database_name: datalake_sales_flow_clean
table_name: mortgage_options
domain: For Sale
owner: igor.firmo@quintoandar.com.br
description: Contains mortgage option configurations and parameters for property financing.
columns:
  id:
    description: Unique ID for the mortgage options record.
    lineage:
      - datalake_sales_flow_raw.mortgage_options.id
  installments_quantity:
    description: Number of installments for the mortgage.
    lineage:
      - datalake_sales_flow_raw.mortgage_options.installments_quantity
  sale_price_amount:
    description: Total sale price amount of the property.
    lineage:
      - datalake_sales_flow_raw.mortgage_options.sale_price_amount
  financing_amount:
    description: Amount to be financed through mortgage.
    lineage:
      - datalake_sales_flow_raw.mortgage_options.financing_amount
  entry_amount:
    description: Down payment/entry amount.
    lineage:
      - datalake_sales_flow_raw.mortgage_options.entry_amount
  amortization_type:
    description: Type of amortization system (e.g. SAC, PRICE).
    lineage:
      - datalake_sales_flow_raw.mortgage_options.amortization_type
  include_fees:
    description: Flag indicating if fees are included in calculation.
    lineage:
      - datalake_sales_flow_raw.mortgage_options.include_fees
  include_valuation_fee:
    description: Flag indicating if valuation fee is included.
    lineage:
      - datalake_sales_flow_raw.mortgage_options.include_valuation_fee
  id_house:
    description: Foreign key to the house table.
    lineage:
      - datalake_sales_flow_raw.mortgage_options.house_id
  ts_created:
    description: Timestamp when the mortgage options were created.
    lineage:
      - datalake_sales_flow_raw.mortgage_options.created_at
  ts_updated:
    description: Timestamp of the last update to the mortgage options.
    lineage:
      - datalake_sales_flow_raw.mortgage_options.updated_at
  year:
    description: Year partition for the mortgage options record.
    lineage:
      - datalake_sales_flow_raw.mortgage_options.year
  month:
    description: Month partition for the mortgage options record.
    lineage:
      - datalake_sales_flow_raw.mortgage_options.month
  day:
    description: Day partition for the mortgage options record.
    lineage:
      - datalake_sales_flow_raw.mortgage_options.day
