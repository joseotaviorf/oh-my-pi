database_name: datalake_sales_flow_clean
table_name: screening_seller
owner: helder.rodrigues@quintoandar.com.br
domain: For Sale
description: Stores the seller-leg screening/document-verification checks performed during a home-purchase closing, with one row per seller profile (seller_data) evaluated within a screening case. It tracks both the internal screening workflow status and the outcome of the legal/registry proposal validation for that seller, plus any legal pendency note raised against them. (JPA entity — `ScreeningSeller`, `br.com.quintoandar.salesflow.core.screening.seller.ScreeningSeller`; managed by `ScreeningSellerService`)
columns:
  id:
    description: Surrogate primary key of the screening seller row in the source system.
    lineage:
    - datalake_sales_flow_raw.screening_seller.id
  id_screening:
    description: Foreign key to the parent screening case (screening table) this seller check belongs to.
    lineage:
    - datalake_sales_flow_raw.screening_seller.screening_id
  id_seller_data:
    description: Foreign key to the seller_data profile being screened; this is a one-to-one relationship between a seller profile and its screening record.
    lineage:
    - datalake_sales_flow_raw.screening_seller.seller_data_id
  status:
    description: 'Enum tracking progress of the seller screening workflow itself. Possible values: ON_PROGRESS (default, screening still being worked) or COMPLETED (screening finished for this seller).'
    lineage:
    - datalake_sales_flow_raw.screening_seller.status
  proposal_validation_status:
    description: Enum tracking the legal/registry proposal validation outcome for this seller, independent of the screening workflow status.
    categories:
      ON_PROGRESS: Default state; legal/registry proposal validation for the seller is still being worked.
      COMPLETED: Legal/registry proposal validation for the seller is finished, with no open legal pendency.
      LEGAL_PENDENCY_ON_PROGRESS: Validation paused because an open legal pendency was raised against the seller.
      LEGAL_PENDENCY_COMPLETED: Validation finished after the legal pendency against the seller was resolved.
    lineage:
    - datalake_sales_flow_raw.screening_seller.proposal_validation_status
  legal_pendency_note:
    description: Free-text note recorded when a legal pendency (documentation or legal issue) is raised against this seller, describing the pendency blocking proposal approval.
    lineage:
    - datalake_sales_flow_raw.screening_seller.legal_pendency_note
  ts_created:
    description: Timestamp when the seller screening record was first created.
    lineage:
    - datalake_sales_flow_raw.screening_seller.created_at
  ts_updated:
    description: Timestamp of the most recent update to the seller screening record (e.g. status or validation change).
    lineage:
    - datalake_sales_flow_raw.screening_seller.updated_at
  year:
    description: Year when the ETL run loaded this row into the lake table.
    lineage:
    - datalake_sales_flow_raw.screening_seller.year
  month:
    description: Month when the ETL run loaded this row into the lake table.
    lineage:
    - datalake_sales_flow_raw.screening_seller.month
  day:
    description: Day when the ETL run loaded this row into the lake table.
    lineage:
    - datalake_sales_flow_raw.screening_seller.day
