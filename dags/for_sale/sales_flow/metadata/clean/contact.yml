database_name: datalake_sales_flow_clean
table_name: contact
domain: For Sale
columns:
  id_contact:
    lineage:
    - datalakes_sales_flow_raw.contact.id
    description: Unique identifier of the contact (messaging thread) between prospect and agent.
  id_user:
    lineage:
    - datalakes_sales_flow_raw.contact.user_id
    description: Foreign key to the QuintoAndar user who performed the action.
  id_prospect:
    lineage:
    - datalakes_sales_flow_raw.contact.prospect_id
    description: Identifier of the prospect (potential buyer) associated with this contact.
  id_current_agent:
    lineage:
    - datalakes_sales_flow_raw.contact.current_agent_id
    description: Identifier of the agent currently assigned to handle this contact.
  unanswered_messages:
    lineage:
    - datalakes_sales_flow_raw.contact.unanswered_messages
    description: Count of messages in this contact thread still awaiting a reply.
  last_message_sent:
    lineage:
    - datalakes_sales_flow_raw.contact.last_message_sent
    description: Content of the most recent message sent in this contact thread.
  ts_last_message_sent:
    lineage:
    - datalakes_sales_flow_raw.contact.last_message_sent_at
    description: Timestamp when the most recent message in this contact thread was sent.
  ts_created:
    lineage:
    - datalakes_sales_flow_raw.contact.created_at
    description: Timestamp when the row was first created in the source operational system.
  ts_updated:
    lineage:
    - datalakes_sales_flow_raw.contact.updated_at
    description: Timestamp when the row was last updated in the source operational system.
  year:
    lineage:
    - datalakes_sales_flow_raw.contact.year
    description:  year when the ETL run loaded this row into the lake table.
  month:
    lineage:
    - datalakes_sales_flow_raw.contact.month
    description:  month when the ETL run loaded this row into the lake table.
  day:
    lineage:
    - datalakes_sales_flow_raw.contact.day
    description:  day when the ETL run loaded this row into the lake table.
owner: helder.rodrigues@quintoandar.com.br
description: Cleaned snapshot of contact sourced from operational systems backing Sales Flow service managing For Sale operations after an offer is received. One row per contact record with standardized names and types in datalake_sales_flow_clean.
