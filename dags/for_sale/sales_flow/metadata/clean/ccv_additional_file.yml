---
database_name: datalake_sales_flow_clean
table_name: ccv_additional_file
domain: For Sale
owner: igor.firmo@quintoandar.com.br
description: Contains additional files related to CCV (contract) flows in the sales process.
columns:
  id:
    description: Unique ID for the CCV additional file record.
    lineage:
      - datalake_sales_flow_raw.ccv_additional_file.id
  id_ccv_flow:
    description: Foreign key to the ccv_flow table.
    lineage:
      - datalake_sales_flow_raw.ccv_additional_file.ccv_flow_id
  name:
    description: Name of the additional file.
    lineage:
      - datalake_sales_flow_raw.ccv_additional_file.name
  storage_hash_token:
    description: Hash token for file storage reference.
    lineage:
      - datalake_sales_flow_raw.ccv_additional_file.storage_hash_token
  ts_deleted:
    description: Timestamp when the file was deleted (soft delete).
    lineage:
      - datalake_sales_flow_raw.ccv_additional_file.deleted_at
  ts_created:
    description: Timestamp when the additional file record was created.
    lineage:
      - datalake_sales_flow_raw.ccv_additional_file.created_at
  ts_updated:
    description: Timestamp of the last update to the additional file record.
    lineage:
      - datalake_sales_flow_raw.ccv_additional_file.updated_at
  year:
    description: Year partition for the additional file record.
    lineage:
      - datalake_sales_flow_raw.ccv_additional_file.year
  month:
    description: Month partition for the additional file record.
    lineage:
      - datalake_sales_flow_raw.ccv_additional_file.month
  day:
    description: Day partition for the additional file record.
    lineage:
      - datalake_sales_flow_raw.ccv_additional_file.day
