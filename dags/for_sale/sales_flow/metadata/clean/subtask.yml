database_name: datalake_sales_flow_clean
table_name: subtask
owner: helder.rodrigues@quintoandar.com.br
domain: For Sale
description: A concrete unit of work under a parent task. Each subtask specifies what needs to be done (label), what kind of action it represents, who it targets (buyer or seller), the deadline profile that applies once activated, and the business event that activates it; user-level assignment and progress are tracked separately in task_association. (JPA entity — `Subtask`, `br.com.quintoandar.salesflow.core.task.Subtask`)
columns:
  id:
    description: Surrogate primary key of the subtask row (BaseEntity.id), generated by the database.
    lineage:
    - datalake_sales_flow_raw.subtask.id
  id_task:
    description: Foreign key to the task table identifying the parent task this subtask belongs to.
    lineage:
    - datalake_sales_flow_raw.subtask.task_id
  label:
    description: Enum (SubtaskLabel) identifying the specific action or instruction this subtask represents (e.g. REGISTRATION_PROTOCOL, ISSUE_REAL_STATE_REGISTRY_CERTIFICATE, FINANCING_CONTRACT_SIGNATURE, CREDIT_ANALYSIS_FORM). It is a very large enumeration, including hundreds of granular CCV special-clause action labels (many generated with AI assistance in November 2025) alongside long-standing legal/registry subtask labels; some labels (e.g. ISSUE_REAL_STATE_REGISTRY_CERTIFICATE, FINANCING_CONTRACT_SIGNATURE, CREDIT_ANALYSIS_FORM, INSPECTION_FEE_PAYMENT, ENTRY_AMOUNT_PAYMENT) trigger additional logic in TaskService when associated to users or marked as concluded.
    lineage:
    - datalake_sales_flow_raw.subtask.label
  type:
    description: Enum (SubtaskType) classifying the nature of the subtask.
    categories:
      INSTRUCTION: Informational subtask with no required user action to verify or respond to.
      ACTION_CHECK: An action that must be performed and then verified as done.
      ACTION_RESPONSE: An action that requires the user to provide a response.
    lineage:
    - datalake_sales_flow_raw.subtask.type
  target:
    description: Enum (SubtaskTarget) identifying which party this subtask is addressed to, either BUYER or SELLER.
    lineage:
    - datalake_sales_flow_raw.subtask.target
  deadline:
    description: |
      Enum (SubtaskDeadline) defining the deadline profile applied once the subtask is activated.
      This is not a date value; each category encodes a quantity of days and whether they are
      counted as regular calendar days or business days.
    categories:
      THREE_REGULAR_DAYS: 3 calendar days to complete the subtask after activation.
      TEN_REGULAR_DAYS: 10 calendar days to complete the subtask after activation.
      FIFTEEN_BUSINESS_DAYS: 15 business days to complete the subtask after activation.
      FIFTEEN_REGULAR_DAYS: 15 calendar days to complete the subtask after activation.
      TWENTY_REGULAR_DAYS: 20 calendar days to complete the subtask after activation.
      THIRTY_REGULAR_DAYS: 30 calendar days to complete the subtask after activation.
      FORTY_REGULAR_DAYS: 40 calendar days to complete the subtask after activation.
      HUNDRED_REGULAR_DAYS: 100 calendar days to complete the subtask after activation.
      NO_DEADLINE: No explicit deadline; the subtask relies on default handling instead of a day count.
    lineage:
    - datalake_sales_flow_raw.subtask.deadline
  activation_trigger:
    description: Enum (ActivationTrigger) identifying the business event that activates this subtask.
    categories:
      CCV_SIGNED: Activated when the purchase and sale contract (CCV) is signed.
      PROPERTY_REGISTRATION_UPDATE_CONCLUDED: Activated when a pending property registry update is concluded.
      UPDATED_REGISTRY_UPLOADED: Activated when an updated real estate registry certificate is uploaded.
      OFFER_SENT: Activated when the purchase offer is sent.
      ENTRY_AMOUNT_PAID: Activated when the entry/down-payment amount is paid.
      DUE_DILIGENCE_ACCEPTED: Activated when the due-diligence findings are accepted.
      MORTGAGE_BANK_CHOSEN: Activated when the financing bank/mortgage institution is chosen.
    lineage:
    - datalake_sales_flow_raw.subtask.activation_trigger
  ts_created:
    description: Timestamp of the creation of the subtask
    lineage:
    - datalake_sales_flow_raw.subtask.created_at
  ts_updated:
    description: Timestamp of the last update of the subtask
    lineage:
    - datalake_sales_flow_raw.subtask.updated_at
  year:
    lineage:
    - datalake_sales_flow_raw.subtask.year
    description: Year when the ETL run loaded this row into the lake table.
  month:
    lineage:
    - datalake_sales_flow_raw.subtask.month
    description: Month when the ETL run loaded this row into the lake table.
  day:
    lineage:
    - datalake_sales_flow_raw.subtask.day
    description: Day when the ETL run loaded this row into the lake table.
