database_name: datalake_sales_flow_clean
table_name: contact_aud
domain: For Sale
columns:
  id_contact:
    lineage:
    - datalake_sales_flow_raw.contact_aud.id
    description: Audited identifier of the contact (messaging thread) at this revision.
  id_user:
    lineage:
    - datalake_sales_flow_raw.contact_aud.user_id
    description: Foreign key to the QuintoAndar user who performed the action.
  id_prospect:
    lineage:
    - datalake_sales_flow_raw.contact_aud.prospect_id
    description: Audited identifier of the prospect (potential buyer) associated with this contact.
  id_current_agent:
    lineage:
    - datalake_sales_flow_raw.contact_aud.current_agent_id
    description: Audited identifier of the agent assigned to this contact at this revision.
  rev:
    lineage:
    - datalake_sales_flow_raw.contact_aud.rev
    description: Envers revision number grouping field-level changes in this audit snapshot.
  rev_type:
    lineage:
    - datalake_sales_flow_raw.contact_aud.revtype
    description: 'Envers revision type code: insert, update, or delete for the audited row.'
  rev_end:
    lineage:
    - datalake_sales_flow_raw.contact_aud.revend
    description: Envers revision end marker when this audited row version was superseded.
  unanswered_messages:
    lineage:
    - datalake_sales_flow_raw.contact_aud.unanswered_messages
    description: Audited count of messages in this contact thread awaiting a reply at this revision.
  last_message_sent:
    lineage:
    - datalake_sales_flow_raw.contact_aud.last_message_sent
    description: Audited content of the most recent message sent in this contact thread.
  mod_id_user:
    lineage:
    - datalake_sales_flow_raw.contact_aud.user_id_mod
    description: Envers boolean flag indicating whether id user changed in this audit revision.
  mod_id_prospect:
    lineage:
    - datalake_sales_flow_raw.contact_aud.prospect_id_mod
    description: Envers boolean flag indicating whether id prospect changed in this audit revision.
  mod_id_current_agent:
    lineage:
    - datalake_sales_flow_raw.contact_aud.current_agent_id_mod
    description: Envers boolean flag indicating whether id current agent changed in this audit revision.
  mod_unanswered_messages:
    lineage:
    - datalake_sales_flow_raw.contact_aud.unanswered_messages_mod
    description: Envers boolean flag indicating whether unanswered messages changed in this audit revision.
  mod_last_message_sent:
    lineage:
    - datalake_sales_flow_raw.contact_aud.last_message_sent_mod
    description: Envers boolean flag indicating whether last message sent changed in this audit revision.
  mod_ts_last_message_sent:
    lineage:
    - datalake_sales_flow_raw.contact_aud.last_message_sent_at_mod
    description: Envers boolean flag indicating whether ts last message sent changed in this audit revision.
  ts_last_message_sent:
    lineage:
    - datalake_sales_flow_raw.contact_aud.last_message_sent_at
    description: Audited timestamp of when the most recent message in this contact thread was sent.
  ts_created:
    lineage:
    - datalake_sales_flow_raw.contact_aud.created_at
    description: Timestamp when the row was first created in the source operational system.
  ts_updated:
    lineage:
    - datalake_sales_flow_raw.contact_aud.updated_at
    description: Timestamp when the row was last updated in the source operational system.
  year:
    lineage:
    - datalake_sales_flow_raw.contact_aud.year
    description: Year when the ETL run loaded this row into the lake table.
  month:
    lineage:
    - datalake_sales_flow_raw.contact_aud.month
    description: Month when the ETL run loaded this row into the lake table.
  day:
    lineage:
    - datalake_sales_flow_raw.contact_aud.day
    description: Day when the ETL run loaded this row into the lake table.
owner: helder.rodrigues@quintoandar.com.br
description: Hibernate Envers audit trail of contact rows from Sales Flow service managing For Sale operations after an offer is received. Each revision records field-level changes for compliance and operational forensics.
