database_name: datalake_sales_flow_clean
table_name: task_association
owner: helder.rodrigues@quintoandar.com.br
domain: For Sale
description: Table with the association between tasks and users
columns:
  id:
    description: Surrogate primary key of the task association row in the source system.
    lineage:
    - datalake_sales_flow_raw.task_association.id
  id_subtask:
    description: Foreign key to the subtask row executed under a parent sales flow task.
    lineage:
    - datalake_sales_flow_raw.task_association.subtask_id
  id_main_user:
    description: Foreign key referencing main user in the sales flow workflow domain.
    lineage:
    - datalake_sales_flow_raw.task_association.main_user_id
  id_sales_flow:
    description: Foreign key to the parent sales flow transaction in the end-of-funnel domain.
    lineage:
    - datalake_sales_flow_raw.task_association.sales_flow_id
  status:
    description: Current operational status code governing workflow progression for this record.
    lineage:
    - datalake_sales_flow_raw.task_association.status
  attributes:
    description: JSON or structured attributes carrying extra context for the workflow item.
    lineage:
    - datalake_sales_flow_raw.task_association.attributes
  ts_released:
    description: Timestamp of the release of the task
    lineage:
    - datalake_sales_flow_raw.task_association.released_at
  ts_concluded:
    description: Timestamp of the conclusion of the task
    lineage:
    - datalake_sales_flow_raw.task_association.concluded_at
  ts_created:
    description: Timestamp of the creation of the task
    lineage:
    - datalake_sales_flow_raw.task_association.created_at
  ts_updated:
    description: Timestamp of the last update of the task
    lineage:
    - datalake_sales_flow_raw.task_association.updated_at
  year:
    lineage:
    - datalake_sales_flow_raw.task_association.year
    description: Partition year when the ETL run loaded this row into the lake table.
  month:
    lineage:
    - datalake_sales_flow_raw.task_association.month
    description: Partition month when the ETL run loaded this row into the lake table.
  day:
    lineage:
    - datalake_sales_flow_raw.task_association.day
    description: Partition day when the ETL run loaded this row into the lake table.
