database_name: datalake_sales_flow_clean
table_name: ccv_termination
domain: For Sale
columns:
  id_ccv_termination:
    lineage:
    - datalake_sales_flow_raw.ccv_termination.id
    description: Unique identifier for the termination of a CCV rule.
  id_sales_flow:
    lineage:
    - datalake_sales_flow_raw.ccv_termination.sales_flow_id
    description: Identifier for the corresponding sales flow.
  condition:
    lineage:
    - datalake_sales_flow_raw.ccv_termination.condition
    description: Specific condition related to the sales flow.
  reason:
    lineage:
    - datalake_sales_flow_raw.ccv_termination.reason
    description: Explanation for the current state of the rule.
  document_token:
    lineage:
    - datalake_sales_flow_raw.ccv_termination.document_token
    description: Token associated with the relevant document.
  payer_type:
    lineage:
    - datalake_sales_flow_raw.ccv_termination.payer_type
    description: Type of payer involved in the transaction.
  payment_value:
    lineage:
    - datalake_sales_flow_raw.ccv_termination.payment_value
    description: Amount of the payment processed.
  approval_email:
    lineage:
    - datalake_sales_flow_raw.ccv_termination.approval_email
    description: Email address used for approval notifications.
  zendesk_link:
    lineage:
    - datalake_sales_flow_raw.ccv_termination.zendesk_link
    description: URL to the related Zendesk support ticket.
  ts_created:
    lineage:
    - datalake_sales_flow_raw.ccv_termination.created_at
    description: Timestamp of when the record was created.
  ts_updated:
    lineage:
    - datalake_sales_flow_raw.ccv_termination.updated_at
    description: Timestamp of the last update made to the record.
  year:
    description: Partition year when the ETL run loaded this row into the lake table.
  month:
    description: Partition month when the ETL run loaded this row into the lake table.
  day:
    description: Partition day when the ETL run loaded this row into the lake table.
owner: helder.rodrigues@quintoandar.com.br
description: Cleaned snapshot of ccv termination sourced from operational systems backing Sales Flow service managing For Sale operations after an offer is received. One row per ccv termination record with standardized names and types in datalake_sales_flow_clean.
