database_name: datalake_sales_flow_clean
table_name: ccv_termination
domain: For Sale
owner: helder.rodrigues@quintoandar.com.br
description: "Records the formal termination of a sales flow's CCV contract before or instead of completion. Each row captures the termination's commercial condition (e.g. with/without brokerage or burden), the business reason, which party is responsible for any associated payment and its amount, and links to the approval/support artifacts (approval email, Zendesk ticket, termination document). Rows are created by the CCV termination workflow when a deal is called off under one of three scenarios: without brokerage, with brokerage, or brokerage exemption. (JPA entity — CcvTermination, in the Sales Flow service)"
columns:
  id_ccv_termination:
    lineage:
    - datalake_sales_flow_raw.ccv_termination.id
    description: Primary key of the ccv_termination row (CcvTermination entity), one row per termination event recorded for a sales flow's CCV contract.
  id_sales_flow:
    lineage:
    - datalake_sales_flow_raw.ccv_termination.sales_flow_id
    description: Foreign key to the sales flow whose CCV contract was terminated.
  condition:
    lineage:
    - datalake_sales_flow_raw.ccv_termination.condition
    description: Commercial condition under which the CCV was terminated (enum CcvTerminationCondition), covering whether a burden/penalty applies and how brokerage fees are handled.
    categories:
      WITH_BURDEN: Termination applies a burden/penalty to the responsible party.
      WITHOUT_BURDEN: Termination applies without any burden/penalty.
      WITH_BROKERAGE: Termination occurs with the brokerage fee still due.
      WITHOUT_BROKERAGE: Termination occurs without any brokerage fee due.
      BROKERAGE_EXEMPTION: Termination grants an exemption from the brokerage fee that would otherwise apply.
  reason:
    lineage:
    - datalake_sales_flow_raw.ccv_termination.reason
    description: Business reason for terminating the CCV (enum CcvTerminationReason) — covers due-diligence risk outcomes, financing/credit issues, legal impediments, and party-driven causes such as buyer or seller giving up.
    categories:
      DD_HIGH_RISK_NOT_OVERCOME: Due diligence found high risk that was not overcome.
      DD_HIGH_RISK_WITH_OVERCOME: Due diligence found high risk that was subsequently overcome, but termination still occurred.
      DD_AVERAGE_RISK_NOT_OVERCOME: Due diligence found average risk that was not overcome.
      DD_AVERAGE_RISK_WITH_OVERCOME: Due diligence found average risk that was subsequently overcome, but termination still occurred.
      DD_AVERAGE_RISK_WITH_NOTE_OVERCOME: Due diligence found average risk overcome with a noted caveat/condition, but termination still occurred.
      CREDIT_DECLINED: Buyer's credit/financing application was declined.
      FINANCE_APPROVAL_RECUSED: Financing approval was refused/recused by the financial institution.
      EXCESSIVE_DEADLINE_WITHOUT_FAULT: Process exceeded the acceptable deadline without either party being at fault.
      EXCESSIVE_DEADLINE_FOR_FINANCING: Financing process exceeded the acceptable deadline.
      RIGHT_OF_PREFERENCE: Terminated due to a right-of-preference (preemptive right) claim on the property.
      FGTS_REFUSAL: FGTS (severance fund) usage for the purchase was refused.
      CASE_FORTUITOUS_OR_FORCE_MAJUR: Terminated due to a fortuitous event or force majeure.
      NON_COMPLIANCE_BUYER: Buyer failed to comply with contractual obligations.
      NON_COMPLIANCE_SELLER: Seller failed to comply with contractual obligations.
      BUYER_GIVEN_UP: Buyer gave up on the deal.
      SELLER_GIVEN_UP: Seller gave up on the deal.
      INTERNAL_ERROR: Terminated due to an internal QuintoAndar operational error.
      SPECIAL_CONDITION: Terminated due to a special/ad hoc condition not covered by other reasons.
      BUYER_CHANGE: Terminated because the buyer changed.
  document_token:
    lineage:
    - datalake_sales_flow_raw.ccv_termination.document_token
    description: Storage token referencing the document formalizing the CCV termination.
  payer_type:
    lineage:
    - datalake_sales_flow_raw.ccv_termination.payer_type
    description: 'Role of the party responsible for paying any termination-related amount (enum CcvTerminationPayerType): BUYER or SELLER. This identifies a role, not a specific user.'
  payment_value:
    lineage:
    - datalake_sales_flow_raw.ccv_termination.payment_value
    description: Monetary amount (decimal) to be paid as part of the CCV termination, e.g. a brokerage fee or penalty; not a boolean flag despite sitting alongside condition/reason enum fields.
  approval_email:
    lineage:
    - datalake_sales_flow_raw.ccv_termination.approval_email
    description: Email address used for approval notifications.
  zendesk_link:
    lineage:
    - datalake_sales_flow_raw.ccv_termination.zendesk_link
    description: URL to the related Zendesk support ticket.
  ts_created:
    lineage:
    - datalake_sales_flow_raw.ccv_termination.created_at
    description: Timestamp of when the record was created.
  ts_updated:
    lineage:
    - datalake_sales_flow_raw.ccv_termination.updated_at
    description: Timestamp of the last update made to the record.
  year:
    description: Year when the ETL run loaded this row into the lake table.
  month:
    description: Month when the ETL run loaded this row into the lake table.
  day:
    description: Day when the ETL run loaded this row into the lake table.
