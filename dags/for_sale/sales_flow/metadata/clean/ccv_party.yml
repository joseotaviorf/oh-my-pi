database_name: datalake_sales_flow_clean
table_name: ccv_party
owner: helder.rodrigues@quintoandar.com.br
domain: For Sale
description: Contains one row per individual or entity acting as a buyer or seller on a given CCV (Contrato de Compra e Venda). It stores each party's declared identity, contact, and demographic data (name, email, document number, nationality, profession, marital status) together with a flag for whether that party has signed the contract. Rows are created when a CCV is drafted, listing the parties who must review, negotiate, and ultimately sign the purchase and sale agreement. (JPA entity — CcvPartyEntity, in the Sales Flow service)
columns:
  id:
    description: Surrogate primary key of the ccv_party row (CcvPartyEntity), one row per party listed on a CCV contract.
    lineage:
    - datalake_sales_flow_raw.ccv_party.id
  id_ccv:
    description: Foreign key to the CCV contract (ccv table) that this party belongs to.
    lineage:
    - datalake_sales_flow_raw.ccv_party.ccv_id
  id_address_data:
    description: Foreign key to the address record associated with this party.
    lineage:
    - datalake_sales_flow_raw.ccv_party.address_data_id
  type:
    description: 'Role of this party in the CCV (enum CcvPartyType): BUYER or SELLER.'
    lineage:
    - datalake_sales_flow_raw.ccv_party.type
  name:
    description: Human-readable display name associated with the person or entity in this row.
    lineage:
    - datalake_sales_flow_raw.ccv_party.name
  email:
    description: Email address of the party.
    lineage:
    - datalake_sales_flow_raw.ccv_party.email
  document:
    description: Official document number of the party (e.g., CPF, CNPJ).
    lineage:
    - datalake_sales_flow_raw.ccv_party.document
  nationality:
    description: Declared nationality of the party in the CCV contract.
    lineage:
    - datalake_sales_flow_raw.ccv_party.nationality
  profession:
    description: Declared profession of the party in the CCV contract.
    lineage:
    - datalake_sales_flow_raw.ccv_party.profession
  marital_status:
    description: Marital status of the party (e.g., Single, Married).
    lineage:
    - datalake_sales_flow_raw.ccv_party.marital_status
  is_signed:
    description: Flag indicating whether this party has signed the CCV contract.
    lineage:
    - datalake_sales_flow_raw.ccv_party.signed
  ts_created:
    description: Timestamp indicating when the party record was created.
    lineage:
    - datalake_sales_flow_raw.ccv_party.created_at
  ts_updated:
    description: Timestamp indicating the last time the party record was updated.
    lineage:
    - datalake_sales_flow_raw.ccv_party.updated_at
  year:
    description: 'ing column: Year of the record''s creation/update.'
    lineage:
    - datalake_sales_flow_raw.ccv_party.year
  month:
    description: 'ing column: Month of the record''s creation/update.'
    lineage:
    - datalake_sales_flow_raw.ccv_party.month
  day:
    description: 'ing column: Day of the record''s creation/update.'
    lineage:
    - datalake_sales_flow_raw.ccv_party.day
