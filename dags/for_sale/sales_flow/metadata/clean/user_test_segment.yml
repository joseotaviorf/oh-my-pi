---
database_name: datalake_sales_flow_clean
table_name: user_test_segment
owner: thiago.bueno@quintoandar.com.br
domain: For Sale
description: "The primary purpose of the user_test_segment table is to 
  store the test segments assigned to users/persons in the sales flow context, 
  enabling A/B testing and feature rollout control for different user groups 
  in the sales process."
columns:
  id:
    description: 'Id of the user test segment.'
    lineage:
    - datalake_sales_flow_raw.user_test_segment.id
  uuid_person:
    description: 'UUID of the person associated with the test segment.'
    lineage:
    - datalake_sales_flow_raw.user_test_segment.person_uuid
  id_sales_flow:
    description: 'Id of the sales flow.'
    lineage:
    - datalake_sales_flow_raw.user_test_segment.sales_flow_id
  test_segments:
    description: 'Array of test segments assigned to the user for A/B testing and feature rollout.'
    lineage:
    - datalake_sales_flow_raw.user_test_segment.test_segments
  is_deleted:
    description: 'Flag indicating if the record has been soft deleted.'
    lineage:
    - datalake_sales_flow_raw.user_test_segment.is_deleted
  ts_created:
    description: 'Timestamp of the creation of the record.'
    lineage:
    - datalake_sales_flow_raw.user_test_segment.created_at
  ts_updated:
    description: 'Timestamp of the last update of the record.'
    lineage:
    - datalake_sales_flow_raw.user_test_segment.updated_at
  year:
    description: 'Year of the record.'
    lineage:
    - datalake_sales_flow_raw.user_test_segment.year
  month:
    description: 'Month of the record.'
    lineage:
    - datalake_sales_flow_raw.user_test_segment.month
  day:
    description: 'Day of the record.'
    lineage:
    - datalake_sales_flow_raw.user_test_segment.day
