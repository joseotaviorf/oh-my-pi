---
database_name: datalake_sales_flow_clean
table_name: clause_subject_aud
domain: For Sale
owner: igor.firmo@quintoandar.com.br
description: Audit table for clause_subject containing historical changes and modifications.
columns:
  id:
    description: Unique ID for the clause subject record.
    lineage:
      - datalake_sales_flow_raw.clause_subject_aud.id
  rev:
    description: Unique id for this modification and can be joined with table rev_info to get more details.
    lineage:
      - datalake_sales_flow_raw.clause_subject_aud.rev
  rev_type:
    description: Modification type.
    categories:
      "0" : Create
      "1" : Update
      "2" : Delete
    lineage:
      - datalake_sales_flow_raw.clause_subject_aud.revtype
  rev_end:
    description: ID of the revision that replaced the current entry.
    lineage:
      - datalake_sales_flow_raw.clause_subject_aud.revend
  description:
    description: Description of the clause subject.
    lineage:
      - datalake_sales_flow_raw.clause_subject_aud.description
  mod_description:
    description: Flag indicating if the column description has changed.
    lineage:
      - datalake_sales_flow_raw.clause_subject_aud.description_mod
  ts_created:
    description: Timestamp when the clause subject was created.
    lineage:
      - datalake_sales_flow_raw.clause_subject_aud.created_at
  ts_updated:
    description: Timestamp of the last update to the clause subject.
    lineage:
      - datalake_sales_flow_raw.clause_subject_aud.updated_at
  year:
    description: Year partition for the clause subject record.
    lineage:
      - datalake_sales_flow_raw.clause_subject_aud.year
  month:
    description: Month partition for the clause subject record.
    lineage:
      - datalake_sales_flow_raw.clause_subject_aud.month
  day:
    description: Day partition for the clause subject record.
    lineage:
      - datalake_sales_flow_raw.clause_subject_aud.day
