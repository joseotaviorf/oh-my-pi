database_name: datalake_sales_flow_clean
table_name: status_aud
domain: For Sale
owner: helder.rodrigues@quintoandar.com.br
description: Hibernate Envers audit trail of status rows from Sales Flow service managing For Sale operations after an offer is received. Each revision records field-level changes for compliance and operational forensics.
columns:
  id:
    description: ID status of Closing process.
    lineage:
    - datalake_sales_flow_raw.status_aud.id
  id_label:
    description: Identification of each of the keys in the table.
    lineage:
    - datalake_sales_flow_raw.status_aud.label_id
  id_parent:
    description: ID about process hierarchy and Closing models. If the identification is null, the status corresponds to a microstatus. Otherwise, it corresponds to a microstatus.
    lineage:
    - datalake_sales_flow_raw.status_aud.parent_id
  rev:
    lineage:
    - datalake_sales_flow_raw.status_aud.rev
    description: Envers revision number grouping field-level changes in this audit snapshot.
  rev_type:
    lineage:
    - datalake_sales_flow_raw.status_aud.revtype
    description: 'Envers revision type code: insert, update, or delete for the audited row.'
  rev_end:
    lineage:
    - datalake_sales_flow_raw.status_aud.revend
    description: Envers revision end marker when this audited row version was superseded.
  key:
    description: Names of micro and macro status of Closing process (e.g. CCV_SENT_TO_SIGNED, DILIGENCE_PROCESSING, FINANCING_SIGNED)
    lineage:
    - datalake_sales_flow_raw.status_aud.key
  mod_id_label:
    description: Flag indicating if the id_label phone has changed.
    lineage:
    - datalake_sales_flow_raw.status_aud.label_id_mod
  mod_id_parent:
    description: Flag indicating if the id_parent phone has changed.
    lineage:
    - datalake_sales_flow_raw.status_aud.parent_id_mod
  mod_key:
    description: Flag indicating if the key phone has changed.
    lineage:
    - datalake_sales_flow_raw.status_aud.key_mod
  ts_created:
    description: Timestamp that indicates when this entry was created.
    lineage:
    - datalake_sales_flow_raw.status_aud.created_at
  ts_updated:
    description: Timestamp that indicates when this entry was last updated.
    lineage:
    - datalake_sales_flow_raw.status_aud.updated_at
  year:
    description: Year when the ETL run loaded this row into the lake table.
    lineage:
    - datalake_sales_flow_raw.status_aud.year
  month:
    description: Month when the ETL run loaded this row into the lake table.
    lineage:
    - datalake_sales_flow_raw.status_aud.month
  day:
    description: Day when the ETL run loaded this row into the lake table.
    lineage:
    - datalake_sales_flow_raw.status_aud.day
