database_name: datalake_sales_flow_clean
table_name: reject_reason
domain: For Sale
owner: thiago.bueno@quintoandar.com.br
description: Table that contains structured rejection reasons used across the sales flow.
columns:
  id:
    description: Unique ID for the reject reason.
    lineage:
      - datalake_sales_flow_raw.reject_reason.id
  source:
    description: The source or system where the rejection reason originated.
    lineage:
      - datalake_sales_flow_raw.reject_reason.source
  category:
    description: The category of the rejection reason.
    lineage:
      - datalake_sales_flow_raw.reject_reason.category
  reason:
    description: The main reason for the rejection.
    lineage:
      - datalake_sales_flow_raw.reject_reason.reason
  sub_reason:
    description: A more specific sub-reason for the rejection.
    lineage:
      - datalake_sales_flow_raw.reject_reason.sub_reason
  is_active:
    description: Flag indicating if the reason is currently active and can be used.
    lineage:
      - datalake_sales_flow_raw.reject_reason.active
  ts_created:
    description: Timestamp of when the reject reason was created.
    lineage:
      - datalake_sales_flow_raw.reject_reason.created_at
  ts_updated:
    description: Timestamp of the last update to the reject reason.
    lineage:
      - datalake_sales_flow_raw.reject_reason.updated_at
  year:
    description: Year partition value.
    lineage:
      - datalake_sales_flow_raw.reject_reason.year
  month:
    description: Month partition value.
    lineage:
      - datalake_sales_flow_raw.reject_reason.month
  day:
    description: Day partition value.
    lineage:
      - datalake_sales_flow_raw.reject_reason.day
