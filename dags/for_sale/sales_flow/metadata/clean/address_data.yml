database_name: datalake_sales_flow_clean
table_name: address_data
domain: For Sale
columns:
  id:
    lineage:
    - datalake_sales_flow_raw.address_data.id
    description: Surrogate primary key of the address data row in the source system.
  street:
    lineage:
    - datalake_sales_flow_raw.address_data.street
    description: Street name of the property address.
  number:
    lineage:
    - datalake_sales_flow_raw.address_data.number
    description: Street number of the property address.
  complement:
    lineage:
    - datalake_sales_flow_raw.address_data.complement
    description: Address complement such as apartment or unit number.
  neighborhood:
    lineage:
    - datalake_sales_flow_raw.address_data.neighborhood
    description: Neighborhood of the property address.
  city:
    lineage:
    - datalake_sales_flow_raw.address_data.city
    description: City of the property address.
  state:
    lineage:
    - datalake_sales_flow_raw.address_data.state
    description: State (federative unit) of the property address.
  zip_code:
    lineage:
    - datalake_sales_flow_raw.address_data.zip_code
    description: Postal ZIP code (CEP) of the property address.
  ts_created:
    lineage:
    - datalake_sales_flow_raw.address_data.created_at
    description: Timestamp when the row was first created in the source operational system.
  ts_updated:
    lineage:
    - datalake_sales_flow_raw.address_data.updated_at
    description: Timestamp when the row was last updated in the source operational system.
  year:
    lineage:
    - datalake_sales_flow_raw.address_data.year
    description: Partition year when the ETL run loaded this row into the lake table.
  month:
    lineage:
    - datalake_sales_flow_raw.address_data.month
    description: Partition month when the ETL run loaded this row into the lake table.
  day:
    lineage:
    - datalake_sales_flow_raw.address_data.day
    description: Partition day when the ETL run loaded this row into the lake table.
owner: helder.rodrigues@quintoandar.com.br
description: Cleaned snapshot of address data sourced from operational systems backing Sales Flow service managing For Sale operations after an offer is received. One row per address data record with standardized names and types in datalake_sales_flow_clean.
