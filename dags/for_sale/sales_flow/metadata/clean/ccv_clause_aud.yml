---
database_name: datalake_sales_flow_clean
table_name: ccv_clause_aud
domain: For Sale
owner: igor.firmo@quintoandar.com.br
description: Audit table for ccv_clause containing historical changes and modifications.
columns:
  id:
    description: Unique ID for the CCV clause record.
    lineage:
      - datalake_sales_flow_raw.ccv_clause_aud.id
  rev:
    description: Unique id for this modification and can be joined with table rev_info to get more details.
    lineage:
      - datalake_sales_flow_raw.ccv_clause_aud.rev
  rev_type:
    description: Modification type.
    categories:
      "0" : Create
      "1" : Update
      "2" : Delete
    lineage:
      - datalake_sales_flow_raw.ccv_clause_aud.revtype
  rev_end:
    description: ID of the revision that replaced the current entry.
    lineage:
      - datalake_sales_flow_raw.ccv_clause_aud.revend
  id_sales_flow:
    description: Foreign key to the sales_flow table.
    lineage:
      - datalake_sales_flow_raw.ccv_clause_aud.sales_flow_id
  mod_id_sales_flow:
    description: Flag indicating if the column id_sales_flow has changed.
    lineage:
      - datalake_sales_flow_raw.ccv_clause_aud.sales_flow_id_mod
  id_clause_message:
    description: Foreign key to the clause_message table.
    lineage:
      - datalake_sales_flow_raw.ccv_clause_aud.clause_message_id
  mod_id_clause_message:
    description: Flag indicating if the column id_clause_message has changed.
    lineage:
      - datalake_sales_flow_raw.ccv_clause_aud.clause_message_id_mod
  variables:
    description: JSONB field containing clause variables.
    lineage:
      - datalake_sales_flow_raw.ccv_clause_aud.variables
  mod_variables:
    description: Flag indicating if the column variables has changed.
    lineage:
      - datalake_sales_flow_raw.ccv_clause_aud.variables_mod
  ts_created:
    description: Timestamp when the CCV clause was created.
    lineage:
      - datalake_sales_flow_raw.ccv_clause_aud.created_at
  ts_updated:
    description: Timestamp of the last update to the CCV clause.
    lineage:
      - datalake_sales_flow_raw.ccv_clause_aud.updated_at
  year:
    description: Year partition for the CCV clause record.
    lineage:
      - datalake_sales_flow_raw.ccv_clause_aud.year
  month:
    description: Month partition for the CCV clause record.
    lineage:
      - datalake_sales_flow_raw.ccv_clause_aud.month
  day:
    description: Day partition for the CCV clause record.
    lineage:
      - datalake_sales_flow_raw.ccv_clause_aud.day
