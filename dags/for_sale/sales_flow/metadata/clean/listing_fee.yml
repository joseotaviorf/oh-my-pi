columns:
  id:
    description: Unique ID for the listing fee record.
    lineage:
      - datalake_sales_flow_raw.listing_fee.id

  id_region:
    description: Region ID for the listing fee.
    lineage:
      - datalake_sales_flow_raw.listing_fee.region_id

  ticket_model:
    description: Ticket model for the listing fee.
    lineage:
      - datalake_sales_flow_raw.listing_fee.ticket_model

  ts_valid_from:
    description: Timestamp from which the listing fee is valid.
    lineage:
      - datalake_sales_flow_raw.listing_fee.valid_from

  ts_valid_to:
    description: Timestamp until which the listing fee is valid.
    lineage:
      - datalake_sales_flow_raw.listing_fee.valid_to

  fee:
    description: Fee value for the listing.
    lineage:
      - datalake_sales_flow_raw.listing_fee.fee

  is_active:
