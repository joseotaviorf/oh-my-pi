database_name: datalake_sales_flow_clean
table_name: tag
domain: For Sale
columns:
  id:
    lineage:
    - datalake_sales_flow_raw.tag.id
    description: Surrogate primary key of the tag row in the source system.
  label:
    lineage:
    - datalake_sales_flow_raw.tag.label
    description: Short UI or workflow label describing the task, tag, or category shown to operators.
  ts_created:
    lineage:
    - datalake_sales_flow_raw.tag.created_at
    description: Timestamp when the row was first created in the source operational system.
  ts_updated:
    lineage:
    - datalake_sales_flow_raw.tag.updated_at
    description: Timestamp when the row was last updated in the source operational system.
  year:
    lineage:
    - datalake_sales_flow_raw.tag.year
    description: Partition year when the ETL run loaded this row into the lake table.
  month:
    lineage:
    - datalake_sales_flow_raw.tag.month
    description: Partition month when the ETL run loaded this row into the lake table.
  day:
    lineage:
    - datalake_sales_flow_raw.tag.day
    description: Partition day when the ETL run loaded this row into the lake table.
owner: helder.rodrigues@quintoandar.com.br
description: Cleaned snapshot of tag sourced from operational systems backing Sales Flow service managing For Sale operations after an offer is received. One row per tag record with standardized names and types in datalake_sales_flow_clean.
