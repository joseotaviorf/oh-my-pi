database_name: datalake_sales_flow_clean
table_name: monthly_discount_quota_aud
domain: For Sale
owner: helder.rodrigues@quintoandar.com.br
description: Audit table for monthly_discount_quota containing historical changes and modifications.
columns:
  id:
    description: Unique ID for the monthly discount quota record.
    lineage:
    - datalake_sales_flow_raw.monthly_discount_quota_aud.id
  rev:
    description: Unique id for this modification and can be joined with table rev_info to get more details.
    lineage:
    - datalake_sales_flow_raw.monthly_discount_quota_aud.rev
  rev_type:
    description: 'Envers revision type code: insert, update, or delete for the audited row.'
    categories:
      '0': Create
      '1': Update
      '2': Delete
    lineage:
    - datalake_sales_flow_raw.monthly_discount_quota_aud.revtype
  rev_end:
    description: ID of the revision that replaced the current entry.
    lineage:
    - datalake_sales_flow_raw.monthly_discount_quota_aud.revend
  year_month:
    description: Year and month in yyyyMM format.
    lineage:
    - datalake_sales_flow_raw.monthly_discount_quota_aud.year_month
  max_allowed:
    description: Maximum number of discounts allowed for the month.
    lineage:
    - datalake_sales_flow_raw.monthly_discount_quota_aud.max_allowed
  current_given:
    description: Current number of discounts given in the month.
    lineage:
    - datalake_sales_flow_raw.monthly_discount_quota_aud.current_given
  version:
    description: Optimistic locking version number.
    lineage:
    - datalake_sales_flow_raw.monthly_discount_quota_aud.version
  ts_created:
    description: Timestamp when the monthly discount quota was created.
    lineage:
    - datalake_sales_flow_raw.monthly_discount_quota_aud.created_at
  ts_updated:
    description: Timestamp of the last update to the monthly discount quota.
    lineage:
    - datalake_sales_flow_raw.monthly_discount_quota_aud.updated_at
  year:
    description: Year  for the monthly discount quota record.
    lineage:
    - datalake_sales_flow_raw.monthly_discount_quota_aud.year
  month:
    description: Month  for the monthly discount quota record.
    lineage:
    - datalake_sales_flow_raw.monthly_discount_quota_aud.month
  day:
    description: Day  for the monthly discount quota record.
    lineage:
    - datalake_sales_flow_raw.monthly_discount_quota_aud.day
