database_name: datalake_sales_flow_clean
table_name: screening_house
owner: helder.rodrigues@quintoandar.com.br
domain: For Sale
description: The primary purpose of the screening_house table is to store the status of the screening/validation form for house, indicating whether the form is complete or pending, as well as capturing any outstanding data issues or missing information.
columns:
  id:
    description: Surrogate primary key of the screening house row in the source system.
    lineage:
    - datalake_sales_flow_raw.screening_house.id
  id_screening:
    description: Foreign key to the screening case evaluating proposal readiness.
    lineage:
    - datalake_sales_flow_raw.screening_house.screening_id
  status:
    description: Current operational status code governing workflow progression for this record.
    lineage:
    - datalake_sales_flow_raw.screening_house.status
  proposal_validation_status:
    description: Validation outcome from legal or credit review of the proposal.
    lineage:
    - datalake_sales_flow_raw.screening_house.proposal_validation_status
  legal_pendency_note:
    description: Legal team note describing open pendencies blocking proposal approval.
    lineage:
    - datalake_sales_flow_raw.screening_house.legal_pendency_note
  ts_created:
    description: Timestamp of the creation of the record.
    lineage:
    - datalake_sales_flow_raw.screening_house.created_at
  ts_updated:
    description: Timestamp of the last update of the record.
    lineage:
    - datalake_sales_flow_raw.screening_house.updated_at
  year:
    description: Partition year when the ETL run loaded this row into the lake table.
    lineage:
    - datalake_sales_flow_raw.screening_house.year
  month:
    description: Partition month when the ETL run loaded this row into the lake table.
    lineage:
    - datalake_sales_flow_raw.screening_house.month
  day:
    description: Partition day when the ETL run loaded this row into the lake table.
    lineage:
    - datalake_sales_flow_raw.screening_house.day
