---
database_name: datalake_sales_flow_clean
table_name: ccv_termination_aud
domain: For Sale
owner: igor.firmo@quintoandar.com.br
description: Audit table for ccv_termination containing historical changes and modifications.
columns:
  id:
    description: Unique ID for the CCV termination record.
    lineage:
      - datalake_sales_flow_raw.ccv_termination_aud.id
  rev:
    description: Unique id for this modification and can be joined with table rev_info to get more details.
    lineage:
      - datalake_sales_flow_raw.ccv_termination_aud.rev
  rev_type:
    description: Modification type.
    categories:
      "0" : Create
      "1" : Update
      "2" : Delete
    lineage:
      - datalake_sales_flow_raw.ccv_termination_aud.revtype
  rev_end:
    description: ID of the revision that replaced the current entry.
    lineage:
      - datalake_sales_flow_raw.ccv_termination_aud.revend
  id_sales_flow:
    description: Foreign key to the sales_flow table.
    lineage:
      - datalake_sales_flow_raw.ccv_termination_aud.sales_flow_id
  mod_id_sales_flow:
    description: Flag indicating if the column id_sales_flow has changed.
    lineage:
      - datalake_sales_flow_raw.ccv_termination_aud.sales_flow_id_mod
  condition:
    description: Termination condition.
    lineage:
      - datalake_sales_flow_raw.ccv_termination_aud.condition
  mod_condition:
    description: Flag indicating if the column condition has changed.
    lineage:
      - datalake_sales_flow_raw.ccv_termination_aud.condition_mod
  reason:
    description: Reason for the CCV termination.
    lineage:
      - datalake_sales_flow_raw.ccv_termination_aud.reason
  mod_reason:
    description: Flag indicating if the column reason has changed.
    lineage:
      - datalake_sales_flow_raw.ccv_termination_aud.reason_mod
  document_token:
    description: Token for the termination document.
    lineage:
      - datalake_sales_flow_raw.ccv_termination_aud.document_token
  mod_document_token:
    description: Flag indicating if the column document_token has changed.
    lineage:
      - datalake_sales_flow_raw.ccv_termination_aud.document_token_mod
  payer_type:
    description: Type of payer for the termination.
    lineage:
      - datalake_sales_flow_raw.ccv_termination_aud.payer_type
  mod_payer_type:
    description: Flag indicating if the column payer_type has changed.
    lineage:
      - datalake_sales_flow_raw.ccv_termination_aud.payer_type_mod
  payment_value:
    description: Value of the termination payment.
    lineage:
      - datalake_sales_flow_raw.ccv_termination_aud.payment_value
  mod_payment_value:
    description: Flag indicating if the column payment_value has changed.
    lineage:
      - datalake_sales_flow_raw.ccv_termination_aud.payment_value_mod
  approval_email:
    description: Email address for approval notification.
    lineage:
      - datalake_sales_flow_raw.ccv_termination_aud.approval_email
  mod_approval_email:
    description: Flag indicating if the column approval_email has changed.
    lineage:
      - datalake_sales_flow_raw.ccv_termination_aud.approval_email_mod
  zendesk_link:
    description: Link to the Zendesk ticket.
    lineage:
      - datalake_sales_flow_raw.ccv_termination_aud.zendesk_link
  mod_zendesk_link:
    description: Flag indicating if the column zendesk_link has changed.
    lineage:
      - datalake_sales_flow_raw.ccv_termination_aud.zendesk_link_mod
  year:
    description: Year partition for the CCV termination record.
    lineage:
      - datalake_sales_flow_raw.ccv_termination_aud.year
  month:
    description: Month partition for the CCV termination record.
    lineage:
      - datalake_sales_flow_raw.ccv_termination_aud.month
  day:
    description: Day partition for the CCV termination record.
    lineage:
      - datalake_sales_flow_raw.ccv_termination_aud.day
