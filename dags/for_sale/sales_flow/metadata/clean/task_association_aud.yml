---
database_name: datalake_sales_flow_clean
table_name: task_association_aud
domain: For Sale
owner: igor.firmo@quintoandar.com.br
description: Audit table for task_association containing historical changes and modifications.
columns:
  id:
    description: Unique ID for the task association record.
    lineage:
      - datalake_sales_flow_raw.task_association_aud.id
  rev:
    description: Unique id for this modification and can be joined with table rev_info to get more details.
    lineage:
      - datalake_sales_flow_raw.task_association_aud.rev
  rev_type:
    description: Modification type.
    categories:
      "0" : Create
      "1" : Update
      "2" : Delete
    lineage:
      - datalake_sales_flow_raw.task_association_aud.revtype
  rev_end:
    description: ID of the revision that replaced the current entry.
    lineage:
      - datalake_sales_flow_raw.task_association_aud.revend
  id_subtask:
    description: Foreign key to the subtask table.
    lineage:
      - datalake_sales_flow_raw.task_association_aud.subtask_id
  mod_id_subtask:
    description: Flag indicating if the column id_subtask has changed.
    lineage:
      - datalake_sales_flow_raw.task_association_aud.subtask_id_mod
  id_main_user:
    description: ID of the main user responsible for the task.
    lineage:
      - datalake_sales_flow_raw.task_association_aud.main_user_id
  mod_id_main_user:
    description: Flag indicating if the column id_main_user has changed.
    lineage:
      - datalake_sales_flow_raw.task_association_aud.main_user_id_mod
  id_sales_flow:
    description: Foreign key to the sales_flow table.
    lineage:
      - datalake_sales_flow_raw.task_association_aud.sales_flow_id
  mod_id_sales_flow:
    description: Flag indicating if the column id_sales_flow has changed.
    lineage:
      - datalake_sales_flow_raw.task_association_aud.sales_flow_id_mod
  status:
    description: Status of the task association.
    lineage:
      - datalake_sales_flow_raw.task_association_aud.status
  mod_status:
    description: Flag indicating if the column status has changed.
    lineage:
      - datalake_sales_flow_raw.task_association_aud.status_mod
  ts_released:
    description: Timestamp when the task was released.
    lineage:
      - datalake_sales_flow_raw.task_association_aud.released_at
  mod_ts_released:
    description: Flag indicating if the column ts_released has changed.
    lineage:
      - datalake_sales_flow_raw.task_association_aud.released_at_mod
  ts_concluded:
    description: Timestamp when the task was concluded.
    lineage:
      - datalake_sales_flow_raw.task_association_aud.concluded_at
  mod_ts_concluded:
    description: Flag indicating if the column ts_concluded has changed.
    lineage:
      - datalake_sales_flow_raw.task_association_aud.concluded_at_mod
  attributes:
    description: JSONB field containing additional task attributes.
    lineage:
      - datalake_sales_flow_raw.task_association_aud.attributes
  mod_attributes:
    description: Flag indicating if the column attributes has changed.
    lineage:
      - datalake_sales_flow_raw.task_association_aud.attributes_mod
  ts_created:
    description: Timestamp when the task association was created.
    lineage:
      - datalake_sales_flow_raw.task_association_aud.created_at
  ts_updated:
    description: Timestamp of the last update to the task association.
    lineage:
      - datalake_sales_flow_raw.task_association_aud.updated_at
  year:
    description: Year partition for the task association record.
    lineage:
      - datalake_sales_flow_raw.task_association_aud.year
  month:
    description: Month partition for the task association record.
    lineage:
      - datalake_sales_flow_raw.task_association_aud.month
  day:
    description: Day partition for the task association record.
    lineage:
      - datalake_sales_flow_raw.task_association_aud.day
