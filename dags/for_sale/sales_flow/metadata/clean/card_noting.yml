database_name: datalake_sales_flow_clean
table_name: card_noting
domain: For Sale
columns:
  id_card_noting:
    lineage:
    - datalake_sales_flow_raw.card_noting.id
    description: Unique identifier of the card noting record.
  buyer_and_seller:
    lineage:
    - datalake_sales_flow_raw.card_noting.buyer_and_seller
    description: Notes recorded about the buyer and seller on the deal card.
  commitment_closing_transfer:
    lineage:
    - datalake_sales_flow_raw.card_noting.commitment_closing_transfer
    description: Notes about the commitment, closing, and transfer steps on the deal card.
  negotiation_note:
    lineage:
    - datalake_sales_flow_raw.card_noting.negotiation_note
    description: Free-text negotiation note recorded on the deal card.
  ts_created:
    lineage:
    - datalake_sales_flow_raw.card_noting.created_at
    description: Timestamp when the row was first created in the source operational system.
  ts_updated:
    lineage:
    - datalake_sales_flow_raw.card_noting.updated_at
    description: Timestamp when the row was last updated in the source operational system.
  year:
    lineage:
    - datalake_sales_flow_raw.card_noting.year
    description: Partition year when the ETL run loaded this row into the lake table.
  month:
    lineage:
    - datalake_sales_flow_raw.card_noting.month
    description: Partition month when the ETL run loaded this row into the lake table.
  day:
    lineage:
    - datalake_sales_flow_raw.card_noting.day
    description: Partition day when the ETL run loaded this row into the lake table.
owner: helder.rodrigues@quintoandar.com.br
description: Cleaned snapshot of card noting sourced from operational systems backing Sales Flow service managing For Sale operations after an offer is received. One row per card noting record with standardized names and types in datalake_sales_flow_clean.
