database_name: datalake_sales_flow_clean
table_name: ccv_rule_aud
domain: For Sale
columns:
  id_ccv_rule_aud:
    lineage:
    - datalake_sales_flow_raw.ccv_rule_aud.id
    description: Audited identifier of the CCV rule record, matching ccv_rule.id_ccv_rule in datalake_sales_flow_clean.
  ccv_version:
    lineage:
    - datalake_sales_flow_raw.ccv_rule_aud.ccv_version
    description: Audited version of the CCV contract template this rule applies to.
  type:
    lineage:
    - datalake_sales_flow_raw.ccv_rule_aud.type
    description: Classifier distinguishing record subtype or participant role in the workflow.
  rev:
    lineage:
    - datalake_sales_flow_raw.ccv_rule_aud.rev
    description: Envers revision number grouping field-level changes in this audit snapshot.
  rev_type:
    lineage:
    - datalake_sales_flow_raw.ccv_rule_aud.revtype
    description: 'Envers revision type code: insert, update, or delete for the audited row.'
  rev_end:
    lineage:
    - datalake_sales_flow_raw.ccv_rule_aud.revend
    description: Envers revision end marker when this audited row version was superseded.
  ccv_rule_name:
    lineage:
    - datalake_sales_flow_raw.ccv_rule_aud.name
    description: Audited human-readable name of the CCV contract rule.
  storage_hash_token:
    lineage:
    - datalake_sales_flow_raw.ccv_rule_aud.storage_hash_token
    description: Audited storage token referencing the stored file backing this CCV rule.
  checksum:
    lineage:
    - datalake_sales_flow_raw.ccv_rule_aud.checksum
    description: Audited checksum used to verify the integrity of the stored CCV rule content.
  mod_ccv_version:
    lineage:
    - datalake_sales_flow_raw.ccv_rule_aud.ccv_version_mod
    description: Envers boolean flag indicating whether ccv version changed in this audit revision.
  mod_type:
    lineage:
    - datalake_sales_flow_raw.ccv_rule_aud.type_mod
    description: Envers boolean flag indicating whether type changed in this audit revision.
  mod_ccv_rule_name:
    lineage:
    - datalake_sales_flow_raw.ccv_rule_aud.name_mod
    description: Envers boolean flag indicating whether ccv rule name changed in this audit revision.
  mod_storage_hash_token:
    lineage:
    - datalake_sales_flow_raw.ccv_rule_aud.storage_hash_token_mod
    description: Envers boolean flag indicating whether storage hash token changed in this audit revision.
  mod_checksum:
    lineage:
    - datalake_sales_flow_raw.ccv_rule_aud.checksum_mod
    description: Envers boolean flag indicating whether checksum changed in this audit revision.
  ts_created:
    lineage:
    - datalake_sales_flow_raw.ccv_rule_aud.created_at
    description: Timestamp when the row was first created in the source operational system.
  ts_updated:
    lineage:
    - datalake_sales_flow_raw.ccv_rule_aud.updated_at
    description: Timestamp when the row was last updated in the source operational system.
  year:
    lineage:
    - datalake_sales_flow_raw.ccv_rule_aud.year
    description: Year when the ETL run loaded this row into the lake table.
  month:
    lineage:
    - datalake_sales_flow_raw.ccv_rule_aud.month
    description: Month when the ETL run loaded this row into the lake table.
  day:
    lineage:
    - datalake_sales_flow_raw.ccv_rule_aud.day
    description: Day when the ETL run loaded this row into the lake table.
owner: helder.rodrigues@quintoandar.com.br
description: Hibernate Envers audit trail of ccv rule rows from Sales Flow service managing For Sale operations after an offer is received. Each revision records field-level changes for compliance and operational forensics.
