---
database_name: datalake_sales_flow_clean
table_name: credit_proposal
domain: For Sale
owner: igor.firmo@quintoandar.com.br
description: Contains credit proposal information for sales flows.
columns:
  id:
    description: Unique ID for the credit proposal record.
    lineage:
      - datalake_sales_flow_raw.credit_proposal.id
  id_sales_flow:
    description: Foreign key to the sales_flow table.
    lineage:
      - datalake_sales_flow_raw.credit_proposal.sales_flow_id
  id_external_proposal:
    description: External system ID for the credit proposal.
    lineage:
      - datalake_sales_flow_raw.credit_proposal.external_proposal_id
  bank:
    description: Bank providing the credit proposal.
    lineage:
      - datalake_sales_flow_raw.credit_proposal.bank
  macro_status:
    description: High-level status of the credit proposal.
    lineage:
      - datalake_sales_flow_raw.credit_proposal.macro_status
  micro_status:
    description: Detailed status of the credit proposal.
    lineage:
      - datalake_sales_flow_raw.credit_proposal.micro_status
  is_chosen:
    description: Flag indicating if this proposal was chosen by the buyer.
    lineage:
      - datalake_sales_flow_raw.credit_proposal.is_chosen
  ts_last_macro_status_updated:
    description: Timestamp of the last macro status update.
    lineage:
      - datalake_sales_flow_raw.credit_proposal.last_macro_status_updated_at
  ts_created:
    description: Timestamp when the credit proposal was created.
    lineage:
      - datalake_sales_flow_raw.credit_proposal.created_at
  ts_updated:
    description: Timestamp of the last update to the credit proposal.
    lineage:
      - datalake_sales_flow_raw.credit_proposal.updated_at
  year:
    description: Year partition for the credit proposal record.
    lineage:
      - datalake_sales_flow_raw.credit_proposal.year
  month:
    description: Month partition for the credit proposal record.
    lineage:
      - datalake_sales_flow_raw.credit_proposal.month
  day:
    description: Day partition for the credit proposal record.
    lineage:
      - datalake_sales_flow_raw.credit_proposal.day
