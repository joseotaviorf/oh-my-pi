database_name: datalake_sales_flow_clean
table_name: offer_fee_rule
domain: For Sale
owner: helder.rodrigues@quintoandar.com.br
description: Contains offer fee rules configuration for different business and payment models.
columns:
  id:
    description: Unique ID for the offer fee rule record.
    lineage:
    - datalake_sales_flow_raw.offer_fee_rule.id
  id_listing_fee:
    description: Foreign key to the listing_fee table.
    lineage:
    - datalake_sales_flow_raw.offer_fee_rule.listing_fee_id
  business_model:
    description: Business model this fee rule applies to, determining which transaction type uses these min and max fee bounds.
    lineage:
    - datalake_sales_flow_raw.offer_fee_rule.business_model
  payment_model:
    description: Payment model this fee rule applies to, scoping the rule to a specific payment arrangement.
    lineage:
    - datalake_sales_flow_raw.offer_fee_rule.payment_model
  ts_valid_from:
    description: Timestamp from which the rule is valid.
    lineage:
    - datalake_sales_flow_raw.offer_fee_rule.valid_from
  ts_valid_to:
    description: Timestamp until which the rule is valid.
    lineage:
    - datalake_sales_flow_raw.offer_fee_rule.valid_to
  min_fee:
    description: Minimum fee percentage.
    lineage:
    - datalake_sales_flow_raw.offer_fee_rule.min_fee
  max_fee:
    description: Maximum fee percentage.
    lineage:
    - datalake_sales_flow_raw.offer_fee_rule.max_fee
  is_active:
    description: Flag indicating if the offer fee rule is active.
    lineage:
    - datalake_sales_flow_raw.offer_fee_rule.active
  ts_created:
    description: Timestamp when the offer fee rule was created.
    lineage:
    - datalake_sales_flow_raw.offer_fee_rule.created_at
  ts_updated:
    description: Timestamp of the last update to the offer fee rule.
    lineage:
    - datalake_sales_flow_raw.offer_fee_rule.updated_at
  year:
    description: Year partition for the offer fee rule record.
    lineage:
    - datalake_sales_flow_raw.offer_fee_rule.year
  month:
    description: Month partition for the offer fee rule record.
    lineage:
    - datalake_sales_flow_raw.offer_fee_rule.month
  day:
    description: Day partition for the offer fee rule record.
    lineage:
    - datalake_sales_flow_raw.offer_fee_rule.day
