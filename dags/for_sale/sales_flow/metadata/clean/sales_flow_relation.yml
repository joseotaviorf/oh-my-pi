database_name: datalake_sales_flow_clean
table_name: sales_flow_relation
domain: For Sale
owner: helder.rodrigues@quintoandar.com.br
description: |
  Associates a sales_flow to an external entity (company or agent) with a given role (related_as).
  Used for listing owner, visit agent, demand owner, property consultant, property acquirer, etc.
  One-to-one per sales_flow (sales_flow_id is unique). Source of the related entity is indicated by source_type.
columns:
  id:
    description: Primary key of the sales_flow_relation record.
    lineage:
    - datalake_sales_flow_raw.sales_flow_relation.id
  id_sales_flow:
    description: Foreign key to the sales_flow table. Unique; each sales_flow has at most one relation record.
    lineage:
    - datalake_sales_flow_raw.sales_flow_relation.sales_flow_id
  id_related:
    description: External string identifier of the related entity (company or agent ID, depending on source_type), sourced from the listing/mobile-api domain rather than an internal Sales Flow primary key.
    lineage:
    - datalake_sales_flow_raw.sales_flow_relation.related_id
  source_type:
    description: Type of the related entity reference (company or agent).
    categories:
      COMPANY_REF: Reference to a company.
      AGENT_REF: Reference to an agent.
    lineage:
    - datalake_sales_flow_raw.sales_flow_relation.source_type
  related_as:
    description: Role of the related entity in the sales flow. Populated either from the property's last visit (visit agent, demand owner, listing owner, all sourced as COMPANY_REF) or from the property listing's relations (listing owner, autonomous agent, property consultant, property acquirer).
    categories:
      LISTING_OWNER: Owner of the listing.
      AUTONOMOUS_AGENT: Autonomous real-estate agent associated with the listing.
      VISIT_AGENT_REAL_STATE: Real-estate agent who conducted the property visit.
      DEMAND_OWNER: Owner of the buyer's demand/search that generated the visit.
      PROPERTY_CONSULTANT: Property consultant associated with the listing.
      PROPERTY_ACQUIRER: Acquirer (buyer) of the property.
    lineage:
    - datalake_sales_flow_raw.sales_flow_relation.related_as
  ts_created:
    description: Timestamp when the relation was created.
    lineage:
    - datalake_sales_flow_raw.sales_flow_relation.created_at
  ts_updated:
    description: Timestamp when the relation was last updated.
    lineage:
    - datalake_sales_flow_raw.sales_flow_relation.updated_at
  year:
    description: Calendar year used as a  key for incremental table loads.
    lineage:
    - datalake_sales_flow_raw.sales_flow_relation.year
  month:
    description: Calendar month used as a  key for incremental table loads.
    lineage:
    - datalake_sales_flow_raw.sales_flow_relation.month
  day:
    description: Calendar day used as a  key for incremental table loads.
    lineage:
      - datalake_sales_flow_raw.sales_flow_relation.day
  op_cdc:
    lineage:
      - datalake_sales_flow_raw.sales_flow_relation.op_cdc
    description: CDC operation type captured by Debezium change-data-capture stream.
    categories:
      r: Read/snapshot - initial load of existing records.
      c: Create - new record inserted.
      u: Update - existing record modified.
      d: Delete - record removed.
  ts_cdc_transaction:
    lineage:
      - datalake_sales_flow_raw.sales_flow_relation.ts_cdc_transaction
    description: Wall-clock timestamp when the CDC connector captured this change event (millisecond precision).
  ts_database_transaction:
    lineage:
      - datalake_sales_flow_raw.sales_flow_relation.ts_database_transaction
    description: Timestamp of the originating database transaction in the source application before CDC propagation.
