---
database_name: datalake_sales_flow_clean
table_name: screening_negotiation_aud
domain: For Sale
owner: igor.firmo@quintoandar.com.br
description: Audit table for screening_negotiation containing historical changes and modifications.
columns:
  id:
    description: Unique ID for the screening negotiation record.
    lineage:
      - datalake_sales_flow_raw.screening_negotiation_aud.id
  rev:
    description: Unique id for this modification and can be joined with table rev_info to get more details.
    lineage:
      - datalake_sales_flow_raw.screening_negotiation_aud.rev
  rev_type:
    description: Modification type.
    categories:
      "0" : Create
      "1" : Update
      "2" : Delete
    lineage:
      - datalake_sales_flow_raw.screening_negotiation_aud.revtype
  rev_end:
    description: ID of the revision that replaced the current entry.
    lineage:
      - datalake_sales_flow_raw.screening_negotiation_aud.revend
  id_screening:
    description: Foreign key to the screening table.
    lineage:
      - datalake_sales_flow_raw.screening_negotiation_aud.screening_id
  mod_id_screening:
    description: Flag indicating if the column id_screening has changed.
    lineage:
      - datalake_sales_flow_raw.screening_negotiation_aud.screening_id_mod
  id_negotiation:
    description: Foreign key to the negotiation table.
    lineage:
      - datalake_sales_flow_raw.screening_negotiation_aud.negotiation_id
  mod_id_negotiation:
    description: Flag indicating if the column id_negotiation has changed.
    lineage:
      - datalake_sales_flow_raw.screening_negotiation_aud.negotiation_id_mod
  status:
    description: Status of the negotiation screening.
    lineage:
      - datalake_sales_flow_raw.screening_negotiation_aud.status
  mod_status:
    description: Flag indicating if the column status has changed.
    lineage:
      - datalake_sales_flow_raw.screening_negotiation_aud.status_mod
  ts_created:
    description: Timestamp when the screening negotiation record was created.
    lineage:
      - datalake_sales_flow_raw.screening_negotiation_aud.created_at
  ts_updated:
    description: Timestamp of the last update to the screening negotiation record.
    lineage:
      - datalake_sales_flow_raw.screening_negotiation_aud.updated_at
  year:
    description: Year partition for the screening negotiation record.
    lineage:
      - datalake_sales_flow_raw.screening_negotiation_aud.year
  month:
    description: Month partition for the screening negotiation record.
    lineage:
      - datalake_sales_flow_raw.screening_negotiation_aud.month
  day:
    description: Day partition for the screening negotiation record.
    lineage:
      - datalake_sales_flow_raw.screening_negotiation_aud.day
