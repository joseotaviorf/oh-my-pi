database_name: datalake_sales_flow_clean
table_name: diligence_appointment_aud
domain: For Sale
columns:
  id_diligence_appointment_aud:
    lineage:
    - datalake_sales_flow_raw.diligence_appointment_aud.id
    description: Audited identifier of the diligence appointment record at this revision.
  id_diligence:
    lineage:
    - datalake_sales_flow_raw.diligence_appointment_aud.diligence_id
    description: Audited identifier of the parent diligence record this appointment belongs to.
  rev:
    lineage:
    - datalake_sales_flow_raw.diligence_appointment_aud.rev
    description: Envers revision number grouping field-level changes in this audit snapshot.
  rev_type:
    lineage:
    - datalake_sales_flow_raw.diligence_appointment_aud.revtype
    description: 'Envers revision type code: insert, update, or delete for the audited row.'
  rev_end:
    lineage:
    - datalake_sales_flow_raw.diligence_appointment_aud.revend
    description: Envers revision end marker when this audited row version was superseded.
  appointment:
    lineage:
    - datalake_sales_flow_raw.diligence_appointment_aud.appointment
    description: Audited scheduled appointment detail recorded for the diligence process.
  mod_id_diligence:
    lineage:
    - datalake_sales_flow_raw.diligence_appointment_aud.diligence_id_mod
    description: Envers boolean flag indicating whether id diligence changed in this audit revision.
  mod_appointment:
    lineage:
    - datalake_sales_flow_raw.diligence_appointment_aud.appointment_mod
    description: Envers boolean flag indicating whether appointment changed in this audit revision.
  mod_ts_deleted:
    lineage:
    - datalake_sales_flow_raw.diligence_appointment_aud.deleted_at_mod
    description: Envers boolean flag indicating whether ts deleted changed in this audit revision.
  ts_deleted:
    lineage:
    - datalake_sales_flow_raw.diligence_appointment_aud.deleted_at
    description: Audited timestamp of when this diligence appointment was soft-deleted, if applicable.
  ts_created:
    lineage:
    - datalake_sales_flow_raw.diligence_appointment_aud.created_at
    description: Timestamp when the row was first created in the source operational system.
  ts_updated:
    lineage:
    - datalake_sales_flow_raw.diligence_appointment_aud.updated_at
    description: Timestamp when the row was last updated in the source operational system.
  year:
    lineage:
    - datalake_sales_flow_raw.diligence_appointment_aud.year
    description: Partition year when the ETL run loaded this row into the lake table.
  month:
    lineage:
    - datalake_sales_flow_raw.diligence_appointment_aud.month
    description: Partition month when the ETL run loaded this row into the lake table.
  day:
    lineage:
    - datalake_sales_flow_raw.diligence_appointment_aud.day
    description: Partition day when the ETL run loaded this row into the lake table.
owner: helder.rodrigues@quintoandar.com.br
description: Hibernate Envers audit trail of diligence appointment rows from Sales Flow service managing For Sale operations after an offer is received. Each revision records field-level changes for compliance and operational forensics.
