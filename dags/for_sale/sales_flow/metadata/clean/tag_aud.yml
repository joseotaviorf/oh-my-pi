database_name: datalake_sales_flow_clean
table_name: tag_aud
domain: For Sale
columns:
  id:
    lineage:
    - datalake_sales_flow_raw.tag_aud.id
    description: Surrogate primary key of the tag aud row in the source system.
  rev:
    lineage:
    - datalake_sales_flow_raw.tag_aud.rev
    description: Envers revision number grouping field-level changes in this audit snapshot.
  rev_type:
    lineage:
    - datalake_sales_flow_raw.tag_aud.revtype
    description: 'Envers revision type code: insert, update, or delete for the audited row.'
  rev_end:
    lineage:
    - datalake_sales_flow_raw.tag_aud.revend
    description: Envers revision end marker when this audited row version was superseded.
  label:
    lineage:
    - datalake_sales_flow_raw.tag_aud.label
    description: Short UI or workflow label describing the task, tag, or category shown to operators.
  mod_label:
    lineage:
    - datalake_sales_flow_raw.tag_aud.label_mod
    description: Envers boolean flag indicating whether label changed in this audit revision.
  ts_created:
    lineage:
    - datalake_sales_flow_raw.tag_aud.created_at
    description: Timestamp when the row was first created in the source operational system.
  ts_updated:
    lineage:
    - datalake_sales_flow_raw.tag_aud.updated_at
    description: Timestamp when the row was last updated in the source operational system.
  year:
    lineage:
    - datalake_sales_flow_raw.tag_aud.year
    description: Year when the ETL run loaded this row into the lake table.
  month:
    lineage:
    - datalake_sales_flow_raw.tag_aud.month
    description: Month when the ETL run loaded this row into the lake table.
  day:
    lineage:
    - datalake_sales_flow_raw.tag_aud.day
    description: Day when the ETL run loaded this row into the lake table.
owner: helder.rodrigues@quintoandar.com.br
description: Hibernate Envers audit trail of tag rows from Sales Flow service managing For Sale operations after an offer is received. Each revision records field-level changes for compliance and operational forensics.
