database_name: datalake_sales_flow_clean
table_name: notary_office
owner: helder.rodrigues@quintoandar.com.br
domain: For Sale
description: Registry of notary/registration offices (cartórios) — CRI real-estate registries and CRN deed/notes registries — used to process deed registration and key delivery for a sales flow. Each `Notary` process record links to one `NotaryOffice` via notary_office_id, and offices carry geolocation and hub/region coverage used for routing sales flows to the right office. (JPA entity — `NotaryOffice`, `br.com.quintoandar.salesflow.core.notaryoffice.NotaryOffice`)
columns:
  id:
    description: Surrogate primary key of the notary office row in the source system.
    lineage:
    - datalake_sales_flow_raw.notary_office.id
  id_hubs:
    description: List of hub IDs (business/operational regions) that this notary office serves.
    lineage:
    - datalake_sales_flow_raw.notary_office.hubs_id
  name:
    description: Display name of the notary office.
    lineage:
    - datalake_sales_flow_raw.notary_office.name
  mobile_phone:
    description: Mobile phone number for contacting the notary office.
    lineage:
    - datalake_sales_flow_raw.notary_office.mobile_phone
  phone:
    description: Landline/contact phone number for the notary office.
    lineage:
    - datalake_sales_flow_raw.notary_office.phone
  email:
    description: Contact email address for the notary office.
    lineage:
    - datalake_sales_flow_raw.notary_office.email
  address:
    description: Street address where the notary office is located.
    lineage:
    - datalake_sales_flow_raw.notary_office.address
  city:
    description: City where the notary office is located.
    lineage:
    - datalake_sales_flow_raw.notary_office.city
  state:
    description: State or federal unit where the notary office is located.
    lineage:
    - datalake_sales_flow_raw.notary_office.state
  label:
    description: Free-text label used to identify or describe the notary office (distinct in meaning from the CRI-attempt label on the notary table).
    lineage:
    - datalake_sales_flow_raw.notary_office.label
  type:
    description: 'Enum classifying the kind of registry office. Values: CRN (Cartório de Registro de Notas — notes/deed registry), CRI (Cartório de Registro de Imóveis — real-estate registry).'
    lineage:
    - datalake_sales_flow_raw.notary_office.type
  latitude:
    description: Geographic latitude coordinate of the notary office location.
    lineage:
    - datalake_sales_flow_raw.notary_office.latitude
  longitude:
    description: Geographic longitude coordinate of the notary office location.
    lineage:
    - datalake_sales_flow_raw.notary_office.longitude
  ts_created:
    description: Timestamp of the creation of the notary office.
    lineage:
    - datalake_sales_flow_raw.notary_office.created_at
  ts_updated:
    description: Timestamp of the last update of the notary office.
    lineage:
    - datalake_sales_flow_raw.notary_office.updated_at
  year:
    description: Year of the last update of the notary office.
    lineage:
    - datalake_sales_flow_raw.notary_office.year
  month:
    description: Month of the last update of the notary office.
    lineage:
    - datalake_sales_flow_raw.notary_office.month
  day:
    description: Day of the last update of the notary office.
    lineage:
    - datalake_sales_flow_raw.notary_office.day
