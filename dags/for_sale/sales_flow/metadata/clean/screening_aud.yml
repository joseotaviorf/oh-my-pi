---
database_name: datalake_sales_flow_clean
table_name: screening_aud
domain: For Sale
owner: igor.firmo@quintoandar.com.br
description: Audit table for screening containing historical changes and modifications.
columns:
  id:
    description: Unique ID for the screening record.
    lineage:
      - datalake_sales_flow_raw.screening_aud.id
  rev:
    description: Unique id for this modification and can be joined with table rev_info to get more details.
    lineage:
      - datalake_sales_flow_raw.screening_aud.rev
  rev_type:
    description: Modification type.
    categories:
      "0" : Create
      "1" : Update
      "2" : Delete
    lineage:
      - datalake_sales_flow_raw.screening_aud.revtype
  rev_end:
    description: ID of the revision that replaced the current entry.
    lineage:
      - datalake_sales_flow_raw.screening_aud.revend
  id_sales_flow:
    description: Foreign key to the sales_flow table.
    lineage:
      - datalake_sales_flow_raw.screening_aud.sales_flow_id
  mod_id_sales_flow:
    description: Flag indicating if the column id_sales_flow has changed.
    lineage:
      - datalake_sales_flow_raw.screening_aud.sales_flow_id_mod
  legal_pendency_status:
    description: Status of legal pendencies identified during screening.
    lineage:
      - datalake_sales_flow_raw.screening_aud.legal_pendency_status
  mod_legal_pendency_status:
    description: Flag indicating if the column legal_pendency_status has changed.
    lineage:
      - datalake_sales_flow_raw.screening_aud.legal_pendency_status_mod
  ts_created:
    description: Timestamp when the screening was created.
    lineage:
      - datalake_sales_flow_raw.screening_aud.created_at
  ts_updated:
    description: Timestamp of the last update to the screening.
    lineage:
      - datalake_sales_flow_raw.screening_aud.updated_at
  year:
    description: Year partition for the screening record.
    lineage:
      - datalake_sales_flow_raw.screening_aud.year
  month:
    description: Month partition for the screening record.
    lineage:
      - datalake_sales_flow_raw.screening_aud.month
  day:
    description: Day partition for the screening record.
    lineage:
      - datalake_sales_flow_raw.screening_aud.day
