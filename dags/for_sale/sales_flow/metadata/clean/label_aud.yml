---
database_name: datalake_sales_flow_clean
table_name: label_aud
domain: For Sale
owner: igor.firmo@quintoandar.com.br
description: Audit table for label containing historical changes and modifications.
columns:
  id:
    description: Unique ID for the label record.
    lineage:
      - datalake_sales_flow_raw.label_aud.id
  rev:
    description: Unique id for this modification and can be joined with table rev_info to get more details.
    lineage:
      - datalake_sales_flow_raw.label_aud.rev
  rev_type:
    description: Modification type.
    categories:
      "0" : Create
      "1" : Update
      "2" : Delete
    lineage:
      - datalake_sales_flow_raw.label_aud.revtype
  rev_end:
    description: ID of the revision that replaced the current entry.
    lineage:
      - datalake_sales_flow_raw.label_aud.revend
  json_label:
    description: JSONB field containing label data.
    lineage:
      - datalake_sales_flow_raw.label_aud.json_label
  mod_json_label:
    description: Flag indicating if the column json_label has changed.
    lineage:
      - datalake_sales_flow_raw.label_aud.json_label_mod
  ts_created:
    description: Timestamp when the label was created.
    lineage:
      - datalake_sales_flow_raw.label_aud.created_at
  ts_updated:
    description: Timestamp of the last update to the label.
    lineage:
      - datalake_sales_flow_raw.label_aud.updated_at
  year:
    description: Year partition for the label record.
    lineage:
      - datalake_sales_flow_raw.label_aud.year
  month:
    description: Month partition for the label record.
    lineage:
      - datalake_sales_flow_raw.label_aud.month
  day:
    description: Day partition for the label record.
    lineage:
      - datalake_sales_flow_raw.label_aud.day
