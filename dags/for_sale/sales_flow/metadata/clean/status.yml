database_name: datalake_sales_flow_clean
table_name: status
domain: For Sale
owner: helder.rodrigues@quintoandar.com.br
description: Reference/dimension table that models the tree of macrostatus and microstatus values used to track a "For Sale" closing process. Each row is either a top-level macrostatus (no parent) or a microstatus nested under a macrostatus via a self-referencing parent relationship, and carries a display label plus a unique business key (e.g. CCV_SENT_TO_SIGNED, DILIGENCE_PROCESSING, FINANCING_SIGNED) used throughout the sales-flow codebase to identify the current stage of an offer. (JPA entity — `Status`, `br.com.quintoandar.salesflow.core.status.Status`)
columns:
  id:
    description: Surrogate primary key of the status row (BaseEntity.id), generated by the database.
    lineage:
    - datalake_sales_flow_raw.status.id
  id_label:
    description: Foreign key to the label table, holding the multi-language (e.g. pt) display text shown for this status/microstatus in the UI.
    lineage:
    - datalake_sales_flow_raw.status.label_id
  id_parent:
    description: Self-referencing foreign key to another row in this same table (Status.parentStatus). When null, the row represents a macrostatus (top-level stage); when populated, the row is a microstatus nested under the referenced macrostatus.
    lineage:
    - datalake_sales_flow_raw.status.parent_id
  key:
    description: Unique business key identifying the macro or micro status of the closing process, used in application code to reference specific stages. Dozens of keys exist across the macrostatus tree (NEGOTIATION, CCV, DILIGENCE, CREDIT_ANALYSIS, TIC, etc.); see categories for a non-exhaustive sample of the most common ones.
    categories:
      NEGOTIATION: "Macrostatus: negotiation stage of the offer (Negociação)."
      NEGOTIATION_NEW: "Microstatus of NEGOTIATION: negotiation just started (Nova)."
      NEGOTIATION_ONGOING: "Microstatus of NEGOTIATION: negotiation in progress (Em negociação)."
      NEGOTIATION_OFFER_ACCEPTED: "Microstatus of NEGOTIATION: offer accepted by the counterpart (Proposta aceita)."
      PROPOSAL_SENT: "Macrostatus: purchase proposal has been sent (Proposta Enviada)."
      CCV: "Macrostatus: CCV (purchase and sale contract) stage."
      CCV_SIGNED: "Microstatus of CCV: contract signed by all parties (CCV assinado)."
      CCV_DOCS_PENDING: "Microstatus of CCV: documentation still pending (Pendente documentação)."
      DILIGENCE: "Macrostatus: due-diligence stage (Diligência)."
      DILIGENCE_PROCESSING: "Microstatus of DILIGENCE: due-diligence request being processed (Em processamento)."
      DILIGENCE_DOCS_AVAILABLE: "Microstatus of DILIGENCE: supporting documentation available (Documentação disponível)."
      DILIGENCE_WRITING_REPORT: "Microstatus of DILIGENCE: due-diligence report being drafted (Relatório em confecção)."
      DILIGENCE_REPORT_AVAILABLE: "Microstatus of DILIGENCE: due-diligence report ready (Relatório disponível)."
      DILIGENCE_REPORT_SENT_SELLER: "Microstatus of DILIGENCE: report sent to the seller (Relatório enviado p/ vendedor)."
      DILIGENCE_REPORT_SENT_BUYER: "Microstatus of DILIGENCE: report sent to the buyer (Relatório enviado p/ comprador)."
      DILIGENCE_LONG_TERM_PAYMENT: "Microstatus of DILIGENCE: long-term payment condition identified (Pagamento longo prazo)."
      CREDIT_ANALYSIS: "Macrostatus: financing credit-analysis stage (Análise de crédito)."
      CREDIT_ANALYSIS_SIMULATION_SENT: "Microstatus of CREDIT_ANALYSIS: financing simulation sent and in progress (Em andamento)."
      CREDIT_ANALYSIS_CREDIT_APPROVED: "Microstatus of CREDIT_ANALYSIS: financing credit approved by the bank (Crédito aprovado)."
      ONBOARDING: "Macrostatus: onboarding stage after offer acceptance."
      TIC: "Macrostatus: TIC (shared brokerage contract) stage for 3P closing offers."
      TIC_CREATED: "Microstatus of TIC: TIC document generated (TIC gerada)."
      TIC_SIGNED: "Microstatus of TIC: signed TIC document stored (TIC assinada)."
      PURCHASE_SALE_COMPLETED: "Macrostatus: closing process fully completed (Concluir venda (fim))."
    lineage:
    - datalake_sales_flow_raw.status.key
  ts_created:
    description: Timestamp that indicates when this entry was created.
    lineage:
    - datalake_sales_flow_raw.status.created_at
  ts_updated:
    description: Timestamp that indicates when this entry was last updated.
    lineage:
    - datalake_sales_flow_raw.status.updated_at
  year:
    description: Year when the ETL run loaded this row into the lake table.
    lineage:
    - datalake_sales_flow_raw.status.year
  month:
    description: Month when the ETL run loaded this row into the lake table.
    lineage:
    - datalake_sales_flow_raw.status.month
  day:
    description: Day when the ETL run loaded this row into the lake table.
    lineage:
    - datalake_sales_flow_raw.status.day
