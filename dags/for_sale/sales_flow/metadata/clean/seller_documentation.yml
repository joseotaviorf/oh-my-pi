database_name: datalake_sales_flow_clean
table_name: seller_documentation
description: Tracks the seller's legal-documentation collection process for a house/property, independent of any specific sales flow — recording when the seller started providing property documents and when they finished submitting them. Keyed by house_id (not sales_flow_id), one row per house's documentation cycle. (JPA entity — `SellerDocumentation`, `br.com.quintoandar.salesflow.core.sellerdocumentation.SellerDocumentation`)
domain: For Sale
owner: helder.rodrigues@quintoandar.com.br
columns:
  id:
    lineage:
    - datalake_sales_flow_raw.seller_documentation.id
    description: Unique ID for the seller documentation record.
  id_house:
    lineage:
    - datalake_sales_flow_raw.seller_documentation.house_id
    description: Foreign key to the house being sold (datalake_sales_flow_clean.house). Unlike most Sales Flow tables, this record is keyed by house, not by sales_flow_id.
  ts_started:
    lineage:
    - datalake_sales_flow_raw.seller_documentation.started_at
    description: Timestamp of when the seller started the property documentation submission process.
  ts_submitted:
    lineage:
    - datalake_sales_flow_raw.seller_documentation.submitted_at
    description: Timestamp of when the seller finished submitting all required property documents.
  ts_created:
    lineage:
    - datalake_sales_flow_raw.seller_documentation.created_at
    description: Timestamp when this event of this row happened.
  ts_updated:
    lineage:
    - datalake_sales_flow_raw.seller_documentation.updated_at
    description: Timestamp when this event of this row was updated.
  year:
    lineage:
    - datalake_sales_flow_raw.seller_documentation.year
    description: Year when the ETL run loaded this row into the lake table.
  month:
    lineage:
    - datalake_sales_flow_raw.seller_documentation.month
    description: Month when the ETL run loaded this row into the lake table.
  day:
    lineage:
    - datalake_sales_flow_raw.seller_documentation.day
    description: Day when the ETL run loaded this row into the lake table.
