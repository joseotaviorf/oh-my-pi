database_name: datalake_sales_flow_clean
table_name: seller_documentation
description: Table that contains the information about the seller documentation process.
domain: For Sale
owner: helder.rodrigues@quintoandar.com.br
columns:
  id:
    lineage:
    - datalake_sales_flow_raw.seller_documentation.id
    description: Document unique ID.
  id_house:
    lineage:
    - datalake_sales_flow_raw.seller_documentation.house_id
    description: House ID on SalesFlow tables (datalake_sales_flow_clean.house).
  ts_started:
    lineage:
    - datalake_sales_flow_raw.seller_documentation.started_at
    description: Timestamp related to the first document(s) sent by the seller.
  ts_submitted:
    lineage:
    - datalake_sales_flow_raw.seller_documentation.submitted_at
    description: Timestamp related to the documentation process end, when the seller submitted the documents.
  ts_created:
    lineage:
    - datalake_sales_flow_raw.seller_documentation.created_at
    description: Timestamp when this event of this row happened.
  ts_updated:
    lineage:
    - datalake_sales_flow_raw.seller_documentation.updated_at
    description: Timestamp when this event of this row was updated.
  year:
    lineage:
    - datalake_sales_flow_raw.seller_documentation.year
    description: Partition year when the ETL run loaded this row into the lake table.
  month:
    lineage:
    - datalake_sales_flow_raw.seller_documentation.month
    description: Partition month when the ETL run loaded this row into the lake table.
  day:
    lineage:
    - datalake_sales_flow_raw.seller_documentation.day
    description: Partition day when the ETL run loaded this row into the lake table.
