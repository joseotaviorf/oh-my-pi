database_name: datalake_sales_flow_clean
table_name: negotiation
domain: For Sale
columns:
  id:
    lineage:
    - datalake_sales_flow_raw.negotiation.id
    description: Surrogate primary key of the negotiation row in the source system.
  id_sales_flow:
    lineage:
    - datalake_sales_flow_raw.negotiation.sales_flow_id
    description: Foreign key to the parent sales flow transaction in the end-of-funnel domain.
  sent_to_operations_support_by:
    lineage:
    - datalake_sales_flow_raw.negotiation.sent_to_operations_support_by
    description: Identifier of the user or system that sent the negotiation to operations support.
  has_fgts_draft:
    lineage:
    - datalake_sales_flow_raw.negotiation.use_fgts
    description: Boolean flag indicating whether fgts draft applies to this record.
  has_final_value_refund:
    lineage:
    - datalake_sales_flow_raw.negotiation.has_final_value_refund
    description: Boolean flag indicating whether final value refund applies to this record.
  is_seller_pj:
    lineage:
    - datalake_sales_flow_raw.negotiation.is_seller_pj
    description: Boolean flag indicating whether seller pj applies to this record.
  is_buyer_pj:
    lineage:
    - datalake_sales_flow_raw.negotiation.is_buyer_pj
    description: Boolean flag indicating whether buyer pj applies to this record.
  is_consorcio_payment:
    lineage:
    - datalake_sales_flow_raw.negotiation.is_consorcio_payment
    description: Boolean flag indicating whether consorcio payment applies to this record.
  is_internal_financing:
    lineage:
    - datalake_sales_flow_raw.negotiation.internal_financing
    description: Boolean flag indicating whether internal financing applies to this record.
  ts_buyer_documentation_started:
    lineage:
    - datalake_sales_flow_raw.negotiation.buyer_documentation_started_at
    description: Timestamp when the buyer documentation step of the negotiation started.
  ts_buyer_documentation_submitted:
    lineage:
    - datalake_sales_flow_raw.negotiation.buyer_documentation_submitted_at
    description: Timestamp when the buyer documentation was submitted in the negotiation.
  ts_seller_documentation_started:
    lineage:
    - datalake_sales_flow_raw.negotiation.seller_documentation_started_at
    description: Timestamp when the seller documentation step of the negotiation started.
  ts_seller_documentation_submitted:
    lineage:
    - datalake_sales_flow_raw.negotiation.seller_documentation_submitted_at
    description: Timestamp when the seller documentation was submitted in the negotiation.
  ts_buyer_credit_started:
    lineage:
    - datalake_sales_flow_raw.negotiation.buyer_credit_started_at
    description: Timestamp when the buyer credit analysis step of the negotiation started.
  ts_buyer_credit_submitted:
    lineage:
    - datalake_sales_flow_raw.negotiation.buyer_credit_submitted_at
    description: Timestamp when the buyer credit request was submitted in the negotiation.
  ts_seller_negotiation_ongoing_notification_submitted:
    lineage:
    - datalake_sales_flow_raw.negotiation.seller_negotiation_ongoing_notification_submitted_at
    description: Timestamp when the seller was notified that the negotiation was ongoing.
  ts_sent_to_operations_support:
    lineage:
    - datalake_sales_flow_raw.negotiation.sent_to_operations_support_at
    description: Timestamp when the negotiation was sent to operations support.
  ts_created:
    lineage:
    - datalake_sales_flow_raw.negotiation.created_at
    description: Timestamp when the row was first created in the source operational system.
  ts_updated:
    lineage:
    - datalake_sales_flow_raw.negotiation.updated_at
    description: Timestamp when the row was last updated in the source operational system.
  year:
    lineage:
    - datalake_sales_flow_raw.negotiation.year
    description: Partition year when the ETL run loaded this row into the lake table.
  month:
    lineage:
    - datalake_sales_flow_raw.negotiation.month
    description: Partition month when the ETL run loaded this row into the lake table.
  day:
    lineage:
    - datalake_sales_flow_raw.negotiation.day
    description: Partition day when the ETL run loaded this row into the lake table.
owner: helder.rodrigues@quintoandar.com.br
description: Cleaned snapshot of negotiation sourced from operational systems backing Sales Flow service managing For Sale operations after an offer is received. One row per negotiation record with standardized names and types in datalake_sales_flow_clean.
