database_name: datalake_sales_flow_clean
table_name: task
owner: helder.rodrigues@quintoandar.com.br
domain: For Sale
description: The top-level unit of the sales-flow task manager domain. A task groups one or more subtasks (see subtask table) that must be executed to resolve a legal/registry pendency or special contractual clause found for a given property or closing (e.g. an outstanding mortgage that needs cancelling, a marriage that needs registering). Tasks are created automatically by domain logic when a triggering event occurs (e.g. CCV signed, offer sent) or a due-diligence/CCV-clause finding is detected on a specific property/sales flow. (JPA entity — `Task`, `br.com.quintoandar.salesflow.core.task.Task`)
columns:
  id:
    description: Surrogate primary key of the task row (BaseEntity.id), generated by the database.
    lineage:
    - datalake_sales_flow_raw.task.id
  id_source_related:
    description: Free-text identifier of the specific finding/pendency (from the TaskSourceRelatedIds enum, e.g. ACTIVE_PAWN, MORTGAGE_PAID_NOT_REGISTERED, CCV_CLAUSE) that this task was generated from, linking it back to the due-diligence or CCV-clause source that triggered its creation.
    lineage:
    - datalake_sales_flow_raw.task.source_related_id
  label:
    description: Enum (TaskLabel) identifying the specific type of legal/registry pendency or CCV special clause this task addresses (e.g. MARRIAGE_NOT_REGISTERED, PROPERTY_ADDRESS_UPDATE, ACTIVE_PAWN, CREDIT_ANALYSIS_FORM). It is a very large enumeration covering both long-standing registry-regularization pendencies and several hundred CCV special-clause labels (many generated with AI assistance in November 2025) used across cash and financed closing flows.
    lineage:
    - datalake_sales_flow_raw.task.label
  subject:
    description: Enum (TaskSubject) classifying the general topic of the task.
    categories:
      PROPERTY_REGISTRATION_UPDATE: Task concerns updating the property's real estate registry record.
      INSPECTION: Task concerns a property inspection.
      FIDUCIARY_LIEN: Task concerns a fiduciary lien (alienação fiduciária) on the property.
      SEND_REAL_STATE_REGISTRY_CERTIFICATE: Task concerns sending the real estate registry certificate.
      ISSUE_REAL_STATE_REGISTRY_CERTIFICATE: Task concerns issuing the real estate registry certificate.
      SIGN_FINANCING_CONTRACT: Task concerns signing the financing contract with the bank.
      CREDIT_ANALYSIS_FORM: Task concerns completing the credit analysis form.
      INSPECTION_FEE_PAYMENT: Task concerns payment of the inspection fee.
      ENTRY_AMOUNT_PAYMENT: Task concerns payment of the entry/down-payment amount.
      NO_SUBJECT: No specific subject applies to this task.
    lineage:
    - datalake_sales_flow_raw.task.subject
  source:
    description: Enum (TaskSource) identifying what originated this task.
    categories:
      SPECIAL_CLAUSE: Task originated from a CCV special clause.
      CCV_FINANCED: Task originated from a financed-flow CCV condition.
      OFFER_SENT: Task originated from the offer being sent.
    lineage:
    - datalake_sales_flow_raw.task.source
  task_trigger:
    description: Enum (TaskTrigger) identifying the business event that caused this task to be created.
    categories:
      CCV_SIGNED: Task created when the purchase and sale contract (CCV) is signed.
      OFFER_SENT: Task created when the purchase offer is sent.
    lineage:
    - datalake_sales_flow_raw.task.task_trigger
  ts_created:
    description: Timestamp of the creation of the task
    lineage:
    - datalake_sales_flow_raw.task.created_at
  ts_updated:
    description: Timestamp of the last update of the task
    lineage:
    - datalake_sales_flow_raw.task.updated_at
  year:
    lineage:
    - datalake_sales_flow_raw.task.year
    description: Year when the ETL run loaded this row into the lake table.
  month:
    lineage:
    - datalake_sales_flow_raw.task.month
    description: Month when the ETL run loaded this row into the lake table.
  day:
    lineage:
    - datalake_sales_flow_raw.task.day
    description: Day when the ETL run loaded this row into the lake table.
