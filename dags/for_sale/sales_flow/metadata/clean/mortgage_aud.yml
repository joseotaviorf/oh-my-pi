  mod_credit_status:
    lineage:
    - datalake_sales_flow_raw.mortgage_aud.credit_status_mod
    description: Envers boolean flag indicating whether credit status changed in this audit revision.
  mod_bank_fee:
    lineage:
    - datalake_sales_flow_raw.mortgage_aud.bank_fee_mod
    description: Envers boolean flag indicating whether bank fee changed in this audit revision.
  mod_institution_choice_reason:
    lineage:
    - datalake_sales_flow_raw.mortgage_aud.institution_choice_reason_mod
    description: Envers boolean flag indicating whether institution choice reason changed in this audit revision.
  mod_credit_letter:
    lineage:
    - datalake_sales_flow_raw.mortgage_aud.credit_letter_mod
    description: Envers boolean flag indicating whether credit letter changed in this audit revision.
  mod_mortgage_pendency:
    lineage:
    - datalake_sales_flow_raw.mortgage_aud.mortgage_pendency_mod
    description: Envers boolean flag indicating whether mortgage pendency changed in this audit revision.
