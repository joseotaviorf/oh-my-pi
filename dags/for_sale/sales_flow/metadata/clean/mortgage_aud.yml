database_name: datalake_sales_flow_clean
table_name: mortgage_aud
domain: For Sale
columns:
  id_mortgage_aud:
    lineage:
    - datalake_sales_flow_raw.mortgage_aud.id
    description: Audited identifier of the mortgage record this revision belongs to.
  id_sales_flow:
    lineage:
    - datalake_sales_flow_raw.mortgage_aud.sales_flow_id
    description: Foreign key to the parent sales flow transaction in the end-of-funnel domain.
  rev:
    lineage:
    - datalake_sales_flow_raw.mortgage_aud.rev
    description: Envers revision number grouping field-level changes in this audit snapshot.
  rev_type:
    lineage:
    - datalake_sales_flow_raw.mortgage_aud.revtype
    description: 'Envers revision type code: insert, update, or delete for the audited row.'
  rev_end:
    lineage:
    - datalake_sales_flow_raw.mortgage_aud.revend
    description: Envers revision end marker when this audited row version was superseded.
  status:
    lineage:
    - datalake_sales_flow_raw.mortgage_aud.status
    description: Current operational status code governing workflow progression for this record.
  bank:
    lineage:
    - datalake_sales_flow_raw.mortgage_aud.bank
    description: Audited name of the bank or financial institution at this revision.
  credit_model:
    lineage:
    - datalake_sales_flow_raw.mortgage_aud.credit_model
    description: Audited credit model used for the mortgage financing at this revision.
  credit_status:
    lineage:
    - datalake_sales_flow_raw.mortgage_aud.credit_status
    description: Audited status of the credit analysis at this revision.
  bank_fee:
    lineage:
    - datalake_sales_flow_raw.mortgage_aud.bank_fee
    description: Audited fee charged by the bank for the financing at this revision.
  institution_choice_reason:
    lineage:
    - datalake_sales_flow_raw.mortgage_aud.institution_choice_reason
    description: Audited reason recorded for choosing the financial institution at this revision.
  credit_letter:
    lineage:
    - datalake_sales_flow_raw.mortgage_aud.credit_letter
    description: Audited credit-approval letter status or reference at this revision.
  mortgage_pendency:
    lineage:
    - datalake_sales_flow_raw.mortgage_aud.mortgage_pendency
    description: Audited pending issues or items blocking the mortgage at this revision.
  mod_id_sales_flow:
    lineage:
    - datalake_sales_flow_raw.mortgage_aud.sales_flow_id_mod
    description: Envers boolean flag indicating whether id sales flow changed in this audit revision.
  mod_status:
    lineage:
