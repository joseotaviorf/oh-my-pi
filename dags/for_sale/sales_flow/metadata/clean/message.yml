---
database_name: datalake_sales_flow_clean
table_name: message
domain: For Sale
owner: igor.firmo@quintoandar.com.br
description: Contains outbox pattern messages for event-driven communication in the sales flow process.
columns:
  id:
    description: Unique ID for the message record.
    lineage:
      - datalake_sales_flow_raw.message.id
  id_incremental:
    description: Auto-incrementing ID for ordering messages.
    lineage:
      - datalake_sales_flow_raw.message.incremental_id
  destination:
    description: Message destination topic or queue.
    lineage:
      - datalake_sales_flow_raw.message.destination
  headers:
    description: Message headers as text.
    lineage:
      - datalake_sales_flow_raw.message.headers
  payload:
    description: Message payload content as text.
    lineage:
      - datalake_sales_flow_raw.message.payload
  published:
    description: Publication status flag (0 = not published, 1 = published).
    lineage:
      - datalake_sales_flow_raw.message.published
  message_partition:
    description: Partition identifier for the message table.
    lineage:
      - datalake_sales_flow_raw.message.message_partition
  creation_time:
    description: Message creation time as BIGINT timestamp.
    lineage:
      - datalake_sales_flow_raw.message.creation_time
  creation_datetime:
    description: Message creation timestamp as datetime.
    lineage:
      - datalake_sales_flow_raw.message.creation_datetime
  year:
    description: Year partition for the message record.
    lineage:
      - datalake_sales_flow_raw.message.year
  month:
    description: Month partition for the message record.
    lineage:
      - datalake_sales_flow_raw.message.month
  day:
    description: Day partition for the message record.
    lineage:
      - datalake_sales_flow_raw.message.day
