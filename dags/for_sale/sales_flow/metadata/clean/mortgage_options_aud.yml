---
database_name: datalake_sales_flow_clean
table_name: mortgage_options_aud
domain: For Sale
owner: igor.firmo@quintoandar.com.br
description: Audit table for mortgage_options containing historical changes and modifications.
columns:
  id:
    description: Unique ID for the mortgage options record.
    lineage:
      - datalake_sales_flow_raw.mortgage_options_aud.id
  rev:
    description: Unique id for this modification and can be joined with table rev_info to get more details.
    lineage:
      - datalake_sales_flow_raw.mortgage_options_aud.rev
  rev_type:
    description: Modification type.
    categories:
      "0" : Create
      "1" : Update
      "2" : Delete
    lineage:
      - datalake_sales_flow_raw.mortgage_options_aud.revtype
  rev_end:
    description: ID of the revision that replaced the current entry.
    lineage:
      - datalake_sales_flow_raw.mortgage_options_aud.revend
  installments_quantity:
    description: Number of installments for the mortgage.
    lineage:
      - datalake_sales_flow_raw.mortgage_options_aud.installments_quantity
  sale_price_amount:
    description: Total sale price amount of the property.
    lineage:
      - datalake_sales_flow_raw.mortgage_options_aud.sale_price_amount
  financing_amount:
    description: Amount to be financed through mortgage.
    lineage:
      - datalake_sales_flow_raw.mortgage_options_aud.financing_amount
  entry_amount:
    description: Down payment/entry amount.
    lineage:
      - datalake_sales_flow_raw.mortgage_options_aud.entry_amount
  amortization_type:
    description: Type of amortization system (e.g. SAC, PRICE).
    lineage:
      - datalake_sales_flow_raw.mortgage_options_aud.amortization_type
  include_fees:
    description: Flag indicating if fees are included in calculation.
    lineage:
      - datalake_sales_flow_raw.mortgage_options_aud.include_fees
  include_valuation_fee:
    description: Flag indicating if valuation fee is included.
    lineage:
      - datalake_sales_flow_raw.mortgage_options_aud.include_valuation_fee
  id_house:
    description: Foreign key to the house table.
    lineage:
      - datalake_sales_flow_raw.mortgage_options_aud.house_id
  mod_id_house:
    description: Flag indicating if the column id_house has changed.
    lineage:
      - datalake_sales_flow_raw.mortgage_options_aud.house_id_mod
  year:
    description: Year partition for the mortgage options record.
    lineage:
      - datalake_sales_flow_raw.mortgage_options_aud.year
  month:
    description: Month partition for the mortgage options record.
    lineage:
      - datalake_sales_flow_raw.mortgage_options_aud.month
  day:
    description: Day partition for the mortgage options record.
    lineage:
      - datalake_sales_flow_raw.mortgage_options_aud.day
