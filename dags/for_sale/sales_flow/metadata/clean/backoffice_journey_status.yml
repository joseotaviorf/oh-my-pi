database_name: datalake_sales_flow_clean
table_name: backoffice_journey_status
owner: helder.rodrigues@quintoandar.com.br
domain: For Sale
description: Tracks backoffice-assisted onboarding for a sales flow. "Onboarded" here means the closing operations team (or its AI chatbot) proactively contacted the buyer/seller to walk them through the post-CCV-signing process; this is distinct from and unrelated to the self-service, in-app onboarding flags tracked on the offer table (has_buyer_done_onboarding / has_seller_done_onboarding), where the user completes informational steps on their own. One row exists per sales flow (one-to-one relationship). (JPA entity — `BackofficeJourney`, `br.com.quintoandar.salesflow.core.backofficejourney.BackofficeJourney`)
columns:
  id:
    description: Surrogate primary key of the backoffice_journey_status row (BaseEntity.id), generated by the database.
    lineage:
    - datalake_sales_flow_raw.backoffice_journey_status.id
  id_sales_flow:
    description: Foreign key to the sales_flow table this backoffice journey status belongs to (one-to-one relationship).
    lineage:
    - datalake_sales_flow_raw.backoffice_journey_status.sales_flow_id
  is_buyer_onboarded:
    description: Flag indicating whether the operations team or AI chatbot has contacted the buyer about the post-CCV-signing process. Not related to the self-service in-app buyer onboarding flag on the offer table.
    lineage:
    - datalake_sales_flow_raw.backoffice_journey_status.is_buyer_onboarded
  is_seller_onboarded:
    description: Flag indicating whether the operations team or AI chatbot has contacted the seller about the post-CCV-signing process. Not related to the self-service in-app seller onboarding flag on the offer table.
    lineage:
    - datalake_sales_flow_raw.backoffice_journey_status.is_seller_onboarded
  is_buyer_eligible_for_chatbot:
    description: Flag indicating whether the buyer is currently eligible for the backoffice AI chatbot onboarding experience.
    lineage:
    - datalake_sales_flow_raw.backoffice_journey_status.is_buyer_eligible_for_chatbot
  is_seller_eligible_for_chatbot:
    description: Flag indicating whether the seller is currently eligible for the backoffice AI chatbot onboarding experience.
    lineage:
    - datalake_sales_flow_raw.backoffice_journey_status.is_seller_eligible_for_chatbot
  ts_buyer_onboarding_concluded:
    description: Timestamp when the backoffice-assisted buyer onboarding (operations/chatbot contact) was concluded.
    lineage:
    - datalake_sales_flow_raw.backoffice_journey_status.buyer_onboarding_concluded_at
  ts_seller_onboarding_concluded:
    description: Timestamp when the backoffice-assisted seller onboarding (operations/chatbot contact) was concluded.
    lineage:
    - datalake_sales_flow_raw.backoffice_journey_status.seller_onboarding_concluded_at
  ts_created:
    description: Timestamp of the creation of the record.
    lineage:
    - datalake_sales_flow_raw.backoffice_journey_status.created_at
  ts_updated:
    description: Timestamp of the last update of the record.
    lineage:
    - datalake_sales_flow_raw.backoffice_journey_status.updated_at
  year:
    description: Year when the ETL run loaded this row into the lake table.
    lineage:
    - datalake_sales_flow_raw.backoffice_journey_status.year
  month:
    description: Month when the ETL run loaded this row into the lake table.
    lineage:
    - datalake_sales_flow_raw.backoffice_journey_status.month
  day:
    description: Day when the ETL run loaded this row into the lake table.
    lineage:
    - datalake_sales_flow_raw.backoffice_journey_status.day
