---
database_name: datalake_sales_flow_clean

table_name: invoice_tracking_aud

domain: For Sale

owner: rachel.carvalho@quintoandar.com.br

description: Audit table for invoice_tracking containing historical changes and modifications.

columns:
  id:
    description: Unique ID for the invoice tracking record.
    lineage:
      - datalake_sales_flow_raw.invoice_tracking_aud.id

  rev:
    description: Unique id for this modification and can be joined with table rev_info to get more details.
    lineage:
      - datalake_sales_flow_raw.invoice_tracking_aud.rev

  rev_type:
    description: Modification type.
    categories:
      "0" : Create
      "1" : Update
      "2" : Delete
    lineage:
      - datalake_sales_flow_raw.invoice_tracking_aud.revtype

  rev_end:
    description: ID of the revision that replaced the current entry.
    lineage:
      - datalake_sales_flow_raw.invoice_tracking_aud.revend

  id_sales_flow:
    description: Foreign key to the sales_flow table.
    lineage:
      - datalake_sales_flow_raw.invoice_tracking_aud.sales_flow_id

  mod_id_sales_flow:
    description: Flag indicating if the column id_sales_flow has changed.
    lineage:
      - datalake_sales_flow_raw.invoice_tracking_aud.sales_flow_id_mod

  id_offer:
    description: Offer ID associated with the invoice tracking.
    lineage:
      - datalake_sales_flow_raw.invoice_tracking_aud.offer_id

  mod_id_offer:
    description: Flag indicating if the column id_offer has changed.
    lineage:
      - datalake_sales_flow_raw.invoice_tracking_aud.offer_id_mod

  recipient_type:
    description: Type of invoice recipient.
    lineage:
      - datalake_sales_flow_raw.invoice_tracking_aud.recipient_type

  mod_recipient_type:
    description: Flag indicating if the column recipient_type has changed.
    lineage:
      - datalake_sales_flow_raw.invoice_tracking_aud.recipient_type_mod

  status:
    description: Current status of the invoice tracking.
    lineage:
      - datalake_sales_flow_raw.invoice_tracking_aud.status

  mod_status:
    description: Flag indicating if the column status has changed.
    lineage:
      - datalake_sales_flow_raw.invoice_tracking_aud.status_mod

  failure_reason:
    description: Reason for invoice tracking failure, if applicable.
    lineage:
      - datalake_sales_flow_raw.invoice_tracking_aud.failure_reason

  mod_failure_reason:
    description: Flag indicating if the column failure_reason has changed.
    lineage:
      - datalake_sales_flow_raw.invoice_tracking_aud.failure_reason_mod

  attempt_count:
    description: Number of attempts made to process the invoice.
    lineage:
      - datalake_sales_flow_raw.invoice_tracking_aud.attempt_count

  mod_attempt_count:
    description: Flag indicating if the column attempt_count has changed.
    lineage:
      - datalake_sales_flow_raw.invoice_tracking_aud.attempt_count_mod

  expected_invoices_count:
    description: Expected number of invoices.
    lineage:
      - datalake_sales_flow_raw.invoice_tracking_aud.expected_invoices_count

  mod_expected_invoices_count:
    description: Flag indicating if the column expected_invoices_count has changed.
    lineage:
      - datalake_sales_flow_raw.invoice_tracking_aud.expected_invoices_count_mod

  found_invoices_count:
    description: Number of invoices found.
    lineage:
      - datalake_sales_flow_raw.invoice_tracking_aud.found_invoices_count

  mod_found_invoices_count:
    description: Flag indicating if the column found_invoices_count has changed.
    lineage:
      - datalake_sales_flow_raw.invoice_tracking_aud.found_invoices_count_mod

  last_error_message:
    description: Last error message encountered during invoice processing.
    lineage:
      - datalake_sales_flow_raw.invoice_tracking_aud.last_error_message

  mod_last_error_message:
    description: Flag indicating if the column last_error_message has changed.
    lineage:
      - datalake_sales_flow_raw.invoice_tracking_aud.last_error_message_mod

  ts_created:
    description: Timestamp when the invoice tracking was created.
    lineage:
      - datalake_sales_flow_raw.invoice_tracking_aud.created_at

  ts_updated:
    description: Timestamp of the last update to the invoice tracking.
    lineage:
      - datalake_sales_flow_raw.invoice_tracking_aud.updated_at

  year:
    description: Year partition for the invoice tracking record.
    lineage:
      - datalake_sales_flow_raw.invoice_tracking_aud.year

  month:
    description: Month partition for the invoice tracking record.
    lineage:
      - datalake_sales_flow_raw.invoice_tracking_aud.month

  day:
    description: Day partition for the invoice tracking record.
    lineage:
      - datalake_sales_flow_raw.invoice_tracking_aud.day

