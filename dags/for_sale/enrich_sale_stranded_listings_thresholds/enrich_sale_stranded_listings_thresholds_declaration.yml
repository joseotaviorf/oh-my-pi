dag:
  name: enrich_sale_stranded_listings_thresholds
  schedule_start_date: 2021, 7, 20
  owner: Data ForSale
  documentation:
    dag_purpose: This DAG creates the enriched tables for Stranded Listings context.
workflow:
  type: query_delta
  layer: enrich
  custom_schema: sale_stranded_listings
  default_extraction_type: incremental
  short_circuit_customization:
    function: CHECK_IS_SPECIFIC_DAY_OF_MONTH
    execution_date: "{{ macros.ds_add(data_interval_start | ds, 1) }}"
    function_params:
      day: 2
cluster:
  type: databricks_16_4_med_io-general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: USER_ISOLATION
    spark_version: 16.4.x-scala2.12
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
