dag:
  name: reverse_rent_listings_report_access
  schedule_start_date: 2022,7,12
  owner: Data ForSale
  documentation:
    dag_purpose: This DAG collects data saved in the schema "reverse_listings_report" by the DAG reverse_rent_listings_report_load, and sends them via SNS.
workflow:
  type: access
  layer: reverse
  custom_schema: listings_report
  load_spark_job: load_into_sns
  spark_job_arguments:
  - "{dag_name}"
  - "reverse_listings_report"
  - "{table_name}"
  - "{{ get_date_param(dag_run, ds, 'load_start_date') }}"
  - "{{ get_date_param(dag_run, ds, 'load_end_date') }}"
  tables_customization:
    rent_listing_traffic:
      extra_spark_job_arguments:
      - NEW_LISTING_TRAFFIC
      - sns_topic_arn_reports
    rent_listing_visit_scheduled:
      extra_spark_job_arguments:
      - NEW_LISTING_VISIT_SCHEDULED
      - sns_topic_arn_reports
    rent_listing_offer_sent:
      extra_spark_job_arguments:
      - NEW_LISTING_OFFER_SENT
      - sns_topic_arn_reports
cluster:
  type: custom_cluster
  custom_configurations:
    autotermination_minutes: 20
    driver_node_type_id: m5a.xlarge
    node_type_id: m5a.xlarge
    num_workers: 3
    spark_version: 12.2.x-scala2.12
    aws_attributes:
      first_on_demand: 1
      spot_bid_price_percent: 100
      zone_id: us-east-1d
      availability: SPOT_WITH_FALLBACK
      ebs_volume_size: 200
      instance_profile_arn: "{{ var.value.instance_profile_secret_arn_reverse_listings_report }}"
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
  databricks_conn_id: databricks_new
