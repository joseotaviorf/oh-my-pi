---
dag:
  name: enrich_sale_listings_lenses
  schedule_start_date: 2022, 6, 20
  owner: Data ForSale
workflow:
  type: query_delta
  layer: enrich
  inner_dependencies:
    sellability_lens:
    - segmentation_bins
    listing_lenses:
    - availability_lens
    - demand_lens
    - pricing_lens
    - sellability_lens
    - segmentation_bins
cluster:
  type: databricks_12_2_med_memory_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
