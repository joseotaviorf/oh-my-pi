  is_last_tier:
    description: > 
      This column represents a Boolean flag that indicates whether the tier referring to the observed row is the current tier or a tier that is part of a listing's history.
  ts_tier_started:
    description: 
            Date of tier change. It is linked to some change in the scores that make up the listing quality score. It will change to a new status and create a new row when any of these scores change the listing tier.
  ts_tier_ended:
    description: > 
      Termination date of the tier. It is strictly linked to the beginning of the next tier.