database_name: datalake_sale_listings_lenses
table_name: listing_quality_lens
description: 'An enrich table that has the purpose of creating ranking tiers of ForSale listings, where we could understand how complete the listing information is on our platform. With this, we will abstract a lot of the analysis.
  Given some information on amenities and features that we think are relevant to a house sales journey, we create a score that classifies how complete a listing is to be listed. With this, each change in these characteristics and information can lead to a change in tier, creating a new row with a new tier.'
domain: For Sale
owner: data-for-sale@quintoandar.com.br
columns:
  id_house:
    lineage:
      - datalake_ebdb_clean.info_amenities_aud.id_house
      - datalake_ebdb_clean.info_condo_amenities_aud.id_house
      - datalake_ebdb_clean.house_aud.id_house
      - datalake_booking.booking.id_house
      - datalake_ebdb_listing.house_entrance_history.id_house
      - datalake_ebdb_house.maintenance_condition_history.id_house
    description: > 
       Column referring to the house ID. Can be joined with dw_house.dim_house and all other sale modeling tables.
  tier:
    description: > 
      We use the entire history of changes to a property's features and condominiums to create a tier that tracks the level of completeness of a house's information.
      We believe that a house with complete information performs much better on the platform. With this in mind, we used several variables and created a completeness score.
    categories: 
      Q5: Represents listings with full information on amenities and features. There is no penalty, i.e. all the information we considered was filled in.
      Q4: Represents listings with almost complete information on amenities and features. There is a small penalty, i.e. some of the amenities or features that are not so critical have not been filled.
        To be placed into this tier you must have a score between -1 and -500.
      Q3: Represents listings with incomplete information on amenities and features. There is a medium penalty, i.e. some of the amenities or features have not been filled.
        To be placed into this tier you must have a score between -501 and -1500.
      Q2: Represents listings with very incomplete information on amenities and features. There is a large penalty, i.e. most of the amenities or features have not been filled.
        To be placed into this tier you must have a score less than -1500.
      Q1: Represents listings with no information on amenities and features. Represents listings that are missing one or more critical information. To be considered in this tier, we have a problem identifying its sale price and/or its condo value and/or its number of bedrooms and/or its total area.
  tier_name:
    description: > 
      Just a full name of the listing quality tier.
    categories: 
      Great Accuracy: It represents the Q5 tier. Listings with full information on amenities and features.
      Good Accuracy: It represents the Q4 tier. Listings with almost complete information on amenities and features.
      Moderate Accuracy: It represents the Q3 tier. Listings with incomplete information on amenities and features.
      Low Accuracy: It represents the Q2 tier. Listings with very incomplete information on amenities and features.
      Critical Accuracy: It represents the Q1 tier. Listings with critical information missing, like sale price, condo, bedrooms and total area.
  tier_disclaimer:
    description: > 
      Column describing the tier for that row. In other words, it describes why that tier was classified in that house over a certain period of time.
  tier_drill_down:
    description: > 
      Drill down of the tier_disclaimer column, where we can see the reason why the listing is in that tier.
  listing_quality_score:
    description: > 
      Score that represents the quality of the listing. It is calculated as the sum of all the other scores and their respective completenesses.
  component_completeness:
    description: > 
      Percentage of completeness of all variables taken into account to calculate the listing quality score. A variable is considered complete when it is not null.
  price_score:
    description: > 
      Score based on the sale price information. If the information on whether there is such an amenity is not filled in, we deduct points from the score.
    categories:
      "0": Existing information. We know the sale price and it is greater than R$120K and less than R$20M.
      "-10000": Either we don't know the sale price or it's outside QuintoAndar's standards.
  bedrooms_score:
    description: > 
      Score based on the number of bedrooms. If the information on whether there is such an amenity is not filled in, we deduct points from the score.
    categories:
      "0": Existing information. We know the number of bedrooms.
      "-10000": No information, we don't know how many bedrooms there are or it is marked that there are no bedrooms.
  bathrooms_score:
    description: > 
      Score based on the number of bathrooms. If the information on whether there is such an amenity is not filled in, we deduct points from the score.
    categories:
      "0": Existing information. We know the number of bathrooms.
      "-10000": No information, we don't know how many bathrooms there are or it is marked that there are no bathrooms.
  total_area_score:
    description: > 
      Score based on the total area information. If the information on whether there is such an amenity is not filled in, we deduct points from the score. 
    categories:
      "0": Existing information. We know th total area of the house and it is greater than 5 and less than 1000.
      "-10000": Either we don't know the total area or it's outside QuintoAndar's standards.
  floor_score:
    description: > 
      Score based on the floor information. If the information on whether there is such an amenity is not filled in, we deduct points from the score.
    categories: 
      "0": Existing information. We know where the house is.
      "-100": No information, we don't know the floor of the house. We only deduct points if the house type is "Apartamento" or "StudioOrKitchenette".
  condo_score:
    description: > 
      Score based on the condo price value information. If the information on whether there is such an amenity is not filled in, we deduct points from the score.
    categories:
      "0": Existing information. We know the condo price value and it is greater than 10.
      "-10000": If the condo price value of the house is less than or equal to 10 or null. But it only affects houses whose type is 'Apartamento', 'CasaCondominio' or 'StudioOuKitchenette'.
  house_condition_score:
    description: > 
      Score based on the house condition. If the information on whether there is such an amenity is not filled in, we deduct points from the score.
    categories: 
      "0": Existing information. We know the house condition.
      "-200": No information, we don't know the house condition. 
  iptu_score:
    description: >
      Score based on the IPTU value information. If the information on whether there is such an amenity is not filled in, we deduct points from the score.
    categories:
      "0": Existing information. We know the IPTU value and it seems to make sense.
      "-50": If the IPTU value of the house is less than or equal to 0 or null. But it only affects houses whose IPTU type is 'NaoInformado' or 'Normal'.
  parking_slots_score:
    description: > 
      Score based on the number of parking slots. If the information on whether there is such an amenity is not filled in, we deduct points from the score.
    categories:
      "0": Existing information. We know the number of parking slots.
      "-400": No information, we don't know how many parking slots there are.
  type_score:
    description: > 
      Score based on the house type. If the information on whether there is such an amenity is not filled in, we deduct points from the score.
    categories:
      "0": Existing information. We know the type of house.
      "-300": No information, we don't know what kind of house it is.
  doorman_type_score:
    description: >
      Score based on the doorman type. If the information on whether there is such an amenity is not filled in, we deduct points from the score.
    categories:
      "0": Existing information. The house may or may not have a doorman.
      "-200": No information, we don't know if there's a doorman or not.
  key_location_score:
    description: >
      Score based on the house key location. If the information on whether there is such an amenity is not filled in, we deduct points from the score.
    categories:
      "0": The keys to the house have a definite location.
      "-400": We don't know where the keys to the house are or it's pointed out that there is no location.
  listing_accuracy_score:
    description: > 
      Score based on the listing accuracy. If the house has received a review of a visit where the visitor pointed out that the house information was inaccurate.
    categories:
      "0": The listing didn't receive a visit, or didn't receive a review or only reviews noting that the information was correct.
      "-1000": The house has received a review of a visit where the visitor pointed out that the house information was inaccurate.
  penthouse_score:
    description: > 
      Score based if house is penthouse. If the information on whether there is such an amenity is not filled in, we deduct points from the score.
    categories:
      "0": Existing information. The house may or may not be a penthouse.
      "-50": No information, we don't know if it's a penthouse or not.
