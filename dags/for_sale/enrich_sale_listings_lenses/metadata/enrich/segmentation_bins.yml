database_name: datalake_sale_listings_lenses
table_name: segmentation_bins
description: 'Static table with price bins, price per square meter and total ara to help you build your analysis. It works as a reference table, and can be joined with the type of attribute, doing a between on the numbers.' 
domain: For Sale
owner: data-for-sale@quintoandar.com.br
columns:
  id_bin:
    description: Identifier number of which attribute type that bin belongs to.
    categories:
      "1": Price
      "2": Price per square meter
      "3": Total area
  bin:
    description: Column with the descriptive name of which attribute the bin belongs to.
    categories:
      price: Bins related to the published price attribute of the listing.
      price_m2: Bins related to the published price per square meter attribute of the listing.
      total_area: Bins related to the published total area attribute of the listing.
  tag:
    description: Descriptive tag for each bin. That is, if the listing is 150k it will have a tag for the price bin `R$ 120k-300k`.
  order:
    description: Bin order within the bin type for the attribute. It is a numeric used to sort the bins, starting with `1` the bin with the smallest value of the attribute and going up to 11 in some bin types.
  lower_band: 
    description: Value of the lower band for an attribute value to be considered from that bin. That is, if it were a case when, it would be the `>=`.
  upper_band: 
    description: Upper band value for an attribute value to be considered from that bin. That is, if it were a case when, it would be the `<`.