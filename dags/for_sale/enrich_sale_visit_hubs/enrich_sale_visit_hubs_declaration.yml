---
dag:
  name: enrich_sale_visit_hubs
  schedule_start_date: 2022, 8, 26
  owner: Data ForSale
  documentation:
    dag_purpose: Creates the enriched tables for the context `sale_visit_hubs` enriched from Teams, EBDB and gsheets.
      The intention is to follow the business units that the agent is part of at the time of the visit, considering teams as the main source.
workflow:
  type: query_delta
  layer: enrich
cluster:
  type: databricks_12_2_med_general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
