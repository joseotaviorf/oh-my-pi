database_name: datalake_sale_visit_hubs
table_name: sale_visit_hubs
description: This enrich was created with the aim of providing us with a view of which
  hub the broker was associated with at the time of a visit. It uses teams data as
  its main source, followed by work contract data and finally by business unit region
  data.
domain: For Sale
owner: ae-for-sale@quintoandar.com.br
columns:
  id_booking:
    lineage:
    - datalake_booking.booking.id
    description: An unique booking identifier. Currently, it is a PK for this table.
  id_business_unit:
    lineage:
    - datalake_gsheets_clean.sale_business_unit_standardization.id_business_unit_teams
    - datalake_hub_services_clean.member_profile.id_business_unit
    - datalake_hub_services_clean.business_unit.id
    description: A business unit identifier (only for sale hubs) has a direct relationship
      with teams, since a from/to of all sources was made for this standardization.
  business_unit:
    lineage:
    - datalake_gsheets_clean.sale_business_unit_standardization.business_unit_teams
    - datalake_hub_services_clean.member_profile.business_unit
    - datalake_hub_services_clean.business_unit.hub_name
    description: Business unit name, already standardized with Teams data.
  id_user_agent:
    lineage:
    - datalake_booking.booking.id_user_sale_agent
    description: An identifier for the brokers.
  id_user_en:
    lineage:
    - datalake_hub_services_clean.users.id_external
    description: An identifier for trading executives.
  ts_visit_intent:
    lineage:
    - datalake_booking.booking.ts_created
    description: Date when the booking was generated.
