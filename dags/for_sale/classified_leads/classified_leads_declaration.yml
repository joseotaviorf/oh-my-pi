dag:
  name: classified_leads
  schedule_start_date: 2019, 5, 31
  schedule_interval: 0 3 * * *
  owner: Data ForSale
  documentation:
    dag_purpose: ClassifiedsResponder is a Database we use to store our contract history we have when dealing with Classifieds Leads
      (A lead which comes from one of our Classifieds like Criteo). This DAG ingests this database into our raw flow (until clean).
workflow:
  type: database_pull
  layer: raw
  database_type: postgres
  lineage_product_database_name: classifiedsresponder
  tables_customization:
    lead_contact: {}
    lead_reply_email: {}
    lead_reply_whatsapp: {}
    lead_reply: {}
cluster:
  type: databricks_12_2_med_general_cluster
