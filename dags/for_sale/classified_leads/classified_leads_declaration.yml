dag:
  name: classified_leads
  schedule_start_date: 2019, 5, 31
  schedule_interval: 10 21 * * *
  owner: Data ForSale
  documentation:
    dag_purpose: ClassifiedsResponder is a Database we use to store our contract history we have when dealing with Classifieds Leads (A lead which comes from one of our Classifieds like Criteo). This DAG ingests this database into our raw flow (until clean).
workflow:
  type: cdc
  layer: raw
  database_type: postgres
  custom_schema: classified_leads
  source_database: classifiedsresponder
  source_schema: public
  dbutils_secret_key: CLASSIFIEDSRESPONDER_DB
  tables_customization:
    lead_contact:
      raw_primary_keys: [id]
      clean_table_name: lead_contact
      clean_primary_keys: [id]
    lead_reply_email:
      raw_primary_keys: [pk_id]
      clean_table_name: lead_reply_email
      clean_primary_keys: [id_pk]
    lead_reply_whatsapp:
      raw_primary_keys: [pk_id]
      clean_table_name: lead_reply_whatsapp
      clean_primary_keys: [id_pk]
    lead_reply:
      raw_primary_keys: [id]
      clean_table_name: lead_reply
      clean_primary_keys: [id]
