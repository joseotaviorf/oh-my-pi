database_name: datalake_ebdb_clean
table_name: visit_business_model
owner: vitor.musachio@quintoandar.com.br
domain: For Sale
description: >
  Tracks the business model associated with each visit in the Marketplace QuintoAndar ecosystem.
  Each record represents a visit's business model, indicating whether the supply or demand is 
  from a 1P or 3P partner. Supports analytics on visit business model distribution and partner 
  performance.
columns:
  id:
    description: Unique identifier of the visit business model entry
    lineage:
      - datalake_ebdb_raw.VisitBusinessModel.id
  id_visit:
    description: Unique identifier for the visit (visit_id)
    lineage:
      - datalake_ebdb_raw.VisitBusinessModel.visit_id
  business_model:
    description: Business model associated with the visit, refering if the supply or demand is 1P or 3P.
    lineage:
      - datalake_ebdb_raw.VisitBusinessModel.business_model
  ts_created:
    description: Timestamp when the entry was created (created_at)
    lineage:
      - datalake_ebdb_raw.VisitBusinessModel.created_at
  ts_updated:
    description: Timestamp when the entry was last updated (updated_at)
    lineage:
      - datalake_ebdb_raw.VisitBusinessModel.updated_at
  op_cdc:
    lineage:
      - datalake_ebdb_raw.VisitBusinessModel.op_cdc
    description: CDC operation type captured by Debezium change-data-capture stream.
    categories:
      r: Read/snapshot - initial load of existing records.
      c: Create - new record inserted.
      u: Update - existing record modified.
      d: Delete - record removed.
  ts_cdc_transaction:
    lineage:
      - datalake_ebdb_raw.VisitBusinessModel.ts_cdc_transaction
    description: Wall-clock timestamp when the CDC connector captured this change event (millisecond precision).
  ts_database_transaction:
    lineage:
      - datalake_ebdb_raw.VisitBusinessModel.ts_database_transaction
    description: Timestamp of the originating database transaction in the source application before CDC propagation.