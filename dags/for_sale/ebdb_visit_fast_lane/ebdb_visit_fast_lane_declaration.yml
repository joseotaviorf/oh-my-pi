dag:
  name: ebdb_visit_fast_lane
  schedule_start_date: 2024,01,01
  schedule_interval: 0,30 * * * *
  owner: Data ForSale
  documentation:
    dag_purpose: |
      DAG containing tables from Visits context that are running every 30 minutes.
workflow:
  type: cdc
  layer: raw
  database_type: mysql
  dbutils_secret_key: EBDB_DB
  source_database: ebdb
  source_schema: ebdb
  custom_schema: ebdb
  execution_timeout_hours: 0.5
  tables_customization:
    Visita:
      clean_table_name: visit
      clean_primary_keys: [id]
      raw_z_order_by: [house_id, ts_database_transaction]
      clean_z_order_by: [id_house, business_context]
    VisitStatusLog:
      clean_table_name: visit_status_log
      clean_primary_keys: [id_visit_status_log]
      raw_z_order_by: [visit_id, ts_database_transaction]
      clean_z_order_by: [id_visit, event_type]
cluster:
  type: databricks_16_4_rfleet_instance_cluster
  databricks_conn_id: databricks_new
