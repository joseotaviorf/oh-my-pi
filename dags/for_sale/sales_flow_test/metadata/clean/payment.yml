database_name: datalake_sales_flow_test_clean
table_name: payment
domain: ForSale
owner: herivelto.junior@quintoandar.com.br
description: Table that contains information about the payment payment.
columns:
  id:
    description: Unique ID for this payment on this table.
    lineage:
      - datalake_sales_flow_test_raw.payment.id
  id_sales_flow:
    description: SalesFlow payment ID. Joins with datalake_sales_flow_test_clean.sales_flow.id
    lineage:
      - datalake_sales_flow_test_raw.payment.sales_flow_id
  payment_method:
    description: Payment method (Cash, financed, etc)
    lineage:
      - datalake_sales_flow_test_raw.payment.payment_method
  payment_model:
    description: Payment model used in the purchase of the property (CCV_ASSISTANCE, INSTANT_MORTGAGE, etc)
    lineage:
      - datalake_sales_flow_test_raw.payment.payment_model
  down_payment_value:
    description: Amount paid by the buyer to signal the continuation of the purchase.
    lineage:
      - datalake_sales_flow_test_raw.payment.down_payment_value
  entry_amount:
    description: Value paid by the buyer on the beginning of the contract.
    lineage:
      - datalake_sales_flow_test_raw.payment.entry_amount
  fgts_value:
    description: FGTS value used in the purchase.
    lineage:
      - datalake_sales_flow_test_raw.payment.fgts_value
  status:
    description: Status used to track the buyer's payment.
    lineage:
      - datalake_sales_flow_test_raw.payment.status
  ts_created:
    description: Timestamp that indicates when this entry was created.
    lineage:
      - datalake_sales_flow_test_raw.payment.created_at
  ts_updated:
    description: Timestamp that indicates when this entry was last updated.
    lineage:
      - datalake_sales_flow_test_raw.payment.updated_at
  year:
    description: Year partition value.
    lineage:
      - datalake_sales_flow_test_raw.payment.year
  month:
    description: Month partition value.
    lineage:
      - datalake_sales_flow_test_raw.payment.month
  day:
    description: Day partition value.
    lineage:
      - datalake_sales_flow_test_raw.payment.day

