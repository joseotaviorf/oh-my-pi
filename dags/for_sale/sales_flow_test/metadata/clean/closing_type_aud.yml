---
database_name: datalake_sales_flow_test_clean
table_name: closing_type_aud
domain: ForSale
owner: herivelto.junior@quintoandar.com.br
description: Closing type Aud table.
columns:
  id:
    description: Closing type ID
    lineage:
      - datalake_sales_flow_test_raw.closing_type_aud.id
  id_label:
    description: Label of Closing process
    lineage:
      - datalake_sales_flow_test_raw.closing_type_aud.label_id
  id_parent:
    description: ID to match and identify the macro and micro status in the Closing process.
    lineage:
      - datalake_sales_flow_test_raw.closing_type_aud.parent_id
  rev:
    description: Unique id for this modification and can be joined with table rev_info to get more details.
    lineage:
      - datalake_sales_flow_test_raw.closing_type_aud.rev
  rev_type:
    description: Modification type.
    categories:
      "0" : Create
      "1" : Update
      "2" : Delete
    lineage:
      - datalake_sales_flow_test_raw.closing_type_aud.revtype
  rev_end:
    description: ID of the revision that replaced the current entry.
    lineage:
      - datalake_sales_flow_test_raw.closing_type_aud.revend
  key:
    description: Which offer model (CCV Assistance, Pampas etc), type of financing (External or Internal) and payment method (Financed or Cash).
    lineage:
      - datalake_sales_flow_test_raw.closing_type_aud.key
  mod_id_label:
    description:  Flag indicating if the id_label phone has changed.
    lineage:
      - datalake_sales_flow_test_raw.closing_type_aud.label_id_mod
  mod_id_parent:
    description:  Flag indicating if the id_parent phone has changed.
    lineage:
      - datalake_sales_flow_test_raw.closing_type_aud.parent_id_mod
  mod_key:
    description:  Flag indicating if the key phone has changed.
    lineage:
      - datalake_sales_flow_test_raw.closing_type_aud.key_mod
  ts_created:
    description: Timestamp that indicates when this entry was created.
    lineage:
      - datalake_sales_flow_test_raw.closing_type_aud.created_at
  ts_updated:
    description: Timestamp that indicates when this entry was last updated.
    lineage:
      - datalake_sales_flow_test_raw.closing_type_aud.updated_at
  year:
    description: Year partition value.
    lineage:
      - datalake_sales_flow_test_raw.closing_type_aud.year
  month:
    description: Month partition value.
    lineage:
      - datalake_sales_flow_test_raw.closing_type_aud.month
  day:
    description: Day partition value.
    lineage:
      - datalake_sales_flow_test_raw.closing_type_aud.day
