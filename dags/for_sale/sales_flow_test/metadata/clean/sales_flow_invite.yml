domain: ForSale
owner: herivelto.junior@quintoandar.com.br
description: Table with the invites statuses.
columns:
  id:
    description: Unique ID for the invite.
    lineage:
    - datalake_sales_flow_test_raw.sales_flow_invite.id
  id_sales_flow:
    description: SalesFlow offer ID. Joins with datalake_sales_flow_test_clean.sales_flow.id
    lineage:
      - datalake_sales_flow_test_raw.sales_flow_invite.sales_flow_id
  id_inviter:
    description: Inviter User ID on Sales Flow databases.
    lineage:
      - datalake_sales_flow_test_raw.sales_flow_invite.inviter_id
  id_invitee:
    description: User ID on Sales Flow databases after accepting the invite. This user id_external can be found on table sales_flow_test_clean.users
    lineage:
      - datalake_sales_flow_test_raw.sales_flow_invite.invitee_id
  id_folder:
    description: Buyer Docx Folder ID on Docx tables.
    lineage:
      - datalake_sales_flow_test_raw.sales_flow_invite.folder_id
  type:
    description: User type. BUYER or SELLER
    lineage:
      - datalake_sales_flow_test_raw.sales_flow_invite.type
  name:
    description: User name.
    lineage:
      - datalake_sales_flow_test_raw.sales_flow_invite.name
  email:
    description: User e-mail.
    lineage:
      - datalake_sales_flow_test_raw.sales_flow_invite.email
  status:
    description: Invite status.
    lineage:
      - datalake_sales_flow_test_raw.sales_flow_invite.status
  ts_created:
    description: Timestamp that indicates when this entry was created.
    lineage:
      - datalake_sales_flow_test_raw.sales_flow_invite.created_at
  ts_updated:
    description: Timestamp that indicates when this entry was last updated.
    lineage:
      - datalake_sales_flow_test_raw.sales_flow_invite.updated_at
  year:
    description: Year partition value.
    lineage:
      - datalake_sales_flow_test_raw.sales_flow_invite.year
  month:
    description: Month partition value.
    lineage:
      - datalake_sales_flow_test_raw.sales_flow_invite.month
  day:
    description: Day partition value.
    lineage:
      - datalake_sales_flow_test_raw.sales_flow_invite.day
