---
database_name: datalake_sales_flow_test_clean
table_name: sales_flow_users_aud
domain: ForSale
owner: herivelto.junior@quintoandar.com.br
description: Aud table that relates the users and the offers that they are participating
columns:
  id:
    description: Unique ID for this entry on this table.
    lineage:
      - datalake_sales_flow_test_raw.sales_flow_users_aud.id
