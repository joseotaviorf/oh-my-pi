      - datalake_sales_flow_test_raw.sales_flow_invite_aud.invitee_id
  id_folder:
    description: Buyer Docx Folder ID on Docx tables.
    lineage:
      - datalake_sales_flow_test_raw.sales_flow_invite_aud.folder_id
  rev:
    description: Unique id for this modification and can be joined with table rev_info to get more details.
    lineage:
      - datalake_sales_flow_test_raw.sales_flow_invite_aud.rev
  rev_type:
    description: Modification type.
    categories:
      "0" : Create
      "1" : Update
      "2" : Delete
    lineage:
      - datalake_sales_flow_test_raw.sales_flow_invite_aud.revtype
  rev_end:
    description: ID of the revision that replaced the current entry.
    lineage:
      - datalake_sales_flow_test_raw.sales_flow_invite_aud.revend
  type:
