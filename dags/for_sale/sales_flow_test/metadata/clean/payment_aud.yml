database_name: datalake_sales_flow_test_clean
table_name: payment_aud
domain: ForSale
owner: herivelto.junior@quintoandar.com.br
description: Aud table that contains information about the offer payment.
columns:
  id:
    description: Unique ID for this payment on this table.
    lineage:
      - datalake_sales_flow_test_raw.payment_aud.id
  id_sales_flow:
    description: SalesFlow payment ID. Joins with datalake_sales_flow_test_clean.sales_flow.id
    lineage:
      - datalake_sales_flow_test_raw.payment_aud.sales_flow_id
  rev:
    description: Unique id for this modification and can be joined with table rev_info to get more details.
    lineage:
      - datalake_sales_flow_test_raw.payment_aud.rev
  rev_type:
    description: Modification type.
    categories:
      "0" : Create
      "1" : Update
      "2" : Delete
    lineage:
      - datalake_sales_flow_test_raw.payment_aud.revtype
  rev_end:
    description: ID of the revision that replaced the current entry.
    lineage:
      - datalake_sales_flow_test_raw.payment_aud.revend
  payment_method:
    description: Payment method (Cash, financed, etc)
    lineage:
      - datalake_sales_flow_test_raw.payment_aud.payment_method
  payment_model:
    description: Payment model used in the purchase of the property (CCV_ASSISTANCE, INSTANT_MORTGAGE, etc)
    lineage:
      - datalake_sales_flow_test_raw.payment_aud.payment_model
  down_payment_value:
    description: Amount paid by the buyer to signal the continuation of the purchase.
    lineage:
      - datalake_sales_flow_test_raw.payment_aud.down_payment_value
  entry_amount:
    description: Value paid by the buyer on the beginning of the contract.
    lineage:
      - datalake_sales_flow_test_raw.payment_aud.entry_amount
  fgts_value:
    description: FGTS value used in the purchase.
    lineage:
      - datalake_sales_flow_test_raw.payment_aud.fgts_value
  status:
    description: Status used to track the buyer's payment.
    lineage:
      - datalake_sales_flow_test_raw.payment_aud.status
  mod_id_sales_flow:
    description: Flag indicating if the id_sales_flow has changed.
    lineage:
      - datalake_sales_flow_test_raw.payment_aud.sales_flow_id_mod
  mod_payment_method:
    description: Flag indicating if the payment_method has changed.
    lineage:
      - datalake_sales_flow_test_raw.payment_aud.payment_method_mod
  mod_payment_model:
    description: Flag indicating if the payment_model has changed.
    lineage:
      - datalake_sales_flow_test_raw.payment_aud.payment_model_mod
  mod_down_payment_value:
    description: Flag indicating if the down_payment_value has changed.
    lineage:
      - datalake_sales_flow_test_raw.payment_aud.down_payment_value_mod
  mod_entry_amount:
    description: Flag indicating if the entry_amount has changed.
    lineage:
      - datalake_sales_flow_test_raw.payment_aud.entry_amount_mod
  mod_fgts_value:
    description: Flag indicating if the fgts_value has changed.
    lineage:
      - datalake_sales_flow_test_raw.payment_aud.fgts_value_mod
  mod_status:
    description: Flag indicating if the status has changed.
    lineage:
      - datalake_sales_flow_test_raw.payment_aud.status_mod
  ts_created:
    lineage:
      - datalake_sales_flow_test_raw.payment_aud.created_at
  ts_updated:
    lineage:
      - datalake_sales_flow_test_raw.payment_aud.updated_at
  year:
    lineage:
      - datalake_sales_flow_test_raw.payment_aud.year
  month:
    lineage:
      - datalake_sales_flow_test_raw.payment_aud.month
  day:
    lineage:
      - datalake_sales_flow_test_raw.payment_aud.day
