---
database_name: datalake_sales_flow_test_clean
table_name: seller_documentation
description: Table that contains the information about the seller documentation process.
domain: ForSale
owner: herivelto.junior@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_sales_flow_test_raw.seller_documentation.id
    description: Document unique ID.
  id_house:
    lineage:
      - datalake_sales_flow_test_raw.seller_documentation.house_id
    description: House ID on SalesFlow tables (datalake_sales_flow_test_clean.house).
  ts_started:
    lineage:
      - datalake_sales_flow_test_raw.seller_documentation.started_at
    description: Timestamp related to the first document(s) sent by the seller.
  ts_submitted:
    lineage:
      - datalake_sales_flow_test_raw.seller_documentation.submitted_at
    description: Timestamp related to the documentation process end, when the seller submitted the documents.
  ts_created:
    lineage:
      - datalake_sales_flow_test_raw.seller_documentation.created_at
    description: Timestamp when this event of this row happened.
  ts_updated:
    lineage:
      - datalake_sales_flow_test_raw.seller_documentation.updated_at
    description: Timestamp when this event of this row was updated.
  year:
    lineage:
      - datalake_sales_flow_test_raw.seller_documentation.year
    description: Year partition value.
  month:
    lineage:
      - datalake_sales_flow_test_raw.seller_documentation.month
    description: Month partition value.
  day:
    lineage:
      - datalake_sales_flow_test_raw.seller_documentation.day
    description: Day partition value.
