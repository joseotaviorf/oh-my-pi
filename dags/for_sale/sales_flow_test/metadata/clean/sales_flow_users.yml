    lineage:
      - datalake_sales_flow_test_raw.sales_flow_users.is_original_user
  ts_created:
    description: Timestamp that indicates when this entry was created.
    lineage:
      - datalake_sales_flow_test_raw.sales_flow_users.created_at
  ts_updated:
    description: Timestamp that indicates when this entry was last updated.
    lineage:
      - datalake_sales_flow_test_raw.sales_flow_users.updated_at
