      - datalake_sales_flow_test_raw.ccv_edition_reason_aud.created_at
  ts_updated:
    description: Timestamp that indicates when this entry was last updated.
    lineage:
      - datalake_sales_flow_test_raw.ccv_edition_reason_aud.updated_at
  year:
    description: Year partition value.
    lineage:
      - datalake_sales_flow_test_raw.ccv_edition_reason_aud.year
  month:
