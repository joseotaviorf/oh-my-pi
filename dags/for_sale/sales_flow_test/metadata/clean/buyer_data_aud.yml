---
database_name: datalake_sales_flow_test_clean
table_name: buyer_data_aud
domain: ForSale
owner: herivelto.junior@quintoandar.com.br
description: Aud table with the buyer information that will be used on the CCV.
columns:
  id_buyer:
    description: Buyer user ID on SalesFlow tables.
    lineage:
      - datalake_sales_flow_test_raw.buyer_data_aud.id
  id_sales_flow:
    description: SalesFlow offer ID. Joins with datalake_sales_flow_test_clean.sales_flow.id
    lineage:
      - datalake_sales_flow_test_raw.buyer_data_aud.sales_flow_id
  id_docx_folder:
    description: Buyer Docx Folder ID on Docx tables.
    lineage:
      - datalake_sales_flow_test_raw.buyer_data_aud.docx_folder_id
  rev:
    description: Unique id for this modification and can be joined with table rev_info to get more details.
    lineage:
      - datalake_sales_flow_test_raw.buyer_data_aud.rev
  rev_type:
    description: Modification type.
    categories:
      "0" : Create
      "1" : Update
      "2" : Delete
    lineage:
      - datalake_sales_flow_test_raw.buyer_data_aud.revtype
  rev_end:
    description: ID of the revision that replaced the current entry.
    lineage:
      - datalake_sales_flow_test_raw.buyer_data_aud.revend
  name:
    description: User name
    lineage:
      - datalake_sales_flow_test_raw.buyer_data_aud.name
  email:
    description: User email
    lineage:
      - datalake_sales_flow_test_raw.buyer_data_aud.email
  holding_value:
    description: Indicates how much this buyer is participating on the offer value.
    lineage:
      - datalake_sales_flow_test_raw.buyer_data_aud.holding_value
  ccv_role:
    description: Indicates the user role on this CCV, on this case will be BUYER.
    lineage:
      - datalake_sales_flow_test_raw.buyer_data_aud.ccv_role
  signer_status:
    description: Indicate if this user is a CCV signer.
    lineage:
      - datalake_sales_flow_test_raw.buyer_data_aud.signer_status
  triage_status:
    description: This column is deprecated. Do not use.
    lineage:
      - datalake_sales_flow_test_raw.buyer_data_aud.triage_status
  is_investor:
    description: Indicates if this user is an investor or not.
    lineage:
      - datalake_sales_flow_test_raw.buyer_data_aud.investor
  mod_investor:
    description: Flag indicating if the column investor has changed.
    lineage:
      - datalake_sales_flow_test_raw.buyer_data_aud.investor_mod
  mod_id_sales_flow:
    description: Flag indicating if the column id_sales_flow has changed.
    lineage:
      - datalake_sales_flow_test_raw.buyer_data_aud.sales_flow_id_mod
  mod_triage_status:
    description: Flag indicating if the column triage_status has changed.
    lineage:
      - datalake_sales_flow_test_raw.buyer_data_aud.triage_status_mod
  mod_signer_status:
    description: Flag indicating if the column signer_status has changed.
    lineage:
      - datalake_sales_flow_test_raw.buyer_data_aud.signer_status_mod
  mod_ccv_role:
    description: Flag indicating if the column ccv_role has changed.
    lineage:
      - datalake_sales_flow_test_raw.buyer_data_aud.ccv_role_mod
  mod_id_docx_folder:
    description: Flag indicating if the column id_docx_folder has changed.
    lineage:
      - datalake_sales_flow_test_raw.buyer_data_aud.docx_folder_id_mod
  mod_name:
    description: Flag indicating if the column name has changed.
    lineage:
      - datalake_sales_flow_test_raw.buyer_data_aud.name_mod
  mod_email:
    description: Flag indicating if the column email has changed.
    lineage:
      - datalake_sales_flow_test_raw.buyer_data_aud.email_mod
  mod_holding_value:
    description: Flag indicating if the column holding_value has changed.
    lineage:
      - datalake_sales_flow_test_raw.buyer_data_aud.holding_value_mod
  ts_created:
    description: Timestamp that indicates when this entry was created.
    lineage:
      - datalake_sales_flow_test_raw.buyer_data_aud.created_at
  ts_updated:
    description: Timestamp that indicates when this entry was last updated.
    lineage:
      - datalake_sales_flow_test_raw.buyer_data_aud.updated_at
  year:
    description: Year partition value.
    lineage:
      - datalake_sales_flow_test_raw.buyer_data_aud.year
  month:
    description: Month partition value.
    lineage:
      - datalake_sales_flow_test_raw.buyer_data_aud.month
  day:
    description: Day partition value.
    lineage:
      - datalake_sales_flow_test_raw.buyer_data_aud.day
