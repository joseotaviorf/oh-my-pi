    description: Closing type ID on closing_type Tables
    lineage:
      - datalake_sales_flow_test_raw.status_order.closing_type_id
  id_status:
    description: ID macrostatus of Closing process on status Tables
    lineage:
      - datalake_sales_flow_test_raw.status_order.status_id
  ordering:
    description: Ordering of micro and macro status of Closing process, like 1st Offer Sent, 2nd Signature CCV, 3rd Down Payment and etc.
    lineage:
      - datalake_sales_flow_test_raw.status_order.ordering
  ts_created:
    description: Timestamp that indicates when this entry was created.
    lineage:
      - datalake_sales_flow_test_raw.status_order.created_at
  ts_updated:
    description: Timestamp that indicates when this entry was last updated.
    lineage:
      - datalake_sales_flow_test_raw.status_order.updated_at
  year:
    description: Year partition value.
    lineage:
      - datalake_sales_flow_test_raw.status_order.year
  month:
    description: Month partition value.
    lineage:
      - datalake_sales_flow_test_raw.status_order.month
  day:
    description: Day partition value.
    lineage:
      - datalake_sales_flow_test_raw.status_order.day
