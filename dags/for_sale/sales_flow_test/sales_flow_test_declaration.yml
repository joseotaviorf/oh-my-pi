dag:
  name: sales_flow_test
  schedule_start_date: 2021, 3, 2
  schedule_interval: 0 21 * * *
  owner: Data ForSale
  documentation:
    dag_purpose: |
      This DAG imports the tables from [Sales Flow](https://github.com/quintoandar/sales-flow), a service responsible for the management of ForSale's operations after receiving an offer.
workflow:
  type: cdc
  layer: raw
  database_type: postgres
  source_database: salesflow
  custom_schema: sales_flow_test
  dbutils_secret_key: SALESFLOW_DB
  tables_customization:
    address_data:
      clean_table_name: address_data
    address_data_aud:
      clean_table_name: address_data_aud
    brokerage:
      clean_table_name: brokerage
    brokerage_aud:
      clean_table_name: brokerage_aud
    buyer_data:
      clean_table_name: buyer_data
    buyer_data_aud:
      clean_table_name: buyer_data_aud
    bypass:
      clean_table_name: bypass
    bypass_aud:
      clean_table_name: bypass_aud
    card_noting:
      clean_table_name: card_noting
    card_noting_aud:
      clean_table_name: card_noting_aud
    cash_payment:
      clean_table_name: cash_payment
    cash_payment_aud:
      clean_table_name: cash_payment_aud
    ccv:
      clean_table_name: ccv
    ccv_aud:
      clean_table_name: ccv_aud
    ccv_clause:
      clean_table_name: ccv_clause
    ccv_edition_reason:
      clean_table_name: ccv_edition_reason
    ccv_edition_reason_aud:
      clean_table_name: ccv_edition_reason_aud
      raw_primary_keys: ["id"]
      clean_primary_keys: ["id"]
    ccv_termination:
