---
sns_topic_arn: arn:aws:sns:us-east-1:632540934959:prod-reports-business-events
database_name: reverse_ccv_price_report
tables:
  ccv_price_by_region:
    event_type: NEW_SALE_PRICE_REPORT_PUBLISHED

custom_cluster:
  autotermination_minutes: 20
  driver_node_type_id: m5a.large
  node_type_id: m5a.large
  num_workers: 2
  # autoscale:
  #     max_workers: 2
  #     min_workers: 1
  spark_version: 12.2.x-scala2.12
  aws_attributes:
      first_on_demand: 1
      spot_bid_price_percent: 100
      zone_id: us-east-1d
      availability: SPOT_WITH_FALLBACK
      ebs_volume_size: 200
      instance_profile_arn: "{{ var.value.instance_profile_secret_arn_reverse_listings_report }}"
