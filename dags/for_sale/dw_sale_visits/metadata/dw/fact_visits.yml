---
database_name: dw_sale
table_name: fact_visits
description: 'Every row in this fact table is a ForSale visit booking.'
domain: For Sale
owner: data-for-sale@quintoandar.com.br
columns:
  sk_booking:
    lineage:
    - datalake_sale_visit.sale_visit.id_booking
    description: ID of the booking.
  sk_sale_flow:
    lineage:
    - datalake_sale_visit.sale_visit.id_sale_flow
    description: ID of the sale flow. Is the concatenation of ID buyer and ID house.
  sk_house:
    lineage:
    - datalake_sale_visit.sale_visit.id_house
    description: ID of the house.
  sk_region:
    lineage:
    - datalake_sale_visit.sale_visit.id_region
    description: ID of the region where house is located.
  sk_business_unit:
    lineage:
    - datalake_sale_visit.sale_visit.id_business_unit
    description: ID of the business unit associated with the booking. Can be joined with datalake_hub_services_clean.business_unit.
  sk_company_supply:
    lineage:
    - datalake_sale_visit.sale_visit.sk_company_supply
    description: Surrogate Key of the company in Rede QuintoAndar associated with the house. Can be joined with dw_rede.dim_company.
  sk_company_demand:
    lineage:
    - datalake_sale_visit.sale_visit.sk_company_demand
    description: Surrogate Key of the company in Rede QuintoAndar associated with the agent. Can be joined with dw_rede.dim_company.
  sk_agent:
    lineage:
    - datalake_sale_visit.sale_visit.id_agent
    description: 'ID of the agent associated with the booking. Can be joined with dw_public.dim_agent.sk_agent or dw_public.dim_user.dados_agente_id'
  sk_user_agent:
    lineage:
    - datalake_sale_visit.sale_visit.id_user_agent
    description: 'ID of the agent''s user associated with the booking. Can be joined with dw_public.dim_agent.id_user or dw_public.dim_user.sk_user'
  sk_user_en:
    lineage:
    - datalake_sale_visit.sale_visit.id_user_en
    description: ID of the user of the trading executive.
  sk_fixed_agent:
    lineage:
    - datalake_sale_visit.sale_visit.id_sale_fixed_agent
    description: 'ID of the fixed agent associated with the buyer when the booking was created. Can be joined with dw_public.dim_agent.sk_agent or dw_public.dim_user.dados_agente_id'
  sk_buyer:
    lineage:
    - datalake_sale_visit.sale_visit.id_buyer
    description: ID user of the buyer that started the sale flow.
  sk_seller:
    lineage:
    - datalake_sale_visit.sale_visit.id_seller
    description: ID user of the listing owner.
  sk_user_creation:
    lineage:
    - datalake_sale_visit.sale_visit.id_user_creation
    description: ID of the user who created the booking.
  sk_user_cancelation:
    lineage:
    - datalake_sale_visit.sale_visit.id_user_cancelation
    description: ID of the user who canceled the booking.
  sk_secretariat_booking_creator:
    lineage:
    - datalake_hub_services.daily_secretariat_allocation.sk_secretariat_user_version
    description: Surrogate key of the secretariat who created the booking. Can be joined with dw_secretariat.dim_secretariat_user_version,
      on field sk_secretariat_user_version. This allows you to see information about the secretariat in the moment of the event, such as their team allocation.
  sk_secretariat_on_visit:
    lineage:
    - datalake_hub_services.daily_secretariat_allocation.sk_secretariat_user_version
    description: Surrogate key of the secretariat who was associated with the buyer on the visit date. If the visit has not happened yet, it will be the latest secretariat before
      the visit date. Can be joined with dw_secretariat.dim_secretariat_user_version, on field sk_secretariat_user_version.
      This allows you to see information about the secretariat in the moment of the event, such as their team allocation.
  sk_last_secretariat:
    lineage:
    - datalake_hub_services.daily_secretariat_allocation.sk_secretariat_user_version
    description: Surrogate key of the secretariat who was last associated with the buyer. Can be joined with dw_secretariat.dim_secretariat_user_version,
      on field sk_secretariat_user_version.
  sk_visit:
    lineage:
    - datalake_sale_visit.sale_visit.id_visit
    description: ID of the visit.
  sk_visit_code:
    lineage:
    - datalake_sale_visit.sale_visit.visit_code
    description: Code of the visit.
  sk_offer:
    lineage:
    - datalake_sale_visit.sale_visit.id_offer
    description: ID of the first offer associated with this booking.
  sk_agent_booking_review:
    lineage:
    - datalake_sale_visit.sale_visit.id_agent_booking_review
    description: ID of the visit review completed by the agent.
  sk_buyer_booking_review:
    lineage:
    - datalake_sale_visit.sale_visit.id_buyer_booking_review
    description: ID of the visit review completed by the buyer.
  sk_booking_created_date:
    lineage:
    - datalake_sale_visit.sale_visit.ts_booking_created
    description: Date key to be joined with dim_date. Key to identify date of booking.
      creation
  sk_visit_date:
    lineage:
    - datalake_sale_visit.sale_visit.ts_visit
    description: Date key to be joined with dim_date. Key to identify date of visit.
      completed
  sk_visit_canceled_date:
    lineage:
    - datalake_sale_visit.sale_visit.ts_visit_canceled
    description: Date key to be joined with dim_date. Key to identify date of visit.
      canceled
  sk_visit_completed_date:
    lineage:
    - datalake_sale_visit.sale_visit.ts_visit_completed
    description: Date key to be joined with dim_date. Key to identify date of visit
      completed.
  sk_visit_follow_up_date:
    lineage:
    - datalake_sale_visit.sale_visit.ts_visit_follow_up
    description: Date key to be joined with dim_date. Key to identify date of visit
      follow up.
  sk_agent_review_rating_date:
    lineage:
    - datalake_sale_visit.sale_visit.ts_agent_review_rating
    description: Date key to be joined with dim_date. Key to identify date of agent
      booking review.
  sk_buyer_review_rating_date:
    lineage:
    - datalake_sale_visit.sale_visit.ts_buyer_review_rating
    description: Date key to be joined with dim_date. Key to identify date of buyer
      booking review.
  sk_visit_checkin_date:
    lineage:
    - datalake_sale_visit.sale_visit.ts_visit_checkin
    description: Date key to be joined with dim_date. Key to identify the checkin date.
  hub_agent_region:
    lineage:
    - datalake_sale_visit.sale_visit.hub_agent_region
    description: Name of the contract of the agent associated with the booking, if the contract is from a hub.
  is_hub_flow:
    lineage:
    - datalake_sale_visit.sale_visit.is_hub_flow
    description: True if the visit is from an agent with HUB active workcontract
  is_house_rented:
    lineage:
    - datalake_sale_visit.sale_visit.is_house_rented
    description: True if the house booked had an active rental contract at 5A at the
      booking date
  is_virtual_visit:
    lineage:
    - datalake_sale_visit.sale_visit.is_virtual_visit
    description: True if the visit is a virtual visit.
  days_visit_cancelled_to_visit:
    lineage:
    - datalake_sale_visit.sale_visit.days_visit_cancelled_to_visit
    description: Days between the visit cancelled and the visit.
  days_visit_booked_to_visit:
    lineage:
    - datalake_sale_visit.sale_visit.days_visit_booked_to_visit
    description: Days between the visit booked and the visit.
  days_visit_booked_to_visit_cancelled:
    lineage:
    - datalake_sale_visit.sale_visit.days_visit_booked_to_visit_cancelled
    description: Days between the booking creation and the visit cancelled date
  days_visit_booked_to_visit_completed:
    lineage:
    - datalake_sale_visit.sale_visit.days_visit_booked_to_visit_completed
    description: Days between the booking creation and the visit completed date
  hours_booking_to_offer:
    lineage:
    - datalake_sale_visit.sale_visit.hours_booking_to_offer
    description: Hours between the booking created and the first offer.
  hours_visit_to_offer:
    lineage:
    - datalake_sale_visit.sale_visit.hours_visit_to_offer
    description: Hours between the visit completed and the first offer.
  ts_booking_created:
    lineage:
    - datalake_sale_visit.sale_visit.ts_booking_created
    description: Timestamp of the booking creation.
  ts_visit:
    lineage:
    - datalake_sale_visit.sale_visit.ts_visit
    description: Timestamp of when visit was scheduled for.
  ts_visit_canceled:
    lineage:
    - datalake_sale_visit.sale_visit.ts_visit_canceled
    description: Timestamp of the visit canceled.
  ts_visit_completed:
    lineage:
    - datalake_sale_visit.sale_visit.ts_visit_completed
    description: Timestamp of the visit completed.
  ts_visit_follow_up:
    lineage:
    - datalake_sale_visit.sale_visit..ts_visit_follow_up
    description: Timestamp of the visit follow up.
  ts_visit_checkin:
    lineage:
    - datalake_sale_visit.sale_visit.ts_visit_checkin
    description: Visit checkin timestamp
  ts_agent_review_rating:
    lineage:
    - datalake_sale_visit.sale_visit.ts_agent_review_rating
    description: 'Timestamp of the agent booking review.'
  ts_buyer_review_rating:
    lineage:
    - datalake_sale_visit.sale_visit.ts_buyer_review_rating
    description: Timestamp of the buyer booking review.
  ts_load:
    description: 'Timestamp of when the data was last loaded in this table.'
