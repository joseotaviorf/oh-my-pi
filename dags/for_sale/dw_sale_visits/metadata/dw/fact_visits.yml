database_name: dw_sale
table_name: fact_visits
description: Every row in this fact table is a ForSale visit booking.
domain: For Sale
owner: guilherme.rocha@quintoandar.com.br
columns:
  sk_booking:
    lineage:
    - datalake_sale_visit.sale_visit.id_booking
    description: Surrogate key of the For Sale visit booking in the transactional visit system. Joinable with dw_public.dim_booking.
  sk_sale_flow:
    lineage:
    - datalake_sale_visit.sale_visit.id_sale_flow
    description: ID of the sale flow. Is the concatenation of ID buyer and ID house.
  sk_house:
    lineage:
    - datalake_sale_visit.sale_visit.id_house
    description: Surrogate key of the property associated with the booking. Joinable with dw_house.dim_house for listing attributes.
  sk_region:
    lineage:
    - datalake_sale_visit.sale_visit.id_region
    description: ID of the region where house is located.
  sk_business_unit:
    lineage:
    - datalake_sale_visit.sale_visit.id_business_unit
    description: ID of the business unit associated with the booking. Can be joined with datalake_hub_services_clean.business_unit.
  sk_broker_supply:
    lineage:
    - datalake_sale_visit.sale_visit.sk_broker_supply
    description: Surrogate key of the supply-side broker when the business model implies 3P supply. Propagated from booking (visit_business_model).
  sk_broker_demand:
    lineage:
    - datalake_sale_visit.sale_visit.sk_broker_demand
    description: Surrogate key of the demand-side broker when the business model implies 3P demand or lead gen. Propagated from booking (visit_business_model).
  sk_agent:
    lineage:
    - datalake_sale_visit.sale_visit.id_agent
    description: ID of the agent associated with the booking. Can be joined with dw_public.dim_agent.sk_agent or dw_public.dim_user.dados_agente_id
  sk_user_agent:
    lineage:
    - datalake_sale_visit.sale_visit.id_user_agent
    description: ID of the agent's user associated with the booking. Can be joined with dw_public.dim_agent.id_user or dw_public.dim_user.sk_user
  sk_user_en:
    lineage:
    - datalake_sale_visit.sale_visit.id_user_en
    description: ID of the user of the trading executive.
  sk_fixed_agent:
    lineage:
    - datalake_sale_visit.sale_visit.id_sale_fixed_agent
    description: ID of the fixed agent associated with the buyer when the booking was created. Can be joined with dw_public.dim_agent.sk_agent or dw_public.dim_user.dados_agente_id
  sk_buyer:
    lineage:
    - datalake_sale_visit.sale_visit.id_buyer
    description: ID user of the buyer that started the sale flow.
  sk_seller:
    lineage:
    - datalake_sale_visit.sale_visit.id_seller
    description: ID user of the listing owner.
  sk_user_creation:
    lineage:
    - datalake_sale_visit.sale_visit.id_user_creation
    description: ID of the user who created the booking.
  sk_user_cancelation:
    lineage:
    - datalake_sale_visit.sale_visit.id_user_cancelation
    description: ID of the user who canceled the booking.
  sk_secretariat_booking_creator:
    lineage:
    - datalake_secretariat.daily_secretariat_allocation.id_secretariat_user_version
    description: Surrogate key of the secretariat who created the booking. Join with datalake_secretariat.secretariat_allocation_history on id_secretariat_user_version to retrieve team allocation at booking creation time.
  sk_secretariat_on_visit:
    lineage:
    - datalake_secretariat.daily_secretariat_allocation.id_secretariat_user_version
    description: Surrogate key of the secretariat who was associated with the buyer on the visit date. If the visit has not happened yet, it will be the latest secretariat before the visit date. Join with datalake_secretariat.secretariat_allocation_history on id_secretariat_user_version to retrieve team allocation at visit time.
  sk_last_secretariat:
    lineage:
    - datalake_secretariat.daily_secretariat_allocation.id_secretariat_user_version
    description: Surrogate key of the secretariat who was last associated with the buyer. Join with datalake_secretariat.secretariat_allocation_history on id_secretariat_user_version to retrieve the latest team allocation.
  sk_visit:
    lineage:
    - datalake_sale_visit.sale_visit.id_visit
    description: Surrogate key of the underlying visit entity in the visit platform, when a visit record exists for the booking.
  sk_visit_code:
    lineage:
    - datalake_sale_visit.sale_visit.visit_code
    description: Human-readable visit code assigned by the booking platform to identify the scheduled visit in operational tools.
  sk_offer:
    lineage:
    - datalake_sale_offer.sale_offer.id_offer
    description: ID of the first offer associated with this booking.
  sk_buyer_booking_review:
    lineage:
    - datalake_sale_visit.sale_visit.id_buyer_booking_review
    description: ID of the visit review completed by the buyer.
  sk_buyer_prospect_type:
    lineage:
    - datalake_buyer_prospect.buyer_prospect_type.id_buyer_prospect_type
    description: Surrogate key of the buyer prospect type. Can be joined with dw_sale.dim_buyer_prospect_type.
  sk_listing_price_segment:
    lineage:
    - dw_sale.dim_sale_price_segment.sk_listing_price_segment
    description: Surrogate key of the listing price segment. Can be joined with dw_sale.dim_sale_price_segment.
  sk_booking_created_date:
    lineage:
    - datalake_sale_visit.sale_visit.ts_booking_created
    description: Date key to be joined with dim_date. Key to identify date of booking. creation
  sk_visit_date:
    lineage:
    - datalake_sale_visit.sale_visit.ts_visit
    description: Date key to be joined with dim_date. Key to identify date of visit. completed
  sk_visit_canceled_date:
    lineage:
    - datalake_sale_visit.sale_visit.ts_visit_canceled
    description: Date key to be joined with dim_date. Key to identify date of visit. canceled
  sk_visit_completed_date:
    lineage:
    - datalake_sale_visit.sale_visit.ts_visit_completed
    description: Date key to be joined with dim_date. Key to identify date of visit completed.
  sk_visit_follow_up_date:
    lineage:
    - datalake_sale_visit.sale_visit.ts_visit_follow_up
    description: Date key to be joined with dim_date. Key to identify date of visit follow up.
  sk_buyer_review_rating_date:
    lineage:
    - datalake_sale_visit.sale_visit.ts_buyer_review_rating
    description: Date key to be joined with dim_date. Key to identify date of buyer
      booking review.
  hub_agent_region:
    lineage:
    - datalake_sale_visit.sale_visit.hub_agent_region
    description: Name of the contract of the agent associated with the booking, if the contract is from a hub.
  partner_3p_demand:
    lineage:
    - datalake_sale_visit.sale_visit.partner_3p_demand
    description: Name of the 3P demand partner associated with the booking.
  partner_3p_supply:
    lineage:
    - datalake_sale_visit.sale_visit.partner_3p_supply
    description: Name of the 3P supply partner associated with the booking.
  is_hub_flow:
    lineage:
    - datalake_sale_visit.sale_visit.is_hub_flow
    description: True if the visit is from an agent with HUB active workcontract
  is_house_rented:
    lineage:
    - datalake_sale_visit.sale_visit.is_house_rented
    description: True if the house booked had an active rental contract at 5A at the booking date
  sale_type:
    lineage:
    - datalake_sale_visit.sale_visit.sale_type
    description: Market type of the house on this sale visit. Passthrough from enrich sale_visit. PRIMARY, SECONDARY, or NULL when the house has no SALE listing sale model.
    categories:
      PRIMARY: New-build / primary market.
      SECONDARY: Resale / secondary market.
  is_3p_supply:
    lineage:
    - datalake_sale_visit.sale_visit.is_3p_supply
    description: Boolean flag indicating if the visit has a 3P supply partner. A 3P supply partner is a company that provides the property to the QuintoAndar platform.
  is_3p_demand:
    lineage:
    - datalake_sale_visit.sale_visit.is_3p_demand
    description: Boolean flag indicating if the visit has a 3P demand partner. A 3P demand partner is a company that provides the buyer to the QuintoAndar platform.
  is_3p_lead_gen:
    lineage:
    - datalake_sale_visit.sale_visit.is_3p_lead_gen
    description: Boolean flag indicating if the visit has a 3P lead generation partner. A 3P lead gen partner generates leads that are forwarded to the QuintoAndar platform.
  has_3p_access_control:
    lineage:
    - datalake_sale_visit.sale_visit.has_3p_access_control
    description: Boolean flag indicating if the visit has any 3P access control (supply, demand, or lead gen). True if any of the 3P flags are true.
  days_visit_cancelled_to_visit:
    lineage:
    - datalake_sale_visit.sale_visit.days_visit_cancelled_to_visit
    description: Elapsed calendar days between the originally scheduled visit date and the cancellation timestamp when the booking is canceled after scheduling.
  days_visit_booked_to_visit:
    lineage:
    - datalake_sale_visit.sale_visit.days_visit_booked_to_visit
    description: Elapsed calendar days between booking creation and the scheduled visit date, measuring lead time from reservation to appointment.
  days_visit_booked_to_visit_cancelled:
    lineage:
    - datalake_sale_visit.sale_visit.days_visit_booked_to_visit_cancelled
    description: Days between the booking creation and the visit cancelled date
  days_visit_booked_to_visit_completed:
    lineage:
    - datalake_sale_visit.sale_visit.days_visit_booked_to_visit_completed
    description: Days between the booking creation and the visit completed date
  hours_booking_to_offer:
    lineage:
    - datalake_sale_offer.sale_offer.hours_booking_to_offer
    description: Hours between the booking created and the first offer.
  hours_visit_to_offer:
    lineage:
    - datalake_sale_offer.sale_offer.hours_visit_to_offer
    description: Hours between the visit completed and the first offer.
  ts_booking_created:
    lineage:
    - datalake_sale_visit.sale_visit.ts_booking_created
    description: Timestamp of the booking creation.
  ts_visit:
    lineage:
    - datalake_sale_visit.sale_visit.ts_visit
    description: Timestamp of when visit was scheduled for.
  ts_visit_canceled:
    lineage:
    - datalake_sale_visit.sale_visit.ts_visit_canceled
    description: Timestamp of the visit canceled.
  ts_visit_completed:
    lineage:
    - datalake_sale_visit.sale_visit.ts_visit_completed
    description: Timestamp of the visit completed.
  ts_visit_follow_up:
    lineage:
    - datalake_sale_visit.sale_visit..ts_visit_follow_up
    description: Timestamp of the visit follow up.
  ts_buyer_review_rating:
    lineage:
    - datalake_sale_visit.sale_visit.ts_buyer_review_rating
    description: Timestamp of the buyer booking review.
  ts_load:
    description: Timestamp of when the data was last loaded in this table.
