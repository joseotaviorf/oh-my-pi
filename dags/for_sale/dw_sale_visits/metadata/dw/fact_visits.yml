database_name: dw_sale
table_name: fact_visits
description: ''
domain: For Sale
owner: data-for-sale@quintoandar.com.br
columns:
  sk_booking:
    lineage:
    - datalake_booking.booking.id
    description: ID of the booking.
  sk_sale_flow:
    lineage:
    - datalake_booking.booking.id_sale_flow
    description: ID of the sale flow. Is the concatenation of ID buyer and ID house
  sk_house:
    lineage:
    - datalake_booking.booking.id_house
    description: ID of the house
  sk_region:
    lineage:
    - datalake_ebdb_clean.house.id_region
    description: ID of the region where house is located
  sk_business_unit:
    lineage:
    - datalake_sale_visit_hubs.sale_visit_hubs.id_business_unit
  sk_company_supply:
    lineage:
    - datalake_rede_company.company_sks.sk_company
  sk_company_demand:
    lineage:
    - datalake_rede_company.company_sks.sk_company
  sk_agent:
    lineage:
    - datalake_booking.booking.id_agent
    description: ''
  sk_user_agent:
    lineage:
    - datalake_ebdb_clean.user.id
  sk_user_en:
    lineage:
    - datalake_sale_visit_hubs.sale_visit_hubs.id_user_en
  sk_fixed_agent:
    lineage:
    - datalake_booking.booking.id_sale_fixed_agent
  sk_buyer:
    lineage:
    - datalake_booking.booking.id_visitor
    description: ID user of the buyer that started the sale flow
  sk_seller:
    lineage:
    - datalake_ebdb_clean.house.id_user
    description: ID user of the listing owner
  sk_user_creation:
    lineage:
    - datalake_booking.booking.id_user_creation
  sk_user_cancelation:
    lineage:
    - datalake_booking.booking.id_user_cancelation
  sk_visit:
    lineage:
    - datalake_booking.booking.id_visit
    description: ID of the visit.
  sk_visit_code:
    lineage:
    - datalake_booking.booking.code
  sk_offer:
    lineage:
    - datalake_offer.sale_offer.id_offer
    description: ''
  sk_agent_booking_review:
    lineage:
    - datalake_ebdb_clean.real_estate_agent_rating.id
    description: ID of the visit review completed by the agent
  sk_buyer_booking_review:
    lineage:
    - datalake_booking.booking.id
    description: ID of the visit review completed by the buyer
  sk_booking_created_date:
    lineage:
    - datalake_booking.booking.ts_created
    description: Date key to be joined with dim_date. Key to identify date of booking
      creation
  sk_visit_date:
    lineage:
    - datalake_booking.booking.ts_booking_utc
    description: Date key to be joined with dim_date. Key to identify date of visit
      completed
  sk_visit_canceled_date:
    lineage:
    - datalake_booking.booking.ts_first_canceled
    description: Date key to be joined with dim_date. Key to identify date of visit
      canceled
  sk_visit_completed_date:
    lineage:
    - datalake_booking.booking.is_visit_completed
    - datalake_booking.booking.ts_booking_utc
    description: Date key to be joined with dim_date. Key to identify date of visit
      completed
  sk_visit_follow_up_date:
    lineage:
    - datalake_booking.booking.ts_visit_fup
    description: Date key to be joined with dim_date. Key to identify date of visit
      follow up
  sk_agent_review_rating_date:
    lineage:
    - datalake_ebdb_clean.real_estate_agent_rating.ts_created
    description: ''
  sk_buyer_review_rating_date:
    lineage:
    - datalake_insider_clean.review.dt_creation
    description: Date key to be joined with dim_date. Key to identify date of buyer
      booking review
  hub_agent_region:
    lineage:
    - datalake_booking.booking.hub_agent_region
  is_hub_flow:
    lineage:
    - datalake_booking.booking.is_hub_flow
    description: True if the visit is from an agent with HUB active workcontract
  is_house_rented:
    lineage:
    - datalake_booking.booking.is_house_rented
    description: True if the house booked had an active rental contract at 5A at the
      booking date
  is_virtual_visit:
    lineage:
    - datalake_booking.booking.is_virtual_visit
  days_visit_cancelled_to_visit:
    lineage:
    - datalake_booking.booking.days_visit_cancelled_to_visit
  days_visit_booked_to_visit:
    lineage:
    - datalake_booking.booking.days_visit_booked_to_visit
  days_visit_booked_to_visit_cancelled:
    lineage:
    - datalake_booking.booking.days_visit_booked_to_visit_cancelled
    description: Days between the booking creation and the visit cancelled date
  days_visit_booked_to_visit_completed:
    lineage:
    - datalake_booking.booking.days_visit_booked_to_visit_completed
    description: Days between the booking creation and the visit completed date
  hours_booking_to_offer:
    lineage:
    - datalake_offer.sale_offer.hours_booking_to_offer
  hours_visit_to_offer:
    lineage:
    - datalake_offer.sale_offer.hours_visit_to_offer
  ts_load:
    description: ''
