---
database_name: datalake_ebdb_pricing
table_name: rent_percentile_price_changes
description: Enrich table that handles the rental price change information
  Each row represents the prices estimated by the calculator of each house and it's changes.
domain: For Rent
owner: kleber.inoue@quintoandar.com.br
columns:
  id_house: 
    lineage:
      - datalake_ebdb_clean.house_predicted_price_aud.id_house
    description: Foreign key referring to the house ID.
  rev:
    lineage:
      - datalake_ebdb_clean.house_predicted_price_aud.rev
    description: Unique ID for the change. It can be joined with table datalake_ebdb_user.user_revision_entity using the column id to get more details.
  p_10: 
    lineage:
      - datalake_ebdb_clean.house_predicted_price_aud.p_10
    description: Calculator column. Tells the minimum price estimated by the calculator output.
  p_20: 
    lineage:
      - datalake_ebdb_clean.house_predicted_price_aud.p_20
    description: Calculator column. Tells the estimated price related to the 20% percentile of the calculator's output.
  p_30: 
    lineage:
      - datalake_ebdb_clean.house_predicted_price_aud.p_30
    description: Calculator column. Tells the estimated price related to the 30% percentile of the calculator's output.
  p_40: 
    lineage:
      - datalake_ebdb_clean.house_predicted_price_aud.p_40
    description: Calculator column. Tells the estimated price related to the 40% percentile of the calculator's output.
  p_50: 
    lineage:
      - datalake_ebdb_clean.house_predicted_price_aud.p_50
    description: Calculator column. Tells the estimated price related to the 50% percentile of the calculator's output.
  p_60: 
    lineage:
      - datalake_ebdb_clean.house_predicted_price_aud.p_60
    description: Calculator column. Tells the estimated price related to the 60% percentile of the calculator's output.
  p_70: 
    lineage:
      - datalake_ebdb_clean.house_predicted_price_aud.p_70
    description: Calculator column. Tells the estimated price related to the 70% percentile of the calculator's output.
  p_80: 
    lineage:
      - datalake_ebdb_clean.house_predicted_price_aud.p_80
    description: Calculator column. Tells the estimated price related to the 80% percentile of the calculator's output.
  p_90: 
    lineage:
      - datalake_ebdb_clean.house_predicted_price_aud.p_90
    description: Calculator column. Tells the estimated price related to the 90% percentile of the calculator's output.
  certainty: 
    lineage:
      - datalake_ebdb_clean.house_predicted_price_aud.certainty
    description: Calculator column. Tells the certainty level of the prediction calculated by the calculator. It is strongly related to the intensity of the QuintoAndar performance with the listing region.
  is_last_status_of_day:
    description: Boolean indicating if the status/pricing is the last one of the day for the house.
  ts_price_started: 
    lineage:
      - datalake_ebdb_user.user_revision_entity.ts_revision
    description: Timestamp of when the estimated prices started.
  ts_price_ended: 
    lineage:
      - datalake_ebdb_user.user_revision_entity.ts_revision
    description: Timestamp of when the estimated prices ended.