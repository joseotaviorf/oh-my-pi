database_name: metric_sale
table_name: exp_visit_identifier_metric_inc
owner: guilherme.rocha@quintoandar.com.br
domain: For Sale
description: Experiment identifier-level metrics table providing statistical analysis of identifier counts and conversion rates for A/B testing. This table aggregates visit cohort data to calculate both raw identifier counts and percentage-based metrics with confidence intervals for control vs treatment groups across different experiment identifiers and funnel stages. Each row represents a specific identifier metric for each experiment, cohort period and reference date. Each run of the DAG will process the data for the dt_ref based on the load_start_date and load_end_date parameters and will merge the data with the existing data for the same dt_ref.
columns:
  sk_exp_visit_metric:
    lineage:
    - metric_sale.exp_visit_cohort_inc.sk_neotribe_exp
    - metric_sale.exp_visit_cohort_inc.metric_cohort
    - metric_sale.exp_visit_cohort_inc.dt_ref
    description: Unique key combining experiment, cohort period, metric name and reference date using MD5 hash.
    dimension: true
  exp_name_neotribe:
    lineage:
    - metric_sale.exp_visit_cohort_inc.exp_name_neotribe
    description: Name of the neotribe conducting the experiment.
    dimension: true
  exp_name_experiment:
    lineage:
    - metric_sale.exp_visit_cohort_inc.exp_name_experiment
    description: Name of the specific experiment being conducted.
    dimension: true
  exp_identifier_type:
    lineage:
    - metric_sale.exp_visit_cohort_inc.exp_identifier_type
    description: Type of identifier used for experiment participants (e.g., VISITOR, HOUSE, AGENT).
    dimension: true
  business_context:
    lineage:
    - metric_sale.exp_visit_cohort_inc.business_context
    description: Business context of the visit (RENT or SALE).
    dimension: true
  metric_cohort:
    lineage:
    - metric_sale.exp_visit_cohort_inc.metric_cohort
    description: Cohort time window for metric calculation.
    categories:
      1d: 1-day cohort metrics.
      3d: 3-day cohort metrics.
      7d: 7-day cohort metrics.
      14d: 14-day cohort metrics.
      21d: 21-day cohort metrics.
      28d: 28-day cohort metrics.
    dimension: true
  metric_name:
    lineage:
    - metric_sale.exp_visit_cohort_inc.number_identifiers
    - metric_sale.exp_visit_cohort_inc.number_identifiers_with_vc
    - metric_sale.exp_visit_cohort_inc.number_identifiers_with_vcc
    - metric_sale.exp_visit_cohort_inc.number_identifiers_with_vu
    - metric_sale.exp_visit_cohort_inc.number_identifiers_with_os
    - metric_sale.exp_visit_cohort_inc.number_identifiers_with_oa
    - metric_sale.exp_visit_cohort_inc.number_identifiers_with_cs
    description: Name of the identifier metric being calculated.
    categories:
      number_identifiers: Total count of unique identifiers in the experiment.
      number_identifiers_with_vb: Count of identifiers with booked visits.
      number_identifiers_with_vcf: Count of identifiers with confirmed visits.
      number_identifiers_with_vc: Count of identifiers with completed visits.
      number_identifiers_with_vcc: Count of identifiers with canceled visits.
      number_identifiers_with_vu: Count of identifiers with unsuccessful visits.
      number_identifiers_with_os: Count of identifiers with submitted offers.
      number_identifiers_with_oa: Count of identifiers with accepted offers.
      number_identifiers_with_cs: Count of identifiers with signed contracts.
      identifiers_with_vb: Percentage of identifiers with booked visits.
      identifiers_with_vcf: Percentage of identifiers with confirmed visits.
      identifiers_with_vc: Percentage of identifiers with completed visits.
      identifiers_with_vcc: Percentage of identifiers with canceled visits.
      identifiers_with_vu: Percentage of identifiers with unsuccessful visits.
      identifiers_with_os: Percentage of identifiers with submitted offers.
      identifiers_with_oa: Percentage of identifiers with accepted offers.
      identifiers_with_cs: Percentage of identifiers with signed contracts.
      vb_per_identifier: Booked visits per identifier.
      vcf_per_identifier: Confirmed visits per identifier.
      vc_per_identifier: Completed visits per identifier.
      vcc_per_identifier: Canceled visits per identifier.
      vu_per_identifier: Unsuccessful visits per identifier.
      os_per_identifier: Submitted offers per identifier.
      oa_per_identifier: Accepted offers per identifier.
      cs_per_identifier: Signed contracts per identifier.
    dimension: true
  control_metric_value:
    lineage:
    - metric_sale.exp_visit_cohort_inc.number_identifiers
    - metric_sale.exp_visit_cohort_inc.number_identifiers_with_vb
    - metric_sale.exp_visit_cohort_inc.number_identifiers_with_vcf
    - metric_sale.exp_visit_cohort_inc.number_identifiers_with_vc
    - metric_sale.exp_visit_cohort_inc.number_identifiers_with_vcc
    - metric_sale.exp_visit_cohort_inc.number_identifiers_with_vu
    - metric_sale.exp_visit_cohort_inc.number_identifiers_with_os
    - metric_sale.exp_visit_cohort_inc.number_identifiers_with_oa
    - metric_sale.exp_visit_cohort_inc.number_identifiers_with_cs
    - metric_sale.exp_visit_cohort_inc.num_vb_id
    - metric_sale.exp_visit_cohort_inc.num_vcf_id
    - metric_sale.exp_visit_cohort_inc.num_vc_id
    - metric_sale.exp_visit_cohort_inc.num_vcc_id
    - metric_sale.exp_visit_cohort_inc.num_vu_id
    - metric_sale.exp_visit_cohort_inc.num_os_id
    - metric_sale.exp_visit_cohort_inc.num_oa_id
    - metric_sale.exp_visit_cohort_inc.num_cs_id
    description: Metric value for the control group (count for number metrics, percentage for ratio metrics).
    metric:
      name: Control Group Metric Value
      description: Identifier-level metric value for participants in the control group.
      acronym: Control
      is_additive: false
      business_stage: Demand
      hierarchy: Executive
      approved_by: leticia.machado@quintoandar.com.br
      link_to_metric: ''
  control_metric_error:
    lineage:
    - metric_sale.exp_visit_cohort_inc.number_identifiers
    - metric_sale.exp_visit_cohort_inc.number_identifiers_with_vb
    - metric_sale.exp_visit_cohort_inc.number_identifiers_with_vcf
    - metric_sale.exp_visit_cohort_inc.number_identifiers_with_vc
    - metric_sale.exp_visit_cohort_inc.number_identifiers_with_vcc
    - metric_sale.exp_visit_cohort_inc.number_identifiers_with_vu
    - metric_sale.exp_visit_cohort_inc.number_identifiers_with_os
    - metric_sale.exp_visit_cohort_inc.number_identifiers_with_oa
    - metric_sale.exp_visit_cohort_inc.number_identifiers_with_cs
    - metric_sale.exp_visit_cohort_inc.num_vb_id
    - metric_sale.exp_visit_cohort_inc.num_vcf_id
    - metric_sale.exp_visit_cohort_inc.num_vc_id
    - metric_sale.exp_visit_cohort_inc.num_vcc_id
    - metric_sale.exp_visit_cohort_inc.num_vu_id
    - metric_sale.exp_visit_cohort_inc.num_os_id
    - metric_sale.exp_visit_cohort_inc.num_oa_id
    - metric_sale.exp_visit_cohort_inc.num_cs_id
    description: 95% confidence interval margin of error for control group metric (null for count metrics, calculated for percentage metrics).
    metric:
      name: Control Group Error Margin
      description: Statistical margin of error for control group identifier metrics at 95% confidence level using binomial proportion confidence interval.
      acronym: Control Error
      is_additive: false
      business_stage: Demand
      hierarchy: Executive
      approved_by: leticia.machado@quintoandar.com.br
      link_to_metric: ''
  treatment_metric_value:
    lineage:
    - metric_sale.exp_visit_cohort_inc.number_identifiers
    - metric_sale.exp_visit_cohort_inc.number_identifiers_with_vb
    - metric_sale.exp_visit_cohort_inc.number_identifiers_with_vcf
    - metric_sale.exp_visit_cohort_inc.number_identifiers_with_vc
    - metric_sale.exp_visit_cohort_inc.number_identifiers_with_vcc
    - metric_sale.exp_visit_cohort_inc.number_identifiers_with_vu
    - metric_sale.exp_visit_cohort_inc.number_identifiers_with_os
    - metric_sale.exp_visit_cohort_inc.number_identifiers_with_oa
    - metric_sale.exp_visit_cohort_inc.number_identifiers_with_cs
    - metric_sale.exp_visit_cohort_inc.num_vb_id
    - metric_sale.exp_visit_cohort_inc.num_vcf_id
    - metric_sale.exp_visit_cohort_inc.num_vc_id
    - metric_sale.exp_visit_cohort_inc.num_vcc_id
    - metric_sale.exp_visit_cohort_inc.num_vu_id
    - metric_sale.exp_visit_cohort_inc.num_os_id
    - metric_sale.exp_visit_cohort_inc.num_oa_id
    - metric_sale.exp_visit_cohort_inc.num_cs_id
    description: Metric value for the treatment group (count for number metrics, percentage for ratio metrics).
    metric:
      name: Treatment Group Metric Value
      description: Identifier-level metric value for participants in the treatment group.
      acronym: Treatment
      is_additive: false
      business_stage: Demand
      hierarchy: Executive
      approved_by: leticia.machado@quintoandar.com.br
      link_to_metric: ''
  treatment_metric_error:
    lineage:
    - metric_sale.exp_visit_cohort_inc.number_identifiers
    - metric_sale.exp_visit_cohort_inc.number_identifiers_with_vb
    - metric_sale.exp_visit_cohort_inc.number_identifiers_with_vcf
    - metric_sale.exp_visit_cohort_inc.number_identifiers_with_vc
    - metric_sale.exp_visit_cohort_inc.number_identifiers_with_vcc
    - metric_sale.exp_visit_cohort_inc.number_identifiers_with_vu
    - metric_sale.exp_visit_cohort_inc.number_identifiers_with_os
    - metric_sale.exp_visit_cohort_inc.number_identifiers_with_oa
    - metric_sale.exp_visit_cohort_inc.number_identifiers_with_cs
    - metric_sale.exp_visit_cohort_inc.num_vb_id
    - metric_sale.exp_visit_cohort_inc.num_vcf_id
    - metric_sale.exp_visit_cohort_inc.num_vc_id
    - metric_sale.exp_visit_cohort_inc.num_vcc_id
    - metric_sale.exp_visit_cohort_inc.num_vu_id
    - metric_sale.exp_visit_cohort_inc.num_os_id
    - metric_sale.exp_visit_cohort_inc.num_oa_id
    - metric_sale.exp_visit_cohort_inc.num_cs_id
    description: 95% confidence interval margin of error for treatment group metric (null for count metrics, calculated for percentage metrics using binomial proportion confidence interval).
    metric:
      name: Treatment Group Error Margin
      description: Statistical margin of error for treatment group identifier metrics at 95% confidence level.
      acronym: Treatment Error
      is_additive: false
      business_stage: Demand
      hierarchy: Executive
      approved_by: leticia.machado@quintoandar.com.br
      link_to_metric: ''
  dt_ref:
    lineage:
    - metric_sale.exp_visit_cohort_inc.dt_ref
    description: Reference date for cohort calculation, representing the analysis date for time-based metrics.
    dimension: true
  year:
    lineage:
    - metric_sale.exp_visit_cohort_inc.dt_ref
    description: Year component of the reference date for partitioning.
    dimension: true
  month:
    lineage:
    - metric_sale.exp_visit_cohort_inc.dt_ref
    description: Month component of the reference date for partitioning.
    dimension: true
  day:
    lineage:
    - metric_sale.exp_visit_cohort_inc.dt_ref
    description: Day component of the reference date for partitioning.
    dimension: true
