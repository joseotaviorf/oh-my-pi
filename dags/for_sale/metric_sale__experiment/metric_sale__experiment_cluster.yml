cluster:
  type: consolidation_l_memory_cluster
  databricks_conn_id: databricks_new
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
    aws_attributes:
      ebs_volume_size: 200
    num_workers: 5
validation:
  cluster:
    type: emr_7_12_consolidation_xl_memory_fleet_cluster
    custom_configurations:
      task_nodes:
        instance_types:
        - r6g.8xlarge
        - r7g.8xlarge
        - r6i.8xlarge
        target_on_demand: 0
        target_spot: 3
        allocation_strategy: price-capacity-optimized
        bid_price_percentage: 100
      core_nodes:
        target_on_demand: 2
        target_spot: 0
        instance_types:
        - r6g.8xlarge
        - r7g.8xlarge
        - r6i.8xlarge
      aws_attributes:
        ebs_volume_size: 200
      spark_conf:
        spark.executor.memory: 96g
        spark.executor.memoryOverhead: 8g
        spark.driver.memory: 20g
        spark.driver.memoryOverhead: 4g
        spark.dynamicAllocation.maxExecutors: '20'
        spark.sql.shuffle.partitions: '400'
        spark.memory.fraction: '0.8'
        spark.memory.storageFraction: '0.3'
