cluster:
  type: emr_7_12_consolidation_xl_memory_fleet_cluster
  custom_configurations:
    spark_conf:
      spark.executor.memory: 96g
      spark.executor.memoryOverhead: 8g
      spark.driver.memory: 96g # since only 2 tasks are concurrent the driver can be bigger
      spark.driver.memoryOverhead: 8g
      spark.dynamicAllocation.maxExecutors: '32'
      spark.sql.shuffle.partitions: '800'
      spark.memory.fraction: '0.8'
      spark.memory.storageFraction: '0.3'
      spark.databricks.delta.autoCompact.enabled: "false"
    task_nodes:
      instance_types:
      - r6g.8xlarge
      - r7g.8xlarge
      - r6i.8xlarge
      target_on_demand: 0
      target_spot: 2
      allocation_strategy: price-capacity-optimized
      bid_price_percentage: 100
    core_nodes:
      target_on_demand: 6
      target_spot: 0
      instance_types:
      - r6g.8xlarge
      - r7g.8xlarge
      - r6i.8xlarge
