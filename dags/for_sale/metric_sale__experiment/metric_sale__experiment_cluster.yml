cluster:
  type: emr_7_12_consolidation_l_memory_fleet_cluster
  custom_configurations:
    spark_conf:
      spark.executor.memory: 10g
      spark.executor.memoryOverhead: 4g
      spark.executor.cores: '2'
      spark.driver.memory: 32g # Only 2 load tasks are concurrent
      spark.driver.memoryOverhead: 8g
      spark.dynamicAllocation.maxExecutors: '80'
      spark.sql.shuffle.partitions: '1536'
      spark.memory.fraction: '0.8'
      spark.memory.storageFraction: '0.3'
      spark.databricks.delta.autoCompact.enabled: "false"
    core_nodes:
      target_on_demand: 10
      target_spot: 0
      instance_types: # 128Gb 16 cores
      - r6g.4xlarge
      - r7g.4xlarge
      - r8g.4xlarge