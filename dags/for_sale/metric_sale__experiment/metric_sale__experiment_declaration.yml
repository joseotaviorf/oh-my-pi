dag:
  name: metric_sale__experiment
  schedule_start_date: 2025,12,03
  owner: Data ForSale
  documentation:
    dag_purpose: "This DAG creates the For Sale experiment metrics."
workflow:
  type: query_delta
  layer: metric
  custom_schema: sale
  inner_dependencies:
    exp_visit_metric_conversion:
      - exp_visit_cohort
    exp_visit_identifier_metric:
      - exp_visit_cohort
cluster:
  type: databricks_16_4_med_5_workers_memory_cluster
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: USER_ISOLATION
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
