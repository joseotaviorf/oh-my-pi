dag:
  name: metric_sale__experiment
  schedule_start_date: 2025,12,03
  owner: Data ForSale
  documentation:
    dag_purpose: "This DAG creates the For Sale experiment metrics."
workflow:
  type: query_delta
  layer: metric
  custom_schema: sale
  inner_dependencies:
    exp_visit_metric_conversion:
      - exp_visit_cohort
    exp_visit_identifier_metric:
      - exp_visit_cohort
    exp_visit_metric_conversion_inc:
      - exp_visit_cohort_inc
    exp_visit_identifier_metric_inc:
      - exp_visit_cohort_inc
    exp_visit_metric_unified:
      - exp_visit_metric_conversion_inc
      - exp_visit_identifier_metric_inc
  tables_customization:
    exp_visit_cohort_inc:
      extraction_type: incremental
      partitions: [year, month, day]
      merge_on: [sk_exp_visit_cohort]
    exp_visit_identifier_metric_inc:
      extraction_type: incremental
      partitions: [year, month, day]
      merge_on: [sk_exp_visit_metric]
    exp_visit_metric_conversion_inc:
      extraction_type: incremental
      partitions: [year, month, day]
      merge_on: [sk_exp_visit_metric]
    exp_visit_metric_unified:
      extraction_type: incremental
      partitions: [year, month, day]
      merge_on: [sk_exp_visit_metric]
  extra_query_template_params:
      load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
      load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
