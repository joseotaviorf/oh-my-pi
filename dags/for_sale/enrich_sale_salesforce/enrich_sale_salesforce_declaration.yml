---
dag:
  name: enrich_sale_salesforce
  schedule_start_date: 2025, 5, 1
  owner: Data ForSale
  documentation:
    dag_purpose: This DAG creates the enriched table for the ForSale SalesForce context, deduplicating data to make it easier for users to use the information and can be used for future expansions of this data..
workflow:
  type: query_delta
  layer: enrich
cluster:  
  type: databricks_16_4_med_general_cluster
  databricks_conn_id: databricks_new_env
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
