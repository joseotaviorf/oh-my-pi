database_name: datalake_sale_salesforce
table_name: purchase_sale_contract
owner: guilherme.rocha@quintoandar.com.br
domain: For Sale
description: >-
  Table with enriched data about purchase sale contracts (opportunities) from Salesforce,
  consolidated for the For Sale domain. One row per contract, keeping only the most recently
  modified version per id. This table contains comprehensive information about contract stages,
  payments, dates, and process status throughout the sales transaction lifecycle (CCV signature
  through key delivery and registry). id_offer is a foreign key to
  enrich_sale_offer_flows.sale_offer_flows.id_offer and to dw_sale.fact_offers/dw_sale.dim_offer,
  linking each Salesforce contract to the underlying For Sale offer; the same deal's post-CCV
  closing milestones are also tracked in enrich_sale_closing_flows.closing_flow (joined via
  id_offer), with this table serving as the Salesforce-CRM view of the same lifecycle.
columns:
  id:
    description: Unique identifier of the purchase and sale contract opportunity in Salesforce; primary key of this table, one row per contract keeping only the latest modified version.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.id
  id_owner:
    description: Identifier of the seller of the house associated with the contract (sourced from the Salesforce record-owner field).
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.id_owner
  id_created_by:
    description: Identifier of the Salesforce user who created this contract record.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.id_created_by
  id_last_modified_by:
    description: Identifier of the Salesforce user who last modified this contract record.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.id_last_modified_by
  id_external:
    description: External system identifier used to reconcile this Salesforce contract record with its counterpart in the upstream sales/offer system.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.id_external
  id_offer:
    description: Identifier of the sales offer this contract originated from. Foreign key to the For Sale offer/funnel tables (e.g. dw_sale.fact_offers, dw_sale.dim_offer), used to relate the contract back to the earlier funnel stages.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.id_offer
  name:
    description: Human-readable display name associated with the person or entity in this row.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.name
  diligence_classification:
    description: Risk classification assigned to the contract during the due-diligence (DD) legal review of seller and house documentation, used to prioritize and route the review.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.diligence_classification
  diligence_status:
    description: Current status of the due-diligence (DD) legal review of seller and house documentation for the contract, reflecting progress toward Closed Deal (CD).
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.diligence_status
  payment_method:
    description: How the buyer settles the purchase (e.g. cash, bank financing, or QuintoAndar credit).
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.payment_method
  stage:
    description: Current pipeline stage of the purchase and sale contract opportunity in Salesforce, reflecting where the deal is in the CCV/closing workflow (e.g. drafting, signature, registry, key delivery).
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.stage
  buyer:
    description: Identifier of the buyer of the house
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.buyer
  clause_identifiers:
    description: List of contract clause codes applicable to this purchase and sale agreement, identifying which standard or optional clauses were included.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.clause_identifiers
  sales_flow_url:
    description: URL linking the contract to its SalesFlow record.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.sales_flow_url
  seller:
    description: Seller name or identifier recorded on the contract.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.seller
  zendesk_url:
    description: URL linking the contract to its related Zendesk support ticket.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.zendesk_url
  agent_email:
    description: Email of the agent responsible for the contract.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.agent_email
  crn_status:
    description: Status of the notary-office (CRN) step of the closing process, tracking progress of the deed (escritura) execution.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.crn_status
  ccv_status:
    description: Status of the sale agreement (CCV) for the contract.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.ccv_status
  house_chattel_mortgage:
    description: Chattel mortgage (alienacao fiduciaria) information on the house for the contract.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.house_chattel_mortgage
  house_state:
    description: State (UF) where the contracted house is located.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.house_state
  itbi_status:
    description: Status of the ITBI (real estate transfer tax) payment for the contract.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.itbi_status
  simplified_stage:
    description: Simplified, grouped version of the contract stage for reporting.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.simplified_stage
  subscription_model_buyer:
    description: Subscription (signing) model used by the buyer on the contract.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.subscription_model_buyer
  subscription_model_seller:
    description: Subscription (signing) model used by the seller on the contract.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.subscription_model_seller
  cri_protocol:
    description: Protocol number of the real estate registry (CRI) filing for the contract.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.cri_protocol
  crn_name:
    description: Notary office (CRN) name
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.crn_name
  alienation_status:
    description: Status of the property alienation (chattel mortgage release) for the contract.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.alienation_status
  bypass_rescission_validation:
    description: Whether the standard rescission (cancellation) validation checks were manually bypassed for this contract, typically used for exception handling by ops/legal.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.bypass_rescission_validation
  cri_have_demand_note:
    description: Whether a demand note (nota de exigencia) was issued by the real estate registry (CRI) during registration of this contract, requiring additional documentation before registry completion.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.cri_have_demand_note
  crn_partner:
    description: Name of the partner notary office (CRN parceiro) handling the deed execution for this contract, when closing uses QuintoAndar's notary partner network.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.crn_partner
  crn_complexity:
    description: Complexity classification assigned to the notary-office (CRN) step for this contract, used to route or prioritize cases with more demanding registry requirements.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.crn_complexity
  escrivao:
    description: Name of the clerk (escrivao)
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.escrivao
  have_unpaid_alienation:
    description: Whether the property has an outstanding (unpaid) chattel mortgage (alienacao fiduciaria) that must be settled before registry/closing can proceed.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.have_unpaid_alienation
  house_occupant:
    description: Current occupant of the house under contract (e.g. owner, tenant, vacant).
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.house_occupant
  preemptive_right:
    description: Preemptive right (direito de preferencia) information applicable to the sale.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.preemptive_right
  proof_payment_received:
    description: Whether documented proof of payment (comprovante) for the transaction has been received and validated by QuintoAndar.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.proof_payment_received
  request_type:
    description: Type of request that originated or modified the contract record.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.request_type
  requested_by:
    description: Person or role who requested the action recorded in request_type for this contract case.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.requested_by
  rescission_status:
    description: Status of the contract rescission (cancellation) process.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.rescission_status
  fs_ave_protocol_ccv:
    description: AVE protocol number for the CCV registry filing.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.fs_ave_protocol_ccv
  fs_cri_name_ccv:
    description: Name of the real estate registry office (CRI) handling the CCV.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.fs_cri_name_ccv
  fs_cri_status:
    description: Status of the real estate registry (CRI) step for the contract.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.fs_cri_status
  fs_endorsement_status_ccv:
    description: Status of the CCV endorsement (averbacao) step.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.fs_endorsement_status_ccv
  fs_cartorio_ccv_id:
    description: Identifier of the registry office (cartorio) handling the CCV.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.fs_cartorio_ccv_id
  fs_reason_non_conversion_ccv:
    description: Reason the CCV was not converted (completed) when applicable.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.fs_reason_non_conversion_ccv
  address:
    description: Address of the house under this purchase and sale contract.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.address
  addendum_status:
    description: Status of any addendum (aditivo) attached to the contract.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.addendum_status
  fs_responsible_assistant_ccv:
    description: Assistant responsible for the CCV registry step.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.fs_responsible_assistant_ccv
  lt_bookkeeping_done_form:
    description: Status of the lead-time (LT) bookkeeping-done form, indicating whether bookkeeping for the CCV registry step was completed on schedule.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.lt_bookkeeping_done_form
  fs_reasons_lt_overrun_register_ccv:
    description: Reasons the lead time was exceeded during the CCV registry step.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.fs_reasons_lt_overrun_register_ccv
  fs_reasons_lt_overrun_ccv:
    description: Reasons the overall lead time was exceeded for the CCV process.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.fs_reasons_lt_overrun_ccv
  deal_maker_name:
    description: Name of the Deal Maker responsible for the contract.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.deal_maker_name
  hub_name:
    description: Name of the hub (business unit) responsible for the contract.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.hub_name
  long_term_payment:
    description: Whether the buyer is settling the purchase through a long-term installment payment plan rather than a lump-sum payment.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.long_term_payment
  range_of_days_since_ccv:
    description: Bucketed range of days elapsed since the CCV (sale agreement) was signed, used to group contracts by aging in operational reporting.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.range_of_days_since_ccv
  thread_id:
    description: Identifier of the communication thread linked to the contract.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.thread_id
  have_demand_note_reason:
    description: Reason recorded for why a registry demand note (nota de exigencia) was issued on this contract (see cri_have_demand_note).
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.have_demand_note_reason
  is_deleted:
    description: Whether this contract record has been soft-deleted in Salesforce and should be excluded from active reporting.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.is_deleted
  is_down_payment_paid:
    description: Whether the buyer's down payment (entrada) for this contract has been paid.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.is_down_payment_paid
  is_buyer_pays_entire_deposit:
    description: Whether the buyer is responsible for paying the entire deposit (sinal) amount, rather than splitting it with the seller.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.is_buyer_pays_entire_deposit
  is_diligence_accepted:
    description: Whether the outcome of the due-diligence (DD) review was accepted, allowing the deal to proceed toward Closed Deal (CD).
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.is_diligence_accepted
  has_down_payment_extension:
    description: Whether an extension was granted on the down payment (entrada) deadline for this contract.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.has_down_payment_extension
  is_paid_via_ted:
    description: Whether the payment for this contract was made via TED bank transfer, rather than another payment channel.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.is_paid_via_ted
  is_seller_pays_part_deposit:
    description: Whether the seller contributes part of the deposit (sinal) amount on this contract.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.is_seller_pays_part_deposit
  is_key_received:
    description: Whether the property keys have been received as part of closing this contract.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.is_key_received
  is_continue_with_partner_registry:
    description: Whether the contract's registry process continues with QuintoAndar's partner notary/registry office (CRN/CRI parceiro), rather than a non-partner office.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.is_continue_with_partner_registry
  is_house_registry_must_be_updated:
    description: Whether the house's property registry (matricula) requires an update as part of closing this contract.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.is_house_registry_must_be_updated
  is_suspended:
    description: Whether processing of this contract is currently suspended (paused) in the closing workflow.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.is_suspended
  is_assigned:
    description: Whether this contract case has been assigned to a responsible agent or analyst.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.is_assigned
  is_balance_payment_made:
    description: Whether the remaining balance payment (saldo) for the purchase has been made.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.is_balance_payment_made
  is_share_community_portal:
    description: Whether this contract's information is shared on the community/condominium portal.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.is_share_community_portal
  is_list_view_user:
    description: Salesforce flag indicating whether the record is visible to list-view users.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.is_list_view_user
  is_house_registry_must_be_updated_form:
    description: Whether the intake form flagged that the house's property registry (matricula) must be updated, ahead of the operational confirmation in is_house_registry_must_be_updated.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.is_house_registry_must_be_updated_form
  is_concomitant_registration:
    description: Whether this contract's property registration is being processed concomitantly (jointly) with another related registration.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.is_concomitant_registration
  is_lease_complaint_sent:
    description: Whether a lease-related complaint notice was sent regarding the occupant of the house under this contract.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.is_lease_complaint_sent
  dt_down_payment_deadline:
    description: Deadline date by which the buyer's down payment (entrada) must be made for this contract.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.dt_down_payment_deadline
  dt_key_delivery_buyer:
    description: Date of key delivery to the buyer
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.dt_key_delivery_buyer
  dt_key_delivery_seller:
    description: Date of key delivery from the seller
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.dt_key_delivery_seller
  dt_key_delivery:
    description: Date the property keys were delivered for the contract.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.dt_key_delivery
  dt_updated:
    description: Date when the purchase sale contract was last updated
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.dt_updated
  dt_subscription_scheduling:
    description: Scheduled date for the contract signing (subscription) appointment.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.dt_subscription_scheduling
  dt_bookkeeping_done_ccv:
    description: Date when the bookkeeping was done for the CCV
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.dt_bookkeeping_done_ccv
  dt_cri_done_ccv:
    description: Date when the CRI was done for the CCV
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.dt_cri_done_ccv
  dt_fs_endorsement_request_ccv:
    description: Date of the FS endorsement request for the CCV
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.dt_fs_endorsement_request_ccv
  dt_fs_cri_request_ccv:
    description: Date of the FS CRI request for the CCV
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.dt_fs_cri_request_ccv
  dt_completion_ccv:
    description: Date of the CCV completion
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.dt_completion_ccv
  ts_created:
    description: Timestamp of when the purchase sale contract was created
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.ts_created
  ts_last_modified:
    description: Timestamp when the contract record was last modified in Salesforce.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.ts_last_modified
  ts_system_mod:
    description: Timestamp of when the purchase sale contract was last modified in the system
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.ts_system_mod
  ts_last_activity:
    description: Timestamp of the last activity logged against the contract in Salesforce.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.ts_last_activity
  ts_last_viewed:
    description: Timestamp when the contract record was last viewed in Salesforce.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.ts_last_viewed
  ts_last_referenced:
    description: Timestamp when the contract record was last referenced in Salesforce.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.ts_last_referenced
  ts_ccv_signed:
    description: Timestamp of when the CCV (sale agreement) was signed for this contract — the commercial closing milestone in the For Sale funnel, distinct from Closed Deal (CD).
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.ts_ccv_signed
  ts_ccv_termination:
    description: Timestamp of when the CCV termination (distrato) record was created for this contract, if the sale agreement was cancelled.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.ts_ccv_termination
  ts_dd_accepted:
    description: Timestamp of when the due-diligence (DD) review outcome was accepted for this contract.
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.ts_dd_accepted
  year:
    description: Year of the last modification of the purchase sale contract
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.year
  month:
    description: Month of the last modification of the purchase sale contract
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.month
  day:
    description: Day of the last modification of the purchase sale contract
    lineage:
    - datalake_salesforce_clean.purchase_sale_contract.day
