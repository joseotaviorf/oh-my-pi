  days_first_event_to_first_visit_completed:
    lineage:
    - datalake_sale_flows.sale_flow.days_first_event_to_first_visit_completed
    description: Days between the first event and the first visit completed in the
      sale flow
  days_first_event_to_first_offer_submitted:
    lineage:
    - datalake_sale_flows.sale_flow.days_first_event_to_first_offer_submitted
    description: Days between the first event and first offer submitted in the sale
