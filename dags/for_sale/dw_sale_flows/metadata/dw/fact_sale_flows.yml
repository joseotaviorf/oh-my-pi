  days_first_booking_created_to_first_offer_submitted:
    lineage:
    - datalake_sale_flows.sale_flow.days_first_booking_created_to_first_offer_submitted
    description: Days between the first booking and first offer submitted in the sale
      flow
  days_first_booking_created_to_first_offer_accepted:
    lineage:
    - datalake_sale_flows.sale_flow.days_first_booking_created_to_first_offer_accepted
    description: Days between the first booking and first offer accepted in the sale
      flow
  days_first_booking_created_to_sale_agreement_signed:
    lineage:
    - datalake_sale_flows.sale_flow.days_first_booking_created_to_sale_agreement_signed
    description: Days between the first booking and sale agreement signed in the sale
