database_name: dw_sale
table_name: fact_sale_flows
description: >
  The sale flow is defined by the tuple buyer / house. Grain: one row per unique
  buyer-house pair, identified by sk_sale_flow = CONCAT(id_buyer, '_', id_house).
  A flow can be started when the buyer makes a booking, submits an offer, or
  sends a talk-to-agent (TTA) message for that house. The table brings
  information about events (dates, counts, flags, categories) that happened in
  each sale flow, plus marketing attribution (UTM, app type, branded flag and
  demand taxonomy) resolved from Amplitude, talk-to-agent and cross-channel
  attribution events for the flow's first touchpoint. Rows with a null
  sk_sale_flow are excluded, due to a known limitation where the
  datalake_gsheets.sale_hub_offer source has no id_sale_flow information.
domain: For Sale
owner: helder.rodrigues@quintoandar.com.br
columns:
  sk_sale_flow:
    lineage:
    - datalake_sale_flows.sale_flow.id_sale_flow
    description: >
      Unique identifier of the sale flow, built by concatenating the buyer's
      user ID and the house ID (CONCAT(id_buyer, '_', id_house)). Primary key
      of this table (one row per buyer/house pair). Can be joined with
      dw_visit.fact_visit_events.sk_sale_flow, which uses the same
      CONCAT(id_buyer, '_', id_house) format.
  sk_buyer:
    lineage:
    - datalake_sale_flows.sale_flow.id_buyer
    description: ID of the buyer (user who initiated the sale flow). Can be joined with dw_public.dim_user.
  sk_house:
    lineage:
    - datalake_sale_flows.sale_flow.id_house
    description: ID of the house (listing). Can be joined with dw_house.dim_house and dw_sale.dim_listing.
  sk_seller:
    lineage:
    - datalake_sale_flows.sale_flow.id_seller
    description: ID of the seller (house owner). Can be joined with dw_public.dim_user.
  sk_region:
    lineage:
    - datalake_sale_flows.sale_flow.id_region
    description: ID of the region where the house is located. Can be joined with dw_public.dim_region.
  sk_first_listing_date:
    lineage:
    - datalake_sale_flows.sale_flow.ts_first_listing
    description: >
      Date surrogate key (format YYYYMMDD) of the house's first publication
      in the sale context. Can be joined with dw_public.dim_date.sk_date.
      Value is -1 when there is no listing date recorded.
  sk_first_event_date:
    lineage:
    - datalake_sale_flows.sale_flow.ts_first_event
    description: >
      Date surrogate key (format YYYYMMDD) of the first event of the flow
      (booking, offer, or talk-to-agent message — see first_event). Can be
      joined with dw_public.dim_date.sk_date. Value is -1 when not available.
  sk_first_tta_message_sent_date:
    lineage:
    - datalake_sale_flows.sale_flow.ts_first_tta_message_sent
    description: >
      Date surrogate key (format YYYYMMDD) of the first message sent through
      the talk-to-agent feature in the flow. Can be joined with
      dw_public.dim_date.sk_date. Value is -1 when no talk-to-agent message
      was sent.
  sk_first_booking_created_date:
    lineage:
    - datalake_sale_flows.sale_flow.ts_first_booking_created
    description: >
      Date surrogate key (format YYYYMMDD) of the first booking created in
      the sale flow. Can be joined with dw_public.dim_date.sk_date. Value is
      -1 when no booking was created.
  sk_first_visit_completed_date:
    lineage:
    - datalake_sale_flows.sale_flow.ts_first_visit_completed
    description: >
      Date surrogate key (format YYYYMMDD) of the first visit completed in
      the sale flow. Can be joined with dw_public.dim_date.sk_date. Value is
      -1 when no visit was completed.
  sk_first_offer_submitted_date:
    lineage:
    - datalake_sale_flows.sale_flow.ts_first_offer_submitted
    description: >
      Date surrogate key (format YYYYMMDD) of the first offer submitted in
      the flow. Can be joined with dw_public.dim_date.sk_date. Value is -1
      when no offer was submitted.
  sk_first_offer_accepted_date:
    lineage:
    - datalake_sale_flows.sale_flow.dt_first_offer_accepted
    description: >
      Date surrogate key (format YYYYMMDD) of the first offer acceptance in
      the flow. Can be joined with dw_public.dim_date.sk_date. Value is -1
      when no offer was accepted.
  sk_first_offer_dismissed_date:
    lineage:
    - datalake_sale_flows.sale_flow.dt_first_offer_dismissed
    description: >
      Date surrogate key (format YYYYMMDD) of the first offer dismissed in
      the flow. Can be joined with dw_public.dim_date.sk_date. Value is -1
      when no offer was dismissed.
  sk_sale_agreement_created_date:
    lineage:
    - datalake_sale_flows.sale_flow.dt_sale_agreement_created
    description: >
      Date surrogate key (format YYYYMMDD) of the sale agreement (CCV)
      creation. Can be joined with dw_public.dim_date.sk_date. Value is -1
      when the sale agreement was not created.
  sk_sale_agreement_signed_date:
    lineage:
    - datalake_sale_flows.sale_flow.dt_sale_agreement_signed
    description: >
      Date surrogate key (format YYYYMMDD) of the sale agreement (CCV)
      signature. Can be joined with dw_public.dim_date.sk_date. Value is -1
      when the CCV was not signed.
  sk_sale_agreement_cancelled_date:
    lineage:
    - datalake_sale_flows.sale_flow.dt_sale_agreement_cancelled
    description: >
      Date surrogate key (format YYYYMMDD) of the sale agreement (CCV)
      cancellation. Can be joined with dw_public.dim_date.sk_date. Value is
      -1 when the CCV was not cancelled.
  sk_house_registry_ended_date:
    lineage:
    - datalake_sale_flows.sale_flow.dt_house_registry_ended
    description: >
      Date surrogate key (format YYYYMMDD) of the end of the house registry
      transfer to the buyer's name. Can be joined with
      dw_public.dim_date.sk_date. Value is -1 when the registry process has
      not ended (it means the sale process was completed).
  first_event:
    lineage:
    - datalake_sale_flows.sale_flow.first_event
    description: Which event started the flow. It could be a booking, an offer or a talk_to_agent message
    categories:
      booking: ''
      offer: ''
      talk_to_agent: ''
  higher_intent_before_offer:
    lineage:
    - datalake_sale_flows.sale_flow.higher_intent_before_offer
    description: Indicates the event with the higher intent before offer submission (VC>VB>TTA> no event = Offer_only)
    categories:
      Direct_Offer: Made an offer without performing any event before.
      TTA_before_OS: Talked to the agent before the offer.
      VB_before_OS: Only booked visits before the offer.
      VC_before_OS: Performed visits before the offer.
      "": If the buyer didn't perform any event before the offer or not even made an offer.
  higher_intent_after_offer:
    lineage:
    - datalake_sale_flows.sale_flow.higher_intent_after_offer
    description: Indicates the event with the higher intent after offer submission (VC>VB>TTA> no event = Direct_Offer)
    categories:
      TTA_after_OS: Talked to the agent after the offer.
      VB_after_OS: Booked a visit in the listing after the offer.
      VC_after_OS: Performed a visit in the listing after the offer.
      only_Offer: Stopped at the offer.
      "": If the buyer didn't perform any event after the offer or not even made an offer.
  rank_buyer_sale_flow:
    lineage:
    - datalake_sale_flows.sale_flow.rank_buyer_sale_flow
    description: Sale flow ordering in relation to the buyer
  rank_house_sale_flow:
    lineage:
    - datalake_sale_flows.sale_flow.rank_house_sale_flow
    description: Sale flow ordering in relation to the house
  is_buyer_first_sale_flow:
    lineage:
    - datalake_sale_flows.sale_flow.is_buyer_first_sale_flow
    description: If the flow is the first sale flow of the user's life
  is_house_first_sale_flow:
    lineage:
    - datalake_sale_flows.sale_flow.is_house_first_sale_flow
    description: >
      Boolean flag indicating whether this is the first sale flow associated
      with this house (rank_house_sale_flow = 1). False means the house had
      at least one earlier sale flow, from the same or a different buyer,
      before this one. Use together with rank_house_sale_flow to identify
      houses with multiple sale attempts.
  flow_type:
    lineage:
    - datalake_sale_flows.sale_flow.flow_type
    description: Combination of events that the flow received
    categories:
      OS: The buyer only performed offers.
      TTA: The buyer only talked to the agent.
      TTA_OS: The buyer talked to the agent and made an offer.
      VB: The buyer only booked visits.
      VB_OS: The buyer booked visits and made an offer.
      VB_TTA: The buyer booked visits and talked to the agent.
      VB_TTA_OS: The buyer booked visits, talked to the agent and made an offer.
      VB_VC: The buyer performed visits.
      VB_VC_OS: The buyer performed visits and made an offer.
      VB_VC_TTA: The buyer performed visits and talked to the agent.
      VB_VC_TTA_OS: The buyer performed visits, talked to the agent and made an offer.
  max_discount_proposed:
    lineage:
    - datalake_sale_flows.sale_flow.max_discount_proposed
    description: >
      Maximum discount percentage proposed across all offers in the sale flow,
      relative to the listing price. Calculated as
      (sale_price - min_offer_price) / sale_price across the flow's offers.
      Useful for understanding the widest negotiation gap reached in a flow,
      regardless of whether the deal was closed. For the effective discount on
      closed deals, prefer fact_offers.last_discount_proposed filtered by
      accepted offers.
  bookings:
    lineage:
    - datalake_sale_flows.sale_flow.bookings
    description: Number of visits booked related to the sale flow
  visits_completed:
    lineage:
    - datalake_sale_flows.sale_flow.visits_completed
    description: Number of visits completed related to the sale flow
  offers_submitted:
    lineage:
    - datalake_sale_flows.sale_flow.offers_submitted
    description: Number of offers submitted related to the sale flow
  tta_messages_sent:
    lineage:
    - datalake_sale_flows.sale_flow.tta_messages_sent
    description: Number of talk_to_agent messages related to the sale flow
  days_first_publication_to_first_event:
    lineage:
    - datalake_sale_flows.sale_flow.days_first_publication_to_first_event
    description: Days between the house first publication and the first event in the sale flow
  days_first_publication_to_first_booking_created:
    lineage:
    - datalake_sale_flows.sale_flow.days_first_publication_to_first_booking_created
    description: Days between the house first publication and the first booking in the sale flow
  days_first_publication_to_first_visit_completed:
    lineage:
    - datalake_sale_flows.sale_flow.days_first_publication_to_first_visit_completed
    description: Days between the house first publication and the first visit completed in the sale flow
  days_first_publication_to_first_offer_submitted:
    lineage:
    - datalake_sale_flows.sale_flow.days_first_publication_to_first_offer_submitted
    description: Days between the house first publication and the first offer submitted
      in the sale flow
  days_first_publication_to_first_offer_accepted:
    lineage:
    - datalake_sale_flows.sale_flow.days_first_publication_to_first_offer_accepted
    description: Days between the house first publication and the first offer accepted in the sale flow
  days_first_publication_to_sale_agreement_signed:
    lineage:
    - datalake_sale_flows.sale_flow.days_first_publication_to_sale_agreement_signed
    description: Days between the house first publication and sale agreement signed in the sale flow
  days_first_publication_to_house_registry_ended:
    lineage:
    - datalake_sale_flows.sale_flow.days_first_publication_to_house_registry_ended
    description: Days between the house first publication and house registry ended
      in the sale flow (it means that the sale process was completed)
  days_first_event_to_first_visit_completed:
    lineage:
    - datalake_sale_flows.sale_flow.days_first_event_to_first_visit_completed
    description: >
      Lead time in days between the flow's first event (first_event —
      a booking, an offer, or a talk-to-agent message, whichever happened
      first) and the first completed visit, computed as
      DATEDIFF(ts_first_visit_completed, ts_first_event). Differs from
      days_first_booking_created_to_first_visit_completed when the first
      event was not itself a booking (e.g. a direct offer or TTA message
      preceded any booking). Null when no visit was completed in the flow.
  days_first_event_to_first_offer_submitted:
    lineage:
    - datalake_sale_flows.sale_flow.days_first_event_to_first_offer_submitted
    description: >
      Lead time in days between the flow's first event (booking, offer, or
      talk-to-agent message) and the first offer submitted (OS), computed as
      DATEDIFF(ts_first_offer_submitted, ts_first_event). Equals 0 when the
      first event is itself the offer submission (first_event = 'offer').
      Null when no offer was submitted in the flow.
  days_first_event_to_first_offer_accepted:
    lineage:
    - datalake_sale_flows.sale_flow.days_first_event_to_first_offer_accepted
    description: >
      Lead time in days between the flow's first event (booking, offer, or
      talk-to-agent message) and the first offer acceptance (OA), computed
      as DATEDIFF(dt_first_offer_accepted, ts_first_event). Null when no
      offer was accepted in the flow.
  days_first_event_to_sale_agreement_signed:
    lineage:
    - datalake_sale_flows.sale_flow.days_first_event_to_sale_agreement_signed
    description: >
      Lead time in days between the flow's first event (booking, offer, or
      talk-to-agent message) and the sale agreement (CCV) signature,
      computed as DATEDIFF(dt_sale_agreement_signed, ts_first_event).
      Represents the full time-to-close from the buyer's first touchpoint.
      Null when the CCV was not signed.
  days_first_event_to_house_registry_ended:
    lineage:
    - datalake_sale_flows.sale_flow.days_first_event_to_house_registry_ended
    description: Days between the first event and house registry ended in the sale flow. (it means that the sale process was completed)
  days_first_booking_created_to_first_visit_completed:
    lineage:
    - datalake_sale_flows.sale_flow.days_first_booking_created_to_first_visit_completed
    description: >
      Lead time in days between the first visit booking and the first
      completed visit, computed as DATEDIFF(ts_first_visit_completed,
      ts_first_booking_created). Captures how long it took the buyer to
      actually attend after scheduling. Null when no booking was created or
      no visit was completed.
  days_first_booking_created_to_first_offer_submitted:
    lineage:
    - datalake_sale_flows.sale_flow.days_first_booking_created_to_first_offer_submitted
    description: >
      Lead time in days between the first visit booking and the first offer
      submitted (OS), computed as DATEDIFF(ts_first_offer_submitted,
      ts_first_booking_created). Can include cases where the offer was
      submitted before the booked visit took place. Null when no booking
      was created or no offer was submitted.
  days_first_booking_created_to_first_offer_accepted:
    lineage:
    - datalake_sale_flows.sale_flow.days_first_booking_created_to_first_offer_accepted
    description: >
      Lead time in days between the first visit booking and the first offer
      acceptance (OA), computed as DATEDIFF(dt_first_offer_accepted,
      ts_first_booking_created). Null when no booking was created or the
      offer was not accepted.
  days_first_booking_created_to_sale_agreement_signed:
    lineage:
    - datalake_sale_flows.sale_flow.days_first_booking_created_to_sale_agreement_signed
    description: >
      Lead time in days between the first visit booking and the sale
      agreement (CCV) signature, computed as
      DATEDIFF(dt_sale_agreement_signed, ts_first_booking_created). Null
      when no booking was created or the CCV was not signed.
  days_first_booking_created_to_house_registry_ended:
    lineage:
    - datalake_sale_flows.sale_flow.days_first_booking_created_to_house_registry_ended
    description: Days between the first booking and house registry ended in the sale flow. (it means that the sale process was completed)
  days_first_visit_completed_to_first_offer_submitted:
    lineage:
    - datalake_sale_flows.sale_flow.days_first_visit_completed_to_first_offer_submitted
    description: >
      Lead time in days between the first completed visit and the first
      offer submitted (OS), computed as DATEDIFF(ts_first_offer_submitted,
      ts_first_visit_completed). Useful to measure how quickly a visit
      converts into an offer. Null when no visit was completed or no offer
      was submitted.
  days_first_visit_completed_to_first_offer_accepted:
    lineage:
    - datalake_sale_flows.sale_flow.days_first_visit_completed_to_first_offer_accepted
    description: >
      Lead time in days between the first completed visit and the first
      offer acceptance (OA), computed as DATEDIFF(dt_first_offer_accepted,
      ts_first_visit_completed). Null when no visit was completed or the
      offer was not accepted.
  days_first_visit_completed_to_sale_agreement_signed:
    lineage:
    - datalake_sale_flows.sale_flow.days_first_visit_completed_to_sale_agreement_signed
    description: >
      Lead time in days between the first completed visit and the sale
      agreement (CCV) signature, computed as
      DATEDIFF(dt_sale_agreement_signed, ts_first_visit_completed). Null
      when no visit was completed or the CCV was not signed.
  days_first_visit_completed_to_house_registry_ended:
    lineage:
    - datalake_sale_flows.sale_flow.days_first_visit_completed_to_house_registry_ended
    description: Days between the first visit completed and house registry ended in the sale flow (it means that the sale process was completed)
  days_first_offer_submitted_to_first_offer_accepted:
    lineage:
    - datalake_sale_flows.sale_flow.days_first_offer_submitted_to_first_offer_accepted
    description: >
      Lead time in days between the first offer submitted (OS) and the
      first offer acceptance (OA), computed as
      DATEDIFF(dt_first_offer_accepted, ts_first_offer_submitted).
      Equivalent to the OS→OA conversion lead time tracked at the offer
      level in dw_sale.fact_offers.days_offer_submitted_to_offer_accepted.
      Null when the offer was not accepted.
  days_first_offer_submitted_to_sale_agreement_signed:
    lineage:
    - datalake_sale_flows.sale_flow.days_first_offer_submitted_to_sale_agreement_signed
    description: >
      Lead time in days between the first offer submitted (OS) and the sale
      agreement (CCV) signature, computed as
      DATEDIFF(dt_sale_agreement_signed, ts_first_offer_submitted). Null
      when the CCV was not signed.
  days_first_offer_accepted_to_sale_agreement_signed:
    lineage:
    - datalake_sale_flows.sale_flow.days_first_offer_accepted_to_sale_agreement_signed
    description: >
      Lead time in days between the first offer acceptance (OA) and the
      sale agreement (CCV) signature, computed as
      DATEDIFF(dt_sale_agreement_signed, dt_first_offer_accepted).
      Corresponds to the OA→CCV stage tracked at the offer level in
      dw_sale.fact_offers.days_offer_accepted_to_sale_agreement_signed. Null
      when the CCV was not signed.
  days_first_offer_submitted_to_house_registry_ended:
    lineage:
    - datalake_sale_flows.sale_flow.days_first_offer_submitted_to_house_registry_ended
    description: Days between the first offer submitted and house registry ended
      in the sale flow (it means that the sale process was completed)
  app_type:
    lineage:
    - datalake_amplitude_offer.sale_offer_raw_events.app_type
    - datalake_talk_to_agent.talk_to_agent_events.app_type
    - datalake_amplitude_visit.amplitude_visit.app_type
    - datalake_tracked_events.attribution_cross_channel.final_attribution_app_type
    description: Amplitude's app type
    categories:
      android: ''
      android_flutter: ''
      ios: ''
      web_desktop: ''
      web_mobile: ''
  utm_source:
    lineage:
    - datalake_amplitude_offer.sale_offer_raw_events.utm_source
    - datalake_talk_to_agent.talk_to_agent_events.utm_source
    - datalake_amplitude_visit.amplitude_visit.utm_source
    - datalake_tracked_events.attribution_cross_channel.final_attribution_source
    description: UTM used to track the advertising source
  utm_medium:
    lineage:
    - datalake_amplitude_offer.sale_offer_raw_events.utm_medium
    - datalake_talk_to_agent.talk_to_agent_events.utm_medium
    - datalake_amplitude_visit.amplitude_visit.utm_medium
    - datalake_tracked_events.attribution_cross_channel.final_attribution_medium
    description: UTM used to track the advertising medium
    categories:
      ? ''
      : ''
      CPC: ''
      b2b: ''
      branding: ''
      classifieds: ''
      copy_share: ''
      cpc: ''
      cpc?: ''
      custom_: ''
      custom_shar: ''
      custom_share: ''
      custom_sharey: ''
      display: ''
      email: ''
      listingOriginals: ''
      logo: ''
      notifications: ''
      performance_max: ''
      post: ''
      product: ''
      push: ''
      referrer: ''
      retargeting: ''
      seo: ''
      sms: ''
      social: ''
      whatsapp: ''
  utm_campaign:
    lineage:
    - datalake_amplitude_offer.sale_offer_raw_events.utm_campaign
    - datalake_talk_to_agent.talk_to_agent_events.utm_campaign
    - datalake_amplitude_visit.amplitude_visit.utm_campaign
    - datalake_tracked_events.attribution_cross_channel.final_attribution_campaign
    description: UTM used to identify the campaign in the media
  is_branded:
    lineage:
    - datalake_amplitude_offer.sale_offer_raw_events.branded
    - datalake_talk_to_agent.talk_to_agent_events.branded
    - datalake_amplitude_visit.amplitude_visit.branded
    - datalake_tracked_events.attribution_cross_channel.final_attribution_branded
    description: If the sale flow came from a branded campaign as defined by the lead taxonomy
  final_attribution_origin:
    description: >
      Final origin assigned by the cross-channel attribution model
      (datalake_tracked_events.attribution_cross_channel), when a matching
      visit_code is found for the flow's first event. Defaults to
      'old_attribution' when there is no cross-channel attribution match.
    lineage:
    - datalake_tracked_events.attribution_cross_channel.final_attribution_origin
  mkt_category:
    lineage:
    - datalake_gsheets_clean.taxonomy_demand.category
    description: Categoryl level of the Taxonomy
    categories:
      Inbound: ''
      Not Mapped: ''
  mkt_flow:
    lineage:
    - datalake_gsheets_clean.taxonomy_demand.flow
    description: Type of flow in the marketing funnel by the lead
    categories:
      Not Mapped: ''
      Other: ''
      Self-Service: ''
  mkt_completion:
    lineage:
    - datalake_gsheets_clean.taxonomy_demand.completion
    description: Type of completion of marketing funnel
    categories:
      Full Self-Service: ''
      Not Mapped: ''
      Other: ''
  mkt_origin:
    lineage:
    - datalake_gsheets_clean.taxonomy_demand.origin
    description: Origin of the sale flow in the marketing funnel
    categories:
      Not Mapped: ''
      Tenants PWA: ''
  mkt_channel:
    lineage:
    - datalake_gsheets_clean.taxonomy_demand.channel
    description: Channel level of the Taxonomy (used to describe the type of the channel)
  mkt_medium:
    lineage:
    - datalake_gsheets_clean.taxonomy_demand.medium
    description: Medium level of the taxonomy (used to describe the midia strategy)
    categories:
      Branding: ''
      Direct: ''
      Display: ''
      Lost Tracking: ''
      Not Mapped: ''
      Notifications: ''
      Online Classifieds: ''
      Other: ''
      Performance Max: ''
      Portals: ''
      Retargeting: ''
      SEM branded: ''
      SEM non-branded: ''
      SEO branded: ''
      SEO non-branded: ''
      Shared: ''
  mkt_source:
    lineage:
    - datalake_gsheets_clean.taxonomy_demand.source
    description: Source level of the taxonomy (used to describe the midia used)
  mkt_platform:
    lineage:
    - datalake_gsheets_clean.taxonomy_demand.platform
    description: Platform use by the lead in the marketing funnel
    categories:
      App Android: ''
      App iOS: ''
      Lost Tracking: ''
      Not Mapped: ''
      Web Desktop: ''
      Web Mobile: ''
  ts_first_listing:
    lineage:
    - datalake_sale_flows.sale_flow.ts_first_listing
    description: Timestamp date of first publication of the house in sale context
  ts_first_event:
    lineage:
    - datalake_sale_flows.sale_flow.ts_first_event
    description: Timestamp date first event of the flow
  ts_first_tta_message_sent:
    lineage:
    - datalake_sale_flows.sale_flow.ts_first_tta_message_sent
    description: Timestamp date of the first message sent through talk to agent feature in the flow
