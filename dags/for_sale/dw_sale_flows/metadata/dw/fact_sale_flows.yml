  days_first_event_to_house_registry_ended:
    lineage:
    - datalake_sale_flows.sale_flow.days_first_event_to_house_registry_ended
    description: Days between the first event and house registry ended in the sale
      flow. (it means that the sale process was completed)
  days_first_booking_created_to_first_visit_completed:
    lineage:
    - datalake_sale_flows.sale_flow.days_first_booking_created_to_first_visit_completed
    description: Days between the first booking and first visit completed in the sale
