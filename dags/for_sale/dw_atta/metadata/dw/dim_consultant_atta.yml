database_name: dw_atta
table_name: dim_consultant_atta
description: >-
  Atta staff/user dimension used to identify the financing consultant assigned to a proposal
  or pre-analysis. One row per Atta user account (sk_consultant, surrogate key = users_info.id_user).
  Referenced by dw_atta.fact_pre_analysis_proposal_flow via sk_consultant, which carries the
  consultant following a given pre-analysis/proposal in the mortgage-financing workflow. The
  same users_info source also underlies other Atta staff role ids exposed elsewhere as raw
  identifiers without a name/email lookup (e.g. fact_pre_analysis_proposal_flow.sk_registration_user,
  sk_proposal_created_by, sk_multibank_typist_user, and dim_proposal_atta.sk_credit_analyst /
  sk_juridical_analyst) — join those ids back to sk_consultant to resolve names for those roles too.
domain: For Sale
owner: helder.rodrigues@quintoandar.com.br
columns:
  sk_consultant:
    lineage:
    - datalake_atta_clean.users_info.id_user
    description: Surrogate key identifying the Atta staff user acting as financing consultant. Primary key of this dimension; referenced by dw_atta.fact_pre_analysis_proposal_flow.sk_consultant.
  consultant_name:
    lineage:
    - datalake_atta_clean.users_info.user_name
    - datalake_atta_clean.users_info.user_last_name
    description: Full name of the atta financing consultant (first and last name concatenated).
  consultant_email:
    lineage:
    - datalake_atta_clean.users_info.user_email
    description: Email address of the atta financing consultant.
  ts_load:
    description: ETL ingestion timestamp when this snapshot was written to the lake layer.
