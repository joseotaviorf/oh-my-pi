database_name: dw_atta
table_name: dim_pre_analysis_atta
description: >-
  Pre-analysis dimension for the Atta mortgage-financing workflow. A pre-analysis is the
  buyer's initial eligibility/credit screening step that precedes a formal financing proposal.
  One row per pre-analysis (sk_pre_analysis, surrogate key = datalake_atta_clean.pre_analysis.id_pre_analysis).
  sk_offer links the pre-analysis to the underlying For Sale offer in dw_sale.dim_offer /
  dw_sale.fact_offers.sk_offer, connecting the Atta financing process to the sale transaction
  it finances. Referenced by dw_atta.fact_pre_analysis_proposal_flow via sk_pre_analysis, which
  carries the same pre-analysis alongside every financing proposal generated from it (a single
  pre-analysis can have zero, one, or multiple proposals over its lifecycle).
domain: For Sale
owner: helder.rodrigues@quintoandar.com.br
columns:
  sk_pre_analysis:
    lineage:
    - datalake_atta_clean.pre_analysis.id_pre_analysis
    description: Surrogate key identifying the pre-analysis. Primary key of this dimension; referenced by dw_atta.fact_pre_analysis_proposal_flow.sk_pre_analysis.
  sk_offer:
    lineage:
    - datalake_atta_clean.pre_analysis.id_offer
    description: Foreign key to the underlying For Sale offer (dw_sale.dim_offer.sk_offer / dw_sale.fact_offers.sk_offer). Links the Atta financing pre-analysis to the sale transaction it is financing.
  sk_pre_analysis_status:
    lineage:
    - datalake_atta_clean.pre_analysis.status
    description: Raw numeric status code for the pre-analysis in Atta. No verified label mapping is available in this repo's SQL or in the Atta source code checked.
  sk_pre_analysis_situation:
    lineage:
    - datalake_atta_clean.pre_analysis.situation
    description: >-
      Raw numeric situation code for the pre-analysis lifecycle, matching Atta's
      SituacaoPreAnalise (SITUACAO_PRE_ANALISE) enum. No CASE mapping exists in this repo's SQL
      to surface the labels, so only the raw code is exposed here.
    categories:
      "1": "EM_PREENCHIMENTO — pre-analysis form is still being filled in."
      "2": "PROPOSTA_NAO_GERADA — no financing proposal has been generated yet."
      "3": "PROPOSTA_GERADA — a financing proposal has been generated from this pre-analysis."
      "4": "LINK_GERADO — a buyer-facing link was generated."
      "5": "LINK_EXPIRADO — the generated link expired."
      "6": "LINK_FINALIZADO — the generated link flow was completed."
      "7": "LINK_COPIADO — the generated link was copied."
      "8": "CCV_CANCELADO — the associated sale agreement (CCV) was canceled."
  sk_priority_status:
    lineage:
    - datalake_atta_clean.pre_analysis.priority_status
    description: >-
      Raw numeric priority code for the pre-analysis, matching Atta's PreAnalysisPriority
      (PRE_ANALYSIS_PRIORITY) enum. No CASE mapping exists in this repo's SQL to surface the
      labels, so only the raw code is exposed here.
    categories:
      "0": "UNDEFINED — no priority assigned."
      "1": "COMPLETED — pre-analysis already completed."
      "2": "URGENT — highest priority."
      "3": "HIGH — high priority."
      "4": "AVERAGE — average priority."
      "5": "LOW — low priority."
      "6": "DISPOSED — pre-analysis discarded/deprioritized."
  archive_reason:
    lineage:
    - datalake_atta_clean.pre_analysis.archive_reason
    description: 'Free-form reason logged when the pre-analysis was archived (e.g. "Arquivamento automático: Proposta Cancelada no Vendas"). Not backed by a fixed enum in Atta, so no categories are documented.'
  archive_complement:
    lineage:
    - datalake_atta_clean.pre_analysis.archive_complement
    description: Free-form complementary notes about why/how the pre-analysis was archived.
  created_source_description:
    lineage:
    - datalake_atta_clean.pre_analysis.created_source
    description: >-
      Origin channel that generated the pre-analysis. Built by mapping the raw created_source
      code (Atta's PreAnalisysSource enum) into a label for the five values seen in this
      pipeline; any other raw code (including Atta's own Closing=5 and
      MortgageManagementService=6 enum members) is passed through unmapped as the raw integer.
    categories:
      "iSolve": "created_source = 0 — pre-analysis created through Atta's iSolve internal tool."
      "Partner Link": "created_source = 1 — pre-analysis created through a partner-shared link."
      "Buyer Offer Sent": "created_source = 2 — pre-analysis created automatically once the buyer's offer was sent."
      "Cash Converted": "created_source = 3 — pre-analysis created from a cash purchase converted to financing."
      "Recreated": "created_source = 4 — pre-analysis recreated from a prior record."
  down_payment_amount:
    lineage:
    - datalake_atta_clean.pre_analysis.down_payment_amount
    description: Down payment amount in BRL that the buyer declared they would pay from their own resources at this pre-analysis stage.
  financing_value:
    lineage:
    - datalake_atta_clean.pre_analysis.financing_value
    description: Financing amount in BRL the buyer is seeking, as declared at this pre-analysis stage.
  house_value:
    lineage:
    - datalake_atta_clean.pre_analysis.house_value
    description: Declared property value in BRL used in the financing pre-analysis.
  is_archived:
    lineage:
    - datalake_atta_clean.pre_analysis.is_archived
    description: Boolean flag indicating whether the pre-analysis has been archived (no longer active in the workflow).
  ts_archived:
    lineage:
    - datalake_atta_clean.pre_analysis.ts_archived
    description: Timestamp when the pre-analysis was archived. Null while the pre-analysis remains active.
  ts_registration:
    lineage:
    - datalake_atta_clean.pre_analysis.ts_registration
    description: Timestamp when the pre-analysis was registered in Atta.
  ts_load:
    description: ETL ingestion timestamp when this snapshot was written to the lake layer.
