database_name: dw_atta
table_name: dim_franchise_atta
description: >-
  Franchise dimension for the Atta/Casa Mineira financing correspondent network. One row per
  franchise unit (sk_franchise, surrogate key = datalake_atta_clean.franchise_info.id_franchise),
  with the franchise's contract terms (royalties, marketing fund, grace periods, contract
  deadline/signature). Referenced by dw_atta.fact_pre_analysis_proposal_flow via sk_franchise,
  identifying which franchise a given pre-analysis/proposal was routed through; also joined
  from dw_atta.dim_partner_atta via sk_franchise for partners affiliated with a franchise.
  franchise_name matching '%Quinto Andar%' identifies the "Internal Corban" channel (QuintoAndar-
  operated correspondent) used across For Sale financing-attach and lead-time metrics.
domain: For Sale
owner: helder.rodrigues@quintoandar.com.br
columns:
  sk_franchise:
    lineage:
    - datalake_atta_clean.franchise_info.id_franchise
    description: Surrogate key identifying the franchise unit. Primary key of this dimension; referenced by dw_atta.fact_pre_analysis_proposal_flow.sk_franchise and dw_atta.dim_partner_atta.sk_franchise.
  sk_registration_user:
    lineage:
    - datalake_atta_clean.franchise_info.id_registration_user
    description: Identifier of the Atta user who registered/created this franchise record.
  sk_franchise_status:
    lineage:
    - datalake_atta_clean.franchise_info.id_franchise_status
    description: Identifier for the franchise's lifecycle status (e.g. active, blocked, without franchisee) in Atta. Raw status ids only; no verified label mapping available in this repo's SQL.
  franchise_name:
    lineage:
    - datalake_atta_clean.franchise_info.franchise_name
    description: Commercial name of the Casa Mineira franchise partner organization.
  sk_franchise_category:
    lineage:
    - datalake_atta_clean.franchise_info.franchise_category
    description: Raw numeric code for the franchise's contractual category (0/1). Same source value as franchise_category below, which maps it into the START/EXPERT labels.
  sk_franchise_type:
    lineage:
    - datalake_atta_clean.franchise_info.franchise_type
    description: Identifier for the franchise's business-line type in Atta. Raw type id only; no verified label mapping available in this repo's SQL.
  franchise_category:
    lineage:
    - datalake_atta_clean.franchise_info.franchise_category
    description: >-
      Franchise contract tier. Built by mapping the raw franchise_category code into START or
      EXPERT labels (1=EXPERT, 0=START; any other value yields no label).
    categories:
      "EXPERT": "Franchise contract tier 1 — Expert tier."
      "START": "Franchise contract tier 0 — Start tier (entry level)."
  royalties_percentage_value:
    lineage:
    - datalake_atta_clean.franchise_info.royalties_percentage_value
    description: Percentage of revenue owed as franchise royalties under contract.
  martketing_fund_percentage:
    lineage:
    - datalake_atta_clean.franchise_info.martketing_fund_percentage
    description: Percentage of revenue the franchise contributes to the shared marketing fund under contract (source column name keeps the upstream 'martketing' typo).
  grace_period_royalties:
    lineage:
    - datalake_atta_clean.franchise_info.grace_period_royalties
    description: Contractual grace period before royalty payments begin for the franchise.
  grace_period_tec:
    lineage:
    - datalake_atta_clean.franchise_info.grace_period_tec
    description: Grace period before technical fee payments apply for the franchise unit.
  ts_contract_deadline:
    lineage:
    - datalake_atta_clean.franchise_info.ts_contract_deadline
    description: Timestamp when the franchise's contract with QuintoAndar is due to expire.
  ts_registration:
    lineage:
    - datalake_atta_clean.franchise_info.ts_registration
    description: Timestamp when the franchise was registered in the atta platform.
  ts_franchise_signature:
    lineage:
    - datalake_atta_clean.franchise_info.ts_franchise_signature
    description: Timestamp when the franchise agreement was signed.
  ts_load:
    description: ETL ingestion timestamp when this snapshot was written to the lake layer.
