---
database_name: datalake_sale_journey
table_name: sale_journey
description: Data enriched with information from events made by a buyer. Each row in this table represents an event, so the objective is to apply the necessary business rules for user journey modeling.
domain: For Sale
owner: gabriel.firmino@quintoandar.com.br
columns:
  id_user:
    lineage:
      - datalake_sale_journey.sale_amplitude_contact.id_user
      - datalake_sale_journey.hub_services_contact.id_user
      - datalake_booking.booking.id_visitor
      - datalake_offer.sale_offer.id_buyer
    description: User identifier, we can use this identifier with many tables, mainly dim_user to get the information of these users.
  id_event_type:
    description: Event type identifier, with this identifier we can join with the dim_sale_event_type to get the descriptive data of that type of event.
  id_house:
    lineage:
      - datalake_booking.booking.id_house
      - datalake_offer.sale_offer.id_house
    description: house identifier
  action:
    lineage:
      - datalake_sale_journey.sale_amplitude_contact.action
      - datalake_sale_journey.hub_services_contact.action
    description: Description of the event made by the buyer.
    categories:
      'Active Search': Active search event, characterized by 3 amplitude events - search result page viewed, apply filters and listing page viewed.
      'Booking Agent': Visit scheduled by the agent.
      'Booking Buyer': Visit scheduled by the buyer.
      'Booking Secretary': Visit scheduled by the secretariat.
      'Booking Others': Visit scheduled by the others.
      'Visit Completed by Agent': Visit completed by the agent.
      'Visit Completed by Buyer': Visit completed by the buyer.
      'Visit Completed by Secretary': Visit completed by the secretary.
      'Offer Submitted': Offer submission event.
      'Offer Accepted': Offer accepted by owner.
      'Offer Rejected': Offer rejected by owner.
      'Visit Cancelled by Agent': Visit canceled by a broker.
      'Visit Cancelled by Buyer': Visit canceled by a buyer.
      'Visit Cancelled by Secretary': Visit canceled by secretary.
      'SV contact': Contact with the secretariat from the buyer.
      'SV contact TTS': Contact with the secretariat from the secretariat.
      'TALK_TO_SECRETARY': Event of contact with the secretariat, coming from amplitude.
  journey:
    description: Number of the buyer's current journey, this data is generated by a business rule where after 14 days of inactivity a journey ends and the next events generate new journeys.
  subjourney:
    description: Number of the buyer's current subday, this data is generated by a business rule that defines the subday according to the current day of the event.
  days_since_last_event:
    description: Days since last event is a pre-calculated metric in this enrich that will then be used in the model.  
  active_search_date:
    lineage:
      - datalake_sale_journey.sale_amplitude_contact.date
    description: This data works as a "sub event" we do not have an id_event_type for the active search event as it is an event used only in this modeling. Therefore, when this field is not null, we know that the record is from an active search event.
  dt_secretary_action:
    lineage:
      - datalake_sale_journey.sale_amplitude_contact.date
      - datalake_sale_journey.hub_services_contact.date
      - datalake_booking.booking.ts_booking_local_tz
      - datalake_booking.booking.ts_created
    description: This field also works as a "sub event", but in this case we use it to find out if the event was made by the secretariat.
  dt_agent_action:
    lineage:
      - datalake_booking.booking.date
    description: This field also works as a "sub event", but in this case we use it to find out if the event was made by the agent.
  dt_buyer_action:
    lineage:
      - datalake_sale_journey.hub_services_contact.date
      - datalake_booking.booking.date
    description: This field also works as a "sub event", but in this case we use it to find out if the event was made by the buyer.
  dt_event:
    lineage:
      - datalake_sale_journey.sale_amplitude_contact.date
      - datalake_sale_journey.hub_services_contact.date
      - datalake_booking.booking.ts_booking_local_tz
      - datalake_booking.booking.ts_created
      - datalake_offer.sale_offer.ts_offer_submitted
    description: Date of a user-made event.
  ts_event:
    lineage:
      - datalake_sale_journey.sale_amplitude_contact.ts_event
      - datalake_sale_journey.hub_services_contact.ts_event
      - datalake_booking.booking.ts_booking_local_tz
      - datalake_booking.booking.ts_created
      - datalake_offer.sale_offer.ts_offer_submitted
      - datalake_offer.sale_offer.dt_offer_accepted
      - datalake_offer.sale_offer.dt_offer_dismissed
    description: Date of a user-made event in timestamp format.
