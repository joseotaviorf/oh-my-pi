---
database_name: datalake_ebdb_clean
table_name: development_contact
domain: For Sale
description: Clean CDC mirror of contact persons linked to primary market developments from EBDB. One row per contact (PK id). Referenced by development.id_development_contact. Used to analyze which person UUID is associated with a development without exposing direct contact details.
owner: data-for-sale@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_ebdb_raw.developmentcontact.id
    description: Surrogate primary key of the development contact in EBDB.
  uuid_person:
    lineage:
      - datalake_ebdb_raw.developmentcontact.person_uuid
    description: UUID reference to the person entity in the identity domain.
  status:
    lineage:
      - datalake_ebdb_raw.developmentcontact.status
    description: Lifecycle status of the contact assignment for development operations.
    categories:
      ACTIVE: Contact is currently active for the linked development.
      INACTIVE: Contact assignment is no longer active.
  ts_effective:
    lineage:
      - datalake_ebdb_raw.developmentcontact.effective_date
    description: Timestamp when the contact assignment became effective, if recorded.
  ts_created:
    lineage:
      - datalake_ebdb_raw.developmentcontact.created_at
    description: Timestamp when the contact row was created in EBDB.
  ts_updated:
    lineage:
      - datalake_ebdb_raw.developmentcontact.updated_at
    description: Timestamp when the contact row was last updated in EBDB.
  op_cdc:
    description: CDC operation type captured by Debezium for this row change event.
    categories:
      r: Read/snapshot - initial load of existing records.
      c: Create - new record inserted.
      u: Update - existing record modified.
      d: Delete - record removed.
  ts_cdc_transaction:
    description: Timestamp when the CDC pipeline captured this change event with millisecond precision.
  ts_database_transaction:
    description: Timestamp of the originating database transaction in the EBDB source system.
