---
database_name: datalake_ebdb_clean
table_name: development_typology_unit
domain: For Sale
description: Clean CDC mirror of individual inventory units within a development typology from EBDB. One row per typology unit (PK id). Relates to house via id_house, development via id_development, and typology via id_development_typology. Used to track unit-level inventory and listing bridges.
owner: data-for-sale@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_ebdb_raw.developmenttypologyunit.id
    description: Surrogate primary key of the development typology unit in EBDB.
  id_house:
    lineage:
      - datalake_ebdb_raw.developmenttypologyunit.imovel_id
    description: Foreign key to the house (Imovel) record representing this physical unit.
  id_development:
    lineage:
      - datalake_ebdb_raw.developmenttypologyunit.development_id
    description: Foreign key to development that owns this typology unit.
  id_development_typology:
    lineage:
      - datalake_ebdb_raw.developmenttypologyunit.development_typology_id
    description: Foreign key to development_typology describing the unit configuration.
  ts_created:
    lineage:
      - datalake_ebdb_raw.developmenttypologyunit.created_at
    description: Timestamp when the typology unit row was created in EBDB.
  ts_updated:
    lineage:
      - datalake_ebdb_raw.developmenttypologyunit.updated_at
    description: Timestamp when the typology unit row was last updated in EBDB.
  op_cdc:
    description: CDC operation type captured by Debezium for this row change event.
    categories:
      r: Read/snapshot - initial load of existing records.
      c: Create - new record inserted.
      u: Update - existing record modified.
      d: Delete - record removed.
  ts_cdc_transaction:
    description: Timestamp when the CDC pipeline captured this change event with millisecond precision.
  ts_database_transaction:
    description: Timestamp of the originating database transaction in the EBDB source system.
