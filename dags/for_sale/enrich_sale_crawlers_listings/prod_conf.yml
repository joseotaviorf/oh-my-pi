---
#weekday: 0 = monday
tables:
  - table_name: em_casa
    depends_on:
      - em_casa_region_mapping
    is_incremental: false
  - table_name: loft
    depends_on:
      - loft_region_mapping
    is_incremental: false
  - table_name: loft_region_mapping
    weekday_run: 0
    is_incremental: true
    partition_cols:
      - dt_updated
  - table_name: loft_status_listing_flows
    depends_on:
      - loft_region_mapping
    is_incremental: false
  - table_name: em_casa_region_mapping
    weekday_run: 0
    is_incremental: true
    partition_cols:
      - ts_updated
  - table_name: em_casa_status_listing_flows
    depends_on:
      - em_casa_region_mapping
    is_incremental: false

custom_libraries:
  - maven:
      coordinates: "org.apache.sedona:sedona-python-adapter-3.0_2.12:1.2.1-incubating"
  - maven:
      coordinates: "org.datasyslab:geotools-wrapper:1.1.0-25.2"
  - pypi:
      package: apache-sedona==1.2.1
init_script:
  - s3:
      destination: "s3://artifacts.s3.data.quintoandar.com.br/sedona/sedona-init.sh"
      region: ""
spark_conf:
  spark.serializer: "org.apache.spark.serializer.KryoSerializer"
  spark.sql.extensions: "org.apache.sedona.viz.sql.SedonaVizExtensions,org.apache.sedona.sql.SedonaSqlExtensions"
  spark.kryo.registrator: "org.apache.sedona.core.serde.SedonaKryoRegistrator"
custom_cluster:
  driver_node_type_id: m5a.xlarge
  node_type_id: c5a.2xlarge
  num_workers: 3
  spark_version: 12.2.x-scala2.12
