database_name: datalake_sale_crawlers_listings
table_name: em_casa_region_mapping
description: Finds the id_neighborhood given the listing's latitude and longitude.
domain: For Sale
owner: guilherme.rocha@quintoandar.com.br
columns:
  id_house:
    lineage:
    - datalake_crawlers_listings_clean.em_casa.id
    description: ID with the competitor name together. In this case, <id>Loft.
  id_house_platform:
    lineage:
    - datalake_crawlers_listings_clean.em_casa.id
    description: External listing identifier assigned by the Em Casa marketplace crawler.
  id_status:
    lineage:
    - datalake_crawlers_listings_clean.em_casa.id
    description: ID with the competitor's platform name together and status row number.
      In this case, <id>EmCasa<status row number>.
  id_neighborhood:
    lineage:
    - datalake_ebdb_clean.map_region.id_neighborhood
    description: ID of the house listing's region.
  neighborhood:
    lineage:
    - datalake_crawlers_listings_clean.em_casa.neighborhood
    - datalake_ebdb_clean.polygon_region.neighborhood
    description: House listing neighborhood name.
  neighborhood_em_casa:
    lineage:
    - datalake_crawlers_listings_clean.em_casa.neighborhood
    - datalake_ebdb_clean.polygon_region.neighborhood
    description: House listing neighborhood name.
  is_last_status:
    description: Boolean indicating if this represent the last house status.
  is_first_status:
    description: Boolean indicating if this represent the first house status.
  ts_first_publication:
    lineage:
    - datalake_crawlers_listings_clean.em_casa.year
    - datalake_crawlers_listings_clean.em_casa.month
    - datalake_crawlers_listings_clean.em_casa.day
    description: Timestamp of this house first publication.
  ts_updated:
    lineage:
    - datalake_crawlers_listings_clean.em_casa.year
    - datalake_crawlers_listings_clean.em_casa.month
    - datalake_crawlers_listings_clean.em_casa.day
    description: Timestamp when this was updated.
  ts_last_extraction:
    lineage:
    - datalake_crawlers_listings_clean.em_casa.year
    - datalake_crawlers_listings_clean.em_casa.month
    - datalake_crawlers_listings_clean.em_casa.day
    description: Timestamp of this data last extraction.
  ts_load:
    description: Timestamp of when this data was loaded.
