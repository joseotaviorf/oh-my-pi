---
database_name: datalake_crawlers_listings
table_name: em_casa_status_listing_flows
description: Table with listings from Em Casa platform and their status changes.
domain: For Sale
owner: data-for-sale@quintoandar.com.br
columns:
    id_house:
        description: ID of the house. Concatenation of the id_house_platform and the label 'Emcasa'.
        lineage:
            - datalake_crawlers_listings.em_casa_region_mapping.id_house
    id_house_platform:
        description: ID of the house in the 'Emcasa' platform.
        lineage:
            - datalake_crawlers_listings.em_casa_region_mapping.id_house_platform
    id_neighborhood:
        description: ID of the neighborhood.
        lineage:
            - datalake_crawlers_listings.em_casa_region_mapping.id_neighborhood
    neighborhood:
        description: Neighborhood name.
        lineage:
            - datalake_crawlers_listings.em_casa_region_mapping.neighborhood
    status_history:
        description: Status of the listing (either 'Publicado' or 'Despublicado')
    is_last_status:
        description: Flag to indicate if the status shown is the listing's most recent one.
    weeks_published:
        description: Number of weeks the listing had the 'Publicado' status before changing to 'Despublicado'.
    weeks_unpublished:
        description: Number of weeks the listing had the 'Despublicado' status before changing to 'Publicado'.
    ts_last_extraction:
        description: Date of the table's last update.
        lineage:
            - datalake_crawlers_listings.em_casa_region_mapping.ts_updated
    ts_started_date:
        description: Date when the listing status started.
        lineage:
            - datalake_quintoandar.aux_date.date
    ts_ended_date:
        description: Date when the listing status ended. Calculated by the subtracting 7 days from the date when the
            listing's next status started.
        lineage:
            - datalake_quintoandar.aux_date.date
