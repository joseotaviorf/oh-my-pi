dag:
  name: enrich_sale_crawlers_listings
  owner: Data ForSale
  schedule_start_date: 2021, 7, 20
  schedule_interval: 0 6 * * 1
  documentation:
    dag_purpose: Creates enriched tables for the context Crawlers Listings from Loft. This schema has tables that extract data from the Loft website. The ingestion is incremental and full. The partitions for incremental tables are described below in Outputs section.
workflow:
  type: query_delta
  layer: enrich
  default_extraction_type: full
  inner_dependencies:
    loft:
      - loft_region_mapping
    loft_status_listing_flows:
      - loft_region_mapping
  tables_customization:
    loft_region_mapping:
      extraction_type: incremental
      partitions:
        - dt_updated
