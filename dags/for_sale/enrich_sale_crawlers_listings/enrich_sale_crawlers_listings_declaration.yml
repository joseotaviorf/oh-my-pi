dag:
  name: enrich_sale_crawlers_listings
  owner: Data ForSale
  schedule_start_date: 2021, 7, 20
  schedule_interval: 0 6 * * 1
  documentation:
    dag_purpose: Creates enriched tables for the context Crawlers Listings from Em Casa and Loft. This schema has tables that extract data from both websites. The ingestion is incremental and full. The partitions for incremental tables are described below in Outputs section.
workflow:
  type: query_delta
  layer: enrich
  default_extraction_type: full
  inner_dependencies:
    em_casa:
      - em_casa_region_mapping
    loft:
      - loft_region_mapping
    loft_status_listing_flows:
      - loft_region_mapping
    em_casa_status_listing_flows:
      - em_casa_region_mapping
  tables_customization:
    loft_region_mapping:
      extraction_type: incremental
      partitions:
        - dt_updated
    em_casa_region_mapping:
      extraction_type: incremental
      partitions:
        - ts_updated
cluster:
  type: custom_cluster_with_sedona
  custom_configurations:
    driver_node_type_id: r5a.xlarge
    node_type_id: m5.2xlarge
    num_workers: 3
    spark_version: 12.2.x-scala2.12
    spark_conf:
      spark.serializer: "org.apache.spark.serializer.KryoSerializer"
      spark.sql.extensions: "org.apache.sedona.viz.sql.SedonaVizExtensions,org.apache.sedona.sql.SedonaSqlExtensions"
      spark.kryo.registrator: "org.apache.sedona.core.serde.SedonaKryoRegistrator"
  custom_libraries:
    - maven:
        coordinates: "org.apache.sedona:sedona-python-adapter-3.0_2.12:1.2.1-incubating"
    - maven:
        coordinates: "org.datasyslab:geotools-wrapper:1.1.0-25.2"
    - pypi:
        package: apache-sedona==1.2.1
