cluster:
  type: emr_7_12_consolidation_m_memory_single_node_fleet_cluster
  # DAG-scoped Sedona with H3 (ST_H3CellIDs), matching growth/enrich_supply_leads.
  # JARs only: ST_* SQL is registered via spark.sql.extensions. Do not add
  # apache-sedona PyPI - 1.6.1 pulls rasterio, which has no aarch64 wheel on
  # EMR and fails bootstrap compiling against GDAL.
  custom_libraries:
  - maven:
      coordinates: org.apache.sedona:sedona-spark-shaded-3.5_2.12:1.6.1
  - maven:
      coordinates: org.datasyslab:geotools-wrapper:1.6.1-28.2
  custom_configurations:
    spark_conf:
      spark.serializer: org.apache.spark.serializer.KryoSerializer
      spark.sql.extensions: org.apache.sedona.viz.sql.SedonaVizExtensions,org.apache.sedona.sql.SedonaSqlExtensions
      spark.kryo.registrator: org.apache.sedona.core.serde.SedonaKryoRegistrator
