---
database_name: datalake_sale_primary_market
table_name: listing_sale_type
domain: For Sale
description: One row per house classifying it as PRIMARY or SECONDARY market and, when applicable, the development it belongs to. Single source of truth so other enrich/DW tables can join sale_type/id_development instead of re-deriving it.
owner: gustavo.rompe@quintoandar.com.br
columns:
  id_house:
    lineage:
      - datalake_ebdb_clean.listing_business_context.id_house
    description: Unique identifier of the house (Imovel) this classification applies to.
  sale_type:
    lineage:
      - datalake_ebdb_clean.listing_sale_model.sale_type
      - datalake_ebdb_clean.listing_sale_model.is_primary_market
    description: PRIMARY or SECONDARY market classification of the house's most recently updated SALE listing. Prefers the sale_type enum; falls back to the legacy is_primary_market boolean when sale_type is not yet populated.
  id_development:
    lineage:
      - datalake_ebdb_clean.development_typology_unit.id_development
      - datalake_ebdb_clean.house.id_development_typology
      - datalake_ebdb_clean.development_typology.id_development
    description: Development the house belongs to, if any. Resolved from the offer-created unit (development_typology_unit) when present, otherwise from the typology shell listing (house.id_development_typology). Null for secondary-market houses with no development link.
