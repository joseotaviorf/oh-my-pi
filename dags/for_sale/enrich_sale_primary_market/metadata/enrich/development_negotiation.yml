---
database_name: datalake_sale_primary_market
table_name: development_negotiation
domain: For Sale
description: >
  One row per primary-market pré-OS negotiation (DevelopmentNegotiation).
  Grain is id_development_negotiation. Strong key to Sales Flow is the unit
  Imovel (id_house = house.id_external). id_visit is an attribute on the
  negotiation, not a matching requirement for offer or flow. One visit can
  spawn several negotiations when the buyer wants more than one apt.
  id_house_shell is the listing the visit was booked on. id_house is the
  typology-unit Imovel minted for the proposal or offer. Offer attrs come from
  Sales Flow on that Imovel (prefer not canceled, then latest ts_created).
  is_published_unit is true when that unit has a DevelopmentListingUnit row.
  Actor must be filtered
  (AGENT vs DEMAND) to avoid broker inflation of pré-OS.
owner: gustavo.rompe@quintoandar.com.br
columns:
  id_development_negotiation:
    lineage:
      - datalake_ebdb_clean.development_negotiation.id
    description: Primary key of the pré-OS negotiation event in EBDB DevelopmentNegotiation.
  id_development:
    lineage:
      - datalake_ebdb_clean.development_negotiation.id_development
    description: Empreendimento this negotiation belongs to. Native on the negotiation, not inferred from the visit house.
  id_visit:
    lineage:
      - datalake_ebdb_clean.development_negotiation.id_visit
    description: Visit stored on the negotiation as origin context, not used to match Sales Flow. Several negotiations may share the same visit when two apts are proposed after one visit. Null if the negotiation has no visit yet.
  id_house_shell:
    lineage:
      - datalake_ebdb_clean.visit.id_house
    description: House id of the listing the visit was booked on. Visits stay on this listing Imovel; they are not booked on the minted offer house. Distinct from id_house. Null when id_visit is null or the visit row is missing.
  id_visitor:
    lineage:
      - datalake_ebdb_clean.visit.id_visitor
    description: Platform user who is the visitor on the linked visit. Null when there is no visit row.
  id_demand:
    lineage:
      - datalake_ebdb_clean.development_negotiation.id_demand
    description: Demand-side user on the negotiation when actor is DEMAND. Null for agent-led events.
  id_agent:
    lineage:
      - datalake_ebdb_clean.development_negotiation.id_agent
    description: Agent on the negotiation when actor is AGENT. Null for demand-led events. Not the visit agent unless they coincide.
  id_development_negotiation_unit:
    lineage:
      - datalake_ebdb_clean.development_negotiation_unit.id
    description: DevelopmentNegotiationUnit link for this negotiation. Null when no unit is attached yet.
  id_development_typology_unit:
    lineage:
      - datalake_ebdb_clean.development_negotiation_unit.id_development_typology_unit
    description: Concrete typology unit (apto) under this negotiation. Imovel on this row is the house Sales Flow uses for the offer.
  id_house:
    lineage:
      - datalake_ebdb_clean.development_typology_unit.id_house
    description: House id of the typology unit (EBDB Imovel.id / DevelopmentTypologyUnit.imovel_id), distinct from id_house_shell. Same identifier as datalake_sales_flow_clean.house.id_external, not sales_flow.house_id. One negotiation has one unit Imovel; a later offer on the same physical apt mints a new Imovel and a new negotiation. Null when no unit is linked.
  id_offer:
    lineage:
      - datalake_sales_flow_clean.offer.id
    description: Sales Flow offer.id linked only when house.id_external equals this negotiation unit Imovel. Visit is not part of that join. Null when the unit house is missing or no matching flow exists. If several flows share the Imovel, the non-canceled latest flow (then latest offer) is kept. Numeric offer id, not Firestore.
  id_sales_flow:
    lineage:
      - datalake_sales_flow_clean.sales_flow.id
    description: Sales Flow wrapping the latest matching offer. Null when id_offer is null.
  id_development_typology:
    lineage:
      - datalake_ebdb_clean.development_typology_unit.id_development_typology
    description: Floor-plan typology of the unit house. Join key to development_typology and to the shell listing of the same mold.
  id_development_listing_unit:
    lineage:
      - datalake_ebdb_clean.development_listing_unit.id
    description: ListingUnit row when this unit is published on the catalog. Null means offer-only unit (not a vitrine listing).
  id_listing_business_context:
    lineage:
      - datalake_ebdb_clean.development_listing_unit.id_listing_business_context
    description: SALE listing business context of the published unit, when ListingUnit exists. Not the shell listing LBC.
  id_development_contact:
    lineage:
      - datalake_ebdb_clean.development.id_development_contact
    description: Current development contact FK from the empreendimento (gestor). Not a history of contacts.
  uuid_event:
    lineage:
      - datalake_ebdb_clean.development_negotiation.uuid_event
    description: Idempotency UUID of the event that created this negotiation in the Development domain.
  actor:
    lineage:
      - datalake_ebdb_clean.development_negotiation.actor
    description: Who opened the pré-OS. AGENT is broker-created; DEMAND is buyer-created. Filter this before counting propostas so broker volume does not inflate the funnel.
    categories:
      AGENT: Negotiation recorded by or for a broker.
      DEMAND: Negotiation recorded by or for the buyer.
  flow_step:
    lineage:
      - datalake_sales_flow_clean.sales_flow.flow_step
    description: High-level Sales Flow lifecycle of the latest matching flow (proposal, post-CCV, canceled, completed). Null when no flow matches. Same values as datalake_sales_flow_clean.sales_flow.flow_step.
  offer_status:
    lineage:
      - datalake_sales_flow_clean.offer.status
    description: Negotiation status of the latest matching offer (ongoing, accepted, rejected, validated, and related states). Null when no offer matches. Same values as datalake_sales_flow_clean.offer.status.
  offer_price:
    lineage:
      - datalake_sales_flow_clean.offer.offer_price
    description: Price initially proposed by the buyer on the latest matching offer, in BRL. Null when no offer matches.
  sale_price:
    lineage:
      - datalake_sales_flow_clean.offer.sale_price
    description: Listing price of the property at the time of the latest matching offer, in BRL. Null when no offer matches.
  final_price:
    lineage:
      - datalake_sales_flow_clean.offer.final_price
    description: Final price agreed between buyer and seller on the latest matching offer, in BRL. Null when no offer matches or the deal has no agreed price yet.
  is_published_unit:
    lineage:
      - datalake_ebdb_clean.development_listing_unit.id
    description: True when the typology unit has a DevelopmentListingUnit row (apt is a published listing). False when the unit exists only for the offer. Null when there is no unit.
  ts_created:
    lineage:
      - datalake_ebdb_clean.development_negotiation.ts_created
    description: Timestamp when the negotiation row was created in EBDB.
  ts_updated:
    lineage:
      - datalake_ebdb_clean.development_negotiation.ts_updated
    description: Timestamp when the negotiation row was last updated in EBDB.
  ts_sales_flow_created:
    lineage:
      - datalake_sales_flow_clean.sales_flow.ts_created
    description: Timestamp when the latest matching sales flow was created. Null when no flow matches.
