database_name: datalake_legalops_clean
table_name: document_attachment
domain: For Sale
owner: helder.rodrigues@quintoandar.com.br
description: Table with document attachments used in contract analysis.
columns:
  id:
    description: Unique ID for the document attachment record.
    lineage:
    - datalake_legalops_raw.document_attachment.id
  attachment_name:
    description: Name of the attached document.
    lineage:
    - datalake_legalops_raw.document_attachment.attachment_name
  document_id:
    description: Identifier of the document in the storage service.
    lineage:
    - datalake_legalops_raw.document_attachment.document_id
  document_file_type:
    description: File type of the document (e.g. PDF, DOCX).
    lineage:
    - datalake_legalops_raw.document_attachment.document_file_type
  service_owner:
    description: Service that owns or created this attachment (e. g. DOCX, BlobVault).
    lineage:
    - datalake_legalops_raw.document_attachment.service_owner
  ts_created:
    description: Timestamp when the document attachment was created.
    lineage:
    - datalake_legalops_raw.document_attachment.created_at
  ts_updated:
    description: Timestamp of the last update to the document attachment.
    lineage:
    - datalake_legalops_raw.document_attachment.updated_at
  year:
    description: Year partition for the document attachment record.
    lineage:
    - datalake_legalops_raw.document_attachment.year
  month:
    description: Month partition for the document attachment record.
    lineage:
    - datalake_legalops_raw.document_attachment.month
  day:
    description: Day partition for the document attachment record.
    lineage:
    - datalake_legalops_raw.document_attachment.day
