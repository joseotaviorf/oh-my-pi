database_name: dw_sale
table_name: fact_sale_subjourney
description: This table aims to provide buyer data from the first event to the stage of sending the offer, making a cut of 14 days of inactivity. The granularity of this table is subjourney, always using the last event record of the day.
domain: For Sale
owner: gabriel.firmino@quintoandar.com.br
columns:
  sk_subjourney:
    description: Unique subjourney identifier, generated with the MD5 function using id_user, journey number and subjourney number.
    lineage:
      - datalake_sale_journey.sale_journey.id_user
      - datalake_sale_journey.sale_journey.journey
      - datalake_sale_journey.sale_journey.subjourney
  bk_subjourney:
    description: Business key, identifier that represents the data used to generate the unique identifier of this table (sk_subjourney).
    lineage:
      - datalake_sale_journey.sale_journey.id_user
      - datalake_sale_journey.sale_journey.journey
      - datalake_sale_journey.sale_journey.subjourney
  sk_journey:
    description: Unique journey identifier, generated with the MD5 function using id_user and journey number.
    lineage:
      - datalake_sale_journey.sale_journey.id_user
      - datalake_sale_journey.sale_journey.journey
  bk_journey:
    description: Business key, identifier that represents the data used to generate the journey identifier (sk_journey).
    lineage:
      - datalake_sale_journey.sale_journey.id_user
      - datalake_sale_journey.sale_journey.journey
  sk_user:
    description: User identifier.
    lineage:
      - datalake_sale_journey.sale_journey.id_user
  sk_event_type:
    description: Event type identifier, this data can be used with the dim_sale_event_type table to obtain descriptive data.
    lineage:
      - datalake_sale_journey.sale_journey.id_event_type
  sk_house:
    description: Identifier of the house of the last event in the subjourney.
    lineage:
      - datalake_sale_journey.sale_journey.id_house
  sk_event_date:
    description: Date the event was made, in identifier format.
    lineage:
      - datalake_sale_journey.sale_journey.dt_event
  sk_active_search_date:
    description: Date the active fetch event was made, in identifier format.
    lineage:
      - datalake_sale_journey.sale_journey.dt_active_search
  sk_secretary_action_date:
    description: Date that records a secretariat action, in identifier format.
    lineage:
      - datalake_sale_journey.sale_journey.dt_secretary_action
  sk_agent_action_date:
    description: Date that records a broker's action, in identifier format.
    lineage:
      - datalake_sale_journey.sale_journey.dt_agent_action
  sk_buyer_action_date:
    description: Date that records a buyer's action, in identifier format.
    lineage:
      - datalake_sale_journey.sale_journey.dt_buyer_action
  journey:
    description: Current buyer journey number.
    lineage:
      - datalake_sale_journey.sale_journey.journey
  subjourney:
    description: Current buyer subjourney number.
    categories:
      '1': 1st day of event
      '2': 2nd day of event
      '3': 3rd day of event
      '4': 4th day of event
      '5': From 5th event day to 7th event day
      '6': Above 7th event day
    lineage:
      - datalake_sale_journey.sale_journey.subjourney
  days_since_last_event:
    description: Days since the last event made by the buyer.
    lineage:
      - datalake_sale_journey.sale_journey.days_since_last_event
