database_name: dw_sale
table_name: fact_sale_journey
description: The purpose of this table is to provide data for a buyer's follow-up analysis. The granularity of this table is journey (each row represents a buyer's journey). The journey is defined by the cut of 14 days of inactivity
domain: For Sale
owner: gabriel.firmino@quintoandar.com.br
columns:
  sk_journey:
    description: Unique journey identifier, generated with the MD5 function using id_user and journey number.
    lineage:
      - datalake_sale_journey.sale_journey.id_user
      - datalake_sale_journey.sale_journey.journey
  bk_journey:
    description: Business identification key, this represents the data used to generate the sk_journey.
    lineage:
      - datalake_sale_journey.sale_journey.id_user
      - datalake_sale_journey.sale_journey.journey
  sk_user:
    description: User identification key.
    lineage:
      - datalake_sale_journey.sale_journey.id_user
  sk_journey_started_date:
    description: Date the journey was created.
    lineage:
      - datalake_sale_journey.sale_journey.dt_event
  sk_journey_ended_date:
    description: Date on which the journey ended.
    lineage:
      - datalake_sale_journey.sale_journey.dt_event
  days_of_journey:
    description: Days of a journey to the present day.
  days_since_last_journey:
    description: Days since the last journey made by the user.
  days_with_events:
    description: Count of distinct days with events which this user had in this journey.
  total_past_journey:
    description: Total journeys made by users.
    lineage:
      - datalake_sale_journey.sale_journey.journey
  ts_load:
    description: Timestamp indicating when the data was loaded.
