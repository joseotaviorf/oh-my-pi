database_name: dw_sale
table_name: dim_offer
description: This tables shows details and characteristics about all sale offers.
  Each line is an offer submitted.
domain: For Sale
owner: data-for-sale@quintoandar.com.br
columns:
  sk_offer:
    lineage:
    - datalake_sale_offer.sale_offers.id_offer
    description: Hash ID offer from firestore
  offer_status:
    lineage:
    - datalake_sale_offer.sale_offers.offer_status
    description: Offer status
    categories:
      Chat em branco: ''
      Contra Buyer: ''
      Contra Seller: ''
      Corretor Vendedor: ''
      Descarte Pós Aceite: ''
      Invalid Offer: ''
      Negociação fora do 5A: ''
      Não tratado: ''
      OA em validação: ''
      Offer Accepted: ''
      Offer Rejected: ''
      Offer Sent: ''
      Offer validated: ''
      Sem Contato - Buyer: ''
      Sem Contato - Seller: ''
      Stand By: ''
      Teste Corretor: ''
  drop_reason:
    lineage:
    - datalake_sale_offer.sale_offers.drop_reason
    description: Reason why the offer dropped before sale agreement signature
  drop_reason_responsible:
    lineage:
    - datalake_sale_offer.sale_offers.drop_reason_responsible
    description: Responsible by Reason why the offer dropped before sale agreement
      signature
    categories:
      Buyer: ''
      Other: ''
      Seller: ''
  payment_method:
    lineage:
    - datalake_sale_offer.sale_offers.current_payment_method
    description: Payment method chose to accomplish sale transaction. It can be in
      cash, financed or undecided
    categories:
      CASH: ''
      FINANCED: ''
      FINANCED_OUTSIDE_5A: ''
      UNDECIDED: ''
  business_unit:
    lineage:
    - datalake_sale_offer.sale_offers.business_unit
    description: The business unit that originated the offer.
  offer_flow:
    lineage:
    - datalake_sale_offer.sale_offers.offer_flow
    description: Negotiation model that originated the offer (Hub, Deal Making or
      Closing Central).
  credit_model:
    lineage:
    - datalake_sale_offer.sale_offers.credit_model
    description: Offer credit model
  registry_price:
    lineage:
    - datalake_sale_offer.sale_offers.registry_price
    description: Cost of the registrations changes and house documentation
  itbi_price:
    lineage:
    - datalake_sale_offer.sale_offers.itbi_price
    description: Cost of the tax for sale real estate transactions
  payment_entry_amount:
    lineage:
    - datalake_sale_offer.sale_offers.payment_entry_amount
    description: Amount of the sale value that will be applied as a down payment on
      the financing
  sale_price:
    lineage:
    - datalake_sale_offer.sale_offers.sale_price
    description: Sale price set on listing
  is_3p_supply:
    lineage:
    - datalake_sale_offer.sale_offers.is_3p_supply
    description: Flag if supply belongs to a 3P partner
  is_3p_demand:
    lineage:
    - datalake_sale_offer.sale_offers.is_3p_demand
    description: Flag if offer was submitted by a 3P demand agent
  is_a_rescued_offer:
    lineage:
    - datalake_sale_offer.sale_offers.is_a_rescued_offer
    description: Boolean to identify if this offer is a rescued one (An offer that
      was cancelled and opened again)
  has_used_fgts_in_payment:
    lineage:
    - datalake_sale_offer.sale_offers.has_used_fgts_in_payment
    description: If part of the payment will use some amount from the FGTS fund
  has_used_negotiation_chat:
    lineage:
    - datalake_sale_offer.sale_offers.has_used_negotiation_chat
    description: If the offer deal happened through the negotiation chat
  tags_from_salesflow:
    lineage:
    - datalake_sale_offer.sale_offers.tags_from_salesflow
    description: Tags from the sales flow associated with the offer
  ts_offer_submitted:
    lineage:
    - datalake_sale_offer.sale_offers.ts_offer_submitted
    description: Datetime of offer submission
  ts_updated:
    lineage:
    - datalake_sale_offer.sale_offers.ts_updated
    description: Datetime of offer last update
  app_type:
    lineage:
    - datalake_gsheets_clean.taxonomy_demand.app_type
    - datalake_tracked_events.attribution_cross_channel.final_attribution_app_type
    description: Amplitude's app type
    categories:
      ? ''
      : ''
      android: ''
      android_flutter: ''
      ios: ''
      web_desktop: ''
      web_mobile: ''
  utm_source:
    lineage:
    - datalake_gsheets_clean.taxonomy_demand.utm_source
    - datalake_tracked_events.attribution_cross_channel.final_attribution_source
    description: UTM used to track the advertising source
  utm_medium:
    lineage:
    - datalake_gsheets_clean.taxonomy_demand.utm_medium
    - datalake_tracked_events.attribution_cross_channel.final_attribution_medium
    description: UTM used to track the advertising medium
    categories:
      ? ''
      : ''
      CPC: ''
      branding: ''
      classifieds: ''
      copy_share: ''
      cpc: ''
      custom_shar: ''
      custom_share: ''
      display: ''
      email: ''
      logo: ''
      notifications: ''
      performance_max: ''
      referrer: ''
      retargeting: ''
      seo: ''
      sms: ''
      social: ''
      whatsapp: ''
  utm_campaign:
    lineage:
    - datalake_amplitude_offer.sale_offer_raw_events.utm_campaign
    - datalake_tracked_events.attribution_cross_channel.final_attribution_campaign
    description: UTM used to identify the campaign in the media
  final_attribution_origin:
    lineage:
    - datalake_tracked_events.attribution_cross_channel.final_attribution_origin
    description: Used to identify the category of the final attribution origin
  mkt_category:
    lineage:
    - datalake_gsheets_clean.taxonomy_demand.category
    description: Standard category from the offer
    categories:
      Inbound: ''
      Not Mapped: ''
  mkt_flow:
    lineage:
    - datalake_gsheets_clean.taxonomy_demand.flow
    description: Type of flow in the marketing funnel by the lead
    categories:
      Not Mapped: ''
      Other: ''
      Self-Service: ''
  mkt_completion:
    lineage:
    - datalake_gsheets_clean.taxonomy_demand.completion
    description: Type of completion of marketing funnel by the lead
    categories:
      Full Self-Service: ''
      Not Mapped: ''
      Other: ''
  mkt_origin:
    lineage:
    - datalake_gsheets_clean.taxonomy_demand.origin
    description: Origin of the lead in the marketing funnel
    categories:
      Not Mapped: ''
      Tenants PWA: ''
  mkt_channel:
    lineage:
    - datalake_gsheets_clean.taxonomy_demand.channel
    description: Channel level of the Taxonomy (used to describe the type of the channel)
  mkt_medium:
    lineage:
    - datalake_gsheets_clean.taxonomy_demand.medium
    description: Medium level of the taxonomy (used to describe the midia strategy)
    categories:
      Branding: ''
      Direct: ''
      Display: ''
      Lost Tracking: ''
      Not Mapped: ''
      Notifications: ''
      Online Classifieds: ''
      Other: ''
      Performance Max: ''
      Portals: ''
      Retargeting: ''
      SEM branded: ''
      SEM non-branded: ''
      SEO branded: ''
      SEO non-branded: ''
      Shared: ''
  mkt_source:
    lineage:
    - datalake_gsheets_clean.taxonomy_demand.source
    description: Source level of the taxonomy (used to describe the midia used)
  mkt_platform:
    lineage:
    - datalake_gsheets_clean.taxonomy_demand.platform
    description: Platform use by the lead in the marketing funnel
    categories:
      App Android: ''
      App iOS: ''
      Lost Tracking: ''
      Not Mapped: ''
      Web Desktop: ''
      Web Mobile: ''
  is_branded:
    lineage:
    - datalake_amplitude_offer.sale_offer_raw_events.branded
    - datalake_tracked_events.attribution_cross_channel.final_attribution_branded
    description: If this offer came from a branded campaign as defined by the demand
      taxonomy
  ts_load:
    description: Timestamp when the data was loaded on datalake
