database_name: dw_sale
table_name: dim_sale_agreement
description: >
  CCV (Compromisso de Compra e Venda / sale agreement contract) dimension. One row per offer that
  reached the sale-agreement stage — only populated once ts_sale_agreement_signed is set upstream,
  so it must always be LEFT JOINed from dw_sale.fact_offers via sk_offer (not every offer has a
  row here). Holds CCV-specific attributes that belong on the contract rather than on the offer
  itself: payment_method, payment_model, credit_model, cancellation reason, and the due-diligence
  (*_dilligence_status) fields covering house, seller, and report review. Complements
  dw_sale.fact_offers (EoF timestamps and measures) and dw_sale.dim_offer (offer-level negotiation
  attributes); for post-CCV Closed Deal (CD) tracking, join dw_sale.fact_closing_flows via sk_offer.
domain: For Sale
owner: helder.rodrigues@quintoandar.com.br
columns:
  sk_offer:
    lineage:
    - datalake_sale_offer.sale_offer.id_offer
    description: Offer unique identifier.
  sale_type:
    lineage:
    - datalake_sale_offer.sale_offer.sale_type
    description: Market type of the offer associated with the sale agreement. PRIMARY identifies a new-build unit offer and SECONDARY identifies a resale offer. NULL is preserved when the upstream offer has no classification.
    categories:
      PRIMARY: Sale agreement for a Primary Market (new-build) unit.
      SECONDARY: Sale agreement for a Secondary Market (resale) listing.
  ccv_type:
    lineage:
      - datalake_sale_offer.sale_offer.ccv_type
    description: >
      Derived classification of the CCV (sale agreement) type, based on whether
      it follows the 5A model.
    categories:
      "Default 5A CCV": "Sale agreement follows QuintoAndar's standard 5A commercial model."
      "Not a 5A CCV Model": "Sale agreement does not follow the 5A model (custom or alternative commercial terms)."
      "Unknown": "5A-model classification could not be determined for this sale agreement."
      "": "No CCV type value was populated for this sale agreement."
  sale_agreement_status:
    lineage:
      - datalake_sale_offer.sale_offer.sale_agreement_status
    description: >
      Current (most recent) status of the sale agreement (CCV) flow in
      SalesFlow, taken from the latest ccv_flow record for the sales flow
      (ordered by ts_updated). This reflects the flow's live state and is not
      frozen at signature — a signed CCV (ts_sale_agreement_signed populated)
      can still show a later status such as SEND_TO_OPERATIONS_SUPPORT,
      SEND_TO_CCV_QUEUE, or NO_RETURN_FROM_BUYER_OR_SELLER, since ccv_flow
      keeps advancing through post-signature steps. Do not assume this field
      equals 'signed' just because ts_sale_agreement_signed is not null.
    categories:
      SIGNED: "Sale agreement (CCV) has been signed"
      PENDING_DOCUMENTATION: "Waiting on required documentation before the CCV can proceed"
      SEND_TO_BE_SIGNED: "CCV sent for signature"
      SEND_TO_OPERATIONS_SUPPORT: "CCV sent to operations support"
      SEND_TO_CCV_QUEUE: "CCV queued for processing"
      NO_RETURN_FROM_BUYER_OR_SELLER: "No response received from buyer or seller"
  offer_flow:
    lineage:
      - datalake_sale_offer.sale_offer.offer_flow
    description: >
      Derived Offer Flow (Negotiation Model) classification. Returns 'DEAL_MAKING'
      for deal-making flows, otherwise the underlying sales flow type (e.g. Hub
      or Central) or 'NOT DEFINED' when not set.
    categories:
      HUB: "Standard Hub model — offer managed by a Negotiation Executive (EN) in the centralized Hub team."
      CLOSING_CENTRAL: "Closing Central model — offer managed by the Closing Central team (more specialized negotiation support)."
      DEFAULT: "Default/legacy flow — used for older offers or when the flow was not explicitly defined."
  business_unit:
    lineage:
      - datalake_sale_offer.sale_offer.business_unit
    description: >
      Name of the business unit (hub) responsible for the offer: Deal Making
      (DM) or a specific Hub or Central cell.
  sale_agreement_cancellation_reason:
    lineage:
      - datalake_sale_offer.sale_offer.sale_agreement_cancellation_reason
    description: Reason for cancellation of the sale agreement (CCV), when applicable.
    categories:
      Buyer Desistiu: "Buyer withdrew from the transaction, canceling the signed sale agreement."
      COVID: "Sale agreement cancelled due to COVID-19 pandemic-related circumstances."
      Modelo QA: "Cancelled because a party did not accept QuintoAndar's commercial (5A) model terms."
      Não se Aplica: "Not applicable — no specific cancellation reason recorded for this sale agreement."
      Reprovado Crédito: "Buyer's mortgage/credit application was rejected, causing the CCV to be cancelled."
      Reprovado Diligência: "Due diligence review failed (legal/documentation issue), causing the CCV to be cancelled."
      Seller Desistiu: "Seller withdrew from the transaction, canceling the signed sale agreement."
  sale_price_agreed:
    lineage:
      - datalake_sale_offer.sale_offer.sale_price_agreed
    description: >
      Final price agreed between buyer and seller for the property (CCV value,
      in BRL). Only populated once the offer is accepted or the sale agreement
      is signed — this is the negotiated contract price, not the original
      listing price. Use this field together with dim_offer.sale_price to
      compute the effective seller discount:
      discount = (sale_price - sale_price_agreed) / sale_price.
  brokerage_fee:
    lineage:
      - datalake_sale_offer.sale_offer.brokerage_fee
    description: >
      Brokerage fee percentage charged on the transaction, applied over
      sale_price_agreed. Defaults to 0.06 (6%) when not explicitly set.
  payment_method:
    lineage:
      - datalake_sale_offer.sale_offer.current_payment_method
    description: >
      Current payment method chosen for the offer (e.g. Cash, Financed).
      Also see dimension 'Has Used FGTS in Payment?' to check if the payment
      method includes FGTS.
    categories:
      CASH: "Cash purchase, not using FGTS funds."
      CASH_USING_FGTS: "Cash purchase using FGTS (severance fund) funds."
      FINANCED: "Financed (mortgage) purchase, not using FGTS funds."
      FINANCED_USING_FGTS: "Financed (mortgage) purchase using FGTS funds."
      NOT_DEFINED: "Payment method not yet decided (legacy alias 'UNDECIDED')."
  payment_model:
    lineage:
      - datalake_sale_offer.sale_offer.payment_model
    description: >
      Payment model used in the purchase of the property (e.g. CCV_ASSISTANCE,
      INSTANT_MORTGAGE).
    categories:
      MODEL_5A: "Legacy '5A' model (Repasses), where QuintoAndar holds and passes through payments."
      CLOSING_3P: "Closing handled by a partner real-estate agency (Rede) rather than directly by QuintoAndar."
      TRANSFER_BETWEEN_PARTS: "Payment happens directly between buyer and seller, without QuintoAndar's standard flow."
      CLOSING_PRIMARY_MARKET: "Closing for a primary-market (new/developer) property purchase."
      CCV_ASSISTANCE: "QuintoAndar only assists with the sale agreement (CCV), without managing the full closing."
      INSTANT_MORTGAGE: "Fast-track mortgage model (\"Chave Antecipada\") allowing early key delivery."
      ADVANCED_PAYMENT: "Standard payment model with an advance/down payment."
      NA: "Not applicable / not defined for this offer."
      BROKERAGE_TERM: "Payment is governed by a brokerage term (Termo de Corretagem) rather than the standard flow."
  credit_model:
    lineage:
      - datalake_sale_offer.sale_offer.credit_model
    description: Credit model used for the mortgage financing. Only available for offers with mortgage.
    categories:
      ATTA: "Mortgage originated internally through QuintoAndar's own credit product (ATTA)."
      UNDEFINED: "Credit model has not yet been defined for this offer."
      EXTERNAL: "Mortgage originated with an external bank/credit provider, outside ATTA."
  ccv_model:
    lineage:
      - datalake_sale_offer.sale_offer.is_ccv_5a_model
    description: Derived CCV model description, based on the is_5a_model flag.
    categories:
      Not Answered: "is_ccv_5a_model was not set (NULL) for this sale agreement."
      Not a 5A model: "is_ccv_5a_model is FALSE — the CCV does not follow the 5A model."
      Is a 5A model: "is_ccv_5a_model is TRUE — the CCV follows QuintoAndar's standard 5A model."
      Undefined: "Fallback value for any other/unexpected is_ccv_5a_model state."
  closing_status:
    lineage:
      - datalake_sale_offer.sale_offer.closing_status
    description: Current closing status of the sales flow after the sale agreement signing.
    categories:
      ONBOARDING: "Sales flow just started, initial onboarding of the transaction."
      DILIGENCE: "House/seller due diligence is in progress."
      DILIGENCE_CANCELED: "Transaction was canceled during the diligence step."
      CREDIT_ANALYSIS: "Buyer's mortgage credit is under analysis."
      FINANCING_ANALYSIS: "Financing/mortgage is under bank analysis."
      WAITING_FINANCING_RESOURCES: "Waiting for the financing institution to release funds."
      DOCS_DELIVERY: "Waiting on document delivery."
      CASH_SIGNATURE: "Waiting on cash-purchase contract signature."
      DOWN_OR_CASH_PAYMENT: "Waiting on the down payment or full cash payment."
      EARNEST_PAYMENT: "Waiting on the earnest/sinal payment."
      EXPENSES_PAYMENT: "Waiting on payment of closing expenses (fees/taxes)."
      SELLER_PAYMENT: "Seller has been paid; transaction effectively concluded."
      CRI: "In the real-estate registry (Cartório de Registro de Imóveis) step."
      CANCELED: "Transaction was canceled."
      END: "Closing process finished."
  house_dilligence_status:
    lineage:
      - datalake_sale_offer.sale_offer.house_dilligence_status
    description: Status of the house's registration/documentation diligence process (Matrícula analysis).
    categories:
      NOT_STARTED: "House registration diligence has not started."
      SIMPLE_APPOINTMENT: "Simple appointment/note found on the registration (Apontamento Simples)."
      NO_APPOINTMENT: "No appointment/restriction found on the registration."
      NO_GO_APPOINTMENT: "A blocking appointment/restriction was found; diligence fails the house."
      PROCESSING: "Registration document is being processed/analyzed."
      DIVERGENT_SELLER: "Seller on the registration diverges from the seller in the offer (PP divergente)."
      FIDUCIARY_SALE: "Property is under a fiduciary sale/alienation (Alienação Fiduciária)."
      FIDUCIARY_SALE_DEBTS: "Property is under fiduciary sale/alienation and also has associated debts."
      SHARING_ASSETS: "Property is under an asset-sharing process (partilha de bens), e.g. divorce/inheritance."
  seller_dilligence_status:
    lineage:
      - datalake_sale_offer.sale_offer.seller_dilligence_status
    description: Classification status of the seller diligence process.
    categories:
      NOT_STARTED: "Diligence classification has not started."
      NO_APPOINTMENT: "No appointment/issue found during diligence."
      LIGHT_APPOINTMENT: "A light-severity appointment/issue was found."
      MODERATE_APPOINTMENT: "A moderate-severity appointment/issue was found."
      CRITICAL_APPOINTMENT: "A critical-severity appointment/issue was found."
      NO_GO_APPOINTMENT: "A blocking appointment/issue was found; diligence fails the offer."
      LOW_RISK: "Diligence classified the offer as low risk."
      MODERATE_RISK: "Diligence classified the offer as moderate risk."
      HIGH_RISK: "Diligence classified the offer as high risk."
      NO_GO_HIGH_RISK: "Diligence classified the offer as high risk and blocking (no-go)."
  report_dilligence_status:
    lineage:
      - datalake_sale_offer.sale_offer.report_dilligence_status
    description: Current step of the diligence report's preparation and delivery workflow.
    categories:
      NOT_STARTED: "Diligence report workflow has not started."
      REQUEST_DD_LEGAL_RISK: "Due-diligence legal risk analysis was requested."
      PROCESSING: "Report is being processed."
      DOC_AVAILABLE: "Underlying documentation is available."
      REPORT_UNDER_PREPARATION: "Diligence report is being prepared."
      REPORT_AVAILABLE: "Diligence report is ready."
      REPORT_SENT_SELLER: "Diligence report was sent to the seller."
      REPORT_SENT_BUYER: "Diligence report was sent to the buyer."
      CANCELLED: "Diligence report workflow was cancelled."
  diligence_appointment_reason:
    lineage:
      - datalake_sale_offer.sale_offer.diligence_appointment_reason
    description: Concatenated list of diligence appointment reasons, separated by ' - '.
  has_used_fgts_in_payment:
    lineage:
      - datalake_sale_offer.sale_offer.has_used_fgts_in_payment
    description: >
      Boolean flag indicating if FGTS (Fundo de Garantia do Tempo de Serviço)
      has been used, or will be used, in the payment.
  has_seller_debt_payments:
    lineage:
      - datalake_sale_offer.sale_offer.has_seller_debt_payments
    description: >
      Boolean flag indicating if the seller has debt payments associated with
      the house (Interveniente Quitante).
  is_ccv_canceled:
    lineage:
      - datalake_sale_offer.sale_offer.is_ccv_canceled
    description: Boolean flag indicating if the sale agreement (CCV) was canceled.
  is_3p_supply:
    lineage:
      - datalake_sale_offer.sale_offer.is_3p_supply
    description: Boolean flag indicating if the offer has a 3P (third-party) supply partner.
  is_3p_demand:
    lineage:
      - datalake_sale_offer.sale_offer.is_3p_demand
    description: Boolean flag indicating if the offer has a 3P (third-party) demand partner.
  is_a_rescued_ccv:
    lineage:
      - datalake_sale_offer.sale_offer.is_a_rescued_ccv
    description: >
      Boolean flag indicating if this sale agreement (CCV) was rescued after
      being previously canceled and opened again.
  ts_sale_agreement_signed:
    lineage:
      - datalake_sale_offer.sale_offer.ts_sale_agreement_signed
    description: Timestamp when the sale agreement (CCV) was signed by both parties.
  ts_sale_agreement_cancelled:
    lineage:
      - datalake_sale_offer.sale_offer.ts_sale_agreement_canceled
    description: Timestamp when the sale agreement (CCV) was canceled.
  ts_load:
    description: Timestamp of when this data row was last loaded.
