database_name: dw_sale
table_name: dim_sale_agreement
description: >
  This table shows details and characteristics about signed sale agreements (CCV
  - Contrato de Compra e Venda).
domain: For Sale
owner: helder.rodrigues@quintoandar.com.br
columns:
  sk_offer:
    lineage:
    - datalake_sale_offer.sale_offer.id_offer
    description: Offer unique identifier.
  ccv_type:
    lineage:
      - datalake_sale_offer.sale_offer.ccv_type
    description: >
      Derived classification of the CCV (sale agreement) type, based on whether
      it follows the 5A model.
    categories:
      "Default 5A CCV": ""
      "Not a 5A CCV Model": ""
      "Unknown": ""
      "": ""
  sale_agreement_status:
    lineage:
      - datalake_sale_offer.sale_offer.sale_agreement_status
    description: >
      Current (most recent) status of the sale agreement (CCV) flow in
      SalesFlow, taken from the latest ccv_flow record for the sales flow
      (ordered by ts_updated). This reflects the flow's live state and is not
      frozen at signature — a signed CCV (ts_sale_agreement_signed populated)
      can still show a later status such as SEND_TO_OPERATIONS_SUPPORT,
      SEND_TO_CCV_QUEUE, or NO_RETURN_FROM_BUYER_OR_SELLER, since ccv_flow
      keeps advancing through post-signature steps. Do not assume this field
      equals 'signed' just because ts_sale_agreement_signed is not null.
    categories:
      SIGNED: "Sale agreement (CCV) has been signed"
      PENDING_DOCUMENTATION: "Waiting on required documentation before the CCV can proceed"
      SEND_TO_BE_SIGNED: "CCV sent for signature"
      SEND_TO_OPERATIONS_SUPPORT: "CCV sent to operations support"
      SEND_TO_CCV_QUEUE: "CCV queued for processing"
      NO_RETURN_FROM_BUYER_OR_SELLER: "No response received from buyer or seller"
  offer_flow:
    lineage:
      - datalake_sale_offer.sale_offer.offer_flow
    description: >
      Derived Offer Flow (Negotiation Model) classification. Returns 'DEAL_MAKING'
      for deal-making flows, otherwise the underlying sales flow type (e.g. Hub
      or Central) or 'NOT DEFINED' when not set.
    categories:
      HUB: ""
      CLOSING_CENTRAL: ""
      DEFAULT: ""
  business_unit:
    lineage:
      - datalake_sale_offer.sale_offer.business_unit
    description: >
      Name of the business unit (hub) responsible for the offer: Deal Making
      (DM) or a specific Hub or Central cell.
  sale_agreement_cancellation_reason:
    lineage:
      - datalake_sale_offer.sale_offer.sale_agreement_cancellation_reason
    description: Reason for cancellation of the sale agreement (CCV), when applicable.
    categories:
      Buyer Desistiu: ''
      COVID: ''
      Modelo QA: ''
      Não se Aplica: ''
      Reprovado Crédito: ''
      Reprovado Diligência: ''
      Seller Desistiu: ''
  sale_price_agreed:
    lineage:
      - datalake_sale_offer.sale_offer.sale_price_agreed
    description: >
      Final price agreed between buyer and seller for the property (CCV value,
      in BRL). Only populated once the offer is accepted or the sale agreement
      is signed — this is the negotiated contract price, not the original
      listing price. Use this field together with dim_offer.sale_price to
      compute the effective seller discount:
      discount = (sale_price - sale_price_agreed) / sale_price.
  brokerage_fee:
    lineage:
      - datalake_sale_offer.sale_offer.brokerage_fee
    description: >
      Brokerage fee percentage charged on the transaction, applied over
      sale_price_agreed. Defaults to 0.06 (6%) when not explicitly set.
  payment_method:
    lineage:
      - datalake_sale_offer.sale_offer.current_payment_method
    description: >
      Current payment method chosen for the offer (e.g. Cash, Financed).
      Also see dimension 'Has Used FGTS in Payment?' to check if the payment
      method includes FGTS.
    categories:
      CASH: ""
      CASH_USING_FGTS: ""
      FINANCED: ""
      FINANCED_USING_FGTS: ""
      NOT_DEFINED: ""
  payment_model:
    lineage:
      - datalake_sale_offer.sale_offer.payment_model
    description: >
      Payment model used in the purchase of the property (e.g. CCV_ASSISTANCE,
      INSTANT_MORTGAGE).
    categories:
      MODEL_5A: ""
      CLOSING_3P: ""
      TRANSFER_BETWEEN_PARTS: ""
      CLOSING_PRIMARY_MARKET: ""
      CCV_ASSISTANCE: ""
      INSTANT_MORTGAGE: ""
      ADVANCED_PAYMENT: ""
      NA: ""
      BROKERAGE_TERM: ""
  credit_model:
    lineage:
      - datalake_sale_offer.sale_offer.credit_model
    description: Credit model used for the mortgage financing. Only available for offers with mortgage.
    categories:
      ATTA: ""
      UNDEFINED: ""
      EXTERNAL: ""
  ccv_model:
    lineage:
      - datalake_sale_offer.sale_offer.is_ccv_5a_model
    description: Derived CCV model description, based on the is_5a_model flag.
    categories:
      Not Answered: ''
      Not a 5A model: ''
      Is a 5A model: ''
      Undefined: ''
  closing_status:
    lineage:
      - datalake_sale_offer.sale_offer.closing_status
    description: Current closing status of the sales flow after the sale agreement signing.
    categories:
      ONBOARDING: ""
      DILIGENCE: ""
      DILIGENCE_CANCELED: ""
      CREDIT_ANALYSIS: ""
      FINANCING_ANALYSIS: ""
      WAITING_FINANCING_RESOURCES: ""
      DOCS_DELIVERY: ""
      CASH_SIGNATURE: ""
      DOWN_OR_CASH_PAYMENT: ""
      EARNEST_PAYMENT: ""
      EXPENSES_PAYMENT: ""
      SELLER_PAYMENT: ""
      CRI: ""
      CANCELED: ""
      END: ""
  house_dilligence_status:
    lineage:
      - datalake_sale_offer.sale_offer.house_dilligence_status
    description: Current status of the house registration diligence process.
  seller_dilligence_status:
    lineage:
      - datalake_sale_offer.sale_offer.seller_dilligence_status
    description: Classification status of the seller diligence process.
    categories:
      NOT_STARTED: ""
      NO_APPOINTMENT: ""
      LIGHT_APPOINTMENT: ""
      MODERATE_APPOINTMENT: ""
      CRITICAL_APPOINTMENT: ""
      NO_GO_APPOINTMENT: ""
      LOW_RISK: ""
      MODERATE_RISK: ""
      HIGH_RISK: ""
      NO_GO_HIGH_RISK: ""
  report_dilligence_status:
    lineage:
      - datalake_sale_offer.sale_offer.report_dilligence_status
    description: Current step of the diligence report preparation process.
  diligence_appointment_reason:
    lineage:
      - datalake_sale_offer.sale_offer.diligence_appointment_reason
    description: Concatenated list of diligence appointment reasons, separated by ' - '.
  has_used_fgts_in_payment:
    lineage:
      - datalake_sale_offer.sale_offer.has_used_fgts_in_payment
    description: >
      Boolean flag indicating if FGTS (Fundo de Garantia do Tempo de Serviço)
      has been used, or will be used, in the payment.
  has_seller_debt_payments:
    lineage:
      - datalake_sale_offer.sale_offer.has_seller_debt_payments
    description: >
      Boolean flag indicating if the seller has debt payments associated with
      the house (Interveniente Quitante).
  is_ccv_canceled:
    lineage:
      - datalake_sale_offer.sale_offer.is_ccv_canceled
    description: Boolean flag indicating if the sale agreement (CCV) was canceled.
  is_3p_supply:
    lineage:
      - datalake_sale_offer.sale_offer.is_3p_supply
    description: Boolean flag indicating if the offer has a 3P (third-party) supply partner.
  is_3p_demand:
    lineage:
      - datalake_sale_offer.sale_offer.is_3p_demand
    description: Boolean flag indicating if the offer has a 3P (third-party) demand partner.
  is_a_rescued_ccv:
    lineage:
      - datalake_sale_offer.sale_offer.is_a_rescued_ccv
    description: >
      Boolean flag indicating if this sale agreement (CCV) was rescued after
      being previously canceled and opened again.
  ts_sale_agreement_signed:
    lineage:
      - datalake_sale_offer.sale_offer.ts_sale_agreement_signed
    description: Timestamp when the sale agreement (CCV) was signed by both parties.
  ts_sale_agreement_cancelled:
    lineage:
      - datalake_sale_offer.sale_offer.ts_sale_agreement_canceled
    description: Timestamp when the sale agreement (CCV) was canceled.
  ts_load:
    description: Timestamp of when this data row was last loaded.
