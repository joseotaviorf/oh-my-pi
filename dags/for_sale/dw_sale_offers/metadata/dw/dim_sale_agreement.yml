database_name: dw_sale
table_name: dim_sale_agreement
description:
  This tables shows details and characteristics about all sales agreements.
  Each line is a sale agreement created.
domain: For Sale
owner: data-for-sale@quintoandar.com.br
columns:
  sk_offer:
    lineage:
      - datalake_sale_offer.sale_offer.id_offer
    description: Offer unique identifier.
  ccv_type:
    lineage:
      - datalake_sale_offer.sale_offer.ccv_type
    description:
      Type of financed sale agreement considering which financial product
      it has contracted.
  sale_agreement_status:
    lineage:
      - datalake_sale_offer.sale_offer.sale_agreement_status
    description: Sale agreement status
    categories:
      "": ""
      Assinado: ""
      Enviar para Fila de CCV: ""
      Forms enviado: ""
  offer_flow:
    lineage:
      - datalake_sale_offer.sale_offer.offer_flow
    description:
      "The Offer Flow (Negotiation Model) that generated the offer: Deal
      Making (DM), Hub or Central"
  business_unit:
    lineage:
      - datalake_sale_offer.sale_offer.business_unit
    description:
      "The business unit that generated the offer: Deal Making (DM) or
      specific Hub or Central cell"
  sale_agreement_cancellation_reason:
    lineage:
      - datalake_sale_offer.sale_offer.sale_agreement_cancellation_reason
    description: Reason why the sale agreement was cancelled
    categories:
      Buyer Desistiu: ""
      COVID: ""
      Modelo QA: ""
      Não se Aplica: ""
      Reprovado Crédito: ""
      Reprovado Diligência: ""
      Seller Desistiu: ""
  sale_price_agreed:
    lineage:
      - datalake_sale_offer.sale_offer.sale_price_agreed
    description: Sale price agreed in the sale contract
  brokerage_fee:
    lineage:
      - datalake_sale_offer.sale_offer.brokerage_fee
    description: Percentage of brokerage fee
  payment_method:
    lineage:
      - datalake_sale_offer.sale_offer.current_payment_method
    description:
      Financed, Cash or Undecided. Also see dimension 'Has Used FGTS in
      Payment?' to check if the payment method includes FGTS.
  payment_model:
    lineage:
      - datalake_sale_offer.sale_offer.payment_model
    description: Payment model agreed in the Sale Agreement.
  credit_model:
    lineage:
      - datalake_sale_offer.sale_offer.credit_model
    description: Credit model of the financing.
  ccv_model:
    lineage:
      - datalake_sale_offer.sale_offer.is_ccv_5a_model
    description: Indicates if this CCV uses a 5A model
    categories:
      Not Answered: ""
      Not a 5A model: ""
      Is a 5A model: ""
      Undefined: ""
  closing_status:
    lineage:
      - datalake_sale_offer.sale_offer.closing_status
    description: Closing Status
  house_dilligence_status:
    lineage:
      - datalake_sale_offer.sale_offer.house_dilligence_status
    description: House Diligence Status (Report results)
  seller_dilligence_status:
    lineage:
      - datalake_sale_offer.sale_offer.seller_dilligence_status
    description: Report result of the Seller Diligence
  report_dilligence_status:
    lineage:
      - datalake_sale_offer.sale_offer.report_dilligence_status
    description:
      Status of the preparation of the Report Diligence Status, from 'Não
      Iniciada' (Not started) to 'Relatório disponível' (Report available)
  diligence_appointment_reason:
    lineage:
      - datalake_sale_offer.sale_offer.diligence_appointment_reason
    description: Appointment Reason of the Diligence
  has_used_fgts_in_payment:
    lineage:
      - datalake_sale_offer.sale_offer.has_used_fgts_in_payment
    description: Has used (or will use) FGTS in payment
  has_seller_debt_payments:
    lineage:
      - datalake_sale_offer.sale_offer.has_seller_debt_payments
    description: Has Seller Debt Payments (Interveniente Quitante)
  is_ccv_canceled:
    lineage:
      - datalake_sale_offer.sale_offer.is_ccv_canceled
    description: True if CCV is cancelled
  is_3p_supply:
    lineage:
      - datalake_sale_offer.sale_offer.is_3p_supply
    description: Flag if supply belongs to a 3P partner
  is_3p_demand:
    lineage:
      - datalake_sale_offer.sale_offer.is_3p_demand
    description: Flag if offer was submitted by a 3P demand agent
  is_a_rescued_ccv:
    lineage:
      - datalake_sale_offer.sale_offer.is_a_rescued_ccv
    description:
      Boolean to identify if this offer has an rescued ccv (A ccv that
      was cancelled and opened again)
  ts_sale_agreement_signed:
    lineage:
      - datalake_sale_offer.sale_offer.ts_sale_agreement_signed
    description: Timestamp of sale agreement signature
  ts_sale_agreement_cancelled:
    lineage:
      - datalake_sale_offer.sale_offer.ts_sale_agreement_canceled
    description: Timestamp of sale agreement cancellation
  ts_load:
    description: Timestamp of when this data row was last loaded
