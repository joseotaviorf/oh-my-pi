database_name: dw_sale
table_name: fact_business_unit_region
description: Table indicating BUs coverage on each region over the time.
domain: For Sale
owner: guilherme.rocha@quintoandar.com.br
columns:
  sk_region:
    lineage:
    - datalake_sale_visit_hubs.business_unit_region_history.id_region
    description: 5A Region ID that this BU is attending.
  sk_coverage_started_date:
    lineage:
    - datalake_sale_visit_hubs.business_unit_region_history.ts_start_coverage
    description: Timestamp indicating when this BU started attending this region.
  sk_coverage_ended_date:
    lineage:
    - datalake_sale_visit_hubs.business_unit_region_history.ts_end_coverage
    description: Timestamp indicating when this BU stopped attending this region.
  business_model:
    lineage:
    - datalake_sale_visit_hubs.business_unit_region_history.business_model
    description: Secretariat (SDR) work type or commercial model applied by the business unit while covering the region.
  business_unit:
    lineage:
    - datalake_sale_visit_hubs.business_unit_region_history.hub_name
    description: Last BU name. So if this BU had a different name in the past it won't be considered.
  dt_coverage_started:
    lineage:
    - datalake_sale_visit_hubs.business_unit_region_history.ts_start_coverage
    description: Timestamp indicating when this BU started attending this region.
  dt_coverage_ended:
    lineage:
    - datalake_sale_visit_hubs.business_unit_region_history.ts_end_coverage
    description: Timestamp indicating when this BU stopped attending this region.
  ts_load:
    description: Timestamp indicating when this table data was last refreshed.
