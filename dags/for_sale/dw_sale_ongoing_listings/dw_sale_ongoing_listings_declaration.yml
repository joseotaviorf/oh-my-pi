dag:
  name: dw_sale_ongoing_listings
  owner: Data ForSale
workflow:
  type: query_delta
  layer: dw
  custom_schema: sale
  default_extraction_type: incremental
  default_partitions: ['year', 'month', 'day']
  has_load_to_redshift_task: false
cluster:
  type: databricks_12_2_min_2xlarge_memory_cluster
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE
