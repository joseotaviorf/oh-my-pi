---
partition_size: 1024

custom_cluster:
  node_type_id: m5a.large
  driver_node_type_id: m5a.large
  num_workers: 3
  spark_version: 12.2.x-scala2.12
  spark_conf:
    "spark.sql.shuffle.partitions": "200"
  cluster_source: "API"

tables:
  - raw_table_name: SaleOperationManagement
    clean_table_name: sale_operation_management
  - raw_table_name: ShopWindow_AUD
    clean_table_name: shop_window_aud
  - raw_table_name: ShopWindow_ListingBusinessContext_AUD
    clean_table_name: shop_window_listing_business_context_aud
  - raw_table_name: ShopWindow_ListingBusinessContext
    clean_table_name: shop_window_listing_business_context
  - raw_table_name: ShopWindow
    clean_table_name: shop_window
