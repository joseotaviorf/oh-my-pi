dag:
  name: ebdb_sale
  schedule_start_date: 2024,01,01
  schedule_interval: 10 21,8,12 * * *
  owner: Data ForSale
  documentation:
    dag_purpose: |
      Dag containing all tables from Sale's context.
workflow:
  type: cdc
  layer: raw
  database_type: mysql
  source_database: ebdb
  source_schema: ebdb
  custom_schema: ebdb
  dbutils_secret_key: EBDB_DB
  incremental_optimize: true
  tables_customization:
    SaleOperationManagement:
      clean_table_name: sale_operation_management
      incremental_optimize: false
    ShopWindow:
      clean_table_name: shop_window
      incremental_optimize: false
    ShopWindow_AUD:
      clean_table_name: shop_window_aud
      incremental_optimize: false
    ShopWindow_ListingBusinessContext:
      clean_table_name: shop_window_listing_business_context
      incremental_optimize: false
    ShopWindow_ListingBusinessContext_AUD:
      clean_table_name: shop_window_listing_business_context_aud
      incremental_optimize: false
  extra_query_template_params:
    load_end_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, 1), 'load_end_date') }}"
