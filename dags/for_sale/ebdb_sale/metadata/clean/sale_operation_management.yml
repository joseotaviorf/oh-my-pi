database_name: datalake_ebdb_clean
table_name: sale_operation_management
description: Table for the communication follow-up of the Sale operation. Enter overprecification and consequence management communications. Each row is a different send.
owner: data-for-sale@quintoandar.com.br
domain: For Sale
columns:
  id:
    lineage:
      - datalake_ebdb_raw.SaleOperationManagement.id
    description:
      Unique identifier of each row.
  id_house:
    lineage:
      - datalake_ebdb_raw.SaleOperationManagement.houseId
    description:
      Foreign key referring to the house ID. Can be joined with dw_house.dim_house and all other sale modeling tables.
  type:
    lineage:
      - datalake_ebdb_raw.SaleOperationManagement.type
    description:
      Type of the message sent.
    categories:
      CONSEQUENCE_MANAGEMENT: In case it is necessary to notify the seller for multiple visit cancellations or other similar reason.
      OVERPRICED_COMMUNICATION: In case the listing is overpriced and the seller needs to be notified.
  last_step:
    lineage:
      - datalake_ebdb_raw.SaleOperationManagement.lastStep
    description: Last step performed in operation management.
    categories:
      INITIATED: First step in consequence management.
      WARNING_EMAIL: Used in consequence management. Step of sending the warning email
      RESETED_FLOW: Step indicating that the consequence management has been reset for the listing.
      TEMPORARY_SUSPENSION: Used in consequence management. Step of temporary suspension of the listing.
      UNPUBLISH_HOUSE: Used in consequence management. Step of unpublishing the listing.
      VISIT_FOCUSED: Used in communication of overpriceds. Step to send the communication focused on the lack of visits of the property.
      PRICE_FOCUSED: Used in communication of overpriceds. Step of sending the communication focused on the price of the property.
      CONTRACT_FOCUSED: Used in communication of overpriceds. Step to send communication focused on the lack of offers/ccv for the property.
  control_counter:
    lineage:
      - datalake_ebdb_raw.SaleOperationManagement.controlCounter
    description: Control of how many times the management operation was executed for the property.
  ts_communication_sent:
    lineage:
      - datalake_ebdb_raw.SaleOperationManagement.communicationSentAt
    description:
      Timestamp of when we sent the communication to the seller.
  ts_price_last_changed:
    lineage:
      - datalake_ebdb_raw.SaleOperationManagement.salePriceLastChangedAt
    description:
      Timestamp of when the price was last changed.
  ts_created:
    lineage:
      - datalake_ebdb_raw.SaleOperationManagement.createdAt
    description:
      Timestamp of when the row was created.
  ts_updated:
    lineage:
      - datalake_ebdb_raw.SaleOperationManagement.updatedAt
    description:
      Timestamp of when the row was updated.
