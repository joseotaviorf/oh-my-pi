---
database_name: datalake_ebdb_clean
table_name: development
domain: For Sale
description: Primary market development projects from EBDB. Each row represents a real estate development (new build) with its characteristics, location and pricing information.
owner: data-for-sale@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_ebdb_raw.development.id
    description: Primary key identifier for the development record.
  development_uuid:
    lineage:
      - datalake_ebdb_raw.development.development_uuid
    description: UUID for the development, used as external stable identifier.
  external_id:
    lineage:
      - datalake_ebdb_raw.development.external_id
    description: External identifier for the development from the originating system.
  company_uuid:
    lineage:
      - datalake_ebdb_raw.development.company_uuid
    description: UUID of the company (developer/builder) responsible for the development.
  name:
    lineage:
      - datalake_ebdb_raw.development.name
    description: Name of the development project.
  description:
    lineage:
      - datalake_ebdb_raw.development.description
    description: Free-text description of the development project.
  construction_status:
    lineage:
      - datalake_ebdb_raw.development.construction_status
    description: Current construction status of the development (e.g. UNDER_CONSTRUCTION, COMPLETED).
  launch_date:
    lineage:
      - datalake_ebdb_raw.development.launch_date
    description: Date when the development was officially launched for sale.
  forecast_delivery_date:
    lineage:
      - datalake_ebdb_raw.development.forecast_delivery_date
    description: Forecasted date for delivery/completion of the development.
  towers:
    lineage:
      - datalake_ebdb_raw.development.towers
    description: Number of towers in the development.
  floors:
    lineage:
      - datalake_ebdb_raw.development.floors
    description: Number of floors per tower.
  apartments_per_floor:
    lineage:
      - datalake_ebdb_raw.development.apartments_per_floor
    description: Number of apartments per floor.
  legal_permit:
    lineage:
      - datalake_ebdb_raw.development.legal_permit
    description: Legal permit identifier for the development.
  postal_code:
    lineage:
      - datalake_ebdb_raw.development.postal_code
    description: Postal code (CEP) of the development location.
  street:
    lineage:
      - datalake_ebdb_raw.development.street
    description: Street name of the development location.
  street_number:
    lineage:
      - datalake_ebdb_raw.development.street_number
    description: Street number of the development location.
  neighborhood:
    lineage:
      - datalake_ebdb_raw.development.neighborhood
    description: Neighborhood of the development location.
  city:
    lineage:
      - datalake_ebdb_raw.development.city
    description: City of the development location.
  id_state:
    lineage:
      - datalake_ebdb_raw.development.state_id
    description: Foreign key referencing the Estado (state) table.
  latitude:
    lineage:
      - datalake_ebdb_raw.development.latitude
    description: Latitude coordinate of the development location.
  longitude:
    lineage:
      - datalake_ebdb_raw.development.longitude
    description: Longitude coordinate of the development location.
  min_condominium_fee:
    lineage:
      - datalake_ebdb_raw.development.min_condominium_fee
    description: Minimum condominium fee across typologies in BRL.
  min_iptu:
    lineage:
      - datalake_ebdb_raw.development.min_iptu
    description: Minimum IPTU (property tax) across typologies in BRL.
  ts_created:
    lineage:
      - datalake_ebdb_raw.development.created_at
    description: Timestamp when the development record was created.
  ts_updated:
    lineage:
      - datalake_ebdb_raw.development.updated_at
    description: Timestamp when the development record was last updated.
  op_cdc:
    description: CDC operation type captured by Debezium.
    categories:
      r: Read/snapshot - initial load of existing records.
      c: Create - new record inserted.
      u: Update - existing record modified.
      d: Delete - record removed.
  ts_cdc_transaction:
    description: Timestamp when the CDC system captured this transaction (millisecond precision).
  ts_database_transaction:
    description: Timestamp of the original database transaction in the source system.
