database_name: dw_public
table_name: dim_visit
description: Information about Rent and Sale visits, which is a subset of bookings.
  A visit is when a tenant prospect/buyer prospect visits a property because it's interested in it.
  Each line is an unique visit.
domain: For Rent
owner: gustavo.alencar@quintoandar.com.br
columns:
  sk_visit:
    lineage:
      - datalake_visit.visits.id_visit
    description: Key of visit
  id_visit:
    lineage:
      - datalake_visit.visits.id_visit
    description: Id of visit (equal to key of visit)
  cd_visit:
    lineage:
      - datalake_visit.visits.code
    description: Code of visit
  visit_origin:
    lineage:
      - datalake_ebdb_clean.visit_origin.name
    description: Shows the origin of visit
  visit_origin_description:
    lineage:
      - datalake_ebdb_clean.visit_origin.description
    description: Origin description of visit
  business_unit:
    lineage:
      - datalake_sale_visit_hubs.sale_visit_hubs.business_unit
    description: Business unit name, already standardized with Teams data.
  day_visit:
    lineage:
      - datalake_visit.visits.dt_visit
    description: Date of visit
  slot:
    lineage:
      - datalake_visit.visits.slot
    description: Slot time of visit (0, 1, 2, ..., 51)
  slot_count:
    lineage:
      - datalake_visit.visits.slot_count
    description: Number of available slots to visit
  type:
    lineage:
      - datalake_visit.visits.type
    description: Useless (only 6 rows if type = 1 from 2015)
  status:
    lineage:
      - datalake_visit.visits.status
    description: Visit status
    categories:
      Canceled: ''
      Done: ''
      Scheduled: ''
  computed_status:
    lineage:
      - datalake_visit.visits.computed_status
    description: Last computed status from Visit, has to be almost the same of status
  behavior:
    lineage:
      - datalake_visit.visits.behavior
    description: What the step of behavior is this visit
  booking_type:
    lineage:
      - datalake_visit.visits.booking_type
    description: Type of the booking
    categories:
      Booked: ''
      Realized: ''
  business_context:
    lineage:
      - datalake_visit.visits.business_context
    description: Which is the context of this visit
  business_model:
    lineage:
      - datalake_visit.visits.business_model
    description: Identify the business model of the visit
  cancellation_reason:
    lineage:
      - datalake_visit.visits.cancellation_reason
    description: What the reason for the cancellation of this visit
  cancellation_on_behalf_of:
    lineage:
      - datalake_visit.visits.cancellation_on_behalf_of
    description: In whose name that cancellation status
  cancellatin_channel:
    lineage:
      - datalake_visit.visits.cancellatin_channel
    description: What the channel for the cancellation of this visit
  cancellation_author_role:
    lineage:
      - datalake_visit.visits.cancellation_author_role
    description: Role of user who cancelled the visit
  entry_method:
    lineage:
      - datalake_visit.visit_schedule.method
    description: How occurred the entry method. Last method before the visit.
  entry_method_type:
    lineage:
      - datalake_visit.visit_schedule.entry_model_type
    description: Type of entry method.
    categories:
      ASSISTED_ENTRANCE: When a third person is needed to enter.
      EASY_ENTRANCE: When no third person is needed to enter.
      NOT_CLASSIFIED: Unmapped case.
  visit_model:
    lineage:
      - datalake_visit.visits.visit_model
    description: Visit model of the visit.
    categories:
      REGISTERED: When the visit is registered after after it has occurred
      FITTED: When the visit is fitted. It is already confirmed
      STANDARD: When the visit follows the standard flow
  visit_schedule_type:
    lineage:
      - datalake_visit.visits.visit_schedule_type
    description: Type of visit schedule based on the time of first schedule and last schedule.
    categories:
      NOT_CHANGED: When the schedule has not been changed (first = last)
      POSTPONED: When the visit was postponed (last > first)
      EARLY: When the visit was earlier (last < first)
  visit_request_channel:
    lineage:
      - datalake_visit.visits.visit_request_channel
    description: Channel when the visit was requested.
  is_visit_with_fixed_agent:
    lineage:
      - datalake_visit.visits.is_fixed_agent
    description: If this visit has a fixed agent by the visitor
  is_visit_confirmed:
    lineage:
      - datalake_visit.visits.is_confirmed
    description: If the visit was confirmed by all
  is_visit_completed:
    lineage:
      - datalake_visit.visits.is_completed
    description: If the visit is completed
  is_visit_canceled:
    lineage:
      - datalake_visit.visits.is_canceled
    description: If this visit is canceled
  is_visit_unsuccessful:
    lineage:
      - datalake_visit.visits.is_unsuccessful
    description: If this visit return unsuccessful
  is_visit_reschedule:
    lineage:
      - datalake_visit.visits.is_reschedule
    description: If this visit is a reschedule
  is_visit_registered_by_agent:
    lineage:
      - datalake_visit.visits.is_visit_registered_by_agent
    description: If the visit was registered by agent
  is_visit_cancelled_by_expiration:
    lineage:
      - datalake_visit.visits.is_cancelled_by_expiration
    description: True if the visit was cancelled due to expired time
  is_visit_stalled:
    lineage:
      - datalake_visit.visits.is_stalled
    description: If the visit is stalled.
  has_visit_finisher_status:
    lineage:
      - datalake_visit.visits.has_finisher_status
    description: True when the visit has a finisher status
  has_visit_fup_collected:
    lineage:
      - datalake_visit.visits.has_fup_collected
    description: True when the visit has a follow up collected
  has_visit_more_one_agent:
    lineage:
      - datalake_visit.visits.has_more_one_agent
    description: True when the visit has more than one associated agent.
  has_offer_submitted:
    lineage:
      - dw_rent.fact_rent_demand_events.ts_event
    description: True when the visit has a offer submitted.
  has_offer_accepted:
    lineage:
      - dw_rent.fact_rent_demand_events.ts_event
    description: True when the visit has a offer accepted.
  has_contract_signed:
    lineage:
      - dw_rent.fact_rent_demand_events.ts_event
    description: True when the visit has a contract signed.
  has_offer_submitted_after_visit_creation:
    lineage:
      - dw_rent.fact_rent_demand_events.ts_event
      - datalake_visit.visits.ts_created
    description: True when the visit has a offer submitted after creation of visit.
  has_offer_accepted_after_visit_creation:
    lineage:
      - dw_rent.fact_rent_demand_events.ts_event
      - datalake_visit.visits.ts_created
    description: True when the visit has a offer accepted after creation of visit.
  has_contract_signed_after_visit_creation:
    lineage:
      - dw_rent.fact_rent_demand_events.ts_event
      - datalake_visit.visits.ts_created
    description: True when the visit has a contract signed after creation of visit.
  dt_created:
    lineage:
      - datalake_visit.visits.ts_created
    description: Timestamp of visit creating
  dt_updated:
    lineage:
      - datalake_visit.visits.ts_updated
    description: Timestamp of visit updating
  ts_visit:
    lineage:
      - datalake_visit.visits.ts_visit
    description: Timestamp of visit
  ts_visit_requested:
    lineage:
      - datalake_visit.visits.ts_visit_requested
    description: Timestamp with the requested date of this visit.
  ts_visit_first_confirmed:
    lineage:
      - datalake_visit.visits.ts_visit_first_confirmed
    description: Timestamp with the first confirmation of this visit.
  ts_visit_last_confirmed:
    lineage:
      - datalake_visit.visits.ts_visit_last_confirmed
    description: Timestamp with the last confirmation of this visit
  ts_visit_first_rescheduled:
    lineage:
      - datalake_visit.visits.ts_visit_first_rescheduled
    description: Timestamp with the first reschedule date of this visit
  ts_visit_last_rescheduled:
    lineage:
      - datalake_visit.visits.ts_visit_rescheduled
    description: Timestamp with the last rescheduled date of this visit.
  ts_visit_canceled:
    lineage:
      - datalake_visit.visits.ts_visit_canceled
    description: Timestamp with the canceled date of this visit.
  ts_visit_unsuccessful:
    lineage:
      - datalake_visit.visits.ts_visit_unsuccessful
    description: Timestamp with the unsuccessful date of this visit.
  ts_visit_done:
    lineage:
      - datalake_visit.visits.ts_visit_done
    description: Timestamp with the done date of this visit.
  ts_visit_fup_collected:
    lineage:
      - datalake_visit.visits.ts_visit_fup_collected
    description: Timestamp with the follow up collected date of this visit.
  ts_visit_stalled:
    lineage:
      - datalake_visit.visits.ts_visit_stalled
    description: Timestamp when the visit was stalled.
  ts_first_visit:
    lineage:
      - datalake_visit.visits.ts_first_visit
    description: Timestamp when the visit was first scheduled.
  ts_first_offer_submitted:
    lineage:
      - dw_rent.fact_rent_demand_events.ts_event
    description: Timestamp when the first offer of visit was submitted.
  ts_first_offer_accepted:
    lineage:
      - dw_rent.fact_rent_demand_events.ts_event
    description: Timestamp when the first offer of visit was accepted.
  ts_first_contract_signed:
    lineage:
      - dw_rent.fact_rent_demand_events.ts_event
    description: Timestamp when the first contract of visit was signed.
  ts_load:
    description: Timestamp of the ingestion data.
