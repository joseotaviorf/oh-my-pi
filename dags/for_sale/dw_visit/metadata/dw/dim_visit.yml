database_name: dw_visit
table_name: dim_visit
description:
  Information about Rent and Sale visits, which is a subset of bookings.
  A visit is when a tenant prospect/buyer prospect visits a property because it's interested in it.
  Each line is an unique visit.
domain: For Sale
owner: guilherme.rocha@quintoandar.com.br
columns:
  sk_visit:
    lineage:
      - datalake_visit.visits.id_visit
    description: Key of visit. Data since 2015.
  id_visit:
    lineage:
      - datalake_visit.visits.id_visit
    description: Id of visit (equal to key of visit). Data since 2015.
  visit_code:
    lineage:
      - datalake_visit.visits.code
    description: Code of visit. Data since 2015.
  day_visit:
    lineage:
      - datalake_visit.visits.dt_visit
    description: Date of visit. Data since 2015.
  slot:
    lineage:
      - datalake_visit.visits.slot
    description: Slot time of visit (will be deprecated in the future). Data since 2015.
  slot_count:
    lineage:
      - datalake_visit.visits.slot_count
    description: Number of available slots to visit (will be deprecated in the future). Data since 2015.
  type:
    lineage:
      - datalake_visit.visits.type
    description: Useless (only 6 rows if type = 1 from 2015 - will be deprecated in the future). Data since 2015.
  status:
    lineage:
      - datalake_visit.visits.status
    description: Visit status (will be deprecated in the future). Data since 2015.
  computed_status:
    lineage:
      - datalake_visit.visits.computed_status
    description: Last computed status unified from Visit. Data since 2015.
  behavior:
    lineage:
      - datalake_visit.visits.behavior
    description: What the step of behavior is this visit. Data since 2024-04.
  booking_type:
    lineage:
      - datalake_visit.visits.booking_type
    description: Type of the booking (will be deprecated in the future). Data since 2016.
  business_context:
    lineage:
      - datalake_visit.visits.business_context
    description: Which is the context of this visit. Data since 2015.
  business_model:
    lineage:
      - datalake_visit.visits.business_model
    description: Identify the business model of the visit (will be deprecated in the future). Data since 2020.
  business_model_supply:
    lineage:
      - datalake_visit.visits.business_model_supply
    description: Identify if the business model of supply is 1P or 3P (will be deprecated in the future). Data since 2020.
  business_model_demand:
    lineage:
      - datalake_visit.visits.business_model_supply_demand
    description: Identify if the business model of demand is 1P or 3P (will be deprecated in the future). Data since 2020.
  cancellation_reason:
    lineage:
      - datalake_visit.visits.cancellation_reason
    description: What the reason for the cancellation of this visit. Data since 2016.
  cancellation_on_behalf_of:
    lineage:
      - datalake_visit.visits.cancellation_on_behalf_of
    description: In whose name that cancellation status. Data since 2019.
  cancellation_channel:
    lineage:
      - datalake_visit.visits.cancellatin_channel
    description: What the channel for the cancellation of this visit. Data since 2019.
  cancellation_type:
    lineage:
      - datalake_visit.visits.cancellation_type
    description: Type of cancellation. It can be before or after the confirmation. Data since 2024-11.
  cancellation_author_role:
    lineage:
      - datalake_visit.visits.cancellation_author_role
    description: Role of user who cancelled the visit. Data since 2024-11.
  unsuccessful_reason:
    lineage:
      - datalake_visit.visits.unsuccessful_reason
    description: Reason of visit unsuccessful. Data since 2016.
    categories:
      ASSISTED_ENTRANCE: When a third person is needed to enter.
      EASY_ENTRANCE: When no third person is needed to enter.
      NOT_CLASSIFIED: Unmapped case.
  visit_model:
    lineage:
      - datalake_visit.visits.visit_model
    description: Visit model of the visit. Data since 2015.
    categories:
      REGISTERED: When the visit is registered after after it has occurred
      FITTED: When the visit is fitted. It is already confirmed
      STANDARD: When the visit follows the standard flow
  visit_schedule_type:
    lineage:
      - datalake_visit.visits.visit_schedule_type
    description: Type of visit schedule based on the time of first schedule and last schedule. Data since 2015.
    categories:
      NOT_CHANGED: When the schedule has not been changed (first = last)
      POSTPONED: When the visit was postponed (last > first)
      EARLY: When the visit was earlier (last < first)
  visit_request_channel:
    lineage:
      - datalake_visit.visits.visit_request_channel
    description: Channel when the visit was requested. Data since 2016.
  visit_request_on_behalf_of:
    lineage:
      - datalake_visit.visits.visit_request_on_behalf_of
    description: On whose behalf the request was made. Data since 2024-11.
  visit_request_user_role:
    lineage:
      - datalake_visit.visits.visit_request_user_role
    description: Role of user who requested the visit. Data since 2024-11.
  visit_request_application_source:
    lineage:
      - datalake_visit.visits.visit_request_application_source
    description: Application source when the visit was requested. Data since 2025-10.
  visit_request_source_unified:
    lineage:
      - datalake_visit.visits.visit_request_source_unified
    description: Source of the visit request unified from channel and application source. Data since 2016.
  first_supply_answer:
    lineage:
      - datalake_visit.visits.first_supply_answer
    description: First confirmation response from owner. Data since 2024-11.
    categories:
      ANSWER_CONFIRMED: Owner confirmed the visit.
      ANSWER_REJECTED: Owner rejected the visit.
  first_supply_answer_channel:
    lineage:
      - datalake_visit.visits.first_supply_answer_channel
    description: Channel when owner answer the confirmation for the first time. Data since 2024-11.
  first_tenant_living_answer:
    lineage:
      - datalake_visit.visits.first_tenant_living_answer
    description: First confirmation response from tenant living. Data since 2024-11.
    categories:
      ANSWER_CONFIRMED: Tenant living confirmed the visit.
      ANSWER_REJECTED: Tenant living rejected the visit.
  first_tenant_living_answer_channel:
    lineage:
      - datalake_visit.visits.first_tenant_living_answer_channel
    description: Channel when tenant living answer the confirmation for the first time. Data since 2024-11.
  visit_first_confirmed_channel:
    lineage:
      - datalake_visit.visits.visit_first_confirmed_channel
    description: Channel when the visit was confirmed for the first time. Data since 2024-11.
  visit_first_confirmed_user_role:
    lineage:
      - datalake_visit.visits.visit_first_confirmed_user_role
    description: Role of user who is related to the first visit confirmation. Data since 2024-11.
  visit_finalization_agent_channel:
    lineage:
      - datalake_visit.visits.visit_finalization_agent_channel
    description: Channel of the visit finalization by agent. Data since 2026-06.
  is_visit_confirmed:
    lineage:
      - datalake_visit.visits.is_confirmed
    description: If the visit was confirmed by all. Data since 2015.
  is_visit_confirmed_last_schedule:
    lineage:
      - datalake_visit.visits.is_confirmed_by_last_schedule
    description: If the visit was confirmed by the last schedule. Data since 2015.
  is_visit_completed:
    lineage:
      - datalake_visit.visits.is_completed
    description: If the visit is completed. Data since 2015.
  is_visit_canceled:
    lineage:
      - datalake_visit.visits.is_canceled
    description: If this visit is canceled. Data since 2015.
  is_visit_unsuccessful:
    lineage:
      - datalake_visit.visits.is_unsuccessful
    description: If this visit return unsuccessful. Data since 2015.
  is_visit_reschedule:
    lineage:
      - datalake_visit.visits.is_reschedule
    description: If this visit is a reschedule. Data since 2015.
  is_visit_cancelled_by_expiration:
    lineage:
      - datalake_visit.visits.is_cancelled_by_expiration
    description: True if the visit was cancelled due to expired time. Data since 2015.
  is_visit_stalled:
    lineage:
      - datalake_visit.visits.is_stalled
    description: If the visit is stalled. Data since 2015.
  is_visit_registered:
    lineage:
      - datalake_visit.visits.is_registered
    description: If the visit was registered by the agent. Data since 2015.
  is_visit_fitted:
    lineage:
      - datalake_visit.visits.is_fitted
    description: If the visit was fitted by the agent. Data since 2015.
  is_visit_3p_supply:
    lineage:
      - datalake_visit.visits.is_3p_supply
    description: If the visit has a 3P supply partner. Data since 2020.
  is_visit_3p_demand:
    lineage:
      - datalake_visit.visits.is_3p_demand
    description: If the visit has a 3P demand partner. Data since 2020.
  is_visit_3p_lead_gen:
    lineage:
      - datalake_visit.visits.is_3p_lead_gen
    description: If the visit has a 3P lead generation partner. Data since 2020.
  is_visit_same_day_first_schedule:
    lineage:
      - datalake_visit.visits.is_visit_same_day_first_schedule
    description: True if the visit was scheduled on the same day as the visit. Data since 2015.
  is_visit_same_day_last_schedule:
    lineage:
      - datalake_visit.visits.is_visit_same_day_last_schedule
    description: True if the visit was scheduled on the same day as the last schedule. Data since 2015.
  is_completed_visit_contested_by_demand:
    lineage:
      - datalake_visit.visits.is_completed_visit_contested_by_demand
    description: True if the visit was completed by demand and the reason is wrong visit done status. Data since 2024-11.
  is_canceled_visit_contested_by_demand:
    lineage:
      - datalake_visit.visits.is_canceled_visit_contested_by_demand
    description: True if the visit was canceled by demand and the reason is wrong cancellation reason. Data since 2024-11.
  is_visit_contested_by_demand:
    lineage:
      - datalake_visit.visits.is_visit_contested_by_demand
    description: True if the visit was contested by demand. Data since 2024-11.
  is_house_revisit:
    lineage:
      - datalake_visit.visits.ts_visit_last_visit_done_of_house
    description: True if the visit is a revisit of the house. Data since 2015.
  is_visitor_revisit:
    lineage:
      - datalake_visit.visits.ts_visit_last_visit_done_of_visitor
    description: True if the visit is a revisit of the visitor. Data since 2015.
  is_house_visitor_revisit:
    lineage:
      - datalake_visit.visits.ts_visit_last_visit_done_of_house_and_visitor
    description: True if the visit is a revisit of the house and visitor. Data since 2015.
  has_3p_access_control:
    lineage:
      - datalake_visit.visits.has_3p_access_control
    description: If the visit has any 3P access control. Data since 2020.
  has_visit_tenant_living:
    lineage:
      - datalake_visit.visits.has_tenant_living
    description: If the visit has tenant living. 2024-11.
  has_visit_finisher_status:
    lineage:
      - datalake_visit.visits.has_finisher_status
    description: True when the visit has a finisher status. Data since 2015.
  has_visit_fup_collected:
    lineage:
      - datalake_visit.visits.has_fup_collected
    description: True when the visit has a follow up collected. Data since 2015.
  has_visit_more_one_agent:
    lineage:
      - datalake_visit.visits.has_more_one_agent
    description: True when the visit has more than one associated agent. Data since 2015.
  has_unsuccessful_demand_not_attended:
    lineage:
      - datalake_visit.visits.has_unsuccessful_demand_not_attended
    description: True if demand (visitor) did not attend the unsuccessful visit. Data since 2016.
  has_unsuccessful_agent_not_attended:
    lineage:
      - datalake_visit.visits.has_unsuccessful_agent_not_attended
    description: True if agent did not attend the unsuccessful visit. Data since 2016.
  has_unsuccessful_supply_not_attended:
    lineage:
      - datalake_visit.visits.has_unsuccessful_supply_not_attended
    description: True if supply (owner) did not attend the unsuccessful visit. Data since 2021-04.
  dt_created:
