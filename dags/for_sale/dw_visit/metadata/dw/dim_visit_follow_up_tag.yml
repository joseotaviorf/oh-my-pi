domain: For Sale
owner: matheus.sampaio@quintoandar.com.br
columns:
  sk_follow_up_tag:
    description: Id of the tag category.
    lineage:
      - datalake_ebdb_clean.feedback_tag.id
  category:
    description: Name of the tag category.
    lineage:
      - datalake_ebdb_clean.feedback_tag.category
  description:
    description: Tag description.
    lineage:
      - datalake_ebdb_clean.feedback_tag.description
  is_positive:
