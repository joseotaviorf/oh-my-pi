database_name: dw_visit
table_name: dim_author_type
description: This dimension table has the author type of the events on visits .
domain: For Sale
owner: matheus.sampaio@quintoandar.com.br
columns:
  sk_author_type:
    description: Id of the author type.
  author_type:
    description: Name of the author type. Helps in identifying whether the author id can be found in Main (EBDB) or in Person.
    categories:
        USUARIO: The user type comes from Main/EBDB. User id joins with dw_public.dim_user
        PERSON: The user type comes from Person.
  author_role:
    description: Name of the author role.
  on_behalf_of:
    description: An identification to say the author is present at this event on behalf of those
  channel:
    description: Name of used channel.
  ts_load:
    description: Timestamp of the ingestion data.
