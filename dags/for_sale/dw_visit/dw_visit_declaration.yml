dag:
    name: dw_visit
    owner: Data ForSale
    criticality: High
    schedule_start_date: 2024, 1, 1
    documentation:
      dag_purpose:
        This DAG loads to DW our base of Visits (Including rent and sale).
workflow:
    type: query_delta
    layer: dw
    custom_schema: visit
    tables_customization:
      dim_author_type:
        extraction_type: incremental
        merge_on: [ "author_type", "author_user_role", "on_behalf_of", "channel" ]
      dim_business_context:
        extraction_type: incremental
        merge_on: [ "business_context" ]
      dim_event_type:
        extraction_type: incremental
        merge_on: [ "event_name" ]
      dim_visit_model:
        extraction_type: incremental
        merge_on: [ "visit_model" ]
      dim_visit_status:
        extraction_type: incremental
        merge_on: [ "status_name" ]
      fact_visits:
        criticality: Critical
      fact_visit_schedules:
        criticality: Critical
      dim_post_visit_demand:
        criticality: Critical
    inner_dependencies:
      fact_visit_events:
        - dim_event_type
        - dim_author_type
        - dim_cancellation_type
      fact_visit_schedules:
        - dim_business_context
        - dim_visit_model
      fact_visits:
        - dim_visit_status
        - dim_business_context
        - dim_visit_funnel
        - dim_post_visit_demand
