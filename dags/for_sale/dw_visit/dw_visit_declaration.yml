dag:
    name: dw_visit
    owner: Data ForSale
    schedule_start_date: 2024, 1, 1
    documentation:
      dag_purpose:
        This DAG loads to DW our base of Visits (Including rent and sale).
workflow:
    type: query_delta
    layer: dw
    custom_schema: visit
    tables_customization:
      dim_visit:
        custom_schema: public
      dim_event_type:
        merge_on: ["event_name"]
cluster:
    type: custom_cluster
    access_control_list:
        group_name: analytics-engineers
        permission_level: CAN_MANAGE
    databricks_conn_id: databricks_new
    custom_configurations:
      driver_node_type_id: r5a.2xlarge
      node_type_id: r5a.xlarge
      num_workers: 3
      spark_version: 13.3.x-scala2.12
      single_user_name: '{{ var.value.databricks_single_user_name }}'
      data_security_mode: SINGLE_USER
      spark_conf:
        spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
