dag:
    name: dw_visit
    owner: Data ForSale
    schedule_start_date: 2024, 1, 1
    documentation:
      dag_purpose:
        This DAG loads to DW our base of Visits (Including rent and sale).
workflow:
    type: query_delta
    layer: dw
    custom_schema: visit
    tables_customization:
      dim_visit:
        custom_schema: public
      dim_author_type:
        extraction_type: incremental
        merge_on: [ "author_type", "author_user_role", "on_behalf_of", "channel" ]
      dim_behavior:
        extraction_type: incremental
        merge_on: [ "behavior_type" ]
      dim_business_context:
        extraction_type: incremental
        merge_on: [ "business_context" ]
      dim_business_model:
        extraction_type: incremental
        merge_on: [ "business_model" ]
      dim_entrance_type:
        extraction_type: incremental
        merge_on: [ "entrance_type" ]
      dim_event_type:
        extraction_type: incremental
        merge_on: [ "event_name" ]
      dim_origin_type:
        extraction_type: incremental
        merge_on: [ "origin_name" ]
      dim_visit_fup:
        extraction_type: incremental
        merge_on: [ "visit_fup" ]
      dim_visit_model:
        extraction_type: incremental
        merge_on: [ "visit_model" ]
      dim_visit_status:
        extraction_type: incremental
        merge_on: [ "status_name" ]
cluster:
    type: custom_cluster
    access_control_list:
        group_name: analytics-engineers
        permission_level: CAN_MANAGE
    databricks_conn_id: databricks_new
    custom_configurations:
      driver_node_type_id: r5a.2xlarge
      node_type_id: r5a.xlarge
      num_workers: 3
      spark_version: 13.3.x-scala2.12
      single_user_name: '{{ var.value.databricks_single_user_name }}'
      data_security_mode: SINGLE_USER
      spark_conf:
        spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
