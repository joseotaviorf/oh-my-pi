---
dag:
  name: enrich_hub_services
  schedule_start_date: 2022, 7, 22
  owner: Data ForSale
  documentation:
    dag_purpose: This DAG creates the enriched tables for HubServices.
workflow:
  type: query
  layer: enrich
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, ds, 'load_end_date') }}"
  inner_dependencies:
    daily_secretariat_allocation:
      - secretariat_allocation_history
  tables_customization:
    daily_secretariat_allocation:
      partitions: [dt_snapshot]
      extraction_type: incremental
cluster:
  type: databricks_12_2_med_general_cluster
