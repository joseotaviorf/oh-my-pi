---
database_name: datalake_hub_services
table_name: buyer_secretariat_changes
description: Table with secretariat changes for a given Lead on HubService.
domain: For Sale
owner: herivelto.junior@quintoandar.com.br
columns:
  id_lead:
    lineage:
      - datalake_hub_services_clean.responsible.id_lead
    description: Unique Lead ID on HubServices tables.
  id_external_lead:
    lineage:
      - datalake_hub_services_clean.visitor.id_external
    description: Lead ID on 5A main tables (EBDB).
  id_external_responsible:
    lineage:
      - datalake_hub_services_clean.users.id_external
    description: Secretariat responsible ID on 5A main tables (EBDB).
  id_external_distributor:
    lineage:
      - datalake_hub_services_clean.users.id_external
    description: Distributor ID on 5A main tables (EBDB).
  id_house:
    lineage:
      - datalake_hub_services_clean.lead.id_house
    description: House ID on 5A main tables (EBDB)
  id_business_unit:
    lineage:
      - datalake_hub_services_clean.lead.id_business_unit
    description: Business Unit ID for this Lead House.
  lead_type:
    lineage:
      - datalake_hub_services_clean.lead.lead_type
    description: Indicates how this Lead got in contact with this secretariat.
  visitor_name:
    lineage:
      - datalake_hub_services_clean.visitor.visitor_name
    description: Lead name.
  visitor_email:
    lineage:
      - datalake_hub_services_clean.visitor.visitor_email
    description: Lead email.
  responsible_email:
    lineage:
      - datalake_hub_services_clean.users.email
    description: Current secretariat responsible email.
  distributor_email:
    lineage:
      - datalake_hub_services_clean.users.email
    description: User that assigned this lead for this responsible.
  is_last_responsible:
    description: Flag indicating if this is the last responsible for this buyer.
  is_active:
    lineage:
      - datalake_hub_services_clean.responsible.is_active
    description: Flag indicating if the this secretariat is currently active for this lead.
  ts_assigned:
    lineage:
      - datalake_hub_services_clean.responsible.ts_assigned
    description: Timestamp indicating when this user started being responsible for this lead.
  ts_unassigned:
    lineage:
      - datalake_hub_services_clean.responsible.ts_unassigned
    description: Timestamp indicating when this user stopped being responsible for this lead.
