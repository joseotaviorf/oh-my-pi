database_name: datalake_sale_demand_events
table_name: sale_demand_events
description: >-
  Fact table for the For Sale (real-estate purchase) demand funnel, with one row per key
  buyer/house event: visit booked, visit completed, offer submitted, offer accepted, sale
  agreement created, sale agreement signed, visit cancelled, or offer rejected. Built by
  unioning event timestamps from the sale visit and sale offer clean tables
  (datalake_sale_visit.sale_visit, datalake_sale_offer.sale_offer). Backs the For Sale
  demand-funnel and Buyer Prospect (BP) metrics (e.g. event_name = VISIT_BOOKED identifies a
  Buyer Prospect). id_sale_flow is the same buyer/house key used by enrich_sale_flows.sale_flow
  (both built from the sale_visit/sale_offer/talk-to-agent event sources) — join the two to
  connect a demand event to its full discovery-journey record. id_buyer/id_seller can be joined
  with dw_public.dim_user, id_house with dw_house.dim_house, and sk_company_supply/sk_company_demand
  with dw_rede.dim_company. Caution: id_offer here is sourced from datalake_sale_offer.sale_offer
  (this DAG's own schema) and is NOT the same key space as id_offer in
  enrich_sale_offer_flows.sale_offer_flows, which is sourced from the separate
  datalake_sales_flow_clean.offer schema — do not join the two id_offer columns directly.
domain: For Sale
owner: guilherme.rocha@quintoandar.com.br
columns:
  sk_event_type:
    description: Identifies which stage of the demand funnel this row represents (e.g. visit booked, offer submitted, sale agreement signed). Surrogate key from 1 to 8; foreign key to dw_sale.dim_sale_event_type for the full event catalog.
    categories:
      '1': Buyer booked a visit to the house (VISIT_BOOKED).
      '2': Buyer completed the booked visit (VISIT_COMPLETED).
      '3': Buyer submitted a purchase offer (OFFER_SUBMITTED).
      '4': Seller accepted the buyer's offer (OFFER_ACCEPTED).
      '5': Sale agreement (CCV) draft was created (SALE_AGREEMENT_CREATED).
      '6': Sale agreement (CCV) was signed by both parties (SALE_AGREEMENT_SIGNED).
      '7': The previously booked visit was cancelled (VISIT_CANCELLED).
      '8': The offer was rejected or dismissed before acceptance (OFFER_REJECTED).
  sk_company_supply:
    lineage:
    - datalake_sale_visit.sale_visit.sk_company_supply
    - datalake_sale_offer.sale_offer.id_company_supply
    description: Key of the listing's origin company in Rede Supply, if that is the case. It can be joined with dw_rede.dim_company.
  sk_company_demand:
    lineage:
    - datalake_sale_visit.sale_visit.sk_company_demand
    - datalake_sale_offer.sale_offer.id_company_demand
    description: Key of the agents's company in Rede Demand at the start of the funnel, if that is the case. It can be joined with dw_rede.dim_company.
  id_sale_flow:
    lineage:
    - datalake_sale_visit.sale_visit.id_sale_flow
    - datalake_sale_offer.sale_offer.id_buyer
    - datalake_sale_offer.sale_offer.id_house
    description: ID of sale flow. The sale flow is defined by the tuple buyer / house. It can be started when the buyer makes a booking, offer ou talk to agent event in some house.
  id_agent:
    lineage:
    - datalake_sale_visit.sale_visit.id_agent
    - datalake_sale_offer.sale_offer.id_agent
    description: 'Key of the agent. Can be joined with dw_public.dim_agent. Note: this is NOT the key of the user, so it cannot be joined with the primary key of dim_user. However, it can be joined with dw_public.dim_user.dados_agente_id. However, that is not recommended, since dim_user is much bigger than dim_agent, reducing performance.'
  id_booking:
    lineage:
    - datalake_sale_visit.sale_visit.id_booking
    - datalake_sale_offer.sale_offer.id_booking
    description: Key of the associated booking.
  id_business_unit:
    lineage:
    - datalake_sale_visit.sale_visit.id_business_unit
    - datalake_sale_offer.sale_offer.id_business_unit
    description: Key of the agent's business context at the start of the funnel. There are no associated dimensions yet, but it can be joined with datalake_hub_services_clean.business_unit.
  id_buyer:
    lineage:
    - datalake_sale_visit.sale_visit.id_buyer
    - datalake_sale_offer.sale_offer.id_buyer
    description: Key of the buyer's user. Can be joined with dw_public.dim_user.
  id_house:
    lineage:
    - datalake_sale_visit.sale_visit.id_house
    - datalake_sale_offer.sale_offer.id_house
    description: Key of the associated house.
  id_offer:
    lineage:
    - datalake_sale_offer.sale_offer.id_offer
    description: Key of the associated offer.
  id_region:
    lineage:
    - datalake_sale_visit.sale_visit.id_region
    - datalake_sale_offer.sale_offer.id_region
    description: Key of the associated house's region.
  id_seller:
    lineage:
    - datalake_sale_visit.sale_visit.id_seller
    - datalake_sale_offer.sale_offer.id_owner
    description: Key of the seller's user. Can be joined with dw_public.dim_user.
  sale_type:
    description: Market type for this sale demand event. Visit milestones use listing-side classification from sale_visit; offer and CCV milestones use offer-side classification from sale_offer.
    lineage:
      - datalake_sale_visit.sale_visit.sale_type
      - datalake_sale_offer.sale_offer.sale_type
    categories:
      PRIMARY: New-build / primary market.
      SECONDARY: Resale / secondary market.
  event_name:
    description: Textual name of the demand funnel event this row represents (the label counterpart of sk_event_type). event_name = VISIT_BOOKED identifies a Buyer Prospect (BP) in For Sale demand-funnel metrics; SALE_AGREEMENT_SIGNED is the CCV milestone.
    categories:
      VISIT_BOOKED: Buyer booked a visit to the house.
      VISIT_COMPLETED: Buyer completed the booked visit.
      OFFER_SUBMITTED: Buyer submitted a purchase offer.
      OFFER_ACCEPTED: Seller accepted the buyer's offer.
      SALE_AGREEMENT_CREATED: Sale agreement (CCV) draft was created.
      SALE_AGREEMENT_SIGNED: Sale agreement (CCV) was signed by both parties.
      VISIT_CANCELLED: The previously booked visit was cancelled.
      OFFER_REJECTED: The offer was rejected or dismissed before acceptance.
  dt_event:
    lineage:
    - datalake_sale_visit.sale_visit.ts_booking_created
    - datalake_sale_visit.sale_visit.ts_visit_canceled
    - datalake_sale_visit.sale_visit.ts_visit_completed
    - datalake_sale_offer.sale_offer.ts_offer_submitted
    - datalake_sale_offer.sale_offer.ts_offer_accepted
    - datalake_sale_offer.sale_offer.ts_sale_agreement_created
    - datalake_sale_offer.sale_offer.ts_sale_agreement_signed
    - datalake_sale_offer.sale_offer.ts_offer_dismissed
    description: Calendar date (no time component) on which the funnel event occurred, used to bucket events by day for funnel and cohort analysis. Derived from the event-specific timestamp column for each event type (e.g. ts_booking_created for VISIT_BOOKED, ts_offer_submitted for OFFER_SUBMITTED).
  ts_event:
    lineage:
    - datalake_sale_visit.sale_visit.ts_booking_created
    - datalake_sale_visit.sale_visit.ts_visit_canceled
    - datalake_sale_visit.sale_visit.ts_visit_completed
    - datalake_sale_offer.sale_offer.ts_offer_submitted
    - datalake_sale_offer.sale_offer.ts_offer_accepted
    - datalake_sale_offer.sale_offer.ts_sale_agreement_created
    - datalake_sale_offer.sale_offer.ts_sale_agreement_signed
    - datalake_sale_offer.sale_offer.ts_offer_dismissed
    description: Full timestamp (UTC) at which the funnel event occurred, sourced from the corresponding event-specific timestamp column depending on event_name (visit booking/completion/cancellation from sale_visit; offer and sale-agreement milestones from sale_offer).
