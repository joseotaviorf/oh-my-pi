---
dag:
  name: enrich_sale_demand_events
  schedule_start_date: 2023, 9, 10
  owner: Data ForSale
  documentation:
    dag_purpose: Creates an enriched table containing the ForSale demand events, in which each line is an event related to the scope.
workflow:
  type: query_delta
  layer: enrich
cluster:
  type: databricks_13_3_med_memory_general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
