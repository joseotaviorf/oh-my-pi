---
database_name: datalake_sales_flow_raw
table_name: house
domain: For Sale
owner: helder.rodrigues@quintoandar.com.br
description: Raw CDC table from Sales Flow postgres database with property records in sales flows.
columns:
  id:
    description: Primary key of the house record in the source database.
  external_id:
    description: External house identifier used for integration with other QuintoAndar systems.
  address_data_id:
    description: Foreign key referencing the address_data table in the source database.
  land_tenure:
    description: Land tenure type of the property such as freehold or leasehold.
  house_registration_status:
    description: Current property registration status in the source application.
  has_seller_debt_payments:
    description: Flag indicating pending seller debt payments related to the property.
  has_chattel_mortgage:
    description: Flag indicating whether a chattel mortgage exists on the property.
  registry_must_be_updated:
    description: Flag indicating whether the property registry requires an update.
  chattel_mortgage_remaining_value:
    description: Remaining balance of the chattel mortgage on the property.
  has_debts_or_encumbrances:
    description: Flag indicating debts or encumbrances on the property title.
  has_instituted_usufruct:
    description: Flag indicating an instituted usufruct on the property.
  has_recent_transaction:
    description: Flag indicating a recent property transaction in the source records.
  has_transaction_in_family:
    description: Flag indicating a recent transaction within the seller family.
  image_url:
    description: URL of a property image stored in the Sales Flow application.
  is_primary_market:
    description: Flag indicating whether the property is from the primary market.
  notified_on_negotiation_at:
    description: Timestamp when a negotiation notification was sent for this property.
  created_at:
    description: Timestamp when the house record was created in the source database.
  updated_at:
    description: Timestamp when the house record was last updated in the source database.
  op_cdc:
    description: CDC operation type captured by Debezium (insert, update, or delete).
  ts_cdc_transaction:
    description: Timestamp when the change was captured by the CDC pipeline.
  ts_database_transaction:
    description: Timestamp of the database transaction in the source system.
  cdc_transaction_id:
    description: Source database transaction identifier for the CDC event.
  cdc_binlog_position:
    description: Postgres logical sequence number (LSN) for the CDC event ordering.
  year:
    description: Year partition derived from the CDC ingestion timestamp.
  month:
    description: Month partition derived from the CDC ingestion timestamp.
  day:
    description: Day partition derived from the CDC ingestion timestamp.
  hour:
    description: Hour partition derived from the CDC ingestion timestamp.
