---
database_name: datalake_sales_flow_fast_lane_raw
table_name: sales_flow
domain: For Sale
owner: helder.rodrigues@quintoandar.com.br
description: Raw CDC table from Sales Flow postgres database with main sales flow offer records.
columns:
  id:
    description: Primary key of the sales flow record in the source database.
  buyer_id:
    description: Legacy foreign key to the buyer user; prefer sales_flow_users in downstream layers.
  seller_id:
    description: Legacy foreign key to the seller user; prefer sales_flow_users in downstream layers.
  house_id:
    description: Foreign key referencing the house associated with this sales flow.
  monday_id:
    description: Deprecated Monday.com integration identifier from the source database.
  closing_type_id:
    description: Foreign key referencing the closing type for this sales flow process.
  visit_external_id:
    description: External identifier linking this sales flow to a visit in another system.
  flow_step:
    description: Current step of the sales flow in the closing process.
  flow_type:
    description: Origin or type of the sales flow journey in the source application.
  status_closing:
    description: Detailed closing status such as canceled or credit analysis.
  status:
    description: Macro status of the sales flow in the source application.
  closing_canceled_reason:
    description: Reason recorded when the closing process was canceled.
  buyer_canceled_reason:
    description: Reason provided when the buyer canceled the offer.
  buyer_canceled_comment:
    description: Free-text comment from the buyer explaining the cancellation.
  is_canceled:
    description: Flag indicating whether the sales flow was canceled in the source system.
  canceled_at:
    description: Timestamp when the sales flow was canceled in the source database.
  created_at:
    description: Timestamp when the sales flow record was created in the source database.
  updated_at:
    description: Timestamp when the sales flow record was last updated in the source database.
  op_cdc:
    description: CDC operation type captured by Debezium (insert, update, or delete).
  ts_cdc_transaction:
    description: Timestamp when the change was captured by the CDC pipeline.
  ts_database_transaction:
    description: Timestamp of the database transaction in the source system.
  cdc_transaction_id:
    description: Source database transaction identifier for the CDC event.
  cdc_binlog_position:
    description: Postgres logical sequence number (LSN) for the CDC event ordering.
  year:
    description: Year partition derived from the CDC ingestion timestamp.
  month:
    description: Month partition derived from the CDC ingestion timestamp.
  day:
    description: Day partition derived from the CDC ingestion timestamp.
  hour:
    description: Hour partition derived from the CDC ingestion timestamp.
