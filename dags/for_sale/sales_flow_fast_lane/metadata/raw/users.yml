---
database_name: datalake_sales_flow_raw
table_name: users
domain: For Sale
owner: helder.rodrigues@quintoandar.com.br
description: Raw CDC replica of the `users` table from the Sales Flow application's PostgreSQL database (applications/sales-flow in backend-services). Each row is a person participating in a sales flow, such as a buyer, seller, specialist, or additional contact.
columns:
  id:
    description: Primary key of the user record in the Sales Flow source database.
  external_id:
    description: Identifier of the user in QuintoAndar's central identity/account systems, used to join with EBDB and dim_user. Only populated for MAIN users; ADDITIONAL_CONTACT users created directly in Sales Flow may not have one.
  name:
    description: Full name of the user as registered in Sales Flow.
    tags:
      - PII
      - Confidential
  email:
    description: Email address of the user as registered in Sales Flow.
    tags:
      - PII
      - Confidential
  phone:
    description: Phone number of the user as registered in Sales Flow.
    tags:
      - PII
      - Confidential
  type:
    description: Whether the user has an account in QuintoAndar's platform. Values are MAIN (sourced from QuintoAndar's central identity/account service) and ADDITIONAL_CONTACT (created locally within Sales Flow for people without a platform account, such as a co-buyer or a family member added as a contact).
  cpf:
    description: Brazilian individual taxpayer identification number (CPF) of the user.
    tags:
      - PII
      - Confidential
  created_at:
    description: Timestamp when the user record was created in the source database.
  updated_at:
    description: Timestamp when the user record was last updated in the source database.
  op_cdc:
    description: CDC operation type captured by Debezium (insert, update, or delete).
  ts_cdc_transaction:
    description: Timestamp when the change was captured by the CDC pipeline.
  ts_database_transaction:
    description: Timestamp of the database transaction in the source system.
  cdc_transaction_id:
    description: Source database transaction identifier for the CDC event.
  cdc_binlog_position:
    description: Postgres logical sequence number (LSN) for the CDC event ordering.
  year:
    description: Year partition derived from the CDC ingestion timestamp.
  month:
    description: Month partition derived from the CDC ingestion timestamp.
  day:
    description: Day partition derived from the CDC ingestion timestamp.
  hour:
    description: Hour partition derived from the CDC ingestion timestamp.
