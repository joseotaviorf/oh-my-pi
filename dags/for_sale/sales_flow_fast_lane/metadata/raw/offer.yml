---
database_name: datalake_sales_flow_fast_lane_raw
table_name: offer
domain: For Sale
owner: helder.rodrigues@quintoandar.com.br
description: Raw CDC table from Sales Flow postgres database with buyer offer records.
columns:
  id:
    description: Primary key of the offer record in the source database.
  sales_flow_id:
    description: Foreign key referencing the parent sales flow for this offer.
  firestore_id:
    description: Offer identifier generated and stored in Firestore.
  reject_reason_id:
    description: Foreign key referencing the reject reason lookup table.
  hub_id:
    description: Foreign key referencing the hub in HubServices systems.
  offer_price:
    description: Price value proposed by the buyer in the offer.
  sale_price:
    description: Listing sale price set by the seller at the time of the offer.
  final_price:
    description: Final negotiated price agreed between buyer and seller.
  itbi_price:
    description: Property transfer tax (ITBI) value registered for the offer.
  registry_price:
    description: Property registry price associated with the offer.
  deed_price:
    description: Property price recorded in the deed for this offer.
  discard_reason:
    description: Reason why the offer was discarded in the source application.
  status:
    description: Current status of the offer in the Sales Flow application.
  furniture_will_be_left:
    description: Flag indicating whether furniture will remain in the property.
  preemptive_right:
    description: Flag indicating whether preemptive right applies to this offer.
  seller_counter_proposal:
    description: Flag indicating whether the seller submitted a counter proposal.
  updated_offer_price:
    description: Flag indicating whether the offer price was updated after submission.
  seller_has_done_onboarding:
    description: Flag indicating whether the seller completed onboarding for this offer.
  buyer_has_done_onboarding:
    description: Flag indicating whether the buyer completed onboarding for this offer.
  used_offer_suggestion:
    description: Flag indicating whether the buyer used an offer suggestion feature.
  proposal_date:
    description: Date when the offer proposal was submitted in the source system.
  accepted_at:
    description: Timestamp when the seller accepted the buyer offer in the source system.
  validated_at:
    description: Deprecated validation timestamp from the source database.
  discarded_at:
    description: Timestamp when the offer was discarded in the source database.
  created_at:
    description: Timestamp when the offer record was created in the source database.
  updated_at:
    description: Timestamp when the offer record was last updated in the source database.
  op_cdc:
    description: CDC operation type captured by Debezium (insert, update, or delete).
  ts_cdc_transaction:
    description: Timestamp when the change was captured by the CDC pipeline.
  ts_database_transaction:
    description: Timestamp of the database transaction in the source system.
  cdc_transaction_id:
    description: Source database transaction identifier for the CDC event.
  cdc_binlog_position:
    description: Postgres logical sequence number (LSN) for the CDC event ordering.
  year:
    description: Year partition derived from the CDC ingestion timestamp.
  month:
    description: Month partition derived from the CDC ingestion timestamp.
  day:
    description: Day partition derived from the CDC ingestion timestamp.
  hour:
    description: Hour partition derived from the CDC ingestion timestamp.
