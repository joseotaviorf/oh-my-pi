---
database_name: datalake_sales_flow_fast_lane_raw
table_name: specialist
domain: For Sale
owner: helder.rodrigues@quintoandar.com.br
description: Raw CDC table from Sales Flow postgres database with specialist records linked to a sales flow.
columns:
  id:
    description: Primary key of the specialist record in the source database.
  sales_flow_id:
    description: Foreign key referencing the sales flow associated with this specialist.
  user_id:
    description: Foreign key referencing the user assigned as specialist for the sales flow.
  kind:
    description: Specialist role or category within the sales flow process.
  created_at:
    description: Timestamp when the record was created in the source database.
  updated_at:
    description: Timestamp when the record was last updated in the source database.
  op_cdc:
    description: CDC operation type captured by Debezium (insert, update, or delete).
  ts_cdc_transaction:
    description: Timestamp when the change was captured by the CDC pipeline.
  ts_database_transaction:
    description: Timestamp of the database transaction in the source system.
  cdc_transaction_id:
    description: Source database transaction identifier for the CDC event.
  cdc_binlog_position:
    description: Postgres logical sequence number (LSN) for the CDC event ordering.
  year:
    description: Year partition derived from the CDC ingestion timestamp.
  month:
    description: Month partition derived from the CDC ingestion timestamp.
  day:
    description: Day partition derived from the CDC ingestion timestamp.
  hour:
    description: Hour partition derived from the CDC ingestion timestamp.
