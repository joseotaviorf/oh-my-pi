database_name: datalake_sales_flow_fast_lane_clean
table_name: payment
domain: For Sale
owner: helder.rodrigues@quintoandar.com.br
description: Table that contains information about the payment payment.
columns:
  id:
    description: Unique ID for this payment on this table.
    lineage:
      - datalake_sales_flow_fast_lane_raw.payment.id
  id_sales_flow:
    description: SalesFlow payment ID. Joins with datalake_sales_flow_fast_lane_clean.sales_flow.id
    lineage:
      - datalake_sales_flow_fast_lane_raw.payment.sales_flow_id
  payment_method:
    description: Payment method (Cash, financed, etc)
    lineage:
      - datalake_sales_flow_fast_lane_raw.payment.payment_method
  payment_model:
    description: Payment model used in the purchase of the property (CCV_ASSISTANCE, INSTANT_MORTGAGE, etc)
    lineage:
      - datalake_sales_flow_fast_lane_raw.payment.payment_model
  down_payment_value:
    description: Amount paid by the buyer to signal the continuation of the purchase.
    lineage:
      - datalake_sales_flow_fast_lane_raw.payment.down_payment_value
  entry_amount:
    description: Value paid by the buyer on the beginning of the contract.
    lineage:
      - datalake_sales_flow_fast_lane_raw.payment.entry_amount
  fgts_value:
    description: FGTS value used in the purchase.
    lineage:
      - datalake_sales_flow_fast_lane_raw.payment.fgts_value
  status:
    description: Status used to track the buyer's payment.
    lineage:
      - datalake_sales_flow_fast_lane_raw.payment.status
  fgts_doc_submission_finished_by:
    description: Who finished the FGTS doc submission.
    lineage:
      - datalake_sales_flow_fast_lane_raw.payment.fgts_doc_submission_finished_by
  fgts_payment_finished_by:
    description: Who finished the FGTS payment.
    lineage:
      - datalake_sales_flow_fast_lane_raw.payment.fgts_payment_finished_by
  is_down_payment_paid:
    description: Boolean indicating if the down payment was paid.
    lineage:
      - datalake_sales_flow_fast_lane_raw.payment.is_down_payment_paid
  payment_type:
    description: Type of the payment.
    lineage:
      - datalake_sales_flow_fast_lane_raw.payment.payment_type
  ts_down_payment_paid:
    description: Timestamp that indicates when the down payment was paid.
    lineage:
      - datalake_sales_flow_fast_lane_raw.payment.down_payment_paid_at
  ts_fgts_doc_submission_finished:
    description: Timestamp that indicates when the FGTS doc submission was finished.
    lineage:
      - datalake_sales_flow_fast_lane_raw.payment.fgts_doc_submission_finished_at
  ts_fgts_payment_finished:
    description: Timestamp that indicates when the FGTS payment was finished.
    lineage:
      - datalake_sales_flow_fast_lane_raw.payment.fgts_payment_finished_at
  ts_created:
    description: Timestamp that indicates when this entry was created.
    lineage:
      - datalake_sales_flow_fast_lane_raw.payment.created_at
  ts_updated:
    description: Timestamp that indicates when this entry was last updated.
    lineage:
      - datalake_sales_flow_fast_lane_raw.payment.updated_at
  year:
    description: The Year in which the data was ingested.
    lineage:
      - datalake_sales_flow_fast_lane_raw.payment.year
  month:
    description: The Month in which the data was ingested.
    lineage:
      - datalake_sales_flow_fast_lane_raw.payment.month
  day:
    description: The Day in which the data was ingested.
    lineage:
      - datalake_sales_flow_fast_lane_raw.payment.day
