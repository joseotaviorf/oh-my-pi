database_name: datalake_sales_flow_clean
table_name: payment
domain: For Sale
owner: helder.rodrigues@quintoandar.com.br
description: Clean, renamed replica of datalake_sales_flow_raw.payment. Each row tracks the financial settlement details and payment milestones (down payment/earnest money, FGTS, financing) for a sales flow's closing process.
columns:
  id:
    description: Unique identifier of the payment record in this table.
    lineage:
      - datalake_sales_flow_raw.payment.id
  id_sales_flow:
    description: Identifier of the sales flow this payment belongs to. Joins with datalake_sales_flow_clean.sales_flow.id. Each sales flow has exactly one payment record.
    lineage:
      - datalake_sales_flow_raw.payment.sales_flow_id
  payment_method:
    description: How the purchase will be paid. Values are CASH, CASH_USING_FGTS, FINANCED, FINANCED_USING_FGTS, FINANCED_USING_THIRD_COMPANY (financed outside QuintoAndar's closing model), and NOT_DEFINED.
    lineage:
      - datalake_sales_flow_raw.payment.payment_method
  payment_model:
    description: Commercial/operational model used to run the closing and payment flow. Values include TRANSFER_BETWEEN_PARTS, MODEL_5A (legacy QuintoAndar pass-through model), ADVANCED_PAYMENT (current standard model), INSTANT_MORTGAGE, CCV_ASSISTANCE, BROKERAGE_TERM, CLOSING_3P (partner real-estate agency closing), CLOSING_PRIMARY_MARKET, and NA.
    lineage:
      - datalake_sales_flow_raw.payment.payment_model
  down_payment_value:
    description: Amount of the deposit paid by the buyer. Despite the name, this field is used for any deposit type, including both the down payment ("entrada") and the earnest money signal ("sinal").
    lineage:
      - datalake_sales_flow_raw.payment.down_payment_value
  entry_amount:
    description: Entry amount value tracked for the purchase, in addition to down_payment_value.
    lineage:
      - datalake_sales_flow_raw.payment.entry_amount
  fgts_value:
    description: FGTS balance amount applied toward the property purchase.
    lineage:
      - datalake_sales_flow_raw.payment.fgts_value
  status:
    description: Payment progress tracking status. Values are NOT_STARTED, DOWN_PAYMENT_PAID, DOWN_PAYMENT_NOT_PAID, EARNEST_PAYMENT_PAID, EARNEST_PAYMENT_NOT_PAID, TOTAL_PAID, and TOTAL_NOT_PAID.
    lineage:
      - datalake_sales_flow_raw.payment.status
  fgts_doc_submission_finished_by:
    description: Party that completed the FGTS documentation submission step. Value is BUYER or SELLER, not a user identifier.
    lineage:
      - datalake_sales_flow_raw.payment.fgts_doc_submission_finished_by
  fgts_payment_finished_by:
    description: Party that completed the FGTS payment step. Value is BUYER or SELLER, not a user identifier.
    lineage:
      - datalake_sales_flow_raw.payment.fgts_payment_finished_by
  is_down_payment_paid:
    description: Flag indicating whether the deposit (down payment or earnest money) has been paid.
    lineage:
      - datalake_sales_flow_raw.payment.is_down_payment_paid
  payment_type:
    description: Method used to transfer the payment. Values are TRANSFER and CASHIER_CHECK.
    lineage:
      - datalake_sales_flow_raw.payment.payment_type
  ts_down_payment_paid:
    description: Timestamp when the deposit was confirmed as paid in the source system.
    lineage:
      - datalake_sales_flow_raw.payment.down_payment_paid_at
  ts_fgts_doc_submission_finished:
    description: Timestamp when the FGTS document submission step was completed in the source system.
    lineage:
      - datalake_sales_flow_raw.payment.fgts_doc_submission_finished_at
  ts_fgts_payment_finished:
    description: Timestamp when the FGTS payment step was completed in the source system.
    lineage:
      - datalake_sales_flow_raw.payment.fgts_payment_finished_at
  ts_created:
    description: Timestamp when the payment record was created in the source database.
    lineage:
      - datalake_sales_flow_raw.payment.created_at
  ts_updated:
    description: Timestamp when the payment record was last updated in the source database.
    lineage:
      - datalake_sales_flow_raw.payment.updated_at
  year:
    description: Year partition derived from the CDC ingestion timestamp.
    lineage:
      - datalake_sales_flow_raw.payment.year
  month:
    description: Month partition derived from the CDC ingestion timestamp.
    lineage:
      - datalake_sales_flow_raw.payment.month
  day:
    description: Day partition derived from the CDC ingestion timestamp.
    lineage:
      - datalake_sales_flow_raw.payment.day
