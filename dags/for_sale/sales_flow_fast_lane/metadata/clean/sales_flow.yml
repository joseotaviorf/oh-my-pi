database_name: datalake_sales_flow_clean
table_name: sales_flow
domain: For Sale
owner: helder.rodrigues@quintoandar.com.br
description: Clean, renamed replica of datalake_sales_flow_raw.sales_flow. This is the aggregate root of a home-purchase transaction in the For Sale journey, linking buyer, seller, house, offer, payment, and specialists, and tracking the deal's lifecycle from offer/negotiation through CCV signature, onboarding, and mortgage, to closing or rescission/cancellation.
columns:
  id:
    description: Unique identifier of the sales flow record in this table.
    lineage:
      - datalake_sales_flow_raw.sales_flow.id
  id_buyer:
    description: Identifier of the buyer's user record. Kept in sync with the BUYER role in sales_flow_users, which supports multiple co-buyers; the application reads sales_flow_users first and falls back to this column, so prefer sales_flow_users for buyer lookups.
    lineage:
      - datalake_sales_flow_raw.sales_flow.buyer_id
  id_seller:
    description: Identifier of the seller's user record. Kept in sync with the SELLER role in sales_flow_users, which supports multiple co-sellers; the application reads sales_flow_users first and falls back to this column, so prefer sales_flow_users for seller lookups.
    lineage:
      - datalake_sales_flow_raw.sales_flow.seller_id
  id_house:
    description: Identifier of the house being sold in this sales flow.
    lineage:
      - datalake_sales_flow_raw.sales_flow.house_id
  id_monday:
    description: Deprecated identifier from an earlier Monday.com integration. Do not use.
    lineage:
      - datalake_sales_flow_raw.sales_flow.monday_id
  id_closing_type:
    description: Identifier of the closing_type lookup table describing how the closing process is run for this flow. Joins with datalake_sales_flow_clean.closing_type.id.
    lineage:
      - datalake_sales_flow_raw.sales_flow.closing_type_id
  id_visit_external:
    description: External identifier linking this sales flow to a property visit recorded in another system.
    lineage:
      - datalake_sales_flow_raw.sales_flow.visit_external_id
  flow_step:
    description: High-level lifecycle marker used to tell at a glance whether the flow is ongoing, completed, or canceled. Values include PROPOSAL_ON_VALIDATION, PROPOSAL_ONGOING, PROPOSAL_ACCEPTED, POST_CCV, POST_CCV_HUB_CT, PURCHASE_SALE_COMPLETED, CANCELED_CCV, CANCELED_POST_ACCEPTED, CANCELED_ON_NEGOTIATION, and CANCELED_ON_VALIDATION. Can be null for older records created before this column existed.
    lineage:
      - datalake_sales_flow_raw.sales_flow.flow_step
  flow_type:
    description: Origin or channel of the sales flow. Values are DEFAULT, CLOSING_CENTRAL, and HUB.
    lineage:
      - datalake_sales_flow_raw.sales_flow.flow_type
  status_closing:
    description: Detailed, ordered closing/transactional stage of the post-CCV flow, such as ONBOARDING, EARNEST_PAYMENT, DILIGENCE, CREDIT_ANALYSIS, FINANCING_ANALYSIS, CRI, SELLER_PAYMENT, END, CANCELED, and DILIGENCE_CANCELED. Can be null for flows still in negotiation or pre-CCV stages.
    lineage:
      - datalake_sales_flow_raw.sales_flow.status_closing
  status:
    description: Macro lifecycle status of the deal. Values are OFFER, CCV, ONBOARDING, MORTGAGE, RESCISSION (canceled), and FROM_MANUAL_SYNC. Valid forward transitions are enforced by the application, e.g. OFFER to CCV, then to ONBOARDING or RESCISSION, then to MORTGAGE, then to RESCISSION.
    lineage:
      - datalake_sales_flow_raw.sales_flow.status
  buyer_canceled_reason:
    description: Reason recorded when the buyer canceled the offer or negotiation. Values include LACK_OF_AGREEMENT_ON_NEGOTIATION_VALUE, BUYER_BOUGHT_ANOTHER_HOUSE, HOUSE_INFORMATION_WAS_INCORRECT, PROBLEM_WITH_THE_NEGOTIATOR, BUYER_DID_NOT_GET_CREDIT_LETTER_OR_FINANCING, and OTHER.
    lineage:
      - datalake_sales_flow_raw.sales_flow.buyer_canceled_reason
  buyer_canceled_comment:
    description: Free-text comment from the buyer explaining the cancellation.
    lineage:
      - datalake_sales_flow_raw.sales_flow.buyer_canceled_comment
  closing_canceled_reason:
    description: Reason recorded when the closing process was canceled. Values include CREDIT_NOT_APPROVED, BUYER_QUIT, SELLER_QUIT, DILIGENCE_NO_GO, BUYER_REJECTED_DILIGENCE, QA_MODEL (buyer or seller disliked the 5A model), INSUFFICIENT_INCOME, DOCUMENTATION_PROBLEMS, and OTHER.
    lineage:
      - datalake_sales_flow_raw.sales_flow.closing_canceled_reason
  is_canceled:
    description: Flag indicating whether the sales flow has been canceled. Used together with flow_step to determine whether the deal is ongoing (is_canceled is false and flow_step is not PURCHASE_SALE_COMPLETED).
    lineage:
      - datalake_sales_flow_raw.sales_flow.is_canceled
  ts_canceled:
    description: Timestamp when the sales flow was canceled in the source database.
    lineage:
      - datalake_sales_flow_raw.sales_flow.canceled_at
  ts_created:
    description: Timestamp when the sales flow record was created in the source database.
    lineage:
      - datalake_sales_flow_raw.sales_flow.created_at
  ts_updated:
    description: Timestamp when the sales flow record was last updated in the source database.
    lineage:
      - datalake_sales_flow_raw.sales_flow.updated_at
  year:
    description: Year partition derived from the CDC ingestion timestamp.
    lineage:
      - datalake_sales_flow_raw.sales_flow.year
  month:
    description: Month partition derived from the CDC ingestion timestamp.
    lineage:
      - datalake_sales_flow_raw.sales_flow.month
  day:
    description: Day partition derived from the CDC ingestion timestamp.
    lineage:
      - datalake_sales_flow_raw.sales_flow.day
