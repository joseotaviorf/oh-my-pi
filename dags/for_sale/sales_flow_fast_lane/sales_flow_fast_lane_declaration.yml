dag:
  name: sales_flow_fast_lane
  schedule_start_date: 2026, 5, 25
  schedule_interval: "*/30 10-21,0 * * *"
  owner: Data ForSale
  documentation:
    dag_purpose: |
      DAG containing high-frequency tables from Sales Flow context that run 30 min.
workflow:
  type: cdc
  layer: raw
  database_type: postgres
  source_database: salesflow
  custom_schema: sales_flow
  dbutils_secret_key: SALESFLOW_DB
  execution_timeout_hours: 0.5 # Task execution timeout 30 min
  tables_customization:
    specialist:
      clean_table_name: specialist
      raw_primary_keys: ["id"]
      clean_primary_keys: ["id_specialist"]
    users:
      clean_table_name: users
      raw_primary_keys: ["id"]
      clean_primary_keys: ["id"]
    sales_flow:
      clean_table_name: sales_flow
      raw_primary_keys: ["id"]
      clean_primary_keys: ["id"]
    offer:
      clean_table_name: offer
      raw_primary_keys: ["id"]
      clean_primary_keys: ["id"]
    payment:
      clean_table_name: payment
      raw_primary_keys: ["id"]
      clean_primary_keys: ["id"]
    house:
      clean_table_name: house
      raw_primary_keys: ["id"]
      clean_primary_keys: ["id"]
    buyer_data:
      clean_table_name: buyer_data
      raw_primary_keys: ["id"]
      clean_primary_keys: ["id_buyer"]
    seller_data:
      clean_table_name: seller_data
      raw_primary_keys: ["id"]
      clean_primary_keys: ["id_seller"]
    brokerage:
      clean_table_name: brokerage
      raw_primary_keys: ["id"]
      clean_primary_keys: ["id_brokerage"]
    ccv:
      clean_table_name: ccv
      raw_primary_keys: ["id"]
      clean_primary_keys: ["id"]
    ccv_flow:
      clean_table_name: ccv_flow
      raw_primary_keys: ["id"]
      clean_primary_keys: ["id_ccv_flow"]
    task_manager_info:
      clean_table_name: task_manager_info
      raw_primary_keys: ["id"]
      clean_primary_keys: ["id"]
    ccv_termination:
      clean_table_name: ccv_termination
      raw_primary_keys: ["id"]
      clean_primary_keys: ["id_ccv_termination"]
