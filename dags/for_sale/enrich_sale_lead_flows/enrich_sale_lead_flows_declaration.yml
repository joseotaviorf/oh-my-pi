---
dag:
  name: enrich_sale_lead_flows
  schedule_start_date: 2021, 12, 1
  owner: Data ForSale
  documentation:
    dag_purpose: Creates enriched tables for the context `sale_lead_flows`, enriching
      leads from Casa Mineira, Classifieds, Hub Services and QuintoAndar.
workflow:
  type: query_delta
  layer: enrich
  inner_dependencies:
    lead_flow:
    - casa_mineira_lead_flow
    - classified_lead_flow
    - hub_services_lead_flow
    - quintoandar_lead_flow
cluster:
  type: databricks_12_2_med_memory_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
