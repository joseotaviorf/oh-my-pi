  ts_first_sale_agreement_signed:
    lineage:
    - datalake_sale_lead_flows.casa_mineira_lead_flow.ts_first_sale_agreement_signed
    - datalake_sale_lead_flows.quintoandar_lead_flow.ts_first_sale_agreement_signed
    description: Timestamp of the first CCV signed by the buyer, via 5A or CM.
  ts_last_sale_agreement_signed:
    lineage:
    - datalake_sale_lead_flows.casa_mineira_lead_flow.ts_last_sale_agreement_signed
    - datalake_sale_lead_flows.quintoandar_lead_flow.ts_last_sale_agreement_signed
    description: Timestamp of the last CCV signed by the buyer, via 5A or CM.
  ts_first_combo_event_contact_prospect:
    lineage:
    - datalake_sale_lead_flows.casa_mineira_lead_flow.ts_first_combo_event_contact_prospect
