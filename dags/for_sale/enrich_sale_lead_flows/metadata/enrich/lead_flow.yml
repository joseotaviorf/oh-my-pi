  ts_last_offer_accepted:
    lineage:
    - datalake_sale_lead_flows.casa_mineira_lead_flow.ts_last_sale_agreement_signed
    - datalake_sale_lead_flows.quintoandar_lead_flow.ts_last_offer_accepted
