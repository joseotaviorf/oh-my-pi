    lineage:
    - datalake_casa_mineira_crm_clean.contact.ts_created
  ts_first_booking_created:
    description: Timestamp indicating this user first booking creation
    lineage:
    - datalake_casa_mineira_crm_clean.visit.ts_created
  ts_last_booking_created:
    description: Timestamp indicating this user last booking creation
    lineage:
    - datalake_casa_mineira_crm_clean.visit.ts_created
  ts_first_visit_completed:
    description: Timestamp indicating this user first visit completed
    lineage:
    - datalake_casa_mineira_crm_clean.visit.ts_visited
  ts_last_visit_completed:
    description: Timestamp indicating this user last visit completed
    lineage:
    - datalake_casa_mineira_crm_clean.visit.ts_visited
  ts_first_offer_submitted:
    description: Timestamp indicating this user first offer submitted
    lineage:
    - datalake_casa_mineira_crm_clean.sale.ts_created
  ts_last_offer_submitted:
    description: Timestamp indicating this user last offer submitted
    lineage:
    - datalake_casa_mineira_crm_clean.sale.ts_created
  ts_first_sale_agreement_signed:
