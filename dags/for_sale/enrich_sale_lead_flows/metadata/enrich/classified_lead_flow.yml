database_name: datalake_sale_lead_flows
table_name: classified_lead_flow
description: Enriched table to track the lead from Classificados.
domain: For Sale
owner: guilherme.rocha@quintoandar.com.br
columns:
  id_classified_lead:
    description: Identifier of the lead contact originated from Classificados, sourced from lead_contact in datalake_classified_leads_clean.
    lineage:
    - datalake_classified_leads_clean.lead_contact.id
  id_region:
    description: Identifier of the geographic region of the property associated with the lead.
    lineage:
    - datalake_ebdb_clean.house.id_region
  id_house:
    description: Foreign key to the property listing involved in the visit or transaction.
    lineage:
    - datalake_classified_leads_clean.lead_contact.id_property
  email:
    description: Contact email address used for notifications and identity matching.
    lineage:
    - datalake_classified_leads_clean.lead_contact.user_email
  phone_number:
    description: Contact phone number of the lead, combining the area code (DDD) and the user phone number.
    lineage:
    - datalake_classified_leads_clean.lead_contact.user_phone_number
    - datalake_classified_leads_clean.lead_contact.user_ddd
  origin_partner:
    description: Name of the Classificados partner portal from which the lead originated.
    lineage:
    - datalake_classified_leads_clean.lead_contact.origin_partner
  ts_intent:
    description: Timestamp indicating when this lead was received
    lineage:
    - datalake_classified_leads_clean.lead_contact.ts_received
