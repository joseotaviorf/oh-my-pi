database_name: datalake_sale_lead_flows
table_name: last_secretariat
owner: guilherme.rocha@quintoandar.com.br
domain: For Sale
description: This enrich table assigns the last secretariat user that was assigned to an user.
columns:
  sk_user:
    description: User ID on 5A main table (EBDB)
    lineage:
    - datalake_ebdb_clean.user.id
    - datalake_hub_services_clean.visitor.id_external
  id_responsible:
    description: Responsible ID on Hub Services tables for the last secretariat assigned for this user
    lineage:
    - datalake_hub_services_clean.responsible.id_responsible
  sk_user_last_secretariat:
    description: Last secretariat ID on 5A main tables (EBDB)
    lineage:
      - datalake_secretariat.secretariat_allocation_history.id_secretariat_user
  ts_assigned_started:
    description: Timestamp of when this secretariat was first assigned to this user
    lineage:
    - datalake_hub_services_clean.responsible.ts_assigned
  ts_assigned_ended:
    description: Timestamp of when this secretariat was unassigned from this user
    lineage:
    - datalake_hub_services_clean.responsible.ts_assigned
