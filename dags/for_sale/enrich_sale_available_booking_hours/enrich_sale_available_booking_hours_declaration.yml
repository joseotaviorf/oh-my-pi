---
dag:
  name: enrich_sale_available_booking_hours
  schedule_start_date: 2022, 7, 22
  owner: Data ForSale
  documentation:
    dag_purpose: This dag is intended to handle the enriched table for sale of available times for booking for each listing.
workflow:
  type: query_delta
  layer: enrich
cluster:
  type: databricks_12_2_med_memory_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
