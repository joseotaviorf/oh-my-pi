database_name: datalake_sales_flow_clean
table_name: ccv_aud
domain: For Sale
columns:
  id:
    lineage:
    - datalake_sales_flow_raw.ccv_aud.id
    description: Surrogate primary key of the ccv aud row in the source system.
  id_sales_flow:
    lineage:
    - datalake_sales_flow_raw.ccv_aud.sales_flow_id
    description: Foreign key to the parent sales flow transaction in the end-of-funnel domain.
  id_house:
    lineage:
    - datalake_sales_flow_raw.ccv_aud.house_id
    description: Foreign key to the property listing involved in the visit or transaction.
  signed_document_token:
    lineage:
    - datalake_sales_flow_raw.ccv_aud.signed_document_token
    description: Audited storage token referencing the signed CCV contract document.
  unsigned_document_token:
    lineage:
    - datalake_sales_flow_raw.ccv_aud.unsigned_document_token
    description: Audited storage token referencing the unsigned draft of the CCV contract document.
  sale_price:
    lineage:
    - datalake_sales_flow_raw.ccv_aud.sale_value
    description: Audited agreed sale price of the property recorded in the CCV contract.
  ccv_version:
    lineage:
    - datalake_sales_flow_raw.ccv_aud.ccv_version
    description: Audited version of the CCV contract template applied to this record.
  status:
    lineage:
    - datalake_sales_flow_raw.ccv_aud.status
    description: Current operational status code governing workflow progression for this record.
  rev:
    lineage:
    - datalake_sales_flow_raw.ccv_aud.rev
    description: Envers revision number grouping field-level changes in this audit snapshot.
  rev_type:
    lineage:
    - datalake_sales_flow_raw.ccv_aud.revtype
    description: 'Envers revision type code: insert, update, or delete for the audited row.'
  rev_end:
    lineage:
    - datalake_sales_flow_raw.ccv_aud.revend
    description: Envers revision end marker when this audited row version was superseded.
  mod_id_sales_flow:
    lineage:
    - datalake_sales_flow_raw.ccv_aud.sales_flow_id_mod
    description: Envers boolean flag indicating whether id sales flow changed in this audit revision.
  mod_id_house:
    lineage:
    - datalake_sales_flow_raw.ccv_aud.house_id_mod
    description: Envers boolean flag indicating whether id house changed in this audit revision.
  mod_signed_document_token:
    lineage:
    - datalake_sales_flow_raw.ccv_aud.signed_document_token_mod
    description: Envers boolean flag indicating whether signed document token changed in this audit revision.
  mod_unsigned_document_token:
    lineage:
    - datalake_sales_flow_raw.ccv_aud.unsigned_document_token_mod
    description: Envers boolean flag indicating whether unsigned document token changed in this audit revision.
  mod_sale_price:
    lineage:
    - datalake_sales_flow_raw.ccv_aud.sale_value_mod
    description: Envers boolean flag indicating whether sale price changed in this audit revision.
  mod_ccv_version:
    lineage:
    - datalake_sales_flow_raw.ccv_aud.ccv_version_mod
    description: Envers boolean flag indicating whether ccv version changed in this audit revision.
  mod_status:
    lineage:
    - datalake_sales_flow_raw.ccv_aud.status_mod
    description: Envers boolean flag indicating whether status changed in this audit revision.
  mod_ts_signed:
    lineage:
    - datalake_sales_flow_raw.ccv_aud.signed_at_mod
    description: Envers boolean flag indicating whether ts signed changed in this audit revision.
  ts_signed:
    lineage:
    - datalake_sales_flow_raw.ccv_aud.signed_at
    description: Audited timestamp marking when the CCV contract was signed by the parties.
  ts_created:
    lineage:
    - datalake_sales_flow_raw.ccv_aud.created_at
    description: Timestamp when the row was first created in the source operational system.
  ts_updated:
    lineage:
    - datalake_sales_flow_raw.ccv_aud.updated_at
    description: Timestamp when the row was last updated in the source operational system.
  year:
    lineage:
    - datalake_sales_flow_raw.ccv_aud.year
    description: Year when the ETL run loaded this row into the lake table.
  month:
    lineage:
    - datalake_sales_flow_raw.ccv_aud.month
    description: Month when the ETL run loaded this row into the lake table.
  day:
    lineage:
    - datalake_sales_flow_raw.ccv_aud.day
    description: Day when the ETL run loaded this row into the lake table.
owner: helder.rodrigues@quintoandar.com.br
description: Hibernate Envers audit trail of ccv rows from Sales Flow service managing For Sale operations after an offer is received. Each revision records field-level changes for compliance and operational forensics.
