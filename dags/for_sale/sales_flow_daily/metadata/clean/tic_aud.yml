---
database_name: datalake_sales_flow_clean
table_name: tic_aud
domain: For Sale
owner: helder.rodrigues@quintoandar.com.br
description: |
  Audit history for TIC (Termo de Intermediação Compartilhada) records from
  Sales Flow. Each row is one revision of a tic entity, tracking changes to document references,
  status transitions (CREATED to SIGNED), template version, and upload origin as partners progress
  through the CDI TIC creation and upload flow. Join rev with datalake_sales_flow_clean.revinfo
  to resolve revision timestamps. Use alongside tic for point-in-time analysis of document lifecycle.
columns:
  id:
    description: Entity identifier of the audited TIC record (matches tic.id in the clean layer).
    lineage:
      - datalake_sales_flow_raw.tic_aud.id
  rev:
    description: |
      Envers revision identifier for this audit row. Join with datalake_sales_flow_clean.revinfo.id
      to obtain the revision timestamp and author.
    lineage:
      - datalake_sales_flow_raw.tic_aud.rev
  rev_type:
    description: |
      Hibernate Envers revision type for the change event.
      Known values: 0 (create), 1 (update), 2 (delete).
    lineage:
      - datalake_sales_flow_raw.tic_aud.revtype
  rev_end:
    description: Revision identifier of the audit entry that superseded this row in the Envers chain.
    lineage:
      - datalake_sales_flow_raw.tic_aud.revend
  id_sales_flow:
    description: |
      Sales flow foreign key at this revision. Links the TIC audit entry to its 3P offer
      (paymentModel CLOSING_3P) in datalake_sales_flow_clean.sales_flow.
    lineage:
      - datalake_sales_flow_raw.tic_aud.sales_flow_id
  mod_id_sales_flow:
    description: Envers flag indicating whether id_sales_flow changed in this revision.
    lineage:
      - datalake_sales_flow_raw.tic_aud.sales_flow_id_mod
  uuid_signed_document_reference:
    description: |
      BlobVault objectId of the signed TIC PDF at this revision, stored in the sales-flow-tic bucket.
    lineage:
      - datalake_sales_flow_raw.tic_aud.signed_document_reference
  mod_uuid_signed_document_reference:
    description: Envers flag indicating whether uuid_signed_document_reference changed in this revision.
    lineage:
      - datalake_sales_flow_raw.tic_aud.signed_document_reference_mod
  uuid_unsigned_document_reference:
    description: |
      BlobVault objectId of the unsigned TIC PDF at this revision, generated by contract-filler.
    lineage:
      - datalake_sales_flow_raw.tic_aud.unsigned_document_reference
  mod_uuid_unsigned_document_reference:
    description: Envers flag indicating whether uuid_unsigned_document_reference changed in this revision.
    lineage:
      - datalake_sales_flow_raw.tic_aud.unsigned_document_reference_mod
  status:
    description: |
      TIC lifecycle status at this revision. Tracks transitions such as CREATED (document confirmed
      or initially uploaded) and SIGNED (final signed document committed with CCV).
    categories:
      CREATED: TIC document generated and confirmed, or signed reference saved before final commit.
      SIGNED: Final signed TIC stored and committed together with CCV in the 3P closing flow.
    lineage:
      - datalake_sales_flow_raw.tic_aud.status
  mod_status:
    description: Envers flag indicating whether status changed in this revision.
    lineage:
      - datalake_sales_flow_raw.tic_aud.status_mod
  template_version:
    description: Contract-filler template version applied when the TIC PDF was generated at this revision.
    lineage:
      - datalake_sales_flow_raw.tic_aud.template_version
  mod_template_version:
    description: Envers flag indicating whether template_version changed in this revision.
    lineage:
      - datalake_sales_flow_raw.tic_aud.template_version_mod
  signed_document_origin:
    description: |
      Upload channel for the signed document at this revision. CDI for Central da Imobiliária;
      VENDAS when uploaded via the Vendas backoffice — covers both the legacy QuintoAndar expert
      flow and cases where the real estate agency requested the upload through support channels.
    categories:
      CDI: Document uploaded by the partner through Central da Imobiliária.
      VENDAS: Document uploaded via Vendas backoffice — either by a QuintoAndar expert in the legacy flow, or on behalf of a real estate agency that requested upload through support channels.
    lineage:
      - datalake_sales_flow_raw.tic_aud.signed_document_origin
  mod_signed_document_origin:
    description: Envers flag indicating whether signed_document_origin changed in this revision.
    lineage:
      - datalake_sales_flow_raw.tic_aud.signed_document_origin_mod
  mod_ts_updated:
    description: Envers flag indicating whether ts_updated changed in this revision.
    lineage:
      - datalake_sales_flow_raw.tic_aud.updated_at_mod
  ts_created:
    description: Entity creation timestamp preserved in this audit revision.
    lineage:
      - datalake_sales_flow_raw.tic_aud.created_at
  ts_updated:
    description: Entity last-update timestamp preserved in this audit revision.
    lineage:
      - datalake_sales_flow_raw.tic_aud.updated_at
  year:
    description: Year derived from the CDC ingestion timestamp.
    lineage:
      - datalake_sales_flow_raw.tic_aud.year
  month:
    description: Month derived from the CDC ingestion timestamp.
    lineage:
      - datalake_sales_flow_raw.tic_aud.month
  day:
    description: Day derived from the CDC ingestion timestamp.
    lineage:
      - datalake_sales_flow_raw.tic_aud.day
