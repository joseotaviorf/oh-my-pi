---
database_name: datalake_sales_flow_clean
table_name: tic
domain: For Sale
owner: helder.rodrigues@quintoandar.com.br
description: |
  Clean table with the current state of TIC (Termo de Intermediação Compartilhada) records from
  Sales Flow. TIC is the mandatory shared brokerage contract for For Sale Marketplace offers
  conducted by partner real estate agencies (paymentModel CLOSING_3P — TSC and CQA programs).
  Each row represents one TIC document lifecycle for a sales flow: generation via contract-filler,
  partner review in Central da Imobiliária (CDI), and final upload alongside CCV. Join id_sales_flow
  with datalake_sales_flow_clean.sales_flow and datalake_sales_flow_clean.payment to filter 3P offers.
columns:
  id:
    description: Primary key of the TIC record in the clean layer.
    lineage:
      - datalake_sales_flow_raw.tic.id
  id_sales_flow:
    description: |
      Foreign key to the sales flow associated with this TIC. Applies to 3P closing offers where
      the partner agency is responsible for the transaction. Join with datalake_sales_flow_clean.sales_flow.id
      and filter payment.payment_model = CLOSING_3P for the partner-mediated offer context.
    lineage:
      - datalake_sales_flow_raw.tic.sales_flow_id
  uuid_signed_document_reference:
    description: |
      BlobVault objectId (UUID) of the signed TIC PDF stored in the sales-flow-tic bucket.
      Set when the partner or expert uploads the final signed document after review.
    lineage:
      - datalake_sales_flow_raw.tic.signed_document_reference
  uuid_unsigned_document_reference:
    description: |
      BlobVault objectId (UUID) of the unsigned TIC PDF generated by contract-filler from seller,
      buyer, brokerage, and house data collected in the CDI TIC input flow.
    lineage:
      - datalake_sales_flow_raw.tic.unsigned_document_reference
  signed_document_origin:
    description: |
      Channel that uploaded the signed TIC. CDI when the partner uploaded through Central da
      Imobiliária; VENDAS when a QuintoAndar expert uploaded manually in the legacy backoffice flow.
    categories:
      CDI: Document uploaded by the partner real estate agency through Central da Imobiliária.
      VENDAS: Document uploaded manually by a QuintoAndar expert through the Vendas backoffice.
    lineage:
      - datalake_sales_flow_raw.tic.signed_document_origin
  status:
    description: |
      Lifecycle status of the TIC document entity. CREATED after the partner confirms the
      generated document or completes the initial upload; SIGNED after the final signed TIC
      is committed in the combined TIC+CCV upload flow. Aligns with offer macrostatus TIC and
      microstatuses TIC_CREATED and TIC_SIGNED in the Sales Flow status list.
    categories:
      CREATED: TIC document generated and confirmed, or signed reference saved before final commit.
      SIGNED: Final signed TIC stored and committed together with CCV in the 3P closing flow.
    lineage:
      - datalake_sales_flow_raw.tic.status
  template_version:
    description: |
      Version number of the contract-filler template used to generate the TIC PDF. Identifies
      which legal document template was applied at creation time.
    lineage:
      - datalake_sales_flow_raw.tic.template_version
  ts_created:
    description: Timestamp when the TIC record was first created in Sales Flow.
    lineage:
      - datalake_sales_flow_raw.tic.created_at
  ts_updated:
    description: Timestamp when the TIC record was last updated in Sales Flow.
    lineage:
      - datalake_sales_flow_raw.tic.updated_at
  year:
    description: Year derived from the CDC ingestion timestamp.
    lineage:
      - datalake_sales_flow_raw.tic.year
  month:
    description: Month derived from the CDC ingestion timestamp.
    lineage:
      - datalake_sales_flow_raw.tic.month
  day:
    description: Day derived from the CDC ingestion timestamp.
    lineage:
      - datalake_sales_flow_raw.tic.day
