database_name: datalake_sales_flow_clean
table_name: address_data
domain: For Sale
owner: helder.rodrigues@quintoandar.com.br
description: Stores the property address (street, number, complement, neighborhood, city, state, ZIP code) for a house involved in a For Sale transaction. Each row is created and audited (via Hibernate Envers) as a one-to-one attribute of a house record when the house enters the purchase-closing flow, and is updated whenever its address details are corrected. One row per address_data record in datalake_sales_flow_clean. (JPA entity — AddressDataEntity)
columns:
  id:
    lineage:
    - datalake_sales_flow_raw.address_data.id
    description: Surrogate primary key of the address_data row, auto-generated by the database (Sales Flow AddressDataEntity).
  street:
    lineage:
    - datalake_sales_flow_raw.address_data.street
    description: Street name of the property address linked to a house via the address_data_id foreign key on the house table.
  number:
    lineage:
    - datalake_sales_flow_raw.address_data.number
    description: Street number of the property address.
  complement:
    lineage:
    - datalake_sales_flow_raw.address_data.complement
    description: Free-text address complement, such as apartment, block, or unit number.
  neighborhood:
    lineage:
    - datalake_sales_flow_raw.address_data.neighborhood
    description: Neighborhood (bairro) of the property address.
  city:
    lineage:
    - datalake_sales_flow_raw.address_data.city
    description: City of the property address.
  state:
    lineage:
    - datalake_sales_flow_raw.address_data.state
    description: State (federative unit) abbreviation of the property address.
  zip_code:
    lineage:
    - datalake_sales_flow_raw.address_data.zip_code
    description: Postal ZIP code (CEP) of the property address.
  ts_created:
    lineage:
    - datalake_sales_flow_raw.address_data.created_at
    description: Timestamp when the address_data row was first created in the source operational system, typically when the house record it belongs to was created.
  ts_updated:
    lineage:
    - datalake_sales_flow_raw.address_data.updated_at
    description: Timestamp when the address_data row was last updated in the source operational system, for example when any address field is corrected.
  year:
    lineage:
    - datalake_sales_flow_raw.address_data.year
    description: Year when the ETL run loaded this row into the lake table.
  month:
    lineage:
    - datalake_sales_flow_raw.address_data.month
    description: Month when the ETL run loaded this row into the lake table.
  day:
    lineage:
    - datalake_sales_flow_raw.address_data.day
    description: Day when the ETL run loaded this row into the lake table.
