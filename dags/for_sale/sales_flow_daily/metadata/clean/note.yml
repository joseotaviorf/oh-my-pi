database_name: datalake_sales_flow_clean
table_name: note
owner: helder.rodrigues@quintoandar.com.br
domain: For Sale
description: Stores free-text operational notes attached to a sales flow by the closing operations team, tagged with a type discriminator distinguishing general remarks from notes about special/atypical cases. (JPA entity — `Note`, `br.com.quintoandar.salesflow.core.note.Note`)
columns:
  id_note:
    description: Surrogate primary key of the note row (BaseEntity.id), generated by the database.
    lineage:
    - datalake_sales_flow_raw.note.id
  id_sales_flow:
    description: Identifier of the sales flow this note is attached to (not a managed JPA relationship; stored as a plain, non-updatable foreign key value).
    lineage:
    - datalake_sales_flow_raw.note.sales_flow_id
  message:
    description: Free-text content of the note entered by an operator for the sales flow.
    lineage:
    - datalake_sales_flow_raw.note.message
  type:
    description: Enum (NoteType) classifying the note, either GENERAL or SPECIAL_CASE.
    lineage:
    - datalake_sales_flow_raw.note.type
  ts_created:
    description: Timestamp when the note record was created in the source system.
    lineage:
    - datalake_sales_flow_raw.note.created_at
  ts_updated:
    description: Timestamp when the note record was last updated in the source system.
    lineage:
    - datalake_sales_flow_raw.note.updated_at
  year:
    description: CDC Year of the record.
    lineage:
    - datalake_sales_flow_raw.note.year
  month:
    description: CDC Month of the record.
    lineage:
    - datalake_sales_flow_raw.note.month
  day:
    description: CDC Day of the record.
    lineage:
    - datalake_sales_flow_raw.note.day
