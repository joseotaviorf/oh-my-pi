database_name: datalake_sales_flow_clean
table_name: listing_fee
domain: For Sale
owner: helder.rodrigues@quintoandar.com.br
description: Defines the boundaries (a single fee percentage plus validity period) of the listing brokerage fee applicable to a geographic region and ticket-pricing model, used to control the allowed listing fee for "For Sale" offers. This configuration is the basis for the min/max fee bands defined per business and payment model in the related offer_fee_rule table. (JPA entity — `ListingFee`, `br.com.quintoandar.salesflow.core.listingfee.ListingFee`)
columns:
  id:
    description: Unique ID for the listing fee record.
    lineage:
    - datalake_sales_flow_raw.listing_fee.id
  id_region:
    description: Identifier of the geographic region this listing fee configuration applies to.
    lineage:
    - datalake_sales_flow_raw.listing_fee.region_id
  ticket_model:
    description: 'Enum indicating the ticket pricing model the listing fee configuration applies to. Values: HIGH_TICKET (the only value currently defined in code).'
    lineage:
    - datalake_sales_flow_raw.listing_fee.ticket_model
  ts_valid_from:
    description: Timestamp from which the listing fee configuration is valid.
    lineage:
    - datalake_sales_flow_raw.listing_fee.valid_from
  ts_valid_to:
    description: Timestamp until which the listing fee configuration is valid (nullable if still open-ended).
    lineage:
    - datalake_sales_flow_raw.listing_fee.valid_to
  fee:
    description: Listing brokerage fee value (decimal) for this region and ticket model.
    lineage:
    - datalake_sales_flow_raw.listing_fee.fee
  is_active:
    description: Flag indicating whether the listing fee configuration is active.
    lineage:
    - datalake_sales_flow_raw.listing_fee.active
  ts_created:
    description: Timestamp when the listing fee record was created in the source operational system.
    lineage:
    - datalake_sales_flow_raw.listing_fee.created_at
  ts_updated:
    description: Timestamp of the last update to the listing fee record in the source operational system.
    lineage:
    - datalake_sales_flow_raw.listing_fee.updated_at
  year:
    description: Year  for the listing fee record.
    lineage:
    - datalake_sales_flow_raw.listing_fee.year
  month:
    description: Month  for the listing fee record.
    lineage:
    - datalake_sales_flow_raw.listing_fee.month
  day:
    description: Day  for the listing fee record.
    lineage:
    - datalake_sales_flow_raw.listing_fee.day
