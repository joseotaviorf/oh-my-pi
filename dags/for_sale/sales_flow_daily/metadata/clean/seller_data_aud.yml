database_name: datalake_sales_flow_clean
table_name: seller_data_aud
domain: For Sale
columns:
  id_seller:
    lineage:
    - datalake_sales_flow_raw.seller_data_aud.id
    description: Foreign key to the seller party in the For Sale transaction.
  id_sales_flow:
    lineage:
    - datalake_sales_flow_raw.seller_data_aud.sales_flow_id
    description: Foreign key to the parent sales flow transaction in the end-of-funnel domain.
  id_docx_folder:
    lineage:
    - datalake_sales_flow_raw.seller_data_aud.docx_folder_id
    description: Identifier of the document folder storing seller or buyer paperwork.
  rev:
    lineage:
    - datalake_sales_flow_raw.seller_data_aud.rev
    description: Envers revision number grouping field-level changes in this audit snapshot.
  rev_type:
    lineage:
    - datalake_sales_flow_raw.seller_data_aud.revtype
    description: 'Envers revision type code: insert, update, or delete for the audited row.'
  rev_end:
    lineage:
    - datalake_sales_flow_raw.seller_data_aud.revend
    description: Envers revision end marker when this audited row version was superseded.
  name:
    lineage:
    - datalake_sales_flow_raw.seller_data_aud.name
    description: Human-readable display name associated with the person or entity in this row.
  email:
    lineage:
    - datalake_sales_flow_raw.seller_data_aud.email
    description: Contact email address used for notifications and identity matching.
  share_percentage:
    lineage:
    - datalake_sales_flow_raw.seller_data_aud.share_percentage
    description: Ownership share percentage assigned to this seller in the transaction.
  holding_value:
    lineage:
    - datalake_sales_flow_raw.seller_data_aud.holding_value
    description: Declared asset holding value used in seller financial qualification.
  party_kind:
    lineage:
    - datalake_sales_flow_raw.seller_data_aud.party_kind
    description: Legal party classification such as individual buyer, seller, or company.
  is_on_register:
    lineage:
    - datalake_sales_flow_raw.seller_data_aud.on_register
    description: Whether the seller party is registered on the property deed.
  is_active:
    lineage:
    - datalake_sales_flow_raw.seller_data_aud.active
    description: Whether the party or record remains active in the current sales flow.
  is_ccv_signer:
    lineage:
    - datalake_sales_flow_raw.seller_data_aud.is_ccv_signer
    description: Whether this seller is required to sign the purchase agreement (CCV).
  is_pj:
    lineage:
    - datalake_sales_flow_raw.seller_data_aud.is_pj
    description: Whether the seller is a legal entity (PJ) rather than an individual (PF).
  mod_id_sales_flow:
    lineage:
    - datalake_sales_flow_raw.seller_data_aud.sales_flow_id_mod
    description: Envers boolean flag indicating whether id sales flow changed in this audit revision.
  mod_is_ccv_signer:
    lineage:
    - datalake_sales_flow_raw.seller_data_aud.is_ccv_signer_mod
    description: Envers boolean flag indicating whether is ccv signer changed in this audit revision.
  mod_party_kind:
    lineage:
    - datalake_sales_flow_raw.seller_data_aud.party_kind_mod
    description: Envers boolean flag indicating whether party kind changed in this audit revision.
  mod_is_on_register:
    lineage:
    - datalake_sales_flow_raw.seller_data_aud.on_register_mod
    description: Envers boolean flag indicating whether is on register changed in this audit revision.
  mod_id_docx_folder:
    lineage:
    - datalake_sales_flow_raw.seller_data_aud.docx_folder_id_mod
    description: Envers boolean flag indicating whether id docx folder changed in this audit revision.
  mod_share_percentage:
    lineage:
    - datalake_sales_flow_raw.seller_data_aud.share_percentage_mod
    description: Envers boolean flag indicating whether share percentage changed in this audit revision.
  mod_name:
    lineage:
    - datalake_sales_flow_raw.seller_data_aud.name_mod
    description: Envers boolean flag indicating whether name changed in this audit revision.
  mod_email:
    lineage:
    - datalake_sales_flow_raw.seller_data_aud.email_mod
    description: Envers boolean flag indicating whether email changed in this audit revision.
  mod_is_pj:
    lineage:
    - datalake_sales_flow_raw.seller_data_aud.is_pj_mod
    description: Envers boolean flag indicating whether is pj changed in this audit revision.
  mod_active:
    lineage:
    - datalake_sales_flow_raw.seller_data_aud.active_mod
    description: Envers boolean flag indicating whether active changed in this audit revision.
  mod_holding_value:
    lineage:
    - datalake_sales_flow_raw.seller_data_aud.holding_value_mod
    description: Envers boolean flag indicating whether holding value changed in this audit revision.
  ts_created:
    lineage:
    - datalake_sales_flow_raw.seller_data_aud.created_at
    description: Timestamp when the row was first created in the source operational system.
  ts_updated:
    lineage:
    - datalake_sales_flow_raw.seller_data_aud.updated_at
    description: Timestamp when the row was last updated in the source operational system.
  year:
    lineage:
    - datalake_sales_flow_raw.seller_data_aud.year
    description: Year when the ETL run loaded this row into the lake table.
  month:
    lineage:
    - datalake_sales_flow_raw.seller_data_aud.month
    description: Month when the ETL run loaded this row into the lake table.
  day:
    lineage:
    - datalake_sales_flow_raw.seller_data_aud.day
    description: Day when the ETL run loaded this row into the lake table.
owner: helder.rodrigues@quintoandar.com.br
description: Hibernate Envers audit trail of seller data rows from Sales Flow service managing For Sale operations after an offer is received. Each revision records field-level changes for compliance and operational forensics.
