database_name: datalake_sales_flow_clean
table_name: microstatus_order
domain: For Sale
owner: helder.rodrigues@quintoandar.com.br
description: Defines the ordered sequence of microstatuses (finer-grained sub-steps) within a given macrostatus ordering (status_order). For example, within the Offer macrostatus, the microstatuses may be ordered as created, sent, and accepted; each status_order row owns its own list of microstatus_order rows. (JPA entity — `MicrostatusOrder`, `br.com.quintoandar.salesflow.core.status.statusorder.MicrostatusOrder`)
columns:
  id:
    description: Surrogate primary key of the microstatus_order row (BaseEntity.id), generated by the database.
    lineage:
    - datalake_sales_flow_raw.microstatus_order.id
  id_status_order:
    description: Foreign key to the status_order table identifying the parent macrostatus ordering that this microstatus sequence belongs to.
    lineage:
    - datalake_sales_flow_raw.microstatus_order.status_order_id
  id_status:
    description: Foreign key to the status table identifying which microstatus this ordering entry represents.
    lineage:
    - datalake_sales_flow_raw.microstatus_order.status_id
  ordering:
    description: Integer position of this microstatus within the sequence of sub-steps belonging to its parent macrostatus (e.g. within Offer, the microstatus order could be created, sent, accepted).
    lineage:
    - datalake_sales_flow_raw.microstatus_order.ordering
  ts_created:
    description: Timestamp that indicates when this entry was created.
    lineage:
    - datalake_sales_flow_raw.microstatus_order.created_at
  ts_updated:
    description: Timestamp that indicates when this entry was last updated.
    lineage:
    - datalake_sales_flow_raw.microstatus_order.updated_at
  year:
    description: Year when the ETL run loaded this row into the lake table.
    lineage:
    - datalake_sales_flow_raw.microstatus_order.year
  month:
    description: Month when the ETL run loaded this row into the lake table.
    lineage:
    - datalake_sales_flow_raw.microstatus_order.month
  day:
    description: Day when the ETL run loaded this row into the lake table.
    lineage:
    - datalake_sales_flow_raw.microstatus_order.day
