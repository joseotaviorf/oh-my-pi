database_name: datalake_sales_flow_clean
table_name: task_association
owner: helder.rodrigues@quintoandar.com.br
domain: For Sale
description: Assigns a specific subtask to a specific user (mainUserId) within a specific sales flow, and tracks that assignment's lifecycle (not started / started / concluded). This is the operational record used to know who is responsible for resolving a given subtask and whether/when it was released to them and concluded. (JPA entity — `TaskAssociation`, `br.com.quintoandar.salesflow.core.task.TaskAssociation`)
columns:
  id:
    description: Surrogate primary key of the task_association row (BaseEntity.id), generated by the database.
    lineage:
    - datalake_sales_flow_raw.task_association.id
  id_subtask:
    description: Foreign key to the subtask table identifying which subtask this association assigns to a user.
    lineage:
    - datalake_sales_flow_raw.task_association.subtask_id
  id_main_user:
    description: External user identifier (UserExternalId) of the person (buyer, seller, or operator, depending on subtask target) assigned to this task association.
    lineage:
    - datalake_sales_flow_raw.task_association.main_user_id
  id_sales_flow:
    description: Foreign key to the sales_flow table identifying the closing process this task association belongs to.
    lineage:
    - datalake_sales_flow_raw.task_association.sales_flow_id
  status:
    description: Enum (ActivationStatus) tracking the lifecycle of this task association, one of NOT_STARTED, STARTED, or CONCLUDED.
    lineage:
    - datalake_sales_flow_raw.task_association.status
  attributes:
    description: JSONB column holding extra, subtask-specific context or metadata attached to this association.
    lineage:
    - datalake_sales_flow_raw.task_association.attributes
  ts_released:
    description: Timestamp when this task association was released/made visible to the assigned user.
    lineage:
    - datalake_sales_flow_raw.task_association.released_at
  ts_concluded:
    description: Timestamp when this task association was marked as concluded.
    lineage:
    - datalake_sales_flow_raw.task_association.concluded_at
  ts_created:
    description: Timestamp of the creation of the task
    lineage:
    - datalake_sales_flow_raw.task_association.created_at
  ts_updated:
    description: Timestamp of the last update of the task
    lineage:
    - datalake_sales_flow_raw.task_association.updated_at
  year:
    lineage:
    - datalake_sales_flow_raw.task_association.year
    description: Year when the ETL run loaded this row into the lake table.
  month:
    lineage:
    - datalake_sales_flow_raw.task_association.month
    description: Month when the ETL run loaded this row into the lake table.
  day:
    lineage:
    - datalake_sales_flow_raw.task_association.day
    description: Day when the ETL run loaded this row into the lake table.
