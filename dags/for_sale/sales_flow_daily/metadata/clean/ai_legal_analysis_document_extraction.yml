database_name: datalake_sales_flow_clean
table_name: ai_legal_analysis_document_extraction
domain: For Sale
owner: helder.rodrigues@quintoandar.com.br
description: Tracks requests to extract structured legal data from a house-registry document (e.g., the "matrícula"/main house registry) using the AI-assisted DocPilot extraction service, as part of the "Lego Contract" AI-assisted legal document generation flow. Multiple extraction rows are allowed per sales flow (no uniqueness constraint on sales_flow_id). (JPA entity — `DocumentExtraction`, `br.com.quintoandar.salesflow.core.ailegalanalysis.documentextraction.DocumentExtraction`)
columns:
  id:
    description: Unique identifier for the document extraction record.
    lineage:
    - datalake_sales_flow_raw.ai_legal_analysis_document_extraction.id
  id_sales_flow:
    description: Foreign key to the sales_flow table. Multiple extraction records can exist per sales flow.
    lineage:
    - datalake_sales_flow_raw.ai_legal_analysis_document_extraction.sales_flow_id
  id_docx_attachment_document:
    description: Identifier of the source document attachment (from the docx/attachment service) that was submitted for extraction.
    lineage:
    - datalake_sales_flow_raw.ai_legal_analysis_document_extraction.docx_attachment_document_id
  id_docpilot_document_external:
    description: External identifier of the document as registered in the DocPilot extraction platform.
    lineage:
    - datalake_sales_flow_raw.ai_legal_analysis_document_extraction.docpilot_document_external_id
  docx_attachment_filename:
    description: Original filename of the attached document submitted for AI-assisted data extraction.
    lineage:
    - datalake_sales_flow_raw.ai_legal_analysis_document_extraction.docx_attachment_filename
  docpilot_document_extractor_type:
    description: 'Enum (stored as an array; the entity holds a list) identifying which DocPilot extractor template was used to parse the document. Currently only one value exists: LEGOCONTRACT_01_MAIN_HOUSE_REGISTRY, used to extract data from the property''s main house/land registry document.'
    lineage:
    - datalake_sales_flow_raw.ai_legal_analysis_document_extraction.docpilot_document_extractor_type
  ts_created:
    description: Timestamp of when the record was created.
    lineage:
    - datalake_sales_flow_raw.ai_legal_analysis_document_extraction.created_at
  ts_updated:
    description: Timestamp of the last update to the record.
    lineage:
    - datalake_sales_flow_raw.ai_legal_analysis_document_extraction.updated_at
  year:
    description: Year when the ETL run loaded this row into the lake table.
    lineage:
    - datalake_sales_flow_raw.ai_legal_analysis_document_extraction.year
  month:
    description: Month when the ETL run loaded this row into the lake table.
    lineage:
    - datalake_sales_flow_raw.ai_legal_analysis_document_extraction.month
  day:
    description: Day when the ETL run loaded this row into the lake table.
    lineage:
    - datalake_sales_flow_raw.ai_legal_analysis_document_extraction.day
