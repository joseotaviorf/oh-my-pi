database_name: datalake_sales_flow_clean
table_name: clause_subject
owner: helder.rodrigues@quintoandar.com.br
domain: For Sale
description: A small lookup table of subjects/categories used to group legal clause templates (clause_message) in the CCV contract-authoring domain, e.g. grouping clauses about payment terms, property description, or special conditions. Rows are managed by the legal/contract-authoring tooling as new clause categories are introduced. A previously added `type` column on this table was later removed and is not part of the current schema. (JPA entity — ClauseSubject, in the Sales Flow service)
columns:
  id:
    description: Surrogate primary key of the clause_subject row, one row per clause subject/category.
    lineage:
    - datalake_sales_flow_raw.clause_subject.id
  description:
    description: Free-text name/description of the contractual clause subject (e.g. the category label shown when grouping clause templates).
    lineage:
    - datalake_sales_flow_raw.clause_subject.description
  ts_created:
    description: Timestamp of when the record was created
    lineage:
    - datalake_sales_flow_raw.clause_subject.created_at
  ts_updated:
    description: Timestamp of when the record was updated
    lineage:
    - datalake_sales_flow_raw.clause_subject.updated_at
  year:
    description: Year of the last update
    lineage:
    - datalake_sales_flow_raw.clause_subject.year
  month:
    description: Month of the last update
    lineage:
    - datalake_sales_flow_raw.clause_subject.month
  day:
    description: Day of the last update
    lineage:
    - datalake_sales_flow_raw.clause_subject.day
