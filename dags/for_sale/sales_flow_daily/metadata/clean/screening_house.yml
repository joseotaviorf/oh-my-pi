database_name: datalake_sales_flow_clean
table_name: screening_house
owner: helder.rodrigues@quintoandar.com.br
domain: For Sale
description: Stores the property (house)-leg screening/document-verification check performed during a home-purchase closing, with a one-to-one relationship to its parent screening case. It tracks the internal screening workflow status and the legal/document proposal validation outcome for the property, plus any legal pendency note raised against it. (JPA entity — `ScreeningHouse`, `br.com.quintoandar.salesflow.core.screening.house.ScreeningHouse`; managed by `ScreeningHouseService`)
columns:
  id:
    description: Surrogate primary key of the screening house row in the source system.
    lineage:
    - datalake_sales_flow_raw.screening_house.id
  id_screening:
    description: Foreign key to the parent screening case (screening table) this property check belongs to, one-to-one.
    lineage:
    - datalake_sales_flow_raw.screening_house.screening_id
  status:
    description: 'Enum tracking progress of the house/property screening workflow itself. Possible values: ON_PROGRESS (default, screening still being worked) or COMPLETED (screening finished for the property).'
    lineage:
    - datalake_sales_flow_raw.screening_house.status
  proposal_validation_status:
    description: Enum tracking the legal/document proposal validation outcome for the property, independent of the screening workflow status.
    categories:
      ON_PROGRESS: Default state; legal/document proposal validation for the property is still being worked.
      COMPLETED: Legal/document proposal validation for the property is finished, with no open legal pendency.
      LEGAL_PENDENCY_ON_PROGRESS: Validation paused because an open legal pendency was raised against the property.
      LEGAL_PENDENCY_COMPLETED: Validation finished after the legal pendency against the property was resolved.
    lineage:
    - datalake_sales_flow_raw.screening_house.proposal_validation_status
  legal_pendency_note:
    description: Free-text note recorded when a legal pendency (documentation or legal issue) is raised against the property, describing the pendency blocking proposal approval.
    lineage:
    - datalake_sales_flow_raw.screening_house.legal_pendency_note
  ts_created:
    description: Timestamp when the house screening record was first created.
    lineage:
    - datalake_sales_flow_raw.screening_house.created_at
  ts_updated:
    description: Timestamp of the most recent update to the house screening record (e.g. status or validation change).
    lineage:
    - datalake_sales_flow_raw.screening_house.updated_at
  year:
    description: Year when the ETL run loaded this row into the lake table.
    lineage:
    - datalake_sales_flow_raw.screening_house.year
  month:
    description: Month when the ETL run loaded this row into the lake table.
    lineage:
    - datalake_sales_flow_raw.screening_house.month
  day:
    description: Day when the ETL run loaded this row into the lake table.
    lineage:
    - datalake_sales_flow_raw.screening_house.day
