---
database_name: datalake_sales_flow_raw
table_name: ai_legal_analysis_lego_contract_execution_change_log
domain: For Sale
owner: helder.rodrigues@quintoandar.com.br
description: |
  Raw CDC table from Sales Flow postgres with field-level change events for AI legal analysis
  Lego contract execution records.
columns:
  id:
    description: Primary key of the change log record in the source database.
  lego_contract_execution_id:
    description: Foreign key referencing the parent ai_legal_analysis_lego_contract_execution row.
  type:
    description: Category of the change event as defined by the Sales Flow application.
  field:
    description: Name of the field that was modified on the parent Lego contract execution.
  old_value:
    description: Previous value of the changed field before the update was applied.
  new_value:
    description: New value of the changed field after the update was applied.
  created_at:
    description: Timestamp when the record was created in the source database.
  updated_at:
    description: Timestamp when the record was last updated in the source database.
  op_cdc:
    description: CDC operation type captured by Debezium (insert, update, or delete).
  ts_cdc_transaction:
    description: Timestamp when the change was captured by the CDC pipeline.
  ts_database_transaction:
    description: Timestamp of the database transaction in the source system.
  cdc_transaction_id:
    description: Source database transaction identifier for the CDC event.
  cdc_binlog_position:
    description: Postgres logical sequence number (LSN) for the CDC event.
  year:
    description: Year partition derived from the CDC ingestion timestamp.
  month:
    description: Month partition derived from the CDC ingestion timestamp.
  day:
    description: Day partition derived from the CDC ingestion timestamp.
  hour:
    description: Hour partition derived from the CDC ingestion timestamp.
