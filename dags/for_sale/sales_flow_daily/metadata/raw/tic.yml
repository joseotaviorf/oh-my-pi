---
database_name: datalake_sales_flow_raw
table_name: tic
domain: For Sale
owner: helder.rodrigues@quintoandar.com.br
description: |
  Raw CDC table from Sales Flow postgres storing Termo de Intermediação Compartilhada (TIC)
  records. TIC is the mandatory shared brokerage contract for For Sale Marketplace offers
  mediated by partner real estate agencies (paymentModel CLOSING_3P, e.g. TSC and CQA programs).
  Each row tracks document references in BlobVault and the TIC lifecycle status for one sales flow.
  Documents are generated via contract-filler and uploaded by partners through Central da Imobiliária
  (CDI) or, in the legacy flow, by QuintoAndar experts through Vendas.
columns:
  id:
    description: Surrogate primary key of the TIC entity in the Sales Flow source database.
  sales_flow_id:
    description: |
      Foreign key to the sales_flow row. TIC applies only to 3P closing offers where the partner
      real estate agency conducts the transaction (paymentModel CLOSING_3P).
  signed_document_reference:
    description: |
      BlobVault objectId (UUID) pointing to the signed TIC PDF stored in the sales-flow-tic bucket.
      Populated after the partner or expert uploads the final signed document.
  unsigned_document_reference:
    description: |
      BlobVault objectId (UUID) pointing to the unsigned TIC PDF generated by contract-filler
      before the partner reviews and confirms the document.
  signed_document_origin:
    description: |
      Channel that uploaded the signed TIC document. CDI when uploaded by the partner through
      Central da Imobiliária; VENDAS when uploaded manually by a QuintoAndar expert in the legacy flow.
  status:
    description: |
      Lifecycle status of the TIC document entity in Sales Flow. CREATED after the generated
      document is confirmed or initially uploaded; SIGNED after the final signed TIC is committed
      together with the CCV upload in the 3P closing flow.
  template_version:
    description: |
      Integer version of the contract-filler Google Drive template used to generate the TIC PDF.
      Tracks which legal template was applied when the document was created.
  created_at:
    description: Timestamp when the TIC row was first inserted in the Sales Flow database.
  updated_at:
    description: Timestamp when the TIC row was last updated in the Sales Flow database.
  op_cdc:
    description: CDC operation type captured by Debezium (insert, update, or delete).
  ts_cdc_transaction:
    description: Timestamp when the change was captured by the CDC pipeline.
  ts_database_transaction:
    description: Timestamp of the database transaction in the source system.
  cdc_transaction_id:
    description: Source database transaction identifier for the CDC event.
  cdc_binlog_position:
    description: Postgres logical sequence number (LSN) for the CDC event.
  year:
    description: Year partition derived from the CDC ingestion timestamp.
  month:
    description: Month partition derived from the CDC ingestion timestamp.
  day:
    description: Day partition derived from the CDC ingestion timestamp.
  hour:
    description: Hour partition derived from the CDC ingestion timestamp.
