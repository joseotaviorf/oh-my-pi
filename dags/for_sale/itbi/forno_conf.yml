    from the public websites of São Paulo and Belo Horizonte cities.
custom_libraries:
  - pypi:
      package: openpyxl
tables:
  itbi_sp:
    is_incremental: false
  itbi_bh:
    is_incremental: false
clean_partition_cols: ["year", "month"]
