cluster:
  # emr_deploy_mode is client, so the driver runs on the master: the r6g.4xlarge
  # master serves the driver while the core nodes carry the executors.
  type: emr_7_12_consolidation_l_memory_cluster
  custom_configurations:
    # No preset ships 3 core nodes -- every multi-node one is 2 -- so override just
    # the count and inherit node_type_id from the preset.
    core_nodes:
      instance_count: 3
  # Top level on purpose: emr_task_retries is read from the raw cluster_args, not
  # from the merged preset. Keeps the 1 retry the Databricks version had -- with a
  # 1-slot lineage pool serializing every step, 3 retries can eat the hour.
  emr_task_retries: 1
  # Do NOT add airflow_emr_create_cluster_deferrable here: the lineage pool is
  # created with include_deferred=False, so a deferred step would release its
  # single slot while waiting on EMR and break the one-job-at-a-time guarantee.
