# Create Airflow variable named WEBHOOK_SALESFORCE_CDC_PROD whose value is the Google Chat incoming webhook URL.
webhook_salesforce_cdc: WEBHOOK_SALESFORCE_FOR_SALE_PROD

owner: "Data ForSale"
dag_documentation:
  dag_purpose:
    "Salesforce Ingestion DAG responsible for ingesting data from Salesforce into the Data Lake.
    This DAG will handle ingestion via CDC Events and API events.
    The pipeline will be composed by three main steps:
    1. CDC + API Raw ingestion: This step will ingest the data from Salesforce into the Data Lake.
    2. Clean ingestion: This step will clean the data from the raw ingestion and store it in the Data Lake.
    3. Pipeline metrics (stability, latency, missing CDC events)."
raw_schema: "datalake_salesforce_raw"
clean_schema: "datalake_salesforce_clean"
datalake_bucket: "5a-datalake-prod"
# Base URL the cdc_raw recovery path calls when AppFlow has not delivered the
# partition hour. Same org as salesforce_cdc, so the same endpoint per env.
salesforce_endpoint: "https://quintoandar.my.salesforce.com"
# AppFlow APIs are account-scoped. The EMR cluster runs in the data account
# (206390561754) while the Salesforce flows live in prod (632540934959), so
# cdc_raw assumes this role for the AppFlow client only -- S3/Glue/Delta keep
# using the emr-prod instance profile. Role lives in quintoandar/infrastructure
# at cloud/aws-accounts/prod/iam/emr-prod-appflow-access.
# Must be emptied if this DAG ever runs on Databricks again: that instance
# profile is already in the prod account and is not trusted by this role.
appflow_assume_role_arn: "arn:aws:iam::632540934959:role/emr-prod-appflow-access"
events_config:
  received_document:
    event_path: "raw/salesforce/ReceivedDocumentEvent"
    skip_quality_contracts: true
    api_entity: "ReceivedDocument__c"
  incident:
    event_path: "raw/salesforce/IncidentEvent"
    skip_quality_contracts: true
    api_entity: "Incident"
  case_legal_ops:
    event_path: "raw/salesforce/CaseLegalOpsEvent"
    skip_quality_contracts: true
    api_entity: "CaseLegalOps__c"
  pendency:
    event_path: "raw/salesforce/PendencyEvent"
    skip_quality_contracts: true
    api_entity: "Pendency__c"
