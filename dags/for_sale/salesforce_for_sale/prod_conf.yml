# Create Airflow variable named WEBHOOK_SALESFORCE_CDC_PROD whose value is the Google Chat incoming webhook URL.
webhook_salesforce_cdc: WEBHOOK_SALESFORCE_FOR_SALE_PROD

owner: "Data ForSale"
dag_documentation:
  dag_purpose:
    "Salesforce Ingestion DAG responsible for ingesting data from Salesforce into the Data Lake.
    This DAG will handle ingestion via CDC Events and API events.
    The pipeline will be composed by three main steps:
    1. CDC + API Raw ingestion: This step will ingest the data from Salesforce into the Data Lake.
    2. Clean ingestion: This step will clean the data from the raw ingestion and store it in the Data Lake.
    3. Pipeline metrics (stability, latency, missing CDC events)."
raw_schema: "datalake_salesforce_raw"
clean_schema: "datalake_salesforce_clean"
datalake_bucket: "5a-datalake-prod"
events_config:
  incident:
    event_path: "raw/salesforce/IncidentEvent"
    skip_quality_contracts: true
    api_entity: "Incident"
  case_legal_ops:
    event_path: "raw/salesforce/CaseLegalOpsEvent"
    skip_quality_contracts: true
    api_entity: "CaseLegalOps__c"
  pendency:
    event_path: "raw/salesforce/PendencyEvent"
    skip_quality_contracts: true
    api_entity: "Pendency__c"
  case_end_of_process:
    event_path: "raw/salesforce/CaseEndOfProcessEvent"
    skip_quality_contracts: true
    api_entity: "CaseEndOfProcess__c"
  follow_up:
    event_path: "raw/salesforce/Follow_UpEvent"
    skip_quality_contracts: true
    api_entity: "Follow_Up__c"
  purchase_sale_contract:
    event_path: "raw/salesforce/PurchaseSaleContractEvent"
    skip_quality_contracts: true
    api_entity: "PurchaseSaleContract__c"
