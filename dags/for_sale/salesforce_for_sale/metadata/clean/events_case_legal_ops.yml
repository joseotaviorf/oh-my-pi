database_name: datalake_salesforce_clean
table_name: events_case_legal_ops
description: >
  Auxiliary CDC table for Salesforce CaseLegalOps__c (For Sale Legal Ops / diligence),
  extending a parent Case with process-specific attributes.
  Join to datalake_salesforce_clean.events_case.id_record on
  datalake_salesforce_clean.events_case.case_legal_ops__c = this table's id_record (Salesforce
  Id of the auxiliary record).
  CDC UPDATE rows are sparse; aggregate by id_record ordered by id_replay to reconstruct
  state.
domain: For Sale
owner: helder.rodrigues@quintoandar.com
columns:
  id_record:
    lineage:
    - datalake_salesforce_raw.events_case_legal_ops.id_record
    description: Salesforce 18-digit Id of the CaseLegalOps__c auxiliary record; CDC grain key. Join from events_case.case_legal_ops__c when that lookup is populated.
  commit_number:
    lineage:
    - datalake_salesforce_raw.events_case_legal_ops.commit_number
    description: Commit number associated with the CDC event.
  commit_ts:
    lineage:
    - datalake_salesforce_raw.events_case_legal_ops.commit_ts
    description: Commit timestamp of the CDC event in milliseconds epoch (e.g. 1781188554000). Divide by 1000 to get seconds.
  sequence_number:
    lineage:
    - datalake_salesforce_raw.events_case_legal_ops.sequence_number
    description: Sequence number of the CDC event within the transaction.
  entity_name:
    lineage:
    - datalake_salesforce_raw.events_case_legal_ops.entity_name
    description: Salesforce entity name that originated the event (CaseLegalOps__c).
  event_type:
    lineage:
    - datalake_salesforce_raw.events_case_legal_ops.event_type
    description: Type of CDC event. Observed values are CREATE (most fields populated, status='Aberto') and UPDATE (sparse, only changed fields populated).
  transaction_key:
    lineage:
    - datalake_salesforce_raw.events_case_legal_ops.transaction_key
    description: Unique key identifying the transaction that generated the event.
  commit_user:
    lineage:
    - datalake_salesforce_raw.events_case_legal_ops.commit_user
    description: Salesforce User Id for ownership or audit (Owner / CreatedBy / LastModifiedBy). Join to dw_support_journey.dim_analyst.sk_analyst for analyst dimension attributes (source of truth for SF users).
  available_for_chargeback__c:
    lineage:
    - datalake_salesforce_raw.events_case_legal_ops.AvailableForChargeback__c
    description: Flag indicating if the case is available for chargeback.
  buyer_accept_date__c:
    lineage:
    - datalake_salesforce_raw.events_case_legal_ops.BuyerAcceptDate__c
    description: Date when the buyer accepted the due diligence.
  buyer_decision__c:
    lineage:
    - datalake_salesforce_raw.events_case_legal_ops.BuyerDecision__c
    description: Buyer's decision on the due diligence.
  ccv_sent_date2nd__c:
    lineage:
    - datalake_salesforce_raw.events_case_legal_ops.CCVSentDate2nd__c
    description: Date when the CCV was sent for the second time.
  commercial_agreement__c:
    lineage:
    - datalake_salesforce_raw.events_case_legal_ops.CommercialAgreement__c
    description: Flag indicating if there is a commercial agreement.
  complexity_level__c:
    lineage:
    - datalake_salesforce_raw.events_case_legal_ops.ComplexityLevel__c
    description: Qualitative complexity rating assigned to the Legal Ops case by the analyst team; influences queue routing.
  contract__c:
    lineage:
    - datalake_salesforce_raw.events_case_legal_ops.Contract__c
    description: Reference to the contract associated with the Legal Ops case. Joinable with datalake_salesforce_clean.contract
  crawler_failure__c:
    lineage:
    - datalake_salesforce_raw.events_case_legal_ops.CrawlerFailure__c
    description: Flag indicating if there was a crawler failure during due diligence.
  id_created_by:
    lineage:
    - datalake_salesforce_raw.events_case_legal_ops.CreatedById
    description: Salesforce User Id for ownership or audit (Owner / CreatedBy / LastModifiedBy). Join to dw_support_journey.dim_analyst.sk_analyst for analyst dimension attributes (source of truth for SF users).
  created_date:
    lineage:
    - datalake_salesforce_raw.events_case_legal_ops.CreatedDate
    description: Date when the record was created in Salesforce (Data de criação).
  dd_add__c:
    lineage:
    - datalake_salesforce_raw.events_case_legal_ops.DDAdd__c
    description: Due diligence additional information field.
  date_last_checklist_sent__c:
    lineage:
    - datalake_salesforce_raw.events_case_legal_ops.DateLastChecklistSent__c
    description: Calendar date when the most recent due diligence checklist was emailed to the buyer or seller.
  delay_reason__c:
    lineage:
    - datalake_salesforce_raw.events_case_legal_ops.DelayReason__c
    description: Reason for delay in the Legal Ops case. Known values include "Não Aplicável (dentro do SLA)". NULL when not changed.
  dilligence_sent_date__c:
    lineage:
    - datalake_salesforce_raw.events_case_legal_ops.DilligenceSentDate__c
    description: Date when the due diligence was sent.
  dilligence_scope__c:
    lineage:
    - datalake_salesforce_raw.events_case_legal_ops.Dilligence_Scope__c
    description: Scope defined for the due diligence analysis. Known values include "New DD".
  early_dd__c:
    lineage:
    - datalake_salesforce_raw.events_case_legal_ops.EarlyDD__c
    description: Flag indicating if the due diligence was performed early.
  error_type__c:
    lineage:
    - datalake_salesforce_raw.events_case_legal_ops.ErrorType__c
    description: Type of error encountered in the Legal Ops case. Known values include "Inclusão de partes". NULL when not changed.
  front_complexity_level__c:
    lineage:
