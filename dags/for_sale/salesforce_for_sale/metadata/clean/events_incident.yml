database_name: datalake_salesforce_clean
table_name: events_incident
description: >
  Clean table for ingesting incident (Incidente) CDC events from Salesforce into the Data
  Lake.
  Each row represents a change event on an Incident record.
  Unlike other CDC tables, incident events send full state on every event — both CREATE and
  UPDATE rows have all fields populated (not sparse).
  Each incident groups multiple pendency notes across different parties (buyer, seller, house,
  etc.) for a Legal Ops case.
  Status lifecycle: ACTIVE (open) → Resolved.
domain: For Sale
owner: helder.rodrigues@quintoandar.com
columns:
  id_record:
    lineage:
    - datalake_salesforce_raw.events_incident.id_record
    description: Primary Salesforce 18-digit identifier for the incident ticket; groups all CDC change events for the same incident.
  commit_number:
    lineage:
    - datalake_salesforce_raw.events_incident.commit_number
    description: Commit number associated with the CDC event.
  commit_ts:
    lineage:
    - datalake_salesforce_raw.events_incident.commit_ts
    description: Commit timestamp of the CDC event in milliseconds epoch (e.g. 1781127243000). Divide by 1000 to get seconds.
  sequence_number:
    lineage:
    - datalake_salesforce_raw.events_incident.sequence_number
    description: Sequence number of the CDC event within the transaction.
  entity_name:
    lineage:
    - datalake_salesforce_raw.events_incident.entity_name
    description: Salesforce entity name that originated the event (Incident).
  event_type:
    lineage:
    - datalake_salesforce_raw.events_incident.event_type
    description: Type of CDC event. Observed values are CREATE (initial status='ACTIVE') and UPDATE (full state sent on every event, not sparse).
  transaction_key:
    lineage:
    - datalake_salesforce_raw.events_incident.transaction_key
    description: Unique key identifying the transaction that generated the event.
  commit_user:
    lineage:
    - datalake_salesforce_raw.events_incident.commit_user
    description: Salesforce User Id for ownership or audit (Owner / CreatedBy / LastModifiedBy). Join to dw_support_journey.dim_analyst.sk_analyst for analyst dimension attributes (source of truth for SF users).
  case_legal_ops__c:
    lineage:
    - datalake_salesforce_raw.events_incident.CaseLegalOps__c
    description: Reference to the Legal Ops case associated with the incident. Joinable with datalake_salesforce_clean.events_case_legal_ops
  case__c:
    lineage:
    - datalake_salesforce_raw.events_incident.Case__c
    description: Salesforce Case Id referencing the parent ticket. Join to datalake_salesforce_clean.events_case.id_record.
  id_created_by:
    lineage:
    - datalake_salesforce_raw.events_incident.CreatedById
    description: Salesforce User Id for ownership or audit (Owner / CreatedBy / LastModifiedBy). Join to dw_support_journey.dim_analyst.sk_analyst for analyst dimension attributes (source of truth for SF users).
  created_date:
    lineage:
    - datalake_salesforce_raw.events_incident.CreatedDate
    description: Date when the incident record was created in Salesforce (Data de criação).
  impact:
    lineage:
    - datalake_salesforce_raw.events_incident.Impact
    description: 'Impact level of the incident (Impacto). Observed value: "High".'
  incident_number:
    lineage:
    - datalake_salesforce_raw.events_incident.IncidentNumber
    description: Unique number identifying the incident (Número do incidente).
  is_closed:
    lineage:
    - datalake_salesforce_raw.events_incident.IsClosed
    description: Flag indicating if the incident is closed (Incidente encerrado).
  is_major_incident:
    lineage:
    - datalake_salesforce_raw.events_incident.IsMajorIncident
    description: Flag indicating if this is a major incident (Incidente importante).
  is_stopped:
    lineage:
    - datalake_salesforce_raw.events_incident.IsStopped
    description: Flag indicating if the incident is paused (Incidente pausado).
  id_last_modified_by:
    lineage:
    - datalake_salesforce_raw.events_incident.LastModifiedById
    description: Salesforce User Id for ownership or audit (Owner / CreatedBy / LastModifiedBy). Join to dw_support_journey.dim_analyst.sk_analyst for analyst dimension attributes (source of truth for SF users).
  last_modified_date:
    lineage:
    - datalake_salesforce_raw.events_incident.LastModifiedDate
    description: Date when the incident record was last modified in Salesforce (Data da última modificação).
  id_owner:
    lineage:
    - datalake_salesforce_raw.events_incident.OwnerId
    description: Salesforce User Id for ownership or audit (Owner / CreatedBy / LastModifiedBy). Join to dw_support_journey.dim_analyst.sk_analyst for analyst dimension attributes (source of truth for SF users).
  pendency_notes__c:
    lineage:
    - datalake_salesforce_raw.events_incident.PendencyNotes__c
    description: 'Concatenated plain-text notes for all pendencies on this incident. Each note is prefixed with the target party role (HOUSE, SELLER, BUYER, NEGOTIATION, NOTE) followed by a colon and the message text. Multiple notes are separated by " || ". Example: "HOUSE: Por gentileza, encaminhar o espelho do IPTU || SELLER: Anexar selfie com documento".

      '
  priority:
    lineage:
    - datalake_salesforce_raw.events_incident.Priority
    description: 'Priority level of the incident (Prioridade). Observed value: "Critical".'
  id_replay:
    lineage:
    - datalake_salesforce_raw.events_incident.ReplayId
    description: Replay ID used for CDC event replay from Salesforce.
  resolution_date_time:
    lineage:
    - datalake_salesforce_raw.events_incident.ResolutionDateTime
    description: Date and time when the incident was resolved (Data e hora de resolução). NULL when status='ACTIVE'; populated when status='Resolved'.
  status:
    lineage:
    - datalake_salesforce_raw.events_incident.Status
    description: 'Current status of the incident (Status). Known values: "ACTIVE" (open), "Resolved" (resolved).'
  subject:
    lineage:
    - datalake_salesforce_raw.events_incident.Subject
    description: Subject/title of the incident (Assunto). Always observed as "Pendência".
  urgency:
    lineage:
    - datalake_salesforce_raw.events_incident.Urgency
    description: 'Urgency level of the incident (Urgência). Observed value: "High".'
  committed_at:
    description: Timestamp of when the CDC event was committed, derived from commit_ts (format YYYY-MM-DD HH:MM:SS, UTC). Equivalent to TIMESTAMP_MILLIS(commit_ts).
  ts_load:
    lineage:
    - datalake_salesforce_raw.events_incident.ts_load
    description: Timestamp of when the record was loaded into the raw table.
  partition_date:
    lineage:
    - datalake_salesforce_raw.events_incident.partition_date
    description: Partition date used for table partitioning (YYYY-MM-DD).
  partition_hour:
    lineage:
    - datalake_salesforce_raw.events_incident.partition_hour
    description: Partition hour used for table partitioning (HH).
  changed_field:
    description: Array of Salesforce API field names from ChangeEventHeader.changedFields on UPDATE events; NULL or empty on CREATE. Element values keep original Salesforce API names.
    lineage:
    - datalake_salesforce_raw.events_incident.changed_field
  description:
    description: Normalized clean column for Salesforce field description. Text or date-time string from Salesforce CDC. NULL when the field was not included in a sparse UPDATE event.
    lineage:
    - datalake_salesforce_raw.events_incident.Description
  pendency_opened_at__c:
    description: Normalized clean column for Salesforce field pendency_opened_at__c. Text or date-time string from Salesforce CDC. NULL when the field was not included in a sparse UPDATE event.
    lineage:
    - datalake_salesforce_raw.events_incident.PendencyOpenedAt__c
  pendency_type__c:
    description: Normalized clean column for Salesforce field pendency_type__c. Text or date-time string from Salesforce CDC. NULL when the field was not included in a sparse UPDATE event.
    lineage:
    - datalake_salesforce_raw.events_incident.PendencyType__c
