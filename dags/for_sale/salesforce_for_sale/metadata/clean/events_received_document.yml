---
database_name: datalake_salesforce_clean
table_name: events_received_document
description: >
  Clean table for ingesting received document (Solicitação de documento) CDC events from Salesforce into the Data Lake.
  Each row represents a single change event on a ReceivedDocument__c record. Because this is CDC, only
  the fields that changed in a given event are populated — all other columns will be NULL.
  On CREATE events all business fields are populated (status='Solicitado'); on UPDATE events typically only
  status changes. To reconstruct the full current state of a document request, aggregate events by
  id_record ordered by id_replay.
  Every ticket represents a new request for extra documents for buyers/sellers.
  Document requests follow the lifecycle: Solicitado → Enviado → Aprovado.
domain: For Sale
owner: helder.rodrigues@quintoandar.com
columns:
  id_record:
    lineage:
      - datalake_salesforce_raw.events_received_document.id_record
    description: Primary Salesforce 18-digit identifier for the received document request; groups CDC updates for the same document workflow.
  commit_number:
    lineage:
      - datalake_salesforce_raw.events_received_document.commit_number
    description: Commit number associated with the CDC event.
  commit_ts:
    lineage:
      - datalake_salesforce_raw.events_received_document.commit_ts
    description: Commit timestamp of the CDC event in milliseconds epoch (e.g. 1781014312000). Divide by 1000 to get seconds.
  sequence_number:
    lineage:
      - datalake_salesforce_raw.events_received_document.sequence_number
    description: Sequence number of the CDC event within the transaction.
  entity_name:
    lineage:
      - datalake_salesforce_raw.events_received_document.entity_name
    description: Salesforce entity name that originated the event (ReceivedDocument__c).
  event_type:
    lineage:
      - datalake_salesforce_raw.events_received_document.event_type
    description: Type of CDC event. Observed values are CREATE (all fields populated, status='Solicitado') and UPDATE (only changed fields populated, typically only status).
  transaction_key:
    lineage:
      - datalake_salesforce_raw.events_received_document.transaction_key
    description: Unique key identifying the transaction that generated the event.
  commit_user:
    lineage:
      - datalake_salesforce_raw.events_received_document.commit_user
    description: Salesforce user ID who committed the change.
  id_last_modified_by:
    lineage:
      - datalake_salesforce_raw.events_received_document.LastModifiedById
    description: Salesforce user ID who last modified the record (Última modificação pelo ID).
  last_modified_date:
    lineage:
      - datalake_salesforce_raw.events_received_document.LastModifiedDate
    description: Date when the record was last modified in Salesforce (Data da última modificação).
  id_replay:
    lineage:
      - datalake_salesforce_raw.events_received_document.ReplayId
    description: Replay ID used for CDC event replay from Salesforce.
  status__c:
    lineage:
      - datalake_salesforce_raw.events_received_document.Status__c
    description: 'Current status of the received document request (Status). Lifecycle: "Solicitado" (initial state on CREATE) → "Enviado" → "Aprovado". NULL when this field was not changed in the event.'
  committed_at:
    description: Timestamp of when the CDC event was committed, derived from commit_ts (format YYYY-MM-DD HH:MM:SS, UTC). Equivalent to TIMESTAMP_MILLIS(commit_ts).
  ts_load:
    lineage:
      - datalake_salesforce_raw.events_received_document.ts_load
    description: Timestamp of when the record was loaded into the raw table.
  partition_date:
    lineage:
      - datalake_salesforce_raw.events_received_document.partition_date
    description: Partition date used for table partitioning (YYYY-MM-DD).
  partition_hour:
    lineage:
      - datalake_salesforce_raw.events_received_document.partition_hour
    description: Partition hour used for table partitioning (HH).
  name:
    lineage:
      - datalake_salesforce_raw.events_received_document.Name
    description: Name of the requested document (Nome do documento solicitado).
  requested_document_for__c:
    lineage:
      - datalake_salesforce_raw.events_received_document.RequestedDocumentFor__c
    description: Indicates for whom or what the document was requested (Comprador/Vendedor)
  received_document__c:
    lineage:
      - datalake_salesforce_raw.events_received_document.ReceivedDocument__c
    description: Type of document received (Matrícula completa do imóvel/Extrato do FGTS/Outros).
  fs_request_justification__c:
    lineage:
      - datalake_salesforce_raw.events_received_document.FS_RequestJustification__c
    description: Justification for the document request (Justificativa da solicitação). Plain text field (not HTML-formatted).
  id_record_type:
    lineage:
      - datalake_salesforce_raw.events_received_document.RecordTypeId
    description: Salesforce record type ID for the received document (ID do tipo de registro).
  created_date:
    lineage:
      - datalake_salesforce_raw.events_received_document.CreatedDate
    description: Date when the record was created in Salesforce (Data de criação).
  id_created_by:
    lineage:
      - datalake_salesforce_raw.events_received_document.CreatedById
    description: Salesforce user ID who created the record (Criado pelo ID).
  id_owner:
    lineage:
      - datalake_salesforce_raw.events_received_document.OwnerId
    description: Salesforce owner user ID of the record (ID do proprietário). Joinable with datalake_salesforce_clean.users
  opportunity__c:
    lineage:
      - datalake_salesforce_raw.events_received_document.Opportunity__c
    description: Opportunity ID associated with the document request (Oportunidade). Used at the pre-contract stage (e.g. FGTS/mortgage analysis). Mutually exclusive with purchase_sale_contract__c. Joinable with datalake_salesforce_clean.opportunity
  purchase_sale_contract__c:
    lineage:
      - datalake_salesforce_raw.events_received_document.PurchaseSaleContract__c
    description: Purchase sale contract ID linked to the document request (Contrato de Compra e Venda). Used at the post-contract stage. Mutually exclusive with opportunity__c. Joinable with datalake_salesforce_clean.purchase_sale_contract
  caso__c:
    lineage:
      - datalake_salesforce_raw.events_received_document.Caso__c
    description: Salesforce case ID related to the document request (Caso). Joinable with datalake_salesforce_clean.events_case
