database_name: datalake_atta_clean
table_name: reconciliation_item
description: Cleaned snapshot of reconciliation item sourced from operational systems backing Atta mortgage and financing platform data for For Sale home purchases. One row per reconciliation item record with standardized names and types in datalake_atta_clean.
domain: For Sale
owner: helder.rodrigues@quintoandar.com.br
columns:
  id_reconciliation:
    description: Primary key identifying the reconciliation item record.
    lineage:
    - datalake_atta_raw.reconciliation_item.id
  id_proposal:
    description: Foreign key to the financing or sale proposal in the Atta platform.
    lineage:
    - datalake_atta_raw.reconciliation_item.proposta_id
  id_closing:
    description: Foreign key to the closing case tracking commissions and document uploads.
    lineage:
    - datalake_atta_raw.reconciliation_item.closing_id
  id_closing_file:
    description: Foreign key to the closing file in datalake_atta_clean.closing_file linked to this reconciliation item.
    lineage:
    - datalake_atta_raw.reconciliation_item.closing_file_id
  id_bank_proposal:
    description: Id of the proposal in the bank system.
    lineage:
    - datalake_atta_raw.reconciliation_item.proposal_bank_id
  buyer_document:
    description: Buyer tax document (CPF or CNPJ) recorded on the reconciliation item.
    lineage:
    - datalake_atta_raw.reconciliation_item.buyer_document
  buyer_name:
    description: Full name of the buyer on the reconciled financing record.
    lineage:
    - datalake_atta_raw.reconciliation_item.buyer_name
  financial_value:
    description: Financing amount reconciled against the bank statement for this item.
    lineage:
    - datalake_atta_raw.reconciliation_item.financial_value
  bank_code:
    description: Code of the bank that the financing was issued.
    lineage:
    - datalake_atta_raw.reconciliation_item.bank
  status:
    description: Current operational status code governing workflow progression for this record.
    lineage:
    - datalake_atta_raw.reconciliation_item.status
  modality:
    description: Financing modality of the reconciled credit operation.
    lineage:
    - datalake_atta_raw.reconciliation_item.modality
  operation_type:
    description: Type of real estate credit operation.
    lineage:
    - datalake_atta_raw.reconciliation_item.proposal_product
  operation_term:
    description: Number of months in the financing operation term.
    lineage:
    - datalake_atta_raw.reconciliation_item.term
  modified_fields:
    description: The fields that were automatically changed in the reconciliation process.
    lineage:
    - datalake_atta_raw.reconciliation_item.modified_fields
  validations:
    description: Fields that differ from the bank file and their original values.
    lineage:
    - datalake_atta_raw.reconciliation_item.validations
  observation:
    description: Observations made.
    lineage:
    - datalake_atta_raw.reconciliation_item.observation
  dt_signed:
    description: Date of when the reconciliation was signed.
    lineage:
    - datalake_atta_raw.reconciliation_item.sign_date
