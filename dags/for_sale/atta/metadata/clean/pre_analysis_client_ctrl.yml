database_name: datalake_atta_clean
table_name: pre_analysis_client_ctrl
domain: For Sale
columns:
  id_control:
    lineage:
    - datalake_atta_raw.consulta_score_cliente_ctrl.id_controle
    description: Identifier of the client pre-analysis control record linking a client to a score request.
  id_client:
    lineage:
    - datalake_atta_raw.consulta_score_cliente_ctrl.id_cliente
    description: Foreign key to the client master record in Atta or Sales Flow.
  id_request:
    lineage:
    - datalake_atta_raw.consulta_score_cliente_ctrl.id_solicitacao
    description: Foreign key to the pre-analysis request this client control belongs to.
  ts_register:
    lineage:
    - datalake_atta_raw.consulta_score_cliente_ctrl.dt_cadastro
    description: Date when the client was registered in this pre-analysis control.
  ts_inactive:
    lineage:
    - datalake_atta_raw.consulta_score_cliente_ctrl.dt_inativo
    description: Date when this client pre-analysis control was deactivated.
  has_income:
    lineage:
    - datalake_atta_raw.consulta_score_cliente_ctrl.compoerenda
    description: Flag indicating whether this client contributes income toward qualifying the financing.
owner: helder.rodrigues@quintoandar.com.br
description: Cleaned snapshot of pre analysis client ctrl sourced from operational systems backing Atta mortgage and financing platform data for For Sale home purchases. One row per pre analysis client ctrl record with standardized names and types in datalake_atta_clean.
