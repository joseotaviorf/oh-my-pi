database_name: datalake_atta_clean
table_name: partner_category
domain: For Sale
columns:
  id:
    lineage:
    - datalake_atta_raw.parceiro_categoria.ID
    description: Surrogate primary key of the partner category row in the source system.
  id_registration_user:
    lineage:
    - datalake_atta_raw.parceiro_categoria.IDUsuCad
    description: User who registered this partner category record.
  category:
    lineage:
    - datalake_atta_raw.parceiro_categoria.Categoria
    description: Business category label grouping reference rows for reporting filters.
  category_description:
    lineage:
    - datalake_atta_raw.parceiro_categoria.Descricao
    description: Longer explanation of the category code shown to operations users.
  ts_registration:
    lineage:
    - datalake_atta_raw.parceiro_categoria.DtCadastro
    description: Timestamp when the partner category was registered.
owner: helder.rodrigues@quintoandar.com.br
description: Cleaned snapshot of partner category sourced from operational systems backing Atta mortgage and financing platform data for For Sale home purchases. One row per partner category record with standardized names and types in datalake_atta_clean.
