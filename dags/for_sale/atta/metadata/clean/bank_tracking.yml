database_name: datalake_atta_clean
table_name: bank_tracking
domain: For Sale
owner: helder.rodrigues@quintoandar.com.br
description: |
  Tracking of a financing proposal's status inside a partner bank's own external
  processing pipeline (esteira bancária), separate from and complementary to Atta's
  internal proposal status, for For Sale home purchases. One row per tracked status
  snapshot for a proposal (via id_proposal, linking to the `proposal` table) at a given
  bank, capturing both Atta's internal status/situation at tracking time and the
  bank-specific status payload and description returned by the bank's integration
  (currently Itaú). Used by `reconciliation_item` (via id_bank_proposal) to relate a
  reconciled financing item to its bank-side tracking record. Sourced from the
  `banktracking` table in the Atta operational database, cleaned with standardized
  names and types in datalake_atta_clean.
columns:
  id:
    lineage:
    - datalake_atta_raw.banktracking.id
    description: Primary key identifying the bank tracking record.
  id_bank:
    lineage:
    - datalake_atta_raw.banktracking.bankid
    description: |
      Identifier of the banking partner this tracking record refers to. Encoded with
      the FORNECEDORES enum from the Atta source application.
    categories:
      "0": TODOS (all suppliers, used for aggregate/broadcast operations)
      "1": ITAU
      "3": BRADESCO
      "5": SANTANDER
      "25": CAIXA
  id_proposal:
    lineage:
    - datalake_atta_raw.banktracking.proposalId
    description: |
      Foreign key to the `proposal` table. Identifies the financing proposal being
      tracked inside the partner bank's own processing pipeline.
  id_bank_proposal:
    lineage:
    - datalake_atta_raw.banktracking.bankProposalId
    description: |
      Identifier of this proposal inside the partner bank's own system (bank-side
      proposal id), used to relate the internal proposal to its bank-side counterpart.
  proposal_status:
    lineage:
    - datalake_atta_raw.banktracking.proposalStatus
    description: |
      Internal Atta funnel/approval-pipeline status of the proposal at the moment this
      tracking snapshot was recorded. Encoded with the same STATUS_ISOLVE enum used by
      the `proposal` table's id_proposal_status column.
    categories:
      "1": PRE_ANALISE (pre-analysis)
      "2": CARTA_CREDITO (credit letter)
      "3": VISTORIA (property inspection)
      "4": CONTRATACAO (contracting)
      "5": CONTRATADO (contracted)
      "6": CHECKLIST (checklist)
      "7": CONF_EMISSAO (issuance confirmation)
      "8": DOCUMENTO_CADASTRO (registration document, legacy/unused)
      "9": DADOS_CADASTRO (registration data, legacy/unused)
      "10": COMISSAO_CADASTRO (commission registration, legacy/unused)
      "11": ASSINATURA_CONTRATO (contract signature, legacy/unused)
      "30": DOCUMENTO_ENVIADO_PARA_ASSINATURA (document sent for signature, legacy/unused)
      "31": DOCUMENTO_ASSINADO (document signed, legacy/unused)
      "32": CARTORIO (notary office)
  proposal_situation:
    lineage:
    - datalake_atta_raw.banktracking.proposalSituation
    description: |
      Internal Atta business situation (outcome) of the proposal at the moment this
      tracking snapshot was recorded. Encoded with the same SITUACAO_ISOLVE enum used
      by the `proposal` table's id_proposal_situation column.
    categories:
      "1": ANDAMENTO (in progress)
      "2": APROVADO (approved)
      "3": PENDENTE (pending)
      "4": REPROVADO (rejected)
      "5": CANCELADO (cancelled)
      "6": FINALIZADO (finalized)
      "7": EM_ANALISE (under analysis)
      "8": ANALISE_ATTA (under Atta internal analysis)
      "9": ANALISE_BANCO (under bank analysis)
      "10": ANALISE_BANCO_DUVIDA (bank analysis with pending question)
      "11": NAO_PASSIVEL_DEFESA (not eligible for appeal)
      "12": REVISAO (under revision)
      "13": NAO_PROCESSADO_BANCO (not processed by bank)
      "14": DIVERGENCIA_CADASTRO (registration data mismatch)
      "15": NOTAS_DE_EXIGENCIA (bank requirement notes pending)
      "16": CARTORIO_EXTERNO (external notary office)
      "17": APROVADO_CONDICIONADO (conditionally approved)
  global_status:
    lineage:
    - datalake_atta_raw.banktracking.status
    description: |
      JSON payload snapshot returned by the bank integration (currently Itaú) with the
      detailed credit/inspection status of the proposal at tracking time, used for
      auditing and troubleshooting bank-side processing. Free-form content, not a
      single status code.
  status_description_itau:
    lineage:
    - datalake_atta_raw.banktracking.itauStatusDescription
    description: |
      Human-readable credit status description returned by Itaú for the proposal at
      tracking time. Encoded with the ItauStatusCreditDescription constants from the
      Atta source application; the list below covers the known values, though
      additional values may be introduced by the bank over time.
    categories:
      "APROVADA AUTOMATICAMENTE": Approved automatically
      "ANÁLISE DE DOCUMENTOS": Document analysis
      "AGUARDANDO FORMALIZAÇÃO": Awaiting formalization
      "PROPOSTA RECUSADA": Proposal denied
      "RECUSADA AUTOMATICAMENTE": Denied automatically
      "AGUARDANDO PROCESSAMENTO": Awaiting processing
      "APROVAÇÃO CONDICIONADA": Conditioned approval
      "AGUARDANDO ANÁLISE": Awaiting analysis
      "APROVAÇÃO CONDICIONADA COM CHECAGEM DOCUMENTOS EFETUADA": Conditioned approval with document check completed
      "AGUARDANDO REANÁLISE": Awaiting reanalysis
      "VENCIDA DEVIDO A NÃO COMPROVAÇÃO DE RENDA": Expired due to lack of income proof
      "PROPOSTA INTERROMPIDA": Proposal interrupted
      "PROPOSTA CANCELADA": Proposal cancelled
      "AGUARDANDO ANALISE DA MESA COMERCIAL": Awaiting sales desk analysis
      "DOCUMENTOS RECEPCIONADOS": Documents received
      "AGUARDANDO ANÁLISE ALÇADA SUPERIOR": Awaiting higher-authority analysis
      "AGUARDANDO RETORNO DOCUMENTAÇÃO": Awaiting documentation return
      "PENDENTE DOCUMENTAÇÃO": Pending documentation
  ts_created:
    lineage:
    - datalake_atta_raw.banktracking.createdAt
    description: Timestamp when the row was first created in the source operational system.
  ts_updated:
    lineage:
    - datalake_atta_raw.banktracking.updatedAt
    description: Timestamp when the row was last updated in the source operational system.