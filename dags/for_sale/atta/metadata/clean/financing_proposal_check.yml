database_name: datalake_atta_clean
table_name: financing_proposal_check
domain: For Sale
owner: helder.rodrigues@quintoandar.com.br
description: |
  Validation and confirmation of the financial values (sale price, down payment,
  financing amount, fees, and taxes) of a financing proposal before it is formally
  confirmed with the banking partner, for For Sale home purchases in the Atta platform.
  One row per confirmation/check event on a `financing_proposal` record (via
  id_proposal_product), capturing who requested and who confirmed the check, along with
  the agreed monetary breakdown of the operation. Sourced from the
  `proposta_credimob_confval` table in the Atta operational database, cleaned with
  standardized names and types in datalake_atta_clean.
columns:
  id:
    lineage:
    - datalake_atta_raw.proposta_credimob_confval.ID
    description: |
      Primary key identifying the financing proposal check record. Surrogate key
      auto-generated by the source system.
  id_proposal_product:
    lineage:
    - datalake_atta_raw.proposta_credimob_confval.IDPropostaPRD
    description: |
      Foreign key to the `financing_proposal` table. Identifies the financing proposal
      product whose financial values are being checked and confirmed.
  id_included_user:
    lineage:
    - datalake_atta_raw.proposta_credimob_confval.IDUsuInc
    description: |
      Foreign key to the `users_info` table. Identifies the Atta user who registered
      (included) this proposal-check record.
  id_user_sol_conf:
    lineage:
    - datalake_atta_raw.proposta_credimob_confval.IDUsuSolConf
    description: |
      Foreign key to the `users_info` table. Identifies the user who requested
      confirmation of the financing proposal values.
  id_confirmed_user:
    lineage:
    - datalake_atta_raw.proposta_credimob_confval.IDUsuConf
    description: |
      Foreign key to the `users_info` table. Identifies the user who validated and
      confirmed the proposal check.
  operation_product_type:
    lineage:
    - datalake_atta_raw.proposta_credimob_confval.TipoProdutoOperacao
    description: |
      Combined operation and product type classification of the financing operation, as
      informed when the proposal values were confirmed. No authoritative fixed category
      list could be confirmed in the Atta source code for this specific field, so none
      is provided here.
  channel:
    lineage:
    - datalake_atta_raw.proposta_credimob_confval.Canal
    description: |
      Identifier of the sales/origination channel through which the proposal was
      submitted. References an internal channel catalog (Canais) in the Atta source
      application rather than a fixed, small set of categories.
  installments_quantity:
    lineage:
    - datalake_atta_raw.proposta_credimob_confval.Prazo
    description: Number of monthly installments requested in the financing simulation being confirmed.
  financing_fee:
    lineage:
    - datalake_atta_raw.proposta_credimob_confval.Taxa
    description: Interest rate applied to the financing operation, as confirmed in this check.
  has_seller_debt_payment:
    lineage:
    - datalake_atta_raw.proposta_credimob_confval.IQ
    description: |
      Whether the financing package includes settlement of the seller's outstanding
      debt (IQ, "interveniente quitante") as part of the operation. Boolean flag.
  is_confirmed:
    lineage:
    - datalake_atta_raw.proposta_credimob_confval.Confirmado
    description: |
      Whether the confirmation of the financing proposal's financial values was
      accepted by operations. Boolean flag (true when accepted, false/null when
      pending or not accepted).
  house_sale_value:
    lineage:
    - datalake_atta_raw.proposta_credimob_confval.VlrVendaImovel
    description: |
      Negotiated or appraised property sale value used in the financing calculation, in
      Brazilian Reais.
  down_payment_own_resources_value:
    lineage:
    - datalake_atta_raw.proposta_credimob_confval.VlrEntRecProp
    description: Down payment portion funded by the buyer's own resources, in Brazilian Reais.
  fgts_down_payment_value:
    lineage:
    - datalake_atta_raw.proposta_credimob_confval.VlrEntFGTS
    description: Down payment portion funded from the buyer's FGTS balance, in Brazilian Reais.
  financing_value:
    lineage:
    - datalake_atta_raw.proposta_credimob_confval.VlrFinan
    description: |
      Principal financing amount requested, excluding down payment and fees, in
      Brazilian Reais.
  bank_valuation_value:
    lineage:
    - datalake_atta_raw.proposta_credimob_confval.VlrAvalBco
    description: Property value as assessed by the bank's appraisal, in Brazilian Reais.
  bank_valuation_fee_value:
    lineage:
    - datalake_atta_raw.proposta_credimob_confval.VlrTarAvalBco
    description: Fee charged by the bank for the property appraisal, in Brazilian Reais.
  itbi_value:
    lineage:
    - datalake_atta_raw.proposta_credimob_confval.VlrITBI
    description: |
      Property transfer tax (ITBI) amount considered in the financing operation, in
      Brazilian Reais.
  seller_debt_payment_value:
    lineage:
    - datalake_atta_raw.proposta_credimob_confval.VlrIQ
    description: |
      Amount applied to settle the seller's outstanding debt (IQ) at closing, in
      Brazilian Reais, when applicable.
  total_value:
    lineage:
    - datalake_atta_raw.proposta_credimob_confval.VlrTotalCont
    description: Total contracted value of the financing operation, in Brazilian Reais.
  payment_sale_value:
    lineage:
    - datalake_atta_raw.proposta_credimob_confval.VlrPgtoVend
    description: Amount paid to the seller in the property sale transaction, in Brazilian Reais.
  ts_seller_debt_payment:
    lineage:
    - datalake_atta_raw.proposta_credimob_confval.DataIQ
    description: Timestamp when the seller debt settlement (IQ) was recorded.
  ts_inclusion:
    lineage:
    - datalake_atta_raw.proposta_credimob_confval.DtInclusao
    description: Timestamp when the proposal check record was first included/registered.
  ts_sol_conf:
    lineage:
    - datalake_atta_raw.proposta_credimob_confval.DtSolConf
    description: Timestamp when confirmation of the proposal check values was requested.
  ts_confirmation:
    lineage:
    - datalake_atta_raw.proposta_credimob_confval.DtConfirmacao
    description: Timestamp when the proposal check was confirmed.
  ts_updated:
    lineage:
    - datalake_atta_raw.proposta_credimob_confval.AtualizadoEm
    description: Timestamp when the row was last updated in the source operational system.

