database_name: datalake_atta_clean
table_name: closing_file
description: Cleaned snapshot of closing file sourced from operational systems backing Atta mortgage and financing platform data for For Sale home purchases. One row per closing file record with standardized names and types in datalake_atta_clean.
domain: For Sale
owner: helder.rodrigues@quintoandar.com.br
columns:
  id_file:
    description: Foreign key to the uploaded closing or legal document metadata row.
    lineage:
    - datalake_atta_raw.closing_file.id
  id_closing:
    description: Foreign key to the closing case tracking commissions and document uploads.
    lineage:
    - datalake_atta_raw.closing_file.closing_id
  id_user:
    description: Foreign key to the QuintoAndar user who performed the action.
    lineage:
    - datalake_atta_raw.closing_file.user_id
  id_document:
    description: Foreign key to the document type registry for closing paperwork.
    lineage:
    - datalake_atta_raw.closing_file.storage_documento_id
  file_key:
    description: Object storage key locating the uploaded document in the closing bucket.
    lineage:
    - datalake_atta_raw.closing_file.file_key
  file_hash:
    description: Content hash verifying integrity of the uploaded closing document file.
    lineage:
    - datalake_atta_raw.closing_file.file_hash
  file_name:
    description: Original filename of the document uploaded during closing or legal review.
    lineage:
    - datalake_atta_raw.closing_file.file_name
  comments:
    description: Operator comments attached to the document, file, or workflow step.
    lineage:
    - datalake_atta_raw.closing_file.comments
  ts_created:
    description: Timestamp of when the file was created.
    lineage:
    - datalake_atta_raw.closing_file.created_at
