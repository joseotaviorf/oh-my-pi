database_name: datalake_atta_clean
table_name: proposal
domain: For Sale
owner: helder.rodrigues@quintoandar.com.br
description: |
  Cleaned snapshot of financing/mortgage proposals for For Sale home purchases processed
  through the Atta platform. This is the central table of the Atta domain: one row per
  financing proposal, tracking the client, partner, franchise, product, assigned analysts,
  requested/approved values, and the proposal's situation and status as it moves through
  the credit approval funnel (pre-analysis, credit letter, inspection, contracting,
  issuance, and notary steps — see `track_step_detail` for the full per-product funnel
  definition). Used to analyze mortgage funnel conversion, analyst workload, financing
  volumes, and cancellation patterns. Links to `client_info`, `partner_info`,
  `franchise_info`, `product_info`, `users_info`, `providers_info`, `pre_analysis`, and
  `financing_proposal`. Sourced from the `proposta` table in the Atta operational database.
columns:
  id_proposal:
    lineage:
    - datalake_atta_raw.proposta.id
    description: |
      Primary key of the financing proposal, the central record of the mortgage/financing
      workflow for a For Sale home purchase in the Atta platform.
  id_client:
    lineage:
    - datalake_atta_raw.proposta.idcliente
    description: |
      Foreign key to the `client_info` table. Identifies the buyer/client requesting the
      financing proposal.
  id_consultant:
    lineage:
    - datalake_atta_raw.proposta.idconsultor
    description: |
      Foreign key to the `users_info` table. Identifies the internal Atta user (consultant)
      handling the financing proposal with the client.
  id_pre_analysis:
    lineage:
    - datalake_atta_raw.proposta.idcstimob
    description: |
      Foreign key to the `pre_analysis` table. Identifies the credit pre-analysis (score
      consultation) performed before this formal proposal was created.
  id_credit_analyst:
    lineage:
    - datalake_atta_raw.proposta.idanalistacredito
    description: |
      Foreign key to the `users_info` table. Identifies the internal Atta user (credit
      analyst) assigned to evaluate the financial/credit aspects of the proposal.
  id_juridical_analyst:
    lineage:
    - datalake_atta_raw.proposta.idanalistajuridico
    description: |
      Foreign key to the `users_info` table. Identifies the internal Atta user (legal
      analyst) responsible for the legal/documentation review of the proposal.
  id_emission_provider:
    lineage:
    - datalake_atta_raw.proposta.idfornecemissao
    description: |
      Foreign key to the `providers_info` table. Identifies the bank or supplier
      responsible for issuing (emitting) the financing contract for this proposal.
  id_franchise:
    lineage:
    - datalake_atta_raw.proposta.idfranquia
    description: |
      Foreign key to the `franchise_info` table. Identifies the franchise unit that
      originated or is serving the client for this proposal.
  id_partner:
    lineage:
    - datalake_atta_raw.proposta.idparceiro
    description: |
      Foreign key to the `partner_info` table. Identifies the brokerage/financing partner
      organization associated with the proposal.
  id_product:
    lineage:
    - datalake_atta_raw.proposta.idproduto
    description: |
      Foreign key to the `product_info` table. Identifies the financing product chosen for
      this proposal (e.g. specific bank/financing line offering).
  id_offer:
    lineage:
    - datalake_atta_raw.proposta.idpropostaext
    description: |
      Natural/external key linking this financing proposal to the corresponding For Sale
      offer record in Sales Flow or other upstream sales services (e.g. EBDB). As with
      `pre_analysis.id_offer`, expected to be null for: (1) Varejo (retail/franchise)
      proposals, which belong to franchises external to QuintoAndar and do not fill in
      `id_offer` (nor `pre_analysis.id_user_5a`); and (2) QuintoAndar proposals whose
      related pre-analysis has not yet had its CCV (purchase and sale agreement) signed,
      i.e. `pre_analysis.status = 1` (PRE_ANALISE). Do not treat these nulls as data
      quality issues.
  id_proposal_product:
    lineage:
    - datalake_atta_raw.proposta.idpropostaprd
    description: |
      Foreign key to the `financing_proposal` table. Identifies the specific financing
      proposal (Itaú/multibank) product line attached to this proposal.
  id_multibank_typist_user:
    lineage:
    - datalake_atta_raw.proposta.idusudigitador
    description: |
      Foreign key to the `users_info` table. Identifies the internal Atta user who manually
      keyed (typed) this proposal's data into a multibank bank origination system.
  id_proposal_situation:
    lineage:
    - datalake_atta_raw.proposta.situacao
    description: |
      Business situation (outcome) of the financing proposal within its workflow, independent
      of which funnel step it is currently in. Encoded with the SITUACAO_ISOLVE enum from the
      Atta source application.
    categories:
      "1": ANDAMENTO (in progress)
      "2": APROVADO (approved)
      "3": PENDENTE (pending)
      "4": REPROVADO (rejected)
      "5": CANCELADO (cancelled)
      "6": FINALIZADO (finalized)
      "7": EM_ANALISE (under analysis)
      "8": ANALISE_ATTA (under Atta internal analysis)
      "9": ANALISE_BANCO (under bank analysis)
      "10": ANALISE_BANCO_DUVIDA (bank analysis with pending question)
      "11": NAO_PASSIVEL_DEFESA (not eligible for appeal)
      "12": REVISAO (under revision)
      "13": NAO_PROCESSADO_BANCO (not processed by bank)
      "14": DIVERGENCIA_CADASTRO (registration data mismatch)
      "15": NOTAS_DE_EXIGENCIA (bank requirement notes pending)
      "16": CARTORIO_EXTERNO (external notary office)
      "17": APROVADO_CONDICIONADO (conditionally approved)
  id_proposal_status:
    lineage:
    - datalake_atta_raw.proposta.status
    description: |
      Current funnel/approval-pipeline step (esteira) that the financing proposal is going
      through, complementary to id_proposal_situation. Encoded with the STATUS_ISOLVE enum
      from the Atta source application; also documented per product in the track_step_detail
      table.
    categories:
      "1": PRE_ANALISE (DEPRECATED)
      "2": CARTA_CREDITO (step 1 in the flow)
      "3": VISTORIA (DEPRECATED)
      "4": CONTRATACAO (setp 3 in the flow)
      "5": CONTRATADO (DEPRECATED)
      "6": CHECKLIST (step 2 in the flow)
      "7": CONF_EMISSAO (step 4 in the flow)
      "8": DOCUMENTO_CADASTRO (DEPRECATED)
      "9": DADOS_CADASTRO (DEPRECATED)
      "10": COMISSAO_CADASTRO (DEPRECATED)
      "11": ASSINATURA_CONTRATO (DEPRECATED)
      "30": DOCUMENTO_ENVIADO_PARA_ASSINATURA (DEPRECATED)
      "31": DOCUMENTO_ASSINADO (DEPRECATED)
      "32": CARTORIO (step 5 in the flow)
  created_by:
    lineage:
    - datalake_atta_raw.proposta.CreatedBy
    description: |
      Identifier of the user or system integration that created the proposal record
      (stored as a raw numeric identifier, not a validated foreign key).
  client_cpf:
    lineage:
    - datalake_atta_raw.proposta.cpf
    description: Brazilian CPF tax identifier for the primary buyer/client in the proposal.
  client_name:
    lineage:
    - datalake_atta_raw.proposta.nome
    description: Full name of the buyer or client in the financing proposal record.
  financing_value:
    lineage:
    - datalake_atta_raw.proposta.valor
    description: Principal financing amount requested by the client, excluding down payment and fees, in Brazilian Reais.
  status_translation:
    lineage:
    - datalake_atta_raw.proposta.StatusTranslation
    description: |
      Human-readable, free-text label describing the current status/situation of the
      proposal, generated by the source system for display in the Atta UI.
  chosen_by:
    lineage:
    - datalake_atta_raw.proposta.ChosenBy
    description: |
      Identifier of the user who selected this proposal as the client's chosen financing
      option among multiple offers.
  cancellation_reason:
    lineage:
    - datalake_atta_raw.proposta.MotivoCancelamento
    description: Free-text reason recorded for cancelling the financing proposal, when applicable.
  ts_registration:
    lineage:
    - datalake_atta_raw.proposta.dtentrada
    description: |
      Timestamp when the proposal entered the financing pipeline (was registered). Set once
      at creation and never updated afterwards.
  ts_financing_ended:
    lineage:
    - datalake_atta_raw.proposta.dtfinalizacao
    description: |
      Timestamp when the financing proposal was finalized or closed, regardless of outcome.
      Can be set at creation time (e.g. proposals registered already finalized) or updated
      later during bank reconciliation/closing. This field is manually input by the operator
      and could be smaller then ts_registration. Filter out those cases on analysis.
  ts_last_updated:
    lineage:
    - datalake_atta_raw.proposta.dtultatu
    description: Timestamp of the most recent update to the proposal record.
  ts_chosen:
    lineage:
    - datalake_atta_raw.proposta.ChosenAt
    description: Timestamp when this proposal was selected as the client's chosen financing option.
