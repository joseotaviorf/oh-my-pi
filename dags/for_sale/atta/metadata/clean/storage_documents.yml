database_name: datalake_atta_clean
table_name: storage_documents
domain: For Sale
owner: helder.rodrigues@quintoandar.com.br
description: |
  Repository of documents uploaded and attached to entities in the Atta mortgage/financing
  platform (personal documents, proposal documents, inspection documents, contracts, etc.),
  used to support the credit analysis and contracting workflow for For Sale home purchases.
  One row per stored document, with its type, topic, review status, storage location and
  optional OCR-extracted text. Related to `users_info` (via `id_user`) and, depending on
  business context, to the `proposal` table or other entities (via `id_entity`). Sourced from
  the Atta operational system table `storagedocumentos` in datalake_atta_raw.
columns:
  id_storage_document:
    lineage:
    - datalake_atta_raw.storagedocumentos.Id
    description: |
      Surrogate primary key identifying a single stored/attached document record. GUID
      generated by the source system.
  id_document:
    lineage:
    - datalake_atta_raw.storagedocumentos.DocumentId
    description: |
      Identifier of the underlying document in the originating document-management system
      (e.g. Docx), when this storage record references one. May not resolve to a record in
      any single clean table, since it depends on which system produced the document.
  id_entity:
    lineage:
    - datalake_atta_raw.storagedocumentos.EntidadeId
    description: |
      Identifier of the business entity this document is attached to. Depending on the
      business context (see `topic`) this can point to a `proposal` record or to other kinds
      of entities (e.g. a pre-analysis or a person), so it is a generic entity id rather than
      a foreign key to a single fixed table.
  id_user:
    lineage:
    - datalake_atta_raw.storagedocumentos.UsuarioId
    description: |
      The QuintoAndar/Atta user who uploaded or is otherwise associated with the document.
      Foreign key to the `users_info` table.
  document_type:
    lineage:
    - datalake_atta_raw.storagedocumentos.TipoDocumento
    description: |
      Numeric code identifying the kind of document (e.g. ID document, credit letter,
      insurance-related document). The Atta source code keeps several separate document-type
      catalogs (personal documents, credit-letter documents, insurance documents, etc.) that
      share this same column depending on the upload flow, so no single authoritative
      category list could be confirmed and none is provided here.
  content_type:
    lineage:
    - datalake_atta_raw.storagedocumentos.ContentType
    description: MIME content type of the uploaded file (e.g. application/pdf, image/jpeg).
  storage_key:
    lineage:
    - datalake_atta_raw.storagedocumentos.key
    description: Path/key of the file within its storage bucket.
  bucket:
    lineage:
    - datalake_atta_raw.storagedocumentos.bucket
    description: |
      Storage backend/bucket where the file physically resides. Encoded with the BUCKET enum
      from the Atta source application.
    categories:
      "0": ATTA (Atta's own storage bucket)
      "1": DOCX (Docx document-management system storage)
      "2": SALESFLOW (Sales Flow storage)
      "3": MORTGAGE_FILES (mortgage files storage)
  topic:
    lineage:
    - datalake_atta_raw.storagedocumentos.Topico
    description: |
      Business context/topic the document belongs to, indicating which kind of entity or
      process it is related to (e.g. the proposal, a personal document, a property
      inspection). Encoded with the StorageDocumentoTopicos enum from the Atta source
      application.
    categories:
      "0": PROPOSTA (proposal)
      "1": DOCUMENTO_PESSOAL (personal document)
      "3": DOCUMENTO_CREDITO (credit document)
      "4": DOCUMENTO_VISTORIA (inspection document)
      "5": DOCUMENTO_VENDEDOR (seller document)
      "6": DOCUMENTO_IMOVEL (property document)
      "7": DOCUMENTO_FGTS (FGTS document)
      "8": DOCUMENTO_IQ (IQ document)
      "9": DOCUMENTO_CONTRATO (contract document)
      "10": DOCUMENTO_PESSOA_JURIDICA (legal-entity document)
      "100": PROPOSTA_VISTORIA (proposal inspection)
      "200": INCORPORADORAS_PROPOSTA_COMERCIAL (developer commercial proposal)
      "300": DOCUMENTO_SIMULACAO (simulation document)
      "400": CLOSING_FILE (closing file)
  status:
    lineage:
    - datalake_atta_raw.storagedocumentos.status
    description: |
      Current review/processing status of the document. Encoded with the
      STATUS_STORAGE_DOCUMENTO enum from the Atta source application.
    categories:
      "-1": CANCELED (document upload/request was canceled)
      "0": APPROVED (document was reviewed and approved)
      "1": DENIED (document was reviewed and denied)
      "2": REQUESTED (document was requested but not yet sent)
      "3": SENT (document was sent, pending review)
  cpf:
    lineage:
    - datalake_atta_raw.storagedocumentos.cpf
    description: Brazilian CPF tax identifier of the user/client the document relates to.
  extension:
    lineage:
    - datalake_atta_raw.storagedocumentos.Extensao
    description: File extension of the uploaded document (e.g. pdf, jpg, png).
  file_size:
    lineage:
    - datalake_atta_raw.storagedocumentos.Tamanho
    description: Size of the uploaded file, in kilobytes.
  file_name:
    lineage:
    - datalake_atta_raw.storagedocumentos.NomeArquivo
    description: Original file name of the uploaded document, when available.
  extracted_data:
    lineage:
    - datalake_atta_raw.storagedocumentos.`_OCR`
    description: |
      Text/data extracted from the document via optical character recognition (OCR), when
      OCR processing was applied to it.
  ts_sent:
    lineage:
    - datalake_atta_raw.storagedocumentos.EnviadoEm
    description: Timestamp when the document was sent/uploaded.
  ts_updated:
    lineage:
    - datalake_atta_raw.storagedocumentos.AtualizadoEm
    description: |
      Timestamp when the document record was last updated. Normalized to
      1970-01-01T00:00:00Z when the source system stored its default/unset value
      (0001-01-01T00:00:00Z).
