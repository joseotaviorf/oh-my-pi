database_name: datalake_atta_clean
table_name: pre_analysis_ctrl
domain: For Sale
owner: helder.rodrigues@quintoandar.com.br
description: |
  Cleaned control/routing table linking a mortgage pre-analysis request to the bank
  suppliers consulted for it, in the Atta platform for For Sale home purchases. One row
  per (request, supplier, check) combination: each time a pre-analysis is sent to a bank
  for a credit score check, a row is added here pointing to that supplier's own
  pre-analysis detail table and, once available, to the resulting financing proposal.
  Used to trace which banks were queried for a given pre-analysis and to join through to
  per-bank pre-analysis detail tables (pre_analysis_bradesco, pre_analysis_caixa,
  pre_analysis_itau, pre_analysis_santander) and to the `financing_proposal` table.
  Sourced from the `consulta_score_ctrl` table in the Atta operational database.
columns:
  id_request:
    lineage:
    - datalake_atta_raw.consulta_score_ctrl.idsolicitacao
    description: |
      Foreign key to the `pre_analysis` table. Identifies the pre-analysis (score)
      request that this control row routes to a specific bank/supplier. Also referenced
      by the per-bank pre-analysis detail tables (e.g. pre_analysis_bradesco,
      pre_analysis_caixa, pre_analysis_itau, pre_analysis_santander).
  id_supplier:
    lineage:
    - datalake_atta_raw.consulta_score_ctrl.idfornecedor
    description: |
      Foreign key to the `providers_info` table. Identifies the bank/supplier consulted
      for this pre-analysis request. Encoded with the FORNECEDORES enum from the Atta
      source application.
    categories:
      "0": TODOS (all suppliers, used for aggregate/broadcast operations)
      "1": ITAU
      "3": BRADESCO
      "5": SANTANDER
      "25": CAIXA
  id_check:
    lineage:
    - datalake_atta_raw.consulta_score_ctrl.idconsulta
    description: |
      Identifier of the specific score query (consulta) executed against the supplier
      identified by id_supplier; it is a natural key into that supplier's own
      pre-analysis detail table (e.g. the `Id` of the corresponding row in
      pre_analysis_itau/bradesco/santander/caixa), not a single shared table.
  id_proposal:
    lineage:
    - datalake_atta_raw.consulta_score_ctrl.idpropostaprd
    description: |
      Foreign key to the `financing_proposal` table. Identifies the specific financing
      proposal (Itaú/multibank) product line generated from this pre-analysis, once one
      exists; defaults to -1 while no proposal has been generated yet.
