database_name: datalake_atta_clean
table_name: pre_analysis_itau_ratings
domain: For Sale
columns:
  id_ratings_itau:
    lineage:
    - datalake_atta_raw.consulta_score_itau_ratings.id
    description: Identifier of the Itau credit-rating parameter row in the pre-analysis scoring rules.
  id_user_started:
    lineage:
    - datalake_atta_raw.consulta_score_itau_ratings.idusuarioini
    description: Identifier of the user who opened the validity period for this Itau rating rule.
  id_user_ended:
    lineage:
    - datalake_atta_raw.consulta_score_itau_ratings.idusuariofim
    description: Identifier of the user who closed the validity period for this Itau rating rule.
  rating:
    lineage:
    - datalake_atta_raw.consulta_score_itau_ratings.rating
    description: Itau credit-rating bucket that the approval and income-commitment limits below apply to.
  apr_max_res_percentage:
    lineage:
    - datalake_atta_raw.consulta_score_itau_ratings.percaprmaxres
    description: Maximum residential financing approval percentage allowed for this Itau rating bucket.
  apr_auto_res_percentage:
    lineage:
    - datalake_atta_raw.consulta_score_itau_ratings.peraprautores
    description: Residential financing percentage eligible for automatic approval under this Itau rating bucket.
  apr_max_com_percentage:
    lineage:
    - datalake_atta_raw.consulta_score_itau_ratings.percaprmaxcom
    description: Maximum commercial financing approval percentage allowed for this Itau rating bucket.
  apr_auto_com_percentage:
    lineage:
    - datalake_atta_raw.consulta_score_itau_ratings.peraprautocom
    description: Commercial financing percentage eligible for automatic approval under this Itau rating bucket.
  cpmr_income_res_percentage:
    lineage:
    - datalake_atta_raw.consulta_score_itau_ratings.percpmrrendares
    description: Maximum share of income committable to the residential installment for this Itau rating bucket.
  cpmr_income_com_percentage:
    lineage:
    - datalake_atta_raw.consulta_score_itau_ratings.percpmrrendacom
    description: Maximum share of income committable to the commercial installment for this Itau rating bucket.
  ts_started:
    lineage:
    - datalake_atta_raw.consulta_score_itau_ratings.dtinivigencia
    description: Start of the validity period during which this Itau rating rule is effective.
  ts_ended:
    lineage:
    - datalake_atta_raw.consulta_score_itau_ratings.dtfimvigencia
    description: End of the validity period after which this Itau rating rule no longer applies.
owner: helder.rodrigues@quintoandar.com.br
description: Cleaned snapshot of pre analysis itau ratings sourced from operational systems backing Atta mortgage and financing platform data for For Sale home purchases. One row per pre analysis itau ratings record with standardized names and types in datalake_atta_clean.
