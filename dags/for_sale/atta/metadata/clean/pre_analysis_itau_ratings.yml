database_name: datalake_atta_clean
table_name: pre_analysis_itau_ratings
domain: For Sale
owner: helder.rodrigues@quintoandar.com.br
description: Reference/configuration table with the maximum and auto-approval loan-to-value percentages and income-commitment limits that Itau applies per credit-rating bucket, split by residential and commercial financing, and versioned by validity period (vigencia). Used by the pre-analysis workflow to interpret and validate the rating-based results returned in pre_analysis_itau, in support of the credit pre-analysis process that evaluates financing viability before a formal proposal is generated. One row per Itau rating bucket per validity period. Cleaned snapshot of consulta_score_itau_ratings sourced from the Atta operational database, standardized to datalake_atta_clean naming and types.
columns:
  id_ratings_itau:
    lineage:
    - datalake_atta_raw.consulta_score_itau_ratings.id
    description: Primary key identifying a configuration row of Itau approval and income-commitment limits for a given credit-rating bucket and validity period.
  id_user_started:
    lineage:
    - datalake_atta_raw.consulta_score_itau_ratings.idusuarioini
    description: User who created/opened the validity period for this Itau rating configuration. Foreign key to the `users_info` table.
  id_user_ended:
    lineage:
    - datalake_atta_raw.consulta_score_itau_ratings.idusuariofim
    description: User who closed the validity period for this Itau rating configuration (set when the rule is superseded by a new one). Foreign key to the `users_info` table.
  rating:
    lineage:
    - datalake_atta_raw.consulta_score_itau_ratings.rating
    description: Itau credit-rating bucket code that this configuration row applies to. The approval and income-commitment limits below are defined per rating bucket and are the same buckets returned as r_score/r_bhv values in the pre_analysis_itau table.
  apr_max_res_percentage:
    lineage:
    - datalake_atta_raw.consulta_score_itau_ratings.percaprmaxres
    description: Maximum loan-to-value approval percentage allowed for residential financing under this Itau rating bucket.
  apr_auto_res_percentage:
    lineage:
    - datalake_atta_raw.consulta_score_itau_ratings.peraprautores
    description: Loan-to-value percentage for residential financing that is eligible for automatic (no manual review) approval under this Itau rating bucket.
  apr_max_com_percentage:
    lineage:
    - datalake_atta_raw.consulta_score_itau_ratings.percaprmaxcom
    description: Maximum loan-to-value approval percentage allowed for commercial financing under this Itau rating bucket.
  apr_auto_com_percentage:
    lineage:
    - datalake_atta_raw.consulta_score_itau_ratings.peraprautocom
    description: Loan-to-value percentage for commercial financing that is eligible for automatic (no manual review) approval under this Itau rating bucket.
  cpmr_income_res_percentage:
    lineage:
    - datalake_atta_raw.consulta_score_itau_ratings.percpmrrendares
    description: Maximum share of the client's income that can be committed to the residential financing installment for this Itau rating bucket.
  cpmr_income_com_percentage:
    lineage:
    - datalake_atta_raw.consulta_score_itau_ratings.percpmrrendacom
    description: Maximum share of the client's income that can be committed to the commercial financing installment for this Itau rating bucket.
  ts_started:
    lineage:
    - datalake_atta_raw.consulta_score_itau_ratings.dtinivigencia
    description: Timestamp from which this Itau rating configuration becomes effective.
  ts_ended:
    lineage:
    - datalake_atta_raw.consulta_score_itau_ratings.dtfimvigencia
    description: Timestamp after which this Itau rating configuration is no longer effective (null while the rule is active).