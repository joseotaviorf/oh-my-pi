database_name: datalake_atta_clean
table_name: log_isolve_v2
domain: For Sale
owner: helder.rodrigues@quintoandar.com.br
description: |
  Generic change log ("De"/"Para") of field-level updates made to entities in the Atta
  platform, mostly used to track changes on mortgage/financing proposals as part of the
  isolve workflow (companion history to `log_isolve_v1`, which tracks status/situation
  changes specifically). One row per logged field change, grouped by topic/entity
  (`type_operation`) and identified by the changed entity (`id_proposal`). Related to the
  `proposal` table (via `id_proposal`) and `users_info` (via `id_user`). Sourced from the
  Atta operational system table `entidade_log` in datalake_atta_raw.
columns:
  id:
    lineage:
    - datalake_atta_raw.entidade_log.id
    description: |
      Surrogate primary key identifying a single field-change event recorded for an entity.
      GUID generated by the source system.
  id_user:
    lineage:
    - datalake_atta_raw.entidade_log.usuarioid
    description: |
      The QuintoAndar/Atta user (or system account) who performed the change that generated
      this log entry. Foreign key to the `users_info` table.
  id_proposal:
    lineage:
    - datalake_atta_raw.entidade_log.entidadeid
    description: |
      Identifier of the entity whose field changed. In the observed usage this is the
      mortgage/financing proposal, so it is treated as a foreign key to the `proposal` table;
      technically it is a generic, free-text entity id (`EntidadeId`) that other callers of
      this logging mechanism could in principle populate with a different kind of entity.
  type_operation:
    lineage:
    - datalake_atta_raw.entidade_log.topico
    description: |
      Topic of the change, identifying which entity/domain object (e.g. the proposal class
      name) or business process the logged field change belongs to. Free-text value set by
      the calling application code (often the .NET class name of the changed entity); no
      fixed enum was found for this field, so no category list is provided.
  from:
    lineage:
    - datalake_atta_raw.entidade_log.de
    description: Previous value of the field before this change ("De").
  to:
    lineage:
    - datalake_atta_raw.entidade_log.para
    description: New value of the field after this change ("Para").
  ts_created:
    lineage:
    - datalake_atta_raw.entidade_log.criadoem
    description: Timestamp when this field-change event was logged in the source system.
