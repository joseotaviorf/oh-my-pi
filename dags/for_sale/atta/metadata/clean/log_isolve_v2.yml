database_name: datalake_atta_clean
table_name: log_isolve_v2
domain: For Sale
columns:
  id:
    lineage:
    - datalake_atta_raw.entidade_log.id
    description: Surrogate primary key of the log isolve v2 row in the source system.
  id_user:
    lineage:
    - datalake_atta_raw.entidade_log.usuarioid
    description: Foreign key to the QuintoAndar user who performed the action.
  id_proposal:
    lineage:
    - datalake_atta_raw.entidade_log.entidadeid
    description: Foreign key to the financing or sale proposal in the Atta platform.
  type_operation:
    lineage:
    - datalake_atta_raw.entidade_log.topico
    description: Topic or type of the logged entity change event.
  from:
    lineage:
    - datalake_atta_raw.entidade_log.de
    description: Previous value or state before the proposal field change event.
  to:
    lineage:
    - datalake_atta_raw.entidade_log.para
    description: New value or state after the proposal field change event.
  ts_created:
    lineage:
    - datalake_atta_raw.entidade_log.criadoem
    description: Timestamp when the row was first created in the source operational system.
owner: helder.rodrigues@quintoandar.com.br
description: Cleaned snapshot of log isolve v2 sourced from operational systems backing Atta mortgage and financing platform data for For Sale home purchases. One row per log isolve v2 record with standardized names and types in datalake_atta_clean.
