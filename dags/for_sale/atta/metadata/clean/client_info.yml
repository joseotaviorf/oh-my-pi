database_name: datalake_atta_clean
table_name: client_info
domain: For Sale
owner: helder.rodrigues@quintoandar.com.br
description: Business dimension holding one row per client (individual buyer) who has interacted with Atta, QuintoAndar's mortgage and real-estate financing platform, storing core identification and contact data (name, CPF, email, cellphone and phone). It is the client master data used across the For Sale Atta domain to identify who a home-financing proposal, pre-analysis, or closing belongs to, and is referenced by fact tables such as `proposal`, `pre_analysis`, and `financing_proposal` via `id_client`. Typical consumers are credit-analysis, sales, and CRM reporting that need to know which buyer is tied to a given proposal or to reach out to them during the financing journey. Technical note - derived from the operational `cliente` table in the Atta raw MySQL database, with columns renamed to English and standardized types in the datalake_atta_clean schema.
columns:
  id_client:
    lineage:
    - datalake_atta_raw.cliente.id_cliente
    description: "Unique identifier of the client (buyer) in Atta. This is the primary key of this table and is referenced as a foreign key by other For Sale Atta clean tables, such as `proposal`, `pre_analysis`, and `financing_proposal` (via `id_client`), to identify the client associated with a home-financing proposal. Technical note: sourced from the auto-increment primary key `id_cliente` (bigint) of the raw `cliente` table."
  client_name:
    lineage:
    - datalake_atta_raw.cliente.nm_cliente
    description: Full legal name of the client (buyer) as registered in Atta, used to identify the person throughout the credit analysis and financing workflow and in client-facing communications. Technical note sourced from nm_cliente (varchar).
  client_cpf:
    lineage:
    - datalake_atta_raw.cliente.nr_cpf
    description: Brazilian individual taxpayer registry number (CPF) that uniquely identifies the client for credit bureau and background checks (e.g. SPC/Serasa) and for legal contract execution during the financing process. Technical note sourced from nr_cpf (bigint), stored as raw digits without a formatting mask.
  client_email:
    lineage:
    - datalake_atta_raw.cliente.nm_email
    description: Email address used to contact the client about financing proposal status updates, requested documents, and other communications during credit analysis and closing. Technical note sourced from nm_email (varchar).
  client_cellphone:
    lineage:
    - datalake_atta_raw.cliente.nr_celular
    description: Mobile phone number used to contact the client by call, SMS, or app notifications regarding their financing proposal. Technical note sourced from nr_celular (varchar), stored as free-text digits without a standardized mask.
  client_phone:
    lineage:
    - datalake_atta_raw.cliente.nr_telefone
    description: Alternate landline or secondary phone number registered for the client, used as a backup contact channel when the client cannot be reached on the mobile number. Technical note sourced from nr_telefone (varchar), stored as free-text digits without a standardized mask.
