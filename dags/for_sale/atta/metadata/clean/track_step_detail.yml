database_name: datalake_atta_clean
table_name: track_step_detail
domain: For Sale
owner: helder.rodrigues@quintoandar.com.br
description: |
  Cleaned configuration table describing the approval funnel (esteira) defined per
  financing product in the Atta platform, for For Sale home purchases. One row per
  (product, decision) combination, describing the resulting status and situation a
  proposal reaches when that decision is applied. Used as a reference/lookup table to
  translate the numeric id_proposal_status and id_proposal_situation codes found on the
  `proposal` table into the specific funnel step configured for each product, and to
  understand how many and which steps exist in a given product's approval pipeline.
  Foreign key id_product links to the `product_info` table. Sourced from the
  `produto_esteira` table in the Atta operational database.
columns:
  id:
    lineage:
    - datalake_atta_raw.produto_esteira.ID
    description: Surrogate primary key of the track step detail row, auto-incremented by the source system.
  id_product:
    lineage:
    - datalake_atta_raw.produto_esteira.IDProduto
    description: |
      Foreign key to the `product_info` table. Identifies the financing product whose
      approval funnel (esteira) configuration this row describes.
  decision_number:
    lineage:
    - datalake_atta_raw.produto_esteira.NrDecisao
    description: |
      Sequential decision number identifying a specific transition/checkpoint within the
      product's approval funnel; combined with id_product this defines a step of the
      workflow.
  proposal_status:
    lineage:
    - datalake_atta_raw.produto_esteira.Descricao
    description: |
      Human-readable, free-text label describing this workflow decision/step, as
      configured for the product in the Atta source application (e.g. the step's display
      name shown in the internal funnel/pipeline UI).
  id_proposal_status:
    lineage:
    - datalake_atta_raw.produto_esteira.PrxStatus
    description: |
      Code identifying the next funnel/approval-pipeline step (esteira) that a proposal
      of this product reaches after this decision. Encoded with the same STATUS_ISOLVE
      enum used by the `proposal` table's id_proposal_status column.
    categories:
      "1": PRE_ANALISE (pre-analysis)
      "2": CARTA_CREDITO (credit letter)
      "3": VISTORIA (property inspection)
      "4": CONTRATACAO (contracting)
      "5": CONTRATADO (contracted)
      "6": CHECKLIST (checklist)
      "7": CONF_EMISSAO (issuance confirmation)
      "8": DOCUMENTO_CADASTRO (registration document, legacy/unused)
      "9": DADOS_CADASTRO (registration data, legacy/unused)
      "10": COMISSAO_CADASTRO (commission registration, legacy/unused)
      "11": ASSINATURA_CONTRATO (contract signature, legacy/unused)
      "30": DOCUMENTO_ENVIADO_PARA_ASSINATURA (document sent for signature, legacy/unused)
      "31": DOCUMENTO_ASSINADO (document signed, legacy/unused)
      "32": CARTORIO (notary office)
  id_proposal_situation:
    lineage:
    - datalake_atta_raw.produto_esteira.Situacao
    description: |
      Code identifying the business situation (outcome) that a proposal of this product
      reaches after this decision. Encoded with the same SITUACAO_ISOLVE enum used by the
      `proposal` table's id_proposal_situation column.
    categories:
      "1": ANDAMENTO (in progress)
      "2": APROVADO (approved)
      "3": PENDENTE (pending)
      "4": REPROVADO (rejected)
      "5": CANCELADO (cancelled)
      "6": FINALIZADO (finalized)
      "7": EM_ANALISE (under analysis)
      "8": ANALISE_ATTA (under Atta internal analysis)
      "9": ANALISE_BANCO (under bank analysis)
      "10": ANALISE_BANCO_DUVIDA (bank analysis with pending question)
      "11": NAO_PASSIVEL_DEFESA (not eligible for appeal)
      "12": REVISAO (under revision)
      "13": NAO_PROCESSADO_BANCO (not processed by bank)
      "14": DIVERGENCIA_CADASTRO (registration data mismatch)
      "15": NOTAS_DE_EXIGENCIA (bank requirement notes pending)
      "16": CARTORIO_EXTERNO (external notary office)
      "17": APROVADO_CONDICIONADO (conditionally approved)
