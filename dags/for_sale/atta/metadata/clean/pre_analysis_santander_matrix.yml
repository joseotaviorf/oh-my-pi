database_name: datalake_atta_clean
table_name: pre_analysis_santander_matrix
domain: For Sale
owner: helder.rodrigues@quintoandar.com.br
description: Reference/configuration table that cross-maps equivalent credit-rating classifications between Itau, Bradesco and Santander, so ratings obtained from different banks during the credit pre-analysis process can be compared on a common scale to support choosing the best financing offer for the client. Static decision-matrix table with no direct relationship to individual client requests. Cleaned snapshot of consulta_score_santander_matriz_decisao sourced from the Atta operational database, standardized to datalake_atta_clean naming and types.
columns:
  id_pre_analysis_matrix:
    lineage:
    - datalake_atta_raw.consulta_score_santander_matriz_decisao.id
    description: Primary key identifying a row of the cross-bank rating decision matrix used in the credit pre-analysis process.
  itau:
    lineage:
    - datalake_atta_raw.consulta_score_santander_matriz_decisao.itau
    description: Itau rating code mapped as equivalent to the Bradesco and Santander ratings in this decision-matrix row, used to compare credit-rating results across banks when choosing the best financing offer.
  bradesco:
    lineage:
    - datalake_atta_raw.consulta_score_santander_matriz_decisao.bradesco
    description: Bradesco rating code mapped as equivalent to the Itau and Santander ratings in this decision-matrix row, used to compare credit-rating results across banks when choosing the best financing offer.
  santander:
    lineage:
    - datalake_atta_raw.consulta_score_santander_matriz_decisao.santander
    description: Santander rating code mapped as equivalent to the Itau and Bradesco ratings in this decision-matrix row, used to compare credit-rating results across banks when choosing the best financing offer.
