database_name: datalake_atta_clean
table_name: commission_revenue_share_params
description: This table contains information about the parameters of the revenue share commission.
domain: For Sale
owner: matheus.sampaio@quintoandar.com.br
columns:
  id_commission:
    description: Id of the commission.
    lineage:
      - datalake_atta_raw.commission_revenue_share_params.id
  id_period:
    description: Id of the period.
    lineage:
      - datalake_atta_raw.commission_revenue_share_params.PeriodId
  id_user_created:
    description: Id of the user who created the commission.
    lineage:
      - datalake_atta_raw.commission_revenue_share_params.CreatedByUserId
  bank_code:
    description: Code of the bank.
    lineage:
      - datalake_atta_raw.commission_revenue_share_params.Bank
  min_commission_value:
    description: The minimum commission value.
    lineage:
      - datalake_atta_raw.commission_revenue_share_params.MinValue
  max_commission_value:
    description: The maximum commission value.
    lineage:
      - datalake_atta_raw.commission_revenue_share_params.MaxValue
  total_commission_value:
    description: Total commission value.
    lineage:
      - datalake_atta_raw.commission_revenue_share_params.TotalComission
  pct_revenue_share_leads:
    description: Commission percentage to be received by the partner when the lead was generated by QuintoAndar.
    lineage:
      - datalake_atta_raw.commission_revenue_share_params.RevenueShareLeads
  pct_revenue_share_retail:
    description: Commission percentage to be received by the partner when the lead was not generated by QuintoAndar, i.e., it's retail.
    lineage:
      - datalake_atta_raw.commission_revenue_share_params.RevenueShareVarejo
  operation_type:
    description: Type of real estate credit operation.
    lineage:
      - datalake_atta_raw.commission_revenue_share_params.Product
  ts_created:
    description: Timestamp of when the commission was created.
    lineage:
      - datalake_atta_raw.commission_revenue_share_params.CreatedAt
