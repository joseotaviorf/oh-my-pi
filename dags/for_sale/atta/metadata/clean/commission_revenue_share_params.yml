database_name: datalake_atta_clean
table_name: commission_revenue_share_params
description: |
  Parameters governing revenue-share commission calculation for financing partners in
  the Atta platform, for a given commission period, bank, and product type, in For Sale
  home purchases. Each row defines a financing value bracket (min/max) and the
  resulting commission percentage split depending on lead origin (QuintoAndar-generated
  leads vs. retail/varejo origination). Used together with the commission revenue share
  period entity (via id_period) and `users_info` (via id_user_created) to compute
  partner/broker commissions on financing operations. Sourced from the
  `commission_revenue_share_params` table in the Atta operational database, cleaned
  with standardized names and types in datalake_atta_clean.
domain: For Sale
owner: helder.rodrigues@quintoandar.com.br
columns:
  id_commission:
    description: Primary key identifying the commission revenue share parameter record.
    lineage:
    - datalake_atta_raw.commission_revenue_share_params.id
  id_period:
    description: |
      Foreign key to the commission revenue share period entity that this parameter
      rule applies to.
    lineage:
    - datalake_atta_raw.commission_revenue_share_params.PeriodId
  id_user_created:
    description: |
      Foreign key to the `users_info` table. Identifies the user who created this
      commission revenue share parameter record.
    lineage:
    - datalake_atta_raw.commission_revenue_share_params.CreatedByUserId
  bank_code:
    description: |
      Banking partner this commission parameter rule applies to. Encoded with the
      FORNECEDORES enum from the Atta source application.
    categories:
      "0": TODOS (all suppliers, used for aggregate/broadcast operations)
      "1": ITAU
      "3": BRADESCO
      "5": SANTANDER
      "25": CAIXA
    lineage:
    - datalake_atta_raw.commission_revenue_share_params.Bank
  min_commission_value:
    description: |
      Minimum financing/operation value for which this commission rule applies, in
      Brazilian Reais.
    lineage:
    - datalake_atta_raw.commission_revenue_share_params.MinValue
  max_commission_value:
    description: |
      Maximum financing/operation value for which this commission rule applies, in
      Brazilian Reais.
    lineage:
    - datalake_atta_raw.commission_revenue_share_params.MaxValue
  total_commission_value:
    description: |
      Total commission amount calculated for partners within this value bracket, in
      Brazilian Reais.
    lineage:
    - datalake_atta_raw.commission_revenue_share_params.TotalComission
  pct_revenue_share_leads:
    description: |
      Percentage of the commission to be received by the partner when the lead was
      generated by QuintoAndar.
    lineage:
    - datalake_atta_raw.commission_revenue_share_params.RevenueShareLeads
  pct_revenue_share_retail:
    description: |
      Percentage of the commission to be received by the partner when the lead was not
      generated by QuintoAndar (retail/varejo origination).
    lineage:
    - datalake_atta_raw.commission_revenue_share_params.RevenueShareVarejo
  operation_type:
    description: |
      Type of real estate credit operation this commission rule applies to. Encoded
      with the PRODUTOS_ISOLVE enum from the Atta source application.
    categories:
      "11": CREDITO_IMOBILIARIO / ISOLADO / TRANSFERENCIA (mortgage credit / isolated / transfer operation)
      "15": REPASSE (loan assignment/transfer between institutions)
      "16": PILOTO (pilot operation)
      "20": PRE_ANALISE (pre-analysis)
      "23": CGI (CGI product)
      "24": SBPE (SBPE savings-funded financing)
      "25": FGTS_MCMV (FGTS / Minha Casa Minha Vida financing)
      "26": FGTS_PRO_COTISTA (FGTS Pro Cotista financing)
    lineage:
    - datalake_atta_raw.commission_revenue_share_params.Product
  ts_created:
    description: Timestamp when the commission revenue share parameter record was created.
    lineage:
    - datalake_atta_raw.commission_revenue_share_params.CreatedAt
