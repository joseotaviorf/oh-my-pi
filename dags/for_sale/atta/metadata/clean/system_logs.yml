database_name: datalake_atta_clean
table_name: system_logs
domain: For Sale
columns:
  id:
    lineage:
    - datalake_atta_raw.systemlogs.Id
    description: Surrogate primary key of the system logs row in the source system.
  id_user:
    lineage:
    - datalake_atta_raw.systemlogs.UserId
    description: Foreign key to the QuintoAndar user who performed the action.
  id_client:
    lineage:
    - datalake_atta_raw.systemlogs.ClientId
    description: Foreign key to the client master record in Atta or Sales Flow.
  topic:
    lineage:
    - datalake_atta_raw.systemlogs.Topic
    description: Topic or category label classifying the type of logged system event.
  agent:
    lineage:
    - datalake_atta_raw.systemlogs.Agent
    description: User-agent string of the client browser or device that originated the request.
  content:
    lineage:
    - datalake_atta_raw.systemlogs.Content
    description: Payload or message body describing the details of the logged event.
  ip_number:
    lineage:
    - datalake_atta_raw.systemlogs.IP
    description: IP address of the client that triggered the logged system event.
  request:
    lineage:
    - datalake_atta_raw.systemlogs.Request
    description: Request endpoint or action invoked that generated this log entry.
  ts_creation:
    lineage:
    - datalake_atta_raw.systemlogs.CreatedAt
    description: Timestamp when the system log event was recorded in the source platform.
  year:
    lineage:
    - datalake_atta_raw.systemlogs.year
    description: Partition year when the ETL run loaded this row into the lake table.
  month:
    lineage:
    - datalake_atta_raw.systemlogs.month
    description: Partition month when the ETL run loaded this row into the lake table.
  day:
    lineage:
    - datalake_atta_raw.systemlogs.day
    description: Partition day when the ETL run loaded this row into the lake table.
owner: helder.rodrigues@quintoandar.com.br
description: Cleaned snapshot of system logs sourced from operational systems backing Atta mortgage and financing platform data for For Sale home purchases. One row per system logs record with standardized names and types in datalake_atta_clean.
