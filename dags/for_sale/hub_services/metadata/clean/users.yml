database_name: datalake_hub_services_clean
table_name: users
description: With this table we have the information of users who passed through a hub. Since this is an incremental table, it must be filtered with a row_number to avoid duplicates.
domain: For Sale
owner: gabriel.firmino@quintoandar.com.br
columns:
  id:
    description: User's unique identifier within the services hub base.
    lineage:
      - datalake_hub_services_raw.users.id
  id_external:
    description: User identification key in the main, with this field we can match the hub_services data with the main bases.
    lineage:
      - datalake_hub_services_raw.users.external_id
  version:
    description: Record version, identifies which records are older or newer.
    lineage:
      - datalake_hub_services_raw.users.version
  name:
    description: Descriptive information about the username.
    lineage:
      - datalake_hub_services_raw.users.name
  email:
    description: Descriptive information about the user email.
    lineage:
      - datalake_hub_services_raw.users.email
  phone_number:
    description: Descriptive information about the user phone number.
    lineage:
      - datalake_hub_services_raw.users.phone_number
  ts_created:
    description: Date the region record was generated.
    lineage:
      - datalake_hub_services_raw.users.created_at
  ts_updated:
    description: Date the region record was updated.
    lineage:
      - datalake_hub_services_raw.users.updated_at
  year:
    description: Date year, used as table partition.
    lineage:
      - datalake_hub_services_raw.users.year
  month:
    description: Date month, used as table partition.
    lineage:
      - datalake_hub_services_raw.users.month
  day:
    description: Date day, used as table partition.
    lineage:
      - datalake_hub_services_raw.users.day
