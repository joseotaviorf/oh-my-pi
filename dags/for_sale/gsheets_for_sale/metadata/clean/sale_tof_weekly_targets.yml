database_name: datalake_gsheets_clean
table_name: sale_tof_weekly_targets
domain: For Sale
columns:
  city:
    lineage:
    - datalake_gsheets_raw.sale_tof_weekly_targets.city
    description: City the top-of-funnel target applies to.
  context:
    lineage:
    - datalake_gsheets_raw.sale_tof_weekly_targets.context
    description: Context or campaign grouping of the target.
  mkt_channel:
    lineage:
    - datalake_gsheets_raw.sale_tof_weekly_targets.mkt_channel
    description: Marketing channel of the segment.
  mkt_medium:
    lineage:
    - datalake_gsheets_raw.sale_tof_weekly_targets.mkt_medium
    description: Marketing medium of the segment.
  mkt_source:
    lineage:
    - datalake_gsheets_raw.sale_tof_weekly_targets.mkt_source
    description: Marketing source of the segment.
  tof_users_target:
    lineage:
    - datalake_gsheets_raw.sale_tof_weekly_targets.tof_users_target
    description: Target number of top-of-funnel users.
  week_start:
    lineage:
    - datalake_gsheets_raw.sale_tof_weekly_targets.week_start
    description: Start date of the week the target refers to.
  month:
    lineage:
    - datalake_gsheets_raw.sale_tof_weekly_targets.month
    description: Partition month when the ETL run loaded this row into the lake table.
  year:
    lineage:
    - datalake_gsheets_raw.sale_tof_weekly_targets.year
    description: Partition year when the ETL run loaded this row into the lake table.
owner: guilherme.rocha@quintoandar.com.br
description: Cleaned snapshot of sale tof weekly targets sourced from operational systems backing Google Sheets curated reference data maintained by the For Sale analytics team. One row per sale tof weekly targets record with standardized names and types in datalake_gsheets_clean.
