database_name: datalake_gsheets_clean
table_name: sale_demand_targets_2024
domain: For Sale
columns:
  city_group:
    description: City group the demand funnel target is planned for.
    lineage:
    - datalake_gsheets_raw.sale_demand_targets_retro.city_group
  hub_offer:
    description: Informs which associated hub the offer came from.
    lineage:
    - datalake_gsheets_raw.sale_demand_targets_retro.hub_offer
  visits_booked:
    description: Target volume of visits booked.
    lineage:
    - datalake_gsheets_raw.sale_demand_targets_retro.visits_booked
  visits_completed:
    description: Target volume of visits completed.
    lineage:
    - datalake_gsheets_raw.sale_demand_targets_retro.visits_completed
  offers_submitted:
    description: Target volume of offers submitted.
    lineage:
    - datalake_gsheets_raw.sale_demand_targets_retro.offers_submitted
  offers_accepted:
    description: Target volume of offers accepted.
    lineage:
    - datalake_gsheets_raw.sale_demand_targets_retro.offers_accepted
  ccv_signed:
    description: Target volume of contracts signed.
    lineage:
    - datalake_gsheets_raw.sale_demand_targets_retro.ccv_signed
  new_buyer_prospect:
    description: Target volume of new buyers prospects.
    lineage:
    - datalake_gsheets_raw.sale_demand_targets_retro.new_buyer_prospect
  recovered_buyer_prospect:
    description: Target volume of recovered buyers prospect.
    lineage:
    - datalake_gsheets_raw.sale_demand_targets_retro.recovered_buyer_prospect
  is_rede:
    description: Flag indicating whether the demand comes from the partner agency network (Rede).
    lineage:
    - datalake_gsheets_raw.sale_demand_targets_retro.is_rede
  dt_target:
    description: Calendar date of target for this sale demand targets 2024 record.
    lineage:
    - datalake_gsheets_raw.sale_demand_targets_retro.date
owner: guilherme.rocha@quintoandar.com.br
description: Cleaned snapshot of sale demand targets 2024 sourced from operational systems backing Google Sheets curated reference data maintained by the For Sale analytics team. One row per sale demand targets 2024 record with standardized names and types in datalake_gsheets_clean.
