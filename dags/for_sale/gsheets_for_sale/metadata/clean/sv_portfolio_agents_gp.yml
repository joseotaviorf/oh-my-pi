    - datalake_gsheets_raw.sv_portfolio_agents_gp.hub
  quartil_subhub:
    description: 'Performance ranking of the agent within their specific sub-hub, divided into quartiles (e.g., Q4 for top 25%).'
    lineage:
    - datalake_gsheets_raw.sv_portfolio_agents_gp.quartil_subhub
  agent_type:
    description: 'Classification of the agents tenure or profile, distinguishing between seasoned and recent members (e.g., "old" for veterans, "new" for juniors).'
    lineage:
    - datalake_gsheets_raw.sv_portfolio_agents_gp.type
  dt_reference:
    description: 'Reference date for the monthly performance snapshot. Typically set to the first day of the month (Format: YYYY-MM-DD).'
    lineage:
    - datalake_gsheets_raw.sv_portfolio_agents_gp.month_date
