database_name: datalake_gsheets_clean
table_name: sale_closing_ops_targets
domain: For Sale
columns:
  city_group:
    lineage:
    - datalake_gsheets_raw.sale_closing_ops_targets.city_group
    description: City group the closing-operations SLA target applies to.
  payment_method:
    lineage:
    - datalake_gsheets_raw.sale_closing_ops_targets.payment_method
    description: Buyer payment method the closing-operations SLA target is segmented by.
  metric_name:
