  planning_conversion:
    lineage:
    - datalake_gsheets_raw.sale_supply_targets_ticket_2025.planning_conversion
    description: Planning conversion grouping from the supply planning taxonomy used to organize the target.
  planning_operation:
    lineage:
    - datalake_gsheets_raw.sale_supply_targets_ticket_2025.planning_operation
    description: Planning operation grouping from the supply planning taxonomy used to organize the target.
