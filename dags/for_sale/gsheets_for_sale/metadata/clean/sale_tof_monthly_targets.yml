database_name: datalake_gsheets_clean
table_name: sale_tof_monthly_targets
domain: For Sale
columns:
  city_group:
    lineage:
    - datalake_gsheets_raw.sale_tof_monthly_targets.city_group
    description: City group the top-of-funnel target applies to.
  context:
    lineage:
    - datalake_gsheets_raw.sale_tof_monthly_targets.context
    description: Context or campaign grouping of the target.
  mkt_channel:
    lineage:
    - datalake_gsheets_raw.sale_tof_monthly_targets.mkt_channel
    description: Marketing channel of the segment.
  mkt_medium:
    lineage:
    - datalake_gsheets_raw.sale_tof_monthly_targets.mkt_medium
    description: Marketing medium of the segment.
  mkt_source:
    lineage:
    - datalake_gsheets_raw.sale_tof_monthly_targets.mkt_source
    description: Marketing source of the segment.
  tof_users_target:
    lineage:
    - datalake_gsheets_raw.sale_tof_monthly_targets.tof_users_target
    description: Target number of top-of-funnel users.
  month_start:
    lineage:
    - datalake_gsheets_raw.sale_tof_monthly_targets.month_start
    description: Start month of the period the target refers to.
  month:
    lineage:
    - datalake_gsheets_raw.sale_tof_monthly_targets.month
    description: Partition month when the ETL run loaded this row into the lake table.
  year:
    lineage:
    - datalake_gsheets_raw.sale_tof_monthly_targets.year
    description: Partition year when the ETL run loaded this row into the lake table.
owner: guilherme.rocha@quintoandar.com.br
description: Cleaned snapshot of sale tof monthly targets sourced from operational systems backing Google Sheets curated reference data maintained by the For Sale analytics team. One row per sale tof monthly targets record with standardized names and types in datalake_gsheets_clean.
