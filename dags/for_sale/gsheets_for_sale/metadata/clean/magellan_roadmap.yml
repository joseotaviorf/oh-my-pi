---
database_name: datalake_gsheets_clean
table_name: magellan_roadmap
owner: guilherme.rocha@quintoandar.com.br
domain: For Sale
description: Table with the roadmap of the Magellan project, sourced from a curated Google Sheet, with one row per planned task and its schedule.
columns:
  task:
    description: Description of the roadmap task or initiative to be delivered.
    lineage:
    - datalake_gsheets_raw.magellan_roadmap.task
  owner:
    description: Person or team responsible for delivering the roadmap task.
    lineage:
    - datalake_gsheets_raw.magellan_roadmap.owner
  status:
    description: Current delivery status of the roadmap task.
    lineage:
    - datalake_gsheets_raw.magellan_roadmap.status
  type:
    description: Type or category of the roadmap task.
    lineage:
    - datalake_gsheets_raw.magellan_roadmap.type
  duration:
    description: Planned duration of the task in days.
    lineage:
    - datalake_gsheets_raw.magellan_roadmap.INT(duration)
  affected_service:
    description: Service or system affected by the roadmap task.
    lineage:
    - datalake_gsheets_raw.magellan_roadmap.affected_service
  dt_start:
    description: Planned start date of the roadmap task.
    lineage:
    - datalake_gsheets_raw.magellan_roadmap.DATE(start_date)
  dt_end:
    description: Planned end date of the roadmap task.
    lineage:
    - datalake_gsheets_raw.magellan_roadmap.DATE(end_date)
  notes:
    description: Free-text notes or comments about the roadmap task.
    lineage:
    - datalake_gsheets_raw.magellan_roadmap.notes
