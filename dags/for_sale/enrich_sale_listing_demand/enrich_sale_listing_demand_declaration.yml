---
dag:
  name: enrich_sale_listing_demand
  schedule_start_date: 2020, 8, 29
  owner: Data ForSale
  documentation:
    dag_purpose: This dag is responsible for enriching and grouping demand information
      about sale listings, such as first sales flow, first booking, first offer, total
      offers, and others.
workflow:
  type: query_delta
  layer: enrich
cluster:
  type: databricks_12_2_med_general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
