dag:
  name: dw_sale_available_booking_hours
  schedule_start_date: 2020,8,6
  owner: Data ForSale
workflow:
  type: query_delta
  layer: dw
  custom_schema: sale
  default_extraction_type: full
  tables_customization:
    fact_daily_listings_available_hours:
      extraction_type: incremental
      partitions: [year, month, day]
      extra_query_template_params:
        load_start_date: "{{ get_date_param(dag_run, ds, 'load_start_date') }}"
        load_end_date: "{{ get_date_param(dag_run, ds, 'load_end_date') }}"
cluster:
  type: databricks_12_2_min_memory_cluster
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE
