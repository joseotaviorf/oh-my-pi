database_name: datalake_legaut
table_name: legaut_crawlers_kr
domain: For Sale
owner: helder.rodrigues@quintoandar.com.br
description: >-
  Enriched Legaut crawler run/key-result table for Due Diligence document automation,
  combining upstream clean and warehouse sources. One row per crawler run (id_crawler), joined
  to the crawled unit/operation (meusite_unit), its project, location (meusite_city/meusite_state)
  and delivered document (meusite_document), and labeled through the crawler-type reference
  catalog (crawlers_crawlertype). Legaut has no column shared with the other For Sale enrich
  tables in this repo — the property/offer a crawler run relates to is only identifiable
  through the ids embedded in link_imovel_analise/link_imovel_imoveis, not a joinable key. The
  Due Diligence milestones Legaut produces surface conceptually (without a shared join key) in
  enrich_sale_offer_flows.sale_offer_flows and enrich_sale_closing_flows.closing_flow as
  dt_legaut_analysis_started/dt_legaut_analysis_ended, both sourced from
  datalake_sales_flow_clean.diligence.ts_partner_started/ts_partner_ended.
columns:
  id_crawler:
    lineage:
    - datalake_legaut_clean.crawlers_crawler.id
    description: Identifier of the Legaut crawler run that produced this key result row.
  link_imovel_analise:
    lineage:
    - datalake_legaut_clean.crawlers_crawler.id_unit
    description: URL to the property analysis page on Legaut, built from the crawler unit id.
  link_imovel_imoveis:
    lineage:
    - datalake_legaut_clean.meusite_unit.id_operation
    description: URL to the property building page on Legaut imoveis, built from the operation id.
  crawler_type:
    lineage:
    - datalake_legaut_clean.crawlers_crawler.type
    description: Foreign key to crawlers_crawlertype.value. Identifies which document or legal pendency type the crawler collects (e.g. property registration certificate, debt clearance certificate). The catalog of type codes and their metadata is maintained in the crawlers_crawlertype table; see crawler_type_label for the human-readable name.
  crawler_state:
    lineage:
    - datalake_legaut_clean.meusite_state.name
    description: Name of the state where the crawled property is located.
  crawler_city:
    lineage:
    - datalake_legaut_clean.meusite_city.name
    description: Name of the city where the crawled property is located.
  project:
    lineage:
    - datalake_legaut_clean.meusite_project.name
    description: Name of the Legaut project the crawled unit belongs to.
  crawler_type_label:
    lineage:
    - datalake_legaut_clean.crawlers_crawlertype.label
    description: Human-readable label describing the crawler type.
  crawler_status:
    lineage:
    - datalake_legaut_clean.crawlers_crawler.status
    description: Current execution status of the crawler run, stored as an integer code defined in the Legaut Crawler model.
    categories:
      "0": "Failed: the crawler failed to execute."
      "1": "Running: the crawler is currently executing."
      "2": "Completed: the crawler finished execution successfully."
      "3": "Manual: the result was submitted manually instead of by an automated run."
      "4": "Manual (via other crawler): the result was submitted manually through another crawler."
      "5": "Waiting for info: the crawler is waiting for additional information to proceed."
      "6": "Killed: the crawler process was terminated."
  document:
    lineage:
    - datalake_legaut_clean.meusite_document.file_name
    description: File name of the document delivered by the crawler for the property.
  ts_operation_created:
    lineage:
    - datalake_legaut_clean.meusite_unit.ts_created
    description: Timestamp when the Legaut operation (unit) was created.
  ts_operation_delivered:
    lineage:
    - datalake_legaut_clean.meusite_unit.ts_delivered
    description: Timestamp when the Legaut operation (unit) was delivered.
  ts_document_delivered:
    lineage:
    - datalake_legaut_clean.meusite_document.ts_delivered
    description: Timestamp when the crawled document was delivered.
  ts_crawler_run_deleted:
    lineage:
    - datalake_legaut_clean.crawlers_crawler.ts_run_deleted
    description: Timestamp when the crawler run was deleted, if it was removed.
  ts_crawler_run_start:
    lineage:
    - datalake_legaut_clean.crawlers_crawler.ts_run_start
    description: Timestamp when the crawler run started.
  ts_crawler_run_end:
    lineage:
    - datalake_legaut_clean.crawlers_crawler.ts_run_end
    description: Timestamp when the crawler run finished.
