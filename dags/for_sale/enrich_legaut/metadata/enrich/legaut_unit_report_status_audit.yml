---
database_name: datalake_legaut
table_name: legaut_unit_report_status_audit
description: History of Legaut Unit report_status changes with actor email for product and operations analytics in Superset.
domain: For Sale
owner: wesley.gomes@quintoandar.com.br
columns:
  id_audit_log_entry:
    lineage:
      - datalake_legaut_clean.auditlog_logentry.id
    description: Identifier of the underlying django-auditlog row in the clean layer.
  id_unit:
    lineage:
      - datalake_legaut_clean.auditlog_logentry.object_id
    description: Legaut Unit primary key whose report_status changed.
  ts_report_status_changed:
    lineage:
      - datalake_legaut_clean.auditlog_logentry.ts_audit
    description: Timestamp when the audit log entry was recorded (change time in Legaut).
  audit_action:
    lineage:
      - datalake_legaut_clean.auditlog_logentry.audit_action
    description: Audit action code; filtered to updates (value 1) in this table.
  email_actor:
    lineage:
      - datalake_legaut_clean.accounts_user.email
    description: Business email of the Legaut user who changed report_status; treated as non-confidential for operational analytics and Superset (aligned with clean accounts_user.email).
  report_status_previous:
    lineage:
      - datalake_legaut_clean.auditlog_logentry.changes
    description: Previous report_status value as string (django-auditlog JSON array element 0).
  report_status_new:
    lineage:
      - datalake_legaut_clean.auditlog_logentry.changes
    description: New report_status value as string (django-auditlog JSON array element 1).
  changes_json:
    lineage:
      - datalake_legaut_clean.auditlog_logentry.changes
    description: Full JSON changes payload for the audit row when additional fields changed in the same event.
  app_label:
    lineage:
      - datalake_legaut_clean.django_content_type.app_label
    description: Django app label for the model (meusite for Unit).
  content_model:
    lineage:
      - datalake_legaut_clean.django_content_type.content_model
    description: Django model name (unit for Unit rows).
