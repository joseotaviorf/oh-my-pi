    lineage:
      - datalake_mortgage_management_service_raw.credit_proposal_crawler_job_aud.fields_filled
  version:
    description: "Row optimistic-locking version number, as observed at this audit revision."
    lineage:
      - datalake_mortgage_management_service_raw.credit_proposal_crawler_job_aud.version
  mod_id_credit_proposal_reference:
    description: "Envers flag indicating whether credit_proposal_reference_id changed in this revision."
    lineage:
