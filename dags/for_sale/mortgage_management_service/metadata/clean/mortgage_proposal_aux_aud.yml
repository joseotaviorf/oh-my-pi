---
database_name: datalake_mortgage_management_service_clean
table_name: mortgage_proposal_aux_aud
owner: helder.rodrigues@quintoandar.com.br
domain: For Sale
description: "Historical audit trail of mortgage_proposal_aux: one row per revision of the bridge linking a mortgage intention to its legacy Atta proposal and pre-analysis records, enabling point-in-time reconstruction of when the mortgage application, proposal, and pre-analysis identifiers were attached. Technical: Hibernate Envers audit table using the ValidityAuditStrategy, so each revision also records when it stopped being valid (rev_end); joins to revinfo via rev for who/what made the change."
columns:
  id:
    description: "Identifier of the auxiliary row that was revised, matching mortgage_proposal_aux.id."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_proposal_aux_aud.id
  rev:
    description: "Envers revision identifier linking this audit row to the revinfo metadata table in the source database."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_proposal_aux_aud.rev
  rev_type:
    description: "Envers revision type code for the row change (0=insert, 1=update, 2=delete)."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_proposal_aux_aud.revtype
  rev_end:
    description: "Revision at which this audit snapshot was superseded by a later change, marking the end of its validity period (Envers ValidityAuditStrategy)."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_proposal_aux_aud.revend
  id_mortgage_intention:
    description: "Foreign key to the parent mortgage_intention, as observed at this audit revision."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_proposal_aux_aud.mortgage_intention_id
  id_mortgage_application:
    description: "Foreign key to the local mortgage_application, as observed at this audit revision (see mortgage_proposal_aux.id_mortgage_application)."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_proposal_aux_aud.mortgage_application_id
  id_proposal_reference:
    description: "External proposal reference in the legacy Atta system, as observed at this audit revision."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_proposal_aux_aud.proposal_reference_id
  id_pre_analysis_reference:
    description: "External pre-analysis reference in the legacy Atta system, as observed at this audit revision."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_proposal_aux_aud.pre_analysis_reference_id
  version:
    description: "Row optimistic-locking version number, as observed at this audit revision."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_proposal_aux_aud.version
  mod_id_mortgage_intention:
    description: "Envers flag indicating whether mortgage_intention_id changed in this revision."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_proposal_aux_aud.mortgage_intention_id_mod
  mod_id_mortgage_application:
    description: "Envers flag indicating whether mortgage_application_id changed in this revision."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_proposal_aux_aud.mortgage_application_id_mod
  mod_id_proposal_reference:
    description: "Envers flag indicating whether proposal_reference_id changed in this revision."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_proposal_aux_aud.proposal_reference_id_mod
  mod_id_pre_analysis_reference:
    description: "Envers flag indicating whether pre_analysis_reference_id changed in this revision."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_proposal_aux_aud.pre_analysis_reference_id_mod
  mod_version:
    description: "Envers flag indicating whether version changed in this revision."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_proposal_aux_aud.version_mod
  mod_ts_created:
    description: "Envers flag indicating whether created_at changed in this revision."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_proposal_aux_aud.created_at_mod
  mod_ts_updated:
    description: "Envers flag indicating whether updated_at changed in this revision."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_proposal_aux_aud.updated_at_mod
  ts_created:
    description: "Row creation timestamp, as observed at this audit revision."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_proposal_aux_aud.created_at
  ts_updated:
    description: "Row last-update timestamp, as observed at this audit revision."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_proposal_aux_aud.updated_at
  year:
    description: "Partition year of the CDC audit row ingested into the data lake raw layer."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_proposal_aux_aud.year
  month:
    description: "Partition month of the CDC audit row ingested into the data lake raw layer."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_proposal_aux_aud.month
  day:
    description: "Partition day of the CDC audit row ingested into the data lake raw layer."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_proposal_aux_aud.day
