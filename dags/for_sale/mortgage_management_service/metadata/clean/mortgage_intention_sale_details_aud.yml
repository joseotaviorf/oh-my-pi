---
database_name: datalake_mortgage_management_service_clean
table_name: mortgage_intention_sale_details_aud
owner: helder.rodrigues@quintoandar.com.br
domain: For Sale
description: "Historical audit trail of mortgage_intention_sale_details: one row per revision of a mortgage intention's post-contract sale details (sale reference, inspection companion contact), enabling point-in-time reconstruction of how those details evolved. Technical: Hibernate Envers audit table using the ValidityAuditStrategy, so each revision also records when it stopped being valid (rev_end); joins to revinfo via rev for who/what made the change."
columns:
  id:
    description: "Identifier of the sale details row that was revised, matching mortgage_intention_sale_details.id."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_intention_sale_details_aud.id
  rev:
    description: "Envers revision identifier linking this audit row to the revinfo metadata table in the source database."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_intention_sale_details_aud.rev
  rev_type:
    description: "Envers revision type code for the row change (0=insert, 1=update, 2=delete)."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_intention_sale_details_aud.revtype
  rev_end:
    description: "Revision at which this audit snapshot was superseded by a later change, marking the end of its validity period (Envers ValidityAuditStrategy)."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_intention_sale_details_aud.revend
  id_mortgage_intention:
    description: "Foreign key to the parent mortgage_intention, as observed at this audit revision."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_intention_sale_details_aud.mortgage_intention_id
  sale_reference_id:
    description: "External sale offer reference (see mortgage_intention_sale_details.sale_reference_id), as observed at this audit revision."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_intention_sale_details_aud.sale_reference_id
  inspection_companion_person_name:
    description: "Name of the property inspection companion, as observed at this audit revision."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_intention_sale_details_aud.inspection_companion_name
  inspection_companion_phone_number:
    description: "Phone number of the property inspection companion, as observed at this audit revision."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_intention_sale_details_aud.inspection_companion_phone
  version:
    description: "Row optimistic-locking version number, as observed at this audit revision."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_intention_sale_details_aud.version
  mod_id_mortgage_intention:
    description: "Envers flag indicating whether mortgage_intention_id changed in this revision."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_intention_sale_details_aud.mortgage_intention_id_mod
  mod_sale_reference_id:
    description: "Envers flag indicating whether sale_reference_id changed in this revision."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_intention_sale_details_aud.sale_reference_id_mod
  mod_inspection_companion_person_name:
    description: "Envers flag indicating whether inspection_companion_name changed in this revision."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_intention_sale_details_aud.inspection_companion_name_mod
  mod_inspection_companion_phone_number:
    description: "Envers flag indicating whether inspection_companion_phone changed in this revision."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_intention_sale_details_aud.inspection_companion_phone_mod
  mod_version:
    description: "Envers flag indicating whether version changed in this revision."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_intention_sale_details_aud.version_mod
  mod_ts_created:
    description: "Envers flag indicating whether created_at changed in this revision."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_intention_sale_details_aud.created_at_mod
  mod_ts_updated:
    description: "Envers flag indicating whether updated_at changed in this revision."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_intention_sale_details_aud.updated_at_mod
  ts_created:
    description: "Row creation timestamp, as observed at this audit revision."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_intention_sale_details_aud.created_at
  ts_updated:
    description: "Row last-update timestamp, as observed at this audit revision."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_intention_sale_details_aud.updated_at
  year:
    description: "Partition year of the CDC audit row ingested into the data lake raw layer."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_intention_sale_details_aud.year
  month:
    description: "Partition month of the CDC audit row ingested into the data lake raw layer."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_intention_sale_details_aud.month
  day:
    description: "Partition day of the CDC audit row ingested into the data lake raw layer."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_intention_sale_details_aud.day
