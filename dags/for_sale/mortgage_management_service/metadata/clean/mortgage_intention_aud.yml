---
database_name: datalake_mortgage_management_service_clean
table_name: mortgage_intention_aud
owner: thiago.bueno@quintoandar.com.br
domain: For Sale
description: "Audit table for mortgage_intention, tracking all historical changes made to mortgage intention records using Hibernate Envers for audit trail purposes."
columns:
  id:
    description: "Primary key of the mortgage intention row that was revised, matching mortgage_intention.id."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_intention_aud.id
  rev:
    description: "Envers revision identifier linking this audit row to the revinfo metadata table in the source database."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_intention_aud.rev
  rev_type:
    description: "Envers revision type code for the row change, such as insert, update, or delete, as defined by Envers (0=insert, 1=update, 2=delete)."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_intention_aud.revtype
  rev_end:
    description: "Envers revision at which this audit snapshot was superseded, when the source records end of validity."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_intention_aud.revend
  uuid_mortgage_intention:
    description: "Business UUID of the mortgage intention as observed at this audit revision."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_intention_aud.mortgage_intention_uuid
  uuid_person:
    description: "Person UUID associated with the mortgage intention as observed at this audit revision."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_intention_aud.person_uuid
  source_name:
