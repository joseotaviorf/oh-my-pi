---
database_name: datalake_mortgage_management_service_clean
table_name: mortgage_proposal_aux
owner: helder.rodrigues@quintoandar.com.br
domain: For Sale
description: "Linkage/bridge table connecting the new Mortgage Management Service (MMS) to the legacy Atta system during their coexistence and migration period, mapping a mortgage intention (and, once created, its mortgage application) to the corresponding proposal ('proposta') and pre-analysis records in Atta. Ensures operational continuity and data integrity while both systems are active. One row per mortgage intention (grain = one bridge record per intention); the mortgage application and proposal reference fields start empty and are populated as the process advances. Technical: CDC-replicated clean copy of the mortgage_proposal_aux table from the Mortgage Management Service (MMS) operational database."
columns:
  id:
    description: "Primary key that uniquely identifies the mortgage proposal auxiliary row. Technical: primary key of the row in the source service database."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_proposal_aux.id
  id_mortgage_intention:
    description: "Foreign key to mortgage_intention.id identifying the mortgage intention this bridge record links to its Atta counterpart."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_proposal_aux.mortgage_intention_id
  id_mortgage_application:
    description: "Foreign key to the local mortgage_application table, populated once a formal bank credit application exists for this intention; null while only a pre-analysis or intention exists."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_proposal_aux.mortgage_application_id
  id_proposal_reference:
    description: "Identifier of the corresponding proposal ('proposta') in the legacy Atta system, populated once a proposal has been created there. Technical: external reference to Atta (not a local foreign key); unique when populated."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_proposal_aux.proposal_reference_id
  id_pre_analysis_reference:
    description: "Identifier of the corresponding pre-analysis record in the legacy Atta system — the preliminary credit-eligibility check performed before or alongside a full proposal. Technical: external reference to Atta, not a local foreign key."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_proposal_aux.pre_analysis_reference_id
  version:
    description: "Optimistic locking version counter maintained by the application for this row."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_proposal_aux.version
  ts_created:
    description: "Timestamp when this auxiliary row was first created in the operational database."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_proposal_aux.created_at
  ts_updated:
    description: "Timestamp of the last update applied to this auxiliary row in the operational database."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_proposal_aux.updated_at
  year:
    description: "Partition year of the CDC snapshot row ingested into the data lake raw layer."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_proposal_aux.year
  month:
    description: "Partition month of the CDC snapshot row ingested into the data lake raw layer."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_proposal_aux.month
  day:
    description: "Partition day of the CDC snapshot row ingested into the data lake raw layer."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_proposal_aux.day
