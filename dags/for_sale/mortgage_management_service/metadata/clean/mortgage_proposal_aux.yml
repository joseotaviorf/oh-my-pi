---
database_name: datalake_mortgage_management_service_clean
table_name: mortgage_proposal_aux
owner: thiago.bueno@quintoandar.com.br
domain: For Sale
description: "Auxiliary bridge between a mortgage intention, optional mortgage application, and external proposal or pre-analysis identifiers in Mortgage Management Service."
columns:
  id:
    description: "Primary key of the mortgage proposal auxiliary row in the source service database."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_proposal_aux.id
  id_mortgage_intention:
    description: "Foreign key to the mortgage_intention that this auxiliary proposal metadata extends."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_proposal_aux.mortgage_intention_id
  id_mortgage_application:
    description: "Optional foreign key to mortgage_application when a formal application exists for this intention."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_proposal_aux.mortgage_application_id
  id_proposal_reference:
    description: "External proposal identifier from upstream sales or credit systems, unique when populated."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_proposal_aux.proposal_reference_id
  id_pre_analysis_reference:
    description: "External pre-analysis identifier linking to an upstream credit or underwriting workflow."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_proposal_aux.pre_analysis_reference_id
  version:
    description: "Optimistic locking version counter maintained by the application for this row."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_proposal_aux.version
  ts_created:
    description: "Timestamp when this auxiliary row was first created in the operational database."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_proposal_aux.created_at
  ts_updated:
    description: "Timestamp of the last update applied to this auxiliary row in the operational database."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_proposal_aux.updated_at
  year:
    description: "Partition year of the CDC snapshot row ingested into the data lake raw layer."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_proposal_aux.year
  month:
    description: "Partition month of the CDC snapshot row ingested into the data lake raw layer."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_proposal_aux.month
  day:
    description: "Partition day of the CDC snapshot row ingested into the data lake raw layer."
    lineage:
      - datalake_mortgage_management_service_raw.mortgage_proposal_aux.day
