database_name: datalake_legalops_clean
table_name: lego_analysis_results
domain: For Sale
owner: helder.rodrigues@quintoandar.com.br
description: |
  Table with LegoContract assessment results, exploded from the full_analysis JSON. Each row represents one assessment within a contract analysis request (each contract analysis have many different assessments), enabling tracking of validation results by assessment type over time.
columns:
  id_contract_analysis_job:
    description: Identifier of the contract analysis job execution that produced this assessment result. Joins with id_contract_analysis_job from datalake_legalops_clean.contract_analysis_request.
    lineage:
    - datalake_legalops_raw.contract_analysis_request.contract_analysis_job_id
  id_sales_flow:
    description: Foreign key to the sales flow associated with this contract analysis. Joins with all id_sales_flow from datalake_sales_flow_clean tables.
    lineage:
    - datalake_legalops_raw.contract_analysis_request.id_sales_flow
  analysis_date:
    description: Date when the contract analysis request was created.
    lineage:
    - datalake_legalops_raw.contract_analysis_request.ts_created
  request_source:
    description: >
      Origin of the contract analysis request, extracted as a string from
      analysis_metadata.request_source. Known values: screening-contract-requested,
      screening-analyst-request-on-demand, screening-autonomous-post-apply,
      docs-collection. NULL when analysis_metadata is absent or the key is missing
      (no backfill for historical jobs).
    lineage:
    - datalake_legalops_raw.contract_analysis_request.analysis_metadata
  validation_id:
    description: Identifier of the Rule ID of the validation associated with this assessment (e.g. B01, SL01, HA12, H05). Comes from nested json attribute validation_id
    lineage:
    - datalake_legalops_raw.contract_analysis_request.full_analysis
  assessment_name:
    description: Name of the assessment for the given valudation evaluated by LegoContract (e.g. house_address_number, is_non_residential_suspicion, seller_is_house_holder).  Comes from nested json attribute assessment_name
    lineage:
    - datalake_legalops_raw.contract_analysis_request.full_analysis
  assessment_status:
    description: Status of the individual assessment returned by LegoContract (e.g. MATCH, CHECK_PASS, CHECK_WARNING, DIFFERENT). Comes from nested json attribute assessment_status
    lineage:
    - datalake_legalops_raw.contract_analysis_request.full_analysis
  assessment_consolidated_status:
    description: >
      Final status of the assessment. Possible values: OK, ACTION_NEEDED, or UNAVAILABLE.
      UNAVAILABLE means the assessment could not produce a conclusive result. Typical causes:
      (1) Out of scope (OUT_OF_SCOPE) — scope rules (B00, SL00, NG00) determined the validation does not apply
      (e.g. PJ buyer/seller, 0 or 2+ parties in legacy flow, non-single marital status, stable union,
      FGTS/consortium payment method); dependent rules then emit BLOCKED assessments, also UNAVAILABLE.
      (2) Missing inputs — MISSING_SALES_FLOW_VALUE (buyer name, email, civil status not filled in sales flow)
      or MISSING_EXTRACTION_VALUE (document value absent for comparison/extraction rules).
      (3) Extraction problems — LOW_QUALITY_EXTRACTION (ID document lacks required fields),
      CONTENT_FILTER_REFUSED (Docpilot OCR refused by content filter); note that NOT_EXTRACTED maps to
      ACTION_NEEDED, not UNAVAILABLE.
      (4) Execution failures — BLOCKED (a blocking_dependencies check failed, e.g. D03 blocked because D01
      did not return FOUND) or ERROR (unhandled exception in validate(); all assessments for that rule get ERROR).
      (5) CCV clause ambiguity — TOO_MANY_CLAUSES (more than one CCV line matched the same subject).
    lineage:
    - datalake_legalops_raw.contract_analysis_request.full_analysis
  assessment_confidence:
    description: Confidence level of the validation assessment indicates if the validation has HIGH/LOW/MEDIUM confidence in its result.
    lineage:
    - datalake_legalops_raw.contract_analysis_request.full_analysis
  ts_analysis_started:
    description: Timestamp when the contract analysis job started processing the request in LegoContract.
    lineage:
    - datalake_legalops_raw.contract_analysis_request.analysis_started_at
  ts_analysis_end:
    description: Timestamp when the contract analysis job finished processing the request in LegoContract.
    lineage:
    - datalake_legalops_raw.contract_analysis_request.analysis_ended_at
