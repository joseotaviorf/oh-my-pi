dag:
  name: legalops_custom
  schedule_start_date: 2026, 6, 15
  schedule_interval: 0 23 * * *
  owner: Data ForSale
  documentation:
    dag_purpose: |
      CLEAN DAG that unpacks LegoContract JSON from
      datalake_legalops_raw.contract_analysis_request into
      lego_analysis_results, reading source year/month/day between
      load_start_date and load_end_date and MERGEing on analysis_date.
      lego_backtest_results is a full reload of
      datalake_legalops_raw.lego_backtest_results (no date partition on
      the target, so incremental MERGE is not used).
workflow:
  type: query_delta
  layer: clean
  custom_schema: legalops
  default_extraction_type: incremental
  default_partitions: []
  tables_customization:
    lego_analysis_results:
      merge_on:
        - id_contract_analysis_job
        - validation_id
        - assessment_name
        - analysis_date
      run_optimize: false
      run_vacuum: true
    lego_backtest_results:
      extraction_type: full
      run_optimize: false
      run_vacuum: true
