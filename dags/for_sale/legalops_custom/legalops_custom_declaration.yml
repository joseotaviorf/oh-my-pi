dag:
  name: legalops_custom
  schedule_start_date: 2026, 6, 15
  schedule_interval: 0 23 * * *
  owner: Data ForSale
  documentation:
    dag_purpose: |
      CLEAN DAG that unpacks LegoContract JSON from
      datalake_legalops_raw.contract_analysis_request into
      lego_analysis_results.
workflow:
  type: query_delta
  layer: clean
  custom_schema: legalops
  tables_customization:
    lego_analysis_results:
      run_optimize: false
      run_vacuum: true
    lego_backtest_results:
      run_optimize: false
      run_vacuum: true
