---
dag:
  name: enrich_booking
  schedule_start_date: 2020, 7, 1
  owner: Data ForSale
  documentation:
    dag_purpose: |
      Creates the enriched tables for the context `Booking` enriched from EBDB and gsheets.
      It'll track the user journey end to end with information about all booking status, changes, and the tenants.
      This DAG is triggered by Mediator and loads the table via full load.
workflow:
  type: query_delta
  layer: enrich
cluster:
  type: databricks_12_2_min_2xlarge_memory_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
