database_name: datalake_booking
table_name: booking
description: This table contains information about booking and is the main source
  for the dim_booking. Here, id is a PK and we have only one booking per line.
domain: For Sale
owner: data-for-sale@quintoandar.com.br
columns:
  id:
    lineage:
    - datalake_ebdb_clean.booking.id
    description: Its the PK for this table and the identifier of bookings. Must be
      unique.
  id_country:
    lineage:
    - datalake_ebdb_listing.house.id_country
    description: Country identifier.
  id_rescheduled_booking:
    lineage:
    - datalake_ebdb_clean.booking.id_rescheduled_booking
    description: Reschedling identifier.
  id_visitor:
    lineage:
    - datalake_ebdb_clean.booking.id_visitor
    description: Id of user making the visit.
  id_visit:
    lineage:
    - datalake_ebdb_clean.booking.id_visit
    description: Key of visit.
  id_user_creation:
    lineage:
    - datalake_ebdb_clean.visit_status_log.id_author_user
    - datalake_ebdb_clean.booking.id_attendant
    - datalake_ebdb_clean.booking_status_change.id_user
    description: An identifier for who had created the booking.
  id_user_cancelation:
    lineage:
    - datalake_ebdb_clean.user_revision_entity.id_user
    description: An identifier for who had cancelled the booking for the first time.
      Its value can be NULL and in this case the cancellation was made by an automatic
      process.
  id_house:
    lineage:
    - datalake_ebdb_clean.booking.id_house
    description: Key of property/house.
  id_agent:
    lineage:
    - datalake_ebdb_clean.booking.id_agent
    description: Key of user agent.
  id_user_sale_agent:
    lineage:
    - datalake_ebdb_clean.user.id
    description: Key of agent attending Sales
  id_attendant:
    lineage:
    - datalake_ebdb_clean.booking.id_attendant
    description: The user ID (sk_user) of the user who booked this visit, but only
      if the booking was created by a QuintoAndar agent or a QuintoAndar employee,
      and not by the visitor himself
  id_user_sale_attendence_5a:
    lineage:
    - datalake_hub_services.secretariat_hierarchy.id_user_5a
    description: User id of the secretary who created the booking.
  id_user_secretariat_on_visit_date:
    lineage:
    - datalake_hub_services.buyer_secretariat_changes.id_external_responsible
    description: User id of the Sales secretary who was responsible for the buyer during the visit date.
  id_user_last_secretariat:
    lineage:
    - datalake_hub_services.buyer_secretariat_changes.id_external_responsible
    description: User id of the last Sales secretary responsible for the buyer.
  id_rent_flow:
    lineage:
    - datalake_ebdb_clean.booking.id_rent_flow
    description: Key of rental flow
  id_sale_flow:
    lineage:
    - datalake_ebdb_clean.booking.id_visitor
    - datalake_ebdb_clean.booking.id_house
    description: Key of sale flow
  id_real_estate_agent_rating:
    lineage:
    - datalake_ebdb_clean.visit.id_real_estate_agent_rating
    description: Id of buyer review of the agent for that booking
  id_sale_fixed_agent:
    lineage:
    - datalake_ebdb_clean.preferred_fixed_agent.id_agent_data
    description: Id of the fixed agent if the business context = sale
  id_company_supply:
    lineage:
    - datalake_ebdb_listing.house.id_company_hubspot
    description: Id of the supply partner in HubSpot
  uuid_company_supply:
    lineage:
    - datalake_ebdb_listing.house.uuid_company
    description: UUID of the supply partner in the company domain
  id_company_demand:
    lineage:
    - datalake_ebdb_work_contract.work_contract.id_company_hubspot
    description: Id of the demand partner
  id_schedule:
    lineage:
      - datalake_ebdb_clean.booking.id_schedule
    description: Scheduling identification key in the schedules database.
  country_code:
    lineage:
    - datalake_ebdb_listing.house.country_code
    description: Country code of the booking
    categories:
      BR: Brazil's country code
      MX: Mexico's country code
  default_timezone:
    lineage:
    - datalake_ebdb_clean.country.default_timezone
    description: Default timezone referring to the country where the visit was booked.
  dt_booking:
    lineage:
    - datalake_ebdb_clean.booking.dt_booking
    description: Date of booking on UTC.
  status:
    lineage:
    - datalake_ebdb_clean.booking.status
    description: Gives the booking status, for exemple to show if the visit is canceled
      or not
    categories:
      AguardandoConfirmacao: Waiting for tenant to confirm visit (only required for
        visits booked at least 48 hours in advance)
      Cancelado: Visit was canceled
      Marcado: Visit is scheduled
      Realizado: Visit was completed
  visit_intent:
    lineage:
    - datalake_ebdb_clean.booking.business_context
    description: Lists the visitors intention for this visit (if he was looking to
      rent or buy the property)
    categories:
      RENT: A booking related to the ForRent context, rent intention
      SALE: A booking related to the ForSale context, buyer intention
  buyer_intention:
    lineage:
    - datalake_ebdb_clean.booking.buyer_intention
    description: Lists the buyers intention for the property (if the person was buying to live in the property or as an investment)
    categories:
      INVESTMENT_FOR_RENT: If the intention of buying the property is to rent it out later.
      INVESTMENT_OTHER: If the purchase of the property is for investment.
      LIVING: If the purchase is for living in the property after the purchase.
  type:
    lineage:
    - datalake_ebdb_clean.booking.type
    description: What type of booking it is Visit, Photo Session, Inspection
    categories:
      CheckUpLar: ''
      SessaoFotos: ''
      Visita: ''
      Vistoria: ''
      VistoriaQuarteirizada: '#N/A'
  visit_fup:
    lineage:
    - datalake_ebdb_clean.booking.visit_fup
    description: Agent visit follow up answered on agent app
    categories:
      EntradaNaoAutorizada: ''
      ImovelAlugado: ''
      NaoCompareceu: ''
      NaoGostou: ''
      Talvez: ''
      VaiNegociar: ''
      VisitouSozinho: ''
  checkin_code:
    lineage:
      - datalake_ebdb_clean.booking.visit_checkin
    description: Buyer checkin code.
    categories:
      FAILED: ''
      PENDING: ''
      COMPLETED: ''
  checkin_fail_reason:
    lineage:
      - datalake_ebdb_clean.booking.checkin_fail_reason
    description: Checkin fail reason
  checkin_fail_commentary:
    lineage:
      - datalake_ebdb_clean.booking.checkin_fail_commentary
    description: Checkin fail commentary made by the agent in the app.
  visit_checkin_status:
    lineage:
      - datalake_ebdb_clean.booking.checkin_status
    description: Checkin status
  slot_day:
    lineage:
    - datalake_ebdb_clean.booking.slot_day
    description: Gives the slot to visit schedulled hour
  checkin_status:
    lineage:
    - datalake_ebdb_clean.booking.checkin_status
    description: Show status of whatsapp confirmation of visit. Only visits booked
      2 days or more in advance need a whatsapp confirmation
  user_creation_email:
    lineage:
    - datalake_ebdb_user.user.email
    description: Email from who had created the booking.
  last_update_source:
    lineage:
    - datalake_ebdb_clean.visit_origin.name
    description: Show origin of last source to alter the booking
  first_update_source:
    lineage:
    - datalake_ebdb_clean.visit_origin.name
    description: Shows the origin from the booking, self service web, booked by agent
  first_cancelation_source:
    lineage:
      - datalake_ebdb_clean.visit_origin.name
    description: Shows the source of the exact action where the cancellation of the visit occurred.
  is_visit_created_from_app:
    lineage:
    - datalake_ebdb_clean.visit_origin.is_app
    description: Boolean column that indicates if the visit was created in any of the different applications (Corretores, Inquilinos, Proprietarios,  Vistoriadores, Porfolio, MagicLink). True if it was.
  is_visit_last_updated_from_app:
    lineage:
    - datalake_ebdb_clean.visit_origin.is_app
    description: Boolean column that indicates if the last update on that visit came from any of the different applications (Corretores, Inquilinos, Proprietarios, Vistoriadores, Porfolio, MagicLink). True if it was.
  code:
    lineage:
    - datalake_ebdb_clean.visit.code
    description: Unique string code with 8 characters generated for each visit
  last_status_change_reason:
    lineage:
    - datalake_ebdb_clean.booking_status_change.reason
    description: Gives the last reason why the status changed
  last_status_change_reason_enum:
    lineage:
    - datalake_ebdb_clean.booking_status_change.reason_enum
    description: Gives the last reason why the status changed when not automatically as an enum
  last_status_change_reason_category:
    lineage:
    - datalake_ebdb_clean.appointment_change_reason_category.name
    description: Shows the type of user responsible for the change in the appointment
    categories:
      Tenant: ''
      Agent: ''
      Owner: ''
      Other: ''
      Inspector: ''
      Internal: ''
  tenant_absence_reason:
    lineage:
    - datalake_ebdb_clean.visitor.absence_reason
    description: '[Deprecated] Describes the reason why visitor did not show up (by agent app follow up).'
  agent_absence_reason:
    lineage:
    - datalake_ebdb_clean.visitor.absence_reason
    description: '[Deprecated] Describes the reason why agent did not show up (by agent app follow up).'
  landlord_absence_reason:
    lineage:
    - datalake_ebdb_clean.visitor.absence_reason
    description: Describes the reason why owner did not show up
  troublesome_entrance_problem:
    lineage:
    - datalake_ebdb_clean.entrance.problem
    description: If it was not possible to enter the property to visit (succesful_entrance = 0), then this column lists the reason why it was not possible to enter.
    categories:
      Allowed: The visit was allowed
      BrokenLockbox: The lockbox was damaged and the visit could not be completed
      BuildingAsOkAuthorizationListRequired: It was necessary to align the visit with the condominium/building and it was not possible to complete the visit
      DamagedKeys: The keys were damaged and it was not possible to enter the listing
      DidntGetKeys: The keys were not delivered by the person in charge for the visit to be complete
      KeysKeeperNotPresent: The person responsible for the keys to the listing did not show up for the visit
      KeysNotAvailable: The keys were not available for the visit
      LandlordNoShow: The owner did not show up for the visit
      LockboxProblems: Lockbox related problems and the visit could not be completed
      MissplacedKeys: The keys were missplaced
      NameNotInTheList: Some of the parties involved in the visit did not have permission to enter the listing
      NoCollectiveAuthorization: Some of the parties involved in the visit did not have permission to enter the listing
      NoEntrancePermission: He was not allowed to enter the listing.'
      NoIndividualAuthorization: Some of the parties involved in the visit did not have permission to enter the listing
      NoKeysLockbox: The keys were not in the lockbox and the visit cannot be compelled
      NoLockbox: Not having lockbox once the visit cannot be completed
      None: Booking with no troublesome or unknown troublesome
      NotAllowed: The visit was not allowed for some unspecified reason
      OwnerQuitAnnouncement: The owner has given up listing
      PropertyNorForRent: Listing was actually not for rent
      PropertyNotForSale: Listing was actually not for sale
      Rented: The listing was already rented
      RentedByAnotherCompany: The listing has been rented on another platform or real estate agent
      RentedOrLandlordQuitRenting: Rented or owner has given up putting the listing up for rent
      ResidentTenantDidntAllowVisit: Current tenant did not allow listing to be visited
      ResidentTenantDidntKnowVisit: Current tenant did not know that the listing would be visited
      SoldByAnotherCompany: The listing was sold by another platform or real estate company
      TemporarilyUnavailable: The listing is temporarily unavailable
      TenantDelay: The tenant was delaye
      VisitOffAllowedHours: The visit was outside the available visiting hours
      WrongAddress: The listing address was incorrect
      WrongPassword: The password for the electronic lock entered was incorrect
  cancellation_reason:
    lineage:
    - datalake_ebdb_clean.booking_status_change.reason_enum
    description: Reason for the booking cancellation as in this sheets
    categories:
      AGENT_REQUESTED_VISIT_FROM_QUEUE: ''
      AGENT_SCHEDULE_REALIZED: ''
      AGENT_TRANSFER: ''
      BAD_SCHEDULING: '#N/A'
      BUG_IN_INSPECTION_APP: '#N/A'
      CANCELED_AGENT_CAN_NOT_ATTEND: Corretor avisa que não conseguirá comparecer
        cx ou pelo app de corretor com motivo 'Não poderei comparecer na visita'
      CANCELED_AGENT_CAN_NOT_JOIN: Corretor cancela pelo app com o motivo "Não poderei
        comparecer à visita"
      CANCELED_AGENT_DEACTIVATED: Corretor descredenciado
      CANCELED_AGENT_LATE_POOL: Corretor cancela visita subsequente à pool por atraso
        na visita pool, pelo app com motivo 'Visita em grupo atrasou e não será possível
        chegar na próxima visita'
      CANCELED_AGENT_VISIT_TOO_FAR: Corretor cancela pelo app com o motivo "Visita
        agendada em local muito longe"
      CANCELED_AUTOMATICALLY_PROPERTY_UNPUBLISHED: Imóvel despublicado
      CANCELED_BLOCKED_SCHEDULE: Visita agendada em horário bloqueado na agenda do
        corretor e cancelada pelo app com motivo 'Agenda estava bloqueada e entrou
        uma visita'
      CANCELED_BY_OWNER_FROM_APP: PP cancelamento via PWA
      CANCELED_BY_OWNER_FROM_LINK: ''
      CANCELED_BY_PHOTOGRAPHER_FROM_APP: '#N/A'
      CANCELED_BY_TENANT_CAN_NOT_ATTEND: Inquilino não comparecerá na visita mas ainda
        tem interesse no imóvel
      CANCELED_BY_TENANT_FROM_APP: Todos cancelamentos vindos do PWA
      CANCELED_BY_TENANT_FROM_CHECK_IN: Inquilino cancela via link do check-in
      CANCELED_BY_TENANT_NOT_BUYING: ''
      CANCELED_BY_TENANT_NOT_BUYING_BY_5A: ''
      CANCELED_BY_TENANT_NOT_INTERESTED: Inquilino não tem mais interesse no imóvel
        mas continua procurando um imóvel
      CANCELED_BY_TENANT_NOT_RENTING: Inquilino não está mais procurando imóveis
      CANCELED_BY_TENANT_NOT_RENTING_BY_5A: Inquilino não quer mais alugar pelo QuintoAndar
      CANCELED_BY_TENANT_OTHER_REASON: Inquilino não quer alugar por outro motivo,
        escrito manualmente
      CANCELED_CANT_FIND_ANOTHER_AGENT: Corretor descredenciado, e não se aloca outro
        corretor para o booking, gerando o cancelamento
      CANCELED_CHECKIN_NOT_DONE: Inquilino não confirmou a visita via check in
      CANCELED_CLIENT_CAN_NOT_ATTEND: Corretor cancela pelo app com o motivo "Cliente
        não poderá comparecer"
      CANCELED_CLIENT_GAVE_UP: Cancelamento por ligação ao CX ou pelo app do corretor
        com motivo "Cliente desistiu da visita"
      CANCELED_CLIENT_GAVE_UP_APARTMENT: Não quer mais alugar atendimento CX
      CANCELED_CLIENT_IS_REPAIRING_HOUSE: '#N/A'
      CANCELED_CLIENT_IS_STILL_IN_PROPERTY: '#N/A'
      CANCELED_CLIENT_NOT_BUYING: ''
      CANCELED_CLIENT_NOT_RENTING: Inquilino liga por CX avisando que não tem mais
        intenção de alugar o apartamento
      CANCELED_CLIENT_NOT_RENTING_OR_BUYING: ''
      CANCELED_CONTRACT_CANCELED: ''
      CANCELED_HOUSE_INACCESSIBLE: ''
      CANCELED_HOUSE_OCCUPIED: ''
      CANCELED_HOUSE_REPAIRING: ''
      CANCELED_HOUSE_RESERVED: Reserva do Imóvel derruba todas as visitas
      CANCELED_INCORRECT_SCHEDULE: Corretor cancela pelo app com o motivo "Cliente
        agendou incorretamente"
      CANCELED_INSPECTOR_CAN_NOT_ATTEND_INSPECTION: '#N/A'
      CANCELED_INSPECTOR_WITHOUT_KEYS: '#N/A'
      CANCELED_OTHER_CLIENT: cancelamento via CX sem razão especificada
      CANCELED_OTHER_INSPECTOR: ''
      CANCELED_OTHER_OWNER: PP cancela sem motivo explicitado
      CANCELED_OWNER_CAN_NOT_ATTEND: Proprietário não poderá ir à visita cancelado
        pelo corretor via app com motivo 'Proprietário não poderá comparecer'
      CANCELED_OWNER_CAN_NOT_ATTEND_INSPECTION: Imóvel suspenso por gestão de consequência
        do pp
      CANCELED_OWNER_CONSEQUENCE_MANAGEMENT: Imóvel suspenso por gestão de consequência
        do pp
      CANCELED_OWNER_CONSEQUENCE_MANAGEMENT_SUSPENDED: Proprietário não responde as
        offers e é despublicado, "gestão de consequências"
      CANCELED_OWNER_DID_NOT_ATTEND: '#N/A'
      CANCELED_OWNER_EXEMPTED_INSPECTION: '#N/A'
      CANCELED_OWNER_IS_REPAIRING_HOUSE: '#N/A'
      CANCELED_OWNER_NOT_RENTING: Proprietário desistiu de alugar
      CANCELED_OWNER_NO_RETURN_NEGOTIATIONS: ''
      CANCELED_OWNER_PROPERTY_ALREADY_RENTED_5A: Proprietário já alugou o Imóvel pelo
        5A
      CANCELED_OWNER_PROPERTY_ALREADY_RENTED_OTHER: Proprietário já alugou o Imóvel
        por fora do 5A
      CANCELED_OWNER_SUSPENDED: Imóvel suspenso por gestão de consequência do pp
      CANCELED_OWNER_UNREACHABLE: Quando liga para confirmar a visita, o proprietário
        não atende em imóveis onde o PP acompanha
      CANCELED_OWNER_UNREACHABLE_UNPUBLISHED: Quando liga para confirmar se o imóvel
        ainda está disponível, o proprietário não atende e por isso há despublicação
      CANCELED_PROBLEM_INSPECTOR: ''
      CANCELED_PROBLEM_OWNER_OR_TENANT_OR_HOUSE: ''
      CANCELED_PROPERTY_SUSPENDED_ADVANCED_NEGOTIATIONS: Negociação avançada
      CANCELED_PROPERTY_SUSPENDED_UNAVAILABLE: Imóvel suspenso cancelado pelo app
        do corretor com o motivo 'Imóvel indisponível e/ou já alugado'
      CANCELED_PROPERTY_UNAVAILABLE: Imóvel despublicado
      CANCELED_RELOCATION: ''
      CANCELED_RELOCATION_BY_BUG: ''
      CANCELED_REQUEST_BY_OWNER_OR_TENANT: ''
      CANCELED_SCHEDULED_OTHER_TIME: O corretor cancela a visita do inquilino com
        o motivo 'Visita realizada em outro horário'
      CANCELED_SELF_SERVICE_PARTIAL: Não é mais utilizado
      CANCELED_TENANT_CAN_NOT_ATTEND_INSPECTION: ''
      EXPECTED_TERMINATION_DATE_CHANGE: ''
      INSPECTOR_BLOCKED_SCHEDULE: '#N/A'
      KEY_HOLDER_AGENT_NOT_AVAILABLE: '#N/A'
      OTHER: ''
      PROPERTY_UNPUBLISHED: ''
      RECYCLE_OLDER_INSPECTION: '#N/A'
      REPORTED_BY_PHOTOGRAPHER: ''
      REPURPOSE_BECAUSE_OF_BUG: '#N/A'
      RESCHEDULING_BY_HIGHER_PRIORITY_INSPECTION: '#N/A'
      RESCHEDULING_CONTRACT: '#N/A'
      RESCHEDULING_HOUSEFUL: '#N/A'
      SCHEDULE_CHANGE: ''
  cancellation_reason_category:
    lineage:
    - datalake_ebdb_clean.booking_status_change.reason_enum
    description: Cancelation category as in the sheets above
    categories:
      Agent: The agent cancelled the booking
      Consequence Management: The booking was cancelled because the owner was suspended
        because of "consequence management" reasons
      House Reserved: The house was reserved by a tenant, thus cancelling all bookings
        automatically
      House Suspended: ''
      House Unlisted: ''
      Other: ''
      Owner: ''
      Reschedule_Agent: The booking was rescheduled by the agent
      Reschedule_Tenant: The booking was rescheduled by the tenant
      Tenant: The tenant cancelled the booking
      Unknown: ''
  owner_missing_reason:
    lineage:
    - datalake_ebdb_clean.entrance.problem
    description: '[Deprecated] Describes the reason why owner did not show up (by agent app follow up).'
  reason_category:
    lineage:
    - datalake_gsheets_clean.from_to_cancellation.new_reason
    - datalake_ebdb_clean.visit_origin.name
    - datalake_ebdb_clean.booking_status_change.reason_enum
    - datalake_ebdb_clean.appointment_change_reason_category.name
    description: '[Deprecated] Gives the reason why visit was cancelled'
    categories:
      Advanced negotiation: ''
      Agent: ''
      Consequence Management: ''
      House Reserved: ''
      Inspector: ''
      Overbooking: ''
      Owner: ''
      Reschedule: ''
      Tenant: ''
      Unknown: ''
      Unlisted: ''
      Unlisted apartment: ''
  partner_3p_demand:
    lineage:
    - datalake_ebdb_work_contract.work_contract.3p_partner
    description: Column with the name of partner who brought the visitor, if the listing has the is_3p_demand flag.
  partner_3p_supply:
    lineage:
    - datalake_ebdb_listing.house.partner_3p_supply
    description: Column with the name of QuintoAndar real estate partner, if the listing has the is_3p_supply flag.
  ts_visit_fup:
    lineage:
    - datalake_ebdb_clean.booking.ts_visit_fup
    description: Date of visit follow up in Brazilian timezone
  ts_created:
    lineage:
    - datalake_ebdb_clean.booking.ts_created
    description: Datetime of the booking creation.
  ts_updated:
    lineage:
    - datalake_ebdb_clean.booking.ts_updated
    description: Datetime of the booking updating.
  ts_first_canceled:
    lineage:
    - datalake_ebdb_clean.user_revision_entity.ts_revision
    description: Datetime of the first cancellation.
  ts_first_canceled_unevaluated:
    lineage:
    - datalake_ebdb_clean.user_revision_entity.ts_revision
    description: Date time of the first cancelation even if the date time is greater than the dt_booking
  ts_booking_local_tz:
    lineage:
    - datalake_ebdb_clean.booking.dt_booking
    - datalake_ebdb_clean.booking.slot_day
    description: Datetime of the booking date on local timezone, based on the country of the booking.
  ts_created_local_tz:
    lineage:
    - datalake_ebdb_clean.booking.ts_created
    description: Datetime of visit creation on local timezone, based on the country of the booking.
  ts_visit_follow_up_local_tz:
    lineage:
    - datalake_ebdb_clean.booking.ts_visit_fup
    description: Datetime of the agent fup on local timezone, based on the country of the booking.
  is_confirmed:
    lineage:
    - datalake_ebdb_clean.booking.is_confirmed
    description: Boolean column to identify if the visit is confirmed or not. True if it is. On most cases as soon as a Visit is booked it is already confirmed, if it meets these rules 1.The house is not Third Party 2.The date of the scheduling is within the period in which the property is available 3. The house does not have any entry restrictions - the house has entry restrictions if it needs an entry authorization 4. The date of the schedule is after the date of the schedule creation
  is_closed:
    lineage:
    - datalake_ebdb_clean.booking.is_closed
    description: '[Deprecated] This column is not used anymore.'
  is_agent_fixed:
    lineage:
    - datalake_ebdb_clean.booking.is_agent_fixed
    description: Boolean column that identifies whether an agent has been fixed/assigned to the booking. This agent may or may not be the PFA.
  is_3p_supply_5a:
    lineage:
    - datalake_ebdb_listing.house.is_3p_supply_5a
    description: Boolean column that identifies if the listing is from a real estate partner (Rede Supply) of QuintoAndar.
  is_3p_supply_bh:
    lineage:
    - datalake_ebdb_listing.house.is_3p_supply_bh
    description: Boolean column that points if the listing is from a real estate partner (Rede Supply) in Belo Horizonte.
  is_virtual_visit:
    lineage:
    - datalake_ebdb_clean.follow_up_details.visit_type
    description: Boolean column to identify if the visit occurred virtually, i.e. visit_type = 'Video'
  is_entrance_successful:
    lineage:
    - datalake_ebdb_clean.entrance.is_successful
    description: Boolean column to identify if the agent and tenant were able to enter the house
  is_canceled:
    lineage:
    - datalake_ebdb_clean.booking.status
    description: Boolean column to identify if the visit is Canceled
  is_sale_visit:
    lineage:
    - datalake_ebdb_clean.booking.business_context
    description: Boolean column to identify if the business context for that visit is Sale
  is_inspection:
    lineage:
    - datalake_ebdb_clean.booking.type
    description: Boolean column to identify if the visit is of "Vistoria" type
  is_visit:
    lineage:
    - datalake_ebdb_clean.booking.type
    description: Boolean column to identify if the visit is of "Visita" type
  is_photo_session:
    lineage:
    - datalake_ebdb_clean.booking.type
    description: Boolean column to identify if the visit is of "SessaoFotos" type
  is_visit_performed:
    lineage:
    - datalake_ebdb_clean.booking.visit_fup
    - datalake_ebdb_clean.visitor.absence_reason
    description: Boolean column to identify if the agent filled the visit_fup but was absent at that visit.
  is_via_reschedule:
    lineage:
    - datalake_ebdb_clean.booking.id_rescheduled_booking
    description: Boolean column indicating if the visit has been rescheduled. True when this booking came from another booking as a reschedule.
  has_reschedule:
    lineage:
    - datalake_ebdb_clean.booking.id_rescheduled_booking
    description: Boolean column indicating if the visit has been rescheduled. True if it was cancelled to be reschedule.
  has_tenant_attended:
    lineage:
    - datalake_ebdb_clean.visitor.has_attended
    description: Boolean column to identify if the visitor appeared at the visit. True if attended.
  has_agent_attended:
    lineage:
    - datalake_ebdb_clean.visitor.has_attended
    description: Boolean column to identify if the agent appeared at the visit. True if attended.
  has_landlord_attended:
    lineage:
    - datalake_ebdb_clean.visitor.has_attended
    description: Boolean column to identify if the owner appeared at the visit where the rule is visitor_type = 'Landlord' and has attended = true from the table datalake_ebdb_clean.visitor
  has_owner_arrived:
    lineage:
    - datalake_ebdb_clean.entrance.problem
    description: Boolean column to identify if the owner appeared at the visit where the rule is if the entrance problem <> 'LandlordNoShow then true
  is_first_booking_auto:
    lineage:
    - datalake_ebdb_clean.booking_status_change.id_user
    description: Boolean column to identify if the booking was originally created through planner (program that allocates 5A personnel to inspections and jobs). True if the visit originated via planner flow.
  ts_booking_utc:
    lineage:
    - datalake_ebdb_clean.booking.dt_booking
    - datalake_ebdb_clean.booking.slot_day
    description: Date of when visit was scheduled on UTC.
  ts_first_canceled_local_tz:
    lineage:
    - datalake_ebdb_clean.user_revision_entity.ts_revision
    description: Date of visit cancelation on local timezone, based on the country of the booking.
  ts_first_canceled_unevaluated_local_tz:
    lineage:
    - datalake_ebdb_clean.user_revision_entity.ts_revision
    description: Timestamp of the cancellation time, referring to the timezone of the country in which the visit was booked.
  responsible:
    lineage:
    - datalake_ebdb_clean.booking_status_change.reason_enum
    description: Shows who cancelled the visit
    categories:
      Other: ''
      Owner: Cancelled by owner
      QuintoAndar: Cancelled by QuintoAndar, includes agents, consequence management,
        reservation, suspension, and unlisting
      Reschedule: Rescheduled by agent or tenant
      Tenant: Cancelled by tenant
      Unknown: ''
  app_type:
    lineage:
      - datalake_amplitude_visit.amplitude_visit.app_type
      - datalake_tracked_events.attribution_cross_channel.final_attribution_app_type
    description: >
      App used to book the visit.
    categories:
      Android: >
        ''
      Web: >
        ''
      amp: >
        ''
      android: >
        ''
      android_flutter: >
        ''
      backend: >
        ''
      iOS: >
        ''
      ios: >
        ''
      offline_table: >
        ''
      twa: >
        ''
      web_desktop: >
        ''
      web_mobile: >
        ''
  media_source:
    lineage:
      - datalake_amplitude_visit.amplitude_visit.media_source
      - datalake_tracked_events.attribution_cross_channel.final_attribution_media_source
    description: >
      Type of media source from which comes the booking.
  utm_source:
    lineage:
      - datalake_amplitude_visit.amplitude_visit.utm_source
      - datalake_tracked_events.attribution_cross_channel.final_attribution_source
    description: >
      UTM (a parameter added to the destination URL) used to track the advertising source.
  utm_medium:
    lineage:
      - datalake_amplitude_visit.amplitude_visit.utm_medium
      - datalake_tracked_events.attribution_cross_channel.final_attribution_medium
    description: >
      UTM (a parameter added to the destination URL) used to track the advertising medium.
  utm_campaign:
    lineage:
      - datalake_amplitude_visit.amplitude_visit.utm_campaign
      - datalake_tracked_events.attribution_cross_channel.final_attribution_campaign
    description: >
      UTM (a parameter added to the destination URL) used to identify the campaign in the media.
  utm_content:
    lineage:
      - datalake_amplitude_visit.amplitude_visit.utm_content
      - datalake_tracked_events.attribution_cross_channel.final_attribution_content
    description: >
      Identifies what specifically was clicked to bring the user to the site, such as a banner ad or a text link. It is often used for A/B testing and content-targeted ads.
  utm_term:
    lineage:
      - datalake_amplitude_visit.amplitude_visit.utm_term
      - datalake_tracked_events.attribution_cross_channel.final_attribution_term
    description: >
      Identifies search terms that brought the lead.
  final_attribution_origin:
    lineage:
      - datalake_tracked_events.attribution_cross_channel.final_attribution_origin
    description: >
      Final attribution origin of the booking.
    categories:
      App: >
        ''
      CX: >
        ''
      Secretaria: >
        ''
      Web: >
        ''
      old_attribution: >
        ''
  days_visit_booked_to_visit_cancelled:
    lineage:
    - datalake_ebdb_clean.user_revision_entity.ts_revision
    - datalake_ebdb_clean.booking.ts_created
    description: Number of days between the creation of the booking to the cancellation of the booking
  days_visit_cancelled_to_visit:
    lineage:
    - datalake_ebdb_clean.user_revision_entity.ts_revision
    - datalake_ebdb_clean.booking.dt_booking
    - datalake_ebdb_clean.booking.slot_day
    description: Number of days between the cancellation of the visit and the date the booking was scheduled for.
  days_visit_booked_to_visit:
    lineage:
    - datalake_ebdb_clean.booking.dt_booking
    - datalake_ebdb_clean.booking.slot_day
    - datalake_ebdb_clean.booking.ts_created
    description: Number of days between the creation of the booking and the date it was scheduled for.
  days_visit_booked_to_visit_completed:
    lineage:
    - datalake_ebdb_clean.booking.dt_booking
    - datalake_ebdb_clean.booking.slot_day
    - datalake_ebdb_clean.booking.ts_created
    description: Number of days between the creation of the booking and the date it was scheduled for, but only for completed visits
  user_sale_booking_creator:
    description: Identifies the type of user who created the sale booking
    categories:
      None: ''
      Admin/CX: ''
      Agent: ''
      Buyer: ''
      Other: ''
      Secretaria: ''
  hub_agent_region:
    description: If the agent is working under the HUB type of contract, it shows the region of the HUB it is allocated
  is_hub_flow:
    description: Boolean column indicating if the agent of that visit is working under the HUB flow. True if it is.
  is_3p_demand:
    description: Boolean column that identifies if the visitor came from a QuintoAndar demand partner.
  is_3p_supply:
    description: Boolean column that identifies if the listing is from a real estate partner (Rede Supply). Regardless if it is from QuintoAndar or CasaMineira.
  is_visit_completed:
    description: Boolean column indicating if he visit was completed by the visitor. The confirmation event is not registered yet.
  is_house_rented:
    description: Boolean column indicating if the sale visit was scheduled on a house that was rented inside QuintoAndar by the time the visit was scheduled to happen
  ts_checkin:
    lineage:
    - datalake_ebdb_clean.visit_checkin.ts_checkin
    description: Checkin timestamp
