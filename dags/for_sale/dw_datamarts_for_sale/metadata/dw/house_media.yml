---
database_name: dw_datamarts
table_name: house_media
owner: gustavo.miller@quintoandar.com.br
domain: Rede
description: Every row in this datamart corresponds to a house that has at least one video or 360 photo.
columns:
  id_house:
    lineage:
      - datalake_kodak_clean.video.id_external_domain
      - datalake_kodak_clean.photo_sphere.id_external_domain
    description: House id
  number_of_videos:
    description: Number of videos for this house
  number_of_360_photos:
    description: Number of 360 photos for this house
  description_360_photos:
    lineage:
      - datalake_kodak_clean.photo_sphere.metadata
    description: Description of the 360 photos for this house, in the format of an array. For example, [quarto,sale,sala]
  ts_video_last_updated:
    lineage:
      - datalake_kodak_clean.user_revision_entity.ts_revised
    description: Timestamp of the last video update for this house
  ts_360_photos_last_updated:
    lineage:
      - datalake_kodak_clean.user_revision_entity.ts_revised
    description: Timestamp of the last 360 photo update for this house
  ts_load:
    description: Timestamp when the data was loaded into the datamart
