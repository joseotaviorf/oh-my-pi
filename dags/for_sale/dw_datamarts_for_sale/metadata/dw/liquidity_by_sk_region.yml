database_name: dw_datamarts_for_sale
table_name: liquidity_by_sk_region
description: Liquidity metrics (days house listing to contract signed) by QuintoAndar  sk_region
domain: For Sale
owner: bernardo.loureiro@quintoandar.com.br
columns:
  city_group:
    lineage:
      - dw_public.dim_region.city_group
    description: The city group for this region code
    categories:
      Belo Horizonte: ''
      Brasília: ''
      Campinas: ''
      Cotia: '#N/A'
      Curitiba: ''
      Florianópolis: ''
      Goiânia: ''
      Mogi das Cruzes: '#N/A'
      Porto Alegre: ''
      RMSP: ''
      Recife: '#N/A'
      Ribeirão Preto: '#N/A'
      Rio de Janeiro: ''
      Salvador: '#N/A'
      Santos: '#N/A'
      Sorocaba: '#N/A'
      São José dos Campos: '#N/A'
      Vitória: '#N/A'
  region_code:
    lineage:
      - dw_public.dim_region.region_code
    description: The region code this region is in
  sk_region:
    lineage:
      - dw_public.dim_region.sk_region
    description: The ID for this QuintoAndar region
  min_bedrooms:
    lineage:
      - dw_public.dim_house_listing.house_bedrooms
    description: The min number of bedrooms for listings in this house_bedrooms_category
  max_bedrooms:
    lineage:
      - dw_public.dim_house_listing.house_bedrooms
    description: The max number of bedrooms for listings in this house_bedrooms_category
  average_days_house_listing_to_contract_signed:
    description: The average number of days from house listing to contract signed
  average_days_house_listing_to_contract_signed_error:
    description: The average number of days from house listing to contract signed
      (absolute error)
  average_days_house_listing_to_contract_signed_interval:
    description: The average number of days from house listing to contract signed
      (range considering error)
  house_bedrooms_category:
    description: A categorized bucket by the number of house bedrooms in the listing
    categories:
      1-2: ''
      4+: ''
  listings_sample_size:
    description: How many listings were considered in the sample for the calculations
  median_days_house_listing_to_contract_signed:
    description: The median number of days from house listing to contract signed
  percent_rented_in_6_weeks:
    description: The percent of listings that were rented in 6 weeks or less
  percent_rented_in_6_weeks_error:
    description: The percent of listings that were rented in 6 weeks or less (absolute
      error)
  percent_rented_in_6_weeks_error_level:
    description: The percent of listings that were rented in 6 weeks or less (how
      high is the error)
    categories:
      high: ''
      low: ''
      medium: ''
  percent_rented_in_6_weeks_interval:
    description: The percent of listings that were rented in 6 weeks or less (range
      considering error)
  rented_in_6_weeks:
    description: How many listings were rented in 6 weeks or less
  ts_load:
    description: Date when data was loaded
