database_name: dw_datamarts_for_sale
table_name: dim_house_listing_amenities
description: Table that maps all listings with their respective amenities and installations
  (condo amenities). It brings the most recently itens and house condition checked
  by the photographer
domain: For Sale
owner: data-for-sale@quintoandar.com.br
columns:
  id_house:
    lineage:
    - datalake_ebdb_clean.info_amenities.id_house
    - datalake_ebdb_clean.house_maintenance_condition.id_house
    description: The house's unique ID, for joining with the dim_house_lisitng table
  house_condition:
    lineage:
    - datalake_ebdb_clean.house_maintenance_condition.maintenance_condition
    description: The house's maintenance condition
    categories:
      ALMOST_PERFECT_STATE: Listing with almost perfect condition.
      NEW_OR_WITHOUT_BASIC_ITENS: Listing new or missing only basic items.
      OLD:  Old property, with some maintenance needs.
      PERFECT_STATE:  Listing with perfect condition.
      POORLY_MAINTAINED: Listing with poor maintenance condition.
  academia:
    description: If the condominium has a gym (1 - yes, 0 - no, null - no information)
  acesso_sem_degraus:
    description: If the house has no step level front entrance (1 - yes, 0 - no, null
      - no information)
  animais_de_estimacao:
    description: If the owner accept pets in the house (1 - yes, 0 - no, null - no
      information)
  apartamento_cobertura:
