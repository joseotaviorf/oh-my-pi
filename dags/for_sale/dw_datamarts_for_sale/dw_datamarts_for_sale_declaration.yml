dag:
  name: dw_datamarts_for_sale
  owner: Data ForSale
  schedule_start_date: 2021, 7, 20
workflow:
  type: query_delta
  layer: dw
  custom_schema: datamarts
cluster:
  type: custom_cluster_with_sedona
  custom_libraries:
    - maven:
        coordinates: "org.apache.sedona:sedona-python-adapter-3.0_2.12:1.2.1-incubating"
    - maven:
        coordinates: "org.datasyslab:geotools-wrapper:1.1.0-25.2"
    - pypi:
        package: apache-sedona==1.2.1
  custom_configurations:
    driver_node_type_id: c5a.2xlarge
    node_type_id: c5a.2xlarge
    num_workers: 3
    spark_version: 12.2.x-scala2.12
    spark_conf:
      spark.serializer: "org.apache.spark.serializer.KryoSerializer"
      spark.sql.extensions: "org.apache.sedona.viz.sql.SedonaVizExtensions,org.apache.sedona.sql.SedonaSqlExtensions"
      spark.kryo.registrator: "org.apache.sedona.core.serde.SedonaKryoRegistrator"