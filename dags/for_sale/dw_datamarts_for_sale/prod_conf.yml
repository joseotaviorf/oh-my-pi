redshift_template:
  dw: &redshift_anchor
    runs_on: redshift
athena_template:
  dw: &athena_anchor
    runs_on: athena
pipeline:
  ##<KEEP THIS COMMENTED AS A TEMPLATE>
  # <task-name-like-attribution-conversion-paths>:
  #   dw:
  #     table: <targe-table-name>
  #     schema: <target-schema-name> # TODO this will always be `datamart` (for both datalake and dw). This var is not used anymore
  #     runs_on: <backend-to-run-the-query> E.g: redshift or athena
  buyer_first_visit_intent:
    dw:
      <<: *redshift_anchor
      table: buyer_first_visit_intent
  dim_house_listing_amenities:
    dw:
      <<: *athena_anchor
      table: dim_house_listing_amenities
  deal_making_funnel:
    dw:
