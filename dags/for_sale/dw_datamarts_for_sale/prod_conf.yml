      table: deal_making_funnel
  liquidity_by_sk_region:
    dw:
      <<: *redshift_anchor
      table: liquidity_by_sk_region
  loft_house_listing:
    dw:
      <<: *athena_anchor
      table: loft_house_listing
  loft_status_listing_flows:
    dw:
      <<: *athena_anchor
      table: loft_status_listing_flows
  repressed_demand_sale:
    dw:
      <<: *redshift_anchor
      table: repressed_demand_sale
  repressed_demand_sale_booking_fit_in:
    dw:
      <<: *redshift_anchor
      table: repressed_demand_sale_booking_fit_in
  sale_agents_weekly_performance:
    dw:
      <<: *redshift_anchor
      table: sale_agents_weekly_performance
  sale_available_hours:
    dw:
      <<: *redshift_anchor
      table: sale_available_hours
  sale_ongoing_listings_casa_mineira:
    dw:
      <<: *redshift_anchor
      table: sale_ongoing_listings_casa_mineira
  temp_autonomous_agents_listings:
    dw:
      <<: *redshift_anchor
      table: temp_autonomous_agents_listings
  sale_lead_flow:
    dw:
      <<: *redshift_anchor
      table: sale_lead_flow
