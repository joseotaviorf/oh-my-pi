database_name: datalake_tqc_referral
table_name: unified_lead_referral_flow
description: This table unites the two sources of lead indication for TQC and enriches the source tables by adding important fields for performance analysis.
domain: For Sale
owner: data-for-sale@quintoandar.com.br
columns:
  id_referral_flow:
    lineage:
      - datalake_ebdb_agents.agent_unified_contract_changes.id_agent
      - datalake_ebdb_clean.agent_lead_referral.id_agent
      - datalake_ebdb_clean.agent_lead_referral.id_lead
      - datalake_ebdb_clean.agent_lead_referral.phone
      - datalake_ebdb_user.user.id
    description: Id used to identify a lead indication for TQC (concatenates id_agent + id_lead);
  id_agent:
    lineage:
      - datalake_ebdb_agents.agent_unified_contract_changes.id_agent
      - datalake_ebdb_clean.agent_lead_referral.id_agent
      - datalake_ebdb_user.user.id_agent
    description: Id of the agent.
  id_user_agent:
    lineage:
      - datalake_ebdb_user.user.id
    description: ID user of the agent.
  id_user_lead:
    lineage:
      - datalake_ebdb_clean.agent_lead_referral.id_lead
      - datalake_ebdb_user.user.id   
    description: ID user of the lead. 
  lead_phone:
    lineage:
      - datalake_ebdb_clean.agent_lead_referral.phone
      - datalake_gsheets_clean.tqc_leads.lead_phone
    description: Lead phone number.
  hub_name:
    lineage:
      - datalake_hub_services.agent_hub_relation.hub_name
    description: Hub business name.
  city_group:
    lineage:
     - datalake_hub_services.agent_hub_relation.city_group
    description: City group of the hub.
  macro_region:
    lineage:
      - datalake_hub_services.agent_hub_relation.short_region_name
    description: Used by the OPS team to group regions between 'SP-RJ-POA', 'BH' and 'OTHER'.
  status:
    lineage:
      - datalake_ebdb_clean.agent_lead_referral.status
      - datalake_gsheets_clean.tqc_leads.is_valid_lead
    description: Referral status. It can be TRUE/FALSE, CONFIRMED, EXPIRED, INVALID.
  tqc_flow:
    description: Indicates the stream where a referral was made. Whether it was old ('Old') or new ('New')
  origin:
    lineage:
      - datalake_ebdb_clean.agent_lead_referral.origin
    description: Related to the origin of the indication. It can be in the traditional model (form/product) or via an invitation link (new sources can be included).
  ts_created:
    lineage:
      - datalake_ebdb_clean.agent_lead_referral.ts_created
      - datalake_gsheets_clean.tqc_leads.ts_appointment
    description: Timestamp at which the indication was registered.