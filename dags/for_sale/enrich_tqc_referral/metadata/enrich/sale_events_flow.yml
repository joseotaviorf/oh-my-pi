database_name: datalake_tqc_referral
table_name: sales_event_flow
description: This table groups the funnel events of a lead with a valid TQC indication. Grouping done from id_sale_flow, starting from the first VB
domain: For Sale
owner: data-for-sale@quintoandar.com.br
columns:
  id_visit:
    lineage:
      - datalake_booking.booking.id_visit
    description: Key of visit.
  id_house:
    lineage:
      - datalake_booking.booking.id_house
    description: Key of property/house.
  id_buyer:
    lineage:
      - datalake_booking.booking.id_visitor
    description: Id of the buyer.
  id_agent:
    lineage:
      - datalake_booking.booking.id_agent
    description: Id of the agent.
  id_sales_flow:
    lineage:
      - datalake_booking.booking.id_sale_flow
      - datalake_offer.sale_offer.id_sale_flow
    description: Key of sale flow (id_visitor + id_house).
  id_referral_flow:
    lineage:
      - datalake_tqc_referral.unified_lead_referral_flow.id_referral_flow
    description: Id used to identify a lead indication for TQC.
  id_offer:
    lineage:
      - datalake_offer.sale_offer.id_offer
    description: Offer unique identifier.
  first_visit_creation_origin:
    lineage:
      - datalake_booking.booking.user_sale_booking_creator
      - datalake_booking.booking.id_visit
      - datalake_booking.booking.ts_created_local_tz
    description: teste
  visit_creation_origin:
    lineage:
      - datalake_booking.booking.user_sale_booking_creator
    description: Identifies the type of user who created the sale booking.
  visit_update_origin:
    lineage:
      - datalake_booking.booking.last_update_source
    description: Show origin of last source to alter the booking.
  visit_code:
    lineage:
      - datalake_booking.booking.code
    description: Unique string code with 8 characters generated for each visit.
  visit_status:
    lineage:
      - datalake_booking.booking.visit_fup
      - datalake_booking.booking.status
    description: Gives the booking status, for exemple to show if the visit is canceled
      or not
  tqc_flow:
    lineage:
      - datalake_tqc_referral.unified_lead_referral_flow.tqc_flow
    description: Indicates the stream where a referral was made. Whether it was old ('Old') or new ('New')
  id_tqc_flow:
    lineage:
      - datalake_tqc_referral.unified_lead_referral_flow.tqc_flow
    description: Id that indicates the stream where a referral was made. Whether it was old (1) or new (2)
  is_tqc:
    lineage:
      - datalake_tqc_referral.unified_lead_referral_flow.id_user_lead
    description: Indicates whether it has a valid id_user_lead or not.
  ts_tqc_referral:
    lineage:
      - datalake_tqc_referral.unified_lead_referral_flow.ts_created
    description: Timestamp at which the indication was registered.
  ts_visit_scheduled_for:
    lineage:
      - datalake_booking.booking.ts_booking_utc
    description: Timestamp at which the visit was scheduled on UTC.
  ts_first_visit_created:
    lineage:
      - datalake_booking.booking.ts_created_local_tz
      - datalake_booking.booking.id_visit
    description: Datetime of first visit creation on local timezone, based on the country of the booking.
  ts_visit_created:
    lineage:
      - datalake_booking.booking.ts_created_local_tz
    description: Datetime of visit creation on local timezone, based on the country of the booking.
  ts_visit_updated:
    lineage:
      - datalake_booking.booking.ts_updated
    description: Datetime of the visit updating.
  ts_offer_submitted:
    lineage:
      - datalake_offer.sale_offer.ts_offer_submitted
    description: Timestamp when the offer was sent by the buyer.
  ts_offer_accepted:
    lineage:
      - datalake_offer.sale_offer.dt_offer_accepted
    description: Timestamp when the offer was accepted by the owner.
  ts_sale_agreement_created:
    lineage:
      - datalake_offer.sale_offer.dt_sale_agreement_created
    description:  Date when the CCV was created.
  ts_sale_agreement_signed:
    lineage:
      - datalake_offer.sale_offer.dt_sale_agreement_signed
    description: Date when the CCV was signed.