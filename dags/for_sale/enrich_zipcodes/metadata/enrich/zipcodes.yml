---
database_name: datalake_zipcodes
table_name: zipcodes
description: "Auxiliary table with the zipcode of all the listings that passed through the QuintoAndar and their respective id_region. 
  With this table, we can link an id_region given to a house transacted in the ITBI with its zipcode.
  For the São Paulo zipcodes, we also use an API with to extract all the zip codes of the city."
domain: For Sale
owner: data-for-sale@quintoandar.com.br
columns:
  zipcode:
    lineage:
      - datalake_gsheets_clean.zipcodes_sp.zipcode
    description: "It is the grain column of the table. It shows which zip code has the id_region tied to it."
  id_region:
    lineage:
      - datalake_region.region.id
    description: "Given all the listings that have passed through QuintoAndar, it is the id_region with the highest probability of having that zipcode in its extension."
  neighborhood:
    lineage:
      - datalake_region.region.name
    description: "Neighborhood name of the id_region."
  address:
    lineage: 
      - datalake_ebdb_listing.house.address
    description: "Address that is tied to the zipcode."
