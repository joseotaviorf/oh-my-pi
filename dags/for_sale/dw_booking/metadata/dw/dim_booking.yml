      SCHEDULE_CHANGE: ""
  cancellation_reason_category:
    lineage:
      - datalake_booking.booking.cancellation_reason_category
    description: >
      Category of the reason for cancelling the visit, according to the existing categories in the App.
    categories:
      Agent: >
        The agent cancelled the booking.
      Consequence Management: >
        The booking was cancelled because the owner was suspended because of "consequence management" reasons.
      House Reserved: >
        The house was reserved by a tenant, thus cancelling all bookings automatically.
      House Suspended: >
        The house was suspended.
      House Unlisted: >
        The house was unlisted, thus cancelling all bookings automatically.
      Other: >
        The booking was cancelled for another reason.
      Owner: >
        The owner cancelled the booking.
      Reschedule_Agent: >
        The booking was rescheduled by the agent.
      Reschedule_Tenant: >
        The booking was rescheduled by the tenant.
      Tenant: >
        The tenant cancelled the booking.
      Unknown: >
        Unknown reason
  reason_category:
    lineage:
      - datalake_booking.booking.reason_category
    description: >
      [Deprecated] Gives the reason why visit was cancelled.
  responsible:
    lineage:
      - datalake_booking.booking.responsible
    description: >
      It shows which entity was responsible for the cancellation of the visit.
    categories:
      Other: >
        The visit was cancelled by another entity.
      Owner: >
        Cancelled by owner
      QuintoAndar: >
        Cancelled by QuintoAndar, includes agents, consequence management, reservation, suspension, and unlisting.
      Reschedule: >
        Rescheduled by agent or tenant.
      Tenant: >
        Cancelled by tenant.
      Unknown: >
        Unknown reason
  last_update_source:
    lineage:
      - datalake_booking.booking.last_update_source
    description: >
      Shows the source of the last booking information change.
    categories:
      SelfServiceWeb: >
        The booking was updated by the tenant through the website.
      Corretores: The booking was updated by the agent.
      Inquilinos: The booking was updated by the tenant.
  first_update_source:
    lineage:
      - datalake_booking.booking.first_update_source
    description: >
      Shows the source of the booking creation.
    categories:
      Admin: >
        The booking was created by an admin.
      CidadeAlerta: >
        The booking was created by the Cidade Alerta.
      Corretores: >
        The booking was created by the agent.
      Encaixe: >
        This visit was created to fit in with the schedule of another visit.
      Inquilinos: >
        The booking was created by the tenant.
      MigracaoCasaMineira: >
        This booking was migrated from CasaMineira.
      RouteBooster: >
        The booking was created by the Route Booster.
      SelfServiceWeb: >
        The booking was created by the tenant through the website.
  first_cancelation_source:
    lineage:
      - datalake_booking.booking.first_cancelation_source
    description: >
      Shows the source of the exact action where the cancellation of the visit occurred.
    categories:
      Admin: >
        The booking was cancelled by an admin.
      CRM: >
        The booking was cancelled by the CRM team.
      CidadeAlerta: >
        The booking was cancelled by CidadeAlerta, QuintoAndar alert/push system.
      Corretores: >
        The booking was cancelled by a broker.
      Encaixe: >
        The booking was cancelled in order to fit in a schedule.
      Inquilinos: >
        The booking was cancelled by the tenant.
      Proprietarios: >
        The booking was cancelled by the owner.
      ProprietariosEmail: >
        The booking was cancelled by the owner through email.
      SelfServiceWeb: >
        The booking was cancelled by the tenant through the website.
      Sistema: >
        The booking was cancelled by the system.
      TimelineInquilinoOffboarding: >
        The booking was cancelled due to tenant offboarding.
      Vistoriadores: >
        The survey was cancelled by the inspector.
  visitor_missing_reason:
    lineage:
      - datalake_booking.booking.tenant_absence_reason
    description: >
      [Deprecated] Describes the reason why visitor did not show up (by agent app follow up).
  agent_missing_reason:
    lineage:
      - datalake_booking.booking.agent_absence_reason
    description: >
      [Deprecated] Describes the reason why agent did not show up (by agent app follow up).
  owner_missing_reason:
    lineage:
      - datalake_booking.booking.owner_missing_reason
    description: >
      [Deprecated] Describes the reason why owner did not show up (by agent app follow up).
  troublesome_entrance:
    lineage:
      - datalake_booking.booking.troublesome_entrance_problem
    description: >
      If it was not possible to enter the property to visit (succesful_entrance = 0), then this column lists the reason why it was not possible to enter.
    categories:
      Allowed: >
        'The visit was allowed.'
      BrokenLockbox: >
        'The lockbox was damaged and the visit could not be completed.'
      BuildingAsOkAuthorizationListRequired: >
        'It was necessary to align the visit with the condominium/building and it was not possible to complete the visit.'
      DamagedKeys: >
        'The keys were damaged and it was not possible to enter the listing.'
      DidntGetKeys: >
        'The keys were not delivered by the person in charge for the visit to be complete.'
      KeysKeeperNotPresent: >
        'The person responsible for the keys to the listing did not show up for the visit.'
      KeysNotAvailable: >
        'The keys were not available for the visit.'
      LandlordNoShow: >
        'The owner did not show up for the visit.'
      LockboxProblems: >
        'Lockbox related problems and the visit could not be completed.'
      MissplacedKeys: >
        'The keys were missplaced.'
      NameNotInTheList: >
        'Some of the parties involved in the visit did not have permission to enter the listing.'
      NoCollectiveAuthorization: >
        'Some of the parties involved in the visit did not have permission to enter the listing.'
      NoEntrancePermission: >
        'He was not allowed to enter the listing.'
      NoIndividualAuthorization: >
        'Some of the parties involved in the visit did not have permission to enter the listing.'
      NoKeysLockbox: >
        'The keys were not in the lockbox and the visit cannot be compelled.'
      NoLockbox: >
        'Not having lockbox once the visit cannot be completed.'
      None: >
        'Booking with no troublesome or unknown troublesome.'
      NotAllowed: >
        'The visit was not allowed for some unspecified reason.'
      OwnerQuitAnnouncement: >
        'The owner has given up listing.'
      PropertyNorForRent: >
        'Listing was actually not for rent.'
      PropertyNotForSale: >
        'Listing was actually not for sale.'
      Rented: >
        'The listing was already rented.'
      RentedByAnotherCompany: >
        'The listing has been rented on another platform or real estate agent.'
      RentedOrLandlordQuitRenting: >
        'Rented or owner has given up putting the listing up for rent.'
      ResidentTenantDidntAllowVisit: >
        'Current tenant did not allow listing to be visited.'
      ResidentTenantDidntKnowVisit: >
        'Current tenant did not know that the listing would be visited.'
      SoldByAnotherCompany: >
        'The listing was sold by another platform or real estate company.'
      TemporarilyUnavailable: >
        'The listing is temporarily unavailable.'
      TenantDelay: >
        'The tenant was delayed.'
      VisitOffAllowedHours: >
        'The visit was outside the available visiting hours.'
      WrongAddress: >
        'The listing address was incorrect.'
      WrongPassword: >
        'The password for the electronic lock entered was incorrect.'
  checkin_status:
    lineage:
      - datalake_booking.booking.checkin_status
    description: >
      Show status of whatsapp confirmation of visit. Only visits booked 2 days or more in advance need a whatsapp confirmation.
  checkin_code:
    lineage:
      - datalake_booking.booking.checkin_code
    description: Checkin code sent to buyer
  visit_checkin_status:
    lineage:
      - datalake_booking.booking.visit_checkin_status
    description: Buyer checkin status
  checkin_fail_reason:
    lineage:
      - datalake_booking.booking.checkin_fail_reason
    description: Checkin fail reason
  checkin_fail_commentary:
    lineage:
      - datalake_booking.booking.checkin_fail_commentary
    description: Checkin fail commentary made by the agent in the app.
    categories:
      CANCELED: >
        ''
      CONFIRMATION_NOT_REQUIRED: >
        ''
      CONFIRMED: >
        ''
      PENDING_PROCESS: >
        ''
      PENDING_SEND_REQUEST: >
        ''
      WAITING_CONFIRMATION: >
        ''
  user_sale_booking_creator:
    lineage:
      - datalake_booking.booking.user_sale_booking_creator
    description: >
      Type of the user entity that created the booking in the context of ForSale.
    categories:
      None: >
        ''
      Admin/CX: >
        ''
      Agent: >
        ''
      Buyer: >
        ''
      Other: >
        ''
      Secretaria: >
        ''
  partner_3p_supply:
    lineage:
      - datalake_booking.booking.partner_3p_supply
    description: >
      Column with the name of QuintoAndar real estate partner, if the listing has the is_3p_supply flag.
  partner_3p_demand:
    lineage:
      - datalake_booking.booking.partner_3p_demand
    description: >
      Column with the name of partner who brought the visitor, if the listing has the is_3p_demand flag.
  app_type:
    lineage:
      - datalake_booking.booking.app_type
    description: >
      App used to book the visit.
    categories:
      Android: >
        ''
