      CANCELED_RELOCATION: ""
      CANCELED_RELOCATION_BY_BUG: ""
      CANCELED_REQUEST_BY_OWNER_OR_TENANT: ""
      CANCELED_SCHEDULED_OTHER_TIME: ""
      CANCELED_SELF_SERVICE_PARTIAL: ""
      CANCELED_TENANT_CAN_NOT_ATTEND_INSPECTION: ""
      EXPECTED_TERMINATION_DATE_CHANGE: ""
