  flg_via_reschedule:
    lineage:
      - datalake_booking.booking.is_via_reschedule
    description: >
      Boolean column indicating if the visit has been rescheduled. True when this booking came from another booking as a reschedule.
  flg_branded:
    description: >
      Boolean column indicating if the booking came from a branded campaign, defined by the lead taxonomy. True if we identify if it did.
  is_visit_completed:
    lineage:
      - datalake_booking.booking.is_visit_completed
    description: >
      Boolean column indicating if he visit was completed by the visitor. The confirmation event is not registered yet.
  is_rescheduled:
    lineage:
      - datalake_booking.booking.has_reschedule
    description: >
      Boolean column indicating if the visit has been rescheduled. True if it was cancelled to be reschedule.
  is_first_booking_auto:
    lineage:
      - datalake_booking.booking.is_first_booking_auto
    description: >
      Boolean column indicating if the booking was originally created through planner (program that allocates 5A personnel to inspections and jobs). True if the visit originated via planner flow.
  is_visit_created_from_app:
    lineage:
      - datalake_booking.booking.is_visit_created_from_app
    description: >
      Boolean column that indicates if the visit was created in the application. True if it was.
  is_visit_last_updated_from_app:
    lineage:
      - datalake_booking.booking.is_visit_last_updated_from_app
    description: >
      Boolean column indicating whether the last update of visit information was done via the app. True if it was.
  is_3p_supply:
    lineage:
      - datalake_booking.booking.is_3p_supply
    description: >
      Boolean column that identifies if the listing is from a real estate partner (Rede Supply). Regardless if it is from QuintoAndar or CasaMineira.
  is_3p_supply_5a:
    lineage:
      - datalake_booking.booking.is_3p_supply_5a
    description: >
      Boolean column that identifies if the listing is from a real estate partner (Rede Supply) of QuintoAndar. (except from Belo Horizonte city, in Brazil).
  is_3p_supply_bh:
    lineage:
      - datalake_booking.booking.is_3p_supply_bh
    description: >
      Boolean column that identifies if the listing is from a real estate partner (Rede Supply) in Belo Horizonte (is a city from Brazil).
  is_3p_demand:
    lineage:
      - datalake_booking.booking.is_3p_demand
    description: >
      Boolean column that identifies if the visitor came from a QuintoAndar demand partner.
  dt_visit_follow_up:
    lineage:
      - datalake_booking.booking.ts_visit_fup
    description: >
      Date of the visit follow up. That is, the date on which the agent followed up the visitor's visit.
  ts_visit_follow_up_local:
    lineage:
      - datalake_booking.booking.ts_visit_follow_up_local_tz
    description: >
      Date of the visit follow up in local timezone, based on the country of the booking.
  dt_scheduling:
    lineage:
      - datalake_booking.booking.ts_booking_utc
    description: >
      Date of when visit was scheduled on UTC.
  ts_scheduling_local:
    lineage:
      - datalake_booking.booking.ts_booking_local_tz
    description: >
      Date of the booking on the local timezone, based on the booking date and the chosen slot.
  dt_cancel:
    lineage:
      - datalake_booking.booking.ts_first_canceled
    description: >
      Date of cancellation of the visit if it was cancelled. On UTC.
  ts_cancel_local:
    lineage:
      - datalake_booking.booking.ts_first_canceled_local_tz
    description: >
      Date of visit cancelation on local timezone, based on the country of the booking.
  dt_created:
    lineage:
      - datalake_booking.booking.ts_created
    description: >
      Date of visit creation on UTC.
  ts_created_local:
    lineage:
      - datalake_booking.booking.ts_created_local_tz
    description: >
      Date of visit creation on local timezone, based on the country of the booking.
  dt_updated:
    lineage:
      - datalake_booking.booking.ts_updated
    description: >
      Date of the last update of some booking information for the row in question. On UTC.
  ts_load:
    description: "Timestamp of when the data in this table was last loaded."
