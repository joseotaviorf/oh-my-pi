---
dag:
  name: enrich_sale_offer
  schedule_start_date: 2020, 7, 1
  owner: Data ForSale
  documentation:
    dag_purpose: This DAG creates the enriched table for Sale Offer, getting all data about the offer ForSale context.
workflow:
  type: query_delta
  layer: enrich
  inner_dependencies:
    sale_offers:
    - core_sale_offer
  tables_customization:
    sale_offers:
      row_filter_column_key: has_3p_access_control
      row_filter: has_3p_access
    sale_offer:
      row_filter_column_key: has_3p_access_control
      row_filter: has_3p_access
cluster:
  type: databricks_12_2_med_general_photon_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: USER_ISOLATION
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
