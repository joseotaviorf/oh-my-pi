database_name: dw_sale
table_name: fact_closing_flows
description: >-
  One row per CCV (signed sale agreement) / offer, at the grain of sk_offer — the same
  surrogate key used by dw_sale.fact_offers and dw_sale.dim_offer, to which this table joins
  1:1 for the same deal. Built from datalake_sale_closing_flows.closing_flow (enrich layer),
  it captures the post-CCV "End of Process" (EoP) closing funnel: due diligence, legal and
  credit analysis, financing, notary/registry milestones, key delivery and their precomputed
  day-to-day lead times. sk_legal_analysis_ended_date marks the Closed Deal (CD) — the
  Financeiro team's official sale-recognition event, the CD/EoP counterpart to the EoF (End of
  Funnel) milestones tracked up through CCV signature in fact_offers. sk_company_supply and
  sk_company_demand identify 3P Rede partner companies on the supply/demand side when
  applicable; sk_broker_supply and sk_broker_demand are the canonical replacement keys (see
  column descriptions) and should be preferred for new joins to dw_brokers.dim_broker.
domain: For Sale
owner: helder.rodrigues@quintoandar.com.br
columns:
  sk_offer:
    lineage:
    - datalake_sale_closing_flows.closing_flow.id_offer
    description: Surrogate key of the offer, defining the grain of this table (one row per CCV / offer). Joins to dw_sale.fact_offers.
  sk_buyer:
    lineage:
    - datalake_sale_closing_flows.closing_flow.id_buyer
    description: Surrogate key of the buyer involved in the closing flow.
  sk_owner:
    lineage:
    - datalake_sale_closing_flows.closing_flow.id_owner
    description: Surrogate key of the house owner (seller) party to the CCV. Joins to dw_public.dim_user.
  sk_house:
    lineage:
    - datalake_sale_closing_flows.closing_flow.id_house
    description: Surrogate key of the house (property) under the closing flow. Joins to dw_house.dim_house.
  sk_company_supply:
    lineage:
    - datalake_company.company_sks.sk_company
    description: Surrogate key for Rede companies. -1 if it is not a member.
  sk_company_demand:
    lineage:
    - datalake_company.company_sks.sk_company
    description: Surrogate key for Rede companies. -1 if it is not a member.
  sk_broker_supply:
    lineage:
    - core_brokers.brokers.sk_broker
    description: Surrogate key of the 3P broker partner for the same company as sk_company_supply. -1 if not resolved. Canonical replacement for sk_company_supply; prefer joining to dw_brokers.dim_broker.
  sk_broker_demand:
    lineage:
    - core_brokers.brokers.sk_broker
    description: Surrogate key of the 3P broker partner for the same company as sk_company_demand. -1 if not resolved. Canonical replacement for sk_company_demand; prefer joining to dw_brokers.dim_broker.
  sk_sale_agreement_created_date:
    lineage:
    - datalake_sale_closing_flows.closing_flow.dt_sale_agreement_created
    description: Date key to be joined with dim_date. Sale Agreement Created Date
  sk_sale_agreement_signed_date:
    lineage:
    - datalake_sale_closing_flows.closing_flow.dt_sale_agreement_signed
    description: Date key to be joined with dim_date. Sale Agreement Signed Date
  sk_onboarding_ended_date:
    lineage:
    - datalake_sale_closing_flows.closing_flow.dt_onboarding_ended
    description: Date key to be joined with dim_date. Onboarding Ended Date
  sk_sale_agreement_cancelled_date:
    lineage:
    - datalake_sale_closing_flows.closing_flow.dt_sale_agreement_cancelled
    description: Date key to be joined with dim_date. Sale Agreement Canceled Date
  sk_sale_agreement_rescued_date:
    lineage:
    - datalake_sale_closing_flows.closing_flow.dt_sale_agreement_rescued
    description: Date when the CCV was rescued
  sk_legal_analysis_ended_date:
