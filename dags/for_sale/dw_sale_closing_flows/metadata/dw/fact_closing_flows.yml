  sk_sale_agreement_rescued_date:
    lineage:
      - datalake_sale_closing_flows.closing_flow.dt_sale_agreement_rescued
    description: Date when the CCV was rescued
  sk_legal_analysis_ended_date:
    lineage:
      - datalake_sale_closing_flows.closing_flow.dt_legal_analysis_ended
