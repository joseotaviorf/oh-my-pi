    - datalake_sale_closing_flows.closing_flow.dt_legal_analysis_ended
    description: Date key to be joined with dim_date. Legal Analysis Ended Date (a.k.a. Return from Buyer & Seller)
  sk_legaut_analysis_started_date:
    lineage:
    - datalake_sale_closing_flows.closing_flow.dt_legaut_analysis_started
