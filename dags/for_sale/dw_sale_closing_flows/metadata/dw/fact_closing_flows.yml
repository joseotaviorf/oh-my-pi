    - datalake_sale_closing_flows.closing_flow.dt_payment_allowed
    description: Date key to be joined with dim_date. Date from which payment to the seller is allowed to proceed, computed by business rules that depend on the payment method (cash vs. financed vs. brokerage-term) and on the completion of legal and/or credit analysis.
  sk_down_payment_date:
    lineage:
    - datalake_sale_closing_flows.closing_flow.dt_down_payment
