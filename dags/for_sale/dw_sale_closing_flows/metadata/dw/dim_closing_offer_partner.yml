database_name: dw_sale
table_name: dim_closing_offer_partner
description: This table contains information about financed proposals, including their BU`s, Buyer`s name and etc.
domain: For Sale
owner: helder.rodrigues@quintoandar.com.br
columns:
  sk_offer:
    description: The unique identifier for the offer.
    lineage:
    - dw_sale.fact_offers.sk_offer
  sk_pre_analysis:
    description: The unique identifier for the pre-analysis.
    lineage:
    - dw_atta.fact_pre_analysis_proposal_flow.sk_pre_analysis
  partner_name:
    description: Legal or commercial name of the financing or brokerage partner entity.
    lineage:
    - dw_atta.dim_partner_atta.partner_name
  franchise_name:
    description: Commercial name of the Casa Mineira franchise partner organization.
    lineage:
    - dw_atta.dim_franchise_atta.franchise_name
  consultant_name:
    description: Name of the consultant handling the financing proposal, resolved from dim_consultant_atta.
    lineage:
    - dw_atta.dim_consultant_atta.consultant_name
  partner_type:
    description: Classification of the financing or brokerage partner type for the proposal.
  partner_type_group:
    description: The grouped type of the partner.
    lineage:
    - dw_atta.dim_proposal_atta.partner_type
    - dw_atta.dim_proposal_atta.first_pre_analysis
  last_credit_analysis_status:
    description: Status of the most recent credit analysis for the proposal.
    lineage:
    - dw_atta.dim_proposal_atta.last_credit_analysis_status
    - dw_atta.dim_proposal_atta.first_credit_approved_date
  financing_bank:
    description: The bank providing the financing.
    lineage:
    - dw_atta.dim_proposal_atta.financing_bank
  financing_value:
    description: Principal financing amount requested excluding down payment and fees.
    lineage:
    - dw_atta.dim_proposal_atta.financing_value
  proposal_status:
    description: Current status of the financing or sale proposal in the partner workflow.
    lineage:
    - dw_atta.dim_proposal_atta.proposal_status
  proposal_situation:
    description: Detailed situation code describing proposal stage and pending actions.
    lineage:
    - dw_atta.dim_proposal_atta.proposal_situation
  is_ccv_canceled:
    description: Indicates if the CCV was canceled.
  is_offer_financed:
    description: Indicates if the offer is financed.
  is_offer_canceled:
    description: Indicates if the offer was canceled.
  is_offer_accepted:
    description: Indicates if the offer was accepted.
  is_credit_approved:
    description: Indicates if the credit was approved.
  is_credit_ended:
    description: Indicates if the credit process ended.
  is_credit_ended_general:
    description: General indicator if the credit process ended.
  is_ccv_signed:
    description: Indicates if the CCV was signed.
  is_financing_ended:
    description: Indicates if the financing process ended.
  ts_load:
    description: Date of ingestion.
