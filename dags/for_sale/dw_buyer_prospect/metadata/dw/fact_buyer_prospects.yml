    description: Number of days elapsed between the buyer prospect's first submitted offer and their first signed sale agreement (CCV).
  days_first_offer_accepted_to_first_sale_agreement_signed:
    lineage:
    - datalake_buyer_prospect.buyer_prospect.days_first_offer_accepted_to_first_sale_agreement_signed
    description: Number of days elapsed between the buyer prospect's first accepted offer and their first signed sale agreement (CCV).
  days_first_sale_flow_to_last_sale_flow:
    lineage:
    - datalake_buyer_prospect.buyer_prospect.days_first_sale_flow_to_last_sale_flow
    description: Number of days elapsed between the buyer prospect's first sale flow and their last sale flow.
  days_first_sale_flow_to_last_booking_created:
    lineage:
    - datalake_buyer_prospect.buyer_prospect.days_first_sale_flow_to_last_booking_created
    description: Number of days elapsed between the buyer prospect's first sale flow and their last booking created.
  days_first_sale_flow_to_last_visit_completed:
    lineage:
    - datalake_buyer_prospect.buyer_prospect.days_first_sale_flow_to_last_visit_completed
