    - datalake_buyer_prospect.buyer_prospect.days_first_visit_completed_to_first_offer_accepted
    description: Number of days elapsed between the buyer prospect's first completed visit and their first accepted offer.
  days_first_visit_completed_to_first_sale_agreement_signed:
    lineage:
