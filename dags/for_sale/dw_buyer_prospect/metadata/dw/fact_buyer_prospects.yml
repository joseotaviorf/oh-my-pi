database_name: dw_sale
table_name: fact_buyer_prospects
description: Fact table that describes the events of buyer prospects in the demand
  sale funnel. Each line is a user that at least made a booking or an offer
domain: For Sale
owner: ae-for-sale@quintoandar.com.br
columns:
  sk_buyer:
    lineage:
    - datalake_buyer_prospect.buyer_prospect.id_buyer
    description: ID user of buyer prospect
  sk_first_region:
    lineage:
    - datalake_buyer_prospect.buyer_prospect.id_first_region
    description: ID region of the first house with sale flow
  sk_last_region:
    lineage:
    - datalake_buyer_prospect.buyer_prospect.id_last_region
    description: ID region of the last house with sale flow
  sk_first_sale_flow_date:
    lineage:
    - datalake_buyer_prospect.buyer_prospect.ts_first_sale_flow
    description: SK date of the first sale flow
  sk_first_booking_created_date:
    lineage:
    - datalake_buyer_prospect.buyer_prospect.ts_first_booking_created
    description: SK date of the first booking created
  sk_first_visit_completed_date:
    lineage:
    - datalake_buyer_prospect.buyer_prospect.ts_first_visit_completed
    description: SK date of the first visit completed
  sk_first_offer_submitted_date:
    lineage:
    - datalake_buyer_prospect.buyer_prospect.ts_first_offer_submitted
    description: SK date of the first offer submitted
  sk_first_offer_accepted_date:
    lineage:
    - datalake_buyer_prospect.buyer_prospect.dt_first_offer_accepted
    description: SK date of the first offer accepted
  sk_first_sale_agreement_signed_date:
    lineage:
    - datalake_buyer_prospect.buyer_prospect.dt_first_sale_agreement_signed
    description: SK date of the first sale agreement signed
  sk_last_sale_flow_date:
    lineage:
    - datalake_buyer_prospect.buyer_prospect.ts_last_sale_flow
    description: SK date of the first sale flow
  sk_last_booking_created_date:
    lineage:
    - datalake_buyer_prospect.buyer_prospect.ts_last_booking_created
    description: SK date of the last booking created
  sk_last_visit_completed_date:
    lineage:
    - datalake_buyer_prospect.buyer_prospect.ts_last_visit_completed
    description: SK date of the first visit completed
  sk_last_offer_submitted_date:
    lineage:
    - datalake_buyer_prospect.buyer_prospect.ts_last_offer_submitted
    description: SK date of the first offer submitted
  sk_last_offer_accepted_date:
    lineage:
    - datalake_buyer_prospect.buyer_prospect.dt_last_offer_accepted
    description: SK date of the first offer accepted
  sk_last_sale_agreement_signed_date:
    lineage:
    - datalake_buyer_prospect.buyer_prospect.dt_last_sale_agreement_signed
    description: SK date of the first sale agreement signed
  sk_last_event_date:
    lineage:
    - datalake_buyer_prospect.buyer_prospect.ts_last_event
    description: SK date of the last event in demand funnel the buyer had
  first_event:
    lineage:
    - datalake_buyer_prospect.buyer_prospect.first_event
    description: The first event in the funnel (booking / offer / talk_to_agent)
  last_event:
    lineage:
    - datalake_buyer_prospect.buyer_prospect.last_event
    description: The last event in the funnel
  further_funnel_step:
    lineage:
    - datalake_buyer_prospect.buyer_prospect.further_funnel_step
    description: The further event the Buyer had in the funnel VB > VC > OS > OA >
      CCV
  first_buyer_intention:
    lineage:
    - datalake_buyer_prospect.buyer_prospect.first_buyer_intention
    description: The first intention category for buying the house that the buyer
      indicate in the booking schedule.
  is_tenant:
    lineage:
    - datalake_buyer_prospect.buyer_prospect.is_tenant
    description: True if buyer had/have rental contracts in 5A as tenant
  is_current_tenant:
    lineage:
    - datalake_buyer_prospect.buyer_prospect.is_current_tenant
    description: True if buyer is a current tenant in 5A
  is_contract_owner:
    lineage:
    - datalake_buyer_prospect.buyer_prospect.is_contract_owner
    description: True if buyer had/have rental contracts in 5A as owner
  is_tenant_prospect:
    lineage:
    - datalake_buyer_prospect.buyer_prospect.is_tenant_prospect
    description: True if buyer if buyer had rent flows in 5A
  sale_flows:
    lineage:
    - datalake_buyer_prospect.buyer_prospect.sale_flows
    description: Number of sale flows, in other words, number of houses interacted
      with bookings or offers
  regions_with_sale_flows:
    lineage:
    - datalake_buyer_prospect.buyer_prospect.regions_with_sale_flows
    description: Count of regions where the buyer had sale flows
  weeks_with_sale_flows:
    lineage:
    - datalake_buyer_prospect.buyer_prospect.weeks_with_sale_flows
    description: Count of weeks that the buyer had sale flows
  bookings_created:
    lineage:
    - datalake_buyer_prospect.buyer_prospect.bookings_created
    description: Number of booking created
  bookings_created_by_agent:
    lineage:
    - datalake_buyer_prospect.buyer_prospect.bookings_created_by_agent
    description: Number of booking created by agent
  bookings_canceled:
    lineage:
    - datalake_buyer_prospect.buyer_prospect.bookings_canceled
    description: Number of booking canceled
  visits_completed:
    lineage:
    - datalake_buyer_prospect.buyer_prospect.visits_completed
    description: Number of visits completed by buyer
  offers_submitted:
    lineage:
    - datalake_buyer_prospect.buyer_prospect.offers_submitted
    description: Number of offers submitted
  offers_accepted:
    lineage:
    - datalake_buyer_prospect.buyer_prospect.offers_accepted
    description: Number of offers accepted
  offers_dismissed:
    lineage:
    - datalake_buyer_prospect.buyer_prospect.offers_dismissed
    description: Number of offers dismissed
  sale_agreements_signed:
    lineage:
    - datalake_buyer_prospect.buyer_prospect.sale_agreements_signed
    description: Number of sale agreements signed
  avg_sale_price:
    lineage:
    - datalake_buyer_prospect.buyer_prospect.avg_sale_price
    description: Average  sale price of the houses with sale flows
  avg_offer_price:
    lineage:
    - datalake_buyer_prospect.buyer_prospect.avg_offer_price
    description: Average  price proposed of the offers submitted
  avg_offer_discount:
    lineage:
    - datalake_buyer_prospect.buyer_prospect.avg_offer_discount
    description: Average offer discount of the offers submitted
  houses_owned:
    lineage:
    - datalake_buyer_prospect.buyer_prospect.houses_owned
    description: Count of house owned by the buyer that are registrered in 5A
  listings_for_sale:
    lineage:
    - datalake_buyer_prospect.buyer_prospect.listings_for_sale
    description: Count of house owned by the buyer that are listed for sale in 5A
  listings_for_rent:
    lineage:
    - datalake_buyer_prospect.buyer_prospect.listings_for_rent
    description: Count of house owned by the buyer that are listed for rent in 5A
