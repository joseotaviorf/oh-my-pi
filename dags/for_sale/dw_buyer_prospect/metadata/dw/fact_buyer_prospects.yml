    description: Number of days elapsed between the buyer prospect's first sale flow and their last submitted offer.
  days_first_sale_flow_to_last_offer_accepted:
    lineage:
    - datalake_buyer_prospect.buyer_prospect.days_first_sale_flow_to_last_offer_accepted
    description: Number of days elapsed between the buyer prospect's first sale flow and their last accepted offer.
  days_first_sale_flow_to_last_sale_agreement_signed:
