table_name: dw_rent.fact_house_listings
alert_channel: "#alerts-de-airflow-dags"
table_level_validations:
  has_size:
    greater_than: 1400000
    severity_level: Error
column_level_validations:
  sk_house_listing:
    is_complete:
      severity_level: Error
    is_unique:
      severity_level: Error
  days_listing_to_contract_signed:
    has_min_value:
      greater_than_or_equal_to: 0
      severity_level: Error
  days_relisting_to_re_rental:
    has_min_value:
      greater_than_or_equal_to: 0
      severity_level: Error
