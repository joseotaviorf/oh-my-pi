---
database_name: datalake_for_sale_experiment
table_name: exp_1_1_visits_boosting_agents
owner: guilherme.rocha@quintoandar.com.br
domain: For Sale
description:
  Experiment table for visits boosting agents (Visits XP Team). This table tracks visitor
  participation in an A/B test designed to evaluate the impact of agent boosting strategies
  on visit conversion rates. Visitors are randomly assigned to control or treatment groups
  based on the last two digits of their visitor ID, with the experiment focusing on rent
  context visits starting from November 14, 2025.
columns:
  identifier_bc:
    description: Unique identifier of the visitor participating in the experiment by business_context.
    lineage:
      - datalake_ebdb_clean.visit.id_visitor
      - datalake_ebdb_clean.visit.business_context
  identifier:
    description: Unique identifier of the visitor participating in the experiment (same as id_visitor).
    lineage:
      - datalake_ebdb_clean.visit.id_visitor
  id_neotribe:
    description: Identifier for the neotribe of For Sale line.
  id_experiment:
    description: Unique identifier for this specific experiment.
  name_neotribe:
    description: Name of the neotribe.
  name_experiment:
    description: Name of the specific experiment.
  identifier_type:
    description: Type of identifier used for the experiment.
  business_context:
    description: Business context related to the experiment.
    lineage:
      - datalake_ebdb_clean.visit.business_context
  test_group:
    description: Experiment group assignment based on visitor ID. 'control' for IDs ending 50-99, 'treatment' for IDs ending 00-49.
    lineage:
      - datalake_ebdb_clean.visit.id_visitor
    categories:
      CONTROL: Control group.
      TREATMENT: Treatment group.
      ERROR: Invalid or unmapped ID patterns.
  documentation_link:
    description: Link to experiment documentation.
  additional_information:
    description: Additional context about the experiment methodology and visitor segmentation logic.
  dt_identifier_started:
    description: Earliest date when this specific visitor started participating in the experiment based on visit creation.
    lineage:
      - datalake_ebdb_clean.visit.ts_created
  dt_identifier_ended:
    description: Latest date when this specific visitor participated in the experiment based on visit creation timestamp.
    lineage:
      - datalake_ebdb_clean.visit.ts_created
