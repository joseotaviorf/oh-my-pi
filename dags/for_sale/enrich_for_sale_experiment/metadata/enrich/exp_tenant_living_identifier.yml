---
database_name: datalake_for_sale_experiment
table_name: exp_tenant_living_identifier
owner: guilherme.rocha@quintoandar.com.br
domain: For Sale
description:
  Consolidated experiment identifier table that combines all experiments with tenant living
  identifiers. Each tenant living identifier appears with their respective experiment
  assignment and participation timeline for comprehensive A/B testing analysis.
columns:
  id_element_exp:
    description: Unique identifier of the experiment and tenant living participating in the experiment.
    lineage:
      - datalake_for_sale_experiment.exp_1_17_visits_triangulation_tenant_living.identifier_bc
      - datalake_for_sale_experiment.exp_1_17_visits_triangulation_tenant_living.id_neotribe
      - datalake_for_sale_experiment.exp_1_17_visits_triangulation_tenant_living.id_experiment
  identifier:
    description: Unique identifier of the tenant living participating in the experiment (same as id_user).
    lineage:
      - datalake_for_sale_experiment.exp_1_17_visits_triangulation_tenant_living.identifier
  id_neotribe:
    description: Identifier for the neotribe conducting the experiment (1 for VISITS XP).
    lineage:
      - datalake_for_sale_experiment.exp_1_17_visits_triangulation_tenant_living.id_neotribe
  id_experiment:
    description: Unique identifier for the specific experiment (17 for visits_triangulation_tenant_living).
    lineage:
      - datalake_for_sale_experiment.exp_1_17_visits_triangulation_tenant_living.id_experiment
  name_neotribe:
    description: Name of the neotribe conducting the experiments (VISITS XP).
    lineage:
      - datalake_for_sale_experiment.exp_1_17_visits_triangulation_tenant_living.name_neotribe
  name_experiment:
    description: Name of the specific experiment variant.
    lineage:
      - datalake_for_sale_experiment.exp_1_17_visits_triangulation_tenant_living.name_experiment
    categories:
      visits_triangulation_tenant_living: Visits triangulation tenant living experiment.
  identifier_type:
    description: Type of identifier used for the experiments (TENANT_LIVING).
    lineage:
      - datalake_for_sale_experiment.exp_1_17_visits_triangulation_tenant_living.identifier_type
  business_context:
    description: Business context for the experiments.
    lineage:
      - datalake_for_sale_experiment.exp_1_17_visits_triangulation_tenant_living.business_context
  test_group:
    description: Experiment group assignment for the tenant living (CONTROL or TREATMENT). Assignment logic varies by experiment.
    lineage:
      - datalake_for_sale_experiment.exp_1_17_visits_triangulation_tenant_living.test_group
    categories:
      CONTROL: Control group participants.
      TREATMENT: Treatment group participants.
      ERROR: Invalid or unmapped phone patterns.
  documentation_link:
    description: Link to experiment documentation (may be null).
    lineage:
      - datalake_for_sale_experiment.exp_1_17_visits_triangulation_tenant_living.documentation_link
  additional_information:
    description: Additional context about experiment methodology and tenant living segmentation logic.
    lineage:
      - datalake_for_sale_experiment.exp_1_17_visits_triangulation_tenant_living.additional_information
  dt_identifier_started:
    description: Earliest date when this specific tenant living started participating in the experiment.
    lineage:
      - datalake_for_sale_experiment.exp_1_17_visits_triangulation_tenant_living.dt_identifier_started
  dt_identifier_ended:
    description: Latest date when this specific tenant living participated in the experiment.
    lineage:
      - datalake_for_sale_experiment.exp_1_17_visits_triangulation_tenant_living.dt_identifier_ended
