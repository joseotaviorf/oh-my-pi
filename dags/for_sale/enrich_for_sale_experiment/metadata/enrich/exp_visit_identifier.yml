---
database_name: datalake_for_sale_experiment
table_name: exp_visit_identifier
owner: guilherme.rocha@quintoandar.com.br
domain: For Sale
description:
  Consolidated experiment identifier table that combines all experiments with visit
  identifiers. Each visit identifier appears with their respective experiment
  assignment and participation timeline for comprehensive A/B testing analysis.
columns:
  id_element_exp:
    description: Unique identifier of the experiment and visit participating in the experiment.
    lineage:
      - datalake_for_sale_experiment.exp_1_15_visits_reconfirmation_hsm_rent.identifier_bc
      - datalake_for_sale_experiment.exp_1_15_visits_reconfirmation_hsm_rent.id_neotribe
      - datalake_for_sale_experiment.exp_1_15_visits_reconfirmation_hsm_rent.id_experiment
  identifier:
    description: Unique identifier of the visit participating in the experiment (same as id_visit).
    lineage:
      - datalake_for_sale_experiment.exp_1_15_visits_reconfirmation_hsm_rent.identifier
  id_neotribe:
    description: Identifier for the neotribe conducting the experiment (1 for VISITS XP).
    lineage:
      - datalake_for_sale_experiment.exp_1_15_visits_reconfirmation_hsm_rent.id_neotribe
  id_experiment:
    description: Unique identifier for the specific experiment (15 for visits_reconfirmation_hsm_rent).
    lineage:
      - datalake_for_sale_experiment.exp_1_15_visits_reconfirmation_hsm_rent.id_experiment
  name_neotribe:
    description: Name of the neotribe conducting the experiments (VISITS XP).
    lineage:
      - datalake_for_sale_experiment.exp_1_15_visits_reconfirmation_hsm_rent.name_neotribe
  name_experiment:
    description: Name of the specific experiment variant.
    lineage:
      - datalake_for_sale_experiment.exp_1_15_visits_reconfirmation_hsm_rent.name_experiment
    categories:
      visits_reconfirmation_hsm_rent: Visits reconfirmation HSM rent experiment.
  identifier_type:
    description: Type of identifier used for the experiments (VISIT).
    lineage:
      - datalake_for_sale_experiment.exp_1_15_visits_reconfirmation_hsm_rent.identifier_type
  business_context:
    description: Business context for the experiments.
    lineage:
      - datalake_for_sale_experiment.exp_1_15_visits_reconfirmation_hsm_rent.business_context
  test_group:
    description: Experiment group assignment for the visit (CONTROL or TREATMENT). Assignment logic varies by experiment.
    lineage:
      - datalake_for_sale_experiment.exp_1_15_visits_reconfirmation_hsm_rent.test_group
    categories:
      CONTROL: Control group participants.
      TREATMENT: Treatment group participants.
      ERROR: Invalid or unmapped ID patterns
  documentation_link:
    description: Link to experiment documentation (may be null).
    lineage:
      - datalake_for_sale_experiment.exp_1_15_visits_reconfirmation_hsm_rent.documentation_link
  additional_information:
    description: Additional context about experiment methodology and visit segmentation logic.
    lineage:
      - datalake_for_sale_experiment.exp_1_15_visits_reconfirmation_hsm_rent.additional_information
  dt_identifier_started:
    description: Earliest date when this specific visit started participating in the experiment.
    lineage:
      - datalake_for_sale_experiment.exp_1_15_visits_reconfirmation_hsm_rent.dt_identifier_started
  dt_identifier_ended:
    description: Latest date when this specific visit participated in the experiment.
    lineage:
      - datalake_for_sale_experiment.exp_1_15_visits_reconfirmation_hsm_rent.dt_identifier_ended
