---
dag:
  name: enrich_for_sale_experiment
  owner: Data ForSale
  schedule_start_date: 2025, 11, 14
  documentation:
    dag_purpose:
      This DAG creates enriched tables for experiments of For Sale line.
workflow:
  type: query_delta
  layer: enrich
  inner_dependencies:
    exp_visitor_identifier:
      - exp_1_1_visits_boosting_agents
      - exp_1_2_visits_boosting_agents_area_increased_to_800m
cluster:
  type: databricks_16_4_med_memory_cluster
  databricks_conn_id: databricks_new_env
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: USER_ISOLATION
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
