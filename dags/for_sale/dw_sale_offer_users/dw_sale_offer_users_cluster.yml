cluster:
  type: consolidation_xs_memory_cluster
  databricks_conn_id: databricks_new_env
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE
  custom_configurations:
    num_workers: 3
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
    driver_node_type_id: m7g.xlarge
validation:
  cluster:
    type: emr_7_12_consolidation_xs_memory_cluster
    custom_configurations:
      core_nodes:
        instance_count: 2
      task_nodes:
        instance_count: 1
      master_node_type_id: m6g.xlarge
      spark_conf:
        spark.driver.memory: 3g
        spark.driver.memoryOverhead: 1g
        spark.yarn.am.memory: 512m
