---
dag:
  name: enrich_sale_closing_flows
  schedule_start_date: 2020, 8, 29
  owner: Data ForSale
  documentation:
    dag_purpose: This DAG creates the enriched table for Sale Closing Flows, in order to create metrics for monitor and analyze the closing funnel in For Sale.
workflow:
  type: query_delta
  layer: enrich
cluster:
  type: databricks_12_2_med_general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
