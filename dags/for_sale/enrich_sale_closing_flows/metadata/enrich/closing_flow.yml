database_name: datalake_sale_closing_flows
table_name: closing_flow
description:
  Enriched table for sale closing flows, which is used to monitor and analyze
  the closing funnel in For Sale
domain: For Sale
owner: herivelto.junior@quintoandar.com.br
columns:
  id_offer:
    lineage:
      - datalake_offer.sale_offer.id_offer
      - datalake_sale_offer_flows.sale_offer_flows.id_offer
      - datalake_firestore_clean.sale_offer.id_offer
    description: Identification key of the offer.
  id_buyer:
    lineage:
      - datalake_offer.sale_offer.id_buyer
    description: Identification key of the user who sent the offer.
  id_owner:
    lineage:
      - datalake_offer.sale_offer.id_owner
    description: House owner to whom an offer has been sent.
  id_house:
    lineage:
      - datalake_offer.sale_offer.id_house
    description: Identification key of the house linked to the offer.
  id_company_supply:
    lineage:
      - datalake_offer.sale_offer.id_company_supply
    description: Id of the supply partner in HubSpot
  uuid_company_supply:
    lineage:
      - datalake_offer.sale_offer.uuid_company_supply
    description: UUID of the supply partner in the company domain
  id_company_demand:
    lineage:
      - datalake_offer.sale_offer.id_company_demand
    description: Id of the demand partner
  id_closing_specialist:
    lineage:
      - datalake_sale_offer_flows.sale_offer_flows.id_consultant
      - datalake_firestore.monday.id_closing_specialist
    description: Identification key of the closing specialist.
  id_legal_risk_analyst:
    lineage:
      - datalake_sale_offer_flows.sale_offer_flows.id_legal_risk_analyst
      - datalake_firestore.monday.id_legal_risk_analyst
    description: Identification key of the legal risk analyst.
  id_pre_specialist:
    lineage:
      - datalake_sale_offer_flows.sale_offer_flows.id_pre_specialist
      - datalake_firestore.monday.id_pre_specialist
    description: Identification key of the pre credit specialist.
  id_post_specialist:
    lineage:
      - datalake_sale_offer_flows.sale_offer_flows.id_post_specialist
      - datalake_firestore.monday.id_post_specialist
    description: Identification key of the post credit specialist.
  id_start_financing_specialist:
    lineage:
      - datalake_sale_offer_flows.sale_offer_flows.id_start_financing_specialist
      - datalake_firestore.monday.id_start_financing_specialist
    description: Identification key of the start financing specialist.
  id_follow_up_financing_specialist:
    lineage:
      - datalake_sale_offer_flows.sale_offer_flows.id_follow_up_financing_specialist
      - datalake_firestore.monday.id_follow_up_financing_specialist
    description: Identification key of the follow up financing specialist.
  id_end_financing_specialist:
    lineage:
      - datalake_sale_offer_flows.sale_offer_flows.id_end_financing_specialist
      - datalake_firestore.monday.id_end_financing_specialist
    description: Identification key of the end financing specialist.
  id_credit_specialist:
    lineage:
      - datalake_sale_offer_flows.sale_offer_flows.id_credit_specialist
      - datalake_firestore.monday.id_credit_specialist
    description: Identification key of the credit specialist.
  id_notes_registry_specialist:
    lineage:
      - datalake_sale_offer_flows.sale_offer_flows.id_notes_registry_specialist
      - datalake_firestore.monday.id_notes_registry_specialist
    description: Identification key of the notes registry specialist.
  id_real_estate_register_specialist:
    lineage:
      - datalake_sale_offer_flows.sale_offer_flows.id_real_estate_register_specialist
      - datalake_firestore.monday.id_real_estate_register_specialist
    description: Identification key of the real estate register specialist.
  partner_3p_supply:
    lineage:
      - datalake_offer.sale_offer.partner_3p_supply
    description: Name of the Rede partner that supplied the property.
  partner_3p_demand:
    lineage:
      - datalake_offer.sale_offer.partner_3p_demand
    description: Name of the Rede partner that demanded the property.
  is_3p_supply:
    lineage:
      - datalake_offer.sale_offer.is_3p_supply
    description: Boolean flag indicating if the closing flow has 3P supply partner. Obtained from sale_offer table which gets it from visit_business_model.
  is_3p_demand:
    lineage:
      - datalake_offer.sale_offer.is_3p_demand
    description: Boolean flag indicating if the closing flow has 3P demand partner. Obtained from sale_offer table which gets it from visit_business_model.
  is_3p_lead_gen:
    lineage:
      - datalake_offer.sale_offer.is_3p_lead_gen
    description: Boolean flag indicating if the closing flow has 3P lead generation partner. Obtained from sale_offer table which gets it from visit_business_model.
  has_3p_access_control:
    lineage:
      - datalake_offer.sale_offer.has_3p_access_control
    description: Boolean flag indicating if the closing flow has any 3P access control (supply, demand, or lead gen). Obtained from sale_offer table which gets it from visit_business_model.
  days_sale_agreement_created_to_legaut_analysis_started:
