database_name: datalake_sale_closing_flows
table_name: closing_flow
description: >-
  Enriched table for the post-CCV "End of Process" (EoP) closing funnel in For Sale — due
  diligence, financing, notary/registry and key delivery — with one row per offer (id_offer).
  id_offer is the same key used by enrich_sale_offer_flows.sale_offer_flows and
  enrich_sale_salesforce.purchase_sale_contract, letting closing milestones be joined back to
  the pre-CCV negotiation funnel and to the Salesforce contract record for the same deal.
  id_buyer and id_owner (seller) can be joined with dw_public.dim_user; id_house can be joined
  with dw_house.dim_house and with enrich_sale_flows.house_address_data/house_offers.
  id_company_supply/id_company_demand identify the 3P partner real-estate agencies (Rede
  network) involved on the supply/demand side, when applicable. Specialist assignments and
  closing milestone dates are sourced from datalake_firestore.monday, a static table from the
  deprecated enrich_sale_firestore pipeline (legacy Firestore/Monday system inactive since
  2024); those fields reflect historical records only.
domain: For Sale
owner: helder.rodrigues@quintoandar.com.br
columns:
  id_offer:
    lineage:
    - datalake_sale_offer.sale_offer.id_offer
    description: Identification key of the offer that reached a signed sale agreement (CCV) and entered the closing/post-CCV process tracked by this table.
  id_buyer:
    lineage:
    - datalake_sale_offer.sale_offer.id_buyer
    description: Identification key of the buyer who sent the offer. Foreign key to dw_public.dim_user.
  id_owner:
    lineage:
    - datalake_sale_offer.sale_offer.id_owner
    description: House owner (seller) to whom the offer was sent. Foreign key to dw_public.dim_user.
  id_house:
    lineage:
    - datalake_sale_offer.sale_offer.id_house
    description: Identification key of the house linked to the offer. Foreign key to dw_house.dim_house and to id_house in the house_offers and sale_flow enrich tables.
  id_company_supply:
    lineage:
    - datalake_sale_offer.sale_offer.id_company_supply
    description: Id of the supply partner in HubSpot
  uuid_company_supply:
    lineage:
    - datalake_company.company_sks.uuid_company
    description: UUID of the supply partner in the company domain
  id_company_demand:
    lineage:
    - datalake_sale_offer.sale_offer.id_company_demand
    description: Id of the demand partner
  sk_broker_demand:
    lineage:
    - core_brokers.brokers.sk_broker
    description: Surrogate key of the 3P broker partner on the demand side, resolved from the same company UUID as id_company_demand. Canonical replacement for the legacy company_sks-based key; prefer this for joins to core_brokers.brokers/dw_brokers.dim_broker.
  id_closing_specialist:
    lineage:
    - datalake_sale_offer_flows.sale_offer_flows.id_consultant
    - datalake_firestore.monday.id_closing_specialist
    description: Identification key of the QuintoAndar employee (closing specialist) responsible for the closing process. Composite text value, prefixed 'ID_VENDAS_' when sourced from the current sales-flow system (id_consultant) or 'ID_MONDAY_' when backfilled from the legacy Firestore/Monday system (inactive since 2024) — not a plain foreign-key integer; strip the prefix before joining to a user dimension.
  id_legal_risk_analyst:
    lineage:
    - datalake_sale_offer_flows.sale_offer_flows.id_legal_risk_analyst
    - datalake_firestore.monday.id_legal_risk_analyst
    description: Identification key of the QuintoAndar employee (legal risk analyst) who evaluated legal risk for this closing. Composite text value, prefixed 'ID_VENDAS_' (current sales-flow system) or 'ID_MONDAY_' (legacy Firestore/Monday system, inactive since 2024) — not a plain foreign-key integer.
  id_pre_specialist:
    lineage:
    - datalake_sale_offer_flows.sale_offer_flows.id_pre_specialist
    - datalake_firestore.monday.id_pre_specialist
    description: Identification key of the QuintoAndar employee (pre credit specialist) who ran the initial credit pre-analysis for this closing. Composite text value, prefixed 'ID_VENDAS_' (current sales-flow system) or 'ID_MONDAY_' (legacy Firestore/Monday system, inactive since 2024) — not a plain foreign-key integer.
  id_post_specialist:
    lineage:
    - datalake_sale_offer_flows.sale_offer_flows.id_post_specialist
    - datalake_firestore.monday.id_post_specialist
    description: Identification key of the QuintoAndar employee (post credit specialist) who handled credit follow-up after the pre-analysis. Composite text value, prefixed 'ID_VENDAS_' (current sales-flow system) or 'ID_MONDAY_' (legacy Firestore/Monday system, inactive since 2024) — not a plain foreign-key integer.
  id_start_financing_specialist:
    lineage:
    - datalake_sale_offer_flows.sale_offer_flows.id_start_financing_specialist
    - datalake_firestore.monday.id_start_financing_specialist
    description: Identification key of the QuintoAndar employee who started the financing process for this closing. Composite text value, prefixed 'ID_VENDAS_' (current sales-flow system) or 'ID_MONDAY_' (legacy Firestore/Monday system, inactive since 2024) — not a plain foreign-key integer.
  id_follow_up_financing_specialist:
    lineage:
    - datalake_sale_offer_flows.sale_offer_flows.id_follow_up_financing_specialist
    - datalake_firestore.monday.id_follow_up_financing_specialist
    description: Identification key of the QuintoAndar employee who followed up on the financing process for this closing. Composite text value, prefixed 'ID_VENDAS_' (current sales-flow system) or 'ID_MONDAY_' (legacy Firestore/Monday system, inactive since 2024) — not a plain foreign-key integer.
  id_end_financing_specialist:
    lineage:
    - datalake_sale_offer_flows.sale_offer_flows.id_end_financing_specialist
    - datalake_firestore.monday.id_end_financing_specialist
    description: Identification key of the QuintoAndar employee who closed out the financing process for this closing. Composite text value, prefixed 'ID_VENDAS_' (current sales-flow system) or 'ID_MONDAY_' (legacy Firestore/Monday system, inactive since 2024) — not a plain foreign-key integer.
  id_credit_specialist:
    lineage:
    - datalake_sale_offer_flows.sale_offer_flows.id_credit_specialist
    - datalake_firestore.monday.id_credit_specialist
    description: Identification key of the QuintoAndar employee (credit specialist) responsible for the buyer's credit analysis. Composite text value, prefixed 'ID_VENDAS_' (current sales-flow system) or 'ID_MONDAY_' (legacy Firestore/Monday system, inactive since 2024) — not a plain foreign-key integer.
  id_notes_registry_specialist:
    lineage:
    - datalake_sale_offer_flows.sale_offer_flows.id_notes_registry_specialist
    - datalake_firestore.monday.id_notes_registry_specialist
    description: Identification key of the QuintoAndar employee (notes registry specialist) who handled the notary notes registry (registro de notas) step. Composite text value, prefixed 'ID_VENDAS_' (current sales-flow system) or 'ID_MONDAY_' (legacy Firestore/Monday system, inactive since 2024) — not a plain foreign-key integer.
  id_real_estate_register_specialist:
    lineage:
    - datalake_sale_offer_flows.sale_offer_flows.id_real_estate_register_specialist
    - datalake_firestore.monday.id_real_estate_register_specialist
    description: Identification key of the QuintoAndar employee (real estate register specialist) who handled the property registry (cartório) step. Composite text value, prefixed 'ID_VENDAS_' (current sales-flow system) or 'ID_MONDAY_' (legacy Firestore/Monday system, inactive since 2024) — not a plain foreign-key integer.
  partner_3p_supply:
    lineage:
    - datalake_company.company_sks.company_name
    description: Name of the third-party (3P) partner company, from QuintoAndar's real-estate partner network ("Rede"), that supplied (listed) this property, when the sale involves a 3P supply partner.
  partner_3p_demand:
    lineage:
    - datalake_company.company_sks.company_name
    description: Name of the third-party (3P) partner company, from QuintoAndar's real-estate partner network ("Rede"), that brought the buyer's demand for this property, when the sale involves a 3P demand partner.
  is_3p_supply:
    lineage:
    - datalake_sale_offer.sale_offer.is_3p_supply
    description: Boolean flag indicating if the closing flow has 3P supply partner. Obtained from sale_offer table which gets it from visit_business_model.
  is_3p_demand:
    lineage:
    - datalake_sale_offer.sale_offer.is_3p_demand
    description: Boolean flag indicating if the closing flow has 3P demand partner. Obtained from sale_offer table which gets it from visit_business_model.
  is_3p_lead_gen:
    lineage:
    - datalake_sale_offer.sale_offer.is_3p_lead_gen
    description: Boolean flag indicating if the closing flow has 3P lead generation partner. Obtained from sale_offer table which gets it from visit_business_model.
  has_3p_access_control:
    lineage:
    - datalake_sale_offer.sale_offer.has_3p_access_control
    description: Boolean flag indicating if the closing flow has any 3P access control (supply, demand, or lead gen). Obtained from sale_offer table which gets it from visit_business_model.
  days_sale_agreement_created_to_legaut_analysis_started:
    description: Number of days between the sale agreement (CCV) being created and the legal-utility (legaut) analysis starting.
  days_sale_agreement_signed_to_house_registry_started:
    description: Number of days between the sale agreement (CCV) being signed and the house registry process starting.
  days_sale_agreement_signed_to_house_registry_ended:
    description: Number of days between the sale agreement (CCV) being signed and the house registry process ending.
  days_sale_agreement_signed_to_sale_agreement_cancelled:
    description: Number of days between the sale agreement (CCV) being signed and that same agreement being cancelled.
  days_sale_agreement_signed_to_onboarding_ended:
    description: Number of days between the sale agreement (CCV) being signed and the closing onboarding ending.
  days_sale_agreement_signed_to_credit_analysis_started:
    description: Number of days between the sale agreement (CCV) being signed and the credit analysis starting.
  days_sale_agreement_signed_to_credit_analysis_ended:
    description: Number of days between the sale agreement (CCV) being signed and the credit analysis ending.
  days_sale_agreement_signed_to_financing_started:
    description: Number of days between the sale agreement (CCV) being signed and the financing process starting.
  days_sale_agreement_signed_to_financing_ended:
    description: Number of days between the sale agreement (CCV) being signed and the financing process ending.
  days_sale_agreement_signed_to_notes_registry_started:
    description: Number of days between the sale agreement (CCV) being signed and the notary notes registry starting.
  days_sale_agreement_signed_to_notes_registry_ended:
    description: Number of days between the sale agreement (CCV) being signed and the notary notes registry ending.
  days_sale_agreement_signed_to_legaut_analysis_started:
    description: Number of days between the sale agreement (CCV) being signed and the legal-utility (legaut) analysis starting.
  days_sale_agreement_signed_to_legaut_analysis_ended:
    description: Number of days between the sale agreement (CCV) being signed and the legal-utility (legaut) analysis ending.
  days_sale_agreement_signed_to_legal_risk_ended:
    description: Number of days between the sale agreement (CCV) being signed and the legal risk analysis ending.
  days_sale_agreement_signed_to_bank_legal_analysis_started:
    description: Number of days between the sale agreement (CCV) being signed and the bank legal analysis starting.
  days_sale_agreement_signed_to_legal_analysis_ended:
    description: Number of days between the sale agreement (CCV) being signed and the legal analysis ending.
  days_legal_risk_started_to_legal_risk_ended:
    description: Number of days the legal risk analysis took, from its start to its end.
  days_legal_risk_ended_to_legal_analysis_ended:
    description: Number of days between the legal risk analysis ending and the legal analysis ending.
  days_legaut_analysis_started_to_legaut_analysis_ended:
    description: Number of days the legal-utility (legaut) analysis took, from its start to its end.
  days_legaut_analysis_ended_to_legal_risk_ended:
    description: Number of days between the legal-utility (legaut) analysis ending and the legal risk analysis ending.
  days_legal_analysis_ended_notes_registry_ended:
    description: Number of days between the legal analysis ending and the notary notes registry ending.
  days_legal_analysis_ended_to_bank_legal_analysis_started:
    description: Number of days between the legal analysis ending and the bank legal analysis starting.
  days_bank_legal_analysis_started_to_financing_ended:
    description: Number of days between the bank legal analysis starting and the financing process ending.
  days_bank_legal_analysis_started_to_house_registry_started:
    description: Number of days between the bank legal analysis starting and the house registry process starting.
  days_credit_analysis_started_to_credit_analysis_ended:
    description: Number of days the credit analysis took, from its start to its end.
  days_credit_analysis_ended_to_bank_legal_analysis_started:
    description: Number of days between the credit analysis ending and the bank legal analysis starting.
  days_credit_analysis_ended_to_financing_started:
    description: Number of days between the credit analysis ending and the financing process starting.
  days_financing_started_to_bank_legal_analysis_started:
    description: Number of days between the financing process starting and the bank legal analysis starting.
  days_financing_started_to_financing_ended:
    description: Number of days the financing process took, from its start to its end.
  days_financing_ended_to_house_registry_ended:
    description: Number of days between the financing process ending and the house registry process ending.
  days_financing_ended_to_house_registry_started:
    description: Number of days between the financing process ending and the house registry process starting.
  days_notes_registry_started_to_notes_registry_ended:
    description: Number of days the notary notes registry took, from its start to its end.
  days_house_registry_started_to_house_registry_ended:
    description: Number of days the house registry process took, from its start to its end.
  days_notes_registry_ended_to_house_registry_started:
    description: Number of days between the notary notes registry ending and the house registry process starting.
  days_notes_registry_ended_to_house_registry_ended:
    description: Number of days between the notary notes registry ending and the house registry process ending.
  days_house_registry_ended_to_sale_key_delivered:
    description: Number of days between the house registry process ending and the property keys being delivered to the buyer.
  days_house_registry_ended_to_sale_transaction_paid:
    description: Number of days between the house registry process ending and the seller receiving the sale payment.
  dt_sale_agreement_created:
    lineage:
    - datalake_sale_offer.sale_offer.ts_sale_agreement_created
    description: Date when the CCV was created
  dt_sale_agreement_signed:
    lineage:
    - datalake_sale_offer.sale_offer.ts_sale_agreement_signed
    description: Date when the CCV was signed
  dt_sale_agreement_cancelled:
    lineage:
    - datalake_sale_offer_flows.sale_offer_flows.dt_sale_agreement_cancelled
    description: Date when the CCV was cancelled
  dt_sale_agreement_rescued:
    lineage:
    - datalake_sale_offer_flows.sale_offer_flows.dt_sale_agreement_rescued
    description: Date when the CCV was rescued
  dt_onboarding_ended:
    lineage:
    - datalake_sale_offer_flows.sale_offer_flows.dt_onboarding_ended
    - datalake_firestore.monday.dt_onboarding_ended
    description: Date when the post-CCV closing onboarding step was completed, marking the buyer/seller as ready to move into legal and financial analysis. Values from datalake_firestore reflect a static snapshot only (legacy system inactive since 2024).
  dt_legal_analysis_ended:
    lineage:
    - datalake_sale_offer_flows.sale_offer_flows.dt_legal_analysis_ended
    - datalake_firestore.monday.dt_legal_analysis_ended
    description: Date when the legal analysis of the deal (buyer/seller documentation and diligence) was completed, unblocking the deal to move forward to financing and registry. Values from datalake_firestore reflect a static snapshot only (legacy system inactive since 2024).
  dt_legaut_analysis_started:
    lineage:
    - datalake_sale_offer_flows.sale_offer_flows.dt_legaut_analysis_started
    - datalake_firestore.monday.dt_legaut_analysis_started
    description: Date when the legal-utility (legaut) analysis of the property — checking utility bills/debts and property legal standing — started. Values from datalake_firestore reflect a static snapshot only (legacy system inactive since 2024).
  dt_legaut_analysis_ended:
    lineage:
    - datalake_sale_offer_flows.sale_offer_flows.dt_legaut_analysis_ended
    - datalake_firestore.monday.dt_legaut_analysis_ended
    description: Date when the legal-utility (legaut) analysis of the property was completed. Values from datalake_firestore reflect a static snapshot only (legacy system inactive since 2024).
  dt_legal_risk_started:
    lineage:
    - datalake_sale_offer_flows.sale_offer_flows.dt_legal_risk_started
    - datalake_firestore.monday.dt_legal_risk_started
    description: Date when the legal risk analysis of the deal started, assessing legal blockers before the deal can proceed to financing and registry. Values from datalake_firestore reflect a static snapshot only (legacy system inactive since 2024).
  dt_legal_risk_ended:
    lineage:
    - datalake_sale_offer_flows.sale_offer_flows.dt_legal_risk_ended
    - datalake_firestore.monday.dt_legal_risk_ended
    description: Date when the legal risk analysis of the deal was completed. Values from datalake_firestore reflect a static snapshot only (legacy system inactive since 2024).
  dt_bank_legal_analysis_started:
    lineage:
    - datalake_sale_offer_flows.sale_offer_flows.dt_bank_legal_analysis_started
    - datalake_firestore.monday.dt_bank_legal_analysis_started
    description: Date when the financing bank's own legal analysis of the deal started, a prerequisite for the bank to release the mortgage funds. Values from datalake_firestore reflect a static snapshot only (legacy system inactive since 2024).
  dt_credit_analysis_started:
    lineage:
    - datalake_sale_offer_flows.sale_offer_flows.dt_credit_analysis_started
    - datalake_firestore.monday.dt_credit_analysis_started
    description: Date when the buyer's credit analysis (creditworthiness/financing eligibility check) started. Values from datalake_firestore reflect a static snapshot only (legacy system inactive since 2024).
  dt_credit_analysis_ended:
    lineage:
    - datalake_sale_offer_flows.sale_offer_flows.dt_credit_analysis_ended
    - datalake_firestore.monday.dt_credit_analysis_ended
    description: Date when the buyer's credit analysis was completed. Values from datalake_firestore reflect a static snapshot only (legacy system inactive since 2024).
  dt_financing_started:
    lineage:
    - datalake_sale_offer_flows.sale_offer_flows.dt_financing_started
    - datalake_firestore.monday.dt_financing_started
    description: Date when the mortgage/financing process with the bank started. Values from datalake_firestore reflect a static snapshot only (legacy system inactive since 2024).
  dt_financing_ended:
    lineage:
    - datalake_sale_offer_flows.sale_offer_flows.dt_financing_ended
    - datalake_firestore.monday.dt_financing_ended
    description: Date when the mortgage/financing process with the bank was completed (loan disbursement finalized). Values from datalake_firestore reflect a static snapshot only (legacy system inactive since 2024).
  dt_notes_registry_started:
    lineage:
    - datalake_sale_offer_flows.sale_offer_flows.dt_notes_registry_started
    - datalake_firestore.monday.dt_notes_registry_started
    description: Date when the notary notes registry step (registro de notas, formalizing the deed at the notary office) started. Values from datalake_firestore reflect a static snapshot only (legacy system inactive since 2024).
  dt_notes_registry_ended:
    lineage:
    - datalake_sale_offer_flows.sale_offer_flows.dt_notes_registry_ended
    - datalake_firestore.monday.dt_notes_registry_ended
    description: Date when the notary notes registry step was completed. Values from datalake_firestore reflect a static snapshot only (legacy system inactive since 2024).
  dt_house_registry_started:
    lineage:
    - datalake_sales_flow_clean.notary.ts_started
    - datalake_firestore.monday.dt_house_registry_started
    description: Date when the property registry process at the real-estate registry office (cartório de registro de imóveis) started — the final legal step transferring ownership to the buyer. Values from datalake_firestore reflect a static snapshot only (legacy system inactive since 2024).
  dt_house_registry_ended:
    lineage:
    - datalake_sales_flow_clean.notary.ts_ended
    - datalake_firestore.monday.dt_house_registry_ended
    description: Date when the property registry process ended, meaning ownership of the house has legally transferred to the buyer. Values from datalake_firestore reflect a static snapshot only (legacy system inactive since 2024).
  dt_sale_key_delivered:
    lineage:
    - datalake_sale_offer_flows.sale_offer_flows.dt_sale_key_delivered
    - datalake_firestore.monday.dt_sale_key_delivered
    description: Date when the property keys were delivered to the buyer, marking the physical handover of the house. Values from datalake_firestore reflect a static snapshot only (legacy system inactive since 2024).
  dt_sale_transacton_paid:
    lineage:
    - datalake_sales_flow_clean.mortgage_aud.ts_seller_paid
    - datalake_firestore.monday.dt_sale_transacton_paid
    description: Date when the seller received the sale payment from the financing company. In the Closing Assistance model the full closing process is not monitored, so there is no date recorded after July 2022. Values from datalake_firestore reflect a static snapshot only (legacy system inactive since 2024).
  dt_diligence_buyer_sent_at:
    lineage:
    - datalake_sale_offer_flows.sale_offer_flows.dt_diligence_buyer_sent_at
    description: Date when the due-diligence report was sent to the buyer for review/acceptance.
  dt_diligence_seller_sent_at:
    lineage:
    - datalake_sale_offer_flows.sale_offer_flows.dt_diligence_seller_sent_at
    description: Date when the due-diligence report was sent to the seller for review/acceptance.
  dt_payment_allowed:
    lineage:
    - datalake_monopoly.sale.dt_occurence
    - datalake_sales_flow_clean.diligence_aud.ts_buyer_seller_ended
    - datalake_sales_flow_clean.mortgage_aud.dt_credit_ended
    - datalake_firestore.monday.dt_legal_analysis_ended
    - datalake_firestore.monday.dt_credit_analysis_ended
    description: Date from which payment to the seller is allowed to proceed, computed by business rules that depend on the payment method (cash vs. financed vs. brokerage-term) and on the completion of legal and/or credit analysis. Values from datalake_firestore reflect a static snapshot only (legacy system inactive since 2024).
  dt_down_payment:
    lineage:
    - datalake_monopoly.sale.dt_occurence
    description: Date when the buyer's down payment (sinal) was made.
  ts_updated:
    lineage:
    - datalake_sale_offer.sale_offer.ts_updated
    description: Timestamp when the underlying offer record was last updated in the source system.
  ts_load:
    description: Timestamp indicating when this table was last refreshed by the pipeline.
