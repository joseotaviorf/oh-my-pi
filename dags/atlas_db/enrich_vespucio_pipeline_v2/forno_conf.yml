dag_documentation:
  dag_purpose:
    "Vespúcio v2 is the next generation of the Vespúcio pipeline: a simplified registry →
    normalization → address/image-enrichment → grouping → resolve → consensus chain that
    replaces the legacy staged/extract/cluster steps with a single incremental registry of
    external listings/houses. This DAG orchestrates core_v2_registry_step,
    core_v2_address_normalization_step, core_v2_general_normalization_step,
    core_v2_image_normalization_step, core_v2_images_upsert_step, core_v2_address_enrich_step,
    sources_kodak_atlas_images_job, core_v2_image_enrich_step, core_v2_photo_duplication_step,
    core_v2_artifacts_step, core_v2_publish_artifacts_step, core_v2_address_grouping_step,
    core_v2_image_grouping_step, core_v2_resolve_groups_step, core_v2_groups_step,
    core_v2_resolve_pin_step, core_v2_condominium_step,
    core_v2_publish_resolved_identities_step and plugins_classifieds_house_id_24mx.
    For more information, see the GitHub [Vespucio Repository](https://github.com/quintoandar/vespucio)"
kafka_bootstrap_servers: lkc-2yo85o-j29g53.us-east-1.aws.glb.confluent.cloud:9092
callback_by_task_failure: True
callback_by_task_success: False
webhook_vespucio_pipeline_v2: WEBHOOK_VESPUCIO_PIPELINE_FORNO
kodak_photo_sns_arn: "arn:aws:sns:us-east-1:569412621543:FornoKodakPhoto"
# No Forno-equivalent queue exists yet, so this runs in dry-run mode (job logs the
# would-be payload instead of calling SQS) until a Dev/Forno queue is provisioned.
kodak_photo_duplication_sqs_queue_url: ""

custom_cluster:
  driver_node_type_id: m5d.large
  node_type_id: m5d.large
  num_workers: 1
  spark_version: 16.4.x-scala2.12
  aws_attributes:
    ebs_volume_size: 200
    instance_profile_arn: "{{ var.value.instance_profile_secret_arn_vespucio }}"
  spark_conf:
    # Temporary: Vespúcio instance profile lacks S3 on the Databricks workspace bucket for
    # spark-event-logs/. Re-enable after IAM allows that prefix (same as default DE profile).
    spark.eventLog.enabled: "false"
    spark.driver.extraJavaOption: "-verbose:gc -XX:+PrintGCDetails -XX:+PrintGCDateStamps -XX:+UseG1GC"
    spark.executor.extraJavaOptions: "-verbose:gc -XX:+PrintGCDetails -XX:+PrintGCDateStamps -XX:+UseG1GC"
    spark.executor.heartbeatInterval: "100s"
    spark.network.timeout: "600s"
    spark.metrics.appStatusSource.enabled: "true"
