database_name: datalake_atlas_db_quality_metrics
table_name: quality_metrics
description:
  "This table contains quality metrics for Atlas DB house characteristics data collected from Amplitude events.
  It tracks auto-complete events and customer edition events to measure data quality by comparing
  original auto-completed values with customer-edited values. The table includes metrics such as
  absolute differences and percentage differences between original and edited values for various
  house characteristics (area, condo, bedrooms, parking lots, etc.). This data helps identify
  patterns in user corrections and assess the accuracy of auto-complete predictions.
  Partitioned by year, month, and day — always filter on these columns for partition pruning."
domain: Atlas DB
owner: gabriel.mota@quintoandar.com.br
columns:
  id_amplitude:
    lineage:
      - datalake_amplitude_clean.183047_atlas_db_house_characteristics_events.id_amplitude
    description: |
      "Unique identifier for the Amplitude event."
  id_session:
    lineage:
      - datalake_amplitude_clean.183047_atlas_db_house_characteristics_events.id_session
    description: |
      "Unique identifier for the user session in Amplitude."
  id_event:
    lineage:
      - datalake_amplitude_clean.183047_atlas_db_house_characteristics_events.id_event
    description: |
      "Unique identifier for the specific event in Amplitude."
  id_user:
    lineage:
      - datalake_amplitude_clean.183047_atlas_db_house_characteristics_events.id_user
    description: |
      "Unique identifier for the user who triggered the event."
  dejavuid:
    lineage:
      - datalake_amplitude_clean.183047_atlas_db_house_characteristics_events.event_properties
    description: |
      "Dejavu ID associated with the property being edited or auto-completed."
  operation_type:
    lineage:
      - datalake_amplitude_clean.183047_atlas_db_house_characteristics_events.event_properties
    description: |
      "Type of operation performed on the house characteristic data. Indicates whether the data
      was auto-completed, edited by the customer, or generated entirely by the user."
    categories:
      auto_complete: |
        "If the characteristic value was auto-completed by the system."
      customer_edition: |
        "If the characteristic value was edited by the customer and an original auto-complete value exists."
      user_generated_content: |
        "If the characteristic value was generated entirely by the user without any prior auto-complete value."
  product:
    lineage:
      - datalake_amplitude_clean.183047_atlas_db_house_characteristics_events.event_properties
    description: |
      "Product context where the event occurred (e.g., Atlas DB)."
  form_step:
    lineage:
      - datalake_amplitude_clean.183047_atlas_db_house_characteristics_events.event_properties
    description: |
      "The step in the form where the characteristic was captured or edited."
  match_type:
    lineage:
      - datalake_amplitude_clean.183047_atlas_db_house_characteristics_events.event_properties
    description: |
      "Type of match performed during the auto-complete or customer edition process."
  device_type:
    lineage:
      - datalake_amplitude_clean.183047_atlas_db_house_characteristics_events.device_type
    description: |
      "Type of device used by the user when the event was triggered (e.g., mobile, desktop)."
  characteristic_name:
    description: |
      "Name of the house characteristic being tracked. Represents different property attributes
      that can be auto-completed or edited by customers."
    categories:
      area: |
        "Total area of the property in square meters."
      condo: |
        "Condominium fee per month."
      bedrooms: |
        "Number of bedrooms in the property."
      parking_lots: |
        "Number of parking spaces available."
      house_type: |
        "Type of the property (e.g., apartment, house)."
      bathrooms: |
        "Number of bathrooms in the property."
      iptu: |
        "IPTU (property tax) value per year."
      floor: |
        "Floor number where the property is located."
      suites: |
        "Number of suites in the property."
  characteristic_value:
    description: |
      "The current value of the characteristic after auto-complete or customer edition.
      For numeric fields, the value is cleaned and extracted, removing non-numeric characters
      except for house_type which preserves the original text value."
  original_value:
    description: |
      "The original auto-completed value for the characteristic before customer edition.
      This field is NULL for auto_complete operations and user_generated_content operations
      (where no prior auto-complete value exists)."
  difference_value:
    description: |
      "Absolute difference between the customer-edited value and the original auto-completed value.
      Calculated as: characteristic_value - original_value. This field is NULL for auto_complete
      operations and user_generated_content operations."
  difference_percentual:
    description: |
      "Percentage difference between the customer-edited value and the original auto-completed value.
      Calculated as: (characteristic_value - original_value) / original_value. This field is NULL
      for auto_complete operations and user_generated_content operations. It represents how much
      the customer changed the auto-completed value in relative terms."
  ts_event:
    lineage:
      - datalake_amplitude_clean.183047_atlas_db_house_characteristics_events.ts_event
    description: |
      "Timestamp when the event occurred."
  year:
    lineage:
      - datalake_amplitude_clean.183047_atlas_db_house_characteristics_events.year
    description: |
      "Year when the event occurred. It is a partition column."
  month:
    lineage:
      - datalake_amplitude_clean.183047_atlas_db_house_characteristics_events.month
    description: |
      "Month when the event occurred. It is a partition column."
  day:
    lineage:
      - datalake_amplitude_clean.183047_atlas_db_house_characteristics_events.day
    description: |
      "Day when the event occurred. It is a partition column."
