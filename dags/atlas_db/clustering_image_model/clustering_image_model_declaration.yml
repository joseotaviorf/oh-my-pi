dag:
  name: clustering_image_model
  owner: Data Atlas DB
  schedule_start_date: 2024, 11, 28
  schedule_interval: "0 0 * * *"
  documentation:
    dag_purpose: |
      The clustering image model DAG incrementally ingests Matchmaker offline results from the
      Data Science S3 bucket. Paths are partitioned by UTC processing date (YYYY-MM-DD) under
      atlas/mm/results/, without per-region prefixes. If there is no parquet for a date in the
      load window, that day is skipped. By default (no load_start_date/load_end_date in trigger
      conf), the load window is one day: logical_date minus one calendar day (YYYY-MM-DD).
workflow:
  layer: raw
  type: custom_ingestion
  load_spark_job: load_clustering_image_model_raw
  default_extraction_type: incremental
  default_partitions: [year, month, day]
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, macros.ds_add(logical_date | ds, -1), 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, macros.ds_add(logical_date | ds, -1), 'load_end_date') }}"
  spark_job_arguments:
    - "{environment}" # env
    - "{bucket}" # datalake_bucket
    - "{dag_name}" # source
    - "{table_name}" # table_name
    - "{partitions}" # partition_cols
    - "s3://data-science.s3.data.quintoandar.com.br/atlas/mm/results/" # base_path (dated UTC folders)
    - "{load_start_date}" # load_start_date
    - "{load_end_date}" # load_end_date
  tables_customization:
    clustering_image:
      merge_on: ["id_sourcename_anchor", "id_sourcename_pair"]
      when_matched_update_condition: "source.dt_model >= target.dt_model"
