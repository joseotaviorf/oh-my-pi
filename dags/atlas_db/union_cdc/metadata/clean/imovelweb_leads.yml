---
database_name: datalake_union_cdc_clean
table_name: imovelweb_leads
owner: vitor.musachio@quintoandar.com.br
domain: Growth
description: |
  This table contains leads received through the ImovelWeb classified-ad portal integration in UnionDB.
  Each row represents one inquiry or contact event (message, visit request, etc.) submitted by a
  prospective client on an ImovelWeb listing page.
columns:
  id_imovelweb_lead:
    description: ImovelWeb lead primary key.
    lineage:
      - datalake_union_cdc_raw.leads_imovelweb.codigo
  id_company:
    description: Foreign key referencing the real-estate company that received the lead.
    lineage:
      - datalake_union_cdc_raw.leads_imovelweb.fkempresa
  id_house:
    description: Foreign key referencing the property the lead is inquiring about.
    lineage:
      - datalake_union_cdc_raw.leads_imovelweb.fkimovel
  id_portal_client:
    description: Client identifier as registered on the ImovelWeb portal side, used to reconcile leads across systems.
    lineage:
      - datalake_union_cdc_raw.leads_imovelweb.codigo_cliente_portal
  id_portal_lead:
    description: Original lead identifier assigned by the ImovelWeb portal to this inquiry.
    lineage:
      - datalake_union_cdc_raw.leads_imovelweb.idlead
  property_description:
    description: Free-text property reference/description as displayed on the ImovelWeb listing.
    lineage:
      - datalake_union_cdc_raw.leads_imovelweb.imovel
  name:
    description: Name provided by the prospective client in the ImovelWeb contact form.
    lineage:
      - datalake_union_cdc_raw.leads_imovelweb.nombre
  email:
    description: Email address provided by the prospective client in the ImovelWeb contact form.
    lineage:
      - datalake_union_cdc_raw.leads_imovelweb.email
  phone_area_code:
    description: Area code (DDD) of the phone number provided by the prospective client.
    lineage:
      - datalake_union_cdc_raw.leads_imovelweb.ddd_telefono
  phone:
    description: Phone number provided by the prospective client in the ImovelWeb contact form.
    lineage:
      - datalake_union_cdc_raw.leads_imovelweb.telefono
  message:
    description: Free-text message submitted by the prospective client through ImovelWeb.
    lineage:
      - datalake_union_cdc_raw.leads_imovelweb.mensaje
  event_type:
    description: Type of contact event reported by the portal (e.g. message, phone-reveal, visit request).
    lineage:
      - datalake_union_cdc_raw.leads_imovelweb.tipo_evento
  json_payload:
    description: Raw JSON payload received from the ImovelWeb lead API, kept for traceability/debugging.
    lineage:
      - datalake_union_cdc_raw.leads_imovelweb.json
  status:
    description: Processing status of the lead (e.g. pending, forwarded, discarded) in the source system.
    lineage:
      - datalake_union_cdc_raw.leads_imovelweb.status
  dt_lead:
    description: Date the lead/contact event was received from the portal.
    lineage:
      - datalake_union_cdc_raw.leads_imovelweb.data
  dt_paratime:
    description: Timestamp parameter used internally by the source system for CDC/data-processing control.
    lineage:
      - datalake_union_cdc_raw.leads_imovelweb.paratime
  op:
    description: DMS change-data-capture operation code for this row version (e.g. insert/update/delete), injected by the raw-to-clean CDC load process.
    lineage:
      - datalake_union_cdc_raw.leads_imovelweb.Op
  event_timestamp:
    description: Timestamp at which the DMS change-data-capture event was captured at the source, injected by the raw-to-clean CDC load process.
    lineage:
      - datalake_union_cdc_raw.leads_imovelweb.event_timestamp
