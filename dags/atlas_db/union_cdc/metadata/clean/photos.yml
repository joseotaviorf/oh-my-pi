---
database_name: datalake_union_cdc_clean
table_name: photos
owner: gabriel.mota@quintoandar.com.br
domain: Atlas DB
description: |
  This table contains property photo metadata from UnionDB, storing information about images associated
  with property listings. It includes photo identifiers, file paths, ordering sequences, and links to
  related properties and companies. This table enables tracking and management of visual content for
  real estate listings across the platform.
columns:
  id_photo:
    description: Primary key identifying each photo.
    lineage:
      - datalake_union_cdc_raw.fotos.codigo
  id_company:
    description: Primary key identifying the company associated with the photo.
    lineage:
      - datalake_union_cdc_raw.fotos.fkEmpresa
  id_house:
    description: Primary key identifying the house associated with the photo.
    lineage:
      - datalake_union_cdc_raw.fotos.fkimovel
  referencia_imovel:
    description: Reference code for the property associated with the photo.
    lineage:
      - datalake_union_cdc_raw.fotos.referencia_imovel
  descricao:
    description: Description of the photo.
    lineage:
      - datalake_union_cdc_raw.fotos.descricao
  arqfoto:
    description: File name of the photo.
    lineage:
      - datalake_union_cdc_raw.fotos.arqfoto
  fotosel:
    description: Flag indicating whether the photo is selected.
    lineage:
      - datalake_union_cdc_raw.fotos.fotosel
  ordem:
    description: Order of the photo.
    lineage:
      - datalake_union_cdc_raw.fotos.ordem
  minia:
    description: File name of the thumbnail of the photo.
    lineage:
      - datalake_union_cdc_raw.fotos.minia
  tipo:
    description: Type of the photo.
    lineage:
      - datalake_union_cdc_raw.fotos.tipo
  flagdesk:
    description: Flag indicating whether the photo is for desktop use.
    lineage:
      - datalake_union_cdc_raw.fotos.flagdesk
  dt_paratime:
    description: Date and time when the photo was taken or uploaded.
    lineage:
      - datalake_union_cdc_raw.fotos.paratime
  codigo_importacao:
    description: Import code associated with the photo.
    lineage:
      - datalake_union_cdc_raw.fotos.codigo_importacao
