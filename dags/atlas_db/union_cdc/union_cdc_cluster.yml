cluster:
  type: consolidation_m_memory_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
    aws_attributes:
      ebs_volume_size: 200
    runtime_engine: PHOTON
    num_workers: 3
    node_type_id: r6gd.2xlarge
    driver_node_type_id: r6gd.4xlarge
validation:
  cluster:
    type: consolidation_s_general_cluster
    databricks_conn_id: databricks_new
    custom_configurations:
      aws_attributes:
        ebs_volume_size: 200
      num_workers: 3
      runtime_engine: PHOTON
      driver_node_type_id: r6g.2xlarge
