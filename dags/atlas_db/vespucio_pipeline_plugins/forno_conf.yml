dag_documentation:
  dag_purpose:
    "Vespúcio plugins (Forno): Elasticsearch indexers, classifieds, zordominium, and related jobs that run after the
    core Vespúcio pipeline. For background, see the [Vespucio Repository](https://github.com/quintoandar/vespucio)."
elastic_search_url: "https://vpc-vespucio-forno-us-east-1-3l2ywytq5dagy7tdeitbyxew7m.us-east-1.es.amazonaws.com/"
sqs_url_house_enrichment: "https://sqs.us-east-1.amazonaws.com/632540934959/DevMainHouseEnrichmentHousesToBeReEnriched"
kodak_photo_sns_arn: "arn:aws:sns:us-east-1:569412621543:FornoKodakPhoto"
callback_by_task_failure: True
callback_by_task_success: False
webhook_vespucio_pipeline: WEBHOOK_VESPUCIO_PIPELINE_FORNO

custom_cluster:
  driver_node_type_id: m5d.large
  node_type_id: m5d.large
  num_workers: 1
  spark_version: 16.4.x-scala2.12
  aws_attributes:
    ebs_volume_size: 200
    instance_profile_arn: "{{ var.value.instance_profile_secret_arn_vespucio }}"
  spark_conf:
    # Temporary: Vespúcio instance profile lacks S3 on the Databricks workspace bucket for
    # spark-event-logs/. Re-enable after IAM allows that prefix (same as default DE profile).
    spark.eventLog.enabled: "false"
    spark.driver.extraJavaOption: "-verbose:gc -XX:+PrintGCDetails -XX:+PrintGCDateStamps -XX:+UseG1GC"
    spark.executor.extraJavaOptions: "-verbose:gc -XX:+PrintGCDetails -XX:+PrintGCDateStamps -XX:+UseG1GC"
    spark.executor.heartbeatInterval: "100s"
    spark.network.timeout: "600s"
    spark.metrics.appStatusSource.enabled: "true"
