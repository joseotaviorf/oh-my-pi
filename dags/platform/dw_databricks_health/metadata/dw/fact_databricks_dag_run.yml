---
database_name: dw_databricks_health
table_name: fact_databricks_dag_run
description: |
  Logical Airflow DAG execution grain rolled up from `fact_databricks_task_run`.
  One row per (`id_databricks_workspace`, `airflow_dag_id`, minute bucket of `ts_run_started`).
  Parallel Databricks job runs whose tasks share the same DAG id and the same
  start-minute bucket collapse into one row; numeric measures sum and P95 utilisation
  metrics are weighted by task `execution_duration_seconds`.

  Downstream metric-layer DAG `metric_observability__dags` consumes this table for
  `dag_health` and `dag_health_wow` (one logical run = one row here).
  Cost fields are task/dag-attributed operational estimates; use
  dw_databricks_costs.fact_databricks_costs for total Databricks cost tracking.
  EC2 source/confidence columns indicate whether values before retained
  node_timeline coverage came from billable_usage machine-hour estimates.

domain: Data Ops & Governance
owner: data-platform-team@quintoandar.com.br
columns:
  sk_databricks_dag_run:
    description: Surrogate key — `xxhash64(id_databricks_workspace, airflow_dag_id, unix_ts(minute_bucket))`.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.id_databricks_workspace
      - dw_databricks_health.fact_databricks_task_run.airflow_dag_id
      - dw_databricks_health.fact_databricks_task_run.ts_run_started
  id_databricks_workspace:
    description: Databricks workspace identifier.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.id_databricks_workspace
  airflow_dag_id:
    description: Airflow DAG identifier (`tags['airflow_dag_id']` when present).
    lineage:
      - dw_databricks_health.fact_databricks_task_run.airflow_dag_id
  ts_logical_run_started:
    description: Minute bucket — `date_trunc('MINUTE', ts_run_started)` from task runs in the group.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.ts_run_started
  sk_dag_run_started_date:
    description: Date surrogate key (`yyyyMMdd`) for the logical run start date.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.dt_task_started
  team_owner:
    description: Governance tag — `FIRST` within the logical-run group.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.team_owner
  cost_center:
    description: Governance tag — `FIRST` within the logical-run group.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.cost_center
  ecosystem:
    description: Governance tag — `FIRST` within the logical-run group.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.ecosystem
  environment:
    description: Governance tag — `FIRST` within the logical-run group.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.environment
  provisioner:
    description: Governance tag — `FIRST` within the logical-run group.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.provisioner
  data_classification:
    description: LGPD / data-classification label — `FIRST IGNORE NULLS` within the logical-run group.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.data_classification
  driver_node_type:
    description: Driver instance type of the DBU-dominant cluster in the logical bucket (`MAX_BY` on total_dbu_consumed).
    lineage:
      - dw_databricks_health.fact_databricks_task_run.driver_node_type
      - dw_databricks_health.fact_databricks_task_run.total_dbu_consumed
  worker_node_type:
    description: Worker instance type of the DBU-dominant cluster in the logical bucket (`MAX_BY` on total_dbu_consumed). Null for single-node clusters.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.worker_node_type
      - dw_databricks_health.fact_databricks_task_run.total_dbu_consumed
  worker_count:
    description: Configured fixed worker count of the DBU-dominant cluster (`MAX_BY` on total_dbu_consumed). Null when that cluster autoscales.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.worker_count
      - dw_databricks_health.fact_databricks_task_run.total_dbu_consumed
  peak_concurrent_workers:
    description: Maximum peak concurrent worker count observed across tasks in the bucket (`MAX`). Reflects realised worker usage, not configuration.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.peak_concurrent_workers
  primary_cluster_name:
    description: Cluster name of the DBU-dominant cluster in the logical bucket (`MAX_BY` on total_dbu_consumed).
    lineage:
      - dw_databricks_health.fact_databricks_task_run.cluster_name
      - dw_databricks_health.fact_databricks_task_run.total_dbu_consumed
  primary_cluster_source:
    description: Cluster source of the DBU-dominant cluster (`MAX_BY` on total_dbu_consumed) — JOB, UI, API, etc.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.cluster_source
      - dw_databricks_health.fact_databricks_task_run.total_dbu_consumed
  primary_dbr_version:
    description: DBR version of the DBU-dominant cluster (`MAX_BY` on total_dbu_consumed).
    lineage:
      - dw_databricks_health.fact_databricks_task_run.dbr_version
      - dw_databricks_health.fact_databricks_task_run.total_dbu_consumed
  primary_min_autoscale_workers:
    description: Autoscale lower bound of the DBU-dominant cluster (`MAX_BY` on total_dbu_consumed). Null for fixed-size clusters.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.min_autoscale_workers
      - dw_databricks_health.fact_databricks_task_run.total_dbu_consumed
  primary_max_autoscale_workers:
    description: Autoscale upper bound of the DBU-dominant cluster (`MAX_BY` on total_dbu_consumed). Null for fixed-size clusters.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.max_autoscale_workers
      - dw_databricks_health.fact_databricks_task_run.total_dbu_consumed
  primary_run_type:
    description: Databricks run type of the DBU-dominant parent run (`MAX_BY` on total_dbu_consumed) — JOB_RUN or SUBMIT_RUN.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.run_type
      - dw_databricks_health.fact_databricks_task_run.total_dbu_consumed
  total_dbu_consumed:
    description: Sum of task-level `total_dbu_consumed` in the logical bucket.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.total_dbu_consumed
  total_dbu_cost_usd:
    description: Sum of task-level `total_dbu_cost_usd` (negotiated DBU USD) in the logical bucket.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.total_dbu_cost_usd
  total_dbu_list_cost_usd:
    description: Sum of task-level `total_dbu_list_cost_usd` (list-rate USD audit) in the logical bucket.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.total_dbu_list_cost_usd
  total_ec2_cost_calculated_usd:
    description: Sum of task-attributed calculated EC2 USD for tasks in the logical bucket. This is an operational attribution, not a full company cost total.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.total_ec2_cost_calculated_usd
  ec2_spot_hours:
    description: Sum of task-attributed EC2 Spot node wall-clock hours across tasks in the bucket (not DBU).
    lineage:
      - dw_databricks_health.fact_databricks_task_run.ec2_spot_hours
  ec2_on_demand_hours:
    description: Sum of task-attributed EC2 on-demand node wall-clock hours across tasks in the bucket (not DBU).
    lineage:
      - dw_databricks_health.fact_databricks_task_run.ec2_on_demand_hours
  ec2_source:
    description: Source of EC2 hours and cost for this DAG-run bucket, rolled up from task runs with retained node_timeline coverage preferred over billable_usage_estimate, then missing, then not_applicable.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.ec2_source
  is_ec2_estimated:
    description: True when any task-attributed EC2 in the DAG-run bucket came from billable_usage.machine_hours estimates before retained node_timeline coverage.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.is_ec2_estimated
  ec2_pricing_missing:
    description: True when any task-attributed EC2 in the DAG-run bucket had missing dim_ec2_price coverage and was priced at zero.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.ec2_pricing_missing
  ec2_unpriced_hours:
    description: Sum of task-attributed EC2 node-hours priced at zero because no matching dim_ec2_price hourly rate was found.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.ec2_unpriced_hours
  total_cost_usd:
    description: Sum of task-level `total_cost_usd` (negotiated DBU USD + task-attributed calculated EC2) in the bucket.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.total_cost_usd
  dbu_pricing_sku:
    description: Dominant DBU billing SKU label — `FIRST` within the logical-run group.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.dbu_pricing_sku
  dbu_rate_usd:
    description: Dominant list USD-per-DBU — `FIRST` within the logical-run group.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.dbu_rate_usd
  n_databricks_job_runs:
    description: Distinct Databricks parent run ids (`COUNT(DISTINCT id_databricks_run)`) in this logical bucket.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.id_databricks_run
  n_failed_databricks_job_runs:
    description: Distinct parent Databricks runs with `run_result_state = 'FAILED'` in this logical bucket.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.id_databricks_run
      - dw_databricks_health.fact_databricks_task_run.run_result_state
  n_task_runs:
    description: Task-run rows rolled into this logical bucket (`COUNT(DISTINCT id_databricks_task_run)`).
    lineage:
      - dw_databricks_health.fact_databricks_task_run.id_databricks_task_run
  n_failed_task_runs:
    description: Count of task runs with `is_failed` in this logical bucket.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.is_failed
  n_task_runs_with_stage_data:
    description: Count of task runs with Spark stage attribution (`has_stage_data`).
    lineage:
      - dw_databricks_health.fact_databricks_task_run.has_stage_data
  n_pool_acquisition_slow_tasks:
    description: Count of tasks flagged `is_pool_acquisition_slow` in the bucket.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.is_pool_acquisition_slow
  n_stage_attribution_ambiguous_task_runs:
    description: Count of task runs flagged `is_stage_attribution_ambiguous` in the bucket.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.is_stage_attribution_ambiguous
  total_wall_clock_seconds:
    description: Wall span from earliest task start to latest task end in the bucket (`MAX(ts_task_ended) - MIN(ts_task_started)`).
    lineage:
      - dw_databricks_health.fact_databricks_task_run.ts_task_started
      - dw_databricks_health.fact_databricks_task_run.ts_task_ended
  total_execution_duration_seconds:
    description: Sum of task execution durations in the bucket.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.execution_duration_seconds
  total_setup_duration_seconds:
    description: Sum of task setup durations in the bucket.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.setup_duration_seconds
  max_pre_init_script_seconds:
    description: Maximum pre-init-script seconds among tasks in the bucket (DBR pull / network setup before init scripts).
    lineage:
      - dw_databricks_health.fact_databricks_task_run.pre_init_script_seconds
  max_init_script_seconds:
    description: Maximum init-script seconds among tasks in the bucket.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.init_script_seconds
  max_post_init_script_seconds:
    description: Maximum post-init-script seconds among tasks in the bucket (JVM warm-up after init scripts).
    lineage:
      - dw_databricks_health.fact_databricks_task_run.post_init_script_seconds
  max_cluster_startup_seconds:
    description: Maximum cluster startup seconds among tasks in the bucket.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.cluster_startup_seconds
  weighted_avg_p50_driver_cpu_busy_percent:
    description: P50 (median) driver CPU busy percent weighted by `execution_duration_seconds` across tasks.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.p50_driver_cpu_busy_percent
      - dw_databricks_health.fact_databricks_task_run.execution_duration_seconds
  weighted_avg_p95_driver_cpu_busy_percent:
    description: P95 driver CPU busy percent weighted by `execution_duration_seconds` across tasks.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.p95_driver_cpu_busy_percent
      - dw_databricks_health.fact_databricks_task_run.execution_duration_seconds
  weighted_avg_p50_driver_cpu_wait_percent:
    description: P50 (median) driver I/O wait percent weighted by `execution_duration_seconds` across tasks.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.p50_driver_cpu_wait_percent
      - dw_databricks_health.fact_databricks_task_run.execution_duration_seconds
  weighted_avg_p95_driver_cpu_wait_percent:
    description: P95 driver CPU I/O wait percent weighted by `execution_duration_seconds` across tasks.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.p95_driver_cpu_wait_percent
      - dw_databricks_health.fact_databricks_task_run.execution_duration_seconds
  weighted_avg_p50_driver_mem_used_percent:
    description: P50 (median) driver memory used percent weighted by `execution_duration_seconds` across tasks.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.p50_driver_mem_used_percent
      - dw_databricks_health.fact_databricks_task_run.execution_duration_seconds
  weighted_avg_p95_driver_mem_used_percent:
    description: P95 driver memory used percent weighted by `execution_duration_seconds` across tasks.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.p95_driver_mem_used_percent
      - dw_databricks_health.fact_databricks_task_run.execution_duration_seconds
  weighted_avg_p50_worker_cpu_busy_percent:
    description: P50 (median) worker CPU busy percent weighted by `execution_duration_seconds` across tasks.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.p50_worker_cpu_busy_percent
      - dw_databricks_health.fact_databricks_task_run.execution_duration_seconds
  weighted_avg_p95_worker_cpu_busy_percent:
    description: P95 worker CPU busy percent weighted by `execution_duration_seconds` across tasks.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.p95_worker_cpu_busy_percent
      - dw_databricks_health.fact_databricks_task_run.execution_duration_seconds
  weighted_avg_p50_worker_cpu_wait_percent:
    description: P50 (median) worker I/O wait percent weighted by `execution_duration_seconds` across tasks.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.p50_worker_cpu_wait_percent
      - dw_databricks_health.fact_databricks_task_run.execution_duration_seconds
  weighted_avg_p95_worker_cpu_wait_percent:
    description: P95 worker CPU I/O wait percent weighted by `execution_duration_seconds` across tasks.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.p95_worker_cpu_wait_percent
      - dw_databricks_health.fact_databricks_task_run.execution_duration_seconds
  weighted_avg_p50_worker_mem_used_percent:
    description: P50 (median) worker memory used percent weighted by `execution_duration_seconds` across tasks.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.p50_worker_mem_used_percent
      - dw_databricks_health.fact_databricks_task_run.execution_duration_seconds
  weighted_avg_p95_worker_mem_used_percent:
    description: P95 worker memory used percent weighted by `execution_duration_seconds` across tasks.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.p95_worker_mem_used_percent
      - dw_databricks_health.fact_databricks_task_run.execution_duration_seconds
  weighted_avg_local_disk_utilization_pct_p95:
    description: Local disk utilisation P95 weighted by `execution_duration_seconds` across tasks.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.local_disk_utilization_pct_p95
      - dw_databricks_health.fact_databricks_task_run.execution_duration_seconds
  stage_count:
    description: Sum of Spark stage counts across tasks in the bucket (NULL stage metrics on ambiguous tasks are excluded at task grain).
    lineage:
      - dw_databricks_health.fact_databricks_task_run.stage_count
  failed_stage_count:
    description: Sum of failed Spark stage counts across tasks in the bucket.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.failed_stage_count
  spark_app_count:
    description: Sum of distinct Spark application counts attributed to tasks in the bucket.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.spark_app_count
  total_executor_run_time_ms:
    description: Sum of executor run-time milliseconds across tasks in the bucket.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.total_executor_run_time_ms
  total_executor_cpu_time_ms:
    description: Sum of executor CPU time milliseconds across tasks in the bucket.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.total_executor_cpu_time_ms
  total_disk_bytes_spilled:
    description: Sum of disk bytes spilled across tasks in the bucket.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.total_disk_bytes_spilled
  total_memory_bytes_spilled:
    description: Sum of memory bytes spilled across tasks in the bucket.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.total_memory_bytes_spilled
  total_input_bytes_read:
    description: Sum of input bytes read across tasks in the bucket.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.total_input_bytes_read
  total_output_bytes_written:
    description: Sum of output bytes written across tasks in the bucket.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.total_output_bytes_written
  max_peak_execution_memory_bytes:
    description: Maximum peak execution memory among tasks in the bucket.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.max_peak_execution_memory_bytes
  max_jvm_heap_bytes:
    description: Maximum JVM heap bytes among tasks in the bucket.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.max_jvm_heap_bytes
  total_gc_time_ms:
    description: Sum of GC time milliseconds across tasks in the bucket.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.total_gc_time_ms
  max_task_run_time_ms:
    description: Slowest single-task wall-clock execution time among tasks in the bucket, in milliseconds.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.max_task_run_time_ms
  max_task_skew_ratio:
    description: Maximum task skew ratio among tasks in the bucket.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.max_task_skew_ratio
  total_shuffle_bytes_read:
    description: Sum of shuffle bytes read across tasks in the bucket.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.total_shuffle_bytes_read
  total_shuffle_bytes_written:
    description: Sum of shuffle bytes written across tasks in the bucket.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.total_shuffle_bytes_written
  last_stage_failure_reason:
    description: Failure reason from the most recent task with a non-null `last_stage_failure_reason` in the bucket (`MAX_BY` on `ts_task_ended`).
    lineage:
      - dw_databricks_health.fact_databricks_task_run.last_stage_failure_reason
      - dw_databricks_health.fact_databricks_task_run.ts_task_ended
  is_any_task_failed:
    description: True if any task in the bucket failed.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.is_failed
  is_any_task_success:
    description: True if any task in the bucket succeeded.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.is_success
  is_any_databricks_run_failed:
    description: True if any parent Databricks run in the bucket has `run_result_state = 'FAILED'`.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.run_result_state
  is_any_photon:
    description: True when any task in the bucket ran on a Photon DBR image.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.is_photon
  is_any_pool_backed:
    description: True when any task in the bucket used an instance-pool-backed cluster.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.is_pool_backed
  is_any_local_nvme:
    description: True when any task in the bucket used an instance type with local NVMe storage.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.has_local_nvme
  is_any_sensitive_data:
    description: True when any task in the bucket carried the sensitive-data cluster tag.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.is_sensitive_data
  is_any_stage_attribution_ambiguous:
    description: True when any task in the bucket had ambiguous Spark stage attribution (`spark_app_count > 1`).
    lineage:
      - dw_databricks_health.fact_databricks_task_run.is_stage_attribution_ambiguous
  is_job_on_interactive:
    description: |
      TRUE when any task in the bucket matches the interactive billing slice
      (`ALL_PURPOSE` / `INTERACTIVE` DBU on the cluster, or `JOBS` on a UI/API cluster).
      BOOL_OR rollup of `fact_databricks_task_run.is_job_on_interactive`. Filter
      `NOT is_job_on_interactive` for the orchestrated slice.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.is_job_on_interactive
  dbu_negotiated_price_missing:
    description: TRUE when any task in the bucket fell back to the list DBU rate (no matching negotiated dim_dbu_price row).
    lineage:
      - dw_databricks_health.fact_databricks_task_run.dbu_negotiated_price_missing
  dt_dag_run_started:
    description: Calendar date of the logical run start (minute bucket date).
    lineage:
      - dw_databricks_health.fact_databricks_task_run.dt_task_started
  ts_run_started_min:
    description: Earliest `ts_run_started` among tasks in the bucket.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.ts_run_started
  ts_run_ended_max:
    description: Latest `ts_run_ended` among tasks in the bucket.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.ts_run_ended
  ts_load:
    description: Pipeline load timestamp.
  year:
    description: Partition — year of `dt_dag_run_started`.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.dt_task_started
  month:
    description: Partition — month of `dt_dag_run_started`.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.dt_task_started
  day:
    description: Partition — day of `dt_dag_run_started`.
    lineage:
      - dw_databricks_health.fact_databricks_task_run.dt_task_started
