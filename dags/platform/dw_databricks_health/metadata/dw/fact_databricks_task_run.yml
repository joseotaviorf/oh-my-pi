---
database_name: dw_databricks_health
table_name: fact_databricks_task_run
description: |
  Per Databricks task-run health fact for workloads present in Lakeflow
  (system.lakeflow.job_task_run_timeline). One row per
  (id_databricks_workspace, id_databricks_run, id_databricks_task_run). Covers
  all job clusters that appear in the timeline for the load window — including
  bietlejuice, quintoml / wonka, customer-data-platform, and other
  provisioners — not only `tags['provisioner'] = 'bietlejuice'`.

  Joins seven sources:
    - system.lakeflow.job_task_run_timeline (spine — per-task-run, setup time)
    - system.lakeflow.job_run_timeline      (parent run state, run_type)
    - system.compute.clusters               (cluster spec snapshots — latest)
    - system.billing.usage                  (DBU per cluster, hourly buckets)
    - system.billing.list_prices            (AWS USD list rate per DBU SKU)
    - datalake_databricks_health.daily_cluster_health (PR 23079 — P50/P95 util)
    - datalake_databricks_health.spark_stage_metrics  (PR 23080 — Spark stages)

  Cost attribution: billing usage rows are hour-bucketed. The fact sums DBU and
  estimated USD per (workspace_id, cluster_id) for the load window, then
  allocates each task run a share equal to its wall-clock duration on that
  cluster divided by the sum of task durations on the same cluster (equal
  split when all task durations are zero). This matches cluster-level system
  billing and avoids both missing DBU (task-window join on hour buckets) and
  double-counting across parallel tasks on one cluster.

  USD conversion uses system.billing.list_prices.pricing.default (list rate
  in USD per DBU, AWS cloud) joined on sku_name + valid time window on each
  usage row. `pricing_sku` and `dbu_rate_usd` reflect the dominant SKU by DBU
  volume on the cluster for the window. pricing_sku and dbu_rate_usd are
  exposed alongside cost_usd_estimate so consumers can audit the conversion or
  apply their own currency conversion (e.g. BRL via the QuintoAndar finance FX
  rate). No Graviton or instance-pool discount applies to DBUs (validated in
  bietlejuice/spark_debugging/mcp_a4_dbu_list_prices.sql); cost savings on
  those come from EC2 cost and faster wall-clock.

  Stage-attribution caveat: spark_stage_metrics is keyed by id_spark_app,
  not task_run_id (the event-log path layout doesn't carry task_id). We
  attribute each Spark application to a task by matching dag_id +
  spark_app_first_seen ∈ [ts_task_started, ts_task_ended]. The match key is
  COALESCE(cluster `application` tag, billing `usage_metadata.job_name`,
  cluster_name) so non-bietlejuice clusters can still align when tags are
  missing. For DAGs with parallel tasks of the same dag_id the same spark_app may
  match multiple task windows and the `is_stage_attribution_ambiguous`
  flag fires. **In that case the rolled-up stage-metric columns
  (`total_*`, `max_*`, `stage_count`, `failed_stage_count`) are set to
  NULL** so SUM/AVG aggregates over the fact stay honest. The diagnostic
  columns (`spark_app_count`, `last_stage_failure_reason`,
  `is_stage_attribution_ambiguous`, `has_stage_data`) remain populated.
  Consumers wanting the (over-counted) raw values can still query
  `datalake_databricks_health.spark_stage_metrics` directly.

  Governance columns (`team_owner`, `cost_center`, `ecosystem`, etc.) come from
  cluster tags when set; they are NULL for clusters without those tags.

  Supersedes (does NOT yet retire) the cost-related legacy DAGs
  enrich_databricks_usage_costs, enrich_databricks_job_runs and
  databricks_usage. Actual deletion happens in follow-up PRs once this fact
  proves parity (~2 weeks of side-by-side runs).
domain: Data Ops & Governance
owner: data-platform-team@quintoandar.com.br
columns:
  sk_databricks_task_run:
    description: Surrogate key for the task-run. `xxhash64(id_databricks_workspace, id_databricks_run, id_databricks_task_run)`. Stable across re-runs.
  sk_databricks_run:
    description: Surrogate key for the parent Databricks job run. Same xxhash64 of (workspace_id, run_id) used by future dim_databricks_run.
  sk_databricks_cluster:
    description: Surrogate key for the cluster. `xxhash64(workspace_id, cluster_id)`. Same hash will be used by future dim_databricks_cluster.
  sk_task_started_date:
    description: Date surrogate key in `yyyyMMdd` integer form, derived from `dt_task_started`. Joinable to a future `dim_date` via `id_date`.
  id_databricks_workspace:
    description: Databricks workspace identifier.
    lineage:
      - system.lakeflow.job_task_run_timeline.workspace_id
  id_databricks_run:
    description: Databricks run identifier (the parent run that contains this task run).
    lineage:
      - system.lakeflow.job_task_run_timeline.run_id
  id_databricks_task_run:
    description: Databricks task-run identifier (unique per task attempt within a run).
    lineage:
      - system.lakeflow.job_task_run_timeline.task_run_id
  id_databricks_job:
    description: Databricks job identifier (the multi-task job definition).
    lineage:
      - system.lakeflow.job_task_run_timeline.job_id
  id_databricks_task_key:
    description: Human-readable task key from the Databricks job spec (e.g. `load_table_x`).
    lineage:
      - system.lakeflow.job_task_run_timeline.task_key
  id_cluster:
    description: Databricks cluster identifier — first element of `compute_ids` from the Lakeflow task-run timeline (the cluster that executed this task).
    lineage:
      - system.lakeflow.job_task_run_timeline.compute_ids
  databricks_run_url:
    description: |
      Click-through URL to the Databricks UI for the parent run
      (`<workspace_host>/jobs/<job_id>/runs/<run_id>`). Per-workspace mapping
      mirrors `dags/platform/enrich_databricks/spark_jobs/prod_conf.yml` and `forno_conf.yml`.
      Falls back to the Databricks accounts portal for unknown workspace IDs.
    lineage:
      - system.lakeflow.job_task_run_timeline.workspace_id
      - system.lakeflow.job_task_run_timeline.job_id
      - system.lakeflow.job_task_run_timeline.run_id
  airflow_dag_id:
    description: |
      Workload identifier for grouping and joins. COALESCE of cluster `application`
      tag, `system.billing.usage.usage_metadata.job_name` (dominant DBU row on the
      cluster for the load window), then `cluster_name` when tags are absent.
      When the raw value matches Airflow run naming (`_scheduled__`, `_manual__`,
      `_dataset__`, `_dataset_triggered__` before the timestamp), it is normalized:
      strip optional `job-<id>-run-<id>-` prefix, take the base before the run-type
      marker, then map `bietlejuice-` → `bietlejuice.` and `quintoml-wonka-` →
      `quintoml.wonka.` so metrics aggregate on canonical DAG IDs (e.g.
      `bietlejuice.metabase`, `quintoml.wonka.contract_collection_segmentation`).
    lineage:
      - system.compute.clusters.tags
      - system.billing.usage.usage_metadata
      - system.compute.clusters.cluster_name
  airflow_task_id:
    description: Airflow `task_id` extracted from the cluster `task_id` tag. Identifies the specific task within the DAG that triggered this Spark application.
    lineage:
      - system.compute.clusters.tags
  team_owner:
    description: |
      Team or person responsible for the workload, lifted from the cluster `owner` tag
      when present (e.g. bietlejuice-managed clusters). NULL when the tag is not set.
    lineage:
      - system.compute.clusters.tags
  cost_center:
    description: |
      Internal cost-center code from the cluster `cost-center` tag when present.
      NULL when not set on the cluster.
    lineage:
      - system.compute.clusters.tags
  ecosystem:
    description: |
      Logical ecosystem from the cluster `ecosystem` tag when present. NULL when
      not set.
    lineage:
      - system.compute.clusters.tags
  environment:
    description: |
      Value from the cluster `environment` tag when present (`forno`, `prod`, etc.).
      NULL when not set.
    lineage:
      - system.compute.clusters.tags
  data_classification:
    description: |
      LGPD / data-classification label from the cluster `data-classification` tag
      when present. NULL when not set.
    lineage:
      - system.compute.clusters.tags
  provisioner:
    description: |
      System that provisioned the cluster from the `provisioner` tag (e.g.
      `bietlejuice`, `quintoml`, `customer-data-platform`). NULL when the tag is absent.
    lineage:
      - system.compute.clusters.tags
  cluster_name:
    description: Cluster name (typically `<dag_id>_<run_id>` for job clusters).
    lineage:
      - system.compute.clusters.cluster_name
  cluster_source:
    description: How the cluster was created — JOB, UI, API, etc. JOB clusters have 1:1 task attribution; non-JOB clusters share billing across concurrent tasks.
    lineage:
      - system.compute.clusters.cluster_source
  driver_node_type:
    description: Driver instance type (e.g. `m5a.xlarge`, `r5d.2xlarge`).
    lineage:
      - system.compute.clusters.driver_node_type
  worker_node_type:
    description: Worker instance type. Null for single-node clusters.
    lineage:
      - system.compute.clusters.worker_node_type
  dbr_version:
    description: Databricks runtime version, e.g. `16.4.x-scala2.12` or `16.4.x-photon-scala2.12`.
    lineage:
      - system.compute.clusters.dbr_version
  worker_count:
    description: Fixed worker count for non-autoscaling clusters. Null when autoscaling.
    lineage:
      - system.compute.clusters.worker_count
  min_autoscale_workers:
    description: Lower bound of the autoscale range. Null for fixed-size clusters.
    lineage:
      - system.compute.clusters.min_autoscale_workers
  max_autoscale_workers:
    description: Upper bound of the autoscale range. Null for fixed-size clusters.
    lineage:
      - system.compute.clusters.max_autoscale_workers
  peak_concurrent_workers:
    description: Maximum number of distinct worker instances observed in any single minute on the day this task ran.
    lineage:
      - datalake_databricks_health.daily_cluster_health.peak_concurrent_workers
  run_type:
    description: Databricks run type — `JOB_RUN` (scheduled / triggered job) or `SUBMIT_RUN` (one-off API submission).
    lineage:
      - system.lakeflow.job_run_timeline.run_type
  run_result_state:
    description: Final state of the parent Databricks run (`SUCCEEDED`, `FAILED`, `CANCELED`, ...).
    lineage:
      - system.lakeflow.job_run_timeline.result_state
  task_result_state:
    description: Final state of this task-run (`SUCCEEDED`, `FAILED`, `CANCELED`, ...).
    lineage:
      - system.lakeflow.job_task_run_timeline.result_state
  total_duration_seconds:
    description: Wall-clock duration of the task in seconds (`ts_task_ended - ts_task_started`). Includes setup + execution.
  execution_duration_seconds:
    description: Useful execution time (`total_duration_seconds - setup_duration_seconds`). What the task spent doing actual work, excluding cluster cold-start.
  dbu_consumed:
    description: |
      DBUs allocated to this task run — cluster total DBU for the load window
      (from `system.billing.usage`, scoped to clusters in Lakeflow for this run)
      multiplied by this task's share of total task wall-clock seconds on that
      cluster. Aligns with hour-bucketed billing without mis-joining usage rows to
      sub-hour task windows.
    lineage:
      - system.billing.usage.usage_quantity
      - system.billing.usage.usage_metadata
  cost_usd_estimate:
    description: |
      Estimated USD for this task run — cluster total (`SUM(usage_quantity × list
      price)` per usage row) multiplied by the same duration share as `dbu_consumed`.
      Uses list price (no enterprise / promotional discount). NULL rate components
      are treated as zero on each usage row before summing.
    lineage:
      - system.billing.usage.usage_quantity
      - system.billing.list_prices.pricing
  dbu_rate_usd:
    description: |
      USD-per-DBU list rate for `pricing_sku` evaluated at `load_end_date` from
      `system.billing.list_prices`. NULL when the dominant SKU has no matching price row.
    lineage:
      - system.billing.list_prices.pricing
  pricing_sku:
    description: |
      Dominant Databricks SKU on the cluster for the load window (SKU with the
      largest summed `usage_quantity` among DBU rows for that cluster). Used with
      `dbu_rate_usd` for audit; the task-level `dbu_consumed` / `cost_usd_estimate`
      can still blend multiple SKUs at the cluster aggregate before pro-rating.
    lineage:
      - system.billing.usage.sku_name
  total_ec2_cost_calculated_usd:
    description: |
      Cluster-day EC2 USD estimated from `system.compute.node_timeline` wall-clock
      hours per node × `overwatch.instancedetails.On_Demand_Cost_Hourly` by instance
      API name. Spot clusters (`aws_attributes.availability` contains SPOT): hourly
      rate multiplied by 0.37 vs on-demand. Same cluster-day on every task row —
      dedupe before SUM at DAG grain.
    lineage:
      - datalake_databricks_health.daily_cluster_health.total_ec2_cost_calculated_usd
  spot_hours:
    description: |
      Sum of driver + worker node-hours on the cluster-day counted as Spot pricing
      (availability contains SPOT). Instance-hours, not cluster-hours.
    lineage:
      - datalake_databricks_health.daily_cluster_health.spot_hours
  on_demand_hours:
    description: |
      Sum of driver + worker node-hours on the cluster-day counted as on-demand
      pricing (non-Spot or NULL availability). Instance-hours.
    lineage:
      - datalake_databricks_health.daily_cluster_health.on_demand_hours
  total_ec2_cost_overwatch_usd:
    description: |
      Cluster-day total EC2 / instance compute cost in USD from Overwatch. Useful for
      "true cost" views (DBU + AWS infrastructure); system tables only expose DBU
      SKUs, not the underlying EC2 pricing. Same cluster-day dedupe caveat applies.
    lineage:
      - datalake_databricks_health.daily_cluster_health.total_ec2_cost_overwatch_usd
  total_dbu_cost_overwatch_usd:
    description: |
      Cluster-day total DBU cost in USD from Overwatch (`overwatch.clusterstatefact`).
      Independent cross-check of the system-tables-derived `cost_usd_estimate` trail —
      material disagreement (>10%) usually indicates Overwatch-vs-Lakeflow attribution
      drift on the underlying SKU. Same cluster-day dedupe caveat as the
      `*_script_seconds` columns.
    lineage:
      - datalake_databricks_health.daily_cluster_health.total_dbu_cost_overwatch_usd
  total_cost_overwatch_usd:
    description: |
      Sum of Overwatch cluster-day DBU USD and EC2 USD (`total_dbu_cost_overwatch_usd`
      + `total_ec2_cost_overwatch_usd`). Full Overwatch cost trail for cross-checks.
    lineage:
      - datalake_databricks_health.daily_cluster_health.total_dbu_cost_overwatch_usd
      - datalake_databricks_health.daily_cluster_health.total_ec2_cost_overwatch_usd
  total_cost_usd:
    description: |
      Estimated total USD for this task run: system-tables DBU (`cost_usd_estimate`)
      plus cluster-day calculated EC2 (`total_ec2_cost_calculated_usd`). Uses
      calculated EC2 so all workspaces are covered; Overwatch-only EC2 remains in
      `total_ec2_cost_overwatch_usd` for cross-check where Overwatch ingests the workspace.
    lineage:
      - system.billing.usage.usage_quantity
      - system.billing.list_prices.pricing
      - datalake_databricks_health.daily_cluster_health.total_ec2_cost_calculated_usd
  p50_driver_cpu_busy_percent:
    description: Median driver CPU busy percent on the cluster-day.
    lineage:
      - datalake_databricks_health.daily_cluster_health.p50_driver_cpu_busy_percent
  p95_driver_cpu_busy_percent:
    description: 95th percentile driver CPU busy percent on the cluster-day. Above ~80 indicates a driver CPU bottleneck.
    lineage:
      - datalake_databricks_health.daily_cluster_health.p95_driver_cpu_busy_percent
  p50_driver_cpu_wait_percent:
    description: Median driver I/O wait percent on the cluster-day.
    lineage:
      - datalake_databricks_health.daily_cluster_health.p50_driver_cpu_wait_percent
  p95_driver_cpu_wait_percent:
    description: 95th percentile driver I/O wait percent. Above ~5 suggests the driver is I/O bound.
    lineage:
      - datalake_databricks_health.daily_cluster_health.p95_driver_cpu_wait_percent
  p50_driver_mem_used_percent:
    description: Median driver memory used percent on the cluster-day.
    lineage:
      - datalake_databricks_health.daily_cluster_health.p50_driver_mem_used_percent
  p95_driver_mem_used_percent:
    description: 95th percentile driver memory used percent. Above ~80 indicates driver memory pressure.
    lineage:
      - datalake_databricks_health.daily_cluster_health.p95_driver_mem_used_percent
  p50_worker_cpu_busy_percent:
    description: Median worker CPU busy percent across all worker observations on the cluster-day.
    lineage:
      - datalake_databricks_health.daily_cluster_health.p50_worker_cpu_busy_percent
  p95_worker_cpu_busy_percent:
    description: 95th percentile worker CPU busy percent. Below ~30 suggests workers are over-provisioned.
    lineage:
      - datalake_databricks_health.daily_cluster_health.p95_worker_cpu_busy_percent
  p50_worker_cpu_wait_percent:
    description: Median worker I/O wait percent.
    lineage:
      - datalake_databricks_health.daily_cluster_health.p50_worker_cpu_wait_percent
  p95_worker_cpu_wait_percent:
    description: 95th percentile worker I/O wait percent. Above ~5 suggests workers are I/O bound — keep NVMe / consider Photon.
    lineage:
      - datalake_databricks_health.daily_cluster_health.p95_worker_cpu_wait_percent
  p50_worker_mem_used_percent:
    description: Median worker memory used percent.
    lineage:
      - datalake_databricks_health.daily_cluster_health.p50_worker_mem_used_percent
  p95_worker_mem_used_percent:
    description: 95th percentile worker memory used percent. Below ~50 suggests memory over-provisioning.
    lineage:
      - datalake_databricks_health.daily_cluster_health.p95_worker_mem_used_percent
  local_disk_utilization_pct_p95:
    description: |
      Alias of daily_cluster_health `nvme_utilization_pct_p95`: utilization of the
      `/local_disk0` mount (Databricks ephemeral local disk — NVMe instance store on
      `d`-family shapes, EBS-backed on others). 0–100 scale.
    lineage:
      - datalake_databricks_health.daily_cluster_health.nvme_utilization_pct_p95
  has_local_nvme:
    description: |
      TRUE when the worker or driver instance type typically includes physical NVMe
      instance store (`d` before size separator, or storage/GPU families such as i3/g5),
      derived from `driver_node_type` / `worker_node_type`. Does not read utilization.
    lineage:
      - system.compute.clusters.driver_node_type
      - system.compute.clusters.worker_node_type
  stage_count:
    description: Number of Spark stages observed for this task-run (sum across all attributed Spark applications). Useful as a sanity check and as a denominator for "stages-per-task" rollups.
    lineage:
      - datalake_databricks_health.spark_stage_metrics
  failed_stage_count:
    description: Number of Spark stages that ended with a non-NULL failure reason. A non-zero value combined with `is_success = TRUE` typically means task-level retries succeeded after an early stage failure.
    lineage:
      - datalake_databricks_health.spark_stage_metrics.is_stage_failed
  spark_app_count:
    description: Distinct Spark application count attributed to this task-run by the dag_id + start-time-window join. Always 1 for normal sequential-task DAGs; values > 1 fire `is_stage_attribution_ambiguous` and indicate parallel tasks of the same dag_id whose Spark application start times overlap.
    lineage:
      - datalake_databricks_health.spark_stage_metrics.id_spark_app
  total_executor_run_time_ms:
    description: Sum of executor wall-clock time across all stages in this task-run, in milliseconds. From `spark_stage_metrics.executor_run_time_ms`. Useful as the denominator for GC-overhead and CPU-utilization ratios at the task-run level.
    lineage:
      - datalake_databricks_health.spark_stage_metrics.executor_run_time_ms
  total_executor_cpu_time_ms:
    description: Sum of executor CPU time across all stages in this task-run, in milliseconds (converted from the underlying nanosecond accumulator). From `spark_stage_metrics.executor_cpu_time_ns / 1e6`. Compare with `total_executor_run_time_ms` to compute CPU efficiency — values approaching 1 indicate fully CPU-bound work; values much lower than 1 indicate I/O wait, GC, or scheduling overhead.
    lineage:
      - datalake_databricks_health.spark_stage_metrics.executor_cpu_time_ns
  total_disk_bytes_spilled:
    description: Sum of bytes spilled from memory to local disk (NVMe / EBS) across all stages in this task-run. Non-zero values indicate memory pressure within the task; the headline NVMe-utilization signal at task-run level.
    lineage:
      - datalake_databricks_health.spark_stage_metrics.disk_bytes_spilled
  total_memory_bytes_spilled:
    description: Sum of bytes that would have been written to disk if no spill (logical pre-serialization size) across all stages in this task-run. Always >= `total_disk_bytes_spilled`.
    lineage:
      - datalake_databricks_health.spark_stage_metrics.memory_bytes_spilled
  max_peak_execution_memory_bytes:
    description: Maximum peak on-heap execution memory used by any single task in any stage of this task-run, in bytes. Useful for sizing executor memory at the DAG / task level.
    lineage:
      - datalake_databricks_health.spark_stage_metrics.peak_execution_memory_bytes
  total_input_bytes_read:
    description: Sum of bytes read from data sources (S3, JDBC, etc.) across all stages in this task-run. From `spark_stage_metrics.input_bytes_read`.
    lineage:
      - datalake_databricks_health.spark_stage_metrics.input_bytes_read
  total_output_bytes_written:
    description: Sum of bytes written to data sinks (S3, JDBC, etc.) across all stages in this task-run. From `spark_stage_metrics.output_bytes_written`.
    lineage:
      - datalake_databricks_health.spark_stage_metrics.output_bytes_written
  total_shuffle_bytes_read:
    description: Sum of bytes read from shuffle (local + remote) across all stages in this task-run. From `spark_stage_metrics.shuffle_read_local_bytes + shuffle_read_remote_bytes`.
    lineage:
      - datalake_databricks_health.spark_stage_metrics.shuffle_read_local_bytes
      - datalake_databricks_health.spark_stage_metrics.shuffle_read_remote_bytes
  total_shuffle_bytes_written:
    description: Sum of bytes this task-run wrote to shuffle (consumed by downstream stages). From `spark_stage_metrics.shuffle_write_bytes`.
    lineage:
      - datalake_databricks_health.spark_stage_metrics.shuffle_write_bytes
  max_jvm_heap_bytes:
    description: |
      Maximum JVM heap memory used by any single executor in any stage of this task-run,
      in bytes. From `spark_stage_metrics.max_jvm_heap_bytes`. Requires
      `spark.eventLog.logStageExecutorMetrics=true` (enabled by PR #23078); will be
      NULL for stages parsed before that landed. Useful for sizing
      `spark.executor.memory`: a value approaching the configured heap suggests
      executors are at risk of GC pressure or OOM.
    lineage:
      - datalake_databricks_health.spark_stage_metrics.max_jvm_heap_bytes
  total_gc_time_ms:
    description: |
      Total executor GC time (minor + major) across all stages in this task-run, in
      milliseconds. From `spark_stage_metrics.total_gc_time_ms`. Compare with
      `total_executor_run_time_ms` to compute GC overhead ratio — a healthy
      task-run typically sits well under 10%. Requires PR #23078; NULL for older stages.
    lineage:
      - datalake_databricks_health.spark_stage_metrics.total_gc_time_ms
  max_task_run_time_ms:
    description: |
      Slowest single-task wall-clock execution time across all stages in this task-run,
      in milliseconds. From `spark_stage_metrics.max_task_run_time_ms`. Combined with
      `max_task_skew_ratio` for skew detection at the task-run level. Requires PR #23078.
    lineage:
      - datalake_databricks_health.spark_stage_metrics.max_task_run_time_ms
  max_task_skew_ratio:
    description: |
      Maximum task-skew ratio (`max_task_run_time_ms / median_task_run_time_ms`) observed
      in any stage of this task-run. From `spark_stage_metrics.task_skew_ratio`. Values
      around 1 indicate balanced partitions; values above ~4 are a strong signal of
      data skew worth investigating in at least one stage. Requires PR #23078.
    lineage:
      - datalake_databricks_health.spark_stage_metrics.task_skew_ratio
  last_stage_failure_reason:
    description: |
      Failure reason string of the most recent failed stage attributed to this task-run
      (chronological by `ts_stage_completed`). NULL when no stage failed across any of
      the task-run's Spark applications. First-glance "what crashed?" answer for failed
      runs without leaving the fact table; deeper drill-down (full stack trace, attempt
      history) still requires `datalake_databricks_health.spark_stage_metrics`.
    lineage:
      - datalake_databricks_health.spark_stage_metrics.stage_failure_reason
      - datalake_databricks_health.spark_stage_metrics.is_stage_failed
      - datalake_databricks_health.spark_stage_metrics.ts_stage_completed
  is_success:
    description: True when `task_result_state = 'SUCCEEDED'`.
  is_failed:
    description: True when `task_result_state = 'FAILED'`.
  is_photon:
    description: True when the cluster's DBR is a Photon image.
    lineage:
      - datalake_databricks_health.daily_cluster_health.is_photon
  is_pool_backed:
    description: True when the cluster has a `driver_instance_pool_id` or `worker_instance_pool_id` set.
    lineage:
      - datalake_databricks_health.daily_cluster_health.is_pool_backed
  is_pool_acquisition_slow:
    description: True when `setup_duration_seconds > 90`. The 90s threshold is the O4 alerting line — sustained high values mean the underlying pool is undersized.
  is_sensitive_data:
    description: |
      True when the cluster `sensitive-data` tag is `'true'`. False or NULL when
      unset or any other value.
    lineage:
      - system.compute.clusters.tags
  has_stage_data:
    description: |
      True when the time-window join into `spark_stage_metrics` matched at least one
      Spark application for this task-run. False for tasks whose Spark event log
      hasn't landed yet (delayed S3 PUT), tasks that ran before PR 23078 enabled
      eventLog, or non-Spark tasks. When false, all `total_*` / `max_*` /
      `*_skew_ratio` columns and `stage_count` / `failed_stage_count` /
      `spark_app_count` / `last_stage_failure_reason` are NULL.
  is_stage_attribution_ambiguous:
    description: |
      True when more than one distinct `id_spark_app` matched this task-run via the
      dag_id + start-time-window join (`spark_app_count > 1`). Indicates a DAG with
      concurrent tasks of the same `dag_id` whose Spark applications started within
      overlapping windows.

      **When this flag is true, the rolled-up stage-metric columns (`total_*`,
      `max_*`, `stage_count`, `failed_stage_count`) are NULL** to keep aggregates
      honest — SUM/AVG would otherwise over-count the same Spark app once per
      concurrent task. Diagnostic columns (`spark_app_count`,
      `last_stage_failure_reason`, `has_stage_data`) stay populated. Consumers
      wanting the over-counted raw values can query `spark_stage_metrics`
      directly. Workloads with a single Spark application per task window do not
      trigger this flag.
  setup_duration_seconds:
    description: Cluster cold-start time for this task in seconds — time spent acquiring instances and bootstrapping before the first user code executes. Headline pool-effectiveness metric (O4). On pooled clusters this is typically 30–60s; on non-pooled it is 4–8 minutes.
    lineage:
      - system.lakeflow.job_task_run_timeline.setup_duration_seconds
  pre_init_script_seconds:
    description: |
      Seconds spent in cluster STARTING before init scripts begin (DBR pull, network
      setup, instance provisioning). Cluster-day attribute — every task run on the
      same (id_cluster, dt_task_started) carries the same value, so SUM aggregations
      at task-run grain over-count; dedupe to (id_cluster, dt_task_started) first.
    lineage:
      - datalake_databricks_health.daily_cluster_health.pre_init_script_seconds
  init_script_seconds:
    description: |
      **Init-script execution duration in seconds.** Headline metric for the
      "optimise-or-remove init scripts" workstream (DPLT-928). Same cluster-day
      caveat as `pre_init_script_seconds`: dedupe to (id_cluster, dt_task_started)
      before SUM. Fleet baseline is mean ~95s, p95 ~210s.
    lineage:
      - datalake_databricks_health.daily_cluster_health.init_script_seconds
  post_init_script_seconds:
    description: |
      Seconds between INIT_SCRIPTS_FINISHED and the cluster entering RUNNING
      (mostly Spark/JVM warm-up). Same cluster-day dedupe caveat applies.
    lineage:
      - datalake_databricks_health.daily_cluster_health.post_init_script_seconds
  cluster_startup_seconds:
    description: |
      Total wall-clock startup (`pre + init + post`) for the FIRST start of the
      cluster on `dt_task_started`. Same cluster-day dedupe caveat applies.
      Subsequent restarts within the same day are not captured.
    lineage:
      - datalake_databricks_health.daily_cluster_health.cluster_startup_seconds
  dt_task_started:
    description: Task start date (UTC), derived from the earliest `period_start_time` of the task's lifecycle.
  ts_task_started:
    description: Task start timestamp (UTC), `MIN(period_start_time)` across the task's lifecycle event rows.
  ts_task_ended:
    description: Task end timestamp (UTC), `MAX(period_end_time)` across the task's lifecycle event rows.
  ts_run_started:
    description: Parent run start timestamp (UTC). May be earlier than `ts_task_started` if other tasks ran before this one.
  ts_run_ended:
    description: Parent run end timestamp (UTC).
  ts_load:
    description: Timestamp the row was written by the DAG.
  year:
    description: Year of `dt_task_started` (partition column).
  month:
    description: Month of `dt_task_started` (partition column).
  day:
    description: Day of `dt_task_started` (partition column).
