dag:
  name: dw_databricks_health
  owner: Data Life Cycle
  documentation:
    dag_purpose: |
      Per-Airflow-task-run health fact that joins Databricks system tables
      (system.lakeflow.job_run_timeline, system.lakeflow.job_task_run_timeline,
      system.compute.clusters, system.billing.usage, system.billing.list_prices)
      with the cluster-shape + utilisation slice produced by
      enrich_databricks_health (PR 23079) and the per-stage Spark execution
      metrics produced by enrich_spark_event_logs (PR 23080). DBU usage is
      converted to USD using list_prices (AWS USD per DBU); see table metadata
      for attribution and pricing caveats.

      One row per (id_databricks_workspace, id_databricks_run, id_databricks_task_run).
      Equivalently for the bietlejuice framework: one row per Airflow task
      instance, since query_delta DAGs use job clusters (1 task = 1 cluster
      = 1 Databricks job run).

      Stage-attribution: spark_stage_metrics is keyed by id_spark_app, not
      task_run_id (the event-log path layout doesn't carry task_id). We
      attribute Spark applications to tasks by matching dag_id +
      spark_app_first_seen ∈ [ts_task_started, ts_task_ended]. Sequential-
      task DAGs match uniquely; parallel-task DAGs of the same dag_id may
      match the same spark_app to multiple task windows and the
      `is_stage_attribution_ambiguous` flag fires.

      Supersedes (does NOT yet retire) the cost-related legacy DAGs
      enrich_databricks_usage_costs, enrich_databricks_job_runs and
      databricks_usage. Actual deletion happens in follow-up PRs once this
      fact proves parity (~2 weeks of side-by-side runs).
workflow:
  type: query_delta
  layer: dw
  custom_schema: databricks_health
  default_extraction_type: incremental
  has_hive_sync: true
  tables_customization:
    fact_databricks_task_run:
      partitions: [ year, month, day ]
      table_privileges:
        data-platform-engineers:
          - ALL PRIVILEGES
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, -2), 'load_start_date') }}"
    load_end_date:   "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds,  1), 'load_end_date') }}"
    environment:     "{{ var.value.environment }}"
cluster:
  type: consolidation_s_general_single_node_cluster
  databricks_conn_id: databricks_new_env
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
