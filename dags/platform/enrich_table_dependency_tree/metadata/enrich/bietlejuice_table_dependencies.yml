---
database_name: datalake_databricks
table_name: bietlejuice_table_dependencies
description: |
  Daily direct table-to-table dependencies inferred from bi-etl-ejuice SQL files.
  Each row links a dependent table (the query output) to a source table referenced in
  that query, resolved via dag_inventory and regex-based table_usage_in_queries.
  Exact and fuzzy matching cover standard and non-standard DAG naming (datamarts, crawlers).
  Used for lineage, cost attribution, and Trino usage rollups. Partitioned by year,
  month, and day (execution date). Filter on year, month, and day for partition pruning.
domain: Data Ops & Governance
owner: gustavo.akashi@quintoandar.com.br
columns:
  dependent_dag_name:
    description: Airflow DAG that materializes the dependent table in bi-etl-ejuice.
    lineage:
      - datalake_dag_inventory_clean.table.dag
  dependent_task_name:
    description: Airflow task within dependent_dag_name that writes the dependent table.
    lineage:
      - datalake_dag_inventory_clean.table.task
  dependent_table_name:
    description: Fully qualified dependent table (schema.table) produced by the query.
    lineage:
      - datalake_dag_inventory_clean.table.table
  dependency_table_name:
    description: Source table referenced in the dependent query (the upstream dependency).
    lineage:
      - datalake_databricks_clean.table_usage_in_queries.used_table
  year:
    description: Execution-date year partition. Filter with month and day for pruning.
    lineage:
      - datalake_databricks_clean.table_usage_in_queries.year
  month:
    description: Execution-date month partition. Filter with year and day for pruning.
    lineage:
      - datalake_databricks_clean.table_usage_in_queries.month
  day:
    description: Execution-date day partition. Filter with year and month for pruning.
    lineage:
      - datalake_databricks_clean.table_usage_in_queries.day
