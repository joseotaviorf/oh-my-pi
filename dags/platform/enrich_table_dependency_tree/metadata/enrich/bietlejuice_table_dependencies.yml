---
database_name: datalake_databricks
table_name: bietlejuice_table_dependencies
description: |
  "Associates each dependent table with a dependency table. This data is extracted from bietlejuice queries daily."
domain: Data Ops & Governance 
owner: data-platform-team@quintoandar.com.br
columns:
  dependent_dag_name:
    description: Name of the Airflow DAG that loads the dependent table on bietlejuice
    lineage:
      - datalake_dag_inventory_clean.table.dag
  dependent_task_name:
    description: Name of the Airflow task that loads the dependent table on bietlejuice
    lineage:
      - datalake_dag_inventory_clean.table.task
  dependent_table_name:
    description: Name of the dependent table (i.e., table that depends on the other table)
    lineage:
      - datalake_dag_inventory_clean.table.table
  dependency_table_name:
    description: Name of the dependency table (i.e., table that the dependent table depends on)
    lineage:
      - datalake_databricks_clean.table_usage_in_queries.used_table
  year:
    description: Year of the execution date
    lineage:
      - datalake_databricks_clean.table_usage_in_queries.year
  month:
    description: Month of the execution date
    lineage:
      - datalake_databricks_clean.table_usage_in_queries.month
  day:
    description: Day of the execution date
    lineage:
      - datalake_databricks_clean.table_usage_in_queries.day
