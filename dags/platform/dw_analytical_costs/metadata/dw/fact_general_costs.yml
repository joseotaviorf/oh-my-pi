---
database_name: dw_analytical_costs
table_name: fact_general_costs
description: |
  Transactional fact table that aims to store general processing cost information in Databricks. 
  Each row in the table must have a unique cost business key.
domain: Data Platform 
owner: data-platform-team@quintoandar.com.br
columns:
  sk_snapshot:
    description: Execution record identification key, based on id_cluster/id_dag/id_job and execution time.
    lineage:
      - dw_analytical_costs.fact_bietlejuce_costs.sk_snapshot
      - dw_analytical_costs.fact_execution_costs.sk_snapshot
      - dw_analytical_costs.fact_job_costs.sk_snapshot
  sk_dag:
    description: Identification key of the dag linked to the execution.
    lineage:
      - dw_analytical_costs.fact_bietlejuce_costs.sk_dag
  sk_cluster:
    description: Databricks cluster key.
    lineage:
      - dw_analytical_costs.fact_execution_costs.sk_cluster
  sk_job:
    description: Identification key of the executed job.
    lineage:
      - dw_analytical_costs.fact_job_costs.sk_job
  sk_cluster_config:
    description: Unique identification key for a combination.
    lineage:
      - dw_analytical_costs.fact_bietlejuce_costs.sk_cluster_config
      - dw_analytical_costs.fact_execution_costs.sk_cluster_config
      - dw_analytical_costs.fact_job_costs.sk_cluster_config
  sk_execution_date:
    description: Execution date identification key.
    lineage:
      - dw_analytical_costs.fact_bietlejuce_costs.sk_execution_date
      - dw_analytical_costs.fact_execution_costs.sk_execution_date
      - dw_analytical_costs.fact_job_costs.sk_execution_date
  sk_spark_updated_date:
    description: Key identifying the date the spark version was changed.
    lineage:
      - dw_analytical_costs.fact_bietlejuce_costs.sk_spark_updated_date
      - dw_analytical_costs.fact_job_costs.sk_spark_updated_date
  cluster_name:
    description: Descriptive information about the cluster name.
    lineage:
      - dw_analytical_costs.fact_bietlejuce_costs.cluster_name
      - dw_analytical_costs.fact_execution_costs.cluster_name
      - dw_analytical_costs.fact_job_costs.cluster_name
  job_name:
    description: Descriptive information about the job name.
    lineage:
      - dw_analytical_costs.fact_bietlejuce_costs.job_name
      - dw_analytical_costs.fact_execution_costs.job_name
      - dw_analytical_costs.fact_job_costs.job_name
  dbus:
    description: Cluster cost measured by the official databricks unit. 
    lineage:
      - dw_analytical_costs.fact_bietlejuce_costs.dbus
      - dw_analytical_costs.fact_execution_costs.dbus
      - dw_analytical_costs.fact_job_costs.dbus
  price:
    description: Cost generated by dag.
    lineage:
      - dw_analytical_costs.fact_bietlejuce_costs.price
      - dw_analytical_costs.fact_execution_costs.price
      - dw_analytical_costs.fact_job_costs.price
  daily_executions:
    description: Executions of the same context that occurred on the day analyzed.
    lineage:
      - dw_analytical_costs.fact_bietlejuce_costs.daily_executions
      - dw_analytical_costs.fact_job_costs.daily_executions
  spark_version_number:
    description: Numerical information that indicates which version of Spark is running.
    lineage:
      - dw_analytical_costs.fact_bietlejuce_costs.spark_version_number
      - dw_analytical_costs.fact_execution_costs.spark_version_number
      - dw_analytical_costs.fact_job_costs.spark_version_number
  is_dag_builder_migrated:
    description: Boolean information that indicates whether the dag is linked to a job during execution.
    lineage:
      - dw_analytical_costs.fact_bietlejuce_costs.is_dag_builder_migrated
  ts_first_execution:
    description: Date information in timestamp format that indicates when the first daily execution of the dag/job occurred.
    lineage:
      - dw_analytical_costs.fact_bietlejuce_costs.ts_bietlejuice_first_execution
      - dw_analytical_costs.fact_job_costs.ts_job_first_execution
  ts_last_execution:
    description: Date information in timestamp format that indicates when the last daily execution of the dag/job occurred.
    lineage:
      - dw_analytical_costs.fact_bietlejuce_costs.ts_bietlejuice_last_execution
      - dw_analytical_costs.fact_job_costs.ts_job_last_execution
  ts_execution:
    description: Date information in timestamp format that indicates when the cluster execution occurred.
    lineage:
      - dw_analytical_costs.fact_execution_costs.ts_execution
  year:
    description: Year when the data was loaded.
    lineage:
      - dw_analytical_costs.fact_bietlejuce_costs.year
      - dw_analytical_costs.fact_execution_costs.year
      - dw_analytical_costs.fact_job_costs.year
  month:
    description: Month when the data was loaded.
    lineage:
      - dw_analytical_costs.fact_bietlejuce_costs.month
      - dw_analytical_costs.fact_execution_costs.month
      - dw_analytical_costs.fact_job_costs.month
  day:
    description: Day when the data was loaded.
    lineage:
      - dw_analytical_costs.fact_bietlejuce_costs.day
      - dw_analytical_costs.fact_execution_costs.day
      - dw_analytical_costs.fact_job_costs.day
  