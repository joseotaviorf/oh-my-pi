---
database_name: dw_analytical_costs
table_name: fact_job_costs
description: Daily snapshot fact table with the aim of gathering the main cost information generated in Databricks by scheduled jobs. 
  Each row in this table represents a unique combination of date and job key.
domain: Data Platform 
owner: data-platform-team@quintoandar.com.br
columns:
  sk_snapshot:
    description: Unique snapshot identification key.
    lineage:
      - datalake_databricks_usage_costs.usage_costs.id_job
      - datalake_databricks_usage_costs.usage_costs.dt_execution
  sk_job:
    description: Identification key of the executed job.
    lineage:
      - datalake_databricks_usage_costs.usage_costs.id_job
  sk_cluster_config:
    description: Unique identification key for a combination.
    lineage:
      - datalake_databricks_usage_costs.usage_costs.cluster_compute_type
      - datalake_databricks_usage_costs.usage_costs.execution_context
      - datalake_databricks_usage_costs.usage_costs.spark_version
      - datalake_databricks_usage_costs.usage_costs.runtime_engine
  sk_execution_date:
    description: Execution date identification key.
    lineage:
      - datalake_databricks_usage_costs.usage_costs.dt_execution
  sk_spark_updated_date:
    description: Key identifying the date the spark version was changed.
    lineage:
      - datalake_databricks_usage_costs.usage_costs.dt_spark_updated
  cluster_name:
    description: Descriptive information about the cluster name.
    lineage:
      - datalake_databricks_usage_costs.usage_costs.cluster_name
  job_name:
    description: Descriptive information about the job name.
    lineage:
      - datalake_databricks_usage_costs.usage_costs.job_name
  dbus:
    description: Cluster cost measured by the official databricks unit.
    lineage:
      - datalake_databricks_usage_costs.usage_costs.dbus
  price:
    description: Cost generated by dag.
    lineage:
      - datalake_databricks_usage_costs.usage_costs.price
  daily_executions:
    description: Executions of the same context that occurred on the day analyzed.
    lineage:
      - datalake_databricks_usage_costs.usage_costs.daily_executions
  spark_version_number:
    description: Numerical information that indicates which version of Spark is running.
    lineage:
      - datalake_databricks_usage_costs.usage_costs.spark_version_number
  ts_job_first_execution:
    description: Date information in timestamp format that indicates when the first daily execution of the job occurred.
    lineage:
      - datalake_databricks_usage_costs.usage_costs.ts_job_first_execution
  ts_job_last_execution:
    description: Date information in timestamp format that indicates when the last daily execution of the job occurred.
    lineage:
      - datalake_databricks_usage_costs.usage_costs.ts_job_last_execution
  year:
    description: Year when the data was loaded.
    lineage:
      - datalake_databricks_usage_costs.usage_costs.year
  month:
    description: Month when the data was loaded.
    lineage:
      - datalake_databricks_usage_costs.usage_costs.month
  day:
    description: Day when the data was loaded.
    lineage:
      - datalake_databricks_usage_costs.usage_costs.day
  ts_load:
    description: This timestamp indicates when this data was loaded into dw_analytical_costs.
