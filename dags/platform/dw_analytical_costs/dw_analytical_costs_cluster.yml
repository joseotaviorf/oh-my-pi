cluster:
  type: emr_7_12_consolidation_m_memory_cluster
  custom_configurations:
    # Cost-saving spot/OD mix: 1 CORE on-demand + 2 TASK spot (~67% spot).
    # num_workers is the TOTAL (CORE + TASK), so 3 = 1 CORE + 2 TASK.
    # Master stays ON_DEMAND (m7g.xlarge) per emr_consolidation_base anchor.
    num_workers: 3
    num_task_workers: 2
    spark_conf:
      # Driver (m7g.xlarge — 4 vCPU / 16 GB)
      spark.driver.memory: 8g
      spark.driver.cores: "4"
      # Workers are r7g.2xlarge (8 vCPU / 64 GB each); 3 workers (1 CORE + 2 TASK).
      # 2 execs/worker × 4 cores = 8 cores fully utilized.
      # 2 × 26g (24g heap + 2g overhead) = 52 GB / 64 GB per worker.
      spark.executor.memory: 24g
      spark.executor.cores: "4"
      spark.dynamicAllocation.minExecutors: "2"
      spark.dynamicAllocation.maxExecutors: "6"
