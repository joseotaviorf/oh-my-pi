---
database_name: datalake_astro_clean
table_name: task_instance
owner: gustavo.akashi@quintoandar.com.br
domain: Data Platform
description: |
  Clean layer for Airflow task instance state exported from the Astronomer (Astro) production
  metadata database. One row per task instance representing the current execution state within a
  DAG run; grain is (id_task, id_dag, id_run, map_index) per export snapshot. Captures operator,
  executor, pool, queue, retry counters, and lifecycle timestamps from queue through completion.
  Consumed by Data Platform observability for task runtime analytics, SLA tracking, and failure
  triage; merged downstream in enrich_airflow with Composer task_instance history. Part of the
  astro ingestion DAG. Partitioned by year, month, and day (export snapshot date). Always filter
  on year, month, and day in WHERE clauses to enable partition pruning and avoid full table scans;
  align partition filters with ts_started date ranges. Example: WHERE year = 2026 AND month = 6
  AND day BETWEEN 1 AND 7.
columns:
  id_task:
    description: |
      Task identifier within the DAG. Together with id_dag and id_run forms the composite business
      key for a task instance; add map_index for mapped tasks.
    lineage:
      - datalake_astro_raw.task_instance.task_id
  id_dag:
    description: |
      Airflow DAG identifier containing this task instance. Join to dag_run on id_dag and id_run
      for run-level state and scheduling context.
    lineage:
      - datalake_astro_raw.task_instance.dag_id
  id_run:
    description: |
      String run identifier of the DAG run this task instance belongs to, joinable to
      dag_run.id_run within the same id_dag.
    lineage:
      - datalake_astro_raw.task_instance.run_id
  id_queued_by_job:
    description: |
      Identifier of the scheduler job that queued this task instance for execution, useful for
      correlating queue delays with specific scheduler heartbeat cycles.
    lineage:
      - datalake_astro_raw.task_instance.queued_by_job_id
  id_process:
    description: |
      Operating-system process ID of the worker process that executed this task instance on the
      worker node, for low-level debugging of orphaned processes.
    lineage:
      - datalake_astro_raw.task_instance.pid
  id_trigger:
    description: |
      Foreign key to the deferrable trigger record when this task instance entered deferred state
      waiting on an async triggerer callback; null for standard synchronous operators.
    lineage:
      - datalake_astro_raw.task_instance.trigger_id
  id_job:
    description: |
      Foreign key to the Airflow job record associated with this task instance execution, linking
      to executor-level job metadata in the Astro database.
    lineage:
      - datalake_astro_raw.task_instance.job_id
  task_state:
    description: |
      Current lifecycle state of the task instance (e.g. queued, running, success, failed,
      up_for_retry, skipped, deferred). Reflects the latest state at export time, not full history.
    lineage:
      - datalake_astro_raw.task_instance.state
  hostname:
    description: |
      Hostname of the worker node where this task instance executed or is currently running,
      used for worker-level capacity and failure hotspot analysis.
    lineage:
      - datalake_astro_raw.task_instance.hostname
  unixname:
    description: |
      Unix username under which the worker process ran this task instance on the worker node,
      relevant for permission and impersonation debugging.
    lineage:
      - datalake_astro_raw.task_instance.unixname
  pool:
    description: |
      Airflow pool name controlling concurrency for this task instance. Tasks in the same pool
      compete for a shared slot limit configured in Astro.
    lineage:
      - datalake_astro_raw.task_instance.pool
  queue:
    description: |
      Celery or Kubernetes executor queue name routing this task instance to a specific worker
      pool or node group in the Astro deployment.
    lineage:
      - datalake_astro_raw.task_instance.queue
  operator:
    description: |
      Fully qualified Python class name of the operator executed by this task instance (e.g.
      BashOperator, PythonOperator), identifying the task type for runtime profiling.
    lineage:
      - datalake_astro_raw.task_instance.operator
  custom_operator_name:
    description: |
      Optional custom display name for the operator when the DAG author overrides the default
      operator label in the Astro UI task view.
    lineage:
      - datalake_astro_raw.task_instance.custom_operator_name
  executor:
    description: |
      Executor type that ran this task instance (e.g. CeleryExecutor, KubernetesExecutor,
      LocalExecutor), indicating which worker infrastructure handled the attempt.
    lineage:
      - datalake_astro_raw.task_instance.executor
  task_display_name:
    description: |
      Human-readable task label shown in the Astro UI when the DAG author sets an explicit
      display name on the task; falls back to id_task when unset.
    lineage:
      - datalake_astro_raw.task_instance.task_display_name
  map_index:
    description: |
      Index of this instance within a dynamically mapped task expansion; -1 for standard
      non-mapped tasks. Required to disambiguate mapped task instances sharing id_task.
    lineage:
      - datalake_astro_raw.task_instance.map_index
  try_number:
    description: |
      Current attempt number for this task instance, starting at 1 and incrementing on each retry
      or clear-and-rerun operation configured on the task.
    lineage:
      - datalake_astro_raw.task_instance.try_number
  max_tries:
    description: |
      Maximum number of retries Airflow will attempt before marking the task instance as
      permanently failed, as configured in the task's retries parameter.
    lineage:
      - datalake_astro_raw.task_instance.max_tries
  duration:
    description: |
      Wall-clock seconds the task instance ran during its latest attempt, from worker start to
      terminal state. Null while queued or running.
    lineage:
      - datalake_astro_raw.task_instance.duration
  pool_slots:
    description: |
      Number of pool slots consumed by this task instance, allowing weighted pool usage when tasks
      declare slot requirements greater than one.
    lineage:
      - datalake_astro_raw.task_instance.pool_slots
  priority_weight:
    description: |
      Scheduler priority weight assigned to this task instance, influencing execution order when
      multiple tasks compete for limited executor capacity.
    lineage:
      - datalake_astro_raw.task_instance.priority_weight
  ts_trigger_timeout:
    description: |
      Deadline timestamp after which a deferred task instance times out waiting for its async
      triggerer callback if the trigger has not yet fired.
    lineage:
      - datalake_astro_raw.task_instance.trigger_timeout
  ts_queued:
    description: |
      Timestamp when this task instance entered the queued state, waiting for an available worker
      slot before execution begins.
    lineage:
      - datalake_astro_raw.task_instance.queued_dttm
  ts_started:
    description: |
      Timestamp when the worker began executing this task instance on the latest attempt,
      marking the start of wall-clock runtime.
    lineage:
      - datalake_astro_raw.task_instance.start_date
  ts_ended:
    description: |
      Timestamp when this task instance reached a terminal state on the latest attempt (success,
      failed, skipped, etc.). Null while still queued, running, or deferred.
    lineage:
      - datalake_astro_raw.task_instance.end_date
  ts_updated:
    description: |
      Timestamp when this task instance row was last modified in the Astro metadata database,
      reflecting the most recent state transition or heartbeat update.
    lineage:
      - datalake_astro_raw.task_instance.updated_at
  year:
    description: |
      Table partition column (year). Derived from the daily export snapshot date at raw ingestion.
      Required in WHERE clauses for partition pruning — always combine with month and day to
      restrict scans to the smallest date window needed. Queries without partition filters will
      scan the entire table.
    lineage:
      - datalake_astro_raw.task_instance.year
  month:
    description: |
      Table partition column (month, 1–12). Derived from the daily export snapshot date at raw
      ingestion. Must be filtered together with year and day in every query to enable partition
      pruning; omitting any partition column disables pruning and forces a full scan.
    lineage:
      - datalake_astro_raw.task_instance.month
  day:
    description: |
      Table partition column (day, 1–31). Derived from the daily export snapshot date at raw
      ingestion. Always filter with year and month to narrow the scan to specific export days.
      Example: WHERE year = 2026 AND month = 6 AND day BETWEEN 1 AND 7.
    lineage:
      - datalake_astro_raw.task_instance.day
