---
database_name: datalake_airflow
table_name: task_instance
description: |
  Unified Airflow task instance executions from Astronomer (Astro) and Google Cloud Composer
  (legacy). One row per (id_task, id_dag, id_run) attempt, unioned across providers with
  Astro rows enriched via join to dag_run for ts_executed. Captures task state transitions,
  operator details, retry counts, and execution timing. Used by Data Life Cycle for task-level
  SLA tracking, failure root-cause analysis, and duration benchmarking. Partitioned by year,
  month, and day derived from ts_updated. Always filter on year, month, and day in WHERE
  clauses to enable partition pruning when querying task execution history.
domain: Data Life Cycle
owner: gustavo.akashi@quintoandar.com.br
columns:
  id_task:
    lineage:
      - datalake_composer_clean.task_instance.id_task
      - datalake_astro_clean.task_instance.id_task
    description: ID of the task. (id_task, id_dag, id_run) is the primary key.
  id_dag:
    lineage:
      - datalake_composer_clean.task_instance.id_dag
      - datalake_astro_clean.task_instance.id_dag
    description: ID of the DAG that the task belongs to. (id_task, id_dag, id_run) is the primary key.
  id_run:
    lineage:
      - datalake_composer_clean.task_instance.id_run
      - datalake_astro_clean.task_instance.id_run
    description: ID of the DAG run that the task instance belongs to. (id_task, id_dag, id_run) is the primary key.
  id_queued_by_job:
    lineage:
      - datalake_astro_clean.task_instance.id_queued_by_job
    description: |
      Airflow scheduler job ID that queued this task instance for execution on a worker
      (Astro only). Links to the job table for scheduler diagnostics.
  id_process:
    lineage:
      - datalake_astro_clean.task_instance.id_process
    description: Process ID that the task instance executed on.
  id_trigger:
    lineage:
      - datalake_astro_clean.task_instance.id_trigger
    description: ID of the trigger that triggered the task instance.
  id_job:
    lineage:
      - datalake_astro_clean.task_instance.id_job
    description: |
      Airflow internal job ID assigned when the task instance was scheduled for execution
      on a worker node (Astro only).
  source_provider:
    description: Either "Astro" or "Composer", indicating where the task instance was created.
  task_state:
    lineage:
      - datalake_composer_clean.task_instance.task_state
      - datalake_astro_clean.task_instance.task_state
    description: |
      Current lifecycle state of the task instance within the Airflow execution engine.
      Terminal states include success, failed, skipped, and upstream_failed; transient
      states include queued, running, and up_for_retry.
    categories:
      removed: The task instance was removed from the DAG.
      scheduled: The task instance was scheduled to run.
      queued: The task instance was queued to run.
      running: The task instance is running.
      success: The task instance ran successfully.
      failed: The task instance failed.
      up_for_retry: The task instance is up for retry.
      skipped: The task instance was skipped.
      upstream_failed: The task instance didn't run because an upstream task failed.
      up_for_reschedule: The task instance is up for reschedule.
      restarting: The task instance is restarting.
      deferred: The task instance is deferred.
  hostname:
    lineage:
      - datalake_astro_clean.task_instance.hostname
    description: Hostname of the machine that the task instance executed on.
  unixname:
    lineage:
      - datalake_astro_clean.task_instance.unixname
    description: Unix name of the user that the task instance executed as.
  pool:
    lineage:
      - datalake_astro_clean.task_instance.pool
    description: Pool that the task instance belongs to.
  queue:
    lineage:
      - datalake_astro_clean.task_instance.queue
    description: Worker queue that the task instance belongs to.
  operator:
    lineage:
      - datalake_astro_clean.task_instance.operator
    description: Class name of the operator that the task instance executed.
  custom_operator_name:
    lineage:
      - datalake_astro_clean.task_instance.custom_operator_name
    description: |
      User-defined alias for the operator class when the DAG author overrides the default
      operator display name (Astro only).
  executor:
    lineage:
      - datalake_astro_clean.task_instance.executor
    description: Executor that the task instance executed on.
  task_display_name:
    lineage:
      - datalake_astro_clean.task_instance.task_display_name
    description: |
      Human-readable task label shown in the Airflow UI, which may differ from the internal
      id_task identifier (Astro only).
  map_index:
    lineage:
      - datalake_astro_clean.task_instance.map_index
    description: |
      Index position when the task uses dynamic task mapping (mapped tasks). -1 indicates
      a non-mapped (regular) task instance (Astro only).
  try_number:
    lineage:
      - datalake_composer_clean.task_instance.try_number
      - datalake_astro_clean.task_instance.try_number
    description: |
      Current attempt number for this task instance, starting at 1. Increments on each
      retry after a failure or timeout.
  max_tries:
    lineage:
      - datalake_composer_clean.task_instance.max_tries
      - datalake_astro_clean.task_instance.max_tries
    description: Maximum number of tries that the task instance can have.
  duration:
    lineage:
      - datalake_composer_clean.task_instance.duration
      - datalake_astro_clean.task_instance.duration
    description: Duration of the task instance in seconds.
  pool_slots:
    lineage:
      - datalake_astro_clean.task_instance.pool_slots
    description: Number of pool slots that the task instance used.
  priority_weight:
    lineage:
      - datalake_astro_clean.task_instance.priority_weight
    description: |
      Scheduler-assigned priority weight used to determine task execution order within a
      pool when multiple tasks compete for worker slots (Astro only).
  ts_trigger_timeout:
    lineage:
      - datalake_astro_clean.task_instance.ts_trigger_timeout
    description: Timestamp of when the task instance would timeout.
  ts_executed:
    lineage:
      - datalake_composer_clean.task_instance.ts_executed
      - datalake_astro_clean.task_instance.ts_executed
    description: |
      Logical execution date of the parent DAG run (data interval start). For daily DAGs
      this is typically the previous calendar day, not the wall-clock run time. Sourced
      from dag_run join for Astro rows and from task_instance for Composer rows.
  ts_queued:
    lineage:
      - datalake_astro_clean.task_instance.ts_queued
    description: Timestamp when the task instance was queued.
  ts_started:
    lineage:
      - datalake_composer_clean.task_instance.ts_started
      - datalake_astro_clean.task_instance.ts_started
    description: Timestamp when the task instance started.
  ts_ended:
    lineage:
      - datalake_composer_clean.task_instance.ts_ended
      - datalake_astro_clean.task_instance.ts_ended
    description: Timestamp when the task instance ended.
  ts_updated:
    lineage:
      - datalake_composer_clean.task_instance.ts_updated
      - datalake_astro_clean.task_instance.ts_updated
    description: Timestamp when the task instance was last updated.
  year:
    lineage:
      - datalake_composer_clean.task_instance.year
      - datalake_astro_clean.task_instance.year
    description: |
      Partition year derived from ts_updated. Filter on year, month, and day together to
      enable partition pruning when querying task execution history.
  month:
    lineage:
      - datalake_composer_clean.task_instance.month
      - datalake_astro_clean.task_instance.month
    description: |
      Partition month (1–12) derived from ts_updated. Combine with year and day predicates
      in WHERE clauses to avoid full table scans.
  day:
    lineage:
      - datalake_composer_clean.task_instance.day
      - datalake_astro_clean.task_instance.day
    description: |
      Partition day of month derived from ts_updated. Always include year and month filters
      alongside day for efficient partition pruning.
