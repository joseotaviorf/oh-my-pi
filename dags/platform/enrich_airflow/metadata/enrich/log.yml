---
database_name: datalake_airflow
table_name: log
description: |
  Unified Airflow audit log events from Astronomer (Astro). One row per log entry emitted
  by the Airflow scheduler, webserver, or task execution engine, with id_log offset by
  +100000000 to avoid ID collisions with legacy Composer data. Captures event type, DAG/task
  context, owner, and timestamps. Used by Data Life Cycle for operational debugging and
  scheduler behavior analysis. Partitioned by year, month, and day derived from ts_event.
  Always filter on year, month, and day in WHERE clauses to enable partition pruning when
  scanning log history.
domain: Data Life Cycle
owner: gustavo.akashi@quintoandar.com.br
columns:
  id_log:
    lineage:
      - datalake_composer_clean.log.id_log
      - datalake_astro_clean.log.id_log
    description: "Unique identifier for the log. Important: for newer rows, it does not match the ID in the database. Since
      we have rows both from Composer and Astro, we had to sum 100000000 in Astro rows to avoid conflicts. Subtract that number if you
      need a match with the database."
  id_dag:
    lineage:
      - datalake_composer_clean.log.id_dag
      - datalake_astro_clean.log.id_dag
    description: ID of the DAG associated with this log.
  id_task:
    lineage:
      - datalake_composer_clean.log.id_task
      - datalake_astro_clean.log.id_task
    description: Id of the task associated with this log.
  id_run:
    lineage:
      - datalake_astro_clean.log.id_run
    description: Id of the DAG run associated with this log.
  source_provider:
    description: Either "Astro" or "Composer", indicating where the log was created.
  event:
    lineage:
      - datalake_composer_clean.log.event
      - datalake_astro_clean.log.event
    description: Event that generated the log.
  extra:
    lineage:
      - datalake_composer_clean.log.extra
      - datalake_astro_clean.log.extra
    description: Extra information about the log. Depending on the event, it may contain different information.
  owner:
    lineage:
      - datalake_composer_clean.log.owner
      - datalake_astro_clean.log.owner
    description: Owner of the DAG associated with this log.
  owner_display_name:
    lineage:
      - datalake_astro_clean.log.owner_display_name
    description: Display name of the owner of the DAG associated with this log.
  map_index:
    lineage:
      - datalake_astro_clean.log.map_index
    description: Map index of the task instance associated with this log.
  try_number:
    lineage:
      - datalake_astro_clean.log.try_number
    description: Try number of the task instance associated with this log.
  ts_event:
    lineage:
      - datalake_composer_clean.log.ts_event
      - datalake_astro_clean.log.ts_event
    description: Timestamp of the event that generated the log.
  ts_executed:
    lineage:
      - datalake_composer_clean.log.ts_executed
      - datalake_astro_clean.log.ts_executed
    description: Execution date of the DAG run associated with this log.
  year:
    lineage:
      - datalake_composer_clean.log.year
      - datalake_astro_clean.log.year
    description: |
      Partition year derived from ts_event. Filter on year, month, and day together to
      enable partition pruning when querying Airflow log events.
  month:
    lineage:
      - datalake_composer_clean.log.month
      - datalake_astro_clean.log.month
    description: |
      Partition month (1–12) derived from ts_event. Combine with year and day predicates
      in WHERE clauses to avoid full table scans.
  day:
    lineage:
      - datalake_composer_clean.log.day
      - datalake_astro_clean.log.day
    description: |
      Partition day of month derived from ts_event. Always include year and month filters
      alongside day for efficient partition pruning.
