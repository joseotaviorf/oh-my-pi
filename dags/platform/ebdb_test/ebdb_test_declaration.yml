dag:
  name: ebdb_test
  schedule_start_date: 2021, 2, 20
  schedule_interval: 10 21,8,12 * * *
  owner: Data Engineering
  documentation:
    dag_purpose: Retrieves data from incoming CDC replication from EBDB and load it on datalake.
workflow:
  type: cdc
  layer: raw
  database_type: mysql
  source_database: ebdb
  source_schema: ebdb
  custom_schema: ebdb_test
  tables_customization:
    Imovel_AUD:
      clean_table_name: house_aud
    Imovel:
      clean_table_name: house
  extra_query_template_params:
    load_end_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, 1), 'load_end_date') }}"
