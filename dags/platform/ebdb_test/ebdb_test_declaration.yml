dag:
  name: ebdb_test
  schedule_start_date: 2021, 2, 20
  schedule_interval: 10 21 * * *
  owner: Data Engineering
  documentation:
    dag_purpose: Retrieves data from incoming CDC replication from EBDB and load it on datalake.
workflow:
  type: cdc
  layer: raw
  database_type: mysql
  source_database: ebdb
  source_schema: ebdb
  custom_schema: ebdb_test
  tables_customization:
    Imovel_AUD:
      clean_table_name: house_aud
    Imovel:
      clean_table_name: house
cluster:
  type: databricks_12_2_med_general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
