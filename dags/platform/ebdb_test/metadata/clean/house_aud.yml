database_name: datalake_ebdb_test_clean
table_name: house_aud
domain: Data Platform
owner: mario.abreu@quintoandar.com.br
description: |
  Smoke-test clean layer audit trail for EBDB Imovel (house) changes, loaded by the ebdb_test
  CDC pipeline. Each row captures a revision with modification flags and field values, matching
  production house_aud semantics. Used by Data Platform for CDC replication validation only.
columns:
  rev:
    description: |
      Revision number for the audit record. Unique identifier for each change transaction in the audit system.
    lineage:
      - datalake_ebdb_test_raw.imovel_aud.rev
  rev_type:
    description: |
      Type of revision operation (INSERT, UPDATE, DELETE). Indicates the nature of the change that triggered this audit record.
    categories:
      '0': 'Insertion operation.'
      '1': 'Update operation.'
      '2': 'Deletion operation.'
    lineage:
      - datalake_ebdb_test_raw.imovel_aud.revtype
  mod_rent:
    description: |
      Modification flag indicating whether the rent field was changed in this revision. Used for tracking rental price changes.
    lineage:
      - datalake_ebdb_test_raw.imovel_aud.aluguel_mod
  mod_condo:
    description: |
      Modification flag indicating whether the condominium fee was changed in this revision. Used for tracking cost changes.
    lineage:
      - datalake_ebdb_test_raw.imovel_aud.condominio_mod
  mod_iptu:
