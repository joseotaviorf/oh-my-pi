database_name: datalake_ebdb_test_clean
table_name: house
domain: Data Platform
owner: mario.abreu@quintoandar.com.br
description: |
  Smoke-test clean layer mirror of the EBDB Imovel (house) table, loaded by the ebdb_test CDC
  pipeline to validate transactional replication into the datalake. Column semantics match
  production house listings; used by Data Platform for integration testing only — not for
  analytics consumption.
columns:
  id:
    description: |
      Unique identifier of the house record in EBDB database. Primary key for house identification across all QuintoAndar systems.
    lineage:
      - datalake_ebdb_test_raw.imovel.id
  rent:
    description: |
      Monthly rental price in Brazilian Reais (BRL) for rental properties. Used for properties available for rent.
    lineage:
      - datalake_ebdb_test_raw.imovel.aluguel
  floor:
    description: |
      Floor level where the house is located within the building. Ground floor is typically 0, first floor is 1, etc.
    lineage:
      - datalake_ebdb_test_raw.imovel.andar
  building_floors:
    description: |
      Total number of floors in the building where the house is located. Used for building classification and accessibility considerations.
    lineage:
      - datalake_ebdb_test_raw.imovel.andarespredio
  houses_per_floor:
    description: |
      Number of apartment units per floor in the building. Indicates building density and layout characteristics.
    lineage:
      - datalake_ebdb_test_raw.imovel.aptosporandar
  total_area:
    description: |
      Total built area of the house in square meters. Includes all internal spaces and sometimes common areas proportional share.
    lineage:
      - datalake_ebdb_test_raw.imovel.areatotal
  neighborhood:
    description: |
      Neighborhood name where the house is located. Key geographic identifier for location-based searches and pricing analysis.
    lineage:
      - datalake_ebdb_test_raw.imovel.bairro
  zipcode:
    description: |
      Brazilian postal code (CEP) for the house address. Used for precise location identification and logistics operations.
    lineage:
      - datalake_ebdb_test_raw.imovel.cep
  city:
    description: |
      City name where the house is located. Primary geographic filter for house searches and regional analysis.
    lineage:
      - datalake_ebdb_test_raw.imovel.cidade
  complement:
    description: |
      Additional address information such as apartment number, block, or building name to complete the house address.
    lineage:
      - datalake_ebdb_test_raw.imovel.complemento
  condo:
    description: |
      Monthly condominium fee in Brazilian Reais (BRL). Essential cost information for house evaluation and tenant decision-making.
    lineage:
      - datalake_ebdb_test_raw.imovel.condominio
  dt_built:
    description: |
      Construction completion date of the house. Used for house age calculation and market analysis.
    lineage:
      - datalake_ebdb_test_raw.imovel.dataconstrucao
  dt_moving_in:
    description: |
      Date when the house becomes available for occupancy. Critical for rental scheduling and house availability management.
    lineage:
      - datalake_ebdb_test_raw.imovel.dataparamudar
  construction_year:
    description: |
      Year when the house construction was completed. Used for house age classification and condition assessment.
    lineage:
      - datalake_ebdb_test_raw.imovel.anoconstrucao
  house_description:
    description: |
      Detailed text description of the house including special features, amenities, and characteristics provided by the owner or agent.
    lineage:
      - datalake_ebdb_test_raw.imovel.descricaoimovel
  furnishing_details:
    description: |
      Detailed description of furniture and appliances included with the house. Important for furnished rental evaluations.
    lineage:
      - datalake_ebdb_test_raw.imovel.detalhesmobilia
  has_elevator:
    description: |
      Boolean flag indicating whether the building has an elevator. Key accessibility feature for house evaluation.
    lineage:
      - datalake_ebdb_test_raw.imovel.elevador
  contact_email:
    description: |
      Primary email address for house inquiries and communication with the owner or responsible agent.
    lineage:
      - datalake_ebdb_test_raw.imovel.emailcontato
  photo_session_email:
    description: |
      Email address designated for coordinating professional photography sessions of the house.
    lineage:
      - datalake_ebdb_test_raw.imovel.emailsessaofotos
  address:
    description: |
      Street address of the house including street name. Main component of the complete house address.
    lineage:
      - datalake_ebdb_test_raw.imovel.endereco
  conservation_status:
    description: |
      Current maintenance and conservation condition of the house. Used for house quality assessment and pricing evaluation.
    lineage:
      - datalake_ebdb_test_raw.imovel.estadoconservacao
  does_photographer_fill_information:
    description: |
      Boolean flag indicating whether the photographer is responsible for filling house information during photo sessions.
    lineage:
      - datalake_ebdb_test_raw.imovel.fotografopreenchedados
  iptu:
    description: |
      Annual house tax (IPTU) value in Brazilian Reais. Important cost component for house ownership and rental pricing.
    lineage:
      - datalake_ebdb_test_raw.imovel.iptu
  lat:
    description: |
      Geographic latitude coordinate of the house location. Used for mapping, distance calculations, and location-based services.
    lineage:
      - datalake_ebdb_test_raw.imovel.lat
  lng:
    description: |
      Geographic longitude coordinate of the house location. Used for mapping, distance calculations, and location-based services.
    lineage:
      - datalake_ebdb_test_raw.imovel.lng
  is_furnished:
    description: |
      Boolean flag indicating whether the house comes furnished. Key filter for rental house searches and pricing evaluation.
    lineage:
      - datalake_ebdb_test_raw.imovel.mobiliado
  finishing_level:
    description: |
      Quality level of house finishes and materials. Used for house classification and market positioning.
    lineage:
      - datalake_ebdb_test_raw.imovel.nivelacabamento
  number:
    description: |
      Street number of the house address. Essential component for complete address identification and logistics.
    lineage:
      - datalake_ebdb_test_raw.imovel.numero
  bathrooms:
    description: |
      Total number of bathrooms in the house. Key search filter and important factor for house valuation and user experience.
    lineage:
      - datalake_ebdb_test_raw.imovel.numerobanheiros
  bedrooms:
    description: |
      Total number of bedrooms in the house. Primary search criteria and fundamental factor for house classification and pricing.
    lineage:
      - datalake_ebdb_test_raw.imovel.numeroquartos
  suites:
    description: |
      Number of master bedrooms with private bathrooms (suites). Premium feature that affects house value and target market.
    lineage:
      - datalake_ebdb_test_raw.imovel.numerosuites
  parking_slots:
    description: |
      Number of parking spaces included with the house. Critical amenity for urban properties and important pricing factor.
    lineage:
      - datalake_ebdb_test_raw.imovel.numerovagas
  register_percent_complete:
    description: |
      Percentage indicating how complete the house registration is. Used for data quality assessment and listing completeness validation.
    lineage:
      - datalake_ebdb_test_raw.imovel.porcentagemcadastrocompleta
  has_session_photos_email_preference:
    description: |
      Boolean indicating owner's preference to be contacted via email for photo session coordination.
    lineage:
      - datalake_ebdb_test_raw.imovel.prefereemailsessaofotos
  status:
    description: |
      Current listing status of the house (e.g., Published, Suspended, Unpublished). Critical for house availability and business operations.
    lineage:
      - datalake_ebdb_test_raw.imovel.status
  contact_phone_1:
    description: |
      Primary phone number for house inquiries and owner contact. Main communication channel for scheduling visits.
    lineage:
      - datalake_ebdb_test_raw.imovel.telefonecontato1
  contact_phone_2:
    description: |
      Secondary phone number for house inquiries. Backup communication channel for owner contact.
    lineage:
      - datalake_ebdb_test_raw.imovel.telefonecontato2
  photos_session_phone:
    description: |
      Phone number designated for coordinating professional photography sessions of the house.
    lineage:
      - datalake_ebdb_test_raw.imovel.telefonesessaofotos
  type:
    description: |
      Property type classification (e.g., apartment, house, studio, commercial). Fundamental categorization for house searches and market analysis.
    lineage:
      - datalake_ebdb_test_raw.imovel.tipo
  doorman_type:
    description: |
      Type of doorman service available in the building (full-time, part-time, electronic, none). Important security and service amenity.
    lineage:
      - datalake_ebdb_test_raw.imovel.tipoporteiro
  parking_slot_type:
    description: |
      Type of parking spaces available (covered, uncovered, garage, street). Affects house value and tenant preferences.
    lineage:
      - datalake_ebdb_test_raw.imovel.tipovagas
  is_verified:
    description: |
      Boolean flag indicating whether the house has been verified by QuintoAndar team. Quality assurance indicator for listings.
    lineage:
      - datalake_ebdb_test_raw.imovel.verificado
  id_state:
    description: |
      Unique identifier for the Brazilian state where the house is located. Used for regional market analysis and operations.
    lineage:
      - datalake_ebdb_test_raw.imovel.estado_id
  id_user:
    description: |
      Unique identifier of the house owner in the QuintoAndar system. Links house to user account for management and communication.
    lineage:
      - datalake_ebdb_test_raw.imovel.usuario_id
  promotion_code:
    description: |
      Promotional discount code applicable to the house. Used for marketing campaigns and special offers.
    lineage:
      - datalake_ebdb_test_raw.imovel.codigopromocao
  is_quote_insurance_needed:
    description: |
      Boolean flag indicating whether house insurance quotation is required. Part of the rental process workflow.
    lineage:
      - datalake_ebdb_test_raw.imovel.cotarseguro
  total_value:
    description: |
      Total monthly cost including rent, condominium, and other fees. Complete cost information for tenant decision-making.
    lineage:
      - datalake_ebdb_test_raw.imovel.valortotal
  dt_expiration:
    description: |
      Date when the house listing expires and needs renewal. Used for listing lifecycle management.
    lineage:
      - datalake_ebdb_test_raw.imovel.expirationdate
  dt_first_publication:
    description: |
      Date when the house was first published on the platform. Used for house lifecycle tracking and market analysis.
    lineage:
      - datalake_ebdb_test_raw.imovel.firstpublication
  id_agent:
    description: |
      Unique identifier of the real estate agent responsible for the house. Links house to agent for commission and relationship management.
    lineage:
      - datalake_ebdb_test_raw.imovel.dadoscorretor_id
  has_owner_incomplete_listing_notification:
    description: |
      Boolean flag indicating whether owner has been notified about incomplete listing information. Part of listing quality management workflow.
    lineage:
      - datalake_ebdb_test_raw.imovel.notificacaoanuncioincompletoproprietario
  has_admin_incomplete_listing_notification:
    description: |
      Boolean flag indicating whether admin team has been notified about incomplete listing information. Internal quality control flag.
    lineage:
      - datalake_ebdb_test_raw.imovel.notificacaoanuncioincompletoadmin
  dt_creation:
    description: |
      Date and time when the house record was first created in the system. Used for house lifecycle tracking and historical analysis.
    lineage:
      - datalake_ebdb_test_raw.imovel.datacriacao
  short_url:
    description: |
      Shortened URL for easy sharing of the house listing. Used in marketing campaigns and social media sharing.
    lineage:
      - datalake_ebdb_test_raw.imovel.shorturl
  insurance_value:
    description: |
      House insurance value in Brazilian Reais. Required for rental contracts and risk assessment.
    lineage:
      - datalake_ebdb_test_raw.imovel.valorseguro
  booking_instructions:
    description: |
      Special instructions for scheduling house visits. Important for visit coordination and owner preferences.
    lineage:
      - datalake_ebdb_test_raw.imovel.instrucoesagendamento
  plan_accepted:
    description: |
      Type of QuintoAndar service plan accepted by the house owner. Determines service level and commission structure.
    lineage:
      - datalake_ebdb_test_raw.imovel.planoaceito
  has_price_adjustment_suggestion:
    description: |
      Boolean flag indicating whether the system should suggest price adjustments for the house. Used for dynamic pricing optimization.
    lineage:
      - datalake_ebdb_test_raw.imovel.sugerirreajustedepreco
  has_rent_sign_permission:
    description: |
      Boolean flag indicating whether owner permits placing rental signs on the house. Marketing and visibility preference.
    lineage:
      - datalake_ebdb_test_raw.imovel.permiteplacaalugase
  lead_description:
    description: |
      Description of the lead source or how the house came to be listed. Used for lead attribution and marketing analysis.
    lineage:
      - datalake_ebdb_test_raw.imovel.descricaolead
  listing_highlight_priority:
    description: |
      Priority level for highlighting the house listing. Used for featured listing placement and marketing visibility.
    lineage:
      - datalake_ebdb_test_raw.imovel.prioridadedestaqueclassificado
  corretoramigo:
    description: |
      Information about broker referral program participation. Used for agent network and commission tracking.
    lineage:
      - datalake_ebdb_test_raw.imovel.corretoramigo
  porteiroamigo:
    description: |
      Information about doorman referral program participation. Used for building relationship management and referral tracking.
    lineage:
      - datalake_ebdb_test_raw.imovel.porteiroamigo
  condo_management_information:
    description: |
      Information about the condominium management company. Important for house management and maintenance coordination.
    lineage:
      - datalake_ebdb_test_raw.imovel.dadosadministradoracondominio
  references:
    description: |
      Additional reference points or landmarks near the house. Used for location description and ease of finding the house.
    lineage:
      - datalake_ebdb_test_raw.imovel.referencias
  is_condo_price_included:
    description: |
      Boolean flag indicating whether condominium fee is included in the rent price. Important for transparent pricing and tenant decision-making.
    lineage:
      - datalake_ebdb_test_raw.imovel.condominioincluso
  has_manual_coordinates:
    description: |
      Boolean flag indicating whether geographic coordinates were manually entered. Used for location data quality assessment.
    lineage:
      - datalake_ebdb_test_raw.imovel.coordenadasmanuais
  is_iptu_included:
    description: |
      Boolean flag indicating whether IPTU tax is included in the rent price. Important for transparent pricing and cost calculation.
    lineage:
      - datalake_ebdb_test_raw.imovel.iptuincluso
  is_follow_up_owner_upload_photos:
    description: |
      Boolean flag indicating whether follow-up is needed for owner to upload photos. Used for photo management workflow.
    lineage:
      - datalake_ebdb_test_raw.imovel.followupproprietariosubirfotos
  ts_first_verified:
    description: |
      Timestamp of the first house verification. Used for quality control tracking and verification process management.
    lineage:
      - datalake_ebdb_test_raw.imovel.dataprimeiroverificado
  lead_collision_type:
    description: |
      Type of lead collision or conflict identified for the house. Used for lead management and attribution analysis.
    lineage:
      - datalake_ebdb_test_raw.imovel.tipocolisaolead
  ts_agent_lead_payment_calculated:
    description: |
      Timestamp when agent lead payment was calculated. Used for agent commission tracking and financial management.
    lineage:
      - datalake_ebdb_test_raw.imovel.calculopagamentoleadcorretor
  id_user_registrant:
    description: |
      Unique identifier of the user who originally registered the house. Uses COALESCE to prioritize original registrant over current registrant.
    lineage:
      - datalake_ebdb_test_raw.imovel.originalusuarioquecadastrou_id
      - datalake_ebdb_test_raw.imovel.usuarioquecadastrou_id
  cover_image_name:
    description: |
      Filename of the cover image for the house listing. Used for display and marketing purposes.
    lineage:
      - datalake_ebdb_test_raw.imovel.nomeimagemcapa
  geo_hash:
    description: |
      Geohash encoding of the house location. Used for spatial indexing and proximity-based searches.
    lineage:
      - datalake_ebdb_test_raw.imovel.geohash
  listing_type:
    description: |
      Classification of the listing type (premium, standard, basic). Affects visibility and marketing treatment of the house.
    lineage:
      - datalake_ebdb_test_raw.imovel.tipoanuncio
  admin_info:
    description: |
      Administrative information and notes about the house. Internal use for operational management and special considerations.
    lineage:
      - datalake_ebdb_test_raw.imovel.infosadmin
  internal_admin_info:
    description: |
      Internal administrative information not visible to public. Used for internal operations and team communication.
    lineage:
      - datalake_ebdb_test_raw.imovel.infosadmininterna
  photo_booking_historic:
    description: |
      Historical record of photo session bookings and appointments. Used for photography workflow management.
    lineage:
      - datalake_ebdb_test_raw.imovel.historicoagendamentofotos
  ts_affiliate_lead_payment_calculated:
    description: |
      Timestamp when affiliate lead payment was calculated. Used for commission tracking and financial management.
    lineage:
      - datalake_ebdb_test_raw.imovel.calculopagamentoleadafiliado
  has_service_bathroom:
    description: |
      Boolean flag indicating whether the house has a service bathroom. Additional amenity information for house evaluation.
    lineage:
      - datalake_ebdb_test_raw.imovel.possuibanheiroservico
  has_service_bedroom:
    description: |
      Boolean flag indicating whether the house has a service bedroom (maid's room). Additional space information for house classification.
    lineage:
      - datalake_ebdb_test_raw.imovel.possuiquartoservico
  default_neighborhood:
    description: |
      Standardized neighborhood name used for consistency in location references and search functionality.
    lineage:
      - datalake_ebdb_test_raw.imovel.bairropadrao
  id_salesforce:
    description: |
      Unique identifier linking the house to Salesforce CRM records. Used for sales process tracking and customer relationship management.
    lineage:
      - datalake_ebdb_test_raw.imovel.salesforceid
  condo_type:
    description: |
      Classification of condominium type (residential, commercial, mixed). Used for house categorization and market analysis.
    lineage:
      - datalake_ebdb_test_raw.imovel.tipocondominio
  iptu_type:
    description: |
      Classification of IPTU tax calculation method. Important for understanding house tax structure and costs.
    lineage:
      - datalake_ebdb_test_raw.imovel.tipoiptu
  dt_availability_end:
    description: |
      Date until when the house will remain available. Used for availability window management and planning.
    lineage:
      - datalake_ebdb_test_raw.imovel.disponivelate
  compare_price_with_average:
    description: |
      Flag indicating whether to compare house price with market average. Used for pricing analysis and recommendations.
    lineage:
      - datalake_ebdb_test_raw.imovel.flagverificarprecocomparandocommedia
  is_warn_owner_of_visits_needed:
    description: |
      Boolean flag indicating whether owner should always be consulted before visits. Used for visit scheduling and owner preference management.
    lineage:
      - datalake_ebdb_test_raw.imovel.sempreconsultarproprietariovisita
  code_cartographic:
    description: |
      Official cartographic code for the house location. Used for precise geographic identification and mapping.
    lineage:
      - datalake_ebdb_test_raw.imovel.codcartografico
  code_water_consumer:
    description: |
      Water utility consumer code for the house. Used for utility account identification and billing management.
    lineage:
      - datalake_ebdb_test_raw.imovel.codconsumidoragua
  code_power_consumer:
    description: |
      Electric utility consumer code for the house. Used for utility account identification and billing management.
    lineage:
      - datalake_ebdb_test_raw.imovel.codconsumidorenergia
  code_taxpayer:
    description: |
      Tax contributor code for the house. Official identifier for tax purposes and municipal records.
    lineage:
      - datalake_ebdb_test_raw.imovel.codcontribuinte
  code_reference_iptu:
    description: |
      IPTU reference code for house tax identification. Used for tax calculation and municipal house records.
    lineage:
      - datalake_ebdb_test_raw.imovel.codigorefiptu
  is_listing_notifying_owner_email_sent:
    description: |
      Boolean flag indicating whether listing notification email has been sent to owner. Used for communication workflow management.
    lineage:
      - datalake_ebdb_test_raw.imovel.emailpublicacaoproprietarioenviado
  house_conversion_status:
    description: |
      Status of house conversion process (if applicable). Used for tracking house modifications and compliance.
    lineage:
      - datalake_ebdb_test_raw.imovel.statusconversaoimovel
  registration:
    description: |
      Official registration number of the house. Legal identifier used in house documentation and transactions.
    lineage:
      - datalake_ebdb_test_raw.imovel.matricula
  last_confirmation_email_sent:
    description: |
      Timestamp of the last confirmation email sent to the house owner. Used for communication tracking and follow-up management.
    lineage:
      - datalake_ebdb_test_raw.imovel.ultimoemaildeconfirmacaoenviado
  lat_lng:
    description: |
      Combined latitude and longitude coordinates in a single field. Alternative format for geographic location data.
    lineage:
      - datalake_ebdb_test_raw.imovel.latlng
  ts_last_index_update:
    description: |
      Timestamp of the last search index update for the house. Used for search optimization and data synchronization.
    lineage:
      - datalake_ebdb_test_raw.imovel.ultimoupdateindice
  id_region:
    description: |
      Unique identifier for the geographic region where the house is located. Used for regional market segmentation and analysis.
    lineage:
      - datalake_ebdb_test_raw.imovel.regiao_id
  title:
    description: |
      House listing title or headline. Used for display purposes and search optimization.
    lineage:
      - datalake_ebdb_test_raw.imovel.titulo
  ts_updated:
    description: |
      Timestamp of the last update made to the house record. Used for change tracking and data freshness validation.
    lineage:
      - datalake_ebdb_test_raw.imovel.atualizadoem
  id_condo_parent:
    description: |
      Reference to parent condominium if the house is part of a larger condominium complex. Used for grouping and management purposes.
    lineage:
      - datalake_ebdb_test_raw.imovel.condominiopai_id
  ts_suspension_end:
    description: |
      Timestamp when the house suspension period ends. Used for automatic reactivation and availability management.
    lineage:
      - datalake_ebdb_test_raw.imovel.suspensoate
  id_closest_station:
    description: |
      Identifier of the closest public transportation station. Used for location benefits analysis and tenant convenience evaluation.
    lineage:
      - datalake_ebdb_test_raw.imovel.estacaomaisproxima_id
  id_external:
    description: |
      External system identifier for house integration. Used for cross-system data synchronization and third-party integrations.
    lineage:
      - datalake_ebdb_test_raw.imovel.externalid
  is_in_negotiation:
    description: |
      Boolean flag indicating whether the house is currently in negotiation. Used for availability status and business process management.
    lineage:
      - datalake_ebdb_test_raw.imovel.emnegociacao
  is_in_external_negotiation:
    description: |
      Boolean flag indicating whether the house is in negotiation with external parties. Used for availability tracking and competitive analysis.
    lineage:
      - datalake_ebdb_test_raw.imovel.emnegociacaoexterna
  ts_external_negotiation_start:
    description: |
      Timestamp when external negotiation began. Used for negotiation timeline tracking and competitive analysis.
    lineage:
      - datalake_ebdb_test_raw.imovel.entrouemnegociacaoexterna
  cardiff_rejection_reason:
    description: |
      Reason for Cardiff system rejection if applicable. Used for quality control and listing validation processes.
    lineage:
      - datalake_ebdb_test_raw.imovel.motivorecusacardiff
  ts_recapture:
    description: |
      Timestamp when the house was recaptured or re-acquired. Used for business development and market expansion tracking.
    lineage:
      - datalake_ebdb_test_raw.imovel.recaptadoem
  is_photographer_job_pending:
    description: |
      Boolean flag indicating whether there is a pending photographer job for the house. Used for photo session workflow management.
    lineage:
      - datalake_ebdb_test_raw.imovel.jobfotografopendente
  has_requested_professional_photos:
    description: |
      Boolean flag indicating whether professional photos have been requested. Used for photography workflow and listing quality management.
    lineage:
      - datalake_ebdb_test_raw.imovel.requisitoufotosprofissionais
  lat_bkp:
    description: |
      Backup latitude coordinate for the house location. Used as fallback for location data integrity.
    lineage:
      - datalake_ebdb_test_raw.imovel.latbkp
  lng_bkp:
    description: |
      Backup longitude coordinate for the house location. Used as fallback for location data integrity.
    lineage:
      - datalake_ebdb_test_raw.imovel.lngbkp
  ts_last_confirmation_availability:
    description: |
      Timestamp of the last availability confirmation. Used for data freshness and house status validation.
    lineage:
      - datalake_ebdb_test_raw.imovel.lastconfirmationavailability
  registry:
    description: |
      Name of the public registry office (cartório) where the house is registered. Legal requirement for house documentation in Brazil.
    lineage:
      - datalake_ebdb_test_raw.imovel.cartorio
  penalization_score:
    description: |
      Score indicating house or owner penalties. Used for risk assessment and quality control in listing management.
    lineage:
      - datalake_ebdb_test_raw.imovel.penalizationscore
  is_receive_default_contract_copy_needed:
    description: |
      Boolean flag indicating whether owner needs to receive default contract copy. Used for contract management and legal compliance.
    lineage:
      - datalake_ebdb_test_raw.imovel.recebercopiacontratopadrao
  rank_score:
    description: |
      Ranking score for the house based on various factors. Used for search result ordering and house prioritization.
    lineage:
