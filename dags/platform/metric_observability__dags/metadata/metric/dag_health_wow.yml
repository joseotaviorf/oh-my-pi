---
database_name: metric_observability
table_name: dag_health_wow
description: |
  Week-over-week comparison of Databricks DAG observability metrics. One row per
  (airflow_dag_id, dt_window_end). Each headline metric is emitted as three
  columns: `_current_7d` (trailing 7 days ending on dt_window_end),
  `_previous_7d` (the 7 days immediately before that), and `_change_pct`
  ((current − previous) / NULLIF(previous, 0) × 100). Reads exclusively from
  dw_databricks_health.fact_databricks_dag_run over a 14-calendar-day slice.

  Use this table to see whether a cluster-spec or pipeline change from the last
  sprint moved cost, utilization, duration, or reliability relative to the week
  before.

domain: Data Life Cycle
owner: jose.rferreira@quintoandar.com.br
columns:
  airflow_dag_id:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.airflow_dag_id
    description: Airflow / workload identifier (COALESCE chain on the fact).
    dimension: True
  dt_window_end:
    description: Last calendar day included in the current 7-day window (inclusive end).
    dimension: True
  team_owner:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.team_owner
    description: Cluster `owner` tag when present.
    dimension: True
  cost_center:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.cost_center
    description: Cluster `cost-center` tag when present.
    dimension: True
  ecosystem:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.ecosystem
    description: Cluster `ecosystem` tag when present.
    dimension: True
  environment:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.environment
    description: Cluster `environment` tag when present.
    dimension: True
  provisioner:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.provisioner
    description: Cluster `provisioner` tag when present.
    dimension: True

  total_dag_runs_current_7d:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.dt_dag_run_started
    description: Distinct minute buckets of parent run start (`date_trunc('MINUTE', ts_run_started)`) in the current window.
    metric:
      name: Total DAG Runs Current 7d
      description: Approximate DAG executions in the trailing 7-day window (parallel multi-job runs sharing the same minute collapse).
      acronym: total_dag_runs_curr_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Observability
      approved_by: jose.rferreira@quintoandar.com.br
  total_dag_runs_previous_7d:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.dt_dag_run_started
    description: Distinct minute buckets of parent run start in the previous window.
    metric:
      name: Total DAG Runs Previous 7d
      description: Approximate DAG executions in the prior 7-day window.
      acronym: total_dag_runs_prev_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Observability
      approved_by: jose.rferreira@quintoandar.com.br
  total_dag_runs_change_pct:
    description: Week-over-week percent change in distinct DAG-run minute buckets.
    metric:
      name: Total DAG Runs WoW Change Pct
      description: Relative change in approximate DAG execution count vs the prior week.
      acronym: total_dag_runs_wow_chg_pct
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Observability
      approved_by: jose.rferreira@quintoandar.com.br

  total_job_runs_current_7d:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.n_databricks_job_runs
    description: Count of distinct Databricks job runs (`id_databricks_run`) in the current window.
    metric:
      name: Total Job Runs Current 7d
      description: Distinct Databricks parent runs in the trailing 7-day window.
      acronym: total_job_runs_curr_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Observability
      approved_by: jose.rferreira@quintoandar.com.br
  total_job_runs_previous_7d:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.n_databricks_job_runs
    description: Count of distinct Databricks job runs in the previous window.
    metric:
      name: Total Job Runs Previous 7d
      description: Distinct Databricks parent runs in the prior 7-day window.
      acronym: total_job_runs_prev_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Observability
      approved_by: jose.rferreira@quintoandar.com.br
  total_job_runs_change_pct:
    description: Week-over-week percent change in distinct job run count.
    metric:
      name: Total Job Runs WoW Change Pct
      description: Relative change in Databricks job run volume vs the prior week.
      acronym: total_job_runs_wow_chg_pct
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Observability
      approved_by: jose.rferreira@quintoandar.com.br

  total_task_runs_current_7d:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.n_task_runs
    description: Count of distinct task runs in the current window.
    metric:
      name: Total Task Runs Current 7d
      description: Distinct `id_databricks_task_run` rows in the trailing 7-day window.
      acronym: total_task_runs_curr_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Observability
      approved_by: jose.rferreira@quintoandar.com.br
  total_task_runs_previous_7d:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.n_task_runs
    description: Count of distinct task runs in the previous window.
    metric:
      name: Total Task Runs Previous 7d
      description: Distinct task runs in the prior 7-day window.
      acronym: total_task_runs_prev_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Observability
      approved_by: jose.rferreira@quintoandar.com.br
  total_task_runs_change_pct:
    description: Week-over-week percent change in task run count.
    metric:
      name: Total Task Runs WoW Change Pct
      description: Relative change in task-level volume vs the prior week.
      acronym: total_task_runs_wow_chg_pct
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Observability
      approved_by: jose.rferreira@quintoandar.com.br

  total_dbu_consumed_current_7d:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.total_dbu_consumed
    description: Sum of logical-roll-up `total_dbu_consumed` in the current 7-day window.
    metric:
      name: Total DBU Consumed Current 7d
      description: Total DBUs in the trailing 7-day window ending on dt_window_end.
      acronym: total_dbu_curr_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  total_dbu_consumed_previous_7d:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.total_dbu_consumed
    description: Sum of logical-roll-up `total_dbu_consumed` in the previous 7-day window.
    metric:
      name: Total DBU Consumed Previous 7d
      description: Total DBUs in the 7 days immediately before the current window.
      acronym: total_dbu_prev_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  total_dbu_consumed_change_pct:
    description: Percent change in total DBU vs the prior week. Negative means fewer DBUs.
    metric:
      name: Total DBU Consumed WoW Change Pct
      description: Week-over-week percent change in total DBU ((current − previous) / previous × 100).
      acronym: total_dbu_wow_chg_pct
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br

  total_dbu_cost_usd_current_7d:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.total_dbu_cost_usd
    description: Sum of `total_dbu_cost_usd` (system billing list USD) in the current window.
    metric:
      name: Total DBU Cost USD Current 7d
      description: System-tables list USD cost in the trailing 7-day window.
      acronym: total_dbu_cost_usd_curr_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  total_dbu_cost_usd_previous_7d:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.total_dbu_cost_usd
    description: Sum of `total_dbu_cost_usd` in the previous window.
    metric:
      name: Total DBU Cost USD Previous 7d
      description: System-tables list USD cost in the prior 7-day window.
      acronym: total_dbu_cost_usd_prev_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  total_dbu_cost_usd_change_pct:
    description: Percent change in total system-tables USD cost vs prior week.
    metric:
      name: Total DBU Cost USD WoW Change Pct
      description: Week-over-week percent change in total system-tables USD cost.
      acronym: total_dbu_cost_usd_wow_chg_pct
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br

  total_ec2_cost_calculated_usd_current_7d:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.total_ec2_cost_calculated_usd
    description: Sum of calculated EC2 USD at logical DAG-run grain (rolled up from task apportionment).
    metric:
      name: Total EC2 Cost Calculated USD Current 7d
      description: Calculated EC2 for the trailing 7-day window.
      acronym: total_ec2_calc_curr_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  total_ec2_cost_calculated_usd_previous_7d:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.total_ec2_cost_calculated_usd
    description: Sum of deduped calculated EC2 USD in the previous window.
    metric:
      name: Total EC2 Cost Calculated USD Previous 7d
      description: Calculated EC2 for the prior 7-day window.
      acronym: total_ec2_calc_prev_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  total_ec2_cost_calculated_usd_change_pct:
    description: Week-over-week percent change in deduped calculated EC2 USD.
    metric:
      name: Total EC2 Cost Calculated USD WoW Change Pct
      description: Relative change in calculated EC2 USD vs the prior week.
      acronym: total_ec2_calc_wow_chg_pct
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br

  spot_hours_current_7d:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.spot_hours
    description: Sum of Spot instance-hours deduped per cluster-day in the current window.
    metric:
      name: Spot Hours Current 7d
      description: Spot-priced node-hours in the trailing 7-day window.
      acronym: spot_hrs_curr_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  spot_hours_previous_7d:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.spot_hours
    description: Sum of Spot instance-hours in the previous window.
    metric:
      name: Spot Hours Previous 7d
      description: Spot-priced node-hours in the prior 7-day window.
      acronym: spot_hrs_prev_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  spot_hours_change_pct:
    description: Week-over-week percent change in Spot instance-hours.
    metric:
      name: Spot Hours WoW Change Pct
      description: Relative change in Spot node-hours vs the prior week.
      acronym: spot_hrs_wow_chg_pct
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br

  on_demand_hours_current_7d:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.on_demand_hours
    description: Sum of on-demand instance-hours deduped per cluster-day in the current window.
    metric:
      name: On Demand Hours Current 7d
      description: On-demand node-hours in the trailing 7-day window.
      acronym: od_hrs_curr_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  on_demand_hours_previous_7d:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.on_demand_hours
    description: Sum of on-demand instance-hours in the previous window.
    metric:
      name: On Demand Hours Previous 7d
      description: On-demand node-hours in the prior 7-day window.
      acronym: od_hrs_prev_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  on_demand_hours_change_pct:
    description: Week-over-week percent change in on-demand instance-hours.
    metric:
      name: On Demand Hours WoW Change Pct
      description: Relative change in on-demand node-hours vs the prior week.
      acronym: od_hrs_wow_chg_pct
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br

  total_cost_usd_current_7d:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.total_dbu_cost_usd
      - dw_databricks_health.fact_databricks_dag_run.total_ec2_cost_calculated_usd
    description: SUM(system billing DBU USD) + SUM(deduped calculated EC2 USD per cluster-day).
    metric:
      name: Total Cost USD Current 7d
      description: DBU list USD plus calculated EC2 in the trailing 7-day window.
      acronym: total_cost_curr_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  total_cost_usd_previous_7d:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.total_dbu_cost_usd
      - dw_databricks_health.fact_databricks_dag_run.total_ec2_cost_calculated_usd
    description: Same total-cost definition for the prior 7-day window.
    metric:
      name: Total Cost USD Previous 7d
      description: DBU list USD plus calculated EC2 in the prior 7-day window.
      acronym: total_cost_prev_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  total_cost_usd_change_pct:
    description: Percent change in total USD vs prior week.
    metric:
      name: Total Cost USD WoW Change Pct
      description: Week-over-week percent change in total USD (DBU + calculated EC2).
      acronym: total_cost_wow_chg_pct
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br

  avg_dbu_cost_usd_per_dag_run_current_7d:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.total_dbu_cost_usd
      - dw_databricks_health.fact_databricks_dag_run.dt_dag_run_started
    description: Mean `total_dbu_cost_usd` per logical DAG run (minute bucket) in the current window.
    metric:
      name: Avg DBU Cost USD per DAG Run Current 7d
      description: Mean system-tables list USD per approximate DAG execution (total_dbu_cost_usd / total_dag_runs).
      acronym: avg_dbu_cost_per_dag_run_curr_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  avg_dbu_cost_usd_per_dag_run_previous_7d:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.total_dbu_cost_usd
      - dw_databricks_health.fact_databricks_dag_run.dt_dag_run_started
    description: Mean `total_dbu_cost_usd` per logical DAG run (minute bucket) in the previous window.
    metric:
      name: Avg DBU Cost USD per DAG Run Previous 7d
      description: Mean system-tables USD per approximate DAG execution in the prior 7-day window.
      acronym: avg_dbu_cost_per_dag_run_prev_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  avg_dbu_cost_usd_per_dag_run_change_pct:
    description: Percent change in average DBU list USD per DAG run vs prior week.
    metric:
      name: Avg DBU Cost USD per DAG Run WoW Change Pct
      description: Week-over-week percent change in mean list USD per DAG-run minute bucket.
      acronym: avg_dbu_cost_per_dag_run_wow_chg_pct
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br

  avg_total_cost_usd_per_dag_run_current_7d:
    description: total_cost_usd_current_7d / total_dag_runs_current_7d.
    metric:
      name: Avg Total Cost USD per DAG Run Current 7d
      description: Mean total USD per approximate DAG execution in the trailing 7-day window.
      acronym: avg_total_cost_curr_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  avg_total_cost_usd_per_dag_run_previous_7d:
    description: total_cost_usd_previous_7d / total_dag_runs_previous_7d.
    metric:
      name: Avg Total Cost USD per DAG Run Previous 7d
      description: Mean total USD per approximate DAG execution in the prior 7-day window.
      acronym: avg_total_cost_prev_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  avg_total_cost_usd_per_dag_run_change_pct:
    description: Week-over-week percent change in average total USD per DAG run.
    metric:
      name: Avg Total Cost USD per DAG Run WoW Change Pct
      description: Relative change in mean total cost per DAG-run minute bucket.
      acronym: avg_total_cost_wow_chg_pct
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br

  cost_efficiency_usd_per_executor_second_current_7d:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.total_dbu_cost_usd
      - dw_databricks_health.fact_databricks_dag_run.total_executor_run_time_ms
    description: |
      Sum(`total_dbu_cost_usd`) / (sum(`total_executor_run_time_ms`) / 1000) for the current window.
      Same definition as `dag_health.cost_efficiency_usd_per_executor_second_*`.
    metric:
      name: Cost Efficiency USD per Executor Second Current 7d
      description: USD per executor-second in the trailing 7-day window (same as dag_health).
      acronym: cost_eff_curr_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  cost_efficiency_usd_per_executor_second_previous_7d:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.total_dbu_cost_usd
      - dw_databricks_health.fact_databricks_dag_run.total_executor_run_time_ms
    description: Cost efficiency USD per executor-second for the previous window.
    metric:
      name: Cost Efficiency USD per Executor Second Previous 7d
      description: USD per executor-second in the prior 7-day window.
      acronym: cost_eff_prev_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  cost_efficiency_usd_per_executor_second_change_pct:
    description: Relative percent change in cost efficiency vs prior week.
    metric:
      name: Cost Efficiency WoW Change Pct
      description: Week-over-week percent change in USD per executor-second.
      acronym: cost_eff_wow_chg_pct
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br

  total_ec2_cost_overwatch_usd_current_7d:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.total_ec2_cost_overwatch_usd
    description: Sum of Overwatch EC2 USD rolled up to logical DAG-run grain (from task apportionment).
    metric:
      name: Total EC2 Cost Overwatch USD Current 7d
      description: EC2 portion from Overwatch for the trailing 7-day window (legacy cross-check).
      acronym: total_ec2_overwatch_curr_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  total_ec2_cost_overwatch_usd_previous_7d:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.total_ec2_cost_overwatch_usd
    description: Sum of deduped Overwatch EC2 USD in the previous window.
    metric:
      name: Total EC2 Cost Overwatch USD Previous 7d
      description: EC2 portion from Overwatch for the prior 7-day window.
      acronym: total_ec2_overwatch_prev_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  total_ec2_cost_overwatch_usd_change_pct:
    description: Week-over-week percent change in deduped Overwatch EC2 USD.
    metric:
      name: Total EC2 Cost Overwatch USD WoW Change Pct
      description: Relative change in Overwatch EC2 USD vs the prior week.
      acronym: total_ec2_overwatch_wow_chg_pct
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br

  total_dbu_cost_overwatch_usd_current_7d:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.total_dbu_cost_overwatch_usd
    description: Legacy Overwatch DBU-only USD; summed once per cluster-day (deduped).
    metric:
      name: Total DBU Cost Overwatch USD Current 7d
      description: Overwatch-reported DBU USD in the trailing 7-day window (legacy allocation).
      acronym: total_dbu_overwatch_curr_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  total_dbu_cost_overwatch_usd_previous_7d:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.total_dbu_cost_overwatch_usd
    description: Legacy Overwatch DBU-only USD; summed once per cluster-day (deduped).
    metric:
      name: Total DBU Cost Overwatch USD Previous 7d
      description: Overwatch-reported DBU USD in the prior 7-day window.
      acronym: total_dbu_overwatch_prev_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  total_dbu_cost_overwatch_usd_change_pct:
    description: Week-over-week percent change in legacy Overwatch DBU USD (deduped).
    metric:
      name: Total DBU Cost Overwatch USD WoW Change Pct
      description: Relative change in Overwatch DBU-only USD vs the prior week.
      acronym: total_dbu_overwatch_wow_chg_pct
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br

  total_cost_overwatch_usd_current_7d:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.total_cost_overwatch_usd
    description: Sum of legacy Overwatch total_cost_overwatch_usd (DBU + EC2 from Overwatch) deduped once per cluster-day.
    metric:
      name: Total Overwatch Cost USD Current 7d
      description: Full legacy Overwatch cost in the trailing 7-day window.
      acronym: total_overwatch_curr_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
