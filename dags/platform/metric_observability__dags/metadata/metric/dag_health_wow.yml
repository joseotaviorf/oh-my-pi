---
database_name: metric_observability
table_name: dag_health_wow
description: |
  Week-over-week comparison of Databricks DAG observability metrics. One row per
  (airflow_dag_id, dt_window_end). Each headline metric is emitted as three
  columns: `_current_7d` (trailing 7 days ending on dt_window_end),
  `_previous_7d` (the 7 days immediately before that), and `_change_pct`
  ((current − previous) / NULLIF(previous, 0) × 100). Reads from
  dw_databricks_health.fact_databricks_dag_run UNION ALL
  dw_emr_health.fact_emr_dag_run over a 14-calendar-day slice (discriminate with
  `provisioner`). EMR v1 has no Spark stage ingest — expect ~0% stage coverage
  for provisioner='emr' rows (not an eventLog.dir incident).

  Use this table to see whether a cluster-spec or pipeline change from the last
  sprint moved cost, utilization, duration, or reliability relative to the week
  before.
  Cost fields are task/dag-attributed operational estimates, not the company
  Databricks cost authority. Use dw_databricks_costs.fact_databricks_costs for
  total Platform cost tracking. EC2 source-quality flags show whether either
  compared week includes billable_usage machine-hour estimates before retained
  node_timeline coverage or missing EC2 prices.

  Partitioned by year, month, and day (derived from dt_window_end). Filter on year,
  month, and day for partition pruning when querying historical windows.

domain: Data Life Cycle
owner: mario.abreu@quintoandar.com.br
columns:
  airflow_dag_id:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.airflow_dag_id
      - dw_emr_health.fact_emr_dag_run.airflow_dag_id
    description: Airflow / workload identifier (COALESCE chain on the fact).
    dimension: True
  team_owner:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.team_owner
    description: Cluster `owner` tag when present.
    dimension: True
  cost_center:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.cost_center
    description: Cluster `cost-center` tag when present.
    dimension: True
  ecosystem:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.ecosystem
    description: Cluster `ecosystem` tag when present.
    dimension: True
  environment:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.environment
    description: Cluster `environment` tag when present.
    dimension: True
  provisioner:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.provisioner
    description: Cluster `provisioner` tag when present.
    dimension: True
  cost_cohort:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.cost_cohort
    description: Initiative cost cohort (bietlejuice / quintoml_wonka / cdp / tech_platform / other) passed through from fact_databricks_dag_run.
    dimension: True
  data_classification:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.data_classification
    description: LGPD / data-classification label from the DBU-dominant cluster in the logical run.
    dimension: True
  primary_dbr_version:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.primary_dbr_version
    description: DBR version of the DBU-dominant cluster in the logical run.
    dimension: True
  total_dbu_consumed_current_7d:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.total_dbu_consumed
    description: Sum of logical-roll-up `total_dbu_consumed` in the current 7-day window.
    metric:
      name: Total DBU Consumed Current 7d
      description: Total DBUs in the trailing 7-day window ending on dt_window_end.
      acronym: total_dbu_curr_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  total_dbu_consumed_previous_7d:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.total_dbu_consumed
    description: Sum of logical-roll-up `total_dbu_consumed` in the previous 7-day window.
    metric:
      name: Total DBU Consumed Previous 7d
      description: Total DBUs in the 7 days immediately before the current window.
      acronym: total_dbu_prev_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  total_dbu_consumed_change_pct:
    description: Percent change in total DBU vs the prior week. Negative means fewer DBUs.
    metric:
      name: Total DBU Consumed WoW Change Pct
      description: Week-over-week percent change in total DBU ((current − previous) / previous × 100).
      acronym: total_dbu_wow_chg_pct
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  total_dbu_cost_usd_current_7d:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.total_dbu_cost_usd
    description: Sum of `total_dbu_cost_usd` (negotiated DBU USD) in the current window.
    metric:
      name: Total DBU Cost USD Current 7d
      description: Negotiated DBU USD cost in the trailing 7-day window.
      acronym: total_dbu_cost_usd_curr_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  total_dbu_cost_usd_previous_7d:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.total_dbu_cost_usd
    description: Sum of `total_dbu_cost_usd` in the previous window.
    metric:
      name: Total DBU Cost USD Previous 7d
      description: Negotiated DBU USD (dim_dbu_price with list fallback) in the prior 7-day window.
      acronym: total_dbu_cost_usd_prev_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  total_dbu_cost_usd_change_pct:
    description: Percent change in negotiated DBU USD vs prior week.
    metric:
      name: Total DBU Cost USD WoW Change Pct
      description: Week-over-week percent change in negotiated DBU USD.
      acronym: total_dbu_cost_usd_wow_chg_pct
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  avg_dbu_cost_usd_per_dag_run_current_7d:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.total_dbu_cost_usd
      - dw_databricks_health.fact_databricks_dag_run.dt_dag_run_started
    description: Mean `total_dbu_cost_usd` per logical DAG run (minute bucket) in the current window.
    metric:
      name: Avg DBU Cost USD per DAG Run Current 7d
      description: Mean negotiated DBU USD per approximate DAG execution (total_dbu_cost_usd / total_dag_runs).
      acronym: avg_dbu_cost_per_dag_run_curr_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  avg_dbu_cost_usd_per_dag_run_previous_7d:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.total_dbu_cost_usd
      - dw_databricks_health.fact_databricks_dag_run.dt_dag_run_started
    description: Mean `total_dbu_cost_usd` per logical DAG run (minute bucket) in the previous window.
    metric:
      name: Avg DBU Cost USD per DAG Run Previous 7d
      description: Mean system-tables USD per approximate DAG execution in the prior 7-day window.
      acronym: avg_dbu_cost_per_dag_run_prev_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  avg_dbu_cost_usd_per_dag_run_change_pct:
    description: Percent change in average negotiated DBU USD per DAG run vs prior week.
    metric:
      name: Avg DBU Cost USD per DAG Run WoW Change Pct
      description: Week-over-week percent change in mean list USD per DAG-run minute bucket.
      acronym: avg_dbu_cost_per_dag_run_wow_chg_pct
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  total_ec2_cost_usd_current_7d:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.total_ec2_cost_calculated_usd
      - dw_emr_health.fact_emr_dag_run.total_ec2_cost_usd
    description: Sum of task/dag-attributed EC2 USD at logical DAG-run grain in the current window (Databricks seed-priced, EMR billed CUR).
    metric:
      name: Total EC2 Cost USD Current 7d
      description: Task/dag-attributed EC2 USD for the trailing 7-day window (Databricks from dim_ec2_price; EMR from billed CUR).
      acronym: total_ec2_usd_curr_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  total_ec2_cost_usd_previous_7d:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.total_ec2_cost_calculated_usd
      - dw_emr_health.fact_emr_dag_run.total_ec2_cost_usd
    description: Sum of task/dag-attributed EC2 USD in the previous window (Databricks seed-priced, EMR billed CUR).
    metric:
      name: Total EC2 Cost USD Previous 7d
      description: Task/dag-attributed EC2 USD for the prior 7-day window (Databricks from dim_ec2_price; EMR from billed CUR).
      acronym: total_ec2_usd_prev_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  total_ec2_cost_usd_change_pct:
    description: Week-over-week percent change in task/dag-attributed EC2 USD.
    metric:
      name: Total EC2 Cost USD WoW Change Pct
      description: Relative change in EC2 USD vs the prior week.
      acronym: total_ec2_usd_wow_chg_pct
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  ec2_spot_hours_current_7d:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.ec2_spot_hours
    description: Sum of task/dag-attributed EC2 Spot node wall-clock hours in the current window (not DBU).
    metric:
      name: EC2 Spot Node Hours Current 7d
      description: "EC2 Spot node-hours in the trailing 7-day window. EC2 node-hours split spot / on-demand (Databricks: `dim_ec2_price` availability; EMR: CUR `market`)."
      acronym: spot_hrs_curr_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  ec2_spot_hours_previous_7d:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.ec2_spot_hours
    description: Sum of EC2 Spot node wall-clock hours in the previous window (not DBU).
    metric:
      name: EC2 Spot Node Hours Previous 7d
      description: "EC2 Spot node-hours in the prior 7-day window. EC2 node-hours split spot / on-demand (Databricks: `dim_ec2_price` availability; EMR: CUR `market`)."
      acronym: spot_hrs_prev_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  ec2_spot_hours_change_pct:
    description: Week-over-week percent change in EC2 Spot node wall-clock hours.
    metric:
      name: EC2 Spot Node Hours WoW Change Pct
      description: Relative change in EC2 Spot node-hours vs the prior week.
      acronym: spot_hrs_wow_chg_pct
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  ec2_on_demand_hours_current_7d:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.ec2_on_demand_hours
    description: Sum of task/dag-attributed EC2 on-demand node wall-clock hours in the current window (not DBU).
    metric:
      name: EC2 On Demand Node Hours Current 7d
      description: "EC2 on-demand node-hours in the trailing 7-day window. EC2 node-hours split spot / on-demand (Databricks: `dim_ec2_price` availability; EMR: CUR `market`)."
      acronym: od_hrs_curr_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  ec2_on_demand_hours_previous_7d:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.ec2_on_demand_hours
    description: Sum of EC2 on-demand node wall-clock hours in the previous window (not DBU).
    metric:
      name: EC2 On Demand Node Hours Previous 7d
      description: "EC2 on-demand node-hours in the prior 7-day window. EC2 node-hours split spot / on-demand (Databricks: `dim_ec2_price` availability; EMR: CUR `market`)."
      acronym: od_hrs_prev_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  ec2_on_demand_hours_change_pct:
    description: Week-over-week percent change in EC2 on-demand node wall-clock hours.
    metric:
      name: EC2 On Demand Node Hours WoW Change Pct
      description: Relative change in EC2 on-demand node-hours vs the prior week.
      acronym: od_hrs_wow_chg_pct
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  has_ec2_estimate_current_7d:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.is_ec2_estimated
    description: True when any DAG-run in the current 7-day window used estimated EC2 from billable_usage machine-hours.
    dimension: True
  has_ec2_estimate_previous_7d:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.is_ec2_estimated
    description: True when any DAG-run in the previous 7-day window used estimated EC2 from billable_usage machine-hours.
    dimension: True
  has_ec2_pricing_missing_current_7d:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.ec2_pricing_missing
    description: True when any DAG-run in the current 7-day window had EC2 hours with missing dim_ec2_price coverage. Databricks-only; always false for EMR rows.
    dimension: True
  has_ec2_pricing_missing_previous_7d:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.ec2_pricing_missing
    description: True when any DAG-run in the previous 7-day window had EC2 hours with missing dim_ec2_price coverage. Databricks-only; always false for EMR rows.
    dimension: True
  total_cost_usd_current_7d:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.total_dbu_cost_usd
      - dw_databricks_health.fact_databricks_dag_run.total_ec2_cost_calculated_usd
    description: SUM(system billing DBU USD) + SUM(task/dag-attributed calculated EC2 USD).
    metric:
      name: Total Cost USD Current 7d
      description: Negotiated DBU USD plus calculated EC2 in the trailing 7-day window.
      acronym: total_cost_curr_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  total_cost_usd_previous_7d:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.total_dbu_cost_usd
      - dw_databricks_health.fact_databricks_dag_run.total_ec2_cost_calculated_usd
    description: Same total-cost definition for the prior 7-day window.
    metric:
      name: Total Cost USD Previous 7d
      description: Negotiated DBU USD plus calculated EC2 in the prior 7-day window.
      acronym: total_cost_prev_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  total_cost_usd_change_pct:
    description: Percent change in total USD vs prior week.
    metric:
      name: Total Cost USD WoW Change Pct
      description: Week-over-week percent change in total USD (DBU + calculated EC2).
      acronym: total_cost_wow_chg_pct
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  avg_total_cost_usd_per_dag_run_current_7d:
    description: total_cost_usd_current_7d / total_dag_runs_current_7d.
    metric:
      name: Avg Total Cost USD per DAG Run Current 7d
      description: Mean total USD per approximate DAG execution in the trailing 7-day window.
      acronym: avg_total_cost_curr_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  avg_total_cost_usd_per_dag_run_previous_7d:
    description: total_cost_usd_previous_7d / total_dag_runs_previous_7d.
    metric:
      name: Avg Total Cost USD per DAG Run Previous 7d
      description: Mean total USD per approximate DAG execution in the prior 7-day window.
      acronym: avg_total_cost_prev_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  avg_total_cost_usd_per_dag_run_change_pct:
    description: Week-over-week percent change in average total USD per DAG run.
    metric:
      name: Avg Total Cost USD per DAG Run WoW Change Pct
      description: Relative change in mean total cost per DAG-run minute bucket.
      acronym: avg_total_cost_wow_chg_pct
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  total_cost_usd_per_executor_second_current_7d:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.total_cost_usd
      - dw_databricks_health.fact_databricks_dag_run.total_executor_run_time_ms
    description: |
      Sum(`total_cost_usd`) / (sum(`total_executor_run_time_ms`) / 1000) for the current window.
      Total cost = negotiated DBU USD + calculated EC2 USD. Same definition as
      `dag_health.total_cost_usd_per_executor_second_*`.
    metric:
      name: Total Cost USD per Executor Second Current 7d
      description: Total cost (DBU + EC2) per executor-second in the trailing 7-day window.
      acronym: total_cost_per_exec_sec_curr_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  total_cost_usd_per_executor_second_previous_7d:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.total_cost_usd
      - dw_databricks_health.fact_databricks_dag_run.total_executor_run_time_ms
    description: Total cost (DBU + EC2) USD per executor-second for the previous window.
    metric:
      name: Total Cost USD per Executor Second Previous 7d
      description: Total cost (DBU + EC2) per executor-second in the prior 7-day window.
      acronym: total_cost_per_exec_sec_prev_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  total_cost_usd_per_executor_second_change_pct:
    description: Relative percent change in total cost (DBU + EC2) per executor-second vs prior week.
    metric:
      name: Total Cost USD per Executor Second WoW Change Pct
      description: Week-over-week percent change in total cost per executor-second.
      acronym: total_cost_per_exec_sec_wow_chg_pct
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  total_dag_runs_current_7d:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.dt_dag_run_started
    description: Distinct minute buckets of parent run start (`date_trunc('MINUTE', ts_run_started)`) in the current window.
    metric:
      name: Total DAG Runs Current 7d
      description: Approximate DAG executions in the trailing 7-day window (parallel multi-job runs sharing the same minute collapse).
      acronym: total_dag_runs_curr_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Observability
      approved_by: jose.rferreira@quintoandar.com.br
  total_dag_runs_previous_7d:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.dt_dag_run_started
    description: Distinct minute buckets of parent run start in the previous window.
    metric:
      name: Total DAG Runs Previous 7d
      description: Approximate DAG executions in the prior 7-day window.
      acronym: total_dag_runs_prev_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Observability
      approved_by: jose.rferreira@quintoandar.com.br
  total_dag_runs_change_pct:
    description: Week-over-week percent change in distinct DAG-run minute buckets.
    metric:
      name: Total DAG Runs WoW Change Pct
      description: Relative change in approximate DAG execution count vs the prior week.
      acronym: total_dag_runs_wow_chg_pct
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Observability
      approved_by: jose.rferreira@quintoandar.com.br
  total_job_runs_current_7d:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.n_databricks_job_runs
    description: Count of distinct Databricks job runs (`id_databricks_run`) in the current window.
    metric:
      name: Total Job Runs Current 7d
      description: Distinct Databricks parent runs in the trailing 7-day window.
      acronym: total_job_runs_curr_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Observability
      approved_by: jose.rferreira@quintoandar.com.br
  total_job_runs_previous_7d:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.n_databricks_job_runs
    description: Count of distinct Databricks job runs in the previous window.
    metric:
      name: Total Job Runs Previous 7d
      description: Distinct Databricks parent runs in the prior 7-day window.
      acronym: total_job_runs_prev_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Observability
      approved_by: jose.rferreira@quintoandar.com.br
  total_job_runs_change_pct:
    description: Week-over-week percent change in distinct job run count.
    metric:
      name: Total Job Runs WoW Change Pct
      description: Relative change in Databricks job run volume vs the prior week.
      acronym: total_job_runs_wow_chg_pct
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Observability
      approved_by: jose.rferreira@quintoandar.com.br
  total_task_runs_current_7d:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.n_task_runs
    description: Count of distinct task runs in the current window.
    metric:
      name: Total Task Runs Current 7d
      description: Distinct `id_databricks_task_run` rows in the trailing 7-day window.
      acronym: total_task_runs_curr_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Observability
      approved_by: jose.rferreira@quintoandar.com.br
  total_task_runs_previous_7d:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.n_task_runs
    description: Count of distinct task runs in the previous window.
    metric:
      name: Total Task Runs Previous 7d
      description: Distinct task runs in the prior 7-day window.
      acronym: total_task_runs_prev_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Observability
      approved_by: jose.rferreira@quintoandar.com.br
  total_task_runs_change_pct:
    description: Week-over-week percent change in task run count.
    metric:
      name: Total Task Runs WoW Change Pct
      description: Relative change in task-level volume vs the prior week.
      acronym: total_task_runs_wow_chg_pct
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Observability
      approved_by: jose.rferreira@quintoandar.com.br
  avg_total_duration_seconds_current_7d:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.total_wall_clock_seconds
    description: Mean `total_duration_seconds` in the current window.
