      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  total_cost_blended_usd_previous_7d:
    lineage:
      - dw_databricks_health.fact_databricks_task_run.cost_blended_usd
    description: Sum of `cost_blended_usd` in the previous window.
    metric:
      name: Total Blended Cost USD Previous 7d
      description: Blended USD in the prior 7-day window.
      acronym: total_blended_prev_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  total_cost_blended_usd_change_pct:
    description: Percent change in blended USD vs prior week.
    metric:
      name: Total Blended Cost USD WoW Change Pct
      description: Week-over-week percent change in blended USD.
      acronym: total_blended_wow_chg_pct
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br

  avg_cost_usd_per_run_current_7d:
    lineage:
