      approved_by: jose.rferreira@quintoandar.com.br
  driver_cpu_utilization_ratio_7d:
    description: |
      `avg_p95_driver_cpu_busy_percent_7d / 100`. Objective signal in [0, 1].
      Use with `driver_minus_worker_cpu_pp_7d` to spot serial-driver bottlenecks.
    metric:
      name: Driver CPU Utilization Ratio (7d)
      description: Driver P95 CPU busy averaged over the 7-day window, normalised to [0, 1].
      acronym: driver_cpu_util_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Right-Sizing Ratios
      approved_by: jose.rferreira@quintoandar.com.br
  driver_cpu_utilization_ratio_28d:
    description: |
      `avg_p95_driver_cpu_busy_percent_28d / 100`. Objective signal in [0, 1].
      Use with `driver_minus_worker_cpu_pp_28d` to spot serial-driver bottlenecks.
    metric:
      name: Driver CPU Utilization Ratio (28d)
      description: Driver P95 CPU busy averaged over the 28-day window, normalised to [0, 1].
      acronym: driver_cpu_util_28d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Right-Sizing Ratios
      approved_by: jose.rferreira@quintoandar.com.br
  driver_minus_worker_cpu_pp_7d:
    description: |
      `avg_p95_driver_cpu_busy_percent_7d - avg_p95_worker_cpu_busy_percent_7d`,
      in percentage points. Positive values mean the driver is hotter than workers
      at P95 — a classic serial-driver bottleneck (Python UDFs, .toPandas(),
      .collect(), schema evolution). Sort dashboards by this column to spot DAGs
      where the worker shape is over-provisioned relative to actual parallel work.
    metric:
      name: Driver − Worker CPU (pp, 7d)
      description: Driver P95 CPU busy minus worker P95 CPU busy, averaged over the 7-day window.
      acronym: driver_minus_worker_cpu_pp_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Right-Sizing Ratios
      approved_by: jose.rferreira@quintoandar.com.br
  driver_minus_worker_cpu_pp_28d:
    description: |
      `avg_p95_driver_cpu_busy_percent_28d - avg_p95_worker_cpu_busy_percent_28d`,
      in percentage points. Positive values mean the driver is hotter than workers
      at P95 — a classic serial-driver bottleneck. Sort dashboards by this column
      to spot DAGs where the worker shape is over-provisioned relative to actual
      parallel work.
    metric:
      name: Driver − Worker CPU (pp, 28d)
      description: Driver P95 CPU busy minus worker P95 CPU busy, averaged over the 28-day window.
      acronym: driver_minus_worker_cpu_pp_28d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Right-Sizing Ratios
      approved_by: jose.rferreira@quintoandar.com.br
  spill_to_input_ratio_7d:
    description: |
      `total_disk_bytes_spilled_7d / total_input_bytes_read_7d`. High values
      indicate memory pressure (executors too small for working set). Used in
      lieu of a strict heap-pressure ratio because the fact does not currently
      carry executor_memory_allocated_bytes. NULL when input bytes are zero.
    metric:
      name: Spill-to-Input Ratio (7d)
      description: Bytes spilled to disk divided by bytes read from input over the 7-day window.
      acronym: spill_input_ratio_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Right-Sizing Ratios
      approved_by: jose.rferreira@quintoandar.com.br
  spill_to_input_ratio_28d:
    description: |
      `total_disk_bytes_spilled_28d / total_input_bytes_read_28d`. High values
      indicate memory pressure (executors too small for working set). Used in
      lieu of a strict heap-pressure ratio because the fact does not currently
      carry executor_memory_allocated_bytes. NULL when input bytes are zero.
    metric:
      name: Spill-to-Input Ratio (28d)
      description: Bytes spilled to disk divided by bytes read from input over the 28-day window.
      acronym: spill_input_ratio_28d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Right-Sizing Ratios
      approved_by: jose.rferreira@quintoandar.com.br
  cost_efficiency_usd_per_executor_second_7d:
    description: |
      `total_cost_usd_7d / (sum(total_executor_run_time_ms_7d) / 1000)`. USD spent
      per second of useful executor compute over the 7-day window. Lower ⇒ better
      bang-for-the-buck. Captures both cluster-shape efficiency AND scheduling
      (cold starts and retries inflate cost without inflating executor time).
      NULL when stage data is unavailable / ambiguous.
    metric:
      name: Cost Efficiency (USD per executor-second, 7d)
      description: Total USD cost over the 7-day window divided by total executor wall-clock seconds.
      acronym: cost_per_exec_sec_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Right-Sizing Ratios
      approved_by: jose.rferreira@quintoandar.com.br
  cost_efficiency_usd_per_executor_second_28d:
    description: |
      `total_cost_usd_28d / (sum(total_executor_run_time_ms_28d) / 1000)`. USD
      spent per second of useful executor compute over the 28-day window. Lower
      ⇒ better bang-for-the-buck. Captures both cluster-shape efficiency AND
      scheduling overhead. NULL when stage data is unavailable / ambiguous.
    metric:
      name: Cost Efficiency (USD per executor-second, 28d)
      description: Total USD cost over the 28-day window divided by total executor wall-clock seconds.
      acronym: cost_per_exec_sec_28d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Right-Sizing Ratios
      approved_by: jose.rferreira@quintoandar.com.br

  pct_runs_with_stage_data_7d:
    lineage:
      - dw_databricks_health.fact_databricks_task_run.has_stage_data
    description: Percentage of task runs in the 7-day window that have Spark event log stage metrics attached. 0..100 scale.
    metric:
      name: Stage Data Coverage (7d)
      description: Data-quality KPI for the 7-day window. < 80% indicates delayed S3 PUTs or driver crashes; spill / memory / shuffle KPIs are unreliable until coverage recovers.
      acronym: pct_stage_data_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Data Quality
      approved_by: jose.rferreira@quintoandar.com.br
  pct_runs_with_stage_data_28d:
    lineage:
      - dw_databricks_health.fact_databricks_task_run.has_stage_data
    description: Percentage of task runs in the 28-day window that have Spark event log stage metrics attached. 0..100 scale.
    metric:
      name: Stage Data Coverage (28d)
      description: Data-quality KPI. < 80% indicates either delayed S3 PUTs of the Spark event logs, a misconfigured `spark.eventLog.dir`, or driver crashes before the log was flushed; spill / memory / shuffle KPIs are unreliable for this DAG until coverage recovers.
      acronym: pct_stage_data_28d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Data Quality
      approved_by: jose.rferreira@quintoandar.com.br

