---
database_name: metric_observability
table_name: dag_health
description: |
  Per-DAG rolling observability metrics for the bietlejuice framework. One row
  per (airflow_dag_id, dt_window_end). Every metric column is duplicated with a
  `_7d` and `_28d` suffix — both windows are computed in a single SELECT over
  the same 28-day fact read, with 7d aggregates produced via `FILTER (WHERE
  in_7d_window)`. Reads from dw_databricks_health.fact_databricks_dag_run UNION ALL
  dw_emr_health.fact_emr_dag_run (discriminate with `provisioner`).
  EMR v1 has no Spark stage ingest — expect ~0% stage coverage for
  provisioner='emr' rows (not an eventLog.dir incident).

  Window choice rationale:
    - 7d  → "act this sprint". A regression yesterday shows up immediately;
            right-sizing decisions can be made before the 28d average shifts.
    - 28d → matches the Databricks billing aggregation default; smooths
            single-day spikes (Mondays, releases, ad-hoc backfills) for
            steady-state cost monitoring.

  Adding a 1d / 90d window later is mechanical: extend the underlying SQL CTE
  to read N days, add an `in_<N>d_window` flag, and add `<metric>_<N>d` columns
  alongside the existing pairs.

  Powers the Phase 4 cluster-cost-observability dashboard:
    - Governance dimensions (team_owner, cost_center, ecosystem, environment, provisioner)
    - Cost (negotiated DBU USD, task/dag-attributed calculated EC2 USD, total USD), per window
    - Latency (avg/p50/p95/p99 total duration, setup duration), both windows
    - Reliability (error rate, cold start rate), both windows
    - Cluster utilization (driver/worker CPU + memory + local disk utilization), both windows
    - Spark stage signals (disk spill, peak execution / JVM heap memory,
      GC time, task skew, shuffle), both windows
    - Raw ratios (worker/driver CPU utilisation, driver-minus-worker pp,
      spill-to-input, cost efficiency), both windows
    - Data-quality coverage (Spark event log presence), both windows

  Boolean right-sizing verdicts (`is_oversized`, `is_undersized`,
  `is_driver_bound`, `is_skewed`) are intentionally NOT in this table — they
  encode policy (thresholds) and live in the `metric_observability.dag_verdict`
  view (DPLT-935) so threshold tuning doesn't require recomputing the fact.

  Both `_7d` and `_28d` metrics are NOT additive across days (windows overlap
  by 6 / 27 days on consecutive dates) but ARE additive across airflow_dag_ids
  on the same dt_window_end. is_additive: False is set on every metric for
  safety in BI tools.

  Inherits the cost-attribution caveat from the underlying fact for shared
  interactive clusters; for job clusters (the bietlejuice default) cost is 1:1.
  This table is for per-DAG trend and right-sizing analysis. Do not sum it as
  the company Databricks cost total; use dw_databricks_costs.fact_databricks_costs
  for total Platform cost tracking. EC2 windows before retained node_timeline
  coverage may include billable_usage machine-hour estimates; use
  has_ec2_estimate_* flags to surface this source-quality caveat in dashboards.

  See bietlejuice/spark_debugging/databricks-driver-cpu-investigation.md
  Phase 1.5 PR 8 for the full design.

  Partitioned by year, month, and day (derived from dt_window_end). Filter on year,
  month, and day for partition pruning when querying historical windows.
domain: Data Life Cycle
owner: mario.abreu@quintoandar.com.br
columns:
  airflow_dag_id:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.airflow_dag_id
      - dw_emr_health.fact_emr_dag_run.airflow_dag_id
    description: Airflow DAG identifier as emitted by fact_databricks_dag_run — full canonical id including the framework prefix (e.g. bietlejuice.enrich_ebdb_booking, quintoml.wonka.user_activity).
    dimension: True
  team_owner:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.team_owner
    description: |
      Team or person responsible for the DAG, lifted from
      fact_databricks_dag_run.team_owner (originally the cluster `owner`
      tag). The headline cost-attribution dimension; group-by this column to
      answer "how much did Team X spend?".
    dimension: True
  cost_center:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.cost_center
    description: |
      Internal cost-center code (e.g. `c052`), lifted from
      fact_databricks_dag_run.cost_center. Currently uniform across
      bietlejuice-managed workloads but exposed so finance dashboards can
      pivot on it without re-parsing custom_tags.
    dimension: True
  ecosystem:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.ecosystem
    description: |
      Logical ecosystem the DAG belongs to (always `data-engineering` for
      bietlejuice-managed clusters), lifted from
      fact_databricks_dag_run.ecosystem. Surfaced so cross-ecosystem
      rollups (Databricks plus other compute platforms) can use a single
      dimension.
    dimension: True
  environment:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.environment
    description: |
      Deployment environment of the cluster (prod, forno, staging), lifted
      from fact_databricks_dag_run.environment (originally the cluster
      `environment` tag). Use to filter staging/forno costs from production
      totals or to identify expensive non-prod workloads. NULL for clusters
      without the tag.
    dimension: True
  provisioner:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.provisioner
    description: |
      System that provisioned the cluster (bietlejuice, quintoml, wonka,
      customer-data-platform, databricks, etc.), lifted from
      fact_databricks_dag_run.provisioner (originally the cluster
      `provisioner` tag). Use to segment cost by orchestrator/platform.
      NULL for clusters without the tag (typically ad-hoc notebook jobs).
    dimension: True
  cost_cohort:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.cost_cohort
    description: Initiative cost cohort (bietlejuice / quintoml_wonka / cdp / tech_platform / other) passed through from fact_databricks_dag_run.
    dimension: True
  data_classification:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.data_classification
    description: LGPD / data-classification label from the DBU-dominant cluster in the logical run (`FIRST IGNORE NULLS`).
    dimension: True
  primary_dbr_version:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.primary_dbr_version
    description: DBR version of the DBU-dominant cluster in the logical run (`MAX_BY` on total_dbu_consumed).
    dimension: True
  total_dbu_consumed_7d:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.total_dbu_consumed
    description: Sum of DBUs consumed by this DAG across the 7-day window. Inherits over-attribution caveat for shared clusters.
    metric:
      name: Total DBU Consumed (7d)
      description: Total Databricks Units billed to this DAG over the trailing 7-day window. Short-window cost signal for immediate right-sizing.
      acronym: total_dbu_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  total_dbu_consumed_28d:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.total_dbu_consumed
    description: Sum of DBUs consumed by this DAG across the 28-day window. Inherits over-attribution caveat for shared clusters.
    metric:
      name: Total DBU Consumed (28d)
      description: Total Databricks Units billed to this DAG over the trailing 28-day window. Used to rank cost outliers.
      acronym: total_dbu_28d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  total_dbu_cost_usd_7d:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.total_dbu_cost_usd
    description: Sum of negotiated DBU USD (`total_dbu_cost_usd` rolled up to logical DAG runs) in the 7-day window.
    metric:
      name: Total DBU Cost USD (7d)
      description: Total estimated USD from the negotiated DBU rate for this DAG over the trailing 7-day window.
      acronym: total_dbu_cost_usd_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  total_dbu_cost_usd_28d:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.total_dbu_cost_usd
    description: Sum of negotiated DBU USD in the 28-day window.
    metric:
      name: Total DBU Cost USD (28d)
      description: Total estimated USD from the negotiated DBU rate for this DAG over the trailing 28-day window.
      acronym: total_dbu_cost_usd_28d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  avg_dbu_cost_usd_per_dag_run_7d:
    description: Average system DBU USD per approximate DAG execution (total_dbu_cost_usd_7d / total_dag_runs_7d).
    metric:
      name: Avg DBU Cost USD per DAG Run (7d)
      description: Mean negotiated DBU USD per distinct DAG-run minute bucket over the trailing 7-day window.
      acronym: avg_dbu_cost_per_dag_run_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  avg_dbu_cost_usd_per_dag_run_28d:
    description: Average system DBU USD per approximate DAG execution (total_dbu_cost_usd_28d / total_dag_runs_28d).
    metric:
      name: Avg DBU Cost USD per DAG Run (28d)
      description: Mean negotiated DBU USD per distinct DAG-run minute bucket over the trailing 28-day window.
      acronym: avg_dbu_cost_per_dag_run_28d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  total_ec2_cost_usd_7d:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.total_ec2_cost_calculated_usd
      - dw_emr_health.fact_emr_dag_run.total_ec2_cost_usd
    description: Sum of task/dag-attributed EC2 USD at logical DAG-run grain (Databricks seed-priced, EMR billed CUR).
    metric:
      name: Total EC2 Cost USD (7d)
      description: Task/dag-attributed EC2 USD for the trailing 7-day window (Databricks from dim_ec2_price; EMR from billed CUR).
      acronym: total_ec2_usd_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  total_ec2_cost_usd_28d:
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.total_ec2_cost_calculated_usd
      - dw_emr_health.fact_emr_dag_run.total_ec2_cost_usd
    description: Sum of task/dag-attributed EC2 USD at logical DAG-run grain over the 28-day window (Databricks seed-priced, EMR billed CUR).
    metric:
      name: Total EC2 Cost USD (28d)
      description: Task/dag-attributed EC2 USD for the trailing 28-day window (Databricks from dim_ec2_price; EMR from billed CUR).
      acronym: total_ec2_usd_28d
      is_additive: False
