---
database_name: metric_observability
table_name: dag_health
description: |
  Per-DAG rolling observability metrics for the bietlejuice framework. One row
  per (airflow_dag_id, dt_window_end). Every metric column is duplicated with a
  `_7d` and `_28d` suffix — both windows are computed in a single SELECT over
  the same 28-day fact read, with 7d aggregates produced via `FILTER (WHERE
  in_7d_window)`. Reads exclusively from
  dw_databricks_health.fact_databricks_task_run.

  Window choice rationale:
    - 7d  → "act this sprint". A regression yesterday shows up immediately;
            right-sizing decisions can be made before the 28d average shifts.
    - 28d → matches the Databricks billing aggregation default; smooths
            single-day spikes (Mondays, releases, ad-hoc backfills) for
            steady-state cost monitoring.

  Adding a 1d / 90d window later is mechanical: extend the underlying SQL CTE
  to read N days, add an `in_<N>d_window` flag, and add `<metric>_<N>d` columns
  alongside the existing pairs.

  Powers the Phase 4 cluster-cost-observability dashboard:
    - Governance dimensions (team_owner, cost_center, ecosystem, environment, provisioner)
    - Cost (DBU + USD), per run + total, both windows
    - Latency (avg/p50/p95/p99 total duration, setup duration), both windows
    - Reliability (error rate, cold start rate), both windows
    - Cluster utilization (driver/worker CPU + memory + NVMe), both windows
    - Spark stage signals (disk spill, peak execution / JVM heap memory,
      GC time, task skew, shuffle), both windows
    - Raw ratios (worker/driver CPU utilisation, driver-minus-worker pp,
      spill-to-input, cost efficiency), both windows
    - Data-quality coverage (Spark event log presence), both windows

  Boolean right-sizing verdicts (`is_oversized`, `is_undersized`,
  `is_driver_bound`, `is_skewed`) are intentionally NOT in this table — they
  encode policy (thresholds) and live in the `metric_observability.dag_verdict`
  view (DPLT-935) so threshold tuning doesn't require recomputing the fact.

  Both `_7d` and `_28d` metrics are NOT additive across days (windows overlap
  by 6 / 27 days on consecutive dates) but ARE additive across airflow_dag_ids
  on the same dt_window_end. is_additive: False is set on every metric for
  safety in BI tools.

  Inherits the cost-attribution caveat from the underlying fact for shared
  interactive clusters; for job clusters (the bietlejuice default) cost is 1:1.

  See bietlejuice/spark_debugging/databricks-driver-cpu-investigation.md
  Phase 1.5 PR 8 for the full design.
domain: Data Life Cycle
owner: jose.rferreira@quintoandar.com.br
columns:
  airflow_dag_id:
    lineage:
      - dw_databricks_health.fact_databricks_task_run.airflow_dag_id
    description: Airflow DAG identifier without the bietlejuice. prefix (e.g. enrich_ebdb_booking).
    dimension: True
  dt_window_end:
    description: Last day of the rolling windows (inclusive). The 7d window covers (dt_window_end - 6 days)..dt_window_end; the 28d window covers (dt_window_end - 27 days)..dt_window_end. Equal to the data_interval_start of the run that produced this row.
    dimension: True
  dag_name:
    lineage:
      - dw_databricks_health.fact_databricks_task_run.dag_name
    description: Full bietlejuice DAG name as registered in Airflow (e.g. bietlejuice.enrich_ebdb_booking).
    dimension: True
  team_owner:
    lineage:
      - dw_databricks_health.fact_databricks_task_run.team_owner
    description: |
      Team or person responsible for the DAG, lifted from
      fact_databricks_task_run.team_owner (originally the cluster `owner`
      tag). The headline cost-attribution dimension; group-by this column to
      answer "how much did Team X spend?".
    dimension: True
  cost_center:
    lineage:
      - dw_databricks_health.fact_databricks_task_run.cost_center
    description: |
      Internal cost-center code (e.g. `c052`), lifted from
      fact_databricks_task_run.cost_center. Currently uniform across
      bietlejuice-managed workloads but exposed so finance dashboards can
      pivot on it without re-parsing custom_tags.
    dimension: True
  ecosystem:
    lineage:
      - dw_databricks_health.fact_databricks_task_run.ecosystem
    description: |
      Logical ecosystem the DAG belongs to (always `data-engineering` for
      bietlejuice-managed clusters), lifted from
      fact_databricks_task_run.ecosystem. Surfaced so cross-ecosystem
      rollups (Databricks plus other compute platforms) can use a single
      dimension.
    dimension: True
  environment:
    lineage:
      - dw_databricks_health.fact_databricks_task_run.environment
    description: |
      Deployment environment of the cluster (prod, forno, staging), lifted
      from fact_databricks_task_run.environment (originally the cluster
      `environment` tag). Use to filter staging/forno costs from production
      totals or to identify expensive non-prod workloads. NULL for clusters
      without the tag.
    dimension: True
  provisioner:
    lineage:
      - dw_databricks_health.fact_databricks_task_run.provisioner
    description: |
      System that provisioned the cluster (bietlejuice, quintoml, wonka,
      customer-data-platform, databricks, etc.), lifted from
      fact_databricks_task_run.provisioner (originally the cluster
      `provisioner` tag). Use to segment cost by orchestrator/platform.
      NULL for clusters without the tag (typically ad-hoc notebook jobs).
    dimension: True

  total_runs_7d:
    lineage:
      - dw_databricks_health.fact_databricks_task_run.id_databricks_run
    description: Distinct count of Databricks job runs that started inside the 7-day window for this DAG.
    metric:
      name: Total Runs (7d)
      description: How many times this DAG was executed (counting parent run, not individual task runs) in the trailing 7-day window.
      acronym: total_runs_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Observability
      approved_by: jose.rferreira@quintoandar.com.br
  total_runs_28d:
    lineage:
      - dw_databricks_health.fact_databricks_task_run.id_databricks_run
    description: Distinct count of Databricks job runs that started inside the 28-day window for this DAG.
    metric:
      name: Total Runs (28d)
      description: How many times this DAG was executed (counting parent run, not individual task runs) in the trailing 28-day window.
      acronym: total_runs_28d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Observability
      approved_by: jose.rferreira@quintoandar.com.br
  total_task_runs_7d:
    lineage:
      - dw_databricks_health.fact_databricks_task_run.id_databricks_task_run
    description: Distinct count of Databricks task runs that started inside the 7-day window for this DAG.
    metric:
      name: Total Task Runs (7d)
      description: Total tasks executed across all runs of this DAG in the trailing 7-day window. One task run is one Spark application.
      acronym: total_task_runs_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Observability
      approved_by: jose.rferreira@quintoandar.com.br
  total_task_runs_28d:
    lineage:
      - dw_databricks_health.fact_databricks_task_run.id_databricks_task_run
    description: Distinct count of Databricks task runs that started inside the 28-day window for this DAG.
    metric:
      name: Total Task Runs (28d)
      description: Total tasks executed across all runs of this DAG in the trailing 28-day window. One task run is one Spark application.
      acronym: total_task_runs_28d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Observability
      approved_by: jose.rferreira@quintoandar.com.br

  total_dbu_consumed_7d:
    lineage:
      - dw_databricks_health.fact_databricks_task_run.dbu_consumed
    description: Sum of DBUs consumed by this DAG across the 7-day window. Inherits over-attribution caveat for shared clusters.
    metric:
      name: Total DBU Consumed (7d)
      description: Total Databricks Units billed to this DAG over the trailing 7-day window. Short-window cost signal for immediate right-sizing.
      acronym: total_dbu_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  total_dbu_consumed_28d:
    lineage:
      - dw_databricks_health.fact_databricks_task_run.dbu_consumed
    description: Sum of DBUs consumed by this DAG across the 28-day window. Inherits over-attribution caveat for shared clusters.
    metric:
      name: Total DBU Consumed (28d)
      description: Total Databricks Units billed to this DAG over the trailing 28-day window. Used to rank cost outliers.
      acronym: total_dbu_28d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  total_cost_usd_7d:
    lineage:
      - dw_databricks_health.fact_databricks_task_run.cost_usd_estimate
    description: Sum of cost_usd_estimate across the 7-day window. List price; no Graviton / pool / enterprise discount applied.
    metric:
      name: Total Cost USD (7d)
      description: Total estimated USD cost (Databricks list price * DBUs) for this DAG over the trailing 7-day window. Headline cost KPI for short-window action.
      acronym: cost_usd_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  total_cost_usd_28d:
    lineage:
      - dw_databricks_health.fact_databricks_task_run.cost_usd_estimate
    description: Sum of cost_usd_estimate across the 28-day window. List price; no Graviton / pool / enterprise discount applied.
    metric:
      name: Total Cost USD (28d)
      description: Total estimated USD cost (Databricks list price * DBUs) for this DAG over the trailing 28-day window. Headline cost KPI for steady-state monitoring.
      acronym: cost_usd_28d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  avg_cost_usd_per_run_7d:
    description: Average USD cost per run (total_cost_usd_7d / total_runs_7d). Useful for comparing DAGs of different cadences.
    metric:
      name: Avg Cost USD per Run (7d)
      description: Mean USD cost per DAG run across the trailing 7-day window. Smooths out cadence differences when ranking DAGs.
      acronym: avg_cost_per_run_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  avg_cost_usd_per_run_28d:
    description: Average USD cost per run (total_cost_usd_28d / total_runs_28d). Useful for comparing DAGs of different cadences.
    metric:
      name: Avg Cost USD per Run (28d)
      description: Mean USD cost per DAG run across the trailing 28-day window. Smooths out cadence differences when ranking DAGs.
      acronym: avg_cost_per_run_28d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  total_cost_overwatch_usd_7d:
    lineage:
      - dw_databricks_health.fact_databricks_task_run.total_cost_overwatch_usd
    description: Sum of total_cost_overwatch_usd (Overwatch DBU + EC2) across the 7-day window.
    metric:
      name: Total Overwatch Cost USD (7d)
      description: Full Overwatch cost (DBU + EC2) for this DAG over the trailing 7-day window.
      acronym: total_overwatch_usd_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  total_cost_overwatch_usd_28d:
    lineage:
      - dw_databricks_health.fact_databricks_task_run.total_cost_overwatch_usd
    description: Sum of total_cost_overwatch_usd (Overwatch DBU + EC2) across the 28-day window.
    metric:
      name: Total Overwatch Cost USD (28d)
      description: Full Overwatch cost (DBU + EC2) for this DAG over the trailing 28-day window.
      acronym: total_overwatch_usd_28d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  total_cost_blended_usd_7d:
    lineage:
      - dw_databricks_health.fact_databricks_task_run.cost_blended_usd
    description: Sum of cost_blended_usd (system billing DBU USD + Overwatch EC2) across the 7-day window.
    metric:
      name: Total Blended Cost USD (7d)
      description: Blended estimated USD (billing.usage list DBU + Overwatch EC2) over the trailing 7-day window.
      acronym: total_blended_usd_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  total_cost_blended_usd_28d:
    lineage:
      - dw_databricks_health.fact_databricks_task_run.cost_blended_usd
    description: Sum of cost_blended_usd across the 28-day window.
    metric:
      name: Total Blended Cost USD (28d)
      description: Blended estimated USD (billing.usage list DBU + Overwatch EC2) over the trailing 28-day window.
      acronym: total_blended_usd_28d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  avg_cost_blended_usd_per_run_7d:
    description: Average blended USD per run (total_cost_blended_usd_7d / total_runs_7d).
    metric:
      name: Avg Blended USD per Run (7d)
      description: Mean blended USD cost per DAG run over the trailing 7-day window.
      acronym: avg_blended_per_run_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  avg_cost_blended_usd_per_run_28d:
    description: Average blended USD per run (total_cost_blended_usd_28d / total_runs_28d).
    metric:
      name: Avg Blended USD per Run (28d)
      description: Mean blended USD cost per DAG run over the trailing 28-day window.
      acronym: avg_blended_per_run_28d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br

  avg_total_duration_seconds_7d:
    lineage:
      - dw_databricks_health.fact_databricks_task_run.total_duration_seconds
    description: Average total task duration (setup + execution + cleanup) across the 7-day window, in seconds.
    metric:
      name: Avg Total Duration (7d)
      description: Mean wall-clock seconds per task run, including cluster setup. Compare against p95 to spot variance.
      acronym: avg_total_duration_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Latency
      approved_by: jose.rferreira@quintoandar.com.br
  avg_total_duration_seconds_28d:
    lineage:
      - dw_databricks_health.fact_databricks_task_run.total_duration_seconds
    description: Average total task duration (setup + execution + cleanup) across the 28-day window, in seconds.
    metric:
      name: Avg Total Duration (28d)
      description: Mean wall-clock seconds per task run, including cluster setup. Compare against p95 to spot variance.
      acronym: avg_total_duration_28d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Latency
      approved_by: jose.rferreira@quintoandar.com.br
  p50_total_duration_seconds_7d:
    lineage:
      - dw_databricks_health.fact_databricks_task_run.total_duration_seconds
    description: 50th percentile (median) of total_duration_seconds across the 7-day window. Computed via APPROX_PERCENTILE.
    metric:
      name: p50 Total Duration (7d)
      description: Median wall-clock seconds per task run. Robust against outliers; use as the typical-run baseline.
      acronym: p50_total_duration_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Latency
      approved_by: jose.rferreira@quintoandar.com.br
  p50_total_duration_seconds_28d:
    lineage:
      - dw_databricks_health.fact_databricks_task_run.total_duration_seconds
    description: 50th percentile (median) of total_duration_seconds across the 28-day window. Computed via APPROX_PERCENTILE.
    metric:
      name: p50 Total Duration (28d)
      description: Median wall-clock seconds per task run. Robust against outliers; use as the typical-run baseline.
      acronym: p50_total_duration_28d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Latency
      approved_by: jose.rferreira@quintoandar.com.br
  p95_total_duration_seconds_7d:
    lineage:
      - dw_databricks_health.fact_databricks_task_run.total_duration_seconds
    description: 95th percentile of total_duration_seconds across the 7-day window. Computed via APPROX_PERCENTILE.
    metric:
      name: p95 Total Duration (7d)
      description: Tail latency. Large gap between p50 and p95 indicates run-to-run variance worth investigating.
      acronym: p95_total_duration_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Latency
      approved_by: jose.rferreira@quintoandar.com.br
  p95_total_duration_seconds_28d:
    lineage:
      - dw_databricks_health.fact_databricks_task_run.total_duration_seconds
    description: 95th percentile of total_duration_seconds across the 28-day window. Computed via APPROX_PERCENTILE.
    metric:
      name: p95 Total Duration (28d)
      description: Tail latency. Large gap between p50 and p95 indicates run-to-run variance worth investigating.
      acronym: p95_total_duration_28d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Latency
      approved_by: jose.rferreira@quintoandar.com.br
  p99_total_duration_seconds_7d:
    lineage:
      - dw_databricks_health.fact_databricks_task_run.total_duration_seconds
    description: 99th percentile of total_duration_seconds across the 7-day window. Computed via APPROX_PERCENTILE.
    metric:
      name: p99 Total Duration (7d)
      description: Worst-case latency. Use to gauge SLA risk on slow days.
      acronym: p99_total_duration_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Latency
      approved_by: jose.rferreira@quintoandar.com.br
  p99_total_duration_seconds_28d:
    lineage:
      - dw_databricks_health.fact_databricks_task_run.total_duration_seconds
    description: 99th percentile of total_duration_seconds across the 28-day window. Computed via APPROX_PERCENTILE.
    metric:
      name: p99 Total Duration (28d)
      description: Worst-case latency. Use to gauge SLA risk on slow days.
      acronym: p99_total_duration_28d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Latency
      approved_by: jose.rferreira@quintoandar.com.br
  avg_execution_duration_seconds_7d:
    lineage:
      - dw_databricks_health.fact_databricks_task_run.execution_duration_seconds
    description: Average execution-only duration (excludes setup) across the 7-day window, in seconds.
    metric:
      name: Avg Execution Duration (7d)
      description: Mean seconds spent in actual job execution, excluding cluster acquisition. Pair with setup duration to apportion latency.
      acronym: avg_exec_duration_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Latency
      approved_by: jose.rferreira@quintoandar.com.br
  avg_execution_duration_seconds_28d:
    lineage:
      - dw_databricks_health.fact_databricks_task_run.execution_duration_seconds
    description: Average execution-only duration (excludes setup) across the 28-day window, in seconds.
    metric:
      name: Avg Execution Duration (28d)
      description: Mean seconds spent in actual job execution, excluding cluster acquisition. Pair with setup duration to apportion latency.
      acronym: avg_exec_duration_28d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Latency
      approved_by: jose.rferreira@quintoandar.com.br
  avg_setup_duration_seconds_7d:
    lineage:
      - dw_databricks_health.fact_databricks_task_run.setup_duration_seconds
    description: Average cluster setup duration across the 7-day window, in seconds.
    metric:
      name: Avg Setup Duration (7d)
      description: Mean seconds spent acquiring a cluster (warm pool slot or cold provisioning). Healthy < 60s; > 90s is a slow pool acquisition.
      acronym: avg_setup_duration_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Latency
      approved_by: jose.rferreira@quintoandar.com.br
  avg_setup_duration_seconds_28d:
    lineage:
      - dw_databricks_health.fact_databricks_task_run.setup_duration_seconds
    description: Average cluster setup duration across the 28-day window, in seconds.
    metric:
      name: Avg Setup Duration (28d)
      description: Mean seconds spent acquiring a cluster (warm pool slot or cold provisioning). Healthy < 60s; > 90s is a slow pool acquisition.
      acronym: avg_setup_duration_28d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Latency
      approved_by: jose.rferreira@quintoandar.com.br
  p95_setup_duration_seconds_7d:
    lineage:
      - dw_databricks_health.fact_databricks_task_run.setup_duration_seconds
    description: 95th percentile of setup_duration_seconds across the 7-day window. Computed via APPROX_PERCENTILE.
    metric:
      name: p95 Setup Duration (7d)
      description: Tail of cluster acquisition time. Use to detect intermittent pool exhaustion.
      acronym: p95_setup_duration_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Latency
      approved_by: jose.rferreira@quintoandar.com.br
  p95_setup_duration_seconds_28d:
    lineage:
      - dw_databricks_health.fact_databricks_task_run.setup_duration_seconds
    description: 95th percentile of setup_duration_seconds across the 28-day window. Computed via APPROX_PERCENTILE.
    metric:
      name: p95 Setup Duration (28d)
      description: Tail of cluster acquisition time. Use to detect intermittent pool exhaustion.
      acronym: p95_setup_duration_28d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Latency
      approved_by: jose.rferreira@quintoandar.com.br

  p50_init_script_seconds_7d:
    lineage:
      - dw_databricks_health.fact_databricks_task_run.init_script_seconds
    description: |
      Median init-script execution duration (seconds) across the 7-day window. Source values
      are deduped at the (id_cluster, dt_task_started) grain (init scripts run once per
      cluster start) before computing the percentile. Computed via APPROX_PERCENTILE.
    metric:
      name: p50 Init Script Duration (7d)
      description: Typical init-script duration. Sort low → high to find DAGs with lean startup.
      acronym: p50_init_script_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Latency
      approved_by: jose.rferreira@quintoandar.com.br
  p50_init_script_seconds_28d:
    lineage:
      - dw_databricks_health.fact_databricks_task_run.init_script_seconds
    description: |
      Median init-script execution duration (seconds) across the 28-day window. Same
      cluster-day dedupe pattern as the 7d variant.
    metric:
      name: p50 Init Script Duration (28d)
      description: Typical init-script duration over the 28-day window.
      acronym: p50_init_script_28d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Latency
      approved_by: jose.rferreira@quintoandar.com.br
  p95_init_script_seconds_7d:
    lineage:
      - dw_databricks_health.fact_databricks_task_run.init_script_seconds
    description: |
      95th percentile init-script execution duration (seconds) across the 7-day window.
      Cluster-day deduped, then APPROX_PERCENTILE. Spikes here indicate occasional slow
      package installs / network flakiness during cluster startup.
    metric:
      name: p95 Init Script Duration (7d)
      description: Tail latency of init scripts. High values mean recent slow startups.
      acronym: p95_init_script_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Latency
      approved_by: jose.rferreira@quintoandar.com.br
  p95_init_script_seconds_28d:
    lineage:
      - dw_databricks_health.fact_databricks_task_run.init_script_seconds
    description: |
      95th percentile init-script execution duration (seconds) across the 28-day window.
      Cluster-day deduped before computing the percentile.
    metric:
      name: p95 Init Script Duration (28d)
      description: Sustained tail of init-script duration over the 28-day window.
      acronym: p95_init_script_28d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Latency
      approved_by: jose.rferreira@quintoandar.com.br
  total_init_minutes_7d:
    lineage:
      - dw_databricks_health.fact_databricks_task_run.init_script_seconds
    description: |
      Total wall-clock minutes spent running init scripts across all cluster starts of this
      DAG in the 7-day window. Computed as `SUM(init_script_seconds_per_cluster_day) / 60`,
      with cluster-day deduping. **Headline metric** for the optimise-or-remove init-script
      workstream — sort `DESC` to find the DAGs that would benefit most from a leaner init.
    metric:
      name: Total Init Script Minutes (7d)
      description: Cumulative init-script time. The "how big a target is this DAG?" column.
      acronym: total_init_minutes_7d
      is_additive: True
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  total_init_minutes_28d:
    lineage:
      - dw_databricks_health.fact_databricks_task_run.init_script_seconds
    description: |
      Total minutes spent running init scripts across all cluster starts of this DAG in the
      28-day window. Cluster-day deduped before SUM, then divided by 60. Pair with
      `p95_init_script_seconds_28d` to distinguish "many fast starts" (high total, low p95)
      from "few slow starts" (low total, high p95) when prioritising optimisations.
    metric:
      name: Total Init Script Minutes (28d)
      description: Cumulative init-script time over the 28-day window.
      acronym: total_init_minutes_28d
      is_additive: True
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  p95_cluster_startup_seconds_7d:
    lineage:
      - dw_databricks_health.fact_databricks_task_run.cluster_startup_seconds
    description: |
      95th percentile of total cluster startup time (`pre_init + init + post_init`) across
      the 7-day window. Cluster-day deduped. Captures end-to-end startup latency including
      DBR pull and JVM warm-up, not just init scripts.
    metric:
      name: p95 Cluster Startup (7d)
      description: End-to-end cluster startup tail (DBR pull + init + JVM warm-up).
      acronym: p95_cluster_startup_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Latency
      approved_by: jose.rferreira@quintoandar.com.br
  p95_cluster_startup_seconds_28d:
    lineage:
      - dw_databricks_health.fact_databricks_task_run.cluster_startup_seconds
    description: |
      95th percentile of total cluster startup time across the 28-day window.
      Cluster-day deduped before APPROX_PERCENTILE.
    metric:
      name: p95 Cluster Startup (28d)
      description: End-to-end cluster startup tail over the 28-day window.
      acronym: p95_cluster_startup_28d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Latency
      approved_by: jose.rferreira@quintoandar.com.br

