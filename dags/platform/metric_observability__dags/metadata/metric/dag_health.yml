    description: Sum of task/dag-attributed EC2 Spot node wall-clock hours in the 7-day window (not DBU).
    metric:
      name: EC2 Spot Node Hours (7d)
      description: "Trailing 7-day sum of EC2 Spot node-hours. EC2 node-hours split spot / on-demand (Databricks: `dim_ec2_price` availability; EMR: CUR `market`)."
      acronym: spot_hrs_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
