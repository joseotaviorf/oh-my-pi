  driver_minus_worker_cpu_pp_7d:
    description: |
      `avg_p95_driver_cpu_busy_percent_7d - avg_p95_worker_cpu_busy_percent_7d`,
      in percentage points. Positive values mean the driver is hotter than workers
      at P95 — a classic serial-driver bottleneck (Python UDFs, .toPandas(),
      .collect(), schema evolution). Sort dashboards by this column to spot DAGs
      where the worker shape is over-provisioned relative to actual parallel work.
    metric:
      name: Driver − Worker CPU (pp, 7d)
      description: Driver P95 CPU busy minus worker P95 CPU busy, averaged over the 7-day window.
      acronym: driver_minus_worker_cpu_pp_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Right-Sizing Ratios
      approved_by: jose.rferreira@quintoandar.com.br
  driver_minus_worker_cpu_pp_28d:
    description: |
      `avg_p95_driver_cpu_busy_percent_28d - avg_p95_worker_cpu_busy_percent_28d`,
      in percentage points. Positive values mean the driver is hotter than workers
      at P95 — a classic serial-driver bottleneck. Sort dashboards by this column
      to spot DAGs where the worker shape is over-provisioned relative to actual
      parallel work.
    metric:
      name: Driver − Worker CPU (pp, 28d)
      description: Driver P95 CPU busy minus worker P95 CPU busy, averaged over the 28-day window.
