    metric:
      name: Total Discount USD (7d)
      description: Total enterprise discount USD (gross minus net) for the trailing 7-day window. NULL for provisioner = 'databricks' rows.
      acronym: total_discount_usd_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  total_discount_usd_28d:
