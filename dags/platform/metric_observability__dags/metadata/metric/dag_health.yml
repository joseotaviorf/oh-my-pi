    description: Sum of task/dag-attributed EC2 net cost USD at logical DAG-run grain for the trailing 7-day window. NULL for provisioner = 'databricks' rows.
    metric:
      name: Total EC2 Net Cost USD (7d)
      description: Task/dag-attributed EC2 net cost USD for the trailing 7-day window. NULL for provisioner = 'databricks' rows.
      acronym: total_ec2_net_usd_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  total_ec2_net_cost_usd_28d:
    lineage:
      - dw_emr_health.fact_emr_dag_run.total_ec2_net_cost_usd
    description: Sum of task/dag-attributed EC2 net cost USD at logical DAG-run grain over the trailing 28-day window. NULL for provisioner = 'databricks' rows.
    metric:
      name: Total EC2 Net Cost USD (28d)
      description: Task/dag-attributed EC2 net cost USD for the trailing 28-day window. NULL for provisioner = 'databricks' rows.
      acronym: total_ec2_net_usd_28d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  total_net_cost_usd_7d:
    lineage:
      - dw_emr_health.fact_emr_dag_run.total_net_cost_usd
    description: Total enterprise-discounted net cost USD for the trailing 7-day window. NULL for provisioner = 'databricks' rows.
    metric:
      name: Total Net Cost USD (7d)
      description: Total enterprise-discounted net cost USD for the trailing 7-day window. NULL for provisioner = 'databricks' rows.
      acronym: total_net_cost_usd_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Cost
      approved_by: jose.rferreira@quintoandar.com.br
  total_net_cost_usd_28d:
    lineage:
