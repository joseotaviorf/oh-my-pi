      approved_by: jose.rferreira@quintoandar.com.br
  spill_to_input_ratio_7d:
    description: |
      `total_disk_bytes_spilled_7d / total_input_bytes_read_7d`. High values
      indicate memory pressure (executors too small for working set). Used in
      lieu of a strict heap-pressure ratio because the fact does not currently
      carry executor_memory_allocated_bytes. NULL when input bytes are zero.
    metric:
      name: Spill-to-Input Ratio (7d)
      description: Bytes spilled to disk divided by bytes read from input over the 7-day window.
      acronym: spill_input_ratio_7d
      is_additive: False
      business_stage: Platform Operations
      hierarchy: Right-Sizing Ratios
      approved_by: jose.rferreira@quintoandar.com.br
