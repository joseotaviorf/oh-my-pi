cluster:
  custom_configurations:
    aws_attributes:
      ebs_volume_size: 500
    cluster_name: mig_twin_growth__amplitude_subpartitioned
    data_security_mode: SINGLE_USER
    driver_node_type_id: c7g.4xlarge
    num_workers: 3
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment}}
      spark.driver.extraJavaOptions: -XX:MaxMetaspaceSize=1024m -XX:MetaspaceSize=256m
      spark.executor.extraJavaOptions: -XX:MaxMetaspaceSize=1024m -XX:MetaspaceSize=256m
    spark_version: 16.4.x-scala2.12
  databricks_conn_id: databricks_new
  type: consolidation_l_general_cluster
