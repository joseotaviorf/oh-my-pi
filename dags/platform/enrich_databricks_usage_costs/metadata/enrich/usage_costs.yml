---
database_name: datalake_databricks_usage_costs
table_name: usage_costs
description: |
  Deprecated enrichment joining billable_usage cluster executions with unique_clusters
  shape, pipeline DAG ownership, and gsheet contract DBU pricing. One row per unique
  (id_cluster, ts_execution) with derived bietlejuice DAG id, job context, DBU cost
  estimate, and daily execution counts. Superseded by dw_databricks_health.fact_databricks_task_run.
  Partitioned by year, month, and day derived from ts_execution. Always filter on year,
  month, and day in WHERE clauses to enable partition pruning when scanning cost history.
domain: Data Life Cycle
owner: gustavo.akashi@quintoandar.com.br
columns:
  id_cluster:
    description: |
      Databricks cluster identifier from billable_usage for this billed execution window.
      Join key to unique_clusters for runtime shape and Spark version metadata.
    lineage:
      - datalake_databricks_usage_clean.billable_usage.id_cluster
  id_dag:
    description: Relationship key between the dag and databricks.
    lineage:
      - datalake_databricks_usage_clean.billable_usage.cluster_name
  id_line:
    description: DAG line id, which is also known as the "DAG owner".
    lineage:
      - datalake_pipeline.dag
  id_job:
    description: Identification key of the executed job.
    lineage:
      - datalake_databricks_usage_clean.billable_usage.tags
  cluster_name:
    description: |
      Runtime cluster name from billable_usage. Parsed to derive bietlejuice id_dag when
      the name follows the bietlejuice job-cluster naming convention.
    lineage:
      - datalake_databricks_usage_clean.billable_usage.cluster_name
  job_name:
    description: |
      Databricks job run display name extracted from billable_usage tags RunName JSON field.
      Identifies the Workflows job when execution is not tied to a bietlejuice DAG.
    lineage:
      - datalake_databricks_usage_clean.billable_usage.tags
  cluster_compute_type:
    description: |
      Normalized Databricks compute SKU bucket (INTERACTIVE, AUTOMATED, JOBLIGHT, SQLCOMPUTE)
      mapped from billable_usage cluster_compute_type, including legacy Premium SKU aliases
      before the 2023-09 contract window.
    lineage:
      - datalake_databricks_usage_clean.billable_usage.cluster_compute_type
  execution_context:
    description: |
      Derived workload label from cluster and job metadata: bietlejuice when a bietlejuice
      DAG id is parsed from the cluster name, job for Workflows without DAG, wonka variants,
      or adhoc execution for untagged interactive clusters.
  spark_version:
    description: Spark version linked to the cluster.
    lineage:
      - datalake_databricks.unique_clusters.spark_version
  runtime_engine:
    description: One of STANDARD or PHOTON. When PHOTON.
    lineage:
      - datalake_databricks.unique_clusters.runtime_engine
  init_scripts:
    description: The initialization scripts used by the cluster.
    lineage:
      - datalake_databricks.unique_clusters.init_scripts
  custom_tags:
    description: The custom tags associated with the cluster.
    lineage:
      - datalake_databricks.unique_clusters.custom_tags
  driver_node_type:
    description: |
      EC2 instance type of the cluster driver node from unique_clusters, used for cost
      attribution and rightsizing analysis alongside worker node_type.
    lineage:
      - datalake_databricks.unique_clusters.driver_node_type
  node_type:
    description: The node type of the worker nodes.
    lineage:
      - datalake_databricks.unique_clusters.node_type
  num_workers:
    description: The number of workers in the cluster.
    lineage:
      - datalake_databricks.unique_clusters.num_workers
  autoscale:
    description: Autoscale configuration of the cluster.
    lineage:
      - datalake_databricks.unique_clusters.autoscale
  auto_termination_minutes:
    description: The number of minutes of inactivity before the cluster is automatically terminated.
    lineage:
      - datalake_databricks.unique_clusters.auto_termination_minutes
  is_elastic_disk_enabled:
    description: Indicates whether elastic disk is enabled for the cluster.
    lineage:
      - datalake_databricks.unique_clusters.is_elastic_disk_enabled
  is_automated:
    description: Indicates whether the cluster is automated.
    lineage:
      - datalake_databricks.unique_clusters.is_automated
  dbus:
    description: Cluster cost measured by the official databricks unit.
    lineage:
      - datalake_databricks_usage_clean.billable_usage.dbus
  price:
    description: Cost generated by execution.
  daily_executions:
    description: Executions of the same context that occurred on the day analyzed.
  spark_version_number:
    description: Numerical information that indicates which version of Spark is running.
    lineage:
      - datalake_databricks.unique_clusters.spark_version
  is_dag_builder_migrated:
    description: Boolean information that indicates whether the dag is linked to a job during execution.
  dt_execution:
    description: Date the execution occurred.
    lineage:
      - datalake_databricks_usage_clean.billable_usage.ts_execution
  dt_spark_updated:
    description: Date that indicates when the Spark version was updated.
    lineage:
      - datalake_databricks_usage_clean.billable_usage.ts_execution
  ts_bietlejuice_first_execution:
    description: Date information in timestamp format that indicates when the first daily execution of the dag occurred.
    lineage:
      - datalake_databricks_usage_clean.billable_usage.ts_execution
  ts_bietlejuice_last_execution:
    description: Date information in timestamp format that indicates when the last daily execution of the dag occurred.
    lineage:
      - datalake_databricks_usage_clean.billable_usage.ts_execution
  ts_job_first_execution:
    description: Date information in timestamp format that indicates when the first daily execution of the job occurred.
    lineage:
      - datalake_databricks_usage_clean.billable_usage.ts_execution
  ts_job_last_execution:
    description: Date information in timestamp format that indicates when the last daily execution of the job occurred.
    lineage:
      - datalake_databricks_usage_clean.billable_usage.ts_execution
  ts_execution:
    description: Date information in timestamp format that indicates when the cluster execution occurred.
    lineage:
      - datalake_databricks_usage_clean.billable_usage.ts_execution
  year:
    description: |
      Partition year derived from ts_execution. Filter on year, month, and day together to
      enable partition pruning when querying cluster cost rows.
    lineage:
      - datalake_databricks_usage_clean.billable_usage.year
  month:
    description: |
      Partition month (1–12) derived from ts_execution. Combine with year and day predicates
      in WHERE clauses to avoid full table scans.
    lineage:
      - datalake_databricks_usage_clean.billable_usage.month
  day:
    description: |
      Partition day of month derived from ts_execution. Always include year and month filters
      alongside day for efficient partition pruning.
    lineage:
      - datalake_databricks_usage_clean.billable_usage.day
