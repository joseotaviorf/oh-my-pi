dag:
  name: databricks_usage
  owner: Data Platform
  schedule_start_date: 2024, 5, 10
  schedule_interval: 0 3 * * *
  documentation: 
    dag_purpose: |
      This dag aims to ingest cost and usage data from Databricks.
workflow:
  type: custom_ingestion
  layer: raw
  load_spark_job: load_databricks_usage_raw
  spark_job_arguments:
    - "{environment}"
    - "{bucket}"
    - "{dag_name}"
    - "{table_name}"
    - "{partitions}"
    - "{{ ds }}"
  tables_customization:
    billable_usage:
      partitions: ["year", "month", "day"]
      extraction_type: incremental
cluster:
  type: databricks_12_2_min_io-memory_cluster
