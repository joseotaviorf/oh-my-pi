dag:
  name: databricks_usage
  owner: Data Life Cycle
  schedule_start_date: 2024, 5, 10
  schedule_interval: 0 7 * * *
  documentation:
    dag_purpose: |
      This dag aims to ingest cost and usage data from Databricks.
workflow:
  type: custom_ingestion
  layer: raw
  load_spark_job: load_databricks_usage_raw
  spark_job_arguments:
  - "{environment}"
  - "{bucket}"
  - "{dag_name}"
  - "{table_name}"
  - "{partitions}"
  - "{{ ds }}"
  tables_customization:
    billable_usage:
      partitions: ["year", "month", "day"]
      extraction_type: incremental
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, ds, 'load_end_date') }}"
cluster:
  type: databricks_12_2_min_io-memory_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
