---
database_name: dw_pipeline
table_name: fact_daily_table
description: |
  Daily snapshot fact combining per-table Databricks load cost and Trino query usage counts.
  One row per table per calendar day (grain: sk_snapshot = table + date). Joins
  load_table_costs, total_table_usage_information, and dag_inventory to attribute spend
  and downstream usage to pipeline tables. Used for table-level cost and usage observability
  in dw_pipeline.
domain: Data Life Cycle
owner: gustavo.akashi@quintoandar.com.br
columns:
  sk_snapshot:
    description: Unique snapshot table key.
    lineage:
      - datalake_dag_inventory_clean.table.table
      - datalake_databricks.task_runs.year
      - datalake_databricks.task_runs.month
      - datalake_databricks.task_runs.day
  sk_table:
    description: Fully qualified datalake table name; natural business key for the daily snapshot row.
    lineage:
      - datalake_dag_inventory_clean.table.table
  sk_line:
    description: Line for associated DAG.
    lineage:
      - datalake_pipeline.dag.id_line
  sk_dag:
    description: DAG associated with the table.
    lineage:
      - datalake_databricks.task_runs.dag_name
  sk_snapshot_date:
    description: Calendar date of the snapshot encoded as yyyyMMdd integer from task-run partition columns.
    lineage:
      - datalake_databricks.task_runs.year
      - datalake_databricks.task_runs.month
      - datalake_databricks.task_runs.day
  direct_cost:
    description: Cost for the cluster to generate this table specifically that day.
    lineage:
      - datalake_databricks.daily_clusters.total_cost
      - datalake_databricks.task_runs.execution_time_in_seconds
  total_accumulated_cost:
    description: Accumulated cost, summing the cost of the upstream tables that day.
    lineage:
      - datalake_databricks.daily_clusters.total_cost
      - datalake_databricks.task_runs.execution_time_in_seconds
  direct_usage:
    description: |
      Count of direct Trino query references to this table on the snapshot date, excluding
      downstream dependent table usage rolled up in total_accumulated_usage_count.
    lineage:
      - datalake_trino_table_usage.total_table_usage_information.individual_usage
  total_accumulated_usage_count:
    description: How many times the table or its dependents (downstream tables) were used on Trino that day.
    lineage:
      - datalake_trino_table_usage.total_table_usage_information.accumulated_usage
  year:
    description: Year when the data was loaded.
    lineage:
      - datalake_databricks.task_runs.year
  month:
    description: Month when the data was loaded.
    lineage:
      - datalake_databricks.task_runs.month
  day:
    description: Day when the data was loaded.
    lineage:
      - datalake_databricks.task_runs.day
