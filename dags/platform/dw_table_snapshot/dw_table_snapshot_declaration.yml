dag:
  name: dw_table_snapshot
  schedule_start_date: 2024, 10, 23
  owner: Data Life Cycle
  documentation:
    dag_purpose: |
      Dag with the aim of gathering cost information from tables.
workflow:
  type: query_delta
  layer: dw
  custom_schema: pipeline
  default_extraction_type: incremental
  tables_customization:
    fact_daily_table:
      merge_on: ["sk_snapshot"]
cluster:
  type: consolidation_m_memory_cluster
  databricks_conn_id: databricks_new_env
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    spark_version: 12.2.x-scala2.12
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
