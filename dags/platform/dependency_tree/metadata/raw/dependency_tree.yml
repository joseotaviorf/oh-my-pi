---
database_name: datalake_dependency_tree_raw
table_name: dependency_tree
domain: Data Life Cycle
owner: gustavo.akashi@quintoandar.com.br
description: |
  Raw ingest of the bi-etl-ejuice `dependencies.yaml` graph. Each row is one edge in
  the Airflow DAG dependency tree: a dependent DAG, its upstream DAG or task reference,
  hop level, and optional run-suffix modifier. Loaded daily by the custom Spark job
  `load_dependency_tree_raw` from the repository file. Source for
  datalake_dependency_tree_clean.dependency_tree. Not date-partitioned.
