---
database_name: datalake_dag_inventory_clean
table_name: dag
owner: gustavo.akashi@quintoandar.com.br
domain: Data Ops & Governance
description: |
  Daily snapshot of bi-etl-ejuice DAG definitions discovered via Airflow DagBag at
  ingestion time. One row per DAG per ingestion date, capturing the DAG identifier,
  repository file path, and Databricks cluster configuration parsed from the DAG's
  init-cluster task. Used by Data Ops and Governance for DAG inventory tracking,
  cluster rightsizing analysis, and FAIR metadata coverage assessments. Partitioned
  by year, month, and day (ingestion date). Always filter on year, month, and day
  in WHERE clauses to enable partition pruning when querying historical snapshots.
columns:
  dag:
    description: |
      Airflow DAG identifier (e.g. bietlejuice.enrich_airflow). Primary key together
      with the ingestion partition columns.
    lineage:
      - datalake_dag_inventory_raw.dag.dag
  dag_location:
    description: |
      Relative path to the DAG Python file within the bi-etl-ejuice repository
      (e.g. dags/platform/enrich_airflow/enrich_airflow.py).
    lineage:
      - datalake_dag_inventory_raw.dag.dag_location
  cluster_configuration:
    description: |
      JSON-serialized Databricks cluster specification extracted from the DAG's
      create-cluster or execute-job-cluster task, including node type, worker count,
      and Spark runtime version.
    lineage:
      - datalake_dag_inventory_raw.dag.cluster_configuration
  criticality:
    description: |
      Declared criticality of the DAG extracted from DAG tags. NULL when the DAG has
      no criticality tag.
    lineage:
      - datalake_dag_inventory_raw.dag.criticality
    categories:
      Critical: 'Critical tier'
      High: 'High tier'
      Medium: 'Medium tier'
      Low: 'Low tier'
  sla_deadline_localtime:
    description: Declared DAG SLA deadline in São Paulo wall-clock time extracted from DAG tags.
    lineage:
      - datalake_dag_inventory_raw.dag.sla_deadline_localtime
  freshness_max_staleness_minutes:
    description: |
      Declared maximum staleness in minutes for intraday freshness tracking extracted
      from DAG tags.
    lineage:
      - datalake_dag_inventory_raw.dag.freshness_max_staleness_minutes
  freshness_active_window_localtime:
    description: |
      Declared active window in São Paulo wall-clock time for intraday freshness
      tracking extracted from DAG tags.
    lineage:
      - datalake_dag_inventory_raw.dag.freshness_active_window_localtime
  year:
    description: |
      Ingestion partition year (DAG bag scan date). Filter on year, month, and day
      together to query a specific daily inventory snapshot.
    lineage:
      - datalake_dag_inventory_raw.dag.year
  month:
    description: |
      Ingestion partition month (1–12). Combine with year and day predicates for
      partition pruning on daily snapshots.
    lineage:
      - datalake_dag_inventory_raw.dag.month
  day:
    description: |
      Ingestion partition day of month. Always include year and month filters alongside
      day when querying historical DAG inventory records.
    lineage:
      - datalake_dag_inventory_raw.dag.day
