---
database_name: datalake_dag_inventory_clean
table_name: table
owner: gustavo.akashi@quintoandar.com.br
domain: Data Ops & Governance
description: |
  Daily snapshot of datalake tables produced by bi-etl-ejuice DAGs, enriched with
  S3 file size statistics from the ingestion run. One row per table per ingestion date,
  capturing layer, storage path, partition/file counts, and file size distribution
  metrics. Used by Data Ops and Governance for storage optimization, small-file
  detection, and FAIR metadata lineage coverage. Partitioned by year, month, and day
  (ingestion date). Always filter on year, month, and day in WHERE clauses to enable
  partition pruning when analyzing historical inventory snapshots.
columns:
  table:
    description: |
      Hive metastore table name produced by the DAG task (e.g. dag, task_instance).
      Primary identifier together with dag, task, and ingestion partition columns.
    lineage:
      - datalake_dag_inventory_raw.table.table
  dag:
    description: |
      Airflow DAG identifier that owns the table-producing task (e.g.
      bietlejuice.enrich_airflow).
    lineage:
      - datalake_dag_inventory_raw.table.dag
  task:
    description: |
      Airflow task identifier within the DAG that writes this table (e.g.
      load-astro-clean-dag).
    lineage:
      - datalake_dag_inventory_raw.table.task
  layer:
    description: |
      Datalake layer of the table (raw, clean, enrich, dw, core, or metric), indicating
      the processing stage in the medallion architecture.
    lineage:
      - datalake_dag_inventory_raw.table.layer
  files_location:
    description: |
      S3 prefix where the table's data files are stored, including bucket and layer
      path (e.g. s3://datalake-bucket/enrich/airflow/dag/).
    lineage:
      - datalake_dag_inventory_raw.table.files_location

  qty_modified_partitions:
    description: |
      Count of distinct Hive partitions modified by the DAG during the latest
      ingestion run, indicating write scope.
    lineage:
      - datalake_dag_inventory_raw.table.qty_modified_partitions
  qty_modified_files:
    description: |
      Number of individual data files written or overwritten by the DAG during the
      latest ingestion run.
    lineage:
      - datalake_dag_inventory_raw.table.qty_modified_files
  min_file_size_in_bytes:
    description: |
      Smallest file size in bytes among files modified during the latest ingestion run.
      Useful for detecting undersized files that hurt query performance.
    lineage:
      - datalake_dag_inventory_raw.table.min_file_size_in_bytes
  q25_size_in_bytes:
    description: |
      25th percentile file size in bytes among modified files, indicating the lower
      quartile of the file size distribution.
    lineage:
      - datalake_dag_inventory_raw.table.q25_size_in_bytes
  q50_size_in_bytes:
    description: |
      Median (50th percentile) file size in bytes among modified files, representing
      the typical file size written by the DAG.
    lineage:
      - datalake_dag_inventory_raw.table.q50_size_in_bytes
  q75_size_in_bytes:
    description: |
      75th percentile file size in bytes among modified files, indicating the upper
      quartile of the file size distribution.
    lineage:
      - datalake_dag_inventory_raw.table.q75_size_in_bytes
  max_file_size_in_bytes:
    description: |
      Largest file size in bytes among files modified during the latest ingestion run.
      High values may indicate compaction opportunities or oversized partitions.
    lineage:
      - datalake_dag_inventory_raw.table.max_file_size_in_bytes
  avg_file_size_in_bytes:
    description: |
      Mean file size in bytes across all modified files during the latest ingestion
      run, used to benchmark storage efficiency against platform targets.
    lineage:
      - datalake_dag_inventory_raw.table.avg_file_size_in_bytes
  qty_smaller_than_1mb:
    description: |
      Count of modified files smaller than 1 MB. Elevated counts signal small-file
      problems that increase metadata overhead and slow downstream queries.
    lineage:
      - datalake_dag_inventory_raw.table.qty_smaller_than_1mb
  qty_bigger_than_1gb:
    description: |
      Count of modified files larger than 1 GB. Elevated counts may indicate missing
      partitioning or compaction needs.
    lineage:
      - datalake_dag_inventory_raw.table.qty_bigger_than_1gb
  total_modified_files_size_in_bytes:
    description: |
      Sum of byte sizes across all files modified during the latest ingestion run,
      representing the total storage footprint of the DAG's write operation.
    lineage:
      - datalake_dag_inventory_raw.table.total_modified_files_size_in_bytes
  is_delta:
    description: |
      Boolean flag indicating whether the table uses Delta Lake format (true) or
      plain Parquet/other format (false).
    lineage:
      - datalake_dag_inventory_raw.table.is_delta
  criticality:
    description: |
      Resolved criticality of the table: its tables_customization override when set,
      otherwise the producing DAG's declared tier. NULL when the load task was built
      before the param existed.
    lineage:
      - datalake_dag_inventory_raw.table.criticality
    categories:
      Critical: 'Critical tier'
      High: 'High tier'
      Medium: 'Medium tier'
      Low: 'Low tier'
  sla_deadline_localtime:
    description: Declared table-specific SLA deadline in São Paulo wall-clock time.
    lineage:
      - datalake_dag_inventory_raw.table.sla_deadline_localtime
  year:
    description: |
      Ingestion partition year (inventory scan date). Filter on year, month, and day
      together to query a specific daily snapshot.
    lineage:
      - datalake_dag_inventory_raw.table.year
  month:
    description: |
      Ingestion partition month (1–12). Combine with year and day predicates for
      partition pruning on daily inventory records.
    lineage:
      - datalake_dag_inventory_raw.table.month
  day:
    description: |
      Ingestion partition day of month. Always include year and month filters alongside
      day when querying historical table inventory snapshots.
    lineage:
      - datalake_dag_inventory_raw.table.day
