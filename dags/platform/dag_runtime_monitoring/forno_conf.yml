# Runtime-anomaly monitoring config (Forno / local).
# Small sample list + a low min_history_runs so the logic is exercisable with little data.
# Paging set is derived from DAG tags criticality:Critical|High (dag.criticality in each declaration); override per run via trigger conf critical_dags.
dag_runtime_monitoring:
  lookback_days: 30
  min_history_runs: 15
  percentile: 99
  factor: 1.5
  min_alert_duration_minutes: 90
