# Runtime-anomaly monitoring config (Forno / local).
# Small sample list + a low min_history_runs so the logic is exercisable with little data.
# critical_dags = escalate to JiraOps (+ Chat). Upstreams that transitively block these
# also get Chat+JiraOps; other slow DAGs are Chat-only. Override via trigger conf
# ``critical_dags`` for a single run.
dag_runtime_monitoring:
  lookback_days: 30
  min_history_runs: 15
  percentile: 99
  factor: 1.5
  min_alert_duration_minutes: 60
  critical_dags:
    - bietlejuice.ebdb_location
    - bietlejuice.ebdb_user_fast_lane
    - bietlejuice.amplitude_new
