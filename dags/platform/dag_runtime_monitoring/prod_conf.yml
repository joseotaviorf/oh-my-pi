# Runtime-anomaly monitoring config (production).
#
# critical_dags: DAGs that page JiraOps on-caller when anomalously slow.
#
#   SOFT-LAUNCH (first moment in prod): this list is intentionally EMPTY, so nothing pages
#   on-call — every anomaly is reported to Google Chat instead. Once we've observed the
#   gchat signal and trust it, re-enable paging by uncommenting the seeded top-50 list
#   below (top 50 DAGs by downstream dw_* impact, derived from dags/dependencies.yaml).
#
# lookback_days:    time window (in days) of recent SUCCESS runs used for the baseline.
# min_history_runs: skip DAGs with fewer successful runs in that window (avoids false alarms).
# percentile:       percentile of historical durations used as the baseline (P90).
# factor:           alert when elapsed_time > baseline * factor. Fully relative.
dag_runtime_monitoring:
  lookback_days: 7
  min_history_runs: 3
  percentile: 90
  factor: 1.1
  # Soft-launch: empty = no JiraOps paging; all anomalies go to Google Chat only.
  critical_dags: []
