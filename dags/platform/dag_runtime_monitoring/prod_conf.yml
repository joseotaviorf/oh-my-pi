# Runtime-anomaly monitoring config (production).
#
# critical_dags: protected set that escalates to JiraOps (in addition to Chat).
# The original 5 dw_* DAGs, extended with the DAGs behind the business-critical
# tables and review-requested raw/clean, enrich, and DW DAGs (grouped below).
#
#   Every anomaly still alerts to Google Chat. When this list is non-empty:
#     * slow findings page JiraOps if the DAG is on the list OR transitively
#       blocks one of these (via dependencies.yaml);
#     * missing-run findings page JiraOps on membership only (a late upstream
#       of a listed DAG stays Chat-only — the transitive expansion is an alert
#       storm of ~28 chronically-late DAGs).
#
# lookback_days:    time window (in days) of recent SUCCESS runs used for the baseline.
# min_history_runs: skip DAGs with fewer successful runs in that window (avoids false alarms).
# percentile:       percentile of historical durations used as the baseline (P90).
# factor:           alert when elapsed_time > baseline * factor. Fully relative.
# min_alert_duration_minutes: absolute floor — only alert on runs executing at least this
#   long (AND the relative check), so quick DAGs never page regardless of relative swing.
dag_runtime_monitoring:
  lookback_days: 30
  min_history_runs: 15
  percentile: 99
  factor: 1.5
  min_alert_duration_minutes: 90
  critical_dags:
    - bietlejuice.dw_customer_support
    - bietlejuice.dw_offboarding
    - bietlejuice.dw_repairs
    - bietlejuice.dw_listing
    - bietlejuice.dw_supply
    # Fintech
    - bietlejuice.dw_credit_analysis
