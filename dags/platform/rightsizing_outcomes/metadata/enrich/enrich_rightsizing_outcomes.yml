---
database_name: datalake_databricks_health
table_name: enrich_rightsizing_outcomes
description: |
  Prod vs `__validation` twin comparison for cluster right-sizing feedback
  (Track D1). One row per validation Airflow dag run, paired with the reference
  prod run selected by trigger_cluster_validation_dags.py (--from-prod-run).

  Feeds scripts/promote_rightsizing_validations.py (promotion gate) and the
  post-promotion watch ledger. Promotion picks the latest run per DAG by val_ts_started; pairing uses the conf-persisted reference run id, exact window match, or fastest-run heuristic (see reference_match_source).
domain: Data Ops & Governance
owner: data-platform-team@quintoandar.com.br
columns:
  prod_airflow_dag_id:
    description: Production Airflow DAG identifier (validation twins strip the `__validation` suffix).
    lineage:
      - datalake_astro_clean.dag_run.id_dag
  validation_airflow_run_id:
    description: Primary key grain — validation Airflow run id (e.g. manual__2026-06-11T19:46:31…).
    lineage:
      - datalake_astro_clean.dag_run.id_run
  validation_airflow_dag_id:
    description: Full validation Airflow DAG id including `__validation` suffix.
    lineage:
      - datalake_astro_clean.dag_run.id_dag
  val_ts_started:
    description: UTC timestamp when the validation Airflow run started.
    lineage:
      - datalake_astro_clean.dag_run.ts_started
  val_ts_ended:
    description: UTC timestamp when the validation Airflow run ended.
    lineage:
      - datalake_astro_clean.dag_run.ts_ended
  val_dt:
    description: UTC calendar date of validation execution (`DATE(val_ts_started)`). Partition column.
    lineage:
      - datalake_astro_clean.dag_run.ts_started
  reference_prod_airflow_run_id:
    description: Prod Airflow run id chosen as baseline — persisted conf reference when available, else window match, else fastest successful run in 14d with wall >= 8m (see reference_match_source).
    lineage:
      - datalake_astro_clean.dag_run.id_run
  ref_ts_started:
    description: UTC timestamp when the reference prod Airflow run started.
    lineage:
      - datalake_astro_clean.dag_run.ts_started
  ref_ts_ended:
    description: UTC timestamp when the reference prod Airflow run ended.
    lineage:
      - datalake_astro_clean.dag_run.ts_ended
  reference_load_start_date:
    description: Load window start date derived from reference prod run (data_interval or conf).
    lineage:
      - datalake_astro_clean.dag_run.ts_data_interval_started
  reference_load_end_date:
    description: Load window end date derived from reference prod run (exclusive-end bump applied).
    lineage:
      - datalake_astro_clean.dag_run.ts_data_interval_ended
  window_source:
    description: How the reference load window was derived — 'conf' (reference prod run carried an explicit conf window) or 'data_interval'. NULL when no reference found.
    lineage:
      - datalake_astro_clean.dag_run.ts_data_interval_started
      - datalake_astro_clean.dag_run.configuration
  reference_match_source:
    description: How the reference prod run was matched — 'conf_run_id' (persisted by the trigger), 'conf_window' (load window equality), or 'heuristic' (fastest-run fallback). NULL when no reference found.
    lineage:
      - datalake_astro_clean.dag_run.configuration
      - datalake_astro_clean.dag_run.id_run
  val_conf_load_start_date:
    description: load_start_date the validation run actually executed with, extracted from its pickled trigger conf. NULL for runs without a parseable conf window.
    lineage:
      - datalake_astro_clean.dag_run.configuration
  val_conf_load_end_date:
    description: load_end_date the validation run actually executed with, extracted from its pickled trigger conf. NULL for runs without a parseable conf window.
    lineage:
      - datalake_astro_clean.dag_run.configuration
  schedule_interval_minutes:
    description: |
      Estimated schedule interval in minutes from successful prod runs in the load
      window (`1440 * distinct_days / run_count`). Used for cadence-bound wall SLA.
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.dt_dag_run_started
  prod_run_count:
    description: 1 when a reference prod run was matched, else 0.
    lineage:
      - datalake_astro_clean.dag_run.id_run
  val_run_count:
    description: Always 1 — one row per validation Airflow run.
  prod_failure_count:
    description: 1 when the linked reference prod Databricks logical run failed.
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.is_any_task_failed
      - dw_databricks_health.fact_databricks_dag_run.is_any_databricks_run_failed
  val_failure_count:
    description: 1 when the validation run or linked Databricks logical run failed.
    lineage:
      - datalake_astro_clean.dag_run.state
      - dw_databricks_health.fact_databricks_dag_run.is_any_task_failed
      - dw_databricks_health.fact_databricks_dag_run.is_any_databricks_run_failed
  val_clean_run_count:
    description: 1 when validation completed without task or Databricks failure.
    lineage:
      - datalake_astro_clean.dag_run.state
      - dw_databricks_health.fact_databricks_dag_run.is_any_task_failed
      - dw_databricks_health.fact_databricks_dag_run.is_any_databricks_run_failed
  prod_avg_cost_usd:
    description: Negotiated total USD for the reference prod logical run.
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.total_cost_usd
  val_avg_cost_usd:
    description: Negotiated total USD for the validation logical run.
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.total_cost_usd
  prod_wall_p50_min:
    description: Wall-clock minutes for the reference prod logical run (single-run grain).
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.total_wall_clock_seconds
  prod_wall_p95_min:
    description: Same as prod_wall_p50_min at single-run grain.
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.total_wall_clock_seconds
  val_wall_p50_min:
    description: Wall-clock minutes for the validation logical run.
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.total_wall_clock_seconds
  val_wall_p95_min:
    description: Same as val_wall_p50_min at single-run grain.
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.total_wall_clock_seconds
  prod_drv_cpu_p50:
    description: Driver CPU busy P50 for the reference prod logical run.
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.weighted_avg_p50_driver_cpu_busy_percent
  prod_drv_cpu_p95:
    description: Driver CPU busy P95 for the reference prod logical run.
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.weighted_avg_p95_driver_cpu_busy_percent
  prod_drv_mem_p95:
    description: Driver memory P95 for the reference prod logical run.
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.weighted_avg_p95_driver_mem_used_percent
  prod_wrk_cpu_p50:
    description: Worker CPU busy P50 for the reference prod logical run.
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.weighted_avg_p50_worker_cpu_busy_percent
  prod_wrk_cpu_p95:
    description: Worker CPU busy P95 for the reference prod logical run.
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.weighted_avg_p95_worker_cpu_busy_percent
  prod_wrk_mem_p95:
    description: Worker memory P95 for the reference prod logical run.
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.weighted_avg_p95_worker_mem_used_percent
  val_drv_cpu_p50:
    description: Driver CPU busy P50 for the validation logical run.
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.weighted_avg_p50_driver_cpu_busy_percent
  val_drv_cpu_p95:
    description: Driver CPU busy P95 for the validation logical run.
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.weighted_avg_p95_driver_cpu_busy_percent
  val_drv_mem_p95:
    description: Driver memory P95 for the validation logical run.
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.weighted_avg_p95_driver_mem_used_percent
  val_wrk_cpu_p50:
    description: Worker CPU busy P50 for the validation logical run.
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.weighted_avg_p50_worker_cpu_busy_percent
  val_wrk_cpu_p95:
    description: Worker CPU busy P95 for the validation logical run.
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.weighted_avg_p95_worker_cpu_busy_percent
  val_wrk_mem_p95:
    description: Worker memory P95 for the validation logical run.
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.weighted_avg_p95_worker_mem_used_percent
  prod_peak_concurrent_workers:
    description: Peak concurrent workers for the reference prod logical run.
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.peak_concurrent_workers
  val_peak_concurrent_workers:
    description: Peak concurrent workers for the validation logical run.
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.peak_concurrent_workers
  prod_driver_node_type:
    description: Driver instance type for the reference prod logical run.
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.driver_node_type
  prod_worker_node_type:
    description: Worker instance type for the reference prod logical run.
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.worker_node_type
  prod_worker_count:
    description: Worker count for the reference prod logical run.
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.worker_count
  prod_dbr_version:
    description: DBR version for the reference prod logical run.
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.primary_dbr_version
  val_driver_node_type:
    description: Driver instance type for the validation logical run.
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.driver_node_type
  val_worker_node_type:
    description: Worker instance type for the validation logical run.
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.worker_node_type
  val_worker_count:
    description: Worker count for the validation logical run.
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.worker_count
  val_dbr_version:
    description: DBR version for the validation logical run.
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.primary_dbr_version
  delta_cost_pct:
    description: Percent change of validation vs reference prod cost.
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.total_cost_usd
  delta_wall_p50_pct:
    description: Percent change of validation vs reference prod wall time.
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.total_wall_clock_seconds
  delta_wall_p95_min:
    description: Absolute minutes delta of validation vs reference prod wall time.
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.total_wall_clock_seconds
  val_mem_p95_max:
    description: Max of validation driver/worker P95 memory percent (OOM guard).
    lineage:
      - dw_databricks_health.fact_databricks_dag_run.weighted_avg_p95_driver_mem_used_percent
      - dw_databricks_health.fact_databricks_dag_run.weighted_avg_p95_worker_mem_used_percent
  is_promote_eligible:
    description: |
      True when validation has a clean run, costs less than reference prod, and wall
      time passes the cadence-aware threshold.
  outcome:
    description: |
      pass / warn / fail / extend classification. `warn` when mem P95 > 82;
      `fail` on failures, cost regression, or wall breach; `extend` when incomplete.
  promotion_action:
    description: |
      Recommended gate action — promote, reject, or extend — aligned with
      scripts/promote_rightsizing_validations.py.
  ts_load:
    description: Timestamp the row was written by the DAG.
