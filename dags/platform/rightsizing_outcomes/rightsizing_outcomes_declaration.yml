dag:
  name: rightsizing_outcomes
  schedule_interval: "0 9 * * *"
  owner: Data Life Cycle
  documentation:
    dag_purpose: |
      Prod vs `__validation` twin comparison for cluster right-sizing feedback
      (Track D1). One row per validation Airflow run, paired with the reference
      prod run selected by trigger_cluster_validation_dags.py (--from-prod-run).
      Feeds the promotion gate (scripts/promote_rightsizing_validations.py) and
      post-promotion watch. Pairing ladder: conf-persisted reference run id, exact load-window match, fastest-run heuristic.

      Uses per-task-health percentiles (p50/p95 CPU busy/wait, memory), wall
      durations, peak_concurrent_workers, and result-state flags only — stage-
      derived task_run columns are not load-bearing (~0% populated).

workflow:
  type: query_delta
  layer: enrich
  custom_schema: databricks_health
  default_extraction_type: incremental
  has_hive_sync: true
  tables_customization:
    enrich_rightsizing_outcomes:
      partitions: [val_dt]
      table_privileges:
        data-platform-engineers:
          - ALL PRIVILEGES
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, -2), 'load_start_date') }}"
    load_end_date:   "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, 1),  'load_end_date') }}"
    environment:     "{{ var.value.environment }}"
