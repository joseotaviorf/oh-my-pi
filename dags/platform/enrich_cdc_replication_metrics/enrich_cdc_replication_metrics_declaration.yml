dag:
  name: enrich_cdc_replication_metrics
  owner: Data Platform
  schedule_start_date: 2024, 5, 26
  schedule_interval: 0 9 * * *
  documentation: 
    dag_purpose: |
      This dag aims to consolidade a table with cdc metrics based on the Transactional Layer.
workflow:
  type: query_delta
  layer: enrich
  load_spark_job: load_cdc_replication_metrics
  custom_schema: dataplatform
  default_partitions: [year, month, day]
  spark_job_arguments:
    - '{bucket}'
    - '{partitions}'
    - '{{ get_date_param(dag_run, ds, "load_start_date") }}'
    - '{{ get_date_param(dag_run, tomorrow_ds, "load_end_date") }}'
    - '{schema}'
  tables_customization:
    cdc_replication_metrics: {}
cluster:
  type: databricks_12_2_med_general_cluster
