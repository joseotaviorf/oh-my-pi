---
database_name: datalake_dataplatform
table_name: cdc_replication_metrics
description: |
  Daily CDC replication health metrics per transactional table, computed from Debezium change
  events in the datalake transactional layer. Each row summarizes one database/table for the
  load date, including replication lag and hard-delete counts. Used by Data Platform to alert
  on CDC delays (enrich_cdc_replication_metrics DAG). Partitioned by year, month, and day.
  Always filter on year, month, and day in WHERE clauses to enable partition pruning and avoid
  full table scans; align partition filters with the transaction date range being analyzed.
  When filtering by database_name or table_name, combine partition predicates with those
  columns to benefit from Z-order clustering and data skipping.
domain: Data Ops & Governance
owner: gustavo.akashi@quintoandar.com.br
columns:
  database_name:
    description: Datalake transactional schema where CDC metrics were measured (e.g. ebdb).
  table_name:
    description: Source transactional table name within the database schema.
  timestamp_diff_in_seconds:
    description: |
      Replication lag in seconds between ts_database_transaction (source DB commit) and
      ts_cdc_transaction (Debezium event arrival). Higher values indicate delayed CDC delivery.
  count_of_hard_deletes:
    description: |
      Count of hard DELETE operations observed in CDC events for the table on the load date.
      Spikes may signal unexpected data removal upstream.
