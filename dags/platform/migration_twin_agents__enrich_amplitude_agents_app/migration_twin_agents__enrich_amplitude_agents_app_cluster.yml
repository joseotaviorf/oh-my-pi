cluster:
  custom_configurations:
    data_security_mode: SINGLE_USER
    driver_node_type_id: r7g.2xlarge
    num_workers: 3
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    spark_conf:
      spark.databricks.delta.targetFileSize: 134217728
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment
        }}
      spark.sql.adaptive.coalescePartitions.enabled: true
      spark.sql.adaptive.coalescePartitions.targetPostShuffleInputSize: 128MB
      spark.sql.adaptive.enabled: true
      spark.sql.shuffle.partitions: 256
  databricks_conn_id: databricks_new_env
  type: consolidation_l_memory_cluster
