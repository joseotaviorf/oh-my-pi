
---
database_name: datalake_databricks
table_name: daily_table_usage_per_user
description: |
  Daily table access counts per Databricks user from system.access.audit
  generateTemporaryTableCredential events. One row per (user_email, table_full_name,
  dt_event) with separate read and read-write operation counts. Used by Data Life Cycle
  to measure lake table adoption and identify heavy consumers. Partitioned by year, month,
  and day derived from event_date. Always filter on year, month, and day in WHERE clauses
  to enable partition pruning when scanning usage history.
domain: Data Ops & Governance 
owner: gustavo.akashi@quintoandar.com.br
columns:
  user_email:
    description: Email of the user that queried the table.
    lineage:
      - system.access.audit.user_identity.email
  catalog_name:
    description: Name of the catalog where the table is located.
    lineage:
      - system.access.audit.request_params.table_full_name
  schema_name:
    description: Name of the schema where the table is located.
    lineage:
      - system.access.audit.request_params.table_full_name
  table_name:
    description: Name of the table that was queried.
    lineage:
      - system.access.audit.request_params.table_full_name
  table_full_name:
    description: Full name of the table that was queried, in the format catalog.schema.table.
    lineage:
      - system.access.audit.request_params.table_full_name
  read_operations:
    description: Number of read operations (SELECT) performed by the user on the table in the day.
  write_operations:
    description: Number of write operations performed by the user on the table in the day.
  dt_event:
    description: Date when the events occurred.
    lineage:
      - system.access.audit.event_date
  year:
    description: |
      Partition year derived from event_date. Filter on year, month, and day together to
      enable partition pruning when querying table usage by user.
    lineage:
      - system.access.audit.event_date
  month:
    description: |
      Partition month (1–12) derived from event_date. Combine with year and day predicates
      in WHERE clauses to avoid full table scans.
    lineage:
      - system.access.audit.event_date
  day:
    description: |
      Partition day of month derived from event_date. Always include year and month filters
      alongside day for efficient partition pruning.
    lineage:
      - system.access.audit.event_date
