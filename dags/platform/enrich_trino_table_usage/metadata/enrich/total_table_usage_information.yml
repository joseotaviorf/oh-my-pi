---
database_name: datalake_trino_table_usage
table_name: total_table_usage_information
owner: gustavo.akashi@quintoandar.com.br
domain: Data Platform
description: |
  Daily Trino query visualization counts per table, combining direct usage with
  downstream dependent usage via bietlejuice_table_dependencies_with_indirection.
  Raw-layer tables often show zero individual_usage but non-zero accumulated_usage
  when clean, enrich, dw, or metric layers query them. Partitioned by year, month,
  and day (usage date). Filter on year, month, and day for partition pruning.
columns:
  table_name:
    lineage:
      - datalake_trino.table_usage_information.database_name
      - datalake_trino.table_usage_information.table_name
    description: Fully qualified table name (database.table) from Trino usage events.
  individual_usage:
    lineage:
      - datalake_trino.table_usage_information.count_visualization
    description: Count of direct Trino query references to this table, excluding downstream dependents.
  accumulated_usage:
    lineage:
      - datalake_trino.table_usage_information.count_visualization
    description: Direct usage plus summed visualization counts from all downstream dependent tables on the same date.
  year:
    lineage:
      - datalake_trino.table_usage_information.year
    description: Usage-date year partition. Filter with month and day for pruning.
  month:
    lineage:
      - datalake_trino.table_usage_information.month
    description: Usage-date month partition. Filter with year and day for pruning.
  day:
    lineage:
      - datalake_trino.table_usage_information.day
    description: Usage-date day partition. Filter with year and month for pruning.
