---
database_name: datalake_databricks
table_name: daily_pool_idle_time
description: |
  "Provides daily metrics about the idle time of EC2 instances. This was created to analyze efficiency of instance pools.
  Important: the idle time is not very accurate, but an approximation. Overwatch's reported usage time doesn't seem to match with the aws_costs table very well."
domain: Data Ops & Governance 
owner: data-platform-team@quintoandar.com.br
columns:
  node_type:
    description: The node type of the instance.
  pool_name:
    description: The name of the instance pool. It can be null if the instance is not in a pool.
  num_nodes:
    description: The number of nodes used.
  total_aws_compute_seconds:
    description: The total time in seconds the nodes were up in AWS.
  total_databricks_compute_seconds:
    description: The total time in seconds the nodes were being used by Databricks.
  total_aws_idle_time_in_seconds:
    description: The total time in seconds the nodes were up in AWS but not being used by Databricks.
  avg_idle_time_per_instance_in_seconds:
    description: The average idle time per instance in seconds.
  dt_cluster_run:
    description: The date the cluster was run.
