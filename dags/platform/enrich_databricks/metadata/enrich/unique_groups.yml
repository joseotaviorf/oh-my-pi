---
database_name: datalake_databricks
table_name: unique_groups
description: |
  Slowly-changing dimension of every Databricks account group ever observed in QuintoAndar snapshots,
  merged incrementally from daily_groups. One row per id_group with external ID, display name, and
  soft-delete tracking when a group disappears from the latest daily snapshot. Supports longitudinal
  group governance and privilege audits when combined with daily_table_privileges and
  daily_group_members. Part of the enrich_databricks DAG (daily). Not partitioned — use dt_updated
  or join daily_groups with partition filters for point-in-time membership.
domain: Data Ops & Governance
owner: gustavo.akashi@quintoandar.com.br
columns:
  id_group:
    description: |
      Internal Databricks group identifier, stable merge key from daily_groups and join target for
      daily_group_members and privilege resolution.
    lineage:
      - datalake_databricks.daily_groups.id_group
  id_group_external:
    description: |
      External identity-provider group identifier from daily_groups, typically mapping to SSO or
      corporate directory group objects outside Databricks.
    lineage:
      - datalake_databricks.daily_groups.id_group_external
  display_name:
    description: |
      Current group display name from the latest daily_groups snapshot, matched against Unity Catalog
      grantee strings for group-based privileges.
    lineage:
      - datalake_databricks.daily_groups.display_name
  dt_created:
    description: |
      Date when the group first appeared in daily_groups snapshots. Groups predating table creation
      on 2025-10-01 retain that date as the earliest observable first-seen value.
  dt_updated:
    description: |
      Date of the most recent daily_groups snapshot that changed external ID, display name, or
      deletion status for this group.
  dt_deleted:
    description: |
      Date when the group was inferred deleted because it no longer appears in the current daily_groups
      snapshot while still active in this dimension. Null while the group remains in the latest snapshot.
