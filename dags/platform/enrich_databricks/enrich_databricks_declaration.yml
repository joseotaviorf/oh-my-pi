dag:
  name: enrich_databricks
  owner: Data Platform
  schedule_interval: 0 0 * * *
  documentation: 
    dag_purpose: |
      Generate metrics about databricks Clusters using Overwatch data.
workflow:
  type: query_delta
  layer: enrich
  default_extraction_type: incremental
  tables_customization:
    daily_clusters:
      partitions: [ dt_cluster_run ]
    unique_clusters:
      merge_on: [ id_cluster ]
      when_matched_update_condition: "source.ts_updated > target.ts_updated"
    # Removing this temporarily while we're fixing the issue with aws_costs_new
    # daily_pool_idle_time:
    #   partitions: [ dt_cluster_run ]
  inner_dependencies:
    daily_clusters:
      - unique_clusters
    # daily_pool_idle_time:
    #   - daily_clusters
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, tomorrow_ds, 'load_end_date') }}"
cluster:
  type: databricks_13_3_med_general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
