dag:
  name: enrich_databricks_health
  schedule_interval: "0 9 * * *"
  owner: Data Life Cycle
  documentation:
    dag_purpose: |
      Daily per-cluster health snapshot from Databricks system tables
      (system.compute.node_timeline, system.compute.clusters) plus SQL
      reads of datalake_databricks_usage_clean.billable_usage (EC2 estimate
      only before node_timeline retention) and datalake_databricks.daily_clusters
      (init-script timing). Scheduled at 09:00 UTC on D+1 so lagged system
      tables are settled for calendar day D before this DAG runs.

      One row per (cluster_id, dt_cluster_run). Captures P50/P95 of CPU,
      memory, I/O wait and NVMe utilization plus cluster shape for every
      cluster with observations in the workspace load window (no provisioner filter).

      Powers the cluster sizing / consolidation work tracked in
      bietlejuice/spark_debugging/databricks-driver-cpu-investigation.md and
      replaces the ad-hoc MCP queries that have been used for the past
      investigation cycle.
workflow:
  type: query_delta
  layer: enrich
  default_extraction_type: incremental
  has_hive_sync: true
  tables_customization:
    daily_cluster_health:
      partitions: [ dt_cluster_run ]
      table_privileges:
        data-platform-engineers:
          - ALL PRIVILEGES
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, -2), 'load_start_date') }}"
    load_end_date:   "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, 1),  'load_end_date') }}"
    environment:     "{{ var.value.environment }}"
