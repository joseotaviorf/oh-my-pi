---
table_name: dw_databricks_costs.fact_databricks_costs
alert_channel: "#alerts-de-airflow-dags"

table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error

column_level_validations:
  sk_databricks_cost:
    is_unique:
      severity_level: Error
    is_complete:
      severity_level: Error
  id_databricks_workspace:
    is_complete:
      severity_level: Error
  dt_usage:
    is_complete:
      severity_level: Error
  billing_origin_product:
    is_complete:
      severity_level: Error
  bucket:
    is_complete:
      severity_level: Error
    is_contained_in:
      values:
        - orchestrated_jobs
        - interactive
        - sql_warehouse
        - ml_serving
        - streaming_dlt
        - platform_managed
        - apps_lakebase
        - other
      severity_level: Error
  compute_type:
    is_complete:
      severity_level: Error
    is_contained_in:
      values:
        - JOBS
        - ALL_PURPOSE
        - SQL
        - OTHER
      severity_level: Error
  pricing_category:
    is_complete:
      severity_level: Warning
  ec2_source:
    is_complete:
      severity_level: Warning
    is_contained_in:
      values:
        - node_timeline
        - billable_usage_estimate
        - missing
        - not_applicable
      severity_level: Warning
    custom:
      constraint: |-
        (SELECT COUNT(*)
         FROM dw_databricks_costs.fact_databricks_costs AS fact
         LEFT JOIN (
             SELECT
                 CAST(workspace_id AS BIGINT) AS id_databricks_workspace,
                 MIN(DATE(start_time))        AS dt_node_timeline_first_available
             FROM system.compute.node_timeline
             GROUP BY CAST(workspace_id AS BIGINT)
         ) AS coverage
           ON fact.id_databricks_workspace = coverage.id_databricks_workspace
         WHERE fact.id_cluster IS NOT NULL
           AND fact.ec2_source = 'missing'
           AND fact.dt_usage >= coverage.dt_node_timeline_first_available
           AND fact.dt_usage <= DATE_SUB(CURRENT_DATE(), 2)
        ) = 0
      severity_level: Warning
  ec2_pricing_missing:
    custom:
      constraint: |-
        (SELECT COUNT(*)
         FROM dw_databricks_costs.fact_databricks_costs
         WHERE ec2_source = 'node_timeline'
           AND ec2_pricing_missing = TRUE
        ) = 0
      severity_level: Warning
  ec2_unpriced_hours:
    custom:
      constraint: |-
        (SELECT COALESCE(SUM(ec2_unpriced_hours), 0)
         FROM dw_databricks_costs.fact_databricks_costs
         WHERE ec2_source = 'node_timeline'
        ) = 0
      severity_level: Warning
  dbu:
    # Net DBU is >= 0 in practice; a net-negative group would only arise from a
    # RETRACTION exceeding its ORIGINAL in the window. Warning (not Error) so the
    # correction-aware design does not block on legitimate negative nets.
    has_min_value:
      greater_than_or_equal_to: 0
      severity_level: Warning
    custom:
      constraint: |-
        (SELECT COUNT(*)
         FROM (
             SELECT
                 id_databricks_workspace AS workspace_id,
                 dt_usage,
                 billing_origin_product,
                 SUM(dbu) AS fact_dbu
             FROM dw_databricks_costs.fact_databricks_costs
             WHERE dt_usage > DATE_SUB((SELECT MAX(dt_usage) FROM dw_databricks_costs.fact_databricks_costs), 2)
             GROUP BY id_databricks_workspace, dt_usage, billing_origin_product
         ) f
         FULL OUTER JOIN (
             SELECT
                 workspace_id,
                 DATE(usage_date) AS dt_usage,
                 billing_origin_product,
                 SUM(usage_quantity) AS bill_dbu
             FROM system.billing.usage
             WHERE usage_unit = 'DBU'
               AND workspace_id IN (4531937035440038, 6170817193817, 4033397625841925)
               AND DATE(usage_date) BETWEEN DATE_SUB((SELECT MAX(dt_usage) FROM dw_databricks_costs.fact_databricks_costs), 1)
                                        AND (SELECT MAX(dt_usage) FROM dw_databricks_costs.fact_databricks_costs)
             GROUP BY workspace_id, DATE(usage_date), billing_origin_product
             HAVING SUM(usage_quantity) <> 0
         ) b
           ON  f.workspace_id           = b.workspace_id
           AND f.dt_usage               = b.dt_usage
           AND f.billing_origin_product = b.billing_origin_product
         WHERE ABS(COALESCE(f.fact_dbu, 0) - COALESCE(b.bill_dbu, 0)) > 1.0
        ) = 0
      severity_level: Warning
  negotiated_usd_per_dbu:
    custom:
      constraint: |-
        (SELECT COUNT(*)
         FROM datalake_databricks_pricing.dim_dbu_price
         WHERE is_current = TRUE
           AND dt_valid_to IS NULL
           AND CURRENT_DATE() > DATE('2026-09-01')
        ) = 0
      severity_level: Warning
  total_cost_usd:
    # Strict billing-spine reconciliation only for settled dates: every
    # (workspace, day, billing_origin_product) through max fact date - 2 days must
    # match system.billing.usage net DBU for the same key (|delta| <= 1.0 DBU).
    # The freshest two fact days are warning-only under `dbu` because Databricks
    # billing corrections can land after the daily load.
    custom:
      constraint: |-
        (SELECT COUNT(*)
         FROM (
             SELECT
                 id_databricks_workspace AS workspace_id,
                 dt_usage,
                 billing_origin_product,
                 SUM(dbu) AS fact_dbu
             FROM dw_databricks_costs.fact_databricks_costs
             WHERE dt_usage <= DATE_SUB((SELECT MAX(dt_usage) FROM dw_databricks_costs.fact_databricks_costs), 2)
             GROUP BY id_databricks_workspace, dt_usage, billing_origin_product
         ) f
         FULL OUTER JOIN (
             SELECT
                 workspace_id,
                 DATE(usage_date) AS dt_usage,
                 billing_origin_product,
                 SUM(usage_quantity) AS bill_dbu
             FROM system.billing.usage
             WHERE usage_unit = 'DBU'
               AND workspace_id IN (4531937035440038, 6170817193817, 4033397625841925)
              AND DATE(usage_date) BETWEEN (SELECT MIN(dt_usage) FROM dw_databricks_costs.fact_databricks_costs)
                                       AND DATE_SUB((SELECT MAX(dt_usage) FROM dw_databricks_costs.fact_databricks_costs), 2)
             GROUP BY workspace_id, DATE(usage_date), billing_origin_product
             HAVING SUM(usage_quantity) <> 0
         ) b
           ON  f.workspace_id           = b.workspace_id
           AND f.dt_usage               = b.dt_usage
           AND f.billing_origin_product = b.billing_origin_product
         WHERE ABS(COALESCE(f.fact_dbu, 0) - COALESCE(b.bill_dbu, 0)) > 1.0
        ) = 0
      severity_level: Error
  price_missing:
    custom:
      constraint: |-
        (SELECT COALESCE(
                    SUM(CASE WHEN price_missing = TRUE THEN dbu ELSE 0 END)
                    / NULLIF(SUM(dbu), 0),
                    0
                )
         FROM dw_databricks_costs.fact_databricks_costs
         WHERE dt_usage >= TO_DATE(CONCAT(YEAR(CURRENT_DATE()), '-01-01'))
        ) <= 0.05
      severity_level: Warning
  ts_load:
    is_complete:
      severity_level: Warning
  # Initiative-shaped workloads must classify to a non-'other' cohort. The
  # predicate is deliberately provisioner/name-prefix based — NOT
  # `team_owner IS NOT NULL` — because owner-tagged ad-hoc/platform jobs
  # (Overwatch, data_quality_tests_streaming, sandbox tables) legitimately
  # live in 'other'. Raw hyphenated names (bietlejuice-*, quintoml-*) are
  # included so a workload_name_norm normalization regression cannot hide
  # name-only-matchable rows from this guard. A failure means
  # dim_cost_cohort needs a new rule (priority 62+), not a weaker check.
  cost_cohort_initiative_workloads_classified:
    custom:
      constraint: |-
        (SELECT COUNT(*)
         FROM dw_databricks_costs.fact_databricks_costs
         WHERE cost_cohort = 'other'
           AND (provisioner_resolved IN ('bietlejuice', 'wonka', 'quintoml', 'quintoml-ml', 'customer-data-platform')
                OR LOWER(workload_name) LIKE 'bietlejuice.%'
                OR LOWER(workload_name) LIKE 'bietlejuice-%'
                OR LOWER(workload_name) LIKE 'quintoml.%'
                OR LOWER(workload_name) LIKE 'quintoml-%'
                OR LOWER(workload_name) LIKE 'wonka.%'
                OR LOWER(workload_name) LIKE 'wonka-%')
        ) = 0
      severity_level: Error
  # Unattributed-share drift alarm: 'other' sits at ~33-37% of monthly spend in
  # 2026; a month above 45% means the cohort rules stopped covering new spend.
  cost_cohort_other_share_ceiling:
    custom:
      constraint: |-
        (SELECT MAX(other_share)
         FROM (
             SELECT
                 SUM(CASE WHEN cost_cohort = 'other' THEN total_cost_usd ELSE 0 END)
                     / NULLIF(SUM(total_cost_usd), 0) AS other_share
             FROM dw_databricks_costs.fact_databricks_costs
             WHERE dt_usage >= DATE('2026-01-01')
             GROUP BY year, month
         )
        ) <= 0.45
      severity_level: Warning
