---
database_name: datalake_databricks_clean
table_name: table_usage_in_queries
description: Each row represents a pair of (query, table used in the query) in bietlejuice queries.
  The tables are extracted from the queries using a simple regex pattern. Additionally, it is important
  to mention that, since old query files are not removed from S3, many rows identified in the snapshot
  are not up-to-date. Join with a separate table, like dag_inventory, to get only the currently existing tables.
  The snapshot is taken daily.
domain: Data Ops & Governance 
owner: data-platform-team@quintoandar.com.br
columns:
  query_table_name:
    description: The name of the query file, without the extension or directory.
    lineage:
      - datalake_databricks_raw.table_usage_in_queries.query_table_name
  query_dag_name:
    description: The name of the DAG package that contains the query.
    lineage:
      - datalake_databricks_raw.table_usage_in_queries.query_dag_name
  query_layer:
    description: The layer of the query.
    lineage:
      - datalake_databricks_raw.table_usage_in_queries.query_layer
  query_path:
    description: The path of the query file.
    lineage:
      - datalake_databricks_raw.table_usage_in_queries.query_path
  used_table:
    description: The name of the table used in the query.
    lineage:
      - datalake_databricks_raw.table_usage_in_queries.used_table
  ts_query_last_modified:
    description: The timestamp of the last modification of the query file.
    lineage:
      - datalake_databricks_raw.table_usage_in_queries.query_last_modified
  year:
    description: Year of the snapshot.
    lineage:
      - datalake_databricks_raw.table_usage_in_queries.year
  month:
    description: Month of the snapshot.
    lineage:
      - datalake_databricks_raw.table_usage_in_queries.month
  day:
    description: Day of the snapshot.
    lineage:
      - datalake_databricks_raw.table_usage_in_queries.day
  