---
database_name: datalake_databricks_clean
table_name: table_usage_in_queries
description: |
  Daily snapshot of tables referenced in bi-etl-ejuice SQL query files. Each row is
  one (query file, used_table) pair extracted via regex from S3-stored queries.
  Stale rows persist when old query files remain in S3 after deletion from the repo;
  join dag_inventory or filter by ts_query_last_modified for current tables only.
  Source for bietlejuice_table_dependencies. Partitioned by year, month, and day
  (snapshot date). Filter on year, month, and day for partition pruning.
domain: Data Ops & Governance
owner: gustavo.akashi@quintoandar.com.br
columns:
  query_table_name:
    description: Query file base name without directory path or file extension.
    lineage:
      - datalake_databricks_raw.table_usage_in_queries.query_table_name
  query_dag_name:
    description: DAG package folder name that contains the query file.
    lineage:
      - datalake_databricks_raw.table_usage_in_queries.query_dag_name
  query_layer:
    description: Processing layer of the query (raw, clean, enrich, dw, metric, etc.).
    lineage:
      - datalake_databricks_raw.table_usage_in_queries.query_layer
  query_path:
    description: Repository-relative path to the SQL file within bi-etl-ejuice.
    lineage:
      - datalake_databricks_raw.table_usage_in_queries.query_path
  used_table:
    description: Fully qualified table name parsed from the query body.
    lineage:
      - datalake_databricks_raw.table_usage_in_queries.used_table
  ts_query_last_modified:
    description: S3 last-modified timestamp of the query file; use to detect stale inventory rows.
    lineage:
      - datalake_databricks_raw.table_usage_in_queries.query_last_modified
  year:
    description: Snapshot year partition. Filter with month and day for pruning.
    lineage:
      - datalake_databricks_raw.table_usage_in_queries.year
  month:
    description: Snapshot month partition. Filter with year and day for pruning.
    lineage:
      - datalake_databricks_raw.table_usage_in_queries.month
  day:
    description: Snapshot day partition. Filter with year and month for pruning.
    lineage:
      - datalake_databricks_raw.table_usage_in_queries.day
