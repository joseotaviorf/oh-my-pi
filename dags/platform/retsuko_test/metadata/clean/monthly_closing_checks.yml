    description: "Unique ID Internal from the check"
    lineage:
      - datalake_retsuko_test_raw.monthly_closing_checks.id
  id_external:
    description: "Unique ID External from the check"
    lineage:
      - datalake_retsuko_test_raw.monthly_closing_checks.external_id
  id_contract:
    description: "Internal Contract ID from retsuko table"
    lineage:
      - datalake_retsuko_test_raw.monthly_closing_checks.contract_id
  checks:
    description: "Checks, alerts and information about monthly closing"
    lineage:
      - datalake_retsuko_test_raw.monthly_closing_checks.checks
  accrual_year_month:
    description: "Year/month invoice accrual"
    lineage:
      - datalake_retsuko_test_raw.monthly_closing_checks.accrual_year_month
  ts_created:
    description: "Timestamp that refers to when the monthly check was created"
