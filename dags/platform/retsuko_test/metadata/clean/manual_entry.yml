database_name: datalake_retsuko_test_clean
table_name: manual_entry
owner: kleber.inoue@quintoandar.com.br
domain: fintech
description: Table from Retsuko source that contains all the audit/manual entries data of the entries.
columns:
  id:
    lineage:
      - datalake_retsuko_test_raw.manual_entry.id
    description: ID of the table.
  id_contract:
    lineage:
      - datalake_retsuko_test_raw.manual_entry.id_contract
    description: Contract ID from Retsuko source. It can't be joined with contract table from EBDB.
  id_from_account:
    lineage:
      - datalake_retsuko_test_raw.manual_entry.id_from_account
    description: ID account from Retsuko source. It can't be joined with user table from EBDB.
  id_to_account:
    lineage:
      - datalake_retsuko_test_raw.manual_entry.id_to_account
    description: ID account from Retsuko source. It can't be joined with user table from EBDB.
  id_external:
    lineage:
      - datalake_retsuko_test_raw.manual_entry.id_external
    description: ID external.
  id_from_entry:
    lineage:
      - datalake_retsuko_test_raw.manual_entry.from_entry
    description: Origin ID entry from Retsuko source.
  id_to_entry:
    lineage:
      - datalake_retsuko_test_raw.manual_entry.to_entry
    description: Receiver ID entry from Retsuko source.
  id_audit:
    lineage:
      - datalake_retsuko_test_raw.manual_entry.audit
    description: ID of the audit.
  producer:
    lineage:
      - datalake_retsuko_test_raw.manual_entry.producer
    description: Producer type of the entry.
  type:
    lineage:
      - datalake_retsuko_test_raw.manual_entry.type
    description: Type of the entry bill.
  description:
    lineage:
      - datalake_retsuko_test_raw.manual_entry.description
    description: Description of the entry bill.
  amount:
    lineage:
      - datalake_retsuko_test_raw.manual_entry.amount
    description: Amount value of the bill.
  installment_number:
    lineage:
      - datalake_retsuko_test_raw.manual_entry.installment_number
    description: Installment number of the entry.
  installment_total_number:
    lineage:
      - datalake_retsuko_test_raw.manual_entry.installment_total_number
    description: Total installment number of the entry.
  installment_total_amount:
    lineage:
      - datalake_retsuko_test_raw.manual_entry.installment_total_amount
    description: Total installment number of the all entries.
  is_removed:
    lineage:
      - datalake_retsuko_test_raw.manual_entry.is_removed
    description: Boolean value to check if the record was removed.
  accrual_year_month:
    lineage:
      - datalake_retsuko_test_raw.manual_entry.accrual_year_month
    description: Accrual year month of the entry.
  dt_accrued:
    lineage:
      - datalake_retsuko_test_raw.manual_entry.accrued_date
    description: Competence date of the entry.
  ts_last_operation:
    lineage:
      - datalake_retsuko_test_raw.manual_entry.last_operation_date
    description: Timestamp of the last operation date.
