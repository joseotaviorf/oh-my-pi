dag:
  name: enrich_databricks_job_runs
  owner: Data Platform
  documentation: 
    dag_purpose: |
      Generate metrics about job runs on Databricks.
workflow:
  type: query_delta
  layer: enrich
  custom_schema: databricks
  default_extraction_type: incremental
  default_partitions: [year, month, day]
  inner_dependencies:
    load_table_costs:
      - task_runs
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, tomorrow_ds, 'load_end_date') }}"
cluster:
  type: databricks_13_3_med_general_cluster
