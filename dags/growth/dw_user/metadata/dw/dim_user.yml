---
database_name: dw_public
table_name: dim_user
description: >
  Dimension table with one row per unique user registered in QuintoAndar's platform, sourced
  from datalake_ebdb_user. Covers all user roles — tenant, house owner, agent, affiliate,
  doorman affiliate, photographer, Inside Sales analyst, and partner agent. Might contain PII data.
  Key for user-level analysis across the full rental funnel and for joining role-specific dimension
  tables (dim_user_doorman, dim_partner_agent). Partitioned by country_code.
domain: Growth
owner: isadora.gallerani@quintoandar.com.br
columns:
  sk_user:
    lineage:
    - datalake_ebdb_user.user.id
    description: Unique ID of user, it's the primary key of this table. It's the EBDB.Usuario.id. 
  sk_doorman_joined_date:
    lineage:
    - datalake_ebdb_user.affiliate_data.ts_doorman_joined
    description: Date when doorman joined, if user is affiliate of type doorman.
  id:
    lineage:
    - datalake_ebdb_user.user.id
    description: Unique ID of user, it's the primary key of this table. It has the same value of sk_user.
  uuid_person:
    lineage:
    - datalake_ebdb_user.user.uuid_person
    description: Unique Person uuid. It's the EBDB.Person.uuid_person.
  dados_agente_id:
    lineage:
    - datalake_ebdb_user.user.id_agent
    description: Key of agent, if user is agent.
  dados_fotografo_id:
    lineage:
    - datalake_ebdb_user.user.id_photographer_data
    description: Key of photographer, if user is photographer.
  dados_vendedor_id:
    lineage:
    - datalake_ebdb_user.user.id_sales_rep
    description: Key of Inside Sales Analyst, if user is Inside Sales Analyst.
  dados_afiliado_id:
    lineage:
    - datalake_ebdb_user.user.id_affiliates
    description: Key of affiliate, if user is affiliate.
  facebook_id:
    lineage:
    - datalake_ebdb_user.user.id_facebook
    description: Facebook ID registered when the user signs up using Facebook account.
  linkedin_id:
    lineage:
    - datalake_ebdb_user.user.id_linkedin
    description: Linkedin ID registered when the user signs up using Linkedin account.
  google_id:
    lineage:
    - datalake_ebdb_user.user.id_google
    description: Google ID registered when the user signs up using Google account.
  predecessor_user_list:
    lineage:
    - datalake_ebdb_user.user_merge.predecessor_user_list
    description: List with the ID user that the current user (sk_user) has already been.
  country_code:
    lineage:
    - datalake_ebdb_user.user.country_code
    description: ISO country code for geographic filtering of the analytical metric.
    categories:
      BR: Brazil's country code.
      MX: Mexico's country code.
  active:
    lineage:
    - datalake_ebdb_user.user.is_active
    description: Integer flag that indicates if the user is active.
    categories:
      '1': True.
      '0': False.
  bloqueado:
    lineage:
    - datalake_ebdb_user.user.is_blocked
    description: Integer flag that indicates if the user is blocked.
    categories:
      '1': True.
      '0': False.
  dadosafiliado_ativo:
    lineage:
    - datalake_ebdb_user.affiliate_data.is_active
    description: Boolean flag that indicates if the user is affiliate, flag indicates whether user is still registered in the affiliates program (same field as dim_user_affiliate.is_active).
  dadosagente_ativo:
    lineage:
    - datalake_ebdb_user.agent_data.is_active
    description: Integer flag that indicates if the user is an active agent or not.
    categories:
      '1': Active.
      '0': Not active.
  dadosfotografo_ativo:
    lineage:
    - datalake_ebdb_clean.photographer_data.is_active
    description: Integer flag that indicates if the user is an active photographer or not.
    categories:
      '1': Active.
      '0': Not active.
  dadossecretaria_ativo:
    lineage:
    - datalake_secretariat.secretariat_allocation_history.id_secretariat_user
    - datalake_secretariat.secretariat_allocation_history.ts_allocation_ended
    description: Boolean flag that indicates if the user is an active secretariat or not.
  flg_doorman_affiliate:
    lineage:
    - datalake_ebdb_user.affiliate_data.is_doorman_affiliate
    description: Integer flag that indicates if the user is an affiliate of type doorman.
    categories:
      '1': True.
      '0': False.
  inquilino:
    lineage:
    - datalake_ebdb_user.user.is_tenant
    description: Integer flag that indicates if the user is a tenant with QuintoAndar.
    categories:
      '1': True.
      '0': False.
  is_sale_agent:
    lineage:
    - datalake_ebdb_user.agent_data.is_sale_agent
    description: Boolean flag that indicates if the user is an Agent in QuintoAndar working with Sales.
  is_rent_agent:
    lineage:
    - datalake_ebdb_user.agent_data.is_rent_agent
    description: Boolean flag that indicates if the user is an Agent in QuintoAndar working with Rentals.
  is_secretariat_user:
    lineage:
    - datalake_secretariat.secretariat_allocation_history.id_secretariat_user
    description: Boolean flag that indicates if the user is a Secretariat user.
  is_user_merged:
    description: Boolean flag that indicates if the user was merged into a new one.
  dadosbancarios_outro_titular:
    lineage:
    - datalake_ebdb_user.user.bank_another_holder
    description: Integer flag that indicates if the user's bank account has another person associated to it (e.g., spouse).
    categories:
      '1': True.
      '0': False.
  tem_imovel:
    lineage:
    - datalake_ebdb_user.user.has_house
    description: Integer flag that indicates if the user is the owner of a house listed with QuintoAndar.
    categories:
      '1': True.
      '0': False.
  tem_app_inquilino:
    lineage:
    - datalake_ebdb_user.user.has_tenant_app
    description: Integer flag that indicates if the user has tenant app.
    categories:
      '1': True.
      '0': False.
  tem_contrato_ativo:
    lineage:
    - datalake_ebdb_user.user.has_active_contract
    description: Integer flag that indicates if the user has or had an active rental contract.
    categories:
      '1': True.
      '0': False.
  aceita_sms:
    lineage:
    - datalake_ebdb_user.user.has_accepted_sms
    description: Integer flag that indicates if the user has accepted to receive SMS.
    categories:
      '1': True.
      '0': False.
  nome:
    lineage:
    - datalake_ebdb_user.user.name
    description: Full name of user captured in the source operational system.
  cpf:
    lineage:
    - datalake_ebdb_user.user.cpf
    description: CPF (Tax Identification Number) of user or the CNPJ (Brazilian National Registry of Legal Entities) if the user is a legal entity, with dot and hyphen formatting.
  rg:
    lineage:
    - datalake_ebdb_user.user.rg
    description: RG (Brazilian national lD) of user. In most cases the RG is linked with a non entity user, but there's no rule that an entity user can't fill the RG field.
  sexo:
    lineage:
    - datalake_ebdb_user.user.gender
    description: User's gender captured in the source operational system.
    categories:
      Feminino: Female gender.
      Masculino: Male gender.
  email:
    lineage:
    - datalake_ebdb_user.user.email
    description: Primary email address used by the user to authenticate and receive communications from QuintoAndar.
  ts_last_self_validation_email:
    description: Timestamp of when the user carried out the most recent self validation for their email.
  email_alternativo:
    lineage:
    - datalake_ebdb_user.user.alternative_email
    description: Alternative email of user.
  ts_last_self_validation_alternative_email:
    description: Timestamp of when the user carried out the most recent self validation for their alternative email.
  telefone_principal:
    lineage:
    - datalake_ebdb_user.user.main_phone
    description: Main contact phone of user.
  ts_last_self_validation_main_phone_number:
    description: Timestamp of when the user carried out the most recent self validation for their phone number.
  endereco:
    lineage:
    - datalake_ebdb_user.user.address
    description: Street name of user's address.
  numero:
    lineage:
    - datalake_ebdb_user.user.number
    description: Street number of user's address.
  complemento:
    lineage:
    - datalake_ebdb_user.user.complement
    description: Complement of user's address.
  bairro:
    lineage:
    - datalake_ebdb_user.user.neighborhood
    description: Neighborhood of user's address.
  cep:
    lineage:
    - datalake_ebdb_user.user.zip_code
    description: Zip code of user's address.
  cidade:
    lineage:
    - datalake_ebdb_user.user.city
    description: City of user's address captured in the source operational system.
  estado_nome:
    lineage:
    - core_region.region.state_name
    description: Full state name of user's address.
  estado_abreviacao:
    lineage:
    - core_region.region.state_abbreviation
    description: State acronym of user's address.
  tipo_admin:
    lineage:
    - datalake_ebdb_user.user.admin_type
    description: Admin type of user, defining permissions.
    categories:
      Admin: The user has administrator permission.
      AtendimentoParceiros: The user has partner services permission.
      CRM_ONLY: The user has only CRM permission.
      Contratos: The user has contracts permission.
      Financeiro: The user has financial permission.
      Growth: The user has financial permission.
      Integracao: The user has integration permission.
      Normal: The user has normal permission.
      Sudo: The user has sudo permissions.
      VISTORIA_OPS: The user has financial permission.
  dadosbancarios_banco_codigo:
    lineage:
    - datalake_ebdb_clean.bank.code
    description: Bank code of user's bank account.
  dadosbancarios_banco:
    lineage:
    - datalake_ebdb_clean.bank.name
    description: Bank name of user's bank account.
  dadosbancarios_agencia:
    lineage:
    - datalake_ebdb_user.user.bank_agency
    description: Bank branch code of user's bank account.
  dadosbancarios_conta_corrente:
    lineage:
    - datalake_ebdb_user.user.bank_account
    description: Bank account number of user's bank account.
  dadosbancarios_cpf_cnpj:
    lineage:
    - datalake_ebdb_user.user.bank_cpf_cnpj
    description: CPF (Tax Identification Number) or CNPJ (Brazilian National Registry of Legal Entities) of user/entity in user's bank account.
  dadosbancarios_nome:
    lineage:
    - datalake_ebdb_user.user.bank_name
    description: Full name of user in users's bank account.
  dadosbancarios_tipo_conta:
    lineage:
    - datalake_ebdb_user.user.bank_account_type
    description: Type of user's bank account.
    categories:
      ContaCorrenteConjunta: Joint banking account.
      ContaCorrenteIndividual: Individual banking account.
      Poupanca: Saving account.
  dadosagente_perfil:
    lineage:
    - datalake_ebdb_user.agent_data.profile
    description: User's profile shift (deslocamento), if user is an agent.
    categories:
      BUS_LONG_DISTANCE: The agent goes to the place by bus, but it's not near.
      CARRO: The agent goes to the place by car.
      CAR_LONG_DISTANCE: The agent goes to the place by car, but it's not near.
      CAR_TEMP_COVID: The agent goes to the place by car, used in Covid times.
      CAR_USING_HIGHWAYS: The agent goes to the place crossing highways by car.
      ONIBUS: The agent goes to the place by bus.
  dadosagente_numero_creci:
    lineage:
    - datalake_ebdb_user.agent_data.creci_number
    description: Creci number (Regional Council for Real Estate Brokers) of user, if user is an agent.
  dadosfotografo_tipo_contrato:
    lineage:
    - datalake_ebdb_clean.photographer_data.contract_type
    description: "Type of contract with photographer, if user is photographer."
    categories:
      CLT: The contract is CLT (Consolidation of Labor Laws)
      Freelancer: The photographer is a freelancer, which is autonomous.
  dadosafiliado_cidade_atuacao:
    lineage:
    - datalake_ebdb_user.affiliate_data.work_city
    description: City name of affiliate activity, if user is an affiliate.
  dadosafiliado_preferencia_pagamento:
    lineage:
    - datalake_ebdb_user.affiliate_data.payment_preference
    description: Payment preference for affiliate, if user is an affiliate.
    categories:
      CartaoPrePago: The payment preference is prepaid card.
      NaoTem: User doesn't have payment preference.
  dadosafiliado_numero_creci:
    lineage:
    - datalake_ebdb_user.affiliate_data.creci_number
    description: Creci number (Regional Council for Real Estate Brokers) of affiliate, if user is an affiliate.
  dadosafiliado_semana_ultima_comunicacao_balanco:
    lineage:
    - datalake_ebdb_user.affiliate_data.last_week_balance_communication
    description: Integer value of the last week balance communication.
  visits_booked:
    lineage:
    - datalake_booking.booking.id_visitor
    description: Count of tenant visits scheduled during the reporting period.
  visits_realized:
    lineage:
    - datalake_booking.booking.is_visit_completed
    description: Amount of visits that happened.
  visits_expected_to_happen:
    lineage:
    - datalake_booking.booking.visit_fup
    description: Amount of visits that were booked and were supposed to happen.
  houses_owned:
    lineage:
    - datalake_pro_owners.owner_houses_quantity_history.houses
    description: Total amount of houses owned by user.
  brokerage_only_houses_owned:
    lineage:
    - datalake_pro_owners.daily_owner_houses_quantity_history.brokerage_only_houses
    description: Amount of houses owned by user and it's managed by the owner (Brokerage Only program).
  quintoandar_houses_owned:
    lineage:
    - datalake_pro_owners.daily_owner_houses_quantity_history.quintoandar_houses
    description: Amount of houses owned by user and it's managed by QuintoAndar.
  data_nascimento:
    lineage:
    - datalake_ebdb_user.user.dt_birth
    description: Birth date of user captured in the source operational system.
  first_visit_date:
    lineage:
    - datalake_ebdb_clean.visit.dt_visit
    description: Timestamp of when the user had the first visit.
  first_visit_confirmed_date:
    lineage:
    - datalake_booking.booking.status
    - datalake_ebdb_clean.visit.dt_visit
    description: Timestamp of when the user had the first visit confirmed.
  data_clickanuncie:
    lineage:
    - datalake_ebdb_user.user.ts_click_anuncie
    description: Timestamp of when the click anuncie happened.
  dadosfotografo_inicio_contrato:
    lineage:
    - datalake_ebdb_clean.photographer_data.ts_contract_started
    description: Start date of contract with photographer, if user is photographer.
  dadosvendedor_inicio_contrato:
    lineage:
    - datalake_ebdb_clean.sales_rep.ts_contract_started
    description: Start date of contract with Inside Sales Analyst, if user is Inside. Sales Analyst
  dadosafiliado_inicio_atuacao:
    lineage:
    - datalake_ebdb_user.affiliate_data.ts_first_operation_start
    description: Start date of activity as affiliate, if user is an affiliate.
  first_booking_date:
    lineage:
    - datalake_booking.booking.ts_created
    description: Date when the user first created a booking to visit a listing.
  first_booking_confirmed_date:
    lineage:
    - datalake_booking.booking.status
    - datalake_booking.booking.ts_created
    description: Date when the user had a first booking confirmed to visit a listing.
  first_pre_proposal_date:
    lineage:
    - datalake_ebdb_clean.pre_proposal.ts_created
    description: Date when the user submitted their first pre-proposal (interest form for a listing), marking the start of the rental funnel.
  first_proposal_accepted_date:
    lineage:
    - datalake_ebdb_clean.proposal.ts_created
    description: Date when the user had their first rental proposal accepted by the landlord, indicating qualification for a contract.
  first_contract_date:
    lineage:
    - datalake_ebdb_clean.contract.ts_created
    description: Date when the user signed his first contract.
  first_signed_contract:
    lineage:
    - datalake_ebdb_clean.contract.ts_signed
    description: Timestamp of when user's contract signed for the first time.
  first_dt_document_sent:
    lineage:
    - datalake_ebdb_user.user.ts_first_document_sent
    description: Timestamp of when user sent the documentation for the first time.
  last_dt_document_sent:
    lineage:
    - datalake_ebdb_user.user.ts_last_document_sent
    description: Timestamp of when user sent the documentation for the last time.
  first_dt_sent_to_insurance:
    lineage:
    - datalake_ebdb_user.user.ts_first_sent_to_insurance
    description: Timestamp of when user's documentation was in analysis for the first time.
  criado_em:
    lineage:
    - datalake_ebdb_user.user.ts_created
    description: Timestamp of when user was created.
  atualizado_em:
    lineage:
    - datalake_ebdb_user.user.ts_updated
    description: Timestamp of when user was updated.
  network:
    description: It was used when the table was in ODS, but now it contains just null value.
  load_timestamp:
    description: Timestamp of when the data was loaded.
