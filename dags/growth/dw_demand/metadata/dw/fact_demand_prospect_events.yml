---
database_name: dw_growth
table_name: fact_demand_prospect_events
owner: henrique.paulo@quintoandar.com.br
domain: Growth
description: Fact table recording demand-side prospect conversion events across Rent and Sale business contexts, where each row represents a single qualifying action — booking a
  visit, submitting an offer, or initiating a Talk to Agent interaction — performed by a prospect user. Enriches raw events with media setup attribution (including ad hoc
  overrides, exception flows, and naming convention logic) for marketing ROI and funnel analysis by the Growth and Demand teams.
columns:
  sk_prospect_event:
    description: Surrogate key uniquely identifying each prospect conversion event record in this fact table.
    lineage:
      - datalake_demand_flows.prospect_daily_results.id_prospect_event
  sk_prospect:
    description: Surrogate key identifying the prospect (demand-side user) who performed the conversion action.
    lineage:
      - datalake_demand_flows.prospect_daily_results.id_prospect
  sk_rent_flow:
    description: Surrogate key for the rent-context flow between a prospect user and a property listing.
    lineage:
      - datalake_demand_flows.prospect_daily_results.id_rent_flow
  sk_sale_flow:
    description: Surrogate key for the sale-context flow between a prospect user and a property listing.
    lineage:
      - datalake_demand_flows.prospect_daily_results.id_sale_flow
  sk_flow:
    description: Unified surrogate key for the prospect-property flow, resolved from either rent or sale context depending on the business context of the event.
    lineage:
      - datalake_demand_flows.prospect_daily_results.id_rent_flow
      - datalake_demand_flows.prospect_daily_results.id_sale_flow
  sk_booking:
    description: Surrogate key of the visit booking associated with the conversion event; populated only for booking-type events.
    lineage:
      - datalake_demand_flows.prospect_daily_results.id_booking
  sk_visit:
    description: Surrogate key of the executed visit linked to this event; populated after a booking is confirmed and the visit takes place.
    lineage:
      - datalake_demand_flows.prospect_daily_results.id_visit
  sk_offer:
    description: Surrogate key of the offer submitted by the prospect to the property owner; populated only for offer-type events.
    lineage:
      - datalake_demand_flows.prospect_daily_results.id_offer
  sk_talk_to_agent:
    description: Synthetic surrogate key identifying a Talk To Agent (TTA) interaction event between the prospect and a QuintoAndar agent.
    lineage:
      - datalake_demand_flows.prospect_daily_results.id_talk_to_agent
  sk_house:
    description: Surrogate key of the property for which the prospect conversion event was registered.
    lineage:
      - datalake_demand_flows.prospect_daily_results.id_house
  sk_region:
    description: Surrogate key for the geographic region of the property involved in the conversion event.
    lineage:
      - datalake_demand_flows.prospect_daily_results.id_region
  sk_owner:
    description: Surrogate key identifying the property owner associated with this conversion event.
    lineage:
      - datalake_demand_flows.prospect_daily_results.id_owner
  sk_agent:
    description: Surrogate key identifying the real estate agent who facilitated or recorded the booking event.
    lineage:
      - datalake_demand_flows.prospect_daily_results.id_agent
  naming_convention_sufix:
    description: The final media setup naming convention suffix for the conversion event, determined by a prioritization logic among the different sources (adhoc rule, exception flow, dictionary, naming convention).
    lineage:
      - datalake_demand_flows.prospect_daily_results.naming_convention_sufix
  sk_event_date:
    description: Date dimension surrogate key for the calendar day of the conversion event, used to join with dim_date.
    lineage:
      - datalake_demand_flows.prospect_daily_results.ts_event
  business_context:
    description: Business vertical in which the conversion event occurred, distinguishing rent from sale prospect activities.
    categories:
      rent: Rent-side prospect conversion event.
      sale: Sale-side prospect conversion event.
    lineage:
      - datalake_demand_flows.prospect_daily_results.business_context
  event_type:
    description: Classification of the conversion event type that triggered this prospect record.
    categories:
      FLOW: Non-conversion flow event in the prospect journey.
      CONVERSION: Qualifying conversion action such as booking, offer, or Talk to Agent.
    lineage:
      - datalake_demand_flows.prospect_daily_results.id_event_type
  event_name:
    description: Name of the demand prospect conversion event
    lineage:
      - datalake_demand_flows.prospect_daily_results.event_name
      - datalake_demand_flows.buyer_prospect_status.prospect_event_name
      - datalake_demand_flows.tenant_prospect_status.prospect_event_name
  event_detail:
    description: Name of the event that trigged the change to that current row status.
    lineage:
      - datalake_demand_flows.buyer_prospect_status.status_trigger_event_name
      - datalake_demand_flows.tenant_prospect_status.status_trigger_event_name
  product_origin:
    description: System where the booking was registered
    lineage:
      - datalake_demand_flows.prospect_daily_results.product_origin
  app_type:
    description: Application from which the user made the conversion event.
    lineage:
      - datalake_demand_flows.prospect_daily_results.app_type
  utm_medium:
    description: Marketing parameter that characterizes the campaign responsible for user conversion.
    lineage:
      - datalake_demand_flows.prospect_daily_results.utm_medium
  utm_source:
    description: Marketing parameter that characterizes the campaign responsible for user conversion.
    lineage:
      - datalake_demand_flows.prospect_daily_results.utm_source
  utm_campaign:
    description: Marketing parameter that characterizes the campaign responsible for user conversion.
    lineage:
      - datalake_demand_flows.prospect_daily_results.utm_campaign
  utm_term:
    description: Marketing parameter that characterizes the campaign responsible for user conversion.
    lineage:
      - datalake_demand_flows.prospect_daily_results.utm_term
  utm_content:
    description: Marketing parameter that characterizes the campaign responsible for user conversion.
    lineage:
      - datalake_demand_flows.prospect_daily_results.utm_content
  is_cqa_demand:
    description: Flag indicating if the demand is from CQA (Casa QuintoAndar) business model.
    lineage:
      - datalake_demand_flows.prospect_daily_results.is_cqa_demand
  sale_type:
    description: Market type for sale-context prospect events. Visit flows use listing-side classification; offer flows use offer-side classification. NULL for rent.
    lineage:
      - datalake_demand_flows.prospect_daily_results.sale_type
    categories:
      PRIMARY: New-build / primary market.
      SECONDARY: Resale / secondary market.
  operation_channel:
    description: Physical agent, internal or external, who performed the conversion in the funnel stage under analysis
    lineage:
      - datalake_demand_flows.prospect_daily_results.booking_creator
      - datalake_demand_flows.prospect_daily_results.id_booking
    categories:
      SelfService: Conversions completed by the prospect without operational assistance.
      Agent: Conversions recorded by the Agents operation (third-party brokers).
      Secretaria: Conversions recorded by the Sales Secretariat.
      CX: Conversions recorded by the Customer Experience operation.
      Concierge: Conversions recorded by the Concierge operation.
      Rede: Conversions recorded through the Rede partner network.
      Other: Conversions recorded by other operational channels.
      Lost Tracking: Conversions with lost marketing attribution tracking.
  referral_type:
    description: Grouping of results by type of user prospecting program or initiative (e.g. Agents, Rede, TQC, TQA).
    lineage:
      - datalake_demand_flows.prospect_daily_results.booking_creator
      - datalake_demand_flows.prospect_daily_results.is_3p_demand
      - datalake_demand_flows.prospect_daily_results.business_context
    categories:
      Agents: Third-party brokers who make visits and can prospect tenants.
      Rede: Real estate partners that prospect tenants encouraged by Fifth Floor.
      TQC: Traz Quem Compra (sale) prospecting program.
      TQC 1P: Traz Quem Compra first-party prospecting in sale.
      TQC 3P: Traz Quem Compra third-party prospecting in sale.
      TQA 1P: Traz Quem Aluga first-party prospecting in rent (same detection as TQC 1P, remapped by business_context).
      TQA 3P: Traz Quem Aluga third-party prospecting in rent (same detection as TQC 3P, remapped by business_context).
      NA: Characterization not applicable to the event or context.
  origin:
    description: QuintoAndar application where the conversion was carried out in the funnel stage under analysis.
    lineage:
      - datalake_demand_flows.prospect_daily_results.product_origin
  platform:
    description: Platform of the prospect device where the evaluated event took place.
    lineage:
      - datalake_demand_flows.prospect_daily_results.app_type
  content_page:
    description: Classification of content pages depending on the strategy adopted.
  flow_order:
    description: User flow order with the house, depending on the event type and business context.
    lineage:
      - datalake_demand_flows.prospect_daily_results.id_rent_flow
      - datalake_demand_flows.prospect_daily_results.id_sale_flow
      - datalake_demand_flows.prospect_daily_results.id_event_type
      - datalake_demand_flows.prospect_daily_results.business_context
  ts_event:
    description: Timestamp of the conversion event
    lineage:
      - datalake_demand_flows.prospect_daily_results.ts_event
  year:
    description: Year of the conversion event
    lineage:
      - datalake_demand_flows.prospect_daily_results.year
  month:
    description: Month of the conversion event
    lineage:
      - datalake_demand_flows.prospect_daily_results.month
  day:
    description: Day of the conversion event
    lineage:
      - datalake_demand_flows.prospect_daily_results.day
  ts_load:
    description: Timestamp of when the table was loaded
