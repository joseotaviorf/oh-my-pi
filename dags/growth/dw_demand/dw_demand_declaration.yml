dag:
  name: dw_demand
  schedule_start_date: 2021,8,2
  owner: Data Growth
  documentation: 
    dag_purpose: |
      This DAG dw tables related to the process of demand conversion in Growth context.
workflow:
  type: query
  layer: dw
  custom_schema: growth
  default_extraction_type: incremental 
  tables_customization:
    fact_demand_prospect_events:
      partitions: ["year", "month", "day"]
      extra_query_template_params:
        year: "{year}"
        month: "{month}"
        day: "{day}"
    fact_demand_top_of_funnel_events:
      partitions: ["year", "month", "day"]
      extra_query_template_params:
        year: "{year}"
        month: "{month}"
        day: "{day}"
cluster:
  type: databricks_10_4_med_general_cluster
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE
