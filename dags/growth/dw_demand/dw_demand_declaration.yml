dag:
  name: dw_demand
  schedule_start_date: 2021,8,2
  owner: Data Growth
  criticality: Critical
  documentation:
    dag_purpose: |
      This DAG dw tables related to the process of demand conversion in Growth context.
workflow:
  type: query_delta
  layer: dw
  custom_schema: growth
  default_extraction_type: incremental
  default_partitions: ["year", "month", "day"]
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, -14), 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
