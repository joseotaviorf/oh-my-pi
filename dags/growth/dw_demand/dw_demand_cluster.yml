cluster:
  type: consolidation_s_general_cluster
  databricks_conn_id: databricks_new_env
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
    aws_attributes:
      ebs_volume_size: 200
    runtime_engine: PHOTON
    num_workers: 3
    node_type_id: m7gd.xlarge
    driver_node_type_id: r7g.large
validation:
  cluster:
    type: emr_7_12_consolidation_s_general_cluster
    custom_configurations:
      core_nodes:
        instance_count: 2
      task_nodes:
        instance_count: 1
      master_node_type_id: r6g.xlarge
      aws_attributes:
        ebs_volume_size: 200
