cluster:
  type: emr_7_12_consolidation_m_general_fleet_cluster
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
    core_nodes:
      target_on_demand: 2
      target_spot: 0
      instance_types:
      - m6g.2xlarge
      - m7g.2xlarge
    task_nodes:
      instance_types:
      - m6g.2xlarge
      - m7g.2xlarge
      target_on_demand: 0
      target_spot: 1
      allocation_strategy: price-capacity-optimized
      bid_price_percentage: 100
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE
