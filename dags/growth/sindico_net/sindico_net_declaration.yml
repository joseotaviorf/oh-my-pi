dag:
  name: sindico_net
  owner: Data Growth
  schedule_start_date: 2019, 1, 1
  schedule_interval: "0 21 * * *"
  documentation:
    dag_purpose: |
      The purpose of the pipeline is to automate the process of collecting and organizing data from the SindicoNet API, making it easier to analyze and use in other applications, and to ensure the accuracy and consistency of the data over time. This pipeline is a part of Vespucio Project.
workflow:
  type: custom_ingestion
  layer: raw
  load_spark_job: load_condominium_raw
  default_extraction_type: full
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_date') }}"
  spark_job_arguments:
  - "{environment}"   # env
  - "{bucket}"   # datalake_bucket
  - "{dag_name}"   # source
  - "{load_start_date}"   # execution_date
  tables_customization:
    condominium:
      extra_spark_job_arguments:
      - condominium   # table_name
cluster:
  type: databricks_13_3_min_io-general_cluster
  custom_libraries:
  - whl: "{artifacts_bucket}/criteo-api-client-python/quintoandar_criteo_api_client-0.1.0-py2.py3-none-any.whl"
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
