database_name: datalake_bob_clean
table_name: attribution_progress_aud
owner: gabriel.salla@quintoandar.com
domain: Growth
description: Hibernate Envers audit history for Bob attribution_progress changes. Tracks revisions to confirmation attempt counts and attribution status per draft. Partitioned by year/month/day.
columns:
  id_house_draft:
    lineage:
      - datalake_bob_raw.attribution_progress_aud.house_draft_id
    description: Bob house draft identifier for this attribution audit row.
  rev:
    lineage:
      - datalake_bob_raw.attribution_progress_aud.rev
    description: Hibernate Envers revision identifier. Foreign key to datalake_bob_clean.rev_info.rev; join on rev to retrieve when the change occurred.
  rev_type:
    lineage:
      - datalake_bob_raw.attribution_progress_aud.revtype
    description: Hibernate Envers operation type for this audit row.
    categories:
      '0': INSERT — attribution record created in this revision.
      '1': UPDATE — attribution record modified in this revision.
      '2': DELETE — attribution record deleted (supported by Envers; not observed in production).
  confirmation_attempts:
    lineage:
      - datalake_bob_raw.attribution_progress_aud.confirmation_attempts
    description: Confirmation attempt count value captured in this revision.
  status:
    lineage:
      - datalake_bob_raw.attribution_progress_aud.status
    description: Attribution status value captured in this revision.
    categories:
      ATTRIBUTED: Lead attribution confirmed by the owner.
      WAITING_CONFIRMATION: Awaiting owner confirmation of attribution.
      INITIAL: Attribution flow started but not yet confirmed.
  mod_id_house_draft:
    lineage:
      - datalake_bob_raw.attribution_progress_aud.house_draft_mod
    description: Audit flag indicating whether house draft identifier changed in this revision (Hibernate Envers _mod column).
  mod_confirmation_attempts:
    lineage:
      - datalake_bob_raw.attribution_progress_aud.confirmation_attempts_mod
    description: Audit flag indicating whether confirmation attempt count changed in this revision (Hibernate Envers _mod column).
  mod_status:
    lineage:
      - datalake_bob_raw.attribution_progress_aud.status_mod
    description: Audit flag indicating whether attribution status changed in this revision (Hibernate Envers _mod column).
  ts_created:
    lineage:
      - datalake_bob_raw.attribution_progress_aud.created_at
    description: Attribution record creation timestamp in this revision.
  ts_updated:
    lineage:
      - datalake_bob_raw.attribution_progress_aud.updated_at
    description: Attribution record update timestamp in this revision.
  year:
    lineage:
      - datalake_bob_raw.attribution_progress_aud.year
    description: Hive partition year derived from the revision timestamp.
  month:
    lineage:
      - datalake_bob_raw.attribution_progress_aud.month
    description: Hive partition month derived from the revision timestamp.
  day:
    lineage:
      - datalake_bob_raw.attribution_progress_aud.day
    description: Hive partition day derived from the revision timestamp.
