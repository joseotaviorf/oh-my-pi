database_name: datalake_bob_clean
table_name: registrar_aud
owner: gabriel.salla@quintoandar.com
domain: Growth
description: Hibernate Envers audit history for Bob registrar records. Tracks changes to the EBDB user mapping (id_main) and associated house drafts.
columns:
  id_registrar:
    lineage:
      - datalake_bob_raw.registrar_aud.id
    description: Bob registrar record identifier for this audit row.
  id_main:
    lineage:
      - datalake_bob_raw.registrar_aud.main_id
    description: EBDB user ID value captured in this revision.
  rev:
    lineage:
      - datalake_bob_raw.registrar_aud.rev
    description: Hibernate Envers revision identifier. Foreign key to datalake_bob_clean.rev_info.rev; join on rev to retrieve when the change occurred.
  rev_type:
    lineage:
      - datalake_bob_raw.registrar_aud.revtype
    description: Hibernate Envers operation type for this audit row. Only INSERT (0) observed in production.
    categories:
      '0': INSERT — registrar record created in this revision.
      '1': UPDATE — registrar record modified in this revision.
      '2': DELETE — registrar record deleted (supported by Envers; not observed in production).
  mod_id_main:
    lineage:
      - datalake_bob_raw.registrar_aud.main_id_mod
    description: Audit flag indicating whether EBDB user mapping changed in this revision (Hibernate Envers _mod column).
  mod_house_drafts:
    lineage:
      - datalake_bob_raw.registrar_aud.house_drafts_mod
    description: Audit flag indicating whether associated house drafts changed in this revision (Hibernate Envers _mod column).
