dag:
  name: bob
  schedule_start_date: 2020, 7, 27
  schedule_interval: 0 3 * * *
  owner: Data Growth
  documentation:
    dag_purpose: |
      This DAG brings [Bob (bob-o-construtor)](https://github.com/quintoandar/bob-o-construtor) data,
      a service developed by B2B for house registry and now it has been used by AA (Autonomous Agents).

workflow:
  type: cdc
  layer: raw
  database_type: postgres
  source_schema: public
  custom_schema: bob
  source_database: bob-o-construtor
  dbutils_secret_key: BOB_DB
  lineage_product_database_name: boboconstrutor
  tables_customization:
    attribution_progress_aud: {}
    attribution_progress: {}
    house_draft: {}
    house_draft_aud: {}
    location: {}
    location_aud: {}
    registrar: {}
    registrar_aud: {}
    revinfo:
      clean_table_name: rev_info
    submission_progress: {}
    submission_progress_aud: {}
cluster:
  type: databricks_12_2_med_general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
