dag:
  name: idactum_registrations
  owner: Data Growth
  schedule_start_date: 2026, 02, 03
  documentation:
    dag_purpose: This DAG imports "Cadastral" information from Idactum.
workflow:
  layer: raw
  type: custom_ingestion
  spark_job_prefix: base
  load_spark_job: load_idactum_raw
  default_extraction_type: full
  spark_job_arguments:
    - "{environment}" # env
    - "{bucket}" # datalake_bucket
    - "{table_name}" # "table_name"
    - "{{ ds }}" # execution_date
    - "idactum_registrations" # source
    - "" # timestamp_ntz_fields
  tables_customization:
    idactum_registrations: {}

