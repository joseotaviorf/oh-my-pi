cluster:
  type: emr_7_12_consolidation_xl_memory_fleet_cluster
  custom_configurations:
    spark_conf:
      spark.sql.sources.partitionOverwriteMode: static
      spark.executor.cores: "5"
      spark.executor.memory: 32g
      spark.executor.memoryOverhead: 4g
      spark.driver.memory: 32g
      spark.driver.maxResultSize: "0"
      # Was 600 for post-Photon EMR compute on cross_channel_full (~29 min).
      # 600 × daily partitions produced ~1.1M ~12KB files and timed out
      # dw_offer.dim_offer. 200 matches other Growth EMR DAGs; keep
      # run_optimize: true on the heavy tables so layout stays compacted.
      spark.sql.shuffle.partitions: "200"
    core_nodes:
      target_on_demand: 2
      instance_types:
        - r6g.8xlarge
        - r7g.8xlarge
        - r6i.8xlarge
    task_nodes:
      target_on_demand: 3
      target_spot: 0
      instance_types:
        - r6g.8xlarge
        - r7g.8xlarge
        - r6i.8xlarge
