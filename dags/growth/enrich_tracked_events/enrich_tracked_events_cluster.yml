cluster:
  type: emr_7_12_consolidation_xl_memory_fleet_cluster
  custom_configurations:
    spark_conf:
      spark.sql.sources.partitionOverwriteMode: static
      spark.executor.cores: "5"
      spark.executor.memory: 32g
      spark.executor.memoryOverhead: 4g
      spark.sql.shuffle.partitions: "600"
    core_nodes:
      target_on_demand: 2
      instance_types:
        - r6g.8xlarge
        - r7g.8xlarge
        - r6i.8xlarge
    task_nodes:
      target_spot: 3
      instance_types:
        - r6g.8xlarge
        - r7g.8xlarge
        - r6i.8xlarge
