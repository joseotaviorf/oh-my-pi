---
database_name: datalake_tracked_events
table_name: secretaria_offline_touchpoints
owner: henrique.paulo@quintoandar.com.br
domain: Growth
description: Each row in this table is a contact made to Secretaria application
columns:
  id_user:
    description: EBDB's id user of the contactant.
    lineage:
      - datalake_ebdb_user.user.id
      - datalake_casa_mineira_crm_clean.contact.id_client
  id_contact:
    description: Unique identifier of the contact.
    lineage:
      - datalake_casa_mineira_crm_clean.contact.id
      - datalake_hub_services_clean.lead.id
  event_name:
    description: Event name that will be used further in the attribution pipeline.
  origin:
    description: Media that made the user get in touch with the company.
    lineage:
      - datalake_hub_services_clean.lead.lead_type
      - datalake_casa_mineira_crm_clean.origin_contact.origin_contact_name
  agent:
    description: Operations team that assisted the user in contact.
  channel:
    description: Channel through which the user contacted the company.
    lineage:
      - datalake_gsheets_clean.users_cx_plaquinhas.canal
      - datalake_casa_mineira_crm_clean.media_contact.media_contact_name
  year:
    description: Year of the contact.
    lineage:
      - datalake_hub_services_clean.lead.ts_created
      - datalake_casa_mineira_crm_clean.contact.ts_created
  month:
    description: Month of the contact.
    lineage:
      - datalake_hub_services_clean.lead.ts_created
      - datalake_casa_mineira_crm_clean.contact.ts_created
  day:
    description: Day of the contact.
    lineage:
      - datalake_hub_services_clean.lead.ts_created
      - datalake_casa_mineira_crm_clean.contact.ts_created
  ts_event:
    description: Timestamp of the contact.
    lineage:
      - datalake_hub_services_clean.lead.ts_created
      - datalake_casa_mineira_crm_clean.contact.ts_created
