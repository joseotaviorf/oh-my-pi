---
database_name: datalake_wordpress_baroes
table_name: content_hub_data
owner: henrique.miamoto@quintoandar.com.br
domain: Growth
description: This table contains informations about QuintoAndar's Content Hub. Each line represents a wordpress post with its most recent features.
columns:
  id_post_wordpress:
    description: Post identifier
    lineage: 
      - datalake_wordpress_baroes_clean.meulugar_data.id_post_wordpress
      - datalake_wordpress_baroes_clean.conteudos_data.id_post_wordpress
  id_author:
    description: Post author identifier
    lineage: 
      - datalake_wordpress_baroes_clean.meulugar_data.id_author
      - datalake_wordpress_baroes_clean.conteudos_data.id_author
  table_source:
    description: Clean table source.
  author_name:
    description: Post author name
    lineage: 
      - datalake_wordpress_baroes_clean.meulugar_data.author_meta
      - datalake_wordpress_baroes_clean.conteudos_data.author_meta
  author_group:
    description: Post author group
      - datalake_wordpress_baroes_clean.meulugar_data.author_meta
      - datalake_wordpress_baroes_clean.conteudos_data.author_meta
  tags:
    description: Post tags
      - datalake_wordpress_baroes_clean.meulugar_data.author_meta
      - datalake_wordpress_baroes_clean.conteudos_data.author_meta
  categories:
    description: Post categories
      - datalake_wordpress_baroes_clean.meulugar_data.tax_additional
      - datalake_wordpress_baroes_clean.conteudos_data.tax_additional
  slug:
    description: Content slug, aka content title
    lineage:
      - datalake_wordpress_baroes_clean.meulugar_data.slug
      - datalake_wordpress_baroes_clean.conteudos_data.slug
  title:
    description: Post title
    lineage:
      - datalake_wordpress_baroes_clean.meulugar_data.title
      - datalake_wordpress_baroes_clean.conteudos_data.title
  acf_funnel:
    description: Target audience funnel stage
    lineage:
      - datalake_wordpress_baroes_clean.meulugar_data.acf_funnel
      - datalake_wordpress_baroes_clean.conteudos_data.acf_funnel
  acf_user_type:
    description: Target audience user type
    lineage:
      - datalake_wordpress_baroes_clean.meulugar_data.acf_user_type
      - datalake_wordpress_baroes_clean.conteudos_data.acf_user_type
  has_changes_after_90_days:
    description: Flag that indicates if there is any modification in the post after 90 days.
    lineage:
      - datalake_wordpress_baroes_clean.meulugar_data.dt_post_modified
      - datalake_wordpress_baroes_clean.conteudos_data.dt_post_modified
      - datalake_wordpress_baroes_clean.meulugar_data.dt_post_created
      - datalake_wordpress_baroes_clean.conteudos_data.dt_post_created
  day_diff_create_modified:
    description: Days between the date the post was created and when it was modified.
    lineage:
      - datalake_wordpress_baroes_clean.meulugar_data.dt_post_modified
      - datalake_wordpress_baroes_clean.conteudos_data.dt_post_modified
      - datalake_wordpress_baroes_clean.meulugar_data.dt_post_created
      - datalake_wordpress_baroes_clean.conteudos_data.dt_post_created
  dt_post_created:
    description: Date when the post was created (BRT)
    lineage:
      - datalake_wordpress_baroes_clean.meulugar_data.dt_post_created
      - datalake_wordpress_baroes_clean.conteudos_data.dt_post_created
  dt_post_modified:
    description: Date when the post was modified (BRT)
    lineage:
      - datalake_wordpress_baroes_clean.meulugar_data.dt_post_modified
      - datalake_wordpress_baroes_clean.conteudos_data.dt_post_modified
