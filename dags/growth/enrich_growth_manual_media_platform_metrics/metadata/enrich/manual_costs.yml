---
database_name: datalake_growth_media_platform
table_name: manual_costs
owner: henrique.paulo@quintoandar.com.br
domain: Growth
description: |
  Enriched daily manual marketing spend from Google Sheets and historical cost inputs, unified with
  optional cost-sharing rule allocations at campaign and region grain. Excludes Google, Facebook, and
  Criteo costs covered by automated platform pipelines; consumed by growth media platform and
  consolidated marketing metrics. Partitioned by year, month, and day (derived from dt_cost). Always
  filter on all three partition columns in WHERE clauses to enable partition pruning; align partition
  filters with the dt_cost date range being analyzed.
columns:
  bk_sharing_rules:
    description: Business key for sharing rules
    lineage:
      - datalake_growth_costs.historical_marketing_manual_costs_name_convention.dt_cost
      - datalake_growth_costs.historical_marketing_manual_costs_name_convention.id_rule
      - datalake_growth_costs.historical_marketing_manual_costs_name_convention.funnel_side
      - datalake_gsheets_clean.marketing_manual_costs_name_convention.dt_cost
      - datalake_gsheets_clean.marketing_manual_costs_name_convention.id_rule
      - datalake_gsheets_clean.marketing_manual_costs_name_convention.funnel_side
  id_rule:
    description: Identifier for cost sharing rules
    lineage:
      - datalake_growth_costs.historical_marketing_manual_costs_name_convention.id_rule
      - datalake_gsheets_clean.marketing_manual_costs_name_convention.id_rule
  id_region:
    description: Unique identifier for region
    lineage:
      - datalake_region.region.id
  naming_convention_sufix:
    description: Generated naming convention suffix based on campaign context
    lineage:
      - datalake_growth_costs.historical_marketing_manual_costs.campaign_business_context
      - datalake_growth_costs.historical_marketing_manual_costs.campaign_strategy_intent
      - datalake_growth_costs.historical_marketing_manual_costs.behavior_type
      - datalake_growth_costs.historical_marketing_manual_costs.landing_page
      - datalake_growth_costs.historical_marketing_manual_costs.funnel_side
      - datalake_growth_costs.historical_marketing_manual_costs.medium
      - datalake_growth_costs.historical_marketing_manual_costs.source
      - datalake_gsheets_clean.marketing_manual_costs.campaign_business_context
      - datalake_gsheets_clean.marketing_manual_costs.campaign_strategy_intent
      - datalake_gsheets_clean.marketing_manual_costs.behavior_type
      - datalake_gsheets_clean.marketing_manual_costs.landing_page
      - datalake_gsheets_clean.marketing_manual_costs.funnel_side
      - datalake_gsheets_clean.marketing_manual_costs.medium
      - datalake_gsheets_clean.marketing_manual_costs.source
  account_name:
    description: Accont name at braze platform
    lineage:
      - datalake_consolidated_marketing_metrics.consolidated_media_metrics.account_name
      - datalake_growth_manual_daily_costs_clean.marketing_manual_shared_costs.account_name
      - datalake_growth_manual_daily_costs_clean.marketing_name_convention_shared_costs.account_name
  utm_campaign:
    description: utm_campaign applied on growth marketing platform
    lineage:
      - datalake_consolidated_marketing_metrics.consolidated_media_metrics.utm_campaign
      - datalake_growth_manual_daily_costs_clean.marketing_manual_shared_costs.campaign_name
      - datalake_growth_manual_daily_costs_clean.marketing_name_convention_shared_costs.campaign_name
  utm_term:
    description: utm_term applied on growth marketing platfor
    lineage:
      - datalake_consolidated_marketing_metrics.consolidated_media_metrics.utm_term
      - datalake_growth_manual_daily_costs_clean.marketing_manual_shared_costs.utm_term
      - datalake_growth_manual_daily_costs_clean.marketing_name_convention_shared_costs.utm_term
  utm_content:
    description: utm_content applied on growth marketing platform
    lineage:
      - datalake_consolidated_marketing_metrics.consolidated_media_metrics.utm_content
      - datalake_growth_manual_daily_costs_clean.marketing_manual_shared_costs.utm_content
      - datalake_growth_manual_daily_costs_clean.marketing_name_convention_shared_costs.utm_content
  campaign_business_context:
    description: QuintoAndar product line or operating segment targeted by the marketing campaign, such as rentals or for-sale listings
    lineage:
      - datalake_growth_costs.historical_marketing_manual_costs.campaign_business_context
      - datalake_gsheets_clean.marketing_manual_costs.campaign_business_context
  campaign_strategy_intent:
    description: Intention of the actions/campaigns adopted in relation to the growth strategy.
    lineage:
      - datalake_growth_costs.historical_marketing_manual_costs.campaign_strategy_intent
      - datalake_gsheets_clean.marketing_manual_costs.campaign_strategy_intent
  campaign_landing_page:
    description: Landing page/domain of QuintoAndar to which the campaign directs
    lineage:
      - datalake_growth_costs.historical_marketing_manual_costs.landing_page
      - datalake_gsheets_clean.marketing_manual_costs.landing_page
  behavior_type:
    description: Type of user behavior in relation to their search decision and entry into the QuintoAndar environment
    lineage:
      - datalake_growth_costs.historical_marketing_manual_costs.behavior_type
      - datalake_gsheets_clean.marketing_manual_costs.behavior_type
  medium:
    description: Combination of platform intent, media package, branded and recovery audience status dimensions. Where the average package size is mandatory and the others are applied when convenient. More information in the Doc indicated in the table description
    lineage:
      - datalake_growth_costs.historical_marketing_manual_costs.medium
      - datalake_gsheets_clean.marketing_manual_costs.medium
  source:
    description: QuintoAndar s external platform/operation responsible for generating the result
    lineage:
      - datalake_growth_costs.historical_marketing_manual_costs.source
      - datalake_gsheets_clean.marketing_manual_costs.source
  funnel_side:
    description: Side of the funnel to which that campaign was directed
    lineage:
      - datalake_growth_costs.historical_marketing_manual_costs.funnel_side
      - datalake_gsheets_clean.marketing_manual_costs.funnel_side
      - datalake_growth_costs.historical_marketing_manual_costs_name_convention.funnel_side
      - datalake_gsheets_clean.marketing_manual_costs_name_convention.funnel_side
  total_cost:
    description: Total cost of the marketing campaign
    lineage:
      - datalake_growth_costs.historical_marketing_manual_costs.cost
      - datalake_gsheets_clean.marketing_manual_costs.cost
      - datalake_growth_costs.historical_marketing_manual_costs_name_convention.cost
      - datalake_gsheets_clean.marketing_manual_costs_name_convention.cost
  impressions:
    description: Number of impressions generated by the campaign
    lineage:
      - datalake_growth_costs.historical_marketing_manual_costs.impressions
      - datalake_gsheets_clean.marketing_manual_costs.impressions
      - datalake_growth_costs.historical_marketing_manual_costs_name_convention.impressions
      - datalake_gsheets_clean.marketing_manual_costs_name_convention.impressions
  clicks:
    description: Number of clicks generated by the campaign
    lineage:
      - datalake_growth_costs.historical_marketing_manual_costs.clicks
      - datalake_gsheets_clean.marketing_manual_costs.clicks
      - datalake_growth_costs.historical_marketing_manual_costs_name_convention.clicks
      - datalake_gsheets_clean.marketing_manual_costs_name_convention.clicks
  dt_cost:
    description: Calendar date of the manual marketing spend record; source for year, month, and day partition columns.
    lineage:
      - datalake_growth_costs.historical_marketing_manual_costs.dt_cost
      - datalake_gsheets_clean.marketing_manual_costs.dt_cost
      - datalake_growth_costs.historical_marketing_manual_costs_name_convention.dt_cost
      - datalake_gsheets_clean.marketing_manual_costs_name_convention.dt_cost
  year:
    description: Table partition column (year). Derived from dt_cost at enrich load. Required in WHERE clauses for partition pruning — always combine with month and day to restrict scans to the smallest date window needed.
    lineage:
      - datalake_growth_costs.historical_marketing_manual_costs.dt_cost
      - datalake_gsheets_clean.marketing_manual_costs.dt_cost
      - datalake_growth_costs.historical_marketing_manual_costs_name_convention.dt_cost
      - datalake_gsheets_clean.marketing_manual_costs_name_convention.dt_cost
  month:
    description: Table partition column (month, 1–12). Derived from dt_cost at enrich load. Must be filtered together with year and day in every query to enable partition pruning; omitting any partition column disables pruning.
    lineage:
      - datalake_growth_costs.historical_marketing_manual_costs.dt_cost
      - datalake_gsheets_clean.marketing_manual_costs.dt_cost
      - datalake_growth_costs.historical_marketing_manual_costs_name_convention.dt_cost
      - datalake_gsheets_clean.marketing_manual_costs_name_convention.dt_cost
  day:
    description: Table partition column (day, 1–31). Derived from dt_cost at enrich load. Always filter with year and month to narrow the scan to specific days; e.g. WHERE year = 2025 AND month = 1 AND day BETWEEN 1 AND 7.
    lineage:
      - datalake_growth_costs.historical_marketing_manual_costs.dt_cost
      - datalake_gsheets_clean.marketing_manual_costs.dt_cost
      - datalake_growth_costs.historical_marketing_manual_costs_name_convention.dt_cost
      - datalake_gsheets_clean.marketing_manual_costs_name_convention.dt_cost  
