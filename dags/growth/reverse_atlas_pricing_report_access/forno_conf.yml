---
sns_topic_arn: arn:aws:sns:us-east-1:569412621543:forno-reports-business-events
database_name: reverse_atlas_pricing_report
tables:
  pricing_report_engagement:
    event_type: PRICING_REPORT_ENGAGEMENT
  pricing_report_listing_price_history:
    event_type: PRICING_REPORT_LISTING_PRICE_HISTORY
    
custom_cluster:
  driver_node_type_id: r5n.2xlarge
  node_type_id: c5n.2xlarge
  num_workers: 6
  spark_version: 12.2.x-scala2.12
  spark_conf:
    spark.driver.memory: "30g"
  aws_attributes:
      ebs_volume_size: 200
      instance_profile_arn: "{{ var.value.instance_profile_secret_arn_reverse_listings_report }}"
