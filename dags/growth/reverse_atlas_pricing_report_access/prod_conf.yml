---
dag_documentation:
  dag_purpose: |
    This DAG retrieves data stored in the `datalake_atlas_pricing_report` schema,
    which was previously processed by the DAG `enrich_atlas_pricing_report`, and transmits
    it through SNS. This dataset serves as the foundation for generating pricing reports
    to QuintoAndar Seekers.

database_name: datalake_atlas_pricing_report
tables:
  new_pricing_report_engagement:
    event_type: NEW_PRICING_REPORT_ENGAGEMENT
    sns_topic_arn: arn:aws:sns:us-east-1:632540934959:prod-reports-business-events
    chunk_size: 150
  new_pricing_report_listing_price_history:
    event_type: NEW_PRICING_REPORT_LISTING_PRICE_HISTORY
    sns_topic_arn: arn:aws:sns:us-east-1:632540934959:prod-reports-listing-events
    chunk_size: 1000
  new_pricing_report_region:
    event_type: NEW_PRICING_REPORT_REGION
    sns_topic_arn: arn:aws:sns:us-east-1:632540934959:prod-reports-business-events
    chunk_size: 1000

custom_cluster:
  autotermination_minutes: 20
  driver_node_type_id: r5a.2xlarge
  node_type_id: c5a.2xlarge
  num_workers: 6
  spark_version: 12.2.x-scala2.12
  spark_conf:
    spark.driver.memory: "30g"
  aws_attributes:
    first_on_demand: 1
    spot_bid_price_percent: 100
    zone_id: us-east-1d
    availability: SPOT_WITH_FALLBACK
    ebs_volume_size: 200
    instance_profile_arn: "{{ var.value.instance_profile_secret_arn_reverse_listings_report }}"
