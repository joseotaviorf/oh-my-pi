dag:
  name: reverse_atlas_pricing_report_access
  schedule_start_date: 2022,7,12
  owner: Data Growth
  documentation:
    dag_purpose: |
      "This DAG is responsible for loading the reverse atlas pricing report access data"
workflow:
  type: access
  layer: reverse
  load_spark_job: load_into_sns
  custom_schema: datalake_atlas_pricing_report
  spark_job_arguments:
    - "{dag_name}" # dag_name
    - "datalake_atlas_pricing_report" # database_name
    - "{table_name}" # table_name
  tables_customization:
    new_pricing_report_engagement:
      extra_spark_job_arguments:
        - NEW_PRICING_REPORT_ENGAGEMENT # event_type
        - sns_topic_arn_business # sns_topic_arn
        - 150 # chunk_size
    new_pricing_report_listing_price_history:
      extra_spark_job_arguments:
        - NEW_PRICING_REPORT_LISTING_PRICE_HISTORY
        - sns_topic_arn_listing
        - 1000 # chunk_size
    new_pricing_report_region:
      extra_spark_job_arguments:
        - NEW_PRICING_REPORT_REGION
        - sns_topic_arn_business
        - 1000 # chunk_size
