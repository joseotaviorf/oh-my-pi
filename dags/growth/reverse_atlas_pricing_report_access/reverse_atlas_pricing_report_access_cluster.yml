cluster:
  type: consolidation_xs_memory_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    autotermination_minutes: 20
    driver_node_type_id: r7g.2xlarge
    num_workers: 6
    spark_version: 16.4.x-scala2.12
    aws_attributes:
      first_on_demand: 1
      spot_bid_price_percent: 100
      zone_id: us-east-1d
      availability: SPOT_WITH_FALLBACK
      ebs_volume_size: 200
      instance_profile_arn: '{{ var.value.instance_profile_secret_arn_reverse_listings_report }}'
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
validation:
  cluster:
    type: emr_7_12_consolidation_xs_memory_fleet_cluster
    custom_configurations:
      master_node_type_id: r6g.2xlarge
      task_nodes:
        instance_types:
        - r6g.xlarge
        - r7g.xlarge
        - r6i.xlarge
        target_on_demand: 0
        target_spot: 4
        allocation_strategy: price-capacity-optimized
        bid_price_percentage: 100
      core_nodes:
        target_on_demand: 2
        target_spot: 0
        instance_types:
        - r6g.xlarge
        - r7g.xlarge
        - r6i.xlarge
      aws_attributes:
        ebs_volume_size: 200
      spark_conf:
        spark.yarn.am.memory: 3g
        spark.driver.memory: 8g
  allow_custom_spark_job: true
