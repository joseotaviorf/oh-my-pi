---
dag:
  name: enrich_amplitude_lead
  schedule_start_date: 2019, 1, 1
  owner: Data Growth
  documentation:
    dag_purpose:
      Creates enriched tables for the context `Lead` based on Amplitude
      data.
workflow:
  type: query_delta
  layer: enrich
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: r5a.2xlarge
    node_type_id: c5a.xlarge
    spark_version: 16.4.x-scala2.12
    num_workers: 4
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
  databricks_conn_id: databricks_new_env
