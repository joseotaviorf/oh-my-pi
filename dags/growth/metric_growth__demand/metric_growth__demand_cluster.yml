cluster:
  type: consolidation_s_general_cluster
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE
  databricks_conn_id: databricks_new
  custom_configurations:
    num_workers: 3
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
validation:
  cluster:
    # DAG wall target ≤40 min: ~8 min bootstrap + ~30 min Spark. Weekly was ~2h on
    # 4 slots (j-0908371W50WVVMZ4E5U) → ~16 cores/job × 4 concurrent apps. 6×4xlarge
    # (96 vCPU) covers 4 YARN AMs; 2 core OD + 4 task spot (~67% worker capacity on
    # Spot, SWITCH_TO_ON_DEMAND if the fleet cannot provision in time).
    type: emr_7_12_consolidation_l_general_fleet_cluster
    custom_configurations:
      step_concurrency_level: 4
      core_nodes:
        target_on_demand: 2
        target_spot: 0
        instance_types:
        - m6g.4xlarge
        - m7g.4xlarge
      task_nodes:
        instance_types:
        - m6g.4xlarge
        - m7g.4xlarge
        target_on_demand: 0
        target_spot: 4
        allocation_strategy: price-capacity-optimized
        bid_price_percentage: 100
      spark_conf:
        spark.yarn.am.memory: 2g
        spark.yarn.am.cores: "1"
        spark.driver.memory: 6g
        spark.driver.memoryOverhead: 2g
        spark.executor.cores: "4"
        spark.executor.memory: 12g
        spark.executor.memoryOverhead: 2g
        spark.dynamicAllocation.minExecutors: "2"
        spark.dynamicAllocation.maxExecutors: "8"
