database_name: metric_growth
table_name: growth_demand_performance_daily
description: |
  Daily growth demand performance metrics following the Growth marketing taxonomy. One row per event
  date and marketing slice (region, channel, platform, UTM parameters, media setup dimensions, QAC/CQA
  flags). Combines top-of-funnel user/event counts from dw_growth.fact_demand_top_of_funnel_events,
  prospect activation and recovery from fact_demand_prospect_events, and campaign cost from
  datalake_growth_costs.daily_costs via FULL OUTER JOIN on shared dimensions. Used for performance
  marketing dashboards, CAC analysis, and demand funnel monitoring. Part of metric_growth__demand DAG.
  Partitioned by year, month, and day — always filter on all three partition columns in WHERE clauses
  to enable partition pruning; align filters with dt_event.
domain: Growth
owner: henrique.paulo@quintoandar.com.br
columns:
  dt_event:
    lineage:
      - dw_public.dim_date.date
    description: |
      Calendar date of the aggregated metrics (event date). Primary time dimension for daily demand
      performance analysis; aligns with dt_event from upstream DW fact tables.
    dimension: True
  country_code:
    lineage:
      - dw_public.dim_region.country_code
    description: Country code where the event occurred.
    dimension: True
  city_group:
    lineage:
      - dw_public.dim_region.city_group
    description: The city group classification for where the event took place.
    dimension: True
  operation_channel:
    lineage:
      - dw_growth.fact_demand_top_of_funnel_events.operation_channel
      - dw_growth.fact_demand_prospect_events.operation_channel
    description: The channel through which the operation was conducted.
    dimension: True
  referral_type:
    lineage:
      - dw_growth.fact_demand_prospect_events.referral_type
    description: Grouping of results by type of user prospecting program/initiative.
    dimension: True
  platform:
    lineage:
      - dw_growth.fact_demand_top_of_funnel_events.platform
      - dw_growth.fact_demand_prospect_events.platform
    description: Platform used for the event.
    dimension: True
  utm_campaign:
    lineage:
      - dw_growth.fact_demand_top_of_funnel_events.utm_campaign
      - dw_growth.fact_demand_prospect_events.utm_campaign
      - datalake_growth_costs.daily_costs.utm_campaign
    description: The specific campaign name derived from UTM parameters.
    dimension: True
  utm_term:
    lineage:
      - dw_growth.fact_demand_top_of_funnel_events.utm_term
      - dw_growth.fact_demand_prospect_events.utm_term
      - datalake_growth_costs.daily_costs.utm_term
    description: The UTM term associated with the event for tracking keywords or phrases.
    dimension: True
  utm_content:
    lineage:
      - dw_growth.fact_demand_top_of_funnel_events.utm_content
      - dw_growth.fact_demand_prospect_events.utm_content
      - datalake_growth_costs.daily_costs.utm_content
    description: The UTM content associated with the event for tracking keywords or phrases.
    dimension: True
  content_page:
    lineage:
      - dw_growth.fact_demand_top_of_funnel_events.content_page
      - dw_growth.fact_demand_prospect_events.content_page
    description: Indicates if the user visited a content page.
    dimension: True
  business_context:
    lineage:
      - dw_growth.fact_demand_top_of_funnel_events.business_context
      - dw_growth.fact_demand_prospect_events.business_context
      - datalake_growth_costs.daily_costs.business_context
    description: Lowercase description of the business context surrounding the event.
    dimension: True
  sale_type:
    lineage:
      - dw_growth.fact_demand_prospect_events.sale_type
    description: |
      Market type for sale-context prospect events (PRIMARY for new-build, SECONDARY for resale).
      NA for rent-context rows; NULL on top-of-funnel-only rows where sale market classification
      does not apply.
    dimension: True
  funnel_side:
    lineage:
      - dw_growth.fact_demand_top_of_funnel_events.funnel_side
      - dw_growth.dim_media_setup.funnel_side
      - datalake_growth_costs.daily_costs.funnel_side
    description: Identifies which side of the marketing funnel the event impacts.
    dimension: True
  campaign_business_context:
    lineage:
      - dw_growth.fact_demand_top_of_funnel_events.campaign_business_context
      - dw_growth.dim_media_setup.campaign_business_context
      - datalake_growth_costs.daily_costs.campaign_business_context
    description: Lowercase description of the campaign's business context.
    dimension: True
  behavior_type:
    lineage:
      - dw_growth.fact_demand_top_of_funnel_events.behavior_type
      - dw_growth.dim_media_setup.behavior_type
      - datalake_growth_costs.daily_costs.behavior_type
    description: Type of behavior exhibited or encouraged by the event.
    dimension: True
  campaign_strategy_intent:
    lineage:
      - dw_growth.fact_demand_top_of_funnel_events.campaign_strategy_intent
      - dw_growth.dim_media_setup.campaign_strategy_intent
      - datalake_growth_costs.daily_costs.campaign_strategy_intent
    description: The strategic intent of the campaign associated with the event.
    dimension: True
  medium:
    lineage:
      - dw_growth.fact_demand_top_of_funnel_events.medium
      - dw_growth.dim_media_setup.medium
      - datalake_growth_costs.daily_costs.medium
    description: The medium through which the event was delivered or executed.
    dimension: True
  source:
    lineage:
      - dw_growth.fact_demand_top_of_funnel_events.source
      - dw_growth.dim_media_setup.source
      - datalake_growth_costs.daily_costs.source
    description: The source from where the event was initiated.
    dimension: True
  is_qac:
    lineage:
      - dw_growth.fact_demand_top_of_funnel_events.is_qac
    description: |
      Flag indicating whether any top-of-funnel event in the period was associated with QuintoAndar
      Classifieds (QAC). NULL on prospect-only rows where the QAC concept does not apply.
    dimension: True
  is_cqa_demand:
    lineage:
      - dw_growth.fact_demand_prospect_events.is_cqa_demand
    description: |
      Flag indicating whether the demand originates from the CQA (Casa QuintoAndar) business model.
      Sourced from prospect events; NULL on ToF-only rows.
    dimension: True
  tof_users:
    description: Count of unique top-of-funnel users.
    metric:
      name: TOF Users
      description: Total count of unique users who entered the top of the funnel.
      acronym: tof_users
      is_additive: True
      business_stage: Demand
      hierarchy: Growth
      approved_by: uilson.bonfim@quintoandar.com.br
  tof_users_rede:
    description: Count of unique top-of-funnel users from Rede (third-party) sources.
    metric:
      name: TOF Users Rede
      description: Total count of unique users from Rede sources who entered the top of the funnel.
      acronym: tof_users_rede
      is_additive: True
      business_stage: Demand
      hierarchy: Growth
      approved_by: uilson.bonfim@quintoandar.com.br
  tof_events:
    description: Count of unique top-of-funnel events.
    metric:
      name: TOF Events
      description: Total count of unique events occurring at the top of the funnel.
      acronym: tof_events
      is_additive: True
      business_stage: Demand
      hierarchy: Growth
      approved_by: uilson.bonfim@quintoandar.com.br
  tof_events_rede:
    description: Count of unique top-of-funnel events from Rede (third-party) sources.
    metric:
      name: TOF Events Rede
      description: Total count of unique events from Rede sources occurring at the top of the funnel.
      acronym: tof_events_rede
      is_additive: True
      business_stage: Demand
      hierarchy: Growth
      approved_by: uilson.bonfim@quintoandar.com.br
  new_prospects:
    description: Count of unique new prospects identified for the first time.
    metric:
      name: New Prospects
      description: Total number of new prospects identified during the specified period.
      acronym: new_prospects
      is_additive: True
      business_stage: Demand
      hierarchy: Growth
      approved_by: uilson.bonfim@quintoandar.com.br
  recovered_prospects:
    description: Count of prospects who have re-engaged after a period of inactivity.
    metric:
      name: Recovered Prospects
      description: Total number of prospects re-engaged after previously being inactive.
      acronym: recovered_prospects
      is_additive: True
      business_stage: Demand
      hierarchy: Growth
      approved_by: uilson.bonfim@quintoandar.com.br
  flows:
    description: Count of unique flow sessions initiated.
    metric:
      name: Flows Initiated
      description: Total number of unique flow sessions started within the aggregation period.
      acronym: flows
      is_additive: True
      business_stage: Demand
      hierarchy: Growth
      approved_by: uilson.bonfim@quintoandar.com.br
  cost:
    lineage:
      - datalake_growth_costs.daily_costs.total_cost
    description: Total costs associated with the marketing campaigns.
    metric:
      name: Marketing Cost
      description: Aggregate cost of marketing campaigns captured daily.
      acronym: marketing_cost
      is_additive: True
      business_stage: Demand
      hierarchy: Growth
      approved_by: uilson.bonfim@quintoandar.com.br
  year:
    lineage:
      - dw_growth.fact_demand_top_of_funnel_events.year
      - dw_growth.fact_demand_prospect_events.year
      - dw_public.dim_date.year
    description: |
      Table partition column (year). Derived from dt_event. Required in WHERE clauses for partition
      pruning — always combine with month and day to restrict scans to the smallest date window needed.
    dimension: False
  month:
    lineage:
      - dw_growth.fact_demand_top_of_funnel_events.month
      - dw_growth.fact_demand_prospect_events.month
      - dw_public.dim_date.month
    description: |
      Table partition column (month, 1–12). Derived from dt_event. Must be filtered together with year
      and day in every query to enable partition pruning.
    dimension: False
  day:
    lineage:
      - dw_growth.fact_demand_top_of_funnel_events.day
      - dw_growth.fact_demand_prospect_events.day
      - dw_public.dim_date.day
    description: |
      Table partition column (day, 1–31). Derived from dt_event. Always filter with year and month.
      Example: WHERE year = 2026 AND month = 6 AND day BETWEEN 1 AND 7.
    dimension: False
  ts_load:
    description: |
      Timestamp when the metric row was loaded into the table by the metric_growth__demand DAG run.
    dimension: False
