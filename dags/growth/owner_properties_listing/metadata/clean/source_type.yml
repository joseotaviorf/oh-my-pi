    description: Enum code identifying the source type (e.g. COMPANY_REF, PERSON_REF).
    lineage:
      - datalake_owner_properties_listing_raw.tb_source_type.type
  ts_created:
    description: Timestamp when the dictionary row was created.
    lineage:
      - datalake_owner_properties_listing_raw.tb_source_type.created_at
  ts_updated:
    description: Timestamp of the last update to the dictionary row.
    lineage:
      - datalake_owner_properties_listing_raw.tb_source_type.updated_at
  year:
    description: CDC partition year derived from the ingestion pipeline.
    lineage:
      - datalake_owner_properties_listing_raw.tb_source_type.year
  month:
    description: CDC partition month derived from the ingestion pipeline.
    lineage:
      - datalake_owner_properties_listing_raw.tb_source_type.month
  day:
    description: CDC partition day derived from the ingestion pipeline.
    lineage:
      - datalake_owner_properties_listing_raw.tb_source_type.day
