---
database_name: datalake_crm_lead
table_name: lead_tasks
description: CRM task information about leads
domain: Growth
owner: cristina.cardoso@quintoandar.com.br
columns:
  id_lead:
    lineage:
      - datalake_crm_tasks.task_status.id_origin
    description: Unique id that identifies the lead on Main
  id_rep:
    lineage:
      - datalake_crm_tasks.task_status.id_rep
    description: Key of task assignee for a specific task
  ts_created:
    lineage:
      - datalake_crm_tasks.task_status.ts_created
    description: Task creation date
  ts_closed:
    lineage:
      - datalake_crm_tasks.task_status.ts_closed
    description: Task closing date
  lead_task_order:
    description: Task order, acording to id_lead and ts_created.
  lead_task_inverse_order:
    description: Inversed task order, acording to id_lead and ts_created.
