---
database_name: datalake_hightouch_logs_clean
table_name: sync_changelog_trino
domain: Growth
owner: bruno.sbrito@quintoandar.com.br
description: Clean Hightouch sync changelog from Trino source tracking individual row synchronization operations
columns:
  id_sync:
    description: Unique identifier for the sync configuration
    lineage:
      - datalake_hightouch_logs_raw.sync_changelog_trino.sync_id
  id_sync_run:
    description: Unique identifier for the specific sync run execution
    lineage:
      - datalake_hightouch_logs_raw.sync_changelog_trino.sync_run_id
  id_row:
    description: Unique identifier for the individual row being synchronized
    lineage:
      - datalake_hightouch_logs_raw.sync_changelog_trino.row_id
  op_type:
    description: Type of operation performed (insert, update, delete)
    lineage:
      - datalake_hightouch_logs_raw.sync_changelog_trino.op_type
  status:
    description: Status of the synchronization operation (success, failed, pending)
    lineage:
      - datalake_hightouch_logs_raw.sync_changelog_trino.status
  failure_reason:
    description: Detailed reason for failure if the operation was unsuccessful
    lineage:
      - datalake_hightouch_logs_raw.sync_changelog_trino.failure_reason
  fields:
    description: Field data that was synchronized for this row operation
    lineage:
      - datalake_hightouch_logs_raw.sync_changelog_trino.fields
  year:
    description: Partition column representing the year of the data
    lineage:
      - datalake_hightouch_logs_raw.sync_changelog_trino.year
  month:
    description: Partition column representing the month of the data
    lineage:
      - datalake_hightouch_logs_raw.sync_changelog_trino.month
  day:
    description: Partition column representing the day of the data
    lineage:
      - datalake_hightouch_logs_raw.sync_changelog_trino.day
