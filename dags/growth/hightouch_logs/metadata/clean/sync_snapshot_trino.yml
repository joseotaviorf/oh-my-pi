---
database_name: datalake_hightouch_logs_clean
table_name: sync_snapshot_trino
domain: Growth
description: Clean Hightouch sync snapshot rows for export days in the load window (partitions from raw, tagged at ingest from path date)
columns:
  id_sync:
    description: Unique identifier for the sync configuration
    lineage:
      - datalake_hightouch_logs_raw.sync_snapshot_trino.sync_id
  id_row:
    description: Primary key value of the model row as defined in Hightouch
    lineage:
      - datalake_hightouch_logs_raw.sync_snapshot_trino.row_id
  op_type:
    description: Whether the row was added, changed, or unchanged relative to the last sync run
    lineage:
      - datalake_hightouch_logs_raw.sync_snapshot_trino.op_type
  status:
    description: Row-level sync outcome (succeeded, failed, or aborted)
    lineage:
      - datalake_hightouch_logs_raw.sync_snapshot_trino.status
  failure_reason:
    description: Error description when status is failed
    lineage:
      - datalake_hightouch_logs_raw.sync_snapshot_trino.failure_reason
  model_fields_json:
    description: JSON string of model fields for the row from warehouse sync logs
    lineage:
      - datalake_hightouch_logs_raw.sync_snapshot_trino.fields
  year:
    description: Partition year from raw (export path date)
    lineage:
      - datalake_hightouch_logs_raw.sync_snapshot_trino.year
  month:
    description: Partition month from raw (export path date)
    lineage:
      - datalake_hightouch_logs_raw.sync_snapshot_trino.month
  day:
    description: Partition day from raw (export path date)
    lineage:
      - datalake_hightouch_logs_raw.sync_snapshot_trino.day
