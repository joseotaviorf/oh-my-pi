---
database_name: datalake_hightouch_logs_clean
table_name: audience_membership_trino
domain: Growth
owner: isadora.gallerani@quintoandar.com.br
description: |
  Clean layer for Hightouch Customer Studio audience membership snapshots ingested from the CDP Trino
  export path (source: hightouch_planner.audience_membership parquet file on S3). One row per audience
  member event, deduplicated to the latest event per (id_audience, id_row). Hightouch writes a row
  after each successful audience sync whenever Audience Snapshotting is enabled on the source, recording
  when a user entered or exited a marketing audience. Used by Growth to track campaign reach over time,
  measure audience size changes, evaluate A/B split group distribution, and analyze membership churn.
  Join to sync_runs_trino via audience sync configurations for run context. Part of the hightouch_logs
  DAG (hourly ingestion). Requires Lightning sync engine with Audience snapshotting enabled.
  Partitioned by year, month, and day (derived from ts_ht). Always filter on year, month, and day
  in WHERE clauses to enable partition pruning and avoid full table scans; align partition filters
  with the ts_ht event date range being analyzed. When filtering by audience, combine partition
  predicates with id_audience to benefit from Z-order clustering on id_audience.
  Hightouch documentation: https://hightouch.com/docs/customer-studio/audience-snapshots;
  warehouse schema reference: https://hightouch.com/docs/developer-tools/warehouse-tables.
columns:
  id_audience:
    description: |
      Hightouch Customer Studio audience identifier (maps to ht_audience_id in the source). Identifies
      which saved audience the membership event belongs to. Use to filter events by campaign or segment.
    lineage:
      - datalake_hightouch_logs_raw.audience_membership_trino.ht_audience_id
  id_row:
    description: |
      Hightouch-internal primary key of the audience member (maps to ht_row_id). Identifies the member
      within a given audience inside the Hightouch platform; it is not the QuintoAndar id_user and
      cannot be joined to dw_public.dim_person or dim_user. Stringified when the source type is not
      string.
    lineage:
      - datalake_hightouch_logs_raw.audience_membership_trino.ht_row_id
  ht_event_type:
    description: |
      Membership change event type recorded by Hightouch after an audience sync. enter means the user
      newly qualified for the audience; exit means the user no longer qualifies. Used to reconstruct
      audience size over time and detect membership flapping.
    lineage:
      - datalake_hightouch_logs_raw.audience_membership_trino.ht_event_type
    categories:
      enter: User newly entered the audience after qualifying for its criteria.
      exit: User exited the audience because they no longer match the audience criteria.
  ht_split_group:
    description: |
      A/B test or audience split group identifier when the audience uses experiment splits in Customer
      Studio. Null when no split is configured for the audience sync.
    lineage:
      - datalake_hightouch_logs_raw.audience_membership_trino.ht_split_group
  ts_ht:
    description: |
      Timestamp when the user entered or exited the audience, as recorded by Hightouch at snapshot
      time. Used as the event time for membership history analysis and time-series audience sizing.
    lineage:
      - datalake_hightouch_logs_raw.audience_membership_trino.ht_timestamp
  year:
    description: |
      Table partition column (year). Derived from ts_ht at raw ingestion. Required in WHERE clauses
      for partition pruning — always combine with month and day to restrict scans to the smallest
      date window needed. Queries without partition filters will scan the entire table.
    lineage:
      - datalake_hightouch_logs_raw.audience_membership_trino.year
  month:
    description: |
      Table partition column (month, 1–12). Derived from ts_ht at raw ingestion. Must be filtered
      together with year and day in every query to enable partition pruning; omitting any partition
      column disables pruning and forces a full scan.
    lineage:
      - datalake_hightouch_logs_raw.audience_membership_trino.month
  day:
    description: |
      Table partition column (day, 1–31). Derived from ts_ht at raw ingestion. Always the last
      partition column — filter with year and month to narrow the scan to specific days. Example:
      WHERE year = 2026 AND month = 6 AND day BETWEEN 1 AND 7.
    lineage:
      - datalake_hightouch_logs_raw.audience_membership_trino.day
