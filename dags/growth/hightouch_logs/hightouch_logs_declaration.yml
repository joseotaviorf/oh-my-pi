dag:
  name: hightouch_logs
  owner: Data Growth
  schedule_interval: 0 * * * *
  documentation:
    dag_purpose: |
      This DAG ingests data from Hightouch
workflow:
  type: custom_ingestion
  layer: raw
  load_spark_job: load_hightouch_logs_raw
  custom_schema: hightouch_logs
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, -1), 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  tables_customization:
    sync_runs_databricks:
      load_spark_job: load_hightouch_logs
      extra_spark_job_arguments:
        - "{environment}"
        - "{bucket}"
        - "{schema}"
        - "{dag_name}"
        - "{table_name}"
        - "{load_start_date}"
        - "{load_end_date}"
        - "incremental"
        - "started_at"
        - "hightouch_audit.sync_runs"
        - "table"
      extraction_type: incremental
      partitions: [year, month, day]
    sync_runs_trino:
      clean_z_order_by: [id_sync]
      load_spark_job: load_hightouch_logs
      extra_spark_job_arguments:
        - "{environment}"
        - "{bucket}"
        - "{schema}"
        - "{dag_name}"
        - "{table_name}"
        - "{load_start_date}"
        - "{load_end_date}"
        - "incremental"
        - "started_at"
        - "s3://5a-cdp-processed-data-{environment}/repo/hightouch/hightouch_audit/sync_runs"
        - "parquet"
      extraction_type: incremental
      partitions: [year, month, day]
    audience_membership_databricks:
      load_spark_job: load_hightouch_logs
      extra_spark_job_arguments:
        - "{environment}"
        - "{bucket}"
        - "{schema}"
        - "{dag_name}"
        - "{table_name}"
        - "{load_start_date}"
        - "{load_end_date}"
        - "ht_timestamp"
        - "incremental"
        - "hightouch_planner.audience_membership"
        - "table"
      extraction_type: incremental
      partitions: [year, month, day]
    audience_membership_trino:
      clean_z_order_by: [id_audience]
      load_spark_job: load_hightouch_logs
      extra_spark_job_arguments:
        - "{environment}"
        - "{bucket}"
        - "{schema}"
        - "{dag_name}"
        - "{table_name}"
        - "{load_start_date}"
        - "{load_end_date}"
        - "incremental"
        - "ht_timestamp"
        - "s3://5a-cdp-processed-data-{environment}/repo/hightouch/hightouch_planner/audience_membership"
        - "parquet"
      extraction_type: incremental
      partitions: [year, month, day]
    sync_snapshot_trino:
      clean_z_order_by: [id_sync]
      load_spark_job: load_hightouch_sync_snapshot
      extra_spark_job_arguments:
        - "{environment}"
        - "{bucket}"
        - "{schema}"
        - "{dag_name}"
        - "{table_name}"
        - "{load_start_date}"
        - "{load_end_date}"
        - "incremental"
        - "sync_id"
        - "s3://5a-cdp-processed-data-{environment}/repo/hightouch/hightouch_audit/sync_snapshot"
        - "parquet"
      extraction_type: incremental
      clean_extraction_type: incremental
      raw_partitions: []
      clean_partitions: [year, month, day]
      merge_on: [id_sync, id_row]
cluster:
  type: databricks_16_4_min_2xlarge_memory_cluster_4_workers
  databricks_conn_id: databricks_new
