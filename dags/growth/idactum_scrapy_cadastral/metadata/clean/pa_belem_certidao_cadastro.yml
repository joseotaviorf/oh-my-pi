database_name: datalake_crawled_idactum_houses_clean
table_name: pa_belem_certidao_cadastro
description: |
  Flattened Belém cadastral certificate fields from the pa_belem_certidao_cadastro Scrapy
  spider, mapped toward the idactum_houses legacy contract with address and area metrics.
domain: Growth
owner: gabriel.mota@quintoandar.com.br
columns:
  id_municipal_house:
    lineage:
      - datalake_crawled_idactum_houses_raw.pa_belem_certidao_cadastro.response.inscricao
    description: |
      Belém municipal cadastral inscription used as the property join key.
  municipal_inscription:
    lineage:
      - datalake_crawled_idactum_houses_raw.pa_belem_certidao_cadastro.response.inscricao
    description: |
      Formatted municipal cadastral inscription from the certificate.
  state:
    description: |
      Brazilian state abbreviation for Belém properties (constant PA).
  city:
    description: |
      Municipality name for Belém properties (constant Belem).
  neighborhood:
    lineage:
      - datalake_crawled_idactum_houses_raw.pa_belem_certidao_cadastro.response.bairro
    description: |
      Neighborhood from the cadastral certificate.
  street:
    lineage:
      - datalake_crawled_idactum_houses_raw.pa_belem_certidao_cadastro.response.logradouro
    description: |
      Street name from the cadastral certificate.
  address_number:
    lineage:
      - datalake_crawled_idactum_houses_raw.pa_belem_certidao_cadastro.response.numero
    description: |
      Street number from the cadastral certificate.
  address_details:
    lineage:
      - datalake_crawled_idactum_houses_raw.pa_belem_certidao_cadastro.response.complemento
    description: |
      Address complement from the cadastral certificate.
  zipcode:
    lineage:
      - datalake_crawled_idactum_houses_raw.pa_belem_certidao_cadastro.response.cep
    description: |
      Postal code from the cadastral certificate.
  lot_area:
    lineage:
      - datalake_crawled_idactum_houses_raw.pa_belem_certidao_cadastro.response.area_terreno
    description: |
      Lot area in square meters from the cadastral certificate.
  building_area:
    lineage:
      - datalake_crawled_idactum_houses_raw.pa_belem_certidao_cadastro.response.area_construida
    description: |
      Built area in square meters from the cadastral certificate.
  usage_purpose:
    lineage:
      - datalake_crawled_idactum_houses_raw.pa_belem_certidao_cadastro.response.uso
    description: |
      Declared usage purpose from the certificate.
  property_type:
    lineage:
      - datalake_crawled_idactum_houses_raw.pa_belem_certidao_cadastro.response.tipo
    description: |
      Property type from the cadastral certificate (for example Casa).
  assessed_iptu_value:
    lineage:
      - datalake_crawled_idactum_houses_raw.pa_belem_certidao_cadastro.response.valor_venal
    description: |
      Government-assessed venal value from the cadastral certificate.
  tax_status:
    lineage:
      - datalake_crawled_idactum_houses_raw.pa_belem_certidao_cadastro.response.status_imposto
    description: |
      IPTU tax status text from the cadastral certificate.
  feed_source:
    lineage:
      - datalake_crawled_idactum_houses_raw.pa_belem_certidao_cadastro.metadata.source
    description: |
      Spider source tag embedded in the crawl metadata payload.
  feed_url:
    lineage:
      - datalake_crawled_idactum_houses_raw.pa_belem_certidao_cadastro.metadata.url
    description: |
      Source URL consulted by the crawler when producing this record.
  ts_accessed:
    lineage:
      - datalake_crawled_idactum_houses_raw.pa_belem_certidao_cadastro.metadata.accessed_at
    description: |
      Timestamp when the crawler accessed the municipal portal page or API.
  referer_url:
    lineage:
      - datalake_crawled_idactum_houses_raw.pa_belem_certidao_cadastro.metadata.referer_url
    description: |
      HTTP referer URL captured during the crawl session, when available.
  crawler_name:
    lineage:
      - datalake_crawled_idactum_houses_raw.pa_belem_certidao_cadastro.crawler_name
    description: |
      Scrapy spider name that produced the raw record.
  dt_load:
    lineage:
      - datalake_crawled_idactum_houses_raw.pa_belem_certidao_cadastro.dt_load
    description: |
      Date when the raw JSONL batch was loaded into the datalake.
  year:
    lineage:
      - datalake_crawled_idactum_houses_raw.pa_belem_certidao_cadastro.year
    description: |
      Partition year derived from the DAG execution date of the Scrapy feed.
  month:
    lineage:
      - datalake_crawled_idactum_houses_raw.pa_belem_certidao_cadastro.month
    description: |
      Partition month derived from the DAG execution date of the Scrapy feed.
  day:
    lineage:
      - datalake_crawled_idactum_houses_raw.pa_belem_certidao_cadastro.day
    description: |
      Partition day derived from the DAG execution date of the Scrapy feed.
