      Postal code from the ficha.
  lot_area:
    lineage:
      - datalake_crawled_idactum_houses_raw.bsb_main_fichas.response.area_terreno
    description: |
      Lot area in square meters from the ficha.
  building_area:
    lineage:
      - datalake_crawled_idactum_houses_raw.bsb_main_fichas.response.area_da_construcao_do_alvara
