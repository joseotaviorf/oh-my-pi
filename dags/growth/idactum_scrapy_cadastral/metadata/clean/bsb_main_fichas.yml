      DF municipal property inscription.
  municipal_inscription:
    lineage:
      - datalake_crawled_idactum_houses_raw.bsb_main_fichas.response.inscricao
    description: |
      Formatted DF municipal cadastral inscription.
  state:
    description: |
      Brazilian state abbreviation for DF properties (constant DF).
  city:
    lineage:
      - datalake_crawled_idactum_houses_raw.bsb_main_fichas.response.cidade
    description: |
      Municipality name parsed from the ficha record.
  neighborhood:
    lineage:
      - datalake_crawled_idactum_houses_raw.bsb_main_fichas.response.bairro_de_correspondencia
