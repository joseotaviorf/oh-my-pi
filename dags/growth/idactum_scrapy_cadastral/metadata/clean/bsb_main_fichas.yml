      Declared private area from the ficha.
  usage_purpose:
    lineage:
      - datalake_crawled_idactum_houses_raw.bsb_main_fichas.response.natureza_do_imovel
    description: |
      Property usage classification from the ficha.
  feed_source:
    lineage:
      - datalake_crawled_idactum_houses_raw.bsb_main_fichas.metadata.source
    description: |
      Spider source tag embedded in the crawl metadata payload.
  feed_url:
    lineage:
      - datalake_crawled_idactum_houses_raw.bsb_main_fichas.metadata.url
    description: |
      Source URL consulted by the crawler when producing this record.
  ts_accessed:
    lineage:
      - datalake_crawled_idactum_houses_raw.bsb_main_fichas.metadata.accessed_at
    description: |
      Timestamp when the crawler accessed the municipal portal page or API.
  referer_url:
    lineage:
      - datalake_crawled_idactum_houses_raw.bsb_main_fichas.metadata.referer_url
