---
database_name: datalake_crawled_idactum_houses_clean
table_name: bsb_main_fichas
description: |
  Flattened Brasilia ficha cadastral fields mapped toward the idactum_houses legacy contract.
domain: Growth
owner: gabriel.mota@quintoandar.com.br
columns:
  id_municipal_house:
    lineage:
      - datalake_crawled_idactum_houses_raw.bsb_main_fichas.response.inscricao
