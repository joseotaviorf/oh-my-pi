---
database_name: datalake_crawled_idactum_houses_clean
table_name: am_manaus_bci
description: |
  Flattened Manaus BCI cadastral records mapped toward the idactum_houses legacy contract.
domain: Growth
owner: gabriel.mota@quintoandar.com.br
columns:
  id_municipal_house:
    lineage:
      - datalake_crawled_idactum_houses_raw.am_manaus_bci.response.inscricao
      - datalake_crawled_idactum_houses_raw.am_manaus_bci.response.matricula
    description: |
      Municipal property inscription or matricula identifier.
  municipal_inscription:
    lineage:
      - datalake_crawled_idactum_houses_raw.am_manaus_bci.response.inscricao
    description: |
      Formatted municipal cadastral inscription.
  real_estate_registry:
    lineage:
      - datalake_crawled_idactum_houses_raw.am_manaus_bci.response.matricula
    description: |
      Property registry matricula number.
  state:
    description: |
      Brazilian state abbreviation for Manaus properties (constant AM).
  city:
    description: |
      Municipality name for Manaus properties (constant Manaus).
  neighborhood:
    lineage:
      - datalake_crawled_idactum_houses_raw.am_manaus_bci.response.bairro
    description: |
      Neighborhood name from the BCI certificate.
  street:
    lineage:
      - datalake_crawled_idactum_houses_raw.am_manaus_bci.response.logradouro
    description: |
      Street name from the BCI certificate.
  address_number:
    lineage:
      - datalake_crawled_idactum_houses_raw.am_manaus_bci.response.numero
    description: |
      Street number from the BCI certificate.
  zipcode:
    lineage:
      - datalake_crawled_idactum_houses_raw.am_manaus_bci.response.cep
    description: |
      Postal code from the BCI certificate.
  address_details:
    lineage:
      - datalake_crawled_idactum_houses_raw.am_manaus_bci.response.complemento
    description: |
      Address complement from the BCI certificate.
  building_year:
    lineage:
      - datalake_crawled_idactum_houses_raw.am_manaus_bci.response.ano_construcao
    description: |
      Construction year reported on the certificate.
  lot_area:
    lineage:
      - datalake_crawled_idactum_houses_raw.am_manaus_bci.response.area_terreno
    description: |
      Lot area in square meters.
  building_area:
    lineage:
      - datalake_crawled_idactum_houses_raw.am_manaus_bci.response.area_construcao_unidade
    description: |
      Built area of the unit in square meters.
  private_area:
    lineage:
      - datalake_crawled_idactum_houses_raw.am_manaus_bci.response.area_edificada
    description: |
      Private built area in square meters.
  kind:
    lineage:
      - datalake_crawled_idactum_houses_raw.am_manaus_bci.response.tipo_imovel
    description: |
      Property type classification from the certificate.
  feed_source:
    lineage:
      - datalake_crawled_idactum_houses_raw.am_manaus_bci.metadata.source
    description: |
      Spider source tag embedded in the crawl metadata payload.
  feed_url:
    lineage:
      - datalake_crawled_idactum_houses_raw.am_manaus_bci.metadata.url
    description: |
      Source URL consulted by the crawler when producing this record.
  ts_accessed:
    lineage:
      - datalake_crawled_idactum_houses_raw.am_manaus_bci.metadata.accessed_at
    description: |
      Timestamp when the crawler accessed the municipal portal page or API.
  referer_url:
    lineage:
      - datalake_crawled_idactum_houses_raw.am_manaus_bci.metadata.referer_url
    description: |
      HTTP referer URL captured during the crawl session, when available.
  crawler_name:
    lineage:
      - datalake_crawled_idactum_houses_raw.am_manaus_bci.crawler_name
    description: |
      Scrapy spider name that produced the raw record.
  dt_load:
    lineage:
      - datalake_crawled_idactum_houses_raw.am_manaus_bci.dt_load
    description: |
      Date when the raw JSONL batch was loaded into the datalake.
  year:
    lineage:
      - datalake_crawled_idactum_houses_raw.am_manaus_bci.year
    description: |
      Partition year derived from the DAG execution date of the Scrapy feed.
  month:
    lineage:
      - datalake_crawled_idactum_houses_raw.am_manaus_bci.month
    description: |
      Partition month derived from the DAG execution date of the Scrapy feed.
  day:
    lineage:
      - datalake_crawled_idactum_houses_raw.am_manaus_bci.day
    description: |
      Partition day derived from the DAG execution date of the Scrapy feed.
