---
database_name: datalake_crawled_idactum_houses_clean
table_name: rj_dados_cadastrais_main_predio
description: |
  Flattened Rio de Janeiro building-level cadastral records with municipal inscription
  mapped toward the idactum_houses legacy contract.
domain: Growth
owner: gabriel.mota@quintoandar.com.br
columns:
  id_municipal_house:
    lineage:
      - datalake_crawled_idactum_houses_raw.rj_dados_cadastrais_main_predio.response.inscription_sem_dv
    description: |
      Municipal property inscription without check digit from the building cadastral payload.
  state:
    description: |
      Brazilian state abbreviation for Rio de Janeiro properties (constant RJ).
  city:
    description: |
      Municipality name for Rio de Janeiro properties (constant Rio de Janeiro).
  feed_source:
    lineage:
      - datalake_crawled_idactum_houses_raw.rj_dados_cadastrais_main_predio.metadata.source
    description: |
      Spider source tag embedded in the crawl metadata payload.
  feed_url:
    lineage:
      - datalake_crawled_idactum_houses_raw.rj_dados_cadastrais_main_predio.metadata.url
    description: |
      Source URL consulted by the crawler when producing this record.
  ts_accessed:
    lineage:
      - datalake_crawled_idactum_houses_raw.rj_dados_cadastrais_main_predio.metadata.accessed_at
    description: |
      Timestamp when the crawler accessed the municipal portal page or API.
  referer_url:
    lineage:
      - datalake_crawled_idactum_houses_raw.rj_dados_cadastrais_main_predio.metadata.referer_url
    description: |
      HTTP referer URL captured during the crawl session, when available.
  crawler_name:
    lineage:
      - datalake_crawled_idactum_houses_raw.rj_dados_cadastrais_main_predio.crawler_name
    description: |
      Scrapy spider name that produced the raw record.
  dt_load:
    lineage:
      - datalake_crawled_idactum_houses_raw.rj_dados_cadastrais_main_predio.dt_load
    description: |
      Date when the raw JSONL batch was loaded into the datalake.
  year:
    lineage:
      - datalake_crawled_idactum_houses_raw.rj_dados_cadastrais_main_predio.year
    description: |
      Partition year derived from the DAG execution date of the Scrapy feed.
  month:
    lineage:
      - datalake_crawled_idactum_houses_raw.rj_dados_cadastrais_main_predio.month
    description: |
      Partition month derived from the DAG execution date of the Scrapy feed.
  day:
    lineage:
      - datalake_crawled_idactum_houses_raw.rj_dados_cadastrais_main_predio.day
    description: |
      Partition day derived from the DAG execution date of the Scrapy feed.
