---
database_name: datalake_crawled_idactum_houses_clean
table_name: bh_cnd_main
description: |
  Flattened Belo Horizonte CND cadastral certificate records with municipal inscription
  mapped toward the idactum_houses legacy contract.
domain: Growth
owner: gabriel.mota@quintoandar.com.br
columns:
  id_municipal_house:
    lineage:
      - datalake_crawled_idactum_houses_raw.bh_cnd_main.response.inscricao
    description: |
      Municipal property inscription from the CND payload, normalized to digits only
      (spaces and punctuation removed).
  state:
    description: |
      Brazilian state abbreviation for Belo Horizonte properties (constant MG).
  city:
    description: |
      Municipality name for Belo Horizonte properties (constant Belo Horizonte).
  feed_source:
    lineage:
      - datalake_crawled_idactum_houses_raw.bh_cnd_main.metadata.source
    description: |
      Spider source tag embedded in the crawl metadata payload.
  feed_url:
    lineage:
      - datalake_crawled_idactum_houses_raw.bh_cnd_main.metadata.url
    description: |
      Source URL consulted by the crawler when producing this record.
  ts_accessed:
    lineage:
      - datalake_crawled_idactum_houses_raw.bh_cnd_main.metadata.accessed_at
    description: |
      Timestamp when the crawler accessed the municipal portal page or API.
  referer_url:
    lineage:
      - datalake_crawled_idactum_houses_raw.bh_cnd_main.metadata.referer_url
    description: |
      HTTP referer URL captured during the crawl session, when available.
  crawler_name:
    lineage:
      - datalake_crawled_idactum_houses_raw.bh_cnd_main.crawler_name
    description: |
      Scrapy spider name that produced the raw record.
  dt_load:
    lineage:
      - datalake_crawled_idactum_houses_raw.bh_cnd_main.dt_load
    description: |
      Date when the raw JSONL batch was loaded into the datalake.
  year:
    lineage:
      - datalake_crawled_idactum_houses_raw.bh_cnd_main.year
    description: |
      Partition year derived from the DAG execution date of the Scrapy feed.
  month:
    lineage:
      - datalake_crawled_idactum_houses_raw.bh_cnd_main.month
    description: |
      Partition month derived from the DAG execution date of the Scrapy feed.
  day:
    lineage:
      - datalake_crawled_idactum_houses_raw.bh_cnd_main.day
    description: |
      Partition day derived from the DAG execution date of the Scrapy feed.
