      - datalake_crawled_idactum_houses_raw.sp_osasco_pesquisa_cep.response.situacao
    description: |
      Active status flag parsed from situacao field.
  feed_source:
    lineage:
      - datalake_crawled_idactum_houses_raw.sp_osasco_pesquisa_cep.metadata.source
    description: |
      Spider source tag embedded in the crawl metadata payload.
  feed_url:
    lineage:
      - datalake_crawled_idactum_houses_raw.sp_osasco_pesquisa_cep.metadata.url
    description: |
      Source URL consulted by the crawler when producing this record.
  ts_accessed:
    lineage:
      - datalake_crawled_idactum_houses_raw.sp_osasco_pesquisa_cep.metadata.accessed_at
