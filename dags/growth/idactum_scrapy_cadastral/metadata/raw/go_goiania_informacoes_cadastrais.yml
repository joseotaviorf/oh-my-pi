---
database_name: datalake_crawled_idactum_houses_raw
table_name: go_goiania_informacoes_cadastrais
description: |
  Raw Crawl JSONL feed from the Scrapy crawler go_goiania_informacoes_cadastrais (Goiânia
  municipal cadastral information records linked to property registrations). One table per spider under the shared crawled_idactum_houses
  raw database. Schema-on-read from batch_*.jsonl under crawler-scrapy feeds.
domain: Growth
owner: gabriel.mota@quintoandar.com.br
columns:
  registration_number:
    description: |
      Municipal property registration number used as lookup key.
  cadastral_info:
    description: |
      Array of cadastral attribute records for the registration.
  total_records:
    description: |
      Count of cadastral records returned for the registration.
  metadata:
    description: |
      Crawl metadata including source spider, URL, access timestamp and referer.
  crawler_name:
    description: |
      Scrapy spider name that produced the record (always go_goiania_informacoes_cadastrais for this table).
  dt_load:
    description: |
      Date when the JSONL batch was loaded into the raw datalake table.
  year:
    description: |
      Partition year derived from the DAG execution date of the Scrapy feed.
  month:
    description: |
      Partition month derived from the DAG execution date of the Scrapy feed.
  day:
    description: |
      Partition day derived from the DAG execution date of the Scrapy feed.
