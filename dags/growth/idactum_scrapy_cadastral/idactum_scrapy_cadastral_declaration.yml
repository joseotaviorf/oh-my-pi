dag:
  name: idactum_scrapy_cadastral
  owner: Data Growth
  schedule_start_date: 2026, 05, 07
  documentation:
    dag_purpose: |
      Ingest Idactum Scrapy cadastral crawler outputs from crawler-scrapy-{forno|prod}
      into the shared crawled_idactum_houses raw/clean databases. Covers Goiania cadastral
      spiders, Osasco CDC/CEP/people lookups, Rio de Janeiro and Niteroi cadastral feeds,
      Sao Paulo recadastramento, Brasilia territorial cadastre, and other municipal
      certificate crawlers. One EMR cluster per DAG run with parallel raw+clean tasks per spider.
workflow:
  layer: raw
  type: custom_ingestion
  custom_schema: crawled_idactum_houses
  spark_job_prefix: crawled_idactum_houses
  load_spark_job: load_idactum_scrapy_raw
  default_extraction_type: full
  default_partitions: [year, month, day]
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
  spark_job_arguments:
    - "{environment}"
    - "{bucket}"
    - "{table_name}"
    - "{load_start_date}"
    - "crawled_idactum_houses"
    - "{table_name}"
  tables_customization:
    go_goiania_informacoes_cadastrais:
      partitions: [year, month, day]
    go_goiania_cadastro_imobiliario:
      partitions: [year, month, day]
    go_goiania_comprovacao_pagamento:
      partitions: [year, month, day]
    sp_osasco_pesquisa_cdc:
      partitions: [year, month, day]
    am_manaus_bci:
      partitions: [year, month, day]
    ba_salvador_certidao_cadastral:
      partitions: [year, month, day]
    bh_cnd_main:
      partitions: [year, month, day]
    bsb_main_cadastro_territorial:
      partitions: [year, month, day]
    bsb_main_certidao_geometria:
      partitions: [year, month, day]
    bsb_main_fichas:
      partitions: [year, month, day]
    pe_recife_certidao_narrativa_imob:
      partitions: [year, month, day]
    rj_dados_cadastrais_main_busca:
      partitions: [year, month, day]
    rj_dados_cadastrais_main_nirf:
      partitions: [year, month, day]
    rj_dados_cadastrais_main_predio:
      partitions: [year, month, day]
    rj_niteroi_e_cidade:
      partitions: [year, month, day]
    sp_dados_cadastrais_recadastramento_main:
      partitions: [year, month, day]
    sp_osasco_pesquisa_cep:
      partitions: [year, month, day]
    sp_osasco_compromissarios:
      partitions: [year, month, day]
    sp_osasco_proprietarios:
      partitions: [year, month, day]
    pa_belem_certidao_cadastro_bairros:
      partitions: [year, month, day]
    pa_belem_certidao_cadastro:
      partitions: [year, month, day]
