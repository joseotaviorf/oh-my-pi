---
database_name: dw_growth
table_name: dim_sharing_rules
owner: henrique.paulo@quintoandar.com.br
domain: Growth
description: This dimension consolidates cost-sharing rules by date and segmentation attributes.
columns:
  bk_sharing_rules:
    description: Business key combining allocation date and rule code for the sharing rule dimension.
    lineage:
      - datalake_growth_costs_sharing_rules.sharing_rules.share
      - datalake_growth_costs_sharing_rules.sharing_rules.id_date
  business_context:
    description: Business line (Rent, Sale, Hybrid) associated with the campaign spend after enrichment.
    lineage:
      - datalake_growth_costs_sharing_rules.sharing_rules.business_context
  city_group:
    description: Geographic city group assigned to the spend after sharing rules and taxonomy mapping.
    lineage:
      - datalake_growth_costs_sharing_rules.sharing_rules.city_group
  country_code:
    description: ISO country code of the campaign or account where the marketing spend was recorded.
    lineage: null
  funnel_side:
    description: Funnel side from taxonomy indicating demand-side versus supply-side marketing focus.
    lineage:
      - datalake_growth_costs_sharing_rules.sharing_rules.funnel_side
  rule_code:
    description: Sharing rule code from the enrich layer identifying the allocation logic applied.
    lineage:
      - datalake_growth_costs_sharing_rules.sharing_rules.id_rule
  share:
    description: Fraction or percentage of the source campaign cost allocated to this city group or segment.
    lineage:
      - datalake_growth_costs_sharing_rules.sharing_rules.share
  utm_campaign_modified:
    description: UTM campaign string after sharing-rule transformations used in downstream cost joins.
    lineage:
      - datalake_growth_costs_sharing_rules.sharing_rules.utm_campaign_modified
  dt_rule_costs:
    description: Calendar date when the sharing rule allocation was applied to marketing costs.
    lineage:
      - datalake_growth_costs_sharing_rules.sharing_rules.id_date
  ts_load:
    description: Timestamp when the dimension row was materialized by the pipeline load.
