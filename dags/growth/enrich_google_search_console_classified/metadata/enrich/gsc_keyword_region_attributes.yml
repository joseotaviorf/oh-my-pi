database_name: datalake_google_search_console_classified
table_name: gsc_keyword_region_attributes
owner: caio.francisco@quintoandar.com.br
domain: Growth
description: |
  Keyword-level regional enrichment for Google Search Console (GSC) data.
  Adds inferred matches for IBGE city, while preserving keyword performance metrics.
columns:
  keyword:
    description: "Original search query from GSC."
    lineage:
      - datalake_google_search_console_classified.gsc_keywords.keyword
  keyword_clean:
    description: "Keyword normalized to lowercase with accents removed and non-alphanumeric characters stripped (spaces kept)."
    lineage:
      - datalake_google_search_console_classified.gsc_keywords.keyword_clean
  match_igbe_city:
    description: IBGE city name inferred from the cleaned keyword using Brazilian cities reference.
    lineage:
      - datalake_seo_keywords_clusters.ibge_cities.municipio_clean
      - datalake_google_search_console_classified.gsc_keywords.keyword_clean
  page:
    description: "Full page URL."
    lineage:
      - datalake_google_search_console_classified.gsc_keywords.page
  structure:
    description: "Page structure according to business rules."
    lineage:
      - datalake_google_search_console_classified.gsc_keywords.structure
  site_url:
    description: "Main property URL measured by GSC."
    lineage:
      - datalake_google_search_console_classified.gsc_keywords.site_url
  device:
    description: "Device type where the search was made (desktop, mobile, tablet)."
    lineage:
      - datalake_google_search_console_classified.gsc_keywords.device
  domain:
    description: "Generic referring domain grouping (Supply, Content, Help, QuintoAndar)."
    lineage:
      - datalake_google_search_console_classified.gsc_keywords.domain
  country:
    description: "Country from GSC"
    lineage:
      - datalake_google_search_console_classified.gsc_keywords.country
  position:
    description: "Aggregated average position computed as SUM(posimp) / SUM(impressions)."
    lineage:
      - datalake_google_search_console_classified.gsc_keywords.position
  impressions:
    description: "Total impressions in the month for the group (SUM of impressions)."
    lineage:
      - datalake_google_search_console_classified.gsc_keywords.impressions
  clicks:
    description: "Total clicks in the month for the group (SUM of clicks)."
    lineage:
      - datalake_google_search_console_classified.gsc_keywords.clicks
  ctr:
    description: "Aggregated click-through rate computed as SUM(clicks) / SUM(impressions)."
    lineage:
      - datalake_google_search_console_classified.gsc_keywords.ctr
  posimp:
    description: "Total position-impressions product in the month for the group (SUM of posimp)."
    lineage:
      - datalake_google_search_console_classified.gsc_keywords.posimp
  is_branded:
    description: "Flag indicating whether the search query is branded."
    lineage:
      - datalake_google_search_console_classified.gsc_keywords.is_branded
  has_mention_to_city:
    description: Flag indicating whether the keyword mentions or implies a city.
    lineage:
      - datalake_google_search_console.gsc_keywords.keyword_clean
      - datalake_seo_keywords_clusters.ibge_cities.municipio_clean
  dt_created:
    description: "Month reference date (first day of month) derived from the original search date."
    lineage:
      - datalake_google_search_console_classified.gsc_keywords.dt_created
  year:
    description: "Partition year."
    lineage:
      - datalake_google_search_console_classified.gsc_keywords.year
  month:
    description: "Partition month."
    lineage:
      - datalake_google_search_console_classified.gsc_keywords.month
  day:
    description: "Partition day (set to 01 for monthly aggregation)."
    lineage:
      - datalake_google_search_console_classified.gsc_keywords.day

