---
dag:
  name: enrich_google_search_console_classified
  schedule_start_date: 2022, 10, 18
  owner: Data Growth
  documentation:
    dag_purpose:
      This DAG generates tables to track demand user behaviors in the Google
      Search Console classified SEO funnel. It is relevant for the SEO tribe to monitor and analyze
      the results by page type so that the squads (transactional and informational)
      can more efficiently identify problems, impacts, and opportunities. In addition,
      this funnel helps to prioritize the most relevant pages for the business.
workflow:
  type: query_delta
  layer: enrich
  inner_dependencies:
    gsc_keywords:
      - seo_gsc_data
    gsc_keyword_region_url_match_bra:
      - gsc_keywords
    gsc_keyword_region_attributes_bra:
      - gsc_keyword_region_url_match_bra
    gsc_keyword_region_attributes_mex:
      - gsc_keywords
  default_extraction_type: incremental
  default_partitions:
    - year
    - month
    - day
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, macros.ds_add(ds, -7), 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, macros.ds_add(ds, -1), 'load_end_date') }}"
