database_name: datalake_entities_views
table_name: listing
description: |
  Enriched listing entity view for CDP, joining listing lifecycle fields used in transactional entity resolution.
domain: Growth
owner: bruno.sbrito@quintoandar.com.br
columns:
  id_entity:
    lineage:
      - datalake_ebdb_clean.listing_business_context.id_house
      - datalake_ebdb_clean.listing_business_context.business_context
    description: Primary key of the listing entity, created by concatenating the house id and business context (CONCAT(id_house, '_', business_context)).
      This ensures uniqueness per business context (RENT/SALE) for the same house, allowing the same property to have separate listing entities for rental and sale contexts. 
  id_house:
    lineage:
      - datalake_ebdb_clean.listing_business_context.id_house
    description: Foreign key referencing the house entity being listed.
  id_contract:
    lineage:
      - core_contract.contract.id_contract
    description: Foreign key referencing the contract entity. Only populated for listings with business_context 'RENT', NULL for 'SALE' listings.
      The contract is selected as the most recent contract for the house (last contract by ts_created DESC).
  id_user:
    lineage:
      - datalake_ebdb_clean.house.id_user
      - datalake_ebdb_clean.user.id
    description: Foreign key referencing the property owner (user) associated with the listing.
  entity:
    description: Fixed value 'LISTING' indicating the type of entity.
  persona:
    description: Fixed value 'OWNER' indicating the persona role associated with this listing entity.
  business_context:
    lineage:
      - datalake_ebdb_clean.listing_business_context.business_context
    description: Business context categorizing the type of listing transaction.
    categories:
      RENT: The listing is configured for rental transactions, enabling rental-specific features and workflows.
      SALE: The listing is configured for sale transactions, enabling sale-specific features and workflows.
  properties:
    lineage:
      - datalake_ebdb_clean.listing_business_context.status
      - datalake_ebdb_clean.listing_business_context.status_reason
      - datalake_ebdb_clean.listing_business_context.ts_created
    description: |
      JSON structure containing listing properties including transformed status and creation timestamp (when), to reflect the API response.
      The status field undergoes transformation logic:
      - 'OPTED_OUT' without status_reason becomes 'EXCLUDED'
      - 'SUSPENDED' with status_reason 'RENTED' becomes 'CONTRACT_ONGOING'
      - 'SUSPENDED' with status_reason in ('ContractDraft', 'HouseReserved', 'PaidGuarantee', 'RENTAL_GUARANTEE', 'ProposalDocumentationApproved', 'ProposalDocumentationSentToCardiff', 'CCV_SIGNED') becomes 'ADVANCED_OFFER'
      - Otherwise, the original status is preserved
      Used to provide detailed contextual information about the current state of each listing entity.
  is_active:
    lineage:
      - datalake_ebdb_clean.listing_business_context.status
    description: Boolean flag indicating if the listing is currently active.
      Set to TRUE when status is 'PUBLISHED' or 'EDITING'.
      Set to FALSE when status is 'OPTED_OUT', 'UNPUBLISHED' or 'SUSPENDED'.
      Set to NULL for any other status values.
      Active listings are those that can still receive interactions and demand.
  ts_created:
    lineage:
      - datalake_ebdb_clean.listing_business_context.ts_created
    description: Timestamp when the listing record was created.
  ts_updated:
    lineage:
      - datalake_ebdb_clean.listing_business_context.ts_updated
    description: Timestamp when the listing record was last updated.

