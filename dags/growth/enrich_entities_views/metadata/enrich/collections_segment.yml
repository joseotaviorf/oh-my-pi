database_name: datalake_entities_views
table_name: collections_segment
description: |
  Enriched CDP entity view for collections segmentation (FR_COLLECTIONS_SEGMENT). Each row represents a
  Trato Feito customer_segment_distribution record for a customer document, joined to the latest non-deleted
  non-landlord trato_feito client for that document and to the priority contract via core_contract. Tracks
  whether the customer has a late fee discount offer, is in pre-evictions (STOCK_RISK), is in evictions, or
  has settled their debts. Feeds enrich_transactional_entities for AI initiatives such as Conv XP chatbots
  and Datazord.
domain: Fintech
owner: erick.alexandre@quintoandar.com.br
columns:
  id_entity:
    lineage:
      - datalake_trato_feito_clean.customer_segment_distribution.id_customer_segment_distribution
    description: Primary identifier of the collections segment entity; maps directly to id_customer_segment_distribution from the Trato Feito customer_segment_distribution table.
  id_house:
    lineage:
      - core_contract.contract.id_house
    description: House ID associated with the priority contract linked to this customer segment distribution, sourced from the core contract model.
  id_contract:
    lineage:
      - core_contract.contract.id_contract
    description: Priority contract ID for this customer segment distribution, sourced from the core contract model via join on customer_segment_distribution.id_priority_contract.
  id_user:
    lineage:
      - datalake_trato_feito_clean.client.id_external
      - datalake_ebdb_clean.user.cpf
      - datalake_ebdb_clean.user.id
    description: |
      Main EBDB user id for the segmented customer associated with this customer segment distribution.
      Resolved from the latest non-deleted, non-landlord trato_feito client matching customer_document_type
      and customer_document_value, using the first validated fallback in order: client.id_external (when it
      exists in ebdb.user), or ebdb.user.cpf matched by exact document hash equality with
      customer_document_value. Rows with null, empty, or unresolvable id_user are excluded. One row is
      generated per customer_segment_distribution record; multiple segmented customers on the same contract
      each get their own row with distinct id_entity and id_user.
  entity:
    description: Entity type. Always 'FR_COLLECTIONS_SEGMENT' for all rows in this view, indicating a rental collections segment entity.
  persona:
    description: Role of id_user in relation to this entity. Always 'TENANT', since collections segments are tracked per customer document on rental contracts.
    categories:
      TENANT: The tenant associated with the customer document in a Trato Feito collection segment.
  business_context:
    description: Business context of this entity. Always 'RENT' since collections segments apply to the rental business only.
  properties:
    lineage:
      - datalake_trato_feito_clean.customer_segment_distribution.is_active
      - datalake_trato_feito_clean.segment.name
      - datalake_trato_feito_clean.segment.is_active
      - datalake_trato_feito_clean.audience_negotiation_option.id_audience
      - datalake_trato_feito_clean.audience_negotiation_option.is_active
      - datalake_trato_feito_clean.negotiation_option.discount_on_fee_percent
      - datalake_trato_feito_clean.negotiation_option.discount_on_fine_percent
      - datalake_trato_feito_clean.customer_segment_distribution.ts_created
    description: |
      JSON structure containing collections segment properties: status and creation timestamp (when).
      status values: 'debts_settled' (customer document has no active customer_segment_distribution — customer left collections, is_active = FALSE),
      'is_on_evictions' (segment name = EVICTIONS and segment is active),
      'is_on_pre_evictions' (segment name in ACTIVE_STOCK_RISK_DEAL_LOW, ACTIVE_STOCK_RISK_DEAL_HIGH, ACTIVE_STOCK_RISK_NODEAL_LOW, ACTIVE_STOCK_RISK_NODEAL_HIGH and segment is active),
      'has_late_fee_discount' (audience has a negotiation option with 100% discount on fee and fine),
      'is_segmented' (fallback — CSD is active but no specific segment condition matched, is_active = TRUE).
      Structure: {"status": "<status_value>", "when": "<ts_created>"}
  is_active:
    lineage:
      - datalake_trato_feito_clean.customer_segment_distribution.is_active
      - datalake_trato_feito_clean.segment.name
      - datalake_trato_feito_clean.segment.is_active
      - datalake_trato_feito_clean.audience_negotiation_option.id_audience
    description: |
      Boolean flag indicating whether the collections segment entity is currently active.
      TRUE when the customer still has an active collections segmentation (status is not debts_settled).
      FALSE only for debts_settled, when the customer document has no active customer_segment_distribution record.
      Superseded inactive segment rows are excluded when the customer moved to another active segment.
  ts_created:
    lineage:
      - datalake_trato_feito_clean.customer_segment_distribution.ts_created
    description: Timestamp when the customer_segment_distribution record was created in the Trato Feito system.
  ts_updated:
    lineage:
      - datalake_trato_feito_clean.customer_segment_distribution.ts_updated
    description: Timestamp when the customer_segment_distribution record was last updated in the Trato Feito system.
