database_name: datalake_crawled_idactum_houses_clean
table_name: go_goiania_itbi_certidao
description: |
  Flattened Goiânia ITBI certificate records with municipal registration mapped toward
  the idactum_houses legacy contract.
domain: Growth
owner: gabriel.mota@quintoandar.com.br
columns:
  id_municipal_house:
    lineage:
      - datalake_crawled_idactum_houses_raw.go_goiania_itbi_certidao.response.registration_number
      - datalake_crawled_idactum_houses_raw.go_goiania_itbi_certidao.response.inscricao
    description: |
      Municipal property registration number from the ITBI certificate payload.
  state:
    description: |
      Brazilian state abbreviation for Goiânia properties (constant GO).
  city:
    description: |
      Municipality name for Goiânia properties (constant Goiânia).
  feed_source:
    lineage:
      - datalake_crawled_idactum_houses_raw.go_goiania_itbi_certidao.metadata.source
    description: |
      Spider source tag embedded in the crawl metadata payload.
  feed_url:
    lineage:
      - datalake_crawled_idactum_houses_raw.go_goiania_itbi_certidao.metadata.url
    description: |
      Source URL consulted by the crawler when producing this record.
  ts_accessed:
    lineage:
      - datalake_crawled_idactum_houses_raw.go_goiania_itbi_certidao.metadata.accessed_at
    description: |
      Timestamp when the crawler accessed the municipal portal page or API.
  referer_url:
    lineage:
      - datalake_crawled_idactum_houses_raw.go_goiania_itbi_certidao.metadata.referer_url
    description: |
      HTTP referer URL captured during the crawl session, when available.
  crawler_name:
    lineage:
      - datalake_crawled_idactum_houses_raw.go_goiania_itbi_certidao.crawler_name
    description: |
      Scrapy spider name that produced the raw record.
  dt_load:
    lineage:
      - datalake_crawled_idactum_houses_raw.go_goiania_itbi_certidao.dt_load
    description: |
      Date when the raw JSONL batch was loaded into the datalake.
  year:
    lineage:
      - datalake_crawled_idactum_houses_raw.go_goiania_itbi_certidao.year
    description: |
      Partition year derived from the DAG execution date of the Scrapy feed.
  month:
    lineage:
      - datalake_crawled_idactum_houses_raw.go_goiania_itbi_certidao.month
    description: |
      Partition month derived from the DAG execution date of the Scrapy feed.
  day:
    lineage:
      - datalake_crawled_idactum_houses_raw.go_goiania_itbi_certidao.day
    description: |
      Partition day derived from the DAG execution date of the Scrapy feed.
