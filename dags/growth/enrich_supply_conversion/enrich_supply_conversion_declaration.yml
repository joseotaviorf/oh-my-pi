---
dag:
  name: enrich_supply_conversion
  schedule_start_date: 2019, 1, 1
  owner: Data Growth
  documentation: 
    dag_purpose: |
      This DAG is responsible for create tables with enriched data from supply conversion steps. The context is tracking conversion of supply and transform data from qualified to first_listing steps.
workflow:
  type: query_delta
  layer: enrich
  custom_schema: supply_flows_migrate
  default_partitions: ["year", "month", "day"]
  default_extraction_type: full
  inner_dependencies:
    conversion_staging:
      - prospects_events
    last_pj_attribution:
      - conversion_staging
    conversion_original_events:
      - conversion_staging
    conversion_events:
      - conversion_original_events
    manual_reprocessing_events:
      - conversion_events
      - conversion_staging
  spark_session_configs:
    udfs: [SF_NORMALIZE_STRING]
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, macros.ds_add(ds, -6), 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, ds, 'load_end_date') }}"
cluster:
  type: databricks_12_2_med_memory_photon_cluster