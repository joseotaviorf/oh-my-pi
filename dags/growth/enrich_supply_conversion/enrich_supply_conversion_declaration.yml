dag:
  name: enrich_supply_conversion
  schedule_start_date: 2019, 1, 1
  owner: Data Growth
  documentation:
    dag_purpose: |
      This DAG is responsible for create tables with enriched data from supply conversion steps. The context is tracking conversion of supply and transform data from qualified to first_listing steps.
workflow:
  type: query_delta
  layer: enrich
  custom_schema: supply_flows
  default_extraction_type: full
  tables_customization:
    prospects_events:
      z_order_by: ["id_entity", "business_context"]
    conversion_staging:
      z_order_by: ["id_entity", "business_context"]
    conversion_attributed_events:
      z_order_by: ["id_entity", "business_context"]
    conversion_events:
      z_order_by: ["id_entity", "business_context"]
    manual_reprocessing_events:
      z_order_by: ["id_entity", "business_context"]
    conversion_events_3p:
      z_order_by: ["id_house", "business_context"]
    operations_agents:
      z_order_by: ["id_user"]
  inner_dependencies:
    conversion_staging:
    - prospects_events
    last_pj_attribution:
    - conversion_staging
    - operations_agents
    conversion_attributed_events:
    - conversion_staging
    - conversion_events_3p
    conversion_events:
    - conversion_attributed_events
    manual_reprocessing_events:
    - conversion_events
    - conversion_staging
  spark_session_configs:
    udfs: [SF_NORMALIZE_STRING]
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, macros.ds_add(ds, -6), 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, ds, 'load_end_date') }}"
cluster:
  type: databricks_12_2_med_4xlarge_general_photon_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
