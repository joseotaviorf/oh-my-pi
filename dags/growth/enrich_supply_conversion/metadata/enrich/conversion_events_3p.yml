database_name: datalake_supply_flows
table_name: qualified_3p
domain: Growth
owner: arthur.gonzaga@quintoandar.com.br
description: This table is reposnsible for join qualified, available qualified and opportunity events for 3p leads. |
  Listing events will be modeled by conversion_events table (1P).
columns:
  sk_supply_lead:
    description: A surrogate key uniquely identifying each record in the supply context table.
    lineage: 
      - datalake_supply_flows.leads_sks.sk_supply_lead
  business_context:
    description: Describes the context or situation in which the lead was generated, such as marketing campaign, sales outreach, etc.
    lineage: 
      - datalake_supply_flows.landing_3p.business_context
  id_lead:
    description: A unique identifier for each lead.
    lineage: 
      - datalake_supply_flows.landing_3p.id_lead_3p
  id_region:
    description: Identifier indicating the region associated with the lead.
    lineage: 
      - datalake_supply_flows.landing_3p.id_region
  id_house:
    description: Identifier for the house associated with the lead.
    lineage: 
      - datalake_supply_flows.landing_3p.id_house
  id_lead_ebdb:
    description: Unique identifier for the lead in the EBDB if exists. Here, its always -1.
  id_referred_by:
    description: Identifier indicating the lead was referred by another entity. Its always -1.
  business_event:
    description: Specifies the type of business event associated with the lead, such as inquiry, purchase, partnership, etc.
  funnel_level:
    description: Specifies the level or depth of the lead within the supply funnel.
  supply_source:
    description: Indicates the source from which the lead was obtained, such as 1P, 3P or CIQ
    lineage: 
      - datalake_supply_flows.leads_sks.sk_supply_lead
  drop_step_reason:
    description: Provides the reason for dropping the lead from a particular step in the funnel.
    lineage: 
      - datalake_supply_flows.landing_3p.reason
  aux_product_status:
    description: Additional information on the status of the service (Supply Processor).
    lineage: 
      - datalake_supply_flows.landing_3p.status
  aux_hash:
    description: Hash value generated for auxiliary purposes such as data integrity.
    lineage: 
      - datalake_supply_flows.landing_3p.status
  weight:
    description: A numerical value assigned to the lead indicating its relative step of funnel.
  ts_event:
    description: Timestamp indicating the time of the business event associated with the lead.
    lineage: 
      - datalake_supply_flows.landing_3p.ts_event
  ts_load:
    description: Timestamp indicating the time the record was loaded into the table.
  year:
    description: Year of the event.
    lineage: 
      - datalake_supply_flows.landing_3p.ts_event
  month:
    description: Month of the event.  
    lineage: 
      - datalake_supply_flows.landing_3p.ts_event
  day:
    description: Day of the event.
    lineage: 
      - datalake_supply_flows.landing_3p.ts_event

