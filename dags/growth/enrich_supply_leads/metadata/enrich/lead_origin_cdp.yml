database_name: datalake_supply_flows
table_name: lead_origin_cdp
domain: Growth
owner: henrique.paulo@quintoandar.com.br
description: Enriched lead attribution table with one row per lead. UTM columns (campaign, medium, source, term, content) are resolved via a COALESCE chain online_attribution (CDI tracking layer) first, then Amplitude, then Facebook API via inbound leads. Provides multi-source attribution context for supply leads along with ops metadata and tracking database provenance columns.
columns:
  id_lead:
    description: The unique identifier for each lead in the dataset.
    lineage:
      - datalake_rene_descartes_clean.house_lead.id
  id_lead_ebdb:
    description: The lead's identifier in the EBDB/Monolith.
    lineage:
      - datalake_rene_descartes_clean.house_lead.id_lead_ebdb
  id_source_ctwa:
    description: The Id for the campaign related to the click to whatsapp identifier.
    lineage:
      - datalake_supply_flows.inbound_attribution.id_source_ctwa
  affiliate_type:
    description: The type of affiliate associated with the lead's acquisition campaign.
    lineage:
      - datalake_rene_descartes_clean.acquisition_misc_data.acquisition_campaign
  campaign:
    description: UTM campaign value resolved via COALESCE(online_attribution, amplitude, facebook_api). Identifies the marketing campaign that generated the lead.
    lineage:
      - datalake_attribution.online_attribution.utm_campaign
      - datalake_amplitude_lead.lead_origin.utm_campaign
      - datalake_growth_media_platform.facebook_metrics.utm_campaign
  medium:
    description: UTM medium value resolved via COALESCE(online_attribution, amplitude, inbound_leads). For WhatsApp inbound leads the value is the literal 'whatsapp'.
    lineage:
      - datalake_attribution.online_attribution.utm_medium
      - datalake_amplitude_lead.lead_origin.utm_medium
  source:
    description: UTM source value resolved via COALESCE(online_attribution, amplitude, facebook_api). For Facebook inbound leads the value is mapped from facebook_metrics.origin.
    lineage:
      - datalake_attribution.online_attribution.utm_source
      - datalake_amplitude_lead.lead_origin.utm_source
      - datalake_growth_media_platform.facebook_metrics.origin
  term:
    description: UTM term value resolved via COALESCE(online_attribution, amplitude, facebook_api). Typically identifies the paid keyword associated with the lead.
    lineage:
      - datalake_attribution.online_attribution.utm_term
      - datalake_amplitude_lead.lead_origin.utm_term
      - datalake_growth_media_platform.facebook_metrics.utm_term
  content:
    description: UTM content value resolved via COALESCE(online_attribution, amplitude, facebook_api). Used to differentiate ads or links pointing to the same URL.
    lineage:
      - datalake_attribution.online_attribution.utm_content
      - datalake_amplitude_lead.lead_origin.utm_content
      - datalake_growth_media_platform.facebook_metrics.utm_content
  ops_agent:
    description: The operational agent responsible for handling the lead.
    lineage:
      - datalake_rene_descartes_clean.acquisition_misc_data.acquisition_campaign
  ops_objective:
    description: The objective of the operational agent, derived from ops_agent value.
    lineage:
      - datalake_rene_descartes_clean.acquisition_misc_data.acquisition_campaign
  ops_partner:
    description: The operational partner associated with the lead.
    lineage:
      - datalake_rene_descartes_clean.acquisition_misc_data.acquisition_campaign
  application:
    description: The origin or application from which the lead originated.
    lineage:
      - datalake_rene_descartes_clean.acquisition_misc_data.acquisition_campaign
  city:
    description: The city associated with the lead's acquisition.
    lineage:
      - datalake_rene_descartes_clean.acquisition_misc_data.acquisition_campaign
      - datalake_amplitude_lead.lead_origin.city
  landing_page:
    description: The landing page URL where the lead first arrived.
    lineage:
      - datalake_rene_descartes_clean.acquisition_misc_data.acquisition_campaign
  reprocessed:
    description: Indicates if the lead was automatically reprocessed from an original lead.
    lineage:
      - datalake_rene_descartes_clean.acquisition_misc_data.acquisition_campaign
  ops_approach:
    description: The approach used by operational teams to engage with the lead.
    lineage:
      - datalake_rene_descartes_clean.acquisition_misc_data.acquisition_campaign
  ops_contact_medium:
    description: The medium through which operational teams contacted the lead.
    lineage:
      - datalake_rene_descartes_clean.acquisition_misc_data.acquisition_campaign
  platform:
    description: The platform where the lead was acquired.
    lineage:
      - datalake_rene_descartes_clean.acquisition_misc_data.acquisition_campaign
      - datalake_amplitude_lead.lead_origin.platform
  lead_type:
    description: The type of lead.
    lineage:
      - datalake_rene_descartes_clean.acquisition_misc_data.acquisition_campaign
  detailed_route:
    description: The concatenation of the path a lead used to reach the landing page where the creation process was triggered in the Product, and the associated experiment (A/B test) the lead was allocated to, if applicable.
    lineage:
      - datalake_rene_descartes_clean.acquisition_misc_data.acquisition_campaign
  gclid:
    description: The google click identifier of the lead.
    lineage:
      - datalake_rene_descartes_clean.acquisition_misc_data.acquisition_campaign
  fbclid:
    description: The facebook click identifier of the lead.
    lineage:
      - datalake_rene_descartes_clean.acquisition_misc_data.acquisition_campaign
  ctwa_clid:
    description: The whatsapp click identifier of the lead.
    lineage:
      - datalake_supply_flows.inbound_attribution.ctwa_clid
  id_task:
    description: The ID for the lead creation task.
    lineage:
      - datalake_supply_flows.inbound_attribution.id_task
  id_chat_session:
    description: The ID for the chat session in Sauron.
    lineage:
      - datalake_supply_flows.inbound_attribution.id_session
  id_ai_core_session:
    description: The ID for the chat in the Orchestrator/Copilot.
    lineage:
      - datalake_rene_descartes_clean.acquisition_misc_data.acquisition_campaign
  quinto_andar_phone_number:
    description: The QuintoAndar phone number the client used to get in touch and have their lead created.
    lineage:
      - datalake_supply_flows.inbound_attribution.quinto_andar_phone_number
  url_source_ctwa:
    description: The url for the campaign related to the click to whatsapp identifier.
    lineage:
      - datalake_supply_flows.inbound_attribution.url_source_ctwa
  type_source_ctwa:
    description: The type of the campaign related to the click to whatsapp identifier.
    lineage:
      - datalake_supply_flows.inbound_attribution.type_source_ctwa
  original_lead:
    description: The identifier of the original lead if the current lead is a result of reprocessing process.
    lineage:
      - datalake_rene_descartes_clean.acquisition_misc_data.acquisition_campaign
  database_tracking_campaign:
    description: Provenance label for the campaign UTM value. Possible values are cdp (online_attribution), amplitude, facebook_api, or lost_tracking.
    lineage:
      - datalake_attribution.online_attribution.utm_campaign
      - datalake_amplitude_lead.lead_origin.utm_campaign
      - datalake_growth_media_platform.facebook_metrics.utm_campaign
  database_tracking_medium:
    description: Provenance label for the medium UTM value. Possible values are cdp (online_attribution), amplitude, facebook_api, or lost_tracking.
    lineage:
      - datalake_attribution.online_attribution.utm_medium
      - datalake_amplitude_lead.lead_origin.utm_medium
  database_tracking_source:
    description: Provenance label for the source UTM value. Possible values are cdp (online_attribution), amplitude, facebook_api, or lost_tracking.
    lineage:
      - datalake_attribution.online_attribution.utm_source
      - datalake_amplitude_lead.lead_origin.utm_source
      - datalake_growth_media_platform.facebook_metrics.origin
  database_tracking_content:
    description: Provenance label for the content UTM value. Possible values are cdp (online_attribution), amplitude, facebook_api, or lost_tracking.
    lineage:
      - datalake_attribution.online_attribution.utm_content
      - datalake_amplitude_lead.lead_origin.utm_content
      - datalake_growth_media_platform.facebook_metrics.utm_content
  database_tracking_term:
    description: Provenance label for the term UTM value. Possible values are cdp (online_attribution), amplitude, facebook_api, or lost_tracking.
    lineage:
      - datalake_attribution.online_attribution.utm_term
      - datalake_amplitude_lead.lead_origin.utm_term
      - datalake_growth_media_platform.facebook_metrics.utm_term
  database_tracking_ctwa:
    description: The source responsible for the ctwa information. Values are rene_descartes, sauron or lost_tracking.
    lineage:
      - datalake_rene_descartes_clean.acquisition_misc_data.acquisition_campaign
      - datalake_supply_flows.inbound_attribution.ctwa_clid
  ts_event:
    description: The timestamp of the lead creation event. Resolved via COALESCE(rene_descartes ts_created, amplitude ts_event).
    lineage:
      - datalake_rene_descartes_clean.acquisition_misc_data.ts_created
      - datalake_amplitude_lead.lead_origin.ts_event
  ts_load:
    description: The timestamp of the data load.
