database_name: datalake_supply_flows
table_name: lead_origin
domain: Growth
owner: henrique.paulo@quintoandar.com.br
description: This table contains acquisition data extracted from the René Descartes and Amplitude service that will be used to track our leads in the supply domain.
columns:
  id_lead:
    description: The unique identifier for each lead in the dataset.
    lineage: 
      - datalake_rene_descartes_clean.house_lead.id
      - datalake_amplitude_lead.lead_origin.formfield_lead_uuid
      - datalake_amplitude_lead.lead_origin.id_firestore
  id_lead_ebdb:
    description: The lead's identifier in the EBDB/Monolith.
    lineage: 
      - datalake_rene_descartes_clean.house_lead.id_lead_ebdb
  id_firestore:
    description: The lead's identifier in the Firestore database.
    lineage: 
      - datalake_rene_descartes_clean.house_lead.id_external_reference
  id_source_ctwa:
    description: The Id for the campaign related to the click to whatsapp identifier.
    lineage:
      - datalake_customer_support.chats.id_source_ctwa
  affiliate_type:
    description: The type of affiliate associated with the lead's acquisition campaign.
    lineage: 
      - datalake_rene_descartes_clean.acquisition_misc_data.acquisition_campaign
  campaign:
    description: The campaign of the lead, referring to utm_campaign where the lead originated.
    lineage: 
      - datalake_rene_descartes_clean.acquisition_misc_data.acquisition_campaign
      - datalake_amplitude_lead.lead_origin.utm_campaign
      - datalake_growth_media_platform.facebook_metrics.utm_campaign
  medium:
    description: The medium of the lead, referring to utm_medium where the lead originated.
    lineage: 
      - datalake_rene_descartes_clean.acquisition_misc_data.acquisition_campaign
      - datalake_amplitude_lead.lead_origin.utm_medium
      - datalake_growth_media_platform.facebook_metrics.utm_medium
  source:
    description: The source of the lead, referring to utm_source where the lead originated.
    lineage: 
      - datalake_rene_descartes_clean.acquisition_misc_data.acquisition_campaign
      - datalake_amplitude_lead.lead_origin.utm_source
      - datalake_growth_media_platform.facebook_metrics.utm_source
  term:
    description: The medium of the lead, referring to utm_medium where the lead originated.
    lineage: 
      - datalake_rene_descartes_clean.acquisition_misc_data.acquisition_campaign
      - datalake_amplitude_lead.lead_origin.utm_term
      - datalake_growth_media_platform.facebook_metrics.utm_term
  content:
    description: The medium of the lead, referring to utm_medium where the lead originated.
    lineage: 
      - datalake_rene_descartes_clean.acquisition_misc_data.acquisition_campaign
      - datalake_amplitude_lead.lead_origin.utm_content
      - datalake_growth_media_platform.facebook_metrics.utm_content
  ops_agent:
    description: The operational agent responsible for handling the lead.
    lineage: 
      - datalake_rene_descartes_clean.acquisition_misc_data.acquisition_campaign
  ops_partner:
    description: The operational partner associated with the lead.
    lineage: 
      - datalake_rene_descartes_clean.acquisition_misc_data.acquisition_campaign
  application:
    description: The origin or application from which the lead originated.
    lineage: 
      - datalake_rene_descartes_clean.acquisition_misc_data.acquisition_campaign
  city:
    description: The city associated with the lead's acquisition.
    lineage: 
      - datalake_rene_descartes_clean.acquisition_misc_data.acquisition_campaign
      - datalake_amplitude_lead.lead_origin.city
  landing_page:
    description: The landing page URL where the lead first arrived.
    lineage: 
      - datalake_rene_descartes_clean.acquisition_misc_data.acquisition_campaign
  ops_approach:
    description: The approach used by operational teams to engage with the lead.
    lineage: 
      - datalake_rene_descartes_clean.acquisition_misc_data.acquisition_campaign
  ops_contact_medium:
    description: The medium through which operational teams contacted the lead.
    lineage: 
      - datalake_rene_descartes_clean.acquisition_misc_data.acquisition_campaign
  platform:
    description: The platform where the lead was acquired.
    lineage: 
      - datalake_rene_descartes_clean.acquisition_misc_data.acquisition_campaign
      - datalake_amplitude_lead.lead_origin.platform
  lead_type:
    description: The type of lead
    lineage: 
      - datalake_rene_descartes_clean.acquisition_misc_data.acquisition_campaign
  detailed_route:
    description: The concatenation of the path a lead used to reach the landing page where the creation process was triggered in the Product, and the associated experiment (A/B test) the lead was allocated to, if applicable. This can also be found in Amplitude events through the from_route and exp event properties. The hyphen (-) character separates both parameters.
    lineage: 
      - datalake_rene_descartes_clean.acquisition_misc_data.acquisition_campaign
  gclid:
    description: The google click identifier of the the lead.
    lineage:
      - datalake_rene_descartes_clean.acquisition_misc_data.acquisition_campaign
  fbclid:
    description: The facebook click identifier of the the lead.
    lineage:
      - dataleka_rene_descartes_clean.acquisition_misc_data.acquisition_campaign
  ctwa_clid:
    description: The whatsapp click identifier of the the lead.
    lineage:
      - dataleka_rene_descartes_clean.acquisition_misc_data.acquisition_campaign
  id_task: 
    description: The ID for the lead creation task.
    lineage:
      - datalake_rene_descartes_clean.acquisition_misc_data.acquisition_campaign
  id_chat_session: 
    description: The ID for the chat session in Sauron.
    lineage:
      - datalake_sauron_clean.session.id
  id_ai_core_session: 
    description: The ID for the chat in the Orchestrator/Copilot.
    lineage:
      - datalake_rene_descartes_clean.acquisition_misc_data.acquisition_campaign
  quinto_andar_phone_number:
    description: The QuintoAndar phone number the client used to get in touch and have their lead created.
    lineage:
      - datalake_customer_support.chats
      - datalake_customer_support.calls
  url_source_ctwa:
    description: The url for the campaign related to the click to whatsapp identifier.
    lineage:
      - datalake_customer_support.chats.url_source_ctwa
  type_source_ctwa:
    description: The type of the campaign related to the click to whatsapp identifier.
    lineage:
      - datalake_customer_support.chats.type_source_ctwa
  original_lead:
    description: The identifier of the original lead if the current lead is a result of reprocessing process.
    lineage: 
      - datalake_rene_descartes_clean.acquisition_misc_data.acquisition_campaign
  ts_event:
    description: The timestamp of the lead creation event.
    lineage: 
      - datalake_rene_descartes_clean.acquisition_misc_data.ts_created
  ts_load:
    description: The timestamp of the data load.
  database_tracking_ctwa:
    description: The source responsible for the ctwa information.
    lineage: 
    - dataleka_rene_descartes_clean.acquisition_misc_data.acquisition_campaign
    - datalake_sauron_clean.session.metadata