dag:
  name: enrich_supply_leads
  schedule_start_date: 2019, 1, 1
  owner: Data Growth
  documentation:
    dag_purpose: This DAG is responsible for generate SKs and recovery region of leads.
workflow:
  type: query_delta
  layer: enrich
  custom_schema: supply_flows
  default_extraction_type: incremental
  tables_customization:
    leads_sks:
      merge_on: ["id_lead", "source"]
      z_order_by: ["id_lead", "source"]
    recovered_region_leads:
      merge_on: ["id_lead"]
      z_order_by: ["id_lead"]
    lead_origin:
      merge_on: ["id_lead"]
      z_order_by: ["id_lead"]
    inbound_attribution:
      merge_on: ["id_lead_ebdb"]
      z_order_by: ["id_lead_ebdb"]
    lead_origin_cdp:
      merge_on: ["id_lead"]
      z_order_by: ["id_lead"]
  inner_dependencies:
    lead_origin:
      - inbound_attribution
    lead_origin_cdp:
      - inbound_attribution
  spark_session_configs:
    udfs: [SF_NORMALIZE_STRING]
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, -6), 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
