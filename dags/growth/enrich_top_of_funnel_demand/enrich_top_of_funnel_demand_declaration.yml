dag:
  name: enrich_top_of_funnel_demand
  schedule_start_date: 2019, 1, 1
  owner: Data Growth
  documentation:
    dag_purpose: As a derivation of Amplitude enrich layer, this DAG generates tables to track demand user behaviors in the top of the funnel.
workflow:
  type: query_delta
  layer: enrich
  inner_dependencies:
    first_user_interaction_staging:
      - user_interactions
    first_user_interaction:
      - first_user_interaction_staging
  default_extraction_type: incremental
  default_partitions:
    - year
    - month
    - day
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_end | ds, -1), 'load_end_date') }}"
