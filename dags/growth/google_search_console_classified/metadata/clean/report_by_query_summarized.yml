---
database_name: datalake_google_search_console_classified_clean
table_name: report_by_query_summarized
owner: henrique.paulo@quintoandar.com.br
domain: Growth
description: |
  Daily cleaned Google Search Console query-level metrics with summarized query dimension for Latin American classified portals.
  Aggregates performance at query grain without page breakdown.
columns:
  site_url:
    description: Main URL that are being queried.
    lineage:
      - datalake_google_search_console_classified_raw.report_by_query_summarized.site_url
  type:
    description: GSC search appearance type for the extracted report dimension (e.g. web, discover, googleNews).
    lineage:
      - datalake_google_search_console_classified_raw.report_by_query_summarized.type
  query:
    description: search words performed on Google.
    lineage:
      - datalake_google_search_console_classified_raw.report_by_query_summarized.keys
  clicks:
    description: Times it was clicked on SERP page organically
    lineage:
      - datalake_google_search_console_classified_raw.report_by_query_summarized.clicks
  impressions:
    description: Times it was showed on SERP page
    lineage:
      - datalake_google_search_console_classified_raw.report_by_query_summarized.impressions
  ctr:
    description: Click Through Rate - times it was clicked over times it was showed
    lineage:
      - datalake_google_search_console_classified_raw.report_by_query_summarized.ctr
  position:
    description: Relative ranking of the position of the link on Google.
    lineage:
      - datalake_google_search_console_classified_raw.report_by_query_summarized.position
  posimp:
    description: Position multiplied by the impressions.
    lineage:
      - datalake_google_search_console_classified_raw.report_by_query_summarized.position
      - datalake_google_search_console_classified_raw.report_by_query_summarized.impressions
  dt_created:
    description: Extraction date.
    lineage:
      - datalake_google_search_console_classified_raw.report_by_query_summarized.date
  year:
    description: Calendar year of the monthly GSC reference date; Hive partition for SEO keyword reporting.
    lineage:
      - datalake_google_search_console_classified_raw.report_by_query_summarized.date
  month:
    description: Calendar month of the monthly GSC reference date; Hive partition for SEO keyword reporting.
    lineage:
      - datalake_google_search_console_classified_raw.report_by_query_summarized.date
  day:
    description: Calendar day (first day of month) for monthly GSC keyword aggregations.
    lineage:
      - datalake_google_search_console_classified_raw.report_by_query_summarized.date
