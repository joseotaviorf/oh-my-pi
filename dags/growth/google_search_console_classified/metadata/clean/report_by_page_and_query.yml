---
database_name: datalake_google_search_console_classified_clean
table_name: report_by_page_and_query
owner: henrique.paulo@quintoandar.com.br
domain: Growth
description: |
  Daily cleaned Google Search Console performance at page-and-query grain for Latin American classified portals.
  Most granular standard export: each row is a query, landing page, device, and country combination.
columns:
  site_url:
    description: Main URL that are being queried.
    lineage:
      - datalake_google_search_console_classified_raw.report_by_page_and_query.site_url
  type:
    description: GSC search appearance type for the extracted report dimension (e.g. web, discover, googleNews).
    lineage:
      - datalake_google_search_console_classified_raw.report_by_page_and_query.type
  page:
    description: Full page address.
    lineage:
      - datalake_google_search_console_classified_raw.report_by_page_and_query.keys
  query:
    description: search words performed on Google.
    lineage:
      - datalake_google_search_console_classified_raw.report_by_page_and_query.keys
  country:
    description: country where the search was made.
    lineage:
      - datalake_google_search_console_classified_raw.report_by_page_and_query.keys
  device:
    description: device type where the search was made.
    categories:
      DESKTOP: desktop
      MOBILE: mobile
    lineage:
      - datalake_google_search_console_classified_raw.report_by_page_and_query.keys
  clicks:
    description: Times it was clicked on SERP page organically
    lineage:
      - datalake_google_search_console_classified_raw.report_by_page_and_query.clicks
  impressions:
    description: Times it was showed on SERP page
    lineage:
      - datalake_google_search_console_classified_raw.report_by_page_and_query.impressions
  ctr:
    description: Click Through Rate - times it was clicked over times it was showed
    lineage:
      - datalake_google_search_console_classified_raw.report_by_page_and_query.ctr
  position:
    description: Relative ranking of the position of the link on Google.
    lineage:
      - datalake_google_search_console_classified_raw.report_by_page_and_query.position
  posimp:
    description: Position multiplied by the impressions.
    lineage:
      - datalake_google_search_console_classified_raw.report_by_page_and_query.position
      - datalake_google_search_console_classified_raw.report_by_page_and_query.impressions
  dt_created:
    description: Extraction date.
    lineage:
      - datalake_google_search_console_classified_raw.report_by_page_and_query.date
  year:
    description: Calendar year of the monthly GSC reference date; Hive partition for SEO keyword reporting.
    lineage:
      - datalake_google_search_console_classified_raw.report_by_page_and_query.date
  month:
    description: Calendar month of the monthly GSC reference date; Hive partition for SEO keyword reporting.
    lineage:
      - datalake_google_search_console_classified_raw.report_by_page_and_query.date
  day:
    description: Calendar day (first day of month) for monthly GSC keyword aggregations.
    lineage:
      - datalake_google_search_console_classified_raw.report_by_page_and_query.date
