cluster:
  type: consolidation_xs_memory_cluster
  databricks_conn_id: databricks_new
  custom_libraries:
  - pypi:
      package: lightgbm>=3.3.1
  - pypi:
      package: scikit-learn>=0.24.0
  custom_configurations:
    aws_attributes:
      ebs_volume_size: 200
    spark_version: 12.2.x-scala2.12
    runtime_engine: PHOTON
    num_workers: 3
