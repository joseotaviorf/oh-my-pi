cluster:
  type: databricks_12_2_med_general_photon_cluster
  custom_libraries:
    - pypi:
        package: lightgbm>=3.3.1
    - pypi:
        package: scikit-learn>=0.24.0
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
validation:
  cluster:
    type: consolidation_s_general_cluster
    databricks_conn_id: databricks_new
    custom_libraries:
    - pypi:
        package: lightgbm>=3.3.1
    - pypi:
        package: scikit-learn>=0.24.0
    custom_configurations:
      spark_version: 12.2.x-scala2.12
      num_workers: 3
      node_type_id: m6gd.xlarge
      driver_node_type_id: m6gd.xlarge
      runtime_engine: PHOTON
      aws_attributes:
        ebs_volume_size: 200
  allow_custom_spark_job: true
