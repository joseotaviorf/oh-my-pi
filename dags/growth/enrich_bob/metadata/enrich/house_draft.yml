database_name: datalake_bob
table_name: house_draft
description: This table contains house draft information saved during the process of registering a house by a PP or IS teams.
domain: Growth
owner: gabriel.salla@quintoandar.com
columns:
  id:
    description: Identifier for house draft
    lineage:
      - datalake_bob_clean.house_draft.id
  id_client_side:
    description: Identifier for client side
    lineage:
      - datalake_bob_clean.house_draft.id_client_side
  id_original_lead:
    description: Identifier for original lead
    lineage:
      - datalake_bob_clean.house_draft.id_original_lead
  id_main_administrator:
    description: Identifier for main administrator
    lineage:
      - datalake_bob_clean.house_draft.administrators
  id_main_owner:
    description: Identifier for main owner
    lineage:
      - datalake_bob_clean.house_draft.owners
  registrar:
    description: JSON struct with the EBDB user who started the house draft registration in Bob.
    lineage:
      - datalake_bob_clean.house_draft.registrar
  owners_informations:
    description: Raw JSON payload listing property owners and contact details captured during draft submission.
    lineage:
      - datalake_bob_clean.house_draft.owners
  house_access_informations:
    description: Raw JSON payload describing how photographers and agents can access the property.
    lineage:
      - datalake_bob_clean.house_draft.access
  administrators_informations:
    description: Raw JSON payload listing building administrators and their contact details.
    lineage:
      - datalake_bob_clean.house_draft.administrators
  main_administrator_name:
    description: Main administrator's name
    lineage:
      - datalake_bob_clean.house_draft.administrators
  main_administrator_email:
    description: Main administrator's email
    lineage:
      - datalake_bob_clean.house_draft.administrators
  main_administrator_phone_number:
    description: Main administrator's phone number
    lineage:
      - datalake_bob_clean.house_draft.administrators
  main_owner_name:
    description: Full name of the primary property owner extracted from the owners JSON list.
    lineage:
      - datalake_bob_clean.house_draft.owners
  main_owner_email:
    description: Email address of the primary property owner extracted from the owners JSON list.
    lineage:
      - datalake_bob_clean.house_draft.owners
  main_owner_phone_number:
    description: Main owner's phone number
    lineage:
      - datalake_bob_clean.house_draft.owners
  house_appliances:
    description: JSON list of appliances present in the property as reported in the draft form.
    lineage:
      - datalake_bob_clean.house_draft.details
  house_description:
    description: Free-text property description entered by the owner during the Bob draft flow.
    lineage:
      - datalake_bob_clean.house_draft.details
  front_door_type:
    description: Entry access method for the property, such as keys, lockbox, or doorman.
    lineage:
      - datalake_bob_clean.house_draft.details
  installations:
    description: JSON list of built-in installations reported in the draft, such as air conditioning.
    lineage:
      - datalake_bob_clean.house_draft.details
  acessibility_items:
    description: Accessibility items in the house
    lineage:
      - datalake_bob_clean.house_draft.details
  days_to_vacate:
    description: Number of days to vacate the house
    lineage:
      - datalake_bob_clean.house_draft.details
  availability_type:
    description: Vacancy classification selected for the property move-out timeline.
    lineage:
      - datalake_bob_clean.house_draft.details
  awaiting_availability_reason:
    description: Standard reason code when the property is not yet available for visits.
    lineage:
      - datalake_bob_clean.house_draft.details
  awaiting_availability_custom_reason:
    description: Free-text explanation when the owner selects a custom availability reason.
    lineage:
      - datalake_bob_clean.house_draft.details
  rent_price:
    description: Monthly rent amount proposed by the owner in the draft pricing section.
    lineage:
      - datalake_bob_clean.house_draft.pricing
  sale_price:
    description: Asking sale price proposed by the owner in the draft pricing section.
    lineage:
      - datalake_bob_clean.house_draft.pricing
  condo_price:
    description: Monthly condominium fee amount reported in the draft pricing section.
    lineage:
      - datalake_bob_clean.house_draft.pricing
  iptu_installment_informations:
    description: Information about IPTU installments
    lineage:
      - datalake_bob_clean.house_draft.pricing
  custom_administration_fee:
    description: Optional administration fee percentage negotiated outside standard QuintoAndar rates.
    lineage:
      - datalake_bob_clean.house_draft.pricing
  special_conditions:
    description: Special conditions related to pricing
    lineage:
      - datalake_bob_clean.house_draft.pricing
  suites:
    description: Number of suites in the house
    lineage:
      - datalake_bob_clean.house_draft.blueprint
  garages:
    description: Number of garages in the house
    lineage:
      - datalake_bob_clean.house_draft.blueprint
  garages_description:
    description: Free-text details about parking spots when the owner provides extra garage context.
    lineage:
      - datalake_bob_clean.house_draft.blueprint
  bedrooms:
    description: Number of bedrooms in the house
    lineage:
      - datalake_bob_clean.house_draft.blueprint
  bathrooms:
    description: Number of bathrooms in the house
    lineage:
      - datalake_bob_clean.house_draft.blueprint
  house_type:
    description: Property category in the blueprint section, such as apartment, house, or studio.
    lineage:
      - datalake_bob_clean.house_draft.blueprint
  total_area:
    description: Total usable area of the property in square meters from the draft blueprint.
    lineage:
      - datalake_bob_clean.house_draft.blueprint
  business_context_type:
    description: Raw list of listing intents selected for the draft, such as RENT or SALE.
    lineage:
      - datalake_bob_clean.house_draft.business_context
  is_for_sale:
    description: Whether the house is for sale
    lineage:
      - datalake_bob_clean.house_draft.business_context
  is_for_rent:
    description: Whether the house is for rent
    lineage:
      - datalake_bob_clean.house_draft.business_context
  status:
    description: Current status of the house
    lineage:
      - datalake_bob_clean.house_draft.status
  type:
    description: Bob draft workflow type indicating how the listing was initiated, such as CIQ or portfolio manager.
    lineage:
      - datalake_bob_clean.house_draft.type
  is_furnished:
    description: Whether the house is furnished
    lineage:
      - datalake_bob_clean.house_draft.details
  is_penthouse:
    description: Whether the house is a penthouse
    lineage:
      - datalake_bob_clean.house_draft.details
  is_pet_friendly:
    description: Whether the house is pet friendly
    lineage:
      - datalake_bob_clean.house_draft.details
  has_condo:
    description: Indicates whether the house has a condominium fee
    lineage:
      - datalake_bob_clean.house_draft.pricing
  has_iptu_not_paid:
    description: Indicates whether the house has unpaid IPTU
    lineage:
      - datalake_bob_clean.house_draft.pricing
  is_accepting_instant_offer:
    description: Indicates whether the house is accepting instant offers
    lineage:
      - datalake_bob_clean.house_draft.pricing
  ops_team:
    description: Operations team responsible for the house
    lineage:
      - datalake_bob_clean.house_draft.attendance_info
  ops_company:
    description: Operations company responsible for the house
    lineage:
      - datalake_bob_clean.house_draft.attendance_info
  ops_contact_type:
    description: Type of contact for operations
    lineage:
      - datalake_bob_clean.house_draft.attendance_info
  ops_contact_channel:
    description: Contact channel for operations
    lineage:
      - datalake_bob_clean.house_draft.attendance_info
  ts_moved_out:
    description: Timestamp indicating when the house was moved out
    lineage:
      - datalake_bob_clean.house_draft.details
  ts_created:
    description: Timestamp indicating when the house was created
    lineage:
      - datalake_bob_clean.house_draft.ts_created
  ts_updated:
    description: Timestamp indicating when the house was last updated
    lineage:
      - datalake_bob_clean.house_draft.ts_updated