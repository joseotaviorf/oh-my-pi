database_name: datalake_bob
table_name: house_draft_aud
description: This table contains house draft audit information saved during the process of registering a house by a PP or IS teams.
domain: Growth
owner: gabriel.salla@quintoandar.com
columns:
  id_house_draft:
    description: Identifier for house draft
    lineage:
      - datalake_bob_clean.house_draft_aud.id_house_draft
  id_client_side:
    description: Client-generated identifier used by the Bob frontend to track the draft session.
    lineage:
      - datalake_bob_clean.house_draft_aud.id_client_side
  id_original_lead:
    description: Lead identifier from the acquisition source linked when the draft was created.
    lineage:
      - datalake_bob_clean.house_draft_aud.id_original_lead
  id_main_administrator:
    description: Identifier for main administrator
    lineage:
      - datalake_bob_clean.house_draft_aud.administrators
  rev:
    description: Hibernate Envers revision number identifying this historical snapshot of the draft.
    lineage:
      - datalake_bob_clean.house_draft_aud.rev
  rev_type:
    description: Envers operation type for the revision, such as insert, update, or delete.
    lineage:
      - datalake_bob_clean.house_draft_aud.rev_type
  registrar:
    description: JSON struct with the EBDB user who started the house draft registration in Bob.
    lineage:
      - datalake_bob_clean.house_draft_aud.registrar
  owners_informations:
    description: Raw JSON payload listing property owners and contact details captured during draft submission.
    lineage:
      - datalake_bob_clean.house_draft_aud.owners
  house_access_informations:
    description: Raw JSON payload describing how photographers and agents can access the property.
    lineage:
      - datalake_bob_clean.house_draft_aud.access
  administrators_informations:
    description: Raw JSON payload listing building administrators and their contact details.
    lineage:
      - datalake_bob_clean.house_draft_aud.administrators
  main_administrator_name:
    description: Main administrator's name
    lineage:
      - datalake_bob_clean.house_draft_aud.administrators
  main_administrator_email:
    description: Main administrator's email
    lineage:
      - datalake_bob_clean.house_draft_aud.administrators
  main_administrator_phone_number:
    description: Main administrator's phone number
    lineage:
      - datalake_bob_clean.house_draft_aud.administrators
  house_appliances:
    description: JSON list of appliances present in the property as reported in the draft form.
    lineage:
      - datalake_bob_clean.house_draft_aud.details
  house_description:
    description: Free-text property description entered by the owner during the Bob draft flow.
    lineage:
      - datalake_bob_clean.house_draft_aud.details
  front_door_type:
    description: Entry access method for the property, such as keys, lockbox, or doorman.
    lineage:
      - datalake_bob_clean.house_draft_aud.details
  installations:
    description: JSON list of built-in installations reported in the draft, such as air conditioning.
    lineage:
      - datalake_bob_clean.house_draft_aud.details
  acessibility_items:
    description: Accessibility items in the house
    lineage:
      - datalake_bob_clean.house_draft_aud.details
  days_to_vacate:
