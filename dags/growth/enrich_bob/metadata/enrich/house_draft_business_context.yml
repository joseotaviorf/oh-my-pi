database_name: datalake_bob
table_name: house_draft_business_context
owner: gabriel.salla@quintoandar.com
domain: Growth
description: This table contains house draft enriched with house information and business context. Each row means a draft for a business context.
columns:
  id_draft:
    description: Identifier for house draft.
    lineage:
      - datalake_bob.house_draft.id
  id_house:
    description: Identifier for house, is the same id_house for the Main/EBDB.
    lineage:
      - datalake_bob_clean.submission_progress.id_external
  id_region:
    description: Identifier for the region.
    lineage:
      - datalake_ebdb_clean.house.id_region
      - datalake_bob_clean.location.id_region
  city:
    description: City of the draft property, from EBDB house when published or Bob location otherwise.
    lineage:
      - datalake_ebdb_clean.house.city
      - datalake_bob_clean.location.city
  id_user_registrant:
    description: Identifier for the user that register this house. Is the same key that id_user in Main/EBDB.
    lineage:
      - datalake_bob_clean.registrar.id_main
  business_context:
    description: Array of business contexts.
    lineage:
      - datalake_bob.house_draft.is_for_rent
      - datalake_bob.house_draft.is_for_sale
  status:
    description: Current Bob draft workflow status at enrich time.
    lineage:
      - datalake_bob.house_draft.status
  type:
    description: Bob draft workflow type indicating how the listing registration was initiated. Propagates to supply taxonomy as conversion application.
    lineage:
      - datalake_bob.house_draft.type
    categories:
      FULL_SELF_SERVICE: Owner completes listing registration via self-service PWA without assisted operations.
      OWNER_CONVERSION: Owner conversion PWA onboarding flow.
      REFERRAL: Draft initiated through a referral or affiliate program.
      ADMIN_CONFIRMATION: Admin-assisted confirmation flow (CIQ); commonly paired with portfolio manager registration.
      ISAIAS: Isaias partner-assisted registration channel.
      PORTFOLIO_MANAGER: Portfolio manager (gestor de carteira) assisted registration.
      PRIME: Prime B2B service owner registration flow.
  ops_team:
    description: Operations team associated with the house draft.
    lineage:
      - datalake_bob.house_draft.ops_team
  ops_company:
    description: Operations company associated with the house draft.
    lineage:
      - datalake_bob.house_draft.ops_company
  ops_contact_type:
    description: Type of contact associated with the operations.
    lineage:
      - datalake_bob.house_draft.ops_contact_type
  ops_contact_channel:
    description: Contact channel associated with the operations.
    lineage:
      - datalake_bob.house_draft.ops_contact_channel
  ts_created:
    description: Timestamp indicating creation time.
    lineage:
      - datalake_bob.house_draft.ts_created
  ts_updated:
    description: Timestamp indicating last update time.
    lineage:
      - datalake_bob.house_draft.ts_updated
