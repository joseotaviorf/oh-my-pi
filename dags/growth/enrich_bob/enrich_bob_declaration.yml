---
dag:
  name: enrich_bob
  schedule_start_date: 2020, 8, 29
  owner: Data Growth
  documentation:
    dag_purpose: |
      This DAG creates the enriched tables for [Bob (bob-o-construtor)](https://github.com/quintoandar/bob-o-construtor),
      a house registry service and now it has been used by AA (Autonomous Agents).
workflow:
  type: query_delta
  layer: enrich
  tables_customization:
    house_draft_aud:
      extraction_type: incremental
      partitions:
        - year
        - month
        - day
  inner_dependencies:
    house_draft_business_context:
      - house_draft
