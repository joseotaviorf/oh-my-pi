---
dag:
  name: enrich_bob
  schedule_start_date: 2020, 8, 29
  owner: Data Growth
  documentation:
    dag_purpose: |
      This DAG creates the enriched tables for [Bob (bob-o-construtor)](https://github.com/quintoandar/bob-o-construtor),
      a house registry service and now it has been used by AA (Autonomous Agents).
workflow:
  type: query_delta
  layer: enrich
  tables_customization:
    house_draft_aud:
      extraction_type: incremental
      partitions:
        - year
        - month
        - day
  inner_dependencies:
    house_draft_business_context:
      - house_draft
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: c5a.2xlarge
    node_type_id: c5a.4xlarge
    autoscale:
      max_workers: 2
      min_workers: 1
    spark_version: 12.2.x-scala2.12
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
  databricks_conn_id: databricks_new
