---
database_name: dw_growth
table_name: fact_media_platform_metrics
owner: henrique.paulo@quintoandar.com.br
domain: Growth
description: This fact table consolidates media platform metrics, including campaign performance, costs, and regional data, enriched with campaign historical information and business rules. Note that this table does not have a unique identifier per row, as multiple rows may represent overlapping or aggregated data depending on the metrics and dimensions involved.
columns:
  sk_campaign:
    description: The key for the campaign, representing the unique identifier for each media campaign.
    lineage:
      - datalake_growth_media_platform.consolidated_metrics.id_campaign
  sk_adset:
    description: The key for the adset, representing the unique identifier for each ad set.
    lineage:
      - datalake_growth_media_platform.consolidated_metrics.id_adset
  sk_ad:
    description: The key for the ad, representing the unique identifier for each advertisement.
    lineage:
      - datalake_growth_media_platform.consolidated_metrics.id_ad
  sk_region:
    description: The key for the region, representing the geographic segmentation of the campaign.
    lineage:
      - datalake_growth_media_platform.consolidated_metrics.id_region
      - datalake_growth_media_platform.manual_costs.id_region
  sk_cost_date:
    description: The key of Date when the cost was recorded.
    lineage:
      - datalake_growth_media_platform.consolidated_metrics.dt_cost
      - datalake_growth_media_platform.manual_costs.dt_cost
  bk_sharing_rules:
    description: Business key linking hybrid supply automated costs to the sharing rules dimension.
    lineage:
      - datalake_growth_taxonomy.media_setup.funnel_side
      - datalake_growth_taxonomy.media_setup.campaign_business_context
  naming_convention_sufix:
    description: Media setup naming convention suffix used to join taxonomy attributes to platform costs.
    lineage:
      - datalake_growth_media_platform.consolidated_metrics.naming_convention_sufix
      - datalake_growth_media_platform.manual_costs.naming_convention_sufix
      - datalake_growth_taxonomy.media_setup.naming_convention_sufix
  origin:
    description: Paid media platform or channel origin of the spend row (facebook, google, criteo, trovit, braze).
    lineage:
      - datalake_growth_media_platform.consolidated_metrics.origin
  utm_campaign:
    description: UTM campaign parameter captured from the platform or manual cost sheet for attribution.
    lineage:
      - datalake_growth_media_platform.consolidated_metrics.utm_campaign
      - datalake_growth_media_platform.manual_costs.utm_campaign
  utm_term:
    description: UTM term parameter, typically ad group or keyword granularity for paid search and social.
    lineage:
      - datalake_growth_media_platform.consolidated_metrics.utm_term
      - datalake_growth_media_platform.manual_costs.utm_term
  utm_content:
    description: UTM content parameter, typically ad or creative granularity for performance reporting.
    lineage:
      - datalake_growth_media_platform.consolidated_metrics.utm_content
      - datalake_growth_media_platform.manual_costs.utm_content
  country_code:
    description: ISO country code of the campaign or account where the marketing spend was recorded.
    lineage:
      - datalake_growth_media_platform.consolidated_metrics.country_code
  clicks:
    description: Number of ad clicks recorded by the media platform on the cost date.
    lineage:
      - datalake_growth_media_platform.consolidated_metrics.clicks
      - datalake_growth_media_platform.manual_costs.clicks
  conversions:
    description: Number of conversions recorded for the campaign.
    lineage:
      - datalake_growth_media_platform.consolidated_metrics.conversions
  impressions:
    description: Number of ad impressions delivered by the media platform on the cost date.
    lineage:
      - datalake_growth_media_platform.consolidated_metrics.impressions
      - datalake_growth_media_platform.manual_costs.impressions
  total_cost:
    description: Total marketing spend amount in local currency for the row after consolidation and sharing.
    lineage:
      - datalake_growth_media_platform.consolidated_metrics.total_cost
      - datalake_growth_media_platform.manual_costs.total_cost
  dt_cost:
    description: Date when the cost was recorded.
    lineage:
      - datalake_growth_media_platform.consolidated_metrics.dt_cost
      - datalake_growth_media_platform.manual_costs.dt_cost
  year:
    description: Year of the cost record.
    lineage:
      - datalake_growth_media_platform.consolidated_metrics.year
      - datalake_growth_media_platform.manual_costs.year
  month:
    description: Month of the cost record.
    lineage:
      - datalake_growth_media_platform.consolidated_metrics.month
      - datalake_growth_media_platform.manual_costs.month
  day:
    description: Day of the cost record.
    lineage:
      - datalake_growth_media_platform.consolidated_metrics.day
      - datalake_growth_media_platform.manual_costs.day
  ts_load:
    description: Timestamp when the enrich or DW row was materialized by the pipeline load.
