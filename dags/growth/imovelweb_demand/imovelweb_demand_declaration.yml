dag:
  name: imovelweb_demand
  owner: Data Growth
  schedule_interval: 0 8,12,21 * * *
  schedule_start_date: 2026, 9, 1
  documentation:
    dag_purpose: 'CDC pipeline for Imovelweb (Navent) MySQL — prospect contact actions
      (leads) generated on Imovelweb listings. Part of the Navent → QuintoAndar migration
      POC (RD-3333, parent RD-3332). See dags/growth/imovelweb_demand/imovelweb_demand.md
      for table inventory and mapping notes.


      DATA LINEAGE: MySQL (OLTP) → Raw Layer (`datalake_imovelweb_raw`) → Clean Layer
      (`datalake_imovelweb_clean`)

      SCHEDULE: 0 8,12,21 * * * UTC'
workflow:
  type: cdc
  layer: raw
  database_type: mysql
  source_database: imovelweb
  custom_schema: imovelweb
  source_schema: imovelweb
  dbutils_secret_key: IMOVELWEB_DB
  tables_customization:
    contactosacciones:
      clean_table_name: contact_actions
      clean_primary_keys:
      - id_contact_action
      clean_z_order_by:
      - id_contact
  extra_query_template_params:
    load_start_date: '{{ get_date_param(dag_run, data_interval_start | ds, ''load_start_date'')
      }}'
    load_end_date: '{{ get_date_param(dag_run, data_interval_start | ds, ''load_end_date'')
      }}'
