---
database_name: datalake_ebdb_affiliate
table_name: affiliate_monthly_metrics
owner: '@data-growth'
domain: growth
description: This table shows information about affiliates metrics according date.
columns:
  id_date:
    description: This is a registration number of information in the database of date.
    lineage:
      - datalake_quintoandar.aux_date.id_date
  id_user_affiliate:
    description: A registration number of information in the database of affiliate.
    lineage:
      - datalake_ebdb_user.affiliate_data.id
  id_user:
    description: Unique key that identifies a User.
    lineage:
      - datalake_ebdb_clean.user.id
  affiliate_type: 
    description: A type of affiliate.
    lineage:
      - datalake_ebdb_user.affiliate_data.affiliate_type
  conversion_lead_to_listing:
    description: It is a number that represents a percentage of leads that became listings.
    lineage:
      - datalake_listing_flow.listing_flows_with_reprocessed_leads.listing
  conversion_prospect_to_listing:
    description: It is a number that represents a percentage of leads that became prospects.
    lineage:
      - datalake_listing_flow.listing_flows_with_reprocessed_leads.prospects
  active_last_90_days_in_months:
    description: Number of active months in the last 90 days.
    lineage:
      - datalake_listing_flow.listing_flows_with_reprocessed_leads.prospects
  lifetime_days_cohort:
    description: Number of days since the affiliate's operation started.
    lineage:
      - datalake_listing_flow.listing_flows_with_reprocessed_leads.prospects
  leads:
    description: Number of leads generated.
    lineage: 
      - datalake_listing_flow.listing_flows_with_reprocessed_leads.leads
  listings:
    description: Number of listings generated.
    lineage:
      - datalake_listing_flow.listing_flows_with_reprocessed_leads.listings
  listings_last_90_days:
    description: Number of listings in the last 90 days.
    lineage:
      - datalake_listing_flow.listing_flows_with_reprocessed_leads.listings
  prospects:
    description: Number of prospects.
    lineage: 
      - datalake_listing_flow.listing_flows_with_reprocessed_leads.prospects
  prospects_last_90_days:
    description: Number of prospects in the last 90 days.
    lineage: 
        - datalake_listing_flow.listing_flows_with_reprocessed_leads.prospects
  prospects_last_90_months_active:
    description: Percentage of prospects in the last 90 days relative to active months.
    lineage:
      - datalake_listing_flow.listing_flows_with_reprocessed_leads.prospects
  prospects_listings_last_90:
    description: Percentage of prospects that became listings in the last 90 days.
    lineage: 
      - datalake_listing_flow.listing_flows_with_reprocessed_leads.prospects
  is_last_segmentation:
    description: show if the affiliate does indication in the last period.
    lineage:
      -  datalake_quintoandar.aux_date.month_end
  dt_month_end:
    description: End date of the month.
    lineage:
      - datalake_quintoandar.aux_date.month_end
  dt_month_start:
    description: Start date of the month.
    lineage:
      - datalake_quintoandar.aux_date.month_start
  dt_signed:
    description: Date when the affiliate operation was signed.
    lineage:
      - datalake_ebdb_user.affiliate_data.ts_operation_start
  
