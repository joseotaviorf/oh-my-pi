---
dag:
  name: realestate_company
  owner: Data Growth
  schedule_interval: 0 8,12,21 * * *
  schedule_start_date: 2026, 9, 1
  documentation:
    dag_purpose: |-
      CDC pipeline for RealEstate (Navent) MySQL — company context. Part of the Navent → QuintoAndar migration POC (RD-3335, parent RD-3332). CDC ingestion of RealEstate agency/brokerage master data, portal users and third-party interface configuration for company-level integrations.

      DATA LINEAGE: MySQL (OLTP) → datalake_realestate_raw → datalake_realestate_clean
      SCHEDULE: 3× daily at minute 0 UTC (08:00, 12:00, 21:00).
workflow:
  type: cdc
  layer: raw
  database_type: mysql
  source_database: realestate
  custom_schema: realestate
  source_schema: realestate
  dbutils_secret_key: REALESTATE_DB
  tables_customization:
    empresas:
      clean_table_name: companies
      raw_primary_keys:
      - idempresa
      clean_primary_keys:
      - id_company
      clean_z_order_by:
      - id_company
    interfaceconfigurationparameters:
      clean_table_name: interface_configuration_parameters
      raw_primary_keys:
      - idparameter
      clean_primary_keys:
      - id_parameter
      clean_z_order_by:
      - id_interface
    interfaceconfigurations:
      clean_table_name: interface_configurations
      raw_primary_keys:
      - idinterface
      clean_primary_keys:
      - id_interface
      clean_z_order_by:
      - id_interface
    interfaceempresas:
      clean_table_name: interface_companies
      raw_primary_keys:
      - idinterfaceempresa
      clean_primary_keys:
      - id_interface_company
      clean_z_order_by:
      - id_company
    tiposdeinmobiliaria:
      clean_table_name: agency_types
      raw_primary_keys:
      - idtipodeinmobiliaria
      clean_primary_keys:
      - id_agency_type
      clean_z_order_by:
      - id_agency_type
    usuariosempresas:
      clean_table_name: company_users
      raw_primary_keys:
      - idusuarioempresa
      clean_primary_keys:
      - id_company_user
      clean_z_order_by:
      - id_company
  extra_query_template_params:
    load_start_date: '{{ get_date_param(dag_run, data_interval_start | ds, ''load_start_date'') }}'
    load_end_date: '{{ get_date_param(dag_run, data_interval_start | ds, ''load_end_date'') }}'
