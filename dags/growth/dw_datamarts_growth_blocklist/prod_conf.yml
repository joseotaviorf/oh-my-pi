# Merge Keys are available only in Yaml 1.1.
redshift_template:
  dw: &redshift_anchor
    runs_on: redshift
athena_template:
  dw: &athena_anchor
    runs_on: athena
pipeline:
  ##<KEEP THIS COMMENTED AS A TEMPLATE>
  # <task-name-like-attribution-conversion-paths>:
  #   dw:
  #     table: <targe-table-name>
  #     runs_on: <backend-to-run-the-query> E.g: redshift or athena
  marketplace_intelligence_metrics:
    dw:
      <<: *redshift_anchor
      table: marketplace_intelligence_metrics
  listings_online_metrics:
    dw:
      <<: *athena_anchor
      table: listings_online_metrics
  users_online_metrics:
    dw:
      <<: *athena_anchor
      table: users_online_metrics
  house_demand_trends:
    dw:
      <<: *redshift_anchor
      table: house_demand_trends
      # depends_on:
      #   - rental_marketplace_flows
  indicaai_costs:
    dw:
      <<: *redshift_anchor
      table: indicaai_costs
      # depends_on:
      #   - performance_marketing_cluster_promotional_bonus_costs
  demand_housing_cluster_changes:
    dw:
      <<: *redshift_anchor
      table: demand_housing_cluster_changes
      # depends_on:
      #   - performance_marketing_metrics_demand
  plaquinhas_metrics:
    dw:
      <<: *redshift_anchor
      table: plaquinhas_metrics
      # depends_on:
      #   - performance_marketing_metrics_demand
  market_share_by_sk_region:
    dw:
      <<: *athena_anchor
      table: market_share_by_sk_region
  tof_demand_online_events:
    dw:
      <<: *athena_anchor
      table: tof_demand_online_events
  unique_owners:
    dw:
      <<: *redshift_anchor
      table: unique_owners
  performance_marketing_metrics_supply:
    dw:
      <<: *redshift_anchor
      table: performance_marketing_metrics_supply
      # depends_on:
      #   - performance_marketing_metrics_demand
  marketing_allocated_costs:
    dw:
      <<: *redshift_anchor
      table: marketing_allocated_costs
      # depends_on:
      #   - marketing_campaigns_costs_and_volumes
  buyer_activation_events_combo:
    dw:
      <<: *athena_anchor
      table: buyer_activation_events_combo
