database_name: datalake_gsheets_clean
table_name: rental_flows_targets
owner: gabriel.salla@quintoandar.com
domain: Growth
description: Trasnformed table created from a Google Sheets file in order to input rent_flows targets into datalake
columns:
  city_group:
    description: City group of the rent flow target
    lineage:
    - datalake_gsheets_raw.rental_flows_targets.city_group
  rf_target:
    description: Rent flow target
    lineage:
    - datalake_gsheets_raw.rental_flows_targets.rf_target
  rf_type:
    description: Rent flow type specification
    lineage:
    - datalake_gsheets_raw.rental_flows_targets.rf_type
    categories:
      DO: Direct Offer - flow generated by offer submitted
      VB: Visit Booking - flow generated by visit booking
  week_start:
    description: Week start of the rent flow target
    lineage:
    - datalake_gsheets_raw.rental_flows_targets.week_start
  date:
    description: Date of the rent flow target
    lineage:
    - datalake_gsheets_raw.rental_flows_targets.date
