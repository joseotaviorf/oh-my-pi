database_name: datalake_gsheets_clean
table_name: brazilian_regions_url
domain: Growth
description: Table with the URLs of Brazilian regions (states, cities and neighborhoods) for the Imovelweb, Wimoveis and Casa Mineira portals
columns:
  url_imovelweb_region:
    lineage:
      - datalake_gsheets_raw.brazilian_regions_url.iw_region_url
    description: Region URL following Imovelweb pattern
  url_wimoveis_region:
    lineage:
      - datalake_gsheets_raw.brazilian_regions_url.wi_region_url
    description: Region URL following Wimoveis pattern
  url_casamineira_region:
    lineage:
      - datalake_gsheets_raw.brazilian_regions_url.cm_region_url
    description: Region URL following Casa Mineira pattern
  state:
    lineage: 
      - datalake_gsheets_raw.brazilian_regions_url.state
    description: The state of the region
  city:
    lineage:
      - datalake_gsheets_raw.brazilian_regions_url.city
    description: The city of the region
  neighborhood:
    lineage:
      - datalake_gsheets_raw.brazilian_regions_url.neighborhood
    description: The neighborhood of the region
