database_name: datalake_gsheets_clean
table_name: supply_campaign_cluster
domain: Growth
description: Supply campaign cluster segmentation table built by the Operations team.
columns:
  campaign_strategy_intent:
    description: Intention of the actions/campaigns adopted in relation to the growth strategy.
    lineage:
      - datalake_gsheets_raw.supply_campaign_cluster.campaign_strategy_intent
  campaign_business_context:
    description: Quintoandar business context related to the campaign.
    lineage:
      - datalake_gsheets_raw.supply_campaign_cluster.campaign_business_context
  source:
    description: Platform responsible for dispatching the campaign.
    lineage:
      - datalake_gsheets_raw.supply_campaign_cluster.source
  medium:
    description: Type of medium used in the campaign.
    lineage:
      - datalake_gsheets_raw.supply_campaign_cluster.medium
  behavior_type:
    description: Type of user behavior in relation to their search decision and entry into the QuintoAndar environment.
    lineage:
      - datalake_gsheets_raw.supply_campaign_cluster.behavior_type
  funnel_side:
    description: Side of the funnel to which that campaign was directed.
    lineage:
      - datalake_gsheets_raw.supply_campaign_cluster.funnel_side
  campaign_landing_page:
    description: Landing page/domain of QuintoAndar to which the campaign directs.
    lineage:
      - datalake_gsheets_raw.supply_campaign_cluster.campaign_landing_page
  campaign_cluster:
    description: A grouping of marketing campaigns.
    lineage:
      - datalake_gsheets_raw.supply_campaign_cluster.campaign_cluster