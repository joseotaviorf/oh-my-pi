---
database_name: datalake_growth_media_platform
table_name: google_metrics
owner: arthur.gonzaga@quintoandar.com.br
domain: Data Growth
description: This table contains metrics like clicks, impressions, and cost from Google Ads with geo-level granularity.
columns:
  id_account:
    lineage:
      - datalake_google_ads_clean.ad_group_geo_performance.id_external_customer
    description: The account id of the Google Ads platform.
  id_campaign:
    lineage:
      - datalake_google_ads_clean.ad_group_geo_performance.id_campaign
    description: The id of the campaign in Google Ads.
  id_adset:
    lineage:
      - datalake_google_ads_clean.ad_group_geo_performance.id_ad_group
    description: The id of the ad group in Google Ads.
  id_ad:
    description: The id of the ad in Google Ads. This information is not available for this table.
  account_name:
    lineage:
      - datalake_google_ads_clean.ad_group_geo_performance.account_snake_case
    description: The name of the account in Google Ads.
  origin:
    description: The origin of the data. For this table, it is always Google.
  report_type:
    description: The type of report. For this table, it is always ad_group_geo_performance.
  utm_campaign:
    lineage:
      - datalake_google_ads_clean.ad_group_geo_performance.campaign_name
    description: The UTM campaign name of the ad.
  utm_term:
    lineage:
      - datalake_google_ads_clean.ad_group_geo_performance.ad_group_name
    description: The UTM term of the ad group in Google Ads.
  utm_content:
    description: The UTM content of the ad in Google Ads. This information is not available for this table.
  country_code:
    lineage:
      - datalake_google_ads_clean.ad_group_geo_performance.country_code
    description: The country code of the report.
  state:
    lineage:
      - datalake_google_ads_clean.geo_target_constant.name
    description: The state (region) of the spend in the report.
  city:
    lineage:
      - datalake_google_ads_clean.geo_target_constant.name
    description: The city of the spend in the report.
  clicks:
    lineage:
      - datalake_google_ads_clean.ad_group_geo_performance.clicks
    description: Number of clicks in Google Ads.
  conversions:
    description: Number of conversions in Google Ads. This information is not available for this table.
  impressions:
    lineage:
      - datalake_google_ads_clean.ad_group_geo_performance.impressions
    description: Number of impressions in Google Ads.
  total_cost:
    lineage:
      - datalake_google_ads_clean.ad_group_geo_performance.cost
    description: Total cost of the ads in Google Ads, converted to standard currency units.
  dt_cost:
    lineage:
      - datalake_google_ads_clean.ad_group_geo_performance.dt_loaded
    description: Date when the cost data was loaded.
  year:
    lineage:
      - datalake_google_ads_clean.ad_group_geo_performance.dt_loaded
    description: Year of the report.
  month:
    lineage:
      - datalake_google_ads_clean.ad_group_geo_performance.dt_loaded
    description: Month of the report.
  day:
    lineage:
      - datalake_google_ads_clean.ad_group_geo_performance.dt_loaded
    description: Day of the report.
