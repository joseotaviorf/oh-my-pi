---
database_name: datalake_growth_media_platform
table_name: criteo_metrics
owner: henrique.paulo@quintoandar.com.br
domain: Growth
description: |
  Growth media platform metrics for criteo metrics used in marketing cost allocation. Partitioned by origin, year, month, and day — filter all partition columns in WHERE.
columns:
  id_account:
    lineage:
      - datalake_criteo.criteo_campaigns.id_advertiser
    description: Numeric Criteo advertiser account identifier from the regional campaigns report.
  id_campaign:
    lineage:
      - datalake_criteo.criteo_campaigns.id_ad_set
    description: Numeric Criteo ad set identifier used as the campaign key in this report.
  id_adset:
    lineage:
      - datalake_criteo.criteo_campaigns.id_ad_set
    description: Numeric Criteo ad set identifier grouping creatives within the campaign.
  id_ad:
    description: The id of the ad in media platform, for this table is null.
  account_name:
    lineage:
      - datalake_criteo.criteo_campaigns.advertiser_name
    description: Human-readable Criteo advertiser label from the regional campaigns report.
  origin:
    description: The origin of the data, its always Criteo.
  report_type:
    description: The type of report, its always campaigns.
  utm_campaign:
    lineage:
      - datalake_criteo.criteo_campaigns.ad_set
    description: UTM campaign value derived from the Criteo ad set naming convention.
  utm_term:
    description: The utm_term of the media platform. For this table is null.
  utm_content:
    description: The utm_content of the media platform. For this table is null.
  country_code:
    description: The country code of the report. Its always BR.
  state:
    lineage:
      - datalake_criteo.criteo_campaigns.region
    description: State of spend in the report.
  city:
    lineage:
      - datalake_gsheets_clean.criteo_region_lookup.locality
    description: City of spend in the report.
  clicks:
    lineage:
      - datalake_criteo.criteo_campaigns.clicks
    description: Number of clicks in media on ads.
  conversions:
    description: Number of conversions in media on ads. But we don't have this data for this report.
  impressions:
    lineage:
      - datalake_criteo.criteo_campaigns.displays
    description: Number of impressions in media on ads.
  total_cost:
    lineage:
      - datalake_criteo.criteo_campaigns.cost
    description: Total paid media cost aggregated across device platforms for the marketing channel. of the media on ads.
  dt_cost:
    lineage:
      - datalake_criteo.criteo_campaigns.dt_report
    description: Calendar date when the Criteo spend metrics in this row were recorded.
  year:
    lineage:
      - datalake_criteo.criteo_campaigns.dt_report
    description: Year of the report.
  month:
    lineage:
      - datalake_criteo.criteo_campaigns.dt_report
    description: Month of the report.
  day:
    lineage:
      - datalake_criteo.criteo_campaigns.dt_report
    description: Day of the report.
