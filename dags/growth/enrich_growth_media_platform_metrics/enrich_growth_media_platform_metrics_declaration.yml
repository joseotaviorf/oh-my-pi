dag:
  name: enrich_growth_media_platform_metrics
  schedule_start_date: 2024, 10, 14
  owner: Data Growth
  documentation:
    dag_purpose: |
      This DAG is responsible for consolidate metrics like clicks, impressions and cost from 
      Media Platforms like Google, Facebook, Criteo and Trovit.
workflow:
  type: query_delta
  layer: enrich
  custom_schema: growth_media_platform
  default_extraction_type: incremental
  default_partitions: ["origin", "year", "month", "day"]
  spark_session_configs:
    udfs: [SF_NORMALIZE_STRING]
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, -6), 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  inner_dependencies:
    consolidated_metrics:
    - google_metrics
    - facebook_metrics
    - criteo_metrics
    - trovit_metrics
cluster:
  type: databricks_13_3_med_general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
