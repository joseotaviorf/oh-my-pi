dag:
  name: enrich_growth_manual_daily_costs
  schedule_start_date: 2019, 1, 1
  owner: Data Growth
  documentation:
    dag_purpose: |
      This DAG generates the manual costs (i.e. gathered from gsheets tables) and saves its part in the final Fact Marketing Daily Costs aside Enrich Marketing Automatic Daily Costs.
      At the day 2024-10-04, we copy gsheets to the table `datalake_growth_costs.historical_marketing_manual_costs_name_convention` and `datalake_growth_costs.historical_marketing_manual_costs`
      We added this as historical data.
workflow:
  type: query_delta
  layer: enrich
  custom_schema: growth_costs
  default_partitions:
  - id_date
  - flow_type
cluster:
  type: databricks_13_3_min_2_fixed_workers_general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
