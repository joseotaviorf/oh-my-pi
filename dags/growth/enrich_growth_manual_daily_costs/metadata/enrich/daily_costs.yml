---
database_name: datalake_growth_costs
table_name: daily_costs
owner: henrique.paulo@quintoandar.com.br
domain: Growth
description: Table that consolidates costs extract from manual growth marketing input
columns:
  id_date:
    description: Calendar date key for the daily marketing cost row; joins to the shared date dimension.
    lineage:
      - datalake_gsheets_clean.marketing_manual_costs.dt_cost
      - datalake_growth_costs.historical_marketing_manual_costs.dt_cost
  flow_type:
    description: Cost flow type distinguishing automatic platform extracts from manual shared cost uploads.
    categories:
      manual: ''
      automatic: ''
  origin:
    description: Paid media platform or channel origin of the spend row (facebook, google, criteo, trovit, braze).
    categories:
      mitula: ''
      trovit: ''
      criteo: ''
      facebook: ''
      google: ''
  business_context:
    description: Business line (Rent, Sale, Hybrid) associated with the campaign spend after enrichment.
  account_name:
    description: Advertising account name on the source platform used to group campaigns and invoices.
    lineage:
      - datalake_gsheets_clean.marketing_manual_costs.account_name
      - datalake_growth_costs.historical_marketing_manual_costs.account_name
  campaign_name:
    description: Campaign name as reported by the media platform before taxonomy enrichment.
    lineage:
      - datalake_gsheets_clean.marketing_manual_costs.campaign_name
      - datalake_growth_costs.historical_marketing_manual_costs.campaign_name
  utm_campaign:
    description: UTM campaign parameter captured from the platform or manual cost sheet for attribution.
    lineage:
      - datalake_gsheets_clean.marketing_manual_costs.campaign_name
      - datalake_growth_costs.historical_marketing_manual_costs.campaign_name
  utm_term:
    description: UTM term parameter, typically ad group or keyword granularity for paid search and social.
    lineage:
      - datalake_gsheets_clean.marketing_manual_costs.utm_term
      - datalake_growth_costs.historical_marketing_manual_costs.utm_term
  utm_content:
    description: UTM content parameter, typically ad or creative granularity for performance reporting.
    lineage:
      - datalake_gsheets_clean.marketing_manual_costs.utm_content
      - datalake_growth_costs.historical_marketing_manual_costs.utm_content
  city_group:
    description: Geographic city group assigned to the spend after sharing rules and taxonomy mapping.
    lineage:
      - datalake_gsheets_clean.marketing_manual_costs.city_group
      - datalake_growth_costs.historical_marketing_manual_costs.city_group
      - datalake_growth_costs_sharing_rules.sharing_rules.city_group
  country_code:
    description: ISO country code of the campaign or account where the marketing spend was recorded.
    lineage:
      - datalake_gsheets_clean.marketing_manual_costs.country_code
      - datalake_growth_costs.historical_marketing_manual_costs.country_code
  campaign_business_context:
    description: Taxonomy-derived business context label (Rent, Sale, Hybrid) for growth media setup.
    lineage:
      - datalake_gsheets_clean.marketing_manual_costs.campaign_business_context
      - datalake_growth_costs.historical_marketing_manual_costs.campaign_business_context
    categories:
      Rent: ''
      Sale: ''
      Hybrid: ''
      Other: ''
      Lost Tracking: ''
  campaign_strategy_intent:
    description: Taxonomy strategy intent (Acquisition, Brand Awareness, Engagement) for the campaign.
    lineage:
      - datalake_gsheets_clean.marketing_manual_costs.campaign_strategy_intent
      - datalake_growth_costs.historical_marketing_manual_costs.campaign_strategy_intent
    categories:
      Acquisition: ''
      Activation: ''
      Brand Awareness: ''
      Engagement: ''
      Lost Tracking: ''
      Other: ''
      Recovery: ''
  behavior_type:
    description: Taxonomy behavior type distinguishing organic versus non-organic paid acquisition.
    lineage:
      - datalake_gsheets_clean.marketing_manual_costs.behavior_type
      - datalake_growth_costs.historical_marketing_manual_costs.behavior_type
    categories:
      Lost Tracking: ''
      Other: ''
      non organic: ''
      organic: ''
  campaign_landing_page:
    description: Landing page category from media setup taxonomy linked to the campaign destination.
    lineage:
      - datalake_gsheets_clean.marketing_manual_costs.landing_page
      - datalake_growth_costs.historical_marketing_manual_costs.landing_page
  medium:
    description: Marketing medium from taxonomy (cpc, display, email) describing the delivery channel.
    lineage:
      - datalake_gsheets_clean.marketing_manual_costs.medium
      - datalake_growth_costs.historical_marketing_manual_costs.medium
  source:
    description: Marketing source from taxonomy (google, facebook) describing the traffic origin.
    lineage:
      - datalake_gsheets_clean.marketing_manual_costs.source
      - datalake_growth_costs.historical_marketing_manual_costs.source
  funnel_side:
    description: Funnel side from taxonomy indicating demand-side versus supply-side marketing focus.
    lineage:
      - datalake_gsheets_clean.marketing_manual_costs.funnel_side
      - datalake_growth_costs.historical_marketing_manual_costs.funnel_side
  total_cost:
    description: Total marketing spend amount in local currency for the row after consolidation and sharing.
    lineage:
      - datalake_gsheets_clean.marketing_manual_costs.cost
      - datalake_growth_costs.historical_marketing_manual_costs.cost
      - datalake_growth_costs_sharing_rules.sharing_rules.share
  impressions:
    description: Number of ad impressions delivered by the media platform on the cost date.
    lineage:
      - datalake_gsheets_clean.marketing_manual_costs.impressions
      - datalake_growth_costs.historical_marketing_manual_costs.impressions
  clicks:
    description: Number of ad clicks recorded by the media platform on the cost date.
    lineage:
      - datalake_gsheets_clean.marketing_manual_costs.clicks
      - datalake_growth_costs.historical_marketing_manual_costs.clicks
