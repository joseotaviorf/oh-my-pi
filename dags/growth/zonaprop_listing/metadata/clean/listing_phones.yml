database_name: datalake_zonaprop_clean
table_name: listing_phones
domain: Growth
owner: vitor.musachio@quintoandar.com.br
description: 'Contact phone numbers exposed on a Zonaprop listing (`telefonosaviso`). One row per phone record (PK id_listing_phone). Contains PII — handle per LGPD policy. Physical layout: Z-ordered by id_listing (no partitions); filter on id_listing for efficient data skipping.'
columns:
  id_listing:
    lineage:
    - datalake_zonaprop_raw.telefonosaviso.idaviso
    description: Listing that displays this contact phone number to visitors.
  id_listing_phone:
    lineage:
    - datalake_zonaprop_raw.telefonosaviso.idtelefonoaviso
    description: Unique identifier for a phone number attached to a listing.
  phone_number:
    lineage:
    - datalake_zonaprop_raw.telefonosaviso.numero
    description: Contact phone number displayed on the listing detail page.
  phone_prefix:
    lineage:
    - datalake_zonaprop_raw.telefonosaviso.prefijo
    description: Country or area code prefix for the listing contact phone.
  phone_type:
    lineage:
    - datalake_zonaprop_raw.telefonosaviso.tipodetelefono
    description: Category of phone such as mobile, landline or WhatsApp.
  ts_cdc_transaction:
    lineage:
    - datalake_zonaprop_raw.telefonosaviso.ts_cdc_transaction
    description: Wall-clock timestamp when the CDC connector captured this change event (millisecond precision).
  ts_database_transaction:
    lineage:
    - datalake_zonaprop_raw.telefonosaviso.ts_database_transaction
    description: Timestamp of the originating database transaction in the source application before CDC propagation.
  op_cdc:
    lineage:
    - datalake_zonaprop_raw.telefonosaviso.op_cdc
    description: CDC operation type captured by Debezium change-data-capture stream.
    categories:
      r: Read/snapshot - initial load of existing records.
      c: Create - new record inserted.
      u: Update - existing record modified.
      d: Delete - record removed.
