dag:
  name: ebdb_user_fast_lane
  schedule_start_date: 2024,01,01
  schedule_interval: 0,30 * * * *
  owner: Data Growth
  documentation:
    dag_purpose: |
      DAG containing tables from User context that are running every 30 minutes.
workflow:
  type: cdc
  layer: raw
  database_type: mysql
  dbutils_secret_key: EBDB_DB
  source_database: ebdb
  source_schema: ebdb
  execution_timeout_hours: 0.5
  tables_customization:
    UsuarioRevisionEntity:
      clean_primary_keys: [id]
      clean_table_name: user_revision_entity
cluster:
  type: databricks_16_4_rfleet_instance_cluster
  databricks_conn_id: databricks_new
