dag:
  name: enrich_growth_costs_sharing_rules_test
  schedule_start_date: 2019, 1, 1
  owner: Data Growth
  documentation:
    dag_purpose: |
      This DAG loads sharing rules defined by Marketing DAs to split costs into regions using processed data.
      Concatenates all rules defined in `$COMPOSER_QUERIES_PATH/enrich_marketing_costs_sharing_rules/online/enrich`
      for online costs and `$COMPOSER_QUERIES_PATH/enrich_marketing_costs_sharing_rules/offline/enrich` using SQL.
      All queries must have these columns as output: id_date (analogue to sk_date, this column can't be called as sk
      inside enrich databases), city_group, funnel_side/center_cost (online/offline), share, utm_campaign.
      The rule id is defined by the .sql file name.
