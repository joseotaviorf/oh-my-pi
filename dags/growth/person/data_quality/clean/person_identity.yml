---
table_name: datalake_person_clean.person_identity
alert_channel: "#alerts-de-airflow-dags"

table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: -10
    less_than_or_equal_to: 50
    severity_level: Warning

column_level_validations:
  id:
    is_unique:
      severity_level: Error
    is_complete:
      severity_level: Error
  id_person:
    is_complete:
      severity_level: Error
  value:
    is_complete:
      severity_level: Error
  scope:
    is_contained_in:
      values:
        - BR
        - MX
        - COGNITO_USER_POOL_BR
        - COGNITO_USER_POOL_MX
      severity_level: Warning
  type:
    is_contained_in:
      values:
        - EMAIL
        - PHONE
        - CPF
        - RFC
        - PASSPORT
        - COGNITO
        - GOOGLE
        - APPLE
      severity_level: Error
  validation_type:
    # Non-null validation_type must match Person service enum; null is valid when not assigned.
    custom:
      constraint: |-
        (SELECT COUNT(*)
         FROM datalake_person_clean.person_identity
         WHERE validation_type IS NOT NULL
           AND validation_type NOT IN ('SELF', 'INTERNAL', 'EXPIRED')
        ) = 0
      severity_level: Warning
  ts_created:
    is_complete:
      severity_level: Error
  ts_updated:
    is_complete:
      severity_level: Error
  year:
    is_complete:
      severity_level: Error
  month:
    is_complete:
      severity_level: Error
    has_min_value:
      greater_than_or_equal_to: 1
      severity_level: Error
    has_max_value:
      less_than_or_equal_to: 12
      severity_level: Error
  day:
    is_complete:
      severity_level: Error
    has_min_value:
      greater_than_or_equal_to: 1
      severity_level: Error
    has_max_value:
      less_than_or_equal_to: 31
      severity_level: Error
