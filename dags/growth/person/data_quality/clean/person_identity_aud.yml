---
table_name: datalake_person_clean.person_identity_aud
alert_channel: "#alerts-de-airflow-dags"

table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: -10
    less_than_or_equal_to: 50
    severity_level: Warning

column_level_validations:
  id:
    # Composite primary key (id, rev) must be unique per Envers audit row.
    custom:
      constraint: |-
        (SELECT COUNT(*)
         FROM (
           SELECT 1
           FROM datalake_person_clean.person_identity_aud
           GROUP BY id, rev
           HAVING COUNT(*) > 1
         )) = 0
      severity_level: Error
    is_complete:
      severity_level: Error
  rev:
    is_complete:
      severity_level: Error
  rev_type:
    is_contained_in:
      values:
        - "0"
        - "1"
        - "2"
      severity_level: Error
  id_person:
    # Every audit row must reference an existing person in the clean layer.
    # Warning (not Error): all person CDC clean tables load in parallel with no inner_dependency
    # on person. Valid same-run inserts can transiently fail this check until person finishes.
    custom:
      constraint: |-
        (SELECT COUNT(*)
         FROM datalake_person_clean.person_identity_aud a
         WHERE NOT EXISTS (
           SELECT 1 FROM datalake_person_clean.person p WHERE p.id = a.id_person
         )) = 0
      severity_level: Warning
    is_complete:
      severity_level: Error
  type:
    is_contained_in:
      values:
        - EMAIL
        - PHONE
        - CPF
        - RFC
        - PASSPORT
        - COGNITO
        - GOOGLE
        - APPLE
      severity_level: Warning
  scope:
    is_contained_in:
      values:
        - BR
        - MX
        - COGNITO_USER_POOL_BR
        - COGNITO_USER_POOL_MX
      severity_level: Warning
  validation_type:
    # Non-null validation_type must match Person service enum; null is valid in historical snapshots.
    custom:
      constraint: |-
        (SELECT COUNT(*)
         FROM datalake_person_clean.person_identity_aud
         WHERE validation_type IS NOT NULL
           AND validation_type NOT IN ('SELF', 'INTERNAL', 'EXPIRED')
        ) = 0
      severity_level: Warning
  ts_created:
    is_complete:
      severity_level: Error
  ts_updated:
    is_complete:
      severity_level: Error
  year:
    is_complete:
      severity_level: Error
  month:
    is_complete:
      severity_level: Error
    has_min_value:
      greater_than_or_equal_to: 1
      severity_level: Error
    has_max_value:
      less_than_or_equal_to: 12
      severity_level: Error
  day:
    is_complete:
      severity_level: Error
    has_min_value:
      greater_than_or_equal_to: 1
      severity_level: Error
    has_max_value:
      less_than_or_equal_to: 31
      severity_level: Error
