---
table_name: datalake_person_clean.right_to_be_forgotten
alert_channel: "#alerts-de-airflow-dags"

table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: -10
    less_than_or_equal_to: 50
    severity_level: Warning

column_level_validations:
  id:
    is_unique:
      severity_level: Error
    is_complete:
      severity_level: Error
  id_person:
    # Every anonymization request must reference an existing person in the clean layer.
    # Warning (not Error): all person CDC clean tables load in parallel with no inner_dependency
    # on person. Valid same-run inserts can transiently fail this check until person finishes.
    custom:
      constraint: |-
        (SELECT COUNT(*)
         FROM datalake_person_clean.right_to_be_forgotten r
         WHERE NOT EXISTS (
           SELECT 1 FROM datalake_person_clean.person p WHERE p.id = r.id_person
         )) = 0
      severity_level: Warning
    is_complete:
      severity_level: Error
  feedback:
    is_contained_in:
      values:
        - DONT_USE_ANYMORE
        - ANOTHER_ACCOUNT
        - TECHNICAL_PROBLEMS
        - BETTER_ALTERNATIVE
        - CUSTOMER_SERVICE
        - COSTS_PROBLEMS
        - OTHER
      severity_level: Warning
  ts_created:
    is_complete:
      severity_level: Error
  ts_updated:
    is_complete:
      severity_level: Error
  year:
    is_complete:
      severity_level: Error
  month:
    is_complete:
      severity_level: Error
    has_min_value:
      greater_than_or_equal_to: 1
      severity_level: Error
    has_max_value:
      less_than_or_equal_to: 12
      severity_level: Error
  day:
    is_complete:
      severity_level: Error
    has_min_value:
      greater_than_or_equal_to: 1
      severity_level: Error
    has_max_value:
      less_than_or_equal_to: 31
      severity_level: Error
