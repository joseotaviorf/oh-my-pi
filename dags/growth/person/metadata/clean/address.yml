---
database_name: datalake_person_clean
table_name: address
owner: isadora.gallerani@quintoandar.com.br
domain: Growth
description: |
  Physical address information for persons, supporting multi-country address formats and validation.
  Critical for service delivery, compliance verification, and geographic analysis.
  Partitioned by year, month, and day — filter all three partition columns in WHERE for pruning.
  
  **Business Context:**
  - Enables service delivery and logistics coordination
  - Supports geographic market analysis and expansion planning
  - Required for compliance and identity verification in many jurisdictions
  - Enables location-based service personalization and offerings
  - Critical for fraud prevention and risk assessment
  
  **Geographic Coverage:**
  - Supports multiple address formats (Brazilian, Mexican, international)
  - Flexible structure accommodates varying address conventions
  - ZIP/postal code integration for delivery and verification
  - State/province tracking for regulatory compliance
  - Country-level tracking for international operations
  
  **Data Quality & Validation:**
  - Address validation against postal services where available
  - Geocoding integration for coordinate-based services
  - Standardization for consistent formatting and search
  - Complement field for apartment/unit/additional address details
  
  **Privacy & Security:**
  - Considered sensitive PII under data protection regulations
  - Subject to data residency requirements in some jurisdictions
  - Audit trail maintained for compliance and verification
  - May be masked or anonymized for certain use cases

  **PII disclaimer:** This table contains personally identifiable information (PII) subject to LGPD/GDPR. Restrict access to authorized purposes and apply minimum-necessary scope when querying or exporting data.
columns:
  id:
    lineage:
    - datalake_person_raw.address.id
    description: |
      Primary key - Auto-incrementing internal identifier for the address record.
      Used for internal database relationships and efficient address management.
  uuid_address:
    lineage:
    - datalake_person_raw.address.address_uuid
    description: |
      Business identifier - Unique UUID for this address, automatically generated.
      Used for external API references and address tracking across systems.
      PII: Personally identifiable information subject to LGPD/GDPR data protection policies.
  id_person:
    lineage:
    - datalake_person_raw.address.person_id
    description: |
      Foreign key reference to the person table (person.id).
      **Relationship:** One-to-One with person table (each person has one primary address)
      **Business Rule:** Required field, cannot be null
      **Usage:** Links the address to the owning person record
      **Constraint:** Unique per person for primary address.
      PII: Links to a natural person — treat as personally identifiable information under LGPD/GDPR.
  address:
    lineage:
    - datalake_person_raw.address.address
    description: |
      Street address or primary address line.
      **Content:** Street name, avenue, road, or primary address identifier
      **Format:** Free-text field supporting various international address formats
      **Examples:** "Rua das Flores, 123", "Avenida Paulista, 1000", "123 Main Street"
      **Validation:** May be validated against postal services and geocoding APIs
      PII: Personally identifiable information subject to LGPD/GDPR data protection policies.
  number:
    lineage:
    - datalake_person_raw.address.number
    description: |
      Street number or building identifier within the address.
      **Format:** Alphanumeric field supporting various numbering systems
      **Examples:** "123", "45-A", "1000-1002", "S/N" (sem número - no number)
      **Usage:** Used for precise location identification and delivery
      **Validation:** May be cross-referenced with postal databases.
      PII: Personally identifiable information subject to LGPD/GDPR data protection policies.
  complement:
    lineage:
    - datalake_person_raw.address.complement
    description: |
      Additional address details for precise location identification.
      **Content:** Apartment, suite, floor, building, or additional location info
      **Examples:** "Apto 101", "Sala 205", "Bloco B", "2nd Floor", "Casa dos Fundos"
      **Usage:** Critical for accurate delivery and service provision
      **Optional:** Not all addresses require complement information.
      PII: Personally identifiable information subject to LGPD/GDPR data protection policies.
  neighborhood:
    lineage:
    - datalake_person_raw.address.neighborhood
    description: |
      Neighborhood, district, or local area name within the city.
      **Content:** Local geographic subdivision within the city
      **Examples:** "Vila Madalena", "Copacabana", "Centro", "Downtown"
      **Usage:** Used for market analysis, delivery routing, and local service provision
      **Cultural:** Neighborhood names vary significantly by country and culture.
      PII: Personally identifiable information subject to LGPD/GDPR data protection policies.
  zip_code:
    lineage:
    - datalake_person_raw.address.zip_code
    description: |
      Postal code or ZIP code for the address.
      **Format:** Country-specific postal code format (CEP in Brazil, ZIP in US, etc.)
      **Examples:** "01310-100" (Brazil CEP), "90210" (US ZIP), "SW1A 1AA" (UK)
      **Validation:** Validated against postal service databases when possible
      **Usage:** Critical for delivery, taxation, and geographic classification
      **Integration:** Used with postal APIs for address validation and completion.
      PII: Personally identifiable information subject to LGPD/GDPR data protection policies.
  city:
    lineage:
    - datalake_person_raw.address.city
    description: |
      City or municipality name.
      **Content:** Official city or municipality name as recognized by local authorities
      **Examples:** "São Paulo", "Rio de Janeiro", "Mexico City", "New York"
      **Validation:** May be validated against official city registries
      **Usage:** Used for market analysis, service coverage, and delivery coordination
      **Standardization:** Normalized for consistent reporting and analysis.
      PII: Personally identifiable information subject to LGPD/GDPR data protection policies.
  state:
    lineage:
    - datalake_person_raw.address.state
    description: |
      State, province, or regional administrative division.
      **Content:** Official state or province name or abbreviation
      **Examples:** "SP" (São Paulo), "RJ" (Rio de Janeiro), "CA" (California), "DF" (Mexico)
      **Format:** May use abbreviations or full names depending on country
      **Usage:** Critical for tax calculation, regulatory compliance, and service availability
      **Legal:** Required for compliance with state-level regulations and taxation.
      PII: Personally identifiable information subject to LGPD/GDPR data protection policies.
  country:
    lineage:
    - datalake_person_raw.address.country
    description: |
      Country name for the address.
      **Content:** Full country name as stored in the system
      **Examples:** "Brazil", "Mexico", "United States", "Argentina"
      **Standards:** Should align with ISO country naming conventions
      **Usage:** Determines applicable laws, service availability, and delivery options
      **Compliance:** Critical for international compliance and data residency requirements.
      PII: Personally identifiable information subject to LGPD/GDPR data protection policies.
  version:
    lineage:
    - datalake_person_raw.address.version
    description: |
      Optimistic locking version number for concurrent update protection.
      Incremented automatically on each update to prevent data conflicts.
  ts_created:
    lineage:
    - datalake_person_raw.address.created_at
    description: |
      UTC timestamp with timezone information of when the address was first created in the system.
      Used for address registration tracking, data freshness analysis, audit trail.
  ts_updated:
    lineage:
    - datalake_person_raw.address.updated_at
    description: |
      UTC timestamp with timezone information of when the address was last modified.
      Use to change tracking, address update monitoring, data quality assessment.
  year:
    lineage:
    - datalake_person_raw.address.year
    description: |
      Table partition column (year). Set from the CDC S3 ingest path date at raw ingestion — not
      derived from ts_updated. Required in WHERE clauses for partition pruning; align filters with the
      DAG load window (load_start_date/load_end_date), not with record update timestamps.
  month:
    lineage:
    - datalake_person_raw.address.month
    description: |
      Table partition column (month, 1–12). Set from the CDC S3 ingest path date at raw ingestion —
      not derived from ts_updated. Must be filtered together with year and day in every query to
      enable partition pruning.
  day:
    lineage:
    - datalake_person_raw.address.day
    description: |
      Table partition column (day, 1–31). Set from the CDC S3 ingest path date at raw ingestion —
      not derived from ts_updated. Always filter with year and month.
      Example: WHERE year = 2026 AND month = 6 AND day BETWEEN 1 AND 7.