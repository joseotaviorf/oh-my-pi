---
database_name: datalake_person_clean
table_name: credential_reference
owner: isadora.gallerani@quintoandar.com.br
domain: Growth
description: |
  External system authentication credentials and references that link persons to authentication providers.
  Enables single sign-on, account linking, and authentication across QuintoAndar's ecosystem and partner systems.
  
  **Business Context:**
  - Links persons to external authentication systems and providers
  - Enables single sign-on (SSO) and federated authentication
  - Supports account migration and system integration
  - Critical for user experience and authentication flows
  - Enables cross-system user identification and session management
  
  **Credential Origins & Systems:**
  - **GANDALF:** Legacy QuintoAndar authentication system
  - **COGNITO:** AWS Cognito user pools for modern authentication
  - **COGNITO_REDE:** Rede-specific Cognito user pool for partner integration
  - **MAIN:** Main QuintoAndar system user IDs
  - **NAVENT_RELA:** Navent partner system integration credentials
  
  **Integration Patterns:**
  - Each credential references a user ID in the external system
  - Supports multiple credentials per person for system migration
  - Enables authentication delegation to appropriate systems
  - Used for session management and authorization decisions
  
  **Data Architecture:**
  - One-to-many relationship with person (person_id foreign key)
  - Unique constraints prevent duplicate credentials per origin
  - Reference IDs are external system identifiers
  - Supports credential lifecycle management and migration
columns:
  id:
    lineage:
    - datalake_person_raw.credential_reference.id
    description: |
      Primary key - Auto-incrementing internal identifier for the credential reference record.
      Used for internal database relationships and efficient credential management.
  id_person:
    lineage:
    - datalake_person_raw.credential_reference.person_id
    description: |
      Foreign key reference to the person table (person.id).
      **Relationship:** Many-to-One with person table
      **Business Rule:** Required field, cannot be null
      **Usage:** Links external credentials to the person record
      **Constraints:** Combined with origin to prevent duplicate credentials per system.
  id_reference:
    lineage:
    - datalake_person_raw.credential_reference.ref_id
    description: |
      External system user identifier or reference ID.
      **Format:** Varies by origin system (UUIDs, numeric IDs, usernames)
      **Examples:** Cognito user UUID, Gandalf user ID, Navent user identifier
      **Usage:** Used for authentication delegation and user lookup in external systems
      **Security:** May be considered sensitive for some systems
      **Integration:** Key field for cross-system user resolution and SSO.
  origin:
    lineage:
    - datalake_person_raw.credential_reference.origin
    description: |
      Authentication system or provider that owns the credential.
      **Allowed Values:**
      - 'GANDALF': Legacy QuintoAndar authentication system
      - 'COGNITO': AWS Cognito user pools (general)
      - 'COGNITO_REDE': Rede-specific Cognito user pool
      - 'MAIN': Main QuintoAndar system user identifiers
      - 'NAVENT_RELA': Navent partner system integration
      **Business Rules:** Each person can have one credential per origin system
      **Integration:** Determines which authentication provider to use for the person
      **Migration:** Supports gradual migration between authentication systems.
  version:
    lineage:
    - datalake_person_raw.credential_reference.version
    description: |
      Optimistic locking version number for concurrent update protection.
      Incremented automatically on each update to prevent data conflicts.
  ts_created:
    lineage:
    - datalake_person_raw.credential_reference.created_at
    description: |
      Timestamp when the credential reference was first created in the system.
      **Format:** UTC timestamp with timezone information
      **Usage:** Credential creation tracking, system migration analysis, audit trail.
  ts_updated:
    lineage:
    - datalake_person_raw.credential_reference.updated_at
    description: |
      Timestamp when the credential reference was last modified.
      **Format:** UTC timestamp with timezone information
      **Usage:** Change tracking, credential updates, system migration monitoring.
  year:
    lineage:
    - datalake_person_raw.credential_reference.year
    description: |
      Partition column - Year extracted from the record's processing timestamp.
      Used for efficient data partitioning and query performance optimization.
  month:
    lineage:
    - datalake_person_raw.credential_reference.month
    description: |
      Partition column - Month extracted from the record's processing timestamp.
      Used for efficient data partitioning and query performance optimization.
  day:
    lineage:
    - datalake_person_raw.credential_reference.day
    description: |
      Partition column - Day extracted from the record's processing timestamp.
      Used for efficient data partitioning and query performance optimization.