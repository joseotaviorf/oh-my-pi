---
database_name: datalake_person_clean
table_name: contact_info
owner: isadora.gallerani@quintoandar.com.br
domain: Growth
description: |
  Contact information for persons including emails, phone numbers, and push notification tokens.
  Supports multiple contact methods per person with priority ranking and validation status.
  
  **Business Context:**
  - Enables multi-channel communication with users
  - Supports contact preference management
  - Implements contact validation and verification workflows
  - Critical for user authentication and password recovery
  - Used for marketing communications and transactional notifications
  
  **Data Architecture:**
  - One-to-many relationship with person (person_id foreign key)
  - JSONB extra_info field for flexible metadata storage
  - Contact information is sanitized before storage for security
  - Supports contact activation/deactivation for lifecycle management
  
  **Contact Types & Validation:**
  - EMAIL: Email addresses with validation rules and verification status
  - PHONE: Phone numbers with country-specific formatting and SMS verification
  - PUSH_NOTIFICATION: Device tokens for mobile push notifications
  
  **Priority System:**
  - PRIMARY: Main contact method for critical communications
  - SECONDARY: Backup contact method
  - BUSINESS: Business-related communications only

  **PII disclaimer:** This table contains personally identifiable information (PII) subject to LGPD/GDPR. Restrict access to authorized purposes and apply minimum-necessary scope when querying or exporting data.
columns:
  id:
    lineage:
    - datalake_person_raw.contact_info.id
    description: |
      Primary key - Auto-incrementing internal identifier for the contact info record.
      Used for internal database relationships and efficient indexing.
  uuid_contact:
    lineage:
    - datalake_person_raw.contact_info.contactuuid
    description: |
      Business identifier - Unique UUID for this contact information, automatically generated.
      Used for external API references and cross-service communication when referring to specific contact methods.
      PII: Personally identifiable information subject to LGPD/GDPR data protection policies.
  id_person:
    lineage:
    - datalake_person_raw.contact_info.person_id
    description: |
      Foreign key reference to the person table (person.id).
      **Relationship:** Many-to-One with person table
      **Business Rule:** Required field, cannot be null
      **Usage:** Links contact information to the owning person record.
      PII: Links to a natural person — treat as personally identifiable information under LGPD/GDPR.
  contact_info:
    lineage:
    - datalake_person_raw.contact_info.contact_info
    description: |
      The actual contact information value (email address, phone number, or push token).
      **Data Processing:** Subject to sanitization based on contact type
      **Validation:** Format validation applied based on category (email format, phone format, etc.)
      **Indexing:** Indexed for fast lookup during authentication and contact resolution.
      PII: Personally identifiable information subject to LGPD/GDPR data protection policies.
  category:
    lineage:
    - datalake_person_raw.contact_info.category
    description: |
      Contact channel type for this record. Determines validation rules and which notification
      services may deliver messages to this contact.
    categories:
      EMAIL: Email address for digital communication.
      PHONE: Phone number for SMS and voice communication.
      PUSH_NOTIFICATION: Mobile device token for push notifications.
  extra_info:
    lineage:
    - datalake_person_raw.contact_info.extra_info
    description: |
      JSONB field containing additional metadata about the contact information.
      **Structure:** Flexible JSON document supporting various contact-specific attributes
      **Common Fields:** verification_status, country_code, device_info, preferences
      **Usage:** Stores verification tokens, device information, and communication preferences
      **Querying:** Supports JSON queries for filtering and analytics.
      PII: May contain personally identifiable information subject to LGPD/GDPR data protection policies.
  priority:
    lineage:
    - datalake_person_raw.contact_info.priority
    description: |
      Relative priority of this contact among the person's contact methods. Notification
      systems use it to choose the primary channel when multiple contacts exist.
    categories:
      PRIMARY: Main contact method for critical communications.
      SECONDARY: Backup contact used when primary is unavailable.
      BUSINESS: Contact reserved for business and marketing communications.
  version:
    lineage:
    - datalake_person_raw.contact_info.version
    description: |
      Optimistic locking version number for concurrent update protection.
      Incremented automatically on each update to prevent data conflicts.
  is_active:
    lineage:
    - datalake_person_raw.contact_info.is_active
    description: |
      Boolean flag indicating whether this contact method is currently active and should be used for communications.
      **Values:** true (active, can receive communications), false (inactive, should not be contacted)
      **Business Rules:** Inactive contacts are excluded from notification campaigns
      **Lifecycle:** Contacts may be deactivated due to bounces, unsubscribes, or verification failures.
  ts_created:
    lineage:
    - datalake_person_raw.contact_info.created_at
    description: |
      Timestamp when the contact information was first added to the system.
      **Format:** UTC timestamp with timezone information
      **Usage:** Contact acquisition tracking, verification workflow timing, audit trail.
  ts_updated:
    lineage:
    - datalake_person_raw.contact_info.updated_at
    description: |
      Timestamp when the contact information was last modified.
      **Format:** UTC timestamp with timezone information
      **Usage:** Change tracking, verification status updates, preference modifications.
  year:
    lineage:
    - datalake_person_raw.contact_info.year
    description: |
      Table partition column (year). Set from the CDC S3 ingest path date at raw ingestion — not
      derived from ts_updated. Required in WHERE clauses for partition pruning; align filters with the
      DAG load window (load_start_date/load_end_date), not with record update timestamps.
  month:
    lineage:
    - datalake_person_raw.contact_info.month
    description: |
      Table partition column (month, 1–12). Set from the CDC S3 ingest path date at raw ingestion —
      not derived from ts_updated. Must be filtered together with year and day in every query to
      enable partition pruning.
  day:
    lineage:
    - datalake_person_raw.contact_info.day
    description: |
      Table partition column (day, 1–31). Set from the CDC S3 ingest path date at raw ingestion —
      not derived from ts_updated. Always filter with year and month.
      Example: WHERE year = 2026 AND month = 6 AND day BETWEEN 1 AND 7.