---
database_name: datalake_person_clean
table_name: person_identity_aud
owner: isadora.gallerani@quintoandar.com.br
domain: Growth
description: |
  Audit table that captures the complete change history of person identity records. Each row represents
  a historical version of an identity entity, tracking all modifications including value changes, scope updates,
  validation status transitions, and identity type modifications.
  Partitioned by year, month, and day — filter all three partition columns in WHERE for pruning.

  **Audit Functionality:**
  - Complete audit trail for all changes made to the person_identity table
  - Every create, update, and delete operation creates a new audit entry
  - Full data snapshots at each revision point for point-in-time reconstruction
  - Modification flags indicate which specific fields changed in each revision

  **Business Context:**
  - Enables cross-system person identification and deduplication
  - Supports identity resolution from multiple sources (social logins, documents, contacts)
  - Implements validation workflows for identity verification
  - Critical for fraud prevention and account security
  - Enables single sign-on and unified user experience

  **Identity Types & Sources:**
  - **Contact Identities:** EMAIL, PHONE for communication-based identification
  - **Document Identities:** CPF, RFC, PASSPORT for government document matching
  - **Social Identities:** COGNITO, GOOGLE, APPLE for social login integration

  **Scope & Geographic Coverage:**
  - **BR:** Brazil-specific identities (CPF, Brazilian phones/emails)
  - **MX:** Mexico-specific identities (RFC, Mexican phones/emails)
  - **COGNITO_USER_POOL_BR/MX:** Country-specific Cognito user pools

  **Validation & Trust Levels:**
  - **SELF:** User-provided, self-attested information
  - **INTERNAL:** Validated by internal QuintoAndar systems
  - **EXPIRED:** Previously validated but now expired or superseded

  **Data Architecture:**
  - PK: id, rev
  - One-to-many relationship with person_identity (id foreign key)

  **PII disclaimer:** This table contains personally identifiable information (PII) subject to LGPD/GDPR. Restrict access to authorized purposes and apply minimum-necessary scope when querying or exporting data.
columns:
  id:
    lineage:
      - datalake_person_raw.person_identity_aud.id
    description: |
      Original person identity ID from the main table (BIGINT, Not Nullable, Primary Key).
      Combined with rev to form the composite primary key for this audit record.
  rev:
    lineage:
      - datalake_person_raw.person_identity_aud.rev
    description: |
      Hibernate Envers revision number (BIGINT, Not Nullable, Primary Key).
      Global sequence number identifying the transaction that created this audit record.
  rev_type:
    lineage:
      - datalake_person_raw.person_identity_aud.revtype
    description: |
      Hibernate Envers operation code for the change that produced this audit row.
      Used with rev to interpret whether the identity was inserted, updated, or deleted.
    categories:
      "0": Row inserted in person_identity at this revision.
      "1": Existing person_identity row updated at this revision.
      "2": Person_identity row deleted at this revision.
  rev_end:
    lineage:
      - datalake_person_raw.person_identity_aud.revend
    description: |
      Revision number when this record was superseded (BIGINT, Nullable).
      **Active Records:** NULL for current/active revisions
      **Historical Cutoff:** Points to the next revision that replaced this state
      **Query Optimization:** Enables efficient querying of record states within specific time ranges
      **Point-in-time Analysis:** Critical for reconstructing system state at any historical point.
  id_person:
    lineage:
      - datalake_person_raw.person_identity_aud.person_id
    description: |
      Foreign key reference to the person table (person.id).
      **Relationship:** Many-to-One with person table
      **Business Rule:** Required field, cannot be null
      **Usage:** Links identity values to the person they identify
      **Indexing:** Heavily indexed for fast person lookup by identity.
      PII: Links to a natural person — treat as personally identifiable information under LGPD/GDPR.
  value:
    lineage:
      - datalake_person_raw.person_identity_aud.value
    description: |
      The actual identity value used for person matching and resolution.
      **Data Processing:** Sanitized based on identity type (email normalization, phone formatting, etc.)
      **Examples:** "user@example.com", "+5511999999999", "12345678901", "google:user123"
      **Uniqueness:** Combined with scope and type for uniqueness constraints
      **Matching:** Used in identity resolution algorithms and duplicate detection.
      PII: Personally identifiable information subject to LGPD/GDPR data protection policies.
  scope:
    lineage:
      - datalake_person_raw.person_identity_aud.scope
    description: |
      Geographic or system scope captured in this audit snapshot. Defines the context in which
      the identity value is valid for matching and compliance rules.
    categories:
      BR: Brazil-specific identities such as CPF and Brazilian contact identifiers.
      MX: Mexico-specific identities such as RFC and Mexican contact identifiers.
      COGNITO_USER_POOL_BR: Identities scoped to the Brazil Cognito user pool.
      COGNITO_USER_POOL_MX: Identities scoped to the Mexico Cognito user pool.
  type:
    lineage:
      - datalake_person_raw.person_identity_aud.type
    description: |
      Identity channel captured in this audit snapshot. Determines sanitization, validation,
      and duplicate-detection rules applied to the value field.
    categories:
      EMAIL: Email address used for digital identification.
      PHONE: Phone number used for SMS or voice identification.
      CPF: Brazilian individual taxpayer registry identifier.
      RFC: Mexican tax registry identifier.
      PASSPORT: International travel document identifier.
      COGNITO: AWS Cognito user pool identity reference.
      GOOGLE: Google social login identity reference.
      APPLE: Apple social login identity reference.
  validation_type:
    lineage:
      - datalake_person_raw.person_identity_aud.validation_type
    description: |
      Trust level of the identity at this revision point. Drives matching confidence and
      eligibility for high-assurance flows such as account recovery.
    categories:
      SELF: User-provided value not independently verified by QuintoAndar.
      INTERNAL: Value verified by internal QuintoAndar validation systems.
      EXPIRED: Previously verified value whose validation window has lapsed.
  version:
    lineage:
      - datalake_person_raw.person_identity_aud.version
    description: |
      Optimistic locking version at time of revision.
  mod_id_person:
    lineage:
      - datalake_person_raw.person_identity_aud.person_id_mod
    description: |
      Envers change flag set to true when the linked person identifier was modified in this
      revision. Enables point-in-time reconstruction of identity-to-person reassignments.
  mod_value:
    lineage:
      - datalake_person_raw.person_identity_aud.value_mod
    description: |
      Envers change flag set to true when the identity value (email, phone, document, etc.)
      changed in this revision. Used to audit credential or contact updates over time.
      PII: Flags changes to personally identifiable information subject to LGPD/GDPR.
  mod_scope:
    lineage:
      - datalake_person_raw.person_identity_aud.scope_mod
    description: |
      Envers change flag set to true when the geographic or system scope changed in this
      revision. Indicates a shift in jurisdiction or identity pool context.
  mod_type:
    lineage:
      - datalake_person_raw.person_identity_aud.type_mod
    description: |
      Envers change flag set to true when the identity channel classification changed in this
      revision. Signals a reclassification such as email to phone or document type change.
  mod_validation_type:
    lineage:
      - datalake_person_raw.person_identity_aud.validation_type_mod
    description: |
      Envers change flag set to true when the trust level changed in this revision. Tracks
      transitions such as SELF to INTERNAL or INTERNAL to EXPIRED.
  mod_ts_last_validated:
    lineage:
      - datalake_person_raw.person_identity_aud.last_validated_at_mod
    description: |
      Envers change flag set to true when the last validation timestamp changed in this
      revision. Marks when verification was completed or reset on the identity record.
  ts_last_validated:
    lineage:
      - datalake_person_raw.person_identity_aud.last_validated_at
    description: |
      Last successful validation instant stored on the identity at this revision. Null when
      the identity had never been verified before or at the time of this snapshot.
  ts_created:
    lineage:
      - datalake_person_raw.person_identity_aud.created_at
    description: |
      Original identity registration instant as recorded at this revision. Preserves when the
      identity first entered Person service even in historical audit rows.
  ts_updated:
    lineage:
      - datalake_person_raw.person_identity_aud.updated_at
    description: |
      Last modification instant on the identity as recorded at this revision. Reflects the
      update that triggered or accompanied this audit snapshot.
  year:
    lineage:
    - datalake_person_raw.person_identity_aud.year
    description: |
      Table partition column (year). Set from the CDC S3 ingest path date at raw ingestion — not
      derived from ts_updated. Required in WHERE clauses for partition pruning; align filters with the
      DAG load window (load_start_date/load_end_date), not with record update timestamps.
  month:
    lineage:
    - datalake_person_raw.person_identity_aud.month
    description: |
      Table partition column (month, 1–12). Set from the CDC S3 ingest path date at raw ingestion —
      not derived from ts_updated. Must be filtered together with year and day in every query to
      enable partition pruning.
  day:
    lineage:
    - datalake_person_raw.person_identity_aud.day
    description: |
      Table partition column (day, 1–31). Set from the CDC S3 ingest path date at raw ingestion —
      not derived from ts_updated. Always filter with year and month.
      Example: WHERE year = 2026 AND month = 6 AND day BETWEEN 1 AND 7.
