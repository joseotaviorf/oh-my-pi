dag:
  name: reverse_rent_liquidity_score_access
  schedule_start_date: 2026, 04, 22
  owner: Data Growth
  documentation:
    dag_purpose: |
      Reads reverse_rent_liquidity_score.rent_liquidity_score (written by reverse_rent_liquidity_score_load) and sends
      each row to the MasterfeedHouseRentLiquidityScore SQS queue (Prod or Forno).
workflow:
  type: access
  layer: reverse
  custom_schema: reverse_rent_liquidity_score
  load_spark_job: load_into_sqs
  spark_job_arguments:
    - "{dag_name}"
    - "reverse_rent_liquidity_score" # Database name
    - "{table_name}"
  tables_customization:
    rent_liquidity_score: {}
