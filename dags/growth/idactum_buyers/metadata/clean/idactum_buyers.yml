database_name: datalake_idactum_buyers_clean
table_name: idactum_buyers
description:
  Third-party buyer intelligence data sourced from Idactum, capturing the identity
  of purchasers in Brazilian real estate transactions extracted from notary records.
  Used by the Growth team for market analysis, buyer behavior profiling, and demand-side
  competitive intelligence in the real estate market.
domain: Atlas DB
owner: gabriel.mota@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_idactum_buyers_raw.idactum_buyers.id
    description: |
      Surrogate primary key that uniquely identifies a buyer record within this table.
  id_transaction:
    lineage:
      - datalake_idactum_buyers_raw.idactum_buyers.id_transacao
    description: |
      Foreign key linking the buyer to the specific real estate transaction in which they participated as a purchaser.
  id_idactum:
    lineage:
      - datalake_idactum_buyers_raw.idactum_buyers.id_idactum
    description: |
      Idactum's internal identifier for the property unit associated with this buyer's transaction, used to join with other Idactum datasets.
  buyer_name:
    lineage:
      - datalake_idactum_buyers_raw.idactum_buyers.nome
    description: |
      Full legal name of the buyer as recorded in the notary transaction deed.
  buyer_document:
    lineage:
      - datalake_idactum_buyers_raw.idactum_buyers.documento
    description: |
      Brazilian tax identification number of the buyer — CPF for individuals or CNPJ for legal entities — as registered in the transaction.
  is_document_missing_at_some_step:
    lineage:
      - datalake_idactum_buyers_raw.idactum_buyers.doc_faltante_em_algum_ponto
    description: |
      Indicates whether the buyer's identification document was absent at any stage of the transaction registration process, signaling potential data quality issues.
  dt_load:
    lineage:
      - datalake_idactum_buyers_raw.idactum_buyers.dt_load
    description: |
      Date on which this buyer record was ingested from the Idactum source into the data lake.
