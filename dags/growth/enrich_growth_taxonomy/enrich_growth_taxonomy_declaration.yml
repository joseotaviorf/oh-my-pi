dag:
  name: enrich_growth_taxonomy
  schedule_start_date: 2023, 9, 27
  owner: Data Growth
  documentation:
    dag_purpose: |
      This DAG enrich manual inputs to generate Growth Taxonomy related tables that will be used to share Media results and costs between marketing and operation channels.
      More info about Growth Taxonomy and media setup params in [this doc](https://docs.google.com/presentation/d/1BylJwYp9-yoqEqNvzcIvzHLVhZbOOomAjDH5XmIaXtY/edit?usp=sharing).
workflow:
  type: query_delta
  layer: enrich
  default_partitions: [funnel_side]
  default_extraction_type: full
  spark_session_configs:
    udfs: [SF_NORMALIZE_STRING]
  has_hive_sync: false
  inner_dependencies:
    media_setup:
    - media_setup_staging
    supply_taxonomy_dictionary:
    - media_setup
    unified_taxonomy_dictionary:
    - supply_taxonomy_dictionary
  tables_customization:
    media_setup:
      has_hive_sync: true
cluster:
  type: custom_cluster
  databricks_conn_id: databricks_new_env
  custom_configurations:
    driver_node_type_id: m5d.xlarge
    node_type_id: m5d.xlarge
    num_workers: 2
    spark_version: 16.4.x-scala2.12
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
