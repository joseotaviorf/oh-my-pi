custom_cluster: 
  driver_node_type_id: r5d.4xlarge
  node_type_id: m5d.4xlarge
  runtime_engine: PHOTON
  num_workers: 3
  spark_version: 12.2.x-scala2.12
  aws_attributes:
    ebs_volume_size: 200
spark_conf:
  spark.driver.maxResultSize: "0"      


table_task_group_parameters:
  media_setup:
    partition_cols: ['funnel_side']
    has_hive_sync: True
    is_incremental: False
  media_setup_staging:
    partition_cols: ['funnel_side']
    has_hive_sync: True
    is_incremental: False
inner_dependencies:
  media_setup: [media_setup_staging]