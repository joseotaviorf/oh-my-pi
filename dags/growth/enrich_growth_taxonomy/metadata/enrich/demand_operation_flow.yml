---
database_name: datalake_growth_taxonomy
table_name: demand_operation_flow
owner: thiago.jesus@quintoandar.com.br
domain: growth
description: Each row of this table is a combination of growth parameters to describe the operational teams that helped the prospect in it's journey to book a visit or send an offer.
  More info about Growth Taxonomy and media setup params in this doc https://docs.google.com/presentation/d/1BylJwYp9-yoqEqNvzcIvzHLVhZbOOomAjDH5XmIaXtY/edit?usp=sharing
columns:
  id_operation_flow:
    description: 'Unique id for the combination of operation_flow & referral type.'
    lineage:
      - datalake_growth_taxonomy.demand_operation_flow_staging.id_operation_flow
  bk_operation_flow:
    description: 'Combination of product/Amplitude parameters that are key to a taxonomy combination'
    lineage:
      - datalake_growth_taxonomy.demand_operation_flow_staging.bk_operation_flow
  operation_channel:
    description: 'Physical agent, internal or external, who performed the conversion in the funnel stage under analysis'
    categories: 
      SelfService: 'Conversions that took place without the aid of any operation being carried out by the Prospect itself at the time of conversion.'
      Secretaria: 'Conversions that are recorded by the Sales Secretariat'
      CX: 'Conversions that are recorded by CX Operation'
      Agents: 'Conversions that are recorded by the Agents operation'
    lineage:
      - datalake_growth_taxonomy.demand_operation_flow_staging.operation_channel
  referral_type:
    description: 'Grouping of results by type of user prospecting program/initiative. Program/Initiative: Program or initiative that has different types of partners.'
    categories: 
      Agents: 'Third-party brokers who make visits and can prospect tenants.'
      Rede: 'Real estate partners that prospect tenants and such prospecting is encouraged by Fifth Floor.'
      NA: 'This level of characterization is not applicable to the event/context.'
    lineage:
      - datalake_growth_taxonomy.demand_operation_flow_staging.referral_type
  ts_combination_created:
    description: 'Timestamp of when that taxonomy combination was created.'
    lineage:
      - datalake_growth_taxonomy.demand_operation_flow_staging.ts_combination_created
  ts_load:
    description: 'Timestamp of when the table was last loaded.'
    lineage:
      - datalake_growth_taxonomy.demand_operation_flow_staging.ts_load
 