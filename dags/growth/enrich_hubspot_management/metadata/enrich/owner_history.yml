---
database_name: datalake_hubspot
table_name: owner_history
description: |
  Historical tracking table for HubSpot owner changes with daily granularity and comprehensive change attribution. 
  Each row represents a specific day when an owner record was created or modified in HubSpot, capturing the complete 
  evolution of user profiles, team assignments, and contact information. This table enables trend analysis of team 
  structure changes, user lifecycle management, and organizational development patterns.

  **Historical Tracking Features:**
  - Daily snapshots of owner profile changes including team reassignments and contact updates
  - User lifecycle tracking from creation through team transfers and role changes
  - Team structure evolution analysis for organizational development and management optimization
  - Contact information change history for compliance and communication effectiveness
  - Cross-platform user mapping evolution for system integration and data consistency
domain: Growth
owner: vitor.musachio@quintoandar.com.br
columns:
  id_owner:
    lineage:
      - datalake_hubspot_clean.owner.id_owner
    description: Unique identifier of the HubSpot owner (sales rep) in the CRM.
  id_user:
