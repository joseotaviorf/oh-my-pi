---
database_name: datalake_hubspot
table_name: communication_history
description: |
  Historical tracking table for HubSpot communication activity changes with daily granularity and comprehensive multichannel engagement evolution analysis. 
  Each row represents a specific day when a communication record was created or modified in HubSpot, capturing the complete evolution 
  of communication details, outcomes, and cross-channel engagement patterns. This table enables trend analysis of communication 
  effectiveness over time, channel preference evolution, and customer engagement maturity.

  **Historical Tracking Features:**
  - Daily snapshots of communication activity changes including outcome updates and channel effectiveness modifications
  - Cross-channel engagement evolution tracking from initial contact through multichannel relationship development
  - Customer communication preference analysis for channel optimization and personalization strategies
  - Team performance trend tracking with historical communication metrics across all channels
  - Communication strategy effectiveness analysis through channel performance and engagement evolution
domain: Growth
owner: vitor.musachio@quintoandar.com.br
columns:
  id_communication:
    lineage:
      - datalake_hubspot_clean.communication.id_communication
    description: Id of the object. Not a primary key, since there is a new row for each update (limited to the most recent per day).
  ids_associated_tickets:
    lineage:
      - datalake_hubspot_clean.communication.associations
    description: Collection of HubSpot ticket IDs linked to this engagement for customer-support context joins.
  ids_associated_contacts:
    lineage:
      - datalake_hubspot_clean.communication.associations
    description: Collection of HubSpot contact IDs linked to this engagement for stakeholder coverage analysis.
  ids_associated_companies:
    lineage:
      - datalake_hubspot_clean.communication.associations
    description: Collection of HubSpot company IDs linked to this engagement for account-based reporting.
  ids_associated_deals:
    lineage:
      - datalake_hubspot_clean.communication.associations
    description: Collection of HubSpot deal IDs linked to this engagement for revenue attribution and funnel analytics.
  communication_channel_type:
    lineage:
      - datalake_hubspot_clean.communication.properties
    description: The channel type of the message that you sent or received from the contact. Supported values are WHATS_APP, LINKEDIN_MESSAGE, or SMS. Comes from the internal field hs_communication_channel_type.
  communication_logged_from:
    lineage:
      - datalake_hubspot_clean.communication.properties
    description: Enum used to differentiate between conversations objects. Comes from the internal field hs_communication_logged_from.
  communication_body:
    lineage:
      - datalake_hubspot_clean.communication.properties
    description: The text body of the engagement. Comes from the internal field hs_communication_body.
  ts_communication:
    lineage:
      - datalake_hubspot_clean.communication.properties
