---
database_name: datalake_property_dedup_clean
table_name: similar_property
owner: vitor.musachio@quintoandar.com.br
domain: Growth
description: >-
  Clean CDC mirror of the similar_property table from the property-dedup service (one row per
  candidate duplicate evaluation). Each row represents a listing identified by the Vespucio
  geo-search as a potential duplicate of a listing being published; persisted after the rules
  engine evaluation with its address snapshot, per-context ownership and status maps, similarity
  score, and same-owner flag. Primary key: id. Related to duplicity_output via
  duplicity_output.similar_property_id → similar_property.id (one-to-one).
columns:
  id:
    description: >-
      Surrogate primary key generated by the property-dedup service sequence. Unique identifier
      of this candidate similar-property evaluation row.
    lineage:
      - datalake_property_dedup_raw.similar_property.id
  id_property:
    description: >-
      Property identifier on Main (EBDB) for the candidate duplicate listing (houseId). Returned
      by the Vespucio geo-search and enriched via HouseSummary from Main. Candidates with the same
      property_id as the listing being checked are excluded before evaluation.
    lineage:
      - datalake_property_dedup_raw.similar_property.property_id
  id_owner:
    description: >-
      Legacy numeric owner person identifier on Main linked to the candidate property (nullable).
      Used together with uuid_owner to determine is_same_property_owner: evaluates to true if this
      id matches the requesting admin's Main id.
    lineage:
      - datalake_property_dedup_raw.similar_property.owner_id
  id_external:
    description: >-
      External listing or availability identifier for the candidate property as stored in the
      property-dedup service. Candidates sharing the same external_id as the listing being checked
      are excluded from evaluation before any rule is applied.
    lineage:
      - datalake_property_dedup_raw.similar_property.external_id
  uuid_owner:
    description: >-
      UUID of the owner person linked to the candidate property sourced from Main HouseSummary.
      Used together with id_owner to determine is_same_property_owner: evaluates to true if this
      UUID matches the requesting admin's person UUID.
    lineage:
      - datalake_property_dedup_raw.similar_property.owner_uuid
  address:
    description: >-
      JSONB snapshot of the candidate property address captured at evaluation time from the
      Vespucio geo-search result, normalised by the property-dedup service. Null or blank fields
      are omitted from the object. Possible keys: address, number, complement, neighborhood, city,
      state, zipCode, lat, lng, countryCode, floor, building, unit.
    lineage:
      - datalake_property_dedup_raw.similar_property.address
  context_ownership:
    description: >-
      JSONB map of BusinessContext to Ownership for the candidate listing at evaluation time,
      capturing ownership type per business line. Keys are RENT and/or SALE (only contexts
      present on the listing are included). Listings with both keys are called hybrid listings.
      Possible values: FIRST_PARTY (QuintoAndar-owned listing) or THIRD_PARTY (3P broker listing,
      e.g. REDE). STANDARD is a deprecated legacy value no longer produced by the current service.
    lineage:
      - datalake_property_dedup_raw.similar_property.context_ownership
  context_property_status:
    description: >-
      JSONB map of BusinessContext to PropertyStatus for the candidate listing at evaluation time.
      Keys are RENT and/or SALE (only active contexts included; absent key means that business
      context does not exist for this candidate). Possible values: EDITING (listing in draft),
      PUBLISHED (live on the portal), UNPUBLISHED (taken offline by owner or platform),
      SUSPENDED (suspended by the platform), EXCLUDED (opted-out listing).
      OPTED_OUT is a deprecated alias for EXCLUDED no longer produced by the current service.
    lineage:
      - datalake_property_dedup_raw.similar_property.context_property_status
  is_same_property_owner:
    description: >-
      Boolean flag indicating whether the candidate listing owner is the same person as the admin
      who triggered the duplicity check. Determined by matching id_owner with the requesting admin
      Main id OR uuid_owner with the requesting admin person UUID — either match returns true.
      Drives DUPLICATE_PUBLISHED_HOUSE_DIFFERENT_CONTEXT_SAME_OWNER and SAME_OWNER legacy rules.
    lineage:
      - datalake_property_dedup_raw.similar_property.is_same_property_owner
  similarity_score:
    description: >-
      Address similarity score (NUMERIC 10,7) returned by the Vespucio geo-search for this
      candidate match. Represents how closely the candidate address resembles the listing being
      checked. Defaults to 0.0 when the upstream search returns null. Only the legacy standard
      rules engine applies a minimum threshold (15.0) before rule evaluation; the unified and
      third-party engines store the score but do not enforce the threshold inside rule conditions.
    lineage:
      - datalake_property_dedup_raw.similar_property.similarity_score
  ts_property_updated:
    description: >-
      Timestamp of the last property update on Main (HouseSummary.updatedAt) at the time of the
      duplicity check (nullable). Used by recency-based rules: 3P listings updated within 7 days
      or 1P listings updated within 3 months are treated as recent for editing-status rules;
      unpublished updates within 6 months trigger DUPLICATE_*_RECENT_UNPUBLISHED_UPDATE rules.
    lineage:
      - datalake_property_dedup_raw.similar_property.property_updated_at
  ts_created:
    description: >-
      Timestamp when the similar-property row was created in the property-dedup database (UTC,
      set by Hibernate @CreationTimestamp).
    lineage:
      - datalake_property_dedup_raw.similar_property.created_at
  ts_updated:
    description: >-
      Timestamp when the similar-property row was last updated in the property-dedup database
      (UTC, set by Hibernate @UpdateTimestamp).
    lineage:
      - datalake_property_dedup_raw.similar_property.updated_at
  year:
    description: >-
      Partition year extracted from the CDC landing load date, used for Delta table partitioning.
    lineage:
      - datalake_property_dedup_raw.similar_property.year
  month:
    description: >-
      Partition month extracted from the CDC landing load date, used for Delta table partitioning.
    lineage:
      - datalake_property_dedup_raw.similar_property.month
  day:
    description: >-
      Partition day extracted from the CDC landing load date, used for Delta table partitioning.
    lineage:
      - datalake_property_dedup_raw.similar_property.day