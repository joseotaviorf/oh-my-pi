database_name: datalake_property_dedup_clean
table_name: similar_property_aud
owner: henrique.miamoto@quintoandar.com.br
domain: Data Growth
description: It's an audit table that tracks historical changes to similar property information.
columns:
  id:
    description: Dedup identifier
    lineage:
      - datalake_property_dedup_raw.similar_property_aud.id
  id_property:
    description: id_house analyzed
    lineage:
      - datalake_property_dedup_raw.similar_property_aud.property_id
  id_owner:
    description: Landlord identifier
    lineage:
      - datalake_property_dedup_raw.similar_property_aud.owner_id
  context_ownership:
    description: Business context
    lineage:
      - datalake_property_dedup_raw.similar_property_aud.context_ownership
  context_property_status:
    description: Status of the property
    lineage:
      - datalake_property_dedup_raw.similar_property_aud.context_property_status
  is_same_property_owner:
    description: Identifies if the owner is the same for the original and duplicated house.
    lineage:
      - datalake_property_dedup_raw.similar_property_aud.is_same_property_owner
  similarity_score:
    description: Score that measures the house similarity
    lineage:
      - datalake_property_dedup_raw.similar_property_aud.similarity_score
  rev:
    description: Revision identifier
    lineage:
      - datalake_property_dedup_raw.similar_property_aud.rev
  revtype:
    description: Revision type
    lineage:
      - datalake_property_dedup_raw.similar_property_aud.revtype
  revend:
    description: Revision end
    lineage:
      - datalake_property_dedup_raw.similar_property_aud.revend
  ts_created:
    description: Row creation timestamp
    lineage:
      - datalake_property_dedup_raw.similar_property_aud.created_at
  ts_updated:
    description: Row update timestamp
    lineage:
      - datalake_property_dedup_raw.similar_property_aud.updated_at
  year:
    description: Dedup update timestamp
    lineage:
      - datalake_property_dedup_raw.similar_property_aud.year
  month:
    description: Dedup update timestamp
    lineage:
      - datalake_property_dedup_raw.similar_property_aud.month
  day:
    description: Dedup update timestamp
    lineage:
      - datalake_property_dedup_raw.similar_property_aud.day