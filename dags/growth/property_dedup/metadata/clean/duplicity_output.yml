database_name: datalake_property_dedup_clean
table_name: duplicity_output
owner: henrique.miamoto@quintoandar.com.br
domain: Data Growth
description: It's an audit table that tracks historical changes to duplicity output information.
columns:
  id:
    description: Dedup identifier
    lineage:
      - datalake_property_dedup_raw.duplicity_output.id
  id_similar_property:
    description: Similar property id_house
    lineage:
      - datalake_property_dedup_raw.duplicity_output.similar_property_id
  duplicity_reason:
    description: Reason of duplicity
    lineage:
      - datalake_property_dedup_raw.duplicity_output.duplicity_reason
  action_type:
    description: Action taken after duplication
    lineage:
      - datalake_property_dedup_raw.duplicity_output.action_type
  ts_created:
    description: Dedup creation timestamp
    lineage:
      - datalake_property_dedup_raw.duplicity_output.created_at
  ts_updated:
    description: Dedup update timestamp
    lineage:
      - datalake_property_dedup_raw.duplicity_output.updated_at
  year:
    description: Dedup update timestamp
    lineage:
      - datalake_property_dedup_raw.duplicity_output.year
  month:
    description: Dedup update timestamp
    lineage:
      - datalake_property_dedup_raw.duplicity_output.month
  day:
    description: Dedup update timestamp
    lineage:
      - datalake_property_dedup_raw.duplicity_output.day