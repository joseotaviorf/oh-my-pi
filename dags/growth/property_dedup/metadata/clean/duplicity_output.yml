---
database_name: datalake_property_dedup_clean
table_name: duplicity_output
owner: vitor.musachio@quintoandar.com.br
domain: Growth
description: >-
  Clean CDC mirror of the duplicity_output table from the property-dedup service (one row per
  rules-engine outcome). Each row records the result of a deduplication check for one candidate:
  the deduplication reason label that fired and the action type recommended (BLOCK, ALERT, ALLOW).
  Primary key: id. Foreign key: id_similar_property → similar_property.id (one-to-one).
  The rules engine evaluates composite rules in priority
  order and persists only the first match. Rows with action_type ALLOW indicate the candidate
  is not treated as a blocking duplicate by downstream consumers.
columns:
  id:
    description: >-
      Surrogate primary key generated by the property-dedup service sequence. Unique identifier
      of this duplicity outcome row.
    lineage:
      - datalake_property_dedup_raw.duplicity_output.id
  id_similar_property:
    description: >-
      Foreign key to the similar_property row this outcome classifies
      (duplicity_output.similar_property_id → similar_property.id). One-to-one relationship:
      each similar_property row has at most one duplicity_output row, persisted immediately
      after similar_property is saved.
    lineage:
      - datalake_property_dedup_raw.duplicity_output.similar_property_id
  action_type:
    description: >-
      Action recommended by the deduplication rules engine for this candidate. Determines the
      downstream behaviour for the listing being checked: BLOCK prevents publication, ALERT
      raises a warning without blocking, ALLOW indicates the candidate is non-blocking and not
      a confirmed duplicate. The service stops at the first candidate with action_type != ALLOW
      when returning the final result to the caller.
    lineage:
      - datalake_property_dedup_raw.duplicity_output.action_type
    categories:
      BLOCK: "Hard block: the candidate is a confirmed duplicate and the listing being checked must not be published."
      ALERT: "Soft alert: the candidate is a likely duplicate; publication is allowed but a warning is raised for review."
      ALLOW: "Non-blocking: the candidate does not constitute a duplicate for this check; publication proceeds normally."
  duplicity_reason:
    description: >-
      Name of the deduplication rule that fired, or PROPERTY_NOT_DUPLICATED
      when no rule matched. Rules are evaluated in ascending priority order (1 = first to fire).
      Priorities 1–10 belong to the unified engine, 11–18 to the legacy standard engine, 19–22
      to the third-party engine. Only the highest-priority matching rule is stored per evaluation.
    lineage:
      - datalake_property_dedup_raw.duplicity_output.duplicity_reason
    categories:
      DUPLICATE_PUBLISHED_HOUSE_DIFFERENT_CONTEXT_SAME_OWNER: "Unified engine (priority 1). Candidate is published, same owner as requester, but in a different business context than the listing being checked. Action: ALERT."
      DUPLICATE_THIRD_PARTY_PUBLISHED: "Unified engine (priority 2). Third-party (3P/REDE) candidate listing is in PUBLISHED status. Action: BLOCK."
      DUPLICATE_FIRST_PARTY_PUBLISHED: "Unified engine (priority 3). First-party (QuintoAndar-owned) candidate listing is in PUBLISHED status. Action: BLOCK."
      DUPLICATE_THIRD_PARTY_SUSPENDED: "Unified engine (priority 4). Third-party candidate listing is in SUSPENDED status. Action: BLOCK."
      DUPLICATE_FIRST_PARTY_SUSPENDED: "Unified engine (priority 5). First-party candidate listing is in SUSPENDED status. Action: BLOCK."
      DUPLICATE_UNPUBLISHED_HOUSE_UNSAFE_REASONS: "Unified engine (priority 6). Candidate is UNPUBLISHED with an unsafe reason (e.g. OWNER_DOESNT_AGREE, HOUSE_NOT_REACHABLE, HOUSE_NOT_AVAILABLE_REPORTED_BY_AGENT). Action: ALLOW."
      DUPLICATE_UNPUBLISHED_HOUSE_SAFE_REASONS_AVAILABLE_AFTER_UNPUBLISHED: "Unified engine (priority 7). Candidate is UNPUBLISHED with a safe reason and the new listing becomes available after the unpublish timestamp. Action: ALLOW."
      DUPLICATE_UNPUBLISHED_HOUSE_SAFE_REASONS_AVAILABLE_BEFORE_UNPUBLISHED: "Unified engine (priority 8). Candidate is UNPUBLISHED with a safe reason and the new listing becomes available before the unpublish timestamp. Action: ALERT."
      DUPLICATE_HOUSE_NOT_RECENT_EDITING_STATUS: "Unified engine (priority 9). Candidate is in EDITING status but outside the recency window (3P > 7 days, 1P > 2 months since statusSetAt). Action: ALLOW."
      DUPLICATE_HOUSE_RECENT_EDITING_STATUS: "Unified engine (priority 10). Candidate is in EDITING status and within the recency window (3P within 7 days, 1P within 2 months since statusSetAt). Action: ALERT."
      DUPLICATE_3P_HYBRID_CONTEXT_AFTER_PUBLISH_STATUS: "Legacy standard engine (priority 11). 3P hybrid context (both RENT and SALE) candidate in post-publish status (PUBLISHED or SUSPENDED), score >= 15.0. Action: BLOCK."
      DUPLICATE_3P_RENT_AFTER_PUBLISH_STATUS: "Legacy standard engine (priority 12). 3P RENT-only context candidate in post-publish status, score >= 15.0. Action: BLOCK."
      DUPLICATE_3P_SALE_AFTER_PUBLISH_STATUS: "Legacy standard engine (priority 13). 3P SALE-only context candidate in post-publish status, score >= 15.0. Action: BLOCK."
      DUPLICATE_DIFFERENT_OWNER_AFTER_PUBLISH_STATUS: "Legacy standard engine (priority 14). Different-owner candidate in post-publish status, score >= 15.0. Action: BLOCK."
      DUPLICATE_SAME_OWNER_AFTER_PUBLISH_STATUS: "Legacy standard engine (priority 15). Same-owner candidate in post-publish status, score >= 15.0. Action: ALERT."
      DUPLICATE_3P_BEFORE_PUBLISH_STATUS: "Legacy standard engine (priority 16). 3P candidate in pre-publish status (UNPUBLISHED or EDITING), score >= 15.0. Action: ALERT."
      DUPLICATE_DIFFERENT_OWNER_BEFORE_PUBLISH_STATUS: "Legacy standard engine (priority 17). Different-owner candidate in pre-publish status, score >= 15.0. Action: ALLOW."
      DUPLICATE_SAME_OWNER_BEFORE_PUBLISH_STATUS: "Legacy standard engine (priority 18). Same-owner candidate in pre-publish status, score >= 15.0. Action: ALLOW."
      DUPLICATE_FIRST_PARTY_RECENT_EDITING_UPDATE: "Third-party engine (priority 19). 1P candidate in SALE context with a recent editing update (property_updated_at within 3 months). Action: BLOCK."
      DUPLICATE_FIRST_PARTY_RECENT_UNPUBLISHED_UPDATE: "Third-party engine (priority 20). 1P candidate in SALE context with a recent unpublished update (property_updated_at within 6 months). Action: BLOCK."
      DUPLICATE_THIRD_PARTY_RECENT_EDITING_UPDATE: "Third-party engine (priority 21). 3P candidate with a recent editing update (property_updated_at within 7 days). Action: BLOCK."
      DUPLICATE_THIRD_PARTY_RECENT_UNPUBLISHED_UPDATE: "Third-party engine (priority 22). 3P candidate with a recent unpublished update (property_updated_at within 6 months). Action: BLOCK."
      PROPERTY_NOT_DUPLICATED: "Default fallback (priority 23). No deduplication rule matched; the candidate is not a duplicate for this check. Action: ALLOW."
  ts_created:
    description: >-
      Timestamp when the duplicity output row was created in the property-dedup database (UTC,
      set by Hibernate @CreationTimestamp).
    lineage:
      - datalake_property_dedup_raw.duplicity_output.created_at
  ts_updated:
    description: >-
      Timestamp when the duplicity output row was last updated in the property-dedup database
      (UTC, set by Hibernate @UpdateTimestamp).
    lineage:
      - datalake_property_dedup_raw.duplicity_output.updated_at
  year:
    description: >-
      Partition year extracted from the CDC landing load date, used for Delta table partitioning.
    lineage:
      - datalake_property_dedup_raw.duplicity_output.year
  month:
    description: >-
      Partition month extracted from the CDC landing load date, used for Delta table partitioning.
    lineage:
      - datalake_property_dedup_raw.duplicity_output.month
  day:
    description: >-
      Partition day extracted from the CDC landing load date, used for Delta table partitioning.
    lineage:
      - datalake_property_dedup_raw.duplicity_output.day
  op_cdc:
    lineage:
      - datalake_property_dedup_raw.duplicity_output.op_cdc
    description: CDC operation type captured by Debezium change-data-capture stream.
    categories:
      r: Read/snapshot - initial load of existing records.
      c: Create - new record inserted.
      u: Update - existing record modified.
      d: Delete - record removed.
  ts_cdc_transaction:
    lineage:
      - datalake_property_dedup_raw.duplicity_output.ts_cdc_transaction
    description: Wall-clock timestamp when the CDC connector captured this change event (millisecond precision).
  ts_database_transaction:
    lineage:
      - datalake_property_dedup_raw.duplicity_output.ts_database_transaction
    description: Timestamp of the originating database transaction in the source application before CDC propagation.