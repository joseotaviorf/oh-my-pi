---
database_name: datalake_property_dedup_clean
table_name: dedup_contextual_cep_neighborhood_shadow_audit
owner: vitor.musachio@quintoandar.com.br
domain: Growth
description: >-
  Clean CDC mirror of the dedup_contextual_cep_neighborhood_shadow_audit table from the property-dedup
  service. Each row captures a shadow comparison of the contextual CEP neighborhood filter: vespucio
  search and duplicity actions with vs without neighborhood matching on the same 5-digit CEP prefix.
  Rows are written in two phases: a sync insert (search hit counts and hit ID sets) and an optional
  async update (full duplicity pipeline actions). Primary key: id. Grain: one row per audited dedup
  request when contextual CEP neighborhood shadow mode is enabled.
columns:
  id:
    description: >-
      Surrogate primary key generated by the property-dedup service sequence. Unique identifier
      of this contextual CEP neighborhood shadow audit row.
    lineage:
      - datalake_property_dedup_raw.dedup_contextual_cep_neighborhood_shadow_audit.id
  id_external:
    description: >-
      Partner-provided external listing identifier for the property being checked (nullable).
    lineage:
      - datalake_property_dedup_raw.dedup_contextual_cep_neighborhood_shadow_audit.external_id
  id_property:
    description: >-
      Internal Main house ID from the availability context (nullable for new listings).
    lineage:
      - datalake_property_dedup_raw.dedup_contextual_cep_neighborhood_shadow_audit.property_id
  id_trace:
    description: >-
      Distributed trace ID for correlating this audit row with application logs.
    lineage:
      - datalake_property_dedup_raw.dedup_contextual_cep_neighborhood_shadow_audit.trace_id
  request_state:
    description: >-
      State from the dedup request used for contextual CEP geo matching (e.g. São Paulo or SP).
    lineage:
      - datalake_property_dedup_raw.dedup_contextual_cep_neighborhood_shadow_audit.request_state
  request_city:
    description: >-
      City from the dedup request used for contextual CEP geo matching.
    lineage:
      - datalake_property_dedup_raw.dedup_contextual_cep_neighborhood_shadow_audit.request_city
  request_neighborhood:
    description: >-
      Neighborhood from the dedup request; compared against hit neighborhoods when the neighborhood
      filter is applied in the shadow branch.
    lineage:
      - datalake_property_dedup_raw.dedup_contextual_cep_neighborhood_shadow_audit.request_neighborhood
  request_cep_prefix:
    description: >-
      First five digits of the request postal code used by the contextual CEP filter.
    lineage:
      - datalake_property_dedup_raw.dedup_contextual_cep_neighborhood_shadow_audit.request_cep_prefix
  vespucio_total_hits:
    description: >-
      Total number of Elasticsearch hits returned by vespucio-search before CEP filtering.
    lineage:
      - datalake_property_dedup_raw.dedup_contextual_cep_neighborhood_shadow_audit.vespucio_total_hits
  production_filter_mode:
    description: >-
      CEP filter mode active in production for this request.
    lineage:
      - datalake_property_dedup_raw.dedup_contextual_cep_neighborhood_shadow_audit.production_filter_mode
    categories:
      STRICT_EIGHT_DIGIT: Strict 8-digit postal code match.
      CONTEXTUAL_FIVE_DIGIT: Contextual 5-digit prefix with geo matching.
  hits_with_neighborhood_filter:
    description: >-
      Number of hits remaining after contextual CEP filter with neighborhood matching enabled.
    lineage:
      - datalake_property_dedup_raw.dedup_contextual_cep_neighborhood_shadow_audit.hits_with_neighborhood_filter
  hits_without_neighborhood_filter:
    description: >-
      Number of hits remaining after contextual CEP filter with neighborhood matching disabled.
    lineage:
      - datalake_property_dedup_raw.dedup_contextual_cep_neighborhood_shadow_audit.hits_without_neighborhood_filter
  hit_ids_with_neighborhood:
    description: >-
      JSON array of Main house IDs that survive the CEP filter when neighborhood matching is applied.
    lineage:
      - datalake_property_dedup_raw.dedup_contextual_cep_neighborhood_shadow_audit.hit_ids_with_neighborhood
  hit_ids_without_neighborhood:
    description: >-
      JSON array of Main house IDs that survive the CEP filter when neighborhood matching is skipped.
    lineage:
      - datalake_property_dedup_raw.dedup_contextual_cep_neighborhood_shadow_audit.hit_ids_without_neighborhood
  cep_filtered_diverged:
    description: >-
      True when post-CEP hit ID sets differ between with-neighborhood and without-neighborhood
      branches; indicates the neighborhood filter changes which candidates proceed.
    lineage:
      - datalake_property_dedup_raw.dedup_contextual_cep_neighborhood_shadow_audit.cep_filtered_diverged
  action_with_neighborhood:
    description: >-
      Strictest duplicity action (BLOCK, ALERT, or ALLOW) from the full pipeline for hits with
      neighborhood filter. Null until the async phase completes.
    lineage:
      - datalake_property_dedup_raw.dedup_contextual_cep_neighborhood_shadow_audit.action_with_neighborhood
    categories:
      BLOCK: Hard block — duplicate confirmed for hits with neighborhood filter.
      ALERT: Soft alert — likely duplicate for hits with neighborhood filter.
      ALLOW: Non-blocking for hits with neighborhood filter.
  action_without_neighborhood:
    description: >-
      Strictest duplicity action from the full pipeline for hits without neighborhood filter.
      Null until the async phase completes.
    lineage:
      - datalake_property_dedup_raw.dedup_contextual_cep_neighborhood_shadow_audit.action_without_neighborhood
    categories:
      BLOCK: Hard block — duplicate confirmed for hits without neighborhood filter.
      ALERT: Soft alert — likely duplicate for hits without neighborhood filter.
      ALLOW: Non-blocking for hits without neighborhood filter.
  actions_match:
    description: >-
      True when with-neighborhood and without-neighborhood branches produce the same action; false
      means enabling neighborhood matching would change the production decision. Null when async
      was not executed.
    lineage:
      - datalake_property_dedup_raw.dedup_contextual_cep_neighborhood_shadow_audit.actions_match
  async_evaluated:
    description: True after the async enrichment phase completes successfully.
    lineage:
      - datalake_property_dedup_raw.dedup_contextual_cep_neighborhood_shadow_audit.async_evaluated
  ts_async_completed:
    description: Timestamp of async phase completion; null if async has not run.
    lineage:
      - datalake_property_dedup_raw.dedup_contextual_cep_neighborhood_shadow_audit.async_completed_at
  ts_decision:
    description: >-
      Timestamp when the sync audit row was persisted (UTC).
    lineage:
      - datalake_property_dedup_raw.dedup_contextual_cep_neighborhood_shadow_audit.ts_decision
  ts_created:
    description: >-
      Timestamp when the audit row was created in the property-dedup database (UTC).
    lineage:
      - datalake_property_dedup_raw.dedup_contextual_cep_neighborhood_shadow_audit.created_at
  ts_updated:
    description: >-
      Timestamp when the audit row was last updated in the property-dedup database (UTC).
    lineage:
      - datalake_property_dedup_raw.dedup_contextual_cep_neighborhood_shadow_audit.updated_at
  year:
    description: >-
      Partition year extracted from the CDC landing load date, used for Delta table partitioning.
    lineage:
      - datalake_property_dedup_raw.dedup_contextual_cep_neighborhood_shadow_audit.year
  month:
    description: >-
      Partition month extracted from the CDC landing load date, used for Delta table partitioning.
    lineage:
      - datalake_property_dedup_raw.dedup_contextual_cep_neighborhood_shadow_audit.month
  day:
    description: >-
      Partition day extracted from the CDC landing load date, used for Delta table partitioning.
    lineage:
      - datalake_property_dedup_raw.dedup_contextual_cep_neighborhood_shadow_audit.day
  op_cdc:
    lineage:
      - datalake_property_dedup_raw.dedup_contextual_cep_neighborhood_shadow_audit.op_cdc
    description: CDC operation type captured by Debezium change-data-capture stream.
    categories:
      r: Read/snapshot - initial load of existing records.
      c: Create - new record inserted.
      u: Update - existing record modified.
      d: Delete - record removed.
  ts_cdc_transaction:
    lineage:
      - datalake_property_dedup_raw.dedup_contextual_cep_neighborhood_shadow_audit.ts_cdc_transaction
    description: Wall-clock timestamp when the CDC connector captured this change event (millisecond precision).
  ts_database_transaction:
    lineage:
      - datalake_property_dedup_raw.dedup_contextual_cep_neighborhood_shadow_audit.ts_database_transaction
    description: Timestamp of the originating database transaction in the source application before CDC propagation.
