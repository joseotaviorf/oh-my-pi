---
database_name: datalake_property_dedup_clean
table_name: dedup_complement_parse_audit
owner: vitor.musachio@quintoandar.com.br
domain: Growth
description: >-
  Clean CDC mirror of the dedup_complement_parse_audit table from the property-dedup service.
  Each row captures a complement parser shadow comparison (legacy regex vs Atlas address-parser)
  for a single dedup request. Rows are written in two phases: a sync insert (parser inputs/outputs,
  pre- and post-CEP hit ID sets) and an optional async update (full duplicity pipeline actions).
  Primary key: id. Grain: one row per audited dedup request when complement parser audit is enabled.
columns:
  id:
    description: >-
      Surrogate primary key generated by the property-dedup service sequence. Unique identifier
      of this complement parser audit row.
    lineage:
      - datalake_property_dedup_raw.dedup_complement_parse_audit.id
  id_external:
    description: >-
      Partner-provided external listing identifier for the property being checked (nullable).
    lineage:
      - datalake_property_dedup_raw.dedup_complement_parse_audit.external_id
  id_property:
    description: >-
      Internal Main house ID from the availability context (nullable for new listings).
    lineage:
      - datalake_property_dedup_raw.dedup_complement_parse_audit.property_id
  id_trace:
    description: >-
      Distributed trace ID for correlating this audit row with application logs.
    lineage:
      - datalake_property_dedup_raw.dedup_complement_parse_audit.trace_id
  complement_raw:
    description: >-
      Original complement string from the dedup request (e.g. apartment and building labels).
      May contain location-related text; handle as light PII.
    lineage:
      - datalake_property_dedup_raw.dedup_complement_parse_audit.complement_raw
  mode_requested:
    description: >-
      Complement parser mode requested via HTTP header for this dedup check.
    lineage:
      - datalake_property_dedup_raw.dedup_complement_parse_audit.mode_requested
    categories:
      LEGACY: Legacy regex parser only.
      ATLAS: Atlas address-parser service only.
      AUTO: Atlas with legacy fallback on failure.
      SHADOW: Run both parsers and compare outcomes without changing production behaviour.
  strategy_used:
    description: >-
      Parser strategy that was actually executed for this request.
    lineage:
      - datalake_property_dedup_raw.dedup_complement_parse_audit.strategy_used
    categories:
      NONE: Complement was empty; no parser ran.
      LEGACY: Only the legacy regex parser ran.
      ATLAS: Atlas address-parser ran successfully.
      LEGACY_FALLBACK: Atlas was attempted but failed; legacy parser was used instead.
  fallback_reason:
    description: >-
      Exception message or reason when Atlas fallback occurred; null when no fallback happened.
    lineage:
      - datalake_property_dedup_raw.dedup_complement_parse_audit.fallback_reason
  legacy_unit:
    description: Unit component extracted by the legacy regex parser.
    lineage:
      - datalake_property_dedup_raw.dedup_complement_parse_audit.legacy_unit
  legacy_building:
    description: Building component extracted by the legacy regex parser.
    lineage:
      - datalake_property_dedup_raw.dedup_complement_parse_audit.legacy_building
  legacy_empty:
    description: True when the legacy parser extracted no components from the complement.
    lineage:
      - datalake_property_dedup_raw.dedup_complement_parse_audit.legacy_empty
  atlas_unit:
    description: Unit component extracted by the Atlas address-parser service.
    lineage:
      - datalake_property_dedup_raw.dedup_complement_parse_audit.atlas_unit
  atlas_building:
    description: Building component extracted by the Atlas address-parser service.
    lineage:
      - datalake_property_dedup_raw.dedup_complement_parse_audit.atlas_building
  atlas_empty:
    description: >-
      True when Atlas returned no components; null when Atlas was not called.
    lineage:
      - datalake_property_dedup_raw.dedup_complement_parse_audit.atlas_empty
  atlas_error:
    description: Error message when Atlas failed; null on success or when Atlas was not called.
    lineage:
      - datalake_property_dedup_raw.dedup_complement_parse_audit.atlas_error
  components_match:
    description: >-
      True when legacy and Atlas extracted the same unit and building (case-insensitive,
      normalized). Key metric: if true, switching parsers has no effect on the search query.
    lineage:
      - datalake_property_dedup_raw.dedup_complement_parse_audit.components_match
  primary_total_hits:
    description: Number of Elasticsearch hits returned by the primary (production) search.
    lineage:
      - datalake_property_dedup_raw.dedup_complement_parse_audit.primary_total_hits
  shadow_total_hits:
    description: Number of Elasticsearch hits returned by the shadow search.
    lineage:
      - datalake_property_dedup_raw.dedup_complement_parse_audit.shadow_total_hits
  search_diverged:
    description: >-
      True when primary and shadow Elasticsearch result sets differ (different hit IDs or totals).
    lineage:
      - datalake_property_dedup_raw.dedup_complement_parse_audit.search_diverged
  primary_hit_ids_pre_cep:
    description: >-
      JSON array of Main house IDs returned by vespucio-search before the postal-code filter
      on the primary side (e.g. [101,205,312]).
    lineage:
      - datalake_property_dedup_raw.dedup_complement_parse_audit.primary_hit_ids_pre_cep
  shadow_hit_ids_pre_cep:
    description: >-
      JSON array of Main house IDs returned by vespucio-search before the postal-code filter
      on the shadow side (e.g. [101,205,312]).
    lineage:
      - datalake_property_dedup_raw.dedup_complement_parse_audit.shadow_hit_ids_pre_cep
  primary_hit_ids_post_cep:
    description: >-
      JSON array of Main house IDs after the postal-code filter on the primary side.
    lineage:
      - datalake_property_dedup_raw.dedup_complement_parse_audit.primary_hit_ids_post_cep
  shadow_hit_ids_post_cep:
    description: >-
      JSON array of Main house IDs after the postal-code filter on the shadow side.
    lineage:
      - datalake_property_dedup_raw.dedup_complement_parse_audit.shadow_hit_ids_post_cep
  cep_filtered_diverged:
    description: >-
      True when post-CEP hit ID sets differ between primary and shadow; indicates the parser
      change would alter which properties survive the CEP filter.
    lineage:
      - datalake_property_dedup_raw.dedup_complement_parse_audit.cep_filtered_diverged
  action_primary:
    description: >-
      Strictest duplicity action (BLOCK, ALERT, or ALLOW) from the full pipeline for primary hits.
      Null until the async phase completes.
    lineage:
      - datalake_property_dedup_raw.dedup_complement_parse_audit.action_primary
    categories:
      BLOCK: Hard block — duplicate confirmed for primary hits.
      ALERT: Soft alert — likely duplicate for primary hits.
      ALLOW: Non-blocking for primary hits.
  action_shadow:
    description: >-
      Strictest duplicity action from the full pipeline for shadow hits. Null until async completes.
    lineage:
      - datalake_property_dedup_raw.dedup_complement_parse_audit.action_shadow
    categories:
      BLOCK: Hard block — duplicate confirmed for shadow hits.
      ALERT: Soft alert — likely duplicate for shadow hits.
      ALLOW: Non-blocking for shadow hits.
  actions_match:
    description: >-
      True when primary and shadow produce the same action; false means switching parsers would
      change the production decision. Null when async was not executed.
    lineage:
      - datalake_property_dedup_raw.dedup_complement_parse_audit.actions_match
  async_evaluated:
    description: True after the async enrichment phase completes successfully.
    lineage:
      - datalake_property_dedup_raw.dedup_complement_parse_audit.async_evaluated
  ts_async_completed:
    description: Timestamp of async phase completion; null if async has not run.
    lineage:
      - datalake_property_dedup_raw.dedup_complement_parse_audit.async_completed_at
  ts_decision:
    description: >-
      Timestamp when the sync audit row was persisted (UTC).
    lineage:
      - datalake_property_dedup_raw.dedup_complement_parse_audit.ts_decision
  ts_created:
    description: >-
      Timestamp when the audit row was created in the property-dedup database (UTC).
    lineage:
      - datalake_property_dedup_raw.dedup_complement_parse_audit.created_at
  ts_updated:
    description: >-
      Timestamp when the audit row was last updated in the property-dedup database (UTC).
    lineage:
      - datalake_property_dedup_raw.dedup_complement_parse_audit.updated_at
  year:
    description: >-
      Partition year extracted from the CDC landing load date, used for Delta table partitioning.
    lineage:
      - datalake_property_dedup_raw.dedup_complement_parse_audit.year
  month:
    description: >-
      Partition month extracted from the CDC landing load date, used for Delta table partitioning.
    lineage:
      - datalake_property_dedup_raw.dedup_complement_parse_audit.month
  day:
    description: >-
      Partition day extracted from the CDC landing load date, used for Delta table partitioning.
    lineage:
      - datalake_property_dedup_raw.dedup_complement_parse_audit.day
  op_cdc:
    lineage:
      - datalake_property_dedup_raw.dedup_complement_parse_audit.op_cdc
    description: CDC operation type captured by Debezium change-data-capture stream.
    categories:
      r: Read/snapshot - initial load of existing records.
      c: Create - new record inserted.
      u: Update - existing record modified.
      d: Delete - record removed.
  ts_cdc_transaction:
    lineage:
      - datalake_property_dedup_raw.dedup_complement_parse_audit.ts_cdc_transaction
    description: Wall-clock timestamp when the CDC connector captured this change event (millisecond precision).
  ts_database_transaction:
    lineage:
      - datalake_property_dedup_raw.dedup_complement_parse_audit.ts_database_transaction
    description: Timestamp of the originating database transaction in the source application before CDC propagation.
