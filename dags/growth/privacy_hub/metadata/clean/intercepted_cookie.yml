---
database_name: datalake_privacy_hub_clean
table_name: intercepted_cookie
domain: Growth
owner: isadora.gallerani@quintoandar.com.br
description: |
  Clean layer for cookies detected (intercepted) on QuintoAndar websites before or during catalogue
  registration in Privacy Hub (PostgreSQL source: privacy_hub.public.intercepted_cookie). One row per
  detected cookie instance per website scan — captures name, domain, script URL, TTL, and catalogue
  status. Used by Privacy Hub's cookie scanner to identify uncatalogued third-party cookies that require
  classification and consent banner updates. Join to cookie via id_website for site-level inventory
  reconciliation. Part of the privacy_hub DAG (daily CDC).
columns:
  id:
    description: |
      Primary key of the intercepted cookie detection record in Privacy Hub. Each row represents a
      single cookie observed during a website scan.
    lineage:
      - datalake_privacy_hub_raw.intercepted_cookie.id
  id_website:
    description: |
      Identifier of the website where the cookie was detected. Join key to cookie and website
      registry tables for site-level cookie inventory analysis.
    lineage:
      - datalake_privacy_hub_raw.intercepted_cookie.website_id
  name:
    description: |
      Cookie name as detected by the Privacy Hub scanner (e.g. _ga, session_id). Used to match
      against catalogued cookies or flag new uncatalogued entries.
    lineage:
      - datalake_privacy_hub_raw.intercepted_cookie.name
  script_url:
    description: |
      URL of the JavaScript script that set or manages the detected cookie. Helps identify the
      third-party vendor responsible for the cookie.
    lineage:
      - datalake_privacy_hub_raw.intercepted_cookie.script_url
  domain:
    description: |
      Domain scope of the intercepted cookie (e.g. .quintoandar.com.br or a third-party domain).
      Determines cross-site tracking behaviour and consent requirements.
    lineage:
      - datalake_privacy_hub_raw.intercepted_cookie.domain
  ttl:
    description: |
      Time-to-live of the cookie as detected during the scan, indicating how long the cookie persists
      in the browser (session or expiry duration string from the scanner).
    lineage:
      - datalake_privacy_hub_raw.intercepted_cookie.ttl
  version:
    description: |
      Version number of the intercepted cookie record in Privacy Hub. Increments when scan metadata is
      updated on subsequent detections.
    lineage:
      - datalake_privacy_hub_raw.intercepted_cookie.version
  is_catalogued:
    description: |
      Flag indicating whether this intercepted cookie has been matched and registered in the Privacy
      Hub cookie catalogue (cookie table). False means the cookie still requires classification.
    lineage:
      - datalake_privacy_hub_raw.intercepted_cookie.is_catalogued
  ts_updated_at:
    description: |
      Timestamp when the intercepted cookie record was last updated in Privacy Hub. Used as the basis
      for incremental CDC loads and partition derivation.
    lineage:
      - datalake_privacy_hub_raw.intercepted_cookie.updated_at
  ts_created_at:
    description: |
      Timestamp when the cookie was first detected and recorded in Privacy Hub (created_at in source).
    lineage:
      - datalake_privacy_hub_raw.intercepted_cookie.created_at
  year:
    description: |
      Table partition column (year). Derived from ts_updated_at at clean ingestion. Required in WHERE
      clauses for partition pruning — always combine with month and day.
    lineage:
      - datalake_privacy_hub_raw.intercepted_cookie.updated_at
  month:
    description: |
      Table partition column (month, 1–12). Derived from ts_updated_at. Must be filtered together with
      year and day in every query to enable partition pruning.
    lineage:
      - datalake_privacy_hub_raw.intercepted_cookie.updated_at
  day:
    description: |
      Table partition column (day, 1–31). Derived from ts_updated_at. Always filter with year and month.
      Example: WHERE year = 2026 AND month = 6 AND day BETWEEN 1 AND 7.
    lineage:
      - datalake_privacy_hub_raw.intercepted_cookie.updated_at
