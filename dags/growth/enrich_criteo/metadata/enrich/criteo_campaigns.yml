database_name: datalake_criteo
table_name: criteo_campaigns  
owner: henrique.paulo@quintoandar.com.br
domain: Growth
description: Criteo paid media campaign performance report broken down by advertiser, campaign, ad set, and geographic region.
  Data is sourced from a Google Sheets file sent by the Criteo team and loaded incrementally by report date.
  Partitioned by `year`, `month` and `day`, always use these columns in the WHERE clause to enable partition pruning.
columns:
  id_advertiser:
    description: Unique identifier of the Criteo advertiser account.
    lineage:
      - datalake_gsheets_clean.criteo_costs.id_advertiser
  id_campaign:
    description: Unique identifier of the Criteo campaign.
    lineage:
      - datalake_gsheets_clean.criteo_costs.id_campaign
  id_ad_set:
    description: Unique identifier of the ad set within the campaign.
    lineage:
      - datalake_gsheets_raw.criteo_costs.id_ad_set
  advertiser_name:
    description: Display name of the Criteo advertiser account.
    lineage:
      - datalake_gsheets_clean.criteo_costs.advertiser_name
  campaign_name:
    description: Display name of the Criteo campaign.
    lineage:
      - datalake_gsheets_clean.criteo_costs.campaign_name
  ad_set:
    description: Display name of the ad set within the campaign.
    lineage:
      - datalake_gsheets_clean.criteo_costs.ad_set
  region:
    description: Geographic region targeted by the campaign ad set.
    lineage:
      - datalake_gsheets_clean.criteo_costs.region
  zip_code:
    description: Zip code of the geographic region targeted by the campaign ad set.
    lineage:
      - datalake_gsheets_clean.criteo_costs.zip_code
  cost:
    description: Total media spend for the campaign ad set on the report date, in the advertiser's currency.
    lineage:
      - datalake_gsheets_clean.criteo_costs.cost
  clicks:
    description: Total number of clicks recorded for the campaign ad set on the report date.
    lineage:
      - datalake_gsheets_clean.criteo_costs.clicks
  displays:
    description: Total number of ad impressions (displays) served for the campaign ad set on the report date.
    lineage:
      - datalake_gsheets_clean.criteo_costs.displays
  dt_report:
    description: Date to which the campaign performance metrics in this row refer.
    lineage:
      - datalake_gsheets_clean.criteo_costs.dt_report
  ts_load:
    description: Timestamp when the row was ingested into the data lake.
    lineage:
      - datalake_gsheets_clean.criteo_costs.ts_load
  year:
    description: Calendar year of dt_report, used as partition column.
    lineage:
      - datalake_gsheets_clean.criteo_costs.dt_report
  month:
    description: Calendar month of dt_report, used as partition column.
    lineage:
      - datalake_gsheets_clean.criteo_costs.dt_report
  day:
    description: Calendar day of dt_report, used as partition column.
    lineage:
      - datalake_gsheets_clean.criteo_costs.dt_report