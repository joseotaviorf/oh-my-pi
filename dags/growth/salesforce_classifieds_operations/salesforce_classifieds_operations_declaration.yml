dag:
  name: salesforce_classifieds_operations
  owner: Data Growth
  schedule_start_date: 2026, 9, 1
  schedule_interval: 0 0 * * *
  documentation:
    dag_purpose: |
      Ingests Salesforce Operations data for the Classifieds (Navent) business context via the Salesforce
      REST API. Raw snapshots land in datalake_salesforce_classifieds_raw; clean models in datalake_salesforce_classifieds_clean
      support Growth analytics on support cases, messaging, portal billing, and approval processes for the Navent Operations org.
workflow:
  type: custom_ingestion
  layer: raw
  custom_schema: salesforce_classifieds
  load_spark_job: load_salesforce_classifieds_raw
  spark_job_arguments:
    - "{environment}"
    - "{bucket}"
    - "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    - "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
    - "{table_name}"
    - "{partitions}"
    - "{schema}"
    - "https://navent--uat.sandbox.my.salesforce.com"
    - "https://navent.my.salesforce.com"

  default_extraction_type: incremental
  default_partitions: [year, month, day]
  tables_customization:
    cases:
      clean_table_name: support_case
      extra_spark_job_arguments:
        - "SELECT AccountId, botmakerglobal__BotmakerId__c, CaseNumber, ClosedDate, Codigo_Postal__c, Comments, Condicion_fiscal__c, ContactEmail, ContactFax, ContactId, ContactMobile, ContactPhone, CreatedById, CreatedDate, CurrencyIsoCode, Datos_bancarios__c, Description, Dias_Transcurridos__c, Direccion_del_cliente__c, Email_envio_comprobante_de_devolucion__c, Email_para_validacion__c, Fecha_de_entrega__c, Fecha_de_pago__c, Id, ID_Genesys__c, ID_pedido_SAP__c, Importe__c, IsClosed, IsDeleted, IsEscalated, LastModifiedById, LastModifiedDate, LastReferencedDate, LastViewedDate, MasterRecordId, Monto_sin_impuestos__c, Nombre_de_Integrador__c, Nombre_del_cliente_Razon_social__c, Nuevo_email__c, Nuevo_numero_OS__c, Numero_de_factura__c, Numero_de_la_oportunidad__c, Oportunidad__c, Orden_de_servicio__c, Organizacion_de_venta_picklist__c, Origin, OwnerId, Pais__c, ParentId, Priority, Reason, RecordTypeId, Se_requiere_reenviar_la_factura__c, SourceId, Status, Subject, Subtipo__c, SuppliedCompany, SuppliedEmail, SuppliedName, SuppliedPhone, SystemModstamp, Ticket_JIRA__c, Tipo_de_pago__c, Total_de_expectativas_de_PI_Leads__c, Type, Valor_total_del_PI__c, whatslly__Created_by_Whatslly__c FROM Case"
        - "LastModifiedDate"
    Task:
      clean_table_name: task
      extra_spark_job_arguments:
        - "SELECT AccountId, ActivityDate, Call_Ani__c, CallDisposition, CallDurationInSeconds, Called_Number__c, CallObject, CallType, CompletedDateTime, Conversation_Id__c, CreatedById, CreatedDate, CurrencyIsoCode, Description, Fecha_de_finalizacion__c, Gestion_Cross_selling__c, Id, Interaction_Url__c, IsArchived, IsClosed, IsDeleted, IsHighPriority, IsRecurrence, IsReminderSet, LastModifiedById, LastModifiedDate, Organizacion_de_venta__c, OwnerId, Priority, Queue_Name__c, RecurrenceActivityId, RecurrenceDayOfMonth, RecurrenceDayOfWeekMask, RecurrenceEndDateOnly, RecurrenceInstance, RecurrenceInterval, RecurrenceMonthOfYear, RecurrenceRegeneratedType, RecurrenceStartDateOnly, RecurrenceTimeZoneSidKey, RecurrenceType, ReminderDateTime, Resultado_Lead__c, Status, Status_Lead__c, Subject, SystemModstamp, TaskSubtype, Total_Acd_Time__c, Total_Ivr_Time__c, Type, WhatCount, WhatId, whatslly__Created_by_Whatslly__c, whatslly__Is_WhatsApp_Task__c, whatslly__Whatslly_Number__c, WhoCount, WhoId FROM Task"
