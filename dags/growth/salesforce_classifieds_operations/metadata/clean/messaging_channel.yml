database_name: datalake_salesforce_classifieds_clean
table_name: messaging_channel
owner: fabian.flores@quintoandar.com
domain: Growth
description: |
  Clean layer for Salesforce MessagingChannel configuration from the Navent Classifieds Salesforce org.
  Grain is one row per messaging channel (id) per incremental load window, keyed by Salesforce Id.
  Defines WhatsApp/SMS routing, opt-in copy, and business-hours restrictions used by support.
  Source: datalake_salesforce_classifieds_raw.messagingchannel. Physically partitioned by year, month,
  and day from dt_updated (derived from LastModifiedDate). Always filter year, month, and day together
  — or use dt_updated with load_start_date/load_end_date — for partition pruning on incremental reads.
columns:
  id:
    description: Primary Key. Salesforce native record Id for the MessagingChannel object (Id).
    lineage:
      - datalake_salesforce_classifieds_raw.messagingchannel.Id
  id_business_hours:
    description: Foreign Key to the related Business Hours on this MessagingChannel (BusinessHoursId).
    lineage:
      - datalake_salesforce_classifieds_raw.messagingchannel.BusinessHoursId
  id_channel_definition:
    description: Foreign Key to the related channel definition on this MessagingChannel (ChannelDefinitionId).
    lineage:
      - datalake_salesforce_classifieds_raw.messagingchannel.ChannelDefinitionId
  id_created_by:
    description: Foreign Key to the Salesforce User who created the record (CreatedById).
    lineage:
      - datalake_salesforce_classifieds_raw.messagingchannel.CreatedById
  id_last_modified_by:
    description: Foreign Key to the Salesforce User who last modified the record (LastModifiedById).
    lineage:
      - datalake_salesforce_classifieds_raw.messagingchannel.LastModifiedById
  id_routing_configuration:
    description: Foreign Key to the related routing configuration on this MessagingChannel (RoutingConfigurationId).
    lineage:
      - datalake_salesforce_classifieds_raw.messagingchannel.RoutingConfigurationId
  id_target_queue:
    description: Foreign Key to the related target Queue on this MessagingChannel (TargetQueueId).
    lineage:
      - datalake_salesforce_classifieds_raw.messagingchannel.TargetQueueId
  channel_address_identifier:
    description: Channel address identifier stored on this MessagingChannel (ChannelAddressIdentifier).
    lineage:
      - datalake_salesforce_classifieds_raw.messagingchannel.ChannelAddressIdentifier
  consent_type:
    description: Consent type stored on this MessagingChannel (ConsentType).
    lineage:
      - datalake_salesforce_classifieds_raw.messagingchannel.ConsentType
  conversation_end_response:
    description: Conversation end response stored on this MessagingChannel (ConversationEndResponse).
    lineage:
