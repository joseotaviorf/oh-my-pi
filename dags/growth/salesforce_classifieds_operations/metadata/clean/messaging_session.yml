      - datalake_salesforce_classifieds_raw.messagingsession.ChannelGroup
  channel_intent:
    description: Channel intent stored on this MessagingSession (ChannelIntent).
    lineage:
      - datalake_salesforce_classifieds_raw.messagingsession.ChannelIntent
  channel_key:
    description: Channel key stored on this MessagingSession (ChannelKey).
    lineage:
      - datalake_salesforce_classifieds_raw.messagingsession.ChannelKey
  channel_locale:
