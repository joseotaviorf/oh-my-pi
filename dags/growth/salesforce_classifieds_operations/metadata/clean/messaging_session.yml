database_name: datalake_salesforce_classifieds_clean
table_name: messaging_session
owner: fabian.flores@quintoandar.com
domain: Growth
description: |
  Clean layer for Salesforce MessagingSession records from the Navent Classifieds Salesforce org.
  Grain is one row per messaging session (id) per incremental load window, keyed by Salesforce Id.
  Connects a chat session to Case, Account, Contact, Lead, or Opportunity and counts agent vs end-user
  messages. Source: datalake_salesforce_classifieds_raw.messagingsession. Physically partitioned by year,
  month, and day from dt_updated (derived from LastModifiedDate). Always filter year, month, and day
  together — or use dt_updated with load_start_date/load_end_date — for partition pruning on incremental
  reads.
columns:
  id:
    description: Primary Key. Salesforce native record Id for the MessagingSession object (Id).
    lineage:
      - datalake_salesforce_classifieds_raw.messagingsession.Id
  id_case:
    description: Foreign Key to the related Case record (CaseId).
    lineage:
      - datalake_salesforce_classifieds_raw.messagingsession.CaseId
  id_created_by:
    description: Foreign Key to the Salesforce User who created the record (CreatedById).
    lineage:
      - datalake_salesforce_classifieds_raw.messagingsession.CreatedById
  id_end_user_account:
    description: Foreign Key to the related end-user Account on this MessagingSession (EndUserAccountId).
    lineage:
      - datalake_salesforce_classifieds_raw.messagingsession.EndUserAccountId
  id_end_user_contact:
    description: Foreign Key to the related end-user Contact on this MessagingSession (EndUserContactId).
    lineage:
      - datalake_salesforce_classifieds_raw.messagingsession.EndUserContactId
  id_last_modified_by:
    description: Foreign Key to the Salesforce User who last modified the record (LastModifiedById).
    lineage:
      - datalake_salesforce_classifieds_raw.messagingsession.LastModifiedById
  id_lead:
    description: Foreign Key to the related Lead record (LeadId).
    lineage:
      - datalake_salesforce_classifieds_raw.messagingsession.LeadId
  id_messaging_channel:
    description: Foreign Key to the MessagingChannel used by this record (MessagingChannelId).
    lineage:
      - datalake_salesforce_classifieds_raw.messagingsession.MessagingChannelId
  id_messaging_end_user:
    description: Foreign Key to the MessagingEndUser on this session (MessagingEndUserId).
    lineage:
      - datalake_salesforce_classifieds_raw.messagingsession.MessagingEndUserId
  id_opportunity:
    description: Foreign Key to the related Opportunity record (OpportunityId).
    lineage:
      - datalake_salesforce_classifieds_raw.messagingsession.OpportunityId
  id_owner:
    description: Foreign Key to the Salesforce User or Queue that owns the record (OwnerId).
    lineage:
      - datalake_salesforce_classifieds_raw.messagingsession.OwnerId
  id_target_user:
    description: Foreign Key to the related target User on this MessagingSession (TargetUserId).
    lineage:
      - datalake_salesforce_classifieds_raw.messagingsession.TargetUserId
  agent_type:
    description: Agent type stored on this MessagingSession (AgentType).
    lineage:
