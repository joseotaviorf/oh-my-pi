database_name: datalake_salesforce_classifieds_clean
table_name: calendar_event
owner: fabian.flores@quintoandar.com
domain: Growth
description: |
  Clean layer for Salesforce Event calendar records from the Navent Classifieds Salesforce org.
  Grain is one row per event (id) per incremental load window, keyed by Salesforce Id. Captures
  scheduled meetings and related recurrence metadata for classifieds operations. Source:
  datalake_salesforce_classifieds_raw.event. Physically partitioned by year, month, and day from
  dt_updated (derived from LastModifiedDate). Always filter year, month, and day together — or use
  dt_updated with load_start_date/load_end_date — for partition pruning on incremental reads.
columns:
  id:
    description: Primary Key. Salesforce native record Id for the Event object (Id).
    lineage:
      - datalake_salesforce_classifieds_raw.event.Id
  id_account:
    description: Foreign Key to the related Account record (AccountId).
    lineage:
      - datalake_salesforce_classifieds_raw.event.AccountId
  id_created_by:
