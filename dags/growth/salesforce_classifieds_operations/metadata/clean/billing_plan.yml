database_name: datalake_salesforce_classifieds_clean
table_name: billing_plan
owner: fabian.flores@quintoandar.com
domain: Growth
description: |
  Clean layer for Salesforce billing-plan records (Plan_de_facturacion__c) from the Navent Classifieds
  Salesforce org. Grain is one row per billing plan (id) per incremental load window, keyed by
  Salesforce Id. Links a portal company, product, SAP order, and settlement dates used to generate
  invoices. Source: datalake_salesforce_classifieds_raw.plan_de_facturacion__c. Physically partitioned by
  year, month, and day from dt_updated (derived from LastModifiedDate). Always filter year, month, and
  day together — or use dt_updated with load_start_date/load_end_date — for partition pruning on
  incremental reads.
columns:
  id:
    description: Primary Key. Salesforce native record Id for the billing plan object (Id).
    lineage:
      - datalake_salesforce_classifieds_raw.plan_de_facturacion__c.Id
  id_company_portal:
    description: Foreign Key to the related portal company (Empresa_portal__c).
    lineage:
      - datalake_salesforce_classifieds_raw.plan_de_facturacion__c.Empresa_portal__c
  id_created_by:
    description: Foreign Key to the Salesforce User who created the record (CreatedById).
    lineage:
      - datalake_salesforce_classifieds_raw.plan_de_facturacion__c.CreatedById
  id_last_modified_by:
    description: Foreign Key to the Salesforce User who last modified the record (LastModifiedById).
    lineage:
      - datalake_salesforce_classifieds_raw.plan_de_facturacion__c.LastModifiedById
  id_opportunity:
    description: Foreign Key to the related Opportunity (Oportunidad__c).
    lineage:
      - datalake_salesforce_classifieds_raw.plan_de_facturacion__c.Oportunidad__c
  id_order_position_sap:
    description: Foreign Key to the related SAP order line item on this billing plan (Id_pedido_posicion_SAP__c).
    lineage:
      - datalake_salesforce_classifieds_raw.plan_de_facturacion__c.Id_pedido_posicion_SAP__c
  id_order_sap:
    description: Foreign Key to the related SAP sales order on this billing plan (Id_pedido_SAP__c).
    lineage:
      - datalake_salesforce_classifieds_raw.plan_de_facturacion__c.Id_pedido_SAP__c
  id_organization_sales:
    description: Foreign Key to the sales organization associated with this record (Organizacion_de_venta__c).
    lineage:
      - datalake_salesforce_classifieds_raw.plan_de_facturacion__c.Organizacion_de_venta__c
  id_owner:
    description: Foreign Key to the Salesforce User or Queue that owns the record (OwnerId).
    lineage:
      - datalake_salesforce_classifieds_raw.plan_de_facturacion__c.OwnerId
  id_product:
    description: Foreign Key to the related Product (Producto__c).
    lineage:
      - datalake_salesforce_classifieds_raw.plan_de_facturacion__c.Producto__c
  id_requester:
    description: Foreign Key to the requester (sold-to) party (Solicitante__c).
    lineage:
      - datalake_salesforce_classifieds_raw.plan_de_facturacion__c.Solicitante__c
  id_responsible_payment:
    description: Foreign Key to the party responsible for payment (Responsable_pago__c).
    lineage:
      - datalake_salesforce_classifieds_raw.plan_de_facturacion__c.Responsable_pago__c
  channel_payment:
    description: Channel payment stored on this billing plan (Via_de_pago__c).
    lineage:
      - datalake_salesforce_classifieds_raw.plan_de_facturacion__c.Via_de_pago__c
  currency_iso_code:
    description: ISO currency code stored on the Salesforce record (CurrencyIsoCode).
    lineage:
      - datalake_salesforce_classifieds_raw.plan_de_facturacion__c.CurrencyIsoCode
  name:
    description: Salesforce record name / auto-number displayed in the UI (Name).
    lineage:
      - datalake_salesforce_classifieds_raw.plan_de_facturacion__c.Name
  number_opportunity:
    description: Number opportunity stored on this billing plan (Numero_de_oportunidad__c).
    lineage:
      - datalake_salesforce_classifieds_raw.plan_de_facturacion__c.Numero_de_oportunidad__c
  number_order_portal:
    description: Number order portal stored on this billing plan (Numero_de_pedido_portal__c).
    lineage:
      - datalake_salesforce_classifieds_raw.plan_de_facturacion__c.Numero_de_pedido_portal__c
  status_invoice:
    description: Status invoice stored on this billing plan (Status_factura__c).
    lineage:
      - datalake_salesforce_classifieds_raw.plan_de_facturacion__c.Status_factura__c
  amount:
    description: Amount stored on this billing plan (Monto__c).
    lineage:
      - datalake_salesforce_classifieds_raw.plan_de_facturacion__c.Monto__c
  is_block_position:
    description: Flag indicating block position on this billing plan (Bloqueo_posicion__c).
    lineage:
      - datalake_salesforce_classifieds_raw.plan_de_facturacion__c.Bloqueo_posicion__c
  is_created_ecommerce:
    description: Flag indicating created ecommerce on this billing plan (Creada_por_ecommerce__c).
    lineage:
      - datalake_salesforce_classifieds_raw.plan_de_facturacion__c.Creada_por_ecommerce__c
  is_deleted:
    description: Flag indicating if the record was soft-deleted in Salesforce (IsDeleted).
    lineage:
      - datalake_salesforce_classifieds_raw.plan_de_facturacion__c.IsDeleted
  is_reassigns_owner:
    description: Flag indicating reassigns owner on this billing plan (Reasigna_propietario__c).
    lineage:
      - datalake_salesforce_classifieds_raw.plan_de_facturacion__c.Reasigna_propietario__c
  dt_cancellation:
    description: Calendar date of cancellation on this billing plan (Fecha_de_cancelacion__c).
    lineage:
      - datalake_salesforce_classifieds_raw.plan_de_facturacion__c.Fecha_de_cancelacion__c
  dt_end_settlement:
    description: Calendar date of end settlement on this billing plan (Fecha_fin_liquidacion__c).
    lineage:
      - datalake_salesforce_classifieds_raw.plan_de_facturacion__c.Fecha_fin_liquidacion__c
  dt_invoice:
    description: Calendar date of bill-to party on this billing plan (Fecha_factura__c).
    lineage:
      - datalake_salesforce_classifieds_raw.plan_de_facturacion__c.Fecha_factura__c
  dt_last_activity:
    description: Date of the last activity related to the record (LastActivityDate).
    lineage:
      - datalake_salesforce_classifieds_raw.plan_de_facturacion__c.LastActivityDate
  dt_start_settlement:
    description: Calendar date of start settlement on this billing plan (Fecha_inicio_liquidacion__c).
    lineage:
      - datalake_salesforce_classifieds_raw.plan_de_facturacion__c.Fecha_inicio_liquidacion__c
  ts_created:
    description: Creation timestamp in Salesforce (CreatedDate).
    lineage:
      - datalake_salesforce_classifieds_raw.plan_de_facturacion__c.CreatedDate
  ts_last_modified:
    description: Last modified timestamp in Salesforce (LastModifiedDate).
    lineage:
      - datalake_salesforce_classifieds_raw.plan_de_facturacion__c.LastModifiedDate
  ts_last_referenced:
    description: Timestamp when the user last referenced the record (LastReferencedDate).
    lineage:
      - datalake_salesforce_classifieds_raw.plan_de_facturacion__c.LastReferencedDate
  ts_last_viewed:
    description: Timestamp when the user last viewed the record (LastViewedDate).
    lineage:
      - datalake_salesforce_classifieds_raw.plan_de_facturacion__c.LastViewedDate
  ts_system_mod:
    description: System modification timestamp tracking internal updates (SystemModstamp).
    lineage:
      - datalake_salesforce_classifieds_raw.plan_de_facturacion__c.SystemModstamp
  dt_updated:
    description: Date of the last Salesforce change used for incremental loads (LastModifiedDate cast to date).
    lineage:
      - datalake_salesforce_classifieds_raw.plan_de_facturacion__c.dt_updated
  year:
    description: Hive partition year (1–9999). Filter with month and day together to enable partition pruning on incremental reads.
    lineage:
      - datalake_salesforce_classifieds_raw.plan_de_facturacion__c.year
  month:
    description: Hive partition month (1–12). Filter with year and day together to enable partition pruning on incremental reads.
    lineage:
      - datalake_salesforce_classifieds_raw.plan_de_facturacion__c.month
  day:
    description: Hive partition day (1–31). Filter with year and month together to enable partition pruning on incremental reads.
    lineage:
      - datalake_salesforce_classifieds_raw.plan_de_facturacion__c.day
