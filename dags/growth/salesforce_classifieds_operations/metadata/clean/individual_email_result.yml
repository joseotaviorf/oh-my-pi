    lineage:
      - datalake_salesforce_classifieds_raw.et4ae5__individualemailresult__c.SystemModstamp
  ts_tracking_as:
    description: Salesforce timestamp for tracking as on this Individual Email Result (et4ae5__Tracking_As_Of__c).
    lineage:
