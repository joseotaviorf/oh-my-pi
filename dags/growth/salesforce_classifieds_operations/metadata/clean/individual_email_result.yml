  ts_unsubscribed:
    description: Salesforce timestamp for unsubscribed on this Individual Email Result (et4ae5__DateUnsubscribed__c).
    lineage:
      - datalake_salesforce_classifieds_raw.et4ae5__individualemailresult__c.et4ae5__DateUnsubscribed__c
  dt_updated:
    description: Date of the last Salesforce change used for incremental loads (LastModifiedDate cast to date).
    lineage:
      - datalake_salesforce_classifieds_raw.et4ae5__individualemailresult__c.dt_updated
  year:
    description: Hive partition year (1–9999). Filter with month and day together to enable partition pruning on incremental reads.
    lineage:
      - datalake_salesforce_classifieds_raw.et4ae5__individualemailresult__c.year
  month:
    description: Hive partition month (1–12). Filter with year and day together to enable partition pruning on incremental reads.
    lineage:
