database_name: datalake_salesforce_classifieds_clean
table_name: monthly_portfolio
owner: fabian.flores@quintoandar.com
domain: Growth
description: |
  Clean layer for Salesforce monthly portfolio snapshots (Cartera_mensual__c) from the Navent
  Classifieds Salesforce org. Grain is one row per portfolio snapshot (id) per incremental load window,
  keyed by Salesforce Id. Tracks billed vs to-bill amounts, churn reasons, and collections status for
  a portal company in a given month. Source: datalake_salesforce_classifieds_raw.cartera_mensual__c.
  Physically partitioned by year, month, and day from dt_updated (derived from LastModifiedDate). Always
  filter year, month, and day together — or use dt_updated with load_start_date/load_end_date — for
  partition pruning on incremental reads.
columns:
