database_name: datalake_salesforce_classifieds_clean
table_name: process_instance
owner: fabian.flores@quintoandar.com
domain: Growth
description: |
  Clean layer for Salesforce ProcessInstance approval runs from the Navent Classifieds Salesforce org.
  Grain is one row per process instance (id) per incremental load window, keyed by Salesforce Id.
  Tracks status, elapsed time, and the record under approval. Source:
  datalake_salesforce_classifieds_raw.processinstance. Physically partitioned by year, month, and day
  from dt_updated (derived from LastModifiedDate). Always filter year, month, and day together — or use
  dt_updated with load_start_date/load_end_date — for partition pruning on incremental reads.
columns:
  id:
    description: Primary Key. Salesforce native record Id for the ProcessInstance object (Id).
    lineage:
      - datalake_salesforce_classifieds_raw.processinstance.Id
  id_created_by:
    description: Foreign Key to the Salesforce User who created the record (CreatedById).
    lineage:
      - datalake_salesforce_classifieds_raw.processinstance.CreatedById
  id_last_actor:
    description: Foreign Key to the related last approval actor on this ProcessInstance (LastActorId).
    lineage:
      - datalake_salesforce_classifieds_raw.processinstance.LastActorId
  id_last_modified_by:
    description: Foreign Key to the Salesforce User who last modified the record (LastModifiedById).
    lineage:
      - datalake_salesforce_classifieds_raw.processinstance.LastModifiedById
  id_process_definition:
    description: Foreign Key to the ProcessDefinition that spawned this instance (ProcessDefinitionId).
    lineage:
      - datalake_salesforce_classifieds_raw.processinstance.ProcessDefinitionId
  id_submitted_by:
    description: Foreign Key to the related submitting User on this ProcessInstance (SubmittedById).
    lineage:
      - datalake_salesforce_classifieds_raw.processinstance.SubmittedById
  id_target_object:
    description: Foreign Key to the related record under approval on this ProcessInstance (TargetObjectId).
    lineage:
      - datalake_salesforce_classifieds_raw.processinstance.TargetObjectId
  status_name:
    description: Lifecycle status of the Salesforce record (Status).
    lineage:
      - datalake_salesforce_classifieds_raw.processinstance.Status
  elapsed_time_days:
    description: Elapsed time days stored on this ProcessInstance (ElapsedTimeInDays).
    lineage:
      - datalake_salesforce_classifieds_raw.processinstance.ElapsedTimeInDays
  elapsed_time_hours:
    description: Elapsed time hours stored on this ProcessInstance (ElapsedTimeInHours).
    lineage:
      - datalake_salesforce_classifieds_raw.processinstance.ElapsedTimeInHours
  elapsed_time_minutes:
    description: Elapsed time minutes stored on this ProcessInstance (ElapsedTimeInMinutes).
    lineage:
      - datalake_salesforce_classifieds_raw.processinstance.ElapsedTimeInMinutes
  is_deleted:
    description: Flag indicating if the record was soft-deleted in Salesforce (IsDeleted).
    lineage:
      - datalake_salesforce_classifieds_raw.processinstance.IsDeleted
  ts_completed:
    description: Salesforce timestamp for completed on this ProcessInstance (CompletedDate).
    lineage:
      - datalake_salesforce_classifieds_raw.processinstance.CompletedDate
  ts_created:
    description: Creation timestamp in Salesforce (CreatedDate).
    lineage:
      - datalake_salesforce_classifieds_raw.processinstance.CreatedDate
  ts_last_modified:
    description: Last modified timestamp in Salesforce (LastModifiedDate).
    lineage:
      - datalake_salesforce_classifieds_raw.processinstance.LastModifiedDate
  ts_system_mod:
    description: System modification timestamp tracking internal updates (SystemModstamp).
    lineage:
      - datalake_salesforce_classifieds_raw.processinstance.SystemModstamp
  dt_updated:
    description: Date of the last Salesforce change used for incremental loads (LastModifiedDate cast to date).
    lineage:
      - datalake_salesforce_classifieds_raw.processinstance.dt_updated
  year:
    description: Hive partition year (1–9999). Filter with month and day together to enable partition pruning on incremental reads.
    lineage:
      - datalake_salesforce_classifieds_raw.processinstance.year
  month:
    description: Hive partition month (1–12). Filter with year and day together to enable partition pruning on incremental reads.
    lineage:
      - datalake_salesforce_classifieds_raw.processinstance.month
  day:
    description: Hive partition day (1–31). Filter with year and month together to enable partition pruning on incremental reads.
    lineage:
      - datalake_salesforce_classifieds_raw.processinstance.day
