database_name: datalake_salesforce_classifieds_clean
table_name: support_case
owner: fabian.flores@quintoandar.com
domain: Growth
description: |
  Clean layer for Salesforce Case objects (customer support cases) from the Navent Classifieds Salesforce org.
  Grain is one row per case (id) per incremental load window, keyed by Salesforce Id. Named support_case because
  "case" is a reserved word; the raw table is datalake_salesforce_classifieds_raw.cases for the same reason. Includes
  case status/type/priority, customer contact details, and billing/refund attributes. Contains PII (contact email/phone,
  customer address, bank account details) — permitted in clean; not propagated to enrich/DW in this story. Source:
  datalake_salesforce_classifieds_raw.cases. Physically partitioned by year, month, and day from dt_updated (derived from
  LastModifiedDate). Always filter year, month, and day together — or use dt_updated with load_start_date/load_end_date —
  for partition pruning on incremental reads.
columns:
  id:
    description: Primary Key. Salesforce native record Id for the Case object (Id).
    lineage:
      - datalake_salesforce_classifieds_raw.cases.Id
  id_account:
    description: Foreign Key to the related Account record (AccountId).
    lineage:
      - datalake_salesforce_classifieds_raw.cases.AccountId
  id_contact:
    description: Foreign Key to the related Contact record (ContactId).
    lineage:
      - datalake_salesforce_classifieds_raw.cases.ContactId
  id_owner:
    description: Foreign Key to the Salesforce User or Queue that owns the case (OwnerId).
    lineage:
      - datalake_salesforce_classifieds_raw.cases.OwnerId
  id_created_by:
    description: Foreign Key to the Salesforce User who created the record (CreatedById).
    lineage:
      - datalake_salesforce_classifieds_raw.cases.CreatedById
  id_last_modified_by:
    description: Foreign Key to the Salesforce User who last modified the record (LastModifiedById).
    lineage:
      - datalake_salesforce_classifieds_raw.cases.LastModifiedById
  id_parent_case:
    description: Foreign Key to the parent Case record, for case hierarchies (ParentId).
    lineage:
      - datalake_salesforce_classifieds_raw.cases.ParentId
  id_master_record:
    description: Foreign Key to the master Case record in case of merge (MasterRecordId).
    lineage:
      - datalake_salesforce_classifieds_raw.cases.MasterRecordId
  id_source:
    description: Foreign Key to the originating EmailMessage, MessagingSession, or SocialPost record (SourceId).
    lineage:
      - datalake_salesforce_classifieds_raw.cases.SourceId
  id_record_type:
