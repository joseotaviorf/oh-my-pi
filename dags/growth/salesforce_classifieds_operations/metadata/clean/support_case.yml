    lineage:
      - datalake_salesforce_classifieds_raw.cases.RecordTypeId
  id_tax_condition:
    description: Foreign Key to the associated tax condition custom object (Condicion_fiscal__c).
    lineage:
      - datalake_salesforce_classifieds_raw.cases.Condicion_fiscal__c
  id_country:
    description: Foreign Key to the associated country custom object (Pais__c).
    lineage:
      - datalake_salesforce_classifieds_raw.cases.Pais__c
  id_opportunity:
    description: Foreign Key to the related Opportunity record (Oportunidad__c).
    lineage:
      - datalake_salesforce_classifieds_raw.cases.Oportunidad__c
  id_service_order:
