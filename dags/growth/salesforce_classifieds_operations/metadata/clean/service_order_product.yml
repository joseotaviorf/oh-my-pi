  price_monthly:
    description: Monetary or numeric measure of price monthly on this service-order product (Precio_mensual__c).
    lineage:
      - datalake_salesforce_classifieds_raw.producto_de_orden_de_servicio__c.Precio_mensual__c
  price_sales:
    description: Monetary or numeric measure of price sales on this service-order product (Precio_de_venta__c).
    lineage:
