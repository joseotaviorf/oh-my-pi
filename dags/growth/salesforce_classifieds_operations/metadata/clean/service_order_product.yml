database_name: datalake_salesforce_classifieds_clean
table_name: service_order_product
owner: fabian.flores@quintoandar.com
domain: Growth
description: |
  Clean layer for Salesforce service-order product lines (Producto_de_orden_de_servicio__c) from the
  Navent Classifieds Salesforce org. Grain is one row per order product (id) per incremental load
  window, keyed by Salesforce Id. Holds list/sale prices, discounts, quantities, and validity dates
  used in classifieds billing operations. Source:
  datalake_salesforce_classifieds_raw.producto_de_orden_de_servicio__c. Physically partitioned by year,
  month, and day from dt_updated (derived from LastModifiedDate). Always filter year, month, and day
  together — or use dt_updated with load_start_date/load_end_date — for partition pruning on incremental
  reads.
columns:
  id:
    description: Primary Key. Salesforce native record Id for the service-order product object (Id).
    lineage:
      - datalake_salesforce_classifieds_raw.producto_de_orden_de_servicio__c.Id
  id_country_activation:
    description: Foreign Key to the related activation country on this service-order product (Pais_de_activacion__c).
    lineage:
      - datalake_salesforce_classifieds_raw.producto_de_orden_de_servicio__c.Pais_de_activacion__c
  id_created_by:
    description: Foreign Key to the Salesforce User who created the record (CreatedById).
    lineage:
      - datalake_salesforce_classifieds_raw.producto_de_orden_de_servicio__c.CreatedById
  id_external:
    description: Foreign Key to the related external order-item identifier on this service-order product (Id_externo__c).
    lineage:
      - datalake_salesforce_classifieds_raw.producto_de_orden_de_servicio__c.Id_externo__c
  id_external_temporary:
    description: Foreign Key to the related temporary external identifier on this service-order product (Id_externo_temporal__c).
    lineage:
      - datalake_salesforce_classifieds_raw.producto_de_orden_de_servicio__c.Id_externo_temporal__c
  id_invoice:
    description: Foreign Key to the related bill-to party on this service-order product (Facturar_a__c).
    lineage:
      - datalake_salesforce_classifieds_raw.producto_de_orden_de_servicio__c.Facturar_a__c
  id_last_modified_by:
    description: Foreign Key to the Salesforce User who last modified the record (LastModifiedById).
    lineage:
      - datalake_salesforce_classifieds_raw.producto_de_orden_de_servicio__c.LastModifiedById
  id_name_quote:
    description: Foreign Key to the related related quote on this service-order product (Nombre_de_presupuesto__c).
    lineage:
      - datalake_salesforce_classifieds_raw.producto_de_orden_de_servicio__c.Nombre_de_presupuesto__c
  id_order_service:
    description: Foreign Key to the related service order on this service-order product (Orden_de_servicio__c).
    lineage:
      - datalake_salesforce_classifieds_raw.producto_de_orden_de_servicio__c.Orden_de_servicio__c
  id_product:
    description: Foreign Key to the related Product (Producto__c).
    lineage:
      - datalake_salesforce_classifieds_raw.producto_de_orden_de_servicio__c.Producto__c
  branch_id:
    description: Branch stored on this service-order product (Branch_ID__c).
    lineage:
      - datalake_salesforce_classifieds_raw.producto_de_orden_de_servicio__c.Branch_ID__c
  code_product:
    description: Code product stored on this service-order product (Codigo_de_producto__c).
    lineage:
      - datalake_salesforce_classifieds_raw.producto_de_orden_de_servicio__c.Codigo_de_producto__c
  currency_iso_code:
    description: ISO currency code stored on the Salesforce record (CurrencyIsoCode).
    lineage:
      - datalake_salesforce_classifieds_raw.producto_de_orden_de_servicio__c.CurrencyIsoCode
  description_line_item:
    description: Description line item stored on this service-order product (Descripcion_de_partida__c).
    lineage:
      - datalake_salesforce_classifieds_raw.producto_de_orden_de_servicio__c.Descripcion_de_partida__c
  frequency_billing:
    description: Frequency billing stored on this service-order product (Frecuencia_de_Facturacion__c).
    lineage:
      - datalake_salesforce_classifieds_raw.producto_de_orden_de_servicio__c.Frecuencia_de_Facturacion__c
  billing_frequency_2:
    description: Alternate billing cadence on this service-order product line (Frecuencia_de_facturacion2__c).
    lineage:
      - datalake_salesforce_classifieds_raw.producto_de_orden_de_servicio__c.Frecuencia_de_facturacion2__c
  name:
    description: Salesforce record name / auto-number displayed in the UI (Name).
    lineage:
      - datalake_salesforce_classifieds_raw.producto_de_orden_de_servicio__c.Name
  status_validity:
    description: Status validity stored on this service-order product (Estado_de_vigencia__c).
    lineage:
      - datalake_salesforce_classifieds_raw.producto_de_orden_de_servicio__c.Estado_de_vigencia__c
  billing:
    description: Billing stored on this service-order product (facturacion__c).
    lineage:
      - datalake_salesforce_classifieds_raw.producto_de_orden_de_servicio__c.facturacion__c
  difference_months:
