database_name: datalake_salesforce_classifieds_clean
table_name: billing
owner: fabian.flores@quintoandar.com
domain: Growth
description: |
  Clean layer for Salesforce billing documents (Facturacion__c) from the Navent Classifieds Salesforce
  org. Grain is one row per billing record (id) per incremental load window, keyed by Salesforce Id.
  Stores SAP/portal order identifiers, amounts in sales-org and USD, and payment method for classifieds
  invoicing. Source: datalake_salesforce_classifieds_raw.facturacion__c. Physically partitioned by year,
  month, and day from dt_updated (derived from LastModifiedDate). Always filter year, month, and day
  together — or use dt_updated with load_start_date/load_end_date — for partition pruning on incremental
  reads.
columns:
  id:
    description: Primary Key. Salesforce native record Id for the billing document object (Id).
    lineage:
      - datalake_salesforce_classifieds_raw.facturacion__c.Id
  id_company_portal:
    description: Foreign Key to the related portal company (Empresa_portal__c).
    lineage:
      - datalake_salesforce_classifieds_raw.facturacion__c.Empresa_portal__c
  id_created_by:
    description: Foreign Key to the Salesforce User who created the record (CreatedById).
    lineage:
      - datalake_salesforce_classifieds_raw.facturacion__c.CreatedById
  id_last_modified_by:
    description: Foreign Key to the Salesforce User who last modified the record (LastModifiedById).
    lineage:
      - datalake_salesforce_classifieds_raw.facturacion__c.LastModifiedById
  id_opportunity:
    description: Foreign Key to the related Opportunity (Oportunidad__c).
    lineage:
      - datalake_salesforce_classifieds_raw.facturacion__c.Oportunidad__c
  id_order_portal:
    description: Foreign Key to the related portal order on this billing document (Id_pedido_portal__c).
    lineage:
      - datalake_salesforce_classifieds_raw.facturacion__c.Id_pedido_portal__c
  id_order_sap:
    description: Foreign Key to the related SAP sales order on this billing document (Id_pedido_SAP__c).
    lineage:
      - datalake_salesforce_classifieds_raw.facturacion__c.Id_pedido_SAP__c
  id_organization_sales:
    description: Foreign Key to the sales organization associated with this record (Organizacion_de_venta__c).
    lineage:
      - datalake_salesforce_classifieds_raw.facturacion__c.Organizacion_de_venta__c
  id_owner:
    description: Foreign Key to the Salesforce User or Queue that owns the record (OwnerId).
    lineage:
      - datalake_salesforce_classifieds_raw.facturacion__c.OwnerId
  id_owner_company_portal:
    description: Foreign Key to the related portal-company owner user on this billing document (Propietario_de_empresa_portal__c).
    lineage:
      - datalake_salesforce_classifieds_raw.facturacion__c.Propietario_de_empresa_portal__c
  id_product:
    description: Foreign Key to the related Product (Producto__c).
    lineage:
      - datalake_salesforce_classifieds_raw.facturacion__c.Producto__c
  id_requester:
    description: Foreign Key to the requester (sold-to) party (Solicitante__c).
    lineage:
      - datalake_salesforce_classifieds_raw.facturacion__c.Solicitante__c
  id_responsible_payment:
    description: Foreign Key to the party responsible for payment (Responsable_pago__c).
    lineage:
      - datalake_salesforce_classifieds_raw.facturacion__c.Responsable_pago__c
  cebe:
    description: Cebe stored on this billing document (CEBE__c).
    lineage:
      - datalake_salesforce_classifieds_raw.facturacion__c.CEBE__c
  channel_payment:
    description: Channel payment stored on this billing document (Via_de_pago__c).
    lineage:
      - datalake_salesforce_classifieds_raw.facturacion__c.Via_de_pago__c
  class_document:
    description: Class document stored on this billing document (Clase_de_documento__c).
    lineage:
      - datalake_salesforce_classifieds_raw.facturacion__c.Clase_de_documento__c
  classification:
    description: Classification stored on this billing document (Tipificacion__c).
    lineage:
      - datalake_salesforce_classifieds_raw.facturacion__c.Tipificacion__c
  currency_iso_code:
    description: ISO currency code stored on the Salesforce record (CurrencyIsoCode).
    lineage:
      - datalake_salesforce_classifieds_raw.facturacion__c.CurrencyIsoCode
  currency_sales_org:
    description: Currency sales org stored on this billing document (Divisa_OV__c).
    lineage:
      - datalake_salesforce_classifieds_raw.facturacion__c.Divisa_OV__c
  document_position:
    description: Document position stored on this billing document (Documento_Posicion__c).
    lineage:
      - datalake_salesforce_classifieds_raw.facturacion__c.Documento_Posicion__c
  frequency_billing:
    description: Frequency billing stored on this billing document (Frecuencia_de_Facturacion__c).
    lineage:
      - datalake_salesforce_classifieds_raw.facturacion__c.Frecuencia_de_Facturacion__c
  line_product:
    description: Line product stored on this billing document (Linea_de_producto__c).
    lineage:
      - datalake_salesforce_classifieds_raw.facturacion__c.Linea_de_producto__c
  name:
    description: Salesforce record name / auto-number displayed in the UI (Name).
    lineage:
      - datalake_salesforce_classifieds_raw.facturacion__c.Name
  reason:
    description: Reason stored on this billing document (Motivo__c).
    lineage:
      - datalake_salesforce_classifieds_raw.facturacion__c.Motivo__c
  reference:
    description: Reference stored on this billing document (Referencia__c).
    lineage:
      - datalake_salesforce_classifieds_raw.facturacion__c.Referencia__c
  type_name:
    description: Type name stored on this billing document (Tipo__c).
    lineage:
      - datalake_salesforce_classifieds_raw.facturacion__c.Tipo__c
  amount_currency_sales_org:
    description: Monetary or numeric measure of amount currency sales org on this billing document (Monto_en_Divisa_OV__c).
    lineage:
      - datalake_salesforce_classifieds_raw.facturacion__c.Monto_en_Divisa_OV__c
  amount_currency_transaction:
    description: Monetary or numeric measure of amount currency transaction on this billing document (Monto_en_Divisa_Transaccion__c).
    lineage:
      - datalake_salesforce_classifieds_raw.facturacion__c.Monto_en_Divisa_Transaccion__c
  amount_monthly_sales_org_currency:
    description: Amount converted to a monthly figure in the sales-organization currency (Monto_mensualizado_moneda_OV__c).
    lineage:
      - datalake_salesforce_classifieds_raw.facturacion__c.Monto_mensualizado_moneda_OV__c
  amount_usd:
    description: Monetary or numeric measure of amount usd on this billing document (Monto_en_USD__c).
    lineage:
      - datalake_salesforce_classifieds_raw.facturacion__c.Monto_en_USD__c
  duration_months:
    description: Monetary or numeric measure of duration months on this billing document (Duracion_en_meses__c).
    lineage:
      - datalake_salesforce_classifieds_raw.facturacion__c.Duracion_en_meses__c
  is_created_ecommerce:
    description: Flag indicating created ecommerce on this billing document (Creada_por_ecommerce__c).
    lineage:
      - datalake_salesforce_classifieds_raw.facturacion__c.Creada_por_ecommerce__c
  is_deleted:
    description: Flag indicating if the record was soft-deleted in Salesforce (IsDeleted).
    lineage:
      - datalake_salesforce_classifieds_raw.facturacion__c.IsDeleted
  dt_document:
    description: Calendar date of document on this billing document (Fecha_documento__c).
    lineage:
      - datalake_salesforce_classifieds_raw.facturacion__c.Fecha_documento__c
  dt_end_validity:
