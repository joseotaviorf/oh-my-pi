    lineage:
      - datalake_salesforce_classifieds_raw.facturacion__c.Fecha_de_fin_de_vigencia__c
  dt_last_activity:
    description: Date of the last activity related to the record (LastActivityDate).
    lineage:
      - datalake_salesforce_classifieds_raw.facturacion__c.LastActivityDate
  dt_start_validity:
    description: Calendar date of start validity on this billing document (Fecha_de_inicio_de_vigencia__c).
    lineage:
      - datalake_salesforce_classifieds_raw.facturacion__c.Fecha_de_inicio_de_vigencia__c
  ts_created:
    description: Creation timestamp in Salesforce (CreatedDate).
    lineage:
      - datalake_salesforce_classifieds_raw.facturacion__c.CreatedDate
  ts_last_modified:
    description: Last modified timestamp in Salesforce (LastModifiedDate).
    lineage:
      - datalake_salesforce_classifieds_raw.facturacion__c.LastModifiedDate
  ts_last_referenced:
    description: Timestamp when the user last referenced the record (LastReferencedDate).
    lineage:
      - datalake_salesforce_classifieds_raw.facturacion__c.LastReferencedDate
  ts_last_viewed:
    description: Timestamp when the user last viewed the record (LastViewedDate).
    lineage:
      - datalake_salesforce_classifieds_raw.facturacion__c.LastViewedDate
  ts_system_mod:
    description: System modification timestamp tracking internal updates (SystemModstamp).
    lineage:
      - datalake_salesforce_classifieds_raw.facturacion__c.SystemModstamp
  dt_updated:
    description: Date of the last Salesforce change used for incremental loads (LastModifiedDate cast to date).
    lineage:
      - datalake_salesforce_classifieds_raw.facturacion__c.dt_updated
  year:
    description: Hive partition year (1–9999). Filter with month and day together to enable partition pruning on incremental reads.
    lineage:
      - datalake_salesforce_classifieds_raw.facturacion__c.year
  month:
    description: Hive partition month (1–12). Filter with year and day together to enable partition pruning on incremental reads.
    lineage:
      - datalake_salesforce_classifieds_raw.facturacion__c.month
  day:
    description: Hive partition day (1–31). Filter with year and month together to enable partition pruning on incremental reads.
    lineage:
      - datalake_salesforce_classifieds_raw.facturacion__c.day
