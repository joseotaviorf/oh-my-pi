database_name: datalake_salesforce_classifieds_clean
table_name: task
owner: fabian.flores@quintoandar.com
domain: Growth
description: |
  Clean layer for Salesforce Task activities from the Navent Classifieds Salesforce org.
  Grain is one row per task (id) per incremental load window, keyed by Salesforce Id. Captures agent
  follow-up work (calls, WhatsApp, reminders) tied to accounts, leads, and related records. Used by
  Growth classifieds operations to reconstruct workload and channel mix. Source:
  datalake_salesforce_classifieds_raw.task. Physically partitioned by year, month, and day from
  dt_updated (derived from LastModifiedDate). Always filter year, month, and day together — or use
  dt_updated with load_start_date/load_end_date — for partition pruning on incremental reads.
columns:
