---
dag:
  name: enrich_supply_tracking
  schedule_start_date: 2019, 1, 1
  owner: Data Growth
  documentation: 
    dag_purpose: |
      This DAG is responsible for enriching the supply flows data with the taxonomy data.
workflow:
  type: query_delta
  layer: enrich
  custom_schema: supply_flows
  default_extraction_type: full
  spark_session_configs:
    udfs: [SF_NORMALIZE_STRING]
  tables_customization:
    conversion_tracking:
      z_order_by: ['id_lead_ebdb', 'id_house', 'business_context']
    supply_events_tracking:
      z_order_by: ['sk_supply_lead', 'id_lead_ebdb', 'id_house', 'business_context']
  inner_dependencies:
    supply_events_tracking:
      - conversion_tracking
cluster:
  type: databricks_12_2_xmin-io-memory_photon_cluster