---
database_name: datalake_profound_clean
table_name: report_by_model
owner: caio.francisco@quintoandar.com.br
domain: Growth
description: This table contains the clean informations about Profound data in the model granularity.
columns:
  player:
    description: Asset name (player) from Profound.
    lineage:
      - datalake_profound_raw.report_by_model.asset_name
  model:
    description: Model name from Profound.
    lineage:
      - datalake_profound_raw.report_by_model.model
  executions:
    description: Number of executions for the player and model.
    lineage:
      - datalake_profound_raw.report_by_model.executions
  mentions_count:
    description: Number of mentions for the player and model.
    lineage:
      - datalake_profound_raw.report_by_model.mentions_count
  visibility_score:
    description: Visibility score for the player and model.
    lineage:
      - datalake_profound_raw.report_by_model.visibility_score
  share_of_voice:
    description: Share of voice percentage for the player and model.
    lineage:
      - datalake_profound_raw.report_by_model.share_of_voice
  dt_created:
    description: Extraction date.
    lineage:
      - datalake_profound_raw.report_by_model.date
  year:
    description: Extraction year.
    lineage:
      - datalake_profound_raw.report_by_model.date
  month:
    description: Extraction month.
    lineage:
      - datalake_profound_raw.report_by_model.date
  day:
    description: Extraction day.
    lineage:
      - datalake_profound_raw.report_by_model.date

