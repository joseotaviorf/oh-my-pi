cluster:
  type: consolidation_xs_general_cluster
  databricks_conn_id: databricks_new
  access_control_list:
    group_name: software-engineers
    permission_level: CAN_MANAGE
  custom_libraries:
  - pypi:
      package: profound
  custom_configurations:
    spark_version: 13.3.x-scala2.12
    num_workers: 1
validation:
  cluster:
    type: emr_7_12_consolidation_xs_general_fleet_cluster
    custom_configurations:
      core_nodes:
        target_on_demand: 1
        target_spot: 0
        instance_types:
        - m6g.xlarge
        - m7g.xlarge
  allow_custom_spark_job: true
