dag:
  name: enrich_hightouch
  schedule_start_date: 2025, 8, 20
  owner: Data Growth
  documentation:
    dag_purpose: |
      This DAG ingests sync logs data from Hightouch.
workflow:
  type: query_delta
  layer: enrich
  default_extraction_type: incremental
  default_partitions: [year, month, day]
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, -1), 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  inner_dependencies:
    sync_changelog:
      - sync_runs
  tables_customization:
    sync_runs: {}
    audience_membership: {}
    sync_changelog: {}

cluster:
  type: databricks_16_4_min_io-memory_cluster
  databricks_conn_id: databricks_new_env
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
