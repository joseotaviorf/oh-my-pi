---
database_name: datalake_hightouch
table_name: sync_runs
owner: eduardo.soares@quintoandar.com.br
domain: Growth
description: Clean Hightouch reverse ETL sync run execution metrics tracking data pipeline performance
columns:
  id_sync:
    description: Unique identifier for the sync configuration
    lineage:
      - datalake_hightouch_logs_clean.sync_runs_databricks.id_sync
      - datalake_hightouch_logs_clean.sync_runs_trino.id_sync
  id_sync_run:
    description: Unique identifier for the specific sync run execution
    lineage:
      - datalake_hightouch_logs_clean.sync_runs_databricks.id_sync_run
      - datalake_hightouch_logs_clean.sync_runs_trino.id_sync_run
  id_model:
    description: Unique identifier for the data model
    lineage:
      - datalake_hightouch_logs_clean.sync_runs_databricks.id_model
      - datalake_hightouch_logs_clean.sync_runs_trino.id_model
  primary_key:
    description: Primary key configuration used for the sync
    lineage:
      - datalake_hightouch_logs_clean.sync_runs_databricks.primary_key
      - datalake_hightouch_logs_clean.sync_runs_trino.primary_key
  destination:
    description: Target destination where data is being synchronized
    lineage:
      - datalake_hightouch_logs_clean.sync_runs_databricks.destination
      - datalake_hightouch_logs_clean.sync_runs_trino.destination
  model_name:
    description: Name of the data model being synchronized
    lineage:
      - datalake_hightouch_logs_clean.sync_runs_databricks.model_name
      - datalake_hightouch_logs_clean.sync_runs_trino.model_name
  error:
    description: Error message if the sync run encountered issues
    lineage:
      - datalake_hightouch_logs_clean.sync_runs_databricks.error
      - datalake_hightouch_logs_clean.sync_runs_trino.error
  status:
    description: Overall status of the sync run (success, failed, running)
    lineage:
      - datalake_hightouch_logs_clean.sync_runs_databricks.status
      - datalake_hightouch_logs_clean.sync_runs_trino.status
  num_planned_add:
    description: Number of records planned to be added
    lineage:
      - datalake_hightouch_logs_clean.sync_runs_databricks.num_planned_add
      - datalake_hightouch_logs_clean.sync_runs_trino.num_planned_add
  num_planned_change:
    description: Number of records planned to be changed
    lineage:
      - datalake_hightouch_logs_clean.sync_runs_databricks.num_planned_change
      - datalake_hightouch_logs_clean.sync_runs_trino.num_planned_change
  num_planned_remove:
    description: Number of records planned to be removed
    lineage:
      - datalake_hightouch_logs_clean.sync_runs_databricks.num_planned_remove
      - datalake_hightouch_logs_clean.sync_runs_trino.num_planned_remove
  num_attempted_add:
    description: Number of records attempted to be added
    lineage:
      - datalake_hightouch_logs_clean.sync_runs_databricks.num_attempted_add
      - datalake_hightouch_logs_clean.sync_runs_trino.num_attempted_add
  num_attempted_change:
    description: Number of records attempted to be changed
    lineage:
      - datalake_hightouch_logs_clean.sync_runs_databricks.num_attempted_change
      - datalake_hightouch_logs_clean.sync_runs_trino.num_attempted_change
  num_attempted_remove:
    description: Number of records attempted to be removed
    lineage:
      - datalake_hightouch_logs_clean.sync_runs_databricks.num_attempted_remove
      - datalake_hightouch_logs_clean.sync_runs_trino.num_attempted_remove
  num_succeeded_add:
    description: Number of records successfully added
    lineage:
      - datalake_hightouch_logs_clean.sync_runs_databricks.num_succeeded_add
      - datalake_hightouch_logs_clean.sync_runs_trino.num_succeeded_add
  num_succeeded_change:
    description: Number of records successfully changed
    lineage:
      - datalake_hightouch_logs_clean.sync_runs_databricks.num_succeeded_change
      - datalake_hightouch_logs_clean.sync_runs_trino.num_succeeded_change
  num_succeeded_remove:
    description: Number of records successfully removed
    lineage:
      - datalake_hightouch_logs_clean.sync_runs_databricks.num_succeeded_remove
      - datalake_hightouch_logs_clean.sync_runs_trino.num_succeeded_remove
  num_failed_add:
    description: Number of records that failed to be added
    lineage:
      - datalake_hightouch_logs_clean.sync_runs_databricks.num_failed_add
      - datalake_hightouch_logs_clean.sync_runs_trino.num_failed_add
  num_failed_change:
    description: Number of records that failed to be changed
    lineage:
      - datalake_hightouch_logs_clean.sync_runs_databricks.num_failed_change
      - datalake_hightouch_logs_clean.sync_runs_trino.num_failed_change
  num_failed_remove:
    description: Number of records that failed to be removed
    lineage:
      - datalake_hightouch_logs_clean.sync_runs_databricks.num_failed_remove
      - datalake_hightouch_logs_clean.sync_runs_trino.num_failed_remove
  ts_started:
    description: Timestamp when the sync run was initiated
    lineage:
      - datalake_hightouch_logs_clean.sync_runs_databricks.ts_started
      - datalake_hightouch_logs_clean.sync_runs_trino.ts_started
  ts_finished:
    description: Timestamp when the sync run completed
    lineage:
      - datalake_hightouch_logs_clean.sync_runs_databricks.ts_finished
      - datalake_hightouch_logs_clean.sync_runs_trino.ts_finished
  year:
    description: Partition column representing the year of the data
    lineage:
      - datalake_hightouch_logs_clean.sync_runs_databricks.year
      - datalake_hightouch_logs_clean.sync_runs_trino.year
  month:
    description: Partition column representing the month of the data
    lineage:
      - datalake_hightouch_logs_clean.sync_runs_databricks.month
      - datalake_hightouch_logs_clean.sync_runs_trino.month
  day:
    description: Partition column representing the day of the data
    lineage:
      - datalake_hightouch_logs_clean.sync_runs_databricks.day
      - datalake_hightouch_logs_clean.sync_runs_trino.day
