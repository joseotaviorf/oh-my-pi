---
database_name: datalake_hightouch
table_name: audience_membership
owner: marcio.gomes@quintoandar.com.br
domain: Growth
description: |
  Enrich layer for Hightouch Customer Studio audience membership events ingested via the
  Trino sync engine. One row per membership event per user per audience, recording when
  a user entered or exited a marketing audience after each successful sync run.
  Sourced from datalake_hightouch_logs_clean.audience_membership_trino (incremental load).
  Partitioned by year, month, day — derived from ts_ht (the Hightouch event timestamp).
  Always filter on year, month, and day together to enable partition pruning and avoid
  full table scans. Example: WHERE year = 2026 AND month = 6 AND day = 9.
  When analyzing a specific audience, combine id_audience with partition predicates to
  restrict the scan further.
  Partitioned by year, month, and day — filter year, month, and day together in WHERE.
columns:
  id_audience:
    description: |
      Hightouch Customer Studio audience identifier. Identifies which saved audience the
      membership event belongs to. Use to filter events by campaign or marketing segment.
    lineage:
      - datalake_hightouch_logs_clean.audience_membership_trino.id_audience
  id_row:
    description: |
      Hightouch-internal primary key of the audience member within a given audience.
      Not the QuintoAndar id_user — cannot be joined to dim_person or dim_user directly.
      Stringified from the source type at the clean layer.
    lineage:
      - datalake_hightouch_logs_clean.audience_membership_trino.id_row
  ht_event_type:
    description: |
      Membership change event type recorded after an audience sync. enter means the user
      newly qualified for the audience; exit means the user no longer qualifies. Use to
      reconstruct audience size over time or detect membership churn.
    lineage:
      - datalake_hightouch_logs_clean.audience_membership_trino.ht_event_type
    categories:
      enter: User newly entered the audience after qualifying for its criteria.
      exit: User exited the audience because they no longer match the audience criteria.
  ht_split_group:
    description: |
      A/B test or audience split group identifier when the audience uses experiment splits
      in Customer Studio. Null when no split is configured for the audience sync.
    lineage:
      - datalake_hightouch_logs_clean.audience_membership_trino.ht_split_group
  ts_ht:
    description: |
      Timestamp when the user entered or exited the audience, as recorded by Hightouch at
      snapshot time. Used as the event time for membership history and time-series audience
      sizing. Drives the year / month / day partition values.
    lineage:
      - datalake_hightouch_logs_clean.audience_membership_trino.ts_ht
  year:
    description: |
      Partition column (year). Derived from ts_ht. Always include in WHERE clause together
      with month and day to enable partition pruning. Omitting any partition column forces
      a full table scan.
    lineage:
      - datalake_hightouch_logs_clean.audience_membership_trino.year
  month:
    description: |
      Partition column (month, 1–12). Derived from ts_ht. Must be filtered together with
      year and day in every query to enable partition pruning.
    lineage:
      - datalake_hightouch_logs_clean.audience_membership_trino.month
  day:
    description: |
      Partition column (day, 1–31). Derived from ts_ht. Always the last partition column
      — filter with year and month to narrow the scan to specific days.
    lineage:
      - datalake_hightouch_logs_clean.audience_membership_trino.day
