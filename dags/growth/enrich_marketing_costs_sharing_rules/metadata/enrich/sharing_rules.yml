database_name: datalake_marketing_costs_sharing_rules
table_name: sharing_rules
domain: Growth
owner: henrique.paulo@quintoandar.com.br
description: |
  Unified catalog of marketing cost allocation rules maintained by Growth Marketing DAs.
  One row per effective date, rule identifier, city group, funnel side, and business context,
  sourced from the per-rule enrich tables in this DAG (online and offline SQL definitions).
  Each row defines the percentage share of campaign spend attributed to a city group.
  Consumed by daily marketing cost pipelines (automatic and manual) and consolidated media
  metrics for regional cost reporting, CAC analysis, and Growth performance dashboards.
