---
table_name: datalake_company_clean.company_product
alert_channel: "#alerts-de-airflow-dags"

table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: -10
    less_than_or_equal_to: 50
    severity_level: Warning

column_level_validations:
  id_company:
    is_complete:
      severity_level: Error
  one_row_per_id_company_and_id_product:
    custom:
      # No duplicate rows for the same (id_company, id_product) composite key.
      constraint: "(SELECT COUNT(*) FROM (SELECT 1 FROM datalake_company_clean.company_product GROUP BY id_company, id_product HAVING COUNT(*) > 1)) = 0"
      severity_level: Error
  id_product:
    is_complete:
      severity_level: Error
  status:
    is_complete:
      severity_level: Error
    is_contained_in:
      values:
        - ACTIVE
        - PENDING_COMPLETION
        - INACTIVE
      severity_level: Error