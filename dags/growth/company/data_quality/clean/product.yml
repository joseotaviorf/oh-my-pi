---
table_name: datalake_company_clean.product
alert_channel: "#alerts-de-airflow-dags"

table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: -10
    less_than_or_equal_to: 50
    severity_level: Warning

column_level_validations:
  id:
    is_unique:
      severity_level: Error
    is_complete:
      severity_level: Error
  uuid_product:
    is_complete:
      severity_level: Error
  name:
    is_complete:
      severity_level: Error
  status:
    is_complete:
      severity_level: Error
    is_contained_in:
      values:
        - ACTIVE
        - INACTIVE
      severity_level: Error
  business_segment:
    is_complete:
      severity_level: Error
    is_contained_in:
      values:
        - REDE_RENT
        - REDE_SALE
        - QUINTOANDAR
        - RENTALGUARANTEE
        - LEGAL_PERSON_RENTAL_GUARANTEE
        - PP_MULTI
        - CIQ
        - ASP
        - AUTONOMOUS_BROKERAGE_AGENT
        - PRO_ACQUIRER_AGENT
        - PRO_ACQUIRER_MANAGER_AGENT
        - INTEGRATION_PARTNER
        - INSPECTOR
        - PHOTOGRAPHER
        - ALIAS
      severity_level: Error
  version:
    is_complete:
      severity_level: Error
  ts_created:
    is_complete:
      severity_level: Error
  ts_updated:
    is_complete:
      severity_level: Error
  year:
    is_complete:
      severity_level: Error
  month:
    is_complete:
      severity_level: Error
    has_min_value:
      greater_than_or_equal_to: 1
      severity_level: Error
    has_max_value:
      less_than_or_equal_to: 12
      severity_level: Error
  day:
    is_complete:
      severity_level: Error
    has_min_value:
      greater_than_or_equal_to: 1
      severity_level: Error
    has_max_value:
      less_than_or_equal_to: 31
      severity_level: Error
