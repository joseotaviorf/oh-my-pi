---
table_name: datalake_company_clean.company_document
alert_channel: "#alerts-de-airflow-dags"

table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: -10
    less_than_or_equal_to: 50
    severity_level: Warning

column_level_validations:
  id_company:
    is_complete:
      severity_level: Error
  one_row_per_id_company_and_id_document:
    custom:
      # No duplicate rows for the same (id_company, id_document) composite key.
      constraint: "(SELECT COUNT(*) FROM (SELECT 1 FROM datalake_company_clean.company_document GROUP BY id_company, id_document HAVING COUNT(*) > 1)) = 0"
      severity_level: Error
  id_document:
    is_complete:
      severity_level: Error
  ts_created:
    is_complete:
      severity_level: Error
  ts_updated:
    is_complete:
      severity_level: Error
  year:
    is_complete:
      severity_level: Error
  month:
    is_complete:
      severity_level: Error
    has_min_value:
      greater_than_or_equal_to: 1
      severity_level: Error
    has_max_value:
      less_than_or_equal_to: 12
      severity_level: Error
  day:
    is_complete:
      severity_level: Error
    has_min_value:
      greater_than_or_equal_to: 1
      severity_level: Error
    has_max_value:
      less_than_or_equal_to: 31
      severity_level: Error
