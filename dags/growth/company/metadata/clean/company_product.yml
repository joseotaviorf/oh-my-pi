---
database_name: datalake_company_clean
table_name: company_product
owner: isadora.gallerani@quintoandar.com.br
domain: Growth
description: |
  Many-to-many relationship table linking companies to products/services they offer. Enables flexible business models where companies can provide multiple products and products can be offered by multiple partner companies. Includes product-specific configuration settings in JSONB format for customization. Created 2022-10-31 during major architecture refactoring to replace direct company-product foreign keys. Enhanced 2024-07 with status field for product lifecycle management. Partitioned by year, month, and day — filter all three partition columns in WHERE for pruning.
columns:
  id_company:
    lineage:
      - datalake_company_raw.company_product.company_id
    description: 'Foreign key to company.id (BIGINT). Identifies the company entity providing the product/service. Combined with id_product forms the composite primary key for this relationship table.'
  id_product:
    lineage:
      - datalake_company_raw.company_product.product_id
    description: 'Foreign key to product.id (BIGINT). Identifies the specific product/service being offered by the company. Combined with id_company forms the composite primary key for this relationship table.'
  status:
    lineage:
      - datalake_company_raw.company_product.status
    description: 'Status of the company-product relationship. Used to track the if the product is active or inactive.'
  product_settings:
    lineage:
      - datalake_company_raw.company_product.product_settings
    description: 'Flexible configuration settings (JSONB, nullable). Company-specific customizations for how the product is offered, including pricing rules, feature toggles, regional settings, or business-specific parameters. Enables product personalization without schema changes.'