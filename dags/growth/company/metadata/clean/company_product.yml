---
database_name: datalake_company_clean
table_name: company_product
owner: isadora.gallerani@quintoandar.com.br
domain: Growth
description: |
  Many-to-many relationship table linking companies to products/services they offer. Enables flexible business models where companies can provide multiple products and products can be offered by multiple partner companies. Includes product-specific configuration settings in JSONB format for customization. Created 2022-10-31 during major architecture refactoring to replace direct company-product foreign keys. Enhanced 2024-07 with status field for product lifecycle management. Deactivation reason fields capture why a company-product link was inactivated. Partitioned by year, month, and day — filter all three partition columns in WHERE for pruning.
columns:
  id_company:
    lineage:
      - datalake_company_raw.company_product.company_id
    description: 'Foreign key to company.id (BIGINT). Identifies the company entity providing the product/service. Combined with id_product forms the composite primary key for this relationship table.'
  id_product:
    lineage:
      - datalake_company_raw.company_product.product_id
    description: 'Foreign key to product.id (BIGINT). Identifies the specific product/service being offered by the company. Combined with id_company forms the composite primary key for this relationship table.'
  status:
    lineage:
      - datalake_company_raw.company_product.status
    description: 'Status of the company-product relationship. Used to track the if the product is active or inactive.'
    categories:
      ACTIVE: Product is active for the company.
      PENDING_COMPLETION: Product registration is in progress.
      INACTIVE: Product is inactive for the company.
  product_settings:
    lineage:
      - datalake_company_raw.company_product.product_settings
    description: 'Flexible configuration settings (JSONB, nullable). Company-specific customizations for how the product is offered, including pricing rules, feature toggles, regional settings, or business-specific parameters. Enables product personalization without schema changes.'
  deactivation_reason:
    lineage:
      - datalake_company_raw.company_product.deactivation_reason
    description: |
      Primary reason code recorded when the company-product relationship is deactivated (VARCHAR, nullable).
      Populated when status is INACTIVE; values depend on product-specific deactivation taxonomies in the Company service.
  deactivation_sub_reason:
    lineage:
      - datalake_company_raw.company_product.deactivation_sub_reason
    description: |
      Granular sub-reason within deactivation_reason (VARCHAR, nullable). Valid only for the parent deactivation_reason
      configured for the product; NULL when inactive without a structured reason or when not applicable.
  deactivation_additional_comment:
    lineage:
      - datalake_company_raw.company_product.deactivation_additional_comment
    description: |
      Free-text comment supplied when deactivating the company-product relationship. Null when
      no comment was provided or while the relationship is active.
  op_cdc:
    description: Change operation emitted by the PostgreSQL CDC framework for this company_product row.
    categories:
      r: Read/snapshot - initial load of existing records.
      c: Create - new record inserted.
      u: Update - existing record modified.
      d: Delete - record removed.
  ts_cdc_transaction:
    description: UTC timestamp when the CDC framework captured this company_product change transaction.
  ts_database_transaction:
    description: UTC timestamp when the source PostgreSQL database committed this company_product change.
      Secondary deactivation reason providing additional taxonomy detail when the company-product
      relationship is deactivated. Null while the relationship is active.
    lineage:
      - datalake_company_raw.company_product.ts_database_transaction
    description: Timestamp of the originating database transaction in the company service before CDC propagation.
