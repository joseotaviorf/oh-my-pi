database_name: datalake_wololo_lead
table_name: lead_sales_company
domain: Growth
owner: gabriel.salla@quintoandar.com
description: Enrich table with one row per supply lead (id_lead) and the latest sales company assignment sent from Wololo audit history.
  Derived from prospect_aud, prospect_dimension_aud, and rev_info.
columns:
  id_lead:
    lineage:
    - datalake_wololo_clean.prospect_aud.id_reference
    description: Supply lead identifier (prospect.id_reference); joins to id_lead_ebdb in supply conversion pipelines.
  sales_company:
    lineage:
    - datalake_wololo_clean.prospect_dimension_aud.sales_company
    description: Third-party sales company assigned to contact and convert the prospect in the 1P supply funnel.
  ts_sales_company_sent:
    lineage:
    - datalake_wololo_clean.rev_info.ts_rev
    description: Timestamp when the current sales company assignment was last sent or changed for the lead.
