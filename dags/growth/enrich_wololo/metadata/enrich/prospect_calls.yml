database_name: datalake_wololo_prospect
table_name: prospect_calls
description: This is an enrichment table that brings the calls made by third-party
  companies to property owners who are not yet registered on our platform (prospects),
  within the Prospect 2 Opportunity conversion funnel.
domain: Growth
owner: ae-growth@quintoandar.com.br
columns:
  id_prospect:
    lineage:
    - datalake_wololo_clean.prospect.id_reference
    description: The proespect identifier.
  id_wololo_prospect:
    lineage:
    - datalake_wololo_clean.prospect.id
    description: The prospect identifier in the Wololo's Prospect table.
  id_call_analyst:
    lineage:
    - datalake_wololo_clean.contact.id_analyst
    description: The identifier of the third-party call analyst.
  phone_number:
    lineage:
    - datalake_wololo_clean.contact.phone_number
    description: The prospect phone number the call was made to.
  channel:
    lineage:
    - datalake_wololo_clean.contact.channel
    description: Contact channel.
  call_output:
    lineage:
    - datalake_wololo_clean.contact.phone_output
    description: The contact output populated by third-party call analyst.
  round_number:
    lineage:
    - datalake_wololo_clean.round.round_number
    description: Number of the call round (group of calls).
  round_max_tries:
    lineage:
    - datalake_wololo_clean.round.round_max_tries
    description: Max number of calls allowed in the round.
  ts_contacted:
    lineage:
    - datalake_wololo_clean.contact.ts_contacted
    description: Timestamp of the call.
  ts_round_started:
    lineage:
    - datalake_wololo_clean.round.ts_created
    description: Timestamp of the call round start.
