---
database_name: datalake_notify_me_clean
table_name: messages
owner: leticia.lima@quintoandar.com.br
domain: growth
description: This table contains details about the messages that are sent to the users. A message is sent when the alert created is triggered, for example, by the addition of a new property or or by permitting visits to a property.
columns:
  id_message:
    description: Unique key that identifies a message sent to a user.
    lineage:
      - datalake_notify_me_raw.messages.id
  id_alert:
    description: Unique key that identifies the alert created by a User. Multiple messages can be related to a same alert.
    lineage:
      - datalake_notify_me_raw.messages.alert_id
  recipient:
    description: Unique key that identifies the user that is going to receive the message.
    lineage:
      - datalake_notify_me_raw.messages.recipient
  content:
    description: A JSON that contains all details that will be sent through the message.
    lineage:
      - datalake_notify_me_raw.messages.content
  ts_sent:
    description: Timestamp of when the message was sent.
    lineage:
      - datalake_notify_me_raw.messages.sent_at
  ts_created:
    description: Timestamp of when the message was created.
    lineage:
      - datalake_notify_me_raw.messages.created_at
  ts_updated:
    description: Timestamp of when the message was last updated.
    lineage:
      - datalake_notify_me_raw.messages.updated_at
