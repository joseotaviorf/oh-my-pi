---
database_name: datalake_notify_me_clean
table_name: messages_aud
owner: leticia.lima@quintoandar.com.br
domain: growth
description: This table contains details about the messages that are sent to the users. A message is sent when the alert created is triggered, for example, by the addition of a new property or or by permitting visits to a property. Also includes information about changes on the information.
columns:
  id_message:
    description: Unique key that identifies a message sent to a user.
    lineage:
      - datalake_notify_me_raw.messages_aud.id
  rev:
    description: ''
    lineage:
      - datalake_notify_me_raw.messages_aud.rev
  revend:
    description: ''
    lineage:
      - datalake_notify_me_raw.messages_aud.revend
  revtype:
    description: ''
    lineage:
      - datalake_notify_me_raw.messages_aud.revtype
  id_alert:
    description: Unique key that identifies the alert created by a User. Multiple messages can be related to a same alert.
    lineage:
      - datalake_notify_me_raw.messages_aud.alert_id
  id_alert_mod:
    description: Boolean field that indicated if the mentioned column was modified.
    lineage:
      - datalake_notify_me_raw.messages_aud.alert_id_mod
  recipient:
    description: Unique key that identifies the user that is going to receive the message.
    lineage:
      - datalake_notify_me_raw.messages_aud.recipient
  recipient_mod:
    description: Boolean field that indicated if the mentioned column was modified.
    lineage:
      - datalake_notify_me_raw.messages_aud.recipient_mod
  content:
    description: A JSON that contains all details that will be sent through the message.
    lineage:
      - datalake_notify_me_raw.messages_aud.content
  content_mod:
    description: Boolean field that indicated if the mentioned column was modified.
    lineage:
      - datalake_notify_me_raw.messages_aud.content_mod
  ts_sent:
    description: Timestamp of when the message was sent.
    lineage:
      - datalake_notify_me_raw.messages_aud.sent_at
  ts_sent_mod:
    description: Boolean field that indicated if the mentioned column was modified.
    lineage:
      - datalake_notify_me_raw.messages_aud.sent_at_mod
  ts_created:
    description: Timestamp of when the message was created.
    lineage:
      - datalake_notify_me_raw.messages_aud.created_at
  ts_updated:
    description: Boolean field that indicated if the mentioned column was modified.
    lineage:
      - datalake_notify_me_raw.messages_aud.updated_at
