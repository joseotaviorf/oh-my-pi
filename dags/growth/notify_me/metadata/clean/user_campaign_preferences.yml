---
database_name: datalake_notify_me_clean
table_name: user_campaign_preferences
owner: leticia.lima@quintoandar.com.br
domain: growth
description: This tables indicated to which campaigns a user is subscribed.
columns:
  id_user_campaign_preferences:
    description: Unique key that identifies a user's preference.
    lineage:
      - datalake_notify_me_raw.user_campaign_preferences.id
  id_user:
    description: Unique key that identifies a User. This id is the same present on the table datalake_notify_me_clean.users.
    lineage:
      - datalake_notify_me_raw.user_campaign_preferences.user_id
  campaign_name:
    description: Name of the campaign which will trigger notifications.
    lineage:
      - datalake_notify_me_raw.user_campaign_preferences.campaign_name
  ts_created:
    description: Timestamp of when the user preferences was created.
    lineage:
      - datalake_notify_me_raw.user_campaign_preferences.created_at
  ts_updated:
    description: Timestamp of when the user preferences was last updated.
    lineage:
      - datalake_notify_me_raw.user_campaign_preferences.updated_at
