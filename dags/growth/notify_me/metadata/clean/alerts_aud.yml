---
database_name: datalake_notify_me_clean
table_name: alerts_aud
owner: leticia.lima@quintoandar.com.br
domain: growth
description: This table contains details about the alerts created by Demand Users to be notified about a specific property ou about properties with certain characteristics. Also includes information about changes on the information.
columns:
  id:
    description: Unique key that identifies the alert created by a Demand User.
    lineage:
      - datalake_notify_me_raw.alerts_aud.id
  rev:
    description: ''
    lineage:
      - datalake_notify_me_raw.alerts_aud.rev
  revend:
    description: ''
    lineage:
      - datalake_notify_me_raw.alerts_aud.revend
  revtype:
    description: ''
    lineage:
      - datalake_notify_me_raw.alerts_aud.revtype
  id_user:
    description: Unique key that identifies a User. This id is the same present on the table datalake_notify_me_clean.users.
    lineage:
      - datalake_notify_me_raw.alerts_aud.user_id
  id_user_mod:
    description: Boolean field that indicated if the mentioned column was modified.
    lineage:
      - datalake_notify_me_raw.alerts_aud.user_id_mod
  active:
    description: Boolean field that indicates if the alert is active or not.
    lineage:
      - datalake_notify_me_raw.alerts_aud.active
  active_mod:
    description: Boolean field that indicated if the mentioned column was modified.
    lineage:
      - datalake_notify_me_raw.alerts_aud.active_mod
  campaign_name:
    description: Name of the campaign which the alert belongs to. The possible campaign can be found in datalake_notify_me_clean.campaigns.
    lineage:
      - datalake_notify_me_raw.alerts_aud.campaign_name
  campaign_name_mod:
    description: Boolean field that indicated if the mentioned column was modified.
    lineage:
      - datalake_notify_me_raw.alerts_aud.campaign_name_mod
  conditions:
    description: Filters applied by the user when creating the alert request.
    lineage:
      - datalake_notify_me_raw.alerts_aud.conditions
  conditions_mod:
    description: ''
    lineage:
      - datalake_notify_me_raw.alerts_aud.conditions_mod
  processing_status:
    description: Alert status.'
    lineage:
      - datalake_notify_me_raw.alerts_aud.processing_status
  processing_status_mod:
    description: Boolean field that indicated if the mentioned column was modified.
    lineage:
      - datalake_notify_me_raw.alerts_aud.processing_status_mod
  ts_created:
    description: Timestamp of when the alert was created.
    lineage:
      - datalake_notify_me_raw.alerts_aud.created_at
  ts_updated:
    description: Timestamp of when the alert was last updated.
    lineage:
      - datalake_notify_me_raw.alerts_aud.updated_at
