---
database_name: datalake_notify_me_clean
table_name: subscriptions
owner: leticia.lima@quintoandar.com.br
domain: growth
description: This table indicates through where a user will receive their notification based on the user's preference.
columns:
  id_subscription:
    description: Unique key that identifies a user subscription.
    lineage:
      - datalake_notify_me_raw.subscriptions.id
  user_campaign_preferences:
    description: Unique key that identifies a user campaign preferece. This id is the same present on the table datalake_notify_me_clean.user_campaign_preferences.
    lineage:
      - datalake_notify_me_raw.subscriptions.user_campaign_preferences
  whatsapp:
    description: Indicates if a user accepts to receive notifications through whatsapp.
    lineage:
      - datalake_notify_me_raw.subscriptions.whatsapp
  email:
    description: Indicates if a user accepts to receive notifications through email.
    lineage:
      - datalake_notify_me_raw.subscriptions.email
  push:
    description: Indicates if a user accepts to receive notifications through push.
    lineage:
      - datalake_notify_me_raw.subscriptions.push
  ts_created:
    description: Timestamp of when the subscription was created.
    lineage:
      - datalake_notify_me_raw.subscriptions.created_at
  ts_updated:
    description: Timestamp of when the subscription was last updated.
    lineage:
      - datalake_notify_me_raw.subscriptions.updated_at
