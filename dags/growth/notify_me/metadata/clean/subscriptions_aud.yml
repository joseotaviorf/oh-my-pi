    description: Boolean field that indicated if the mentioned column was modified.
    lineage:
      - datalake_notify_me_raw.subscriptions_aud.whatsapp_mod
  email:
    description: Indicates if a user accepts to receive notifications through email.
    lineage:
      - datalake_notify_me_raw.subscriptions_aud.email
  email_mod:
    description: Boolean field that indicated if the mentioned column was modified.
    lineage:
      - datalake_notify_me_raw.subscriptions_aud.email_mod
  push:
    description: Indicates if a user accepts to receive notifications through push.
    lineage:
      - datalake_notify_me_raw.subscriptions_aud.push
  push_mod:
    description: Boolean field that indicated if the mentioned column was modified.
    lineage:
      - datalake_notify_me_raw.subscriptions_aud.push_mod
  ts_created:
    description: Timestamp of when the subscription was created.
    lineage:
      - datalake_notify_me_raw.subscriptions_aud.created_at
  ts_updated:
    description: Timestamp of when the subscription was last updated.
    lineage:
      - datalake_notify_me_raw.subscriptions_aud.updated_at
