domain: growth
description: This table indicates through where a user will receive their notification based on the user's preference. Also includes information about changes on the information.
columns:
  id_subscription:
    description: Unique key that identifies a user subscription.
    lineage:
      - datalake_notify_me_raw.subscriptions_aud.id
  rev:
    description: ''
    lineage:
      - datalake_notify_me_raw.subscriptions_aud.rev
  revend:
    description: ''
    lineage:
      - datalake_notify_me_raw.subscriptions_aud.revend
  revtype:
    description: ''
    lineage:
      - datalake_notify_me_raw.subscriptions_aud.revtype
  user_campaign_preferences:
    description: Unique key that identifies a user campaign preferece. This id is the same present on the table datalake_notify_me_clean.user_campaign_preferences.
    lineage:
      - datalake_notify_me_raw.subscriptions_aud.user_campaign_preferences
  user_campaign_preferences_mod:
    description: Boolean field that indicated if the mentioned column was modified.
    lineage:
      - datalake_notify_me_raw.subscriptions_aud.user_campaign_preferences_mod
  whatsapp:
    description: Indicates if a user accepts to receive notifications through whatsapp.
    lineage:
      - datalake_notify_me_raw.subscriptions_aud.whatsapp
