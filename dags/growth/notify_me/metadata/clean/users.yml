---
database_name: datalake_notify_me_clean
table_name: users
owner: leticia.lima@quintoandar.com.br
domain: growth
description: This tables contains information about the users that are going to receive notifications.
columns:
  id_user:
    description: Unique key that identifies a User.
    lineage:
      - datalake_notify_me_raw.users.id
  id_external:
    description: Foreign key that identifies a User. Is the same id present on dw_public.dim_user.
    lineage:
      - datalake_notify_me_raw.users.external_id
  name:
    description: User's name. It can be a full name or just first name.
    lineage:
      - datalake_notify_me_raw.users.name
  email:
    description: User's email where the message is going to be sent to.
    lineage:
      - datalake_notify_me_raw.users.email
  phone:
    description: User's phone number where the message is going to be sent to.
    lineage:
      - datalake_notify_me_raw.users.phone
  ts_created:
    description: Timestamp of when the user record was created.
    lineage:
      - datalake_notify_me_raw.users.created_at
  ts_updated:
    description: Timestamp of when the user record was last updated.
    lineage:
      - datalake_notify_me_raw.users.updated_at
