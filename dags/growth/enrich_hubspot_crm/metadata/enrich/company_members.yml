---
database_name: datalake_hubspot
table_name: company_members
description: |
  Enriched company membership tracking table with comprehensive member status analysis and business qualification metrics. 
  Each row represents a company that has achieved member status or has membership history, filtered to exclude merged 
  or archived entities. This table provides a clean, analytics-ready view of the company membership base with enriched 
  business intelligence for member lifecycle analysis and retention optimization.
  
  **Key Features:**
  - Active and historical member company tracking with status qualification logic
  - Lead status progression analysis specific to member conversion paths
  - Data quality controls excluding merged, archived, or invalid company records
  - Member lifecycle tracking from lead generation through membership achievement
  - Ownership and territory attribution for member acquisition performance analysis
  - Business context enrichment for member segmentation and retention strategies
domain: Growth
owner: vitor.musachio@quintoandar.com.br
columns:
  id_company:
    lineage:
      - datalake_hubspot.company.id_company
    description: Unique identifier of the HubSpot company record in the CRM.
  id_hubspot_owner:
    lineage:
      - datalake_hubspot.company.id_hubspot_owner
    description: ID of the HubSpot owner associated with the company.
  cnpj:
    lineage:
      - datalake_hubspot.company.cnpj
    description: CNPJ of the Brasil company, cleaned to have only numbers.
  creci:
    lineage:
      - datalake_hubspot.company.creci
    description: CRECI document of the company, cleaned to have only numbers and letters.
  company_cluster:
    lineage:
      - datalake_hubspot.company.company_cluster
    description: 'Cluster assigned to the company by the Ops team'
  company_name:
    lineage:
      - datalake_hubspot.company.name
    description: Display name of the HubSpot company as registered in the CRM.
  company_cluster_performance:
    lineage:
      - datalake_hubspot.company.cluster_performance
    description: Cluster that indicates the type of Rede partnership according to the Performance teams classification.
  crm:
    lineage:
      - datalake_hubspot.company.crm
    description: Which CRM the Company uses.
  extracted_3p_tag:
    lineage:
      - datalake_hubspot.company.extracted_3p_tag
    description: 'Represents the real estate agency. It is extracted from the tag column, like "[3P-<extracted_3p_tag>]"'
  member_category:
    lineage:
      - datalake_hubspot.company.member_category
    description: Category of the member. To be removed June 7th, replaced by sale_member_category and rent_member_category.
    categories:
      Prata: 'Silver'
      Ouro: 'Gold'
      Diamante: 'Diamond'
  sale_lead_status:
    lineage:
      - datalake_hubspot.company.sale_lead_status
    description: Status of the company sale lead in HubSpot.
  is_flagged_as_leadgen:
    lineage:
      - datalake_hubspot.company.is_flagged_as_leadgen
    description: Whether or not the company has agents in Lead Gen program.
  has_3p_access_control:
    description: >
      Boolean flag indicating that this event is subject to 3P Partners access control policies.
      Used by data governance tools and access control systems to apply 3P-specific security policies.
  ts_created:
    lineage:
      - datalake_hubspot.company.ts_created
    description: Time when the company lead was created in HubSpot.
  ts_updated:
    lineage:
      - datalake_hubspot.company.ts_updated
    description: Time when the row was last updated.
  year:
    lineage:
      - datalake_hubspot.company.year
    description: Calendar year used as a partition key for incremental table loads.
  month:
    lineage:
      - datalake_hubspot.company.month
    description: Calendar month used as a partition key for incremental table loads.
  day:
    lineage:
      - datalake_hubspot.company.day
    description: Calendar day used as a partition key for incremental table loads.