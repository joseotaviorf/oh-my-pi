---
database_name: datalake_hubspot
table_name: contact_history
description: |
  Historical tracking table for contact changes in HubSpot CRM with comprehensive change attribution and temporal analytics. 
  Each row represents a daily snapshot of contact state changes, enabling time-series analysis and change attribution. 
  This table captures the evolution of contact data over time with enriched metadata for tracking business process 
  effectiveness and customer journey progression.
  
  **Key Features:**
  - Daily granularity change tracking with complete property history
  - Source attribution for understanding what triggered changes (API, UI, automation, etc.)
  - Lifecycle stage progression tracking for conversion funnel analysis
  - Marketing attribution with first-touch and last-touch campaign tracking
  - Cross-platform relationship tracking with internal systems (EBDB)
  - Lead scoring evolution and engagement pattern analysis over time
domain: Growth
owner: vitor.musachio@quintoandar.com.br
columns:
  id_contact:
    lineage:
      - datalake_hubspot_clean.contact.id_contact
    description: Unique identifier of the contact.
  id_hubspot_owner:
    lineage:
      - datalake_hubspot_clean.contact.properties
    description: ID of the HubSpot owner associated with the contact.
  id_company:
    lineage:
      - datalake_hubspot_clean.contact.associations
    description: ID of the main company associated with the contact (more than one can be associated.
      That can be seen in datalake_hubspot.company_contact).
  id_ebdb_user:
    lineage:
      - datalake_ebdb_clean.user.id
    description: ID of the EBDB user associated with the contact, matched by email.
  company_associations:
    lineage:
      - datalake_hubspot_clean.contact.associations
    description: IDs and types of the companies associated with the contact.
  hs_analytics_first_touch_converting_campaign:
