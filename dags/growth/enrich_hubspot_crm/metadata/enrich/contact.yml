  mobile_phone:
    lineage:
    - datalake_hubspot.contact_history.mobile_phone
    description: Mobile telephone number stored on the HubSpot contact for sales outreach and messaging integrations.
  phone:
    lineage:
    - datalake_hubspot.contact_history.phone
    description: Primary phone number of the HubSpot contact record.
  website:
    lineage:
    - datalake_hubspot.contact_history.website
    description: Website URL associated with the HubSpot contact record.
  first_name:
    lineage:
    - datalake_hubspot.contact_history.first_name
