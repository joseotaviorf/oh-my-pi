---
database_name: datalake_hubspot
table_name: contact
description: |
  Enriched contact entities from HubSpot CRM with comprehensive customer intelligence and engagement analytics. 
  Each row represents a unique contact in its current state, enriched with calculated metrics, lifecycle tracking, 
  and attribution data. This table provides an analytics-ready view of customer profiles with business logic 
  for lead scoring, engagement analysis, and customer journey tracking.
  
  **Key Enrichments:**
  - Contact lifecycle stage progression with attribution tracking
  - Lead source and campaign attribution for marketing effectiveness analysis
  - Company relationship mapping with deciding contact identification
  - Cross-platform matching with internal systems (EBDB) for unified customer profiles
  - Engagement scoring and interaction frequency calculations
  - Geographic and demographic standardization for segmentation analysis
domain: Growth
owner: vitor.musachio@quintoandar.com.br
columns:
  id_contact:
    lineage:
    - datalake_hubspot.contact_history.id_contact
    description: Unique identifier of the contact.
  id_hubspot_owner:
    lineage:
    - datalake_hubspot.contact_history.id_hubspot_owner
    description: ID of the HubSpot owner associated with the contact.
  id_company:
    lineage:
    - datalake_hubspot.contact_history.id_company
    description: ID of the main company associated with the contact (more than one
      can be associated. That can be seen in datalake_hubspot.company_contact).
  id_ebdb_user:
    lineage:
    - datalake_hubspot.contact_history.id_ebdb_user
    description: ID of the user in EBDB associated with the contact, matched by email.
  company_associations:
    lineage:
    - datalake_hubspot.contact_history.company_associations
    description: IDs and types of the companies associated with the contact.
  hs_analytics_first_touch_converting_campaign:
    lineage:
    - datalake_hubspot.contact_history.hs_analytics_first_touch_converting_campaign
    description: Name of the first campaign that generated a conversion for the contact.
  hs_analytics_last_touch_converting_campaign:
    lineage:
    - datalake_hubspot.contact_history.hs_analytics_last_touch_converting_campaign
    description: Name of the last campaign that generated a conversion for the contact.
  hs_analytics_source:
    lineage:
    - datalake_hubspot.contact_history.hs_analytics_source
    description: Original source. First visit or interaction with the business.
  hs_analytics_source_data_1:
    lineage:
    - datalake_hubspot.contact_history.hs_analytics_source_data_1
    description: Original source, drill-down 1. Adds more insight about the first
      visit or interaction with the business.
  hs_analytics_source_data_2:
    lineage:
    - datalake_hubspot.contact_history.hs_analytics_source_data_2
    description: Original source, drill-down 2. Adds more insight about the first
      visit or interaction with the business.
  hs_latest_source_data_1:
    lineage:
    - datalake_hubspot.contact_history.hs_latest_source_data_1
    description: Latest source, drill-down 1. Adds more insight about the last visit
      or interaction with the business.
  hs_latest_source_data_2:
    lineage:
    - datalake_hubspot.contact_history.hs_latest_source_data_2
    description: Latest source, drill-down 2. Adds more insight about the last visit
      or interaction with the business.
  first_conversion_event_name:
    lineage:
    - datalake_hubspot.contact_history.first_conversion_event_name
    description: Marketing form or landing-page event that first converted this contact in HubSpot analytics attribution.
  field_of_business:
    lineage:
    - datalake_hubspot.contact_history.field_of_business
    description: Declared industry or business vertical segment captured on the HubSpot contact profile for segmentation.
  occupation:
    lineage:
    - datalake_hubspot.contact_history.occupation
    description: Job title or professional role reported for the contact inside the linked company organization.
  address:
    lineage:
    - datalake_hubspot.contact_history.address
    description: Street address of the HubSpot contact as stored in the CRM.
  city:
    lineage:
    - datalake_hubspot.contact_history.city
    description: City of residence for the HubSpot contact record.
  state:
    lineage:
    - datalake_hubspot.contact_history.state
    description: State or province of residence for the HubSpot contact record.
  company:
    lineage:
    - datalake_hubspot.contact_history.company
    description: Name of the company associated with the HubSpot contact.
  email:
    lineage:
    - datalake_hubspot.contact_history.email
    description: Primary email address of the HubSpot contact record.
  hs_email_domain:
    lineage:
    - datalake_hubspot.contact_history.hs_email_domain
    description: Internet domain extracted from the contact primary email used for firmographic matching and deliverability checks.
  hs_whatsapp_phone_number:
    lineage:  
    - datalake_hubspot.contact_history.hs_whatsapp_phone_number
