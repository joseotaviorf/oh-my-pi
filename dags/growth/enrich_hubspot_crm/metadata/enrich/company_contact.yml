---
database_name: datalake_hubspot
table_name: company_contact
owner: vitor.musachio@quintoandar.com.br
domain: Growth
description: |
  Enriched relationship mapping table between companies and contacts with comprehensive business context and hierarchy analysis. 
  Each row represents a specific relationship between a company and contact, enriched with business logic for decision-making 
  hierarchies and relationship classification. This table enables sophisticated account-based analytics and relationship intelligence.
  
  **Key Features:**
  - Complete company-contact relationship mapping with business hierarchy context
  - Deciding contact identification using business logic (CEO > Partner/Director > Manager priority)
  - Relationship type classification for understanding business decision-making structures
  - Occupation and role tracking for organizational analysis
  - Association type enrichment for primary vs secondary company relationships
  - Contact influence scoring for account-based marketing and sales strategies
columns:
  id_company:
    lineage:
      - datalake_hubspot.contact.company_associations
    description: Unique identifier of the company in HubSpot.
  id_contact:
    lineage:
      - datalake_hubspot.contact.id_contact
    description: Unique identifier of the contact in HubSpot.
  company_association_type:
    description: HubSpot label describing how the linked company ranks among all companies tied to this contact (primary account versus secondary affiliation).
    categories:
      MAIN_COMPANY: 'The contact''s main company'
      SECONDARY_COMPANY: 'The contact''s secondary company'
  contact_association_type:
    description: HubSpot label describing the contact role inside the company relationship (primary decision-maker versus supporting stakeholder).
    categories:
      DECIDING_CONTACT: 'The contact is the deciding contact for the company. This is preferrably the owner/CEO,
        then a partner/director, then a manager. If there is more than one, the first created is chosen.'
      NON_DECIDING_CONTACT: 'The contact is not the deciding contact for the company'
  occupation:
    description: Job title or professional role reported for the contact inside the linked company organization.
  has_3p_access_control:
    description: >
      Boolean flag indicating that this event is subject to 3P Partners access control policies.
      Used by data governance tools and access control systems to apply 3P-specific security policies.