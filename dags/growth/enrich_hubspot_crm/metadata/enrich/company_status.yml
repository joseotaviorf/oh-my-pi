---
database_name: datalake_hubspot
table_name: company_status
owner: vitor.musachio@quintoandar.com.br
domain: Growth
description: |
  Enriched company lead status tracking table with comprehensive change attribution and business context analysis. 
  Each row represents a specific status change event for a company, capturing the complete context of lead progression 
  including source attribution, user actions, and business logic classification. This table enables detailed analysis 
  of lead conversion processes and status change effectiveness.
  
  **Key Features:**
  - Complete status change event tracking with timestamp precision
  - Source attribution including API calls, UI actions, automation, and imports
  - User attribution for understanding who triggered status changes
  - Business context classification (Rent vs Sale) for segment-specific analysis
  - Change reasoning and trigger identification for process optimization
  - Lead progression funnel analysis with conversion path tracking
columns:
  id_company:
    lineage:
      - datalake_hubspot.company.id_company
    description: Unique identifier of the company in HubSpot.
  id_user_updated_by:
    lineage:
      - datalake_hubspot.company.lead_status_history
    description: Unique identifier of the user who updated the lead status in HubSpot.
  source_type:
    lineage:
      - datalake_hubspot.company.lead_status_history
    description: Source type of the update.
    categories:
      API: ''
      AUTOMATION_PLATFORM: ''
      BATCH_UPDATE: ''
      CRM_UI_BULK_ACTION: ''
      CRM_UI: ''
      IMPORT: ''
      MOBILE_IOS: ''
  business_context:
    description: The business context of the lead status change.
    categories:
      RENT: 'Lead status in the rent context'
      SALE: 'Lead status in the sale context'
  lead_status:
    lineage:
      - datalake_hubspot.company.lead_status_history
    description: The new lead status in HubSpot.
  days_in_status:
    lineage:
      - datalake_hubspot.company.
    description: The number of days the company has been in the status.
  is_partner:
    description: Whether the company is a partner or not at that point.
  has_3p_access_control:
    description: >
      Boolean flag indicating that this event is subject to 3P Partners access control policies.
      Used by data governance tools and access control systems to apply 3P-specific security policies.
  ts_status_started:
    lineage:
      - datalake_hubspot.company.lead_status_history
    description: The timestamp when the lead status started.
  ts_status_ended:
    lineage:
      - datalake_hubspot.company.lead_status_history
    description: The timestamp when the lead status ended.