---
table_name: datalake_hubspot.company
alert_channel: GROWTH_ALERTS
table_level_validations:
  has_size:
    greater_than: 4000
    severity_level: Error
column_level_validations:
  id_company:
    is_complete:
      severity_level: Error
    is_unique:
      severity_level: Error
  cnpj_unique_complete_for_sale_membro:
    custom:
      # HubSpot enforces cnpj_unique for active Rede Sale members; every Membro company must have it populated.
      constraint: |-
        (SELECT COUNT(*)
         FROM datalake_hubspot.company
         WHERE sale_lead_status = 'Membro'
           AND cnpj_unique IS NULL
        ) = 0
      severity_level: Error
  cnpj_unique_unique_for_sale_membro:
    custom:
      # cnpj_unique must not repeat among companies with sale_lead_status = Membro in the current-state snapshot.
      constraint: |-
        (SELECT COUNT(*) FROM (
          SELECT
            cnpj_unique,
            COUNT(*) AS cnt
          FROM
            datalake_hubspot.company
          WHERE
            sale_lead_status = 'Membro'
            AND cnpj_unique IS NOT NULL
          GROUP BY
            cnpj_unique
          HAVING COUNT(*) > 1
        ) AS dup_cnpj_unique) = 0
      severity_level: Error