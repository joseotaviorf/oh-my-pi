---
table_name: datalake_hubspot.deal_stage
alert_channel: "#alerts-de-airflow-dags"
table_level_validations:
  has_size:
    greater_than: 3000
    severity_level: Error
column_level_validations:
  id_deal:
    is_complete:
      severity_level: Error
  id_stage:
    is_complete:
      severity_level: Error
  id_pipeline:
    is_complete:
      severity_level: Error
  days_in_stage:
    is_complete:
      severity_level: Error
    has_min_value:
      greater_than_or_equal_to: 0
      severity_level: Error
  ts_stage_started:
    is_complete:
      severity_level: Error
