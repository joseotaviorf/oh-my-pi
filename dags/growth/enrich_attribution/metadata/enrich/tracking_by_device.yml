---
database_name: datalake_attribution
table_name: tracking_by_device
domain: Growth
owner: "@data-growth"
description: |
  Materialized intermediate table that maintains chronological history of touchpoints per id_device.
  Each row represents a consecutive run of the same utm_hash for a device (gap-and-island grouping): a new
  row is created whenever the utm_hash changes chronologically, even if the same UTM combination appeared
  before. The grain is id_device + utm_hash + contiguous group, so the same UTM combination can appear as
  multiple rows if it was interrupted by a different UTM hash in between. The earliest and latest tracking
  timestamps of each consecutive run are stored as ts_utm_attribution_start and ts_utm_attribution_end.
  UTM values are reconciled between the explicit egw_utm_* columns and the referrer_domain extracted from
  user_properties: when the referrer matches a known search engine (google, bing, yahoo) the touchpoint is
  classified as SEO; when it matches a known LLM domain (chatgpt, gemini, copilot, perplexity, claude,
  you.com, poe.com, deepseek) it is classified as LLM. This table is optimized for efficient joins with
  lead data and chronological ordering of touchpoints for journey analysis.
columns:
  id_device:
    description: Device identifier from user_tracking (id_anonymous). Primary key component for joins with lead data.
    lineage:
      - datalake_cdp_clean.user_tracking.id_anonymous
  utm_source:
    description: |
      UTM source for the touchpoint. When the touchpoint is classified as SEO, the source is derived from
      the referrer_domain (google, bing, yahoo). When classified as LLM, it is derived from the referrer_domain
      (chatgpt, gemini, copilot, perplexity) or set to 'other_llm' for the secondary LLM group. Otherwise it
      falls back to the original egw_utm_source value. Part of merge key.
    lineage:
      - datalake_cdp_clean.user_tracking.egw_utm_source
      - datalake_cdp_clean.user_tracking.user_properties
  utm_medium:
    description: |
      UTM medium for the touchpoint. Defaults to egw_utm_medium when the UTM attribution is more recent than the
      referral attribution (or when no referral exists). Otherwise derived from referrer_domain: 'seo' for known
      search engines (google, bing, yahoo), 'llm' for primary LLM domains (chatgpt, gemini, copilot, perplexity)
      and 'other_llm' for secondary LLM domains (claude, you.com, poe.com, deepseek). Part of merge key.
    lineage:
      - datalake_cdp_clean.user_tracking.egw_utm_medium
      - datalake_cdp_clean.user_tracking.egw_last_attribution_time
      - datalake_cdp_clean.user_tracking.user_properties
  utm_campaign:
    description: |
      UTM campaign for the touchpoint. For SEO touchpoints, set to 'branded' when the entrance URI is the
      QuintoAndar home page and 'non-branded' otherwise. For LLM touchpoints (both primary and secondary),
      set to 'llm'. Otherwise falls back to the original egw_utm_campaign value. Part of merge key.
    lineage:
      - datalake_cdp_clean.user_tracking.egw_utm_campaign
      - datalake_cdp_clean.user_tracking.user_properties
  utm_content:
    description: |
      UTM content for the touchpoint. NULL for SEO and LLM touchpoints; otherwise the original egw_utm_content
      value. Part of merge key.
    lineage:
      - datalake_cdp_clean.user_tracking.egw_utm_content
  utm_term:
    description: |
      UTM term for the touchpoint. NULL for SEO and LLM touchpoints; otherwise the original egw_utm_term value.
      Part of merge key.
    lineage:
      - datalake_cdp_clean.user_tracking.egw_utm_term
  utm_hash:
    description: |
      MD5 hash of the concatenation of utm_source, utm_medium, utm_campaign, utm_content and utm_term (each
      NULL replaced by a placeholder string). Drives the gap-and-island grouping logic: a new group (and
      therefore a new row) is opened whenever the utm_hash value changes chronologically for a given
      id_device, even if the same hash appeared earlier. The hash is also used as the merge key instead of
      the individual UTM columns because NULL values would prevent the delta merge from matching rows;
      replacing NULLs with placeholders before hashing produces a deterministic, non-null surrogate key.
    lineage:
      - datalake_cdp_clean.user_tracking.egw_utm_source
      - datalake_cdp_clean.user_tracking.egw_utm_medium
      - datalake_cdp_clean.user_tracking.egw_utm_campaign
      - datalake_cdp_clean.user_tracking.egw_utm_content
      - datalake_cdp_clean.user_tracking.egw_utm_term
      - datalake_cdp_clean.user_tracking.user_properties
  ts_utm_attribution_start:
    description: |
      Earliest tracking timestamp (MIN of ts_tracking) within the consecutive group. Marks when this
      particular run of the utm_hash started for the device. Because the same UTM combination can generate
      multiple groups (if interrupted by a different utm_hash), this value reflects the first time that UTM
      was seen within this consecutive run, not across all historical occurrences for the device.
    lineage:
      - datalake_cdp_clean.user_tracking.ts_event
  ts_utm_attribution_end:
    description: |
      Latest tracking timestamp (MAX of ts_tracking) within the consecutive group. Marks when this particular
      run of the utm_hash ended for the device. Follows the same consecutive-run scope as
      ts_utm_attribution_start: it reflects the last time that UTM was seen within this consecutive run,
      not across all historical occurrences for the device. Updated when new tracking events extend the run.
    lineage:
      - datalake_cdp_clean.user_tracking.ts_event
