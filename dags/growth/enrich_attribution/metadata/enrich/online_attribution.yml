---
database_name: datalake_attribution
table_name: online_attribution
domain: Growth
owner: "@data-growth"
description: |
  Enriched view that attributes leads to their most recent online touchpoint. Leads from house_lead are joined
  to acquisition_misc_data to retrieve the linked device IDs (extracted from the
  acquisition_campaign:profileTracking:linked_devices JSON array). Each lead is then matched against the
  tracking_by_device history to pick the most recent touchpoint whose ts_utm_attribution_start is at or before
  the lead creation timestamp, keeping a single attribution row per lead.
columns:
  id_lead:
    description: Lead identifier from house_lead (id_lead_ebdb). One row per lead.
    lineage:
      - datalake_rene_descartes_clean.house_lead.id_lead_ebdb
  id_device:
    description: |
      Device identifier of the attributed touchpoint. Sourced from the linked_devices array inside the
      acquisition_campaign JSON (acquisition_misc_data.acquisition_campaign:profileTracking:linked_devices),
      then matched against tracking_by_device.
    lineage:
      - datalake_rene_descartes_clean.acquisition_misc_data.acquisition_campaign
      - datalake_attribution.tracking_by_device.id_device
  utm_source:
    description: UTM source of the attributed touchpoint, propagated from tracking_by_device.
    lineage:
      - datalake_attribution.tracking_by_device.utm_source
  utm_medium:
    description: UTM medium of the attributed touchpoint, propagated from tracking_by_device.
    lineage:
      - datalake_attribution.tracking_by_device.utm_medium
  utm_campaign:
    description: UTM campaign of the attributed touchpoint, propagated from tracking_by_device.
    lineage:
      - datalake_attribution.tracking_by_device.utm_campaign
  utm_content:
    description: UTM content of the attributed touchpoint, propagated from tracking_by_device.
    lineage:
      - datalake_attribution.tracking_by_device.utm_content
  utm_term:
    description: UTM term of the attributed touchpoint, propagated from tracking_by_device.
    lineage:
      - datalake_attribution.tracking_by_device.utm_term
  ts_utm_attribution_start:
    description: |
      Earliest tracking timestamp of the attributed touchpoint, propagated from tracking_by_device. Used both
      to filter touchpoints occurring at or before the lead's ts_created and to pick the most recent one per
      id_lead (ORDER BY ts_utm_attribution_start DESC).
    lineage:
      - datalake_attribution.tracking_by_device.ts_utm_attribution_start
  ts_utm_attribution_end:
    description: |
      Latest tracking timestamp of the attributed touchpoint, propagated from tracking_by_device. Indicates
      the last time the attributed UTM combination was seen for the device.
    lineage:
      - datalake_attribution.tracking_by_device.ts_utm_attribution_end
