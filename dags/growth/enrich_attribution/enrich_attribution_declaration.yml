dag:
  name: enrich_attribution
  schedule_start_date: 2025, 1, 1
  owner: Data Growth
  documentation:
    dag_purpose: |
      THIS IS A POC TABLE - DO NOT USE IN PRODUCTION. Creates enriched tables for online attribution data that combines user tracking events from CDP
      with lead attribution data from René Descartes. This table joins tracking events with lead data
      based on device_id to provide a comprehensive table of online attribution for leads and user interactions.
      Uses a materialized tracking_by_device_id table to maintain chronological history of touchpoints per device_id.
workflow:
  type: query_delta
  layer: enrich
  default_extraction_type: incremental
  default_partitions: [year, month, day]
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  tables_customization:
    tracking_by_device_id:
      merge_on: [device_id, gclid, utm_term, utm_source, utm_medium, utm_content, utm_campaign]
      when_matched_update_condition: "source.attribution_time > target.attribution_time"
      z_order_by: [device_id, attribution_time]
      extraction_type: incremental
    online_attribution:
      extraction_type: incremental
  inner_dependencies:
    online_attribution:
      - tracking_by_device_id
cluster:
  type: databricks_16_4_med_io-memory_photon_cluster
  databricks_conn_id: databricks_new
