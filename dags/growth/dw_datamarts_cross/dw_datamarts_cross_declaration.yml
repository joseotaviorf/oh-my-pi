dag:
  name: dw_datamarts_cross
  owner: Data Growth
  documentation: 
    dag_purpose: |
      Creates/updates the datamart tables that have cross squad dependencies.
workflow:
  type: query_delta
  layer: dw
  custom_schema: datamarts
  inner_dependencies:
    affiliates_clusters:
      - lead_listing_flows
cluster:
  type: databricks_12_2_med_memory_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
