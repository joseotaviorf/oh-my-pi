cluster:
  type: consolidation_m_general_cluster
  databricks_conn_id: databricks_new_env
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: USER_ISOLATION
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
    aws_attributes:
      ebs_volume_size: 200
    num_workers: 3
    driver_node_type_id: r7g.2xlarge
validation:
  cluster:
    type: emr_7_12_consolidation_m_general_cluster
    custom_configurations:
      core_nodes:
        instance_count: 1
      task_nodes:
        instance_count: 2
      master_node_type_id: r7g.2xlarge
      spark_conf:
        spark.driver.memory: 16g
        spark.driver.memoryOverhead: 4g
        spark.yarn.am.memory: 6g
      aws_attributes:
        ebs_volume_size: 200
