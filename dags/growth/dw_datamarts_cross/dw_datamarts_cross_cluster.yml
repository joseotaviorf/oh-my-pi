cluster:
  # L 2+2 OD r*.4xlarge: 2×48g executors/node, cores=2 → 16 parallel tasks.
  # Shuffle 600.
  type: emr_7_12_consolidation_l_memory_fleet_cluster
  custom_configurations:
    spark_conf:
      spark.driver.memory: 24g
      spark.driver.memoryOverhead: 6g
      spark.yarn.am.memory: 6g
      spark.executor.memory: "48g"
      spark.executor.memoryOverhead: "4g"
      spark.executor.cores: "2"
      spark.dynamicAllocation.maxExecutors: "8"
      spark.sql.shuffle.partitions: "600"
    aws_attributes:
      ebs_volume_size: 500
    core_nodes:
      target_on_demand: 3
      target_spot: 0
      instance_types:
      - r6g.4xlarge
      - r7g.4xlarge
      - r6i.4xlarge
    task_nodes:
      instance_types:
      - r6g.4xlarge
      - r7g.4xlarge
      - r6i.4xlarge
      target_on_demand: 0
      target_spot: 1
      allocation_strategy: price-capacity-optimized
      bid_price_percentage: 100
