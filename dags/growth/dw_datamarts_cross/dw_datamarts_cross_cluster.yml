cluster:
  type: emr_7_12_consolidation_m_memory_fleet_cluster
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
      spark.driver.memory: 24g
      spark.driver.memoryOverhead: 6g
      spark.yarn.am.memory: 6g
    aws_attributes:
      ebs_volume_size: 200
    core_nodes:
      target_on_demand: 2
      target_spot: 0
      instance_types:
      - r6g.2xlarge
      - r7g.2xlarge
      - r6i.2xlarge
    task_nodes:
      instance_types:
      - r6g.2xlarge
      - r7g.2xlarge
      - r6i.2xlarge
      target_on_demand: 0
      target_spot: 1
      allocation_strategy: price-capacity-optimized
      bid_price_percentage: 100
