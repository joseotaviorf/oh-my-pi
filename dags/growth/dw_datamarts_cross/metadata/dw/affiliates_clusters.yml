---
database_name: dw_datamarts
table_name: affiliates_clusters
domain: Growth
owner: gabriel.salla@quintoandar.com
description: Monthly segmentation of QuintoAndar affiliates by engagement cluster, tracking
  each affiliate's lead and prospect generation activity over time. Used by the Growth team
  to monitor affiliate lifecycle stages — from newly joined, through active, to inactive
  — and to identify high- and low-performing affiliate cohorts for retention and incentive planning.
columns:
  month_start:
    description: First calendar day of the reference month for which the affiliate cluster is calculated.
    lineage:
      - dw_public.dim_date.month_start
  year_month:
    description: Year and month formatted label (e.g. 2024/03) for reporting and display purposes.
    lineage:
      - dw_public.dim_date.year_month
  sk_user:
    description: Surrogate key identifying the affiliate user, used to join with affiliate dimension tables.
    lineage:
      - dw_public.dim_user_affiliate.sk_user
  type:
    description: Classification of the affiliate by partnership type, distinguishing different affiliate program modalities.
    categories:
      Standard: Standard affiliate program member.
      Agent: Real-estate agent affiliate.
      B2BPartner: B2B partner affiliate.
    lineage:
      - dw_public.dim_user_affiliate.type
  joined_program_date:
    description: Calendar date on which the affiliate first enrolled in the program, used to measure tenure and cohort age.
    lineage:
      - dw_public.dim_user_affiliate.ts_joined_program
  rent_lead:
    description: Count of rent-context supply leads referred by the affiliate during the reference month.
    lineage:
      - dw_datamarts.lead_listing_flows.sk_lead_date
      - dw_datamarts.lead_listing_flows.context_lead
      - dw_public.dim_user_affiliate.sk_user
  sale_lead:
    description: Count of sale-context supply leads referred by the affiliate during the reference month.
    lineage:
      - dw_datamarts.lead_listing_flows.sk_lead_date
      - dw_datamarts.lead_listing_flows.context_lead
      - dw_public.dim_user_affiliate.sk_user
  hybrid_lead:
    description: Count of hybrid-context supply leads referred by the affiliate during the reference month, halved to avoid double counting Rent and Sale flows.
    lineage:
      - dw_datamarts.lead_listing_flows.sk_lead_date
      - dw_datamarts.lead_listing_flows.context_lead
      - dw_public.dim_user_affiliate.sk_user
  total_lead:
    description: Total supply leads referred by the affiliate during the reference month across all business contexts.
    lineage:
      - dw_datamarts.lead_listing_flows.sk_lead_date
      - dw_public.dim_user_affiliate.sk_user
  rent_prospect:
    description: Count of rent-context prospects converted from the affiliate's leads in the same reference month.
    lineage:
      - dw_datamarts.lead_listing_flows.sk_prospect_date
      - dw_datamarts.lead_listing_flows.context_prospect
      - dw_public.dim_user_affiliate.sk_user
  sale_prospect:
    description: Count of sale-context prospects converted from the affiliate's leads in the same reference month.
    lineage:
      - dw_datamarts.lead_listing_flows.sk_prospect_date
      - dw_datamarts.lead_listing_flows.context_prospect
      - dw_public.dim_user_affiliate.sk_user
  hybrid_prospect:
    description: Count of hybrid-context prospects converted in the reference month, halved to avoid double counting Rent and Sale flows.
    lineage:
      - dw_datamarts.lead_listing_flows.sk_prospect_date
      - dw_datamarts.lead_listing_flows.context_prospect
      - dw_public.dim_user_affiliate.sk_user
  total_prospect:
    description: Total prospects converted from the affiliate's leads during the reference month across all business contexts.
    lineage:
      - dw_datamarts.lead_listing_flows.sk_prospect_date
      - dw_public.dim_user_affiliate.sk_user
  lead_prev_month:
    description: Total leads generated by the affiliate in the immediately preceding month, used to compare month-over-month activity.
    lineage:
      - dw_datamarts.lead_listing_flows.sk_lead_date
      - dw_public.dim_user_affiliate.sk_user
  prospect_prev_month:
    description: Total prospects generated by the affiliate in the immediately preceding month, used to compare month-over-month conversion.
    lineage:
      - dw_datamarts.lead_listing_flows.sk_prospect_date
      - dw_public.dim_user_affiliate.sk_user
  acum_lead:
    description: Running cumulative count of leads referred by the affiliate from program enrollment through the reference month.
    lineage:
      - dw_datamarts.lead_listing_flows.sk_lead_date
      - dw_public.dim_user_affiliate.sk_user
  acum_prospect:
    description: Running cumulative count of prospects referred by the affiliate from program enrollment through the reference month.
    lineage:
      - dw_datamarts.lead_listing_flows.sk_prospect_date
      - dw_public.dim_user_affiliate.sk_user
  cluster:
    description: Lifecycle engagement cluster assigned to the affiliate for the reference month based on tenure and lead/prospect activity history.
    categories:
      Novo usuário: Affiliate joined the program in the reference month.
      Nunca Ativo em Lead: Tenured affiliate who has never generated a lead.
      Nunca Ativo em Prospect: Tenured affiliate who generated leads but never converted a prospect.
      Inativo: Affiliate with historical activity who had no prospects in the previous month.
      Ativo no periodo anterior: Affiliate who generated prospects in the immediately preceding month.
    lineage:
      - dw_public.dim_user_affiliate.ts_joined_program
      - dw_datamarts.lead_listing_flows.sk_lead_date
      - dw_datamarts.lead_listing_flows.sk_prospect_date
  affiliate_volumetry:
    description: Business volumetry tier for the affiliate, combining manual cluster overrides from Google Sheets with rule-based cluster mapping.
    categories:
      Novos Afiliados: New affiliates in their enrollment month.
      Nunca Ativos: Affiliates who have never generated leads or prospects.
      Baixo volume - ativo: Low-volume affiliates active in the previous period.
      Baixo volume - inativo: Low-volume affiliates inactive in the previous period.
      Afiliados Risco Fraude: Manual override from affiliate volumetry sheet for fraud-risk affiliates.
      Afiliados Alto Volume: Manual override for high-volume affiliates.
      Top Afiliados: Manual override for top-performing affiliates.
      Not Mapped: Cluster did not match any volumetry rule (SQL fallback; rare in production).
    lineage:
      - datalake_gsheets_clean.affiliate_volumetry_cluster.affiliate_volumetry
      - dw_public.dim_user_affiliate.sk_user
  first_inactivation:
    description: First calendar month in which the affiliate transitioned to an inactive status, used to measure churn timing.
    lineage:
      - dw_public.dim_date.month_start
