cluster:
  type: emr_7_12_consolidation_xl_memory_fleet_cluster
  custom_libraries:
  - whl: '{artifacts_bucket}/hubspot-api-client-python/quintoandar_hubspot_api_client-0.3.0-py2.py3-none-any.whl'
  custom_configurations:
    # 10 raw tables fan out in Airflow; default single-node preset runs one EMR step
    # at a time (step_concurrency_level: 1). Fleet + concurrency parallelizes API pulls.
    step_concurrency_level: 3
    # load_hubspot_raw.py collects each table's full API response into one driver-side
    # Python list and calls createDataFrame on it directly (no repartition), producing a
    # single oversized task/partition (~540MB seen for a large table) instead of a wide
    # shuffle. Sizing here is about per-task/per-driver memory headroom, not parallelism —
    # xl_memory (.8xlarge) + explicit overrides beyond its own preset defaults; bumping
    # node/executor count would not help a single-partition workload.
    spark_conf:
      spark.driver.memory: '48g'
      spark.driver.memoryOverhead: '8g'
      spark.driver.maxResultSize: '0'
      spark.executor.memory: '128g'
      spark.executor.memoryOverhead: '16g'
      spark.executor.cores: '4'
    core_nodes:
      target_on_demand: 2
      target_spot: 0
      instance_types:
      - r6g.8xlarge
      - r7g.8xlarge
      - r6i.8xlarge
