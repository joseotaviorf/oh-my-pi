---
database_name: datalake_hubspot_clean
table_name: deal
owner: vitor.musachio@quintoandar.com.br
domain: Growth
description: |
  HubSpot Deal objects represent potential sales opportunities and transactions. Deals track the sales pipeline 
  with stages, amounts, close dates, and associated contacts/companies. This table is critical for sales 
  forecasting, pipeline analysis, and revenue reporting across the entire sales process.
columns:
  id_deal:
    lineage:
      - datalake_hubspot_raw.deal.id
    description: 'Unique identifier for the deal record in HubSpot. Primary key used for tracking sales opportunities and associating deals with contacts, companies, and activities.'
  properties:
    lineage:
      - datalake_hubspot_raw.deal.properties
    description: 'JSON object containing all deal properties including deal name, amount, stage, close date, pipeline, probability, and custom fields. Contains current deal status and financial information.'
  properties_with_history:
    lineage:
      - datalake_hubspot_raw.deal.properties_with_history
    description: 'JSON object containing historical values of deal properties with timestamps. Tracks progression through sales stages, amount changes, and close date adjustments for sales velocity analysis.'
  associations:
    lineage:
      - datalake_hubspot_raw.deal.associations
    description: 'JSON object containing associations to contacts, companies, line items, quotes, and activities. Essential for understanding deal context and stakeholder involvement in sales opportunities.'
  is_archived:
    lineage:
      - datalake_hubspot_raw.deal.archived
    description: 'Boolean flag indicating whether the deal record has been archived/deleted. Archived deals are preserved for historical revenue analysis but excluded from active pipeline reports.'
  ts_archived:
    lineage:
      - datalake_hubspot_raw.deal.archived_at
    description: 'Timestamp when the deal record was archived. NULL for active deals. Used for understanding deal lifecycle management and data retention policies.'
  ts_created:
    lineage:
      - datalake_hubspot_raw.deal.created_at
    description: 'Timestamp when the deal was first created in HubSpot. Critical for sales cycle analysis, lead-to-deal conversion tracking, and pipeline velocity calculations.'
  ts_updated:
    lineage:
      - datalake_hubspot_raw.deal.updated_at
    description: 'Timestamp of the most recent update to any deal property. Used for incremental data loading, identifying recently active deals, and tracking sales team engagement.'
  year:
    lineage:
      - datalake_hubspot_raw.deal.year
    description: 'Partition column: Year extracted from the data processing date. Enables annual revenue analysis and year-over-year sales performance comparison.'
  month:
    lineage:
      - datalake_hubspot_raw.deal.month
    description: 'Partition column: Month extracted from the data processing date. Supports monthly sales reporting, quota tracking, and seasonal sales pattern analysis.'
  day:
    lineage:
      - datalake_hubspot_raw.deal.day
    description: 'Partition column: Day extracted from the data processing date. Provides daily sales activity tracking and real-time pipeline monitoring capabilities.'