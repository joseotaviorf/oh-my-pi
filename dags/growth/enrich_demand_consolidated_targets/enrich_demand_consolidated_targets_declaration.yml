---
dag:
  name: enrich_demand_consolidated_targets
  schedule_start_date: 2024, 11, 25
  owner: Data Growth
  documentation: 
    dag_purpose: |
      This DAG aims to consolidate Targets for Growth@Demand. It includes ToF (Daily, Weekly and Monthly), Prospects and Marketing Cost.
workflow:
  type: query_delta
  layer: enrich
cluster:
  type: databricks_13_3_min_memory_people_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
