dag:
  name: dw_datamarts_growth_cross
  owner: Data Growth
  documentation: 
    dag_purpose: |
      Creates/updates the datamart tables that have cross squad dependencies, for the context of Growth, in data lake.
workflow:
  type: query_delta
  layer: dw
  custom_schema: datamarts
  inner_dependencies:
    marketing_demand_supply_branding_costs:
      - performance_marketing_cluster_promotional_bonus_costs
    performance_marketing_cluster_promotional_bonus_costs:
      - performance_marketing_cluster_promotional_bonus 
    performance_marketing_metrics_demand: 
      - tenant_prospect_status 
      - rent_flow_interactions
    tenant_prospect_status: 
      - rent_flow_interactions
    top_of_funnel_volumes_daily:
      - performance_marketing_metrics_demand 
      - sale_performance_marketing_metrics_demand 
      - tenant_prospect_status
    top_of_funnel_volumes_monthly: 
      - performance_marketing_metrics_demand 
      - sale_performance_marketing_metrics_demand 
      - tenant_prospect_status
cluster:
  type: custom_cluster
  custom_configurations:
    spark_version: 13.3.x-scala2.12
    autotermination_minutes: 20
    driver_node_type_id: r5d.4xlarge
    node_type_id: r5d.8xlarge
    num_workers: 3
    aws_attributes:
      first_on_demand: 1
      spot_bid_price_percent: 100
      zone_id: us-east-1d
      availability: SPOT_WITH_FALLBACK
      ebs_volume_size: 200
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
  databricks_conn_id: databricks_new
