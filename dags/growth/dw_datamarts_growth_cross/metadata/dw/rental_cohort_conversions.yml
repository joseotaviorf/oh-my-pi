    description: ''
    categories:
      B2B: ''
      Backend: ''
      CIQ: '#N/A'
      CRM/Notification: ''
      Doorman: ''
      Inbound: '#N/A'
      Indica Aí - Agents: ''
      Indica Aí - General: ''
      LeadEnrichment: ''
      Organic: ''
      Other: ''
      Paid: ''
      Price Calculator: ''
  lead_context:
    lineage:
    - dw_datamarts_cross.lead_listing_flows.mkt_origin
    description: Lead context.
    categories:
      B2B: ''
      CIQ: '#N/A'
      FSS: ''
      IS: ''
  lead_processing_operation:
    lineage:
    - dw_datamarts_cross.lead_listing_flows.sourcing_ops
    description: ''
    categories:
      B2B: '#N/A'
      CIQ: '#N/A'
      FSS: '#N/A'
      IS: '#N/A'
