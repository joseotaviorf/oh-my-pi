    lineage:
    - dw_public.dim_offer.mkt_medium
    - dw_public.dim_booking.mkt_medium
    - dw_public.dim_booking.mkt_channel
    - dw_public.dim_offer.mkt_channel
    description: ''
  first_touchpoint:
    lineage:
    - dw_datamarts_cross.funnel_demand_flows.funnel_first_touchpoint
    description: ''
    categories:
      DIRECT: ''
      TTA: ''
      UNKNOWN: ''
      VISIT: ''
  is_b2b_demand:
    lineage:
    - dw_datamarts_cross.quintoandar_consultant_listings.type_big_agent
    description: Flag to classify demand events to B2B. For supply events, the classification
      is in the Supply Channel.
    categories:
      B2B: '#N/A'
      CIQ: '#N/A'
      'FALSE': '#N/A'
  weeks_conversion:
    lineage:
    - dw_datamarts_cross.lead_listing_flows.sk_lead_date
    - dw_datamarts_cross.lead_listing_flows.sk_prospect_date
    - dw_datamarts_cross.lead_listing_flows.sk_qualified_date
    - dw_datamarts_cross.lead_listing_flows.sk_opportunity_date
    - dw_datamarts_cross.lead_listing_flows.sk_first_listing_date
    - dw_public.fact_listing_rent_flows.sk_booking_created_date
    - dw_public.fact_listing_rent_flows.sk_visit_date
    - dw_public.fact_listing_rent_flows.sk_offer_submitted_date
    - dw_public.fact_listing_rent_flows.sk_offer_approved_date
    - dw_public.fact_listing_rent_flows.sk_first_credit_evaluation_init
    - dw_public.fact_listing_rent_flows.sk_last_doc_analysis_approved
    - dw_public.fact_listing_rent_flows.sk_credit_analysis_approved_date
    - dw_public.fact_listing_rent_flows.sk_tenant_first_doc_sent_date
    - dw_public.fact_listing_rent_flows.sk_first_credit_evaluation_positive
    - dw_public.fact_listing_rent_flows.sk_guarantee_date
    - dw_public.fact_listing_rent_flows.sk_contract_created_date
    - dw_public.fact_listing_rent_flows.sk_guarantee_paid_date
    - dw_public.fact_listing_rent_flows.sk_contract_signed_date
    - dw_public.fact_listing_rent_flows.sk_contract_annulment_date
    description: Conversion time aggregated by weeks.
  rental_administrator:
    lineage:
    - dw_public.dim_house_listing.rental_administrator
  ca2cc:
    description: Conversion volume of credit analysis approved / document analysis
      approved to contract created, considering when it is not guarantee flow. The
      document analysis is a step implemented in June 2020.
  ca2cs:
    description: Conversion volume of credit analysis approved / document analysis
      approved to contract signed.
  ca2gp:
    description: Conversion volume of credit analysis approved / document analysis
      approved to guarantee paid, considering only when it is guarantee flow.
  ca_gp2cs:
    description: Conversion volume of credit analysis approved / guarantee paid  to
      contract signed.
  cc2cs:
    description: Conversion volume of contract created  to contract signed.
  cei2cep:
    description: Conversion volume of credit evaluation init to credit evaluation
      positive, considering when it is not guarantee flow.
  cei2gs:
    description: Conversion volume of credit evaluation init to guarantee started,
      considering only when it is guarantee flow.
  cep2ds:
    description: Conversion volume of credit evaluation positive to document sent,
      considering when it is not guarantee flow.
  cs2ce:
    description: Conversion volume of contract signed to contract annulment.
  ds2ca:
    description: Conversion volume of document sent to credit analysis approved /
      document analysis approved.
  gp2cc:
    description: Conversion volume of guarantee paid to contract created, considering
      only when it is guarantee flow.
  gs2ds:
    description: Conversion volume of guarantee started to document sent, considering
      only when it is guarantee flow.
  is_guarantee:
    description: Classification based on guarantee flow.
  l2p:
    description: Conversion volume of lead to prospect.
  oa2ca:
    description: ''
  oa2cei:
    description: Conversion volume of offer accepted to credit evaluation init.
  oa2ds:
    description: ''
  opp2fl:
    description: Conversion volume of opportunity to first listing.
  os2oa:
    description: Conversion volume of offer submitted to offer accepted.
  p2q:
    description: Conversion volume of prospect to qualified.
  q2opp:
    description: Conversion volume of qualified to opportunity.
  ts_load:
    description: Time of last table loading.
  vb2vc:
    description: Conversion volume of visit booked to visit completed.
  vc:
    description: ''
  vc2os:
    description: Conversion volume of visit completed to offer submitted.
