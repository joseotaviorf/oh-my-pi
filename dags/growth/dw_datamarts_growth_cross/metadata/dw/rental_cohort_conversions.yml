owner: sonia.gondo@quintoandar.com.br
columns:
  date:
    lineage:
    - dw_public.dim_date.date
    description: Date of cohort events.
  city_group:
    lineage:
    - dw_public.dim_region.city_group
    description: City group for group by sums of conversions.
    categories:
      Belo Horizonte: ''
      Brasília: ''
      Campinas: ''
      Cotia: '#N/A'
      Curitiba: ''
      Florianópolis: ''
      Goiânia: ''
