      Porto Alegre: ''
      RMSP: ''
      Recife: '#N/A'
      Ribeirão Preto: '#N/A'
      Rio de Janeiro: ''
      Salvador: '#N/A'
      Santos: ''
      Sorocaba: '#N/A'
      São José dos Campos: '#N/A'
      Vitória: '#N/A'
  country_code:
    lineage:
    - dw_datamarts_cross.lead_listing_flows.country_code
    - dw_public.dim_region.country_code
    - dw_public.dim_house_listing.country_code
  supply_mkt_origin:
    lineage:
    - dw_datamarts_cross.lead_listing_flows.mkt_origin
    description: ''
    categories:
      B2B: ''
      Backend: ''
      CIQ: '#N/A'
      Doorman: ''
      Inbound: '#N/A'
      Indica Aí - Agents: ''
      Indica Aí - General: ''
      Other: ''
      Owner PWA: ''
      Price Calculator: ''
