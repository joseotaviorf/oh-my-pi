database_name: dw_datamarts_growth_cross
table_name: tenant_prospect_status
owner: '@data-growth'
domain: Growth
description: Table that contains status log for each tenant prospect
columns:
  sk_client:
    description: Client/user id
    lineage:
      - dw_datamarts_growth_cross.rent_flow_interactions.sk_client
      - dw_public.fact_listing_rent_flows.sk_client
      - dw_quintoandar.fact_contract_people.sk_user
  city_group:
    description: city_group of the prospect intent
    lineage:
      - dw_public.dim_region.city_group
    categories:
      Belo Horizonte: '#N/A'
      Brasília: '#N/A'
      Campinas: '#N/A'
      Cotia: '#N/A'
      Curitiba: '#N/A'
      Florianópolis: '#N/A'
      Goiânia: '#N/A'
      Mogi das Cruzes: '#N/A'
      Porto Alegre: '#N/A'
      RMSP: '#N/A'
      Recife: '#N/A'
      Rio de Janeiro: '#N/A'
      Salvador: '#N/A'
      Santos: '#N/A'
      São José dos Campos: '#N/A'
      Vitória: '#N/A'
  ts_start:
    description: Timestamp that started prospect status
    lineage:
      - dw_datamarts_growth_cross.rent_flow_interactions.ts_event
      - dw_public.dim_contract.ts_signature
  ts_end:
    description: Timestamp that ended prospect status
    lineage:
    - dw_datamarts_growth_cross.rent_flow_interactions.ts_event
    - dw_public.dim_contract.ts_signature
    description: ''
  sk_start_date:
    description: Date that started prospect status in VARCHAR/STRING
    lineage:
    - dw_datamarts_growth_cross.rent_flow_interactions.ts_event
    - dw_public.dim_contract.ts_signature
  sk_end_date:
    description: Date that ENDED prospect status in VARCHAR/STRING
    lineage:
    - dw_datamarts_growth_cross.rent_flow_interactions.ts_event
    - dw_public.dim_contract.ts_signature
  ts_first_activation:
    description: Timestamp of the prospect's first activation
    lineage:
    - dw_datamarts_growth_cross.rent_flow_interactions.ts_event
    - dw_public.dim_contract.ts_signature
    - dw_public.dim_contract.dt_annulment
  city_group_first_activation:
    description: City group of the prospect's first activation
    lineage:
    - dw_public.dim_region.city_group
  status:
    description: Prospect status
    categories:
      ACTIVE: ''
      CHURNED: ''
      RENTED: ''
  status_detail:
    description: Detail of the prospects status
    categories:
      Contract ended: ''
      First activation: ''
      Inactive by renting (dweller): ''
      Inactive by renting (tenant): ''
      Inactivity: ''
      Recovered after churn: ''
      Recovered after renting: ''
