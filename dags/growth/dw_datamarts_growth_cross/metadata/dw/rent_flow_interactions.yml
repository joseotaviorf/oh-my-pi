---
database_name: dw_datamarts_growth_cross
table_name: rent_flow_interactions
owner: '@data-growth'
domain: Growth
description: Table that aggregate users which events define prospect users
columns:
  ts_event:
    description: Timestamp of the flow event or status available
    lineage:
      - dw_datamarts_cross.talk_to_agent.first_message_ts
      - dw_public.dim_booking.dt_created
      - dw_public.dim_offer.dt_first_sent
  dt_event:
    description: Date of the flow event or status available
    lineage:
      - dw_datamarts_cross.talk_to_agent.first_message_ts
      - dw_public.dim_booking.dt_created
      - dw_public.dim_offer.dt_first_sent
  sk_client:
    description: Client/user id
    lineage:
      - dw_datamarts_cross.talk_to_agent.tenant_id
      - dw_public.fact_listing_rent_flows.sk_client
  sk_house_listing:
    description: Id of the house listings associated with the flow
    lineage:
      - dw_datamarts_cross.talk_to_agent.sk_house_listing
      - dw_public.fact_listing_rent_flows.sk_house_listing
  id_house:
    description: Id of the house associated with the flow
    lineage:
      - dw_datamarts_cross.talk_to_agent.house_id
      - dw_public.dim_booking.id_property
      - dw_public.dim_offer.id_property
  sk_rf:
    description: Rent flow id
    lineage:
      - dw_datamarts_cross.talk_to_agent.house_id
      - dw_datamarts_cross.talk_to_agent.tenant_id
      - dw_public.dim_booking.id_property
      - dw_public.dim_offer.id_property
      - dw_public.fact_listing_rent_flows.sk_client  
  sk_region:
    description: Key of the region
    lineage:
      - dw_public.fact_house_listings.sk_region
      - dw_public.fact_listing_rent_flows.sk_region
  mkt_origin:
    description: Level of the Growth Marketing Taxonomy
    lineage:
      - dw_datamarts_cross.talk_to_agent.mkt_origin
      - dw_public.dim_booking.mkt_origin
      - dw_public.dim_offer.mkt_origin
  mkt_channel:
    description: Level of the Growth Marketing Taxonomy
    lineage:
      - dw_datamarts_cross.talk_to_agent.mkt_channel
      - dw_public.dim_booking.mkt_channel
      - dw_public.dim_offer.mkt_channel
  mkt_medium:
    description: Level of the Growth Marketing Taxonomy
    lineage:
      - dw_datamarts_cross.talk_to_agent.mkt_medium
      - dw_public.dim_booking.mkt_medium
      - dw_public.dim_offer.mkt_medium
  mkt_source:
    description: Level of the Growth Marketing Taxonomy
    lineage:
      - dw_datamarts_cross.talk_to_agent.mkt_source
      - dw_public.dim_booking.mkt_source
      - dw_public.dim_offer.mkt_source
  utm_medium:
    description: Returns utm_medium parameter defined at campaing configuration at marketing platforms
    lineage:
      - dw_datamarts_cross.talk_to_agent.utm_medium
      - dw_public.dim_booking.utm_medium
      - dw_public.dim_offer.utm_medium
  utm_source:
    description: Returns utm_source parameter defined at campaing configuration at marketing platforms
    lineage:
      - dw_datamarts_cross.talk_to_agent.utm_source
      - dw_public.dim_booking.utm_source
      - dw_public.dim_offer.utm_source
  utm_campaign:
    description: Returns utm_campaign parameter defined at campaing configuration at marketing platforms
    lineage:
      - dw_datamarts_cross.talk_to_agent.utm_campaign
      - dw_public.dim_booking.utm_campaign
      - dw_public.dim_offer.utm_campaign
  utm_term:
    description: Returns the utm_term parameter defined at campaing configuration at marketing platforms
    lineage:
      - dw_datamarts_cross.talk_to_agent.utm_term
      - dw_public.dim_booking.utm_term
      - dw_public.dim_offer.utm_term
  utm_content:
    description: Returns the utm_content parameter defined at campaing configuration at marketing platforms
    lineage:
      - dw_datamarts_cross.talk_to_agent.utm_content
      - dw_public.dim_booking.utm_content
      - dw_public.dim_offer.utm_content
  rent_flow_order:
    description: Rent flow ordered by ascending date by unique sk_client and id_house
  tenant_prospect_order:
    description: Tenant prospect ordered by ascending date by unique sk_client
  flow_event:
    description: Type of flow
    categories:
      Booking: ''
      Offer: ''
      Talk to Agent: ''