# Merge Keys are available only in Yaml 1.1.
redshift_template:
  dw: &redshift_anchor
    runs_on: redshift
pipeline:
  ##<KEEP THIS COMMENTED AS A TEMPLATE>
  # <task-name-like-attribution-conversion-paths>:
  #   dw:
  #     table: <targe-table-name>
  #     runs_on: <backend-to-run-the-query> E.g: redshift or athena
  affiliate_acquisition_metrics:
    dw:
      <<: *redshift_anchor
      table: affiliate_acquisition_metrics
      depends_on:
        - affiliates_clusters
  affiliates_clusters:
    dw:
      <<: *redshift_anchor
      table: affiliates_clusters
  daily_target_volumes_supply:
    dw:
      <<: *redshift_anchor
      table: daily_target_volumes_supply
  efficiency_monitor_rental:
    dw:
      <<: *redshift_anchor
      table: efficiency_monitor_rental
      depends_on:
        - marketing_demand_supply_branding_costs
  efficiency_monitor_sale:
    dw:
      <<: *redshift_anchor
      table: efficiency_monitor_sale
      depends_on:
        - marketing_demand_supply_branding_costs
  inbound_attendance_leads_flows:
    dw:
      <<: *redshift_anchor
      table: inbound_attendance_leads_flows
  marketing_demand_supply_branding_costs:
    dw:
      <<: *redshift_anchor
      table: marketing_demand_supply_branding_costs
      depends_on:
        - performance_marketing_cluster_promotional_bonus_costs
  performance_marketing_cluster_promotional_bonus:
    dw:
      <<: *redshift_anchor
      table: performance_marketing_cluster_promotional_bonus
      depends_on:
        - affiliates_clusters
  performance_marketing_cluster_promotional_bonus_costs:
    dw:
      <<: *redshift_anchor
      table: performance_marketing_cluster_promotional_bonus_costs
      depends_on:
        - affiliates_clusters
        - performance_marketing_cluster_promotional_bonus
  performance_marketing_metrics_demand:
    dw:
      <<: *redshift_anchor
      table: performance_marketing_metrics_demand
      depends_on:
        - tenant_prospect_status
        - rent_flow_interactions
  pricing_rent_categorization:
    dw:
      <<: *redshift_anchor
      table: pricing_rent_categorization
      depends_on:
        - performance_marketing_metrics_demand
  rent_flow_interactions:
    dw:
      <<: *redshift_anchor
      table: rent_flow_interactions
  rental_marketplace_flows:
    dw:
      <<: *redshift_anchor
      table: rental_marketplace_flows
      depends_on:
        - rent_flow_interactions
        - tenant_prospect_status
  rental_performance_marketing_metrics_supply_coincident:
    dw:
      <<: *redshift_anchor
      table: rental_performance_marketing_metrics_supply_coincident
      depends_on:
        - performance_marketing_cluster_promotional_bonus_costs
        - daily_target_volumes_supply
  sale_performance_marketing_metrics_demand:
    dw:
      <<: *redshift_anchor
      table: sale_performance_marketing_metrics_demand
  tenant_prospects_activations:
    dw:
      <<: *redshift_anchor
      table: tenant_prospects_activations
      depends_on:
        - rent_flow_interactions
  tenant_prospect_status:
    dw:
      <<: *redshift_anchor
      table: tenant_prospect_status
      depends_on:
        - rent_flow_interactions
  top_of_funnel_volumes_daily:
    dw:
      <<: *redshift_anchor
      table: top_of_funnel_volumes_daily
      depends_on:
        - performance_marketing_metrics_demand
        - sale_performance_marketing_metrics_demand
        - tenant_prospect_status
  unique_supply_events_funnel:
    dw:
      <<: *redshift_anchor
      table: unique_supply_events_funnel
  unique_supply_cohort_conversions:
    dw:
      <<: *redshift_anchor
      table: unique_supply_cohort_conversions
  user_funnel:
    dw:
      <<: *redshift_anchor
      table: user_funnel
  rental_cohort_conversions:
    dw:
      <<: *redshift_anchor
      table: rental_cohort_conversions
  sale_performance_marketing_metrics_supply_coincident:
    dw:
      <<: *redshift_anchor
      table: sale_performance_marketing_metrics_supply_coincident
      depends_on:
        - performance_marketing_cluster_promotional_bonus_costs
  top_of_funnel_volumes_weekly:
    dw:
      <<: *redshift_anchor
      table: top_of_funnel_volumes_weekly
      depends_on:
        - tenant_prospect_status
        - sale_performance_marketing_metrics_demand
        - performance_marketing_metrics_demand
  top_of_funnel_volumes_monthly:
    dw:
      <<: *redshift_anchor
      table: top_of_funnel_volumes_monthly
      depends_on:
        - tenant_prospect_status
        - sale_performance_marketing_metrics_demand
        - performance_marketing_metrics_demand
  plaquinhas_users_demand:
    dw:
      <<: *redshift_anchor
      table: plaquinhas_users_demand
      depends_on:
        - performance_marketing_metrics_demand
  marketing_campaigns_costs_and_volumes:
    dw:
      <<: *redshift_anchor
      table: marketing_campaigns_costs_and_volumes
