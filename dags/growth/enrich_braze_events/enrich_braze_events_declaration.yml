---
dag:
  name: enrich_braze_events
  schedule_start_date: 2020, 11, 1
  owner: Data Growth
  documentation:
    dag_purpose: This DAG creates the enriched tables of the first layer of enrichment from Braze Events DAG, by cleaning data and applying an event type filter.
workflow:
  type: query
  layer: enrich
  custom_schema: braze
  default_extraction_type: incremental
  default_partitions:
  - event_type
  - event_channel
  - year
  - month
  - day
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: m5d.xlarge
    node_type_id: m5d.xlarge
    runtime_engine: PHOTON
    autoscale:
      min_workers: 1
      max_workers: 3
    spark_conf:
      spark.executor.cores: 4
      spark.driver.memory: 9g
      spark.driver.memoryOverhead: 1g
      spark.executor.memory: 9g
      spark.executor.memoryOverhead: 1g
