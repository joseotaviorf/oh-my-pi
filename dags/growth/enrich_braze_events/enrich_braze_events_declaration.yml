---
dag:
  name: enrich_braze_events
  schedule_start_date: 2020, 11, 1
  owner: Data Growth
  documentation:
    dag_purpose: This DAG creates the enriched tables of the first layer of enrichment from Braze Events DAG, by cleaning data and applying an event type filter.
workflow:
  type: query_delta
  layer: enrich
  custom_schema: braze
  default_extraction_type: incremental
  default_partitions:
  - event_type
  - event_channel
  - year
  - month
  - day
cluster:
  type: custom_cluster
  custom_configurations:
    spark_version: 12.2.x-scala2.12
    driver_node_type_id: m5d.xlarge
    node_type_id: m5d.xlarge
    runtime_engine: PHOTON
    num_workers: 3
