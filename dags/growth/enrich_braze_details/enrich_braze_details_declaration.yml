---
dag:
  name: enrich_braze_details
  schedule_start_date: 2022, 10, 18
  owner: Data Growth
  documentation:
    dag_purpose: This DAG creates the incremental enriched table from Braze Details clean tables.
workflow:
  type: query_delta
  layer: enrich
  default_extraction_type: incremental
  default_partitions:
  - year
  - month
  - day
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, macros.ds_add(ds, -6), 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, ds, 'load_end_date') }}"
cluster:
  type: databricks_12_2_min_general_photon_cluster
