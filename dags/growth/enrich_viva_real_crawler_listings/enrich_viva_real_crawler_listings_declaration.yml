---
dag:
  name: enrich_viva_real_crawler_listings
  schedule_start_date: 2021, 7, 20
  owner: Data Growth
  schedule_interval: 0 6 * * 3
  documentation: 
    dag_purpose: |
      Creates enriched table for the context `Crawlers Listings` from Viva Real.
      The `datalake_crawlers_listings` schema has tables that extract data from OLX, VivaReal and Zap Imoveis  websites.
      The ingestion is incremental, partitioned on city, year, month and day columns.
      This DAG runs once a week (Wednesday) and it's triggered by Airflow.
workflow:
  type: query_delta
  layer: enrich
  custom_schema: crawlers_listings
  default_extraction_type: incremental
  default_partitions:
    - address_city
    - year
    - month
    - day
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: r5a.xlarge
    node_type_id: c5d.4xlarge
    num_workers: 2
    spark_version: 12.2.x-scala2.12
