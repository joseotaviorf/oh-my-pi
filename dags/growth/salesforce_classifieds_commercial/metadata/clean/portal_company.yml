database_name: datalake_salesforce_classifieds_clean
table_name: portal_company
owner: fabian.flores@quintoandar.com
domain: Growth
description: |
  Clean layer for Salesforce Empresa_portal__c objects from the Navent Classifieds Salesforce org. Grain is one row
  per portal company (id) per incremental load window, keyed by Salesforce Id. Tracks ad balances, portal metrics,
  debt balances, and integration statuses. Source: datalake_salesforce_classifieds_raw.empresa_portal__c. Physically partitioned
  by year, month, and day from dt_updated (derived from LastModifiedDate). Always filter year, month, and day together —
  or use dt_updated with load_start_date/load_end_date — for partition pruning on incremental reads.
columns:
  id:
    description: Primary Key. Salesforce native record Id for the Empresa_portal__c object.
    lineage:
      - datalake_salesforce_classifieds_raw.empresa_portal__c.Id
