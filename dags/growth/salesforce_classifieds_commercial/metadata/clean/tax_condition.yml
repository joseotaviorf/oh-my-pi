database_name: datalake_salesforce_classifieds_clean
table_name: tax_condition
owner: fabian.flores@quintoandar.com
domain: Growth
description: |
  Clean layer for Salesforce Condicion_fiscal__c objects from the Navent Classifieds Salesforce org. Grain is one row
  per fiscal condition record (id) per incremental load window, keyed by Salesforce Id. Includes document types,
  tax class references, and country links. Source: datalake_salesforce_classifieds_raw.condicion_fiscal__c. Physically partitioned
  by year, month, and day from dt_updated (derived from LastModifiedDate). Always filter year, month, and day together —
  or use dt_updated with load_start_date/load_end_date — for partition pruning on incremental reads.
columns:
  id:
    description: Primary Key. Salesforce native record Id for the Condicion_fiscal__c object.
    lineage:
      - datalake_salesforce_classifieds_raw.condicion_fiscal__c.Id
  id_owner:
    description: Foreign Key to the Salesforce User who owns the record (OwnerId).
    lineage:
      - datalake_salesforce_classifieds_raw.condicion_fiscal__c.OwnerId
  id_created_by:
    description: Foreign Key to the Salesforce User who created the record (CreatedById).
    lineage:
      - datalake_salesforce_classifieds_raw.condicion_fiscal__c.CreatedById
  id_last_modified_by:
    description: Foreign Key to the Salesforce User who last modified the record (LastModifiedById).
    lineage:
      - datalake_salesforce_classifieds_raw.condicion_fiscal__c.LastModifiedById
  id_class:
    description: External or class identifier for fiscal mapping (Id_Clase__c).
    lineage:
      - datalake_salesforce_classifieds_raw.condicion_fiscal__c.Id_Clase__c
  id_country:
    description: Foreign Key to the associated Country custom object (Pais__c).
    lineage:
      - datalake_salesforce_classifieds_raw.condicion_fiscal__c.Pais__c
  tax_condition_name:
    description: Name or label of the fiscal condition (Name).
    lineage:
      - datalake_salesforce_classifieds_raw.condicion_fiscal__c.Name
  document_type:
    description: Associated document type for fiscal identification (Tipo_de_documento__c).
    lineage:
      - datalake_salesforce_classifieds_raw.condicion_fiscal__c.Tipo_de_documento__c
  currency_iso_code:
    description: ISO code for record currency (CurrencyIsoCode).
    lineage:
      - datalake_salesforce_classifieds_raw.condicion_fiscal__c.CurrencyIsoCode
  is_deleted:
    description: Flag indicating if the record was soft-deleted in Salesforce (IsDeleted).
    lineage:
      - datalake_salesforce_classifieds_raw.condicion_fiscal__c.IsDeleted
  ts_created:
    description: Creation timestamp in Salesforce (CreatedDate).
    lineage:
      - datalake_salesforce_classifieds_raw.condicion_fiscal__c.CreatedDate
  ts_last_modified:
    description: Last modified timestamp in Salesforce (LastModifiedDate).
    lineage:
      - datalake_salesforce_classifieds_raw.condicion_fiscal__c.LastModifiedDate
  ts_system_mod:
    description: System modification timestamp tracking internal updates (SystemModstamp).
    lineage:
      - datalake_salesforce_classifieds_raw.condicion_fiscal__c.SystemModstamp
  ts_last_viewed:
    description: Timestamp when the user last viewed the record (LastViewedDate).
    lineage:
      - datalake_salesforce_classifieds_raw.condicion_fiscal__c.LastViewedDate
  ts_last_referenced:
    description: Timestamp when the user last referenced the record (LastReferencedDate).
    lineage:
      - datalake_salesforce_classifieds_raw.condicion_fiscal__c.LastReferencedDate
  dt_updated:
    description: Date of the last Salesforce modification (LastModifiedDate cast to date).
    lineage:
      - datalake_salesforce_classifieds_raw.condicion_fiscal__c.dt_updated
  year:
    description: Hive partition year (1–9999). Filter with month and day together to enable partition pruning on incremental reads.
    lineage:
      - datalake_salesforce_classifieds_raw.condicion_fiscal__c.year
  month:
    description: Hive partition month (1–12). Filter with year and day together to enable partition pruning on incremental reads.
    lineage:
      - datalake_salesforce_classifieds_raw.condicion_fiscal__c.month
  day:
    description: Hive partition day (1–31). Filter with year and month together to enable partition pruning on incremental reads.
    lineage:
      - datalake_salesforce_classifieds_raw.condicion_fiscal__c.day
