database_name: datalake_salesforce_classifieds_clean
table_name: user
owner: fabian.flores@quintoandar.com
domain: Growth
description: |
  Clean layer for Salesforce User objects from the Navent Classifieds Salesforce org. Grain is one row
  per user (id) per incremental load window, keyed by Salesforce Id. Contains employee profiles, roles,
  and ExactTarget/Marketing Cloud metadata. Source: datalake_salesforce_classifieds_raw.user. Physically partitioned by year,
  month, and day from dt_updated (derived from LastModifiedDate). Always filter year, month, and day together — or use dt_updated
  with load_start_date/load_end_date — for partition pruning on incremental reads.
columns:
