---
database_name: datalake_salesforce_classifieds_clean
table_name: account
owner: fabian.flores@quintoandar.com
domain: Growth
description: |
  Clean layer for Salesforce Account objects from the Navent Classifieds Salesforce org. Grain is one row
  per account (id) per incremental load window, keyed by Salesforce Id. Includes standard Account fields,
  Person Account attributes, tax/billing custom fields, and Whatslly integration timestamps. Source:
  datalake_salesforce_classifieds_raw.account. Physically partitioned by year, month, and day from dt_updated
  (derived from LastModifiedDate). Always filter year, month, and day together — or use dt_updated with
  load_start_date/load_end_date — for partition pruning on incremental reads.
columns:
  id:
    description: Primary Key. Salesforce native record Id for the Account object.
    lineage:
      - datalake_salesforce_classifieds_raw.account.Id
  id_parent:
    description: Foreign Key to the parent Account record (ParentId).
    lineage:
      - datalake_salesforce_classifieds_raw.account.ParentId
