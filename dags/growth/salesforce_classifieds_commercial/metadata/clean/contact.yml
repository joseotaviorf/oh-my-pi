database_name: datalake_salesforce_classifieds_clean
table_name: contact
owner: fabian.flores@quintoandar.com
domain: Growth
description: |
  Clean layer for Salesforce Contact objects from the Navent Classifieds Salesforce org. Grain is one row
  per contact (id) per incremental load window, keyed by Salesforce Id. Includes contact personal details,
  job positions, mailing addresses, SAP references, and Whatslly metadata. Source: datalake_salesforce_classifieds_raw.contact.
  Physically partitioned by year, month, and day from dt_updated (derived from LastModifiedDate). Always filter year,
  month, and day together — or use dt_updated with load_start_date/load_end_date — for partition pruning on incremental reads.
columns:
  id:
    description: Primary Key. Salesforce native record Id for the Contact object.
    lineage:
      - datalake_salesforce_classifieds_raw.contact.Id
  id_account:
    description: Foreign Key to the associated Account record (AccountId).
    lineage:
      - datalake_salesforce_classifieds_raw.contact.AccountId
  id_owner:
    description: Foreign Key to the Salesforce User who owns the Contact (OwnerId).
    lineage:
      - datalake_salesforce_classifieds_raw.contact.OwnerId
  id_created_by:
    description: Foreign Key to the Salesforce User who created the Contact (CreatedById).
    lineage:
      - datalake_salesforce_classifieds_raw.contact.CreatedById
  id_last_modified_by:
    description: Foreign Key to the Salesforce User who last modified the Contact (LastModifiedById).
    lineage:
      - datalake_salesforce_classifieds_raw.contact.LastModifiedById
  id_reports_to:
    description: Foreign Key to the manager Contact record (ReportsToId).
    lineage:
      - datalake_salesforce_classifieds_raw.contact.ReportsToId
  id_master_record:
