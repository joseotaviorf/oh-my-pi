database_name: datalake_salesforce_classifieds_clean
table_name: contract
owner: fabian.flores@quintoandar.com
domain: Growth
description: |
  Clean layer for Salesforce Contract objects from the Navent Classifieds Salesforce org. Grain is one row
  per contract (id) per incremental load window, keyed by Salesforce Id. Includes terms, pricing, approval statuses,
  billing addresses, and SAP integration details. Source: datalake_salesforce_classifieds_raw.contract. Physically partitioned
  by year, month, and day from dt_updated (derived from LastModifiedDate). Always filter year, month, and day together —
  or use dt_updated with load_start_date/load_end_date — for partition pruning on incremental reads.
