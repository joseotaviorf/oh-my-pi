dag:
  name: salesforce_classifieds_commercial
  owner: Data Growth
  schedule_start_date: 2025, 05, 15
  schedule_interval: 0 0 * * *
  documentation:
    dag_purpose: |
      Ingests Salesforce Account data for the Classifieds (Navent) business context via the Salesforce
      REST API. Raw snapshots land in datalake_salesforce_classifieds_raw; clean models in datalake_salesforce_classifieds_clean
      support Growth analytics on advertiser accounts, tax/billing attributes, and Person Account contacts.
workflow:
  type: custom_ingestion
  layer: raw
  custom_schema: salesforce_classifieds
  load_spark_job: load_salesforce_classifieds_raw
  spark_job_arguments:
    - "{environment}"
    - "{bucket}"
    - "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    - "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
    - "{table_name}"
    - "{partitions}"
    - "{schema}"
    - "https://navent--uat.sandbox.my.salesforce.com"
    - "https://navent.my.salesforce.com"

  default_extraction_type: incremental
  default_partitions: [year, month, day]
  tables_customization:
    Account:
      extra_spark_job_arguments:
