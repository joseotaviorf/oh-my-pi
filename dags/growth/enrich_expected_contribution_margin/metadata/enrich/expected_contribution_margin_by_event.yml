database_name: datalake_expected_contribution_margin
table_name: expected_contribution_margin_by_event
domain: Growth
description: This table contains the estimated monthly revenue that each ForRent contract will bring to QuintoAndar.
columns:
  id_rent_flow:
    lineage:
    - datalake_rent_demand_events.rent_demand_events.id_rent_flow
    description: Surrogate key of the ForRent demand flow event used in expected contribution margin modeling.
  id_house:
    lineage:
    - datalake_rent_demand_events.rent_demand_events.id_house
    - dw_rental_contribution_margin.fact_house_listing_revenues.id_house
    description: QuintoAndar property identifier associated with the contract in the margin projection.
  id_tenant_prospect:
    lineage:
    - datalake_rent_demand_events.rent_demand_events.id_tenant_prospect
    description: Tenant prospect identifier (equivalent to id_user in demand tables) for the rent funnel event.
  id_booking:
    lineage:
    - datalake_batch_inference_clean.batch_inference.input_data
    description: Booking event identifier from batch inference input used to score conversion probability.
  id_offer:
    lineage:
    - datalake_batch_inference_clean.batch_inference.input_data
    description: Offer event identifier from batch inference input used in margin projection features.
  months_since_contract_start:
    lineage:
    - dw_rental_contribution_margin.fact_house_listing_revenues.contract_lifetime
    description: Contract age in months since signature, used as a survival curve dimension.
  estimated_gross_revenue:
    lineage:
    - dw_rental_contribution_margin.fact_house_listing_revenues.gross_revenue
    description: Projected gross revenue for the contract month before taxes and revenue sharing.
  estimated_net_revenue:
    lineage:
    - dw_rental_contribution_margin.fact_house_listing_revenues.net_revenue_pre_taxes
    description: Projected net revenue after sales tax and brokerage revenue sharing deductions.
  estimated_net_revenue_after_losses:
    lineage:
    - dw_rental_contribution_margin.fact_house_listing_revenues.net_revenue_pre_taxes
    - datalake_losses.provision.provision_balance_p4_delay_e
    - datalake_losses.provision.id_contract
    - datalake_losses.provision.dt_closing
    description: Projected net revenue after applying expected credit and delay loss provisions.
  estimated_contribution_margin:
    lineage:
    - dw_rental_contribution_margin.fact_house_listing_revenues.net_revenue_pre_taxes
    - datalake_losses.fact_provision.provision_balance_p4_delay_e
    - datalake_losses.fact_provision.id_contract
    - datalake_losses.fact_provision.dt_closing
    description: Projected contribution margin for the contract month after revenue and loss adjustments.
  dt_inference:
    lineage:
    - datalake_batch_inference_clean.batch_inference.ts_inference
    description: Date when the machine learning inference was run; partition key for incremental scoring loads.
  dt_event_time:
    lineage:
    - datalake_batch_inference_clean.batch_inference.input_data
    description: Timestamp of the demand funnel event that triggered the margin projection.
owner: vinicius.araujo@quintoandar.com
