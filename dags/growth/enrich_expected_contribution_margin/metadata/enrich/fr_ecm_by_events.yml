database_name: datalake_expected_contribution_margin
table_name: fr_ecm_by_events
domain: Growth
description: This table contains the estimated revenue that each ForRent contract will bring to QuintoAndar.
columns:
  id_flow:
    lineage:
    - datalake_batch_inference_clean.batch_inference.input_data
    description: Unique key of the rent flow
  id_house:
    lineage:
    - datalake_batch_inference_clean.batch_inference.input_data
    description: QuintoAndar property identifier associated with the contract in the margin projection.
  id_prospect:
    lineage:
    - datalake_batch_inference_clean.batch_inference.input_data
    description: Unique key of the tenant prospect (also known as id_user or id_tenant_prospect in other tables)
  id_event:
    lineage:
    - datalake_batch_inference_clean.batch_inference.input_data
    description: Unique key of the event (equal to the id_booking or id_offer depending on the event_type)
  event_type:
    lineage:
    - datalake_batch_inference_clean.batch_inference.input_data
    description: Can be VB for a Visit Booked event or OS for an Offer Sent event.
  ts_event:
    lineage:
    - datalake_batch_inference_clean.batch_inference.input_data
    description: Timestamp of when the event was generated
  estimated_conversion:
    lineage:
    - datalake_batch_inference_clean.batch_inference.input_data
    - datalake_batch_inference_clean.batch_inference.output_data
    description: The estimated probability of conversion of the event.
  estimated_contract_duration:
    lineage:
    - datalake_batch_inference_clean.batch_inference.input_data
    - datalake_batch_inference_clean.batch_inference.output_data
    description: The estimated contract duration in months.
  estimated_gross_revenue:
    lineage:
    - datalake_batch_inference_clean.batch_inference.input_data
    - datalake_batch_inference_clean.batch_inference.output_data
    description: Projected gross revenue for the contract month before taxes and revenue sharing.
  estimated_net_revenue:
    lineage:
    - datalake_batch_inference_clean.batch_inference.input_data
    - datalake_batch_inference_clean.batch_inference.output_data
    description: Projected net revenue after sales tax and brokerage revenue sharing deductions.
  estimated_net_revenue_after_losses:
    lineage:
    - datalake_batch_inference_clean.batch_inference.input_data
    - datalake_batch_inference_clean.batch_inference.output_data
    description: Projected net revenue after applying expected credit and delay loss provisions.
  estimated_contribution_margin:
    lineage:
    - datalake_batch_inference_clean.batch_inference.input_data
    - datalake_batch_inference_clean.batch_inference.output_data
    description: Projected contribution margin for the contract month after revenue and loss adjustments.
  dt_event_time:
    lineage:
    - datalake_batch_inference_clean.batch_inference.input_data
    description: Timestamp of the demand funnel event that triggered the margin projection.
  dt_inference:
    lineage:
    - datalake_batch_inference_clean.batch_inference.input_data
    description: Date when the machine learning inference was run; partition key for incremental scoring loads.
owner: vinicius.araujo@quintoandar.com
