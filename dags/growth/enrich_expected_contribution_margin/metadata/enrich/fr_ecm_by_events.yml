database_name: datalake_expected_contribution_margin
table_name: fr_ecm_by_events
domain: Growth
description: |
  For Rent expected contribution margin projections at the Visit Booked (VB) and
  Offer Sent (OS) event grain. One row per eltv EMLIO inference request, keyed by
  id_request. id_flow is resolved from the request id_entity: booking.id_rent_flow
  for VB (visit code) and offer.id_rent_flow for OS (Firestore offer id). id_event
  keeps the legacy booking id or id_offer_context for schema compatibility.
owner: vinicius.araujo@quintoandar.com.br
columns:
  id_flow:
    lineage:
      - datalake_booking.booking.id_rent_flow
      - datalake_offer.offer.id_rent_flow
    description: |
      Rent flow identifier resolved from id_entity: booking.id_rent_flow when the
      scored event is VB, or offer.id_rent_flow when the scored event is OS.
  id_house:
    lineage:
      - datalake_expected_contribution_margin.expected_contribution_margin.id_house
    description: QuintoAndar property identifier associated with the scored demand event.
  id_prospect:
    lineage:
      - datalake_expected_contribution_margin.expected_contribution_margin.id_user
    description: Tenant prospect user id (id_user in the EMLIO request payload).
  id_request:
    lineage:
      - datalake_expected_contribution_margin.expected_contribution_margin.id_request
    description: Unique EMLIO inference request id (outputs.request_id).
  id_event:
    lineage:
      - datalake_booking.booking.id
      - datalake_offer.offer.id_offer_context
    description: |
      Legacy event identifier for schema compatibility: booking.id for VB (earliest
      rent booking for the visit code, ROW_NUMBER by booking.ts_created) and
      offer.id_offer_context for OS. Null when id_entity has no matching entity.
  id_entity:
    lineage:
      - datalake_expected_contribution_margin.expected_contribution_margin.id_entity
    description: |
      Business entity scored by the online ECM service: visit code (booking.code)
      for VB events, or Firestore offer id (offer.id_firestore) for OS events.
  event_type:
    lineage:
      - datalake_expected_contribution_margin.expected_contribution_margin.request
    description: Demand funnel event type scored by ECM. VB for Visit Booked or OS for Offer Sent.
  estimated_contract_duration:
    lineage:
      - datalake_expected_contribution_margin.expected_contribution_margin.estimated_duration
    description: |
      Estimated contract duration in months, converted from the online ECM
      estimated_duration (days) by dividing by 30.
  estimated_conversion:
    lineage:
      - datalake_expected_contribution_margin.expected_contribution_margin.estimated_conversion_probability
    description: Estimated probability of conversion returned by the online ECM service.
  estimated_gross_revenue:
    lineage:
      - datalake_expected_contribution_margin.expected_contribution_margin.estimated_gross_revenue
    description: Projected gross revenue returned by the online ECM service.
  estimated_net_revenue:
    lineage:
      - datalake_expected_contribution_margin.expected_contribution_margin.estimated_net_revenue
    description: Projected net revenue returned by the online ECM service.
  estimated_net_revenue_after_losses:
    lineage:
      - datalake_expected_contribution_margin.expected_contribution_margin.estimated_net_revenue
    description: |
      Projected net revenue after expected losses. The online eltv service returns a
      single net-revenue estimate, so this column matches estimated_net_revenue.
  estimated_contribution_margin:
    lineage:
      - datalake_expected_contribution_margin.expected_contribution_margin.estimated_contribution_margin
    description: Projected contribution margin returned by the online ECM service.
  dt_event_time:
    lineage:
      - datalake_expected_contribution_margin.expected_contribution_margin.ts_log
    description: Date partition key derived from ts_log (EMLIO write time).
  ts_event:
    lineage:
      - datalake_expected_contribution_margin.expected_contribution_margin.ts_event
      - datalake_booking.booking.ts_created
      - datalake_offer.offer.ts_created
      - datalake_expected_contribution_margin.expected_contribution_margin.ts_log
    description: |
      Timestamp of the scored demand event from the EMLIO request; falls back to
      booking.ts_created (VB), offer.ts_created (OS), then ts_log when missing.
