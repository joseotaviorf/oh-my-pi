database_name: datalake_rent_potential_listing
table_name: potential_listing_b2b
domain: For Rent
description: Enrich table that contains partner agent information of reprocessed leads tied to a listing flow.
owner: matheus.baroni@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_listing_flow.listing_flows_with_reprocessed_leads.id
    description: ID of the listing flow
  id_condo:
    lineage:
      - datalake_ebdb_listing.house.id_condo_parent
    description: ID of the parent condo
  id_house_listing:
    lineage:
      - datalake_listing_flow.listing_flows_with_reprocessed_leads.id_house
      - datalake_ebdb_listing.house_listing.version
    description: ID of the house listing
  id_partner:
    lineage:
      - datalake_listing_flow.listing_flows_with_reprocessed_leads.id_partner
      - datalake_ebdb_clean.partner_agent.id_partner
    description: ID of the partner
  id_autonomous_agent:
    lineage:
      - datalake_ebdb_clean.partner_agent.id_user
    description: ID of the autonomous agent (User ID)
  id_user_registrant:
    lineage:
      - datalake_ebdb_listing.house.id_user_registrant
    description: ID of the user that registered the house
  is_exclusive:
    lineage:
      - datalake_ebdb_listing.house.is_exclusive
    description: Boolean indication whether the house is exclusive
  is_autonomous_agent:
    description: Boolean indication whether the user registrant is an autonomous agent
