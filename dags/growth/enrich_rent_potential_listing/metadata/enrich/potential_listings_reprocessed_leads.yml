database_name: datalake_rent_potential_listing
table_name: potential_listings_reprocessed_leads
domain: For Rent
description: Enrich table that contains origin information about reprocessed leads tied to a listing flow.
owner: matheus.baroni@quintoandar.com.br
columns:
  id:
    description: Listing flow ID.
    lineage:
      - datalake_listing_flow.listing_flows_with_reprocessed_leads.id
  lead_type:
    description: Type of the lead.
    lineage:
      - datalake_lead.lead.type
  lead_origin:
    description: Origin of the lead.
    lineage:
      - datalake_lead.lead.source
  utm_source:
    description: The origin of the traffic.
    lineage:
      - datalake_lead.lead.utm_source
  utm_medium:
    description: The medium or location where the link was shared.
    lineage:
      - datalake_lead.lead.utm_medium
  is_lead_branded:
    description: Boolean indication whether the lead campaign is branded or institutional.
    lineage:
      - datalake_lead.lead.utm_campaign
  is_reprocessed:
    description: Boolean indication whether the lead was reprocessed.
    lineage:
      - datalake_lead.lead.source
