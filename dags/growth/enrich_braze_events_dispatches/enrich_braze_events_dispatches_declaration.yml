---
dag:
  name: enrich_braze_events_dispatches
  schedule_start_date: 2020, 11, 1
  owner: Data Growth
  documentation:
    dag_purpose: This DAG creates the incremental enriched tables for dispatch events for both tenants and owners from Braze.
workflow:
  type: query_delta
  layer: enrich
  custom_schema: braze_dispatches
  default_extraction_type: incremental
  default_partitions:
  - event_channel
  - year
  - month
  - day
cluster:
  # TO-DO: Review this cluster to fix number of workers and resources
  type: custom_cluster
  custom_configurations:
    spark_version: 12.2.x-scala2.12
    driver_node_type_id: r5d.xlarge
    node_type_id: r5d.xlarge
    runtime_engine: PHOTON
    autoscale:
      min_workers: 1
      max_workers: 2
    spark_conf:
      spark.executor.cores: 4
      spark.driver.memory: 22g
      spark.driver.memoryOverhead: 3g
      spark.executor.memory: 22g
      spark.executor.memoryOverhead: 3g
