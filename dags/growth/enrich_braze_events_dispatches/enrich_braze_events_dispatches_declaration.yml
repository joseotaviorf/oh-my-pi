---
dag:
  name: enrich_braze_events_dispatches
  schedule_start_date: 2020, 11, 1
  owner: Data Growth
  documentation:
    dag_purpose: This DAG creates the incremental enriched tables for dispatch events for both tenants and owners from Braze.
workflow:
  type: query_delta
  layer: enrich
  custom_schema: braze_dispatches
  default_extraction_type: incremental
  default_partitions:
  - event_channel
  - year
  - month
  - day
cluster:
  type: custom_cluster
  custom_configurations:
    spark_version: 12.2.x-scala2.12
    driver_node_type_id: r5d.xlarge
    node_type_id: r5d.xlarge
    runtime_engine: PHOTON
    num_workers: 2

