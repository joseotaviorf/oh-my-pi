dag:
  name: cdp_clickhouse
  owner: Data Growth
  schedule_start_date: 2026, 6, 1
  schedule_interval: 0 * * * *
  max_active_runs: 1
  documentation:
    dag_purpose: |
      Incrementally ingests CDP events from the ClickHouse events_api table every hour
      (UTC). Each run exports the previous three hours in one-hour windows: ClickHouse
      writes Parquet directly to the processed-data bucket, Spark loads raw Delta
      partitions with replaceWhere, then builds transactional_events, user_tracking_events
      and comms_events in clean by filtering egw_event_type. Overlapping runs are safe
      because only affected hourly raw partitions are overwritten.

workflow:
  layer: raw
  type: custom_ingestion
  custom_schema: cdp
  load_spark_job: load_cdp_clickhouse
  default_extraction_type: incremental
  default_partitions: [year, month, day, hour]
  execution_timeout_hours: 2
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, (data_interval_end - macros.timedelta(hours=3)).strftime('%Y-%m-%d %H:%M:%S'), 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_end.strftime('%Y-%m-%d %H:%M:%S'), 'load_end_date') }}"
  spark_job_arguments:
    - "{environment}"
    - "{bucket}"
    - "{dag_name}"
    - "{schema}"
    - "{table_name}"
    - "{extraction_type}"
    - "{load_start_date}"
    - "{load_end_date}"
  tables_customization:
    events_api:
      extraction_type: incremental
      partitions: [egw_event_type, year, month, day, hour]
    transactional_events:
      raw_table_dependency: events_api
      clean_extraction_type: incremental
      clean_partitions: [year, month, day]
      merge_on: [id_event, event_name, year, month, day]
      when_matched_update_condition: source.ts_egw >= target.ts_egw
      clean_z_order_by: [event_name, id_user]
    user_tracking_events:
      raw_table_dependency: events_api
      clean_extraction_type: incremental
      clean_partitions: [year, month, day]
      merge_on: [id_event, event_name, year, month, day]
      when_matched_update_condition: source.ts_egw >= target.ts_egw
      clean_z_order_by: [event_name, id_user]
    comms_events:
      raw_table_dependency: events_api
      clean_extraction_type: incremental
      clean_partitions: [year, month, day]
      merge_on: [id_event, event_name, year, month, day]
      when_matched_update_condition: source.ts_egw >= target.ts_egw
      clean_z_order_by: [event_name, id_user]
