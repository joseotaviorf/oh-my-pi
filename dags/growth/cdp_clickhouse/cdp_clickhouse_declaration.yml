dag:
  name: cdp_clickhouse
  owner: Data Growth
  schedule_start_date: 2026, 6, 1
  schedule_interval: "*/30 * * * *"
  max_active_runs: 1
  documentation:
    dag_purpose: |
      Incrementally ingests CDP Event Gateway events from ClickHouse every 30 minutes
      (UTC). Each run exports rows newly ingested in the load window (ts_ingested_at)
      into Parquet on the processed-data bucket partitioned by ingest hour
      (ingestion_date as YYYY-MM-DD-HH), then loads matching ingestion_date
      partitions into raw Delta tables. Three independent raw ingestion tasks read
      from ClickHouse user_tracking_events, transactional_events and comms_events
      views. Clean context tables partition by event_name and event_date.
      Overlapping runs are safe because only affected ingest-hour raw
      ingestion_date partitions are overwritten.

workflow:
  layer: raw
  type: custom_ingestion
  has_hive_sync: false
  custom_schema: cdp
  load_spark_job: load_cdp_clickhouse
  default_extraction_type: incremental
  default_partitions: [ingestion_date]
  execution_timeout_hours: 2
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, (data_interval_end - macros.timedelta(hours=2)).strftime('%Y-%m-%d %H:00:00'), 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, (data_interval_end + macros.timedelta(hours=1)).strftime('%Y-%m-%d %H:00:00'), 'load_end_date') }}"
  spark_job_arguments:
    - "{environment}"
    - "{bucket}"
    - "{dag_name}"
    - "{schema}"
    - "{table_name}"
    - "{extraction_type}"
    - "{load_start_date}"
    - "{load_end_date}"
  tables_customization:
    user_tracking_events:
      extraction_type: incremental
      partitions: [ingestion_date]
      clean_extraction_type: incremental
      clean_partitions: [event_name, event_date]
      merge_on: [id_event, application, event_name, event_date]
      when_matched_update_condition: source.ts_egw_updated_at >= target.ts_egw_updated_at
    transactional_events:
      extraction_type: incremental
      partitions: [ingestion_date]
      clean_extraction_type: incremental
      clean_partitions: [event_name, event_date]
      merge_on: [id_event, application, event_name, event_date]
      when_matched_update_condition: source.ts_egw_updated_at >= target.ts_egw_updated_at
    comms_events:
      extraction_type: incremental
      partitions: [ingestion_date]
      clean_extraction_type: incremental
      clean_partitions: [event_name, event_date]
      merge_on: [id_event, application, event_name, event_date]
      when_matched_update_condition: source.ts_egw_updated_at >= target.ts_egw_updated_at
