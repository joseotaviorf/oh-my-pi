cluster:
  type: emr_7_12_consolidation_m_memory_cluster
  custom_configurations:
    aws_attributes:
      ebs_volume_size: 300
    task_nodes:
      instance_count: 2
    init_scripts:
      - s3:
          destination: "{{ var.value.artifacts_bucket }}/bi-etl-ejuice/init_script_cdp.sh"
        args:
          - "{{ var.value.artifacts_bucket }}"
          - "{{ var.value.databricks_s3_bucket }}"
          - "{{ dag.dag_id }}"
