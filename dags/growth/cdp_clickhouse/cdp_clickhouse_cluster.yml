cluster:
  type: emr_7_12_consolidation_l_memory_cluster
  custom_configurations:
    aws_attributes:
      ebs_volume_size: 400
    core_nodes:
      instance_count: 6
    task_nodes:
      instance_count: 0
    spark_conf:
      spark.sql.shuffle.partitions: '400'
      spark.dynamicAllocation.maxExecutors: '8'
  custom_libraries:
    - pypi:
        package: clickhouse-connect>=0.7.0
        no_deps: true
