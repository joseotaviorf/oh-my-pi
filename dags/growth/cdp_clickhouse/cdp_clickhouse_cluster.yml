cluster:
  type: emr_7_12_consolidation_l_memory_cluster
  custom_configurations:
    aws_attributes:
      ebs_volume_size: 400
    core_nodes:
      instance_count: 2
    task_nodes:
      instance_count: 4
    spark_conf:
      spark.sql.shuffle.partitions: '400'
      spark.dynamicAllocation.maxExecutors: '8'
    init_scripts:
      - s3:
          destination: "{{ var.value.artifacts_bucket }}/bi-etl-ejuice/init_script_cdp.sh"
        args:
          - "{{ var.value.artifacts_bucket }}"
          - "{{ var.value.databricks_s3_bucket }}"
          - "{{ dag.dag_id }}"
