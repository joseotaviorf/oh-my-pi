---
database_name: datalake_cdp_clean
table_name: transactional_events
description: |
  Clean-layer CDP transactional Event Gateway events from datalake_cdp_raw.transactional_events.
  Transformations are applied in the ClickHouse transactional_events view; clean SQL adds
  event-date dt partitioning from ts_event.
  Primary key grain: id_event with event_name and dt partitions.
domain: Growth
owner: isadora.gallerani@quintoandar.com.br
columns:
  id_event:
    description: |
      Unique event identifier from the EGW hub payload; merge key together with
      event_name and dt partitions.
    lineage:
      - datalake_cdp_raw.transactional_events.id_event
  id_person:
    description: |
      Person identifier from person_uuid on the governed hub event when identity
      resolution is available.
    lineage:
      - datalake_cdp_raw.transactional_events.id_person
  id_user:
    description: |
      Application user identifier attached to the event from the ClickHouse view.
    lineage:
      - datalake_cdp_raw.transactional_events.id_user
  id_domain_user:
    description: |
      Domain-scoped user identifier parsed in the ClickHouse transactional_events view.
    lineage:
      - datalake_cdp_raw.transactional_events.id_domain_user
  id_entity:
    description: |
      Entity identifier for the device or other entity that generated the event.
    lineage:
      - datalake_cdp_raw.transactional_events.id_entity
  id_house:
    description: |
      House identifier from the ClickHouse transactional_events view.
    lineage:
      - datalake_cdp_raw.transactional_events.id_house
  id_contract:
    description: |
      Contract identifier coalesced from native contract_id and event_properties in
      the ClickHouse transactional_events view.
    lineage:
      - datalake_cdp_raw.transactional_events.id_contract
  application:
    description: |
      Lowercased application or product surface that generated the transactional event.
    lineage:
      - datalake_cdp_raw.transactional_events.application
  journey_step:
    description: |
      Funnel or journey step label associated with the event when defined in tracking.
    lineage:
      - datalake_cdp_raw.transactional_events.journey_step
  event_name:
    description: |
      Lowercased name of the transactional event emitted by the application or SDK.
    lineage:
      - datalake_cdp_raw.transactional_events.event_name
  event_properties:
    description: |
      Raw JSON string of event-specific properties from the governed EGW transactional
      hub record.
    lineage:
      - datalake_cdp_raw.transactional_events.event_properties
  user_properties:
    description: |
      Raw JSON string of user-scoped properties from the governed EGW transactional
      hub record.
    lineage:
      - datalake_cdp_raw.transactional_events.user_properties
  ts_event:
    description: |
      Client-reported event time in UTC from timestamp_dt in the ClickHouse view.
    lineage:
      - datalake_cdp_raw.transactional_events.ts_event
  ts_egw:
    description: |
      Time when Event Gateway ingested the event in UTC from the ClickHouse view.
    lineage:
      - datalake_cdp_raw.transactional_events.ts_egw
  ts_ingested_at:
    description: |
      Timestamp when ClickHouse ingested the event, mapped from ClickHouse
      `_ingested_at` via the raw table. Distinct from ts_egw (Event Gateway)
      and ts_event (client clock).
    lineage:
      - datalake_cdp_raw.transactional_events.ts_ingested_at
  ts_load:
    description: |
      Timestamp when the clean query executed, set with CURRENT_TIMESTAMP at
      write time. Distinct from ts_ingested_at (ClickHouse) and ts_egw
      (Event Gateway).
  dt:
    description: |
      Partition key; calendar date of ts_event formatted as YYYY-MM-DD for partition pruning.
    lineage:
      - datalake_cdp_clean.transactional_events.ts_event
