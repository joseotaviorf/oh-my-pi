---
database_name: datalake_cdp_clean
table_name: comms_events
description: |
  Clean-layer CDP communication Event Gateway events from datalake_cdp_raw.comms_events.
  Transformations are applied in the ClickHouse comms_events view; clean SQL adds
  event_date partitioning from ts_event.
  Primary key grain: id_event with application, event_name and event_date partitions.
domain: Growth
owner: marcio.gomes@quintoandar.com.br
columns:
  id_event:
    description: |
      Unique event identifier from the EGW hub payload; merge key together with
      application, event_name and event_date partitions.
    lineage:
      - datalake_cdp_raw.comms_events.id_event
  id_person:
    description: |
      Person identifier from person_uuid on the governed hub event when identity
      resolution is available.
    lineage:
      - datalake_cdp_raw.comms_events.id_person
  id_user:
    description: |
      Application user identifier attached to the communication event as a string.
    lineage:
      - datalake_cdp_raw.comms_events.id_user
  id_domain_user:
    description: |
      Domain-scoped user identifier parsed in the ClickHouse comms_events view.
    lineage:
      - datalake_cdp_raw.comms_events.id_domain_user
  id_anonymous:
    description: |
      Anonymous device identifier associated with the communication event.
    lineage:
      - datalake_cdp_raw.comms_events.id_anonymous
  id_dispatch:
    description: |
      Dispatch identifier from the ClickHouse comms_events view.
    lineage:
      - datalake_cdp_raw.comms_events.id_dispatch
  user_type:
    description: |
      Audience or profile role from the ClickHouse comms_events view.
    lineage:
      - datalake_cdp_raw.comms_events.user_type
  channel:
    description: |
      Communication channel from the ClickHouse comms_events view.
    lineage:
      - datalake_cdp_raw.comms_events.channel
  comms_type:
    description: |
      Type of communication context from the ClickHouse comms_events view.
    lineage:
      - datalake_cdp_raw.comms_events.comms_type
  comms_typology:
    description: |
      Communication typology or category from the ClickHouse comms_events view.
    lineage:
      - datalake_cdp_raw.comms_events.comms_typology
  comms_journey_step:
    description: |
      Journey step for the communication from the ClickHouse comms_events view.
    lineage:
      - datalake_cdp_raw.comms_events.comms_journey_step
  comms_status:
    description: |
      Delivery or interaction status from the ClickHouse comms_events view.
    lineage:
      - datalake_cdp_raw.comms_events.comms_status
  comms_name:
    description: |
      Reference name of the communication from the ClickHouse comms_events view.
    lineage:
      - datalake_cdp_raw.comms_events.comms_name
  comms_rule:
    description: |
      Rule applied to the communication from the ClickHouse comms_events view.
    lineage:
      - datalake_cdp_raw.comms_events.comms_rule
  comms_action:
    description: |
      Action taken for the communication from the ClickHouse comms_events view.
    lineage:
      - datalake_cdp_raw.comms_events.comms_action
  comms_template:
    description: |
      Template name used for the communication from the ClickHouse comms_events view.
    lineage:
      - datalake_cdp_raw.comms_events.comms_template
  comms_source:
    description: |
      Source application that originated the communication from the ClickHouse view.
    lineage:
      - datalake_cdp_raw.comms_events.comms_source
  application:
    description: |
      Application or product surface that generated the communication event; part of
      the merge key together with id_event and event_name.
    lineage:
      - datalake_cdp_raw.comms_events.application
  event_properties:
    description: |
      Raw JSON string of communication event properties from the governed EGW hub
      record; source for parsed comms_* fields where applicable.
    lineage:
      - datalake_cdp_raw.comms_events.event_properties
  user_properties:
    description: |
      Raw JSON string of user-scoped properties from the governed EGW hub record.
    lineage:
      - datalake_cdp_raw.comms_events.user_properties
  enrichments:
    description: |
      Raw JSON string of enrichment payloads from the ClickHouse comms_events view,
      populated when governed enrichment is registered for the event.
    lineage:
      - datalake_cdp_raw.comms_events.enrichments
  event_name:
    description: |
      Event name from the communication hub stream.
    lineage:
      - datalake_cdp_raw.comms_events.event_name
  ts_event:
    description: |
      Client-reported event time in UTC from timestamp_dt in the ClickHouse view.
    lineage:
      - datalake_cdp_raw.comms_events.ts_event
  ts_egw:
    description: |
      Time when Event Gateway ingested the event in UTC from the ClickHouse view.
    lineage:
      - datalake_cdp_raw.comms_events.ts_egw
  ts_egw_updated_at:
    description: |
      Event Gateway update time in UTC from the ClickHouse view; merge version
      column on incremental load (source.ts_egw_updated_at >= target).
    lineage:
      - datalake_cdp_raw.comms_events.ts_egw_updated_at
  ts_ingested_at:
    description: |
      Timestamp when ClickHouse ingested the event, from ts_ingested_at on the
      raw table. Distinct from ts_egw (Event Gateway) and ts_event (client clock).
    lineage:
      - datalake_cdp_raw.comms_events.ts_ingested_at
  ts_load:
    description: |
      Timestamp when the clean query executed, set with CURRENT_TIMESTAMP at
      write time. Distinct from ts_ingested_at (ClickHouse) and ts_egw
      (Event Gateway).
  event_date:
    description: |
      Partition key; calendar date of ts_event formatted as YYYY-MM-DD for partition pruning.
    lineage:
      - datalake_cdp_clean.comms_events.ts_event
