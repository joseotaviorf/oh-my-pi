---
database_name: datalake_cdp_raw
table_name: events
description: |
  Raw Delta mirror of CDP Event Gateway events from ClickHouse events_parsed. The Spark
  job exports Parquet to the processed-data bucket partitioned by ingest hour
  (dt as YYYY-MM-DD-HH), then overwrites matching raw Delta partitions.
domain: Growth
owner: marcio.gomes@quintoandar.com.br
columns:
  event_id:
    description: Unique event identifier from the CDP Event Gateway hub.
  user_id:
    description: Application user identifier attached to the event.
  person_uuid:
    description: Person UUID from the CDP identity graph when resolved.
  egw_event_type:
    description: Event Gateway event type used to route downstream CDP workflows.
  application:
    description: Application or product surface that generated the event.
  journey_step:
    description: Funnel or journey step label associated with the event.
  event_name:
    description: Event name from the application or SDK.
  event_properties:
    description: JSON string of event-specific properties.
  user_properties:
    description: JSON string of user-level properties at capture time.
  timestamp:
    description: Client-reported event time as Unix epoch milliseconds.
  egw_timestamp:
    description: Event Gateway ingestion time as Unix epoch milliseconds.
  egw_updated_at:
    description: |
      Event Gateway update epoch in milliseconds; ReplacingMergeTree version column
      used for deduplication ordering in downstream layers.
  ts_ingested_at:
    description: |
      Timestamp when ClickHouse ingested the event, mapped from the ClickHouse
      `_ingested_at` column. Used to filter incremental exports and as a
      secondary dedup tie-breaker in downstream layers.
  ts_kafka:
    description: |
      Kafka produce or consume timestamp from ClickHouse events_parsed when the
      source column is present. Kept on raw only; not projected into clean.
  ts_load:
    description: |
      Timestamp when the cdp_clickhouse Spark job wrote the row into the raw
      Delta table, set to current_timestamp at job execution.
  enrichments:
    description: JSON string of enrichment fields such as device_id and domain_user_id.
  house_id:
    description: Native house identifier from the source event when present.
  contract_id:
    description: Native contract identifier from the source event when present.
  dt:
    description: Ingest hour partition derived from ts_ingested_at, formatted as YYYY-MM-DD-HH.
