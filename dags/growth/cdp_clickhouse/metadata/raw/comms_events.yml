---
database_name: datalake_cdp_raw
table_name: comms_events
description: |
  Raw Delta mirror of CDP communication events from the ClickHouse comms_events view
  (staged from events_api). Loaded incrementally by the cdp_clickhouse Spark job using
  timestamp_dt. Partitioned by event date (year, month, day). Source for
  datalake_cdp_clean.comms_events.
domain: Growth
owner: marcio.gomes@quintoandar.com.br
columns:
  id_event:
    description: Unique event identifier from the CDP ClickHouse events_api table.
  id_person:
    description: Person UUID from the CDP identity graph when resolved.
  id_user:
    description: Application user identifier attached to the communication event.
  id_domain_user:
    description: Domain-scoped user identifier from user_properties JSON.
  id_anonymous:
    description: Anonymous device identifier associated with the communication event.
  id_dispatch:
    description: Dispatch identifier from event_properties JSON.
  user_type:
    description: Audience or profile role from event_properties, lowercased.
  channel:
    description: Communication channel, lowercased from event_properties.
  comms_type:
    description: Communication context type, lowercased from event_properties.
  comms_typology:
    description: Communication category, lowercased from event_properties.
  comms_journey_step:
    description: Journey step for the communication, lowercased from event_properties.
  comms_status:
    description: Delivery or interaction status, lowercased from event_properties.
  comms_name:
    description: Reference name of the communication, lowercased from event_properties.
  comms_rule:
    description: Rule applied to the communication, lowercased from event_properties.
  comms_action:
    description: Action taken for the communication, lowercased from event_properties.
  comms_template:
    description: Template name used for the communication, lowercased from event_properties.
  comms_source:
    description: Source application that originated the communication, lowercased.
  event_properties:
    description: JSON string of communication event properties.
  user_properties:
    description: JSON string of user-level properties at capture time.
  event_name:
    description: Event name from the communication hub stream.
  ts_event:
    description: Client-reported event time in UTC.
  ts_egw:
    description: Event Gateway ingestion time in UTC.
  _ingested_at:
    description: ClickHouse ingestion timestamp retained from events_api.
  timestamp_dt:
    description: Event timestamp in UTC; drives incremental load windows on ClickHouse reads.
  year:
    description: Partition column derived from ts_event at load time.
  month:
    description: Partition column derived from ts_event at load time.
  day:
    description: Partition column derived from ts_event at load time.
