dag:
  name: reverse_listings_locations_access
  owner: Data Growth
workflow:
  type: access
  layer: reverse
  custom_schema: listings_locations
  load_spark_job: load_into_sqs
  spark_job_arguments:
    - "{dag_name}"
    - "reverse_listings_locations" # Database name
    - "{table_name}"
  tables_customization:
    listings_locations: {}
cluster:
  type: databricks_16_4_min_general_2_workers_cluster
  databricks_conn_id: databricks_new
  access_control_list:
    group_name: software-engineers
    permission_level: CAN_MANAGE
