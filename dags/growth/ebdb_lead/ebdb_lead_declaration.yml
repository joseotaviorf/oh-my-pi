dag:
  name: ebdb_lead
  schedule_start_date: 2021, 2, 20
  schedule_interval: 0 22 * * *
  owner: Data Growth
  documentation:
    dag_purpose: Extraction of EBDB tables related to Lead into data lake. EBDB is the main database of QuintoAndar.
workflow:
  type: cdc
  layer: raw
  database_type: mysql
  source_database: ebdb
  source_schema: ebdb
  custom_schema: ebdb
  dbutils_secret_key: EBDB_DB
  tables_customization:
    ConversaoLead:
      raw_primary_keys: ["id"]
      clean_table_name: conversion_lead
    ConversaoLead_AUD:
      raw_primary_keys: ["id", "REV"]
      clean_table_name: conversion_lead_aud
    Lead:
      raw_primary_keys: ["id"]
      clean_table_name: lead
    Lead_AUD:
      raw_primary_keys: ["id", "REV"]
      clean_table_name: lead_aud
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: m5d.xlarge
    node_type_id: m5d.2xlarge
    num_workers: 2
    spark_version: 13.3.x-scala2.12
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
  databricks_conn_id: databricks_new
