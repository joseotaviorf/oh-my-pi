database_name: datalake_zonaprop_clean
table_name: property_subtypes
domain: Growth
owner: vitor.musachio@quintoandar.com.br
description: 'Property subtype taxonomy under a Zonaprop property type (`subtiposdepropiedad`). One row per subtype (PK id_property_subtype). Refines property classification for search facets and analytics. Physical layout: Z-ordered by id_property_subtype (no partitions); filter on id_property_subtype for efficient data skipping.'
columns:
  id_property_subtype:
    lineage:
    - datalake_zonaprop_raw.subtiposdepropiedad.idsubtipodepropiedad
    description: Unique identifier for a property subtype within a property type.
  id_property_type:
    lineage:
    - datalake_zonaprop_raw.subtiposdepropiedad.idtipodepropiedad
    description: Parent property type that this subtype refines for classification.
  property_subtype_name:
    lineage:
    - datalake_zonaprop_raw.subtiposdepropiedad.nombre
    description: Display label of the subtype such as duplex, loft or penthouse.
  ts_cdc_transaction:
    lineage:
    - datalake_zonaprop_raw.subtiposdepropiedad.ts_cdc_transaction
    description: Wall-clock timestamp when the CDC connector captured this change event (millisecond precision).
  ts_database_transaction:
    lineage:
    - datalake_zonaprop_raw.subtiposdepropiedad.ts_database_transaction
    description: Timestamp of the originating database transaction in the source application before CDC propagation.
  op_cdc:
    lineage:
    - datalake_zonaprop_raw.subtiposdepropiedad.op_cdc
    description: CDC operation type captured by Debezium change-data-capture stream.
    categories:
      r: Read/snapshot - initial load of existing records.
      c: Create - new record inserted.
      u: Update - existing record modified.
      d: Delete - record removed.
