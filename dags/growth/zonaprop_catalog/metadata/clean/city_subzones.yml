database_name: datalake_zonaprop_clean
table_name: city_subzones
domain: Growth
owner: vitor.musachio@quintoandar.com.br
description: 'Sub-zone within a Zonaprop city zone (`subzonasciudad`). One row per sub-zone (PK id_city_subzone). Finer-grained geography for listing placement and neighborhood search. Physical layout: Z-ordered by id_city_subzone (no partitions); filter on id_city_subzone for efficient data skipping.'
columns:
  id_city:
    lineage:
    - datalake_zonaprop_raw.subzonasciudad.idciudad
    description: City that contains this sub-zone in the Zonaprop geographic hierarchy.
  id_city_subzone:
    lineage:
    - datalake_zonaprop_raw.subzonasciudad.idsubzonaciudad
    description: Unique identifier for a sub-zone within a city zone.
  id_city_zone:
    lineage:
    - datalake_zonaprop_raw.subzonasciudad.idzonaciudad
    description: Parent city zone that groups this sub-zone for neighborhood-level search.
  id_country:
    lineage:
    - datalake_zonaprop_raw.subzonasciudad.idpais
    description: Country market that scopes this sub-zone.
  id_state:
    lineage:
    - datalake_zonaprop_raw.subzonasciudad.idprovincia
    description: State or province that contains this sub-zone.
  city_subzone_name:
    lineage:
    - datalake_zonaprop_raw.subzonasciudad.nombre
    description: Display name of the sub-zone shown in listing location selectors.
  ts_cdc_transaction:
    lineage:
    - datalake_zonaprop_raw.subzonasciudad.ts_cdc_transaction
    description: Wall-clock timestamp when the CDC connector captured this change event (millisecond precision).
  ts_database_transaction:
    lineage:
    - datalake_zonaprop_raw.subzonasciudad.ts_database_transaction
    description: Timestamp of the originating database transaction in the source application before CDC propagation.
  op_cdc:
    lineage:
    - datalake_zonaprop_raw.subzonasciudad.op_cdc
    description: CDC operation type captured by Debezium change-data-capture stream.
    categories:
      r: Read/snapshot - initial load of existing records.
      c: Create - new record inserted.
      u: Update - existing record modified.
      d: Delete - record removed.
