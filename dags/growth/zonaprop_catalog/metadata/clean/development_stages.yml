database_name: datalake_zonaprop_clean
table_name: development_stages
domain: Growth
owner: vitor.musachio@quintoandar.com.br
description: 'Property development stage lookup on Zonaprop (`etapasdedesarrollo`). One row per stage (PK id_development_stage). Describes construction status for development and new-build listings. Physical layout: Z-ordered by id_development_stage (no partitions); filter on id_development_stage for efficient data skipping.'
columns:
  id_country:
    lineage:
    - datalake_zonaprop_raw.etapasdedesarrollo.idpais
    description: Country market where this development stage label applies.
  id_development_stage:
    lineage:
    - datalake_zonaprop_raw.etapasdedesarrollo.idetapadedesarrollo
    description: Unique identifier for a property construction or delivery stage.
  development_stage_name:
    lineage:
    - datalake_zonaprop_raw.etapasdedesarrollo.nombre
    description: Display label for the stage such as under construction, ready to move or pre-sale.
  display_order:
    lineage:
    - datalake_zonaprop_raw.etapasdedesarrollo.orden
    description: Sort position of the stage in listing creation dropdowns.
  ts_cdc_transaction:
    lineage:
    - datalake_zonaprop_raw.etapasdedesarrollo.ts_cdc_transaction
    description: Wall-clock timestamp when the CDC connector captured this change event (millisecond precision).
  ts_database_transaction:
    lineage:
    - datalake_zonaprop_raw.etapasdedesarrollo.ts_database_transaction
    description: Timestamp of the originating database transaction in the source application before CDC propagation.
  op_cdc:
    lineage:
    - datalake_zonaprop_raw.etapasdedesarrollo.op_cdc
    description: CDC operation type captured by Debezium change-data-capture stream.
    categories:
      r: Read/snapshot - initial load of existing records.
      c: Create - new record inserted.
      u: Update - existing record modified.
      d: Delete - record removed.
