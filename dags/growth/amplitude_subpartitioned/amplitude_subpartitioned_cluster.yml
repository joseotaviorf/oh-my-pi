cluster:
  type: emr_7_12_consolidation_m_memory_fleet_cluster
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    autotermination_minutes: 30
    step_concurrency_level: 6
    master_node_type_id: r6g.4xlarge
    core_nodes:
      target_on_demand: 2
      target_spot: 0
      instance_types: [r6g.2xlarge, r7g.2xlarge, r6i.2xlarge]
    task_nodes:
      target_on_demand: 0
      target_spot: 3
      instance_types: [r6g.2xlarge, r7g.2xlarge, r6i.2xlarge]
      allocation_strategy: price-capacity-optimized
      bid_price_percentage: 100
