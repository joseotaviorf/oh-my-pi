cluster:
  type: emr_7_12_consolidation_l_general_fleet_cluster
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    autotermination_minutes: 30
    step_concurrency_level: 12
    master_node_type_id: r6g.8xlarge
    core_nodes:
      target_on_demand: 2
      target_spot: 0
      instance_types: [m6g.4xlarge, m7g.4xlarge, m6i.4xlarge]
    task_nodes:
      target_on_demand: 0
      target_spot: 6
      instance_types: [m6g.4xlarge, m7g.4xlarge, m6i.4xlarge]
      allocation_strategy: price-capacity-optimized
      bid_price_percentage: 100
    spark_conf:
      spark.executor.cores: "4"
      spark.executor.memory: "10g"
      spark.executor.memoryOverhead: "2g"
      spark.dynamicAllocation.maxExecutors: "32"
