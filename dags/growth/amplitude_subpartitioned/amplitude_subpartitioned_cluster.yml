cluster:
  type: emr_7_12_consolidation_l_general_cluster
  custom_configurations:
    # 25 Amplitude event loads per cluster (367 tables -> 15 clusters). With the
    # queries now pruning on the year/month/day partition columns, each load reads a
    # single day (~tens of MB) instead of full-scanning the 54GB events table, so the
    # cluster can be small. Small 8g executors keep GC pauses short — the 24g heaps
    # tried earlier caused multi-minute GC and executor heartbeat timeouts. Run 8 at a
    # time on 3 m6g.4xlarge core nodes. No cluster autoscale; Spark dynamicAllocation on
    # (min 1 / max 3) since the pruned data is light. max_active_tasks: 120 (15 x 8).
    step_concurrency_level: 8
    core_nodes:
      instance_count: 3
    aws_attributes:
      ebs_volume_size: 200
    spark_conf:
      spark.executor.memory: 8g
      spark.executor.memoryOverhead: 2g
      spark.executor.cores: "2"
      spark.driver.memory: 4g
      spark.driver.memoryOverhead: 2g
      spark.dynamicAllocation.enabled: "true"
      spark.dynamicAllocation.minExecutors: "1"
      spark.dynamicAllocation.maxExecutors: "3"
