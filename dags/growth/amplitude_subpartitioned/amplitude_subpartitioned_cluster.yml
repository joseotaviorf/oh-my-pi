cluster:
  type: consolidation_l_general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    driver_node_type_id: c6g.4xlarge
    num_workers: 3
    spark_version: 16.4.x-scala2.12
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment}}
      spark.driver.extraJavaOptions: -XX:MaxMetaspaceSize=1024m -XX:MetaspaceSize=256m
      spark.executor.extraJavaOptions: -XX:MaxMetaspaceSize=1024m -XX:MetaspaceSize=256m
    aws_attributes:
      ebs_volume_size: 500
validation:
  cluster:
    type: consolidation_l_general_cluster
    databricks_conn_id: databricks_new
    custom_configurations:
      aws_attributes:
        ebs_volume_size: 500
      spark_conf:
        spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment}}
        spark.driver.extraJavaOptions: -XX:MaxMetaspaceSize=1024m -XX:MetaspaceSize=256m
        spark.executor.extraJavaOptions: -XX:MaxMetaspaceSize=1024m -XX:MetaspaceSize=256m
      num_workers: 3
      node_type_id: m7g.4xlarge
      driver_node_type_id: c7g.4xlarge
