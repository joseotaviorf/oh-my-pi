cluster:
  type: emr_7_12_consolidation_xl_general_cluster
  custom_configurations:
    # 25 Amplitude event loads per cluster (367 tables -> 15 clusters). Each load is a
    # wide scan (Delta file-skipping on id_app/event_type) + GET_JSON_OBJECT parse +
    # Delta write, so it needs real heap: 8g OOMed. Run 8 at a time, not 16 — on a fixed
    # cluster 16 concurrent apps starve each other (pinned near minExecutors 1) and the
    # 5-min tasks crawl. At concurrency 8 on 6 m6g.8xlarge core nodes (~23 executor slots
    # of 24g) each heavy table (session_start, listing_page_viewed) can grab up to 8
    # executors and finish fast. No CLUSTER autoscale (fixed instance groups); Spark
    # dynamicAllocation on so small tables stay at 1 executor. max_active_tasks: 120
    # (15 x 8) keeps every cluster fed without oversubscription. Validate in Forno.
    step_concurrency_level: 8
    core_nodes:
      instance_count: 6
    aws_attributes:
      ebs_volume_size: 500
    spark_conf:
      spark.executor.memory: 24g
      spark.executor.memoryOverhead: 6g
      spark.executor.cores: "4"
      spark.driver.memory: 8g
      spark.driver.memoryOverhead: 2g
      spark.dynamicAllocation.enabled: "true"
      spark.dynamicAllocation.minExecutors: "1"
      spark.dynamicAllocation.maxExecutors: "8"
