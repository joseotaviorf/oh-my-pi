database_name: datalake_amplitude_clean
table_name: 233592_agenda_visit_list_page_viewed_events
owner: guilherme.rocha@quintoandar.com.br
domain: For Sale
description: Tracks when users view the agenda visit list page in the application.
columns:
  id_user:
    description: Unique identifier of the user who viewed the agenda visit list page.
    lineage:
      - datalake_amplitude_clean.events.id_user
  is_agenda_extra_visits_shortcut_entrypoint_enabled:
    description: Boolean flag indicating whether the agenda extra visits shortcut entrypoint feature
      is enabled for this user session.
    lineage:
      - datalake_amplitude_clean.events.event_properties.is_agenda_extra_visits_shortcut_entrypoint_enabled
  ts_event:
    description: Timestamp when the agenda visit list page view event occurred.
    lineage:
      - datalake_amplitude_clean.events.ts_event
  year:
    description: Year component of the event timestamp, used for efficient data partitioning and
      time-based filtering.
    lineage:
      - datalake_amplitude_clean.events.year
  month:
    description: Month component of the event timestamp, used for efficient data partitioning and
      time-based filtering.
    lineage:
      - datalake_amplitude_clean.events.month
  day:
    description: Day component of the event timestamp, used for efficient data partitioning and
      time-based filtering.
    lineage:
      - datalake_amplitude_clean.events.day
