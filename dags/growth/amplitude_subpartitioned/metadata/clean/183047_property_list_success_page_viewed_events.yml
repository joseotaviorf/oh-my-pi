database_name: datalake_amplitude_clean
table_name: 183047_property_list_success_page_viewed_events
columns:
  id_amplitude:
    lineage:
      - datalake_amplitude_clean.events.id_amplitude
    description: Primary Amplitude event identifier assigned by the analytics SDK for deduplication and event tracing.
  ids_amplitude_attributed:
    lineage:
      - datalake_amplitude_clean.events.ids_amplitude_attributed
    description: Array of Amplitude IDs linked to the same user identity after attribution merging across devices.
  id_house:
    lineage:
      - datalake_amplitude_clean.events.event_properties
    description: QuintoAndar listing identifier parsed from the JSON analytics payload for property joins.
  id_user:
    lineage:
      - datalake_amplitude_clean.events.id_user
    description: Amplitude user identifier for cross-event identity stitching across sessions and devices.
  id_device:
    lineage:
      - datalake_amplitude_clean.events.id_device
    description: Amplitude-generated device identifier used to stitch sessions on the same physical device.
  id_event:
    lineage:
      - datalake_amplitude_clean.events.id_event
    description: Amplitude insert identifier for the ingested row within the export batch.
  id_app:
    lineage:
      - datalake_amplitude_clean.events.id_app
    description: Amplitude project identifier filtering events to a specific QuintoAndar mobile or web application.
  uuid:
    lineage:
      - datalake_amplitude_clean.events.uuid
    description: Universally unique identifier for the ingested event row in the Amplitude export.
  adid:
    lineage:
      - datalake_amplitude_clean.events.adid
    description: Android advertising identifier (Google Advertising ID) captured from the device when available.
  id_session:
    lineage:
      - datalake_amplitude_clean.events.id_session
    description: Amplitude session identifier grouping events within the same user session window.
  id_schema:
    lineage:
      - datalake_amplitude_clean.events.id_schema
    description: Amplitude schema version identifier for the exported event payload format.
  id_inserted:
    lineage:
      - datalake_amplitude_clean.events.id_inserted
    description: Surrogate insert identifier assigned during Amplitude batch ingestion.
  idfa:
    lineage:
      - datalake_amplitude_clean.events.idfa
    description: Apple Identifier for Advertisers captured on iOS devices when tracking permission allows.
  event_type:
    lineage:
      - datalake_amplitude_clean.events.event_type
    description: Product event name tracked in Amplitude (for example offer_submitted or offer_canceled_new).
  amplitude_event_type:
    lineage:
      - datalake_amplitude_clean.events.amplitude_event_type
    description: Internal Amplitude classification of the raw ingestion event type before project-specific mapping.
  ab_beakman_native_owner_home_toggle:
    lineage:
      - datalake_amplitude_clean.events.user_properties
    description: Analytics attribute 'ab beakman native owner home toggle' materialized in this subpartition for product funnel reporting and Growth enrich pipelines.
  up_platform:
    lineage:
      - datalake_amplitude_clean.events.user_properties
    description:
      Column platform extracted from the user properties of the Amplitude events
  ep_active_number_of_houses:
    lineage:
      - datalake_amplitude_clean.events.event_properties
    description: Analytics attribute 'ep active number of houses' materialized in this subpartition for product funnel reporting and Growth enrich pipelines.
  ep_total_number_of_houses:
    lineage:
      - datalake_amplitude_clean.events.event_properties
    description: Analytics attribute 'ep total number of houses' materialized in this subpartition for product funnel reporting and Growth enrich pipelines.
  ep_page_number:
    lineage:
      - datalake_amplitude_clean.events.event_properties
    description: Analytics attribute 'ep page number' materialized in this subpartition for product funnel reporting and Growth enrich pipelines.
  ep_house_ids:
    lineage:
      - datalake_amplitude_clean.events.event_properties
    description: Analytics attribute 'ep house ids' materialized in this subpartition for product funnel reporting and Growth enrich pipelines.
  ep_rent_house_status:
    lineage:
      - datalake_amplitude_clean.events.event_properties
    description: Analytics attribute 'ep rent house status' materialized in this subpartition for product funnel reporting and Growth enrich pipelines.
  ep_sale_house_status:
    lineage:
      - datalake_amplitude_clean.events.event_properties
    description: Analytics attribute 'ep sale house status' materialized in this subpartition for product funnel reporting and Growth enrich pipelines.
  city:
    lineage:
      - datalake_amplitude_clean.events.city
    description: City name inferred by Amplitude from the client IP address at event time.
  country:
    lineage:
      - datalake_amplitude_clean.events.country
    description: ISO country code inferred by Amplitude from the client IP address at event time.
  data:
    lineage:
      - datalake_amplitude_clean.events.data
    description: Raw JSON payload with additional Amplitude ingestion metadata not mapped to top-level columns.
  device_brand:
    lineage:
      - datalake_amplitude_clean.events.device_brand
    description: Hardware brand reported by the device operating system (for example Apple or Samsung).
  device_carrier:
    lineage:
      - datalake_amplitude_clean.events.device_carrier
    description: Mobile network carrier name reported by the device when available.
  device_family:
    lineage:
      - datalake_amplitude_clean.events.device_family
    description: Device family grouping from Amplitude device detection (for example iPhone or Android).
  device_manufacturer:
    lineage:
      - datalake_amplitude_clean.events.device_manufacturer
    description: Device manufacturer name reported by the operating system.
  device_model:
    lineage:
      - datalake_amplitude_clean.events.device_model
    description: Specific device model string reported by the operating system.
  device_type:
    lineage:
      - datalake_amplitude_clean.events.device_type
    description: Coarse device category from Amplitude (for example mobile, tablet, or desktop).
  dma:
    lineage:
      - datalake_amplitude_clean.events.dma
    description: US designated market area code inferred from IP geolocation when applicable.
  ip_address:
    lineage:
      - datalake_amplitude_clean.events.ip_address
    description: Client IP address at event time, used for geolocation inference by Amplitude.
  location_lat:
    lineage:
      - datalake_amplitude_clean.events.location_lat
    description: Latitude inferred from IP geolocation or device GPS when provided.
  location_lng:
    lineage:
      - datalake_amplitude_clean.events.location_lng
    description: Longitude inferred from IP geolocation or device GPS when provided.
  os_name:
    lineage:
      - datalake_amplitude_clean.events.os_name
    description: Operating system name reported by the client SDK (for example iOS or Android).
  os_version:
    lineage:
      - datalake_amplitude_clean.events.os_version
    description: Operating system version string reported by the client SDK.
  platform:
    lineage:
      - datalake_amplitude_clean.events.platform
    description: Amplitude platform label for the originating client (for example iOS, Android, or Web).
  library:
    lineage:
      - datalake_amplitude_clean.events.library
    description: Amplitude SDK library name and version used to send the event.
  region:
    lineage:
      - datalake_amplitude_clean.events.region
    description: State or region name inferred by Amplitude from the client IP address.
  start_version:
    lineage:
      - datalake_amplitude_clean.events.start_version
    description: Application version installed when the user first opened the application.
  language:
    lineage:
      - datalake_amplitude_clean.events.language
    description: Device or browser language setting reported at event time.
  version_name:
    lineage:
      - datalake_amplitude_clean.events.version_name
    description: Current application version name active when the event was triggered.
  sample_rate:
    lineage:
      - datalake_amplitude_clean.events.sample_rate
    description: Amplitude ingestion sampling rate applied to the event (1.0 means no sampling).
  event_properties:
    lineage:
      - datalake_amplitude_clean.events.event_properties
    description: JSON object with custom event attributes sent by the application at track time.
  user_properties:
    lineage:
      - datalake_amplitude_clean.events.user_properties
    description: JSON object with persistent user-level attributes set by the application or Amplitude.
  is_paying:
    lineage:
      - datalake_amplitude_clean.events.is_paying
    description: Amplitude user property flag indicating whether the user is marked as paying in the project.
  is_attribution_event:
    lineage:
      - datalake_amplitude_clean.events.is_attribution_event
    description: Flag indicating whether Amplitude classified this event as part of an attribution window.
  ts_server_received:
    lineage:
      - datalake_amplitude_clean.events.ts_server_received
    description: Timestamp when Amplitude ingestion servers first received the event, in UTC.
  ts_event:
    lineage:
      - datalake_amplitude_clean.events.ts_event
    description: Canonical event timestamp used for analytics, typically client event time in UTC.
  ts_server_uploaded:
    lineage:
      - datalake_amplitude_clean.events.ts_server_uploaded
    description: Timestamp when the event was exported from Amplitude to the data lake ingestion pipeline.
  ts_user_created:
    lineage:
      - datalake_amplitude_clean.events.ts_user_created
    description: Timestamp when the Amplitude user profile was first created, in UTC.
  ts_client_event:
    lineage:
      - datalake_amplitude_clean.events.ts_client_event
    description: Timestamp when the event was recorded on the client device, in UTC.
  ts_client_uploaded:
    lineage:
      - datalake_amplitude_clean.events.ts_client_uploaded
    description: Timestamp when the mobile or web client uploaded the event batch to Amplitude servers.
  ts_processed:
    lineage:
      - datalake_amplitude_clean.events.ts_processed
    description: Timestamp when the event was processed in the ETL pipeline before landing in the clean layer.
  year:
    lineage:
      - datalake_amplitude_clean.events.year
    description: Column year from Amplitude events
  month:
    lineage:
      - datalake_amplitude_clean.events.month
    description: Column month from Amplitude events
  day:
    lineage:
      - datalake_amplitude_clean.events.day
    description: Column day from Amplitude events
owner: eduardo.soares@quintoandar.com.br
owner: bruna.prates@quintoandar.com.br
domain: House and Listing
description:
  This table contains offer_list_page_viewed events from app 183047. It tracks
  user interactions and includes relevant metadata and user properties.
