database_name: datalake_amplitude_clean
table_name: 233592_shortcut_more_visits_viewed_events
owner: guilherme.rocha@quintoandar.com.br
domain: For Sale
description:
  This table contains shortcut_more_visits_viewed events from app 233592.
  It tracks when users interact with shortcuts to view more property visits, capturing property suggestions,
  visit details, user context, and business metadata for analytics and user behavior analysis.
columns:
  id_user:
    lineage:
      - datalake_amplitude_clean.events.id_user
    description: Unique identifier for the user who triggered the shortcut more visits viewed event
  ids_suggestion_house:
    lineage:
      - datalake_amplitude_clean.events.event_properties
    description: List of suggested houses (id_house)
  visit_code:
    lineage:
      - datalake_amplitude_clean.events.event_properties
    description: Unique code identifying the visit associated with this event
  visit_status:
    lineage:
      - datalake_amplitude_clean.events.event_properties
    description: Current status of the visit when the shortcut was viewed
  business_context:
    lineage:
      - datalake_amplitude_clean.events.event_properties
    description: Business context of the visit interaction
  current_page:
    lineage:
      - datalake_amplitude_clean.events.event_properties
    description: Page where the user was located when they viewed the shortcut
  is_rent_agent:
    lineage:
      - datalake_amplitude_clean.events.user_properties
    description: Boolean flag indicating whether the user is a rental agent at the time of the event
  is_sale_agent:
    lineage:
      - datalake_amplitude_clean.events.user_properties
    description: Boolean flag indicating whether the user is a sales agent at the time of the event
  is_sale_3p:
    lineage:
      - datalake_amplitude_clean.events.user_properties
    description: Boolean flag indicating whether the user is a 3P sales agent or partner
  count_suggestion:
    lineage:
      - datalake_amplitude_clean.events.event_properties
    description: Total number of property suggestions presented to the user in the shortcut view
  ts_event:
    lineage:
      - datalake_amplitude_clean.events.ts_event
    description: Timestamp when the shortcut more visits viewed event occurred (UTC timezone)
  year:
    lineage:
      - datalake_amplitude_clean.events.year
    description: Year component of the event date, used for data partitioning
  month:
    lineage:
      - datalake_amplitude_clean.events.month
    description: Month component of the event date, used for data partitioning
  day:
    lineage:
      - datalake_amplitude_clean.events.day
    description: Day component of the event date, used for data partitioning
