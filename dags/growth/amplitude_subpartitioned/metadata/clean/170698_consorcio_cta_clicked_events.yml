database_name: datalake_amplitude_clean
table_name: 170698_consorcio_cta_clicked_events
columns:
  id_amplitude:
    lineage:
    - datalake_amplitude_clean.events.id_amplitude
    description: Primary Amplitude event identifier assigned by the analytics SDK for deduplication and event tracing.
  id_user:
    lineage:
    - datalake_amplitude_clean.events.id_user
    description: Id of the user from amplitude. Null if logged out
  id_device:
    lineage:
    - datalake_amplitude_clean.events.id_device
    description: Id of the device the user is navigating on the platform
  id_event:
    lineage:
    - datalake_amplitude_clean.events.id_event
    description: Amplitude insert identifier for the ingested row within the export batch.
  id_app:
    lineage:
    - datalake_amplitude_clean.events.id_app
    description: Id to where the event is triggered on amplitude
  id_session:
    lineage:
    - datalake_amplitude_clean.events.id_session
    description: Id of the session of the user when the event was triggered
  event_type:
    lineage:
    - datalake_amplitude_clean.events.event_type
    description: Name of the event triggered
  city:
    lineage:
    - datalake_amplitude_clean.events.city
    description: City name inferred by Amplitude from the client IP address at event time.
  country:
    lineage:
    - datalake_amplitude_clean.events.country
    description: ISO country code inferred by Amplitude from the client IP address at event time.
  ep_costumer_journey:
    lineage:
    - datalake_amplitude_clean.events.event_properties
    description: Event property that indicates the journey of the costumer
  ep_referrer:
    lineage:
    - datalake_amplitude_clean.events.event_properties
    description: Event property that indicates the referrer of the costumer
  ep_cta_position:
    lineage:
    - datalake_amplitude_clean.events.event_properties
    description: Event property that indicates the position of the "Simular Consorcio" button on the landing page
  ep_button_label:
    lineage:
      - datalake_amplitude_clean.events.event_properties
    description: Event property which contains the text written on the button when the user clicked on it
  ep_whatsapp:
    lineage:
      - datalake_amplitude_clean.events.event_properties
    description: Boolean event property that indicates if the click on the button redirects the user to whatsapp or not
  ep_entry_point:
    lineage:
      - datalake_amplitude_clean.events.event_properties
    description: Event property that indicates the entry point of the costumer
  ep_destination_url:
    lineage:
      - datalake_amplitude_clean.events.event_properties
    description: Event property that indicates to where the user was redirect after clicking on the cta
  ep_platform:
    lineage:
    - datalake_amplitude_clean.events.event_properties
    description: Event property that indicates in which platform the event was triggered
  ep_utm_source:
    lineage:
    - datalake_amplitude_clean.events.event_properties
    description: Event property that indicates the utm source of the event. Extracted from the uri property
  ep_utm_medium:
    lineage:
    - datalake_amplitude_clean.events.event_properties
    description: Event property that indicates the utm medium of the event. Extracted from the uri property
  ep_utm_campaign:
    lineage:
    - datalake_amplitude_clean.events.event_properties
    description: Event property that indicates the utm campaign of the event. Extracted from the uri property
  up_utm_source:
    lineage:
    - datalake_amplitude_clean.events.user_properties
    description: User property that indicates the utm source of the user when the event was triggered
  up_utm_medium:
    lineage:
    - datalake_amplitude_clean.events.user_properties
    description: User property that indicates the utm medium of the user when the event was triggered
  up_utm_campaign:
    lineage:
    - datalake_amplitude_clean.events.user_properties
    description: User property that indicates the utm campaign of the user when the event was triggered
  up_utm_content:
    lineage:
      - datalake_amplitude_clean.events.user_properties
    description: User property that indicates the content of the campaign sent to the user.
  up_utm_term:
    lineage:
      - datalake_amplitude_clean.events.user_properties
    description: User property that indicates the terms searched on google by the user before accessing the consorcio page.
  up_ab_beakman_consorcio_new_landing_page:
    lineage:
    - datalake_amplitude_clean.events.user_properties
    description: User property that indicates in which variant of the landing page the user was attributed to
  up_ab_beakman_consorcio_c2w_form:
    lineage:
      - datalake_amplitude_clean.events.user_properties
    description: User property that indicates in which variant of the click to whatsapp experiment the user was attributed to
  event_properties:
    lineage:
    - datalake_amplitude_clean.events.event_properties
    description: JSON object with custom event attributes sent by the application at track time.
  user_properties:
    lineage:
    - datalake_amplitude_clean.events.user_properties
    description: JSON object with persistent user-level attributes set by the application or Amplitude.
  ts_event:
    lineage:
    - datalake_amplitude_clean.events.ts_event
    description: Canonical event timestamp used for analytics, typically client event time in UTC.
  ts_server_uploaded:
    lineage:
    - datalake_amplitude_clean.events.ts_server_uploaded
    description: Timestamp when the event was exported from Amplitude to the data lake ingestion pipeline.
  ts_client_event:
    lineage:
    - datalake_amplitude_clean.events.ts_client_event
    description: Timestamp when the event was recorded on the client device, in UTC.
  ts_client_uploaded:
    lineage:
    - datalake_amplitude_clean.events.ts_client_uploaded
    description: Timestamp when the mobile or web client uploaded the event batch to Amplitude servers.
  ts_processed:
    lineage:
    - datalake_amplitude_clean.events.ts_processed
    description: Timestamp when the event was processed in the ETL pipeline before landing in the clean layer.
  year:
    lineage:
    - datalake_amplitude_clean.events.year
    description: Column year from Amplitude events
  month:
    lineage:
    - datalake_amplitude_clean.events.month
    description: Column month from Amplitude events
  day:
    lineage:
    - datalake_amplitude_clean.events.day
    description: Column day from Amplitude events
owner: conrado.fabri@quintoandar.com.br
domain: Growth
description: This table contains the cta click events on the landing page of the Consorcio, triggered on the app 170698. It tracks
  user interactions and includes relevant metadata and user properties.
