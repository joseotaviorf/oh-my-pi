database_name: datalake_amplitude_clean
table_name: 417002_datahub_browse_v2_select_node_events
owner: vitor.carneiro@quintoandar.com.br
domain: Data Ops & Governance
description: This table contains the 'Browse V2 Select Node' events from DataHub (Amplitude App ID 417002). It is triggered when a user selects or deselects a node in the V2 browse sidebar, replacing the legacy browse experience.
columns:
  id_amplitude:
    description: Amplitude user identifier
    lineage:
    - datalake_amplitude_clean.events.id_amplitude
  id_app:
    description: Amplitude application ID for the DataHub frontend (417002); identifies which product surface emitted the telemetry event.
    lineage:
    - datalake_amplitude_clean.events.id_app
  id_event:
    description: Unique Amplitude event instance identifier for this row; distinguishes individual UI interactions within a session.
    lineage:
    - datalake_amplitude_clean.events.id_event
  id_session:
    description: Amplitude session ID grouping consecutive user actions in the same browser session before timeout.
    lineage:
    - datalake_amplitude_clean.events.id_session
  id_inserted:
    description: Amplitude internal insertion identifier used for deduplication and ingestion ordering of exported events.
    lineage:
    - datalake_amplitude_clean.events.id_inserted
  id_user:
    description: User identifier (same as sk_user from the product database)
    lineage:
    - datalake_amplitude_clean.events.id_user
  city:
    description: City inferred by Amplitude geo-IP from the client at event time; may be null when location is unavailable.
    lineage:
    - datalake_amplitude_clean.events.city
  country:
    description: Country inferred by Amplitude geo-IP from the client at event time; ISO-style country name from SDK enrichment.
    lineage:
    - datalake_amplitude_clean.events.country
  event_type:
    description: Amplitude event type name for the DataHub UI interaction (e.g. EntityViewEvent, SearchEvent); defines which product event schema applies.
    lineage:
    - datalake_amplitude_clean.events.event_type
  target_node:
    description: The type of node targeted in the browse sidebar (e.g., browse or platform).
    lineage:
    - datalake_amplitude_clean.events.event_properties
  browse_action:
    description: The action performed on the node (select or deselect).
    lineage:
    - datalake_amplitude_clean.events.event_properties
  entity:
    description: The entity associated with the browse node.
    lineage:
    - datalake_amplitude_clean.events.event_properties
  environment:
    description: The environment context of the browse action.
    lineage:
    - datalake_amplitude_clean.events.event_properties
  platform:
    description: The platform associated with the browse node.
    lineage:
    - datalake_amplitude_clean.events.event_properties
  target_depth:
    description: The depth level of the target node in the browse tree hierarchy.
    lineage:
    - datalake_amplitude_clean.events.event_properties
  ts_event:
    description: Timestamp when the event was triggered
    lineage:
    - datalake_amplitude_clean.events.ts_event
  dt_event:
    description: Date when the event was triggered
    lineage:
    - datalake_amplitude_clean.events.ts_event
  year:
    description: Year when the data was received
    lineage:
    - datalake_amplitude_clean.events.year
  month:
    description: Month when the data was received
    lineage:
    - datalake_amplitude_clean.events.month
  day:
    description: Day when the data was received
    lineage:
    - datalake_amplitude_clean.events.day
