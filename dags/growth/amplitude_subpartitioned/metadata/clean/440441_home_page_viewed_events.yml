database_name: datalake_amplitude_clean
table_name: 440441_home_page_viewed_events
columns:
  id_amplitude:
    lineage:
    - datalake_amplitude_clean.events.id_amplitude
    description: Primary Amplitude event identifier assigned by the analytics SDK for deduplication and event tracing.
  id_event:
    lineage:
    - datalake_amplitude_clean.events.id_event
    description: Amplitude insert identifier for the ingested row within the export batch.
  id_user:
    lineage:
    - datalake_amplitude_clean.events.id_user
    description: Amplitude user identifier for cross-event identity stitching across sessions and devices.
  company_id:
    lineage:
    - datalake_amplitude_clean.events.company_id
    description: Analytics attribute 'company id' materialized in this subpartition for product funnel reporting and Growth enrich pipelines.
  email:
    lineage:
    - datalake_amplitude_clean.events.email
    description: Analytics attribute 'email' materialized in this subpartition for product funnel reporting and Growth enrich pipelines.
  login_status:
    lineage:
    - datalake_amplitude_clean.events.login_status
    description: Analytics attribute 'login status' materialized in this subpartition for product funnel reporting and Growth enrich pipelines.
  source:
    lineage:
    - datalake_amplitude_clean.events.source
    description: Analytics attribute 'source' materialized in this subpartition for product funnel reporting and Growth enrich pipelines.
  product:
    lineage:
    - datalake_amplitude_clean.events.product
    description: Analytics attribute 'product' materialized in this subpartition for product funnel reporting and Growth enrich pipelines.
  role:
    lineage:
    - datalake_amplitude_clean.events.role
    description: Analytics attribute 'role' materialized in this subpartition for product funnel reporting and Growth enrich pipelines.
  language:
