database_name: datalake_amplitude_clean
table_name: 233592_talk_to_the_owner_events
owner: guilherme.rocha@quintoandar.com.br
domain: For Sale
description:
  Amplitude clean extract for talk_to_the_owner events from app 233592.
  This event tracks click on the recommendation on the success screen (unsuccessful visit case).
columns:
  id_user:
    description: Unique identifier of the user (agent) associated with the talk to the owner event, cast to BIGINT.
    lineage:
      - datalake_amplitude_clean.events.id_user
  id_house:
    description: Identifier of the house in context for the interaction, extracted from event_properties house_id and cast to BIGINT.
    lineage:
      - datalake_amplitude_clean.events.event_properties
  visit_code:
    description: Visit code tying the event to a visit session, extracted from event_properties visit_code as string.
    lineage:
      - datalake_amplitude_clean.events.event_properties
  business_context:
    description: Business context label from event_properties business_context, normalized to uppercase for consistent categorical reporting.
    lineage:
      - datalake_amplitude_clean.events.event_properties
  source:
    description: Source dimension for where or how the talk-to-the-owner action was triggered, extracted from event_properties source.
    lineage:
      - datalake_amplitude_clean.events.event_properties
  ts_event:
    description: Timestamp when the talk_to_the_owner event was recorded in Amplitude.
    lineage:
      - datalake_amplitude_clean.events.ts_event
  year:
    description: Year component of the event date, used for table partitioning and incremental load windows.
    lineage:
      - datalake_amplitude_clean.events.year
  month:
    description: Month component of the event date, used for table partitioning and incremental load windows.
    lineage:
      - datalake_amplitude_clean.events.month
  day:
    description: Day component of the event date, used for table partitioning and incremental load windows.
    lineage:
      - datalake_amplitude_clean.events.day
