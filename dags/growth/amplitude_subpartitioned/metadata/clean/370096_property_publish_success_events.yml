database_name: datalake_amplitude_clean
table_name: 370096_property_publish_success_events
owner: bruna.prates@quintoandar.com.br
domain: For Sale
description: This table contains property_publish_success events from app 370096.
  It tracks successful property publications with house ID, user information and business context.
columns:
  id_house:
    lineage:
    - datalake_amplitude_clean.events.event_properties
    description: House ID extracted from event_properties.
  id_user:
    lineage:
    - datalake_amplitude_clean.events.id_user
    description: User ID from Amplitude events.
  business_context:
    lineage:
    - datalake_amplitude_clean.events.event_properties
    description: Business context extracted from event_properties, converted to uppercase.
  event_properties:
    lineage:
    - datalake_amplitude_clean.events.event_properties
    description: Raw event properties JSON from Amplitude events.
  ts_event:
    lineage:
    - datalake_amplitude_clean.events.ts_event
    description: Timestamp of the event.
  year:
    lineage:
    - datalake_amplitude_clean.events.year
    description: Year partition column.
  month:
    lineage:
    - datalake_amplitude_clean.events.month
    description: Month partition column.
  day:
    lineage:
    - datalake_amplitude_clean.events.day
    description: Day partition column.
