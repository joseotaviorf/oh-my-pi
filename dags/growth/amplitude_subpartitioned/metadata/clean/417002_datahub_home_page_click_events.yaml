database_name: datalake_amplitude_clean
table_name: 417002_datahub_home_page_click_events
owner: vitor.carneiro@quintoandar.com.br
domain: Data Ops & Governance
description: This table contains the 'Home Page Click' events from DataHub (Amplitude App ID 417002). It is triggered when a user clicks on an element in the V2 homepage, replacing the legacy recommendation impression/click events.
columns:
  id_amplitude:
    description: Amplitude user identifier
    lineage:
    - datalake_amplitude_clean.events.id_amplitude
  id_app:
    description: Id from the origin app
    lineage:
    - datalake_amplitude_clean.events.id_app
  id_event:
    description: Event identifier
    lineage:
    - datalake_amplitude_clean.events.id_event
  id_session:
    description: Session identifier
    lineage:
    - datalake_amplitude_clean.events.id_session
  id_inserted:
    description: Inserted identifier
    lineage:
    - datalake_amplitude_clean.events.id_inserted
  id_user:
    description: User identifier (same as sk_user from the product database)
    lineage:
    - datalake_amplitude_clean.events.id_user
  city:
    description: Amplitude city
    lineage:
    - datalake_amplitude_clean.events.city
  country:
    description: Amplitude country
    lineage:
    - datalake_amplitude_clean.events.country
  event_type:
    description: Event name
    lineage:
    - datalake_amplitude_clean.events.event_type
  homepage_module:
    description: Which homepage module was clicked (e.g., YouRecentlyViewed, Discover, Announcements, PersonalSidebar).
    lineage:
    - datalake_amplitude_clean.events.event_properties
  homepage_section:
    description: The section within the homepage module where the click occurred.
    lineage:
    - datalake_amplitude_clean.events.event_properties
  homepage_sub_section:
    description: The sub-section within the homepage section where the click occurred.
    lineage:
    - datalake_amplitude_clean.events.event_properties
  click_value:
    description: The clicked entity URN or action label.
    lineage:
    - datalake_amplitude_clean.events.event_properties
  ts_event:
    description: Timestamp when the event was triggered
    lineage:
    - datalake_amplitude_clean.events.ts_event
  dt_event:
    description: Date when the event was triggered
    lineage:
    - datalake_amplitude_clean.events.ts_event
  year:
    description: Year when the data was received
    lineage:
    - datalake_amplitude_clean.events.year
  month:
    description: Month when the data was received
    lineage:
    - datalake_amplitude_clean.events.month
  day:
    description: Day when the data was received
    lineage:
    - datalake_amplitude_clean.events.day
