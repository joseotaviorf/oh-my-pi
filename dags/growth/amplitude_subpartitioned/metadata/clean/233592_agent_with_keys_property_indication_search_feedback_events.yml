database_name: datalake_amplitude_clean
table_name: 233592_agent_with_keys_property_indication_search_feedback_events
owner: guilherme.rocha@quintoandar.com.br
domain: For Sale
description: Tracks search feedback events from agents with keys during property indication processes.
columns:
  id_user:
    description: Unique identifier of the agent user who provided search feedback.
    lineage:
      - datalake_amplitude_clean.events.id_user
  id_house:
    description: Identifier of the property related to the search feedback during indication.
    lineage:
      - datalake_amplitude_clean.events.event_properties.house_id
  feedback_search_type:
    description: Type of search feedback provided by the agent during the property indication process.
    lineage:
      - datalake_amplitude_clean.events.event_properties.feedback_search_type
  ts_event:
    description: Timestamp when the search feedback event occurred.
    lineage:
      - datalake_amplitude_clean.events.ts_event
  year:
    description: Year component of the event timestamp, used for efficient data partitioning and time-based filtering.
    lineage:
      - datalake_amplitude_clean.events.year
  month:
    description: Month component of the event timestamp, used for efficient data partitioning and time-based filtering.
    lineage:
      - datalake_amplitude_clean.events.month
  day:
    description: Day component of the event timestamp, used for efficient data partitioning and time-based filtering.
    lineage:
      - datalake_amplitude_clean.events.day
