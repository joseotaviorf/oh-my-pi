database_name: datalake_amplitude_clean
table_name: 233592_shortcut_more_visits_success_page_viewed_events
owner: guilherme.rocha@quintoandar.com.br
domain: For Sale
description:
  This table contains shortcut_more_visits_success_page_viewed events from app 233592.
  It tracks when users view the success page after completing the shortcut flow for viewing more property visits,
  capturing the final step in the conversion funnel and measuring successful completion rates of the shortcut feature.
columns:
  id_user:
    lineage:
      - datalake_amplitude_clean.events.id_user
    description: Unique identifier for the user who viewed the success page indicating successful shortcut completion
  ids_suggestion_house:
    lineage:
      - datalake_amplitude_clean.events.event_properties
    description: List of suggested houses (id_house)
  visit_code:
    lineage:
      - datalake_amplitude_clean.events.event_properties
    description: Unique code identifying the visit associated with the success page being viewed
  visit_status:
    lineage:
      - datalake_amplitude_clean.events.event_properties
    description: Status of the visit at the time the success page was viewed
  business_context:
    lineage:
      - datalake_amplitude_clean.events.event_properties
    description: Business context of the visit when the success page was viewed
  current_page:
    lineage:
      - datalake_amplitude_clean.events.event_properties
    description: Page where the user was located when the success page was viewed
  is_rent_agent:
    lineage:
      - datalake_amplitude_clean.events.user_properties
    description: Boolean flag indicating whether the user is a rental agent when viewing the success page
  is_sale_agent:
    lineage:
      - datalake_amplitude_clean.events.user_properties
    description: Boolean flag indicating whether the user is a sales agent when viewing the success page
  is_sale_3p:
    lineage:
      - datalake_amplitude_clean.events.user_properties
    description: Boolean flag indicating whether the user is a 3P sales agent when viewing the success page
  count_suggestion:
    lineage:
      - datalake_amplitude_clean.events.event_properties
    description: Total number of property suggestions displayed on the success page that was viewed
  ts_event:
    lineage:
      - datalake_amplitude_clean.events.ts_event
    description: Timestamp when the success page was viewed by the user (UTC timezone)
  year:
    lineage:
      - datalake_amplitude_clean.events.year
    description: Year component of the event date, used for data partitioning
  month:
    lineage:
      - datalake_amplitude_clean.events.month
    description: Month component of the event date, used for data partitioning
  day:
    lineage:
      - datalake_amplitude_clean.events.day
    description: Day component of the event date, used for data partitioning
