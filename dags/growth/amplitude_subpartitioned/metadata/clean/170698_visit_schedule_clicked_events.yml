database_name: datalake_amplitude_clean
table_name: 170698_visit_schedule_clicked_events
owner: guilherme.rocha@quintoandar.com.br
domain: For Sale
description: This table contains visit_schedule_clicked events from app 170698.
  It tracks user interactions and includes relevant metadata and user properties.
columns:
  uuid_event:
    lineage:
      - datalake_amplitude_clean.events.uuid
    description: Unique identifier for the triggered event.
  id_user:
    lineage:
      - datalake_amplitude_clean.events.id_user
    description: Unique identifier for the user who triggered the visit schedule click event.
  id_house:
    lineage:
      - datalake_amplitude_clean.events.event_properties
    description: House identifier extracted from event_properties JSON field using get_json_object function.
  business_context:
    lineage:
      - datalake_amplitude_clean.events.event_properties
    description: Business context information extracted from event_properties JSON field using get_json_object function.
  agent_assignment_type_options:
    lineage:
      - datalake_amplitude_clean.events.event_properties
    description: Information regarding the agents types available to accompany the visit, extracted from event_properties JSON field using get_json_object function.
  agent_assignment_type:
    lineage:
      - datalake_amplitude_clean.events.event_properties
    description: Information regarding the chosen agent type to accompany the visit, extracted from event_properties JSON field using get_json_object function.
  nbr_days_available:
    lineage:
      - datalake_amplitude_clean.events.event_properties
    description: Number of days available extracted from event_properties JSON field using get_json_object function.
  nbr_hours_available:
    lineage:
      - datalake_amplitude_clean.events.event_properties
    description: Number of hours available extracted from event_properties JSON field using get_json_object function.
  login_status:
    lineage:
      - datalake_amplitude_clean.events.user_properties
    description: user login status extracted from user_properties JSON field using get_json_object function.
  dt_schedule:
    lineage:
      - datalake_amplitude_clean.events.event_properties
    description: Scheduled date extracted from event_properties JSON field using get_json_object function.
  hour_schedule_started:
    lineage:
      - datalake_amplitude_clean.events.event_properties
    description: Scheduled hour started extracted from event_properties JSON field using get_json_object function.
  hour_schedule_ended:
    lineage:
      - datalake_amplitude_clean.events.event_properties
    description: Scheduled hour ended extracted from event_properties JSON field using get_json_object function.
  ts_event:
    lineage:
      - datalake_amplitude_clean.events.ts_event
    description: Timestamp when the visit schedule click event occurred
  year:
    lineage:
      - datalake_amplitude_clean.events.year
    description: Year partition column for efficient data partitioning and query performance.
  month:
    lineage:
      - datalake_amplitude_clean.events.month
    description: Month partition column for efficient data partitioning and query performance.
  day:
    lineage:
      - datalake_amplitude_clean.events.day
    description: Day partition column for efficient data partitioning and query performance.
