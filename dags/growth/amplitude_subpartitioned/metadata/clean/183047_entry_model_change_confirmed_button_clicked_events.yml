database_name: datalake_amplitude_clean
table_name: 183047_entry_model_change_confirmed_button_clicked_events
owner: guilherme.rocha@quintoandar.com.br
domain: For Sale
description: Tracks when users click the confirmation button to finalize changes to property entry model settings.
columns:
  id_user:
    description: Unique identifier of the owner who clicked the entry model change confirmation button.
    lineage:
      - datalake_amplitude_clean.events.id_user
  id_house:
    description: Identifier of the property for which the entry model change is being confirmed.
    lineage:
      - datalake_amplitude_clean.events.event_properties.house_id
  key_location:
    description: Current location where the property keys are stored.
    lineage:
      - datalake_amplitude_clean.events.event_properties.key_location
  source:
    description: Source from which the entry model change confirmation was initiated.
    lineage:
      - datalake_amplitude_clean.events.event_properties.source
  business_context:
    description: Indicates whether the tracked action relates to Rent, Sale, or another QuintoAndar product line parsed from the analytics payload.
    lineage:
      - datalake_amplitude_clean.events.event_properties.business_context
  key_location_changed:
    description: Boolean flag indicating whether the key location was actually changed as part of this confirmation.
    lineage:
      - datalake_amplitude_clean.events.event_properties.key_location_changed
  ts_event:
    description: Timestamp when the entry model change confirmation button click event occurred.
    lineage:
      - datalake_amplitude_clean.events.ts_event
  year:
    description: Year component of the event timestamp, used for efficient data partitioning and time-based filtering.
    lineage:
      - datalake_amplitude_clean.events.year
  month:
    description: Month component of the event timestamp, used for efficient data partitioning and time-based filtering.
    lineage:
      - datalake_amplitude_clean.events.month
  day:
    description: Day component of the event timestamp, used for efficient data partitioning and time-based filtering.
    lineage:
      - datalake_amplitude_clean.events.day
