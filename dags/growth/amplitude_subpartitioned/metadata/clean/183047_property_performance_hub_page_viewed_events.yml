database_name: datalake_amplitude_clean
table_name: 183047_property_performance_hub_page_viewed_events
owner: bruna.prates@quintoandar.com.br
domain: Growth
description: |
  Page view events for the Property Performance Hub in the QuintoAndar owner app (Amplitude app 183047).
  One row per hub impression with property performance metrics, pricing benchmarks, score feedback, and
  Beakman experiment flags from event_properties and user_properties. Materialized as an incremental
  subpartition of datalake_amplitude_clean.events filtered by event_type =
  'property_performance_hub_page_viewed'. Partitioned by year, month, and day — always filter on all
  three partition columns in WHERE clauses to enable partition pruning; align filters with ts_event.
columns:
  id_amplitude:
    lineage:
    - datalake_amplitude_clean.events.id_amplitude
    description: Unique Amplitude identifier for this specific event record. Used as primary key for event tracking and deduplication.
  ids_amplitude_attributed:
    lineage:
    - datalake_amplitude_clean.events.ids_amplitude_attributed
    description: Amplitude user identifier after attribution processing. Links events to users after processing marketing attribution data.
  id_house:
    lineage:
    - datalake_amplitude_clean.events.event_properties
    description: Unique identifier for the property/house whose performance hub page was viewed. Extracted from event properties.
  id_user:
    lineage:
    - datalake_amplitude_clean.events.id_user
    description: Unique user identifier within the QuintoAndar platform. Links events to specific users across sessions.
  id_device:
    lineage:
    - datalake_amplitude_clean.events.id_device
    description: Unique device identifier assigned by Amplitude. Tracks user behavior across app sessions on the same device.
  id_event:
    lineage:
    - datalake_amplitude_clean.events.id_event
    description: Unique event identifier within Amplitude system. Sequential number for tracking event order and preventing duplicates.
  id_app:
    lineage:
    - datalake_amplitude_clean.events.id_app
    description: Application identifier in Amplitude (183047 = QuintoAndar app). Distinguishes events from different applications or environments.
  uuid:
    lineage:
    - datalake_amplitude_clean.events.uuid
    description: Universally unique identifier for the event. Alternative unique key used for event identification and correlation.
  adid:
    lineage:
    - datalake_amplitude_clean.events.adid
    description: Android Advertising ID. Used for attribution tracking on Android devices. Value is null due to privacy processing but attribution data is retained.
  id_session:
    lineage:
    - datalake_amplitude_clean.events.id_session
    description: Unique session identifier. Groups related events within the same user session/app usage period.
  id_schema:
    lineage:
    - datalake_amplitude_clean.events.id_schema
    description: Schema version identifier for the event structure. Used for data versioning and compatibility tracking.
  id_inserted:
    lineage:
    - datalake_amplitude_clean.events.id_inserted
    description: Insertion batch identifier. Tracks when this event record was inserted into the data pipeline.
  idfa:
    lineage:
    - datalake_amplitude_clean.events.idfa
    description: iOS Identifier for Advertisers. Used for attribution tracking on iOS devices. Value is null due to privacy processing but attribution data is retained.
  event_type:
    lineage:
    - datalake_amplitude_clean.events.event_type
    description: Name of the event action performed by the user ('property_performance_hub_page_viewed'). Tracks when users view the property performance dashboard.
  amplitude_event_type:
    lineage:
    - datalake_amplitude_clean.events.amplitude_event_type
    description: Amplitude's internal event type classification. May differ from event_type for system events or special handling.
  up_ab_beakman_owner_house_setup:
    lineage:
    - datalake_amplitude_clean.events.user_properties
    description: A/B test feature flag for house setup experiment. Controls owner onboarding flow variations and setup process optimization.
  up_rc_beakman_owners_listing_performance_rent_toggle:
    lineage:
    - datalake_amplitude_clean.events.user_properties
    description: A/B test feature flag for listing performance experiment (Wave 0) in rental flow. Controls performance dashboard features for rental properties.
  up_rc_beakman_owners_listing_performance_sale_toggle:
    lineage:
    - datalake_amplitude_clean.events.user_properties
    description: A/B test feature flag for listing performance experiment (Wave 0) in sale flow. Controls performance dashboard features for sale properties.
  up_rc_beakman_owners_listing_performance_show_score_hybrid_toggle:
    lineage:
    - datalake_amplitude_clean.events.user_properties
    description: A/B test feature flag indicating whether the session is active for the new performance score test in performance hub for hybrid listings.
  up_rc_beakman_owners_listing_performance_show_score_sale_toggle:
    lineage:
    - datalake_amplitude_clean.events.user_properties
    description: A/B test feature flag indicating whether the session is active for the new performance score test.
  up_rc_beakman_owners_listing_performance_wave_one_rent_toggle:
    lineage:
    - datalake_amplitude_clean.events.user_properties
    description: A/B test feature flag for listing performance experiment (Wave 1) in rental flow. Enhanced version of performance dashboard for rental properties.
  up_rc_beakman_owners_listing_performance_wave_one_sale_toggle:
    lineage:
    - datalake_amplitude_clean.events.user_properties
    description: A/B test feature flag for listing performance experiment (Wave 1) in sale flow. Enhanced version of performance dashboard for sale properties.
  up_rc_beakman_owners_listing_performance_wave_one_hybrid_toggle:
    lineage:
    - datalake_amplitude_clean.events.user_properties
    description: A/B test feature flag for listing performance experiment (Wave 1) on hybrid properties. Controls enhanced performance hub for properties with both rent/sale options.
  ep_business_context:
    lineage:
    - datalake_amplitude_clean.events.event_properties
    description: Business context of the property whose performance hub was viewed.  'RENT' (rental properties) or 'SALE' (properties for sale).
  ep_content_business_context:
    lineage:
    - datalake_amplitude_clean.events.event_properties
    description: Content-specific business context for the performance hub display.  'RENT' or 'SALE', may differ from main business context for hybrid properties.
  ep_main_message:
    lineage:
    - datalake_amplitude_clean.events.event_properties
    description: Main performance message displayed to the user in the hub. Text content providing feedback about property performance and suggestions.
  ep_score_number:
    lineage:
    - datalake_amplitude_clean.events.event_properties
    description: Performance score displayed to the user. Values 1-5 (performance rating) or 'calculando' (calculating). Key metric for property performance assessment.
  ep_price_top_button_shown:
    lineage:
    - datalake_amplitude_clean.events.event_properties
    description: Boolean flag indicating whether the price adjustment button was displayed in the top section of the performance hub.
  ep_available_hours_top_button_shown:
    lineage:
    - datalake_amplitude_clean.events.event_properties
    description: Boolean flag indicating whether the available hours management button was displayed in the top section of the performance hub.
  ep_ad_pageviews:
    lineage:
    - datalake_amplitude_clean.events.event_properties
    description: Total count of pageviews for this property listing. Key performance metric displayed in the hub for tracking property visibility.
  ep_ad_pageviews_feedback:
    lineage:
    - datalake_amplitude_clean.events.event_properties
    description: Visual feedback about pageviews performance compared to similar listings. Values 'green' (good), 'red' (needs improvement), or null (not displayed).
  ep_ad_visits_booked:
    lineage:
    - datalake_amplitude_clean.events.event_properties
    description: Total count of visits/viewings booked for this property. Key conversion metric displayed in the performance hub.
  ep_house_price:
    lineage:
    - datalake_amplitude_clean.events.event_properties
    description: Current listing price of the property in Brazilian Reais (BRL). Displayed in the performance hub for price optimization context.
  ep_price_recommended_feedback:
    lineage:
    - datalake_amplitude_clean.events.event_properties
    description: Visual feedback about current pricing strategy based on market analysis. Color-coded recommendations (green/yellow/red) to guide pricing decisions.
  ep_range_min_suggested:
    lineage:
    - datalake_amplitude_clean.events.event_properties
    description: Lower limit of the price range suggested by QuintoAndar's pricing algorithm. Minimum recommended price in BRL for optimal performance.
  ep_range_max_suggested:
    lineage:
    - datalake_amplitude_clean.events.event_properties
    description: Upper limit of the price range suggested by QuintoAndar's pricing algorithm. Maximum recommended price in BRL for optimal performance.
  ep_ideal_price:
    lineage:
    - datalake_amplitude_clean.events.event_properties
    description: Optimal price suggested by QuintoAndar's pricing calculator algorithm. Sweet spot price in BRL for maximizing performance and conversion.
  ep_average_price_similar_houses_on_market:
    lineage:
    - datalake_amplitude_clean.events.event_properties
    description: Average listing price of similar properties currently available on the market. Benchmark for competitive pricing analysis in BRL.
  ep_average_price_similar_houses_converted:
    lineage:
    - datalake_amplitude_clean.events.event_properties
    description: Average price of similar properties that successfully closed (rented or sold). Market validation price in BRL for realistic expectations.
  ep_average_price_similar_condo_houses_on_market:
    lineage:
    - datalake_amplitude_clean.events.event_properties
    description: Average price of similar properties in the same condominium/building currently on the market. Hyper-local competitive pricing benchmark in BRL.
  ep_average_price_similar_condo_houses_converted:
    lineage:
    - datalake_amplitude_clean.events.event_properties
    description: Average price of similar properties in the same condominium/building that successfully closed. Hyper-local market validation price in BRL.
  ep_price_card_shown:
    lineage:
    - datalake_amplitude_clean.events.event_properties
    description: Boolean flag indicating whether the price optimization tips card was displayed at the bottom of the performance hub page.
  ep_available_hours_card_shown:
    lineage:
    - datalake_amplitude_clean.events.event_properties
    description: Boolean flag indicating whether the available hours optimization tips card was displayed at the bottom of the performance hub page.
  city:
    lineage:
    - datalake_amplitude_clean.events.city
    description: User's city location derived from IP geolocation. Used for geographic analysis and content personalization.
  country:
    lineage:
    - datalake_amplitude_clean.events.country
    description: User's country location derived from IP geolocation. Primarily 'Brazil' for QuintoAndar users but may include other countries.
  data:
    lineage:
    - datalake_amplitude_clean.events.data
    description: Raw event data payload from Amplitude. Contains the complete event information as received from the client application.
  device_brand:
    lineage:
    - datalake_amplitude_clean.events.device_brand
    description: Brand of the user's device (e.g., 'Apple', 'Samsung', 'Xiaomi'). Used for device-specific analytics and user experience optimization.
  device_carrier:
    lineage:
    - datalake_amplitude_clean.events.device_carrier
    description: Mobile carrier/network provider of the user's device (e.g., 'Vivo', 'Tim', 'Claro'). Helpful for network performance analysis.
  device_family:
    lineage:
    - datalake_amplitude_clean.events.device_family
    description: Device family classification (e.g., 'Apple iPhone', 'Samsung Galaxy', 'iPad'). Groups related devices for compatibility analysis.
  device_manufacturer:
    lineage:
    - datalake_amplitude_clean.events.device_manufacturer
    description: Manufacturer of the user's device (e.g., 'Apple', 'Samsung', 'Google'). Used for device support and compatibility tracking.
  device_model:
    lineage:
    - datalake_amplitude_clean.events.device_model
    description: Specific model of the user's device (e.g., 'iPhone 14', 'Galaxy S23', 'Pixel 7'). Used for device-specific feature support.
  device_type:
    lineage:
    - datalake_amplitude_clean.events.device_type
    description: Type category of the device (e.g., 'Mobile', 'Tablet', 'Desktop'). Determines the user interface and interaction patterns.
  dma:
    lineage:
    - datalake_amplitude_clean.events.dma
    description: Designated Market Area - geographic region identifier used for location-based analytics and content targeting (e.g., 'São Paulo-Campinas, BR').
  ip_address:
    lineage:
    - datalake_amplitude_clean.events.ip_address
    description: IP address of the user's device. Used for geolocation, security analysis, and fraud detection. May be anonymized for privacy.
  location_lat:
    lineage:
    - datalake_amplitude_clean.events.location_lat
    description: Latitude coordinate of the user's location derived from IP geolocation. Used for geographic analysis and location-based features.
  location_lng:
    lineage:
    - datalake_amplitude_clean.events.location_lng
    description: Longitude coordinate of the user's location derived from IP geolocation. Used for geographic analysis and location-based features.
  os_name:
    lineage:
    - datalake_amplitude_clean.events.os_name
    description: Operating system name (e.g., 'iOS', 'Android', 'Windows'). Used for platform-specific analytics and feature compatibility.
  os_version:
    lineage:
    - datalake_amplitude_clean.events.os_version
    description: Operating system version (e.g., 'iOS 16.1', 'Android 13'). Important for feature support and compatibility analysis.
  platform:
    lineage:
    - datalake_amplitude_clean.events.platform
    description: Platform identifier (e.g., 'iOS', 'Android', 'Web'). Distinguishes between different application platforms and user experiences.
  library:
    lineage:
    - datalake_amplitude_clean.events.library
    description: Amplitude SDK library version used to send the event (e.g., 'amplitude-ios/8.1.0', 'amplitude-android/3.5.0'). Used for tracking SDK versions and debugging.
  region:
    lineage:
    - datalake_amplitude_clean.events.region
    description: Geographic region/state derived from IP geolocation (e.g., 'São Paulo', 'Rio de Janeiro'). Used for regional analysis and content localization.
  start_version:
    lineage:
    - datalake_amplitude_clean.events.start_version
    description: App version when the user first installed or started using the application. Tracks user cohorts by initial app version.
  language:
    lineage:
    - datalake_amplitude_clean.events.language
    description: Language setting of the user's device or app interface (e.g., 'pt-BR', 'en-US'). Used for localization analysis and content personalization.
  version_name:
    lineage:
    - datalake_amplitude_clean.events.version_name
    description: Current app version name (e.g., '5.2.1', '6.0.0'). Tracks feature adoption and performance across different app versions.
  sample_rate:
    lineage:
    - datalake_amplitude_clean.events.sample_rate
    description: Sampling rate applied to event collection (0.0 to 1.0). Value of 1.0 means all events captured, 0.5 means 50% sampling. Critical for data volume extrapolation.
  event_properties:
    lineage:
    - datalake_amplitude_clean.events.event_properties
    description: JSON object containing event-specific custom properties. Includes comprehensive performance metrics, pricing data, and contextual information about the property performance hub view.
  user_properties:
    lineage:
    - datalake_amplitude_clean.events.user_properties
    description: JSON object containing user-level properties and attributes. Includes persistent user characteristics, A/B test assignments, and user segments.
  is_paying:
    lineage:
    - datalake_amplitude_clean.events.is_paying
    description: Boolean flag indicating if the user is a paying customer. Set to true at first revenue event and persists thereafter. Used for customer segment analysis and monetization tracking.
  is_attribution_event:
    lineage:
    - datalake_amplitude_clean.events.is_attribution_event
    description: Boolean flag indicating if this event is used for marketing attribution analysis. Helps distinguish conversion events from regular behavioral events.
  ts_server_received:
    lineage:
    - datalake_amplitude_clean.events.ts_server_received
    description: Timestamp when Amplitude servers received the event from the client. Used for measuring network latency and data freshness.
  ts_event:
    lineage:
    - datalake_amplitude_clean.events.ts_event
    description: Timestamp when the property performance hub page was viewed. Primary timestamp for event ordering and time-based analysis.
  ts_server_uploaded:
    lineage:
    - datalake_amplitude_clean.events.ts_server_uploaded
    description: Timestamp when the event data was uploaded to Amplitude's processing systems. Used for data pipeline monitoring.
  ts_user_created:
    lineage:
    - datalake_amplitude_clean.events.ts_user_created
    description: Timestamp when the user account was first created in the system. Used for user lifecycle and cohort analysis.
  ts_client_event:
    lineage:
    - datalake_amplitude_clean.events.ts_client_event
    description: Client-side timestamp when the event was triggered. May differ from ts_event due to device clock differences.
  ts_client_uploaded:
    lineage:
    - datalake_amplitude_clean.events.ts_client_uploaded
    description: Client-side timestamp when the event was sent to Amplitude servers. Used for offline event handling analysis.
  ts_processed:
    lineage:
    - datalake_amplitude_clean.events.ts_processed
    description: Timestamp when the event was processed and enriched by Amplitude systems. Final processing step before data availability.
  year:
    lineage:
    - datalake_amplitude_clean.events.year
    description: |
      Table partition column (year). Derived from ts_event at clean ingestion. Required in WHERE clauses
      for partition pruning — always combine with month and day to restrict scans to the smallest date
      window needed.
  month:
    lineage:
    - datalake_amplitude_clean.events.month
    description: |
      Table partition column (month, 1–12). Derived from ts_event at clean ingestion. Must be filtered
      together with year and day in every query to enable partition pruning.
  day:
    lineage:
    - datalake_amplitude_clean.events.day
    description: |
      Table partition column (day, 1–31). Derived from ts_event at clean ingestion. Always filter with
      year and month. Example: WHERE year = 2026 AND month = 6 AND day BETWEEN 1 AND 7.
