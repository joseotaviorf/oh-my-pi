database_name: datalake_amplitude_clean
table_name: 283048_register_form_completed_events
description: This table contains register_form_completed events from app 283048.
domain: Agents
owner: gustavo.rompe@quintoandar.com.br
columns:
  id_amplitude:
    lineage:
    - datalake_amplitude_clean.events.id_amplitude
    description: Primary Amplitude event identifier assigned by the analytics SDK for deduplication and event tracing.
  id_event:
    lineage:
    - datalake_amplitude_clean.events.id_event
    description: Amplitude insert identifier for the ingested row within the export batch.
  id_device:
    lineage:
    - datalake_amplitude_clean.events.id_device
    description: Amplitude-generated device identifier used to stitch sessions on the same physical device.
  user_country:
    lineage:
    - datalake_amplitude_clean.events.country
    description: Country name inferred by Amplitude from the client IP address at event time.
  country_code:
    lineage:
    - datalake_amplitude_clean.events.user_properties
    description: Country code from user_properties.country
  utm_campaign:
    lineage:
    - datalake_amplitude_clean.events.user_properties
    description: UTM campaign from user_properties.utm_campaign
  utm_medium:
    lineage:
    - datalake_amplitude_clean.events.user_properties
    description: UTM medium from user_properties.utm_medium
  utm_source:
    lineage:
    - datalake_amplitude_clean.events.user_properties
    description: UTM source from user_properties.utm_source
  user_properties:
    lineage:
    - datalake_amplitude_clean.events.user_properties
    description: JSON object with persistent user-level attributes set by the application or Amplitude.
  ts_event:
    lineage:
    - datalake_amplitude_clean.events.ts_event
    description: Canonical event timestamp used for analytics, typically client event time in UTC.
  year:
    lineage:
    - datalake_amplitude_clean.events.year
    description: Table partition column (year). Derived from ts_event at clean ingestion. Required in WHERE clauses for partition pruning — always combine with month and day to restrict scans to the smallest date window needed.
  month:
    lineage:
    - datalake_amplitude_clean.events.month
    description: Table partition column (month, 1–12). Derived from ts_event at clean ingestion. Must be filtered together with year and day to avoid full-table scans on this high-volume events subpartition.
  day:
    lineage:
    - datalake_amplitude_clean.events.day
    description: Table partition column (day, 1–31). Derived from ts_event at clean ingestion. Always filter with year and month — last partition column in the table layout.
