dag:
  name: olos_dialer
  owner: Data Growth
  schedule_start_date: 2023, 1, 1
  schedule_interval: "50 0,7-19 * * *"
  documentation:
    dag_purpose: |
      Ingest Olos dialer JSON from S3 into raw and clean layers for outbound contact analytics.
      See dags/growth/olos_dialer/olos_dialer.md for context and upstream documentation links.
workflow:
  type: custom_ingestion
  layer: raw
  load_spark_job: load_olos_dialer_raw
  default_extraction_type: incremental
  default_partitions: [year, month, day]
  has_hive_sync: false
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, 1), 'load_end_date') }}"
  spark_job_arguments:
    - "{environment}"
    - "{bucket}"
    - "{dag_name}"
    - "{load_start_date}"
    - "{load_end_date}"
    - "{table_name}"
  tables_customization:
    AgentSupervisor:
      clean_table_name: agent_supervisor
    AgentStateRawData:
      clean_table_name: agent_state_raw_data
    AttemptsRawData:
      clean_table_name: attempts_raw_data
    Campaign:
      clean_table_name: campaign
    CampaignCustomer:
      clean_table_name: campaign_customer
    ConfigReasons:
      clean_table_name: config_reasons
    Customer:
      clean_table_name: customer
    Disposition:
      clean_table_name: disposition
    DispositionDetail:
      clean_table_name: disposition_detail
    DispositionPlan:
      clean_table_name: disposition_plan
    Info_AgentStatus:
      clean_table_name: info_agent_status
    Info_CallDirection:
      clean_table_name: info_call_direction
    Info_CampaignType:
      clean_table_name: info_campaign_type
    Info_DispositionType:
      clean_table_name: info_disposition_type
    Info_PbxDisposition:
      clean_table_name: info_pbx_disposition
    Info_ReasonType:
      clean_table_name: info_reason_type
    Info_StatusId:
      clean_table_name: info_status_id
    LoginRawData:
      clean_table_name: login_raw_data
    MailingInformation:
      clean_table_name: mailing_information
    OPS_Mailing_LayoutId_4:
      clean_table_name: reprocessing_mailing
    OPS_Mailing_LayoutId_7:
      clean_table_name: pp_multi_mailing
    PbxBillingData:
      clean_table_name: pbx_billing_data
    QUINTO_ANDAR_20200505_Mailing:
      clean_table_name: mailing
    Reason:
      clean_table_name: reason
    Users:
      clean_table_name: users
