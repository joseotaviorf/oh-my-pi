---
database_name: datalake_olos_dialer_clean
table_name: info_pbx_disposition
owner: henrique.paulo@quintoandar.com.br
domain: Growth
description: |
  Olos lookup dimension mapping PBX-level disposition codes to labels for telephony system
  outcome classification. Used alongside attempt records for call-result analytics and billing
  reconciliation. Partitioned by `year`, `month`, `day`.
columns:
  id_pbx_disposition:
    description: Numeric code assigned by the telephony PBX to each call outcome, used to join this lookup to PBX billing and attempt records.
    lineage:
      - datalake_olos_dialer_raw.info_pbxdisposition.pbxdispositionid
  description:
    description: Human-readable label for the PBX-level call outcome (e.g., answered, failed, abandoned), used to reconcile telephony results with dialer dispositions.
    lineage:
      - datalake_olos_dialer_raw.info_pbxdisposition.description
  year:
    description: Year component of the record date, used as a partition key to enable efficient querying by date range.
    lineage:
      - datalake_olos_dialer_raw.info_pbxdisposition.year
  month:
    description: Month component of the record date, used as a partition key to enable efficient querying by date range.
    lineage:
      - datalake_olos_dialer_raw.info_pbxdisposition.month
  day:
    description: Day component of the record date, used as a partition key to enable efficient querying by date range.
    lineage:
      - datalake_olos_dialer_raw.info_pbxdisposition.day
