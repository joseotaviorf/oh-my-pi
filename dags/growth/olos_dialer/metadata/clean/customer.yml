---
database_name: datalake_olos_dialer_clean
table_name: customer
owner: henrique.paulo@quintoandar.com.br
domain: Growth
description: |
  Customer and contact master records in the Olos dialer with identifiers and attributes used
  to route outbound calls to property-owner leads. Synced daily from Olos S3 JSON exports.
  Partitioned by `year`, `month`, `day`.
columns:
  id_customer:
    description: Unique identifier of the customer.
    lineage:
      - datalake_olos_dialer_raw.customer.customerid
  id_customer_code:
    description: Unique identifier of the customer code.
    lineage:
      - datalake_olos_dialer_raw.customer.customercode
  name:
    description: Organization or business unit name configured in Olos Dialer for the campaign.
    lineage:
      - datalake_olos_dialer_raw.customer.name
  is_activated:
    description: Indicates whether the Olos Dialer configuration record is currently active and selectable.
    lineage:
      - datalake_olos_dialer_raw.customer.activated
  year:
    description: Partition column for the year of the record.
    lineage:
      - datalake_olos_dialer_raw.customer.year
  month:
    description: Partition column for the month of the record.
    lineage:
      - datalake_olos_dialer_raw.customer.month
  day:
    description: Partition column for the day of the record.
    lineage:
      - datalake_olos_dialer_raw.customer.day
