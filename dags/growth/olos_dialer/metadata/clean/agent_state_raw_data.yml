---
database_name: datalake_olos_dialer_clean
table_name: agent_state_raw_data
owner: henrique.paulo@quintoandar.com.br
domain: Growth
description: |
  Agent state transition events from the Olos outbound dialer (login, pause, wrap-up, available).
  One row per state change per agent per daily load, ingested from S3 JSON via the `olos_dialer` DAG.
  Used by Growth contact-center analytics for analyst productivity and dialer operations monitoring.
  Partitioned by `year`, `month`, `day`.
columns:
  id_agent:
    description: References the dialer agent whose status changed, used to link state events to workforce records.
    lineage:
      - datalake_olos_dialer_raw.agentstaterawdata.agentid
  id_agent_state_raw_data:
    description: Primary key of the agent state event record, uniquely identifying each individual state transition in the Olos system.
    lineage:
      - datalake_olos_dialer_raw.agentstaterawdata.agentstaterawdataid
  agent_status:
    description: Operational status of the dialer agent at the time of the state change event.
    lineage:
      - datalake_olos_dialer_raw.agentstaterawdata.agentstatus
  id_call:
    description: References the associated call in the Olos dialer, present when the state change was triggered by a call event.
    lineage:
      - datalake_olos_dialer_raw.agentstaterawdata.callid
  id_call_telecom:
    description: Telephony provider call identifier corresponding to this state event, used for cross-referencing with carrier records.
    lineage:
      - datalake_olos_dialer_raw.agentstaterawdata.callidtelecom
  id_campaign:
    description: References the outbound campaign the agent was logged into when the state change occurred.
    lineage:
      - datalake_olos_dialer_raw.agentstaterawdata.campaignid
  reason:
    description: Olos reason code explaining why the agent entered the reported status.
    lineage:
      - datalake_olos_dialer_raw.agentstaterawdata.reason
  insert_time:
    description: Timestamp when the Olos Dialer event row was inserted in the source export.
    lineage:
      - datalake_olos_dialer_raw.agentstaterawdata.inserttime
  ts_state_started:
    description: Moment when the agent entered the current status, used to measure the duration of each state (e.g., pause length, available time).
    lineage:
      - datalake_olos_dialer_raw.agentstaterawdata.startstate
  ts_state_ended:
    description: Moment when the agent exited the current status and transitioned to the next, used alongside ts_state_started to compute state duration.
    lineage:
      - datalake_olos_dialer_raw.agentstaterawdata.endstate
  year:
    description: Year component of the event date, used as a partition key to enable efficient querying by date range.
    lineage:
      - datalake_olos_dialer_raw.agentstaterawdata.year
  month:
    description: Month component of the event date, used as a partition key to enable efficient querying by date range.
    lineage:
      - datalake_olos_dialer_raw.agentstaterawdata.month
  day:
    description: Day component of the event date, used as a partition key to enable efficient querying by date range.
    lineage:
      - datalake_olos_dialer_raw.agentstaterawdata.day
