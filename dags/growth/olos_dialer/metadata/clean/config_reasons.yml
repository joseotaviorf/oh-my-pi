---
database_name: datalake_olos_dialer_clean
table_name: config_reasons
owner: henrique.paulo@quintoandar.com.br
domain: Growth
description: |
  Configured call outcome reasons in the Olos dialer used to classify agent wrap-up codes
  during outbound supply contacts. Supports standardized disposition reporting across campaigns.
  Partitioned by `year`, `month`, `day`.
columns:
  id_campaign:
    description: Unique identifier of the campaign.
    lineage:
      - datalake_olos_dialer_raw.configreasons.campaignid
  id_reason:
    description: Unique identifier of the reason.
    lineage:
      - datalake_olos_dialer_raw.configreasons.reasonid
  id_reason_type:
    description: Unique identifier of the reason type.
    lineage:
      - datalake_olos_dialer_raw.configreasons.reasontypeid
  description:
    description: Textual description of the config reasons.
    lineage:
      - datalake_olos_dialer_raw.configreasons.description
  year:
    description: Partition column for the year of the record.
    lineage:
      - datalake_olos_dialer_raw.configreasons.year
  month:
    description: Partition column for the month of the record.
    lineage:
      - datalake_olos_dialer_raw.configreasons.month
  day:
    description: Partition column for the day of the record.
    lineage:
      - datalake_olos_dialer_raw.configreasons.day
