description: |
  Mapping between Olos dialer agents and their supervisors in the outbound contact workforce.
  One row per agent-supervisor relationship per daily load, used for hierarchy reporting and
  team performance analytics in Growth contact-center operations. Partitioned by `year`, `month`, `day`.
columns:
  id_agent:
    description: Unique identifier of the agent.
    lineage:
      - datalake_olos_dialer_raw.agentsupervisor.agentid
  id_supervisor:
    description: Unique identifier of the supervisor.
    lineage:
      - datalake_olos_dialer_raw.agentsupervisor.supervisorid
  year:
    description: Partition column for the year of the record.
    lineage:
      - datalake_olos_dialer_raw.agentsupervisor.year
  month:
    description: Partition column for the month of the record.
    lineage:
      - datalake_olos_dialer_raw.agentsupervisor.month
  day:
    description: Partition column for the day of the record.
    lineage:
      - datalake_olos_dialer_raw.agentsupervisor.day
