---
database_name: datalake_olos_dialer_clean
table_name: info_campaign_type
owner: henrique.paulo@quintoandar.com.br
domain: Growth
description: |
  Olos lookup dimension mapping campaign type IDs to labels describing outbound campaign
  categories in the dialer. Joined to `campaign` and attempt tables for campaign segmentation.
  Partitioned by `year`, `month`, `day`.
columns:
  id_campaign_type:
    description: Unique identifier of the campaign type.
    lineage:
      - datalake_olos_dialer_raw.info_campaigntype.campaigntypeid
  description:
    description: Textual description of the info campaign type.
    lineage:
      - datalake_olos_dialer_raw.info_campaigntype.description
  year:
    description: Partition column for the year of the record.
    lineage:
      - datalake_olos_dialer_raw.info_campaigntype.year
  month:
    description: Partition column for the month of the record.
    lineage:
      - datalake_olos_dialer_raw.info_campaigntype.month
  day:
    description: Partition column for the day of the record.
    lineage:
      - datalake_olos_dialer_raw.info_campaigntype.day
