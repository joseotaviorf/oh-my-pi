---
database_name: datalake_olos_dialer_clean
table_name: info_campaign_type
owner: henrique.paulo@quintoandar.com.br
domain: Growth
description: |
  Olos lookup dimension mapping campaign type IDs to labels describing outbound campaign
  categories in the dialer. Joined to `campaign` and attempt tables for campaign segmentation.
  Partitioned by `year`, `month`, `day`.
columns:
  id_campaign_type:
    description: Numeric code assigned by Olos to each campaign category, used to join this lookup to campaign and attempt records for segmentation.
    lineage:
      - datalake_olos_dialer_raw.info_campaigntype.campaigntypeid
  description:
    description: Human-readable label for the campaign type (e.g., predictive, progressive, preview), used to segment outbound campaign performance.
    lineage:
      - datalake_olos_dialer_raw.info_campaigntype.description
  year:
    description: Year component of the record date, used as a partition key to enable efficient querying by date range.
    lineage:
      - datalake_olos_dialer_raw.info_campaigntype.year
  month:
    description: Month component of the record date, used as a partition key to enable efficient querying by date range.
    lineage:
      - datalake_olos_dialer_raw.info_campaigntype.month
  day:
    description: Day component of the record date, used as a partition key to enable efficient querying by date range.
    lineage:
      - datalake_olos_dialer_raw.info_campaigntype.day
