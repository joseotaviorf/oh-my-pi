---
database_name: datalake_olos_dialer_clean
table_name: disposition
owner: henrique.paulo@quintoandar.com.br
domain: Growth
description: |
  Call disposition outcomes from the Olos dialer classifying how each outbound contact attempt
  ended (answered, no answer, busy, voicemail, etc.). Joined to attempt fact tables for
  conversion funnel analysis. Partitioned by `year`, `month`, `day`.
columns:
  id_disposition:
    description: Unique identifier of the disposition.
    lineage:
      - datalake_olos_dialer_raw.disposition.dispositionid
  description:
    description: Textual description of the disposition.
    lineage:
      - datalake_olos_dialer_raw.disposition.description
  year:
    description: Partition column for the year of the record.
    lineage:
      - datalake_olos_dialer_raw.disposition.year
  month:
    description: Partition column for the month of the record.
    lineage:
      - datalake_olos_dialer_raw.disposition.month
  day:
    description: Partition column for the day of the record.
    lineage:
      - datalake_olos_dialer_raw.disposition.day
