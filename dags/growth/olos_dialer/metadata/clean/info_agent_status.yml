---
database_name: datalake_olos_dialer_clean
table_name: info_agent_status
owner: henrique.paulo@quintoandar.com.br
domain: Growth
description: |
  Olos lookup dimension mapping agent status IDs to human-readable labels (available, on call,
  paused, wrap-up, etc.). Joined to agent state and attempt fact tables for workforce status
  reporting in outbound contact operations. Partitioned by `year`, `month`, `day`.
columns:
  id_disposition:
    description: Numeric code assigned by Olos to each agent status category, used to join this lookup to agent state event records.
    lineage:
      - datalake_olos_dialer_raw.info_agentstatus.agentstatusid
  description:
    description: Human-readable label for the agent status (e.g., available, on call, paused), used in workforce reporting dashboards.
    lineage:
      - datalake_olos_dialer_raw.info_agentstatus.description
  year:
    description: Year component of the record date, used as a partition key to enable efficient querying by date range.
    lineage:
      - datalake_olos_dialer_raw.info_agentstatus.year
  month:
    description: Month component of the record date, used as a partition key to enable efficient querying by date range.
    lineage:
      - datalake_olos_dialer_raw.info_agentstatus.month
  day:
    description: Day component of the record date, used as a partition key to enable efficient querying by date range.
    lineage:
      - datalake_olos_dialer_raw.info_agentstatus.day
