---
database_name: datalake_olos_dialer_clean
table_name: campaign_customer
owner: henrique.paulo@quintoandar.com.br
domain: Growth
description: |
  Links Olos dialer campaigns to customer/contact records eligible for outbound dialing.
  Associates campaign configuration with individual leads queued for analyst contact attempts.
  Partitioned by `year`, `month`, `day`.
columns:
  id_campaign:
    description: Unique identifier of the campaign.
    lineage:
      - datalake_olos_dialer_raw.campaigncustomer.campaignid
  id_customer:
    description: Unique identifier of the customer.
    lineage:
      - datalake_olos_dialer_raw.campaigncustomer.customerid
  year:
    description: Partition column for the year of the record.
    lineage:
      - datalake_olos_dialer_raw.campaigncustomer.year
  month:
    description: Partition column for the month of the record.
    lineage:
      - datalake_olos_dialer_raw.campaigncustomer.month
  day:
    description: Partition column for the day of the record.
    lineage:
      - datalake_olos_dialer_raw.campaigncustomer.day
