---
database_name: datalake_olos_dialer_clean
table_name: disposition_detail
owner: henrique.paulo@quintoandar.com.br
domain: Growth
description: |
  Granular disposition detail records extending base Olos disposition outcomes with additional
  wrap-up context captured by analysts after outbound contact attempts. Partitioned by `year`,
  `month`, `day`.
columns:
  id_disposition:
    description: Unique identifier of the disposition.
    lineage:
      - datalake_olos_dialer_raw.dispositiondetail.dispositionid
  id_disposition_plan:
    description: Unique identifier of the disposition plan.
    lineage:
      - datalake_olos_dialer_raw.dispositiondetail.dispositionplanid
  id_disposition_type:
    description: Unique identifier of the disposition type.
    lineage:
      - datalake_olos_dialer_raw.dispositiondetail.dispositiontypeid
  disposition_code:
    description: Olos disposition code describing the outcome of the customer interaction.
    lineage:
      - datalake_olos_dialer_raw.dispositiondetail.dispositioncode
  business_success:
    description: Flag indicating whether Olos classified the disposition as a business success outcome.
    lineage:
      - datalake_olos_dialer_raw.dispositiondetail.businesssuccess
  customer_finisher:
    description: Flag indicating whether the customer ended the interaction in Olos Dialer.
    lineage:
      - datalake_olos_dialer_raw.dispositiondetail.customerfinisher
  phone_finisher:
    description: Contact phone number associated with the record.
    lineage:
      - datalake_olos_dialer_raw.dispositiondetail.phonefinisher
  year:
    description: Partition column for the year of the record.
    lineage:
      - datalake_olos_dialer_raw.dispositiondetail.year
  month:
    description: Partition column for the month of the record.
    lineage:
      - datalake_olos_dialer_raw.dispositiondetail.month
  day:
    description: Partition column for the day of the record.
    lineage:
      - datalake_olos_dialer_raw.dispositiondetail.day
