---
database_name: datalake_olos_dialer_clean
table_name: users
owner: henrique.paulo@quintoandar.com.br
domain: Growth
description: Contains information about users in the olos dialer system.
columns:
  id_user:
    description: Unique identifier of the user.
    lineage:
      - datalake_olos_dialer_raw.users.userid
  id_agent:
    description: Unique identifier of the agent.
    lineage:
      - datalake_olos_dialer_raw.users.agentid
  id_user_permission:
    description: Unique identifier of the user permission.
    lineage:
      - datalake_olos_dialer_raw.users.userpermissionid
  user_name:
    description: Login username assigned to the Olos Dialer agent or supervisor account.
    lineage:
      - datalake_olos_dialer_raw.users.username
  email:
    description: Corporate email address registered for the Olos Dialer user account.
    lineage:
      - datalake_olos_dialer_raw.users.email
  login:
    description: Authentication login identifier used to access the Olos Dialer platform.
    lineage:
      - datalake_olos_dialer_raw.users.login
  agent_profile:
    description: Role profile assigned to the Olos Dialer user, such as agent or supervisor.
    lineage:
      - datalake_olos_dialer_raw.users.permissiondesc
  is_activated:
    description: Indicates whether the Olos Dialer configuration record is currently active and selectable.
    lineage:
      - datalake_olos_dialer_raw.users.activated
  is_enable_personal_transfer:
    description: Indicates whether the Olos Dialer user may transfer calls to a personal phone line.
    lineage:
      - datalake_olos_dialer_raw.users.enablepersonaltransfer
  is_agent:
    description: Indicates whether the Olos Dialer user operates as a frontline dialing agent.
    lineage:
      - datalake_olos_dialer_raw.users.flag_agent
  is_manager:
    description: Indicates whether the Olos Dialer user has manager permissions in the platform.
    lineage:
      - datalake_olos_dialer_raw.users.flag_manager
  is_supervisor:
    description: Indicates whether the Olos Dialer user supervises agents and monitors campaigns.
    lineage:
      - datalake_olos_dialer_raw.users.flag_supervisor
  ts_last_login:
    description: Timestamp when the record was last login.
    lineage:
      - datalake_olos_dialer_raw.users.lastlogin
  year:
    description: Partition column for the year of the record.
    lineage:
      - datalake_olos_dialer_raw.users.year
  month:
    description: Partition column for the month of the record.
    lineage:
      - datalake_olos_dialer_raw.users.month
  day:
    description: Partition column for the day of the record.
    lineage:
      - datalake_olos_dialer_raw.users.day
