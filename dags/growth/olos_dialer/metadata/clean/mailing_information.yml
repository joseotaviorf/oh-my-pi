---
database_name: datalake_olos_dialer_clean
table_name: mailing_information
owner: henrique.paulo@quintoandar.com.br
domain: Growth
description: |
  Supplemental metadata for Olos mailing batches including layout configuration and batch-level
  settings for outbound contact lists loaded into the dialer. Partitioned by `year`, `month`, `day`.
columns:
  id_campaign:
    description: Unique identifier of the campaign.
    lineage:
      - datalake_olos_dialer_raw.mailinginformation.campaignid
  table_name:
    description: Olos mailing layout table identifier that originated the exported record.
    lineage:
      - datalake_olos_dialer_raw.mailinginformation.tablename
  year:
    description: Partition column for the year of the record.
    lineage:
      - datalake_olos_dialer_raw.mailinginformation.year
  month:
    description: Partition column for the month of the record.
    lineage:
      - datalake_olos_dialer_raw.mailinginformation.month
  day:
    description: Partition column for the day of the record.
    lineage:
      - datalake_olos_dialer_raw.mailinginformation.day
