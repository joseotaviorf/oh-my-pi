---
database_name: datalake_olos_dialer_clean
table_name: info_reason_type
owner: henrique.paulo@quintoandar.com.br
domain: Growth
description: |
  Olos lookup dimension mapping reason type IDs to labels for agent wrap-up reason categories
  during outbound contacts. Joined to `reason` and disposition tables for outcome analysis.
  Partitioned by `year`, `month`, `day`.
columns:
  id_reason_type:
    description: Unique identifier of the reason type.
    lineage:
      - datalake_olos_dialer_raw.info_reasontype.reasontypeid
  description:
    description: Textual description of the info reason type.
    lineage:
      - datalake_olos_dialer_raw.info_reasontype.description
  year:
    description: Partition column for the year of the record.
    lineage:
      - datalake_olos_dialer_raw.info_reasontype.year
  month:
    description: Partition column for the month of the record.
    lineage:
      - datalake_olos_dialer_raw.info_reasontype.month
  day:
    description: Partition column for the day of the record.
    lineage:
      - datalake_olos_dialer_raw.info_reasontype.day
