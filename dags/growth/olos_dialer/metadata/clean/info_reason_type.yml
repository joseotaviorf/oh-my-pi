---
database_name: datalake_olos_dialer_clean
table_name: info_reason_type
owner: henrique.paulo@quintoandar.com.br
domain: Growth
description: |
  Olos lookup dimension mapping reason type IDs to labels for agent wrap-up reason categories
  during outbound contacts. Joined to `reason` and disposition tables for outcome analysis.
  Partitioned by `year`, `month`, `day`.
columns:
  id_reason_type:
    description: Numeric code assigned by Olos to each wrap-up reason category, used to join this lookup to agent state and disposition records.
    lineage:
      - datalake_olos_dialer_raw.info_reasontype.reasontypeid
  description:
    description: Human-readable label for the reason type (e.g., pause reason, not-ready category), used to analyze why agents exited productive dialing states.
    lineage:
      - datalake_olos_dialer_raw.info_reasontype.description
  year:
    description: Year component of the record date, used as a partition key to enable efficient querying by date range.
    lineage:
      - datalake_olos_dialer_raw.info_reasontype.year
  month:
    description: Month component of the record date, used as a partition key to enable efficient querying by date range.
    lineage:
      - datalake_olos_dialer_raw.info_reasontype.month
  day:
    description: Day component of the record date, used as a partition key to enable efficient querying by date range.
    lineage:
      - datalake_olos_dialer_raw.info_reasontype.day
