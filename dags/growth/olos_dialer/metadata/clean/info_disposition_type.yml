---
database_name: datalake_olos_dialer_clean
table_name: info_disposition_type
owner: henrique.paulo@quintoandar.com.br
domain: Growth
description: |
  Olos lookup dimension mapping disposition type IDs to labels for call outcome categories.
  Joined to `disposition` and attempt fact tables to classify how outbound contacts ended.
  Partitioned by `year`, `month`, `day`.
columns:
  id_disposition_type:
    description: Unique identifier of the disposition type.
    lineage:
      - datalake_olos_dialer_raw.info_dispositiontype.dispositiontypeid
  description:
    description: Textual description of the info disposition type.
    lineage:
      - datalake_olos_dialer_raw.info_dispositiontype.description
  year:
    description: Partition column for the year of the record.
    lineage:
      - datalake_olos_dialer_raw.info_dispositiontype.year
  month:
    description: Partition column for the month of the record.
    lineage:
      - datalake_olos_dialer_raw.info_dispositiontype.month
  day:
    description: Partition column for the day of the record.
    lineage:
      - datalake_olos_dialer_raw.info_dispositiontype.day
