---
database_name: datalake_olos_dialer_clean
table_name: info_disposition_type
owner: henrique.paulo@quintoandar.com.br
domain: Growth
description: |
  Olos lookup dimension mapping disposition type IDs to labels for call outcome categories.
  Joined to `disposition` and attempt fact tables to classify how outbound contacts ended.
  Partitioned by `year`, `month`, `day`.
columns:
  id_disposition_type:
    description: Numeric code assigned by Olos to each call outcome category, used to join this lookup to disposition and attempt fact records.
    lineage:
      - datalake_olos_dialer_raw.info_dispositiontype.dispositiontypeid
  description:
    description: Human-readable label for the disposition type (e.g., connected, no answer, busy), used to classify how outbound contacts ended.
    lineage:
      - datalake_olos_dialer_raw.info_dispositiontype.description
  year:
    description: Year component of the record date, used as a partition key to enable efficient querying by date range.
    lineage:
      - datalake_olos_dialer_raw.info_dispositiontype.year
  month:
    description: Month component of the record date, used as a partition key to enable efficient querying by date range.
    lineage:
      - datalake_olos_dialer_raw.info_dispositiontype.month
  day:
    description: Day component of the record date, used as a partition key to enable efficient querying by date range.
    lineage:
      - datalake_olos_dialer_raw.info_dispositiontype.day
