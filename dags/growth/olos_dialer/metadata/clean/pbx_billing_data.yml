---
database_name: datalake_olos_dialer_clean
table_name: pbx_billing_data
owner: henrique.paulo@quintoandar.com.br
domain: Growth
description: |
  Telephony billing records from the Olos PBX integration — call duration, routing, and cost
  details per outbound attempt. Used by Growth for contact-center cost analytics and vendor
  reconciliation with Olos. Partitioned by `year`, `month`, `day`.
columns:
  id_pbx_billing_data:
    description: Unique identifier of the pbx billing data.
    lineage:
      - datalake_olos_dialer_raw.pbxbillingdata.pbxbillingdataid
  id_pbx_disposition:
    description: Unique identifier of the pbx disposition.
    lineage:
      - datalake_olos_dialer_raw.pbxbillingdata.pbxdispositionid
  id_agent:
    description: Unique identifier of the agent.
    lineage:
      - datalake_olos_dialer_raw.pbxbillingdata.agentid
  id_campaign:
    description: Unique identifier of the campaign.
    lineage:
      - datalake_olos_dialer_raw.pbxbillingdata.campaignid
  id_call_direction:
    description: Unique identifier of the call direction.
    lineage:
      - datalake_olos_dialer_raw.pbxbillingdata.calldirectionid
  id_customer:
    description: Unique identifier of the customer.
    lineage:
      - datalake_olos_dialer_raw.pbxbillingdata.customerid
  id_phone_humber:
    description: Unique identifier of the phone humber.
    lineage:
      - datalake_olos_dialer_raw.pbxbillingdata.phonenumberid
  id_record:
    description: Unique identifier of the record.
    lineage:
      - datalake_olos_dialer_raw.pbxbillingdata.recordid
  id_session:
    description: Unique identifier of the session.
    lineage:
      - datalake_olos_dialer_raw.pbxbillingdata.sessionid
  id_telecom_call:
    description: Unique identifier of the telecom call.
    lineage:
      - datalake_olos_dialer_raw.pbxbillingdata.telecomcallid
  total_time:
    description: Total elapsed seconds for the PBX call leg including signaling and conversation.
    lineage:
      - datalake_olos_dialer_raw.pbxbillingdata.totaltime
  trunk_number:
    description: PBX trunk identifier used to route the billed call through the telephony provider.
    lineage:
      - datalake_olos_dialer_raw.pbxbillingdata.trunknumber
  signaling:
    description: Telephony signaling protocol event recorded for the PBX billing call leg.
    lineage:
      - datalake_olos_dialer_raw.pbxbillingdata.signaling
  signaling_extra_info:
    description: Additional signaling metadata captured by the PBX for troubleshooting and billing.
    lineage:
      - datalake_olos_dialer_raw.pbxbillingdata.signalingextrainfo
  signaling_time:
    description: Duration in seconds spent in telephony signaling before the conversation started.
    lineage:
      - datalake_olos_dialer_raw.pbxbillingdata.signalingtime
  route:
    description: Telephony routing path used by Olos Dialer to place or receive the call.
    lineage:
      - datalake_olos_dialer_raw.pbxbillingdata.route
  pbx_name:
    description: Name of the private branch exchange system that processed the billed call.
    lineage:
      - datalake_olos_dialer_raw.pbxbillingdata.pbxname
  campaign_code:
    description: Internal Olos campaign code used for dialer billing and routing configuration.
    lineage:
      - datalake_olos_dialer_raw.pbxbillingdata.campaigncode
  channel:
    description: Communication channel used.
    lineage:
      - datalake_olos_dialer_raw.pbxbillingdata.channel
  company:
    description: Operations company responsible for the outbound campaign associated with the call.
    lineage:
      - datalake_olos_dialer_raw.pbxbillingdata.company
  alerting_time:
    description: Seconds the callee phone rang before the call was answered or abandoned.
    lineage:
      - datalake_olos_dialer_raw.pbxbillingdata.alertingtime
  analysis_time:
    description: Seconds spent in post-call analysis before the agent disposition was saved.
    lineage:
      - datalake_olos_dialer_raw.pbxbillingdata.analysistime
  ani:
    description: Automatic number identification of the caller as reported by the telephony provider.
    lineage:
      - datalake_olos_dialer_raw.pbxbillingdata.ani
  billing_code:
    description: Olos billing code linked to the campaign for cost allocation.
    lineage:
      - datalake_olos_dialer_raw.pbxbillingdata.billingcode
  board:
    description: Telephony board or channel identifier that carried the billed call in the PBX.
    lineage:
      - datalake_olos_dialer_raw.pbxbillingdata.board
  conversation_time:
    description: Seconds of connected talk time between agent and customer during the call.
    lineage:
      - datalake_olos_dialer_raw.pbxbillingdata.conversationtime
  device_name:
    description: Physical or virtual device name registered in the PBX for the agent extension.
    lineage:
      - datalake_olos_dialer_raw.pbxbillingdata.devicename
  dnis:
    description: Dialed phone number in the format captured by the Olos Dialer routing system.
    lineage:
      - datalake_olos_dialer_raw.pbxbillingdata.dnis
  link:
    description: URL link associated with the record.
    lineage:
      - datalake_olos_dialer_raw.pbxbillingdata.link
  mailing_name:
    description: Olos mailing list name that sourced the customer record for the outbound attempt.
    lineage:
      - datalake_olos_dialer_raw.pbxbillingdata.mailingname
  original_phone_number:
    description: Contact phone number associated with the record.
    lineage:
      - datalake_olos_dialer_raw.pbxbillingdata.originalphonenumber
  ts_started:
    description: Timestamp when the record was started.
    lineage:
      - datalake_olos_dialer_raw.pbxbillingdata.startdate
  year:
    description: Partition column for the year of the record.
    lineage:
      - datalake_olos_dialer_raw.pbxbillingdata.year
  month:
    description: Partition column for the month of the record.
    lineage:
      - datalake_olos_dialer_raw.pbxbillingdata.month
  day:
    description: Partition column for the day of the record.
    lineage:
      - datalake_olos_dialer_raw.pbxbillingdata.day
