---
database_name: datalake_olos_dialer_clean
table_name: info_status_id
owner: henrique.paulo@quintoandar.com.br
domain: Growth
description: |
  Olos lookup dimension mapping status IDs to labels for contact or attempt lifecycle states
  in the dialer queue. Used to track lead progression through outbound contact workflows.
  Partitioned by `year`, `month`, `day`.
columns:
  id_info_status:
    description: Numeric code assigned by Olos to each contact or attempt lifecycle state, used to join this lookup to queue and attempt records.
    lineage:
      - datalake_olos_dialer_raw.info_statusid.id
  description:
    description: Human-readable label for the contact lifecycle status (e.g., pending, in progress, completed), used to track lead progression through the outbound workflow.
    lineage:
      - datalake_olos_dialer_raw.info_statusid.description
  year:
    description: Year component of the record date, used as a partition key to enable efficient querying by date range.
    lineage:
      - datalake_olos_dialer_raw.info_statusid.year
  month:
    description: Month component of the record date, used as a partition key to enable efficient querying by date range.
    lineage:
      - datalake_olos_dialer_raw.info_statusid.month
  day:
    description: Day component of the record date, used as a partition key to enable efficient querying by date range.
    lineage:
      - datalake_olos_dialer_raw.info_statusid.day
