  in the dialer queue. Used to track lead progression through outbound contact workflows.
  Partitioned by `year`, `month`, `day`.
columns:
  id_info_status:
    description: Unique identifier of the info status.
    lineage:
      - datalake_olos_dialer_raw.info_statusid.id
  description:
    description: Textual description of the info status id.
    lineage:
      - datalake_olos_dialer_raw.info_statusid.description
  year:
    description: Partition column for the year of the record.
    lineage:
      - datalake_olos_dialer_raw.info_statusid.year
  month:
    description: Partition column for the month of the record.
    lineage:
      - datalake_olos_dialer_raw.info_statusid.month
  day:
    description: Partition column for the day of the record.
    lineage:
      - datalake_olos_dialer_raw.info_statusid.day
