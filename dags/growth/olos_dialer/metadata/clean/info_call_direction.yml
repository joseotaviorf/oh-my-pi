---
database_name: datalake_olos_dialer_clean
table_name: info_call_direction
owner: henrique.paulo@quintoandar.com.br
domain: Growth
description: |
  Olos lookup dimension mapping call direction IDs to labels (inbound vs outbound). Used to
  classify dialing attempt records and PBX billing events in Growth contact-center analytics.
  Partitioned by `year`, `month`, `day`.
columns:
  id_call_direction:
    description: Numeric code assigned by Olos to each call direction category, used to join this lookup to attempt and billing event records.
    lineage:
      - datalake_olos_dialer_raw.info_calldirection.calldirectionid
  description:
    description: Human-readable label for the call direction (e.g., inbound, outbound), used to classify contact events in analytics reports.
    lineage:
      - datalake_olos_dialer_raw.info_calldirection.description
  year:
    description: Year component of the record date, used as a partition key to enable efficient querying by date range.
    lineage:
      - datalake_olos_dialer_raw.info_calldirection.year
  month:
    description: Month component of the record date, used as a partition key to enable efficient querying by date range.
    lineage:
      - datalake_olos_dialer_raw.info_calldirection.month
  day:
    description: Day component of the record date, used as a partition key to enable efficient querying by date range.
    lineage:
      - datalake_olos_dialer_raw.info_calldirection.day
