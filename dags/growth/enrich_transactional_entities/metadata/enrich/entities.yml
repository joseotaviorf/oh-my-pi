    lineage:
      - core_contract.contract.id_owner
      - core_contract.contract.id_tenant
      - core_offer.offer.id_offer
      - core_visit.visit.code
      - core_visit.visit.id_agent
      - core_visit.visit.id_visitor
      - core_visit.visit.id_owner
      - core_offer.offer.id_tenant
      - core_offer.offer.id_owner
      - core_visit.visit.id_visit
      - core_offer.offer.id_offer
      - core_contract.contract.id_contract
