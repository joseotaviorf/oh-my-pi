      - datalake_entities_views.house_draft.properties
      - datalake_entities_views.house_draft.ts_created
      - datalake_entities_views.collections_segment.properties
      - datalake_entities_views.collections_segment.ts_created
    description:
      Struct containing entity-specific properties and status information, used to create labels for chatbots.
      This field provides detailed contextual information about the current state of each entity.
      For VISIT entities - contains computed_status and ts_visit fields.
      For FR_OFFER entities - contains status field.
      For FR_CONTRACT entities - contains status and dt_started fields.
      For FR_TERMINATION entities - contains status and ts_created fields.
      For LISTING entities - contains transformed status (reflecting API response) and ts_created fields. The status field undergoes transformation logic and it's not the same found in the product database in some cases.
      For FR_INSPECTION entities - contains status and Inspection's inspection date (dt_inspected) or Booking's booking date (dt_booking) fields.
      For FR_ONBOARDING entities - contains status and ts_created fields.
      For FR_CREDIT_EVALUATION entities - contains status and ts_created fields.
      For FR_RESERVATION entities - contains status and ts_created fields.
      For FR_REPAIR_ONGOING entities - contains status and ts_created fields.
      For FR_REPAIR_OFFBOARDING entities - contains ts_created field.
      For FR_INVOICE entities - contains status and ts_created fields.
      For PHOTO_SESSION entities - contains status (within JSON structure) and when (ts_created) fields from the photo_session properties JSON.
      For HOUSE_DRAFT entities - contains status (within JSON structure) and when (ts_created) fields from the house_draft properties JSON.
  house_address:
    lineage:
      - datalake_ebdb_clean.house.address
      - datalake_ebdb_clean.house.number
      - datalake_ebdb_clean.house.complement
      - datalake_ebdb_clean.house.neighborhood
