      This id corresponds to the id from the User table in our Main database (EBDB) for all entities.
      Each entity may be linked to multiple users.
  uuid_person:
    lineage:
      - datalake_ebdb_clean.user.uuid_person
    description: The unique identifier for a user associated with the entity.
      This is the Person's uuid.
      Each entity may be linked to multiple users.
  entity:
    description: String that specifies the type of entity.
    categories:
      VISIT: The entity is a visit, with its id_entity mapping directly to the id_visit from the Visit table in EBDB database.
      FR_OFFER: The entity is a ForRent offer, with its id_entity mapping directly to the id_offer from the Rental Transact system.
      FR_CONTRACT: The entity is a contract, with its id_entity mapping directly to the id_contract from the Contract table in the core model.
      FR_TERMINATION: The entity is a termination, with its id_entity mapping directly to the id from the Termination table in the terminator system.
      LISTING: The entity is a property listing, with its id_entity mapping to the id_house + business_context from the Listing Business Context table via the datalake_entities_views.listing view, representing property listings across Rent and Sale business contexts.
      FR_INSPECTION: The entity is an inspection, with its id_entity mapping directly to the id from the Inspection table in EBDB database.
      FR_ONBOARDING: The entity is an onboarding process, with its id_entity mapping directly to the id from the Onboarding table in EBDB database.
      FR_CREDIT_EVALUATION: The entity is a credit evaluation, with its id_entity mapping directly to the id_credit_evaluation from the Credit Evaluation core model.
      FR_RESERVATION: The entity is a reservation, with its id_entity mapping directly to the id from the Reservation table in the Kill Queue system.
      FR_REPAIR_ONGOING: The entity is an ongoing repair request, with its id_entity mapping directly to the id from the repair request tables in the repairs domain.
      FR_REPAIR_OFFBOARDING: The entity is an offboarding repair request, with its id_entity mapping directly to the id from the repair request tables in the inspection services domain.
      FR_INVOICE: The entity is an invoice, with its id_entity mapping directly to the id from the Invoice table in the Retsuko system.
      PHOTO_SESSION: The entity is a photo session, with its id_entity mapping directly to the id from the Photographer Job table in EBDB database.
      HOUSE_DRAFT: The entity is a house draft, with its id_entity mapping directly to the id from the House Draft table in BOB system, representing property registration drafts created through the self-service flow by owners.
      FR_COLLECTIONS_SEGMENT: The entity is a rental collections segment, with its id_entity mapping directly to id_customer_segment_distribution from the Trato Feito customer_segment_distribution table at the customer grain. It tracks the collections status of a segmented customer on their priority contract; multiple rows per id_contract are expected when more than one customer on the contract has an active collections segmentation.
  persona:
    lineage:
      - datalake_entities_views.listing.persona
      - datalake_entities_views.onboarding.persona
      - datalake_entities_views.photo_session.persona
      - datalake_entities_views.house_draft.persona
    description:
      A persona describes the primary role of a user (id_user) in relation to a specific
      entity within our platform's business context.
    categories:
      AGENT_BROKER: A broker who acts as an agent, managing client demands and mediating communication.
      BUYER_PROSPECT: A potential customer interested in purchasing a property.
      TENANT_PROSPECT: A potential customer interested in renting a property.
      OWNER: The owner of one or more properties registered on the platform.
      TENANT: A current tenant who has signed a contract for a property.
      AGENT_INSPECTOR: A professional who conducts property inspections.
      AGENT_PHOTOGRAPHER: A photographer assigned to conduct photo sessions for property listings.
  business_context:
    lineage:
      - core_visit.visit.business_context
      - datalake_entities_views.listing.business_context
    description: |
      Business context that categorizes the type of transaction or interaction.
      This field indicates whether the entity is related to rental (RENT) or sale (SALE) operations,
      helping to differentiate business flows and customer journeys within our platform.
      Note: Currently, photo_session entities have business_context = NULL in the source view, so this field is NULL for photo session entities.
    categories:
      RENT: The entity is related to rental transactions, including visits, contracts, terminations, listings, and photo sessions for rental properties.
      SALE: The entity is related to sale transactions, including visits, listings, and photo sessions for property purchases.
