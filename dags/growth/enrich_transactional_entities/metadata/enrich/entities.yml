    description: The full address of the property related to the entity.
      It combines address, number, complement, neighborhood and city (in this exactly order)
      from EBDB's House/Imovel table.
  is_active:
    description:
      Boolean flag indicating if the entity is currently active, used as primary filter for data inclusion.
      Active entities (TRUE) are always included regardless of date. Inactive entities (FALSE) are only included
      if updated within the last 3 months. An entity is considered active as long as it is still receiving interactions.
      A visit entity will be considered as active for statuses confirmed, requested or scheduled, and inactive for statuses canceled, done, request_canceled, unsuccessful or stalled.
      An offer entity will be considered as active for status proposed, and inactive for statuses accepted, dismissed or rejected.
      A contract entity will be considered as active for statuses ativo, minuta or PreAssinaturas, and inactive for statuses cancelado or finalizado.
      A termination entity will be considered as active for statuses requested, inspection_under_review, inspection_scheduled, inspection_opted_out, inspection_executed, or inspection_canceled, and inactive for statuses done or canceled.
      A listing entity will be considered as active for statuses 'PUBLISHED' or 'EDITING', and inactive for statuses 'OPTED_OUT', 'UNPUBLISHED', or 'SUSPENDED'.
      An inspection entity will be considered as active for statuses Agendada, Comentada, EmAcordo, EmRevisao, or Nova, and inactive for statuses Finalizada, Cancelada, Revisada, or ContratoCancelado.
      An onboarding entity will be considered as active for all statuses except "Finished" and "Aborted", which are considered inactive.
      A credit evaluation entity will be considered as active for statuses NOT_SENT, ON_HOLD or PROCESSING, and inactive for statuses CANCELLED, FAILED or FINISHED.
      A reservation entity will be considered as active when is_ongoing = TRUE, and inactive when is_ongoing = FALSE.
      An ongoing repair entity will be considered as active for statuses AWAITING_BUDGET, AWAITING_BUDGET_APPROVAL, AWAITING_OWNER_ACTION, BUDGETING_IN_PROGRESS, COMPULSORY, IN_EXECUTION, IN_NEGOTIATION, IN_PROGRESS, REQUESTED, TENANT_NEEDS_CX_HELP, or NULL, and inactive for statuses FINISHED, RESOLVED, or CANCELED.
      An offboarding repair entity will be considered as active when is_finished = FALSE, and inactive when is_finished = TRUE.
      An invoice entity will be considered as active for status open, and inactive for statuses divergent-payment, not-payable, written-down, canceled, or paid.
      A PHOTO_SESSION entity will be considered as active for all statuses except PUBLICADO, CANCELADO, COMPLETADO, or FOTOSTIRADAS (case-insensitive, after UPPER and TRIM), which are considered inactive.
      A HOUSE_DRAFT entity will be considered as active for statuses 'EDITING' or 'PROCESSING', and inactive for all other statuses.
      A FR_COLLECTIONS_SEGMENT entity is active when the segmented customer still has an active collections segmentation (status is not debts_settled). It is inactive only for debts_settled, when the customer document's customer_segment_distribution row has is_active = FALSE; there is exactly one such row per customer document.
  ts_inactive:
    lineage:
      - core_visit.visit.ts_updated
      - core_offer.offer.ts_updated
      - core_contract.contract.ts_updated
      - datalake_terminator_clean.termination.ts_updated
      - datalake_entities_views.listing.ts_updated
      - datalake_ebdb_clean.inspection.ts_updated
      - datalake_entities_views.onboarding.ts_updated
      - core_credit_evaluation.credit_evaluation.ts_updated
      - datalake_kill_queue_clean.reservation.ts_updated
      - datalake_repairs_clean.repair_request.ts_updated
      - datalake_inspection_services_clean.repair_request.ts_updated
      - datalake_retsuko_clean.invoice.ts_retsuko_updated
      - datalake_entities_views.photo_session.ts_updated
      - datalake_entities_views.house_draft.ts_updated
      - datalake_entities_views.collections_segment.ts_updated
    description: Timestamp when the entity became inactive (is_active = FALSE).
      This field captures the ts_updated timestamp for entities that are currently inactive.
      For active entities (is_active = TRUE), this field will be NULL.
      This is useful for tracking when entities transitioned to an inactive state.
  ts_created:
    lineage:
