      - datalake_ebdb_clean.inspection.ts_created
      - datalake_entities_views.listing.ts_created
      - datalake_entities_views.onboarding.ts_created
      - core_credit_evaluation.credit_evaluation.ts_created
      - datalake_kill_queue_clean.reservation.ts_created
      - datalake_repairs_clean.repair_request.ts_created
      - datalake_inspection_services_clean.repair_request.ts_created
      - datalake_retsuko_clean.invoice.ts_created
      - datalake_entities_views.photo_session.ts_created
      - datalake_entities_views.house_draft.ts_created
      - datalake_entities_views.collections_segment.ts_created
    description: Timestamp of when the entity was created in our product.
  ts_updated:
    lineage:
      - core_visit.visit.ts_updated
      - core_offer.offer.ts_updated
      - core_contract.contract.ts_updated
      - datalake_terminator_clean.termination.ts_updated
      - datalake_ebdb_clean.listing_business_context.ts_updated
      - datalake_ebdb_clean.inspection.ts_updated
      - datalake_entities_views.onboarding.ts_updated
      - core_credit_evaluation.credit_evaluation.ts_updated
      - datalake_kill_queue_clean.reservation.ts_updated
      - datalake_repairs_clean.repair_request.ts_updated
      - datalake_inspection_services_clean.repair_request.ts_updated
      - datalake_retsuko_clean.invoice.ts_retsuko_updated
      - datalake_entities_views.photo_session.ts_updated
      - datalake_entities_views.house_draft.ts_updated
      - datalake_entities_views.collections_segment.ts_updated
    description: Last timestamp of when the entity was updated in our product.
      This field is used as the filtering criterion for inactive entities - only inactive entities
      updated within the last 3 months are included in this table.
