database_name: datalake_transactional_entities
table_name: entities
domain: Growth
owner: isadora.gallerani@quintoandar.com.br
description:
  A table containing transactional entities with intelligent filtering to provide a comprehensive
  yet optimized view of our customers' activities on the platform.
  Includes all active entities (is_active = TRUE) regardless of date, and inactive entities (is_active = FALSE)
  from the last 3 months based on ts_updated.
  This filtering strategy ensures relevant, recent data while maintaining complete active entity coverage.
  The format is specifically designed for use by AI initiatives like our chatbots.
  Z-ordered by id_user, id_house, and persona for CDP entity lookups.
