      - core_offer.offer.id_offer
      - core_contract.contract.id_contract
      - datalake_terminator_clean.termination.id
      - datalake_entities_views.listing.id_entity
      - datalake_ebdb_clean.inspection.id
      - datalake_entities_views.onboarding.id_entity
      - core_credit_evaluation.credit_evaluation.id_credit_evaluation
      - datalake_kill_queue_clean.reservation.id
      - datalake_retsuko_clean.invoice.id
