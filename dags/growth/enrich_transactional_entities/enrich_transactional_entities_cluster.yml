cluster:
  type: databricks_16_4_rfleet_instance_cluster
  databricks_conn_id: databricks_new
validation:
  cluster:
    type: consolidation_s_memory_cluster
    databricks_conn_id: databricks_new
    custom_configurations:
      custom_tags:
      - key: dag_id
        value: '{{ dag.dag_id }}'
      - key: application
        value: '{{ dag.dag_id }}'
      - key: app
        value: airflow
      - key: resource-name
        value: databricks
      - key: environment
        value: '{{ var.value.environment }}'
      - key: owner
        value: '{{ task.owner.lower().replace('' '', ''-'') }}'
      - key: ecosystem
        value: data-engineering
      - key: data-classification
        value: private
      - key: sensitive-data
        value: true
      - key: cost-center
        value: c052
      - key: provisioner
        value: bietlejuice
