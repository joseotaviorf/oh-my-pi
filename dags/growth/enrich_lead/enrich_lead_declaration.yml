dag:
  name: enrich_lead
  schedule_start_date: 2019, 1, 1
  owner: Data Growth
  documentation:
    dag_purpose: |
      Creates enriched tables for the context `Lead`.
workflow:
  type: query_delta
  layer: enrich
  spark_session_configs:
    udfs: [SF_REMOVE_ACCENTUATION]
cluster:
  type: custom_cluster
  databricks_conn_id: databricks_new_env
  custom_configurations:
    driver_node_type_id: m5d.xlarge
    node_type_id: m5d.xlarge
    num_workers: 2
    spark_version: 16.4.x-scala2.12
    runtime_engine: PHOTON
    aws_attributes:
      ebs_volume_size: 200
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
