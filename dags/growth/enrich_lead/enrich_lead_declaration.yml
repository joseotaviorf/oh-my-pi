dag:
  name: enrich_lead
  schedule_start_date: 2019, 1, 1
  owner: Data Growth
  documentation:
    dag_purpose: |
      Creates enriched tables for the context `Lead`.
workflow:
  type: query_delta
  layer: enrich
  spark_session_configs:
    udfs: [SF_REMOVE_ACCENTUATION]
cluster:
  type: databricks_12_2_med_2_fixed_workers_general_photon_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
