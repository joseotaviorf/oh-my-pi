---
dag:
  name: enrich_braze_events_user_centric_periodicity
  schedule_start_date: 2020, 11, 1
  owner: Data Growth
  documentation:
    dag_purpose: This DAG creates the enriched tables for Braze user centric events by periodicity.
workflow:
  type: query
  layer: enrich
  custom_schema: braze_user_centric_periodicity
  default_extraction_type: incremental
  default_partitions:
  - year
  - month
  - day
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: r5d.xlarge
    node_type_id: r5d.xlarge
    runtime_engine: PHOTON
    autoscale:
      min_workers: 1
      max_workers: 2
    spark_conf:
      spark.executor.cores: 4
      spark.driver.memory: 22g
      spark.driver.memoryOverhead: 3g
      spark.executor.memory: 22g
      spark.executor.memoryOverhead: 3g
