---
dag:
  name: enrich_braze_events_user_centric_periodicity
  schedule_start_date: 2020, 11, 1
  owner: Data Growth
  documentation:
    dag_purpose: This DAG creates the enriched tables for Braze user centric events by periodicity.
workflow:
  type: query_delta
  layer: enrich
  custom_schema: braze_user_centric_periodicity
  default_extraction_type: incremental
  default_partitions:
  - year
  - month
  - day
cluster:
  type: custom_cluster
  custom_configurations:
    spark_version: 12.2.x-scala2.12
    driver_node_type_id: r5d.xlarge
    node_type_id: r5d.xlarge
    runtime_engine: PHOTON
    num_workers: 2
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
  databricks_conn_id: databricks_new
