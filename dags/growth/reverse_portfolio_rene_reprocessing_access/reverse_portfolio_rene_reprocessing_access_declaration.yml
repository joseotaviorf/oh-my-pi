dag:
  name: reverse_portfolio_rene_reprocessing_access
  schedule_start_date: 2024,12,18
  owner: Data Growth
  documentation:
    dag_purpose: |
      This DAG processes portfolio rene reprocessing data and sends it to Kafka for downstream consumption.
workflow:
  type: access
  layer: reverse
  custom_schema: reverse_lead_portfolio_rene_reprocessing
  load_spark_job: send_to_kafka
  spark_job_arguments:
  - "{load_start_date}"
  - "{load_end_date}"
  - "{{ var.value.environment }}"
  tables_customization:
    rene_leads_formatted: {}
cluster:
  type: databricks_13_3_min_general_2_workers_cluster
  databricks_conn_id: databricks_new_env
  access_control_list:
    group_name: software-engineers
    permission_level: CAN_MANAGE
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
