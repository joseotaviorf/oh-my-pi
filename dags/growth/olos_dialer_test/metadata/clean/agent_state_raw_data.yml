database_name: datalake_olos_dialer_test_clean
table_name: agent_state_raw_data
owner: henrique.paulo@quintoandar.com.br
domain: Growth
description: Raw event stream capturing agent state transitions from the OLOS dialer.
columns:
  id_agent:
    description: Unique identifier of the agent.
    lineage:
    - datalake_olos_dialer_raw.agentstaterawdata.agentid
  id_agent_state_raw_data:
    description: Unique identifier of the agent state raw data.
    lineage:
    - datalake_olos_dialer_raw.agentstaterawdata.agentstaterawdataid
  agent_status:
    description: Operational status of the dialer agent at the time of the state change
      event.
    lineage:
    - datalake_olos_dialer_raw.agentstaterawdata.agentstatus
  id_call:
    description: Unique identifier of the call.
    lineage:
    - datalake_olos_dialer_raw.agentstaterawdata.callid
  id_call_telecom:
    description: Unique identifier of the call telecom.
    lineage:
    - datalake_olos_dialer_raw.agentstaterawdata.callidtelecom
  id_campaign:
    description: Unique identifier of the campaign.
    lineage:
    - datalake_olos_dialer_raw.agentstaterawdata.campaignid
  reason:
    description: Olos reason code explaining why the agent entered the reported status.
    lineage:
    - datalake_olos_dialer_raw.agentstaterawdata.reason
  insert_time:
    description: Timestamp when the Olos Dialer event row was inserted in the source
      export.
    lineage:
    - datalake_olos_dialer_raw.agentstaterawdata.inserttime
  ts_state_started:
    description: Timestamp when the record was state started.
    lineage:
    - datalake_olos_dialer_raw.agentstaterawdata.startstate
  ts_state_ended:
    description: Timestamp when the record was state ended.
    lineage:
    - datalake_olos_dialer_raw.agentstaterawdata.endstate
  year:
    description: Partition column for the year of the record.
    lineage:
    - datalake_olos_dialer_raw.agentstaterawdata.year
  month:
    description: Partition column for the month of the record.
    lineage:
    - datalake_olos_dialer_raw.agentstaterawdata.month
  day:
    description: Partition column for the day of the record.
    lineage:
    - datalake_olos_dialer_raw.agentstaterawdata.day
