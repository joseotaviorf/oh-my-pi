columns:
  id_campaign:
    description: Unique identifier of the campaign.
    lineage:
      - datalake_olos_dialer_raw.campaign.campaignid
  id_campaign_type:
    description: Unique identifier of the campaign type.
    lineage:
      - datalake_olos_dialer_raw.campaign.campaigntypeid
  id_customer:
