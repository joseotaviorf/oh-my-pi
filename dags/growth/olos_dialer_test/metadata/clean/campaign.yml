    lineage:
      - datalake_olos_dialer_raw.campaign.activated
  year:
    description: Partition column for the year of the record.
    lineage:
      - datalake_olos_dialer_raw.campaign.year
  month:
    description: Partition column for the month of the record.
    lineage:
      - datalake_olos_dialer_raw.campaign.month
  day:
