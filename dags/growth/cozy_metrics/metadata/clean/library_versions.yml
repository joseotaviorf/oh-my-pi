database_name: datalake_cozy_metrics_clean
table_name: library_versions
description: This table contains information about Cozy Foundations implemented on
  QuintoAndar's PWAs. This data is from each repository when occurs merge on master/main
  branch and this table is updated every day on midnight.
domain: Growth
owner: ae-growth@quintoandar.com.br
columns:
  metric_name:
    lineage:
    - datalake_cozy_metrics_raw.library_versions.name
    description: The name of metric that we are looking for (in this case is library_versions).
  project_name:
    lineage:
    - datalake_cozy_metrics_raw.library_versions.project
    description: The project name of PWA use (like Github repository).
  project_version:
    lineage:
    - datalake_cozy_metrics_raw.library_versions.project_version
    description: The version of the PWA project.
  core:
    lineage:
    - datalake_cozy_metrics_raw.library_versions.value
    description: Version of Cozy lib used in project.
  icons:
    lineage:
    - datalake_cozy_metrics_raw.library_versions.value
    description: Version of Cozy-icons lib used in PWA.
  theme:
    lineage:
    - datalake_cozy_metrics_raw.library_versions.value
    description: Version of Cozy-theme lib used in PWA.
  tokens:
    lineage:
    - datalake_cozy_metrics_raw.library_versions.value
    description: Version of Cozy-tokens lib used in PWA.
  utils:
    lineage:
    - datalake_cozy_metrics_raw.library_versions.value
    description: Version of Cozy-utils lib used in PWA.
  dt_created:
    lineage:
    - datalake_cozy_metrics_raw.library_versions.created_at
    description: The day when a new merge on main branch is executed.
