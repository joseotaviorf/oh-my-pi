domain: Growth
owner: '@data-growth'
columns:
  sk_rh_accounting_entry:
    lineage:
    - datalake_robin_hood.affiliate_costs.id_rh_accounting_entry
    description: 'This is a registration number of information in the database of accounting entry.'
  sk_payee:
    lineage:
    - datalake_robin_hood.affiliate_costs.id_payee
    description: 'This is a registration number of information in the database of payee.'
