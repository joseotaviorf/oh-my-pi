database_name: dw_quintoandar
table_name: fact_affiliate_taxes
description: Fact table recording tax obligations associated with affiliate commission payments, sourced from the Robin Hood financial system. Each row represents a tax entry
  for an affiliate payee in a specific accounting period, capturing the amount due. Used by the Growth and Finance teams to monitor and report affiliate tax liabilities
  alongside commission cost analysis.
domain: Growth
owner: gabriel.salla@quintoandar.com
columns:
  sk_tax:
    lineage:
    - datalake_robin_hood_clean.tax.id
    description: Surrogate key uniquely identifying each affiliate tax entry in this fact table.
  sk_payee:
    lineage:
    - datalake_robin_hood_clean.tax.id_payee
    description: Surrogate key identifying the affiliate (payee) to whom this tax obligation applies.
  due_amount:
    lineage:
    - datalake_robin_hood_clean.tax.due_amount
    description: Monetary amount of tax due for this affiliate in the reference accounting period, expressed in the local currency.
  dt_accounting_year_month:
    lineage:
    - datalake_robin_hood_clean.tax.accounting_year_month
    description: Accounting reference period (year and month) for which this tax amount is applicable, used for period-based tax reporting.
  ts_load:
    description: Timestamp recording when this row was loaded into the data warehouse by the pipeline.
