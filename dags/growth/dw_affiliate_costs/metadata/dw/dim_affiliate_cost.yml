database_name: dw_quintoandar
table_name: dim_affiliate_cost
description: 'Table created to control affiliate costs based on robin hood'
domain: Growth
owner: '@data-growth'
columns:
  sk_rh_accounting_entry:
    lineage:
    - datalake_robin_hood.affiliate_costs.id_rh_accounting_entry
    description: 'A registration number of information in the database of accounting entry.'
  sk_payee:
    lineage:
    - datalake_robin_hood.affiliate_costs.id_payee
    description: 'A registration number of information in the database of payee.'
  city_group:
    lineage:
    - datalake_robin_hood.affiliate_costs.city_group
    description: 'A grouping of city or clusters of cities and neighborhoods (RMSP - Região Metropolitana de São Paulo).'
  description:
    lineage:
    - datalake_robin_hood.affiliate_costs.description
    description: 'A description of house indication.'
  source_bill_item:
    lineage:
    - datalake_robin_hood.affiliate_costs.source_bill_item
    description: 'A source bill item.'
  commission_type:
    lineage:
    - datalake_robin_hood.affiliate_costs.commission_type
    description: 'A type of comission.'
  cost_center_code:
    lineage:
    - datalake_robin_hood.affiliate_costs.cost_center_code
    description: 'A cost center code.'
  mkt_origin:
    lineage:
    - datalake_robin_hood.affiliate_costs.mkt_origin
    description: 'Inputed origin of the marketing campaign that acquired the lead, such as a specific product.'
  ts_load:
    description: 'Timestamp indicating the data load into our system. It has nothing related to the rent flow taxonomy itself.'
