database_name: datalake_semrush
table_name: keyword_clusters
owner: erica.bertan@quintoandar.com.br
domain: Growth
description: |
  Keyword clustering and categorization derived from `keyword_attributes`.
  Provides macro and micro clusters as well as consolidated flags and types
  (transactional, informational, location, house, player, amenities). Includes
  URL structure analysis and comprehensive clustering logic for SEO strategy
  and competitive intelligence across real estate platforms.
columns:
  id_region_match_operation_city:
    description: "Identifier for the city-level region match rule that produced the city match."
    lineage:
      - datalake_semrush.keyword_attributes.id_region_match_operation_city
  id_region_match_operation_neighborhood:
    description: "Identifier for the neighborhood-level region match rule that produced the neighborhood match."
    lineage:
      - datalake_semrush.keyword_attributes.id_region_match_operation_neighborhood
  player_name:
    description: "Source competitor/classified site from which the keyword ranking was extracted."
    lineage:
      - datalake_semrush.keyword_attributes.player
  keyword:
    description: "Original search keyword as provided by SEMrush for the given player and URL."
    lineage:
      - datalake_semrush.keyword_attributes.keyword
  keyword_clean:
    description: "Keyword normalized to lowercase, accents removed, and non‑alphanumeric characters stripped (spaces kept)."
    lineage:
      - datalake_semrush.keyword_attributes.keyword_clean
  match_igbe_city:
    description: "Matched IBGE city name inferred from the keyword or URL, when applicable."
    lineage:
      - datalake_semrush.keyword_attributes.match_igbe_city
  match_operation_city:
    description: "Normalized operation city matched to the keyword or landing URL."
    lineage:
      - datalake_semrush.keyword_attributes.match_operation_city
  match_operation_neighborhood:
    description: "Normalized operation neighborhood matched to the keyword or landing URL."
    lineage:
      - datalake_semrush.keyword_attributes.match_operation_neighborhood
  url:
    description: "Landing page URL that ranks for the keyword for the respective player."
    lineage:
      - datalake_semrush.keyword_attributes.url
  structure:
    description: "URL structure classification based on URL patterns and content type (e.g., 'Help', 'Informacional', 'Transacional', 'Home', 'Other')."
    lineage:
      - datalake_semrush.keyword_attributes.structure
  page_structure:
    description: "Page structure classification based on URL patterns and content type (e.g., 'Help', 'Content', 'Transacional', 'Condominium', 'Home', 'Other')."
    lineage:
      - datalake_semrush.keyword_attributes.page_structure
  page_cluster:
    description: "Page cluster classification based on URL patterns and content type (e.g., 'Help', 'Conteúdos', 'Regiões atendidas', 'Listing', 'Busca Compra', 'Busca Aluguel', 'Imobiliaria', 'Busca Genérica', 'Condominio', 'Home', 'Other')."
    lineage:
      - datalake_semrush.keyword_attributes.page_cluster
  trends:
    description: "Monthly trend values from SEMrush with brackets removed; comma‑separated list representing the last 12 months."
    lineage:
      - datalake_semrush.keyword_attributes.trends
  position:
    description: "Current organic position of the URL for the keyword (1-based)."
    lineage:
      - datalake_semrush.keyword_attributes.position
  previous_position:
    description: "Previous organic position of the URL for the keyword as reported by SEMrush."
    lineage:
      - datalake_semrush.keyword_attributes.previous_position
  position_difference:
    description: "Difference between current and previous positions (positive if improved)."
    lineage:
      - datalake_semrush.keyword_attributes.position_difference
  keyword_intents:
    description: "Keyword intent(s) mapped to human‑readable labels and lowercased. Multiple intents are comma‑separated."
    lineage:
      - datalake_semrush.keyword_attributes.keyword_intents
  position_type:
    description: "SEMrush position type classification for the ranking (e.g., organic variations)."
    lineage:
      - datalake_semrush.keyword_attributes.position_type
  serp_features_by_position:
    description: "SERP features present among the results positions, mapped to readable labels and lowercased; comma‑separated."
    lineage:
      - datalake_semrush.keyword_attributes.serp_features_by_position
  serp_features_by_keyword:
    description: "SERP features associated with the keyword overall, mapped to readable labels and lowercased; comma‑separated."
    lineage:
      - datalake_semrush.keyword_attributes.serp_features_by_keyword
  search_volume:
    description: "Average monthly search volume for the keyword according to SEMrush."
    lineage:
      - datalake_semrush.keyword_attributes.search_volume
  max_seach_volume_by_kw:
    description: "Maximum search volume for the same `keyword_clean` within the same year and month window. Calculated using window function MAX(search_volume) OVER (PARTITION BY keyword_clean, year, month)."
    lineage:
      - datalake_semrush.keyword_attributes.search_volume
  cpc:
    description: "Estimated cost per click (CPC) for the keyword from SEMrush."
    lineage:
      - datalake_semrush.keyword_attributes.cpc
  traffic:
    description: "Estimated organic traffic generated by the URL for the keyword."
    lineage:
      - datalake_semrush.keyword_attributes.traffic
  share_of_traffic:
    description: "Estimated share of traffic captured by the URL for this keyword."
    lineage:
      - datalake_semrush.keyword_attributes.share_of_traffic
  traffic_cost_percentage:
    description: "Estimated share of traffic cost attributable to this keyword and URL."
    lineage:
      - datalake_semrush.keyword_attributes.traffic_cost_percentage
  competition:
    description: "SEMrush competition score for the keyword in paid search."
    lineage:
      - datalake_semrush.keyword_attributes.competition
  number_of_results:
    description: "Approximate number of results returned by the search engine for the keyword."
    lineage:
      - datalake_semrush.keyword_attributes.number_of_results
  keyword_difficulty:
    description: "SEMrush keyword difficulty score (0–100)."
    lineage:
      - datalake_semrush.keyword_attributes.keyword_difficulty
  city_abbreviation:
    description: "Brazilian city/region abbreviation derived from page URL analysis. Values include: RJ (Rio de Janeiro), POA (Porto Alegre), BH (Belo Horizonte), BSB (Brasília), CWB (Curitiba), SP INTERIOR+LITORAL (São Paulo interior and coast), RMSP (São Paulo metropolitan region), RMSP OUTROS (Other São Paulo metropolitan areas), OUTROS (Other regions)"
    lineage:
      - datalake_semrush.keyword_attributes.city_abbreviation
  is_goldenset:
    description: "Boolean flag indicating whether the keyword is part of the strategic SEO golden set (true = golden set keyword, false = regular keyword)"
    lineage:
      - datalake_gsheets_clean.seo_goldenset.keyword
  has_mention_to_location:
    description: "Flag indicating whether the keyword mentions any location (city or neighborhood) directly or inferred via matches."
    lineage:
      - datalake_semrush.keyword_attributes.has_mention_to_location
  has_mention_to_neighborhood:
    description: "Flag indicating whether the keyword mentions or matches a neighborhood."
    lineage:
      - datalake_semrush.keyword_attributes.has_mention_to_neighborhood
  has_mention_to_city:
    description: "Flag indicating whether the keyword mentions or matches a city."
    lineage:
      - datalake_semrush.keyword_attributes.has_mention_to_city
  has_mention_to_country:
    description: "Flag indicating whether the keyword mentions a country."
    lineage:
      - datalake_semrush.keyword_attributes.has_mention_to_country
  has_mention_to_cep:
    description: "Flag indicating whether the keyword mentions a Brazilian postal code (CEP)."
    lineage:
      - datalake_semrush.keyword_attributes.has_mention_to_cep
  has_mention_to_city_zone:
    description: "Flag indicating whether the keyword mentions a city zone or region."
    lineage:
      - datalake_semrush.keyword_attributes.has_mention_to_city_zone
  has_mention_to_agent:
    description: "Flag indicating whether the keyword refers to an agent or owner-direct terms."
    lineage:
      - datalake_semrush.keyword_attributes.has_mention_to_agent
  has_mention_to_apartment:
    description: "Flag indicating whether the keyword refers to apartments or related synonyms."
    lineage:
      - datalake_semrush.keyword_attributes.has_mention_to_apartment
  has_mention_to_brokerage:
    description: "Flag indicating whether the keyword refers to brokerages or portals in a brokerage context."
    lineage:
      - datalake_semrush.keyword_attributes.has_mention_to_brokerage
  has_mention_to_company:
    description: "Flag indicating whether the keyword refers to companies, developers or administrators."
    lineage:
      - datalake_semrush.keyword_attributes.has_mention_to_company
  has_mention_to_condo:
    description: "Flag indicating whether the keyword refers to condominiums or buildings."
    lineage:
      - datalake_semrush.keyword_attributes.has_mention_to_condo
  has_mention_to_condo_facilities:
    description: "Flag indicating whether the keyword mentions condo facilities or amenities."
    lineage:
      - datalake_semrush.keyword_attributes.has_mention_to_condo_facilities
  has_mention_to_construction:
    description: "Flag indicating whether the keyword refers to construction or developers."
    lineage:
      - datalake_semrush.keyword_attributes.has_mention_to_construction
  has_mention_to_decor:
    description: "Flag indicating whether the keyword is about decor, furniture or interior topics rather than listings."
    lineage:
      - datalake_semrush.keyword_attributes.has_mention_to_decor
  has_mention_to_e_classified:
    description: "Flag indicating whether the keyword mentions e-classified portals."
    lineage:
      - datalake_semrush.keyword_attributes.has_mention_to_e_classified
  has_mention_to_guide_tips:
    description: "Flag indicating whether the keyword indicates guides, tips or informational content."
    lineage:
      - datalake_semrush.keyword_attributes.has_mention_to_guide_tips
  has_mention_to_helps_doubts:
    description: "Flag indicating whether the keyword indicates questions, how-tos or help intents."
    lineage:
      - datalake_semrush.keyword_attributes.has_mention_to_helps_doubts
  has_mention_to_house_type:
    description: "Flag indicating whether the keyword refers to houses or house-related property types."
    lineage:
      - datalake_semrush.keyword_attributes.has_mention_to_house_type
  has_mention_to_house_facilities:
    description: "Flag indicating whether the keyword mentions in-unit features or facilities."
    lineage:
      - datalake_semrush.keyword_attributes.has_mention_to_house_facilities
  has_mention_to_kitnet:
    description: "Flag indicating whether the keyword refers to kitnet/kitinete."
    lineage:
      - datalake_semrush.keyword_attributes.has_mention_to_kitnet
  has_mention_to_law_taxes_market:
    description: "Flag indicating whether the keyword mentions laws, taxes or market/economic terms."
    lineage:
      - datalake_semrush.keyword_attributes.has_mention_to_law_taxes_market
  has_mention_to_life_hack:
    description: "Flag indicating whether the keyword indicates repairs, fixes or day-to-day hacks."
    lineage:
      - datalake_semrush.keyword_attributes.has_mention_to_life_hack
  has_mention_to_non_related:
    description: "Flag indicating whether the keyword appears non-real-estate related."
    lineage:
      - datalake_semrush.keyword_attributes.has_mention_to_non_related
  has_mention_to_number:
    description: "Flag indicating whether the keyword contains numbers."
    lineage:
      - datalake_semrush.keyword_attributes.has_mention_to_number
  has_mention_to_other_house_types:
    description: "Flag indicating whether the keyword refers to other property types (e.g., commercial, land)."
    lineage:
      - datalake_semrush.keyword_attributes.has_mention_to_other_house_types
  has_mention_to_other_info:
    description: "Flag indicating whether the keyword mentions other miscellaneous attributes or qualifiers."
    lineage:
      - datalake_semrush.keyword_attributes.has_mention_to_other_info
  has_mention_to_platform:
    description: "Flag indicating whether the keyword mentions platforms, brands or portals (including QuintoAndar variants)."
    lineage:
      - datalake_semrush.keyword_attributes.has_mention_to_platform
  has_mention_to_poi:
    description: "Flag indicating whether the keyword mentions points of interest or proximity terms."
    lineage:
      - datalake_semrush.keyword_attributes.has_mention_to_poi
  has_mention_to_rent:
    description: "Flag indicating whether the keyword refers to renting intents or terms."
    lineage:
      - datalake_semrush.keyword_attributes.has_mention_to_rent
  has_mention_to_sale:
    description: "Flag indicating whether the keyword refers to selling/buying intents or terms."
    lineage:
      - datalake_semrush.keyword_attributes.has_mention_to_sale
  has_mention_to_short_term_homestays:
    description: "Flag indicating whether the keyword mentions short-term homestay platforms (e.g., Airbnb)."
    lineage:
      - datalake_semrush.keyword_attributes.has_mention_to_short_term_homestays
  has_mention_to_short_term_rental:
    description: "Flag indicating whether the keyword mentions short-term rental terms (e.g., weekend, monthly)."
    lineage:
      - datalake_semrush.keyword_attributes.has_mention_to_short_term_rental
  has_mention_to_state:
    description: "Flag indicating whether the keyword mentions states or state abbreviations."
    lineage:
      - datalake_semrush.keyword_attributes.has_mention_to_state
  has_mention_to_street:
    description: "Flag indicating whether the keyword mentions street names or address types."
    lineage:
      - datalake_semrush.keyword_attributes.has_mention_to_street
  has_mention_to_transaction_info_doubts:
    description: "Flag indicating whether the keyword mentions transaction process, documents, or doubts."
    lineage:
      - datalake_semrush.keyword_attributes.has_mention_to_transaction_info_doubts
  has_mention_to_vacation:
    description: "Flag indicating whether the keyword mentions vacation/holiday/seasonal contexts."
    lineage:
      - datalake_semrush.keyword_attributes.has_mention_to_vacation
  rent_subcategories:
    description: "Derived rent-related subcategory extracted from the keyword phrase (e.g., 'casas para alugar', 'kitnet', 'aluguel temporada')."
    lineage:
      - datalake_semrush.keyword_attributes.rent_subcategories
  business:
    description: "Cluster flag for business-relevant queries (house types, local matches, excluding non-related/other types)."
    lineage:
