database_name: datalake_ebdb_user
table_name: user_doorman
description: Enriched doorman affiliate profile data from EBDB, including work location, occupation, subscription source, and active status. Each row represents one doorman affiliate record linked to its affiliate data.
domain: Growth
owner: isadora.gallerani@quintoandar.com.br
columns:
  id:
    description: The primary key of the doorman affiliate data record in EBDB.
    lineage:
    - datalake_ebdb_clean.doorman_affiliate_data.id
  id_affiliate_data:
    description: Identifier of the affiliate record linked to the doorman profile.
    lineage:
    - datalake_ebdb_clean.affiliate_data.id
  id_doorman_occupation:
    description: Identifier of the doorman occupation category assigned to the affiliate.
    lineage:
    - datalake_ebdb_clean.doorman_affiliate_data.id_doorman_occupation
  id_place:
    description: Identifier of the place associated with the doorman work location.
    lineage:
    - datalake_ebdb_clean.doorman_affiliate_data.id_place
  country_code:
    lineage:
    - datalake_ebdb_country.user.country_code
    description: ISO country code of the doorman affiliate user, defaulting to Undefined when not available.
  work_address:
    description: Full work address reported by the doorman affiliate.
    lineage:
    - datalake_ebdb_clean.doorman_affiliate_data.work_address
  work_street:
    description: Street name of the doorman work address.
    lineage:
    - datalake_ebdb_clean.doorman_affiliate_data.work_street
  work_house_number:
    lineage:
    - datalake_ebdb_clean.doorman_affiliate_data.work_house_number
    description: House or building number of the doorman work location.
  work_neighborhood:
    description: Neighborhood of the doorman work address.
    lineage:
    - datalake_ebdb_clean.doorman_affiliate_data.work_neighborhood
  work_city:
    description: City of the doorman work address.
    lineage:
    - datalake_ebdb_clean.doorman_affiliate_data.work_city
  work_state:
    description: State of the doorman work address.
    lineage:
    - datalake_ebdb_clean.doorman_affiliate_data.work_state
  lat:
    description: Latitude coordinate of the doorman work location.
    lineage:
    - datalake_ebdb_clean.doorman_affiliate_data.lat
  lng:
    description: Longitude coordinate of the doorman work location.
    lineage:
    - datalake_ebdb_clean.doorman_affiliate_data.lng
  recruiter:
    description: Name of the recruiter responsible for onboarding the doorman affiliate.
    lineage:
    - datalake_ebdb_clean.doorman_affiliate_data.recrutier
  subscription_source:
    description: Channel or source through which the doorman affiliate subscribed to the program.
    lineage:
    - datalake_ebdb_clean.doorman_affiliate_data.subscription_source
  occupation_name:
    description: Human-readable name of the doorman occupation category.
    lineage:
    - datalake_ebdb_clean.doorman_affiliate_occupation.name
  is_active:
    description: |
      Flag indicating whether the affiliate is an active doorman partner. Built as
      id_doorman_affiliate_data IS NOT NULL on affiliate_data, affiliate_type = 'Doorman',
      and ts_joined IS NOT NULL on doorman_affiliate_data.
    lineage:
    - datalake_ebdb_clean.affiliate_data.id_doorman_affiliate_data
    - datalake_ebdb_clean.affiliate_data.affiliate_type
    - datalake_ebdb_clean.doorman_affiliate_data.ts_joined
  ts_joined:
    description: Timestamp when the doorman affiliate joined the program.
    lineage:
    - datalake_ebdb_clean.doorman_affiliate_data.ts_joined
  ts_created:
    description: Timestamp when the doorman affiliate record was created in EBDB.
    lineage:
    - datalake_ebdb_clean.doorman_affiliate_data.ts_created
  ts_updated:
    description: Timestamp when the doorman affiliate record was last updated in EBDB.
    lineage:
    - datalake_ebdb_clean.doorman_affiliate_data.ts_updated
