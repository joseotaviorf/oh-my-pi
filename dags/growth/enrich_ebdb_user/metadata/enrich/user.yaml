database_name: datalake_ebdb_user
table_name: user
description:
  Enrich table with information of every user from EBDB along with timestamps of
  relevant events, contact, bank account and address information
domain: Growth
owner: arthur.gonzaga@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_ebdb_clean.user.id
    description: User ID from EBDB
  id_country:
    lineage:
      - datalake_ebdb_country.user.id_country
    description: Country ID
  uuid_person:
    lineage:
      - datalake_ebdb_clean.user.uuid_person
    description: Person ID. Joins with uuid_person on datalake_person_clean.person.
  id_facebook:
    lineage:
      - datalake_ebdb_clean.user.id_facebook
    description: Facebook ID
  id_linkedin:
    lineage:
      - datalake_ebdb_clean.user.id_linkedin
    description: Linkedin ID
  id_google:
    lineage:
      - datalake_ebdb_clean.user.id_google
    description: Google ID
  id_agent:
    lineage:
      - datalake_ebdb_clean.user.id_agent
    description: Agent ID, if the user is an agent
  id_photographer_data:
    lineage:
      - datalake_ebdb_clean.user.id_photographer_data
    description: Photographer ID, if the user is a photographer
  id_sales_rep:
    lineage:
      - datalake_ebdb_clean.user.id_sales_rep
    description: Sales rep ID, if the user is a sales rep
  id_affiliates:
    lineage:
      - datalake_ebdb_clean.user.id_affiliates
    description: ID affiliates
  id_bank:
    lineage:
      - datalake_ebdb_clean.user.id_bank
    description: Bank ID of the user account
  id_state:
    lineage:
      - datalake_ebdb_clean.user.id_state
    description: ID of the state where the user address is from
  country_code:
    lineage:
      - datalake_ebdb_country.user.country_code
    description: Country code of te user
  cpf:
    lineage:
      - datalake_ebdb_clean.user.cpf
    description: CPF (Cadastro de Pessoa Física) of the user
  rg:
    lineage:
      - datalake_ebdb_clean.user.rg
    description: RG (Registro Geral) of the user
  gender:
    lineage:
      - datalake_ebdb_clean.user.gender
    description: User's gender
  email:
    lineage:
      - datalake_ebdb_clean.user.email
    description: User's email
  alternative_email:
    lineage:
      - datalake_ebdb_clean.user.alternative_email
    description: An email different from the 'email' column
  name:
    lineage:
      - datalake_ebdb_clean.user.name
    description: Users's name
  admin_type:
    lineage:
      - datalake_ebdb_clean.user.admin_type
    description: Type of admin
  address:
    lineage:
      - datalake_ebdb_clean.user.address
    description: Address of the user
  number:
    lineage:
      - datalake_ebdb_clean.user.number
    description: User's address number
  complement:
    lineage:
      - datalake_ebdb_clean.user.complement
    description: Complementary information on the user's address
  neighborhood:
    lineage:
      - datalake_ebdb_clean.user.neighborhood
    description: Represents 'Bairro', related to the user's address
  city:
    lineage:
      - datalake_ebdb_clean.user.city
    description: City where the address is from
  zip_code:
    lineage:
      - datalake_ebdb_clean.user.zip_code
    description: Address Zip Code
  uf:
    lineage:
      - datalake_ebdb_clean.user.id_state
    description: State where the address is from
  main_phone:
    lineage:
      - datalake_ebdb_clean.user.main_phone
    description: User main phone number
  main_phone_ddd:
    lineage:
      - datalake_ebdb_clean.user.main_phone
    description: User main phone number DDD - indicates the city where number is from
  bank_agency:
    lineage:
      - datalake_ebdb_clean.user.bank_agency
    description: Bank agency number
  bank_account:
    lineage:
      - datalake_ebdb_clean.user.bank_account
    description: Bank account number
  bank_cpf_cnpj:
    lineage:
      - datalake_ebdb_clean.user.bank_cpf_cnpj
    description: CPF/CNPJ of the bank
  bank_name:
    lineage:
      - datalake_ebdb_clean.user.bank_name
    description: Name of the bank where the user's bank account is
  bank_another_holder:
    lineage:
      - datalake_ebdb_clean.user.bank_another_holder
    description: Boolean indicating if the account is held by someone other than the user
  bank_account_type:
    lineage:
      - datalake_ebdb_clean.user.bank_account_type
    description: Bank account type
  has_accepted_sms:
    lineage:
      - datalake_ebdb_clean.user.has_accepted_sms
    description: Boolean if the user has accepted sms
  is_active:
    lineage:
      - datalake_ebdb_clean.user.is_active
    description: Boolean indicating if the user is active
  is_blocked:
    lineage:
      - datalake_ebdb_clean.user.is_blocked
    description: Boolean indicating if the user is blocked
  dt_birth:
    lineage:
      - datalake_ebdb_clean.user.dt_birth
    description: User's date of birth
  ts_click_anuncie:
    lineage:
      - datalake_ebdb_clean.user.ts_click_anuncie
    description: Timestamp from click anuncie
  ts_first_document_sent:
    lineage:
      - datalake_ebdb_clean.proposal.ts_documentation_sent
    description: Timestamp of when the user first sent documentations
  ts_last_document_sent:
    lineage:
      - datalake_ebdb_clean.proposal.ts_documentation_sent
    description: Timestamp of when the user last sent documentations
  ts_first_sent_to_insurance:
    lineage:
      - datalake_ebdb_user.user_revision_entity.ts_revision
    description: Timestamp of the first insurance revision
  ts_created:
    lineage:
      - datalake_ebdb_clean.user.ts_created
    description: Timestamp of when the user was created
  ts_updated:
    lineage:
      - datalake_ebdb_clean.user.ts_updated
    description: Timestamp of when the user was last updated
