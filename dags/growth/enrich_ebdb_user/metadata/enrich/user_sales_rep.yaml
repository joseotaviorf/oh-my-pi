database_name: datalake_ebdb_user
table_name: user_sales_rep
description: For each line of the table we have a sales representative user, who will assist in selling the property.
domain: Growth
owner: arthur.gonzaga@quintoandar.com.br
columns:
  id_user_sales_rep:
    lineage:
      - datalake_ebdb_clean.user.id
    description: User ID, used to identify everyone in the company including customers.
  country_code:
    lineage:
      - datalake_ebdb_country.user.country_code
    description: Acronym used to identify the country (For example 'BR').
  name:
    lineage:
      - datalake_ebdb_clean.user.name
    description: Field used to identify the user name.
  email:
    lineage:
      - datalake_ebdb_clean.user.email
    description: Field used to identify the user e-mail.
  phone_number:
    lineage:
      - datalake_ebdb_clean.user.main_phone
    description: Field used to identify the user phone number.
  admin_type:
    lineage:
      - datalake_ebdb_clean.user.admin_type
    description: Type of administrative profile in the system
  sales_company:
    description: Which company is helping the sales process.
  is_sales_rep_active:
    lineage:
      - datalake_ebdb_clean.user.is_active
      - datalake_ebdb_clean.sales_rep.is_active
    description: Boolean field that identifies whether the representative user is active
  dt_sales_rep_started:
    lineage:
      - datalake_ebdb_clean.user.ts_created
      - datalake_ebdb_clean.sales_rep.ts_contract_started
    description: Field that shows when the user started being a sales representative
