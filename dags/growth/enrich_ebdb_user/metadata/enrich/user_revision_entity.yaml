database_name: datalake_ebdb_user
table_name: user_revision_entity
domain: Growth
owner: arthur.gonzaga@quintoandar.com.br
description: Enriched table that has all the revisions (updates in audit tables) made by an user from EBDB.
  Using the id column, it's possible to join with another aud table that has the rev column.
columns:
  id:
    lineage:
      - datalake_ebdb_clean.user_revision_entity.id
    description: "Unique id of the user revision entity. It should be used to join with other tables, using the rev column.
      Example: user_revision_entity.id = contract_aud.rev"
  id_user:
    lineage:
      - datalake_ebdb_clean.user_revision_entity.id_user
    description: "Id that identifies the user that made the revision."
  country_code:
    lineage:
      - datalake_ebdb_country.user.country_code
    description: "Country code of the user."
  reason:
    lineage:
      - datalake_ebdb_clean.user_revision_entity.reason
    description: "The reason related to the revision, what led to it."
  ts_revision:
    lineage:
      - datalake_ebdb_clean.user_revision_entity.ts_revision
    description: "Timestamp of when the revision happened."
