cluster:
  type: emr_7_12_consolidation_s_general_fleet_cluster
  custom_libraries:
  - maven:
      # Not on Maven Central — Spark Packages hosts GraphFrames.
      coordinates: graphframes:graphframes:0.8.1-spark3.0-s_2.12
      repo: https://repos.spark-packages.org
  custom_configurations:
    aws_attributes:
      ebs_volume_size: 200
    spark_conf:
      spark.sql.sources.partitionOverwriteMode: static
    core_nodes:
      target_on_demand: 3
      target_spot: 0
      instance_types:
      - m6g.xlarge
      - m7g.xlarge
