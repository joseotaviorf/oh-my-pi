---
database_name: datalake_consolidated_growth_metrics
table_name: trovit_consolidated_metrics
owner: henrique.paulo@quintoandar.com.br
domain: Growth
description: |
  Enrich layer consolidating Trovit (Lifull) campaign spend and clicks. Grain is one row per
  calendar day (id_date) and campaign from datalake_lifull_campaigns_clean.trovit_campaigns. Costs
  are split into desktop and mobile; impressions are not available for this platform. Consumed by
  consolidated_media_metrics. Physically partitioned by id_date (integer YYYYMMDD,
  default_partitions in enrich_consolidated_growth_metrics DAG); no Z-ORDER is configured. Always
  filter id_date in WHERE clauses for partition pruning.
columns:
  campaign_name:
    description: Name of campaign segmentation
    lineage:
      - datalake_lifull_campaigns_clean.trovit_campaigns.campaign_name
  account_name:
    description: Accont name at mitula platform
    lineage:
      - datalake_lifull_campaigns_clean.trovit_campaigns.account_name
  country_code:
    description: ISO country code for the campaign market (BR or MX).
    lineage:
      - datalake_lifull_campaigns_clean.trovit_campaigns.country_code
    categories:
      BR: Brazil
      MX: Mexico
  utm_campaign:
    description: utm_campaign applied on growth marketing platform
    lineage:
      - datalake_lifull_campaigns_clean.trovit_campaigns.campaign_name
  desktop_cost:
    description: Cost spent on desktop plataform
    lineage:
      - datalake_lifull_campaigns_clean.trovit_campaigns.desktop_cost
  mobile_cost:
    description: Cost spent on mobile plataform
    lineage:
      - datalake_lifull_campaigns_clean.trovit_campaigns.mobile_cost
  total_cost:
    description: Sum of advertising spend in BRL across all devices for the reporting date
    lineage:
      - datalake_lifull_campaigns_clean.trovit_campaigns.total_cost
  clicks:
    description: Clicks from mitula platform
    lineage:
      - datalake_lifull_campaigns_clean.trovit_campaigns.clicks
  id_date:
    description: |
      Table partition column (integer calendar date, YYYYMMDD). Derived from dt_attribution.
      Required in WHERE clauses for partition pruning — restrict to the smallest date window
      needed. Example: WHERE id_date BETWEEN 20260101 AND 20260131. Queries without id_date
      filters will scan the entire table. Joins with dim_date.sk_date.
