---
database_name: datalake_consolidated_growth_metrics
table_name: rtb_consolidated_metrics
owner: henrique.paulo@quintoandar.com.br
domain: Growth
description: |
  Enrich layer consolidating RTB House campaign performance and spend. Grain is one row per calendar
  day (id_date) and sub-campaign from datalake_rtb_campaigns_clean.rtb_campaigns. All spend is
  mapped to other_cost and total_cost (RTB does not split by device). Consumed by
  consolidated_media_metrics. Physically partitioned by id_date (integer YYYYMMDD,
  default_partitions in enrich_consolidated_growth_metrics DAG); no Z-ORDER is configured. Always
  filter id_date in WHERE clauses for partition pruning.
columns:
  id_date:
    description: |
      Table partition column (integer calendar date, YYYYMMDD). Derived from dt_attribution.
      Required in WHERE clauses for partition pruning — restrict to the smallest date window
      needed. Example: WHERE id_date BETWEEN 20260101 AND 20260131. Queries without id_date
      filters will scan the entire table. Joins with dim_date.sk_date.
    lineage:
      - datalake_rtb_campaigns_clean.rtb_campaigns.dt_attribution
  campaign_name:
    description: Name of campaign segmentation
    lineage:
      - datalake_rtb_campaigns_clean.rtb_campaigns.sub_campaign_name
  account_name:
    description: Accont name at rtb platform
    lineage:
      - datalake_rtb_campaigns_clean.rtb_campaigns.account_name
  country_code:
    description: ISO country code for the campaign market (BR or MX).
    lineage:
      - datalake_rtb_campaigns_clean.rtb_campaigns.country_code
    categories:
      BR: Brazil
      MX: Mexico
  utm_campaign:
    description: utm_campaign applied on growth marketing platform
    lineage:
      - datalake_rtb_campaigns_clean.rtb_campaigns.sub_campaign_name
  other_cost:
    description: Cost from any platform different from desktop or mobile
    lineage:
      - datalake_rtb_campaigns_clean.rtb_campaigns.cost
  total_cost:
    description: Sum of advertising spend in BRL across all devices for the reporting date
    lineage:
      - datalake_rtb_campaigns_clean.rtb_campaigns.cost
  impressions:
    description: Impressions from facebook ads platform
    lineage:
      - datalake_rtb_campaigns_clean.rtb_campaigns.impressions
  clicks:
    description: Clicks from facebook ads platform
    lineage:
      - datalake_rtb_campaigns_clean.rtb_campaigns.clicks
