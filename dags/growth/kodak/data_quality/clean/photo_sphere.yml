---
table_name: datalake_kodak_clean.photo_sphere
alert_channel: GROWTH_ALERTS
table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: -10
    less_than_or_equal_to: 50
    severity_level: Warning

column_level_validations:
  id:
    is_unique:
      severity_level: Error
    is_complete:
      severity_level: Error
  id_external_domain:
    is_complete:
      severity_level: Error
  external_domain:
    is_complete:
      severity_level: Error
    is_contained_in:
      values:
        - HOUSE
        - BUILDING_VENTURE
        - LEAD3P
        - ATLAS
      severity_level: Error
  path:
    is_complete:
      severity_level: Error