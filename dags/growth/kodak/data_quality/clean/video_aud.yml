---
table_name: datalake_kodak_clean.video_aud
alert_channel: GROWTH_ALERTS
table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: -10
    less_than_or_equal_to: 50
    severity_level: Warning

column_level_validations:
  id:
    is_complete:
      severity_level: Error
  one_row_per_id_and_rev:
    custom:
      # No duplicate rows for the same (id, rev) composite key.
      constraint: "(SELECT COUNT(*) FROM (SELECT 1 FROM datalake_kodak_clean.video_aud GROUP BY id, rev HAVING COUNT(*) > 1)) = 0"
      severity_level: Error
  rev:
    is_complete:
      severity_level: Error
  rev_type:
    is_contained_in:
      values:
        - "0"
        - "1"
        - "2"
      severity_level: Error
  external_domain:
    is_contained_in:
      values:
        - HOUSE
        - BUILDING_VENTURE
        - LEAD3P
        - ATLAS
      severity_level: Warning
  video_source:
    is_contained_in:
      values:
        - YOUTUBE
        - VIMEO
        - S3
      severity_level: Warning