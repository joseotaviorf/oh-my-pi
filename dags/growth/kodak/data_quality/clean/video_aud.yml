---
table_name: datalake_kodak_clean.video_aud
alert_channel: "#alerts-de-airflow-dags"

table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: -10
    less_than_or_equal_to: 50
    severity_level: Warning

column_level_validations:
  id:
    is_complete:
      severity_level: Error
    custom:
      constraint: "GROUP BY id, rev HAVING COUNT(*) > 1"
      empty_result_is_valid: true
      severity_level: Error
  rev:
    is_complete:
      severity_level: Error
  rev_type:
    is_contained_in:
      values:
        - "0"
        - "1"
        - "2"
      severity_level: Error
  external_domain:
    is_contained_in:
      values:
        - HOUSE
        - BUILDING_VENTURE
        - LEAD3P
        - ATLAS
      severity_level: Warning
  video_source:
    is_contained_in:
      values:
        - YOUTUBE
        - VIMEO
        - S3
      severity_level: Warning
  year:
    is_complete:
      severity_level: Error
  month:
    is_complete:
      severity_level: Error
    has_min_value:
      greater_than_or_equal_to: 1
      severity_level: Error
    has_max_value:
      less_than_or_equal_to: 12
      severity_level: Error
  day:
    is_complete:
      severity_level: Error
    has_min_value:
      greater_than_or_equal_to: 1
      severity_level: Error
    has_max_value:
      less_than_or_equal_to: 31
      severity_level: Error
