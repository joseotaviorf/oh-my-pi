---
table_name: datalake_kodak_clean.watermark_removal
alert_channel: GROWTH_ALERTS
table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: -10
    less_than_or_equal_to: 50
    severity_level: Warning

column_level_validations:
  id:
    is_unique:
      severity_level: Error
    is_complete:
      severity_level: Error
  id_image_inspection:
    is_complete:
      severity_level: Error
  provider:
    is_complete:
      severity_level: Error
    is_contained_in:
      values:
        - VANISH
        - PIXELBIN
      severity_level: Error
  url:
    is_complete:
      severity_level: Error
  ts_created:
    is_complete:
      severity_level: Error
  ts_updated:
    is_complete:
      severity_level: Error
  failure_reason:
    is_contained_in:
      values:
        - REMOVAL_UNSUCCESSFUL
        - PROCESS_ERROR
        - EXTERNAL_API_NOT_ACCESSIBLE
      severity_level: Warning