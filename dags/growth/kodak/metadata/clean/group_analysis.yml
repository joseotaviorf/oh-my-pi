---
database_name: datalake_kodak_clean
table_name: group_analysis
description: |
  Stores raw, unprocessed JSON results from AI providers performing property-level image group analysis in Kodak's inspection pipeline. Each row contains the complete response payload from AI services (RestB.ai, CasaMineira, etc.) before data parsing and normalization into structured fields. This table preserves the original AI output for debugging, reprocessing, algorithm improvements, and audit purposes, serving as the source of truth for all derived group-level analysis metrics.
domain: Growth
owner: vitor.musachio@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_kodak_raw.group_analysis.id
    description: 'Unique identifier for each raw group analysis result record. Primary key used for linking with processed analysis results and debugging workflows.'
  id_inspection_group:
    lineage:
      - datalake_kodak_raw.group_analysis.id_inspection_group
    description: 'Foreign key reference to the image_inspection_group table. Links the raw AI analysis results to the specific property-level image group that was analyzed.'
  result:
    lineage:
      - datalake_kodak_raw.group_analysis.result
    description: 'Complete raw JSON response from AI providers containing unprocessed property-level analysis results. Includes all metrics, scores, classifications, and metadata returned by the AI service before parsing into structured database fields. Used for reprocessing, algorithm updates, and debugging analysis workflows.'