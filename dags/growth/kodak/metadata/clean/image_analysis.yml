---
database_name: datalake_kodak_clean
table_name: image_analysis
description: |
  Stores raw, unprocessed JSON results from AI providers performing individual image analysis in Kodak's inspection pipeline. Each row contains the complete response payload from AI services (RestB.ai, CasaMineira, Image Quality Analyzer, etc.) before data parsing and normalization into structured fields. This table preserves the original AI output for debugging, reprocessing, model improvements, and audit purposes, serving as the source of truth for all derived individual image analysis metrics and quality scores.
domain: Growth
owner: vitor.musachio@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_kodak_raw.image_analysis.id
    description: 'Unique identifier for each raw image analysis result record. Primary key used for linking with processed analysis results and debugging AI provider responses.'
  id_inspection:
    lineage:
      - datalake_kodak_raw.image_analysis.id_inspection
    description: 'Foreign key reference to the image_inspection table. Links the raw AI analysis results to the specific individual image inspection record that was analyzed.'
  result:
    lineage:
      - datalake_kodak_raw.image_analysis.result
    description: 'Complete raw JSON response from AI providers containing unprocessed individual image analysis results. Includes all quality metrics, room classifications, compliance flags, scores, and metadata returned by the AI service before parsing into structured database fields. Essential for reprocessing, algorithm updates, and debugging image analysis workflows.'
  op_cdc:
    lineage:
      - datalake_kodak_raw.image_analysis.op_cdc
    description: CDC operation type captured by Debezium change-data-capture stream.
    categories:
      r: Read/snapshot - initial load of existing records.
      c: Create - new record inserted.
      u: Update - existing record modified.
      d: Delete - record removed.
  ts_cdc_transaction:
    lineage:
      - datalake_kodak_raw.image_analysis.ts_cdc_transaction
    description: Wall-clock timestamp when the CDC connector captured this change event (millisecond precision).
  ts_database_transaction:
    lineage:
      - datalake_kodak_raw.image_analysis.ts_database_transaction
    description: Timestamp of the originating database transaction in the source application before CDC propagation.