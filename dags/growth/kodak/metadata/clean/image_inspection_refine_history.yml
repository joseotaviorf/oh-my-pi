---
database_name: datalake_kodak_clean
table_name: image_inspection_refine_history
description: |
  Audit log of the "Refine - Photo Lever" initiative, which reprocesses property images previously rejected by the Kodak Supply Processor for not meeting quality standards in order to recover them as eligible First Listings (FLs). Each row represents a single execution of the refine Python workflow over one rejected image and stores the full before/after state — quality scores, brightness, sharpness and storage URLs — to provide end-to-end traceability of the impact of refine, support data analysis on FL recovery and enable auditing of every transformation applied to an image. Grain: one row per refine attempt over an image. Primary key: id. The image inspection and image inspection group identifiers (id_image_inspection, id_image_inspection_group) are tracking identifiers used by the refine workflow and are not enforced as foreign keys in the source. The lead context is preserved through uuid_lead.
domain: Growth
owner: vitor.musachio@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_kodak_raw.image_inspection_refine_history.id
    description: 'Unique identifier of the refine execution record. Primary key, auto-incremented in the source.'
  id_image_inspection:
    lineage:
      - datalake_kodak_raw.image_inspection_refine_history.image_inspection_id
    description: 'Identifier of the individual image inspection record that was reprocessed by the Refine - Photo Lever workflow. Tracking identifier captured by the refine pipeline; not enforced as a foreign key in the source database.'
  id_image_inspection_group:
    lineage:
      - datalake_kodak_raw.image_inspection_refine_history.image_inspection_group_id
    description: 'Identifier of the property/listing-level inspection group whose rejected images are being recovered through the Refine - Photo Lever workflow. Tracking identifier captured by the refine pipeline; not enforced as a foreign key in the source database.'
  uuid_lead:
    lineage:
      - datalake_kodak_raw.image_inspection_refine_history.lead_uuid
    description: 'UUID of the lead whose property images are being refined. Preserves the lead context so refine outcomes can be linked back to the originating supply lead for FL recovery analysis.'
  error_message:
    lineage:
      - datalake_kodak_raw.image_inspection_refine_history.error
    description: 'Free-text error message captured when the refine Python workflow could not complete successfully for the image. Null when the refine attempt finished without errors. Used for monitoring failure patterns and debugging refine execution issues.'
  ts_created:
    lineage:
      - datalake_kodak_raw.image_inspection_refine_history.created_at
    description: 'Timestamp (without timezone) when the refine execution record was created in Kodak, i.e. when the refine workflow finished processing the image. Used as the temporal anchor for FL recovery analysis and for partitioning.'
  image_attributes:
    lineage:
      - datalake_kodak_raw.image_inspection_refine_history.image_attributes
    description: |
      JSONB payload capturing the image quality attributes measured before and after the refine workflow. Used to quantify the quality uplift produced by refine and to evaluate whether a previously rejected image now meets the FL acceptance thresholds.

      Expected structure:
        {
          "listOfQualities": {
            "beforeRefine": [<float>, ...],
            "afterRefine":  [<float>, ...]
          },
          "brightness": { "beforeRefine": <float>, "afterRefine": <float> },
          "sharpness":  { "beforeRefine": <float>, "afterRefine": <float> },
          "quality":    { "beforeRefine": <float>, "afterRefine": <float> }
        }

      All numeric metrics are normalized scores in the 0-1 range as produced by Kodak's image quality analyzers.
  urls:
    lineage:
      - datalake_kodak_raw.image_inspection_refine_history.urls
    description: |
      JSONB payload with the storage URLs of the image before and after refine. Enables auditing of the file transformation and links the original rejected media to the refined media uploaded back to S3.

      Expected structure:
        {
          "oldUrl": "<original image URL>",
          "newUrl": "<refined image S3 URL>"
        }
  year:
    lineage:
      - datalake_kodak_raw.image_inspection_refine_history.year
    description: 'Year partition key derived from the creation timestamp at the raw layer. Used together with month and day to optimize partition pruning on incremental loads.'
  month:
    lineage:
      - datalake_kodak_raw.image_inspection_refine_history.month
    description: 'Month partition key derived from the creation timestamp at the raw layer. Used together with year and day to optimize partition pruning on incremental loads.'
  day:
    lineage:
      - datalake_kodak_raw.image_inspection_refine_history.day
    description: 'Day partition key derived from the creation timestamp at the raw layer. Used together with year and month to optimize partition pruning on incremental loads.'
  op_cdc:
    lineage:
      - datalake_kodak_raw.image_inspection_refine_history.op_cdc
    description: CDC operation type captured by Debezium change-data-capture stream.
    categories:
      r: Read/snapshot - initial load of existing records.
      c: Create - new record inserted.
      u: Update - existing record modified.
      d: Delete - record removed.
  ts_cdc_transaction:
    lineage:
      - datalake_kodak_raw.image_inspection_refine_history.ts_cdc_transaction
    description: Wall-clock timestamp when the CDC connector captured this change event (millisecond precision).
  ts_database_transaction:
    lineage:
      - datalake_kodak_raw.image_inspection_refine_history.ts_database_transaction
    description: Timestamp of the originating database transaction in the source application before CDC propagation.