---
database_name: datalake_kodak_clean
table_name: photo
description: |
  Core table containing metadata for all photos stored in Kodak's media management system. Each row represents a unique photo with its S3 storage path, external domain association, and flexible JSON metadata containing source URLs, processing information, and other photo-specific attributes. This table serves as the foundation for all photo-related analytics and is referenced by image inspection processes.
domain: Growth
owner: vitor.musachio@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_kodak_raw.photo.id
    description: 'Unique identifier for each photo record in the Kodak system. Primary key used for referencing in image inspection and analysis tables.'
  id_external_domain:
    lineage:
      - datalake_kodak_raw.photo.externaldomainid
    description: 'External identifier linking the photo to records in other systems (houses, leads, buildings, etc.). The interpretation depends on the external_domain value.'
  external_domain:
    lineage:
      - datalake_kodak_raw.photo.externaldomain
    description: 'Domain classification indicating which external system this photo belongs to.'
    categories:
      HOUSE: 'Photo belongs to a QuintoAndar house listing'
      BUILDING_VENTURE: 'Photo belongs to a building or real estate venture'
      LEAD3P: 'Photo belongs to a third-party partner lead'
      ATLAS: 'Photo belongs to Atlas system (internal tooling)'
  metadata:
    lineage:
      - datalake_kodak_raw.photo.metadata
    description: 'JSON object containing flexible photo metadata including source_url (original photo location), processing timestamps, file format information, and other photo-specific attributes that vary by source system.'
  path:
    lineage:
      - datalake_kodak_raw.photo.path
    description: 'S3 object key/path where the photo file is stored in QuintoAndar cloud storage. Used for generating public URLs and accessing the actual image file.'