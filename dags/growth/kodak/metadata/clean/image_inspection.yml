---
database_name: datalake_kodak_clean
table_name: image_inspection
description: |
  Contains comprehensive AI-powered analysis results for individual property images processed through Kodak's image inspection pipeline. Each row represents a single image analysis combining multiple AI providers (RestB.ai, CasaMineira, Image Quality Analyzer) to generate quality scores, compliance flags, room classification, and automated approval decisions. This table is central to QuintoAndar's automated photo quality control and property listing optimization workflows.
domain: Growth
owner: vitor.musachio@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_kodak_raw.image_inspection.id
    description: 'Unique identifier for each image inspection record. Primary key used for linking with watermark removal processes and analysis results.'
  id_photo:
    lineage:
      - datalake_kodak_raw.image_inspection.id_photo
    description: 'Foreign key reference to the photo table. Links the inspection results to the original photo metadata and S3 storage information.'
  id_group:
    lineage:
      - datalake_kodak_raw.image_inspection.id_group
    description: 'Foreign key reference to image_inspection_group table. Groups individual image inspections by property/listing for aggregate analysis and approval decisions.'
  id_duplicate:
    lineage:
      - datalake_kodak_raw.image_inspection.duplicate_id
    description: 'Reference to another image inspection record if this image is identified as a duplicate. Used for deduplication workflows and preventing duplicate content.'
  deduplication_hash:
    lineage:
      - datalake_kodak_raw.image_inspection.dhash
    description: 'Perceptual hash (dHash) used for image deduplication. Enables identification of visually similar or identical images across different properties and partners.'
  url:
    lineage:
      - datalake_kodak_raw.image_inspection.url
    description: 'Original URL of the image being analyzed. May differ from the final S3 path if the image was downloaded and reprocessed.'
  house_place:
    lineage:
      - datalake_kodak_raw.image_inspection.house_place
    description: 'AI-classified location category of the image within the property context.'
    categories:
      INTERNAL: 'Interior photos of the property (rooms, hallways, etc.)'
      EXTERNAL: 'Exterior photos of the property (facade, entrance, etc.)'
      VIEW: 'View photos showing surroundings or vistas from the property'
      NOT_PROPERTY: 'Photos that do not show the actual property'
      UNDEFINED: 'Unable to classify the image location'
  room_type:
    lineage:
      - datalake_kodak_raw.image_inspection.room_type
    description: 'AI-identified specific room or area type within the property. Used for amenity detection and property completeness analysis. Examples include living_room, bedroom, kitchen, bathroom, etc.'
  status:
    lineage:
      - datalake_kodak_raw.image_inspection.status
    description: 'Current processing status of the image inspection workflow.'
    categories:
      DOWNLOAD_PENDING: 'Image download from source URL pending'
      INITIAL_PROCESS_PENDING: 'Initial processing and validation pending'
      IMAGE_QUALITY_ANALYZER_PENDING: 'AI quality analysis pending'
      RESTB_VISION_PENDING: 'RestB.ai vision analysis pending'
      RESTB_PROPERTY_PENDING: 'RestB.ai property analysis pending'
      UPLOAD_PENDING: 'Upload to final storage pending'
      WATERMARK_REMOVAL_PENDING: 'Watermark detection/removal pending'
      NOISE_DETECTION_PENDING: 'Noise detection analysis pending'
      COMPLETED: 'All analysis steps completed'
  photo_invalid_source_reason:
    lineage:
      - datalake_kodak_raw.image_inspection.photo_invalid_source_reason
    description: 'Reason why the photo source was considered invalid during inspection. Populated when the image could not be properly processed from its original source.'
    categories:
      INVALID_URL: 'Source URL is malformed or invalid'
      EMPTY_BODY: 'Response body from the image source was empty'
      IMAGE_NOT_FOUND: 'Image was not found at the source location'
      READER_NOT_FOUND: 'No suitable reader found to process the image format'
      EXTENSION_NOT_SUPPORTED: 'Image file extension is not supported by the pipeline'
      EMPTY_IMAGE: 'Image file exists but contains no valid image data'
      IMPROPER_ENCODING: 'Image encoding is invalid or corrupted'
      UNABLE_TO_ACCESS_EXTERNAL_URL: 'Unable to access external URL for download, typically due to domain blocking'
  description:
    lineage:
      - datalake_kodak_raw.image_inspection.description
    description: 'Human-readable description or notes about the image analysis results, often containing additional context or processing information.'
  width:
    lineage:
      - datalake_kodak_raw.image_inspection.width
    description: 'Image width in pixels. Used for resolution analysis and aspect ratio calculations.'
  height:
    lineage:
      - datalake_kodak_raw.image_inspection.height
    description: 'Image height in pixels. Used for resolution analysis and aspect ratio calculations.'
  ratio:
    lineage:
      - datalake_kodak_raw.image_inspection.ratio
    description: 'Calculated aspect ratio (width/height) of the image. Used for compliance checking against platform requirements.'
  sharpness:
    lineage:
      - datalake_kodak_raw.image_inspection.sharpness
    description: 'AI-calculated sharpness score (0-100 scale). Higher values indicate clearer, more focused images. Critical for photo quality assessment.'
  brightness:
    lineage:
      - datalake_kodak_raw.image_inspection.brightness
    description: 'AI-calculated brightness score (0-100 scale). Measures image exposure and lighting quality. Values too high or low may indicate poor photo quality.'
  framing:
    lineage:
      - datalake_kodak_raw.image_inspection.framing
    description: 'AI-calculated framing score (0-100 scale). Evaluates photo composition, including object positioning and visual balance within the frame.'
  condition:
    lineage:
      - datalake_kodak_raw.image_inspection.condition
    description: 'AI-assessed property condition score (0-10 scale) based on visual analysis of the property state, cleanliness, and maintenance level.'
  ordination:
    lineage:
      - datalake_kodak_raw.image_inspection.ordination
    description: 'Sequential order or position of the image within the property listing. Used for determining primary/secondary photos and display order.'
  is_approved:
    lineage:
      - datalake_kodak_raw.image_inspection.approved
    description: 'Boolean flag indicating whether the image passed all quality and compliance checks for publication. True means the image is approved for listing display.'
  has_red_flag_watermark:
    lineage:
      - datalake_kodak_raw.image_inspection.red_flag_watermark
    description: 'Critical flag: True if AI detected watermarks or copyright marks that violate platform policies. Typically blocks image approval.'
  has_red_flag_compliance:
    lineage:
      - datalake_kodak_raw.image_inspection.red_flag_compliance
    description: 'Critical flag: True if image violates platform compliance rules (inappropriate content, policy violations, etc.). Blocks image approval.'
  has_red_flag_size:
    lineage:
      - datalake_kodak_raw.image_inspection.red_flag_size
    description: 'Critical flag: True if image dimensions or file size do not meet platform requirements. May block approval for technical reasons.'
  has_red_flag_sharpness:
    lineage:
      - datalake_kodak_raw.image_inspection.red_flag_sharpness
    description: 'Critical flag: True if image sharpness score is below acceptable threshold. Indicates blurry or low-quality images that impact user experience.'
  has_red_flag_not_property:
    lineage:
      - datalake_kodak_raw.image_inspection.red_flag_not_property
    description: 'Critical flag: True if AI determined the image does not show the actual property being listed. Prevents misleading property representation.'
  has_red_flag_aspect_ratio:
    lineage:
      - datalake_kodak_raw.image_inspection.red_flag_aspect_ratio
    description: 'Critical flag: True if image aspect ratio is outside acceptable ranges for platform display. May cause layout issues.'
  has_red_flag_casamineira:
    lineage:
      - datalake_kodak_raw.image_inspection.red_flag_casamineira
    description: 'Critical flag: True if CasaMineira anti-fraud AI detected suspicious or fraudulent content. High-priority compliance flag.'
  has_red_flag_media_modification:
    lineage:
    - datalake_kodak_raw.image_inspection.red_flag_media_modification
    description: 'Critical flag: True if AI detected signs of image manipulation or editing that could mislead users about property appearance.'
  has_red_flag_duplicate_image:
    lineage:
    - datalake_kodak_raw.image_inspection.red_flag_duplicate_image
    description: 'Critical flag: True if image is identified as a duplicate of another image in the system, preventing redundant content.'
  has_fault_brightness:
    lineage:
      - datalake_kodak_raw.image_inspection.fault_brightness
    description: 'Quality fault: True if brightness levels are suboptimal but not critical. May be considered for approval with lower priority.'
  has_fault_sharpness:
    lineage:
      - datalake_kodak_raw.image_inspection.fault_sharpness
    description: 'Quality fault: True if sharpness is below optimal but above critical threshold. Indicates room for improvement.'
  has_fault_aspect_ratio:
    lineage:
      - datalake_kodak_raw.image_inspection.fault_aspect_ratio
    description: 'Quality fault: True if aspect ratio is not ideal but acceptable for platform display.'
  has_bonus_sharpness:
    lineage:
      - datalake_kodak_raw.image_inspection.bonus_sharpness
    description: 'Quality bonus: True if image sharpness exceeds high-quality thresholds. Indicates exceptional photo quality that enhances listing appeal.'
  ts_created:
    lineage:
      - datalake_kodak_raw.image_inspection.created_at
    description: 'Timestamp when the image inspection record was initially created in the system.'
  ts_updated:
    lineage:
      - datalake_kodak_raw.image_inspection.updated_at
    description: 'Timestamp when the image inspection record was last modified or updated with new analysis results.'
  year:
    lineage:
      - datalake_kodak_raw.image_inspection.year
    description: 'Year partition key extracted from the creation timestamp for optimized data organization and querying.'
  month:
    lineage:
      - datalake_kodak_raw.image_inspection.month
    description: 'Month partition key extracted from the creation timestamp for optimized data organization and querying.'
  day:
    lineage:
      - datalake_kodak_raw.image_inspection.day
    description: 'Day partition key extracted from the creation timestamp for optimized data organization and querying.'