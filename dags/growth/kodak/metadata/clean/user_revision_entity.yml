database_name: datalake_kodak_clean
table_name: user_revision_entity
description: |
  Core audit trail table from Hibernate Envers that tracks all data modifications in the Kodak system. Each row represents a database transaction/revision with user attribution and timestamp information. This table provides the foundation for complete audit trails, compliance tracking, and change history analysis across all media entities (photos, videos, photospheres) in Kodak. Essential for regulatory compliance, debugging data changes, and understanding system usage patterns.
domain: Growth
owner: vitor.musachio@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_kodak_raw.userrevisionentity.id
    description: 'Unique revision identifier automatically generated by Hibernate Envers for each database transaction. Primary key used for linking all audit table records to track complete change sets across multiple entities.'
  id_user:
    lineage:
      - datalake_kodak_raw.userrevisionentity.userid
    description: 'User identifier of the person or system account that performed the data modification. Used for user attribution in audit trails and compliance reporting. May be null for system-automated changes.'
  ts_revised:
    lineage:
      - datalake_kodak_raw.userrevisionentity.timestamp
    description: 'Timestamp when the database transaction/revision occurred. Provides precise timing for all data changes and enables temporal queries to reconstruct system state at any point in time.'
  op_cdc:
    lineage:
      - datalake_kodak_raw.userrevisionentity.op_cdc
    description: CDC operation type captured by Debezium change-data-capture stream.
    categories:
      r: Read/snapshot - initial load of existing records.
      c: Create - new record inserted.
      u: Update - existing record modified.
      d: Delete - record removed.
  ts_cdc_transaction:
    lineage:
      - datalake_kodak_raw.userrevisionentity.ts_cdc_transaction
    description: Wall-clock timestamp when the CDC connector captured this change event (millisecond precision).
  ts_database_transaction:
    lineage:
      - datalake_kodak_raw.userrevisionentity.ts_database_transaction
    description: Timestamp of the originating database transaction in the source application before CDC propagation.