dag:
  name: enrich_cdp_clickhouse_personas
  owner: Data Growth
  catchup: false
  schedule_start_date: 2026, 8, 28
  schedule_interval: "*/30 * * * *"
  max_active_runs: 1
  documentation:
    dag_purpose: |
      Incrementally materializes CDP Persona datasets every 30 minutes as a
      batch replacement for stream_persona_clean and stream_persona_enrich.
      stream_persona_events rebuilds the latest EGW persona signal per user and
      persona from datalake_cdp_clean.transactional filtered by year, month, and
      day partitions in the load window. persona_events full-outer-joins
      datalake_cdp.stream_persona_events with the historical snapshot in
      datalake_cdp_personas.persona using the same is_active COALESCE and
      last_journey_step CASE as stream_persona_enrich. Waits on
      enrich_cdp_personas (load-enrich-persona) before reading the historical
      snapshot. Merge inserts only active rows and deletes when the source is
      inactive and at least as recent as the target.

workflow:
  layer: enrich
  type: query_delta
  custom_schema: cdp
  default_extraction_type: incremental
  default_partitions: [year, month, day]
  execution_timeout_hours: 2
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, (data_interval_end - macros.timedelta(hours=2)).strftime('%Y-%m-%d %H:00:00'), 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, (data_interval_end + macros.timedelta(hours=1)).strftime('%Y-%m-%d %H:00:00'), 'load_end_date') }}"
  inner_dependencies:
    persona_events:
      - stream_persona_events
  tables_customization:
    stream_persona_events:
      extraction_type: incremental
      merge_on: [id_persona_event]
      when_matched_update_condition: source.ts_updated >= target.ts_updated
      z_order_by: [persona, id_user, uuid_person, ts_updated]
    persona_events:
      extraction_type: incremental
      merge_on: [id_persona_event]
      when_matched_update_condition: source.is_active = true AND source.ts_updated >= target.ts_updated
      when_matched_delete_condition: source.is_active = false AND source.ts_updated >= target.ts_updated
      when_not_matched_insert_condition: source.is_active = true
      z_order_by: [persona, id_user, uuid_person, ts_updated]

cluster:
  type: emr_7_12_consolidation_s_memory_cluster
