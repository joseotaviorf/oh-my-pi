---
database_name: datalake_demand_flows
table_name: tenant_prospect_status
owner: gabriel.salla@quintoandar.com
domain: Growth
description: Each row of this table is status change event according to Growths tenant prospect journey rules. 
  This enrich is equivalent to an Slowly Changing Dimension (SCD), so the same tenant prospect will have multiple lines to track its status changes across the time.
columns:
  id_demand_prospect_conversion_event:
    description: Unique identifier for demand prospect conversion event
    lineage:
    - datalake_demand_flows.conversion_events.id_demand_prospect_conversion_event
  id_tenant_prospect:
    description: Identifier of a user flow with a house in rent context.
    lineage:
    - datalake_demand_flows.conversion_events.id_prospect
  status_trigger_event_name:
    description: Name of the event that trigged the change to that current row status.
    categories:
      VISIT BOOKED: User booked a visit to a house for rent and was marked ACTIVE.
      OFFER SUBMITTED: User submitted an offer on a house for rent and was marked ACTIVE.
      TALK TO AGENT: User talked to an agent about a house for rent and was marked ACTIVE.
      CONTRACT SIGNED: User signed a rent contract and was deactivated (RENTED).
      CONTRACT TERMINATED: User rent contract ended and entered churn evaluation.
    lineage:
    - datalake_demand_flows.conversion_events.event_name
    - datalake_ebdb_contract.contract.ts_signed
  prospect_event_name:
    description: Name of the event related to that row.
    categories:
      USER FIRST ACTIVATION: User made its first booking or offer in rent context (new tenant prospect).
      USER FIRST ACTIVATION IN CITY GROUP: User made its first booking or offer in rent context for that city group.
      USER DEACTIVATION BY CONTRACT SIGNED: User signed a rent contract and left the active tenant pool.
      USER CHURN: User spent more than 90 days since last booking or offer in rent context.
      USER RECOVERY: User returned to bookings or offers after churn or renting in the same city group.
      USER RECOVERY IN OTHER CITY GROUP: User returned to bookings or offers in a different city group after churn or renting.
    lineage:
    - datalake_demand_flows.conversion_events.event_name
    - datalake_ebdb_contract.contract.ts_signed
  city_group:
    description: City group of the house related to row event.
    lineage:
    - datalake_region.region.city_group
  city_group_of_first_activation:
    description: City group of the house where user became new tenant prospect.
    lineage:
    - datalake_region.region.city_group
  status:
    description: Status to what the tenant prospect was moved.
    categories:
      ACTIVE: User made a booking or offer within the last 90 days.
      CHURNED: More than 90 days has passed since users last booking or offer.
      RENTED: User signed a rent contract and is no longer an active tenant prospect.
    lineage:
    - datalake_demand_flows.conversion_events.event_name
    - datalake_ebdb_contract.contract.ts_signed
  status_detail:
    description: Description of the status change cause.
    categories:
      NEW TENANT PROSPECT: User made its first booking or offer in rent context.
      FIRST ACTIVATION IN CITY GROUP: User made its first booking or offer in rent context for that city group.
      RECOVERED AFTER CHURN: User returned after churn in the same city group.
      RECOVERED AFTER RENTING: User returned after signing a rent contract.
      INACTIVITY: More than 90 days passed since the users last booking or offer.
      DEACTIVATED BY RENTING: User signed a rent contract and left the active tenant pool.
      CONTRACT ENDED: User rent contract terminated.
    lineage:
    - datalake_demand_flows.conversion_events.event_name
    - datalake_ebdb_contract.contract.ts_signed
  ts_status_started:
    description: Time marker of the start of when that status was valid.
    lineage:
    - datalake_demand_flows.conversion_events.ts_event
    - datalake_ebdb_contract.contract.ts_signed
  ts_status_ended:
    description: Time marker of the end of when that status was valid.
    lineage:
    - datalake_demand_flows.conversion_events.ts_event
    - datalake_ebdb_contract.contract.ts_signed
  ts_first_activation:
    description: Static timestamp of when the user became a new tenant prospect.
    lineage:
    - datalake_demand_flows.conversion_events.ts_event
  year:
    description: Hive partition year derived from ts_status_started for incremental loads.
    lineage:
    - datalake_demand_flows.conversion_events.ts_event
  month:
    description: Hive partition month derived from ts_status_started for incremental loads.
    lineage:
    - datalake_demand_flows.conversion_events.ts_event
  day:
    description: Hive partition day derived from ts_status_started for incremental loads.
    lineage:
    - datalake_demand_flows.conversion_events.ts_event
