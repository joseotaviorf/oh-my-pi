cluster:
  type: consolidation_m_memory_cluster
  databricks_conn_id: databricks_new
  custom_libraries:
  - pypi:
      package: facebook-business==23.0.1
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
    aws_attributes:
      availability: ON_DEMAND
      ebs_volume_size: 200
    spark_version: 13.3.x-scala2.12
    num_workers: 3
validation:
  cluster:
    type: consolidation_xs_memory_cluster
    databricks_conn_id: databricks_new
    custom_libraries:
    - pypi:
        package: facebook-business==23.0.1
    custom_configurations:
      aws_attributes:
        availability: ON_DEMAND
        ebs_volume_size: 200
      spark_version: 13.3.x-scala2.12
      num_workers: 3
      driver_node_type_id: r6g.xlarge
  allow_custom_spark_job: true
