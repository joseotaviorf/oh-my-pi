cluster:
  type: consolidation_xs_memory_cluster
  databricks_conn_id: databricks_new
  custom_libraries:
  - pypi:
      package: facebook-business==23.0.1
  custom_configurations:
    aws_attributes:
      availability: ON_DEMAND
      ebs_volume_size: 200
    spark_version: 13.3.x-scala2.12
    num_workers: 3
    driver_node_type_id: r7g.xlarge
validation:
  cluster:
    type: emr_7_12_consolidation_xs_memory_fleet_cluster
    custom_configurations:
      task_nodes:
        instance_types:
        - r6g.xlarge
        - r7g.xlarge
        - r6i.xlarge
        target_on_demand: 1
        target_spot: 0
      core_nodes:
        target_on_demand: 2
        target_spot: 0
        instance_types:
        - r6g.xlarge
        - r7g.xlarge
        - r6i.xlarge
      aws_attributes:
        ebs_volume_size: 200
  allow_custom_spark_job: true
