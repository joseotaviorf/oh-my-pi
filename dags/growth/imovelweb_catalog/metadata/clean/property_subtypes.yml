---
database_name: datalake_imovelweb_clean
table_name: property_subtypes
domain: Growth
owner: vitor.musachio@quintoandar.com.br
description: |
  Property subtype reference from Imovelweb Navent MySQL `subtiposdepropiedad`. Grain: one row per property subtype (PK `id_property_subtype`). Downstream: fine-grained listing classification. No table partitions. Z-ORDER (`id_property_type`) on clean layer for selective lookups.
columns:
  id_property_subtype:
    lineage:
      - datalake_imovelweb_raw.subtiposdepropiedad.idsubtipodepropiedad
    description: |
      Surrogate key for a fine-grained property classification (penthouse, loft) in Imovelweb search filters.
  id_property_type:
    lineage:
      - datalake_imovelweb_raw.subtiposdepropiedad.idtipodepropiedad
    description: |
      Parent property type (apartment, house) that owns this subtype in the Imovelweb classification tree. Delta Z-ORDER column — filter on this field for efficient data skipping (table has no partitions).
  property_subtype_name:
    lineage:
      - datalake_imovelweb_raw.subtiposdepropiedad.nombre
    description: |
      Display label for the property subtype shown on Imovelweb listing forms and search facets.
  op_cdc:
    lineage:
      - datalake_imovelweb_raw.subtiposdepropiedad.op_cdc
    description: |
      Debezium change-capture operation for this row: r snapshot read, c insert, u update, d delete.
    categories:
      r: Read/snapshot - initial load of existing records.
      c: Create - new record inserted.
      u: Update - existing record modified.
      d: Delete - record removed.
  ts_cdc_transaction:
    lineage:
      - datalake_imovelweb_raw.subtiposdepropiedad.ts_cdc_transaction
    description: |
      Wall-clock time when Debezium captured this change (millisecond precision).
  ts_database_transaction:
    lineage:
      - datalake_imovelweb_raw.subtiposdepropiedad.ts_database_transaction
    description: |
      MySQL transaction commit time in Imovelweb before CDC propagation.
