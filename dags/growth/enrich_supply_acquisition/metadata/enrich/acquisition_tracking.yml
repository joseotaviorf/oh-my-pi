database_name: datalake_supply_flows
table_name: acquisition_tracking
domain: Growth
owner: arthur.gonzaga@quintoandar.com.br
description: This table is a union between 1P, 3P and CIQ leads and prospects. Also, contains information about the backfill of leads which doesn't have records in Rene Descartes. |
  For understading backfill, please check this [notebook](https://dbc-931ee6e0-6803.cloud.databricks.com/?o=4531937035440038#notebook/2308696875379500/command/3611167693023950).
columns:
  sk_supply_lead:
    lineage: 
      - datalake_supply_flows.acquisition_backfill.sk_supply_lead
      - datalake_supply_flows.leads_1p.sk_supply_lead
      - datalake_supply_flows.prospects_1p.sk_supply_lead
      - datalake_supply_flows.leads_3p.sk_supply_lead
      - datalake_supply_flows.prospects_3p.sk_supply_lead
      - datalake_supply_flows.leads_ciq.sk_supply_lead
      - datalake_supply_flows.prospects_ciq.sk_supply_lead
    description: The unique identifier for each lead in the supply tables. Its unique between CIQ, 3P and 1P tables.
  business_context:
    lineage: 
      - datalake_supply_flows.acquisition_backfill.business_context
      - datalake_supply_flows.leads_1p.business_context
      - datalake_supply_flows.prospects_1p.business_context
      - datalake_supply_flows.leads_3p.business_context
      - datalake_supply_flows.prospects_3p.business_context
      - datalake_supply_flows.leads_ciq.business_context
      - datalake_supply_flows.prospects_ciq.business_context
    description: The business context of the lead, referring to the business context where the lead originated.
  id_lead:
    lineage: 
      - datalake_supply_flows.acquisition_backfill.id_lead
      - datalake_supply_flows.leads_1p.id_lead
      - datalake_supply_flows.prospects_1p.id_lead
      - datalake_supply_flows.leads_3p.id_lead
      - datalake_supply_flows.prospects_3p.id_lead
      - datalake_supply_flows.leads_ciq.id_lead
      - datalake_supply_flows.prospects_ciq.id_lead
    description: The unique identifier for each lead in the 1P/3P/CIQ tables. Could be repeated between these tables.
  id_lead_ebdb:
    lineage: 
      - datalake_supply_flows.acquisition_backfill.id_lead_ebdb
      - datalake_supply_flows.leads_1p.id_lead_ebdb
      - datalake_supply_flows.prospects_1p.id_lead_ebdb
      - datalake_supply_flows.leads_3p.id_lead_ebdb
      - datalake_supply_flows.prospects_3p.id_lead_ebdb
      - datalake_supply_flows.leads_ciq.id_lead_ebdb
      - datalake_supply_flows.prospects_ciq.id_lead_ebdb
    description: The unique identifier for each lead in the 1P/3P/CIQ tables. Could be repeated between these tables.
  id_region:
    lineage: 
      - datalake_supply_flows.acquisition_backfill.id_region
      - datalake_supply_flows.leads_1p.id_region
      - datalake_supply_flows.prospects_1p.id_region
      - datalake_supply_flows.leads_3p.id_region
      - datalake_supply_flows.prospects_3p.id_region
      - datalake_supply_flows.leads_ciq.id_region
      - datalake_supply_flows.prospects_ciq.id_region
    description: The identifier for region in the 1P/3P/CIQ tables.
  id_user_registrant:
    lineage: 
      - datalake_supply_flows.acquisition_backfill.id_user_registrant
      - datalake_supply_flows.leads_1p.id_user_registrant
      - datalake_supply_flows.prospects_1p.id_user_registrant
    description: The id_user of the registrant of the lead. It's not implemented in source databases yet.
  id_wololo:
    lineage: 
      - datalake_supply_flows.acquisition_backfill.id_wololo
      - datalake_supply_flows.prospects_1p.id_wololo
    description: The id_prospect used in Wololo for the lead.
  id_house:
    lineage: 
      - datalake_supply_flows.acquisition_backfill.id_house
      - datalake_supply_flows.prospects_1p.id_house
    description: The identifier for each house related in the 1P/3P/CIQ tables.
  id_referred_by:
    lineage: 
      - datalake_supply_flows.acquisition_backfill.id_referred_by
      - datalake_supply_flows.leads_1p.id_referred_by
      - datalake_supply_flows.prospects_1p.id_referred_by
      - datalake_supply_flows.leads_3p.id_referred_by
      - datalake_supply_flows.prospects_3p.id_referred_by
      - datalake_supply_flows.leads_ciq.id_referred_by
      - datalake_supply_flows.prospects_ciq.id_referred_by
    description: The identifier of the user that referred the current lead.
  business_event:
    lineage: 
      - datalake_supply_flows.acquisition_backfill.business_event
      - datalake_supply_flows.leads_1p.business_event
      - datalake_supply_flows.prospects_1p.business_event
      - datalake_supply_flows.leads_3p.business_event
      - datalake_supply_flows.prospects_3p.business_event
      - datalake_supply_flows.leads_ciq.business_event
      - datalake_supply_flows.prospects_ciq.business_event
    description: The description of the business event of the lead.
  funnel_step:
    lineage: 
      - datalake_supply_flows.acquisition_backfill.funnel_step
      - datalake_supply_flows.leads_1p.funnel_step
      - datalake_supply_flows.prospects_1p.funnel_step
      - datalake_supply_flows.leads_3p.funnel_step
      - datalake_supply_flows.prospects_3p.funnel_step
      - datalake_supply_flows.leads_ciq.funnel_step
      - datalake_supply_flows.prospects_ciq.funnel_step
    description: The funnel step of the lead, referring to the funnel step in supply funnel.
  supply_source:
    lineage: 
      - datalake_supply_flows.acquisition_backfill.supply_source
      - datalake_supply_flows.leads_1p.supply_source
      - datalake_supply_flows.prospects_1p.supply_source
      - datalake_supply_flows.leads_3p.supply_source
      - datalake_supply_flows.prospects_3p.supply_source
      - datalake_supply_flows.leads_ciq.supply_source
      - datalake_supply_flows.prospects_ciq.supply_source
    description: The source of the lead, referring to the source where the lead originated.
    category:
      - 1P: The lead is from 1P.
      - 3P: The lead is from 3P.
      - CIQ: The lead is from CIQ.
  drop_step_reason:
    lineage: 
      - datalake_supply_flows.acquisition_backfill.drop_step_reason
      - datalake_supply_flows.prospects_1p.drop_step_reason
      - datalake_supply_flows.prospects_3p.drop_step_reason
      - datalake_supply_flows.prospects_ciq.drop_step_reason
    description: The reason for the drop of the lead, referring to the funnel step in supply funnel.
  funnel_level:
    lineage: 
      - datalake_supply_flows.acquisition_backfill.funnel_level
      - datalake_supply_flows.leads_1p.funnel_level
      - datalake_supply_flows.prospects_1p.funnel_level
      - datalake_supply_flows.leads_3p.funnel_level
      - datalake_supply_flows.prospects_3p.funnel_level
      - datalake_supply_flows.leads_ciq.funnel_level
      - datalake_supply_flows.prospects_ciq.funnel_level
    description: The funnel level of the lead, is useful for debug leads and prospects levels.
  aux_product_status:
    lineage: 
      - datalake_supply_flows.acquisition_backfill.aux_product_status
      - datalake_supply_flows.leads_1p.aux_product_status
      - datalake_supply_flows.prospects_1p.aux_product_status
      - datalake_supply_flows.leads_3p.aux_product_status
      - datalake_supply_flows.prospects_3p.aux_product_status
      - datalake_supply_flows.leads_ciq.aux_product_status
      - datalake_supply_flows.prospects_ciq.aux_product_status
    description: Status of lead or prospect in the product databases.
  ts_event:
    lineage: 
      - datalake_supply_flows.acquisition_backfill.ts_event
      - datalake_supply_flows.leads_1p.ts_event
      - datalake_supply_flows.prospects_1p.ts_event
      - datalake_supply_flows.leads_3p.ts_event
      - datalake_supply_flows.prospects_3p.ts_event
      - datalake_supply_flows.leads_ciq.ts_event
      - datalake_supply_flows.prospects_ciq.ts_event
    description: Timestamp indicating the time of the event.
  ts_load:
    lineage: 
      - datalake_supply_flows.acquisition_backfill.ts_load
      - datalake_supply_flows.leads_1p.ts_load
      - datalake_supply_flows.prospects_1p.ts_load
      - datalake_supply_flows.leads_3p.ts_load
      - datalake_supply_flows.prospects_3p.ts_load
      - datalake_supply_flows.leads_ciq.ts_load
      - datalake_supply_flows.prospects_ciq.ts_load
    description: Timestamp indicating last update time of register.
  affiliate_type:
    lineage: 
      - datalake_supply_flows.acquisition_backfill.affiliate_type
      - datalake_supply_flows.lead_origin.affiliate_type
    description: The type of the affiliate.
  campaign:
    lineage: 
      - datalake_supply_flows.acquisition_backfill.campaign
      - datalake_supply_flows.lead_origin.campaign
    description: The utm_campaign that brings the lead.
  medium:
    lineage: 
      - datalake_supply_flows.acquisition_backfill.medium
      - datalake_supply_flows.lead_origin.medium
    description: The utm_medium that brings the lead.
  source:
    lineage: 
      - datalake_supply_flows.acquisition_backfill.source
      - datalake_supply_flows.lead_origin.source
    description: The utm_source that brings the lead.
  ops_agent:
    lineage: 
      - datalake_supply_flows.acquisition_backfill.ops_agent
      - datalake_supply_flows.lead_origin.ops_agent
    description: The operations agent that is responsible for registering the lead.
  ops_objective:
    lineage: 
      - datalake_supply_flows.acquisition_backfill.ops_objective
      - datalake_supply_flows.lead_origin.ops_objective
    description: Objective of the operations, could be acquisition or conversion.
  ops_partner:
    lineage: 
      - datalake_supply_flows.acquisition_backfill.ops_partner
      - datalake_supply_flows.lead_origin.ops_partner
    description: The name of the company that register the lead.
  ops_assigned:
    lineage: 
      - datalake_supply_flows.acquisition_backfill.ops_assigned
      - datalake_supply_flows.lead_origin.ops_assigned
    description: The name of the company that will be receive the lead for Wololo or Olos Dialer.
  application:
    lineage: 
      - datalake_supply_flows.acquisition_backfill.application
      - datalake_supply_flows.lead_origin.application
    description: Origin of lead in the PWAs.
  landing_page:
    lineage: 
      - datalake_supply_flows.acquisition_backfill.landing_page
      - datalake_supply_flows.lead_origin.landing_page
    description: The landing page the lead went to to register.
  reprocessed:
    lineage: 
      - datalake_supply_flows.acquisition_backfill.reprocessed
      - datalake_supply_flows.lead_origin.reprocessed
    description: Tag of reprocessed by Rene Descartes.
  ops_approach:
    lineage: 
      - datalake_supply_flows.acquisition_backfill.ops_approach
      - datalake_supply_flows.lead_origin.ops_approach
    description: The approach of the operations, could be receptive or active.
  ops_contact_medium:
    lineage: 
      - datalake_supply_flows.acquisition_backfill.ops_contact_medium
      - datalake_supply_flows.lead_origin.ops_contact_medium
    description: The medium of the contact, could be phone, email or chat.
  platform:
    lineage: 
      - datalake_supply_flows.acquisition_backfill.platform
      - datalake_supply_flows.lead_origin.platform
    description: The name of platform that register the lead, as IoS, Android or Web.
  lead_type:
    lineage: 
      - datalake_supply_flows.acquisition_backfill.lead_type
      - datalake_supply_flows.lead_origin.lead_type
    description: The type of the lead, that could be related with application.
  original_lead:
    lineage: 
      - datalake_supply_flows.acquisition_backfill.original_lead
      - datalake_supply_flows.lead_origin.original_lead
    description: In cases of reprocessed leads, the id of original lead.
  database_tracking_campaign:
    lineage: 
      - datalake_supply_flows.acquisition_backfill.database_tracking_campaign
      - datalake_supply_flows.lead_origin.database_tracking_campaign
    description: The source of utm_campaign, can be Amplitude or Rene Descartes.
  database_tracking_medium:
    lineage: 
      - datalake_supply_flows.acquisition_backfill.database_tracking_medium
      - datalake_supply_flows.lead_origin.database_tracking_medium
    description: The source of utm_medium, can be Amplitude or Rene Descartes.
  database_tracking_source:
    lineage: 
      - datalake_supply_flows.acquisition_backfill.database_tracking_source
      - datalake_supply_flows.lead_origin.database_tracking_source
    description: The source of utm_source, can be Amplitude or Rene Descartes.
