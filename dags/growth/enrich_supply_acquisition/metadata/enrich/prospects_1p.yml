database_name: datalake_supply_flows
table_name: prospects_1p
domain: Growth
owner: arthur.gonzaga@quintoandar.com.br
description: This table contains transformed data from the 1P tables that have a relation with the prospects in the supply pipeline.
columns:
  sk_supply_lead:
    description: The unique identifier for each lead in the supply tables. Its unique between CIQ, 3P and 1P tables.
    lineage: 
      - datalake_supply_flows.leads_1p.sk_supply_lead  
  business_context:
    description: The business context of the lead, referring to the business context where the lead originated.
    lineage: 
      - datalake_supply_flows.leads_1p.business_context
    category: 
      - SALE: The 1P lead is for sale.
      - RENT: The 1P lead is for rent.
  id_lead:
    description: The unique identifier for each lead in the 1P tables.
    lineage: 
      - datalake_supply_flows.leads_1p.id_lead
  id_lead_ebdb:
    description: The unique identifier for each lead in the 1P tables. Its legacy id from EBDB
    lineage: 
      - datalake_supply_flows.leads_1p.id_lead_ebdb
  id_referred_by:
    description: The identifier of affiliate that referred the lead.
    lineage: 
      - datalake_supply_flows.leads_1p.id_lead_ebdb
  id_region:
    description: The identifier for region in the 1P tables.
    lineage: 
      - datalake_supply_flows.leads_1p.id_region
      - datalake_ebdb_clean.lead.id_region
      - datalake_supply_flows.recovered_region_leads.id_region
  id_wololo:
    description: The identifier for wololo prospect.
    lineage: 
      - datalake_wololo_clean.prospect.id
  id_house:
    description: The identifier for house related to prospect.
    lineage: 
      - datalake_supply_flows.conversion_lookup.id_house
  business_event:
    description: The business event of the lead, referring to the business event in supply funnel. In this table is always acquisition_tof2l.
  funnel_step:
    description: The funnel step of the lead, referring to the funnel step in supply funnel. In this table is always prospect.
  supply_source:
    description: The source of the lead, referring to the source where the lead originated. For this table is always 1P.
  drop_step_reason:
    description: The reason for dropping in this step.
    lineage:
      - datalake_rene_descartes_clean.lead_rejection.reason
  funnel_level:
    description: The funnel level of the lead, referring to the funnel level in supply funnel. In this table is always 2.
  ops_assigned:
    description: The identifier of the operations assigned to the lead conversion.
    lineage:
      - datalake_wololo_clean.prospect.sales_company
      - datalake_olos_dialer.outbound_mailing.sales_company
      - datalake_olos_dialer.outbound_last_contact.sales_company
  aux_product_status:
    description: The product status of the lead, referring to the product status in Rene Descartes.
    lineage: 
      - datalake_rene_descartes_clean.house_lead_aud.status
  ts_event:
    description: The timestamp of the event.
    lineage: 
      - datalake_rene_descartes_clean.revinfo.dt_rev
  ts_load:
    description: The timestamp of the load.