database_name: datalake_supply_flows
table_name: prospects_ciq
domain: Growth
owner: gabriel.salla@quintoandar.com
description: |
  CIQ-sourced prospect records from the Bob service enriched for supply acquisition tracking in the classified listings integration pipeline. Z-ordered by sk_supply_lead, business_context, and id_lead for query performance.
columns:
  sk_supply_lead:
    description: The unique identifier for each prospect in the supply tables. Its unique between CIQ, 3P and 1P tables.
    lineage:
      - datalake_supply_flows.leads_sks.sks
  id_lead:
    description: The unique identifier for each draft in this dataset.
    lineage:
      - datalake_bob.house_draft_business_context.id_draft
  id_lead_ebdb:
    description: The unique identifier for each draft in this dataset. Its not the same from EBDB.
    lineage:
      - datalake_bob.house_draft_business_context.id_draft
  id_region:
    description: Identifier for the region.
    lineage:
      - datalake_bob.house_draft_business_context.id_region
  id_user_registrant:
    description: Identifier for the user that register this house. Is the same key that id_user in Main/EBDB.
    lineage:
      - datalake_bob.house_draft_business_context.id_user_registrant
  supply_source:
    description: The source of the prospect, referring to the source where the prospect originated in Supply funnel. Should be CIQ, 3P or 1P, but for this table is always CIQ.
    lineage:
      - datalake_supply_flows.leads_sks.source
  business_context:
    description: The business context of the prospect, referring to the business context where the prospect originated.
    lineage:
      - datalake_bob.house_draft_business_context.business_context
    categories:
      SALE: The CIQ prospect is for sale.
      RENT: The CIQ prospect is for rent.
  business_event:
    description: The business event of the prospect, referring which action was taken in the business context.
  funnel_step:
    description: The funnel step of the CIQ prospect. Always PROSPECT in production.
  funnel_level:
    description: The funnel level of the CIQ prospect. Always 2 in production.
  aux_product_status:
    description: The status of the draft in Bob tables.
    lineage:
      - datalake_bob.house_draft_business_context.status
  city:
    description: The city associated with the draft.
    lineage:
      - datalake_bob.house_draft_business_context.city
  ts_event:
    description: Timestamp indicating the time of the event.
    lineage:
      - datalake_bob.house_draft_business_context.ts_created
  ts_load:
    description: Timestamp indicating creation time of register.
    lineage:
      - datalake_bob.house_draft_business_context.ts_created
