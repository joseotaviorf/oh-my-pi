database_name: datalake_supply_flows
table_name: prospects_3p
domain: Growth
owner: gabriel.salla@quintoandar.com
description: This table contains transformed data from the 3P landing tables that have a relation with the prospects in the supply pipeline.
columns:
  sk_supply_lead:
    description: The unique identifier for each lead in the supply tables. Its unique between CIQ, 3P and 1P tables.
    lineage: 
      - datalake_supply_flows.leads_sks.sks
  id_lead:
    description: The unique identifier for each lead in the 3P tables.
    lineage: 
      - datalake_supply_flows.landing_3p.id_lead
  id_lead_ebdb:
    description: The unique identifier for each lead in the 3P tables. Its not the same that id_lead for 3P.
    lineage: 
      - datalake_supply_flows.landing_3p.id_lead
  id_house:
    description: The identifier for each house related in the 3P tables.
    lineage: 
      - datalake_supply_flows.landing_3p.id_house
  id_region:
    description: The unique identifier for each region in the 3P tables.
    lineage: 
      - datalake_supply_flows.landing_3p.id_region
  supply_source:
    description: The source of the lead, referring to the source where the lead originated. For this table is always 3P.
  business_context:
    description: The business context of the lead, referring to the business context where the lead originated.
    lineage: 
      - datalake_supply_flows.landing_3p.business_context
    category: 
      - SALE: The 3P lead is for sale.
      - RENT: The 3P lead is for rent.
  business_event:
    description: The business event of the lead, referring to the business event in supply funnel. In this table is always acquisition_tof2l.
  drop_step_reason:
    description: The reason for the drop of the lead, referring to the drop step reason in supply funnel.
    lineage:
      - datalake_supply_flows.landing_3p.reason
  funnel_step:
    description: The funnel step of the lead, referring to the funnel step in supply funnel. In this table is always lead.
  funnel_level:
    description: The funnel level of the lead, referring to the funnel level in supply funnel. In this table is always 1.
  aux_product_status:
    description: The product status of the lead, referring to the product status in Broker Processor.
    lineage: 
      - datalake_supply_flows.landing_3p.status
  aux_hash:
    description: The hash of the lead.
    lineage: 
      - datalake_supply_flows.landing_3p.aux_hash
  ts_event:
    description: The timestamp of the event.
    lineage: 
      - datalake_supply_flows.landing_3p.ts_event
  ts_load:
    description: The timestamp of the load.
  year:
    description: The year of the event.
    lineage: 
      - datalake_supply_flows.landing_3p.ts_event
  month:
    description: The month of the event.
    lineage: 
      - datalake_supply_flows.landing_3p.ts_event
  day:
    description: The day of the event.
    lineage: 
      - datalake_supply_flows.landing_3p.ts_event