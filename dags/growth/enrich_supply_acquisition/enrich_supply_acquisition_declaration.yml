---
dag:
  name: enrich_supply_acquisition
  schedule_start_date: 2019, 1, 1
  owner: Data Growth
  documentation: 
    dag_purpose: |
      Creates enriched tables for the supply context in the acquisition domain, which means lead and prospects data.
workflow:
  type: query
  layer: enrich
  custom_schema: supply_flows_migrate
  default_partitions: ["year", "month", "day"]
  default_extraction_type: incremental
  spark_session_configs:
    udfs: [SF_NORMALIZE_STRING]
  extra_query_template_params:
    load_start_date: "{{ yesterday_ds }}"
    load_end_date: "{{ ds }}"
    days_past: 7
cluster:
  type: databricks_10_4_min_io-memory_photon_cluster
