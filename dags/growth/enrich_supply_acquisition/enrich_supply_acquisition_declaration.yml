---
dag:
  name: enrich_supply_acquisition
  schedule_start_date: 2019, 1, 1
  owner: Data Growth
  documentation: 
    dag_purpose: |
      Creates enriched tables for the supply context in the acquisition domain, which means lead and prospects data.
workflow:
  type: query_delta
  layer: enrich
  custom_schema: supply_flows_migrate
  default_partitions: ["year", "month", "day"]
  default_extraction_type: incremental
  tables_customization:
    leads_1p:
      merge_on: ["sk_supply_lead", "business_context"]
      custom_schema: supply_flows
      partitions: []
    prospects_1p:
      # This table must be revisited so that the load is incremental
      extraction_type: full
      merge_on: ["sk_supply_lead", "business_context"]
      custom_schema: supply_flows
      partitions: []
    conversion_lookup:
      merge_on: ["id_house", "business_context"]
      zorder_by: ["id_house", "business_context", "id_lead"]
      custom_schema: supply_flows
      partitions: []
    landing_3p:
      extraction_type: full
      zorder_by: ["id_lead_3p", "business_context", "id_house"]  
      custom_schema: supply_flows
      partitions: []
    acquisition_tracking:
      extraction_type: full
      partitions: []
  inner_dependencies:
    leads_3p:
      - landing_3p
    prospects_3p:
      - leads_3p
      - landing_3p
    prospects_1p:
      - conversion_lookup
      - leads_1p
    prospects_ciq:
      - leads_ciq
    acquisition_tracking:
      - leads_3p
      - prospects_3p
      - leads_ciq
      - prospects_ciq
      - leads_1p
      - prospects_1p
  spark_session_configs:
    udfs: [SF_NORMALIZE_STRING]
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, macros.ds_add(ds, -6), 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, ds, 'load_end_date') }}"
cluster:
  type: databricks_12_2_min_io-memory_photon_cluster