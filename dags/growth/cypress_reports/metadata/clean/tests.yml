database_name: datalake_cypress_reports_clean
table_name: tests
description: This table contains information of the Cypress tests in a given suit.
domain: Platform
owner: thiago.nakamura@quintoandar.com.br
columns:
  pwa:
    lineage:
      - datalake_cypress_reports_raw.cypress_reports.pwa
    description: The name of the project of this execution.
  dt:
    lineage:
      - datalake_cypress_reports_raw.cypress_reports.dt
    description: The date the tests were executed.
  id_test_execution:
    lineage:
      - datalake_cypress_reports_raw.cypress_reports.id_test_execution
    description: The ID of the execution.
  suite_id:
    lineage:
      - datalake_cypress_reports_raw.cypress_reports.results.suites.uuid
  test_id:
    lineage:
      - datalake_cypress_reports_raw.cypress_reports.results.suites.tests.uuid
  code:
    lineage:
      - datalake_cypress_reports_raw.cypress_reports.results.suites.tests.code
  context:
    lineage:
      - datalake_cypress_reports_raw.cypress_reports.results.suites.tests.context
  duration:
    lineage:
      - datalake_cypress_reports_raw.cypress_reports.results.suites.tests.duration
  error_message:
    lineage:
      - datalake_cypress_reports_raw.cypress_reports.results.suites.tests.err
  has_failed:
    lineage:
      - datalake_cypress_reports_raw.cypress_reports.results.suites.tests.fail
  full_title:
    lineage:
      - datalake_cypress_reports_raw.cypress_reports.results.suites.tests.fulltitle
  is_hook:
    lineage:
      - datalake_cypress_reports_raw.cypress_reports.results.suites.tests.ishook
  has_passed:
    lineage:
      - datalake_cypress_reports_raw.cypress_reports.results.suites.tests.pass
  is_pending:
    lineage:
      - datalake_cypress_reports_raw.cypress_reports.results.suites.tests.pending
  has_been_skipped:
    lineage:
      - datalake_cypress_reports_raw.cypress_reports.results.suites.tests.skipped
  speed:
    lineage:
      - datalake_cypress_reports_raw.cypress_reports.results.suites.tests.speed
  state:
    lineage:
      - datalake_cypress_reports_raw.cypress_reports.results.suites.tests.state
  has_timed_out:
    lineage:
      - datalake_cypress_reports_raw.cypress_reports.results.suites.tests.timedout
  title:
    lineage:
      - datalake_cypress_reports_raw.cypress_reports.results.suites.tests.title
  retry_count:
    lineage:
      - datalake_cypress_reports_raw.cypress_reports.results.suites.tests.context