  stats STRUCT<duration:BIGINT,end:STRING,failures:BIGINT,hasOther:BOOLEAN,hasSkipped:BOOLEAN,other:BIGINT,passPercent:double,passes:BIGINT,pending:BIGINT,pendingPercent:double,skipped:BIGINT,start:STRING,suites:BIGINT,tests:BIGINT,testsRegistered:BIGINT>
