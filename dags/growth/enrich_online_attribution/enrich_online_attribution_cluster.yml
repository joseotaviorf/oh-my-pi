cluster:
  type: emr_7_12_consolidation_xl_memory_fleet_cluster
  custom_configurations:
    aws_attributes:
      ebs_volume_size: 750
    core_nodes:
      target_on_demand: 3
      target_spot: 0
      instance_types:
        - r6g.8xlarge
        - r7g.8xlarge
        - r6i.8xlarge
    task_nodes:
      instance_types:
        - r6g.8xlarge
        - r7g.8xlarge
        - r6i.8xlarge
      target_on_demand: 2
      target_spot: 0
      allocation_strategy: price-capacity-optimized
      bid_price_percentage: 100
    spark_conf:
      spark.executor.memory: 96g
      spark.executor.memoryOverhead: 8g
      spark.executor.cores: '2'
      spark.dynamicAllocation.maxExecutors: '8'
      spark.sql.shuffle.partitions: '200'
      spark.sql.execution.arrow.maxRecordsPerBatch: '10000'
