cluster:
  type: consolidation_l_general_cluster
  databricks_conn_id: databricks_new_env
  custom_configurations:
    num_workers: 3
    runtime_engine: PHOTON
    driver_node_type_id: r7g.xlarge
# events_exploded is memory-bound (FROM_JSON on Amplitude props); general L OOM'd (exit 137) on m6g.4xlarge / 24g executors.
validation:
  cluster:
    type: emr_7_12_consolidation_l_memory_fleet_cluster
    custom_configurations:
      spark_conf:
        spark.sql.shuffle.partitions: "200"
        spark.sql.execution.arrow.maxRecordsPerBatch: "10000"
