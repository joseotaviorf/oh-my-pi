database_name: datalake_online_attribution
table_name: events_exploded
owner: henrique.paulo@quintoandar.com.br
domain: Growth
description: 'Exploded Amplitude event stream for the tenants main project with parsed event_properties and

  user_properties fields used for online attribution. One row per Amplitude event in the load

  window with web UTM parameters, Adjust/AppsFlyer mobile attribution fields, and partition

  columns year, month, and day. Source for enrich_online_attribution.online_attribution.

  '
columns:
  event_type_sanitized:
    description: Sanitized Amplitude event name in lower snake_case for stable joins across platforms.
    lineage:
    - datalake_amplitude_clean.events.event_type
  event_type:
    description: Raw Amplitude event type string as tracked in the product analytics SDK.
    lineage:
    - datalake_amplitude_clean.events.event_type
  ts_event:
    description: Timestamp when the Amplitude event occurred on the client, in UTC.
    lineage:
    - datalake_amplitude_clean.events.ts_event
  id_user:
    description: QuintoAndar user identifier associated with the Amplitude event when logged in.
    lineage:
    - datalake_amplitude_clean.events.id_user
  id_amplitude:
    description: Amplitude distinct user identifier used for cross-session identity stitching.
    lineage:
    - datalake_amplitude_clean.events.id_amplitude
  id_session:
    description: Amplitude session identifier grouping events within the same browsing session.
    lineage:
    - datalake_amplitude_clean.events.id_session
  id_house:
    description: QuintoAndar property identifier parsed from event_properties when present on the event.
    lineage:
    - datalake_amplitude_clean.events.event_properties
  id_firestore:
    description: Firestore document identifier parsed from event_properties for offer or listing entities.
    lineage:
    - datalake_amplitude_clean.events.event_properties
  amplitude_platform:
    description: Amplitude platform label indicating where the event was captured (web, iOS, or Android).
    lineage:
    - datalake_amplitude_clean.events.platform
  visit_code:
    description: Visit scheduling code parsed from event_properties for visit funnel attribution.
    lineage:
    - datalake_amplitude_clean.events.event_properties
  entrance_uri:
    description: First-page URI or deep link path from user_properties used for web entry attribution.
    lineage:
    - datalake_amplitude_clean.events.user_properties
  attributed_at:
    description: Timestamp from user_properties marking when marketing attribution was last assigned.
    lineage:
    - datalake_amplitude_clean.events.user_properties
  uri_event_property:
    description: Page URI parsed from event_properties indicating where the in-app action occurred.
    lineage:
    - datalake_amplitude_clean.events.event_properties
  business_context:
    description: Business line context parsed from event_properties (for example Rent or Sale).
    lineage:
    - datalake_amplitude_clean.events.event_properties
  web_medium:
    description: Current web UTM medium parameter extracted from user_properties for campaign tracking.
    lineage:
    - datalake_amplitude_clean.events.user_properties
  web_source:
    description: Current web UTM source parameter extracted from user_properties for traffic origin.
    lineage:
    - datalake_amplitude_clean.events.user_properties
  web_campaign:
    description: Current web UTM campaign name extracted from user_properties for campaign reporting.
    lineage:
    - datalake_amplitude_clean.events.user_properties
  web_content:
    description: Current web UTM content variant extracted from user_properties for ad creative differentiation.
    lineage:
    - datalake_amplitude_clean.events.user_properties
  web_term:
    description: Current web UTM search term extracted from user_properties for paid search keyword tracking.
    lineage:
    - datalake_amplitude_clean.events.user_properties
  web_last_medium:
    description: Most recent web UTM medium from user_properties before the current event timestamp.
    lineage:
    - datalake_amplitude_clean.events.user_properties
  web_last_source:
    description: Most recent web UTM source from user_properties before the current event timestamp.
    lineage:
    - datalake_amplitude_clean.events.user_properties
  web_last_campaign:
    description: Most recent web UTM campaign from user_properties before the current event timestamp.
    lineage:
    - datalake_amplitude_clean.events.user_properties
  web_last_content:
    description: Most recent web UTM content variant from user_properties before the current event.
    lineage:
    - datalake_amplitude_clean.events.user_properties
  web_last_term:
    description: Most recent web UTM search term from user_properties before the current event.
    lineage:
    - datalake_amplitude_clean.events.user_properties
  adjust_app_version:
    description: Mobile application version string reported by the Adjust attribution SDK in user_properties.
    lineage:
    - datalake_amplitude_clean.events.user_properties
  adjust_adgroup:
    description: Adjust ad group identifier from user_properties for mobile campaign hierarchy reporting.
    lineage:
    - datalake_amplitude_clean.events.user_properties
  adjust_campaign:
    description: Adjust campaign name from user_properties used as mobile UTM campaign equivalent.
    lineage:
    - datalake_amplitude_clean.events.user_properties
  adjust_city:
    description: City geo label from Adjust attribution metadata stored in user_properties.
    lineage:
    - datalake_amplitude_clean.events.user_properties
  adjust_country:
    description: Country geo label from Adjust attribution metadata stored in user_properties.
    lineage:
    - datalake_amplitude_clean.events.user_properties
  adjust_creative:
    description: Adjust creative identifier from user_properties identifying the served ad variant.
    lineage:
    - datalake_amplitude_clean.events.user_properties
  adjust_impression_based:
    description: Adjust flag in user_properties indicating whether attribution used impression data.
    lineage:
    - datalake_amplitude_clean.events.user_properties
  adjust_reattributed_at:
    description: Timestamp from Adjust user_properties when the install was reattributed to a new source.
    lineage:
    - datalake_amplitude_clean.events.user_properties
  adjust_installed_at:
    description: Timestamp from Adjust user_properties when the application was first installed.
    lineage:
    - datalake_amplitude_clean.events.user_properties
  adjust_is_organic:
    description: Boolean flag from Adjust user_properties marking organic versus paid install traffic.
    lineage:
    - datalake_amplitude_clean.events.user_properties
  adjust_tracking_enabled:
    description: Adjust flag in user_properties indicating whether device tracking is enabled.
    lineage:
    - datalake_amplitude_clean.events.user_properties
  adjust_tracking_limited:
    description: Adjust flag in user_properties indicating limited ad tracking on the device.
    lineage:
    - datalake_amplitude_clean.events.user_properties
  adjust_network:
    description: Adjust network or media source name from user_properties for mobile acquisition reporting.
    lineage:
    - datalake_amplitude_clean.events.user_properties
  appsflyer_campaign:
    description: AppsFlyer campaign name from user_properties for alternate mobile attribution.
    lineage:
    - datalake_amplitude_clean.events.user_properties
  appsflyer_media_source:
    description: AppsFlyer media source from user_properties identifying the acquisition channel.
    lineage:
    - datalake_amplitude_clean.events.user_properties
  appsflyer_channel:
    description: AppsFlyer channel label from user_properties for sub-network classification.
    lineage:
    - datalake_amplitude_clean.events.user_properties
  appsflyer_installed_at:
    description: AppsFlyer install timestamp from user_properties for mobile first-touch timing.
    lineage:
    - datalake_amplitude_clean.events.user_properties
  appsflyer_adset:
    description: AppsFlyer ad set identifier from user_properties within the campaign hierarchy.
    lineage:
    - datalake_amplitude_clean.events.user_properties
  appsflyer_ad:
    description: AppsFlyer ad creative identifier from user_properties for creative-level reporting.
    lineage:
    - datalake_amplitude_clean.events.user_properties
  web_platform:
    description: Web platform label from user_properties (for example web_desktop or web_mobile).
    lineage:
    - datalake_amplitude_clean.events.user_properties
  app_platform:
    description: Mobile platform label from user_properties (for example iOS or Android).
    lineage:
    - datalake_amplitude_clean.events.user_properties
  gclid:
    description: Google Click Identifier from the Amplitude event payload for Google Ads conversion matching.
    lineage:
    - datalake_amplitude_clean.events.gclid
  referrer:
    description: HTTP referrer URL captured on the Amplitude event for organic traffic analysis.
    lineage:
    - datalake_amplitude_clean.events.referrer
  year:
    description: year of event
    lineage:
    - datalake_amplitude_clean.events.year
  month:
    description: month of event
    lineage:
    - datalake_amplitude_clean.events.month
  day:
    description: day of event
    lineage:
    - datalake_amplitude_clean.events.day
