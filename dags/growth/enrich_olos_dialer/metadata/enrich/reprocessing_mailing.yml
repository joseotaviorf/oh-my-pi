database_name: datalake_olos_dialer
table_name: reprocessing_mailing
owner: henrique.paulo@quintoandar.com.br
domain: Growth
description: This table contains information about the reprocessing mailing that happened in the Olos Dialer. 
  It is used to capture all leads that can be converted by IS team in reprocessing events.
columns:
  id_lead:
    description: Identifier of the lead that was reprocessed. Sometimes can be id_house or id_lead.
    lineage:
      - datalake_olos_dialer_clean.reprocessing_mailings.id_lead
  type:
    description: Type of the reprocessing event
    categories:
      cross_listing_rent: 'Listing a property already listed for rent in sale context'
      cross_listing_sale: 'Listing a property already listed for rent in sale context'
      manual_reprocessed: 'Reprocessed manually by the IS team'
      other: 'Non classified type of reprocessing event'
    lineage:
      - datalake_olos_dialer_clean.reprocessing_mailing.table_name
  business_context:
    description: Business context of the reprocessing event, should be Rent or Sale.
    categories:
      RENT: 'For rent lead or house'
      SALE: 'For sale lead or house'
    lineage:
      - datalake_olos_dialer_clean.reprocessing_mailing.business_context
  ops_partner:
    description: Partner that reprocessed the lead, like Atento, ActionLine or QuintoAndar.
    lineage:
      - datalake_olos_dialer_clean.campaign.description
  ops_agent:
    description: Agent that reprocessed the lead. For this scenario is always outbound team.
  ops_objective:
    description: Objective of the reprocessing event, is always to convert the lead in this source.
  ops_approach:
    description: Approach of the reprocessing event, is always to active this source.
  ops_contact_medium:
    description: Medium of the reprocessing event, is always phone call.
  application: 
    description: Application that reprocessed the lead, for reprocessing events is always Olos Dialer.
  weight:
    description: Weight of the reprocessing event, is always 2 for Olos and 1 for Rene Descartes.
  ts_created:
    description: Timestamp of the creation demand for reprocessing event.
    lineage:
      - datalake_olos_dialer_clean.reprocessing_mailing.ts_created
      - datalake_olos_dialer_clean.reprocessing_mailing.year
      - datalake_olos_dialer_clean.reprocessing_mailing.month
      - datalake_olos_dialer_clean.reprocessing_mailing.day
  ts_load:
    description: Timestamp of the load table