database_name: datalake_olos_dialer
table_name: reprocessing_events
owner: henrique.paulo@quintoandar.com.br
domain: Growth
description: This table contains information about the reprocessing events that happened in the Olos Dialer. It is used to understand the reprocessing events that happened in the Olos Dialer and to understand the impact of these events in the data that we have in the datalake.
columns:
  id_lead:
    description: Identifier of the lead that was reprocessed. Sometimes can be id_house or id_lead.
    lineage:
      - datalake_olos_dialer_clean.outbound_contact_attempts.id_lead
  business_context:
    description: Business context of the reprocessing event, should be Rent or Sale.
    categories:
      RENT: 'For rent lead or house'
      SALE: 'For sale lead or house'
    lineage:
      - datalake_olos_dialer_clean.outbound_contact_attempts.olos_disposition
  id_user_registrant:
    description: Identifier of the user that registered the reprocessing event.
    lineage:
      - datalake_ebdb_clean.users.id_user
  ts_event:
    description: Timestamp of the reprocessing event.
    lineage:
      - datalake_olos_dialer_clean.outbound_contact_attempts.ts_call_ended
  ts_load:
    description: Timestamp of the load table