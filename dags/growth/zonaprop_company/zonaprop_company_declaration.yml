dag:
  name: zonaprop_company
  owner: Data Growth
  schedule_interval: 0 8,12,21 * * *
  schedule_start_date: 2026, 9, 1
  documentation:
    dag_purpose: 'CDC pipeline for Zonaprop (Navent) — Companies domain tables (RD-3334,
      parent RD-3332).


      CDC ingestion of Zonaprop real-estate agency accounts, portal users, agency
      types and third-party interface mappings from the Navent MySQL portal. Supports
      B2B commercial and account analytics for the migration POC.


      DATA LINEAGE: MySQL (OLTP) -> datalake_zonaprop_raw -> datalake_zonaprop_clean

      SCHEDULE: 3x daily at minute 0 UTC (08:00, 12:00, 21:00).

      See dags/growth/zonaprop_company/zonaprop_company.md for table inventory.'
workflow:
  type: cdc
  layer: raw
  database_type: mysql
  source_database: zonaprop
  custom_schema: zonaprop
  source_schema: zonaprop
  dbutils_secret_key: ZONAPROP_DB
  tables_customization:
    empresas:
      clean_table_name: companies
      clean_primary_keys:
      - id_company
      clean_z_order_by:
      - id_company
    usuariosempresas:
      clean_table_name: company_users
      clean_primary_keys:
      - id_company_user
      clean_z_order_by:
      - id_company
    tiposdeinmobiliaria:
      clean_table_name: agency_types
      clean_primary_keys:
      - id_agency_type
      clean_z_order_by:
      - id_agency_type
    interfaceempresas:
      clean_table_name: interface_companies
      clean_primary_keys:
      - id_interface_company
      clean_z_order_by:
      - id_company
    interfaceconfigurations:
      clean_table_name: interface_configurations
      clean_primary_keys:
      - id_interface
      clean_z_order_by:
      - id_interface
    interfaceconfigurationparameters:
      clean_table_name: interface_configuration_parameters
      clean_primary_keys:
      - id_parameter
      clean_z_order_by:
      - id_interface
  extra_query_template_params:
    load_start_date: '{{ get_date_param(dag_run, data_interval_start | ds, ''load_start_date'')
      }}'
    load_end_date: '{{ get_date_param(dag_run, data_interval_start | ds, ''load_end_date'')
      }}'
