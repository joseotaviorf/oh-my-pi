database_name: datalake_zonaprop_clean
table_name: agency_types
domain: Growth
owner: vitor.musachio@quintoandar.com.br
description: 'Lookup of real-estate agency categories on Zonaprop (`tiposdeinmobiliaria`). One row per type (PK id_agency_type). Classifies agency accounts for segmentation and commercial eligibility. Physical layout: Z-ordered by id_agency_type (no partitions); filter on id_agency_type for efficient data skipping.'
columns:
  id_agency_type:
    lineage:
    - datalake_zonaprop_raw.tiposdeinmobiliaria.idtipodeinmobiliaria
    description: Unique identifier for an agency category in the Zonaprop portal taxonomy.
  agency_type_name:
    lineage:
    - datalake_zonaprop_raw.tiposdeinmobiliaria.nombre
    description: Display label of the agency category used in back-office screens and reporting.
  ts_cdc_transaction:
    lineage:
    - datalake_zonaprop_raw.tiposdeinmobiliaria.ts_cdc_transaction
    description: Wall-clock timestamp when the CDC connector captured this change event (millisecond precision).
  ts_database_transaction:
    lineage:
    - datalake_zonaprop_raw.tiposdeinmobiliaria.ts_database_transaction
    description: Timestamp of the originating database transaction in the source application before CDC propagation.
  op_cdc:
    lineage:
    - datalake_zonaprop_raw.tiposdeinmobiliaria.op_cdc
    description: CDC operation type captured by Debezium change-data-capture stream.
    categories:
      r: Read/snapshot - initial load of existing records.
      c: Create - new record inserted.
      u: Update - existing record modified.
      d: Delete - record removed.
