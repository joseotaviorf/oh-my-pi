---
database_name: datalake_talk_to_agent
table_name: talk_to_agent
description: This table contains information about TTA agents and its attendances related to tenant/buyer prospects.
domain: Cross
owner: marcio.gomes@quintoandar.com.br
columns:
  agent_id:
    lineage:
      - datalake_amplitude_clean.170698_piloto_cw_message_sent_events.ep_id_agent
    description: Id of the TTA agent.
  tenant_id:
    lineage:
      - datalake_amplitude_clean.170698_piloto_cw_message_sent_events.id_user
    description: Id of the tenant.
  house_id:
    lineage:
      - datalake_amplitude_clean.170698_piloto_cw_message_sent_events.ep_id_agent.ep_id_house
    description: If of the property related to the TTA event.
  sk_house_listing:
    lineage:
      - dw_rent.dim_house_listing.sk_house_listing
    description: Id of the property listing.
  attended:
    description: Boolean flag indicating if the tenant/buyer prospect was attended by the TTA.
  message:
    lineage:
      - datalake_amplitude_clean.170698_piloto_cw_message_sent_events.ep_message_content
    description: Message sent by the tenant/buyer prospect to the TTA.
  tenant_name:
    lineage:
      - dw_public.dim_user.nome
    description: Tenant's name.
  tenant_phone:
    lineage:
      - dw_public.dim_user.telefone_principal
    description: Tenant's phone.
  tenant_email:
    lineage:
      - dw_public.dim_user.email
    description: Tenant's email.
  msg_sent:
    description: Number of messagens sent by the tenant/buyer prospect.
  delta_hours_elapsed:
    description: Delta of the hours elapsed of the attendance.
  delta_hours_attended:
    description: Delta of the hours attended.
  region_code:
    lineage:
      - dw_public.dim_region.region_code
    description: Region code.
  business_context:
    description: Business context of the tenant/buyer prospect.
  first_message_ts:
    lineage:
      - datalake_amplitude_clean.170698_piloto_cw_message_sent_events.ts_event
    description: Timestamp of when the agent sent the first message.
  bookings_by_agent:
    description: Amount of the booking made by the agent.
  attendances_by_agent:
    description: Amount of attendances made by the agent.
  first_attendance_ts:
    lineage:
      - datalake_ebdb_clean.agent_support.ts_created
      - dw_public.dim_booking.dt_created
    description: Timestamp related to the first attendance.
  app_type:
    lineage:
      - datalake_amplitude_clean.170698_piloto_cw_message_sent_events.platform
      - datalake_gsheets_clean.taxonomy_demand.app_type
    description: App type related to the event.
  utm_source:
    lineage:
      - datalake_amplitude_clean.170698_piloto_cw_message_sent_events.up_utm_source
      - datalake_gsheets_clean.taxonomy_demand.utm_source
    description: UTM source of the event.
  utm_medium:
    lineage:
      - datalake_amplitude_clean.170698_piloto_cw_message_sent_events.up_utm_medium
      - datalake_gsheets_clean.taxonomy_demand.utm_medium
    description: UTM medium of the event.
  branded:
    lineage:
      - datalake_gsheets_clean.taxonomy_demand.branded
    description: Branded information.
  mkt_category:
    lineage:
      - datalake_gsheets_clean.taxonomy_demand.category
    description: Mkt category related to the event.
  mkt_flow:
    lineage:
      - datalake_gsheets_clean.taxonomy_demand.flow
    description: Mkt flow related to the event.
  mkt_completion:
    lineage:
      - datalake_gsheets_clean.taxonomy_demand.completion
    description: Mkt completion.
  mkt_origin:
    lineage:
      - datalake_gsheets_clean.taxonomy_demand.origin
    description: Mkt origin related to the event.
  mkt_channel:
    lineage:
      - datalake_gsheets_clean.taxonomy_demand.channel
    description: Mkt channel related to the event.
  mkt_medium:
    lineage:
      - datalake_gsheets_clean.taxonomy_demand.medium
    description: Mkt medium related to the event.
  mkt_source:
    lineage:
      - datalake_gsheets_clean.taxonomy_demand.source
    description: Mkt source related to the event.
  mkt_platform:
    lineage:
      - datalake_gsheets_clean.taxonomy_demand.platform
    description: Mkt platform related to the event.
  utm_campaign:
    lineage:
      - datalake_amplitude_clean.170698_piloto_cw_message_sent_events.up_utm_campaign
    description: UTM campaign related to the event.
  utm_term:
    lineage:
      - datalake_amplitude_clean.170698_piloto_cw_message_sent_events.up_utm_term
    description: UTM term related to the event.
  utm_content:
    lineage:
      - datalake_amplitude_clean.170698_piloto_cw_message_sent_events.up_utm_content
    description: UTM content related to the event.
  ts_load:
    description: Timestamp of the data load.
