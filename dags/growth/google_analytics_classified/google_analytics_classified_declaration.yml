dag:
  name: google_analytics_classified
  owner: Data Growth
  schedule_start_date: 2019, 1, 1
  schedule_interval: "0 10 * * *"
  documentation:
    dag_purpose: |
      Google Analytics for Classifieds DAG loads Google Analytics data from BigQuery.
      - [Documentation]()
      - [Aggregation types]()
workflow:
  type: custom_ingestion
  layer: raw
  load_spark_job: load_google_analytics_classified_raw
  default_extraction_type: incremental
  default_partitions: [year, month, day]
  extra_query_template_params:
   load_start_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, -2), 'load_start_date') }}"
   load_end_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, -1), 'load_end_date') }}"
  spark_job_arguments:
    - "{environment}"
    - "{bucket}"
    - "{dag_name}"
    - "{load_start_date}"
    - "{load_end_date}"
  tables_customization:
   google_analytics_classified:
    default_table_privileges:
      software-engineers:
        - ALL PRIVILEGES
      analytics-engineers:
        - ALL PRIVILEGES
cluster:
  type: databricks_16_4_high_mem_driver_high_mem_nodes
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE
  custom_libraries:
  - pypi:
      package: "google-api-python-client"
  - pypi:
      package: "google-auth>=2.0.0"
  - pypi:
      package: "google-cloud-bigquery>=3.10.0"
  - pypi:
      package: "google-cloud-bigquery-storage>=2.0.0"
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}