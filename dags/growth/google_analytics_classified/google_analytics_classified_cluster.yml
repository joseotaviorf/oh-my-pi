cluster:
  type: consolidation_s_memory_cluster
  databricks_conn_id: databricks_new
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE
  custom_libraries:
  - pypi:
      package: google-api-python-client
  - pypi:
      package: google-auth>=2.0.0
  - pypi:
      package: google-cloud-bigquery>=3.10.0
  - pypi:
      package: google-cloud-bigquery-storage>=2.0.0
  custom_configurations:
    aws_attributes:
      ebs_volume_size: 200
    spark_version: 13.3.x-scala2.12
    num_workers: 4
    driver_node_type_id: r6g.2xlarge
validation:
  cluster:
    type: consolidation_s_memory_cluster
    databricks_conn_id: databricks_new
    access_control_list:
      group_name: analytics-engineers
      permission_level: CAN_MANAGE
    custom_libraries:
    - pypi:
        package: google-api-python-client
    - pypi:
        package: google-auth>=2.0.0
    - pypi:
        package: google-cloud-bigquery>=3.10.0
    - pypi:
        package: google-cloud-bigquery-storage>=2.0.0
    custom_configurations:
      aws_attributes:
        ebs_volume_size: 200
      spark_version: 13.3.x-scala2.12
      num_workers: 4
      node_type_id: r7g.xlarge
      driver_node_type_id: r7g.xlarge
  allow_custom_spark_job: true
