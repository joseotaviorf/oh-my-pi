---
database_name: datalake_salesforce_growth_clean
table_name: task
owner: gabriel.salla@quintoandar.com
domain: Growth
description: |
  Clean layer for Salesforce growth Task activities (calls, follow-ups, WhatsApp tasks) ingested
  via the Salesforce API. Grain is one row per task (id_task_salesforce) per load snapshot,
  filtered by partition date derived from LastModifiedDate. Includes assignment, deadlines,
  completion status, follow-up outcome, and linked lead. Source: datalake_salesforce_growth_raw.task.
  Physically partitioned by year, month, and day from dt_updated (default_partitions in salesforce_growth DAG).
  Always filter year, month, and day together for partition pruning.
columns:
  id_task_salesforce:
    description: Salesforce native record Id for the Task object.
    lineage:
      - datalake_salesforce_growth_raw.task.Id
  id_analyst_salesforce:
    description: Salesforce User Id (OwnerId) of the analyst responsible for the task.
    lineage:
      - datalake_salesforce_growth_raw.task.OwnerId
  id_lead:
    description: |
      Salesforce WhoId linking the task to an associated Lead record. Null for tasks not tied
      to a lead.
    lineage:
      - datalake_salesforce_growth_raw.task.WhoId
  operation:
    description: |
      Sales organization identifier (Organizacion_de_venta__c) responsible for the task in
      Salesforce.
    lineage:
      - datalake_salesforce_growth_raw.task.Organizacion_de_venta__c
  subject:
    description: Task subject line or short description (Subject field).
    lineage:
      - datalake_salesforce_growth_raw.task.Subject
  type:
    description: |
      Salesforce activity type category (Type field), such as Call, Email, or other task types.
    lineage:
      - datalake_salesforce_growth_raw.task.Type
  status_conclusion:
    description: |
      Salesforce standard task completion status (Status field), such as Completed, Open, or
      Deferred.
    lineage:
      - datalake_salesforce_growth_raw.task.Status
  status:
    description: |
      Follow-up outcome from custom field Resultado_FUP__c, capturing the growth-specific result
      of the task interaction.
    lineage:
      - datalake_salesforce_growth_raw.task.Resultado_FUP__c
  date_creation:
    description: Timestamp when the task was created in Salesforce (CreatedDate).
    lineage:
      - datalake_salesforce_growth_raw.task.CreatedDate
  date_deadline:
    description: Scheduled due date for the task (ActivityDate).
    lineage:
      - datalake_salesforce_growth_raw.task.ActivityDate
  date_conclusion:
    description: Timestamp when the task was completed (CompletedDateTime). Null if still open.
    lineage:
      - datalake_salesforce_growth_raw.task.CompletedDateTime
  dt_updated:
    description: |
      Date of the last Salesforce modification (LastModifiedDate cast to date at raw ingestion).
      Source column for partition columns year, month, and day. Prefer filtering year/month/day
      for partition pruning.
    lineage:
      - datalake_salesforce_growth_raw.task.dt_updated
  year:
    description: |
      Table partition column (year). Derived from dt_updated (LastModifiedDate) at raw ingestion.
      Required in WHERE clauses for partition pruning — always combine with month and day.
    lineage:
      - datalake_salesforce_growth_raw.task.year
  month:
    description: |
      Table partition column (month, 1–12). Derived from dt_updated at raw ingestion. Must be
      filtered together with year and day to enable partition pruning.
    lineage:
      - datalake_salesforce_growth_raw.task.month
  day:
    description: |
      Table partition column (day, 1–31). Derived from dt_updated at raw ingestion. Filter with
      year and month to narrow the scan. Example: WHERE year = 2026 AND month = 6 AND day = 15.
    lineage:
      - datalake_salesforce_growth_raw.task.day
