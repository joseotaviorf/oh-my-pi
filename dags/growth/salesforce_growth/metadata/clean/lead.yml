---
database_name: datalake_salesforce_growth_clean
table_name: lead
owner: gabriel.salla@quintoandar.com
domain: Growth
description: |
  Clean layer for Salesforce growth supply leads ingested via the Salesforce API (Navent
  instance). Grain is one row per lead (id_salesforce) per load snapshot, filtered by partition
  date derived from LastModifiedDate. Includes contact flags, qualification status, standardized
  discard reasons and acquisition channel.
  Source: datalake_salesforce_growth_raw.lead. Physically partitioned by year, month, and day
  from dt_updated (default_partitions in salesforce_growth DAG).
  Always filter year, month, and day together for partition pruning.
columns:
  id_lead:
    description: |
      QuintoAndar-side lead identifier from Salesforce custom field ID_Empresa_Site__c. Primary
      business key for joining growth supply lead funnels.
    lineage:
      - datalake_salesforce_growth_raw.lead.ID_Empresa_Site__c
  id_salesforce:
    description: Salesforce native record Id for the Lead object.
    lineage:
      - datalake_salesforce_growth_raw.lead.Id
  id_analyst:
    description: Salesforce User Id (OwnerId) of the analyst or operator assigned to the lead.
    lineage:
      - datalake_salesforce_growth_raw.lead.OwnerId
  record_type_id:
    description: Salesforce RecordTypeId defining the lead record type configuration.
    lineage:
      - datalake_salesforce_growth_raw.lead.RecordTypeId
  owner_name:
    description: |
      Lead contact last name from Salesforce LastName field. Legacy column alias owner_name —
      does not refer to the Salesforce record owner (see id_analyst).
    lineage:
      - datalake_salesforce_growth_raw.lead.LastName
  phone:
    description: Lead contact phone number from Salesforce Phone field.
    lineage:
      - datalake_salesforce_growth_raw.lead.Phone
  address:
    description: Street address or location provided by the lead (Direccion__c custom field).
    lineage:
      - datalake_salesforce_growth_raw.lead.Direccion__c
  channel:
    description: Acquisition channel through which the lead was captured (Canal__c custom field).
    lineage:
      - datalake_salesforce_growth_raw.lead.Canal__c
  status:
    description: Current Salesforce Lead Status value (standard Status field).
    lineage:
      - datalake_salesforce_growth_raw.lead.Status
  is_contacted:
    description: |
      Whether the lead contact responded, derived from Ha_respondido_el_contacto__c (Si → true,
      No or null → false).
    lineage:
      - datalake_salesforce_growth_raw.lead.Ha_respondido_el_contacto__c
  is_qualified:
    description: |
      Whether the lead was qualified, derived from Calificado__c (Si → true; No, No Aplica, or
      null → false).
    lineage:
      - datalake_salesforce_growth_raw.lead.Calificado__c
  discard_reason:
    description: |
      Standardized English discard reason code mapped from Spanish Motivo_no_convierte__c values
      (e.g. DUPLICATED_LEAD, OWNER_GAVE_UP_RENTING, HOUSE_PRICE_WAS_OUT_OF_BOUNDS). Null when
      the lead was not discarded or the reason is unmapped.
    lineage:
      - datalake_salesforce_growth_raw.lead.Motivo_no_convierte__c
  creation_date:
    description: Timestamp when the lead was created in Salesforce (CreatedDate).
    lineage:
      - datalake_salesforce_growth_raw.lead.CreatedDate
  dt_updated:
    description: |
      Date of the last Salesforce modification (LastModifiedDate cast to date at raw ingestion).
      Source column for partition columns year, month, and day. Prefer filtering year/month/day
      for partition pruning; when filtering on dt_updated directly, keep predicates aligned with
      those partitions.
    lineage:
      - datalake_salesforce_growth_raw.lead.dt_updated
  year:
    description: |
      Table partition column (year). Derived from dt_updated (LastModifiedDate) at raw ingestion.
      Required in WHERE clauses for partition pruning — always combine with month and day to
      restrict scans to the smallest date window needed.
    lineage:
      - datalake_salesforce_growth_raw.lead.year
  month:
    description: |
      Table partition column (month, 1–12). Derived from dt_updated at raw ingestion. Must be
      filtered together with year and day in every query to enable partition pruning.
    lineage:
      - datalake_salesforce_growth_raw.lead.month
  day:
    description: |
      Table partition column (day, 1–31). Derived from dt_updated at raw ingestion. Always the
      last partition column — filter with year and month to narrow the scan to specific days.
      Example: WHERE year = 2026 AND month = 6 AND day BETWEEN 1 AND 7.
    lineage:
      - datalake_salesforce_growth_raw.lead.day
