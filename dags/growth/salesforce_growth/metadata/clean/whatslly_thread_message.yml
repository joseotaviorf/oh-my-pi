database_name: datalake_salesforce_growth_clean
table_name: whatslly_thread_message
description: Clean table for ingesting WhatsApp messages data from the Sales Force tool.
domain: Growth
owner: gabriel.salla@quintoandar.com
columns:
  id_salesforce:
    lineage:
      - datalake_salesforce_growth_raw.whatslly_thread_message.Id
    description: Unique identification key for the WhatsApp message in Sales Force.
  id_message_whatslly:
    lineage:
      - datalake_salesforce_growth_raw.whatslly_thread_message.whatslly__Message_ID__c
    description: Unique identification key for the message in Whatslly system.
  message:
    lineage:
      - datalake_salesforce_growth_raw.whatslly_thread_message.whatslly__Message__c
    description: Content of the WhatsApp message.
  direction:
    lineage:
      - datalake_salesforce_growth_raw.whatslly_thread_message.whatslly__Direction__c
    description: Direction of the message (Sent/Received).
  datetime:
    lineage:
      - datalake_salesforce_growth_raw.whatslly_thread_message.whatslly__Datetime__c
    description: Date and time when the message was sent or received.
  is_past_24h:
    lineage:
      - datalake_salesforce_growth_raw.whatslly_thread_message.whatslly__Is_Past_24h__c
    description: Indicates if the message is older than 24 hours.
  is_sent:
    lineage:
      - datalake_salesforce_growth_raw.whatslly_thread_message.whatslly__Is_Sent__c
    description: Indicates if the message was successfully sent.
  recipient_phone:
    lineage:
      - datalake_salesforce_growth_raw.whatslly_thread_message.whatslly__Recipient_Phone__c
    description: Phone number of the message recipient.
  sender_phone:
    lineage:
      - datalake_salesforce_growth_raw.whatslly_thread_message.whatslly__Sender_Phone__c
    description: Phone number of the message sender.
  id_lead:
    lineage:
      - datalake_salesforce_growth_raw.whatslly_thread_message.whatslly__Related_Lead__c
    description: ID of the associated lead in Sales Force.
  id_person:
    lineage:
      - datalake_salesforce_growth_raw.whatslly_thread_message.whatslly__Whatslly_Person_Id__c
    description: ID of the person in Whatslly system.
  id_analyst_salesforce:
    lineage:
      - datalake_salesforce_growth_raw.whatslly_thread_message.OwnerId
    description: Salesforce User Id (OwnerId) of the analyst responsible for the message record.
  dt_updated:
    lineage:
      - datalake_salesforce_growth_raw.whatslly_thread_message.dt_updated
    description: Last modified date of the message record in Sales Force.
  year:
    lineage:
      - datalake_salesforce_growth_raw.whatslly_thread_message.year
    description: Year of the message record.
  month:
    lineage:
      - datalake_salesforce_growth_raw.whatslly_thread_message.month
    description: Month of the message record.
  day:
    lineage:
      - datalake_salesforce_growth_raw.whatslly_thread_message.day
    description: Day of the message record.
