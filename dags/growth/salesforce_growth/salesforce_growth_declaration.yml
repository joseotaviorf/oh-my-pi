dag:
  name: salesforce_growth
  owner: Data Growth
  schedule_start_date: 2025, 05, 15
  schedule_interval: 0 3 * * *
  documentation:
    dag_purpose: |
      DAG for ingesting data from the Salesforce tool, this DAG uses the Salesforce API to query data from operations performed in the tool.
workflow:
  type: custom_ingestion
  layer: raw
  custom_schema: salesforce_growth
  load_spark_job: load_salesforce_growth_raw
  spark_job_arguments:
    - "{environment}"
    - "{bucket}"
    - "{{ get_date_param(dag_run, ds, 'load_start_date') }}"
    - "{{ get_date_param(dag_run, ds, 'load_end_date') }}"
    - "{table_name}"
    - "{partitions}"
    - "{schema}"
    - "https://navent--uat.sandbox.my.salesforce.com"
    - "https://navent.my.salesforce.com"

  default_extraction_type: incremental
  default_partitions: [year, month, day]
  tables_customization:
    lead:
      extra_spark_job_arguments:
        - "SELECT Id,IsDeleted,MasterRecordId,LastName,FirstName,Salutation,Name,RecordTypeId,Title,Company,Street,City,State,PostalCode,Country,Latitude,Longitude,GeocodeAccuracy,Address,Phone,MobilePhone,Fax,Email,Website,PhotoUrl,Description,LeadSource,Status,Industry,Rating,CurrencyIsoCode,AnnualRevenue,NumberOfEmployees,OwnerId,HasOptedOutOfEmail,IsConverted,ConvertedDate,ConvertedAccountId,ConvertedContactId,IsUnreadByOwner,CreatedDate,CreatedById,LastModifiedDate,LastModifiedById,SystemModstamp,LastActivityDate,DoNotCall,HasOptedOutOfFax,LastViewedDate,LastReferencedDate,LastTransferDate,Jigsaw,JigsawContactId,EmailBouncedReason,EmailBouncedDate,Pronouns,GenderIdentity,IsPriorityRecord,Cantidad_de_propiedades__c,Ciudad_de_facturacion2__c,Codigo_postal__c,Codigo_postal_de_facturacion__c,Condicion_fiscal_texto__c,Direccion__c,Direccion_de_facturacion__c,Error_de_SAP__c,Es_empresa__c,sfleadcaphfprod__External_Lead_ID__c,ID_Empresa_Site__c,ID_Empresa_Site_exclusivo__c,Industria__c,Gestion_Atta__c,Matricula_Licencia__c,Motivo_de_no_califica__c,Motivo_de_no_interes__c,Nombre_de_fantasia__c,Numero_de_documento_fiscal__c,Oportunidad_por_ofrecer__c,Gestion_CasaMineira__c,Organizacion_de_venta__c,Origen_prospecto__c,Pais_texto__c,Gestion_IWB_WIM__c,Sitio__c,Gestion_NokNox__c,Zona_Barrio_Colonia_Comuna_facturacion2__c,Perfil_crediticio__c,Gestion_SindicoNet__c,Tipo_de_documento_necesita_validar__c,Organizacion_de_venta_Texto__c,Ciudad_Texto__c,Condicion_fiscal_pardot__c,Pais_de_facturacion_texto__c,Provincia_Estado_Texto__c,Gestion_Union__c,Error_de_envio_a_pardot__c,Dominio_HR__c,Zapier_email__c,whatslly__Created_by_Whatslly__c,whatslly__Last_WhatsApp_Message_Time__c,whatslly__Whatslly_Person_Id__c,Gestion_Velo__c,Organizacion_de_venta_picklist__c,et4ae5__HasOptedOutOfMobile__c,et4ae5__Mobile_Country_Code__c,Apto_mkt__c,whatslly__Tuvis_Chat_Id__c,botmakerglobal__BotmakerId__c,Error_Portal__c,ContactId__c,Fecha_contrato_firmado__c,PWA_Id__c,Fecha_de_env_o_de_la_offer__c,Monto_de_la_offer__c,Fecha_de_vencimiento_de_la_offer__c,Status_de_la_offer__c,Offer_enviada_al_cliente__c,Canal__c,Ha_respondido_el_contacto__c,Calificado__c,Codigo_PP_de_im_vel_Id_PP__c,Codigo_de_la_propiedad_registrada_Id_IM__c,Fecha_de_la_cita_para_las_fotos__c,Tipo_de_publicacion__c,Status_de_la_foto__c,Publicado__c,Fecha_de_la_publicacion__c,Operacion__c,Fecha_de_proximo_contacto__c,Link_Owner_Hyperlink__c,Celular__c,Hot_Lead__c,Fecha_de_preclasificado__c,Fecha_de_primer_contacto__c,Potencial_duplicado__c,Motivo_no_convierte__c  FROM Lead"
