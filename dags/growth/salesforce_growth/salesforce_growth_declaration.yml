PreferencesSRHOverrideActivities,UserPreferencesReverseOpenActivitiesView,UserPreferencesHasSentWarningEmail,UserPreferencesHasSentWarningEmail238,UserPreferencesHasSentWarningEmail240,UserPreferencesHideBrowseProductRedirectConfirmation,UserPreferencesHideOnlineSalesAppTabVisibilityRequirementsModal,UserPreferencesHideOnlineSalesAppWelcomeMat,UserPreferencesShowForecastingRoundedAmounts,HasUserVerifiedPhone,HasUserVerifiedEmail,ContactId,AccountId,CallCenterId,Extension,FederationIdentifier,AboutMe,FullPhotoUrl,SmallPhotoUrl,IsExtIndicatorVisible,OutOfOfficeMessage,MediumPhotoUrl,DigestFrequency,DefaultGroupNotificationFrequency,LastViewedDate,LastReferencedDate,BannerPhotoUrl,SmallBannerPhotoUrl,MediumBannerPhotoUrl,IsProfilePhotoActive,Canal__c,Email__c,Error_SAP__c,Fecha_de_ultimo_error_SAP__c,Gerente_padre__c,Id_usuario_SAP__c,et4ae5__Default_ET_Page__c,Pais__c,Rol_padre__c,ID_Usuario_SF__c,Centro_de_costos__c,Link_Calendly__c,Organizacion_de_venta__c,et4ae5__Default_MID__c,et4ae5__ExactTargetForAppExchangeAdmin__c,et4ae5__ExactTargetForAppExchangeUser__c,et4ae5__ExactTargetUsername__c,et4ae5__ExactTarget_OAuth_Token__c,et4ae5__ValidExactTargetAdmin__c,et4ae5__ValidExactTargetUser__c,Mostrar_datos__c  FROM User"
