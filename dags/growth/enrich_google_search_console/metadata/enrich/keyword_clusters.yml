      lineage:
        - datalake_google_search_console.gsc_keyword_attributes.has_mention_to_cep
        - datalake_google_search_console.gsc_keyword_attributes.has_mention_to_city
        - datalake_google_search_console.gsc_keyword_attributes.has_mention_to_city_zone
        - datalake_google_search_console.gsc_keyword_attributes.has_mention_to_state
        - datalake_google_search_console.gsc_keyword_attributes.has_mention_to_street
        - datalake_google_search_console.gsc_keyword_attributes.has_mention_to_neighborhood
        - datalake_google_search_console.gsc_keyword_attributes.has_mention_to_poi
        - datalake_google_search_console.gsc_keyword_attributes.has_mention_to_condo
        - datalake_google_search_console.gsc_keyword_attributes.has_mention_to_country
