        - datalake_google_search_console.gsc_keyword_attributes.has_mention_to_kitnet
        - datalake_google_search_console.gsc_keyword_attributes.has_mention_to_other_house_types
        - datalake_google_search_console.gsc_keyword_attributes.has_mention_to_apartment
