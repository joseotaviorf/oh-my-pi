---
dag:
  name: enrich_ebdb_affiliates_cost
  schedule_start_date: 2019, 1, 1
  owner: Data Growth
  documentation:
    dag_purpose: EBDB Affiliates Cost DAG retrieves QuintoAndar's EBDB affiliate commission values classified according to each account transaction type
workflow:
  type: query_delta
  layer: enrich
  default_extraction_type: incremental
  default_partitions:
    - year
    - month
    - day
cluster:
  type: databricks_12_2_med_general_photon_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
