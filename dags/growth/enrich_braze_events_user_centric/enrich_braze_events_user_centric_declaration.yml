---
dag:
  name: enrich_braze_events_user_centric
  schedule_start_date: 2020, 11, 1
  owner: Data Growth
  documentation:
    dag_purpose: This DAG creates the incremental enriched table for Braze user centric events with every campaign/canvas groupped daily.
workflow:
  type: query_delta
  layer: enrich
  custom_schema: braze_user_centric
  default_extraction_type: incremental
  default_partitions:
  - year
  - month
  - day
cluster:
  type: databricks_12_2_med_general_photon_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
