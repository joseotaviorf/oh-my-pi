database_name: datalake_ebdb_clean
table_name: access_type
owner: vitor.musachio@quintoandar.com.br
domain: Growth
description: 'Property access management table containing detailed information about how tenants, agents, and visitors can access specific properties. This table captures key storage locations, entry procedures, security arrangements, and access restrictions for operational and security purposes. Essential for property showing coordination, tenant onboarding, maintenance operations, and security management workflows.'
columns:
  id:
    lineage:
      - datalake_ebdb_raw.accesstype.id
    description: 'Unique identifier for the property access record. Primary key used for referencing specific access arrangements and coordinating property entry procedures across operational systems.'
  id_authorization:
    lineage:
      - datalake_ebdb_raw.accesstype.authorization_id
    description: 'Foreign key reference to the access authorization type. Links to access_authorization_type table to specify the method of authorization required for property entry (e.g., doorman approval, electronic access, key pickup).'
  id_house:
    lineage:
      - datalake_ebdb_raw.accesstype.imovel_id
    description: 'Foreign key reference to the property (imovel) for which this access arrangement applies. Establishes which specific apartment, house, or unit these entry procedures and security details govern.'
  id_occupant:
    lineage:
      - datalake_ebdb_raw.accesstype.occupant_id
    description: 'Foreign key reference to the current occupant of the property. Links to user/tenant records to identify who has primary access rights and responsibility for property security arrangements.'
  id_restriction:
    lineage:
      - datalake_ebdb_raw.accesstype.restriction_id
    description: 'Foreign key reference to access restrictions that apply to this property. Identifies specific limitations, time constraints, or special conditions that govern property entry procedures.'
  id_type:
    lineage:
      - datalake_ebdb_raw.accesstype.type_id
    description: 'Foreign key reference to the general access type category. Classifies the overall access method (e.g., traditional keys, electronic access, combination locks) for operational planning purposes.'
  additional_info:
    lineage:
      - datalake_ebdb_raw.accesstype.additionalinfo
    description: 'Free-form text field containing supplementary access instructions and important security notes. May include special procedures, contact information, emergency instructions, or property-specific access details.'
  description:
    lineage:
      - datalake_ebdb_raw.accesstype.description
    description: 'General description of the access arrangement for this property. Provides overview of entry procedures, key management, and any special considerations for agents, tenants, or service providers.'
  locker_address:
    lineage:
      - datalake_ebdb_raw.accesstype.lockeraddress
    description: 'Physical address or location details for secure key storage (e.g., lockbox, key locker, concierge desk). Critical for agent access coordination and property showing logistics.'
  password:
    lineage:
      - datalake_ebdb_raw.accesstype.password
    description: 'Access password or code required for property entry. Used for lockboxes, electronic access systems, or building entry codes. Security-sensitive field requiring appropriate access controls and encryption.'
  has_opted_keys_with_agent:
    lineage:
      - datalake_ebdb_raw.accesstype.optedkeyswithagent
    description: 'Boolean flag indicating whether the property owner has chosen to leave keys with QuintoAndar agents for showing coordination. Important for scheduling property visits and agent logistics.'
  dt_vacated:
    lineage:
      - datalake_ebdb_raw.accesstype.vacanton
    description: 'Date when the property was vacated by the previous tenant. Used for access transition planning, security updates, and property preparation for new tenants or showings.'
  ts_created:
    lineage:
      - datalake_ebdb_raw.accesstype.criadoem
    description: 'Timestamp when the access record was first created in the system. Used for audit trails and tracking the establishment of property access arrangements.'
  ts_updated:
    lineage:
      - datalake_ebdb_raw.accesstype.atualizadoem
    description: 'Timestamp of the most recent update to the access record. Critical for maintaining current access information and ensuring security protocols reflect the latest arrangements.'