database_name: datalake_ebdb_clean
table_name: info_condo_amenities
owner: vitor.musachio@quintoandar.com.br
domain: Growth
description: 'Property-installation relationship table that associates individual properties with building-level installations and amenities. This junction table enables tracking which properties have access to specific condominium features like pools, gyms, elevators, and party halls. Unlike property-specific amenities, these installations are shared building features that benefit multiple units. Critical for property search filtering by building amenities and lifestyle-based recommendations.'
columns:
  id_info_condo_amenity:
    lineage:
      - datalake_ebdb_raw.instalacaoinfo.id
    description: 'Unique identifier for the property-installation relationship record. Primary key for this association table, ensuring each property-installation combination is uniquely trackable for audit and business logic purposes.'
  is_first_field:
    lineage:
      - datalake_ebdb_raw.instalacaoinfo.campo1
    description: 'First boolean characteristic field for the installation in this property. Used to capture additional nuanced information about access rights, quality, or specific usage conditions for the building amenity. The meaning varies by installation type.'
  is_second_field:
    lineage:
      - datalake_ebdb_raw.instalacaoinfo.campo2
    description: 'Second boolean characteristic field for the installation in this property. Provides additional detail about installation accessibility, operating hours, or specific restrictions that may apply to this property unit.'
  is_third_field:
    lineage:
      - datalake_ebdb_raw.instalacaoinfo.campo3
    description: 'Third boolean characteristic field for the installation in this property. Allows for detailed categorization of installation access levels, premium features, or special conditions beyond basic availability.'
  is_fourth_field:
    lineage:
      - datalake_ebdb_raw.instalacaoinfo.campo4
    description: 'Fourth boolean characteristic field for the installation in this property. Enables granular description of installation privileges, such as unlimited access, priority booking, or premium service levels.'
  is_fifth_field:
    lineage:
      - datalake_ebdb_raw.instalacaoinfo.campo5
    description: 'Fifth boolean characteristic field for the installation in this property. Provides the finest level of detail for installation access rights, allowing complex feature descriptions and usage terms.'
  has_characteristic:
    lineage:
      - datalake_ebdb_raw.instalacaoinfo.temcaracteristica
    description: 'Primary boolean flag indicating whether the property has access to this building installation. True means the unit has access to the shared amenity, False means access is explicitly restricted or unavailable.'
  id_house:
    lineage:
      - datalake_ebdb_raw.instalacaoinfo.imovel_id
    description: 'Foreign key reference to the property (imovel) that has access to this building installation. Links to the main property table, establishing which specific apartment or unit can use the shared amenity.'
  id_condo_amenities:
    lineage:
      - datalake_ebdb_raw.instalacaoinfo.instalacao_id
    description: 'Foreign key reference to the building installation in the condo_amenities table. Identifies which specific shared amenity (e.g., pool, gym, elevator) this record describes access for.'
  ts_updated:
    lineage:
      - datalake_ebdb_raw.instalacaoinfo.atualizadoem
    description: 'Timestamp of the most recent update to this property-installation relationship. Used for tracking changes in building amenity access rights and ensuring search indexes reflect current availability.'
  ts_created:
    lineage:
      - datalake_ebdb_raw.instalacaoinfo.criadoem
    description: 'Timestamp when this property-installation relationship was first established in the system. Important for audit trails and understanding when building amenity access was granted to specific units.'
  op_cdc:
    lineage:
      - datalake_ebdb_raw.instalacaoinfo.op_cdc
    description: CDC operation type captured by Debezium change-data-capture stream.
    categories:
      r: Read/snapshot - initial load of existing records.
      c: Create - new record inserted.
      u: Update - existing record modified.
      d: Delete - record removed.
  ts_cdc_transaction:
    lineage:
      - datalake_ebdb_raw.instalacaoinfo.ts_cdc_transaction
    description: Wall-clock timestamp when the CDC connector captured this change event (millisecond precision).
  ts_database_transaction:
    lineage:
      - datalake_ebdb_raw.instalacaoinfo.ts_database_transaction
    description: Timestamp of the originating database transaction in the source application before CDC propagation.