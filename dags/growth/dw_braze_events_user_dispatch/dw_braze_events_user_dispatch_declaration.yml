dag:
  name: dw_braze_events_user_dispatch
  schedule_start_date: 2020,11,1
  owner: Data Growth
  documentation:
    dag_purpose: |
      This DAG creates the incremental modelings for Braze Events, context User Dispatch.
workflow:
  type: query_delta
  layer: dw
  custom_schema: braze
  default_extraction_type: full
  default_partitions: [user_type]
  tables_customization:
    fact_campaign_user_dispatch:
      extraction_type: incremental
      partitions: [year, month, day]
    fact_canvas_user_dispatch:
      extraction_type: incremental
      partitions: [year, month, day]
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: m5d.xlarge
    node_type_id: m5d.large
    num_workers: 2
    spark_version: 13.3.x-scala2.12