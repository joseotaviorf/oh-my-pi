---
dag:
  name: enrich_ada_crawls
  owner: Data Growth
  schedule_start_date: 2025, 10, 15
  documentation:
    dag_purpose: |
      This DAG generates tables to track issues identified in weekly QuintoAndar web crawls.
workflow:
  type: query_delta
  layer: enrich
  default_extraction_type: incremental
  default_partitions: [year, month, day, device]
  extra_query_template_params: 
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_end | ds, 'load_end_date') }}" 
cluster:
  type: databricks_16_4_med_memory_cluster
  databricks_conn_id: databricks_new_env
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
