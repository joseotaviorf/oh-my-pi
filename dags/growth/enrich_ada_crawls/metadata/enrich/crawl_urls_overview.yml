---
database_name: datalake_ada_crawls
table_name: crawl_urls_overview
owner: caio.francisco@quintoandar.com.br
domain: Growth
description: |
  This table provides a clustered and segmented overview of URLs from the ADA crawl clean datalake, aggregating 
  issues at the URL-address level. Partitioned by year, month, day, and device; filter on dt_report (and partition
  columns) for incremental loads between load_start_date and load_end_date.
columns:
  address:
    description: The URL of the page.
    lineage:
      - datalake_ada_crawls_clean.internal_all.address
  issue_name:
    description: The specific issue detected for the given URL. Each row represents a single issue associated with the address.
    lineage:
      - datalake_ada_crawls_clean.issues.issue_name
  aggregated_issues:
    description: An array containing all issues identified for the given URL, aggregating multiple issue names into a single list.
    lineage:
      - datalake_ada_crawls_clean.issues.issue_name
  structure:
    description: The URL cluster based on URL patterns (e.g., SEARCH RENT,SEARCH SALE, HOME, LISTING).
    lineage:
      - datalake_ada_crawls_clean.internal_all.address
  content_type:
    description: |
      The content type of the URL, which may include the character set (e.g., text/html, text/html; 
      charset=iso-8859-1, text/html; charset=utf-8).
    lineage:
      - datalake_ada_crawls_clean.internal_all.content_type
  status_code:
    description: |
      The HTTP response code returned by the server, indicating the result of the request. The codes are grouped by class 
      (e.g., 2xx for success, 4xx for client errors).
    lineage:
      - datalake_ada_crawls_clean.internal_all.status_code
  status:
    description: The HTTP header response, associated to the HTTP status code (e.g., OK, Moved Permanently, Not Found).
    lineage:
      - datalake_ada_crawls_clean.internal_all.status
  indexability:
    description: Indicates the permission status for content indexing by search engines, whether a URL is 'Indexable' or 'Non-indexable'.
    lineage:
      - datalake_ada_crawls_clean.internal_all.indexability
  indexability_status:
    description: |
      The reason why a page is Non-Indexable (e.g., blocked by robots.txt, canonicalised, 
      client error, noindex, redirected, etc.)
    lineage:
      - datalake_ada_crawls_clean.internal_all.indexability_status
  title_content:
    description: The (first) page title found on the page.
    lineage:
      - datalake_ada_crawls_clean.internal_all.title_content
  meta_description_content:
    description: |
      The content inside the first <meta name="description"> tag, found in the <head> section of a web page
      source code, providing a concise description of the page. It is not not visible to users, but this tag 
      is used by search engines to categorize the content and decide if it's relevant to be indexed and ranked.
    lineage:
      - datalake_ada_crawls_clean.internal_all.meta_description_content
  meta_keywords_content:
    description: |
      The content inside a <meta name="keywords"> tag, found in the <head> section of a web page source code.
      It contains a list of keywords that describe the page's content which is not visible to users.
    lineage:
      - datalake_ada_crawls_clean.internal_all.meta_keywords_content
  h1_content:
    description: |
      The content inside the first <h1> tag, found in the <body> section of a web page source code. 
      It is the main heading of the page and is used to describe the main topic of the page.
    lineage:
      - datalake_ada_crawls_clean.internal_all.h1_content
  secondary_h1_content:
    description: |
      The content inside a second <h1> tag of the page. While HTML allows multiple <h1> tags
      on a single page, the general best practice is to use only one <h1> tag per page.
    lineage:
      - datalake_ada_crawls_clean.internal_all.secondary_h1_content
  h2_content:
    description: |
      The content inside the first <h2> tag, found in the <body> section of a web page source code. 
      It is a subheading of the page and is used to describe a subtopic. You can have multiple <h2> 
      tags on a page, as they are used to delineate major sections or subheadings within the content.
    lineage:
      - datalake_ada_crawls_clean.internal_all.h2_content
  secondary_h2_content:
    description: |
      The content inside a second <h2> tag of the page. You can have multiple <h2> tags on a page,
      as they are used to delineate major sections or subheadings within the content.
    lineage:
      - datalake_ada_crawls_clean.internal_all.secondary_h2_content
  meta_robots_content:
    description: |
      The directives inside a <meta name="robots"> tag, found in the <head> section of a web page source
      code. It contains instructions for search engine crawlers on how to handle the page.
    lineage:
      - datalake_ada_crawls_clean.internal_all.meta_robots_content
  x_robots_tag_content:
    description: |
      The directives for how crawlers should index URLs, defined in a HTTP header,
      which is useful for non-HTML content such as PDFs and images.
    lineage:
      - datalake_ada_crawls_clean.internal_all.x_robots_tag_content
  meta_refresh_content:
    description: |
      The content inside a <meta http-equiv="refresh"> tag, found in the <head> section of a web page source code. 
      It contains a specified time interval for the browser to refresh the page or redirect to a new URL.
    lineage:
      - datalake_ada_crawls_clean.internal_all.meta_refresh_content
  canonical_link_element:
    description: |
      The canonical version of the page defined inside a <link rel="canonical"> tag, in the <head> section of 
      a web page source code. It specifies the preferred version of a webpage when multiple versions of a page 
      exist with identical or very similar content. This helps prevent duplicate content issues SEO and guides 
      search engines on which URL to prioritize for indexing and ranking. 
    lineage:
      - datalake_ada_crawls_clean.internal_all.canonical_link_element
  redirect_url:
    description: The target address to which a web browser is sent after a redirection, if the URL has a redirect.
    lineage:
      - datalake_ada_crawls_clean.internal_all.redirect_url
  redirect_type:
    description: The method or protocol used to execute the redirection from one URL to another (e.g., HTTP Redirect).
    lineage:
      - datalake_ada_crawls_clean.internal_all.redirect_type
  language:
    description: |
      The ISO language code value of the HTML language tag, also known as the lang attribute, used to specify 
      the language of the text content within an HTML document or specific elements (e.g., pt-BR).
    lineage:
      - datalake_ada_crawls_clean.internal_all.language
  http_version:
    description: The version of the Hypertext Transfer Protocol (HTTP) used by the server to send the response (e.g., 1.1).
    lineage:
      - datalake_ada_crawls_clean.internal_all.http_version
  supply:
    description: |
      The inner HTML content extracted using a custom extraction from the Screaming Frog SEO Spider targeting
      search pages with the following XPath: (//div[@data-testid='CONTEXTUAL_SEARCH_TITLE']//div//p//span)[1].
    lineage:
      - datalake_ada_crawls_clean.internal_all.supply
  url_encoded_address: 
    description: The encoded URL of the page requested by the SEO Spider, all non ASCII characters are percent encoded.
    lineage:
      - datalake_ada_crawls_clean.internal_all.url_encoded_address
  title_pixel_width:
    description: The width of the title in pixels.
    lineage:
      - datalake_ada_crawls_clean.internal_all.title_pixel_width
  meta_description_pixel_width:
    description: The width of the meta description in pixels.
    lineage:
      - datalake_ada_crawls_clean.internal_all.meta_description_pixel_width
  size_in_bytes:
    description: |
      The size of the resource in bytes. The value is set by the HTTP Content-Length header if provided by the server, otherwise, 
      it is set to zero. For HTML pages, this value considers the size of the raw, uncompressed HTML file.
    lineage:
      - datalake_ada_crawls_clean.internal_all.size_in_bytes
  transferred_bytes:
    description: |
      The number of bytes that were transferred to load the resource, 
      which might be less than the 'size_in_bytes' if compressed.
    lineage:
      - datalake_ada_crawls_clean.internal_all.transferred_bytes
  total_transferred_bytes:
    description: |
      The total size of the of the full page load, with the sum of the transferred bytes of the main HTML page and 
      of every single dependency and loaded resource.
    lineage:
      - datalake_ada_crawls_clean.internal_all.total_transferred_bytes
  carbon_emissions:
    description: The estimated carbon emissions of the page per page view in milligrams (mg).
    lineage:
      - datalake_ada_crawls_clean.internal_all.carbon_emissions
  word_count:
    description: |
      The count of all words found within a content area (the <body> tag by default), excluding HTML tags, 
      navigation, and footer elements. The calculation is based on text separated by spaces, no consideration 
      is given to visibility of content (such as text inside a div set to hidden).
    lineage:
      - datalake_ada_crawls_clean.internal_all.word_count
  sentence_count:
    description: The total number of sentences detected in the main textual content of the page.
    lineage:
      - datalake_ada_crawls_clean.internal_all.sentence_count
  average_words_per_sentence:
    description: The average number of words contained within each sentence on the page.
    lineage:
      - datalake_ada_crawls_clean.internal_all.average_words_per_sentence
  flesch_reading_ease_score:
    description: |
      The score that measures the readability of the text. It is calculated based on average sentence length
      and the average number of syllables per word. Higher scores indicate text that is easier to read.
    lineage:
      - datalake_ada_crawls_clean.internal_all.flesch_reading_ease_score
  readability:
    description: |
      The readability of the page, based on the Flesch Reading Ease Score 
      (e.g., "Fairly Easy", "Hard", "Very Hard").
    lineage:
      - datalake_ada_crawls_clean.internal_all.readability
  text_ratio:
    description: |
      The percentage of of non-HTML characters found in the HTML body tag on a page (the text), 
      relative to the total size of the HTML file
    lineage:
      - datalake_ada_crawls_clean.internal_all.text_ratio
  crawl_depth:
    description: |
      The number of internal clicks required for the crawler to reach a URL from the starting URL. 
      This measures the page's position within the internal link structure.
    lineage:
      - datalake_ada_crawls_clean.internal_all.crawl_depth
  folder_depth:
    description: Depth of the URL based upon the number of subfolders (/sub-folder/) in the URL path.
    lineage:
      - datalake_ada_crawls_clean.internal_all.folder_depth
  inlink_count:
    description: The number of internal links targeting the URL from other pages within the same subdomain.
    lineage:
      - datalake_ada_crawls_clean.internal_all.inlink_count
  unique_inlink_count:
    description: The number of unique internal links targeting the URL from other pages within the same subdomain.
    lineage:
      - datalake_ada_crawls_clean.internal_all.unique_inlink_count
  percentage_of_total:
    description: The percentage of unique internal inlinks (considers only HTML pages with status code 200) to the URL.
    lineage:
      - datalake_ada_crawls_clean.internal_all.percentage_of_total
  outlink_count:
    description: The number of internal links to other URLs in the same subdomain.
    lineage:
      - datalake_ada_crawls_clean.internal_all.outlink_count
  unique_outlink_count:
    description: The number of unique internal links to other URLs in the same subdomain.
    lineage:
      - datalake_ada_crawls_clean.internal_all.unique_outlink_count
  response_time:
    description: The time taken to receive a HTTP response from the server.
    lineage:
      - datalake_ada_crawls_clean.internal_all.response_time
  ts_last_modified:
    description: |
      The timestamp of when the page was last modified, from the Last-Modified header in the servers HTTP response. 
      If there is no Last-Modified header, the value will be empty.
    lineage:
      - datalake_ada_crawls_clean.internal_all.ts_last_modified
  ts_crawl:
    description: The timestamp of when the page was crawled.
    lineage:
      - datalake_ada_crawls_clean.internal_all.ts_crawl
  dt_report:
    description: |
      Calendar date of the weekly ADA Screaming Frog crawl for the row; used in incremental filters and joins
      with datalake_ada_crawls_clean.internal_all and issues on address, device, and dt_report.
    lineage:
      - datalake_ada_crawls_clean.internal_all.dt_report
  device:
    description: |
      The device type of the crawl (desktop or mobile).
      It is used for data partitioning and filtering purposes.
    lineage:
      - datalake_ada_crawls_clean.internal_all.device
  year:
    description: |
      The crawl date year.
      It is used for data partitioning and filtering purposes.
    lineage:
      - datalake_ada_crawls_clean.internal_all.year
  month:
    description: |
      The crawl date month.
      It is used for data partitioning and filtering purposes.
    lineage:
      - datalake_ada_crawls_clean.internal_all.month
  day:
    description: |
      The crawl date day.
      It is used for data partitioning and filtering purposes.
    lineage:
      - datalake_ada_crawls_clean.internal_all.day