cluster:
  type: consolidation_l_memory_cluster
  databricks_conn_id: databricks_new_env
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: USER_ISOLATION
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
    aws_attributes:
      ebs_volume_size: 200
    runtime_engine: PHOTON
    num_workers: 3
    node_type_id: r6gd.4xlarge
    driver_node_type_id: r6gd.2xlarge
validation:
  cluster:
    type: consolidation_xs_memory_cluster
    databricks_conn_id: databricks_new_env
    custom_configurations:
      aws_attributes:
        ebs_volume_size: 200
      data_security_mode: USER_ISOLATION
      runtime_engine: PHOTON
      driver_node_type_id: r6g.xlarge
