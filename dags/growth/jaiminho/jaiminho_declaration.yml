dag:
  name: jaiminho
  schedule_start_date: 2021, 11, 30
  schedule_interval: 0 3 * * *
  owner: Data Growth
  documentation:
    dag_purpose: |
      Retrieves data from the Jaiminho database (PostgreSQL). [Jaiminho](https://github.com/quintoandar/jaiminho)
        is a microservice that handles notification schedule processing.
workflow:
  type: cdc
  layer: raw
  database_type: postgres
  source_schema: jaiminho
  dbutils_secret_key: JAIMINHO_DB
  lineage_product_database_name: jaiminho
  tables_customization:
    user_notifications:
      clean_table_name: user_notifications
      raw_primary_keys: [id]
      clean_primary_keys: [id]
    notifications_delivery:
      clean_table_name: notifications_delivery
      raw_primary_keys: [id]
      clean_primary_keys: [id]
    events:
      clean_table_name: events
      raw_primary_keys: [id]
      clean_primary_keys: [id]
    event_traces:
      clean_table_name: event_traces
      raw_primary_keys: [id]
      clean_primary_keys: [id]
    campaigns:
      clean_table_name: campaigns
      raw_primary_keys: [id]
      clean_primary_keys: [id]

cluster:
  type: databricks_12_2_med_2xlarge_general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
