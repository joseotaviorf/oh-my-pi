dag:
  name: enrich_growth_media_platform_scd
  schedule_start_date: 2024, 10, 25
  owner: Data Growth
  documentation:
    dag_purpose: |
      This DAG is responsible for loading campaign data into the enriched layer
      and maintaining historical records using SCD type 2 logic for growth campaigns.

workflow:
  type: query_delta
  layer: enrich
  custom_schema: growth_media_platform
  default_extraction_type: incremental
  default_partitions: ["origin"]
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, -1), 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  tables_customization:
    campaign_name_history:
      merge_on: ['merge_key', 'is_current', 'origin']
      z_order_by: ['id_campaign', 'dt_start']
      vacuum_retention_hours: 168
      when_matched_update_condition: "source.merge_key = target.id_campaign AND source.origin = target.origin AND target.is_current = true AND source.campaign_name <> target.campaign_name"
      when_not_matched_insert_condition: "source.merge_key IS NULL"
      when_matched_operation: {"is_current": 'False', "dt_end": "source.dt_start"}
      when_not_matched_operation: {"merge_key": "source.id_campaign", "id_campaign": "source.id_campaign", "campaign_name": "source.campaign_name", "origin": "source.origin", "is_current": "source.is_current", "dt_start": "source.dt_start", "dt_end": "source.dt_end"}
cluster:
  type: databricks_13_3_med_general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
