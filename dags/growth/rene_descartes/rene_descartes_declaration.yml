dag:
  name: rene_descartes
  schedule_start_date: 2020, 7, 27
  schedule_interval: 0 0 * * *
  owner: Data Growth
  documentation:
    dag_purpose: |
      This DAG handles the ingestion of our raw and clean data for our Rene Descartes Microservice,
      which is a Microservice for Owner Lead discard rules. For more information about the Database please refer
      to the [Rene Descartes Repository](https://github.com/quintoandar/rene-descartes).
workflow:
  type: cdc
  layer: raw
  database_type: postgres
  source_database: renedescartes
  source_schema: public
  custom_schema: rene_descartes
  dbutils_secret_key: RENEDESCARTES_DB
  lineage_product_database_name: renedescartes
  tables_customization:
    acquisition_misc_data: {}
    address: {}
    house_lead_aud: {}
    house_lead_conversion: {}
    house_lead: {}
    lead_rejection: {}
    phone: {}
    revinfo: {}
cluster:
  type: databricks_13_3_med_memory_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
