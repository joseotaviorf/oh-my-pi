database_name: datalake_rene_descartes_clean
table_name: revinfo
owner: gabriel.salla@quintoandar.com
domain: Growth
description: >
  Revision information table generated by Hibernate Envers for the Rene Descartes supply microservice,
  recording the timestamp of every database change event. Each row corresponds to a single revision number
  that is referenced by the audit tables (e.g. house_lead_aud) to provide a precise point-in-time timestamp
  for historical analysis and compliance auditing.
columns:
  rev:
    description: Globally unique revision sequence number assigned by Hibernate Envers to each change transaction, used as the join key to all audit tables in the Rene Descartes schema.
    lineage:
      - datalake_rene_descartes_raw.revinfo.rev
  dt_rev:
    description: Exact timestamp at which the revision was committed, derived from the raw millisecond epoch value, representing the moment the audited change occurred in the system.
    lineage:
      - datalake_rene_descartes_raw.revinfo.revtstmp
  year:
    description: Calendar year extracted from `dt_rev`, used as a Hive partition for incremental reads of Envers revision metadata.
    lineage:
      - datalake_rene_descartes_raw.revinfo.revtstmp
  month:
    description: Calendar month extracted from `dt_rev`, used as a Hive partition alongside year and day.
    lineage:
      - datalake_rene_descartes_raw.revinfo.revtstmp
  day:
    description: Calendar day extracted from `dt_rev`, used as a Hive partition alongside year and month.
    lineage:
      - datalake_rene_descartes_raw.revinfo.revtstmp
