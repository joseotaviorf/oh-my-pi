database_name: datalake_rene_descartes_clean
table_name: house_lead_aud
owner: gabriel.salla@quintoandar.com
domain: Growth
description: >
  Audit table that tracks the full history of changes to house lead records in the Rene Descartes supply
  microservice, following Hibernate Envers conventions. Every modification to a house lead — including status
  transitions, referral updates, and address changes — is captured here with a revision identifier and change
  type, providing a complete audit trail for compliance, debugging, and retroactive funnel analysis.
columns:
  id:
    description: Identifier of the house lead whose state is captured in this audit row, matching the primary key in the house_lead table.
    lineage:
      - datalake_rene_descartes_raw.house_lead_aud.id
  id_house_owner:
    description: Property owner identifier as it existed at the time of this revision, allowing historical reconstruction of owner-lead associations.
    lineage:
      - datalake_rene_descartes_raw.house_lead_aud.house_owner_id
  id_acquisition:
    description: Acquisition record identifier as recorded at the time of this audit revision, enabling point-in-time campaign attribution.
    lineage:
      - datalake_rene_descartes_raw.house_lead_aud.acquisition_id
  id_address:
    description: Address identifier linked to the lead at the moment of this revision, reflecting any address corrections captured in the audit history.
    lineage:
      - datalake_rene_descartes_raw.house_lead_aud.address_id
  id_referred_by:
    description: Referrer identifier at the time of this audit entry, used to trace changes in lead attribution over the lifecycle of the record.
    lineage:
      - datalake_rene_descartes_raw.house_lead_aud.referred_by
  id_external_reference:
    description: External reference identifier as it stood at this revision, supporting historical cross-system reconciliation.
    lineage:
      - datalake_rene_descartes_raw.house_lead_aud.external_reference_id
  id_lead_ebdb:
    description: Legacy EBDB system identifier recorded at the time of this audit revision, used to trace lead migration events across systems.
    lineage:
      - datalake_rene_descartes_raw.house_lead_aud.new_id
  external_reference_name:
    description: Name of the external source recorded at the time of this revision, maintaining a historical record of referral source changes.
    lineage:
      - datalake_rene_descartes_raw.house_lead_aud.external_reference_name
  reason:
    description: Business reason recorded for the lead's status at the moment of this audit entry, documenting the rationale behind each state change.
    lineage:
      - datalake_rene_descartes_raw.house_lead_aud.reason
  status:
    description: Lifecycle status of the house lead as captured at this specific revision, enabling reconstruction of the complete status history for any lead.
    lineage:
      - datalake_rene_descartes_raw.house_lead_aud.status
  rev:
    description: Revision sequence number generated by Hibernate Envers, uniquely identifying each recorded change event and joinable to the revinfo table for the exact timestamp.
    lineage:
      - datalake_rene_descartes_raw.house_lead_aud.rev
  rev_type:
    description: Type of data modification captured in this audit row — 0 for INSERT, 1 for UPDATE, 2 for DELETE — following Hibernate Envers conventions.
    lineage:
      - datalake_rene_descartes_raw.house_lead_aud.revtype
  rev_end:
    description: Revision number at which this audit snapshot was superseded by the next change, enabling closed-interval temporal queries over lead history.
    lineage:
      - datalake_rene_descartes_raw.house_lead_aud.revend
  year:
    description: Hive partition year propagated from the raw audit table, aligned with the ingestion date of the house lead audit snapshot.
    lineage:
      - datalake_rene_descartes_raw.house_lead_aud.year
  month:
    description: Hive partition month propagated from the raw audit table, used alongside year and day for incremental audit reads.
    lineage:
      - datalake_rene_descartes_raw.house_lead_aud.month
  day:
    description: Hive partition day propagated from the raw audit table, used alongside year and month for incremental audit reads.
    lineage:
      - datalake_rene_descartes_raw.house_lead_aud.day
