database_name: datalake_rene_descartes_raw
table_name: portfolio_enrichment
owner: michele.carvalho@quintoandar.com.br
domain: Growth
description: |
  Raw enrichment layer for portfolios, capturing auxiliary attributes produced
  by upstream services (e.g., Dejavu matching, listing price snapshots and
  prediction outputs). Values reflect the state at ingestion time and may be
  sparsely populated depending on source availability. This table feeds the
  clean `portfolio_enrichment` table after standardization and quality checks.
