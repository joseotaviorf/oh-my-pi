      Enriched audience of Bianca WhatsApp follow-up candidates.
      Runs after Jaiminho and Copilot clean loads complete.
      Identifies stalled conversations where the last message is a qualifying
      Bianca template and surfaces phone_number + trigger_type pairs for HighTouch.

workflow:
