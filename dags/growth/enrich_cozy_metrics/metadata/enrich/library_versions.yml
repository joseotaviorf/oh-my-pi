---
database_name: datalake_cozy_metrics
table_name: library_versions
owner: cristina.cardoso@quintoandar.com.br
domain: Growth
description: This table contains information about Cozy Foundations implemented on QuintoAndar's PWAs.
columns:
  project_name:
    description: The project name of PWA use (like Github repository).
    lineage:
      - datalake_cozy_metrics_clean.library_versions.project_name
  major_version:
    description: Major version of the Cozy Library utilized by the project.
    lineage:
      - datalake_cozy_metrics_clean.library_versions.core
  minor_version:
    description: Minor version of the Cozy Library utilized by the project.
    lineage:
      - datalake_cozy_metrics_clean.library_versions.core
  patches:
    description: Patch version of the Cozy Library utilized by the project.
    lineage:
      - datalake_cozy_metrics_clean.library_versions.core
  type_of_pwa:
    description: To which type of PWA the project belongs to.
    categories: 
      partner: 'Partner PWA'
      internal: 'Internal PWA'
      end-user: 'End User PWA'
  is_updated_v19:
    description: If the major version is higher than 19.
  dt_created:
    description: The day when a new merge on main branch is executed.
    lineage:
      - datalake_cozy_metrics_clean.library_versions.dt_created
