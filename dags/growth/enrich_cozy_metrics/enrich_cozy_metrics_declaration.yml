---
dag:
  name: enrich_cozy_metrics
  schedule_start_date: 2020, 8, 29
  owner: Data Growth
  documentation:
    dag_purpose: This DAG creates the enriched tables of the first layer of enrichment from Cozy Metrics to Design Systems team.
      This data is enriched with rules created by product team, to measure and evolute the metrics on PWAs systems.
workflow:
  type: query_delta
  layer: enrich
cluster:
  type: databricks_12_2_min_general_photon_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
