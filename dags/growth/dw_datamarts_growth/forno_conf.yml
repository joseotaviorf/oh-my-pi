---
redshift_template:
  dw: &redshift_anchor
    runs_on: redshift
athena_template:
  dw: &athena_anchor
    runs_on: athena
pipeline:
  ##<KEEP THIS COMMENTED AS A TEMPLATE>
  # <task-name-like-attribution-conversion-paths>:
  #   dw:
  #     table: <targe-table-name>
  #     runs_on: <backend-to-run-the-query> E.g: redshift or athena
  # example_redshift_weekly_demand_metrics:
  #   dw:
  #     <<: *redshift_anchor
  #     table: weekly_demand_metrics
  # example_athena_house_weekly_entrance_info:
  #   dw:
  #     <<: *athena_anchor
  #     table: house_weekly_entrance_info
  attribution_conversion_paths_demand:
    dw:
      <<: *athena_anchor
      table: attribution_conversion_paths_demand
  buyer_activation_events_combo:
    dw:
      <<: *athena_anchor
      table: buyer_activation_events_combo
  casa_mineira_top_of_funnel_volumes_daily:
    dw:
      <<: *redshift_anchor
      table: casa_mineira_top_of_funnel_volumes_daily
      depends_on:
        - performance_marketing_metrics_imobiliaria_casa_mineira
        - performance_marketing_metrics_portal_casa_mineira
  performance_marketing_metrics_portal_casa_mineira:
    dw:
      <<: *redshift_anchor
      table: performance_marketing_metrics_portal_casa_mineira
  plaquinhas_houses:
    dw:
      <<: *redshift_anchor
      table: plaquinhas_houses
  sale_performance_marketing_metrics_supply_cohort:
    dw:
      <<: *redshift_anchor
      table: sale_performance_marketing_metrics_supply_cohort
  casa_mineira_top_of_funnel_volumes_monthly:
    dw:
      <<: *redshift_anchor
      table: casa_mineira_top_of_funnel_volumes_monthly
  casa_mineira_top_of_funnel_volumes_weekly:
    dw:
      <<: *redshift_anchor
      table: casa_mineira_top_of_funnel_volumes_weekly
      depends_on:
        - performance_marketing_metrics_imobiliaria_casa_mineira
        - performance_marketing_metrics_portal_casa_mineira
  performance_marketing_metrics_imobiliaria_casa_mineira:
    dw:
      <<: *redshift_anchor
      table: performance_marketing_metrics_imobiliaria_casa_mineira
