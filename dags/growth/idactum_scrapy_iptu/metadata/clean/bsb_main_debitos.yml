---
database_name: datalake_crawled_idactum_houses_clean
table_name: bsb_main_debitos
description: |
  Flattened Brasilia IPTU debt rows mapped toward the idactum_houses legacy contract.
domain: Growth
owner: gabriel.mota@quintoandar.com.br
columns:
  id_municipal_house:
    lineage:
      - datalake_crawled_idactum_houses_raw.bsb_main_debitos.response.Imovel
    description: |
      DF municipal property inscription from debt API.
  municipal_inscription:
    lineage:
      - datalake_crawled_idactum_houses_raw.bsb_main_debitos.response.Imovel
    description: |
      Formatted DF municipal inscription.
  state:
    description: |
      Brazilian state abbreviation for DF properties (constant DF).
  city:
    description: |
      Municipality name for DF properties (constant Brasilia).
  address_details:
    lineage:
      - datalake_crawled_idactum_houses_raw.bsb_main_debitos.response.DarEndereco
    description: |
      Property address from debt API row.
  assessed_iptu_value:
    lineage:
      - datalake_crawled_idactum_houses_raw.bsb_main_debitos.response.DarValorPrincipal
    description: |
      Principal IPTU debt value from API row.
  usage_purpose:
    lineage:
      - datalake_crawled_idactum_houses_raw.bsb_main_debitos.response.DesricaoReceita
    description: |
      Revenue description from debt API row.
  feed_source:
    lineage:
      - datalake_crawled_idactum_houses_raw.bsb_main_debitos.metadata.source
    description: |
      Spider source tag embedded in the crawl metadata payload.
  feed_url:
    lineage:
      - datalake_crawled_idactum_houses_raw.bsb_main_debitos.metadata.url
    description: |
      Source URL consulted by the crawler when producing this record.
  ts_accessed:
    lineage:
      - datalake_crawled_idactum_houses_raw.bsb_main_debitos.metadata.accessed_at
    description: |
      Timestamp when the crawler accessed the municipal portal page or API.
  referer_url:
    lineage:
      - datalake_crawled_idactum_houses_raw.bsb_main_debitos.metadata.referer_url
    description: |
      HTTP referer URL captured during the crawl session, when available.
  crawler_name:
    lineage:
      - datalake_crawled_idactum_houses_raw.bsb_main_debitos.crawler_name
    description: |
      Scrapy spider name that produced the raw record.
  dt_load:
    lineage:
      - datalake_crawled_idactum_houses_raw.bsb_main_debitos.dt_load
    description: |
      Date when the raw JSONL batch was loaded into the datalake.
  year:
    lineage:
      - datalake_crawled_idactum_houses_raw.bsb_main_debitos.year
    description: |
      Partition year derived from the DAG execution date of the Scrapy feed.
  month:
    lineage:
      - datalake_crawled_idactum_houses_raw.bsb_main_debitos.month
    description: |
      Partition month derived from the DAG execution date of the Scrapy feed.
  day:
    lineage:
      - datalake_crawled_idactum_houses_raw.bsb_main_debitos.day
    description: |
      Partition day derived from the DAG execution date of the Scrapy feed.
