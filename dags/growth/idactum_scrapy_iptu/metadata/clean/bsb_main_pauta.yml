---
database_name: datalake_crawled_idactum_houses_clean
table_name: bsb_main_pauta
description: |
  Flattened Brasilia IPTU pauta rows mapped toward the idactum_houses legacy contract.
domain: Growth
owner: gabriel.mota@quintoandar.com.br
columns:
  id_municipal_house:
    lineage:
      - datalake_crawled_idactum_houses_raw.bsb_main_pauta.response.infos_imovel.InscricaoImovel
      - datalake_crawled_idactum_houses_raw.bsb_main_pauta.response.dados_imovel.InscricaoImovel
    description: |
      DF municipal property inscription from pauta API.
  municipal_inscription:
    lineage:
      - datalake_crawled_idactum_houses_raw.bsb_main_pauta.response.infos_imovel.InscricaoImovel
    description: |
      Formatted DF municipal inscription.
  state:
    description: |
      Brazilian state abbreviation for DF properties (constant DF).
  city:
    description: |
      Municipality name for DF properties (constant Brasilia).
  address_details:
    lineage:
      - datalake_crawled_idactum_houses_raw.bsb_main_pauta.response.infos_imovel.Endereco
    description: |
      Property address from pauta header.
  assessed_iptu_value:
    lineage:
      - datalake_crawled_idactum_houses_raw.bsb_main_pauta.response.dados_imovel.BCIPTU
    description: |
      IPTU base calculation value parsed from pauta row.
  feed_source:
    lineage:
      - datalake_crawled_idactum_houses_raw.bsb_main_pauta.metadata.source
    description: |
      Spider source tag embedded in the crawl metadata payload.
  feed_url:
    lineage:
      - datalake_crawled_idactum_houses_raw.bsb_main_pauta.metadata.url
    description: |
      Source URL consulted by the crawler when producing this record.
  ts_accessed:
    lineage:
      - datalake_crawled_idactum_houses_raw.bsb_main_pauta.metadata.accessed_at
    description: |
      Timestamp when the crawler accessed the municipal portal page or API.
  referer_url:
    lineage:
      - datalake_crawled_idactum_houses_raw.bsb_main_pauta.metadata.referer_url
    description: |
      HTTP referer URL captured during the crawl session, when available.
  crawler_name:
    lineage:
      - datalake_crawled_idactum_houses_raw.bsb_main_pauta.crawler_name
    description: |
      Scrapy spider name that produced the raw record.
  dt_load:
    lineage:
      - datalake_crawled_idactum_houses_raw.bsb_main_pauta.dt_load
    description: |
      Date when the raw JSONL batch was loaded into the datalake.
  year:
    lineage:
      - datalake_crawled_idactum_houses_raw.bsb_main_pauta.year
    description: |
      Partition year derived from the DAG execution date of the Scrapy feed.
  month:
    lineage:
      - datalake_crawled_idactum_houses_raw.bsb_main_pauta.month
    description: |
      Partition month derived from the DAG execution date of the Scrapy feed.
  day:
    lineage:
      - datalake_crawled_idactum_houses_raw.bsb_main_pauta.day
    description: |
      Partition day derived from the DAG execution date of the Scrapy feed.
