---
database_name: datalake_demand_contact_submission_clean
table_name: contact_submissions
domain: Growth
owner: gabriel.salla@quintoandar.com
description: Clean layer for inbound demand contact form submissions. Captures user and house context from metadata JSON, contact channel, PII contact fields, and business context.
columns:
  id_contact_submission:
    lineage:
      - datalake_demand_contact_submission_raw.contact_submissions.id
    description: Primary key of the demand contact submission.
  id_contact_type:
    lineage:
      - datalake_demand_contact_submission_raw.contact_submissions.contact_type_id
    description: Foreign key to contact_submission_types.
  id_user:
    lineage:
      - datalake_demand_contact_submission_raw.contact_submissions.metadata
    description: User identifier extracted from submission metadata JSON (userId).
  id_house:
    lineage:
      - datalake_demand_contact_submission_raw.contact_submissions.metadata
    description: House identifier extracted from submission metadata JSON (houseId).
  id_region:
    lineage:
      - datalake_demand_contact_submission_raw.contact_submissions.metadata
    description: Region identifier extracted from submission metadata JSON (regionId).
  secretariat_tag:
    lineage:
      - datalake_demand_contact_submission_raw.contact_submissions.metadata
    description: AB secretariat tag extracted from metadata (abSecretariatTag).
  business_context:
    lineage:
      - datalake_demand_contact_submission_raw.contact_submissions.business_context
    description: Business context of the submission (RENT or SALE).
    categories:
      SALE: Sale-context demand contact submission.
      RENT: Rent-context demand contact submission.
  origin:
    lineage:
      - datalake_demand_contact_submission_raw.contact_submissions.origin
    description: Submission origin channel or landing surface.
  message:
    lineage:
      - datalake_demand_contact_submission_raw.contact_submissions.message
    description: Free-text message body submitted by the user (PII).
  user_name:
    lineage:
      - datalake_demand_contact_submission_raw.contact_submissions.user_name
    description: Submitter name (PII).
  user_email:
    lineage:
      - datalake_demand_contact_submission_raw.contact_submissions.user_email
    description: Submitter email address (PII).
  phone_country_code:
    lineage:
      - datalake_demand_contact_submission_raw.contact_submissions.phone_country_code
    description: Phone country code prefix (PII).
  phone_number:
    lineage:
      - datalake_demand_contact_submission_raw.contact_submissions.phone_number
    description: Phone number without country code (PII).
  metadata:
    lineage:
      - datalake_demand_contact_submission_raw.contact_submissions.metadata
    description: Raw JSON metadata payload from the submission service.
  version:
    lineage:
      - datalake_demand_contact_submission_raw.contact_submissions.version
    description: Optimistic lock version from the source service.
  ts_created_at:
    lineage:
      - datalake_demand_contact_submission_raw.contact_submissions.created_at
    description: Timestamp when the submission was created.
  year:
    lineage:
      - datalake_demand_contact_submission_raw.contact_submissions.created_at
    description: Hive partition year derived from ts_created_at for incremental loads.
  month:
    lineage:
      - datalake_demand_contact_submission_raw.contact_submissions.created_at
    description: Hive partition month derived from ts_created_at for incremental loads.
  day:
    lineage:
      - datalake_demand_contact_submission_raw.contact_submissions.created_at
    description: Hive partition day derived from ts_created_at for incremental loads.
