---
database_name: datalake_demand_contact_submission_clean
table_name: contact_submission_types_aud
domain: Growth
owner: gabriel.salla@quintoandar.com
description: Hibernate Envers audit history for contact submission types. Tracks type label changes with rev/revtype and mod_* flags.
columns:
  id_contact_submission_type:
    lineage:
      - datalake_demand_contact_submission_raw.contact_submission_types_aud.id
    description: Primary key of the contact submission type.
  rev:
    lineage:
      - datalake_demand_contact_submission_raw.contact_submission_types_aud.rev
    description: Hibernate Envers revision identifier. Foreign key to datalake_demand_contact_submission_raw.revinfo.rev.
  revend:
    lineage:
      - datalake_demand_contact_submission_raw.contact_submission_types_aud.revend
    description: Envers revision end marker; NULL when this audit row is the current version.
  revtype:
    lineage:
      - datalake_demand_contact_submission_raw.contact_submission_types_aud.revtype
    description: Hibernate Envers operation type for this audit row.
    categories:
      '0': INSERT — contact submission type record created in this revision.
      '1': UPDATE — contact submission type record modified in this revision.
      '2': DELETE — contact submission type record deleted (supported by Envers; not observed in production).
  type:
    lineage:
      - datalake_demand_contact_submission_raw.contact_submission_types_aud.type
    description: Human-readable label of the contact submission type.
  type_mod:
    lineage:
      - datalake_demand_contact_submission_raw.contact_submission_types_aud.type_mod
    description: Audit flag indicating whether type changed in this revision (Hibernate Envers _mod column indicating the field changed in this revision).
  ts_created_at:
    lineage:
      - datalake_demand_contact_submission_raw.contact_submission_types_aud.created_at
    description: Timestamp when the type record was created.
  ts_updated_at:
    lineage:
      - datalake_demand_contact_submission_raw.contact_submission_types_aud.updated_at
    description: Timestamp when the type record was last updated.
  year:
    lineage:
      - datalake_demand_contact_submission_raw.contact_submission_types_aud.created_at
    description: Hive partition year derived from ts_created_at for incremental loads.
  month:
    lineage:
      - datalake_demand_contact_submission_raw.contact_submission_types_aud.created_at
    description: Hive partition month derived from ts_created_at for incremental loads.
  day:
    lineage:
      - datalake_demand_contact_submission_raw.contact_submission_types_aud.created_at
    description: Hive partition day derived from ts_created_at for incremental loads.
