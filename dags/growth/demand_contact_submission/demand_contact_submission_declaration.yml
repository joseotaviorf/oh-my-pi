dag:
  name: demand_contact_submission
  schedule_start_date: 2022, 6, 15
  schedule_interval: 0 0 * * *
  owner: Data Growth
  documentation:
    dag_purpose: |
      This DAG imports the tables from Demand Contact Submission,
      a platform responsible manage the demand lead contact submission.
workflow:
  type: cdc
  layer: raw
  database_type: postgres
  source_schema: public
  custom_schema: demand_contact_submission
  source_database: demand_contact_submission
  dbutils_secret_key: DEMAND_CONTACT_SUBMISSION_DB
  lineage_product_database_name: demand_contact_submission
  tables_customization:
    contact_submission_types_aud: {}
    contact_submission_types: {}
    contact_submissions_aud: {}
    contact_submissions: {}
    message: {}
    revinfo:
      clean_table_name: rev_info

cluster:
  type: databricks_12_2_med_io-general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
