---
dag:
  name: enrich_user
  schedule_start_date: 2023, 4, 26
  owner: Data Growth
  documentation:
    dag_purpose:
      "This DAG main responsibility is to provide all the QuintoAndar Personas,
      by Personas, the user type, which can be a property owner, tenant, broker,
      photographer, pp multi, prospect, among others. It provides a daily snapshot."
workflow:
  type: query_delta
  layer: enrich
  inner_dependencies:
    persona_type:
      - broker_user
      - tenant
      - photographer_user
      - landlord
  default_extraction_type: incremental
  default_partitions:
    - year
    - month
    - day
  has_hive_sync: false
  tables_customization:
    persona_type:
      partitions:
        - client_type
        - year
        - month
        - day
      has_hive_sync: true
cluster:
  type: databricks_12_2_med_io-memory_photon_cluster
