---
database_name: datalake_user
table_name: persona_type
description: QuintoAndar Users daily snapshot unifying all personas types.
domain: Growth
owner: arthur.gonzaga@quintoandar.com.br
columns:
  id_snapshot:
    lineage:
      - datalake_user.broker_user.id_snapshot
      - datalake_user.tenant.id_snapshot
      - datalake_user.photographer_user.id_snapshot
      - datalake_user.landlord.id_snapshot
    description: The snapshot id, which is the D-1 date in the format "yyyyMMdd".
  id_user:
    lineage:
      - datalake_user.broker_user.id_user
      - datalake_user.tenant.id_user
      - datalake_user.photographer_user.id_user
      - datalake_user.landlord.id_user
    description: The user id in the main.
  id_user_type:
    description: The id for each user type
    categories:
      "1": For landlord type
      "2": For tenant type
      "3": For photographer type
      "4": For broker type
  id_country:
    lineage:
      - datalake_user.broker_user.id_country
      - datalake_user.tenant.id_country
      - datalake_user.photographer_user.id_country
      - datalake_user.landlord.id_country
    description: The user country id.
  client_type:
    lineage:
      - datalake_user.broker_user.client_type
      - datalake_user.tenant.client_type
      - datalake_user.photographer_user.client_type
      - datalake_user.landlord.client_type
    description: Client type assumed by the user.
  main_phone:
    lineage:
      - datalake_user.broker_user.main_phone
      - datalake_user.tenant.main_phone
      - datalake_user.photographer_user.main_phone
      - datalake_user.landlord.main_phone
    description: The user main_phone.
  name:
    lineage:
      - datalake_user.broker_user.name
      - datalake_user.tenant.name
      - datalake_user.photographer_user.name
      - datalake_user.landlord.name
    description: The user full_name.
  email:
    lineage:
      - datalake_user.broker_user.email
      - datalake_user.tenant.email
      - datalake_user.photographer_user.email
      - datalake_user.landlord.email
    description: The user email.
  cpf:
    lineage:
      - datalake_user.broker_user.cpf
      - datalake_user.tenant.cpf
      - datalake_user.photographer_user.cpf
      - datalake_user.landlord.cpf
    description: The user individual brazilian registry.
  journey_step:
    lineage:
      - datalake_user.tenant.journey_step
      - datalake_user.landlord.journey_step
    description:
      The tenant journey step, respecting how deep the customer is on their
      rental journey. Only tenants has this column filled.
    categories:
      Offboarding:
        Indicates if the client is currently in the offboarding step in
        the rental context
      Ongoing:
        Indicates if the client is in the ongoing step but not in the offboarding step
        in the rental context
      Onboarding:
        Indicates if the client is in the onboarding step but not in the offboarding
        or ongoing steps in the rental context
      Contract to Entrance:
        Indicates if the client is in the contract to entrance step but not in the
        onboarding, ongoing, or offboarding steps in the rental context
      Visits to Offer:
        Indicates if the client is in the visits to offer step but not in the contract
        to entrance, onboarding, ongoing, or offboarding steps in the rental context
      Listing and Search:
        Indicates if the client is in the listing and search step but not in the visits
        to offer, contract to entrance, onboarding, ongoing, or offboarding steps in the
        rental context
      Default:
        Indicates if the client is not currently active in any of the journey steps
        in the rental context
  persona_step:
    lineage:
      - datalake_user.tenant.persona_step
      - datalake_user.landlord.persona_step
    description:
      Indicates if the user is in any step before signing a contract or after signing a
      contract. If the user is in the post_contract step,it will not assume the
      pre_contract step. Only tenants have this column filled.
    categories:
      Pre_Contract:
        If the user has taken any step in contract to entrance, visits to offer, or
        listing and search, it signifies that the user is in a pre-contract step
      Post_Contract:
        If the user has taken any step in offboarding, ongoing, or onboarding, it
        indicates that the user is in a post-contract step
      Not_Apply: If the user is not in the pre or post contract steps
  is_active:
    lineage:
      - datalake_user.broker_user.is_active
      - datalake_user.tenant.is_active
      - datalake_user.photographer_user.is_active
      - datalake_user.landlord.is_active
    description: If the user is active or not.
  is_blocked:
    lineage:
      - datalake_user.broker_user.is_blocked
      - datalake_user.tenant.is_blocked
      - datalake_user.photographer_user.is_blocked
      - datalake_user.landlord.is_blocked
    description: If the user is blocked or not.
  is_pp_multi:
    lineage:
      - datalake_user.landlord.is_pp_multi
    description:
      If the user is part of pp_multi program or not. Assumes TRUE or FALSE for only
      the landlord client type.
  is_offboarding:
    lineage:
      - datalake_user.tenant.is_offboarding
      - datalake_user.landlord.is_offboarding
    description:
      If the user has an active termination, it indicates that the user is currently
      in the offboarding step of the rental journey.
  is_ongoing:
    lineage:
      - datalake_user.tenant.is_ongoing
      - datalake_user.landlord.is_ongoing
    description:
      If the user has at least one active contract and the last contract signed occurred
      past the last 40 days, with the snapshot date serving as the reference point, then the
      user is currently in the ongoing step of the rental journey
  is_onboarding:
    lineage:
      - datalake_user.tenant.is_onboarding
      - datalake_user.landlord.is_onboarding
    description:
      If the user has at least one active contract and the last contract signed occurred
      within the last 40 days, with the snapshot date serving as the reference point, then the
      user is currently in the onboarding step of the rental journey
  is_contract_to_entrance:
    lineage:
      - datalake_user.tenant.is_contract_to_entrance
      - datalake_user.landlord.is_contract_to_entrance
    description:
      If the user has had events such as the last evaluation start, last evaluation approval,
      last document sending, last credit approval, or last proposal rejection within the
      last 40 days, with the snapshot date as the reference point, then the user is
      currently in the contract to entrance step of the rental journey
  is_visits_to_offer:
    lineage:
      - datalake_user.tenant.is_visits_to_offer
      - datalake_user.landlord.is_visits_to_offer
    description:
      If the user has had events such as the last booking, last canceled booking,
      last visiting, last offer sending, last offer rejected, last reservation created,
      or last offer approval within the last 40 days, with the snapshot date as the
      reference point, then the user is currently in the visits to offer step of
      the rental journey. It assumes value only for tenants.
  is_listing_and_search:
    lineage:
      - datalake_user.tenant.is_listing_and_search
      - datalake_user.landlord.is_listing_and_search
    description:
      If the user has had a last house searching event within the last 40 days, with
      the snapshot date as the reference point, then the user is currently in the
      listing and search step of the rental journey. It assumes value only for tenants.
  is_pre_contract:
    lineage:
      - datalake_user.tenant.is_pre_contract
      - datalake_user.landlord.is_pre_contract
    description:
      If the user has taken any step in contract to entrance, visits to offer, or
      listing and search, it signifies that the user is in a pre-contract step.
      It assumes value only for tenants.
  is_post_contract:
    lineage:
      - datalake_user.tenant.is_post_contract
      - datalake_user.landlord.is_post_contract
    description:
      If the user has taken any step in offboarding, ongoing, or onboarding, it indicates
      that the user is in a post-contract step. It assumes value only for tenants.
  dt_birth:
    lineage:
      - datalake_user.broker_user.dt_birth
      - datalake_user.tenant.dt_birth
      - datalake_user.photographer_user.dt_birth
      - datalake_user.landlord.dt_birth
    description: The user birth date.
  ts_user_created:
    lineage:
      - datalake_user.broker_user.ts_user_created
      - datalake_user.tenant.ts_user_created
      - datalake_user.photographer_user.ts_user_created
      - datalake_user.landlord.ts_user_created
    description: The user creation date in the system.
  ts_user_updated:
    lineage:
      - datalake_user.broker_user.ts_user_updated
      - datalake_user.tenant.ts_user_updated
      - datalake_user.photographer_user.ts_user_updated
      - datalake_user.landlord.ts_user_updated
    description: The user last updated date in the system.
  year:
    lineage:
      - datalake_user.broker_user.year
      - datalake_user.tenant.year
      - datalake_user.photographer_user.year
      - datalake_user.landlord.year
    description: Snapshot year, partition column.
  month:
    lineage:
      - datalake_user.broker_user.month
      - datalake_user.tenant.month
      - datalake_user.photographer_user.month
      - datalake_user.landlord.month
    description: Snapshot month, partition column.
  day:
    lineage:
      - datalake_user.broker_user.day
      - datalake_user.tenant.day
      - datalake_user.photographer_user.day
      - datalake_user.landlord.day
    description: Snapshot day, partition column.
