---
database_name: datalake_user
table_name: photographer_user
description: |
  [TO BE DEPRECATED, AVOID USING THIS TABLE] Daily snapshot (D-1) of active QuintoAndar photographers from EBDB. One row per photographer
  user per snapshot date, filtered to users flagged as active photographers in
  `datalake_ebdb_clean.user`. Contains PII inherited from the clean user table.
  Produced by the `enrich_user` DAG; feeds `datalake_user.persona_type`.
  Partitioned by `year`, `month`, `day`, use it in the WHERE clause to enable partition
  pruning and avoid full table scans.
domain: Growth
owner: isadora.gallerani@quintoandar.com.br
columns:
  id_snapshot:
    description: The snapshot id, which is the D-1 date in the format "yyyyMMdd"
  id_user:
    lineage:
      - datalake_ebdb_clean.user.id
    description: The user id in the main (EBDB.Usuario.id).
  id_country:
    lineage:
      - datalake_ebdb_clean.user.id_country
    description: |
      Foreign key to the EBDB country dimension (`country_id` on `Usuario`). Identifies the
      photographer's registered country in the main database.
  client_type:
    description: Client type defined as photographer.
  country_code:
    lineage:
      - datalake_ebdb_clean.country.country_code
    description: |
      ISO-style country code from `datalake_ebdb_clean.country`, joined via `id_country`.
      Identifies the photographer's operating country for regional Growth analytics.
  main_phone:
    lineage:
      - datalake_ebdb_clean.user.main_phone
    description: |
      Primary contact phone number from EBDB `Usuario.main_phone`. Contains PII — restrict
      access per data policy.
  name:
    lineage:
      - datalake_ebdb_clean.user.name
    description: |
      Full display name from EBDB `Usuario.name`. Contains PII — used for Growth persona
      analytics, not for external export.
  email:
    lineage:
      - datalake_ebdb_clean.user.email
    description: |
      Primary email address from EBDB `Usuario.email`. Contains PII — join key for
      marketing and identity resolution.
  cpf:
    lineage:
      - datalake_ebdb_clean.user.cpf
    description: The user individual brazilian registry.
  is_active:
    lineage:
      - datalake_ebdb_clean.user.is_active
    description: If the user is active or not.
  is_blocked:
    lineage:
      - datalake_ebdb_clean.user.is_blocked
    description: If the user is blocked or not.
  dt_birth:
    lineage:
      - datalake_ebdb_clean.user.dt_birth
    description: |
      Date of birth from EBDB `Usuario`, cast to DATE. Contains PII under LGPD personal
      data classification.
  ts_user_created:
    lineage:
      - datalake_ebdb_clean.user.ts_created
    description: The user creation date in the system.
  ts_user_updated:
    lineage:
      - datalake_ebdb_clean.user.ts_updated
    description: The user last updated date in the system.
  year:
    description: Snapshot year, partition column.
  month:
    description: Snapshot month, partition column.
  day:
    description: Snapshot day, partition column.
