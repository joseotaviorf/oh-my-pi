---
dag:
  name: enrich_supply_conversion_3p
  schedule_start_date: 2019, 1, 1
  owner: Data Growth
  documentation: 
    dag_purpose: |
      This DAG is responsible for create tables with enriched data from supply conversion steps for 3P flows. The context is tracking conversion of supply and transform data from qualified to first_listing steps.
workflow:
  type: query_delta
  layer: enrich
  custom_schema: supply_flows_migrate
  default_extraction_type: incremental
  default_partitions: ["year", "month", "day"]
  tables_customization:
    conversion_events_3p:
      extraction_type: full
  inner_dependencies:
    conversion_events_3p:
      - qualified_3p
      - av_qualified_3p
      - opportunity_3p
  spark_session_configs:
    udfs: [SF_NORMALIZE_STRING]
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, macros.ds_add(ds, -6), 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, ds, 'load_end_date') }}"
cluster:
  type: databricks_12_2_min_io-memory_photon_cluster