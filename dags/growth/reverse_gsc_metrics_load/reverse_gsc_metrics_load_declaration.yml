dag:
  name: reverse_gsc_metrics_load
  owner: Data Growth
  schedule_start_date: 2026, 8, 26
  documentation:
    dag_purpose: |
      Aggregates Google Search Console performance by canonical search page.
      It produces 7, 30, and 90 day snapshots consumed by the Internal Linking
      access DAG for selective SQS publication. Snapshots close at D-7 because
      GSC rewrites the last seven days and recent calendar days are often empty.
      The DAG is dataset-triggered after GSC clean and executes on Mondays only.
workflow:
  type: load
  layer: reverse
  custom_schema: gsc_metrics
  default_extraction_type: incremental
  default_partitions:
    - ref_date
  short_circuit_customization:
    function: CHECK_IS_SPECIFIC_WEEKDAY
    function_params:
      weekday: 0
  tables_customization:
    gsc_page_metrics:
      merge_on:
        - page_id
        - ref_date
