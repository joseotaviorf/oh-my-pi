---
database_name: datalake_open_external_data_addresses
table_name: iptu_sp
description: >
  Deduplicated set of distinct residential property addresses extracted from São Paulo's
  IPTU (Imposto Predial e Territorial Urbano) municipal property tax records. Each row
  represents a unique address combination used as input for geocoding to obtain latitude
  and longitude coordinates, enabling geographic enrichment of property and market data
  for Growth analytics.
domain: Atlas DB
owner: gabriel.mota@quintoandar.com.br
columns:
  id_address:
    description: MD5 hash of the concatenated street name, unit number, and city name, serving as a unique surrogate key for each distinct address.
  address:
    lineage:
      - datalake_iptu_clean.iptu_sp.address_street_name
    description: Street name as recorded in the IPTU São Paulo fiscal cadastre, used as the primary address field for geocoding.
  number:
    description: Street number or unit number of the property; set to 'N/A' when absent or when the original value indicates an unknown address (99999).
  neighborhood:
    lineage:
      - datalake_iptu_clean.iptu_sp.address_neighborhood
    description: Neighborhood name with the highest probability of corresponding to this address's postal code, formatted in title case for consistency.
  zipcode:
    lineage:
      - datalake_iptu_clean.iptu_sp.address_zipcode
    description: Brazilian postal code (CEP) associated with the property address, used for geographic filtering and cross-dataset joining.
  city:
    description: Municipality name of the property address; always 'São Paulo' for this table, as data is sourced exclusively from the SP IPTU dataset.