database_name: datalake_media_plan
table_name: branding_media_plan_daily
owner: davi.lirio@quintoandar.com.br
domain: growth
description: Each row of this table is a branding cost related to advertising.
columns:
  id_date:
    description: Date of the cost, as integer data type (YYYMMMDD).
    lineage:
      - datalake_gsheets_clean.media_plan_current_quarter.dt_started
      - datalake_media_plan_clean.media_plan.dt_ended
      - datalake_gsheets_clean.media_plan_current_quarter.dt_insertion_order
      - datalake_media_plan_clean.media_plan.dt_insertion_order
  id_insertion_order:
    description: Id of the insertion order in the media platform.
    lineage:
      - datalake_gsheets_clean.media_plan_current_quarter.dt_insertion_order
      - datalake_media_plan_clean.media_plan.dt_insertion_order
  media:
    description: Type of media which generated the cost.
    lineage:
      - datalake_gsheets_clean.media_plan_current_quarter.media
      - datalake_media_plan_clean.media_plan.media
  media_mmm:
    description: Type of media which generated the cost, formated to MMM algorithm.
    lineage:
      - datalake_gsheets_clean.media_plan_current_quarter.media
      - datalake_media_plan_clean.media_plan.media
  network:
    description: Name of the platform where the campaign was broadcast, such as the name of the TV station. 
    lineage:
      - datalake_gsheets_clean.media_plan_current_quarter.network
      - datalake_media_plan_clean.media_plan.network
  short_region_name:
    lineage:
    description: Acronym of the state where the campaign was broadcast.
      - datalake_gsheets_clean.media_plan_current_quarter.short_region_name
      - datalake_media_plan_clean.media_plan.short_region_name
  city_group:
    description: Full name of the region where the campaign was broadcast.
    lineage:
      - datalake_marketing_offline_costs_clean.marketing_offline_manual_share_city_group.city_group
      - datalake_region.region.city_group
  city_name:
    description: Full name of the city where the campaign was broadcast.
    lineage:
      - datalake_gsheets_clean.media_plan_current_quarter.city_name
      - datalake_media_plan_clean.media_plan.city_name
  channel:
    description: Platform where the campaign was broadcast, such as the name of the TV station. 
    lineage:
      - datalake_gsheets_clean.media_plan_current_quarter.channel
      - datalake_media_plan_clean.media_plan.channel
  program:
    description: TV program/location where the media was broadcast.
    lineage:
      - datalake_gsheets_clean.media_plan_current_quarter.program
      - datalake_media_plan_clean.media_plan.program
  program_frequency:
    description: Days of the week on which advertising will take place on the TV program.
    lineage:
      - datalake_gsheets_clean.media_plan_current_quarter.program_frequency
      - datalake_media_plan_clean.media_plan.frequency
  program_hour_started:
    description: Start time of the TV program on which advertising will take place.
    lineage:
      - datalake_gsheets_clean.media_plan_current_quarter.program_hour_started
      - datalake_media_plan_clean.media_plan.hour_started
  program_hour_ended:
    description: End time of the TV program on which advertising will take place.
    lineage:
      - datalake_gsheets_clean.media_plan_current_quarter.program_hour_ended
      - datalake_media_plan_clean.media_plan.hour_ended
  program_genre:
    description: Genre of the TV program on which advertising will take place (i.e Soap operas, talk shows, journalistic shows.).
    lineage:
      - datalake_gsheets_clean.media_plan_current_quarter.program_genre
      - datalake_media_plan_clean.media_plan.genre
  program_daypart:
    description: Shift of the day of the TV program on which advertising will take place.
    lineage:
      - datalake_gsheets_clean.media_plan_current_quarter.program_daypart
      - datalake_media_plan_clean.media_plan.daypart
  creative_name:
    description: Midia creative name.
    lineage:
      - datalake_gsheets_clean.media_plan_current_quarter.creative_name
      - datalake_media_plan_clean.media_plan.creative
  ad_description:
    description: Short description of the advertising.
    lineage:
      - datalake_gsheets_clean.media_plan_current_quarter.ad_description
      - datalake_media_plan_clean.media_plan.ad_description
  ad_type:
    description: Type of the advertising.
    lineage:
      - datalake_gsheets_clean.media_plan_current_quarter.ad_type
      - datalake_media_plan_clean.media_plan.ad_type
  daily_cost:
    description: Daily cost of the tv insertion/media.
    lineage:
      - datalake_gsheets_clean.media_plan_current_quarter.cost
      - datalake_media_plan_clean.media_plan.cost
      - datalake_marketing_offline_costs_clean.marketing_offline_manual_share_city_group.share
  daily_grp:
    description: Gross Rating Points is a metric used to understand the population estimate of people impacted by the campaign on the day. One can think of Ibope points.
    lineage:
      - datalake_gsheets_clean.media_plan_current_quarter.grp
      - datalake_media_plan_clean.media_plan.grp
      - datalake_marketing_offline_costs_clean.marketing_offline_manual_share_city_group.share
  daily_trp:
    description: Target Rating Points, here is the same GRP but related to the campaign's target audience. In other words, what is the population estimate of people who were the campaign's target audience and who were impacted by the campaign's creatives that day.
    lineage:
      - datalake_gsheets_clean.media_plan_current_quarter.trp
      - datalake_media_plan_clean.media_plan.trp
      - datalake_marketing_offline_costs_clean.marketing_offline_manual_share_city_group.share
  dt_insertion_order:
    description: Date of when the insertion whas ordered.
    lineage:
      - datalake_gsheets_clean.media_plan_current_quarter.dt_insertion_order
      - datalake_media_plan_clean.media_plan.dt_insertion_order
  dt_started:
    description: Date of when the media broadcast started.
    lineage:
      - datalake_gsheets_clean.media_plan_current_quarter.dt_started
      - datalake_media_plan_clean.media_plan.dt_started
      - datalake_gsheets_clean.media_plan_current_quarter.dt_insertion_order
      - datalake_media_plan_clean.media_plan.dt_insertion_order
  dt_ended:
    description: Date of when the media broadcast ended.
    lineage:
      - datalake_gsheets_clean.media_plan_current_quarter.dt_ended
      - datalake_media_plan_clean.media_plan.dt_ended
      - datalake_gsheets_clean.media_plan_current_quarter.dt_insertion_order
      - datalake_media_plan_clean.media_plan.dt_insertion_order