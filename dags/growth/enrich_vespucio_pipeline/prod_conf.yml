dag_documentation:
  dag_purpose:
    "Vespúcio is a service that aims to generate a source of truth for condos and houses, joining multiple separate
    sources of data. This DAG is responsible for orchestrating its execution. For more information, there is the GitHub
    [Vespucio Repository](https://github.com/quintoandar/vespucio)"
elastic_search_url: "https://vpc-vespucio-prod-us-east-1-o56l6pbmnwaphvb7rqxzsapso4.us-east-1.es.amazonaws.com/"
sqs_url_house_enrichment: "https://sqs.us-east-1.amazonaws.com/632540934959/ProdMainHouseEnrichmentHousesToBeReEnriched"
kodak_photo_sns_arn: "arn:aws:sns:us-east-1:632540934959:ProdKodakPhoto"

custom_cluster:
  driver_node_type_id: m5d.2xlarge
  node_type_id: m5d.4xlarge
  num_workers: 4
  runtime_engine: PHOTON
  spark_version: 13.3.x-scala2.12
  aws_attributes:
    ebs_volume_size: 200
    instance_profile_arn: "{{ var.value.instance_profile_secret_arn_vespucio }}"
