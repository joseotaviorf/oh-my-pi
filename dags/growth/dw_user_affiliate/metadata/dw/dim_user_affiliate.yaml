database_name: dw_public
table_name: dim_user_affiliate
description: Dimension table describing every user registered in QuintoAndar's affiliate
  (Indica Aí) program, enriched with marketing tracking attribution and geographic
  segmentation. Intended grain is one row per affiliate (sk_user_affiliate); a small
  share of duplicate surrogate keys exists in production and should be handled downstream.
domain: Growth
owner: gabriel.salla@quintoandar.com
columns:
  sk_user_affiliate:
    lineage:
    - datalake_ebdb_user.affiliate_data.id
    description: Surrogate key for the affiliate record, sourced from the affiliate_data
      primary key and used as the primary join key in the data warehouse.
  sk_user:
    lineage:
    - datalake_ebdb_user.user.id
    description: Surrogate key linking the affiliate to their corresponding user record
      in the data warehouse user dimension.
  id_user_affiliate:
    lineage:
    - datalake_ebdb_user.affiliate_data.id
    description: Natural business identifier of the affiliate record in the source
      system, equivalent to the affiliate_data primary key.
  sk_user_indicated_by:
    lineage:
    - datalake_ebdb_user.affiliate_data.id_indicated_by
    description: Surrogate key of the affiliate who referred this user into the program,
      enabling referral chain analysis within the affiliate network.
  origin:
    lineage:
    - datalake_ebdb_user.affiliate_data.origin
    description: Source-system flag describing how the affiliate entered the Indica Aí program.
    categories:
      OpenLink: Affiliate joined through a generic open referral link without a tracked referrer.
      Untraced: Affiliate joined with no attributable acquisition origin recorded in the source system.
      LeadProcessing: Affiliate created through the lead-processing workflow rather than self-service signup.
  type:
    lineage:
    - datalake_ebdb_user.affiliate_data.affiliate_type
    description: Classification of affiliate
    categories:
      Agent: Real-estate agent affiliate.
      B2BPartner: B2B partner affiliate.
      Standard: Standard affiliate program member.
  marketing_city_group:
    lineage:
    - datalake_amplitude_user.user_affiliate_origin.city_campaign
    - datalake_region.region.city_group
    description: Marketing city group assigned to the affiliate at registration, used for geographic performance segmentation.
  regional:
    lineage:
    - datalake_region.region.regional
    description: Macro regional cluster mapped from the affiliate marketing city group,
      used for geographic segmentation in Growth affiliate reporting.
    categories:
      GFPC: Greater Florianópolis and Paraná Coast cluster.
      Nordeste: Northeast Brazil regional cluster.
      Norte: North Brazil regional cluster.
      RJPB: Rio de Janeiro and Paraíba regional cluster.
      SPMG: São Paulo and Minas Gerais regional cluster.
      Vitória: Vitória regional cluster.
      International: International affiliates outside Brazil.
  tracking_source:
    lineage:
    - datalake_amplitude_user.user_affiliate_origin.utm_source
    description: Affiliate origin source
  tracking_medium:
    lineage:
    - datalake_amplitude_user.user_affiliate_origin.utm_medium
    description: UTM medium parameter captured when the affiliate registered, indicating the marketing delivery method.
  tracking_campaign:
    lineage:
    - datalake_amplitude_user.user_affiliate_origin.utm_campaign
    description: Affiliate origin campaign
  tracking_content:
    lineage:
    - datalake_amplitude_user.user_affiliate_origin.utm_content
    description: UTM content parameter recorded at the moment the affiliate registered,
      used to differentiate creatives or ad variants within the acquisition campaign.
  tracking_term:
    lineage:
    - datalake_amplitude_user.user_affiliate_origin.utm_term
    description: UTM term parameter recorded at registration, typically capturing the
      paid search keyword that drove the affiliate to join the program.
  tracking_platform:
    lineage:
    - datalake_amplitude_user.user_affiliate_origin.platform
    description: Web platform used when the affiliate registered for the program.
    categories:
      web_desktop: Affiliate registered through the desktop web experience.
      web_mobile: Affiliate registered through the mobile web experience.
  tracking_device_type:
    lineage:
    - datalake_amplitude_user.user_affiliate_origin.device_type
    description: Device type reported by Amplitude when the affiliate registered.
    categories:
      Android: Android mobile device.
      Apple iPad: Apple iPad tablet device.
      Apple iPhone: Apple iPhone mobile device.
      Chromium OS: Chromium OS device (typically Chromebook).
      Linux: Linux desktop or laptop device.
      Mac: macOS desktop or laptop device.
      Windows: Windows desktop or laptop device.
  tracking_country:
    lineage:
    - datalake_amplitude_user.user_affiliate_origin.user_country
    description: Affiliate origin country
  tracking_state:
    lineage:
    - datalake_amplitude_user.user_affiliate_origin.region
    description: Affiliate origin state
  tracking_city:
    lineage:
    - datalake_amplitude_user.user_affiliate_origin.city
    description: Affiliate origin city
  mkt_origin:
    lineage:
    - datalake_gsheets_clean.taxonomy_affiliates.mkt_origin
    description: Standardised marketing origin from the affiliate taxonomy, classifying
      the acquisition program (e.g. Indica Aí - General) for performance segmentation.
    categories:
      Indica Aí - General: General Indica Aí affiliate acquisition program.
      Indica Aí - Agents: Agent-specific Indica Aí acquisition program.
      Other: Affiliate origin not mapped to a named program bucket.
      Doorman: Doorman-driven affiliate acquisition (rare).
      Tenants PWA: Tenant PWA-driven affiliate acquisition (rare).
  mkt_channel:
    lineage:
    - datalake_gsheets_clean.taxonomy_affiliates.mkt_channel
    description: Standardised marketing channel from the affiliate taxonomy, grouping
      the affiliate's acquisition source into strategic channel buckets for reporting.
    categories:
      Organic: Organic affiliate acquisition channel.
      Paid: Paid media affiliate acquisition channel.
      Not Mapped: UTM combination not matched in the affiliate taxonomy.
      CRM/Notification: CRM or notification-driven affiliate acquisition channel.
      Paid Acquisition: Paid acquisition channel bucket (rare).
  mkt_medium:
    lineage:
    - datalake_gsheets_clean.taxonomy_affiliates.mkt_medium
    description: Standardised marketing medium from the affiliate taxonomy, indicating
      the delivery method or strategy used to acquire the affiliate (e.g. SEM Branded,
      Display, Direct).
    categories:
      Cross Domain: Affiliate acquired through cross-domain referral traffic.
      Direct: Affiliate acquired through direct or untagged traffic.
      Display: Affiliate acquired through display advertising campaigns.
      Email: Affiliate acquired through email marketing campaigns.
      Not Mapped: Affiliate UTM combination not matched in the taxonomy lookup.
      Retargeting: Affiliate acquired through retargeting campaigns.
      SEM Branded: Affiliate acquired through branded search engine marketing.
      SEM non-branded: Affiliate acquired through non-branded search engine marketing.
      SMS: Affiliate acquired through SMS outreach campaigns.
  mkt_source:
    lineage:
    - datalake_gsheets_clean.taxonomy_affiliates.mkt_source
    description: Standardised marketing source from the affiliate taxonomy, providing
      a cleaner label for the traffic origin that drove the affiliate registration.
  is_realstate_agent:
    lineage:
    - datalake_ebdb_user.agent_data.is_realstate_agent
    description: Flag which indicates if affiliate is real state agent
  is_photographer:
    lineage:
    - datalake_ebdb_user.agent_data.is_photographer
    description: Flag which indicates if affiliate is photographer
  is_active:
    lineage:
    - datalake_ebdb_user.affiliate_data.is_active
    description: Flag which indicates whether user is still registered in the affiliates
      program. If is_active = false, it means that user has opted out from affiliates
      program.
  ts_joined_program:
    lineage:
    - datalake_ebdb_user.affiliate_data.ts_operation_start
    description: Date and time when user joined affiliate program
  ts_created:
    lineage:
    - datalake_ebdb_user.affiliate_data.ts_created
    description: Timestamp of the moment when affiliate user was created
  ts_updated:
    lineage:
    - datalake_ebdb_user.affiliate_data.ts_updated
    description: Timestamp of the moment when affiliate user was updated
  ts_load:
    description: Timestamp of data load event (UTC timezone)
