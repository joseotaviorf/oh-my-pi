dag:
  name: amplitude_optimization
  owner: Data Growth
  schedule_interval: null
  documentation:
    dag_purpose: |
      Manual clean-only twin of amplitude_new. TEMPORARY CONTROL RUN: partitions
      match production amplitude_new ([id_app, event_type, year, month, day]) so we
      can measure NVMe + single-day without the v2 partition drop. Trigger only
      bietlejuice.amplitude_optimization__validation (writes to cluster_validation.*);
      do not trigger the main twin while this partition scheme is in place — it would
      write event_type partitions into datalake_amplitude_events_v2_clean.
      Revert partitions to [id_app, year, month, day] after the control measurement.
workflow:
  type: query_delta
  layer: clean
  custom_schema: amplitude_events_v2
  execution_timeout_hours: 5
  default_extraction_type: incremental
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  tables_customization:
    events:
      extraction_type: incremental
      # TEMP: match amplitude_new v1 partition scheme for NVMe control via __validation.
      partitions: ["id_app", "event_type", "year", "month", "day"]
      run_optimize: false
      run_vacuum: false
      has_hive_sync: false
