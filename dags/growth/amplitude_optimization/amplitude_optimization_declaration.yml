dag:
  name: amplitude_optimization
  owner: Data Growth
  schedule_interval: null
  documentation:
    dag_purpose: |
      Cluster-validation twin of amplitude_new: optimized Amplitude raw ingestion
      (server-side S3 prefix listing + single distributed read instead of a
      per-app driver-side Hadoop glob). Exercised only through the
      amplitude_optimization__validation DAG, which redirects writes to the
      cluster_validation schema on Graviton; the prod variant is inert
      (schedule_interval: null) so it never touches production data.
workflow:
  type: custom_ingestion
  layer: raw
  load_spark_job: load_amplitude_optimization_raw
  execution_timeout_hours: 3
  spark_job_arguments:
    - "{environment}"
    - "{bucket}"
    - "{dag_name}"
  tables_customization:
    events:
      extraction_type: incremental
      partitions: ["id_app", "event_type", "year", "month", "day"]
      extra_spark_job_arguments:
        - "{{ data_interval_start | ds }}"
      run_optimize: false
      run_vacuum: false
      has_hive_sync: false
