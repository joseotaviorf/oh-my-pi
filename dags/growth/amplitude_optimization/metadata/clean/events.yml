---
database_name: datalake_amplitude_optimization_clean
table_name: events
domain: Growth
description: >-
  Cleaned, type-cast Amplitude product analytics events (one row per tracked event),
  partitioned by application, event type and date. Benchmark twin of
  datalake_amplitude_events_clean.events used to validate the optimized pipeline.
columns:
  id_amplitude:
    description: "Amplitude internal user identifier for the event."
    lineage:
      - datalake_amplitude_new_raw.events.amplitude_id
  ids_amplitude_attributed:
    description: "Array of Amplitude attribution identifiers for the event."
    lineage:
      - datalake_amplitude_new_raw.events.amplitude_attribution_ids
  adid:
    description: "Google advertising identifier (ADID) of the device."
    lineage:
      - datalake_amplitude_new_raw.events.adid
  amplitude_event_type:
    description: "Amplitude system event type label."
    lineage:
      - datalake_amplitude_new_raw.events.amplitude_event_type
  id_app:
    description: "Amplitude application/project identifier the event belongs to."
    lineage:
      - datalake_amplitude_new_raw.events.app
  city:
    description: "City inferred from the event IP geolocation."
    lineage:
      - datalake_amplitude_new_raw.events.city
  ts_client_event:
    description: "Timestamp when the event occurred on the client device."
    lineage:
      - datalake_amplitude_new_raw.events.client_event_time
  ts_client_uploaded:
    description: "Timestamp when the client uploaded the event."
    lineage:
      - datalake_amplitude_new_raw.events.client_upload_time
  country:
    description: "Country inferred from the event IP geolocation."
    lineage:
      - datalake_amplitude_new_raw.events.country
  data:
    description: "Raw Amplitude internal data payload for the event."
    lineage:
      - datalake_amplitude_new_raw.events.data
  ts_server_received:
    description: "Timestamp when Amplitude servers received the event."
    lineage:
      - datalake_amplitude_new_raw.events.server_received_time
  device_brand:
    description: "Brand of the device that generated the event."
    lineage:
      - datalake_amplitude_new_raw.events.device_brand
  device_carrier:
    description: "Mobile carrier of the device that generated the event."
    lineage:
      - datalake_amplitude_new_raw.events.device_carrier
  device_family:
    description: "Device family classification reported by Amplitude."
    lineage:
      - datalake_amplitude_new_raw.events.device_family
  id_device:
    description: "Device identifier associated with the event."
    lineage:
      - datalake_amplitude_new_raw.events.device_id
  device_manufacturer:
    description: "Manufacturer of the device that generated the event."
    lineage:
      - datalake_amplitude_new_raw.events.device_manufacturer
  device_model:
    description: "Model of the device that generated the event."
    lineage:
      - datalake_amplitude_new_raw.events.device_model
  device_type:
    description: "Type of device that generated the event."
    lineage:
      - datalake_amplitude_new_raw.events.device_type
  dma:
    description: "Designated market area inferred from geolocation."
    lineage:
      - datalake_amplitude_new_raw.events.dma
  id_event:
    description: "Sequential event identifier assigned by Amplitude."
    lineage:
      - datalake_amplitude_new_raw.events.event_id
  ts_event:
    description: "Event timestamp used by Amplitude for ordering."
    lineage:
      - datalake_amplitude_new_raw.events.event_time
  event_type:
    description: "Name of the product event that was tracked."
    lineage:
      - datalake_amplitude_new_raw.events.event_type
  event_properties:
    description: "JSON string of custom properties attached to the event."
    lineage:
      - datalake_amplitude_new_raw.events.event_properties
  is_attribution_event:
    description: "Flag indicating whether the event is an attribution event."
    lineage:
      - datalake_amplitude_new_raw.events.is_attribution_event
  idfa:
    description: "Apple identifier for advertisers (IDFA) of the device."
    lineage:
      - datalake_amplitude_new_raw.events.idfa
  ip_address:
    description: "IP address from which the event was sent."
    lineage:
      - datalake_amplitude_new_raw.events.ip_address
  location_lat:
    description: "Latitude of the event location when available."
    lineage:
      - datalake_amplitude_new_raw.events.location_lat
  location_lng:
    description: "Longitude of the event location when available."
    lineage:
      - datalake_amplitude_new_raw.events.location_lng
  os_name:
    description: "Operating system name of the device."
    lineage:
      - datalake_amplitude_new_raw.events.os_name
  os_version:
    description: "Operating system version of the device."
    lineage:
      - datalake_amplitude_new_raw.events.os_version
  platform:
    description: "Platform on which the event was generated."
    lineage:
      - datalake_amplitude_new_raw.events.platform
  library:
    description: "Amplitude SDK library that emitted the event."
    lineage:
      - datalake_amplitude_new_raw.events.library
  is_paying:
    description: "Flag indicating whether the user is a paying user."
    lineage:
      - datalake_amplitude_new_raw.events.paying
  region:
    description: "Region or state inferred from geolocation."
    lineage:
      - datalake_amplitude_new_raw.events.region
  ts_server_uploaded:
    description: "Timestamp when the event was uploaded to Amplitude servers."
    lineage:
      - datalake_amplitude_new_raw.events.server_upload_time
  id_session:
    description: "Identifier of the user session for the event."
    lineage:
      - datalake_amplitude_new_raw.events.session_id
  start_version:
    description: "App version on which the user first started."
    lineage:
      - datalake_amplitude_new_raw.events.start_version
  ts_user_created:
    description: "Timestamp when the Amplitude user was first created."
    lineage:
      - datalake_amplitude_new_raw.events.user_creation_time
  id_user:
    description: "Product user identifier associated with the event."
    lineage:
      - datalake_amplitude_new_raw.events.user_id
  user_properties:
    description: "JSON string of user properties at event time."
    lineage:
      - datalake_amplitude_new_raw.events.user_properties
  language:
    description: "Language setting of the device or user."
    lineage:
      - datalake_amplitude_new_raw.events.language
  uuid:
    description: "Universally unique identifier of the event record."
    lineage:
      - datalake_amplitude_new_raw.events.uuid
  version_name:
    description: "Application version name reported with the event."
    lineage:
      - datalake_amplitude_new_raw.events.version_name
  id_schema:
    description: "Amplitude schema version identifier for the event."
    lineage:
      - datalake_amplitude_new_raw.events.schema
  ts_processed:
    description: "Timestamp when Amplitude processed the event."
    lineage:
      - datalake_amplitude_new_raw.events.processed_time
  id_inserted:
    description: "Idempotency insert identifier used for deduplication."
    lineage:
      - datalake_amplitude_new_raw.events.insert_id
  sample_rate:
    description: "Sampling rate applied to the event, when present."
    lineage:
      - datalake_amplitude_new_raw.events.sample_rate
  year:
    description: "Event partition year derived from server upload time."
    lineage:
      - datalake_amplitude_new_raw.events.year
  month:
    description: "Event partition month derived from server upload time."
    lineage:
      - datalake_amplitude_new_raw.events.month
  day:
    description: "Event partition day derived from server upload time."
    lineage:
      - datalake_amplitude_new_raw.events.day
