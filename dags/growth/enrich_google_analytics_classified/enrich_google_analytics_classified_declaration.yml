---
dag:
  name: enrich_google_analytics_classified
  schedule_start_date: 2022, 10, 18
  owner: Data Growth
  documentation:
    dag_purpose:
      This DAG generates tables to track demand user behaviors in the Google
      Analytics classified SEO funnel. It is relevant for the SEO tribe to monitor and analyze
      the results by page type so that the squads (transactional and informational)
      can more efficiently identify problems, impacts, and opportunities. In addition,
      this funnel helps to prioritize the most relevant pages for the business.
workflow:
  type: query_delta
  layer: enrich
  default_extraction_type: incremental
  default_partitions: [year, month, day]
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, macros.ds_add(ds, -7), 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, macros.ds_add(ds, -1), 'load_end_date') }}"
  tables_customization:
   seo_ga_data:
    default_table_privileges:
      software-engineers:
        - ALL PRIVILEGES
      analytics-engineers:
        - ALL PRIVILEGES
cluster:
  type: custom_cluster
  databricks_conn_id: databricks_new_env
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE
  custom_configurations:
    driver_node_type_id: r5a.4xlarge
    node_type_id: r5a.4xlarge
    num_workers: 5
    spark_version: 16.4.x-scala2.12
    aws_attributes:
      ebs_volume_size: 200
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
