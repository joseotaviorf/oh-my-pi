---
database_name: datalake_amplitude_offer
table_name: sale_offer_raw_events
owner: isadora.gallerani@quintoandar.com.br
domain: Growth
description: |
  Enrich table for For Sale offer-form acceptance events from Amplitude
  (170698_sale_offer_form_accepted_events). One row per offer (ep_id_firestore) — deduplicated
  to the latest ts_event per offer via ROW_NUMBER. Incremental load filtered by year/month/day
  between load_start_date and load_end_date. Adds UTM attribution and branded campaign flags.
  Partitioned by year, month, and day — always filter on all three partition columns in WHERE
  clauses to enable partition pruning. Consumed by For Sale DW (dim_offer, fact_sale_flows) and
  Growth demand conversion pipelines.
columns:
  id_user:
    description: |
      QuintoAndar user identifier of the buyer who accepted the sale offer form.
    lineage:
      - datalake_amplitude_clean.170698_sale_offer_form_accepted_events.id_user
  id_app:
    description: |
      Amplitude application identifier. Hardcoded to '170698' in the enrich SQL for this event
      stream — not sourced from a column in the clean table.
  id_house:
    description: |
      QuintoAndar property identifier associated with the sale offer. Renamed from ep_id_house
      in the clean Amplitude event.
    lineage:
      - datalake_amplitude_clean.170698_sale_offer_form_accepted_events.ep_id_house
  id_offer:
    description: |
      Firestore document identifier of the sale offer. Renamed from ep_id_firestore in the clean
      Amplitude event. Grain key for deduplication (latest event per offer).
    lineage:
      - datalake_amplitude_clean.170698_sale_offer_form_accepted_events.ep_id_firestore
  app_type:
    description: |
      Application surface or device type where the offer form was accepted (from up_app_type).
    lineage:
      - datalake_amplitude_clean.170698_sale_offer_form_accepted_events.up_app_type
  utm_source:
    description: |
      UTM source parameter (up_utm_source) for marketing attribution on the sale offer event.
    lineage:
      - datalake_amplitude_clean.170698_sale_offer_form_accepted_events.up_utm_source
  utm_medium:
    description: |
      UTM medium parameter (up_utm_medium) identifying the marketing medium.
    lineage:
      - datalake_amplitude_clean.170698_sale_offer_form_accepted_events.up_utm_medium
  utm_campaign:
    description: |
      UTM campaign parameter (up_utm_campaign). Also used to derive branded and is_branded flags.
    lineage:
      - datalake_amplitude_clean.170698_sale_offer_form_accepted_events.up_utm_campaign
  utm_content:
    description: |
      UTM content parameter (up_utm_content) for creative or ad variant tracking.
    lineage:
      - datalake_amplitude_clean.170698_sale_offer_form_accepted_events.up_utm_content
  utm_term:
    description: |
      UTM term parameter (up_utm_term) for paid search keyword attribution.
    lineage:
      - datalake_amplitude_clean.170698_sale_offer_form_accepted_events.up_utm_term
  entrance_uri:
    description: |
      First-page URI in the user session (up_entrance_uri) when the offer form was accepted.
    lineage:
      - datalake_amplitude_clean.170698_sale_offer_form_accepted_events.up_entrance_uri
  branded:
    description: |
      Branded vs non-branded campaign bucket. Built from up_utm_campaign: Branded when campaign
      contains BRANDED or INSTITUCIONAL (excluding NON-BRANDED); otherwise Outro.
    categories:
      Branded: Campaign classified as branded or institutional per UTM naming rules.
      Outro: Non-branded or unclassified campaign bucket.
    lineage:
      - datalake_amplitude_clean.170698_sale_offer_form_accepted_events.up_utm_campaign
  is_branded:
    description: |
      Boolean flag for branded campaigns. Derived from up_utm_campaign using the same rules as
      branded (BRANDED/INSTITUCIONAL keywords, excluding non-branded variants).
    lineage:
      - datalake_amplitude_clean.170698_sale_offer_form_accepted_events.up_utm_campaign
  ts_event:
    description: |
      Timestamp of the sale offer form acceptance event. UTC timestamp from Amplitude. Latest
      event per id_offer after deduplication.
    lineage:
      - datalake_amplitude_clean.170698_sale_offer_form_accepted_events.ts_event
  year:
    description: |
      Table partition column (year). Derived from the event date at clean ingestion. Required
      in WHERE clauses for partition pruning — always combine with month and day.
    lineage:
      - datalake_amplitude_clean.170698_sale_offer_form_accepted_events.year
  month:
    description: |
      Table partition column (month, 1–12). Must be filtered together with year and day in every
      query to enable partition pruning.
    lineage:
      - datalake_amplitude_clean.170698_sale_offer_form_accepted_events.month
  day:
    description: |
      Table partition column (day, 1–31). Filter with year and month to narrow the scan. Example:
      WHERE year = 2026 AND month = 6 AND day BETWEEN 1 AND 7.
    lineage:
      - datalake_amplitude_clean.170698_sale_offer_form_accepted_events.day
