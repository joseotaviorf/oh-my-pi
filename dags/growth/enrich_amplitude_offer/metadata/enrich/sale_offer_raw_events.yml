database_name: datalake_amplitude_offer
table_name: sale_offer_raw_events
owner: data-growth@quintoandar.com
domain: growth
description: This table consolidates ForSale offer submitted events from Amplitude.
columns:
  id_user:
    lineage:
      - datalake_amplitude_clean_staging.170698_sale_offer_form_accepted_events.id_user
    description: Id of the user who made the offer.
  id_house:
    lineage:
      - datalake_amplitude_clean_staging.170698_sale_offer_form_accepted_events.ep_id_house
    description: Id of the house associated with the offer.
  id_offer:
    lineage:
      - datalake_amplitude_clean_staging.170698_sale_offer_form_accepted_events.ep_id_firestore
    description: Id firestore of the offer.
  app_type:
    lineage:
      - datalake_amplitude_clean_staging.170698_sale_offer_form_accepted_events.up_app_type
    description: App type/device where the event was made.
  utm_source:
    lineage:
      - datalake_amplitude_clean_staging.170698_sale_offer_form_accepted_events.up_utm_source
    description: Returns utm_source parameter defined at campaing configuration at marketing platforms
  utm_medium:
    lineage:
      - datalake_amplitude_clean_staging.170698_sale_offer_form_accepted_events.up_utm_medium
    description: Returns utm_medium parameter defined at campaing configuration at marketing platforms
  utm_campaign:
    lineage:
      - datalake_amplitude_clean_staging.170698_sale_offer_form_accepted_events.up_utm_campaign
    description: Returns utm_campaign parameter defined at campaing configuration at marketing platforms
  utm_content:
    lineage:
      - datalake_amplitude_clean_staging.170698_sale_offer_form_accepted_events.up_utm_content
    description: Returns utm_content parameter defined at campaing configuration at marketing platforms
  utm_term:
    lineage:
      - datalake_amplitude_clean_staging.170698_sale_offer_form_accepted_events.up_utm_term
    description: Returns utm_term parameter defined at campaing configuration at marketing platforms
  entrance_uri:
    lineage:
      - datalake_amplitude_clean_staging.170698_sale_offer_form_accepted_events.up_entrance_uri
    description: The URL of the first page a user visits in a session
  branded:
    lineage:
      - datalake_amplitude_clean_staging.170698_sale_offer_form_accepted_events.up_utm_campaign
    description: Describes if the campaign associated to the event is Brandad or not.
  is_branded:
    lineage:
      - datalake_amplitude_clean_staging.170698_sale_offer_form_accepted_events.up_utm_campaign
    description: Flag to point if the campaign associated to the event is Brandad or not.
  ts_event:
    lineage:
      - datalake_amplitude_clean_staging.170698_sale_offer_form_accepted_events.ts_event
    description: Timestamp of the event
  year:
    lineage:
      - datalake_amplitude_clean_staging.170698_sale_offer_form_accepted_events.year
    description: Year of the execution date that updated that row.
  month:
    lineage:
      - datalake_amplitude_clean_staging.170698_sale_offer_form_accepted_events.month
    description: Month of the execution date that updated that row.
  day:
    lineage:
      - datalake_amplitude_clean_staging.170698_sale_offer_form_accepted_events.day
    description: Day of the execution date that updated that row.