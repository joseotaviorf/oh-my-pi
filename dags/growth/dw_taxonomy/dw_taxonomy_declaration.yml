dag:
  name: dw_taxonomy
  schedule_start_date: 2022,10,1
  owner: Data Growth
  documentation:
    dag_purpose: |
      This DAG dw tables related to the process of taxonomy in Growth context.
workflow:
  type: query_delta
  layer: dw
  custom_schema: growth
cluster:
  type: databricks_12_2_min_general_photon_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
