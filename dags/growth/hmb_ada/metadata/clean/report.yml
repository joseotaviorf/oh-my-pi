---
database_name: datalake_hmb_ada_clean
table_name: report
owner: henrique.paulo@quintoandar.com.br
domain: Growth
description: >
  Contains detailed reporting data for WhatsApp-based outreach interactions conducted via the HMB ADA platform
  by the supply team. Each row captures a single communication event including the agent responsible, campaign
  attribution, interaction type and duration, and up to nine configurable disposition fields. Used by the Growth
  supply team to measure campaign effectiveness, agent performance, and contact quality across WhatsApp outreach.
columns:
  id_contact:
    description: Unique identifier assigned to the individual contact in the HMB ADA platform, enabling deduplication and tracking across multiple WhatsApp interaction events.
    lineage:
      - datalake_hmb_data_raw.uniqueid
  id_other_unique:
    description: Secondary unique identifier used when the same interaction is referenced across multiple systems or when an alternate platform ID exists for the same contact event.
    lineage:
      - datalake_hmb_data_raw.otheruniqueid
  phone_number:
    description: WhatsApp phone number of the client involved in this interaction, used for contact traceability and deduplication in campaign reporting.
    lineage:
      - datalake_hmb_data_raw.number
  id_integrated:
    description: Flag or identifier indicating whether this interaction record has been synchronised with an integrated CRM or downstream system, used for reconciliation monitoring.
    lineage:
      - datalake_hmb_data_raw.integrated
  channel:
    description: Communication channel through which the interaction took place (e.g. WhatsApp, SMS), enabling analysis of outreach performance by channel type.
    lineage:
      - datalake_hmb_data_raw.channel
  type:
    description: Classification of the interaction type (e.g. inbound, outbound, automated message), used to distinguish agent-driven contacts from automated flows in performance analysis.
    lineage:
      - datalake_hmb_data_raw.tipo
  status:
    description: Final status of the interaction at the close of the session (e.g. completed, failed, no-answer), used to measure successful contact rates in outreach campaigns.
    lineage:
      - datalake_hmb_data_raw.status
  total_time:
    description: Total elapsed duration of the interaction session in seconds, used to compute average handle time and agent productivity metrics.
    lineage:
      - datalake_hmb_data_raw.total
  error:
    description: Error code or message recorded when the interaction encountered a technical failure, used to monitor platform reliability and diagnose delivery issues.
    lineage:
      - datalake_hmb_data_raw.error
  campaign:
    description: Name of the outreach campaign under which this interaction was conducted, enabling aggregated performance measurement across supply acquisition campaigns.
    lineage:
      - datalake_hmb_data_raw.campaign
  agent_login:
    description: Login credential (username) of the supply team agent who handled this WhatsApp interaction, used for agent-level performance attribution in reports.
    lineage:
      - datalake_hmb_data_raw.login
  destination_login:
    description: Login of the destination agent or queue to which the interaction was transferred or escalated, used to track hand-off patterns within the supply team.
    lineage:
      - datalake_hmb_data_raw.loginDestino
  model:
    description: Chatbot or scripted conversation model template used to drive the WhatsApp interaction, allowing comparison of model effectiveness across outreach campaigns.
    lineage:
      - datalake_hmb_data_raw.model
  max_response_delay:
    description: Maximum time elapsed (in seconds) between a message sent and the corresponding client or agent reply during the interaction, used to measure responsiveness and service quality.
    lineage:
      - datalake_hmb_data_raw.maxresponsedelay
  replied_message:
    description: Content of the message sent by the client in response to the outreach, capturing the client's reply for qualitative analysis and conversation auditing.
    lineage:
      - datalake_hmb_data_raw.repliedmessage
  last_text:
    description: Final message text exchanged in the interaction session, providing a quick reference to how the conversation concluded.
    lineage:
      - datalake_hmb_data_raw.lasttext
  option_1:
    description: First configurable disposition or outcome field recorded by the agent at the close of the WhatsApp interaction, representing the primary contact result.
    lineage:
      - datalake_hmb_data_raw.option1
  option_2:
    description: Second configurable outcome field providing additional granularity on the interaction result as defined by the active campaign script.
    lineage:
      - datalake_hmb_data_raw.option2
  option_3:
    description: Third configurable outcome field for recording supplementary interaction details as configured per WhatsApp campaign.
    lineage:
      - datalake_hmb_data_raw.option3
  option_4:
    description: Fourth configurable outcome field capturing structured disposition data as set up in the campaign's HMB ADA configuration.
    lineage:
      - datalake_hmb_data_raw.option4
  option_5:
    description: Fifth configurable outcome field for further categorisation of the WhatsApp interaction result.
    lineage:
      - datalake_hmb_data_raw.option5
  option_6:
    description: Sixth configurable outcome field recording additional structured data about the interaction as defined by the campaign operator.
    lineage:
      - datalake_hmb_data_raw.option6
  option_7:
    description: Seventh configurable outcome field for capturing campaign-specific interaction disposition details.
    lineage:
      - datalake_hmb_data_raw.option7
  option_8:
    description: Eighth configurable outcome field for recording additional interaction metadata as required by specific campaigns.
    lineage:
      - datalake_hmb_data_raw.option8
  option_9:
    description: Ninth and final configurable outcome field for capturing the last structured disposition detail in the campaign's interaction script.
    lineage:
      - datalake_hmb_data_raw.option9
  ts_report:
    description: Timestamp marking when this WhatsApp interaction event was recorded in the HMB ADA platform, representing the business moment the communication took place.
    lineage:
      - datalake_hmb_data_raw.dt
  year:
    description: Calendar year of the interaction timestamp, used as a partitioning key for efficient date-range queries.
    lineage:
      - datalake_hmb_data_raw.year
  month:
    description: Calendar month of the interaction timestamp, used together with year and day as a partitioning key for incremental loads.
    lineage:
      - datalake_hmb_data_raw.month
  day:
    description: Calendar day of the interaction timestamp, completing the date partition key for daily incremental loads from the HMB ADA platform.
    lineage:
      - datalake_hmb_data_raw.day
