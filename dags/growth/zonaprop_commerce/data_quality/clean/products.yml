alert_channel: GROWTH_ALERTS
table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Warning
column_level_validations:
  id_product:
    is_complete:
      severity_level: Error
    is_unique:
      severity_level: Error
  id_product_line:
    is_complete:
      severity_level: Error
  is_enabled:
    is_complete:
      severity_level: Error
  is_unlimited_delivery:
    is_complete:
      severity_level: Error
  product_name:
    is_complete:
      severity_level: Error
  validity_days:
    is_complete:
      severity_level: Error
