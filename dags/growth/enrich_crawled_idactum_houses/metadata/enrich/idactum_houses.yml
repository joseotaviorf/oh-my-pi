database_name: datalake_crawled_idactum_houses
table_name: idactum_houses
description: Unified municipal property records aggregated from twenty-seven Idactum Scrapy clean sources across three upstream DAGs (idactum_scrapy_cadastral, idactum_scrapy_itbi, idactum_scrapy_iptu). Each row follows the legacy idactum_houses column contract with crawl provenance via source_spider. People-only and PDF-only spiders remain excluded.
domain: Growth
owner: gabriel.mota@quintoandar.com.br
columns:
  id:
    description: |
      Surrogate primary key placeholder; always null for Scrapy-sourced rows because
      crawlers do not emit Idactum snapshot identifiers.
  id_municipal_house:
