database_name: datalake_crawled_idactum_houses
table_name: idactum_houses
description: |
  Unified municipal property records aggregated from six Idactum Scrapy crawlers
  with house attributes (RJ ITBI, Goiânia cadastral/ITBI payment proof, Osasco
  CDC/ITBI). Each row follows the legacy idactum_houses column contract with crawl
  provenance. People-only and PDF-only spiders are excluded from this aggregation.
domain: Growth
owner: gabriel.mota@quintoandar.com.br
columns:
  id:
    description: |
      Surrogate primary key placeholder; always null for Scrapy-sourced rows because
      crawlers do not emit Idactum snapshot identifiers.
  id_municipal_house:
    lineage:
      - datalake_crawled_idactum_houses_clean.rj_itbi_main.id_municipal_house
      - datalake_crawled_idactum_houses_clean.go_goiania_informacoes_cadastrais.id_municipal_house
      - datalake_crawled_idactum_houses_clean.go_goiania_cadastro_imobiliario.id_municipal_house
      - datalake_crawled_idactum_houses_clean.go_goiania_comprovacao_pagamento.id_municipal_house
      - datalake_crawled_idactum_houses_clean.sp_osasco_itbi.id_municipal_house
      - datalake_crawled_idactum_houses_clean.sp_osasco_pesquisa_cdc.id_municipal_house
    description: |
      Municipal cadastral identifier when the source spider exposes a registration
      number (e.g. inscrição imobiliária or CDC); null for spiders not yet flattened.
  id_idactum:
    description: |
      Idactum proprietary identifier; not available from municipal Scrapy crawlers and
      kept null until cross-walk with the historical idactum_houses snapshot is added.
  id_patrimonial_assets:
    description: |
      Idactum iPatri asset key; not populated by municipal Scrapy crawlers in this release.
  state:
    lineage:
      - datalake_crawled_idactum_houses_clean.rj_itbi_main.state
      - datalake_crawled_idactum_houses_clean.go_goiania_informacoes_cadastrais.state
      - datalake_crawled_idactum_houses_clean.sp_osasco_itbi.state
    description: |
      Brazilian state abbreviation inferred from the source spider geography (RJ, GO, SP).
  city:
    lineage:
      - datalake_crawled_idactum_houses_clean.rj_itbi_main.city
      - datalake_crawled_idactum_houses_clean.go_goiania_informacoes_cadastrais.city
      - datalake_crawled_idactum_houses_clean.sp_osasco_itbi.city
    description: |
      Municipality name inferred from the source spider geography (e.g. Rio de Janeiro,
      Goiânia, Osasco).
  neighborhood:
    lineage:
      - datalake_crawled_idactum_houses_clean.rj_itbi_main.neighborhood
      - datalake_crawled_idactum_houses_clean.go_goiania_informacoes_cadastrais.neighborhood
      - datalake_crawled_idactum_houses_clean.go_goiania_cadastro_imobiliario.neighborhood_id
      - datalake_crawled_idactum_houses_clean.go_goiania_comprovacao_pagamento.neighborhood
    description: |
      Neighborhood name or identifier when exposed by the flattened source spider; otherwise null.
  street:
    lineage:
      - datalake_crawled_idactum_houses_clean.rj_itbi_main.street
      - datalake_crawled_idactum_houses_clean.go_goiania_informacoes_cadastrais.street
    description: |
      Street name when parsed from the municipal payload; null when only a full address
      blob is available in address_details.
  address_number:
    lineage:
      - datalake_crawled_idactum_houses_clean.rj_itbi_main.address_number
      - datalake_crawled_idactum_houses_clean.go_goiania_informacoes_cadastrais.address_number
    description: |
      Street number when parsed from the municipal payload; null when not provided by the spider.
  zipcode:
    description: |
      Brazilian postal code (CEP) when present in the scraped payload; null otherwise.
  address_details:
    lineage:
      - datalake_crawled_idactum_houses_clean.rj_itbi_main.address_details
      - datalake_crawled_idactum_houses_clean.go_goiania_informacoes_cadastrais.address_details
      - datalake_crawled_idactum_houses_clean.go_goiania_comprovacao_pagamento.address_details
      - datalake_crawled_idactum_houses_clean.sp_osasco_pesquisa_cdc.address_details
    description: |
      Address complement or full address string from flattened spiders; JSON-serialized
      nested payload (TO_JSON) only for spiders not yet flattened in Phase B.
  address_details_unit:
    description: |
      Apartment or unit number when parsed from the municipal payload; null otherwise.
  address_details_building:
    description: |
      Building block identifier when parsed from the municipal payload; null otherwise.
  real_estate_register:
    lineage:
      - datalake_crawled_idactum_houses_clean.sp_osasco_itbi.real_estate_register
    description: |
      Notary office (cartório) name when present in the scraped payload; null otherwise.
  real_estate_registry:
    lineage:
      - datalake_crawled_idactum_houses_clean.sp_osasco_pesquisa_cdc.real_estate_registry
    description: |
      Property registry number (matrícula) when present in the scraped payload; null otherwise.
  building_year:
    description: |
      Construction year when present in the scraped payload; null otherwise.
  lot_area:
    lineage:
      - datalake_crawled_idactum_houses_clean.go_goiania_informacoes_cadastrais.lot_area
    description: |
      Land area in square meters when present in the scraped payload; null otherwise.
  building_area:
    lineage:
      - datalake_crawled_idactum_houses_clean.go_goiania_informacoes_cadastrais.building_area
    description: |
      Built area in square meters when present in the scraped payload; null otherwise.
  private_area:
    lineage:
      - datalake_crawled_idactum_houses_clean.go_goiania_informacoes_cadastrais.private_area
    description: |
      Private area in square meters when present in the scraped payload; null otherwise.
  idactum_price_estimation:
    description: |
      Idactum market value estimate; not populated by municipal Scrapy crawlers in this release.
  idactum_price_estimation_quality:
    description: |
      Confidence score for Idactum price estimates; not populated by municipal crawlers.
  avg_annual_appreciation_idactum_estimation:
    description: |
      Average annual appreciation estimate; not populated by municipal Scrapy crawlers.
  estimated_annual_revenue:
    description: |
      Estimated annual transaction volume; not populated by municipal Scrapy crawlers.
  condominium_estimation:
    description: |
      Estimated monthly condominium fee; not populated by municipal Scrapy crawlers.
  assessed_iptu_value:
    lineage:
      - datalake_crawled_idactum_houses_clean.go_goiania_informacoes_cadastrais.assessed_iptu_value
      - datalake_crawled_idactum_houses_clean.sp_osasco_itbi.assessed_iptu_value
    description: |
      Government-assessed IPTU fiscal value when present in the scraped payload; null otherwise.
  assessed_itbi_value:
    lineage:
      - datalake_crawled_idactum_houses_clean.rj_itbi_main.assessed_itbi_value
      - datalake_crawled_idactum_houses_clean.sp_osasco_itbi.assessed_itbi_value
    description: |
      Declared or assessed ITBI transaction value when the source spider exposes it;
      null for spiders without ITBI fiscal data.
  latitude:
    lineage:
      - datalake_crawled_idactum_houses_clean.go_goiania_informacoes_cadastrais.latitude
    description: |
      SIRGAS easting coordinate (x_coord) from Goiânia cadastral records; not WGS84 latitude.
  longitude:
    lineage:
      - datalake_crawled_idactum_houses_clean.go_goiania_informacoes_cadastrais.longitude
    description: |
      SIRGAS northing coordinate (y_coord) from Goiânia cadastral records; not WGS84 longitude.
  kind:
    lineage:
      - datalake_crawled_idactum_houses_clean.go_goiania_informacoes_cadastrais.kind
    description: |
      Physical property type when present in the scraped payload; null otherwise.
  usage_purpose:
    lineage:
      - datalake_crawled_idactum_houses_clean.go_goiania_informacoes_cadastrais.usage_purpose
    description: |
      Intended use category when present in the scraped payload; null otherwise.
  usage_type:
    lineage:
      - datalake_crawled_idactum_houses_clean.go_goiania_informacoes_cadastrais.usage_type
    description: |
      Occupancy classification when present in the scraped payload; null otherwise.
  is_iptu_exempt:
    description: |
      IPTU exemption flag when present in the scraped payload; null otherwise.
  is_active:
    lineage:
      - datalake_crawled_idactum_houses_clean.sp_osasco_pesquisa_cdc.is_active
    description: |
      Active flag (1.0/0.0) from Osasco CDC situacao; null for other spiders.
  dt_load:
    lineage:
      - datalake_crawled_idactum_houses_clean.rj_itbi_main.dt_load
    description: |
      Date when the upstream per-spider clean row was loaded into the datalake.
  source_spider:
    description: |
      Scrapy spider slug identifying which per-spider clean table produced the row
      (e.g. rj_itbi_main, sp_osasco_pesquisa_cdc).
  feed_source:
    lineage:
      - datalake_crawled_idactum_houses_clean.rj_itbi_main.feed_source
    description: |
      Spider source tag embedded in the crawl metadata payload.
  feed_url:
    lineage:
      - datalake_crawled_idactum_houses_clean.rj_itbi_main.feed_url
    description: |
      Source URL consulted by the crawler when producing the upstream record.
  ts_accessed:
    lineage:
      - datalake_crawled_idactum_houses_clean.rj_itbi_main.ts_accessed
    description: |
      Timestamp when the crawler accessed the municipal portal page or API.
  referer_url:
    lineage:
      - datalake_crawled_idactum_houses_clean.rj_itbi_main.referer_url
    description: |
      HTTP referer URL captured during the crawl session, when available.
  crawler_name:
    lineage:
      - datalake_crawled_idactum_houses_clean.rj_itbi_main.crawler_name
    description: |
      Scrapy spider name stamped on the upstream clean record by the raw ingestion job.
  year:
    lineage:
      - datalake_crawled_idactum_houses_clean.rj_itbi_main.year
    description: |
      Partition year derived from the DAG execution date of the Scrapy feed load.
  month:
    lineage:
      - datalake_crawled_idactum_houses_clean.rj_itbi_main.month
    description: |
      Partition month derived from the DAG execution date of the Scrapy feed load.
  day:
    lineage:
      - datalake_crawled_idactum_houses_clean.rj_itbi_main.day
    description: |
      Partition day derived from the DAG execution date of the Scrapy feed load.
