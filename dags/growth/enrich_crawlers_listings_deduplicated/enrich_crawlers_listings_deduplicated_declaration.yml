dag:
  name: enrich_crawlers_listings_deduplicated
  owner: MLOps
  schedule_interval: 0 8 * * 7
  schedule_start_date: 2024, 1, 1
  documentation:
    dag_purpose: Computes the listings of Loft, Zapimoveis, VivaReal and EmCasa crawlers without deduplication.
workflow:
  type: query_delta
  layer: enrich
  default_extraction_type: full
cluster:
  type: databricks_12_2_med_general_photon_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
