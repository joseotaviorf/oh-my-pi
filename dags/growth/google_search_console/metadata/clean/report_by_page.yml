---
database_name: datalake_google_search_console_clean
table_name: report_by_page
owner: henrique.paulo@quintoandar.com.br
domain: Growth
description: |
  Daily cleaned Google Search Console performance at page grain for QuintoAndar web properties.
  Includes clicks, impressions, CTR, and average position per landing page URL, device, and country.
columns:
  site_url:
    description: Main URL that are being queried.
    lineage:
      - datalake_google_search_console_raw.report_by_page.site_url
  type:
    description: GSC search appearance type for the extracted report dimension (e.g. web, discover, googleNews).
    lineage:
      - datalake_google_search_console_raw.report_by_page.type
  page:
    description: Full page address.
    lineage:
      - datalake_google_search_console_raw.report_by_page.keys
  country:
    description: country where the search was made.
    lineage:
      - datalake_google_search_console_raw.report_by_page.keys
  device:
    description: device type where the search was made.
    categories:
      DESKTOP: desktop
      MOBILE: mobile
    lineage:
      - datalake_google_search_console_raw.report_by_page.keys
  clicks:
    description: Times it was clicked on SERP page organically
    lineage:
      - datalake_google_search_console_raw.report_by_page.clicks
  impressions:
    description: Times it was showed on SERP page
    lineage:
      - datalake_google_search_console_raw.report_by_page.impressions
  ctr:
    description: Click Through Rate - times it was clicked over times it was showed
    lineage:
      - datalake_google_search_console_raw.report_by_page.ctr
  position:
    description: Relative ranking of the position of the link on Google.
    lineage:
      - datalake_google_search_console_raw.report_by_page.position
  posimp:
    description: Position multiplied by the impressions.
    lineage:
      - datalake_google_search_console_raw.report_by_page.position
      - datalake_google_search_console_raw.report_by_page.impressions
  dt_created:
    description: Extraction date.
    lineage:
      - datalake_google_search_console_raw.report_by_page.date
  year:
    description: Calendar year of the GSC extraction date; Hive partition for daily Search Console report loads.
    lineage:
      - datalake_google_search_console_raw.report_by_page.date
  month:
    description: Calendar month of the GSC extraction date; Hive partition alongside year and day.
    lineage:
      - datalake_google_search_console_raw.report_by_page.date
  day:
    description: Calendar day of the GSC extraction date; Hive partition alongside year and month.
    lineage:
      - datalake_google_search_console_raw.report_by_page.date
