---
database_name: datalake_google_search_console_clean
table_name: report_by_discover
owner: data.growth@quintoandar.com.br
domain: Growth
description: This table contains the clean informations about the Google Search Console tool in the page granularity.
columns:
  site_url:
    description: Main URL that are being queried.
    lineage:
      - datalake_google_search_console_raw.report_by_discover.site_url
  type:
    description: Extraction type.
    lineage:
      - datalake_google_search_console_raw.report_by_discover.type
  page:
    description: Full page address.
    lineage:
      - datalake_google_search_console_raw.report_by_discover.keys
  country:
    description: country where the search was made.
    lineage:
      - datalake_google_search_console_raw.report_by_discover.keys
  clicks:
    description: Times it was clicked on SERP page organically
    lineage:
      - datalake_google_search_console_raw.report_by_discover.clicks
  impressions:
    description: Times it was showed on SERP page
    lineage:
      - datalake_google_search_console_raw.report_by_discover.impressions
  ctr:
    description: Click Through Rate - times it was clicked over times it was showed
    lineage:
      - datalake_google_search_console_raw.report_by_discover.ctr
  position:
    description: Relative ranking of the position of the link on Google.
    lineage:
      - datalake_google_search_console_raw.report_by_discover.position
  posimp:
    description: Position multiplied by the impressions.
    lineage:
      - datalake_google_search_console_raw.report_by_discover.position
      - datalake_google_search_console_raw.report_by_discover.impressions
  dt_created:
    description: Extraction date.
    lineage:
      - datalake_google_search_console_raw.report_by_discover.date
  year:
    description: Extraction year.
    lineage:
      - datalake_google_search_console_raw.report_by_discover.date
  month:
    description: Extraction month.
    lineage:
      - datalake_google_search_console_raw.report_by_discover.date
  day:
    description: Extraction day.
    lineage:
      - datalake_google_search_console_raw.report_by_discover.date