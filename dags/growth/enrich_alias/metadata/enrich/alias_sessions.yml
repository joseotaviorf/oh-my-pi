database_name: datalake_alias
table_name: alias_sessions
domain: Growth
owner: vitor.musachio@quintoandar.com.br
description: |
  One row per Alias AI agent session (QuintoAndar's WhatsApp B2B bot), aggregating all
  conversational funnel metrics, LLM cost and latency, and the broker's uuid_company
  from datalake_langfuse_clean.traces and observations.

  Grain: one row per id_langfuse_session. Scope is restricted to Alias sessions via
  INNER JOIN datalake_chatbot.sessions (bot = 'alias'), the same filter used in
  dw_alias.fact_alias_agent_calls. Incremental on traces.ts_created with merge_on on
  id_langfuse_session to handle long sessions that span load windows. The 1-day lookback
  in the read window covers sessions that cross midnight.

  Observations are pre-filtered to type IN ('GENERATION', 'AGENT', 'TOOL') before joining
  with traces, reducing bytes read and ensuring cost and latency metrics reflect only LLM
  and tool calls. Partition filtering on observations is applied via
  MAKE_TIMESTAMP(year, month, day, hour), enabling real Parquet partition pruning.

  Primary consumers: dw_alias.fact_alias_sessions and dw_alias.fact_alias_agent_calls,
  which use this enrich to avoid repeated full table scans on observations (high-volume
  table). Each dw_alias run reads one pre-aggregated row per session instead of scanning
  observations and traces directly.

  Physical layout: partitioned by [year, month, day] based on ts_first_turn (date of the
  first user turn in the session). Z-ordered by id_langfuse_session to enable data skipping
  on point lookups. For efficient queries, filter by date partition and join on
  id_langfuse_session.
columns:
  id_langfuse_session:
    description: >
      Unique session identifier in Langfuse (id_session in traces). PK of this table.
      FK to dw_alias.fact_alias_sessions.id_langfuse_session and
      dw_alias.fact_alias_agent_calls.id_langfuse_session.
    lineage:
      - datalake_langfuse_clean.traces.id_session
      - datalake_chatbot.sessions.id_langfuse_session
  uuid_company:
    description: >
      UUID of the broker company extracted from the JSON output of the first
      get_alias_configuration TOOL call in the session (obs_name = 'get_alias_configuration',
      obs_type = 'TOOL'), selected via MIN_BY ordered by ts_started. Used to assign
      sk_broker in dw_alias facts. NULL when the session did not go through the broker
      configuration step.
    lineage:
      - datalake_langfuse_clean.observations.output
      - datalake_langfuse_clean.observations.name
      - datalake_langfuse_clean.observations.type
  bot_version:
    description: >
      Most recent Alias agent version recorded in the session's traces (version field of
      the trace). Allows tracking behavioral changes across agent releases.
    lineage:
      - datalake_langfuse_clean.traces.version
  funnel_stage_deepest:
    description: >
      Deepest conversational funnel stage reached in the session, derived from the
      sub-agents called. Priority order (deepest first):
      visit_intention_registered (visit tool returned success) → escalated →
      visit_attempt_failed (visit tool called but unsuccessful) →
      schedule_visit_agent_called → inventory_searched → profile_identified → no_agent.
      Uses visit_registered_success (confirmed success) rather than has_visit_registered
      (tool merely called) as the top priority criterion — avoids classifying failed visit
      attempts as conversions. Allows segmenting sessions by conversation maturity without
      joining multiple boolean flags.
    lineage:
      - datalake_langfuse_clean.observations.name
      - datalake_langfuse_clean.observations.output
  n_user_turns:
    description: >
      Number of user turns in the session, counted as the total distinct traces (id_trace)
      linked to the id_langfuse_session. Each trace represents a user message processed
      by the agent.
    lineage:
      - datalake_langfuse_clean.traces.id_trace
  n_tool_call_errors:
    description: >
      Number of tool calls (obs_type = TOOL) whose output contains the string "error"
      (case-insensitive). Covers CRM integration errors, timeouts, and tool failures.
      Useful for diagnosing the agent's operational quality.
    lineage:
      - datalake_langfuse_clean.observations.output
      - datalake_langfuse_clean.observations.type
  n_calls_get_recommendations:
    description: >
      Total number of calls to the alias_get_recommendations_by_company tool in the
      session. Values > 1 indicate the lead refined their search or the agent made
      multiple recommendation attempts.
    lineage:
      - datalake_langfuse_clean.observations.name
  n_calls_get_availability:
    description: >
      Total number of calls to the alias_visit_get_availability tool in the session.
      Multiple calls may indicate the lead was searching for alternative visit time slots.
    lineage:
      - datalake_langfuse_clean.observations.name
  n_calls_get_property:
    description: >
      Total number of calls to the alias_get_property_by_external_id tool in the session.
      Indicates how many times the agent looked up a specific property by external ID.
    lineage:
      - datalake_langfuse_clean.observations.name
  n_calls_register_visit:
    description: >
      Total number of calls to the alias_register_visit_intention tool in the session.
      Values > 1 may indicate retries after failure or multiple properties of interest.
    lineage:
      - datalake_langfuse_clean.observations.name
  n_calls_register_escalation:
    description: >
      Total number of calls to the alias_register_escalation tool in the session.
      Typically 0 or 1; values > 1 indicate escalation retries.
    lineage:
      - datalake_langfuse_clean.observations.name
  total_llm_cost_usd:
    description: >
      Total LLM cost incurred in the session in US dollars, calculated as the sum of
      cost_details.total for observations of type GENERATION, AGENT, or TOOL. Observations
      of other types (e.g. EVENT) are excluded, consistent with the query scan filter.
      NULL when no eligible observation has cost_details populated.
    lineage:
      - datalake_langfuse_clean.observations.cost_details
      - datalake_langfuse_clean.observations.type
  p50_llm_response_time_ms:
    description: >
      Median (P50) LLM response latency per observation in the session, in milliseconds.
      Computed as percentile_approx(duration_ms, 0.5) over observations of type
      GENERATION, AGENT, or TOOL with ts_started and ts_ended populated.
    lineage:
      - datalake_langfuse_clean.observations.ts_started
      - datalake_langfuse_clean.observations.ts_ended
      - datalake_langfuse_clean.observations.type
  p95_llm_response_time_ms:
    description: >
      95th-percentile LLM response latency per observation in the session, in milliseconds.
      Computed over observations of type GENERATION, AGENT, or TOOL. Reflects tail
      behavior — high P95 signals latency spikes that degrade the conversational experience.
    lineage:
      - datalake_langfuse_clean.observations.ts_started
      - datalake_langfuse_clean.observations.ts_ended
      - datalake_langfuse_clean.observations.type
  avg_llm_response_time_ms:
    description: >
      Average LLM response latency per observation in the session, in milliseconds.
      Computed over observations of type GENERATION, AGENT, or TOOL. Complements P50
      and P95 for mean latency cost analysis per session.
    lineage:
      - datalake_langfuse_clean.observations.ts_started
      - datalake_langfuse_clean.observations.ts_ended
      - datalake_langfuse_clean.observations.type
  has_profiling:
    description: >
      TRUE if the alias_profile_agentV1 sub-agent was called at least once in the session.
      Indicates the agent attempted to identify the lead's profile (purchase intent, rental,
      price range, location).
    lineage:
      - datalake_langfuse_clean.observations.name
  has_inventory:
    description: >
      TRUE if the alias_inventory_agentV1 sub-agent was called in the session. Indicates
      the agent searched the broker's property portfolio for the lead.
    lineage:
      - datalake_langfuse_clean.observations.name
  has_recommendations:
    description: >
      TRUE if the alias_get_recommendations_by_company tool was called in the session.
      Indicates the agent listed recommended properties for the lead based on their profile.
    lineage:
      - datalake_langfuse_clean.observations.name
  has_actual_recommendations:
    description: >
      TRUE if alias_get_recommendations_by_company returned a non-empty listings array.
      Handles two response shapes: flat ({"listings":[{...}]}) and nested
      ({"hlsresult":{"listings":[{...}]}}). Distinct from has_recommendations, which only
      indicates the tool was called regardless of the result.
    lineage:
      - datalake_langfuse_clean.observations.name
      - datalake_langfuse_clean.observations.output
      - datalake_langfuse_clean.observations.type
  has_scheduling:
    description: >
      TRUE if the alias_schedule_visit_agentV1 sub-agent was called in the session.
      Indicates the agent attempted to schedule a property visit for the lead.
    lineage:
      - datalake_langfuse_clean.observations.name
  has_availability:
    description: >
      TRUE if the alias_visit_get_availability tool was called in the session. Indicates
      the agent queried the property's calendar availability for visit scheduling.
    lineage:
      - datalake_langfuse_clean.observations.name
  has_visit_registered:
    description: >
      TRUE if the alias_register_visit_intention tool was called in the session. Indicates
      the agent attempted to register the lead's visit intention in the broker's CRM.
    lineage:
      - datalake_langfuse_clean.observations.name
  has_escalation:
    description: >
      TRUE if the alias_escalation_agentV1 sub-agent was called in the session. Indicates
      the agent determined the case should be escalated to human support.
    lineage:
      - datalake_langfuse_clean.observations.name
  visit_registered_success:
    description: >
      TRUE if the alias_register_visit_intention output contains "registered successfully",
      indicating the visit intention was successfully registered in the broker's CRM.
      Distinguishes successful attempts from calls that failed due to integration errors.
    lineage:
      - datalake_langfuse_clean.observations.output
  escalation_registered_success:
    description: >
      TRUE if the alias_register_escalation output contains "escalation registered
      successfully", indicating the human escalation was successfully created in the
      downstream system.
    lineage:
      - datalake_langfuse_clean.observations.output
  ts_first_turn:
    description: >
      Timestamp of the first user turn in the session (MIN of traces.ts_created). Marks
      the effective start of the conversation. Used as the basis for the year/month/day
      partition columns.
    lineage:
      - datalake_langfuse_clean.traces.ts_created
  ts_last_turn:
    description: >
      Timestamp of the last user turn in the session (MAX of traces.ts_created). Combined
      with ts_first_turn allows computing session duration.
    lineage:
      - datalake_langfuse_clean.traces.ts_created
  ts_profiling:
    description: >
      Timestamp of the first call to the alias_profile_agentV1 sub-agent in the session.
      NULL when has_profiling = FALSE.
    lineage:
      - datalake_langfuse_clean.observations.ts_started
  ts_inventory:
    description: >
      Timestamp of the first call to the alias_inventory_agentV1 sub-agent in the session.
      NULL when has_inventory = FALSE.
    lineage:
      - datalake_langfuse_clean.observations.ts_started
  ts_scheduling:
    description: >
      Timestamp of the first call to the alias_schedule_visit_agentV1 sub-agent in the
      session. NULL when has_scheduling = FALSE.
    lineage:
      - datalake_langfuse_clean.observations.ts_started
  ts_availability:
    description: >
      Timestamp of the first call to the alias_visit_get_availability tool in the session.
      NULL when has_availability = FALSE.
    lineage:
      - datalake_langfuse_clean.observations.ts_started
  ts_visit_registered:
    description: >
      Timestamp of the first call to the alias_register_visit_intention tool in the
      session. NULL when has_visit_registered = FALSE.
    lineage:
      - datalake_langfuse_clean.observations.ts_started
  ts_escalation:
    description: >
      Timestamp of the first call to the alias_escalation_agentV1 sub-agent in the
      session. NULL when has_escalation = FALSE.
    lineage:
      - datalake_langfuse_clean.observations.ts_started
  ts_load:
    description: Pipeline load timestamp. Generated via CURRENT_TIMESTAMP() at Spark job execution time.
    lineage: []
  year:
    description: Year of the first session turn (YEAR(ts_first_turn)). Partition column — always include year/month/day filters to enable partition pruning.
    lineage:
      - datalake_langfuse_clean.traces.ts_created
  month:
    description: Month of the first session turn (MONTH(ts_first_turn)). Partition column — use together with year and day for efficient date-range scans.
    lineage:
      - datalake_langfuse_clean.traces.ts_created
  day:
    description: Day of the first session turn (DAY(ts_first_turn)). Partition column — Z-order on id_langfuse_session complements date pruning for point lookups.
    lineage:
      - datalake_langfuse_clean.traces.ts_created
