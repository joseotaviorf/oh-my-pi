database_name: datalake_gsheets_clean
table_name: criteo_costs  
owner: henrique.paulo@quintoandar.com.br
domain: Growth
description: Table load Criteo Costs Report by region from gsheets sent by Criteo team.
columns:
  id_advertiser:
    description: Advertiser id of the campaign
    lineage:
      - datalake_gsheets_raw.criteo_costs.advertiser_id
  id_ad_set:
    description: Unique identifier of the ad_set. 
    lineage:
      - datalake_gsheets_raw.criteo_costs.ad_set_id
  id_campaign:
    description: Unique identifier of the campaign
    lineage:
      - datalake_gsheets_raw.criteo_costs.campaign_id
  advertiser_name:
    description: Display name of the Criteo advertiser account that owns the campaign spend.
    lineage:
      - datalake_gsheets_raw.criteo_costs.advertiser
  ad_set:
    description: Display name of the ad set within the Criteo campaign.
    lineage:
      - datalake_gsheets_raw.criteo_costs.ad_set
  campaign_name:
    description: Display name of the Criteo campaign reported in the regional cost extract.
    lineage:
      - datalake_gsheets_raw.criteo_costs.campaign
  region:
    description: Geographic region targeted by the Criteo campaign ad set on the report date.
    lineage:
      - datalake_gsheets_raw.criteo_costs.region
  zip_code:
    description: Brazilian postal code of the geographic region targeted by the campaign.
    lineage:
      - datalake_gsheets_raw.criteo_costs.zip_code
  cost:
    description: Total cost of the campaign
    lineage:
      - datalake_gsheets_raw.criteo_costs.cost
  clicks:
    description: Total clicks of the campaign
    lineage:
      - datalake_gsheets_raw.criteo_costs.clicks
  displays:
    description: Total displays of the campaign
    lineage:
      - datalake_gsheets_raw.criteo_costs.displays
  dt_report:
    description: Date of the results of campaign
    lineage:
      - datalake_gsheets_raw.criteo_costs.day
  ts_load:
    description: Timestamp when the Criteo regional cost row was ingested into the data lake.
    lineage:
      - datalake_gsheets_raw.criteo_costs.ts_load