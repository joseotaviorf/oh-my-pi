dag:
  name: amplitude_new
  owner: Data Growth
  schedule_interval: 0 0 * * *
  documentation:
    dag_purpose: |
      This DAG ingests data from Amplitude
workflow:
  type: custom_ingestion
  layer: raw
  load_spark_job: load_amplitude_new_raw
  custom_schema: amplitude_events
  execution_timeout_hours: 3
  spark_job_arguments:
    - "{environment}"
    - "{bucket}"
    - "{dag_name}"
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, -1), 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  tables_customization:
    events:
      extraction_type: incremental
      partitions: ["id_app", "event_type", "year", "month", "day"]
      extra_spark_job_arguments:
        - "{{ data_interval_start | ds }}"
      run_optimize: false
      run_vacuum: false
      has_hive_sync: false
