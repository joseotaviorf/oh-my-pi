dag:
  name: amplitude_new
  owner: Data Growth
  criticality: High
  schedule_interval: 0 0 * * *
  documentation:
    dag_purpose: |
      This DAG ingests data from Amplitude
workflow:
  type: custom_ingestion
  layer: raw
  load_spark_job: load_amplitude_new_raw
  custom_schema: amplitude_events
  execution_timeout_hours: 2
  spark_job_arguments:
    - "{environment}"
    - "{bucket}"
    - "{dag_name}"
  extra_query_template_params:
    # Single-day window: raw Delta writes one calendar day per run. Multi-day
    # repair/backfill via conf override (load_start_date / load_end_date).
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  tables_customization:
    events:
      extraction_type: incremental
      partitions: ["id_app", "event_type", "year", "month", "day"]
      extra_spark_job_arguments:
        - "{{ data_interval_start | ds }}"
      run_optimize: false
      run_vacuum: false
      has_hive_sync: false
      # Applied on clean load via ALTER TABLE; default commit interval is 10.
      # These must stay in sync with what was applied by hand on the table, or each load
      # reverts them. Consumers (dags/growth/amplitude_subpartitioned, 367 loads) replay
      # this table's Delta checkpoint on every run, so checkpoint size and log growth are
      # the dominant cost — not the data.
      table_properties:
        # Log cleanup ON with short retention. The earlier "false + 999999 days" let the
        # _delta_log grow to 6.1 TiB / 195k objects across 125 checkpoint generations; the
        # default in-band cleanup then could not delete that backlog inside the 2h EMR
        # timeout (serial driver deletes) and hung the DAG. Backlog was purged out of band
        # (201k -> 17k objects) via a forced checkpoint; with the log small, incremental
        # cleanup on each checkpoint is cheap. 2 days trades time travel beyond 2 days for a
        # bounded log — acceptable: consumers read the current snapshot, not history.
        delta.enableExpiredLogCleanup: "true"
        delta.logRetentionDuration: "interval 2 days"
        delta.deletedFileRetentionDuration: "interval 2 days"
        # Drop the redundant JSON stats copy from checkpoints. Measured at ~47.5% of
        # checkpoint bytes; the parsed struct is kept, so EMR Spark 3.5, Databricks 16.4
        # and Trino 457 (all read the struct) lose nothing. Cut checkpoint 54.6 -> 8.5 GB.
        delta.checkpoint.writeStatsAsJson: "false"
        # Index stats only for columns skipping can use. The default indexes the first 32
        # columns, including the huge data / event_properties JSON blobs. Combined with the
        # line above this shrank the checkpoint ~6.4x. Consumers filter only on partition
        # columns, so file min/max stats are dead weight for them.
        delta.dataSkippingStatsColumns: "id_event,ts_event"
        delta.checkpointInterval: "50"
