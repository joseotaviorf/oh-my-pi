cluster:
  type: emr_7_12_consolidation_xl_memory_fleet_cluster
  custom_configurations:
    aws_attributes:
      ebs_volume_size: 500
    spark_conf:
      spark.driver.maxResultSize: '0'
      spark.databricks.delta.optimizeWrite.enabled: 'true'
    core_nodes:
      target_on_demand: 2
      target_spot: 0
      instance_types:
      - r6gd.8xlarge
    task_nodes:
      instance_types:
      - r6gd.8xlarge
      target_on_demand: 4
      target_spot: 0
