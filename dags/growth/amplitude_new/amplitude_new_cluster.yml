cluster:
  type: consolidation_xl_memory_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    aws_attributes:
      availability: ON_DEMAND
      ebs_volume_size: 500
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
      spark.driver.maxResultSize: '0'
      spark.databricks.delta.optimizeWrite.enabled: 'true'
    driver_node_type_id: r7g.xlarge
    # NVMe local SSD (proven on amplitude_optimization twin) — clean shuffle was EBS-bound.
    node_type_id: r7gd.8xlarge
    num_workers: 6
