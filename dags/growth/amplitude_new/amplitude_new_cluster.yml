cluster:
  type: emr_7_12_consolidation_xl_memory_fleet_cluster
  custom_configurations:
    master_node_type_id: r6g.2xlarge
    core_nodes:
      target_on_demand: 2
      target_spot: 0
      instance_types:
        - r6gd.8xlarge
    task_nodes:
      instance_types:
        - r6gd.8xlarge
      target_on_demand: 4
      target_spot: 0
    aws_attributes:
      ebs_volume_size: 500
    spark_conf:
      spark.driver.maxResultSize: "0"
      spark.databricks.delta.optimizeWrite.enabled: "true"
      spark.driver.memory: "20g"
      spark.driver.memoryOverhead: "4g"
      # Pack 2 executors × 4 cores per r6gd.8xlarge (32 vCPU / 256 GiB). j-09208432
      # could not scale past one 128g/8c executor per node; j-0885277283GXQAEQV84H
      # spilled ~3.3–3.4 GiB/task on shuffle/sort — keep 96g (not 64g) for headroom.
      spark.executor.memory: "96g"
      spark.executor.memoryOverhead: "8g"
      spark.executor.cores: "4"
      spark.dynamicAllocation.maxExecutors: "12"
      spark.sql.shuffle.partitions: "400"
      spark.sql.adaptive.advisoryPartitionSizeInBytes: "512MB"
      # Parallelize classic checkpoints (single-file default hung stage 93 on j-09208432).
      # Checkpoint frequency is delta.checkpointInterval on the table (declaration).
      spark.databricks.delta.checkpoint.partSize: "20000"
