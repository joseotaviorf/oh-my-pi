cluster:
  type: emr_7_12_consolidation_xl_memory_fleet_cluster
  custom_configurations:
    master_node_type_id: r6g.2xlarge
    core_nodes:
      target_on_demand: 2
      target_spot: 0
      instance_types:
        - r6gd.8xlarge
    task_nodes:
      instance_types:
        - r6gd.8xlarge
      target_on_demand: 10
      target_spot: 0
    aws_attributes:
      ebs_volume_size: 500
    spark_conf:
      spark.driver.maxResultSize: "0"
      spark.databricks.delta.optimizeWrite.enabled: "true"
      spark.driver.memory: "20g"
      spark.driver.memoryOverhead: "4g"
      # 12 workers × ~2 × 4c/96g executors. Smaller shuffle chunks (2400 partitions,
      # REPARTITION hint aligned) + more heap per task vs 8c to cut clean/events spill.
      spark.executor.memory: "96g"
      spark.executor.memoryOverhead: "8g"
      spark.executor.cores: "4"
      spark.sql.shuffle.partitions: "2400"
      spark.sql.adaptive.advisoryPartitionSizeInBytes: "128MB"
      spark.databricks.delta.checkpoint.partSize: "10000"
validation:
  cluster:
    type: emr_7_12_consolidation_xl_memory_fleet_cluster
    custom_configurations:
      core_nodes:
        target_on_demand: 2
        target_spot: 0
        instance_types:
          - r6gd.8xlarge
      task_nodes:
        instance_types:
          - r6gd.8xlarge
        target_on_demand: 4
        target_spot: 0
      aws_attributes:
        ebs_volume_size: 500
      spark_conf:
        spark.driver.maxResultSize: "0"
        spark.driver.memory: "20g"
        spark.driver.memoryOverhead: "4g"
        spark.executor.memory: "96g"
        spark.executor.memoryOverhead: "8g"
        spark.executor.cores: "4"
        spark.sql.shuffle.partitions: "2400"
        spark.sql.adaptive.advisoryPartitionSizeInBytes: "128MB"
        spark.databricks.delta.checkpoint.partSize: "10000"
  allow_custom_spark_job: true
