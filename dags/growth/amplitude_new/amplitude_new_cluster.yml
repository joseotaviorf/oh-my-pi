cluster:
  type: emr_7_12_consolidation_xl_memory_fleet_cluster
  custom_configurations:
    master_node_type_id: r6g.2xlarge
    core_nodes:
      target_on_demand: 2
      target_spot: 0
      instance_types:
        - r6gd.8xlarge
    task_nodes:
      instance_types:
        - r6gd.8xlarge
      target_on_demand: 6
      target_spot: 0
    aws_attributes:
      ebs_volume_size: 500
    spark_conf:
      spark.driver.maxResultSize: "0"
      spark.databricks.delta.optimizeWrite.enabled: "true"
      spark.driver.memory: "20g"
      spark.driver.memoryOverhead: "4g"
      # 8 workers × ~2 × 8c/96g executors (DA uncapped). j-08995243 failed with 16c/96g
      # heartbeat timeouts; more shuffle partitions for heavy spill (was ~3 GiB/task at 8c/128g).
      spark.executor.memory: "96g"
      spark.executor.memoryOverhead: "8g"
      spark.executor.cores: "8"
      spark.sql.shuffle.partitions: "800"
      spark.sql.adaptive.advisoryPartitionSizeInBytes: "256MB"
      spark.databricks.delta.checkpoint.partSize: "10000"
validation:
  cluster:
    type: emr_7_12_consolidation_xl_memory_fleet_cluster
    custom_configurations:
      core_nodes:
        target_on_demand: 2
        target_spot: 0
        instance_types:
          - r6gd.8xlarge
      task_nodes:
        instance_types:
          - r6gd.8xlarge
        target_on_demand: 4
        target_spot: 0
      aws_attributes:
        ebs_volume_size: 500
      spark_conf:
        spark.driver.maxResultSize: "0"
        spark.driver.memory: "20g"
        spark.driver.memoryOverhead: "4g"
        spark.executor.memory: "96g"
        spark.executor.memoryOverhead: "8g"
        spark.executor.cores: "8"
        spark.sql.shuffle.partitions: "800"
        spark.sql.adaptive.advisoryPartitionSizeInBytes: "256MB"
        spark.databricks.delta.checkpoint.partSize: "10000"
  allow_custom_spark_job: true
