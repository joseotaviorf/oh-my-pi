database_name: datalake_gsheets_clean
table_name: mexico_marketing_manual_shared_costs
description: Google Sheets that contains marketing costs inputed manually by Growth team in Benvi.
domain: Growth Benvi
owner: guilherme.dorella@quintoandar.com.br
columns:
  side:
    lineage:
      - datalake_gsheets_raw.mexico_marketing_manual_shared_costs.side
