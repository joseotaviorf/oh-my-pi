      - datalake_gsheets_raw.mexico_marketing_manual_shared_costs.city_group
    description: City group of the cost.
  account_name:
    lineage:
      - datalake_gsheets_raw.mexico_marketing_manual_shared_costs.account_name
    description: Account name on the tool where this amount was spent.
  campaign_name:
