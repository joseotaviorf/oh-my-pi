      - datalake_gsheets_raw.mexico_marketing_manual_shared_costs.utm_term
    description: Reference of the utm term that was parameterized in the campaign.
  utm_content:
    lineage:
      - datalake_gsheets_raw.mexico_marketing_manual_shared_costs.utm_content
    description: Reference of the utm content that was parameterized in the campaign.
  mkt_business:
    lineage:
      - datalake_gsheets_raw.mexico_marketing_manual_shared_costs.mkt_business
    description: Business context of the cost.
  mkt_origin:
