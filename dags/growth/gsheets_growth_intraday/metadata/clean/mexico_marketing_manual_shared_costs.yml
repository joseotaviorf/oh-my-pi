    lineage:
      - datalake_gsheets_raw.mexico_marketing_manual_shared_costs.mkt_medium
    description: Mkt medium that was defined for the campaign according to the taxonomy.
  mkt_source:
    lineage:
      - datalake_gsheets_raw.mexico_marketing_manual_shared_costs.mkt_source
