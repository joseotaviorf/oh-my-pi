dag:
  name: enrich_marketing_automatic_daily_costs
  schedule_start_date: 2022, 6, 1
  documentation:
    dag_purpose: |
      This DAG generates the automatic costs (i.e. gathered from medias API/Crawlers) combined with the taxonomy tables and saves its part in the final Fact Marketing Daily Costs aside Enrich Marketing Manual Daily Costs.
      More information about the Fact's architecture can be found at [this diagram] (https://app.diagrams.net/#G1aM-IGy6JcG1rxB0IyDxOJpyCU6GMoFzm) under the "New Arch" tab.
  owner: Data Growth
workflow:
  type: query_delta
  layer: enrich
  custom_schema: marketing_costs
  default_extraction_type: incremental
  default_partitions: [id_date, flow_type]
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, -27), 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
cluster:
  type: custom_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    driver_node_type_id: m5d.xlarge
    node_type_id: m5d.xlarge
    num_workers: 3
    spark_version: 16.4.x-scala2.12
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
