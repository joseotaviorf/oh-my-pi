database_name: datalake_supply_flows
table_name: fallback_taxonomy
domain: Growth
owner: arthur.gonzaga@quintoandar.com.br
description: This table is repsonsible for storing the fallback taxonomy for the supply flows, ie, |
  the taxonomy that is used when the supply flow does not have a original taxonomy associated with it |
  and we want to enrich it with a other events.
columns:
  id_lead:
    description: The unique identifier for each lead in the 1P/3P/CIQ tables. In this table is always null.
  id_house:
    description: The identifier for each house related in the 1P tables.
    lineage:
      - datalake_ebdb_listing.listing_business_context.id_house
      - datalake_supply_flows.conversion_events.id_house
  business_context:
    description: Business context of the conversion event.
    categories:
      RENT: 'For rent lead or house'
      SALE: 'For sale lead or house'
    lineage:
      - datalake_ebdb_listing.listing_business_context.business_context
      - datalake_supply_flows.conversion_events.business_context
  id_user_registrant:
    description: Identifier of the user that registered the conversion event.
    lineage:
      - datalake_ebdb_listing.listing_business_context.id_user_registrant
      - datalake_supply_flows.conversion_events.id_user_registrant
  source:
    description: Source of information of the taxonomy.
  application:
    description: Origin of conversion in the PWAs.
  funnel_step:
    description: The funnel step of the lead, referring to the funnel step in supply funnel.
    lineage:
      - datalake_supply_flows.conversion_events.step
  id_region:
    description: The identifier for region in the 1P/3P/CIQ tables.
    lineage:
      - datalake_ebdb_listing.listing_business_context.id_region
      - datalake_supply_flows.conversion_events.id_region
  ops_partner:
    description: The name of the company that register the lead.
    lineage:
      - datalake_supply_flows.operations_agents.ops_partner
  ops_agent:
    description: Agent that reprocessed the lead. For this scenario is always outbound team.
    lineage:
      - datalake_supply_flows.operations_agents.ops_agent
  ops_objective:
    description: Objective of the conversion event.
    lineage:
      - datalake_supply_flows.operations_agents.ops_objective
  ops_approach:
    description: Approach of the conversion event.
    lineage:
      - datalake_supply_flows.operations_agents.ops_approach
  ops_contact_medium:
    description: Medium of the conversion event.
    lineage:
      - datalake_supply_flows.operations_agents.ops_contact_medium
  ts_event:
    description: Timestamp of the event.
    lineage:
      - datalake_ebdb_listing.listing_business_context.ts_first_listing
      - datalake_supply_flows.conversion_events.ts_event_adjusted
  ts_load:
    description: Timestamp of the load.
  year:
    description: Year of the event.
    lineage:
      - datalake_ebdb_listing.listing_business_context.ts_first_listing
      - datalake_supply_flows.conversion_events.ts_event_adjusted
  month:
    description: Month of the event.
    lineage:
      - datalake_ebdb_listing.listing_business_context.ts_first_listing
      - datalake_supply_flows.conversion_events.ts_event_adjusted
  day:
    description: Day of the event.
    lineage:
      - datalake_ebdb_listing.listing_business_context.ts_first_listing
      - datalake_supply_flows.conversion_events.ts_event_adjusted
