---
dag:
  name: enrich_supply_taxonomy
  schedule_start_date: 2019, 1, 1
  owner: Data Growth
  documentation: 
    dag_purpose: |
      This DAG is responsible for enriching the supply flows data with the taxonomy data.
workflow:
  type: query_delta
  layer: enrich
  custom_schema: supply_flows
  default_extraction_type: full
  tables_customization:
    conversion_taxonomy:
      z_order_by: ['id_lead', 'id_house', 'business_context']
  inner_dependencies:
    conversion_taxonomy:
      - fallback_taxonomy
  spark_session_configs:
    udfs: [SF_NORMALIZE_STRING]
cluster:
  type: databricks_12_2_min_io-memory_photon_cluster