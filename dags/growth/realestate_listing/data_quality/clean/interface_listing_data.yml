---
table_name: datalake_realestate_clean.interface_listing_data
alert_channel: GROWTH_ALERTS
table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Warning
column_level_validations:
  action_code:
    is_complete:
      severity_level: Error
  content_hash:
    is_complete:
      severity_level: Error
  id_company:
    is_complete:
      severity_level: Error
  id_country:
    is_complete:
      severity_level: Error
  id_interface:
    is_complete:
      severity_level: Error
  id_listing:
    is_complete:
      severity_level: Error
  images_hash:
    is_complete:
      severity_level: Error
  interface_key:
    is_complete:
      severity_level: Error
  is_enabled:
    is_complete:
      severity_level: Error
  ts_last_synced:
    is_complete:
      severity_level: Error
  unique_composite_primary_key:
    custom:
      constraint: |-
        (SELECT COUNT(*) FROM (
          SELECT id_listing, id_interface, COUNT(*) AS cnt
          FROM datalake_realestate_clean.interface_listing_data
          GROUP BY id_listing, id_interface
          HAVING COUNT(*) > 1
        ) dupes) = 0
      severity_level: Error
