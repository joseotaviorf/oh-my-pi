---
database_name: datalake_realestate_clean
table_name: listing_features
domain: Growth
owner: vitor.musachio@quintoandar.com.br
description: |-
  Entity table from the RealEstate Navent MySQL portal (datalake_realestate_clean.listing_features). Grain: one row per amenity or characteristic attached to a listing (id_listing_feature). No date partitions; Delta Z-order on (id_listing) — filter/join on Z-order columns for data skipping. Downstream: Search filters and listing-quality scoring by property features.
columns:
  id_listing_feature:
    lineage:
    - datalake_realestate_raw.avisoscaracteristicas.idavisocaracteristica
    description: Surrogate key for a single amenity or characteristic row attached to a listing.
  id_feature:
    lineage:
    - datalake_realestate_raw.avisoscaracteristicas.idcaracteristica
    description: Catalog identifier of the amenity type (pool, balcony, furnished, etc.).
  id_feature_option:
    lineage:
    - datalake_realestate_raw.avisoscaracteristicas.idopcion
    description: Selected option value within the feature when the amenity is enumerated.
  id_listing:
    lineage:
    - datalake_realestate_raw.avisoscaracteristicas.idaviso
    description: |-
      Listing that displays this amenity on search filters and the detail page. Delta Z-order column — include in filters for data skipping (no date partitions).
  feature_value:
    lineage:
    - datalake_realestate_raw.avisoscaracteristicas.valor
    description: |-
      Free-text or numeric value for the amenity when not covered by id_feature_option.
  ts_cdc_transaction:
    lineage:
    - datalake_realestate_raw.avisoscaracteristicas.ts_cdc_transaction
    description: Wall-clock time when the Debezium connector captured this row change.
  ts_database_transaction:
    lineage:
    - datalake_realestate_raw.avisoscaracteristicas.ts_database_transaction
    description: Commit time of the originating MySQL transaction before CDC propagation.
  op_cdc:
    lineage:
    - datalake_realestate_raw.avisoscaracteristicas.op_cdc
    description: |-
      CDC operation type captured by Debezium (r=read/snapshot, c=create, u=update, d=delete).
    categories:
      r: Read/snapshot - initial load of existing records.
      c: Create - new record inserted.
      u: Update - existing record modified.
      d: Delete - record removed.
