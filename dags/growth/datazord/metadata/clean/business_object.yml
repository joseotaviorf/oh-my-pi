database_name: datalake_datazord_clean
table_name: business_object
domain: Growth
description: |
  Datazord business-object registry ingested from the Datazord CDF topic, mapping users, houses, contracts, and personas into CDP transactional entities. One row per business object with type, context, and lifecycle timestamps.

owner: isadora.gallerani@quintoandar.com.br
columns:
  sk_business_object:
    description: Surrogate key for the Datazord business object row in the clean layer.
    lineage:
      - datalake_datazord_raw.business_object.surrogate_key
  id_user:
    description: User identifier associated with the business object
    lineage:
      - datalake_datazord_raw.business_object.id_user
  uuid_person:
    description: UUID person identifier linking the business object to the CDP person dimension.
    lineage:
      - datalake_datazord_raw.business_object.uuid_person
  id_house:
    description: House identifier associated with the business object
    lineage:
      - datalake_datazord_raw.business_object.id_house
  id_contract:
    description: Contract identifier associated with the business object
    lineage:
      - datalake_datazord_raw.business_object.id_contract
  id_object:
    description: Source-system object identifier for the business entity referenced by this row.
    lineage:
      - datalake_datazord_raw.business_object.id_object
  business_type:
    description: Datazord business-object type enum (e.g. house, contract, visit) used in CDP entity routing.
    lineage:
      - datalake_datazord_raw.business_object.business_type
  persona:
    description: Persona classification for the business object
    lineage:
      - datalake_datazord_raw.business_object.persona
  is_active:
    description: Boolean flag indicating if the business object is active
    lineage:
      - datalake_datazord_raw.business_object.is_active
  house_address:
    description: Address of the house associated with the business object
    lineage:
      - datalake_datazord_raw.business_object.house_address
  properties:
    description: Additional properties stored as JSONB
    lineage:
      - datalake_datazord_raw.business_object.properties
  business_context:
    description: Rent or sale business context and journey metadata attached to the business object.
    lineage:
      - datalake_datazord_raw.business_object.business_context
  journey_step:
    description: Current step in the journey for the business object
    lineage:
      - datalake_datazord_raw.business_object.journey_step
  ts_inactive:
    description: Timestamp when the business object was marked as inactive
    lineage:
      - datalake_datazord_raw.business_object.inactive_at
  ts_created:
    description: Timestamp when the business object was created
    lineage:
      - datalake_datazord_raw.business_object.ts_created
  ts_updated:
    description: Timestamp when the business object was last updated
    lineage:
      - datalake_datazord_raw.business_object.ts_updated
