---
database_name: datalake_consolidated_marketing_metrics
table_name: rtb_consolidated_metrics
owner: henrique.paulo@quintoandar.com.br
domain: Growth
description: Table that consolidates metrics extracted from rtb platform
columns:
  id_date:
    description: Surrogate date key derived from source report load dates used to join consolidated marketing metrics to the calendar dimension.
    lineage:
      - datalake_rtb_campaigns_clean.rtb_campaigns.dt_attribution
  campaign_name:
    description: Name of campaign segmentation
    lineage:
      - datalake_rtb_campaigns_clean.rtb_campaigns.sub_campaign_name
  account_name:
    description: Accont name at rtb platform
    lineage:
      - datalake_rtb_campaigns_clean.rtb_campaigns.account_name
  utm_campaign:
    description: utm_campaign applied on growth marketing platform
    lineage:
      - datalake_rtb_campaigns_clean.rtb_campaigns.sub_campaign_name
  other_cost:
    description: Cost from any platform different from desktop or mobile
    lineage:
      - datalake_rtb_campaigns_clean.rtb_campaigns.cost
  total_cost:
    description: Total media spend in BRL for the campaign, channel, and report date grain of this row.
    lineage:
      - datalake_rtb_campaigns_clean.rtb_campaigns.cost
  impressions:
    description: Impressions from facebook ads platform
    lineage:
      - datalake_rtb_campaigns_clean.rtb_campaigns.impressions
  clicks:
    description: Clicks from facebook ads platform
    lineage:
      - datalake_rtb_campaigns_clean.rtb_campaigns.clicks
