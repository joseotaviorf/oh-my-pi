---
database_name: datalake_consolidated_marketing_metrics
table_name: braze_consolidated_metrics
owner: henrique.paulo@quintoandar.com.br
domain: Growth
description: Table that consolidates metrics extracted from braze platform
columns:
  id_date:
    description: Surrogate date key derived from source report load dates used to join consolidated marketing metrics to the calendar dimension.
    lineage:
      - datalake_braze_webhook_notification.webhook_notification_volumes.dt_webhook_sent
  campaign_name:
    description: Name of campaign segmentation
    lineage:
      - datalake_braze_webhook_notification.webhook_notification_volumes.canvas_name
      - datalake_braze_webhook_notification.webhook_notification_volumes.rule_status
  ia_general:
    description: Informs the type of notification.
    lineage:
      - datalake_braze_webhook_notification.webhook_notification_volumes.rule_status
    categories: 
      SMS: 'SMS notification'
      Whatsapp: 'Whatsapp notification'
  context:
    description: Supply operation channel belloging to Referals origin
    lineage:
      - datalake_braze_webhook_notification.webhook_notification_volumes.rule_status
    categories: 
      Indica Aí - General: ''
      Doorman: ''
      Indica Aí - Agents: ''
  city_group:
    description: QuintoAndar city group used to allocate Braze campaign costs in sharing rules.
    lineage:
      - datalake_marketing_costs_sharing_rules.a028a.city_group
  cost:
    description: Braze campaign cost amount allocated to the city group and business context.
    lineage:
      - datalake_braze_webhook_notification.webhook_notification_volumes.notification_count
  funnel_side:
    description: Informs the side of the funnel, in this case, the affiliates side. 
  business_context:
    description: QuintoAndar business context (rent, sale, etc.) for cost allocation.
    lineage:
      - datalake_marketing_costs_sharing_rules.a028a.business_context
      - datalake_marketing_costs_sharing_rules.a034a.business_context
      - datalake_marketing_costs_sharing_rules.a033a.business_context
  origin: 
    description: Growth marketing platform
    categories: 
      braze: ''
  account_name: 
    description: Accont name at braze platform
  utm_campaign: 
    description: utm_campaign applied on growth marketing platform
  utm_term: 
    description: utm_term applied on growth marketing platform
  utm_content: 
    description: utm_content applied on growth marketing platform
