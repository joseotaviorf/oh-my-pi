dag:
  name: enrich_consolidated_marketing_metrics
  schedule_start_date: 2019, 1, 1
  owner: Data Growth
  documentation:
    dag_purpose: 'Consolidated Marketing Metrics DAG groups marketing metrics for media channels from QuintoAndar.

      Each media has a consolidated table, which aggregates metrics. All consolidated tables are united in the `consolidated_media_metrics` query, where city groups and sharing rules are applied.

      For Google Ads consolidation, most of data is present in multiple Google reports, so a deduplication occurs, selecting which report is used to retrieve each distinct combination of `campaign` + `ad_group_name`, according to the following priority sequence of reports:

      1. VIDEO_PERFORMANCE_REPORT 2. KEYWORDS_PERFORMANCE_REPORT 3. AD_PERFORMANCE_REPORT 4. CAMPAIGN_PERFORMANCE_REPORT

      Report type names are based in this [Google Ads API doc](https://developers.google.com/adwords/api/docs/appendix/reports), and must be the same used in taxonomy mappings.

      More information about marketing data flow architecture can be found at [this diagram](https://viewer.diagrams.net/?page-id=XMpkxgjBueLUIo4w7sMd&highlight=0000ff&nav=1&hide-pages=1#G1aM-IGy6JcG1rxB0IyDxOJpyCU6GMoFzm), also shown in details below.'
workflow:
  type: query_delta
  layer: enrich
  default_extraction_type: incremental
  default_partitions:
  - id_date
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, macros.ds_add(ds, -6), 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, ds, 'load_end_date') }}"
  inner_dependencies:
    consolidated_media_metrics:
    - braze_consolidated_metrics
    - criteo_consolidated_metrics
    - facebook_consolidated_metrics
    - google_consolidated_metrics
    - mitula_consolidated_metrics
    - rtb_consolidated_metrics
    - trovit_consolidated_metrics
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: m5d.xlarge
    node_type_id: m5d.xlarge
    runtime_engine: PHOTON
    num_workers: 3
    spark_version: 12.2.x-scala2.12
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
  databricks_conn_id: databricks_new
