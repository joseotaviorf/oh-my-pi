owner: isadora.gallerani@quintoandar.com.br
description: Hibernate Envers audit history for EBDB `Usuario` (user profile changes). One row per revision capturing before/after values and mod_* flags for every audited field, including PII (contact, documents, address, banking), persona foreign keys (agent, sales rep, affiliate), and authentication data. Join rev to user_revision_entity.id to resolve the acting user, timestamp, and change reason. Used by Growth and downstream enrich models to trace profile and compliance changes.
