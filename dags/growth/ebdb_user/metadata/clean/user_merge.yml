database_name: datalake_ebdb_clean
table_name: user_merge
description: >
  Clean layer for EBDB user account merge events, linking loser and winner accounts
  and their person UUIDs when accounts are consolidated.
domain: Growth
owner: data-growth@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_ebdb_raw.usermerge.id
    description: Primary identifier of the user merge record in EBDB.
  id_loser_account:
    lineage:
      - datalake_ebdb_raw.usermerge.loseraccountid
    description: Account identifier of the user account merged away (loser).
  id_winner_account:
    lineage:
      - datalake_ebdb_raw.usermerge.winneraccountid
    description: Account identifier of the surviving user account (winner).
  uuid_winner_person:
    lineage:
      - datalake_ebdb_raw.usermerge.winnerpersonuuid
    description: Person UUID of the winning account after the merge.
  uuid_loser_person:
    lineage:
      - datalake_ebdb_raw.usermerge.loserpersonuuid
    description: Person UUID of the losing account before the merge.
  status:
    lineage:
      - datalake_ebdb_raw.usermerge.status
    description: Processing status of the merge operation in EBDB.
  failure_count:
    lineage:
      - datalake_ebdb_raw.usermerge.failurecount
    description: Number of failed attempts while applying the merge.
  ts_created:
    lineage:
      - datalake_ebdb_raw.usermerge.criadoem
    description: Timestamp when the merge record was created in EBDB.
  ts_updated:
    lineage:
      - datalake_ebdb_raw.usermerge.atualizadoem
    description: Timestamp when the merge record was last updated in EBDB.
