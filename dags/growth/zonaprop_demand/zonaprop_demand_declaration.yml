dag:
  name: zonaprop_demand
  owner: Data Growth
  schedule_interval: 0 8,12,21 * * *
  schedule_start_date: 2026, 9, 1
  documentation:
    dag_purpose: 'CDC pipeline for Zonaprop (Navent) — Demand domain tables (RD-3334,
      parent RD-3332).


      CDC ingestion of Zonaprop buyer contact actions (lead events) from the Navent
      MySQL portal. Feeds demand-funnel and conversion analytics for the migration
      POC.


      DATA LINEAGE: MySQL (OLTP) -> datalake_zonaprop_raw -> datalake_zonaprop_clean

      SCHEDULE: 3x daily at minute 0 UTC (08:00, 12:00, 21:00).

      See dags/growth/zonaprop_demand/zonaprop_demand.md for table inventory.'
workflow:
  type: cdc
  layer: raw
  database_type: mysql
  source_database: zonaprop
  custom_schema: zonaprop
  source_schema: zonaprop
  dbutils_secret_key: ZONAPROP_DB
  tables_customization:
    contactosacciones:
      clean_table_name: contact_actions
      raw_primary_keys:
      - idcontactoaccion
      clean_primary_keys:
      - id_contact_action
      clean_z_order_by:
      - id_contact
  extra_query_template_params:
    load_start_date: '{{ get_date_param(dag_run, data_interval_start | ds, ''load_start_date'')
      }}'
    load_end_date: '{{ get_date_param(dag_run, data_interval_start | ds, ''load_end_date'')
      }}'
