---
database_name: datalake_alias_clean
table_name: listing_fingerprint
domain: Growth
owner: vitor.musachio@quintoandar.com.br
description: |
  Sync state for each listing in a brokerage's XML feed on Alias (PostgreSQL source:
  alias.public.listing_fingerprint). Composite grain: one record per (uuid_company, id_listing_original),
  where id_listing_original is the listing's native ID in the partner system (VR_SYNC feed). The content
  hash (listing_hash, SHA-256) is the change-detection mechanism: listings with an unchanged hash are
  counted as skipped and not reprocessed, optimizing ingestion throughput. id_synthetic_house is a stable
  identity generated by Alias for OpenSearch indexing — reused when a listing is republished after a
  soft-unpublish, preserving ID continuity downstream. Listings removed from the XML feed receive
  status=UNPUBLISHED (soft delete). cached_location stores the geocoding result (Vespucio/Google) to
  avoid repeated external calls. text2filter_prediction stores Text2Filter model output (property type,
  amenity filters). id_property in lead_resolutions points to the id_synthetic_house of this table.
  Used for published portfolio analytics, feed health monitoring, and listing lifecycle reporting.
  Partitioned by year/month/day from ts_updated; z-order by uuid_company and status.
columns:
  uuid_company:
    description: |
      Composite primary key part — broker company UUID. Foreign key to brokers.uuid_company.
    lineage:
      - datalake_alias_raw.listing_fingerprint.company_uuid
  id_listing_original:
    description: |
      Composite primary key part — listing identifier from the broker XML/CRM feed (partner-native ID).
    lineage:
      - datalake_alias_raw.listing_fingerprint.listing_original_id
  id_synthetic_house:
    description: |
      Stable synthetic numeric ID assigned by Alias for OpenSearch indexing. Reused when listing
      is republished after soft-unpublish.
    lineage:
      - datalake_alias_raw.listing_fingerprint.synthetic_house_id
  listing_hash:
    description: |
      SHA-256 content fingerprint of normalized listing fields. Used to detect meaningful changes vs skips.
    lineage:
      - datalake_alias_raw.listing_fingerprint.listing_hash
  status:
    description: |
      Publish state of the listing in Alias/OpenSearch (soft delete via status flip, not row delete).
    lineage:
      - datalake_alias_raw.listing_fingerprint.status
    categories:
      PUBLISHED: Listing is active and visible in search index.
      UNPUBLISHED: Listing soft-unpublished (stale cleanup or explicit unpublish event).
  text2filter_prediction:
    description: |
      JSON output from Text2Filter model (property type, filters). Nullable when model not invoked.
    lineage:
      - datalake_alias_raw.listing_fingerprint.text2filter_prediction
  cached_location:
    description: |
      JSON geocoding result cached from Vespucio/Google. Nullable when coordinates come from feed.
    lineage:
      - datalake_alias_raw.listing_fingerprint.cached_location
  ts_last_update:
    description: |
      Last update timestamp from the source feed payload. Nullable when feed omits the field.
    lineage:
      - datalake_alias_raw.listing_fingerprint.last_update_date
  ts_reviewed:
    description: |
      Timestamp when Alias last processed (reviewed) this listing in an ingestion run.
    lineage:
      - datalake_alias_raw.listing_fingerprint.reviewed_at
  ts_created:
    description: |
      Timestamp when the fingerprint row was first created.
    lineage:
      - datalake_alias_raw.listing_fingerprint.created_at
  ts_updated:
    description: |
      Timestamp of the last fingerprint update. Basis for partition columns.
    lineage:
      - datalake_alias_raw.listing_fingerprint.updated_at
  year:
    description: |
      Partition column (year) from ts_updated. Filter in WHERE for partition pruning.
    lineage:
      - datalake_alias_raw.listing_fingerprint.updated_at
  month:
    description: |
      Partition column (month) from ts_updated. Filter in WHERE for partition pruning.
    lineage:
      - datalake_alias_raw.listing_fingerprint.updated_at
  day:
    description: |
      Partition column (day) from ts_updated. Filter in WHERE for partition pruning.
    lineage:
      - datalake_alias_raw.listing_fingerprint.updated_at