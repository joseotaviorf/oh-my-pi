---
table_name: datalake_alias_clean.inventory_ingestions
alert_channel: GROWTH_ALERTS
table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: -10
    less_than_or_equal_to: 50
    severity_level: Warning

column_level_validations:
  uuid_inventory_ingestion:
    is_unique:
      severity_level: Error
    is_complete:
      severity_level: Error
  uuid_company:
    is_complete:
      severity_level: Error
  status:
    is_complete:
      severity_level: Error
    is_contained_in:
      values:
        - IN_PROGRESS
        - COMPLETED
        - FAILED
        - TIMED_OUT
      severity_level: Error
  quantity_created:
    is_complete:
      severity_level: Error
  quantity_updated:
    is_complete:
      severity_level: Error
  quantity_failed:
    is_complete:
      severity_level: Error
  quantity_skipped:
    is_complete:
      severity_level: Error
  quantity_unpublished:
    is_complete:
      severity_level: Error
  ts_started:
    is_complete:
      severity_level: Error
    custom:
      constraint: |-
        (SELECT COUNT(*)
         FROM datalake_alias_clean.inventory_ingestions
         WHERE year != YEAR(CAST(ts_started AS TIMESTAMP))
            OR month != MONTH(CAST(ts_started AS TIMESTAMP))
            OR day != DAY(CAST(ts_started AS TIMESTAMP))
        ) = 0
      severity_level: Error
  year:
    is_complete:
      severity_level: Error
  month:
    is_complete:
      severity_level: Error
    has_min_value:
      greater_than_or_equal_to: 1
      severity_level: Error
    has_max_value:
      less_than_or_equal_to: 12
      severity_level: Error
  day:
    is_complete:
      severity_level: Error
    has_min_value:
      greater_than_or_equal_to: 1
      severity_level: Error
    has_max_value:
      less_than_or_equal_to: 31
      severity_level: Error