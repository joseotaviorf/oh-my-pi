---
table_name: datalake_alias_clean.lead_resolutions
alert_channel: GROWTH_ALERTS
table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: -10
    less_than_or_equal_to: 50
    severity_level: Warning

column_level_validations:
  uuid_lead_resolution:
    is_unique:
      severity_level: Error
    is_complete:
      severity_level: Error
  uuid_lead_session:
    is_complete:
      severity_level: Error
  type:
    is_complete:
      severity_level: Error
    is_contained_in:
      values:
        - VISIT_INTENTION
        - ESCALATION
        - INACTIVE
      severity_level: Error
  ts_resolved:
    is_complete:
      severity_level: Error
  ts_created:
    is_complete:
      severity_level: Error
  ts_updated:
    is_complete:
      severity_level: Error
    custom:
      constraint: |-
        (SELECT COUNT(*)
         FROM datalake_alias_clean.lead_resolutions
         WHERE year != YEAR(CAST(ts_updated AS TIMESTAMP))
            OR month != MONTH(CAST(ts_updated AS TIMESTAMP))
            OR day != DAY(CAST(ts_updated AS TIMESTAMP))
        ) = 0
      severity_level: Error
  year:
    is_complete:
      severity_level: Error
  month:
    is_complete:
      severity_level: Error
    has_min_value:
      greater_than_or_equal_to: 1
      severity_level: Error
    has_max_value:
      less_than_or_equal_to: 12
      severity_level: Error
  day:
    is_complete:
      severity_level: Error
    has_min_value:
      greater_than_or_equal_to: 1
      severity_level: Error
    has_max_value:
      less_than_or_equal_to: 31
      severity_level: Error