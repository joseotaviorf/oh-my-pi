---
table_name: datalake_alias_clean.listing_fingerprint
alert_channel: GROWTH_ALERTS
table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: -10
    less_than_or_equal_to: 50
    severity_level: Warning

column_level_validations:
  unique_uuid_company_id_listing_original:
    custom:
      # Composite key (uuid_company, id_listing_original) must be unique.
      constraint: |-
        (SELECT COUNT(*)
         FROM (
           SELECT 1
           FROM datalake_alias_clean.listing_fingerprint
           GROUP BY uuid_company, id_listing_original
           HAVING COUNT(*) > 1
         )
        ) = 0
      severity_level: Error
  uuid_company:
    is_complete:
      severity_level: Error
  id_listing_original:
    is_complete:
      severity_level: Error
  id_synthetic_house:
    is_complete:
      severity_level: Error
  listing_hash:
    is_complete:
      severity_level: Error
  status:
    is_complete:
      severity_level: Error
    is_contained_in:
      values:
        - PUBLISHED
        - UNPUBLISHED
      severity_level: Error
  ts_reviewed:
    is_complete:
      severity_level: Error
  ts_created:
    is_complete:
      severity_level: Error
  ts_updated:
    is_complete:
      severity_level: Error
    custom:
      constraint: |-
        (SELECT COUNT(*)
         FROM datalake_alias_clean.listing_fingerprint
         WHERE year != YEAR(CAST(ts_updated AS TIMESTAMP))
            OR month != MONTH(CAST(ts_updated AS TIMESTAMP))
            OR day != DAY(CAST(ts_updated AS TIMESTAMP))
        ) = 0
      severity_level: Error
  year:
    is_complete:
      severity_level: Error
  month:
    is_complete:
      severity_level: Error
    has_min_value:
      greater_than_or_equal_to: 1
      severity_level: Error
    has_max_value:
      less_than_or_equal_to: 12
      severity_level: Error
  day:
    is_complete:
      severity_level: Error
    has_min_value:
      greater_than_or_equal_to: 1
      severity_level: Error
    has_max_value:
      less_than_or_equal_to: 31
      severity_level: Error