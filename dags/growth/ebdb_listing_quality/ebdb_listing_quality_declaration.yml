dag:
  name: ebdb_listing_quality
  schedule_start_date: 2026, 4, 30
  schedule_interval: 30 21,8,12 * * *
  owner: Data Growth
  documentation:
    dag_purpose: Extraction of EBDB ListingQuality table into the data lake (raw + clean). EBDB is the main database for QuintoAndar.
workflow:
  type: cdc
  layer: raw
  database_type: mysql
  source_database: ebdb
  source_schema: ebdb
  custom_schema: ebdb
  tables_customization:
    ListingQuality:
      raw_primary_keys: ["id"]
      clean_table_name: listing_quality
      z_order_by:
        - id_house
  extra_query_template_params:
    load_end_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, 1), 'load_end_date') }}"
cluster:
  type: databricks_16_4_med_general_cluster
  databricks_conn_id: databricks_new_env
