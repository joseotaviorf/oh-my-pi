---
database_name: datalake_growth_costs_sharing_rules
table_name: s051s
owner: uilson.bonfim@quintoandar.com.br
domain: Growth
description: >
  Allocation of costs - divides the costs resulting from the campaign that applied that rule
  on Marketing Platform and splits its share according to the prospects
  generated by that campaign
columns:
  business_context:
    description: Supply-side business context from fact_supply_events (e.g. rent, sale); filters which supply events count toward allocation.
    lineage:
      - dw_growth.fact_supply_events.nm_business_context
  city_group:
    description: Always NULL for this hybrid supply rule; allocation is by utm_campaign_modified only.
  funnel_side:
    description: Always `supply` for hybrid supply-side campaigns allocated by campaign variant.
    categories:
      supply: Supply-side hybrid campaign costs split by UTM campaign variant.
  id_date:
    description: Calendar date (yyyyMMdd integer) for which the cost-sharing percentage applies, derived from fact_supply_events.sk_date.
    lineage:
      - dw_growth.fact_supply_events.sk_date
  id_rule:
    description: Cost-sharing rule code matching this enrich table name; injected at runtime from the SQL filename (e.g. a002a, d046d).
  share:
    description: Dynamic fraction of hybrid supply campaign spend for this utm_campaign_modified on this date, computed as supply-event count for the variant divided by total variant events (range 0 to 1).
  country_code:
    description: |
      ISO country code for cost allocation. Null for this supply-side hybrid rule (city_group is
      also null; allocation is by utm_campaign_modified only).
  utm_campaign_modified:
    description: |
      Campaign name suffix parsed from nm_campaign (substring after the first dot). Used to match
      UTM-modified sharing rules for hybrid supply campaigns.
    lineage:
      - dw_growth.dim_acquisition_lead.nm_campaign
