---
database_name: datalake_growth_costs_sharing_rules
table_name: d046d
owner: uilson.bonfim@quintoandar.com.br
domain: Growth
description: >
  Allocation of costs - divides the costs resulting from the campaign that applied that rule
  on Marketing Platform and splits its share according to the Tenant Prospects (nTP+rTP)
  generated by that campaign
columns:
  business_context:
    description: Rent or sale business line (`rent`/`sale`) from prospect_daily_results; filters which tenant or buyer prospects count toward allocation.
    lineage:
      - datalake_demand_flows.prospect_daily_results.business_context
  city_group:
    description: QuintoAndar geographic market cluster receiving the allocated share; limited to the city bundle defined in the rule SQL.
    lineage:
      - datalake_region.region.city_group
  funnel_side:
    description: Always `demand` for metric-driven demand-side performance marketing rules.
    categories:
      demand: Demand-side performance marketing costs allocated by conversion metrics.
  id_date:
    description: Calendar date (yyyyMMdd integer) for which the cost-sharing percentage applies. One row per date, city_group, and rule combination.
    lineage:
      - datalake_quintoandar.aux_date.id_date
  id_rule:
    description: Cost-sharing rule code matching this enrich table name; injected at runtime from the SQL filename (e.g. a002a, d046d).
  share:
    description: Dynamic fraction of UTM-modified campaign spend for this city_group and campaign variant on this date, computed from conversion metrics (range 0 to 1).
  country_code:
    description: ISO country code for the city_group receiving the allocated share (BR or MX).
    lineage:
      - datalake_region.region.country_code
    categories:
      BR: Brazil
      MX: Mexico
  utm_campaign_modified:
    description: |
      UTM campaign suffix parsed from utm_campaign (substring after the first dot). Used to match
      UTM-modified sharing rules in consolidated_media_metrics.
    lineage:
      - datalake_demand_flows.prospect_daily_results.utm_campaign
