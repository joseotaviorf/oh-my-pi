---
dag:
  name: enrich_supply_outbound_flows
  schedule_start_date: 2022, 10, 18
  owner: Data Growth
  documentation:
    dag_purpose: Creates an enrich that aggregates the data from the Outbound flow
      of Supply, Inside Sales, connecting the databases of the micro-services that
      are part of the Omnichannel - Braze, Jaiminho and Wololo - to map the contacts
      made to a prospect throughout the P2O stage.
workflow:
  type: query_delta
  layer: enrich
  default_extraction_type: incremental
  default_partitions:
    - year
    - month
    - day
  extra_query_template_params: 
    load_start_date: "{{ get_date_param(dag_run, ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, ds, 'load_end_date') }}"
cluster:
  type: databricks_12_2_med_general_photon_cluster
