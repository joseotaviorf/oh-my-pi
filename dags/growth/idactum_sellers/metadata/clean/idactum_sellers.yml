database_name: datalake_idactum_sellers_clean
table_name: idactum_sellers
description: Table acquired from Idactum. Contains real estate transactions sellers data.
domain: Growth
owner: data-growth@quintoandar.com.br / gabriel.mota@quintoandar.com.br
columns:
  id_idactum:
    lineage:
      - datalake_idactum_sellers_raw.idactum_sellers.id_idactum
    description: |
      "Idactum house id."
  id_transaction:
    lineage:
      - datalake_idactum_sellers_raw.idactum_sellers.id_transacao
    description: |
      "Transaction id."
  seller_name:
    lineage:
      - datalake_idactum_sellers_raw.idactum_sellers.nome
    description: |
      "Seller name."
  seller_document_number:
    lineage:
      - datalake_idactum_sellers_raw.idactum_sellers.documento
    description: |
      "Seller document number."
  ts_transaction:
    lineage:
      - datalake_idactum_sellers_raw.idactum_sellers.data_transacao
    description: |
      "Timestamp when the transaction was made."
  dt_load:
    lineage:
      - datalake_idactum_sellers_raw.idactum_sellers.dt_load
    description: |
      "Date when the idactum sellers data was loaded."
