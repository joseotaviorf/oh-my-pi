database_name: datalake_seo_funnel
table_name: seo_funnel
owner: henrique.miamoto@quintoandar.com.br
domain: Growth
description: This table contains information about SEO (Search Engine Optimization). It compiles the events data with our bussiness information.
columns:
  id_user:
    description: User identifier
    lineage:
      - datalake_online_attribution.online_attribution.id_user
      - datalake_online_attribution.online_attribution.id_amplitude
      - datalake_top_of_funnel_demand.user_interactions.id_user
      - datalake_top_of_funnel_demand.user_interactions.id_amplitude
  business_context:
    description: Identifies what is the business context (rent or sale)
    lineage:
      - datalake_online_attribution.online_attribution.business_context
      - datalake_top_of_funnel_demand.user_interactions.business_context
  city_group:
    description: A grouping of city or clusters of cities and neighborhoods
    lineage:
      - dw_public.dim_region.city_group
      - dw_datamarts_growth_cross.performance_marketing_metrics_demand.city_group
      - dw_datamarts_growth_cross.sale_performance_marketing_metrics_demand.city_group
  mkt_origin:
    description: Origin of the lead in the marketing funnel
    lineage:
      - datalake_top_of_funnel_demand.user_interactions.mkt_origin
      - dw_datamarts_growth_cross.performance_marketing_metrics_demand.mkt_origin
      - dw_datamarts_growth_cross.sale_performance_marketing_metrics_demand.mkt_origin
  structure:
    description: Identifies the entrance urls structure (home, transactional, informational or other)
    lineage:
      - datalake_online_attribution.online_attribution.entrance_uri
      - datalake_top_of_funnel_demand.user_interactions.entrance_uri
  page_cluster:
    description: Identifies the entrance urls cluster (home, rental search, sale search, regions, condominium or other)
    lineage:
      - datalake_online_attribution.online_attribution.entrance_uri
      - datalake_top_of_funnel_demand.user_interactions.entrance_uri
  location_level:
    description: Identifies the entrance urls location level (street, neighborhood, city, point of interest, condominium name, condominium address or other)
    lineage:
      - datalake_online_attribution.online_attribution.entrance_uri
      - datalake_top_of_funnel_demand.user_interactions.entrance_uri
  filters_count:
    description: Identifies the entrance urls filters quantity
    lineage:
      - datalake_online_attribution.online_attribution.entrance_uri
      - datalake_top_of_funnel_demand.user_interactions.entrance_uri
  filter_combination:
    description: If the entrance url has filters, it identifies the filter combination
    lineage:
      - datalake_online_attribution.online_attribution.entrance_uri
      - datalake_top_of_funnel_demand.user_interactions.entrance_uri
  filter_1:
    description: If the entrance url has filters, it identifies the first one
    lineage:
      - datalake_online_attribution.online_attribution.entrance_uri
      - datalake_top_of_funnel_demand.user_interactions.entrance_uri
  is_attribution:
    description: Identifies whether it is a result generated by attribution
    lineage:
      - datalake_online_attribution.online_attribution.referrer
      - datalake_top_of_funnel_demand.user_interactions.referrer
  is_tof:
    description: Identifies whether it is a tof user
  is_booking:
    description: Identifies whether it is a tof user
  is_first_booking:
    description: Identifies whether it is a tof user
  dt_event:
    description: ToF, Tenant/Buyer Prospects date
    lineage:
      - datalake_online_attribution.online_attribution.ts_event
      - datalake_top_of_funnel_demand.user_interactions.dt_event