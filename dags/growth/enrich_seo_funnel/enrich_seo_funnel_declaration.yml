dag:
  name: enrich_seo_funnel
  schedule_start_date: 2022, 10, 18
  owner: Data Growth
  documentation:
    dag_purpose: As a derivation of the online_attribution, this DAG generates tables to track demand user behaviors in the SEO funnel. It is relevant for the SEO tribe to monitor and analyze the results by page type so that the squads (transactional and informational) can more efficiently identify problems, impacts, and opportunities. In addition, this funnel helps to prioritize the most relevant pages for the business.
workflow:
  type: query_delta
  layer: enrich
  default_extraction_type: incremental
  default_partitions:
  - year
  - month
  - day
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, -6), 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
cluster:
  type: databricks_12_2_med_io-memory_photon_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
