    - datalake_sale_demand_events.sale_demand_events.id_buyer
    - datalake_rent_demand_events.rent_demand_events.id_tenant_prospect
    - datalake_talk_to_agent.talk_to_agent.tenant_id
  id_owner:
    description: 'Id user of the house owner'
    lineage:
    - datalake_sale_demand_events.sale_demand_events.id_owner
    - datalake_rent_demand_events.rent_demand_events.id_owner
    - datalake_talk_to_agent.talk_to_agent.id_user
  id_agent:
    description: 'Id of the agent whose made the booking.'
    lineage:
    - datalake_sale_demand_events.sale_demand_events.id_agent
    - datalake_rent_demand_events.rent_demand_events.id_agent
