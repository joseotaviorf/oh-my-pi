---
database_name: datalake_demand_flows
table_name: demand_prospect_conversion_events
owner: thiago.jesus@quintoandar.com.br
domain: growth
description: Each row of this table is a demand prospect conversion event (visit booked, offer submited or talk to agent) from both Rent and Sale busness contexts.
columns:
  sk_demand_prospect_conversion_event:
    description: 'Unique identifier for demand prospect conversion event'
  id_rent_flow:
    description: 'Identifier of a user flow with a house in rent context.'
    lineage:
    - datalake_demand_flows.demand_prospect_conversion_events_staging.id_rent_flow
  id_sale_flow:
    description: 'Identifier of a user flow with a house in sale context.'
    lineage:
    - datalake_demand_flows.demand_prospect_conversion_events_staging.id_sale_flow
  sk_event_type:
    description: 'Identifier of the event type'
    lineage:
    - datalake_demand_flows.demand_prospect_conversion_events_staging.sk_event_type
  event_name:
    description: 'Name of the demand prospect conversion event'
  id_booking:
    description: 'Id of the visit booking.'
    lineage:
    - datalake_demand_flows.demand_prospect_conversion_events_staging.id_booking
  id_offer:
    description: 'Id of the offer made from a prospect to a house owner.'
    lineage:
    - datalake_demand_flows.demand_prospect_conversion_events_staging.id_offer
  id_talk_to_agent:
    description: 'Synthetic id created to idendtify a TTA event.'
    lineage:
    - datalake_demand_flows.demand_prospect_conversion_events_staging.id_talk_to_agent
  id_house:
    description: 'ID of the property for which the conversion was registered'
    lineage:
    - datalake_demand_flows.demand_prospect_conversion_events_staging.id_house
  id_region:
    description: 'Id of the house region.'
    lineage:
    - datalake_demand_flows.demand_prospect_conversion_events_staging.id_region
  id_prospect:
    description: 'Id user of the prospect.'
    lineage:
    - datalake_demand_flows.demand_prospect_conversion_events_staging.id_prospect
  id_owner:
    description: 'Id user of the house owner'
    lineage:
    - datalake_demand_flows.demand_prospect_conversion_events_staging.id_owner
  id_agent:
    description: 'Id of the agent whose made the booking.'
    lineage:
    - datalake_demand_flows.demand_prospect_conversion_events_staging.id_agent
  business_context:
    description: 'Context in witch that conversion happened.'
    lineage:
    - datalake_demand_flows.demand_prospect_conversion_events_staging.business_context
  booking_creator:
    description: 'Person/team that scheduled the visit to the property.'
    lineage:
    - datalake_demand_flows.demand_prospect_conversion_events_staging.booking_creator
  product_origin:
    description: 'System where the booking was registered'
    lineage:
    - datalake_demand_flows.demand_prospect_conversion_events_staging.product_origin
  is_3p_demand:
    description: 'Flag to point if that booking was created by an Rede agent.'
    lineage:
    - datalake_demand_flows.demand_prospect_conversion_events_staging.id_3p_demand
  flg_via_reschedule:
    description: 'Flag to indicate whether the visit is a reschedule.'
    lineage:
    - datalake_demand_flows.demand_prospect_conversion_events_staging.flg_via_reschedule
  app_type:
    description: 'Application from which the user made the conversion event.'
    lineage:
    - datalake_demand_flows.demand_prospect_conversion_events_staging.app_type
  utm_medium:
    description: 'Marketing parameter that characterizes the campaign responsible for user conversion.'
    lineage:
    - datalake_demand_flows.demand_prospect_conversion_events_staging.utm_medium
  utm_source:
    description: 'Marketing parameter that characterizes the campaign responsible for user conversion.'
    lineage:
    - datalake_demand_flows.demand_prospect_conversion_events_staging.utm_source
  utm_campaign:
    description: 'Marketing parameter that characterizes the campaign responsible for user conversion.'
    lineage:
    - datalake_demand_flows.demand_prospect_conversion_events_staging.utm_campaign
  branded:
