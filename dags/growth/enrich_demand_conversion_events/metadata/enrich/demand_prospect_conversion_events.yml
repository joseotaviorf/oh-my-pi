    lineage:
    - datalake_demand_flows.demand_prospect_conversion_events_staging.branded
  country_code:
    description: 'Country code of the house.'
    lineage:
    - datalake_demand_flows.demand_prospect_conversion_events_staging.country_code
  dt_event:
    description: 'Date of the conversion event'
    lineage:
    - datalake_demand_flows.demand_prospect_conversion_events_staging.dt_event
  ts_event:
    description: 'Timestamp of the conversion event'
    lineage:
    - datalake_demand_flows.demand_prospect_conversion_events_staging.ts_event
  year:
