---
database_name: datalake_demand_flows
table_name: demand_prospect_conversion_events
owner: isabela.matsumoto@quintoandar.com.br
domain: growth
description: Each row of this table is a demand prospect conversion event (visit booked, offer submited or talk to agent) from both Rent and Sale busness contexts.
columns:
  id_demand_prospect_conversion_event:
    description: 'Unique identifier for demand prospect conversion event (FLOW). A flow is an booking/offer/talk to agent event made by a prospect to a specific house and business context.'
    lineage:
    - datalake_sale_demand_events.sale_demand_events.ts_event
    - datalake_rent_demand_events.rent_demand_events.ts_event
    - datalake_talk_to_agent.talk_to_agent.first_message_sent_ts
    - datalake_sale_demand_events.sale_demand_events.id_booking
    - datalake_rent_demand_events.rent_demand_events.id_booking
    - datalake_sale_demand_events.sale_demand_events.id_offer
    - datalake_rent_demand_events.rent_demand_events.id_offer
    - datalake_talk_to_agent.talk_to_agent.tenant_id
    - datalake_talk_to_agent.talk_to_agent.agent_id
    - datalake_talk_to_agent.talk_to_agent.sk_house_listing
    - datalake_talk_to_agent.talk_to_agent.first_message_sent_ts
    - datalake_sale_demand_events.sale_demand_events.id_buyer
    - datalake_rent_demand_events.rent_demand_events.id_tenant_prospect
    - datalake_talk_to_agent.talk_to_agent.tenant_id
    - datalake_sale_demand_events.sale_demand_events.id_house
    - datalake_rent_demand_events.rent_demand_events.id_house
    - datalake_talk_to_agent.talk_to_agent.house_id
  id_rent_flow:
    description: 'Identifier of a user flow with a house in rent context.'
    lineage:
    - datalake_rent_demand_events.rent_demand_events.id_rent_flow
    - datalake_talk_to_agent.talk_to_agent.tenant_id
    - datalake_talk_to_agent.talk_to_agent.house_id
  id_sale_flow:
    description: 'Identifier of a user flow with a house in sale context.'
    lineage:
    - datalake_sale_demand_events.sale_demand_events.id_sale_flow
    - datalake_talk_to_agent.talk_to_agent.id_sale_flow
  id_event_type:
    description: 'Identifier of the event type'
    lineage:
    - datalake_sale_demand_events.sale_demand_events.sk_event_type
    - datalake_rent_demand_events.rent_demand_events.id_event_type
  event_name:
    description: 'Name of the demand prospect conversion event'
  id_booking:
    description: 'Id of the visit booking.'
    lineage:
    - datalake_sale_demand_events.sale_demand_events.id_booking
    - datalake_rent_demand_events.rent_demand_events.id_booking
  id_offer:
