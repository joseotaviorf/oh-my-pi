---
database_name: datalake_demand_flows
table_name: prospect_results
owner: henrique.paulo@quintoandar.com.br
domain: Growth
description: This table contains records of demand prospect conversion events across Rent and Sale business contexts. Each record represents a specific action (booking a visit, submitting an offer, or initiating a talk to an agent) performed by a prospect. This table also adds ad hoc rules and the construction of id_media_setup.
columns:
  id_demand_prospect_conversion_event:
    description: "Unique identifier for demand prospect conversion event (FLOW). A flow is an booking/offer/talk to agent event made by a prospect to a specific house and business context."
    lineage:
      - datalake_demand_flows.demand_prospect_conversion_events.id_demand_prospect_conversion_event
  id_rent_flow:
    description: "Identifier of a user flow with a house in rent context."
    lineage:
      - datalake_demand_flows.demand_prospect_conversion_events.id_rent_flow
  id_sale_flow:
    description: "Identifier of a user flow with a house in sale context."
    lineage:
      - datalake_demand_flows.demand_prospect_conversion_events.id_sale_flow
  id_event_type:
    description: "Identifier of the event type"
    lineage:
      - datalake_demand_flows.demand_prospect_conversion_events.id_event_type
  event_name:
    description: "Name of the demand prospect conversion event"
  id_booking:
    description: "Id of the visit booking."
    lineage:
      - datalake_demand_flows.demand_prospect_conversion_events.id_booking
  id_visit:
    description: "Identifier of the executed visit tied to this prospect event, filled after a booking is confirmed and the visit takes place."
    lineage:
      - datalake_demand_flows.demand_prospect_conversion_events.id_visit
  id_offer:
    description: "Id of the offer made from a prospect to a house owner."
    lineage:
      - datalake_demand_flows.demand_prospect_conversion_events.id_offer
  id_talk_to_agent:
    description: "Synthetic id created to identify a TTA event."
    lineage:
      - datalake_demand_flows.demand_prospect_conversion_events.id_talk_to_agent
  id_house:
    description: "ID of the property for which the conversion was registered"
    lineage:
      - datalake_demand_flows.demand_prospect_conversion_events.id_house
  id_region:
    description: "Identifier of the geographic region of the listing involved in this prospect conversion or flow event."
    lineage:
      - datalake_demand_flows.demand_prospect_conversion_events.id_region
  id_prospect:
    description: "Id user of the prospect."
    lineage:
      - datalake_demand_flows.demand_prospect_conversion_events.id_prospect
  id_owner:
    description: "Id user of the house owner."
    lineage:
      - datalake_demand_flows.demand_prospect_conversion_events.id_owner
  id_agent:
    description: "Id of the agent whose made the booking."
    lineage:
      - datalake_demand_flows.demand_prospect_conversion_events.id_agent
  media_setup_from_adhoc:
    description: "Media setup string originating from ad hoc rules."
    lineage:
      - datalake_demand_flows.demand_prospect_conversion_events.product_origin
      - datalake_demand_flows.demand_prospect_conversion_events.utm_campaign
      - datalake_demand_flows.demand_prospect_conversion_events.utm_source
      - datalake_demand_flows.demand_prospect_conversion_events.utm_medium
      - datalake_demand_flows.demand_prospect_conversion_events.app_type
  media_setup_from_dictionary:
    description: "Media setup string originating from taxonomia dictionary."
    lineage:
      - datalake_growth_taxonomy.unified_taxonomy_dictionary.naming_convention_sufix
  media_setup_from_exception_flow:
    description: "Media setup string originating from exception flow gsheets."
    lineage:
      - datalake_gsheets_clean.taxonomy_demand_exception_flow.correct_utm_campaign
  media_setup_from_naming_convention:
    description: "Media setup string originating from naming convention extracted from utm_campaign."
    lineage:
      - datalake_demand_flows.demand_prospect_conversion_events.utm_campaign
  naming_convention_sufix:
    description: "The final media setup naming convention suffix for the conversion event, determined by a prioritization logic among the different sources (adhoc rule, exception flow, dictionary, naming convention)."
  naming_convention_sufix_origin:
    description: "Origin of the final media setup naming convention suffix, indicating the priority source from which it was extracted."
  utm_adhoc_rule:
    description: "Ad hoc rule applied based on utm parameters and app type to categorize the conversion event."
    lineage:
      - datalake_demand_flows.demand_prospect_conversion_events.utm_campaign
      - datalake_demand_flows.demand_prospect_conversion_events.utm_source
      - datalake_demand_flows.demand_prospect_conversion_events.utm_medium
      - datalake_demand_flows.demand_prospect_conversion_events.app_type
      - datalake_demand_flows.demand_prospect_conversion_events.product_origin
  business_context:
    description: "Context in which that conversion happened."
    lineage:
      - datalake_demand_flows.demand_prospect_conversion_events.business_context
  sale_type:
    description: Market type for sale-context prospect flow events, propagated from demand_prospect_conversion_events.
    lineage:
      - datalake_demand_flows.demand_prospect_conversion_events.sale_type
    categories:
      PRIMARY: New-build / primary market.
      SECONDARY: Resale / secondary market.
  booking_creator:
    description: "Person/team that scheduled the visit to the property."
    lineage:
      - datalake_demand_flows.demand_prospect_conversion_events.booking_creator
  product_origin:
    description: "System where the booking was registered"
    lineage:
      - datalake_demand_flows.demand_prospect_conversion_events.product_origin
  is_3p_demand:
    description: "Flag to point if that booking was created by an Rede agent."
    lineage:
      - datalake_demand_flows.demand_prospect_conversion_events.is_3p_demand
  is_1p_demand:
    description: "Flag indicating if the demand is from 1P (First Party) business model."
    lineage:
      - datalake_visit.visit_business_model.business_model
  is_cqa_demand:
    description: "Flag indicating if the demand is from CQA (Casa QuintoAndar) business model."
    lineage:
      - datalake_demand_flows.prospect_results.is_cqa_demand
  app_type:
    description: "Application from which the user made the conversion event."
    lineage:
      - datalake_demand_flows.demand_prospect_conversion_events.app_type
  utm_medium:
    description: "Marketing parameter that characterizes the campaign responsible for user conversion."
    lineage:
      - datalake_demand_flows.demand_prospect_conversion_events.utm_medium
  utm_source:
    description: "Marketing parameter that characterizes the campaign responsible for user conversion."
    lineage:
      - datalake_demand_flows.demand_prospect_conversion_events.utm_source
  utm_campaign:
    description: "Marketing parameter that characterizes the campaign responsible for user conversion."
    lineage:
      - datalake_demand_flows.demand_prospect_conversion_events.utm_campaign
  utm_term:
    description: "Marketing parameter that characterizes the campaign responsible for user conversion."
    lineage:
      - datalake_demand_flows.demand_prospect_conversion_events.utm_term
  utm_content:
    description: "Marketing parameter that characterizes the campaign responsible for user conversion."
    lineage:
      - datalake_demand_flows.demand_prospect_conversion_events.utm_content
  entrance_uri:
    description: "The URL of the first page a user visits in a session."
    lineage:
      - datalake_demand_flows.demand_prospect_conversion_events.entrance_uri
  operation_channel:
    description: "Physical agent, internal or external, who performed the conversion in the funnel stage under analysis"
    lineage:
      - datalake_demand_flows.demand_prospect_conversion_events.booking_creator
      - datalake_demand_flows.demand_prospect_conversion_events.id_booking
      - datalake_demand_flows.demand_prospect_conversion_events.product_origin
    categories:
      Concierge: "Conversions that originated from WhatsApp Concierge."
      Lost Tracking: "Conversions where booking creator information is missing but a booking exists."
      SelfService: "Conversions that took place without the aid of any operation being carried out by the Prospect itself at the time of conversion."
      Secretaria: "Conversions that are recorded by the Sales Secretariat"
      CX: "Conversions that are recorded by CX Operation"
      Agent: "Conversions that are recorded by the Agents operation"
      Other: "Conversions from other sources not categorized above."
  referral_type:
    description: "Grouping of results by type of user prospecting program/initiative. Program/Initiative: Program or initiative that has different types of partners."
    lineage:
      - datalake_demand_flows.demand_prospect_conversion_events.booking_creator
      - datalake_demand_flows.demand_prospect_conversion_events.is_3p_demand
      - datalake_demand_flows.demand_prospect_conversion_events.utm_medium
      - datalake_demand_flows.demand_prospect_conversion_events.id_agent
      - datalake_demand_flows.demand_prospect_conversion_events.business_context
    categories:
      TQC: "Conversions from TQC (Traz Quem Compra) referral program in sale, or when utm_medium is TQC without a rent context."
      TQC 1P: "QuintoAndar first-party Traz Quem Compra prospecting in sale."
      TQC 3P: "Third-party Traz Quem Compra prospecting in sale."
      TQA 1P: "QuintoAndar first-party Traz Quem Aluga prospecting in rent (same detection as TQC 1P, remapped by business_context)."
      TQA 3P: "Third-party Traz Quem Aluga prospecting in rent (same detection as TQC 3P, remapped by business_context)."
      Agent: "Conversions recorded by agents who are not part of TQC, TQA or Rede programs."
      Rede: "Real estate partners that prospect tenants and such prospecting is encouraged by Fifth Floor."
      NA: "This level of characterization is not applicable to the event/context."
  origin:
    description: "QuintoAndar application where the conversion was carried out in the funnel stage under analysis."
    lineage:
      - datalake_demand_flows.demand_prospect_conversion_events.product_origin
  platform:
    description: "Platform of the prospect device where the evaluated event took place. Possible values: Lost Tracking, App Android, App iOS, Web Desktop, Web Mobile, Other."
    lineage:
      - datalake_demand_flows.demand_prospect_conversion_events.app_type
  content_page:
    description: "Classification of content pages depending on the strategy adopted. Currently identifies 'guias' pages when entrance_uri contains '/guias/', otherwise NULL."
  ts_event:
    description: "Timestamp of the conversion event"
    lineage:
      - datalake_demand_flows.demand_prospect_conversion_events.ts_event
  year:
    description: "Year of the conversion event"
    lineage:
      - datalake_demand_flows.demand_prospect_conversion_events.year
  month:
    description: "Month of the conversion event"
    lineage:
      - datalake_demand_flows.demand_prospect_conversion_events.month
  day:
    description: "Day of the conversion event"
    lineage:
      - datalake_demand_flows.demand_prospect_conversion_events.day
