  layer: enrich
  default_extraction_type: incremental 
  default_partitions: ["year", "month", "day"]
  inner_dependencies:
    tenant_prospect_status:
    - demand_prospect_conversion_events
    buyer_prospect_status:
    - demand_prospect_conversion_events
cluster:
  type: databricks_10_4_min_io-memory_photon_cluster
