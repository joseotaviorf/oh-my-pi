---
raw_partition_cols: [account_snake_case, dt_created]
login_customer_id: "7524178457"
customer_filter: "NOT LIKE '%mineira%'"
report_type_mapping:
  ads_performance: AD_PERFORMANCE_REPORT
  campaigns_performance: CAMPAIGN_PERFORMANCE_REPORT
  keywords_performance: KEYWORDS_PERFORMANCE_REPORT
  videos_performance: VIDEO_PERFORMANCE_REPORT
  search_term_performance: SEARCH_TERM_PERFORMANCE_REPORT
  geo_target_constant: GEO_TARGET_CONSTANT
  campaigns_geo_performance: CAMPAIGN_GEOGRAPHIC_REPORT
  ad_group_geo_performance: AD_GROUP_GEOGRAPHIC_REPORT
GAQL:
  ads_performance: |
    SELECT
        customer.id,
        ad_group.id,
        ad_group.name,
        ad_group_ad.ad.type,
        campaign.id,
        campaign.name,
        metrics.clicks,
        metrics.cost_micros,
        metrics.conversions,
        segments.date,
        ad_group_ad.ad.legacy_responsive_display_ad.description,
        ad_group_ad.ad.expanded_text_ad.description,
        ad_group_ad.ad.text_ad.description1,
        ad_group_ad.ad.call_ad.description1,
        ad_group_ad.ad.text_ad.description2,
        ad_group_ad.ad.call_ad.description2,
        segments.device,
        ad_group_ad.ad.display_url,
        ad_group_ad.ad.id,
        metrics.impressions,
        ad_group_ad.ad.image_ad.name,
        customer.descriptive_name,
        segments.ad_network_type
    FROM ad_group_ad
    WHERE
        segments.date BETWEEN '{load_start_date}' AND '{load_end_date}'
  campaigns_performance: |
    SELECT
        customer.id,
        campaign.id,
        campaign.name,
        metrics.clicks,
        metrics.cost_micros,
        metrics.conversions,
        segments.date,
        segments.device,
        metrics.impressions,
        customer.descriptive_name,
        segments.month,
        campaign.labels,
        segments.week,
        segments.year,
        segments.ad_network_type
    FROM campaign
    WHERE
        segments.date BETWEEN '{load_start_date}' AND '{load_end_date}'
  keywords_performance: |
    SELECT
        customer.id,
        customer.descriptive_name,
        campaign.id,
        campaign.name,
        ad_group.id,
        ad_group.name,
        ad_group_criterion.criterion_id,
        ad_group_criterion.keyword.text,
        ad_group_criterion.keyword.match_type,
        segments.device,
        segments.date,
        metrics.impressions,
        metrics.clicks,
        metrics.cost_micros,
        metrics.conversions,
        segments.ad_network_type
    FROM keyword_view
    WHERE
        segments.date BETWEEN '{load_start_date}' AND '{load_end_date}'
        AND ad_group_criterion.negative = 'false'
  videos_performance: |
    SELECT
          customer.id,
          ad_group.id,
          ad_group.name,
          campaign.id,
          campaign.name,
          metrics.clicks,
          metrics.cost_micros,
          metrics.conversions,
          segments.date,
          segments.device,
          metrics.impressions,
          customer.descriptive_name,
          video.id,
          segments.ad_network_type
      FROM video
      WHERE
        segments.date BETWEEN '{load_start_date}' AND '{load_end_date}'
  search_term_performance: |
    SELECT
      customer.id,
      customer.descriptive_name,
      campaign.id,
      campaign.name,
      ad_group.id,
      ad_group.name,
      segments.device,
      segments.date,
      segments.ad_network_type,
      segments.keyword.info.text,
      search_term_view.search_term,
      search_term_view.resource_name,
      search_term_view.ad_group,
      search_term_view.status,
      metrics.impressions,
      metrics.clicks,
      metrics.cost_micros,
      metrics.conversions,
      metrics.interactions,
      metrics.interaction_event_types
    FROM search_term_view
    WHERE
        segments.date BETWEEN '{load_start_date}' AND '{load_end_date}'
  geo_target_constant: |
    SELECT
      geo_target_constant.id, 
      geo_target_constant.name,
      geo_target_constant.country_code, 
      geo_target_constant.canonical_name, 
      geo_target_constant.parent_geo_target, 
      geo_target_constant.resource_name, 
      geo_target_constant.status, 
      geo_target_constant.target_type 
    FROM 
      geo_target_constant
  campaigns_geo_performance: |
    SELECT
      customer.id,
      customer.descriptive_name,
      campaign.id,
      campaign.name,
      campaign.labels,
      metrics.clicks,
      metrics.cost_micros,
      metrics.impressions,
      segments.device,
      segments.ad_network_type,
      segments.geo_target_city,
      segments.geo_target_region,
      segments.date,
      segments.month,
      segments.week,
      segments.year
    FROM 
      geographic_view
    WHERE
      segments.date BETWEEN '{load_start_date}' AND '{load_end_date}'
  ad_group_geo_performance: |
    SELECT
      customer.id,
      customer.descriptive_name,
      campaign.id,
      campaign.name,
      campaign.labels,
      ad_group.id,
      ad_group.name,
      metrics.clicks,
      metrics.cost_micros,
      metrics.impressions,
      segments.device,
      segments.ad_network_type,
      segments.geo_target_city,
      segments.geo_target_region,
      segments.date,
      segments.month,
      segments.week,
      segments.year
    FROM 
      geographic_view
    WHERE
      segments.date BETWEEN '{load_start_date}' AND '{load_end_date}'
schema:
  ads_performance: |
    customer STRUCT<
      id: STRING,
      descriptiveName: STRING
    >,
    adGroup STRUCT<
      id: STRING,
      name: STRING
    >,
    campaign STRUCT<
      id: STRING,
      name: STRING
    >,
    segments STRUCT<
      date: STRING,
      device: STRING,
      adNetworkType: STRING
    >,
    adGroupAd STRUCT<
      ad STRUCT<
        legacyResponsiveDisplayAd STRUCT<
          description: STRING
        >,
        expandedTextAd STRUCT<
          description: STRING
        >,
        textAd STRUCT<
          description1: STRING
        >,
        callAd STRUCT<
          description1: STRING
        >,
        textAd STRUCT<
          description2: STRING
        >,
        callAd STRUCT<
          description2: STRING
        >,
        displayUrl: STRING,
        id: STRING,
        imageAd STRUCT<
          name: STRING
        >,
        type: STRING
      >
    >,
    metrics STRUCT<
      impressions: STRING,
      clicks: STRING,
      cost_micros: STRING
    >
