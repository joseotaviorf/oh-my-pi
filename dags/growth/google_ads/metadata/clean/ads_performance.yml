---
database_name: datalake_google_ads_clean
table_name: ads_performance
owner: henrique.paulo@quintoandar.com.br
domain: Growth
description: Table load Ads Performance Report from Google Ads API extraction. Documentation can be found at https://developers.google.com/google-ads/api/reference/rpc/v13/overview
columns:
  id_ad:
    description: Google Ads ad resource ID from the ad performance report.
    lineage:
      - datalake_google_ads_raw.ads_performance.adGroupAd
  id_external_customer:
    description: Google Ads customer account ID from the API performance report.
    lineage:
      - datalake_google_ads_raw.ads_performance.customer
  id_ad_group:
    description: Google Ads ad group resource ID from the performance report.
    lineage:
      - datalake_google_ads_raw.ads_performance.adGroup
  id_campaign:
    description: Google Ads campaign resource ID from the performance report.
    lineage:
      - datalake_google_ads_raw.ads_performance.campaign
  ad_group_name:
    description: Human-readable ad group name from the Google Ads report.
    lineage:
      - datalake_google_ads_raw.ads_performance.adGroup
  ad_type:
    description: Google Ads ad type classification from the performance report.
    lineage:
      - datalake_google_ads_raw.ads_performance.adGroupAd
  campaign_name:
    description: Campagin name from google ads platform where metrics should be attributed
    lineage:
      - datalake_google_ads_raw.ads_performance.campaign
  clicks:
    description: Number of clicks from google ads platform
    lineage:
      - datalake_google_ads_raw.ads_performance.metrics
  cost:
    description: Cost from google ads platform
    lineage:
      - datalake_google_ads_raw.ads_performance.metrics
  description:
    description: Details pertaining to an expanded text ad.
    lineage:
      - datalake_google_ads_raw.ads_performance.adGroupAd
  device:
    description: Device to which metrics apply
    lineage:
      - datalake_google_ads_raw.ads_performance.segments
  ad_network_type:
    description: Google Ads network type (Search, Display, YouTube, etc.) for the metric row.
    lineage:
      - datalake_google_ads_raw.ads_performance.segments
  impressions:
    description: Number of impressions from google ads platform
    lineage:
      - datalake_google_ads_raw.ads_performance.metrics
  account_descriptive_name:
    description: Optional, non-unique descriptive name of the customer.
    lineage:
      - datalake_google_ads_raw.ads_performance.customer
  report_type:
    description: Type of report extracted from Google API.
    lineage:
      - datalake_google_ads_raw.ads_performance.report_type
    categories:
      AD_PERFORMANCE_REPORT: Ads report type
      VIDEO_PERFORMANCE_REPORT: Video report type
      CAMPAIGN_PERFORMANCE_REPORT: Campaign report type
      KEYWORDS_PERFORMANCE_REPORT: Keywords report type
  account_snake_case:
    description: Account name pos string transformation
    lineage:
      - datalake_google_ads_raw.ads_performance.account_snake_case
  country_code:
    description: Country code the account belongs to.
    lineage:
      - datalake_google_ads_raw.ads_performance.account_snake_case
  conversions:
    description: Number of conversions from google ads platform
    lineage:
      - datalake_google_ads_raw.ads_performance.metrics
  dt_loaded:
    description: Load date when the Google Ads report row was ingested into the datalake.
    lineage:
      - datalake_google_ads_raw.ads_performance.segments
  dt_created:
    description: Date of creation of each raw
    lineage:
      - datalake_google_ads_raw.ads_performance.dt_created
