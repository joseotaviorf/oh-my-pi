---
database_name: dw_growth
table_name: obt_supply
owner: gabriel.salla@quintoandar.com
domain: Growth
description: |
  One-big-table view of supply funnel events with denormalized dimensions,
  discard history, affiliate classification, PP Multi flags, and planning
  clusters used in Growth supply reporting.
columns:
  date:
    description: Calendar date of the supply event, joined from dim_date on the fact event date key.
    lineage:
      - dw_public.dim_date.date
      - dw_growth.fact_supply_events.sk_date
  week_start:
    description: First day of the week containing the supply event date.
    lineage:
      - dw_public.dim_date.week_start
      - dw_growth.fact_supply_events.sk_date
  month_start:
    description: First day of the month containing the supply event date.
    lineage:
      - dw_public.dim_date.month_start
      - dw_growth.fact_supply_events.sk_date
  year_month:
    description: Year and month of the supply event formatted as YYYY-MM for monthly aggregations.
    lineage:
      - dw_public.dim_date.year_month
      - dw_growth.fact_supply_events.sk_date
  sk_date:
    description: Date surrogate key of the supply event for joining to dim_date.
    lineage:
      - dw_growth.fact_supply_events.sk_date
  city_group:
    description: Geographic city group of the lead or house region linked to the supply event.
    lineage:
      - dw_public.dim_region.city_group
      - dw_growth.fact_supply_events.sk_region
  city_name:
    description: Name of the city where the lead or house associated with the supply event is located.
    lineage:
      - dw_public.dim_region.city_name
      - dw_growth.fact_supply_events.sk_region
  neighborhood:
    description: Neighborhood or locality of the lead or house region linked to the supply event.
    lineage:
      - dw_public.dim_region.name
      - dw_growth.fact_supply_events.sk_region
  country_code:
    description: ISO country code of the region linked to the supply event.
    lineage:
      - dw_public.dim_region.country_code
      - dw_growth.fact_supply_events.sk_region
  id_country:
    description: Identifier of the country where the supply event region is located.
    lineage:
      - dw_public.dim_region.id_country
      - dw_growth.fact_supply_events.sk_region
  sk_lead:
    description: Surrogate key of the lead in EBDB associated with the supply event.
    lineage:
      - dw_growth.fact_supply_events.sk_lead
  sk_house:
    description: Surrogate key of the house listing associated with the supply event, when applicable.
    lineage:
      - dw_growth.fact_supply_events.sk_house
  sk_region:
    description: Surrogate key of the geographic region linked to the lead or house in the supply event.
    lineage:
      - dw_growth.fact_supply_events.sk_region
  sk_funnel_step:
    description: Surrogate key of the funnel step and business event reached in the supply flow.
    lineage:
      - dw_growth.fact_supply_events.sk_funnel_step
  sk_user_affiliate:
    description: Surrogate key of the affiliate user who referred the lead in the supply event.
    lineage:
      - dw_growth.fact_supply_events.sk_user_affiliate
  sk_user_conversion:
    description: Surrogate key of the user credited with converting the lead in the supply event.
    lineage:
      - dw_growth.fact_supply_events.sk_user_conversion
  sk_user_registrant:
    description: Surrogate key of the user who registered the supply event in the product.
    lineage:
      - dw_growth.fact_supply_events.sk_user_registrant
  sk_owner:
    description: Surrogate key of the house owner linked to the listing in the supply event.
    lineage:
      - dw_growth.fact_supply_events.sk_owner
  nm_business_context:
    description: Business context of the supply event, indicating whether the flow is for rent or for sale.
    lineage:
      - dw_growth.fact_supply_events.nm_business_context
  nm_supply_source:
    description: Origin channel of the supply record, such as first-party (1P), third-party (3P), or CIQ.
    lineage:
      - dw_growth.fact_supply_events.nm_supply_source
  nm_source:
    description: UTM source parameter captured for the marketing channel of the supply event.
    lineage:
      - dw_growth.fact_supply_events.utm_source
  nm_medium:
    description: UTM medium parameter captured for the marketing touchpoint of the supply event.
    lineage:
      - dw_growth.fact_supply_events.utm_medium
  nm_campaign:
    description: UTM campaign parameter associated with the marketing campaign of the supply event.
    lineage:
      - dw_growth.fact_supply_events.utm_campaign
  nm_content:
    description: UTM content parameter associated with the ad creative of the supply event.
    lineage:
      - dw_growth.fact_supply_events.utm_content
  nm_term:
    description: UTM term parameter associated with the paid keyword or ad group of the supply event.
    lineage:
      - dw_growth.fact_supply_events.utm_term
  nm_detailed_route:
    description: Product route and A/B experiment path the lead followed before triggering listing creation.
    lineage:
      - dw_growth.fact_supply_events.nm_detailed_route
  sk_task:
    description: Identifier of the lead creation task associated with the supply event.
    lineage:
      - dw_growth.fact_supply_events.sk_task
  sk_chat_session:
    description: Identifier of the Sauron chat session in which the lead was created.
    lineage:
      - dw_growth.fact_supply_events.sk_chat_session
  quinto_andar_phone_number:
    description: QuintoAndar phone number the client used when the lead was created through inbound contact.
    lineage:
      - dw_growth.fact_supply_events.quinto_andar_phone_number
  tp_lead:
    description: Acquisition lead type classifying the supply record by origin and characteristics.
    lineage:
      - dw_growth.dim_acquisition_lead.tp_lead
  cd_funnel_step:
    description: Code of the supply funnel step reached in the event, such as lead, prospect, or opportunity.
    lineage:
      - dw_growth.dim_funnel_step.cd_funnel_step
  tp_business_event:
    description: Type of business event at the funnel step, such as advance or drop.
    lineage:
      - dw_growth.dim_funnel_step.tp_business_event
  business_event:
    description: Combined label of business event type and intermediate funnel step code for the supply event.
    lineage:
      - dw_growth.dim_funnel_step.tp_business_event
      - dw_growth.dim_funnel_step.cd_funnel_inter_step
  campaign_strategy_intent:
    description: Strategic intent of the media setup campaign matched to the supply event UTM taxonomy.
    lineage:
      - dw_growth.dim_media_setup.campaign_strategy_intent
  campaign_business_context:
    description: Business context targeted by the media setup campaign linked to the supply event.
    lineage:
      - dw_growth.dim_media_setup.campaign_business_context
  campaign_landing_page:
    description: Landing page defined in the media setup taxonomy for the campaign of the supply event.
    lineage:
      - dw_growth.dim_media_setup.campaign_landing_page
  source:
    description: Normalized marketing source from the media setup taxonomy linked to the supply event.
    lineage:
      - dw_growth.dim_media_setup.source
  medium:
    description: Normalized marketing medium from the media setup taxonomy linked to the supply event.
    lineage:
      - dw_growth.dim_media_setup.medium
  behavior_type:
    description: Organic or non-organic behavior classification from the media setup taxonomy.
    lineage:
      - dw_growth.dim_media_setup.behavior_type
  funnel_side:
    description: Marketing funnel side from the media setup taxonomy, such as supply or demand.
    lineage:
      - dw_growth.dim_media_setup.funnel_side
  cd_discard_reason:
    description: Code of the discard reason when the lead or house dropped at a funnel step.
    lineage:
      - dw_growth.dim_supply_discards.cd_discard_reason
  ds_discard_reason:
    description: Descriptive label of the discard reason for the most recent drop event in the supply journey.
    lineage:
      - dw_growth.dim_supply_discards.ds_discard_reason
  discard_funnel_step:
    description: Funnel step code at which the most recent discard event occurred for the supply journey.
    lineage:
      - dw_growth.dim_supply_discards.cd_funnel_step
  discard_agent:
    description: Operations agent associated with the most recent discard event for the supply journey.
    lineage:
      - dw_growth.dim_supply_operation_flow.nm_agent
  discard_partner:
    description: Operations partner associated with the most recent discard event for the supply journey.
    lineage:
      - dw_growth.dim_supply_operation_flow.nm_partner
  discard_assigned_partner:
    description: Assigned operations partner at the most recent discard event for the supply journey.
    lineage:
      - dw_growth.dim_supply_operation_flow.nm_assigned_partner
  discard_opp_user:
    description: Surrogate key of the conversion user recorded at the most recent discard event.
    lineage:
      - dw_growth.fact_supply_events.sk_user_conversion
  discard_date:
    description: Calendar date of the most recent discard event for the supply journey.
    lineage:
      - dw_public.dim_date.date
      - dw_growth.fact_supply_events.sk_date
  discard_year_month:
    description: Year and month of the most recent discard event for the supply journey.
    lineage:
      - dw_public.dim_date.year_month
      - dw_growth.fact_supply_events.sk_date
  ds_objective:
    description: Operations objective assigned to the supply event handling flow.
    lineage:
      - dw_growth.dim_supply_operation_flow.ds_objective
  nm_agent:
    description: Operations team or channel responsible for handling the supply event.
    lineage:
      - dw_growth.dim_supply_operation_flow.nm_agent
  nm_partner:
    description: Operations partner company assigned to handle the supply event.
    lineage:
      - dw_growth.dim_supply_operation_flow.nm_partner
  nm_assigned_partner:
    description: Partner company designated to receive the lead for outbound or dialer workflows.
    lineage:
      - dw_growth.dim_supply_operation_flow.nm_assigned_partner
  cd_contact_medium:
    description: Code of the contact medium used in the operations flow for the supply event.
    lineage:
      - dw_growth.dim_supply_operation_flow.cd_contact_medium
  cd_approach:
    description: Code of the operations approach applied when handling the supply event.
    lineage:
      - dw_growth.dim_supply_operation_flow.cd_approach
  tp_reprocessing:
    description: Type of manual reprocessing or recovery flow applied to the supply event, when applicable.
    lineage:
      - dw_growth.dim_supply_recovery_flow.tp_reprocessing
  nm_mailing_table:
    description: Name of the mailing table used in the recovery or reprocessing flow for the supply event.
    lineage:
      - dw_growth.dim_supply_recovery_flow.nm_mailing_table
  tp_origin_acquisition:
    description: PWA or channel origin where the lead was acquired at acquisition user path level 1.
    lineage:
      - dw_growth.dim_supply_user_path.tp_origin
  tp_origin_conversion:
    description: PWA or channel origin where the conversion occurred in the supply user path.
    lineage:
      - dw_growth.dim_supply_user_path.tp_origin
  full_tp_origin_conversion:
    description: Last conversion origin across all user path levels for the supply journey within the same context.
    lineage:
      - dw_growth.dim_supply_user_path.tp_origin
      - dw_growth.dim_supply_user_path.id_level
  affiliate_type_adjusted:
    description: Affiliate type normalized for reporting, applying partner overrides and doorman post-2023 rules.
    lineage:
      - dw_growth.dim_affiliate_tracking.affiliate_type
      - dw_growth.fact_supply_events.sk_user_affiliate
      - dw_public.dim_date.sk_date
  conversion_origin:
    description: Reporting bucket for how the lead converted, derived from conversion path and operations agent.
    lineage:
      - dw_growth.dim_supply_user_path.tp_origin
      - dw_growth.dim_supply_operation_flow.nm_agent
  acquisition_origin:
    description: Reporting bucket for how the lead was acquired, derived from supply source and acquisition path.
    lineage:
      - dw_growth.fact_supply_events.nm_supply_source
      - dw_growth.fact_supply_events.sk_user_affiliate
      - dw_growth.dim_supply_user_path.tp_origin
  operation_channel:
    description: Operational channel that handled the supply event, such as inbound, CIQ, or account manager.
    lineage:
      - dw_growth.dim_supply_user_path.tp_origin
      - dw_growth.dim_supply_operation_flow.nm_agent
  funnel_order:
    description: Numeric order of the funnel step in the supply journey, from lead through first listing.
    lineage:
      - dw_growth.dim_funnel_step.cd_funnel_step
  is_hybrid_listing:
    description: Indicates whether the house listing spans more than one business context at the same funnel step.
    lineage:
      - dw_growth.fact_supply_events.sk_house
      - dw_growth.fact_supply_events.nm_business_context
      - dw_growth.dim_funnel_step.cd_funnel_step
  is_converted_by_ciq:
    description: Indicates whether the user who converted the supply event is registered as a CIQ agent.
    lineage:
      - dw_growth.fact_supply_events.sk_user_conversion
      - datalake_ebdb_agents.ciq_users.id_user
  sk_supply:
    description: Surrogate key that uniquely identifies the supply event in the fact table.
    lineage:
      - dw_growth.fact_supply_events.sk_supply
  affiliate_campaign:
    description: Campaign name assigned to the affiliate in the Growth taxonomy classification.
    lineage:
      - datalake_growth_taxonomy.affiliates_classification.affiliate_campaign
  affiliate_objective:
    description: Objective or target defined for the affiliate campaign in the Growth taxonomy.
    lineage:
      - datalake_growth_taxonomy.affiliates_classification.affiliate_objective
  pp_multi_conversion_flag:
    description: Indicates whether the owner had an active PP Multi conversion flag on the event date for rent flows.
    lineage:
      - datalake_pro_owners.daily_owner_houses_quantity_history.is_pp_multi_active
      - dw_growth.fact_supply_events.sk_owner
  is_pp_multi_active:
    description: Indicates whether the owner was classified as active in PP Multi segmentation on the event date.
    lineage:
      - datalake_pp_multi.pp_multi_classification_history.pp_multi_classification
      - dw_growth.fact_supply_events.sk_owner
  company_report_origin:
    description: Company reporting channel assigned to the supply event based on funnel stage, origins, and media setup.
    lineage:
      - dw_growth.dim_funnel_step.cd_funnel_step
      - dw_growth.dim_media_setup.medium
      - dw_growth.dim_media_setup.source
      - dw_growth.dim_media_setup.behavior_type
      - dw_growth.dim_supply_recovery_flow.tp_reprocessing
      - dw_growth.fact_supply_events.nm_business_context
  full_conversion_origin:
    description: Last conversion origin reached across all funnel steps for the supply journey in the same context.
    lineage:
      - dw_growth.dim_supply_user_path.tp_origin
      - dw_growth.dim_supply_operation_flow.nm_agent
      - dw_growth.dim_funnel_step.cd_funnel_step
  full_operation_channel:
    description: Last operational channel applied across all funnel steps for the supply journey in the same context.
    lineage:
      - dw_growth.dim_supply_user_path.tp_origin
      - dw_growth.dim_supply_operation_flow.nm_agent
      - dw_growth.dim_funnel_step.cd_funnel_step
  status:
    description: Lead lifecycle status at the funnel step, such as new lead, prospecting started, converted, or discarded.
    lineage:
      - dw_growth.fact_supply_events.sk_funnel_step
      - dw_growth.fact_supply_events.sk_supply
      - dw_growth.fact_supply_events.sk_lead
  planning_cluster:
    description: Planning cluster derived from company report origin with affiliate volumetry and paid media splits.
    lineage:
      - dw_growth.dim_media_setup.medium
      - dw_growth.dim_media_setup.source
      - dw_growth.dim_media_setup.behavior_type
      - dw_datamarts.affiliates_clusters.affiliate_volumetry
      - datalake_gsheets_clean.affiliate_volumetry_cluster.affiliate_volumetry
  planning_operation:
    description: Planning operation channel derived from full conversion and acquisition origins and reprocessing type.
    lineage:
      - dw_growth.dim_supply_recovery_flow.tp_reprocessing
      - dw_growth.dim_supply_operation_flow.nm_assigned_partner
      - dw_growth.dim_supply_user_path.tp_origin
      - dw_growth.dim_supply_operation_flow.nm_agent
  planning_conversion_cluster:
    description: Planning conversion priority cluster derived from company report origin and affiliate volumetry tier.
    lineage:
      - dw_datamarts.affiliates_clusters.affiliate_volumetry
      - datalake_gsheets_clean.affiliate_volumetry_cluster.affiliate_volumetry
  planning_conversion:
    description: Planning conversion channel derived from full conversion origin, operation channel, and reprocessing.
    lineage:
      - dw_growth.dim_supply_recovery_flow.tp_reprocessing
      - dw_growth.dim_supply_operation_flow.nm_assigned_partner
      - dw_growth.dim_supply_user_path.tp_origin
      - dw_growth.dim_supply_operation_flow.nm_agent
  ts_load:
    description: Timestamp when the row was loaded into the data warehouse.
