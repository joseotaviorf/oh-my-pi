---
database_name: dw_growth
table_name: fact_supply_events
owner: gabriel.salla@quintoandar.com
domain: Growth
description: |
  This table contains the events related to the supply flow, each row is an event
  in the funnel step for one business context in Supply Flow.
columns:
  sk_supply:
    lineage:
      - datalake_supply_flows.supply_events_tracking.sk_supply_lead
      - datalake_supply_flows.supply_events_tracking.id_house
    description: Unique primary key that identifies each supply event.
  nm_business_context:
    lineage:
      - datalake_supply_flows.supply_events_tracking.business_context
    description: Business context associated with the supply event.
  nm_supply_source:
    lineage:
      - datalake_supply_flows.supply_events_tracking.supply_source
    description: Supply source associated with the event.
  sk_supply_lead:
    lineage:
      - datalake_supply_flows.supply_events_tracking.sk_supply_lead
    description: Key from the dw_growth.dim_lead dimension associated with the supply.
  sk_lead:
    lineage:
      - datalake_supply_flows.supply_events_tracking.id_lead_ebdb
    description: Key from the dw_growth.dim_lead dimension associated with the supply event.
  sk_region:
    lineage:
      - datalake_supply_flows.supply_events_tracking.id_region
    description: Key from the dw_growth.dim_region dimension associated with the supply event.
  sk_house:
    lineage:
      - datalake_supply_flows.supply_events_tracking.id_house
    description: Key from the dw_growth.dim_house dimension associated with the supply event.
  sk_user_registrant:
    lineage:
      - datalake_supply_flows.supply_events_tracking.id_user_registrant
    description: Key from the dw_growth.dim_user dimension associated with the user who registered the supply event.
  sk_user_conversion:
    lineage:
      - datalake_supply_flows.supply_events_tracking.id_user_conversion
    description: Key from the dw_growth.dim_user dimension associated with the conversion user of the supply event.
  sk_lead_3p:
    lineage:
      - datalake_supply_flows.supply_events_tracking.id_lead
    description: Key from the dw_growth.dim_lead dimension associated with third-party supply (if `supply_source` is '3P').
  sk_funnel_step:
    lineage:
      - datalake_supply_flows.supply_events_tracking.funnel_step
      - datalake_supply_flows.supply_events_tracking.business_event
    description: Concatenation of `funnel_step` and `business_event` in lowercase.
  sk_discard:
    lineage:
      - datalake_supply_flows.supply_events_tracking.funnel_step
      - datalake_supply_flows.supply_events_tracking.drop_step_reason
    description: Concatenation of `funnel_step` and `drop_step_reason` in lowercase.
  sk_ops:
    lineage:
      - datalake_supply_flows.supply_events_tracking.ops_objective
      - datalake_supply_flows.supply_events_tracking.ops_agent
      - datalake_supply_flows.supply_events_tracking.ops_partner
      - datalake_supply_flows.supply_events_tracking.ops_contact_medium
      - datalake_supply_flows.supply_events_tracking.ops_approach
      - datalake_supply_flows.supply_events_tracking.ops_assigned
    description: Concatenation of various columns related to operations.
  sk_recovery:
    lineage:
      - datalake_supply_flows.supply_events_tracking.reprocessed
      - datalake_supply_flows.supply_events_tracking.reprocessing_entity_type
      - datalake_supply_flows.supply_events_tracking.reprocessing_table_name
    description: Concatenation of various columns related to recovery.
  sk_conversion_user_path:
    lineage:
      - datalake_supply_flows.supply_events_tracking.application
      - datalake_supply_flows.supply_events_tracking.lead_application
      - datalake_supply_flows.supply_events_tracking.platform
    description: Surrogate key for the conversion user path dimension.
  sk_acquisition_user_path:
    lineage:
      - datalake_supply_flows.supply_events_tracking.lead_application
      - datalake_supply_flows.supply_events_tracking.platform
    description: Surrogate key for the acquisition user path dimension.
  sk_user_affiliate:
    lineage:
      - datalake_supply_flows.supply_events_tracking.id_referred_by
    description: Key from the dw_growth.dim_user dimension associated with the affiliate user of the supply event.
  sk_acquisition_lead:
    lineage:
      - datalake_supply_flows.supply_events_tracking.sk_supply_lead
      - datalake_supply_flows.supply_events_tracking.supply_source
      - datalake_supply_flows.supply_events_tracking.business_context
    description: Concatenation of various columns related to the acquisition of the supply event lead.
  sk_date:
    lineage:
      - datalake_supply_flows.supply_events_tracking.ts_event_adjusted
    description: Key from the dw_growth.dim_date dimension associated with the event date.
  ts_event_original:
    lineage:
      - datalake_supply_flows.supply_events_tracking.ts_event_original
    description: Original timestamp of the supply event.
  ts_event:
    lineage:
      - datalake_supply_flows.supply_events_tracking.ts_event_adjusted
    description: Adjusted timestamp of the supply event.
  sk_media_setup:
    lineage:
      - datalake_supply_flows.dict_taxonomy.id_media_setup
    description: Key from the dw_growth.dim_media_setup dimension associated with the media setup.
  sk_owner:
    lineage:
      - datalake_ebdb_listing.house.id_user
    description: Surrogate key for the owner of the house associated with the supply event.
  nm_media_setup:
    lineage:
      - datalake_growth_taxonomy.media_setup.naming_convention_sufix
    description: Media setup naming convention suffix derived from campaign taxonomy rules.
  tp_flow_media_setup:
    lineage:
      - datalake_supply_flows.supply_events_tracking.campaign
      - datalake_gsheets_clean.taxonomy_demand_exception_flow.utm_campaign
      - datalake_growth_taxonomy.unified_taxonomy_dictionary.utm_campaign
    description: Rule used to derive the media setup suffix for the supply event.
  utm_medium:
    lineage:
      - datalake_supply_flows.supply_events_tracking.medium
    description: UTM medium captured for the supply event.
  utm_source:
    lineage:
      - datalake_supply_flows.supply_events_tracking.source
    description: UTM source captured for the supply event.
  utm_campaign:
    lineage:
      - datalake_supply_flows.supply_events_tracking.campaign
    description: UTM campaign captured for the supply event.
  utm_term:
    lineage:
      - datalake_supply_flows.supply_events_tracking.term
    description: UTM term captured for the supply event.
  utm_content:
    lineage:
      - datalake_supply_flows.supply_events_tracking.content
    description: UTM content captured for the supply event.
  ts_first_event_date:
    lineage:
      - datalake_supply_flows.supply_events_tracking.ts_event_adjusted
    description: Timestamp of the first supply event for the lead and business context.
  ts_load:
    description: Timestamp when the fact row was loaded into the data warehouse.
  nm_detailed_route:
    description: The concatenation of the path a lead used to reach the landing page where the creation process was triggered in the Product, and the associated experiment (A/B test) the lead was allocated to, if applicable. This can also be found in Amplitude events through the from_route and exp event properties. The hyphen (-) character separates both parameters.
    lineage:
      - datalake_supply_flows.supply_events_tracking.detailed_route
  sk_task:
    description: The ID for the lead creation task.
    lineage:
      - datalake_supply_flows.supply_events_tracking.id_task
  sk_chat_session:
    description: The ID for the lead creation session in Sauron.
    lineage:
      - datalake_supply_flows.supply_events_tracking.id_chat_session
  quinto_andar_phone_number:
    description: QuintoAndar phone number the client used to get in touch and have their lead created.
    lineage:
      - datalake_supply_flows.supply_events_tracking.quinto_andar_phone_number
