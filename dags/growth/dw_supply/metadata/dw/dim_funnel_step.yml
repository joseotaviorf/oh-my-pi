---
database_name: dw_growth
table_name: dim_funnel_step
owner: gabriel.salla@quintoandar.com
domain: Growth
description: |
  Kimball dimension defining supply funnel steps and their business event classifications, used to label each event in the acquisition and conversion flows. Z-ordered by sk_funnel_step and bk_funnel_step for query performance.
columns:
  bk_funnel_step:
    lineage:
      - datalake_supply_flows.supply_events_tracking.funnel_step
      - datalake_supply_flows.supply_events_tracking.business_event
    description: Concatenation of `funnel_step` and `business_event` in lowercase.
  cd_funnel_step:
    lineage:
      - datalake_supply_flows.supply_events_tracking.funnel_step
    description: Code for the funnel step.
  tp_business_event:
    lineage:
      - datalake_supply_flows.supply_events_tracking.business_event
    description: Type of business event extracted from the `business_event` column.
  cd_funnel_inter_step:
    lineage:
      - datalake_supply_flows.supply_events_tracking.business_event
    description: Code for the intermediate step within the funnel.
  ds_funnel_step:
    description: Descriptive label for the funnel step.
  ts_updated:
    description: Timestamp indicating when the record was last updated.
