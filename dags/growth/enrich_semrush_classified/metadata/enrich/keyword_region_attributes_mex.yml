database_name: datalake_semrush_classified
table_name: keyword_region_attributes_mex
owner: caio.francisco@quintoandar.com.br
domain: Growth
description: |
  Enriched SEMrush classified-listings competitor keywords (keyword_region_attributes_mex) for LATAM SEO reporting. Partitioned by year and month.
columns:
  keyword:
    description: "Original search keyword as provided by Semrush for the given player and URL."
    lineage:
      - datalake_semrush_classified.keywords_from_players.keyword
  keyword_clean:
    description: "Keyword normalized to lowercase, accents removed, and non‑alphanumeric characters stripped (spaces kept)."
    lineage:
      - datalake_semrush_classified.keywords_from_players.keyword_clean
  url:
    description: "Landing page URL that ranks for the keyword for the respective player."
    lineage:
      - datalake_semrush_classified.keywords_from_players.url
  match_city:
    description: City name inferred from the cleaned keyword using Mexican cities reference.
    lineage:
      - datalake_gsheet_clean.mexico_regions.city_clean
      - datalake_semrush_classified.keywords_from_players.keyword_clean
  match_zone:
    description: Zone name inferred from the cleaned keyword using Mexican cities reference.
    lineage:
      - datalake_gsheet_clean.mexico_regions.zone_clean
      - datalake_semrush_classified.keywords_from_players.keyword_clean
  player:
    description: "Source classified site from which the keyword ranking was extracted."
    lineage:
      - datalake_semrush_classified.keywords_from_players.player
  trends:
    description: "Monthly trend values from SEMrush with brackets removed; comma‑separated list representing the last 12 months."
    lineage:
      - datalake_semrush_classified.keywords_from_players.trends
  position:
    description: "Current organic position of the URL for the keyword (1-based)."
    lineage:
      - datalake_semrush_classified.keywords_from_players.position
  previous_position:
    description: "Previous organic position of the URL for the keyword as reported by SEMrush."
    lineage:
      - datalake_semrush_classified.keywords_from_players.previous_position
  position_difference:
    description: "Difference between current and previous positions (positive if improved)."
    lineage:
      - datalake_semrush_classified.keywords_from_players.position_difference
  keyword_intents:
    description: "Keyword intent(s) mapped to human‑readable labels and lowercased. Multiple intents are comma‑separated."
    lineage:
      - datalake_semrush_classified.keywords_from_players.keyword_intents
  position_type:
    description: "SEMrush position type classification for the ranking (e.g., organic variations)."
    lineage:
      - datalake_semrush_classified.keywords_from_players.position_type
  serp_features_by_position:
    description: "SERP features present among the results positions, mapped to readable labels and lowercased; comma‑separated."
    lineage:
      - datalake_semrush_classified.keywords_from_players.serp_features_by_position
  serp_features_by_keyword:
    description: "SERP features associated with the keyword overall, mapped to readable labels and lowercased; comma‑separated."
    lineage:
      - datalake_semrush_classified.keywords_from_players.serp_features_by_keyword
  search_volume:
    description: "Average monthly search volume for the keyword according to SEMrush."
    lineage:
      - datalake_semrush_classified.keywords_from_players.search_volume
  cpc:
    description: "Estimated cost per click (CPC) for the keyword from SEMrush."
    lineage:
      - datalake_semrush_classified.keywords_from_players.cpc
  traffic:
    description: "Estimated organic traffic generated by the URL for the keyword."
    lineage:
      - datalake_semrush_classified.keywords_from_players.traffic
  share_of_traffic:
    description: "Estimated share of traffic captured by the URL for this keyword."
    lineage:
      - datalake_semrush_classified.keywords_from_players.share_of_traffic
  competition:
    description: "SEMrush competition score for the keyword in paid search."
    lineage:
      - datalake_semrush_classified.keywords_from_players.competition
  number_of_results:
    description: "Approximate number of results returned by the search engine for the keyword."
    lineage:
      - datalake_semrush_classified.keywords_from_players.number_of_results
  keyword_difficulty:
    description: "SEMrush keyword difficulty score (0–100)."
    lineage:
      - datalake_semrush_classified.keywords_from_players.keyword_difficulty
  has_mention_to_city:
    description: Flag indicating whether the keyword mentions or implies a city.
    lineage:
      - datalake_gsheet_clean.mexico_regions.city_clean
      - datalake_semrush_classified.keywords_from_players.keyword_clean
  has_mention_to_zone:
    description: Flag indicating whether the keyword mentions or implies a zone.
    lineage:
      - datalake_gsheet_clean.mexico_regions.zone_clean
      - datalake_semrush_classified.keywords_from_players.keyword_clean
  dt_display:
    description: "Display date string as provided by SEMrush."
    lineage:
      - datalake_semrush_classified.keywords_from_players.dt_display
  dt_report:
    description: "Reporting reference date associated with the SEMrush export."
    lineage:
      - datalake_semrush_classified.keywords_from_players.dt_report
  ts_report:
    description: "Report extraction timestamp from SEMrush."
    lineage:
      - datalake_semrush_classified.keywords_from_players.ts_report
  year:
    description: "Partition year."
    lineage:
      - datalake_semrush_classified.keywords_from_players.year
  month:
    description: "Partition month."
    lineage:
      - datalake_semrush_classified.keywords_from_players.month
  day:
    description: "Partition day."
    lineage:
      - datalake_semrush_classified.keywords_from_players.day