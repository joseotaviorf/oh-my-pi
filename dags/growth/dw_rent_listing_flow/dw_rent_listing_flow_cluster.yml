cluster:
  type: emr_7_12_consolidation_s_general_fleet_cluster
  custom_configurations:
    spark_conf:
      spark.driver.memory: 8g
      spark.driver.memoryOverhead: 2g
      spark.yarn.am.memory: 2g
    aws_attributes:
      ebs_volume_size: 200
    core_nodes:
      target_on_demand: 2
      target_spot: 0
      instance_types:
      - m6g.xlarge
      - m7g.xlarge
    task_nodes:
      instance_types:
      - m6g.xlarge
      - m7g.xlarge
      target_on_demand: 0
      target_spot: 1
      allocation_strategy: price-capacity-optimized
      bid_price_percentage: 100
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE
