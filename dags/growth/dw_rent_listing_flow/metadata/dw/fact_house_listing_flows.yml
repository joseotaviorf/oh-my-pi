database_name: dw_public
table_name: fact_house_listing_flows
description: Fact table that contains each listing flow, which is a flow from the lead creation to a property being listed in our platform. Each line is a listing flow.
domain: Growth
owner: gabriel.salla@quintoandar.com
columns:
  sk_house_listing_flow:
    lineage:
    - datalake_listing_flow.listing_flows_with_reprocessed_leads.id
    description: Unique id related to the house listing flow, it's the primary key of the table.
  sk_condo:
    lineage:
    - datalake_rent_potential_listing.potential_listing_b2b.id_condo
    description: Key of the condominium/building where the property of the listing flow is located.
  sk_lead:
    lineage:
    - datalake_listing_flow.listing_flows_with_reprocessed_leads.id_lead
    description: Id of the lead related to the listing flow. A same lead can be related to different listing flows.
  sk_lead_conversion:
    lineage:
    - datalake_listing_flow.listing_flows_with_reprocessed_leads.id_conversion
    description: Key to identify the registration of a lead into a property, which means that the lead was converted.
  sk_first_photo_job:
    lineage:
    - datalake_listing_flow.listing_flows_with_reprocessed_leads.id_photo_job
    description: Key to identify the property's first photo job.
  sk_house_listing:
    lineage:
    - datalake_rent_potential_listing.potential_listing_b2b.id_house_listing
    description: Key of the house listing related to the listing flow.
  sk_user_house_registrant:
    lineage:
    - datalake_listing_flow.listing_flows_with_reprocessed_leads.id_rep
    description: Key to identify the Sales Rep that either registered the property or scheduled its first photo job.
  sk_user_sales_rep:
    lineage:
    - datalake_rent_potential_listing.potential_listing_lead_tasks.id_user_sales_rep
    description: Key to identify the Sales Rep related to the lead of the listing flow.
  sk_user_lead_affiliate:
    lineage:
    - datalake_listing_flow.listing_flows_with_reprocessed_leads.id_affiliate
    - datalake_listing_flow.listing_flows_with_reprocessed_leads.id_user_has_indicated
    description: Key to identify the affiliate user that referred the lead related to the listing flow.
  sk_user_first_task_assignee:
    lineage:
    - datalake_rent_potential_listing.potential_listing_lead_tasks.id_user_first_task_assignee
    description: Key to identify the first assignee user from the Inside Sales team that had a task related to the lead of the listing flow.
  sk_user_last_task_assignee:
    lineage:
    - datalake_rent_potential_listing.potential_listing_lead_tasks.id_user_last_task_assignee
    description: Key to identify the last assignee user from the Inside Sales team that had a task related to the lead of the listing flow.
  sk_region:
    lineage:
    - datalake_listing_flow.listing_flows_with_reprocessed_leads.id_region
    description: Key of the region related to the listing flow's property or lead.
  sk_city:
    lineage:
    - dw_public.dim_region.city_id
    - datalake_lead.lead_city_region.id_region
    description: Key to identify the city associated to the listing flow's property or lead.
  sk_partner:
    lineage:
    - datalake_rent_potential_listing.potential_listing_b2b.id_partner
    description: Key to identify the real estate partner company that is related to the lead/property, if we acquired from them.
  sk_autonomous_agent:
    lineage:
    - datalake_rent_potential_listing.potential_listing_b2b.id_autonomous_agent
    description: Key to identify the partner agent related to the lead, if it has one.
  sk_lead_date:
    lineage:
    - datalake_listing_flow.listing_flows_with_reprocessed_leads.ts_lead
    description: Key to identify the date of the lead creation. It's the lead creation date transformed into a number.
  sk_sales_company_lead_sent_date:
    lineage:
    - datalake_listing_flow.listing_flows_with_reprocessed_leads.ts_sales_company_sent
    description: Key to identify the date that a lead was sent to the Inside Sales company. It's the date that the lead was sent to the IS company transformed into a number.
  sk_prospect_date:
    lineage:
    - datalake_listing_flow.listing_flows_with_reprocessed_leads.ts_prospect
    description: Key to identify the date that a lead turned into a prospect, which means that it has passed through the discard algorithm with success. It's the lead's prospect date transformed into a number.
  sk_first_task_created_date:
    lineage:
    - datalake_rent_potential_listing.potential_listing_lead_tasks.dt_first_task_created_date
    description: Key to identify the date that the first task related to the listing flow was created. It's the listing flow's first task creation date transformed into a number.
  sk_first_task_closed_date:
    lineage:
    - datalake_rent_potential_listing.potential_listing_lead_tasks.dt_first_task_closed_date
    description: Key to identify the date that the first task related to the listing flow was closed. It's the listing flow's first task closed date transformed into a number.
  sk_last_task_created_date:
    lineage:
    - datalake_rent_potential_listing.potential_listing_lead_tasks.dt_last_task_created_date
    description: Key to identify the date that the last task related to the listing flow was created. It's the listing flow's last task creation date transformed into a number.
  sk_last_task_closed_date:
    lineage:
    - datalake_rent_potential_listing.potential_listing_lead_tasks.dt_last_task_closed_date
    description: Key to identify the date that the last task related to the listing flow was closed. It's the listing flow's last task closed date transformed into a number.
  sk_first_contact_date:
    lineage:
    - datalake_listing_flow.listing_flows_with_reprocessed_leads.ts_first_contact
    description: Key to identify the date that the lead passed through the first revision by an Insides Sales rep, which made contact. It's the first contact date transformed into a number.
  sk_conversion_date:
    lineage:
    - datalake_listing_flow.listing_flows_with_reprocessed_leads.ts_conversion
    description: Key to identify the date of the lead's conversion, which means that a house registration related to the lead happened. It's the lead's conversion date transformed into a number.
  sk_qualified_date:
    lineage:
    - datalake_listing_flow.listing_flows_with_reprocessed_leads.ts_qualified
    description: Key to identify the date of the lead's qualification, according to our internal criteria. It's the lead's qualified date transformed into a number.
  sk_available_qualified_date:
    lineage:
    - datalake_listing_flow.listing_flows_with_reprocessed_leads.ts_qualified
    description: Key to identify the date of the lead's qualification as available for a business context (Rent and/or Sale), according to our internal criteria. It's the lead's available qualified date transformed into a number.
  sk_opportunity_date:
    lineage:
    - datalake_listing_flow.listing_flows_with_reprocessed_leads.ts_opportunity
    description: Key to identify the date of opportunity, which means that the first house's photo job of was scheduled. It's the lead's opportunity date transformed into a number.
  sk_first_listing_date:
    lineage:
    - datalake_listing_flow.listing_flows_with_reprocessed_leads.ts_first_listing
    description: Key to identify the date of the house's first listing version was created in our platform. It's the lead's first listing date transformed into a number.
  sk_discard_date:
    lineage:
    - datalake_listing_flow.listing_flows_with_reprocessed_leads.ts_discarded
    description: Key to identify the date of a lead discard, if it has one. It's the lead's discard date transformed into a number.
  sk_user_lead_first_discarder:
    lineage:
    - datalake_listing_flow.listing_flows_with_reprocessed_leads.id_user_lead_first_discarder
    description: Key to identify the first user that discarded the lead related to the listing flow.
  sk_user_lead_last_discarder:
    lineage:
    - datalake_listing_flow.listing_flows_with_reprocessed_leads.id_user_lead_last_discarder
    description: Key to identify the last user that discarded the lead related to the listing flow.
  country_code:
    lineage:
    - datalake_listing_flow.listing_flows_with_reprocessed_leads.country_code
    description: Country code of origin related to the lead or the property of the listing flow, depends on the listing flow step.
    categories:
      BR: Brazil's country code
      MX: Mexico's country code
  funnel_step:
    description: The funnel step where the listing flow is in or has stoppped.
    categories:
      first contact: The listing flow is at the first contact step.
      lead: The listing flow is at the lead step.
      listing: The listing flow is at the listing step.
      opportunity: The listing flow is at the opportunity step.
      prospect: The listing flow is at the prospect step.
      qualified: The listing flow is at the qualified step.
  funnel_drop_reason:
    lineage:
    - datalake_listing_flow.listing_flows_with_reprocessed_leads.funnel_step
    description: The reason of why the listing flow has stopped in the actual funnel step.
    categories:
      Alugado: The lead's property is rented.
      ApartamentoBanguncado: The lead's property is messy.
      BrokenLeadFlow: The lead's flow is broken.
      CancelledPhotoJob: The lead's property has a cancelled photo job.
      DiscardedProspect: The lead was discarded at the prospect step.
      DiscardedQualified: The lead was discarded at the qualified step.
      Duplicado: The lead is duplicated.
      ForaDoPadrao: The lead is out of pattern.
      IMOVEL_COMERCIAL: The lead's property is a commercial property.
      IMOVEL_EM_CONDICAO_INSEGURA: The lead's property is in unsafe condition.
      IMPREVISTO_FOTOGRAFO: The photographer related to the lead's property photo job had an unexpected situation.
      LOCALIZACAO_PERIGOSA: The lead's property is in a dangerous location.
      Listed: The lead's property is already listed.
      NaoCompareceu: The agent/photographer related to the lead's property didn't show up.
      NaoProcessado: The lead was not processed.
      NaoProcessadoArea: The lead's property is in a not processed location.
      NoPhotoJob: The lead's property has no photo job.
      NotListedYet: The lead's property is not listed yet.
      NotMapped: The lead is unmapped.
      OnHold: The lead is on hold.
      OptedOut Qualified: The lead has been opted out at the qualified step.
      Outros: The lead has another drop reason.
      PROBLEMAS_NO_ENVIO_DE_FOTOS: The protographer related to the lead's property had a problem sending the photos.
      PROBLEMA_COM_ENDERECO: The lead's property has a problem with the address.
      PhotoJobScheduled: The lead's property has a photo job scheduled.
      ProprietarioCancelou: The lead's property owner canceled.
      Reforma: The lead's property is under renovation.
      SemAutorizacao: The lead is without authorization.
      SemChaves: The lead's property is without keys.
      SemContato: The lead's property is with no contact.
      TermsNotAccepted: The lead's property owner has not accepted the terms.
      Vendido: The lead's property is sold.
  hours_lead_to_prospect:
    lineage:
    - datalake_listing_flow.listing_flows_with_reprocessed_leads.hours_lead_to_prospect
    description: Hours between the lead creation timestamp and lead passing through the discard algorithm.
  hours_prospect_to_qualified:
    lineage:
    - datalake_listing_flow.listing_flows_with_reprocessed_leads.hours_prospect_to_qualified
    description: Hours between the lead passing through the discard algorithm and the lead's qualification, according to our internal criteria.
  hours_lead_to_first_contact:
    lineage:
    - datalake_listing_flow.listing_flows_with_reprocessed_leads.hours_lead_to_first_contact
    description: Hours between the lead creation and the lead's first revision by an Inside Sales rep, which made contact.
  hours_prospect_to_first_contact:
    lineage:
    - datalake_listing_flow.listing_flows_with_reprocessed_leads.hours_prospect_to_first_contact
    description: Hours between the lead's conversion to prospect and the lead's first revision by an Inside Sales rep, which made contact.
  hours_qualified_to_opportunity:
    lineage:
    - datalake_listing_flow.listing_flows_with_reprocessed_leads.hours_qualified_to_opportunity
    description: Hours between the lead's qualified conversion and the lead's opportunity conversion, which means that the first photo job was scheduled.
  hours_opportunity_to_listing:
    lineage:
    - datalake_listing_flow.listing_flows_with_reprocessed_leads.hours_opportunity_to_listing
    description: Hours between the lead's conversion to opportunity, which means that the first photo job was scheduled, and the lead's listing.
  hours_lead_to_listing:
    lineage:
    - datalake_listing_flow.listing_flows_with_reprocessed_leads.hours_lead_to_listing
    description: Hours between the lead creation and the lead's listing.
  days_lead_to_prospect:
    lineage:
    - datalake_listing_flow.listing_flows_with_reprocessed_leads.days_lead_to_prospect
    description: Days between the lead creation and the lead's conversion to prospect.
  days_prospect_to_qualified:
    lineage:
    - datalake_listing_flow.listing_flows_with_reprocessed_leads.days_prospect_to_qualified
    description: Days between the lead's conversion to prospect and lead's conversion to qualified, according to our internal criteria.
  days_lead_to_first_contact:
    lineage:
    - datalake_listing_flow.listing_flows_with_reprocessed_leads.days_lead_to_first_contact
    description: Days between the lead creation and the lead's first revision by an Inside Sales rep, which made contact.
  days_prospect_to_first_contact:
    lineage:
    - datalake_listing_flow.listing_flows_with_reprocessed_leads.days_prospect_to_first_contact
    description: Days between the lead's conversion to prospect and lead's first revision by an Inside Sales rep, which made contact.
  days_qualified_to_opportunity:
    lineage:
    - datalake_listing_flow.listing_flows_with_reprocessed_leads.days_qualified_to_opportunity
    description: Days between the lead's conversion to qualified and lead's conversion to opportunity, which means that the lead's first photo job was created.
  days_opportunity_to_listing:
    lineage:
    - datalake_listing_flow.listing_flows_with_reprocessed_leads.days_opportunity_to_listing
    description: Days between the lead's opportunity conversion and lead's conversion to a listing.
  days_lead_to_listing:
    lineage:
    - datalake_listing_flow.listing_flows_with_reprocessed_leads.days_lead_to_listing
    description: Days between the lead creation and the lead's listing.
  days_lead_to_processing:
    lineage:
    - datalake_listing_flow.listing_flows_with_reprocessed_leads.days_lead_to_processing
    description: Days between the lead creation and the lead's discard or conversion.
  is_exclusive:
    lineage:
    - datalake_rent_potential_listing.potential_listing_b2b.is_exclusive
    description: Flag that indicates if a house is exclusive to our platform. 1 indicates true and 0 indicates false.
  first_isales_intervention:
    lineage:
    - datalake_rent_potential_listing.potential_listing_lead_tasks.first_isales_intervention
    description: Identification in which step an Inside Sales rep intervention occurred, which could be during lead or photo's steps.
    categories:
      Lead: The intervention occured at the lead step.
      Photojob: The intervention occured only at the photo job step.
  lead_type:
    lineage:
    - datalake_rent_potential_listing.potential_listings_reprocessed_leads.lead_type
    description: The lead type, according to the Main (EBDB).
    categories:
      Afiliado: The lead came from an affiliate.
      Agente: The lead came from an agent.
      B2BOpenLink: The lead came from B2B Open Link.
      BrokenOpenLink: The lead came from Broken Open Link.
      CadastroImobiliario: The lead came from a real estate registration.
      CanalDoImovel: The lead came from the property channel.
      Inbound: The lead came from inbound.
      LandingMarketing: The lead came from the Marketing Landing Page.
      LandingOpenLink: The lead came from the Open Link Landing Page.
      Marketing: The lead came from marketing.
      OLX: The lead came from OLX.
      OpenLink: The lead came from Open Link.
      Organic: The lead is organic.
      Porteiro: The lead came from a doorman.
      Proporparceria: The lead came from proposed partnership.
      Repechage: The lead is a repechage.
  lead_origin:
