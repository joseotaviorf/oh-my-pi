  lead_context_origin:
    lineage:
    - datalake_listing_flow.listing_flows_with_reprocessed_leads.lead_context_origin
    description: The lead's business context origin.
    categories:
      Hybrid: Lead is for rent and sale.
      Only Rent: Lead is exclusively for rent.
      Only Sale: Lead is exclusively for sale.
      Organic: Lead is organic (no information for any context).
  listing_sale_status:
    lineage:
    - datalake_listing_flow.listing_flows_with_reprocessed_leads.listing_sale_status
    description: The lead's status related to the Sale operation, which means if it qualified or not yet, if it was once pulished, if it's editing or has opted out.
    categories:
      Editing: Listing is under edition.
      Not Qualified Yet: Listing is not qualified yet.
      Once Published: Listing was once published.
      Opted Out: Listing was opted out for Sale.
  ts_opted_out_rent:
    lineage:
    - datalake_listing_flow.listing_flows_with_reprocessed_leads.ts_opt_out_rent
    description: The lead's timestamp of when it was opted out from Rent operation.
  is_call_center:
    description: Boolean flag which identifies if the lead was sent to a call center test in 2018.
  is_cx_direct_register:
    description: Boolean flag which identifies if the house was directly registered in the platform by CS team.
  is_isales_direct_register:
    description: Boolean flag which identifies if the house was directly registered in the platform by the Inside Sales team.
  is_ops_direct_register:
    description: Boolean flag which identifies if the house was directly registered via Admin by the Ops team.
  mkt_branded:
    description: The lead's marketing label of a branded campaign as defined by the lead taxonomy.
    categories:
      Branded: Lead is branded.
      Other: Lead is other.
  mkt_category:
    description: The lead's marketing category as defined by the lead taxonomy.
    categories:
      Inbound: Inbound category.
      Other: Other category.
      Outbound: Outbound category.
  mkt_completion:
    description: The lead's marketing completion as defined by the lead taxonomy.
    categories:
      Full Self-Service: The owner has done the entire listing process through Owner PWA App (including photo job scheduling), with no contact from Inside Sales.
      Non Self-Service: The lead went directly to the Inside Sales team and suffered convertions there.
      Not Mapped: Not mapped completion.
      Other: Other completion.
      Recovered Self-Service: The owner dropped at some point beforing scheduling the photo job, so Inside Sales contacted the owner.
  mkt_flow:
    description: The lead's marketing flow as defined by the lead taxonomy.
    categories:
      Non Self-Service: The lead went directly to the Inside Sales team.
      Other: Other flow.
      Self-Service: The lead started at Owner PWA app.
  mkt_platform:
    description: The lead's marketing platform as defined by the lead taxonomy.
    categories:
      Not Mapped: Not mapped platform.
      Web Desktop: Web desktop platform.
      Web Mobile: Web mobile platform.
  ts_load:
    description: Timestamp indicating the data load into our system. It has nothing related to the listing flow itself.