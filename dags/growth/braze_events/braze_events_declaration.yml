dag:
  name: braze_events
  owner: Data Growth
  schedule_start_date: 2020, 11, 1
  schedule_interval: "15 0 * * *"
  documentation:
    dag_purpose: |
      Retrieves data from events streamed by [Braze's Currents tool](https://www.braze.com/docs/user_guide/data_and_analytics/braze_currents/).
      Braze is a multichannel communication platform, and its tool Currents is responsible for streaming event data into our infrastructure.
      This DAG gets all the Braze integrations declared in the DAG file constant `APP_GROUPS` and generates a respective output table.
workflow:
  layer: raw
  type: custom_ingestion
  load_spark_job: load_braze_events_raw
  default_partitions: [event_type, year, month, day]
  default_extraction_type: incremental
  #extra_query_template_params:
  #  load_start_date: "{{ get_date_param(dag_run, ds, 'load_start_date') }}"
  #  load_end_date: "{{ get_date_param(dag_run, ds, 'load_end_date') }}"
  spark_job_arguments:
  - "{environment}"   # env
  - "{bucket}"   # datalake_bucket
  - "{dag_name}"   # source
  - "{{ ds }}"   # execution_date
    #- "{load_start_date}"
    #- "{load_end_date}"
  tables_customization:
    events_indica_ai:
      extra_spark_job_arguments:
      - indica_ai   # app group
    events_owners:
      extra_spark_job_arguments:
      - owners   # app group
    events_tenants:
      extra_spark_job_arguments:
      - tenants   # app group
cluster:
  type: databricks_13_3_med_memory_2_workers_general_cluster