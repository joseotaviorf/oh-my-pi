database_name: datalake_growth_facebook_insights
table_name: facebook_insights_impression_device
owner: henrique.paulo@quintoandar.com.br
domain: Growth
description: |
  Enrich layer consolidating Facebook Ads Insights with impression-device breakdown across seven
  QuintoAndar ad accounts. Grain is one row per ad, impression device, and reporting day (dt_start).
  Metrics include clicks, impressions, inline link clicks, spend, and actions. Built by UNION ALL
  of per-account clean tables in datalake_facebook_insights_impression_device_clean. Consumed by
  growth marketing consolidated metrics (e.g. facebook_consolidated_metrics). Physically partitioned
  by year, month, and day derived from dt_start (default_partitions in enrich_facebook_insights DAG);
  Always filter year, month, and day together for partition pruning.
