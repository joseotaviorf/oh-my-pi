    is_complete:
      severity_level: Error
    is_unique:
      severity_level: Error
  currency_name:
    is_complete:
      severity_level: Error
  currency_symbol:
    is_complete:
      severity_level: Error
  id_currency:
    is_complete:
      severity_level: Error
    is_unique:
      severity_level: Error
