dag:
  name: enrich_marketing_costs_offline
  schedule_start_date: 2021, 3, 31
  owner: Data Growth
  documentation:
    dag_purpose: This DAG enriches offline costs manually defined and ingested via gsheets.
    additional_information: |
      Currently, there are the following output tables in our enrich layer:
        - offline_manual_costs
        - offline-costs-and-budget
workflow:
  type: query_delta
  layer: enrich
  inner_dependencies:
    offline_costs_and_budget:
    - offline_manual_costs
  custom_schema: marketing_costs
cluster:
  type: databricks_12_2_min_general_photon_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
