cluster:
  type: consolidation_xs_general_cluster
  databricks_conn_id: databricks_new_env
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
    runtime_engine: PHOTON
    node_type_id: m7gd.large
validation:
  cluster:
    type: emr_7_12_consolidation_xs_general_fleet_cluster
    custom_configurations:
      core_nodes:
        target_on_demand: 2
        target_spot: 0
        instance_types:
        - m6gd.xlarge
      task_nodes:
        target_on_demand: 0
        target_spot: 0
        instance_types:
        - m6gd.xlarge
