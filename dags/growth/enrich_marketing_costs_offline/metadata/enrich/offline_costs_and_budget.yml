database_name: datalake_marketing_costs
table_name: offline_costs_and_budget
owner: thiago.jesus@quintoandar.com.br
domain: Growth
description: Each row of this table is a daily offline advertising cost and budget.
columns:
  id:
    description: Unique id for the daily offline advertising cost and budget.
    lineage:
      - datalake_marketing_costs.offline_manual_costs.id
  id_date:
    description: Date of the cost and budget, in integer format (yyyyMMdd).
    lineage:
      - datalake_marketing_costs.offline_manual_costs.id_date
      - datalake_marketing_offline_costs_clean.marketing_offline_budget.dt_budget
  id_rule_city_group_rent:
    description: Id of the rule to share costs betweeen cities if it is a Rental focused ad.
    lineage:
      - datalake_marketing_costs.offline_manual_costs.id_rule_city_group_rent
  id_rule_city_group_sale:
    description: Id of the rule to share costs betweeen cities if it is a Sale focused ad.
    lineage:
      - datalake_marketing_costs.offline_manual_costs.id_rule_city_group_sale
  id_rule_cost_center:
    description: Id of the rule to share costs betweeen cost centers.
    lineage:
      - datalake_marketing_costs.offline_manual_costs.id_rule_cost_center
  email:
    description: E-mail of the responsible team member.
    lineage:
      - datalake_marketing_costs.offline_manual_costs.email
  team:
    description: Name of the responsible team.
    lineage:
      - datalake_marketing_costs.offline_manual_costs.team
  entry_type:
    description: Type of entry in the spreadsheet (invoice, provision, etc.).
    lineage:
      - datalake_marketing_costs.offline_manual_costs.entry_type
  invoice_number:
    description: Invoice number of that ad.
    lineage:
      - datalake_marketing_costs.offline_manual_costs.invoice_number
  cnpj:
    description: CNPJ of the vendor responsible for the advertising.
    lineage:
      - datalake_marketing_costs.offline_manual_costs.cnpj
  vendor_name:
    description: Name of the vendor responsible for the advertising.
    lineage:
      - datalake_marketing_costs.offline_manual_costs.vendor_name
  description:
    description: Short description for the advertising.
    lineage:
      - datalake_marketing_costs.offline_manual_costs.description
  campaign_name:
    description: Name of the advertising.
    lineage:
      - datalake_marketing_costs.offline_manual_costs.campaign_name
  cost_category:
    description: Category of the advertising cost.
    lineage:
      - datalake_marketing_costs.offline_manual_costs.cost_category
  cost_subcategory:
    description: Subcategory of the advertising cost.
    lineage:
      - datalake_marketing_costs.offline_manual_costs.cost_subcategory
  action:
    description: Action type of the advertising.
    lineage:
      - datalake_marketing_costs.offline_manual_costs.action
  business_context:
    description: Business context to which the advertisement was directed.
    lineage:
      - datalake_marketing_costs.offline_manual_costs.business_context
  has_city_group_share:
    description: Flag to indicate if that cost will be shared between city groups.
    lineage:
      - datalake_marketing_costs.offline_manual_costs.has_city_group_share
  has_cost_center_share:
    description: Flag to indicate if that cost will be shared between cost centes.
    lineage:
      - datalake_marketing_costs.offline_manual_costs.has_cost_center_share
  cost_center:
    description: Cost center responsible for the ad.
    lineage:
      - datalake_marketing_costs.offline_manual_costs.cost_center
  city_group:
    description: Target city group of the advertising.
    lineage:
      - datalake_marketing_costs.offline_manual_costs.city_group
      - datalake_marketing_offline_costs_clean.marketing_offline_budget.city_group
  cost:
    description: Daily cost the advertising.
    lineage:
      - datalake_marketing_costs.offline_manual_costs.cost
  planning_business_context:
    description: Planing business context of the cost/budget.
    lineage:
      - datalake_marketing_offline_costs_clean.marketing_offline_budget.business_context
  budget:
    description: Daily budget for that ad.
    lineage:
      - datalake_marketing_offline_costs_clean.marketing_offline_budget.budget
  ts_entry:
    description: Date of when the invonce was registred in the spreadsheet.
    lineage:
      - datalake_marketing_costs.offline_manual_costs.ts_entry
  dt_invoice:
    description: date when the invoice was issued.
    lineage:
      - datalake_marketing_costs.offline_manual_costs.dt_invoice
  dt_service_started:
    description: Start date of the service.
    lineage:
      - datalake_marketing_costs.offline_manual_costs.dt_service_started
  dt_service_ended:
    description: End date of the service.
    lineage:
      - datalake_marketing_costs.offline_manual_costs.dt_service_ended
