dag:
  name: enrich_top_of_funnel_supply
  schedule_start_date: 2019, 1, 1
  owner: Data Growth
  documentation:
    dag_purpose: As a derivation of Amplitude enrich layer, this DAG generates tables to track supply user behaviors in the top of the funnel.
workflow:
  type: query_delta
  layer: enrich
  default_extraction_type: incremental
  default_partitions:
  - year
  - month
  - day
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, -6), 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
cluster:
  type: databricks_12_2_med_general_photon_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
