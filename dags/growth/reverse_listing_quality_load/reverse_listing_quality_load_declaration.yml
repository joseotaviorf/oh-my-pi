dag:
  name: reverse_listing_quality_load
  schedule_start_date: 2026, 03, 10
  owner: Data Growth
  documentation:
    dag_purpose: This DAG collects all new House Listings with photos into reverse_listing_quality.listing_quality. The access DAG reverse_listing_quality_access sends them to the MainListingQuality SQS queue for the ListingQuality service (main-sqs-consumers).
workflow:
  type: load
  layer: reverse
  custom_schema: listing_quality
  default_extraction_type: full
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_end | ds, 'load_end_date') }}"

