---
table_name: datalake_realestate_clean.plans_by_product_by_country
alert_channel: GROWTH_ALERTS
table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Warning
column_level_validations:
  id_country:
    is_complete:
      severity_level: Error
  id_product:
    is_complete:
      severity_level: Error
  id_publication_plan:
    is_complete:
      severity_level: Error
  unique_composite_primary_key:
    custom:
      constraint: |-
        (SELECT COUNT(*) FROM (
          SELECT id_publication_plan, id_product, id_country, COUNT(*) AS cnt
          FROM datalake_realestate_clean.plans_by_product_by_country
          GROUP BY id_publication_plan, id_product, id_country
          HAVING COUNT(*) > 1
        ) dupes) = 0
      severity_level: Error
