dag:
  name: enrich_listing_flow
  schedule_start_date: 2019, 1, 1
  owner: Data Growth
  documentation:
    dag_purpose: Creates enriched tables for the context `Listing_flow`.
workflow:
  type: query_delta
  layer: enrich
  inner_dependencies:
    listing_flows_with_reprocessed_leads:
    - listing_flow
    - discards_reason_by_context
    sales_listing_flows_with_reprocessed_leads:
    - listing_flow
    - discards_reason_by_context
cluster:
  type: custom_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    num_workers: 3
    driver_node_type_id: r5d.2xlarge
    node_type_id: r5d.2xlarge
    runtime_engine: PHOTON
    aws_attributes:
      ebs_volume_size: 200
    spark_version: 16.4.x-scala2.12
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
