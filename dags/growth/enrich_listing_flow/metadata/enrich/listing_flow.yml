database_name: datalake_listing_flow
table_name: listing_flow
domain: Growth
owner: gabriel.salla@quintoandar.com
description: Core supply listing acquisition funnel. Links lead, prospect, and listing milestones with acquisition channel attributes and elapsed day/hour metrics between funnel steps.
columns:
  id_lead:
    lineage:
      - datalake_lead.lead.id
    description: Lead primary key from datalake_lead.lead used to join supply funnel tables.
  id_conversion:
    lineage:
      - datalake_lead.conversion_lead.id
    description: Id of the conversion data of the lead.
  id_photo_job:
    lineage:
      - datalake_ebdb_clean.photographer_job.id
    description: Id of the photo job of the lead.
  id_house:
    lineage:
      - datalake_ebdb_listing.house.id
    description: House identifier from EBDB listing associated with the listing flow milestone.
  id_rep:
    lineage:
      - datalake_ebdb_listing.house.id_user_registrant
      - datalake_ebdb_user.user_revision_entity.id_user
    description: Id of the user who registered the house or listing in the rent context.
  id_isales_registrant:
    lineage:
      - datalake_ebdb_listing.house.id_user_registrant
    description: Id of the user who registered the house or listing in Inside Sales.
  id_affiliate:
    lineage:
      - datalake_ebdb_user.user.id
    description: Id of the user of the affiliate
  id_region:
    lineage:
      - datalake_ebdb_listing.house.id_region
      - datalake_lead.lead.id_region
    description: Id of the region of the house.
  id_first_region:
    lineage:
      - datalake_ebdb_listing.house.id_region
      - datalake_ebdb_clean.lead_aud.id_region
    description: Region identifier assigned at the first listing flow event.
  id_user_lead_first_discarder:
    lineage:
      - datalake_ebdb_user.user_revision_entity.id_user
    description: Id of the user who discarded the lead for the first time.
  id_user_lead_last_discarder:
    lineage:
      - datalake_ebdb_user.user_revision_entity.id_user
    description: Id of the user who discarded the lead for the last time.
  country_code:
    lineage:
      - datalake_ebdb_listing.house.country_code
      - datalake_lead.lead.country_code
    description: Country code of the house.
  funnel_step:
    lineage:
      - datalake_ebdb_clean.photographer_job.problem
    description: Current funnel stage derived from photo job problem or self-service flow logic.
  ts_lead:
    lineage:
      - datalake_ebdb_listing.house.dt_creation
      - datalake_lead.lead.ts_created
      - datalake_lead.lead.dt_ad_created
      - datalake_lead.lead.dt_picked_up
    description: Timestamp of the lead's creation.
  ts_prospect:
    lineage:
      - datalake_ebdb_listing.house.dt_creation
      - datalake_ebdb_user.user_revision_entity.ts_revision
      - datalake_lead.lead.ts_updated
      - datalake_wololo_clean.prospect.ts_created
    description: Timestamp of when the lead became a prospect.
  ts_first_contact:
    lineage:
      - datalake_ebdb_user.user_revision_entity.ts_revision
      - datalake_lead.conversion_lead.ts_converted
    description: Timestamp of the first contact of the lead.
  ts_conversion:
    lineage:
      - datalake_ebdb_user.user_revision_entity.ts_revision
      - datalake_ebdb_listing.house.dt_creation
      - datalake_lead.conversion_lead.ts_converted
    description: Timestamp of when the lead converted.
  ts_qualified:
    lineage:
      - datalake_lead.conversion_lead.ts_converted
    description: Timestamp of when the prospect became a qualified.
  ts_opportunity:
    lineage:
      - datalake_ebdb_clean.photographer_job.ts_created
      - datalake_ebdb_clean.photographer_job.ts_scheduled
      - datalake_ebdb_clean.photographer_job.ts_photographer_accepted
      - datalake_ebdb_clean.photographer_job.ts_photos_uploaded
    description: Timestamp of when the qualified became an opportunity.
  ts_first_listing:
    lineage:
      - datalake_ebdb_listing.house.dt_first_publication
    description: Timestamp of when the opportunity became a first listing.
  ts_discarded:
    lineage:
      - datalake_ebdb_user.user_revision_entity.ts_revision
    description: Timestamp of when the lead was discarded.
  id:
    lineage:
      - datalake_listing_flow.listing_flow.id
    description: Id of the listing flow. It is generated artificially with a row_number in the datalake_listing_flow.listing_flow table.
  flow:
    lineage:
      - datalake_listing_flow.listing_flow.flow
    description: Listing funnel flow classification assigned by listing_flow logic.
    categories:
      Lead Flow: Standard lead-driven acquisition funnel.
      Self-Service Flow: Owner self-service registration funnel.
      Organic Flow: Organic owner acquisition funnel.
  acquisition_channel:
    lineage:
      - datalake_listing_flow.listing_flow.acquisition_channel
    description: Detailed acquisition channel label for the listing flow row.
  acquisition_method:
    lineage:
      - datalake_listing_flow.listing_flow.acquisition_method
    description: Whether the listing was captured via self-service or assisted flow.
    categories:
      Non-Self Service: Assisted or affiliate-driven capture (default majority).
      Self-Service: Owner completed registration without assisted operations.
  acquisition_source:
    lineage:
      - datalake_listing_flow.listing_flow.acquisition_source
    description: High-level acquisition source grouping for the listing flow row.
    categories:
      Affiliate: Affiliate program or referral source.
      Other: Other or unmapped source bucket.
      Owner App: Owner mobile or PWA app capture.
      Admin: Admin or operations-assisted capture.
      Reprocessed: Reprocessed duplicate lead source.
      Doorman: Doorman partner channel.
      Landing Page Leads: Marketing landing page source.
      Crawling: Automated classifieds crawling.
      Facebook: Facebook acquisition source.
  is_self_service_photo_job_scheduled:
    lineage:
      - datalake_listing_flow.listing_flow.is_self_service_photo_job_scheduled
    description: If the photo job was scheduled by a user not from Inside Sales.
  days_lead_to_first_contact:
    lineage:
      - datalake_listing_flow.listing_flow.days_lead_to_first_contact
    description: Elapsed days from lead creation to first outbound contact.
  days_lead_to_listing:
    lineage:
      - datalake_listing_flow.listing_flow.days_lead_to_listing
    description: Elapsed days from lead creation to first published listing.
  days_lead_to_processing:
    lineage:
      - datalake_listing_flow.listing_flow.days_lead_to_processing
    description: Elapsed days from lead creation to prospect processing start.
  days_lead_to_prospect:
    lineage:
      - datalake_listing_flow.listing_flow.days_lead_to_prospect
    description: Elapsed days from lead creation to prospect creation.
  days_opportunity_to_listing:
    lineage:
      - datalake_listing_flow.listing_flow.days_opportunity_to_listing
    description: Elapsed days from opportunity milestone to first listing.
  days_prospect_to_first_contact:
    lineage:
      - datalake_listing_flow.listing_flow.days_prospect_to_first_contact
    description: Elapsed days from prospect creation to first contact.
  days_prospect_to_qualified:
    lineage:
      - datalake_listing_flow.listing_flow.days_prospect_to_qualified
    description: Elapsed days from prospect creation to qualified milestone.
  days_qualified_to_opportunity:
    lineage:
      - datalake_listing_flow.listing_flow.days_qualified_to_opportunity
    description: Elapsed days from qualified milestone to opportunity.
  hours_lead_to_first_contact:
    lineage:
      - datalake_listing_flow.listing_flow.hours_lead_to_first_contact
    description: Elapsed hours from lead creation to first outbound contact.
  hours_lead_to_listing:
    lineage:
      - datalake_listing_flow.listing_flow.hours_lead_to_listing
    description: Elapsed hours from lead creation to first published listing.
  hours_lead_to_prospect:
    lineage:
      - datalake_listing_flow.listing_flow.hours_lead_to_prospect
    description: Elapsed hours from lead creation to prospect creation.
  hours_opportunity_to_listing:
    lineage:
      - datalake_listing_flow.listing_flow.hours_opportunity_to_listing
    description: Elapsed hours from opportunity milestone to first listing.
  hours_prospect_to_first_contact:
    lineage:
      - datalake_listing_flow.listing_flow.hours_prospect_to_first_contact
    description: Elapsed hours from prospect creation to first contact.
  hours_prospect_to_qualified:
    lineage:
      - datalake_listing_flow.listing_flow.hours_prospect_to_qualified
    description: Elapsed hours from prospect creation to qualified milestone.
  hours_qualified_to_opportunity:
    lineage:
      - datalake_listing_flow.listing_flow.hours_qualified_to_opportunity
    description: Elapsed hours from qualified milestone to opportunity.
