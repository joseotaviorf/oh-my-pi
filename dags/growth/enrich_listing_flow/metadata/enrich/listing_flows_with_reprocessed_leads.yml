---
database_name: datalake_listing_flow
table_name: listing_flows_with_reprocessed_leads
description: Describes the most important dates of the listing flow, while including information about reprocessed leads.
domain: Growth
owner: ae-growth@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_listing_flow.listing_flow.id
    description: Id of the listing flow. It is generated artificially with a row_number in the datalake_listing_flow.listing_flow table.
  id_lead:
    lineage:
      - datalake_listing_flow.listing_flow.id_lead
    description: Id of the lead.
  id_conversion:
    lineage:
      - datalake_listing_flow.listing_flow.id_conversion
    description: Id of the conversion data of the lead.
  id_photo_job:
    lineage:
      - datalake_listing_flow.listing_flow.id_photo_job
    description: Id of the photo job of the lead.
  id_house:
    lineage:
      - datalake_listing_flow.listing_flow.id_house
    description: Id of the house.
  id_rep:
    lineage:
      - datalake_listing_flow.listing_flow.id_rep
      - datalake_ebdb_listing.listing_business_context.user_listing_registrant_rent
    description: Id of the user who registered the house or listing in the rent context.
  id_isales_registrant:
    lineage:
      - datalake_listing_flow.listing_flow.
    description: Id of the user who registered the house or listing in Inside Sales.
  id_affiliate:
    lineage:
      - datalake_listing_flow.listing_flow.id_affiliate
    description: Id of the user of the affiliate
  id_region:
    lineage:
      - datalake_listing_flow.listing_flow.id_region
    description: Id of the region of the house.
  id_partner:
    lineage:
      - datalake_ebdb_clean.partner_agent.id_partner
    description: Id of the partner agent.
  id_user_has_indicated:
    lineage:
      - datalake_lead.lead.id_user_has_indicated
    description: Id of the affiliate user that indicated the property related to the lead, if it has one.
  id_user_lead_first_discarder:
    lineage:
      - datalake_listing_flow.listing_flow.id_user_lead_first_discarder
    description: Id of the user who discarded the lead for the first time.
  id_user_lead_last_discarder:
    lineage:
      - datalake_listing_flow.listing_flow.id_user_lead_last_discarder
    description: Id of the user who discarded the lead for the last time.
  uuid_company:
    lineage:
      - datalake_ebdb_listing.house.uuid_company
    description: UUID of the Rede company.
  id_company_hubspot:
    lineage:
      - datalake_ebdb_listing.house.id_company_hubspot
    description: Id of the Rede company in Hubspot.
  partner_3p_supply:
    lineage:
      - datalake_ebdb_listing.house.partner_3p_supply
    description: Short name of the Rede company.
  country_code:
    lineage:
      - datalake_listing_flow.listing_flow.country_code
    description: Country code of the house.
  is_self_service_photo_job_scheduled:
    lineage:
      - datalake_listing_flow.listing_flow.is_self_service_photo_job_scheduled
    description: If the photo job was scheduled by a user not from Inside Sales.
  is_3p_supply:
    lineage:
      - datalake_ebdb_listing.house.is_rent_3p_supply
    description: If the house is from a Rede company in the rent context.
  flow:
    lineage:
      - datalake_listing_flow.listing_flow.flow
    description: Flow of the listing, which can be organic or self service.
  acquisition_method:
    lineage:
      - datalake_listing_flow.listing_flow.acquisition_method
    description: Acquisition method of the listing, which can be self service or non self service.
  acquisition_channel:
    lineage:
      - datalake_listing_flow.listing_flow.acquisition_channel
    description: Acquisition channel of the listing, which can be admin or organic owner app.
  acquisition_source:
    lineage:
      - datalake_listing_flow.listing_flow.acquisition_source
    description: Acquisition source of the listing, which can be admin or owner app.
  acquisition_channel_rep:
    lineage:
      - datalake_listing_flow.listing_flow.acquisition_channel
    description: Acquisition channel of the reprossed lead.
  affiliate_type:
    lineage:
      - datalake_lead.lead.affiliate_type
    description: Affiliate type.
  ts_opt_out_rent:
    lineage:
      - datalake_ebdb_listing.listing_business_context.ts_opt_out_rent
    description: The lead's timestamp of when it was opted out from Rent operation.
  ts_lead:
    lineage:
      - datalake_listing_flow.listing_flow.ts_lead
      - datalake_ebdb_listing.listing_business_context.ts_created
    description: Timestamp of the lead's creation.
  ts_prospect:
    lineage:
      - datalake_listing_flow.listing_flow.ts_prospect
      - datalake_ebdb_listing.listing_business_context.ts_created
    description: Timestamp of when the lead became a prospect.
  ts_first_contact:
    lineage:
      - datalake_listing_flow.listing_flow.ts_first_contact
      - datalake_ebdb_listing.listing_business_context.ts_created
    description: Timestamp of the first contact of the lead.
  ts_conversion:
    lineage:
      - datalake_listing_flow.listing_flow.ts_conversion
    description: Timestamp of when the lead converted.
  ts_qualified:
    lineage:
      - datalake_listing_flow.listing_flow.ts_qualified
      - datalake_listing_flow.listing_flow.ts_conversion
      - datalake_listing_flow.listing_flow.ts_discarded
      - datalake_listing_flow.listing_flow.ts_prospect
      - datalake_ebdb_listing.listing_business_context.ts_created
    description: Timestamp of when the prospect became a qualified.
  ts_available_qualified:
    lineage:
      - datalake_listing_flow.listing_flow.ts_qualified
      - datalake_listing_flow.listing_flow.ts_conversion
      - datalake_listing_flow.listing_flow.ts_discarded
      - datalake_listing_flow.listing_flow.ts_prospect
      - datalake_ebdb_listing.listing_business_context.ts_created
    description: Timestamp of when the qualified became an available qualified.
  ts_opportunity:
    lineage:
      - datalake_listing_flow.listing_flow.ts_opportunity
      - datalake_ebdb_listing.listing_business_context.ts_first_listing
    description: Timestamp of when the qualified became an opportunity.
  ts_first_listing:
    lineage:
      - datalake_ebdb_listing.listing_business_context.ts_first_listing
    description: Timestamp of when the opportunity became a first listing.
  ts_discarded:
    lineage:
      - datalake_listing_flow.listing_flow.ts_discarded
    description: Timestamp of when the lead was discarded.
  ts_sales_company_sent:
    lineage:
      - datalake_wololo_lead.lead_sales_company.ts_sales_company_sent
    description: Timestamp of when the lead was sent to the Inside Sales company.
