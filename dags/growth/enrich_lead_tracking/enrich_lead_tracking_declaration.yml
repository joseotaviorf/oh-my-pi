dag:
  name: enrich_lead_tracking
  schedule_start_date: 2020, 1, 1
  owner: Data Growth
  documentation:
    dag_purpose: |
      Creates enriched tables for the lead tracking context.
      This context is responsible for tracking the leads and prospects data.
workflow:
  type: query_delta
  layer: enrich
  tables_customization:
    rene_acquisition_data:
      extraction_type: incremental
      partitions: [year, month, day]
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, macros.ds_add(ds, -6), 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, ds, 'load_end_date') }}"
cluster:
  type: databricks_12_2_med_general_photon_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
