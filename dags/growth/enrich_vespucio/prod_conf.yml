---
cluster_description: databricks_10_4_med_io-memory_photon_cluster
custom_libraries:
     - pypi:
          package: s2cell 
     - maven:
          coordinates: "org.apache.sedona:sedona-python-adapter-3.0_2.12:1.2.0-incubating"
     - maven:
          coordinates: "org.datasyslab:geotools-wrapper:1.1.0-25.2"
     - pypi:
          package: geospark
     - pypi:
          package: pytopojson
     - pypi:
          package: apache-sedona
init_script:
     - dbfs:
          destination: "dbfs:/FileStore/sedona/sedona-init.sh"
spark_conf:
     - spark.serializer: "org.apache.spark.serializer.KryoSerializer"
     - spark.sql.extensions: "org.apache.sedona.viz.sql.SedonaVizExtensions,org.apache.sedona.sql.SedonaSqlExtensions"
     - spark.kryo.registrator: "org.apache.sedona.core.serde.SedonaKryoRegistrator"
external_s3_bucket: 5a-vespucio-prod
tables_to_reverse: ["condo"]
addresses_s2_geometry_mapping_table: dejavu
table_task_group_parameters:
  condo_full:
    partition_cols:
      - year
      - month
      - day
    is_incremental: True
  condo:
    partition_cols: []
    is_incremental: False
