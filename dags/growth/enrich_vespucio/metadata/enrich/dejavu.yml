---
database_name: datalake_vespucio
table_name: dejavu
owner: '@data-growth'
domain: growth
description: Contains a unique ID (id_dejavu) for condo addresses. Even when the address is written different, the id_dejavu is the same.
columns:
  id_dejavu:
    description: Id created by S2Cell library. This is generated of the latitude and longitude coordinates in S2Cell token. The S2 geometry library is a spatial indexing system that divides the Earth's surface into cells identified by a token. 
  id_address:
    description: "Hash id generated for each condo (duplicated or not)."
    lineage:
      - datalake_vespucio.condo.uuid
  id_region:
    description: Foreign key of region where listing is located in.
    lineage:
      - datalake_ebdb_clean.map_region.id
  input_address:
    description: "The concatenation of address, number, neighborhood, zip_code and city."
    lineage:
      - datalake_vespucio.condo.address
      - datalake_vespucio.condo.number
      - datalake_vespucio.condo.neighborhood
      - datalake_vespucio.condo.zip_code
      - datalake_vespucio.condo.city
  output_address:
    description: Address output by Google Geocoding API.
  latitude:
    description: Latitude output by Google Geocoding API.
  longitude:
    description: Longitude output by Google Geocoding API.
  ts_updated:
    description: Timestamp of the last address requisition to Google Geocoding API.