database_name: datalake_amplitude_page_viewed_events
table_name: listing_page_viewed
description: This table contains enriched data from Amplitude tracking listing page view events, providing insights into user engagement with property listings.
domain: Growth
owner: growth@quintoandar.com.br
columns:
  id_amplitude:
    description: Unique identifier for the user in Amplitude analytics, including merged user identities.
    lineage:
      - datalake_amplitude_clean.170698_listing_page_viewed_events.id_amplitude
      - datalake_amplitude_clean.170698_user_merge.merged_amplitude_id
  id_session:
    description: Session identifier tracking the user's browsing session when viewing the listing page.
    lineage:
      - datalake_amplitude_clean.170698_listing_page_viewed_events.id_session
  id_house:
    description: Unique identifier of the property listing that was viewed by the user.
    lineage:
      - datalake_amplitude_clean.170698_listing_page_viewed_events.ep_house_id
  country_code:
    description: Country code derived from user properties indicating the user's location context.
    lineage:
      - datalake_amplitude_clean.170698_listing_page_viewed_events.user_properties
  user_country:
    description: Country where the user is located when viewing the listing page.
    lineage:
      - datalake_amplitude_clean.170698_listing_page_viewed_events.country
  utm_source:
    description: UTM source parameter indicating the traffic source that brought the user to the listing page.
    lineage:
      - datalake_amplitude_clean.170698_listing_page_viewed_events.up_utm_source
  utm_medium:
    description: UTM medium parameter indicating the marketing medium used to reach the user.
    lineage:
      - datalake_amplitude_clean.170698_listing_page_viewed_events.up_utm_medium
  utm_campaign:
    description: UTM campaign parameter identifying the specific marketing campaign that drove the user.
    lineage:
      - datalake_amplitude_clean.170698_listing_page_viewed_events.up_utm_campaign
  utm_content:
    description: UTM content parameter for tracking different versions of the same ad or content.
    lineage:
      - datalake_amplitude_clean.170698_listing_page_viewed_events.up_utm_content
  utm_term:
    description: UTM term parameter for tracking paid search keywords that brought the user.
    lineage:
      - datalake_amplitude_clean.170698_listing_page_viewed_events.up_utm_term
  ts_event:
    description: Timestamp when the listing page view event occurred.
    lineage:
      - datalake_amplitude_clean.170698_listing_page_viewed_events.ts_event
