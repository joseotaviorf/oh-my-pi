database_name: datalake_amplitude_page_viewed_events
table_name: contract_docusign_signed_events
description: This table contains enriched data from Amplitude tracking contract signing events via DocuSign, capturing important conversion milestones in the user journey.
domain: Growth
owner: growth@quintoandar.com.br
columns:
  id_amplitude:
    description: Unique identifier for the user in Amplitude analytics, including merged user identities.
    lineage:
      - datalake_amplitude_clean.170698_contract_docusign_signed_events.id_amplitude
      - datalake_amplitude_clean.170698_user_merge.id_amplitude_merged
  id_session:
    description: Session identifier tracking the user's session when the contract signing event occurred.
    lineage:
      - datalake_amplitude_clean.170698_contract_docusign_signed_events.id_session
  id_house:
    description: Unique identifier of the property for which the contract was signed.
    lineage:
      - datalake_amplitude_clean.170698_contract_docusign_signed_events.ep_house_id
  country_code:
    description: Country code derived from user properties indicating the user's location context.
    lineage:
      - datalake_amplitude_clean.170698_contract_docusign_signed_events.user_properties
  user_country:
    description: Country where the user is located when signing the contract.
    lineage:
      - datalake_amplitude_clean.170698_contract_docusign_signed_events.country
  utm_source:
    description: UTM source parameter indicating the traffic source that originally brought the user.
    lineage:
      - datalake_amplitude_clean.170698_contract_docusign_signed_events.up_utm_source
  utm_medium:
    description: UTM medium parameter indicating the marketing medium used to acquire the user.
    lineage:
      - datalake_amplitude_clean.170698_contract_docusign_signed_events.up_utm_medium
  utm_campaign:
    description: UTM campaign parameter identifying the specific marketing campaign that acquired the user.
    lineage:
      - datalake_amplitude_clean.170698_contract_docusign_signed_events.up_utm_campaign
  utm_content:
    description: UTM content parameter for tracking different versions of the same ad or content.
    lineage:
      - datalake_amplitude_clean.170698_contract_docusign_signed_events.up_utm_content
  utm_term:
    description: UTM term parameter for tracking paid search keywords that originally brought the user.
    lineage:
      - datalake_amplitude_clean.170698_contract_docusign_signed_events.up_utm_term
  ts_event:
    description: Timestamp when the DocuSign contract signing event occurred.
    lineage:
      - datalake_amplitude_clean.170698_contract_docusign_signed_events.ts_event
