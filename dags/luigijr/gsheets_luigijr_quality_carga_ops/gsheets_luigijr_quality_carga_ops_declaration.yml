dag:
  name: gsheets_luigijr_quality_carga_ops
  schedule_interval: 0 8 * * *
  owner: Data Fintech
  tags:
  - luigi
  - luigi-type:gsheets
  - generated-by:joao.trevisan
workflow:
  type: gsheets_ingestion
  layer: raw
  custom_schema: gsheets
  tables_customization:
    quality_carga_ops:
      sheet_id: 13reyQ76KDE2Br7WfgYo3XLxkXuN8g1tGH1D_P8iATtM
