description: NPS Human Support is the pooled onboarding + ongoing NPS of customers who opened a **support ticket** in the observation window. It uses the same pooled engine as NPS Seamless and NPS Digital Sup, differing only in the seamless_ticket_type value it filters — and it takes precedence over the digital classification whenever both signals are present.
