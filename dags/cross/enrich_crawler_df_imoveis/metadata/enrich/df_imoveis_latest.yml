---
database_name: datalake_crawler_df_imoveis
table_name: df_imoveis_latest
description: |
  This table contains the most recent update for each listing regarding the df_imoveis crawler data.
  It provides a deduplicated view of the datalake_crawler_df_imoveis.df_imoveis table, showing only
  the most recent record per listing (id_house) based on the partition (year, month, day).

  **Deduplication Logic:**
  - Returns the latest update per listing using ROW_NUMBER() OVER(PARTITION BY id_house ORDER BY make_date(year, month, day) DESC) = 1
  - Filters data within the specified load date range

  **Use Case:**
  This table is ideal for analytics requiring the current state of each property without duplicates,
  providing a clean, point-in-time view of the latest available information for each listing.

  **Update Schedule:**
  The table is updated weekly, every Friday, after the datalake_crawler_df_imoveis.df_imoveis
  table is refreshed. This ensures data consistency and maintains the dependency chain.
domain: Cross
owner: mateus.aferreira@quintoandar.com.br
columns: 
