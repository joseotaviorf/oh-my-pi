---
database_name: datalake_crawler_df_imoveis
table_name: df_imoveis
description: |
  This table contains enriched fields regarding the df_imoveis crawler data.
  It transforms and flattens the original struct fields from the clean table into
  individual columns for easier analysis and consumption.
  Partitioned by year, month, day. Always filter on year, month, day in WHERE clauses to enable partition pruning and avoid full table scans. When filtering by address_city, combine partition predicates with those columns to benefit from Z-order clustering and data skipping.

  **Key Transformations:**
  - Extracts and flattens JSON struct fields (address, price, house_info, etc.) into individual columns
  - Applies data type casting (integers for numeric fields, booleans for flags, doubles for prices and price_m2)
  - Calculates derived fields like price_m2_rental and price_m2_sale
  - Handles complex city name parsing with regex cleaning
  - Creates composite fields like id_house (id + 'dfimoveis') and is_hybrid flag

  **Data Source:**
  - **2025 onwards:** Sources data from datalake_crawler_df_imoveis_clean.df_imoveis

  **Update Schedule:**
  The table is updated weekly, every Thursday, after the datalake_crawler_df_imoveis_clean.df_imoveis
  table is refreshed. This ensures data consistency and maintains the dependency chain.
domain: Cross
owner: mateus.aferreira@quintoandar.com.br
columns: 
  id_house_platform:
    lineage:
      - datalake_crawler_df_imoveis_clean.df_imoveis.id
    description: |
      The id of the listing in the df_imoveis platform.
  id_house:
    lineage:
      - datalake_crawler_df_imoveis_clean.df_imoveis.id
    description: |
      It concatenates the id of the listing in the df_imoveis platform with the
      string "dfimoveis".
  platform:
    lineage:
      - datalake_crawler_df_imoveis_clean.df_imoveis.origin
    description: |
      The origin of the listing, which is always "dfimoveis" for this table.
  advertiser_listing_id:
    lineage:
      - datalake_crawler_df_imoveis_clean.df_imoveis.house_info
    description: |
      The ID of the listing in the advertiser's CRM.
      It is extracted from the "house_info" struct field.
  country:
    lineage:
      - datalake_crawler_df_imoveis_clean.df_imoveis.address
    description: |
      The country of the listing.
      It is provided by the original struct field "address".
  state:
    lineage:
      - datalake_crawler_df_imoveis_clean.df_imoveis.address
    description: |
      The state of the listing.
      It is provided by the original struct field "address".
  address_city:
    lineage:
      - datalake_crawler_df_imoveis_clean.df_imoveis.address
    description: |
      The city of the listing.
      It is provided by the original struct field "address".
      If the original value is null, then it assumes the clean table partition,
      which is the "city" field.
      It doens't assume null values, and it is used as a z_order field for the
      delta table.
  neighborhood:
    lineage:
      - datalake_crawler_df_imoveis_clean.df_imoveis.address
    description: |
      The neighborhood of the listing.
      It is provided by the original struct field "address".
  street:
    lineage:
      - datalake_crawler_df_imoveis_clean.df_imoveis.address
    description: |
      The street of the listing.
      It is provided by the original struct field "address".
  zip_code:
    lineage:
      - datalake_crawler_df_imoveis_clean.df_imoveis.address
    description: |
      The zip_code of the listing.
      It is provided by the original struct field "address".
  latitude:
    lineage:
      - datalake_crawler_df_imoveis_clean.df_imoveis.geolocation
    description: |
      The latitude associated with the listing location.
      It is provided by the original struct field "geolocation".
  longitude:
    lineage:
      - datalake_crawler_df_imoveis_clean.df_imoveis.geolocation
    description: |
      The longitude associated with the listing location.
      It is provided by the original struct field "geolocation".
  listing_name:
    lineage:
      - datalake_crawler_df_imoveis_clean.df_imoveis.listing_name
    description: |
      The name of the listing.
      It is the listing description provided in the origin platform.
  listing_url:
    lineage:
      - datalake_crawler_df_imoveis_clean.df_imoveis.crawl_metadata
    description: |
      The url of the listing.
      It is provided by the original struct field "crawl_metadata".
  total_area:
    lineage:
      - datalake_crawler_df_imoveis_clean.df_imoveis.house_info
    description: |
      The total area of the listing in square meters.
      It is extracted from the "house_info" struct field and cast as integer.
  area:
    lineage:
      - datalake_crawler_df_imoveis_clean.df_imoveis.house_info
    description: |
      The area of the listing in square meters.
      It is extracted from the "house_info" struct field and cast as integer.
  amenities:
    lineage:
      - datalake_crawler_df_imoveis_clean.df_imoveis.house_info
    description: |
      The listing amenities, such as "Área de Serviço", "Quadra Esportiva", "Salão de Festas", "Aceita Pets", etc.
      It is extracted from the "house_info" struct field.
  bedrooms:
    lineage:
      - datalake_crawler_df_imoveis_clean.df_imoveis.house_info
    description: |
      The number of bedrooms in the listing.
      It is extracted from the "house_info" struct field and cast as integer.
  suites:
    lineage:
      - datalake_crawler_df_imoveis_clean.df_imoveis.house_info
    description: |
      The number of suites in the listing.
      It is extracted from the "house_info" struct field and cast as integer.
  floor:
    lineage:
      - datalake_crawler_df_imoveis_clean.df_imoveis.house_info
    description: |
      The floor number of the listing.
      It is extracted from the "house_info" struct field and cast as integer.
  parking_spaces:
    lineage:
      - datalake_crawler_df_imoveis_clean.df_imoveis.house_info
    description: |
