dag:
  name: crawler_zap_imoveis
  owner: Data Growth
  schedule_start_date: 2025, 7, 29
  schedule_interval: "0 0 * * 5"
  documentation:
    dag_purpose: |
      This DAG ingests weekly data from the Zap Imóveis crawler,
      with the source data stored in an S3 bucket.
      It runs every Friday at 00:00, to update the data from the current week,
      which is provided every wednesday by the crawler provider.
workflow:
  layer: raw
  type: custom_ingestion
  load_spark_job: load_crawler_zap_imoveis_raw
  default_extraction_type: incremental
  default_partitions: [year, month, day]
  has_hive_sync: false
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, -6), 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, 1), 'load_end_date') }}"
  spark_job_arguments:
    - "{environment}" # env
    - "{bucket}" # datalake_bucket
    - "{table_name}" # table_name
    - "{partitions}" # partition_cols
    - "{load_start_date}" # load_start_date
    - "{load_end_date}" # load_end_date
    - "s3://listing-crawler.s3.data.quintoandar.com.br/spinver/" # source_root_path
    - "zapimoveis" # origin
  tables_customization:
    zap_imoveis:
      z_order_by: [city]
cluster:
  type: custom_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    driver_node_type_id: r5a.4xlarge
    node_type_id: r5a.4xlarge
    num_workers: 4
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
    spark_version: 14.3.x-scala2.12
