---
dag:
  name: enrich_ebdb_house
  schedule_start_date: 2023, 4, 26
  owner: Data Engineering
  documentation:
    dag_purpose: Creates enriched tables for the context `House` from ebdb. This DAG is responsible for creating enriched tables about
      the house domain with a direct dependency on the EBDB. As a home domain, these would be characteristics,
      conditions and statuses that are independent of the listing (they don't change after a publication/depublication).
workflow:
  type: query
  layer: enrich
  default_extraction_type: incremental
  default_partitions:
  - country_code
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: r5d.2xlarge
    node_type_id: r5d.2xlarge
    runtime_engine: PHOTON
    num_workers: 2
    spark_version: 12.2.x-scala2.12
