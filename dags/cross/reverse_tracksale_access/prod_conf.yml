---
campaigns:
  # query: table name
  # tags: the tag display name and the respective column associated
  # trigger_at_hour: the hour (in UTC) that the campaign should be triggered on Tracksale. For Brazil, is 17. For Mexico, is 19
  # trigger_at_minute: the minute of the hour that the campaign should be triggered on Tracksale. It's zero for both countries
  # Scoped to seller CCV hub (campaign 297) during the migration validation.
  - campaign_code: 297
    query: true_seller_ccv_hub
    tags: '[{"name": "Telefone","value": "customer_phone"},{"name": "Etapa","value": "campaign_step"},{"name": "Tipo de Cliente","value": "customer_type"},{"name": "CPF","value": "customer_cpf"},{"name": "User Id","value": "id_user"},{"name": "Tipo de Campanha","value": "campaign_type"},{"name": "Driver","value": "driver_type"},{"name": "Driver Id","value": "id_driver"},{"name": "Fluxo_5A","value": "business_context"},{"name": "Cidade","value": "cidade"}]'
    trigger_at_hour: 17
    trigger_at_minute: 0
