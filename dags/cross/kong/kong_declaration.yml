dag:
  name: kong
  schedule_start_date: 2023, 4, 3
  schedule_interval: 0 1 * * *
  owner: Data SS
  documentation:
    dag_purpose: Retrieves kong logs data from all 5A applications.

workflow:
  layer: raw
  type: custom_ingestion
  load_spark_job: load_kong_raw
  spark_job_arguments:
  - "{environment}"
  - "{bucket}"
  - "{table_name}"
  - "{partitions}"
  - "{{ ds }}"

  default_extraction_type: incremental
  default_partitions: [year, month, day, hour]
  tables_customization:
    kong_logs: {}

cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: r5a.4xlarge
    node_type_id: r5d.4xlarge
    spark_version: 13.3.x-scala2.12
    num_workers: 4
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
  databricks_conn_id: databricks_new
