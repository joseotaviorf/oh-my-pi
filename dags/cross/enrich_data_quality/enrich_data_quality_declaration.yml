---
dag:
  name: enrich_data_quality
  schedule_start_date: 2022, 1, 1
  schedule_interval: 0 6 * * *
  owner: Data International
  documentation:
    dag_purpose: "This DAG consolidates the data quality validations from Inmetro applied to bietlejuice DAGs."
workflow:
  type: query_delta
  layer: enrich
  default_extraction_type: incremental
  default_partitions:
    - id_dag
    - year
    - month
    - day
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, macros.ds_add(ds, 1), 'load_end_date') }}"
cluster:
  type: databricks_12_2_min_memory_photon_cluster
