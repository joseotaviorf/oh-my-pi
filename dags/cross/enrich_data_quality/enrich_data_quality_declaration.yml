---
dag:
  name: enrich_data_quality
  schedule_start_date: 2022, 1, 1
  owner: Data International
  documentation:
    dag_purpose: "This DAG consolidates the data quality validations from Inmetro applied to bietlejuice DAGs."
workflow:
  type: query_delta
  layer: enrich
  default_extraction_type: incremental
  default_partitions:
    - id_dag
    - year
    - month
    - day
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, macros.ds_add(ds, 1), 'load_end_date') }}"
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: r5d.4xlarge
    node_type_id: m5d.4xlarge
    runtime_engine: PHOTON
    num_workers: 2
    spark_version: 12.2.x-scala2.12
