dag:
  name: tars_logs
  schedule_interval: 0 12 * * *
  owner: Data Conversational XP
  documentation:
    dag_purpose: |
      Downloads JSON log files from a Google Drive folder modified since the last run
      and appends them to datalake_tars_raw.logs (one row per file: file_name, raw_content, ts_load).
      Credentials via Databricks secret scope "quintoandar" / GOOGLE_SERVICE_ACCOUNT_CREDENTIALS.

workflow:
  type: custom_ingestion
  layer: raw
  load_spark_job: load_drive_files
  spark_job_arguments:
    - "{environment}"
    - "{bucket}"
    - "tars"
    - "logs"
    - "1NeVn0bkpc70PiU6PaX0DPvg_0c-PAiBu"
    - "{{ get_date_param(dag_run, data_interval_start | ts, 'load_start_date') }}"
    - "{partitions}"
  tables_customization:
    logs:
      raw_partitions: ["year", "month", "day"]
      raw_extraction_type: incremental
      clean_extraction_type: incremental
      merge_on: ["answer_id"]

cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: r7a.xlarge
    node_type_id: r7a.xlarge
    num_workers: 2
    spark_version: 16.4.x-scala2.12
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
  custom_libraries:
    - pypi:
        package: "google-api-python-client==2.48.0"
    - pypi:
        package: "google-auth==2.23.0"
    - pypi:
        package: "oauth2client==4.1.3"
  databricks_conn_id: databricks_new
