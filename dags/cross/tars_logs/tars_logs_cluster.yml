cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: r6g.xlarge
    node_type_id: r6g.xlarge
    num_workers: 2
    spark_version: 16.4.x-scala2.12
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
  custom_libraries:
  - pypi:
      package: google-api-python-client==2.48.0
  - pypi:
      package: google-auth==2.23.0
  - pypi:
      package: oauth2client==4.1.3
  databricks_conn_id: databricks_new
validation:
  cluster:
    type: consolidation_s_memory_cluster
    databricks_conn_id: databricks_new
    custom_libraries:
    - pypi:
        package: google-api-python-client==2.48.0
    - pypi:
        package: google-auth==2.23.0
    - pypi:
        package: oauth2client==4.1.3
  allow_custom_spark_job: true
