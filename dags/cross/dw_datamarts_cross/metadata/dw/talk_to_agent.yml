database_name: dw_datamarts_cross
table_name: talk_to_agent
description: Contains messages sent from tenants to agents through listings pages.
  Each line is a Talk to Agent Started (when the message is sent), on house-tenant-agent
  triad. Talk to Agent Completed is considered when there is a visit booked by agent
  and/or completed support
domain: Cross
owner: eduardo.bastiani@quintoandar.com.br
