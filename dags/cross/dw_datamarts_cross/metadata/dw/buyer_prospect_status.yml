---
database_name: dw_datamarts
table_name: buyer_prospect_status
domain: For Sale
owner: data-for-sale@quintoandar.com.br
description: A buyer prospect is a user who has scheduled at least one visit to a property for sale. This table contains information about the status of the prospect,
  and each row is a change in the status.
columns:
  sk_buyer:
    lineage:
      - datalake_talk_to_agent.talk_to_agent.tenant_id
      - dw_sale.fact_offers.sk_buyer
      - dw_sale.fact_sale_flows.sk_buyer
    description: ID of the buyer prospect user.
  city_group:
    lineage:
      - dw_public.dim_region.city_group
    description: City group of the property.
  ts_start:
    lineage:
      - datalake_talk_to_agent.talk_to_agent.first_message_ts
      - dw_public.dim_booking.dt_created
      - dw_sale.dim_offer.ts_offer_submitted
      - dw_sale.dim_sale_agreement.ts_sale_agreement_signed
    description: Timestamp of the start of the status.
  ts_end:
    lineage:
      - datalake_talk_to_agent.talk_to_agent.first_message_ts
      - dw_public.dim_booking.dt_created
      - dw_sale.dim_offer.ts_offer_submitted
      - dw_sale.dim_sale_agreement.ts_sale_agreement_signed
    description: Timestamp of the end of the status.
  sk_start_date:
    lineage:
      - datalake_talk_to_agent.talk_to_agent.first_message_ts
      - dw_public.dim_booking.dt_created
      - dw_sale.dim_offer.ts_offer_submitted
      - dw_sale.dim_sale_agreement.ts_sale_agreement_signed
    description: Date key of the start of the status.
  sk_end_date:
    lineage:
      - datalake_talk_to_agent.talk_to_agent.first_message_ts
      - dw_public.dim_booking.dt_created
      - dw_sale.dim_offer.ts_offer_submitted
      - dw_sale.dim_sale_agreement.ts_sale_agreement_signed
    description: Date key of the end of the status.
  status:
    description: Status of the prospect.
    categories:
      ACTIVE: The prospect is active (i.e., has had at least one event in the last 90 days).
      CHURNED: The prospect is churned (i.e., has not had any event in the last 90 days, nor signed any contract).
      SIGNED CCV: The prospect has signed a CCV (sale contract).
  status_detail:
    description: Detail of the status of the prospect.
    categories:
      New BP: New buyer prospect (first event).
      First activation in city_group: First activation of the prospect in the city group.
      Inactive by signing CCV: Prospect became inactive by signing a CCV (sale contract).
      Inactivity: Prospect became inactive (i.e., has not had any event in the last 90 days).
      Recovered after churn: Prospect became active again after being churned.
      Recovered after ccv signed: Prospect became active again after signing a CCV (sale contract).
  ts_first_activation:
    lineage:
      - datalake_talk_to_agent.talk_to_agent.first_message_ts
      - dw_public.dim_booking.dt_created
      - dw_sale.dim_offer.ts_offer_submitted
      - dw_sale.dim_sale_agreement.ts_sale_agreement_signed
    description: Timestamp of the first activation of the prospect.
  city_group_first_activation:
    lineage:
      - dw_public.dim_region.city_group
    description: City group of the property at the first activation of the prospect.
