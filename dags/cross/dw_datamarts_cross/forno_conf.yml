athena_template:
  dw: &athena_anchor
    runs_on: athena
pipeline:
  ##<KEEP THIS COMMENTED AS A TEMPLATE>
  # <task-name-like-attribution-conversion-paths>:
  #   dw:
  #     table: <targe-table-name>
  #     runs_on: <backend-to-run-the-query> E.g: redshift or athena
  buyer_prospect_status:
    dw:
      <<: *redshift_anchor
      table: buyer_prospect_status
      depends_on:
        - talk_to_agent
  funnel_demand_flows:
    dw:
      <<: *redshift_anchor
      table: funnel_demand_flows
      depends_on:
        - talk_to_agent
  lead_listing_flows:
    dw:
      <<: *redshift_anchor
      table: lead_listing_flows
  quintoandar_consultant_listings:
    dw:
      <<: *redshift_anchor
      table: quintoandar_consultant_listings
  talk_to_agent:
    dw:
      <<: *athena_anchor
      table: talk_to_agent
