---
database_name: datalake_gsheets_clean
table_name: dags_sla_exclusion_list
owner: isadora.gallerani@quintoandar.com.br
domain: Cross
description: This gsheet contains all the bi-etl-ejuice Airflow DAGs that shouldn't be considered in our Data SLA.
  When adding a new DAG to the list, make sure to add the date of when it should start being considered (dt_dag_added).
  If the DAG should not be on the list anymore, don't remove it (for historical data reasons), but add a date that indicates that it's removed (dt_dag_removed).
  If in the future the DAG is added again to the list, make sure to create a new line with a new dt_dag_added date.
  If a DAG is renamed, make sure to keep both old and new names, for historical DAG run data.
columns:
  context:
    lineage:
      - datalake_gsheets_raw.dags_sla_exclusion_list.context
    description: Line context of the DAG.
  dag:
    lineage:
      - datalake_gsheets_raw.dags_sla_exclusion_list.dag
    description: DAG name (DAG id of the Airflow).
  is_d0:
    lineage:
      - datalake_gsheets_raw.dags_sla_exclusion_list.is_d0
    description: Boolean flag indicating if the DAG runs as D0.
  dt_dag_added:
    lineage:
      - datalake_gsheets_raw.dags_sla_exclusion_list.dt_dag_added
    description: Date of when the DAG was added to the exclusion list.
  dt_dag_removed:
    lineage:
      - datalake_gsheets_raw.dags_sla_exclusion_list.dt_dag_removed
    description: Date of when the DAG was removed from the exclusion list.
  ts_load:
    description: Timestamp of when the data was loaded into our systems.