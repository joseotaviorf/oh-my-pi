database_name: datalake_ebdb_clean
table_name: house_price_suggestion
owner: vitor.sa@quintoandar.com.br
domain: For Sale
description: Table containing price suggestions for properties, generated by the async calculator flow.
columns:
  id:
    lineage:
      - datalake_ebdb_raw.HousePriceSuggestion.id
    description: 'Primary ID for the price suggestion (same as in the source table).'
  id_house:
    lineage:
      - datalake_ebdb_raw.HousePriceSuggestion.house_id
    description: 'ID of the property (house) to which the suggestion refers.'
  id_prediction:
    lineage:
      - datalake_ebdb_raw.HousePriceSuggestion.prediction_id
    description: 'ID of the prediction (model) that generated this suggestion.'
  business_context:
    lineage:
      - datalake_ebdb_raw.HousePriceSuggestion.business_context
    description: 'Business context for which the price was suggested (e.g., RENT, SALE).'
  lower_bound_limit:
    lineage:
      - datalake_ebdb_raw.HousePriceSuggestion.lower_bound_limit
    description: 'The lowest allowed price (floor) for the context.'
  upper_bound_limit:
    lineage:
      - datalake_ebdb_raw.HousePriceSuggestion.upper_bound_limit
    description: 'The highest allowed price (ceiling) for the context.'
  suggested_lower_bound_price:
    lineage:
      - datalake_ebdb_raw.HousePriceSuggestion.suggested_lower_bound_price
    description: 'The minimum value of the price range suggested by the pricing model.'
  suggested_upper_bound_price:
    lineage:
      - datalake_ebdb_raw.HousePriceSuggestion.suggested_upper_bound_price
    description: 'The maximum value of the price range suggested by the pricing model.'
  suggested_price:
    lineage:
      - datalake_ebdb_raw.HousePriceSuggestion.suggested_price
    description: 'The exact anchor value suggested by the pricing model.'
  deal_objective_lower_anchor:
    lineage:
      - datalake_ebdb_raw.HousePriceSuggestion.deal_objective_lower_anchor
    description: 'Lower anchor used for the deal objective.'
  deal_objective_upper_anchor:
    lineage:
      - datalake_ebdb_raw.HousePriceSuggestion.deal_objective_upper_anchor
    description: 'Upper anchor used for the deal objective.'
  suggestion_certainty:
    lineage:
      - datalake_ebdb_raw.HousePriceSuggestion.suggestion_certainty
    description: 'Level of certainty or confidence associated with the suggestion.'
  rule:
    lineage:
      - datalake_ebdb_raw.HousePriceSuggestion.rule
    description: 'Business rule or heuristic applied to the suggestion (if any).'
  ts_created:
    lineage:
      - datalake_ebdb_raw.HousePriceSuggestion.created_at
    description: 'Timestamp of when the suggestion record was created in the source.'
  ts_updated:
    lineage:
      - datalake_ebdb_raw.HousePriceSuggestion.updated_at
    description: 'Timestamp of the last update to the suggestion record in the source.'
