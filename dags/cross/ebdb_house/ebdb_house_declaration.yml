dag:
  name: ebdb_house
  schedule_start_date: 2021, 2, 20
  schedule_interval: 10 21 * * *
  owner: Data ForSale
  documentation:
    dag_purpose: Extraction of EBDB tables related to House into data lake. EBDB is the main database for QuintoAndar.
workflow:
  type: cdc
  layer: raw
  database_type: mysql
  source_database: ebdb
  custom_schema: ebdb
  source_schema: ebdb
  tables_customization:
    HouseEnrichment:
      clean_table_name: house_enrichment
      get_table_metrics:
        count: '*'
    HouseEnrichment_AUD:
      clean_table_name: house_enrichment_aud
      get_table_metrics:
        count: '*'
    HouseMaintenanceCondition:
      clean_table_name: house_maintenance_condition
      get_table_metrics:
        count: '*'
    HouseMaintenanceCondition_AUD:
      clean_table_name: house_maintenance_condition_aud
      get_table_metrics:
        count: '*'
    HouseMedia:
      clean_table_name: house_media
      get_table_metrics:
        count: '*'
    HousePredictedPrice:
      clean_table_name: house_predicted_price
      get_table_metrics:
        count: '*'
    HousePredictedPrice_AUD:
      clean_table_name: house_predicted_price_aud
      get_table_metrics:
        count: '*'
    HouseRating:
      clean_table_name: house_rating
      get_table_metrics:
        count: '*'
    HouseRating_RatingLabel:
      raw_primary_keys: ["HouseRating_id", "ratingLabels_id"]
      clean_table_name: house_rating_rating_label
      clean_primary_keys: ["id_house_rating", "id_rating_labels"]
      get_table_metrics:
        count: '*'
    HouseRegistrationStatus:
      clean_table_name: house_registration_status
      get_table_metrics:
        count: '*'
    HouseRegistrationStatus_AUD:
      clean_table_name: house_registration_status_aud
      get_table_metrics:
        count: '*'
    HouseRentCosts_AUD:
      clean_table_name: house_rent_costs_aud
      get_table_metrics:
        count: '*'
    HouseSpecialCondition:
      clean_table_name: house_special_condition
      get_table_metrics:
        count: '*'
    Imovel:
      clean_table_name: house
      get_table_metrics:
        count: '*'
    Imovel_AUD:
      clean_table_name: house_aud
      get_table_metrics:
        count: '*'
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: m5a.2xlarge
    node_type_id: m5a.xlarge
    num_workers: 3
    spark_version: 13.3.x-scala2.12
    aws_attributes:
      ebs_volume_size: 200
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
  databricks_conn_id: databricks_new
