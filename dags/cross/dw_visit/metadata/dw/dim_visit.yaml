database_name: dw_public
table_name: dim_visit
description: Information about Rent and Sale visits, which is a subset of bookings.
  A visit is when a tenant prospect/buyer prospect visits a property because it's interested in it.
  Each line is an unique visit.
domain: For Rent
owner: gustavo.alencar@quintoandar.com.br
columns:
  sk_visit:
    lineage:
    - datalake_ebdb_clean.visit.id
    description: Key of visit
  id_visit:
    lineage:
    - datalake_ebdb_clean.visit.id
    description: Id of visit (equal to key of visit)
  cd_visit:
    lineage:
    - datalake_ebdb_clean.visit.code
    description: Code of visit
  business_unit:
    lineage:
    - datalake_sale_visit_hubs.sale_visit_hubs.business_unit
    description: Business unit name, already standardized with Teams data.
  day_visit:
    lineage:
    - datalake_ebdb_clean.visit.dt_visit
    description: Date of visit
  slot:
    lineage:
    - datalake_ebdb_clean.visit.slot
    description: Slot time of visit (0, 1, 2, ..., 51)
  slot_count:
    lineage:
    - datalake_ebdb_clean.visit.slot_count
    description: Number of available slots to visit
  type:
    lineage:
    - datalake_ebdb_clean.visit.type
    description: Useless (only 6 rows if type = 1 from 2015)
  status:
    lineage:
    - datalake_ebdb_clean.visit.status
    description: Visit status
    categories:
      Canceled: ''
      Done: ''
      Scheduled: ''
  booking_type:
    lineage:
    - datalake_ebdb_clean.visit.booking_type
    description: Type of the booking
    categories:
      Booked: ''
      Realized: ''
  dt_created:
    lineage:
    - datalake_ebdb_clean.visit.ts_created
    description: Timestamp of booking creating
  dt_updated:
    lineage:
    - datalake_ebdb_clean.visit.ts_updated
    description: Timestamp of visit last status
  ts_load:
    description: Timestamp of the ingestion data.
