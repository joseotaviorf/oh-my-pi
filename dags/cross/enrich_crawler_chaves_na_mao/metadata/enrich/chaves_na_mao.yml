---
database_name: datalake_crawler_chaves_na_mao
table_name: chaves_na_mao
description: |
  This table contains enriched fields regarding the chaves_na_mao crawler data.
  It transforms and flattens the original struct fields from the clean table into
  individual columns for easier analysis and consumption.

  **Key Transformations:**
  - Extracts and flattens JSON struct fields (address, price, house_info, etc.) into individual columns
  - Applies data type casting (integers for numeric fields, booleans for flags, doubles for prices and price_m2)
  - Calculates derived fields like price_m2_rental and price_m2_sale
  - Handles complex city name parsing with regex cleaning
  - Creates composite fields like id_house (id + 'chaves-na-mao') and is_hybrid flag

  **Data Source:**
  - **2025 onwards:** Sources data from datalake_crawler_chaves_na_mao_clean.chaves_na_mao

  **Update Schedule:**
  The table is updated weekly, every Thursday, after the datalake_crawler_chaves_na_mao_clean.chaves_na_mao
  table is refreshed. This ensures data consistency and maintains the dependency chain.
domain: Cross
owner: mateus.aferreira@quintoandar.com.br
columns: 
  id_house_platform:
    lineage:
      - datalake_crawler_chaves_na_mao_clean.chaves_na_mao.id
    description: |
      The id of the listing in the chaves_na_mao platform.
  id_house:
    lineage:
      - datalake_crawler_chaves_na_mao_clean.chaves_na_mao.id
    description: |
      It concatenates the id of the listing in the chaves_na_mao platform with the
      string "chaves-na-mao".
  platform:
    lineage:
      - datalake_crawler_chaves_na_mao_clean.chaves_na_mao.origin
    description: |
      The origin of the listing, which is always "chaves-na-mao" for this table.
  advertiser_listing_id:
    lineage:
      - datalake_crawler_chaves_na_mao_clean.chaves_na_mao.house_info
    description: |
      The ID of the listing in the advertiser's CRM.
      It is extracted from the "house_info" struct field and can assume null values.
  country:
    lineage:
      - datalake_crawler_chaves_na_mao_clean.chaves_na_mao.address
    description: |
      The country of the listing.
      It is provided by the original struct field "address".
  state:
    lineage:
      - datalake_crawler_chaves_na_mao_clean.chaves_na_mao.address
    description: |
      The state of the listing.
      It is provided by the original struct field "address".
  address_city:
    lineage:
      - datalake_crawler_chaves_na_mao_clean.chaves_na_mao.address
    description: |
      The city of the listing.
      It is provided by the original struct field "address".
      If the original value is null, then it assumes the clean table partition,
      which is the "city" field.
      It doens't assume null values, and it is used as a z_order field for the
      delta table.
  neighborhood:
    lineage:
      - datalake_crawler_chaves_na_mao_clean.chaves_na_mao.address
    description: |
      The neighborhood of the listing.
      It is provided by the original struct field "address".
  street:
    lineage:
      - datalake_crawler_chaves_na_mao_clean.chaves_na_mao.address
    description: |
      The street of the listing.
      It is provided by the original struct field "address".
  number:
    lineage:
      - datalake_crawler_chaves_na_mao_clean.chaves_na_mao.address
    description: |
      The number of the listing.
      It is provided by the original struct field "address".
  zip_code:
    lineage:
      - datalake_crawler_chaves_na_mao_clean.chaves_na_mao.address
    description: |
      The zip_code of the listing.
      It is provided by the original struct field "address".
  latitude:
    lineage:
      - datalake_crawler_chaves_na_mao_clean.chaves_na_mao.geolocation
    description: |
      The latitude associated with the listing location.
      It is provided by the original struct field "geolocation".
  longitude:
    lineage:
      - datalake_crawler_chaves_na_mao_clean.chaves_na_mao.geolocation
    description: |
      The longitude associated with the listing location.
      It is provided by the original struct field "geolocation".
  listing_name:
    lineage:
      - datalake_crawler_chaves_na_mao_clean.chaves_na_mao.listing_name
    description: |
      The name of the listing.
      It is the listing description provided in the origin platform.
  listing_url:
    lineage:
      - datalake_crawler_chaves_na_mao_clean.chaves_na_mao.crawl_metadata
    description: |
      The url of the listing.
      It is provided by the original struct field "crawl_metadata".
  total_area:
    lineage:
      - datalake_crawler_chaves_na_mao_clean.chaves_na_mao.house_info
    description: |
      The total area of the listing in square meters.
      It is extracted from the "house_info" struct field and cast as integer.
  area:
    lineage:
      - datalake_crawler_chaves_na_mao_clean.chaves_na_mao.house_info
    description: |
      The area of the listing in square meters.
      It is extracted from the "house_info" struct field and cast as integer.
  common_items:
    lineage:
      - datalake_crawler_chaves_na_mao_clean.chaves_na_mao.house_info
    description: |
      The listing common itens, such as "Bicicletário", "Interfone", "Jardim", etc.
      It is extracted from the "house_info" struct field.
  privative_items:
    lineage:
      - datalake_crawler_chaves_na_mao_clean.chaves_na_mao.house_info
    description: |
      The listing privative itens, such as "Alarme", "Área de serviço", "Churrasqueira", etc.
      It is extracted from the "house_info" struct field.
  bathrooms:
    lineage:
      - datalake_crawler_chaves_na_mao_clean.chaves_na_mao.house_info
    description: |
      The number of bathrooms in the listing.
