  bedrooms:
    lineage:
      - datalake_crawler_chaves_na_mao_clean.chaves_na_mao.house_info
    description: |
      The number of bedrooms in the listing.
      It is extracted from the "house_info" struct field and cast as integer.
  suites:
    lineage:
      - datalake_crawler_chaves_na_mao_clean.chaves_na_mao.house_info
    description: |
      The number of suites in the listing.
      It is extracted from the "house_info" struct field and cast as integer.
  parking_spaces:
    lineage:
      - datalake_crawler_chaves_na_mao_clean.chaves_na_mao.house_info
    description: |
      The number of parking spaces available in the listing.
      It is extracted from the "house_info" struct field and cast as integer.
  publication_type:
    lineage:
      - datalake_crawler_chaves_na_mao_clean.chaves_na_mao.type
    description: |
      The type of the publication (e.g., normal, featured, etc.).
      It is provided by the original struct field "type", and it can
      assume null values.
  unit_type:
    lineage:
      - datalake_crawler_chaves_na_mao_clean.chaves_na_mao.type
    description: |
      The type of the housing unit (e.g., apartamento, casa / sobrado, etc.).
      It is provided by the original struct field "type", and it can
      assume null values.
  usage_type:
    lineage:
      - datalake_crawler_chaves_na_mao_clean.chaves_na_mao.type
    description: |
      The usage type of the housing unit (e.g., residential, commercial, etc.).
      It is provided by the original struct field "type", and it can
      assume null values.  
  is_for_rent:
    lineage:
      - datalake_crawler_chaves_na_mao_clean.chaves_na_mao.type
    description: |
      Boolean flag indicating if the property is available for rent.
      It is extracted from the "type.operation_type" struct field and cast as boolean.
  is_for_sale:
    lineage:
      - datalake_crawler_chaves_na_mao_clean.chaves_na_mao.type
    description: |
      Boolean flag indicating if the property is available for sale.
