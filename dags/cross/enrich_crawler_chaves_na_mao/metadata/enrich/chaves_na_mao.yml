    description: |
      The timestamp when the listing was created.
      It is provided by the original struct field "date_info".  
  ts_updated:
    lineage:
      - datalake_crawler_chaves_na_mao_clean.chaves_na_mao.date_info
    description: |
      The timestamp when the listing was updated.
      It is provided by the original struct field "date_info".
  year:
    lineage:
      - datalake_crawler_chaves_na_mao_clean.chaves_na_mao.year
    description: |
      The year of the crawler date.
