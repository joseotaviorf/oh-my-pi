      - datalake_crawler_chaves_na_mao_clean.chaves_na_mao.house_info
    description: |
      The rent price per square meter.
      It is calculated by dividing the rental price by the total area,
      rounded to 2 decimal places.
  price_m2_sale:
    lineage:
      - datalake_crawler_chaves_na_mao_clean.chaves_na_mao.price
      - datalake_crawler_chaves_na_mao_clean.chaves_na_mao.house_info
    description: |
      The sale price per square meter.
      It is calculated by dividing the sale price by the total area,
      rounded to 2 decimal places.  
