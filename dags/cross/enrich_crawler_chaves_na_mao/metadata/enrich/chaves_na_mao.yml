      - datalake_crawler_chaves_na_mao_clean.chaves_na_mao.price
    description: |
      The yearly IPTU (property tax) of the listing.
      It is extracted from the "price" struct field and cast as double.
  rent_price:
    lineage:
      - datalake_crawler_chaves_na_mao_clean.chaves_na_mao.price
    description: |
      The rent price of the property.
      It is extracted from the "price" struct field and cast as double.
  sale_price:
    lineage:
      - datalake_crawler_chaves_na_mao_clean.chaves_na_mao.price
    description: |
      The sale price of the property.
      It is extracted from the "price" struct field and cast as double.
  price_m2_rental:
