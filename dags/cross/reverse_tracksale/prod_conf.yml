campaigns:
  # Remaining campaigns still served by the legacy reverse_tracksale DAG until migrated.
  # campaign_code: code of the campaign on Tracksale
  # query: table name
  # tags: the tag display name and the respective column associated
  # trigger_at_hour: the hour (in UTC) that the campaign should be triggered on Tracksale. For Brazil, is 17. For Mexico, is 19
  # trigger_at_minute: the minute of the hour that the campaign should be triggered on Tracksale. It's zero for both countries
