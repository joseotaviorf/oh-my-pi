dag:
  name: reverse_tracksale
  schedule_start_date: 2022, 2, 8
  owner: Data SS
workflow:
  layer: reverse
  type: load_access
  load_spark_job: load_incremental_data_into_datalake_reverse
  spark_job_arguments:
    - "{environment}"
    - "{bucket}"
    - tracksale
    - "{dag_name}"
    - "{table_name}"
    - "{{ ds }}"
  tables_customization:
    into_tracksale: #dummy task
      load_spark_job: load_targets_into_tracksale
cluster:
  type: databricks_12_2_med_2xlarge_general_cluster
  custom_libraries:
    - whl: "{artifacts_bucket}/tracksale-api-client-python/quintoandar_tracksale_api_client-0.3.0-py2.py3-none-any.whl"