---
database_name: datalake_crawler_olx
table_name: olx
description: |
  This table contains enriched fields regarding the OLX crawler data.
  It transforms and flattens the original struct fields from the clean table into
  individual columns for easier analysis and consumption.

  **Key Transformations:**
  - Extracts and flattens JSON struct fields (address, advertiser, house_info, etc.) into individual columns
  - Applies data type casting (integers for numeric fields, booleans for flags, doubles for prices and price_m2)
  - Calculates derived fields like price_m2_rental and price_m2_sale
  - Handles complex city name parsing with regex cleaning
  - Creates composite fields like id_house (id + 'olx') and is_hybrid flag

  **Data Sources:**
  - **2025 onwards:** Sources data from datalake_crawler_olx_clean.olx
  - **2021-2024:** Sources data from datalake_crawlers_listings_clean.olx 

  Data is filtered by the specified load date range to ensure the correct source table is used for each time period.

  **Update Schedule:**
  The table is updated weekly, every Friday, after the datalake_crawler_olx_clean.olx
  table is refreshed. This ensures data consistency and maintains the dependency chain.
domain: Cross
owner: mateus.aferreira@quintoandar.com.br
columns: 
  id_house_platform:
    lineage:
      - datalake_crawler_olx_clean.olx.id
    description: |
      The id of the house in the OLX platform.
  id_house:
    lineage:
      - datalake_crawler_olx_clean.olx.id
    description: |
      It concatenates the id of the house in the OLX platform with the
      string "olx".
  platform:
    lineage:
      - datalake_crawler_olx_clean.olx.origin
    description: |
      The origin of the house, which is always "olx" for this table.
  country:
    lineage:
      - datalake_crawler_olx_clean.olx.address
    description: |
      The country of the house.
      It is provided by the original struct field "address".
  state:
    lineage:
      - datalake_crawler_olx_clean.olx.address
    description: |
      The state of the house.
      It is provided by the original struct field "address".
  address_city:
    lineage:
      - datalake_crawler_olx_clean.olx.address
    description: |
      The city of the house.
      It is provided by the original struct field "address".
      If the original value is null, then it assumes the clean table partition,
      which is the "city" field.
      It doens't assume null values, and it is used as a z_order field for the
      delta table.
  neighborhood:
    lineage:
      - datalake_crawler_olx_clean.olx.address
    description: |
      The neighborhood of the house.
      It is provided by the original struct field "address".
  street:
    lineage:
      - datalake_crawler_olx_clean.olx.address
    description: |
      The street of the house.
      It is provided by the original struct field "address".
  zip_code:
    lineage:
      - datalake_crawler_olx_clean.olx.address
    description: |
      The zip code of the house.
      It is provided by the original struct field "address".
  listing_name:
    lineage:
      - datalake_crawler_olx_clean.olx.listing_name
    description: |
      The name of the listing.
      It is the listing description provided in the origin platform.
  total_area:
    lineage:
      - datalake_crawler_olx_clean.olx.house_info
    description: |
      The total area of the house in square meters.
      It is extracted from the "house_info" struct field and cast as integer.
  amenities:
    lineage:
      - datalake_crawler_olx_clean.olx.house_info
    description: |
      The amenities available in the house, such as pool, balcony, elevator, gym,
      among others.
      It is provided by the original struct field "house_info".
  bathrooms:
    lineage:
      - datalake_crawler_olx_clean.olx.house_info
    description: |
      The number of bathrooms in the house.
      It is extracted from the "house_info" struct field and cast as integer.
  bedrooms:
    lineage:
      - datalake_crawler_olx_clean.olx.house_info
    description: |
      The number of bedrooms in the house.
      It is extracted from the "house_info" struct field and cast as integer.
  parking_spaces:
    lineage:
      - datalake_crawler_olx_clean.olx.house_info
    description: |
      The number of parking spaces available for the house.
      It is extracted from the "house_info" struct field and cast as integer.
  unit_type:
    lineage:
      - datalake_crawler_olx_clean.olx.house_info
    description: |
      The type of the housing unit (e.g., Apartamentos, Casas, etc.).
      It is provided by the original struct field "house_info", and it can
      assume null values.
  unit_subtype:
    lineage:
      - datalake_crawler_olx_clean.olx.house_info
    description: |
      The detailed type of the housing unit (e.g., Padrão, Casa de condomínio, Cobertura, etc.).
      It is provided by the original struct field "house_info", and it can
      assume null values.  
  advertiser_name:
    lineage:
      - datalake_crawler_olx_clean.olx.contact_information
      - datalake_crawler_olx_clean.olx.advertiser
    description: |
      The name of the advertiser/agent responsible for the listing.
      It is provided by the original struct field "contact_information" for data until August 2025.
      After that, it is provided by the original struct field "advertiser".
  advertiser_phone:
    lineage:
      - datalake_crawler_olx_clean.olx.contact_information
      - datalake_crawler_olx_clean.olx.advertiser
    description: |
      The phone number of the advertiser/agent responsible for the listing.
      It is provided by the original struct field "contact_information" for data until August 2025.
      After that, it is provided by the original struct field "advertiser".
  condo_fee:
    lineage:
      - datalake_crawler_olx_clean.olx.house_info
    description: |
      The condominium fee for the property.
      It is extracted from the "house_info" struct field and cast as double.
  iptu:
    lineage:
      - datalake_crawler_olx_clean.olx.house_info
    description: |
      The yearly IPTU (property tax) for the house.
      It is extracted from the "house_info" struct field and cast as double.
  rent_price:
    lineage:
      - datalake_crawler_olx_clean.olx.price
    description: |
      The rent price of the property.
      It is extracted from the "price" struct field and cast as double.
  sale_price:
    lineage:
      - datalake_crawler_olx_clean.olx.price
    description: |
      The sale price of the property.
      It is extracted from the "price" struct field and cast as double.
  price_m2_rental:
    lineage:
      - datalake_crawler_olx_clean.olx.price
      - datalake_crawler_olx_clean.olx.house_info
    description: |
      The rent price per square meter.
      It is calculated by dividing the rental price by the total area,
      rounded to 2 decimal places.
  price_m2_sale:
    lineage:
      - datalake_crawler_olx_clean.olx.price
      - datalake_crawler_olx_clean.olx.house_info
    description: |
      The sale price per square meter.
      It is calculated by dividing the sale price by the total area,
      rounded to 2 decimal places.
  is_for_rent:
    lineage:
      - datalake_crawler_olx_clean.olx.type
    description: |
      Boolean flag indicating if the property is available for rent.
      It is extracted from the "type" struct field and cast as boolean.
  is_for_sale:
    lineage:
      - datalake_crawler_olx_clean.olx.type
    description: |
      Boolean flag indicating if the property is available for sale.
      It is extracted from the "type" struct field and cast as boolean.
  is_hybrid:
    lineage:
      - datalake_crawler_olx_clean.olx.type
    description: |
      Boolean flag indicating if the property is available for both rent and sale.
      It is true when both type.rentable and type.buyable are true, false otherwise.
  ts_created:
    lineage:
      - datalake_crawler_olx_clean.olx.date_info
    description: |
      The timestamp when the listing was created.
      It is provided by the original struct field "date_info".
  year:
    lineage:
      - datalake_crawler_olx_clean.olx.year
    description: |
      The year of the crawler date.
      It is used for data partitioning and filtering purposes.
  month:
    lineage:
      - datalake_crawler_olx_clean.olx.month
    description: |
      The month of the crawler date.
      It is used for data partitioning and filtering purposes.
  day:
    lineage:
      - datalake_crawler_olx_clean.olx.day
    description: |
      The day of the crawler date.
      It is used for data partitioning and filtering purposes.