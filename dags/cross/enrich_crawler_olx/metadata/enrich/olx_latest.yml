---
database_name: datalake_crawler_olx
table_name: olx
description: |
  This table contains the most recent update for each listing regarding the OLX crawler data.
  It provides a deduplicated view of the datalake_crawler_olx.olx table, showing only
  the most recent record per listing (id_house) based on the partition (year, month, day).

  **Deduplication Logic:**
  - Returns the latest update per listing using ROW_NUMBER() OVER(PARTITION BY id_house ORDER BY make_date(year, month, day) DESC) = 1
  - Filters data within the specified load date range

  **Use Case:**
  This table is ideal for analytics requiring the current state of each property without duplicates,
  providing a clean, point-in-time view of the latest available information for each listing.

  **Update Schedule:**
  The table is updated weekly, every Thursday, after the datalake_crawler_olx.olx
  table is refreshed. This ensures data consistency and maintains the dependency chain.
domain: Cross
owner: mateus.aferreira@quintoandar.com.br
columns: 
  id_house_platform:
    lineage:
      - datalake_crawler_olx.olx.id_house_platform
    description: |
      The id of the house in the OLX platform.
  id_house:
    lineage:
      - datalake_crawler_olx.olx.id_house
    description: |
      It concatenates the id of the house in the OLX platform with the
      string "olx".
  platform:
    lineage:
      - datalake_crawler_olx.olx.platform
    description: |
      The origin of the house, which is always "olx" for this table.
  country:
    lineage:
      - datalake_crawler_olx.olx.country
    description: |
      The country of the house.
  state:
    lineage:
      - datalake_crawler_olx.olx.state
    description: |
      The state of the house.
  address_city:
    lineage:
      - datalake_crawler_olx.olx.address_city
    description: |
      The city of the house.
      It doens't assume null values, and it is used as a z_order field for the
