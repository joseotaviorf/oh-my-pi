database_name: datalake_unified_potential_listing
table_name: potential_listing_b2b
owner: cristina.cardoso@quintoandar.com.br
domain: Growth
description: Table utilized by the Growth team to describe the flows that have the potential to become listings.
columns:
  id:
    description: Id of the listing flow. It is generated artificially with a row_number in the datalake_listing_flow.listing_flow table.
    lineage:
      - datalake_listing_flow.listing_flows_with_reprocessed_leads.id
  business_context:
    description: Business context of the event/house.
    lineage:
      - datalake_listing_flow.listing_flows_with_reprocessed_leads.listing_flow_business_context
      - datalake_ebdb_listing.listing_business_context
  id_condo:
    description: Id of the condo.
    lineage:
      - datalake_ebdb_listing.house.id_condo_parent
  id_house_listing:
    description: Id of the house.
    lineage:
      - datalake_listing_flow.listing_flows_with_reprocessed_leads.id_house
      - datalake_ebdb_listing.house_listing.version
  id_partner:
    description: Id of the partner agent.
    lineage:
      - datalake_listing_flow.listing_flows_with_reprocessed_leads.id_partner
      - datalake_ebdb_clean.partner_agent.id_partner
  id_autonomous_agent:
    description: ID of the autonomous agent when the listing flow has one.
    lineage:
      - datalake_ebdb_clean.partner_agent.id_user
  id_user_registrant:
    description: ID of the user registrant.
    lineage:
      - datalake_ebdb_listing.house.id_user_registrant
  is_exclusive:
    description: If the listing is exclusive.
    lineage:
      - datalake_ebdb_listing.house.is_exclusive
  is_autonomous_agent:
    description: If the listing flow has an autonomous agent.
    lineage:
      - datalake_ebdb_clean.partner_agent.id_user