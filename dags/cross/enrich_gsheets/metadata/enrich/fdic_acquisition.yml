---
database_name: datalake_gsheets
table_name: fdic_acquisition
description: Table that consolidates the acquisition data from FDIC gsheets.
  It contains data from 2021, 2022 and 2023.
domain: Fintech
owner: kleber.inoue@quintoandar.com.br
columns:
  id_vx_security:
    lineage:
      - datalake_gsheets_clean.fdic_acquisition_2021.id_vx_security
      - datalake_gsheets_clean.fdic_acquisition_2022.id_vx_security
      - datalake_gsheets_clean.fdic_acquisition_2023.id_vx_security
    description: ID of Vortex security (title).
  assignor_cnpj:
    lineage:
      - datalake_gsheets_clean.fdic_acquisition_2021.assignor_cnpj
      - datalake_gsheets_clean.fdic_acquisition_2022.assignor_cnpj
      - datalake_gsheets_clean.fdic_acquisition_2023.assignor_cnpj
    description: The CNPJ (Corporate Tax Code) of the company that is assigned at.
  assignor_name:
    lineage:
      - datalake_gsheets_clean.fdic_acquisition_2021.assignor_name
      - datalake_gsheets_clean.fdic_acquisition_2022.assignor_name
      - datalake_gsheets_clean.fdic_acquisition_2023.assignor_name
    description: Name of the company that is assigned at.
  withdraw_cnpj_cpf:
    lineage:
      - datalake_gsheets_clean.fdic_acquisition_2021.withdraw_cnpj_cpf
      - datalake_gsheets_clean.fdic_acquisition_2022.withdraw_cnpj_cpf
      - datalake_gsheets_clean.fdic_acquisition_2023.withdraw_cnpj_cpf
    description: CPNJ (Corporate Tax Code) or CPF (Individual Taxpayer Registration)
      from the person that will withdraw.
  withdraw_name:
    lineage:
      - datalake_gsheets_clean.fdic_acquisition_2021.withdraw_name
      - datalake_gsheets_clean.fdic_acquisition_2022.withdraw_name
      - datalake_gsheets_clean.fdic_acquisition_2023.withdraw_name
    description: Person name that will withdraw.
  type:
    lineage:
      - datalake_gsheets_clean.fdic_acquisition_2021.type
      - datalake_gsheets_clean.fdic_acquisition_2022.type
      - datalake_gsheets_clean.fdic_acquisition_2023.type
    description: Type.
  asset_type:
    lineage:
      - datalake_gsheets_clean.fdic_acquisition_2021.asset_type
      - datalake_gsheets_clean.fdic_acquisition_2022.asset_type
      - datalake_gsheets_clean.fdic_acquisition_2023.asset_type
    description: Type of the asset.
  key_field:
    lineage:
      - datalake_gsheets_clean.fdic_acquisition_2021.key_field
      - datalake_gsheets_clean.fdic_acquisition_2022.key_field
      - datalake_gsheets_clean.fdic_acquisition_2023.key_field
    description: Key field. It has the same value of security_number column
      with the last two characters (/X, X = number)
  cmc7:
    lineage:
      - datalake_gsheets_clean.fdic_acquisition_2021.cmc7
      - datalake_gsheets_clean.fdic_acquisition_2022.cmc7
      - datalake_gsheets_clean.fdic_acquisition_2023.cmc7
    description: CMC7. It has NULL value.
  security_number:
    lineage:
      - datalake_gsheets_clean.fdic_acquisition_2021.security_number
      - datalake_gsheets_clean.fdic_acquisition_2022.security_number
      - datalake_gsheets_clean.fdic_acquisition_2023.security_number
    description: Security (title) value. It does not contains the installment number in the final.
  installment_number:
    lineage:
      - datalake_gsheets_clean.fdic_acquisition_2021.security_number
      - datalake_gsheets_clean.fdic_acquisition_2022.security_number
      - datalake_gsheets_clean.fdic_acquisition_2023.security_number
    description: Installment number.
  acquisition_value:
    lineage:
      - datalake_gsheets_clean.fdic_acquisition_2021.acquisition_value
      - datalake_gsheets_clean.fdic_acquisition_2022.acquisition_value
      - datalake_gsheets_clean.fdic_acquisition_2023.acquisition_value
    description: Acquisition value.
  nominal_value:
    lineage:
      - datalake_gsheets_clean.fdic_acquisition_2021.nominal_value
      - datalake_gsheets_clean.fdic_acquisition_2022.nominal_value
      - datalake_gsheets_clean.fdic_acquisition_2023.nominal_value
    description: Nominal value.
  invoice_number:
    lineage:
      - datalake_gsheets_clean.fdic_acquisition_2021.invoice_number
      - datalake_gsheets_clean.fdic_acquisition_2022.invoice_number
      - datalake_gsheets_clean.fdic_acquisition_2023.invoice_number
    description: Number of the invoice.
  accrual_year_month:
    lineage:
      - datalake_gsheets_clean.fdic_acquisition_2021.dt_acquisition
      - datalake_gsheets_clean.fdic_acquisition_2022.dt_acquisition
      - datalake_gsheets_clean.fdic_acquisition_2023.dt_acquisition
    description: Year and month reference from dt_acquisition column.
  dt_emission:
    lineage:
      - datalake_gsheets_clean.fdic_acquisition_2021.dt_emission
      - datalake_gsheets_clean.fdic_acquisition_2022.dt_emission
      - datalake_gsheets_clean.fdic_acquisition_2023.dt_emission
    description: Emission date.
  dt_acquisition:
    lineage:
      - datalake_gsheets_clean.fdic_acquisition_2021.dt_acquisition
      - datalake_gsheets_clean.fdic_acquisition_2022.dt_acquisition
      - datalake_gsheets_clean.fdic_acquisition_2023.dt_acquisition
    description: Acquisition date.
  dt_due:
    lineage:
      - datalake_gsheets_clean.fdic_acquisition_2021.dt_due
      - datalake_gsheets_clean.fdic_acquisition_2022.dt_due
      - datalake_gsheets_clean.fdic_acquisition_2023.dt_due
    description: Due date.
  