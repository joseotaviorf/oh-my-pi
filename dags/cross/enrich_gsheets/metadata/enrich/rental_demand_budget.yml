database_name: datalake_gsheets
table_name: rental_demand_budget
description: Enriched consolidation of For Rent demand budget metrics across annual budget spreadsheets (2024 and 2025). Unifies funnel stage volumes for planning and performance tracking.
domain: For Rent
owner: uilson.bonfim@quintoandar.com.br
columns:
  city_group:
    lineage:
      - datalake_gsheets_clean.rent_demand_budget_2024.city_group
      - datalake_gsheets_clean.rent_demand_budget_2025.city_group
    description: QuintoAndar city group associated with the rental demand budget row.
  contracts_signed:
    lineage:
      - datalake_gsheets_clean.rent_demand_budget_2024.contracts_signed
      - datalake_gsheets_clean.rent_demand_budget_2025.contracts_signed
    description: Budgeted volume of rental contracts signed in the demand funnel.
  credit_approved:
    lineage:
      - datalake_gsheets_clean.rent_demand_budget_2024.credit_approved
      - datalake_gsheets_clean.rent_demand_budget_2025.credit_approved
    description: Budgeted volume of tenant credit approvals in the rental demand funnel.
  dt_budget:
    lineage:
      - datalake_gsheets_clean.rent_demand_budget_2024.date
      - datalake_gsheets_clean.rent_demand_budget_2025.date
    description: Parsed reference date identifying the rental demand budget period.
  documentation_sent:
    lineage:
      - datalake_gsheets_clean.rent_demand_budget_2024.documentation_sent
      - datalake_gsheets_clean.rent_demand_budget_2025.documentation_sent
    description: Budgeted volume of rental documentation packages sent to tenants.
  evaluation_positive:
    lineage:
      - datalake_gsheets_clean.rent_demand_budget_2024.evaluation_positive
      - datalake_gsheets_clean.rent_demand_budget_2025.evaluation_positive
    description: Budgeted volume of positive tenant evaluations in the rental demand funnel.
  evaluation_started:
    lineage:
      - datalake_gsheets_clean.rent_demand_budget_2024.evaluation_started
      - datalake_gsheets_clean.rent_demand_budget_2025.evaluation_started
    description: Budgeted volume of tenant evaluations started in the rental demand funnel.
  offers_accepted:
    lineage:
      - datalake_gsheets_clean.rent_demand_budget_2024.offers_accepted
      - datalake_gsheets_clean.rent_demand_budget_2025.offers_accepted
    description: Budgeted volume of rental offers accepted by stakeholders.
  offers_submitted:
    lineage:
      - datalake_gsheets_clean.rent_demand_budget_2024.offers_submitted
      - datalake_gsheets_clean.rent_demand_budget_2025.offers_submitted
    description: Budgeted volume of rental offers submitted by prospective tenants.
  rent_flow_origin:
    lineage:
      - datalake_gsheets_clean.rent_demand_budget_2024.rent_flow_origin
      - datalake_gsheets_clean.rent_demand_budget_2025.rent_flow_origin
    description: Funnel touchpoint or origin channel associated with the rental demand budget row.
  rental_administrator:
    lineage:
      - datalake_gsheets_clean.rent_demand_budget_2024.rental_administrator
      - datalake_gsheets_clean.rent_demand_budget_2025.rental_administrator
    description: Contract administrator responsible for listings covered by the demand budget.
  visits_booked:
    lineage:
      - datalake_gsheets_clean.rent_demand_budget_2024.visits_booked
      - datalake_gsheets_clean.rent_demand_budget_2025.visits_booked
    description: Budgeted volume of property visits booked by prospective tenants.
  visits_completed:
    lineage:
      - datalake_gsheets_clean.rent_demand_budget_2024.visits_completed
      - datalake_gsheets_clean.rent_demand_budget_2025.visits_completed
    description: Budgeted volume of property visits completed by prospective tenants.
  business_type:
    lineage:
      - datalake_gsheets_clean.rent_demand_budget_2024.business_type
      - datalake_gsheets_clean.rent_demand_budget_2025.business_type
    description: Business segment or product line associated with the rental demand budget.
