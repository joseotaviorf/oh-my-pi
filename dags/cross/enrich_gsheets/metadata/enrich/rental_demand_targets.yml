---
database_name: datalake_gsheets
table_name: rental_demand_targets
description: Enriched consolidation of For Rent demand targets from historical gsheets and static files. Unifies funnel volumes and calendar dimensions for cross-year rental demand planning.
domain: For Rent
owner: gustavo.silva@quintoandar.com.br
columns:
  city_group:
    lineage:
      - datalake_gsheets_clean.demand_targets_2022.city_group
      - datalake_static_files.rental_demand_targets.city_group
    description: QuintoAndar city group associated with the rental demand target row.
  demand_channel:
    lineage:
      - datalake_gsheets_clean.demand_targets_2022.demand_channel
      - datalake_static_files.rental_demand_targets.demand_channel
    description: Acquisition or engagement channel associated with the rental demand target.
  demand_channel_type:
    lineage:
      - datalake_gsheets_clean.demand_targets_2022.demand_channel_type
      - datalake_static_files.rental_demand_targets.demand_channel_type
    description: Channel type classification for the rental demand target planning row.
  funnel_origin:
    lineage:
      - datalake_gsheets_clean.demand_targets_2022.funnel_origin
      - datalake_static_files.rental_demand_targets.funnel_origin
