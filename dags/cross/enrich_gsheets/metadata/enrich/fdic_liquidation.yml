---
database_name: datalake_gsheets
table_name: fdic_liquidation
description: Table that consolidates the liquidation data from FDIC gsheets.
  It contains data from 2021, 2022 and 2023.
domain: Fintech
owner: kleber.inoue@quintoandar.com.br
columns:
  id_vx_security:
    lineage:
      - datalake_gsheets_clean.fdic_liquidation_2021.id_vx_security
      - datalake_gsheets_clean.fdic_liquidation_2022.id_vx_security
      - datalake_gsheets_clean.fdic_liquidation_2023.id_vx_security
    description: ID of Vortex security (title).
  id_vortex_security_wave_effect:
    lineage:
      - datalake_gsheets_clean.fdic_liquidation_2021.id_vortex_security_wave_effect
      - datalake_gsheets_clean.fdic_liquidation_2022.id_vortex_security_wave_effect
      - datalake_gsheets_clean.fdic_liquidation_2023.id_vortex_security_wave_effect
    description: ID of Vortex security (title) from a wave effect (efeito vagao).
  id_occurrence:
    lineage:
      - datalake_gsheets_clean.fdic_liquidation_2021.id_occurrence
      - datalake_gsheets_clean.fdic_liquidation_2022.id_occurrence
      - datalake_gsheets_clean.fdic_liquidation_2023.id_occurrence
    description: ID occurrence.
  id_invoice_bank:
    lineage:
      - datalake_gsheets_clean.fdic_liquidation_2021.id_invoice_bank
      - datalake_gsheets_clean.fdic_liquidation_2022.id_invoice_bank
      - datalake_gsheets_clean.fdic_liquidation_2023.id_invoice_bank
    description: ID invoice.
  security_number:
    lineage:
      - datalake_gsheets_clean.fdic_liquidation_2021.security_number
      - datalake_gsheets_clean.fdic_liquidation_2022.security_number
      - datalake_gsheets_clean.fdic_liquidation_2023.security_number
    description: Security (title) value. It does not contains the installment number in the final.
  assignor_cnpj:
    lineage:
      - datalake_gsheets_clean.fdic_liquidation_2021.assignor_cnpj
      - datalake_gsheets_clean.fdic_liquidation_2022.assignor_cnpj
      - datalake_gsheets_clean.fdic_liquidation_2023.assignor_cnpj
    description: The CNPJ (Corporate Tax Code) of the company that is assigned at.
  assignor_name:
    lineage:
      - datalake_gsheets_clean.fdic_liquidation_2021.assignor_name
      - datalake_gsheets_clean.fdic_liquidation_2022.assignor_name
      - datalake_gsheets_clean.fdic_liquidation_2023.assignor_name
    description: Name of the company that is assigned at.
  withdraw_cnpj_cpf:
    lineage:
      - datalake_gsheets_clean.fdic_liquidation_2021.withdraw_cnpj_cpf
      - datalake_gsheets_clean.fdic_liquidation_2022.withdraw_cnpj_cpf
      - datalake_gsheets_clean.fdic_liquidation_2023.withdraw_cnpj_cpf
    description: CPNJ (Corporate Tax Code) or CPF (Individual Taxpayer Registration)
      from the person that will withdraw.
  withdraw_name:
    lineage:
      - datalake_gsheets_clean.fdic_liquidation_2021.withdraw_name
      - datalake_gsheets_clean.fdic_liquidation_2022.withdraw_name
      - datalake_gsheets_clean.fdic_liquidation_2023.withdraw_name
    description: Person name that will withdraw.
  occurrence:
    lineage:
      - datalake_gsheets_clean.fdic_liquidation_2021.occurrence
      - datalake_gsheets_clean.fdic_liquidation_2022.occurrence
      - datalake_gsheets_clean.fdic_liquidation_2023.occurrence
    description: Occurrence type.
  situation:
    lineage:
      - datalake_gsheets_clean.fdic_liquidation_2021.situation
      - datalake_gsheets_clean.fdic_liquidation_2022.situation
      - datalake_gsheets_clean.fdic_liquidation_2023.situation
    description: Situation of the liquidation.
  asset_type:
    lineage:
      - datalake_gsheets_clean.fdic_liquidation_2021.asset_type
      - datalake_gsheets_clean.fdic_liquidation_2022.asset_type
      - datalake_gsheets_clean.fdic_liquidation_2023.asset_type
    description: Type of the asset.
  key_field:
    lineage:
      - datalake_gsheets_clean.fdic_liquidation_2021.key_field
      - datalake_gsheets_clean.fdic_liquidation_2022.key_field
      - datalake_gsheets_clean.fdic_liquidation_2023.key_field
    description: Key field. It has the same value of security_number column
      with the last two characters (/X, X = number)
  is_wave_effect_generator:
    description: Boolean flag to check if the liquidation came from a wave effect (efeito vagao).
  nominal_value:
    lineage:
      - datalake_gsheets_clean.fdic_liquidation_2021.nominal_value
      - datalake_gsheets_clean.fdic_liquidation_2022.nominal_value
      - datalake_gsheets_clean.fdic_liquidation_2023.nominal_value
