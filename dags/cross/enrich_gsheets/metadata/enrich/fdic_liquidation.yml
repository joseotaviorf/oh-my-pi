    description: Number of the invoice.
  description_status:
    lineage:
      - datalake_gsheets_clean.fdic_liquidation_2021.description_status
      - datalake_gsheets_clean.fdic_liquidation_2022.description_status
      - datalake_gsheets_clean.fdic_liquidation_2023.description_status
