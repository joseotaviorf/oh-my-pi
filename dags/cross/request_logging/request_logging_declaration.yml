dag:
  name: request_logging
  schedule_start_date: 2026, 4, 22
  schedule_interval: 30 22 * * *
  owner: Data ForSale
  documentation:
    dag_purpose: |
      Load data of the request logging to the Clean layer, the Raw layer is loaded by custom ingestion.
      Request logging is a tool that is introduced in all binaries that use Qantilever.
workflow:
  layer: raw
  type: custom_ingestion
  load_spark_job: fetch_data
  spark_job_arguments:
    - "{dag_name}"
    - "{environment}"
    - "{bucket}"
    - "{{ get_date_param(dag_run, data_interval_start | ts, 'load_start_date')
      }}"
    - "{{ get_date_param(dag_run, data_interval_end | ts, 'load_end_date') }}"
    - "{table_name}"
  default_raw_partitions: [ year, month, day ]
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ts,
      'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_end | ts, 'load_end_date') }}"
  tables_customization:
    visits:
      merge_on: [ id_request ]
      partitions: [ year, month, day ]
      z_order_by: [ ts_request ]
    collections:
      merge_on: [ id_request ]
      partitions: [ year, month, day ]
      z_order_by: [ ts_request ]
    entryaccess:
      merge_on: [ id_request ]
      partitions: [ year, month, day ]
      z_order_by: [ ts_request ]
