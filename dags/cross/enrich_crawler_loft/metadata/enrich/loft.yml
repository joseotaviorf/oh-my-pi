---
database_name: datalake_crawler_loft
table_name: loft
description: |
  This table contains enriched fields regarding the loft crawler data.
  It transforms and flattens the original struct fields from the clean table into
  individual columns for easier analysis and consumption.

  **Key Transformations:**
  - Extracts and flattens JSON struct fields (address, price, house_info, etc.) into individual columns
  - Applies data type casting (integers for numeric fields, booleans for flags, doubles for prices and price_m2)
  - Calculates derived fields like price_m2_rental and price_m2_sale
  - Handles complex city name parsing with regex cleaning
  - Creates composite fields like id_house (id + 'loft') and is_hybrid flag

  **Data Sources:**
  - **2025 onwards:** Sources data from datalake_crawler_loft_clean.loft
  - **2021-2024:** Sources data from datalake_crawlers_listings_clean.loft 

  Data is filtered by the specified load date range to ensure the correct source table is used for each time period.

  **Update Schedule:**
  The table is updated weekly, every Thursday, after the datalake_crawler_loft_clean.loft
  table is refreshed. This ensures data consistency and maintains the dependency chain.
domain: Cross
owner: mateus.aferreira@quintoandar.com.br
columns: 
  id_house_platform:
    lineage:
      - datalake_crawler_loft_clean.loft.id
    description: |
      The id of the house in the loft platform.
  id_house:
    lineage:
      - datalake_crawler_loft_clean.loft.id
    description: |
      It concatenates the id of the house in the loft platform with the
      string "loft".
  platform:
    lineage:
      - datalake_crawler_loft_clean.loft.origin
    description: |
      The origin of the house, which is always "loft" for this table.
  country:
    lineage:
      - datalake_crawler_loft_clean.loft.address
    description: |
      The country of the house.
      It is provided by the original struct field "address".
  state:
    lineage:
      - datalake_crawler_loft_clean.loft.address
    description: |
      The state of the house.
      It is provided by the original struct field "address".
  address_city:
    lineage:
      - datalake_crawler_loft_clean.loft.address
    description: |
      The city of the house.
      It is provided by the original struct field "address".
      If the original value is null, then it assumes the clean table partition,
      which is the "city" field.
      It doens't assume null values, and it is used as a z_order field for the
      delta table.
  neighborhood:
    lineage:
      - datalake_crawler_loft_clean.loft.address
    description: |
      The neighborhood of the house.
      It is provided by the original struct field "address".
  street:
    lineage:
      - datalake_crawler_loft_clean.loft.address
    description: |
      The street of the house.
      It is provided by the original struct field "address".
  latitude:
    lineage:
      - datalake_crawler_loft_clean.loft.geolocation
    description: |
      The latitude associated with the listing location.
      It is provided by the original struct field "geolocation".
  longitude:
    lineage:
      - datalake_crawler_loft_clean.loft.geolocation
    description: |
      The longitude associated with the listing location.
      It is provided by the original struct field "geolocation".
  listing_name:
    lineage:
      - datalake_crawler_loft_clean.loft.listing_name
    description: |
      The name of the listing.
      It is the listing description provided in the origin platform.
  total_area:
    lineage:
      - datalake_crawler_loft_clean.loft.house_info
    description: |
      The total area of the house in square meters.
      It is extracted from the "house_info" struct field and cast as integer.
  area:
    lineage:
      - datalake_crawler_loft_clean.loft.house_info
    description: |
      The area of the house in square meters.
      It is extracted from the "house_info" struct field and cast as integer.
  bathrooms:
    lineage:
      - datalake_crawler_loft_clean.loft.house_info
    description: |
      The number of bathrooms in the house.
      It is extracted from the "house_info" struct field and cast as integer.
  bedrooms:
    lineage:
      - datalake_crawler_loft_clean.loft.house_info
    description: |
      The number of bedrooms in the house.
      It is extracted from the "house_info" struct field and cast as integer.
  suites:
    lineage:
      - datalake_crawler_loft_clean.loft.house_info
    description: |
      The number of suites in the house.
      It is extracted from the "house_info" struct field and cast as integer.
  floor:
    lineage:
      - datalake_crawler_loft_clean.loft.house_info
    description: |
      The floor number of the house.
      It is extracted from the "house_info" struct field and cast as integer.
  parking_spaces:
    lineage:
      - datalake_crawler_loft_clean.loft.house_info
    description: |
      The number of parking spaces available for the house.
      It is extracted from the "house_info" struct field and cast as integer.
  unit_type:
    lineage:
      - datalake_crawler_loft_clean.loft.house_info
    description: |
      The type of the housing unit (e.g., apartment, house, etc.).
      It is provided by the original struct field "house_info", and it can
      assume null values.
  usage_type:
    lineage:
      - datalake_crawler_loft_clean.loft.house_info
    description: |
      The usege type of the housing unit (e.g., RESIDENTIAL, etc.).
      It is provided by the original struct field "house_info", and it can
      assume null values.  
  property_type:
    lineage:
      - datalake_crawler_loft_clean.loft.property_type
    description: |
      The property type of the housing unit (e.g., default, rooftop, etc.).
      It can assume null values.
  contract_type:
    lineage:
      - datalake_crawler_loft_clean.loft.contract_type
    description: |
      The contract type of the housing unit (non_exclusive or exclusive).
  advertiser_name:
    lineage:
      - datalake_crawler_loft_clean.loft.agency_name
    description: |
      The name of the advertiser/agent responsible for the listing.
  has_advertiser:
    lineage:
      - datalake_crawler_loft_clean.loft.has_agency
    description: |
      Boolean that indicates if the listing has an advertiser/agent associated with it.
  is_marketplace:
    lineage:
      - datalake_crawler_loft_clean.loft.is_marketplace
    description: |
      Boolean that indicates if the listing is part of Loft's marketplace.
  condo_fee:
    lineage:
      - datalake_crawler_loft_clean.loft.price
    description: |
      The condominium fee for the property.
      It is extracted from the "price" struct field and cast as double.
  iptu:
    lineage:
      - datalake_crawler_loft_clean.loft.price
    description: |
      The monthly IPTU (property tax) for the house.
      It is extracted from the "price" struct field and cast as double.
  rent_price:
    lineage:
      - datalake_crawler_loft_clean.loft.price
    description: |
      The rent price of the property.
      It is extracted from the "price" struct field and cast as double.
  sale_price:
    lineage:
      - datalake_crawler_loft_clean.loft.price
    description: |
      The sale price of the property.
      It is extracted from the "price" struct field and cast as double.
  price_m2_rental:
    lineage:
      - datalake_crawler_loft_clean.loft.price
      - datalake_crawler_loft_clean.loft.house_info
    description: |
      The rent price per square meter.
      It is calculated by dividing the rental price by the total area,
      rounded to 2 decimal places.
  price_m2_sale:
    lineage:
      - datalake_crawler_loft_clean.loft.price
      - datalake_crawler_loft_clean.loft.house_info
    description: |
      The sale price per square meter.
      It is calculated by dividing the sale price by the total area,
      rounded to 2 decimal places.
  installments_price:
    lineage:
      - datalake_crawler_loft_clean.loft.installments_price
    description: |
      Amount of the installment if the listing is financed, currently zero for all listings.
  is_for_rent:
    lineage:
      - datalake_crawler_loft_clean.loft.type
    description: |
      Boolean flag indicating if the property is available for rent.
      It is extracted from the "type" struct field and cast as boolean.
  is_for_sale:
    lineage:
      - datalake_crawler_loft_clean.loft.type
    description: |
      Boolean flag indicating if the property is available for sale.
      It is extracted from the "type" struct field and cast as boolean.
  is_hybrid:
    lineage:
      - datalake_crawler_loft_clean.loft.type
    description: |
      Boolean flag indicating if the property is available for both rent and sale.
      It is true when both type.rentable and type.buyable are true, false otherwise.
  ts_created:
    lineage:
      - datalake_crawler_loft_clean.loft.date_info
    description: |
      The timestamp when the listing was created.
      It is provided by the original struct field "date_info".
  year:
    lineage:
      - datalake_crawler_loft_clean.loft.year
    description: |
      The year of the crawler date.
      It is used for data partitioning and filtering purposes.
  month:
    lineage:
      - datalake_crawler_loft_clean.loft.month
    description: |
      The month of the crawler date.
      It is used for data partitioning and filtering purposes.
  day:
    lineage:
      - datalake_crawler_loft_clean.loft.day
    description: |
      The day of the crawler date.
      It is used for data partitioning and filtering purposes.