dag:
  name: crawler_df_imoveis
  owner: Data Growth
  schedule_start_date: 2025, 11, 17
  schedule_interval: "0 0 * * 4" # Every Thursday at 00:00 BRT
  documentation:
    dag_purpose: |
      This DAG ingests weekly data from the DF Imóveis crawler,
      with the source data stored in an S3 bucket.
      It runs every Thursday at 00:00 BRT, to update the data from the current week,
      which is provided every Wednesday by the crawler provider.
workflow:
  layer: raw
  type: custom_ingestion
  spark_job_prefix: base
  load_spark_job: load_growth_intel_crawler_raw
  default_extraction_type: incremental
  default_partitions: [year, month, day]
  has_hive_sync: false
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_end | ds, 'load_end_date') }}"
  spark_job_arguments:
    - "{environment}" # env
    - "{bucket}" # datalake_bucket
    - "crawler_df_imoveis" # source
    - "{table_name}" # table_name
    - "{partitions}" # partition_cols
    - "{load_start_date}" # load_start_date
    - "{load_end_date}" # load_end_date
    - "s3://listing-crawler.s3.data.quintoandar.com.br/spinver/crawler_data/" # source_root_path
    - "dfimoveis" # origin
  tables_customization:
    df_imoveis:
      z_order_by: [city]
