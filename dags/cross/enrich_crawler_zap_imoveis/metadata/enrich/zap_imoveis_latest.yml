---
database_name: datalake_crawler_zap_imoveis
table_name: zap_imoveis_latest
description: |
  This table contains the latest/most recent update for each property from the Zap Imóveis crawler data.
  It provides a deduplicated view of the datalake_crawler_zap_imoveis.zap_imoveis table, showing only
  the most recent record per property (id_house) based on the ts_updated timestamp.

  **Deduplication Logic:**
  - Only includes records where ts_updated is not null
  - Returns the latest update per property using ROW_NUMBER() OVER(PARTITION BY id_house ORDER BY ts_updated DESC) = 1
  - Filters data within the specified load date range

  **Use Case:**
  This table is ideal for analytics requiring the current state of each property without historical duplicates,
  providing a clean, point-in-time view of the latest available information for each listing.

  **Update Schedule:**
  The table is updated weekly, every Thursday, after the datalake_crawler_zap_imoveis.zap_imoveis
  table is refreshed. This ensures data consistency and maintains the dependency chain.
domain: Cross
owner: mateus.aferreira@quintoandar.com.br
