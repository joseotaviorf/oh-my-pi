dag:
  name: enrich_crawler_zap_imoveis
  owner: Data Growth
  schedule_start_date: 2025, 8, 17
  documentation:
    dag_purpose: |
      This DAG is responsible for enriching the crawler_zap_imoveis data.
      It split the original struct fields into multiple columns, and creates
      generic enriched fields for the house domain.
      It is weekly updated, every Thursday, after the datalake_crawler_zap_imoveis_clean.zap_imoveis table
      is updated. It also creates a full table, zap_imoveis_latest, with the latest data for the house.
workflow:
  layer: enrich
  type: query_delta
  has_hive_sync: false
  inner_dependencies:
    zap_imoveis_latest:
      - zap_imoveis
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_end | ds, 'load_end_date') }}"
  tables_customization:
    zap_imoveis:
      extraction_type: incremental
      partitions: ["year", "month", "day"]
      z_order_by: ["address_city"]
    zap_imoveis_latest:
      extraction_type: full
      merge_on: ["id_house"]
      when_matched_update_condition: "source.ts_updated > target.ts_updated"
      z_order_by: ["address_city"]
