---
database_name: datalake_jira_bugs
table_name: bug_issues
description: Enriched Jira issues table (Bugs project) with context, SLAs, and comments/attachments summaries. Partitioned by year, month, day. Always filter on year, month, day in WHERE clauses to enable partition pruning and avoid full table scans. When filtering by id_issue, id_line, combine partition predicates with those columns to benefit from Z-order clustering and data skipping.
domain: Cross
owner: anne.macedo@quintoandar.com.br
columns:
  id_issue:
    lineage:
      - datalake_jira_clean.issues.key
    description: Issue identifier in Jira
  id_project:
    lineage:
      - datalake_jira_clean.issues.fields.project.id
    description: Internal Jira project identifier
  id_workspace:
    lineage:
      - datalake_jira_clean.issues.fields.customfield_25330.objectId
      - datalake_jira_clean.issues.fields.customfield_25330.workspaceId
    description: Associated workspace identifier (custom field)
  id_request_type:
    lineage:
      - datalake_jira_clean.issues.fields.customfield_10200.requestType.id
    description: Jira Service Management request type identifier
  id_issue_type:
    lineage:
      - datalake_jira_clean.issues.fields.customfield_10200.requestType.issueTypeId
    description: Issue type identifier associated with the request type
  id_assignee_account:
    lineage:
      - datalake_jira_clean.issues.fields.assignee.accountId
    description: Account ID of the current assignee
  id_reporter_account:
    lineage:
      - datalake_jira_clean.issues.fields.reporter.accountId
    description: Atlassian account identifier of the user who reported the Jira bug issue.
  id_creator_account:
    lineage:
      - datalake_jira_clean.issues.fields.creator.accountId
    description: Account ID of the issue creator
  id_dag:
    lineage:
      - datalake_jira_clean.issues.fields.customfield_25330.objectId
    description: DAG identifier (custom field)
  id_line:
    lineage:
      - datalake_jira_clean.issues.fields.customfield_25331.objectId
    description: Line identifier (custom field)
  project_key:
    lineage:
      - datalake_jira_clean.issues.fields.project.key
    description: Short Jira project key identifying the Bugs project workspace for the issue.
  project_name:
    lineage:
      - datalake_jira_clean.issues.fields.project.name
    description: Human-readable Jira project name associated with the bug issue record.
  summary:
    lineage:
      - datalake_jira_clean.issues.fields.summary
    description: Issue title/summary
  issue_type_name:
    lineage:
      - datalake_jira_clean.issues.fields.issuetype.name
    description: Issue type name (e.g., Bug, Task)
  issue_description:
    lineage:
      - datalake_jira_clean.issues.fields.description
    description: Free-text description body of the bug issue as entered in Jira.
  priority:
    lineage:
      - datalake_jira_clean.issues.fields.priority.name
    description: Jira priority label assigned to the bug issue for triage and SLA routing.
  request_type_name:
    lineage:
      - datalake_jira_clean.issues.fields.customfield_10200.requestType.name
    description: Jira Service Management request type name
  assignee_name:
    lineage:
      - datalake_jira_clean.issues.fields.assignee.displayName
    description: Display name of the Jira user currently assigned to resolve the bug issue.
  assignee_email:
    lineage:
      - datalake_jira_clean.issues.fields.assignee.emailAddress
    description: Email address of the Jira user currently assigned to the bug issue.
  reporter_name:
    lineage:
      - datalake_jira_clean.issues.fields.reporter.displayName
    description: Display name of the Jira user who originally reported the bug issue.
  reporter_email:
    lineage:
      - datalake_jira_clean.issues.fields.reporter.emailAddress
    description: Email address of the Jira user who originally reported the bug issue.
  creator_name:
    lineage:
      - datalake_jira_clean.issues.fields.creator.displayName
    description: Display name of the Jira user who created the bug issue record.
  creator_email:
    lineage:
      - datalake_jira_clean.issues.fields.creator.emailAddress
    description: Email address of the Jira user who created the bug issue record.
  line_name:
    lineage:
      - datalake_jira_clean.issues.fields.customfield_12221.value
    description: Line name (custom field)
  squad_name:
    lineage:
      - datalake_jira_clean.issues.fields.customfield_11356.value
    description: Current squad name (custom field)
  initial_squad_name:
    lineage:
      - datalake_jira_clean.issues.fields.customfield_11681
    description: Initial squads list (custom field)
  dag:
    lineage:
      - datalake_jira_clean.issues.fields.customfield_22692.value
    description: Impacted DAG from the form (customfield_22692)
  problem_type:
    lineage:
      - datalake_jira_clean.issues.fields.customfield_22689.value
    description: |
      Form answer - which module has the issue.
      Field: [Form S&S Dados] Módulo
      Question: Em que módulo está o problema?
  problem_description:
    lineage:
      - datalake_jira_clean.issues.fields.customfield_25836.value
    description: |
      Form answer - issue type.
      Field: [Form S&S Dados] Qual o tipo de problema?
      Question: Qual o tipo de problema?
  integration_type:
    lineage:
      - datalake_jira_clean.issues.fields.customfield_22600.value
    description: |
      Form answer - integration/update flow.
      Field: [Form S&S Dados] Integração/Atualização Dados > Jornada
  data_model_issue:
    lineage:
      - datalake_jira_clean.issues.fields.customfield_22602.value
    description: |
      Form answer - data modeling issue.
      Field: [Form S&S Dados] Problemas na modelagem dos dados > Jornada
  data_integration:
    lineage:
      - datalake_jira_clean.issues.fields.customfield_25333.value
    description: |
      Form answer - data integration.
      Field: [Form S&S Dados] Integração de dados
  atento_issue:
    lineage:
      - datalake_jira_clean.issues.fields.customfield_22605.value
    description: |
      Form answer - Atento problem.
      Field: [Form S&S Dados] Atento > Problema
  birdie_issue:
    lineage:
      - datalake_jira_clean.issues.fields.customfield_22604.value
    description: |
      Form answer - Birdie problem.
      Field: [Form S&S Dados] Birdie > Problema
  final_resolution:
    lineage:
      - datalake_jira_clean.issues.fields.customfield_19688.value
    description: Final resolution from B custom field (customfield_19688)
  request_participants:
    lineage:
      - datalake_jira_clean.issues.fields.customfield_10201
    description: List of request participants (array of objects with accountId, emailAddress and displayName)
  previous_status:
    lineage:
      - datalake_jira_clean.issues.fields.customfield_19925
    description: Previously recorded status (custom field)
  issue_sub_categorization:
    lineage:
      - datalake_jira_clean.issues.fields.customfield_10727
    description: Issue sub-categorization list (custom field)
  labels:
    lineage:
      - datalake_jira_clean.issues.fields.labels
    description: Array of Jira labels applied to the bug issue for filtering and categorization.
  b_labels:
    lineage:
      - datalake_jira_clean.issues.fields.customfield_19832
    description: B labels list (custom field)
  aura_invalid_agent_rule_applied:
    lineage:
      - datalake_jira_clean.issues.fields.customfield_25199
    description: Invalid agent rule applied (custom field)
  aura_invalid_agent_status:
    lineage:
      - datalake_jira_clean.issues.fields.customfield_25244
    description: Invalid agent status (custom field)
  total_comments:
    lineage:
      - datalake_jira_clean.issues.fields.comment.total
    description: Total number of issue comments (in the snapshot)
  comments:
    lineage:
      - datalake_jira_bugs.comments.comment
    description: Concatenated comment texts per issue (ordered by date)
  total_attachments:
    lineage:
      - datalake_jira_clean.issues.fields.attachment
    description: Total number of issue attachments (in the snapshot)
  attachments:
    lineage:
      - datalake_jira_bugs.attachments.file_name
    description: Concatenated list of attached file names per issue (ordered by date)
  sla_first_response_status:
    lineage:
      - datalake_jira_clean.issues.fields.customfield_10222
    description: Consolidated first response SLA status
  sla_resolution_status:
    lineage:
      - datalake_jira_clean.issues.fields.customfield_10221
    description: Consolidated resolution SLA status
  first_response_hours:
    lineage:
      - datalake_jira_clean.issues.fields.customfield_10222.goalDuration.millis
      - datalake_jira_clean.issues.fields.customfield_10222.elapsedTime.millis
    description: Elapsed hours until first response (or NULL if not completed)
  first_response_delay_hours:
    lineage:
      - datalake_jira_clean.issues.fields.customfield_10222.goalDuration.millis
      - datalake_jira_clean.issues.fields.customfield_10222.elapsedTime.millis
    description: Delay hours relative to the first response SLA goal
  sla_resolution_hours:
    lineage:
      - datalake_jira_clean.issues.fields.customfield_10221.elapsedTime.millis
    description: Elapsed hours until resolution (or NULL if not completed)
  resolution_delay_hours:
    lineage:
      - datalake_jira_clean.issues.fields.customfield_10221.goalDuration.millis
      - datalake_jira_clean.issues.fields.customfield_10221.elapsedTime.millis
    description: Delay hours relative to the resolution SLA goal
  is_sla_first_response_agreed:
    lineage:
      - datalake_jira_clean.issues.fields.customfield_10222.breached
      - datalake_jira_clean.issues.fields.customfield_10222.stopTime.iso8601
    description: Indicator that first response SLA was met
  is_sla_resolution_agreed:
    lineage:
      - datalake_jira_clean.issues.fields.customfield_10221.breached
      - datalake_jira_clean.issues.fields.customfield_10221.stopTime.iso8601
    description: Indicator that resolution SLA was met
  is_invalid_bug:
    lineage:
      - datalake_jira_clean.issues.fields.status.name
    description: True if current status equals "Invalid"
  is_in_triage:
    lineage:
      - datalake_jira_clean.issues.fields.status.name
    description: True if current status equals "Triage"
  is_need_more_info:
    lineage:
      - datalake_jira_clean.issues.fields.status.name
    description: True if current status equals "NEED MORE INFO"
  is_under_investigation:
    lineage:
      - datalake_jira_clean.issues.fields.status.name
    description: True if current status equals "Under investigation"
  is_resolved:
    lineage:
      - datalake_jira_clean.issues.fields.status.name
    description: True if current status equals "Close - Resolved"
  is_closed:
    lineage:
      - datalake_jira_clean.issues.fields.status.name
    description: True if current status is in ("Close - Not Resolved", "Close - Resolved")
  ts_sla_first_response_started:
    lineage:
      - datalake_jira_clean.issues.fields.customfield_10222.startTime.iso8601
    description: Start timestamp of first response SLA
  ts_sla_first_response_completed:
    lineage:
      - datalake_jira_clean.issues.fields.customfield_10222.stopTime.iso8601
    description: Completion timestamp of first response SLA
  ts_sla_first_response_breach_limit:
    lineage:
      - datalake_jira_clean.issues.fields.customfield_10222.breachTime.iso8601
    description: Breach deadline of first response SLA
  ts_sla_resolution_started:
    lineage:
      - datalake_jira_clean.issues.fields.customfield_10221.startTime.iso8601
    description: Start timestamp of resolution SLA
  ts_sla_resolution_completed:
    lineage:
      - datalake_jira_clean.issues.fields.customfield_10221.stopTime.iso8601
    description: Completion timestamp of resolution SLA
  ts_sla_resolution_breach_limit:
    lineage:
      - datalake_jira_clean.issues.fields.customfield_10221.breachTime.iso8601
    description: Breach deadline of resolution SLA
  status:
    lineage:
      - datalake_jira_clean.issues.fields.status.name
    description: Current issue status
  status_category:
    lineage:
      - datalake_jira_clean.issues.fields.status.statusCategory.name
    description: Current issue status category
  is_data_ai_team_bug:
    lineage:
      - datalake_jira_clean.issues.fields.customfield_10200.requestType.id
    description: |
      Indicates whether the issue currently belongs to the Data & AI team. 
      “True” means the bug is owned and handled by the Data & AI team.
  is_data_ai_team_redirected:
    lineage:
      - datalake_jira_clean.issues.fields.customfield_10200.requestType.id
      - datalake_jira_clean.issues.fields.customfield_11356.value
      - datalake_jira_clean.issues.fields.customfield_11681
    description: |
      Indicates whether the issue was originally created by the Data & AI team but later reassigned to another team.
      “True” means the bug started in the Data & AI team but has since been redirected elsewhere.
  ts_status:
    lineage:
      - datalake_jira_clean.issues.fields.customfield_10200.currentStatus.statusDate.iso8601
    description: Timestamp of the current status
  ts_status_category_changed:
    lineage:
      - datalake_jira_clean.issues.fields.statuscategorychangedate
    description: Timestamp of the last status category change
  ts_resolved:
    lineage:
      - datalake_jira_clean.issues.fields.resolutiondate
    description: Issue resolution timestamp
  ts_updated:
    lineage:
      - datalake_jira_clean.issues.updated
    description: Issue last update timestamp
  ts_created:
    lineage:
      - datalake_jira_clean.issues.created
    description: Issue creation timestamp
  ts_load:
    lineage:
      - datalake_jira_clean.issues.year
      - datalake_jira_clean.issues.month
      - datalake_jira_clean.issues.day
    description: Issue snapshot date in the datalake
  year:
    lineage:
      - datalake_jira_clean.issues.created
    description: Issue creation year Always filter on this partition column in WHERE clauses to enable partition pruning when scanning the table.
  month:
    lineage:
      - datalake_jira_clean.issues.created
    description: Issue creation month Always filter on this partition column in WHERE clauses to enable partition pruning when scanning the table.
  day:
    lineage:
      - datalake_jira_clean.issues.created
    description: Issue creation day Always filter on this partition column in WHERE clauses to enable partition pruning when scanning the table.