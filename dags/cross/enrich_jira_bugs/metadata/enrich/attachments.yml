---
database_name: datalake_jira_bugs
table_name: attachments
description: Attachments extracted from Jira Bugs project issues. Partitioned by year, month, day. Always filter on year, month, day in WHERE clauses to enable partition pruning and avoid full table scans. When filtering by id_issue, id_attachment, ts_updated, combine partition predicates with those columns to benefit from Z-order clustering and data skipping.
domain: Cross
owner: anne.macedo@quintoandar.com.br
columns:
  id_issue:
    lineage:
      - datalake_jira_clean.issues.key
    description: Issue identifier in Jira
  id_attachment:
    lineage:
      - datalake_jira_clean.issues.fields.attachment.id
    description: Attachment identifier in Jira
  id_author_account:
    lineage:
      - datalake_jira_clean.issues.fields.attachment.author.accountId
    description: Author account ID of the attachment
  file_name:
    lineage:
      - datalake_jira_clean.issues.fields.attachment.filename
    description: Original filename of the file attached to the Jira bug issue as stored in Atlassian.
  file_type:
    lineage:
      - datalake_jira_clean.issues.fields.attachment.mimeType
    description: Attachment MIME type
  file_content_url:
    lineage:
      - datalake_jira_clean.issues.fields.attachment.content
    description: Atlassian-hosted download endpoint URL for retrieving the attachment binary content.
  file_thumbnail:
    lineage:
      - datalake_jira_clean.issues.fields.attachment.thumbnail
    description: Attachment thumbnail URL (when available)
  file_size:
    lineage:
      - datalake_jira_clean.issues.fields.attachment.size
    description: Attachment payload size in bytes as reported by Jira at upload time.
  ts_created:
    lineage:
      - datalake_jira_clean.issues.fields.attachment.created
    description: Attachment creation timestamp
  ts_updated:
    lineage:
      - datalake_jira_clean.issues.year
      - datalake_jira_clean.issues.month
      - datalake_jira_clean.issues.day
    description: Issue snapshot date used in extraction (derived from year/month/day)
  year:
    lineage:
      - datalake_jira_clean.issues.fields.attachment.created
    description: Attachment creation year Always filter on this partition column in WHERE clauses to enable partition pruning when scanning the table.
  month:
    lineage:
      - datalake_jira_clean.issues.fields.attachment.created
    description: Attachment creation month Always filter on this partition column in WHERE clauses to enable partition pruning when scanning the table.
  day:
    lineage:
      - datalake_jira_clean.issues.fields.attachment.created
    description: Attachment creation day Always filter on this partition column in WHERE clauses to enable partition pruning when scanning the table.