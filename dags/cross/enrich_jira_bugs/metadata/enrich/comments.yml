---
database_name: datalake_jira_bugs
table_name: comments
description: Comments extracted from Jira Bugs project issues (normalized text). Partitioned by year, month, day. Always filter on year, month, day in WHERE clauses to enable partition pruning and avoid full table scans. When filtering by id_issue, id_comment, ts_updated, combine partition predicates with those columns to benefit from Z-order clustering and data skipping.
domain: Cross
owner: anne.macedo@quintoandar.com.br
columns:
  id_issue:
    lineage:
      - datalake_jira_clean.issues.key
    description: Issue identifier in Jira
  id_comment:
    lineage:
      - datalake_jira_clean.issues.fields.comment.comments.id
    description: Comment identifier in Jira
  id_author_account:
    lineage:
      - datalake_jira_clean.issues.fields.comment.comments.author.accountId
    description: Author account ID of the comment
  id_last_modified_by_account:
    lineage:
      - datalake_jira_clean.issues.fields.comment.comments.updateAuthor.accountId
    description: Account ID of the last modifier of the comment
  comment:
    lineage:
      - datalake_jira_clean.issues.fields.comment.comments.body
    description: Consolidated comment text extracted from Atlassian Document format
  ts_created:
    lineage:
      - datalake_jira_clean.issues.fields.comment.comments.created
    description: Comment creation timestamp
  ts_updated:
    lineage:
      - datalake_jira_clean.issues.fields.comment.comments.updated
    description: Comment last update timestamp
  ts_load:
    lineage:
      - datalake_jira_clean.issues.year
      - datalake_jira_clean.issues.month
      - datalake_jira_clean.issues.day
    description: Issue snapshot date from which the comment was read
  year:
    lineage:
      - datalake_jira_clean.issues.fields.comment.comments.created
    description: Comment creation year Always filter on this partition column in WHERE clauses to enable partition pruning when scanning the table.
  month:
    lineage:
      - datalake_jira_clean.issues.fields.comment.comments.created
    description: Comment creation month Always filter on this partition column in WHERE clauses to enable partition pruning when scanning the table.
  day:
    lineage:
      - datalake_jira_clean.issues.fields.comment.comments.created
    description: Comment creation day Always filter on this partition column in WHERE clauses to enable partition pruning when scanning the table.