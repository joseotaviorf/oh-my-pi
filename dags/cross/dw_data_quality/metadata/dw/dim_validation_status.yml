database_name: dw_data_quality
table_name: dim_validation_status
description: This dimension table has the status of data quality validations applied by Inmetro.
  Each line is an unique status of validation, identified by the sk_validation_status.
domain: Cross
owner: bruna.prates@quintoandar.com.br
columns:
  sk_validation_status:
    description: Primary key of the table, uniquely identifying a validation status. It's generated by Spark while data is being inserted.
  validation_status:
    description: Status of the validation applied.
    categories:
      success: The data meets the determined validation.
      failure: The data does not meet the determined validation.
    lineage:
      - datalake_data_quality.validations.validation_status
