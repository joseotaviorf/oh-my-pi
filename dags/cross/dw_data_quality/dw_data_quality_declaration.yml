dag:
  name: dw_data_quality
  schedule_start_date: 2022, 1, 1
  owner: Data Engineering
  documentation:
    dag_purpose: "This DAG loads to DW the data quality validations applied to bietlejuice DAGs by Inmetro."
workflow:
  type: query_delta
  layer: dw
  custom_schema: data_quality
  default_extraction_type: incremental
  inner_dependencies:
    fact_data_quality:
      - dim_validation_level
      - dim_validation_status
      - dim_validation_type
  tables_customization:
    dim_validation_level:
      merge_on: ['database', 'table', 'column']
    dim_validation_status:
      merge_on: ['validation_status']
    dim_validation_type:
      merge_on: ['validation_type']
    fact_data_quality:
      partitions: [year, month, day]
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, ds, 'load_end_date') }}"
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: r5d.large
    node_type_id: r5d.large
    runtime_engine: PHOTON
    num_workers: 2
    spark_version: 13.3.x-scala2.12
