domain: For Rent
owner: jonas.fiorini@quintoandar.com.br
columns:
  region_code:
    lineage:
      - dw_public.dim_region.region_code
    description: Region code of the house.
  city_name:
    lineage:
      - dw_public.dim_region.city_name
    description: Name of the city.
  city_group:
    lineage:
      - dw_public.dim_region.city_group
    description: City group of the house.
  event_date:
    lineage:
      - datalake_amplitude_clean.events.ts_event
    description: Timestamp of the booking event.
  visit_date:
    lineage:
      - datalake_amplitude_clean.events.event_properties
    description: Date of the visit.
  week_start:
    lineage:
      - dw_public.dim_date.week_start
    description: Date of the first business day of the week when the booking event happened.
  visit_hour:
    lineage:
      - dw_public.dim_date.date
    description: Timestamp of the visit.
  user_id:
    lineage:
      - datalake_amplitude_clean.events.id_user
    description: Id of the user.
  house_id:
    lineage:
      - datalake_amplitude_clean.events.event_properties
    description: Id of the house.
  hour: 
    description: Comercial hours (from 8 to 18).
  faixa: 
    description: Time range for the booking.
  slot:
    description: Time slot.
  sum_encaixes_total:
    description: Number of booking fittings.
  sum_share_encaixes_realizados:
    description: Number of booking fittings completed.
  sum_encaixes_nao_realizados:
    description: Number of booking fittings not completed.
  sum_encaixes_nao_realizados_cant_find_another_agent:
    description: Number of booking fittings not completed because we couldn't find another agent available.
  sum_encaixes_nao_realizados_por_agenda:
    description: Number of booking fittings not completed because of a schedule problem.
  sum_encaixes_nao_realizados_por_bloqueio:
    description: Number of booking fittings not completed because of the blocking of the house.
  sum_encaixes_nao_realizados_por_suspensao:
    description: Number of booking fittings not completed because of suspension of the house.
  sum_encaixes_nao_realizados_por_bloqueio_suspensao:
    description: Number of booking fittings not completed because of blocking or suspension of the house.
  sum_encaixes_nao_realizados_por_bloqueio_suspensao_agenda:
    description: Number of booking fittings not completed because of a schedule problem or blocking or suspension of the house.
  sum_encaixes_em_imovel_sem_slot_disponivel_target_date:
    description: Number of booking fittings not completed because there was no slot available.
  sum_encaixes_nao_realizados_por_visita_sale:
    description: Number of booking fittings not completed because of a sale visit.
  sum_encaixes_nao_realizados_por_agent:
    description: Number of booking fittings not completed because of the agent.