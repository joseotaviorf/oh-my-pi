---
database_name: dw_datamarts
table_name: weekly_demand_metrics
description:
  Table with information about some metrics (bookings, offers submited
  OS2OA, VB2VC, VC2OS and visits completed) segmented by house and reference week date.
domain: For Rent
owner: kleber.inoue@quintoandar.com.br
columns:
  id_house:
    lineage:
      - dw_rent.fact_listing_rent_flows.sk_house_listing
    description: ID of the house.
  id_house_week:
    lineage:
      - dw_rent.fact_house_listing_status.sk_house_listing
      - dw_public.dim_date.week_start
    description: Concatenation of id_house and the reference week date.
  week_start:
    lineage:
      - dw_public.dim_date.week_start
    description: Week date reference.
  bookings:
    description: Amount of bookings that a house had in a week.
  offer_submitted:
    description: Amount of offers submited that a house had in a week.
  os2oa:
    description: Amount of offer submitted that became an offer approved in a week.
  os2oa_2w:
    description: Amount of offer submitted that became an offer approved in two weeks.
  vb2vc:
    description: Amount of visit booking that became a visit completed in a week.
  vb2cs_4w:
    description: Amount of visit booking that became a visit completed in four weeks.
  vb2cs_8w:
    description: Amount of visit booking that became a visit completed in eight weeks.
  vc2os_4w:
    description: Amount of visit completed that became an offer submitted in four weeks.
  visits_completed:
    description: Amount of visits completed that a house had in a week.
