---
database_name: dw_datamarts
table_name: ongoing_listed_suspended_listings
description: Datamart that contains all weeks that a listing was published or suspended.
domain: For Rent
owner: matheus.baroni@quintoandar.com.br
columns:
  sk_house_listing:
    lineage:
      - dw_rent.fact_house_listing_status.sk_house_listing
    description: House listing ID
  week_start:
    lineage:
      - dw_public.dim_date.week_start
    description: Start of the week date
  weeks_since_publication:
    description: Number of weeks since listings publication date up until now or when the listing stpped being published or suspended
  status_history:
    lineage:
      - dw_rent.fact_house_listing_status.status_history
    description: Status of the listing (publicado, PUBLISHED, suspenso or SUSPENDED)
  status_change_reason:
    lineage:
      - dw_rent.fact_house_listing_status.status_change_reason
    description: Reason of the status change (only for suspended status)
