database_name: dw_datamarts
table_name: repressed_demand
description: Repressed Demand involving days and your reasons.
domain: For Rent
owner: pedro.domingos@quintoandar.com.br
columns:
  region_code:
    lineage:
    - dw_public.dim_region.region_code
    description: Used mainly by agents team. A region code is a grouping of several
      sub-regions. This field is used by the agents team, for agent allocation and
      other purposes.
  country_code:
    lineage:
    - dw_public.dim_region.country_code
    description: Country code of the region.
    categories:
      BR: Brazil's country code.
      MX: Mexico's country code.
  city_name:
    lineage:
    - dw_public.dim_region.city_name
    description: The name for the city where this region is in
  city_group:
    lineage:
    - dw_public.dim_region.city_group
    description: 'A grouping of city or clusters of cities and neighborhoods (for
      example, RMSP: Região Metropolitana de São Paulo).'
  date:
    lineage:
    - dw_public.dim_date.date
    description: The reference on date scheduling.
  week_start:
    lineage:
    - dw_public.dim_date.week_start
    description: Week start date (always a monday).
  slot:
    description: Slot of time which visit booking was requested by tenant prospect.
  hour:
    description: Visit scheduling hour (0, 1, 2, ... 23).
  faixa:
    description: Range of days and hour for visit scheduling.
    categories:
      1) Weekday 8-9h: The range for schedule is on Weekdays (between Monday and Friday) at 8AM until 9AM.
      2) Weekday 9-13h: The range for schedule is on Weekdays (between Monday and Friday) at 9AM until 1PM.
      3) Weekday 13-16h: The range for schedule is on Weekdays (between Monday and Friday) at 1PM until 4PM.
      4) Weekday 16-17h: The range for schedule is on Weekdays (between Monday and Friday) at 4AM until 5PM.
      5) Extended hours: The range for schedule is on Weekdays (between Monday and Friday) after 5PM.
      6) Saturday all hours: The range for schedule is on Saturday, regardless the hour.
      7) Sunday all hours: The range for schedule is on Sunday, regardless the hour.
  sum_bookings:
    description: Amount of booking involving the hour and region_code on the date.
  sum_encaixes:
    description: Amount of fit in request fractions.
  sum_encaixes_realized:
    description: Amount of fit in request fractions realized.
  sum_encaixes_not_realized:
    description: Amount of fit in request fractions not realized.
  sum_encaixes_nao_realizado_cant_find_another_agent:
    description: Amount of fit in request fractions canceled because couldn't find another agent.
  sum_encaixes_nao_realizados_por_agenda:
    description: Sum of fit in request that didn't originate a booking due to lack
      of hours on house calendar.
  sum_encaixes_nao_realizados_por_bloqueio:
    description: Sum of fit in request that didn't originate a booking due to house
      being blocked.
  sum_encaixes_nao_realizados_por_suspensao:
    description: Sum of fit in request fractions that didn't originate a booking due
      to house being suspended.
  sum_encaixes_nao_realizados_por_bloqueio_suspensao:
    description: Sum of fit in request fractions that didn't originate a booking due
      to house being suspended or blocked
  sum_encaixes_nao_realizados_por_bloqueio_suspensao_agenda:
    description: Sum of fit in request fractions that didn't originate a booking due
      to house being suspended or blocked or lack of hours on house calendar
  sum_encaixes_em_imovel_sem_slot_disponivel_target_date:
    description: Sum of fit in request fractions that didn't originate a booking due
      to house without slot available on target day
  sum_encaixes_nao_realizados_por_visita_sale:
    description: Sum of fit in request fractions that didn't originate a booking due
      to slot be busy.
  sum_encaixes_nao_realizados_por_agent:
    description: Sum of fit in request fractions that didn't originate a booking due
      to agent without slot available on target day.
  ts_load:
    description: Timestamp of when this table was loaded.
