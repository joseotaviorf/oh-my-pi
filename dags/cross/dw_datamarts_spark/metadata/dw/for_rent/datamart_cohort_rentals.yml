---
database_name: dw_datamarts
table_name: datamart_cohort_rentals
description:
  Table with information regarding the number of houses that were rented for the first time and the number of re rentals
  and ended re rentals. This is a cohort table based on the number of months after the house's first rental.
domain: For Rent
owner: gustavo.alencar@quintoandar.com.br
columns:
  city_group:
    description: City group of the house.
    lineage:
      - dw_public.dim_region.city_group
  contract_start_month:
    description: Month in which the house's first rental contract started.
    lineage:
      - dw_rent.dim_contract.dt_start
      - dw_rent.dim_contract.dt_entrance
  months_after_first_contract:
    description:
      Date difference in months between the house's first contract and the moment in analysis.
      This column defines the cohort.
  total_first_rentals:
    description:
      Number of houses (in a cohort) with an active first contract after the given number of months after the first contract started.
      This metric is calculated by the distinct count of id_house that have the first contract still active by the time of the analysis.
  total_re_rentals:
    description:
      Number of houses (in a cohort) that re-rented after the given number of months after the first contract started.
      This metric is calculated by the distinct count of id_house that had a new contract after the first one.
  total_ended_re_rentals:
    description:
      Number of houses that had an ended re rental after the given number of months after the first contract started.
      This metric is calculated by the distinct count of id_house that had a new contract with an annulment date (not considering the first contract).
  avg_value_rent_first_rentals:
    description: Average rent value of the houses first contracts that are active in the cohort.
  avg_admin_fee_first_rentals:
    description: Average administration fee of the houses first contracts that are active in the cohort.
  avg_value_rent_re_rentals:
    description: Average rent value of the houses re rental contracts that are active in the cohort.
  avg_admin_fee_re_rentals:
    description: Average administration fee of the houses re rental contracts that are active in the cohort.
  ts_load:
    description: Timestamp of when this table was loaded.
