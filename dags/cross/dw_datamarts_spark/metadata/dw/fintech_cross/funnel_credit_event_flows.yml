---
database_name: dw_datamarts
table_name: funnel_credit_event_flows
owner: giuseppe.giovanelli@quintoandar.com.br
domain: Fintech
description: "Rent Flows datamart with the flow classification regarding the beginnig of the flow."
columns:
  sk_proposal:
    lineage:
      - dw_public.fact_listing_rent_flows.sk_proposal
    description: "Proposal's identification from EBDB."
  sk_offer_approved_date:
    lineage:
      - dw_public.fact_listing_rent_flows.sk_offer_approved_date
    description: "Offer's acceptance date key."
  sk_contract:
    lineage:
      - dw_public.fact_listing_rent_flows.sk_contract
    description: "Contract's identification from EBDB."
  sk_house_listing:
    lineage:
      - dw_public.fact_listing_rent_flows.sk_house_listing
    description: "Listing's identification from Data Team. A listing is aversion from the House, having a new version if the it is rented or unpublished."
  sk_client:
    lineage:
      - dw_public.fact_listing_rent_flows.sk_client
    description: "Tenant's identification, uses the user identification from EBDB."
  offer_submitted_date:
    lineage:
      - dw_public.dim_date.date
    description: "Offer's sent by tenant date key."
  offer_approved_date:
    lineage:
      - dw_public.dim_date.date
    description: "Offer's acceptance date."
  last_evaluation_started_date:
    lineage:
      - dw_public.dim_date.date
    description: "Credit evaluation last initiated date. It marks the date when the after offer form is sent."
  evaluation_approved_date:
    lineage:
      - dw_public.dim_date.date
    description: "Credit evaluation with RentalGuarantee or Free guarantee option accpeted date."
  document_first_sent_date:
    lineage:
      - dw_public.dim_date.date
    description: "First time tenant documentation sent date."
  document_completed_date:
    lineage:
      - dw_public.dim_date.date
    description: "Tenant documentation complete date. DEPRECATED as of 2021."
  last_document_approved_date:
    lineage:
      - dw_public.dim_date.date
    description: "Proposal credit approved date, be it manual or automatic."
  guarantee_paid_date:
    lineage:
      - dw_public.dim_date.date
    description: "Paid guarantee effectively paid date."
  contract_created_date:
    lineage:
      - dw_public.dim_date.date
    description: "Contract creation date."
  contract_signed_date:
    lineage:
      - dw_public.dim_date.date
    description: "Contract signed date"
  flow_type:
    lineage:
      - dw_datamarts_cross.funnel_demand_flows.flow_type
    description: "Classification of rent_flow based on funnel start events."
    categories:
      "(1) ONLY DIRECT OFFER": "Flow with only direct offer, without any visit or message to agent."
      "(1) DIRECT OFFER + (3) VISIT": "Flow with direct offer and visit. No message to agent."
      "(1) DIRECT OFFER + (2) TALK TO AGENT": "Flow with direct offer and message to agent."
      "(1) DO + (2) TTA + (3) VISIT": "Flow with direct offer, visit, and message to agent."
      "(2) TALK TO AGENT + (3) VISIT": "Flow with visit and message to agent. Offer possibly done afterwards."
      "(3) ONLY VISIT": "Flow with only visit, without a direct offer or message to agent."
  funnel_flow:
    lineage:
      - dw_datamarts_cross.funnel_demand_flows.funnel_flow
    description: "Classification of rent_flow beginning."
    categories:
      DIRECT: "Flow started with a direct offer, without any visit previously."
      TTA: "Talk to agent. Flow started with a message to an agent, used on the 2020 pandemic."
      VISIT: "Flow started with a visit."
  days_offer_submitted_to_offer_approved:
    lineage:
      - dw_public.dim_date.date
    description: "Days between offer approved and offer submitted."
  days_offer_approved_to_evaluation_started:
    lineage:
      - dw_public.dim_date.date
    description: "Days between credit evaluation first started and offer approved."
  days_offer_approved_to_evaluation_approved:
    lineage:
      - dw_public.dim_date.date
    description: "Days between credit evaluation first approved by model and offer approved."
  days_offer_approved_to_document_first_sent:
    lineage:
      - dw_public.dim_date.date
    description: "Days between tenant documents first sent and offer approved."
  days_offer_approved_to_document_approved:
    lineage:
      - dw_public.dim_date.date
    description: "Days between tenant documents approved (deprecated as 2020) and offer approved."
  days_offer_approved_to_contract_signed:
    lineage:
      - dw_public.dim_date.date
    description: "Days between offer approved and contract signed."
  days_evaluation_started_to_evaluation_approved:
    lineage:
      - dw_public.dim_date.date
    description: "Days between credit evaluation first started and credit evaluation first approved by model."
  days_evaluation_started_to_contract_signed:
    lineage:
      - dw_public.dim_date.date
    description: "Days between credit evaluation first started and contract signed."
  days_document_first_sent_to_document_approved:
    lineage:
      - dw_public.dim_date.date
    description: "Days between tenant documents sent to approved (deprecated as 2020)."
  days_document_approved_to_contract_signed:
    lineage:
      - dw_public.dim_date.date
    description: "Days between tenant documents approved (deprecated as 2020) and contract signed."
  funnel_step:
    lineage:
      - dw_public.fact_listing_rent_flows.funnel_step
    description: "Last step of the rent flow."
