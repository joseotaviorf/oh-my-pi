---
database_name: dw_datamarts
table_name: rental_demand_events_funnel_flows
description: Information related to ForRent events. Amount of events grouped by different types of flows.
domain: For Rent
owner: gustavo.geiger@quintoandar.com.br
columns:
  date:
    lineage:
      - dw_public.dim_date.date
    description: Event date.
  city_group:
    lineage:
      - dw_public.dim_region.city_group
    description: City group of the event.
  funnel_flow:
    description: The flow of the event, if the flow started in visit or offer.
  funnel_first_touchpoint:
    lineage:
      - dw_rent.dim_rent_flow_type.first_touchpoint
    description: The first touchpoint of the rent flows.
  had_flow_visit:
    lineage:
      - dw_rent.dim_rent_flow_type.has_visit_flow
    description: If the event started with a visit
  had_flow_direct:
    lineage:
      - dw_rent.dim_rent_flow_type.has_direct_offer_flow
    description: If the event started with an offer
  had_flow_tta:
    lineage:
      - dw_rent.dim_rent_flow_type.has_tta_flow
    description: If the event started with talk to agent
  flow_type:
    description: If the event flow was only visit, only direct or mixed.
  demand_channel:
    lineage:
      - dw_public.dim_offer.mkt_medium
    description: The market channel in demand context.
  is_b2b_demand:
    lineage:
      - dw_public.dim_house_listing.is_b2b
    description: If house comes from a b2b partner.
