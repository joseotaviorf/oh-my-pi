---
database_name: dw_datamarts
table_name: rental_cohort_conversions
owner: '@data-for-rent'
domain: Data For Rent
description: A datamart to consolidate cohorts for supply and demand context.
columns:
  date:
    description: "The date of the rental cohort conversion."
    lineage:
      - dw_public.dim_date.date
  city_group:
    description: "The group or category of cities."
    lineage:
      - dw_public.dim_region.city_group
  country_code:
    description: "The country code."
    lineage:
      - dw_datamarts.lead_listing_flows.country_code
      - dw_public.dim_region.country_code
      - dw_public.dim_house_listing.country_code
  supply_mkt_origin:
    description: "The market origin in supply context."
    lineage:
      - dw_datamarts.lead_listing_flows.mkt_origin
  supply_mkt_origin_detailed:
    description: "The detailed market origin in supply context."
    lineage:
      - dw_datamarts.lead_listing_flows.mkt_origin
      - dw_datamarts.lead_listing_flows.mkt_channel
  lead_context:
    description: "The lead context of the rental cohort."
    lineage:
      - dw_datamarts.lead_listing_flows.mkt_origin
  lead_processing_operation:
    description: "The lead processing operation of cohort."
    lineage:
      - dw_datamarts.lead_listing_flows.sourcing_ops
  demand_mkt_channel:
    description: "The market channel in demand context."
    lineage:
      - dw_public.dim_booking.mkt_channel
      - dw_public.dim_offer.mkt_channel
  demand_mkt_channel_detailed:
    description: "The detailed market channel in demand context."
    lineage:
      - dw_public.dim_offer.mkt_medium
      - dw_public.dim_booking.mkt_medium
      - dw_public.dim_booking.mkt_channel
      - dw_public.dim_offer.mkt_channel
  first_touchpoint:
    description: "The first touchpoint of the rental cohort in the marketing funnel."
    lineage:
      - dw_datamarts.funnel_demand_flows.funnel_first_touchpoint
  is_b2b_demand:
    description: "Indicates whether the demand is from a B2B source."
    lineage:
      - dw_datamarts.quintoandar_consultant_listings.type_big_agent
  weeks_conversion:
    description: "The number of weeks it took for the rental cohort to convert."
    lineage:
      - dw_datamarts.lead_listing_flows.sk_lead_date
      - dw_datamarts.lead_listing_flows.sk_prospect_date
      - dw_datamarts.lead_listing_flows.sk_qualified_date
      - dw_datamarts.lead_listing_flows.sk_opportunity_date
      - dw_datamarts.lead_listing_flows.sk_first_listing_date
      - dw_public.fact_listing_rent_flows.sk_booking_created_date
      - dw_public.fact_listing_rent_flows.sk_visit_date
      - dw_public.fact_listing_rent_flows.sk_offer_submitted_date
      - dw_public.fact_listing_rent_flows.sk_offer_approved_date
      - dw_public.fact_listing_rent_flows.sk_first_credit_evaluation_init
      - dw_public.fact_listing_rent_flows.sk_last_doc_analysis_approved
      - dw_public.fact_listing_rent_flows.sk_credit_analysis_approved_date
      - dw_public.fact_listing_rent_flows.sk_tenant_first_doc_sent_date
      - dw_public.fact_listing_rent_flows.sk_first_credit_evaluation_positive
      - dw_public.fact_listing_rent_flows.sk_guarantee_date
      - dw_public.fact_listing_rent_flows.sk_contract_created_date
      - dw_public.fact_listing_rent_flows.sk_guarantee_paid_date
      - dw_public.fact_listing_rent_flows.sk_contract_signed_date
      - dw_public.fact_listing_rent_flows.sk_contract_annulment_date
  rental_administrator:
    description: "The rental administrator of the house listing in the rental cohort."
    lineage:
      - dw_public.dim_house_listing.rental_administrator
