      - dw_public.fact_listing_rent_flows.sk_region
  sk_house_listing:
    description: TThis column contains the surrogate key (SK) associated with a house listing. 
    lineage:
      - datalake_listing_temp.fact_house_listing_status_house.sk_house_listing
      - dw_datamarts.rent_flow_interactions.sk_house_listing
      - dw_public.fact_listing_rent_flows.sk_house_listing
  sk_client:
    description: This column contains the surrogate key (SK) associated with a sk_client. 
    lineage:
      - dw_datamarts.rent_flow_interactions.sk_client
