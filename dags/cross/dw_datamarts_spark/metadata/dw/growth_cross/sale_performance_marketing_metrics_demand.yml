      - dw_public.dim_booking.utm_campaign
      - dw_sale.dim_offer.utm_campaign
      - datalake_talk_to_agent.talk_to_agent.utm_campaign
      - datalake_marketing_costs.daily_costs.campaign_name
  utm_campaign:
    description: Returns utm_campaign parameter defined at campaing configuration at marketing platforms
    lineage:
      - dw_public.dim_booking.utm_campaign
      - dw_sale.dim_offer.utm_campaign
      - datalake_talk_to_agent.talk_to_agent.utm_campaign
      - datalake_marketing_costs.daily_costs.utm_campaign
  campaign_context:
    description: Returns the context of the campaign setted at the marketing plataform
    lineage:
      - dw_public.dim_booking.utm_campaign
      - dw_sale.dim_offer.utm_campaign
      - datalake_talk_to_agent.talk_to_agent.utm_campaign
      - datalake_marketing_costs.daily_costs.utm_campaign
  utm_term:
    description: Returns the utm_term parameter defined at campaing configuration at marketing platforms
    lineage:
      - dw_public.dim_booking.utm_term
      - datalake_talk_to_agent.talk_to_agent.utm_term
      - datalake_marketing_costs.daily_costs.utm_term
  utm_content:
    description: Returns the utm_content parameter defined at campaing configuration at marketing platforms
    lineage:
      - dw_public.dim_booking.utm_content
      - datalake_talk_to_agent.talk_to_agent.utm_content
      - datalake_marketing_costs.daily_costs.utm_content
