    lineage:
      - dw_public.dim_date.date
  sale_flow_order:
    description: Sale flow ordered by ascending date by unique sk_buyer and sk_house
    lineage:
      - dw_sale.fact_sale_flows.sk_sale_flow
      - datalake_talk_to_agent.talk_to_agent.tenant_id
      - datalake_talk_to_agent.talk_to_agent.house_id
      - dw_public.dim_booking.dt_created
      - dw_sale.dim_offer.ts_offer_submitted
      - datalake_talk_to_agent.talk_to_agent.first_message_ts
  buyer_prospect_order:
    description: Buyer prospect ordered by ascending date by unique sk_buyer
    lineage:
      - dw_datamarts.buyer_prospect_status.sk_buyer
      - dw_sale.fact_sale_flows.sk_buyer
      - datalake_talk_to_agent.talk_to_agent.tenant_id
      - dw_public.dim_booking.dt_created
      - dw_sale.dim_offer.ts_offer_submitted
      - datalake_talk_to_agent.talk_to_agent.first_message_ts
