    lineage:
      - dw_sale.fact_visits.sk_booking
  dt_offer_submitted:
    description: Date of offer submitted
    lineage:
      - dw_public.dim_date.date
  dt_offer_accepted:
    description: Date of accepted
    lineage:
      - dw_public.dim_date.date
  dt_sale_agreement_signed:
    description: Date of ccv was signed
    lineage:
      - dw_public.dim_date.date
  dt_booking_created:
    description: Date of boooking creation
    lineage:
      - dw_public.dim_date.date
  dt_visit_completed:
