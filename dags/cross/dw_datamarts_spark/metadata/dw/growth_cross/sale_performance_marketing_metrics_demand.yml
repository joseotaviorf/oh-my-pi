    lineage:
      - datalake_ebdb_clean.house.id
      - dw_sale.fact_sale_flows.sk_house
  is_3p:
    description: Indicator of whether the source is a third-party entity.
    lineage:
      - datalake_ebdb_listing.house.is_3p_supply
  is_3p_bh:
    description: Specific indicator for third-party involvement in the Belo Horizonte region.
    lineage:
     - datalake_ebdb_listing.house.is_3p_supply_bh
  sk_offer:
    description: Offer id
    lineage:
      - dw_sale.fact_offers.sk_offer
  sk_booking:
