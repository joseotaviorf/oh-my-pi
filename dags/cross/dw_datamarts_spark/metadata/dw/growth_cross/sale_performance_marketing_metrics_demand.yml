---
database_name: dw_datamarts
table_name: sale_performance_marketing_metrics_demand
owner: "@data-growth"
domain: Growth
description: Table that contains data from buyer prospects, targets and marketing cost by growth marketing Taxonomy
columns:
  dt_event:
    description: Date of the flow event or status available
    lineage:
      - dw_public.dim_booking.dt_created
      - dw_sale.dim_offer.ts_offer_submitted
      - datalake_talk_to_agent.talk_to_agent.first_message_ts
      - dw_datamarts.buyer_prospect_status.ts_start
  ts_event:
    description: Timestamp of the flow event or status available
    lineage:
      - dw_public.dim_booking.dt_created
      - dw_sale.dim_offer.ts_offer_submitted
      - datalake_talk_to_agent.talk_to_agent.first_message_ts
      - datalake_gsheets_clean.mkt_cost_per_source.dt_event
      - datalake_gsheets_clean.sale_nbp_source_targets.dt_target
      - datalake_gsheets_clean.sale_flows_targets.date
      - dw_public.dim_date.date
      - dw_datamarts.buyer_prospect_status.ts_start
  status:
    description: Prospect status
    lineage:
      - dw_datamarts.buyer_prospect_status.status
  status_detail:
    description: Detail of the prospects status at that dt_event
    lineage:
      - dw_datamarts.buyer_prospect_status.status_detail
  next_status:
    description: The subsequent status in the buyer prospect's journey.
    lineage:
      - dw_datamarts.buyer_prospect_status.status
  ts_status_start:
    description: Timestamp that started prospect status
    lineage:
      - dw_datamarts.buyer_prospect_status.ts_start
  ts_status_end:
    description: Timestamp that ended prospect status
    lineage:
      - dw_datamarts.buyer_prospect_status.ts_end
  city_group:
    description: city_group of the prospect intent
    lineage:
      - dw_public.dim_region.city_group
      - dw_datamarts.buyer_prospect_status.city_group
      - datalake_gsheets_clean.mkt_cost_per_source.city_group
      - datalake_gsheets_clean.sale_nbp_source_targets.city_group
      - datalake_gsheets_clean.sale_flows_targets.city_group
      - datalake_marketing_costs.daily_costs.city_group
    categories:
      Belo Horizonte: ""
      Brasília: ""
      Campinas: ""
      Curitiba: ""
      Florianópolis: ""
      Goiânia: ""
      Mogi das Cruzes: ""
      Not Mapped: ""
      Porto Alegre: ""
      RMSP: ""
      Recife: ""
      Rio de Janeiro: ""
      Salvador: ""
      Santos: ""
      São José dos Campos: ""
  flow_event:
    description: The specific event within the sales and marketing flow.
    lineage:
      -  dw_public.dim_booking
  mkt_origin:
    description: Level of the Growth Marketing Taxonomy
    lineage:
      - dw_sale.dim_offer.mkt_origin
      - datalake_talk_to_agent.talk_to_agent.mkt_origin
  mkt_channel:
    description: Level of the Growth Marketing Taxonomy
    lineage:
      - dw_public.dim_booking.mkt_channel
      - dw_sale.dim_offer.mkt_channel
      - datalake_talk_to_agent.talk_to_agent.mkt_channel
      - datalake_gsheets_clean.mkt_cost_per_source.mkt_channel
      - datalake_gsheets_clean.sale_nbp_source_targets.mkt_channel
      - datalake_marketing_costs.daily_costs.mkt_channel
  mkt_medium:
    description: Level of the Growth Marketing Taxonomy
    lineage:
      - dw_public.dim_booking.mkt_medium
      - dw_sale.dim_offer.mkt_medium
