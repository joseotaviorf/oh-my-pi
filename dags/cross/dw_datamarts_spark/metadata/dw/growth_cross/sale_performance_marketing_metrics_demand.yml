    lineage:
      - dw_public.dim_booking.mkt_source
      - dw_sale.dim_offer.mkt_source
      - datalake_talk_to_agent.talk_to_agent.mkt_source
      - datalake_gsheets_clean.mkt_cost_per_source.mkt_source
      - datalake_gsheets_clean.sale_nbp_source_targets.mkt_source
      - datalake_marketing_costs.daily_costs.mkt_source
