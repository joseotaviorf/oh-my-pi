    lineage:
      - datalake_gsheets_clean.sale_nbp_source_targets.nbp_target
  recovered_buyer_prospects_target:
    description: Target metrics for recovering previous buyer prospects.
    lineage:
      - datalake_gsheets_clean.sale_nbp_source_targets.rbp_target
  sale_flows_target:
    description: Target goals for the sales flow processes.
    lineage:
      - datalake_gsheets_clean.sale_flows_targets.sf_target
  marketing_cost:
    description: Total cost associated with the marketing activities.
    lineage:
      - datalake_marketing_costs.daily_costs.cost
