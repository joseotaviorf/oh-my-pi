---
database_name: dw_datamarts
table_name: top_of_funnel_volumes_monthly
owner: "@data-growth"
domain: Growth
description:
  Table that contains data from tof users, tof events, tenant prospects, buyer prospects, targets and marketing cost by growth marketing Taxonomy grouped by month.
  Once ToF users is not a additive metric, we have 1 table for each kind of groupping (daily, weekly and monthly)
columns:
  city_group:
    description: City group
    lineage:
      - datalake_gsheets_clean.sale_tof_monthly_targets.city_group
      - datalake_gsheets_clean.rental_tof_monthly_targets.city_group
      - dw_datamarts.performance_marketing_metrics_demand.city_group
      - dw_datamarts.sale_performance_marketing_metrics_demand.city_group
      - dw_public.dim_region.city_group
      - dw_datamarts.buyer_prospect_status.city_group
      - dw_datamarts.tenant_prospect_status.city_group
  business_context:
    description: Businnes context that tof user was intereted.
      It comes from which business context toggle user selected on the search form on www.quintoandar.com.br when realizing a search_page_viewed
      or realize a listing_page_viewed/schedule_page_viewed in a listing speficic from a business_context.
    lineage:
      - datalake_top_of_funnel_demand.user_interactions.business_context
  campaign_context:
    description: Business context that growth marketing campaign was intented to aim
    lineage:
      - datalake_gsheets_clean.sale_tof_monthly_targets.context
      - dw_datamarts.sale_performance_marketing_metrics_demand.campaign_context
  mkt_origin:
    description: Level of the Growth Marketing Taxonomy
    lineage:
      - dw_datamarts.performance_marketing_metrics_demand.mkt_origin
      - dw_datamarts.sale_performance_marketing_metrics_demand.mkt_origin
      - datalake_top_of_funnel_demand.user_interactions.mkt_origin
  mkt_channel:
    description: Level of the Growth Marketing Taxonomy
    lineage:
      - datalake_gsheets_clean.sale_tof_monthly_targets.mkt_channel
      - datalake_gsheets_clean.rental_tof_monthly_targets.mkt_channel
      - dw_datamarts.performance_marketing_metrics_demand.mkt_channel
      - dw_datamarts.sale_performance_marketing_metrics_demand.mkt_channel
      - datalake_top_of_funnel_demand.user_interactions.mkt_channel
  mkt_medium:
    description: Level of the Growth Marketing Taxonomy
    lineage:
      - datalake_gsheets_clean.sale_tof_monthly_targets.mkt_medium
      - datalake_gsheets_clean.rental_tof_monthly_targets.mkt_medium
      - dw_datamarts.performance_marketing_metrics_demand.mkt_medium
      - dw_datamarts.sale_performance_marketing_metrics_demand.mkt_medium
      - datalake_top_of_funnel_demand.user_interactions.mkt_medium
  mkt_source:
    description: Level of the Growth Marketing Taxonomy
    lineage:
      - datalake_gsheets_clean.sale_tof_monthly_targets.mkt_source
      - datalake_gsheets_clean.rental_tof_monthly_targets.mkt_source
      - dw_datamarts.performance_marketing_metrics_demand.mkt_source
      - dw_datamarts.sale_performance_marketing_metrics_demand.mkt_source
      - datalake_top_of_funnel_demand.user_interactions.mkt_source
  month_start:
    description: Month of the intereseted event. ToF event
    lineage:
      - datalake_gsheets_clean.sale_tof_monthly_targets.month_start
      - datalake_gsheets_clean.rental_tof_monthly_targets.month_start
      - dw_datamarts.performance_marketing_metrics_demand.dt_event
      - dw_datamarts.sale_performance_marketing_metrics_demand.dt_event
      - datalake_top_of_funnel_demand.user_interactions.dt_event
      - dw_public.dim_date.month_start
  status_month_start:
    description: Prospects can have its status changed over time. This field register the month that each different status starts
  status_month_end:
    description: Prospects can have its status changed over time. This field register the month that each different status ends
  is_3p:
    description: Indicates if this event belongs to Rede Quinto Andar
  marketing_cost:
    description: Cost of growth marketing to achieve interested flows
  budget:
    description: Budget that growth marketing team has to invest in each growth marketing channel
  tof_users:
    description:
      Count of unique user segmented by city_group, status_month_start, status_month_end, business_context, campaign_context, mkt_origin, mkt_channel, mkt_medium, mkt_source and month
      that realize one of these events search_page_viewed, listing_page_viewed, schedule_page_viewed
  tof_users_3p:
    description:
      Count of unique user segmented by city_group, status_month_start, status_month_end, business_context, campaign_context, mkt_origin, mkt_channel, mkt_medium, mkt_source and month
      that realize one of these events search_page_viewed, listing_page_viewed, schedule_page_viewed from Redes Quinto Andar
  tof_events:
    description: Total sum of events search_page_viewed, listing_page_viewed, schedule_page_viewed
  tof_events_3p:
    description: Total sum of events search_page_viewed, listing_page_viewed, schedule_page_viewed from Redes Quinto Andar
  active_buyer_prospects:
    description: Total sum of Buyer prospects that ended the month with Active status. In order words status_month_end = 'Active'
  ongoing_churned_buyer_prospects:
    description: Total sum of Buyer prospects that ended the month with Churned status. In order words status_month_end = 'Churned'
  retained_buyer_prospects:
    description: Total sum of Buyer prospects that started the month with Active status and ended the month with a status different of Churned. In order words status_month_start = 'Active' status_month_end != 'Churned'
  new_buyer_prospects:
    description: Total sum of New Buyer prospects. User that made a booking or offer for the first time
  buyer_prospects:
    description: Total sum of a Buyer Prospect. User that made a booking or offer
  recovered_buyer_prospects:
    description: Total sum of Recovered Buyer prospects. User that was a prospect that churned and came back to make a new flow
  buyer_prospect_churns:
    description: Prospects that its status in that month as Churned
  buyer_prospect_deactivations_by_ccv:
    description: Prospects that its status in that month as Signed CCV
  new_buyer_prospects_target:
    description: Target of new buyer prospects
  recovered_buyer_prospects_target:
    description: Target of recovered buyer prospects
  active_tenant_prospects:
    description: Total sum of tenant prospects that ended the month with Active status. In order words status_month_end = 'Active'
  ongoing_churned_tenant_prospects:
    description: Total sum of tenant prospects that ended the month with Churned status. In order words status_month_end = 'Churned'
  retained_tenant_prospects:
    description: Total sum of tenant prospects that started the month with Active status and ended the month with a status different of Churned. In order words status_month_start = 'Active' status_month_end != 'Churned'
  new_tenant_prospects:
    description: Total sum of New tenant prospects. User that made a booking or offer for the first time
  tenant_prospects:
    description: Total sum of a tenant Prospect. User that made a booking or offer
  recovered_tenant_prospects:
    description: Total sum of Recovered tenant prospects. User that was a prospect that churned and came back to make a new flow
  tenant_prospect_churns:
    description: Prospects that its status in that month as Churned
  tenant_prospect_deactivations_by_ccv:
    description: Prospects that its status in that month as Rented
  sale_flows:
    description: Sum of sale flows. Sale flow is a visit booking or a offer submitted event in rent context.
  new_tenant_prospects_target:
    description: Target of new tenant prospects
  recovered_tenant_prospects_target:
    description: Target of recovered tenant prospects
  tof_users_target:
    description: Target of tof users
