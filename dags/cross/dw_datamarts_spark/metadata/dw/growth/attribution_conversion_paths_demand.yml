---
database_name: dw_datamarts
table_name: attribution_conversion_paths_demand
domain: Growth
owner: "@data-growth"
description: This table aggregates data related to conversion paths and attribution. It compiles information on how users interact with different marketing channels and touchpoints before a conversion event.
columns:
  sk_conversion_date:
    description: SK of the date for the conversion event.
    lineage:
      - datalake_amplitude_page_viewed_events.contract_docusign_signed_events.ts_event
  sk_region:
    description: Identifier for the region.
    lineage:
      - dw_rent.fact_house_listings.sk_region
  unique_conversion_id:
    description: Unique identifier for each conversion event.
    lineage:
      - datalake_amplitude_page_viewed_events.listing_page_viewed.id_amplitude
      - datalake_amplitude_page_viewed_events.home_page_viewed.id_amplitude
      - datalake_amplitude_page_viewed_events.search_results_page_viewed.id_amplitude
      - datalake_amplitude_page_viewed_events.schedule_page_viewed.id_amplitude
      - datalake_amplitude_page_viewed_events.contract_docusign_signed_events.id_amplitude
  path_utm_source_medium_branded:
    description: Concatenated string of UTM parameters and branding information indicating the path taken by the user before conversion.
    lineage:
      - datalake_amplitude_page_viewed_events.listing_page_viewed.utm_campaign
      - datalake_amplitude_page_viewed_events.home_page_viewed.utm_campaign
      - datalake_amplitude_page_viewed_events.search_results_page_viewed.utm_campaign
      - datalake_amplitude_page_viewed_events.schedule_page_viewed.utm_campaign
      - datalake_amplitude_page_viewed_events.contract_docusign_signed_events.utm_campaign
  ts_load:
    description: Timestamp indicating when the data was loaded into the table.
    lineage:
      - NOW()
