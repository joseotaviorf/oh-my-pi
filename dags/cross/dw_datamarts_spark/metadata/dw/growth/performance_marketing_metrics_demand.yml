---
database_name: dw_datamarts
table_name: performance_marketing_metrics_demand
owner: "@data-growth"
domain: Growth
description: Table that contains data from tenant prospects, targets and marketing cost by growth marketing Taxonomy
columns:
  sk_client:
    description: Client/user id
    lineage:
      - dw_datamarts.rent_flow_interactions.sk_client
  sk_rf:
    description: Rent flow id
    lineage:
      - dw_datamarts.rent_flow_interactions.sk_rf
  sk_house_listing:
    description: Id of the house listings associated with the flow
    lineage:
      - dw_datamarts.rent_flow_interactions.sk_house_listing
  id_house:
    description: Id of the house associated with the flow
    lineage:
      - dw_datamarts.rent_flow_interactions.id_house
  sk_booking:
    description: Booking identificator
    lineage:
      - datalake_listing_temp.fact_listing_rent_flows_house.sk_booking
  sk_offer:
    description: Offer ifentificator
    lineage:
      - datalake_listing_temp.fact_listing_rent_flows_house.sk_offer
  sk_proposal:
    description: Proposal ifentificator
    lineage:
      - datalake_listing_temp.fact_listing_rent_flows_house.sk_proposal
  sk_contract:
    description: Contract ifentificator
    lineage:
      - datalake_listing_temp.fact_listing_rent_flows_house.sk_contract
  dt_booking_created:
    description: Date of booking creation
    lineage:
      - dw_public.dim_date.dt_booking_created
  flg_visit_completed:
    description: Status of booking visit realization
    lineage:
      - datalake_listing_temp.fact_listing_rent_flows_house.flg_visit_completed
  dt_offer_submitted:
    description: Date of offer submitted
    lineage:
      - dw_public.dim_date.dt_offer_submitted
  dt_offer_approved:
    description: Date of offer approved
    lineage:
      - dw_public.dim_date.dt_offer_approved
  dt_tenant_first_doc_sent:
    description: Date of tenant first document sent
    lineage:
      - dw_public.dim_date.dt_tenant_first_doc_sent
  dt_credit_analysis_approved:
    description: Date of credit analysis approved
    lineage:
      - dw_public.dim_date.dt_credit_analysis_approved
  dt_contract_signed:
    description: Date of contract signed
    lineage:
      - dw_public.dim_date.dt_contract_signed
  dt_event:
    description: Date of the flow event or status available
    lineage:
      - dw_datamarts.rent_flow_interactions.dt_event
      - dw_public.dim_date.date
      - datalake_gsheets_clean.demand_targets_replanning.dt_target
      - datalake_gsheets_clean.mkt_cost_per_source.dt_event
      - datalake_gsheets_clean.rental_ntp_source_targets.dt_target
      - datalake_gsheets_clean.rental_flows_targets.date
  ts_event:
    description: Timestamp of the flow event or status available
    lineage:
      - dw_datamarts.rent_flow_interactions.dt_event
      - dw_public.dim_date.date
      - datalake_gsheets_clean.demand_targets_replanning.dt_target
      - datalake_gsheets_clean.mkt_cost_per_source.dt_event
      - datalake_gsheets_clean.rental_ntp_source_targets.dt_target
      - datalake_gsheets_clean.rental_flows_targets.date
  status:
    description: Prospect status
    lineage:
      - dw_datamarts.tenant_prospect_status.status
  status_detail:
    description: Detail of the prospects status at that dt_event
    lineage:
      - dw_datamarts.tenant_prospect_status.status_detail
  next_status:
    description: Status after the status at that dt_event
  ts_status_start:
    description: Timestamp that started prospect status
    lineage:
      - dw_datamarts.tenant_prospect_status.ts_start
  ts_status_end:
    description: Timestamp that ended prospect status
    lineage:
      - dw_datamarts.tenant_prospect_status.ts_end
  city_group:
    description: city_group of the prospect intent
    lineage:
      - dw_public.dim_region.city_group
      - datalake_marketing_costs.daily_costs.city_group
      - datalake_gsheets_clean.demand_targets_replanning.city_group
      - datalake_gsheets_clean.mkt_cost_per_source.city_group
      - datalake_gsheets_clean.rental_ntp_source_targets.city_group
      - datalake_gsheets_clean.rental_flows_targets.city_group
  country_name:
    description: Name of country
    lineage:
      - dw_public.dim_region.country_name
  flow_event:
    description: Type of flow
    lineage:
      - dw_datamarts.rent_flow_interactions.flow_event
    categories:
      Booking: ""
      Offer: ""
      Talk to Agent: ""
  mkt_origin:
    description: Level of the Growth Marketing Taxonomy
    lineage:
      - dw_datamarts.rent_flow_interactions.mkt_origin
      - datalake_marketing_costs.daily_costs.mkt_origin
  mkt_channel:
    description: Level of the Growth Marketing Taxonomy
    lineage:
      - dw_datamarts.rent_flow_interactions.mkt_channel
      - datalake_marketing_costs.daily_costs.mkt_channel
      - datalake_gsheets_clean.demand_targets_replanning.mkt_channel
      - datalake_gsheets_clean.mkt_cost_per_source.mkt_channel
      - datalake_gsheets_clean.rental_ntp_source_targets.mkt_channel
  mkt_medium:
    description: Level of the Growth Marketing Taxonomy
    lineage:
      - dw_datamarts.rent_flow_interactions.mkt_medium
      - datalake_marketing_costs.daily_costs.mkt_medium
      - datalake_gsheets_clean.demand_targets_replanning.mkt_medium
      - datalake_gsheets_clean.mkt_cost_per_source.mkt_medium
      - datalake_gsheets_clean.rental_ntp_source_targets.mkt_medium
  mkt_source:
    description: Level of the Growth Marketing Taxonomy
    lineage:
      - dw_datamarts.rent_flow_interactions.mkt_source
      - datalake_marketing_costs.daily_costs.mkt_source
      - datalake_gsheets_clean.demand_targets_replanning.mkt_source
      - datalake_gsheets_clean.mkt_cost_per_source.mkt_source
      - datalake_gsheets_clean.rental_ntp_source_targets.mkt_source
  utm_medium:
    description: Returns utm_medium parameter defined at campaing configuration at marketing platforms
    lineage:
      - dw_datamarts.rent_flow_interactions.utm_medium
  utm_source:
    description: Returns utm_source parameter defined at campaing configuration at marketing platforms
    lineage:
      - dw_datamarts.rent_flow_interactions.utm_source
  utm_campaign:
    description: Returns utm_campaign parameter defined at campaing configuration at marketing platforms
    lineage:
      - dw_datamarts.rent_flow_interactions.utm_campaign
      - datalake_marketing_costs.daily_costs.utm_campaign
  utm_term:
    description: Returns the utm_term parameter defined at campaing configuration at marketing platforms
    lineage:
      - dw_datamarts.rent_flow_interactions.utm_term
      - datalake_marketing_costs.daily_costs.utm_term
  utm_content:
    description: Returns the utm_content parameter defined at campaing configuration at marketing platforms
    lineage:
      - dw_datamarts.rent_flow_interactions.utm_content
      - datalake_marketing_costs.daily_costs.utm_content
  campaign_name:
    description: Returns the name of the campaign setted at the marketing plataform
    lineage:
      - datalake_marketing_costs.daily_costs.campaign_name
  rent_flow_order:
    description: Rent flow ordered by ascending date by unique sk_client and id_house
    lineage:
      - dw_datamarts.rent_flow_interactions.rent_flow_order
  tenant_prospect_order:
    description: Tenant prospect ordered by ascending date by unique sk_client
    lineage:
      - dw_datamarts.rent_flow_interactions.tenant_prospect_order
  marketing_cost:
    description: Cost of growth-marketing to achieve interested flows
    lineage:
      - datalake_marketing_costs.daily_costs.cost
  rent_flows_target:
    description: Rent flow target
    lineage:
      - datalake_gsheets_clean.rental_flows_targets.rf_target
  new_rent_flows_target:
    description: New rent flow target
    lineage:
      - datalake_gsheets_clean.demand_targets_replanning.new_rent_flows_target
  new_tenant_prospects_target:
    description: New tenant prospects target
    lineage:
      - datalake_gsheets_clean.demand_targets_replanning.new_tenant_prospects_target
      - datalake_gsheets_clean.rental_ntp_source_targets.ntp_target
  recovered_tenant_prospects_target:
    description: Recovered tenant prospects target
    lineage:
      - datalake_gsheets_clean.rental_ntp_source_targets.rtp_target
  budget:
    description: Budget that growth marketing team has to invest in each growth marketing channel
    lineage:
      - datalake_gsheets_clean.demand_targets_replanning.budget
      - datalake_gsheets_clean.mkt_cost_per_source.daily_value
