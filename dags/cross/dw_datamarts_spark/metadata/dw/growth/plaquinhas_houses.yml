---
database_name: dw_datamarts
table_name: plaquinhas_houses
owner: '@data-growth'
domain: Data Growth
description: A datamart for plaquinhas campaign for houses and condo tracking.
columns:
  id_house:
    description: This column represents the unique identifier or ID associated with a house or property within the dataset.
    lineage:
      - datalake_listing_temp.fact_house_listing_status_house.sk_house_listing
      - dw_sale.fact_listing_status.sk_sale_listing
  business_context:
    description: This column provides information about the specific business context.
    lineage:
      - datalake_gsheets_clean.plaquinhas_installation_targets.business_context
  short_region_name:
    description: This column contains the abbreviated or shortened name of a specific region.
    lineage:
      - dw_public.dim_region.short_region_name
  city_group:
    description: This column identifies the group or category to which a city belongs.
    lineage:
      - datalake_gsheets_clean.plaquinhas_installation_targets.city_group
      - dw_public.dim_region.city_group
  city_name:
    description: The name of city
    lineage:
      - dw_public.dim_region.city_name
  subregion_name:
    description: This column represents the name of a subregion
    lineage:
      - dw_public.dim_region.name
  installation_type:
    description: This column describes the type or category of installation associated with a property or house.
    lineage:
      - datalake_gsheets_clean.branding_where_is_plaquinha.installation_type
  listing_type:
    description: This column indicates the type of listing.
    lineage:
      - datalake_gsheets_clean.branding_where_is_plaquinha.listing_type
  weekday_name:
    description: Represents a weekday of installation
    lineage:
      - dw_public.dim_date.weekday_name
  has_plaquinha:
    description: This column indicates whether house has a plaquinha.
    lineage:
      - dw_public.dim_date.date
      - dw_sale.fact_listing_flows.sk_condo
      - datalake_gsheets_clean.branding_where_is_plaquinha.id_house
      - datalake_listing_jobs.listing_quality_tasks.id_house
  has_plaquinha_house:
    description: This column specifies whether a house or property specifically has a plaquinha
    lineage:
      - dw_public.dim_date.date
      - dw_sale.fact_listing_flows.sk_condo
      - datalake_gsheets_clean.branding_where_is_plaquinha.id_house
      - datalake_listing_jobs.listing_quality_tasks.id_house
  dt_month_end:
    description: The end of the month
    lineage:
      - dw_public.dim_date.month_end
  dt:
    description: This column represents a date or timestamp associated with a specific data entry or event
    lineage:
      - dw_public.dim_date.date
  dt_plaquinha_installed:
    description: This column indicates the date or timestamp when a plaquinha was installed specifically in a house.
    lineage:
      - datalake_gsheets_clean.branding_where_is_plaquinha.dt_plaquinha
      - dw_public.dim_photo_job.dt_photos_uploaded
  dt_plaquinha_installed_house:
    description: The date when have a plaquinha installed in a house.
    lineage:
      - datalake_gsheets_clean.branding_where_is_plaquinha.dt_plaquinha
      - dw_public.dim_photo_job.dt_photos_uploaded
  new_installed_plaquinhas_target:
    description: The goal of installed plaquinhas.
    lineage:
      - datalake_gsheets_clean.plaquinhas_installation_targets.new_installed_plaquinhas_target
