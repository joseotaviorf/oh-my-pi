---
database_name: dw_datamarts
table_name: plaquinhas_houses
owner: '@data-growth'
domain: Data Growth
description: Measures plaquinhas installs performance. It is divided in two information segments. New Installs and Cover.
columns:
  id_house:
    description: Cover Session - This column represents the unique identifier or ID associated with a house or property within the dataset for Ongoing Listings.
    lineage:
      - datalake_listing_temp.fact_house_listing_status_house.sk_house_listing
      - dw_sale.fact_listing_status.sk_sale_listing
  id_install: 
    description: New Installs Session - This column represents the identifier of installs in each source used to compute installs. Therefore could be same numbers referening to different installs.
    lineage: 
      - datalake_gsheets_clean.branding_where_is_plaquinha.id_house
      - dw_public.dim_photo_job.sk_photo_job
      - dw_tickets.dim_ticket.custom_fields
      - datalake_gsheets_clean.plaquinhas_installation_pp_organic.id_ticket
  photographer_id:
    description: New Installs Session - This columns represents Photographer ID responsible for installs
    lineage: 
      - dw_public.dim_photo_job.photographer_id
  dt_ongoing_listing: 
    description: Cover Session - Indicates the date of ongoing listing frame
    lineage: 
      - dw_public.dim_date.date
      - datalake_gsheets_clean.plaquinhas_cover_targets.dt_target
  dt_install: 
    description: New Installs Session - This column indicates the proxy date or timestamp when a plaquinha was installed specifically in a house.
    lineage:
      - datalake_gsheets_clean.branding_where_is_plaquinha.dt_plaquinha
      - dw_public.dim_photo_job.dt_photos_uploaded
      - dw_tickets.dim_ticket.custom_fields
      - datalake_gsheets_clean.plaquinhas_installation_pp_organic.dt_install
      - datalake_gsheets_clean.plaquinhas_installation_targets.dt_target
  weekday_name:
    description: Cover Session - Represents a weekday of installation
    lineage:
      - dw_public.dim_date.weekday_name
  dt_month_end:
    description: Cover Session - The end of the month
    lineage:
      - dw_public.dim_date.month_end
  business_context:
    description: Cover & New Installs Session - This column provides information about the specific business context.
    lineage:
      - dw_public.dim_house_listing.is_for_rent
      - dw_public.dim_house_listing.is_for_sale
      - dw_tickets.dim_ticket.custom_fields
      - datalake_gsheets_clean.plaquinhas_installation_pp_organic.business_context
      - datalake_gsheets_clean.plaquinhas_installation_targets.business_context
      - datalake_gsheets_clean.plaquinhas_cover_targets.business_context
  country_code:
    description: Cover & New Installs Session - This column contains the country that the house belongs
    lineage:
      - dw_public.dim_region.country_code
  city_group:
    description: Cover & New Installs Session - This column identifies the group or category to which a city belongs.
    lineage:
      - datalake_gsheets_clean.plaquinhas_installation_targets.city_group
      - datalake_gsheets_clean.plaquinhas_cover_targets.city_group
      - dw_public.dim_region.city_group
  city_name:
    description: Cover & New Installs Session - The name of city
    lineage:
      - dw_public.dim_region.city_name
  neighborhood:
    description: Cover & New Installs Session - This column represents the name of a neighborhood
    lineage:
      - dw_public.dim_region.name
  agent_install: 
    description: New Installs Session - States who was the responsible for placas install
    lineage: 
      - datalake_gsheets_clean.branding_where_is_plaquinha.installation_type
      - dw_tickets.dim_ticket.custom_fields
  listing_type: 
    description: New Installs Session - States the type of listing that placas was used for.
    lineage: 
      - datalake_gsheets_clean.branding_where_is_plaquinha.listing_type
      - datalake_gsheets_clean.plaquinhas_installation_targets.listing_type
  not_install_reason: 
    description: New Installs Session - States the reason that was not possible to install that Placa.
    lineage: 
      - dw_tickets.dim_ticket.custom_fields
  has_plaquinha_house:
    description: Cover & New Installs Session - This column specifies whether a house or property specifically has a plaquinha
    lineage:
      - datalake_listing_jobs.listing_quality_tasks.id_house
      - dw_tickets.dim_ticket.custom_fields
      - dw_sale.fact_listing_flows.sk_condo
  new_installed_plaquinhas_target:
    description: New Installs Session - The goal of installed plaquinhas.
    lineage:
      - datalake_gsheets_clean.plaquinhas_installation_targets.new_installed_plaquinhas_target
  active_plaquinhas_target:
    description: New Installs Session - The goal of installed plaquinhas.
    lineage:
      - datalake_gsheets_clean.plaquinhas_cover_targets.active_plaquinhas_target
  cover_target:
    description: New Installs Session - This column specifies the target of coverage or placement achieved by plaquinhas.
    lineage:
      - datalake_gsheets_clean.plaquinhas_cover_targets.cover_target
