  dt_invoice_original_due:
    lineage:
      - datalake_gsheets_clean.base_pdd.dt_invoice_original_due
    description: "Due date based on the most common due date of that competence adjusted for holidays and weekends"
  dt_invoice_due:
    lineage:
      - dw_payment_snapshot.dim_invoice_snapshot.dt_due
      - datalake_gsheets_clean.base_pdd.dt_invoice_due
    description: "Date in which the invoice will be due"
  dt_invoice_created:
    lineage:
      - dw_payment_snapshot.dim_invoice_snapshot.ts_created
      - datalake_gsheets_clean.base_pdd.dt_invoice_created
    description: "Date in which invoice was created"
  dt_invoice_sent:
    lineage:
      - dw_payment_snapshot.dim_invoice_snapshot.dt_sent
      - datalake_gsheets_clean.base_pdd.dt_invoice_sent
    description: "Date in which invoice was sent to user charged"
  invoice_paid_date:
    lineage:
      - dw_payment_snapshot.dim_invoice_snapshot.dt_paid
      - datalake_gsheets_clean.base_pdd.invoice_paid_date
    description: "Date in which invoice was paid, for payable invoices"
  dt_contract_due_date_min:
    lineage:
      - datalake_gsheets_clean.base_pdd.dt_contract_due_date_min
    description: "Minimum date in which the contract will be due"
  dt_processing:
    lineage:
      - dw_payment_snapshot.dim_invoice_snapshot.ts_snapshot
      - datalake_gsheets_clean.base_pdd.dt_processing
    description: "Timestamp which the data was processed"
  is_historic_pdd:
    description: "Boolean indicating if the register is from historical PDD"
  year:
    lineage:
      - dw_payment_snapshot.dim_invoice_snapshot.year
      - datalake_gsheets_clean.base_pdd.year
    description: "Reference year"
  month:
    lineage:
      - dw_payment_snapshot.dim_invoice_snapshot.month
      - datalake_gsheets_clean.base_pdd.month
    description: "Reference month"
  day:
    lineage:
      - dw_payment_snapshot.dim_invoice_snapshot.day
      - datalake_gsheets_clean.base_pdd.day
    description: "Reference day"
