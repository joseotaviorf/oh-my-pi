---
database_name: dw_datamarts
table_name: doubtful_debtors_provision
description: Table containing indicators for the provision of doubtful debtors
domain: Fintech
owner: ae-finance-fintech@quintoandar.com.br
columns:
  id_invoice:
    lineage:
      - dw_payment_snapshot.dim_invoice_snapshot.sk_invoice
      - datalake_gsheets_clean.base_pdd.id_invoice
    description: "Invoice identification number"
  id_contract:
    lineage:
      - datalake_retsuko_clean.contract.id_external
      - datalake_gsheets_clean.base_pdd.id_contract
    description: "External ID of Contract, i.e id of main"
  qty_invoice:
    lineage:
      - datalake_gsheets_clean.base_pdd.qty_invoice
    description: "Total number of invoices"
  contract_version:
    lineage:
      - datalake_retsuko_clean.contract.version
      - datalake_gsheets_clean.base_pdd.contract_version
    description: "Version number of the contract"
  invoice_type:
    lineage:
      - dw_payment_snapshot.dim_invoice_snapshot.frequency
      - datalake_gsheets_clean.base_pdd.invoice_type
