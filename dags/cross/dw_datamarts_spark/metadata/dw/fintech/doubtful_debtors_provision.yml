  provisional_group:
    lineage:
      - datalake_gsheets_clean.base_pdd.provisional_group
    description: "Provisional group"
  accrual_year_month:
    lineage:
      - dw_payment_snapshot.dim_invoice_snapshot.accrual_year_month
      - datalake_gsheets_clean.base_pdd.accrual_year_month
    description: "Competence of invoice, i.e expectation of month for cash flow"
  dt_contract_signature:
    lineage:
      - datalake_retsuko_clean.contract.ts_signature
      - datalake_retsuko_clean.contract.ts_period_started
      - datalake_gsheets_clean.base_pdd.dt_contract_signature
