  invoice_competence_renegotiated:
    lineage:
      - dw_payment_snapshot.dim_invoice_entry_snapshot.accrual_year_month
      - datalake_gsheets_clean.base_pdd.invoice_competence_renegotiated
    description: "Competence of invoice renegotiation"
  invoice_amount:
    lineage:
      - dw_payment_snapshot.dim_invoice_snapshot.due_amount
      - datalake_gsheets_clean.base_pdd.invoice_amount
    description: "Finantial amount of the invoice"
  invoice_status:
    lineage:
      - dw_payment_snapshot.dim_invoice_snapshot.payment_status
      - datalake_gsheets_clean.base_pdd.invoice_status
    description: "Payment status of the invoice"
  invoice_paid_amount:
    lineage:
      - dw_payment_snapshot.dim_invoice_snapshot.paid_amount
      - datalake_gsheets_clean.base_pdd.invoice_paid_amount
    description: "Finantial amount, if paid, of the invoice"
  invoice_paid_via:
    lineage:
      - datalake_gsheets_clean.base_pdd.invoice_paid_via
    description: "Description of how the invoice is paid"
  guarantee:
    lineage:
      - datalake_retsuko_clean.contract.guarantee
      - datalake_gsheets_clean.base_pdd.contract_guarantee
