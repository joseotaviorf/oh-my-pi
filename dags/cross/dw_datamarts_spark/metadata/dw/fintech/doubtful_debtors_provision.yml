  invoice_indentifier:
    lineage:
      - datalake_gsheets_clean.base_pdd.invoice_indentifier
    description: "Invoice identification code"
  our_number:
    lineage:
      - datalake_gsheets_clean.base_pdd.our_number
    description: "OUR number"
  delay_invoice_at_closure:
    lineage:
      - datalake_gsheets_clean.base_pdd.delay_invoice_at_closure
    description: "Invoice delay at closure"
  delay_contamined_at_closure:
    lineage:
      - datalake_gsheets_clean.base_pdd.delay_contamined_at_closure
    description: "Contamined delay at closure"
  delay_invoice_range:
    lineage:
      - datalake_gsheets_clean.base_pdd.delay_invoice_range
    description: "Range of invoice delay"
  delay_contamined_range:
    lineage:
      - datalake_gsheets_clean.base_pdd.delay_contamined_range
    description: "Range of contamined delay"
  city_name:
    lineage:
      - datalake_retsuko_clean.contract.city
      - datalake_gsheets_clean.base_pdd.city_name
