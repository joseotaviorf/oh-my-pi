---
## TEMPLATE
# dags:
#   <context>:
#     load_to_redshift: <boolean> -> default False
#     cluster_name: <cluster_name>
#       # Optional. By default, databricks_default_cluster
#       # Eg: databricks_memory_optimized_cluster
#     owner: <dag_owner>
#       # Mandatory.
#       # Eg: Data ForSale
custom_cluster:
  autotermination_minutes: 20
  driver_node_type_id: c5a.2xlarge
  node_type_id: c5a.4xlarge
  num_workers: 6
  aws_attributes:
    first_on_demand: 1
    availability: SPOT_WITH_FALLBACK
    spot_bid_price_percent: 100
    zone_id: us-east-1d
    ebs_volume_size: 200

databricks_12_2_max_memory_cluster:
  autotermination_minutes: 20
  driver_node_type_id: r5d.8xlarge
  node_type_id: r5d.12xlarge
  runtime_engine: PHOTON
  num_workers: 4
  aws_attributes:
    first_on_demand: 1
    spot_bid_price_percent: 100
    zone_id: us-east-1d
    availability: SPOT_WITH_FALLBACK
    ebs_volume_size: 200

dags:
  cross:
    owner: Data Engineering
    cluster_name: databricks_12_2_med_memory_cluster
  for_sale_cross:
    owner: Data ForSale
    cluster_name: databricks_12_2_min_2xlarge_memory_cluster
