---
## TEMPLATE
# dags:
#   <context>:
#     load_to_redshift: <boolean> -> default False
#     cluster_name: <cluster_name>
#       # Optional. By default, databricks_default_cluster
#       # Eg: databricks_memory_optimized_cluster
#     owner: <dag_owner>
#       # Mandatory.
#       # Eg: Data ForSale
custom_cluster:
  driver_node_type_id: c5n.2xlarge
  node_type_id: c5n.4xlarge
  num_workers: 6
  aws_attributes:
    availability: ON_DEMAND
    ebs_volume_size: 200

databricks_10_4_max_memory_cluster:
  driver_node_type_id: r5d.8xlarge
  node_type_id: r5d.12xlarge
  runtime_engine: PHOTON
  num_workers: 4
  aws_attributes:
    ebs_volume_size: 200

dags:
  cross:
    owner: Data Engineering
    cluster_name: databricks_10_4_med_memory_cluster
  for_rent:
    owner: Data ForRent
    cluster_name: databricks_12_2_high_fixed_workers_8xlarge_general_cluster
  for_rent_cross:
    owner: Data ForRent
    cluster_name: databricks_10_4_med_cluster
  for_sale:
    owner: Data ForSale
    cluster_name: databricks_12_2_med_compute_cluster
    custom_libraries:
      - maven:
          coordinates: "org.apache.sedona:sedona-python-adapter-3.0_2.12:1.2.0-incubating"
      - maven:
          coordinates: "org.datasyslab:geotools-wrapper:1.1.0-25.2"
      - pypi:
          package: geospark
      - pypi:
          package: pytopojson
      - pypi:
          package: apache-sedona
    init_script:
      - s3:
          destination: "s3://artifacts.s3.forno.data.quintoandar.com.br/sedona/sedona-init.sh"
          region: ""
    spark_conf:
      - spark.serializer: "org.apache.spark.serializer.KryoSerializer"
      - spark.sql.extensions: "org.apache.sedona.viz.sql.SedonaVizExtensions,org.apache.sedona.sql.SedonaSqlExtensions"
      - spark.kryo.registrator: "org.apache.sedona.core.serde.SedonaKryoRegistrator"
  for_sale_cross:
    owner: Data ForSale
    cluster_name: databricks_12_2_med_compute_cluster
  fintech:
    cluster_name: databricks_10_4_med_general_cluster
    owner: Data Fintech
  growth:
    owner: Data Growth
    cluster_name: databricks_10_4_max_memory_cluster
    load_to_redshift: True
    custom_schema: datamarts
