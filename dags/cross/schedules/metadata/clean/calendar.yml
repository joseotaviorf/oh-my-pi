---
database_name: datalake_schedules_clean
table_name: calendar
description: |
  Scheduling calendars from the schedules service, one row per calendar entity.
  Calendars represent availability containers for agents, houses, or visitors and are
  consumed by scheduling analytics alongside appointments and attendees.
domain: For Sale and Agents
owner: g.oliveira@quintoandar.com
columns:
  id_calendar:
    lineage:
      - datalake_schedules_raw.calendar.calendar_id
    description: Unique identifier of the scheduling calendar in the schedules service.
  calendar_type:
    lineage:
      - datalake_schedules_raw.calendar.calendar_type
    description: Entity type that owns the calendar availability model.
    categories:
      AGENT: Calendar for an agent's availability.
      HOUSE: Calendar for a property's visit availability.
      VISITOR: Calendar for a visitor's scheduling context.
  ts_created:
    lineage:
      - datalake_schedules_raw.calendar.created_at
    description: Timestamp when the calendar record was created in the source system.
  ts_updated:
    lineage:
      - datalake_schedules_raw.calendar.updated_at
    description: Timestamp when the calendar record was last updated in the source system.
  op_cdc:
    description: CDC operation type captured by Debezium.
    lineage:
      - datalake_schedules_raw.calendar.op_cdc
    categories:
      r: Read/snapshot - initial load of existing records.
      c: Create - new record inserted.
      u: Update - existing record modified.
      d: Delete - record removed.
  ts_cdc_transaction:
    description: Timestamp when the CDC system captured this transaction (millisecond precision).
    lineage:
      - datalake_schedules_raw.calendar.ts_cdc_transaction
  ts_database_transaction:
    description: Timestamp of the original database transaction in the source system.
    lineage:
      - datalake_schedules_raw.calendar.ts_database_transaction
  year:
    lineage:
      - datalake_schedules_raw.calendar.year
    description: Year of the CDC partition derived from the update timestamp.
  month:
    lineage:
      - datalake_schedules_raw.calendar.month
    description: Month of the CDC partition derived from the update timestamp.
  day:
    lineage:
      - datalake_schedules_raw.calendar.day
    description: Day of the CDC partition derived from the update timestamp.
