---
database_name: datalake_schedules_clean
table_name: specific_calendar
description: |
  Date-range specific availability overrides for schedules calendars, one row per override window.
  These records model exceptions to the weekly calendar such as days off, maintenance, or other
  blocked or custom slot configurations.
domain: For Sale and Agents
owner: g.oliveira@quintoandar.com
columns:
  id:
    lineage:
      - datalake_schedules_raw.specific_calendar.id
    description: Unique identifier of the specific calendar override row.
  id_calendar:
    lineage:
      - datalake_schedules_raw.specific_calendar.calendar_id
    description: Foreign key to the parent scheduling calendar.
  dt_start:
    lineage:
      - datalake_schedules_raw.specific_calendar.start_date
    description: Inclusive start date of the specific availability override window.
  dt_end:
    lineage:
      - datalake_schedules_raw.specific_calendar.end_date
    description: Inclusive end date of the specific availability override window.
  slots:
    lineage:
      - datalake_schedules_raw.specific_calendar.slots
    description: Bitmask representing occupied time slots for the override date range.
  reason:
    lineage:
      - datalake_schedules_raw.specific_calendar.reason
    description: Business reason for the specific calendar override.
    categories:
      DAY_OFF: Agent or property is unavailable due to a day off.
      PERSONAL_REASON: Override created for a personal reason.
      HOUSE_MAINTENANCE: Property unavailable due to maintenance.
      CONDOMINIUM_RULES: Override driven by condominium restrictions.
      OTHER_REASON: Override created for another documented reason.
  ts_created:
    lineage:
      - datalake_schedules_raw.specific_calendar.created_at
    description: Timestamp when the specific calendar row was created in the source system.
  ts_updated:
    lineage:
      - datalake_schedules_raw.specific_calendar.updated_at
    description: Timestamp when the specific calendar row was last updated in the source system.
  op_cdc:
    description: CDC operation type captured by Debezium.
    lineage:
      - datalake_schedules_raw.specific_calendar.op_cdc
    categories:
      r: Read/snapshot - initial load of existing records.
      c: Create - new record inserted.
      u: Update - existing record modified.
      d: Delete - record removed.
  ts_cdc_transaction:
    description: Timestamp when the CDC system captured this transaction (millisecond precision).
    lineage:
      - datalake_schedules_raw.specific_calendar.ts_cdc_transaction
  ts_database_transaction:
    description: Timestamp of the original database transaction in the source system.
    lineage:
      - datalake_schedules_raw.specific_calendar.ts_database_transaction
  year:
    lineage:
      - datalake_schedules_raw.specific_calendar.year
    description: Year of the CDC partition derived from the update timestamp.
  month:
    lineage:
      - datalake_schedules_raw.specific_calendar.month
    description: Month of the CDC partition derived from the update timestamp.
  day:
    lineage:
      - datalake_schedules_raw.specific_calendar.day
    description: Day of the CDC partition derived from the update timestamp.
