---
database_name: datalake_schedules_clean
table_name: external_reference
description: |
  External system references from the schedules service, one row per external identifier mapped to a
  scheduling calendar. Links calendars to upstream identity systems and is consumed by scheduling
  analytics alongside appointments and participants.
domain: For Sale and Agents
owner: g.oliveira@quintoandar.com
columns:
  id_external:
    lineage:
      - datalake_schedules_raw.external_reference.external_id
    description: External identifier from the upstream system, used as the primary key for this mapping.
  id_calendar:
    lineage:
      - datalake_schedules_raw.external_reference.calendar_id
    description: Foreign key to the scheduling calendar associated with this external reference.
  identity_source:
    lineage:
      - datalake_schedules_raw.external_reference.identity_source
    description: Name or code of the upstream system that owns the external identifier.
  ts_created:
    lineage:
      - datalake_schedules_raw.external_reference.created_at
    description: Timestamp when the external reference row was created in the source system.
  ts_updated:
    lineage:
      - datalake_schedules_raw.external_reference.updated_at
    description: Timestamp when the external reference row was last updated in the source system.
  op_cdc:
    description: CDC operation type captured by Debezium.
    lineage:
      - datalake_schedules_raw.external_reference.op_cdc
    categories:
      r: Read/snapshot - initial load of existing records.
      c: Create - new record inserted.
      u: Update - existing record modified.
      d: Delete - record removed.
  ts_cdc_transaction:
    description: Timestamp when the CDC system captured this transaction (millisecond precision).
    lineage:
      - datalake_schedules_raw.external_reference.ts_cdc_transaction
  ts_database_transaction:
    description: Timestamp of the original database transaction in the source system.
    lineage:
      - datalake_schedules_raw.external_reference.ts_database_transaction
  year:
    lineage:
      - datalake_schedules_raw.external_reference.year
    description: Year of the CDC partition derived from the update timestamp.
  month:
    lineage:
      - datalake_schedules_raw.external_reference.month
    description: Month of the CDC partition derived from the update timestamp.
  day:
    lineage:
      - datalake_schedules_raw.external_reference.day
    description: Day of the CDC partition derived from the update timestamp.
