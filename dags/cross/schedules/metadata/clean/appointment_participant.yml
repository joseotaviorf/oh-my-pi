---
database_name: datalake_schedules_clean
table_name: appointment_participant
description: |
  Appointment participants from the schedules service, one row per participant linked to an appointment
  and calendar. Coexists with the legacy attendee model and is consumed by scheduling analytics
  alongside appointments and calendars.
domain: For Sale and Agents
owner: g.oliveira@quintoandar.com
columns:
  id:
    lineage:
      - datalake_schedules_raw.appointment_participant.id
    description: Unique identifier of the appointment participant row in the schedules service.
  id_appointment:
    lineage:
      - datalake_schedules_raw.appointment_participant.appointment_id
    description: Foreign key to the appointment this participant belongs to.
  id_calendar:
    lineage:
      - datalake_schedules_raw.appointment_participant.calendar_id
    description: Foreign key to the scheduling calendar associated with this participant.
  member_type:
    lineage:
      - datalake_schedules_raw.appointment_participant.member_type
    description: Role or member category of the participant in the appointment, such as agent or visitor.
  ts_created:
    lineage:
      - datalake_schedules_raw.appointment_participant.created_at
    description: Timestamp when the appointment participant row was created in the source system.
  ts_updated:
    lineage:
      - datalake_schedules_raw.appointment_participant.updated_at
    description: Timestamp when the appointment participant row was last updated in the source system.
  op_cdc:
    description: CDC operation type captured by Debezium.
    lineage:
      - datalake_schedules_raw.appointment_participant.op_cdc
    categories:
      r: Read/snapshot - initial load of existing records.
      c: Create - new record inserted.
      u: Update - existing record modified.
      d: Delete - record removed.
  ts_cdc_transaction:
    description: Timestamp when the CDC system captured this transaction (millisecond precision).
    lineage:
      - datalake_schedules_raw.appointment_participant.ts_cdc_transaction
  ts_database_transaction:
    description: Timestamp of the original database transaction in the source system.
    lineage:
      - datalake_schedules_raw.appointment_participant.ts_database_transaction
  year:
    lineage:
      - datalake_schedules_raw.appointment_participant.year
    description: Year of the CDC partition derived from the update timestamp.
  month:
    lineage:
      - datalake_schedules_raw.appointment_participant.month
    description: Month of the CDC partition derived from the update timestamp.
  day:
    lineage:
      - datalake_schedules_raw.appointment_participant.day
    description: Day of the CDC partition derived from the update timestamp.
