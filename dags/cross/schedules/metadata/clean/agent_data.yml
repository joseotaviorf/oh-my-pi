---
database_name: datalake_schedules_clean
table_name: agent_data
description: |
  Agent-specific scheduling metadata from the schedules service, one row per agent calendar.
  Stores displacement profile configuration used when calculating agent availability and routing
  for visits and inspections. Not to be confused with datalake_ebdb_clean.agent_data.
domain: For Sale and Agents
owner: g.oliveira@quintoandar.com
columns:
  id:
    lineage:
      - datalake_schedules_raw.agent_data.id
    description: Unique identifier of the schedules agent data row.
  id_calendar:
    lineage:
      - datalake_schedules_raw.agent_data.calendar_id
    description: Foreign key to the agent scheduling calendar.
  displacement_profile:
    lineage:
      - datalake_schedules_raw.agent_data.displacement_profile
    description: Agent displacement profile used by scheduling to model travel constraints.
  ts_created:
    lineage:
      - datalake_schedules_raw.agent_data.created_at
    description: Timestamp when the agent data row was created in the source system.
  ts_updated:
    lineage:
      - datalake_schedules_raw.agent_data.updated_at
    description: Timestamp when the agent data row was last updated in the source system.
  op_cdc:
    description: CDC operation type captured by Debezium.
    lineage:
      - datalake_schedules_raw.agent_data.op_cdc
    categories:
      r: Read/snapshot - initial load of existing records.
      c: Create - new record inserted.
      u: Update - existing record modified.
      d: Delete - record removed.
  ts_cdc_transaction:
    description: Timestamp when the CDC system captured this transaction (millisecond precision).
    lineage:
      - datalake_schedules_raw.agent_data.ts_cdc_transaction
  ts_database_transaction:
    description: Timestamp of the original database transaction in the source system.
    lineage:
      - datalake_schedules_raw.agent_data.ts_database_transaction
  year:
    lineage:
      - datalake_schedules_raw.agent_data.year
    description: Year of the CDC partition derived from the update timestamp.
  month:
    lineage:
      - datalake_schedules_raw.agent_data.month
    description: Month of the CDC partition derived from the update timestamp.
  day:
    lineage:
      - datalake_schedules_raw.agent_data.day
    description: Day of the CDC partition derived from the update timestamp.
