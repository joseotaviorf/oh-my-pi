---
database_name: datalake_schedules_clean
table_name: week_calendar
description: |
  Weekly recurring availability slots for schedules calendars, one row per calendar and day of week.
  Each row stores a bitmask of occupied time slots and is used to model default weekly availability
  for agents and properties in the scheduling domain.
domain: For Sale and Agents
owner: g.oliveira@quintoandar.com
columns:
  id:
    lineage:
      - datalake_schedules_raw.week_calendar.id
    description: Unique identifier of the weekly calendar row.
  id_calendar:
    lineage:
      - datalake_schedules_raw.week_calendar.calendar_id
    description: Foreign key to the parent scheduling calendar.
  day_of_week:
    lineage:
      - datalake_schedules_raw.week_calendar.day_of_week
    description: Day of week using ISO numbering where 1 is Monday and 7 is Sunday.
  slots:
    lineage:
      - datalake_schedules_raw.week_calendar.slots
    description: Bitmask representing occupied time slots for the given day of week.
  ts_created:
    lineage:
      - datalake_schedules_raw.week_calendar.created_at
    description: Timestamp when the weekly calendar row was created in the source system.
  ts_updated:
    lineage:
      - datalake_schedules_raw.week_calendar.updated_at
    description: Timestamp when the weekly calendar row was last updated in the source system.
  op_cdc:
    description: CDC operation type captured by Debezium.
    lineage:
      - datalake_schedules_raw.week_calendar.op_cdc
    categories:
      r: Read/snapshot - initial load of existing records.
      c: Create - new record inserted.
      u: Update - existing record modified.
      d: Delete - record removed.
  ts_cdc_transaction:
    description: Timestamp when the CDC system captured this transaction (millisecond precision).
    lineage:
      - datalake_schedules_raw.week_calendar.ts_cdc_transaction
  ts_database_transaction:
    description: Timestamp of the original database transaction in the source system.
    lineage:
      - datalake_schedules_raw.week_calendar.ts_database_transaction
  year:
    lineage:
      - datalake_schedules_raw.week_calendar.year
    description: Year of the CDC partition derived from the update timestamp.
  month:
    lineage:
      - datalake_schedules_raw.week_calendar.month
    description: Month of the CDC partition derived from the update timestamp.
  day:
    lineage:
      - datalake_schedules_raw.week_calendar.day
    description: Day of the CDC partition derived from the update timestamp.
