---
database_name: datalake_schedules_clean
table_name: appointment
description: Scheduling data currently only includes Inspections, but in the future it should contain data on Visits and Photos scheduling.
domain: For Rent
owner: gustavo.silva@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_schedules_raw.appointment.id
    description: Unique ID of the schedule.
  id_parente:
    lineage:
      - datalake_schedules_raw.appointment.parent_id
    description: Parent appointment identifier when the schedule is linked to a rescheduled or derived booking.
  id_location_reference:
    lineage:
      - datalake_schedules_raw.appointment.location_reference_id
    description: Unique ID of the House
  id_internal_reference:
    lineage:
      - datalake_schedules_raw.appointment.internal_reference_id
    description:
      Reference to the scheduled service (number). If the appointment refers to an inspection,
      the id_internal_reference will be the inspection ID, if it is a Visit it will be the visit ID, and so on.
  id_visitant_reference:
    lineage:
      - datalake_schedules_raw.appointment.visitant_reference_id
    description: Unique property visitor identifier
  version:
    lineage:
      - datalake_schedules_raw.appointment.version
    description: Optimistic locking version number incremented on each appointment update.
  type:
    lineage:
      - datalake_schedules_raw.appointment.type
    description: Scheduling service type such as visit, inspection, or photo session for the appointment.
    categories:
      VISIT: Scheduling the Visit
      INSPECTION: Scheduling the property inspection
      INSPECTION_EXTERNALLY_MANAGED: ""
      CHECK_UP_HOME: ""
      PHOTO_SESSION: Scheduling a photo session to publish the property
  dated_at:
    lineage:
      - datalake_schedules_raw.appointment.dated_at
    description: Date for which the service was scheduled
  slot_of_day:
    lineage:
      - datalake_schedules_raw.appointment.slot_of_day
    description: Space of busy days in the agent's calendar
  duration_in_slots:
    lineage:
      - datalake_schedules_raw.appointment.duration_in_slots
    description: Duration in slots in the agent's schedule
  status:
    lineage:
      - datalake_schedules_raw.appointment.status
    description: Current lifecycle status of the appointment in the scheduling workflow.
    categories:
      WAITING_CONFIRMATION: ""
      DONE: ""
      CANCELED: The appointment has been canceled
      SCHEDULED: ""
  check_in_status:
    lineage:
      - datalake_schedules_raw.appointment.check_in_status
    description: Check-in progress status for field operations tied to the scheduled appointment.
  last_app_origin:
    lineage:
      - datalake_schedules_raw.appointment.last_app_origin
    description: Client application or channel that last modified the appointment record.
  code:
    lineage:
      - datalake_schedules_raw.appointment.code
    description: Human-readable or system code identifying the appointment in scheduling operations.
  business_context:
    lineage:
      - datalake_schedules_raw.appointment.business_context
    description: Indicates the business context, which can be Rent or Sale.
  location_reference_name:
    lineage:
      - datalake_schedules_raw.appointment.location_reference_name
    description: Source system or entity type for the property location linked to the appointment.
  internal_reference_name:
    lineage:
      - datalake_schedules_raw.appointment.internal_reference_name
    description: Source system or entity type for the scheduled service reference identifier.
  visitant_date_time:
    lineage:
      - datalake_schedules_raw.appointment.visitant_date_time
    description: Scheduled date and time for the visitor or field agent attendance at the property.
  visitant_reference_name:
    lineage:
      - datalake_schedules_raw.appointment.visitant_reference_name
    description: Source system or entity type for the visitor or attendee reference identifier.
  business_metadata:
    lineage:
      - datalake_schedules_raw.appointment.business_metadata
    description: JSON metadata with business-specific attributes attached to the appointment.
  datetime:
    lineage:
      - datalake_schedules_raw.appointment.datetime
    description: Canonical scheduled date and time of the appointment in local context.
  timezone:
    lineage:
      - datalake_schedules_raw.appointment.timezone
    description: IANA timezone identifier applied to the appointment scheduled datetime.
  is_confirmed:
    lineage:
      - datalake_schedules_raw.appointment.confirmed
    description: Indicates whether the appointment was confirmed by the parties
  is_fixed_agent:
    lineage:
      - datalake_schedules_raw.appointment.fixed_agent
    description:
      Indicates whether the inspection was scheduled with a specific agent,
      rather than a temporary random assignment.
  ts_created:
    lineage:
      - datalake_schedules_raw.appointment.created_at
    description: Appointment creation date.
  ts_updated:
    lineage:
      - datalake_schedules_raw.appointment.updated_at
    description: Appointment update date.
  year:
    lineage:
      - datalake_schedules_raw.appointment.year
    description: Year of update date.
  month:
    lineage:
      - datalake_schedules_raw.appointment.month
    description: Month of update date.
  day:
    lineage:
      - datalake_schedules_raw.appointment.day
    description: Day of update date.
