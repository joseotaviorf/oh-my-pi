---
database_name: datalake_schedules_clean
table_name: location_data
description: |
  Location-specific scheduling metadata from the schedules service, one row per property calendar.
  Stores geographic coordinates and holiday visit preferences used to compute house availability
  and visit scheduling constraints.
domain: For Sale and Agents
owner: g.oliveira@quintoandar.com
columns:
  id:
    lineage:
      - datalake_schedules_raw.location_data.id
    description: Unique identifier of the schedules location data row.
  id_calendar:
    lineage:
      - datalake_schedules_raw.location_data.calendar_id
    description: Foreign key to the property scheduling calendar.
  latitude:
    lineage:
      - datalake_schedules_raw.location_data.location
    description: Latitude of the calendar location in decimal degrees, from the Debezium Point y coordinate.
  longitude:
    lineage:
      - datalake_schedules_raw.location_data.location
    description: Longitude of the calendar location in decimal degrees, from the Debezium Point x coordinate.
  is_accepts_visits_on_holidays:
    lineage:
      - datalake_schedules_raw.location_data.accepts_visits_on_holidays
    description: Indicates whether visits are allowed on holidays for the calendar location.
  ts_created:
    lineage:
      - datalake_schedules_raw.location_data.created_at
    description: Timestamp when the location data row was created in the source system.
  ts_updated:
    lineage:
      - datalake_schedules_raw.location_data.updated_at
    description: Timestamp when the location data row was last updated in the source system.
  op_cdc:
    description: CDC operation type captured by Debezium.
    lineage:
      - datalake_schedules_raw.location_data.op_cdc
    categories:
      r: Read/snapshot - initial load of existing records.
      c: Create - new record inserted.
      u: Update - existing record modified.
      d: Delete - record removed.
  ts_cdc_transaction:
    description: Timestamp when the CDC system captured this transaction (millisecond precision).
    lineage:
      - datalake_schedules_raw.location_data.ts_cdc_transaction
  ts_database_transaction:
    description: Timestamp of the original database transaction in the source system.
    lineage:
      - datalake_schedules_raw.location_data.ts_database_transaction
  year:
    lineage:
      - datalake_schedules_raw.location_data.year
    description: Year of the CDC partition derived from the update timestamp.
  month:
    lineage:
      - datalake_schedules_raw.location_data.month
    description: Month of the CDC partition derived from the update timestamp.
  day:
    lineage:
      - datalake_schedules_raw.location_data.day
    description: Day of the CDC partition derived from the update timestamp.
