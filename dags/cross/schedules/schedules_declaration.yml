dag:
  name: schedules
  schedule_start_date: 2024, 1, 1
  schedule_interval: 0 0 * * *
  owner: Data ForRent
  documentation:
    dag_purpose: |
      Dag Raw/Clean in order to ingest general scheduling data into the analytical environment.

workflow:
  type: cdc
  layer: raw
  database_type: postgres
  source_database: schedules
  source_schema: public
  dbutils_secret_key: SCHEDULES_DB
  lineage_product_database_name: schedules
  tables_customization:
    appointment_history:
      clean_table_name: appointment_history
      raw_primary_keys: [id]
      clean_primary_keys: [id]
      get_table_metrics:
        count: "id"
    appointment:
      clean_table_name: appointment
      raw_primary_keys: [id]
      clean_primary_keys: [id]
      get_table_metrics:
        count: "id"
    attendee:
      clean_table_name: attendee
      raw_primary_keys: [id]
      clean_primary_keys: [id]
      get_table_metrics:
        count: "id"
    calendar:
      clean_table_name: calendar
      raw_primary_keys: [calendar_id]
      clean_primary_keys: [id_calendar]
      get_table_metrics:
        count: "calendar_id"
    week_calendar:
      clean_table_name: week_calendar
      raw_primary_keys: [id]
      clean_primary_keys: [id]
      get_table_metrics:
        count: "id"
    specific_calendar:
      clean_table_name: specific_calendar
      raw_primary_keys: [id]
      clean_primary_keys: [id]
      get_table_metrics:
        count: "id"
    agent_data:
      clean_table_name: agent_data
      raw_primary_keys: [id]
      clean_primary_keys: [id]
      get_table_metrics:
        count: "id"
    location_data:
      clean_table_name: location_data
      raw_primary_keys: [id]
      clean_primary_keys: [id]
      get_table_metrics:
        count: "id"
    appointment_participant:
      clean_table_name: appointment_participant
      raw_primary_keys: [id]
      clean_primary_keys: [id]
      get_table_metrics:
        count: "id"
    external_reference:
      clean_table_name: external_reference
      raw_primary_keys: [external_id]
      clean_primary_keys: [id_external]
      get_table_metrics:
        count: "external_id"

