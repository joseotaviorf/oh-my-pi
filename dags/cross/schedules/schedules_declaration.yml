dag:
  name: schedules
  schedule_start_date: 2024, 1, 1
  schedule_interval: 0 0 * * *
  owner: Data SS
  documentation:
    dag_purpose: |
      Dag Raw/Clean in order to ingest general scheduling data into the analytical environment.

workflow:
  type: cdc
  layer: raw
  database_type: postgres
  source_database: schedules
  source_schema: public
  dbutils_secret_key: SCHEDULES_DB
  lineage_product_database_name: schedules
  tables_customization:
    appointment_history:
      clean_table_name: appointment_history
      raw_primary_keys: [id]
      clean_primary_keys: [id]
      get_table_metrics:
        count: "id"
    appointment:
      clean_table_name: appointment
      raw_primary_keys: [id]
      clean_primary_keys: [id]
      get_table_metrics:
        count: "id"
    attendee:
      clean_table_name: attendee
      raw_primary_keys: [id]
      clean_primary_keys: [id]
      get_table_metrics:
        count: "id"

cluster:
  type: databricks_12_2_med_general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
