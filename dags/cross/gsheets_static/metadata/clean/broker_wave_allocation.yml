---
database_name: datalake_gsheets_clean
table_name: broker_wave_allocation
owner: juliana.hocihara@quintoandar.com.br
domain: Fintech
description: Broker incentive wave allocation snapshot from Google Sheets. Ranks brokers by contract volume and expected revenue to define participation shares across Fintech renegotiation waves.
columns:
  sk_broker:
    lineage:
      - datalake_gsheets_raw.broker_wave_allocation.sk_broker
    description: Surrogate key identifying the broker in the allocation exercise.
  qtd_contratos:
    lineage:
      - datalake_gsheets_raw.broker_wave_allocation.qtd_contratos
    description: Number of contracts attributed to the broker in the current allocation period.
  expected_revenue:
    lineage:
      - datalake_gsheets_raw.broker_wave_allocation.expected_revenue
    description: Forecasted revenue in BRL associated with the broker contract portfolio.
  share_contratos:
    lineage:
      - datalake_gsheets_raw.broker_wave_allocation.share_contratos
    description: Broker share of total contracts in the wave before cumulative adjustments.
  contratos_acc:
    lineage:
      - datalake_gsheets_raw.broker_wave_allocation.contratos_acc
    description: Cumulative contract count used when ranking brokers within the wave.
  share_contratos_acc:
    lineage:
      - datalake_gsheets_raw.broker_wave_allocation.share_contratos_acc
    description: Cumulative contract share after applying running totals across ranked brokers.
  rank:
    lineage:
      - datalake_gsheets_raw.broker_wave_allocation.rank
    description: Position of the broker in the wave ranking ordered by contract or revenue criteria.
  share_reas:
    lineage:
      - datalake_gsheets_raw.broker_wave_allocation.share_reas
    description: Final reassigned share of contracts or revenue allocated to the broker in the wave.
  wave:
    lineage:
      - datalake_gsheets_raw.broker_wave_allocation.wave
    description: Label of the incentive or renegotiation wave to which the allocation row belongs.
