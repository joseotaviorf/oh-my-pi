---
database_name: datalake_gsheets_clean
table_name: demand_targets_retro_cohort
owner: gustavo.silva@quintoandar.com.br
domain: For Rent
description: Cohort-based retrospective rental demand conversion targets by week and funnel step. Tracks planned conversion volumes between visits, offers, credit, and contracts for For Rent planning.
columns:
  dt_week_started:
    lineage:
      - datalake_gsheets_raw.demand_targets_retro_cohort.week_start
    description: Start date of the cohort week used in retrospective conversion targets.
  city_group:
    lineage:
      - datalake_gsheets_raw.demand_targets_retro_cohort.city_group
    description: QuintoAndar city group associated with the cohort conversion targets.
  rental_administrator:
    lineage:
      - datalake_gsheets_raw.demand_targets_retro_cohort.rental_administrator
    description: Contract administrator type for listings in the cohort target slice.
  business_type:
    lineage:
      - datalake_gsheets_raw.demand_targets_retro_cohort.business_type
    description: Business line of the listing (ASP, CIQ, B2B, or Core) in the cohort row.
  rent_flow_origin:
    lineage:
      - datalake_gsheets_raw.demand_targets_retro_cohort.rent_flow_origin
    description: First-touch origin of the rental flow for the cohort conversion targets.
  weeks_conversion:
    lineage:
      - datalake_gsheets_raw.demand_targets_retro_cohort.weeks_conversion
    description: Cohort lag label (W0, W1, etc.) measuring weeks between funnel events.
  vb2vc:
    lineage:
      - datalake_gsheets_raw.demand_targets_retro_cohort.vb2vc
    description: Target volume converting from visits booked to visits completed in the cohort.
  vc2os:
    lineage:
      - datalake_gsheets_raw.demand_targets_retro_cohort.vc2os
    description: Target volume converting from visits completed to offers submitted.
  os2oa:
    lineage:
      - datalake_gsheets_raw.demand_targets_retro_cohort.os2oa
    description: Target volume converting from offers submitted to offers accepted.
  oa2ca:
    lineage:
      - datalake_gsheets_raw.demand_targets_retro_cohort.oa2ca
    description: Target volume converting from offers accepted to credit analysis approved.
  ca2cs:
    lineage:
      - datalake_gsheets_raw.demand_targets_retro_cohort.ca2cs
    description: Target volume converting from credit approved to contracts signed.
  cs:
    lineage:
      - datalake_gsheets_raw.demand_targets_retro_cohort.cs
    description: Target count of contracts signed at the cohort conversion step.
  vb2os:
    lineage:
      - datalake_gsheets_raw.demand_targets_retro_cohort.vb2os
    description: Target volume converting directly from visits booked to offers submitted.
