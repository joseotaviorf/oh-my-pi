  concat_city_neighborhood:
    lineage:
      - datalake_gsheets_raw.sale_comission_for_strategic_region.concat_city_neighborhood
    description: Concatenated city and neighbourhood label used as a lookup key.
  is_strategic_region:
    lineage:
      - datalake_gsheets_raw.sale_comission_for_strategic_region.strategic_region
