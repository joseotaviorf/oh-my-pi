---
database_name: datalake_gsheets_clean
table_name: survival_estimation_new_version
owner: gustavo.silva@quintoandar.com.br
domain: Cross
description: Updated rental contract survival estimation curves by cohort month. Revised static reference used by Cross analytics to model retention and churn across rental cohorts.
columns:
  first_rentals:
    lineage:
      - datalake_gsheets_raw.survival_estimation_new_version.first_rentals
    description: Count of first rental contracts in the updated survival estimation cohort.
  dt_contract_started_month:
    lineage:
      - datalake_gsheets_raw.survival_estimation_new_version.contract_start_month
    description: Month when contracts in the cohort started, used as the survival analysis anchor.
  dt_month_after:
    lineage:
      - datalake_gsheets_raw.survival_estimation_new_version.months_after
    description: Number of months elapsed after the contract start month in the survival curve.
  months_after_first_contract:
    lineage:
      - datalake_gsheets_raw.survival_estimation_new_version.months_after_first_contract
    description: Number of months elapsed after the tenant first contract in the survival curve.
  total_re_rentals:
    lineage:
      - datalake_gsheets_raw.survival_estimation_new_version.total_re_rentals
    description: Total count of re-rental contracts observed in the updated survival estimation cohort.
  total_rentals:
    lineage:
      - datalake_gsheets_raw.survival_estimation_new_version.total_rentals
    description: Total count of rental contracts observed in the updated survival estimation cohort.
  ended_first_rentals:
    lineage:
      - datalake_gsheets_raw.survival_estimation_new_version.ended_first_rentals
    description: Count of ended first rental contracts at the given months-after interval.
  ended_re_rentals:
    lineage:
      - datalake_gsheets_raw.survival_estimation_new_version.ended_re_rentals
    description: Count of ended re-rental contracts at the given months-after interval.
  ended_rentals:
    lineage:
      - datalake_gsheets_raw.survival_estimation_new_version.ended_rentals
    description: Count of all ended rental contracts at the given months-after interval.
  year:
    lineage:
      - datalake_gsheets_raw.survival_estimation_new_version.year
    description: Calendar year associated with the updated survival estimation reference data.
  dt_last_updated:
    lineage:
      - datalake_gsheets_raw.survival_estimation_new_version.dt_last_updated
    description: Date when the updated survival estimation spreadsheet was last refreshed.
