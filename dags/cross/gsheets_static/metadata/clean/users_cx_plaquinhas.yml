---
database_name: datalake_gsheets_clean
table_name: users_cx_plaquinhas
owner: gabriel.salla@quintoandar.com
domain: Growth
description: Customer experience survey responses from plaquinha (signage) outreach campaigns. Tracks user awareness, visit intent, and neighbourhood context for CX field operations.
columns:
  id_house:
    lineage:
      - datalake_gsheets_raw.users_cx_plaquinhas.id_house
    description: QuintoAndar house identifier associated with the plaquinha outreach response.
  id_user:
    lineage:
      - datalake_gsheets_raw.users_cx_plaquinhas.id_user
    description: QuintoAndar user identifier of the respondent in the plaquinha campaign.
  atendimento_plaquinha:
    lineage:
      - datalake_gsheets_raw.users_cx_plaquinhas.atendimento_plaquinha
    description: CX service or attendant identifier linked to the plaquinha outreach interaction.
  bairro:
    lineage:
      - datalake_gsheets_raw.users_cx_plaquinhas.bairro
    description: Neighbourhood where the plaquinha outreach or survey response occurred.
  canal:
    lineage:
      - datalake_gsheets_raw.users_cx_plaquinhas.canal
    description: Outreach or response channel used in the plaquinha customer experience campaign.
  conhecia_5a:
    lineage:
      - datalake_gsheets_raw.users_cx_plaquinhas.conhecia_5a
    description: Respondent indication of prior awareness of QuintoAndar before the plaquinha contact.
  conhecia_5a_2:
    lineage:
      - datalake_gsheets_raw.users_cx_plaquinhas.conhecia_5a_2
    description: Secondary follow-up response about prior awareness of QuintoAndar.
  email:
    lineage:
      - datalake_gsheets_raw.users_cx_plaquinhas.email
    description: Email address provided by the respondent in the plaquinha survey.
  motivo:
    lineage:
      - datalake_gsheets_raw.users_cx_plaquinhas.motivo
    description: Reason or motivation reported by the respondent during the plaquinha interaction.
  has_visit_booked:
    lineage:
      - datalake_gsheets_raw.users_cx_plaquinhas.has_visit_booked
    description: Boolean flag indicating whether the respondent booked a property visit.
  data_hora:
    lineage:
      - datalake_gsheets_raw.users_cx_plaquinhas.data_hora
    description: Timestamp when the plaquinha survey response or interaction was recorded.
