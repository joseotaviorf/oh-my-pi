---
database_name: datalake_gsheets_clean
table_name: demand_targets_retro
owner: gustavo.silva@quintoandar.com.br
domain: For Rent
description: Retrospective rental demand funnel targets by city group and business slice. Used by For Rent analytics to compare actual funnel performance against historical planning baselines.
columns:
  city_group:
    lineage:
      - datalake_gsheets_raw.demand_targets_retro.city_group
    description: QuintoAndar city group associated with the retrospective demand targets.
  dt_target:
    lineage:
      - datalake_gsheets_raw.demand_targets_retro.date
    description: Reference date identifying the retrospective target planning period.
  business_type:
    lineage:
      - datalake_gsheets_raw.demand_targets_retro.business_type
    description: Business line of the listing (ASP, CIQ, B2B, or Core) for the target row.
  rent_flow_origin:
    lineage:
      - datalake_gsheets_raw.demand_targets_retro.rent_flow_origin
    description: First-touch origin of the rental flow linked to the retrospective targets.
  rental_administrator:
    lineage:
      - datalake_gsheets_raw.demand_targets_retro.rental_administrator
    description: Contract administrator responsible for listings in the target slice.
  visits_booked:
    lineage:
      - datalake_gsheets_raw.demand_targets_retro.visits_booked
    description: Retrospective target count of property visits booked by tenants.
  visits_completed:
    lineage:
      - datalake_gsheets_raw.demand_targets_retro.visits_completed
    description: Retrospective target count of property visits completed by tenants.
  offers_submitted:
    lineage:
      - datalake_gsheets_raw.demand_targets_retro.offers_submitted
    description: Retrospective target count of rental offers submitted in the funnel.
  offers_accepted:
    lineage:
      - datalake_gsheets_raw.demand_targets_retro.offers_accepted
    description: Retrospective target count of rental offers accepted by stakeholders.
  evaluation_started:
    lineage:
      - datalake_gsheets_raw.demand_targets_retro.evaluation_started
    description: Retrospective target count of tenant credit evaluations started.
  evaluation_positive:
    lineage:
      - datalake_gsheets_raw.demand_targets_retro.evaluation_positive
    description: Retrospective target count of evaluations with a positive outcome.
  documentation_sent:
    lineage:
      - datalake_gsheets_raw.demand_targets_retro.documentation_sent
    description: Retrospective target count of documentation packages sent to tenants.
  credit_approved:
    lineage:
      - datalake_gsheets_raw.demand_targets_retro.credit_approved
    description: Retrospective target count of tenants approved in credit analysis.
  contracts_signed:
    lineage:
      - datalake_gsheets_raw.demand_targets_retro.contracts_signed
    description: Retrospective target count of rental contracts signed in the period.
