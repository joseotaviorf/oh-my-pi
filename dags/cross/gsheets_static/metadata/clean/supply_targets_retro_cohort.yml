---
database_name: datalake_gsheets_clean
table_name: supply_targets_retro_cohort
owner: gabriel.salla@quintoandar.com
domain: Growth
description: Retrospective Growth supply funnel targets by cohort week and planning dimensions. Captures planned conversion volumes across prospects, qualifieds, and first listings.
columns:
  dt_week_started:
    lineage:
      - datalake_gsheets_raw.supply_targets_retro_cohort.week_start
    description: Reference week start date identifying the retrospective cohort supply target period.
  city_group:
    lineage:
      - datalake_gsheets_raw.supply_targets_retro_cohort.city_group
    description: QuintoAndar city group associated with the retrospective cohort supply targets.
  lead_processing_operation:
    lineage:
      - datalake_gsheets_raw.supply_targets_retro_cohort.lead_processing_operation
    description: Operation team or workflow that processed the listing lead for the cohort target row.
  supply_mkt_origin_detailed:
    lineage:
      - datalake_gsheets_raw.supply_targets_retro_cohort.supply_mkt_origin_detailed
    description: Detailed marketing origin of the owner lead used in cohort supply target planning.
  planning_taxonomy:
    lineage:
      - datalake_gsheets_raw.supply_targets_retro_cohort.planning_taxonomy
    description: Planning taxonomy combining supply marketing origin and medium channel for the cohort row.
  rental_administrator:
    lineage:
      - datalake_gsheets_raw.supply_targets_retro_cohort.rental_administrator
    description: Contract administrator responsible for the listing (QuintoAndar, third party, or brokerage only).
  planning_conversion:
    lineage:
      - datalake_gsheets_raw.supply_targets_retro_cohort.planning_conversion
    description: Detailed conversion operation type, distinguishing Inside Sales inbound, outbound, and expert flows.
  planning_operation:
    lineage:
      - datalake_gsheets_raw.supply_targets_retro_cohort.planning_operation
    description: High-level conversion operation type associated with the cohort supply target row.
  planning_cluster:
    lineage:
      - datalake_gsheets_raw.supply_targets_retro_cohort.planning_cluster
    description: Channel cluster for affiliates or medium for Owner PWA and price calculator flows.
  company_report_origin:
    lineage:
      - datalake_gsheets_raw.supply_targets_retro_cohort.company_report_origin
    description: Acquisition channel for IS and FSS operations or conversion source for CIQ, Rede, and Captaí flows.
  weeks_conversion:
    lineage:
      - datalake_gsheets_raw.supply_targets_retro_cohort.weeks_conversion
    description: Cohort week indicator representing elapsed weeks between funnel events (W0, W1, and so on).
  op2q:
    lineage:
      - datalake_gsheets_raw.supply_targets_retro_cohort.op2q
    description: Cohort target volume of owner prospects that converted into qualified leads.
  q2opp:
    lineage:
      - datalake_gsheets_raw.supply_targets_retro_cohort.q2opp
    description: Cohort target volume of qualified leads that converted into supply opportunities.
  opp2fl:
    lineage:
      - datalake_gsheets_raw.supply_targets_retro_cohort.opp2fl
    description: Cohort target volume of opportunities that converted into first listings published.
  q2avq:
    lineage:
      - datalake_gsheets_raw.supply_targets_retro_cohort.q2avq
    description: Cohort target volume of qualified leads that converted into available qualifieds.
  avq2opp:
    lineage:
      - datalake_gsheets_raw.supply_targets_retro_cohort.avq2opp
    description: Cohort target volume of available qualifieds that converted into supply opportunities.
  fl:
    lineage:
      - datalake_gsheets_raw.supply_targets_retro_cohort.fl
    description: Cohort target volume of first listings published in the reference period.
