---
dag:
  name: enrich_opsgenie
  schedule_start_date: 2020, 1, 1
  owner: Data Engineering
  documentation:
    dag_purpose: 'Get data from OpsGenie alerts and "acordamentos" to monitor Data Engineering Incidents.'
workflow:
  type: query_delta
  layer: enrich
  tables_customization:
    alerts:
      extraction_type: incremental
      partitions:   
        - year
        - month
        - day
    acordamentos:
      extraction_type: full
cluster:
  type: databricks_12_2_min_general_cluster