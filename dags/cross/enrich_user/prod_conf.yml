---
dag_documentation:
  dag_purpose:
    "This DAG main responsibility is to provide all the QuintoAndar Personas, \n
    by Personas, the user type, which can be a property owner, tenant, broker, \n
    photographer, pp multi, prospect, among others. It provides a daily snapshot."

inner_dependencies:
  persona_type:
    - broker_user
    - tenant
    - photographer_user
    - landlord

tables:
  broker_user:
    partition_cols: [year, month, day]
    has_hive_sync: False
  photographer_user:
    partition_cols: [year, month, day]
    has_hive_sync: False
  landlord:
    partition_cols: [year, month, day]
    has_hive_sync: False
  tenant:
    partition_cols: [year, month, day]
    has_hive_sync: False
  persona_type:
    partition_cols: [client_type, year, month, day]
    has_hive_sync: True
