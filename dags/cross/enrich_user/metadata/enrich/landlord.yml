---
database_name: datalake_user
table_name: property_owner
description:
  Ebdb Users daily snapshot classified as active property owners, considering houses
  with the status of alugado, suspenso, aguardando_publicacao, edicao or publicado.
  The house id_user should not be an active partner agent.
domain: Cross
owner: data-ae-ss@quintoandar.com.br
columns:
  id_snapshot:
    description: The snapshot id, which is the D-1 date in the format "yyyyMMdd"
  id_user:
    lineage:
      - datalake_ebdb_clean.user.id
    description: The user id in the main.
  id_country:
    lineage:
      - datalake_ebdb_clean.user.id_country
    description: The user country id.
  client_type:
    description: Client type defined as property owner.
  country_code:
    lineage:
      - datalake_ebdb_clean.country.country_code
    description: Country code of the user. Also, a partition of this table.
  main_phone:
    lineage:
      - datalake_ebdb_clean.user.main_phone
    description: The user main_phone.
  name:
    lineage:
      - datalake_ebdb_clean.user.name
    description: The user full_name.
  email:
    lineage:
      - datalake_ebdb_clean.user.email
    description: The user email.
  cpf:
    lineage:
      - datalake_ebdb_clean.user.cpf
    description: The user individual brazilian registry.
  journey_step:
    lineage:
      - datalake_landlord_journey.landlord_journey_step.journey_step
    description: How deep the customer is on their rental journey
    categories:
      Offboarding:
        Indicates if the client is currently in the offboarding step in
        the rental context
      Ongoing:
        Indicates if the client is in the ongoing step but not in the offboarding step
        in the rental context
      Onboarding:
        Indicates if the client is in the onboarding step but not in the offboarding
        or ongoing steps in the rental context
      Contract to Entrance:
        Indicates if the client is in the contract to entrance step but not in the
        onboarding, ongoing, or offboarding steps in the rental context
      Visits to Offer:
        Indicates if the client is in the visits to offer step but not in the contract
        to entrance, onboarding, ongoing, or offboarding steps in the rental context
      Listing and Search:
        Indicates if the client is in the listing and search step but not in the visits
        to offer, contract to entrance, onboarding, ongoing, or offboarding steps in the
        rental context
      Default:
        Indicates if the client is not currently active in any of the journey steps
        in the rental context
  persona_step:
    lineage:
      - datalake_landlord_journey.landlord_journey_step.persona_step
    description:
      Indicates if the user is in any step before signing a contract or after signing a
      contract. If the user is in the post_contract step,it will not assume the
      pre_contract step
    categories:
      Pre_Contract:
        If the user has taken any step in contract to entrance, visits to offer, or
        listing and search, it signifies that the user is in a pre-contract step
      Post_Contract:
        If the user has taken any step in offboarding, ongoing, or onboarding, it
        indicates that the user is in a post-contract step
      Not_Apply: If the user is not in the pre or post contract steps
  is_active:
    lineage:
      - datalake_ebdb_clean.user.is_active
    description: If the user is active or not.
  is_blocked:
    lineage:
      - datalake_ebdb_clean.user.is_blocked
    description: If the user is blocked or not.
  is_pp_multi:
    description: If the user is part of pp_multi program or not.
  is_offboarding:
    lineage:
      - datalake_landlord_journey.landlord_journey_step.is_offboarding
    description:
      If the user has an active termination, it indicates that the user is currently
      in the offboarding step of the rental journey
  is_ongoing:
    lineage:
      - datalake_landlord_journey.landlord_journey_step.is_ongoing
    description:
      If the user has at least one active contract and the last contract signed occurred
      past the last 40 days, with the snapshot date serving as the reference point, then the
      user is currently in the ongoing step of the rental journey
  is_onboarding:
    lineage:
      - datalake_landlord_journey.landlord_journey_step.is_onboarding
    description:
      If the user has at least one active contract and the last contract signed occurred
      within the last 40 days, with the snapshot date serving as the reference point, then the
      user is currently in the onboarding step of the rental journey
  is_contract_to_entrance:
    lineage:
      - datalake_landlord_journey.landlord_journey_step.is_contract_to_entrance
    description:
      If the user has had events such as the last evaluation start, last evaluation approval,
      last document sending, last credit approval, or last proposal rejection within the
      last 40 days, with the snapshot date as the reference point, then the user is
      currently in the contract to entrance step of the rental journey
  is_visits_to_offer:
    lineage:
      - datalake_landlord_journey.landlord_journey_step.is_visits_to_offer
    description:
      If the user has had events such as the last booking, last canceled booking,
      last visiting, last offer sending, last offer rejected, last reservation created,
      or last offer approval within the last 40 days, with the snapshot date as the
      reference point, then the user is currently in the visits to offer step of
      the rental journey
  is_listing_and_search:
    lineage:
      - datalake_landlord_journey.landlord_journey_step.is_listing_and_search
    description:
      If the user has had a last house searching event within the last 40 days, with
      the snapshot date as the reference point, then the user is currently in the
      listing and search step of the rental journey
  is_pre_contract:
    lineage:
      - datalake_landlord_journey.landlord_journey_step.is_pre_contract
    description:
      If the user has taken any step in contract to entrance, visits to offer, or
      listing and search, it signifies that the user is in a pre-contract step
  is_post_contract:
    lineage:
      - datalake_landlord_journey.landlord_journey_step.is_post_contract
    description:
      If the user has taken any step in offboarding, ongoing, or onboarding, it indicates
      that the user is in a post-contract step
  dt_birth:
    lineage:
      - datalake_ebdb_clean.user.dt_birth
    description: The user birth date.
  ts_user_created:
    lineage:
      - datalake_ebdb_clean.user.ts_created
    description: The user creation date in the system.
  ts_user_updated:
    lineage:
      - datalake_ebdb_clean.user.ts_updated
    description: The user last updated date in the system.
  year:
    description: Snapshot year, partition column.
  month:
    description: Snapshot month, partition column.
  day:
    description: Snapshot day, partition column.
