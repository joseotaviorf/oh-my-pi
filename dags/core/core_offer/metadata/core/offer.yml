database_name: core_offer
table_name: offer
domain: For Rent
owner: isadora.gallerani@quintoandar.com.br
description: Offer Core Model for Rental Transact offers.
  At this moment, it doesn't have any historical data from EBDB or Firestore/Firebase.
columns:
  sk_core_offer:
    lineage:
      - datalake_rental_transact_clean.offer.id
    description: Surrogate key related to the Offer Core Model.
      It's made by concatenating "OFFER||id_offer" and then applying the SHA256 hash.
      This key must always be unique.
  id_offer:
    lineage:
      - datalake_rental_transact_clean.offer.id
    description: Identifier of the offer. It's the id of the Offer table from rental transact database.
      This identifier is used internally in our systems.
      This key must always be unique.
  uuid_offer:
    lineage:
      - datalake_rental_transact_clean.offer.offer_uuid
    description: Universally Unique Identifier of the offer.
      It's the uuid of the Offer table from rental transact database.
      This identifier is used internally in our systems.
      This key must always be unique.
  id_tenant:
    lineage:
      - datalake_ebdb_clean.user.id
    description: Internal identifier of the tenant from EBDB database.
      This is the internal ID that corresponds to the tenant identifier.
  id_tenant_external:
    lineage:
      - datalake_rental_transact_clean.offer.id_tenant_external
    description: External identifier of the tenant related to this offer.
      This references the tenant from Person's database.
  id_owner:
    lineage:
      - datalake_ebdb_clean.user.id
    description: Internal identifier of the property owner from EBDB database.
      This is the internal ID that corresponds to the owner identifier.
  id_owner_external:
    lineage:
      - datalake_rental_transact_clean.offer.id_owner_external
    description: External identifier of the property owner related to this offer.
      This references the owner from Person's database.
  id_resident_info:
    lineage:
      - datalake_rental_transact_clean.offer.id_resident_info
    description: Identifier of the resident information associated with this offer.
      Contains details about the potential tenant.
  id_house:
    lineage:
      - datalake_rental_transact_clean.offer.id_house_external
    description: External identifier of the house/property related to this offer.
      This references the property from external systems.
  status:
    lineage:
      - datalake_rental_transact_clean.offer.status
    description: Current status of the offer in the rental transaction process.
      Indicates the stage of the offer lifecycle.
  type:
    lineage:
      - datalake_rental_transact_clean.offer.type
    description: Type of the rental offer.
      Categorizes the kind of rental transaction offer.
    categories:
      CUSTOM: When the tenant prospect wants to customize the offer (for example, proposing a different rent value,
        asking to remove furniture, etc.).
      EXPRESS: When the tenant prospect accepts the price and all conditions asked by the owner
        and makes no other requests.
  turn:
    lineage:
      - datalake_rental_transact_clean.offer.turn
    description: Turn number in the negotiation process.
      Indicates the sequence of offers/counter-offers.
  iteration:
    lineage:
      - datalake_rental_transact_clean.offer.iteration
    description: Iteration number within the current turn.
      Tracks revisions within the same negotiation turn.
  rejection_reason:
    lineage:
      - datalake_rental_transact_clean.offer.rejection_reason
    description: Reason why the offer was rejected, if applicable.
      Provides context when an offer is not accepted.
  original_rent_value:
    lineage:
      - datalake_rental_transact_clean.offer.original_rent_value
    description: Original rental value proposed in the offer.
      The monetary amount initially offered for the rental.
  ts_created:
    lineage:
      - datalake_rental_transact_clean.offer.ts_created
    description: Timestamp when the offer was originally created.
      Records the creation time in the rental transaction system.
  ts_updated:
    lineage:
      - datalake_rental_transact_clean.offer.ts_updated
    description: Timestamp when the offer was last updated.
      Tracks the most recent modification to the offer.
  ts_expiration:
    lineage:
      - datalake_rental_transact_clean.offer.ts_expiration
    description: Timestamp when the offer expires.
      Indicates the deadline for accepting the offer.
  ts_load:
    description: Timestamp of when the Offer Core Model was updated and loaded for the last time.
  year:
    lineage:
      - datalake_rental_transact_clean.offer.ts_updated
    description: Year of when the offer was updated. Also, it's a table partition.
  month:
    lineage:
      - datalake_rental_transact_clean.offer.ts_updated
    description: Month of when the offer was updated. Also, it's a table partition.
  day:
    lineage:
      - datalake_rental_transact_clean.offer.ts_updated
    description: Day of when the offer was updated. Also, it's a table partition.