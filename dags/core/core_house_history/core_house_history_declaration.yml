dag:
  name: core_house_history
  schedule_start_date: 2025, 1, 1
  owner: Data House and Listing
  documentation:
    dag_purpose: |
      Creates the House Historical Core Model (narrow event-log from CDC).
      Each row represents a single field-level change detected from the
      clean CDC layer, using a fixed 13-column schema. Tracks the same
      fields as core_house (address, type, area, rooms, owner, etc.)
      with full historical change granularity.
workflow:
  type: core_model
  layer: core
  custom_schema: core_house
  default_extraction_type: incremental
  load_spark_job: load_core_house_history
  execution_timeout_hours: 1
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, 1), 'load_end_date') }}"
  tables_customization:
    house_history:
      spark_job_arguments:
        - "{environment}"
        - "{bucket}"
        - "{dag_name}"
        - "{schema}"
        - "{table_name}"
        - "{partitions}"
        - "{load_start_date}"
        - "{load_end_date}"
      partitions: [year, month, day]
      z_order_by: [id_house, ts_transaction]
      table_properties:
        "delta.enableChangeDataFeed": "true"
