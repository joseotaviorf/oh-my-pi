ENTITY_TYPE: "HOUSE"
HOUSE_TRANSACTIONAL_TABLE: "datalake_ebdb_transactional.imovel"
HLR_TRANSACTIONAL_TABLE: "datalake_ebdb_transactional.imovellistingrelation"
USER_TRANSACTIONAL_TABLE: "datalake_ebdb_transactional.usuario"
merge_on_historical: ["id_house", "event_name", "ts_transaction", "year", "month", "day"]
when_matched_update_condition_historical: "FALSE"
# Named AUD sources for payload enrichment. With a single source, event_configs
# entries with aud_mod_col route to it implicitly (no aud_source key needed).
# Owner events (ev_id_owner / ev_uuid_owner) come from imovellistingrelation_aud
# and keep payload NULL for now (bespoke _build_owner_events path — follow-up).
aud_configs:
  - name: imovel
    aud_table: datalake_ebdb_transactional.imovel_aud
    aud_id_col: id
    enabled: true
event_configs:
  # externalId has no _MOD flag in imovel_aud; dataCriacao / atualizadoEm are
  # not audited by Envers at all; id_user_registrant is a coalesce of two
  # source columns with distinct _MOD flags (ambiguous) — none are enrichable.
  - tracked_col: externalId
    target_col: id_external
    target_type: string
  - tracked_col: regiao_id
    target_col: id_region
    target_type: bigint
    aud_mod_col: regiao_MOD
  - tracked_col: id_user_registrant
    target_col: id_user_registrant
    target_type: bigint
  - tracked_col: endereco
    target_col: address
    target_type: string
    aud_mod_col: endereco_MOD
  - tracked_col: numero
    target_col: number
    target_type: string
    aud_mod_col: numero_MOD
  - tracked_col: bairro
    target_col: neighborhood
    target_type: string
    aud_mod_col: bairro_MOD
  - tracked_col: complemento
    target_col: complement
    target_type: string
    aud_mod_col: complemento_MOD
  - tracked_col: cep
    target_col: zipcode
    target_type: string
    aud_mod_col: cep_MOD
  - tracked_col: cidade
    target_col: city
    target_type: string
    aud_mod_col: cidade_MOD
  - tracked_col: tipo
    target_col: type
    target_type: string
    aud_mod_col: tipo_MOD
  - tracked_col: areaTotal
    target_col: total_area
    target_type: int
    aud_mod_col: areaTotal_MOD
  - tracked_col: lat
    target_col: lat
    target_type: decimal
    aud_mod_col: lat_MOD
  - tracked_col: lng
    target_col: lng
    target_type: decimal
    aud_mod_col: lng_MOD
  - tracked_col: numeroBanheiros
    target_col: total_bathrooms
    target_type: int
    aud_mod_col: numeroBanheiros_MOD
  - tracked_col: numeroQuartos
    target_col: total_bedrooms
    target_type: int
    aud_mod_col: numeroQuartos_MOD
  - tracked_col: numeroSuites
    target_col: total_suites
    target_type: int
    aud_mod_col: numeroSuites_MOD
  - tracked_col: andar
    target_col: floor
    target_type: int
    aud_mod_col: andar_MOD
  - tracked_col: dataCriacao
    target_col: ts_created
    target_type: timestamp
  - tracked_col: atualizadoEm
    target_col: ts_updated
    target_type: timestamp
