ENTITY_TYPE: "HUB_REGION_HISTORY"
merge_on_historical: ["id_event"]

BUSINESS_UNIT_REGION_HISTORY_TRANSACTIONAL_TABLE: "datalake_hub_services_transactional.business_unit_region"
# CDC deletes on the junction arrive with null FKs and are dropped by the junction-key filter, so
# deletions are invisible in the CDC stream alone. The audit table carries the full FKs on its delete
# revisions (revtype=2) and is unioned into the stream as tombstones (see load_core_region_history).
BUSINESS_UNIT_REGION_AUD_TRANSACTIONAL_TABLE: "datalake_hub_services_transactional.business_unit_region_aud"
# tracked_col = column name in transactional CDC; target_col = core convention (ev_{target_col}).
business_unit_region_history_event_configs:
  - tracked_col: business_context
    target_col: business_context
    target_type: string
  - tracked_col: created_at
    target_col: ts_created
    target_type: timestamp
    value_precision: millisecond
  # Derived in the job from op_cdc, not a source column: 'true' on delete rows (CDC or injected
  # tombstone), 'false' otherwise. Read by the current-state merge to delete stale pairs.
  - tracked_col: is_deleted
    target_col: is_deleted
    target_type: string

BUSINESS_UNIT_HISTORY_TRANSACTIONAL_TABLE: "datalake_hub_services_transactional.business_unit"
business_unit_history_event_configs:
  - tracked_col: name
    target_col: hub_name
    target_type: string
  - tracked_col: sdr_type
    target_col: sdr_type
    target_type: string
  - tracked_col: lead_types
    target_col: lead_types
    target_type: string
  - tracked_col: negotiation_type
    target_col: negotiation_type
    target_type: string
  - tracked_col: operational_context
    target_col: operational_context
    target_type: string
  - tracked_col: business_context
    target_col: business_context
    target_type: string
  - tracked_col: created_at
    target_col: ts_created
    target_type: timestamp
    value_precision: millisecond
