---
# core_region.business_unit_history
table_name: core_region.business_unit_history
alert_channel: GCHAT_CORE_MODEL_SCHEMA_VALIDATION
column_level_validations:
  id_event:
    is_unique:
      severity_level: Error
    is_complete:
      severity_level: Error
  id_business_unit:
    is_complete:
      severity_level: Error
  sk_core_business_unit:
    is_complete:
      severity_level: Error
  event_name:
    is_complete:
      severity_level: Error
    is_contained_in:
      severity_level: Error
      values:
        - ev_hub_name
        - ev_sdr_type
        - ev_lead_types
        - ev_negotiation_type
        - ev_operational_context
        - ev_business_context
  event_type:
    is_complete:
      severity_level: Error
    is_contained_in:
      severity_level: Error
      values:
        - cdc
  ts_transaction:
    is_complete:
      severity_level: Error
  event_origin:
    is_complete:
      severity_level: Error
  value:
    is_complete:
      severity_level: Error
