dag:
  name: core_region_history
  schedule_start_date: 2021, 8, 10
  owner: Data Platform
  documentation:
    dag_purpose: |
      Creates narrow field-level history core tables for the Hub Services region domain:
      business_unit_region_history tracks changes to hub-region associations from
      datalake_hub_services_transactional.business_unit_region, and business_unit_history
      tracks changes to hub attributes from datalake_hub_services_transactional.business_unit.
      Fixed schema: 14 columns for business_unit_region_history (composite region-hub key
      split into id_region + id_business_unit), 13 columns for business_unit_history
      (standard event log with id_business_unit).
workflow:
  type: core_model
  layer: core
  custom_schema: core_region
  default_extraction_type: incremental
  load_spark_job: load_core_region_history
  execution_timeout_hours: 1
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, 1), 'load_end_date') }}"
  tables_customization:
    business_unit_region_history:
      spark_job_arguments:
        - "{environment}"
        - "{bucket}"
        - "{dag_name}"
        - "{schema}"
        - "{table_name}"
        - "{partitions}"
        - "{load_start_date}"
        - "{load_end_date}"
      partitions: [year, month, day]
      z_order_by: [id_region, id_business_unit, ts_transaction]
      table_properties:
        "delta.enableChangeDataFeed": "true"
    business_unit_history:
      spark_job_arguments:
        - "{environment}"
        - "{bucket}"
        - "{dag_name}"
        - "{schema}"
        - "{table_name}"
        - "{partitions}"
        - "{load_start_date}"
        - "{load_end_date}"
      partitions: [year, month, day]
      z_order_by: [id_business_unit, ts_transaction]
      table_properties:
        "delta.enableChangeDataFeed": "true"
cluster:
  type: databricks_16_4_min_io-memory_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    spark_conf:
      spark.sql.shuffle.partitions: "8"
      spark.databricks.delta.merge.enableLowShuffle: "true"
      spark.databricks.adaptive.autoOptimizeShuffle.enabled: "true"
      spark.memory.fraction: "0.8"
      spark.memory.storageFraction: "0.3"
      spark.sql.adaptive.skewJoin.enabled: "true"
