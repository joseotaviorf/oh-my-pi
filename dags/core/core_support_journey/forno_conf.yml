webhook_salesforce_cdc: WEBHOOK_SALESFORCE_CDC_FORNO

dag_documentation:
  dag_purpose: |
    Builds Support Journey core model tables from Salesforce clean sources.
    One Spark task per YAML spec under ``tables/`` (EMR job cluster when ``cluster.type`` uses ``emr-*`` spark_version).

datalake_bucket: "5a-datalake-forno"

dependencies:
  bietlejuice.salesforce:
    is_daily: true
    execution_hour: 0
    tasks:
      - load-clean-record-types
      - load-clean-case-milestones
  bietlejuice.salesforce_cdc:
    is_daily: false
    tasks:
      - dlq_events_case
      - load_datalake_salesforce_clean_events_user
  bietlejuice.bigfone:
    is_daily: false
    tasks:
      - load-clean-event
  bietlejuice.quinto_messenger:
    is_daily: false
    tasks:
      - load-clean-channel
      - load-clean-chat
      - load-clean-task
      - load-clean-task-event
  bietlejuice.sauron:
    is_daily: false
    tasks:
      - load-clean-session
  bietlejuice.support_session_service:
    is_daily: false
    tasks:
      - load-clean-support-session

# TEMP: bumped one rung (from emr_7_12_min_memory_2_workers_cluster) because the
# hourly run was overshooting its 1h SLA at ~1:10. Reduce back to the smaller
# preset as soon as the upstream DAGs set partition_hour.
cluster:
  type: emr_7_12_consolidation_l_memory_cluster
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE
