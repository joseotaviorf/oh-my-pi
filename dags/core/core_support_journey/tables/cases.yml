        "AccountId",
        "OwnerId",
        "CreatedById",
        "CaseNumber",
        "Type",
        "Status",
        "Reason",
        "Origin",
        "Subject",
        "Priority",
        "Description",
        "IsClosed",
        "CreatedDate",
        "ClosedDate",
    ]
  record_types:
