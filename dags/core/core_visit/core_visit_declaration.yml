dag:
  name: core_visit
  schedule_start_date: 2025, 8, 13
  owner: Data ForSale
  documentation:
    dag_purpose: |
      This is a test DAG related to Core Models proposal
workflow:
  type: core_model
  layer: core
  default_extraction_type: full
  load_spark_job: load_core_visit
  tables_customization:
    visit:
      spark_job_arguments:
        - "{environment}"
        - "{bucket}"
        - "{dag_name}"
        - "{schema}"
        - "{table_name}"
        - "{partitions}"
      z_order_by: [id_house, business_context]
      table_properties:
        "delta.enableChangeDataFeed": "true"
cluster:
  type: custom_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    driver_node_type_id: r-fleet.xlarge
    node_type_id: r-fleet.xlarge
    num_workers: 2
    spark_version: 13.3.x-scala2.12
    aws_attributes:
      availability: ON_DEMAND
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}