dag:
  name: core_visit
  schedule_start_date: 2025, 8, 13
  owner: Data ForSale
  documentation:
    dag_purpose: |
      This is a DAG related to the Visit Core Model
workflow:
  type: core_model
  layer: core
  default_extraction_type: incremental
  load_spark_job: load_core_visit
  execution_timeout_hours: 1
  tables_customization:
    visit:
      spark_job_arguments:
        - "{environment}"
        - "{bucket}"
        - "{dag_name}"
        - "{schema}"
        - "{table_name}"
        - "{partitions}"
        - "{load_start_date}"
        - "{load_end_date}"
      partitions: [year, month, day]
      z_order_by: [id_house, business_context]
      table_properties:
        "delta.enableChangeDataFeed": "true"
cluster:
  type: databricks_16_4_rfleet_instance_cluster
  databricks_conn_id: databricks_new
