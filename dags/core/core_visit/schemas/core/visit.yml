# Schema validation file for core visit table
# This file defines the expected schema for the core.visit table
# Path: dags/core/core_visit/schemas/core/visit.yml

columns:
  # Surrogate key - primary identifier
  sk_core_visit:
    type: string
    required: true

  # Visit identifier
  id_visit:
    type: bigint
    required: true

  # House information - required for all visits
  id_house:
    type: bigint
    required: true

  # User information
  id_visitor:
    type: bigint
    required: true

  # Owner information (from house/house_listing_relation)
  id_owner:
    type: bigint
    required: false

  # Agent information
  id_agent:
    type: bigint
    required: false

  # Visit code
  code:
    type: string
    required: false

  # Visit status (original)
  status:
    type: string
    required: false

  # Computed status based on business rules
  computed_status:
    type: string
    required: false

  # Visit type
  type:
    type: string
    required: false

  # Business context - RENT or SALE
  business_context:
    type: string
    required: false

  # Last event type from visit status log
  last_event_type:
    type: string
    required: false

  # Cancellation reason from events
  cancellation_reason:
    type: string
    required: false

  # Fixed agent flag
  is_fixed_agent:
    type: boolean
    required: false

  # Visit date
  dt_visit:
    type: date
    required: false

  # Visit timestamp
  ts_visit:
    type: timestamp
    required: false

  # Event timestamps from visit status log
  ts_visit_requested:
    type: timestamp
    required: false

  ts_visit_confirmed:
    type: timestamp
    required: false

  ts_visit_done:
    type: timestamp
    required: false

  ts_visit_canceled:
    type: timestamp
    required: false

  ts_visit_unsuccessful:
    type: timestamp
    required: false

  # Audit timestamps
  ts_created:
    type: timestamp
    required: true

  ts_updated:
    type: timestamp
    required: true

  # Load timestamp
  ts_load:
    type: timestamp
    required: true

  # Partitioning columns - required for performance
  year:
    type: int
    required: true

  month:
    type: int
    required: true

  day:
    type: int
    required: true

# Schema constraints
min_columns: 27
max_columns: 27
strict: true # Allow additional columns for flexibility
