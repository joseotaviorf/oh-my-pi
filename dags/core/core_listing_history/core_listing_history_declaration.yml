dag:
  name: core_listing_history
  schedule_start_date: 2025, 1, 1
  owner: Data House and Listing
  documentation:
    dag_purpose: |
      Creates the Listing Historical Core Model (narrow event-log). Each row
      represents a single field-level change detected across the listing lifecycle.
      Tracks the same fields as core_listing with full historical granularity.
      Supports backfilling: when executed over a broad date range, each day's data
      reflects the listing state as of that day.
workflow:
  type: core_model
  layer: core
  custom_schema: core_listing
  default_extraction_type: incremental
  load_spark_job: load_core_listing_history
  execution_timeout_hours: 1
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, 1), 'load_end_date') }}"
  tables_customization:
    listing_history:
      spark_job_arguments:
        - "{environment}"
        - "{bucket}"
        - "{dag_name}"
        - "{schema}"
        - "{table_name}"
        - "{partitions}"
        - "{load_start_date}"
        - "{load_end_date}"
      partitions: [year, month, day]
      z_order_by: [id_house_listing, business_context, ts_transaction]
      table_properties:
        "delta.enableChangeDataFeed": "true"
cluster:
  type: databricks_16_4_rfleet_instance_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    spark_conf:
      spark.sql.shuffle.partitions: "8"
      spark.databricks.delta.merge.enableLowShuffle: "true"
      spark.databricks.adaptive.autoOptimizeShuffle.enabled: "true"
      spark.memory.fraction: "0.8"
      spark.memory.storageFraction: "0.3"
      spark.sql.adaptive.skewJoin.enabled: "true"
