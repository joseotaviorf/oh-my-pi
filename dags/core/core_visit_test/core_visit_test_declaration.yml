dag:
  name: core_visit_test
  schedule_start_date: 2024, 8, 1
  owner: Data ForSale
  documentation:
    dag_purpose: |
      Creates core visit model by processing visit events, calculating
      aggregated timestamps, and generating surrogate keys for the visit entity.
      Transforms raw visit data into a unified core model for analytics in the enrich layer.

      This is a DERIVED core model that depends on foundational models like core_user and core_property.

workflow:
  type: core_model
  layer: core
  default_extraction_type: incremental
  load_spark_job: load_core_visit

  tables_customization:
    visit:
      load_spark_job: load_core_visit
      spark_job_arguments:
        - "{environment}"
        - "{bucket}"
        - "{dag_name}"
        - "{schema}"
        - "{table_name}"
        - "{partitions}"
      partitions: [year, month, day]
    visit_incremental:
      load_spark_job: load_core_visit
      spark_job_arguments:
        - "{environment}"
        - "{bucket}"
        - "{dag_name}"
        - "{schema}"
        - "{table_name}"
        - "{partitions}"
        - "{load_start_date}"
        - "{load_end_date}"
      partitions: [year, month, day]

cluster:
  type: custom_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    driver_node_type_id: r-fleet.xlarge
    node_type_id: r-fleet.xlarge
    num_workers: 2
    spark_version: 13.3.x-scala2.12
    aws_attributes:
      availability: ON_DEMAND
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
