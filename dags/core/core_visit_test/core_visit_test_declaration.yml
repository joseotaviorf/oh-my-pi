dag:
  name: core_visit_test
  schedule_start_date: 2024, 8, 1
  schedule_interval: 0 3 * * *
  owner: Data ForSale
  documentation:
    dag_purpose: |
      Creates core visit model by processing visit events, calculating
      aggregated timestamps, and generating surrogate keys for the visit entity.
      Transforms raw visit data into a unified core model for analytics in the enrich layer.

      This is a DERIVED core model that depends on foundational models like core_user and core_property.

workflow:
  type: core_model
  layer: core
  default_extraction_type: incremental
  load_spark_job: load_core_visit

  tables_customization:
    visit:
      load_spark_job: load_core_visit
      spark_job_arguments:
        - "{environment}"
        - "{bucket}"
        - "{dag_name}"
        - "{schema}"
        - "{table_name}"
        - "{load_start_date}"
        - "{load_end_date}"

cluster:
  type: databricks_13_3_med_general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
