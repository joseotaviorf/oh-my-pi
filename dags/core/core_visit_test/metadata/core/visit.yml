database_name: core_visit_test
table_name: visit
domain: For Sale
owner: isadora.gallerani@quintoandar.com.br
description: Visit Core Model test.
columns:
  surrogate_key:
    lineage:
      - datalake_ebdb_test_clean.visit.id
    description: Surrogate key related to the Visit Core Model.
      It's made by concatenating "VISIT||id_visit" and then applying the SHA256 hash.
      This key must always be unique.
  id_visit:
    lineage:
      - datalake_ebdb_test_clean.visit.id
    description:
      Identifier of the visit. It's the id of the Visit table, from Main's database (EBDB).
      This identifier can only be seeing in our products, it's not visible for any customer.
      This key must always be unique.
  id_house:
    lineage:
      - datalake_ebdb_test_clean.visit.id_house
    description: House id related to the visit. It's the id of the House table, from Main's database (EBDB).
  id_visitor:
    lineage:
      - datalake_ebdb_test_clean.visit.id_visitor
    description:
      User id related to the person that is making the visit (the visitor).
      It's the id of the User table, from Main's database (EBDB).
      It can be the user id of the tenant prospect (if the visit is in ForRent business context) or of
      the buyer prospect (if the visit is in ForSale business context).
  id_owner:
    lineage:
      - datalake_ebdb_clean.house.id_user
    description:
      User id of the owner related to the property that is being visited.
      It's the id of the User table, from Main's database (EBDB).
  id_agent:
    lineage:
      - datalake_ebdb_test_clean.visit.id_agent
    description: User id of the agent related to the visit.
      It's the id_agent of the User table, from Main's database (EBDB).
      This id_agent might change through the lifecycle of the visit, as the agent can be changed to another one.
  code:
    lineage:
      - datalake_ebdb_test_clean.visit.code
    description:
      The alphanumeric code of the visit that goes to the front end, seeing by our customers.
      This is the code we can find in Amplitude and also is the code that Ops and Agent teams can see as well.
  status:
    lineage:
      - datalake_ebdb_test_clean.visit.status
    description: Currently status of the visit.
  computed_status:
    lineage:
      - datalake_ebdb_test_clean.visit.computed_status
    description: Currently computed status of the visit.
      Value that shows the computed status of a visit based on a number of different events and sources.
      It is intended to represent all possible states in the state machine representing the lifecycle of a visit.
  type:
    lineage:
      - datalake_ebdb_test_clean.visit.type
    description: The type of the visit.
  business_context:
    lineage:
      - datalake_ebdb_test_clean.visit.business_context
    description: As a visit can be performed in two differents business context
      (visits in properties that are for rent or visits in properties that are for sale), it indicates the
      exactly business context of it.
  last_event_type:
    lineage:
      - datalake_ebdb_test_clean.visit_status_log.event_type
    description: The last event type that happened in the visit.
  cancellation_reason:
    lineage:
      - datalake_ebdb_test_clean.visit_status_log.cancellation_reason
    description: Reason of why the visit was canceled, if it ever was.
      If it wasn't canceled, this field must be null.
  is_fixed_agent:
    lineage:
      - datalake_ebdb_test_clean.visit_status_log.is_fixed_agent
    description: Boolean flag indicating if the agent of the visit is a fixed agent of that visitor.
  dt_visit:
    lineage:
      - datalake_ebdb_test_clean.visit.dt_visit
    description: Date of when the visit is intended to happen.
  ts_visit:
    lineage:
      - datalake_ebdb_test_clean.visit.ts_visit
    description: Timestamp of when the visit is intended to happen.
      It's the visit date but also with the hour/minute of the scheduled visit.
  ts_visit_requested:
    lineage:
      - datalake_ebdb_test_clean.visit_status_log.ts_event
    description: Timestamp of when the visit was requested.
  ts_visit_confirmed:
    lineage:
      - datalake_ebdb_test_clean.visit_status_log.ts_event
    description: Timestamp of when the visit was confirmed by every user involved.
  ts_visit_done:
    lineage:
      - datalake_ebdb_test_clean.visit_status_log.ts_event
    description: Timestamp of when the visit was marked as done.
      It it indicates that the visit already happened.
  ts_visit_canceled:
    lineage:
      - datalake_ebdb_test_clean.visit_status_log.ts_event
    description: Timestamp of when the visit was canceled, if it was.
  ts_visit_unsuccessful:
    lineage:
      - datalake_ebdb_test_clean.visit_status_log.ts_event
    description: Timestamp of when the visit was marked as unsuccessful,
      the case where some problem happened on the visit day so the visit couldn't be completed.
  ts_created:
    lineage:
      - datalake_ebdb_test_clean.visit.ts_created
    description: Timestamp of when the visit was created in our product.
  ts_updated:
    lineage:
      - datalake_ebdb_test_clean.visit.ts_updated
    description: Last timestamp of when the visit was updated in our product.
  ts_load:
    description: Timestamp of when the Visit Core Model was updated and loaded for the last time.
