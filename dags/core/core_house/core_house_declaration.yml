dag:
  name: core_house
  schedule_start_date: 2025, 1, 1
  owner: Data House and Listing
  documentation:
    dag_purpose: |
      Creates the House Core Model by processing house data from EBDB. This model provides
      a consolidated view of house properties with their associated information.

workflow:
  type: core_model
  layer: core
  default_extraction_type: incremental
  load_spark_job: load_core_house
  execution_timeout_hours: 1
  tables_customization:
    house:
      spark_job_arguments:
        - "{environment}"
        - "{bucket}"
        - "{dag_name}"
        - "{schema}"
        - "{table_name}"
        - "{partitions}"
        - "{load_start_date}"
        - "{load_end_date}"
      partitions: [year, month, day]
      table_properties:
        "delta.enableChangeDataFeed": "true"

cluster:
  type: databricks_16_4_small_general_fleet_xlarge_single_node
  databricks_conn_id: databricks_new
