when_matched_update_condition_brokers_product_historical: "source.ts_cdc_transaction > target.ts_cdc_transaction"
merge_on_brokers_profile: ["sk_broker_profile"]
when_matched_update_condition_brokers_profile: "source.ts_profile_updated > target.ts_profile_updated"