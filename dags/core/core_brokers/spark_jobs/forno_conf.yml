ENTITY_TYPE: "BROKER"
COMPANY_TABLE: "datalake_company_clean.company"
COMPANY_ADDRESS_TABLE: "datalake_company_clean.company_address"
COMPANY_DOCUMENT_TABLE: "datalake_company_clean.company_document"
DOCUMENT_TABLE: "datalake_company_clean.document"
COMPANY_PRODUCT_TABLE: "datalake_company_clean.company_product"
ADDRESS_TABLE: "datalake_company_clean.address"
PRODUCT_TABLE: "datalake_company_clean.product"
COMPANY_PRODUCT_REGION_TABLE: "datalake_company_clean.company_product_region"
REVENUE_SHARE_TABLE: "datalake_company_clean.revenue_share"
BANKING_INFORMATION_TABLE: "datalake_company_clean.banking_information"
TIER_TABLE: "datalake_company_clean.tier"
COMPANY_PRODUCT_TIER_TABLE: "datalake_company_clean.company_product_tier"
