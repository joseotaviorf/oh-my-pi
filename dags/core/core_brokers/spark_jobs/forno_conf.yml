merge_on: ["sk_broker"]
when_matched_update_condition: "source.ts_updated > target.ts_updated"
merge_on_historical: ["sk_broker", "ts_database_transaction"]
when_matched_update_condition_historical: "source.ts_cdc_transaction > target.ts_cdc_transaction"
merge_on_brokers_product: ["sk_broker_product"]
