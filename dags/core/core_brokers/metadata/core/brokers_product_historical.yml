database_name: core_brokers
table_name: brokers_product_historical
domain: Broker XP
owner: vitor.musachio@quintoandar.com.br
description: >
  Historical tracking table for the Brokers Product Core Model. Each row
  represents a single CDC transaction (insert, update or delete) captured
  from the Company Product transactional layer. Related entities (company,
  product, region, revenue share, banking information, tier) are joined from
  the clean layer to provide the latest context for each transaction. The
  composite key (sk_broker_product, ts_database_transaction) uniquely
  identifies each change event.
columns:
  sk_broker_product:
    lineage:
      - datalake_company_transactional.company_product.id_company
      - datalake_company_clean.product.id
    description: >
      Surrogate key for the Brokers Product Core Model, derived from the
      concatenation of the company id and the product id. Combined with
      ts_database_transaction, uniquely identifies each historical change event.
  sk_broker:
    lineage:
      - datalake_company_transactional.company_product.id_company
    description: >
      Surrogate key referencing the Brokers Core Model, derived from the
      company id. Links back to the brokers table for company-level details.
  id_company:
    lineage:
      - datalake_company_transactional.company_product.id_company
    description: >
      Internal identifier of the company from the Company database. Used as
      the primary business key for the broker.
  uuid_company:
    lineage:
      - datalake_company_clean.company.uuid_company
    description: Universal unique identifier (UUID) for the company, used across systems.
  broker_name:
    lineage:
      - datalake_company_clean.company.company_name
    description: Official legal name of the broker company as registered in official documents.
  broker_trade_name:
    lineage:
      - datalake_company_clean.company.trade_name
    description: >
      Commercial or trade name of the broker, which may differ from the legal name.
      This is the name commonly used in business operations.
  product_name:
    lineage:
      - datalake_company_clean.product.name
    description: Name of the 3P product associated with the broker.
  business_segment:
    lineage:
      - datalake_company_clean.product.business_segment
    description: Business segment of the 3P product (e.g., rent, sale).
  product_status:
    lineage:
      - datalake_company_transactional.company_product.status
    description: >
      Status of the company-product relationship at the time of the transaction
      (e.g., ACTIVE, INACTIVE).
  business_context:
    lineage:
      - datalake_company_transactional.company_product.id_product
    description: >
      High-level business line for the 3P product: SALE when id_product is 27,
      RENT when id_product is 30.
  integrator_partner:
    lineage:
      - datalake_company_clean.company.company_name
    description: >
      Name of the integrator partner company associated with this broker-product
      relationship, resolved via the integratorPartnerUUId from product_settings.
  integrator_partner_status:
    lineage:
      - datalake_company_clean.company.status
    description: >
      Status of the integrator partner company at the time of the transaction.
  commission:
    lineage:
      - datalake_company_clean.revenue_share.commission
    description: >
      Commission percentage defined in the revenue share agreement for this
      broker-product relationship, rounded to five decimal places.
  demand_fee:
    lineage:
      - datalake_company_clean.revenue_share.demand_fee
    description: >
      Demand fee defined in the revenue share agreement for this broker-product
      relationship, rounded to five decimal places.
  supply_fee:
    lineage:
      - datalake_company_clean.revenue_share.supply_fee
    description: >
      Supply fee defined in the revenue share agreement for this broker-product
      relationship, rounded to five decimal places.
  platform_fee:
    lineage:
      - datalake_company_clean.revenue_share.platform_fee
    description: >
      Platform fee defined in the revenue share agreement for this broker-product
      relationship, rounded to five decimal places.
  bank:
    lineage:
      - datalake_company_clean.banking_information.bank
    description: >
      Bank name from the banking information associated with this broker-product
      relationship, resolved via the bankingInformationUUId from product_settings.
  agency_number:
    lineage:
      - datalake_company_clean.banking_information.agency_number
    description: Bank agency number for the broker-product banking information.
  account_number:
    lineage:
      - datalake_company_clean.banking_information.account_number
    description: Bank account number for the broker-product banking information.
  account_type:
    lineage:
      - datalake_company_clean.banking_information.type
    description: >
      Bank account type (e.g., checking, savings) for the broker-product
      banking information.
  tier_name:
    lineage:
      - datalake_company_clean.tier.tier_name
    description: >
      Tier name assigned to this broker-product relationship via the
      company_product_tier association.
  is_3p_rent_broker:
    lineage:
      - datalake_company_transactional.company_product.id_product
    description: >
      Boolean flag indicating if this row corresponds to the 3P rent product
      (id_product = 30).
  is_3p_sale_broker:
    lineage:
      - datalake_company_transactional.company_product.id_product
    description: >
      Boolean flag indicating if this row corresponds to the 3P sale product
      (id_product = 27).
  is_3p_active_broker:
    lineage:
      - datalake_company_transactional.company_product.id_product
      - datalake_company_transactional.company_product.status
    description: >
      Boolean flag indicating if this broker-product relationship was active
      at the time of the transaction (id_product 27 or 30 with status ACTIVE).
  is_3p_active_rent_broker:
    lineage:
      - datalake_company_transactional.company_product.id_product
      - datalake_company_transactional.company_product.status
    description: >
      Boolean flag indicating if this was an active 3P rent product
      (id_product = 30 with status ACTIVE) at the time of the transaction.
  is_3p_active_sale_broker:
    lineage:
      - datalake_company_transactional.company_product.id_product
      - datalake_company_transactional.company_product.status
    description: >
      Boolean flag indicating if this was an active 3P sale product
      (id_product = 27 with status ACTIVE) at the time of the transaction.
  has_opt_in_navent:
    lineage:
      - datalake_company_transactional.company_product.product_settings
    description: >
      Opt-in flag for Navent integration at the time of the transaction,
      extracted from the optInNavent field in the product_settings JSON column.
  region_list:
    lineage:
      - datalake_company_clean.company_product_region.id_region
    description: >
      Array of distinct region IDs where this broker-product relationship
      operates, aggregated from the company_product_region table.
  has_3p_access_control:
    description: >
      Indicates whether the broker-product row is subject to third-party access
      control policies. Currently always true for all rows in this core model.
  ts_product_created:
    lineage:
      - datalake_company_clean.company.ts_created
    description: Timestamp when the company record was initially created in the source system.
  ts_product_updated:
    lineage:
      - datalake_company_clean.company.ts_updated
    description: >
      Timestamp when the company record was last updated at the time of this
      transaction.
  ts_load:
    description: >
      Timestamp when the Brokers Product Historical Core Model was last loaded
      by the ETL process. This is the processing timestamp, not the data timestamp.
  op_cdc:
    lineage:
      - datalake_company_transactional.company_product.op_cdc
    description: >
      CDC operation type captured by Debezium. Possible values: 'c' (create/insert),
      'u' (update), 'd' (delete), 'r' (read/snapshot).
  ts_database_transaction:
    lineage:
      - datalake_company_transactional.company_product.ts_database_transaction
    description: >
      Timestamp of when the change occurred in the source database. Combined with
      sk_broker_product, forms the composite primary key for this table. Used for
      partitioning (year/month/day).
  ts_cdc_transaction:
    lineage:
      - datalake_company_transactional.company_product.ts_cdc_transaction
    description: >
      Timestamp of when Debezium captured the change from the source database
      WAL/binlog. Used as the merge condition to resolve duplicate processing.
  is_current:
    description: >
      Boolean flag indicating whether this row represents the most recent
      transaction for the given broker-product relationship (sk_broker_product).
      True for the row with the latest ts_database_transaction per
      sk_broker_product, False for all others.
  year:
    lineage:
      - datalake_company_transactional.company_product.ts_database_transaction
    description: Year partition column, derived from ts_database_transaction.
  month:
    lineage:
      - datalake_company_transactional.company_product.ts_database_transaction
    description: Month partition column, derived from ts_database_transaction.
  day:
    lineage:
      - datalake_company_transactional.company_product.ts_database_transaction
    description: Day partition column, derived from ts_database_transaction.