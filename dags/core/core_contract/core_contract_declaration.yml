dag:
  name: core_contract
  schedule_start_date: 2025, 9, 1
  owner: Data ForRent
  documentation:
    dag_purpose: |
      This is a DAG responsible to create Contract's Core Model
workflow:
  type: core_model
  layer: core
  default_extraction_type: incremental
  load_spark_job: load_core_contract
  execution_timeout_hours: 1
  tables_customization:
    contract:
      spark_job_arguments:
        - "{environment}"
        - "{bucket}"
        - "{dag_name}"
        - "{schema}"
        - "{table_name}"
        - "{partitions}"
        - "{load_start_date}"
        - "{load_end_date}"
      z_order_by: [id_house]
      table_properties:
        "delta.enableChangeDataFeed": "true"
cluster:
  type: databricks_16_4_rfleet_instance_cluster
  databricks_conn_id: databricks_new