dag:
  name: core_contract
  schedule_start_date: 2025, 9, 1
  owner: Data ForRent
  documentation:
    dag_purpose: |
      This is a DAG responsible to create Contract's Core Model
workflow:
  type: query_delta
  layer: core
  default_extraction_type: full
  execution_timeout_hours: 1
  tables_customization:
    contract:
      z_order_by: [id_house]
      table_properties:
        "delta.enableChangeDataFeed": "true"
cluster:
  type: databricks_16_4_rfleet_instance_cluster
  databricks_conn_id: databricks_new