---
table_name: core_region.business_unit_region
alert_channel: GCHAT_CORE_MODEL_SCHEMA_VALIDATION

table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error

column_level_validations:
  sk_core_business_unit_region:
    is_unique:
      severity_level: Error
    is_complete:
      severity_level: Error
  id_region:
    is_complete:
      severity_level: Error
  id_business_unit:
    is_complete:
      severity_level: Error
  ts_business_unit_region_updated:
    is_complete:
      severity_level: Error
  # Sentinel guard: the (0,0)/null-key junk rows must not leak into the current state.
  no_zero_or_null_keys_business_unit_region:
    custom:
      constraint: |-
        (SELECT COUNT(*) FROM core_region.business_unit_region
         WHERE id_region IS NULL OR id_business_unit IS NULL
            OR id_region = 0 OR id_business_unit = 0) = 0
      severity_level: Error
  # Grain-set parity vs clean deduped to one live row per (id_region, id_business_unit),
  # excluding the (0,0) sentinel on both sides. Expect 0 one-sided rows.
  matching_grain_business_unit_region_core_and_clean:
    custom:
      constraint: |-
        (SELECT COUNT(*) FROM (
           SELECT core.id_region AS core_r, cl.id_region AS clean_r
           FROM core_region.business_unit_region core
           FULL OUTER JOIN (
             SELECT id_region, id_business_unit FROM (
               SELECT id_region, id_business_unit,
                 ROW_NUMBER() OVER (
                   PARTITION BY id_region, id_business_unit ORDER BY ts_updated DESC
                 ) AS rn
               FROM datalake_hub_services_clean.business_unit_region
               WHERE id_region <> 0 AND id_business_unit <> 0
             ) d WHERE d.rn = 1
           ) cl
             ON core.id_region = cl.id_region
            AND core.id_business_unit = cl.id_business_unit
           WHERE core.id_region IS NULL OR cl.id_region IS NULL
        )) = 0
      severity_level: Warning
  # Attribute parity vs clean (null-safe) on the live association. Expect 0 mismatches.
  matching_attributes_business_unit_region_core_and_clean:
    custom:
      constraint: |-
        (SELECT COUNT(*)
         FROM core_region.business_unit_region core
         JOIN (
           SELECT id_region, id_business_unit, business_context FROM (
             SELECT id_region, id_business_unit, business_context,
               ROW_NUMBER() OVER (
                 PARTITION BY id_region, id_business_unit ORDER BY ts_updated DESC
               ) AS rn
             FROM datalake_hub_services_clean.business_unit_region
             WHERE id_region <> 0 AND id_business_unit <> 0
           ) d WHERE d.rn = 1
         ) cl
           ON core.id_region = cl.id_region
          AND core.id_business_unit = cl.id_business_unit
         WHERE NOT (core.business_context <=> cl.business_context)) = 0
      severity_level: Warning
  # ts_created parity vs clean live association at second granularity (absorbs the
  # millisecond/microsecond rendering difference). Verified 604/604 on multi-event pairs.
  matching_ts_created_second_business_unit_region_core_and_clean:
    custom:
      constraint: |-
        (SELECT COUNT(*)
         FROM core_region.business_unit_region core
         JOIN (
           SELECT id_region, id_business_unit, ts_created FROM (
             SELECT id_region, id_business_unit, ts_created,
               ROW_NUMBER() OVER (
                 PARTITION BY id_region, id_business_unit ORDER BY ts_updated DESC
               ) AS rn
             FROM datalake_hub_services_clean.business_unit_region
             WHERE id_region <> 0 AND id_business_unit <> 0
           ) d WHERE d.rn = 1
         ) cl
           ON core.id_region = cl.id_region
          AND core.id_business_unit = cl.id_business_unit
         WHERE NOT (
           DATE_TRUNC('SECOND', core.ts_business_unit_region_created)
             <=> DATE_TRUNC('SECOND', cl.ts_created)
         )) = 0
      severity_level: Warning
