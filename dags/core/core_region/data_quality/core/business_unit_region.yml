---
# core_region.business_unit_region
#
# Clean parity checks (grain / attributes / ts_created vs datalake_hub_services_clean)
# are intentionally omitted for now. Investigation showed clean can diverge from
# transactional CDC and aud (e.g. hub_services clean lag, stale rows, pair-level
# dedup vs junction grain). CS BUR is built from core_region.business_unit_region_history
# at junction id, then deduped to one row per (id_region, id_business_unit) by highest
# id_business_unit_region. Validating against clean would raise non-actionable warnings until
# clean ingestion is aligned.
#
# Deletion awareness is applied. CDC deletes on this junction arrive with null FKs and are dropped
# by the junction-key filter, so delete revisions (revtype=2) from business_unit_region_aud are
# injected into the CDC stream as tombstones in load_core_region_history and surface as
# ev_is_deleted events in the history table. The current-state merge deletes a pair whose winning
# junction is deleted at source and blocks it from being re-inserted, so this table holds only pairs
# live at source; a junction with no ev_is_deleted event is treated as live. No rule below asserts
# that liveness directly: it is enforced by the merge and verified against business_unit_region_aud
# outside data quality.
table_name: core_region.business_unit_region
alert_channel: GCHAT_CORE_MODEL_SCHEMA_VALIDATION

table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error

column_level_validations:
  sk_core_business_unit_region:
    is_unique:
      severity_level: Error
    is_complete:
      severity_level: Error
  id_business_unit_region:
    is_unique:
      severity_level: Error
    is_complete:
      severity_level: Error
  id_region:
    is_complete:
      severity_level: Error
  id_business_unit:
    is_complete:
      severity_level: Error
  # Pair grain guard: CS BUR dedupes to one live row per (id_region, id_business_unit); duplicate
  # pairs mean pair dedup or merge logic regressed (e.g. multiple junction ids surfaced as separate rows).
  unique_pair_region_business_unit:
    custom:
      constraint: |-
        (SELECT COUNT(*) FROM (
          SELECT id_region, id_business_unit FROM core_region.business_unit_region
          GROUP BY id_region, id_business_unit HAVING COUNT(*) > 1
        )) = 0
      severity_level: Error
  ts_business_unit_region_updated:
    is_complete:
      severity_level: Error
  # Sentinel guard: null/zero junction and FK keys must not leak into the current state.
  no_zero_or_null_keys_business_unit_region:
    custom:
      constraint: |-
        (SELECT COUNT(*) FROM core_region.business_unit_region
         WHERE id_business_unit_region IS NULL OR id_region IS NULL OR id_business_unit IS NULL
            OR id_business_unit_region = 0 OR id_region = 0 OR id_business_unit = 0) = 0
      severity_level: Error
