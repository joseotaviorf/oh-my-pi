dag:
  name: core_region
  schedule_start_date: 2026, 3, 1
  owner: Data Platform
  documentation:
    dag_purpose: |
      Creates the Region Core Model by processing region data from Main's tables (EBDB) and unifying
      with region_business_contexts_served to provide a consolidated view of regions with business
      context. It only contains regions that have country information associated with it.

workflow:
  type: core_model
  layer: core
  default_extraction_type: full
  load_spark_job: load_core_region
  execution_timeout_hours: 1
  tables_customization:
    region:
      spark_job_arguments:
        - "{environment}"
        - "{bucket}"
        - "{dag_name}"
        - "{schema}"
        - "{table_name}"
        - "{partitions}"
        - "{load_start_date}"
        - "{load_end_date}"
      partitions: [year, month, day]
      z_order_by: [id_region]
      table_properties:
        "delta.enableChangeDataFeed": "true"
    business_unit:
      load_spark_job: load_core_business_unit
      spark_job_arguments:
        - "{environment}"
        - "{bucket}"
        - "{dag_name}"
        - "{schema}"
        - "{table_name}"
        - "{partitions}"
        - "{load_start_date}"
        - "{load_end_date}"
      partitions: [year, month, day]
      z_order_by: [id_business_unit]
      table_properties:
        "delta.enableChangeDataFeed": "true"
    business_unit_region:
      load_spark_job: load_core_business_unit
      spark_job_arguments:
        - "{environment}"
        - "{bucket}"
        - "{dag_name}"
        - "{schema}"
        - "{table_name}"
        - "{partitions}"
        - "{load_start_date}"
        - "{load_end_date}"
      partitions: [year, month, day]
      z_order_by: [id_region, id_business_unit]
      table_properties:
        "delta.enableChangeDataFeed": "true"

