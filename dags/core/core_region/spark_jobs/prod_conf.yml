ENTITY_TYPE: "REGION"
REGION_TABLE: "datalake_ebdb_clean.region"
STATE_TABLE: "datalake_ebdb_clean.state"
COUNTRY_TABLE: "datalake_ebdb_clean.country"
REGION_BUSINESS_CONTEXTS_TABLE: "datalake_ebdb_clean.region_business_contexts_served"
REGION_CONFIG_TABLE: "datalake_ebdb_clean.region_config"

merge_on: ["id_region"]
when_matched_update_condition: "source.ts_region_updated > target.ts_region_updated"

# --- business_unit / business_unit_region current-state models (load_core_business_unit) ---
# Built from the narrow history tables (core_region_history DAG) via CurrentStateBuilder.
# event_configs are attribute-only plus ts_created (event_name ev_ts_created -> latest value =
# current state, verified to mirror clean). ts_updated is derived as MAX(ts_transaction) in the job.
BUSINESS_UNIT_HISTORY_TABLE: "core_region.business_unit_history"
business_unit_merge_on: ["id_business_unit"]
business_unit_when_matched_update_condition: "source.ts_business_unit_updated > target.ts_business_unit_updated"
business_unit_event_configs:
  - target_col: hub_name
    target_type: string
  - target_col: sdr_type
    target_type: string
  - target_col: lead_types
    target_type: string
  - target_col: negotiation_type
    target_type: string
  - target_col: operational_context
    target_type: string
  - target_col: business_context
    target_type: string
  - target_col: ts_business_unit_created
    target_type: timestamp
    event_name: ev_ts_created

BUSINESS_UNIT_REGION_HISTORY_TABLE: "core_region.business_unit_region_history"
business_unit_region_merge_on: ["id_region", "id_business_unit"]
business_unit_region_when_matched_update_condition: >-
  source.ts_business_unit_region_updated > target.ts_business_unit_region_updated
  OR source.id_business_unit_region > target.id_business_unit_region
# Deletes stale pairs whose winning junction was removed at source, and blocks re-inserting them on
# the next run (the flagged source row stays present and would otherwise be picked up as unmatched).
# Both conditions treat NULL as live: a junction whose history predates ev_is_deleted has no such
# event, so NULL is a real state during the transition window.
business_unit_region_when_matched_delete_condition: "source.is_deleted = true"
business_unit_region_when_not_matched_insert_condition: >-
  source.is_deleted IS NULL OR source.is_deleted = false
business_unit_region_event_configs:
  - target_col: business_context
    target_type: string
  - target_col: ts_business_unit_region_created
    target_type: timestamp
    event_name: ev_ts_created
  # Merge-control column: drives the delete/insert conditions above and is excluded from both merge
  # column maps, so it never lands in the published table.
  - target_col: is_deleted
    target_type: boolean