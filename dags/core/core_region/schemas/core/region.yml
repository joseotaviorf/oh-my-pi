# Schema validation file for core region table
# This file defines the expected schema for the core_region.region table
# Path: dags/core/core_region/schemas/core/region.yml

columns:
  # Surrogate key - primary identifier
  sk_core_region:
    type: string
    required: true

  # Region identifier
  id_region:
    type: bigint
    required: true

  # Parent region identifier (null for top-level Cidade regions)
  id_parent_region:
    type: bigint
    required: false

  # City-level region id (resolved via EBDB parent hierarchy; matches enrich id_city semantics)
  id_city_region:
    type: bigint
    required: true

  # Immediate parent region id (matches enrich id_macro_region semantics)
  id_macro_region:
    type: bigint
    required: false

  # Region name
  region_name:
    type: string
    required: true

  # City-level region name (resolved via hierarchy; matches enrich city_name when from EBDB)
  city_region_name:
    type: string
    required: true

  # Level
  level:
    type: string
    required: true

  # State identifier
  id_state:
    type: bigint
    required: true

  # State name
  state_name:
    type: string
    required: true

  # State abbreviation
  state_abbreviation:
    type: string
    required: true

  # Country identifier
  id_country:
    type: bigint
    required: true

  # Country code
  country_code:
    type: string
    required: true

  # Country name
  country_name:
    type: string
    required: true

  # Country default timezone
  country_default_timezone:
    type: string
    required: true

  # Phone area code from region_config for the resolved Cidade id (nullable when no config row)
  region_phone_ddd:
    type: string
    required: false

  # Greater metro grouping derived from city name (same CASE as enrich datalake_region.region)
  greater_region:
    type: string
    required: false

  # Has rent operation
  has_rent_operation:
    type: boolean
    required: true

  # Has sale operation
  has_sale_operation:
    type: boolean
    required: true

  # Region creation timestamp
  ts_region_created:
    type: timestamp
    required: true

  # Region update timestamp
  ts_region_updated:
    type: timestamp
    required: true

  # Load timestamp
  ts_load:
    type: timestamp
    required: true

  # Partitioning columns - required for performance
  year:
    type: int
    required: true

  month:
    type: int
    required: true

  day:
    type: int
    required: true

# Schema constraints
min_columns: 25
max_columns: 25
strict: true
