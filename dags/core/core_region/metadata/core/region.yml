database_name: core_region
table_name: region
domain: Data Platform
owner: gustavo.alencar@quintoandar.com.br
description: Region Core Model that provides a consolidated view of regions with business context and hub information.
  It only contains regions that have country information associated with it.
 
columns:
  sk_core_region:
    lineage:
      - datalake_ebdb_clean.region.id
    description: Surrogate key related to the Region Core Model. This key must always be unique.
  id_region:
    lineage:
      - datalake_ebdb_clean.region.id
    description: Region unique identifier. It's the ID of the Region table, from Main's database (EBDB).
  id_parent_region:
    lineage:
      - datalake_ebdb_clean.region.id_parent_region
    description: Parent region unique identifier. It's the id_region of the region one level above, 
      with the lowest level being "SubRegiao", then "MacroRegiao" and then "Cidade". Regions at the "Cidade"
      level have no id_parent_region.
  id_state:
    lineage:
      - datalake_ebdb_clean.region.id_state
    description: Region's state unique identifier. Only regions that are at the "Cidade" level originally have 
      this information. In this core model the id_state is propagated to all region levels based on their
      parent region's information.
  id_country:
    lineage:
      - datalake_ebdb_clean.state.id_country
    description: Region's country unique identifier. Based on the state information.
  region_name:
    lineage:
      - datalake_ebdb_clean.region.name
    description: Region's name.
  level:
    lineage:
      - datalake_ebdb_clean.region.level
    description: Either SubRegiao (sub-region), MacroRegiao (macro-region) or Cidade (city). 
      If level is Cidade, id_parent_region and hub_name are null because they are not applicable.
      If level is MacroRegiao, hub_name is null because it is not applicable.
    categories:
      Cidade: The region is a city.
      MacroRegiao: The region is a macroregion.
      SubRegiao: The region is a subregion.
  state_name:
    lineage:
      - datalake_ebdb_clean.state.name
    description: Region's state name.
  state_abbreviation:
    lineage:
      - datalake_ebdb_clean.state.abbreviation
    description: Region's state name abbreviation.
  country_code:
    lineage:
      - datalake_ebdb_clean.country.code
    description: Region's country code.
    categories:
      BR: Brazil's country code.
      MX: Mexico's country code.
  country_name:
    lineage:
      - datalake_region.country.country_name
    description: Region's country name. Currently Brasil and Mexico.
  country_default_timezone:
    lineage:
      - datalake_region.country.default_timezone
    description: Region's country default timezone.
  hub_name:
    lineage:
      - datalake_hub_services_clean.business_unit
    description: Identification name of each performance hub.
  has_rent_operation:
    description: Boolean indicating if QuintoAndar operates with ForRent context in the given region (a region 
      can be exclusive to Rent, exclusive to Sale or served by both contexts). If true, indicates that there 
      is Rent operation in the region.
  has_sale_operation:
    description: Boolean indicating if QuintoAndar operates with ForSale context in the given region (a region 
      can be exclusive to Rent, exclusive to Sale or served by both contexts). If true, indicates that there 
      is Sale operation in the region.
  ts_region_created:
    lineage:
      - datalake_ebdb_clean.region.ts_created
    description: Timestamp of when the region was created.
  ts_region_updated:
    lineage:
      - datalake_ebdb_clean.region.ts_updated
    description: Timestamp of when the region was last updated.
  ts_load:
    description: Timestamp of when the Region Core Model was updated and loaded for the last time.
      This is set to current_timestamp() during the ETL process.
  year:
    lineage:
      - datalake_ebdb_clean.region.ts_updated
    description: Year extracted from ts_updated. Used as partition column.
  month:
    lineage:
      - datalake_ebdb_clean.region.ts_updated
    description: Month extracted from ts_updated. Used as partition column.
  day:
    lineage:
      - datalake_ebdb_clean.region.ts_updated
    description: Day of month extracted from ts_updated. Used as partition column.
