dag:
  name: core_brokers_history
  schedule_start_date: 2026, 1, 1
  owner: Data Broker XP
  documentation:
    dag_purpose: |
      Creates narrow field-level history core tables for broker scope: brokers_history
      (company CDC), broker_products_history, and broker_tiers_history from the
      transactional CDC layer. Only product ids 27 and 30 are included (same scope
      as core_brokers). Fixed 13-column event schema per table.
workflow:
  type: core_model
  layer: core
  custom_schema: core_brokers
  default_extraction_type: incremental
  load_spark_job: load_core_brokers_history
  execution_timeout_hours: 1
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, 1), 'load_end_date') }}"
  tables_customization:
    brokers_history:
      spark_job_arguments:
        - "{environment}"
        - "{bucket}"
        - "{dag_name}"
        - "{schema}"
        - "{table_name}"
        - "{partitions}"
        - "{load_start_date}"
        - "{load_end_date}"
      partitions: [year, month, day]
      z_order_by: [id_company, ts_transaction]
      table_properties:
        "delta.enableChangeDataFeed": "true"
    broker_products_history:
      spark_job_arguments:
        - "{environment}"
        - "{bucket}"
        - "{dag_name}"
        - "{schema}"
        - "{table_name}"
        - "{partitions}"
        - "{load_start_date}"
        - "{load_end_date}"
      partitions: [year, month, day]
      z_order_by: [id_company_product, ts_transaction]
      table_properties:
        "delta.enableChangeDataFeed": "true"
    broker_tiers_history:
      spark_job_arguments:
        - "{environment}"
        - "{bucket}"
        - "{dag_name}"
        - "{schema}"
        - "{table_name}"
        - "{partitions}"
        - "{load_start_date}"
        - "{load_end_date}"
      partitions: [year, month, day]
      z_order_by: [id_company_product_tier, ts_transaction]
      table_properties:
        "delta.enableChangeDataFeed": "true"
cluster:
  type: databricks_16_4_small_general_fleet_xlarge_single_node
  databricks_conn_id: databricks_new