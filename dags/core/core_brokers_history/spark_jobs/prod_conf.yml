    target_type: string
  - tracked_col: trade_name
    target_col: trade_name
    target_type: string
  - tracked_col: status
    target_col: status
    target_type: string

COMPANY_PRODUCT_HISTORY_TRANSACTIONAL_TABLE: "datalake_company_transactional.company_product"
