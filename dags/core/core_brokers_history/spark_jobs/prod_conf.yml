    target_col: product_settings
    target_type: string
  - tracked_col: status
    target_col: status
    target_type: string

COMPANY_PRODUCT_TIER_HISTORY_TRANSACTIONAL_TABLE: "datalake_company_transactional.company_product_tier"
company_product_tier_history_event_configs:
  - tracked_col: id_tier
    target_col: id_tier
    target_type: bigint