database_name: core_brokers
table_name: broker_products_history
domain: Broker XP
owner: vitor.musachio@quintoandar.com.br
description: >
  Narrow field-level history for company_product from CDC, restricted to product ids
  27 and 30 (same scope as core_brokers). The transactional PK is (company_id,
  product_id); the job renames these to id_company and id_product. Surrogate key
  sk_company_product is concat(id_company, id_product) as string.
columns:
  id_event:
    lineage:
      - datalake_company_transactional.company_product.company_id
      - datalake_company_transactional.company_product.product_id
      - datalake_company_transactional.company_product.ts_database_transaction
    description: >
      SHA256 hash of composite id (id_company||id_product), event_name, and ts_transaction.
  id_company:
    lineage:
      - datalake_company_transactional.company_product.company_id
    description: Company id (string) from transactional company_id.
  id_product:
    lineage:
      - datalake_company_transactional.company_product.product_id
    description: Product id (string) from transactional product_id.
  sk_company_product:
    lineage:
      - datalake_company_transactional.company_product.company_id
      - datalake_company_transactional.company_product.product_id
    description: Concatenation of id_company and id_product as string (no delimiter).
  event_name:
    lineage:
      - datalake_company_transactional.company_product.product_settings
      - datalake_company_transactional.company_product.status
    description: Resolved event name for the changed field.
    categories:
      ev_product_settings: Change in product_settings.
      ev_status: Change in status.
  event_type:
    lineage:
      - datalake_company_transactional.company_product.op_cdc
    description: CDC-sourced event type (cdc).
  value:
    lineage:
      - datalake_company_transactional.company_product.product_settings
      - datalake_company_transactional.company_product.status
    description: New value of the changed column as string.
  payload:
    description: Reserved; null for CDC in this pipeline.
  ts_transaction:
    lineage:
      - datalake_company_transactional.company_product.ts_database_transaction
    description: Source database transaction time from CDC.
  event_origin:
    description: Fully qualified transactional table name for this job.
  ts_load:
    description: Load timestamp into the core history table.
  year:
    lineage:
      - datalake_company_transactional.company_product.ts_database_transaction
    description: Partition year from ts_transaction.
  month:
    lineage:
      - datalake_company_transactional.company_product.ts_database_transaction
    description: Partition month from ts_transaction.
  day:
    lineage:
      - datalake_company_transactional.company_product.ts_database_transaction
    description: Partition day from ts_transaction.
