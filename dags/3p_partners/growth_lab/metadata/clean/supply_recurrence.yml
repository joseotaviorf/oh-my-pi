---
database_name: datalake_growth_lab_clean
table_name: supply_recurrence
owner: vitor.musachio@quintoandar.com.br
domain: 3P Partners
description: "Each row of this table is a listing crawled from Zap Imoveis."
columns:
  id_offer:
    description: 'Unique identifier for the real estate offer/listing'
    lineage:
    - datalake_growth_lab_raw.supply_recurrence.id_offer
  id_advertiser_zap:
    description: 'Unique identifier of the advertiser in Zap Imoveis platform'
    lineage:
    - datalake_growth_lab_raw.supply_recurrence.id_anunciante_zap
  id_listing_zap:
    description: 'Unique listing code/ID assigned by Zap Imoveis platform'
    lineage:
    - datalake_growth_lab_raw.supply_recurrence.código_id_anuncio_zap
  id_by_real_estate:
    description: 'Property ID used by the real estate agency in their internal CRM system'
    lineage:
    - datalake_growth_lab_raw.supply_recurrence.id_imovel_crm_imobiliária
  sk_company:
    description: 'Surrogate key identifying the real estate company'
    lineage:
    - datalake_growth_lab_raw.supply_recurrence.sk_company
  cnpj:
    description: 'Brazilian tax ID number (CNPJ) of the real estate company'
    lineage:
    - datalake_growth_lab_raw.supply_recurrence.cnpj
  advertiser_name:
    description: 'Name of the advertiser posting the listing on Zap Imoveis'
    lineage:
    - datalake_growth_lab_raw.supply_recurrence.nome_do_anunciante
  advertiser_profile_url:
    description: 'URL link to the advertiser profile page on Zap Imoveis'
    lineage:
    - datalake_growth_lab_raw.supply_recurrence.link_perfil_anunciante
  house_type:
    description: 'Type of property (apartment, house, commercial, etc.)'
    lineage:
    - datalake_growth_lab_raw.supply_recurrence.tipo_imovel
  listing_url:
    description: 'Direct URL link to the property listing page on Zap Imoveis'
    lineage:
    - datalake_growth_lab_raw.supply_recurrence.link_do_anuncio_do_imovel
  city:
    description: 'City where the property is located'
    lineage:
    - datalake_growth_lab_raw.supply_recurrence.Cidade
  neighborhood:
    description: 'Neighborhood/district where the property is located'
    lineage:
    - datalake_growth_lab_raw.supply_recurrence.bairro
  zip_code:
    description: 'Brazilian postal code (CEP) of the property location'
    lineage:
    - datalake_growth_lab_raw.supply_recurrence.cep
  business_context:
    description: 'Type of business transaction (sale, rent, etc.)'
    lineage:
    - datalake_growth_lab_raw.supply_recurrence.Tipo_negocio
  house_usage_status:
    description: 'Indicates whether the property is used/occupied or new/vacant'
    lineage:
    - datalake_growth_lab_raw.supply_recurrence.imovel_usado
  member_status:
    description: 'Membership status of the advertiser on Zap Imoveis platform'
    lineage:
    - datalake_growth_lab_raw.supply_recurrence.status_de_membros
  supply_source:
    description: 'Source system or platform where the supply data was crawled from'
    lineage:
    - datalake_growth_lab_raw.supply_recurrence.source
  price:
    description: 'Listed price value of the property in Brazilian Reais'
    lineage:
    - datalake_growth_lab_raw.supply_recurrence.valor
  gc_leads:
    description: 'Number of leads generated for this listing'
    lineage:
    - datalake_growth_lab_raw.supply_recurrence.gc_leads
  gc_views:
    description: 'Number of views/page visits for this listing'
    lineage:
    - datalake_growth_lab_raw.supply_recurrence.gc_views
  has_3p_access_control:
    description: >
      Boolean flag indicating that this event is subject to 3P Partners access control policies.
      Used by data governance tools and access control systems to apply 3P-specific security policies.
  dt_listing_created:
    description: 'Date when the listing was originally created on Zap Imoveis'
    lineage:
    - datalake_growth_lab_raw.supply_recurrence.data_criação_anuncio
  dt_listing_updated:
    description: 'Date when the listing was last updated on Zap Imoveis'
    lineage:
    - datalake_growth_lab_raw.supply_recurrence.data_ultima_atualização_do_anuncio
  dt_generated:
    description: 'Date when this data record was generated by the crawler'
    lineage:
    - datalake_growth_lab_raw.supply_recurrence.data_geração
  dt_execution:
    description: 'Date when the Growth Labs pipeline execution occurred'
    lineage:
    - datalake_growth_lab_raw.supply_recurrence.execution_date
  year:
    description: 'Year partition field for data organization'
    lineage:
    - datalake_growth_lab_raw.supply_recurrence.year
  month:
    description: 'Month partition field for data organization'
    lineage:
    - datalake_growth_lab_raw.supply_recurrence.month
  day:
    description: 'Day partition field for data organization'
    lineage:
    - datalake_growth_lab_raw.supply_recurrence.day