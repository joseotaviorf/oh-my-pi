---
table_name: datalake_3p_supply.listing_draft_events
alert_channel: "#alerts-de-airflow-3p-partners"

table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: 0
    less_than_or_equal_to: 20
    severity_level: Warning

column_level_validations:
  id_lead_3p:
    is_complete:
      severity_level: Error
  id_house:
    is_complete:
      severity_level: Error
  id_listing:
    is_complete:
      severity_level: Error
  business_context:
    is_complete:
      severity_level: Error
    is_contained_in:
      values: ["SALE", "RENT", "SALE_PRIMARY_MARKET"]
      severity_level: Error
  has_3p_access_control:
    is_complete:
      severity_level: Error
  ts_updated:
    is_complete:
      severity_level: Error
  ts_load:
    is_complete:
      severity_level: Error
  id_lead_3p_business_context_unique:
    custom:
      constraint: |-
        (SELECT COUNT(*)
         FROM (
           SELECT id_lead_3p, business_context, COUNT(*) AS cnt
           FROM datalake_3p_supply.listing_draft_events
           GROUP BY id_lead_3p, business_context
           HAVING cnt > 1
         )
        ) = 0
      severity_level: Error
  ts_availability_check_after_ts_resolution:
    custom:
      constraint: |-
        (SELECT COUNT(*)
         FROM datalake_3p_supply.listing_draft_events
         WHERE ts_availability_check IS NOT NULL
           AND ts_availability_check_resolution IS NOT NULL
           AND ts_availability_check > ts_availability_check_resolution
        ) = 0
      severity_level: Warning