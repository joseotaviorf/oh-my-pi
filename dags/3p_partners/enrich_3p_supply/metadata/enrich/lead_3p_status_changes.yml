---
database_name: datalake_3p_supply
table_name: lead_3p_status_changes
owner: vitor.musachio@quintoandar.com.br
domain: 3P Partners
description: |
  Status change timeline for 3P leads, built from the Hibernate Envers audit trail.
  Each row represents a single status transition for a lead within a business context,
  with start/end timestamps and parsed reason details.

  **Sources**:
  - datalake_brokers_supply_processor_clean.business_context_detail_aud (audit records)
  - datalake_brokers_supply_processor_clean.business_context_detail (current state for id_lead/business_context)
  - datalake_brokers_supply_processor_clean.rev_info (revision timestamps)

  **Key features**:
  - ts_start/ts_end computed via LEAD() window function over revision timestamps
  - status_reason JSON parsed into separate arrays for pending and not-eligible reasons
  - Duplicate house ID extracted when applicable

columns:
  id_lead_3p:
    description: "Lead ID (long), references lead_3p.id_lead_3p"
    lineage:
      - datalake_brokers_supply_processor_clean.business_context_detail.id_lead
  id_file:
    description: "File ID associated with the lead import batch (long)"
    lineage:
      - datalake_brokers_supply_processor_clean.business_context_detail.id_file
  id_duplicated_house:
    description: "ID of the duplicate house in EBDB when the lead was marked as duplicate (int, nullable)"
  business_context:
    description: "Business context (SALE, RENT, SALE_PRIMARY_MARKET)"
    lineage:
      - datalake_brokers_supply_processor_clean.business_context_detail.business_context
  status:
    description: "Lead status at this point in time (e.g. RECEIVED, PROCESSING, CONVERTED, REGISTERED)"
    lineage:
      - datalake_brokers_supply_processor_clean.business_context_detail_aud.status
  status_reasons:
    description: "Array of active reason keys (where value='true' in the status_reason map)"
  status_reasons_not_eligible:
    description: "Array of not-eligible reason messages from listOfNotEligibleReasonsMessages in the status_reason JSON"
  status_reasons_pending:
    description: "Array of pending/eligible reason messages from listOfPendingReasonsMessages in the status_reason JSON"
  has_3p_access_control:
    description: "Access control flag for 3P data (boolean, always true)"
    lineage:
      - datalake_brokers_supply_processor_clean.business_context_detail.has_3p_access_control
  ts_start:
    description: "Timestamp when this status period started (from rev_info revision timestamp)"
  ts_end:
    description: "Timestamp when this status period ended (next revision timestamp, null if current)"
  ts_created:
    description: "Business context detail creation timestamp"
    lineage:
      - datalake_brokers_supply_processor_clean.business_context_detail.ts_created
  ts_load:
    description: "Timestamp when the record was processed by this DAG"
  year:
    description: "Partition column: year derived from ts_start"
  month:
    description: "Partition column: month derived from ts_start"
  day:
    description: "Partition column: day derived from ts_start"