---
database_name: datalake_3p_supply
table_name: listing_draft_events
owner: vitor.musachio@quintoandar.com.br
domain: 3P Partners
description: |
  Pre-computed lead-to-house mapping and availability/CDI event timestamps
  for 3P leads. Materializes the CTEs that will support fact_lead_3p in the DW layer.

  **Sources**:
  - datalake_brokers_supply_processor_clean.business_context_detail (lead-to-listing via id_listing)
  - datalake_ebdb_clean.listing_business_context (listing lifecycle events)
  - datalake_ebdb_listing_clean.listing_business_context_aud (audit for CDI ownership)
  - datalake_ebdb_clean.house (3P house validation)

  **Key features**:
  - Maps each lead to its EBDB house via business_context_detail.id_listing
  - Handles 1:N lead-to-house conflicts with ROW_NUMBER deduplication and conflict flag
  - Extracts availability check, resolution, and first listing timestamps
  - Determines if the listing was originally created through CDI (3P partner ownership)

columns:
  id_lead_3p:
    description: "Lead ID (long), references lead_3p.id_lead_3p"
    lineage:
      - datalake_brokers_supply_processor_clean.business_context_detail.id_lead
  id_house:
    description: "House ID in EBDB (long), after deduplication of 1:N conflicts"
    lineage:
      - datalake_ebdb_clean.house.id
  id_listing:
    description: "Listing ID in EBDB linking the lead to its house (long)"
    lineage:
      - datalake_brokers_supply_processor_clean.business_context_detail.id_listing
  business_context:
    description: "Business context (SALE, RENT, SALE_PRIMARY_MARKET)"
    lineage:
      - datalake_brokers_supply_processor_clean.business_context_detail.business_context
  is_lead_house_conflict:
    description: "Whether the lead maps to multiple houses in EBDB (boolean)"
  is_first_listing_through_cdi:
    description: "Whether the first listing version was created through CDI by the 3P partner (boolean)"
    lineage:
      - datalake_ebdb_listing_clean.listing_business_context_aud.ownership
  has_3p_access_control:
    description: "Access control flag for 3P data (boolean, always true)"
    lineage:
      - datalake_brokers_supply_processor_clean.business_context_detail.has_3p_access_control
  ts_availability_check:
    description: "Earliest listing creation timestamp in EBDB, representing when availability was first checked"
    lineage:
      - datalake_ebdb_clean.listing_business_context.ts_created
  ts_availability_check_resolution:
    description: "Earliest first publication timestamp, representing when availability was resolved"
    lineage:
      - datalake_ebdb_clean.listing_business_context.ts_first_publication
  ts_first_listing:
    description: "Earliest first publication timestamp for listings in PUBLISHED or EDITING status"
    lineage:
      - datalake_ebdb_clean.listing_business_context.ts_first_publication
  ts_updated:
    description: "Greatest of ts_availability_check, ts_availability_check_resolution, ts_first_listing (falls back to ts_load if all null)"
  ts_load:
    description: "Timestamp when the record was processed by this DAG"
  year:
    description: "Partition column: year derived from ts_updated"
  month:
    description: "Partition column: month derived from ts_updated"
  day:
    description: "Partition column: day derived from ts_updated"