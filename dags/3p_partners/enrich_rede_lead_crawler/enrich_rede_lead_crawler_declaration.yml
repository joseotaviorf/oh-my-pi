dag:
  name: enrich_rede_lead_crawler
  schedule_start_date: 2020, 8, 29
  owner: Data 3P Partners
  documentation:
    dag_purpose: |
      Creates enriched tables focused on the context of Rede and its interaction with crawlers.
      This DAG is triggered by Mediator and loads the table via full load.
workflow:
  type: query_delta
  layer: enrich
  tables_customization:
    lead_3p_freshness:
      table_privileges:
        3p-readers:
          - SELECT
        data-engineers:
          - ALL PRIVILEGES
cluster:
  type: databricks_16_4_med_general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: USER_ISOLATION
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}