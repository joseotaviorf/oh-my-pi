---
database_name: datalake_hubspot
table_name: contact
description: This table shows the contacts registered in HubSpot. Each row is one contact.
domain: Rede
owner: vitor.musachio@quintoandar.com.br
columns:
  id_contact:
    lineage:
    - datalake_hubspot.contact_history.id_contact
    description: Unique identifier of the contact.
  id_hubspot_owner:
    lineage:
    - datalake_hubspot.contact_history.id_hubspot_owner
    description: ID of the HubSpot owner associated with the contact.
  id_company:
    lineage:
    - datalake_hubspot.contact_history.id_company
    description: ID of the main company associated with the contact (more than one
      can be associated. That can be seen in datalake_hubspot.company_contact).
  id_ebdb_user:
    lineage:
    - datalake_hubspot.contact_history.id_ebdb_user
    description: ID of the user in EBDB associated with the contact, matched by email.
  company_associations:
    lineage:
    - datalake_hubspot.contact_history.company_associations
    description: IDs and types of the companies associated with the contact.
  hs_analytics_first_touch_converting_campaign:
    lineage:
    - datalake_hubspot.contact_history.hs_analytics_first_touch_converting_campaign
    description: Name of the first campaign that generated a conversion for the contact.
  hs_analytics_last_touch_converting_campaign:
    lineage:
    - datalake_hubspot.contact_history.hs_analytics_last_touch_converting_campaign
    description: Name of the last campaign that generated a conversion for the contact.
  hs_analytics_source:
    lineage:
    - datalake_hubspot.contact_history.hs_analytics_source
    description: Original source. First visit or interaction with the business.
  hs_analytics_source_data_1:
    lineage:
    - datalake_hubspot.contact_history.hs_analytics_source_data_1
    description: Original source, drill-down 1. Adds more insight about the first
      visit or interaction with the business.
  hs_analytics_source_data_2:
    lineage:
    - datalake_hubspot.contact_history.hs_analytics_source_data_2
    description: Original source, drill-down 2. Adds more insight about the first
      visit or interaction with the business.
  hs_latest_source_data_1:
    lineage:
    - datalake_hubspot.contact_history.hs_latest_source_data_1
    description: Latest source, drill-down 1. Adds more insight about the last visit
      or interaction with the business.
  hs_latest_source_data_2:
    lineage:
    - datalake_hubspot.contact_history.hs_latest_source_data_2
    description: Latest source, drill-down 2. Adds more insight about the last visit
      or interaction with the business.
  first_conversion_event_name:
    lineage:
    - datalake_hubspot.contact_history.first_conversion_event_name
    description: Name of the first conversion event for the contact.
  field_of_business:
    lineage:
    - datalake_hubspot.contact_history.field_of_business
    description: Field of business of the contact.
  occupation:
    lineage:
    - datalake_hubspot.contact_history.occupation
    description: Occupation of the contact.
  address:
    lineage:
    - datalake_hubspot.contact_history.address
    description: Address of the contact.
  city:
    lineage:
    - datalake_hubspot.contact_history.city
    description: City of the contact.
  state:
    lineage:
    - datalake_hubspot.contact_history.state
    description: State of the contact.
  company:
    lineage:
    - datalake_hubspot.contact_history.company
    description: Company of the contact.
  email:
    lineage:
    - datalake_hubspot.contact_history.email
    description: Email of the contact.
  hs_email_domain:
    lineage:
    - datalake_hubspot.contact_history.hs_email_domain
    description: Domain of the email of the contact.
  hs_whatsapp_phone_number:
    lineage:  
    - datalake_hubspot.contact_history.hs_whatsapp_phone_number
    description: Whatsapp phone number for the owner/CEO, partner or manager. 
  mobile_phone:
    lineage:
    - datalake_hubspot.contact_history.mobile_phone
    description: Mobile phone of the contact.
  phone:
    lineage:
    - datalake_hubspot.contact_history.phone
    description: Phone of the contact.
  website:
    lineage:
    - datalake_hubspot.contact_history.website
    description: Website of the contact.
  first_name:
    lineage:
    - datalake_hubspot.contact_history.first_name
    description: First name of the contact.
  last_name:
    lineage:
    - datalake_hubspot.contact_history.last_name
    description: Last name of the contact.
  hs_marketable_status:
    lineage:
    - datalake_hubspot.contact_history.hs_marketable_status
    description: Marketable status of the contact.
  life_cycle_stage:
    lineage:
    - datalake_hubspot.contact_history.life_cycle_stage
    description: Life cycle stage of the contact.
  lead_origin_restricted_use:
    lineage:
    - datalake_hubspot.contact_history.lead_origin_restricted_use
    description: Lead origin of the contact (restricted field).
  recent_conversion_event_name:
    lineage:
    - datalake_hubspot.contact_history.recent_conversion_event_name
    description: Name of the most recent conversion event for the contact.
  nps_responsible:
    lineage: 
      - datalake_hubspot.contact_history.nps_responsible
    description: Person responsible for the NPS.
  lead_status:
    lineage:
    - datalake_hubspot.contact_history.lead_status
    description: Lead status of the contact.
  lead_status_history:
    lineage:
    - datalake_hubspot.contact_history.lead_status_history
    description: Lead status history of the contact.
  num_conversion_events:
    lineage:
    - datalake_hubspot.contact_history.num_conversion_events
    description: Number of conversion events of the contact.
  num_associated_deals:
    lineage:
    - datalake_hubspot.contact_history.num_associated_deals
    description: Number of associated deals of the contact.
  is_enrolled_in_sequence:
    lineage:
    - datalake_hubspot.contact_history.is_enrolled_in_sequence
    description: Whether the contact is enrolled in a Sequence (email automation in
      HubSpot).
  has_been_in_demand_only_onboarding_live:
    lineage:
      - datalake_hubspot.contact_history.has_been_in_demand_only_onboarding_live
    description: Whether the contact has been in the Demand Only onboarding live.
  is_archived:
    lineage:
    - datalake_hubspot.contact_history.is_archived
    description: Whether the contact is archived.
  ts_first_conversion:
    lineage:
    - datalake_hubspot.contact_history.ts_first_conversion
    description: Timestamp of the first conversion event for the contact.
  ts_notes_last_updated:
    lineage:
    - datalake_hubspot.contact_history.ts_notes_last_updated
    description: Timestamp of the last update of the notes of the contact.
  ts_notes_next_activity:
    lineage:
    - datalake_hubspot.contact_history.ts_notes_next_activity
    description: Timestamp of the next activity of the notes of the contact.
  ts_closed:
    lineage:
    - datalake_hubspot.contact_history.ts_closed
    description: Timestamp of the closing of the contact.
  ts_live_demand_only:
    lineage:
      - datalake_hubspot.contact_history.ts_live_demand_only
    description: Time when the demand only onboarding live was done.
  ts_archived:
    lineage:
    - datalake_hubspot.contact_history.ts_archived
    description: Timestamp of the archiving of the contact.
  ts_created:
    lineage:
    - datalake_hubspot.contact_history.ts_created
    description: Timestamp of the creation of the contact.
  ts_updated:
    lineage:
    - datalake_hubspot.contact_history.ts_updated
    description: Timestamp of the last update of the contact.
  year:
    lineage:
    - datalake_hubspot.contact_history.year
    description: Year of the last update of the contact.
  month:
    lineage:
    - datalake_hubspot.contact_history.month
    description: Month of the last update of the contact.
  day:
    lineage:
    - datalake_hubspot.contact_history.day
    description: Day of the last update of the contact.