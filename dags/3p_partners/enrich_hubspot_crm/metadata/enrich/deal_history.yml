---
database_name: datalake_hubspot
table_name: deal_history
description: |
  Historical tracking table for deal changes in HubSpot CRM with comprehensive sales analytics and pipeline progression tracking.
  Each row represents a daily snapshot of deal state changes, enabling time-series analysis and sales performance measurement.
  This table captures the complete evolution of sales opportunities over time with enriched metadata for pipeline optimization,
  conversion analysis, and revenue forecasting.

  **Key Features:**
  - Daily granularity change tracking with complete deal progression history
  - Pipeline and stage movement tracking for sales velocity analysis
  - Revenue and probability evolution for forecasting accuracy measurement
  - Sales owner and team attribution changes for performance analysis
  - Deal source and campaign attribution for marketing effectiveness
  - Company and contact relationship evolution for account development tracking
domain: 3P Partners
owner: vitor.musachio@quintoandar.com.br
