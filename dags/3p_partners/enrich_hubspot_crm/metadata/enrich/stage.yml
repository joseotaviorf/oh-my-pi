---
database_name: datalake_hubspot
table_name: stage
owner: vitor.musachio@quintoandar.com.br
domain: 3P Partners
description: |
  Enriched stage configuration table with comprehensive workflow step definitions and progression analytics metadata. 
  Each row represents a distinct stage within business pipelines, enriched with business logic for process analysis 
  and conversion optimization. This table provides the detailed structure for understanding workflow progression and 
  stage-level performance measurement across sales and support processes.
  
  **Key Features:**
  - Complete stage taxonomy with pipeline association and business context
  - Stage progression logic and probability calculations for forecasting
  - Display order and hierarchy management for workflow visualization
  - Stage-specific business rules and conversion criteria definition
  - Performance tracking foundation for stage-level analytics and optimization
  - Closed-won and closed-lost classification for revenue and resolution analysis
columns:
  id_stage:
    lineage:
      - datalake_hubspot.stage_history.id_stage
    description: 'Unique identifier for the stage within HubSpot. Primary key used for tracking stage-level performance and associating deals/tickets with their current workflow position.'
  id_pipeline:
    lineage:
      - datalake_hubspot.stage_history.id_pipeline
    description: 'Reference to the pipeline this stage belongs to. Links stages to their parent workflow for multi-pipeline analysis and process comparison.'
  label:
    lineage:
      - datalake_hubspot.stage_history.label
    description: 'Human-readable name of the stage (e.g., "Qualified Lead", "Proposal Sent", "Closed Won"). Used for reporting and user interface display.'
  metadata:
    lineage:
      - datalake_hubspot.stage_history.metadata
    description: 'JSON object containing stage configuration metadata including probability, closed-won status, and custom properties. Provides detailed stage behavior rules and analytics attributes.'
  display_order:
    lineage:
      - datalake_hubspot.stage_history.display_order
    description: 'Numeric order for displaying stages within the pipeline. Determines the sequence and progression flow for workflow visualization and funnel analysis.'
  is_deal_stage:
    lineage:
      - datalake_hubspot.stage_history.is_deal_stage
    description: 'Boolean flag indicating if this stage is used in deal pipelines. Enables filtering and analysis specific to sales workflow stages and revenue tracking.'
  is_ticket_stage:
    lineage:
      - datalake_hubspot.stage_history.is_ticket_stage
    description: 'Boolean flag indicating if this stage is used in ticket pipelines. Enables filtering and analysis specific to support workflow stages and resolution tracking.'
  ts_created:
    lineage:
      - datalake_hubspot.stage_history.ts_created
    description: 'Timestamp when the stage configuration was first created. Used for tracking workflow evolution and stage lifecycle management.'
  ts_updated:
    lineage:
      - datalake_hubspot.stage_history.ts_updated
    description: 'Timestamp of the most recent update to the stage configuration. Used for change tracking and workflow optimization analysis.'
  year:
    lineage:
      - datalake_hubspot.stage_history.year
    description: 'Partition column: Year extracted from the stage update timestamp. Enables annual analysis of stage configuration changes and workflow evolution patterns.'
  month:
    lineage:
      - datalake_hubspot.stage_history.month
    description: 'Partition column: Month extracted from the stage update timestamp. Supports monthly tracking of stage modifications and process optimization cycles.'
  day:
    lineage:
      - datalake_hubspot.stage_history.day
    description: 'Partition column: Day extracted from the stage update timestamp. Provides daily granularity for stage configuration change analysis.'