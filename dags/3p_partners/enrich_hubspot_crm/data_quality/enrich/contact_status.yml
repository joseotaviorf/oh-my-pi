---
table_name: datalake_hubspot.contact_status
alert_channel: "#alerts-de-airflow-dags"
table_level_validations:
  has_size:
    greater_than: 600
    severity_level: Error
column_level_validations:
  id_contact:
    is_complete:
      severity_level: Error
  lead_status:
    is_complete:
      severity_level: Error
  days_in_status:
    is_complete:
      severity_level: Error
    has_min_value:
      greater_than_or_equal_to: 0
      severity_level: Error
  ts_status_started:
    is_complete:
      severity_level: Error
