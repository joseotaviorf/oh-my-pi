dag:
  name: enrich_hubspot_crm
  schedule_start_date: 2021, 8, 24
  owner: Data 3P Partners
  documentation:
    dag_purpose: |
      Creates enriched, analytics-ready tables from raw HubSpot CRM data with comprehensive business logic and data quality enhancements.
      
      **Enrichment Strategy:**
      - **Current State Tables**: Denormalized, flattened views of core CRM entities (companies, contacts, deals, tickets)
      - **Historical Tracking**: Complete change history with daily snapshots for trend analysis and attribution
      - **Business Logic**: Enriched with calculated fields, status classifications, and relationship hierarchies
      - **Data Quality**: Cleaned, validated, and standardized data with consistent naming and formatting
      
      **Key Table Categories:**
      - **Core Entities**: company, contact, deal, ticket - Enriched current state with business calculations
      - **History Tables**: *_history - Complete change tracking with daily granularity for time-series analysis
      - **Status Tables**: *_status - Business status transitions and change attribution with source tracking
      - **Relationships**: company_contact, company_members - Normalized association tables with business context
      - **Configuration**: pipeline, stage, *_stage - Workflow definitions and process metadata
      
      **Technical Notes**: Separated from enrich_hubspot_management due to Job Cluster limitations for optimal resource utilization.
workflow:
  type: query_delta
  layer: enrich
  custom_schema: hubspot
  inner_dependencies:
    company:
    - company_contact
    - company_history
    company_contact:
    - contact
    company_members:
    - company
    company_status:
    - company
    contact:
    - contact_history
    contact_status:
    - contact
    deal:
    - deal_history
    deal_stage:
    - deal
    - stage
    pipeline:
    - pipeline_history
    stage:
    - stage_history
    ticket:
    - ticket_history
    ticket_stage:
    - ticket
  tables_customization:
    company_history:
      extraction_type: incremental
      partitions:
      - year
      - month
      - day
    contact_history:
      extraction_type: incremental
      partitions:
      - year
      - month
      - day
    deal_history:
      extraction_type: incremental
      partitions:
      - year
      - month
      - day
    ticket_history:
      extraction_type: incremental
      partitions:
      - year
      - month
      - day
cluster:
  type: databricks_12_2_min_memory_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}