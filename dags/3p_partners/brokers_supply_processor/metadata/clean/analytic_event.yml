database_name: datalake_brokers_supply_processor_clean
table_name: analytic_event
owner: vitor.musachio@quintoandar.com.br
domain: 3P Partners
description: >
  Captures analytics events and user interactions within the brokers-supply-processor system.
  This table serves as the foundation for tracking lead processing workflow, system performance monitoring,
  and user behavior analysis. Events are generated automatically by the system during key processing
  milestones and user actions, providing comprehensive audit trail and business intelligence data.

  BUSINESS CONTEXT: Event tracking enables detailed funnel analysis of the 3P lead processing pipeline, from initial
  import through final conversion. Events help identify bottlenecks, measure processing efficiency,
  and provide insights for system optimization and partner relationship management.

  EVENT CATEGORIES: Events cover the full lead lifecycle including file imports, lead validation, status changes,
  publishing decisions, and system interactions. Each event captures context-specific metadata
  to enable detailed analysis and troubleshooting.

  DATA CHARACTERISTICS: High volume - potentially millions of events per day during peak processing. 
  Long-term retention for historical analysis and compliance. Events are typically write-once for audit integrity. 
  Events generated in near real-time during system operations.

  RELATED TABLES: lead_3p (many-to-one relationship via lead_uuid for lead-specific events), 
  business_context_detail (related via lead processing workflow), file (related via file processing events).

  KEY METRICS: Event volume trends indicating system usage and health, Lead conversion funnel analysis using status change events, 
  Processing time analysis from event timestamps, Error rate tracking through failed event analysis, Partner activity levels and engagement patterns.

  ANALYTICAL USE CASES: Lead processing funnel analysis and optimization, System performance monitoring and SLA tracking, 
  Partner behavior analysis and engagement measurement, Error pattern identification and root cause analysis, 
  Business process optimization through workflow analysis, Real-time dashboards and operational monitoring.

  EVENT PATTERN EXAMPLES: 
  Typical lead flow: FILE_UPLOADED → FILE_PROCESSED → LEAD_CREATED → LEAD_STATUS_CHANGED (multiple) → LEAD_CONVERTED/REJECTED
  Error scenarios: FILE_UPLOADED → FILE_PROCESSING_FAILED → ERROR_REPORTED
  Duplicate handling: LEAD_CREATED → DUPLICATE_DETECTED → LEAD_MERGED/REJECTED

  QUALITY INDICATORS: High error event rates may indicate system or data quality issues, Long processing times between related events suggest bottlenecks, 
  Missing events in expected sequences indicate incomplete tracking, Event property consistency enables reliable analysis.

  OPERATIONAL NOTES: Events are generated asynchronously and may have slight delays, Event properties schema should be validated for analysis reliability, 
  Historical events provide valuable context for current processing decisions, Event deduplication handled via event_uuid to prevent double-counting.
columns:
  id:
    lineage:
      - datalake_brokers_supply_processor_raw.analytic_event.id
    description: >
      Unique auto-incrementing identifier for each analytics event record (BIGINT, Primary Key, Not Nullable).
  id_tracking:
    lineage:
      - datalake_brokers_supply_processor_raw.analytic_event.tracking_id
    description: >
      Session or process tracking identifier that groups related events together (STRING, Nullable).
      Enables tracing of complete user sessions or processing workflows across multiple events.
      Essential for session analysis and multi-step process tracking.
  uuid_event:
    lineage:
      - datalake_brokers_supply_processor_raw.analytic_event.event_uuid
    description: >
      Unique UUID identifier for the event, used for deduplication and cross-system event correlation (STRING, Nullable).
      Enables tracking of related events across different services and systems.
      Critical for event deduplication and distributed system event correlation.
  uuid_lead:
    lineage:
      - datalake_brokers_supply_processor_raw.analytic_event.lead_uuid
    description: >
      UUID of the lead associated with this event, if applicable (STRING, Nullable, Foreign Key: lead_3p.uuid_lead). 
      Links events to specific property leads for detailed lead lifecycle analysis and performance tracking.
      Critical for lead-specific funnel analysis and conversion tracking.
  event_type:
    lineage:
      - datalake_brokers_supply_processor_raw.analytic_event.event_type
    description: >
      Classification of the event type indicating what action or milestone occurred (STRING, Nullable).
      Used for filtering and aggregating events by business process or system function.
      Examples: LEAD_CREATED (New 3P lead was imported into the system), LEAD_STATUS_CHANGED (Lead processing status was updated), 
      FILE_UPLOADED (Partner uploaded a new file for processing), FILE_PROCESSED (File processing completed successfully or with errors), 
      LEAD_CONVERTED (Lead was successfully sent to main QuintoAndar system), LEAD_REJECTED (Lead failed eligibility or quality filters), 
      DUPLICATE_DETECTED (Duplicate lead was identified and handled), PARTNER_ACTION (Partner performed an action in the system).
      Primary dimension for event categorization and funnel analysis.
  event_properties:
    lineage:
      - datalake_brokers_supply_processor_raw.analytic_event.event_properties
    description: >
      JSON object containing event-specific metadata and context information (JSON, Nullable).
      Structure varies by event_type but typically includes relevant IDs, status changes,
      error details, and business context data for comprehensive event analysis.
      Example: {"partner_id": "PARTNER_123", "file_id": 456, "old_status": "RECEIVED", 
      "new_status": "APPROVED", "business_context": "SALE", 
      "processing_time_ms": 1500, "filter_results": {"price_check": "PASS", "location_check": "PASS"}}
      Contains rich contextual data enabling detailed event analysis and troubleshooting.
      Structure should be documented per event_type for consistent analysis.
  has_3p_access_control:
    description: >
      Boolean flag indicating that this event is subject to 3P Partners access control policies (BOOLEAN, Not Nullable, Always TRUE).
      Static field used for access control and data governance within the 3P Partners domain.
      All events in this table are related to 3P Partners operations and require appropriate access permissions.
      Used by data governance tools and access control systems to apply 3P-specific security policies.
  ts_event:
    lineage:
      - datalake_brokers_supply_processor_raw.analytic_event.event_date
    description: >
      Business date when the event conceptually occurred, which may differ from ts_created
      for events processed with delay or in batch (DATE, Nullable). Used for business reporting and trend analysis.
      Primary dimension for time-based analytics and trend analysis.
  ts_created:
    lineage:
      - datalake_brokers_supply_processor_raw.analytic_event.created_at
    description: >
      Precise timestamp when the event record was created in the database (TIMESTAMP, Not Nullable).
      Used for technical troubleshooting and exact chronological ordering of events.
      Technical timestamp for precise event ordering and system performance analysis.
  ts_updated:
    lineage:
      - datalake_brokers_supply_processor_raw.analytic_event.updated_at
    description: >
      Timestamp when the event record was last modified (TIMESTAMP, Not Nullable). Typically same as ts_created
      since events are immutable, but may differ if corrections or enrichments are applied.
      Usually equals ts_created unless event data is corrected or enriched.
  year:
    lineage:
      - datalake_brokers_supply_processor_raw.business_context_detail_aud.year
    description: 'Partition column: Year extracted from ts_created for data lake partitioning optimization (INTEGER, Partition Key).'
  month:
    lineage:
      - datalake_brokers_supply_processor_raw.business_context_detail_aud.month
    description: 'Partition column: Month extracted from ts_created for data lake partitioning optimization (INTEGER, Partition Key).'
  day:
    lineage:
      - datalake_brokers_supply_processor_raw.business_context_detail_aud.day
    description: 'Partition column: Day extracted from ts_created for data lake partitioning optimization (INTEGER, Partition Key).'