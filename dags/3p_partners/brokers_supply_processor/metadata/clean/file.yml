---
database_name: datalake_brokers_supply_processor_clean
table_name: file
owner: vitor.musachio@quintoandar.com.br
domain: 3P Partners
description: >
  Manages bulk import files submitted by external partners containing multiple property leads.
  Each file represents a batch upload from a partner real estate agency and tracks the complete
  file processing lifecycle from upload through validation, processing, and completion.
  Files can contain hundreds or thousands of leads that are processed as a batch unit.

  BUSINESS CONTEXT: File-based imports are the primary method for partners to submit large volumes of property leads.
  The table tracks file processing status, error handling, and provides audit trail for batch operations.
  Failed files can be reprocessed, and file versions track updates to the same logical batch.

  PROCESSING WORKFLOW: File lifecycle: CREATED → PROCESSING → COMPLETED/FAILED. Error reasons help partners 
  understand and fix data quality issues for resubmission.

  FILE CHARACTERISTICS: Supported formats: CSV, Excel (XLSX), JSON. Max file size: 500MB. 
  Typical lead count: 50-5000 leads per file. Processing time: 5-60 minutes depending on file size and complexity.

  RELATED TABLES: business_context_detail (one-to-many relationship - multiple contexts per file), 
  lead_3p (one-to-many relationship - multiple leads per file), file_aud (full audit trail of all file record changes).

  KEY METRICS: File processing success rate (COMPLETED vs FAILED status), Processing time (ts_updated - ts_created for COMPLETED files), 
  Partner upload frequency and volume patterns, Error rate analysis by partner and error type, File size vs processing time correlation.

  QUALITY INDICATORS: High failure rates may indicate partner training needs, Long processing times may indicate system performance issues, 
  Recurring error patterns suggest need for validation improvements.

  USE CASES: Partner file processing performance monitoring, Data quality trend analysis by partner, Processing SLA compliance tracking, 
  Partner training and support prioritization, System capacity planning based on upload volumes, Error pattern analysis for validation rule optimization.

  OPERATIONAL NOTES: Failed files can be reprocessed after partner corrections, Large files may be processed in chunks for better performance, 
  File retention policy applies after successful processing, Partner access logs available for security audit.
columns:
  id:
    lineage:
      - datalake_brokers_supply_processor_raw.file.id
    description: >
      Unique auto-incrementing identifier for the file upload record (BIGINT, Primary Key, Not Nullable).
  id_partner:
    lineage:
      - datalake_brokers_supply_processor_raw.file.partner_id
    description: >
      Identifier of the external partner/real estate agency that uploaded this file (STRING, Not Nullable).
      Links file to partner account for access control and performance tracking.
      Critical for partner relationship management and file access authorization.
  hash:
    lineage:
      - datalake_brokers_supply_processor_raw.file.hash
    description: >
      UUID hash generated from file content to prevent duplicate file processing (STRING, Nullable).
      Used for deduplication when partners accidentally upload the same file multiple times.
      Ensures idempotent file processing and prevents duplicate lead creation.
  file_name:
    lineage:
      - datalake_brokers_supply_processor_raw.file.name
    description: >
      Original filename as uploaded by the partner (STRING, Nullable). Typically includes partner naming 
      conventions, date information, or batch identifiers meaningful to the partner.
      Examples: leads_2024_01_15.csv, partner_xyz_january_batch.xlsx, properties_weekly_export.json.
      Used for partner communication and troubleshooting specific uploads.
  type:
    lineage:
      - datalake_brokers_supply_processor_raw.file.type
    description: >
      Current processing status of the file in the import workflow (STRING, Nullable). 
      Indicates whether the file is queued, being processed, completed successfully, or failed.
      CREATED: File uploaded and queued for processing.
      PROCESSING: File is currently being validated and leads extracted.
      COMPLETED: File processed successfully, all leads extracted and evaluated.
      FAILED: File processing failed due to format or validation errors.
      CANCELLED: File processing was manually cancelled or stopped.
      Status progression indicates processing pipeline health. Stuck files may indicate system issues requiring investigation.
  url:
    lineage:
      - datalake_brokers_supply_processor_raw.file.url
    description: >
      S3 or external storage URL where the uploaded file is stored for processing (STRING, Nullable).
      Used by workers to download and process file content.
      Critical for file access during processing and audit trail maintenance. Contains partner data, ensure proper access controls.
  file_byte:
    lineage:
      - datalake_brokers_supply_processor_raw.file.file_byte
    description: >
      Binary content of small files stored directly in database for quick access (BINARY, Nullable).
      Larger files are stored externally (see url field) and this field remains NULL.
      Used for small files to avoid external storage overhead. Typically limited to files under 1MB.
  version:
    lineage:
      - datalake_brokers_supply_processor_raw.file.version
    description: >
      Version number for this file, starting at 1 and incrementing for updates (BIGINT, Nullable).
      Allows partners to submit corrections or updates to previously uploaded files.
      Version tracking enables file reprocessing workflow and maintains audit trail of partner data updates and corrections.
  errors_reasons:
    lineage:
      - datalake_brokers_supply_processor_raw.file.errors_reasons
    description: >
      JSON array containing detailed error information when file processing fails (JSON, Nullable).
      Each error object includes error type, description, and affected line/field information
      to help partners identify and fix data quality issues.
      Example: [{"error_type": "INVALID_FORMAT", "message": "Invalid date format in line 15", 
      "line_number": 15, "field": "created_date"},
      {"error_type": "MISSING_REQUIRED_FIELD", "message": "Missing address field", 
      "line_number": 23, "field": "location.address"}]
      Critical for partner feedback and data quality improvement. Used to generate
      error reports sent back to partners for file correction.
  has_3p_access_control:
    description: >
      Boolean flag indicating that this event is subject to 3P Partners access control policies (BOOLEAN, Not Nullable, Always TRUE).
      Static field used for access control and data governance within the 3P Partners domain.
      All events in this table are related to 3P Partners operations and require appropriate access permissions.
      Used by data governance tools and access control systems to apply 3P-specific security policies.
  ts_created:
    lineage:
      - datalake_brokers_supply_processor_raw.file.created_at
    description: >
      Timestamp when the file upload record was first created in the system (TIMESTAMP, Not Nullable).
      Represents when the partner initiated the file upload process.
      Used for SLA tracking and partner upload frequency analysis.
  ts_updated:
    lineage:
      - datalake_brokers_supply_processor_raw.file.updated_at
    description: >
      Timestamp when the file record was last modified, typically when status 
      changes or error information is updated during processing (TIMESTAMP, Not Nullable).
      Critical for monitoring processing time and identifying bottlenecks.
  year:
    lineage:
      - datalake_brokers_supply_processor_raw.file.year
    description: 'Partition column: Year extracted from ts_created for data lake partitioning optimization (INTEGER, Partition Key).'
  month:
    lineage:
      - datalake_brokers_supply_processor_raw.file.month
    description: 'Partition column: Month extracted from ts_created for data lake partitioning optimization (INTEGER, Partition Key).'
  day:
    lineage:
      - datalake_brokers_supply_processor_raw.file.day
    description: 'Partition column: Day extracted from ts_created for data lake partitioning optimization (INTEGER, Partition Key).'