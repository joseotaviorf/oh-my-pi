---
database_name: datalake_brokers_supply_processor_clean
table_name: file_aud
owner: vitor.musachio@quintoandar.com.br
domain: 3P Partners
description: >
  Complete audit trail for all changes made to the file table, automatically maintained by Hibernate Envers.
  This table captures the complete history of bulk import file processing lifecycle, from upload through completion,
  providing essential audit capabilities for partner file management and batch processing analysis.

  AUDIT FUNCTIONALITY: Tracks every file state change, processing status update, and metadata modification.
  Each revision captures the complete file state at time of change, enabling reconstruction of file processing
  history and analysis of batch import evolution over time.

  BUSINESS CONTEXT: Critical for 3P Partners operations requiring detailed audit trails for:
  - File processing workflow analysis and performance monitoring
  - Partner upload behavior and data quality assessment
  - Batch processing troubleshooting and error analysis
  - Regulatory compliance and data governance requirements
  - Partner relationship management and dispute resolution
  - System performance monitoring and capacity planning

  FILE LIFECYCLE TRACKING: Captures complete file journey from upload (CREATED) through processing (PROCESSING)
  to completion (COMPLETED/FAILED/CANCELLED). Essential for understanding batch processing performance and identifying
  bottlenecks in the partner data ingestion pipeline.

  REVISION SYSTEM: Uses Hibernate Envers to maintain chronological file processing history.
  Each revision represents a significant state change in file processing workflow.
  Enables correlation with lead_3p_aud and business_context_detail_aud for complete batch context.

  PARTNER ANALYSIS: Essential for analyzing partner upload patterns, file quality trends, error patterns,
  and processing performance across different partners and time periods.

  RELATED TABLES: Links to rev_info for revision timestamps, file for current state,
  lead_3p_aud for related lead processing. Critical for complete batch processing audit.

  KEY ANALYSIS PATTERNS: File processing performance analysis, Partner upload behavior tracking,
  Error pattern identification, Processing time optimization, Capacity planning analysis.

  USE CASES: Batch processing monitoring, Partner performance analysis, Error troubleshooting,
  Compliance auditing, System optimization, Capacity planning, Quality improvement.

  QUERY CONSIDERATIONS: Moderate volume table with processing state changes. Use modification flags
  and revision ranges for efficient analysis. Join with rev_info for human-readable timestamps.
columns:
  id:
    lineage:
      - datalake_brokers_supply_processor_raw.file_aud.id
    description: >
      File identifier from main file table (BIGINT, Not Nullable, Primary Key with rev).
      Links back to current file state in main table.
      Combined with rev forms composite primary key for audit entries.
  id_partner:
    lineage:
      - datalake_brokers_supply_processor_raw.file_aud.partner_id
    description: >
      Partner identifier at time of this revision (STRING, Not Nullable).
      Tracks which partner owned/uploaded the file when this change occurred.
      Essential for partner upload audit and relationship management tracking.
  hash:
    lineage:
      - datalake_brokers_supply_processor_raw.file_aud.hash
    description: >
      File content hash at time of revision (UUID, Nullable).
      Used for deduplication tracking and content integrity verification.
      Tracks hash changes due to file updates or content corrections.
  file_name:
    lineage:
      - datalake_brokers_supply_processor_raw.file_aud.name
    description: >
      Original filename at time of revision (STRING, Nullable).
      Tracks filename changes, corrections, or partner naming convention updates.
      Important for partner communication and file identification audit.
  type:
    lineage:
      - datalake_brokers_supply_processor_raw.file_aud.type
    description: >
      File processing status at time of revision (STRING, Nullable).
      Tracks status progression: CREATED → PROCESSING → COMPLETED/FAILED/CANCELLED.
      Most critical field for file processing workflow analysis and performance monitoring.
      Status values: CREATED (uploaded), PROCESSING (being processed), COMPLETED (success), 
      FAILED (processing error), CANCELLED (manually stopped).
  url:
    lineage:
      - datalake_brokers_supply_processor_raw.file_aud.url
    description: >
      File storage URL at time of revision (STRING, Nullable).
      Tracks file location changes, storage migrations, or URL updates.
      Important for file access audit and storage management tracking.
  file_byte:
    lineage:
      - datalake_brokers_supply_processor_raw.file_aud.file_byte
    description: >
      Binary file content for small files at time of revision (BINARY, Nullable).
      Tracks changes to directly stored file content (typically under 1MB).
      Used for small file storage optimization and content audit.
  version:
    lineage:
      - datalake_brokers_supply_processor_raw.file_aud.version
    description: >
      File version number at time of revision (BIGINT, Nullable).
      Tracks file versioning for updates, corrections, and reprocessing.
      Application-level versioning separate from audit revision system.
  rev:
    lineage:
      - datalake_brokers_supply_processor_raw.file_aud.rev
    description: >
      Hibernate Envers revision number (BIGINT, Not Nullable, Primary Key).
      Global sequence identifying the transaction that created this audit record.
      Links to rev_info table for revision metadata and precise timestamps.
      Enables correlation across all audited tables for complete transaction context.
  rev_end:
    lineage:
      - datalake_brokers_supply_processor_raw.file_aud.revend
    description: >
      Revision number when this record was superseded (BIGINT, Nullable).
      NULL for current/active audit records. Points to next revision that replaced this state.
      Enables efficient querying of file states within specific time ranges.
      Critical for point-in-time file state reconstruction and temporal analysis.
  rev_type:
    lineage:
      - datalake_brokers_supply_processor_raw.file_aud.revtype
    description: >
      Type of operation that created this audit record (SMALLINT, Not Nullable).
      0 = INSERT (file upload), 1 = UPDATE (status/metadata change), 2 = DELETE (file removal).
      Essential for understanding file lifecycle events and processing workflow steps.
      Most common: INSERT (upload) followed by multiple UPDATEs (status changes).
  mod_id_partner:
    lineage:
      - datalake_brokers_supply_processor_raw.file_aud.partner_id_mod
    description: >
      Modification flag for partner ID field (BOOLEAN, Nullable).
      TRUE when partner association changed, typically during ownership corrections.
      Important for tracking partner relationship changes and data ownership audit.
  mod_hash:
    lineage:
      - datalake_brokers_supply_processor_raw.file_aud.hash_mod
    description: >
      Modification flag for file hash field (BOOLEAN, Nullable).
      TRUE when file content hash changed, indicating content updates or corrections.
      Critical for content integrity tracking and deduplication analysis.
  mod_file_name:
    lineage:
      - datalake_brokers_supply_processor_raw.file_aud.name_mod
    description: >
      Modification flag for filename field (BOOLEAN, Nullable).
      TRUE when filename was changed, corrected, or standardized.
      Important for file identification and partner naming convention tracking.
  mod_type:
    lineage:
      - datalake_brokers_supply_processor_raw.file_aud.type_mod
    description: >
      Modification flag for processing status field (BOOLEAN, Nullable).
      TRUE when file processing status changed, marking workflow transitions.
      Most critical modification flag for file processing performance analysis.
      Essential for tracking processing pipeline progression and bottlenecks.
  mod_url:
    lineage:
      - datalake_brokers_supply_processor_raw.file_aud.url_mod
    description: >
      Modification flag for storage URL field (BOOLEAN, Nullable).
      TRUE when file storage location changed, indicating storage migrations or updates.
      Important for storage management audit and file access tracking.
  mod_file_byte:
    lineage:
      - datalake_brokers_supply_processor_raw.file_aud.file_byte_mod
    description: >
      Modification flag for binary content field (BOOLEAN, Nullable).
      TRUE when stored file content changed, typically for small files.
      Important for content management and storage optimization tracking.
  has_3p_access_control:
    description: >
      Boolean flag indicating that this event is subject to 3P Partners access control policies (BOOLEAN, Not Nullable, Always TRUE).
      Static field used for access control and data governance within the 3P Partners domain.
      All events in this table are related to 3P Partners operations and require appropriate access permissions.
      Used by data governance tools and access control systems to apply 3P-specific security policies.
  ts_created:
    lineage:
      - datalake_brokers_supply_processor_raw.file_aud.created_at
    description: >
      Original file upload timestamp from main table (TIMESTAMP, Nullable).
      Shows when the file was initially uploaded by the partner.
      Preserved from main table for reference, differs from revision creation time.
      Essential for file processing SLA analysis and upload pattern tracking.
  ts_updated:
    lineage:
      - datalake_brokers_supply_processor_raw.file_aud.updated_at
    description: >
      Last file update timestamp from main table at time of revision (TIMESTAMP, Nullable).
      Tracks when the file was last modified before this audit entry.
      Use rev_info timestamps for actual audit record creation times.
      Important for processing time analysis and performance monitoring.
  year:
    lineage:
      - datalake_brokers_supply_processor_raw.file_aud.year
    description: 'Partition column: Year extracted from revision timestamp for data lake partitioning optimization (INTEGER, Partition Key).'
  month:
    lineage:
      - datalake_brokers_supply_processor_raw.file_aud.month
    description: 'Partition column: Month extracted from revision timestamp for data lake partitioning optimization (INTEGER, Partition Key).'
  day:
    lineage:
      - datalake_brokers_supply_processor_raw.file_aud.day
    description: 'Partition column: Day extracted from revision timestamp for data lake partitioning optimization (INTEGER, Partition Key).'