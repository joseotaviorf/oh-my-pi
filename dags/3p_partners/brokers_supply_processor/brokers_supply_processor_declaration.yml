dag:
  name: brokers_supply_processor
  schedule_start_date: 2021, 8, 10
  schedule_interval: 0 0 * * *
  owner: Data Rede
  documentation:
    dag_purpose: This DAG imports the tables from Supply Processor, a platform responsible for bringing and processing properties from other real estate agencies in 3P Partners.
workflow:
  type: cdc
  layer: raw
  database_type: postgres
  custom_schema: brokers_supply_processor
  source_database: brokers_supply_processor
  source_schema: public
  default_partitions: [year, month, day]
  dbutils_secret_key: BROKERS_SUPPLY_PROCESSOR_DB
  tables_customization:
    analytic_event:
      z_order_by: [id]
    business_context_detail:
      z_order_by: [id]
    business_context_detail_aud:
      raw_primary_keys: ["id", "rev"]
    file:
      z_order_by: [id]
    file_aud:
      raw_primary_keys: ["id", "rev"]
    lead3p:
      clean_table_name: lead_3p
      z_order_by: [id]
    lead3p_aud:
      clean_table_name: lead_3p_aud
      raw_primary_keys: ["id", "rev"]
    revinfo:
      clean_table_name: rev_info
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, ds, 'load_end_date') }}"
cluster:
  type: databricks_12_2_min_memory_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}