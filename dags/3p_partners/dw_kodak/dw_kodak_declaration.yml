dag:
  name: dw_kodak
  schedule_start_date: 2020, 1, 1
  owner: Data Rede
  documentation:
    dag_purpose: "This DAG creates the model for QuintoAndar's Kodak photos inspections service."
workflow:
  type: query_delta
  layer: dw
  custom_schema: public
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: m5a.xlarge
    node_type_id: m5a.2xlarge
    num_workers: 3
    spark_version: 13.3.x-scala2.12
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
  databricks_conn_id: databricks_new