description: |
  HubSpot Owner objects represent users within the HubSpot platform who can own and manage CRM records.
  Owners are assigned to contacts, companies, deals, and tickets for accountability and workflow management.
columns:
  id_owner:
    lineage:
      - datalake_hubspot_test_raw.owner.id
    description: 'Unique identifier for the owner record in HubSpot.'
  id_user:
    lineage:
      - datalake_hubspot_test_raw.owner.user_id
    description: 'Internal user identifier in HubSpot system.'
  email:
    lineage:
      - datalake_hubspot_test_raw.owner.email
    description: 'Email address of the owner/user.'
  first_name:
    lineage:
      - datalake_hubspot_test_raw.owner.firstname
    description: 'First name of the owner/user.'
  last_name:
    lineage:
      - datalake_hubspot_test_raw.owner.lastname
    description: 'Last name of the owner/user.'
  teams:
    lineage:
      - datalake_hubspot_test_raw.owner.teams
    description: 'JSON array of team memberships for the owner.'
  is_archived:
    lineage:
      - datalake_hubspot_test_raw.owner.archived
    description: 'Boolean flag indicating whether the owner/user account has been deactivated.'
  ts_archived:
    lineage:
      - datalake_hubspot_test_raw.owner.archived_at
    description: 'Timestamp when the owner account was archived/deactivated. NULL for active owners.'
  ts_created:
    lineage:
      - datalake_hubspot_test_raw.owner.created_at
