---
database_name: datalake_hubspot_test_clean
table_name: communication
owner: vitor.musachio@quintoandar.com.br
domain: 3P Partners
description: |
  HubSpot Communication objects represent various forms of customer interactions including emails, SMS messages,
  social media interactions, and other communication channels tracked in the CRM.
columns:
  id_communication:
    lineage:
      - datalake_hubspot_test_raw.communication.id
    description: 'Unique identifier for the communication activity record in HubSpot.'
  properties:
    lineage:
      - datalake_hubspot_test_raw.communication.properties
    description: 'JSON object containing all communication properties including channel type, direction, content, and custom fields.'
  properties_with_history:
    lineage:
      - datalake_hubspot_test_raw.communication.properties_with_history
    description: 'JSON object containing historical values of communication properties with timestamps.'
  associations:
    lineage:
      - datalake_hubspot_test_raw.communication.associations
    description: 'JSON object containing associations to contacts, companies, deals, and tickets.'
  is_archived:
    lineage:
      - datalake_hubspot_test_raw.communication.archived
    description: 'Boolean flag indicating whether the communication record has been archived/deleted.'
  ts_archived:
    lineage:
      - datalake_hubspot_test_raw.communication.archived_at
    description: 'Timestamp when the communication record was archived. NULL for active communications.'
  ts_created:
    lineage:
      - datalake_hubspot_test_raw.communication.created_at
    description: 'Timestamp when the communication activity was logged in HubSpot.'
  ts_updated:
    lineage:
      - datalake_hubspot_test_raw.communication.updated_at
    description: 'Timestamp of the most recent update to any communication property. Part of the composite merge key with id_communication.'
  ts_load:
    lineage:
      - datalake_hubspot_test_raw.communication.ts_load
    description: 'Timestamp when the record was last loaded into the data lake.'
  year:
    lineage:
      - datalake_hubspot_test_raw.communication.updated_at
    description: 'Partition column: Year derived from the record update timestamp (updated_at).'
  month:
    lineage:
      - datalake_hubspot_test_raw.communication.updated_at
    description: 'Partition column: Month derived from the record update timestamp (updated_at).'
  day:
    lineage:
      - datalake_hubspot_test_raw.communication.updated_at
    description: 'Partition column: Day derived from the record update timestamp (updated_at).'
