---
database_name: datalake_hubspot_test_clean
table_name: ticket
owner: vitor.musachio@quintoandar.com.br
domain: 3P Partners
description: |
  HubSpot Ticket objects represent customer support cases and service requests. Tickets track issues from
  initiation to resolution, including priority levels, status updates, and resolution metrics.
columns:
  id_ticket:
    lineage:
      - datalake_hubspot_test_raw.ticket.id
    description: 'Unique identifier for the ticket record in HubSpot.'
  properties:
    lineage:
      - datalake_hubspot_test_raw.ticket.properties
    description: 'JSON object containing all ticket properties including subject, status, priority, category, and custom fields.'
  properties_with_history:
    lineage:
      - datalake_hubspot_test_raw.ticket.properties_with_history
    description: 'JSON object containing historical values of ticket properties with timestamps. Tracks progression through support stages.'
  associations:
    lineage:
      - datalake_hubspot_test_raw.ticket.associations
    description: 'JSON object containing associations to contacts, companies, deals, and support activities.'
  is_archived:
    lineage:
      - datalake_hubspot_test_raw.ticket.archived
    description: 'Boolean flag indicating whether the ticket record has been archived/deleted.'
  ts_archived:
    lineage:
      - datalake_hubspot_test_raw.ticket.archived_at
    description: 'Timestamp when the ticket record was archived. NULL for active tickets.'
  ts_created:
    lineage:
      - datalake_hubspot_test_raw.ticket.created_at
    description: 'Timestamp when the ticket was first created in HubSpot.'
  ts_updated:
    lineage:
      - datalake_hubspot_test_raw.ticket.updated_at
    description: 'Timestamp of the most recent update to any ticket property. Part of the composite merge key with id_ticket.'
  ts_load:
    lineage:
      - datalake_hubspot_test_raw.ticket.ts_load
    description: 'Timestamp when the record was last loaded into the data lake.'
  year:
    lineage:
      - datalake_hubspot_test_raw.ticket.updated_at
    description: 'Partition column: Year derived from the record update timestamp (updated_at).'
  month:
    lineage:
      - datalake_hubspot_test_raw.ticket.updated_at
    description: 'Partition column: Month derived from the record update timestamp (updated_at).'
  day:
    lineage:
      - datalake_hubspot_test_raw.ticket.updated_at
    description: 'Partition column: Day derived from the record update timestamp (updated_at).'
