---
database_name: datalake_hubspot_test_clean
table_name: company
owner: vitor.musachio@quintoandar.com.br
domain: 3P Partners
description: |
  HubSpot Company objects represent businesses and organizations that contacts are associated with.
  Companies store organizational information like industry, revenue, employees, and relationship history.
  This table contains cleaned and standardized company data from the HubSpot CRM for analytics and reporting.
columns:
  id_company:
    lineage:
      - datalake_hubspot_test_raw.company.id
    description: 'Unique identifier for the company record in HubSpot. Used for associating companies with contacts, deals, and other CRM objects.'
  properties:
    lineage:
      - datalake_hubspot_test_raw.company.properties
    description: 'JSON object containing all company properties including name, industry, revenue, website, address, and custom fields. Contains current values for all company attributes.'
  properties_with_history:
    lineage:
      - datalake_hubspot_test_raw.company.properties_with_history
    description: 'JSON object containing historical values of company properties with timestamps. Enables tracking changes over time for fields like industry, revenue, lifecycle stage, and custom properties.'
  associations:
    lineage:
      - datalake_hubspot_test_raw.company.associations
    description: 'JSON object containing associations to other HubSpot objects like contacts, deals, tickets, and custom objects. Includes association types and relationship metadata.'
  is_archived:
    lineage:
      - datalake_hubspot_test_raw.company.archived
    description: 'Boolean flag indicating whether the company record has been archived/deleted. Archived companies are no longer active but preserved for historical data integrity.'
  has_3p_access_control:
    description: >
      Boolean flag indicating that this event is subject to 3P Partners access control policies.
      Used by data governance tools and access control systems to apply 3P-specific security policies.
  ts_archived:
    lineage:
      - datalake_hubspot_test_raw.company.archived_at
    description: 'Timestamp when the company record was archived. NULL for active companies. Used for data retention and cleanup processes.'
  ts_created:
    lineage:
      - datalake_hubspot_test_raw.company.created_at
    description: 'Timestamp when the company record was first created in HubSpot. Critical for customer acquisition analysis and cohort studies.'
  ts_updated:
    lineage:
      - datalake_hubspot_test_raw.company.updated_at
    description: 'Timestamp of the most recent update to any company property. Part of the composite merge key with id_company.'
  ts_load:
    lineage:
      - datalake_hubspot_test_raw.company.ts_load
    description: 'Timestamp when the record was last loaded into the data lake.'
  year:
    lineage:
      - datalake_hubspot_test_raw.company.updated_at
    description: 'Partition column: Year derived from the record update timestamp (updated_at).'
  month:
    lineage:
      - datalake_hubspot_test_raw.company.updated_at
    description: 'Partition column: Month derived from the record update timestamp (updated_at).'
  day:
    lineage:
      - datalake_hubspot_test_raw.company.updated_at
    description: 'Partition column: Day derived from the record update timestamp (updated_at).'
