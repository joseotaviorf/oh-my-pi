---
database_name: datalake_hubspot_test_clean
table_name: meeting
owner: vitor.musachio@quintoandar.com.br
domain: 3P Partners
description: |
  HubSpot Meeting objects represent scheduled and completed meeting activities tracked in the CRM. Meetings
  include details like agenda, attendees, outcomes, notes, and follow-up actions.
columns:
  id_meeting:
    lineage:
      - datalake_hubspot_test_raw.meeting.id
    description: 'Unique identifier for the meeting activity record in HubSpot.'
  properties:
    lineage:
      - datalake_hubspot_test_raw.meeting.properties
    description: 'JSON object containing all meeting properties including subject, start/end times, attendees, and custom fields.'
  properties_with_history:
    lineage:
      - datalake_hubspot_test_raw.meeting.properties_with_history
    description: 'JSON object containing historical values of meeting properties with timestamps.'
  associations:
    lineage:
      - datalake_hubspot_test_raw.meeting.associations
    description: 'JSON object containing associations to contacts, companies, deals, and tickets.'
  is_archived:
    lineage:
      - datalake_hubspot_test_raw.meeting.archived
    description: 'Boolean flag indicating whether the meeting record has been archived/deleted.'
  ts_archived:
    lineage:
      - datalake_hubspot_test_raw.meeting.archived_at
    description: 'Timestamp when the meeting record was archived. NULL for active meetings.'
  ts_created:
    lineage:
      - datalake_hubspot_test_raw.meeting.created_at
    description: 'Timestamp when the meeting activity was scheduled/logged in HubSpot.'
  ts_updated:
    lineage:
      - datalake_hubspot_test_raw.meeting.updated_at
    description: 'Timestamp of the most recent update to any meeting property. Part of the composite merge key with id_meeting.'
  ts_load:
    lineage:
      - datalake_hubspot_test_raw.meeting.ts_load
    description: 'Timestamp when the record was last loaded into the data lake.'
  year:
    lineage:
      - datalake_hubspot_test_raw.meeting.updated_at
    description: 'Partition column: Year derived from the record update timestamp (updated_at).'
  month:
    lineage:
      - datalake_hubspot_test_raw.meeting.updated_at
    description: 'Partition column: Month derived from the record update timestamp (updated_at).'
  day:
    lineage:
      - datalake_hubspot_test_raw.meeting.updated_at
    description: 'Partition column: Day derived from the record update timestamp (updated_at).'
