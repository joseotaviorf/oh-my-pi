---
database_name: datalake_hubspot_test_clean
table_name: contact
owner: vitor.musachio@quintoandar.com.br
domain: 3P Partners
description: |
  HubSpot Contact objects represent individuals with whom the business interacts. Contacts include personal
  information, communication history, lifecycle stages, and behavioral data. This is the primary object for
  customer relationship management and contains comprehensive contact profiles for sales, marketing, and service activities.
columns:
  id_contact:
    lineage:
      - datalake_hubspot_test_raw.contact.id
    description: 'Unique identifier for the contact record in HubSpot. Primary key used for associating contacts with companies, deals, tickets, and activities.'
  properties:
    lineage:
      - datalake_hubspot_test_raw.contact.properties
    description: 'JSON object containing all contact properties including name, email, phone, job title, lifecycle stage, lead status, and custom fields.'
  properties_with_history:
    lineage:
      - datalake_hubspot_test_raw.contact.properties_with_history
    description: 'JSON object containing historical values of contact properties with timestamps. Tracks changes over time for fields like lifecycle stage, lead score, and custom properties.'
  associations:
    lineage:
      - datalake_hubspot_test_raw.contact.associations
    description: 'JSON object containing associations to other HubSpot objects like companies, deals, tickets, and activities.'
  is_archived:
    lineage:
      - datalake_hubspot_test_raw.contact.archived
    description: 'Boolean flag indicating whether the contact record has been archived/deleted.'
  ts_archived:
    lineage:
      - datalake_hubspot_test_raw.contact.archived_at
    description: 'Timestamp when the contact record was archived. NULL for active contacts.'
  ts_created:
    lineage:
      - datalake_hubspot_test_raw.contact.created_at
    description: 'Timestamp when the contact was first created in HubSpot.'
  ts_updated:
    lineage:
      - datalake_hubspot_test_raw.contact.updated_at
    description: 'Timestamp of the most recent update to any contact property. Part of the composite merge key with id_contact.'
  ts_load:
    lineage:
      - datalake_hubspot_test_raw.contact.ts_load
    description: 'Timestamp when the record was last loaded into the data lake.'
  year:
    lineage:
      - datalake_hubspot_test_raw.contact.updated_at
    description: 'Partition column: Year derived from the record update timestamp (updated_at).'
  month:
    lineage:
      - datalake_hubspot_test_raw.contact.updated_at
    description: 'Partition column: Month derived from the record update timestamp (updated_at).'
  day:
    lineage:
      - datalake_hubspot_test_raw.contact.updated_at
    description: 'Partition column: Day derived from the record update timestamp (updated_at).'
