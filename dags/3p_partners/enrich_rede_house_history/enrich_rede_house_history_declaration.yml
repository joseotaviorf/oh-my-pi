dag:
  name: enrich_rede_house_history
  schedule_start_date: 2020, 8, 29
  owner: Data 3P Partners
  documentation:
    dag_purpose: |
      This DAG creates the enriched table that tells us the history of how a house was or was not in Rede.
      This DAG is triggered by Mediator and loads the table via full load.
workflow:
  type: query_delta
  layer: enrich
  tables_customization:
    rede_house_history:
      table_privileges:
        3p-readers:
          - SELECT
        data-engineers:
          - ALL PRIVILEGES
cluster:
  type: databricks_16_4_med_general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: USER_ISOLATION
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}