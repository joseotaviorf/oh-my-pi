dag:
  name: kodak
  schedule_start_date: 2020, 3, 19
  schedule_interval: 0 0 * * *
  owner: Data Rede
  documentation:
    dag_purpose: This flow is intended to retrieve data related to images and videos used on our platforms.
workflow:
  type: cdc
  layer: raw
  database_type: postgres
  custom_schema: kodak
  source_database: kodak
  source_schema: public
  tables_customization:
    image_inspection: {}
    image_analysis: {}
    image_inspection_group: {}
    image_inspection_group_result: {}
    group_analysis: {}
    photo: {}
    photo_invalid_source: {}
    photosphere:
      clean_table_name: photo_sphere
    userrevisionentity:
      clean_table_name: user_revision_entity
    video: {}
    video_aud:
      raw_primary_keys: ["id", "rev"]
    watermark_removal: {}
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
cluster:
  type: databricks_13_3_med_2xlarge_general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}