---
database_name: datalake_kodak_clean
table_name: photo_invalid_source
description: |
  Tracks failed photo processing attempts in Kodak's media ingestion pipeline. Each row represents a photo URL that could not be successfully processed, downloaded, or validated during the media import workflow. This table is critical for monitoring data quality issues, identifying problematic sources, and troubleshooting integration problems with partner systems and external photo sources.
domain: 3P Partners
owner: vitor.musachio@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_kodak_raw.photo_invalid_source.id
    description: 'Unique identifier for each failed photo processing attempt. Primary key used for tracking and analyzing processing failures.'
  id_external_domain:
    lineage:
      - datalake_kodak_raw.photo_invalid_source.externaldomainid
    description: 'External identifier from the source system where the photo processing failure occurred. Links to the original record that attempted to reference this photo.'
  external_domain:
    lineage:
      - datalake_kodak_raw.photo_invalid_source.externaldomain
    description: 'Domain classification indicating which external system the failed photo belongs to.'
    categories:
      HOUSE: 'Failed photo from a QuintoAndar house listing'
      BUILDING_VENTURE: 'Failed photo from a building or real estate venture'
      LEAD3P: 'Failed photo from a third-party partner lead'
      ATLAS: 'Failed photo from Atlas system (internal tooling)'
  source_url:
    lineage:
      - datalake_kodak_raw.photo_invalid_source.source_url
    description: 'Original URL of the photo that failed to process. Used for debugging integration issues and identifying problematic source endpoints or CDNs.'
  reason:
    lineage:
      - datalake_kodak_raw.photo_invalid_source.reason
    description: 'Specific reason code explaining why the photo processing failed.'
    categories:
      INVALID_URL: 'URL format is malformed or invalid'
      EMPTY_BODY: 'HTTP response returned empty content'
      IMAGE_NOT_FOUND: 'URL returned 404 or image file does not exist'
      READER_NOT_FOUND: 'No suitable image reader/decoder available for file format'
      EXTENSION_NOT_SUPPORTED: 'File extension or format not supported by Kodak'
      EMPTY_IMAGE: 'Image file exists but contains no visual content'
      IMPROPER_ENCODING: 'Image file corrupted or improperly encoded'
  ts_created:
    lineage:
      - datalake_kodak_raw.photo_invalid_source.created_at
    description: 'Timestamp when the photo processing failure was recorded. Used for temporal analysis of integration issues and failure patterns.'
  year:
    lineage:
      - datalake_kodak_raw.photo_invalid_source.year
    description: 'Year partition key extracted from the creation timestamp for optimized data organization and querying.'
  month:
    lineage:
      - datalake_kodak_raw.photo_invalid_source.month
    description: 'Month partition key extracted from the creation timestamp for optimized data organization and querying.'
  day:
    lineage:
      - datalake_kodak_raw.photo_invalid_source.day
    description: 'Day partition key extracted from the creation timestamp for optimized data organization and querying.'