dag:
  name: dw_house_amenities
  schedule_start_date: 2020,8,29
  owner: Data Rede
  documentation:
    dag_purpose: |
      This DAG loads data about amenities, such as pool or grill area, into the DW.
workflow:
  type: query_delta
  layer: dw
  custom_schema: house
  default_extraction_type: full
  inner_dependencies:
    fact_house_information_filling:
    - dim_house_amenities_version
    - dim_house_information
cluster:
  type: databricks_12_2_med_general_cluster
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
