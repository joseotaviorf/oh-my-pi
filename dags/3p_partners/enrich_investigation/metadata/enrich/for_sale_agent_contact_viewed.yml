---
database_name: datalake_investigation
table_name: for_sale_agent_contact_viewed
description: Tracks agent contact views for for-sale properties, capturing when agents successfully view property owner contact information through the agents app. This table aggregates contact view events per agent-house combination.
domain: 3P Partners
owner: vitor.musachio@quintoandar.com.br
columns:
  id: 
    lineage:
      - datalake_ebdb_clean.house.id
      - datalake_ebdb_clean.agent_data.id_agent
    description: Composite unique identifier created by concatenating house ID and agent ID for each agent-house contact view relationship
  id_house: 
    lineage:
      - datalake_ebdb_clean.house.id
    description: Unique identifier of the for-sale property whose owner contact information was viewed by the agent
  id_agent: 
    lineage:
      - datalake_ebdb_user.agent_data.id_agent
    description: Unique identifier of the agent who viewed the property owner contact information
  id_user_agent: 
    lineage:
      - datalake_amplitude_agents_app.agents_native_events.id_user
    description: User ID associated with the agent in the agents app for tracking purposes
  id_owner: 
    lineage:
      - datalake_ebdb_clean.user.id
    description: Unique identifier of the property owner whose contact information was viewed
  agent_type: 
    lineage:
      - datalake_ebdb_clean.agent_data_types.types
    description: Classification type of the agent (e.g., different agent categories or specializations)
  house_city: 
    lineage:
      - datalake_ebdb_clean.house.city
    description: City where the viewed property is located
  pp_contact_views:
    lineage:
      - datalake_amplitude_agents_app.agents_native_events.event_properties
    description: Total count of successful owner contact page views by this agent for this specific property
  is_agent_active:
    lineage:
      - datalake_ebdb_user.agent_data.is_active
    description: Boolean flag indicating whether the agent is currently active in the system
  is_3p_agent:
    lineage:
      - datalake_ebdb_clean.agent_data.agent_type
    description: Boolean flag indicating whether the agent belongs to the 3p partners
  is_rent_agent:
    lineage:
      - datalake_ebdb_user.agent_data.is_rent_agent
    description: Boolean flag indicating whether the agent handles rental properties
  is_sale_agent:
    lineage:
      - datalake_ebdb_user.agent_data.is_sale_agent
    description: Boolean flag indicating whether the agent handles for-sale properties
  ts_first_pp_contact_view:
    lineage:
      - datalake_amplitude_agents_app.agents_native_events.ts_event
    description: Timestamp of the first successful owner contact page view by this agent for this property