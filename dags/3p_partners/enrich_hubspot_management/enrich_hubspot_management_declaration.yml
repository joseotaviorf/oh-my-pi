dag:
  name: enrich_hubspot_management
  schedule_start_date: 2021, 8, 24
  owner: Data Rede
  documentation:
    dag_purpose: Creates enriched tables for `hubspot`. Due to limitation of Job Cluster, the enrich_hubspot was separated in two DAGs (enrich_hubspot_management and enrich_hubspot_crm).
workflow:
  type: query_delta
  layer: enrich
  custom_schema: hubspot
  inner_dependencies:
    call:
    - call_history
    communication:
    - communication_history
    email:
    - email_history
    meeting:
    - meeting_history
    note:
    - note_history
    owner:
    - owner_history
    task:
    - task_history
  tables_customization:
    call_history:
      extraction_type: incremental
      partitions:
      - year
      - month
      - day
    communication_history:
      extraction_type: incremental
      partitions:
      - year
      - month
      - day
    email_history:
      extraction_type: incremental
      partitions:
      - year
      - month
      - day
    meeting_history:
      extraction_type: incremental
      partitions:
      - year
      - month
      - day
    note_history:
      extraction_type: incremental
      partitions:
      - year
      - month
      - day
    owner_history:
      extraction_type: incremental
      partitions:
      - year
      - month
      - day
    task_history:
      extraction_type: incremental
      partitions:
      - year
      - month
      - day
cluster:
  type: databricks_12_2_med_memory_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}