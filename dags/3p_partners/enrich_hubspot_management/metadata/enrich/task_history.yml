---
database_name: datalake_hubspot
table_name: task_history
description: This table has one row per day that has a modification or creation of a task in HubSpot. If you want one row per task, use datalake_hubspot.task. 
domain: Rede
owner: vitor.musachio@quintoandar.com.br
columns:
  id_task:
    lineage:
      - datalake_hubspot_clean.task.id_task
    description: Id of the object. Not a primary key, since there is a new row for each update (limited to the most recent per day).
  id_hubspot_owner:
    lineage:
      - datalake_hubspot_clean.task.properties
    description: The owner ID of the user assigned to the task. Comes from the internal field hubspot_owner_id.
  ids_associated_tickets:
    lineage:
      - datalake_hubspot_clean.task.associations
    description: List of ids of associated tickets.
  ids_associated_contacts:
    lineage:
      - datalake_hubspot_clean.task.associations
    description: List of ids of associated contacts.
  ids_associated_companies:
    lineage:
      - datalake_hubspot_clean.task.associations
    description: List of ids of associated companies.
  ids_associated_deals:
    lineage:
      - datalake_hubspot_clean.task.associations
    description: List of ids of associated deals.
  task_body:
    lineage:
      - datalake_hubspot_clean.task.properties
    description: The task notes. Comes from the internal field hs_task_body.
  task_subject:
    lineage:
      - datalake_hubspot_clean.task.properties
    description: The title of the task. Comes from the internal field hs_task_subject.
  task_status:
    lineage:
      - datalake_hubspot_clean.task.properties
    description: The status of the task, either COMPLETED or NOT_STARTED. Comes from the internal field hs_task_status.
  task_type:
    lineage:
      - datalake_hubspot_clean.task.properties
    description: The type of task. Values include EMAIL, CALL, or TODO. Comes from the internal field hs_task_type.
  task_priority:
    lineage:
      - datalake_hubspot_clean.task.properties
    description: The priority of the task. Values include LOW, MEDIUM, or HIGH. Comes from the internal field hs_task_priority.
  ts_task_due_date:
    lineage:
      - datalake_hubspot_clean.task.properties
    description: This field marks the task''s due date. Comes from the internal field hs_timestamp.
  ts_created:
    lineage:
      - datalake_hubspot_clean.task.ts_created
    description: Timestamp of when the object was created.
  ts_updated:
    lineage:
      - datalake_hubspot_clean.task.ts_updated
    description: Timestamp of when the object was updated.
  year:
    lineage:
      - datalake_hubspot_clean.task.year
    description: Year when the object was updated.
  month:
    lineage:
      - datalake_hubspot_clean.task.month
    description: Month when the object was updated.
  day:
    lineage:
      - datalake_hubspot_clean.task.day
    description: Day when the object was updated.