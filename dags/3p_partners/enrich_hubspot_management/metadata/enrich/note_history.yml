---
database_name: datalake_hubspot
table_name: note_history
description: This table has one row per day that has a modification or creation of a note in HubSpot. If you want one row per note, use datalake_hubspot.note. 
domain: Rede
owner: vitor.musachio@quintoandar.com.br
columns:
  id_note:
    lineage:
      - datalake_hubspot_clean.note.id_note
    description: Id of the object. Not a primary key, since there is a new row for each update (limited to the most recent per day).
  id_hubspot_owner:
    lineage:
      - datalake_hubspot_clean.note.properties
    description: The ID of the owner associated with the note. This field determines the user listed as the note creator on the record timeline in HubSpot. Comes from the internal field hubspot_owner_id.
  ids_attachments:
    lineage:
      - datalake_hubspot_clean.note.properties
    description: The IDs of the note''s attachments. Comes from the internal field hs_attachment_ids.
  ids_associated_tickets:
    lineage:
      - datalake_hubspot_clean.note.associations
    description: List of ids of associated tickets.
  ids_associated_contacts:
    lineage:
      - datalake_hubspot_clean.note.associations
    description: List of ids of associated contacts.
  ids_associated_companies:
    lineage:
      - datalake_hubspot_clean.note.associations
    description: List of ids of associated companies.
  ids_associated_deals:
    lineage:
      - datalake_hubspot_clean.note.associations
    description: List of ids of associated deals.
  note_body:
    lineage:
      - datalake_hubspot_clean.note.properties
    description: The note''s text content. Comes from the internal field hs_note_body.
  ts_note:
    lineage:
      - datalake_hubspot_clean.note.properties
    description: This field marks the note''s time of creation and determines where the note sits on the record timeline. Comes from the internal field hs_timestamp.
  ts_created:
    lineage:
      - datalake_hubspot_clean.note.ts_created
    description: Timestamp of when the object was created.
  ts_updated:
    lineage:
      - datalake_hubspot_clean.note.ts_updated
    description: Timestamp of when the object was updated.
  year:
    lineage:
      - datalake_hubspot_clean.note.year
    description: Year when the object was updated.
  month:
    lineage:
      - datalake_hubspot_clean.note.month
    description: Month when the object was updated.
  day:
    lineage:
      - datalake_hubspot_clean.note.day
    description: Day when the object was updated.