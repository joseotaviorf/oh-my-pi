---
database_name: datalake_hubspot
table_name: owner
description: Table showing the user and team information of the owners of tickets created in Hubspot. Each row is an owner.
domain: Rede
owner: vitor.musachio@quintoandar.com.br
columns:
  id_owner:
    lineage:
      - datalake_hubspot.owner_history.id_owner
    description: ID of the owner.
  id_current_team:
    lineage:
      - datalake_hubspot.owner_history.teams
    description: ID of the current Hubspot team the owner belongs to. Foreign key to the team Hubspot table.
  id_user:
    lineage:
      - datalake_hubspot.owner_history.id_user
    description: ID of the user in Hubspot who belongs to the owner. Foreign key to the user Hubspot table.
  uuid_person:
    lineage:
      - datalake_hubspot.owner_history.uuid_person
    description: UUID of the person in QuintoAndar's Person service.
  current_team_name:
    lineage:
      - datalake_hubspot.owner_history.teams
    description: Name of the current Hubspot team the owner belongs to.
  email:
    lineage:
      - datalake_hubspot.owner_history.email
    description: Email of the owner.
  owner_user:
    lineage:
      - datalake_hubspot.owner_history.email
    description: User of the owner, based on the owner's email.
  teams:
    lineage:
      - datalake_hubspot.owner_history.teams
    description: A column in struct format showing the owner's relationship with the teams he is part of.
  is_archived:
    lineage:
      - datalake_hubspot.owner_history.is_archived
    description: Whether the owner is archived.
  ts_created:
    lineage:
      - datalake_hubspot.owner_history.ts_created
    description: Timestamp of when the owner was created.
  ts_updated:
    lineage:
      - datalake_hubspot.owner_history.ts_updated
    description: Timestamp of when the owner was last updated.
  year:
    lineage:
      - datalake_hubspot.owner_history.year
    description: Year of the update.
  month:
    lineage:
      - datalake_hubspot.owner_history.month
    description: Month of the update.
  day:
    lineage:
      - datalake_hubspot.owner_history.day
    description: Day of the update.