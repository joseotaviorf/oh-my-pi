---
database_name: datalake_edwiges
table_name: house_standardized_addresses
owner: vitor.musachio@quintoandar.com.br
domain: 3P Partners
description: |
  Standardized addresses and complement analysis for houses using the Edwiges library.
  This table processes data from datalake_house_clean.house to provide both raw and processed
  address information, enabling better address matching, geocoding, and property analysis.
  
  **Key Features:**
  - Raw and standardized address fields for comparison and flexibility
  - Zipcode formatting and validation (Brazilian CEP format)
  - House number extraction and standardization
  - Geographic coordinates (latitude/longitude) for mapping and analysis
  
  **Schema Design:**
  - Raw fields preserve original data for reference
  - Processed fields provide cleaned, standardized values
  - Type classification uses Edwiges intelligence combined with source data
  - Version tracking ensures reproducibility and debugging capability

columns:
  id_house:
    description: "Unique identifier of the house from EBDB (long)"
    lineage:
      - datalake_ebdb_clean.house.id
  id_region:
    description: "Region identifier (long)"
    lineage:
      - datalake_ebdb_clean.house.id_region
  city_name:
    description: "City name from source data (string)"
    lineage:
      - datalake_ebdb_clean.house.city
  address:
    description: "Standardized address string processed by Edwiges. Lowercase, standardized abbreviations, titles removed, punctuation normalized (string)"
  address_raw:
    description: "Original address string from source data, preserved for reference (string)"
    lineage:
      - datalake_ebdb_clean.house.address
  zipcode:
    description: "Standardized Brazilian zipcode in XXXXX-XXX format, validated and formatted by Edwiges (string)"
  zipcode_raw:
    description: "Original zip code from source data, preserved for reference (string)"
    lineage:
      - datalake_ebdb_clean.house.zipcode
  number:
    description: "Standardized house number extracted and cleaned (string)"
  number_raw:
    description: "Original house number from source data, preserved for reference (string)"
    lineage:
      - datalake_ebdb_clean.house.number
  neighborhood:
    description: "Neighborhood from source data (string)"
    lineage:
      - datalake_ebdb_clean.house.neighborhood
  complement_raw:
    description: "Original complement string from source data (apartment/unit information), preserved for reference (string)"
    lineage:
      - datalake_ebdb_clean.house.complement
  total_area:
    description: "Total area of the house in square meters (integer)"
    lineage:
      - datalake_ebdb_clean.house.total_area
  lat:
    description: "Latitude coordinate of the house location (decimal)"
    lineage:
      - datalake_ebdb_clean.house.lat
  lng:
    description: "Longitude coordinate of the house location (decimal)"
    lineage:
      - datalake_ebdb_clean.house.lng
  edwiges_version:
    description: "Version of the Edwiges library used to process this record during execution"
  ts_created:
    description: "Creation timestamp from source data"
    lineage:
      - datalake_ebdb_clean.house.dt_creation
  ts_updated:
    description: "Last update timestamp from source data"
    lineage:
      - datalake_ebdb_clean.house.ts_updated
  ts_load:
    description: "Timestamp when the record was processed by this DAG" 