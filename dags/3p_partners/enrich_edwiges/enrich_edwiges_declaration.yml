dag:
  name: enrich_edwiges
  schedule_start_date: 2024, 1, 15
  owner: Data 3P Partners
  documentation:
    dag_purpose: "This DAG creates standardized addresses and complement analysis for houses using the Edwiges library. It processes data from datalake_house_clean.house to extract structured information from address fields and complements, enabling better address matching, geocoding, and property analysis.\n\nFeatures:\n- Address standardization (street names, abbreviations, formatting)\n- Zipcode formatting and validation\n- Complement interpretation (apartment numbers, blocks, towers)\n- Property type classification (house vs apartment)\n- Data quality validation and error handling\n- Address matching and duplicate detection between properties"
workflow:
  type: query_delta
  layer: enrich
  spark_job_arguments:
  - '{environment}'
  - '{bucket}'
  - '{schema}'
  - '{dag_name}'
  - '{table_name}'
  tables_customization:
    house_standardized_addresses:
      load_spark_job: load_house_standardized_addresses
cluster:
  type: databricks_12_2_med_general_cluster
  custom_libraries:
  - whl: "{artifacts_bucket}/edwiges/edwiges-latest-py3-none-any.whl"
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}