---
database_name: datalake_brokers_supply_processor
table_name: lead_3p
owner: gustavo.miller@quintoandar.com.br
domain: Rede
description: Each row in this table represents a lead3p, a house sent to us by member real estate agencies in Rede.
columns:
  id:
    lineage:
      - datalake_brokers_supply_processor_clean.lead_3p.id
    description: 'Unique identifier of the lead.'
  id_sale_partner:
    lineage:
      - datalake_brokers_supply_processor.business_context_detail.id_partner
    description: 'Unique identifier of the partner that sent the lead in the context of ForSale.'
  id_rent_partner:
    lineage:
      - datalake_brokers_supply_processor.business_context_detail.id_partner
    description: 'Unique identifier of the partner that sent the lead in the context of ForRent.'
  id_sale_file:
    lineage:
      - datalake_brokers_supply_processor.business_context_detail.id_file
