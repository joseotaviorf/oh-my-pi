  sale_status:
    lineage:
      - datalake_brokers_supply_processor.business_context_detail.status
    description: 'Status of the lead, in the context of ForSale.'
    categories:
      REGISTERED: 'Registered in Main for publication'
      SUSPENDED: 'Lead suspended'
      WAITING: 'Lead eligible and waiting for owner information'
      PROCESSING: 'Lead in image processing'
      QUEUE: 'Lead awaiting in the duplicate queue'
      NOT_CONVERTED: 'Lead not converted due to ineligibility, enrichment or discard'
  rent_status:
    lineage:
      - datalake_brokers_supply_processor.business_context_detail.status
    description: 'Status of the lead, in the context of ForSale.'
    categories:
      REGISTERED: 'Registered in Main for publication'
      SUSPENDED: 'Lead suspended'
      WAITING: 'Lead eligible and waiting for owner information'
      PROCESSING: 'Lead in image processing'
      QUEUE: 'Lead awaiting in the duplicate queue'
      NOT_CONVERTED: 'Lead not converted due to ineligibility, enrichment or discard'
  sale_recurrency_type:
    description: 'Classifies whether the sale lead came from the first batch, first month, is recurrent, or is complementary (captured before first batch).'
    categories:
      FIRST_BATCH: 'Lead sent along with the first file in the ForSale context'
      FIRST_MONTH_BATCH: 'Lead was sent up to 30 days after the first ForSale batch'
      RECURRENT: 'Lead was captured and sent AFTER the first 30 days of the ForSale batch'
      COMPLEMENTARY: 'Lead was captured BEFORE the first batch, but sent AFTER the first 30 days of the ForSale batch'
      'N/A': 'Not a sale lead'
  rent_recurrency_type:
    description: 'Classifies whether the rent lead came from the first batch, first month, is recurrent, or is complementary (captured before first batch).'
    categories:
      FIRST_BATCH: 'Lead sent along with the first file in the ForRent context'
      FIRST_MONTH_BATCH: 'Lead was sent up to 30 days after the first ForRent batch'
      RECURRENT: 'Lead was captured and sent AFTER the first 30 days of the ForRent batch'
      COMPLEMENTARY: 'Lead was captured BEFORE the first batch, but sent AFTER the first 30 days of the ForRent batch'
      'N/A': 'Not a rent lead'
