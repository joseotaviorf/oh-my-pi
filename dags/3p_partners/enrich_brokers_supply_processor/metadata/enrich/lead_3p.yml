    description: 'House condo price.'
  version_global:
    description: 'Sometimes, the same house might be sent multiple times. Those submissions become different leads, but they share the same lead hash.
      This column is a counter that indicates how many times the same lead hash has been sent until the current lead, which serves as its version.'
  sale_version_global:
    description: 'Sometimes, the same house might be sent multiple times. Those submissions become different leads, but they share the same lead hash.
      This column is a counter that indicates how many times the same lead hash has been sent in the Sale context until the current lead, which serves as its version.'
  rent_version_global:
    description: 'Sometimes, the same house might be sent multiple times. Those submissions become different leads, but they share the same lead hash.
      This column is a counter that indicates how many times the same lead hash has been sent in the Rent context until the current lead, which serves as its version.'
  version_by_company:
    description: 'Sometimes, the same house might be sent multiple times. Those submissions become different leads, but they share the same lead hash.
      This column is a counter that indicates how many times the same lead hash has been sent by this particular company until the current lead, which serves as its version.
      It is not equal to version_global, as the same lead hash might be sent by different companies.'
  sale_version_by_company:
    description: 'Sometimes, the same house might be sent multiple times. Those submissions become different leads, but they share the same lead hash.
      This column is a counter that indicates how many times the same lead hash has been sent in the Sale context by this particular company until the current lead, which serves as its version.
      It is not equal to sale_version_global, as the same lead hash might be sent by different companies.'
  rent_version_by_company:
    description: 'Sometimes, the same house might be sent multiple times. Those submissions become different leads, but they share the same lead hash.
      This column is a counter that indicates how many times the same lead hash has been sent in the Rent context by this particular company until the current lead, which serves as its version.
      It is not equal to rent_version_global, as the same lead hash might be sent by different companies.'
  is_for_sale:
    description: 'True if the lead has been sent in the context of ForSale. It is not exclusive with is_for_rent, as both can be true.'
  is_for_rent:
    description: 'True if the lead has been sent in the context of ForRent. It is not exclusive with is_for_sale, as both can be true.'
