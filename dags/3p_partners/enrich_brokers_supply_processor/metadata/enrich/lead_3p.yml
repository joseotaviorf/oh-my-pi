  id_lead_first_version_global:
    lineage:
      - datalake_brokers_supply_processor_clean.lead_3p.id
    description: 'Sometimes, the same house might be sent multiple times. Those submissions become different leads, but they share the same lead hash.
      This column identifies the ID of the first lead that contains this lead hash.'
  id_lead_first_version_by_company:
    lineage:
      - datalake_brokers_supply_processor_clean.lead_3p.id
    description: 'Sometimes, the same house might be sent multiple times. Those submissions become different leads, but they share the same lead hash.
