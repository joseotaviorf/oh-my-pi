dag:
  name: enrich_business_model
  schedule_start_date: 2020, 1, 1
  owner: Data 3P Partners
  documentation:
    dag_purpose: Creates tables for the context `enrich_business_model`, consolidating business model information and 3P access control indicators.
workflow:
  type: query_delta
  layer: enrich
  custom_schema: visit
  tables_customization:
    visit_business_model:
      row_filter_column_key: has_3p_access_control
      row_filter: has_3p_access
cluster:
  type: databricks_16_4_min_memory_cluster
  databricks_conn_id: databricks_new_env
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: USER_ISOLATION
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}