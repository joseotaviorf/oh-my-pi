dag:
  name: enrich_hubspot_events
  schedule_start_date: 2020, 1, 1
  owner: Data 3P Partners
  documentation:
    dag_purpose: DAG created to load the tables consolidates all HubSpot events that will support the `fact_company_events` and `dim_company_events` in DW Company, consolidating all the events observed in Hubspot.
workflow:
  type: query_delta
  layer: enrich
  custom_schema: hubspot
  tables_customization:
    cluster_updates:
      default_table_privileges:
        3p-readers:
          - SELECT
        data-engineers:
          - ALL PRIVILEGES
    company_events:
      default_table_privileges:
        3p-readers:
          - SELECT
        data-engineers:
          - ALL PRIVILEGES
    membership_updates:
      default_table_privileges:
        3p-readers:
          - SELECT
        data-engineers:
          - ALL PRIVILEGES
    owner_updates:
      default_table_privileges:
        3p-readers:
          - SELECT
        data-engineers:
          - ALL PRIVILEGES
  inner_dependencies:
    company_events:
      - cluster_updates
      - membership_updates
      - owner_updates
cluster:
  type: databricks_16_4_min_memory_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}