alert_channel: "#alerts-de-airflow-dags"
table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error
column_level_validations:
  sk_lead_3p_reason:
    is_complete:
      severity_level: Error
    is_unique:
      severity_level: Error
  reason:
    is_complete:
      severity_level: Error
    is_unique:
      severity_level: Error
  reason_type:
    is_complete:
      severity_level: Error
    is_contained_in:
      values:
        - INELIGIBLE_REASON
        - DISCARD_REASON
        - ENRICHMENT_REASON
