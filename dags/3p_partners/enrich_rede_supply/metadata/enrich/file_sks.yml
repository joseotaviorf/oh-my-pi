---
database_name: datalake_rede_supply
table_name: file_sks
description: 'Generates surrogate keys for files from Supply Processor.'
owner: vitor.musachio@quintoandar.com.br
domain: 3P Partners
columns:
  sk_file:
    description: 'Surrogate key for the file, generated incrementally.'
  id_file:
    lineage:
      - datalake_brokers_supply_processor.file.id
    description: Natural key of the file, which comes from Supply Processor.
  has_3p_access_control:
    lineage:
      - datalake_brokers_supply_processor.file.has_3p_access_control
    description: >
      Boolean flag indicating that this file surrogate key is subject to 3P Partners access control policies (BOOLEAN, Not Nullable, Always TRUE).
      Static field used for access control and data governance within the 3P Partners domain.
      All file surrogate keys in this table are related to 3P Partners operations and require appropriate access permissions.
      Used by data governance tools and access control systems to apply 3P-specific security policies.