---
database_name: datalake_rede_supply
table_name: lead_3p_status
description: Table with all combinations of existing status, growth_status and non-conversion reasons. Base for the junk dimension dw_rede.dim_lead_3p_status.
owner: gustavo.miller@quintoandar.com.br
domain: Rede
columns:
  sk_lead_3p_status:
    description: 'Surrogate key for the lead 3p status, generated incrementally.'
  status:
    lineage:
      - datalake_rede_supply.lead_3p_status_changes.status
    description: 'Status of the lead or its listing'
    categories:
      REGISTERED: 'Registered in Main for publication'
      SUSPENDED: 'Lead suspended'
      WAITING: 'Lead eligible and waiting for owner information'
      PROCESSING: 'Lead in image processing'
      QUEUE: 'Lead awaiting in the duplicate queue'
      NOT_CONVERTED: 'Lead not converted due to ineligibility, enrichment or discard'
      PUBLISHED: 'Published in Main'
      UNPUBLISHED: 'Unpublished from Main'
  growth_status:
    lineage:
      - datalake_rede_supply.lead_3p_status_changes.growth_status
    description: 'Status of the lead in the growth funnel.'
    categories:
      LEAD: First stage. The lead was just created, but was not approved in the eligibility analysis.
      PROSPECT: Second stage. The lead was approved in the eligibility analysis.
      QUALIFIED: Third stage. The real estate agency provided information about the owner of the prospect, but it was not approved in analyisis.
      OPPORTUNITY: Fourth stage. A qualified lead that was sent to image processing.
      FIRST_LISTING: Fifth and final stage. The opportunity was approved, and registered in Main for publication.
  is_waiting_for_enrichment:
    lineage:
      - datalake_rede_supply.lead_3p_status_changes.is_waiting_for_enrichment
    description: 'True if the lead is not converted due to an enrichment reason.'
  is_ineligible:
    lineage:
      - datalake_rede_supply.lead_3p_status_changes.is_ineligible
    description: 'True if the lead is not converted due to an ineligibility reason.'
  is_discarded:
    lineage:
      - datalake_rede_supply.lead_3p_status_changes.is_discarded
    description: 'True if the lead is not converted due to a discard reason.'
