---
database_name: datalake_rede_supply
table_name: lead_3p_sks
description: 'Generates surrogate keys for leads 3p.'
owner: vitor.musachio@quintoandar.com.br
domain: 3P Partners
columns:
  sk_lead_3p:
    description: 'Surrogate key for the lead 3p, generated incrementally.'
  id_lead_3p:
    lineage:
      - datalake_brokers_supply_processor.lead_3p.id
    description: Natural key of the lead, which comes from Supply Processor.
  has_3p_access_control:
    lineage:
      - datalake_brokers_supply_processor.lead_3p.has_3p_access_control
    description: >
      Boolean flag indicating that this lead surrogate key is subject to 3P Partners access control policies (BOOLEAN, Not Nullable, Always TRUE).
      Static field used for access control and data governance within the 3P Partners domain.
      All lead surrogate keys in this table are related to 3P Partners operations and require appropriate access permissions.
      Used by data governance tools and access control systems to apply 3P-specific security policies.