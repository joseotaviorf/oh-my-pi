---
database_name: datalake_rede_supply
table_name: lead_3p_reasons
description: Table with all combinations of non-conversion reasons. Base for the junk dimension dw_rede.dim_lead_3p_reason.
owner: gustavo.miller@quintoandar.com.br
domain: Rede
columns:
  sk_lead_3p_reason:
    description: 'Surrogate key for the lead 3p reason, generated incrementally.'
  reason:
    lineage:
      - datalake_rede_supply.lead_3p_reason_changes.reason
    description: 'Reason for the lead not being converted, standardized in camelCase.'
  reason_type:
    lineage:
      - datalake_rede_supply.lead_3p_reason_changes.reason_type
    description: Type of reason.
    categories:
      INELIGIBLE_REASON: 'Reason for the lead not being converted due to ineligibility.'
      DISCARD_REASON: 'Reason for the lead not being converted due to discard.'
      ENRICHMENT_REASON: 'Reason for the lead not being converted due to enrichment.'
  is_ineligible_reason:
    lineage:
      - datalake_rede_supply.lead_3p_reason_changes.is_ineligible_reason
    description: Boolean to tell if the reason is an ineligibility reason.
  is_discard_reason:
    lineage:
      - datalake_rede_supply.lead_3p_reason_changes.is_discard_reason
    description: Boolean to tell if a reason is a discard reason.
  is_enrichment_reason:
    lineage:
      - datalake_rede_supply.lead_3p_reason_changes.is_enrichment_reason
    description: Boolean to tell if a reason is an enrichment reason.
