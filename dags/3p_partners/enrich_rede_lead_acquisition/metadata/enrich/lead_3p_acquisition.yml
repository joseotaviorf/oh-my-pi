---
database_name: datalake_rede_lead_acquisition
table_name: lead_3p_acquisition
owner: vitor.musachio@quintoandar.com.br
domain: Rede
description: Every row is a published lead + business context, and categorizes it as part of
  the HUNTING acquisition team or the FARMING acquisition team.
columns:
  id_lead_3p:
    lineage:
      - datalake_rede_supply.lead_3p_status_changes.id_lead_3p
    description: Unique identifier of the lead
  business_context:
    lineage:
      - datalake_rede_supply.lead_3p_status_changes.business_context
    description: Business context of the lead
    categories:
      SALE: Lead published in the sale context
      RENT: Lead published in the rent context
  acquisition_team:
    description: 'Acquisition team of the lead. It answers the question: was the lead published within the first 30 days of membership
      of the company in that business context (HUNTING), or after that (FARMING)?'
    categories:
      HUNTING: Lead published within the first 30 days of membership of the company
        in that business context.
      FARMING: Lead published after the first 30 days of membership of the company
        in that business context.