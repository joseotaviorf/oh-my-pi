---
database_name: dw_public
table_name: fact_search_session_event
description: Each row of this table corresponds to a house associated with a search. For example if an event in 170698_search_page_viewed_events returned 30 houses, there
  will be 30 rows in this table. Currently, it has only search and listing page viewed events.
domain: Rede
owner: gustavo.miller@quintoandar.com.br
columns:
  sk_event:
    description: Primary key of the table. Represents a unique event associated with a house.
  sk_event_type:
    description: Key to join with dw_public.dim_search_session_event, representing the combination of characteristics of a search session event.
    lineage:
      - dw_public.dim_search_session_event_type.sk_event_type
  sk_amplitude:
    description: Identifier of the unique user generated by Amplitude.
    lineage:
      - datalake_search_session_event.search_session_event.id_amplitude
  sk_user:
    description: Identifier of the unique user if they are logged on. Equivalent to dw_public.dim_user.sk_user
    lineage:
      - datalake_search_session_event.search_session_event.id_user
  sk_house:
    description: Unique identifier of the house associated with the event.
    lineage:
      - datalake_search_session_event.search_session_event.id_house
  sk_house_region:
    description: Id of the house region.
    lineage:
      - datalake_ebdb_listing.house.id_region
  sk_company:
    description: Unique identifier of the company in Rede QuintoAndar associated with the listing. Can be joined with dw_rede.dim_company
    lineage:
      - datalake_search_session_event.search_session_event.sk_company
  sk_session:
    description: Unique identifier of the search session. A session starts after 5 minutes of no events, or a change in business context.
    lineage:
      - datalake_search_session_event.search_session_event.sk_session
  sk_search:
    description: Unique identifier of the search that led to that event, generated by Amplitude.
    lineage:
      - datalake_search_session_event.search_session_event.sk_search
  sk_event_date:
    description: Date key of when the event happened.
    lineage:
      - datalake_search_session_event.search_session_event.sk_event_date
  nr_session_for_user_on_day:
    description: Number of the session for that id_amplitude on that day. A session starts after 5 minutes of no events, or a change in business context.
    lineage:
      - datalake_search_session_event.search_session_event.nr_session_for_user_on_day
  ts_event:
    description: Timestamp of when the event happened.
    lineage:
      - datalake_search_session_event.search_session_event.ts_event
  year:
    description: Year of when the event happened.
    lineage:
      - datalake_search_session_event.search_session_event.year
  month:
    description: Month of when the event happened.
    lineage:
      - datalake_search_session_event.search_session_event.month
  day:
    description: Day of when the event happened.
    lineage:
      - datalake_search_session_event.search_session_event.day
