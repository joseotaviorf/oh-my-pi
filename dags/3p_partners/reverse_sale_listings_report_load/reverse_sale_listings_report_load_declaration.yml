dag:
  name: reverse_sale_listings_report_load
  schedule_start_date: 2022,7,12
  owner: Data 3P Partners
  documentation:
    dag_purpose: This DAG collects several events from listings (currently, only focused on Rede Sale Listings). These tables will be used in the DAG reverse_sale_listings_report_access to be sent via SNS to a service called "Member's Area", where they will be displayed as an analytical report for Rede Members.
workflow:
  type: load
  layer: reverse
  custom_schema: listings_report
  default_extraction_type: incremental
  default_partitions: ["year", "month", "day"]
  tables_customization:
    demand_score:
      default_table_privileges:
        3p-readers:
          - SELECT
        data-engineers:
          - ALL PRIVILEGES
      merge_on: ['id_house', 'demand_score']
      z_order_by: ["id_house"]
    sale_lead_not_converted:
      default_table_privileges:
        3p-readers:
          - SELECT
        data-engineers:
          - ALL PRIVILEGES
    sale_listing_offer_accepted:
      default_table_privileges:
        3p-readers:
          - SELECT
        data-engineers:
          - ALL PRIVILEGES
    sale_listing_offer_sent:
      default_table_privileges:
        3p-readers:
          - SELECT
        data-engineers:
          - ALL PRIVILEGES
    sale_listing_published:
      default_table_privileges:
        3p-readers:
          - SELECT
        data-engineers:
          - ALL PRIVILEGES
    sale_listing_signed_contract:
      default_table_privileges:
        3p-readers:
          - SELECT
        data-engineers:
          - ALL PRIVILEGES
    sale_listing_traffic:
      default_table_privileges:
        3p-readers:
          - SELECT
        data-engineers:
          - ALL PRIVILEGES
    sale_listing_visit_confirmed:
      default_table_privileges:
        3p-readers:
          - SELECT
        data-engineers:
          - ALL PRIVILEGES
    sale_listing_visit_scheduled:
      default_table_privileges:
        3p-readers:
          - SELECT
        data-engineers:
          - ALL PRIVILEGES
    sale_ongoing_listings:
      default_table_privileges:
        3p-readers:
          - SELECT
        data-engineers:
          - ALL PRIVILEGES
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
cluster:
  type: databricks_16_4_med_general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}