---
database_name: datalake_ebdb_clean
table_name: entrance_conditions
owner: vitor.musachio@quintoandar.com.br
domain: 3P Partners
description: 'Property entrance conditions and key management logistics table containing specific details about how to access properties for showings, inspections, and move-ins. This table captures key locations, availability for viewings, landlord involvement requirements, and contract-related access procedures. Critical for agent operations, property showing coordination, and tenant transition processes.'
columns:
  id:
    lineage:
      - datalake_ebdb_raw.CondicoesEntrada.id
    description: 'Unique identifier for the property entrance conditions record. Primary key used for managing and referencing specific access logistics and key management arrangements for individual properties.'
  id_house:
    lineage:
      - datalake_ebdb_raw.CondicoesEntrada.imovel_id
    description: 'Foreign key reference to the property (imovel) for which these entrance conditions apply. Establishes which specific apartment, house, or unit these access logistics and key management procedures govern.'
  key_location:
    lineage:
      - datalake_ebdb_raw.CondicoesEntrada.keyLocation
    description: 'General location or method for obtaining property keys (e.g., WITH_OWNER, CONCIERGE, LOCKBOX, AGENT). High-level classification of where and how keys can be accessed for property entry.'
  key_location_details:
    lineage:
      - datalake_ebdb_raw.CondicoesEntrada.keyLocationDetails
    description: 'Detailed description of the key location and retrieval process. Includes specific instructions, addresses, contact information, codes, or procedures required to obtain keys for property access.'
  is_key_in_concierge:
    lineage:
      - datalake_ebdb_raw.CondicoesEntrada.chavesNaPortaria
    description: 'Boolean flag indicating whether property keys are stored with the building concierge or doorman. True means keys can be obtained from building reception, simplifying agent access coordination.'
  is_visit_available:
    lineage:
      - datalake_ebdb_raw.CondicoesEntrada.disponivelVistoria
    description: 'Boolean flag indicating whether the property is currently available for viewings and inspections. True means showings can be scheduled, False indicates property is not accessible for visits.'
  is_landlord_monitor_inspection:
    lineage:
      - datalake_ebdb_raw.CondicoesEntrada.proprietarioAcompanhaVistoria
    description: 'Boolean flag indicating whether the property owner requires to be present during inspections and viewings. True means owner accompanies visits, affecting scheduling and coordination requirements.'
  is_key_with_contract:
    lineage:
      - datalake_ebdb_raw.CondicoesEntrada.chavesComContrato
    description: 'Boolean flag indicating whether keys are only available after contract signing. True means keys are held until lease agreement completion, affecting move-in timing and logistics coordination.'
  ts_created:
    lineage:
      - datalake_ebdb_raw.CondicoesEntrada.criadoEm
    description: 'Timestamp when the entrance conditions record was first created in the system. Used for audit trails and tracking the establishment of property access logistics and key management procedures.'
  ts_updated:
    lineage:
      - datalake_ebdb_raw.CondicoesEntrada.atualizadoEm
    description: 'Timestamp of the most recent update to the entrance conditions. Critical for maintaining current access procedures and ensuring agents have accurate information for property coordination.'