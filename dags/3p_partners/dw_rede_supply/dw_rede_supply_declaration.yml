dag:
  name: dw_rede_supply
  owner: Data 3P Partners
  documentation:
    dag_purpose: This DAG creates the models for the supply side of Rede QuintoAndar, which is a marketplace.
workflow:
  type: query_delta
  layer: dw
  custom_schema: rede
  inner_dependencies:
    fact_lead_3p_flows:
      - dim_lead_3p_context
    fact_lead_3p_status:
      - dim_lead_3p_context
    fact_lead_3p_status_reason:
      - dim_lead_3p_context
  tables_customization:
    fact_lead_3p_status_reason:
      extraction_type: incremental
      merge_on: [sk_lead_3p_flow, sk_lead_3p_reason, ts_reason_started]
      partitions: [year, month, day]
      z_order_by: [sk_lead_3p_flow, ts_reason_started]
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: r5a.2xlarge
    node_type_id: r5a.2xlarge
    num_workers: 3
    spark_version: 16.4.x-scala2.12
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: USER_ISOLATION
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE
  databricks_conn_id: databricks_new