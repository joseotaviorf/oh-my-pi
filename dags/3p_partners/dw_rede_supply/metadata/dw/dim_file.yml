database_name: dw_rede
table_name: dim_file
description: Files are sent from real estate agencies to Supply Processor containing data that will be processed into one or more leads. This table has information about the file, such as the name, status, or when it was sent.
domain: Rede
owner: vitor.musachio@quintoandar.com.br
columns:
  sk_file:
    lineage:
    - datalake_rede_supply.file_sks.sk_file
    description: Primary key of the table. It is a unique number generated by the
      ETL to represent the file, so it does not come from any product.
  id_file:
    lineage:
    - datalake_brokers_supply_processor.file.id
    description: ID of the file in Supply Processor.
  hash:
    lineage:
    - datalake_brokers_supply_processor.file.hash
    description: Hash of the file in Supply Processor.
  file_name:
    lineage:
    - datalake_brokers_supply_processor.file.file_name
    description: Name of the file.
  type:
    lineage:
    - datalake_brokers_supply_processor.file.type
    description: Status of file. Can be "RECEIVED", "CREATED", "FAILED" or "PROCESSED".
  url:
    lineage:
    - datalake_brokers_supply_processor.file.url
    description: URL of the file.
  ts_created:
    lineage:
    - datalake_brokers_supply_processor.file.ts_created
    description: Time when the file was created.
  ts_updated:
    lineage:
    - datalake_brokers_supply_processor.file.ts_updated
    description: Time when the file was updated.
  ts_load:
    description: Time when the table was last processed.