---
database_name: dw_rede
table_name: fact_lead_3p_flows
description: A Lead 3P is a property from a real estate agency in Rede QuintoAndar, sent through Supply Processor. Each row of this table is a flow of a Lead 3P in a given context (SALE or RENT), with the dates for the milestones in the funnel (lead, prospect, qualified, opportunity and first listing). There are also foreign keys pointing to the context, company, file, lead, status, and house (if it has been published).
domain: Rede
owner: vitor.musachio@quintoandar.com.br
columns:
  sk_lead_3p_flow:
    lineage:
    - datalake_rede_supply.lead_3p_sks.sk_lead_3p
    description: Primary key of the table, formed by the concatenation of sk_lead_3p and 00 (SALE) or 01 (RENT).
  sk_lead_3p:
    lineage:
    - datalake_rede_supply.lead_3p_sks.sk_lead_3p
    description: Unique number generated by the ETL to represent the lead, and can be joined with dw_rede.dim_lead_3p.
  sk_lead_3p_context:
    lineage:
    - dw_rede.dim_lead_3p_context.sk_lead_3p_context
    description: Surrogate key of dw_rede.dim_lead_3p_context. There, you can find the business context of the lead flow (SALE or RENT), and the recurrency type.
  sk_file:
    lineage:
    - datalake_rede_supply.file_sks.sk_file
    description: Foreign Key to the last file that updated this lead. Can be joined
      with dw_rede.dim_file.
  sk_company:
    lineage:
    - datalake_company.company_sks.sk_company
    description: Foreign Key to the company that sent this lead, obtained by looking
      for the CNPJ in HubSpot. Can be joined with dw_rede.dim_company.
  sk_lead_3p_status:
    lineage:
    - datalake_rede_supply.lead_3p_status.sk_lead_3p_status
    description: Foreign Key to the current status of the lead. Can be joined with
      dw_rede.dim_lead_3p_status.
  sk_house:
    lineage:
    - datalake_ebdb_clean.house.id
    - datalake_rede_supply.lead_3p_status_changes.id_house
    description: Foreign Key to the house in Main, if the lead was published. Can
      be joined with dw_public.dim_house.
  sk_region:
    lineage:
    - datalake_brokers_supply_processor.lead_3p.id_region
    description: Foreign Key to the region of the lead. Can be joined with dw_public.dim_region.
  sk_first_version_sent_date:
    lineage:
    - datalake_rede_lead_crawler.lead_3p_freshness.dt_supply_processor
    description: Date key for when the first version of the lead was sent to Supply Processor by this company in this business context.
  sk_crawler_date:
    lineage:
    - datalake_rede_lead_crawler.lead_3p_freshness.dt_crawler
    description: Date key for when the lead was sent to Zap Imóveis, monitored by a crawler.
  sk_lead_date:
    lineage:
    - datalake_rede_supply.lead_3p_status_changes.ts_status_started
    description: Date key for when the lead was created in Supply Processor.
  sk_prospect_date:
    lineage:
    - datalake_rede_supply.lead_3p_status_changes.ts_status_started
    description: Date key for when the lead passed through the eligibility analysis.
  sk_qualified_date:
    lineage:
    - datalake_rede_supply.lead_3p_status_changes.ts_status_started
    description: Date key for when the owner information was received.
  sk_opportunity_date:
    lineage:
    - datalake_rede_supply.lead_3p_status_changes.ts_status_started
    description: Date key for when the lead was sent to image analysis.
  sk_registered_date:
    lineage:
    - datalake_rede_supply.lead_3p_status_changes.ts_status_started
    description: Date key for when the lead was registered in Main.
  sk_first_listing_date:
    lineage:
    - datalake_rede_supply.lead_3p_status_changes.ts_status_started
    description: Date key for when the lead was first published.
  sk_first_unpublished_date:
    lineage:
    - datalake_rede_supply.lead_3p_status_changes.ts_status_started
    description: Date key for when the lead was first unpublished.
  total_house_updates:
    description: Total number of times the house was updated in Main.
  dt_first_version_sent:
    lineage:
    - datalake_rede_lead_crawler.lead_3p_freshness.dt_supply_processor
    description: Date for when the first version of the lead was sent to Supply Processor by this company in this business context.
  dt_crawler:
    lineage:
    - datalake_rede_lead_crawler.lead_3p_freshness.dt_crawler
    description: Date for when the lead was sent to Zap Imóveis, monitored by a crawler.
  ts_lead:
    lineage:
    - datalake_rede_supply.lead_3p_status_changes.ts_status_started
    description: Timestamp for when the lead was created in Supply Processor.
  ts_prospect:
    lineage:
    - datalake_rede_supply.lead_3p_status_changes.ts_status_started
    description: Timestamp for when the lead passed through the eligibility analysis.
  ts_qualified:
    lineage:
    - datalake_rede_supply.lead_3p_status_changes.ts_status_started
    description: Timestamp for when the owner information was received.
  ts_opportunity:
    lineage:
    - datalake_rede_supply.lead_3p_status_changes.ts_status_started
    description: Timestamp for when the lead was sent to image analysis.
  ts_registered:
    lineage:
    - datalake_rede_supply.lead_3p_status_changes.ts_status_started
    description: Timestamp for when the lead was first registered in Main for publication.
  ts_first_listing:
    lineage:
    - datalake_rede_supply.lead_3p_status_changes.ts_status_started
    description: Timestamp for when the first listing was published.
  ts_first_unpublished:
    lineage:
    - datalake_rede_supply.lead_3p_status_changes.ts_status_started
    description: Timestamp for when the listing was first unpublished.
  days_crawler_to_first_version_sent:
    description: Number of days between the lead was sent to Zap Imóveis and the first version was sent to Supply Processor.
  days_lead_to_prospect:
    description: Amount of days between lead and prospect, rounded down.
  days_lead_to_qualified:
    description: Amount of days between lead and qualified, rounded down.
  days_lead_to_opportunity:
    description: Amount of days between lead and opportunity, rounded down.
  days_lead_to_first_listing:
    description: Amount of days between lead and first listing, rounded down.
  ts_load:
    description: Time when the table was last processed.