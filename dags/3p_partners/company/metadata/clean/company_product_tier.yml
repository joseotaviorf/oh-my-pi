---
database_name: datalake_company_clean
table_name: company_product_tier
owner: vitor.musachio@quintoandar.com.br
domain: 3P Partners
description: |
  Table representing the commercial tier or pricing category assigned to each company-product relationship. Used to determine eligibility for features, commission rates, or pricing levels of products offered by partner companies. Enables flexible segmentation and billing logic per partnership agreement.

  BUSINESS SCENARIOS:
  - Assigning different commission rates for Gold vs. Silver broker partners
  - Tracking changes to company tier for business intelligence
  
columns:
  id:
    lineage:
      - datalake_company_raw.company_product_tier.id
    description: |
      Primary key (BIGSERIAL). Auto-incrementing unique identifier for internal database operations.
  id_company:
    lineage:
      - datalake_company_raw.company_product_tier.company_id
    description: |
      Foreign key to company table. Identifies the partner company in the tiered product relationship.
  id_product:
    lineage:
      - datalake_company_raw.company_product_tier.product_id
    description: |
      Foreign key to product table. Identifies which product is assigned a pricing tier for the company.
  id_tier:
    lineage:
      - datalake_company_raw.company_product_tier.tier_id
    description: |
      Foreign key to tier table. Commercial tier or pricing category, e.g., Gold, Silver, Bronze, agreed for this company-product association.
  version:
    lineage:
      - datalake_company_raw.company_product_tier.version
    description: |
      Optimistic locking version number (BIGINT) for concurrency control and safe updates.
  ts_created:
    lineage:
      - datalake_company_raw.company_product_tier.created_at
    description: |
      Timestamp of record creation (UTC). When the tier assignment between company and product was first created.
  ts_updated:
    lineage:
      - datalake_company_raw.company_product_tier.updated_at
    description: |
      Last update timestamp (UTC). Tracks modifications to company-product tier assignments for audit and billing logic.
  year:
    lineage:
      - datalake_company_raw.company_product_tier.year
    description: |
      Year of the last update of the product in the tier.
  month:
    lineage:
      - datalake_company_raw.company_product_tier.month
    description: |
      Month of the last update of the product in the tier.
  day:
    lineage:
      - datalake_company_raw.company_product_tier.day
    description: |
      Day of the last update of the product in the tier.