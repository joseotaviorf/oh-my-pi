dag:
  name: company
  owner: Data 3P Partners
  schedule_interval: 0 21,8,12 * * *
  documentation:
    dag_purpose: |
      This DAG imports critical tables from the Company microservice, which centralizes legal entity data for QuintoAndar's partner ecosystem.
      
      BUSINESS CONTEXT:
      The Company service manages QuintoAndar's paradigm shift to support broker partners (For Brokers initiative), where QuintoAndar
      itself becomes one entity among many companies in the platform. This CDC pipeline captures real-time changes from the production
      PostgreSQL database (company.db.core-prd.habitat.zone) to support analytics, reporting, and downstream data products.
      
      INGESTED ENTITIES:
      - Company hierarchies (headquarters → branches)
      - Legal documents (CNPJ, CRECI, CPF, RFC) with validation status
      - Address information and company locations
      - Banking details for financial operations
      - Revenue sharing configurations and commission structures
      - User membership and role assignments across companies/products
      - Product catalogs and tier-based service levels
      
      SCHEDULE: Runs 3x daily (8:00, 12:00, 21:00 UTC) to capture business-hour changes and end-of-day settlements.
      
      DATA LINEAGE: PostgreSQL (OLTP) → Raw Layer → Clean Layer → Analytics Layer
workflow:
  type: cdc
  layer: raw
  custom_schema: company
  database_type: postgres
  source_database: company
  source_schema: public
  default_partitions: [year, month, day]
  tables_customization:
    address: {}
    banking_information: {}
    company_address:
      raw_primary_keys: ["address_id", "company_id"]
    company_document:
      raw_primary_keys: ["document_id", "company_id"]
    company_product:
      raw_primary_keys: ["product_id", "company_id"]
    company: {}
    document: {}
    member_profile: {}
    product: {}
    profile_hierarchy: {}
    profile: {}
    revenue_share: {}
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}" 
cluster:
  type: databricks_12_2_med_general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}