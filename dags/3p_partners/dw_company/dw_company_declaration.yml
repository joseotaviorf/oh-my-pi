dag:
  name: dw_company
  schedule_start_date: 2020, 1, 1
  owner: Data 3P Partners
  documentation:
    dag_purpose: "This DAG creates the model for QuintoAndar's companies partners."
workflow:
  type: query_delta
  layer: dw
  custom_schema: public
  tables_customization:
    dim_company_3p_partners:
      table_privileges:
        3p-readers:
          - SELECT
        data-engineers:
          - ALL PRIVILEGES
    dim_company_event_type:
      table_privileges:
        3p-readers:
          - SELECT
        data-engineers:
          - ALL PRIVILEGES
    fact_company_events:
      table_privileges:
        3p-readers:
          - SELECT
        data-engineers:
          - ALL PRIVILEGES
    dim_company:
        row_filter_column_key: has_3p_access_control
        row_filter: has_3p_access
  inner_dependencies:
    fact_company_events:
      - dim_company_event_type
cluster:
  type: databricks_16_4_med_general_cluster
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: USER_ISOLATION
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
