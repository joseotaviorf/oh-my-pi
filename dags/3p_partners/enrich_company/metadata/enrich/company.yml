---
database_name: datalake_company
table_name: company
description: 'Enriched company data from the Company domain.'
owner: 'gustavo.miller@quintoandar.com.br'
domain: Rede
columns:
  id_company:
    lineage:
      - datalake_company_clean.company.id
    description: Id of the company in the Company domain.
  id_parent_company:
    lineage:
      - datalake_company_clean.company.id_parent
    description: Id of the parent company in the Company domain.
  uuid_company:
    lineage:
      - datalake_company_clean.company.uuid_company
    description: UUID of the company in the Company domain.
  company_name:
    lineage:
      - datalake_company_clean.company.company_name
    description: Name of the company (legally registered).
  trade_name:
    lineage:
      - datalake_company_clean.company.trade_name
    description: Trade name of the company (as known by the audience).
  company_type:
    lineage:
      - datalake_company_clean.company.company_type
    description: If the company is a headquarter or a subsidiary.
  document:
    lineage:
      - datalake_company_clean.document.identification_number
    description: Document of the company, cleaned to have only numbers and letters.
  cnpj:
    lineage:
      - datalake_company_clean.document.identification_number
    description: CNPJ of the Brasil company, cleaned to have only numbers.
  rfc:
    lineage:
      - datalake_company_clean.document.identification_number
    description: RFC of the Mexico company, cleaned to have only numbers and letters.
  status:
    lineage:
      - datalake_company_clean.company.status
    description: Status of the company.
    categories:
      ACTIVE: The company is active.
      INACTIVE: The company is inactive.
  country:
    lineage:
      - datalake_company_clean.address.country
    description: Country of the company.
  state:
    lineage:
      - datalake_ebdb_clean.state.name
      - datalake_company_clean.address.state
    description: Full name of the state of the company.
  state_abbreviation:
    lineage:
      - datalake_ebdb_clean.state.abbreviation
      - datalake_company_clean.address.state
    description: Abbreviation of the state of the company.
  city:
    lineage:
      - datalake_company_clean.address.city
    description: City of the company. Not normalized.
  neighborhood:
    lineage:
      - datalake_company_clean.address.neighborhood
    description: Neighborhood of the company. Not normalized.
  public_area:
    lineage:
      - datalake_company_clean.address.public_area
    description: Public area of the company, such as street, avenue, etc. Not normalized.
  zip_code:
    lineage:
      - datalake_company_clean.address.zip_code
    description: Zip code of the company.
  number:
    lineage:
      - datalake_company_clean.address.number
    description: Number of the company.
  complement:
    lineage:
      - datalake_company_clean.address.complement
    description: Complement of the company.
  has_rede_product:
    description: True if the company is associated with the Rede product.
  has_rental_guarantee_product:
    description: True if the company is associated with the Rental Guarantee product.
  houses_currently_owned:
    description: Number of houses currently owned by the company.
  sale_listings_currently_owned:
    description: Number of sale listings currently owned by the company.
  rent_listings_currently_owned:
    description: Number of rent listings currently owned by the company.
  leads_currently_owned:
    description: Number of leads sent by the company to Supply Processor.
  sale_leads_currently_owned:
    description: Number of sale leads sent by the company to Supply Processor.
  rent_leads_currently_owned:
    description: Number of rent leads sent by the company to Supply Processor.
  ts_created:
    lineage:
      - datalake_company_clean.company.ts_created
    description: Timestamp of when the company was created in the Company domain.
  ts_updated:
    lineage:
      - datalake_company_clean.company.ts_updated
    description: Timestamp of when the company was last updated in the Company domain.
