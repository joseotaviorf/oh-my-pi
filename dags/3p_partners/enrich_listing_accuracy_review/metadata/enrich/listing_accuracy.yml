---
database_name: datalake_listing_accuracy_review
table_name: listing_accuracy
description: Table with information on the last review received for the house. In other words, it shows if the information is accurate with the listing.
domain: 3P Partners
owner: vitor.musachio@quintoandar.com.br
columns:
  id_house:
    description: Id of the house.
    lineage:
      - datalake_listing_accuracy_review.listing_accuracy_history.id_house
  is_listing_accurate:
    description: Boolean if the listing has the information exactly as published.
    lineage:
      - datalake_listing_accuracy_review.listing_accuracy_history.is_listing_accurate
  has_3p_access_control:
    description: >
      Boolean flag indicating that this event is subject to 3P Partners access control policies.
      Used by data governance tools and access control systems to apply 3P-specific security policies.