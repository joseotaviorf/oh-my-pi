dag:
  name: enrich_listing_accuracy_review
  schedule_start_date: 2020, 8, 29
  owner: Data 3P Partners
  documentation:
    dag_purpose: This DAG is responsible for creating enriched tables for the feature where the Buyer reviews whether or not the listing visited has the correct information displayed on the platform.
workflow:
  type: query_delta
  layer: enrich
  inner_dependencies:
    listing_accuracy:
    - listing_accuracy_history
  default_table_privileges:
    3p-readers:
      - SELECT
    data-engineers:
      - ALL PRIVILEGES
cluster:
  type: databricks_16_4_xmin_memory_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
