database_name: datalake_brokers
table_name: broker_status_history
description: Unified broker status history combining Hubspot (up to 2026-01-31) and Company (from 2026-02-01) sources. Each row represents a status period with start and end timestamps, partitioned by broker and product.
domain: 3P Partners
owner: vitor.musachio@quintoandar.com.br
columns:
  id_status_change:
    lineage:
      - core_brokers.brokers_product_historical.sk_broker_product
      - datalake_brokers.hubspot_brokers_history.sk_broker
      - datalake_hubspot.company_history.ts_updated
      - core_brokers.brokers_product_historical.ts_database_transaction
    description: Primary key of the table, composed of the combination of sk_broker_product and ts_start.
  sk_broker:
    lineage:
      - core_brokers.brokers.sk_broker
      - core_brokers.brokers_product_historical.sk_broker
    description: Surrogate key identifying the broker.
  broker_status:
    lineage:
      - datalake_brokers.hubspot_brokers_history.broker_status
      - core_brokers.brokers_product_historical.product_status
    description: Status of the broker during the period (e.g. ACTIVE, INACTIVE).
  product_name:
    lineage:
      - core_brokers.brokers_product_historical.product_name
    description: Name of the product associated with the broker status. 'Rede Sale' for Hubspot-sourced records.
  status_origin:
    description: Origin system of the status record.
    categories:
      Hubspot: Status sourced from Hubspot company history (up to 2026-01-31).
      Company: Status sourced from Company brokers_product_historical (from 2026-02-01).
  is_current:
    description: True if the status is the broker's current status for the given product, otherwise false.
  has_3p_access_control:
    description: >
      Boolean flag indicating that this event is subject to 3P Partners access control policies.
      Used by data governance tools and access control systems to apply 3P-specific security policies.
  ts_start:
    lineage:
      - datalake_hubspot.company_history.ts_updated
      - core_brokers.brokers_product_historical.ts_database_transaction
    description: Start timestamp of the status period.
  ts_end:
    lineage:
      - datalake_hubspot.company_history.ts_updated
      - core_brokers.brokers_product_historical.ts_database_transaction
    description: End timestamp of the status period. NULL if this is the current status.
  ts_load:
    description: Timestamp of when the record was loaded or last updated by the ETL process.