---
database_name: datalake_hubspot_clean
table_name: thread_messages
description: |
  HubSpot conversation thread messages with sender/recipient, content and lifecycle
  information, including arrays for attachments and participants, and partition/load fields.
domain: 3P Partners
owner: anne.macedo@quintoandar.com.br
columns:
  id_thread_message:
    lineage:
      - datalake_hubspot_raw.thread_messages.id
    description: Unique identifier of the thread message.
  id_thread_conversation:
    lineage:
      - datalake_hubspot_raw.thread_messages.conversationsThreadId
    description: Identifier linking the message to its thread.
  id_channel:
    lineage:
      - datalake_hubspot_raw.thread_messages.channelId
    description: Channel identifier where the message was created.
  id_channel_account:
    lineage:
      - datalake_hubspot_raw.thread_messages.channelAccountId
    description: Channel account identifier.
  created_by:
    lineage:
      - datalake_hubspot_raw.thread_messages.createdBy
    description: Creator of the message.
  text:
    lineage:
      - datalake_hubspot_raw.thread_messages.text
    description: Plain text content of the message.
  rich_text:
    lineage:
      - datalake_hubspot_raw.thread_messages.richText
    description: Rich text content of the message, when available.
  status:
    lineage:
      - datalake_hubspot_raw.thread_messages.status
    description: Status of the message.
  truncation_status:
    lineage:
      - datalake_hubspot_raw.thread_messages.truncationStatus
    description: Truncation status for long content.
  type:
    lineage:
      - datalake_hubspot_raw.thread_messages.type
    description: Message type (e.g., EMAIL, CHAT).
  direction:
    lineage:
      - datalake_hubspot_raw.thread_messages.direction
    description: Message direction (INCOMING/OUTGOING).
  attachments:
    lineage:
      - datalake_hubspot_raw.thread_messages.attachments
    description: Attachments array associated with the message.
  client:
    lineage:
      - datalake_hubspot_raw.thread_messages.client
    description: Client metadata for the message.
  senders:
    lineage:
      - datalake_hubspot_raw.thread_messages.senders
    description: Senders array for the message.
  recipients:
    lineage:
      - datalake_hubspot_raw.thread_messages.recipients
    description: Recipients array for the message.
  is_archived:
    lineage:
      - datalake_hubspot_raw.thread_messages.archived
    description: Whether the message has been archived.
  ts_created:
    lineage:
      - datalake_hubspot_raw.thread_messages.createdAt
    description: Message creation timestamp.
  ts_updated:
    lineage:
      - datalake_hubspot_raw.thread_messages.updatedAt
    description: Message last update timestamp.
  ts_load:
    lineage:
      - datalake_hubspot_raw.thread_messages.ts_load
    description: Load timestamp captured at ingestion time.
  year:
    lineage:
      - datalake_hubspot_raw.thread_messages.year
    description: Partition year.
  month:
    lineage:
      - datalake_hubspot_raw.thread_messages.month
    description: Partition month.
  day:
    lineage:
      - datalake_hubspot_raw.thread_messages.day
    description: Partition day.
  hour:
    lineage:
      - datalake_hubspot_raw.thread_messages.hour
    description: Partition hour.

