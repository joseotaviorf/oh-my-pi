---
database_name: datalake_hubspot_clean
table_name: inboxes
description: |
  HubSpot inboxes and their metadata synced from the Conversations API. Includes
  identification, type, lifecycle flags, creation/update timestamps and load partitions.
domain: 3P Partners
owner: anne.macedo@quintoandar.com.br
columns:
  id_inbox:
    lineage:
      - datalake_hubspot_raw.inboxes.id
    description: Unique identifier of the inbox.
  name:
    lineage:
      - datalake_hubspot_raw.inboxes.name
    description: Inbox display name.
  type:
    lineage:
      - datalake_hubspot_raw.inboxes.type
    description: Inbox type (e.g., team, email, chat).
  is_archived:
    lineage:
      - datalake_hubspot_raw.inboxes.archived
    description: Whether the inbox has been archived in HubSpot.
  ts_created:
    lineage:
      - datalake_hubspot_raw.inboxes.created_at
    description: Creation timestamp of the inbox.
  ts_updated:
    lineage:
      - datalake_hubspot_raw.inboxes.updated_at
    description: Last update timestamp of the inbox.
  ts_load:
    lineage:
      - datalake_hubspot_raw.inboxes.ts_load
    description: Load timestamp captured at ingestion time.
  year:
    lineage:
      - datalake_hubspot_raw.inboxes.year
    description: Partition year.
  month:
    lineage:
      - datalake_hubspot_raw.inboxes.month
    description: Partition month.
  day:
    lineage:
      - datalake_hubspot_raw.inboxes.day
    description: Partition day.
  hour:
    lineage:
      - datalake_hubspot_raw.inboxes.hour
    description: Partition hour.
  