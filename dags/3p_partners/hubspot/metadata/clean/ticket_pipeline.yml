---
database_name: datalake_hubspot_clean
table_name: ticket_pipeline
description: |
  HubSpot Ticket Pipeline objects define the stages and workflow configuration for customer support cases. 
  Pipelines structure the support process with sequential stages that tickets progress through from creation 
  to resolution. This table contains pipeline configurations essential for support process analysis and team performance tracking.
domain: 3P Partners
owner: vitor.musachio@quintoandar.com.br
columns:
  id_pipeline:
    lineage:
      - datalake_hubspot_raw.ticket_pipeline.id
    description: 'Unique identifier for the ticket pipeline configuration. Primary key used for associating tickets with their specific support process workflow.'
  label:
    lineage:
      - datalake_hubspot_raw.ticket_pipeline.label
    description: 'Human-readable name of the ticket pipeline. Describes the support process or type of issues this pipeline manages (e.g., "Customer Support", "Technical Issues").'
  stages:
    lineage:
      - datalake_hubspot_raw.ticket_pipeline.stages
    description: 'JSON array containing all stages within the pipeline including stage IDs, names, and display order. Defines the complete support workflow from ticket creation to resolution.'
  display_order:
    lineage:
      - datalake_hubspot_raw.ticket_pipeline.display_order
    description: 'Numeric order for displaying this pipeline in the HubSpot interface. Determines the sequence when multiple support pipelines are shown in lists and reports.'
  is_archived:
    lineage:
      - datalake_hubspot_raw.ticket_pipeline.archived
    description: 'Boolean flag indicating whether the pipeline has been archived/deactivated. Archived pipelines cannot accept new tickets but preserve historical configuration data.'
  ts_archived:
    lineage:
      - datalake_hubspot_raw.ticket_pipeline.archived_at
    description: 'Timestamp when the pipeline was archived. NULL for active pipelines. Used for tracking pipeline lifecycle and support process evolution.'
  ts_created:
    lineage:
      - datalake_hubspot_raw.ticket_pipeline.created_at
    description: 'Timestamp when the pipeline configuration was created. Indicates when this support process was established and became available for tickets.'
  ts_updated:
    lineage:
      - datalake_hubspot_raw.ticket_pipeline.updated_at
    description: 'Timestamp of the most recent update to pipeline configuration. Used for incremental loading and tracking changes to support process structure.'
  year:
    lineage:
      - datalake_hubspot_raw.ticket_pipeline.year
    description: 'Partition column: Year extracted from the data processing date. Enables time-based analysis of pipeline configuration changes over annual periods.'
  month:
    lineage:
      - datalake_hubspot_raw.ticket_pipeline.month
    description: 'Partition column: Month extracted from the data processing date. Supports monthly tracking of pipeline modifications and support process evolution.'
  day:
    lineage:
      - datalake_hubspot_raw.ticket_pipeline.day
    description: 'Partition column: Day extracted from the data processing date. Provides daily granularity for pipeline configuration change tracking.'