---
database_name: datalake_hubspot_clean
table_name: meeting
description: Every time a meeting in HubSpot is created or updated, a new row is created in this table (limited to the most recent per day).
domain: Rede
owner: gustavo.miller@quintoandar.com.br
columns:
  id_meeting:
    lineage:
      - datalake_hubspot_raw.meeting.id
    description: Id of the meeting in HubSpot
  properties:
    lineage:
      - datalake_hubspot_raw.meeting.properties
    description: String containing a JSON, in which the properties are located.
  properties_with_history:
    lineage:
      - datalake_hubspot_raw.meeting.properties_with_history
    description: String containing a JSON, in which the properties (including all of their history of modifications) are located.
  associations:
    lineage:
      - datalake_hubspot_raw.meeting.associations
    description: String containing a JSON, in which the associations are located.
  is_archived:
    lineage:
      - datalake_hubspot_raw.meeting.archived
    description: True if the object has been archived in HubSpot.
  ts_archived:
    lineage:
      - datalake_hubspot_raw.meeting.archived_at
    description: Timestamp of when the object was archived in HubSpot.
  ts_created:
    lineage:
      - datalake_hubspot_raw.meeting.created_at
    description: Timestamp of when the object was created in HubSpot.
  ts_updated:
    lineage:
      - datalake_hubspot_raw.meeting.updated_at
    description: Timestamp of when the object was updated in HubSpot.
  year:
    lineage:
      - datalake_hubspot_raw.meeting.year
    description: Year of when the object was updated in HubSpot.
  month:
    lineage:
      - datalake_hubspot_raw.meeting.month
    description: Month of when the object was updated in HubSpot.
  day:
    lineage:
      - datalake_hubspot_raw.meeting.day
    description: Day of when the object was updated in HubSpot.
