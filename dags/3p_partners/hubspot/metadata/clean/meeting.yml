---
database_name: datalake_hubspot_clean
table_name: meeting
description: |
  HubSpot Meeting objects represent scheduled and completed meeting activities tracked in the CRM. Meetings 
  include details like agenda, attendees, outcomes, notes, and follow-up actions. This table captures all 
  meeting activities essential for sales engagement analysis, customer relationship tracking, and productivity measurement.
domain: 3P Partners
owner: vitor.musachio@quintoandar.com.br
columns:
  id_meeting:
    lineage:
      - datalake_hubspot_raw.meeting.id
    description: 'Unique identifier for the meeting activity record in HubSpot. Primary key used for tracking specific meeting interactions and associating meetings with contacts, companies, and deals.'
  properties:
    lineage:
      - datalake_hubspot_raw.meeting.properties
    description: 'JSON object containing all meeting properties including subject, start/end times, attendees, meeting type, notes, outcomes, and custom fields. Contains complete meeting details and results.'
  properties_with_history:
    lineage:
      - datalake_hubspot_raw.meeting.properties_with_history
    description: 'JSON object containing historical values of meeting properties with timestamps. Tracks modifications to meeting details, outcomes, and follow-up actions for comprehensive activity tracking.'
  associations:
    lineage:
      - datalake_hubspot_raw.meeting.associations
    description: 'JSON object containing associations to contacts, companies, deals, and tickets. Links meetings to CRM records for complete customer engagement context and relationship tracking.'
  is_archived:
    lineage:
      - datalake_hubspot_raw.meeting.archived
    description: 'Boolean flag indicating whether the meeting record has been archived/deleted. Archived meetings are preserved for historical analysis but excluded from active reporting.'
  ts_archived:
    lineage:
      - datalake_hubspot_raw.meeting.archived_at
    description: 'Timestamp when the meeting record was archived. NULL for active meetings. Used for data retention policies and understanding meeting activity lifecycle management.'
  ts_created:
    lineage:
      - datalake_hubspot_raw.meeting.created_at
    description: 'Timestamp when the meeting activity was scheduled/logged in HubSpot. Critical for sales activity analysis, engagement frequency tracking, and understanding customer interaction patterns.'
  ts_updated:
    lineage:
      - datalake_hubspot_raw.meeting.updated_at
    description: 'Timestamp of the most recent update to any meeting property. Used for incremental data loading and tracking meeting record modifications for scheduling and outcome analysis.'
  year:
    lineage:
      - datalake_hubspot_raw.meeting.year
    description: 'Partition column: Year extracted from the data processing date. Enables annual analysis of meeting activity trends and year-over-year engagement performance comparison.'
  month:
    lineage:
      - datalake_hubspot_raw.meeting.month
    description: 'Partition column: Month extracted from the data processing date. Supports monthly meeting volume analysis, seasonal engagement patterns, and team productivity tracking.'
  day:
    lineage:
      - datalake_hubspot_raw.meeting.day
    description: 'Partition column: Day extracted from the data processing date. Provides daily granularity for meeting activity analysis and real-time sales engagement monitoring.'