---
database_name: datalake_hubspot_clean
table_name: deal_pipeline
owner: vitor.musachio@quintoandar.com.br
domain: 3P Partners
description: |
  HubSpot Deal Pipeline objects define the stages and workflow configuration for sales opportunities. 
  Pipelines structure the sales process with sequential stages that deals progress through from creation 
  to closure. This table contains pipeline configurations essential for sales process analysis and performance tracking.
columns:
  id_pipeline:
    lineage:
      - datalake_hubspot_raw.deal_pipeline.id
    description: 'Unique identifier for the deal pipeline configuration. Primary key used for associating deals with their specific sales process workflow.'
  label:
    lineage:
      - datalake_hubspot_raw.deal_pipeline.label
    description: 'Human-readable name of the deal pipeline. Describes the sales process or type of deals this pipeline is designed to manage (e.g., "Sales Pipeline", "Partner Pipeline").'
  stages:
    lineage:
      - datalake_hubspot_raw.deal_pipeline.stages
    description: 'JSON array containing all stages within the pipeline including stage IDs, names, probabilities, and display order. Defines the complete sales workflow and progression path.'
  display_order:
    lineage:
      - datalake_hubspot_raw.deal_pipeline.display_order
    description: 'Numeric order for displaying this pipeline in the HubSpot interface. Determines the sequence when multiple pipelines are shown in lists and reports.'
  is_archived:
    lineage:
      - datalake_hubspot_raw.deal_pipeline.archived
    description: 'Boolean flag indicating whether the pipeline has been archived/deactivated. Archived pipelines cannot accept new deals but preserve historical configuration data.'
  ts_archived:
    lineage:
      - datalake_hubspot_raw.deal_pipeline.archived_at
    description: 'Timestamp when the pipeline was archived. NULL for active pipelines. Used for tracking pipeline lifecycle and sales process evolution.'
  ts_created:
    lineage:
      - datalake_hubspot_raw.deal_pipeline.created_at
    description: 'Timestamp when the pipeline configuration was created. Indicates when this sales process was established and became available for deals.'
  ts_updated:
    lineage:
      - datalake_hubspot_raw.deal_pipeline.updated_at
    description: 'Timestamp of the most recent update to pipeline configuration. Used for incremental loading and tracking changes to sales process structure.'
  year:
    lineage:
      - datalake_hubspot_raw.deal_pipeline.year
    description: 'Partition column: Year extracted from the data processing date. Enables time-based analysis of pipeline configuration changes over annual periods.'
  month:
    lineage:
      - datalake_hubspot_raw.deal_pipeline.month
    description: 'Partition column: Month extracted from the data processing date. Supports monthly tracking of pipeline modifications and sales process evolution.'
  day:
    lineage:
      - datalake_hubspot_raw.deal_pipeline.day
    description: 'Partition column: Day extracted from the data processing date. Provides daily granularity for pipeline configuration change tracking.'