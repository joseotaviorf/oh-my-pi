database_name: datalake_3p_demand_views
table_name: offers
description: View of offers data that consolidates related information. It will be used to test the semantic layer datasets.
domain: 3P Partners
owner: vitor.musachio@quintoandar.com.br
columns:
  sk_offer:
    lineage:
    - dw_sale.fact_offers.sk_offer
    description: ID of offer
  sk_sale_flow:
    lineage:
    - dw_sale.fact_offers.sk_sale_flow
    description: ID of sale flow
  sk_booking:
    lineage:
    - dw_sale.fact_offers.sk_booking
    description: ID of booking that originated the offer
  sk_buyer:
    lineage:
    - dw_sale.fact_offers.sk_buyer
    description: ID user of the buyer
  sk_owner:
    lineage:
    - dw_sale.fact_offers.sk_owner
    description: ID user of the seller
  sk_house:
    lineage:
    - dw_sale.fact_offers.sk_house
    description: ID of house
  sk_user_agent:
    lineage:
    - dw_sale.fact_offers.sk_user_agent
    description: ID user of agent associated with the offer. Can be joined with dw_public.dim_agent.id_user or dw_public.dim_user.sk_user
  sk_agent:
    lineage:
    - dw_sale.fact_offers.sk_agent
    description: ID (not id_user) of agent associated with the offer. Can be joined with dw_public.dim_agent.sk_agent or dw_public.dim_user.dados_agente_id
  sk_consultant:
    lineage:
    - dw_sale.fact_offers.sk_consultant
    description: ID of the consultant that managed the offer negotiation, formed by "ID_VENDAS_" or "ID_MONDAY_" concatenated with the id of their respective platforms.
  sk_user_consultant:
    lineage:
    - dw_sale.fact_offers.sk_user_consultant
    description: ID user of consultant that managed the offer negotiation. Can be joined with dw_public.dim_user.sk_user
  sk_closing_specialist:
    lineage:
    - dw_sale.fact_offers.sk_closing_specialist
    description: ID user of the closing specialyst
  sk_user_team_lead:
    lineage:
    - dw_sale.fact_offers.sk_user_team_lead
    description: ID user of team lead associated with the offer. Can be joined with dw_public.dim_user.sk_user
  sk_business_unit:
    lineage:
    - dw_sale.fact_offers.sk_business_unit
    description: ID of the business unit.
  sk_region:
    lineage:
    - dw_sale.fact_offers.sk_region
    description: ID of house region
  sk_company_supply:
    lineage:
    - dw_sale.fact_offers.sk_company_supply
    description: Surrogate Key of the company in Rede QuintoAndar associated with the house. Can be joined with dw_rede.dim_company.
  sk_company_demand:
    lineage:
    - datalake_company.company_sks.sk_company
    description: Surrogate Key of the company in Rede QuintoAndar associated with the agent. Can be joined with dw_rede.dim_company.
  business_model:
    lineage:
    - datalake_visit.visit_business_model.business_model
    description: Business model associated with the visit.
  company_name_supply:
    lineage:
    - dw_public.dim_company_3p_partners.company_name
    description: Name of the supply company.
  hubspot_company_tag_supply:
    lineage:
    - dw_public.dim_company_3p_partners.hubspot_company_tag
    description: Hubspot company tag for the supply company.
  company_name_demand:
    lineage:
    - dw_public.dim_company_3p_partners.company_name
    description: Name of the demand company.
  hubspot_company_tag_demand:
    lineage:
    - dw_public.dim_company_3p_partners.hubspot_company_tag
    description: Hubspot company tag for the demand company.
  is_buyer_first_offer:
    lineage:
    - dw_sale.fact_offers.is_buyer_first_offer
    description: True if the offer is the first offer of the user's life
  is_house_first_offer:
    lineage:
    - dw_sale.fact_offers.is_house_first_offer
    description: True if the offer is the first offer received by the house
  has_3p_access_control:
    description: Flag indicating if the business model has 3P access control.
  days_sale_agreement_created_to_sale_agreement_signed:
    lineage:
    - dw_sale.fact_offers.days_sale_agreement_created_to_sale_agreement_signed
    description: Number of days between the creation of the sale agreement and the signature of the sale agreement
  days_offer_accepted_to_sale_agreement_signed:
    lineage:
    - dw_sale.fact_offers.days_offer_accepted_to_sale_agreement_signed
    description: Number of days between the offer acceptance and the signature of the sale agreement
  days_offer_accepted_to_sale_agreement_created:
    lineage:
    - dw_sale.fact_offers.days_offer_accepted_to_sale_agreement_created
    description: Number of days between the offer acceptance and the creation of the sale agreement
  days_offer_accepted_to_offer_dismissed:
    lineage:
    - dw_sale.fact_offers.days_offer_accepted_to_offer_dismissed
    description: Number of days between the offer acceptance and the offer refusal
  days_offer_submitted_to_offer_accepted:
    lineage:
    - dw_sale.fact_offers.days_offer_submitted_to_offer_accepted
    description: Number of days between the offer submission and the offer acceptance
  days_offer_submitted_to_sale_agreement_created:
    lineage:
    - dw_sale.fact_offers.days_offer_submitted_to_sale_agreement_created
    description: Number of days between the offer submission and the creation of the sale agreement
  days_offer_submitted_to_offer_dismissed:
    lineage:
    - dw_sale.fact_offers.days_offer_submitted_to_offer_dismissed
    description: Number of days between the offer submission and the offer refusal
  days_offer_submitted_to_sale_agreement_signed:
    lineage:
    - dw_sale.fact_offers.days_offer_submitted_to_sale_agreement_signed
    description: Number of days between the offer submission and the signature of the sale agreement
  hours_booking_to_offer:
    lineage:
    - dw_sale.fact_offers.hours_booking_to_offer
    description: Hours between the visit booked and the offer submission
  ts_offer_submitted:
    lineage:
    - dw_sale.fact_offers.ts_offer_submitted
    description: Timestamp of offer submission
  ts_offer_accepted:
    lineage:
    - dw_sale.fact_offers.ts_offer_accepted
    description: Timestamp of offer acceptance
  ts_offer_dismissed:
    lineage:
    - dw_sale.fact_offers.ts_offer_dismissed
    description: Timestamp of offer rejection or offer dismissed
  ts_offer_rescued:
    lineage:
    - dw_sale.fact_offers.ts_offer_rescued
    description: Timestamp of offer rescued
  ts_sale_agreement_created:
    lineage:
    - dw_sale.fact_offers.ts_sale_agreement_created
    description: Timestamp of sale agreement creation
  ts_sale_agreement_signed:
    lineage:
    - dw_sale.fact_offers.ts_sale_agreement_signed
    description: Timestamp of sale agreement signature
  ts_seller_fup:
    lineage:
    - dw_sale.fact_offers.ts_seller_fup
    description: Date when the Closing Analyst sent a message to the Seller.
  ts_load:
    lineage:
    - dw_sale.fact_offers.ts_load
    description: Timestamp of when the table was last loaded
