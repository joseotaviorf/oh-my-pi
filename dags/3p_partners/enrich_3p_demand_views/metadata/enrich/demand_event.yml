database_name: datalake_3p_demand_views
table_name: demand_event
description: View of demand event data that consolidates demand event information. It will be used to test the semantic layer datasets.
domain: 3P Partners
owner: vitor.musachio@quintoandar.com.br
columns:
  sk_sale_demand_event:
    lineage:
    - dw_sale.fact_sale_demand_event.sk_sale_demand_event
    description: Primary key of the event, autogenerated incremental number from the source fact table.
  sk_event_date:
    lineage:
    - dw_sale.fact_sale_demand_event.sk_event_date
    description: Date key of when the event happened. Can be joined with dw_public.dim_date.
  sk_event_type:
    lineage:
    - dw_sale.fact_sale_demand_event.sk_event_type
    description: Key of the type of event. Can be joined with dw_sale.dim_sale_event_type.
  sk_booking:
    lineage:
    - dw_sale.fact_sale_demand_event.sk_booking
    description: Key of the associated booking.
  sk_visit:
    lineage:
    - dw_sale.fact_sale_demand_event.sk_visit
    description: Key of the associated visit.
  sk_offer:
    lineage:
    - dw_sale.fact_sale_demand_event.sk_offer
    description: Key of the associated offer.
  sk_house:
    lineage:
    - dw_sale.fact_sale_demand_event.sk_house
    description: Key of the associated house.
  sk_region:
    lineage:
    - dw_sale.fact_sale_demand_event.sk_region
    description: Key of the associated house's region.
  sk_buyer:
    lineage:
    - dw_sale.fact_sale_demand_event.sk_buyer
    description: Key of the buyer's user. Can be joined with dw_public.dim_user.
  sk_seller:
    lineage:
    - dw_sale.fact_sale_demand_event.sk_seller
    description: Key of the seller's user. Can be joined with dw_public.dim_user.
  sk_agent:
    lineage:
    - dw_sale.fact_sale_demand_event.sk_agent
    description: 'Key of the agent. Can be joined with dw_public.dim_agent. Note: this is NOT the key of the user, so it cannot be joined with the primary key of dim_user. However, it can be joined with dw_public.dim_user.dados_agente_id. However, that is not recommended, since dim_user is much bigger than dim_agent, reducing performance.'
  sk_agent_work_contract:
    lineage:
    - dw_sale.fact_sale_demand_event.sk_agent_work_contract
    description: 'Key of the agent''s work contract at the start of the funnel. It can be joined with dw_agent.dim_work_contract. Note: this is not the same as id_work_contract, and cannot be joined with any table other than the dimension previously stated. That is because dim_work_contract includes the contract, but also aggregate contextual information, such as if the agent is active on Main, and the business context (Sale, Rent or both).'
  sk_business_unit:
    lineage:
    - dw_sale.fact_sale_demand_event.sk_business_unit
    description: Key of the agent's business context at the start of the funnel. There are no associated dimensions yet, but it can be joined with datalake_hub_services_clean.business_unit.
  sk_company_supply:
    lineage:
    - dw_sale.fact_sale_demand_event.sk_company_supply
    description: Key of the listing's origin company in Rede Supply, if that is the case. It can be joined with dw_public.dim_company or dw_public.dim_company_3p_partners.
  sk_company_demand:
    lineage:
    - datalake_company.company_sks.sk_company
    description: Key of the agent's company in Rede Demand at the start of the funnel, if that is the case. It can be joined with dw_public.dim_company or dw_public.dim_company_3p_partners.
  sk_secretariat_booking_creator:
    lineage:
    - dw_sale.fact_sale_demand_event.sk_secretariat_booking_creator
    description: Surrogate key of the secretariat who created the booking. Can be joined with dw_secretariat.dim_secretariat_user_version, on field sk_secretariat_user_version. This allows you to see information about the secretariat in the moment of the creation, such as their team allocation.
  sk_secretariat_on_event:
    lineage:
    - dw_sale.fact_sale_demand_event.sk_secretariat_on_event
    description: Surrogate key of the secretariat who was associated with the buyer on the date of the event. Can be joined with dw_secretariat.dim_secretariat_user_version, on field sk_secretariat_user_version. This allows you to see information about the secretariat in the moment of the event, such as their team allocation.
  sk_last_secretariat:
    lineage:
    - dw_sale.fact_sale_demand_event.sk_last_secretariat
    description: Surrogate key of the secretariat who was last associated with the buyer. Can be joined with dw_secretariat.dim_secretariat_user_version, on field sk_secretariat_user_version.
  sk_buyer_prospect_type:
    lineage:
    - dw_sale.fact_sale_demand_event.sk_buyer_prospect_type
    description: Surrogate key of the buyer prospect type. Can be joined with dw_sale.dim_buyer_prospect_type.
  sk_listing_price_segment:
    lineage:
    - dw_sale.fact_sale_demand_event.sk_listing_price_segment
    description: Surrogate key of the listing price segment. Can be joined with dw_sale.dim_sale_price_segment.
  business_model:
    lineage:
    - datalake_visit.visit_business_model.business_model
    description: Business model associated with the visit.
  event_name:
    lineage:
    - dw_sale.dim_sale_event_type.event_name
    description: Name of the event type.
  event_abbreviation:
    lineage:
    - dw_sale.dim_sale_event_type.abbreviation
    description: Abbreviated name of the event type.
  event_stage:
    lineage:
    - dw_sale.dim_sale_event_type.stage
    description: Stage of the funnel where the event occurs.
  company_name_supply:
    lineage:
    - dw_public.dim_company_3p_partners.company_name
    description: Name of the listing's origin company in Rede Supply.
  hubspot_company_tag_supply:
    lineage:
    - dw_public.dim_company_3p_partners.hubspot_company_tag
    description: Hubspot company tag for the supply company.
  company_name_demand:
    lineage:
    - dw_public.dim_company_3p_partners.company_name
    description: Name of the agent's company in Rede Demand.
  hubspot_company_tag_demand:
    lineage:
    - dw_public.dim_company_3p_partners.hubspot_company_tag
    description: Hubspot company tag for the demand company.
  has_3p_access_control:
    lineage:
    - datalake_visit.visit_business_model.business_model
    description: Whether the event has 3P access control.
  year:
    lineage:
    - dw_sale.fact_sale_demand_event.year
    description: Year of when the event happened.
  month:
    lineage:
    - dw_sale.fact_sale_demand_event.month
    description: Month of when the event happened.
  day:
    lineage:
    - dw_sale.fact_sale_demand_event.day
    description: Day of when the event happened.
  ts_event:
    lineage:
    - dw_sale.fact_sale_demand_event.ts_event
    description: Timestamp of when the event happened, in UTC.
  ts_load:
    lineage:
    - dw_sale.fact_sale_demand_event.ts_load
    description: Timestamp of when the table loaded a given row.