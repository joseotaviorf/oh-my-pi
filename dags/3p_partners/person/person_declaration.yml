dag:
  name: person
  schedule_start_date: 2023, 1, 1
  schedule_interval: 0 21 * * *
  owner: Data Rede
  documentation:
    dag_purpose: This DAG imports the tables from Person, a service that centralizes natural person data.
workflow:
  type: cdc
  layer: raw
  custom_schema: person
  database_type: postgres
  source_database: person
  source_schema: public
  default_partitions: [year, month, day]
  tables_customization:
    address: {}
    contact_info: {}
    credential_reference: {}
    identity_document: {}
    person_identity: {}
    person: {}
    preference_settings: {}
    right_to_be_forgotten: {}
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
cluster:
  type: databricks_12_2_med_general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}