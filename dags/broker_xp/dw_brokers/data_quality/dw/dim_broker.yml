---
table_name: dw_brokers.dim_broker
alert_channel: GROWTH_ALERTS
table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error

column_level_validations:
  sk_broker:
    is_complete:
      severity_level: Error
    is_unique:
      severity_level: Error
  account_manager:
    custom:
      # Ensure account_manager emails belong to the @quintoandar domain (NULLs are ignored — no owner mapping).
      constraint: |-
        (SELECT COUNT(*)
         FROM dw_brokers.dim_broker
         WHERE account_manager IS NOT NULL
           AND LOWER(account_manager) NOT LIKE '%@quintoandar.%'
        ) = 0
      severity_level: Warning
  account_manager_for_sale:
    custom:
      constraint: |-
        (SELECT COUNT(*)
         FROM dw_brokers.dim_broker
         WHERE account_manager_for_sale IS NOT NULL
           AND LOWER(account_manager_for_sale) NOT LIKE '%@quintoandar.%'
        ) = 0
      severity_level: Warning
  account_manager_for_rent:
    custom:
      constraint: |-
        (SELECT COUNT(*)
         FROM dw_brokers.dim_broker
         WHERE account_manager_for_rent IS NOT NULL
           AND LOWER(account_manager_for_rent) NOT LIKE '%@quintoandar.%'
        ) = 0
      severity_level: Warning
  account_manager_consistent_across_duplicate_cnpj:
    custom:
      # Among brokers sharing the same CNPJ, those linked to hubspot_brokers_history with a declared
      # owner (id_hubspot_owner IS NOT NULL, is_current = TRUE) must all have the same account_manager.
      # Brokers not present in hubspot_brokers_history, or present but without an owner, legitimately
      # have account_manager = NULL and are excluded from this check.
      # Inconsistent values indicate a regression in the is_current grain in hubspot_brokers_history.
      constraint: |-
        (SELECT COUNT(*) FROM (
          SELECT db.cnpj
          FROM dw_brokers.dim_broker AS db
          INNER JOIN datalake_brokers.hubspot_brokers_history AS hbh
            ON db.sk_broker = hbh.sk_broker
            AND hbh.is_current
            AND hbh.id_hubspot_owner IS NOT NULL
          WHERE db.cnpj IS NOT NULL
          GROUP BY db.cnpj
          HAVING COUNT(DISTINCT db.account_manager) > 1
        ) AS inconsistent_am) = 0
      severity_level: Warning
  has_3p_access_control:
    custom:
      # is_complete would fail on the SCD "-1" unknown-member row the framework injects on every
      # full-extraction run for dim tables (DefaultRowAdditionPipeline); all non-key columns are
      # null on that row by design, so it is excluded here instead of via is_complete.
      constraint: |-
        (SELECT COUNT(*) FROM dw_brokers.dim_broker
         WHERE sk_broker != '-1'
           AND has_3p_access_control IS NULL
        ) = 0
      severity_level: Error
  qt_active_agents:
    custom:
      # Same "-1" sentinel-row exclusion as has_3p_access_control above.
      constraint: |-
        (SELECT COUNT(*) FROM dw_brokers.dim_broker
         WHERE sk_broker != '-1'
           AND qt_active_agents IS NULL
        ) = 0
      severity_level: Error
  qt_active_agents_in_lead_gen:
    custom:
      # Same "-1" sentinel-row exclusion as has_3p_access_control above.
      constraint: |-
        (SELECT COUNT(*) FROM dw_brokers.dim_broker
         WHERE sk_broker != '-1'
           AND qt_active_agents_in_lead_gen IS NULL
        ) = 0
      severity_level: Error
  qt_active_broker_admins:
    custom:
      # Same "-1" sentinel-row exclusion as has_3p_access_control above.
      constraint: |-
        (SELECT COUNT(*) FROM dw_brokers.dim_broker
         WHERE sk_broker != '-1'
           AND qt_active_broker_admins IS NULL
        ) = 0
      severity_level: Error
  has_active_agents_in_lead_gen:
    custom:
      # Same "-1" sentinel-row exclusion as has_3p_access_control above.
      constraint: |-
        (SELECT COUNT(*) FROM dw_brokers.dim_broker
         WHERE sk_broker != '-1'
           AND has_active_agents_in_lead_gen IS NULL
        ) = 0
      severity_level: Error
  ts_load:
    custom:
      # Same "-1" sentinel-row exclusion as has_3p_access_control above.
      constraint: |-
        (SELECT COUNT(*) FROM dw_brokers.dim_broker
         WHERE sk_broker != '-1'
           AND ts_load IS NULL
        ) = 0
      severity_level: Error