---
table_name: dw_brokers.dim_broker
alert_channel: "#alerts-de-airflow-dags"

table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error

column_level_validations:
  sk_broker:
    is_complete:
      severity_level: Error
    is_unique:
      severity_level: Error
  account_manager:
    custom:
      # Ensure account_manager emails belong to the @quintoandar domain (NULLs are ignored — no owner mapping).
      constraint: |-
        (SELECT COUNT(*)
         FROM dw_brokers.dim_broker
         WHERE account_manager IS NOT NULL
           AND LOWER(account_manager) NOT LIKE '%@quintoandar.%'
        ) = 0
      severity_level: Warning
  has_3p_access_control:
    is_complete:
      severity_level: Error
  qt_active_agents:
    is_complete:
      severity_level: Error
  qt_active_agents_in_lead_gen:
    is_complete:
      severity_level: Error
  qt_active_broker_admins:
    is_complete:
      severity_level: Error
  has_active_agents_in_lead_gen:
    is_complete:
      severity_level: Error
  ts_load:
    is_complete:
      severity_level: Error
  year:
    is_complete:
      severity_level: Error
  month:
    is_complete:
      severity_level: Error
  day:
    is_complete:
      severity_level: Error