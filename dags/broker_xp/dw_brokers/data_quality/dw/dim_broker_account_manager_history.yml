---
table_name: dw_brokers.dim_broker_account_manager_history
alert_channel: GROWTH_ALERTS
table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error

column_level_validations:
  sk_broker_account_manager_history:
    is_complete:
      severity_level: Error
    is_unique:
      severity_level: Error
  sk_broker:
    custom:
      # is_complete would fail on the SCD "-1" unknown-member row the framework injects on every
      # full-extraction run for dim tables (DefaultRowAdditionPipeline); all non-key columns are
      # null on that row by design, so it is excluded here instead of via is_complete.
      constraint: |-
        (SELECT COUNT(*) FROM dw_brokers.dim_broker_account_manager_history
         WHERE sk_broker_account_manager_history != '-1'
           AND sk_broker IS NULL
        ) = 0
      severity_level: Error
  has_3p_access_control:
    custom:
      # Same "-1" sentinel-row exclusion as above.
      constraint: |-
        (SELECT COUNT(*) FROM dw_brokers.dim_broker_account_manager_history
         WHERE sk_broker_account_manager_history != '-1'
           AND has_3p_access_control IS NULL
        ) = 0
      severity_level: Error
  ts_load:
    custom:
      # Same "-1" sentinel-row exclusion as above.
      constraint: |-
        (SELECT COUNT(*) FROM dw_brokers.dim_broker_account_manager_history
         WHERE sk_broker_account_manager_history != '-1'
           AND ts_load IS NULL
        ) = 0
      severity_level: Error
  year:
    custom:
      # Same "-1" sentinel-row exclusion as above.
      constraint: |-
        (SELECT COUNT(*) FROM dw_brokers.dim_broker_account_manager_history
         WHERE sk_broker_account_manager_history != '-1'
           AND year IS NULL
        ) = 0
      severity_level: Error
  month:
    custom:
      # Same "-1" sentinel-row exclusion as above.
      constraint: |-
        (SELECT COUNT(*) FROM dw_brokers.dim_broker_account_manager_history
         WHERE sk_broker_account_manager_history != '-1'
           AND month IS NULL
        ) = 0
      severity_level: Error
  day:
    custom:
      # Same "-1" sentinel-row exclusion as above.
      constraint: |-
        (SELECT COUNT(*) FROM dw_brokers.dim_broker_account_manager_history
         WHERE sk_broker_account_manager_history != '-1'
           AND day IS NULL
        ) = 0
      severity_level: Error
  ts_start:
    custom:
      # Same "-1" sentinel-row exclusion as above.
      constraint: |-
        (SELECT COUNT(*) FROM dw_brokers.dim_broker_account_manager_history
         WHERE sk_broker_account_manager_history != '-1'
           AND ts_start IS NULL
        ) = 0
      severity_level: Error
  sk_user_account_manager:
    custom:
      # Same "-1" sentinel-row exclusion as above.
      constraint: |-
        (SELECT COUNT(*) FROM dw_brokers.dim_broker_account_manager_history
         WHERE sk_broker_account_manager_history != '-1'
           AND sk_user_account_manager IS NULL
        ) = 0
      severity_level: Error
  account_manager:
    custom:
      # Ensure account_manager emails belong to the @quintoandar domain (NULLs are ignored — no owner mapping).
      constraint: |-
        (SELECT COUNT(*)
         FROM dw_brokers.dim_broker_account_manager_history
         WHERE account_manager IS NOT NULL
           AND LOWER(account_manager) NOT LIKE '%@quintoandar.%'
        ) = 0
      severity_level: Warning
  business_context:
    custom:
      # Same "-1" sentinel-row exclusion as above.
      constraint: |-
        (SELECT COUNT(*) FROM dw_brokers.dim_broker_account_manager_history
         WHERE sk_broker_account_manager_history != '-1'
           AND business_context IS NULL
        ) = 0
      severity_level: Error
  version:
    custom:
      # Same "-1" sentinel-row exclusion as above.
      constraint: |-
        (SELECT COUNT(*) FROM dw_brokers.dim_broker_account_manager_history
         WHERE sk_broker_account_manager_history != '-1'
           AND version IS NULL
        ) = 0
      severity_level: Error
  is_current:
    custom:
      # Combines the "-1" sentinel exclusion (see above) with the pre-existing at-most-one-current
      # -per-lane check, since a column can only have one `custom` entry.
      constraint: |-
        (SELECT COUNT(*) FROM dw_brokers.dim_broker_account_manager_history
         WHERE sk_broker_account_manager_history != '-1'
           AND is_current IS NULL
        ) = 0
        AND (SELECT COUNT(*) FROM (
          SELECT
            sk_broker,
            business_context,
            COUNT(*) AS cnt
          FROM
            dw_brokers.dim_broker_account_manager_history
          WHERE
            is_current
          GROUP BY
            sk_broker,
            business_context
          HAVING
            COUNT(*) > 1
        ) AS dup_current) = 0
      severity_level: Error
