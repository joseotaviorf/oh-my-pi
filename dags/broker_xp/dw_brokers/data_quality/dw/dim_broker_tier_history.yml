---
table_name: dw_brokers.dim_broker_tier_history
alert_channel: GROWTH_ALERTS
table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error

column_level_validations:
  sk_broker_tier_history:
    is_complete:
      severity_level: Error
    is_unique:
      severity_level: Error
  sk_broker:
    custom:
      # is_complete would fail on the SCD "-1" unknown-member row the framework injects on every
      # full-extraction run for dim tables (DefaultRowAdditionPipeline); all non-key columns are
      # null on that row by design, so it is excluded here instead of via is_complete.
      constraint: |-
        (SELECT COUNT(*) FROM dw_brokers.dim_broker_tier_history
         WHERE sk_broker_tier_history != '-1'
           AND sk_broker IS NULL
        ) = 0
      severity_level: Error
  sk_broker_product:
    custom:
      # Same "-1" sentinel-row exclusion as above.
      constraint: |-
        (SELECT COUNT(*) FROM dw_brokers.dim_broker_tier_history
         WHERE sk_broker_tier_history != '-1'
           AND sk_broker_product IS NULL
        ) = 0
      severity_level: Error
  id_tier:
    custom:
      # Same "-1" sentinel-row exclusion as above.
      constraint: |-
        (SELECT COUNT(*) FROM dw_brokers.dim_broker_tier_history
         WHERE sk_broker_tier_history != '-1'
           AND id_tier IS NULL
        ) = 0
      severity_level: Error
  has_3p_access_control:
    custom:
      # Same "-1" sentinel-row exclusion as above.
      constraint: |-
        (SELECT COUNT(*) FROM dw_brokers.dim_broker_tier_history
         WHERE sk_broker_tier_history != '-1'
           AND has_3p_access_control IS NULL
        ) = 0
      severity_level: Error
  ts_load:
    custom:
      # Same "-1" sentinel-row exclusion as above.
      constraint: |-
        (SELECT COUNT(*) FROM dw_brokers.dim_broker_tier_history
         WHERE sk_broker_tier_history != '-1'
           AND ts_load IS NULL
        ) = 0
      severity_level: Error
  year:
    custom:
      # Same "-1" sentinel-row exclusion as above.
      constraint: |-
        (SELECT COUNT(*) FROM dw_brokers.dim_broker_tier_history
         WHERE sk_broker_tier_history != '-1'
           AND year IS NULL
        ) = 0
      severity_level: Error
  month:
    custom:
      # Same "-1" sentinel-row exclusion as above.
      constraint: |-
        (SELECT COUNT(*) FROM dw_brokers.dim_broker_tier_history
         WHERE sk_broker_tier_history != '-1'
           AND month IS NULL
        ) = 0
      severity_level: Error
  day:
    custom:
      # Same "-1" sentinel-row exclusion as above.
      constraint: |-
        (SELECT COUNT(*) FROM dw_brokers.dim_broker_tier_history
         WHERE sk_broker_tier_history != '-1'
           AND day IS NULL
        ) = 0
      severity_level: Error
  ts_start:
    custom:
      # Same "-1" sentinel-row exclusion as above.
      constraint: |-
        (SELECT COUNT(*) FROM dw_brokers.dim_broker_tier_history
         WHERE sk_broker_tier_history != '-1'
           AND ts_start IS NULL
        ) = 0
      severity_level: Error
  version:
    custom:
      # Same "-1" sentinel-row exclusion as above.
      constraint: |-
        (SELECT COUNT(*) FROM dw_brokers.dim_broker_tier_history
         WHERE sk_broker_tier_history != '-1'
           AND version IS NULL
        ) = 0
      severity_level: Error
  is_current:
    custom:
      # Same "-1" sentinel-row exclusion as above.
      constraint: |-
        (SELECT COUNT(*) FROM dw_brokers.dim_broker_tier_history
         WHERE sk_broker_tier_history != '-1'
           AND is_current IS NULL
        ) = 0
      severity_level: Error