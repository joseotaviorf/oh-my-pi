database_name: dw_brokers
table_name: dim_brokers
description: |
  Data warehouse dimension for 3P broker companies from core_brokers.brokers, enriched with HubSpot
  current owner mapped to person SK, and active profile counts from core_brokers.brokers_profile
  (third_party_agent and company_admin by business context).
domain: Broker XP
owner: vitor.musachio@quintoandar.com.br
columns:
  sk_broker:
    lineage:
      - core_brokers.brokers.sk_broker
    description: Surrogate key identifying the broker; primary key of this dimension.
  sk_person_account_manager:
    lineage:
      - datalake_person.person_sks.sk_person
    description: |
      Surrogate key of the HubSpot owner (current hubspot_brokers_history row) mapped to Person when
      available; -1 when there is no owner or no person mapping.
  broker_name:
    lineage:
      - core_brokers.brokers.broker_name
    description: Legal or registered broker company name from core brokers.
  broker_trade_name:
    lineage:
      - core_brokers.brokers.broker_trade_name
    description: Trade name of the broker company from core brokers.
  broker_status:
    lineage:
      - core_brokers.brokers.broker_status
    description: Current broker status in the core brokers model.
  broker_address:
    lineage:
      - core_brokers.brokers.broker_address
    description: Street address of the broker headquarters from core brokers.
  broker_number:
    lineage:
      - core_brokers.brokers.broker_number
    description: Street number for the broker address from core brokers.
  broker_complement:
    lineage:
      - core_brokers.brokers.broker_complement
    description: Address complement for the broker headquarters from core brokers.
  broker_city:
    lineage:
      - core_brokers.brokers.broker_city
    description: City of the broker address from core brokers.
  broker_state:
    lineage:
      - core_brokers.brokers.broker_state
    description: State of the broker address from core brokers.
  broker_country:
    lineage:
      - core_brokers.brokers.broker_country
    description: Country of the broker address from core brokers.
  broker_zip_code:
    lineage:
      - core_brokers.brokers.broker_zip_code
    description: Postal code of the broker address from core brokers.
  creci:
    lineage:
      - core_brokers.brokers.creci
    description: CRECI registration when available from core brokers.
  cnpj:
    lineage:
      - core_brokers.brokers.cnpj
    description: Brazilian company taxpayer id (CNPJ) for the broker from core brokers.
  qt_active_agents:
    lineage:
      - core_brokers.brokers_profile.sk_broker_profile
    description: |
      Count of active brokers_profile rows with profile third_party_agent for the broker
      (profile_status ACTIVE).
  qt_active_sale_agents:
    lineage:
      - core_brokers.brokers_profile.sk_broker_profile
    description: |
      Count of active third_party_agent profiles with business_context SALE for the broker.
  qt_active_rent_agents:
    lineage:
      - core_brokers.brokers_profile.sk_broker_profile
    description: |
      Count of active third_party_agent profiles with business_context RENT for the broker.
  qt_active_broker_admins:
    lineage:
      - core_brokers.brokers_profile.sk_broker_profile
    description: |
      Count of active brokers_profile rows with profile company_admin for the broker.
  is_3p_rent_broker:
    lineage:
      - core_brokers.brokers.is_3p_rent_broker
    description: Flag indicating 3P rent broker from core brokers.
  is_3p_sale_broker:
    lineage:
      - core_brokers.brokers.is_3p_sale_broker
    description: Flag indicating 3P sale broker from core brokers.
  is_3p_active_broker:
    lineage:
      - core_brokers.brokers.is_3p_active_broker
    description: Flag indicating active 3P broker from core brokers.
  is_3p_active_rent_broker:
    lineage:
      - core_brokers.brokers.is_3p_active_rent_broker
    description: Flag indicating active 3P rent broker from core brokers.
  is_3p_active_sale_broker:
    lineage:
      - core_brokers.brokers.is_3p_active_sale_broker
    description: Flag indicating active 3P sale broker from core brokers.
  has_3p_access_control:
    description: |
      Boolean flag indicating that this row is subject to 3P Partners access control policies;
      always true in this table.
  ts_broker_created:
    lineage:
      - core_brokers.brokers.ts_broker_created
    description: |
      Timestamp when the broker company record was created in core brokers (exposed as ts_broker_created in DW).
  ts_broker_updated:
    lineage:
      - core_brokers.brokers.ts_broker_updated
    description: |
      Timestamp when the broker company record was last updated in core brokers (exposed as ts_broker_updated in DW).
  ts_load:
    description: Timestamp when this DW row was loaded by the ETL process.
  year:
    lineage:
      - core_brokers.brokers.ts_updated
    description: Partition year from broker last update timestamp.
  month:
    lineage:
      - core_brokers.brokers.ts_updated
    description: Partition month from broker last update timestamp.
  day:
    lineage:
      - core_brokers.brokers.ts_updated
    description: Partition day from broker last update timestamp.