database_name: dw_brokers
table_name: dim_broker
description: |
  Data warehouse dimension for 3P broker companies from core_brokers.brokers, enriched with HubSpot
  current owner mapped to person SK, active profile counts from core_brokers.brokers_profile
  (third_party_agent and company_admin), passive lead-gen agent counts from datalake_ebdb_clean.agent_data,
  and last membership transition timestamps derived from datalake_brokers.broker_status_history
  (overall and Rede Rent / Rede Sale product lanes). Per-business-context SALE/RENT agent counts from
  brokers_profile are not exposed on this table.
domain: Broker XP
owner: vitor.musachio@quintoandar.com.br
columns:
  sk_broker:
    lineage:
      - core_brokers.brokers.sk_broker
    description: Surrogate key identifying the broker; primary key of this dimension.
  sk_person_account_manager:
    lineage:
      - datalake_person.person_sks.sk_person
    description: |
      Surrogate key of the HubSpot owner (current hubspot_brokers_history row) mapped to Person when
      available; -1 when there is no owner or no person mapping.
  broker_name:
    lineage:
      - core_brokers.brokers.broker_name
    description: Legal or registered broker company name from core brokers.
  broker_trade_name:
    lineage:
      - core_brokers.brokers.broker_trade_name
    description: Trade name of the broker company from core brokers.
  broker_name_tag:
    lineage:
      - core_brokers.brokers.broker_name_tag
    description: |
      Normalized broker name (no accents, no whitespace; case preserved).
  broker_trade_name_tag:
    lineage:
      - core_brokers.brokers.broker_trade_name_tag
    description: |
      Normalized broker trade name (no accents, no whitespace; case preserved).
  broker_address:
    lineage:
      - core_brokers.brokers.broker_address
    description: Street address of the broker headquarters from core brokers.
  broker_number:
    lineage:
      - core_brokers.brokers.broker_number
    description: Street number for the broker address from core brokers.
  broker_complement:
    lineage:
      - core_brokers.brokers.broker_complement
    description: Address complement for the broker headquarters from core brokers.
  broker_city:
    lineage:
      - core_brokers.brokers.broker_city
    description: City of the broker address from core brokers.
  broker_state:
    lineage:
      - core_brokers.brokers.broker_state
    description: State of the broker address from core brokers.
  broker_country:
    lineage:
      - core_brokers.brokers.broker_country
    description: Country of the broker address from core brokers.
  broker_zip_code:
    lineage:
      - core_brokers.brokers.broker_zip_code
    description: Postal code of the broker address from core brokers.
  creci:
    lineage:
      - core_brokers.brokers.creci
    description: CRECI registration when available from core brokers.
  cnpj:
    lineage:
      - core_brokers.brokers.cnpj
    description: Brazilian company taxpayer id (CNPJ) for the broker from core brokers.
  qt_active_agents:
    lineage:
      - core_brokers.brokers_profile.sk_broker_profile
    description: |
      Count of active brokers_profile rows with profile third_party_agent for the broker
      (profile_status ACTIVE), without splitting by business_context.
  qt_active_agents_in_lead_gen:
    lineage:
      - datalake_ebdb_clean.agent_data.id
      - datalake_ebdb_clean.agent_data.uuid_company
    description: |
      Count of active passive lead-receiver Rede agents (agent_type CORRETOR_REDE, is_active, is_passive_lead_receiver)
      for the broker company uuid_company from agent_data.
  qt_active_broker_admins:
    lineage:
      - core_brokers.brokers_profile.sk_broker_profile
    description: |
      Count of active brokers_profile rows with profile company_admin for the broker.
  is_3p_rent_broker:
    lineage:
      - core_brokers.brokers.is_3p_rent_broker
    description: Flag indicating 3P rent broker from core brokers.
  is_3p_sale_broker:
    lineage:
      - core_brokers.brokers.is_3p_sale_broker
    description: Flag indicating 3P sale broker from core brokers.
  is_3p_active_broker:
    lineage:
      - core_brokers.brokers.is_3p_active_broker
    description: Flag indicating active 3P broker from core brokers.
  is_3p_active_rent_broker:
    lineage:
      - core_brokers.brokers.is_3p_active_rent_broker
    description: Flag indicating active 3P rent broker from core brokers.
  is_3p_active_sale_broker:
    lineage:
      - core_brokers.brokers.is_3p_active_sale_broker
    description: Flag indicating active 3P sale broker from core brokers.
  has_active_agents_in_lead_gen:
    lineage:
      - datalake_ebdb_clean.agent_data.uuid_company
      - core_brokers.brokers.uuid_company
    description: |
      True when at least one matching passive lead-receiver agent row exists in agent_data for the broker uuid_company.
  has_general_operation_area:
    lineage:
      - core_brokers.brokers_product.general_region_list
    description: |
      Broker-level flag, independent of product. True when this broker has at least one region
      registered with purpose GENERAL_OPERATION_AREA in company_product_region for any of its
      products — i.e. the imobiliaria is allowed to publish listings in at least one region.
  has_agent_operation_area:
    lineage:
      - core_brokers.brokers_product.agent_region_list
    description: |
      Broker-level flag, independent of product. True when this broker has at least one region
      registered with purpose AGENT_OPERATION_AREA in company_product_region for any of its
      products — i.e. the imobiliaria's agents are allowed to operate in at least one region.
  has_rent_general_operation_area:
    lineage:
      - core_brokers.brokers_product.business_context
      - core_brokers.brokers_product.general_region_list
    description: |
      True when this broker has at least one region registered with purpose
      GENERAL_OPERATION_AREA on a RENT product — i.e. the imobiliaria is allowed to publish
      RENT listings in at least one region.
  has_rent_agent_operation_area:
    lineage:
      - core_brokers.brokers_product.business_context
      - core_brokers.brokers_product.agent_region_list
    description: |
      True when this broker has at least one region registered with purpose
      AGENT_OPERATION_AREA on a RENT product — i.e. the imobiliaria's agents are allowed to
      operate on RENT in at least one region.
  has_sale_general_operation_area:
    lineage:
      - core_brokers.brokers_product.business_context
      - core_brokers.brokers_product.general_region_list
    description: |
      True when this broker has at least one region registered with purpose
      GENERAL_OPERATION_AREA on a SALE product — i.e. the imobiliaria is allowed to publish
      SALE listings in at least one region.
  has_sale_agent_operation_area:
    lineage:
      - core_brokers.brokers_product.business_context
      - core_brokers.brokers_product.agent_region_list
    description: |
      True when this broker has at least one region registered with purpose
      AGENT_OPERATION_AREA on a SALE product — i.e. the imobiliaria's agents are allowed to
      operate on SALE in at least one region.
  has_3p_access_control:
    description: |
      Boolean flag indicating that this row is subject to 3P Partners access control policies;
      always true in this table.
  ts_last_membership_start:
    lineage:
      - datalake_brokers.broker_status_history.ts_start
      - datalake_brokers.broker_status_history.broker_status
    description: |
      Latest ts_start where broker_status is ACTIVE in broker_status_history for the broker (any product lane).
  ts_last_membership_end:
    lineage:
      - datalake_brokers.broker_status_history.ts_start
      - datalake_brokers.broker_status_history.broker_status
      - datalake_brokers.broker_status_history.is_current
    description: |
      Latest ts_start where broker_status is INACTIVE and is_current is true in broker_status_history for the broker.
  ts_last_rent_membership_start:
    lineage:
      - datalake_brokers.broker_status_history.ts_start
      - datalake_brokers.broker_status_history.product_name
      - datalake_brokers.broker_status_history.broker_status
    description: |
      Latest ts_start where broker_status is ACTIVE and product_name is Rede Rent in broker_status_history.
  ts_last_rent_membership_end:
    lineage:
      - datalake_brokers.broker_status_history.ts_start
      - datalake_brokers.broker_status_history.product_name
      - datalake_brokers.broker_status_history.broker_status
      - datalake_brokers.broker_status_history.is_current
    description: |
      Latest ts_start where broker_status is INACTIVE, is_current is true, and product_name is Rede Rent.
  ts_last_sale_membership_start:
    lineage:
      - datalake_brokers.broker_status_history.ts_start
      - datalake_brokers.broker_status_history.product_name
      - datalake_brokers.broker_status_history.broker_status
    description: |
      Latest ts_start where broker_status is ACTIVE and product_name is Rede Sale in broker_status_history.
  ts_last_sale_membership_end:
    lineage:
      - datalake_brokers.broker_status_history.ts_start
      - datalake_brokers.broker_status_history.product_name
      - datalake_brokers.broker_status_history.broker_status
      - datalake_brokers.broker_status_history.is_current
    description: |
      Latest ts_start where broker_status is INACTIVE, is_current is true, and product_name is Rede Sale.
  ts_broker_created:
    lineage:
      - core_brokers.brokers.ts_broker_created
    description: |
      Timestamp when the broker company record was created in core brokers (exposed as ts_broker_created in DW).
  ts_broker_updated:
    lineage:
      - core_brokers.brokers.ts_broker_updated
    description: |
      Timestamp when the broker company record was last updated in core brokers (exposed as ts_broker_updated in DW).
  ts_load:
    description: Timestamp when this DW row was loaded by the ETL process.
  year:
    lineage:
      - core_brokers.brokers.ts_broker_updated
    description: Partition year from broker last update timestamp (ts_broker_updated).
  month:
    lineage:
      - core_brokers.brokers.ts_broker_updated
    description: Partition month from broker last update timestamp (ts_broker_updated).
  day:
    lineage:
      - core_brokers.brokers.ts_broker_updated
    description: Partition day from broker last update timestamp (ts_broker_updated).