database_name: dw_brokers
table_name: dim_broker_regions
description: |
  Bridge dimension linking each core_brokers.brokers_product row to regions parsed from region_list,
  enriched with attributes from core_region.region. One row per broker product and region id token.
  Z-ordered on sk_broker_region to enable data skipping when filtering by broker-region surrogate key.
domain: Broker XP
owner: vitor.musachio@quintoandar.com.br
columns:
  sk_broker_region:
    lineage:
      - core_brokers.brokers_product.sk_broker_product
      - core_brokers.brokers_product.region_list
    description: |
      Surrogate key for the broker-product-to-region relationship; CONCAT_WS with separator 0 between
      sk_broker_product and sk_region, where sk_region is the token from EXPLODE(SPLIT(region_list, ',')).
      Filter on this column to benefit from z-order data skipping.
  sk_broker:
    lineage:
      - core_brokers.brokers_product.sk_broker
    description: Surrogate key of the parent broker.
  sk_region:
    lineage:
      - core_brokers.brokers_product.region_list
      - core_region.region.id_region
    description: |
      Region identifier token from the comma-separated region_list, matched to core_region.region.id_region
      on join.
  product_name:
    lineage:
      - core_brokers.brokers_product.product_name
    description: Product name from core brokers product for the row owning the region list.
  business_context:
    lineage:
      - core_brokers.brokers_product.business_context
    description: |
      Product business context from core brokers_product (e.g. SALE, RENT), same as the source row for the region list.
  region_name:
    lineage:
      - core_region.region.region_name
    description: Region display name from the Region core model when join succeeds.
  city_region_name:
    lineage:
      - core_region.region.city_region_name
    description: City region name from the Region core model.
  level:
    lineage:
      - core_region.region.level
    description: Region hierarchy level (e.g. Cidade, MacroRegiao, SubRegiao) from Region core model.
  greater_region:
    lineage:
      - core_region.region.greater_region
    description: Greater region grouping from the Region core model.
  state_name:
    lineage:
      - core_region.region.state_name
    description: State name associated with the region from Region core model.
  state_abbreviation:
    lineage:
      - core_region.region.state_abbreviation
    description: State abbreviation from Region core model.
  country_name:
    lineage:
      - core_region.region.country_name
    description: Country name from Region core model.
  country_default_timezone:
    lineage:
      - core_region.region.country_default_timezone
    description: Default timezone for the country from Region core model.
  has_general_operation_area:
    lineage:
      - core_brokers.brokers_product.general_region_list
    description: |
      Boolean flag indicating that this (broker_product, region) pair is registered with
      purpose GENERAL_OPERATION_AREA in company_product_region — i.e. the imobiliaria is
      allowed to publish listings in this region for the given product. Computed via
      ARRAY_CONTAINS on the comma-separated general_region_list from core brokers_product.
  has_agent_operation_area:
    lineage:
      - core_brokers.brokers_product.agent_region_list
    description: |
      Boolean flag indicating that this (broker_product, region) pair is registered with
      purpose AGENT_OPERATION_AREA in company_product_region — i.e. the imobiliaria's
      agents are allowed to operate in this region for the given product. Computed via
      ARRAY_CONTAINS on the comma-separated agent_region_list from core brokers_product.
  has_3p_access_control:
    description: |
      Boolean flag indicating that this row is subject to 3P Partners access control policies;
      always true in this table.
  ts_load:
    description: Timestamp when this DW row was loaded by the ETL process.