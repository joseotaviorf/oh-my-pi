database_name: dw_brokers
table_name: dim_broker_profile_history
description: |
  Data warehouse dimension for 3P broker member profiles from core_brokers.brokers_profile, keyed by
  sk_broker_profile_history (same value as core sk_broker_profile), with person SK from person_sks,
  profile type and status flags, effective intervals per uuid_person and profile ordered by profile creation
  time (is_current, ts_end via LEAD), and sequential version per person and profile.
domain: Broker XP
owner: vitor.musachio@quintoandar.com.br
columns:
  sk_broker_profile_history:
    lineage:
      - core_brokers.brokers_profile.sk_broker_profile
    description: |
      Surrogate key of the broker profile row from core brokers (exposed with _history suffix for DW naming
      consistency); primary key of this dimension.
  sk_broker:
    lineage:
      - core_brokers.brokers_profile.sk_broker
    description: |
      Surrogate key of the parent broker company when present on the profile; -1 when missing in core.
  sk_person:
    lineage:
      - core_brokers.brokers_profile.uuid_person
      - datalake_person.person_sks.sk_person
    description: |
      Surrogate key of the natural person when uuid_person maps in person_sks; -1 when unmapped.
  profile:
    lineage:
      - core_brokers.brokers_profile.profile
    description: |
      Profile role from core brokers_profile (e.g. third_party_agent, company_admin).
  profile_status:
    lineage:
      - core_brokers.brokers_profile.profile_status
    description: Status of the profile enrollment in core brokers_profile (e.g. ACTIVE, INACTIVE).
  is_active_profile:
    lineage:
      - core_brokers.brokers_profile.profile_status
    description: True when profile_status equals ACTIVE for this row.
  is_agent:
    lineage:
      - core_brokers.brokers_profile.profile
    description: True when profile equals third_party_agent.
  is_broker_admin:
    lineage:
      - core_brokers.brokers_profile.profile
    description: True when profile equals company_admin.
  version:
    lineage:
      - core_brokers.brokers_profile.uuid_person
      - core_brokers.brokers_profile.profile
      - core_brokers.brokers_profile.ts_profile_created
    description: |
      Sequential version of profile rows for the same uuid_person and profile, ordered by ts_profile_created
      and sk_broker_profile.
  is_current:
    lineage:
      - core_brokers.brokers_profile.uuid_person
      - core_brokers.brokers_profile.profile
      - core_brokers.brokers_profile.ts_profile_created
    description: |
      True when this row is the latest ts_profile_created for the same uuid_person and profile in the ordered stream.
  has_3p_access_control:
    description: |
      Boolean flag indicating that this row is subject to 3P Partners access control policies; always true.
  ts_start:
    lineage:
      - core_brokers.brokers_profile.ts_profile_created
    description: Start of the profile period; profile creation timestamp from core brokers_profile.
  ts_end:
    lineage:
      - core_brokers.brokers_profile.ts_profile_created
    description: |
      End of the period (start of next row for same person and profile); null when this row is current.
  ts_load:
    description: Timestamp when this DW row was loaded by the ETL process.
  year:
    lineage:
      - core_brokers.brokers_profile.ts_profile_created
    description: Partition year from profile creation timestamp.
  month:
    lineage:
      - core_brokers.brokers_profile.ts_profile_created
    description: Partition month from profile creation timestamp.
  day:
    lineage:
      - core_brokers.brokers_profile.ts_profile_created
    description: Partition day from profile creation timestamp.