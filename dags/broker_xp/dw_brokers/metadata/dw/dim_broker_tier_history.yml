database_name: dw_brokers
table_name: dim_broker_tier_history
description: |
  Data warehouse dimension of broker product tier assignment periods (SCD2 history). Rows are derived from distinct
  tier id changes in core_brokers.broker_tiers_history (ev_id_tier), versioned per sk_broker_product
  and enriched with tier_name from datalake_company_clean.tier when the tier id resolves.
domain: Broker XP
owner: vitor.musachio@quintoandar.com.br
columns:
  sk_broker_tier_history:
    lineage:
      - core_brokers.broker_tiers_history.sk_company_product
      - core_brokers.broker_tiers_history.ts_transaction
    description: |
      Surrogate string key for the tier assignment period, built from sk_broker_product and sequential version within the broker product.
  sk_broker:
    lineage:
      - core_brokers.brokers_product.sk_broker
    description: Surrogate key of the parent broker for this tier period.
  sk_broker_product:
    lineage:
      - core_brokers.broker_tiers_history.sk_company_product
      - core_brokers.brokers_product.sk_broker_product
    description: Surrogate key of the broker product row for this tier period.
  id_tier:
    lineage:
      - core_brokers.broker_tiers_history.value
    description: |
      Tier identifier at the start of this period (from transactional tier_id via history value column).
  tier_name:
    lineage:
      - datalake_company_clean.tier.tier_name
    description: |
      Human-readable tier name from the clean tier catalog when the id_tier matches a tier row; null if
      no matching tier exists.
  version:
    lineage:
      - core_brokers.broker_tiers_history.ts_transaction
    description: |
      Sequential version of the tier assignment for the broker product, ordered by ts_transaction at each
      distinct tier change.
  is_current:
    lineage:
      - core_brokers.broker_tiers_history.ts_transaction
    description: |
      True when this row is the latest tier period for the broker product (no later ts_transaction in the
      filtered change stream).
  has_3p_access_control:
    description: |
      Boolean flag indicating that this row is subject to 3P Partners access control policies; always true
      in this table.
  ts_start:
    lineage:
      - core_brokers.broker_tiers_history.ts_transaction
    description: Start timestamp of the tier period (first observation of this tier id for the product).
  ts_end:
    lineage:
      - core_brokers.broker_tiers_history.ts_transaction
    description: |
      End timestamp of the period (start of the next tier change); null while the assignment is current.
  ts_load:
    description: Timestamp when this DW row was loaded by the ETL process.
  year:
    lineage:
      - core_brokers.broker_tiers_history.ts_transaction
    description: Partition year from period start (ts_start).
  month:
    lineage:
      - core_brokers.broker_tiers_history.ts_transaction
    description: Partition month from period start (ts_start).
  day:
    lineage:
      - core_brokers.broker_tiers_history.ts_transaction
    description: Partition day from period start (ts_start).