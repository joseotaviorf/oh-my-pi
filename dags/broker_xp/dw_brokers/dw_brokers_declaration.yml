dag:
  name: dw_brokers
  schedule_start_date: 2026, 3, 1
  owner: Data Broker XP
  criticality: High
  sla_deadline_localtime: "08:00"
  documentation:
    dag_purpose: |
      DW layer for 3P brokers: dim_broker (broker attributes, Hubspot cluster, active profile counts
      from brokers_profile, passive lead-gen agent counts from agent_data, last membership timestamps from
      broker_status_history, generic account manager email from the current HubSpot owner plus
      account_manager_for_sale / account_manager_for_rent from product-scoped enrich AM history),
      dim_broker_products (product and fee attributes),
      dim_broker_regions (broker product to region bridge from region_list), dim_broker_status_history
      (status periods from enrich broker_status_history), dim_broker_account_manager_history (HubSpot
      owner change periods per broker and business_context from
      datalake_brokers.broker_account_manager_history, resolved to enrich user
      datalake_ebdb_user.user via owner.uuid_person ↔ user.uuid_person and exposing the account manager
      email),
      dim_broker_profile_history (member profiles from core brokers_profile with person SK and effective
      intervals per person and profile type), dim_broker_tier_history (tier assignment periods per
      broker product from core_brokers.broker_tiers_history joined to datalake_company_clean.tier),
      dim_broker_integrator_partner_history (integrator partner UUID periods from
      core_brokers.broker_products_history resolved to company name via datalake_company_clean.company).
      Upstreams: core_brokers, core_brokers_history (broker_tiers_history, broker_products_history),
      core_region, datalake_brokers (hubspot_brokers_history, broker_status_history,
      broker_account_manager_history),
      datalake_company_clean (tier, company), datalake_hubspot.owner, datalake_ebdb_user.user,
      datalake_person.person_sks (consumed by dim_broker_profile_history),
      datalake_ebdb_clean.agent_data.
      Schedule after enrich_brokers, core_brokers_history, and core upstreams in Airflow.
workflow:
  type: query_delta
  layer: dw
  custom_schema: brokers
  default_extraction_type: full
  tables_customization:
    dim_broker:
      criticality: Critical
      partitions: []
      z_order_by: [sk_broker]
    dim_broker_products:
      partitions: []
      z_order_by: [sk_broker_product]
    dim_broker_regions:
      partitions: []
      z_order_by: [sk_broker_region]
    dim_broker_status_history:
      partitions: [year, month, day]
      z_order_by: [sk_broker]
    dim_broker_account_manager_history:
      partitions: [year, month, day]
      z_order_by: [sk_broker, business_context]
    dim_broker_profile_history:
      partitions: [year, month, day]
      z_order_by: [sk_broker]
    dim_broker_tier_history:
      partitions: [year, month, day]
      z_order_by: [sk_broker_product]
    dim_broker_integrator_partner_history:
      partitions: [year, month, day]
      z_order_by: [sk_broker_product]
