dag:
  name: dw_brokers
  schedule_start_date: 2026, 3, 1
  owner: Data Broker XP
  documentation:
    dag_purpose: |
      DW layer for 3P brokers: dim_broker (broker attributes, Hubspot cluster, active profile counts
      from brokers_profile, passive lead-gen agent counts from agent_data, last membership timestamps from
      broker_status_history, account manager email from the current HubSpot owner; no per-business-context
      SALE/RENT agent counts on this table),
      dim_broker_products (product and fee attributes),
      dim_broker_regions (broker product to region bridge from region_list), dim_broker_status_history
      (status periods from enrich broker_status_history), dim_broker_account_manager_history (HubSpot
      owner change periods per broker from hubspot_brokers_history, resolved to enrich user
      datalake_ebdb_user.user via owner.uuid_person ↔ user.uuid_person and exposing the account manager
      email),
      dim_broker_profile_history (member profiles from core brokers_profile with person SK and effective
      intervals per person and profile type), dim_broker_tier_history (tier assignment periods per
      broker product from core_brokers.broker_tiers_history joined to datalake_company_clean.tier),
      dim_broker_integrator_partner_history (integrator partner UUID periods from
      core_brokers.broker_products_history resolved to company name via datalake_company_clean.company),
      and dim_company_3p_partners (legacy partner-company dimension in dw_public describing QuintoAndar's
      Rede Companies enriched with HubSpot information; kept in the dw_public schema while the rest of
      the DAG outputs to dw_brokers).
      Upstreams: core_brokers, core_brokers_history (broker_tiers_history, broker_products_history),
      core_region, datalake_brokers (hubspot_brokers_history, broker_status_history),
      datalake_company_clean (tier, company), datalake_hubspot.owner, datalake_ebdb_user.user,
      datalake_person.person_sks (consumed by dim_broker_profile_history),
      datalake_ebdb_clean.agent_data.
      Schedule after enrich_brokers, core_brokers_history, and core upstreams in Airflow.
workflow:
  type: query_delta
  layer: dw
  custom_schema: brokers
  tables_customization:
    dim_broker:
      partitions: [year, month, day]
      merge_on: [sk_broker]
      z_order_by: [sk_broker]
      table_privileges:
        3p-readers:
          - SELECT
        data-engineers:
          - ALL PRIVILEGES
      row_filter_column_key: has_3p_access_control
      row_filter: has_3p_access
    dim_broker_products:
      partitions: [year, month, day]
      merge_on: [sk_broker_product]
      z_order_by: [sk_broker_product]
      table_privileges:
        3p-readers:
          - SELECT
        data-engineers:
          - ALL PRIVILEGES
      row_filter_column_key: has_3p_access_control
      row_filter: has_3p_access
    dim_broker_regions:
      partitions: []
      merge_on: [sk_broker_region]
      z_order_by: [sk_broker_region]
      table_privileges:
        3p-readers:
          - SELECT
        data-engineers:
          - ALL PRIVILEGES
      row_filter_column_key: has_3p_access_control
      row_filter: has_3p_access
    dim_broker_status_history:
      partitions: [year, month, day]
      merge_on: [sk_broker_status_history]
      z_order_by: [sk_broker]
      table_privileges:
        3p-readers:
          - SELECT
        data-engineers:
          - ALL PRIVILEGES
      row_filter_column_key: has_3p_access_control
      row_filter: has_3p_access
    dim_broker_account_manager_history:
      partitions: [year, month, day]
      merge_on: [sk_broker_account_manager_history]
      z_order_by: [sk_broker]
      table_privileges:
        3p-readers:
          - SELECT
        data-engineers:
          - ALL PRIVILEGES
      row_filter_column_key: has_3p_access_control
      row_filter: has_3p_access
    dim_broker_profile_history:
      partitions: [year, month, day]
      merge_on: [sk_broker_profile_history]
      z_order_by: [sk_broker]
      table_privileges:
        3p-readers:
          - SELECT
        data-engineers:
          - ALL PRIVILEGES
      row_filter_column_key: has_3p_access_control
      row_filter: has_3p_access
    dim_broker_tier_history:
      partitions: [year, month, day]
      merge_on: [sk_broker_tier_history]
      z_order_by: [sk_broker_product]
      table_privileges:
        3p-readers:
          - SELECT
        data-engineers:
          - ALL PRIVILEGES
      row_filter_column_key: has_3p_access_control
      row_filter: has_3p_access
    dim_broker_integrator_partner_history:
      partitions: [year, month, day]
      merge_on: [sk_broker_integrator_partner_history]
      z_order_by: [sk_broker_product]
      table_privileges:
        3p-readers:
          - SELECT
        data-engineers:
          - ALL PRIVILEGES
      row_filter_column_key: has_3p_access_control
      row_filter: has_3p_access
    dim_company_3p_partners:
      custom_schema: public
      table_privileges:
        3p-readers:
          - SELECT
        data-engineers:
          - ALL PRIVILEGES
cluster:
  type: databricks_16_4_med_memory_cluster
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE
  databricks_conn_id: databricks_new_env
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: USER_ISOLATION
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}