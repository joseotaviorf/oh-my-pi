database_name: datalake_visit
table_name: visit_business_model
description: This table contains the business model of the visit with 3P access control indicators, consolidated from visit and visit_business_model tables. It includes both supply-side (house company) and demand-side (agent visitor company) information, with conditional population based on business model type (3P_SUPPLY, 3P_DEMAND, 3P_LEAD_GEN).
domain: Broker XP
owner: vitor.musachio@quintoandar.com.br
columns:
  id_visit:
    lineage:
      - datalake_ebdb_clean.visit.id
    description: The unique identifier of the visit.
  id_visit_business_model:
    lineage:
      - datalake_ebdb_clean.visit_business_model.id
    description: The unique identifier of the visit business model record. Null if no separate business model record exists.
  id_house:
    lineage:
      - datalake_ebdb_clean.visit.id_house
    description: The unique identifier of the house associated with the visit.
  sk_broker_supply:
    lineage:
      - datalake_ebdb_clean.house.uuid_company
      - core_brokers.brokers.uuid_company
    description: The surrogate key of the broker in Rede QuintoAndar associated with the house (supply side). Only populated when business_model LIKE '%3P_SUPPLY%'. Can be joined with dw_brokers.dim_broker.
  sk_broker_demand:
    lineage:
      - datalake_ebdb_clean.visitor.uuid_company
      - core_brokers.brokers.uuid_company
    description: The surrogate key of the broker in Rede QuintoAndar associated with the agent visitor (demand side). Only populated when business_model LIKE '%3P_DEMAND%' OR '%3P_LEAD_GEN%'. Can be joined with dw_brokers.dim_broker.
  id_company_supply:
    description: DEPRECATED - always NULL since the datalake_company.company_sks (enrich_company) deprecation; kept for schema compatibility. Use sk_broker_supply and dw_brokers.dim_broker instead.
  id_company_demand:
    description: DEPRECATED - always NULL since the datalake_company.company_sks (enrich_company) deprecation; kept for schema compatibility. Use sk_broker_demand and dw_brokers.dim_broker instead.
  partner_3p_supply:
    lineage:
      - core_brokers.brokers.broker_name
      - datalake_ebdb_listing.house.uuid_company
    description: The name of the 3P broker partner in Rede QuintoAndar associated with the house (supply side). Only populated when business_model LIKE '%3P_SUPPLY%'. Same broker as sk_broker_supply (dw_brokers.dim_broker).
  partner_3p_demand:
    lineage:
      - core_brokers.brokers.broker_name
      - datalake_ebdb_clean.visitor.uuid_company
    description: The name of the 3P broker partner in Rede QuintoAndar associated with the agent visitor (demand side). Only populated when business_model LIKE '%3P_DEMAND%' OR '%3P_LEAD_GEN%'. Retrieved from visitor where type = 'Agent', using the most recent record per visit. Same broker as sk_broker_demand (dw_brokers.dim_broker).
  business_model:
    lineage:
      - datalake_ebdb_clean.visit_business_model.business_model
      - datalake_ebdb_clean.visit.business_model
    description: The business model of the visit. Coalesces from visit_business_model.business_model first, then visit.business_model if null.
  is_3p_supply:
    lineage:
      - datalake_ebdb_clean.visit_business_model.business_model
      - datalake_ebdb_clean.visit.business_model
    description: Boolean flag indicating whether the business model includes 3P_SUPPLY. Derived from business_model LIKE '%3P_SUPPLY%'.
  is_3p_demand:
    lineage:
      - datalake_ebdb_clean.visit_business_model.business_model
      - datalake_ebdb_clean.visit.business_model
    description: Boolean flag indicating whether the business model includes 3P_DEMAND. Derived from business_model LIKE '%3P_DEMAND%'.
  is_3p_lead_gen:
    lineage:
      - datalake_ebdb_clean.visit_business_model.business_model
      - datalake_ebdb_clean.visit.business_model
    description: Boolean flag indicating whether the business model includes 3P_LEAD_GEN. Derived from business_model LIKE '%3P_LEAD_GEN%'.
  has_3p_access_control:
    lineage:
      - datalake_ebdb_clean.visit_business_model.business_model
      - datalake_ebdb_clean.visit.business_model
    description: Boolean flag indicating whether the business model has any 3P access control. Derived from business_model LIKE '%3P%'.
  ts_business_model_created:
    lineage:
      - datalake_ebdb_clean.visit_business_model.ts_created
    description: The timestamp when the visit_business_model record was created. Null if no separate business model record exists.
  ts_visit_created:
    lineage:
      - datalake_ebdb_clean.visit.ts_created
    description: The timestamp when the visit record was created.
  ts_business_model_updated:
    lineage:
      - datalake_ebdb_clean.visit_business_model.ts_updated
    description: The timestamp when the visit_business_model record was last updated. Null if no separate business model record exists.
  ts_visit_updated:
    lineage:
      - datalake_ebdb_clean.visit.ts_updated
    description: The timestamp when the visit record was last updated.