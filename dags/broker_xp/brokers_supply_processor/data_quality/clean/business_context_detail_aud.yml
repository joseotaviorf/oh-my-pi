---
table_name: datalake_brokers_supply_processor_clean.business_context_detail_aud
alert_channel: "#alerts-de-airflow-dags"

table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: -10
    less_than_or_equal_to: 50
    severity_level: Warning

column_level_validations:
  id:
    is_complete:
      severity_level: Error
    custom:
      constraint: "GROUP BY id, rev HAVING COUNT(*) > 1"
      empty_result_is_valid: true
      severity_level: Error
  rev:
    is_complete:
      severity_level: Error
  rev_type:
    is_contained_in:
      values:
        - "0"
        - "1"
        - "2"
      severity_level: Error
  business_context:
    is_contained_in:
      values:
        - SALE
        - RENT
        - SALE_PRIMARY_MARKET
      severity_level: Warning
  status:
    is_contained_in:
      values:
        - RECEIVED
        - WAITING
        - NOT_CONVERTED
        - CONVERTED
        - PROCESSING
        - REGISTERED
        - UNPUBLISHED
        - DISCARDED
        - SUSPENDED
      severity_level: Warning
  year:
    is_complete:
      severity_level: Error
  month:
    is_complete:
      severity_level: Error
    has_min_value:
      min_value: 1
      severity_level: Error
    has_max_value:
      max_value: 12
      severity_level: Error
  day:
    is_complete:
      severity_level: Error
    has_min_value:
      min_value: 1
      severity_level: Error
    has_max_value:
      max_value: 31
      severity_level: Error
