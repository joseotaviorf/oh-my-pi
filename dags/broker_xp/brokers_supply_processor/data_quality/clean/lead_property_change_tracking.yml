---
table_name: datalake_brokers_supply_processor_clean.lead_property_change_tracking
alert_channel: GROWTH_ALERTS
table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: -10
    less_than_or_equal_to: 50
    severity_level: Warning

column_level_validations:
  id_lead_property_change_tracking:
    is_unique:
      severity_level: Error
    is_complete:
      severity_level: Error
  id_lead:
    is_complete:
      severity_level: Error
  ts_created:
    is_complete:
      severity_level: Error
  ts_updated:
    is_complete:
      severity_level: Error
  last_sale_price_change_source:
    is_contained_in:
      values:
        - BSP
        - EXTERNAL
      severity_level: Warning
  last_rent_price_change_source:
    is_contained_in:
      values:
        - BSP
        - EXTERNAL
      severity_level: Warning
  year:
    is_complete:
      severity_level: Error
  month:
    is_complete:
      severity_level: Error
    has_min_value:
      greater_than_or_equal_to: 1
      severity_level: Error
    has_max_value:
      less_than_or_equal_to: 12
      severity_level: Error
  day:
    is_complete:
      severity_level: Error
    has_min_value:
      greater_than_or_equal_to: 1
      severity_level: Error
    has_max_value:
      less_than_or_equal_to: 31
      severity_level: Error
