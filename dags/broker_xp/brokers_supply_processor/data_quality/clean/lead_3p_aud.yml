---
table_name: datalake_brokers_supply_processor_clean.lead_3p_aud
alert_channel: GROWTH_ALERTS
table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: -10
    less_than_or_equal_to: 50
    severity_level: Warning

column_level_validations:
  id:
    is_complete:
      severity_level: Error
  one_row_per_id_and_rev:
    custom:
      # No duplicate rows for the same (id, rev) composite key.
      constraint: "(SELECT COUNT(*) FROM (SELECT 1 FROM datalake_brokers_supply_processor_clean.lead_3p_aud GROUP BY id, rev HAVING COUNT(*) > 1)) = 0"
      severity_level: Error
  rev:
    is_complete:
      severity_level: Error
  ts_created:
    is_complete:
      severity_level: Error
  ts_updated:
    is_complete:
      severity_level: Error
  rev_type:
    is_contained_in:
      values:
        - "0"
        - "1"
        - "2"
      severity_level: Error
  status:
    custom:
      # Aligned with backend-services LeadStatus.java (brokers-supply-processor), plus the retired
      # legacy value QUEUE (2026-01-13, #17184). Null-tolerant: most rows are null because this field
      # is marked DEPRECATED at the app level (status tracking moved to business_context_detail) and
      # is no longer populated on most revisions, on top of the usual Hibernate Envers DELETE-revision
      # nulls — is_contained_in would treat all of that as a violation.
      constraint: |-
        (SELECT COUNT(*) FROM datalake_brokers_supply_processor_clean.lead_3p_aud
         WHERE status IS NOT NULL
           AND status NOT IN ('RECEIVED', 'WAITING', 'NOT_CONVERTED', 'CONVERTED', 'PROCESSING',
                               'REGISTERED', 'UNPUBLISHED', 'DISCARDED', 'SUSPENDED', 'QUEUE')
        ) = 0
      severity_level: Warning
  year:
    is_complete:
      severity_level: Error
  month:
    is_complete:
      severity_level: Error
    has_min_value:
      greater_than_or_equal_to: 1
      severity_level: Error
    has_max_value:
      less_than_or_equal_to: 12
      severity_level: Error
  day:
    is_complete:
      severity_level: Error
    has_min_value:
      greater_than_or_equal_to: 1
      severity_level: Error
    has_max_value:
      less_than_or_equal_to: 31
      severity_level: Error