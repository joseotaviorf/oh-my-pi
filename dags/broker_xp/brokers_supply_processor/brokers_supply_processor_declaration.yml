dag:
  name: brokers_supply_processor
  schedule_start_date: 2021, 8, 10
  schedule_interval: 0 0 * * *
  owner: Data Broker XP
  documentation:
    dag_purpose: |
      CDC pipeline for the Brokers Supply Processor microservice (3P partner lead ingestion).
      Captures property leads, business-context processing status, deduplication locks, merge events,
      and Hibernate Envers audit history from PostgreSQL
      (brokers-supply-processor.db.core-prd.habitat.zone / brokers_supply_processor.public).

      Source repo: backend-services/applications/brokers-supply-processor
      Database documentation: dags/broker_xp/brokers_supply_processor/brokers_supply_processor.md

      DATA LINEAGE: PostgreSQL (OLTP) → Raw Layer → Clean Layer
      SCHEDULE: Daily (00:00 UTC), ~24h CDC latency.
workflow:
  type: cdc
  layer: raw
  database_type: postgres
  custom_schema: brokers_supply_processor
  source_database: brokers_supply_processor
  source_schema: public
  default_partitions: [year, month, day]
  dbutils_secret_key: BROKERS_SUPPLY_PROCESSOR_DB
  tables_customization:
    business_context_detail:
      z_order_by: [id]
    business_context_detail_aud:
      raw_primary_keys: ["id", "rev"]
    lead3p:
      clean_table_name: lead_3p
      z_order_by: [id]
    lead3p_aud:
      clean_table_name: lead_3p_aud
      raw_primary_keys: ["id", "rev"]
    lead_in_flight:
      raw_primary_keys: ["lead_id"]
    lead_update_operation_history:
      z_order_by: [id]
    owner_phone_refresh_tracking:
      z_order_by: [id]
    lead_property_change_tracking:
      raw_z_order_by: [lead_id]
      clean_z_order_by: [id_lead]
      clean_primary_keys: [id_lead_property_change_tracking]
    lead_price_protection_analytics:
      raw_z_order_by: [lead_id]
      clean_z_order_by: [id_lead]
      clean_primary_keys: [id_lead_price_protection_analytics]
    lead_merge_event:
      extraction_type: incremental
      partitions: [year, month, day]
      raw_z_order_by: [existing_lead_uuid]
      clean_z_order_by: [uuid_existing_lead]
      clean_primary_keys: [id_lead_merge_event]
    revinfo:
      clean_table_name: rev_info
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"