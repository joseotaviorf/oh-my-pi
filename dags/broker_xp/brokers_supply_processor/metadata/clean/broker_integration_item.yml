---
database_name: datalake_brokers_supply_processor_clean
table_name: broker_integration_item
owner: vitor.musachio@quintoandar.com.br
domain: Broker XP
description: >
  One row per property listing tracked by a broker integration feed. Stores the partner external
  identifier (broker_source_id), processing status, CREATE/UPDATE operation outcome, payload hash
  for change detection, and the latest enriched payload snapshot. Uniqueness is enforced per
  (id_broker_integration, broker_source_id).

  BUSINESS CONTEXT: Core inventory reconciliation table for CRM/XML integrations. Tracks which partner
  listings are pending, completed, filtered, or deleted, and whether BSP created or updated the
  corresponding lead_3p row.

  RELATED TABLES: broker_integration (id_broker_integration), broker_integration_item_status_entry
  (id_broker_integration_item), lead_3p (join via broker_source_id + company context).
columns:
  id_broker_integration_item:
    lineage:
      - datalake_brokers_supply_processor_raw.broker_integration_item.id
    description: >
      Auto-increment primary key for the integration item (BIGINT, Primary Key, Not Nullable).
  id_broker_integration:
    lineage:
      - datalake_brokers_supply_processor_raw.broker_integration_item.broker_integration_id
    description: >
      Parent broker integration (BIGINT, Foreign Key, Not Nullable).
  broker_source_id:
    lineage:
      - datalake_brokers_supply_processor_raw.broker_integration_item.broker_source_id
    description: >
      Partner external property identifier in the source CRM/XML system (STRING, Not Nullable, max length 255).
  payload_hash:
    lineage:
      - datalake_brokers_supply_processor_raw.broker_integration_item.payload_hash
    description: >
      MD5 hash of the last fetched payload for change detection (STRING, Nullable, max length 255).
      Null until the item is processed at least once.
  latest_payload:
    lineage:
      - datalake_brokers_supply_processor_raw.broker_integration_item.latest_payload
    description: >
      Most recent enriched property payload from the source system (JSON, Nullable). Updated when
      the hash changes; null until first successful enrichment.
  status:
    lineage:
      - datalake_brokers_supply_processor_raw.broker_integration_item.status
    description: >
      Current processing status (STRING, Not Nullable, max length 32). Values include PENDING,
      COMPLETED, ERROR, FILTERED, DELETED, PARTIAL_COMPLETED.
  operation:
    lineage:
      - datalake_brokers_supply_processor_raw.broker_integration_item.operation
    description: >
      Lead mutation outcome on last successful processing (STRING, Nullable, max length 32). CREATE or
      UPDATE; null until the processor completes the first run.
  ts_source_modified:
    lineage:
      - datalake_brokers_supply_processor_raw.broker_integration_item.source_modified_at
    description: >
      Last modification timestamp reported by the source system for this listing (TIMESTAMP, Nullable).
  ts_created:
    lineage:
      - datalake_brokers_supply_processor_raw.broker_integration_item.created_at
    description: >
      Timestamp when the item was first seen (TIMESTAMP, Not Nullable).
  ts_updated:
    lineage:
      - datalake_brokers_supply_processor_raw.broker_integration_item.updated_at
    description: >
      Timestamp of the last item update (TIMESTAMP, Not Nullable).
  year:
    lineage:
      - datalake_brokers_supply_processor_raw.broker_integration_item.year
    description: 'Partition column: year for data lake partitioning (INTEGER, Partition Key).'
  month:
    lineage:
      - datalake_brokers_supply_processor_raw.broker_integration_item.month
    description: 'Partition column: month for data lake partitioning (INTEGER, Partition Key).'
  day:
    lineage:
      - datalake_brokers_supply_processor_raw.broker_integration_item.day
    description: 'Partition column: day for data lake partitioning (INTEGER, Partition Key).'
  op_cdc:
    lineage:
      - datalake_brokers_supply_processor_raw.broker_integration_item.op_cdc
    description: CDC operation type captured by Debezium change-data-capture stream.
    categories:
      r: Read/snapshot - initial load of existing records.
      c: Create - new record inserted.
      u: Update - existing record modified.
      d: Delete - record removed.
  ts_cdc_transaction:
    lineage:
      - datalake_brokers_supply_processor_raw.broker_integration_item.ts_cdc_transaction
    description: Wall-clock timestamp when the CDC connector captured this change event (millisecond precision).
  ts_database_transaction:
    lineage:
      - datalake_brokers_supply_processor_raw.broker_integration_item.ts_database_transaction
    description: Timestamp of the originating database transaction in the source application before CDC propagation.
