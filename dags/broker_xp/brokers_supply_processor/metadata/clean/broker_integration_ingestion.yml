---
database_name: datalake_brokers_supply_processor_clean
table_name: broker_integration_ingestion
owner: vitor.musachio@quintoandar.com.br
domain: Broker XP
description: >
  Tracks a single ingestion run for a broker integration — one scheduled sync, file upload, or
  reprocess batch. Records run status (RUNNING, COMPLETED, PARTIAL, FAILED), row counts, and
  start/finish timestamps. Reprocess ingestions reference the parent run via
  id_parent_broker_integration_ingestion.

  BUSINESS CONTEXT: Batch-level observability for partner feed processing. Enables SLA monitoring,
  partial-run detection (Vista maxItemsPerRun truncation), and reprocess lineage analysis.

  RELATED TABLES: broker_integration (id_broker_integration), broker_integration_ingestion_item
  (id_broker_integration_ingestion).
columns:
  id_broker_integration_ingestion:
    lineage:
      - datalake_brokers_supply_processor_raw.broker_integration_ingestion.id
    description: >
      Auto-increment primary key for the ingestion run (BIGINT, Primary Key, Not Nullable).
  id_broker_integration:
    lineage:
      - datalake_brokers_supply_processor_raw.broker_integration_ingestion.broker_integration_id
    description: >
      Broker integration that owns this ingestion run (BIGINT, Foreign Key, Not Nullable).
  status:
    lineage:
      - datalake_brokers_supply_processor_raw.broker_integration_ingestion.status
    description: >
      Ingestion run status (STRING, Not Nullable, max length 32). Values include RUNNING, COMPLETED,
      PARTIAL, FAILED.
  id_parent_broker_integration_ingestion:
    lineage:
      - datalake_brokers_supply_processor_raw.broker_integration_ingestion.parent_ingestion_id
    description: >
      Parent ingestion ID for REPROCESS runs (BIGINT, Nullable). Null for normal SYNC/UPLOAD ingestions.
  total_rows:
    lineage:
      - datalake_brokers_supply_processor_raw.broker_integration_ingestion.total_rows
    description: >
      Total rows processed in this ingestion run (INTEGER, Nullable). Set on completion.
  ts_started:
    lineage:
      - datalake_brokers_supply_processor_raw.broker_integration_ingestion.started_at
    description: >
      Timestamp when the ingestion run started (TIMESTAMPTZ, Not Nullable).
  ts_finished:
    lineage:
      - datalake_brokers_supply_processor_raw.broker_integration_ingestion.finished_at
    description: >
      Timestamp when the ingestion run finished (TIMESTAMPTZ, Nullable). Null while RUNNING.
  ts_created:
    lineage:
      - datalake_brokers_supply_processor_raw.broker_integration_ingestion.created_at
    description: >
      Record creation timestamp (TIMESTAMPTZ, Not Nullable).
  year:
    lineage:
      - datalake_brokers_supply_processor_raw.broker_integration_ingestion.year
    description: 'Partition column: year for data lake partitioning (INTEGER, Partition Key).'
  month:
    lineage:
      - datalake_brokers_supply_processor_raw.broker_integration_ingestion.month
    description: 'Partition column: month for data lake partitioning (INTEGER, Partition Key).'
  day:
    lineage:
      - datalake_brokers_supply_processor_raw.broker_integration_ingestion.day
    description: 'Partition column: day for data lake partitioning (INTEGER, Partition Key).'
  op_cdc:
    lineage:
      - datalake_brokers_supply_processor_raw.broker_integration_ingestion.op_cdc
    description: CDC operation type captured by Debezium change-data-capture stream.
    categories:
      r: Read/snapshot - initial load of existing records.
      c: Create - new record inserted.
      u: Update - existing record modified.
      d: Delete - record removed.
  ts_cdc_transaction:
    lineage:
      - datalake_brokers_supply_processor_raw.broker_integration_ingestion.ts_cdc_transaction
    description: Wall-clock timestamp when the CDC connector captured this change event (millisecond precision).
  ts_database_transaction:
    lineage:
      - datalake_brokers_supply_processor_raw.broker_integration_ingestion.ts_database_transaction
    description: Timestamp of the originating database transaction in the source application before CDC propagation.
