---
database_name: datalake_brokers_supply_processor_clean
table_name: broker_integration_ingestion_item
owner: vitor.musachio@quintoandar.com.br
domain: Broker XP
description: >
  One row per property listing processed within a broker_integration_ingestion run. Stores the
  source payload (when available), hash, row index for file feeds, per-row processing status, and
  retry scheduling metadata. Lifecycle: PENDING → SKIPPED / COMPLETED / FAILED.

  BUSINESS CONTEXT: Row-level observability for bulk file uploads and sync batches. Supports retry
  analysis, failure triage, and reconciliation between ingestion items and long-lived
  broker_integration_item aggregates.

  RELATED TABLES: broker_integration_ingestion (id_broker_integration_ingestion),
  broker_integration_item (join via broker_source_id + integration context).
columns:
  id_broker_integration_ingestion_item:
    lineage:
      - datalake_brokers_supply_processor_raw.broker_integration_ingestion_item.id
    description: >
      Auto-increment primary key for the ingestion item row (BIGINT, Primary Key, Not Nullable).
  id_broker_integration_ingestion:
    lineage:
      - datalake_brokers_supply_processor_raw.broker_integration_ingestion_item.ingestion_id
    description: >
      Parent ingestion run (BIGINT, Foreign Key, Not Nullable).
  broker_source_id:
    lineage:
      - datalake_brokers_supply_processor_raw.broker_integration_ingestion_item.broker_source_id
    description: >
      Partner external property identifier (STRING, Not Nullable, max length 255).
  row_index:
    lineage:
      - datalake_brokers_supply_processor_raw.broker_integration_ingestion_item.row_index
    description: >
      Zero-based row index within a file upload batch (INTEGER, Nullable). Null for Vista CRM items.
  payload:
    lineage:
      - datalake_brokers_supply_processor_raw.broker_integration_ingestion_item.payload
    description: >
      Property payload for file-feed rows (JSON, Nullable). Null for Vista CRM items where the
      enricher fetches data via API.
  payload_hash:
    lineage:
      - datalake_brokers_supply_processor_raw.broker_integration_ingestion_item.payload_hash
    description: >
      Hash of the row payload for deduplication (STRING, Nullable, max length 255).
  ts_source_modified:
    lineage:
      - datalake_brokers_supply_processor_raw.broker_integration_ingestion_item.source_modified_at
    description: >
      Source modification timestamp for this listing (TIMESTAMPTZ, Nullable).
  status:
    lineage:
      - datalake_brokers_supply_processor_raw.broker_integration_ingestion_item.status
    description: >
      Row processing status (STRING, Not Nullable, max length 32). Values include PENDING, SKIPPED,
      COMPLETED, FAILED.
  status_message:
    lineage:
      - datalake_brokers_supply_processor_raw.broker_integration_ingestion_item.status_message
    description: >
      Failure or informational message when status is FAILED (TEXT, Nullable).
  retry_count:
    lineage:
      - datalake_brokers_supply_processor_raw.broker_integration_ingestion_item.retry_count
    description: >
      Number of retry attempts scheduled for this row (INTEGER, Nullable).
  ts_next_retry:
    lineage:
      - datalake_brokers_supply_processor_raw.broker_integration_ingestion_item.next_retry_at
    description: >
      Scheduled timestamp for the next retry attempt (TIMESTAMPTZ, Nullable).
  ts_created:
    lineage:
      - datalake_brokers_supply_processor_raw.broker_integration_ingestion_item.created_at
    description: >
      Timestamp when the ingestion item was created (TIMESTAMPTZ, Not Nullable).
  ts_updated:
    lineage:
      - datalake_brokers_supply_processor_raw.broker_integration_ingestion_item.updated_at
    description: >
      Timestamp of the last ingestion item update (TIMESTAMPTZ, Not Nullable).
  year:
    lineage:
      - datalake_brokers_supply_processor_raw.broker_integration_ingestion_item.year
    description: 'Partition column: year for data lake partitioning (INTEGER, Partition Key).'
  month:
    lineage:
      - datalake_brokers_supply_processor_raw.broker_integration_ingestion_item.month
    description: 'Partition column: month for data lake partitioning (INTEGER, Partition Key).'
  day:
    lineage:
      - datalake_brokers_supply_processor_raw.broker_integration_ingestion_item.day
    description: 'Partition column: day for data lake partitioning (INTEGER, Partition Key).'
  op_cdc:
    lineage:
      - datalake_brokers_supply_processor_raw.broker_integration_ingestion_item.op_cdc
    description: CDC operation type captured by Debezium change-data-capture stream.
    categories:
      r: Read/snapshot - initial load of existing records.
      c: Create - new record inserted.
      u: Update - existing record modified.
      d: Delete - record removed.
  ts_cdc_transaction:
    lineage:
      - datalake_brokers_supply_processor_raw.broker_integration_ingestion_item.ts_cdc_transaction
    description: Wall-clock timestamp when the CDC connector captured this change event (millisecond precision).
  ts_database_transaction:
    lineage:
      - datalake_brokers_supply_processor_raw.broker_integration_ingestion_item.ts_database_transaction
    description: Timestamp of the originating database transaction in the source application before CDC propagation.
