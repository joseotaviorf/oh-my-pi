---
database_name: datalake_brokers_supply_processor_clean
table_name: lead_update_operation_history
owner: vitor.musachio@quintoandar.com.br
domain: Broker XP
description: >
  Tracks the update operations performed on property leads by external partners in the Rede QuintoAndar ecosystem.
  Each record represents an audit of an operation on a lead, including action type, metadata, user who performed 
  the change, and optional rationale for the update or deletion. Supports change tracking, regulatory audit, 
  and analytics on lead management workflows.

  BUSINESS CONTEXT: Enables transparency and traceability for operations (create, update, delete, etc.) performed 
  on 3P property leads. Used to analyze lead update patterns, monitor partner behavior, support regulatory 
  compliance, and identify potential data quality or operational bottlenecks.

  RELATED TABLES: lead_3p (foreign key: id_lead), business_context_detail (for context of changes),
  analytic_event (for lifecycle event correlation).

columns:
  id:
    lineage:
      - datalake_brokers_supply_processor_raw.lead_update_operation_history.id
    description: >
      Unique auto-incrementing identifier for the lead update operation record (BIGINT, Primary Key, Not Nullable).
      Used for cross-reference and audit log tracking.
  id_lead:
    lineage:
      - datalake_brokers_supply_processor_raw.lead_update_operation_history.lead_id
    description: >
      Reference to the affected property lead in the lead_3p table (BIGINT, Foreign Key, Not Nullable).
      Enables linkage of each operation to the corresponding property lead.
  operation:
    lineage:
      - datalake_brokers_supply_processor_raw.lead_update_operation_history.operation
    description: >
      String indicating the type of operation performed (STRING, Not Nullable).
      Enables classification and filtering of tracked changes.
    categories:
      MERGE_UPDATE: Update resulting from lead merge.
      HOUSE_ENRICHMENT: Property data enrichment by the pipeline.
      ADDRESS_REGION_NORMALIZATION: Lead address and region normalization.
      LEAD_DISCARDED: Lead marked as discarded by the system.
      HOUSE_CREATE_ENRICHMENT: "Legacy: house-create enrichment step, live May-Jun 2026, retired 2026-06-17."
      HOUSE_UPDATE_ENRICHMENT: "Legacy: house-update enrichment step, live May-Jun 2026, retired 2026-06-17."
  metadata:
    lineage:
      - datalake_brokers_supply_processor_raw.lead_update_operation_history.metadata
    description: >
      JSON object containing extra details about the operation, such as changed fields, previous and new values, or auxiliary flags (JSON, Nullable).
      Used for detailed auditing of what was changed in the operation.
      Example: {"field": "price", "old_value": 1000, "new_value": 1200}
  user_identification:
    lineage:
      - datalake_brokers_supply_processor_raw.lead_update_operation_history.user_identification
    description: >
      Identifier for the user or system actor who performed the operation (JSON, Nullable).
      Enables tracking of who made each change; values can include partner user IDs, emails, or system process names.
  reason:
    lineage:
      - datalake_brokers_supply_processor_raw.lead_update_operation_history.reason
    description: >
      Optional free-text explanation or code/reason for why the update was made (STRING, Nullable).
      Used for compliance, traceability, and reporting on changes requiring justification.
  deleted:
    lineage:
      - datalake_brokers_supply_processor_raw.lead_update_operation_history.deleted
    description: >
      String indicating soft deletion of the operation record.
  ts_created:
    lineage:
      - datalake_brokers_supply_processor_raw.lead_update_operation_history.created_at
    description: >
      Timestamp when the operation record was created in the brokers-supply-processor system (TIMESTAMP, Not Nullable).
  ts_updated:
    lineage:
      - datalake_brokers_supply_processor_raw.lead_update_operation_history.updated_at
    description: >
      Timestamp when the operation record was last updated (TIMESTAMP, Not Nullable).
  year:
    lineage:
      - datalake_brokers_supply_processor_raw.lead_update_operation_history.year
    description: 'Partition column: Year extracted from ts_updated for data lake partitioning optimization (INTEGER, Partition Key).'
  month:
    lineage:
      - datalake_brokers_supply_processor_raw.lead_update_operation_history.month
    description: 'Partition column: Month extracted from ts_updated for data lake partitioning optimization (INTEGER, Partition Key).'
  day:
    lineage:
      - datalake_brokers_supply_processor_raw.lead_update_operation_history.day
    description: 'Partition column: Day extracted from ts_updated for data lake partitioning optimization (INTEGER, Partition Key).'
  op_cdc:
    lineage:
      - datalake_brokers_supply_processor_raw.lead_update_operation_history.op_cdc
    description: CDC operation type captured by Debezium change-data-capture stream.
    categories:
      r: Read/snapshot - initial load of existing records.
      c: Create - new record inserted.
      u: Update - existing record modified.
      d: Delete - record removed.
  ts_cdc_transaction:
    lineage:
      - datalake_brokers_supply_processor_raw.lead_update_operation_history.ts_cdc_transaction
    description: Wall-clock timestamp when the CDC connector captured this change event (millisecond precision).
  ts_database_transaction:
    lineage:
      - datalake_brokers_supply_processor_raw.lead_update_operation_history.ts_database_transaction
    description: Timestamp of the originating database transaction in the source application before CDC propagation.