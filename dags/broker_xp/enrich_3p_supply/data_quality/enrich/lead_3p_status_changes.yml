---
table_name: datalake_3p_supply.lead_3p_status_changes
alert_channel: "#alerts-de-airflow-dags"

table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: 0
    less_than_or_equal_to: 20
    severity_level: Warning

column_level_validations:
  id_lead_3p:
    is_complete:
      severity_level: Error
  business_context:
    is_complete:
      severity_level: Error
    is_contained_in:
      values: ["SALE", "RENT", "SALE_PRIMARY_MARKET"]
      severity_level: Error
  status:
    is_complete:
      severity_level: Error
  reason_macro:
    is_complete:
      severity_level: Error
    is_contained_in:
      values: ["DUPLICATED", "NO_OPERATIONAL_INTEREST", "PHOTOS", "OWNER_INFO", "LISTING_INFO", "OTHER", "N/A"]
      severity_level: Error
    custom:
      # Alert when any currently-active status maps to 'OTHER': it means status_reason
      # is non-empty but contains keys not yet mapped to a known macro bucket
      # (DUPLICATED, NO_OPERATIONAL_INTEREST, PHOTOS, OWNER_INFO, LISTING_INFO).
      # Action: investigate the new keys and add them to the appropriate ARRAY in
      # dags/broker_xp/enrich_3p_supply/queries/enrich/lead_3p_status_changes.sql.
      constraint: |-
        (SELECT COUNT(*)
         FROM datalake_3p_supply.lead_3p_status_changes
         WHERE reason_macro = 'OTHER'
           AND is_current = TRUE
        ) = 0
      severity_level: Warning
  ts_start:
    is_complete:
      severity_level: Error
  has_3p_access_control:
    is_complete:
      severity_level: Error
  ts_load:
    is_complete:
      severity_level: Error