---
table_name: datalake_3p_supply.listing_draft_status
alert_channel: GROWTH_ALERTS
table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: 0
    less_than_or_equal_to: 20
    severity_level: Warning

column_level_validations:
  id_house:
    is_complete:
      severity_level: Error
  business_context:
    is_complete:
      severity_level: Error
    is_contained_in:
      values: ["SALE", "RENT", "SALE_PRIMARY_MARKET"]
      severity_level: Error
  ts_load:
    is_complete:
      severity_level: Error
  id_house_business_context_unique:
    custom:
      constraint: |-
        (SELECT COUNT(*)
         FROM (
           SELECT id_house, business_context, COUNT(*) AS cnt
           FROM datalake_3p_supply.listing_draft_status
           GROUP BY id_house, business_context
           HAVING cnt > 1
         )
        ) = 0
      severity_level: Error
