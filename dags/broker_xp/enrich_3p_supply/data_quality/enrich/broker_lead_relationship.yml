---
table_name: datalake_3p_supply.broker_lead_relationship
alert_channel: GROWTH_ALERTS
table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: 0
    less_than_or_equal_to: 20
    severity_level: Warning

column_level_validations:
  sk_lead_3p_flow:
    is_complete:
      severity_level: Error
    is_unique:
      severity_level: Error
  business_context:
    is_complete:
      severity_level: Error
    is_contained_in:
      values: ["SALE", "RENT", "SALE_PRIMARY_MARKET"]
      severity_level: Error
  is_current_valid_first_lead:
    is_complete:
      severity_level: Error
  ts_partner_contract_start:
    # Nulls are legitimate for leads sent before the partner's first activation,
    # but a collapse here means the contract match broke again (BUGS-147388).
    # Threshold is a tripwire, not a target — calibrate from the first post-fix run.
    has_completeness:
      greater_than: 0.9
      severity_level: Warning
  recurrency_type:
    is_complete:
      severity_level: Error
    is_contained_in:
      values: ["FIRST_BATCH", "FIRST_MONTH_BATCH", "RECURRENT", "COMPLEMENTARY", "N/A"]
      severity_level: Error
  ts_load:
    is_complete:
      severity_level: Error
