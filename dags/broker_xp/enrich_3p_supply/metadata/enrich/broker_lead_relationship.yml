---
database_name: datalake_3p_supply
table_name: broker_lead_relationship
owner: vitor.musachio@quintoandar.com.br
domain: Broker XP
description: |
  Maps each 3P lead flow to the most recent active broker contract
  (from broker_status_history) and flags whether this is the partner's first lead
  or the first lead after the partner's contract start.

  **Sources**:
  - datalake_3p_supply.lead_3p (inner dependency)
  - datalake_3p_supply.lead_3p_status_changes (inner dependency, current status only)
  - datalake_brokers.broker_status_history (active broker periods)
  - core_brokers.brokers (company-to-broker mapping via uuid_company)

  **Key features**:
  - One row per (sk_lead_3p_flow) with the latest matching active contract
  - sk_broker and ts_partner_contract_start from broker_status_history
  - is_valid_first_lead: TRUE when this lead is the first
    for (lead_hash, uuid_company, business_context)
  - is_current_valid_first_lead: TRUE when this lead is the first post-contract
    for (lead_hash, uuid_company, business_context, ts_partner_contract_start)
  - recurrency_type: bucket the lead into FIRST_BATCH / FIRST_MONTH_BATCH /
    COMPLEMENTARY / RECURRENT relative to the first lead sent after the partner's
    latest contract activation (per uuid_company, business_context,
    ts_partner_contract_start)

  Z-ordered on sk_lead_3p_flow to support data skipping for flow-level lookups.

columns:
  sk_lead_3p_flow:
    description: "Surrogate key for the lead flow: id_lead_3p * 10 for SALE, id_lead_3p * 10 + 1 for RENT (long). Filter on this column to benefit from z-order data skipping."
    lineage:
      - datalake_3p_supply.lead_3p_status_changes.sk_lead_3p_flow
  id_lead_3p:
    description: "Lead ID (long), references lead_3p.id_lead_3p"
    lineage:
      - datalake_brokers_supply_processor_clean.business_context_detail.id_lead
  business_context:
    description: "Business context (SALE, RENT)"
    lineage:
      - datalake_brokers_supply_processor_clean.business_context_detail.business_context
  sk_broker:
    description: "Surrogate key of the broker from core_brokers.brokers"
    lineage:
      - core_brokers.brokers.sk_broker
  ts_partner_contract_start:
    description: "Start timestamp of the active broker status period (contract start)"
    lineage:
      - datalake_brokers.broker_status_history.ts_start
  ts_business_context_created:
    description: "Business context detail creation timestamp (America/Sao_Paulo timezone)"
    lineage:
      - datalake_brokers_supply_processor_clean.business_context_detail.ts_created
  ts_valid_first_lead:
    description: "Earliest ts_business_context_created for the same (lead_hash, uuid_company, business_context)"
  ts_current_valid_first_lead:
    description: "Earliest ts_business_context_created for the same (lead_hash, uuid_company, business_context, ts_partner_contract_start)"
  is_valid_first_lead:
    description: "TRUE when this lead is the first occurrence for (lead_hash, uuid_company, business_context) (boolean)"
  is_current_valid_first_lead:
    description: "TRUE when this lead is the first post-contract occurrence for (lead_hash, uuid_company, business_context, ts_partner_contract_start) (boolean)"
  recurrency_type:
    description: "Classifies the lead relative to the first lead sent after the partner's latest active contract start, per (uuid_company, business_context, ts_partner_contract_start)."
    lineage:
      - datalake_brokers.broker_status_history.ts_start
      - datalake_brokers_supply_processor_clean.business_context_detail.ts_created
    categories:
      FIRST_BATCH: "Lead sent on the first batch after the partner's latest contract activation."
      FIRST_MONTH_BATCH: "Lead sent within 30 days after the first batch following the latest contract activation."
      RECURRENT: "Lead sent more than 30 days after the first batch following the latest contract activation."
      COMPLEMENTARY: "Lead sent before the first batch of the latest contract activation."
      'N/A': "Lead has no matching active contract (no broker_status_history record before the lead's ts_business_context_created)."
  ts_load:
    description: "Timestamp when the record was processed by this DAG"
