---
database_name: datalake_3p_supply
table_name: lead_3p
owner: vitor.musachio@quintoandar.com.br
domain: Broker XP
description: |
  Flattened 3P lead data with all JSON columns from the Brokers Supply Processor
  exploded into individual typed columns, joined with house mapping and business
  context detail timestamps (SALE/RENT). Serves as the primary source for
  dim_lead_3p and fact_lead_3p in the DW layer.

  **Sources**:
  - datalake_brokers_supply_processor_clean.lead_3p
  - datalake_ebdb_clean.house (house mapping via uuid_lead)
  - datalake_brokers_supply_processor_clean.business_context_detail (SALE/RENT timestamps)

  **JSON columns exploded**: location, pricing, blueprint, owner, owner_agent,
  access, brokers. The details and photos columns are preserved as raw JSON.

columns:
  id_lead_3p:
    description: "Primary key of the lead (long)"
    lineage:
      - datalake_brokers_supply_processor_clean.lead_3p.id
  id_by_real_estate:
    description: "Property ID in the partner's own system (string)"
    lineage:
      - datalake_brokers_supply_processor_clean.lead_3p.id_by_real_estate
  id_house:
    description: "EBDB house ID matched via uuid_lead to house.id_external (long, nullable)"
    lineage:
      - datalake_ebdb_clean.house.id
  uuid_lead:
    description: "UUID of the lead (string)"
    lineage:
      - datalake_brokers_supply_processor_clean.lead_3p.uuid_lead
  uuid_company:
    description: "UUID of the partner company that submitted the lead (string)"
    lineage:
      - datalake_brokers_supply_processor_clean.lead_3p.uuid_company
  cnpj:
    description: "CNPJ of the partner company (string)"
    lineage:
      - datalake_brokers_supply_processor_clean.lead_3p.cnpj
  lead_hash:
    description: "Hash used for lead deduplication (string)"
    lineage:
      - datalake_brokers_supply_processor_clean.lead_3p.lead_hash
  address:
    description: "Street address of the property, extracted from location JSON (string)"
  number:
    description: "Street number, extracted from location JSON (string)"
  floor:
    description: "Floor number, extracted from location JSON (string)"
  complement:
    description: "Address complement (e.g. apartment), extracted from location JSON (string)"
  neighborhood:
    description: "Neighborhood name, extracted from location JSON (string)"
  city:
    description: "City name, extracted from location JSON (string)"
  state_acronym:
    description: "State acronym (e.g. SP, RJ), extracted from location JSON (string)"
  country:
    description: "Country name, extracted from location JSON (string)"
  country_code:
    description: "Country ISO code (e.g. BR), extracted from location JSON (string)"
  zip_code:
    description: "Postal code, extracted from location JSON (string)"
  lat:
    description: "Latitude coordinate, extracted from location JSON (double)"
  lng:
    description: "Longitude coordinate, extracted from location JSON (double)"
  region_id:
    description: "QuintoAndar region identifier, extracted from location JSON (long)"
  region_slug:
    description: "Region slug for URL, extracted from location JSON (string)"
  reference_point:
    description: "Reference point near the property, extracted from location JSON (string)"
  rent:
    description: "Monthly rent value, extracted from pricing JSON (double)"
  sale_price:
    description: "Sale price, extracted from pricing JSON (double)"
  condo_price:
    description: "Condo fee, extracted from pricing JSON (double)"
  total_area:
    description: "Total area in square meters, extracted from blueprint JSON (int)"
  bedrooms:
    description: "Number of bedrooms, extracted from blueprint JSON (int)"
  suites:
    description: "Number of suites, extracted from blueprint JSON (int)"
  bathrooms:
    description: "Number of bathrooms, extracted from blueprint JSON (int)"
  garages:
    description: "Number of garage spots, extracted from blueprint JSON (int)"
  house_type:
    description: "Property type (e.g. APARTMENT, HOUSE), extracted from blueprint JSON (string)"
  owner_email:
    description: "Property owner email, extracted from owner JSON (string)"
  owner_name:
    description: "Property owner name, extracted from owner JSON (string)"
  owner_phone:
    description: "Property owner phone, extracted from owner JSON (string)"
  owner_person_type:
    description: "Owner person type (NATURAL_PERSON or LEGAL_PERSON), extracted from owner JSON (string)"
  owner_agent_person_uuid:
    description: "UUID of the owner's agent, extracted from owner_agent JSON (string)"
  owner_agent_external_id:
    description: "External ID of the owner's agent, extracted from owner_agent JSON (string)"
  owner_agent_name:
    description: "Name of the owner's agent, extracted from owner_agent JSON (string)"
  owner_agent_email:
    description: "Email of the owner's agent, extracted from owner_agent JSON (string)"
  owner_agent_phone:
    description: "Phone of the owner's agent, extracted from owner_agent JSON (string)"
  owner_agent_relationship:
    description: "Relationship type of the agent (e.g. INDICATION, PROMOTION), extracted from owner_agent JSON (string)"
  access_type:
    description: "Property access type (e.g. COMMON, PASSWORD, BIOMETRY), extracted from access JSON (string)"
  authorization_type:
    description: "Visit authorization type (e.g. OWNER_PRESENT, BUILDING_MANAGER), extracted from access JSON (string)"
  occupant_type:
    description: "Current occupancy status (OWNER, EMPTY, TENANT), extracted from access JSON (string)"
  condominium:
    description: "Condominium name, extracted from brokers JSON (string)"
  construction_year:
    description: "Year of construction, extracted from brokers JSON (string)"
  block:
    description: "Building block identifier, extracted from brokers JSON (string)"
  tower:
    description: "Building tower name, extracted from brokers JSON (string)"
  house_description:
    description: "Free-text description of the property provided by the partner, extracted from details JSON ($.description)."
    lineage:
      - datalake_brokers_supply_processor_clean.lead_3p.details
  details:
    description: "Raw JSON with property features/amenities list (string)"
    lineage:
      - datalake_brokers_supply_processor_clean.lead_3p.details
  photos:
    description: "Raw JSON with property photos list (string)"
    lineage:
      - datalake_brokers_supply_processor_clean.lead_3p.photos
  is_sent_to_main:
    description: "Whether the lead was sent to the Main system (boolean)"
    lineage:
      - datalake_brokers_supply_processor_clean.lead_3p.is_sent_to_main
  is_out_of_area:
    description: "Whether the property is outside the serviced area, extracted from location JSON (boolean)"
  is_iptu_not_paid:
    description: "Whether IPTU is not paid by the owner, extracted from pricing JSON (boolean)"
  has_restriction:
    description: "Whether there is an access restriction, extracted from access JSON (boolean)"
  has_balcony:
    description: "Whether property has a balcony, extracted from brokers JSON (boolean)"
  is_furnished:
    description: "Whether property is furnished, extracted from brokers JSON (boolean)"
  is_habitat:
    description: "Whether property is habitable, extracted from brokers JSON (boolean)"
  has_agency_key:
    description: "Whether agency has keys, extracted from brokers JSON (boolean)"
  has_concierge:
    description: "Whether building has a concierge, extracted from brokers JSON (boolean)"
  has_lead_house_conflicts:
    description: "Whether the lead uuid_lead maps to multiple houses in EBDB (boolean)"
  has_3p_access_control:
    description: "Access control flag for 3P data (boolean, always true)"
    lineage:
      - datalake_brokers_supply_processor_clean.lead_3p.has_3p_access_control
  ts_lead_created:
    description: "Lead creation timestamp in the source system"
    lineage:
      - datalake_brokers_supply_processor_clean.lead_3p.ts_created
  ts_lead_updated:
    description: "Lead last update timestamp in the source system"
    lineage:
      - datalake_brokers_supply_processor_clean.lead_3p.ts_updated
  ts_sale_business_context_created:
    description: "Business context detail creation timestamp for SALE context (America/Sao_Paulo timezone)"
    lineage:
      - datalake_brokers_supply_processor_clean.business_context_detail.ts_created
  ts_rent_business_context_created:
    description: "Business context detail creation timestamp for RENT context (America/Sao_Paulo timezone)"
    lineage:
      - datalake_brokers_supply_processor_clean.business_context_detail.ts_created
  ts_lead_created_broker_crm:
    description: "Lead creation timestamp in the partner broker CRM, extracted from brokers JSON ($.createdAt)."
    lineage:
      - datalake_brokers_supply_processor_clean.lead_3p.brokers
  ts_lead_updated_broker_crm:
    description: "Lead last update timestamp in the partner broker CRM, extracted from brokers JSON ($.updatedAt)."
    lineage:
      - datalake_brokers_supply_processor_clean.lead_3p.brokers
  ts_load:
    description: "Timestamp when the record was processed by this DAG"
  year:
    description: "Partition column: year derived from ts_lead_updated"
  month:
    description: "Partition column: month derived from ts_lead_updated"
  day:
    description: "Partition column: day derived from ts_lead_updated"