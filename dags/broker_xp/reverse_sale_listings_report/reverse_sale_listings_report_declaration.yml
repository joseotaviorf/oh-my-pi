dag:
  name: reverse_sale_listings_report
  schedule_start_date: 2020,1,1
  owner: Data Broker XP
  documentation:
    dag_purpose: This DAG collects several events from sale listings and collects data saved in the schema "reverse_listings_report", and sends them via SNS to a service called "Member's Area". There, they will be displayed as an analytical report for 3P Members in "Central da Imobiliária".
workflow:
  type: load_access
  layer: reverse
  custom_schema: listings_report
  load_spark_job: load_into_sns
  spark_job_arguments:
  - "{dag_name}"
  - "reverse_listings_report"
  - "{table_name}"
  - "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
  - "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  tables_customization:
    demand_score:
      extra_spark_job_arguments:
      - DEMAND_SCORE
      - sns_topic_arn_scores
      table_privileges:
        3p-readers:
          - SELECT
        data-engineers:
          - ALL PRIVILEGES
      merge_on: ['id_house', 'demand_score']
      z_order_by: ["id_house"]
    sale_listing_traffic:
      extra_spark_job_arguments:
      - NEW_LISTING_TRAFFIC
      - sns_topic_arn_reports
      table_privileges:
        3p-readers:
          - SELECT
        data-engineers:
          - ALL PRIVILEGES
    sale_listing_published:
      extra_spark_job_arguments:
      - NEW_LISTING_PUBLISHED
      - sns_topic_arn_reports
      table_privileges:
        3p-readers:
          - SELECT
        data-engineers:
          - ALL PRIVILEGES
    sale_ongoing_listings:
      extra_spark_job_arguments:
      - ONGOING_LISTINGS
      - sns_topic_arn_reports
      table_privileges:
        3p-readers:
          - SELECT
        data-engineers:
          - ALL PRIVILEGES
    sale_listing_visit_scheduled:
      extra_spark_job_arguments:
      - NEW_LISTING_VISIT_SCHEDULED
      - sns_topic_arn_reports
      table_privileges:
        3p-readers:
          - SELECT
        data-engineers:
          - ALL PRIVILEGES
    sale_listing_visit_confirmed:
      extra_spark_job_arguments:
      - NEW_LISTING_VISIT_CONFIRMED
      - sns_topic_arn_reports
      table_privileges:
        3p-readers:
          - SELECT
        data-engineers:
          - ALL PRIVILEGES
    sale_listing_offer_sent:
      extra_spark_job_arguments:
      - NEW_LISTING_OFFER_SENT
      - sns_topic_arn_reports
      table_privileges:
        3p-readers:
          - SELECT
        data-engineers:
          - ALL PRIVILEGES
    sale_listing_offer_accepted:
      extra_spark_job_arguments:
      - NEW_LISTING_OFFER_ACCEPTED
      - sns_topic_arn_reports
      table_privileges:
        3p-readers:
          - SELECT
        data-engineers:
          - ALL PRIVILEGES
    sale_listing_signed_contract:
      extra_spark_job_arguments:
      - NEW_LISTING_SIGNED_CONTRACT
      - sns_topic_arn_reports
      table_privileges:
        3p-readers:
          - SELECT
        data-engineers:
          - ALL PRIVILEGES
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
