dag:
  name: dw_3p_supply
  schedule_start_date: 2026, 3, 1
  owner: Data Broker XP
  criticality: Critical
  documentation:
    dag_purpose: |
      DW layer for 3P Supply: fact and dimensions for lead flows, conversion funnel,
      and lead attributes. Tables: fact_lead_3p_flows, dim_current_conversion_funnel,
      dim_lead_3p, dim_lead_3p_image_inspection. Consumes datalake_3p_supply
      (enrich_3p_supply), datalake_kodak_clean, core_brokers, datalake_company,
      datalake_person.
workflow:
  type: query_delta
  layer: dw
  custom_schema: 3p_supply
  # No merge_on anywhere: every query here is a full recompute with no date window, so
  # an overwrite reproduces the whole table and keeps it idempotent. A merge on a
  # nullable surrogate key silently re-inserts instead of updating, since NULL never
  # matches in a Delta MERGE.
  tables_customization:
    fact_lead_3p_flows:
      partitions: [year, month, day]
      z_order_by: [sk_lead_3p_flow, sk_lead_3p]
    dim_current_conversion_funnel:
      partitions: [year, month, day]
      z_order_by: [sk_lead_3p_flow]
    dim_lead_3p:
      partitions: [year, month, day]
      z_order_by: [sk_lead_3p]
    dim_lead_3p_image_inspection:
      partitions: [year, month, day]
      z_order_by: [sk_image_inspection, sk_lead_3p]
