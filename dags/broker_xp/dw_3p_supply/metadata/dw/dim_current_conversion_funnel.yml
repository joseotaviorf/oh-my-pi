---
database_name: dw_3p_supply
table_name: dim_current_conversion_funnel
description: Dimension of current conversion funnel stage per 3P lead and business context. One row per lead flow with funnel stage, BSP/main status, and last change timestamp.
domain: Broker XP
owner: patrick.nasser@quintoandar.com.br
columns:
  sk_lead_3p_flow:
    lineage:
      - datalake_3p_supply.lead_3p.id_lead_3p
      - datalake_3p_supply.lead_3p_status_changes.business_context
    description: Primary key; lead flow surrogate (id_lead_3p * 10 for SALE, +1 for RENT).
  sk_lead_3p:
    lineage:
      - datalake_3p_supply.lead_3p.id_lead_3p
    description: Surrogate key of the lead; join to dim_lead_3p.
  sk_listing_draft_status:
    lineage:
      - datalake_3p_supply.listing_draft_status.sk_listing_draft_status
    description: Surrogate key for listing draft status (id_house * 10 for SALE, id_house * 10 + 1 for RENT); -1 when not linked.
  sk_house:
    lineage:
      - datalake_3p_supply.lead_3p.id_house
    description: Surrogate key for house; -1 when id_house is null.
  business_context:
    lineage:
      - datalake_3p_supply.lead_3p_status_changes.business_context
    description: Business context (SALE or RENT).
  current_conversion_funnel:
    lineage:
      - datalake_3p_supply.lead_3p_status_changes.status
      - datalake_3p_supply.listing_draft_status.ts_first_listing
    description: Current funnel stage (FIRST_LISTING, AVAILABILITY_CHECK_START, AVAILABILITY_CHECK_END, PROCESSING_PHOTOS, OPPORTUNITY, or *_BSP).
  reason_macro:
    lineage:
      - datalake_3p_supply.lead_3p_status_changes.reason_macro
    description: High-level classification of status reasons (DUPLICATED, PHOTOS, OWNER_INFO, etc.).
  current_bsp_status:
    lineage:
      - datalake_3p_supply.lead_3p_status_changes.status
    description: Current status in BSP (e.g. REGISTERED, PROCESSING, NOT_CONVERTED).
  current_bsp_status_reason:
    lineage:
      - datalake_3p_supply.lead_3p_status_changes.status_reason
    description: Reason for current BSP status.
  current_main_status:
    lineage:
      - datalake_3p_supply.listing_draft_status.current_main_status
    description: Current listing status in main (e.g. EDITING, PUBLISHED).
  current_main_status_reason:
    lineage:
      - datalake_3p_supply.listing_draft_status.current_main_status_reason
    description: Reason for current main listing status.
  ts_last_conversion_funnel_change:
    lineage:
      - datalake_3p_supply.lead_3p_status_changes.ts_unpublished_in_bsp
      - datalake_3p_supply.listing_draft_status.ts_first_listing
    description: Timestamp of the latest funnel-related change (max of BSP and listing timestamps).
  ts_load:
    description: Timestamp when the row was loaded by this DAG.
  year:
    lineage:
      - datalake_3p_supply.lead_3p_status_changes.ts_start
      - datalake_3p_supply.listing_draft_status.ts_first_listing
    description: Partition year from ts_max_value.
  month:
    lineage:
      - datalake_3p_supply.lead_3p_status_changes.ts_start
      - datalake_3p_supply.listing_draft_status.ts_first_listing
    description: Partition month from ts_max_value.
  day:
    lineage:
      - datalake_3p_supply.lead_3p_status_changes.ts_start
      - datalake_3p_supply.listing_draft_status.ts_first_listing
    description: Partition day from ts_max_value.
