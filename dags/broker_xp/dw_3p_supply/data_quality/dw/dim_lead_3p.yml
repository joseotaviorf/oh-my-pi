---
table_name: dw_3p_supply.dim_lead_3p
alert_channel: GROWTH_ALERTS
table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error
column_level_validations:
  sk_lead_3p:
    is_complete:
      severity_level: Error
    is_unique:
      severity_level: Error
  sk_house:
    custom:
      # is_complete would fail on the SCD -1 unknown-member row the framework injects on every
      # full-extraction run for dim tables (DefaultRowAdditionPipeline); all non-key columns are
      # null on that row by design, so it is excluded here instead of via is_complete.
      constraint: |-
        (SELECT COUNT(*) FROM dw_3p_supply.dim_lead_3p
         WHERE sk_lead_3p != -1
           AND sk_house IS NULL
        ) = 0
      severity_level: Error
  sale_recurrency_type:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Error
    is_contained_in:
      values: ["FIRST_BATCH", "FIRST_MONTH_BATCH", "RECURRENT", "COMPLEMENTARY", "N/A"]
      severity_level: Error
  rent_recurrency_type:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Error
    is_contained_in:
      values: ["FIRST_BATCH", "FIRST_MONTH_BATCH", "RECURRENT", "COMPLEMENTARY", "N/A"]
      severity_level: Error
  has_3p_access_control:
    custom:
      # Same "-1" sentinel-row exclusion as above.
      constraint: |-
        (SELECT COUNT(*) FROM dw_3p_supply.dim_lead_3p
         WHERE sk_lead_3p != -1
           AND has_3p_access_control IS NULL
        ) = 0
      severity_level: Error
  ts_lead_created:
    custom:
      # Same "-1" sentinel-row exclusion as above.
      constraint: |-
        (SELECT COUNT(*) FROM dw_3p_supply.dim_lead_3p
         WHERE sk_lead_3p != -1
           AND ts_lead_created IS NULL
        ) = 0
      severity_level: Error
  ts_load:
    custom:
      # Same "-1" sentinel-row exclusion as above.
      constraint: |-
        (SELECT COUNT(*) FROM dw_3p_supply.dim_lead_3p
         WHERE sk_lead_3p != -1
           AND ts_load IS NULL
        ) = 0
      severity_level: Error
  year:
    custom:
      # Same "-1" sentinel-row exclusion as above.
      constraint: |-
        (SELECT COUNT(*) FROM dw_3p_supply.dim_lead_3p
         WHERE sk_lead_3p != -1
           AND year IS NULL
        ) = 0
      severity_level: Error
  month:
    custom:
      # Same "-1" sentinel-row exclusion as above.
      constraint: |-
        (SELECT COUNT(*) FROM dw_3p_supply.dim_lead_3p
         WHERE sk_lead_3p != -1
           AND month IS NULL
        ) = 0
      severity_level: Error
  day:
    custom:
      # Same "-1" sentinel-row exclusion as above.
      constraint: |-
        (SELECT COUNT(*) FROM dw_3p_supply.dim_lead_3p
         WHERE sk_lead_3p != -1
           AND day IS NULL
        ) = 0
      severity_level: Error