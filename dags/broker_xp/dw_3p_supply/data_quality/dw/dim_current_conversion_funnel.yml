---
table_name: dw_3p_supply.dim_current_conversion_funnel
alert_channel: GROWTH_ALERTS
table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error
column_level_validations:
  sk_lead_3p_flow:
    is_complete:
      severity_level: Error
    is_unique:
      severity_level: Error
  sk_lead_3p:
    custom:
      # is_complete would fail on the SCD -1 unknown-member row the framework injects on every
      # full-extraction run for dim tables (DefaultRowAdditionPipeline); all non-key columns are
      # null on that row by design, so it is excluded here instead of via is_complete.
      constraint: |-
        (SELECT COUNT(*) FROM dw_3p_supply.dim_current_conversion_funnel
         WHERE sk_lead_3p_flow != -1
           AND sk_lead_3p IS NULL
        ) = 0
      severity_level: Error
  business_context:
    custom:
      # Same "-1" sentinel-row exclusion as above.
      constraint: |-
        (SELECT COUNT(*) FROM dw_3p_supply.dim_current_conversion_funnel
         WHERE sk_lead_3p_flow != -1
           AND business_context IS NULL
        ) = 0
      severity_level: Error
  current_conversion_funnel:
    custom:
      # Same "-1" sentinel-row exclusion as above.
      constraint: |-
        (SELECT COUNT(*) FROM dw_3p_supply.dim_current_conversion_funnel
         WHERE sk_lead_3p_flow != -1
           AND current_conversion_funnel IS NULL
        ) = 0
      severity_level: Error
  ts_load:
    custom:
      # Same "-1" sentinel-row exclusion as above.
      constraint: |-
        (SELECT COUNT(*) FROM dw_3p_supply.dim_current_conversion_funnel
         WHERE sk_lead_3p_flow != -1
           AND ts_load IS NULL
        ) = 0
      severity_level: Error
  year:
    custom:
      # Same "-1" sentinel-row exclusion as above.
      constraint: |-
        (SELECT COUNT(*) FROM dw_3p_supply.dim_current_conversion_funnel
         WHERE sk_lead_3p_flow != -1
           AND year IS NULL
        ) = 0
      severity_level: Error
  month:
    custom:
      # Same "-1" sentinel-row exclusion as above.
      constraint: |-
        (SELECT COUNT(*) FROM dw_3p_supply.dim_current_conversion_funnel
         WHERE sk_lead_3p_flow != -1
           AND month IS NULL
        ) = 0
      severity_level: Error
  day:
    custom:
      # Same "-1" sentinel-row exclusion as above.
      constraint: |-
        (SELECT COUNT(*) FROM dw_3p_supply.dim_current_conversion_funnel
         WHERE sk_lead_3p_flow != -1
           AND day IS NULL
        ) = 0
      severity_level: Error
