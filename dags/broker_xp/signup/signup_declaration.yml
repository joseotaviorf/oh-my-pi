dag:
  name: signup
  schedule_start_date: 2023, 1, 1
  schedule_interval: 0 21,8,12 * * *
  owner: Data Broker XP
  documentation:
    dag_purpose: |
      CDC pipeline for the Signup microservice (user registration orchestration audit trail).
      Captures enrollment, disenrollment, and registration-completeness history from PostgreSQL
      (signup.db.core-prd.habitat.zone / signup.public).

      Source repo: backend-services/applications/signup
      Database documentation: dags/broker_xp/signup/signup.md

      DATA LINEAGE: PostgreSQL (OLTP) → Raw Layer → Clean Layer
      SCHEDULE: 3× daily (08:00, 12:00, 21:00 UTC).
workflow:
  type: cdc
  layer: raw
  custom_schema: signup
  database_type: postgres
  source_database: signup
  source_schema: public
  default_partitions: [year, month, day]
  tables_customization:
    user_registration_history: {}
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"