---
table_name: datalake_signup_clean.user_registration_history
alert_channel: GROWTH_ALERTS
table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: -10
    less_than_or_equal_to: 50
    severity_level: Warning

column_level_validations:
  id:
    is_unique:
      severity_level: Warning
    is_complete:
      severity_level: Error
  ts_executed:
    is_complete:
      severity_level: Error
  operation:
    is_contained_in:
      values:
        - ENROLLMENT
        - DISENROLLMENT
        - REGISTRATION_COMPLETENESS
        - USER_DRAFT
      severity_level: Warning
  year:
    is_complete:
      severity_level: Error
  month:
    is_complete:
      severity_level: Error
    has_min_value:
      greater_than_or_equal_to: 1
      severity_level: Error
    has_max_value:
      less_than_or_equal_to: 12
      severity_level: Error
  day:
    is_complete:
      severity_level: Error
    has_min_value:
      greater_than_or_equal_to: 1
      severity_level: Error
    has_max_value:
      less_than_or_equal_to: 31
      severity_level: Error
