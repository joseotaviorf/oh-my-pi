dag:
  name: rede_platform
  schedule_start_date: 2023, 1, 1
  schedule_interval: 0 21,8,12 * * *
  owner: Data Broker XP
  documentation:
    dag_purpose: |
      CDC pipeline for the Rede Platform microservice (Mão Dupla demand, broker accreditation, deaccreditation).
      Captures buyer–company relations, accreditation prospects, and deaccreditation orchestration from PostgreSQL
      (rede-platform.db.core-prd.habitat.zone / rede_platform.public).

      Source repo: backend-services/applications/rede-platform
      Database documentation: dags/broker_xp/rede_platform/rede_platform.md

      DATA LINEAGE: PostgreSQL (OLTP) → Raw Layer → Clean Layer
      SCHEDULE: 3× daily (08:00, 12:00, 21:00 UTC).
workflow:
  type: cdc
  layer: raw
  custom_schema: rede_platform
  database_type: postgres
  source_database: rede_platform
  source_schema: public
  default_partitions: [year, month, day]
  tables_customization:
    buyer_company: {}
    buyer_company_event: {}
    broker_accreditation_intent: {}
    broker_accreditation_prospect: {}
    broker_accreditation_prospect_address: {}
    broker_accreditation_prospect_banking: {}
    broker_accreditation_prospect_broker_profile: {}
    broker_deaccreditation_listing_salesflows: {}
    broker_deaccreditation_process: {}
    broker_deaccreditation_process_statistics: {}
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"