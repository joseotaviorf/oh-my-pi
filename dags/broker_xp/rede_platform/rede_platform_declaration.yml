dag:
  name: rede_platform
  schedule_start_date: 2023, 1, 1
  schedule_interval: 0 21,8,12 * * *
  owner: Data Broker XP
  documentation:
    dag_purpose: >-
      Imports Rede Platform Postgres via CDC into the data lake: 3P buyer–company relations (Demand) and broker lifecycle data.
workflow:
  type: cdc
  layer: raw
  custom_schema: rede_platform
  database_type: postgres
  source_database: rede_platform
  source_schema: public
  default_partitions: [year, month, day]
  tables_customization:
    buyer_company: {}
    buyer_company_event: {}
    broker_accreditation_intent: {}
    broker_accreditation_prospect: {}
    broker_accreditation_prospect_address: {}
    broker_accreditation_prospect_banking: {}
    broker_accreditation_prospect_broker_profile: {}
    broker_deaccreditation_listing_salesflows: {}
    broker_deaccreditation_process: {}
    broker_deaccreditation_process_statistics: {}
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
cluster:
  type: databricks_16_4_min_memory_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}