---
table_name: datalake_rede_platform_clean.broker_deaccreditation_process
alert_channel: GROWTH_ALERTS
table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: -10
    less_than_or_equal_to: 50
    severity_level: Warning

column_level_validations:
  id:
    is_unique:
      severity_level: Error
    is_complete:
      severity_level: Error
  uuid_process:
    is_complete:
      severity_level: Error
  uuid_company:
    is_complete:
      severity_level: Error
  uuid_product:
    is_complete:
      severity_level: Error
  status:
    is_complete:
      severity_level: Error
    is_contained_in:
      values:
        - IN_PROGRESS
        - COMPLETED
        - COMPLETED_WITH_PENDING
        - FAILED
      severity_level: Error
  ts_created:
    is_complete:
      severity_level: Error
  ts_updated:
    is_complete:
      severity_level: Error
  year:
    is_complete:
      severity_level: Error
  month:
    is_complete:
      severity_level: Error
    has_min_value:
      greater_than_or_equal_to: 1
      severity_level: Error
    has_max_value:
      less_than_or_equal_to: 12
      severity_level: Error
  day:
    is_complete:
      severity_level: Error
    has_min_value:
      greater_than_or_equal_to: 1
      severity_level: Error
    has_max_value:
      less_than_or_equal_to: 31
      severity_level: Error
