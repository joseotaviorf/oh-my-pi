---
table_name: datalake_rede_platform_clean.buyer_company_event
alert_channel: GROWTH_ALERTS
table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: -10
    less_than_or_equal_to: 50
    severity_level: Warning

column_level_validations:
  id:
    is_unique:
      severity_level: Error
    is_complete:
      severity_level: Error
  ts_event:
    is_complete:
      severity_level: Error
  trigger_actor:
    is_contained_in:
      # Aligned with backend-services TriggerActor.java (rede-platform), which added OPS, AGENT,
      # and UNDEFINED (fallback for unrecognized values).
      values:
        - DEMAND
        - OPS
        - AGENT
        - SUPPLY
        - UNDEFINED
      severity_level: Error
  year:
    is_complete:
      severity_level: Error
  month:
    is_complete:
      severity_level: Error
    has_min_value:
      greater_than_or_equal_to: 1
      severity_level: Error
    has_max_value:
      less_than_or_equal_to: 12
      severity_level: Error
  day:
    is_complete:
      severity_level: Error
    has_min_value:
      greater_than_or_equal_to: 1
      severity_level: Error
    has_max_value:
      less_than_or_equal_to: 31
      severity_level: Error
