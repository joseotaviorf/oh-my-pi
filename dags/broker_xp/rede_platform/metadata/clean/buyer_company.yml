  id_buyer_company_event:
    description: The unique identifier for the buyer company event.
    lineage:
      - datalake_rede_platform_raw.buyer_company.buyer_company_event_id
  uuid_person:
    description: The unique identifier for the person in Person service.
    lineage:
      - datalake_rede_platform_raw.buyer_company.person_uuid
  uuid_company:
    description: The unique identifier for the company in Company service.
    lineage:
      - datalake_rede_platform_raw.buyer_company.company_uuid
  type:
    description: The type of the buyer company relation.
    lineage:
      - datalake_rede_platform_raw.buyer_company.type
  is_active:
    description: Whether the buyer company relation is active.
    lineage:
      - datalake_rede_platform_raw.buyer_company.is_active
  ts_started:
    description: The timestamp of the start of the buyer company relation.
    lineage:
      - datalake_rede_platform_raw.buyer_company.started_at
  ts_finished:
    description: The timestamp of the end of the buyer company relation.
    lineage:
      - datalake_rede_platform_raw.buyer_company.finished_at
  year:
