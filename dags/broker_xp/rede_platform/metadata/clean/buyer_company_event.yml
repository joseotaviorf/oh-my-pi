---
database_name: datalake_rede_platform_clean
table_name: buyer_company_event
owner: vitor.musachio@quintoandar.com.br
domain: Broker XP
description: This table contains the events of buyer company relations consolidated in the Rede Platform service.
columns:
  id:
    description: Primary key — unique identifier for the buyer company event row.
    lineage:
      - datalake_rede_platform_raw.buyer_company_event.id
  id_event_entity:
    description: The unique identifier for the event entity.
    lineage:
      - datalake_rede_platform_raw.buyer_company_event.event_entity_id
  uuid_company:
    description: The unique identifier for the company in Company service.
    lineage:
      - datalake_rede_platform_raw.buyer_company_event.company_uuid
  uuid_person:
    description: The unique identifier for the person in Person service.
    lineage:
      - datalake_rede_platform_raw.buyer_company_event.person_uuid
  application_source:
    description: The application that triggered the event.
    lineage:
      - datalake_rede_platform_raw.buyer_company_event.application_source
  event_entity_name:
    description: Name of the domain entity that triggered this lifecycle event in the Rede platform event stream (e.g. BuyerCompany or BuyerCompanyMember).
    lineage:
      - datalake_rede_platform_raw.buyer_company_event.event_entity_name
  event_type:
    description: Classification of the buyer company lifecycle event type.
    lineage:
      - datalake_rede_platform_raw.buyer_company_event.event_type
  trigger_actor:
    description: The actor that triggered the buyer company classification event, indicating whether the demand originated from the buyer or the listing side.
    lineage:
      - datalake_rede_platform_raw.buyer_company_event.trigger_actor
    categories:
      DEMAND: Event originated from the buyer/demand side (e.g. visit confirmed, offer sent).
      OPS: Event originated from an internal QuintoAndar operations action.
      AGENT: Event originated from an agent action.
      SUPPLY: Event originated from the listing/supply side (e.g. agent referral).
      UNDEFINED: Fallback value when the source actor is missing or unrecognized.
  ts_event:
    description: The timestamp of the event.
    lineage:
      - datalake_rede_platform_raw.buyer_company_event.event_time
  year:
    description: Calendar year of the event, used as a partition key. Partition column — include in WHERE clause to enable partition pruning.
    lineage:
      - datalake_rede_platform_raw.buyer_company_event.year
  month:
    description: Calendar month of the event, used as a partition key. Partition column — include in WHERE clause to enable partition pruning.
    lineage:
      - datalake_rede_platform_raw.buyer_company_event.month
  day:
    description: Calendar day of the event, used as a partition key. Partition column — include in WHERE clause to enable partition pruning.
    lineage:
      - datalake_rede_platform_raw.buyer_company_event.day
  op_cdc:
    lineage:
      - datalake_rede_platform_raw.buyer_company_event.op_cdc
    description: CDC operation type captured by Debezium change-data-capture stream.
    categories:
      r: Read/snapshot - initial load of existing records.
      c: Create - new record inserted.
      u: Update - existing record modified.
      d: Delete - record removed.
  ts_cdc_transaction:
    lineage:
      - datalake_rede_platform_raw.buyer_company_event.ts_cdc_transaction
    description: Wall-clock timestamp when the CDC connector captured this change event (millisecond precision).
  ts_database_transaction:
    lineage:
      - datalake_rede_platform_raw.buyer_company_event.ts_database_transaction
    description: Timestamp of the originating database transaction in the source application before CDC propagation.