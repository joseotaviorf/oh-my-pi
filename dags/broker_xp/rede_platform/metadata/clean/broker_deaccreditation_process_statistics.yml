---
database_name: datalake_rede_platform_clean
table_name: broker_deaccreditation_process_statistics
owner: vitor.musachio@quintoandar.com.br
domain: Broker XP
description: This table stores progress statistics for each step of the broker deaccreditation process. It allows monitoring how many items were processed, how many failed, etc.
columns:
  id:
    description: The unique identifier for the statistics record (PK).
    lineage:
      - datalake_rede_platform_raw.broker_deaccreditation_process_statistics.id
  id_process:
    description: The foreign key reference to the broker deaccreditation process.
    lineage:
      - datalake_rede_platform_raw.broker_deaccreditation_process_statistics.process_id
  process_step_type:
    description: The type/name of the process step being tracked.
    lineage:
      - datalake_rede_platform_raw.broker_deaccreditation_process_statistics.process_step_type
  total:
    description: The total number of items to be processed in this step.
    lineage:
      - datalake_rede_platform_raw.broker_deaccreditation_process_statistics.total
  processed:
    description: The number of items successfully processed.
    lineage:
      - datalake_rede_platform_raw.broker_deaccreditation_process_statistics.processed
  failed:
    description: The number of items that failed processing.
    lineage:
      - datalake_rede_platform_raw.broker_deaccreditation_process_statistics.failed
  ts_created:
    description: The timestamp when the statistics record was created.
    lineage:
      - datalake_rede_platform_raw.broker_deaccreditation_process_statistics.created_at
  ts_updated:
    description: The timestamp of the last update to the statistics record.
    lineage:
      - datalake_rede_platform_raw.broker_deaccreditation_process_statistics.updated_at
  year:
    description: The year partition of the record.
    lineage:
      - datalake_rede_platform_raw.broker_deaccreditation_process_statistics.year
  month:
    description: The month partition of the record.
    lineage:
      - datalake_rede_platform_raw.broker_deaccreditation_process_statistics.month
  day:
    description: The day partition of the record.
    lineage:
      - datalake_rede_platform_raw.broker_deaccreditation_process_statistics.day
  op_cdc:
    lineage:
      - datalake_rede_platform_raw.broker_deaccreditation_process_statistics.op_cdc
    description: CDC operation type captured by Debezium change-data-capture stream.
    categories:
      r: Read/snapshot - initial load of existing records.
      c: Create - new record inserted.
      u: Update - existing record modified.
      d: Delete - record removed.
  ts_cdc_transaction:
    lineage:
      - datalake_rede_platform_raw.broker_deaccreditation_process_statistics.ts_cdc_transaction
    description: Wall-clock timestamp when the CDC connector captured this change event (millisecond precision).
  ts_database_transaction:
    lineage:
      - datalake_rede_platform_raw.broker_deaccreditation_process_statistics.ts_database_transaction
    description: Timestamp of the originating database transaction in the source application before CDC propagation.