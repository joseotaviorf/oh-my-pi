dag:
  name: enrich_brokers
  schedule_start_date: 2020, 1, 1
  owner: Data Broker XP
  documentation:
    dag_purpose: |
      Creates enriched tables for broker status history tracking. Combines Hubspot and Company data sources to build a unified view of broker status changes over time, partitioned by broker and product.
workflow:
  type: query_delta
  layer: enrich
  default_extraction_type: incremental
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, -1), 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  tables_customization:
    hubspot_brokers_history:
      extraction_type: full
    broker_status_history:
      merge_on: [id_status_change]
      when_matched_update_condition: "source.ts_end IS DISTINCT FROM target.ts_end OR source.is_current != target.is_current"
      z_order_by: [sk_broker, product_name]
  inner_dependencies:
    broker_status_history:
    - hubspot_brokers_history
cluster:
  type: databricks_16_4_min_memory_cluster
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE
  databricks_conn_id: databricks_new_env
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: USER_ISOLATION
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}