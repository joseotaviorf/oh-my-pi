dag:
  name: enrich_brokers
  schedule_start_date: 2020, 1, 1
  owner: Data Broker XP
  documentation:
    dag_purpose: |
      Creates enriched tables for broker status history tracking. Combines Hubspot and Company data sources to build a unified view of broker status changes over time, partitioned by broker and product.
workflow:
  type: query_delta
  layer: enrich
  default_extraction_type: full
  tables_customization:
    broker_status_history:
      z_order_by: [sk_broker, product_name]
  inner_dependencies:
    broker_status_history:
    - hubspot_brokers_history