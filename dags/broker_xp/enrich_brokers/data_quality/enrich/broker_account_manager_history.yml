---
table_name: datalake_brokers.broker_account_manager_history
alert_channel: GROWTH_ALERTS
table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error
column_level_validations:
  sk_broker:
    is_complete:
      severity_level: Error
  business_context:
    is_complete:
      severity_level: Error
  is_current:
    is_complete:
      severity_level: Error
    custom:
      # At most one current row per broker and product lane.
      constraint: |-
        (SELECT COUNT(*) FROM (
          SELECT
            sk_broker,
            business_context,
            COUNT(*) AS cnt
          FROM
            datalake_brokers.broker_account_manager_history
          WHERE
            is_current
          GROUP BY
            sk_broker,
            business_context
          HAVING
            COUNT(*) > 1
        ) AS dup_current) = 0
      severity_level: Error
