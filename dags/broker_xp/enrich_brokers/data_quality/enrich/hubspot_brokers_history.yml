---
table_name: datalake_brokers.hubspot_brokers_history
alert_channel: GROWTH_ALERTS
table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error
column_level_validations:
  sk_broker:
    is_complete:
      severity_level: Error
  broker_status:
    is_complete:
      severity_level: Error
  cnpj:
    custom:
      # HubSpot company: no duplicate effective CNPJ among active sale members (non-archived, not merged).
      # Effective CNPJ = COALESCE(cnpj_unique, cnpj); matches the brokers_members_ranked dedup in hubspot_brokers_history.sql.
      # This validates uniqueness on the HubSpot side only — core_brokers.brokers may legitimately contain
      # multiple sk_broker rows with the same CNPJ (legacy duplicate registrations); that fan-out is intentional.
      constraint: |-
        (SELECT COUNT(*) FROM (
          SELECT
            COALESCE(c.cnpj_unique, c.cnpj) AS cnpj,
            COUNT(*) AS cnt
          FROM
            datalake_hubspot.company AS c
          WHERE
            c.has_been_sale_member
              AND NOT(c.is_archived)
              AND NOT(c.is_merged_into_other_company)
              AND COALESCE(c.cnpj_unique, c.cnpj) IS NOT NULL
          GROUP BY ALL
          HAVING COUNT(*) > 1
        ) AS dup_cnpj) = 0
      severity_level: Error