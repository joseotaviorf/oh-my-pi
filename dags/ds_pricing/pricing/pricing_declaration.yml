dag:
  name: pricing
  schedule_start_date: 2025,10,13
  schedule_interval: 0 4 * * *
  owner: Data DS Pricing
  documentation:
    dag_purpose: |
      This DAG handles the CDC (Change Data Capture) ingestion of the **Pricing Worker** RDS database into the datalake.
      
      ## Pricing Worker Overview
      The Pricing Worker is a centralized service that stores **all price predictions** generated by QuintoAndar's pricing calculators:
      - **Casio**: ForRent price calculator
      - **Girafales**: ForSale price calculator
      - **Casio-lite** and **Girafales-lite**: Lightweight model versions
      - **3P Partners**: Price predictions for partner real estate agencies
      
      ## Database Purpose
      The pricing database serves as the **unified source of truth** for all house price predictions across QuintoAndar, storing:
      
      **Price Predictions Table**:
      - Complete prediction history (p10-p90 percentiles, certainty levels)
      - Model metadata (model name, version, business context)
      - House and condo identifiers (dejavuid, house_id)
      - Prediction metadata (house features, origin: batch vs online)
      - Audit trail with timestamps and prediction IDs
      
      **Inbox/Outbox Tables**:
      - Message processing audit trail
      - Retry and error tracking for reliability
      - Complete message lifecycle history
      
      ## Data Flow
      **Upstream**: Pricing Calculators → SQS Queues → Pricing Worker → RDS Database
      **Downstream** (this DAG): RDS → Debezium → Kafka → S3 → Datalake
      
      The worker implements the inbox/outbox pattern for guaranteed message processing and stores predictions from both:
      - **Batch predictions**: Weekly/scheduled predictions for all active listings
      - **Online predictions**: Real-time predictions triggered by user requests or house events
      
      ## Business Value
      - **Unified History**: Single source of truth replacing deprecated `ebdb.HousePredictedPrice`
      - **Analytics**: Enables dashboards and analytics on pricing prediction trends over time
      - **Feature Store**: Feeds predictions to ML Feature Store for model serving
      - **Cached Predictions**: Serves pre-computed predictions via API for performance
      - **Audit & Compliance**: Complete traceability of all predictions served to users
      - **CPS Integration**: Links with Centralized Pricing Service for business-rule-based pricing
      
      ## Related Documentation
      - [RFC: Batch Predictions with HousePredictedPrice](https://docs.google.com/document/d/19GsSSp254_CUTp57hRrgtPf1Upqu1MVHwbvWI0cYv-k/edit?usp=sharing)
      - [Pricing Worker Repository](https://github.com/quintoandar/quintoml/tree/main/models/pricing/pricing-worker)
      
      ## Related Systems
      - **Centralized Pricing Service (CPS)**: Consumes predictions from worker outbox
      - **Feature Store**: Uses datalake tables to serve cached predictions to ML models
      - **eMLIO**: Model prediction logs (separate from this database)
      - **Analytics Tables**: Exposes prediction history for BI and reporting
      
      ## Contacts
      For questions about:
      - **CDC setup or RDS configuration**: Contact DBRE team
      - **Pricing Worker logic**: Contact Data Pricing team
      - **DAG issues**: Contact Data Platform team
workflow:
  type: cdc
  layer: raw
  database_type: postgres
  source_database: pricing
  source_schema: public
  custom_schema: pricing
  dbutils_secret_key: PRICING_DB
  lineage_product_database_name: pricing
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, macros.ds_add(ds, -1), 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, macros.ds_add(ds, 0), 'load_end_date') }}"
  tables_customization:
    inbox_messages:
      raw_primary_keys: [message_id]
    outbox_messages:
      raw_primary_keys: [message_id]
    price_prediction:
      raw_primary_keys: [entity_id]
cluster:
  type: databricks_16_4_min_general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
