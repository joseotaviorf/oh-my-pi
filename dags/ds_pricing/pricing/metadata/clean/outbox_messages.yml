database_name: datalake_pricing_clean
table_name: outbox_messages
description: |
  This table implements the Outbox pattern for reliable message delivery from the Pricing Worker
  to downstream systems. It stores all outgoing messages before sending to ensure guaranteed delivery.
  
  Message Flow:
  1. After processing inbox messages and creating price_prediction records
  2. Outgoing messages are stored in this outbox table
  3. Outbox processor polls this table for pending messages
  4. Messages are published to destination queues (e.g., pricing-worker-prediction-queue for CPS)
  5. Successfully sent messages are marked as 'sent'
  
  The Outbox pattern ensures:
  - Reliable message delivery (stored before sending)
  - Complete audit trail of all outgoing predictions
  - Retry capability for failed deliveries (up to max_retries)
  - Delivery status tracking (pending → sent/failed)
  - Error logging for debugging and monitoring
  
  Primary consumers:
  - CPS (Centralized Pricing Service) consumes predictions to apply business rules
  - Other services can consume latest predictions instead of requesting new ones
  
  This decouples database access from prediction service, avoiding latency and enabling
  other services to react to new predictions (e.g., house updates triggering predictions).
owner: pedro.muramatsu@quintoandar.com.br
domain: DS Pricing
columns:
  id_message:
    description: "Unique identifier for the outgoing message. Primary key. Generated by the messaging system."
    lineage:
      - datalake_pricing_raw.outbox_messages.message_id
  destination:
    description: "Target queue or destination URL where the message will be sent (e.g., pricing-worker-prediction-queue for CPS consumption)."
    lineage:
      - datalake_pricing_raw.outbox_messages.destination
  message_body:
    description: "Message content to be sent to downstream systems. Contains the processed prediction result and metadata for consumption."
    lineage:
      - datalake_pricing_raw.outbox_messages.message_body
  status:
    description: "Current delivery status of the message. Values: pending (awaiting delivery), sent (successfully delivered), failed (delivery failed after max retries)."
    lineage:
      - datalake_pricing_raw.outbox_messages.status
    categories:
      pending: "Message is awaiting delivery"
      sent: "Message was successfully delivered to destination"
      failed: "Message delivery failed after maximum retry attempts"
  retry_count:
    description: "Number of delivery retry attempts made for this message. Increments with each failed delivery attempt."
    lineage:
      - datalake_pricing_raw.outbox_messages.retry_count
  max_retries:
    description: "Maximum number of delivery retry attempts allowed before message is marked as permanently failed. Typically set to 3."
    lineage:
      - datalake_pricing_raw.outbox_messages.max_retries
  ts_created:
    description: "Timestamp when the message was created and stored in the outbox. Marks when the prediction was ready for delivery."
    lineage:
      - datalake_pricing_raw.outbox_messages.created_at
  ts_sent:
    description: "Timestamp when the message was successfully delivered to the destination. Null for pending or failed messages."
    lineage:
      - datalake_pricing_raw.outbox_messages.sent_at
  error_message:
    description: "Error details captured when message delivery fails. Used for debugging and monitoring delivery issues. Null for successful deliveries."
    lineage:
      - datalake_pricing_raw.outbox_messages.error_message

