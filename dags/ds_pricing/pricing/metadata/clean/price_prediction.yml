database_name: datalake_pricing_clean
table_name: price_prediction
description: |
  This table stores all price predictions generated by QuintoAndar's pricing calculators,
  serving as the centralized source of truth for house price predictions.
  
  The Pricing Worker receives prediction messages from SQS queues (after calculators generate predictions)
  and stores them in this table to centralize all predictions from both batch and online sources.
  
  Each prediction includes percentile distributions (p10-p90), model metadata, house/condo identifiers,
  prediction_metadata (input features), and complete audit trail with inbox_message_id linkage.
  
  Key purposes of this table:
  - Track historical price predictions for each house over time
  - Feed predictions to ML Feature Store for serving cached predictions
  - Enable analytical layer for dashboards and pricing trend analysis
  - Provide complete audit trail from message ingestion to prediction storage
  
owner: pedro.muramatsu@quintoandar.com.br
domain: DS Pricing
columns:
  id_entity:
    description: "Unique identifier for the price prediction record. Primary key."
    lineage:
      - datalake_pricing_raw.price_prediction.entity_id
  id_prediction:
    description: "Prediction identifier used to track and relate predictions across systems. Links to CPS (Centralized Pricing Service) predictions."
    lineage:
      - datalake_pricing_raw.price_prediction.prediction_id
  model_name:
    description: "Name of the pricing calculator model used to generate the prediction (e.g., casio, girafales, casio-lite, girafales-lite)."
    lineage:
      - datalake_pricing_raw.price_prediction.model_name
  p10:
    description: "10th percentile of the predicted price distribution."
    lineage:
      - datalake_pricing_raw.price_prediction.p10
  p20:
    description: "20th percentile of the predicted price distribution."
    lineage:
      - datalake_pricing_raw.price_prediction.p20
  p30:
    description: "30th percentile of the predicted price distribution."
    lineage:
      - datalake_pricing_raw.price_prediction.p30
  p40:
    description: "40th percentile of the predicted price distribution."
    lineage:
      - datalake_pricing_raw.price_prediction.p40
  p50:
    description: "50th percentile (median) of the predicted price distribution."
    lineage:
      - datalake_pricing_raw.price_prediction.p50
  p60:
    description: "60th percentile of the predicted price distribution."
    lineage:
      - datalake_pricing_raw.price_prediction.p60
  p70:
    description: "70th percentile of the predicted price distribution."
    lineage:
      - datalake_pricing_raw.price_prediction.p70
  p80:
    description: "80th percentile of the predicted price distribution."
    lineage:
      - datalake_pricing_raw.price_prediction.p80
  p90:
    description: "90th percentile of the predicted price distribution."
    lineage:
      - datalake_pricing_raw.price_prediction.p90
  prediction_certainty:
    description: "Certainty level of the prediction, indicating model confidence in the result."
    lineage:
      - datalake_pricing_raw.price_prediction.prediction_certainty
  house_dejavuid:
    description: "House identifier using the dejavuid format. Used for tracking houses across different systems."
    lineage:
      - datalake_pricing_raw.price_prediction.house_dejavuid
  condo_dejavuid:
    description: "Condo identifier using the dejavuid format. Used for tracking condos across different systems."
    lineage:
      - datalake_pricing_raw.price_prediction.condo_dejavuid
  prediction_metadata:
    description: "JSON field containing house features, H3 data, and other metadata used as input for the prediction. Stores complete context about the prediction origin."
    lineage:
      - datalake_pricing_raw.price_prediction.prediction_metadata
  business_context:
    description: "Business context classification for the prediction. Values: RENT (Casio/Casio-lite), SALE (Girafales/Girafales-lite), 3P (partner agencies), NONE (others)."
    lineage:
      - datalake_pricing_raw.price_prediction.business_context
    categories:
      RENT: "ForRent business context (Casio calculator)"
      SALE: "ForSale business context (Girafales calculator)"
      3P: "Third-party partner real estate agencies"
      NONE: "Other contexts"
  id_house:
    description: "House identifier for direct linking to specific houses in the main database. Nullable for lite model predictions that don't require house_id."
    lineage:
      - datalake_pricing_raw.price_prediction.house_id
  model_version:
    description: "Version of the pricing model used for the prediction (e.g., 4.0.0, 3.1.1). Used for tracking model evolution and performance comparison."
    lineage:
      - datalake_pricing_raw.price_prediction.model_version
  ts_created:
    description: "Timestamp when the prediction was created in the Pricing Worker database."
    lineage:
      - datalake_pricing_raw.price_prediction.created_at
  id_inbox_message:
    description: "Foreign key linking to the inbox message that originated this prediction. Unique identifier ensuring one-to-one relationship with inbox processing."
    lineage:
      - datalake_pricing_raw.price_prediction.inbox_message_id

