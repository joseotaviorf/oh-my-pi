---
database_name: datalake_sale_listings_lenses
table_name: listing_lenses
description: 'Table enrich that gathers the listing lens status of all sale listings. Lensing the listings is a project developed by the Listing Conversion team, where we abstracted various concepts and ways of looking at listings into a few lenses. For more information, check: https://docs.google.com/presentation/d/1E8VO0ulQ5-W5BKoI3C8cYPpFo7cmOP6TFzyUS27vHMg/edit'
domain: For Sale
owner: data-for-sale@quintoandar.com.br
columns:
  id_house:
    lineage:
      - datalake_ebdb_clean.listing_business_context.id_house
      - datalake_ebdb_listing.house.id_house
      - datalake_sale_listings_lenses.pricing_lens.id_house
      - datalake_sale_listings_lenses.demand_lens.id_house
      - datalake_sale_listings_lenses.availability_lens.id_house
    description:  > 
      Column referring to the house ID. Can be joined with dw_house.dim_house and all other sale modeling tables.
  id_region:
    lineage: 
      - datalake_ebdb_listing.house.id_region
    description: > 
      ID column of region where house listing is located in. Can be joined with dw_public.dim_region.
  listing_lenses:
    description: > 
      'Column that aggregates all the lenses into one sentence. Used to facilitate the visualization of the status.'
  full_listing_lenses: 
    description: > 
      'Column that aggregates all the lenses into one sentence. Used to facilitate the visualization of the status.'
  price_bin:
    lineage:
      - datalake_sale_listings_lenses.segmentation_bins.tag
    description: >
      Descriptive tag for each bin. The listing price is considered to allocate to a bin. That is, if the listing is 150k it will have a tag for the price bin `R$ 120k-300k`.
  price_m2_bin:
    lineage:
      - datalake_sale_listings_lenses.segmentation_bins.tag
    description: > 
        Descriptive tag for each bin. The listing price m2 is considered to allocate to a bin. That is, if the listing is 8k it will have a tag for the price m2 bin `R$ 7k-8k/m²`.
  total_area_bin:
    lineage:
      - datalake_sale_listings_lenses.segmentation_bins.tag
    description: > 
        Descriptive tag for each bin. The listing total area is considered to allocate to a bin. That is, if the listing is 90m2 it will have a tag for the total area bin `80m²-120m²`.
  pricing_tier:
    lineage:
      - datalake_sale_listings_lenses.pricing_lens.tier
    description: >
      'The tiers created by the Supply team in ForSale represent the segmentation of a listing with respect to its level. 
      We use two components to define this tier: the difference from the published price to the calculator price, and the degree of certainty of the prediction. 
      With this, we were able to understand the pricing tier of a listing by its seller and how this would affect demand. 
      Example: A listing with the publication price exactly equal to the calculator price and with a high degree of prediction will be classified as P5 - Great Price.'
    categories:
      P5: >
        It means that QuintoAndar has a high degree of certainty that the property in question is worth less than it actually is.
      P4: >
        It means that the listing may be either overpriced or even cheaper than the real value of the property.
      P3: >
        It means that the price is OK in relation to the calculator. A little higher than the calculator, but nothing out of the normal.
      P2: >
        It means that the property is reasonably above the price estimated by the calculator.
      P1: >
        Listing that is way above the calculated price, over 50% of the published price. Extremely overpriced .
  demand_tier:
    lineage:
      - datalake_sale_listings_lenses.demand_lens.tier
    description: >
     'Demand tier created to abstract some information from the listing demand. In other words, we use two components to define the tier, the number of days published and the number of visits scheduled, visits completed, offers received and offers accepted. With this, based on 4 different time windows (last 15, 30, 60 and 90 days) we assign a demand tier for each listing.'
    categories:
      D5: >
        "Represent High Demand Listings. To be considered D5, the listing must have: 
          Either +3 Visits Booked in the last 15 days if it has more than 90 days published.
          Or +2 Visits Completed within the past 15 days if it has more than 90 days published. 
          Or +1 Offers Submitted within the past 15 days if you have more than 90 days published.
          Or +1 Offers Accepted within the past 15 days if you have more than 90 days published.
          Or any event within the past 30 days if you have less than 90 days published."
      D4: > 
        "Represents Good Demand Listings. To be considered D4, the listing must have:
          Either 2 Visits Booked in the last 15 days if it has more than 90 days published.
          Or +3 Visits Booked in the last 30 days if it has more than 90 days published.
          Or +2 Visits Completed within the past 30 days if more than 90 days old. 
          Or +1 Offers Submitted within the past 30 days if you have more than 90 days published.
          Or +1 Offers Accepted within the past 30 days if you have more than 90 days published.
          Or +1 Visits Booked within the past 30 days if you have less than 90 days posted.
          Or any event within the last 60 days if you have less than 90 days posted."
      D3: > 
        "Represents Some Demand Listings. To be considered D3, the listing must have:
          Either 2 Visits Booked in the last 30 days if it has more than 90 days published.
          Or +3 Visits Booked in the last 60 days if it has more than 90 days published.
          Or +2 Visits Completed within the past 60 days if more than 90 days old. 
          Or +1 Offers Submitted within the past 60 days if you have more than 90 days published.
          Or +1 Offers Accepted within the past 60 days if you have more than 90 days published.
          Or +1 Visits Booked within the past 60 days if you have less than 90 days posted.
          Or any event within the last 90 days if you have less than 90 days posted.
          Or if you have less than 45 days posted."
      D2: > 
        "Represents Low Demand Listings. To be considered D2, the listing must have:
          Either 2 Visits Booked in the last 60 days if it has more than 90 days published.
          Or +3 Visits Booked in the last 90 days if it has more than 90 days published.
          Or +2 Visits Completed within the past 90 days if more than 90 days old. 
          Or +1 Offers Submitted within the past 90 days if you have more than 90 days published.
          Or +1 Offers Accepted within the past 90 days if you have more than 90 days published.
          Or +1 Visits Booked within the past 90 days if you have less than 90 days posted.
          Or if you have more than 45 days published"
      D1: >
        "Represent No Demand Listings. To be considered D1, is the listing must be more than 90 days old and have not received any demand."
  availability_tier:
    lineage:
      - datalake_sale_listings_lenses.availability_lens.tier
    description: >
      'The tiers created by the Supply team in ForSale represent the segmentation of a listing with respect to its "level". This score is based on all the elements that can alter the availability of a listing on the visit. That is, it takes into account factors such as key location, seller behavior, canceled visits, hours available for visits, and rental status.
    categories: 
      A5: >
        Listings that have the Availability Score between -1500 and 0. Meaning that they have little or no penalties, indicating good availability for visits.
      A4: > 
        Listings that have the Availability Score between -2500 and -1500. Meaning that they have some penalties, indicating good availability for visits.
      A3: >
        Listings that have the Availability Score between -4000 and -2500. Meaning some limitations on the visit.
      A2: >
        Listings that have the Availability Score between -100000 and -4000. Meaning that possibly this listing is very difficult to make a visit to, but still available.
      A1: >
        Listings that have the Availability Score less than -100000. Meaning that this listing is possibly not even available for the visit.
  sellability_tier:
    lineage:
      - datalake_sale_listings_lenses.sellability_lens.tier
    description: >
      'The tiers created by the Supply team in ForSale represent the segmentation of a listing with respect to its "level".
       We used the entire history of listings that have been published and signed CCVs, with some cuts such as the number of bathrooms, region cluster, price bins, total area bins and m2 price bins. We then defined a `factor' value for each listing in relation to its characteristics. 
       In other words, we compare it with QuintoAndar's history and classify whether that listing is similar to listings that have already been sold'
    categories:
      S5: > 
        It represents listings with a very high degree of sellability, i.e. it is a listing that is very similar to most of the listings that have already been sold. 
        To be considered S5, the listing must have a sellability factor greater than 3.
      S4: > 
        It represents listings with a high degree of sellability, i.e. it is a listing that is quite similar to most of the listings that have already been sold.
        To be considered S4, the listing must have a sellability factor greater than 2 and less than or equal to 3.
      S3: > 
        It represents listings with a moderate degree of sellability, i.e. it is a listing that is moderately similar to most of the listings that have already been sold.
        To be considered S3, the listing must have a sellability factor greater than 1 and less than or equal to 2.
      S2: > 
        It represents listings with a low degree of sellability, i.e. it is a listing that is slightly similar to most of the listings that have already been sold.
        To be considered S2, the listing must have a sellability factor greater than 0.3 and less than or equal to 1.
      S1: > 
        It represents listings with a very low degree of sellability, i.e. is a listing typology that is totally different from the listings sold on QuintoAndar.
        To be considered S1, the listing must have a sellability factor less than or equal to 0.3.
  listing_quality_tier: 
    lineage: 
      - datalake_sale_listings_lenses.listing_quality_lens.tier
    description: > 
      We use the entire history of changes to a property's features and condominiums to create a tier that tracks the level of completeness of a house's information.
      We believe that a house with complete information performs much better on the platform. With this in mind, we used several variables and created a completeness score.
    categories: 
      Q5: Represents listings with full information on amenities and features. There is no penalty, i.e. all the information we considered was filled in.
      Q4: Represents listings with almost complete information on amenities and features. There is a small penalty, i.e. some of the amenities or features that are not so critical have not been filled.
        To be placed into this tier you must have a score between -1 and -500.
      Q3: Represents listings with incomplete information on amenities and features. There is a medium penalty, i.e. some of the amenities or features have not been filled.
        To be placed into this tier you must have a score between -501 and -1500.
      Q2: Represents listings with very incomplete information on amenities and features. There is a large penalty, i.e. most of the amenities or features have not been filled.
        To be placed into this tier you must have a score less than -1500.
      Q1: Represents listings with no information on amenities and features. Represents listings that are missing one or more critical information. To be considered in this tier, we have a problem identifying its sale price and/or its condo value and/or its number of bedrooms and/or its total area.
  pricing_name:
    lineage:
      - datalake_sale_listings_lenses.pricing_lens.tier_name
    description: >
      Just a long name for the expensive Tier segment.
    categories:
      Great Price: >
        It represents P5. Listings that are below the value calculated by QuintoAndar.
      Good Price: >
        It represents P4. Listings that are well priced.
      Fair Price: >
        It represents P3. Listings are slightly above the price indicated by the calculator.
      Slightly Overpriced: >
        It represents P2. Listings that are above the price indicated by the calculator.
      Significantly Overpriced: >
        It represents P1. Listings are way above the price of the calculator.
  demand_name:
    lineage:
      - datalake_sale_listings_lenses.demand_lens.tier_name
    description: > 
      Just a full name of the demand tier.
    categories:
      High Demand: >
        It represents the D5 category of the tier. Listings with a large sum of demand events in the last days. It is the highest possible tier.
      Good Demand: >
        It represents the D4 tier category. A reasonable amount of demand, but a little less than the High Demand. It is the second highest tier.
      Some Demand: >
        It represents the tier D3 category. Listings with an average combination of price and price per square meter.
      Low Demand: >
        It represents the tier D2 category. A listing with some level of demand still signals a less attractive listing than the High and the Good, but more attractive than the Low.
      No Demand: >
        It represents the tier D1 category. Listings that do not have any kind of demand.
  availability_name:
    lineage:
      - datalake_sale_listings_lenses.availability_lens.tier_name
    description: >
      Just a full name of the availability tier.
    categories:
      Great Availability: >
        It represents the A5 tier category. Listings that have an availability score between -1500 and 0.
      Good Availability: >
        It represents the A4 tier category. Listings that have an availability score between -2500 and -1500.
      Standard Availability: >
        It represents the A3 tier category. Listings that have an availability score between -4000 and -2500.
      Limited Availability: >
        It represents the A2 tier category. Listings that have an availability score between -100000 and 4000.
      Possibly Unavailable: >
        It represents the A1 tier category. Listings that have an availability score less than -100000.
  sellability_name:
    lineage:
      - datalake_sale_listings_lenses.sellability_lens.tier_name
    description: >
      Just a full name of the sellability tier.
    categories:
      Very Similar: > 
        It represents the S5 tier. Listings with typologies with a long history of sales on QuintoAndar. It is the highest possible tier.
      Quite Similar: >
        It represents the S4 tier. Listings with typologies with a considerable number of sales in QuintoAndar's history. It is the second highest tier.
      Moderately Similar: >
        It represents the S3 tier. Listings with typologies with a moderate number of sales in QuintoAndar's history. It is the third highest tier.
      Somewhat Similar:
        It represents the S2 tier. Listings with typologies that are slightly similar to the listings already sold by QuintoAndar. It is the fourth highest tier.
      Not Very Similar:
        It represents the S1 tier. Listings with typologies totally different type to the listings that QuintoAndar sells. It is the lowest tier.
  listing_quality_name: 
    lineage:
      - datalake_sale_listings_lenses.listing_quality_lens.tier_name
    description: >
      Just a full name of the listing quality tier.
    categories: 
      Great Accuracy: It represents the Q5 tier. Listings with full information on amenities and features.
      Good Accuracy: It represents the Q4 tier. Listings with almost complete information on amenities and features.
      Moderate Accuracy: It represents the Q3 tier. Listings with incomplete information on amenities and features.
      Low Accuracy: It represents the Q2 tier. Listings with very incomplete information on amenities and features.
      Critical Accuracy: It represents the Q1 tier. Listings with critical information missing, like sale price, condo, bedrooms and total area.
  pricing_full_name:
    description: > 
      Full name of pricing tier. Can be used for display purposes.
  demand_full_name: 
    description: > 
      Full name of demand tier. Can be used for display purposes.
  availability_full_name:
    description: > 
      Full name of availability tier. Can be used for display purposes.
  sellability_full_name:
    description: > 
      Full name of sellability tier. Can be used for display purposes.
  listing_quality_full_name:
    description: > 
      Full name of listing quality tier. Can be used for display purposes.
  pricing_disclaimer:
    lineage:
      - datalake_sale_listings_lenses.pricing_lens.tier_disclaimer
    description: >
      Column that shows us, in full, the combination of factors/bins concerning the listing, where with this, we classify it within a pricing tier.
  demand_disclaimer:
    lineage:
      - datalake_sale_listings_lenses.demand_lens.tier_disclaimer
    description: >
      Column that shows us, in full, the combination of factors/bins concerning the listing, where with this, we classify it within a demand tier.
  availability_disclaimer:
    lineage:
      - datalake_sale_listings_lenses.availability_lens.tier_disclaimer
    description: >
      Column that shows us, in full, the combination of factors/bins concerning the listing, where with this, we classify it within a availability tier.
  availability_drill_down:
    lineage: 
      - datalake_sale_listings_lenses.availability_lens.tier_drill_down
    description: >
      The drill down of the availability tier, where we can see the factors/bins that make up the listing's tier.
  listing_quality_disclaimer:
    lineage:
      - datalake_sale_listings_lenses.listing_quality_lens.tier_disclaimer
    description: >
      Column that shows us, in full, the completeness of listing information, where with this, we classify it within a listing quality tier.
  listing_quality_drill_down: 
    lineage:
      - datalake_sale_listings_lenses.listing_quality_lens.tier_drill_down
    description: >
      The drill down of the listing quality tier, where we can see the completeness of the listing information.
