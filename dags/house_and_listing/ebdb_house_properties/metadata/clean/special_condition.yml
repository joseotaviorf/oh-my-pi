database_name: datalake_ebdb_clean
table_name: special_condition
owner: bruna.prates@quintoandar.com.br
domain: House and Listing
description: CDC mirror of the SpecialCondition EBDB table. One row per special condition record (PK id). Tracks special
  commercial conditions (e.g., partner agreements, opt-in/out periods) applied to each house.
columns:
  id:
    lineage:
      - datalake_ebdb_raw.specialcondition.id
  ts_updated:
    lineage:
      - datalake_ebdb_raw.specialcondition.atualizadoem
  ts_created:
    lineage:
      - datalake_ebdb_raw.specialcondition.criadoem
  ts_opted_in:
    lineage:
      - datalake_ebdb_raw.specialcondition.optedinat
  ts_opted_out:
    lineage:
      - datalake_ebdb_raw.specialcondition.optedoutat
  id_house:
    lineage:
      - datalake_ebdb_raw.specialcondition.imovel_id
  special_condition_type:
    lineage:
      - datalake_ebdb_raw.specialcondition.specialconditiontype
  ts_expired:
    lineage:
      - datalake_ebdb_raw.specialcondition.expirationdate
  special_condition_status:
    lineage:
      - datalake_ebdb_raw.specialcondition.specialconditionstatus
  id_partner:
    lineage:
      - datalake_ebdb_raw.specialcondition.partner_id
