database_name: datalake_ebdb_clean
table_name: house_guarantees_aud
owner: bruna.prates@quintoandar.com.br
domain: House and Listing
description: Audit table for house guarantees. Tracks all historical changes to guarantee types associated with each house.
  Sourced from imovel_garantias_aud in EBDB. Warning - the compound key (id_house + rev) is not unique.
columns:
  id_house:
    lineage:
      - datalake_ebdb_raw.imovel_garantias_aud.imovel_id
  guarantee_type:
    lineage:
      - datalake_ebdb_raw.imovel_garantias_aud.garantias
  rev:
    lineage:
      - datalake_ebdb_raw.imovel_garantias_aud.rev
  rev_type:
    lineage:
      - datalake_ebdb_raw.imovel_garantias_aud.revtype
