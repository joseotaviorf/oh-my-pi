database_name: datalake_ebdb_clean
table_name: restriction_type
owner: guilherme.rocha@quintoandar.com.br
domain: House and Listing
description: CDC mirror of the RestrictionType EBDB lookup table. One row per restriction type (PK id). Reference table
  listing the types of visit or access restrictions applicable to a house.
columns:
  id:
    lineage:
      - datalake_ebdb_raw.restrictiontype.id
    description: Id of the restriction type.
  ts_updated:
    lineage:
      - datalake_ebdb_raw.restrictiontype.atualizadoem
    description: Timestamp of when the restriction type was updated.
  ts_created:
    lineage:
      - datalake_ebdb_raw.restrictiontype.criadoem
    description: Timestamp of when the restriction type was created.
  name:
    lineage:
      - datalake_ebdb_raw.restrictiontype.name
    description: Name of the restriction type.
