database_name: datalake_ebdb_clean
table_name: key_type
owner: guilherme.rocha@quintoandar.com.br
domain: House and Listing
description: CDC mirror of the KeyType EBDB lookup table. One row per key type (PK
  id). Reference table listing the types of keys associated with a house.
columns:
  id:
    lineage:
      - datalake_ebdb_raw.keytype.id
    description: Primary key of the key type lookup record in EBDB.
  name:
    lineage:
      - datalake_ebdb_raw.keytype.name
    description: Human-readable label describing how visitors access the property
      (e.g. password, biometry).
  ts_updated:
    lineage:
      - datalake_ebdb_raw.keytype.atualizadoem
    description: Timestamp when the key type record was last updated.
  ts_created:
    lineage:
      - datalake_ebdb_raw.keytype.criadoem
    description: Timestamp when the key type record was created.
  op_cdc:
    lineage:
      - datalake_ebdb_raw.keytype.op_cdc
    description: CDC operation type captured by Debezium.
    categories:
      r: Read/snapshot - initial load of existing records.
      c: Create - new record inserted.
      u: Update - existing record modified.
      d: Delete - record removed.
  ts_cdc_transaction:
    lineage:
      - datalake_ebdb_raw.keytype.ts_cdc_transaction
    description: Timestamp when the CDC system captured this transaction (millisecond
      precision).
  ts_database_transaction:
    lineage:
      - datalake_ebdb_raw.keytype.ts_database_transaction
    description: Timestamp of the original database transaction in the source system.
