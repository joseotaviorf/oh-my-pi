dag:
  name: dw_listing
  schedule_start_date: 2021,08,02
  owner: Data House and Listing
  criticality: Critical
  sla_deadline_localtime: "08:00"
workflow:
  type: query_delta
  layer: dw
  custom_schema: rent
  default_partitions: [country_code]
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  inner_dependencies:
    fact_house_listing_daily_infos:
      - fact_house_listing_daily_available_hours
  tables_customization:
    dim_condo:
      partitions: []
      custom_schema: public
    dim_house_listing:
      merge_on: [sk_house_listing]
    fact_house_listing_daily_available_hours:
      partitions: ["year", "month", "day"]
      extraction_type: incremental
      custom_schema: listing
    fact_house_listing_daily_infos:
      partitions: ["country_code", "year", "month", "day"]
      extraction_type: incremental
    fact_house_listings:
      merge_on: [sk_house_listing]
