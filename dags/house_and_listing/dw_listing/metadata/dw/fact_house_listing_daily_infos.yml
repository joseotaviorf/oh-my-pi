---
database_name: dw_rent
table_name: fact_house_listing_daily_infos
description:
  Daily snapshot information related to rental house listings. Each line is a listing
  related to a house in a specific date with it's information about the agents, contract, account manager (PP Multi).
  The sk_house_listing is not unique in this table, but the sk_house_listing_day is unique. This column is the
  concatenation of sk_house_listing + sk_day.
  Partitioned by country_code, year, month, day. Always filter on country_code, year, month, day in WHERE clauses to
  enable partition pruning and avoid full table scans.
domain: House and Listing
owner: bruna.prates@quintoandar.com.br
columns:
  sk_house_listing_day:
    lineage:
      - datalake_rental_historical_follow_up.house_listings_daily_info.id_house_listing_day
    description: Unique key of table. It's the concatenation of sk_house_listing with the competence date (yyyymmdd).
  sk_house_listing:
    lineage:
      - datalake_rental_historical_follow_up.house_listings_daily_info.id_house_listing
    description: Surrogate key of the house listing dimension.
  sk_house:
    lineage:
      - datalake_rental_historical_follow_up.house_listings_daily_info.id_house
    description: Surrogate key of the house dimension.
  sk_contract:
    lineage:
      - datalake_rental_historical_follow_up.house_listings_daily_info.id_contract
    description: Surrogate key of the contract dimension, if a contract is active for this listing on this day.
  sk_owner:
    lineage:
      - datalake_rental_historical_follow_up.house_listings_daily_info.id_owner
    description: Key of user who's the house owner.
  sk_account_manager:
    lineage:
      - datalake_rental_historical_follow_up.house_listings_daily_info.id_account_manager
    description: Key of user who's responsible to manage the user if the user is a PP Multi.
  sk_owner_category:
    lineage:
      - datalake_pro_owners.owner_category.id_owner_category
    description:
      Key of user version who's the house owner. It can be joined with dw_rent.dim_owner_category
      to check the owner's category.
  sk_occupant:
    lineage:
      - datalake_rental_historical_follow_up.house_listings_daily_info.id_occupant
    description: Key of the occupant type.
  sk_partner:
    lineage:
      - datalake_rental_historical_follow_up.house_listings_daily_info.id_partner
    description: Key of partner if the house listing was added by a partner.
  sk_partner_big_agent:
    lineage:
      - datalake_rental_historical_follow_up.house_listings_daily_info.id_partner_big_agent
    description: Key of partner from Big Agent source.
  sk_region:
    lineage:
      - datalake_rental_historical_follow_up.house_listings_daily_info.id_region
    description: Key of house's region.
  sk_house_status:
    lineage:
      - datalake_rental_historical_follow_up.house_listings_daily_info.id_house_status
    description: Key of house's status and status_reason.
  sk_broker_supply:
    lineage:
      - core_brokers.brokers.sk_broker
    description: Surrogate key of the 3P broker partner when is_rent_3p_supply; '-1' when not 3P supply or company is not in core_brokers.brokers.
  sk_pricing:
    lineage:
      - datalake_rental_historical_follow_up.house_listings_daily_info.id_price_change
    description: Key of the price change. It can be joined with dw_listing.dim_pricing.
  sk_suggestion_change:
    lineage:
      - datalake_rental_historical_follow_up.house_listings_daily_info.id_suggestion_change
    description: The Id of the suggestion change record from the pricing model.
  sk_status_started_date:
    lineage:
      - datalake_rental_historical_follow_up.house_listings_daily_info.ts_status_started
    description: Key of listing status started date.
  sk_status_ended_date:
    lineage:
      - datalake_rental_historical_follow_up.house_listings_daily_info.ts_status_ended
    description: Key of listing status ended date.
  sk_date:
    lineage:
      - datalake_rental_historical_follow_up.house_listings_daily_info.dt_day
    description: Key of reference date.
  available_hours:
    lineage:
      - dw_listing.fact_house_listing_daily_available_hours.day_available_hours
    description: Number of available hours of the house listing in the referenced date.
  page_views:
    lineage:
      - datalake_rental_historical_follow_up.house_listings_daily_info.listing_page_views
    description: Number of views of the house listing page in the referenced date.
  search_results_page_views:
    lineage:
      - datalake_rental_historical_follow_up.house_listings_daily_info.search_results_page_views
    description: Number of views of the search results page in the referenced date.
  favorites:
    lineage:
      - datalake_rental_historical_follow_up.house_listings_daily_info.favorites
    description: Number of favorites in the referenced date.
  visits_booked:
    lineage:
      - datalake_rental_historical_follow_up.house_listings_daily_info.visits_booked
    description: Number of visits booked, coming from the old booking modeling, of the house listing in the referenced date.
  visits_completed:
    lineage:
      - datalake_rental_historical_follow_up.house_listings_daily_info.visits_completed
    description: Number of visits completed, coming from the old booking modeling, of the house listing in the referenced date.
  visits_requested:
    lineage:
      - datalake_rental_historical_follow_up.house_listings_daily_info.visits_requested
    description: Number of visits requested, coming from the new visit modeling, of the house listing in the referenced date.
  visits_rescheduled:
    lineage:
      - datalake_rental_historical_follow_up.house_listings_daily_info.visits_rescheduled
    description: Number of visits rescheduled, coming from the new visit modeling, of the house listing in the referenced date.
  visits_confirmed:
    lineage:
      - datalake_rental_historical_follow_up.house_listings_daily_info.visits_confirmed
    description: Number of visits confirmed, coming from the new visit modeling, of the house listing in the referenced date.
  visits_done:
    lineage:
      - datalake_rental_historical_follow_up.house_listings_daily_info.visits_done
    description: Number of visits done, coming from the new visit modeling, of the house listing in the referenced date.
  offers_sent:
    lineage:
      - datalake_rental_historical_follow_up.house_listings_daily_info.offers_sent
    description: Number of offers sent to the house listing in the referenced date.
  lower_bound_limit:
    lineage:
      - datalake_rental_historical_follow_up.house_listings_daily_info.lower_bound_limit
    description: The lowest allowed price (floor) for the rental pricing suggestion.
  suggested_lower_bound_price:
    lineage:
      - datalake_rental_historical_follow_up.house_listings_daily_info.suggested_lower_bound_price
    description: The minimum value of the price range suggested by the pricing model.
  suggested_upper_bound_price:
    lineage:
      - datalake_rental_historical_follow_up.house_listings_daily_info.suggested_upper_bound_price
    description: The maximum value of the price range suggested by the pricing model.
  upper_bound_limit:
    lineage:
      - datalake_rental_historical_follow_up.house_listings_daily_info.upper_bound_limit
    description: The highest allowed price (ceiling) for the rental pricing suggestion.
  suggestion_certainty:
    lineage:
      - datalake_rental_historical_follow_up.house_listings_daily_info.suggestion_certainty
    description: Level of certainty or confidence associated with the pricing suggestion from the pricing model.
  country_code:
    lineage:
      - datalake_rental_historical_follow_up.house_listings_daily_info.country_code
    description: Two-letter ISO country code indicating the country where the listing is active. Partition key for
      multi-country isolation; always filter on this column in WHERE clauses to enable partition pruning.
    categories:
      BR: Brazil
      MX: Mexico
      Undefined: Country could not be determined.
  year:
    lineage:
      - datalake_rental_historical_follow_up.house_listings_daily_info.year
    description: Year of the reference date. Also it's a partition.
      Always filter on this partition column in WHERE clauses to enable partition pruning when scanning the table.
  month:
    lineage:
      - datalake_rental_historical_follow_up.house_listings_daily_info.month
    description: Month of the reference date. Also it's a partition.
      Always filter on this partition column in WHERE clauses to enable partition pruning when scanning the table.
  day:
    lineage:
      - datalake_rental_historical_follow_up.house_listings_daily_info.day
    description: Day of the reference date. Also it's a partition.
      Always filter on this partition column in WHERE clauses to enable partition pruning when scanning the table.
  ts_load:
    description: Timestamp of when the table was updated.
