database_name: dw_rent
table_name: fact_house_listing_status
description: Fact table that contains each status that the listing had. Each line
  is a listing and its status in a certain time period.
  Partitioned by country_code. Always filter on country_code in WHERE clauses to enable partition pruning and avoid full table scans.
domain: House and Listing
owner: bruna.prates@quintoandar.com.br
columns:
  country_code:
    lineage:
      - datalake_ebdb_listing.house_listing_status.country_code
    description: Two-letter ISO country code for the market where this listing operates. Partition key for multi-country isolation;
      always filter on this column in WHERE clauses to enable partition pruning.
    categories:
      BR: Brazil's country code.
      MX: Mexico's country code.
  is_last_status_of_day:
    description: Boolean indicating if the status is the last one of the day for this listing.
  revision_reason:
    lineage:
      - datalake_ebdb_listing.house_listing_status.revision_reason
    description: Reason why the status has changed.
  sk_first_publication_date:
    lineage:
      - datalake_ebdb_listing.house_listing_status.ts_first_publication
    description: Date when house listing was first published.
  sk_house_listing:
    lineage:
      - datalake_ebdb_listing.house_listing_status.id_house_listing
    description: Key of house listing. For house listing version rules, click here
      https://docs.google.com/presentation/d/1u4-p1tdzN5TRVfgtreH9thOfNr9O9pDrglah-XMUloQ/edit#slide=id.g41939e4bd1_0_115.
  sk_region:
    lineage:
      - datalake_ebdb_listing.house_listing_status.id_region
    description: Key of region where house listing is located in.
  sk_broker_supply:
    lineage:
      - core_brokers.brokers.sk_broker
    description: Surrogate key of the 3P broker partner when is_rent_3p_supply; '-1' when not 3P supply or company is not in core_brokers.brokers.
  sk_status_end_date:
    lineage:
      - datalake_ebdb_listing.house_listing_status.ts_status_ended
    description: Date when status ended. If it is equal to -1, it means the status
      is still current.
  sk_status_start_date:
    lineage:
      - datalake_ebdb_listing.house_listing_status.ts_status_started
    description: Date when status started.
  status_change_reason:
    lineage:
      - datalake_ebdb_listing.house_listing_status.status_change_reason
    description: Business reason code explaining why the listing status changed in this event. Legacy LBC code; unchanged by deactivation enrichment.
  deactivation_reason:
    lineage:
      - datalake_ebdb_listing.house_listing_status.deactivation_reason
    description: Structured deactivation reason from the new status log taxonomy. NULL before log availability or when no match exists.
  deactivation_reason_category:
    lineage:
      - datalake_ebdb_listing.house_listing_status.deactivation_reason_category
    description: Macro category of the deactivation reason from the new status log taxonomy.
  deactivation_additional_context:
    lineage:
      - datalake_ebdb_listing.house_listing_status.deactivation_additional_context
    description: Optional free-text context from the owner during deactivation in the new status log.
  status_history:
    lineage:
      - datalake_ebdb_listing.house_listing_status.status_history
    description: Listing status value effective during this status-change interval.
    categories:
      aguardando_publicacao: Waiting publication.
      alugado: Rented.
      despublicado: Unpublished.
      edicao: Editing.
      edicaoSemUsuario: No user editing.
      edicaoUsuarioNaoConfirmado: Unconfirmed user editing.
      excluido: Legacy house-level exclusion (House.status). Set only when all business contexts on the house are OPTED_OUT.
      publicado: Published.
      suspenso: Suspended.
      EDITING: Editing.
      OPTED_OUT: Permanent logical exclusion from this business context. Not UNPUBLISHED or SUSPENDED. Use status_reason.
      PUBLISHED: Published.
      SUSPENDED: Suspended.
      UNPUBLISHED: Unpublished.
  ts_load:
    description: Timestamp when the data was loaded.
  ts_status_end:
    lineage:
      - datalake_ebdb_listing.house_listing_status.ts_status_ended
    description: Timestamp of when status ended. If it is equal NULL, it means the
      status is still current.
  ts_status_start:
    lineage:
      - datalake_ebdb_listing.house_listing_status.ts_status_started
    description: Timestamp of when status started.
