cluster:
  type: custom_cluster
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE
  databricks_conn_id: databricks_new_env
  custom_configurations:
    driver_node_type_id: m5d.2xlarge
    node_type_id: m5d.4xlarge
    num_workers: 3
    runtime_engine: PHOTON
    spark_version: 16.4.x-scala2.12
    aws_attributes:
      ebs_volume_size: 200
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: USER_ISOLATION
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
validation:
  cluster:
    type: consolidation_l_general_cluster
    databricks_conn_id: databricks_new_env
    access_control_list:
      group_name: analytics-engineers
      permission_level: CAN_MANAGE
    custom_configurations:
      num_workers: 3
      node_type_id: m6gd.4xlarge
      driver_node_type_id: m6gd.2xlarge
      runtime_engine: PHOTON
