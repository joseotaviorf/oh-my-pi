dag:
  name: ebdb_house
  schedule_start_date: 2021, 2, 20
  schedule_interval: 10 21,8,12 * * *
  owner: Data House and Listing
  documentation:
    dag_purpose: Extraction of EBDB tables related to House into data lake. EBDB is the main database for QuintoAndar.
workflow:
  type: cdc
  layer: raw
  database_type: mysql
  source_database: ebdb
  custom_schema: ebdb
  source_schema: ebdb
  tables_customization:
    HouseEnrichment:
      clean_table_name: house_enrichment
    HouseEnrichment_AUD:
      clean_table_name: house_enrichment_aud
    HouseMaintenanceCondition:
      clean_table_name: house_maintenance_condition
    HouseMaintenanceCondition_AUD:
      clean_table_name: house_maintenance_condition_aud
    HouseMedia:
      clean_table_name: house_media
    HousePredictedPrice:
      clean_table_name: house_predicted_price
    HousePredictedPrice_AUD:
      clean_table_name: house_predicted_price_aud
    HousePriceSuggestion:
      clean_table_name: house_price_suggestion
    SocialHousingProgram:
      clean_table_name: social_housing_program
      z_order_by: [type]
    SocialHousingProgramClassification:
      clean_table_name: social_housing_program_classification
      raw_z_order_by: [imovel_id]
      clean_z_order_by: [id_house]
    HouseRating:
      clean_table_name: house_rating
    HouseRating_RatingLabel:
      raw_primary_keys: ["HouseRating_id", "ratingLabels_id"]
      clean_table_name: house_rating_rating_label
      clean_primary_keys: ["id_house_rating", "id_rating_labels"]
    HouseRegistrationStatus:
      clean_table_name: house_registration_status
    HouseRegistrationStatus_AUD:
      clean_table_name: house_registration_status_aud
    HouseRentCosts_AUD:
      clean_table_name: house_rent_costs_aud
    HouseSpecialCondition:
      clean_table_name: house_special_condition
  extra_query_template_params:
    load_end_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, 1), 'load_end_date') }}"
