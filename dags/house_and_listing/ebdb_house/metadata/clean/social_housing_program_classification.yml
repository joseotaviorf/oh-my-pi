database_name: datalake_ebdb_clean
table_name: social_housing_program_classification
owner: bruna.prates@quintoandar.com.br
domain: House and Listing
description: |
  CDC mirror of the SocialHousingProgramClassification association table from EBDB.
  One current classification row per house (PK id, unique id_house). Absence of a row
  for a house means it was never classified. id_social_housing_program is set only
  when status is DECLARED.
columns:
  id:
    lineage:
      - datalake_ebdb_raw.SocialHousingProgramClassification.id
    description: Surrogate primary key of the classification record in EBDB.
  id_house:
    lineage:
      - datalake_ebdb_raw.SocialHousingProgramClassification.imovel_id
    description: Foreign key to the house (Imovel) carrying this classification.
  id_social_housing_program:
    lineage:
      - datalake_ebdb_raw.SocialHousingProgramClassification.social_housing_program_id
    description: Foreign key to social_housing_program; null when status is not DECLARED.
  status:
    lineage:
      - datalake_ebdb_raw.SocialHousingProgramClassification.status
    description: Owner declaration outcome for the house HIS/HMP classification.
    categories:
      DECLARED: House is regulated and the program type (HIS_1/HIS_2/HMP) is known.
      REGULATED_TYPE_UNKNOWN: Owner knows the house is regulated but not which program type.
      NOT_APPLICABLE: Owner declared the house fits none of the regulated categories.
      OWNER_DOES_NOT_KNOW: Owner cannot answer whether the house is regulated.
  ts_created:
    lineage:
      - datalake_ebdb_raw.SocialHousingProgramClassification.created_at
    description: Timestamp when the classification record was created in EBDB.
  ts_updated:
    lineage:
      - datalake_ebdb_raw.SocialHousingProgramClassification.updated_at
    description: Timestamp when the classification record was last updated in EBDB.
  op_cdc:
    lineage:
      - datalake_ebdb_raw.SocialHousingProgramClassification.op_cdc
    description: CDC operation type captured by Debezium.
    categories:
      r: Read/snapshot - initial load of existing records.
      c: Create - new record inserted.
      u: Update - existing record modified.
      d: Delete - record removed.
  ts_cdc_transaction:
    lineage:
      - datalake_ebdb_raw.SocialHousingProgramClassification.ts_cdc_transaction
    description: Timestamp when the CDC system captured this transaction (millisecond
      precision).
  ts_database_transaction:
    lineage:
      - datalake_ebdb_raw.SocialHousingProgramClassification.ts_database_transaction
    description: Timestamp of the original database transaction in the source system.
