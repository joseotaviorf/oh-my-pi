database_name: datalake_ebdb_clean
table_name: house_predicted_price
owner: bruna.prates@quintoandar.com.br
domain: House and Listing
description: CDC mirror of the HousePredictedPrice EBDB table. One row per prediction
  record (PK id). Contains predicted price percentiles (p10-p90) generated by the
  pricing model for each house and business context.
columns:
  id:
    lineage:
      - datalake_ebdb_raw.housepredictedprice.id
    description: Primary key of the predicted price record in EBDB.
  id_house:
    lineage:
      - datalake_ebdb_raw.housepredictedprice.houseId
    description: Foreign key to the house for which the pricing model generated this
      prediction.
  business_context:
    lineage:
      - datalake_ebdb_raw.housepredictedprice.businessContext
    description: Rental or sale business context to which this price prediction applies.
  p_10:
    lineage:
      - datalake_ebdb_raw.housepredictedprice.p10
    description: Predicted price at the 10th percentile from the pricing calculator
      model.
  p_20:
    lineage:
      - datalake_ebdb_raw.housepredictedprice.p20
    description: Predicted price at the 20th percentile from the pricing calculator
      model.
  p_30:
    lineage:
      - datalake_ebdb_raw.housepredictedprice.p30
    description: Predicted price at the 30th percentile from the pricing calculator
      model.
  p_40:
    lineage:
      - datalake_ebdb_raw.housepredictedprice.p40
    description: Predicted price at the 40th percentile from the pricing calculator
      model.
  p_50:
    lineage:
      - datalake_ebdb_raw.housepredictedprice.p50
    description: Predicted price at the 50th percentile (median) from the pricing
      calculator model.
  p_60:
    lineage:
      - datalake_ebdb_raw.housepredictedprice.p60
    description: Predicted price at the 60th percentile from the pricing calculator
      model.
  p_70:
    lineage:
      - datalake_ebdb_raw.housepredictedprice.p70
    description: Predicted price at the 70th percentile from the pricing calculator
      model.
  p_80:
    lineage:
      - datalake_ebdb_raw.housepredictedprice.p80
    description: Predicted price at the 80th percentile from the pricing calculator
      model.
  p_90:
    lineage:
      - datalake_ebdb_raw.housepredictedprice.p90
    description: Predicted price at the 90th percentile from the pricing calculator
      model.
  certainty:
    lineage:
      - datalake_ebdb_raw.housepredictedprice.certainty
    description: Confidence level assigned by the pricing model to this prediction.
  ts_created:
    lineage:
      - datalake_ebdb_raw.housepredictedprice.criadoEm
    description: Timestamp when the predicted price record was created.
  ts_updated:
    lineage:
      - datalake_ebdb_raw.housepredictedprice.atualizadoEm
    description: Timestamp when the predicted price record was last updated.
  op_cdc:
    lineage:
      - datalake_ebdb_raw.housepredictedprice.op_cdc
    description: CDC operation type captured by Debezium.
    categories:
      r: Read/snapshot - initial load of existing records.
      c: Create - new record inserted.
      u: Update - existing record modified.
      d: Delete - record removed.
  ts_cdc_transaction:
    lineage:
      - datalake_ebdb_raw.housepredictedprice.ts_cdc_transaction
    description: Timestamp when the CDC system captured this transaction (millisecond
      precision).
  ts_database_transaction:
    lineage:
      - datalake_ebdb_raw.housepredictedprice.ts_database_transaction
    description: Timestamp of the original database transaction in the source system.
