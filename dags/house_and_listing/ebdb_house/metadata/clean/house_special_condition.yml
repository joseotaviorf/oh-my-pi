database_name: datalake_ebdb_clean
table_name: house_special_condition
owner: bruna.prates@quintoandar.com.br
domain: House and Listing
description: CDC mirror of the HouseSpecialCondition association table. One row per
  (house, special condition) pair (PK id_house + id_special_condition). Links each
  house to its special conditions such as access restrictions or custom rules.
columns:
  id_house:
    lineage:
      - datalake_ebdb_raw.housespecialcondition.house_id
    description: Foreign key to the house linked to the special condition in this
      association.
  id_special_condition:
    lineage:
      - datalake_ebdb_raw.housespecialcondition.specialcondition_id
    description: Foreign key to the special condition catalog entry applied to the
      house.
  op_cdc:
    lineage:
      - datalake_ebdb_raw.housespecialcondition.op_cdc
    description: CDC operation type captured by Debezium.
    categories:
      r: Read/snapshot - initial load of existing records.
      c: Create - new record inserted.
      u: Update - existing record modified.
      d: Delete - record removed.
  ts_cdc_transaction:
    lineage:
      - datalake_ebdb_raw.housespecialcondition.ts_cdc_transaction
    description: Timestamp when the CDC system captured this transaction (millisecond
      precision).
  ts_database_transaction:
    lineage:
      - datalake_ebdb_raw.housespecialcondition.ts_database_transaction
    description: Timestamp of the original database transaction in the source system.
