database_name: datalake_ebdb_clean
table_name: house_maintenance_condition_aud
owner: bruna.prates@quintoandar.com.br
domain: House and Listing
description: Audit table for HouseMaintenanceCondition. Tracks all historical changes
  to maintenance conditions per house. Sourced from HouseMaintenanceCondition_AUD
  in EBDB.
columns:
  id_house_maintenance_condition:
    lineage:
      - datalake_ebdb_raw.housemaintenancecondition_aud.id
    description: Primary key of the maintenance condition record at this audit revision.
  rev:
    lineage:
      - datalake_ebdb_raw.housemaintenancecondition_aud.rev
    description: Revision number from the Hibernate Envers audit entity.
  rev_type:
    lineage:
      - datalake_ebdb_raw.housemaintenancecondition_aud.revtype
    description: Type of Envers revision operation (insert, update or delete) for this change event.
  maintenance_condition:
    lineage:
      - datalake_ebdb_raw.housemaintenancecondition_aud.maintenancecondition
    description: Maintenance condition value recorded at this audit revision.
  id_house:
    lineage:
      - datalake_ebdb_raw.housemaintenancecondition_aud.houseid
    description: Foreign key to the house whose maintenance condition changed in this
      revision.
  op_cdc:
    lineage:
      - datalake_ebdb_raw.housemaintenancecondition_aud.op_cdc
    description: CDC operation type captured by Debezium.
    categories:
      r: Read/snapshot - initial load of existing records.
      c: Create - new record inserted.
      u: Update - existing record modified.
      d: Delete - record removed.
  ts_cdc_transaction:
    lineage:
      - datalake_ebdb_raw.housemaintenancecondition_aud.ts_cdc_transaction
    description: Timestamp when the CDC system captured this transaction (millisecond
      precision).
  ts_database_transaction:
    lineage:
      - datalake_ebdb_raw.housemaintenancecondition_aud.ts_database_transaction
    description: Timestamp of the original database transaction in the source system.
