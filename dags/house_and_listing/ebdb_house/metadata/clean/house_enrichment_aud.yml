---
database_name: datalake_ebdb_clean
table_name: house_enrichment_aud
owner: bruna.prates@quintoandar.com.br
domain: House and Listing
description: Audit table for HouseEnrichment. One row per change event (PK id + rev).
  Tracks all historical revisions of house enrichment requests processed by the Vespúcio
  service, including status, Dejavu job identifiers, event triggers and model versions.
  Sourced from houseenrichment_aud in EBDB.
columns:
  id:
    lineage:
      - datalake_ebdb_raw.houseenrichment_aud.id
    description: Primary key of the house enrichment record at this audit revision.
  id_house:
    lineage:
      - datalake_ebdb_raw.houseenrichment_aud.house_id
    description: Foreign key to the house whose enrichment configuration changed in
      this revision.
  id_dejavu:
    lineage:
      - datalake_ebdb_raw.houseenrichment_aud.dejavu_id
    description: Dejavu job identifier captured in this enrichment audit revision.
  status:
    lineage:
      - datalake_ebdb_raw.houseenrichment_aud.status
    description: Enrichment processing status at the time of this audit revision.
  event_trigger:
    lineage:
      - datalake_ebdb_raw.houseenrichment_aud.event_trigger
    description: Business event that triggered the enrichment change in this revision.
  version_id_dejavu:
    lineage:
      - datalake_ebdb_raw.houseenrichment_aud.dejavu_id_version
    description: Dejavu model version applied when this audit revision was recorded.
  rev:
    lineage:
      - datalake_ebdb_raw.houseenrichment_aud.rev
    description: Revision number from the Hibernate Envers audit entity.
  rev_type:
    lineage:
      - datalake_ebdb_raw.houseenrichment_aud.REVTYPE
    description: Type of Envers revision operation (insert, update or delete) for this change event.
  mod_id_house:
    lineage:
      - datalake_ebdb_raw.houseenrichment_aud.house_id_MOD
    description: Modification flag indicating whether id_house changed in this audit
      revision.
  mod_id_dejavu:
    lineage:
      - datalake_ebdb_raw.houseenrichment_aud.dejavu_id_MOD
    description: Modification flag indicating whether id_dejavu changed in this audit
      revision.
  mod_status:
    lineage:
      - datalake_ebdb_raw.houseenrichment_aud.status_MOD
    description: Modification flag indicating whether status changed in this audit
      revision.
  mod_event_trigger:
    lineage:
      - datalake_ebdb_raw.houseenrichment_aud.event_trigger_MOD
    description: Modification flag indicating whether event_trigger changed in this
      audit revision.
  mod_version_id_dejavu:
    lineage:
      - datalake_ebdb_raw.houseenrichment_aud.dejavu_id_version_MOD
    description: Modification flag indicating whether version_id_dejavu changed in
      this audit revision.
  ts_created:
    lineage:
      - datalake_ebdb_raw.houseenrichment_aud.created_at
    description: Timestamp when the enrichment record was created in the source system.
  ts_updated:
    lineage:
      - datalake_ebdb_raw.houseenrichment_aud.updated_at
    description: Timestamp when the enrichment record was last updated in the source
      system.
  op_cdc:
    lineage:
      - datalake_ebdb_raw.houseenrichment_aud.op_cdc
    description: CDC operation type captured by Debezium.
    categories:
      r: Read/snapshot - initial load of existing records.
      c: Create - new record inserted.
      u: Update - existing record modified.
      d: Delete - record removed.
  ts_cdc_transaction:
    lineage:
      - datalake_ebdb_raw.houseenrichment_aud.ts_cdc_transaction
    description: Timestamp when the CDC system captured this transaction (millisecond
      precision).
  ts_database_transaction:
    lineage:
      - datalake_ebdb_raw.houseenrichment_aud.ts_database_transaction
    description: Timestamp of the original database transaction in the source system.
