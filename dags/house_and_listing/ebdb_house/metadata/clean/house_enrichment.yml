---
database_name: datalake_ebdb_clean
table_name: house_enrichment
owner: gustavo.miller@quintoandar.com.br
domain: House and Listing
description: The enrichment service is responsible for enriching house information,
  especially amenities, using Vespúcio as source. These are the houses that were or
  will be enriched.
columns:
  id:
    lineage:
      - datalake_ebdb_raw.houseenrichment.id
    description: Primary key of the house enrichment request in the Vespúcio enrichment
      service.
  id_house:
    lineage:
      - datalake_ebdb_raw.houseenrichment.house_id
    description: Foreign key to the house whose amenities and attributes are being
      enriched.
  id_dejavu:
    lineage:
      - datalake_ebdb_raw.houseenrichment.dejavu_id
    description: Identifier of the Dejavu enrichment job or pipeline run processing
      this house.
  status:
    lineage:
      - datalake_ebdb_raw.houseenrichment.status
    description: Processing status of the enrichment request in the Vespúcio workflow.
  event_trigger:
    lineage:
      - datalake_ebdb_raw.houseenrichment.event_trigger
    description: Business event that triggered the enrichment, such as publication
      or listing update.
  granularity:
    lineage:
      - datalake_ebdb_raw.houseenrichment.granularity
    description: Level of detail requested for the enrichment output on this house.
  version_id_dejavu:
    lineage:
      - datalake_ebdb_raw.houseenrichment.dejavu_id_version
    description: Version identifier of the Dejavu model or ruleset applied to this
      enrichment.
  ts_created:
    lineage:
      - datalake_ebdb_raw.houseenrichment.created_at
    description: Timestamp when the enrichment request was created in the source system.
  ts_updated:
    lineage:
      - datalake_ebdb_raw.houseenrichment.updated_at
    description: Timestamp when the enrichment request was last updated in the source
      system.
