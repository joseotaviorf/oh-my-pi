database_name: datalake_ebdb_clean
table_name: house_rating
owner: bruna.prates@quintoandar.com.br
domain: House and Listing
description: CDC mirror of the HouseRating EBDB table. One row per rating record (PK
  id). Contains quality ratings assigned to houses during the registration process.
columns:
  id:
    lineage:
      - datalake_ebdb_raw.houserating.id
    description: Primary key of the house rating record in EBDB.
  ts_updated:
    lineage:
      - datalake_ebdb_raw.houserating.atualizadoem
    description: Timestamp when the rating record was last updated.
  ts_created:
    lineage:
      - datalake_ebdb_raw.houserating.criadoem
    description: Timestamp when the rating record was created.
  complementary_info:
    lineage:
      - datalake_ebdb_raw.houserating.complementaryinfo
    description: Free-text notes supporting the quality rating decision during registration.
  rating:
    lineage:
      - datalake_ebdb_raw.houserating.rating
    description: Quality score assigned to the house during the registration review
      process.
  op_cdc:
    lineage:
      - datalake_ebdb_raw.houserating.op_cdc
    description: CDC operation type captured by Debezium.
    categories:
      r: Read/snapshot - initial load of existing records.
      c: Create - new record inserted.
      u: Update - existing record modified.
      d: Delete - record removed.
  ts_cdc_transaction:
    lineage:
      - datalake_ebdb_raw.houserating.ts_cdc_transaction
    description: Timestamp when the CDC system captured this transaction (millisecond
      precision).
  ts_database_transaction:
    lineage:
      - datalake_ebdb_raw.houserating.ts_database_transaction
    description: Timestamp of the original database transaction in the source system.
