database_name: datalake_ebdb_clean
table_name: house_rating
owner: bruna.prates@quintoandar.com.br
domain: House and Listing
description: CDC mirror of the HouseRating EBDB table. One row per rating record (PK id). Contains quality ratings assigned
  to houses during the registration process.
columns:
  id:
    lineage:
      - datalake_ebdb_raw.houserating.id
  ts_updated:
    lineage:
      - datalake_ebdb_raw.houserating.atualizadoem
  ts_created:
    lineage:
      - datalake_ebdb_raw.houserating.criadoem
  complementary_info:
    lineage:
      - datalake_ebdb_raw.houserating.complementaryinfo
  rating:
    lineage:
      - datalake_ebdb_raw.houserating.rating
