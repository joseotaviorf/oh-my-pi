database_name: datalake_ebdb_clean
table_name: house_media
owner: bruna.prates@quintoandar.com.br
domain: House and Listing
description: CDC mirror of the HouseMedia EBDB table. One row per media asset (PK id). Contains photos, videos and other
  media items associated with each house. Multiple media items can exist per house.
columns:
  id:
    lineage:
      - datalake_ebdb_raw.housemedia.id
  id_house:
    lineage:
      - datalake_ebdb_raw.housemedia.house_id
  type:
    lineage:
      - datalake_ebdb_raw.housemedia.type
  url:
    lineage:
      - datalake_ebdb_raw.housemedia.url
  ts_created:
    lineage:
      - datalake_ebdb_raw.housemedia.created_on
  ts_updated:
    lineage:
      - datalake_ebdb_raw.housemedia.updated_on
