database_name: datalake_ebdb_clean
table_name: house_rating_rating_label
owner: bruna.prates@quintoandar.com.br
domain: House and Listing
description: CDC mirror of the HouseRating_RatingLabel association table. One row
  per (rating, label) pair (PK id_house_rating + id_rating_labels). Links each house
  rating to its rating labels.
columns:
  id_house_rating:
    lineage:
      - datalake_ebdb_raw.houserating_ratinglabel.houserating_id
    description: Foreign key to the house rating in this rating-to-label association.
  id_rating_labels:
    lineage:
      - datalake_ebdb_raw.houserating_ratinglabel.ratinglabels_id
    description: Foreign key to the rating label applied to the house rating.
  op_cdc:
    lineage:
      - datalake_ebdb_raw.houserating_ratinglabel.op_cdc
    description: CDC operation type captured by Debezium.
    categories:
      r: Read/snapshot - initial load of existing records.
      c: Create - new record inserted.
      u: Update - existing record modified.
      d: Delete - record removed.
  ts_cdc_transaction:
    lineage:
      - datalake_ebdb_raw.houserating_ratinglabel.ts_cdc_transaction
    description: Timestamp when the CDC system captured this transaction (millisecond
      precision).
  ts_database_transaction:
    lineage:
      - datalake_ebdb_raw.houserating_ratinglabel.ts_database_transaction
    description: Timestamp of the original database transaction in the source system.
