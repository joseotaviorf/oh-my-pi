---
database_name: datalake_sale_ongoing_listings
table_name: ongoing_listings_daily_info
description: Every row of this table is a snapshot of one sale ongoing listing per day. If it had the status="PUBLISHED"
  at that day, no matter for how long, it will appear here, along with some metrics such as search, listing page viewed,
  visit booked, and other demand data. DO NOT PERFORM HISTORICAL REPROCESSING PRIOR TO JUNE 15, 2025. Data before this
  date was obtained through the fact table, whose code is not the same. Partitioned by year, month, day. Always filter
  on year, month, day in WHERE clauses to enable partition pruning and avoid full table scans.
domain: House and Listing
owner: bruna.prates@quintoandar.com.br
columns:
  id_snapshot:
    description: Primary key of the table, formed by concatenating id_house to id_snapshot_date.
    lineage:
      - datalake_ebdb_clean.listing_business_context_aud.id_house
      - datalake_quintoandar.aux_date.id_date
  id_snapshot_date:
    description: Date ID (%Y%m%d format) of the snapshot.
    lineage:
      - datalake_quintoandar.aux_date.id_date
  id_sale_listing:
    description: Identifier of the sale listing being tracked as ongoing on this day.
    lineage:
      - datalake_sale_listings.sale_listing.id_sale_listing
  id_house:
    description: Identifier of the house being tracked as an ongoing sale listing
      on this day.
    lineage:
      - datalake_ebdb_clean.listing_business_context_aud.id_house
  id_region:
    description: ID of the region of the house.
    lineage:
      - datalake_ebdb_clean.house.id_region
  id_suggestion_change:
    description: The Id of the suggestion change record from the pricing model.
    lineage:
      - datalake_ebdb_pricing.house_suggestion_changes.id_suggestion_change
  sale_type:
    lineage:
    - datalake_sale_primary_market.listing_sale_type.sale_type
    description: >
      Listing market type for the SALE listing business context of this house, sourced
      from the primary-market SSOT enrich_sale_primary_market.listing_sale_type (PRIMARY
      or SECONDARY, ListingSaleModel.saleType; the legacy is_primary_market flag is
      not used).
      Null when the house has no SALE listing sale model. Grain is id_house. Cut stock
      metrics with sale_type = 'PRIMARY'.
    categories:
      PRIMARY: New-build / primary market listing (empreendimento).
      SECONDARY: Resale / secondary market listing.
  sale_price:
    description: Price of the sale listing at the end of that day.
    lineage:
      - datalake_ebdb_pricing.listing_price_change.price
  calculator_min_price:
    description: Minimum price estimated by the calculator output. May also be referred
      as 'p_10'.
    lineage:
      - datalake_ebdb_pricing.listing_prediction_changes.calculator_min_price
  calculator_p20_price:
    description: Estimated price related to the 20% percentile of the calculator's
      output. May also be referred as 'p_20'.
    lineage:
      - datalake_ebdb_pricing.listing_prediction_changes.calculator_p20_price
  calculator_p30_price:
    description: Estimated price related to the 30% percentile of the calculator's
      output. May also be referred as 'p_30'.
    lineage:
      - datalake_ebdb_pricing.listing_prediction_changes.calculator_p30_price
  calculator_p40_price:
    description: Estimated price related to the 40% percentile of the calculator's
      output. May also be referred as 'p_40'.
    lineage:
      - datalake_ebdb_pricing.listing_prediction_changes.calculator_p40_price
  calculator_price:
    description: Most likely price for the listing estimated by the calculator output.
      May also be referred as 'p_50'.
    lineage:
      - datalake_ebdb_pricing.listing_prediction_changes.calculator_price
  calculator_p60_price:
    description: Estimated price related to the 60% percentile of the calculator's
      output. May also be referred as 'p_60'.
    lineage:
      - datalake_ebdb_pricing.listing_prediction_changes.calculator_p60_price
  calculator_p70_price:
    description: Estimated price related to the 70% percentile of the calculator's
      output. May also be referred as 'p_70'.
    lineage:
      - datalake_ebdb_pricing.listing_prediction_changes.calculator_p70_price
  calculator_p80_price:
    description: Estimated price related to the 80% percentile of the calculator's
      output. May also be referred as 'p_80'.
    lineage:
      - datalake_ebdb_pricing.listing_prediction_changes.calculator_p80_price
  calculator_max_price:
    description: Maximum price estimated by the calculator output. May also be referred
      as 'p_90'.
    lineage:
      - datalake_ebdb_pricing.listing_prediction_changes.calculator_max_price
  lower_bound_limit:
    description: The lowest allowed price (floor) for the sale pricing suggestion.
    lineage:
      - datalake_ebdb_pricing.house_suggestion_changes.lower_bound_limit
  suggested_lower_bound_price:
    description: The minimum value of the price range suggested by the pricing model.
    lineage:
      - datalake_ebdb_pricing.house_suggestion_changes.suggested_lower_bound_price
  suggested_upper_bound_price:
    description: The maximum value of the price range suggested by the pricing model.
    lineage:
      - datalake_ebdb_pricing.house_suggestion_changes.suggested_upper_bound_price
  upper_bound_limit:
    description: The highest allowed price (ceiling) for the sale pricing suggestion.
    lineage:
      - datalake_ebdb_pricing.house_suggestion_changes.upper_bound_limit
  suggestion_certainty:
    description: Level of certainty or confidence associated with the pricing suggestion
      from the pricing model.
    lineage:
      - datalake_ebdb_pricing.house_suggestion_changes.suggestion_certainty
  qt_search_results_page_viewed:
    description: Amount of times the house was shown in the search results in that
      day.
  qt_listing_page_viewed:
    description: Amount of times the listing page was viewed in that day.
  qt_favorites:
    description: Amount of times the listing page was added to favorites in that day.
  qt_visits_booked:
    description: Amount of visits booked in that day.
  qt_visits_completed:
    description: Amount of visits completed in that day.
  qt_offers_submitted:
    description: Amount of offers submitted in that day.
  qt_offers_accepted:
    description: Amount of offers accepted in that day.
  qt_sale_agreements_created:
    description: Amount of sale agreements created in that day.
  qt_sale_agreements_signed:
    description: Amount of sale agreements signed in that day.
  days_published:
    description: Number of days the listing has been published. It starts counting
      from the day of publication.
    lineage:
      - datalake_ebdb_clean.listing_business_context_aud.ts_last_publication
      - datalake_quintoandar.aux_date.date
  ts_first_publication:
    description: The timestamp of when the listing was first published.
    lineage:
      - datalake_ebdb_clean.listing_business_context_aud.ts_first_publication
  ts_last_publication:
    description: The timestamp of when the listing was last published.
    lineage:
      - datalake_ebdb_clean.listing_business_context_aud.ts_last_publication
  year:
    description: Calendar year of the daily snapshot partition for this ongoing listing row.
      Always filter on this partition column in WHERE clauses to enable partition pruning when scanning the table.
    lineage:
      - datalake_quintoandar.aux_date.year
  month:
    description: Calendar month of the daily snapshot partition for this ongoing listing row.
      Always filter on this partition column in WHERE clauses to enable partition pruning when scanning the table.
    lineage:
      - datalake_quintoandar.aux_date.month
  day:
    description: Calendar day of the daily snapshot partition for this ongoing listing row.
      Always filter on this partition column in WHERE clauses to enable partition pruning when scanning the table.
    lineage:
      - datalake_quintoandar.aux_date.day
