database_name: dw_quintoandar
table_name: fact_listing_price_changes
description: fact table containing each linsting price change
domain: House and Listing
owner: pedro.domingos@quintoandar.com.br
columns:
  sk_smart_price:
    lineage:
    - datalake_ebdb_smart_price.smart_price_versioning.id_smart_price
    description: key of smartprice
  sk_house_listing:
    lineage:
    - datalake_ebdb_clean.house_aud.id_house
    description: Key to identify house's listing in website
  sk_price_started_date:
    lineage:
    - datalake_ebdb_clean.user_revision_entity.ts_revision
    description: key to indetifiy date when rent started
  sk_price_ended_date:
    lineage:
    - datalake_ebdb_clean.user_revision_entity.ts_revision
    description: key to indetifiy date when rent ended
  is_smart_pricing_enabled:
    lineage:
    - datalake_ebdb_clean.dynamic_pricing_house_aud.is_enabled
    description: is enabled signals if smart price is able to act as soon as the listing
      has status = published
  rent:
    lineage:
    - datalake_ebdb_clean.house_aud.rent
    description: rental price
  days_with_same_rent:
    lineage:
    - datalake_ebdb_clean.user_revision_entity.ts_revision
    description: Number of days the house was in price
  ts_price_started:
    lineage:
    - datalake_ebdb_clean.user_revision_entity.ts_revision
    description: timestamp when rent started
  ts_price_ended:
    lineage:
    - datalake_ebdb_clean.user_revision_entity.ts_revision
    description: timestamp when rent ended
  price_change_reason:
    description: Reason for price change
    categories:
      smart price: ''
  rent_changes:
    description: Rental price change rank
  ts_load:
    description: timestamp when data update
