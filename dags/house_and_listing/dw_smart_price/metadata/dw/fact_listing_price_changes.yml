database_name: dw_quintoandar
table_name: fact_listing_price_changes
description: Fact table containing each listing price change.
domain: House and Listing
owner: bruna.prates@quintoandar.com.br
columns:
  sk_smart_price:
    lineage:
      - datalake_ebdb_smart_price.smart_price_versioning.id_smart_price
    description: Surrogate key of the smart price dimension. Joinable with dw_quintoandar.dim_smart_price.
  sk_house_listing:
    lineage:
      - datalake_ebdb_clean.house_aud.id_house
    description: Key to identify house's listing in website
  sk_price_started_date:
    lineage:
      - datalake_ebdb_clean.user_revision_entity.ts_revision
    description: key to identify date when rent started
  sk_price_ended_date:
    lineage:
      - datalake_ebdb_clean.user_revision_entity.ts_revision
    description: key to identify date when rent ended
  is_smart_pricing_enabled:
    lineage:
      - datalake_ebdb_clean.dynamic_pricing_house_aud.is_enabled
    description: is enabled signals if smart price is able to act as soon as the listing
      has status = published
  rent:
    lineage:
      - datalake_ebdb_clean.house_aud.rent
    description: Rental price of the listing at the time of this price change record.
  days_with_same_rent:
    lineage:
      - datalake_ebdb_clean.user_revision_entity.ts_revision
    description: Number of days the house was in price
  ts_price_started:
    lineage:
      - datalake_ebdb_clean.user_revision_entity.ts_revision
    description: Timestamp when rent started
  ts_price_ended:
    lineage:
      - datalake_ebdb_clean.user_revision_entity.ts_revision
    description: Timestamp when rent ended
  price_change_reason:
    description: Reason that triggered this rental price change.
    categories:
      smart price: Price change was triggered automatically by the smart pricing model.
  rent_changes:
    description: Rental price of the listing at the time of this price change record.
  ts_load:
    description: Timestamp when this price change record was loaded into the data warehouse.
