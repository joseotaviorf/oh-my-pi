---
database_name: datalake_ebdb_house
table_name: maintenance_condition_history
description: Table showing the history of changes in the conservation condition of the house. 
    Each row is a status for a property in a certain period of time (when is_last_condition is true, it becomes one row per house)
domain: House and Listing
owner: bruna.prates@quintoandar.com.br
columns:
  id_house:
    lineage:
      - datalake_ebdb_clean.house_maintenance_condition_aud.id_house
    description: Unique identifier of the house whose maintenance condition history is being tracked.
  house_condition:
    lineage:
      - datalake_ebdb_clean.house_maintenance_condition_aud.maintenance_condition
    description: House's maintenance condition.
    categories:
      ALMOST_PERFECT_STATE: 'House in a excellent state of maintenance.'
      NEW_OR_WITHOUT_BASIC_ITENS: 'New house in a good condition or a very good house but missing some basic items.'
      "NULL": 'If the house is not in any of the other categories, it is in this one.'
      OLD: 'Old house, may need some repairs.'
      PERFECT_STATE: 'House in a perfect condition.'
      POORLY_MAINTAINED: 'House in very poor condition.'
  country_code:
    lineage:
      - datalake_ebdb_country.house.country_code
    description: Country code related to the house's country.
    categories:
      BR: Brazil
      MX: Mexico
      Undefined: Country could not be determined.
  is_last_condition:
    description: Flag to indicate if is the actual maintenance condition status.
  dt_condition_started:
    description: Date of when the maintenance condition started.
  dt_condition_ended:
    description: Date when this maintenance condition period ended. Null if this is the current active condition (see is_last_condition).
