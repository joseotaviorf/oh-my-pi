dag:
  name: ebdb_house_fast_lane
  schedule_start_date: 2024,01,01
  schedule_interval: 0,30 * * * *
  owner: Data House and Listing
  criticality: Critical
  documentation:
    dag_purpose: |
      DAG containing tables from House context that are running every 30 minutes.
workflow:
  type: cdc
  layer: raw
  database_type: mysql
  dbutils_secret_key: EBDB_DB
  source_database: ebdb
  source_schema: ebdb
  custom_schema: ebdb
  execution_timeout_hours: 0.5
  tables_customization:
    Imovel:
      clean_primary_keys: [id]
      clean_table_name: house
      clean_z_order_by: [id_user, id_region, status]
      run_optimize: false
    Imovel_AUD:
      clean_primary_keys: [id_house, rev]
      clean_table_name: house_aud
      clean_z_order_by: [id_house]
      run_optimize: false
  extra_query_template_params:
    load_end_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, 1), 'load_end_date') }}"
