database_name: datalake_ebdb_clean
table_name: house_aud
domain: For Sale
owner: bruna.prates@quintoandar.com.br
description: >
  Comprehensive audit table for house registry from EBDB database, containing historical changes and modification tracking for all house records.
  This table captures both current values and modification flags for each field, enabling complete audit trail and change tracking across the QuintoAndar platform.
  Each record represents a version of a house with full audit information.
columns:
  rev:
    lineage:
      - datalake_ebdb_raw.imovel_aud.rev
    description: Revision number for the audit record. Unique identifier for each change transaction in the audit system.
  rev_type:
    lineage:
      - datalake_ebdb_raw.imovel_aud.revtype
    description: Type of revision operation (INSERT, UPDATE, DELETE). Indicates the nature of the change that triggered this audit record.
    categories:
      "0": Insertion operation.
      "1": Update operation.
      "2": Deletion operation.
  mod_rent:
    lineage:
      - datalake_ebdb_raw.imovel_aud.aluguel_mod
    description: Modification flag indicating whether the rent field was changed in this revision. Used for tracking rental price changes.
  mod_condo:
    lineage:
      - datalake_ebdb_raw.imovel_aud.condominio_mod
    description: Modification flag indicating whether the condominium fee was changed in this revision. Used for tracking cost changes.
  mod_iptu:
