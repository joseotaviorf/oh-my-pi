    description: Date of all listings that where publicated and had a contract signed.
    dimension: True
  sk_region:
    lineage:
      - dw_public.fact_house_listing_flows.sk_region
    description: Surrogate key of the region dimension, identifying the geographic area for this metric.
    dimension: True
  country_code:
    lineage:
      - dw_rent.dim_house_listing.country_code
    description: Country code of the house.
    dimension: True
  listing_to_contract_signed:
    description: Number of the listings in a day segmented by sk_region, which
      were published and converted to a contract signed.
    metric:
      name: Listing to Contract Signed Daily by SK Region
