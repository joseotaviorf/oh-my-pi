---
database_name: metric_rent
table_name: listing_to_contract_signed_daily_by_sk_region
description: Number of the listings in a day segmented by sk_region, which
  were published and converted to a contract signed. It can be limited by time to
  contract conversion, e.g. Listing to Rental in 4 weeks. The conversion time is
  related to the publication date. The filter for Days Published
  to Contract Signed uses the less or equal sign to calculate the conversion time.
  If multiplied by 100 we get the percentage of this metric.
