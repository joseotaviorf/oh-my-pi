database_name: metric_rent
table_name: new_first_listings_weekly
description:
  Table to count new first listings on a weekly basis. Here, we use the
  event milestone registered on the table fact_house_listing_flows - sk_first_listing_date.
domain: For Rent
owner: data-for-rent@quintoandar.com.br
columns:
  week:
    lineage:
      - dw_public.dim_date.date
    description: Week when the listing started.
    dimension: True
  country_code:
    lineage:
      - dw_rent.dim_contract.country_code
    description: Country code of the house.
    dimension: True
  new_first_listings:
    description: Weekly amount of new first listings segmented by sk_region.
    metric:
      name: New First Listing Weekly
      description: Weekly accumulated sum of the listings with category First Listings (version 1)
      acronym: NFL
      is_additive: True
      business_stage: Supply
      hierarchy: operations mgmt
      approved_by: augusto.torres@quintoandar.com.br
      link_to_metric: https://quintoandar.sa.looker.com/looks/4902
