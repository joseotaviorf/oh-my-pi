database_name: metric_rent
table_name: new_first_listings_daily_by_sk_region
description: Table to count new first listings on a daily basis segmented by sk_region. Here, we use the
  event milestone registered on the table fact_house_listing_flows - sk_first_listing_date.
  In addition, we have the region dimension embedded here on the column sk_region
  to segment this metric.
domain: House and Listing
owner: bruna.prates@quintoandar.com.br
columns:
  first_listing_date:
    lineage:
      - dw_public.dim_date.date
    description: Day when the listing started.
    dimension: True
  sk_region:
    lineage:
      - dw_public.fact_house_listing_flows.sk_region
    description: Surrogate key of the region dimension, identifying the geographic area for this metric.
    dimension: True
  country_code:
    lineage:
      - dw_public.fact_house_listing_flows.country_code
    description: Country code of the house.
    dimension: True
  new_first_listings:
    description: Daily amount of new first listings segmented by sk_region.
    metric:
      name: New First Listing Daily by SK Region
      description: Daily accumulated sum of the listings with category First Listings (version 1)  
      acronym: NFL
      is_additive: True
      business_stage: Supply
      hierarchy: operations mgmt
      approved_by: augusto.torres@quintoandar.com.br
      link_to_metric: ''
