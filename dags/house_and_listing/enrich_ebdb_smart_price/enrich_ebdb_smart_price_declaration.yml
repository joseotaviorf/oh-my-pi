dag:
  name: enrich_ebdb_smart_price
  schedule_start_date: 2020, 7, 1
  owner: Data House and Listing
  documentation:
    dag_purpose: |
      Creates enriched tables for the context `Smart Price` of ebdb adding dynamic pricing to listing information.
      In addition, tables that are base for price tracking for rental or sales are being allocated here too.
      This DAG is triggered by Mediator and loads the table via full load.
workflow:
  type: query_delta
  layer: enrich
