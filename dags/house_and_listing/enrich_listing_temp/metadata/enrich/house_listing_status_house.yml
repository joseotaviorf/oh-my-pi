---
database_name: datalake_listing_temp
table_name: house_listing_status_house
description: "[TO BE DEPRECATED, AVOID USING THIS TABLE] Information related to ForRent listings status. Each line represents
  a listing status change. Partitioned by country_code. Always filter on country_code in WHERE clauses to enable partition pruning
  and avoid full table scans."
domain: House and Listing
owner: bruna.prates@quintoandar.com.br
columns:
  id_house_listing:
    lineage:
      - datalake_ebdb_listing.house_status_version_order.id_house
      - datalake_ebdb_listing.house_status_version_order.order_version
    description: Identifier of the listing version whose status change is recorded
      in this row.
  id_house:
    lineage:
      - datalake_ebdb_listing.house_status_version_order.id_house
    description: Identifier of the physical property whose listing status changed.
  id_region:
    lineage:
      - datalake_ebdb_listing.house_status_version_order.id_region
    description: Identifier of the geographic region where the listing house is located.
  country_code:
    lineage:
      - datalake_ebdb_listing.house_status_version_order.country_code
    description: ISO country code of the market where this listing status event occurred.
      Partition key for multi-country isolation; always filter on this column in WHERE clauses to enable partition pruning.
  version:
    lineage:
      - datalake_ebdb_listing.house_status_version_order.order_version
    description: Listing version number active when this status transition was recorded.
  status_history:
    lineage:
      - datalake_ebdb_listing.house_status_version_order.status_history_new
    description: Listing status before the transition captured in this history row.
  status_change_reason:
    lineage:
      - datalake_ebdb_listing.house_status_version_order.reason
    description: Business reason explaining why the listing status changed in this
      event.
  is_last_status_of_day:
    description: If this line is the last status of the current day.
  ts_first_publication:
    lineage:
      - datalake_ebdb_listing.house_status_version_order.ts_first_publication
    description: Timestamp when this house was first publicated.
  ts_status_started:
    lineage:
      - datalake_ebdb_listing.house_status_version_order.ts_status_changed_new
    description: Timestamp when this status started.
  ts_status_ended:
    lineage:
      - datalake_ebdb_listing.house_status_version_order.ts_status_changed_next
    description: Timestamp when this status ended.
