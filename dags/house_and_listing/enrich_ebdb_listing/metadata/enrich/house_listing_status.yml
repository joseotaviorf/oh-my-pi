---
database_name: datalake_ebdb_listing
table_name: house_listing_status
description: Information related to ForRent listings. Partitioned by country_code. Always filter on country_code in WHERE
  clauses to enable partition pruning and avoid full table scans. Each line is a listing status, status_reason and version
  (listing state) with start and end timestamps.
domain: House and Listing
owner: bruna.prates@quintoandar.com.br
columns:
  country_code:
    lineage:
      - datalake_ebdb_listing.lbc_status_version_order.country_code
    description: Two-letter ISO country code where the listing is active. Partition key for multi-country isolation;
      always filter on this column in WHERE clauses to enable partition pruning.
    categories:
      BR: Brazil
      MX: Mexico
      Undefined: Country could not be determined.
  id_house:
    lineage:
      - datalake_ebdb_listing.lbc_status_version_order.id_house
    description: Unique identifier of the house record. Links to the house entity in the EBDB system.
  id_house_listing:
    lineage:
      - datalake_ebdb_listing.lbc_status_version_order.id_house
      - datalake_ebdb_listing.lbc_status_version_order.listing_version
    description: Composite identifier combining id_house and version (formatted as id_house concatenated with zero-padded version).
      Uniquely identifies a specific listing version.
  id_region:
    lineage:
      - datalake_ebdb_clean.house.id_region
    description: Identifier of the region where the house is located.
  is_last_status_of_day:
    lineage:
      - datalake_ebdb_listing.lbc_status_version_order.rev
    description: Boolean indicating if this is the last status of the day.
  revision_reason:
    lineage:
      - datalake_ebdb_listing.lbc_status_version_order.revision_reason
    description: Reason why the status has changed.
  status_change_reason:
    lineage:
      - datalake_ebdb_listing.lbc_status_version_order.status_reason
    description: Reason for the most recent status change of this listing. Legacy Listing Business Context (LBC) code; unchanged by deactivation enrichment.
  deactivation_reason:
    lineage:
      - datalake_ebdb_clean.house_listing_status_log.reason
    description: Structured deactivation reason from the new status log taxonomy. Populated only for first-party rows that pass the legacy deactivation gate and have a temporally matched log event. NULL before log availability (approximately February 2026) or when no match exists.
  deactivation_reason_category:
    lineage:
      - datalake_ebdb_clean.house_listing_status_log.reason_category
    description: Macro category of the deactivation reason from the new status log taxonomy (for example GAVE_UP, TEMPORARILY_UNAVAILABLE, CONTRACT_TERMINATION). Populated under the same conditions as deactivation_reason.
  deactivation_additional_context:
    lineage:
      - datalake_ebdb_clean.house_listing_status_log.additional_context
    description: Optional free-text context provided by the actor during deactivation in the new status log. Populated under the same conditions as deactivation_reason.
  status_history:
    lineage:
      - datalake_ebdb_listing.lbc_status_version_order.status
    description: Current status of the listing at the time this record was captured.
  ts_first_publication:
    lineage:
      - datalake_ebdb_listing.lbc_status_version_order.ts_first_publication
    description: Timestamp of the house first publication.
  ts_status_ended:
    lineage:
      - datalake_ebdb_listing.lbc_status_version_order.ts_state_ended
    description: Timestamp when this state (status, status_reason and version) has ended.
  ts_status_started:
    lineage:
      - datalake_ebdb_listing.lbc_status_version_order.ts_state_started
    description: Timestamp when this state (status, status_reason and version) has started.
  version:
    lineage:
      - datalake_ebdb_listing.lbc_status_version_order.listing_version
    description: Sequential version number of the listing business context (LBC), used to order changes over time.
