database_name: datalake_ebdb_listing
table_name: listing_business_context_status_history
description: Enrich table that contains the state (status and status reason) change history of rental and sale listings.
  Each row is a state change for each property's business context. Partitioned by country_code and business_context.
  Always filter on both columns in WHERE clauses to enable partition pruning.
domain: House and Listing
owner: bruna.prates@quintoandar.com.br
columns:
  id_house:
    lineage:
      - datalake_ebdb_clean.listing_business_context_aud.id_house
    description: Unique identifier of the house record. Links to the house entity in the EBDB system.
  status:
    lineage:
      - datalake_ebdb_clean.listing_business_context_aud.status
    description: Status of the listing business context at the recorded point in time.
    categories:
      EDITING: Editing
      PUBLISHED: Published
      SUSPENDED: Suspended
      UNPUBLISHED: Unpublished
      OPTED_OUT: Opted-out of the business context
  status_reason:
    lineage:
      - datalake_ebdb_clean.listing_business_context_aud.status_reason
    description: Reason for the status recorded in this history entry.
  is_last_state_of_day:
    description: Boolean flag indicating whether it's the house's last state of the day
  ts_first_publication:
    lineage:
      - datalake_ebdb_clean.listing_business_context_aud.ts_first_publication
    description: Timestamp of the house's first publication
  ts_last_publication:
    lineage:
      - datalake_ebdb_clean.listing_business_context_aud.ts_last_publication
    description: Timestamp of the house's last publication
  ts_state_started:
    lineage:
      - datalake_ebdb_user.user_revision_entity.ts_revision
    description: Timestamp of the state change
  ts_state_ended:
    lineage:
      - datalake_ebdb_user.user_revision_entity.ts_revision
    description: Timestamp of the next state change (null if it is the one currently in effect)
  country_code:
    lineage:
      - datalake_ebdb_country.house.country_code
    description: Listing's country of origin Partition key for multi-country isolation; always filter on this column in
      WHERE clauses to enable partition pruning.
    categories:
      BR: "Brazil's country code"
      MX: "Mexico's country code"
      Undefined: Unknown country code
  business_context:
    lineage:
      - datalake_ebdb_clean.listing_business_context_aud.business_context
    description: Business context of the property Partition key identifying the business context; always filter on this
      column together with country_code in WHERE clauses.
    categories:
      RENT: For Rent business context
      SALE: For Sale business context
      Undefined: Unknown business context
