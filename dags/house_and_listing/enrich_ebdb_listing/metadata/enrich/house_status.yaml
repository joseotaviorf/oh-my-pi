---
database_name: datalake_ebdb_listing
table_name: house_status
description: Each row in this table is a house status in QuintoAndar with it's ID.
  The ID of this table is generated by our pipeline and does not come from product databases.
domain: For Rent
owner: kleber.inoue@quintoandar.com.br
columns:
  id_house_status:
    lineage:
      - datalake_ebdb_listing.house_listing.status
      - datalake_ebdb_listing.house_listing.status_reason
    description: Unique ID of the house status.
      It's created by concatenating the status and status_reason columns and hashing the concatenation.
  house_status:
    lineage:
      - datalake_ebdb_listing.house_listing.status
    description: Status of the house.
  status_reason:
    lineage:
      - datalake_ebdb_listing.house_listing.status_reason
    description: House status reason.
