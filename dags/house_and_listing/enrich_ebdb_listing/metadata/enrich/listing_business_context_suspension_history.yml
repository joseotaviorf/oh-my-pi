---
database_name: datalake_ebdb_listing
table_name: listing_business_context_suspension_history
description: Enrich table that contains the suspension reason history of rental and sale listings. Partitioned by country_code
  and business_context. Always filter on both columns in WHERE clauses to enable partition pruning. Each row is a suspension reason
  change for each property's business context.
domain: House and Listing
owner: bruna.prates@quintoandar.com.br
columns:
  id_house:
    lineage:
      - datalake_ebdb_clean.listing_business_context_aud.id_house
    description: Unique identifier of the house record. Links to the house entity in the EBDB system.
  suspension_reason:
    lineage:
      - datalake_ebdb_clean.listing_business_context_aud.suspension_reason
    description: Reason why the listing business context was suspended.
  ts_status_started:
    lineage:
      - datalake_ebdb_clean.user_revision_entity.ts_revision
    description: Timestamp of when status reason started
  ts_status_ended:
    lineage:
      - datalake_ebdb_clean.user_revision_entity.ts_revision
    description: Timestamp of when status reason ended (null if it is currently in effect)
  country_code:
    lineage:
      - datalake_ebdb_country.house.country_code
    description: Two-letter ISO country code of the suspended listing. Partition key for multi-country isolation;
      always filter on this column in WHERE clauses to enable partition pruning.
    categories:
      BR: Brazil's country code
      MX: Mexico's country code
  business_context:
    lineage:
      - datalake_ebdb_clean.listing_business_context_aud.business_context
    description: Listing's business context Partition key identifying the business context;
      always filter on this column together with country_code in WHERE clauses.
    categories:
      SALE: For sale
      RENT: For rent
