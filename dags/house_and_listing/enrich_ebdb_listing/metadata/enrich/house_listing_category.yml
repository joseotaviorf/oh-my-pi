database_name: datalake_ebdb_listing
table_name: house_listing_category
description: Information related to ForRent listings. Each line is an unique listing with the listing categorization.
  Partitioned by country_code. Always filter on country_code in WHERE clauses to enable partition pruning and avoid full table scans.
domain: House and Listing
owner: bruna.prates@quintoandar.com.br
columns:
  country_code:
    lineage:
    - datalake_ebdb_listing.lbc_status_version_order.country_code
    description: Two-letter ISO country code where the listing is active. Partition key for multi-country isolation;
      always filter on this column in WHERE clauses to enable partition pruning.
    categories:
      BR: Brazil
      MX: Mexico
      Undefined: Country could not be determined.
  id_house_listing:
    lineage:
    - datalake_ebdb_listing.lbc_status_version_order.id_house
    - datalake_ebdb_listing.lbc_status_version_order.listing_version
    description: Composite identifier combining id_house and version (formatted as id_house concatenated with zero-padded version).
      Uniquely identifies a specific listing version.
  id_house:
    lineage:
    - datalake_ebdb_listing.lbc_status_version_order.id_house
    description: Unique identifier of the house record. Links to the house entity in the EBDB system.
  is_extended_rental:
    lineage:
    - datalake_ebdb_listing.lbc_status_version_order.is_extended_rental
    description: Boolean indicating if the contract termination was canceled after relisting as early demand
      or the owner asked to unpublish the listing after relisting as early demand and the contract was active.
  has_termination_canceled:
    lineage:
    - datalake_ebdb_listing.lbc_status_version_order.has_termination_canceled
    description: Boolean indicating if the contract termination was canceled after relisting as early demand.
  listing_category:
    description: Categorization of the listing based on the house history in the platform.
    categories:
      First Listing: Its the first time this house is being listed.
      Re-Listing: This house was already listed on the platform in the past.
      Recovered: This house is being listed after at least 12 weeks outside of the platform.
  revision_reason:
    lineage:
    - datalake_ebdb_listing.lbc_status_version_order.revision_reason
    description: Reason why an user changed some aspect of the house listing.
  status:
    lineage:
    - datalake_ebdb_listing.lbc_status_version_order.status
    description: Current status of the listing category record.
  status_history:
    lineage:
    - datalake_ebdb_listing.lbc_status_version_order.status
    description: Previous status of the listing.
  status_reason:
    lineage:
    - datalake_ebdb_listing.lbc_status_version_order.status_reason
    description: Reason for the current status of the listing category.
  ts_status_changed:
    lineage:
    - datalake_ebdb_listing.lbc_status_version_order.ts_state_started
    description: Timestamp when the status changed.
  ts_listing_version_start:
    lineage:
    - datalake_ebdb_listing.lbc_status_version_order.ts_state_started
    description: Timestamp when the listing version started.
  ts_listing_version_end:
    lineage:
    - datalake_ebdb_listing.lbc_status_version_order.ts_state_ended
    description: Timestamp when the listing version ended.
  ts_last_unpublished:
    lineage:
    - datalake_ebdb_listing.lbc_status_version_order.ts_state_started
    description: Timestamp of the last time the house was unpublished.
  version:
    lineage:
    - datalake_ebdb_listing.lbc_status_version_order.listing_version
    description: Sequential version number of the listing business context (LBC), used to order changes over time.
