database_name: datalake_ebdb_listing
table_name: rent_listing
description: Information related to ForRent listings. Each line is an unique listing, related to an unique house.
  Partitioned by country_code. Always filter on country_code in WHERE clauses to enable partition pruning and avoid full table scans.
domain: House and Listing
owner: bruna.prates@quintoandar.com.br
columns:
  id_listing_business_context:
    lineage:
    - datalake_ebdb_clean.listing_business_context.id
    description: Id of the listing that the house belongs to
  id_listing_rent_model:
    lineage:
    - datalake_ebdb_clean.listing_rent_model.id
    description: Identifier of the rent model associated with this rental listing.
  id_house:
    lineage:
    - datalake_ebdb_clean.listing_business_context.id_house
    description: Unique identifier of the house record. Links to the house entity in the EBDB system.
  country_code:
    lineage:
    - datalake_ebdb_country.house.country_code
    description: Country code related to the house's country. Partition key for multi-country isolation;
      always filter on this column in WHERE clauses to enable partition pruning.
    categories:
      BR: Brazil
      MX: Mexico
      Undefined: Country could not be determined.
  rental_administrator:
    lineage:
    - datalake_ebdb_clean.listing_rent_model.rental_administrator
    description: The rental administrator of the listing/house
    categories:
      OWNER: Owner is the rental administrator, which means that the listing is brokerage-only
      QUINTOANDAR: Default rental administrator, which is QuintoAndar
  status:
    lineage:
    - datalake_ebdb_clean.listing_business_context.status
    description: Current status of the rental listing.
  status_reason:
    lineage:
    - datalake_ebdb_clean.listing_business_context.status_reason
    description: Reason for the current status of the rental listing.
  ts_first_publication:
    lineage:
    - datalake_ebdb_clean.listing_business_context.ts_first_publication
    description: Timestamp of the first publication of listing
  ts_last_publication:
    lineage:
    - datalake_ebdb_clean.listing_business_context.ts_last_publication
    description: Timestamp of the last publication of listing
  ts_administrator_changed:
    description: Timestamp of when the rental administrator has changed
  ts_created:
    lineage:
    - datalake_ebdb_clean.listing_business_context.ts_created
    description: Timestamp of the creation of the listing
  ts_updated:
    lineage:
    - datalake_ebdb_clean.listing_business_context.ts_updated
    description: Timestamp of the last update of the listing
