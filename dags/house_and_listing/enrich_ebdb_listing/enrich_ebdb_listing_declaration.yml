dag:
  name: enrich_ebdb_listing
  schedule_start_date: 2020, 7, 1
  owner: Data House and Listing
  criticality: Critical
  documentation:
    dag_purpose: |
      Creates enriched tables for the context `Listing` of EBDB.
      This DAG is triggered by Mediator and loads the table via full load.
workflow:
  type: query_delta
  layer: enrich
  inner_dependencies:
    agents_with_keys:
    - house_listing
    - house_entrance_history
    - house
    house_entrance:
    - house_entrance_history
    house:
    - house_entrance
    house_listing:
    - house_listing_early_demand
    - listing_business_context
    - house_entrance_history
    - lbc_status_version_order
    - house_listing_status
    - house_listing_category
    - house_listing_special_conditions
    house_listing_category:
    - lbc_status_version_order
    house_listing_early_demand:
    - house_listing_category
    house_listing_fees:
    - house_listing
    house_listing_special_conditions:
    - house_listing_category
    house_listing_status:
    - house_status_version_order
    - lbc_status_version_order
    - house
    house_status:
    - house_listing
    lbc_status_version_order:
    - business_context_history
    - house_status_version_order
    # Keep heavy side jobs off the critical path until house_listing is published.
    # They compete with house_entrance_history / house_status_version_order for cluster slots.
    listing_business_context_suspension_history:
    - house_listing
    portability:
    - house_listing
    rent_listing:
    - house_listing
  tables_customization:
    agents_with_keys:
      partitions:
      - country_code
    business_context_history:
      partitions:
      - country_code
      - business_context
    house:
      partitions:
      - country_code
    house_entrance_history:
      partitions:
      - country_code
    house_listing:
      partitions:
      - country_code
    house_listing_category:
      partitions:
      - country_code
    house_listing_early_demand:
      partitions:
      - country_code
    house_listing_fees:
      partitions:
      - country_code
    house_listing_special_conditions:
      partitions:
      - country_code
    house_listing_status:
      partitions:
      - country_code
    house_status_version_order:
      partitions:
      - country_code
    lbc_status_version_order:
      partitions:
      - country_code
    listing_business_context:
      partitions:
      - country_code
      - business_context
    listing_business_context_status_history:
      partitions:
      - country_code
      - business_context
    listing_business_context_suspension_history:
      partitions:
      - country_code
      - business_context
    portability:
      partitions:
      - country_code
    rent_listing:
      partitions:
      - country_code
