---
database_name: datalake_ebdb_pricing
table_name: listing_prediction_changes
description: >
  Enrich table of rental and sale calculator prediction revisions from house_predicted_price_aud,
  per (id_house, business_context). Each row is one audit revision with calculator percentiles;
  validity windows and last-prediction flags are derived from the audit sequence, not listing versions.
domain: House and Listing
owner: bruna.prates@quintoandar.com.br
columns:
  id_prediction_change:
    description: Identifier of the specific prediction change event. Foreign key to the prediction model output.
    lineage:
      - datalake_ebdb_pricing.listing_prediction_changes.id_prediction_change
  id_house:
    lineage:
      - datalake_ebdb_clean.house_predicted_price_aud.id_house
    description: Foreign key referring to the house ID.
  id_revision:
    lineage:
      - datalake_ebdb_clean.house_predicted_price_aud.rev
    description: Foreign key referring to the revision entity of the prediction change.
  business_context:
    lineage:
      - datalake_ebdb_clean.house_predicted_price_aud.business_context
    description: Business context in which the price change occurred.
    categories:
      RENT: For rent.
      SALE: For sale.
  calculator_min_price:
    lineage:
      - datalake_ebdb_clean.house_predicted_price_aud.p_10
    description: Calculator column. Tells the minimum price estimated by the calculator output. May also be referred to as 'p_10'.
  calculator_p20_price:
    lineage:
      - datalake_ebdb_clean.house_predicted_price_aud.p_20
    description: Calculator column. Tells the estimated price related to the 20% percentile of the calculator's output. May also be referred to as just 'p_20'.
  calculator_p30_price:
    lineage:
      - datalake_ebdb_clean.house_predicted_price_aud.p_30
    description: Calculator column. Tells the estimated price related to the 30% percentile of the calculator's output. May also be referred to as just 'p_30'.
  calculator_p40_price:
    lineage:
      - datalake_ebdb_clean.house_predicted_price_aud.p_40
    description: Calculator column. Tells the estimated price related to the 40% percentile of the calculator's output. May also be referred to as just 'p_40'.
  calculator_price:
    lineage:
      - datalake_ebdb_clean.house_predicted_price_aud.p_50
    description: Column for calculator. Tells the most likely estimated price for the listing. Can also be referred to as just 'p_50'.
  calculator_p60_price:
    lineage:
      - datalake_ebdb_clean.house_predicted_price_aud.p_60
    description: Calculator column. Tells the estimated price related to the 60% percentile of the calculator's output. May also be referred to as just 'p_60'.
  calculator_p70_price:
    lineage:
      - datalake_ebdb_clean.house_predicted_price_aud.p_70
    description: Calculator column. Tells the estimated price related to the 70% percentile of the calculator's output. May also be referred to as just 'p_70'.
  calculator_p80_price:
    lineage:
      - datalake_ebdb_clean.house_predicted_price_aud.p_80
    description: Calculator column. Tells the estimated price related to the 80% percentile of the calculator's output. May also be referred to as just 'p_80'.
  calculator_max_price:
    lineage:
      - datalake_ebdb_clean.house_predicted_price_aud.p_90
    description: Calculator column. Tells the maximum price estimated by the calculator output. May also be referred to as 'p_90'.
  calculator_certainty:
    lineage:
      - datalake_ebdb_clean.house_predicted_price_aud.certainty
    description: Calculator column. Tells the certainty level of the prediction calculated by the calculator. It is strongly related to the intensity of the QuintoAndar performance with the listing region.
    categories:
      HIGH: If the prediction has a low confidence interval, having a high certainty in the prediction.
      MEDIUM: If the prediction has a medium confidence interval, having a medium certainty in the prediction.
      LOW: If the prediction has a high confidence interval, having a low certainty in the prediction.
      NONE: If the prediction has no certainty at all.
  is_last_prediction:
    description: Boolean indicating whether this is the most recent prediction for the house within the business context (RENT or SALE).
  is_last_prediction_of_day:
    description: Boolean indicating whether this is the most recent prediction of the day for the house within the business context (RENT or SALE).
  ts_calculator_result_started:
    lineage:
      - datalake_ebdb_user.user_revision_entity.ts_revision
    description: Timestamp of the beginning of the calculator price result observed in that row.
  ts_calculator_result_ended:
    lineage:
      - datalake_ebdb_user.user_revision_entity.ts_revision
    description: Timestamp of the end of the calculator price result observed in that row, if any.
