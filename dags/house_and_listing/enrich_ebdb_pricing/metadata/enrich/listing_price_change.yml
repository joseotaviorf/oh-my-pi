---
database_name: datalake_ebdb_pricing
table_name: listing_price_change
description: Enrich table of rental and sale price changes derived from house audit history per business context (RENT or SALE). Each row is a distinct rent or sale_price revision for the house; metrics and validity windows are computed from the audit sequence, not from listing version lifecycles.
domain: House and Listing
owner: bruna.prates@quintoandar.com.br
columns:
  id_price_change:
    lineage:
      - datalake_ebdb_clean.house_aud.id_house
      - datalake_ebdb_clean.house_aud.rev
      - datalake_ebdb_clean.listing_business_context.business_context
      - datalake_ebdb_user.user_revision_entity.ts_revision
    description: Surrogate key for the price change record, derived as a deterministic hash of (id_house, id_revision, business_context, ts_price_started).
  id_house:
    lineage:
      - datalake_ebdb_clean.house_aud.id_house
    description: Foreign key referring to the house ID.
  id_user_revision:
    lineage:
      - datalake_ebdb_user.user_revision_entity.id_user
    description: Foreign key referring to the author who made the price change.
  id_revision:
    lineage:
      - datalake_ebdb_clean.house_aud.rev
    description: Foreign key refering to the revision entity of the price change.
  business_context:
    description: Business context in which the price change occurred.
    categories:
      RENT: For rent.
      SALE: For sale.
  change_reason:
    description: Reason that triggered the price change event.
  price:
    lineage:
      - datalake_ebdb_clean.house_aud.sale_price
      - datalake_ebdb_clean.house_aud.rent
    description: Rental or sale price recorded in house audit for the row validity period.
  previous_price:
    lineage:
      - datalake_ebdb_clean.house_aud.sale_price
      - datalake_ebdb_clean.house_aud.rent
    description: Price previous to the price of the referenced row.
  last_price_variation:
    description: Percent difference between the price in the row and the previous audit price change for the house within the same business context (RENT or SALE).
  first_price_variation:
    description: Percent difference between the price in the row and the first audit price change ever recorded for the house within the same business context (RENT or SALE).
  change_type:
    description: Describes the type of price change relative to the previous audit price.
    categories:
      FIRST_PRICE: First audit price change for the house in the business context.
      PRICE_INCREASE: Price went up relative to the previous audit price change.
      PRICE_DECREASE: Price went down relative to the previous audit price change.
  change_number:
    description: Sequential number of the audit price change for the house within a given business context (RENT or SALE).
  days_with_pricing_scheme:
    description: Count of days the house remained at that audit price within a business context (RENT or SALE). If it is the most recent change, counts up to D-1.
  is_first_price:
    description: Boolean indicating whether the row is the first audit price change for the house within the business context (RENT or SALE).
  is_last_price:
    description: Boolean indicating whether the row is the most recent audit price change for the house within the business context (RENT or SALE).
  is_last_price_of_day:
    description: Boolean indicating whether the row is the house most recent audit price change of the day within the business context (RENT or SALE).
  ts_price_started:
    lineage:
      - datalake_ebdb_user.user_revision_entity.ts_revision
    description: Timestamp of the beginning of the price scheme observed in that row.
  ts_price_ended:
    lineage:
      - datalake_ebdb_user.user_revision_entity.ts_revision
    description: Timestamp of the end of the price scheme observed in that row, if any.
