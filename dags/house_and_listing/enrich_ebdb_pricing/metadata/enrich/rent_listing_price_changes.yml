---
database_name: datalake_ebdb_pricing
table_name: rent_listing_price_changes
description: Enrich table that handles the rental price change information and enriches it with some comparison columns and pricing scheme information, as well as calculator and status information. 
  Where, each row represents a valid price exchange for the listing. By valid, we mean that we only keep the information from the last price change of the day when there was a price change 
  (if the rental price of this change is different from the first price of the day. If not, it will not count as a price change).
domain: House and Listing
owner: bruna.prates@quintoandar.com.br
columns:
  id_house: 
    lineage:
      - datalake_ebdb_clean.house_aud.id_house
    description: >
      Foreign key referring to the house ID. 
  id_house_listing:
    lineage:
      - datalake_ebdb_listing.house_listing_status.id_house_listing
    description: >
      Foreign key of the listing. The last 3 numbers indicate the version of the listing.
  id_user_revision: 
    lineage:
      - datalake_ebdb_clean.user_revision_entity.id_user
    description: >
      Foreign key referring to the author who made the price change.
  id_owner: 
    lineage:
      - datalake_ebdb_clean.house_aud.id_user
    description: > 
      Foreign key referring to the owner user ID. 
  id_region: 
    lineage:
      - datalake_ebdb_clean.house_aud.id_region
    description: >
      Foreign key of region where listing is located in.
  id_revision:
    lineage:
      - datalake_ebdb_clean.user_revision_entity.rev
    description: >
      Foreign key reffering to the revision entity of the price change.
  status_history:
    description: >
      Rent status linked to a certain point in time of the listing.
  price: 
    lineage:
      - datalake_ebdb_clean.house_aud.rent
    description: >
      Published rental price for a listing in a given time period.
  previous_price:
    description: >
      Price previous to the price of the referenced row.
  last_price_variation:
    description: >
      Percent difference between the published price for the row and the previous published price.
  first_price_variation:
    description: > 
      Percent difference between the published price for the row and the first published price.
  change_type:
    description: >
      Describes the type of price change. We can have the price being increased or decreased.
    categories:
      First price: >
        If there is no previous price.
      Price decrease: >
        If the rental price is lower than the previous price.
      Price increase: >
        If the rental price is higher than the previous price.
  change_number: 
    description: > 
      Tells the number of listing price changes.
  days_with_pricing_scheme:
    description: >
      Count how many days the listing stayed at that publication price. If it is the most recent price, it counts up to D-1.
  calculator_min_rent_price: 
    lineage:
      - datalake_ebdb_clean.house_predicted_price_aud.p_10
    description: > 
      Calculator column. Tells the minimum price estimated by the calculator output. May also be referred to as 'p_10'.
  calculator_p30_rent_price:
    lineage:
      - datalake_ebdb_clean.house_predicted_price_aud.p_30
    description: > 
      Calculator column. Tells the estimated price related to the 30% percentile of the calculator's output. May also be referred to as just 'p_30'.
  calculator_rent_price: 
    lineage:
      - datalake_ebdb_clean.house_predicted_price_aud.p_50
    description: >
      Column for calculator. Tells the most likely estimated price for the listing. Can also be referred to as just 'p_50'.
  calculator_p70_rent_price:
    lineage:
      - datalake_ebdb_clean.house_predicted_price_aud.p_70
    description: > 
      Calculator column. Tells the estimated price related to the 70% percentile of the calculator's output. May also be referred to as just 'p_70'.
  calculator_max_rent_price: 
    lineage:
      - datalake_ebdb_clean.house_predicted_price_aud.p_90
    description: >
      Calculator column. Tells the maximum price estimated by the calculator output. May also be referred to as 'p_90'.
  calculator_certainty: 
    lineage:
      - datalake_ebdb_clean.house_predicted_price_aud.certainty
    description: > 
      Calculator column. Tells the certainty level of the prediction calculated by the calculator. It is strongly related to the intensity of the QuintoAndar performance with the listing region.
    categories:
      HIGH: >
        If the prediction has a low confidence interval, having a high certainty in the prediction.
      MEDIUM: >
        If the prediction has a medium confidence interval, having a medium certainty in the prediction.
      LOW: > 
        If the prediction has a high confidence interval, having a low certainty in the prediction.
      NONE: >
        If the prediction has no certainty at all.
  is_first_price:
    description: >
      Boolean that tells if the price is the first publication price of the listing.
  is_last_price:
    description: >
      Boolean that tells if the price is the most recent publication price of the listing.
  ts_price_started:
    lineage: 
      - datalake_ebdb_clean.user_revision_entity.ts_revision
    description: > 
      Timestamp of the beginning of the price scheme observed in that row.
  ts_price_ended:
    lineage: 
      - datalake_ebdb_clean.user_revision_entity.ts_revision
    description: >
      Timestamp of the end of the price scheme observed in that row, if any. 
