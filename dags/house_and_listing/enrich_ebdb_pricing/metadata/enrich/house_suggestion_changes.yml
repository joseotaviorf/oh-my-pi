database_name: datalake_ebdb_pricing
table_name: house_suggestion_changes
description: >
  Enrich table that tracks all price suggestion changes from house_price_suggestion_historical.
  Each row represents a suggestion change for a given house and business context, enriched with
  change ordering and temporal fields to identify when each suggestion was active.
domain: House and Listing
owner: bruna.prates@quintoandar.com.br
columns:
  id_suggestion_change:
    lineage:
      - datalake_ebdb_clean.house_price_suggestion_historical.id
      - datalake_ebdb_clean.house_price_suggestion_historical.id_cdc_transaction
    description: >
      Primary key of THIS table (house_suggestion_changes). It's unique and deterministic, generated via xxhash64(id_house_suggestion, id_cdc_transaction).
  id_house_suggestion:
    lineage:
      - datalake_ebdb_clean.house_price_suggestion_historical.id
    description: >
      Primary key from the SOURCE table (house_price_suggestion_historical). Identifies a suggestion configuration for a specific (id_house, business_context) pair.
      NOT unique in this table because each CDC change creates a new row.
  id_prediction:
    lineage:
      - datalake_ebdb_clean.house_price_suggestion_historical.id_prediction
    description: UUID of the prediction that generated this suggestion.
  id_house:
    lineage:
      - datalake_ebdb_clean.house_price_suggestion_historical.id_house
    description: Foreign key referring to the house ID.
  business_context:
    lineage:
      - datalake_ebdb_clean.house_price_suggestion_historical.business_context
    description: Business context for which the price was suggested.
    categories:
      RENT: Rental property context.
      SALE: Sale property context.
  rule:
    lineage:
      - datalake_ebdb_clean.house_price_suggestion_historical.rule
    description: Business rule or heuristic applied to the suggestion (if any).
  suggestion_certainty:
    lineage:
      - datalake_ebdb_clean.house_price_suggestion_historical.suggestion_certainty
    description: Level of certainty or confidence associated with the suggestion.
    categories:
      high: High confidence in the CPS suggestion.
      medium: Medium confidence.
      low: Low confidence; analysts may exclude at their discretion — official metrics do not filter this level.
      none: No confidence; analysts may exclude at their discretion — official metrics do not filter this level.
  deal_objective_lower_anchor:
    lineage:
      - datalake_ebdb_clean.house_price_suggestion_historical.deal_objective_lower_anchor
    description: Lower anchor used for the deal objective.
  deal_objective_upper_anchor:
    lineage:
      - datalake_ebdb_clean.house_price_suggestion_historical.deal_objective_upper_anchor
    description: Upper anchor used for the deal objective.
  lower_bound_limit:
    lineage:
      - datalake_ebdb_clean.house_price_suggestion_historical.lower_bound_limit
    description: The lowest allowed price (floor) for the context.
  upper_bound_limit:
    lineage:
      - datalake_ebdb_clean.house_price_suggestion_historical.upper_bound_limit
    description: The highest allowed price (ceiling) for the context.
  suggested_lower_bound_price:
    lineage:
      - datalake_ebdb_clean.house_price_suggestion_historical.suggested_lower_bound_price
    description: The minimum value of the price range suggested by the pricing model.
  suggested_price:
    lineage:
      - datalake_ebdb_clean.house_price_suggestion_historical.suggested_price
    description: The exact anchor value suggested by the pricing model.
  suggested_upper_bound_price:
    lineage:
      - datalake_ebdb_clean.house_price_suggestion_historical.suggested_upper_bound_price
    description: The maximum value of the price range suggested by the pricing model.
  change_number:
    description: Order of the suggestion change for each id_house within the same business_context. Starts at 1 for the first suggestion.
  is_last_suggestion:
    description: Boolean that tells if this is the most recent suggestion for the id_house within the same business_context.
  is_last_suggestion_of_day:
    description: Boolean that tells if this is the most recent suggestion for the id_house within the same business_context for that day.
  ts_suggestion_started:
    lineage:
      - datalake_ebdb_clean.house_price_suggestion_historical.ts_updated
    description: Timestamp when the suggestion became active.
  ts_suggestion_ended:
    lineage:
      - datalake_ebdb_clean.house_price_suggestion_historical.ts_updated
    description: Timestamp when the suggestion was replaced by a new one. NULL if it is the current active suggestion.
