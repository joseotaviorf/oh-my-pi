dag:
  name: enrich_ebdb_pricing
  owner: Data ForSale
  schedule_start_date: 2020, 8, 29
  documentation:
    dag_purpose: |
      The purpose of this DAG is to allocate the tables related to house rental prices on the platform.
workflow:
  type: query_delta
  layer: enrich
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  spark_job_arguments:
    - "{environment}"
    - "{bucket}"
    - "{schema}"
    - "{dag_name}"
    - "{table_name}"
    - "{load_start_date}"
    - "{load_end_date}"
    - "prod"
  tables_customization:
    listing_price_change:
      load_spark_job: load_listing_price_change
    listing_prediction_changes:
      merge_on: [ 'id_house', 'id_revision', 'business_context', 'ts_calculator_result_started' ]
    house_suggestion_changes:
      load_spark_job: load_house_suggestion_changes
      merge_on: [ 'id_suggestion_change' ]
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: r5d.2xlarge
    node_type_id: r5d.2xlarge
    num_workers: 3
    spark_version: 13.3.x-scala2.12
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
  databricks_conn_id: databricks_new_env
