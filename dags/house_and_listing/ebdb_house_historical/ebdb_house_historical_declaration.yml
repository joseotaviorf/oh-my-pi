dag:
  name: ebdb_house_historical
  owner: Data House and Listing
  documentation:
    dag_purpose: |
      Creates historical tracking tables for House domain from CDC transactional layer.
workflow:
  type: query_delta
  layer: clean
  custom_schema: ebdb
  default_extraction_type: incremental
  default_partitions: ["year", "month", "day"]
cluster:
  type: databricks_16_4_med_general_cluster
  databricks_conn_id: databricks_new
