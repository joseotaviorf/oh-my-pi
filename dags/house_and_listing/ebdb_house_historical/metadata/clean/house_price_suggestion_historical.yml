database_name: datalake_ebdb_clean
table_name: house_price_suggestion_historical
owner: bruna.prates@quintoandar.com.br
domain: House and Listing
description:
  Tracks changes in price suggestion fields from HousePriceSuggestion table.
  Each row represents a change, identified by composite key (id, id_cdc_transaction).
  Partitioned by year, month, day. Always filter on year, month, day in WHERE clauses
  to enable partition pruning and avoid full table scans.
columns:
  id:
    lineage:
      - datalake_ebdb_transactional.HousePriceSuggestion.id
    description: 'Primary key of HousePriceSuggestion source table. NOT unique here — one row per change.
      Part of composite key: (id, id_cdc_transaction).'
  id_house:
    lineage:
      - datalake_ebdb_transactional.HousePriceSuggestion.house_id
    description: 'ID of the property. A house may have two records in HousePriceSuggestion source table: one for RENT and one for SALE.'
  id_prediction:
    lineage:
      - datalake_ebdb_transactional.HousePriceSuggestion.prediction_id
    description: 'UUID of the prediction that generated this suggestion. Changes with each update, so the same id may have
      different id_prediction values over time.'
  id_cdc_transaction:
    lineage:
      - datalake_ebdb_transactional.HousePriceSuggestion.cdc_transaction_id
    description: 'Unique identifier of the CDC transaction and required to distinguish multiple changes captured at the
      same ts_cdc_transaction. Part of the composite key: (id, id_cdc_transaction).'
  deal_objective_lower_anchor:
    lineage:
      - datalake_ebdb_transactional.HousePriceSuggestion.deal_objective_lower_anchor
    description: 'Lower anchor used for the deal objective.'
  deal_objective_upper_anchor:
    lineage:
      - datalake_ebdb_transactional.HousePriceSuggestion.deal_objective_upper_anchor
    description: 'Upper anchor used for the deal objective.'
  lower_bound_limit:
    lineage:
      - datalake_ebdb_transactional.HousePriceSuggestion.lower_bound_limit
    description: 'The lowest allowed price (floor) for the context.'
  rule:
    lineage:
      - datalake_ebdb_transactional.HousePriceSuggestion.rule
    description: 'Business rule or heuristic applied to the suggestion (if any).'
  suggested_lower_bound_price:
    lineage:
      - datalake_ebdb_transactional.HousePriceSuggestion.suggested_lower_bound_price
    description: 'The minimum value of the price range suggested by the pricing model.'
  suggested_price:
    lineage:
      - datalake_ebdb_transactional.HousePriceSuggestion.suggested_price
    description: 'The exact anchor value suggested by the pricing model.'
  suggested_upper_bound_price:
    lineage:
      - datalake_ebdb_transactional.HousePriceSuggestion.suggested_upper_bound_price
    description: 'The maximum value of the price range suggested by the pricing model.'
  suggestion_certainty:
    lineage:
      - datalake_ebdb_transactional.HousePriceSuggestion.suggestion_certainty
    description: 'Level of certainty or confidence associated with the suggestion.'
  upper_bound_limit:
    lineage:
      - datalake_ebdb_transactional.HousePriceSuggestion.upper_bound_limit
    description: 'The highest allowed price (ceiling) for the context.'
  business_context:
    lineage:
      - datalake_ebdb_transactional.HousePriceSuggestion.business_context
    description: 'Business context for which the price was suggested. Each (id_house, business_context) has a distinct
      id in HousePriceSuggestion.'
    categories:
      RENT: Rental property context.
      SALE: Sale property context.
  op_cdc:
    lineage:
      - datalake_ebdb_transactional.HousePriceSuggestion.op_cdc
    description: 'CDC operation type captured by Debezium.'
    categories:
      r: Read/snapshot - initial load of existing records.
      c: Create - new record inserted.
      u: Update - existing record modified.
  ts_created:
    lineage:
      - datalake_ebdb_transactional.HousePriceSuggestion.created_at
    description: 'Timestamp of when the suggestion record was created in the HousePriceSuggestion source table.'
  ts_updated:
    lineage:
      - datalake_ebdb_transactional.HousePriceSuggestion.updated_at
    description: 'Timestamp of the last update to the suggestion record in the HousePriceSuggestion source table.'
  ts_cdc_transaction:
    lineage:
      - datalake_ebdb_transactional.HousePriceSuggestion.ts_cdc_transaction
    description: 'Timestamp when the CDC system captured this transaction. Multiple changes may occur at the same timestamp
      (millisecond precision), requiring id_cdc_transaction to distinguish them.'
  ts_database_transaction:
    lineage:
      - datalake_ebdb_transactional.HousePriceSuggestion.ts_database_transaction
    description: 'Timestamp of the original database transaction.'
  year:
    lineage:
      - datalake_ebdb_transactional.HousePriceSuggestion.year
    description: 'Year of the CDC transaction (partition column). Always filter on this partition column in WHERE clauses
      to enable partition pruning when scanning the table.'
  month:
    lineage:
      - datalake_ebdb_transactional.HousePriceSuggestion.month
    description: 'Month of the CDC transaction (partition column). Always filter on this partition column in WHERE clauses
      to enable partition pruning when scanning the table.'
  day:
    lineage:
      - datalake_ebdb_transactional.HousePriceSuggestion.day
    description: 'Day of the CDC transaction (partition column). Always filter on this partition column in WHERE clauses
      to enable partition pruning when scanning the table.'
