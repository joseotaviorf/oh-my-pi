cluster:
  type: emr_7_12_consolidation_m_memory_fleet_cluster
  custom_configurations:
    # j-1OLAFXUQKRXUA: fact_listings hung on ResultStage 63 task 3 (fat partition) while
    # sharing the fleet with fact_listing_status — only 2 executors registered despite
    # 6 core OD. Serialize Spark steps so each fact gets the full fleet; speculation
    # recovers hung/straggler tasks; tighter scan targets reduce fat splits.
    step_concurrency_level: 1
    core_nodes:
      target_on_demand: 8
      target_spot: 0
      instance_types:
      - r6g.2xlarge
      - r7g.2xlarge
      - r6i.2xlarge
    spark_conf:
      # 8× r6g.2xlarge ≈ 16× (24g/4core) m_memory executors when one step runs alone.
      spark.dynamicAllocation.maxExecutors: "16"
      spark.speculation: "true"
      spark.speculation.multiplier: "3"
      spark.speculation.quantile: "0.75"
      spark.sql.files.maxPartitionBytes: "16777216"
      spark.sql.adaptive.advisoryPartitionSizeInBytes: "33554432"
      spark.sql.shuffle.partitions: "400"
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE
