database_name: dw_sale
table_name: fact_listing_status
description: This table keeps track of every status change of For Sale listings.
  Therefore, a listing can have multiple rows in this table, one for each status change, with its start and end date (if any).
  An example would be the first row of a listing where the first status is editing (pre-publication) and the second is published (post-publication).
domain: House and Listing
owner: bruna.prates@quintoandar.com.br
columns:
  sk_sale_listing:
    lineage:
    - datalake_sale_listings.sale_listing_status.id_sale_listing
    description: Identification of the listing version, which may be in edition (version
      0) or already published (version 1).
  sk_user_revision:
    lineage:
      - datalake_sale_listings.sale_listing_status.id_user_revision
    description: Identification of the user who made the listing status change for that row. Can be joined with dw_public.dim_user.
  sk_region:
    lineage:
    - datalake_sale_listings.sale_listing_status.id_region
    description: Foreign key of region where house listing is located in. Can be joined with dw_public.dim_region.
  sk_broker:
    lineage:
      - core_brokers.brokers.sk_broker
    description: Surrogate key of the 3P broker partner for the resolved company; '-1' when the
      company is not in core_brokers.brokers.
  sk_first_publication_date:
    lineage:
    - datalake_sale_listings.sale_listing_status.ts_first_publication
    description: Foreign key referring to the date of the first publication in the Sale context of this listing. Can be joined with dw_public.dim_date to retrieve in date format.
  sk_status_start_date:
    lineage:
    - datalake_sale_listings.sale_listing_status.ts_status_started
    description: Foreign key referring to the status start date in the Sale context of this listing. Can be joined with dw_public.dim_date to retrieve in date format.
  sk_status_end_date:
    lineage:
    - datalake_sale_listings.sale_listing_status.ts_status_ended
    description: Foreign key referring to the status ended date in the Sale context of this listing. Can be joined with dw_public.dim_date to retrieve in date format.
  status_history:
    lineage:
    - datalake_sale_listings.sale_listing_status.status_history
    description: Sale status linked to a certain point in time of the listing.
    categories:
      EDITING: If the listing is being edited.
      OPTED_OUT: Permanent logical exclusion from this business context. Not UNPUBLISHED or SUSPENDED. Use status_reason.
      PUBLISHED: If the listing is published.
      SUSPENDED: If the listing is suspended.
      UNPUBLISHED: If the listing is unpublished.
  status_closing_history:
    lineage:
      - datalake_sale_listings.sale_listing_status.status_closing_history
    description: Sale closing status linked to a certain point in time of the listing.
    categories:
      CCV_CANCELED: If the listing is in the process of sales cancellation during the change
      CCV_SIGNED: If the listing is in the process of being sold during the change
      SALE_COMPLETED: If the listing is already sold during the change
  status_change_reason:
    lineage:
    - datalake_sale_listings.sale_listing_status.status_change_reason
    description: Descriptive column that shows the code of the cause of the line status change.
  status_change_reason_detail:
    lineage:
    - datalake_sale_listings.sale_listing_status.status_change_reason_detail
    description: Descriptive column that shows the cause of the status change for the row.
  deactivation_reason:
    lineage:
      - datalake_sale_listings.sale_listing_status.deactivation_reason
    description: Structured deactivation reason from the new status log taxonomy. NULL before log availability or when no match exists.
  deactivation_reason_category:
    lineage:
      - datalake_sale_listings.sale_listing_status.deactivation_reason_category
    description: Macro category of the deactivation reason from the new status log taxonomy.
  deactivation_additional_context:
    lineage:
      - datalake_sale_listings.sale_listing_status.deactivation_additional_context
    description: Optional free-text context from the owner during deactivation in the new status log.
  is_last_status:
    lineage:
    - datalake_sale_listings.sale_listing_status.is_last_status
    description: Boolean column indicating the current listing status. If True, it
      means that the listing is in the last status.
  ts_status_started:
    lineage:
    - datalake_sale_listings.sale_listing_status.ts_status_started
    description: Timestamp on which the start of the row-related status occurred.
  ts_status_ended:
    lineage:
    - datalake_sale_listings.sale_listing_status.ts_status_ended
    description: Timestamp that the status change to the next status occurred.
  ts_load:
    description: Timestamp when the data was processed.
