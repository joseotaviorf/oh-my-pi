dag:
  name: ebdb_listing
  schedule_start_date: 2021, 2, 20
  schedule_interval: 45 21,8,12 * * *
  owner: Data ForSale
  documentation:
    dag_purpose: Extraction of EBDB tables related to Listing into data lake. EBDB is the main database for QuintoAndar.
workflow:
  type: cdc
  layer: raw
  custom_schema: ebdb
  database_type: mysql
  source_database: ebdb
  source_schema: ebdb
  tables_customization:
    DynamicPricingHouse:
      clean_table_name: dynamic_pricing_house
    DynamicPricingHouse_AUD:
      clean_table_name: dynamic_pricing_house_aud
    DynamicPricingParameters:
      clean_table_name: dynamic_pricing_parameters
    DynamicPricingParameters_AUD:
      clean_table_name: dynamic_pricing_parameters_aud
    HouseDescription:
      clean_table_name: house_description
    HouseEventLog:
      clean_table_name: house_event_log
    HouseListingStatusLog:
      clean_table_name: house_listing_status_log
    ListingInfo:
      clean_table_name: listing_info
    ListingPerformance:
      clean_table_name: listing_performance
    ListingRentModel:
      clean_table_name: listing_rent_model
    ListingRentModel_AUD:
      clean_table_name: listing_rent_model_aud
    ListingSaleModel:
      clean_table_name: listing_sale_model
    ListingSaleModel_AUD:
      clean_table_name: listing_sale_model_aud
    SuspectedUnavailabilityListing:
      clean_table_name: suspected_unavailability_listings
    SuspectedUnavailabilityListing_AUD:
      clean_table_name: suspected_unavailability_listings_aud
  extra_query_template_params:
    load_end_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, 1), 'load_end_date') }}"
cluster:
  type: databricks_13_3_med_memory_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
