database_name: datalake_ebdb_clean
table_name: dynamic_pricing_parameters_aud
owner: bruna.prates@quintoandar.com.br
domain: House and Listing
description: Audit table for DynamicPricingParameters. One row per change event (PK id + rev).
  Tracks all historical changes to dynamic pricing parameter sets. Sourced from dynamicpricingparameters_aud in EBDB.
columns:
  id:
    lineage:
      - datalake_ebdb_raw.dynamicpricingparameters_aud.id
    description: Primary key identifier for the dynamic pricing parameters record.
  rev:
    lineage:
      - datalake_ebdb_raw.dynamicpricingparameters_aud.rev
    description: Revision number from the audit entity.
  rev_type:
    lineage:
      - datalake_ebdb_raw.dynamicpricingparameters_aud.revtype
    description: Type of revision (insert, update, delete).
  parameters_name:
    lineage:
      - datalake_ebdb_raw.dynamicpricingparameters_aud.name
    description: Name of the dynamic pricing parameters set.
  parameters_description:
    lineage:
      - datalake_ebdb_raw.dynamicpricingparameters_aud.description
    description: Description of the dynamic pricing parameters set.
  days_threshold:
    lineage:
      - datalake_ebdb_raw.dynamicpricingparameters_aud.daysthreshold
    description: Number of days threshold for price reduction trigger.
  days_from_automatic_activation:
    lineage:
      - datalake_ebdb_raw.dynamicpricingparameters_aud.daysFromAutomaticActivation
    description: Number of days elapsed since dynamic pricing was automatically activated for this parameter set.
  offers_threshold:
    lineage:
      - datalake_ebdb_raw.dynamicpricingparameters_aud.offersthreshold
    description: Number of offers threshold for price reduction trigger.
  visits_days_threshold:
    lineage:
      - datalake_ebdb_raw.dynamicpricingparameters_aud.visitsdaysthreshold
    description: Number of days threshold for visits evaluation.
  visits_threshold:
    lineage:
      - datalake_ebdb_raw.dynamicpricingparameters_aud.visitsthreshold
    description: Number of visits threshold for price reduction trigger.
  drops:
    lineage:
      - datalake_ebdb_raw.dynamicpricingparameters_aud.dropscount
    description: Number of price drops allowed in the dynamic pricing.
  initial_rent_percentile:
    lineage:
      - datalake_ebdb_raw.dynamicpricingparameters_aud.initialrentpercentile
    description: Percentile used to calculate the initial rent price.
  min_rent_percentile:
    lineage:
      - datalake_ebdb_raw.dynamicpricingparameters_aud.minrentpercentile
    description: Percentile used to calculate the minimum rent price.
  initial_rent_ratio:
    lineage:
      - datalake_ebdb_raw.dynamicpricingparameters_aud.initialrentratio
    description: Ratio used to calculate the initial rent price.
  min_rent_ratio:
    lineage:
      - datalake_ebdb_raw.dynamicpricingparameters_aud.minrentratio
    description: Ratio used to calculate the minimum rent price.
  max_value_per_reduction:
    lineage:
      - datalake_ebdb_raw.dynamicpricingparameters_aud.maximumValuePerReduction
    description: Maximum value allowed per price reduction.
  days_from_automatic_activation_mod:
    lineage:
      - datalake_ebdb_raw.dynamicpricingparameters_aud.daysFromAutomaticActivation_MOD
    description: Flag indicating if days from automatic activation was modified.
  max_value_per_reduction_mod:
    lineage:
      - datalake_ebdb_raw.dynamicpricingparameters_aud.maximumValuePerReduction_MOD
    description: Flag indicating if max value per reduction was modified.
  ts_started:
    lineage:
      - datalake_ebdb_raw.dynamicpricingparameters_aud.begindate
    description: Timestamp when these parameters became active.
  ts_ended:
    lineage:
      - datalake_ebdb_raw.dynamicpricingparameters_aud.enddate
    description: Timestamp when these parameters were deactivated.
  ts_created:
    lineage:
      - datalake_ebdb_raw.dynamicpricingparameters_aud.criadoem
    description: Timestamp when this record was created.
  ts_updated:
    lineage:
      - datalake_ebdb_raw.dynamicpricingparameters_aud.atualizadoem
    description: Timestamp of the last update to this record.
  op_cdc:
    lineage:
      - datalake_ebdb_raw.dynamicpricingparameters_aud.op_cdc
    description: CDC operation type captured by Debezium.
    categories:
      r: Read/snapshot - initial load of existing records.
      c: Create - new record inserted.
      u: Update - existing record modified.
      d: Delete - record removed.
  ts_cdc_transaction:
    lineage:
      - datalake_ebdb_raw.dynamicpricingparameters_aud.ts_cdc_transaction
    description: Timestamp when the CDC system captured this transaction (millisecond precision).
  ts_database_transaction:
    lineage:
      - datalake_ebdb_raw.dynamicpricingparameters_aud.ts_database_transaction
    description: Timestamp of the original database transaction in the source system.
