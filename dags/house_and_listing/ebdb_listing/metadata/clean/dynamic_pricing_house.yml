database_name: datalake_ebdb_clean
table_name: dynamic_pricing_house
owner: bruna.prates@quintoandar.com.br
domain: House and Listing
description: CDC mirror of the DynamicPricingHouse EBDB table. One row per dynamic pricing configuration record (PK id).
  Tracks the dynamic pricing setup for each rental property, including status, operation mode, price boundaries and activation dates.
columns:
  id:
    lineage:
      - datalake_ebdb_raw.dynamicpricinghouse.id
    description: Primary key identifier for the dynamic pricing house record.
  id_house:
    lineage:
      - datalake_ebdb_raw.dynamicpricinghouse.houseid
    description: Foreign key identifier referencing the house entity.
  id_listing_business_context:
    lineage:
      - datalake_ebdb_raw.dynamicpricinghouse.listingBusinessContextId
    description: Foreign key identifier referencing the listing business context.
  id_dynamic_pricing_parameter:
    lineage:
      - datalake_ebdb_raw.dynamicpricinghouse.dynamicpricingparameterid
    description: Foreign key identifier referencing the dynamic pricing parameters.
  status:
    lineage:
      - datalake_ebdb_raw.dynamicpricinghouse.status
    description: Current status of the dynamic pricing for this house.
  operation_mode:
    lineage:
      - datalake_ebdb_raw.dynamicpricinghouse.operationmode
    description: Operation mode of the dynamic pricing (automatic or manual).
  origin:
    lineage:
      - datalake_ebdb_raw.dynamicpricinghouse.origin
    description: Origin of the dynamic pricing activation.
  min_rent:
    lineage:
      - datalake_ebdb_raw.dynamicpricinghouse.minrent
    description: Minimum rental price allowed for this property.
  initial_rent:
    lineage:
      - datalake_ebdb_raw.dynamicpricinghouse.initialrent
    description: Initial rental price when dynamic pricing was activated.
  occurred_price_changes:
    lineage:
      - datalake_ebdb_raw.dynamicpricinghouse.pricechangesoccurred
    description: Number of price changes that occurred for this property.
  pre_publication_rent_probability:
    lineage:
      - datalake_ebdb_raw.dynamicpricinghouse.prepublicationrentprobability
    description: Probability of rental before publication based on pricing.
  is_enabled:
    lineage:
      - datalake_ebdb_raw.dynamicpricinghouse.enabled
    description: Boolean flag indicating if dynamic pricing is enabled.
  dt_last_price_updated:
    lineage:
      - datalake_ebdb_raw.dynamicpricinghouse.lastpriceupdate
    description: Date of the last price update for this property.
  dt_activated:
    lineage:
      - datalake_ebdb_raw.dynamicpricinghouse.activatedAt
    description: Date when dynamic pricing was activated for this property.
  dt_deactivated:
    lineage:
      - datalake_ebdb_raw.dynamicpricinghouse.deactivatedAt
    description: Date when dynamic pricing was deactivated for this property.
  ts_updated:
    lineage:
      - datalake_ebdb_raw.dynamicpricinghouse.atualizadoem
    description: Timestamp of the last update to this record.
  ts_created:
    lineage:
      - datalake_ebdb_raw.dynamicpricinghouse.criadoem
    description: Timestamp when this record was created.
  op_cdc:
    lineage:
      - datalake_ebdb_raw.dynamicpricinghouse.op_cdc
    description: CDC operation type captured by Debezium.
    categories:
      r: Read/snapshot - initial load of existing records.
      c: Create - new record inserted.
      u: Update - existing record modified.
      d: Delete - record removed.
  ts_cdc_transaction:
    lineage:
      - datalake_ebdb_raw.dynamicpricinghouse.ts_cdc_transaction
    description: Timestamp when the CDC system captured this transaction (millisecond precision).
  ts_database_transaction:
    lineage:
      - datalake_ebdb_raw.dynamicpricinghouse.ts_database_transaction
    description: Timestamp of the original database transaction in the source system.
