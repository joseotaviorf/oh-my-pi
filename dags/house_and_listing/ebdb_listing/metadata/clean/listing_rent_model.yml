      - datalake_ebdb_raw.listingrentmodel.listingBusinessContext_id
    description: Foreign key identifier referencing the listing business context.
  rental_administrator:
    lineage:
      - datalake_ebdb_raw.listingrentmodel.rentalAdministrator
    description: Entity responsible for administering the rental.
  is_early_relisting:
    lineage:
      - datalake_ebdb_raw.listingrentmodel.isEarlyRelisting
    description: Boolean flag indicating if this is an early relisting.
  ts_created:
    lineage:
      - datalake_ebdb_raw.listingrentmodel.created_at
    description: Timestamp when this record was created.
  ts_updated:
    lineage:
      - datalake_ebdb_raw.listingrentmodel.updated_at
    description: Timestamp of the last update to this record.
  op_cdc:
    lineage:
      - datalake_ebdb_raw.listingrentmodel.op_cdc
    description: CDC operation type captured by Debezium.
    categories:
      r: Read/snapshot - initial load of existing records.
      c: Create - new record inserted.
      u: Update - existing record modified.
      d: Delete - record removed.
  ts_cdc_transaction:
    lineage:
      - datalake_ebdb_raw.listingrentmodel.ts_cdc_transaction
    description: Timestamp when the CDC system captured this transaction (millisecond precision).
  ts_database_transaction:
