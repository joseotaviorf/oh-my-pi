---
database_name: datalake_ebdb_clean
table_name: listing_sale_model_aud
owner: bruna.prates@quintoandar.com.br
domain: House and Listing
description: Audit table for ListingSaleModel. One row per change event (PK id + rev).
  Tracks all historical changes to sale model records. Sourced from listingsalemodel_aud in EBDB.
columns:
  id:
    lineage:
      - datalake_ebdb_raw.listingsalemodel_aud.id
    description: Primary key identifier for the listing sale model record.
  id_listing_business_context:
    lineage:
      - datalake_ebdb_raw.listingsalemodel_aud.listingBusinessContext_id
    description: Foreign key identifier referencing the listing business context.
  is_primary_market:
    lineage:
      - datalake_ebdb_raw.listingsalemodel_aud.isPrimaryMarket
    description: Boolean flag indicating if this is a primary market listing.
  rev:
    lineage:
      - datalake_ebdb_raw.listingsalemodel_aud.rev
    description: Revision number from the audit entity.
  rev_type:
    lineage:
      - datalake_ebdb_raw.listingsalemodel_aud.revtype
    description: Type of revision (insert, update, delete).
  mod_is_primary_market:
    lineage:
      - datalake_ebdb_raw.listingsalemodel_aud.isPrimaryMarket_MOD
    description: Flag indicating if primary market status was modified.
  has_great_sale_price_tag:
    lineage:
      - datalake_ebdb_raw.listingsalemodel_aud.hasGreatSalePriceTag
    description: Boolean flag indicating if the listing has a great sale price tag.
  mod_has_great_sale_price_tag:
    lineage:
      - datalake_ebdb_raw.listingsalemodel_aud.hasGreatSalePriceTag_MOD
    description: Flag indicating if great sale price tag was modified.
  op_cdc:
    lineage:
      - datalake_ebdb_raw.listingsalemodel_aud.op_cdc
    description: CDC operation type captured by Debezium.
    categories:
      r: Read/snapshot - initial load of existing records.
      c: Create - new record inserted.
      u: Update - existing record modified.
      d: Delete - record removed.
  ts_cdc_transaction:
    lineage:
      - datalake_ebdb_raw.listingsalemodel_aud.ts_cdc_transaction
    description: Timestamp when the CDC system captured this transaction (millisecond precision).
  ts_database_transaction:
    lineage:
      - datalake_ebdb_raw.listingsalemodel_aud.ts_database_transaction
    description: Timestamp of the original database transaction in the source system.
