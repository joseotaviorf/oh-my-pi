---
database_name: dw_sale
table_name: fact_daily_ongoing_listing
description: 'Every row of this table is a snapshot of one sale ongoing listing per day. If it had the status="PUBLISHED" at that day, no matter
  for how long, it will appear here, along with some metrics such as search, listing page viewed, visit booked, and other demand data.
  Important:
  if you add up the metrics from this table such as visit booked or visit completed, they might not be equal to the total that actually happened. This
  is because some events happen when the listing is unpublished, so the rows will not appear in this table. To see all ForSale demand events, please use
  the table dw_sale.fact_sale_demand_event. Partitioned by year, month, day. Always filter on year, month, day in WHERE clauses to enable partition
  pruning and avoid full table scans.'
domain: House and Listing
owner: bruna.prates@quintoandar.com.br
columns:
  sk_snapshot:
    description: Primary key of the table, formed by concatenating sk_house to sk_snapshot_date.
    lineage:
      - datalake_ebdb_clean.listing_business_context_aud.id_house
      - dw_public.dim_date.sk_date
  sk_snapshot_date:
    description: Date key of the snapshot. Can be joined with dw_public.dim_date.
    lineage:
      - dw_public.dim_date.sk_date
  sk_sale_listing:
    description: Key of the sale listing. Can be joined with dw_sale.dim_listing.
    lineage:
      - datalake_sale_listings.sale_listing.id_sale_listing
  sk_house:
    description: Key of the house. Can be joined with dw_house.dim_house.
    lineage:
      - datalake_ebdb_clean.listing_business_context_aud.id_house
  sk_region:
    description: Key of the region of the house. Can be joined with dw_public.dim_region.
    lineage:
      - datalake_sale_listings.sale_listing_status.id_region
  sk_broker:
    description: Surrogate key of the 3P broker partner for the supply-side company of the house. Joinable with dw_brokers.dim_broker.
      Returns -1 when the house is not associated with a 3P broker (i.e. 1P listings or companies without active 3P products).
    lineage:
      - core_brokers.brokers.sk_broker
  sk_sale_price_segment:
    description: Key of the sale price segment. Can be joined with dw_sale.dim_sale_price_segment.
    lineage:
      - datalake_sale_listings.sale_listing_price_changes.price_segment
  sk_suggestion_change:
    description: The Id of the suggestion change record from the pricing model.
    lineage:
      - datalake_ebdb_pricing.house_suggestion_changes.id_suggestion_change
  sale_type:
    lineage:
    - datalake_sale_primary_market.listing_sale_type.sale_type
    description: >
      Listing market type for the SALE listing business context of this house, sourced
      from the primary-market SSOT enrich_sale_primary_market.listing_sale_type. Filter
      PRIMARY for Mercado Primário stock. Null when the listing has no sale model.
      Grain is sk_house.
    categories:
      PRIMARY: New-build / primary market listing (empreendimento).
      SECONDARY: Resale / secondary market listing.
  sale_price:
    description: Price of the sale listing at the end of that day.
    lineage:
      - datalake_sale_listings.sale_listing_price_changes.sale_price
  lower_bound_limit:
    description: The lowest allowed price (floor) for the sale pricing suggestion.
    lineage:
      - datalake_ebdb_pricing.house_suggestion_changes.lower_bound_limit
  suggested_lower_bound_price:
    description: The minimum value of the price range suggested by the pricing model.
    lineage:
      - datalake_ebdb_pricing.house_suggestion_changes.suggested_lower_bound_price
  suggested_upper_bound_price:
    description: The maximum value of the price range suggested by the pricing model.
    lineage:
      - datalake_ebdb_pricing.house_suggestion_changes.suggested_upper_bound_price
  upper_bound_limit:
    description: The highest allowed price (ceiling) for the sale pricing suggestion.
    lineage:
      - datalake_ebdb_pricing.house_suggestion_changes.upper_bound_limit
  suggestion_certainty:
    description: Level of certainty or confidence associated with the pricing suggestion from the pricing model.
    lineage:
      - datalake_ebdb_pricing.house_suggestion_changes.suggestion_certainty
  qt_search_result_page_viewed:
    description: Amount of times the house was shown in the search results in that day.
  qt_listing_page_viewed:
    description: Amount of times the listing page was viewed in that day.
  qt_visits_booked:
    description: Amount of visits booked in that day.
  qt_visits_completed:
    description: Amount of visits completed in that day.
  qt_offers_submitted:
    description: Amount of offers submitted in that day.
  qt_offers_accepted:
    description: Amount of offers accepted in that day.
  qt_sale_agreements_created:
    description: Amount of sale agreements created in that day.
  qt_sale_agreements_signed:
    description: Amount of sale agreements signed in that day.
  year:
    description: Year of the snapshot. Always filter on this partition column in WHERE clauses to enable
      partition pruning when scanning the table.
    lineage:
      - dw_public.dim_date.year
  month:
    description: Month of the snapshot. Always filter on this partition column in WHERE clauses to enable
      partition pruning when scanning the table.
    lineage:
      - dw_public.dim_date.month
  day:
    description: Day of the snapshot. Always filter on this partition column in WHERE clauses to enable
      partition pruning when scanning the table.
    lineage:
      - dw_public.dim_date.day
  ts_load:
    description: Timestamp of when the table was last processed.
