domain: For Rent
owner: kleber.inoue@quintoandar.com.br
columns:
  sk_house_status:
    description: Key of the house status.
      It's created by concatenating the status and status_reason columns and hashing the concatenation.
  house_status:
    lineage:
      - datalake_ebdb_listing.house_status.house_status
    description: Status of the house.
  status_reason:
    lineage:
      - datalake_ebdb_listing.house_status.status_reason
    description: House status reason.
  ts_load:
    description: Timestamp of when this table was loaded.
