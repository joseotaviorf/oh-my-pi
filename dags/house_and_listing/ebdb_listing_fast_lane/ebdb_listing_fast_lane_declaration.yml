dag:
  name: ebdb_listing_fast_lane
  schedule_start_date: 2024,01,01
  schedule_interval: 0,30 * * * *
  owner: Data House and Listing
  criticality: Critical
  documentation:
    dag_purpose: |
      DAG containing tables from Listing context that are running every 30 minutes.
workflow:
  type: cdc
  layer: raw
  database_type: mysql
  dbutils_secret_key: EBDB_DB
  source_database: ebdb
  source_schema: ebdb
  custom_schema: ebdb
  execution_timeout_hours: 0.5
  tables_customization:
    ImovelListingRelation:
      clean_primary_keys: [id]
      clean_table_name: house_listing_relation
      clean_z_order_by: [id_house]
      run_optimize: false
    ImovelListingRelation_AUD:
      clean_primary_keys: [id_house_listing_relation, rev]
      clean_table_name: house_listing_relation_aud
      clean_z_order_by: [id_house]
      run_optimize: false
    ListingBusinessContext:
      clean_primary_keys: [id]
      clean_table_name: listing_business_context
      clean_z_order_by: [id_house, status]
      run_optimize: false
    ListingBusinessContext_AUD:
      clean_primary_keys: [id_listing_business_context, rev]
      clean_table_name: listing_business_context_aud
      clean_z_order_by: [id_house, status]
      run_optimize: false
  extra_query_template_params:
    load_end_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, 1), 'load_end_date') }}"
