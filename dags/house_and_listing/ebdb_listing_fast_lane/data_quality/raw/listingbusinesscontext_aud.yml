---
table_name: datalake_ebdb_raw.listingbusinesscontext_aud
alert_channel: "#alerts-de-airflow-dags"
column_level_validations:
  id:
    is_complete:
      severity_level: Error
    custom:
      # Composite primary key (id, rev) must be unique
      constraint: "(SELECT COUNT(*) FROM (SELECT 1 FROM datalake_ebdb_raw.imovel_aud GROUP BY id, rev HAVING COUNT(*) > 1)) = 0"
      severity_level: Error
  imovelId:
    is_complete:
      severity_level: Error
  status:
    is_complete:
      severity_level: Error
  businessContext:
    is_complete:
      severity_level: Error
  rev:
    is_complete:
      severity_level: Error
