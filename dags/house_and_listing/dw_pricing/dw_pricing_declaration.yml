dag:
  name: dw_pricing
  schedule_start_date: 2022, 1, 1
  owner: Data House and Listing
  criticality: High
  documentation:
    dag_purpose: "This DAG loads to DW the pricing modeling, i.e., all the changes made to a listing price."
workflow:
  type: query_delta
  layer: dw
  custom_schema: listing
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  spark_job_arguments:
    - "{environment}"
    - "{bucket}"
    - "{schema}"
    - "{dag_name}"
    - "{table_name}"
    - "{load_start_date}"
    - "{load_end_date}"
    - "prod"
  tables_customization:
    dim_pricing:
      criticality: Critical
      load_spark_job: load_dim_pricing
    fact_price_changes:
      criticality: Critical
      load_spark_job: load_fact_price_changes
    dim_price_suggested:
      criticality: Critical
      load_spark_job: load_dim_price_suggested
      merge_on: ['sk_price_suggested']
    fact_price_suggested:
      criticality: Critical
      load_spark_job: load_fact_price_suggested
      merge_on: ['sk_price_suggested']
