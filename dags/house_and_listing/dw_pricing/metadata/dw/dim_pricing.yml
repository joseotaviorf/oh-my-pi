database_name: dw_listing
table_name: dim_pricing
description: >
  Dimensional table with descriptive attributes of each listing price change.
  One row per price change (sk_pricing), regardless of listing version (id_house_listing).
  Flags (is_last_price, is_last_price_of_day) and change_number are maintained at the
  house-and-business-context level (sk_house + business_context), so a new price change
  on any listing version of the same house updates the flags of all prior price changes
  for that house in that context.
domain: House and Listing
owner: bruna.prates@quintoandar.com.br
columns:
  sk_pricing:
    description: Primary key referring to a price change.
    lineage:
      - datalake_ebdb_pricing.listing_price_change.id_price_change
  price:
    description: Published rental or sale price for the listing during the validity window of this price change.
    lineage:
      - datalake_ebdb_pricing.listing_price_change.price
  previous_price:
    description: >
      Price immediately before this price change, within the same (sk_house, business_context).
      NULL for the first price change of a house in a given business context.
    lineage:
      - datalake_ebdb_pricing.listing_price_change.previous_price
  last_price_variation:
    description: >
      Percent difference between the current price and the immediately preceding price
      for the same (sk_house, business_context). NULL for the first price change.
    lineage:
      - datalake_ebdb_pricing.listing_price_change.last_price_variation
  first_price_variation:
    description: >
      Percent difference between the current price and the very first price ever set
      for the same (sk_house, business_context).
    lineage:
      - datalake_ebdb_pricing.listing_price_change.first_price_variation
  change_number:
    description: >
      Sequential counter of price changes for the same (sk_house, business_context),
      starting at 1 and incrementing across all listing versions.
    lineage:
      - datalake_ebdb_pricing.listing_price_change.change_number
  change_type:
    description: Describes the type of price change relative to the previous price.
    categories:
      FIRST_PRICE: First price registered for the house in the given business context.
      PRICE_INCREASE: Price went up relative to the previous price change.
      PRICE_DECREASE: Price went down relative to the previous price change.
    lineage:
      - datalake_ebdb_pricing.listing_price_change.change_type
  business_context:
    description: Listing business context under which the price change occurred.
    categories:
      RENT: For rent.
      SALE: For sale.
    lineage:
      - datalake_ebdb_pricing.listing_price_change.business_context
  is_last_price:
    description: >
      TRUE if this is the most recent price change for the (sk_house, business_context) pair,
      regardless of listing version (id_house_listing).
    lineage:
      - datalake_ebdb_pricing.listing_price_change.is_last_price
  is_last_price_of_day:
    description: >
      TRUE if this is the most recent price change on its calendar day for the
      (sk_house, business_context) pair, regardless of listing version (id_house_listing).
    lineage:
      - datalake_ebdb_pricing.listing_price_change.is_last_price_of_day
  ts_load:
    description: Timestamp of when the row was last written by the ETL job.
