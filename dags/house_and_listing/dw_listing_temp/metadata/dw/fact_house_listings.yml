database_name: dw_public
table_name: fact_house_listings
description: Information about events that happened during a house listing's lifetime.
  Each line is a house listing identified by the sk_house_listing, followed by information related to its events.
domain: For Rent
owner: jonas.fiorini@quintoandar.com.br
columns:
  sk_house_listing:
    lineage:
      - dw_rent.fact_house_listings.sk_house_listing
    description: Key of house listing.
  sk_next_house_listing_rented:
    lineage:
      - dw_rent.fact_house_listings.sk_next_house_listing_rented
    description: Key of the next house listing that was rented for this house.
  sk_next_house_listing:
    lineage:
      - dw_rent.fact_house_listings.sk_next_house_listing
    description: Key of the next house listing for this house.
  sk_next_house_listing_consolidated:
    lineage:
      - dw_rent.fact_house_listings.sk_next_house_listing_consolidated
    description: Key of the next consolidated house listing for this house.
  sk_owner:
    lineage:
      - dw_rent.fact_house_listings.sk_owner
    description: Key of user who's the house owner/responsible, the key can be the
      partner's user.
  sk_region:
    lineage:
    - dw_rent.fact_house_listings.sk_region
    description: Key of region where house listing is located in.
  sk_user_registration:
    lineage:
    - dw_rent.fact_house_listings.sk_user_registration
    description: Key of user who created the house listing.
  sk_contract:
    lineage:
    - dw_rent.fact_house_listings.sk_contract
    description: Key of rental contract for house listing. In this table, we'll only have contracts that the status is active or finished.
  sk_previous_contract:
    lineage:
      - dw_rent.fact_house_listings.sk_previous_contract
    description: Key of the listing's previous contract.
  sk_next_contract:
    lineage:
      - dw_rent.fact_house_listings.sk_next_contract
    description: Key of the listing's next contract.
  sk_condo:
    lineage:
      - dw_rent.fact_house_listings.sk_condo
    description: Key of condominum building where house listing is located.
  sk_user_partner_agent:
    lineage:
    - dw_rent.fact_house_listings.sk_user_partner_agent
    description: If house listing was added by a partner, key of user who's the partner's
      agent. So if this key and sk_owner are equal, then the sk_owner is actually
      from the partner.
  sk_partner:
    lineage:
    - dw_rent.fact_house_listings.sk_partner
    description: If house listing was added by a partner, key of partner.
  sk_autonomous_agent:
    lineage:
    - dw_rent.fact_house_listings.sk_autonomous_agent
    description: Key of autonomous agent user described at datalake_ebdb_clean.partner_agent
      table.
  sk_user_consultant:
    lineage:
    - dw_rent.fact_house_listings.sk_user_consultant
    description: User key of consultant.
  sk_company_supply:
    lineage:
    - dw_rent.fact_house_listings.sk_company_supply
    description: Key of the Rede company that owns the house. Can be joined with dw_rede.dim_company.
  sk_stranded_date:
    lineage:
    - dw_rent.fact_house_listings.sk_stranded_date
    description: Key of listing stranded date. A listing is considered stranded after
      at least 8 week published and no contract signed.
  country_code:
    lineage:
    - dw_rent.fact_house_listings.country_code
    description: Country code of the listing.
    categories:
      BR: Brazil's country code
      MX: Mexico's country code
  days_listing_to_contract_signed:
    lineage:
      - dw_rent.fact_house_listings.days_listing_to_contract_signed
    description: Number of days between the listing's publication and the signature
      of a rental contract for the listing.
  days_listing_to_depublication:
    lineage:
      - dw_rent.fact_house_listings.days_listing_to_depublication
    description: Number of days between the listing's publication and the depublication
      of the listing.
  days_ended_rental_to_relisting:
    lineage:
      - dw_rent.fact_house_listings.days_ended_rental_to_relisting
    description: Number of days between the end of the rental contract for the listing.
      and the relisting
  days_relisting_to_re_rental:
    lineage:
      - dw_rent.fact_house_listings.days_relisting_to_re_rental
    description: Number of days between the relisting and a new rental contract for
      the listing.
  days_ended_rental_to_re_rented:
    lineage:
      - dw_rent.fact_house_listings.days_ended_rental_to_re_rented
    description: Number of days between the end of the rental contract and a new rental.
      contract for the listing
  nr_renting:
    lineage:
      - dw_rent.fact_house_listings.nr_renting
    description: Number of different rental contracts that have been signed for the
      house, including the current contract if exists.
  order_renting:
    lineage:
      - dw_rent.fact_house_listings.order_renting
    description: The position of this rent contract among all contracts this house
      already had.
  ts_load:
    description: Timestamp of when data was loaded.
