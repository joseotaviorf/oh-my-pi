database_name: datalake_langfuse_clean
table_name: traces
owner: william.angelo@quintoandar.com.br
domain: Conversational XP
description: "Traces from Langfuse. Each row represents a single LLM application trace, used for monitoring conversational experiences and tracking end-to-end request flows."
columns:
  id_trace:
    description: unique identifier for the trace
    lineage:
      - datalake_langfuse_raw.traces.id
  id_project:
    description: identifier of the project this trace belongs to
    lineage:
      - datalake_langfuse_raw.traces.project_id
  id_session:
    description: identifier of the session this trace belongs to
    lineage:
      - datalake_langfuse_raw.traces.session_id
  id_user:
    description: identifier of the user who initiated the trace
    lineage:
      - datalake_langfuse_raw.traces.user_id
  environment:
    description: environment where the trace was created
    lineage:
      - datalake_langfuse_raw.traces.environment
  input:
    description: input data sent to the LLM application
    lineage:
      - datalake_langfuse_raw.traces.input
  output:
    description: output data returned by the LLM application
    lineage:
      - datalake_langfuse_raw.traces.output
  name:
    description: name of the trace identifying the operation or endpoint
    lineage:
      - datalake_langfuse_raw.traces.name
  release:
    description: application release version associated with the trace
    lineage:
      - datalake_langfuse_raw.traces.release
  tags:
    description: tags associated with the trace for categorization
    lineage:
      - datalake_langfuse_raw.traces.tags
  version:
    description: version identifier for the trace schema or application
    lineage:
      - datalake_langfuse_raw.traces.version
  is_bookmarked:
    description: boolean flag indicating whether the trace was bookmarked
    lineage:
      - datalake_langfuse_raw.traces.bookmarked
  is_public:
    description: boolean flag indicating whether the trace is publicly visible
    lineage:
      - datalake_langfuse_raw.traces.public
  ts_created:
    description: timestamp when the trace was created
    lineage:
      - datalake_langfuse_raw.traces.timestamp
  year:
    description: year partition
    lineage:
      - datalake_langfuse_raw.traces.year
  month:
    description: month partition
    lineage:
      - datalake_langfuse_raw.traces.month
  day:
    description: day partition
    lineage:
      - datalake_langfuse_raw.traces.day
  hour:
    description: hour partition
    lineage:
      - datalake_langfuse_raw.traces.hour
