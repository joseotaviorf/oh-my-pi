database_name: datalake_langfuse_clean
table_name: observations
owner: william.angelo@quintoandar.com.br
domain: Conversational XP
description: "Each row represents a single observation (span, generation, or event) recorded within an LLM trace by the Langfuse observability platform. Loaded hourly via custom ingestion. Used by the Conversational XP team to monitor latency, token usage, and cost per model call. Z-ordered by ts_started for efficient time-range queries."
columns:
  id_observation:
    description: unique identifier for the observation
    lineage:
      - datalake_langfuse_raw.observations.id
  id_parent_observation:
    description: identifier of the parent observation if this is a nested observation
    lineage:
      - datalake_langfuse_raw.observations.parent_observation_id
  id_trace:
    description: identifier of the trace this observation belongs to
    lineage:
      - datalake_langfuse_raw.observations.trace_id
  id_project:
    description: identifier of the project this observation belongs to
    lineage:
      - datalake_langfuse_raw.observations.project_id
  input:
    description: input data sent to the model
    lineage:
      - datalake_langfuse_raw.observations.input
  output:
    description: output data returned by the model
    lineage:
      - datalake_langfuse_raw.observations.output
  environment:
    description: environment where the observation was created
    lineage:
      - datalake_langfuse_raw.observations.environment
  metadata:
    description: additional metadata associated with the observation
    lineage:
      - datalake_langfuse_raw.observations.metadata
  provided_model_name:
    description: name of the model used for this observation
    lineage:
      - datalake_langfuse_raw.observations.provided_model_name
  model_parameters:
    description: parameters used when calling the model
    lineage:
      - datalake_langfuse_raw.observations.model_parameters
  name:
    description: human-readable label assigned to this observation within the trace
    lineage:
      - datalake_langfuse_raw.observations.name
  type:
    description: classification of the observation within the Langfuse tracing model
    lineage:
      - datalake_langfuse_raw.observations.type
  level:
    description: log level of the observation
    lineage:
      - datalake_langfuse_raw.observations.level
  usage_details:
    description: token usage details for the observation
    lineage:
      - datalake_langfuse_raw.observations.usage_details
  cost_details:
    description: cost information for the observation
    lineage:
      - datalake_langfuse_raw.observations.cost_details
  latency:
    description: elapsed time for the observation (for example model call duration)
    lineage:
      - datalake_langfuse_raw.observations.latency
  ts_started:
    description: timestamp when the observation started
    lineage:
      - datalake_langfuse_raw.observations.start_time
  ts_ended:
    description: timestamp when the observation ended
    lineage:
      - datalake_langfuse_raw.observations.end_time
  year:
    description: calendar year extracted from the observation start timestamp
    lineage:
      - datalake_langfuse_raw.observations.year
  month:
    description: calendar month extracted from the observation start timestamp
    lineage:
      - datalake_langfuse_raw.observations.month
  day:
    description: calendar day extracted from the observation start timestamp
    lineage:
      - datalake_langfuse_raw.observations.day
  hour:
    description: calendar hour extracted from the observation start timestamp
    lineage:
      - datalake_langfuse_raw.observations.hour