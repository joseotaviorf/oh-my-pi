cluster:
  type: emr_7_12_consolidation_l_memory_fleet_cluster
  emr_task_retries: 0
  custom_libraries:
  # langfuse==3.0.0 requires packaging>=23.2,<25; overlay RPM packaging via
  # ignore_installed before the client install (EMR bootstrap only).
  - pypi:
      package: packaging>=23.2,<25
      ignore_installed: true
  - pypi:
      package: langfuse==3.0.0
  custom_configurations:
    aws_attributes:
      availability: ON_DEMAND
    spark_conf:
      spark.driver.maxResultSize: '0'
      spark.executor.memory: 32g
      spark.dynamicAllocation.maxExecutors: '10'
    task_nodes:
      target_on_demand: 5
      target_spot: 0
