dag:
  name: langfuse
  schedule_start_date: 2025, 6, 10
  schedule_interval: 30 * * * *
  max_active_runs: 1
  owner: Data Conversational XP
  documentation:
    dag_purpose: |
      Load data of the Langfuse to the Clean layer, the Raw layer is loaded by custom ingestion.
      Langfuse is responsible for tracking LLM applications and conversations.

workflow:
  layer: raw
  type: custom_ingestion
  load_spark_job: fetch_data
  spark_job_arguments:
    - "{dag_name}"
    - "{environment}"
    - "{bucket}"
    - "{{ get_date_param(dag_run, data_interval_start | ts, 'load_start_date') }}"
    - "{{ get_date_param(dag_run, data_interval_end | ts, 'load_end_date') }}"
    - "{table_name}"

  default_raw_partitions: [year, month, day, hour]
  execution_timeout_hours: 2
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ts, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_end | ts, 'load_end_date') }}"
  tables_customization:
    scores:
      merge_on: [id_score]
      z_order_by: [ts_created]
      run_optimize: false
    traces:
      merge_on: [id_trace]
      z_order_by: [ts_created]
      run_optimize: false
    observations:
      merge_on: [id_observation]
      z_order_by: [ts_started]
      run_optimize: false

