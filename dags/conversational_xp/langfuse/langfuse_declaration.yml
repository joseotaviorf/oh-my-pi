dag:
  name: langfuse
  schedule_start_date: 2025, 6, 10
  schedule_interval: 0 0-23 * * *
  owner: Data Conversational XP
  documentation:
    dag_purpose: |
      Load data of the Langfuse to the Clean layer, the Raw layer is loaded by custom ingestion.
      Langfuse is responsible for tracking LLM applications and conversations.

workflow:
  layer: raw
  type: custom_ingestion
  load_spark_job: add_data_from_api_to_raw
  spark_job_arguments:
  - "{dag_name}"
  - "{environment}"
  - "{bucket}"
  - "{{ get_date_param(dag_run, data_interval_start | ts, 'load_start_date') }}"
  - "{table_name}"

  default_partitions: [year, month, day, hour]
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ts, 'load_start_date') }}"
  tables_customization:
    scores:
      merge_on: [id_score]
    traces:
      merge_on: [id_trace]
    observations:
      merge_on: [id_observation]

cluster:
  type: custom_cluster
  custom_libraries:
  - pypi:
      package: "langfuse==3.0.0"
  custom_configurations:
    driver_node_type_id: r5a.xlarge
    node_type_id: r5a.xlarge
    num_workers: 2
    spark_version: 12.2.x-scala2.12
    aws_attributes:
      availability: ON_DEMAND
    spark_conf:
      spark.driver.maxResultSize: "0"
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
  databricks_conn_id: databricks_new 