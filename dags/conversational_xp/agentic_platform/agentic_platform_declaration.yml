dag:
  name: agentic_platform
  schedule_start_date: 2026, 06, 01
  schedule_interval: 40 0,3-20 * * *
  owner: Data Conversational XP
  documentation:
    dag_purpose: |
      This DAG ingests CDC generated data from the [agentic-chatbot-service](https://github.com/quintoandar/quintoml) transactional database.
      It captures:
      - `traces` — full versioned `TraceEvent` (conversation content + agent-execution tree) → datalake_agentic_platform_{raw,clean}.traces (CNVPL-2085)
      - `agentic_sessions` — session lifecycle (stream/session identity + open/closed timestamps) → datalake_agentic_platform_raw.agentic_sessions / _clean.sessions
      - `nudges` — per-user mission/nudge coordination state (lifecycle, CDP payload, snooze) → datalake_agentic_platform_{raw,clean}.nudges

workflow:
  type: cdc
  layer: raw
  database_type: postgres
  source_schema: public
  source_database: agentic_chatbot_service
  dbutils_secret_key: AGENTIC_CHATBOT_SERVICE_DB
  tables_customization:
    traces:
      # append-only history: ignore the operational table's purge DELETEs so they never erase lake history.
      has_soft_delete: true
    agentic_sessions:
      clean_table_name: sessions
    nudges: {}
    # nudge_openers has no prod data yet; keep queries/metadata for a future enablement PR.

cluster:
  type: consolidation_s_memory_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    aws_attributes:
      availability: ON_DEMAND
    spark_conf:
      spark.driver.maxResultSize: "0"
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
