---
database_name: datalake_mora
table_name: users
owner: william.angelo@quintoandar.com.br
domain: Conversational XP
description: |
  Daily snapshot of active QuintoAndar app users with their Mora availability
  flag, used to track the Mora rollout. Grain is one row per id_user and
  dt_snapshot: each snapshot day holds every user seen on app open, home, login
  or search page view Amplitude events whose load date is the snapshot day, with
  the flag of the user's latest event of that day. The scheduled run writes the
  previous calendar day, the last day fully loaded from Amplitude. Loads merge
  on id_user and dt_snapshot and remove users no longer present in the
  reprocessed days, so a rerun or backfill fully replaces only the snapshot days
  in its load window.
columns:
  id_user:
    lineage:
      - datalake_amplitude_clean.events.id_user
    description: QuintoAndar user identifier reported by Amplitude on the app events.
  uuid_person:
    lineage:
      - datalake_person.person_sks.uuid_person
    description: Person UUID linked to the user through the person identity table. NULL when the user has no main credential linked to a person.
  is_mora_enabled_on_app:
    lineage:
      - datalake_amplitude_clean.events.user_properties
    description: Value of the isMoraEnabledOnApp Amplitude user property on the user's most recent qualifying event of the snapshot day. NULL when that event lacks the property or it is not a boolean, which happens on app versions that predate the flag, even if earlier events of the day carry it.
  dt_snapshot:
    lineage:
      - datalake_amplitude_clean.events.year
      - datalake_amplitude_clean.events.month
      - datalake_amplitude_clean.events.day
    description: Snapshot day, the Amplitude load date of the user's qualifying app events.
  ts_last_event:
    lineage:
      - datalake_amplitude_clean.events.ts_event
    description: Timestamp of the user's most recent qualifying app event of the snapshot day, the event that sets is_mora_enabled_on_app.
