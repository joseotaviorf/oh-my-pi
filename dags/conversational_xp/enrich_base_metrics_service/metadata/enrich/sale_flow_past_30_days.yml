database_name: datalake_search
table_name: sale_flow_past_30_days
owner: pedro.nogueira@quintoandar.com.br
domain: Conversational XP
description: |
  Intermediate staging table. One row per user-house pair with the most recent sale flow
  timestamps over the past 30 days (booking, visit, offer, contract). Feeds search_impressions
  to enable experiment funnel metrics for the sale business context.
  Z-ordered by [id_user, id_house] for efficient joins.
columns:
  id_user:
    description: QuintoAndar buyer ID identifying the user in the sale funnel.
    lineage:
      - datalake_sale_flows.sale_flow.id_buyer
  id_house:
    description: QuintoAndar property identifier for the house involved in the sale flow event.
    lineage:
      - datalake_sale_flows.sale_flow.id_house
  ts_visit_booked:
    description: The timestamp in which a visit was booked.
    lineage:
      - datalake_sale_flows.sale_flow.ts_first_booking_created
  ts_visit_completed:
    description: The timestamp in which a visit was completed.
    lineage:
      - datalake_sale_flows.sale_flow.ts_first_visit_completed
  ts_offer:
    description: The timestamp in which an offer was made. Contemplates direct and submitted offers.
    lineage:
      - datalake_sale_flows.sale_flow.ts_first_offer_submitted
  ts_contract_signed:
    description: The timestamp in which a contract was signed.
    lineage:
      - datalake_sale_flows.sale_flow.dt_sale_agreement_signed
  ts_offer_approved:
    description: The timestamp in which an offer was accepted.
    lineage:
      - datalake_sale_flows.sale_flow.dt_first_offer_accepted
  ts_sale_flow_latest_event:
    description: Timestamp of the most recent event for this user-house pair across all sale flow stages, used to filter the rolling 30-day window.
    lineage:
      - datalake_sale_flows.sale_flow.ts_first_booking_created
      - datalake_sale_flows.sale_flow.ts_first_visit_completed
      - datalake_sale_flows.sale_flow.ts_first_offer_submitted
      - datalake_sale_flows.sale_flow.dt_first_offer_accepted
      - datalake_sale_flows.sale_flow.dt_sale_agreement_signed
