database_name: datalake_search
table_name: rent_flow_past_30_days
owner: pedro.nogueira@quintoandar.com.br
domain: Conversational XP
description: |
  Intermediate staging table. One row per user-house pair with the most recent rental flow
  timestamps over the past 30 days (booking, visit, offer, contract). Feeds search_impressions
  to enable experiment funnel metrics for the rent business context.
  Z-ordered by [id_user, id_house] for efficient joins.
columns:
  id_user:
    description: QuintoAndar tenant prospect ID identifying the user in the rental funnel.
    lineage:
      - datalake_rent_flows.rent_flows.id_tenant_prospect
  id_house:
    description: QuintoAndar property identifier for the house involved in the rental flow event.
    lineage:
      - datalake_rent_flows.rent_flows.id_house
  id_visit:
    description: The id of the first rent visit booked for the rent flow, ordered by creation timestamp.
    lineage:
      - datalake_booking.booking.id_visit
  id_agent:
    description: Identifies the human broker agent who created the first visit when that first visit was agent-booked, and is null when the first visit was user-booked.
    lineage:
      - datalake_booking.booking.id_agent
      - datalake_booking.booking.first_update_source
  visit_creation_origin:
    description: |
      Channel or source where the first rent visit booking was created, such as a user self-service channel or an agent channel.
      This field is tied only to the first visit in the flow to identify who found the house; subsequent visits can have different booking origins.
    lineage:
      - datalake_booking.booking.first_update_source
  ts_visit_booked:
    description: The timestamp in which a visit was booked.
    lineage:
      - datalake_rent_flows.rent_flows.ts_booking_created
  ts_visit_completed:
    description: The timestamp in which a visit was completed.
    lineage:
      - datalake_rent_flows.rent_flows.ts_visit_completed
  ts_offer:
    description: The timestamp in which an offer was made. Contemplates direct and submitted offers.
    lineage:
      - datalake_rent_flows.rent_flows.ts_direct_offer_submitted
      - datalake_rent_flows.rent_flows.ts_offer_submitted
  ts_contract_signed:
    description: The timestamp in which a contract was signed.
    lineage:
      - datalake_rent_flows.rent_flows.ts_contract_signed
  ts_direct_offer:
    description: The timestamp in which a direct offer was made.
    lineage:
      - datalake_rent_flows.rent_flows.ts_direct_offer_submitted
  ts_offer_submitted:
    description: The timestamp in which a submitted offer was made.
    lineage:
      - datalake_rent_flows.rent_flows.ts_offer_submitted
  ts_offer_approved:
    description: The timestamp in which an offer was accepted.
    lineage:
      - datalake_rent_flows.rent_flows.ts_offer_approved
  ts_rent_flow_latest_event:
    description: Timestamp of the most recent event for this user-house pair across all rent flow stages, used to filter the rolling 30-day window.
    lineage:
      - datalake_rent_flows.rent_flows.ts_booking_created
      - datalake_rent_flows.rent_flows.ts_visit_completed
      - datalake_rent_flows.rent_flows.ts_direct_offer_submitted
      - datalake_rent_flows.rent_flows.ts_offer_submitted
      - datalake_rent_flows.rent_flows.ts_offer_approved
      - datalake_rent_flows.rent_flows.ts_contract_signed
