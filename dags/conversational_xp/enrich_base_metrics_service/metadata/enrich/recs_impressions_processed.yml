database_name: datalake_search
table_name: recs_impressions_processed
owner: pedro.nogueira@quintoandar.com.br
domain: Conversational XP
description: |
  One row per recommendation carousel impression enriched with house dimensions, experiment
  variant assignments, and downstream funnel metrics (clicks, visits, offers, contracts) within
  a 30-day window. Core dataset for recommendation health and A/B experiment analysis on the
  Conversational XP team. Partitioned by year/month/day for efficient time-range queries.
columns:
  ids:
    description: "JSON object with identifier keys used to join and deduplicate records: id_recset, id_recset_fix, id_house, id_user, id_session, id_amplitude, id_device, and id_agent (the human broker agent who created the first visit when it was agent-booked, null when user-booked)."
    lineage:
      - datalake_search.recs_impressions.recset_id
      - datalake_search.recs_impressions.recset_id_fix
      - datalake_search.recs_impressions.id_house
      - datalake_search.recs_impressions.id_user
      - datalake_search.recs_impressions.id_session
      - datalake_search.recs_impressions.id_amplitude
      - datalake_search.recs_impressions.id_device
      - datalake_search.rent_flow_past_30_days.id_agent
      - datalake_search.sale_flow_past_30_days.id_agent
  dimensions:
    description: "JSON object with analysis dimensions: business_context, city, platform, position, showcase, origin (chatbot the carousel was generated for, e.g. Julia/Mora/Bianca), country (Amplitude user country, e.g. BR), listing_age (days since publication), is_classified, is_primary_market (1 when the house SALE listing is PRIMARY in the listing_sale_type SSOT, else 0), is_outlier_user, and visit_creation_origin (the channel where the first attributed visit was created)."
    lineage:
      - datalake_search.recs_impressions.business_context
      - datalake_search.recs_impressions.platform
      - datalake_search.recs_impressions.position
      - datalake_search.recs_impressions.showcase
      - datalake_search.recs_impressions.origin
      - datalake_search.recs_impressions.country
      - datalake_search.house_publication_dates.ts_house_published
      - wonka.house_main.city
      - wonka.house_main.is_classified
      - datalake_sale_primary_market.listing_sale_type.sale_type
      - datalake_search.rent_outlier_users_past_30_days.id_user
      - datalake_search.sale_outlier_users_past_30_days.id_user
      - datalake_search.rent_flow_past_30_days.visit_creation_origin
      - datalake_search.sale_flow_past_30_days.visit_creation_origin
  variants:
    description: "JSON object mapping each active experiment_name to the variant_standard_name assigned to the user at recommendation time."
    lineage:
      - datalake_search.recs_impressions.user_properties
      - datalake_search.experiment_config_processed.experiment_name
      - datalake_search.experiment_config_processed.variant_standard_name
  metrics:
    description: "JSON object with binary funnel metrics per impression: recommendations, click, offer, direct_offer, offer_submitted, offer_approved, visit_booked, visit_completed, and contract_signed."
    lineage:
      - datalake_amplitude_clean.170698_listing_page_viewed_events.event_properties
      - datalake_search.rent_flow_past_30_days.ts_offer
      - datalake_search.rent_flow_past_30_days.ts_direct_offer
      - datalake_search.rent_flow_past_30_days.ts_offer_submitted
      - datalake_search.rent_flow_past_30_days.ts_offer_approved
      - datalake_search.rent_flow_past_30_days.ts_visit_booked
      - datalake_search.rent_flow_past_30_days.ts_visit_completed
      - datalake_search.rent_flow_past_30_days.ts_contract_signed
      - datalake_search.sale_flow_past_30_days.ts_offer
      - datalake_search.sale_flow_past_30_days.ts_offer_approved
      - datalake_search.sale_flow_past_30_days.ts_visit_booked
      - datalake_search.sale_flow_past_30_days.ts_visit_completed
      - datalake_search.sale_flow_past_30_days.ts_contract_signed
  timestamps:
    description: "JSON object with event timestamps used in attribution windows: ts_recommendation, ts_house_published, ts_offer, ts_direct_offer, ts_offer_submitted, ts_offer_approved, ts_visit_booked, ts_visit_completed, and ts_contract_signed."
    lineage:
      - datalake_search.recs_impressions.ts_recommendation
      - datalake_search.house_publication_dates.ts_house_published
      - datalake_search.rent_flow_past_30_days.ts_offer
      - datalake_search.rent_flow_past_30_days.ts_direct_offer
      - datalake_search.rent_flow_past_30_days.ts_offer_submitted
      - datalake_search.rent_flow_past_30_days.ts_offer_approved
      - datalake_search.rent_flow_past_30_days.ts_visit_booked
      - datalake_search.rent_flow_past_30_days.ts_visit_completed
      - datalake_search.rent_flow_past_30_days.ts_contract_signed
      - datalake_search.sale_flow_past_30_days.ts_offer
      - datalake_search.sale_flow_past_30_days.ts_offer_approved
      - datalake_search.sale_flow_past_30_days.ts_visit_booked
      - datalake_search.sale_flow_past_30_days.ts_visit_completed
      - datalake_search.sale_flow_past_30_days.ts_contract_signed
  ts_event:
    description: The timestamp of the recommendation event.
    lineage:
      - datalake_search.recs_impressions.ts_recommendation
  date:
    description: Calendar date when the recommendation impression event happened, derived from the recommendation event partition.
    lineage:
      - datalake_search.recs_impressions.year
      - datalake_search.recs_impressions.month
      - datalake_search.recs_impressions.day
  year:
    description: The year of the recommendation event.
    lineage:
      - datalake_search.recs_impressions.year
  month:
    description: The month of the recommendation event.
    lineage:
      - datalake_search.recs_impressions.month
  day:
    description: The day of the recommendation event.
    lineage:
      - datalake_search.recs_impressions.day
  week:
    description: ISO-like week number of the year when the recommendation impression event happened, derived from the recommendation event partition.
    lineage:
      - datalake_search.recs_impressions.year
      - datalake_search.recs_impressions.month
      - datalake_search.recs_impressions.day
