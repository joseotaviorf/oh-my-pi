      - wonka.house_main.is_classified
      - datalake_search.house_publication_dates.ts_house_published
      - datalake_search.rent_outlier_users_past_30_days.id_user
      - datalake_search.sale_outlier_users_past_30_days.id_user
  variants:
    description: A json mapping `experiment_name` to `variant` the user was on that search.
    lineage:
      - datalake_amplitude_clean.170698_search_page_viewed_events.user_properties
      - datalake_amplitude_clean.170698_search_results_page_viewed_events.user_properties
      - datalake_search.experiment_config_processed.experiment_name
      - datalake_search.experiment_config_processed.variant_standard_name
  metrics:
    description: A json with all relevant metrics for search analysis. Ex. clicks, offer, visit_completed
    lineage:
      - datalake_amplitude_clean.170698_listing_page_viewed_events.event_properties
      - datalake_search.rent_flow_past_30_days.ts_visit_booked
      - datalake_search.rent_flow_past_30_days.ts_visit_completed
      - datalake_search.rent_flow_past_30_days.ts_offer
