database_name: datalake_search
table_name: search_impressions
owner: pedro.nogueira@quintoandar.com.br
domain: Conversational XP
description: |
  One row per search event (search_page_viewed or search_results_page_viewed Amplitude events)
  enriched with house dimensions, experiment variant assignments, and downstream funnel metrics
  (clicks, visits, offers, contracts) within a 30-day window. Core dataset for search health and
  A/B experiment analysis on the Conversational XP team. Partitioned by year/month/day for
  efficient time-range queries.
columns:
  ids:
    description: |
      A json with all relevant ids for search analysis. Ex. id_user, id_house, id_search, id_amplitude, ...
      `id_agent` identifies the human broker agent who created the first visit when that first visit was agent-booked, and is null when the first visit was user-booked.
    lineage:
      - datalake_amplitude_clean.170698_search_page_viewed_events.event_properties
      - datalake_amplitude_clean.170698_search_results_page_viewed_events.event_properties
      - datalake_amplitude_clean.170698_search_page_viewed_events.id_user
      - datalake_amplitude_clean.170698_search_results_page_viewed_events.id_user
      - datalake_amplitude_clean.170698_search_page_viewed_events.id_session
      - datalake_amplitude_clean.170698_search_results_page_viewed_events.id_session
      - datalake_amplitude_clean.170698_search_page_viewed_events.id_amplitude
      - datalake_amplitude_clean.170698_search_results_page_viewed_events.id_amplitude
      - datalake_amplitude_clean.170698_search_page_viewed_events.id_device
      - datalake_amplitude_clean.170698_search_results_page_viewed_events.id_device
      - datalake_search.rent_flow_past_30_days.id_agent
      - datalake_search.sale_flow_past_30_days.id_agent
  dimensions:
    description: |
      A JSON object with dimensions for search analysis, including business context, property city, ranking context, listing attributes, and outlier classification.
      `visit_creation_origin` identifies the channel or source where that first attributed visit was created. It refers only to the first visit, because later visits may be booked by a different user or agent; it is used to identify who found the house.
      `is_primary_market` is 1 when the house SALE listing is PRIMARY in the listing_sale_type SSOT, and 0 otherwise, including houses with no SALE listing. Do not use the legacy house.is_sale_primary_market boolean.
    lineage:
      - datalake_amplitude_clean.170698_search_page_viewed_events.event_properties
      - datalake_amplitude_clean.170698_search_results_page_viewed_events.event_properties
      - datalake_amplitude_clean.170698_search_page_viewed_events.user_properties
      - datalake_amplitude_clean.170698_search_results_page_viewed_events.user_properties
      - wonka.house_main.city
      - wonka.house_main.is_classified
      - datalake_sale_primary_market.listing_sale_type.sale_type
      - datalake_search.house_publication_dates.ts_house_published
      - datalake_search.rent_outlier_users_past_30_days.id_user
      - datalake_search.sale_outlier_users_past_30_days.id_user
      - datalake_search.rent_flow_past_30_days.visit_creation_origin
      - datalake_search.sale_flow_past_30_days.visit_creation_origin
  variants:
    description: A json mapping `experiment_name` to `variant` the user was on that search.
    lineage:
      - datalake_amplitude_clean.170698_search_page_viewed_events.user_properties
      - datalake_amplitude_clean.170698_search_results_page_viewed_events.user_properties
      - datalake_search.experiment_config_processed.experiment_name
      - datalake_search.experiment_config_processed.variant_standard_name
  metrics:
    description: A json with all relevant metrics for search analysis. Ex. clicks, offer, visit_completed
    lineage:
      - datalake_amplitude_clean.170698_listing_page_viewed_events.event_properties
      - datalake_search.rent_flow_past_30_days.ts_visit_booked
      - datalake_search.rent_flow_past_30_days.ts_visit_completed
      - datalake_search.rent_flow_past_30_days.ts_offer
      - datalake_search.rent_flow_past_30_days.ts_direct_offer
      - datalake_search.rent_flow_past_30_days.ts_offer_submitted
      - datalake_search.rent_flow_past_30_days.ts_offer_approved
      - datalake_search.rent_flow_past_30_days.ts_contract_signed
      - datalake_search.sale_flow_past_30_days.ts_visit_booked
      - datalake_search.sale_flow_past_30_days.ts_visit_completed
      - datalake_search.sale_flow_past_30_days.ts_offer
      - datalake_search.sale_flow_past_30_days.ts_offer_approved
      - datalake_search.sale_flow_past_30_days.ts_contract_signed
  timestamps:
    description: A json with all relevant timestamps
    lineage:
      - datalake_amplitude_clean.170698_search_page_viewed_events.ts_event
      - datalake_amplitude_clean.170698_search_results_page_viewed_events.ts_event
      - datalake_search.house_publication_dates.ts_house_published
      - datalake_search.rent_flow_past_30_days.ts_visit_booked
      - datalake_search.rent_flow_past_30_days.ts_visit_completed
      - datalake_search.rent_flow_past_30_days.ts_offer
      - datalake_search.rent_flow_past_30_days.ts_direct_offer
      - datalake_search.rent_flow_past_30_days.ts_offer_submitted
      - datalake_search.rent_flow_past_30_days.ts_offer_approved
      - datalake_search.rent_flow_past_30_days.ts_contract_signed
      - datalake_search.sale_flow_past_30_days.ts_visit_booked
      - datalake_search.sale_flow_past_30_days.ts_visit_completed
      - datalake_search.sale_flow_past_30_days.ts_offer
      - datalake_search.sale_flow_past_30_days.ts_offer_approved
      - datalake_search.sale_flow_past_30_days.ts_contract_signed
  ts_event:
    description: The timestamp of the search.
    lineage:
      - datalake_amplitude_clean.170698_search_page_viewed_events.ts_event
      - datalake_amplitude_clean.170698_search_results_page_viewed_events.ts_event
  date:
    description: Calendar date when the search impression event happened, derived from the search event timestamp.
    lineage:
      - datalake_amplitude_clean.170698_search_page_viewed_events.ts_event
      - datalake_amplitude_clean.170698_search_results_page_viewed_events.ts_event
  year:
    description: Partition column. Year of the search event. Always filter on year/month/day for partition pruning.
    lineage:
      - datalake_amplitude_clean.170698_search_page_viewed_events.ts_event
      - datalake_amplitude_clean.170698_search_results_page_viewed_events.ts_event
  month:
    description: Partition column. Month of the search event. Always filter on year/month/day for partition pruning.
    lineage:
      - datalake_amplitude_clean.170698_search_page_viewed_events.ts_event
      - datalake_amplitude_clean.170698_search_results_page_viewed_events.ts_event
  day:
    description: Partition column. Day of the search event. Always filter on year/month/day for partition pruning.
    lineage:
      - datalake_amplitude_clean.170698_search_page_viewed_events.ts_event
      - datalake_amplitude_clean.170698_search_results_page_viewed_events.ts_event
  week:
    description: ISO-like week number of the year when the search impression event happened, derived from the search event timestamp.
    lineage:
      - datalake_amplitude_clean.170698_search_page_viewed_events.ts_event
      - datalake_amplitude_clean.170698_search_results_page_viewed_events.ts_event
