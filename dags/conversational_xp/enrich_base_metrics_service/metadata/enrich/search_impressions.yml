database_name: datalake_search
table_name: search_impressions
owner: pedro.nogueira@quintoandar.com.br
domain: Conversational XP
description: |
  Table with ids, dimensions, metrics and timestamps related to search.
columns:
  ids:
    description: A json with all relevant ids for search analysis. Ex. id_user, id_house, id_search, id_amplitude, ...
    lineage:
      - datalake_amplitude_clean.170698_search_page_viewed_events.event_properties
      - datalake_amplitude_clean.170698_search_results_page_viewed_events.event_properties
      - datalake_amplitude_clean.170698_search_page_viewed_events.id_user
      - datalake_amplitude_clean.170698_search_results_page_viewed_events.id_user
      - datalake_amplitude_clean.170698_search_page_viewed_events.id_session
      - datalake_amplitude_clean.170698_search_results_page_viewed_events.id_session
      - datalake_amplitude_clean.170698_search_page_viewed_events.id_amplitude
      - datalake_amplitude_clean.170698_search_results_page_viewed_events.id_amplitude
      - datalake_amplitude_clean.170698_search_page_viewed_events.id_device
      - datalake_amplitude_clean.170698_search_results_page_viewed_events.id_device
  dimensions:
    description: A json with all relevant dimensions for search analysis. Ex. business_context, city, ...
    lineage:
      - datalake_amplitude_clean.170698_search_page_viewed_events.event_properties
      - datalake_amplitude_clean.170698_search_results_page_viewed_events.event_properties
      - datalake_amplitude_clean.170698_search_page_viewed_events.user_properties
      - datalake_amplitude_clean.170698_search_results_page_viewed_events.user_properties
