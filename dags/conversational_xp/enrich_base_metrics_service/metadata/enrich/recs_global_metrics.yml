database_name: datalake_search
table_name: recs_global_metrics
owner: pedro.nogueira@quintoandar.com.br
domain: Conversational XP
description: |
  Table with ids, dimensions, metrics and timestamps related to user global metrics for recommendations.
columns:
  ids:
    description: A json with all relevant ids for recommendations analysis. Ex. id_user, id_house
    lineage:
      - datalake_search.recs_impressions_processed.ids
      - datalake_search.rent_flow_past_30_days.id_house
      - datalake_search.sale_flow_past_30_days.id_house
  dimensions:
    description: A json with all relevant dimensions for recommendations analysis. Ex. business_context, city, is_outlier_user
    lineage:
      - datalake_search.recs_impressions_processed.dimensions
      - wonka.house_main.city
  variants:
    description: A json mapping `experiment_name` to `variant` the user was allocated to.
    lineage:
      - datalake_search.recs_impressions_processed.variants
  metrics:
    description: A json with all relevant metrics for recommendations analysis. Ex. recommendation, global_visit_booked, global_offer, global_contract_signed
    lineage:
      - datalake_search.recs_impressions_processed.metrics
      - datalake_search.rent_flow_past_30_days.ts_visit_booked
      - datalake_search.rent_flow_past_30_days.ts_visit_completed
      - datalake_search.rent_flow_past_30_days.ts_offer
      - datalake_search.rent_flow_past_30_days.ts_direct_offer
      - datalake_search.rent_flow_past_30_days.ts_offer_submitted
      - datalake_search.rent_flow_past_30_days.ts_offer_approved
      - datalake_search.rent_flow_past_30_days.ts_contract_signed
      - datalake_search.sale_flow_past_30_days.ts_visit_booked
      - datalake_search.sale_flow_past_30_days.ts_visit_completed
      - datalake_search.sale_flow_past_30_days.ts_offer
      - datalake_search.sale_flow_past_30_days.ts_offer_approved
      - datalake_search.sale_flow_past_30_days.ts_contract_signed
  timestamps:
    description: A json with all relevant timestamps for recommendations and subsequent events
    lineage:
      - datalake_search.recs_impressions_processed.timestamps
      - datalake_search.rent_flow_past_30_days.ts_visit_booked
      - datalake_search.rent_flow_past_30_days.ts_visit_completed
      - datalake_search.rent_flow_past_30_days.ts_offer
      - datalake_search.rent_flow_past_30_days.ts_direct_offer
      - datalake_search.rent_flow_past_30_days.ts_offer_submitted
      - datalake_search.rent_flow_past_30_days.ts_offer_approved
      - datalake_search.rent_flow_past_30_days.ts_contract_signed
      - datalake_search.sale_flow_past_30_days.ts_visit_booked
      - datalake_search.sale_flow_past_30_days.ts_visit_completed
      - datalake_search.sale_flow_past_30_days.ts_offer
      - datalake_search.sale_flow_past_30_days.ts_offer_approved
      - datalake_search.sale_flow_past_30_days.ts_contract_signed
  date:
    description: The date of a user interaction with a recommendation.
    lineage:
      - datalake_search.recs_impressions_processed.date
  year:
    description: The year of a user interaction with a recommendation.
    lineage:
      - datalake_search.recs_impressions_processed.year
  month:
    description: The month of a user interaction with a recommendation.
    lineage:
      - datalake_search.recs_impressions_processed.month
  day:
    description: The day of a user interaction with a recommendation.
    lineage:
      - datalake_search.recs_impressions_processed.day
  week:
    description: The week of a user interaction with a recommendation.
    lineage:
      - datalake_search.recs_impressions_processed.week
