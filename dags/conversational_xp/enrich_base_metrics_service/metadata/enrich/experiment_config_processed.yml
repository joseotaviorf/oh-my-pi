database_name: datalake_search
table_name: experiment_config_processed
owner: pedro.nogueira@quintoandar.com.br
domain: Conversational XP
description: |
  One row per variant of each A/B experiment deployed on the search/recommendations platform.
  Flattened from the raw experiment_config JSON so that each variant (control, treatment) is a
  separate row, enabling direct joins with search impression events for experiment analysis.
columns:
  experiment_name:
    description: Name identifying the A/B or feature experiment, used to join with search impression events and determine which variant a user was shown.
    lineage:
      - datalake_search.experiment_config.experiment_name
  begin_date:
    description: The start date of the experiment.
    lineage:
      - datalake_search.experiment_config.config.begin_date
  end_date:
    description: Calendar date after which the experiment stopped receiving new traffic allocations.
    lineage:
      - datalake_search.experiment_config.config.end_date
  variant_name:
    description: Raw variant identifier from the experiment configuration, typically '0' (control) or '1' (treatment).
    lineage:
      - datalake_search.experiment_config.config.variants
  variant_standard_name:
    description: The standard name of the variant (baseline or treatment).
    lineage:
      - datalake_search.experiment_config.config.variants
