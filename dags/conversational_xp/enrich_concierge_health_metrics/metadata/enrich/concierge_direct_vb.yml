database_name: datalake_search
table_name: concierge_direct_vb
owner: yiyi.ji@quintoandar.com
domain: Conversational XP
description: Table containing information about direct visit bookings or reschedules through concierge, i.e., the user asked to book or change a visit during a conversation in WhatsApp. Concierge is identified as Julia in WhatsApp.
columns:
  id_user:
    lineage:
    - dw_visit.fact_visits.sk_visitor
    description: The id of the user who has directly booked a visit through concierge.
  id_house:
    lineage:
    - dw_visit.fact_visits.sk_house
    description: The id of the house that was to be visited.
  id_visit:
    lineage:
    - dw_visit.dim_visit.id_visit
    description: The id of the visit that was booked through concierge.
  id_phone_session:
    lineage:
    - datalake_search.concierge_messages.id_phone_session
    description: Concatenation of the user phone number and the copilot conversation session.
  visit_code:
    lineage:
    - dw_visit.dim_visit.visit_code
    description: The code of the visit that was booked through concierge.
  concierge_flow_type:
    lineage:
    - datalake_search.concierge_messages.concierge_flow_type
    description: The type of the inbound/outbound message. E.g. 'Medium intent' (outbound), 'High intent' (inbound), 'Placas' (inbound), 'TTC' (inbound), etc. We are assigning 'Unknown' to the visits that are in the table datalake_visit.visit_status_events (where channel is 'CONVERSATIONAL - WHATSAPP_CONCIERGE') but not in the table datalake_search.concierge_messages.
  visit_request_channel:
    lineage:
    - dw_visit.dim_visit.visit_request_channel
    description: The channel from which the visit was requested, e.g., 'WHATSAPP_CONCIERGE', 'TENANT_NATIVE', 'AGENT_PWA'.
  visit_event_type:
    lineage:
    - datalake_visit.visit_status_events.event_type
    description: The type of the event that created/changed the visit, i.e., 'VISIT_SCHEDULED' or 'VISIT_RESCHEDULED' events.
  is_direct_visit_booked:
    description: Whether the visit was directly booked through concierge.
  is_visit_completed:
    lineage:
    - dw_visit.dim_visit.is_visit_completed
    description: Whether the visit was completed.
  is_offer_submitted:
    lineage:
    - dw_visit.fact_visits.sk_funnel_offer_submitted
    description: Whether the offer was submitted.
  is_offer_accepted:
    lineage:
    - dw_visit.fact_visits.sk_funnel_offer_accepted
    description: Whether the offer was accepted.
  is_contract_signed:
    lineage:
    - dw_visit.fact_visits.sk_funnel_contract_signed
    description: Whether the contract was signed.
  business_context:
    lineage:
    - dw_visit.dim_visit.business_context
    description: The business context of the visit, i.e., 'RENT' OR 'SALE'.
  ts_concierge_contact:
    lineage:
    - datalake_search.concierge_messages.ts_concierge_contact
    description: The timestamp of the outbound contact or the start of a session in inbound contact.
  ts_message_sent:
    lineage:
    - datalake_search.concierge_messages.ts_message_sent
    description: The timestamp of the message sent.
  ts_visit_event_created:
    lineage:
    - datalake_visit.visit_status_events.ts_created
    description: The timestamp of the creation of the visit events ('VISIT_SCHEDULED' and 'VISIT_RESCHEDULED').
  ts_visit_created:
    lineage:
    - dw_visit.dim_visit.dt_created
    description: The timestamp of the creation of the visit.
  year:
    lineage:
    - datalake_visit.visit_status_events.ts_created
    description: "Partition column. Year of the visit event creation (VISIT_SCHEDULED/VISIT_RESCHEDULED). Always filter on year/month/day for partition pruning."
  month:
    lineage:
    - datalake_visit.visit_status_events.ts_created
    description: "Partition column. Month of the visit event creation. Always filter on year/month/day for partition pruning."
  day:
    lineage:
    - datalake_visit.visit_status_events.ts_created
    description: "Partition column. Day of the visit event creation. Always filter on year/month/day for partition pruning."
