database_name: datalake_search
table_name: concierge_indirect_vb
owner: yiyi.ji@quintoandar.com
domain: Conversational XP
description: Table containing information about visit booked through the schedule visit page referred by concierge, i.e., concierge sent carousels with house listings, the user clicked on a listing and proceeded to book a visit from the listing page. This is different from the direct visit bookings where the user asked concierge to schedule a visit through a WhatsApp message. Concierge is identified as Julia in WhatsApp.
columns:
  id_user:
    lineage:
    - datalake_amplitude_clean.170698_visit_schedule_confirmed_events.id_user
    description: The id of the user who scheduled a visit from a listing recommended by concierge.
  id_house:
    lineage:
    - datalake_amplitude_clean.170698_visit_schedule_confirmed_events.ep_house_id
    description: The id of the house that was to be visited.
  id_visit:
    lineage:
    - dw_visit.dim_visit.id_visit
    description: The id of the visit that was booked through concierge.
  id_phone_session:
    lineage:
    - datalake_search.concierge_messages.id_phone_session
    description: Concatenation of the user phone number and the copilot conversation session.
  visit_code:
    lineage:
    - datalake_amplitude_clean.170698_visit_schedule_confirmed_events.ep_visit_code
    description: The code of the visit that was booked through a listing page recommended by concierge.
  concierge_flow_type:
    lineage:
    - datalake_search.concierge_messages.concierge_flow_type
    - datalake_person_clean.credential_reference.id_reference
    - datalake_person_clean.contact_info.contact_info
    description: The type of the inbound/outbound message. E.g. 'Medium intent' (outbound), 'High intent' (inbound), 'Placas' (inbound), 'TTC' (inbound), etc. We are assigning 'Unknown' to the indirect visit bookings whose Amplitude id_user cannot be matched to concierge_messages, even after mapping the message phone to credential_reference origin = main. This means that the user who got the recommendation from the concierge is different from the user who scheduled the visit.
  visit_request_channel:
    lineage:
    - dw_visit.dim_visit.visit_request_channel
    description: The channel from which the visit was requested, e.g., 'TENANT_NATIVE', 'TENANT_PWA'. As of Feb 2026 this channel is not expected to be 'WHATSAPP_CONCIERGE', as booking through a listing page categorizes as self service.
  is_indirect_visit_booked:
    description: Whether the visit was booked through a listing page recommended by concierge.
  is_visit_completed:
    lineage:
    - dw_visit.dim_visit.is_visit_completed
    description: Whether the visit was completed.
  is_offer_submitted:
    lineage:
    - dw_visit.fact_visits.sk_funnel_offer_submitted
    description: Whether the offer was submitted.
  is_offer_accepted:
    lineage:
    - dw_visit.fact_visits.sk_funnel_offer_accepted
    description: Whether the offer was accepted.
  is_contract_signed:
    lineage:
    - dw_visit.fact_visits.sk_funnel_contract_signed
    description: Whether the contract was signed.
  business_context:
    lineage:
    - dw_visit.dim_visit.business_context
    description: The business context of the visit, i.e., 'RENT' OR 'SALE'.
  days_msg2vb:
    lineage:
    - datalake_search.concierge_messages.ts_message_sent
    - dw_visit.dim_visit.dt_created
    description: Days elapsed from message to visit booking. Filter by 0 to identify visits booked on the same day as the message.
  ts_concierge_contact:
    lineage:
    - datalake_search.concierge_messages.ts_concierge_contact
    description: The timestamp of the outbound contact or the start of a session in inbound contact.
  ts_message_sent:
    lineage:
    - datalake_search.concierge_messages.ts_message_sent
    description: The timestamp of the message sent.
  ts_visit_created:
    lineage:
    - dw_visit.dim_visit.dt_created
    description: The timestamp of the creation of the visit.
  year:
    lineage:
    - dw_visit.dim_visit.dt_created
    description: "Partition column. Year of the visit creation. Always filter on year/month/day for partition pruning."
  month:
    lineage:
    - dw_visit.dim_visit.dt_created
    description: "Partition column. Month of the visit creation. Always filter on year/month/day for partition pruning."
  day:
    lineage:
    - dw_visit.dim_visit.dt_created
    description: "Partition column. Day of the visit creation. Always filter on year/month/day for partition pruning."