database_name: datalake_search
table_name: concierge_prospects_aux
owner: yiyi.ji@quintoandar.com
domain: Conversational XP
description: Auxiliary table containing information about prospects coming from concierge. Concierge is identified as Julia in WhatsApp. Is to be used to enrich concierge_demand table.
columns:
  id_user:
    lineage:
    - datalake_search.concierge_messages.id_user
    description: The id of the user who contacted concierge and has prospect events
  id_house:
    lineage:
    - dw_growth.fact_demand_prospect_events.sk_house
    description: The id of the house that was to be visited.
  id_visit_prospect:
    lineage:
    - dw_growth.fact_demand_prospect_events.sk_visit
    description: The id of the visit that the user converted to a prospect.
  id_phone_session:
    lineage:
    - datalake_search.concierge_messages.id_phone_session
    description: Concatenation of the user phone number and the copilot conversation session. Together with id_user and ts_concierge_contact this is the merge key (one prospect snapshot per concierge contact and Copilot id).
  prospect_phone:
    lineage:
    - datalake_search.concierge_messages.user_phone
    description: WhatsApp number of the concierge contact. The same number used to map a missing Copilot id (0 / -1 / null) to credential_reference origin = main before joining the prospect.
  concierge_flow_type:
    lineage:
    - datalake_search.concierge_messages.concierge_flow_type
    description: The type of the inbound/outbound message. E.g. 'Medium intent' (outbound), 'High intent' (inbound), 'Placas' (inbound), 'TTC' (inbound), etc.
  prospect_activation_channel:
    lineage:
    - dw_growth.fact_demand_prospect_events.operation_channel
    description: The channel from which the prospect was activated, e.g., 'WHATSAPP_CONCIERGE', 'SelfService', 'Agent'. 'SelfService' could also indicate that a prospect made an indirect visit booking through concierge. Please see the concierge_indirect_vb.yml for more details.
  business_context:
    lineage:
    - dw_growth.fact_demand_prospect_events.business_context
    description: The business context of the prospect, i.e., 'RENT' OR 'SALE'.
  prospect_event_type:
    lineage:
    - dw_growth.fact_demand_prospect_events.event_name
    description: The type of the prospect event, e.g., 'new_prospect', 'recovered_prospect', 'prospect_churn'.
  ts_concierge_contact:
    lineage:
    - datalake_search.concierge_messages.ts_concierge_contact
    description: The timestamp of the outbound contact or the start of a session in inbound contact. Together with id_user and id_phone_session this is the merge key.
  ts_message_sent:
    lineage:
    - datalake_search.concierge_messages.ts_message_sent
    description: The timestamp of the message sent.
  ts_prospect_event:
    lineage:
    - dw_growth.fact_demand_prospect_events.ts_event
    description: The timestamp of the creation of the prospect event (activation or churn).
  year:
    lineage:
    - dw_growth.fact_demand_prospect_events.ts_event
    description: "Partition column. Year of the prospect event (activation or churn). Always filter on year/month/day for partition pruning."
  month:
    lineage:
    - dw_growth.fact_demand_prospect_events.ts_event
    description: "Partition column. Month of the prospect event. Always filter on year/month/day for partition pruning."
  day:
    lineage:
    - dw_growth.fact_demand_prospect_events.ts_event
    description: "Partition column. Day of the prospect event. Always filter on year/month/day for partition pruning."
