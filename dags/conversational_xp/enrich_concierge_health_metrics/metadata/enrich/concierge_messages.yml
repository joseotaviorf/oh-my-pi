database_name: datalake_search
table_name: concierge_messages
owner: yiyi.ji@quintoandar.com
domain: Conversational XP
description: Table containing information about the outbound notifications sent by concierge and received by users and messages sent by users to concierge in various inbound forms (e.g. Placas, TTC, Click2WPP, etc.). Concierge is identified as Julia in WhatsApp.
columns:
  id_user:
    lineage:
    - datalake_jaiminho_clean.user_notifications.id_user
    - datalake_copilot_service_clean.session.id_user
    description: The id of the user who has interacted with the concierge, as stored by Jaiminho (outbound) or Copilot session (inbound) at contact time. Values 0 and -1 mean the user was not registered then. This table does not fill id_user from phone; volume should be counted on user_phone. Phone-to-user mapping via Person origin = main is applied in concierge_prospects_aux, concierge_indirect_vb and concierge_demand.
  id_copilot_session:
    lineage:
    - datalake_copilot_service_clean.message.id_session
    description: The id of the conversation session in the copilot tables.
  id_langfuse_session:
    lineage:
    - datalake_copilot_service_clean.session.id_external
    description: The id of the conversation session in the langfuse tables.
  id_notification:
    lineage:
    - datalake_jaiminho_clean.user_notifications.id
    description: The id of the outbound notification. Inbound rows use -1. Together with id_user and id_message this is the merge key.
  id_message:
    lineage:
    - datalake_copilot_service_clean.message.id
    description: The id of the message in the copilot tables. Together with id_user and id_notification this is the merge key.
  user_phone:
    lineage:
    - datalake_jaiminho_clean.user_notifications.destination
    - datalake_sauron_clean.session.user_phone
    description: The phone number of the user who has interacted with the concierge. This field don't have null values and should be used to count for volume of concierge users. Not unique per person, one phone can map to more than one id_user.
  id_phone_session:
    lineage:
    - datalake_jaiminho_clean.user_notifications.destination
    - datalake_sauron_clean.session.user_phone
    - datalake_copilot_service_clean.message.id_session
    description: Concatenation of the user phone number and the conversation session. This allows to identify a unique conversation session per user.
  concierge_flow:
    lineage:
      - datalake_jaiminho_clean.user_notifications.action
      - datalake_copilot_service_clean.message.content
    description: Identifies whether the conversation is inbound or outbound.
  concierge_flow_type:
    lineage:
      - datalake_jaiminho_clean.user_notifications.action
      - datalake_jaiminho_clean.user_notifications.template
      - datalake_copilot_service_clean.message.content
      - datalake_house_listing_search_clean.concierge_trigger.intent
    description: The type of the inbound/outbound message. Outbound examples include 'Medium intent', 'High intent', 'TTC Outbound', 'Favorites', and follow-up campaigns (FUP = follow-up) such as 'Medium FUP', 'Visit cancellation FUP'. Inbound examples include 'Placas', 'TTC', and 'Click2WPP'. In one session a user can have more than one type of inbound flow (e.g. placas and chaves na mão, id_session = 27884962).
  has_human_reply:  
    lineage:
      - datalake_copilot_service_clean.message.role
    description: Whether in the conversation there was a message sent by a human.
  has_audio:
    lineage:
    - datalake_copilot_service_clean.message.media_type
    description: Whether in the conversation there was an audio message sent by a human.
  n_human_replies:
    lineage:
      - datalake_copilot_service_clean.message.role
    description: The number of human replies in the conversation.
  n_audio_replies:
    lineage:
    - datalake_jaiminho_clean.user_notifications.media_type
    description: The number of audio replies in the conversation.
  ts_concierge_contact:
    lineage:
    - datalake_jaiminho_clean.user_notifications.ts_sent
    - datalake_copilot_service_clean.session.ts_created
    description: The timestamp of the outbound contact or the start of a session in inbound contact.
  ts_message_sent:
    lineage:
    - datalake_copilot_service_clean.message.ts_created
    description: The timestamp of the message sent.
  ts_first_outbound_contact:
    lineage:
    - datalake_jaiminho_clean.user_notifications.ts_sent
    description: The timestamp of the very first outbound message sent to the user.
  ts_first_inbound_contact:
    lineage:
    - datalake_copilot_service_clean.message.ts_created
    description: The timestamp of the very first inbound message sent by the user.
  ts_first_concierge_contact:
    lineage:
    - datalake_jaiminho_clean.user_notifications.ts_sent
    - datalake_copilot_service_clean.message.ts_created
    description: The timestamp of the very first contact with the user (inbound or outbound).
  year:
    lineage:
    - datalake_jaiminho_clean.user_notifications.ts_sent
    - datalake_copilot_service_clean.session.ts_created
    description: The year of the contact with the user (inbound or outbound). For database partition purposes.
  month:
    lineage:
    - datalake_jaiminho_clean.user_notifications.ts_sent
    - datalake_copilot_service_clean.session.ts_created
    description: The month of the contact with the user (inbound or outbound). For database partition purposes.
  day:
    lineage:
    - datalake_jaiminho_clean.user_notifications.ts_sent
    - datalake_copilot_service_clean.session.ts_created
    description: The day of the contact with the user (inbound or outbound). For database partition purposes.

