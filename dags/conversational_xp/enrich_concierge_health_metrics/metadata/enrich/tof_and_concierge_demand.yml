database_name: datalake_search
table_name: tof_and_concierge_demand
owner: yiyi.ji@quintoandar.com
domain: Conversational XP
description: This table combines the active users (users with top of funnel ToF events such as search page viewed, search results page viewed, schedule page viewed and listing page viewed) and users in contact with concierge (from concierge_demand table). Concierge is identified as Julia in WhatsApp. 
columns:
  id_user:
    lineage:
    - datalake_search.concierge_demand.id_user
    - datalake_amplitude_page_viewed_events.schedule_search_listing_events.id_user
    description: The id of the user in contact with concierge or is an active user with top of funnel (ToF) events.
  id_amplitude:
    lineage:
    - datalake_amplitude_page_viewed_events.schedule_search_listing_events.id_amplitude
    description: The id of user on Amplitude (tracking system). It's unique per user. When a user is not logged in, the id_user will be not, but amplitude uses users device ID to identify the user.
  id_copilot_session:
    lineage:
    - datalake_search.concierge_demand.id_copilot_session
    description: Copilot Service session identifier linking the concierge conversation to its corresponding chatbot session record.
  user_phone:
    lineage:
    - datalake_search.concierge_demand.user_phone
    description: The phone number of the user who has interacted with concierge.
  id_phone_session:
    lineage:
    - datalake_search.concierge_demand.id_phone_session
    description: Concatenation of the user phone number and the copilot conversation session.
  id_house_of_vb:
    lineage:
    - datalake_search.concierge_demand.id_house_of_vb
    description: The id of the house of the visit booked or rescheduled through concierge (direct and indirect).
  id_visit:
    lineage:
    - datalake_search.concierge_demand.id_visit
    description: The id of the visit booked or rescheduled through concierge (direct and indirect).
  visit_code:
    lineage:
    - datalake_search.concierge_demand.visit_code
    description: The code of the visit booked or rescheduled through concierge (direct and indirect).
  concierge_flow:
    lineage:
    - datalake_search.concierge_demand.concierge_flow
    description: The type of the inbound/outbound message. E.g. 'Medium intent' (outbound), 'High intent' (inbound), 'Placas' (inbound), 'TTC' (inbound), etc. 'Unknown' if the flow type is not known; it happens when a user booked through a listing page referred by concierge but have no existing chat records with the concierge.
  concierge_flow_type:
    lineage:
    - datalake_search.concierge_demand.concierge_flow_type
    description: The type of the inbound/outbound message. E.g. 'Medium intent' (outbound), 'High intent' (inbound), 'Placas' (inbound), 'TTC' (inbound), etc. 'Unknown' if the flow type is not known; it happens when a user booked through a listing page referred by concierge but have no existing chat records with the concierge.
  has_human_reply:
    lineage:
    - datalake_search.concierge_demand.has_human_reply
    description: Whether the message has a human reply.
  has_audio:
    lineage:
    - datalake_search.concierge_demand.has_audio
    description: Whether the message has an audio message.
  n_human_replies:
    lineage:
    - datalake_search.concierge_demand.n_human_replies
    description: The number of human replies in the conversation.
  n_audio_replies:
    lineage:
    - datalake_search.concierge_demand.n_audio_replies
    description: The number of audio replies in the conversation.
  prospect_activation_channel:
    lineage:
    - datalake_search.concierge_demand.prospect_activation_channel
    description: The channel from which the prospect was activated, e.g., 'WHATSAPP_CONCIERGE', 'SelfService', 'Agent'. 'SelfService' could also indicate that a prospect made an indirect visit booking through concierge, in this case the column "concierge_vb_type" will be 'indirect'.
  prospect_event_type:
    lineage:
    - datalake_search.concierge_demand.prospect_event_type
    description: The type of the prospect event. E.g. 'Activation', 'Churn', etc.
  is_contact_prospect:
    lineage:
    - datalake_search.concierge_demand.is_contact_prospect
    description: Whether the user is a contact prospect or not. If a user had contacted concierge and never had initiated a RENT/SALE flow, or had previously churned or initiated a RENT/SALE flow on the day of the concierge contact then this user is a contact prospect.
  is_concierge_prospect:
    lineage:
    - datalake_search.concierge_demand.is_concierge_prospect
    description: Users who became a prospect by initiating a RENT/SALE flow by booking a visit through concierge (direct or indirect).
  business_context:
    lineage:  
    - datalake_search.concierge_demand.business_context
    - datalake_amplitude_page_viewed_events.schedule_search_listing_events.business_context
    description: The business context of the visit scheduled via concierge. When there are no visits, it takes the business context of the prospect's previous visit booking. When both are not available, it takes the business context of the user from ToF events in the 30 days before the contact.
  concierge_vb_type:
    lineage:
    - datalake_search.concierge_demand.concierge_vb_type
    description: The type of the visit booking through concierge (direct or indirect). Direct - a user books a visit directly by messaging concierge in WhatsApp. Indirect - a user books a visit through a listing page recommended by concierge.
  visit_request_channel:
    lineage:
    - datalake_search.concierge_demand.visit_request_channel
    description: The channel from which the visit was requested, e.g., 'WHATSAPP_CONCIERGE', 'TENANT_NATIVE', 'TENANT_PWA'. As of Feb 2026, for indirect bookings, this channel is not expected to be 'WHATSAPP_CONCIERGE', as booking through a listing page categorizes as self service.
  concierge_visit_event:
    lineage:
    - datalake_search.concierge_demand.concierge_visit_event
    description: The type of the event that created/changed the visit, i.e., 'VISIT_SCHEDULED' or 'VISIT_RESCHEDULED'. It applies only to direct visits.
  is_visit_booked:
    lineage:
    - datalake_search.concierge_demand.is_visit_booked
    description: Whether the visit was booked through concierge (direct or indirect).
  is_visit_completed:
    lineage:
    - datalake_search.concierge_demand.is_visit_completed
    description: Whether the visit was completed.
  is_offer_submitted:
    lineage:
    - datalake_search.concierge_demand.is_offer_submitted
    description: Whether the offer was submitted.
  is_offer_accepted:
    lineage:
    - datalake_search.concierge_demand.is_offer_accepted
    description: Whether the offer was accepted.
  is_contract_signed:
    lineage:
    - datalake_search.concierge_demand.is_contract_signed
    description: Whether the contract was signed.
  days_msg2indirect_vb:
    lineage:
    - datalake_search.concierge_demand.days_msg2indirect_vb
    description: The number of days between the concierge contact message and the visit booking through listing page recommended by concierge. It applies only to indirect visits.
  ts_first_outbound_contact:
    lineage:
    - datalake_search.concierge_demand.ts_first_outbound_contact
    description: The timestamp of the very first outbound message sent to the user.
  ts_first_inbound_contact:
    lineage:
    - datalake_search.concierge_demand.ts_first_inbound_contact
    description: The timestamp of the very first inbound message sent by the user.
  ts_first_concierge_contact:
    lineage:
    - datalake_search.concierge_demand.ts_first_concierge_contact
    description: The timestamp of the very first contact with the user (inbound or outbound).
  ts_concierge_contact:
    lineage:
    - datalake_search.concierge_demand.ts_concierge_contact
    description: The timestamp of the outbound contact or the start of a session in inbound contact.
  ts_prospect_event:
    lineage:
    - datalake_search.concierge_demand.ts_prospect_event
    description: The timestamp of the prospect event (activation or churn).
  ts_concierge_visit_event:
    lineage:
    - datalake_search.concierge_demand.ts_concierge_visit_event
    description: The timestamp of the event that created/changed the visit, i.e., 'VISIT_SCHEDULED' or 'VISIT_RESCHEDULED'. It applies only to direct visits.
  ts_visit_created:
    lineage:
    - datalake_search.concierge_demand.ts_visit_created
    description: The timestamp of the first visit creation. It can differ from the ts_concierge_visit_event if the it was a reschedule.
  dt_tof_event:
    lineage:
    - datalake_amplitude_page_viewed_events.schedule_search_listing_events.ts_event
    description: The date of the top of the funnel (ToF) event.
  dt_tof_or_concierge:
    lineage:
    - datalake_amplitude_page_viewed_events.schedule_search_listing_events.ts_event
    - datalake_search.concierge_demand.year
    - datalake_search.concierge_demand.month
    - datalake_search.concierge_demand.day
    description: The date of the top of the funnel (ToF) event or the date of the concierge contact or the date of the first visit creation when there are no concierge contact.
  year:
    lineage:
    - datalake_search.concierge_demand.year
    - datalake_amplitude_page_viewed_events.schedule_search_listing_events.ts_event
    description: The year of the contact with the user (inbound or outbound) or when not available, the year of the first visit creation or when there are no concierge contact, the year of the ToF event. For database partition purposes.
  month:
    lineage:
    - datalake_search.concierge_demand.month
    - datalake_amplitude_page_viewed_events.schedule_search_listing_events.ts_event
    description: The month of the contact with the user (inbound or outbound) or when not available, the month of the first visit creation or when there are no concierge contact, the month of the ToF event. For database partition purposes.
  day:
    lineage:
    - datalake_search.concierge_demand.day
    - datalake_amplitude_page_viewed_events.schedule_search_listing_events.ts_event
    description: The day of the contact with the user (inbound or outbound) or when not available, the day of the first visit creation or when there are no concierge contact, the day of the ToF event. For database partition purposes.