dag:
  name: enrich_concierge_health_metrics
  schedule_start_date: 2026, 02, 10
  owner: Data Conversational XP

workflow:
  custom_schema: search
  layer: enrich
  type: query_delta
  default_extraction_type: incremental
  extra_query_template_params:
    "days_past_7": 7
    "days_past_14": 14
    "days_past_21": 21
    "days_past_30": 30
    "days_past_90": 90
    "start_date": "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    "end_date": "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  tables_customization:
    concierge_messages:
      partitions: [year, month, day]
    concierge_direct_vb:
      partitions: [year, month, day]
    concierge_indirect_vb:
      partitions: [year, month, day]
    concierge_prospects:
      partitions: [year, month, day]

cluster:
    type: databricks_16_4_med_general_2_workers_cluster
    databricks_conn_id: databricks_new_env
    access_control_list:
      group_name: data-products
      permission_level: CAN_MANAGE
