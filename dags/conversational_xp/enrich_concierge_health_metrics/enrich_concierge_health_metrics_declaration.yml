dag:
  name: enrich_concierge_health_metrics
  schedule_start_date: 2026, 02, 10
  owner: Data Conversational XP

workflow:
  custom_schema: search
  layer: enrich
  type: query_delta
  default_extraction_type: incremental
  extra_query_template_params:
    "days_past_30": 30
    "days_past_60": 60
    "days_past_90": 90
    "days_past_120": 120
    "start_date": "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    "end_date": "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  inner_dependencies:
    concierge_prospects_aux:
      - concierge_messages
    concierge_direct_vb:
      - concierge_messages
    concierge_indirect_vb:
      - concierge_messages
    concierge_demand:
      - concierge_messages
      - concierge_prospects_aux
      - concierge_direct_vb
      - concierge_indirect_vb
    tof_and_concierge_demand:
      - concierge_demand
  tables_customization:
    concierge_messages:
      merge_on: [
        id_notification,
        id_message,
        id_user
        ]
      when_not_matched_by_source_delete_condition: |
        MAKE_DATE(target.year, target.month, target.day)
          BETWEEN DATE_SUB(DATE('{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}'), 30)
          AND DATE('{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}')
      partitions: [
        year, 
        month, 
        day
        ]
    concierge_direct_vb:
      merge_on: [
        visit_code, 
        ts_visit_event_created
        ]
      partitions: [
        year, 
        month, 
        day
        ]
    concierge_indirect_vb:
      merge_on: [
        visit_code
        ]
      partitions: [
        year, 
        month, 
        day
        ]
    concierge_prospects_aux:
      merge_on: [
        id_user,
        id_phone_session,
        ts_concierge_contact,
        concierge_flow_type
        ]
      when_not_matched_by_source_delete_condition: |
        MAKE_DATE(target.year, target.month, target.day)
          BETWEEN DATE_SUB(DATE('{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}'), 30)
          AND DATE('{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}')
      partitions: [
        year,
        month, 
        day
        ]
    concierge_demand:
      merge_on: [
        id_user,
        id_notification, 
        id_phone_session, 
        visit_code,
        concierge_flow_type,
        ts_concierge_contact,
        ts_concierge_visit_event
        ]
      when_not_matched_by_source_delete_condition: |
        MAKE_DATE(target.year, target.month, target.day)
          BETWEEN DATE_SUB(DATE('{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}'), 30)
          AND DATE('{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}')
      partitions: [
        year, 
        month, 
        day
        ]
    tof_and_concierge_demand:
      partitions: [
        year, 
        month, 
        day
        ]
