---
database_name: datalake_agentic_platform
table_name: evaluations
owner: lucas.cardozo@quintoandar.com.br
domain: Conversational XP
description: |
  Online session- and trace-level evaluation results emitted by the
  agentic-chatbot-service and landed through CDP user tracking. The table has
  one row per event identifier after keeping the latest CDP delivery.
  Evaluation session identifiers describe the window judged by the evaluator;
  they must not be assumed to match CDC platform-session lifecycle boundaries.
  Runs fail loud when a new agentic_platform event is introduced without an
  intentional mapping.
columns:
  id_event:
    description: "Unique CDP event identifier and merge key."
    lineage:
      - datalake_agentic_platform.platform_events.id_event
  id_person:
    description: "Person UUID carried by the governed event, when identity is available."
    lineage:
      - datalake_agentic_platform.platform_events.id_person
  id_user:
    description: |
      Numeric application user identifier carried by CDP, when available.
      Current evaluation events identify users through id_person instead.
    lineage:
      - datalake_agentic_platform.platform_events.id_user
  id_anonymous:
    description: |
      Anonymous device identifier carried by the CDP event before identity
      resolution, when available.
    lineage:
      - datalake_agentic_platform.platform_events.id_anonymous
  eval_level:
    description: "Evaluation grain derived from the source event name: session or trace."
    lineage:
      - datalake_agentic_platform.platform_events.event_name
  id_session:
    description: "Identifier of the evaluation session/window judged by the online evaluator."
    lineage:
      - datalake_agentic_platform.platform_events.event_properties
  id_trace:
    description: "OTEL trace identifier for trace evaluations; null for session evaluations."
    lineage:
      - datalake_agentic_platform.platform_events.event_properties
  id_chatbot:
    description: "Catalog identifier of the top-level chatbot conversation product."
    lineage:
      - datalake_agentic_platform.platform_events.event_properties
  channel:
    description: "Conversation channel emitted with the evaluation, when available."
    lineage:
      - datalake_agentic_platform.platform_events.event_properties
  session_outcome:
    description: |
      Session-level labeler outcome for session evaluations (for example
      resolved or redirected_to_dedicated_channel). Null for trace
      evaluations and when the labeler did not run.
    lineage:
      - datalake_agentic_platform.platform_events.event_properties
  topic:
    description: |
      Session-level topic label from the online labeler. Null for trace
      evaluations and when the labeler did not run.
    lineage:
      - datalake_agentic_platform.platform_events.event_properties
  agent_declared:
    description: |
      Agent under whose configuration the evaluator was declared. For trace
      evaluations this identifies the measured agent. For session evaluations
      it is lineage metadata, not attribution for the whole conversation, and
      must not be used to split session-level rates.
    lineage:
      - datalake_agentic_platform.platform_events.event_properties
  metrics:
    description: |
      Dynamic map from metric name to numeric score. Binary scores are encoded
      as 1.0 or 0.0; continuous trace metrics retain their numeric values.
    lineage:
      - datalake_agentic_platform.platform_events.event_properties
  ts_event:
    description: "Timestamp when the evaluation event occurred."
    lineage:
      - datalake_agentic_platform.platform_events.ts_event
