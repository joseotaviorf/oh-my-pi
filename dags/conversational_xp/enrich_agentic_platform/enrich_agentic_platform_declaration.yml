dag:
  name: enrich_agentic_platform
  schedule_start_date: 2026, 06, 01
  schedule_interval: 0 * * * *
  owner: Data Conversational XP
  catchup: false
  documentation:
    dag_purpose: |
      Consolidate agentic platform evaluation and tool-call events from CDP
      into typed, deduplicated tables at
      datalake_agentic_platform.evaluations and datalake_agentic_platform.tool_calls.
      A shared datalake_agentic_platform.platform_events table reads and deduplicates
      the upstream source once; downstream projections fan out via
      inner_dependencies. Evaluation metrics are unpivoted into
      eval_metric_observations (percentile source). Each run reads the CDP
      user_tracking date partition containing its Airflow interval and filters
      events to that exact hour.
      Additive daily serving lives in metric_agentic_platform.
workflow:
  type: query_delta
  layer: enrich
  custom_schema: agentic_platform
  default_extraction_type: incremental
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start.strftime('%Y-%m-%d %H:00:00'), 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_end.strftime('%Y-%m-%d %H:00:00'), 'load_end_date') }}"
  tables_customization:
    platform_events:
      merge_on: [id_event]
    evaluations:
      merge_on: [id_event]
    tool_calls:
      merge_on: [id_event]
    eval_metric_observations:
      merge_on: [id_observation]
  inner_dependencies:
    evaluations:
      - platform_events
    tool_calls:
      - platform_events
    eval_metric_observations:
      - evaluations
