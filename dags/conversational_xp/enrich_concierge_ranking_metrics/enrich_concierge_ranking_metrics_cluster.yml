cluster:
  type: emr_7_12_consolidation_s_general_fleet_cluster
  custom_configurations:
    spark_conf:
      spark.metrics.namespace: data_products.conversational_xp
    core_nodes:
      target_on_demand: 2
      target_spot: 0
      instance_types:
      - m6g.xlarge
      - m7g.xlarge
    task_nodes:
      instance_types:
      - m6g.xlarge
      - m7g.xlarge
      target_on_demand: 0
      target_spot: 1
      allocation_strategy: price-capacity-optimized
      bid_price_percentage: 100
  access_control_list:
    group_name: data-products
    permission_level: CAN_MANAGE
