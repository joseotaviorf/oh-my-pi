database_name: datalake_concierge_ranking_metrics
table_name: ranking_metrics
owner: rafael.guedes@quintoandar.com.br
domain: conversational_xp
description: "This table stores the ranking metrics for the concierge"
columns:
  ts_created:
    description: "The recommendation creation date"
    lineage:
    - datalake_house_listing_search_clean.recommendation_user_use_case.ts_created
  id_user:
    description: "The user identifier"
    lineage:
    - datalake_house_listing_search_clean.recommendation_user_use_case.id_user
  id_recommendation:
    description: "The recommendation identifier"
    lineage:
    - datalake_house_listing_search_clean.recommendation_user_use_case.id_recommendation
  recall_at_3:
    description: "The recall at 3"
  ndcg_at_3:
    description: "The nDCG at 3"
  year:
    description: "The year of the recommendation creation date"
    lineage:
    - datalake_house_listing_search_clean.recommendation_user_use_case.ts_created
  month:
    description: "The month of the recommendation creation date"
    lineage:
    - datalake_house_listing_search_clean.recommendation_user_use_case.ts_created
  day:
    description: "The day of the recommendation creation date"
    lineage:
    - datalake_house_listing_search_clean.recommendation_user_use_case.ts_created
