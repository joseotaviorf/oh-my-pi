database_name: datalake_concierge_ranking_metrics
table_name: ranking_metrics
owner: rafael.guedes@quintoandar.com.br
domain: Conversational XP
description: "This table stores the ranking metrics for the concierge"
columns:
  ts_created:
    description: "The recommendation creation date"
    lineage:
    - datalake_house_listing_search_clean.recommendation_user_use_case.ts_created
  id_user:
    description: "QuintoAndar internal user identifier for the user who received the recommendation"
    lineage:
    - datalake_house_listing_search_clean.recommendation_user_use_case.id_user
  id_recommendation:
    description: "The recommendation identifier"
    lineage:
    - datalake_house_listing_search_clean.recommendation_user_use_case.id_recommendation
  recall_at_3:
    description: "Recall at cutoff 3: fraction of relevant houses that appear in the top-3 recommended positions"
    lineage:
    - datalake_amplitude_clean.170698_listing_page_viewed_events.event_properties
    - datalake_house_listing_search_clean.recommendation_use_case.displayed_order
  ndcg_at_3:
    description: "Normalized Discounted Cumulative Gain at cutoff 3, measuring ranking quality of the top-3 recommendations"
    lineage:
    - datalake_amplitude_clean.170698_listing_page_viewed_events.event_properties
    - datalake_house_listing_search_clean.recommendation_use_case.displayed_order
  year:
    description: "Partition column. Year of the recommendation creation date. Always filter on year/month/day for partition pruning."
    lineage:
    - datalake_house_listing_search_clean.recommendation_user_use_case.ts_created
  month:
    description: "Partition column. Month of the recommendation creation date. Always filter on year/month/day for partition pruning."
    lineage:
    - datalake_house_listing_search_clean.recommendation_user_use_case.ts_created
  day:
    description: "Partition column. Day of the recommendation creation date. Always filter on year/month/day for partition pruning."
    lineage:
    - datalake_house_listing_search_clean.recommendation_user_use_case.ts_created
