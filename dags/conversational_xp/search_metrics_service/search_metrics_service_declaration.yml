dag:
  name: search_metrics_service
  schedule_start_date: 2022, 1, 1
  owner: Data Conversational XP

workflow:
  layer: raw
  type: custom_ingestion
  load_spark_job: load_parquet_batch_inference_into_datalake

  spark_job_arguments:
    - "{environment}"
    - "{bucket}"
    - "{dag_name}"
    - s3://data-science.s3.data.quintoandar.com.br/search_monitoring/data
    - "{{ macros.ds_add(data_interval_start | ds, 1) }}" # this refers to the next day. This only makes sense when the DAG runs daily.
    - "{table_name}"
    - "{partitions}"
    - parquet

  default_extraction_type: incremental

  tables_customization:
    search_metrics:
      partitions:
        - date_granularity
        - date
    search_experiments:
      partitions:
        - exp_name
    search_contamination:
      partitions:
        - date

