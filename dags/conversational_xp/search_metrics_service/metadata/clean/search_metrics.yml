---
database_name: datalake_search
table_name: search_metrics
owner: joao.fidalgo@quintoandar.com.br
domain: Conversational XP
description: "This table contains search performance metrics aggregated by various dimensions for monitoring and analysis of search functionality."

columns:
  business_context:
    description: "Business context for the search metric (e.g., rent, sale)"
    lineage:
      - datalake_search.search_metrics.business_context
  dimension_name:
    description: "Name of the dimension being analyzed"
    lineage:
      - datalake_search.search_metrics.dimension_name
  dimension_value:
    description: "Value of the dimension being analyzed"
    lineage:
      - datalake_search.search_metrics.dimension_value
  metric_name:
    description: "Name of the search performance metric"
    lineage:
      - datalake_search.search_metrics.metric_name
  metric_numerator:
    description: "Numerator value used to calculate the metric"
    lineage:
      - datalake_search.search_metrics.metric_numerator
  metric_denominator:
    description: "Denominator value used to calculate the metric"
    lineage:
      - datalake_search.search_metrics.metric_denominator
  metric_value:
    description: "Calculated value of the search metric"
    lineage:
      - datalake_search.search_metrics.metric_value
  is_stable:
    description: "Boolean indicating if the metric is considered stable"
    lineage:
      - datalake_search.search_metrics.is_stable
  date_granularity:
    description: "Time granularity of the metric (daily, weekly, etc.)"
    lineage:
      - datalake_search.search_metrics.date_granularity
  date:
    description: "Date for which the metric was calculated"
    lineage:
      - datalake_search.search_metrics.date
