dag:
  name: chatmanager
  schedule_start_date: 2024,11,01
  schedule_interval: 0 0 * * *
  owner: Data Conversational XP
  documentation:
    dag_purpose: |
      DAG that ingests data from the chat-manager product databse

workflow:
  type: cdc
  layer: raw
  database_type: postgres
  source_schema: public
  dbutils_secret_key: CHATMANAGER_DB
  tables_customization:
    call: {}
    chatgroup:
      clean_table_name: chat_group
    chatuser:
      clean_table_name: chat_user
    chatusergroup:
      clean_table_name: chat_user_group

cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: m7a.xlarge
    node_type_id: m7a.xlarge
    num_workers: 2
    spark_version: 16.4.x-scala2.12
    spark_conf:
      spark.driver.maxResultSize: "0"
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
  databricks_conn_id: databricks_new