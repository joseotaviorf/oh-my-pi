database_name: datalake_chatmanager_clean
table_name: chat_group
owner: william.angelo@quintoandar.com.br
domain: Conversational XP
description: "Chat groups from chat-manager service"
columns:
  id:
    description: "Internal primary key for the chat group record."
    lineage:
      - datalake_chatmanager_raw.chatgroup.id
  id_last_chat_vendor:
    description: "Last chat vendor identifier"
    lineage:
      - datalake_chatmanager_raw.chatgroup.last_chat_vendor_id
  id_chat_subtype:
    description: "FK to the chat subtype that categorizes this conversation thread."
    lineage:
      - datalake_chatmanager_raw.chatgroup.chat_subtype_id
  uuid:
    description: "Chat group unique identifier"
    lineage:
      - datalake_chatmanager_raw.chatgroup.uuid
  version:
    description: "Record version number for optimistic concurrency control."
    lineage:
      - datalake_chatmanager_raw.chatgroup.version
  type:
    description: "Conversation type classification."
    lineage:
      - datalake_chatmanager_raw.chatgroup.type
  chat_group:
    description: "Friendly name or identifier assigned to this conversation group."
    lineage:
      - datalake_chatmanager_raw.chatgroup.chat_group
  state:
    description: "Current state of the chat group."
    lineage:
      - datalake_chatmanager_raw.chatgroup.state
  last_message_sent_by:
    description: "Last message sender identifier"
    lineage:
      - datalake_chatmanager_raw.chatgroup.last_message_sent_by
  last_message_type:
    description: "Message type of the most recently sent message."
    lineage:
      - datalake_chatmanager_raw.chatgroup.last_message_type
  last_message_body:
    description: "Text content of the most recently sent message in this group."
    lineage:
      - datalake_chatmanager_raw.chatgroup.last_message_body
  last_message_index:
    description: "Sequential index of the most recent message in the conversation."
    lineage:
      - datalake_chatmanager_raw.chatgroup.last_message_index
  last_message_data:
    description: "Structured data payload associated with the most recent message."
    lineage:
      - datalake_chatmanager_raw.chatgroup.last_message_data
  attributes:
    description: "Arbitrary key-value metadata attached to this chat group by the service."
    lineage:
      - datalake_chatmanager_raw.chatgroup.attributes
  last_message_media_content_type:
    description: "MIME type of the media file attached to the most recent message."
    lineage:
      - datalake_chatmanager_raw.chatgroup.customer_name
  last_chat_vendor_name:
    description: "Name of the messaging provider used for the most recent message."
    lineage:
      - datalake_chatmanager_raw.chatgroup.last_chat_vendor_name
  chat_subtype:
    description: "Subtype label describing the nature of the conversation."
    lineage:
      - datalake_chatmanager_raw.chatgroup.chat_subtype
  ts_created:
    description: "Chat group creation date"
    lineage:
      - datalake_chatmanager_raw.chatgroup.created_at
  ts_last_message_sent:
    description: "Timestamp of the most recently sent message in this conversation."
    lineage:
      - datalake_chatmanager_raw.chatgroup.last_message_sent_at
  ts_updated:
    description: "Chat group update date"
    lineage:
      - datalake_chatmanager_raw.chatgroup.updated_at
