database_name: datalake_chatmanager_clean
table_name: call
owner: william.angelo@quintoandar.com.br
domain: Conversational XP
description: "Call records from chat-manager service"
columns:
  id:
    description: "Internal primary key for the call record in chat-manager."
    lineage:
      - datalake_chatmanager_raw.call.id
  uuid:
    description: "Call unique identifier"
    lineage:
      - datalake_chatmanager_raw.call.uuid
  id_chat_group:
    description: "FK to the chat group conversation this call belongs to."
    lineage:
      - datalake_chatmanager_raw.call.chat_group_id
  id_from_chat_user:
    description: "From chat user identifier"
    lineage:
      - datalake_chatmanager_raw.call.from_chat_user_id
  id_to_chat_user:
    description: "Recipient chat user targeted in this voice call."
    lineage:
      - datalake_chatmanager_raw.call.to_chat_user_id
  id_vendor:
    description: "FK to the telephony vendor that handled this call."
    lineage:
      - datalake_chatmanager_raw.call.vendor_id
  version:
    description: "Record version number for optimistic concurrency control."
    lineage:
      - datalake_chatmanager_raw.call.version
  state:
    description: "Current lifecycle state of the call."
    lineage:
      - datalake_chatmanager_raw.call.state
  result:
    description: "Final outcome of the call attempt."
    lineage:
      - datalake_chatmanager_raw.call.result
  from_leg_type:
    description: "Telephony leg type for the caller side."
    lineage:
      - datalake_chatmanager_raw.call.from_leg_type
  from_leg_state:
    description: "Lifecycle state of the caller leg during the call."
    lineage:
      - datalake_chatmanager_raw.call.from_leg_state
  from_leg_result:
    description: "Outcome of the caller-side leg."
    lineage:
      - datalake_chatmanager_raw.call.from_leg_result
  from_leg_duration:
    description: "Duration in seconds for the caller-side leg of the call."
    lineage:
      - datalake_chatmanager_raw.call.from_leg_duration
  to_leg_type:
    description: "Telephony leg type for the callee side."
    lineage:
      - datalake_chatmanager_raw.call.to_leg_type
  to_leg_state:
    description: "Lifecycle state of the callee leg during the call."
    lineage:
      - datalake_chatmanager_raw.call.to_leg_state
  to_leg_result:
    description: "Outcome of the callee-side leg."
    lineage:
      - datalake_chatmanager_raw.call.to_leg_result
  to_leg_duration:
    description: "Duration in seconds for the callee-side leg of the call."
    lineage:
      - datalake_chatmanager_raw.call.to_leg_duration
  to_voip_rang:
    description: "VoIP ring indicator"
    lineage:
      - datalake_chatmanager_raw.call.to_voip_rang
  vendor_name:
    description: "Display name of the telephony vendor that handled this call."
    lineage:
      - datalake_chatmanager_raw.call.vendor_name
  is_from_answered_by_machine:
    description: "Indicates if from leg was answered by machine"
    lineage:
      - datalake_chatmanager_raw.call.is_from_answered_by_machine
  ts_created:
    description: "Call creation date"
    lineage:
      - datalake_chatmanager_raw.call.created_at
  ts_updated:
    description: "Call update date"
    lineage:
      - datalake_chatmanager_raw.call.updated_at
