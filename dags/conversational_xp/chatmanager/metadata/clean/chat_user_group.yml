database_name: datalake_chatmanager_clean
table_name: chat_user_group
owner: william.angelo@quintoandar.com.br
domain: Conversational XP
description: "Chat user group associations"
columns:
  id_chat_group:
    description: "FK to the chat group this membership record belongs to."
    lineage:
      - datalake_chatmanager_raw.chatusergroup.chat_group_id
  id_chat_user:
    description: "FK to the chat user who is a member of this group."
    lineage:
      - datalake_chatmanager_raw.chatusergroup.chat_user_id
  state:
    description: "Membership state for this user in the group."
    lineage:
      - datalake_chatmanager_raw.chatusergroup.state
  visible:
    description: "Visibility indicator"
    lineage:
      - datalake_chatmanager_raw.chatusergroup.visible
  profile:
    description: "Role or profile of this user within the conversation."
    lineage:
      - datalake_chatmanager_raw.chatusergroup.profile
  last_read_index:
    description: "Sequential index of the last message read by this user in the group."
    lineage:
      - datalake_chatmanager_raw.chatusergroup.last_read_index
  attributes:
    description: "Arbitrary key-value metadata for this user's participation in the group."
    lineage:
      - datalake_chatmanager_raw.chatusergroup.attributes
  ts_last_read:
    description: "Timestamp when this user last read a message in the group."
    lineage:
      - datalake_chatmanager_raw.chatusergroup.last_read_at
  ts_created:
    description: "Chat user group creation date"
    lineage:
      - datalake_chatmanager_raw.chatusergroup.created_at
  ts_updated:
    description: "Chat user group update date"
    lineage:
      - datalake_chatmanager_raw.chatusergroup.updated_at
