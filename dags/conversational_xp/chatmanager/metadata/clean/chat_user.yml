database_name: datalake_chatmanager_clean
table_name: chat_user
owner: william.angelo@quintoandar.com.br
domain: Conversational XP
description: "One row per chat participant registered in the chat-manager service. Links external participants (tenants, landlords, agents) to their chat identity via id_participant and id_origin. Used to join conversation records to QuintoAndar user entities."
columns:
  id:
    description: "Internal primary key for the chat user record."
    lineage:
      - datalake_chatmanager_raw.chatuser.id
  uuid:
    description: "Chat user unique identifier"
    lineage:
      - datalake_chatmanager_raw.chatuser.uuid
  id_participant:
    description: "External participant identifier from the originating system."
    lineage:
      - datalake_chatmanager_raw.chatuser.participant_id
  id_origin:
    description: "Identifier of the entity that registered this chat user."
    lineage:
      - datalake_chatmanager_raw.chatuser.origin_id
  origin_type:
    description: "Type of the originating system."
    lineage:
      - datalake_chatmanager_raw.chatuser.origin_type
  attributes:
    description: "Arbitrary key-value metadata attached to this chat user by the service."
    lineage:
      - datalake_chatmanager_raw.chatuser.attributes
  version:
    description: "Record version number for optimistic concurrency control."
    lineage:
      - datalake_chatmanager_raw.chatuser.version
  ts_created:
    description: "Chat user creation date"
    lineage:
      - datalake_chatmanager_raw.chatuser.created_at
  ts_updated:
    description: "Chat user update date"
    lineage:
      - datalake_chatmanager_raw.chatuser.updated_at
