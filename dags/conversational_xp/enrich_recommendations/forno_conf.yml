inner_dependencies:
  item_interaction:
    - recommendation_catalog
  recommendation_flow:
    - item_interaction
    - recommendation
  coverage:
    - recommendation
    - recommendation_catalog
  popularity:
    - recommendation
    - recommendation_catalog
    - item_interaction
  recommendation_metrics_agg_recset:
    - recommendation_flow
    - popularity
  recommendation_metrics_agg_display_type_business_context:
    - recommendation_metrics_agg_recset
    - coverage
  recommendation_metrics_agg_display_type_business_context_experiment:
    - recommendation_metrics_agg_recset
  recommendation_metrics_agg_dimensions:
    - recommendation_metrics_agg_recset
  recommendation_features:
    - recommendation

tables:
  recommendation_catalog:
    is_incremental: false
  embeddings:
    is_incremental: true
    partition_cols:
      - year
      - month
      - day
      - ml_model
  item_interaction:
    is_incremental: true
    partition_cols:
      - year
      - month
      - day
      - interaction_type
  recommendation:
    is_incremental: true
  recommendation_flow:
    is_incremental: true
    partition_cols:
      - dt_rec_received
  coverage:
    is_incremental: false
    partition_cols:
      - dt_rec_received
  popularity:
    is_incremental: true
    partition_cols:
      - dt_rec_received
  recommendation_metrics_agg_display_type_business_context:
    is_incremental: true
    partition_cols:
      - dt_rec_received
  recommendation_metrics_agg_display_type_business_context_experiment:
    is_incremental: true
    partition_cols:
      - dt_rec_received
  recommendation_metrics_agg_recset:
    is_incremental: true
    partition_cols:
      - dt_rec_received
  recommendation_metrics_agg_dimensions:
    is_incremental: true
    partition_cols:
      - dt_rec_received
  recommendation_features:
    is_incremental: true
    partition_cols:
      - dt_rec_received
  email_funnel:
    is_incremental: true
    partition_cols:
      - dt_email_sent

custom_cluster:
    driver_node_type_id: r5d.2xlarge
    node_type_id: m5d.4xlarge
    runtime_engine: PHOTON
    num_workers: 3
    spark_version: 12.2.x-scala2.12