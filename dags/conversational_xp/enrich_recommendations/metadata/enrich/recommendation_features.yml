database_name: datalake_recommendations
table_name: recommendation_features
owner: lucas.cardozo@quintoandar.com.br
domain: Conversational XP
description: User and house features of each recommendation.
columns:
  id_recset:
    description: "Unique identifier for the recommendation set"
  id_rec:
    description: "Unique identifier for the individual recommendation"
  business_context:
    description: "Business context for which this recommendation was made (e.g., rent, sale)"
  display_type:
    description: "Recommendation channel or display type (e.g., similar-carousel, daily-feed-email, favorites-email)"
  item_rank:
    description: "Position/rank of the item within the recommendation set"
  ts_rec_created:
    description: "Timestamp when the recommendation was created"
  experiments:
    lineage:
        - datalake_recommendations.recommendation.experiments
    description: A/B experiments associated with this recommendation
  experiments_variants:
    lineage:
        - datalake_recommendations.recommendation.experiments_variants
    description: A/B experiment variants associated with this recommendation
  dt_rec_received:
    description: "Date when the recommendation was received by the user"
  user__id:
    description: "Unique identifier of the user who received the recommendation"
  house__id:
    description: "Unique identifier of the house/property being recommended"

  house__bathroom_count:
    description: "Number of bathrooms in the house"
  house__rent_listing_age_hours:
    description: "Age of the rental listing in hours (time since last publication)"
  house__sale_listing_age_hours:
    description: "Age of the sale listing in hours (time since last publication)"
  house__bathrooms_over_area:
    description: "Ratio of bathrooms to total area (bathrooms per square meter)"
  house__bedroom_count:
    description: "Number of bedrooms in the house"
  house__bedrooms_over_area:
    description: "Ratio of bedrooms to total area (bedrooms per square meter)"
  house__city:
    description: "City where the house is located"
  house__neighborhood:
    description: "Neighborhood where the house is located"
  house__condominium_per_month:
    description: "Monthly condominium fee in local currency"
  house__has_elevator:
    description: "Boolean indicating if the building has an elevator"
  house__is_furnished:
    description: "Boolean indicating if the house is furnished"
  house__latitude:
    description: "Latitude coordinate of the house location"
  house__longitude:
    description: "Longitude coordinate of the house location"
  house__parking_slots_count:
    description: "Number of parking slots available"
  house__sale_price:
    description: "Sale price of the house in local currency"
  house__sale_price_over_area:
    description: "Sale price per square meter"
  house__total_area:
    description: "Total area of the house in square meters"
  house__type:
    description: "Type of house (apartment, studio, house, etc.)"
  house__floor:
    description: "Floor number where the house is located"
  house__iptu_per_month:
    description: "Monthly property tax (IPTU) in local currency"
  house__rent_over_area:
    description: "Monthly rent per square meter"
  house__total_value_per_month:
    description: "Total monthly cost including rent, condominium fee, and taxes"
  house__suite_count:
    description: "Number of suites (master bedrooms with private bathroom)"
  house__has_air_conditioning:
    description: "Boolean indicating if the house has air conditioning"
  house__has_bedroom_cabinets:
    description: "Boolean indicating if the house has built-in bedroom cabinets"
  house__has_fridge:
    description: "Boolean indicating if the house comes with a refrigerator"
  house__has_kitchen_cabinets:
    description: "Boolean indicating if the house has built-in kitchen cabinets"
  house__has_oven:
    description: "Boolean indicating if the house comes with an oven"
  house__has_gas_heated_shower:
    description: "Boolean indicating if the house has gas-heated shower"
  house__parking_type:
    description: "Type of parking available (e.g., garage, covered, street)"
  house__has_pool:
    description: "Boolean indicating if the building/house has a swimming pool"
  house__is_penthouse:
    description: "Boolean indicating if the house is a penthouse"
