database_name: datalake_recommendations
table_name: email_funnel
owner: lucas.cardozo@quintoandar.com.br
domain: Conversational XP
description: |
  Recommendation data. Granularity: date, display_type, email_sent
columns:
  display_type:
    description: Recommendation channel (similar-carousel, daily-feed-email, favorites-email, etc)
  business_context:
    description: Business context for which this recommendation was made
    lineage:
      - datalake_amplitude_clean.events.event_properties
  experiments:
    description: A/B experiment associated with this recommendation
    lineage:
      - datalake_emlio_clean.emlio_logs.inputs
  experiments_variants:
    description: A/B experiment variant associated with this recommendation
    lineage:
      - datalake_emlio_clean.emlio_logs.inputs
  dt_email_sent:
     description: Date the email was sent
  emails_sent:
    description: Qty of emails sent
  emails_delivered:
    description: Qty of emails delivered
  emails_opened:
    description: Qty of emails opened
  emails_clicked:
    description: Qty of emails clicked
