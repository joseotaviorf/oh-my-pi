database_name: datalake_recommendations
table_name: item_interaction
owner: lucas.cardozo@quintoandar.com.br
domain: Conversational XP
description: |
  User interaction data. Required for calculating recommendation
  metrics such as precision and recall. Granularity: one user-item pair per row
columns:
  id_user:
    description: Identifier of the user
    lineage:
      - datalake_amplitude_clean.events.id_user
      - datalake_amplitude_clean.events.id_amplitude
      - datalake_amplitude_clean.170698_listing_page_viewed_events.id_user
      - datalake_amplitude_clean.170698_listing_page_viewed_events.id_amplitude
  id_item:
    description: Identifier of the interacted item
    lineage:
      - datalake_amplitude_clean.events.event_properties
      - datalake_amplitude_clean.170698_listing_page_viewed_events.event_properties
  business_context:
    description: Business context
    lineage:
      - datalake_amplitude_clean.events.event_properties
      - datalake_amplitude_clean.170698_listing_page_viewed_events.event_properties
  interaction_type:
    description: Type of interaction between user and item. Could be 'similar-house-clicked' or 'listing-page-viewed'
  ts_interaction:
    description: Timestamp at which the user interaction happened
    lineage:
      - datalake_amplitude_clean.events.ts_event
      - datalake_amplitude_clean.170698_listing_page_viewed_events.ts_event
  dt_interaction:
    description: Date of the user interaction
    lineage:
      - datalake_amplitude_clean.events.ts_event
      - datalake_amplitude_clean.170698_listing_page_viewed_events.ts_event
  type_item:
    description: |
      The type of item that was interacted. Currently we
      only recommend houses, so we only have house-related
      interactions
