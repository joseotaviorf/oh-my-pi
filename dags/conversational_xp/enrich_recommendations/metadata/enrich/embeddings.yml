database_name: datalake_recommendations
table_name: embeddings
owner: lucas.cardozo@quintoandar.com.br
domain: Conversational XP
description: |
  Embeddings of users and houses, used to calculate recommendation metrics such as serendipity and diversity.
columns:
  ml_model:
    description: ML model used to generate the embedding.
    lineage:
      - datalake_emlio_clean.emlio_logs.id_service
  ml_model_version:
    description: Version of the ML model used to generate the embedding.
    lineage:
      - datalake_emlio_clean.emlio_logs.service_version
  business_context:
    description: Business context of the embedding.
    lineage:
      - datalake_emlio_clean.emlio_logs.service_keys.model_type
  type_id:
    description: The type of the object the embedding is describing ('house' or 'user').
    lineage:
      - datalake_emlio_clean.emlio_logs.service_keys.model_type
  id:
    description: The id of the object the embedding is describing ('id_house' or 'id_user').
    lineage:
      - datalake_emlio_clean.emlio_logs.service_keys.model_type
      - datalake_emlio_clean.emlio_logs.service_keys.house_id
      - datalake_emlio_clean.emlio_logs.service_keys.user_id
  ts_embedding:
    description: Timestamp of the embedding.
    lineage:
      - datalake_emlio_clean.emlio_logs.ts_log
  embedding:
    description: |
      The embedding used for recommendations. (houses and users)
      The embeddings are scaled (from [-1, 1] to [0, 1]) and normalized (l2 norm) to facilitate metrics calculations.
    lineage:
      - datalake_emlio_clean.emlio_logs.outputs
