database_name: datalake_recommendations
table_name: recommendation_flow
owner: lucas.cardozo@quintoandar.com.br
domain: Conversational XP
description: |
  Enriched recommendation data. Granularity: one user-item pair per row
columns:
  id_rec:
    description: |
      Unique identifier for the item recommended to the user, on
      through a specific channel and business context, resulting
      from a hash function on over the following attributes:
      id_user, id_item, ts_rec_created, business_context and display_type
    lineage:
      - datalake_recommendations.recommendation.id_rec
  id_recset:
    description: |
      Unique identifier for the set of items recommended at the same time,
      for the same user, through the same channel, in the same business context,
      resulting from a hash function on over the following attributes:
      id_user, ts_rec_created, business_context and display_type
    lineage:
      - datalake_recommendations.recommendation.id_recset
  id_user:
    description: Identifier of the user
    lineage:
      - datalake_recommendations.recommendation.id_user
  id_item:
    description: Identifier of recommended item
    lineage:
      - datalake_recommendations.recommendation.id_item
  id_subjects:
    description: |
      Identifier the recommendation subject. For carousel recommendations,
      our subjects are houses (HSE). For email recommendations, we have
      houses as subject in the ForSale context and users as subject on
      the ForRent context.
    lineage:
      - datalake_recommendations.recommendation.id_subjects
  id_anchors:
    description: Anchors used for generating recommendation
    lineage:
      - datalake_recommendations.recommendation.id_anchor
  item_rank:
    description: Rank of item within its recommendation batch
    lineage:
      - datalake_recommendations.recommendation.item_rank
  ts_rec_received:
    description: Timestamp of recommendation delivery
    lineage:
      - datalake_recommendations.recommendation.ts_rec_received
  ts_rec_created:
    description: Timestamp of recommendation creation
    lineage:
      - datalake_recommendations.recommendation.ts_rec_created
  business_context:
    description: Business context for which this recommendation was made
    lineage:
      - datalake_recommendations.recommendation.business_context
  type_client:
    description: Type of client for which the recommendation was made
    lineage:
      - datalake_recommendations.recommendation.type_client
  type_item:
    description: Type of recommended item. Right now only 'houses' are recommended
    lineage:
      - datalake_recommendations.recommendation.type_item
  display_type:
    description: Recommendation channel (similar-carousel, daily-feed-email, favorites-email, etc)
    lineage:
      - datalake_recommendations.recommendation.display_type
  experiments:
    description: A/B experiments associated with this recommendation
    lineage:
      - datalake_recommendations.recommendation.experiments
  experiments_variants:
    description: A/B experiment variants associated with this recommendation
    lineage:
      - datalake_recommendations.recommendation.experiments_variants
  ml_model:
    description: Machine Learning model used for generating recommendation # should be more generic once we have the modular architecture
    lineage:
      - datalake_recommendations.recommendation.ml_model
  country:
    description: User country when the recommendation was delivered
    lineage:
      - datalake_recommendations.recommendation.country
  region:
    description: User region when the recommendation was delivered
    lineage:
      - datalake_recommendations.recommendation.region
  city:
    description: User city when the recommendation was delivered
    lineage:
      - datalake_recommendations.recommendation.city
  device_family:
    description: User device family when the recommendation was delivered
    lineage:
      - datalake_recommendations.recommendation.device_family
  platform:
    description: User device platform when the recommendation was delivered
    lineage:
      - datalake_recommendations.recommendation.platform
  language:
    description: User device platform when the recommendation was delivered
    lineage:
      - datalake_recommendations.recommendation.language
  true_positive:
    description: |
      Whether the recommendation engaged the user
  cum_true_positive:
    description: |
      Cumulative sum of true_positive ordered by item_rank
  rec_to_favorite:
    description: |
      Whether the recommended item was set as favorite in the same session
  rec_to_rent_flow_one_day:
    description: |
      Whether a rent flow was created for the recommended item in the same day
  rec_to_rent_flow_seven_days:
    description: |
      Whether a rent flow was created for the recommended item in the same day
  rec_to_sale_flow_one_day:
    description: |
      Whether a sale flow was created for the recommended item in the same day
  rec_to_sale_flow_fourteen_days:
    description: |
      Whether a sale flow was created for the recommended item in the same day
  count_relevant_items:
    description: |
      Number of items that would be considered a relevant rec if they where included in the recset.
      We assume the interactions similar-house-clicked, listing-page-viewed, house-favorited
      as a proxy for relevance.
