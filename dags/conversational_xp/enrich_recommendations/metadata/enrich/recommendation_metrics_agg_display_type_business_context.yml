database_name: datalake_recommendations
table_name: recommendation_metrics_agg_display_type_business_context
owner: lucas.cardozo@quintoandar.com.br
domain: Conversational XP
description: |
  Recommendation Metrics. Each row is an aggregate of the recommendation metrics for
  a day, business_context and display_type
columns:
  dt_rec_received:
    description: Date of recommendation delivery
    lineage:
      - datalake_recommendations.recommendation_metrics_agg_dimensions.ts_rec_received
  business_context:
    description: Business context for which this recommendation was made
    lineage:
      - datalake_recommendations.recommendation_metrics_agg_dimensions.business_context
  display_type:
    description: Recommendation channel (similar-carousel, daily-feed-email, favorites-email, etc)
    lineage:
      - datalake_recommendations.recommendation_metrics_agg_dimensions.display_type
  mean_precision_at_3:
    description: Mean Precision @3
    lineage:
      - datalake_recommendations.recommendation_metrics_agg_dimensions.sum_precision_at_3
  mean_recall_at_3:
    description: Mean Recall @3
    lineage:
      - datalake_recommendations.recommendation_metrics_agg_dimensions.sum_recall_at_3
  mean_f1_at_3:
    description: Mean F1 score at position 3
  mean_hit_rate_at_3:
    description: Mean Hit Rate @3
    lineage:
      - datalake_recommendations.recommendation_metrics_agg_dimensions.sum_f1_at_3
  mean_rr_at_3:
    description: Mean Reverse Rank @3
    lineage:
      - datalake_recommendations.recommendation_metrics_agg_dimensions.sum_rr_at_3
  mean_ap_at_3:
