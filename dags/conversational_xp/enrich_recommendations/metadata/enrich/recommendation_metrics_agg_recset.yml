database_name: datalake_recommendations
table_name: recommendation_metrics_agg_recset
owner: lucas.cardozo@quintoandar.com.br
domain: Conversational XP
description: |
  Recommendation Metrics. Granularity: one recset per row
columns:
  id_recset:
    description: |
      Unique identifier for the set of items recommended at the same time,
      for the same user, through the same channel, in the same business context,
      resulting from a hash function on over the following attributes:
      id_user, ts_rec_created, business_context and display_type
    lineage:
      - datalake_recommendations.recommendation_flow.id_recset
  ts_rec_received:
    description: Timestamp of recommendation delivery
    lineage:
      - datalake_recommendations.recommendation_flow.ts_rec_received
  ts_rec_created:
    description: Timestamp of recommendation creation
    lineage:
      - datalake_recommendations.recommendation_flow.ts_rec_created
  business_context:
    description: Business context for which this recommendation was made
    lineage:
      - datalake_recommendations.recommendation_flow.business_context
  type_client:
    description: Type of client for which the recommendation was made
    lineage:
      - datalake_recommendations.recommendation_flow.type_client
  type_item:
    description: Type of recommended item. Right now only 'houses' are recommended
    lineage:
      - datalake_recommendations.recommendation_flow.type_item
  display_type:
    description: Recommendation channel (similar-carousel, daily-feed-email, favorites-email, etc)
    lineage:
      - datalake_recommendations.recommendation_flow.display_type
  experiments:
    description: A/B experiment associated with this recommendation
    lineage:
      - datalake_recommendations.recommendation_flow.experiments
  experiments_variants:
    description: A/B experiment variant associated with this recommendation
    lineage:
      - datalake_recommendations.recommendation_flow.experiments_variants
  ml_model:
    description: Machine Learning model used for generating recommendation # should be more generic once we have the modular architecture
    lineage:
      - datalake_recommendations.recommendation_flow.ml_model
  country:
    description: User country when the recommendation was delivered
    lineage:
      - datalake_recommendations.recommendation_flow.country
  region:
    description: User region when the recommendation was delivered
    lineage:
      - datalake_recommendations.recommendation_flow.region
  city:
    description: User city when the recommendation was delivered
    lineage:
      - datalake_recommendations.recommendation_flow.city
  device_family:
    description: User device family when the recommendation was delivered
    lineage:
      - datalake_recommendations.recommendation_flow.device_family
  platform:
    description: User device platform when the recommendation was delivered
    lineage:
      - datalake_recommendations.recommendation_flow.platform
  language:
    description: User device platform when the recommendation was delivered
    lineage:
      - datalake_recommendations.recommendation_flow.language
  precision_at_3:
    description: Precision score at position 3
    lineage:
      - datalake_recommendations.recommendation_flow.true_positive
      - datalake_recommendations.recommendation_flow.item_rank
  recall_at_3:
    description: Recall score at position 3
    lineage:
      - datalake_recommendations.recommendation_flow.true_positive
      - datalake_recommendations.recommendation_flow.item_rank
      - datalake_recommendations.recommendation_flow.count_relevant_items
  f1_at_3:
    description: F1 score at position 3
  hit_rate_at_3:
    description: Hit Rate at position 3
    lineage:
      - datalake_recommendations.recommendation_flow.true_positive
  rr_at_3:
    description: Reverse Rank @3
    lineage:
      - datalake_recommendations.recommendation_flow.true_positive
      - datalake_recommendations.recommendation_flow.item_rank
  ap_at_3:
    description: Reverse Rank @3
    lineage:
      - datalake_recommendations.recommendation_flow.true_positive
      - datalake_recommendations.recommendation_flow.cum_true_positive
      - datalake_recommendations.recommendation_flow.count_relevant_items
      - datalake_recommendations.recommendation_flow.item_rank
  ndcg_at_3:
    description: Normalized Discounted Cumulative Gain @3
    lineage:
      - datalake_recommendations.recommendation_flow.true_positive
      - datalake_recommendations.recommendation_flow.cum_true_positive
      - datalake_recommendations.recommendation_flow.count_relevant_items
      - datalake_recommendations.recommendation_flow.item_rank
  diversity_at_3:
    description: Diversity @3
    lineage:
      - datalake_recommendations.diversity.diversity_at_3
  repetition_at_3:
    description: Repetition @3
    lineage:
      - datalake_recommendations.recommendation_flow.repeated_rec
      - datalake_recommendations.recommendation_flow.item_rank
  rec_to_favorite_at_3:
    description: Rec to favorite @3
    lineage:
      - datalake_recommendations.recommendation_flow.rec_to_favorite
      - datalake_recommendations.recommendation_flow.item_rank
  hit_rec_to_sale_flow_one_day_at_3:
