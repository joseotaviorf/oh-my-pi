dag:
  name: knowledge_base
  schedule_start_date: 2025, 10, 01
  schedule_interval: 30 0,3-20 * * *
  owner: Data Conversational XP
  documentation:
    dag_purpose: |
      This DAG is responsible for ingesting CDC generated data from the knowledge-base transactional database
workflow:
  type: cdc
  layer: raw
  database_type: postgres
  source_database: knowledge_base
  custom_schema: knowledge_base
  source_schema: public
  tables_customization:
    bot_content:
      clean_primary_keys: [id]
    bot_content_deep_link:
      clean_primary_keys: [id_bot_content, id_deep_link]
    deep_link:
      clean_primary_keys: [id]
    meta_information:
      clean_primary_keys: [id]
    meta_information_bot_content:
      clean_primary_keys: [id_meta_information, id_bot_content]

cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: r7a.xlarge
    node_type_id: r7a.xlarge
    num_workers: 1
    spark_version: 16.4.x-scala2.12
    spark_conf:
      spark.driver.maxResultSize: "0"
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
  databricks_conn_id: databricks_new 
