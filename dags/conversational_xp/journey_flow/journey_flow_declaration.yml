dag:
  name: journey_flow
  schedule_start_date: 2021, 2, 18
  schedule_interval: 0 3 * * *
  owner: Data Conversational XP
  documentation:
    dag_purpose: |
      Retrieve data from the [Journey Flow](https://github.com/quintoandar/journey-flow) database,
      a service that is part of the chatbot structure.

workflow:
  type: cdc
  layer: raw
  source_schema: public
  source_database: journey_flow
  database_type: postgres
  dbutils_secret_key: JOURNEY_FLOW_DB
  custom_schema: journey_flow

  tables_customization:
    t_journey_flow:
      clean_table_name: journey_flow
    t_dialog:
      clean_table_name: dialog

cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: r5a.2xlarge
    node_type_id: r5a.xlarge
    num_workers: 4
    spark_version: 13.3.x-scala2.12
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
  databricks_conn_id: databricks_new
