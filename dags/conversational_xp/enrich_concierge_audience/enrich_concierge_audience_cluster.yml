cluster:
  type: emr_7_12_consolidation_m_memory_fleet_cluster
  custom_configurations:
    spark_conf:
      spark.metrics.namespace: data_products.conversational_xp
      spark.sql.shuffle.partitions: "200"
      spark.dynamicAllocation.maxExecutors: "12"
    core_nodes:
      target_on_demand: 2
      target_spot: 0
      instance_types:
        - r6g.2xlarge
        - r7g.2xlarge
        - r6i.2xlarge
    task_nodes:
      instance_types:
        - r6g.2xlarge
        - r7g.2xlarge
        - r6i.2xlarge
      target_on_demand: 0
      target_spot: 4
      allocation_strategy: price-capacity-optimized
      bid_price_percentage: 100
