dag:
  name: enrich_concierge_audience
  schedule_start_date: 2026, 7, 1
  schedule_interval: 0 6 * * *
  owner: Data Conversational XP
  catchup: false
  documentation:
    dag_purpose: |
      Daily concierge (Julia) audience for WhatsApp outreach. Logic matches
      customer-data-platform cdp_modeled_repo.tb_concierge_users (modeled query
      in workflows/data_products/concierge/queries/modeled). One deduplicated row
      per user per run, partitioned by snapshot date.
workflow:
  type: query_delta
  layer: enrich
  custom_schema: search
  default_extraction_type: full
  default_partitions: [year, month, day]
  tables_customization:
    concierge_users:
      merge_on: [id_user]
      partitions: [year, month, day]
      z_order_by: [id_user, business_context]
