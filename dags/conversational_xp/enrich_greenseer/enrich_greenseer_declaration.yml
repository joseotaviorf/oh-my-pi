dag:
  name: enrich_greenseer
  schedule_start_date: 2020, 7, 1
  owner: Data Conversational XP
  documentation:
    dag_purpose: |
      Extract relevant fields from greenseer memory json and add relevant business rules to reduce the analysis.
workflow:
  type: query_delta
  layer: enrich
  tables_customization:
    sessions:
      partitions: [year, month, day]
      extraction_type: incremental
      merge_on: [id_session]
      z_order_by: [ts_started, id_session]
