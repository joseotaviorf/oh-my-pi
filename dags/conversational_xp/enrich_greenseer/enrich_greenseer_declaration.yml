dag:
  name: enrich_greenseer
  schedule_start_date: 2020, 7, 1
  owner: Data Conversational XP
  documentation:
    dag_purpose: |
      Extract relevant fields from greenseer memory json and add relevant business rules to reduce the analysis.
workflow:
  type: query_delta
  layer: enrich
  tables_customization:
    sessions:
      partitions: [year, month, day]
      extraction_type: incremental
      merge_on: [id_session]
      z_order_by: [ts_started, id_session]

cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: r7a.2xlarge
    node_type_id: r7a.2xlarge
    num_workers: 3
    spark_version: 13.3.x-scala2.12
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
  databricks_conn_id: databricks_new
