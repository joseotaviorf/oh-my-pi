dag:
  name: enrich_search
  schedule_start_date: 2022, 1, 1
  owner: Data Conversational XP
workflow:
  type: query
  layer: enrich
  default_extraction_type: full
  extra_query_template_params:
    "days_past": 14
    "days_past_21": 21
    "days_past_30": 30
    "start_date": "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    "end_date": "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  inner_dependencies:
    item_interaction:
      - amplitude_user_device
    item_interaction_sale:
      - amplitude_user_device
  tables_customization:
    item_interaction:
      partitions:
        - year
        - month
        - day
        - interaction_type
    item_interaction_sale:
      partitions:
        - year
        - month
        - day
        - interaction_type

