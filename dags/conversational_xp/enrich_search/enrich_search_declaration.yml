dag:
  name: enrich_search
  schedule_start_date: 2022, 1, 1
  owner: Data Conversational XP
workflow:
  type: query
  layer: enrich
  default_extraction_type: full
  extra_query_template_params:
    "days_past": 14
    "days_past_21": 21
    "days_past_30": 30
    "start_date": "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    "end_date": "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  inner_dependencies:
    item_interaction:
      - amplitude_user_device
    item_interaction_sale:
      - amplitude_user_device
  tables_customization:
    item_interaction:
      partitions:
        - year
        - month
        - day
        - interaction_type
    item_interaction_sale:
      partitions:
        - year
        - month
        - day
        - interaction_type

cluster:
  type: consolidation_l_general_cluster
  custom_configurations:
    driver_node_type_id: c6g.xlarge
    node_type_id: m6gd.4xlarge
    runtime_engine: PHOTON
    num_workers: 4
    spark_conf:
      spark.metrics.namespace: "data_products.enrich_search"
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
    aws_attributes:
      ebs_volume_size: 200
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
  access_control_list:
    group_name: data-products
    permission_level: CAN_MANAGE
  databricks_conn_id: databricks_new_env
