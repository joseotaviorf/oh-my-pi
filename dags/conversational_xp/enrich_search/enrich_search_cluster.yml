cluster:
  type: emr_7_12_consolidation_l_general_fleet_cluster
  custom_configurations:
    spark_conf:
      spark.metrics.namespace: data_products.enrich_search
    aws_attributes:
      ebs_volume_size: 200
    master_node_type_id: m6g.xlarge
    core_nodes:
      target_on_demand: 2
      target_spot: 0
      instance_types:
      - m6gd.4xlarge
    task_nodes:
      instance_types:
      - m6gd.4xlarge
      target_on_demand: 0
      target_spot: 2
      allocation_strategy: price-capacity-optimized
      bid_price_percentage: 100
