dag:
  name: greenseer
  schedule_start_date: 2021, 2, 18
  schedule_interval: 0 0 * * *
  owner: Data Conversational XP
  documentation:
    dag_purpose: |
      Retrieve data from Greenseer database (postgresql). [Greenseer](https://github.com/quintoandar/greenseer)
      is our specific-purpose chatbot!

      Greenseer interacts with Sauron, orchestrating all automatic text-based customer support in QuintoAndar.
      When an user tries to contact us via WhatsApp, Greenseer is the receptionist that asks the contact reason
      and routes the ticket to the best possible human agent.

workflow:
  type: cdc
  layer: raw
  source_schema: public
  source_database: greenseer
  database_type: postgres
  dbutils_secret_key: GREENSEER_DB

  tables_customization:
    Session:
      clean_table_name: session


cluster:
  type: databricks_13_3_med_general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
