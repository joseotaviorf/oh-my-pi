dag:
  name: copilot_service
  schedule_start_date: 2024, 01, 01
  schedule_interval: 40 0,3-20 * * *
  owner: Data Conversational XP
  documentation:
    dag_purpose: |
      This DAG is responsible for ingesting CDC generated data from the [copilot-service](https://github.com/quintoandar/copilot-service) transactional database
workflow:
  type: cdc
  layer: raw
  database_type: postgres
  source_schema: public
  tables_customization:
    message: {}
    session: {}
    state: {}
    message_flow: {}
    voice_call_attempt: {}
    voice_session: {}

cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: r7a.xlarge
    node_type_id: r7a.xlarge
    num_workers: 2
    spark_version: 16.4.x-scala2.12
    aws_attributes:
      availability: ON_DEMAND
    spark_conf:
      spark.driver.maxResultSize: "0"
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
  databricks_conn_id: databricks_new
