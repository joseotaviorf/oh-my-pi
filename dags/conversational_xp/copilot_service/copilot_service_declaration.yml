dag:
  name: copilot_service
  schedule_start_date: 2024, 01, 01
  schedule_interval: 40 0,3-20 * * *
  owner: Data Conversational XP
  documentation:
    dag_purpose: |
      This DAG is responsible for ingesting CDC generated data from the [copilot-service](https://github.com/quintoandar/copilot-service) transactional database
workflow:
  type: cdc
  layer: raw
  database_type: postgres
  source_schema: public
  tables_customization:
    message: {}
    session: {}
    state: {}
    message_flow: {}
    voice_call_attempt: {}
    voice_session: {}
