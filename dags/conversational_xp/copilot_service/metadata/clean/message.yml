---
database_name: datalake_copilot_service_clean
table_name: message
owner: lucas.cardozo@quintoandar.com.br
domain: Conversational XP
description: "One row per message sent or received within a Copilot service session, covering user, AI, and hardcoded bot messages across all channels (WhatsApp, in-app). Z-ordered by [ts_created, id_session] for efficient session-range queries."
columns:
  id:
    description: "Internal primary key for the Copilot service message record."
    lineage:
    - datalake_copilot_service_raw.message.id
  id_external:
    description: "The message identifier in the external system"
    lineage:
    - datalake_copilot_service_raw.message.external_id
  id_session:
    description: "FK to the Copilot session this message belongs to."
    lineage:
    - datalake_copilot_service_raw.message.session_id
  id_user:
    description: "Identifier of the user associated with the message"
    lineage:
    - datalake_copilot_service_raw.message.user_id
  message_index:
    description: "Sequential position of this message within the session conversation."
    lineage:
    - datalake_copilot_service_raw.message.message_index
  role:
    description: "The role of the message author (USER, AI, HARDCODED)"
    lineage:
    - datalake_copilot_service_raw.message.role
  channel:
    description: "The channel where the message was sent"
    lineage:
    - datalake_copilot_service_raw.message.channel
  input_type:
    description: "How the message was submitted."
    lineage:
    - datalake_copilot_service_raw.message.input_type
  content:
    description: "Text or structured body of the message sent or received by the user."
    lineage:
    - datalake_copilot_service_raw.message.content
  extra:
    description: "Extra data provided with the message"
    lineage:
    - datalake_copilot_service_raw.message.extra
  processing_status:
    description: "Current processing lifecycle status of the message."
    lineage:
    - datalake_copilot_service_raw.message.processing_status
  media_url:
    description: "URL of media content attached to the message"
    lineage:
    - datalake_copilot_service_raw.message.media_url
  media_type:
    description: "Type of media content attached to the message"
    lineage:
    - datalake_copilot_service_raw.message.media_type
  ts_created:
    description: "The message creation date"
    lineage:
    - datalake_copilot_service_raw.message.created_at