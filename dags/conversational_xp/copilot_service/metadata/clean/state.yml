---
database_name: datalake_copilot_service_clean
table_name: state
owner: lucas.cardozo@quintoandar.com.br
domain: Conversational XP
description: "This table stores chat states in the Copilot service"
columns:
  id:
    description: "Internal primary key for the chat state snapshot record."
    lineage:
    - datalake_copilot_service_raw.state.id
  id_session:
    description: "FK to the Copilot session this state snapshot belongs to."
    lineage:
    - datalake_copilot_service_raw.state.external_id
  id_message:
    description: "FK to the message that triggered this state transition."
    lineage:
    - datalake_copilot_service_raw.state.message_id
  state_version:
    description: "Version number of the state schema used to serialize this snapshot."
    lineage:
    - datalake_copilot_service_raw.state.state_version
  flow:
    description: "The chat flow associated with this state"
    lineage:
    - datalake_copilot_service_raw.state.flow
  state:
    description: "Serialized snapshot of the conversation state at this point in time."
    lineage:
    - datalake_copilot_service_raw.state.state
  ts_created:
    description: "The state creation date"
    lineage:
    - datalake_copilot_service_raw.state.created_at