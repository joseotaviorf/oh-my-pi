---
database_name: datalake_copilot_service_clean
table_name: session
owner: lucas.cardozo@quintoandar.com.br
domain: Conversational XP
description: "This table stores information about chat sessions in the Copilot service. Z-ordered by ts_created for efficient time-range filtering."
columns:
  id:
    description: "The message identifier"
    lineage:
    - datalake_copilot_service_raw.session.id
  id_external:
    description: "The message identifier in the external system"
    lineage:
    - datalake_copilot_service_raw.session.external_id
  id_sauron_session:
    description: "The session identifier in the external system"
    lineage:
    - datalake_copilot_service_raw.session.external_reference
  id_user:
    description: "Identifier of the user that started the session"
    lineage:
    - datalake_copilot_service_raw.session.user_id
  user_phone_number:
    description: "Phone number of the user associated with the session"
    lineage:
    - datalake_copilot_service_raw.session.user_phone_number
  chat_configuration:
    description: "JSON blob containing the chatbot configuration active at session start."
    lineage:
    - datalake_copilot_service_raw.session.chat_configuration
  ts_created:
    description: "The message creation date"
    lineage:
    - datalake_copilot_service_raw.session.created_at
  