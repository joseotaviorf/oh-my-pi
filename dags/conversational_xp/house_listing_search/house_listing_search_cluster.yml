cluster:
  type: emr_7_12_consolidation_m_memory_fleet_cluster
  custom_configurations:
    aws_attributes:
      availability: ON_DEMAND
    core_nodes:
      instance_types:
      - r6g.2xlarge
      - r7g.2xlarge
      - r6i.2xlarge
      target_on_demand: 2
      target_spot: 0
    spark_conf:
      spark.databricks.delta.optimize.maxThreads: '32'
      spark.dynamicAllocation.maxExecutors: '8'
      spark.executor.cores: '4'
      spark.sql.shuffle.partitions: '200'
    task_nodes:
      instance_types:
      - r6g.2xlarge
      - r7g.2xlarge
      - r6i.2xlarge
      target_on_demand: 0
      target_spot: 2
      allocation_strategy: price-capacity-optimized
      bid_price_percentage: 100
