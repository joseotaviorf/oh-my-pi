cluster:
  type: emr_7_12_consolidation_xl_memory_fleet_cluster
  custom_configurations:
    aws_attributes:
      # Residual disk spill + prior /mnt UNHEALTHY on load-raw-search (j-1MEHOZYKVJRZU).
      ebs_volume_size: 500
    # Cap concurrent Spark steps when the 8-table CDC fan-out runs (was 3 on m_memory).
    step_concurrency_level: 2
    # Job totals: ~1 TiB shuffle / 2.3 TiB mem spill on 4x24g — need ~8x96g heap.
    core_nodes:
      target_on_demand: 4
      target_spot: 0
      instance_types:
      - r6g.8xlarge
      - r7g.8xlarge
      - r6i.8xlarge
    spark_conf:
      # xl_memory preset: 96g/8g, 4 cores — do not override memory down.
      spark.dynamicAllocation.maxExecutors: '8'
      spark.sql.shuffle.partitions: '2048'
