dag:
  name: house_listing_search
  schedule_start_date: 2025, 05, 13
  schedule_interval: 0 1 * * *
  owner: Data Conversational XP
  documentation:
    dag_purpose: |
      This DAG is responsible for ingesting CDC generated data from the [house_listing_search](https://github.com/quintoandar/backend-services/tree/main/applications/house-listing-search) transactional database
workflow:
  type: cdc
  layer: raw
  database_type: postgres
  source_schema: public
  execution_timeout_hours: 3
  tables_customization:
    search: {}
    recommendation: {}
    recommendation_user_use_case: {}
    recommendation_use_case: {}
    search_profile: {}
    search_profile_filters: {}
    search_profile_description: {}

cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: r5a.4xlarge
    node_type_id: r5a.4xlarge
    spark_version: 12.2.x-scala2.12
    num_workers: 3
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
