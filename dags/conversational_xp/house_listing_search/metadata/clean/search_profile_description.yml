---
database_name: datalake_house_listing_search_clean
table_name: search_profile_description
owner: brandell.ferreira@quintoandar.com.br
domain: Conversational XP
description: "This table stores a human-readable or generated text description linked one-to-one to each search profile in the House Listing Search service"
columns:
  id:
    description: "Surrogate primary key for the search profile description row in the transactional database"
    lineage:
    - datalake_house_listing_search_raw.search_profile_description.id
  id_search_profile:
    description: "Foreign key to the parent search profile (matches search_profile.id in the source database)"
    lineage:
    - datalake_house_listing_search_raw.search_profile_description.search_profile_id
  profile_description:
    description: "Free-text description of the search profile as produced or stored by the service (may echo user-provided wording)"
    lineage:
    - datalake_house_listing_search_raw.search_profile_description.description
  ts_created:
    description: "Timestamp when the description row was first created in the source database"
    lineage:
    - datalake_house_listing_search_raw.search_profile_description.created_at
  ts_updated:
    description: "Timestamp when the description row was last updated in the source database"
    lineage:
    - datalake_house_listing_search_raw.search_profile_description.updated_at
