dag:
  name: conversation_explorer
  schedule_start_date: 2026, 5, 7
  catchup: false
  owner: Data Conversational XP
  documentation:
    dag_purpose: |
      Ingests the daily session categorisation parquet and human annotations produced by the
      Wall-E session categoriser model. Raw lands in datalake_conversation_explorer_raw,
      clean in datalake_conversation_explorer_clean.

      Categorisation source: s3://conversation-explorer-prod/session-metadata/YYYY-MM-DD.parquet
      Annotations source: s3://conversation-explorer-prod/annotations-index/YYYY-MM-DD/*.json
      (each index entry resolves to s3://conversation-explorer-prod/annotations/...)

      Scheduling: dataset-driven (no cron). Triggered after
      quintoml.chatbot.wall_e_session_categoriser.inference emits its :first-run-of-day dataset.
      Annotations run after categorisation completes (raw_inner_dependencies).

workflow:
  layer: raw
  type: custom_ingestion
  load_spark_job: load_conversation_explorer
  default_extraction_type: full
  default_partitions: [year, month, day]

  spark_job_arguments:
    - "{environment}"
    - "{bucket}"
    - "{schema}"
    - "{table_name}"
    - "{partitions}"
    - "{{ dag_run.conf.get('date') or get_date_param(dag_run, '', 'load_start_date') }}"

  raw_inner_dependencies:
    annotations:
      - categorisation

  tables_customization:
    categorisation:
      partitions:
        - year
        - month
        - day
    annotations:
      partitions:
        - year
        - month
        - day

