---
database_name: datalake_agentic_chatbot_service_clean
table_name: nudges
owner: william.angelo@quintoandar.com.br
domain: Conversational XP
description: "Per-user nudge/mission coordination state from agentic-chatbot-service. One row per nudge_id; tracks lifecycle (eligible → offered → active → snoozed/deactivated) and cached CDP mission payload for conversational surfaces."
columns:
  id_nudge:
    description: "Primary key for the nudge row (source nudge_id, UUID generated by the service)."
    lineage:
    - datalake_agentic_chatbot_service_raw.nudges.nudge_id
  id_user:
    description: "User identifier that owns the nudge. Missions are keyed to the person, not to a chatbot or property."
    lineage:
    - datalake_agentic_chatbot_service_raw.nudges.user_id
  nudge_type:
    description: "Application discriminator for the nudge family (currently `mission`). Part of the semantic identity tuple with nudge_key."
    lineage:
    - datalake_agentic_chatbot_service_raw.nudges.nudge_type
  nudge_key:
    description: "Catalog key for the nudge, copied from CDP mission.name. Part of the semantic identity tuple with nudge_type."
    lineage:
    - datalake_agentic_chatbot_service_raw.nudges.nudge_key
  id_external_nudge:
    description: "Nullable CDP mission_id (external UUID). At most one row per non-null value in the source DB."
    lineage:
    - datalake_agentic_chatbot_service_raw.nudges.external_nudge_id
  nudge_status:
    description: "Lifecycle status: eligible, offered, active, active_reminded, snoozed, or deactivated."
    lineage:
    - datalake_agentic_chatbot_service_raw.nudges.status
  external_payload:
    description: "Cached CDP mission payload (JSON) used to render prompts and mission context."
    lineage:
    - datalake_agentic_chatbot_service_raw.nudges.external_payload
  snapshot:
    description: "Optional JSON snapshot of mission state captured at a point in the lifecycle."
    lineage:
    - datalake_agentic_chatbot_service_raw.nudges.snapshot
  count_snooze:
    description: "Number of times the user has snoozed this nudge."
    lineage:
    - datalake_agentic_chatbot_service_raw.nudges.snooze_count
  ts_snooze_until:
    description: "When the snooze period ends; NULL when the nudge is not snoozed."
    lineage:
    - datalake_agentic_chatbot_service_raw.nudges.snooze_until
  ts_offered:
    description: "When the nudge was first offered to the user."
    lineage:
    - datalake_agentic_chatbot_service_raw.nudges.offered_at
  ts_activated:
    description: "When the nudge became active (user accepted or started the mission)."
    lineage:
    - datalake_agentic_chatbot_service_raw.nudges.activated_at
  termination_reason:
    description: "Reason the nudge was deactivated, when applicable."
    lineage:
    - datalake_agentic_chatbot_service_raw.nudges.termination_reason
  ts_external_updated:
    description: "Last update timestamp from the external CDP mission source."
    lineage:
    - datalake_agentic_chatbot_service_raw.nudges.external_updated_at
  ts_created:
    description: "When the nudge row was created in the operational database."
    lineage:
    - datalake_agentic_chatbot_service_raw.nudges.created_at
  ts_updated:
    description: "When the nudge row was last updated in the operational database."
    lineage:
    - datalake_agentic_chatbot_service_raw.nudges.updated_at
