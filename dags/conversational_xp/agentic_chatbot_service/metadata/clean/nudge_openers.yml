---
database_name: datalake_agentic_chatbot_service_clean
table_name: nudge_openers
owner: william.angelo@quintoandar.com.br
domain: Conversational XP
description: "Pre-generated conversational opener per user from agentic-chatbot-service. One row per user; hard-linked to the nudge it was built from and overwritten on each regeneration."
columns:
  id_user:
    description: "User identifier. Primary key — one opener row per user, overwritten on regeneration."
    lineage:
    - datalake_agentic_chatbot_service_raw.nudge_openers.user_id
  id_nudge:
    description: "Foreign key to the nudge row this opener was generated from. CASCADE-deleted when the nudge is removed."
    lineage:
    - datalake_agentic_chatbot_service_raw.nudge_openers.nudge_id
  opener_text:
    description: "Plain-text opener shown to the user when the nudge is surfaced in conversation."
    lineage:
    - datalake_agentic_chatbot_service_raw.nudge_openers.text
  opener_metadata:
    description: "Optional JSON metadata for rich-content rendering (e.g. template_component_name)."
    lineage:
    - datalake_agentic_chatbot_service_raw.nudge_openers.metadata
  ts_generated:
    description: "When the opener was generated, stamped before the generation run (not after) for freshness checks."
    lineage:
    - datalake_agentic_chatbot_service_raw.nudge_openers.generated_at
