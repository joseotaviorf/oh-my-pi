database_name: datalake_search
table_name: metric_search_listing_page_viewed
owner: joseph.magiya@quintoandar.com.br
domain: Conversational XP
description: "One row per Amplitude listing_page_viewed event enriched with search context (id_search when the LPV originated from search results) and property/user geographic dimensions. Used to calculate search listing-page-viewed (LPV) health metrics. Partitioned by year/month/day (server processing time, which may differ from ts_event)."
columns:
  id_house:
    lineage:
    - datalake_amplitude_clean.170698_listing_page_viewed_events.event_properties
    description: ID of the house (property).
  id_user:
    lineage:
    - datalake_amplitude_clean.170698_listing_page_viewed_events.id_user
    description: QuintoAndar user ID of the user who triggered the listing page viewed event. This is the QuintoAndar user identifier, not the Amplitude ID (Amplitude's own unique identifier).
  id_search:
    lineage:
    - datalake_amplitude_clean.170698_listing_page_viewed_events.event_properties
    description: Unique identifier of the search session that led the user to the listing page, extracted from Amplitude event properties.
  business_context:
    lineage:
    - datalake_amplitude_clean.170698_listing_page_viewed_events.event_properties
    description: Business context, can be SALE or RENT.
  platform:
    lineage:
    - datalake_amplitude_clean.170698_listing_page_viewed_events.up_platform
    description: Platform from which the user is accessing.
  platform_grouped:
    lineage:
    - datalake_amplitude_clean.170698_listing_page_viewed_events.up_platform
    description: Platform from which the user is accessing. Grouped into "app" and "web".
  device_type:
    lineage:
    - datalake_amplitude_clean.170698_listing_page_viewed_events.up_platform
    description: Device type from which the user is accessing. Grouped into "mobile" and "desktop".
  user_city:
    lineage:
    - datalake_amplitude_clean.170698_listing_page_viewed_events.city
    description: City of the user obtained from Amplitude tracking data.
  user_region:
    lineage:
    - datalake_amplitude_clean.170698_listing_page_viewed_events.region
    description: Region of the user obtained from Amplitude tracking data.
  user_country:
    lineage:
    - datalake_amplitude_clean.170698_listing_page_viewed_events.country
    description: Country of the user obtained from Amplitude tracking data.
  house_city:
    lineage:
    - datalake_amplitude_clean.170698_listing_page_viewed_events.event_properties
    description: City where the viewed property is located, used to analyze listing page views by geographic market.
  house_macro_region:
    lineage:
    - datalake_amplitude_clean.170698_listing_page_viewed_events.event_properties
    description: Macro region of the property.
  house_state:
    lineage:
    - datalake_amplitude_clean.170698_listing_page_viewed_events.event_properties
    description: Brazilian state (UF) where the viewed property is located, used for regional breakdowns of listing page view metrics.
  house_country:
    lineage:
    - datalake_amplitude_clean.170698_listing_page_viewed_events.event_properties
    description: Country of the property.
  lpv_from_route:
    lineage:
    - datalake_amplitude_clean.170698_listing_page_viewed_events.event_properties
    description: Which page (route) the user were before visiting the current listing. LPV = listing page viewed.
  rent_total_value:
    lineage:
    - datalake_amplitude_clean.170698_listing_page_viewed_events.event_properties
    description: Total value of the rent which is the sum of base rent, condominium value and other applicable fees.
  sale_value:
    lineage:
    - datalake_amplitude_clean.170698_listing_page_viewed_events.event_properties
    description: Asking sale price in BRL of the property at the time of the listing page viewed event, extracted from Amplitude event properties.
  ts_event:
    lineage:
    - datalake_amplitude_clean.170698_listing_page_viewed_events.ts_event
    description: Timestamp of the LPV event (UTC timezone).
  dt_event:
    lineage:
    - datalake_amplitude_clean.170698_listing_page_viewed_events.ts_event
    description: Date of the LPV event (UTC timezone).
  ts_event_week:
    lineage:
    - datalake_amplitude_clean.170698_listing_page_viewed_events.ts_event
    description: Week of the LPV event (UTC timezone).
  ts_event_month:
    lineage:
    - datalake_amplitude_clean.170698_listing_page_viewed_events.ts_event
    description: Month of the LPV event (UTC timezone).
  ts_event_quarter:
    lineage:
    - datalake_amplitude_clean.170698_listing_page_viewed_events.ts_event
    description: Quarter of the LPV event (UTC timezone).
  year:
    lineage:
    - datalake_amplitude_clean.170698_listing_page_viewed_events.year
    description: Partition column. Year when the LPV event was processed on the server. Always filter on year/month/day for partition pruning; may differ from ts_event.
  month:
    lineage:
    - datalake_amplitude_clean.170698_listing_page_viewed_events.month
    description: Partition column. Month when the LPV event was processed on the server. Always filter on year/month/day for partition pruning; may differ from ts_event.
  day:
    lineage:
    - datalake_amplitude_clean.170698_listing_page_viewed_events.day
    description: Partition column. Day when the LPV event was processed on the server. Always filter on year/month/day for partition pruning; may differ from ts_event.
