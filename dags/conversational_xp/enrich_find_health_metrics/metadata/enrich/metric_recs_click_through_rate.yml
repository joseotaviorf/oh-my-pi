database_name: datalake_search
table_name: metric_recs_click_through_rate
owner: yiyi.ji@quintoandar.com
domain: Conversational XP
description: "One row per house impression within a recommendation carousel (recset) shown to a user in a single session. Combines recset exposure data with click signals to power recommendation click-through rate (CTR) health metrics. Partitioned by year/month/day (server processing time, which may differ from the event timestamp — use ts_recommendation_event for event-level analysis)."
columns:
  id_recset_fix:
    lineage:
    - datalake_search.recs_impressions_processed.recset_id_fix
    description: A concatenation of recset_id + id_user + id_session (session of amplitude) to identify a unique recommendation set (carousel) per user and session. This concatenation is needed as a recset can be same for different users and repeat between sessions for a same user.
  id_house:
    lineage:
    - datalake_search.recs_impressions_processed.id_house
    description: ID of the house (property).
  business_context:
    lineage:
    - datalake_search.recs_impressions_processed.business_context
    description: The business context of the house. Can be SALE or RENT.
  house_city:
    lineage:
    - datalake_search.recs_impressions_processed.house_city
    description: City where the property is located, used to filter recommendation health metrics by geography.
  platform:
    lineage:
    - datalake_search.recs_impressions_processed.platform
    description: Platform from which the user is accessing. Can be WEB or APP.
  country:
    lineage:
    - datalake_search.recs_impressions_processed.country
    description: Amplitude user country on the recset impression (for example BR). Filter to BR to reproduce the previous Brazil-only recs CTR grain.
  listing_position_in_recset:
    lineage:
    - datalake_search.recs_impressions_processed.listing_position_in_recset
    description: The position of the house in the recommendation set (carousel).
  showcase:
    lineage:
    - datalake_search.recs_impressions_processed.showcase
    description: Showcase of the recommendation set, e.g., "LISTING_SIMILAR_USER", "LISTING_SIMILAR_NEARBY" "FEED_RECENTLY_VIEWED_SIMILAR"
  origin:
    lineage:
    - datalake_search.recs_impressions_processed.origin
    description: Chatbot the recommendation carousel was generated for, taken from dimensions.origin (for example Julia/Mora/Bianca).
  listing_age:
    lineage:
    - datalake_search.recs_impressions_processed.listing_age
    description: The age of the house in days from when it was published to the time of the recommendation event.
  listing_clicked:
    lineage:
    - datalake_search.recs_impressions_processed.listing_clicked
    description: Whether the house listing was clicked.
  ts_recommendation_event:
    lineage:
    - datalake_search.recs_impressions_processed.ts_recommendation_event
    description: The timestamp of the recommendation event.
  year:
    lineage:
    - datalake_search.recs_impressions_processed.year
    description: Partition column. Year when the recommendation event was processed on the server. Always filter on year/month/day for partition pruning; may differ from ts_recommendation_event.
  month:
    lineage:
    - datalake_search.recs_impressions_processed.month
    description: Partition column. Month when the recommendation event was processed on the server. Always filter on year/month/day for partition pruning; may differ from ts_recommendation_event.
  day:
    lineage:
    - datalake_search.recs_impressions_processed.day
    description: Partition column. Day when the recommendation event was processed on the server. Always filter on year/month/day for partition pruning; may differ from ts_recommendation_event.