database_name: datalake_search
table_name: metric_search_click_through_rate
owner: joseph.magiya@quintoandar.com.br
domain: Conversational XP
description: "One row per house impression within a search result page shown to a user. Combines search exposure data with click signals to power search click-through rate (CTR) health metrics. Partitioned by year/month/day (server processing time, which may differ from ts_search_event — use ts_search_event for event-level analysis)."
columns:
  id_search:
    lineage:
    - datalake_search.search_impressions.id_search
    description: Unique identifier of the search session that produced the listing impression, used to join with search_impressions and attribute clicks to a specific search.
  id_house:
    lineage:
    - datalake_search.search_impressions.id_house
    description: ID of the house (property).
  business_context:
    lineage:
    - datalake_search.search_impressions.business_context
    description: The business context of the house. Can be SALE or RENT.
  house_city:
    lineage:
    - datalake_search.search_impressions.house_city
    description: City where the listed property is located, used to slice search click-through rate metrics by geographic market.
  platform:
    lineage:
    - datalake_search.search_impressions.platform
    description: Platform from which the user is accessing. Can be WEB or APP.
  absolute_position:
    lineage:
    - datalake_search.search_impressions.absolute_position
    description: The absolute position of the house in the search results.
  listing_age:
    lineage:
    - datalake_search.search_impressions.listing_age
    description: The age of the house in days from when it was published to the time of the search event.
  listing_clicked:
    lineage:
    - datalake_search.search_impressions.listing_clicked
    description: Whether the house listing was clicked.
  ts_search_event:
    lineage:
    - datalake_search.search_impressions.ts_search_event
    description: The timestamp of the search event.
  year:
    lineage:
    - datalake_search.search_impressions.year
    description: Partition column. Year when the search event was processed on the server. Always filter on year/month/day for partition pruning; may differ from ts_search_event.
  month:
    lineage:
    - datalake_search.search_impressions.month
    description: Partition column. Month when the search event was processed on the server. Always filter on year/month/day for partition pruning; may differ from ts_search_event.
  day:
    lineage:
    - datalake_search.search_impressions.day
    description: Partition column. Day when the search event was processed on the server. Always filter on year/month/day for partition pruning; may differ from ts_search_event.