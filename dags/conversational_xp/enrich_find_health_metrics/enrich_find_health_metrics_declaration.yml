dag:
  name: enrich_find_health_metrics
  schedule_start_date: 2025, 10, 17
  owner: Data Conversational XP

workflow:
  custom_schema: search
  layer: enrich
  type: query_delta
  default_extraction_type: incremental
  extra_query_template_params:
    "days_past_7": 7
    "days_past_14": 14
    "days_past_21": 21
    "days_past_30": 30
    "days_past_45": 45
    "days_past_120": 120
    "start_date": "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    "end_date": "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  inner_dependencies:
    metric_search_vs_available_distribution:
      - metric_search_impression_base
    metric_search_exposure_concentration_weekly:
      - metric_search_impression_base
    metric_search_intra_user_repetition_weekly:
      - metric_search_impression_base
  tables_customization:
    metric_recs_listing_page_viewed:
      partitions: [year, month, day]
    metric_recs_conversion:
      merge_on: [id_unique]
      partitions: [year, month, day]
    metric_recs_click_through_rate:
      partitions: [year, month, day]
    metric_search_listing_page_viewed:
      partitions: [year, month, day]
    metric_search_conversion:
      merge_on: [id_unique]
      partitions: [year, month, day]
    metric_search_impression_base:
      partitions: [year, month, day]
    metric_search_vs_available_distribution:
      partitions: [year, month, day]
    metric_search_exposure_concentration_weekly:
      partitions: [year, month, day]
    metric_search_intra_user_repetition_weekly:
      partitions: [year, month, day]
    metric_sale_bp_cohort_funnel:
      merge_on: [
        dt_snapshot,
        cohort_window_weeks,
        cohort_type,
        dt_cohort_start,
        operation_channel
        ]
      partitions: [
        year,
        month,
        day
        ]

