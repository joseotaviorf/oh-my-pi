dag:
  name: enrich_find_health_metrics
  schedule_start_date: 2025, 10, 17
  owner: Data Conversational XP

workflow:
  custom_schema: search
  layer: enrich
  type: query_delta
  default_extraction_type: incremental
  extra_query_template_params:
    "days_past_7": 7
    "days_past_14": 14
    "days_past_21": 21
    "days_past_30": 30
    "start_date": "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    "end_date": "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  tables_customization:
    metric_recs_listing_page_viewed:
      partitions: [year, month, day]
    metric_recs_conversion: 
      partitions: [year, month, day]
    metric_recs_click_through_rate:
      partitions: [year, month, day]

cluster:
    type: databricks_16_4_med_general_2_workers_cluster
    access_control_list:
      group_name: data-products
      permission_level: CAN_MANAGE
