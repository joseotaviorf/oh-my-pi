---
database_name: datalake_search
table_name: concierge_tof_intent_events
owner: akira@quintoandar.com.br
domain: Conversational XP
description: |
  Incremental event-level favorite and schedule-page cut for concierge
  top-of-funnel targeting. The table has one row per intent event and refreshes
  the current and previous event dates hourly. Retains a rolling 90 days of
  event dates; older event dates are dropped.
columns:
  id_event:
    description: Unique identifier of the favorite or schedule-page event.
    lineage:
      - datalake_cdp_clean.user_tracking.id_event
  id_user:
    description: Application user identifier associated with the intent event.
    lineage:
      - datalake_cdp_clean.user_tracking.id_user
  id_person:
    description: Person identifier carried by the intent event when available.
    lineage:
      - datalake_cdp_clean.user_tracking.id_person
  id_device:
    description: Anonymous device identifier carried by the intent event when available.
    lineage:
      - datalake_cdp_clean.user_tracking.id_anonymous
  id_house:
    description: House identifier extracted from the intent event payload.
    lineage:
      - datalake_cdp_clean.user_tracking.event_properties
  event_name:
    description: Intent event type, either listing favorite or schedule page view.
    lineage:
      - datalake_cdp_clean.user_tracking.event_name
  dt_event:
    description: Calendar date on which the intent event occurred.
    lineage:
      - datalake_cdp_clean.user_tracking.ts_event
  ts_event:
    description: Timestamp when the intent event occurred.
    lineage:
      - datalake_cdp_clean.user_tracking.ts_event
  ts_load:
    description: Timestamp when the intent event row was refreshed.
  year:
    description: Intent event year partition.
    lineage:
      - datalake_cdp_clean.user_tracking.ts_event
  month:
    description: Intent event month partition.
    lineage:
      - datalake_cdp_clean.user_tracking.ts_event
  day:
    description: Intent event day partition.
    lineage:
      - datalake_cdp_clean.user_tracking.ts_event
