dag:
  name: demand_balancer_service
  schedule_start_date: 2022, 1, 1
  owner: Data Conversational XP

workflow:
  layer: raw
  type: custom_ingestion
  load_spark_job: load_parquet_batch_inference_into_datalake
  default_partitions: [year, month, day, model_version]

  spark_job_arguments:
    - "{environment}"
    - "{bucket}"
    - "{dag_name}"
    - s3://data-science.s3.data.quintoandar.com.br/maestro/data/
    - "{{ macros.ds_add(data_interval_start | ds, 1) }}" # this refers to the next day. This only makes sense when the DAG runs daily.
    - "{table_name}"
    - "{partitions}"
    - parquet

  default_extraction_type: incremental

  tables_customization:
    demand_balancer:
      partitions:
        - year
        - month
        - day
        - model_version

