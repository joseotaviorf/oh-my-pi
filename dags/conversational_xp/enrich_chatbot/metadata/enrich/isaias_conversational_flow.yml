---
database_name: datalake_chatbot
table_name: isaias_conversational_flow
owner: alexandre.gimenez@quintoandar.com.br
domain: Conversational XP
description: "Success and disqualification signals for the Isaias conversational flow per Langfuse session."
columns:
  id_langfuse_session:
    description: "Langfuse session identifier."
    lineage:
      - datalake_langfuse_clean.traces.id_session
  has_user_name_success:
    description: "True when the user name qualification step succeeds with a captured first name."
    lineage:
      - datalake_langfuse_clean.observations.name
      - datalake_langfuse_clean.observations.output
  has_property_address_success:
    description: "True when the property address clarification step succeeds."
    lineage:
      - datalake_langfuse_clean.observations.name
      - datalake_langfuse_clean.observations.output
  has_property_address_confirmation_success:
    description: "True when property address confirmation indicates coverage is available."
    lineage:
      - datalake_langfuse_clean.observations.name
      - datalake_langfuse_clean.observations.output
  has_property_address_confirmation_disqualification:
    description: "True when property address confirmation disqualifies the conversation."
    lineage:
      - datalake_langfuse_clean.observations.name
  has_property_type_disqualification:
    description: "True when the property type step disqualifies the conversation."
    lineage:
      - datalake_langfuse_clean.observations.name
  has_property_type_success:
    description: "True when the property type clarification step succeeds."
    lineage:
      - datalake_langfuse_clean.observations.name
  has_property_availability_disqualification:
    description: "True when the property availability step disqualifies the conversation."
    lineage:
      - datalake_langfuse_clean.observations.name
  has_property_availability_success:
    description: "True when the property availability clarification step succeeds."
    lineage:
      - datalake_langfuse_clean.observations.name
      - datalake_langfuse_clean.observations.output
  has_retrieved_lead:
    description: "True when the flow retrieves a lead identifier during prospect retrieval."
    lineage:
      - datalake_langfuse_clean.observations.name
      - datalake_langfuse_clean.observations.input
  id_lead_retrieved:
    description: "Lead identifier retrieved from the conversation flow when available."
    lineage:
      - datalake_langfuse_clean.observations.input