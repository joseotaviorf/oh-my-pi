---
database_name: datalake_chatbot
table_name: bypass
owner: william.angelo@quintoandar.com.br
domain: Conversational XP
description: "Pre-bot action bypasses extracted from Langfuse session traces, one row per session-bypass combination. Includes inside sales bypasses detected from observations. Z-ordered by id_langfuse_session for efficient session-level lookups."
columns:
  id_langfuse_session:
    description: "Langfuse session identifier"
    lineage:
      - datalake_langfuse_clean.traces.id_session
      - datalake_langfuse_clean.observations.id_trace
  bypass:
    description: "Pre-bot action bypass title, or 'inside_sales_bypass' for sessions routed by the inside sales agent"
    lineage:
      - datalake_langfuse_clean.traces.input
  type:
    description: "Pre-bot action bypass type (e.g. TICKET, LINK, BYPASS)"
    lineage:
      - datalake_langfuse_clean.traces.input
  id_ticket:
    description: "Ticket ID associated with the bypass action, if any"
    lineage:
      - datalake_langfuse_clean.traces.input
  queue:
    description: "Department queue associated with the bypass action, if any"
    lineage:
      - datalake_langfuse_clean.traces.input
  ts_created:
    description: "Timestamp when the Langfuse trace session was created"
    lineage:
      - datalake_langfuse_clean.traces.ts_created
