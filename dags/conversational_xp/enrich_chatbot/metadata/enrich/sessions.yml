---
database_name: datalake_chatbot
table_name: sessions
owner: william.angelo@quintoandar.com.br
domain: Conversational XP
description: Table containing session data for all chatbot hosts.
columns:
  id_session:
    description: 'Copilot Service session ID. NULL for old bot (Greenseer) sessions'
    lineage:
    - datalake_copilot_service_clean.session.id
  id_sauron_session:
    description: 'Sauron session ID'
    lineage:
    - datalake_greenseer_clean.session.id_session
    - datalake_sauron_clean.session.id
  id_langfuse_session:
    description: 'Langfuse session ID (external session ID in Copilot). NULL for old bot (Greenseer) sessions'
    lineage:
    - datalake_copilot_service_clean.session.id_external
  id_ticket:
    description: 'Latest support ticket ID'
    lineage:
    - datalake_customer_support.tickets.id_ticket
  id_user:
    description: 'User ID for the session'
    lineage:
    - datalake_copilot_service_clean.session.id_user
    - datalake_sauron_clean.session.user_data
  user_phone_number:
    description: 'User phone number associated with the session'
    lineage:
    - datalake_copilot_service_clean.session.user_phone_number
    - datalake_sauron_clean.session.user_phone
    - datalake_sauron_clean.session.user_data
  bot:
    description: 'Bot persona handling the session'
    categories:
      sonia: 'Sonia'
      wall-e: 'Wall-E'
      isaias: 'Isaias'
      matthew: 'Matthew'
      concierge: 'Concierge'
      copilot: 'Copilot'
      old bot: 'Old bot (Greenseer)'
      unknown: 'Unknown host'
    lineage:
    - datalake_copilot_service_clean.message.channel
  channel:
    description: 'Communication channel for the session'
    categories:
      whatsapp: 'WhatsApp'
      in app: 'In-app chat'
      unknown: 'Unknown channel'
    lineage:
    - datalake_sauron_clean.session.source
  whatsapp_number:
    description: 'WhatsApp number type (main or other)'
    categories:
      main number: 'Main WhatsApp number'
      others: 'Other numbers'
    lineage:
    - datalake_sauron_clean.session.source
    - datalake_sauron_clean.session.source_environment
  status:
    description: 'Session status from Sauron'
    lineage:
    - datalake_sauron_clean.session.status
  first_queue:
    description: 'First support queue (department)'
    lineage:
    - datalake_langfuse_clean.observations.input
    - datalake_customer_support.tickets.first_queue
    - datalake_sauron_clean.session.department
  last_queue:
    description: 'Last support queue'
    lineage:
    - datalake_customer_support.tickets.last_queue
  is_escalated:
    description: 'True if escalated to support'
    lineage:
    - datalake_customer_support.tickets.id_ticket
  ts_created:
    description: 'Session creation timestamp'
    lineage:
    - datalake_copilot_service_clean.session.ts_created
    - datalake_sauron_clean.session.ts_created
  ts_updated:
    description: 'Session last updated timestamp'
    lineage:
    - datalake_sauron_clean.session.ts_updated
