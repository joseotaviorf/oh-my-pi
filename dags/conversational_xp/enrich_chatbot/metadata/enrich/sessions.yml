---
database_name: datalake_chatbot
table_name: sessions
owner: william.angelo@quintoandar.com.br
domain: Conversational XP
description: "One row per chatbot session across all hosts (Copilot Service, Sauron/SSS legacy, Greenseer). Joins Copilot session IDs, Sauron numeric IDs, SSS public IDs, and Langfuse session IDs into a unified session entity. Z-ordered by [ts_created, id_session, id_sauron_session, id_task, id_ticket] for efficient session-range lookups."
columns:
  id_session:
    description: 'Copilot Service session ID. NULL for old bot (Greenseer) sessions'
    lineage:
    - datalake_copilot_service_clean.session.id
  id_sauron_session:
    description: 'Numeric identifier of the legacy Sauron session linked to this chatbot session. Sauron was the CS routing service handling WhatsApp and in-app chats before Copilot Service; NULL for sessions with no corresponding Sauron record (Copilot-only or SSS-backed sessions).'
    lineage:
    - datalake_sauron_clean.session.id
  id_langfuse_session:
    description: 'Langfuse session ID (external_id in Copilot raw layer). NULL when session has no Langfuse trace'
    lineage:
    - datalake_copilot_service_clean.session.id_external
  id_sss_session:
    description: 'Support Session Service (SSS) public_id. Populated when id_sauron_session contains a UUID v7 (SSS-backed sessions)'
    lineage:
    - datalake_copilot_service_clean.session.id_sauron_session
  id_task:
    description: 'Latest Twilio task ID from the associated chat'
    lineage:
    - datalake_customer_support.chats.id_task
  id_ticket:
    description: 'Zendesk ticket ID linked to the escalated chat, kept for backwards compatibility'
    lineage:
    - datalake_customer_support.tickets.id_ticket
  id_user:
    description: 'QuintoAndar internal user identifier (EBDB id_user) of the person who initiated this chatbot session. Sourced from Copilot Service session data or derived from the linked Sauron session; NULL when the session cannot be attributed to an authenticated user.'
    lineage:
    - datalake_copilot_service_clean.session.id_user
    - datalake_sauron_clean.session.user_data
  user_phone_number:
    description: 'User phone number associated with the session'
    lineage:
    - datalake_support_session_service_clean.support_session.user_phone
    - datalake_support_session_service_clean.support_session.user_data
    - datalake_sauron_clean.session.user_phone
    - datalake_copilot_service_clean.session.user_phone_number
    - datalake_sauron_clean.session.user_data
  bot:
    description: 'Bot persona handling the session'
    categories:
      sonia: 'Sonia'
      wall-e: 'Wall-E'
      isaias: 'Isaias'
      matthew: 'Matthew'
      concierge: 'Concierge'
      copilot: 'Copilot'
      old bot: 'Old bot (Greenseer)'
      vandinha: 'Vandinha'
      dominic: 'Dominic'
      unknown: 'Unknown host'
    lineage:
    - datalake_copilot_service_clean.message.channel
  channel:
    description: 'Communication channel for the session'
    categories:
      whatsapp: 'WhatsApp'
      in app: 'In-app chat'
      unknown: 'Unknown channel'
    lineage:
    - datalake_sauron_clean.session.source
  whatsapp_number:
    description: 'WhatsApp number type (main or other)'
    categories:
      main number: 'Main WhatsApp number'
      others: 'Other numbers'
    lineage:
    - datalake_sauron_clean.session.source
    - datalake_sauron_clean.session.source_environment
  status:
    description: 'Session status (SSS if available, otherwise Sauron)'
    lineage:
    - datalake_support_session_service_clean.support_session.status
    - datalake_sauron_clean.session.status
  version:
    description: 'Langfuse version for the session'
    lineage:
    - datalake_langfuse_clean.traces.version
  first_queue:
    description: 'First support queue (department)'
    lineage:
    - datalake_langfuse_clean.observations.input
  last_queue:
    description: 'Last support queue from the associated chat'
    lineage:
    - datalake_customer_support.chats.queue_name
  is_escalated:
    description: 'True if escalated to a human support agent via chat'
    lineage:
    - datalake_customer_support.chats.id_task
  ts_created:
    description: 'Session creation timestamp'
    lineage:
    - datalake_copilot_service_clean.session.ts_created
    - datalake_sauron_clean.session.ts_created
  ts_updated:
    description: 'Session last updated timestamp (SSS if available, otherwise Sauron)'
    lineage:
    - datalake_support_session_service_clean.support_session.ts_updated
    - datalake_sauron_clean.session.ts_updated
