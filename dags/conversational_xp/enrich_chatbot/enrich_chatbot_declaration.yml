dag:
  name: enrich_chatbot
  schedule_start_date: 2025, 5, 12
  owner: Data Conversational XP
  documentation:
    dag_purpose: |
      Support sessions and relevant chatbot data
workflow:
  type: query_delta
  layer: enrich
  tables_customization:
    sessions:
      merge_on: [id_session]
      z_order_by: [ts_created, id_session, id_sauron_session, id_task, id_ticket]
    messages:
      merge_on: [id_message]
      z_order_by: [ts_created]
    evals:
      merge_on: [id_langfuse_session]
      z_order_by: [id_langfuse_session]
    isaias_conversational_flow:
      merge_on: [id_langfuse_session]
      z_order_by: [id_langfuse_session]
    bypass:
      merge_on: [id_langfuse_session, bypass]
      z_order_by: [id_langfuse_session]
  inner_dependencies:
    evals:
      - sessions

cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: r7a.2xlarge
    node_type_id: r7a.4xlarge
    num_workers: 6
    spark_version: 16.4.x-scala2.12
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
      spark.sql.mapKeyDedupPolicy: LAST_WIN
  databricks_conn_id: databricks_new_env
