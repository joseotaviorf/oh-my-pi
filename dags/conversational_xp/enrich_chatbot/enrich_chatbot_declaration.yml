dag:
  name: enrich_chatbot
  schedule_start_date: 2025, 5, 12
  owner: Data Conversational XP
  criticality: High
  sla_deadline_localtime: "08:00"
  documentation:
    dag_purpose: |
      Support sessions and relevant chatbot data
workflow:
  type: query_delta
  layer: enrich
  tables_customization:
    sessions:
      merge_on: [id_session]
      z_order_by: [ts_created, id_session, id_sauron_session, id_task, id_ticket]
    messages:
      merge_on: [id_message]
      z_order_by: [ts_created]
    evals:
      merge_on: [id_langfuse_session]
      z_order_by: [id_langfuse_session]
    isaias_conversational_flow:
      merge_on: [id_langfuse_session]
      z_order_by: [id_langfuse_session]
    bypass:
      merge_on: [id_langfuse_session, bypass]
      z_order_by: [id_langfuse_session]
  inner_dependencies:
    evals:
      - sessions
