dag:
  name: batch_inference
  schedule_start_date: 2023, 4, 3
  schedule_interval: 30 0 * * *
  owner: MLOps
  documentation:
    dag_purpose: Loads batch inference data into our Data Lake.

workflow:
  layer: raw
  type: custom_ingestion
  load_spark_job: load_parquet_into_datalake
  spark_job_arguments:
    - "{environment}"
    - "{bucket}"
    - "{schema}"
    - "{{ data_interval_start | ds }}"
  has_hive_sync: false
  execution_timeout_hours: 5
  default_extraction_type: incremental
  tables_customization:
    batch_inference:
      clean_partitions:
        - year
        - month
        - day
        - model_name
        - model_version

