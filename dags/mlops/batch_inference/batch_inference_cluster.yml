cluster:
  type: consolidation_xl_general_cluster
  access_control_list:
    group_name: mlops
    permission_level: CAN_MANAGE
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
    num_workers: 4
    driver_node_type_id: m7g.4xlarge
validation:
  cluster:
    type: consolidation_s_memory_cluster
    databricks_conn_id: databricks_new
    access_control_list:
      group_name: mlops
      permission_level: CAN_MANAGE
    custom_configurations:
      num_workers: 3
      driver_node_type_id: r7g.2xlarge
  allow_custom_spark_job: true
