dag:
  name: emlio
  schedule_start_date: 2023, 4, 3
  schedule_interval: 30 0 * * *
  owner: MLOps
  documentation:
    dag_purpose: Responsible for loading machine learning models inputs and associated outputs into our Data Lake.

workflow:
  layer: raw
  type: custom_ingestion
  load_spark_job: load_emlio_raw
  spark_job_arguments:
    - "{environment}"
    - "{bucket}"
    - "{schema}"
    - "{partitions}"
    - "{{ data_interval_start | ds }}"
  execution_timeout_hours: 5
  default_extraction_type: incremental
  tables_customization:
    emlio_logs:
      raw_partitions:
        - year
        - month
        - day
      clean_partitions:
        - id_service
        - year
        - month
        - day

