---
database_name: datalake_emlio_clean
table_name: emlio_logs
owner: lucas.cardozo@quintoandar.com.br
domain: MLOps
description: |
  Logs of inputs and outputs from Machine Learning models ingested via EMLIO.
  Clean layer partitioned by id_service, year, month, and day — always filter
  on these columns for partition pruning.
columns:
  uuid:
    lineage:
      - datalake_emlio_raw.emlio_logs.uuid
    description: 'Unique identifier for the log record'
  id_service:
    lineage:
      - datalake_emlio_raw.emlio_logs.service_id
    description: 'AI service unique identifier (e.g., model name, LLM provider)'
  service_version:
    lineage:
      - datalake_emlio_raw.emlio_logs.service_version
    description: 'Version of the AI service'
  inference_type:
    lineage:
      - datalake_emlio_raw.emlio_logs.inference_type
    description: 'ML model inference type (ONLINE or BATCH)'
  service_type:
    lineage:
      - datalake_emlio_raw.emlio_logs.service_type
    description: 'Type of the AI service (MODEL or SERVICE)'
  ts_log:
    lineage:
      - datalake_emlio_raw.emlio_logs.log_timestamp
    description: 'Timestamp of the log record'
  inputs:
    lineage:
      - datalake_emlio_raw.emlio_logs.inputs
    description: 'Inputs of the AI service'
  outputs:
    lineage:
      - datalake_emlio_raw.emlio_logs.outputs
    description: 'Outputs of the AI service'
  service_keys:
    lineage:
      - datalake_emlio_raw.emlio_logs.keys
    description: 'Identifiers of the logged data'
  deployment_info:
    lineage:
      - datalake_emlio_raw.emlio_logs.deployment_info
    description: 'Deployment information of the AI service'
  year:
    lineage:
      - datalake_emlio_raw.emlio_logs.year
    description: 'Year of the log record'
  month:
    lineage:
      - datalake_emlio_raw.emlio_logs.month
    description: 'Month of the log record'
  day:
    lineage:
      - datalake_emlio_raw.emlio_logs.day
    description: 'Day of the log record'