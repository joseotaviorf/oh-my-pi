---
database_name: datalake_evidently_ml_monitor_clean
table_name: evidently_ml_monitor
description: Evidently ML monitoring reports exploded to one row per (run_id, suite_name, metric_id). Each row carries the full per-metric Evidently result JSON with Plotly widgets removed, preserving any field Evidently emits without schema lock-in.
domain: MLOps
owner: marco.vinha@quintoandar.com.br
columns:
  run_id:
    lineage:
      - datalake_evidently_ml_monitor_raw.evidently_ml_monitor.run_id
    description: Unique identifier for the monitoring pipeline run that produced the report.
  job_name:
    lineage:
      - datalake_evidently_ml_monitor_raw.evidently_ml_monitor.job_name
    description: Monitoring job name parsed from the source S3 path for the Evidently pipeline run.
  suite_name:
    lineage:
      - datalake_evidently_ml_monitor_raw.evidently_ml_monitor.metric_name
    description: Normalized Evidently monitoring suite name. One suite contains many metric_ids (one per feature plus suite-level checks).
  metric_id:
    lineage:
      - datalake_evidently_ml_monitor_raw.evidently_ml_monitor.json_data
    description: Stable identifier (hex hash) of the individual metric result emitted by Evidently within a suite. Key of the metric_results object in the Evidently snapshot payload.
  model_uri:
    lineage:
      - datalake_evidently_ml_monitor_raw.evidently_ml_monitor.model_uri
    description: MLflow model URI of the monitored model (registry path and version).
  model_registry_path:
    lineage:
      - datalake_evidently_ml_monitor_raw.evidently_ml_monitor.model_uri
    description: Registry path segment parsed from the MLflow model URI when the URI matches the expected pattern.
  model_version:
    lineage:
      - datalake_evidently_ml_monitor_raw.evidently_ml_monitor.model_uri
    description: Model version segment parsed from the MLflow model URI when the URI matches the expected pattern.
  execution_context_s3_path:
    lineage:
      - datalake_evidently_ml_monitor_raw.evidently_ml_monitor.execution_context_s3_path
    description: S3 URI of the execution context payload used for the monitoring run.
  ts_report:
    lineage:
      - datalake_evidently_ml_monitor_raw.evidently_ml_monitor.timestamp
    description: Report generation timestamp as stored in the source monitoring export.
  metric_result_json:
    lineage:
      - datalake_evidently_ml_monitor_raw.evidently_ml_monitor.json_data
    description: Full Evidently metric result payload for this metric_id within the suite, serialized as a JSON string. Plotly widget blobs are stripped upstream in the raw spark job. Contains every field Evidently emits for the metric (display_name, type, value/share/count/mean/std, tests, metric_value_location, thresholds, statuses, etc.) without schema lock-in.
