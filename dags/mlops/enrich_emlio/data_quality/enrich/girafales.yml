---
table_name: datalake_emlio.girafales
alert_channel: "#data-alarms"
column_level_validations:
  id_service:
    is_complete:
      severity_level: Error
  city:
    is_complete:
      severity_level: Warning
  total_area:
    has_completeness:
      greater_than: 0.99
      severity_level: Warning
  type:
    is_contained_in:
      values:
        - Apartamento
        - Flat
        - CasaCondominio
        - StudioOuKitchenette
        - Casa
      severity_level: Warning
