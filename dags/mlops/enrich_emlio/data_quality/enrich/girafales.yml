---
table_name: datalake_emlio.girafales
alert_channel: "#data-alarms"
column_level_validations:
  id_service:
    is_complete:
      severity_level: Error
  city:
    has_completeness:
      greater_than: 0.90
      severity_level: Warning
  total_area:
    has_completeness:
      greater_than: 0.80
      severity_level: Warning
