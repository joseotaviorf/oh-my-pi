---
database_name: datalake_gsheets_people_pin_clean
table_name: hra_tmpl_sections
owner: isabella.araujo@quintoandar.com.br
domain: people
description: "This table stores template sections added from the section definitions defined, for a template. For example, the FY07 appraisal template includes the Competency and Objectives defined in Section Definitions."
columns:
  id_template_role:
    description: "Unique identifier for the template role linked to the section."
    lineage:
      - datalake_gsheets_people_raw.hra_tmpl_sections.tmpl_role_id
  id_business_group:
    description: "Identifier for the business group associated with the section."
    lineage:
      - datalake_gsheets_people_raw.hra_tmpl_sections.business_group_id
  id_template_definition:
    description: "Identifier for the template definition linked to the section."
    lineage:
      - datalake_gsheets_people_raw.hra_tmpl_sections.template_defn_id
  id_role:
    description: "Identifier for the role linked to the section."
    lineage:
      - datalake_gsheets_people_raw.hra_tmpl_sections.role_id
  id_module:
    description: "Identifier for the module associated with the section."
    lineage:
      - datalake_gsheets_people_raw.hra_tmpl_sections.module_id
  created_by:
    description: "User who created the section record."
    lineage:
      - datalake_gsheets_people_raw.hra_tmpl_sections.created_by
  updated_by:
    description: "User who last updated the section record."
    lineage:
      - datalake_gsheets_people_raw.hra_tmpl_sections.last_updated_by
  role_type:
    description: "Code representing the type of role linked to the section."
    lineage:
      - datalake_gsheets_people_raw.hra_tmpl_sections.role_type_code
  min_participants:
    description: "Minimum number of participants required for the section."
    lineage:
      - datalake_gsheets_people_raw.hra_tmpl_sections.minimum_num_pcpns
  max_participants:
    description: "Maximum number of participants allowed for the section."
    lineage:
      - datalake_gsheets_people_raw.hra_tmpl_sections.maximum_num_pcpns
  is_matrix_participant:
    description: "Indicates if the section is linked to a matrix participant role."
    lineage:
      - datalake_gsheets_people_raw.hra_tmpl_sections.matrix_participant_flag
  version_number:
    description: "Version number for optimistic locking."
    lineage:
      - datalake_gsheets_people_raw.hra_tmpl_sections.object_version_number
  dt_created:
    description: "Timestamp when the section record was created."
    lineage:
      - datalake_gsheets_people_raw.hra_tmpl_sections.creation_date
  dt_updated:
    description: "Timestamp when the section record was last updated."
    lineage:
      - datalake_gsheets_people_raw.hra_tmpl_sections.last_update_date
  ts_load:
    description: "Timestamp when the record was loaded into the datalake."
