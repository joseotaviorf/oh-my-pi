---
table_name: dw_compensation.fact_compensations
alert_channel: PEOPLE_ALERTS

table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: -5
    less_than_or_equal_to: 20
    severity_level: Warning

column_level_validations:
  sk_compensation:
    is_unique:
      severity_level: Error
    is_complete:
      severity_level: Error
  person_number:
    is_complete:
      severity_level: Error
  assignment_number:
    is_complete:
      severity_level: Error
  amount_salary:
    is_complete:
      severity_level: Error
    custom:
      constraint: |-
        (SELECT COUNT(*)
         FROM dw_compensation.fact_compensations
         WHERE amount_salary < 0
        ) = 0
      severity_level: Error
  amount_annual_salary:
    is_complete:
      severity_level: Error
  is_salary_approved:
    is_complete:
      severity_level: Error
  is_promotion_movement:
    is_complete:
      severity_level: Error
    custom:
      # Promotions should have positive salary adjustments. A small ratio of null/zero/negative
      # is expected (salary row splits, legacy data, retroactive adjustments), but > 5% signals
      # a classification regression (e.g., lateral moves being counted as promotions).
      constraint: |-
        (SELECT CASE
           WHEN SUM(CASE WHEN is_promotion_movement = TRUE THEN 1 ELSE 0 END) = 0 THEN 0
           WHEN 100.0
             * SUM(CASE WHEN is_promotion_movement = TRUE
                         AND (amount_adjustment IS NULL OR amount_adjustment <= 0) THEN 1 ELSE 0 END)
             / SUM(CASE WHEN is_promotion_movement = TRUE THEN 1 ELSE 0 END)
             > 5.0
           THEN 1
           ELSE 0
         END
         FROM dw_compensation.fact_compensations
        ) = 0
      severity_level: Warning
  days_tenure_in_company:
    has_min_value:
      greater_than_or_equal_to: 0
      severity_level: Error
    custom:
      # Tenure hierarchy: company >= position and company >= band when all non-null.
      # band >= position is NOT enforced: when dim_job receives a new SCD2 version
      # reclassifying a job's band, band tenure resets to the new version's start date
      # even if the employee has been in that position longer (structural model limitation).
      constraint: |-
        (SELECT COUNT(*)
         FROM dw_compensation.fact_compensations
         WHERE days_tenure_in_company IS NOT NULL
           AND (
             (days_tenure_in_position IS NOT NULL AND days_tenure_in_company < days_tenure_in_position)
             OR (days_tenure_in_band IS NOT NULL AND days_tenure_in_company < days_tenure_in_band)
           )
        ) = 0
      severity_level: Error
    has_completeness:
      # dt_original_hired (and id_continuous_employment_cycle) should be populated for nearly all
      # compensation records; a low completeness rate signals a regression in identifier_mapping join.
      greater_than_or_equal_to: 0.95
      severity_level: Warning
  months_tenure_in_company:
    has_min_value:
      greater_than_or_equal_to: 0
      severity_level: Error
    custom:
      # Same hierarchy check as days: company >= position and company >= band when all non-null.
      # band >= position is NOT enforced (see days_tenure_in_company custom check for rationale).
      constraint: |-
        (SELECT COUNT(*)
         FROM dw_compensation.fact_compensations
         WHERE months_tenure_in_company IS NOT NULL
           AND (
             (months_tenure_in_position IS NOT NULL AND months_tenure_in_company < months_tenure_in_position)
             OR (months_tenure_in_band IS NOT NULL AND months_tenure_in_company < months_tenure_in_band)
           )
        ) = 0
      severity_level: Error
  days_tenure_in_position:
    has_min_value:
      greater_than_or_equal_to: 0
      severity_level: Error
  months_tenure_in_position:
    has_min_value:
      greater_than_or_equal_to: 0
      severity_level: Error
  days_tenure_in_band:
    has_min_value:
      greater_than_or_equal_to: 0
      severity_level: Error
    custom:
      # Band tenure must be populated whenever dim_job band is available for the row.
      constraint: |-
        (SELECT COUNT(*)
         FROM dw_compensation.fact_compensations AS fc
         INNER JOIN dw_compensation.dim_job AS dj
             ON fc.sk_job_version = dj.sk_job_version
         WHERE dj.band IS NOT NULL
           AND fc.days_tenure_in_band IS NULL
        ) = 0
      severity_level: Error
  months_tenure_in_band:
    has_min_value:
      greater_than_or_equal_to: 0
      severity_level: Error
    custom:
      # Whole-month band tenure must follow the same completeness rule as day-level tenure.
      constraint: |-
        (SELECT COUNT(*)
         FROM dw_compensation.fact_compensations AS fc
         INNER JOIN dw_compensation.dim_job AS dj
             ON fc.sk_job_version = dj.sk_job_version
         WHERE dj.band IS NOT NULL
           AND fc.months_tenure_in_band IS NULL
        ) = 0
      severity_level: Error
  dt_valid_from:
    is_complete:
      severity_level: Error
    custom:
      # SCD bounds: valid-from must not be after valid-to.
      constraint: |-
        (SELECT COUNT(*)
         FROM dw_compensation.fact_compensations
         WHERE dt_valid_from > dt_valid_to
        ) = 0
      severity_level: Error
  dt_valid_to:
    is_complete:
      severity_level: Error
  is_current:
    is_complete:
      severity_level: Error
  ts_load:
    is_complete:
      severity_level: Error
