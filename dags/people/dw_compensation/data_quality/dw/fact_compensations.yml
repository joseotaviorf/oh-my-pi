---
table_name: dw_compensation.fact_compensations
alert_channel: PEOPLE_ALERTS

table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: -5
    less_than_or_equal_to: 20
    severity_level: Warning

column_level_validations:
  sk_compensation:
    is_unique:
      severity_level: Error
    is_complete:
      severity_level: Error
  sk_job_version:
    is_complete:
      severity_level: Error
  person_number:
    is_complete:
      severity_level: Error
  assignment_number:
    is_complete:
      severity_level: Error
  amount_salary:
    is_complete:
      severity_level: Error
    custom:
      constraint: |-
        (SELECT COUNT(*)
         FROM dw_compensation.fact_compensations
         WHERE amount_salary < 0
        ) = 0
      severity_level: Error
  amount_annual_salary:
    is_complete:
      severity_level: Error
  is_salary_approved:
    is_complete:
      severity_level: Error
  is_promotion_movement:
    is_complete:
      severity_level: Error
  days_tenure_in_company:
    has_min_value:
      greater_than_or_equal_to: 0
      severity_level: Error
    custom:
      # Tenure hierarchy: company >= position and company >= band when all non-null
      constraint: |-
        (SELECT COUNT(*)
         FROM dw_compensation.fact_compensations
         WHERE days_tenure_in_company IS NOT NULL
           AND (
             (days_tenure_in_position IS NOT NULL AND days_tenure_in_company < days_tenure_in_position)
             OR (days_tenure_in_band IS NOT NULL AND days_tenure_in_company < days_tenure_in_band)
           )
        ) = 0
      severity_level: Error
  months_tenure_in_company:
    has_min_value:
      greater_than_or_equal_to: 0
      severity_level: Error
  days_tenure_in_position:
    has_min_value:
      greater_than_or_equal_to: 0
      severity_level: Error
  months_tenure_in_position:
    has_min_value:
      greater_than_or_equal_to: 0
      severity_level: Error
  days_tenure_in_band:
    has_min_value:
      greater_than_or_equal_to: 0
      severity_level: Error
  months_tenure_in_band:
    has_min_value:
      greater_than_or_equal_to: 0
      severity_level: Error
  dt_valid_from:
    is_complete:
      severity_level: Error
    custom:
      constraint: |-
        (SELECT COUNT(*)
         FROM dw_compensation.fact_compensations
         WHERE dt_valid_to IS NOT NULL
           AND dt_valid_from >= dt_valid_to
        ) = 0
      severity_level: Error
  is_current:
    is_complete:
      severity_level: Error
  ts_load:
    is_complete:
      severity_level: Error
