---
table_name: dw_compensation.dim_job
alert_channel: PEOPLE_ALERTS

table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: 0
    less_than_or_equal_to: 50
    severity_level: Warning

column_level_validations:
  sk_job:
    is_unique:
      severity_level: Warning
    is_complete:
      severity_level: Warning
  job_code:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Warning
  job_name:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Warning
  job_family:
    custom:
      # Ensure job_family is not null for current active jobs
      constraint: |-
        (SELECT COUNT(*)
         FROM dw_compensation.dim_job
         WHERE is_current = TRUE
           AND is_active = TRUE
           AND job_family IS NULL
        ) = 0
      severity_level: Warning
  band:
    custom:
      # Ensure band is not null for current active jobs
      constraint: |-
        (SELECT COUNT(*)
         FROM dw_compensation.dim_job
         WHERE is_current = TRUE
           AND is_active = TRUE
           AND band IS NULL
        ) = 0
      severity_level: Warning
  career_track:
    custom:
      # Ensure career_track is not null for current active jobs
      constraint: |-
        (SELECT COUNT(*)
         FROM dw_compensation.dim_job
         WHERE is_current = TRUE
           AND is_active = TRUE
           AND career_track IS NULL
        ) = 0
      severity_level: Warning
  is_active:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Warning
  dt_valid_from:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Warning
  is_current:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Warning
