---
table_name: dw_compensation.fact_plr_monthly
alert_channel: PEOPLE_ALERTS

table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: -5
    less_than_or_equal_to: 20
    severity_level: Warning

column_level_validations:
  sk_plr_monthly:
    is_unique:
      severity_level: Error
    is_complete:
      severity_level: Error
  sk_period_of_service:
    is_complete:
      severity_level: Error
  sk_contract:
    is_complete:
      severity_level: Error
  sk_plr_parameters:
    is_complete:
      severity_level: Error
  sk_reference_month:
    is_complete:
      severity_level: Error
  person_number:
    is_complete:
      severity_level: Error
  assignment_number:
    is_complete:
      severity_level: Error
  days_worked_in_month:
    has_min_value:
      greater_than_or_equal_to: 0
      severity_level: Error
  days_worked_in_year:
    has_min_value:
      greater_than_or_equal_to: 0
      severity_level: Error
  days_notice_period_in_month:
    has_min_value:
      greater_than_or_equal_to: 0
      severity_level: Error
  days_notice_period_in_year:
    has_min_value:
      greater_than_or_equal_to: 0
      severity_level: Error
  amount_plr_monthly:
    has_min_value:
      greater_than_or_equal_to: 0
      severity_level: Error
  dt_of_notice:
    custom:
      # Ensures notice date is not after termination date for closed records
      constraint: |-
        (SELECT COUNT(*)
         FROM dw_compensation.fact_plr_monthly
         WHERE dt_of_notice < DATE('9999-12-31')
           AND dt_terminated < DATE('9999-12-31')
           AND dt_of_notice > dt_terminated
        ) = 0
      severity_level: Error
  ts_load:
    is_complete:
      severity_level: Error
