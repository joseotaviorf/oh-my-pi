database_name: dw_compensation
table_name: fact_compensations
owner: isabella.araujo@quintoandar.com.br
domain: People
description: |
  Fact table containing historical and current compensation records for employees.
  This table stores approved salary proposals with their associated adjustments,
  positioning metrics (range position, range percentile), and links to job and event dimensions.
  The grain is one row per approved salary record per job validity period (SCD Type 2),
  created by intersecting salary periods with assignment job history.
  Key features:
  - Tracks salary changes over time with full history
  - Splits rows when assignment job changes, even without salary change
  - Links to dim_employee and dim_assignment (contract) for employee context
  - Links to dim_job for job-level compensation targets based on assignment job at date
  - Links to dim_event_definition for action/reason context
  - Calculates amount_total_cash including PLR targets (RVV and SOP to be included)
  - Identifies promotion movements based on action codes
  Use cases:
  - Salary history analysis
  - Compensation benchmarking
  - Promotion and merit tracking

columns:
  sk_compensation:
    description: |
      Surrogate key (MD5 hash of id_salary + dt_valid_from after job-splitting).
  sk_employee:
    description: Foreign key to dim_employee. References the employee (id_person).
  sk_contract:
    description: Foreign key to dim_assignment. References the contract/assignment (id_assignment).
  sk_job_version:
    description: Foreign key to dim_job. References the job version at the time of the salary record.
  sk_event_definition:
    description: |
      Foreign key to dim_event_definition.
      Unified identifier for the action and reason that triggered this compensation change.
  person_number:
    description: Employee's person number (business identifier).
  assignment_number:
    description: Assignment number for the employee's position.
  currency_code:
    description: Currency code for salary amounts (e.g., BRL, USD, MXN).
  amount_salary:
    description: Salary amount based on the salary basis frequency (e.g., monthly salary).
  amount_annual_salary:
    description: Calculated total annual salary based on salary amount and annualization factor.
  amount_total_cash:
    description: |
      Total cash compensation including annual salary and PLR.
      Calculated as: 
        annual_salary 
        + (salary_amount × target_plr_salary_multiplier) for LATAM
        + target_plr for Brasil
      Note: SOP, RVV and exceptional bonus are excluded for now.
  amount_adjustment:
    description: Monetary amount of the salary adjustment (difference from previous salary).
  pct_adjustment:
    description: Percentage increase of the salary adjustment over the base salary value.
  range_position:
    description: |
      Compensation ratio comparing actual salary to the midpoint of the pay range.
      Formula: salary / mid_value. Values around 1.0 indicate market alignment.
      Primary metric used by the business for compensation analysis.
  range_percentile:
    description: |
      Position of salary within the pay range as a percentage.
      Formula: (salary - min) / (max - min). Can be negative (below min) or >100 (above max).
  is_salary_approved:
    description: Boolean flag indicating if the salary proposal has been approved.
  is_promotion_movement:
    description: |
      TRUE if this salary change is associated with a promotion event.
      Based on action_code = 'PROMOTION'.
  dt_valid_from:
    description: Start date of validity for this salary record (SCD Type 2).
  dt_valid_to:
    description: End date of validity for this salary record. NULL if currently active.
  is_current:
    description: |
      TRUE if this record represents the current salary for the contract/assignment.
  ts_load:
    description: Timestamp recording when data was loaded into the table.
