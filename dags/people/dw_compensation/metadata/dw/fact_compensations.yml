database_name: dw_compensation
table_name: fact_compensations
owner: isabella.araujo@quintoandar.com.br
domain: People
description: |
  Fact table containing historical and current compensation records for employees.
  This table stores approved salary proposals with their associated adjustments,
  positioning metrics (range position, range percentile), and links to job and event dimensions.
  The grain is one row per approved salary record per job validity period (SCD Type 2),
  created by intersecting salary periods with assignment job history.
  Key features:
  - Tracks salary changes over time with full history
  - Splits rows when assignment job changes, even without salary change
  - Links to dim_employee and dim_assignment (contract) for employee context
  - Links to dim_job for job-level compensation targets based on assignment job at date
  - Links to dim_event_definition for action/reason context
  - Calculates amount_total_cash including PLR targets (RVV and SOP to be included)
  - Identifies promotion movements based on action codes
  Use cases:
  - Salary history analysis
  - Compensation benchmarking
  - Promotion and merit tracking

columns:
  sk_compensation:
    description: |
      Surrogate key. MD5 hash of (id_salary, id_assignment, id_job, dt_valid_from, dt_valid_to)
      to uniquely identify each consolidated compensation record.
      id_assignment suffices for grain differentiation (1:1 with id_period_of_service).
    lineage:
      - datalake_pin_compensation_clean.salary.id_salary
      - datalake_pin_compensation_clean.salary.id_assignment
      - datalake_pin_compensation_clean.salary.id_job
      - datalake_pin_compensation_clean.salary.dt_started
      - datalake_pin_compensation_clean.salary.dt_ended
  sk_employee:
    description: Foreign key to dim_employee. References the employee (id_person).
    lineage:
      - datalake_pin_compensation_clean.salary.id_person
  sk_contract:
    description: Foreign key to dim_assignment. References the contract/assignment (id_assignment).
    lineage:
      - datalake_pin_compensation_clean.salary.id_assignment
  sk_job_version:
    description: Foreign key to dim_job. References the job version at the time of the salary record.
    lineage:
      - dw_compensation.dim_job.sk_job_version
  sk_event_definition:
    description: |
      Foreign key to dim_event_definition.
      Unified identifier for the action and reason that triggered this compensation change.
      NULL on rows created by dim_job or assignment history version splits
      (only populated on the originating row where the salary actually changed).
    lineage:
      - datalake_people.event_definition.id_event_definition
  person_number:
    description: Employee's person number (business identifier).
    lineage:
      - datalake_people.identifier_mapping.person_number
  assignment_number:
    description: Assignment number for the employee's position.
    lineage:
      - datalake_people.identifier_mapping.assignment_number
  currency_code:
    description: Currency code for salary amounts (e.g., BRL, USD, MXN).
    lineage:
      - datalake_pin_compensation_clean.salary.currency_code
  amount_salary:
    description: Salary amount based on the salary basis frequency (e.g., monthly salary).
    lineage:
      - datalake_pin_compensation_clean.salary.salary_amount
  amount_annual_salary:
    description: Calculated total annual salary based on salary amount and annualization factor.
    lineage:
      - datalake_pin_compensation_clean.salary.annual_salary
  amount_total_cash:
    description: |
      Total cash compensation including annual salary and PLR.
      Calculated as: 
        annual_salary 
        + (salary_amount × target_plr_salary_multiplier) for LATAM
        + target_plr for Brasil
      Note: SOP, RVV and exceptional bonus are excluded for now.
    lineage:
      - datalake_pin_compensation_clean.salary.annual_salary
      - datalake_pin_compensation_clean.salary.salary_amount
      - dw_compensation.dim_job.target_plr
      - dw_compensation.dim_job.target_plr_salary_multiplier
  amount_adjustment:
    description: |
      Monetary amount of the salary adjustment (difference from previous salary).
      NULL on rows created by dim_job or assignment history version splits
      (only populated on the originating row where the salary actually changed).
    lineage:
      - datalake_pin_compensation_clean.salary.adjustment_amount
  pct_adjustment:
    description: |
      Percentage increase of the salary adjustment over the base salary value.
      NULL on rows created by dim_job or assignment history version splits
      (only populated on the originating row where the salary actually changed).
    lineage:
      - datalake_pin_compensation_clean.salary.adjustment_percent
  range_position:
    description: |
      Compensation ratio comparing actual salary to the midpoint of the pay range.
      Formula: salary / mid_value. Values around 1.0 indicate market alignment.
      Primary metric used by the business for compensation analysis.
    lineage:
      - datalake_pin_compensation_clean.salary.compa_ratio
  range_percentile:
    description: |
      Position of salary within the pay range as a percentage.
      Formula: (salary - min) / (max - min). Can be negative (below min) or >100 (above max).
    lineage:
      - datalake_pin_compensation_clean.salary.range_position
  is_salary_approved:
    description: Boolean flag indicating if the salary proposal has been approved.
    lineage:
      - datalake_pin_compensation_clean.salary.is_salary_approved
  is_promotion_movement:
    description: |
      TRUE if this salary change is associated with a promotion event.
      Based on reason_code = 'CMP_PROM' from event_definition, which is more
      precise than the broad action_code = 'PROMOTION' (which also includes
      lateral moves, internal recruitment, and other non-promotion movements).
      Always FALSE on rows created by dim_job or assignment history version splits
      (event metadata is only attributed to the originating salary change row).
    lineage:
      - datalake_people.event_definition.reason_code
  days_tenure_in_company:
    description: |
      Tenure in the company in days.
      Reference date is LEAST(CURRENT_DATE, dt_valid_to) so historical records reflect the full period.
      Uses transfer-adjusted admission (previous_dt_started when GLB_TRANSFER) from identifier_mapping.
      NULL when identifier_mapping data is unavailable.
    lineage:
      - datalake_people.identifier_mapping.dt_started
      - datalake_pin_core_clean.periods_of_service.dt_started
      - datalake_pin_core_clean.all_assignments.action_code
  days_tenure_in_position:
    description: |
      Tenure in the current job (position) in days.
      Uses current stint by employee across assignment transfers (handles A->B->A returning to same job).
      Resets on rehire (new employment cycle that is not GLB_TRANSFER continuation).
      Reference date LEAST(CURRENT_DATE, dt_valid_to).
      NULL when job history is unavailable.
    lineage:
      - datalake_pin_core_clean.all_assignments.dt_effective_started
  days_tenure_in_band:
    description: |
      Tenure in the current band in days.
      Uses current stint by employee across assignment transfers (handles A->B->A returning to same band).
      Resets on rehire (new employment cycle that is not GLB_TRANSFER continuation).
      Reference date LEAST(CURRENT_DATE, dt_valid_to).
      NULL when band history is unavailable.
    lineage:
      - datalake_pin_core_clean.all_assignments.dt_effective_started
      - dw_compensation.dim_job.band
  months_tenure_in_company:
    description: |
      Tenure in the company in whole months.
      Same logic as days_tenure_in_company (transfer-adjusted, reference date LEAST(CURRENT_DATE, dt_valid_to)).
    lineage:
      - datalake_people.identifier_mapping.dt_started
      - datalake_pin_core_clean.periods_of_service.dt_started
      - datalake_pin_core_clean.all_assignments.action_code
  months_tenure_in_position:
    description: |
      Tenure in the current job (position) in whole months.
      Same logic as days_tenure_in_position (employee-level current stint, transfer continuity, rehire reset, reference date LEAST(CURRENT_DATE, dt_valid_to)).
    lineage:
      - datalake_pin_core_clean.all_assignments.dt_effective_started
  months_tenure_in_band:
    description: |
      Tenure in the current band in whole months.
      Same logic as days_tenure_in_band (employee-level current stint, transfer continuity, rehire reset, reference date LEAST(CURRENT_DATE, dt_valid_to)).
    lineage:
      - datalake_pin_core_clean.all_assignments.dt_effective_started
      - dw_compensation.dim_job.band
  dt_valid_from:
    description: Start date of validity for this salary record (SCD Type 2).
    lineage:
      - datalake_pin_compensation_clean.salary.dt_started
  dt_valid_to:
    description: |
      End date of validity for this salary record (SCD Type 2).
      `9999-12-31` when the salary row is still open.
    lineage:
      - datalake_pin_compensation_clean.salary.dt_ended
  is_current:
    description: |
      TRUE if this record represents the current salary for the contract/assignment.
    lineage:
      - datalake_pin_compensation_clean.salary.dt_started
      - datalake_pin_compensation_clean.salary.dt_ended
  ts_load:
    description: Timestamp recording when data was loaded into the table.
