database_name: dw_compensation
table_name: fact_compensations
owner: isabella.araujo@quintoandar.com.br
domain: People
description: |
  Fact table containing historical and current compensation records for employees.
  This table stores approved salary proposals with their associated adjustments,
  positioning metrics (range position, range percentile), and links to job and event dimensions.
  The grain is one row per approved salary record per job validity period (SCD Type 2),
  created by intersecting salary periods with assignment job history.
  Key features:
  - Tracks salary changes over time with full history
  - Splits rows when assignment job changes, even without salary change
  - Links to dim_employee and dim_assignment (contract) for employee context
  - Links to dim_job (via sk_job_version) for downstream joins; job attributes are read from
    datalake_people.job_with_salary_table (RVV, SOP, hiring SOP, exceptional bonus, band)
  - Links to dim_event_definition for action/reason context
  - Reads PLR targets (multiplier or fixed amount) exclusively from person-level Oracle HCM
    ICP entries; employees without an ICP entry have NULL PLR (no fallback to dim_job)
  - Calculates amount_total_cash including PLR targets (RVV and SOP to be included)
  - Identifies promotion movements based on action codes
  Use cases:
  - Salary history analysis
  - Compensation benchmarking
  - Promotion and merit tracking

columns:
  sk_compensation:
    description: |
      Surrogate key. MD5 hash of (id_salary, id_assignment, id_job, dt_valid_from, dt_valid_to)
      to uniquely identify each consolidated compensation record.
      id_assignment suffices for grain differentiation (1:1 with id_period_of_service).
    lineage:
      - datalake_pin_compensation_clean.salary.id_salary
      - datalake_pin_compensation_clean.salary.id_assignment
      - datalake_pin_compensation_clean.salary.id_job
      - datalake_pin_compensation_clean.salary.dt_started
      - datalake_pin_compensation_clean.salary.dt_ended
  sk_employee:
    description: Foreign key to dim_employee. References the employee (id_person).
    lineage:
      - datalake_pin_compensation_clean.salary.id_person
  sk_contract:
    description: Foreign key to dim_assignment. References the contract/assignment (id_assignment).
    lineage:
      - datalake_pin_compensation_clean.salary.id_assignment
  sk_job_version:
    description: |
      Foreign key to dim_job. References the job version at the time of the salary record.
      Computed with the same MD5(id_job, dt_valid_from) formula as dim_job from
      datalake_people.job_with_salary_table.
    lineage:
      - datalake_people.job_with_salary_table.id_job
      - datalake_people.job_with_salary_table.dt_valid_from
  sk_event_definition:
    description: |
      Foreign key to dim_event_definition.
      Unified identifier for the action and reason that triggered this compensation change.
      NULL on rows created by job-version or assignment history version splits
      (only populated on the originating row where the salary actually changed).
    lineage:
      - datalake_people.event_definition.id_event_definition
  person_number:
    description: Employee's person number (business identifier).
    lineage:
      - datalake_people.identifier_mapping.person_number
  assignment_number:
    description: Assignment number for the employee's position.
    lineage:
      - datalake_people.identifier_mapping.assignment_number
  currency_code:
    description: Currency code for salary amounts (e.g., BRL, USD, MXN).
    lineage:
      - datalake_pin_compensation_clean.salary.currency_code
  plr_target_currency_code:
    description: |
      Currency of the fixed-amount PLR target (target_plr) when sourced from a
      person-level "Annual Target - PLR" / "Annual Target - PLR (Dolar)" ICP entry.
      NULL when the PLR target is a multiplier ("PLR - Salary Multiple", which is
      dimensionless) or when the employee has no active ICP entry. Useful to flag
      currency mismatch against currency_code.
    lineage:
      - datalake_pin_compensation_clean.element_type.input_currency_code
  salary_range:
    description: Salary bracket derived from amount_salary for analytical grouping. Only populated for BRL salaries; '-1' when currency is not BRL or salary_amount is not available.
    lineage:
      - datalake_pin_compensation_clean.salary.salary_amount
    categories:
      "Below R$3,000": Monthly salary below R$3,000.
      "R$3,000 - R$4,999": Monthly salary between R$3,000 and R$4,999.
      "R$5,000 - R$7,999": Monthly salary between R$5,000 and R$7,999.
      "R$8,000 - R$11,999": Monthly salary between R$8,000 and R$11,999.
      "R$12,000 - R$19,999": Monthly salary between R$12,000 and R$19,999.
      "R$20,000+": Monthly salary of R$20,000 or above.
      "-1": Currency is not BRL or salary_amount is not available.
  amount_salary:
    description: Salary amount based on the salary basis frequency (e.g., monthly salary).
    lineage:
      - datalake_pin_compensation_clean.salary.salary_amount
  amount_annual_salary:
    description: Calculated total annual salary based on salary amount and annualization factor.
    lineage:
      - datalake_pin_compensation_clean.salary.annual_salary
  amount_total_cash:
    description: |
      Total cash compensation including annual salary and PLR target.
      Calculated as:
        annual_salary
        + (salary_amount × target_plr_salary_multiplier) when the person has a
          "PLR - Salary Multiple" ICP entry (current model)
        + target_plr when the person has an "Annual Target - PLR(*)" ICP entry
          (legacy model, kept for older contracts)
      PLR target is read exclusively from person-level Oracle HCM ICP entries
      (datalake_pin_compensation_clean.element_*); employees without an ICP entry
      have NULL PLR and amount_total_cash equals annual_salary.
      Note: SOP, RVV and exceptional bonus are excluded for now. Currency mismatch
      between PLR target and salary (e.g. "Annual Target - PLR (Dolar)" in USD vs
      salary in ARS) is not reconciled in this calculation; see plr_target_currency_code.
    lineage:
      - datalake_pin_compensation_clean.salary.annual_salary
      - datalake_pin_compensation_clean.salary.salary_amount
      - datalake_pin_compensation_clean.element_entry_value.screen_entry_value
      - datalake_pin_compensation_clean.element_type.element_name
  amount_adjustment:
    description: |
      Monetary amount of the salary adjustment (difference from previous salary).
      NULL on rows created by job-version or assignment history version splits
      (only populated on the originating row where the salary actually changed).
    lineage:
      - datalake_pin_compensation_clean.salary.adjustment_amount
  pct_adjustment:
    description: |
      Percentage increase of the salary adjustment over the base salary value.
      NULL on rows created by job-version or assignment history version splits
      (only populated on the originating row where the salary actually changed).
    lineage:
      - datalake_pin_compensation_clean.salary.adjustment_percent
  range_position:
    description: |
      Compensation ratio comparing actual salary to the midpoint of the pay range.
      Formula: salary / mid_value. Values around 1.0 indicate market alignment.
      Primary metric used by the business for compensation analysis.
    lineage:
      - datalake_pin_compensation_clean.salary.compa_ratio
  range_percentile:
    description: |
      Position of salary within the pay range as a percentage.
      Formula: (salary - min) / (max - min). Can be negative (below min) or >100 (above max).
    lineage:
      - datalake_pin_compensation_clean.salary.range_position
  is_salary_approved:
    description: Boolean flag indicating if the salary proposal has been approved.
    lineage:
      - datalake_pin_compensation_clean.salary.is_salary_approved
  is_promotion_movement:
    description: |
      TRUE if this salary change is associated with a promotion event.
      Based on reason_code = 'CMP_PROM' from event_definition, which is more
      precise than the broad action_code = 'PROMOTION' (which also includes
      lateral moves, internal recruitment, and other non-promotion movements).
      Always FALSE on rows created by job-version or assignment history version splits
      (event metadata is only attributed to the originating salary change row).
    lineage:
      - datalake_people.event_definition.reason_code
  is_eligible_internet_reimbursement:
    description: TRUE if BRL salary < 10,000 (eligible for internet reimbursement); FALSE if BRL salary >= 10,000; NULL when currency is not BRL or salary_amount is not available.
    lineage:
      - datalake_pin_compensation_clean.salary.salary_amount
  days_tenure_in_company:
    description: |
      Tenure in the company in days.
      Reference date is LEAST(CURRENT_DATE, dt_valid_to) so historical records reflect the full period.
      Uses dt_original_hired from identifier_mapping, which already encodes transfer-continuation logic:
      the date resets only on true rehire; GLB_TRANSFER continuations preserve the original hire date.
      NULL when identifier_mapping data is unavailable.
    lineage:
      - datalake_people.identifier_mapping.dt_original_hired
  days_tenure_in_position:
    description: |
      Tenure in the current job (position) in days, measured from the start of the current stint.
      A stint is a continuous period in the same job within the same id_continuous_employment_cycle;
      it resets when the person moves to a different job and returns (A→B→A counts from the return date).
      Resets on true rehire (new cycle in identifier_mapping). Reference date LEAST(CURRENT_DATE, dt_valid_to).
      NULL when job history is unavailable.
    lineage:
      - datalake_pin_core_clean.all_assignments.dt_effective_started
      - datalake_people.identifier_mapping.id_continuous_employment_cycle
  days_tenure_in_band:
    description: |
      Tenure in the current band in days, measured from the start of the current stint.
      A stint is a continuous period in the same band within the same id_continuous_employment_cycle;
      it resets when the person moves to a different band and returns.
      Resets on true rehire (new cycle in identifier_mapping). Reference date LEAST(CURRENT_DATE, dt_valid_to).
      NULL when band history is unavailable.
    lineage:
      - datalake_pin_core_clean.all_assignments.dt_effective_started
      - datalake_people.identifier_mapping.id_continuous_employment_cycle
      - datalake_people.job_with_salary_table.band
  months_tenure_in_company:
    description: |
      Tenure in the company in whole months.
      Same logic as days_tenure_in_company (uses dt_original_hired, reference date LEAST(CURRENT_DATE, dt_valid_to)).
    lineage:
      - datalake_people.identifier_mapping.dt_original_hired
  months_tenure_in_position:
    description: |
      Tenure in the current job (position) in whole months. Same logic as days_tenure_in_position.
    lineage:
      - datalake_pin_core_clean.all_assignments.dt_effective_started
      - datalake_people.identifier_mapping.id_continuous_employment_cycle
  months_tenure_in_band:
    description: |
      Tenure in the current band in whole months. Same logic as days_tenure_in_band.
    lineage:
      - datalake_pin_core_clean.all_assignments.dt_effective_started
      - datalake_people.identifier_mapping.id_continuous_employment_cycle
      - datalake_people.job_with_salary_table.band
  dt_valid_from:
    description: Start date of validity for this salary record (SCD Type 2).
    lineage:
      - datalake_pin_compensation_clean.salary.dt_started
  dt_valid_to:
    description: |
      End date of validity for this salary record (SCD Type 2).
      `9999-12-31` when the salary row is still open.
    lineage:
      - datalake_pin_compensation_clean.salary.dt_ended
  is_current:
    description: |
      TRUE if this record represents the current salary for the contract/assignment.
    lineage:
      - datalake_pin_compensation_clean.salary.dt_started
      - datalake_pin_compensation_clean.salary.dt_ended
  ts_load:
    description: Timestamp recording when data was loaded into the table.
