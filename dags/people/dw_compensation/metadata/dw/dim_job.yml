database_name: dw_compensation
table_name: dim_job
owner: isabella.araujo@quintoandar.com.br
domain: People
description: |
  Job dimension with compensation targets, salary table details, and salary ranges.
  Each row represents a unique version of a job. A new version is created whenever any attribute changes
  (e.g., band, salary table, salary range, PLR target).
  Consecutive periods with identical attributes are automatically consolidated into a single version.

  The unique key is `sk_job_version` (MD5 hash of job ID + valid from date).
  `id_job` is the source system job ID, not unique across versions.

  Compensation targets (PLR, RVV, SOP, etc.) default to 0 when not defined.
  Salary range values (min, mid, max) are in DECIMAL(18, 2) precision.
  Open-ended job versions use `dt_valid_to` = `9999-12-31`.


columns:
  sk_job_version:
    description: Unique key for each job version. MD5 hash generated from job ID and valid from date.
    lineage:
      - datalake_pin_core_clean.job.id_job
      - datalake_pin_core_clean.job.dt_effective_started
  id_job:
    description: Job ID from the source system. Natural key for the job entity, not unique across versions.
    lineage:
      - datalake_pin_core_clean.job.id_job
  job_code:
    description: Business code for the job (e.g., "00033", "00134").
    lineage:
      - datalake_pin_core_clean.job.job_code
  job_name:
    description: Job title in English (US).
    lineage:
      - datalake_pin_core_clean.job_translation.name
  job_family:
    description: Job family name grouping similar jobs (e.g., Analistas, Gerentes).
    lineage:
      - datalake_pin_core_clean.job_family_translation.job_family_name
  employment_type:
    description: |
      Employment relationship type derived from job_family for PLR and workforce analytics.
      Maps Jovem Aprendiz to young apprentice, Estagiario to intern, and all other non-null families to clt.
      NULL when job_family is NULL (unknown dimension row).
      Replaces the legacy vinculo field without reading the enrich layer.
    lineage:
      - datalake_pin_core_clean.job_family_translation.job_family_name
    categories:
      clt: Standard CLT employment (default for non-apprentice, non-intern job families).
      intern: Internship (job_family = Estagiario).
      young apprentice: Young apprentice program (job_family = Jovem Aprendiz).
  band:
    description: |
      Salary/seniority band for the job (e.g., "5", "6", "7", "Assist", "JA").
      Represents the hierarchical level or seniority of the position.
      Higher numeric bands usually indicate greater seniority.
    lineage:
      - datalake_pin_core_clean.grade_translation.name
      - datalake_pin_core_clean.valid_grades.id_grade
  job_business_unit_group:
    description: Business unit from set identifiers.
    lineage:
      - datalake_pin_core_clean.set_identifiers.set_name
  salary_table:
    description: |
      Name of the salary table that groups the bands (e.g., "Eng SP", "PM SP", "Classifieds Geral").
      The name usually indicates the area/function and country/region.
    lineage:
      - datalake_pin_core_clean.grade_ladder_translation.name
  country:
    description: |
      Country associated with the salary table, inferred from the table name pattern.
      Possible values: Brazil, Portugal, Mexico, Argentina, Peru, Ecuador, Panama, Uruguay, United States.
      Detection logic:
      - Special cases: "Deel" = United States, "Classifieds Geral" = Uruguay
      - Country codes detected at the end of the table name or before a separator (space/hyphen), e.g. suffix " ARG", middle token "Corp ARG - Dridco S.A.U"
      - Examples: "Corp PT" → Portugal, "Classifieds - Sales L ARG" → Argentina, "Tech ARG - Dridco S.A.U" → Argentina
      - Tables without a recognizable country token default to Brazil
    lineage:
      - datalake_pin_core_clean.grade_ladder_translation.name
  salary_table_group:
    description: |
      Grouping category for analysis and reporting.
      Possible values:
      - By area: PM, DA, Eng, Prod, DSR, Growth, Ops Sale
      - By level: EXEC (band >= 12), Estag (interns), JA (young apprentice)
      - By country: Argentina, Peru, Ecuador, Panama, Portugal, Mexico, Uruguay, United States
      Useful for comparing salary ranges across similar areas.
      Country detection follows the same logic as the country column.
    lineage:
      - datalake_pin_core_clean.grade_ladder_translation.name
      - datalake_pin_core_clean.grade_translation.name
  salary_basis_name:
    description: |
      Descriptive name of the salary basis (e.g., "Base Salarial Eng SP").
      Identifies the payment configuration associated with this table/band.
    lineage:
      - datalake_pin_compensation_clean.salary_bases.salary_basis_name
  salary_frequency:
    description: |
      Payment frequency code of the salary basis.
      Common values: MONTHLY, HOURLY.
      Use together with annualization_factor for conversions.
    lineage:
      - datalake_pin_compensation_clean.salary_bases.salary_basis_code
  salary_basis_type:
    description: Salary basis type in Oracle HCM. Always "U" (User-defined) for QuintoAndar.
    lineage:
      - datalake_pin_compensation_clean.salary_bases.salary_basis_type
  brazilian_occupation_code:
    description: CBO - Classificação Brasileira de Ocupações.
    lineage:
      - datalake_pin_core_clean.job_legislative.brazilian_occupation_code
  working_hours_regime:
    description: Work arrangement or legal working hours regime.
    lineage:
      - datalake_pin_core_clean.job.work_arrangement
  workload:
    description: Weekly working hours.
    lineage:
      - datalake_pin_core_clean.job.weekly_hours
  currency_target_sop:
    description: Currency for SOP target values.
    lineage:
      - datalake_pin_core_clean.job.target_sop_currency
  currency_salary_range:
    description: |
      Currency used for salary range values.
      Common values: BRL (Brazilian Real), USD (Dollar), UYU (Uruguayan Peso), MXN (Mexican Peso).
      All values (minimum, mid, maximum) are in this currency.
    lineage:
      - datalake_pin_core_clean.rates.currency_code
  annualization_factor:
    description: |
      Factor to convert salary value to annual basis.
      Example: 12 for monthly salary (12 months), 13 for monthly with 13th salary.
      Calculation: annual_salary = reported_salary * annualization_factor
    lineage:
      - datalake_pin_compensation_clean.salary_bases.annualization_factor
  target_plr:
    description: Fixed monetary value for the Profit Sharing (PLR) target. Defaults to 0 when not defined. This value is ignored if target_plr_salary_multiplier is present.
    lineage:
      - datalake_pin_core_clean.job.target_plr
  target_plr_salary_multiplier:
    description: PLR (Profit Sharing) salary multiplier. Defaults to 0 when not defined. For certain BUs (mainly in LATAM), the PLR target is not a fixed amount but a multiple of the salary. This multiplier overrides target_plr when both are present.
    lineage:
      - datalake_pin_core_clean.job.target_plr_salary_multiplier
  target_rvv:
    description: RVV (Variable Sales Compensation) target for the job. Defaults to 0 when not defined.
    lineage:
      - datalake_pin_core_clean.job.target_rvv
  target_sop:
    description: SOP (Stock Option Program) target for the job. Defaults to 0 when not defined.
    lineage:
      - datalake_pin_core_clean.job.target_sop
  target_hiring_sop:
    description: Hiring SOP target offered to new hires. Defaults to 0 when not defined.
    lineage:
      - datalake_pin_core_clean.job.target_hiring_sop
  target_exceptional_bonus:
    description: Exceptional bonus target (tech bonus in USD). Defaults to 0 when not defined.
    lineage:
      - datalake_pin_core_clean.job.target_bonus_tech_usd
  salary_range_min:
    description: |
      Minimum salary range value for this band (P80).
      Represents the acceptable salary floor for the level.
      Values below may indicate need for adjustment or promotion.
    lineage:
      - datalake_pin_core_clean.rate_values.minimum_value
  salary_range_mid:
    description: |
      Midpoint salary range value for this band (P100).
      Represents the target salary for fully qualified professionals at the level.
      Commonly used as reference for salary positioning.
    lineage:
      - datalake_pin_core_clean.rate_values.mid_value
  salary_range_max:
    description: |
      Maximum salary range value for this band (P120).
      Represents the salary ceiling for the level.
      Values above may indicate need for band promotion.
    lineage:
      - datalake_pin_core_clean.rate_values.maximum_value
  has_clock_in:
    description: Whether the job requires clock-in/clock-out.
    lineage:
      - datalake_pin_core_clean.job.is_time_clocking_required
  is_leadership_job:
    description: Flag indicating whether the job is a leadership role, derived from contribution level.
    lineage:
      - datalake_pin_core_clean.job.contribution_level
  is_active:
    description: Whether the job is currently active in the system.
    lineage:
      - datalake_pin_core_clean.job.is_active
  is_current:
    description: Whether this is the active version as of the load date. Filter by is_current = TRUE for current data.
    lineage:
      - datalake_pin_core_clean.job.dt_effective_started
      - datalake_pin_core_clean.valid_grades.dt_effective_started
      - datalake_pin_core_clean.grade_ladder.dt_effective_started
      - datalake_pin_core_clean.grade_ladder_translation.dt_effective_started
      - datalake_pin_core_clean.grade_translation.dt_effective_started
      - datalake_pin_core_clean.rates.dt_effective_started
      - datalake_pin_core_clean.rate_values.dt_effective_started
      - datalake_pin_compensation_clean.salary_bases.dt_effective_started
      - datalake_pin_core_clean.job.dt_effective_ended
      - datalake_pin_core_clean.valid_grades.dt_effective_ended
      - datalake_pin_core_clean.grade_ladder.dt_effective_ended
      - datalake_pin_core_clean.grade_ladder_translation.dt_effective_ended
      - datalake_pin_core_clean.grade_translation.dt_effective_ended
      - datalake_pin_core_clean.rates.dt_effective_ended
      - datalake_pin_core_clean.rate_values.dt_effective_ended
      - datalake_pin_compensation_clean.salary_bases.dt_effective_ended
  dt_valid_from:
    description: Date when this job version became effective. Use for historical analysis and tracking attribute changes over time.
    lineage:
      - datalake_pin_core_clean.job.dt_effective_started
      - datalake_pin_core_clean.valid_grades.dt_effective_started
      - datalake_pin_core_clean.grade_ladder.dt_effective_started
      - datalake_pin_core_clean.grade_ladder_translation.dt_effective_started
      - datalake_pin_core_clean.grade_translation.dt_effective_started
      - datalake_pin_core_clean.rates.dt_effective_started
      - datalake_pin_core_clean.rate_values.dt_effective_started
      - datalake_pin_compensation_clean.salary_bases.dt_effective_started
  dt_valid_to:
    description: |
      End of the validity interval for this job version (SCD Type 2; same semantics as before, with no NULLs in DW).
      `9999-12-31` means no scheduled end date (normalized from enrich NULL or Oracle `4712-12-31`).
    lineage:
      - datalake_pin_core_clean.job.dt_effective_ended
      - datalake_pin_core_clean.valid_grades.dt_effective_ended
      - datalake_pin_core_clean.grade_ladder.dt_effective_ended
      - datalake_pin_core_clean.grade_ladder_translation.dt_effective_ended
      - datalake_pin_core_clean.grade_translation.dt_effective_ended
      - datalake_pin_core_clean.rates.dt_effective_ended
      - datalake_pin_core_clean.rate_values.dt_effective_ended
      - datalake_pin_compensation_clean.salary_bases.dt_effective_ended
  ts_load:
    description: Timestamp recording when data was loaded into the table.
