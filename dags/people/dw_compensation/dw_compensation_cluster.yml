cluster:
  type: emr_7_12_consolidation_xs_memory_fleet_cluster
  custom_configurations:
    aws_attributes:
      instance_profile_arn: '{{ var.value.emr_instance_profile_arn_people }}'
    core_nodes:
      target_on_demand: 2
      target_spot: 0
      instance_types:
      - r6g.xlarge
      - r7g.xlarge
      - r6i.xlarge
    task_nodes:
      instance_types:
      - r6g.xlarge
      - r7g.xlarge
      - r6i.xlarge
      target_on_demand: 0
      target_spot: 1
      allocation_strategy: price-capacity-optimized
      bid_price_percentage: 100
  access_control_list:
    group_name: people-analytics
    permission_level: CAN_MANAGE
