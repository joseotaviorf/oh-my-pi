dag:
  name: dw_compensation
  owner: Data People
  schedule_start_date: 2026, 1, 21
  documentation:
    dag_purpose: Data Warehouse with historical compensation records including salary changes, adjustments, and related dimensions.
cluster:
  type: databricks_16_4_small_memory_people_cluster
  access_control_list:
    group_name: people-analytics
    permission_level: CAN_MANAGE
  databricks_conn_id: databricks_new_env
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
workflow:
  type: query_delta
  layer: dw
  bucket_config_name: people_bucket
  custom_schema: compensation
  has_hive_sync: false
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  default_table_privileges:
    people-team: ["ALL PRIVILEGES"]
  inner_dependencies:
    fact_compensations:
      - dim_job
      - dim_event_definition
    fact_salary_table_targets:
      - dim_job
  tables_customization:
    dim_event_definition:
      vacuum_retention_hours: 168
      vacuum_lite: true
    dim_salary_table:
      vacuum_retention_hours: 168
      vacuum_lite: true
    dim_job:
      vacuum_retention_hours: 168
      vacuum_lite: true
    fact_compensations:
      vacuum_retention_hours: 168
      vacuum_lite: true
      merge_on: ["sk_compensation"]
      z_order_by: ["person_number", "dt_valid_from"]
    fact_salary_table_targets:
      vacuum_retention_hours: 168
      vacuum_lite: true
      z_order_by: ["salary_table", "band", "dt_reference"]
    dim_plr_parameters:
      vacuum_retention_hours: 168
      vacuum_lite: true
