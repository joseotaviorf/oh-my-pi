cluster:
  type: emr_7_12_consolidation_s_memory_fleet_cluster
  custom_configurations:
    aws_attributes:
      instance_profile_arn: '{{ var.value.emr_instance_profile_arn_people }}'
    core_nodes:
      target_on_demand: 2
      target_spot: 0
      instance_types:
      - r6g.xlarge
      - r7g.xlarge
      - r6i.xlarge
    task_nodes:
      instance_types:
      - r6g.xlarge
      - r7g.xlarge
      - r6i.xlarge
      target_on_demand: 0
      target_spot: 3
      allocation_strategy: price-capacity-optimized
      bid_price_percentage: 100
  access_control_list:
    group_name: people-analytics
    permission_level: CAN_MANAGE
  custom_libraries:
  - whl: '{artifacts_bucket}/gsheets-api-client-python/quintoandar_gsheets_api_client-0.7.0-py2.py3-none-any.whl'
  # EMR installs whl entries with --no-deps; declare wheel runtime deps explicitly.
  - pypi:
      package: gspread==5.5.0
  - pypi:
      package: oauth2client==4.1.3
  - pypi:
      package: google-auth==2.23.0
  - pypi:
      package: google-api-python-client==2.55.0
