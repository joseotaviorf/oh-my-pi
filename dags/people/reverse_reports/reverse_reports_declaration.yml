    # Use context: Weekly P&T headcount base (active + terminated) with termination date,
    # scoped by L1 manager (CTO + CPO). Consumed by FP&A and P&T leadership (Paulo Golgher / Rafael Castro).
    # Business Owner: fabiano.ribeiro@quintoandar.com.br
