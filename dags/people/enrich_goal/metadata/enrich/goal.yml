database_name: datalake_pin
table_name: goal
owner: pedro.prates@quintoandar.com.br
domain: People
description: |-
  Enriched table that consolidates goal information from PIN system. It includes goal details, 
  categorization (KPI or Project), measurement units, goal orientation, target values, and 
  associated person and review period information. Only includes active goals with categories 
  'kpi' or 'project'.
columns:
  id_goal:
    description: Unique identifier for the goal. Primary key of the table.
    lineage:
    - datalake_pin_goal_clean.goal.id_goal
  person_number:
    description: Person number of the employee to whom the goal is assigned.
    lineage:
    - datalake_pin_core_clean.all_people.person_number
  assigned_by_person_number:
    description: Person number of the person who assigned the goal.
    lineage:
    - datalake_pin_core_clean.all_people.person_number
  name:
    description: Preferred full name of the person to whom the goal is assigned.
    lineage:
    - datalake_people.identifier_mapping.name
  review_period_name:
    description: Name of the review period associated with the goal plan, in Portuguese (PTB).
    lineage:
    - datalake_pin_talent_clean.review_period_translation.review_period_name
  goal_plan_name:
    description: Name of the goal plan, in Portuguese (PTB).
    lineage:
    - datalake_pin_goal_clean.goal_plan_translation.goal_plan_name
  goal_name:
    description: Name of the goal.
    lineage:
    - datalake_pin_goal_clean.goal.goal_name
  expected_completion_period:
    description: Expected completion period for the goal.
    lineage:
    - datalake_pin_goal_clean.goal.expected_completion_period
  category:
    description: |-
      Normalized category of the goal. Can be 'kpi' (for Indicador/KPI or IndicadorKpi) 
      or 'project' (for Projeto ou Processo Crítico or ProjetoOuProcessoCriticoProjec).
    lineage:
    - datalake_pin_goal_clean.goal.goal_category
  measurement_unit:
    description: |-
      Measurement unit for KPI goals. Can be 'value', 'percentage', or 'number'. 
      NULL for non-KPI goals.
    lineage:
    - datalake_pin_goal_clean.goal.attribute1_text
  goal_orientation:
    description: |-
      Goal orientation indicating whether higher or lower values are better. 
      Can be 'maximize' or 'minimize'. NULL for non-KPI goals.
    lineage:
    - datalake_pin_goal_clean.goal.attribute2_text
  goal_weight:
    description: Weight of the goal within the goal plan.
    lineage:
    - datalake_pin_goal_clean.goal_plan_to_goal.goal_weight
  minimum_value:
    description: |-
      Minimum value for the goal. For KPI goals, this is attribute_number1_value. 
      For project goals, this is attribute1_text. NULL for other categories.
    lineage:
    - datalake_pin_goal_clean.goal.attribute_number1_value
    - datalake_pin_goal_clean.goal.attribute1_text
  target_value:
    description: |-
      Target value for the goal. For KPI goals, this is attribute_number2_value. 
      For project goals, this is attribute2_text. NULL for other categories.
    lineage:
    - datalake_pin_goal_clean.goal.attribute_number2_value
    - datalake_pin_goal_clean.goal.attribute2_text
  maximum_value:
    description: |-
      Maximum value for the goal. For KPI goals, this is attribute_number3_value. 
      For project goals, this is attribute3_text. NULL for other categories.
    lineage:
    - datalake_pin_goal_clean.goal.attribute_number3_value
    - datalake_pin_goal_clean.goal.attribute3_text
  result_value:
    description: |-
      Result value for the goal. For KPI goals, this is attribute_number4_value. 
      For project goals, this is attribute_number1_value. NULL for other categories.
    lineage:
    - datalake_pin_goal_clean.goal.attribute_number4_value
    - datalake_pin_goal_clean.goal.attribute_number1_value
  achievement_percentage:
    description: |-
      Calculated achievement percentage based on goal category, orientation, and threshold values. 
      For project goals: result_value * 0.01 (1%). For KPI goals with minimum and maximum thresholds: 
      linear interpolation between 0.7 (70% at minimum) and 1.0 (100% at target) for the first range, 
      and between 1.0 (100% at target) and 1.2 (120% at maximum) for the second range, capped at 1.2. 
      For KPI goals without thresholds: simple ratio calculation (result/target for maximize, 
      target/result for minimize). Returns NULL if required fields are missing or result_value is NULL.
    lineage:
    - datalake_pin.goal.result_value
    - datalake_pin.goal.minimum_value
    - datalake_pin.goal.target_value
    - datalake_pin.goal.maximum_value
    - datalake_pin.goal.category
    - datalake_pin.goal.goal_orientation
  dt_started:
    description: Date when the goal was started.
    lineage:
    - datalake_pin_goal_clean.goal.dt_started
  dt_target_completion:
    description: Target completion date for the goal.
    lineage:
    - datalake_pin_goal_clean.goal.dt_target_completion
  ts_modified:
    description: Timestamp of when the goal was last modified in the source system.
    lineage:
    - datalake_pin_goal_clean.goal.ts_modified
  ts_created:
    description: Timestamp of when the goal was created in the source system.
    lineage:
    - datalake_pin_goal_clean.goal.ts_created
  ts_updated:
    description: Timestamp of when the goal was last updated in the source system.
    lineage:
    - datalake_pin_goal_clean.goal.ts_updated
  ts_load:
    description: Timestamp of when the record was loaded or last updated in this table.
    lineage:
    - datalake_pin_goal_clean.goal.ts_load