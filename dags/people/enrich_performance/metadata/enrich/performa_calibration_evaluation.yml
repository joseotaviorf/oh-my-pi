database_name: datalake_performance
table_name: performa_calibration_evaluation
owner: pedro.prates@quintoandar.com.br
domain: People
description: |-
  Consolidates calibration results from the Performa cycle. Contains both pre-calibration (initial) and post-calibration (calibrated) ratings for three performance dimensions: Behavior, Impact, and Leadership. Each row represents a calibration evaluation for an employee during a calibration meeting, showing the comparison between initial and calibrated ratings for each dimension.
columns:
  id_calibration_evaluation:
    description: Unique identifier for the dashboard containing the calibration evaluation.
    lineage:
    - datalake_pin_hr_review_clean.dashboard.id_dashboard
  person_number:
    description: Unique identifier for the person (employee) who was evaluated.
    lineage:
    - datalake_people.identifier_mapping.person_number
  id_meeting:
    description: Unique identifier for the calibration meeting where the evaluation was performed.
    lineage:
    - datalake_pin_hr_review_clean.meeting.id_meeting
  meeting_year:
    description: Year when the calibration meeting occurred. Extracted from the meeting timestamp (ts_meeting) or meeting creation timestamp (ts_created) as fallback.
    lineage:
    - datalake_pin_hr_review_clean.meeting.ts_meeting
    - datalake_pin_hr_review_clean.meeting.ts_created
  meeting_title:
    description: Title or name of the calibration meeting.
    lineage:
    - datalake_pin_hr_review_clean.meeting.meeting_title
  meeting_status_code:
    description: Status code of the calibration meeting.
    lineage:
    - datalake_pin_hr_review_clean.meeting.meeting_status_code
  calibrated_behavior_description:
    description: Textual description of the calibrated (post-meeting) Behavior rating.
    lineage:
    - datalake_pin_hr_review_clean.dashboard.id_metric_calibrated_value_4
    - datalake_pin_talent_clean.rating_level_translation.rating_description
  calibrated_behavior_numeric:
    description: Numeric value of the calibrated (post-meeting) Behavior rating.
    lineage:
    - datalake_pin_hr_review_clean.dashboard.id_metric_calibrated_value_4
    - datalake_pin_talent_clean.rating_level_base.numeric_rating
  pre_calibration_behavior_description:
    description: Textual description of the pre-calibration (initial) Behavior rating before the meeting.
    lineage:
    - datalake_pin_hr_review_clean.dashboard.id_metric_value_4
    - datalake_pin_talent_clean.rating_level_translation.rating_description
  pre_calibration_behavior_numeric:
    description: Numeric value of the pre-calibration (initial) Behavior rating before the meeting.
    lineage:
    - datalake_pin_hr_review_clean.dashboard.id_metric_value_4
    - datalake_pin_talent_clean.rating_level_base.numeric_rating
  calibrated_impact_description:
    description: Textual description of the calibrated (post-meeting) Impact rating.
    lineage:
    - datalake_pin_hr_review_clean.dashboard.id_metric_calibrated_value_5
    - datalake_pin_talent_clean.rating_level_translation.rating_description
  calibrated_impact_numeric:
    description: Numeric value of the calibrated (post-meeting) Impact rating.
    lineage:
    - datalake_pin_hr_review_clean.dashboard.id_metric_calibrated_value_5
    - datalake_pin_talent_clean.rating_level_base.numeric_rating
  pre_calibration_impact_description:
    description: Textual description of the pre-calibration (initial) Impact rating before the meeting.
    lineage:
    - datalake_pin_hr_review_clean.dashboard.id_metric_value_5
    - datalake_pin_talent_clean.rating_level_translation.rating_description
  pre_calibration_impact_numeric:
    description: Numeric value of the pre-calibration (initial) Impact rating before the meeting.
    lineage:
    - datalake_pin_hr_review_clean.dashboard.id_metric_value_5
    - datalake_pin_talent_clean.rating_level_base.numeric_rating
  calibrated_leadership_description:
    description: Textual description of the calibrated (post-meeting) Leadership rating.
    lineage:
    - datalake_pin_hr_review_clean.dashboard.id_metric_calibrated_value_3
    - datalake_pin_talent_clean.rating_level_translation.rating_description
  calibrated_leadership_numeric:
    description: Numeric value of the calibrated (post-meeting) Leadership rating.
    lineage:
    - datalake_pin_hr_review_clean.dashboard.id_metric_calibrated_value_3
    - datalake_pin_talent_clean.rating_level_base.numeric_rating
  pre_calibration_leadership_description:
    description: Textual description of the pre-calibration (initial) Leadership rating before the meeting.
    lineage:
    - datalake_pin_hr_review_clean.dashboard.id_metric_value_3
    - datalake_pin_talent_clean.rating_level_translation.rating_description
  pre_calibration_leadership_numeric:
    description: Numeric value of the pre-calibration (initial) Leadership rating before the meeting.
    lineage:
    - datalake_pin_hr_review_clean.dashboard.id_metric_value_3
    - datalake_pin_talent_clean.rating_level_base.numeric_rating
  ts_meeting:
    description: Timestamp of when the calibration meeting occurred.
    lineage:
    - datalake_pin_hr_review_clean.meeting.ts_meeting

