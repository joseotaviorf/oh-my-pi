---
database_name: datalake_pin
table_name: performance_calibration
owner: isabella.araujo@quintoandar.com.br
domain: people
description: Table that stores the consolidated results of the performance calibration process. It contains evaluations from different perspectives (self-assessment, manager, calibration) for each section of an employee's performance review.
columns:
