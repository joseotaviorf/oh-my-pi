      - datalake_pin_performance_clean.evaluation.id_assignment
  id_period_of_service:
    description: 'Unique identifier for the period of service of an employee.'
    lineage:
      - datalake_hr_system.employee_ids.id_period_of_service
  id_assignment:
    description: 'Unique identifier for the assignment of an employee.'
    lineage:
      - datalake_pin_performance_clean.evaluation.id_assignment
  id_evaluation:
    description: 'Unique identifier for a specific performance evaluation. Primary key of the evaluation.'
    lineage:
      - datalake_pin_performance_clean.evaluation.id_evaluation
  id_eval_section:
