database_name: datalake_performance
table_name: performance_evaluation
owner: isabella.araujo@quintoandar.com.br
domain: People
description: |-
  Table that consolidates the results of the performance evaluation process. It contains evaluations from different perspectives (self-assessment and manager) for each section of an employee's performance review (Impact, Leadership, Behavior). Each evaluation type (SELF or MANAGER) is represented as a separate row, with each section pivoted into its own set of columns.
columns:
  id_performance_rating:
    description: MD5 hash that represents a unique identifier for the set of evaluation descriptions (Behavior, Impact, Leadership) for the specific evaluation type (SELF or MANAGER).
    lineage:
    - datalake_pin_performance_clean.section_definition_translation.name
    - datalake_pin_talent_clean.rating_level_translation.rating_description
  id_assignment:
    description: Unique identifier for an employee's assignment.
    lineage:
    - datalake_pin_performance_clean.evaluation.id_assignment
  id_period_of_service:
    description: Unique identifier for an employee's period of service.
    lineage:
    - datalake_employee_registration.identifier_mapping.id_period_of_service
  id_evaluation:
    description: Unique identifier for a specific performance evaluation. Acts as the grain of the table.
    lineage:
    - datalake_pin_performance_clean.evaluation.id_evaluation
  id_person:
    description: Unique identifier for the person (employee).
    lineage:
    - datalake_employee_registration.identifier_mapping.id_person
  assignment_number:
    description: The assignment number associated with the employee.
    lineage:
    - datalake_employee_registration.identifier_mapping.assignment_number
  manager_assignment_number:
    description: The assignment number associated with the manager registered at evaluation.
    lineage:
    - datalake_employee_registration.identifier_mapping.assignment_number
    - datalake_pin_performance_clean.evaluation.id_manager_assignment
  id_impact_rating_level:
    description: Identifier of the rating level for the Impact section, assigned by the evaluation type (SELF or MANAGER).
    lineage:
    - datalake_pin_performance_clean.section_definition_translation.name
    - datalake_pin_talent_clean.rating_level_translation.id_rating_level
  id_leadership_rating_level:
    description: Identifier of the rating level for the Leadership section, assigned by the evaluation type (SELF or MANAGER).
    lineage:
    - datalake_pin_performance_clean.section_definition_translation.name
    - datalake_pin_talent_clean.rating_level_translation.id_rating_level
  id_behavior_rating_level:
    description: Identifier of the rating level for the Behavior section, assigned by the evaluation type (SELF or MANAGER).
    lineage:
    - datalake_pin_performance_clean.section_definition_translation.name
    - datalake_pin_talent_clean.rating_level_translation.id_rating_level
  cycle_name:
    description: Name of the performance review cycle.
    lineage:
    - datalake_pin_talent_clean.review_period_translation.review_period_name
  evaluation_type:
    description: Type of evaluation perspective. Can be 'SELF' (self-assessment by the employee) or 'MANAGER' (evaluation by the manager).
    lineage:
    - datalake_pin_performance_clean.evaluation_rating.role_type
  description_impact:
    description: Textual description of the rating for the Impact section, from the evaluation type (SELF or MANAGER).
    lineage:
    - datalake_pin_performance_clean.section_definition_translation.name
    - datalake_pin_talent_clean.rating_level_translation.rating_description
  description_leadership:
    description: Textual description of the rating for the Leadership section, from the evaluation type (SELF or MANAGER).
    lineage:
    - datalake_pin_performance_clean.section_definition_translation.name
    - datalake_pin_talent_clean.rating_level_translation.rating_description
  description_behavior:
    description: Textual description of the rating for the Behavior section, from the evaluation type (SELF or MANAGER).
    lineage:
    - datalake_pin_performance_clean.section_definition_translation.name
    - datalake_pin_talent_clean.rating_level_translation.rating_description
  numeric_impact:
    description: Numeric value of the rating for the Impact section, from the evaluation type (SELF or MANAGER).
    lineage:
    - datalake_pin_performance_clean.section_definition_translation.name
    - datalake_pin_talent_clean.rating_level_base.numeric_rating
  numeric_leadership:
    description: Numeric value of the rating for the Leadership section, from the evaluation type (SELF or MANAGER).
    lineage:
    - datalake_pin_performance_clean.section_definition_translation.name
    - datalake_pin_talent_clean.rating_level_base.numeric_rating
  numeric_behavior:
    description: Numeric value of the rating for the Behavior section, from the evaluation type (SELF or MANAGER).
    lineage:
    - datalake_pin_performance_clean.section_definition_translation.name
    - datalake_pin_talent_clean.rating_level_base.numeric_rating
  dt_evaluation_occurred:
    description: Date when the performance evaluation occurred.
    lineage:
    - datalake_pin_performance_clean.evaluation.dt_evaluation_occurred
  dt_performance_document_started:
    description: Date when the performance document was started.
    lineage:
    - datalake_pin_performance_clean.evaluation.dt_performance_document_started
  dt_performance_document_ended:
    description: Date when the performance document was completed.
    lineage:
    - datalake_pin_performance_clean.evaluation.dt_performance_document_ended
  ts_created:
    description: Timestamp of when the evaluation was created in the source system.
    lineage:
    - datalake_pin_performance_clean.evaluation.ts_created
  ts_updated:
    description: Timestamp of when the evaluation was last updated in the source system.
    lineage:
    - datalake_pin_performance_clean.evaluation.ts_updated
  ts_load:
    description: Timestamp of when the record was loaded or last updated in this table.
  year:
    description: Year when the performance document was started.
    lineage:
    - datalake_pin_performance_clean.evaluation.dt_performance_document_started
  month:
    description: Month when the performance document was started.
    lineage:
    - datalake_pin_performance_clean.evaluation.dt_performance_document_started
  day:
    description: Day when the performance document was started.
    lineage:
    - datalake_pin_performance_clean.evaluation.dt_performance_document_started
