    lineage:
    - datalake_pin_performance_clean.section_definition_translation.name
    - datalake_pin_talent_clean.rating_level_translation.id_rating_level
  id_leadership_rating_level_from_calibration:
    description: Identifier of the final rating level for the Leadership section, defined during the calibration process.
    lineage:
    - datalake_pin_performance_clean.section_definition_translation.name
    - datalake_pin_talent_clean.rating_level_translation.id_rating_level
  id_behavior_rating_level_from_self:
