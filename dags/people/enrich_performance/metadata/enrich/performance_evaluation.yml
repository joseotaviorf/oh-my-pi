    - datalake_pin_talent_clean.rating_level_translation.id_rating_level
  cycle_name:
    description: Name of the performance review cycle.
    lineage:
    - datalake_pin_talent_clean.review_period_translation.review_period_name
  description_impact_from_self:
    description: Textual description of the rating for the Impact section, from the employee (self-assessment).
