database_name: datalake_performance
table_name: performance_evaluation
owner: isabella.araujo@quintoandar.com.br
domain: People
description: |-
  Table that consolidates the results of the performance evaluation process. It contains evaluations from different perspectives (self-assessment, manager, calibration) for each section of an employee's performance review (Impact, Leadership, Behavior), with each section pivoted into its own set of columns.
columns:
  id_performance_rating_from_manager:
    description: MD5 hash that represents a unique identifier for the set of manager's evaluation descriptions (Behavior, Impact, Leadership).
    lineage:
    - datalake_pin_performance_clean.section_definition_translation.name
    - datalake_pin_talent_clean.rating_level_translation.rating_description
  id_performance_rating_from_calibration:
    description: MD5 hash that represents a unique identifier for the set of calibration evaluation descriptions (Behavior, Impact, Leadership).
    lineage:
    - datalake_pin_performance_clean.section_definition_translation.name
    - datalake_pin_talent_clean.rating_level_translation.rating_description
  id_performance_rating_from_self:
    description: MD5 hash that represents a unique identifier for the set of self-assessment descriptions (Behavior, Impact, Leadership).
    lineage:
    - datalake_pin_performance_clean.section_definition_translation.name
    - datalake_pin_talent_clean.rating_level_translation.rating_description
  id_assignment:
    description: Unique identifier for an employee's assignment.
    lineage:
    - datalake_pin_performance_clean.evaluation.id_assignment
  id_period_of_service:
    description: Unique identifier for an employee's period of service.
    lineage:
    - datalake_employee_registration.identifier_mapping.id_period_of_service
  id_evaluation:
    description: Unique identifier for a specific performance evaluation. Acts as the grain of the table.
    lineage:
    - datalake_pin_performance_clean.evaluation.id_evaluation
  id_person:
    description: Unique identifier for the person (employee).
    lineage:
    - datalake_employee_registration.identifier_mapping.id_person
  assignment_number:
    description: The assignment number associated with the employee.
    lineage:
    - datalake_employee_registration.identifier_mapping.assignment_number
  id_impact_rating_level_from_self:
    description: Identifier of the rating level for the Impact section, assigned by the employee (self-assessment).
    lineage:
    - datalake_pin_performance_clean.section_definition_translation.name
    - datalake_pin_talent_clean.rating_level_translation.id_rating_level
  id_impact_rating_level_from_manager:
    description: Identifier of the rating level for the Impact section, assigned by the manager.
    lineage:
    - datalake_pin_performance_clean.section_definition_translation.name
    - datalake_pin_talent_clean.rating_level_translation.id_rating_level
  id_impact_rating_level_from_calibration:
    description: Identifier of the final rating level for the Impact section, defined during the calibration process.
    lineage:
    - datalake_pin_performance_clean.section_definition_translation.name
    - datalake_pin_talent_clean.rating_level_translation.id_rating_level
  id_leadership_rating_level_from_self:
    description: Identifier of the rating level for the Leadership section, assigned by the employee (self-assessment).
    lineage:
    - datalake_pin_performance_clean.section_definition_translation.name
    - datalake_pin_talent_clean.rating_level_translation.id_rating_level
  id_leadership_rating_level_from_manager:
