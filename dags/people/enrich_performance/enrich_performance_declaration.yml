dag:
  name: enrich_performance
  owner: Data People
  callback_by_task: False
  schedule_start_date: 2025, 7, 3
  documentation:
    dag_purpose: This DAG brings enriched PIN data about Performance and Talent Reviews. 
workflow:
  type: query_delta
  layer: enrich
  has_hive_sync: true
  bucket_config_name: people_bucket
  default_table_privileges:
    people-team: ["ALL PRIVILEGES"]
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  tables_customization:
    performance_evaluation:
      vacuum_retention_hours: 168
      vacuum_lite: true
    talent_review:
      vacuum_retention_hours: 168
      vacuum_lite: true
    goal:
      vacuum_retention_hours: 168
      vacuum_lite: true
