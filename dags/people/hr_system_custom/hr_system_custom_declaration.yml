dag:
  name: hr_system_custom
  dag_documentation:
    dag_purpose: |
      Retrieve data from Oracle HR System CUSTOM API, a sub product of Oracle Human Capital Resources (Oracle HCM).
      Static DAG: legacy registration data rarely changes; no schedule (manual trigger only). Downstream DAGs (e.g. enrich_people) do not wait for it.
  owner: Data People
  callback_by_task: False
cluster:
  type: databricks_16_4_small_memory_people_cluster
  access_control_list:
    group_name: people-analytics
    permission_level: CAN_MANAGE
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
workflow:
  layer: raw
  type: custom_ingestion
  bucket_config_name: people_bucket
  has_hive_sync: false
  load_spark_job: load_hr_system_custom_raw
  spark_job_arguments:
  - "{environment}"
  - "{bucket}"
  - "{dag_name}"
  - "{table_name}"
  tables_customization:
    workers_registration:
      merge_on: ["assignment_number"]
      vacuum_retention_hours: 168
      vacuum_lite: true
  default_table_privileges:
    people-team:
    - ALL PRIVILEGES
