dag:
  name: enrich_pin
  owner: Data People
  callback_by_task: False
  schedule_start_date: 2025, 5, 20
  documentation:
    dag_purpose: This DAG brings enriched PIN data extracted from Oracle Integration Cloud. It will contain data such as Performance, Talent, position and leadership.
workflow:
  type: query_delta
  layer: enrich
  has_hive_sync: true
  bucket_config_name: people_bucket
  default_table_privileges:
    people-team: ["ALL PRIVILEGES"]
  tables_customization:
    managers_history:
      vacuum_retention_hours: 168
      vacuum_lite: true
    movement_details:
      vacuum_retention_hours: 168
      vacuum_lite: true
