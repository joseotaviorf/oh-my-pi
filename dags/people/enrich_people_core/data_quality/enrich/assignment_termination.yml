---
table_name: datalake_people_core.assignment_termination
alert_channel: PEOPLE_ALERTS

table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Warning
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: -20
    less_than_or_equal_to: 20
    severity_level: Warning

column_level_validations:
  id_assignment:
    is_unique:
      severity_level: Error
    is_complete:
      severity_level: Error
  person_number:
    is_complete:
      severity_level: Error
  assignment_number:
    is_complete:
      severity_level: Warning
  dt_hired:
    is_complete:
      severity_level: Error
  dt_terminated:
    # Ensures every row has at least one of dt_terminated or dt_notified (table filter rule).
    custom:
      constraint: |-
        (SELECT COUNT(*)
         FROM datalake_people_core.assignment_termination
         WHERE dt_terminated IS NULL
           AND dt_notified IS NULL
        ) = 0
      severity_level: Error
  ts_load:
    is_complete:
      severity_level: Error
