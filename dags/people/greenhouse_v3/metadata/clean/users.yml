database_name: datalake_greenhouse_v3_clean
table_name: users
owner: gabriel.berger@quintoandar.com.br
domain: People
description: |-
  Table containing users information, sourced from the Greenhouse Harvest API v3 'users' endpoint. Users represent people who have access to the Greenhouse system.
columns:
  id:
    description: The user's unique identifier.
    lineage:
    - datalake_greenhouse_v3_raw.users.id
  id_agency:
    description: The unique identifier of the agency associated with this user, if applicable.
    lineage:
    - datalake_greenhouse_v3_raw.users.agency_id
  id_employee:
    description: The employee identifier associated with this user, if applicable.
    lineage:
    - datalake_greenhouse_v3_raw.users.employee_id
  first_name:
    description: The user's first name.
    lineage:
    - datalake_greenhouse_v3_raw.users.first_name
  last_name:
    description: The user's last name.
    lineage:
    - datalake_greenhouse_v3_raw.users.last_name
  name:
    description: The user's full name.
    lineage:
    - datalake_greenhouse_v3_raw.users.name
  primary_email:
    description: The user's primary email address.
    lineage:
    - datalake_greenhouse_v3_raw.users.primary_email
  job_title:
    description: The user's job title.
    lineage:
    - datalake_greenhouse_v3_raw.users.job_title
  is_deactivated:
    description: A boolean flag indicating whether the user is deactivated.
    lineage:
    - datalake_greenhouse_v3_raw.users.deactivated
  is_site_admin:
    description: A boolean flag indicating whether the user is a site administrator.
    lineage:
    - datalake_greenhouse_v3_raw.users.site_admin
  ts_created:
    description: The timestamp when the user record was created.
    lineage:
    - datalake_greenhouse_v3_raw.users.created_at
  ts_updated:
    description: The timestamp when the user record was last updated.
    lineage:
    - datalake_greenhouse_v3_raw.users.updated_at
  ts_load:
    description: The timestamp when the record was loaded into the clean layer.
  year:
    description: The year extracted from the 'updated_at' timestamp, used for partitioning.
    lineage:
    - datalake_greenhouse_v3_raw.users.year
  month:
    description: The month extracted from the 'updated_at' timestamp, used for partitioning.
    lineage:
    - datalake_greenhouse_v3_raw.users.month
  day:
    description: The day extracted from the 'updated_at' timestamp, used for partitioning.
    lineage:
    - datalake_greenhouse_v3_raw.users.day
  linked_candidate_ids:
    description: Array of candidate IDs linked to this user.
    lineage:
    - datalake_greenhouse_v3_raw.users.linked_candidate_ids
  office_ids:
    description: Array of office IDs associated with this user.
    lineage:
    - datalake_greenhouse_v3_raw.users.office_ids
  department_ids:
    description: Array of department IDs associated with this user.
    lineage:
    - datalake_greenhouse_v3_raw.users.department_ids
  interviewer_tags:
    description: Array of interviewer tag objects associated with this user.
    lineage:
    - datalake_greenhouse_v3_raw.users.interviewer_tags
  custom_fields:
    description: Custom fields object associated with this user, if applicable.
    lineage:
    - datalake_greenhouse_v3_raw.users.custom_fields

