database_name: datalake_greenhouse_v3_clean
table_name: demographic_questions
owner: isabella.araujo@quintoandar.com.br
domain: People
description: |-
  Table containing demographic questions, sourced from the Greenhouse Harvest API v3 'demographic_questions' endpoint.
columns:
  id_demographic_question:
    description: The demographic question's unique identifier.
    lineage:
    - datalake_greenhouse_v3_raw.demographic_questions.id
  id_demographic_question_set:
    description: The demographic question set's unique identifier.
    lineage:
    - datalake_greenhouse_v3_raw.demographic_questions.demographic_question_set_id
  name:
    description: The name of the demographic question.
    lineage:
    - datalake_greenhouse_v3_raw.demographic_questions.name
  answer_type:
    description: The type of answer expected for the question.
    lineage:
    - datalake_greenhouse_v3_raw.demographic_questions.answer_type
  language:
    description: The language of the question. Hardcoded as 'en' since v3 API no longer provides the translations array.
  is_active:
    description: A boolean flag indicating if the question is active.
    lineage:
    - datalake_greenhouse_v3_raw.demographic_questions.active
  is_required:
    description: A boolean flag indicating if the question is required.
    lineage:
    - datalake_greenhouse_v3_raw.demographic_questions.required
  ts_load:
    description: The timestamp when the record was loaded into the clean layer.
  year:
    description: The year the data was loaded into the raw layer, used for partitioning.
    lineage:
    - datalake_greenhouse_v3_raw.demographic_questions.year
  month:
    description: The month the data was loaded into the raw layer, used for partitioning.
    lineage:
    - datalake_greenhouse_v3_raw.demographic_questions.month
  day:
    description: The day the data was loaded into the raw layer, used for partitioning.
    lineage:
    - datalake_greenhouse_v3_raw.demographic_questions.day
