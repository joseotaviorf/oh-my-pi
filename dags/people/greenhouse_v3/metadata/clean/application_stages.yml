database_name: datalake_greenhouse_v3_clean
table_name: application_stages
owner: isabella.araujo@quintoandar.com.br
domain: People
description: |-
  Table containing the stages an application has gone through, sourced from the Greenhouse Harvest API v3 'application_stages' endpoint.
  When the raw feed contains duplicate application stage ids in the same incremental batch, the clean layer keeps one row per id, preferring the latest ts_updated, then latest ts_created, then latest ingestion partition (year, month, day).
columns:
  id:
    description: The application stage's unique identifier.
    lineage:
    - datalake_greenhouse_v3_raw.application_stages.id
  id_application:
    description: The unique identifier of the application.
    lineage:
    - datalake_greenhouse_v3_raw.application_stages.application_id
  id_job_interview_stage:
    description: The unique identifier of the job interview stage.
    lineage:
    - datalake_greenhouse_v3_raw.application_stages.job_interview_stage_id
  days_in_stage:
    description: The number of days the application has been in this stage.
    lineage:
    - datalake_greenhouse_v3_raw.application_stages.days_in_stage
  is_current:
    description: A boolean flag indicating if this is the current stage for the application.
    lineage:
    - datalake_greenhouse_v3_raw.application_stages.current
  ts_created:
    description: The timestamp when the stage entry was created.
    lineage:
    - datalake_greenhouse_v3_raw.application_stages.created_at
  ts_updated:
    description: The timestamp when the stage entry was last updated.
    lineage:
    - datalake_greenhouse_v3_raw.application_stages.updated_at
  ts_entered:
    description: The timestamp when the application entered this stage.
    lineage:
    - datalake_greenhouse_v3_raw.application_stages.entered_at
  ts_exited:
    description: The timestamp when the application exited this stage.
    lineage:
    - datalake_greenhouse_v3_raw.application_stages.exited_at
  ts_load:
    description: The timestamp when the record was loaded into the clean layer.
  year:
    description: The year extracted from the 'updated_at' timestamp, used for partitioning.
    lineage:
    - datalake_greenhouse_v3_raw.application_stages.year
  month:
    description: The month extracted from the 'updated_at' timestamp, used for partitioning.
    lineage:
    - datalake_greenhouse_v3_raw.application_stages.month
  day:
    description: The day extracted from the 'updated_at' timestamp, used for partitioning.
    lineage:
    - datalake_greenhouse_v3_raw.application_stages.day
