database_name: datalake_greenhouse_v3_clean
table_name: offers
owner: isabella.araujo@quintoandar.com.br
domain: People
description: |-
  Table containing offer data, sourced from the Greenhouse Harvest API v3 'offers' endpoint.
  In v3, 'sent_at' was renamed to 'sent_on', 'starts_at' to 'starts_on', the 'opening' nested object
  became a scalar 'opening_id', and 'keyed_custom_fields' was renamed to 'custom_fields'.
columns:
  id_offer:
    description: The offer's unique identifier.
    lineage:
    - datalake_greenhouse_v3_raw.offers.id
  id_application:
    description: The application's unique identifier.
    lineage:
    - datalake_greenhouse_v3_raw.offers.application_id
  id_job:
    description: The job's unique identifier.
    lineage:
    - datalake_greenhouse_v3_raw.offers.job_id
  id_candidate:
    description: The candidate's unique identifier.
    lineage:
    - datalake_greenhouse_v3_raw.offers.candidate_id
  id_opening:
    description: The opening's unique identifier (scalar in v3, was nested object in v1).
    lineage:
    - datalake_greenhouse_v3_raw.offers.opening_id
  status:
    description: The current status of the offer (e.g., created, accepted, rejected).
    lineage:
    - datalake_greenhouse_v3_raw.offers.status
  workplace_address:
    description: The workplace address for the offer.
    lineage:
    - datalake_greenhouse_v3_raw.offers.custom_fields.workplace_address.value
  employment_type:
    description: The employment type for the offer (e.g., CLT, PJ).
    lineage:
    - datalake_greenhouse_v3_raw.offers.custom_fields.employment_type.value
  workplace:
    description: The workplace type for the offer (e.g., Remote, Hybrid, On-site).
    lineage:
    - datalake_greenhouse_v3_raw.offers.custom_fields.workplace.value
  reporting_to_manager_name:
    description: The name of the hiring manager the candidate will report to.
    lineage:
    - datalake_greenhouse_v3_raw.offers.custom_fields.reporting_to_manager.value.name
  version:
    description: The version number of the offer.
    lineage:
    - datalake_greenhouse_v3_raw.offers.version
  salary_unit:
    description: The currency unit for the monthly salary.
    lineage:
    - datalake_greenhouse_v3_raw.offers.custom_fields.salary.value.unit
  annual_salary_unit:
    description: The currency unit for the annual salary.
    lineage:
    - datalake_greenhouse_v3_raw.offers.custom_fields.brasil_annual_salary_amount.value.unit
  hiring_bonus_unit:
    description: The currency unit for the hiring bonus.
    lineage:
    - datalake_greenhouse_v3_raw.offers.custom_fields.sign_on_bonus.value.unit
  stock_options_cash_unit:
    description: The currency unit for the stock options cash amount.
    lineage:
    - datalake_greenhouse_v3_raw.offers.custom_fields.stock_options_cash_amount_offered.value.unit
  salary_value:
    description: The monthly salary amount.
    lineage:
    - datalake_greenhouse_v3_raw.offers.custom_fields.salary.value.value
  annual_salary_value:
    description: The annual salary amount.
    lineage:
    - datalake_greenhouse_v3_raw.offers.custom_fields.brasil_annual_salary_amount.value.value
  hiring_bonus_value:
    description: The hiring bonus amount.
    lineage:
    - datalake_greenhouse_v3_raw.offers.custom_fields.sign_on_bonus.value.value
  stock_options_cash_value:
    description: The stock options cash amount offered.
    lineage:
    - datalake_greenhouse_v3_raw.offers.custom_fields.stock_options_cash_amount_offered.value.value
  has_hiring_bonus:
    description: A boolean flag indicating if a hiring bonus is included in the offer.
    lineage:
    - datalake_greenhouse_v3_raw.offers.custom_fields.include_hiring_bonus.value
  dt_offer_expires:
    description: The date when the offer expires.
    lineage:
    - datalake_greenhouse_v3_raw.offers.custom_fields.offer_expiration_date.value
  dt_trial_period_ends:
    description: The date when the trial period ends.
    lineage:
    - datalake_greenhouse_v3_raw.offers.custom_fields.trial_period.value
  ts_created:
    description: The timestamp when the offer was created.
    lineage:
    - datalake_greenhouse_v3_raw.offers.created_at
  ts_updated:
    description: The timestamp when the offer was last updated.
    lineage:
    - datalake_greenhouse_v3_raw.offers.updated_at
  ts_sent:
    description: The timestamp when the offer was sent (renamed from 'sent_at' to 'sent_on' in v3).
    lineage:
    - datalake_greenhouse_v3_raw.offers.sent_on
  ts_resolved:
    description: The timestamp when the offer was resolved (accepted or rejected).
    lineage:
    - datalake_greenhouse_v3_raw.offers.resolved_at
  ts_started:
    description: The start date for the offered position (renamed from 'starts_at' to 'starts_on' in v3).
    lineage:
    - datalake_greenhouse_v3_raw.offers.starts_on
  ts_load:
    description: The timestamp when the record was loaded into the clean layer.
  year:
    description: The year extracted from the 'updated_at' timestamp, used for partitioning.
    lineage:
    - datalake_greenhouse_v3_raw.offers.year
  month:
    description: The month extracted from the 'updated_at' timestamp, used for partitioning.
    lineage:
    - datalake_greenhouse_v3_raw.offers.month
  day:
    description: The day extracted from the 'updated_at' timestamp, used for partitioning.
    lineage:
    - datalake_greenhouse_v3_raw.offers.day
