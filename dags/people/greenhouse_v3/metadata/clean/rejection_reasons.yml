database_name: datalake_greenhouse_v3_clean
table_name: rejection_reasons
owner: isabella.araujo@quintoandar.com.br
domain: People
description: |-
  Table containing rejection reasons, sourced from the Greenhouse Harvest API v3 'rejection_reasons' endpoint.
columns:
  id_rejection_reason:
    description: The rejection reason's unique identifier.
    lineage:
    - datalake_greenhouse_v3_raw.rejection_reasons.id
  id_type:
    description: The rejection reason type's unique identifier.
    lineage:
    - datalake_greenhouse_v3_raw.rejection_reasons.type.id
  name:
    description: The name of the rejection reason.
    lineage:
    - datalake_greenhouse_v3_raw.rejection_reasons.name
  type_name:
    description: The name of the rejection reason type.
    lineage:
    - datalake_greenhouse_v3_raw.rejection_reasons.type.name
  ts_load:
    description: The timestamp when the record was loaded into the clean layer.
  year:
    description: The year the data was loaded into the raw layer, used for partitioning. Derived from the 'ts_load' column in the raw layer.
    lineage:
    - datalake_greenhouse_v3_raw.rejection_reasons.year
  month:
    description: The month the data was loaded into the raw layer, used for partitioning. Derived from the 'ts_load' column in the raw layer.
    lineage:
    - datalake_greenhouse_v3_raw.rejection_reasons.month
  day:
    description: The day the data was loaded into the raw layer, used for partitioning. Derived from the 'ts_load' column in the raw layer.
    lineage:
    - datalake_greenhouse_v3_raw.rejection_reasons.day
