database_name: datalake_greenhouse_v3_clean
table_name: openings
owner: isabella.araujo@quintoandar.com.br
domain: People
description: |-
  Table containing job opening data, sourced from the Greenhouse Harvest API v3 'openings' endpoint.
  In v3, openings are a standalone endpoint (previously embedded as a JSON array within the jobs response).
  All custom fields are flattened into top-level columns so the enrich layer can SELECT directly without FROM_JSON parsing.
columns:
  id_opening:
    description: The opening's unique identifier.
    lineage:
    - datalake_greenhouse_v3_raw.openings.id
  id_job:
    description: The unique identifier of the job this opening belongs to.
    lineage:
    - datalake_greenhouse_v3_raw.openings.job_id
  id_application_hired:
    description: The unique identifier of the application that was hired for this opening, if any.
    lineage:
    - datalake_greenhouse_v3_raw.openings.application_id
  id_ta_responsible:
    description: The user ID of the TA (Talent Acquisition) responsible for the opening.
    lineage:
    - datalake_greenhouse_v3_raw.openings.custom_fields.ta_responsible.value.user_id
  id_close_reason:
    description: The unique identifier of the reason the opening was closed, if applicable.
    lineage:
    - datalake_greenhouse_v3_raw.openings.close_reason_id
  code:
    description: The human-readable opening identifier (e.g. '366-1').
    lineage:
    - datalake_greenhouse_v3_raw.openings.opening_id
  status:
    description: The opening status, derived as 'open' when the opening is active and 'closed' otherwise.
    lineage:
    - datalake_greenhouse_v3_raw.openings.open
  ta_responsible_name:
    description: The full name of the TA responsible for the opening.
    lineage:
    - datalake_greenhouse_v3_raw.openings.custom_fields.ta_responsible.value.name
  ta_responsible_email:
    description: The email address of the TA responsible for the opening.
    lineage:
    - datalake_greenhouse_v3_raw.openings.custom_fields.ta_responsible.value.email
