database_name: datalake_greenhouse_v3_clean
table_name: custom_fields
owner: isabella.araujo@quintoandar.com.br
domain: People
description: |-
  Table containing custom field definitions, sourced from the Greenhouse Harvest API v3 'custom_fields' endpoint.
columns:
  id_custom_field:
    description: The custom field's unique identifier.
    lineage:
    - datalake_greenhouse_v3_raw.custom_fields.id
  name:
    description: Human-readable label of the custom field configured in Greenhouse ATS.
    lineage:
    - datalake_greenhouse_v3_raw.custom_fields.name
  field_type:
    description: The type of the custom field (e.g., candidate, job, offer).
    lineage:
    - datalake_greenhouse_v3_raw.custom_fields.field_type
  value_type:
    description: The data type of the custom field's value (e.g., short_text, boolean, currency).
    lineage:
    - datalake_greenhouse_v3_raw.custom_fields.value_type
  name_key:
    description: A unique, machine-readable key for the custom field.
    lineage:
    - datalake_greenhouse_v3_raw.custom_fields.name_key
  description:
    description: Guidance text explaining the purpose and expected values of the Greenhouse custom field.
    lineage:
    - datalake_greenhouse_v3_raw.custom_fields.description
  template_token_string:
    description: Placeholder token string used when rendering the custom field in Greenhouse templates.
    lineage:
    - datalake_greenhouse_v3_raw.custom_fields.template_token_string
  sort_order:
    description: The display sort order of the custom field.
    lineage:
    - datalake_greenhouse_v3_raw.custom_fields.sort_order
  is_active:
    description: A boolean flag indicating if the custom field is active.
    lineage:
    - datalake_greenhouse_v3_raw.custom_fields.active
  is_private:
    description: A boolean flag indicating if the custom field is private.
    lineage:
    - datalake_greenhouse_v3_raw.custom_fields.private
  is_required:
    description: A boolean flag indicating if the custom field is required.
    lineage:
    - datalake_greenhouse_v3_raw.custom_fields.required
  is_approval_required:
    description: A boolean flag indicating if approval is required for the custom field.
    lineage:
    - datalake_greenhouse_v3_raw.custom_fields.require_approval
  is_new_version_trigger:
    description: A boolean flag indicating if a new version is triggered when the field is updated.
    lineage:
    - datalake_greenhouse_v3_raw.custom_fields.trigger_new_version
  is_exposed_in_job_board_api:
    description: A boolean flag indicating if the custom field is exposed in the job board API.
    lineage:
    - datalake_greenhouse_v3_raw.custom_fields.expose_in_job_board_api
  is_api_only:
    description: A boolean flag indicating if the custom field is API-only.
    lineage:
    - datalake_greenhouse_v3_raw.custom_fields.api_only
  ts_load:
    description: The timestamp when the record was loaded into the clean layer.
  year:
    description: The year the data was loaded into the raw layer, used for partitioning. Derived from the 'ts_load' column in the raw layer.
    lineage:
    - datalake_greenhouse_v3_raw.custom_fields.year
  month:
    description: The month the data was loaded into the raw layer, used for partitioning. Derived from the 'ts_load' column in the raw layer.
    lineage:
    - datalake_greenhouse_v3_raw.custom_fields.month
  day:
    description: The day the data was loaded into the raw layer, used for partitioning. Derived from the 'ts_load' column in the raw layer.
    lineage:
    - datalake_greenhouse_v3_raw.custom_fields.day
