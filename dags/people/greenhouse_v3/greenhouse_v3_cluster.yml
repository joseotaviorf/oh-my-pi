cluster:
  type: emr_7_12_consolidation_xl_memory_fleet_cluster
  custom_configurations:
    autotermination_minutes: 120
    aws_attributes:
      instance_profile_arn: '{{ var.value.emr_instance_profile_arn_people }}'
    # Weekend hotfix (DBP-1895): xl fleet + larger client driver heap. Cap
    # concurrency at 3 so overlapping 32g JVMs fit on the master (YARN already
    # ran ~3 AMs). Spot task + autoterm 120 unchanged. Follow-up: stream pages.
    step_concurrency_level: 3
    spark_conf:
      spark.driver.memory: 32g
      spark.driver.memoryOverhead: 8g
    core_nodes:
      target_on_demand: 2
      target_spot: 0
      instance_types:
        - r6g.8xlarge
        - r7g.8xlarge
        - r6i.8xlarge
    task_nodes:
      instance_types:
        - r6g.8xlarge
        - r7g.8xlarge
        - r6i.8xlarge
      target_on_demand: 0
      target_spot: 1
      allocation_strategy: price-capacity-optimized
      bid_price_percentage: 100
