cluster:
  type: emr_7_12_consolidation_s_memory_fleet_cluster
  custom_configurations:
    autotermination_minutes: 120
    aws_attributes:
      instance_profile_arn: '{{ var.value.emr_instance_profile_arn_people }}'
    # PIN uses step_concurrency_level: 10 on xs_memory (6g drivers). This DAG keeps
    # the validated s_memory preset (8g drivers) with client deploy mode, so cap
    # concurrency to avoid OOM on the r6g.2xlarge master (~5 x 10 GiB/driver budget).
    step_concurrency_level: 5
    master_node_type_id: r6g.2xlarge
    core_nodes:
      target_on_demand: 2
      target_spot: 0
      instance_types:
        - r6g.xlarge
        - r7g.xlarge
        - r6i.xlarge
    task_nodes:
      instance_types:
        - r6g.xlarge
        - r7g.xlarge
        - r6i.xlarge
      target_on_demand: 0
      target_spot: 1
      allocation_strategy: price-capacity-optimized
      bid_price_percentage: 100
