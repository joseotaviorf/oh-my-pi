cluster:
  type: consolidation_s_memory_cluster
  databricks_conn_id: databricks_new
  access_control_list:
    group_name: people-analytics
    permission_level: CAN_MANAGE
  custom_configurations:
    aws_attributes:
      ebs_volume_size: 200
      instance_profile_arn: '{{ var.value.instance_profile_secret_arn_people }}'
    driver_node_type_id: r7g.4xlarge
validation:
  cluster:
    type: emr_7_12_consolidation_s_memory_fleet_cluster
    custom_configurations:
      aws_attributes:
        instance_profile_arn: '{{ var.value.emr_instance_profile_arn_people }}'
  allow_custom_spark_job: true
