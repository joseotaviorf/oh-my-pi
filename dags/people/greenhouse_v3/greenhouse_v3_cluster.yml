cluster:
  type: emr_7_12_consolidation_s_memory_fleet_cluster
  custom_configurations:
    autotermination_minutes: 120
    aws_attributes:
      instance_profile_arn: '{{ var.value.emr_instance_profile_arn_people }}'
    # Client-mode drivers run on the master and collect full Greenhouse API
    # payloads before parallelize(). Cap concurrency so three 32g JVMs fit on
    # the 8xlarge master; workers stay on the s_memory xlarge fleet (writes do
    # not need 96g executors).
    step_concurrency_level: 3
    master_node_type_id: r6g.8xlarge
    spark_conf:
      spark.driver.memory: 32g
      spark.driver.memoryOverhead: 8g
    core_nodes:
      target_on_demand: 2
      target_spot: 0
      instance_types:
        - r6g.xlarge
        - r7g.xlarge
        - r6i.xlarge
    task_nodes:
      instance_types:
        - r6g.xlarge
        - r7g.xlarge
        - r6i.xlarge
      target_on_demand: 0
      target_spot: 1
      allocation_strategy: price-capacity-optimized
      bid_price_percentage: 100
