cluster:
  type: emr_7_12_consolidation_l_memory_fleet_cluster
  custom_configurations:
    autotermination_minutes: 120
    aws_attributes:
      instance_profile_arn: '{{ var.value.emr_instance_profile_arn_people }}'
    # Client-mode drivers collect full Greenhouse API payloads on the master
    # (32g heap). Concurrency 3 keeps three client JVMs on the 8xlarge master.
    # Executors need 48g: xlarge/12g workers died with container exit 137 while
    # writing the applications extract (spark.json of the parallelized payload).
    step_concurrency_level: 3
    master_node_type_id: r6g.8xlarge
    spark_conf:
      spark.driver.memory: 32g
      spark.driver.memoryOverhead: 8g
    core_nodes:
      target_on_demand: 2
      target_spot: 0
      instance_types:
        - r6g.4xlarge
        - r7g.4xlarge
        - r6i.4xlarge
    task_nodes:
      instance_types:
        - r6g.4xlarge
        - r7g.4xlarge
        - r6i.4xlarge
      target_on_demand: 0
      target_spot: 1
      allocation_strategy: price-capacity-optimized
      bid_price_percentage: 100
