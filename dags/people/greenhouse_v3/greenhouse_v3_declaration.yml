dag:
  name: greenhouse_v3
  owner: Data People
  callback_by_task: False
  documentation:
    dag_purpose: |
      This DAG aims to ingest data from the Greenhouse API v3 (Recruitment)
  schedule_interval: 0 3 * * *

workflow:
  layer: raw
  has_hive_sync: true
  type: custom_ingestion
  max_tables_per_cluster: 99999
  execution_timeout_hours: 4
  bucket_config_name: people_bucket
  load_spark_job: load_greenhouse_v3_raw
  default_table_privileges:
    people-team:
      - ALL PRIVILEGES
  spark_job_arguments:
    - "{environment}"
    - "{bucket}"
    - "{dag_name}"
    - "{table_name}"
    - "{{ data_interval_start | ds }}"
    - "{partitions}"
    - "{extraction_type}"
    - "{load_start_date}"
    - "{load_end_date}"
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ts, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_end | ts, 'load_end_date') }}"
  tables_customization:

    application_stages:
      extraction_type: incremental
      merge_on: ["id"]
      vacuum_retention_hours: 168
      vacuum_lite: true
      extra_spark_job_arguments:
        - endpoint: "application_stages"
          date_column_to_partition: "updated_at"
          base_filters:
            updated_at_gte: "load_start_date"
            updated_at_lt: "load_end_date"
          params:
            per_page: 500

    job_interview_stages:
      vacuum_retention_hours: 168
      vacuum_lite: true
      extra_spark_job_arguments:
        - endpoint: "job_interview_stages"
          date_column_to_partition: "updated_at"
          params:
            per_page: 500

    job_notes:
      vacuum_retention_hours: 168
      vacuum_lite: true
      extra_spark_job_arguments:
        - endpoint: "job_notes"
          date_column_to_partition: "updated_at"
          params:
            per_page: 500

    approval_flows:
      vacuum_retention_hours: 168
      vacuum_lite: true
      extra_spark_job_arguments:
        - endpoint: "approval_flows"
          date_column_to_partition: "updated_at"
          params:
            per_page: 500

    approver_groups:
      vacuum_retention_hours: 168
      vacuum_lite: true
      extra_spark_job_arguments:
        - endpoint: "approver_groups"
          date_column_to_partition: "updated_at"
          params:
            per_page: 500

    approvers:
      vacuum_retention_hours: 168
      vacuum_lite: true
      extra_spark_job_arguments:
        - endpoint: "approvers"
          date_column_to_partition: "updated_at"
          params:
            per_page: 500

    users:
      vacuum_retention_hours: 168
      vacuum_lite: true
      extra_spark_job_arguments:
        - endpoint: "users"
          date_column_to_partition: "updated_at"
          params:
            per_page: 500

    referrers:
      vacuum_retention_hours: 168
      vacuum_lite: true
      extra_spark_job_arguments:
        - endpoint: "referrers"
          date_column_to_partition: "updated_at"
          params:
            per_page: 500

    close_reasons:
      vacuum_retention_hours: 168
      vacuum_lite: true
      partitions: []
      z_order_by: ["name"]
      extra_spark_job_arguments:
