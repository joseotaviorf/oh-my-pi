dag:
  name: greenhouse_v3
  owner: Data People
  callback_by_task: False
  documentation:
    dag_purpose: |
      This DAG aims to ingest data from the Greenhouse API v3 (Recruitment).
  schedule_interval: 0 3 * * *

cluster:
  type: custom_cluster
  access_control_list:
    group_name: people-analytics
    permission_level: CAN_MANAGE
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
    driver_node_type_id: m5a.xlarge
    node_type_id: m5a.xlarge
    num_workers: 3
    spark_version: 16.4.x-scala2.12
    aws_attributes:
      ebs_volume_size: 200
      instance_profile_arn: "{{ var.value.instance_profile_secret_arn_people }}"

workflow:
  layer: raw
  has_hive_sync: false
  type: custom_ingestion
  bucket_config_name: people_bucket
  load_spark_job: load_greenhouse_v3_raw
  default_table_privileges:
    people-team:
      - ALL PRIVILEGES
  spark_job_arguments:
    - "{environment}"
    - "{bucket}"
    - "{dag_name}"
    - "{table_name}"
    - "{{ data_interval_start | ds }}"
    - "{partitions}"
    - "{extraction_type}"
    - "{load_start_date}"
    - "{load_end_date}"
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, 1), 'load_end_date') }}"

  raw_inner_dependencies:
    job_interview_stages:
      - application_stages
    job_notes:
      - job_interview_stages
    approval_flows:
      - job_notes
    approver_groups:
      - approval_flows
    approvers:
      - approver_groups
    users:
      - approvers
    referrers:
      - users

  tables_customization:

    application_stages:
      vacuum_retention_hours: 168
      vacuum_lite: true
      extra_spark_job_arguments:
        - endpoint: "application_stages"
          date_column_to_partition: "updated_at"
          params:
            per_page: 500

    job_interview_stages:
      vacuum_retention_hours: 168
      vacuum_lite: true
      extra_spark_job_arguments:
        - endpoint: "job_interview_stages"
          date_column_to_partition: "updated_at"
          params:
            per_page: 500

    job_notes:
      vacuum_retention_hours: 168
      vacuum_lite: true
      extra_spark_job_arguments:
        - endpoint: "job_notes"
          date_column_to_partition: "updated_at"
          params:
            per_page: 500

    approval_flows:
      vacuum_retention_hours: 168
      vacuum_lite: true
      extra_spark_job_arguments:
        - endpoint: "approval_flows"
          date_column_to_partition: "updated_at"
          params:
            per_page: 500

    approver_groups:
      vacuum_retention_hours: 168
      vacuum_lite: true
      extra_spark_job_arguments:
        - endpoint: "approver_groups"
          date_column_to_partition: "updated_at"
          params:
            per_page: 500

    approvers:
      vacuum_retention_hours: 168
      vacuum_lite: true
      extra_spark_job_arguments:
        - endpoint: "approvers"
          date_column_to_partition: "updated_at"
          params:
            per_page: 500

    users:
      vacuum_retention_hours: 168
      vacuum_lite: true
      extra_spark_job_arguments:
        - endpoint: "users"
          date_column_to_partition: "updated_at"
          params:
            per_page: 500

    referrers:
      vacuum_retention_hours: 168
      vacuum_lite: true
      extra_spark_job_arguments:
        - endpoint: "referrers"
          date_column_to_partition: "updated_at"
          params:
            per_page: 500