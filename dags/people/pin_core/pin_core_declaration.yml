      vacuum_retention_hours: 168
      vacuum_lite: true
      extra_spark_job_arguments:
        - raw_custom_schema: pin_core
          date_column_to_partition: last_update_date
    hcm_extended_lookup_codes_tl:
      clean_table_name: hcm_extended_lookup_code_translation
      vacuum_retention_hours: 168
      vacuum_lite: true
      extra_spark_job_arguments:
        - raw_custom_schema: pin_core
          date_column_to_partition: last_update_date
    hr_all_organization_units_f:
