---
table_name: datalake_pin_core_clean.periods_of_service
alert_channel: PEOPLE_ALERTS
table_level_validations:
  has_size:
    greater_than: 1
    severity_level: Error
column_level_validations:
  id_period_of_service:
    is_complete:
      severity_level: Warning
    custom:
      constraint: "(SELECT COUNT(*) FROM (SELECT 1 FROM datalake_pin_core_clean.periods_of_service GROUP BY id_period_of_service, object_version_number HAVING COUNT(*) > 1)) = 0"
