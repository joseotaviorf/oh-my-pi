---
table_name: datalake_pin_core_clean.assignment_representative
alert_channel: PEOPLE_ALERTS
table_level_validations:
  has_size:
    greater_than: 1
    severity_level: Error
column_level_validations:
  id_representative_assignment:
    is_complete:
      severity_level: Warning
    custom:
      constraint: "(SELECT COUNT(*) FROM (SELECT 1 FROM datalake_pin_core_clean.assignment_representative GROUP BY id_representative_assignment, object_version_number HAVING COUNT(*) > 1)) = 0"