---
table_name: datalake_pin_core_clean.lookup
alert_channel: PEOPLE_ALERTS
table_level_validations:
  has_size:
    greater_than: 1
    severity_level: Error
column_level_validations:
  lookup_code:
    is_complete:
      severity_level: Warning
    custom:
      constraint: "(SELECT COUNT(*) FROM (SELECT 1 FROM datalake_pin_core_clean.lookup GROUP BY lookup_type, lookup_code HAVING COUNT(*) > 1)) = 0"
      severity_level: Warning
