---
table_name: datalake_pin_core_clean.action_reason_base
alert_channel: PEOPLE_ALERTS
table_level_validations:
  has_size:
    greater_than: 1
    severity_level: Error
column_level_validations:
  id_action_reason:
    is_complete:
      severity_level: Warning
    custom:
      # id_action_reason + object_version_number should be unique
      constraint: "(SELECT COUNT(*) FROM (SELECT 1 FROM datalake_pin_core_clean.action_reason_base GROUP BY id_action_reason, object_version_number HAVING COUNT(*) > 1)) = 0"
      severity_level: Warning
