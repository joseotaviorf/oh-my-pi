---
table_name: datalake_pin_core_clean.all_organization_units
alert_channel: PEOPLE_ALERTS
table_level_validations:
  has_size:
    greater_than: 1
    severity_level: Error
column_level_validations:
  id_organization:
    is_complete:
      severity_level: Warning
    custom:
      constraint: "(SELECT COUNT(*) FROM (SELECT 1 FROM datalake_pin_core_clean.all_organization_units GROUP BY id_organization, dt_effective_started HAVING COUNT(*) > 1)) = 0"
      severity_level: Warning
