---
table_name: datalake_pin_core_clean.person_address_usage
alert_channel: PEOPLE_ALERTS
table_level_validations:
  has_size:
    greater_than: 1
    severity_level: Error
column_level_validations:
  id_person_address_usage:
    is_complete:
      severity_level: Warning
    # uniqueness constraint: id_person_address_usage + dt_effective_started should be unique
    custom:
      constraint: "(SELECT COUNT(*) FROM (SELECT 1 FROM datalake_pin_core_clean.person_address_usage GROUP BY id_person_address_usage, dt_effective_started HAVING COUNT(*) > 1)) = 0"
      severity_level: Warning
