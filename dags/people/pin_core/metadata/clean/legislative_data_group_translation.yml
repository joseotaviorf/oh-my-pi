database_name: datalake_pin_core_clean
table_name: legislative_data_group_translation
owner: isabella.araujo@quintoandar.com.br
domain: People
description: |-
  Stores translated names for Legislative Data Groups in multiple languages. Each LDG can have translations in different languages (e.g., US, E, PTB) to support multilingual HR systems.
columns:
  id_legislative_data_group:
    description: Identifier of the Legislative Data Group being translated. Foreign key to legislative_data_group.
    lineage:
    - datalake_pin_core_raw.per_legislative_data_groups_tl.legislative_data_group_id
  id_business_group:
    description: Identifier of the Enterprise for multi-tenancy partitioning. Foreign key to HR_ORGANIZATION_UNITS.
    lineage:
    - datalake_pin_core_raw.per_legislative_data_groups_tl.business_group_id
  name:
    description: Translated name of the Legislative Data Group (e.g., "BR Legislative Data Group", "MX Legislative Data Group").
    lineage:
    - datalake_pin_core_raw.per_legislative_data_groups_tl.name
  language:
    description: Language code for this translation (e.g., US for American English, PTB for Brazilian Portuguese, E for Spanish).
    lineage:
    - datalake_pin_core_raw.per_legislative_data_groups_tl.language
  source_language:
    description: Original language code in which the content was created.
    lineage:
    - datalake_pin_core_raw.per_legislative_data_groups_tl.source_lang
  created_by:
    description: User who created the record.
    lineage:
    - datalake_pin_core_raw.per_legislative_data_groups_tl.created_by
  updated_by:
    description: User who last updated the record.
    lineage:
    - datalake_pin_core_raw.per_legislative_data_groups_tl.last_updated_by
  object_version_number:
    description: Version number for optimistic locking, incremented on each update.
    lineage:
    - datalake_pin_core_raw.per_legislative_data_groups_tl.object_version_number
  ts_created:
    description: Timestamp when the record was created in the source system.
    lineage:
    - datalake_pin_core_raw.per_legislative_data_groups_tl.creation_date
  ts_updated:
    description: Timestamp when the record was last updated in the source system.
    lineage:
    - datalake_pin_core_raw.per_legislative_data_groups_tl.last_update_date
  ts_load:
    description: Timestamp when the record was loaded into the clean table.
  year:
    description: Year partition extracted from ts_updated.
    lineage:
    - datalake_pin_core_raw.per_legislative_data_groups_tl.year
  month:
    description: Month partition extracted from ts_updated.
    lineage:
    - datalake_pin_core_raw.per_legislative_data_groups_tl.month
  day:
    description: Day partition extracted from ts_updated.
    lineage:
    - datalake_pin_core_raw.per_legislative_data_groups_tl.day
