database_name: datalake_pin_core_clean
table_name: people_legislative
owner: isabella.araujo@quintoandar.com.br
domain: People
description: |-
  Stores core personal data specific to different legal contexts, including information from Person Descriptive Flexfield (DDF) segments. Allows multiple records per legal code for a single person.
columns:
  id_person:
    description: Identifier of the person for whom the data is recorded.
    lineage:
    - datalake_pin_core_raw.per_people_legislative_f.person_id
  id_person_legislative:
    description: System-generated unique identifier for the person's legislative data record. Primary key.
    lineage:
    - datalake_pin_core_raw.per_people_legislative_f.person_legislative_id
  id_business_group:
    description: Identifier for the business unit, used for multi-tenant data separation. Foreign key.
    lineage:
    - datalake_pin_core_raw.per_people_legislative_f.business_group_id
  created_by:
    description: User who created the record.
    lineage:
    - datalake_pin_core_raw.per_people_legislative_f.created_by
  updated_by:
    description: User who last updated the record.
    lineage:
    - datalake_pin_core_raw.per_people_legislative_f.last_updated_by
  legislation_code:
    description: Legal code applicable to this personal data.
    lineage:
    - datalake_pin_core_raw.per_people_legislative_f.legislation_code
  marital_status:
    description: Marital status of the person, as defined by the applicable legal code.
    lineage:
    - datalake_pin_core_raw.per_people_legislative_f.marital_status
  sex:
    description: Sex of the person, as defined by the applicable legal code.
    lineage:
    - datalake_pin_core_raw.per_people_legislative_f.sex
  highest_education_level:
    description: Highest education level code.
    lineage:
    - datalake_pin_core_raw.per_people_legislative_f.highest_education_level
  highest_education_level_description:
    description: Highest education level description.
    lineage:
    - datalake_pin_core_raw.per_people_legislative_f.attribute16
  citizenship_context:
    description: "Citizenship context label. Values observed: 'Brasileira', 'Estrangeira', NULL."
    lineage:
    - datalake_pin_core_raw.per_people_legislative_f.attribute_category
  nationality:
    description: Nationality reported in DFF. In Brazilian contexts, attribute1 may represent polling station.
    lineage:
    - datalake_pin_core_raw.per_people_legislative_f.attribute1
  polling_station:
    description: Polling station identifier. In foreigner contexts, attribute1 may represent nationality.
    lineage:
    - datalake_pin_core_raw.per_people_legislative_f.attribute1
  electoral_zone:
    description: Electoral zone identifier. In foreigner contexts, attribute2 may represent entry classification.
    lineage:
    - datalake_pin_core_raw.per_people_legislative_f.attribute2
  vote_registration_number:
    description: Voter registration number. In foreigner contexts, attribute4 may represent Brazilian children flag.
    lineage:
    - datalake_pin_core_raw.per_people_legislative_f.attribute4
  foreigner_entry_classification:
    description: Foreigner entry classification. In Brazilian contexts, attribute2 may represent electoral zone.
    lineage:
    - datalake_pin_core_raw.per_people_legislative_f.attribute2
  foreigner_residence_time:
    description: Foreigner residence time in Brazil.
    lineage:
    - datalake_pin_core_raw.per_people_legislative_f.attribute28
  ctps_number:
    description: Brazilian work card (CTPS) number.
    lineage:
    - datalake_pin_core_raw.per_people_legislative_f.per_information1
  ctps_series:
    description: Brazilian work card (CTPS) series.
    lineage:
    - datalake_pin_core_raw.per_people_legislative_f.per_information2
  issuing_state_ctps:
    description: Brazilian work card (CTPS) issuing state.
    lineage:
    - datalake_pin_core_raw.per_people_legislative_f.per_information_category
  military_reservist_number:
    description: Military reservist number. In foreigner contexts, attribute3 may represent married-to-Brazilian flag.
    lineage:
    - datalake_pin_core_raw.per_people_legislative_f.attribute3
  github_username:
    description: GitHub username or profile link.
    lineage:
    - datalake_pin_core_raw.per_people_legislative_f.attribute8
  accessibility_need:
    description: Accessibility need reported by the person.
    lineage:
    - datalake_pin_core_raw.per_people_legislative_f.attribute27
  iban:
    description: IBAN reported by the person.
    lineage:
    - datalake_pin_core_raw.per_people_legislative_f.attribute18
  bank_name:
    description: Bank name reported by the person.
    lineage:
    - datalake_pin_core_raw.per_people_legislative_f.attribute25
  health_insurance_current_plan:
    description: Current health insurance plan reported by the person.
    lineage:
    - datalake_pin_core_raw.per_people_legislative_f.attribute20
  tax_residency_status:
    description: Current tax residency status reported by the person.
    lineage:
    - datalake_pin_core_raw.per_people_legislative_f.attribute21
  rnh_program_application_status:
    description: RNH program application status.
    lineage:
    - datalake_pin_core_raw.per_people_legislative_f.attribute24
  gender_identity:
    description: Self-declared gender identity.
    lineage:
    - datalake_pin_core_raw.per_people_legislative_f.attribute9
  sexual_orientation:
    description: Self-declared sexual orientation.
    lineage:
    - datalake_pin_core_raw.per_people_legislative_f.attribute10
  neurodiversity:
    description: Neurodiversity information reported by the person.
    lineage:
    - datalake_pin_core_raw.per_people_legislative_f.attribute11
  housing_type:
    description: Housing type reported by the person.
    lineage:
    - datalake_pin_core_raw.per_people_legislative_f.attribute13
  quinto_andar_joining_method:
    description: Method by which the person joined QuintoAndar.
    lineage:
    - datalake_pin_core_raw.per_people_legislative_f.attribute14
  country_situation:
    description: Country situation reported by the person.
    lineage:
    - datalake_pin_core_raw.per_people_legislative_f.attribute15
  disability_answer:
    description: Answer to disability declaration question.
    lineage:
    - datalake_pin_core_raw.per_people_legislative_f.attribute26
  disability_type:
    description: Disability type reported by the person.
    lineage:
    - datalake_pin_core_raw.per_people_legislative_f.attribute29
  object_version_number:
    description: Counter for optimistic locking, incremented on each update to detect concurrent modifications.
    lineage:
    - datalake_pin_core_raw.per_people_legislative_f.object_version_number
  is_foreigner_married_to_brazilian:
    description: Foreigner married to a Brazilian flag. In Brazilian contexts, attribute3 may represent reservist number.
    lineage:
    - datalake_pin_core_raw.per_people_legislative_f.attribute3
  has_foreigner_brazilian_children:
    description: Foreigner has Brazilian children flag. In Brazilian contexts, attribute4 may represent voter registration number.
    lineage:
    - datalake_pin_core_raw.per_people_legislative_f.attribute4
  has_hiring_bonus:
    description: Hiring bonus flag.
    lineage:
    - datalake_pin_core_raw.per_people_legislative_f.attribute6
  has_stock_option:
    description: Stock option flag.
    lineage:
    - datalake_pin_core_raw.per_people_legislative_f.attribute7
  has_relocation_bonus:
    description: Relocation bonus flag.
    lineage:
    - datalake_pin_core_raw.per_people_legislative_f.attribute17
  has_health_insurance_portability:
    description: Health insurance portability flag.
    lineage:
    - datalake_pin_core_raw.per_people_legislative_f.attribute19
  has_been_tax_resident_portugal_last_5_years:
    description: Tax resident in Portugal during the last five years flag.
    lineage:
    - datalake_pin_core_raw.per_people_legislative_f.attribute22
  has_benefited_rnh_program:
    description: Has benefited from the RNH program flag.
    lineage:
    - datalake_pin_core_raw.per_people_legislative_f.attribute23
  has_salary_advance:
    description: Salary advance request flag.
    lineage:
    - datalake_pin_core_raw.per_people_legislative_f.attribute5
  dt_foreigner_arrival:
    description: Foreigner arrival date in Brazil.
    lineage:
    - datalake_pin_core_raw.per_people_legislative_f.attribute_date1
  dt_ctps_issued:
    description: Brazilian work card (CTPS) issue date.
    lineage:
    - datalake_pin_core_raw.per_people_legislative_f.per_information_date1
  dt_marital_status:
    description: Date when the current marital status became effective.
    lineage:
    - datalake_pin_core_raw.per_people_legislative_f.marital_status_date
  dt_effective_started:
    description: Start date of the period for which this legislative person data is valid.
    lineage:
    - datalake_pin_core_raw.per_people_legislative_f.effective_start_date
  dt_effective_ended:
    description: End date of the period for which this legislative person data is valid.
    lineage:
    - datalake_pin_core_raw.per_people_legislative_f.effective_end_date
  ts_created:
    description: Timestamp of when the record was created.
    lineage:
    - datalake_pin_core_raw.per_people_legislative_f.creation_date
  ts_updated:
    description: Timestamp of when the record was last updated.
    lineage:
    - datalake_pin_core_raw.per_people_legislative_f.last_update_date
  ts_load:
    description: Timestamp indicating when the data was loaded into this table. Reflects data ingestion or reprocessing time.
  year:
    description: Year extracted from the 'ts_updated' column, useful for data partitioning and filtering.
    lineage:
    - datalake_pin_core_raw.per_people_legislative_f.year
  month:
    description: Month extracted from the 'ts_updated' column, useful for data partitioning and filtering.
    lineage:
    - datalake_pin_core_raw.per_people_legislative_f.month
  day:
    description: Day extracted from the 'ts_updated' column, useful for data partitioning and filtering.
    lineage:
    - datalake_pin_core_raw.per_people_legislative_f.day
