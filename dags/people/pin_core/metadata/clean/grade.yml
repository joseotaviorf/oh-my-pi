    lineage:
      - datalake_pin_core_raw.per_grades_f.business_group_id
  id_set:
    description: Identifier of a reference data set shared across business units, used for filtering reference data.
    lineage:
      - datalake_pin_core_raw.per_grades_f.set_id
  category_code:
    description: Code for the extensible flexfield category.
    lineage:
      - datalake_pin_core_raw.per_grades_f.category_code
  active_status:
    description: Indicates whether the grade is currently active.
    lineage:
      - datalake_pin_core_raw.per_grades_f.active_status
