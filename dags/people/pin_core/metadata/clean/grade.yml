    lineage:
      - datalake_pin_core_raw.per_grades_f.grade_code
  grade_type:
    description: Type of the grade.
    lineage:
      - datalake_pin_core_raw.per_grades_f.grade_type
  object_version_number:
    description: Counter for optimistic locking, incremented on each update to detect concurrent modifications.
    lineage:
      - datalake_pin_core_raw.per_grades_f.object_version_number
  dt_effective_ended:
    description: End date of the period for which this grade definition is valid.
    lineage:
      - datalake_pin_core_raw.per_grades_f.effective_end_date
  dt_effective_started:
