database_name: datalake_pin_core_clean
table_name: external_application_identifier
owner: isabella.araujo@quintoandar.com.br
domain: People
description: |-
  Stores details of the identifiers needed to allow integration between Fusion HCM systems and external third-party applications.
columns:
  id_external_identifier:
    description: System-generated primary key for the external identifier.
    lineage:
    - datalake_pin_core_raw.per_ext_app_identifiers.ext_identifier_id
  id_person:
    description: Identifier for the person for whom this external identifier is recorded.
    lineage:
    - datalake_pin_core_raw.per_ext_app_identifiers.person_id
  id_enterprise:
    description: Identifier for the enterprise.
    lineage:
    - datalake_pin_core_raw.per_ext_app_identifiers.enterprise_id
  type_external_identifier:
    description: Type of the external identifier.
    lineage:
    - datalake_pin_core_raw.per_ext_app_identifiers.ext_identifier_type
  number_external_identifier:
    description: Numeric or character value of the external identifier.
    lineage:
    - datalake_pin_core_raw.per_ext_app_identifiers.ext_identifier_number
  sequence_external_identifier:
    description: Sequence number of identifiers per person, used as part of an alternate key.
    lineage:
    - datalake_pin_core_raw.per_ext_app_identifiers.ext_identifier_seq
  object_version_number:
    description: Object version number, used for optimistic locking. It is incremented every time the row is updated.
    lineage:
    - datalake_pin_core_raw.per_ext_app_identifiers.object_version_number
  created_by:
    description: User who created the row.
    lineage:
    - datalake_pin_core_raw.per_ext_app_identifiers.created_by
  updated_by:
    description: User who last updated the row.
    lineage:
    - datalake_pin_core_raw.per_ext_app_identifiers.last_updated_by
  dt_started:
    description: Date and time from which the identifier is valid.
    lineage:
    - datalake_pin_core_raw.per_ext_app_identifiers.date_from
  dt_ended:
    description: Date and time until which the identifier is valid.
    lineage:
    - datalake_pin_core_raw.per_ext_app_identifiers.date_to
  ts_created:
    description: Timestamp of when the row was created.
    lineage:
    - datalake_pin_core_raw.per_ext_app_identifiers.creation_date
  ts_updated:
    description: Timestamp of the last row update.
    lineage:
    - datalake_pin_core_raw.per_ext_app_identifiers.last_update_date
  ts_load:
    description: Timestamp of when the data was loaded into the table.
  year:
    description: Year extracted from the 'ts_updated' column, useful for data partitioning and filtering.
    lineage:
    - datalake_pin_core_raw.per_ext_app_identifiers.year
  month:
    description: Month extracted from the 'ts_updated' column, useful for data partitioning and filtering.
    lineage:
    - datalake_pin_core_raw.per_ext_app_identifiers.month
  day:
    description: Day extracted from the 'ts_updated' column, useful for data partitioning and filtering.
    lineage:
    - datalake_pin_core_raw.per_ext_app_identifiers.day
