database_name: datalake_pin_core_clean
table_name: legislative_data_group
owner: isabella.araujo@quintoandar.com.br
domain: People
description: |-
  Stores Legislative Data Groups (LDGs), which define the legislative context for payroll and HR operations. Each LDG represents a country or region with specific labor laws, currency, and compliance requirements. Used to partition employee data by legislation for regulatory compliance.
columns:
  id_legislative_data_group:
    description: Unique identifier for the Legislative Data Group.
    lineage:
    - datalake_pin_core_raw.per_legislative_data_groups.legislative_data_group_id
  id_business_group:
    description: Identifier of the Enterprise for multi-tenancy partitioning. Foreign key to HR_ORGANIZATION_UNITS.
    lineage:
    - datalake_pin_core_raw.per_legislative_data_groups.business_group_id
  default_currency_code:
    description: ISO currency code used as default for payroll and compensation within this legislative context (e.g., BRL, ARS, EUR, MXN).
    lineage:
    - datalake_pin_core_raw.per_legislative_data_groups.default_currency_code
  legislation_code:
    description: Country or region code representing the applicable labor legislation (e.g., BR for Brazil, AR for Argentina, PT for Portugal, MX for Mexico).
    lineage:
    - datalake_pin_core_raw.per_legislative_data_groups.legislation_code
  created_by:
    description: User who created the record.
    lineage:
    - datalake_pin_core_raw.per_legislative_data_groups.created_by
  updated_by:
    description: User who last updated the record.
    lineage:
    - datalake_pin_core_raw.per_legislative_data_groups.last_updated_by
  object_version_number:
    description: Version number for optimistic locking, incremented on each update.
    lineage:
    - datalake_pin_core_raw.per_legislative_data_groups.object_version_number
  ts_created:
    description: Timestamp when the record was created in the source system.
    lineage:
    - datalake_pin_core_raw.per_legislative_data_groups.creation_date
  ts_updated:
    description: Timestamp when the record was last updated in the source system.
    lineage:
    - datalake_pin_core_raw.per_legislative_data_groups.last_update_date
  ts_load:
    description: Timestamp when the record was loaded into the clean table.
  year:
    description: Year partition extracted from ts_updated.
    lineage:
    - datalake_pin_core_raw.per_legislative_data_groups.year
  month:
    description: Month partition extracted from ts_updated.
    lineage:
    - datalake_pin_core_raw.per_legislative_data_groups.month
  day:
    description: Day partition extracted from ts_updated.
    lineage:
    - datalake_pin_core_raw.per_legislative_data_groups.day
