---
database_name: datalake_pin_core_clean
table_name: foundation_lookup_value
owner: isabella.araujo@quintoandar.com.br
domain: people
description: >
  Stores standardized lookup values derived from PIN, such as employment statuses,
  job categories, and participation indicators. These values translate coded fields
  into meaningful, human-readable labels. This table is a cleaned version
  of 'fnd_lookup_values' from the raw layer.

columns:
  id_row:
    description: "Unique identifier for the row within the lookup table."
    lineage:
      - datalake_pin_core_raw.fnd_lookup_values.row_id
  id_set:
    description: "Identifies a set of reference data shared across business units and other entities."
    lineage:
      - datalake_pin_core_raw.fnd_lookup_values.set_id
  id_view_application:
    description: "Identifier of the application that uses this lookup value in its UI components."
    lineage:
      - datalake_pin_core_raw.fnd_lookup_values.view_application_id
  lookup_code:
    description: "Internal code that uniquely identifies a specific value within a lookup type."
    lineage:
      - datalake_pin_core_raw.fnd_lookup_values.lookup_code
  lookup_type:
    description: "Specifies the classification or grouping of the lookup value, indicating its context of use."
    lineage:
      - datalake_pin_core_raw.fnd_lookup_values.lookup_type
  source_language_code:
    description: "Code representing the original language in which the translatable content was defined."
    lineage:
      - datalake_pin_core_raw.fnd_lookup_values.source_lang
  language_code:
    description: "Code of the language in which the lookup value's meaning is presented."
    lineage:
      - datalake_pin_core_raw.fnd_lookup_values.language
  meaning:
    description: "User-friendly label or interpretation of the lookup code."
    lineage:
      - datalake_pin_core_raw.fnd_lookup_values.meaning
  description:
    description: "Additional explanation or context for the meaning of the lookup code."
    lineage:
      - datalake_pin_core_raw.fnd_lookup_values.description
  created_by:
    description: "User who created the record."
    lineage:
      - datalake_pin_core_raw.fnd_lookup_values.created_by
  updated_by:
    description: "User who last updated the record."
    lineage:
      - datalake_pin_core_raw.fnd_lookup_values.last_updated_by
  has_changed_since_last_refresh:
    description: "Indicates whether the record has changed since the last data refresh."
    lineage:
      - datalake_pin_core_raw.fnd_lookup_values.change_since_last_refresh
  is_enabled:
    description: "Indicates whether the lookup value is currently active and available for use."
    lineage:
      - datalake_pin_core_raw.fnd_lookup_values.enabled_flag
  ts_activity_started:
    description: "Timestamp indicating when the lookup value became active."
    lineage:
      - datalake_pin_core_raw.fnd_lookup_values.start_date_active
  ts_activity_ended:
    description: "Timestamp indicating when the lookup value was deactivated."
    lineage:
      - datalake_pin_core_raw.fnd_lookup_values.end_date_active
  ts_created:
    description: "Timestamp when the row was initially created."
    lineage:
      - datalake_pin_core_raw.fnd_lookup_values.creation_date
  ts_updated:
    description: "Timestamp when the row was last updated."
    lineage:
      - datalake_pin_core_raw.fnd_lookup_values.last_update_date
  ts_load:
    description: "Records the moment the entry was added to the table. This indicates the precise date and time of data ingestion, produced using the NOW() function. This value changes if the data undergoes reprocessing."
  year:
    description: "Represents the year component extracted from the 'ts_updated' column. Useful for partitioning and filtering."
    lineage:
      - datalake_pin_core_raw.fnd_lookup_values.year
  month:
    description: "Represents the month component extracted from the 'ts_updated' column. Useful for partitioning and filtering."
    lineage:
      - datalake_pin_core_raw.fnd_lookup_values.month
  day:
    description: "Represents the day component extracted from the 'ts_updated' column. Useful for partitioning and filtering."
    lineage:
      - datalake_pin_core_raw.fnd_lookup_values.day
