---
database_name: datalake_pin_core_clean
table_name: action_reason_base
owner: isabella.araujo@quintoandar.com.br
domain: people
description: Stores definitions of reasons for actions, including their unique codes and validity periods.
columns:
  id_action_reason:
    description: System generated primary key. Surrogate Key.
    lineage:
      - datalake_pin_core_raw.per_action_reasons_b.action_reason_id
  id_business_group:
    description: Identifier of Enterprise, used for multi-tenancy partitioning. Foreign key to HR_ORGANIZATION_UNITS.
    lineage:
      - datalake_pin_core_raw.per_action_reasons_b.business_group_id
  action_reason_code:
    description: Uniquely identifies an action reason.
    lineage:
      - datalake_pin_core_raw.per_action_reasons_b.action_reason_code
  created_by:
    description: 'Who column: indicates the user who created the row.'
    lineage:
      - datalake_pin_core_raw.per_action_reasons_b.created_by
  updated_by:
    description: 'Who column: indicates the user who last updated the row.'
    lineage:
      - datalake_pin_core_raw.per_action_reasons_b.last_updated_by
  object_version_number:
    description: Used to implement optimistic locking. This number is incremented every time that the row is updated. The number is compared at the start and end of a transaction to detect whether another session has updated the row since it was queried.
    lineage:
      - datalake_pin_core_raw.per_action_reasons_b.object_version_number
  dt_started:
    description: The date from which the Action reason is active.
    lineage:
      - datalake_pin_core_raw.per_action_reasons_b.start_date
  dt_ended:
    description: The date till when the Action Reason is active.
    lineage:
      - datalake_pin_core_raw.per_action_reasons_b.end_date
  ts_created:
    description: 'Who column: indicates the date and time of the creation of the row.'
    lineage:
      - datalake_pin_core_raw.per_action_reasons_b.creation_date
  ts_updated:
    description: 'Who column: indicates the date and time of the last update of the row.'
    lineage:
      - datalake_pin_core_raw.per_action_reasons_b.last_update_date
  ts_load:
    description: Timestamp of when the record was loaded into the clean table.