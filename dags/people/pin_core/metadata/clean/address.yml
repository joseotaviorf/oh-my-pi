---
database_name: datalake_pin_core_clean
table_name: address
owner: isabella.araujo@quintoandar.com.br
domain: People
description: Stores addresses associated with people or locations.
columns:
  id_address:
    description: System-generated unique identifier for the address record. Primary key.
    lineage:
      - datalake_pin_core_raw.per_addresses_f.address_id
  id_business_group:
    description: Identifier for the business unit, used for multi-tenant data separation.
      Foreign key.
    lineage:
      - datalake_pin_core_raw.per_addresses_f.business_group_id
  created_by:
    description: User who created the record.
    lineage:
      - datalake_pin_core_raw.per_addresses_f.created_by
  updated_by:
    description: User who last updated the record.
    lineage:
      - datalake_pin_core_raw.per_addresses_f.last_updated_by
  record_creator:
    description: Module identifier for address population.
    lineage:
      - datalake_pin_core_raw.per_addresses_f.record_creator
  street:
    description: Street line for the address.
    lineage:
      - datalake_pin_core_raw.per_addresses_f.address_line_1
  number:
    description: Building or street number component of the employee residence address.
    lineage:
      - datalake_pin_core_raw.per_addresses_f.address_line_2
  complement:
    description: Additional address detail such as apartment, suite, or floor identifier.
    lineage:
      - datalake_pin_core_raw.per_addresses_f.address_line_3
  neighborhood:
    description: District or neighborhood where the employee residence is located within the city.
    lineage:
      - datalake_pin_core_raw.per_addresses_f.address_line_4
      - datalake_pin_core_raw.per_addresses_f.addl_address_attribute2
  town_or_city:
    description: Municipality or city name of the employee residence as recorded in PIN.
    lineage:
      - datalake_pin_core_raw.per_addresses_f.town_or_city
  region_1:
    description: Primary region in which the address is located.
    lineage:
      - datalake_pin_core_raw.per_addresses_f.region_1
  state:
    description: State or province for the address, varies by country.
    lineage:
      - datalake_pin_core_raw.per_addresses_f.region_2
  region_3:
    description: Third-level administrative region used for address geocoding in some countries.
    lineage:
      - datalake_pin_core_raw.per_addresses_f.region_3
  country_code:
    description: ISO country code identifying the nation where the employee address is registered.
    lineage:
      - datalake_pin_core_raw.per_addresses_f.country
  postal_code:
    description: ZIP or postal code used for mail delivery to the employee residence.
    lineage:
      - datalake_pin_core_raw.per_addresses_f.postal_code
  street_type:
    description: Street type for the address (e.g., rua, avenida, rodovia).
    lineage:
      - datalake_pin_core_raw.per_addresses_f.addl_address_attribute3
  object_version_number:
    description: Counter for optimistic locking, incremented on each update to detect
      concurrent modifications.
    lineage:
      - datalake_pin_core_raw.per_addresses_f.object_version_number
  dt_effective_started:
    description: Start date of the period for which this address is valid.
    lineage:
      - datalake_pin_core_raw.per_addresses_f.effective_start_date
  dt_effective_ended:
    description: End date of the period for which this address is valid.
    lineage:
      - datalake_pin_core_raw.per_addresses_f.effective_end_date
  ts_created:
    description: Timestamp of when the record was created.
    lineage:
      - datalake_pin_core_raw.per_addresses_f.creation_date
  ts_updated:
    description: Timestamp of when the record was last updated.
    lineage:
      - datalake_pin_core_raw.per_addresses_f.last_update_date
  ts_load:
    description: Timestamp indicating when the data was loaded into this table. Reflects
      data ingestion or reprocessing time.
  year:
    description: Year extracted from the 'ts_updated' column, useful for data partitioning
      and filtering.
    lineage:
      - datalake_pin_core_raw.per_addresses_f.year
  month:
    description: Month extracted from the 'ts_updated' column, useful for data partitioning
      and filtering.
    lineage:
      - datalake_pin_core_raw.per_addresses_f.month
  day:
    description: Day extracted from the 'ts_updated' column, useful for data partitioning
      and filtering.
    lineage:
      - datalake_pin_core_raw.per_addresses_f.day