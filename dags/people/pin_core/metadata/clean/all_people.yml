    lineage:
      - datalake_pin_core_raw.per_all_people_f.primary_email_id
  id_primary_phone:
    description: Identifier of the person's primary phone number.
    lineage:
      - datalake_pin_core_raw.per_all_people_f.primary_phone_id
  id_primary_nid:
