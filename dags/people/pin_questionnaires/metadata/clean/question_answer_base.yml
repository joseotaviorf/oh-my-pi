database_name: datalake_pin_questionnaires_clean
table_name: question_answer_base
owner: pedro.prates@quintoandar.com.br
domain: People
description: |-
  This table stores possible answers for a question, theses answers are for a specific question only.
columns:
  id_business_group:
    description: The business group's unique identifier
    lineage:
    - datalake_pin_questionnaires_raw.hrq_qstn_answers_b.business_group_id
  id_question_answer:
    description: The Question Answer's unique identifier
    lineage:
    - datalake_pin_questionnaires_raw.hrq_qstn_answers_b.qstn_answer_id
  id_question:
    description: The question's unique identifier
    lineage:
    - datalake_pin_questionnaires_raw.hrq_qstn_answers_b.question_id
  created_by:
    description: The person who created the answer
    lineage:
    - datalake_pin_questionnaires_raw.hrq_qstn_answers_b.created_by
  updated_by:
    description: The last person or process to update this answer
    lineage:
    - datalake_pin_questionnaires_raw.hrq_qstn_answers_b.last_updated_by
  answer_code:
    description: Code of the Answer
    lineage:
    - datalake_pin_questionnaires_raw.hrq_qstn_answers_b.answer_code
  object_version_number:
    description: Version number of the object
    lineage:
    - datalake_pin_questionnaires_raw.hrq_qstn_answers_b.object_version_number
  question_version_number:
    description: Version number of the Question
    lineage:
    - datalake_pin_questionnaires_raw.hrq_qstn_answers_b.qstn_version_num
  sequence_number:
    description: Sequential number of the answer, for orderning purposes
    lineage:
    - datalake_pin_questionnaires_raw.hrq_qstn_answers_b.seq_num
  score:
    description: Score of the answer
    lineage:
    - datalake_pin_questionnaires_raw.hrq_qstn_answers_b.score
  ts_created:
    description: Date of creation of the row
    lineage:
    - datalake_pin_questionnaires_raw.hrq_qstn_answers_b.creation_date
  ts_updated:
    description: Last update date of the row
    lineage:
    - datalake_pin_questionnaires_raw.hrq_qstn_answers_b.last_update_date
  ts_load:
    description: the timestamp when the record was loaded into the clean layer
  year:
    description: The year the data was loaded into the raw layer, used for partitioning. Derived from the 'updated_at' column in the raw layer.
    lineage:
    - datalake_pin_questionnaires_raw.hrq_qstn_answers_b.year
  month:
    description: The month the data was loaded into the raw layer, used for partitioning. Derived from the 'updated_at' column in the raw layer.
    lineage:
    - datalake_pin_questionnaires_raw.hrq_qstn_answers_b.month
  day:
    description: The day the data was loaded into the raw layer, used for partitioning. Derived from the 'updated_at' column in the raw layer.
    lineage:
    - datalake_pin_questionnaires_raw.hrq_qstn_answers_b.day
