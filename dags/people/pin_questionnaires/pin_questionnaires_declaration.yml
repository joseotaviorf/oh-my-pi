dag:
  name: pin_questionnaires
  schedule_interval: 0 3 * * *
  owner: Data People
  callback_by_task: False
  dag_documentation:
    dag_purpose: |
      This DAG ingests encrypted data from the Oracle HCM system, made available via an SFTP server through Oracle Integration Cloud (OIC).
      It downloads, decrypts, parses, and loads the files into both the `incoming` and `raw` layers of the Data Lake.
workflow:
  layer: raw
  type: custom_ingestion
  bucket_config_name: people_bucket
  has_hive_sync: false
  load_spark_job: load_pin_questionnaires_raw
  default_extraction_type: full
  spark_job_arguments:
    - "{environment}"
    - "{bucket}"
    - "{dag_name}"
    - "{table_name}"
    - "{{ data_interval_start | ds }}"
    - "{partitions}"
    - "{extraction_type}"
    - "{load_start_date}"
    - "{load_end_date}"
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, 1), 'load_end_date') }}"
  default_table_privileges:
    people-team:
      - ALL PRIVILEGES
  tables_customization:
    hrq_qstn_answers_b:
      clean_table_name: question_answer_base
      vacuum_retention_hours: 168
      vacuum_lite: true
      extra_spark_job_arguments:
        - raw_custom_schema: pin_questionnaires
          date_column_to_partition: last_update_date
    hrq_qstn_answers_tl:
      clean_table_name: question_answer_translation
      vacuum_retention_hours: 168
      vacuum_lite: true
      extra_spark_job_arguments:
        - raw_custom_schema: pin_questionnaires
          date_column_to_partition: last_update_date
    hrq_qstn_responses:
      clean_table_name: question_response
      vacuum_retention_hours: 168
      vacuum_lite: true
      extra_spark_job_arguments:
        - raw_custom_schema: pin_questionnaires
          date_column_to_partition: last_update_date
    hrq_qstnr_participants:
      clean_table_name: questionnaire_participant
      vacuum_retention_hours: 168
      vacuum_lite: true
      extra_spark_job_arguments:
        - raw_custom_schema: pin_questionnaires
          date_column_to_partition: last_update_date
    hrq_qstnr_responses:
      clean_table_name: questionnaire_response
      vacuum_retention_hours: 168
      vacuum_lite: true
      extra_spark_job_arguments:
        - raw_custom_schema: pin_questionnaires
          date_column_to_partition: last_update_date
    hrq_qstnr_sections_b:
      clean_table_name: questionnaire_section_base
      vacuum_retention_hours: 168
      vacuum_lite: true
      extra_spark_job_arguments:
        - raw_custom_schema: pin_questionnaires
          date_column_to_partition: last_update_date
    hrq_qstnr_sections_tl:
      clean_table_name: questionnaire_section_translation
      vacuum_retention_hours: 168
      vacuum_lite: true
      extra_spark_job_arguments:
        - raw_custom_schema: pin_questionnaires
          date_column_to_partition: last_update_date
    hrq_qstnr_questions:
      clean_table_name: questionnaire_question
      vacuum_retention_hours: 168
      vacuum_lite: true
      extra_spark_job_arguments:
        - raw_custom_schema: pin_questionnaires
          date_column_to_partition: last_update_date
    hrq_questionnaires_b:
      clean_table_name: questionnaire_base
      vacuum_retention_hours: 168
      vacuum_lite: true
      extra_spark_job_arguments:
        - raw_custom_schema: pin_questionnaires
