---
database_name: datalake_workable_redshift_clean
table_name: assessments
owner: isabella.araujo@quintoandar.com.br
domain: People
description: Stores information and results for assessments sent to candidates during the recruitment process. Each row represents a specific assessment taken by a candidate for a job application.
columns:
  id_candidate:
    description: Unique identifier for the candidate who took the assessment. Foreign key to the candidates table.
    lineage:
      - datalake_workable_redshift_raw.assessments.candidate_id
  id_assessment:
    description: Unique identifier for the assessment record itself. Primary key for this table.
    lineage:
      - datalake_workable_redshift_raw.assessments.assessment_id
  id_stage:
    description: Identifier for the recruitment stage in which the assessment was assigned (e.g., 'Technical Test', 'Phone Screen').
    lineage:
      - datalake_workable_redshift_raw.assessments.stage_id
  name:
    description: The name of the assessment (e.g., 'Cognitive Skills Test', 'Logic Quiz').
    lineage:
      - datalake_workable_redshift_raw.assessments.name
  provider_name:
    description: The name of the third-party company or service that provides the assessment (e.g., 'HackerRank', 'Codility').
    lineage:
      - datalake_workable_redshift_raw.assessments.provider_name
  provider_slug:
    description: A URL-friendly version of the provider's name (e.g., 'hackerrank').
    lineage:
      - datalake_workable_redshift_raw.assessments.provider_slug
  provider_type:
    description: The type of assessment or integration (e.g., 'test', 'video_interview').
    lineage:
      - datalake_workable_redshift_raw.assessments.provider_type
  results:
    description: A JSON object containing the detailed, raw results of the assessment.
    lineage:
      - datalake_workable_redshift_raw.assessments.results
  meta:
    description: A JSON object containing supplementary metadata about the assessment, such as configuration or delivery details.
    lineage:
      - datalake_workable_redshift_raw.assessments.meta
  overall_score:
    description: The overall numerical score achieved by the candidate in the assessment.
    lineage:
      - datalake_workable_redshift_raw.assessments.overall_score
  ts_created:
    description: Timestamp indicating when the assessment record was created in the source system (Workable).
    lineage:
      - datalake_workable_redshift_raw.assessments.created_at
  ts_updated:
    description: Timestamp of the last update to the assessment record in the source system.
    lineage:
      - datalake_workable_redshift_raw.assessments.updated_at
  ts_load:
    description: Timestamp indicating when the record was loaded into this clean table.
  year:
    description: Year of the update to the assessment record. Used for table partitioning.
    lineage:
      - datalake_workable_redshift_raw.assessments.year
  month:
    description: Month of the update to the assessment record. Used for table partitioning.
    lineage:
      - datalake_workable_redshift_raw.assessments.month
  day:
    description: Day of the update to the assessment record. Used for table partitioning.
    lineage:
      - datalake_workable_redshift_raw.assessments.day