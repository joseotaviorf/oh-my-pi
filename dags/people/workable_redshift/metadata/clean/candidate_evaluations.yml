---
database_name: datalake_workable_redshift_clean
table_name: candidate_evaluations
owner: isabella.araujo@quintoandar.com.br
domain: People
description: Contains evaluation data submitted by team members (interviewers) for candidates at various stages of the recruitment process. Each row represents a single evaluation from a member for a candidate at a specific stage.
columns:
  id:
    description: Unique identifier for the evaluation record. Primary key for this table.
    lineage:
      - datalake_workable_redshift_raw.candidate_evaluations.id
  id_candidate:
    description: Identifier for the candidate who was evaluated. Foreign key to the candidates table.
    lineage:
      - datalake_workable_redshift_raw.candidate_evaluations.candidate_id
  id_stage:
    description: Identifier for the recruitment stage during which this evaluation was submitted (e.g., 'Technical Interview', 'Culture Fit').
    lineage:
      - datalake_workable_redshift_raw.candidate_evaluations.stage_id
  id_member:
    description: Identifier for the team member (e.g., interviewer) who submitted the evaluation. Foreign key to the members table.
    lineage:
      - datalake_workable_redshift_raw.candidate_evaluations.member_id
  candidate_name:
    description: The full name of the candidate who was evaluated.
    lineage:
      - datalake_workable_redshift_raw.candidate_evaluations.candidate_name
  stage_name:
    description: The name of the recruitment stage corresponding to the id_stage.
    lineage:
      - datalake_workable_redshift_raw.candidate_evaluations.stage_name
  member_name:
    description: The full name of the team member who submitted the evaluation.
    lineage:
      - datalake_workable_redshift_raw.candidate_evaluations.member_name
  score:
    description: The numerical score given by the member in the evaluation. This could represent an overall rating or a specific criterion.
    lineage:
      - datalake_workable_redshift_raw.candidate_evaluations.score
  ts_evaluation_created:
    description: Timestamp indicating when the evaluation was originally created in the source system (Workable).
    lineage:
      - datalake_workable_redshift_raw.candidate_evaluations.evaluation_created_at
  ts_updated:
    description: Timestamp of the last update to the evaluation record in the source system.
    lineage:
      - datalake_workable_redshift_raw.candidate_evaluations.updated_at
  ts_load:
    description: Timestamp indicating when the record was loaded into this clean table.