database_name: datalake_workable_redshift_clean
table_name: job_views
owner: isabella.araujo@quintoandar.com.br
domain: People
description: |-
  This table aggregates the number of views for each job posting, including the source of the traffic.
columns:
  id_job:
    description: The unique identifier of the job posting that was viewed.
    lineage:
    - datalake_workable_redshift_raw.job_views.job_id
  referrer_domain:
    description: The domain of the website that referred the user to the job posting.
    lineage:
    - datalake_workable_redshift_raw.job_views.referrer_domain
  outlet:
    description: The specific source or channel where the view originated (e.g., 'Google', 'LinkedIn').
    lineage:
    - datalake_workable_redshift_raw.job_views.outlet
  views_count:
    description: The number of views for the job posting from a specific outlet and referrer.
    lineage:
    - datalake_workable_redshift_raw.job_views.views_count
  ts_first_viewed:
    description: The timestamp of the first view recorded for this job posting.
    lineage:
    - datalake_workable_redshift_raw.job_views.first_view_at
  ts_last_viewed:
    description: The timestamp of the last view recorded for this job posting.
    lineage:
    - datalake_workable_redshift_raw.job_views.last_view_at
  ts_load:
    description: The timestamp when this record was loaded into the table.
