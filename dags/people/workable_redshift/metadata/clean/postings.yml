---
database_name: datalake_workable_redshift_clean
table_name: postings
owner: isabella.araujo@quintoandar.com.br
domain: People
description: This table provides detailed information about job postings published on various job boards via the Workable platform.
columns:
  id:
    description: A unique identifier for the job posting.
    lineage:
      - datalake_workable_redshift_raw.postings.id
  id_job:
    description: The unique identifier of the job the posting is for.
    lineage:
      - datalake_workable_redshift_raw.postings.job_id
  job_title:
    description: The title of the job being advertised.
    lineage:
      - datalake_workable_redshift_raw.postings.job_title
  job_board:
    description: The name of the job board where the posting was published.
    lineage:
      - datalake_workable_redshift_raw.postings.job_board
  type:
    description: The type of posting, such as 'free' or 'premium'.
    lineage:
      - datalake_workable_redshift_raw.postings.type
  url:
    description: The URL of the job posting on the job board.
    lineage:
      - datalake_workable_redshift_raw.postings.url
  state:
    description: The current status of the posting (e.g., 'published', 'expired', 'closed').
    lineage:
      - datalake_workable_redshift_raw.postings.state
  max_duration:
    description: The maximum duration in days for which the posting is active.
    lineage:
      - datalake_workable_redshift_raw.postings.max_duration
  price:
    description: The price of the posting.
    lineage:
      - datalake_workable_redshift_raw.postings.price
  days_published:
    description: The number of days the posting has been published.
    lineage:
      - datalake_workable_redshift_raw.postings.days_published
  candidates_count:
    description: The number of candidates who have applied to the job through this posting.
    lineage:
      - datalake_workable_redshift_raw.postings.candidates_count
  ts_posting_created:
    description: The timestamp when the posting was created in the source system.
    lineage:
      - datalake_workable_redshift_raw.postings.posting_created_at
  ts_published:
    description: The timestamp when the posting was first published.
    lineage:
      - datalake_workable_redshift_raw.postings.published_at
  ts_updated:
    description: The timestamp when the posting record was last updated.
    lineage:
      - datalake_workable_redshift_raw.postings.updated_at
  ts_load:
    description: The timestamp when this record was loaded into the table.