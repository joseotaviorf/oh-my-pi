description: This table links job postings to specific locations, detailing where each job is based. A single job can have multiple associated locations.
columns:
  id:
    description: A unique identifier for the job-location association.
    lineage:
      - datalake_workable_redshift_raw.job_locations.id
  id_job:
    description: The unique identifier of the job posting.
    lineage:
      - datalake_workable_redshift_raw.job_locations.job_id
  id_location:
    description: The unique identifier of the location.
    lineage:
      - datalake_workable_redshift_raw.job_locations.location_id
  zip_code:
    description: The zip code of the job location.
    lineage:
      - datalake_workable_redshift_raw.job_locations.zip_code
  position:
    description: The position or order of the location in a list.
    lineage:
      - datalake_workable_redshift_raw.job_locations.position
  is_hidden:
    description: A boolean flag indicating if the location is hidden from public view.
    lineage:
      - datalake_workable_redshift_raw.job_locations.hidden
  ts_created:
    description: The timestamp when the job-location association was created.
    lineage:
      - datalake_workable_redshift_raw.job_locations.created_at
  ts_updated:
    description: The timestamp when the job-location association was last updated.
    lineage:
      - datalake_workable_redshift_raw.job_locations.updated_at
  ts_load:
    description: The timestamp when this record was loaded into the table.