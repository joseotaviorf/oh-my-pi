---
database_name: datalake_workable_redshift_clean
table_name: locations
owner: isabella.araujo@quintoandar.com.br
domain: People
description: This table provides detailed information about various geographical locations, such as cities, states, and countries, used for job postings and candidate data in Workable.
columns:
  id:
    description: A unique identifier for the location.
    lineage:
      - datalake_workable_redshift_raw.locations.id
  country_code:
    description: The two-letter country code (e.g., 'US', 'BR').
    lineage:
      - datalake_workable_redshift_raw.locations.country_code
  state_code:
    description: The state or region code.
    lineage:
      - datalake_workable_redshift_raw.locations.state_code
  city:
    description: The name of the city.
    lineage:
      - datalake_workable_redshift_raw.locations.city
  subregion:
    description: The name of the subregion.
    lineage:
      - datalake_workable_redshift_raw.locations.subregion
  zip_code:
    description: The zip or postal code of the location.
    lineage:
      - datalake_workable_redshift_raw.locations.zip_code
  location_string:
    description: A complete string representation of the location (e.g., 'São Paulo, Brazil').
    lineage:
      - datalake_workable_redshift_raw.locations.location_string
  coords:
    description: The geographical coordinates (latitude and longitude) of the location.
    lineage:
      - datalake_workable_redshift_raw.locations.coords
  ts_location_created:
    description: The timestamp when the location record was created.
    lineage:
      - datalake_workable_redshift_raw.locations.location_created_at
  ts_updated:
    description: The timestamp when the location record was last updated.
    lineage:
      - datalake_workable_redshift_raw.locations.updated_at
  ts_load:
    description: The timestamp when this record was loaded into the table.
  year:
    description: Year of the update to the location record. Used for table partitioning.
    lineage:
      - datalake_workable_redshift_raw.locations.year
  month:
    description: Month of the update to the location record. Used for table partitioning.
    lineage:
      - datalake_workable_redshift_raw.locations.month
  day:
    description: Day of the update to the location record. Used for table partitioning.
    lineage:
      - datalake_workable_redshift_raw.locations.day