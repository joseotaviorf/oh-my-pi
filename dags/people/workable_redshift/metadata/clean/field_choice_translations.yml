database_name: datalake_workable_redshift_clean
table_name: field_choice_translations
owner: isabella.araujo@quintoandar.com.br
domain: People
description: |-
  This table provides translations for choices or options within various fields used in the Workable platform, supporting multiple languages.
columns:
  id:
    description: A unique identifier for the field choice translation record.
    lineage:
    - datalake_workable_redshift_raw.field_choice_translations.id
  id_field_choice:
    description: The unique identifier of the field choice being translated.
    lineage:
    - datalake_workable_redshift_raw.field_choice_translations.field_choice_id
  label:
    description: The translated label for the field choice.
    lineage:
    - datalake_workable_redshift_raw.field_choice_translations.label
  language:
    description: The language code of the translation (e.g., 'en' for English, 'pt' for Portuguese).
    lineage:
    - datalake_workable_redshift_raw.field_choice_translations.language
  ts_created:
    description: The timestamp when the translation record was created.
    lineage:
    - datalake_workable_redshift_raw.field_choice_translations.created_at
  ts_updated:
    description: The timestamp when the translation record was last updated.
    lineage:
    - datalake_workable_redshift_raw.field_choice_translations.updated_at
  ts_load:
    description: The timestamp when this record was loaded into the table.
