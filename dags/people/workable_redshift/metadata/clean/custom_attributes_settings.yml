---
database_name: datalake_workable_redshift_clean
table_name: custom_attributes_settings
owner: isabella.araujo@quintoandar.com.br
domain: People
description: Stores the account-level settings and definitions for custom attributes used in Workable. This table defines which custom fields exist, their properties, and where they are displayed, such as on application forms or candidate profiles.
columns:
  id:
    description: Unique identifier for the custom attribute settings record. This table may contain only a single row representing the entire account's configuration.
    lineage:
      - datalake_workable_redshift_raw.custom_attributes_settings.id
  disabled_custom_attributes:
    description: A list or array, often in JSON format, of custom attributes that are currently disabled for the account.
    lineage:
      - datalake_workable_redshift_raw.custom_attributes_settings.disabled_custom_attributes
  app_form:
    description: A JSON object that defines the structure, order, and properties of custom attributes that appear on the job application form.
    lineage:
      - datalake_workable_redshift_raw.custom_attributes_settings.app_form
  profile:
    description: A JSON object that defines the structure, order, and properties of custom attributes that appear on a candidate's profile page.
    lineage:
      - datalake_workable_redshift_raw.custom_attributes_settings.profile
  ts_load:
    description: Timestamp indicating when the record was loaded into this clean table.