database_name: datalake_workable_redshift_clean
table_name: signable_templates
owner: isabella.araujo@quintoandar.com.br
domain: People
description: |-
  This table stores templates for documents that require signatures, such as contracts or offer letters, within the Workable platform.
columns:
  id:
    description: A unique identifier for the signable document template.
    lineage:
    - datalake_workable_redshift_raw.signable_templates.id
  type:
    description: The type of document, such as 'contract' or 'offer_letter'.
    lineage:
    - datalake_workable_redshift_raw.signable_templates.type
  name:
    description: The name of the template.
    lineage:
    - datalake_workable_redshift_raw.signable_templates.name
  email_body:
    description: The email body content used when sending the signable document.
    lineage:
    - datalake_workable_redshift_raw.signable_templates.email_body
  language:
    description: The language of the document template.
    lineage:
    - datalake_workable_redshift_raw.signable_templates.language
  country_code:
    description: The two-letter country code associated with the template.
    lineage:
    - datalake_workable_redshift_raw.signable_templates.country_code
  state_code:
    description: The state or region code associated with the template.
    lineage:
    - datalake_workable_redshift_raw.signable_templates.state_code
  city:
    description: The city associated with the template.
    lineage:
    - datalake_workable_redshift_raw.signable_templates.city
  subregion:
    description: The subregion associated with the template.
    lineage:
    - datalake_workable_redshift_raw.signable_templates.subregion
  zip_code:
    description: The zip or postal code associated with the template.
    lineage:
    - datalake_workable_redshift_raw.signable_templates.zip_code
  ts_load:
    description: The timestamp when this record was loaded into the table.
