---
database_name: datalake_workable_redshift_clean
table_name: events
owner: isabella.araujo@quintoandar.com.br
domain: People
description: This table contains records of events, such as interviews and meetings, that are part of the recruitment process within the Workable platform.
columns:
  id:
    description: A unique identifier for the event.
    lineage:
      - datalake_workable_redshift_raw.events.id
