dag:
  name: workable_redshift
  schedule_start_date: 2024, 6, 1
  schedule_interval: 0 9 * * *
  owner: Data People
  documentation:
    dag_purpose: |
      This DAG brings data from Workable instance on Redshift to datalake.

cluster:
  type: custom_cluster
  access_control_list:
    group_name: people-analytics
    permission_level: CAN_MANAGE
  custom_libraries:
    - maven:
        coordinates: "com.amazon.redshift:redshift-jdbc42:2.1.0.29"
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
    driver_node_type_id: m5a.4xlarge
    node_type_id: m5a.4xlarge
    num_workers: 5
    spark_version: 16.4.x-scala2.12
    aws_attributes:
      ebs_volume_size: 200
      instance_profile_arn: "{{ var.value.instance_profile_secret_arn_people }}"

workflow:
  type: database_pull_delta
  layer: raw
  bucket_config_name: people_bucket
  database_type: postgres
  dbutils_secret_key: WORKABLE_DB
  dbutils_secret_scope: people
  has_hive_sync: false

  default_table_privileges:
    people-team:
      - ALL PRIVILEGES

  tables_customization:
    activities:
    answers:
    assessments:
    attendances:
    candidate_evaluations:
    candidate_referrals:
    candidates:
    collaboration_rules:
    comments:
    custom_attributes:
    custom_attributes_settings:
    departments:
    education_records:
    events:
    experience_records:
    extra_infos:
    field_choice_translations:
    field_choices:
    field_translations:
    field_value_choices:
    field_values:
    fields:
    hiring_team:
    invoices:
    job_boards:
    job_locations:
    job_views:
    jobs:
    locations:
    members:
    offer_templates:
    offer_variables:
    offers:
    pipelines:
    postings:
    pseudo_boards:
    questions:
    ratings:
    redsync_metro_source:
    requisition_attributes:
    requisition_templates:
    requisitions:
    signable_templates:
    stages:
    surveys: