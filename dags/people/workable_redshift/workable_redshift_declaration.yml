dag:
  name: workable_redshift
  schedule_start_date: 2024, 6, 1
  schedule_interval: 0 9 * * *
  owner: Data People
  documentation:
    dag_purpose: |
      This DAG brings data from Workable instance on Redshift to datalake.

cluster:
  type: custom_cluster
  access_control_list:
    group_name: people-analytics
    permission_level: CAN_MANAGE
  custom_libraries:
    - maven:
        coordinates: "com.amazon.redshift:redshift-jdbc42:2.1.0.29"
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
    driver_node_type_id: m5a.2xlarge
    node_type_id: m5a.2xlarge
    num_workers: 5
    spark_version: 16.4.x-scala2.12
    aws_attributes:
      ebs_volume_size: 200
      instance_profile_arn: "{{ var.value.instance_profile_secret_arn_people }}"

workflow:
  type: database_pull_delta
  layer: raw
  bucket_config_name: people_bucket
  database_type: postgres
  dbutils_secret_key: WORKABLE_DB
  dbutils_secret_scope: people
  has_hive_sync: false
  default_raw_partitions: ["year", "month", "day"]
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, -1), 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  default_table_privileges:
    people-team:
      - ALL PRIVILEGES

  tables_customization:
    activities:
      date_filter_column: updated_at
      extraction_type: incremental
      merge_on: ["id"]
    answers:
      date_filter_column: updated_at
      extraction_type: incremental
      merge_on: ["id", "answer"]
    assessments:
      extraction_type: full
    attendances:
      date_filter_column: updated_at
      extraction_type: incremental
      merge_on: ["id"]
    candidate_evaluations:
      date_filter_column: updated_at
      extraction_type: incremental
      merge_on: ["id"]
    candidate_referrals:
      date_filter_column: updated_at
      extraction_type: incremental
      merge_on: ["id"]
    candidates:
      date_filter_column: updated_at
      extraction_type: incremental
      merge_on: ["id"]
    collaboration_rules:
      extraction_type: full
    comments:
      date_filter_column: updated_at
      extraction_type: incremental
      merge_on: ["id"]
    custom_attributes:
      date_filter_column: updated_at
      extraction_type: incremental
      merge_on: ["id"]
    custom_attributes_settings:
      extraction_type: full
    departments:
