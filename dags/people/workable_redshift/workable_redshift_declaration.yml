dag:
  name: workable_redshift
  schedule_start_date: 2024, 6, 1
  schedule_interval: 0 3 * * *
  owner: Data People
  documentation:
    dag_purpose: |
      This DAG brings data from Workable instance on Redshift to datalake.
cluster:
  type: databricks_13_3_min_people_cluster
  access_control_list:
    group_name: people-analytics
    permission_level: CAN_MANAGE
workflow:
  type: database_pull_delta
  layer: raw
  bucket_config_name: people_bucket
  database_type: postgres
  dbutils_secret_key: WORKABLE_DB
  has_hive_sync: false
  tables_customization:
    activities:
      date_filter_column: updated_at
      extraction_type: incremental
      merge_on: ['id']
    answers:
      date_filter_column: updated_at
      extraction_type: incremental
      merge_on: ['id', 'answer']
    candidates:
      date_filter_column: updated_at
      extraction_type: incremental
      merge_on: ['id']
    field_choices:
      date_filter_column: updated_at
      extraction_type: incremental
      merge_on: ['id']
    field_value_choices:
      date_filter_column: updated_at
      extraction_type: incremental
      merge_on: ['id']
    field_values:
      date_filter_column: updated_at
      extraction_type: incremental
      merge_on: ['id']
    fields:
      date_filter_column: updated_at
      extraction_type: incremental
      merge_on: ['id']
    jobs:
      date_filter_column: updated_at
      extraction_type: incremental
      merge_on: ['id']
    members:
      date_filter_column: updated_at
      extraction_type: incremental
      merge_on: ['id']
    pipelines:
      date_filter_column: updated_at
      extraction_type: incremental
      merge_on: ['id']
    requisitions:
      date_filter_column: updated_at
      extraction_type: incremental
      merge_on: ['id']
    stages:
      date_filter_column: updated_at
      extraction_type: incremental
      merge_on: ['id']