dag:
  name: enrich_employment
  schedule_start_date: 2025, 7, 18
  owner: Data People
  callback_by_task: False
  documentation:
    dag_purpose: >
      Responsible for processing and enriching core employment data. 
      This DAG consolidates and transforms information related to the 
      employee's position, organizational assignment and status (active/inactive), 
      preparing the data for analytical consumption in the enriched layer.
workflow:
  type: query_delta
  layer: enrich
  default_extraction_type: full
  has_hive_sync: true
  bucket_config_name: people_bucket
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  default_table_privileges:
    people-team: ["ALL PRIVILEGES"]
  tables_customization:
    employee_details:
      vacuum_retention_hours: 168
      vacuum_lite: true
