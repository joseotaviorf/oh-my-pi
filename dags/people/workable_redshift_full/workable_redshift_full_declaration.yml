dag:
  name: workable_redshift_full
  schedule_start_date: 2024, 6, 1
  schedule_interval: 0 9 * * *
  owner: Data People
  documentation:
    dag_purpose: |
      This DAG brings data from Workable instance on Redshift to datalake.
cluster:
  type: databricks_13_3_med_people_cluster
  access_control_list:
    group_name: people-analytics
    permission_level: CAN_MANAGE
  custom_libraries:
    - maven:
        coordinates: "com.amazon.redshift:redshift-jdbc42:2.1.0.29"
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
workflow:
  type: database_pull_delta
  layer: raw
  bucket_config_name: people_bucket
  database_type: postgres
  dbutils_secret_key: WORKABLE_DB
  dbutils_secret_scope: people
  has_hive_sync: false
  default_raw_partitions: ["year", "month", "day"]
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, yesterday_ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, ds, 'load_end_date') }}"
  tables_customization:
    activities:
      date_filter_column: updated_at
    answers:
      date_filter_column: updated_at
    candidate_referrals:
      date_filter_column: updated_at
    candidates:
      date_filter_column: updated_at
    departments:
      date_filter_column: updated_at
    education_records:
      date_filter_column: updated_at
    experience_records:
      date_filter_column: updated_at
    field_choices:
      date_filter_column: updated_at
    field_value_choices:
      date_filter_column: updated_at
    field_values:
      date_filter_column: updated_at
    fields:
      date_filter_column: updated_at
    hiring_team:
      date_filter_column: updated_at
    jobs:
      date_filter_column: updated_at
    members:
      date_filter_column: updated_at
    offer_variables:
      date_filter_column: updated_at
    offers:
      date_filter_column: updated_at
    pipelines:
      date_filter_column: updated_at
    requisitions:
      date_filter_column: updated_at
    stages:
      date_filter_column: updated_at
  default_table_privileges:
    people-team:
      - ALL PRIVILEGES
