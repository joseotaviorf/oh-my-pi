---
table_name: datalake_pin_absence_clean.person_type_entry
alert_channel: PEOPLE_ALERTS
table_level_validations:
  has_size:
    greater_than: 1
    severity_level: Error
column_level_validations:
  id_per_abs_type_entry:
    is_complete:
      severity_level: Warning
    custom:
      # id_per_abs_type_entry + object_version_number should be unique
      constraint: "(SELECT COUNT(*) FROM (SELECT 1 FROM datalake_pin_absence_clean.person_type_entry GROUP BY id_per_abs_type_entry, object_version_number HAVING COUNT(*) > 1)) = 0"
      severity_level: Warning
