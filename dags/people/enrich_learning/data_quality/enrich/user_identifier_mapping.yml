---
table_name: datalake_learning.user_identifier_mapping
alert_channel: PEOPLE_ALERTS

table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error

column_level_validations:
  id_user:
    is_complete:
      severity_level: Error
    is_unique:
      severity_level: Error
  work_email:
    # Max 0.5% nulls to cover cases such as external users to QA (e.g. users with email ending in @ext.quintoandar.com.br).
    has_completeness:
      greater_than: 0.995
      severity_level: Warning
  person_number:
    # Max 0.5% nulls to cover cases such as external users to QA (e.g. users with email ending in @ext.quintoandar.com.br).
    has_completeness:
      greater_than: 0.995
      severity_level: Warning
  ts_load:
    is_complete:
      severity_level: Warning