dag:
  name: enrich_learning
  schedule_start_date: 2025, 9, 22
  owner: Data People
  callback_by_task: False
  documentation:
    dag_purpose: |-
      Enrich learning data with flattened and derived columns (mainly from Degreed/Learning Hub).
      Includes content_completions (flattened from clean), pathway structure tables (sections, lessons, lesson_contents), plan_pathways, plan_completions (plan completeness by pathways), and user_identifier_mapping (user_id, work_email, person_number).
workflow:
  type: query_delta
  layer: enrich
  custom_schema: "learning"
  default_extraction_type: full
  has_hive_sync: true
  bucket_config_name: people_bucket
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  default_table_privileges:
    people-team: ["ALL PRIVILEGES"]
  inner_dependencies:
    all_completions:
      - content_completions
      - lesson_contents
    plan_completions:
      - plan_pathways
      - all_completions
    user_identifier_mapping:
      - content_completions
  tables_customization:
    all_completions:
      vacuum_retention_hours: 168
      vacuum_lite: true
    content_completions:
      vacuum_retention_hours: 168
      vacuum_lite: true
    lesson_contents:
      vacuum_retention_hours: 168
      vacuum_lite: true
    lessons:
      vacuum_retention_hours: 168
      vacuum_lite: true
    sections:
      vacuum_retention_hours: 168
      vacuum_lite: true
    plan_pathways:
      vacuum_retention_hours: 168
      vacuum_lite: true
    plan_completions:
      vacuum_retention_hours: 168
      vacuum_lite: true
    user_identifier_mapping:
      vacuum_retention_hours: 168
      vacuum_lite: true
