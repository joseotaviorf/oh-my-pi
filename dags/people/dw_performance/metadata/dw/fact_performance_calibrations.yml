database_name: dw_performance
table_name: fact_performance_calibrations
owner: pedro.prates@quintoandar.com.br
domain: People
description: |-
  Fact table that consolidates calibration evaluation results at the person level per calibration meeting year.
  It links to dim_performance_calibration, dim_performance_variation, and dim_committee_meeting.
  The table includes both pre-calibration and calibrated ratings for Behavior, Impact, and Leadership, along with calculated performance scores and calibration variation indicators.
  When the same person appears in more than one performance calibration committee in the same calendar year, a single canonical row is kept. The committee with calibrated Impact and Behavior numerics populated is preferred. If several committees still qualify on that criterion, the most recent committee meeting timestamp wins; remaining ties break on meeting id.
columns:
  sk_performance_calibration_version:
    description: Surrogate key for the current version of the calibration evaluation in the dim_performance_calibration dimension. This key includes the calibration_version to uniquely identify a specific version.
    lineage:
    - dw_performance.dim_performance_calibration.sk_performance_calibration_version
  sk_performance_calibration:
    description: Surrogate key for the calibration evaluation in the dim_performance_calibration dimension. This key represents the calibration regardless of version, linking to the current version when used with is_current = TRUE.
    lineage:
    - dw_performance.dim_performance_calibration.sk_performance_calibration
  sk_performance_variation:
    description: Composite surrogate key representing the combination of calibration variation trends (Increased, Decreased, Maintained) for Behavior, Impact, and Leadership dimensions. Links to dim_performance_variation.
    lineage:
    - dw_performance.dim_performance_calibration.pre_calibration_behavior_numeric
    - dw_performance.dim_performance_calibration.calibrated_behavior_numeric
    - dw_performance.dim_performance_calibration.pre_calibration_impact_numeric
    - dw_performance.dim_performance_calibration.calibrated_impact_numeric
    - dw_performance.dim_performance_calibration.pre_calibration_leadership_numeric
    - dw_performance.dim_performance_calibration.calibrated_leadership_numeric
  sk_committee_meeting:
    description: Foreign key to dim_committee_meeting.sk_meeting identifying the performance calibration committee meeting for this calibration row.
    lineage:
    - dw_performance.dim_committee_meeting.sk_meeting
    - datalake_pin.performa_calibration_evaluation.id_meeting
    - datalake_pin.performa_calibration_extra_info.id_meeting
  person_number:
    description: Unique identifier for the person (employee) who was evaluated.
    lineage:
    - datalake_pin.performa_calibration_evaluation.person_number
    - datalake_pin.performa_calibration_extra_info.person_number
  calibrated_behavior_description:
    description: Textual description of the calibrated (post-meeting) Behavior rating.
    lineage:
    - dw_performance.dim_performance_calibration.calibrated_behavior_description
  pre_calibration_behavior_description:
    description: Textual description of the pre-calibration (initial) Behavior rating before the meeting.
    lineage:
    - dw_performance.dim_performance_calibration.pre_calibration_behavior_description
  calibrated_impact_description:
    description: Textual description of the calibrated (post-meeting) Impact rating.
    lineage:
    - dw_performance.dim_performance_calibration.calibrated_impact_description
  pre_calibration_impact_description:
    description: Textual description of the pre-calibration (initial) Impact rating before the meeting.
    lineage:
    - dw_performance.dim_performance_calibration.pre_calibration_impact_description
  calibrated_leadership_description:
    description: Textual description of the calibrated (post-meeting) Leadership rating.
    lineage:
    - dw_performance.dim_performance_calibration.calibrated_leadership_description
  pre_calibration_leadership_description:
    description: Textual description of the pre-calibration (initial) Leadership rating before the meeting.
    lineage:
    - dw_performance.dim_performance_calibration.pre_calibration_leadership_description
  calibrated_behavior_numeric:
    description: Numeric value of the calibrated (post-meeting) Behavior rating.
    lineage:
    - dw_performance.dim_performance_calibration.calibrated_behavior_numeric
  pre_calibration_behavior_numeric:
    description: Numeric value of the pre-calibration (initial) Behavior rating before the meeting.
    lineage:
    - dw_performance.dim_performance_calibration.pre_calibration_behavior_numeric
  calibrated_impact_numeric:
    description: Numeric value of the calibrated (post-meeting) Impact rating.
    lineage:
    - dw_performance.dim_performance_calibration.calibrated_impact_numeric
  pre_calibration_impact_numeric:
    description: Numeric value of the pre-calibration (initial) Impact rating before the meeting.
    lineage:
    - dw_performance.dim_performance_calibration.pre_calibration_impact_numeric
  calibrated_leadership_numeric:
    description: Numeric value of the calibrated (post-meeting) Leadership rating.
    lineage:
    - dw_performance.dim_performance_calibration.calibrated_leadership_numeric
  pre_calibration_leadership_numeric:
    description: Numeric value of the pre-calibration (initial) Leadership rating before the meeting.
    lineage:
    - dw_performance.dim_performance_calibration.pre_calibration_leadership_numeric
  performa_score_numeric:
    description: |-
      Calculated numeric performance score based on weighted average of calibrated ratings. Formula: If leadership rating exists, then (0.6 * impact_numeric) + (0.2 * behavior_numeric) + (0.2 * leadership_numeric), otherwise (0.6 * impact_numeric) + (0.4 * behavior_numeric).
    lineage:
    - dw_performance.dim_performance_calibration.calibrated_impact_numeric
    - dw_performance.dim_performance_calibration.calibrated_behavior_numeric
    - dw_performance.dim_performance_calibration.calibrated_leadership_numeric
  performa_ipa:
    description: |
      IPA (Individual Performance Assessment) multiplier derived from performa_score_numeric.
      Outstanding=1.50, Above expectations=1.20, Meets expectations=1.00, Partially misses=0.70, Insufficient=0.00.
    lineage:
    - dw_performance.dim_performance_calibration.calibrated_impact_numeric
    - dw_performance.dim_performance_calibration.calibrated_behavior_numeric
    - dw_performance.dim_performance_calibration.calibrated_leadership_numeric
  performa_score:
    description: Categorical classification of the performance score based on numeric ranges.
    lineage:
    - dw_performance.dim_performance_calibration.calibrated_impact_numeric
    - dw_performance.dim_performance_calibration.calibrated_behavior_numeric
    - dw_performance.dim_performance_calibration.calibrated_leadership_numeric
    categories:
      Insufficient: Performance score is less than 70.
      'Partially misses expectations': Performance score is between 70 and 89.
      'Meets expectations': Performance score is between 90 and 109.
      'Above expectations': Performance score is between 110 and 137.
      Outstanding: Performance score is between 138 and 150.
  ts_load:
    description: Timestamp of when the record was loaded into this fact table.

