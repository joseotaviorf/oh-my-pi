---
database_name: dw_performance
table_name: fact_performance_evaluations
owner: isabella.araujo@quintoandar.com.br
domain: People
description: >
  Fact table that consolidates performance evaluations. 
  It includes composite keys for initial (manager) and calibrated ratings, 
  as well as composite keys for tracking changes during calibration and between evaluation periods. 
  It is populated from the datalake_pin.performance_calibration table.
columns:
  sk_evaluation:
    description: "Unique identifier for the evaluation."
    lineage:
      - datalake_pin.performance_calibration.id_evaluation
  sk_assignment:
    description: "Unique identifier for the period of service (assignment)."
    lineage:
      - datalake_pin.performance_calibration.id_period_of_service
  sk_employee:
    description: "Unique identifier for the employee (person)."
    lineage:
      - datalake_pin.performance_calibration.id_person
  sk_evaluation_date:
    description: "Date when the evaluation occurred, in 'yyyyMMdd' format."
    lineage:
      - datalake_pin.performance_calibration.dt_evaluation_occurred
  sk_performance_rating_from_manager:
    description: "Composite surrogate key representing the combination of initial performance ratings (Behavior, Impact, Leadership) from the manager before calibration. Links to dim_performance_rating."
    lineage:
      - datalake_pin.performance_calibration.id_rating_level_from_manager
  sk_performance_rating_from_calibration:
    description: "Composite surrogate key representing the combination of calibrated performance ratings (Behavior, Impact, Leadership) after committee review. Links to dim_performance_rating."
    lineage:
      - datalake_pin.performance_calibration.id_rating_level_from_calibration
  sk_performance_variation_period:
    description: "Composite surrogate key indicating the trend (Increased, Decreased, Maintained) for each performance dimension compared to the previous review period. Links to dim_performance_variation."
    lineage:
      - datalake_pin.performance_calibration.numeric_rating_from_calibration
  sk_performance_variation_calibration:
    description: "Composite surrogate key indicating the trend (Increased, Decreased, Maintained) for each performance dimension from the initial (manager) to the calibrated assessment. Links to dim_performance_variation."
    lineage:
      - datalake_pin.performance_calibration.numeric_rating_from_manager
      - datalake_pin.performance_calibration.numeric_rating_from_calibration
  assignment_number:
    description: "Registration number of the employee."
    lineage:
      - datalake_pin.performance_calibration.assignment_number
  numeric_behavior_from_manager:
    description: "Numeric value of the Behavior assessment from the manager (before calibration)."
    lineage:
      - datalake_pin.performance_calibration.numeric_rating_from_manager
  numeric_behavior_from_calibration:
    description: "Numeric value of the Behavior assessment after calibration."
    lineage:
      - datalake_pin.performance_calibration.numeric_rating_from_calibration
  numeric_impact_from_manager:
    description: "Numeric value of the Impact assessment from the manager (before calibration)."
    lineage:
      - datalake_pin.performance_calibration.numeric_rating_from_manager
  numeric_impact_from_calibration:
    description: "Numeric value of the Impact assessment after calibration."
    lineage:
      - datalake_pin.performance_calibration.numeric_rating_from_calibration
  numeric_leadership_from_manager:
    description: "Numeric value of the Leadership assessment from the manager (before calibration)."
    lineage:
      - datalake_pin.performance_calibration.numeric_rating_from_manager
  numeric_leadership_from_calibration:
    description: "Numeric value of the Leadership assessment after calibration."
    lineage:
      - datalake_pin.performance_calibration.numeric_rating_from_calibration
  is_last_cycle:
    description: "Boolean (TRUE/FALSE) indicating if this is the last recorded evaluation cycle for the respective period of service (assignment)."
    lineage:
      - datalake_pin.performance_calibration.dt_performance_document_started
  ts_load:
    description: "Timestamp of when the record was loaded into the fact table."
