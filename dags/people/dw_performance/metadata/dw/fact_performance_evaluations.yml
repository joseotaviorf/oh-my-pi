database_name: dw_performance
table_name: fact_performance_evaluations
owner: isabella.araujo@quintoandar.com.br
domain: People
description: |-
  Fact table that consolidates performance evaluations at the cycle and assignment level. It links to the dim_performance_evaluation dimension for both SELF and MANAGER evaluation types, providing the current version of each evaluation type. The table includes descriptive and numeric ratings for Behavior, Impact, and Leadership from both evaluation perspectives.
columns:
  sk_performance_evaluation_manager_version:
    description: Surrogate key for the current version of the MANAGER evaluation in the dim_performance_evaluation dimension. This key includes the version number (dt_valid_from) to uniquely identify a specific SCD Type 2 version.
    lineage:
    - dw_performance.dim_performance_evaluation.sk_performance_evaluation_version
  sk_performance_evaluation_self_version:
    description: Surrogate key for the current version of the SELF evaluation in the dim_performance_evaluation dimension. This key includes the version number (dt_valid_from) to uniquely identify a specific SCD Type 2 version.
    lineage:
    - dw_performance.dim_performance_evaluation.sk_performance_evaluation_version
  sk_performance_evaluation_manager:
    description: Surrogate key for the MANAGER evaluation in the dim_performance_evaluation dimension. This key represents the evaluation type regardless of version, linking to the current version when used with is_current = TRUE.
    lineage:
    - dw_performance.dim_performance_evaluation.sk_performance_evaluation
  sk_performance_evaluation_self:
    description: Surrogate key for the SELF evaluation in the dim_performance_evaluation dimension. This key represents the evaluation type regardless of version, linking to the current version when used with is_current = TRUE.
    lineage:
    - dw_performance.dim_performance_evaluation.sk_performance_evaluation
  assignment_number:
    description: The business identifier for the employee's assignment. Part of the grain of the fact table along with cycle_name.
    lineage:
    - datalake_pin.performance_evaluation.assignment_number
  cycle_name:
    description: Name of the performance review cycle. Part of the grain of the fact table along with assignment_number.
    lineage:
    - datalake_pin.performance_evaluation.cycle_name
  behavior_self:
    description: Textual description of the Behavior rating from the employee's self-assessment (SELF evaluation type).
    lineage:
    - dw_performance.dim_performance_evaluation.description_behavior
  impact_self:
    description: Textual description of the Impact rating from the employee's self-assessment (SELF evaluation type).
    lineage:
    - dw_performance.dim_performance_evaluation.description_impact
  leadership_self:
    description: Textual description of the Leadership rating from the employee's self-assessment (SELF evaluation type).
    lineage:
    - dw_performance.dim_performance_evaluation.description_leadership
  behavior_manager:
    description: Textual description of the Behavior rating from the manager's evaluation (MANAGER evaluation type).
    lineage:
    - dw_performance.dim_performance_evaluation.description_behavior
  impact_manager:
    description: Textual description of the Impact rating from the manager's evaluation (MANAGER evaluation type).
    lineage:
    - dw_performance.dim_performance_evaluation.description_impact
  leadership_manager:
    description: Textual description of the Leadership rating from the manager's evaluation (MANAGER evaluation type).
    lineage:
    - dw_performance.dim_performance_evaluation.description_leadership
  numeric_behavior_manager:
    description: Numeric value of the Behavior rating from the manager's evaluation (MANAGER evaluation type).
    lineage:
    - dw_performance.dim_performance_evaluation.numeric_behavior
  numeric_impact_manager:
    description: Numeric value of the Impact rating from the manager's evaluation (MANAGER evaluation type).
    lineage:
    - dw_performance.dim_performance_evaluation.numeric_impact
  numeric_leadership_manager:
    description: Numeric value of the Leadership rating from the manager's evaluation (MANAGER evaluation type).
    lineage:
    - dw_performance.dim_performance_evaluation.numeric_leadership
  numeric_behavior_self:
    description: Numeric value of the Behavior rating from the employee's self-assessment (SELF evaluation type).
    lineage:
    - dw_performance.dim_performance_evaluation.numeric_behavior
  numeric_impact_self:
    description: Numeric value of the Impact rating from the employee's self-assessment (SELF evaluation type).
    lineage:
    - dw_performance.dim_performance_evaluation.numeric_impact
  numeric_leadership_self:
    description: Numeric value of the Leadership rating from the employee's self-assessment (SELF evaluation type).
    lineage:
    - dw_performance.dim_performance_evaluation.numeric_leadership
  ts_load:
    description: Timestamp of when the record was loaded into this fact table.
