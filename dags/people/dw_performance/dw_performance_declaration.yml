dag:
  name: dw_performance
  owner: Data People
  schedule_start_date: 2025, 5, 22
  documentation:
    dag_purpose: "Data Warehouse to consolidate and analyze employee data, covering talent reviews, performance reviews, and impact alignment (goals)."
cluster:
  type: databricks_13_3_min_memory_people_cluster
  access_control_list:
    group_name: people-analytics
    permission_level: CAN_MANAGE
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
workflow:
  type: query_delta
  layer: dw
  bucket_config_name: people_bucket
  custom_schema: performance
  has_hive_sync: false
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, 1), 'load_end_date') }}"
  default_table_privileges:
    people-team: ["ALL PRIVILEGES"]
