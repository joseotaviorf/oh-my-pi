dag:
  name: dw_performance
  owner: Data People
  callback_by_task: False
  schedule_start_date: 2025, 5, 22
  documentation:
    dag_purpose: "Data Warehouse to consolidate and analyze employee data, covering talent reviews, performance reviews, and impact alignment (goals)."
workflow:
  type: query_delta
  layer: dw
  bucket_config_name: people_bucket
  custom_schema: performance
  has_hive_sync: true
  serialize_dq_after_default_row: true
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, 1), 'load_end_date') }}"
  default_table_privileges:
    people-team: ["ALL PRIVILEGES"]
  inner_dependencies:
    fact_performance_evaluations:
      - dim_performance_evaluation
    fact_performance_calibrations:
      - dim_performance_calibration
      - dim_committee_meeting
    fact_talent_reviews:
      - dim_committee_meeting
    dim_cycle_period:
      - dim_committee_meeting
    fact_smoke_detectors:
      - fact_goal_achievements
      - fact_performance_evaluations
      - fact_performance_calibrations
  tables_customization:
    dim_committee_meeting:
      vacuum_retention_hours: 168
      vacuum_lite: true
    dim_cycle_period:
      vacuum_retention_hours: 168
      vacuum_lite: true
    dim_performance_evaluation:
      vacuum_retention_hours: 168
      vacuum_lite: true
    dim_performance_variation:
      vacuum_retention_hours: 168
      vacuum_lite: true
    dim_talent_rating:
      vacuum_retention_hours: 168
      vacuum_lite: true
    dim_talent_variation:
      vacuum_retention_hours: 168
      vacuum_lite: true
    fact_goal_achievements:
      vacuum_retention_hours: 168
      vacuum_lite: true
    fact_performance_evaluations:
      vacuum_retention_hours: 168
      vacuum_lite: true
    fact_smoke_detectors:
      vacuum_retention_hours: 168
      vacuum_lite: true
    fact_continuous_management:
      vacuum_retention_hours: 168
      vacuum_lite: true
    fact_peer_evaluations:
      vacuum_retention_hours: 168
      vacuum_lite: true
    fact_talent_reviews:
      vacuum_retention_hours: 168
      vacuum_lite: true
