dag:
  name: dw_performance
  owner: Data People
  schedule_start_date: 2025, 5, 22
  documentation:
    dag_purpose: "Data Warehouse to consolidate and analyze employee data, covering talent reviews, performance reviews, and impact alignment (goals)."
cluster:
  type: databricks_16_4_small_memory_people_cluster
  access_control_list:
    group_name: people-analytics
    permission_level: CAN_MANAGE
  databricks_conn_id: databricks_new_env
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
workflow:
  type: query_delta
  layer: dw
  bucket_config_name: people_bucket
  custom_schema: performance
  has_hive_sync: false
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, 1), 'load_end_date') }}"
  default_table_privileges:
    people-team: ["ALL PRIVILEGES"]
  inner_dependencies:
    fact_performance_evaluations:
      - dim_performance_evaluation
    fact_performance_calibrations:
      - dim_performance_calibration
    fact_performa_smoke_detectors:
      - fact_goal_achievements
      - fact_performance_evaluations
      - fact_performance_calibrations
  tables_customization:
    dim_committee_meeting:
      vacuum_retention_hours: 168
      vacuum_lite: true
    dim_performance_evaluation:
      vacuum_retention_hours: 168
      vacuum_lite: true
    dim_performance_variation:
      vacuum_retention_hours: 168
      vacuum_lite: true
    dim_talent_rating:
      vacuum_retention_hours: 168
      vacuum_lite: true
    dim_talent_variation:
      vacuum_retention_hours: 168
      vacuum_lite: true
    fact_goal_achievements:
      vacuum_retention_hours: 168
      vacuum_lite: true
    fact_performance_evaluations:
      vacuum_retention_hours: 168
      vacuum_lite: true
    fact_performa_smoke_detectors:
      vacuum_retention_hours: 168
      vacuum_lite: true
    fact_talent_reviews:
      vacuum_retention_hours: 168
      vacuum_lite: true
