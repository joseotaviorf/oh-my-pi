---
table_name: dw_performance.fact_continuous_management
alert_channel: PEOPLE_ALERTS

table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: 0
    less_than_or_equal_to: 25
    severity_level: Warning

column_level_validations:
  sk_continuous_management:
    is_complete:
      severity_level: Error
    is_unique:
      severity_level: Error
  person_number:
    is_complete:
      severity_level: Error
  manager_person_number:
    is_complete:
      severity_level: Warning
  document_type:
    is_complete:
      severity_level: Error
  checkpoint_status:
    is_complete:
      severity_level: Error
    is_contained_in:
      values: ['filled', 'in_progress', 'not_started']
      severity_level: Error
  dt_check_in:
    is_complete:
      severity_level: Error
  ts_load:
    is_complete:
      severity_level: Warning
