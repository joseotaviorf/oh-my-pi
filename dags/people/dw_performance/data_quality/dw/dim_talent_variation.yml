---
table_name: dw_performance.dim_talent_variation
alert_channel: PEOPLE_ALERTS

table_level_validations:
  has_size:
    greater_than: 4
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: 0
    less_than_or_equal_to: 25
    severity_level: Warning

column_level_validations:
  sk_talent_variation:
    has_completeness:
      greater_than: 0.9
      severity_level: Warning
    is_unique:
      severity_level: Warning
  criticality:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Warning
  potential:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Warning
  readiness:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Warning
  risk_of_loss:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Warning
