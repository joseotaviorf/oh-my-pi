---
table_name: dw_performance.fact_performance_evaluations
alert_channel: PEOPLE_ALERTS

table_level_validations:
  has_size:
    greater_than: 1
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: 0
    less_than_or_equal_to: 25
    severity_level: Warning

column_level_validations:
  sk_evaluation:
    is_unique:
      severity_level: Warning
  is_last_cycle:
    is_complete:
      severity_level: Warning
  numeric_behavior_from_calibration:
    has_null_count:
      less_than_or_equal_to: 10
      severity_level: Warning
  numeric_impact_from_calibration:
    has_null_count:
      less_than_or_equal_to: 10
      severity_level: Warning
  ts_load:
    is_complete:
      severity_level: Warning
