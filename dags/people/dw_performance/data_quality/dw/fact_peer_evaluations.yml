---
table_name: dw_performance.fact_peer_evaluations
alert_channel: PEOPLE_ALERTS

table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: 0
    less_than_or_equal_to: 25
    severity_level: Warning

column_level_validations:
  sk_peer_evaluation:
    is_complete:
      severity_level: Warning
    is_unique:
      severity_level: Warning
  person_number:
    is_complete:
      severity_level: Warning
  peer_person_number:
    is_complete:
      severity_level: Warning
  assignment_number:
    is_complete:
      severity_level: Warning
  cycle_name:
    is_complete:
      severity_level: Warning
  participation_status:
    is_complete:
      severity_level: Warning
    is_contained_in:
      values: ['COMP', 'INPROG', 'AWAITING_REPLY', 'REQUEST_NOT_SENT']
      severity_level: Warning
  participant_role_type:
    is_complete:
      severity_level: Warning
    is_contained_in:
      values: ['LEADERSHIP', 'PEER']
      severity_level: Warning
  ts_load:
    is_complete:
      severity_level: Warning
