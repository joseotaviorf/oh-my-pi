---
table_name: dw_performance.dim_cycle_period
alert_channel: PEOPLE_ALERTS

table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: 0
    less_than_or_equal_to: 25
    severity_level: Warning

column_level_validations:
  sk_cycle_period:
    is_complete:
      severity_level: Error
    is_unique:
      severity_level: Error
  cycle_name:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Error
  dt_valid_from:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Error
  dt_valid_to:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Error
  is_released:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Error
  one_current_cycle_per_meeting_type:
    custom:
      # Ensure each meeting_type has exactly one row with is_current = TRUE (never zero, never more than one).
      constraint: |-
        (SELECT COUNT(*)
         FROM (
           SELECT meeting_type
           FROM dw_performance.dim_cycle_period
           GROUP BY meeting_type
           HAVING SUM(CASE WHEN is_current THEN 1 ELSE 0 END) <> 1
         )
        ) = 0
      severity_level: Error
