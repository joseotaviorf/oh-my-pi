---
table_name: dw_performance.fact_performance_calibrations
alert_channel: PEOPLE_ALERTS

table_level_validations:
  has_size:
    greater_than: 5000
    severity_level: Error

column_level_validations:
  sk_performance_calibration_version:
    is_complete:
      severity_level: Warning
    is_unique:
      severity_level: Warning
  person_number:
    custom:
      # person_number and meeting_year should be unique
      constraint: "(SELECT COUNT(*) FROM (SELECT 1 FROM dw_performance.fact_performance_calibrations GROUP BY person_number, meeting_year HAVING COUNT(*) > 1)) = 0"
      severity_level: Warning
  performa_score_numeric:
    has_max_value:
      less_than_or_equal_to: 150
      severity_level: Warning
    has_min_value:
      greater_than_or_equal_to: 0
      severity_level: Warning

