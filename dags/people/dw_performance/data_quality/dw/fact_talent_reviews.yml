---
table_name: dw_performance.fact_talent_reviews
alert_channel: PEOPLE_ALERTS

table_level_validations:
  has_size:
    greater_than: 1
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: 0
    less_than_or_equal_to: 25
    severity_level: Warning

column_level_validations:
  sk_talent_review:
    has_completeness:
      greater_than: 0.95
      severity_level: Warning
    is_unique:
      severity_level: Warning
  is_last_cycle:
    is_complete:
      severity_level: Warning
  is_latest_in_cycle:
    is_complete:
      severity_level: Warning
  one_latest_in_cycle_per_assignment_and_cycle:
    custom:
      # At most one row per assignment per cycle may be flagged is_latest_in_cycle (prevents downstream fan-out).
      constraint: |-
        (SELECT COUNT(*)
         FROM (
           SELECT
             assignment_number,
             sk_cycle_period
           FROM dw_performance.fact_talent_reviews
           WHERE is_latest_in_cycle = TRUE
           GROUP BY
             assignment_number,
             sk_cycle_period
           HAVING COUNT(*) > 1
         )
        ) = 0
      severity_level: Error
  is_regrettable_loss:
    is_complete:
      severity_level: Warning
  ts_created:
    is_complete:
      severity_level: Warning
  ts_load:
    is_complete:
      severity_level: Warning
  ts_updated:
    is_complete:
      severity_level: Warning
