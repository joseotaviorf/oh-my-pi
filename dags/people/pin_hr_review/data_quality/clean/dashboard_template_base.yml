---
table_name: datalake_pin_hr_review_clean.dashboard_template_base
alert_channel: PEOPLE_ALERTS
table_level_validations:
  has_size:
    greater_than: 1
    severity_level: Error
column_level_validations:
  id_dashboard_template:
    is_complete:
      severity_level: Warning
    custom:
      # id_dashboard_template + object_version_number should be unique
      constraint: "(SELECT COUNT(*) FROM (SELECT 1 FROM datalake_pin_hr_review_clean.dashboard_template_base GROUP BY id_dashboard_template, object_version_number HAVING COUNT(*) > 1)) = 0"
      severity_level: Warning
