---
table_name: datalake_allocation_tool_clean.groups
alert_channel: PEOPLE_ALERTS

table_level_validations:
  has_size:
    greater_than: 1
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: -10
    # RA 2.0 added team-level groups under each Line (~48 teams + ~11 legacy
    # line-as-group rows). One-time migration can spike well above +25%; cap
    # high enough to catch runaway duplication without blocking the cutover.
    less_than_or_equal_to: 500
    severity_level: Error

column_level_validations:
  id_group:
    is_unique:
      severity_level: Warning
    is_complete:
      severity_level: Warning
  active_teams_have_line_name:
    custom:
      # Every active group must belong to a Line; RA 2.0 team-level groups
      # inherit line_name from the parent Line.
      constraint: |-
        (SELECT COUNT(*)
         FROM datalake_allocation_tool_clean.groups
         WHERE is_active = TRUE
           AND line_name IS NULL
        ) = 0
      severity_level: Warning
  group_name:
    is_complete:
      severity_level: Warning
  is_active:
    is_complete:
      severity_level: Warning
  ts_export_generated:
    is_complete:
      severity_level: Warning
