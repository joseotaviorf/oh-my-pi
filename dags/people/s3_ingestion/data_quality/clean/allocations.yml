---
table_name: datalake_allocation_tool_clean.allocations
alert_channel: PEOPLE_ALERTS

table_level_validations:
  has_size:
    greater_than: 1
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: -10
    less_than_or_equal_to: 25
    severity_level: Error

column_level_validations:
  id_allocation:
    is_unique:
      severity_level: Warning
    is_complete:
      severity_level: Warning
  id_employee:
    is_complete:
      severity_level: Warning
  status:
    is_complete:
      severity_level: Warning
  ts_export_generated:
    is_complete:
      severity_level: Warning
