database_name: datalake_allocation_tool_clean
table_name: groups
owner: isabella.araujo@quintoandar.com.br
domain: People
description: |-
  Current state of groups in the Allocation Tool, the internal app where leaders
  distribute people across groups and tags for resource planning.
  One row per group id.
  Covers all groups exported by the app, including deactivated rows kept with
  is_active = false.
  Built incrementally: an initial snapshot export seeds the table and daily delta
  exports (full records of whatever changed) are merged in by group id.
columns:
  id_group:
    description: Unique identifier of the group in the Allocation Tool.
    lineage:
    - datalake_allocation_tool_raw.groups.raw_content.records[*].id
    - datalake_allocation_tool_raw.delta.raw_content.groups[*].id
  id_created_by:
    description: Identifier of the user who created the group.
    lineage:
    - datalake_allocation_tool_raw.groups.raw_content.records[*].created_by_id
    - datalake_allocation_tool_raw.delta.raw_content.groups[*].created_by_id
  id_deactivated_by:
    description: Identifier of the user who deactivated the group, when applicable.
    lineage:
    - datalake_allocation_tool_raw.groups.raw_content.records[*].deactivated_by
    - datalake_allocation_tool_raw.delta.raw_content.groups[*].deactivated_by
  group_name:
    description: Display name of the group.
    lineage:
    - datalake_allocation_tool_raw.groups.raw_content.records[*].name
    - datalake_allocation_tool_raw.delta.raw_content.groups[*].name
  file_name:
    description: Full S3 URI of the export file (snapshot or delta) this row version was parsed from.
    lineage:
    - datalake_allocation_tool_raw.groups.file_name
    - datalake_allocation_tool_raw.delta.file_name
  is_locked:
    description: True when the group is locked for changes in the Allocation Tool.
    lineage:
    - datalake_allocation_tool_raw.groups.raw_content.records[*].is_locked
    - datalake_allocation_tool_raw.delta.raw_content.groups[*].is_locked
  is_active:
    description: True when the group is currently active in the Allocation Tool; false expresses a soft delete.
    lineage:
    - datalake_allocation_tool_raw.groups.raw_content.records[*].is_active
    - datalake_allocation_tool_raw.delta.raw_content.groups[*].is_active
  is_sample:
    description: True when the record is app-generated sample data rather than a real group.
    lineage:
    - datalake_allocation_tool_raw.groups.raw_content.records[*].is_sample
    - datalake_allocation_tool_raw.delta.raw_content.groups[*].is_sample
  ts_deactivated:
    description: Timestamp (UTC) when the group was deactivated, when applicable.
    lineage:
    - datalake_allocation_tool_raw.groups.raw_content.records[*].deactivated_at
    - datalake_allocation_tool_raw.delta.raw_content.groups[*].deactivated_at
  ts_created:
    description: Timestamp (UTC) when the group was created in the Allocation Tool.
    lineage:
    - datalake_allocation_tool_raw.groups.raw_content.records[*].created_date
    - datalake_allocation_tool_raw.delta.raw_content.groups[*].created_date
  ts_updated:
    description: Timestamp (UTC) of the last update to the group in the Allocation Tool.
    lineage:
    - datalake_allocation_tool_raw.groups.raw_content.records[*].updated_date
    - datalake_allocation_tool_raw.delta.raw_content.groups[*].updated_date
  ts_export_generated:
    description: Timestamp (UTC) when the source export (snapshot or delta) that produced this row version was generated by the app.
    lineage:
    - datalake_allocation_tool_raw.groups.raw_content.generated_at
    - datalake_allocation_tool_raw.delta.raw_content.generated_at
  ts_file_modified:
    description: Timestamp (UTC) when the export file landed in S3 (object LastModified).
    lineage:
    - datalake_allocation_tool_raw.groups.ts_file_modified
    - datalake_allocation_tool_raw.delta.ts_file_modified
  ts_load:
    description: Timestamp indicating when the record was ingested into the raw layer.
    lineage:
    - datalake_allocation_tool_raw.groups.ts_load
    - datalake_allocation_tool_raw.delta.ts_load
