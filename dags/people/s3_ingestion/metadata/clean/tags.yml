database_name: datalake_allocation_tool_clean
table_name: tags
owner: isabella.araujo@quintoandar.com.br
domain: People
description: |-
  Current state of tags in the Allocation Tool, the internal app where leaders
  distribute people across groups and tags for resource planning.
  One row per tag id.
  Covers all tags exported by the app, including deactivated rows kept with
  is_active = false.
  Built incrementally from full snapshot exports: each run merges the latest
  version per tag id into the table.
columns:
  id_tag:
    description: Unique identifier of the tag in the Allocation Tool.
    lineage:
    - datalake_allocation_tool_raw.tags.raw_content.records[*].id
  id_group:
    description: Identifier of the group the tag belongs to.
    lineage:
    - datalake_allocation_tool_raw.tags.raw_content.records[*].group_id
  id_created_by:
    description: Identifier of the user who created the tag.
    lineage:
    - datalake_allocation_tool_raw.tags.raw_content.records[*].created_by_id
  id_deactivated_by:
    description: Identifier of the user who deactivated the tag, when applicable.
    lineage:
    - datalake_allocation_tool_raw.tags.raw_content.records[*].deactivated_by
  tag_name:
    description: Display name of the tag.
    lineage:
    - datalake_allocation_tool_raw.tags.raw_content.records[*].name
  file_name:
    description: Full S3 URI of the export file (snapshot or delta) this row version was parsed from.
    lineage:
    - datalake_allocation_tool_raw.tags.file_name
  is_active:
    description: True when the tag is currently active in the Allocation Tool; false expresses a soft delete.
    lineage:
    - datalake_allocation_tool_raw.tags.raw_content.records[*].is_active
  is_sample:
    description: True when the record is app-generated sample data rather than a real tag.
    lineage:
    - datalake_allocation_tool_raw.tags.raw_content.records[*].is_sample
  ts_deactivated:
    description: Timestamp (UTC) when the tag was deactivated, when applicable.
    lineage:
    - datalake_allocation_tool_raw.tags.raw_content.records[*].deactivated_at
  ts_created:
    description: Timestamp (UTC) when the tag was created in the Allocation Tool.
    lineage:
    - datalake_allocation_tool_raw.tags.raw_content.records[*].created_date
  ts_updated:
    description: Timestamp (UTC) of the last update to the tag in the Allocation Tool.
    lineage:
    - datalake_allocation_tool_raw.tags.raw_content.records[*].updated_date
  ts_export_generated:
    description: Timestamp (UTC) when the source export (snapshot or delta) that produced this row version was generated by the app.
    lineage:
    - datalake_allocation_tool_raw.tags.raw_content.generated_at
  ts_file_modified:
    description: Timestamp (UTC) when the export file landed in S3 (object LastModified).
    lineage:
    - datalake_allocation_tool_raw.tags.ts_file_modified
  ts_load:
    description: Timestamp indicating when the record was ingested into the raw layer.
    lineage:
    - datalake_allocation_tool_raw.tags.ts_load
