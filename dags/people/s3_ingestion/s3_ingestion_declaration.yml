dag:
  name: s3_ingestion
  owner: Data People
  schedule_start_date: 2026, 8, 27
  schedule_interval: "0 9 * * *"
  callback_by_task: False
  documentation:
    dag_purpose: |
      Generic S3 file ingestion for the People domain. Each table in
      tables_customization independently lands the objects of one S3 bucket/prefix
      into a raw table — bucket, prefix, file filter and read mode are configuration,
      not code.

      Source config lives in `spark_jobs/{environment}_conf.yml` under
      `s3_ingestion_sources.<source_key>`; this declaration owns only the destination
      side. To add a source: add the conf entry to prod_conf.yml and forno_conf.yml,
      add the table below with its `custom_schema` and `extra_spark_job_arguments:
      [<source_key>]`, and make sure the People EMR instance profile has
      s3:ListBucket + s3:GetObject on the source prefix (identity policy AND, for a
      cross-account bucket, the bucket policy).

      Raw keeps the payload verbatim in `raw_content` — one row per object
      (`read_mode: whole_file`) or per line (`read_mode: lines`) — so an external
      app can change its export contract without breaking ingestion; parsing belongs
      to the clean layer.

      The tables are incremental: partitions come from each object's S3 LastModified
      in UTC and load_start_date/load_end_date select which objects are ingested, so a
      run replaces only the day partitions it covers and leaves history untouched.
      That makes reruns and backfills idempotent, and the job fails rather than write
      if the session is not in dynamic partition-overwrite mode. The window is
      inclusive on both ends: the one-day overlap between runs is intentional and
      self-heals objects that land late.

      Clean tables (queries/clean) hold the current state of each Allocation Tool
      entity, built incrementally: the app exports one initial per-entity snapshot
      (envelope `{entity, type, count, records, generated_at}` in the entity's own
      prefix) and afterwards only modifications, as unified delta files in the
      `delta` prefix (`{allocations, tags, groups, counts, generated_at, watermark}`,
      full records of every entity changed since `watermark`). Each run explodes the
      records that landed in its load window — snapshot and delta alike — keeps the
      latest version per entity id and MERGEs it into the clean table on that id.
      The `when_matched_update_condition` guard only lets an export generated at the
      same time or later overwrite a row, so reruns and out-of-order backfills never
      regress state. Older export formats in the entity prefixes (bare JSON arrays
      and unified envelopes without `records`) are ignored by the content filter;
      deletions are soft (`status` / `is_active` flags), so snapshot + deltas are
      the whole truth. `raw_inner_dependencies` runs the delta raw load before the
      entity raw loads so every clean task sees the window's delta files.

workflow:
  type: custom_ingestion
  layer: raw
  # Fallback only: every table overrides it so each ingested system gets its own
  # raw schema instead of a shared "s3" one.
  custom_schema: s3
  bucket_config_name: people_bucket
  has_hive_sync: false
  load_spark_job: load_s3_ingestion_raw
  default_extraction_type: incremental
  default_partitions: [year, month, day]
  default_table_privileges:
    people-team: ["ALL PRIVILEGES"]
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_end | ds, 'load_end_date') }}"
  spark_job_arguments:
    - "{environment}"
    - "{bucket}"
    - "{schema}"
    - "{table_name}"
    - "{partitions}"
    - "{extraction_type}"
    - "{load_start_date}"
    - "{load_end_date}"

  # Delta raw must land before each entity raw so the clean MERGE that follows the
  # entity raw sees every delta file of the load window (clean X runs after raw X).
  raw_inner_dependencies:
    allocation:
      - delta
    tags:
      - delta
    groups:
      - delta

  tables_customization:
    # extra_spark_job_arguments[0] is the source_key in {environment}_conf.yml.
    # merge_on / when_matched_update_condition configure the CLEAN MERGE (the raw
    # custom job doesn't consume them): upsert by entity id, and only an export
    # generated at the same time or later may overwrite a row, so reruns and
    # out-of-order backfills never regress current state.
    allocation:
      custom_schema: allocation_tool
      extraction_type: incremental
      partitions: [year, month, day]
      merge_on: [id_allocation]
      when_matched_update_condition: source.ts_export_generated >= target.ts_export_generated
      clean_table_name: allocations
      clean_extraction_type: incremental
      clean_partitions: []
      extra_spark_job_arguments:
        - "allocation_tool_allocation"
    tags:
      custom_schema: allocation_tool
      extraction_type: incremental
      partitions: [year, month, day]
      merge_on: [id_tag]
      when_matched_update_condition: source.ts_export_generated >= target.ts_export_generated
      clean_table_name: tags
      clean_extraction_type: incremental
      clean_partitions: []
      extra_spark_job_arguments:
        - "allocation_tool_tags"
    groups:
      custom_schema: allocation_tool
      extraction_type: incremental
      partitions: [year, month, day]
      merge_on: [id_group]
      when_matched_update_condition: source.ts_export_generated >= target.ts_export_generated
      clean_table_name: groups
      clean_extraction_type: incremental
      clean_partitions: []
      extra_spark_job_arguments:
        - "allocation_tool_groups"
    # Unified modification exports ({allocations, tags, groups, ...}); no clean
    # table of its own — the three entity clean queries read it.
    delta:
      custom_schema: allocation_tool
      extraction_type: incremental
      partitions: [year, month, day]
      extra_spark_job_arguments:
        - "allocation_tool_delta"
