---
database_name: dw_employee_test
table_name: dim_hierarchy
owner: isabella.araujo@quintoandar.com.br
domain: People
description: |-
  Dimension table that stores the management chain for each employee assignment.
  Grain: one record per assignment per hierarchy version (period when the chain is valid).
  The hierarchy shows up to 10 levels of managers, ordered from the most distant leader (L0) to the direct manager (L9).
  L0 is always the CEO (top-most manager in the company structure).
columns:
  sk_hierarchy_version:
    description: Deterministic surrogate key for the hierarchy version (MD5 of assignment + validity period).
    lineage:
      - datalake_employee_registration.identifier_mapping.assignment_number
      - datalake_pin_core_clean.assignment_supervisor.dt_effective_started
      - datalake_pin_core_clean.assignment_supervisor.dt_effective_ended
  assignment_number:
    description: Assignment number (employee code) whose managerial chain is tracked in this record.
    lineage:
      - datalake_employee_registration.identifier_mapping.assignment_number
  assignment_number_l0:
    description: Assignment number of the top-level manager in the valid chain.
    lineage:
      - datalake_employee_registration.identifier_mapping.assignment_number
  name_l0:
    description: Full name of the top-level manager in the valid chain.
    lineage:
      - datalake_employee_registration.identifier_mapping.full_name
      - datalake_pin_core_clean.person_name.display_name
  email_l0:
    description: Work e-mail of the top-level manager in the valid chain.
    lineage:
      - datalake_employee_registration.identifier_mapping.work_email
  assignment_number_l1:
    description: Assignment number of the manager one level below L0.
    lineage:
      - datalake_employee_registration.identifier_mapping.assignment_number
  name_l1:
    description: Full name of the manager one level below L0.
    lineage:
      - datalake_employee_registration.identifier_mapping.full_name
      - datalake_pin_core_clean.person_name.display_name
  email_l1:
    description: Work e-mail of the manager one level below L0.
    lineage:
      - datalake_employee_registration.identifier_mapping.work_email
  assignment_number_l2:
    description: Assignment number of the manager one level below L1.
    lineage:
      - datalake_employee_registration.identifier_mapping.assignment_number
  name_l2:
    description: Full name of the manager one level below L1.
    lineage:
      - datalake_employee_registration.identifier_mapping.full_name
      - datalake_pin_core_clean.person_name.display_name
  email_l2:
    description: Work e-mail of the manager one level below L1.
    lineage:
      - datalake_employee_registration.identifier_mapping.work_email
  assignment_number_l3:
    description: Assignment number of the manager one level below L2.
    lineage:
      - datalake_employee_registration.identifier_mapping.assignment_number
  name_l3:
    description: Full name of the manager one level below L2.
    lineage:
      - datalake_employee_registration.identifier_mapping.full_name
      - datalake_pin_core_clean.person_name.display_name
  email_l3:
    description: Work e-mail of the manager one level below L2.
    lineage:
      - datalake_employee_registration.identifier_mapping.work_email
  assignment_number_l4:
    description: Assignment number of the manager one level below L3.
    lineage:
      - datalake_employee_registration.identifier_mapping.assignment_number
  name_l4:
    description: Full name of the manager one level below L3.
    lineage:
      - datalake_employee_registration.identifier_mapping.full_name
      - datalake_pin_core_clean.person_name.display_name
  email_l4:
    description: Work e-mail of the manager one level below L3.
    lineage:
      - datalake_employee_registration.identifier_mapping.work_email
  assignment_number_l5:
    description: Assignment number of the manager one level below L4.
    lineage:
      - datalake_employee_registration.identifier_mapping.assignment_number
  name_l5:
    description: Full name of the manager one level below L4.
    lineage:
      - datalake_employee_registration.identifier_mapping.full_name
      - datalake_pin_core_clean.person_name.display_name
  email_l5:
    description: Work e-mail of the manager one level below L4.
    lineage:
      - datalake_employee_registration.identifier_mapping.work_email
  assignment_number_l6:
    description: Assignment number of the manager one level below L5.
    lineage:
      - datalake_employee_registration.identifier_mapping.assignment_number
  name_l6:
    description: Full name of the manager one level below L5.
    lineage:
      - datalake_employee_registration.identifier_mapping.full_name
      - datalake_pin_core_clean.person_name.display_name
  email_l6:
    description: Work e-mail of the manager one level below L5.
    lineage:
      - datalake_employee_registration.identifier_mapping.work_email
  assignment_number_l7:
    description: Assignment number of the manager one level below L6.
    lineage:
      - datalake_employee_registration.identifier_mapping.assignment_number
  name_l7:
    description: Full name of the manager one level below L6.
    lineage:
      - datalake_employee_registration.identifier_mapping.full_name
      - datalake_pin_core_clean.person_name.display_name
  email_l7:
    description: Work e-mail of the manager one level below L6.
    lineage:
      - datalake_employee_registration.identifier_mapping.work_email
  assignment_number_l8:
    description: Assignment number of the manager one level below L7.
    lineage:
      - datalake_employee_registration.identifier_mapping.assignment_number
  name_l8:
    description: Full name of the manager one level below L7.
    lineage:
      - datalake_employee_registration.identifier_mapping.full_name
      - datalake_pin_core_clean.person_name.display_name
  email_l8:
    description: Work e-mail of the manager one level below L7.
    lineage:
      - datalake_employee_registration.identifier_mapping.work_email
  assignment_number_l9:
    description: Assignment number of the direct manager (closest to the employee) in the chain.
    lineage:
      - datalake_employee_registration.identifier_mapping.assignment_number
  name_l9:
    description: Full name of the direct manager (closest to the employee) in the chain.
    lineage:
      - datalake_employee_registration.identifier_mapping.full_name
      - datalake_pin_core_clean.person_name.display_name
  email_l9:
    description: Work e-mail of the direct manager (closest to the employee) in the chain.
    lineage:
      - datalake_employee_registration.identifier_mapping.work_email
  version:
    description: Sequential version number of the hierarchy for the assignment (increments when the chain changes).
  is_current:
    description: Indicates whether this hierarchy version is currently valid (TRUE) or historical (FALSE).
  dt_valid_from:
    description: Date when this hierarchy version became effective.
    lineage:
      - datalake_pin_core_clean.assignment_supervisor.dt_effective_started
  dt_valid_to:
    description: Date when this hierarchy version ended. '4712-12-31' means ongoing.
    lineage:
      - datalake_pin_core_clean.assignment_supervisor.dt_effective_ended
  ts_load:
    description: Timestamp when the record was loaded into the dimension.
