database_name: dw_employee_test
table_name: dim_job
owner: isabella.araujo@quintoandar.com.br
domain: People
description: |-
  Job dimension containing essential job attributes for compensation analysis.
  This dimension provides job classification, compensation ladder information, and variable
  compensation targets (PLR, RVV, SOP) necessary for salary analysis and reporting.
  This is an SCD Type 2 dimension tracking historical changes in job attributes and compensation targets.
columns:
  sk_job_version:
    description: Versioned surrogate key that uniquely identifies each version of a job record. Generated as MD5 hash of id_job + dt_effective_started.
    lineage:
    - datalake_pin_core_clean.job.id_job
    - datalake_pin_core_clean.job.dt_effective_started
  id_job:
    description: Natural business key representing the job position ID from the HR system.
    lineage:
    - datalake_pin_core_clean.job.id_job
  job_code:
    description: Business code for the job position as defined in the HR system.
    lineage:
    - datalake_pin_core_clean.job.job_code
  version:
    description: Sequential version number for this job record. Increments with each change.
    lineage:
    - datalake_pin_core_clean.job.id_job
  job_name:
    description: Descriptive name of the job position in Portuguese (PTB).
    lineage:
    - datalake_pin_core_clean.job_translation.name
  job_category:
    description: High-level category or family that groups similar jobs together.
    lineage:
    - datalake_pin_core_clean.job_family_translation.job_family_name
  band:
    description: Salary/seniority band or grade for the job position.
    lineage:
    - datalake_pin_core_clean.grade_translation.name
  career_track:
    description: Career track or contribution level for the job.
    lineage:
    - datalake_pin_core_clean.job.contribution_level
  comp_ladder_directorate:
    description: Compensation ladder or directorate defining the salary structure.
    lineage:
    - datalake_pin_core_clean.grade_ladder_translation.name
  comp_ladder_business_unit:
    description: Business unit associated with the compensation ladder.
    lineage:
    - datalake_pin_core_clean.set_identifiers.set_name
  working_hours_regime:
    description: Working hours arrangement for the job (e.g., full-time, part-time).
    lineage:
    - datalake_pin_core_clean.job.work_arrangement
  target_sop_currency:
    description: Currency for the target SOP amount.
    lineage:
    - datalake_pin_core_clean.job.target_sop_currency
  brazilian_occupation_code:
    description: Brazilian occupation code (CBO) for regulatory compliance.
    lineage:
    - datalake_pin_core_clean.job_legislative.brazilian_occupation_code
  workload:
    description: Weekly hours for the job position.
    lineage:
    - datalake_pin_core_clean.job.weekly_hours
  target_plr:
    description: Target PLR (Profit Sharing) amount for this job.
    lineage:
    - datalake_pin_core_clean.job.target_plr
  target_plr_salary_multiplier:
    description: PLR multiplier factor applied to the salary.
    lineage:
    - datalake_pin_core_clean.job.target_plr_salary_multiplier
  target_rvv:
    description: Target RVV (Variable Sales Compensation) amount for this job.
    lineage:
    - datalake_pin_core_clean.job.target_rvv
  target_sop:
    description: Target SOP (Stock Options Program) amount for this job.
    lineage:
    - datalake_pin_core_clean.job.target_sop
  target_hiring_sop:
    description: Target hiring SOP amount offered to new hires for this job.
    lineage:
    - datalake_pin_core_clean.job.target_hiring_sop
  target_bonus_tech_usd:
    description: Target technology bonus in USD for this job.
    lineage:
    - datalake_pin_core_clean.job.target_bonus_tech_usd
  salary_range_midpoint:
    description: Midpoint of the salary range for this job and band.
    lineage:
    - datalake_pin_core_clean.rate_values.mid_value
  salary_range_min:
    description: Minimum salary in the range for this job and band.
    lineage:
    - datalake_pin_core_clean.rate_values.minimum_value
  salary_range_max:
    description: Maximum salary in the range for this job and band.
    lineage:
    - datalake_pin_core_clean.rate_values.maximum_value
  is_active:
    description: Flag indicating if the job position is currently active and available.
    lineage:
    - datalake_pin_core_clean.job.is_active
  has_clock_in:
    description: Flag indicating if time clocking is required for this job.
    lineage:
    - datalake_pin_core_clean.job.is_time_clocking_required
  dt_effective_started:
    description: Date when this job configuration became effective.
    lineage:
    - datalake_pin_core_clean.job.dt_effective_started
  dt_effective_ended:
    description: Date when this job configuration stopped being effective.
    lineage:
    - datalake_pin_core_clean.job.dt_effective_ended
  is_current:
    description: Flag indicating if this is the current active version (TRUE) or historical (FALSE). SCD Type 2 control field.
    lineage:
    - datalake_pin_core_clean.job.id_job
  dt_valid_from:
    description: Date when this version of the record became valid. SCD Type 2 control field.
    lineage:
    - datalake_pin_core_clean.job.dt_effective_started
  dt_valid_to:
    description: Date when this version stopped being valid. '9999-12-31' indicates current version. SCD Type 2 control field.
    lineage:
    - datalake_pin_core_clean.job.dt_effective_ended
  version:
    description: Sequential version number for this job record. Increments with each change.
    lineage:
    - datalake_pin_core_clean.job.id_job
  ts_updated:
    description: Timestamp when the record was last updated in the source system.
    lineage:
    - datalake_pin_core_clean.job.ts_updated
  ts_load:
    description: Timestamp when the record was loaded into the table.
