---
database_name: dw_employee_test
table_name: dim_cost_center
owner: isabella.araujo@quintoandar.com.br
domain: People
description: |-
  Dimension table for cost center with historical tracking (SCD Type 2).
  This dimension tracks organizational structure changes over time, including business unit,
  product, brand, vertical, structure, team, chapter, line, and leadership hierarchy changes.
  Grain: One record per cost center per version.
  This is an SCD Type 2 dimension tracking historical changes in cost center attributes.
columns:
  sk_cost_center_version:
    description: Versioned surrogate key that uniquely identifies each version of a cost center record. Generated as MD5 hash of id_organization + dt_valid_from.
    lineage:
    - datalake_pin_core_clean.all_organization_units.id_organization
    - datalake_pin_core_clean.all_organization_units.dt_effective_started
  cost_center_code:
    description: Business key uniquely identifying the cost center (e.g., 'X01434'). Same value for all versions of the same cost center.
    lineage:
    - datalake_pin_core_clean.all_organization_units.cost_center_code
  cost_center_name:
    description: Translated name of the cost center in Portuguese (PTB).
    lineage:
    - datalake_pin_core_clean.organization_unit_translation.name
  bp_person_number:
    description: Business partner person number assigned to this cost center. Represents the person responsible for the cost center.
    lineage:
    - datalake_pin_core_clean.assignment_responsibility.id_person
  business:
    description: Business unit to which the cost center belongs.
    categories:
      Classifieds & CRM: ''
      Corporate: ''
      For Living: ''
      For Rent: ''
      For Sale: ''
      Inmuebles24 Full: ''
      QuintoCred: ''
    lineage:
    - datalake_pin_core_clean.all_organization_units.business
  product:
    description: Primary product associated with this cost center.
    categories:
      1P: ''
      3P Demand: ''
      3P Supply: ''
      Benvi Cross: ''
      Brokerage Only: ''
      CRM: ''
      Classifieds: ''
      Classifieds & CRM Cross: ''
      Corporate Cross: ''
      For Living: ''
      For Rent Cross: ''
      For Sale Cross: ''
      Full Rental: ''
      Guarantees: ''
      Internal Channel: ''
      Mortgage Cross: ''
      QuintoCred Cross: ''
      Rede: ''
      Standalone: ''
    lineage:
    - datalake_pin_core_clean.all_organization_units.product
  brand:
    description: Brand to which the cost center belongs.
    categories:
      Adondevivir: ''
      Allocations: ''
      Classifieds 2.0: ''
      Compre o Alquile: ''
      Imovelweb: ''
      Inmuebles24: ''
      Plusvalia: ''
      Tokko: ''
      Total Brands: ''
      Union: ''
      Urbania: ''
      Zonaprop: ''
    lineage:
    - datalake_pin_core_clean.all_organization_units.brand
  vertical:
    description: Derived business vertical based on the structure field.
    categories:
      Corp: 'Part of one of the following Structures: Finance, People, Legal, Administrative.'
      Ops: 'Part of one of the following Structures: Sales, Operations, Marketing, Guarantees.'
      Tech: 'Part of Product Structure.'
    lineage:
    - datalake_pin_core_clean.all_organization_units.vertical
  structure:
    description: Structure to which the cost center belongs.
    categories:
      Administrative: ''
      Finance: ''
      Guarantees: ''
      Legal: ''
      Marketing: ''
      Operations: ''
      People: ''
      Product: ''
      Sales: ''
    lineage:
    - datalake_pin_core_clean.all_organization_units.structure
  team:
    description: Team to which the cost center belongs.
    lineage:
    - datalake_pin_core_clean.all_organization_units.team
  chapter:
    description: Chapter to which the cost center belongs.
    lineage:
    - datalake_pin_core_clean.all_organization_units.chapter
  line:
    description: Line to which the cost center belongs.
    lineage:
    - datalake_pin_core_clean.all_organization_units.line
  name_owner_l1:
    description: Name of the first level owner (L1) in the hierarchy responsible for the cost center.
    lineage:
    - datalake_pin_core_clean.all_organization_units.name_owner_l1
  name_owner_l2:
    description: Name of the second level owner (L2) in the hierarchy responsible for the cost center.
    lineage:
    - datalake_pin_core_clean.all_organization_units.name_owner_l2
  name_owner_l3:
    description: Name of the third level owner (L3) in the hierarchy responsible for the cost center.
    lineage:
    - datalake_pin_core_clean.all_organization_units.name_owner_l3
  headcount_type:
    description: Type of headcount classification for the cost center.
    lineage:
    - datalake_pin_core_clean.all_organization_units.headcount_type
  is_active:
    description: Flag indicating if the cost center is currently active (TRUE) or inactive (FALSE). Derived from organization_unit_classification.status.
    lineage:
    - datalake_pin_core_clean.organization_unit_classification.status
  version:
    description: |
      Sequential version number for this cost center record, starting at 1. Increments with each attribute change.
      Used to identify how many times a cost center's tracked attributes have changed over time.
    lineage:
    - datalake_pin_core_clean.all_organization_units.id_organization
    - datalake_pin_core_clean.assignment_responsibility.id_person
    - datalake_pin_core_clean.organization_unit_translation.name
    - datalake_pin_core_clean.all_organization_units.cost_center_code
    - datalake_pin_core_clean.all_organization_units.business
    - datalake_pin_core_clean.all_organization_units.product
    - datalake_pin_core_clean.all_organization_units.brand
    - datalake_pin_core_clean.all_organization_units.vertical
    - datalake_pin_core_clean.all_organization_units.structure
    - datalake_pin_core_clean.all_organization_units.team
    - datalake_pin_core_clean.all_organization_units.chapter
    - datalake_pin_core_clean.all_organization_units.line
    - datalake_pin_core_clean.all_organization_units.name_owner_l1
    - datalake_pin_core_clean.all_organization_units.name_owner_l2
    - datalake_pin_core_clean.all_organization_units.name_owner_l3
    - datalake_pin_core_clean.all_organization_units.headcount_type
    - datalake_pin_core_clean.organization_unit_classification.status
    - datalake_pin_core_clean.all_organization_units.dt_effective_started
  dt_valid_from:
    description: |
      The date from which this version of the cost center becomes effective (SCD Type 2).
      Calculated as the minimum of all effective start dates from source tables (organization_units, classification, translation).
      Represents when a tracked attribute changed (organizational structure, leadership, status, etc.).
    lineage:
    - datalake_pin_core_clean.all_organization_units.dt_effective_started
    - datalake_pin_core_clean.organization_unit_classification.dt_effective_started
    - datalake_pin_core_clean.organization_unit_translation.dt_effective_started
  dt_valid_to:
    description: |
      The date until which this version of the cost center remains valid (exclusive, SCD Type 2).
      Set to '9999-12-31' for the current version.
      For historical versions, equals the minimum between (next version's dt_valid_from - 1 day) and the maximum effective end date from source tables.
      This ensures we don't create validity periods beyond what the source data supports.
    lineage:
    - datalake_pin_core_clean.all_organization_units.dt_effective_ended
    - datalake_pin_core_clean.organization_unit_classification.dt_effective_ended
    - datalake_pin_core_clean.organization_unit_translation.dt_effective_ended
  is_current:
    description: |
      Boolean flag indicating if this is the current active version of the cost center (TRUE) or a historical version (FALSE).
      SCD Type 2 control field.
    lineage:
    - datalake_pin_core_clean.all_organization_units.id_organization
    - datalake_pin_core_clean.assignment_responsibility.id_person
    - datalake_pin_core_clean.organization_unit_translation.name
    - datalake_pin_core_clean.all_organization_units.cost_center_code
    - datalake_pin_core_clean.all_organization_units.business
    - datalake_pin_core_clean.all_organization_units.product
    - datalake_pin_core_clean.all_organization_units.brand
    - datalake_pin_core_clean.all_organization_units.vertical
    - datalake_pin_core_clean.all_organization_units.structure
    - datalake_pin_core_clean.all_organization_units.team
    - datalake_pin_core_clean.all_organization_units.chapter
    - datalake_pin_core_clean.all_organization_units.line
    - datalake_pin_core_clean.all_organization_units.name_owner_l1
    - datalake_pin_core_clean.all_organization_units.name_owner_l2
    - datalake_pin_core_clean.all_organization_units.name_owner_l3
    - datalake_pin_core_clean.all_organization_units.headcount_type
    - datalake_pin_core_clean.organization_unit_classification.status
    - datalake_pin_core_clean.all_organization_units.dt_effective_started
  ts_load:
    description: Timestamp when the record was loaded into the table.

