---
table_name: dw_employee_test.fact_employees
alert_channel: PEOPLE_ALERTS

table_level_validations:
  has_size:
    greater_than: 100
    severity_level: Warning
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: 0
    less_than_or_equal_to: 20
    severity_level: Warning

column_level_validations:
  sk_employee_version:
    is_unique:
      severity_level: Warning
    is_complete:
      severity_level: Warning
  sk_employee:
    is_complete:
      severity_level: Warning
  version:
    has_min_value:
      greater_than_or_equal_to: 1
      severity_level: Warning
  is_current:
    custom:
      # Validate that each employee has exactly one current version
      constraint: |-
        (SELECT COUNT(*)
         FROM (
           SELECT sk_employee, COUNT(*) as current_count
           FROM dw_employee_test.fact_employees
           WHERE is_current = TRUE
           GROUP BY sk_employee
           HAVING current_count > 1
         )) = 0
      severity_level: Warning
  is_pending_worker:
    custom:
      # Validate that all records have is_pending_worker = FALSE
      constraint: |-
        (SELECT COUNT(*)
         FROM dw_employee_test.fact_employees
         WHERE is_pending_worker = TRUE
        ) = 0
      severity_level: Warning

