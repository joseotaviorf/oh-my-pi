---
table_name: dw_employee_test.dim_job
alert_channel: PEOPLE_ALERTS

table_level_validations:
  has_size:
    greater_than: 100
    severity_level: Warning
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: -10
    less_than_or_equal_to: 20
    severity_level: Warning

column_level_validations:
  sk_job_version:
    is_unique:
      severity_level: Warning
    is_complete:
      severity_level: Warning
  id_job:
    is_complete:
      severity_level: Warning
  version:
    is_complete:
      severity_level: Warning
    has_min:
      min_value: 1
      severity_level: Warning
  job_code:
    is_complete:
      severity_level: Warning
  job_name:
    is_complete:
      severity_level: Warning
  band:
    is_complete:
      severity_level: Warning
  comp_ladder_directorate:
    is_complete:
      severity_level: Warning
  is_active:
    is_complete:
      severity_level: Warning
  is_current:
    is_complete:
      severity_level: Warning
  dt_valid_from:
    is_complete:
      severity_level: Warning
  dt_valid_to:
    is_complete:
      severity_level: Warning
  dt_effective_started:
    is_complete:
      severity_level: Warning
  ts_load:
    is_complete:
      severity_level: Warning
  custom:
    # Validate that each id_job has exactly one current version
    constraint: |-
      (SELECT COUNT(*) 
       FROM (
         SELECT id_job, COUNT(*) as current_count
         FROM dw_employee_test.dim_job
         WHERE is_current = TRUE
         GROUP BY id_job
         HAVING current_count > 1
       )) = 0
    severity_level: Warning
