---
table_name: datalake_currency_clean.closing_rates
alert_channel: PEOPLE_ALERTS

table_level_validations:
  has_size:
    greater_than: 1
    severity_level: Warning

column_level_validations:
  currency_pair:
    is_complete:
      severity_level: Warning
    has_min_length:
      equal_to: 7
      severity_level: Warning
    has_max_length:
      equal_to: 7
      severity_level: Warning
    is_contained_in:
      values: ["USD-BRL", "EUR-BRL", "ARS-BRL", "MXN-BRL"]
      severity_level: Warning
  one_row_per_currency_pair_and_date:
    custom:
      # We should only have 1 currency_pair line per day
      constraint: "(SELECT COUNT(*) FROM (SELECT 1 FROM datalake_currency_clean.closing_rates GROUP BY currency_pair, dt_created HAVING COUNT(*) > 1)) = 0"
      severity_level: Warning

  currency_from:
    is_complete:
      severity_level: Warning
    is_contained_in:
      values: ["USD", "EUR", "ARS", "MXN"]
      severity_level: Warning

  currency_to:
    is_complete:
      severity_level: Warning
    is_contained_in:
      values: ["BRL"]
      severity_level: Warning

  bid_price:
    is_complete:
      severity_level: Warning
    has_min_value:
      greater_than_or_equal_to: 0
      severity_level: Warning
    has_mean_value:
      # unlikely values set to catch gross errors
      greater_than_or_equal_to: 0.1
      less_than_or_equal_to: 10000
      severity_level: Warning

  ask_price:
    is_complete:
      severity_level: Warning
    has_min_value:
      greater_than_or_equal_to: 0
      severity_level: Warning

  high_rate:
    is_complete:
      severity_level: Warning
    has_min_value:
      greater_than_or_equal_to: 0
      severity_level: Warning
  high_rate_must_not_be_below_low_rate:
    custom:
      # OHLC sanity: high_rate must be greater than or equal to low_rate.
      constraint: "high_rate >= low_rate"
      severity_level: Warning

  low_rate:
    is_complete:
      severity_level: Warning
    has_min_value:
      greater_than_or_equal_to: 0
      severity_level: Warning

  dt_created:
    is_complete:
      severity_level: Warning

  ts_recorded_at:
    is_complete:
      severity_level: Warning
  recorded_at_must_not_be_after_load_time:
    custom:
      # This ensures the pipeline's temporal consistency
      constraint: "ts_recorded_at <= ts_load"
      severity_level: Warning

  ts_load:
    is_complete:
      severity_level: Warning