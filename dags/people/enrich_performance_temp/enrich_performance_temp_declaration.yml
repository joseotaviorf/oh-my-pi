dag:
  name: enrich_performance_temp
  owner: Data People
  callback_by_task: False
  schedule_start_date: 2025, 11, 25 
  documentation:
    dag_purpose: TEMPORARY mirror of enrich_performance at datalake_pin for the ~1-week migration window (DBP-1433 ST2). To be deleted in ST5 (DBP-1574).
workflow:
  type: query_delta
  layer: enrich
  has_hive_sync: false
  bucket_config_name: people_bucket
  default_table_privileges:
    people-team: ["ALL PRIVILEGES"]
  custom_schema: pin
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  tables_customization:
    goal:
      vacuum_retention_hours: 168
      vacuum_lite: true
    performance_evaluation:
      vacuum_retention_hours: 168
      vacuum_lite: true
    talent_review:
      vacuum_retention_hours: 168
      vacuum_lite: true
