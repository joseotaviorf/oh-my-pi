database_name: dw_employee_details
table_name: fact_assignment_snapshots
owner: isabella.araujo@quintoandar.com.br
domain: People
description: |
  Workforce assignments as of each calendar day: person and assignment identifiers, tenure, direct and indirect report counts, leadership and activity flags, hire and termination dates, and surrogate keys to job, cost center, business unit, contact, documentation, emergency contact, employee, and hierarchy dimensions.
  Supports headcount by date, tenure, admissions and exits, and org context; dimension labels and PII-heavy attributes are read via the sk_* columns on this table.
  Daily snapshot fact: one row per assignment_number and dt_reference (not an SCD table; each row is a point-in-time slice).
columns:
  sk_cost_center_version:
    description: Cost center identifier. Use to get cost center name and details from dim_cost_center.
    lineage:
      - datalake_people.assignment_snapshots.sk_cost_center_version
  sk_job_version:
    description: Job identifier. Use to get job title and details from dim_job.
    lineage:
      - datalake_people.assignment_snapshots.sk_job_version
  sk_compensation_version:
    description: Compensation period identifier. Joins to dw_compensation.fact_compensations.sk_compensation for equality joins without a DW-to-DW dependency. '-1' when no compensation record covers dt_reference.
    lineage:
      - datalake_people.assignment_snapshots.sk_compensation_version
  sk_contact_version:
    description: Contact info identifier. Use to get email, phone, and address from dim_contact.
    lineage:
      - dw_employee_details.dim_contact.sk_contact_version
  sk_documentation_version:
    description: Documentation identifier. Use to get document details from dim_documentation.
    lineage:
      - dw_employee_details.dim_documentation.sk_documentation_version
  sk_emergency_contact_version:
    description: Emergency contact identifier. Use to get emergency contact details from dim_emergency_contact.
    lineage:
      - dw_employee_details.dim_emergency_contact.sk_emergency_contact_version
  sk_employee:
    description: Employee surrogate key. Use to join dim_employee for display name, work email, education, and generation attributes.
    lineage:
      - datalake_people.assignment_snapshots.id_person
  sk_hierarchy_version:
    description: Org structure identifier. Use to get management hierarchy from dim_management_hierarchy.
    lineage:
      - datalake_people.assignment_snapshots.sk_hierarchy_version
  sk_business_unit:
    description: Business unit surrogate key. Use to join dw_organization.dim_business_unit on sk_business_unit for business unit name and organizational context.
    lineage:
      - datalake_people.assignment_snapshots.id_business_unit
  sk_termination_event_definition:
    description: Termination reason and type. Use to get details from dim_event_definition. Empty when still active.
    lineage:
      - datalake_people.assignment_snapshots.sk_termination_event_definition
  sk_hired_date:
    description: Hire date in YYYYMMDD format. Use for date-based joins.
    lineage:
      - datalake_people.assignment_snapshots.sk_hired_date
  sk_terminated_date:
    description: End date of the assignment in YYYYMMDD format. Shows 99991231 when still active (no end date yet).
    lineage:
      - datalake_people.assignment_snapshots.sk_terminated_date
  sk_reference_date:
    description: Snapshot date in YYYYMMDD format. Each row shows the employee's status on this date.
    lineage:
      - datalake_people.assignment_snapshots.sk_reference_date
  person_number:
    description: Unique employee identifier in the HR system. Use to link to other employee details tables.
    lineage:
      - datalake_people.assignment_snapshots.person_number
  assignment_number:
    description: Employee registration number. Grain identifier for the work assignment. Use for joins.
    lineage:
      - datalake_people.assignment_snapshots.assignment_number
  employment_status:
    description: |
      Human-readable employment status derived from assignment_status_type.
    categories:
      "Active": Employee has an active assignment on the reference date.
      "Terminated": Employee's assignment has ended on or before the reference date.
    lineage:
      - datalake_people.assignment_snapshots.employment_status
  tenure_range:
    description: |
      Tenure band based on months_tenure_in_company (months between original hire date and reference date).
      Null when the hire date is unknown.
    categories:
      "< 3 months": Less than 3 months of tenure.
      "3-11 months": Between 3 and 11 months of tenure.
      "1-2 years": Between 1 and 2 years of tenure.
      "3-4 years": Between 3 and 4 years of tenure.
      "5+ years": 5 or more years of tenure.
    lineage:
      - datalake_people.assignment_snapshots.tenure_range
  days_tenure_in_company:
    description: Days since the employee's first hire at the company. Use for company tenure analysis.
    lineage:
      - datalake_people.assignment_snapshots.days_tenure_in_company
  months_tenure_in_company:
    description: Months since the employee's first hire at the company. Use for company tenure analysis.
    lineage:
      - datalake_people.assignment_snapshots.months_tenure_in_company
  days_tenure_in_assignment:
    description: Days since the employee started this specific assignment. Use for time-in-current-role analysis.
    lineage:
      - datalake_people.assignment_snapshots.days_tenure_in_assignment
  count_direct_report:
    description: Number of employees who report directly to this assignment (one level below in the org hierarchy).
    lineage:
      - datalake_people.assignment_snapshots.count_direct_report
  count_indirect_report:
    description: Number of employees who report indirectly to this assignment (two or more levels below in the org hierarchy).
    lineage:
      - datalake_people.assignment_snapshots.count_indirect_report
  count_total_report:
    description: Total number of reports (direct + indirect) under this assignment. Zero when no reports exist.
    lineage:
      - datalake_people.assignment_snapshots.count_total_report
  is_leadership_team_member:
    description: True when the employee is in the Leadership Team (band 10+ or EXEC). Used for DE&I analytics.
    lineage:
      - datalake_people.assignment_snapshots.is_leadership_team_member
  is_executive_team_member:
    description: True when the employee is in the Executive Team (L0 or L1 in hierarchy and band 14+).
    lineage:
      - datalake_people.assignment_snapshots.is_executive_team_member
  is_manager:
    description: True when the employee has leadership career track or has at least one direct report.
    lineage:
      - datalake_people.assignment_snapshots.is_manager
  is_active:
    description: True when the employee is currently active in this assignment.
    lineage:
      - datalake_people.assignment_snapshots.is_active
  has_emergency_contact:
    description: True when the employee has at least one emergency contact on file.
    lineage:
      - datalake_people.assignment_snapshots.has_emergency_contact
  is_internal_transfer:
    description: True when the employee was already at the company before this assignment (e.g., moved between teams).
    lineage:
      - datalake_people.assignment_snapshots.is_internal_transfer
  is_transfer_termination:
    description: True when this assignment was closed by an internal transfer instead of a real exit. The employee remains active and employed under a new assignment, so these rows must be excluded from dismissal and turnover counts.
    lineage:
      - datalake_people.assignment_snapshots.is_transfer_termination
  is_primary_assignment_for_snapshot:
    description: True when this is the primary assignment for the employee on this snapshot date (the latest assignment when multiple assignments overlap for the same person and date).
    lineage:
      - datalake_people.assignment_snapshots.is_primary_assignment_for_snapshot
  is_reorganization_termination:
    description: True when the termination was part of an organizational restructuring (layoff/reorg). False for active employees or non-reorg terminations.
    lineage:
      - datalake_people.assignment_snapshots.is_reorganization_termination
  is_monthly_snapshot:
    description: True when dt_reference is the last day of the month, the most recent day (current date), or the assignment's termination date. The termination-date row guarantees a monthly snapshot exists for the month an employee left, even when they were terminated mid-month. Use to filter for monthly snapshots only.
    lineage:
      - datalake_people.assignment_snapshots.is_monthly_snapshot
  is_current:
    description: True for the assignment's latest available snapshot. Active assignments use the current date; terminated ones use the termination date. Exactly one row per assignment_number is flagged.
    lineage:
      - datalake_people.assignment_snapshots.is_current
  is_current_for_person:
    description: True when this row is the single current primary assignment for the person. Among rows with is_current and is_primary_assignment_for_snapshot, prefers the active assignment, then the latest dt_reference, then the highest assignment_number.
    lineage:
      - datalake_people.assignment_snapshots.is_current_for_person
  dt_original_hire:
    description: Date of the employee's first hire at the company. Stays the same when they move between teams or roles.
    lineage:
      - datalake_people.assignment_snapshots.dt_original_hire
  dt_hired:
    description: Date the employee started this assignment.
    lineage:
      - datalake_people.assignment_snapshots.dt_hired
  dt_terminated:
    description: Date the assignment ended. Shows 9999-12-31 when still active (no end date yet).
    lineage:
      - datalake_people.assignment_snapshots.dt_terminated
  dt_notified_termination:
    description: Date when the termination was notified to HR. Shows 9999-12-31 when still active.
    lineage:
      - datalake_people.assignment_snapshots.dt_notified_termination
  dt_reference:
    description: Snapshot date. Each row represents the employee's status on this date. Use for headcount by date.
    lineage:
      - datalake_people.assignment_snapshots.dt_reference
  dt_month_reference:
    description: Last calendar day of the snapshot month (LAST_DAY of dt_reference). Use when joining or grouping monthly snapshots — active employees show the month-end of today's month; terminated employees show the month-end of their termination month.
    lineage:
      - datalake_people.assignment_snapshots.dt_month_reference
  ts_load:
    description: When the record was loaded. For technical use only.
