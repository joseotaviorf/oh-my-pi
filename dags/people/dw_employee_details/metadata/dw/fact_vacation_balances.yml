database_name: dw_employee_details
table_name: fact_vacation_balances
owner: isabella.araujo@quintoandar.com.br
domain: People
description: |-
  Periodic snapshot fact table that records employee vacation balances per vacation period.
  Grain: one record per employee per assignment per vacation period.
  Includes accrued days, used days (absence and cash-out), and available balance.
  Sourced from pin_core and pin_absence clean layers.
columns:
  sk_vacation_balance:
    description: Primary key that uniquely identifies each vacation balance entry.
    lineage:
      - datalake_pin_core_clean.assignment_extra_info.id_assignment_extra_info
  sk_vacation_period_started_date:
    description: Foreign key to the date dimension (format yyyyMMdd) for the start date of the vacation period.
    lineage:
      - datalake_pin_core_clean.assignment_extra_info.dt_period_started
  sk_vacation_period_ended_date:
    description: Foreign key to the date dimension (format yyyyMMdd) for the end date of the vacation period.
    lineage:
      - datalake_pin_core_clean.assignment_extra_info.dt_period_ended
  sk_vacation_period_expiration_date:
    description: Foreign key to the date dimension (format yyyyMMdd) for the expiration date (end_date + 365 days).
    lineage:
      - datalake_pin_core_clean.assignment_extra_info.dt_period_ended
  person_number:
    description: Business key for the employee.
    lineage:
      - datalake_people.identifier_mapping.person_number
  assignment_number:
    description: Business key for the assignment.
    lineage:
      - datalake_people.identifier_mapping.assignment_number
  vacation_status:
    description: Status of the vacation period (Closed, In progress, Open, Expired).
    lineage:
      - datalake_pin_core_clean.assignment_extra_info.type_or_status
  vacation_period_order:
    description: Chronological order of the vacation period for the assignment (1 = initial, increments to most recent).
    lineage:
      - datalake_pin_core_clean.assignment_extra_info.dt_period_started
  days_accrued:
    description: Number of vacation days accrued by the employee in the vacation period.
    lineage:
      - datalake_pin_core_clean.assignment_extra_info.days_vacation_acquired
  days_taken_absence:
    description: Number of vacation days used as absence, from submitted and non-denied requests.
    lineage:
      - datalake_pin_absence_clean.person_entry.days_duration
  days_taken_cash_out:
    description: Number of vacation days converted to cash-out, from submitted and non-denied requests.
    lineage:
      - datalake_pin_absence_clean.person_entry.vacation_cash_out_request
  days_taken_total:
    description: Total sum of vacation days used (absence + cash-out).
    lineage:
      - datalake_pin_absence_clean.person_entry.days_duration
      - datalake_pin_absence_clean.person_entry.vacation_cash_out_request
  days_balance:
    description: |-
      Balance of available vacation days (accrued - total used). Reflects source system values.
      Negative values can occur when days_taken_total exceeds days_accrued (e.g. duplicate entries
      in Oracle HCM or cross-period usage).
    lineage:
      - datalake_pin_core_clean.assignment_extra_info.days_vacation_acquired
      - datalake_pin_absence_clean.person_entry.days_duration
      - datalake_pin_absence_clean.person_entry.vacation_cash_out_request
  days_to_be_accrued:
    description: |-
      Vacation days not yet accrued in the period (open periods only). Zero for closed periods (Closed).
      Open periods: days_accrued - days_already_accrued, where days_already_accrued = LEAST(days_accrued, 30 * days_elapsed / period_length).
      Uses 30 as the standard vacation days per period (Brazil). Country-specific values not available.
    lineage:
      - datalake_pin_core_clean.assignment_extra_info.days_vacation_acquired
      - datalake_pin_core_clean.assignment_extra_info.dt_period_started
      - datalake_pin_core_clean.assignment_extra_info.dt_period_ended
      - datalake_pin_core_clean.assignment_extra_info.type_or_status
  has_available_days:
    description: Boolean flag indicating if the employee has a non-zero vacation day balance.
    lineage:
      - datalake_pin_core_clean.assignment_extra_info.days_vacation_acquired
      - datalake_pin_absence_clean.person_entry.days_duration
      - datalake_pin_absence_clean.person_entry.vacation_cash_out_request
  is_latest_period:
    description: TRUE when this is the most recent vacation period for the assignment; FALSE otherwise.
    lineage:
      - datalake_pin_core_clean.assignment_extra_info.dt_period_started
  is_vacation_period_closed:
    description: Boolean flag indicating if the vacation period status is Closed.
    lineage:
      - datalake_pin_core_clean.assignment_extra_info.type_or_status
  dt_vacation_period_started:
    description: Start date of the vacation period.
    lineage:
      - datalake_pin_core_clean.assignment_extra_info.dt_period_started
  dt_vacation_period_ended:
    description: End date of the vacation period.
    lineage:
      - datalake_pin_core_clean.assignment_extra_info.dt_period_ended
  dt_vacation_period_expiration:
    description: Expiration date of the vacation period, calculated as end date plus 365 days.
    lineage:
      - datalake_pin_core_clean.assignment_extra_info.dt_period_ended
  ts_load:
    description: Timestamp of when the record was loaded into the table.
