database_name: dw_employee_details
table_name: dim_contact
owner: isabella.araujo@quintoandar.com.br
domain: People
description: |
  Dimension table with contact information of employees.
  SCD Type 2: tracks historical versions when email, phone, address or github changes.
  Includes personal email, phone, github username, and mailing address.
  sk_contact_version uniquely identifies each version (employee + valid from date).
columns:
  sk_contact_version:
    description: Surrogate key for the contact version. Hash of id_person and dt_valid_from.
    lineage:
      - datalake_pin_core_clean.all_people.id_person
      - datalake_pin_core_clean.all_people.dt_effective_started
  person_number:
    description: Business key for the employee.
    lineage:
      - datalake_pin_core_clean.all_people.person_number
  personal_email:
    description: Non-work email address registered in HCM for the employee.
    lineage:
      - datalake_pin_core_clean.email_address.email_address
  phone_country_code:
    description: International dialing prefix for the employee phone.
    lineage:
      - datalake_pin_core_clean.phone.country_code_number
  phone_area_code:
    description: Regional area code for the employee phone.
    lineage:
      - datalake_pin_core_clean.phone.area_code
  phone_number:
    description: Local subscriber number for the employee phone.
    lineage:
      - datalake_pin_core_clean.phone.phone_number
  full_phone_number:
    description: Complete phone number unifying country code, area code and number.
    lineage:
      - datalake_pin_core_clean.phone.country_code_number
      - datalake_pin_core_clean.phone.area_code
      - datalake_pin_core_clean.phone.phone_number
  github_username:
    description: GitHub username or profile link of the employee.
    lineage:
      - datalake_pin_core_clean.people_legislative.github_username
  address_street_type:
    description: Street type of the mailing address (e.g. rua, avenida).
    lineage:
      - datalake_pin_core_clean.address.street_type
      - datalake_pin_core_clean.person_address_usage.id_address
  address_street:
    description: Street line combining street type and logradouro, aligned with legacy employee contact exports.
    lineage:
      - datalake_pin_core_clean.address.street_type
      - datalake_pin_core_clean.address.street
      - datalake_pin_core_clean.person_address_usage.id_address
  address_number:
    description: Street number of the employee mailing address.
    lineage:
      - datalake_pin_core_clean.address.number
      - datalake_pin_core_clean.person_address_usage.id_address
  address_complement:
    description: Apartment, block, or other complement for the mailing address.
    lineage:
      - datalake_pin_core_clean.address.complement
      - datalake_pin_core_clean.person_address_usage.id_address
  address_district:
    description: District or neighborhood of the mailing address.
    lineage:
      - datalake_pin_core_clean.address.neighborhood
      - datalake_pin_core_clean.person_address_usage.id_address
  address_zip_code:
    description: Postal code of the mailing address.
    lineage:
      - datalake_pin_core_clean.address.postal_code
      - datalake_pin_core_clean.person_address_usage.id_address
  address_city:
    description: Municipality or city of the mailing address.
    lineage:
      - datalake_pin_core_clean.address.town_or_city
      - datalake_pin_core_clean.person_address_usage.id_address
  address_state:
    description: State or region of the mailing address.
    lineage:
      - datalake_pin_core_clean.address.state
      - datalake_pin_core_clean.person_address_usage.id_address
  address_country:
    description: Country code of the mailing address.
    lineage:
      - datalake_pin_core_clean.address.country_code
      - datalake_pin_core_clean.person_address_usage.id_address
  full_address:
    description: Complete mailing address unifying street line, number, complement, district, zip, city, state and country.
    lineage:
      - datalake_pin_core_clean.address.street_type
      - datalake_pin_core_clean.address.street
      - datalake_pin_core_clean.address.number
      - datalake_pin_core_clean.address.complement
      - datalake_pin_core_clean.address.neighborhood
      - datalake_pin_core_clean.address.postal_code
      - datalake_pin_core_clean.address.town_or_city
      - datalake_pin_core_clean.address.state
      - datalake_pin_core_clean.address.country_code
      - datalake_pin_core_clean.person_address_usage.id_address
  dt_valid_from:
    description: Start date of the validity period for this contact version.
    lineage:
      - datalake_pin_core_clean.all_people.dt_effective_started
  dt_valid_to:
    description: End date of the validity period. 9999-12-31 for current version.
    lineage:
      - datalake_pin_core_clean.all_people.dt_effective_started
  is_current:
    description: True when this is the current contact version for the employee as of the load reference date (future-only rows are excluded).
    lineage:
      - datalake_pin_core_clean.all_people.dt_effective_started
  ts_load:
    description: Timestamp when the record was loaded.
