database_name: dw_employee_details
table_name: dim_management_hierarchy
owner: isabella.araujo@quintoandar.com.br
domain: People
description: |
  Reporting chain for each workforce assignment, with the direct manager and the people at each organizational layer from the CEO (L0) down to the employee (L1–L9).
  One row per assignment_number × hierarchy version: a new version opens when the reporting chain changes; consecutive identical periods are merged. Current versions use dt_valid_to = 9999-12-31.
  Covers assignments that form a valid CEO-linked chain (CEO at L0).
  Use manager_assignment_number for the employee's immediate supervisor; use assignment_number_lN / name_lN / email_lN to slice or filter by a fixed depth from the CEO. The employee sits at hierarchy_level; the direct manager sits one layer above and may be any of L1–L9 depending on org depth. Filter is_current = TRUE for the live chain.
columns:
  sk_hierarchy_version:
    description: Unique key for the assignment hierarchy version (e.g. 'a1b2c3d4e5f6789012345678901234ab').
    lineage:
      - datalake_people.management_hierarchy.sk_hierarchy_version
  assignment_number:
    description: Main business identifier of the assignment whose reporting chain is represented in this record (e.g. 'E123456'). Links hierarchy versions to workforce assignments.
    lineage:
      - datalake_people.management_hierarchy.assignment_number
  manager_assignment_number:
    description: Assignment number of the employee's direct manager (immediate supervisor) in this hierarchy version (e.g. 'E654321'). Empty when the assignment has no direct manager in the chain (e.g. CEO).
    lineage:
      - datalake_people.management_hierarchy.manager_assignment_number
  hierarchy_level:
    description: Organizational layer label of this assignment in the reporting chain, from L0 (CEO) to L9 (deepest supported depth) (e.g. 'L5').
    lineage:
      - datalake_people.management_hierarchy.hierarchy_level
  hierarchy_depth:
    description: Numeric organizational depth of this assignment in the reporting chain, from 0 (CEO) to 9 (e.g. 5).
    lineage:
      - datalake_people.management_hierarchy.hierarchy_depth
  assignment_number_l0:
    description: Assignment number of the person at organizational layer 0 (CEO / top of the chain) in this assignment's reporting chain (the top of every valid reporting chain) (e.g. 'E123456').
    lineage:
      - datalake_people.management_hierarchy.assignment_number_l0
  name_l0:
    description: Full name of the person at organizational layer 0 (CEO / top of the chain) in this assignment's reporting chain (the top of every valid reporting chain) (e.g. 'Gabriel Braga Vieira').
    lineage:
      - datalake_people.management_hierarchy.name_l0
  email_l0:
    description: Work email of the person at organizational layer 0 (CEO / top of the chain) in this assignment's reporting chain (the top of every valid reporting chain) (e.g. 'name.last_name@quintoandar.com.br').
    lineage:
      - datalake_people.management_hierarchy.email_l0
  assignment_number_l1:
    description: Assignment number of the person at organizational layer 1 (L1), counted downward from the CEO at L0 in this assignment's reporting chain (one layer below L0 in the same chain) (e.g. 'E100001'). Distinct from manager_assignment_number, which holds the direct manager regardless of layer.
    lineage:
      - datalake_people.management_hierarchy.assignment_number_l1
  name_l1:
    description: Full name of the person at organizational layer 1 (L1), counted downward from the CEO at L0 in this assignment's reporting chain (one layer below L0 in the same chain) (e.g. 'Example Name L1'). Distinct from the direct manager identity, which is held in manager_assignment_number.
    lineage:
      - datalake_people.management_hierarchy.name_l1
  email_l1:
    description: Work email of the person at organizational layer 1 (L1), counted downward from the CEO at L0 in this assignment's reporting chain (one layer below L0 in the same chain) (e.g. 'name.l1@quintoandar.com.br'). Distinct from the direct manager identity, which is held in manager_assignment_number.
    lineage:
      - datalake_people.management_hierarchy.email_l1
  assignment_number_l2:
    description: Assignment number of the person at organizational layer 2 (L2), counted downward from the CEO at L0 in this assignment's reporting chain (one layer below L1 in the same chain) (e.g. 'E100002').
    lineage:
      - datalake_people.management_hierarchy.assignment_number_l2
  name_l2:
    description: Full name of the person at organizational layer 2 (L2), counted downward from the CEO at L0 in this assignment's reporting chain (one layer below L1 in the same chain) (e.g. 'Example Name L2').
    lineage:
      - datalake_people.management_hierarchy.name_l2
  email_l2:
    description: Work email of the person at organizational layer 2 (L2), counted downward from the CEO at L0 in this assignment's reporting chain (one layer below L1 in the same chain) (e.g. 'name.l2@quintoandar.com.br').
    lineage:
      - datalake_people.management_hierarchy.email_l2
  assignment_number_l3:
    description: Assignment number of the person at organizational layer 3 (L3), counted downward from the CEO at L0 in this assignment's reporting chain (one layer below L2 in the same chain) (e.g. 'E100003').
    lineage:
      - datalake_people.management_hierarchy.assignment_number_l3
  name_l3:
    description: Full name of the person at organizational layer 3 (L3), counted downward from the CEO at L0 in this assignment's reporting chain (one layer below L2 in the same chain) (e.g. 'Example Name L3').
    lineage:
      - datalake_people.management_hierarchy.name_l3
  email_l3:
    description: Work email of the person at organizational layer 3 (L3), counted downward from the CEO at L0 in this assignment's reporting chain (one layer below L2 in the same chain) (e.g. 'name.l3@quintoandar.com.br').
    lineage:
