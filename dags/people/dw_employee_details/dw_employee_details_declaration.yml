dag:
  name: dw_employee_details
  owner: Data People
  callback_by_task: False
  schedule_start_date: 2026, 2, 13
  documentation:
    dag_purpose: Data Warehouse with employee personal details and related dimensions.
workflow:
  type: query_delta
  layer: dw
  custom_schema: employee_details
  bucket_config_name: people_bucket
  has_hive_sync: false
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  default_table_privileges:
    people-team: ["ALL PRIVILEGES"]
  inner_dependencies:
    fact_assignment_snapshots:
      - dim_contact
      - dim_documentation
      - dim_emergency_contact
      - dim_management_hierarchy
  tables_customization:
    fact_assignment_snapshots:
      vacuum_retention_hours: 168
      vacuum_lite: true
      table_properties:
        "delta.enableDeletionVectors": "false"
    dim_event_definition:
      vacuum_retention_hours: 168
      vacuum_lite: true
      table_properties:
        "delta.enableDeletionVectors": "false"
    dim_contact:
      has_hive_sync: false
      vacuum_retention_hours: 168
      vacuum_lite: true
    dim_documentation:
      has_hive_sync: false
      vacuum_retention_hours: 168
      vacuum_lite: true
    dim_emergency_contact:
      has_hive_sync: false
      vacuum_retention_hours: 168
      vacuum_lite: true
    dim_management_hierarchy:
      vacuum_retention_hours: 168
      vacuum_lite: true
      table_properties:
        "delta.enableDeletionVectors": "false"
    dim_employee:
      vacuum_retention_hours: 168
      vacuum_lite: true
      table_properties:
        "delta.enableDeletionVectors": "false"
