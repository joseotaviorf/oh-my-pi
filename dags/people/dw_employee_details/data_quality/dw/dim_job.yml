---
table_name: dw_employee_details.dim_job
alert_channel: PEOPLE_ALERTS

table_level_validations:
  has_size:
    greater_than: 1
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: 0
    less_than_or_equal_to: 10
    severity_level: Warning

column_level_validations:
  sk_job_version:
    is_unique:
      severity_level: Error
    is_complete:
      severity_level: Error
  matching_sk_job_version_fact_and_dimension:
    custom:
      # Referential integrity: every sk_job_version referenced by fact_assignment_snapshots must
      # resolve in dim_job (proves the time-travel join actually works). Excludes the '-1' unknown
      # FK sentinel and MD5('') (assignments with no id_job / dt_valid_from in the source).
      constraint: |-
        (SELECT COUNT(*)
         FROM (
           SELECT DISTINCT f.sk_job_version
           FROM dw_employee_details.fact_assignment_snapshots AS f
           WHERE f.sk_job_version NOT IN ('-1', MD5(''))
         ) AS f
         WHERE NOT EXISTS (
           SELECT 1
           FROM dw_employee_details.dim_job AS d
           WHERE d.sk_job_version = f.sk_job_version
         )
        ) = 0
      severity_level: Warning
