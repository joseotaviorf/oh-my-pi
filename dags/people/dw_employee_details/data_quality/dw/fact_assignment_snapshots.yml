---
table_name: dw_employee_details.fact_assignment_snapshots
alert_channel: PEOPLE_ALERTS

table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error

column_level_validations:
  assignment_number:
    is_complete:
      severity_level: Error
    custom:
      # Grain uniqueness: one row per (assignment_number, dt_reference)
      constraint: |-
        (SELECT COUNT(*) FROM (
          SELECT assignment_number, dt_reference
          FROM dw_employee_details.fact_assignment_snapshots
          GROUP BY assignment_number, dt_reference
          HAVING COUNT(*) > 1
        )) = 0
      severity_level: Error
  dt_reference:
    is_complete:
      severity_level: Error
  person_number:
    is_complete:
      severity_level: Error
  dt_hired:
    is_complete:
      severity_level: Error
  ts_load:
    is_complete:
      severity_level: Error
