---
table_name: dw_employee_details.fact_assignment_snapshots
alert_channel: PEOPLE_ALERTS

table_level_validations:
  has_size:
    greater_than: 1
    severity_level: Error

  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: 0
    less_than_or_equal_to: 25
    severity_level: Warning
column_level_validations:
  exactly_one_current_snapshot_per_assignment:
    custom:
      # Exactly one current snapshot per assignment_number (latest day for active; termination date for terminated).
      constraint: |-
        (SELECT COUNT(*) FROM (
          SELECT assignment_number
          FROM dw_employee_details.fact_assignment_snapshots
          GROUP BY assignment_number
          HAVING SUM(CASE WHEN is_current_for_assignment THEN 1 ELSE 0 END) != 1
        )) = 0
      severity_level: Warning
  one_current_primary_row_per_person:
    custom:
      # Employee-grain exports rely on exactly one is_current_for_employee row per person_number.
      constraint: |-
        (SELECT COUNT(*) FROM (
          SELECT person_number
          FROM dw_employee_details.fact_assignment_snapshots
          WHERE is_current_for_employee = TRUE
          GROUP BY person_number
          HAVING COUNT(*) > 1
        )) = 0
      severity_level: Warning
