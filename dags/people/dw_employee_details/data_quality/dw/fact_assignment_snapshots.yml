---
table_name: dw_employee_details.fact_assignment_snapshots
alert_channel: PEOPLE_ALERTS

table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error

column_level_validations:
  assignment_number:
    is_complete:
      severity_level: Error
  one_row_per_assignment_and_reference_date:
    custom:
      # Grain uniqueness: one row per (assignment_number, dt_reference)
      constraint: |-
        (SELECT COUNT(*) FROM (
          SELECT assignment_number, dt_reference
          FROM dw_employee_details.fact_assignment_snapshots
          GROUP BY assignment_number, dt_reference
          HAVING COUNT(*) > 1
        )) = 0
      severity_level: Error
  dt_reference:
    is_complete:
      severity_level: Error
  person_number:
    is_complete:
      severity_level: Error
  dt_hired:
    is_complete:
      severity_level: Error
  exactly_one_current_snapshot_per_assignment:
    custom:
      # Exactly one current snapshot per assignment_number (latest day for active; termination date for terminated).
      constraint: |-
        (SELECT COUNT(*) FROM (
          SELECT assignment_number
          FROM dw_employee_details.fact_assignment_snapshots
          GROUP BY assignment_number
          HAVING SUM(CASE WHEN is_current THEN 1 ELSE 0 END) != 1
        )) = 0
      severity_level: Error
  one_current_primary_row_per_person:
    custom:
      # Employee-grain exports rely on exactly one is_current_for_employee row per person_number.
      constraint: |-
        (SELECT COUNT(*) FROM (
          SELECT person_number
          FROM dw_employee_details.fact_assignment_snapshots
          WHERE is_current_for_employee = TRUE
          GROUP BY person_number
          HAVING COUNT(*) > 1
        )) = 0
      severity_level: Error
  ts_load:
    is_complete:
      severity_level: Error
