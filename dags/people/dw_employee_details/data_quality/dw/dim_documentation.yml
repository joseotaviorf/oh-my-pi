---
table_name: dw_employee_details.dim_documentation
alert_channel: PEOPLE_ALERTS

table_level_validations:
  has_size:
    greater_than: 14513
    severity_level: Error

column_level_validations:
  sk_documentation_version:
    is_complete:
      severity_level: Error
    is_unique:
      severity_level: Warning
  person_number:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Warning
  ts_load:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Warning
