database_name: datalake_greenhouse_migration
table_name: demographics
owner: pedro.prates@quintoandar.com.br
domain: People
description: Pivoted table containing demographic answers from the ATS (Greenhouse). Each row represents a unique application (id_application), with columns for each demographic question group, answers standardized to English (EN), and boolean flags for minority groups. Migration version sourced from v3 clean tables.

