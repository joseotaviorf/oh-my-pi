---
database_name: datalake_degreed_clean
table_name: experiences
owner: isabella.araujo@quintoandar.com.br
domain: People
description: >
  This table contains records of users' professional and learning experiences,
  such as job roles, projects, and mentorships. Each row represents a specific
  experience a user has added to their Degreed profile to build a comprehensive
  view of their skills and career journey.

columns:
  id:
    description: 'Unique identifier for the experience record.'
    lineage:
      - datalake_degreed_raw.experiences.id
  id_user_created_by:
    description: 'The unique identifier for the user who created this experience record.'
    lineage:
      - datalake_degreed_raw.experiences.relationships[0].created_by.data.id
  id_employee:
    description: 'The employee ID of the user associated with the experience.'
    lineage:
      - datalake_degreed_raw.experiences.attributes.employee_id
  title:
    description: 'The title of the experience (e.g., "Project Manager", "Data Migration Project").'
    lineage:
      - datalake_degreed_raw.experiences.attributes.title
  description:
    description: 'A detailed description of the responsibilities and achievements during the experience.'
    lineage:
      - datalake_degreed_raw.experiences.attributes.description
  experience_type_peer_name:
    description: 'The name of a peer involved in the experience, such as a mentor or manager.'
    lineage:
      - datalake_degreed_raw.experiences.attributes.experience_type_peer_name
  organization_name:
    description: 'The name of the company or organization where the experience took place.'
    lineage:
      - datalake_degreed_raw.experiences.attributes.organization_name
  seniority:
    description: 'The seniority level associated with the experience (e.g., "Senior", "Lead").'
    lineage:
      - datalake_degreed_raw.experiences.attributes.seniority
  experience_type:
    description: 'The category of the experience, such as "JobRole", "Project", "Mentorship", etc.'
    lineage:
      - datalake_degreed_raw.experiences.attributes.experience_type
  points_earned:
    description: 'The number of points awarded by Degreed for this experience.'
    lineage:
      - datalake_degreed_raw.experiences.attributes.points_earned
  weekly_hours:
    description: 'The average number of hours per week dedicated to this experience.'
    lineage:
      - datalake_degreed_raw.experiences.attributes.weekly_hours
  is_current:
    description: 'A boolean flag indicating if this is an ongoing experience.'
    lineage:
      - datalake_degreed_raw.experiences.attributes.is_current
  dt_start:
    description: 'The start date of the experience.'
    lineage:
      - datalake_degreed_raw.experiences.attributes.start_date
  dt_end:
    description: 'The end date of the experience. Can be null if it is a current experience.'
    lineage:
      - datalake_degreed_raw.experiences.attributes.end_date
  ts_created:
    description: 'Timestamp indicating when the experience record was created in Degreed.'
    lineage:
      - datalake_degreed_raw.experiences.attributes.created_at
  ts_modified:
    description: 'Timestamp indicating the last time the experience record was modified.'
    lineage:
      - datalake_degreed_raw.experiences.attributes.modified_at
  ts_load:
    description: 'Timestamp indicating when the record was loaded into the clean table.'
