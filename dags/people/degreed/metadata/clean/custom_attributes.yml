database_name: datalake_degreed_clean
table_name: custom_attributes
owner: isabella.araujo@quintoandar.com.br
domain: People
description: |-
  Defines the schema for custom attributes available in the organization. This table lists the types of custom data points that can be associated with users, but does not contain the user-specific values themselves.
columns:
  id:
    description: Unique identifier for the custom attribute definition.
    lineage:
    - datalake_degreed_raw.custom_attributes.id
  name:
    description: The name of the custom attribute (e.g., "Cost Center", "Job Level").
    lineage:
    - datalake_degreed_raw.custom_attributes.attributes.name
  data_type:
    description: The data type for the attributes values (e.g., "String", "Number", "Date").
    lineage:
    - datalake_degreed_raw.custom_attributes.attributes.data_type
  is_visible_in_ui:
    description: A boolean flag indicating whether this attribute is visible in the Degreed user interface.
    lineage:
    - datalake_degreed_raw.custom_attributes.attributes.is_visible_in_ui
  ts_load:
    description: Timestamp indicating when the record was loaded into the clean table.
