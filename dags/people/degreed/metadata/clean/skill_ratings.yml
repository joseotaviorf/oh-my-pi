database_name: datalake_degreed_clean
table_name: skill_ratings
owner: isabella.araujo@quintoandar.com.br
domain: People
description: |-
  This table stores skill ratings provided by users for themselves or by others (e.g., managers). Each row represents a single rating for a specific skill by a specific user, indicating their perceived proficiency level.
columns:
  id:
    description: Unique identifier for the skill rating record.
    lineage:
    - datalake_degreed_raw.skill_ratings.id
  id_user:
    description: The unique identifier for the user who was rated.
    lineage:
    - datalake_degreed_raw.skill_ratings.relationships[0].user.data.id
  id_skill:
    description: The unique identifier for the skill that was rated.
    lineage:
    - datalake_degreed_raw.skill_ratings.relationships[1].skill.data.id
  id_rater:
    description: The unique identifier for the user who provided the rating.
    lineage:
    - datalake_degreed_raw.skill_ratings.relationships[3].rater.data.id
  id_employee:
    description: The employee ID, typically an email, of the user whose skill is being rated.
    lineage:
    - datalake_degreed_raw.skill_ratings.attributes.employee_id
  skill_name:
    description: The name of the skill that was rated.
    lineage:
    - datalake_degreed_raw.skill_ratings.attributes.skill_name
  rating_type:
    description: The type of rating, indicating who provided it (e.g., "self-assessed", "manager-rated").
    lineage:
    - datalake_degreed_raw.skill_ratings.attributes.rating_type
  rating_label:
    description: The descriptive label for the rating level (e.g., "Beginner", "Intermediate", "Expert").
    lineage:
    - datalake_degreed_raw.skill_ratings.attributes.rating_label
  guid_certifiable_skill:
    description: A unique identifier (GUID) that links the rating to a certifiable skill, if applicable. This field will have a value if the rated skill can be formally certified.
    lineage:
    - datalake_degreed_raw.skill_ratings.attributes.certifiable_skill_guid
  rating:
    description: The numerical value or score of the rating.
    lineage:
    - datalake_degreed_raw.skill_ratings.attributes.rating
  is_endorsed:
    description: A boolean flag indicating if this specific rating has been endorsed by another user (e.g., a manager).
    lineage:
    - datalake_degreed_raw.skill_ratings.attributes.is_endorsed
  is_skill_endorsed:
    description: A boolean flag indicating if the skill itself is officially endorsed by the organization.
    lineage:
    - datalake_degreed_raw.skill_ratings.attributes.is_skill_endorsed
  ts_rated:
    description: Timestamp indicating when the skill rating was submitted.
    lineage:
    - datalake_degreed_raw.skill_ratings.attributes.rated_at
  ts_load:
    description: Timestamp indicating when the record was loaded into the clean table.
