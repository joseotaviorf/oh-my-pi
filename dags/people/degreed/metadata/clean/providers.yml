---
database_name: datalake_degreed_clean
table_name: providers
owner: isabella.araujo@quintoandar.com.br
domain: people
description: >
  This table lists all the external and internal content providers that are
  integrated with or configured in the organization's Degreed platform.

columns:
  id:
    description: 'Unique identifier for the provider record.'
    lineage:
      - datalake_degreed_raw.providers.id
  name:
    description: 'The name of the content provider (e.g., "Coursera", "LinkedIn Learning").'
    lineage:
      - datalake_degreed_raw.providers.attributtes.name
  url:
    description: 'The base URL for the content providers website.'
    lineage:
      - datalake_degreed_raw.providers.attributtes.url
  provider_content_visibility:
    description: 'Defines the visibility level for content from this provider within the organization.'
    lineage:
      - datalake_degreed_raw.providers.attributtes.provider_content_visibility
  is_active:
    description: 'A boolean flag indicating if the provider integration is currently active.'
    lineage:
      - datalake_degreed_raw.providers.attributtes.is_active
  ts_load:
    description: 'Timestamp indicating when the record was loaded into the clean table.'
