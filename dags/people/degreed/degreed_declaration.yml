dag:
  name: degreed
  owner: Data People
  callback_by_task: False
  documentation:
    dag_purpose: |
      This DAG aims to ingest data from the Degreed API (Learning Hub).
  schedule_interval: 0 3 * * *

workflow:
  layer: raw
  has_hive_sync: true
  type: custom_ingestion
  bucket_config_name: people_bucket
  load_spark_job: load_degreed_raw
  default_table_privileges:
    people-team:
      - ALL PRIVILEGES

  spark_job_arguments:
    - "{environment}"
    - "{bucket}"
    - "{dag_name}"
    - "{table_name}"
    - "{{ data_interval_start | ds }}"
    - "{partitions}"
    - "{extraction_type}"
    - "{load_start_date}"
    - "{load_end_date}"

  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, -1), 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  
  raw_inner_dependencies:
    pathway_details:
      - pathways
    skill_plan_details:
      - skill_plans
  
  tables_customization:
    completions:
      extraction_type: incremental
      merge_on: ["id"]
      vacuum_retention_hours: 168
      vacuum_lite: true
      extra_spark_job_arguments:
        - scope: "completions:read"
          max_date_window_days: 7
          base_filters:
            "filter[added_after]": "load_start_date"
            "filter[added_before]": "load_end_date"
            "limit": "1000"
    
    content:
      clean_table_name: contents
      extraction_type: full
      vacuum_retention_hours: 168
      vacuum_lite: true
      extra_spark_job_arguments:
        - scope: "content:read"
          base_filters:
            "filter[include_restricted]": "true"
            "limit": "100"

    groups:
      extraction_type: full
      vacuum_retention_hours: 168
      vacuum_lite: true
      extra_spark_job_arguments:
        - scope: "groups:read"
          base_filters:
            "limit": "1000"

    pathways:
      extraction_type: full
      vacuum_retention_hours: 168
      vacuum_lite: true
      extra_spark_job_arguments:
        - scope: "pathways:read"
          base_filters:
            "limit": "1000"

    pathway_details:
      extraction_type: full
      vacuum_retention_hours: 168
      vacuum_lite: true
      extra_spark_job_arguments:
        - scope: "pathways:read"
          use_ingestion_from_id_list: true
          ids_source_database: "datalake_degreed_raw"
          ids_source_table: "pathways"
          id_column: "id"
          endpoint_for_id_list: "pathways"

    skill_plans:
      extraction_type: full
      vacuum_retention_hours: 168
      vacuum_lite: true
      extra_spark_job_arguments:
        - scope: "skill_plans:read"
          base_filters:
            "limit": "1000"

    skill_plan_details:
      extraction_type: full
      vacuum_retention_hours: 168
      vacuum_lite: true
      extra_spark_job_arguments:
        - scope: "skill_plans:read"
          use_ingestion_from_id_list: true
          ids_source_database: "datalake_degreed_raw"
          ids_source_table: "skill_plans"
          id_column: "id"
          endpoint_for_id_list: "skill-plans"

    users:
      extraction_type: full
      vacuum_retention_hours: 168
      vacuum_lite: true
      extra_spark_job_arguments:
        - scope: "users:read"
          base_filters:
            "limit": "1000"