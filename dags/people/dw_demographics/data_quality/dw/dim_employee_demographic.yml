---
table_name: dw_demographics.dim_employee_demographic
alert_channel: PEOPLE_ALERTS

table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: 0
    less_than_or_equal_to: 25
    severity_level: Warning

column_level_validations:
  sk_employee:
    is_complete:
      severity_level: Error
  person_number:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Error
  legislation_code:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Error
  dt_valid_from:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Error
  dt_valid_to:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Error
  is_current:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Error
  ts_load:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Warning
  ethnicity:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Warning
  religion:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Warning
  gender_identity:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Warning
  sexual_orientation:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Warning
