dag:
  name: dw_demographics
  owner: Data People
  callback_by_task: False
  schedule_start_date: 2026, 3, 23
  documentation:
    dag_purpose: |
      DE&I data warehouse schema dw_demographics (DBP-1249). SCD Type 2 employee demographic
      profile and one-to-many disability outrigger. Sources pin_core clean and datalake_people
      identifier_mapping. Dataset-scheduled; no cron. Restricted to People analytics.

workflow:
  type: query_delta
  layer: dw
  bucket_config_name: people_bucket
  custom_schema: demographics
  has_hive_sync: true
  serialize_dq_after_default_row: true
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  default_table_privileges:
    people-team: ["ALL PRIVILEGES"]
    people-analytics: ["ALL PRIVILEGES"]
  tables_customization:
    dim_employee_demographic:
      vacuum_retention_hours: 168
      vacuum_lite: true
    dim_employee_disability:
      vacuum_retention_hours: 168
      vacuum_lite: true
