dag:
  name: enrich_gsheets_people
  schedule_start_date: 2024, 7, 15
  owner: Data People
  documentation:
    dag_purpose: Enrich data from Gsheets for the People team.
workflow:
  type: query_delta
  layer: enrich
  default_extraction_type: incremental
  has_hive_sync: false
  bucket_config_name: people_bucket
  tables_customization:
    team_formation_product_tech:
      extraction_type: incremental
      merge_on: ["id"]
    codex_history_base:
      extraction_type: incremental
      merge_on: ["id"]
    codex:
      extraction_type: full
  inner_dependencies:
    codex:
      - codex_history_base
  default_table_privileges:
    people-team: ["ALL PRIVILEGES"]
cluster:
  type: databricks_16_4_small_memory_people_cluster
  access_control_list:
    group_name: people-analytics
    permission_level: CAN_MANAGE
  databricks_conn_id: databricks_new_env
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
