database_name: datalake_gsheets_people
table_name: codex_history_base
owner: gabriel.berger@quintoandar.com.br
domain: People
description: Table containing consolidated information from the CODEX database about cost centers. Responsible for retrieving the latest information from Gsheets and incrementally building a historical version.
columns:
  id:
    description: Unique identifier of the cost center in a particular date.
    lineage:
    - datalake_gsheets_people_clean.codex_cost_centers.cost_center_code
    - datalake_gsheets_people_clean.codex_cost_centers.dt_updated
  cost_center_code:
    description: Unique identifier of the cost center.
    lineage:
    - datalake_gsheets_people_clean.codex_cost_centers.cost_center_code
  business:
    description: Business unit to which the cost center belongs.
    lineage:
    - datalake_gsheets_people_clean.codex_cost_centers.business
  product:
    description: Primary product associated with this cost center.
    lineage:
    - datalake_gsheets_people_clean.codex_cost_centers.product
  brand:
    description: Brand to which the cost center belongs.
    lineage:
    - datalake_gsheets_people_clean.codex_cost_centers.brand
  vertical:
    description: Derived business vertical based on the structure field. Values include 'Ops' (for Sales, Operations, Marketing, Guarantees), 'Corp' (for Finance, People, Legal, Administrative), or 'Tech' (for Product).
    lineage:
    - datalake_gsheets_people_clean.codex_cost_centers.structure
  structure:
    description: Structure to which the cost center belongs.
    lineage:
    - datalake_gsheets_people_clean.codex_cost_centers.structure_name
  team:
    description: Team to which the cost center belongs.
    lineage:
    - datalake_gsheets_people_clean.codex_cost_centers.team_name
  chapter:
    description: Chapter to which the cost center belongs.
    lineage:
    - datalake_gsheets_people_clean.codex_cost_centers.pt_chapter
  line:
    description: Line to which the cost center belongs.
    lineage:
    - datalake_gsheets_people_clean.codex_cost_centers.pt_line
  owner_l1_person_number:
    description: Person number (PIN id) of the second highest manager (L1) in the hierarchy responsible for the cost center.
    lineage:
    - datalake_gsheets_people_clean.codex_cost_centers.l1
    - datalake_employee_registration.identifier_mapping.person_number
  owner_l2_person_number:
    description: Person number (PIN id) of the third highest manager (L2) in the hierarchy responsible for the cost center.
    lineage:
    - datalake_gsheets_people_clean.codex_cost_centers.l2
    - datalake_employee_registration.identifier_mapping.person_number
  owner_l3_person_number:
    description: Person number (PIN id) of the fourth highest manager (L3) in the hierarchy responsible for the cost center.
    lineage:
    - datalake_gsheets_people_clean.codex_cost_centers.l3
    - datalake_employee_registration.identifier_mapping.person_number
  owner_l1_full_name:
    description: Full name of the second highest manager (L1) in the hierarchy responsible for the cost center.
    lineage:
    - datalake_gsheets_people_clean.codex_cost_centers.l1
    - datalake_employee_registration.identifier_mapping.full_name
  owner_l2_full_name:
    description: Full name of the third highest manager (L2) in the hierarchy responsible for the cost center.
    lineage:
    - datalake_gsheets_people_clean.codex_cost_centers.l2
    - datalake_employee_registration.identifier_mapping.full_name
  owner_l3_full_name:
    description: Full name of the fourth highest manager (L3) in the hierarchy responsible for the cost center.
    lineage:
    - datalake_gsheets_people_clean.codex_cost_centers.l3
    - datalake_employee_registration.identifier_mapping.full_name
  owner_l1_email:
    description: Email of the second highest manager (L1) in the hierarchy responsible for the cost center.
    lineage:
    - datalake_gsheets_people_clean.codex_cost_centers.l1
  owner_l2_email:
    description: Email of the third highest manager (L2) in the hierarchy responsible for the cost center.
    lineage:
    - datalake_gsheets_people_clean.codex_cost_centers.l2
  owner_l3_email:
    description: Email of the fourth highest manager (L3) in the hierarchy responsible for the cost center.
    lineage:
    - datalake_gsheets_people_clean.codex_cost_centers.l3
  headcount_type:
    description: Inferred type of headcount allocated in the cost center, being either 'Capacity' or 'Overhead'.
    lineage:
    - datalake_gsheets_people_clean.codex_cost_informations.cost_center_detail
  dt_closing_month:
    description: Date representing the offical monthly version of the data.
    lineage:
    - datalake_gsheets_people_clean.codex_cost_centers.dt_updated
  ts_load:
    description: Timestamp of when the data was ingested into the datalake.
    lineage:
    - datalake_gsheets_people_clean.codex_cost_centers.ts_load
