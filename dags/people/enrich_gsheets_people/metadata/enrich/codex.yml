---
database_name: datalake_gsheets_people
table_name: codex
owner: gabriel.berger@quintoandar.com.br
domain: People
description: Table containing consolidated information from the CODEX database about cost centers. It uses the codex_history_base table as a basis and enriches the data through historical self-comparison and comparison with data from PIN (organizations).
columns:
  id:
    description: Unique identifier of the cost center in a particular date.
    lineage:
      - datalake_gsheets_people.codex_history_base.id
  cost_center_code:
    description: Unique identifier of the cost center.
    lineage:
      - datalake_gsheets_people.codex_history_base.cost_center_code
  cost_center_name:
    description: Current name of the cost center.
    lineage:
      - datalake_hr_system_clean.organizations.name
  cost_center_status:
    description: Current status of the cost center, either active (A) or inactive (I).
    lineage:
      - datalake_hr_system_clean.organizations.status
  business:
    description: Business unit to which the cost center belongs.
    lineage:
      - datalake_gsheets_people.codex_history_base.business
  product:
    description: Primary product associated with this cost center.
    lineage:
      - datalake_gsheets_people.codex_history_base.product
  brand:
    description: Brand to which the cost center belongs.
    lineage:
      - datalake_gsheets_people.codex_history_base.brand
  vertical:
    description: Derived business vertical based on the structure field. Values include 'Ops' (for Sales, Operations, Marketing, Guarantees), 'Corp' (for Finance, People, Legal, Administrative), or 'Tech' (for Product).
    lineage:
      - datalake_gsheets_people.codex_history_base.vertical
  structure:
    description: Structure to which the cost center belongs.
    lineage:
      - datalake_gsheets_people.codex_history_base.structure
  team:
    description: Team to which the cost center belongs.
    lineage:
      - datalake_gsheets_people.codex_history_base.team
  chapter:
    description: Chapter to which the cost center belongs.
    lineage:
      - datalake_gsheets_people.codex_history_base.chapter
  line:
    description: Line to which the cost center belongs.
    lineage:
      - datalake_gsheets_people.codex_history_base.line
  owner_l1_person_number:
    description: Person number (PIN id) of the second highest manager (L1) in the
      hierarchy responsible for the cost center.
    lineage:
      - datalake_gsheets_people.codex_history_base.owner_l1_email
      - datalake_employee_registration.identifier_mapping.person_number
      - datalake_gsheets_people_clean.email_employee_mapping
  owner_l2_person_number:
    description: Person number (PIN id) of the third highest manager (L2) in the hierarchy
      responsible for the cost center.
    lineage:
      - datalake_gsheets_people.codex_history_base.owner_l2_email
      - datalake_employee_registration.identifier_mapping.person_number
      - datalake_gsheets_people_clean.email_employee_mapping
  owner_l3_person_number:
    description: Person number (PIN id) of the fourth highest manager (L3) in the hierarchy responsible for the cost center.
    lineage:
      - datalake_gsheets_people.codex_history_base.owner_l3_email
      - datalake_employee_registration.identifier_mapping.person_number
      - datalake_gsheets_people_clean.email_employee_mapping
  owner_l1_full_name:
    description: Full name of the second highest manager (L1) in the hierarchy responsible for the cost center.
    lineage:
      - datalake_gsheets_people.codex_history_base.owner_l1_email
      - datalake_employee_registration.identifier_mapping.full_name
      - datalake_gsheets_people_clean.email_employee_mapping
  owner_l2_full_name:
    description: Full name of the third highest manager (L2) in the hierarchy responsible for the cost center.
    lineage:
      - datalake_gsheets_people.codex_history_base.owner_l2_email
      - datalake_employee_registration.identifier_mapping.full_name
      - datalake_gsheets_people_clean.email_employee_mapping
  owner_l3_full_name:
    description: Full name of the fourth highest manager (L3) in the hierarchy responsible for the cost center.
    lineage:
      - datalake_gsheets_people.codex_history_base.owner_l3_email
      - datalake_employee_registration.identifier_mapping.full_name
      - datalake_gsheets_people_clean.email_employee_mapping
  owner_l1_email:
    description: Email of the second highest manager (L1) in the hierarchy responsible for the cost center.
    lineage:
      - datalake_gsheets_people.codex_history_base.owner_l1_email
  owner_l2_email:
    description: Email of the third highest manager (L2) in the hierarchy responsible for the cost center.
    lineage:
      - datalake_gsheets_people.codex_history_base.owner_l2_email
  owner_l3_email:
    description: Email of the fourth highest manager (L3) in the hierarchy responsible for the cost center.
    lineage:
      - datalake_gsheets_people.codex_history_base.owner_l3_email
  headcount_type:
    description: Inferred type of headcount allocated in the cost center, being either 'Capacity' or 'Overhead'.
    lineage:
      - datalake_gsheets_people.codex_history_base.headcount_type
  is_current:
    description: Boolean flag indicating if that row is the current version for each cost center. True when dt_closing_month equals the maximum dt_closing_month per cost_center_code.
    lineage:
      - datalake_gsheets_people.codex_history_base.cost_center_code
      - datalake_gsheets_people.codex_history_base.dt_closing_month
  is_present_in_system:
    description: Boolean flag indicating if the information is present in the target PIN system.
    lineage:
      - datalake_gsheets_people.codex_history_base.cost_center_code
      - datalake_hr_system_clean.organizations.codigo_dff
  is_outdated_in_system:
    description: Boolean flag indicating if the information present in the target PIN system is out of date and needs to be updated for any of the following information - brand, business, chapter, headcount_type, line, owner_l1_full_name, owner_l2_full_name, owner_l3_full_name, product, structure, team, vertical. Only applicable when is_current is true.
    lineage:
      - datalake_gsheets_people.codex_history_base.brand
      - datalake_gsheets_people.codex_history_base.business
      - datalake_gsheets_people.codex_history_base.chapter
      - datalake_gsheets_people.codex_history_base.headcount_type
      - datalake_gsheets_people.codex_history_base.line
      - datalake_employee_registration.identifier_mapping.full_name
      - datalake_gsheets_people.codex_history_base.owner_l1_email
      - datalake_gsheets_people.codex_history_base.owner_l2_email
      - datalake_gsheets_people.codex_history_base.owner_l3_email
      - datalake_gsheets_people.codex_history_base.product
      - datalake_gsheets_people.codex_history_base.structure
      - datalake_gsheets_people.codex_history_base.team
      - datalake_gsheets_people.codex_history_base.vertical
      - datalake_hr_system_clean.organizations.brand
      - datalake_hr_system_clean.organizations.business
      - datalake_hr_system_clean.organizations.chapter
      - datalake_hr_system_clean.organizations.codigo_dff
      - datalake_hr_system_clean.organizations.headcount_type
      - datalake_hr_system_clean.organizations.line
      - datalake_hr_system_clean.organizations.owner_leadership_layer_1_name
      - datalake_hr_system_clean.organizations.owner_leadership_layer_2_name
      - datalake_hr_system_clean.organizations.owner_leadership_layer_3_name
      - datalake_hr_system_clean.organizations.product
      - datalake_hr_system_clean.organizations.structure
      - datalake_hr_system_clean.organizations.team
      - datalake_hr_system_clean.organizations.vertical
  dt_closing_month:
    description: Date representing the offical monthly version of the data.
    lineage:
      - datalake_gsheets_people.codex_history_base.dt_closing_month
  ts_load:
    description: Timestamp of when the data was ingested into the datalake.
    lineage:
      - datalake_gsheets_people.codex_history_base.ts_load
