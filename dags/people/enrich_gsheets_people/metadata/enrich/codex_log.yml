---
database_name: datalake_gsheets_people
table_name: codex_log
owner: gabriel.berger@quintoandar.com.br
domain: People
description: SCD Type 2 versioning of cost center attributes from codex. One row per (cost_center_code, version) with dt_valid_from and dt_valid_to. A new version is created when any of business, product, brand, vertical, structure, team, chapter, line, owner names, or headcount_type changes.
columns:
  cost_center_code:
    description: Unique identifier of the cost center.
    lineage:
      - datalake_gsheets_people.codex.cost_center_code
  business:
    description: Business unit to which the cost center belongs.
    lineage:
      - datalake_gsheets_people.codex.business
  product:
    description: Primary product associated with this cost center.
    lineage:
      - datalake_gsheets_people.codex.product
  brand:
    description: Brand to which the cost center belongs.
    lineage:
      - datalake_gsheets_people.codex.brand
  vertical:
    description: Derived business vertical (Ops, Corp, Tech).
    lineage:
      - datalake_gsheets_people.codex.vertical
  structure:
    description: Structure to which the cost center belongs.
    lineage:
      - datalake_gsheets_people.codex.structure
  team:
    description: Team to which the cost center belongs.
    lineage:
      - datalake_gsheets_people.codex.team
  chapter:
    description: Chapter to which the cost center belongs.
    lineage:
      - datalake_gsheets_people.codex.chapter
  line:
    description: Line to which the cost center belongs.
    lineage:
      - datalake_gsheets_people.codex.line
  owner_l1_full_name:
    description: Full name of the L1 owner responsible for the cost center.
    lineage:
      - datalake_gsheets_people.codex.owner_l1_full_name
  owner_l2_full_name:
    description: Full name of the L2 owner responsible for the cost center.
    lineage:
      - datalake_gsheets_people.codex.owner_l2_full_name
  owner_l3_full_name:
    description: Full name of the L3 owner responsible for the cost center.
    lineage:
      - datalake_gsheets_people.codex.owner_l3_full_name
  headcount_type:
    description: Inferred headcount type (Capacity or Overhead).
    lineage:
      - datalake_gsheets_people.codex.headcount_type
  dt_valid_from:
    description: Start date of the validity interval for this version.
    lineage:
      - datalake_gsheets_people.codex.dt_closing_month
  dt_valid_to:
    description: End date of the validity interval. NULL for the current version (is_current = true).
    lineage:
      - datalake_gsheets_people.codex.dt_closing_month
  is_current:
    description: True when this row is the current version for the cost center (dt_valid_to is NULL).
    lineage:
      - datalake_gsheets_people.codex.dt_closing_month
  ts_load:
    description: Timestamp of when the data was loaded.
    lineage:
      - datalake_gsheets_people.codex.ts_load
