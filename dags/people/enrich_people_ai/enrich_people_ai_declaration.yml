dag:
  name: enrich_people_ai
  owner: Data People
  callback_by_task: False
  schedule_start_date: 2026, 9, 10
  documentation:
    dag_purpose: |
      People AI enrichments on EMR via the internal LiteLLM gateway
      (`spark_jobs/lib/llm_client.py`), writing into `datalake_people` alongside
      SQL enrich tables from `enrich_people`.

      The current registered product is the Teva survey pillar summary
      (`ai_teva_survey_summary`), reading
      `datalake_people.teva_survey_inputs` from `enrich_people`. Product-specific
      prompt, parser, output schema, and classification rules live under
      `spark_jobs/products/`; operational LiteLLM settings live in
      `spark_jobs/products/ai_products.yml`.

      `ai_teva_survey_summary` has one row per survey_invite_id and merges on that key.
      Its declaration uses processing mode `unclassified`, which processes missing
      target rows and rows whose `ai_executive_summary` is empty. Change the
      `--processing-mode` argument to `new_only` to process only absent keys, or to
      `all` to intentionally regenerate existing summaries. Every mode remains
      bounded by the product `max_calls_per_run` setting.

      The Teva prompt uses question-title JSON payload keys, the Likert 1-2/3/4-5
      sentiment rule, and fixed JSON root keys. Open answers are not pre-translated;
      the prompt requires English output. `load_start_date` / `load_end_date` are
      passed for framework compatibility but do not filter inputs today.

workflow:
  type: query_delta
  layer: enrich
  bucket_config_name: people_bucket
  custom_schema: people
  has_hive_sync: true
  credentials_scope: people
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  default_table_privileges:
    people-team: ["ALL PRIVILEGES"]
  tables_customization:
    ai_teva_survey_summary:
      extraction_type: full
      merge_on: [survey_invite_id]
      vacuum_retention_hours: 168
      vacuum_lite: true
      load_spark_job: run_ai_enrichment
      py_files: true
      spark_job_arguments:
        - "{environment}"
        - "{bucket}"
        - "{dag_name}"
        - "{schema}"
        - "{table_name}"
        - "{partitions}"
        - "{load_start_date}"
        - "{load_end_date}"
        - "--product"
        - "teva"
        - "--processing-mode"
        - "unclassified"
