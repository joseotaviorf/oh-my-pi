---
table_name: datalake_employee.hierarchy_closure
alert_channel: PEOPLE_ALERTS

table_level_validations:
  has_size:
    greater_than: 1
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: 0
    less_than_or_equal_to: 25
    severity_level: Warning

column_level_validations:
  sk_hierarchy:
    is_complete:
      severity_level: Error
    is_unique:
      severity_level: Error
    has_min_length:
      equal_to: 32
      severity_level: Error
    has_max_length:
      equal_to: 32
      severity_level: Error

  assignment_number:
    is_complete:
      severity_level: Error
    custom:
      # Each employee should have at least one current hierarchy record
      constraint: "(SELECT COUNT(DISTINCT assignment_number) FROM datalake_employee.hierarchy_closure WHERE is_current = true) >= (SELECT COUNT(DISTINCT assignment_number) FROM datalake_employee.hierarchy_closure) * 0.95"
      severity_level: Warning

  employee_name:
    is_complete:
      severity_level: Error

  name_l0:
    has_null_count:
      # CEO should always exist in hierarchy
      less_than_or_equal_to: 10
      severity_level: Warning
    custom:
      # CEO must always be Gabriel Braga Vieira
      constraint: "(SELECT COUNT(*) FROM datalake_employee.hierarchy_closure WHERE name_l0 IS NOT NULL AND name_l0 != 'GABRIEL BRAGA VIEIRA') = 0"
      severity_level: Error

  assignment_number_l0:
    has_null_count:
      less_than_or_equal_to: 10
      severity_level: Warning
    custom:
      # CEO assignment number validation
      constraint: "(SELECT COUNT(*) FROM datalake_employee.hierarchy_closure WHERE assignment_number_l0 IS NOT NULL AND assignment_number_l0 != 'E109251-2') = 0"
      severity_level: Error

  dt_started:
    is_complete:
      severity_level: Error
    custom:
      # Ensure dt_started is always before or equal to dt_ended
      constraint: "dt_started <= dt_ended"
      severity_level: Error

  dt_ended:
    is_complete:
      severity_level: Error
    custom:
      # Current records should have end date as future date
      constraint: "(SELECT COUNT(*) FROM datalake_employee.hierarchy_closure WHERE is_current = true AND dt_ended != '4712-12-31') = 0"
      severity_level: Error

  version:
    is_complete:
      severity_level: Error
    has_min_value:
      greater_than_or_equal_to: 1
      severity_level: Error
    custom:
      # Version should be sequential for each employee
      constraint: "(SELECT COUNT(*) FROM (SELECT assignment_number, version, ROW_NUMBER() OVER (PARTITION BY assignment_number ORDER BY dt_started) as expected_version FROM datalake_employee.hierarchy_closure) WHERE version != expected_version) = 0"
      severity_level: Warning

  is_current:
    is_complete:
      severity_level: Error
    custom:
      # Each employee should have exactly one current record
      constraint: "(SELECT COUNT(*) FROM (SELECT assignment_number, SUM(CAST(is_current AS INT)) as current_count FROM datalake_employee.hierarchy_closure GROUP BY assignment_number HAVING current_count != 1)) = 0"
      severity_level: Warning

  ts_load:
    is_complete:
      severity_level: Error
    custom:
      # ts_load should be recent (within last 7 days for scheduled runs)
      constraint: "ts_load >= CURRENT_DATE - INTERVAL '7' DAY"
      severity_level: Warning