database_name: datalake_employee
table_name: hierarchy_closure
owner: isabella.araujo@quintoandar.com.br
domain: People
description: |
  SCD Type 2 Hierarchical closure table for employees, providing a complete historical view of management chains.
  The hierarchy is structured with the CEO at 'l0' (highest level) and the direct manager at the highest 'lX' for a given employee.
  Periods of validity (dt_started, dt_ended) are calculated by intersecting the effective dates of all relationships in the chain.
  Consecutive periods with identical hierarchies are consolidated to reduce redundancy.
  This table supports Slowly Changing Dimension Type 2, tracking changes with 'version' and 'is_current' flags.

columns:
  sk_hierarchy:
    description: Surrogate key for the dimension table. Generated using MD5 hash of assignment_number and version to ensure uniqueness across all versions of each employee's hierarchy. This is the primary key of the dimension and should be used for joins in fact tables.
  assignment_number:
    description: Unique identifier for the employee's assignment (business key)
    lineage:
      - datalake_pin.managers_history.assignment_number
  employee_name:
    description: Full name of the employee whose hierarchy is being represented
    lineage:
      - datalake_pin.managers_history.employee_name
  name_l0:
    description: Level 0 in the hierarchy (CEO - top of the organization). Always represents the highest level of management.
    lineage:
      - datalake_pin.managers_history.manager_name
  assignment_number_l0:
    description: Assignment number for level 0 (CEO)
    lineage:
      - datalake_pin.managers_history.manager_assignment_number
  name_l1:
    description: Level 1 in the hierarchy (reports directly to CEO)
    lineage:
      - datalake_pin.managers_history.manager_name
  assignment_number_l1:
    description: Assignment number for level 1
    lineage:
      - datalake_pin.managers_history.manager_assignment_number
  name_l2:
    description: Level 2 in the hierarchy
    lineage:
      - datalake_pin.managers_history.manager_name
  assignment_number_l2:
    description: Assignment number for level 2
    lineage:
      - datalake_pin.managers_history.manager_assignment_number
  name_l3:
    description: Level 3 in the hierarchy
    lineage:
      - datalake_pin.managers_history.manager_name
  assignment_number_l3:
    description: Assignment number for level 3
    lineage:
      - datalake_pin.managers_history.manager_assignment_number
  name_l4:
    description: Level 4 in the hierarchy
    lineage:
      - datalake_pin.managers_history.manager_name
  assignment_number_l4:
    description: Assignment number for level 4
    lineage:
      - datalake_pin.managers_history.manager_assignment_number
  name_l5:
    description: Level 5 in the hierarchy
    lineage:
      - datalake_pin.managers_history.manager_name
  assignment_number_l5:
    description: Assignment number for level 5
    lineage:
      - datalake_pin.managers_history.manager_assignment_number
  name_l6:
    description: Level 6 in the hierarchy
    lineage:
      - datalake_pin.managers_history.manager_name
  assignment_number_l6:
    description: Assignment number for level 6
    lineage:
      - datalake_pin.managers_history.manager_assignment_number
  name_l7:
    description: Level 7 in the hierarchy
    lineage:
      - datalake_pin.managers_history.manager_name
  assignment_number_l7:
    description: Assignment number for level 7
    lineage:
      - datalake_pin.managers_history.manager_assignment_number
  name_l8:
    description: Level 8 in the hierarchy
    lineage:
      - datalake_pin.managers_history.manager_name
  assignment_number_l8:
    description: Assignment number for level 8
    lineage:
      - datalake_pin.managers_history.manager_assignment_number
  name_l9:
    description: Level 9 in the hierarchy (direct manager for most employees)
    lineage:
      - datalake_pin.managers_history.manager_name
  assignment_number_l9:
    description: Assignment number for level 9
    lineage:
      - datalake_pin.managers_history.manager_assignment_number
  dt_started:
    description: Start date of this specific hierarchy configuration. Calculated as the GREATEST of all `dt_effective_started` dates in the hierarchy chain.
    lineage:
      - datalake_pin.managers_history.dt_effective_started
  dt_ended:
    description: End date of this specific hierarchy configuration. Calculated as the LEAST of all `dt_effective_ended` dates in the hierarchy chain. '4712-12-31' indicates the current active record.
    lineage:
      - datalake_pin.managers_history.dt_effective_ended
  version:
    description: Sequential version number for each unique hierarchy configuration of an employee. Starts from 1 and increments with each change.
    lineage:
      - datalake_pin.managers_history.dt_effective_started
  is_current:
    description: Boolean flag indicating if this is the currently active hierarchy record for the employee (TRUE if dt_ended = '4712-12-31', FALSE otherwise).
    lineage:
      - datalake_pin.managers_history.dt_effective_ended
  ts_load:
    description: Timestamp when this record was loaded into the table.
