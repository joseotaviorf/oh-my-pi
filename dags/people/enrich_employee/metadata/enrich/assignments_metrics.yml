---
database_name: enrich_hr_system
table_name: assignments_metrics
owner: isabella.araujo@quintoandar.com.br
domain: people
description: Metrics about assignments. Used to generate fact tables in dw_employee.
columns:
  sk_assignment:
    description: "Surrogate key for the assignment. Just the id_period_of_service"
    lineage:
      - datalake_hr_system.work_relationships.id_period_of_service
  sk_employee:
    description: "Surrogate key for the employee. Just the id_person"
    lineage:
      - datalake_hr_system.work_relationships.id_person
  sk_demographic_information:
    description: "Surrogate key for the demographic information. MD5 of the demographic attributes"
    lineage:
      - datalake_hr_system.demographic_attributes.sk_demographic_information
  sk_cost_center:
    description: "Surrogate key for the cost center. Just the id_cost_center"
    lineage:
      - datalake_hr_system.assignments.id_cost_center
  sk_business_unit:
    description: "Surrogate key for the business unit. Just the id_business_unit"
    lineage:
      - datalake_hr_system.assignments.id_business_unit
  sk_job:
    description: "Surrogate key for the job. Just the id_job"
    lineage:
      - datalake_hr_system.assignments.id_job
  sk_manager:
    description:
      "Surrogate key for dim_employee, with the manager of the employee. Just
      the id_person"
    lineage:
      - datalake_hr_system.assignments.id_assignment
      - datalake_hr_system.assignments.id_person
  sk_manager_assignment:
    description:
      "Surrogate key for dim_assignment with the manager of the employee. Just
      the id_assignment"
    lineage:
      - datalake_hr_system.assignments.id_assignment
      - datalake_hr_system.managers.id_manager_assignment
  sk_disability:
    description: "Unique identifier for the disability related to the assignment."
    lineage:
      - datalake_hr_system.disability.sk_disability
  dt_work_relationship_started:
    description: "Date key for the start of the work relationship. Format: YYYYMMDD"
    lineage:
      - datalake_hr_system.work_relationships.dt_start
  dt_work_relationship_ended:
    description: "Date key for the termination of the work relationship. Format: YYYYMMDD"
    lineage:
      - datalake_hr_system.work_relationships.dt_termination
  is_last_work_relationship:
    description: "Indicates if is the last work relationship of the employee. Doesn't include future relationships."
    lineage:
      - datalake_hr_system.work_relationships.dt_start
      - datalake_hr_system.work_relationships.id_person
  is_active:
    description: "Indicates if the assignment is active."
    lineage:
      - datalake_hr_system.assignments.assignment_status_type
  is_pending_worker:
    description:
      "Indicates if the worker is pending, that is, the worker is not yet
      active."
    lineage:
      - datalake_hr_system.assignments.assignment_status_type
      - datalake_hr_system.work_relationships.dt_start
  is_manager:
    description: "Indicates if the employee is a manager."
    lineage:
      - datalake_hr_system.assignments.career_track
      - datalake_hr_system.managers.id_manager_assignment
  has_self_declared_disability:
    description: "Indicates if the worker has self-declared disability."
    lineage:
      - datalake_hr_system.disability.has_self_declared_disability
  assignment_age_months:
    description: "Age of the assignment in months."
    lineage:
      - datalake_hr_system.work_relationships.dt_start
      - datalake_hr_system.work_relationships.dt_termination
  qnt_directly_led:
    description: "Number of employees directly led by the employee."
    lineage:
      - datalake_hr_system.managers.id_manager_assignment
  qnt_undirectly_led:
    description: "Number of employees undirectly led by the employee"
    lineage:
      - datalake_hr_system.management_hierarchy.id_manager_assignment
  qnt_promotions:
    description: "Number of promotions of the employee, since Jannuary 1st, 2021."
    lineage:
      - datalake_hr_system.assignments.band
      - datalake_hr_system.assignments.id_assignment
      - datalake_hr_system.assignments.dt_effective_start
      - datalake_hr_system.assignments.action_code
  salary:
    description: "Value of the salary."
    lineage:
      - datalake_hr_system_clean.salaries.salary_amount
  target_plr:
    description: "Value of the target for the Variable Remuneration Program."
    lineage:
      - datalake_hr_system.assignments.target_plr
  ts_load:
    description: "Timestamp of the load."
