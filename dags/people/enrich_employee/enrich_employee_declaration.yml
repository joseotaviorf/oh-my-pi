dag:
  name: enrich_employee
  owner: Data People
  documentation:
    dag_purpose: Enrich employee data with hierarchical closure algorithm for SCD Type 2 tracking.

workflow:
  type: query_delta
  layer: enrich
  default_extraction_type: full
  load_spark_job: load_hierarchy_closure
  custom_schema: employee
  spark_job_arguments:
    - "{environment}"
    - "{bucket}"
    - "employee"
    - "hierarchy_closure"
    - "{{ data_interval_start | ds }}"
  has_hive_sync: false
  bucket_config_name: people_bucket
  default_table_privileges:
    people-team:
      - ALL PRIVILEGES
  tables_customization:
    hierarchy_closure: {}

cluster:
  type: custom_cluster
  access_control_list:
    group_name: people-analytics
    permission_level: CAN_MANAGE
  databricks_conn_id: databricks_new_env
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
    driver_node_type_id: r5a.2xlarge
    node_type_id: r5a.xlarge
    num_workers: 3
    spark_version: 16.4.x-scala2.12
    aws_attributes:
      ebs_volume_size: 200
      instance_profile_arn: "{{ var.value.instance_profile_secret_arn_people }}"
