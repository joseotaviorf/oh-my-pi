      'false': 'User does not belong to this group (Standardized answer is "Heterosexual").'
      'null': 'User did not answer (Standardized answer is "I dont wish to answer").'
    lineage:
      - datalake_greenhouse_clean.demographics_answer_options.id
      - datalake_greenhouse_clean.demographics_answer_options.name
  is_neurodiversity_minority:
    description: 'Boolean flag indicating if the person identifies as neurodivergent.'
    categories:
      'true': 'User identifies as neurodivergent (Standardd-sized answer is not "I do not consider myself...").'
      'false': 'User does not identify as neurodivergent (Standardized answer is "I do not consider myself...").'
      'null': 'User did not answer (Standardized answer is "I dont wish to answer").'
    lineage:
      - datalake_greenhouse_clean.demographics_answer_options.id
      - datalake_greenhouse_clean.demographics_answer_options.name
  is_person_with_disability:
    description: 'Boolean flag indicating if the person identifies as having a disability.'
    categories:
      'true': 'User identifies as having a disability (Standardized answer is "Yes").'
      'false': 'User does not identify as having a disability (Standardized answer is "No").'
      'null': 'User did not answer (Standardized answer is "I dont wish to answer").'
    lineage:
      - datalake_greenhouse_clean.demographics_answer_options.id
      - datalake_greenhouse_clean.demographics_answer_options.name
  is_any_minority:
    description: 'Aggregate boolean flag indicating if the person belongs to ANY minority group (Race, Gender, Orientation, Neurodiversity, or Disability). Nulls are treated as "false".'
    categories:
      'true': 'User belongs to one or more minority groups (Any "is_..._minority" flag is true).'
      'false': 'User does not belong to any minority group (All "is_..._minority" flags are false).'
    lineage:
      - datalake_greenhouse_clean.demographics_answer_options.id
      - datalake_greenhouse_clean.demographics_answer_options.name
