  answer_race_ethnicity:
    description: 'Race/ethnicity answer, standardized to English (EN). Values marked with * are unmapped.'
    categories:
      'White': 'Standardized value. Maps from: "Branca" (PT), "White" (EN), "Blanca" (ES).'
      'Black or African American': 'Standardized value. Maps from: "Preta" (PT), "Black or African American" (EN), "Afrodescendiente" (ES).'
      'Two or more races': 'Standardized value. Maps from: "Parda" (PT), "Two or more races" (EN), "Mestiza" (ES).'
      'Asian': 'Standardized value. Maps from: "Amarela" (PT), "Asian" (EN), "Oriental" (ES).'
      'American Indian': 'Standardized value. Maps from: "Indígena" (PT), "American Indian" (EN), "Pueblos Nativos/Originarios" (ES).'
      'I dont wish to answer': 'Standardized value. Maps from: "Não quero responder" (PT), "I dont wish to answer" (EN), "No quiero responder" (ES).'
    lineage:
      - datalake_greenhouse_clean.demographics_answer_options.id
      - datalake_greenhouse_clean.demographics_answer_options.name
  answer_gender_identity:
    description: 'Gender identity answer, standardized to English (EN). Values marked with * are unmapped.'
    categories:
      'Cisgender Man': 'Standardized value. Maps from: "Homem cisgênero" (PT), "Cisgender Man" (EN), "Hombre cisgénero" (ES).'
      'Cisgender Woman': 'Standardized value. Maps from: "Mulher cisgênero" (PT), "Cisgender Woman" (EN), "Mujer cisgénero" (ES).'
      'Transgender Man': 'Standardized value. Maps from: "Homem transgênero" (PT), "Transgender Man" (EN), "Hombre transgênero" (ES).'
      'Transgender Woman': 'Standardized value. Maps from: "Mulher transgênero" (PT), "Transgender Woman" (EN), "Mujer transgênero" (ES).'
      'Non-binary': 'Standardized value. Maps from: "Não-binário" (PT), "Non-binary" (EN), "Genero no binario/a" (ES).'
      'Other': 'Standardized value. Maps from: "Outra" (PT), "Other" (EN), "Otra" (ES).'
      'I dont wish to answer': 'Standardized value. Maps from: "Não quero responder" (PT), "I dont wish to answer" (EN), "No quiero responder" (ES).'
    lineage:
      - datalake_greenhouse_clean.demographics_answer_options.id
      - datalake_greenhouse_clean.demographics_answer_options.name
  answer_sexual_orientation:
    description: 'Sexual orientation answer, standardized to English (EN). Values marked with * are unmapped.'
    categories:
      'Asexual': 'Standardized value. Maps from: "Assexual" (PT/ES), "Asexual" (EN).'
      'Bisexual': 'Standardized value. Maps from: "Bissexual" (PT/ES), "Bisexual" (EN).'
      'Heterosexual': 'Standardized value. Maps from: "Heterossexual" (PT), "Heterosexual" (EN/ES).'
      'Homosexual': 'Standardized value. Maps from: "Homossexual" (PT), "Homosexual" (EN/ES).'
      'Pansexual': 'Standardized value. Maps from: "Pansexual" (PT/ES), "Pansexual" (EN).'
      'Other': 'Standarddized value. Maps from: "Outra" (PT), "Other" (EN), "Otra" (ES).'
      'I dont wish to answer': 'Standardized value. Maps from: "Não quero responder" (PT), "I dont wish to answer" (EN), "No quiero responder" (ES).'
    lineage:
      - datalake_greenhouse_clean.demographics_answer_options.id
      - datalake_greenhouse_clean.demographics_answer_options.name
  answer_neurodiversity:
    description: 'Neurodiversity answer, standardized to English (EN). Values marked with * are unmapped.'
    categories:
      'Autism Spectrum Disorder (ASD)': 'Standardized value. Maps from: "Transtorno do Espectro Autista (TEA)" (PT), "Autism Spectrum Disorder (ASD)" (EN), etc.'
      'Attention Deficit Hyperactivity Disorder (ADHD)': 'Standardized value. Maps from: "Transtorno de Déficit de Atenção com Hiperatividade (TDAH)" (PT), "Attention Deficit Hyperactivity Disorder (ADHD)" (EN), etc.'
      'Dyslexia': 'Standardized value. Maps from: "Dislexia" (PT), "Dyslexia" (EN).'
      'Dyspraxia': 'Standardized value. Maps from: "Dispraxia" (PT).'
      'I do not consider myself a neurodivergent person': 'Standardized value. Maps from: "Não me considero uma pessoa neurodivergente" (PT), "I do not consider myself a neurodivergent person" (EN), etc.'
      'Other': 'Standardized value. Maps from: "Outra" (PT), "Other" (EN), "Otra" (ES).'
      'I dont wish to answer': 'Standardized value. Maps from: "Não quero responder" (PT), "I dont wish to answer" (EN), "No quiero responder" (ES).'
    lineage:
      - datalake_greenhouse_clean.demographics_answer_options.id
      - datalake_greenhouse_clean.demographics_answer_options.name
  answer_has_disability:
    description: '"Has disability" answer, standardized to English (EN). Values marked with * are unmapped.'
    categories:
      'Yes': 'Standardized value. Maps from: "Sim" (PT), "Yes" (EN), "Si" (ES).'
      'No': 'Standardized value. Maps from: "Não" (PT), "No" (EN), "No" (ES).'
      'I dont wish to answer': 'Standardized value. Maps from: "Não quero responder" (PT), "I dont wish to answer" (EN), "No quiero responder" (ES).'
    lineage:
      - datalake_greenhouse_clean.demographics_answer_options.id
      - datalake_greenhouse_clean.demographics_answer_options.name
  answer_accessibility_details:
    description: 'Accessibility needs answer, standardized to English (EN). Values marked with * are unmapped.'
    categories:
      'Yes (Please specify)': 'Standardized value. Maps from: "Sim (Por favor, especifique)" (PT), "Yes (Please specify)" (EN), "Sí (Por favor, especifique)" (ES).'
      'No': 'Standardized value. Maps from: "Não" (PT), "No" (EN), "No" (ES).'
      'I dont wish to answer': 'Standardized value. Maps from: "Não quero responder" (PT), "I dont wish to answer" (EN), "No quiero responder" (ES).'
    lineage:
