  answer_disability_type:
    description: 'List of disability type answers, standardized to English (EN) (array). Values marked with * are unmapped.'
    categories:
      'Deafness and hearing loss': 'Standardized value. Maps from: "Deficiência Auditiva" (PT), "Deafness and hearing loss" (EN), "Discapacidad Auditiva" (ES).'
      'Physical Disability': 'Standardized value. Maps from: "Deficiência Física" (PT), "Physical Disability" (EN), "Discapacidad Física" (ES).'
      'Intellectual Disability': 'Standardized value. Maps from: "Deficiência Intelectual" (PT), "Intellectual Disability" (EN).'
      'Visual impairment': 'Standardized value. Maps from: "Deficiência Visual" (PT), "Visual impairment" (EN), "Discapacidad Visual" (ES).'
      'Mental/Psychosocial Disability': 'Standardized value. Maps from: "Deficiência Mental/Psicossocial" (PT), "Mental/Psychosocial Disability" (EN).'
      'Multiple Disabilities': 'Standardized value. Maps from: "Múltiplas Deficiências" (PT), "Multiple Disabilities" (EN).'
      'I do not consider myself a person with a disability': 'Standardized value. Maps from: "Não me considero uma pessoa com deficiência" (PT), "I do not consider myself..." (EN), "No me considero..." (ES).'
      'Other': 'Standardized value. Maps from: "Outra" (PT), "Other" (EN), "Otra" (ES).'
      'I dont wish to answer': 'Standardized value. Maps from: "Não quero responder" (PT), "I dont wish to answer" (EN), "No quiero responder" (ES).'
