  is_woman:
    description: 'Boolean flag indicating if the person identifies as a woman.'
    categories:
      'true': 'User identifies as a woman (Standardized answers: "Cisgender Woman", "Transgender Woman").'
      'false': 'User identifies as a man (Standardized answers: "Cisgender Man", "Transgender Man").'
      'null': 'User identifies as Non-binary, Other, or did not answer.'
    lineage:
      - datalake_greenhouse_clean.demographics_answer_options.id
      - datalake_greenhouse_clean.demographics_answer_options.name
  is_race_ethnicity_minority:
    description: 'Boolean flag indicating if the person belongs to a racial/ethnic minority group (Not White).'
    categories:
      'true': 'User belongs to this group (Standardized answer is not "White").'
      'false': 'User does not belong to this group (Standardized answer is "White").'
      'null': 'User did not answer (Standardized answer is "I dont wish to answer").'
    lineage:
      - datalake_greenhouse_clean.demographics_answer_options.id
      - datalake_greenhouse_clean.demographics_answer_options.name
  is_gender_identity_minority:
    description: 'Boolean flag indicating if the person belongs to a gender identity minority group (Not Cisgender).'
    categories:
      'true': 'User belongs to this group (Standardized answer is not "Cisgender Man" or "Cisgender Woman").'
      'false': 'User does not belong to this group (Standardized answer is "Cisgender Man" or "Cisgender Woman").'
      'null': 'User did not answer (Standardized answer is "I dont wish to answer").'
    lineage:
      - datalake_greenhouse_clean.demographics_answer_options.id
      - datalake_greenhouse_clean.demographics_answer_options.name
  is_sexual_orientation_minority:
    description: 'Boolean flag indicating if the person belongs to a sexual orientation minority group (Not Heterosexual).'
    categories:
