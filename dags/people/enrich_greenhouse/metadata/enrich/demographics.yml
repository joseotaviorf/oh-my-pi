database_name: datalake_greenhouse
table_name: demographics
owner: gabriel.berger@quintoandar.com.br
domain: People
description: 'Pivoted table containing demographic answers from the ATS (Greenhouse). Each row represents a unique application (id_application), with columns for each demographic question group, answers standardized to English (EN), and boolean flags for minority groups.'

