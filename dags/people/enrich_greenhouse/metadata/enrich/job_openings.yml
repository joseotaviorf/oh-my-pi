    description: The unique identifier for the job opening.
    lineage:
    - datalake_greenhouse_clean.jobs.openings.id
  id_job:
    description: The unique identifier for the job associated with this opening.
    lineage:
    - datalake_greenhouse_clean.jobs.id
  id_application_hired:
    description: The ID of the application that was hired for this opening.
    lineage:
    - datalake_greenhouse_clean.jobs.openings.application_id
