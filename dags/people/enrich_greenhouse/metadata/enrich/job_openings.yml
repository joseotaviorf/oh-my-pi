database_name: datalake_greenhouse
table_name: job_openings
owner: gabriel.berger@quintoandar.com.br
domain: People
description: |-
  Represents individual headcount requisitions, corresponding to 'Job Openings' in the Greenhouse ATS. Each record is a specific vacancy for a broader job profile, sourced by exploding the 'openings' array from the `jobs` raw table. *Notes: The 'what_is_the_job_id_in_budget_' field is archived and not longer being used.
columns:
