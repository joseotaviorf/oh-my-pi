    dimension: True
    lineage:
      - dw_employee_details.dim_termination.action_name_ptb

  termination_type:
    description: Classification of the closing action, constant across the assignment. Voluntary, involuntary, or pending for a real exit; NULL when the assignment is not a company exit (active, internal transfer, expatriate movement, or intern/apprentice effectivation).
    dimension: True
    categories:
      "voluntary": Employee-initiated exit (resignation).
      "involuntary": Company-initiated exit.
      "pending": Real company exit awaiting classification; counted in turnover and expected to resolve to voluntary or involuntary.
    lineage:
      - dw_employee_details.fact_assignment_snapshots.termination_type

