    dimension: True
    lineage:
      - dw_compensation.fact_compensations.dt_valid_from

  ts_load:
    description: Snapshot attribute for ts_load on the employee_snapshots wide metric table.
    dimension: True
    lineage:
      - dw_employee_details.fact_assignment_snapshots.ts_load

