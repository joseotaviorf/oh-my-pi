    description: Snapshot attribute for is_eligible_internet_reimbursement on the employee_snapshots wide metric table.
    dimension: True
    lineage:
      - dw_compensation.fact_compensations.is_eligible_internet_reimbursement

  is_active:
    description: Snapshot attribute for is_active on the employee_snapshots wide metric table.
    dimension: True
    lineage:
      - dw_employee_details.fact_assignment_snapshots.is_active

  is_effective_worker:
    description: True when the assignment is in the official effective workforce (excludes interns and young apprentices). Filter is_effective_worker = TRUE for official turnover and headcount.
    dimension: True
    lineage:
      - dw_employee_details.fact_assignment_snapshots.is_effective_worker

  is_layoff:
    description: Snapshot attribute for is_layoff on the employee_snapshots wide metric table.
    dimension: True
    lineage:
      - dw_employee_details.fact_assignment_snapshots.is_reorganization_termination

  manager_is_active:
    description: True when the employee's direct manager has an active assignment on the snapshot date.
    dimension: True
    lineage:
      - dw_employee_details.fact_assignment_snapshots.is_active

  is_manager:
    description: Snapshot attribute for is_manager on the employee_snapshots wide metric table.
    dimension: True
    lineage:
      - dw_employee_details.fact_assignment_snapshots.is_manager

  is_leadership_team_member:
    description: Snapshot attribute for is_leadership_team_member on the employee_snapshots wide metric table.
    dimension: True
    lineage:
      - dw_employee_details.fact_assignment_snapshots.is_leadership_team_member

  is_executive_team_member:
    description: Snapshot attribute for is_executive_team_member on the employee_snapshots wide metric table.
    dimension: True
    lineage:
      - dw_employee_details.fact_assignment_snapshots.is_executive_team_member

  has_emergency_contact:
    description: Snapshot attribute for has_emergency_contact on the employee_snapshots wide metric table.
    dimension: True
    lineage:
      - dw_employee_details.fact_assignment_snapshots.has_emergency_contact

  is_transfer_hire:
    description: True when the assignment began as the incoming side of an internal transfer, so the person was already at the company. Filter is_transfer_hire = FALSE to keep transfers out of new-hire counts.
    dimension: True
    lineage:
      - dw_employee_details.fact_assignment_snapshots.is_transfer_hire

  is_transfer_termination:
    description: True when the assignment was closed by an internal transfer rather than a real exit; the person stays employed under a continuation assignment. Filter is_transfer_termination = FALSE for genuine dismissals and turnover.
    dimension: True
    lineage:
      - dw_employee_details.fact_assignment_snapshots.is_transfer_termination

  is_effectivation_hire:
    description: True when the assignment began as an intern/apprentice effectivation (efetivação). Effectivation is a PIN conversion event and does not always land on a permanent CLT role; use is_effective_worker when counting new effective hires.
    dimension: True
    lineage:
      - dw_employee_details.fact_assignment_snapshots.is_effectivation_hire

  is_effectivation_termination:
    description: True when the assignment closed as the intern/apprentice side of an effectivation (efetivação), not a real company exit.
    dimension: True
    lineage:
      - dw_employee_details.fact_assignment_snapshots.is_effectivation_termination

  is_primary_assignment_for_snapshot:
    description: Snapshot attribute for is_primary_assignment_for_snapshot on the employee_snapshots wide metric table.
    dimension: True
    lineage:
      - dw_employee_details.fact_assignment_snapshots.is_primary_assignment_for_snapshot

  is_current:
    description: True on exactly one row per employee, the assignment active today or their most recent terminated assignment. Use this flag to filter for the employee's current state.
    dimension: True
    lineage:
      - dw_employee_details.fact_assignment_snapshots.is_current_for_employee

  is_current_for_employee:
    description: True on exactly one row per employee, the assignment active today or their most recent terminated assignment. Use this flag to filter for the employee's current state.
    dimension: True
    lineage:
      - dw_employee_details.fact_assignment_snapshots.is_current_for_employee

  dt_month_reference:
    description: Last calendar day of the snapshot month. Active employees show the month-end of today's month; terminated employees show the month-end of their termination month.
    dimension: True
    lineage:
      - dw_employee_details.fact_assignment_snapshots.dt_month_reference

  dt_birth:
    description: Snapshot attribute for dt_birth on the employee_snapshots wide metric table.
    dimension: True
    lineage:
      - dw_employee_details.dim_employee.dt_birth

  dt_assignment_started:
    description: Date this specific assignment started; restarts on internal transfers and rehires. Use for time in the current assignment (e.g. 2023-08-01).
    dimension: True
    lineage:
      - dw_employee_details.fact_assignment_snapshots.dt_assignment_started

  dt_terminated:
    description: Date the assignment ended (e.g. 2024-03-15). NULL while the assignment is active; a future date is a scheduled voluntary exit.
    dimension: True
    lineage:
      - dw_employee_details.fact_assignment_snapshots.dt_terminated

  dt_employee_hired:
    description: Date the employee was hired for their current employment cycle; stays fixed across internal transfers and resets on a genuine rehire. Use for company tenure (e.g. 2021-05-10).
    dimension: True
    lineage:
      - dw_employee_details.fact_assignment_snapshots.dt_employee_hired

  dt_notified_termination:
    description: Snapshot attribute for dt_notified_termination on the employee_snapshots wide metric table.
    dimension: True
    lineage:
      - dw_employee_details.fact_assignment_snapshots.dt_notified_termination

  dt_last_raise:
