dag:
  name: metric_people
  owner: Data People
  schedule_start_date: 2026, 5, 22
  documentation:
    dag_purpose: |
      People metric-layer tables sourced only from People DW models (dw_*). First
      delivery: employee_snapshots — one row per employee (sk_employee) and
      snapshot date (dt_month_reference), derived from dw_employee_details.fact_assignment_snapshots
      using a DW-only tie-break when multiple assignments overlap a person-day.
workflow:
  type: query_delta
  layer: metric
  bucket_config_name: people_bucket
  custom_schema: people
  has_hive_sync: true
  default_extraction_type: full
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  default_table_privileges:
    people-team: ["ALL PRIVILEGES"]
  tables_customization:
    employee_snapshots:
      vacuum_retention_hours: 168
      vacuum_lite: true
