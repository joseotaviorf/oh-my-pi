---
database_name: datalake_hr_system_clean
table_name: payroll_relationships
description: The payrollRelationship resource includes a list of all payroll relationships as of the specified date. It returns information on the payroll relationship data.
domain: People
owner: data-people@quintoandar.com.br
columns:
  id_overriding_period:
    lineage:
      - datalake_hr_system_raw.payroll_relationships.overridingperiodid
    description: Overtime period associated with the payroll relationship, such as the FLSA period for US employees.
  id_party:
    lineage:
      - datalake_hr_system_raw.payroll_relationships.partyid
    description: Unique identifier used to capture the payment details for the person, such as bank account information. The party identifier is an entity of the trading community model.
  id_payroll_relationship:
    lineage:
      - datalake_hr_system_raw.payroll_relationships.payrollrelationshipid
    description: Unique identifier used to retrieve the payroll relationship.
  country:
    lineage:
      - datalake_hr_system_raw.payroll_relationships.country
    description: Country of the person associated with the payroll relationship. This is derived based on the person's legislative data group.
  payroll_relationship_number:
    lineage:
      - datalake_hr_system_raw.payroll_relationships.payrollrelationshipnumber
    description: Number assigned to a payroll relationship.
  person_number:
    lineage:
      - datalake_hr_system_raw.payroll_relationships.personnumber
    description: Number of the person associated with the payroll relationship.
  party_number:
    lineage:
      - datalake_hr_system_raw.payroll_relationships.partynumber
    description: Unique identifier used to capture the payment details for the person, such as bank account information. The registry identifier is an entity of the trading community model.
  pay_relationships:
    lineage:
      - datalake_hr_system_raw.payroll_relationships.payrelationshipsddf
    description: Custom field containing payment receipts.
  payroll_assignments:
    lineage:
      - datalake_hr_system_raw.payroll_relationships.payrollassignments
    description: The payrollAssignments resource is a child of the payrollRelationships resource.It includes a list of all payroll assignments for a given payroll relationship.
  payroll_relationship_dates:
    lineage:
      - datalake_hr_system_raw.payroll_relationships.payrollrelationshipdates
    description: The payrollRelationshipDates resource is a child of the payrollRelationships resource. It includes a list of all element duration dates for the given payroll relationship.
  dt_start:
    lineage:
      - datalake_hr_system_raw.payroll_relationships.startdate
    description: Start date of the payroll relationship's date-effective record.
  dt_end:
    lineage:
      - datalake_hr_system_raw.payroll_relationships.enddate
    description: End date of the payroll relationship's date-effective record.
  dt_effective_start:
    lineage:
      - datalake_hr_system_raw.payroll_relationships.effectivestartdate
    description: Date at the beginning of the date range within which the payroll relationship is effective.
  dt_effective_end:
    lineage:
      - datalake_hr_system_raw.payroll_relationships.effectiveenddate
    description: Date at the end of the date range within which the payroll relationship is effective.
  ts_load:
    lineage:
      - datalake_hr_system_raw.payroll_relationships.ts_load
    description: Timestamp of the load of the record in the data lake.
