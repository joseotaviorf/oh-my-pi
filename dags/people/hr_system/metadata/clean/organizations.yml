    description: Timestamp of the creation of the organization record
    lineage:
    - datalake_hr_system_raw.organizations.CreationDate
  ts_last_update:
    description: Timestamp of the last update of the organization record
    lineage:
    - datalake_hr_system_raw.organizations.LastUpdateDate
  ts_load:
