database_name: datalake_hr_system_clean
table_name: areas_of_responsibility
owner: isabella.araujo@quintoandar.com.br
domain: People
description: |-
  The representatives resource provides details of representatives of a person. A person can have different types of representatives such as benefits representative, human resources representative, and so on.
columns:
  id_responsibility:
    description: Identifier of the responsibility.
    lineage:
    - datalake_hr_system_raw.areas_of_responsibility.ResponsibilityId
  id_person:
    description: Person identifier of the representative.
    lineage:
    - datalake_hr_system_raw.areas_of_responsibility.PersonId
  id_assignment:
    description: Surrogate identifier for the representative's assignment.
    lineage:
    - datalake_hr_system_raw.areas_of_responsibility.AssignmentId
  id_template:
    description: Responsibility template identifier associated to this responsibility.
    lineage:
    - datalake_hr_system_raw.areas_of_responsibility.TemplateId
  id_legal_entity:
    description: Legal entity identifier of the responsibility.
    lineage:
    - datalake_hr_system_raw.areas_of_responsibility.LegalEntityId
  id_department:
    description: Column description to be added.
    lineage:
    - datalake_hr_system_raw.areas_of_responsibility.DepartmentId
  person_number:
    description: Person number of the representative.
    lineage:
    - datalake_hr_system_raw.areas_of_responsibility.PersonNumber
  assignment_number:
    description: Unique assignment identifier of the representative who has one or more responsibilities.
    lineage:
    - datalake_hr_system_raw.areas_of_responsibility.AssignmentNumber
  assignment_name:
    description: Name of the representative's assignment.
    lineage:
    - datalake_hr_system_raw.areas_of_responsibility.AssignmentName
  responsibility_name:
    description: Label for the workforce responsibility area defined in the legacy HR system.
    lineage:
    - datalake_hr_system_raw.areas_of_responsibility.ResponsibilityName
  responsibility_type:
    description: Classification of the responsibility scope, such as department or business unit.
    lineage:
    - datalake_hr_system_raw.areas_of_responsibility.ResponsibilityType
  display_name:
    description: Column description to be added.
    lineage:
    - datalake_hr_system_raw.areas_of_responsibility.DisplayName
  template_code:
    description: Column description to be added.
    lineage:
    - datalake_hr_system_raw.areas_of_responsibility.TemplateCode
  template_name:
    description: Responsibility template name associated to this responsibility.
    lineage:
    - datalake_hr_system_raw.areas_of_responsibility.TemplateName
  active_status:
    description: Status of the responsibility, such as active or inactive.
    lineage:
    - datalake_hr_system_raw.areas_of_responsibility.ActiveStatus
  Usage:
    description: Column description to be added.
    lineage:
    - datalake_hr_system_raw.areas_of_responsibility.Usage
  is_work_contacts:
    description: Column description to be added.
    lineage:
    - datalake_hr_system_raw.areas_of_responsibility.WorkContactsFlag
  dt_started:
    description: Start date of the responsibility.
    lineage:
    - datalake_hr_system_raw.areas_of_responsibility.StartDate
  dt_ended:
    description: The responsibility's end date.
    lineage:
    - datalake_hr_system_raw.areas_of_responsibility.EndDate
  ts_load:
    description: Timestamp of the load of the worker record in the data lake
    lineage:
    - datalake_hr_system_raw.areas_of_responsibility.ts_load
