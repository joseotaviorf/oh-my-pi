database_name: datalake_hr_system_clean
table_name: departments_lov
owner: leonardo.soares@quintoandar.com.br
domain: people
description: The departmentsLov table includes the list of values for departments.
columns:
  id_organization:
    description: 'Surrogate identifier for the department.'
    lineage:
    - datalake_hr_system_raw.departments_lov.OrganizationId
  id_set:
    description: 'Surrogate identifier for the set that the department belongs to.'
    lineage:
    - datalake_hr_system_raw.departments_lov.SetId
  id_location:
    description: 'Unique identifier for the location of the department.'
    lineage:
    - datalake_hr_system_raw.departments_lov.LocationId
  name:
    description: 'Name of the department.'
    lineage:
    - datalake_hr_system_raw.departments_lov.Name
  title:
    description: 'Title of the department.'
    lineage:
    - datalake_hr_system_raw.departments_lov.Title
  status:
    description: 'Status of the department such as active or inactive.'
    lineage:
    - datalake_hr_system_raw.departments_lov.Status
  location_code:
    description: 'Code of the location associated with the business unit.'
    lineage:
    - datalake_hr_system_raw.departments_lov.LocationCode
  location_name:
    description: 'Name of the location associated with the business unit.'
    lineage:
    - datalake_hr_system_raw.departments_lov.LocationName
  set_code:
    description: 'Code of the set that the department belongs to.'
    lineage:
    - datalake_hr_system_raw.departments_lov.SetCode
  set_name:
    description: 'Name of the set that the department belongs to.'
    lineage:
    - datalake_hr_system_raw.departments_lov.SetName
  dt_effective_start:
    description: 'Date at the beginning of the period within which the department is effective.'
    lineage:
    - datalake_hr_system_raw.departments_lov.TO_DATE(EffectiveStartDate, 'yyyy-MM-dd')
  dt_effective_end:
    description: 'Date at the end of the period within which the department is effective.'
    lineage:
    - datalake_hr_system_raw.departments_lov.TO_DATE(EffectiveEndDate, 'yyyy-MM-dd')
  ts_load:
    description: ''
    lineage:
    - datalake_hr_system_raw.departments_lov.ts_load
