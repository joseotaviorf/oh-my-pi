---
database_name: datalake_hr_system_clean
table_name: jobs
owner: leonardo.soares@quintoandar.com.br
domain: People
description: Job definitions and configurations from Oracle HR System including job families, grades, and requirements
columns:
  id_job:
    description: 'Primary key generated by the application.'
    lineage:
    - datalake_hr_system_raw.jobs.JobId
  id_set:
    description: 'Set of reference data shared across business units and other entities. Also known as Reference Data Sets, they are used to filter reference data in transactional UIs.'
    lineage:
    - datalake_hr_system_raw.jobs.SetId
  id_job_family:
    description: 'Unique key for a group of jobs having different but related functions, qualifications, and titles.'
    lineage:
    - datalake_hr_system_raw.jobs.JobFamilyId
  id_grade_ladder:
    description: 'Identifier for the grade ladder.'
    lineage:
    - datalake_hr_system_raw.jobs.GradeLadderId
  job_code:
    description: 'Short form for a job. Used for identification purposes.'
    lineage:
    - datalake_hr_system_raw.jobs.JobCode
  active_status:
    description: 'Indicates whether a job is active or not. Valid values are defined in the list ActiveStatusLOV.'
    lineage:
    - datalake_hr_system_raw.jobs.ActiveStatus
  full_part_time:
    description: 'Indicates whether a job is full-time or part-time. Valid values are defined in the list FullPartTimeLOV.'
    lineage:
    - datalake_hr_system_raw.jobs.FullPartTime
  job_function_code:
    description: 'Code that best categorizes the job by function, such as administrative, legal, or management. Valid values are defined in the list JobFunctionLookup.'
    lineage:
    - datalake_hr_system_raw.jobs.JobFunctionCode
  manager_level:
    description: 'Level of management associated with the employee. Valid values are defined in the list ManagerLevelLookup.'
    lineage:
    - datalake_hr_system_raw.jobs.ManagerLevel
  standard_working_hours:
    description: 'Number of standard working hours.'
    lineage:
    - datalake_hr_system_raw.jobs.StandardWorkingHours
  standard_working_frequency:
    description: 'Frequency for the standard working hours.'
    lineage:
    - datalake_hr_system_raw.jobs.StandardWorkingFrequency
  standard_annual_working_duration:
    description: 'The standard annual working duration for the job.'
    lineage:
    - datalake_hr_system_raw.jobs.StandardAnnualWorkingDuration
  annual_working_duration_units:
    description: 'The unit of measure in hours, days, weeks, or months for the standard annual working duration.'
    lineage:
    - datalake_hr_system_raw.jobs.AnnualWorkingDurationUnits
  regular_temporary:
    description: 'Indicates whether a job is regular or temporary. Valid values are defined in the list RegularTemporaryLOV.'
    lineage:
    - datalake_hr_system_raw.jobs.RegularTemporary
  job_name:
    description: 'Name of the job.'
    lineage:
    - datalake_hr_system_raw.jobs.Name
  approval_authority:
    description: 'Number that identifies levels across jobs which are used for approvals if the job list builder is used.'
    lineage:
    - datalake_hr_system_raw.jobs.ApprovalAuthority
  scheduling_group:
    description: 'Scheduling Groups are specific functions by which customers would want to group jobs by so that they can be used in Workforce Scheduling.'
    lineage:
    - datalake_hr_system_raw.jobs.SchedulingGroup
  job_customer_flex:
    description: 'The JobCustomerFlex resource is a child of the jobs resource. It includes all job flexfields as of the specified date. By default, the current date is retained.'
    lineage:
    - datalake_hr_system_raw.jobs.JobCustomerFlex
  valid_grades:
    description: 'Valid grade levels associated with this job position'
    lineage:
    - datalake_hr_system_raw.jobs.validGrades
  is_medical_checkup_required:
    description: 'Indicates whether medical checkup is required for this job position'
    lineage:
    - datalake_hr_system_raw.jobs.MedicalCheckupRequired
  dt_effective_start:
    description: 'Date at the beginning of the date range within which the job is effective.'
    lineage:
    - datalake_hr_system_raw.jobs.EffectiveStartDate
  dt_effective_end:
    description: 'Date at the end of the date range within which the job is effective.'
    lineage:
    - datalake_hr_system_raw.jobs.EffectiveEndDate
  ts_created:
    description: 'Date and time the job was created.'
    lineage:
    - datalake_hr_system_raw.jobs.CreationDate
  ts_last_update:
    description: 'Date and time the job was updated.'
    lineage:
    - datalake_hr_system_raw.jobs.LastUpdateDate
  ts_load:
    description: 'Timestamp of the load of the worker record in the data lake'
    lineage:
    - datalake_hr_system_raw.workers.ts_load
