database_name: datalake_hr_system_clean
table_name: salaries
owner: isabella.araujo@quintoandar.com.br
domain: People
description: All salaries data for a worker's assignment
columns:
  id_salary:
    description: Unique identifier for a salary record generated by the application.
    lineage:
    - datalake_hr_system_raw.salaries.SalaryId
  id_assignment:
    description: Unique identifier for the assignment.
    lineage:
    - datalake_hr_system_raw.salaries.AssignmentId
  id_salary_basis:
    description: Unique identifier for the salary basis.
    lineage:
    - datalake_hr_system_raw.salaries.SalaryBasisId
  assignment_number:
    description: Assignment number for the given assignment.
    lineage:
    - datalake_hr_system_raw.salaries.AssignmentNumber
  id_action:
    description: Unique identifier of the action
    lineage:
    - datalake_hr_system_raw.salaries.ActionId
  id_action_reason:
    description: Unique identifier of the action reason.
    lineage:
    - datalake_hr_system_raw.salaries.ActionReasonId
  id_grade:
    description: Unique identifier for the assignment grade.
    lineage:
    - datalake_hr_system_raw.salaries.GradeId
  id_legislative_data_group:
    description: Unique identifier for the legislative data group.
    lineage:
    - datalake_hr_system_raw.salaries.LegislativeDataGroupId
  salary_frequency_code:
    description: Code of the salary basis frequency, such as ANNUAL, MONTHLY, HOURLY.
    lineage:
    - datalake_hr_system_raw.salaries.SalaryFrequencyCode
  salary_basis_type:
    description: Type of the salary basis, such as Salary amount determined by the user or Components.
    lineage:
    - datalake_hr_system_raw.salaries.SalaryBasisType
  currency_code:
    description: Currency code that the salary amount is stored in, such as USD.
    lineage:
    - datalake_hr_system_raw.salaries.CurrencyCode
  quartile:
    description: Quartile containing the worker's salary. The salary range for the worker's grade is divided into four equal parts called quartiles.
    lineage:
    - datalake_hr_system_raw.salaries.quartile
  quintile:
    description: Quintile containing the worker's salary. The salary range for the worker's grade is divided into five equal parts called quintiles.
    lineage:
    - datalake_hr_system_raw.salaries.quintile
  frequency_name:
    description: Frequency of the salary basis, such as Annually, Monthly, Weekly, or Hourly.
    lineage:
    - datalake_hr_system_raw.salaries.FrequencyName
  display_name:
    description: |-
      Unique name for the set of details linked to a worker's base pay. These details include the payroll characteristics used to pay base earnings, the duration of the quoted base pay, and the factor used to annualize base pay. The details also include any components used to connect base pay adjustments to different reasons and any associated grade rate for salary validation.
    lineage:
    - datalake_hr_system_raw.salaries.DisplayName
  action_code:
    description: Code of the action that changed the salary
    lineage:
    - datalake_hr_system_raw.salaries.ActionCode
  action_reason_code:
    description: Code of the action reason.
    lineage:
    - datalake_hr_system_raw.salaries.ActionReasonCode
  action_reason:
    description: Reason for the action being done on the record. Valid values are defined in the actionReasonsLOV.
    lineage:
    - datalake_hr_system_raw.salaries.ActionReason
  action_name:
    description: Action being done on this assignment, such as, Hire, Add Pending Worker, Manager Change and so on. Valid values are defined in the actionsLOV.
    lineage:
    - datalake_hr_system_raw.salaries.ActionName
  salary_basis_code:
    description: Code for the salary basis.
    lineage:
    - datalake_hr_system_raw.salaries.code
  legal_employer_name:
    description: Legal employer for the person's assignment.
    lineage:
    - datalake_hr_system_raw.salaries.LegalEmployerName
  grade_ladder_name:
    description: Name of the grade ladder associated with the person's assignment.
    lineage:
    - datalake_hr_system_raw.salaries.GradeLadderName
  grade_name:
    description: Name of the step associated with the person's assignment.
    lineage:
    - datalake_hr_system_raw.salaries.GradeName
  grade_step_name:
    description: Name of the grade associated with the person's assignment.
    lineage:
    - datalake_hr_system_raw.salaries.GradeStepName
  geography_name:
    description: Geographical zone used in compensation to calculate salary ranges.
    lineage:
    - datalake_hr_system_raw.salaries.GeographyName
  geography_type_name:
    description: Geographical zone type used in compensation to calculate salary ranges.
    lineage:
    - datalake_hr_system_raw.salaries.GeographyTypeName
  last_update_by:
    description: Identifies the user who most recently updated the row.
    lineage:
    - datalake_hr_system_raw.salaries.LastUpdatedBy
  created_by:
    description: User identifier who created the salary record
    lineage:
    - datalake_hr_system_raw.salaries.CreatedBy
  assignment_type:
    description: Type of assignment, such as an employee, contingent worker, nonworker, or pending worker.
    lineage:
    - datalake_hr_system_raw.salaries.AssignmentType
  salary_basis_name:
    description: Name of the salary basis.
    lineage:
    - datalake_hr_system_raw.salaries.SalaryBasisName
  amount_rounding_code:
    description: Code for the salary amount rounding rule.
    lineage:
    - datalake_hr_system_raw.salaries.AmountRoundingCode
  annaul_rounding_code:
    description: Code for the annualized salary amount rounding rule.
    lineage:
    - datalake_hr_system_raw.salaries.AnnualRoundingCode
  range_rounding_code:
    description: Code for the salary range rounding rule.
    lineage:
    - datalake_hr_system_raw.salaries.RangeRoundingCode
  work_at_home:
    description: Indicates whether the worker is working from home or not.
    lineage:
    - datalake_hr_system_raw.salaries.WorkAtHome
  quartile_meaning:
    description: Lookup code meaning of the quartile containing the worker's salary.
    lineage:
    - datalake_hr_system_raw.salaries.QuartileMeaning
  quintile_meaning:
    description: Lookup code meaning of the quintile containing the worker's salary.
    lineage:
    - datalake_hr_system_raw.salaries.QuintileMeaning
  component_usage:
    description: Property used to specify whether the incremental components type is SELECTED_COMPONENTS or USER_DECIDES_USAGE.
    lineage:
    - datalake_hr_system_raw.salaries.ComponentUsage
  pending_transaction_exists:
    description: Indicates if a salary change for the person assignment is pending approval.
    lineage:
    - datalake_hr_system_raw.salaries.PendingTransactionExists
  range_error_warning:
    description: Indicates the salary range violation behavior for the salary basis, such as error, warning, or none.
    lineage:
    - datalake_hr_system_raw.salaries.RangeErrorWarning
  payroll_factor:
    description: Payroll multiplier used to convert the salary amount to an annual salary amount, when the frequency is chosen as payroll period.
    lineage:
    - datalake_hr_system_raw.salaries.PayrollFactor
  salary_factor:
    description: Multiplier that converts the salary amount to an annual salary amount. For example, if a worker's base pay is quoted hourly, the annualization factor is 2080 (40 hours per week x 52 weeks).
    lineage:
    - datalake_hr_system_raw.salaries.SalaryFactor
  payroll_frequency_code:
    description: Code for the payroll frequency when the frequency is chosen as payroll period.
    lineage:
    - datalake_hr_system_raw.salaries.PayrollFrequencyCode
  salary_components:
    description: The salaryComponents resource is the child of the salaries resource and includes all the components that itemize salary adjustments for a given salary record, such as Adjustment, Location, and Merit.
    lineage:
    - datalake_hr_system_raw.salaries.salaryComponents
  salary_pay_rate_components:
    description: The salaryRateComponents resource is the child of the salaries resource and includes all of the rate components for a given salary record.
    lineage:
    - datalake_hr_system_raw.salaries.salaryPayRateComponents
  salary_simple_components:
    description: |-
      The salarySimpleComponents resource is the child of the salaries resource and includes all of the simple components for a given salary record, such as Base Salary, Location Allowance, and Special Allowance.
    lineage:
    - datalake_hr_system_raw.salaries.salarySimpleComponents
  salary_amount:
    description: Salary amount on the salary record for the worker assignment.
    lineage:
    - datalake_hr_system_raw.salaries.SalaryAmount
  adjustment_amount:
    description: Calculated adjustment amount based on the previous salary.
    lineage:
    - datalake_hr_system_raw.salaries.AdjustmentAmount
  adjustment_percentage:
    description: Calculated adjustment percentage based on the previous salary .
    lineage:
    - datalake_hr_system_raw.salaries.AdjustmentPercentage
  annual_salary:
    description: Annual value of the worker's salary.
    lineage:
    - datalake_hr_system_raw.salaries.AnnualSalary
  annual_full_time_salary:
    description: Annual value of the worker's salary, if working full time.
    lineage:
    - datalake_hr_system_raw.salaries.AnnualFullTimeSalary
  compa_ratio:
    description: Salary as a percentage of the grade range midpoint. Salary at the midpoint is 100.
    lineage:
    - datalake_hr_system_raw.salaries.CompaRatio
  range_position:
    description: Position of the worker's salary within the assignment grade salary range, expressed as a percentage of 100.
    lineage:
    - datalake_hr_system_raw.salaries.RangePosition
  salary_range_minimum:
    description: Salary range minimum based on the worker assignment grade.
    lineage:
    - datalake_hr_system_raw.salaries.SalaryRangeMinimum
  salary_range_mid_point:
    description: Salary range midpoint based on the worker assignment grade.
    lineage:
    - datalake_hr_system_raw.salaries.SalaryRangeMidPoint
  salary_range_maximum:
    description: Salary range maximum based on the worker assignment grade.
    lineage:
    - datalake_hr_system_raw.salaries.SalaryRangeMaximum
  fte_value:
    description: Factor that represents the proportion of full-time hours a person works.
    lineage:
    - datalake_hr_system_raw.salaries.FTEValue
  amount_decimal_precision:
    description: Decimal precision of the salary amount, configured in salary basis.
    lineage:
    - datalake_hr_system_raw.salaries.AmountDecimalPrecision
  salary_amount_scale:
    description: Decimal precision of the salary amount, configured in salary basis.
    lineage:
    - datalake_hr_system_raw.salaries.SalaryAmountScale
  has_future_salary:
    description: Indicates whether a future salary exists.
    lineage:
    - datalake_hr_system_raw.salaries.hasFutureSalary
  has_multiple_components:
    description: Indicates whether the given salary record has any child records that are either Components, Simple Components, or Rates.
    lineage:
    - datalake_hr_system_raw.salaries.MultipleComponents
  dt_from:
    description: Start date of the salary.
    lineage:
    - datalake_hr_system_raw.salaries.DateFrom
  dt_to:
    description: End date of the salary.
    lineage:
    - datalake_hr_system_raw.salaries.DateTo
  dt_search:
    description: Date used to find the applicable salary for the day.
    lineage:
    - datalake_hr_system_raw.salaries.SearchDate
  dt_next_salary_review:
    description: Date to review a person's assignment salary.
    lineage:
    - datalake_hr_system_raw.salaries.NextSalReviewDate
  ts_created:
    description: Identifies the date and time that the row was created.
    lineage:
    - datalake_hr_system_raw.salaries.CreationDate
  ts_last_update:
    description: Identifies the date and time that the row was most recently updated.
    lineage:
    - datalake_hr_system_raw.salaries.LastUpdateDate
  ts_load:
    description: Timestamp of the load of the salary record in the data lake
    lineage:
    - datalake_hr_system_raw.salaries.ts_load
