---
database_name: datalake_hr_system_clean
table_name: personal_payment_methods
description: The personalPaymentMethods resource includes a list of all personal payment methods for a given payroll relationship.
domain: People
owner: matheus.ferreira@quintoandar.com.br
columns:
  id_bank_account:
    lineage:
      - datalake_hr_system_raw.personal_payment_methods.bankaccountid
    description: Unique identifier of the bank account associated with the personal payment method.
  id_party:
    lineage:
      - datalake_hr_system_raw.personal_payment_methods.partyid
    description: Unique identifier used to capture the payment details for the person, such as bank account information. The party is an entity of the trading community model.
  id_org_payment_method:
    lineage:
      - datalake_hr_system_raw.personal_payment_methods.orgpaymentmethodid
    description: Unique identifier of the organization payment method associated with the personal payment method.
  id_payroll_relationship:
    lineage:
      - datalake_hr_system_raw.personal_payment_methods.payrollrelationshipid
    description: Payroll relationship associated with this personal payment method.
  id_personal_payment_method:
    lineage:
      - datalake_hr_system_raw.personal_payment_methods.personalpaymentmethodid
    description: System-generated unique identifier for the personal payment method.
  person_number:
    lineage:
      - datalake_hr_system_raw.personal_payment_methods.personnumber
    description: Person number associated with this personal payment method.
  name:
    lineage:
      - datalake_hr_system_raw.personal_payment_methods.name
    description: Name of the personal payment method.
  payment_amount_type:
    lineage:
      - datalake_hr_system_raw.personal_payment_methods.paymentamounttype
    description: Payment type associated with the personal payment method, such as check.
  amount:
    lineage:
      - datalake_hr_system_raw.personal_payment_methods.amount
    description: Amount to be paid using this payment method, such as $200 per payroll period.
  percentage:
    lineage:
      - datalake_hr_system_raw.personal_payment_methods.percentage
    description: Percentage value to be paid using this payment method, such as 5%.
  priority:
    lineage:
      - datalake_hr_system_raw.personal_payment_methods.priority
    description: Order in which the personal payment methods are processed. The personal payment method with priority 1 is processed first.
  dt_effective_start:
    lineage:
      - datalake_hr_system_raw.personal_payment_methods.effectivestartdate
    description: Date at the beginning of the date range within which the personal payment method is effective.
  dt_effective_end:
    lineage:
      - datalake_hr_system_raw.personal_payment_methods.effectiveenddate
    description: Date at the end of the date range within which the personal payment method is effective.
  ts_load:
    lineage:
      - datalake_hr_system_raw.personal_payment_methods.ts_load
    description: Timestamp of the load of the record in the data lake.