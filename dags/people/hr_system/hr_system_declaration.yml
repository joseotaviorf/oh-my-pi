dag:
  name: hr_system
  schedule_interval: 0 3 * * *
  owner: Data People
  dag_documentation:
    dag_purpose: |
      Retrieve data from Oracle HR System API, a sub product of Oracle Human Capital Resources (Oracle HCM).
      HCM is a cloud-based software application suite for human resources, talent management, and customer experience.
cluster:
  type: databricks_13_3_med_people_cluster
  access_control_list:
    group_name: people-analytics
    permission_level: CAN_MANAGE
  custom_libraries:
    - whl: "{artifacts_bucket}/hr-system-api-client-python/quintoandar_hr_system_api_client-0.1.2-py2.py3-none-any.whl"
workflow:
  layer: raw
  type: custom_ingestion
  bucket_config_name: people_bucket
  has_hive_sync: false
  load_spark_job: load_hr_system_raw
  spark_job_arguments:
    - "{environment}"
    - "{bucket}"
    - "{dag_name}"
    - "{table_name}"
    - "{{ ds }}"
    - "{partitions}"
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, ds, 'load_end_date') }}"
  tables_customization:
    absences:
      extraction_type: full
      partitions: ["year", "month", "day"]
      extra_spark_job_arguments:
        - deduplication_key: "absenceCaseId"
          has_partitions: true
          column_to_partition: "CreationDate"
          has_columns_to_delete: true
          columns_to_delete:
            - "objectVersionNumber"
          params:
            onlyData: true
            orderBy: "absenceCaseId:asc"
            limit: 100
            expand:
              - "absenceAttachments"
              - "absenceEntitlements"
              - "absenceMaternity"
              - "absenceRecordingDFF"
              - "absenceRecordingsDDF"
    actions_lov:
      extraction_type: full
      extra_spark_job_arguments:
        - deduplication_key: "ActionId"
          has_partitions: false
          has_columns_to_delete: false
          params:
            onlyData: true
            orderBy: "ActionId:asc"
            limit: 100
    action_reasons_lov:
      extraction_type: full
      extra_spark_job_arguments:
        - deduplication_key: "ActionReasonId"
          has_partitions: false
          has_columns_to_delete: false
          params:
            onlyData: true
            orderBy: "ActionReasonId:asc"
            limit: 100
    areas_of_responsibility:
      extraction_type: full
      extra_spark_job_arguments:
        - has_partitions: false
          has_columns_to_delete: false
          params:
            onlyData: true
            orderBy: "ResponsibilityId:asc"
            limit: 100
    benefit_enrollments:
      extraction_type: full
      partitions: ["year", "month", "day"]
      extra_spark_job_arguments:
        - deduplication_key: "EnrollmentResultId"
          has_partitions: true
          column_to_partition: "CreationDate"
          has_columns_to_delete: false
          params:
            onlyData: true
            orderBy: "EnrollmentResultId:asc"
            limit: 100
            expand:
              - "costs"
              - "providers"
              - "dependents"
    departments_lov:
      extraction_type: full
      extra_spark_job_arguments:
        - has_partitions: false
          has_columns_to_delete: false
          params:
            onlyData: true
            limit: 100
    hcm_contacts:
      extraction_type: full
      partitions: ["year", "month", "day"]
      extra_spark_job_arguments:
        - deduplication_key: "PersonId"
          has_partitions: true
          column_to_partition: "CreationDate"
          has_columns_to_delete: false
          params:
            orderBy: "PersonId:asc"
            onlyData: true
            limit: 100
            expand:
              - "addresses.addressesDFF"
              - "citizenships"
              - "contactRelationships.contactRelationshipsDDF"
              - "contactRelationships.contactRelationshipsDFF"
              - "contactsDFF"
              - "driverLicenses"
              - "emails.emailsDFF"
              - "ethnicities"
              - "legislativeInfo.legislativeInfoDDF"
              - "legislativeInfo.legislativeInfoDFF"
              - "names"
              - "nationalIdentifiers.nationalIdentifiersDFF"
              - "otherCommunicationAccounts"
              - "passports"
              - "phones.phonesDFF"
              - "religions"
              - "visasPermits"
    jobs:
      extraction_type: full
      partitions: ["year", "month", "day"]
      extra_spark_job_arguments:
        - deduplication_key: "JobId"
          has_partitions: true
          column_to_partition: "CreationDate"
          has_columns_to_delete: false
          params:
            onlyData: true
            orderBy: "JobId:asc"
            limit: 100
            expand:
              - "JobCustomerFlex"
              - "validGrades"
    organizations:
      extraction_type: full
      partitions: ["year", "month", "day"]
      extra_spark_job_arguments:
        - deduplication_key: "OrganizationId"
          has_partitions: true
          column_to_partition: "CreationDate"
          has_columns_to_delete: false
          params:
            onlyData: true
            orderBy: "OrganizationId:asc"
            limit: 100
            expand:
              - "OrganizationDFF"
              - "extraInformation"
    payroll_relationships:
      extraction_type: full
      extra_spark_job_arguments:
        - deduplication_key: "PayrollRelationshipId"
          has_partitions: false
          has_columns_to_delete: false
          params:
            onlyData: true
            orderBy: "PayrollRelationshipId:asc"
            limit: 100
            expand:
              - "PayRelationshipsDDF"
              - "payrollAssignments.PayrollRelationshipGroupsDDF"
              - "payrollAssignments.assignedPayrolls"
              - "payrollAssignments.payrollAssignmentDates"
              - "payrollRelationshipDates"
    performance_evaluations:
      extraction_type: full
      extra_spark_job_arguments:
        - deduplication_key: "EvaluationId"
          has_partitions: false
          has_columns_to_delete: false
          params:
            onlyData: true
            orderBy: "EvaluationId:asc"
            limit: 100
            expand:
              - "Roles.Participants.Tasks"
    performance_goals:
      extraction_type: full
      extra_spark_job_arguments:
        - deduplication_key: "GoalId"
          has_partitions: false
          has_columns_to_delete: false
          params:
            onlyData: true
            orderBy: "GoalId:asc"
            limit: 100
            expand:
              - "associatedGoalPlans"
    personal_payment_methods:
      extraction_type: full
      extra_spark_job_arguments:
        - deduplication_key: "PersonalPaymentMethodId"
          has_partitions: false
          has_columns_to_delete: false
          params:
            onlyData: true
            orderBy: "PersonalPaymentMethodId:asc"
            limit: 100
    salaries:
      extraction_type: full
      extra_spark_job_arguments:
        - deduplication_key: "SalaryId"
          has_partitions: true
          column_to_partition: "CreationDate"
          has_columns_to_delete: false
          params:
            onlyData: true
            orderBy: "SalaryId:asc"
            limit: 100
            expand:
              - "salaryComponents"
              - "salaryPayRateComponents"
              - "salarySimpleComponents"
    talent_person_profiles:
      extraction_type: full
      partitions: ["year", "month", "day"]
      extra_spark_job_arguments:
        - deduplication_key: "ProfileId"
          has_partitions: true
          column_to_partition: "CreationDate"
          has_columns_to_delete: false
          params:
            onlyData: true
            orderBy: "ProfileId:asc"
            limit: 100
            expand:
              - "accomplishmentSections"
              - "areaOfStudySections"
              - "areasOfExpertise"
              - "areasOfInterest"
              - "attachments"
              - "careerPreferenceSections"
              - "careersOfInterest"
              - "certificationSections"
              - "competencySections.competencyItems"
              - "educationLvlSections"
              - "educationSections"
              - "favoriteLinks"
              - "highestEducationLvlSections"
              - "honorSections"
              - "languageSections"
              - "membershipSections"
              - "publicSkills"
              - "skillSections"
              - "specialProjectSections"
              - "tags"
              - "technicalPostDetailsSections"
              - "workHistorySections"
              - "workPreferenceSections"
    talent_ratings:
      extraction_type: full
      extra_spark_job_arguments:
        - has_partitions: false
          has_columns_to_delete: false
          params:
            onlyData: true
            limit: 100
            expand:
              - "nBoxCellAssignments"
              - "performanceRatings.performanceRatingsDFF"
              - "userDefinedRatingSections"
    workers:
      extraction_type: full
      partitions: ["dt_effective", "year", "month", "day"]
      extra_spark_job_arguments:
        - deduplication_key: "PersonId"
          has_partitions: true
          column_to_partition: "CreationDate"
          has_columns_to_delete: false
          has_dt_effective: true
          future_offset: 30
          past_offset: 35
          params:
            onlyData: true
            limit: 100
            orderBy: "PersonId:asc"
            expand:
              - "addresses.addressesDFF"
              - "citizenships"
              - "disabilities"
              - "driverLicenses.driverLicensesDDF"
              - "driverLicenses.driverLicensesDFF"
              - "emails.emailsDFF"
              - "ethnicities.ethnicitiesDFF"
              - "externalIdentifiers"
              - "legislativeInfo.legislativeInfoDDF"
              - "legislativeInfo.legislativeInfoDFF"
              - "messages"
              - "names"
              - "nationalIdentifiers.nationalIdentifiersDFF"
              - "otherCommunicationAccounts"
              - "passports"
              - "phones.phonesDFF"
              - "photos"
              - "religions"
              - "visasPermits"
              - "workRelationships.assignments.allReports"
              - "workRelationships.assignments.assignmentsDDF"
              - "workRelationships.assignments.assignmentsDFF"
              - "workRelationships.assignments.assignmentsEFF"
              - "workRelationships.assignments.gradeSteps"
              - "workRelationships.assignments.managers"
              - "workRelationships.assignments.representatives"
              - "workRelationships.assignments.workMeasures"
              - "workRelationships.contracts"
              - "workRelationships.workRelationshipsDDF"
              - "workRelationships.workRelationshipsDFF"
              - "workersDFF"
              - "workersEFF"
