dag:
  name: hr_system
  schedule_interval: 0 3 * * *
  owner: Data People
  callback_by_task: False
  dag_documentation:
    dag_purpose: |
      Retrieve data from Oracle HR System API, a sub product of Oracle Human Capital Resources (Oracle HCM).
      HCM is a cloud-based software application suite for human resources, talent management, and customer experience.
workflow:
  layer: raw
  type: custom_ingestion
  bucket_config_name: people_bucket
  has_hive_sync: true
  load_spark_job: load_hr_system_raw
  default_extraction_type: full
  spark_job_arguments:
    - "{environment}"
    - "{bucket}"
    - "{dag_name}"
    - "{table_name}"
    - "{{ data_interval_start | ds }}"
    - "{partitions}"
    - "{extraction_type}"
    - "{load_start_date}"
    - "{load_end_date}"
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  tables_customization:
    actions_lov:
      extra_spark_job_arguments:
        - deduplication_key: "ActionId"
          params:
            onlyData: true
            orderBy: "ActionId:asc"
            limit: 100
    areas_of_responsibility:
      extra_spark_job_arguments:
        - params:
            onlyData: true
            orderBy: "ResponsibilityId:asc"
            limit: 100
    job_families:
      extra_spark_job_arguments:
        - params:
            onlyData: true
            orderBy: "JobFamilyId:asc"
            limit: 100
            expand:
              - "JobFamilyDFF"
    jobs:
      extra_spark_job_arguments:
        - deduplication_key: "JobId"
          has_dt_effective: true
          params:
            onlyData: true
            orderBy: "JobId:asc"
            limit: 100
            expand:
              - "JobCustomerFlex"
              - "validGrades"
    organizations:
      extra_spark_job_arguments:
        - deduplication_key: "OrganizationId"
          has_dt_effective: true
          params:
            onlyData: true
            orderBy: "OrganizationId:asc"
            limit: 100
            expand:
              - "OrganizationDFF"
              - "extraInformation"
    salaries:
      extraction_type: full
      extra_spark_job_arguments:
        - deduplication_key: "SalaryId"
          params:
            onlyData: true
            orderBy: "SalaryId:asc"
            limit: 100
            expand:
              - "salaryComponents"
              - "salaryPayRateComponents"
              - "salarySimpleComponents"
    workers:
      extra_spark_job_arguments:
        - deduplication_key: "PersonId"
          has_dt_effective: true
          min_expected_records: 9000
          params:
            onlyData: true
            limit: 100
            orderBy: "PersonId:asc"
            expand:
              - "addresses.addressesDFF"
              - "disabilities"
              - "emails.emailsDFF"
              - "ethnicities.ethnicitiesDFF"
              - "externalIdentifiers"
              - "legislativeInfo.legislativeInfoDDF"
              - "legislativeInfo.legislativeInfoDFF"
              - "nationalIdentifiers.nationalIdentifiersDFF"
              - "phones.phonesDFF"
              - "religions"
              - "workRelationships.assignments"
  default_table_privileges:
    people-team:
      - ALL PRIVILEGES
