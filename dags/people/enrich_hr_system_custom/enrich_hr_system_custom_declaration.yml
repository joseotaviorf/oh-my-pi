dag:
  name: enrich_hr_system_custom
  schedule_start_date: 2024, 6, 24
  owner: Data People
  callback_by_task: False
  documentation:
    dag_purpose: Enrich HR System data - only for tables with pySpark dependencies.
workflow:
  type: query_delta
  layer: enrich
  default_extraction_type: full
  load_spark_job: load_management_hierarchy_enrich
  custom_schema: hr_system
  spark_job_arguments:
  - "{environment}"
  - "{bucket}"
  - "hr_system"   # its equal source
  - "management_hierarchy"   #its equal context
  - "{{ data_interval_start | ds }}"   # execution date
  tables_customization:
    management_hierarchy: {}
  has_hive_sync: true
  bucket_config_name: people_bucket
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
  default_table_privileges:
    people-team:
    - ALL PRIVILEGES
