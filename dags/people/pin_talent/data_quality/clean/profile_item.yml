---
table_name: datalake_pin_talent_clean.profile_item
alert_channel: PEOPLE_ALERTS
table_level_validations:
  has_size:
    greater_than: 1
    severity_level: Error
column_level_validations:
  id_profile_item:
    is_complete:
      severity_level: Warning
    custom:
      # id_profile_item + object_version_number should be unique
      constraint: "(SELECT COUNT(*) FROM (SELECT 1 FROM datalake_pin_talent_clean.profile_item GROUP BY id_profile_item, object_version_number HAVING COUNT(*) > 1)) = 0"
      severity_level: Warning
