---
table_name: datalake_pin_talent_clean.pool_member
alert_channel: PEOPLE_ALERTS
table_level_validations:
  has_size:
    greater_than: 1
    severity_level: Error
column_level_validations:
  id_pool_member:
    is_complete:
      severity_level: Warning
    custom:
      # id_pool_member + object_version_number should be unique
      constraint: "(SELECT COUNT(*) FROM (SELECT 1 FROM datalake_pin_talent_clean.pool_member GROUP BY id_pool_member, object_version_number HAVING COUNT(*) > 1)) = 0"
      severity_level: Warning
