---
table_name: datalake_pin_talent_clean.review_period_base
alert_channel: PEOPLE_ALERTS
table_level_validations:
  has_size:
    greater_than: 1
    severity_level: Error
column_level_validations:
  id_review_period:
    is_complete:
      severity_level: Warning
  one_row_per_review_period_and_object_version:
    custom:
      # id_review_period + object_version_number should be unique
      constraint: "(SELECT COUNT(*) FROM (SELECT 1 FROM datalake_pin_talent_clean.review_period_base GROUP BY id_review_period, object_version_number HAVING COUNT(*) > 1)) = 0"
      severity_level: Warning
