---
database_name: datalake_pin_talent_clean
table_name: content_item_translation
owner: isabella.araujo@quintoandar.com.br
domain: people
description: Stores translated names and descriptions for content items used within the People (HR/Talent) domain.
columns:
  id_content_item:
    description: Unique identifier for the content item being translated. Part of this table's composite primary key.
    lineage:
    - datalake_pin_talent_raw.hrt_content_items_tl.content_item_id
  id_business_group:
    description: Identifier for the business group (enterprise) to which this content item translation applies; part of the composite primary key. Foreign key to HR organization units.
    lineage:
    - datalake_pin_talent_raw.hrt_content_items_tl.business_group_id
  language:
    description: Language code specifying the language of the translated 'name' and 'item_description' fields in this record; part of the composite primary key.
    lineage:
    - datalake_pin_talent_raw.hrt_content_items_tl.language
  source_language:
    description: Language code of the original source language from which the 'name' and 'item_description' fields were translated.
    lineage:
    - datalake_pin_talent_raw.hrt_content_items_tl.source_lang
  name:
    description: Translated name or title of the content item in the language specified by the 'language' code.
    lineage:
    - datalake_pin_talent_raw.hrt_content_items_tl.name
  item_description:
    description: Translated descriptive text for the content item in the language specified by the 'language' code.
    lineage:
    - datalake_pin_talent_raw.hrt_content_items_tl.item_description
  created_by:
    description: Identifier of the user who created the original source record for this translation.
    lineage:
    - datalake_pin_talent_raw.hrt_content_items_tl.created_by
  last_updated_by:
    description: Identifier of the user who last updated the original source record for this translation.
    lineage:
    - datalake_pin_talent_raw.hrt_content_items_tl.last_updated_by
  object_version_number:
    description: Version number for the source record, used for optimistic locking. Incremented with each update to the source to ensure data integrity.
    lineage:
    - datalake_pin_talent_raw.hrt_content_items_tl.CAST(object_version_number AS INT)
  ts_created:
    description: Timestamp indicating the creation date and time of the original source record for this translation.
    lineage:
    - datalake_pin_talent_raw.hrt_content_items_tl.TO_TIMESTAMP(creation_date)
  ts_ended:
    description: Timestamp indicating the last modification date and time of this translated content item in the source system.
    lineage:
    - datalake_pin_talent_raw.hrt_content_items_tl.TO_TIMESTAMP(last_update_date)
  ts_load:
    description: Timestamp marking when this record was loaded into the table.
  year:
    description: Year extracted from the 'ts_updated' column.
    lineage:
    - datalake_pin_talent_raw.hrt_content_items_tl.year
  month:
    description: Month extracted from the 'ts_updated' column.
    lineage:
    - datalake_pin_talent_raw.hrt_content_items_tl.month
  day:
    description: Day extracted from the 'ts_updated' column.
    lineage:
    - datalake_pin_talent_raw.hrt_content_items_tl.day