dag:
  name: pin_talent
  schedule_interval: 30 3 * * *
  owner: Data People
  callback_by_task: False
  dag_documentation:
    dag_purpose: |
      This DAG ingests encrypted data from the Oracle HCM system, made available via an SFTP server through Oracle Integration Cloud (OIC).
      It downloads, decrypts, parses, and loads the files into both the `incoming` and `raw` layers of the Data Lake.
workflow:
  layer: raw
  type: custom_ingestion
  bucket_config_name: people_bucket
  has_hive_sync: false
  load_spark_job: load_pin_talent_raw
  default_extraction_type: full
  spark_job_arguments:
    - "{environment}"
    - "{bucket}"
    - "{dag_name}"
    - "{table_name}"
    - "{{ data_interval_start | ds }}"
    - "{partitions}"
    - "{extraction_type}"
    - "{load_start_date}"
    - "{load_end_date}"
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, 1), 'load_end_date') }}"
  default_table_privileges:
    people-team:
      - ALL PRIVILEGES
  tables_customization:
    hrt_notes:
      clean_table_name: note
      vacuum_retention_hours: 168
      vacuum_lite: true
      extra_spark_job_arguments:
        - raw_custom_schema: pin_talent
          date_column_to_partition: last_update_date
    hrt_profiles_b:
      clean_table_name: profile_base
      vacuum_retention_hours: 168
      vacuum_lite: true
      extra_spark_job_arguments:
        - raw_custom_schema: pin_talent
          date_column_to_partition: last_update_date
    hrt_rating_levels_b:
      clean_table_name: rating_level_base
      vacuum_retention_hours: 168
      vacuum_lite: true
      extra_spark_job_arguments:
        - raw_custom_schema: pin_talent
          date_column_to_partition: last_update_date
    hrt_rating_levels_tl:
      clean_table_name: rating_level_translation
      vacuum_retention_hours: 168
      vacuum_lite: true
      extra_spark_job_arguments:
        - raw_custom_schema: pin_talent
          date_column_to_partition: last_update_date
    hrt_rating_models_b:
      clean_table_name: rating_model_base
      vacuum_retention_hours: 168
      vacuum_lite: true
      extra_spark_job_arguments:
        - raw_custom_schema: pin_talent
          date_column_to_partition: last_update_date
    hrt_rating_models_tl:
      clean_table_name: rating_model_translation
      vacuum_retention_hours: 168
      vacuum_lite: true
      extra_spark_job_arguments:
        - raw_custom_schema: pin_talent
          date_column_to_partition: last_update_date
    hrt_review_periods_b:
      clean_table_name: review_period_base
      vacuum_retention_hours: 168
      vacuum_lite: true
      extra_spark_job_arguments:
        - raw_custom_schema: pin_talent
          date_column_to_partition: last_update_date
    hrt_review_periods_tl:
      clean_table_name: review_period_translation
      vacuum_retention_hours: 168
      vacuum_lite: true
      extra_spark_job_arguments:
        - raw_custom_schema: pin_talent
          date_column_to_partition: last_update_date
