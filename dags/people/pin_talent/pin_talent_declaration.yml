dag:
  name: pin_talent
  schedule_interval: 0 3 * * *
  owner: Data People
  dag_documentation:
    dag_purpose: |
      This DAG ingests encrypted data from the Oracle HCM system, made available via an SFTP server through Oracle Integration Cloud (OIC).
      It downloads, decrypts, parses, and loads the files into both the `incoming` and `raw` layers of the Data Lake.
cluster:
  type: databricks_13_3_med_memory_people_cluster
  access_control_list:
    group_name: people-analytics
    permission_level: CAN_MANAGE
  custom_libraries:
    - pypi:
        package: paramiko==2.12.0
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
workflow:
  layer: raw
  type: custom_ingestion
  default_partitions: ["year", "month", "day"]
  bucket_config_name: people_bucket
  has_hive_sync: false
  load_spark_job: load_pin_talent_raw
  default_extraction_type: full
  spark_job_arguments:
    - "{environment}"
    - "{bucket}"
    - "{dag_name}"
    - "{table_name}"
    - "{{ ds }}"
    - "{partitions}"
    - "{extraction_type}"
    - "{load_start_date}"
    - "{load_end_date}"
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, ds, load_start_date) }}"
    load_end_date: "{{ get_date_param(dag_run, tomorrow_ds, load_end_date) }}"
  default_table_privileges:
    people-team:
      - ALL PRIVILEGES
  tables_customization:
    hrt_profile_items:
      clean_table_name: profile_item
      extra_spark_job_arguments:
        - raw_custom_schema: pin_talent
          date_column_to_partition: last_update_date
    hrt_profile_sections_b:
      clean_table_name: profile_section_base
      extra_spark_job_arguments:
        - raw_custom_schema: pin_talent
          date_column_to_partition: last_update_date
    hrt_profile_typ_sections_tl:
      clean_table_name: profile_type_sections_translation
      extra_spark_job_arguments:
        - raw_custom_schema: pin_talent
          date_column_to_partition: last_update_date
    hrt_profiles_b:
      clean_table_name: profile_base
      extra_spark_job_arguments:
        - raw_custom_schema: pin_talent
          date_column_to_partition: last_update_date
    hrt_rating_levels_b:
      clean_table_name: rating_level_base
      extra_spark_job_arguments:
        - raw_custom_schema: pin_talent
          date_column_to_partition: last_update_date
    hrt_rating_levels_tl:
      clean_table_name: rating_level_translation
      extra_spark_job_arguments:
        - raw_custom_schema: pin_talent
          date_column_to_partition: last_update_date
    hrt_rating_models_b:
      clean_table_name: rating_model_base
      extra_spark_job_arguments:
        - raw_custom_schema: pin_talent
          date_column_to_partition: last_update_date
    hrt_rating_models_tl:
      clean_table_name: rating_model_translation
      extra_spark_job_arguments:
        - raw_custom_schema: pin_talent
          date_column_to_partition: last_update_date
    hrt_review_periods_b:
      clean_table_name: review_period_base
      extra_spark_job_arguments:
        - raw_custom_schema: pin_talent
          date_column_to_partition: last_update_date
    hrt_review_periods_tl:
      clean_table_name: review_period_translation
      extra_spark_job_arguments:
        - raw_custom_schema: pin_talent
          date_column_to_partition: last_update_date
    hrt_pool_members:
      clean_table_name: pool_member
      extra_spark_job_arguments:
        - raw_custom_schema: pin_talent
          date_column_to_partition: last_update_date
