---
table_name: datalake_pin_benefits_clean.person_electable_benefit_choices
alert_channel: PEOPLE_ALERTS
table_level_validations:
  has_size:
    greater_than: 1
    severity_level: Error
column_level_validations:
  id_eligible_person_electable_choice:
    is_complete:
      severity_level: Warning
    custom:
      # id_eligible_person_electable_choice + object_version_number should be unique
      constraint: "(SELECT COUNT(*) FROM (SELECT 1 FROM datalake_pin_benefits_clean.person_electable_benefit_choices GROUP BY id_eligible_person_electable_choice, object_version_number HAVING COUNT(*) > 1)) = 0"
      severity_level: Warning
