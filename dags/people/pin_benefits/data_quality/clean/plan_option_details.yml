---
table_name: datalake_pin_benefits_clean.plan_option_details
alert_channel: PEOPLE_ALERTS
table_level_validations:
  has_size:
    greater_than: 1
    severity_level: Error
column_level_validations:
  id_option_in_plan:
    is_complete:
      severity_level: Warning
    custom:
      # id_option_in_plan + object_version_number should be unique
      constraint: "(SELECT COUNT(*) FROM (SELECT 1 FROM datalake_pin_benefits_clean.plan_option_details GROUP BY id_option_in_plan, object_version_number HAVING COUNT(*) > 1)) = 0"
      severity_level: Warning
