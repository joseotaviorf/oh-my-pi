database_name: datalake_pin_benefits_clean
table_name: eligible_dependent_status
owner: isabella.araujo@quintoandar.com.br
domain: People
description: |-
  This table captures the eligibility status of a participant's contacts who have been designated as personal relationships. This information is dynamically updated whenever an electable choice is made for a person or when the dependent eligibility determination process is executed.
columns:
  id_eligible_dependent:
    description: The unique system-generated primary key for the eligible dependent status record.
    lineage:
    - datalake_pin_benefits_raw.ben_elig_dpnt.elig_dpnt_id
  id_business_group:
    description: A foreign key referencing the business group to which this dependent's eligibility status belongs.
    lineage:
    - datalake_pin_benefits_raw.ben_elig_dpnt.business_group_id
  id_eligible_per_electable_choice:
    description: A foreign key linking to the `BEN_ELIG_PER_ELECTBL_CHC` table, representing the electable choice made by the eligible person that influences this dependent's status.
    lineage:
    - datalake_pin_benefits_raw.ben_elig_dpnt.elig_per_elctbl_chc_id
  id_period_in_life_event_reason:
    description: A foreign key referencing the `BEN_PER_IN_LER` table, indicating the period within a life event reason that affects the dependent's eligibility.
    lineage:
    - datalake_pin_benefits_raw.ben_elig_dpnt.per_in_ler_id
  id_eligible_person:
    description: A foreign key linking to the `BEN_ELIG_PER_F` table, identifying the eligible person associated with this dependent's status.
    lineage:
    - datalake_pin_benefits_raw.ben_elig_dpnt.elig_per_id
  id_eligible_person_option:
    description: A foreign key linking to the `BEN_ELIG_PER_OPT_F` table, representing the specific option chosen by the eligible person that impacts dependent eligibility.
    lineage:
    - datalake_pin_benefits_raw.ben_elig_dpnt.elig_per_opt_id
  id_dependent_person:
    description: A foreign key linking to the `PER_ALL_PEOPLE_F` table, identifying the dependent person whose eligibility status is being tracked.
    lineage:
    - datalake_pin_benefits_raw.ben_elig_dpnt.dpnt_person_id
  id_request:
    description: The request ID generated by the Enterprise Service Scheduler for the job that created or last updated this row.
    lineage:
    - datalake_pin_benefits_raw.ben_elig_dpnt.request_id
  relationship_code:
    description: A code indicating the relationship of the dependent to the primary participant (e.g., child, spouse).
    lineage:
    - datalake_pin_benefits_raw.ben_elig_dpnt.rlnshp_cd
  created_by:
    description: The user account that initially created this record in the source system.
    lineage:
    - datalake_pin_benefits_raw.ben_elig_dpnt.created_by
  updated_by:
    description: The user account that last modified this record in the source system.
    lineage:
    - datalake_pin_benefits_raw.ben_elig_dpnt.last_updated_by
  object_version_number:
    description: A version number used for optimistic locking, incremented with each update to detect concurrent modifications.
    lineage:
    - datalake_pin_benefits_raw.ben_elig_dpnt.object_version_number
  is_dependent_ineligible:
    description: A boolean flag indicating whether the dependent is currently ineligible (TRUE) or eligible (FALSE) for benefits.
    lineage:
    - datalake_pin_benefits_raw.ben_elig_dpnt.dpnt_inelig_flag
  is_overridden:
    description: A boolean flag indicating whether the dependent's eligibility has been administratively overridden (TRUE) or not (FALSE).
    lineage:
    - datalake_pin_benefits_raw.ben_elig_dpnt.ovrdn_flag
  dt_eligibility_started:
    description: The effective start date of the dependent's eligibility.
    lineage:
    - datalake_pin_benefits_raw.ben_elig_dpnt.elig_strt_dt
  dt_eligibility_ended:
    description: The effective end date of the dependent's eligibility.
    lineage:
    - datalake_pin_benefits_raw.ben_elig_dpnt.elig_thru_dt
  ts_record_created:
    description: The timestamp indicating the exact date and time when this record was created in the source system.
    lineage:
    - datalake_pin_benefits_raw.ben_elig_dpnt.create_dt
  ts_updated:
    description: The timestamp indicating the exact date and time when this record was last updated in the source system.
    lineage:
    - datalake_pin_benefits_raw.ben_elig_dpnt.last_update_date
  ts_created:
    description: The timestamp indicating the exact date and time when this record was originally created.
    lineage:
    - datalake_pin_benefits_raw.ben_elig_dpnt.creation_date
  ts_program_updated:
    description: The timestamp when a batch program or concurrent process last updated this row in the source system.
    lineage:
    - datalake_pin_benefits_raw.ben_elig_dpnt.program_update_date
  ts_load:
    description: The timestamp indicating when this record was loaded into the data lake.
  year:
    description: The year extracted from the 'ts_updated' column. This is useful for partitioning the data by year to improve query performance.
    lineage:
    - datalake_pin_benefits_raw.ben_elig_dpnt.year
  month:
    description: The month extracted from the 'ts_updated' column (represented as a number from 1 to 12). Useful for data partitioning and filtering by month.
    lineage:
    - datalake_pin_benefits_raw.ben_elig_dpnt.month
  day:
    description: The day of the month extracted from the 'ts_updated' column (represented as a number from 1 to 31). Useful for filtering data by specific days.
    lineage:
    - datalake_pin_benefits_raw.ben_elig_dpnt.day
