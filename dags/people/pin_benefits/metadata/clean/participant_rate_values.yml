---
database_name: datalake_pin_benefits_clean
table_name: participant_rate_values
owner: isabella.araujo@quintoandar.com.br
domain: people
description: This table identifies the calculated values, tax implications, and other relevant information pertaining to standard rates, total flex credits, and imputed income for a person enrolled in a benefit plan or an option within a plan. It provides detailed insight into the financial aspects of a participant's benefit enrollment.
columns:
  id_participant_rate_value:
    description: The unique system-generated primary key for each participant rate value record.
    lineage:
      - datalake_pin_benefits_raw.ben_prtt_rt_val.prtt_rt_val_id
  id_business_group:
    description: A foreign key referencing the business group to which this rate value belongs.
    lineage:
      - datalake_pin_benefits_raw.ben_prtt_rt_val.business_group_id
  id_participant_enrollment_result:
    description: A foreign key linking to the `BEN_PRTT_ENRT_RSLT_F` table, identifying the participant's enrollment result for which this rate was calculated.
    lineage:
      - datalake_pin_benefits_raw.ben_prtt_rt_val.prtt_enrt_rslt_id
  id_activity_base_rate:
    description: A foreign key linking to the `BEN_ACTY_BASE_RT_F` table, identifying the activity base rate used in the calculation.
    lineage:
      - datalake_pin_benefits_raw.ben_prtt_rt_val.acty_base_rt_id
  id_period_in_life_event_reason:
    description: A foreign key linking to the `BEN_PER_IN_LER` table, representing the period within a life event reason relevant to this rate value.
    lineage:
      - datalake_pin_benefits_raw.ben_prtt_rt_val.per_in_ler_id
  id_ended_period_in_life_event_reason:
    description: Identifier for the period within a life event reason that signifies the end of the rate's validity.
    lineage:
      - datalake_pin_benefits_raw.ben_prtt_rt_val.ended_per_in_ler_id
  transaction_type_code:
    description: A code indicating the type of transaction associated with this rate value (e.g., enrollment, change).
    lineage:
      - datalake_pin_benefits_raw.ben_prtt_rt_val.tx_typ_cd
  activity_type_code:
    description: A code indicating the type of activity for which this rate is defined (e.g., benefit, deduction).
    lineage:
      - datalake_pin_benefits_raw.ben_prtt_rt_val.acty_typ_cd
  multiplier_code:
    description: A code representing any multiplier applied to the base rate.
    lineage:
      - datalake_pin_benefits_raw.ben_prtt_rt_val.mlt_cd
  activity_reference_period_code:
    description: A code indicating the reference period for the activity (e.g., per month, per year).
    lineage:
      - datalake_pin_benefits_raw.ben_prtt_rt_val.acty_ref_perd_cd
  communicated_reference_period_code:
    description: A code indicating the reference period as communicated to the participant.
    lineage:
      - datalake_pin_benefits_raw.ben_prtt_rt_val.cmcd_ref_perd_cd
  rate_display_code:
    description: A code indicating how the rate should be displayed (e.g., 'P' for Primary, 'S' for Secondary, 'O' for Others).
    lineage:
      - datalake_pin_benefits_raw.ben_prtt_rt_val.rate_display_cd
  created_by:
    description: The user account that initially created this record.
    lineage:
      - datalake_pin_benefits_raw.ben_prtt_rt_val.created_by
  updated_by:
    description: The user account that last modified this record.
    lineage:
      - datalake_pin_benefits_raw.ben_prtt_rt_val.last_updated_by
  object_version_number:
    description: A version number used for optimistic locking, incremented with each update to detect concurrent modifications.
    lineage:
      - datalake_pin_benefits_raw.ben_prtt_rt_val.object_version_number
  rate_value:
    description: The calculated rate value for the participant.
    lineage:
      - datalake_pin_benefits_raw.ben_prtt_rt_val.rt_val
  annual_rate_value:
    description: The calculated annual rate value for the participant.
    lineage:
      - datalake_pin_benefits_raw.ben_prtt_rt_val.ann_rt_val
  communicated_rate_value:
    description: The rate value communicated to the participant.
    lineage:
      - datalake_pin_benefits_raw.ben_prtt_rt_val.cmcd_rt_val
  used_pay_periods_in_year:
    description: The number of pay periods used in the year for rate calculations.
    lineage:
      - datalake_pin_benefits_raw.ben_prtt_rt_val.pp_in_yr_used_num
  is_display_on_enrollment:
    description: A boolean flag indicating whether this rate value should be displayed during enrollment (TRUE) or not (FALSE).
    lineage:
      - datalake_pin_benefits_raw.ben_prtt_rt_val.dsply_on_enrt_flag
  is_rate_overridden:
    description: A boolean flag indicating whether the rate has been administratively overridden (TRUE) or not (FALSE).
    lineage:
      - datalake_pin_benefits_raw.ben_prtt_rt_val.rt_ovridn_flag
  dt_rate_started:
    description: The effective start date of this rate value.
    lineage:
      - datalake_pin_benefits_raw.ben_prtt_rt_val.rt_strt_dt
  dt_rate_ended:
    description: The effective end date of this rate value.
    lineage:
      - datalake_pin_benefits_raw.ben_prtt_rt_val.rt_end_dt
  dt_rate_through_ended:
    description: The date up to which the rate formally ended.
    lineage:
      - datalake_pin_benefits_raw.ben_prtt_rt_val.ended_rate_thru_dt
  dt_elections_made:
    description: The date when the elections associated with this rate were made.
    lineage:
      - datalake_pin_benefits_raw.ben_prtt_rt_val.elctns_made_dt
  ts_created:
    description: The timestamp indicating the exact date and time when this record was created in the source system.
    lineage:
      - datalake_pin_benefits_raw.ben_prtt_rt_val.creation_date
  ts_updated:
    description: The timestamp indicating the exact date and time when this record was last updated in the source system.
    lineage:
      - datalake_pin_benefits_raw.ben_prtt_rt_val.last_update_date
  ts_load:
    description: The timestamp indicating when this record was loaded into the data lake.