---
database_name: datalake_pin_benefits_clean
table_name: plan_options
owner: isabella.araujo@quintoandar.com.br
domain: people
description: This table identifies various compensation alternatives, primarily focusing on coverage and investment choices, that are offered within one or more benefit plans. It provides a detailed breakdown of each available option.
columns:
  id_option:
    description: The unique system-generated primary key for each option.
    lineage:
      - datalake_pin_benefits_raw.ben_opt_f.opt_id
  id_business_group:
    description: A foreign key referencing the business group associated with this option.
    lineage:
      - datalake_pin_benefits_raw.ben_opt_f.business_group_id
  option_name:
    description: The official name of the option.
    lineage:
      - datalake_pin_benefits_raw.ben_opt_f.name
  option_short_code:
    description: A short code or abbreviation for the option name.
    lineage:
      - datalake_pin_benefits_raw.ben_opt_f.short_code
  option_short_name:
    description: A shortened or abbreviated name for the option.
    lineage:
      - datalake_pin_benefits_raw.ben_opt_f.short_name
  created_by:
    description: The user account that initially created this record.
    lineage:
      - datalake_pin_benefits_raw.ben_opt_f.created_by
  updated_by:
    description: The user account that last modified this record.
    lineage:
      - datalake_pin_benefits_raw.ben_opt_f.last_updated_by
  object_version_number:
    description: A version number used for optimistic locking, incremented with each update to detect concurrent modifications.
    lineage:
      - datalake_pin_benefits_raw.ben_opt_f.object_version_number
  is_invoke_waiver_option:
    description: A boolean flag indicating whether the waiver option is invoked (TRUE) or not (FALSE).
    lineage:
      - datalake_pin_benefits_raw.ben_opt_f.invk_wv_opt_flag
  is_global:
    description: A boolean flag indicating whether this option has global exposure to legal entities (TRUE) or not (FALSE).
    lineage:
      - datalake_pin_benefits_raw.ben_opt_f.global_flag
  dt_effective_started:
    description: The date from which this option became effective.
    lineage:
      - datalake_pin_benefits_raw.ben_opt_f.effective_start_date
  dt_effective_ended:
    description: The date on which this option ceased to be effective.
    lineage:
      - datalake_pin_benefits_raw.ben_opt_f.effective_end_date
  ts_created:
    description: The timestamp indicating the exact date and time when this record was created in the source system.
    lineage:
      - datalake_pin_benefits_raw.ben_opt_f.creation_date
  ts_updated:
    description: The timestamp indicating the exact date and time when this record was last updated in the source system.
    lineage:
      - datalake_pin_benefits_raw.ben_opt_f.last_update_date
  ts_load:
    description: The timestamp indicating when this record was loaded into the data lake.
  year:
    description: The year extracted from the 'ts_updated' column. This is useful for partitioning the data by year to improve query performance.
    lineage:
      - datalake_pin_benefits_raw.ben_opt_f.year
  month:
    description: The month extracted from the 'ts_updated' column (represented as a number from 1 to 12). Useful for data partitioning and filtering by month.
    lineage:
      - datalake_pin_benefits_raw.ben_opt_f.month
  day:
    description: The day of the month extracted from the 'ts_updated' column (represented as a number from 1 to 31). Useful for filtering data by specific days.
    lineage:
      - datalake_pin_benefits_raw.ben_opt_f.day