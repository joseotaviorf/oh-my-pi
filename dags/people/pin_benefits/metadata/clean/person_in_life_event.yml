---
database_name: datalake_pin_benefits_clean
table_name: person_in_life_event
owner: isabella.araujo@quintoandar.com.br
domain: people
description: This table identifies all life events for a specific person, including which life event, if any, is currently in progress. Unlike `BEN_PTNL_LER_FOR_PER`, this table contains records for persons whose detected life events have been validated through management processes and classified as legitimate, or have been manually created through user input. It also includes persons involved in open and administrative enrollments.
columns:
  id_person_in_life_event_reason:
    description: The unique system-generated primary key for each person-in-life-event record.
    lineage:
      - datalake_pin_benefits_raw.ben_per_in_ler.per_in_ler_id
  id_benefit_relation:
    description: Identifier linking to benefit relations.
    lineage:
      - datalake_pin_benefits_raw.ben_per_in_ler.benefit_relation_id
  id_business_group:
    description: A foreign key referencing the business group associated with this person's life event.
    lineage:
      - datalake_pin_benefits_raw.ben_per_in_ler.business_group_id
  id_life_event_reason:
    description: A foreign key linking to the `BEN_LER_F` table, identifying the specific life event reason.
    lineage:
      - datalake_pin_benefits_raw.ben_per_in_ler.ler_id
  id_person:
    description: A foreign key linking to the `PER_PEOPLE_F` table, identifying the person associated with this life event.
    lineage:
      - datalake_pin_benefits_raw.ben_per_in_ler.person_id
  id_potential_life_event_reason_for_person:
    description: A foreign key linking to `BEN_PTNL_LER_FOR_PER`, identifying the potential life event that was detected for the person before validation.
    lineage:
      - datalake_pin_benefits_raw.ben_per_in_ler.ptnl_ler_for_per_id
  id_legal_entity:
    description: Identifier for the legal entity associated with the person in this life event.
    lineage:
      - datalake_pin_benefits_raw.ben_per_in_ler.legal_entity_id
  id_request:
    description: The request ID generated by the Enterprise Service Scheduler for the job that created or last updated this row.
    lineage:
      - datalake_pin_benefits_raw.ben_per_in_ler.request_id
  person_in_life_event_status_code:
    description: A code indicating the current status of the person in the life event (e.g., detected, processed, voided, closed).
    lineage:
      - datalake_pin_benefits_raw.ben_per_in_ler.per_in_ler_stat_cd
  life_event_reason_type_code:
    description: A code indicating the type of life event reason.
    lineage:
      - datalake_pin_benefits_raw.ben_per_in_ler.ler_type_cd
  product_code:
    description: A code indicating the product associated with this life event.
    lineage:
      - datalake_pin_benefits_raw.ben_per_in_ler.prod_cd
  job_definition_name:
    description: The name of the Enterprise Service Scheduler job that created or last updated this row.
    lineage:
      - datalake_pin_benefits_raw.ben_per_in_ler.job_definition_name
  job_definition_package:
    description: The package name of the Enterprise Service Scheduler job that created or last updated this row.
    lineage:
      - datalake_pin_benefits_raw.ben_per_in_ler.job_definition_package
  created_by:
    description: The user account that initially created this record.
    lineage:
      - datalake_pin_benefits_raw.ben_per_in_ler.created_by
  updated_by:
    description: The user account that last modified this record.
    lineage:
      - datalake_pin_benefits_raw.ben_per_in_ler.last_updated_by
  object_version_number:
    description: A version number used for optimistic locking, incremented with each update to detect concurrent modifications.
    lineage:
      - datalake_pin_benefits_raw.ben_per_in_ler.object_version_number
  dt_life_event_occurred:
    description: The date when the life event occurred.
    lineage:
      - datalake_pin_benefits_raw.ben_per_in_ler.lf_evt_ocrd_dt
  dt_processed:
    description: The date when the life event was processed.
    lineage:
      - datalake_pin_benefits_raw.ben_per_in_ler.procd_dt
  dt_started:
    description: The date when the processing for this life event started.
    lineage:
      - datalake_pin_benefits_raw.ben_per_in_ler.strtd_dt
  dt_notified:
    description: The date when a notification related to this life event was sent.
    lineage:
      - datalake_pin_benefits_raw.ben_per_in_ler.ntfn_dt
  ts_created:
    description: The timestamp indicating the exact date and time when this record was created in the source system.
    lineage:
      - datalake_pin_benefits_raw.ben_per_in_ler.creation_date
  ts_updated:
    description: The timestamp indicating the exact date and time when this record was last updated in the source system.
    lineage:
      - datalake_pin_benefits_raw.ben_per_in_ler.last_update_date
  ts_program_updated:
    description: The timestamp when a batch program or concurrent process last updated this row in the source system.
    lineage:
      - datalake_pin_benefits_raw.ben_per_in_ler.program_update_date
  ts_load:
    description: The timestamp indicating when this record was loaded into the data lake.
  year:
    description: The year extracted from the 'ts_updated' column. This is useful for partitioning the data by year to improve query performance.
    lineage:
      - datalake_pin_benefits_raw.ben_per_in_ler.year
  month:
    description: The month extracted from the 'ts_updated' column (represented as a number from 1 to 12). Useful for data partitioning and filtering by month.
    lineage:
      - datalake_pin_benefits_raw.ben_per_in_ler.month
  day:
    description: The day of the month extracted from the 'ts_updated' column (represented as a number from 1 to 31). Useful for filtering data by specific days.
    lineage:
      - datalake_pin_benefits_raw.ben_per_in_ler.day