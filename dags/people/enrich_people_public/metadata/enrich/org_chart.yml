---
database_name: datalake_people_public
table_name: org_chart
owner: isabella.araujo@quintoandar.com.br
domain: People
description: Information about team structures based on the organizational chart.
columns:
  assignment_number:
    description: Registration number of the worker.
    lineage:
      - datalake_people.identifier_mapping.assignment_number
  full_name:
    description: Full name of the worker; sourced from display_name (uses social name when available).
    lineage:
      - datalake_people.identifier_mapping.display_name
  work_email:
    description: Corporate email of the employee.
    lineage:
      - datalake_people.identifier_mapping.work_email
  manager_name:
    description: Full name of the manager.
    lineage:
      - datalake_people.identifier_mapping.display_name
  manager_email:
    description: Corporate email of the manager.
    lineage:
      - datalake_people.identifier_mapping.work_email
  assignment_name:
    description: Name of the job of the worker.
    lineage:
      - datalake_pin.movement_details.assignment_name
  job_class:
    description: Type of position of the worker.
    lineage:
      - datalake_hr_system_clean.job_families.name_job_family
  assignment_status_type:
    description: Assignment status type for the worker.
    lineage:
      - datalake_pin.movement_details.assignment_status_type
    categories:
      ACTIVE: The employee is active in the company.
      INACTIVE: The employee is inactive or has left the company.
  business_unit_name:
    description: Name of the business unit for the worker assignment.
    lineage:
      - datalake_pin.movement_details.business_unit_name
  cost_center_name:
    description: Cost center of the employee.
    lineage:
      - datalake_pin.movement_details.cost_center_name
  business:
    description: Business in which the employee works.
    lineage:
      - datalake_hr_system_clean.organizations.business
  product:
    description: Product the employee is primarily associated with.
    lineage:
      - datalake_hr_system_clean.organizations.product
  vertical:
    description: Vertical of the worker.
    lineage:
      - datalake_hr_system_clean.organizations.vertical
  vice_presidency:
    description: Vice presidency of the worker.
    lineage:
      - datalake_hr_system_clean.organizations.vice_presidency
  directorate:
    description: Directorate to which the employee belongs.
    lineage:
      - datalake_hr_system_clean.organizations.directorate
  subdirectorate:
    description: Subdirectorate to which the employee belongs.
    lineage:
      - datalake_hr_system_clean.organizations.subdirectorate
  line:
    description: Employee's Line - only if the employee is part of a Product & Technology
      team.
    lineage:
      - datalake_gsheets_people_clean.team_formation_product_tech.line
  chapter:
    description: Employee's Chapter - only if the employee is part of a Product &
      Technology team.
    lineage:
      - datalake_gsheets_people_clean.team_formation_product_tech.chapter
  line_leader:
    description: Line led by the employee - only if they are a Line Leader within
      a Product & Technology team.
    lineage:
      - datalake_gsheets_people_clean.team_formation_product_tech.line_leader
  team_leader:
    description: Team led by the employee - only if they are a Team Leader within
      a Product & Technology team.
    lineage:
      - datalake_gsheets_people_clean.team_formation_product_tech.team_leader
  product_and_tech_team_1:
    description: Employee's first Product & Technology team assignment (if applicable).
    lineage:
      - datalake_gsheets_people_clean.team_formation_product_tech.team_1
  product_and_tech_team_2:
    description: Employee's second Product & Technology team assignment (if applicable).
    lineage:
      - datalake_gsheets_people_clean.team_formation_product_tech.team_2
  product_and_tech_team_3:
    description: Employee's third Product & Technology team assignment (if applicable).
    lineage:
      - datalake_gsheets_people_clean.team_formation_product_tech.team_3
  product_and_tech_team_4:
    description: Employee's fourth Product & Technology team assignment (if applicable).
    lineage:
      - datalake_gsheets_people_clean.team_formation_product_tech.team_4
  product_and_tech_team_5:
    description: Employee's fifth Product & Technology team assignment (if applicable).
    lineage:
      - datalake_gsheets_people_clean.team_formation_product_tech.team_5
  product_and_tech_team_6:
    description: Employee's sixth Product & Technology team assignment (if applicable).
    lineage:
      - datalake_gsheets_people_clean.team_formation_product_tech.team_6
  product_and_tech_team_7:
    description: Employee's seventh Product & Technology team assignment (if applicable).
    lineage:
      - datalake_gsheets_people_clean.team_formation_product_tech.team_7
  product_and_tech_team_8:
    description: Employee's eighth Product & Technology team assignment (if applicable).
    lineage:
      - datalake_gsheets_people_clean.team_formation_product_tech.team_8
  product_and_tech_team_9:
    description: Employee's ninth Product & Technology team assignment (if applicable).
    lineage:
      - datalake_gsheets_people_clean.team_formation_product_tech.team_9
  product_and_tech_team_10:
    description: Employee's tenth Product & Technology team assignment (if applicable).
    lineage:
      - datalake_gsheets_people_clean.team_formation_product_tech.team_10
  is_active:
    description: Boolean flag indicating if the employee is active.
    lineage:
      - datalake_pin.movement_details.assignment_status_type
  dt_hired:
    description: Actual start date of the work relationship (hire date).
    lineage:
      - datalake_people.identifier_mapping.dt_started
  dt_terminated:
    description: Actual termination date of the work relationship.
    lineage:
      - datalake_people.identifier_mapping.dt_actual_termination
  ts_load:
    description: Timestamp of when the record was loaded into this table.
