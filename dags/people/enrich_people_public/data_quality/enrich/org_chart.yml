---
table_name: datalake_people_public.org_chart
alert_channel: PEOPLE_ALERTS

table_level_validations:
  has_size:
    greater_than: 4000
    severity_level: Error

column_level_validations:
  assignment_number:
    is_unique:
      severity_level: Error
    is_complete:
      severity_level: Error
  dt_hired:
    is_complete:
      severity_level: Warning
  is_active:
    is_complete:
      severity_level: Warning
    is_contained_in:
      values: [true]
      severity_level: Error
  assignment_status_type:
    is_contained_in:
      values: ['ACTIVE']
      severity_level: Error