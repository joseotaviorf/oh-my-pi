dag:
  name: enrich_people_public
  owner: Data People
  callback_by_task: False
  schedule_start_date: 2024, 6, 11
  documentation:
    dag_purpose: Enrich with people analytics data that can be made available to the entire QuintoAndar
workflow:
  type: query_delta
  layer: enrich
  has_hive_sync: true
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
  default_table_privileges:
    people-team: ["ALL PRIVILEGES"]
  tables_customization:
    org_chart:
      vacuum_retention_hours: 168
      vacuum_lite: true
