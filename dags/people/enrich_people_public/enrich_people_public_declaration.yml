dag:
  name: enrich_people_public
  owner: Data People
  schedule_start_date: 2024, 6, 11
  documentation:
    dag_purpose: Enrich with people analytics data that can be made available to the entire QuintoAndar
workflow:
  type: query_delta
  layer: enrich
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, ds, 'load_start_date') }}"
cluster:
  type: databricks_12_2_min_people_cluster
  access_control_list:
    group_name: people-analytics
    permission_level: CAN_MANAGE
