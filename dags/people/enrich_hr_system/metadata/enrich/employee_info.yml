database_name: datalake_hr_system
table_name: employee_info
owner: isabella.araujo@quintoandar.com.br
domain: People
description: |-
  Enrich table with information about name and birth of the employee.
  documented_* columns are official / document-aligned names from HCM; first_social_name and last_social_name are preferred social name parts when present.
columns:
  id_person:
    description: Surrogate key linking enriched employee attributes to the PIN person record.
    lineage:
    - datalake_people.identifier_mapping.id_person
  person_number:
    description: PIN person number uniquely identifying the employee across workforce records.
    lineage:
    - datalake_people.identifier_mapping.person_number
  documented_first_name:
    description: Official / document-aligned first name of the employee from HCM.
    lineage:
    - datalake_pin_core_clean.person_name.documented_first_name
  documented_last_name:
    description: Official / document-aligned last name of the employee from HCM.
    lineage:
    - datalake_pin_core_clean.person_name.documented_last_name
  documented_full_name:
    description: Official / document-aligned full name of the employee from HCM.
    lineage:
    - datalake_pin_core_clean.person_name.documented_full_name
  first_social_name:
    description: Employee preferred first name used in internal communications and social contexts.
    lineage:
    - datalake_pin_core_clean.person_name.first_social_name
  last_social_name:
    description: Employee preferred last name used in internal communications and social contexts.
    lineage:
    - datalake_pin_core_clean.person_name.last_social_name
  mother_name:
    description: Full legal name of the employee mother as required for Brazilian HR documentation.
    lineage:
    - datalake_pin_core_clean.person.mother_name
  father_name:
    description: Full legal name of the employee father when provided in PIN person records.
    lineage:
    - datalake_pin_core_clean.person.father_name
  birth_town:
    description: Municipality where the employee was born, as recorded in PIN person records.
    lineage:
    - datalake_pin_core_clean.person.town_of_birth
  birth_state:
    description: State or province where the employee was born for demographic reporting.
    lineage:
    - datalake_pin_core_clean.person.region_of_birth
  birth_country:
    description: Country of birth for the employee used in compliance and demographic reporting.
    lineage:
    - datalake_pin_core_clean.person.country_of_birth
  dt_birth:
    description: Date of birth of the employee
    lineage:
    - datalake_pin_core_clean.person.dt_of_birth
