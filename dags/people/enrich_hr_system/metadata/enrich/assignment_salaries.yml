---
database_name: datalake_hr_system
table_name: assignment_salaries
description: "Table that stores salary variations and related assignment details. This table tracks salary changes over time, including action reasons, salary amounts, and assignment periods."
columns:
  id_person:
    description: "Identifier for the person generated by the HR system."
    lineage:
      - datalake_hr_system.assignments.id_person
  id_assignment:
    description: "Identifier for the worker's assignment."
    lineage:
      - datalake_hr_system.assignments.id_assignment
  id_period_of_service:
    description: "Identifier for the worker's period of service."
    lineage:
      - datalake_hr_system.assignments.id_period_of_service
  assignment_name:
    description: "Business title of the worker's assignment."
    lineage:
      - datalake_hr_system.assignments.assignment_name
  band:
    description: "Code representing the grade or level of the assignment."
    lineage:
      - datalake_hr_system.assignments.band
  cost_center_name:
    description: "Name of the cost center for the worker's assignment."
    lineage:
      - datalake_hr_system.assignments.cost_center_name
  action_reason:
    description: "Reason for the last action performed on the salary record."
    lineage:
      - datalake_hr_system_clean.salaries.action_reason
  standardized_action_reason:
    description: "Standardized reason for salary actions, simplifying specific HR terms."
    lineage:
      - datalake_hr_system_clean.salaries.action_reason
  currency_code:
    description: "Currency code of the salary for the given period."
    lineage:
      - datalake_hr_system_clean.salaries.currency_code
  salary_amount:
    description: "Current salary amount in the specified currency."
    lineage:
      - datalake_hr_system_clean.salaries.salary_amount
  last_salary_amount:
    description: "Previous salary amount before the latest change."
    lineage:
      - datalake_hr_system_clean.salaries.salary_amount
  percentage_increase:
    description: "Percentage increase in salary, based on comparison with the last salary."
    lineage:
      - datalake_hr_system_clean.salaries.salary_amount
  dt_assignment_started:
    description: "Start date of the assignment."
    lineage:
      - datalake_hr_system.assignments.dt_effective_start
  dt_assignment_ended:
    description: "End date of the assignment."
    lineage:
      - datalake_hr_system.assignments.dt_effective_end
  dt_salary_started:
    description: "Start date of the salary period."
    lineage:
      - datalake_hr_system_clean.salaries.dt_from
  dt_salary_ended:
    description: "End date of the salary period."
    lineage:
      - datalake_hr_system_clean.salaries.dt_to
  dt_last_salary_started:
    description: "Start date of the previous salary period."
    lineage:
      - datalake_hr_system_clean.salaries.dt_from
  dt_last_salary_ended:
    description: "End date of the previous salary period."
    lineage:
      - datalake_hr_system_clean.salaries.dt_to
