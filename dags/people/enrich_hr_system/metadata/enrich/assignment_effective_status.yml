---
database_name: datalake_hr_system
table_name: assignment_effective_status
owner: isabella.araujo@quintoandar.com.br
domain: people
description: "Table providing the effective status of worker assignments, determined by combining the latest information from both active and terminated assignments."
columns:
  id_assignment:
    description: "Unique surrogate identifier for the worker assignment."
    lineage:
      - datalake_hr_system.assignment_snapshot.id_assignment
  id_person:
    description: "Globally unique identifier for the person, sourced from the Oracle HR System."
    lineage:
      - datalake_hr_system.assignment_snapshot.id_person
  id_period_of_service:
    description: "Identifier for the continuous period of service of the worker within the organization."
    lineage:
      - datalake_hr_system.assignment_snapshot.id_period_of_service
  id_business_unit:
    description: "Unique identifier representing the business unit to which the assignment belongs."
    lineage:
      - datalake_hr_system.assignment_snapshot.id_business_unit
  id_assignment_status_type:
    description: "Unique identifier specifying the type of the assignment's status."
    lineage:
      - datalake_hr_system.assignment_snapshot.id_assignment_status_type
  id_user_person_type:
    description: "Unique identifier for the user-defined person type associated with the assignment."
    lineage:
      - datalake_hr_system.assignment_snapshot.id_user_person_type
  id_proposed_user_person_type:
    description: "Unique identifier for the proposed user-defined person type, relevant in future-dated records."
    lineage:
      - datalake_hr_system.assignment_snapshot.id_proposed_user_person_type
  id_job:
    description: "Unique identifier for the specific job role held by the worker in the assignment."
    lineage:
      - datalake_hr_system.assignment_snapshot.id_job
  id_band:
    description: "Unique identifier representing the grade or level associated with the worker's assignment."
    lineage:
      - datalake_hr_system.assignment_snapshot.id_grade
  id_band_ladder:
    description: "Unique identifier for the specific grade ladder used for compensation and benefits eligibility."
    lineage:
      - datalake_hr_system.assignment_snapshot.id_grade_ladder
  id_cost_center:
    description: "Unique identifier for the cost center to which the worker's assignment is allocated."
    lineage:
      - datalake_hr_system.assignment_snapshot.id_department
  id_union:
    description: "Unique identifier for the labor union associated with the worker's assignment, if applicable."
    lineage:
      - datalake_hr_system.assignment_snapshot.id_union
  assignment_number:
    description: "A distinct number assigned to each worker assignment within the system."
    lineage:
      - datalake_hr_system.assignment_snapshot.assignment_number
  assignment_name:
    description: "The official business title or name of the worker's assignment."
    lineage:
      - datalake_hr_system.assignment_snapshot.assignment_name
  action_code:
    description: "A code indicating the specific action performed on the assignment record (e.g., Hire, Transfer, Termination), sourced from either the current assignment snapshot or the latest terminated record."
    lineage:
      - datalake_hr_system.assignment_snapshot.action_code
  reason_code:
    description: "A code providing the specific reason behind the action recorded for the assignment, sourced from either the current assignment snapshot or the latest terminated record."
    lineage:
      - datalake_hr_system.assignment_snapshot.reason_code
  effective_sequence:
    description: "A sequential number indicating the order of changes occurring on the same effective start date for an assignment."
    lineage:
      - datalake_hr_system.assignment_snapshot.assignment_sequence
  business_unit_name:
    description: "The descriptive name of the business unit associated with the worker's assignment."
    lineage:
      - datalake_hr_system.assignment_snapshot.business_unit_name
  assignment_type:
    description: "The classification of the assignment, such as 'Employee' or 'Contingent Worker'."
    lineage:
      - datalake_hr_system.assignment_snapshot.assignment_type
  assignment_status_type_code:
    description: "A short code representing the type of the assignment's status, sourced from either the current assignment snapshot or the latest terminated record."
    lineage:
      - datalake_hr_system.assignment_snapshot.assignment_status_type_code
  assignment_status_type:
    description: "A descriptive label for the type of the assignment's status (e.g., Active, Inactive), sourced from either the current assignment snapshot or the latest terminated record."
    lineage:
      - datalake_hr_system.assignment_snapshot.assignment_status_type
  system_person_type:
    description: "An application-defined classification identifying the person's role within the system (e.g., Employee, Contractor)."
    lineage:
      - datalake_hr_system.assignment_snapshot.system_person_type
  user_person_type:
    description: "A user-defined classification identifying the person's role (e.g., Full-time Employee, Part-time Contractor)."
    lineage:
      - datalake_hr_system.assignment_snapshot.user_person_type
  job_code:
    description: "A short code representing the specific job role of the worker."
    lineage:
      - datalake_hr_system.assignment_snapshot.job_code
  band:
    description: "A code representing the grade or level of the assignment."
    lineage:
      - datalake_hr_system.assignment_snapshot.grade_code
  comp_ladder_directorate:
    description: "The name of the grade ladder used for compensation and benefits administration within a specific directorate."
    lineage:
      - datalake_hr_system.assignment_snapshot.grade_ladder_name
  cost_center_name:
    description: "The descriptive name of the cost center associated with the worker's assignment."
    lineage:
      - datalake_hr_system.assignment_snapshot.department_name
  assignment_category:
    description: "A user-defined category for the assignment, such as 'Full-time', 'Permanent', 'Temporary'."
    lineage:
      - datalake_hr_system.assignment_snapshot.assignment_category
  worker_category:
    description: "A classification of the worker based on their type of employment (e.g., 'Blue Collar', 'Civil Servant')."
    lineage:
      - datalake_hr_system.assignment_snapshot.worker_category
  permanent_temporary:
    description: "Indicates the employment status of the worker, either 'Regular' (permanent) or 'Temporary'."
    lineage:
      - datalake_hr_system.assignment_snapshot.contract_type
  hourly_salaried_code:
    description: "A code indicating whether the assignment's compensation is based on an hourly rate or a fixed salary."
    lineage:
      - datalake_hr_system.assignment_snapshot.hourly_or_salaried
  normal_hours:
    description: "The standard number of working hours expected for the assignment (e.g., 40)."
    lineage:
      - datalake_hr_system.assignment_snapshot.normal_hours
  frequency:
    description: "The unit of time for the normal working hours (e.g., 'Week', 'Month')."
    lineage:
      - datalake_hr_system.assignment_snapshot.payment_frequency
  seniority_basis:
    description: "The criteria used to calculate the worker's seniority within the organization."
    lineage:
      - datalake_hr_system.assignment_snapshot.seniority_basis
  union_name:
    description: "The full name of the labor union associated with the worker's assignment, if applicable."
    lineage:
      - datalake_hr_system.assignment_snapshot.union_name
  created_by:
    description: "The username or identifier of the user who initially created the assignment record."
    lineage:
      - datalake_hr_system.assignment_snapshot.assignment_created_by
  last_updated_by:
    description: "The username or identifier of the user who last modified the assignment record."
    lineage:
      - datalake_hr_system.assignment_snapshot.assignment_updated_by
  insurance_policy:
    description: "The unique policy number for the worker's insurance coverage."
    lineage:
      - datalake_hr_system.assignment_snapshot.insurance_policy
  brand:
    description: "The specific brand or entity the worker is associated with within the organization."
    lineage:
      - datalake_hr_system.assignment_snapshot.brand
  contract_type:
    description: "The formal type of employment agreement the worker has (e.g., 'Permanent', 'Fixed-term')."
    lineage:
      - datalake_hr_system.assignment_snapshot.contract_type
  career_track:
    description: "The identified path or specialization of the worker's career (e.g., 'Individual Contributor' (CI), 'Leadership' (L))."
    lineage:
      - datalake_hr_system.assignment_snapshot.career_path
  insurance_company:
    description: "The name of the insurance provider for the worker's policy."
    lineage:
      - datalake_hr_system.assignment_snapshot.insurance_company
  target_rvv:
    description: "The target value or amount for the worker's variable remuneration."
    lineage:
      - datalake_hr_system.assignment_snapshot.assignments_dff.target_rvv
  target_plr:
    description: "The target value or percentage for the worker's profit sharing."
    lineage:
      - datalake_hr_system.assignment_snapshot.target_profit_sharing
  is_primary_assignment:
    description: "A boolean flag indicating if the current assignment is the primary one within the work relationship (true or false)."
    lineage:
      - datalake_hr_system.assignment_snapshot.is_primary_assignment
  is_manager:
    description: "A boolean flag indicating whether the worker holds a managerial role in this assignment (true or false)."
    lineage:
      - datalake_hr_system.assignment_snapshot.is_manager
  dt_effective_start:
    description: "The date on which the changes to the assignment record become effective, sourced from either the current assignment snapshot or the latest terminated record."
    lineage:
      - datalake_hr_system.assignment_snapshot.dt_assignment_started
  dt_effective_end:
    description: "The date on which the changes to the assignment record cease to be effective, sourced from either the current assignment snapshot or the latest terminated record."
    lineage:
      - datalake_hr_system.assignment_snapshot.dt_assignment_ended
  dt_projected_start:
    description: "The anticipated start date for prospective workers or for future-dated assignments."
    lineage:
      - datalake_hr_system.assignment_snapshot.dt_projected_start
  ts_created:
    description: "The exact date and time when the work relationship associated with this assignment was initially created in the system."
    lineage:
      - datalake_hr_system.assignment_snapshot.ts_work_relationship_created
  ts_last_update:
    description: "The exact date and time when the work relationship associated with this assignment was last modified in the system."
    lineage:
      - datalake_hr_system.assignment_snapshot.ts_work_relationship_updated
  ts_load:
    description: "Records the moment the entry was added to the table. This indicates the precise date and time of data ingestion, produced using the NOW() function. This value changes if the data undergoes reprocessing."
