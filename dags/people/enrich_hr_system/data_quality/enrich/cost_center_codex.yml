---
table_name: datalake_hr_system.cost_center_codex
alert_channel: PEOPLE_ALERTS

table_level_validations:
  has_size:
    greater_than: 1
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: 0
    less_than_or_equal_to: 10
    severity_level: Warning

column_level_validations:
  cost_center_code:
    is_unique:
      severity_level: Error
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Warning
  business:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Warning
  product:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Warning
  brand:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Warning
  vertical:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Warning
  structure:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Warning
  team:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Warning
  owner_l1_person_number:
    custom:
      constraint: "(SELECT COUNT(*) FROM (SELECT 1 FROM datalake_hr_system.cost_center_codex WHERE owner_l1_email IS NOT NULL AND owner_l1_person_number IS NULL GROUP BY cost_center_code HAVING COUNT(*) > 1)) = 0"
      severity_level: Warning
  owner_l2_person_number:
    custom:
      constraint: "(SELECT COUNT(*) FROM (SELECT 1 FROM datalake_hr_system.cost_center_codex WHERE owner_l2_email IS NOT NULL AND owner_l2_person_number IS NULL GROUP BY cost_center_code HAVING COUNT(*) > 1)) = 0"
      severity_level: Warning
  owner_l3_person_number:
    custom:
      constraint: "(SELECT COUNT(*) FROM (SELECT 1 FROM datalake_hr_system.cost_center_codex WHERE owner_l3_email IS NOT NULL AND owner_l3_person_number IS NULL GROUP BY cost_center_code HAVING COUNT(*) > 1)) = 0"
      severity_level: Warning
  owner_l1_full_name:
    custom:
      constraint: "(SELECT COUNT(*) FROM (SELECT 1 FROM datalake_hr_system.cost_center_codex WHERE owner_l1_email IS NOT NULL AND owner_l1_full_name IS NULL GROUP BY cost_center_code HAVING COUNT(*) > 1)) = 0"
      severity_level: Warning
  owner_l2_full_name:
    custom:
      constraint: "(SELECT COUNT(*) FROM (SELECT 1 FROM datalake_hr_system.cost_center_codex WHERE owner_l2_email IS NOT NULL AND owner_l2_full_name IS NULL GROUP BY cost_center_code HAVING COUNT(*) > 1)) = 0"
      severity_level: Warning
  owner_l3_full_name:
    custom:
      constraint: "(SELECT COUNT(*) FROM (SELECT 1 FROM datalake_hr_system.cost_center_codex WHERE owner_l3_email IS NOT NULL AND owner_l3_full_name IS NULL GROUP BY cost_center_code HAVING COUNT(*) > 1)) = 0"
      severity_level: Warning
  owner_l1_email:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Warning