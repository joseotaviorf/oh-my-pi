dag:
  name: enrich_hr_system
  schedule_start_date: 2024, 3, 14
  owner: Data People
  documentation:
    dag_purpose: Enrich HR System data.
cluster:
  type: databricks_13_3_min_memory_people_cluster
  access_control_list:
    group_name: people-analytics
    permission_level: CAN_MANAGE
workflow:
  type: query_delta
  layer: enrich
  inner_dependencies:
    assignment_metrics:
      - assignments
    assignment_salaries:
      - assignments
    employee_ids:
      - assignments
  default_extraction_type: full
  has_hive_sync: false
  bucket_config_name: people_bucket
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, ds, 'load_end_date') }}"
  tables_customization:
    assignments:
      extraction_type: incremental
      merge_on: ["id_assignment", "dt_effective_start"]
      z_order_by: ["id_assignment"]
    managers:
      extraction_type: incremental
      merge_on: ["id_assignment", "dt_effective_start"]
      z_order_by: ["id_assignment"]
    demographic_attributes:
      extraction_type: incremental
      merge_on: ["id_person", "legislation_code"]
      z_order_by: ["id_person"]
