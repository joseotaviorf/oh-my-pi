dag:
  name: enrich_hr_system
  schedule_start_date: 2024, 3, 14
  owner: Data People
  documentation:
    dag_purpose: Enrich HR System data.
cluster:
  type: databricks_13_3_min_memory_people_cluster
  access_control_list:
    group_name: people-analytics
    permission_level: CAN_MANAGE
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
workflow:
  type: query_delta
  layer: enrich
  inner_dependencies:
    assignment_metrics:
      - assignments
      - demographic_attributes
      - disability
      - salary_metrics
      - work_relationships
    assignment_salaries:
      - assignments
    employee_ids:
      - assignments
      - employee_info
    assignment_effective_status:
      - assignments
  default_extraction_type: full
  has_hive_sync: false
  bucket_config_name: people_bucket
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, ds, 'load_end_date') }}"
  tables_customization:
    assignments:
      extraction_type: incremental
      merge_on: ["id_assignment", "dt_effective_start"]
      z_order_by: ["id_assignment"]
    managers:
      extraction_type: incremental
      merge_on: ["id_assignment", "dt_effective_start"]
      z_order_by: ["id_assignment"]
  default_table_privileges:
    people-team: ["ALL PRIVILEGES"]
