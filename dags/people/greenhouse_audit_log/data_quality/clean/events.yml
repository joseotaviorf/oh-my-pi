---
table_name: datalake_greenhouse_audit_log_clean.events
alert_channel: PEOPLE_ALERTS

table_level_validations:
  has_size:
    greater_than: 1
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: 0
    less_than_or_equal_to: 50
    severity_level: Warning

column_level_validations:
  id_organization:
    is_complete:
      severity_level: Warning
  event_type:
    is_complete:
      severity_level: Warning
  ts_event:
    is_complete:
      severity_level: Warning
  ts_event_no_missing_hourly_buckets:
    custom:
      # Ensure there are no missing hourly buckets in the previous 3 complete days (excludes today; clean layer).
      constraint: |-
        (WITH bounds AS (
           SELECT
             date_trunc('day', current_timestamp()) AS end_hour_utc,
             date_trunc('day', current_timestamp()) - INTERVAL 3 DAYS AS start_hour_utc
         ),
         expected_hours AS (
           SELECT
             explode(
               sequence(
                 start_hour_utc,
                 end_hour_utc - INTERVAL 1 HOUR,
                 INTERVAL 1 HOUR
               )
             ) AS hour_bucket
           FROM bounds
         ),
         observed_hours AS (
           SELECT DISTINCT
             date_trunc('hour', CAST(ts_event AS TIMESTAMP)) AS hour_bucket
           FROM datalake_greenhouse_audit_log_clean.events
           WHERE CAST(ts_event AS TIMESTAMP) >= (SELECT start_hour_utc FROM bounds)
             AND CAST(ts_event AS TIMESTAMP) < (SELECT end_hour_utc FROM bounds)
         )
         SELECT COUNT(*)
         FROM expected_hours e
         LEFT ANTI JOIN observed_hours o
           ON e.hour_bucket = o.hour_bucket
        ) = 0
      severity_level: Warning
