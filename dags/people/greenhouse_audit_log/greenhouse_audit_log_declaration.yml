dag:
  name: greenhouse_audit_log
  owner: Data People
  callback_by_task: False
  documentation:
    dag_purpose: |
      This DAG ingests audit log events from the Greenhouse Audit Log API.
      Audit log provides a record of important events from the prior thirty days,
      offering insights into who accessed or edited information in Greenhouse Recruiting.
      Schedule: daily at 00:30 America/Sao_Paulo (03:30 UTC while Brazil observes UTC-3).
  schedule_interval: "30 0 * * *"

workflow:
  layer: raw
  has_hive_sync: true
  type: custom_ingestion
  default_extraction_type: "incremental"
  default_partitions: [year, month, day]
  bucket_config_name: people_bucket
  load_spark_job: load_greenhouse_audit_log_raw
  execution_timeout_hours: 12
  default_table_privileges:
    people-analytics:
      - ALL PRIVILEGES
  spark_job_arguments:
    - "{environment}"
    - "{bucket}"
    - "{dag_name}"
    - "{table_name}"
    - "{{ data_interval_start | ds }}"
    - "{partitions}"
    - "{extraction_type}"
    - "{load_start_date}"
    - "{load_end_date}"
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ts, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_end | ts, 'load_end_date') }}"

  tables_customization:

    events:
      merge_schema: true
      vacuum_retention_hours: 168
      vacuum_lite: true
      extra_spark_job_arguments:
        - endpoint: "events"
          date_column_to_partition: "event_time"
          base_filters:
            "after_time": "load_start_date"
            "before_time": "load_end_date"
            "paging": "true"

