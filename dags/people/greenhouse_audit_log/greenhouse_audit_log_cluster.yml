cluster:
  type: consolidation_xs_memory_cluster
  databricks_conn_id: databricks_new
  access_control_list:
    group_name: people-analytics
    permission_level: CAN_MANAGE
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
    driver_node_type_id: r7g.xlarge
    num_workers: 3
    spark_version: 16.4.x-scala2.12
    aws_attributes:
      ebs_volume_size: 200
      instance_profile_arn: '{{ var.value.instance_profile_secret_arn_people }}'
      first_on_demand: 1
      availability: SPOT_WITH_FALLBACK
validation:
  cluster:
    type: emr_7_12_consolidation_xs_memory_fleet_cluster
    custom_configurations:
      task_nodes:
        instance_types:
        - r6g.xlarge
        - r7g.xlarge
        - r6i.xlarge
        target_on_demand: 0
        target_spot: 1
        allocation_strategy: price-capacity-optimized
        bid_price_percentage: 100
      core_nodes:
        target_on_demand: 2
        target_spot: 0
        instance_types:
        - r6g.xlarge
        - r7g.xlarge
        - r6i.xlarge
      aws_attributes:
        instance_profile_arn: '{{ var.value.emr_instance_profile_arn_people }}'
  allow_custom_spark_job: true
