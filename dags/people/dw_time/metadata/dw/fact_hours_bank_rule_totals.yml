---
database_name: dw_time
table_name: fact_hours_bank_rule_totals
owner: isabella.araujo@quintoandar.com.br
domain: People
description: |
  Hours-bank balances from the workforce time integration and the monthly close snapshot, split by rule or bucket that
  holds minutes for each employee on a calendar day. Grain: one row per employee (PIN person number) × balance date ×
  rule key. Summing minutes_balance_rule for the same person and date gives total minutes across buckets shown in that
  balance snapshot; slice by rule for workforce or payroll support analytics.

  Overtime realized cost (DBP-1515): for closed rows on segments 50% or 60%, amount_overtime_realized_total is an
  **estimate** of premium plus DSR reflection for analytics. Attribute to dt_reference_month (work month). Oracle HCM
  (PIN) is the HR source; **payroll (folha)** is a separate system and is authoritative for paid amounts — lake values
  are not payroll truth until a folha integration exists.

  Population: employees who exist in the time product whose Oitchau externalId (id_external in clean) matches an Oracle
  HCM person_number in dw_people.dim_employee. Reporting: filter is_closed = true for official monthly close balances.
  Join dw_people.dim_employee and dim_hours_bank_rule for labels and segment mapping.
columns:
  sk_hours_bank_rule_total:
    description: "Surrogate key for one grain row (employee, balance date, rule key). Computed as MD5 of the concatenated natural key components. Used for deduplication and fact table joins within this mart."
  sk_employee:
    description: "Employee surrogate key shared across People marts; join dw_people.dim_employee for name, email, and hierarchy."
    lineage:
      - dw_people.dim_employee.sk_employee
  sk_balance_date:
    description: "Date dimension key (YYYYMMDD style) for the balance snapshot day; use with dim_date for week, month, or fiscal reporting."
    lineage:
      - datalake_oitchau_clean.hoursbank_totals.dt_balanced
      - datalake_oitchau_clean.hoursbank_totals_month_close.dt_balanced
      - dw_public.dim_date.sk_date
  sk_hours_bank_rule:
    description: "Foreign key to dw_time.dim_hours_bank_rule for rule package and segment labels. Populated when the normalized map key from the balance JSON matches a segment UUID on the dimension (leading underscores stripped, underscores mapped to hyphens). Null when there is no matching segment."
    lineage:
      - dw_time.dim_hours_bank_rule.sk_hours_bank_rule
  sk_employee_cost_window:
    description: "Foreign key to dw_time.fact_employee_hourly_cost_windows when a salary-rate window was matched for this balance row."
    lineage:
      - dw_time.fact_employee_hourly_cost_windows.sk_employee_cost_window
  sk_hourly_rate_segment_started_date:
    description: "Date dimension key for the start date of the matched hourly-rate window."
    lineage:
      - dw_time.fact_employee_hourly_cost_windows.dt_hourly_cost_segment_started
      - dw_public.dim_date.sk_date
  sk_hourly_rate_segment_ended_date:
    description: "Date dimension key for the end date of the matched hourly-rate window. Null when the rate window is open-ended."
    lineage:
      - dw_time.fact_employee_hourly_cost_windows.dt_hourly_cost_segment_ended
      - dw_public.dim_date.sk_date
  hours_bank_rule_key:
    description: "Rule or bucket identifier from the time product for this slice of the bank. Use with dim_hours_bank_rule for labels when sk_hours_bank_rule is populated."
    lineage:
      - datalake_oitchau_clean.hoursbank_totals.hours_bank_totals
      - datalake_oitchau_clean.hoursbank_totals_month_close.hours_bank_totals
  person_number:
    description: "Oracle HCM person number (PIN employee code). Natural key for filters, exports, and alignment with HR systems; join dw_people.dim_employee on person_number or sk_employee."
    lineage:
      - dw_people.dim_employee.person_number
  minutes_balance_rule:
    description: "Balance minutes for that employee, date, and rule. Additive measure: sum across rows with the same person and date for total minutes in the snapshot; convert to hours in the reporting layer if needed."
    lineage:
      - datalake_oitchau_clean.hoursbank_totals.hours_bank_totals
      - datalake_oitchau_clean.hoursbank_totals_month_close.hours_bank_totals
  hourly_rate_applied:
    description: "Hourly rate copied from the matched cost window when the balance date falls inside that segment. Null when no window matches, the employee has no cost rows, or employee mapping fails. Same currency as the source rate."
    lineage:
      - datalake_oitchau_clean.employee_costs.hourly_rate_amount
      - dw_time.fact_employee_hourly_cost_windows.hourly_rate_amount
  premium_pct:
    description: |
      Overtime premium percentage from dim_hours_bank_rule.segment_label when the segment is 50 or 60 (for example 50
      for H EXTRAS 50%). Null for non-overtime buckets.
    lineage:
      - dw_time.dim_hours_bank_rule.segment_label
  amount_balance_base:
    description: |
      Base labor value before overtime premium: (minutes_balance_rule / 60) × hourly_rate_applied. Null when
      hourly_rate_applied is null.
  estimated_balance_cost_amount:
    description: |
      Indicative monetary value of the balance row. For closed overtime segments (50% or 60%), equals the estimated
      premium (base × (1 + premium_pct/100)) using Oitchau hourly rate — analogous to folha verbas 11D or 13C but not
      sourced from payroll. For other segments, equals amount_balance_base. Null when hourly_rate_applied is null. For
      premium plus DSR estimate, use amount_overtime_realized_total.
  amount_dsr_on_overtime:
    description: |
      Estimated DSR reflection on overtime premium for closed rows on segments 50 or 60. Computed as premium ×
      (sundays + weekday_holidays_excl_carnival) / mon_sat_workdays on the payment month calendar (ADD_MONTHS of
      dt_reference_month) from dw_public.dim_date. Carnival facultative holidays are excluded from the numerator. Null
      for open balances and non-overtime segments. Folha verba 322 is the authoritative paid DSR; this column is an
      analytics proxy only.
  amount_overtime_realized_total:
    description: |
      Estimated total realized overtime for closed rows on segments 50 or 60: premium plus amount_dsr_on_overtime.
      Directional substitute for folha totals (e.g. verbas 11D + 322) when grouped by person_number and
      dt_reference_month; exact reconciliation requires payroll system integration. For other rows, equals
      amount_balance_base.
  is_in_overtime_realized:
    description: |
      TRUE when the row is from a monthly close snapshot (is_closed) on a 50% or 60% overtime segment. Use with
      dt_reference_month for dashboard realized overtime filters.
  is_closed:
    description: "True when the row comes from the official monthly close snapshot (validated balance); false when the row comes from the daily balance table and can still change after future adjustments."
  dt_reference_month:
    description: |
      First calendar day of the work month for the balance snapshot (month of dt_hours_bank_balanced). Use this column
      — not the folha payment month — when grouping estimated realized overtime for analytics.
  dt_hours_bank_balanced:
    description: "Calendar date of the hours-bank snapshot (source column dt_balanced)."
    lineage:
      - datalake_oitchau_clean.hoursbank_totals.dt_balanced
      - datalake_oitchau_clean.hoursbank_totals_month_close.dt_balanced
  dt_hourly_rate_segment_started:
    description: "Start date of the matched hourly-rate window, copied from fact_employee_hourly_cost_windows for audit and support."
    lineage:
      - datalake_oitchau_clean.employee_costs.dt_period_started
      - dw_time.fact_employee_hourly_cost_windows.dt_hourly_cost_segment_started
  dt_hourly_rate_segment_ended:
    description: "End date of the matched hourly-rate window when closed; null when the matched segment is open-ended in the source."
    lineage:
      - datalake_oitchau_clean.employee_costs.dt_period_ended
      - dw_time.fact_employee_hourly_cost_windows.dt_hourly_cost_segment_ended
  ts_load:
    description: "Warehouse load timestamp for this row (set at ETL run time). Use for operational freshness, not for balance business dates."
