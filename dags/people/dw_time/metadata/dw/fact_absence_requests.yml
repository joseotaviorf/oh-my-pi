database_name: dw_time
table_name: fact_absence_requests
owner: isabella.araujo@quintoandar.com.br
domain: People
description: |-
  Tracks all employee absence requests (vacation, sick leave, parental leave, etc.).
  One row per request. Join on sk_assignment (id_assignment from identifier_mapping) for assignment-level facts such as PLR.
  sk_period_of_service is also available for period-of-service-level joins. Join sk_absence_type to dim_absence_type for the absence category name (e.g. Vacation, Sick Leave).
columns:
  sk_absence_request:
    description: Unique identifier for each absence request.
    lineage:
      - datalake_pin_absence_clean.person_entry.id_per_absence_entry
  sk_absence_started_date:
    description: Absence start date in yyyyMMdd format. Join to dim_date for date attributes.
    lineage:
      - datalake_pin_absence_clean.person_entry.dt_started
  sk_absence_ended_date:
    description: Absence end date in yyyyMMdd format. Join to dim_date for date attributes.
    lineage:
      - datalake_pin_absence_clean.person_entry.dt_ended
  sk_absence_type:
    description: Absence category (vacation, sick leave, etc.). Join to dim_absence_type for the type name.
    lineage:
      - datalake_pin_absence_clean.person_entry.id_absence_type
  sk_period_of_service:
    description: Period of service associated with the absence request. Available for period-of-service-level joins.
    lineage:
      - datalake_pin_absence_clean.person_entry.id_period_of_service
  sk_assignment:
    description: Assignment identifier (id_assignment from identifier_mapping) associated with the absence request. Use to join assignment-level facts such as fact_plr_monthly.
    lineage:
      - datalake_people.identifier_mapping.id_assignment
  person_number:
    description: Employee registration number. Use to link to other employee tables.
    lineage:
      - datalake_people.identifier_mapping.person_number
  assignment_number:
    description: Work contract or assignment code. Use to link to assignment-related tables.
    lineage:
      - datalake_people.identifier_mapping.assignment_number
  days_requested:
    description: Number of days the employee requested for the absence.
    lineage:
      - datalake_pin_absence_clean.person_entry.days_duration
  days_cash_out_requested:
    description: Vacation cash-out days requested (abono pecuniário) for vacation requests; sold-back vacation days. Null/zero for non-vacation or no cash-out.
    lineage:
      - datalake_pin_absence_clean.person_entry.vacation_cash_out_request
  is_approved:
    description: TRUE when the manager approved the request. FALSE if denied, pending, or withdrawn.
    lineage:
      - datalake_pin_absence_clean.person_entry.approval_status_code
      - datalake_pin_absence_clean.person_entry.absence_status_code
  is_withdrawn:
    description: TRUE when the requester withdrew the absence. Withdrawn invalidates the request above any approval status.
    lineage:
      - datalake_pin_absence_clean.person_entry.absence_status_code
  is_valid:
    description: TRUE when the request is not withdrawn. Use to filter out requests that are no longer valid.
    lineage:
      - datalake_pin_absence_clean.person_entry.absence_status_code
  is_effective:
    description: TRUE when the request is approved and the absence period has started (dt_absence_started <= today). Use for absences that are in effect.
    lineage:
      - datalake_pin_absence_clean.person_entry.approval_status_code
      - datalake_pin_absence_clean.person_entry.absence_status_code
      - datalake_pin_absence_clean.person_entry.dt_started
  is_13th_salary_advance:
    description: TRUE when the employee requested the 13th-salary advance (adiantamento do 13º) with the vacation; FALSE when declined; null when not applicable.
    lineage:
      - datalake_pin_absence_clean.person_entry.advance_13th_salary
  dt_absence_started:
    description: Date when the employee requested the absence to start.
    lineage:
      - datalake_pin_absence_clean.person_entry.dt_started
  dt_absence_ended:
    description: Date when the employee requested the absence to end.
    lineage:
      - datalake_pin_absence_clean.person_entry.dt_ended
  dt_acquisitive_period_started:
    description: Start date of the vacation acquisitive period (período aquisitivo) the request draws from; parsed from the source period attribute.
    lineage:
      - datalake_pin_absence_clean.person_entry.dt_period_started
  dt_acquisitive_period_ended:
    description: End date of the vacation acquisitive period (período aquisitivo) the request draws from; parsed from the source period attribute.
    lineage:
      - datalake_pin_absence_clean.person_entry.dt_period_ended
  ts_load:
    description: When this record was last loaded into the data warehouse.
