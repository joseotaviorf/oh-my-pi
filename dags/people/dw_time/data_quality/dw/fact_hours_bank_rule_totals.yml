---
table_name: dw_time.fact_hours_bank_rule_totals
alert_channel: PEOPLE_ALERTS

table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: -90
    less_than_or_equal_to: 125
    severity_level: Warning

column_level_validations:
  sk_hours_bank_rule_total:
    is_unique:
      severity_level: Warning
    is_complete:
      severity_level: Warning
  sk_employee:
    is_complete:
      severity_level: Warning
  person_number:
    is_complete:
      severity_level: Warning
  sk_balance_date:
    is_complete:
      severity_level: Warning
  dt_hours_bank_balanced:
    is_complete:
      severity_level: Warning
  hours_bank_rule_key:
    is_complete:
      severity_level: Warning
  is_closed:
    is_complete:
      severity_level: Warning
  minutes_balance_rule:
    is_complete:
      severity_level: Warning
  dt_reference_month:
    is_complete:
      severity_level: Warning
  is_in_overtime_realized:
    is_complete:
      severity_level: Warning
  overtime_realized_total_matches_premium_plus_dsr:
    custom:
      # Closed overtime rows: amount_overtime_realized_total must equal premium plus proportional DSR.
      constraint: |-
        (SELECT COUNT(*)
         FROM dw_time.fact_hours_bank_rule_totals
         WHERE is_in_overtime_realized = TRUE
           AND amount_overtime_realized_total IS NOT NULL
           AND estimated_balance_cost_amount IS NOT NULL
           AND amount_dsr_on_overtime IS NOT NULL
           AND ABS(
             amount_overtime_realized_total
             - (estimated_balance_cost_amount + amount_dsr_on_overtime)
           ) > 0.01
        ) = 0
      severity_level: Warning
