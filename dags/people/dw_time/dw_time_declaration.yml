dag:
  name: dw_time
  owner: Data People
  callback_by_task: False
  schedule_start_date: 2026, 4, 29
  documentation:
    dag_purpose: |
      People Data Warehouse schema dw_time for workforce time and attendance analytics. Covers Oitchau integration
      (hours-bank balances, operational request lines, hourly cost windows) and Oracle HCM PIN absence models
      (dim_absence_type, fact_absence_requests, fact_vacation_balances). Dimensions include hours-bank rule slices,
      request subtypes, and absence type reference; facts expose open and closed balances, approval workflows,
      vacation balances, estimated realized overtime cost on fact_hours_bank_rule_totals (dt_reference_month,
      proportional DSR from dim_date; folha-paid amounts require a separate payroll integration), and
      fact_hours_bank_daily_totals for UI-aligned Banco Acumulado (last matured API balance carried forward).

workflow:
  type: query_delta
  layer: dw
  bucket_config_name: people_bucket
  custom_schema: time
  has_hive_sync: true
  serialize_dq_after_default_row: true
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  default_table_privileges:
    people-team: ["ALL PRIVILEGES"]
    people-analytics: ["ALL PRIVILEGES"]
  inner_dependencies:
    fact_hours_bank_rule_totals:
      - dim_hours_bank_rule
      - fact_employee_hourly_cost_windows
    fact_time_attendance_requests:
      - dim_request
    fact_absence_requests:
      - dim_absence_type
  tables_customization:
    dim_absence_type:
      vacuum_retention_hours: 168
      vacuum_lite: true
    dim_hours_bank_rule:
      vacuum_retention_hours: 168
      vacuum_lite: true
    dim_request:
      vacuum_retention_hours: 168
      vacuum_lite: true
    fact_hours_bank_rule_totals:
      z_order_by:
        - sk_employee
        - dt_hours_bank_balanced
      vacuum_retention_hours: 168
      vacuum_lite: true
    fact_hours_bank_daily_totals:
      z_order_by:
        - sk_employee
        - dt_hours_bank_balanced
      vacuum_retention_hours: 168
      vacuum_lite: true
    fact_employee_hourly_cost_windows:
      vacuum_retention_hours: 168
      vacuum_lite: true
    fact_time_attendance_requests:
      vacuum_retention_hours: 168
      vacuum_lite: true
    fact_vacation_balances:
      vacuum_retention_hours: 168
      vacuum_lite: true
    fact_absence_requests:
      vacuum_retention_hours: 168
      vacuum_lite: true
    fact_employee_punches:
      extraction_type: incremental
      merge_on:
        - id_punch
      z_order_by:
        - sk_employee
        - dt_punched
      vacuum_retention_hours: 168
      vacuum_lite: true
