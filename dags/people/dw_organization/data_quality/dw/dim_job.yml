---
table_name: dw_organization.dim_job
alert_channel: PEOPLE_ALERTS

table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: 0
    less_than_or_equal_to: 10
    severity_level: Warning

column_level_validations:
  sk_job:
    is_unique:
      severity_level: Error
    is_complete:
      severity_level: Error
  job_name:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Warning
  job_family:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Warning
  career_track:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Warning
  is_active:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Warning
  ts_updated:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Warning
  ts_load:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Warning
