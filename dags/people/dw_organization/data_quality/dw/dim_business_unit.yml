---
table_name: dw_organization.dim_business_unit
alert_channel: PEOPLE_ALERTS

table_level_validations:
  has_size:
    greater_than: 9
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: 0
    less_than_or_equal_to: 10
    severity_level: Warning

column_level_validations:
  sk_business_unit:
    is_unique:
      severity_level: Error
    is_complete:
      severity_level: Error
  business_unit_name:
    # DW dimension includes an unknown row (-1) with null attributes; allow at most 1 null.
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Warning
  consolidated_business_unit_name:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Warning
  ts_load:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Warning
