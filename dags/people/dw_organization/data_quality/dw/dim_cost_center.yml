---
table_name: dw_organization.dim_cost_center
alert_channel: PEOPLE_ALERTS

table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: 0
    less_than_or_equal_to: 50
    severity_level: Warning

column_level_validations:
  sk_cost_center_version:
    is_unique:
      severity_level: Error
    is_complete:
      severity_level: Error
  dt_valid_from:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Error
  dt_valid_to:
    custom: # SCD2 validity: when end date is set, it must be strictly after start date (exclude DW unknown row with sk = -1).
      constraint: "(SELECT COUNT(*) FROM (SELECT 1 FROM dw_organization.dim_cost_center WHERE sk_cost_center_version <> -1 AND dt_valid_to IS NOT NULL AND dt_valid_to <= dt_valid_from)) = 0"
      severity_level: Error
  cost_center_code:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Error
  cost_center_name:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Warning
  is_active:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Warning
  ts_load:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Warning