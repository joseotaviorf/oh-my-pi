dag:
  name: dw_organization
  owner: Data People
  schedule_start_date: 2026, 2, 11
  documentation:
    dag_purpose: |
      People DW layer for organization structure.
      Holds dimension tables that describe organizational entities (e.g. jobs, cost centers, business units).
      No sensitive or PII data. Currently restricted to the people team; will be made available
      to the entire QuintoAndar once the DW tables are validated.
      dim_cost_center projects datalake_people.cost_center_history (SCD Type 2 built in enrich) and adds sk_cost_center_version; other tables may use SCD Type 1.
      Tables are designed to join primarily to dw_people.fact_employee for reporting and analytics.
cluster:
  type: databricks_16_4_small_memory_people_cluster
  access_control_list:
    group_name: people-analytics
    permission_level: CAN_MANAGE
  databricks_conn_id: databricks_new_env
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
workflow:
  type: query_delta
  layer: dw
  bucket_config_name: people_bucket
  custom_schema: organization
  has_hive_sync: false  # Private to People; Trino has no s3:ListBucket on people bucket.
  # When made public, configure a bucket with public access before re-enabling hive_sync.
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  default_table_privileges:
    people-team: ["ALL PRIVILEGES"]
  tables_customization:
    dim_cost_center:
      vacuum_retention_hours: 168
      vacuum_lite: true
    dim_business_unit:
      vacuum_retention_hours: 168
      vacuum_lite: true
    dim_job:
      vacuum_retention_hours: 168
      vacuum_lite: true
