dag:
  name: dw_organization
  owner: Data People
  callback_by_task: False
  schedule_start_date: 2026, 2, 11
  documentation:
    dag_purpose: |
      People Data Warehouse — organization structure. Delivers dimensions for business units, cost centers, jobs, Product & Tech neotribe missions, and related org reference data for People.
      No sensitive or PII content. Access is limited to the people-analytics team until broader publication is approved.
workflow:
  type: query_delta
  layer: dw
  bucket_config_name: people_bucket
  custom_schema: organization
  has_hive_sync: true
  serialize_dq_after_default_row: true
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  default_table_privileges:
    people-team: ["ALL PRIVILEGES"]
  tables_customization:
    dim_cost_center:
      vacuum_retention_hours: 168
      vacuum_lite: true
      table_properties:
        "delta.enableDeletionVectors": "false"
    dim_business_unit:
      vacuum_retention_hours: 168
      vacuum_lite: true
      table_properties:
        "delta.enableDeletionVectors": "false"
    dim_job:
      vacuum_retention_hours: 168
      vacuum_lite: true
      table_properties:
        "delta.enableDeletionVectors": "false"
    dim_product_tech_neotribe:
      vacuum_retention_hours: 168
      vacuum_lite: true
      table_properties:
        "delta.enableDeletionVectors": "false"
