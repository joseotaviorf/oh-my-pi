---
database_name: dw_organization
table_name: dim_cost_center
owner: gabriel.berger@quintoandar.com.br
domain: People
description: |
  Cost center dimension: codes, names, reporting attributes, HRBP keys, activity, and validity dates for each version of a cost center.
  Each row is one complete attribute set for a version; use is_current and the validity dates to take current attributes only or to time-travel attributes.
  Slowly changing dimension Type 2: one row per sk_cost_center_version, each with its own validity window.
columns:
  sk_cost_center_version:
    description: Versioned surrogate key for the cost center version (MD5 of id_organization and dt_valid_from).
    lineage:
      - datalake_people.cost_center_history.sk_cost_center_version
  cost_center_code:
    description: PIN code that identifies each cost center.
    lineage:
      - datalake_people.cost_center_history.cost_center_code
  id_organization:
    description: Organization identifier (same value across all versions of the cost center).
    lineage:
      - datalake_people.cost_center_history.id_organization
  sk_business_partner_assignment:
    description: Assignment identifier of the HRBP responsible for the cost center in this version.
    lineage:
      - datalake_people.cost_center_history.sk_business_partner_assignment
  sk_business_partner:
    description: Person identifier of the HRBP responsible for the cost center in this version.
    lineage:
      - datalake_people.cost_center_history.sk_business_partner
  hrbp_person_number:
    description: Person number (natural key) of the HRBP responsible for this cost center version.
    lineage:
      - datalake_people.identifier_mapping.person_number
  hrbp_name:
    description: Full name of the HRBP responsible for this cost center version.
    lineage:
      - datalake_people.identifier_mapping.name
  hrbp_work_email:
    description: Work email of the HRBP responsible for this cost center version.
    lineage:
      - datalake_people.identifier_mapping.work_email
  cost_center_name:
    description: Display name of the cost center in the organizational dimension.
    lineage:
      - datalake_people.cost_center_history.cost_center_name
  business:
    description: Business to which the cost center belongs.
    lineage:
      - datalake_people.cost_center_history.business
  product:
    description: Primary product associated with this cost center.
    lineage:
      - datalake_people.cost_center_history.product
  brand:
    description: Brand to which the cost center belongs.
    lineage:
      - datalake_people.cost_center_history.brand
  vertical:
    description: Derived business vertical based on the structure field.
    lineage:
      - datalake_people.cost_center_history.vertical
  structure:
    description: Structure to which the cost center belongs.
    lineage:
      - datalake_people.cost_center_history.structure
  team:
    description: Team to which the cost center belongs.
    lineage:
      - datalake_people.cost_center_history.team
  chapter:
    description: Chapter to which the cost center belongs.
    lineage:
      - datalake_people.cost_center_history.chapter
  line:
    description: Line to which the cost center belongs.
    lineage:
      - datalake_people.cost_center_history.line
  owner_l1_name:
    description: Name of the manager L1 responsible for the cost center (L denotes the management hierarchy layer, L0 is CEO, L1 is directly below L0).
    lineage:
      - datalake_people.cost_center_history.owner_l1_name
  owner_l2_name:
    description: Name of the manager L2 responsible for the cost center (below L1 in the management hierarchy).
    lineage:
      - datalake_people.cost_center_history.owner_l2_name
  owner_l3_name:
    description: Name of the manager L3 responsible for the cost center (below L2 in the management hierarchy).
    lineage:
      - datalake_people.cost_center_history.owner_l3_name
  headcount_type:
    description: Type of headcount present in the cost center (e.g. Capacity, Overhead).
    lineage:
      - datalake_people.cost_center_history.headcount_type
  is_active:
    description: Boolean flag indicating if the cost center is active.
    lineage:
      - datalake_people.cost_center_history.is_active
  dt_valid_from:
    description: Start date of the validity interval for this version.
    lineage:
      - datalake_people.cost_center_history.dt_valid_from
  dt_valid_to:
    description: End date of the validity interval; 9999-12-31 when the version is still current in enrich output.
    lineage:
      - datalake_people.cost_center_history.dt_valid_to
  is_current:
    description: From enrich cost_center_history. When true, the latest version whose validity includes today's date (future-only rows are excluded).
    lineage:
      - datalake_people.cost_center_history.is_current
  ts_created:
    description: Earliest creation timestamp among contributing PIN organization rows for this merged version (from enrich).
    lineage:
      - datalake_people.cost_center_history.ts_created
  ts_load:
    description: Date and time when the record was loaded.
