dag:
  name: enrich_hiring
  schedule_start_date: 2026, 3, 13
  owner: Data People
  callback_by_task: False
  documentation:
    dag_purpose: |-
      Provider-agnostic hiring enrich layer. Consolidates Talent Acquisition data
      (currently sourced from Greenhouse v3 clean tables) into domain-focused tables
      for downstream DW consumption.
workflow:
  type: query_delta
  layer: enrich
  custom_schema: hiring
  default_extraction_type: full
  has_hive_sync: true
  bucket_config_name: people_bucket
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  default_table_privileges:
    people-team: ["ALL PRIVILEGES"]
  tables_customization:
    demographics:
      vacuum_retention_hours: 168
      vacuum_lite: true
    job_openings:
      vacuum_retention_hours: 168
      vacuum_lite: true
