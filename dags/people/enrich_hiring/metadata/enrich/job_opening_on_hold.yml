---
database_name: datalake_hiring
table_name: job_opening_on_hold
owner: pedro.prates@quintoandar.com.br
domain: People
description: Table that identifies all historical and current periods when a job opening was "On Hold". Each row represents a single "On Hold" event (a start and its corresponding end), allowing for duration and status calculation. Sourced from v3 clean openings and close_reasons, with audit_log events.
columns:
  id_job_opening:
    description: Unique identifier for the job opening.
    lineage:
      - datalake_greenhouse_audit_log_clean.events.id_event_target
  id_close_reason:
    description: Identifier for the "On Hold" close reason associated with this event.
    lineage:
      - datalake_greenhouse_audit_log_clean.events.id_close_reason_after_event
      - datalake_greenhouse_audit_log_clean.events.id_close_reason_before_event
  job_opening_code:
    description: Readable code or identifier for the job opening (e.g., "109-3").
    lineage:
      - datalake_greenhouse_v3_clean.openings.code
  close_reason_name:
    description: The name of the "On Hold" reason (e.g., "On Hold - Freezing").
    lineage:
      - datalake_greenhouse_v3_clean.close_reasons.name
  event_order:
    description: Sequential number (1, 2, 3...) for each "On Hold" event for the same job opening, ordered by date. Used to pair start and end events.
    lineage:
      - datalake_greenhouse_audit_log_clean.events.id_close_reason_after_event
      - datalake_greenhouse_audit_log_clean.events.id_event_target
      - datalake_greenhouse_audit_log_clean.events.ts_event
  days_on_hold:
    description: Total number of days the job opening was in this specific "On Hold" period. Calculated as `dt_hold_ended` - `dt_hold_started`. If still on hold, calculates against the ETL load end date.
    lineage:
      - datalake_greenhouse_audit_log_clean.events.dt_closed_after_event
      - datalake_greenhouse_audit_log_clean.events.id_close_reason_after_event
      - datalake_greenhouse_audit_log_clean.events.id_close_reason_before_event
      - datalake_greenhouse_audit_log_clean.events.ts_event
  dt_hold_started:
    description: The date this specific "On Hold" period started.
    lineage:
      - datalake_greenhouse_audit_log_clean.events.dt_closed_after_event
      - datalake_greenhouse_audit_log_clean.events.id_close_reason_after_event
      - datalake_greenhouse_audit_log_clean.events.ts_event
  dt_hold_ended:
    description: The date this specific "On Hold" period ended. If the period is still active, this field will show the ETL load end date.
    lineage:
      - datalake_greenhouse_audit_log_clean.events.id_close_reason_before_event
      - datalake_greenhouse_audit_log_clean.events.ts_event
  is_currently_on_hold:
    description: Boolean flag indicating if this specific "On Hold" period is still active (i.e., has not had an end event).
    lineage:
      - datalake_greenhouse_audit_log_clean.events.id_close_reason_before_event
      - datalake_greenhouse_audit_log_clean.events.ts_event
  ts_latest_event:
    description: Timestamp of the *last* event in the period. This will be the end event's timestamp if the period is closed, or the start event's timestamp if it is still active.
    lineage:
      - datalake_greenhouse_audit_log_clean.events.ts_event
  ts_load:
    description: The timestamp when the record was loaded into the enrich layer.
