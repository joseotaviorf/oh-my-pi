database_name: datalake_oitchau_clean
table_name: employees
owner: isabella.araujo@quintoandar.com.br
domain: People
description: Source is the Oitchau Integrations API ingested into datalake_oitchau_raw.
  Oitchau employee profile snapshot used for timesheet identity and joins to requests
  and hours bank; one row per employee profile UUID after deduplication.
columns:
