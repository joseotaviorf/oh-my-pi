database_name: datalake_oitchau_clean
table_name: punches
owner: isabella.araujo@quintoandar.com.br
domain: People
description: Oitchau clock punches with employee and creator context (clean projection from the Integrations API raw table; incremental by punch date). Duplicate punch ids in raw are collapsed to one row per id_punch (latest ts_load).
columns:
  id_punch:
    description: Identifier from Oitchau (id_punch) used as a natural or surrogate
      key in downstream joins.
    lineage:
    - datalake_oitchau_raw.punches.id
  id_punch_key:
    description: Alternate natural key string from Oitchau (id_punch_key) for joins
      alongside numeric id_punch.
    lineage:
    - datalake_oitchau_raw.punches.uuid
  punch_key:
    description: Business attribute from Oitchau clean projection (punch_key) for
      time and attendance analytics.
    lineage:
    - datalake_oitchau_raw.punches.key
  dt_punched:
    description: Calendar date derived from Oitchau source fields (dt_punched) for daily
      or period analytics.
    lineage:
    - datalake_oitchau_raw.punches.date
  punch_time_local:
    description: Business attribute from Oitchau clean projection (punch_time_local)
      for time and attendance analytics.
    lineage:
    - datalake_oitchau_raw.punches.time
  timezone_name:
    description: Business attribute from Oitchau clean projection (timezone_name)
      for time and attendance analytics.
    lineage:
    - datalake_oitchau_raw.punches.timezone
  punch_type:
    description: Business attribute from Oitchau clean projection (punch_type) for
      time and attendance analytics.
    lineage:
    - datalake_oitchau_raw.punches.type
  punch_status:
    description: Status value from Oitchau (punch_status) for workflow or lifecycle
      reporting.
    lineage:
    - datalake_oitchau_raw.punches.status
  is_manual_adjustment:
    description: Boolean flag from Oitchau (is_manual_adjustment) describing eligibility
      or configuration state.
    lineage:
    - datalake_oitchau_raw.punches.manual
  duration_minutes:
    description: Business attribute from Oitchau clean projection (duration_minutes)
      for time and attendance analytics.
    lineage:
    - datalake_oitchau_raw.punches.minutes
  punch_comment:
    description: Business attribute from Oitchau clean projection (punch_comment)
      for time and attendance analytics.
    lineage:
    - datalake_oitchau_raw.punches.comment
  is_custom_location:
    description: Boolean flag from Oitchau (is_custom_location) describing eligibility
      or configuration state.
    lineage:
    - datalake_oitchau_raw.punches.customLocation
  is_force_validated:
    description: Boolean flag from Oitchau (is_force_validated) describing eligibility
      or configuration state.
    lineage:
    - datalake_oitchau_raw.punches.forceValidated
  late_reason:
    description: Business attribute from Oitchau clean projection (late_reason) for
      time and attendance analytics.
    lineage:
    - datalake_oitchau_raw.punches.lateReason
  id_location:
    description: Identifier from Oitchau (id_location) used as a natural or surrogate
      key in downstream joins.
    lineage:
    - datalake_oitchau_raw.punches.locationId
  punch_reason:
    description: Business attribute from Oitchau clean projection (punch_reason) for
      time and attendance analytics.
    lineage:
    - datalake_oitchau_raw.punches.reason
  punch_source:
    description: Business attribute from Oitchau clean projection (punch_source) for
      time and attendance analytics.
    lineage:
    - datalake_oitchau_raw.punches.source
  validation_status:
