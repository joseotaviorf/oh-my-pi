database_name: dw_employee
table_name: dim_demographic_information
owner: isabella.araujo@quintoandar.com.br
domain: People
description: |-
  Dimension table that stores self-declared demographic attributes of employees, such as ethnicity, gender, and religion.
columns:
  sk_demographic_information:
    description: Surrogate key for the dimension, serving as its unique identifier. Generated from an MD5 hash of the demographic attributes.
    lineage:
    - datalake_hr_system.demographic_attributes.sk_demographic_information
  ethnicity_code:
    description: Internal code for the self-declared ethnicity of the employee.
    lineage:
    - datalake_hr_system.demographic_attributes.ethnicity
  ethnicity_description:
    description: Description corresponding to the ethnicity code (e.g., "Branca", "Parda", "Preta").
    lineage:
    - datalake_hr_system.demographic_attributes.ethnicity
  gender_identity:
    description: Self-declared gender identity of the employee (e.g., "Cisgender Woman", "Transgender Man", "Non-binary").
    lineage:
    - datalake_hr_system.demographic_attributes.gender_identity
  sexual_orientation:
    description: Self-declared sexual orientation of the employee (e.g., "Heterosexual", "Bisexual", "Homosexual").
    lineage:
    - datalake_hr_system.demographic_attributes.sexual_orientation
  neurodiversity:
    description: Self-declared neurodiversity status of the employee (e.g., "Neurotypical", "Autism Spectrum Disorder", "ADHD").
    lineage:
    - datalake_hr_system.demographic_attributes.neurodiversity
  religion:
    description: Self-declared religion or belief system of the employee (e.g., "Christianity", "Agnostic", "Atheist").
    lineage:
    - datalake_hr_system.demographic_attributes.religion
  country_situation:
    description: Migration status of the employee in the country (e.g., "Native", "Immigrant", "Refugee").
    lineage:
    - datalake_hr_system.demographic_attributes.country_situation
  housing_type:
    description: Type of housing the employee currently lives in (e.g., "Own", "Rent", "Lives with relatives").
    lineage:
    - datalake_hr_system.demographic_attributes.housing_type
  quinto_andar_joining_method:
    description: The channel or method through which the employee joined QuintoAndar (e.g., "Employee Referral", "Recruiter", "Job Site").
    lineage:
    - datalake_hr_system.demographic_attributes.quinto_andar_joining_method
  ts_load:
    description: Timestamp indicating when the record was loaded into the table.
