    description: "Surrogate key for the assignment. Just the id_period_of_service"
    lineage:
      - datalake_hr_system.work_relationships.id_period_of_service
  sk_employee:
    description: "Surrogate key for the employee. Just the id_person"
    lineage:
      - datalake_hr_system.work_relationships.id_person
  sk_employee_census:
    description: "Surrogate key for the employee census. MD5 of the demographic attributes"
    lineage:
      - datalake_hr_system.work_relationships.id_person
  sk_cost_center:
    description: "Surrogate key for the cost center. Just the id_cost_center"
    lineage:
      - datalake_hr_system.assignments.id_cost_center
  sk_business_unit:
    description: "Surrogate key for the business unit. Just the id_business_unit"
    lineage:
      - datalake_hr_system.assignments.id_business_unit
  sk_job:
    description: "Surrogate key for the job. Just the id_job"
    lineage:
      - datalake_hr_system.assignments.id_job
  sk_manager:
    description:
      "Surrogate key for dim_employee, with the manager of the employee. Just
      the id_person"
    lineage:
      - datalake_hr_system.assignments.id_assignment
      - datalake_hr_system.assignments.id_person
  sk_manager_assignment:
    description:
      "Surrogate key for dim_assignment with the manager of the employee. Just
      the id_assignment"
    lineage:
      - datalake_hr_system.assignments.id_assignment
      - datalake_hr_system.managers.id_manager_assignment
  sk_business_partner:
    description:
      "Surrogate key for dim_employee, with the business partner of the employee.
      Just the id_person"
    lineage:
      - datalake_hr_system.assignments.representatives.id_person
  sk_business_partner_assignment:
    description:
      "Surrogate key for dim_assignment with the business partner of the employee.
      Just the id_assignment"
    lineage:
      - datalake_hr_system.assignments.representatives.id_assignment
  sk_dt_start_work_relationship:
    description: "Date key for the start of the work relationship. Format: YYYYMMDD"
    lineage:
      - datalake_hr_system.work_relationships.dt_start
  sk_dt_termination_work_relationship:
    description: "Date key for the termination of the work relationship. Format: YYYYMMDD"
    lineage:
      - datalake_hr_system.work_relationships.dt_termination
  is_last_work_relationship:
    description: "Indicates if is the last work relationship of the employee."
    lineage:
      - datalake_hr_system.work_relationships.dt_start
      - datalake_hr_system.work_relationships.id_person
  is_active:
    description: "Indicates if the assignment is active."
    lineage:
      - datalake_hr_system.assignments.assignment_status_type
  is_pending_worker:
    description:
      "Indicates if the worker is pending, that is, the worker is not yet
      active."
    lineage:
      - datalake_hr_system.assignments.assignment_status_type
      - datalake_hr_system.work_relationships.dt_start
  is_manager:
