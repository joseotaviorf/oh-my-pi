database_name: dw_employee
table_name: dim_employee
owner: gabriel.berger@quintoandar.com.br
domain: People
description: Dimension table with information about workers
columns:
  sk_employee:
    description: Surrogate key for the employee
    lineage:
    - datalake_hr_system.employee_info.id_person
  person_number:
    description: Unique identifier for the employee.
    lineage:
    - datalake_hr_system.employee_info.person_number
  full_name:
    description: |
      Preferred display / reference full name for reporting (social name precedence over display_name over documented full name), sourced from People enrich identifier_mapping.name. Exposed as full_name for compatibility with legacy consumers of this table. Use documented_full_name and other documented_* columns for official / document-aligned names from HCM.
    lineage:
    - datalake_people.identifier_mapping.name
  documented_first_name:
    description: Official / document-aligned first name from HCM; may differ from social name parts.
    lineage:
    - datalake_hr_system.employee_info.documented_first_name
  documented_last_name:
    description: Official / document-aligned last name from HCM; may differ from social name parts.
    lineage:
    - datalake_hr_system.employee_info.documented_last_name
  documented_full_name:
    description: Official / document-aligned full name from HCM.
    lineage:
    - datalake_hr_system.employee_info.documented_full_name
  first_social_name:
    description: Employee preferred first name used in internal communications and social contexts.
    lineage:
    - datalake_hr_system.employee_info.first_social_name
  last_social_name:
    description: Employee preferred last name used in internal communications and social contexts.
    lineage:
    - datalake_hr_system.employee_info.last_social_name
  birth_town:
    description: Municipality where the employee was born, as recorded in Oracle HCM person records.
    lineage:
    - datalake_hr_system.employee_info.birth_town
  birth_state:
    description: Birth region of the employee
    lineage:
    - datalake_hr_system.employee_info.birth_state
  birth_country:
    description: Country of birth for the employee used in compliance and demographic reporting.
    lineage:
    - datalake_hr_system.employee_info.birth_country
  mother_name:
    description: Full legal name of the employee mother as required for Brazilian HR documentation.
    lineage:
    - datalake_hr_system.employee_info.mother_name
  father_name:
    description: Full legal name of the employee father when provided in Oracle HCM person records.
    lineage:
    - datalake_hr_system.employee_info.father_name
  gender_code:
    description: gender of employee in document
    lineage:
    - datalake_hr_system.demographic_attributes.gender
  gender:
    description: gender of employee in document
    lineage:
    - datalake_hr_system.demographic_attributes.gender
  marital_status_code:
    description: Oracle lookup code representing the employee current marital status category.
    lineage:
    - datalake_hr_system.demographic_attributes.marital_status
  marital_status_description:
    description: Human-readable label for the employee marital status derived from Oracle lookups.
    lineage:
    - datalake_hr_system_clean.workers.marital_status
  highest_education_level_code:
    description: Lookup code for the highest education credential completed by the employee.
    lineage:
    - datalake_hr_system.demographic_attributes.highest_education_level
  highest_education_level_description:
    description: Name for the highest education level of the employee
    lineage:
    - datalake_hr_system.demographic_attributes.highest_education_level
  age_range:
    description: Banded age bracket grouping employees for anonymized demographic analytics.
    lineage:
    - datalake_hr_system.employee_info.dt_birth
  dt_birth:
    description: Date of birth of the employee
    lineage:
    - datalake_hr_system.employee_info.dt_birth
  ts_load:
    description: Datetime of the load of the record
