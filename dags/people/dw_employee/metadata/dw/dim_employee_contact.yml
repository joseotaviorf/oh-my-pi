    lineage:
    - datalake_hr_system_clean.workers.addresses.TownOrCity
  address_state:
    description: Address state of the employee.
    lineage:
    - datalake_hr_system_clean.workers.addresses.Region2
  address_country:
    description: Address country of the employee.
    lineage:
    - datalake_hr_system_clean.workers.addresses.Country
  ts_last_update:
    description: Timestamp of the last update of the record.
    lineage:
    - datalake_hr_system_clean.workers.addresses.EffectiveStartDate
    - datalake_hr_system_clean.workers.emails.LastUpdateDate
    - datalake_hr_system_clean.workers.phones.LastUpdateDate
  ts_load:
    description: Timestamp of the load of the record.
