    description: Surrogate key for the employee.
    lineage:
    - datalake_hr_system_clean.workers.id_person
  work_email:
    description: Work email of the employee.
    lineage:
    - datalake_hr_system_clean.workers.emails.EmailAddress
  personal_email:
    description: Personal email of the employee.
    lineage:
    - datalake_hr_system_clean.workers.emails.EmailAddress
  country_code_number:
    description: Country code number of the employee.
    lineage:
    - datalake_hr_system_clean.workers.phones.CountryCodeNumber
  area_code:
    description: Area code of the employee.
    lineage:
    - datalake_hr_system_clean.workers.phones.AreaCode
  phone_number:
    description: Phone number of the employee.
    lineage:
    - datalake_hr_system_clean.workers.phones.PhoneNumber
  address:
    description: Address of the employee.
    lineage:
    - datalake_hr_system_clean.workers.addresses.AddlAddressAttribute3
