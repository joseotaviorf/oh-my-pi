database_name: dw_employee
table_name: dim_employee_contact
owner: isabella.araujo@quintoandar.com.br
domain: People
description: Dimension table with contact information of employees.
columns:
  sk_employee:
    description: Surrogate key for the employee.
    lineage:
    - datalake_hr_system_clean.workers.id_person
  work_email:
    description: Corporate email address assigned to the employee for QuintoAndar business communication.
    lineage:
    - datalake_hr_system_clean.workers.emails.EmailAddress
  personal_email:
    description: Personal email address provided by the employee for non-work correspondence.
    lineage:
    - datalake_hr_system_clean.workers.emails.EmailAddress
  country_code_number:
    description: International dialing prefix for the employee primary phone contact.
    lineage:
    - datalake_hr_system_clean.workers.phones.CountryCodeNumber
  area_code:
    description: Regional area code prefix for the employee phone number within the country.
    lineage:
    - datalake_hr_system_clean.workers.phones.AreaCode
  phone_number:
    description: Local subscriber number for the employee primary phone excluding country and area codes.
    lineage:
    - datalake_hr_system_clean.workers.phones.PhoneNumber
  address:
    description: Street name portion of the employee primary residence address.
    lineage:
    - datalake_hr_system_clean.workers.addresses.AddlAddressAttribute3
    - datalake_hr_system_clean.workers.addresses.AddressLine1
  address_number:
    description: Building or street number for the employee primary residence address.
    lineage:
    - datalake_hr_system_clean.workers.addresses.AddressLine2
  address_complement:
    description: Additional address detail such as apartment or suite for the employee residence.
    lineage:
    - datalake_hr_system_clean.workers.addresses.AddressLine3
  address_district:
    description: Neighborhood or bairro of the employee primary residence within the city.
    lineage:
    - datalake_hr_system_clean.workers.addresses.AddressLine4
  address_zip_code:
    description: Postal or ZIP code for mail delivery to the employee primary residence.
    lineage:
    - datalake_hr_system_clean.workers.addresses.PostalCode
  address_city:
    description: City or municipality of the employee primary residence.
    lineage:
    - datalake_hr_system_clean.workers.addresses.TownOrCity
  address_state:
    description: State or province of the employee primary residence.
    lineage:
    - datalake_hr_system_clean.workers.addresses.Region2
  address_country:
    description: Country where the employee primary residence is located.
    lineage:
    - datalake_hr_system_clean.workers.addresses.Country
  ts_last_update:
    description: Timestamp of the last update of the record.
    lineage:
    - datalake_hr_system_clean.workers.addresses.EffectiveStartDate
    - datalake_hr_system_clean.workers.emails.LastUpdateDate
    - datalake_hr_system_clean.workers.phones.LastUpdateDate
  ts_load:
    description: Timestamp of the load of the record.
