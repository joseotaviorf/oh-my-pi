---
database_name: dw_employee
table_name: dim_jobs
owner: isabella.araujo@quintoandar.com.br
domain: People
description: "Dimension table that stores information about job roles, including their structure, career path, and operational attributes within the QuintoAndar Group."
columns:
  sk_job:
    description: "Surrogate key for the job, serving as the unique identifier for this dimension."
    lineage:
      - datalake_hr_system_clean.jobs.id_job
  job_code:
    description: "The unique code assigned to the job role."
    lineage:
      - datalake_hr_system_clean.jobs.job_code
  job_name:
    description: "The official name or title of the job role."
    lineage:
      - datalake_hr_system_clean.jobs.job_name
  band:
    description: "The salary or seniority band associated with the job. The most recent value is considered the current one."
    lineage:
      - datalake_pin.movement_details.band
  comp_ladder_directorate:
    description: "The name of the compensation ladder, which defines the career progression structure for a specific directorate."
    lineage:
      - datalake_hr_system_clean.jobs.comp_ladder_directorate
  comp_ladder_business_unit:
    description: "A grouping of jobs that belong to the same business unit or organizational structure."
    lineage:
      - datalake_hr_system_clean.jobs.id_set
  job_category:
    description: "The job family name, which groups jobs with similar functions or characteristics (e.g., 'Engineering', 'Marketing')."
    lineage:
      - datalake_hr_system_clean.jobs.id_job_family
  career_track:
    description: "The career track for the job. Possible values: 'Líder' (Leader), 'Contribuidor Individual' (Individual Contributor), 'UNKNOWN'."
    lineage:
      - datalake_hr_system_clean.jobs.career_track
  working_hours_regime:
    description: "The legal working hours regime for the job. Possible values: '1 - Submetido a Jornada de Trabalho' (Standard Hours), '3 - Função de Confiança' (Position of Trust), '4 - Teletrabalho (Inciso III Art 62 CLT)' (Remote Work), 'UNKNOWN'."
    lineage:
      - datalake_hr_system_clean.jobs.working_hours_regime
  workload:
    description: "The expected weekly workload in hours and other details related to the job's schedule."
    lineage:
      - datalake_hr_system_clean.jobs.workload
  is_active:
    description: "Flag indicating if the job role is currently active. Possible values: TRUE, FALSE, NULL."
    lineage:
      - datalake_hr_system_clean.jobs.active_status
  has_clock_in:
    description: "Flag indicating if the job requires employees to clock in and out. Possible values are: TRUE, FALSE, NULL."
    lineage:
      - datalake_hr_system_clean.jobs.has_clock_in
  dt_effective_start:
    description: "The start date for when the job information became effective, used for tracking historical changes."
    lineage:
      - datalake_hr_system_clean.jobs.dt_effective_start
  dt_effective_end:
    description: "The end date for the validity of the job record, used for tracking historical changes."
    lineage:
      - datalake_hr_system_clean.jobs.dt_effective_end
