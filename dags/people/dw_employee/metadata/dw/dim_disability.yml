---
database_name: dw_employee
table_name: dim_disability
owner: gabriel.berger@quintoandar.com.br
domain: People
description: Dimension table that stores employee disability information.
columns:
  sk_disability:
    description: Surrogate key for the disability dimension, created with MD5 of documented name, self-declared name, and disability flags for active disabilities.
    lineage:
      - datalake_hr_system.disability.sk_disability
  documented_name:
    description: Disability category name for active documented disabilities only.
    lineage:
      - datalake_hr_system.disability.documented_name_active
  self_declared_name:
    description: Self-declared disability description from lookup table.
    lineage:
      - datalake_hr_system.disability.self_declared_name
  has_documented_disability:
    description: Boolean flag indicating if the employee has an active documented disability.
    lineage:
      - datalake_hr_system.disability.has_documented_active_disability
  has_self_declared_disability:
    description: Boolean flag indicating if the employee has a self-declared disability.
    lineage:
      - datalake_hr_system.disability.has_self_declared_disability
  has_pending_documented_disability:
    description: Boolean flag indicating if the employee has a pending documented disability.
    lineage:
      - datalake_hr_system.disability.has_documented_pending_disability
  ts_load:
    description: Timestamp of when the record was loaded into the table.
