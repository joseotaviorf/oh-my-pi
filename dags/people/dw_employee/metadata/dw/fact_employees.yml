database_name: dw_employee
table_name: fact_employees
owner: isabella.araujo@quintoandar.com.br
domain: people
description: "Table storing detailed information about employees."
columns:
  sk_assignment:
    description: "Unique identifier for the period of service related to the assignment."
    lineage:
      - datalake_hr_system.assignments_metrics.sk_period_of_service
  sk_employee:
    description: "Unique identifier for the person related to the assignment."
    lineage:
      - datalake_hr_system.assignments_metrics.sk_person
  sk_demographic_information:
    description: "Unique identifier for the demographic information related to the assignment."
    lineage:
      - datalake_hr_system.assignments_metrics.sk_demographic_information
  sk_cost_center:
    description: "Unique identifier for the cost center related to the assignment."
    lineage:
      - datalake_hr_system.assignments_metrics.sk_cost_center
  sk_business_unit:
    description: "Unique identifier for the business unit related to the assignment."
    lineage:
      - datalake_hr_system.assignments_metrics.sk_business_unit
  sk_job:
    description: "Unique identifier for the job related to the assignment."
    lineage:
      - datalake_hr_system.assignments_metrics.sk_job
  sk_manager:
    description: "Unique identifier for the manager related to the assignment."
    lineage:
      - datalake_hr_system.assignments_metrics.sk_manager
  sk_manager_assignment:
    description: "Unique identifier for the manager’s assignment."
    lineage:
      - datalake_hr_system.assignments_metrics.sk_manager_assignment
  sk_business_partner:
    description: "Unique identifier for the business partner related to the assignment."
    lineage:
      - datalake_hr_system.assignments_metrics.sk_business_partner
  sk_business_partner_assignment:
    description: "Unique identifier for the business partner’s assignment."
    lineage:
      - datalake_hr_system.assignments_metrics.sk_business_partner_assignment
  sk_start_work_relationship_date:
    description: "Start date of the work relationship related to the assignment, formatted as SK."
    lineage:
      - datalake_hr_system.assignments_metrics.sk_start_work_relationship_date
  sk_hiring_date:
    description: "Hiring date of the employee, formatted as SK."
    lineage:
      - datalake_hr_system.assignments_metrics.sk_hiring_date
  sk_termination_work_relationship_date:
    description: "Termination date of the work relationship related to the assignment, formatted as SK (replacing hyphens with spaces)."
    lineage:
      - datalake_hr_system.assignments_metrics.sk_termination_work_relationship_date
  sk_last_increase_date:
    description: "Date of the last increase related to the assignment, formatted as SK."
    lineage:
      - datalake_hr_system.assignments_metrics.sk_last_increase_date
  sk_first_promotion_date:
    description: "Date of the first promotion related to the assignment, formatted as SK."
    lineage:
      - datalake_hr_system.assignments_metrics.sk_first_promotion_date
  is_active:
    description: "Indicates if the assignment is active (TRUE or FALSE)."
    lineage:
      - datalake_hr_system.assignments_metrics.is_active
  is_pending_worker:
    description: "Indicates if the worker is pending (TRUE or FALSE)."
    lineage:
      - datalake_hr_system.assignments_metrics.is_pending_worker
  is_manager:
    description: "Indicates if the assignment is for a managerial position (TRUE or FALSE)."
    lineage:
      - datalake_hr_system.assignments_metrics.is_manager
  assignment_age_months:
    description: "Age of the assignment in months."
    lineage:
      - datalake_hr_system.assignments_metrics.assignment_age_months
  qnt_directly_led:
    description: "Number of employees directly led by the manager."
    lineage:
      - datalake_hr_system.assignments_metrics.qnt_directly_led
  qnt_undirectly_led:
    description: "Number of employees indirectly led by the manager."
    lineage:
      - datalake_hr_system.assignments_metrics.qnt_undirectly_led
  salary:
    description: "Salary of the assignment."
    lineage:
      - datalake_hr_system.assignments_metrics.salary
  target_plr:
    description: "Target PLR (Profit Sharing)."
    lineage:
      - datalake_hr_system.assignments_metrics.target_plr
  salary_range_midpoint:
    description: "Midpoint of the salary range for the assignment."
    lineage:
      - datalake_hr_system.assignments_metrics.salary_range_midpoint
  qnt_movimentations:
    description: "Number of movements during the assignment."
    lineage:
      - datalake_hr_system.assignments_metrics.qnt_movimentations_employee
  average_time_between_movimentations:
    description: "Average time between movements during the assignment."
    lineage:
      - datalake_hr_system.assignments_metrics.average_time_between_movimentations_employee
  last_increase:
    description: "Last salary increase amount."
    lineage:
      - datalake_hr_system.assignments_metrics.last_increase
  pct_last_increase:
    description: "Last salary increase percentage."
    lineage:
      - datalake_hr_system.assignments_metrics.pct_last_increase
  first_salary:
    description: "Initial salary for the assignment."
    lineage:
      - datalake_hr_system.assignments_metrics.first_salary_employee
  last_salary:
    description: "Most recent salary for the assignment."
    lineage:
      - datalake_hr_system.assignments_metrics.last_salary
  range_salary_movement:
    description: "Salary movement range during the assignment."
    lineage:
      - datalake_hr_system.assignments_metrics.range_salary_movement_employee
  first_promotion_salary:
    description: "Salary after the first promotion."
    lineage:
      - datalake_hr_system.assignments_metrics.first_promotion_salary
  nominal_increase_first_promotion:
    description: "Nominal increase after the first promotion."
    lineage:
      - datalake_hr_system.assignments_metrics.nominal_increase_first_promotion_employee
  pct_increase_first_promotion:
    description: "Percentage increase after the first promotion."
    lineage:
      - datalake_hr_system.assignments_metrics.pct_increase_first_promotion_employee
  months_to_first_promotion:
    description: "Months to the first promotion."
    lineage:
      - datalake_hr_system.assignments_metrics.months_to_first_promotion_employee
  ts_load:
    description: "Timestamp of when the data was loaded."
    lineage:
      - datalake_hr_system.assignments_metrics.NOW()
