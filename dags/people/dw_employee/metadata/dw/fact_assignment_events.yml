database_name: dw_employee
table_name: fact_assignment_events
owner: isabella.araujo@quintoandar.com.br
domain: People
description: |-
  Records key events in the lifecycle of employee assignments, capturing changes such as salary adjustments, role changes, cost center assignments, and team transfers. It enables analysis of various employee-related events, like promotions and department changes.
columns:
  sk_employee:
    description: Unique identifier for the person related to the assignment.
    lineage:
    - datalake_employee_registration.identifier_mapping.id_person
    - datalake_pin.movement_details.id_person
  sk_assignment:
    description: Unique identifier for the period of service related to the assignment.
    lineage:
    - datalake_employee_registration.identifier_mapping.id_period_of_service
    - datalake_pin.movement_details.id_period_of_service
  sk_started_date:
    description: Started date of the event.
    lineage:
    - datalake_hr_system_clean.salaries.dt_from
    - datalake_pin.movement_details.dt_effective_started
  sk_ended_date:
    description: Ended date of the event.
    lineage:
    - datalake_hr_system_clean.salaries.dt_to
    - datalake_pin.movement_details.dt_effective_ended
  event_type:
    description: Type of event being recorded. Can be 'SALARY_ADJUSTMENT' or 'ASSIGNMENT_CHANGE'.
    lineage:
    - datalake_pin_core_clean.action_reason.action_reason_name
    - datalake_pin_core_clean.action_reason.action_reason_code
  event_value:
    description: The value related to the event, such as salary amount or the new assignment name.
    lineage:
    - datalake_hr_system_clean.salaries.salary_amount
    - datalake_pin.movement_details.assignment_name
  action_reason:
    description: The reason or code for the event, such as promotion reason or action code for the assignment change.
    lineage:
    - datalake_hr_system_clean.salaries.action_reason
    - datalake_pin.movement_details.action_code
  currency_code:
    description: Currency code associated with the salary or financial adjustment. It can be null for non-financial events.
    lineage:
    - datalake_hr_system_clean.salaries.currency_code
