database_name: dw_employee
table_name: fact_absence_requests
owner: isabella.araujo@quintoandar.com.br
domain: People
description: |-
  Fact table that records all employee absence requests, including details such as start and end dates, requested days, and request status.
columns:
  sk_absence_request:
    description: Primary key that uniquely identifies each absence request.
    lineage:
    - datalake_pin_absence_clean.person_entry.id_per_absence_entry
  sk_assignment:
    description: Foreign key to the assignment dimension, identifying the employee's period of service associated with the request.
    lineage:
    - datalake_pin_absence_clean.person_entry.id_period_of_service
  sk_absence_type:
    description: Foreign key to the absence type dimension, indicating the category of absence requested.
    lineage:
    - datalake_pin_absence_clean.person_entry.id_absence_type
  sk_absence_request_status:
    description: Foreign key to the absence request status dimension (dim_absence_request_status).
    lineage:
    - datalake_pin_absence_clean.person_entry.approval_status_code
    - datalake_pin_absence_clean.person_entry.absence_status_code
  sk_revision_date:
    description: Foreign key to the date dimension (format yyyyMMdd) for the revision/approval date. Populated with -1 if null.
    lineage:
    - datalake_pin_absence_clean.person_entry.ts_approved
  sk_request_date:
    description: Foreign key to the date dimension (format yyyyMMdd) for the submission date. Populated with -1 if null.
    lineage:
    - datalake_pin_absence_clean.person_entry.dt_submitted
  sk_notification_date:
    description: Foreign key to the date dimension (format yyyyMMdd) for the notification date. Populated with -1 if null.
    lineage:
    - datalake_pin_absence_clean.person_entry.dt_notificated
  sk_absence_started_date:
    description: Foreign key to the date dimension (format yyyyMMdd) for the absence start date. Populated with -1 if null.
    lineage:
    - datalake_pin_absence_clean.person_entry.dt_started
  sk_absence_ended_date:
    description: Foreign key to the date dimension (format yyyyMMdd) for the absence end date. Populated with -1 if null.
    lineage:
    - datalake_pin_absence_clean.person_entry.dt_ended
  request_comments:
    description: Free-text notes submitted by the employee explaining the reason for the absence request.
    lineage:
    - datalake_pin_absence_clean.person_entry.comments
  days_requested:
    description: Total number of days requested for the absence.
    lineage:
    - datalake_pin_absence_clean.person_entry.days_duration
  days_vacation_cash_out:
    description: Vacation days converted to cash (vacation cash-out). Value for absence type 300000004800809; -1 otherwise.
    lineage:
    - datalake_pin_absence_clean.person_entry.id_absence_type
    - datalake_pin_absence_clean.person_entry.vacation_cash_out_request
  is_vacation_request:
    description: |-
      TRUE when the absence is vacation leave (id_absence_type = 300000004800809). See dim_absence_request_status for status context.
    lineage:
    - datalake_pin_absence_clean.person_entry.id_absence_type
  is_approved:
    description: |-
      Main flag for identifying valid absence requests. TRUE when the approver approved the request (approval_status_code = 'APPROVED') and the request is not withdrawn. Withdrawn invalidates the request above any approval status; when is_withdrawn is TRUE, is_approved is always FALSE. See dim_absence_request_status.
    lineage:
    - datalake_pin_absence_clean.person_entry.approval_status_code
    - datalake_pin_absence_clean.person_entry.absence_status_code
  is_denied:
    description: |-
      TRUE when the approver denied the request (approval_status_code = 'DENIED') and the request is not withdrawn. Withdrawn invalidates the request above any approval status; when is_withdrawn is TRUE, is_denied is always FALSE. See dim_absence_request_status.
    lineage:
    - datalake_pin_absence_clean.person_entry.approval_status_code
    - datalake_pin_absence_clean.person_entry.absence_status_code
  is_pending:
    description: |-
      TRUE when the request is pending approval (approval_status_code = 'AWAITING' or 'ORA_AWAIT_AWAIT') and the request is not withdrawn. Withdrawn invalidates the request above any approval status; when is_withdrawn is TRUE, is_pending is always FALSE. See dim_absence_request_status.
    lineage:
    - datalake_pin_absence_clean.person_entry.approval_status_code
    - datalake_pin_absence_clean.person_entry.absence_status_code
  is_withdrawn:
    description: |-
      TRUE when the requester withdrew the absence (absence_status_code = 'ORA_WITHDRAWN'). Withdrawn invalidates the request above any approval status: when TRUE, is_approved, is_denied, and is_pending are always FALSE. See dim_absence_request_status.
    lineage:
    - datalake_pin_absence_clean.person_entry.absence_status_code
  is_open_ended:
    description: TRUE when the absence has no fixed end date.
    lineage:
    - datalake_pin_absence_clean.person_entry.is_open_ended
  has_requested_vacation_cash_out:
    description: TRUE when vacation_cash_out_request is not null.
    lineage:
    - datalake_pin_absence_clean.person_entry.vacation_cash_out_request
  has_requested_13th_salary_advance:
    description: TRUE when the employee requested 13th-salary advance ('S' in source).
    lineage:
    - datalake_pin_absence_clean.person_entry.advance_13th_salary
  dt_requested:
    description: Date when the request was submitted.
    lineage:
    - datalake_pin_absence_clean.person_entry.dt_submitted
  dt_notificated:
    description: Date when the absence was notified.
    lineage:
    - datalake_pin_absence_clean.person_entry.dt_notificated
  dt_absence_started:
    description: Start date of the absence.
    lineage:
    - datalake_pin_absence_clean.person_entry.dt_started
  dt_absence_ended:
    description: End date of the absence.
    lineage:
    - datalake_pin_absence_clean.person_entry.dt_ended
  ts_approved:
    description: Timestamp when the request was approved or revised.
    lineage:
    - datalake_pin_absence_clean.person_entry.ts_approved
  ts_load:
    description: Timestamp when the record was loaded into the table.
