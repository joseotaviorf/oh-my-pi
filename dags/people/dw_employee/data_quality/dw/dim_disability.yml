---
table_name: dw_employee.dim_disability
alert_channel: PEOPLE_ALERTS

table_level_validations:
  has_size:
    greater_than: 30
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: 0
    less_than_or_equal_to: 10
    severity_level: Warning

column_level_validations:
  sk_disability:
    is_unique:
      severity_level: Warning
  documented_name:
    custom:
      constraint: "(SELECT COUNT(*) FROM dw_employee.dim_disability WHERE documented_name LIKE '%*') = 0"
      severity_level: Warning
  self_declared_name:
    custom:
      constraint: "(SELECT COUNT(*) FROM dw_employee.dim_disability WHERE self_declared_name LIKE '%*') = 0"
      severity_level: Warning
