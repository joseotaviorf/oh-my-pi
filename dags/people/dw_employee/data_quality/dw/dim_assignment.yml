---
table_name: dw_employee.dim_assignment
alert_channel: PEOPLE_ALERTS

table_level_validations:
  has_size:
    greater_than: 10050
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: 0
    less_than_or_equal_to: 10
    severity_level: Warning

column_level_validations:
  sk_assignment:
    is_unique:
      severity_level: Warning
  assignment_number:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Warning
  assignment_status_type:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Warning
  legislation_code:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Warning
  ts_load:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Warning
  union_name:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Warning
  worker_type:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Warning
