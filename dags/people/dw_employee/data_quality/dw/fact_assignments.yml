---
table_name: dw_employee.fact_assignments
alert_channel: PEOPLE_ALERTS

table_level_validations:
  has_size:
    greater_than: 10050
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: 0
    less_than_or_equal_to: 10
    severity_level: Warning

column_level_validations:
  sk_assignment:
    is_unique:
      severity_level: Warning
  assignment_age_months:
    is_complete:
      severity_level: Warning
  has_self_declared_disability:
    is_complete:
      severity_level: Warning
  is_active:
    is_complete:
      severity_level: Warning
  is_last_valid_work_relationship:
    is_complete:
      severity_level: Warning
  is_manager:
    is_complete:
      severity_level: Warning
  is_pending_worker:
    is_complete:
      severity_level: Warning
  qnt_directly_led:
    is_complete:
      severity_level: Warning
  qnt_undirectly_led:
    is_complete:
      severity_level: Warning
  ts_load:
    is_complete:
      severity_level: Warning
