dag:
  name: dw_employee
  owner: Data People
  callback_by_task: False
  schedule_start_date: 2024, 4, 1
  documentation:
    dag_purpose: DataWarehouse with information about QuintoAndar Group employees.
cluster:
  type: custom_cluster
  access_control_list:
    group_name: people-analytics
    permission_level: CAN_MANAGE
  databricks_conn_id: databricks_new_env
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
    driver_node_type_id: r5a.2xlarge
    node_type_id: r5a.xlarge
    num_workers: 3
    spark_version: 16.4.x-scala2.12
    aws_attributes:
      ebs_volume_size: 200
      instance_profile_arn: "{{ var.value.instance_profile_secret_arn_people }}"
workflow:
  type: query_delta
  layer: dw
  bucket_config_name: people_bucket
  custom_schema: employee
  has_hive_sync: false
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  default_table_privileges:
    people-team: ["ALL PRIVILEGES"]
  inner_dependencies:
    fact_employees:
    - fact_assignments
  tables_customization:
    dim_absence_request_status:
      vacuum_retention_hours: 168
      vacuum_lite: true
    dim_absence_type:
      vacuum_retention_hours: 168
      vacuum_lite: true
    dim_assignment:
      vacuum_retention_hours: 168
      vacuum_lite: true
    dim_business_unit:
      vacuum_retention_hours: 168
      vacuum_lite: true
    dim_cost_center:
      vacuum_retention_hours: 168
      vacuum_lite: true
    dim_demographic_information:
      vacuum_retention_hours: 168
      vacuum_lite: true
    dim_disability:
      vacuum_retention_hours: 168
      vacuum_lite: true
    dim_employee:
      vacuum_retention_hours: 168
      vacuum_lite: true
    dim_employee_contact:
      vacuum_retention_hours: 168
      vacuum_lite: true
    dim_employee_documentation:
      vacuum_retention_hours: 168
      vacuum_lite: true
    dim_hierarchy:
      vacuum_retention_hours: 168
      vacuum_lite: true
    dim_job:
      vacuum_retention_hours: 168
      vacuum_lite: true
    dim_product_tech:
      vacuum_retention_hours: 168
      vacuum_lite: true
    dim_vacation_status:
      vacuum_retention_hours: 168
      vacuum_lite: true
    fact_absence_requests:
      vacuum_retention_hours: 168
      vacuum_lite: true
    fact_assignment_events:
      vacuum_retention_hours: 168
      vacuum_lite: true
    fact_assignments:
