dag:
  name: dw_employee
  owner: Data People
  schedule_start_date: 2024, 4, 1
  documentation:
    dag_purpose:
      DataWarehouse with information about QuintoAndar Group employees.
workflow:
  type: query_delta
  layer: dw
  bucket_config_name: people_bucket
  custom_schema: employee
  has_hive_sync: false
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, ds, 'load_start_date') }}" 
cluster:
  type: databricks_13_3_min_memory_people_cluster
  access_control_list:
    group_name: people-analytics
    permission_level: CAN_MANAGE