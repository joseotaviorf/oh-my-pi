---
table_name: datalake_pin_compensation_clean.element_entry
alert_channel: PEOPLE_ALERTS
table_level_validations:
  has_size:
    greater_than: 1
    severity_level: Error
column_level_validations:
  id_element_entry:
    is_complete:
      severity_level: Warning
    custom:
      constraint: "(SELECT COUNT(*) FROM (SELECT 1 FROM datalake_pin_compensation_clean.element_entry GROUP BY id_element_entry, object_version_number HAVING COUNT(*) > 1)) = 0"
      severity_level: Warning
  id_person:
    is_complete:
      severity_level: Warning
  id_element_type:
    is_complete:
      severity_level: Warning
