---
table_name: datalake_pin_compensation_clean.salary
alert_channel: PEOPLE_ALERTS
table_level_validations:
  has_size:
    greater_than: 1
    severity_level: Error
column_level_validations:
  id_salary:
    is_complete:
      severity_level: Warning
  one_row_per_salary_and_object_version:
    custom:
      # id_salary + object_version_number should be unique
      constraint: "(SELECT COUNT(*) FROM (SELECT 1 FROM datalake_pin_compensation_clean.salary GROUP BY id_salary, object_version_number HAVING COUNT(*) > 1)) = 0"
      severity_level: Warning
  salary_period_end_must_not_be_before_start:
    custom:
      # Salary records must not have inverted date ranges (dt_started > dt_ended).
      # Currently 0 in production; alerts here to catch source anomalies before they reach the DW.
      constraint: |-
        (SELECT COUNT(*)
         FROM datalake_pin_compensation_clean.salary
         WHERE dt_ended IS NOT NULL
           AND dt_started > dt_ended
        ) = 0
      severity_level: Warning
