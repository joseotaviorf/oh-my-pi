database_name: datalake_pin_compensation_clean
table_name: element_input_value_translation
owner: isabella.araujo@quintoandar.com.br
domain: People
description: |-
  Localized names of payroll input values from Oracle HCM (`pay_input_values_tl`).
  Each record represents the translation of one input value definition for a
  specific language.
columns:
  id_input_value:
    description: Identifier of the input value. Foreign key to `element_input_value`.
    lineage:
    - datalake_pin_compensation_raw.pay_input_values_tl.input_value_id
  id_enterprise:
    description: Oracle HCM enterprise identifier (always `1` at QuintoAndar; no analytical use).
    lineage:
    - datalake_pin_compensation_raw.pay_input_values_tl.enterprise_id
  language:
    description: Language code for which the input value name has been translated (e.g. `US`, `PTB`, `E`).
    lineage:
    - datalake_pin_compensation_raw.pay_input_values_tl.language
  source_language:
    description: Source language code from which the text was translated.
    lineage:
    - datalake_pin_compensation_raw.pay_input_values_tl.source_lang
  input_value_name:
    description: |
      Localized name of the input value (e.g. `Periodicity` in `US`,
      `Periodicidade` in `PTB`). For filtering/joining prefer the stable
      English name in `element_input_value.input_value_name`.
    lineage:
    - datalake_pin_compensation_raw.pay_input_values_tl.name
  created_by:
    description: User who created the translation record.
    lineage:
    - datalake_pin_compensation_raw.pay_input_values_tl.created_by
  updated_by:
    description: User who made the last update to the translation record.
    lineage:
    - datalake_pin_compensation_raw.pay_input_values_tl.last_updated_by
  object_version_number:
    description: Source-system optimistic-locking version; ignore in analytical queries.
    lineage:
    - datalake_pin_compensation_raw.pay_input_values_tl.object_version_number
  ts_created:
    description: Timestamp of when the translation record was created in the source system.
    lineage:
    - datalake_pin_compensation_raw.pay_input_values_tl.creation_date
  ts_updated:
    description: Timestamp of the last update to the translation record in the source system.
    lineage:
    - datalake_pin_compensation_raw.pay_input_values_tl.last_update_date
  ts_load:
    description: Timestamp recording when data was loaded into the clean table.
  year:
    description: Partitioning column representing the year of the last update.
    lineage:
    - datalake_pin_compensation_raw.pay_input_values_tl.year
  month:
    description: Partitioning column representing the month of the last update.
    lineage:
    - datalake_pin_compensation_raw.pay_input_values_tl.month
  day:
    description: Partitioning column representing the day of the last update.
    lineage:
    - datalake_pin_compensation_raw.pay_input_values_tl.day
