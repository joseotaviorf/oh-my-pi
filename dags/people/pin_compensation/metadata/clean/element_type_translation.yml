database_name: datalake_pin_compensation_clean
table_name: element_type_translation
owner: isabella.araujo@quintoandar.com.br
domain: People
description: |-
  Localized names of payroll element types from Oracle HCM (`pay_element_types_tl`).
  Each record represents the translation of one element type for a specific language.
columns:
  id_element_type:
    description: Identifier of the element type. Foreign key to `element_type`.
    lineage:
    - datalake_pin_compensation_raw.pay_element_types_tl.element_type_id
  id_enterprise:
    description: Oracle HCM enterprise identifier (always `1` at QuintoAndar; no analytical use).
    lineage:
    - datalake_pin_compensation_raw.pay_element_types_tl.enterprise_id
  language:
    description: Language code for which the element type name has been translated (e.g. `US`, `PTB`, `E`).
    lineage:
    - datalake_pin_compensation_raw.pay_element_types_tl.language
  source_language:
    description: Source language code from which the text was translated.
    lineage:
    - datalake_pin_compensation_raw.pay_element_types_tl.source_lang
  element_name:
    description: |
      Localized name of the element type (e.g. `PLR - Salary Multiple` in `US`,
      `PLR - Múltiplo Salarial` in `PTB`). For filtering/joining prefer the
      stable English name in `element_type.element_name`.
    lineage:
    - datalake_pin_compensation_raw.pay_element_types_tl.element_name
  reporting_name:
    description: Localized name typically shown on payroll reports.
    lineage:
    - datalake_pin_compensation_raw.pay_element_types_tl.reporting_name
  description:
    description: Localized free-text description of the element type, when filled at the source.
    lineage:
    - datalake_pin_compensation_raw.pay_element_types_tl.description
  created_by:
    description: User who created the translation record.
    lineage:
    - datalake_pin_compensation_raw.pay_element_types_tl.created_by
  updated_by:
    description: User who made the last update to the translation record.
    lineage:
    - datalake_pin_compensation_raw.pay_element_types_tl.last_updated_by
  object_version_number:
    description: Source-system optimistic-locking version; ignore in analytical queries.
    lineage:
    - datalake_pin_compensation_raw.pay_element_types_tl.object_version_number
  ts_created:
    description: Timestamp of when the translation record was created in the source system.
    lineage:
    - datalake_pin_compensation_raw.pay_element_types_tl.creation_date
  ts_updated:
    description: Timestamp of the last update to the translation record in the source system.
    lineage:
    - datalake_pin_compensation_raw.pay_element_types_tl.last_update_date
  ts_load:
    description: Timestamp recording when data was loaded into the clean table.
  year:
    description: Partitioning column representing the year of the last update.
    lineage:
    - datalake_pin_compensation_raw.pay_element_types_tl.year
  month:
    description: Partitioning column representing the month of the last update.
    lineage:
    - datalake_pin_compensation_raw.pay_element_types_tl.month
  day:
    description: Partitioning column representing the day of the last update.
    lineage:
    - datalake_pin_compensation_raw.pay_element_types_tl.day
