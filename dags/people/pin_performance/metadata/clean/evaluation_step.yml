---
database_name: datalake_pin_performance_clean
table_name: evaluation_step
owner: isabella.araujo@quintoandar.com.br
domain: people
description: Stores the various steps involved in the performance evaluation process.
columns:
  id_evaluation_step:
    description: Unique identifier for the evaluation step. Primary key.
    lineage:
      - datalake_pin_performance_raw.hra_eval_steps.eval_step_id
  id_business_group:
    description: Foreign key referencing the business group's organizational units.
    lineage:
      - datalake_pin_performance_raw.hra_eval_steps.business_group_id
  id_evaluation:
    description: Unique identifier of the performance evaluation. Foreign key.
    lineage:
      - datalake_pin_performance_raw.hra_eval_steps.evaluation_id
  id_evaluation_participant:
    description: Identifier of the participant associated with this step in the evaluation.
    lineage:
      - datalake_pin_performance_raw.hra_eval_steps.eval_participant_id
  id_parent_step:
    description: Identifier of the preceding step, if any.
    lineage:
      - datalake_pin_performance_raw.hra_eval_steps.parent_step_id
  id_person_performed_step_update:
    description: Identifier of the person who last updated this step.
    lineage:
      - datalake_pin_performance_raw.hra_eval_steps.step_upd_action_performed_by
  id_person_completed_step:
    description: Identifier of the person who completed this step.
    lineage:
      - datalake_pin_performance_raw.hra_eval_steps.step_completed_by
  id_person_responsible_for_action:
    description: Identifier of the person responsible for taking action on this step.
    lineage:
      - datalake_pin_performance_raw.hra_eval_steps.action_performed_by
  step_code:
    description: Code identifying the specific step in the evaluation process.
    lineage:
      - datalake_pin_performance_raw.hra_eval_steps.step_code
  step_status:
