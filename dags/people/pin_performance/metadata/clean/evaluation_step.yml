    lineage:
      - datalake_pin_performance_raw.hra_eval_steps.standard_alert_days
  object_version_number:
    description: Counter for optimistic locking, incremented on each update to detect concurrent modifications.
    lineage:
      - datalake_pin_performance_raw.hra_eval_steps.object_version_number
  dt_due:
    description: Date by which this step is expected to be completed.
    lineage:
      - datalake_pin_performance_raw.hra_eval_steps.due_date
  ts_created:
    description: Timestamp of when this record was created.
    lineage:
      - datalake_pin_performance_raw.hra_eval_steps.creation_date
  ts_updated:
