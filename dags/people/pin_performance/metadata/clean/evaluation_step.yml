    lineage:
      - datalake_pin_performance_raw.hra_eval_steps.step_upd_action_code
  created_by:
    description: User (email or system username) who created this record.
    lineage:
      - datalake_pin_performance_raw.hra_eval_steps.created_by
  updated_by:
    description: User (email or system username) who last updated this record.
    lineage:
      - datalake_pin_performance_raw.hra_eval_steps.updated_by
  step_sequence_number:
