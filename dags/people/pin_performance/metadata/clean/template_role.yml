---
database_name: datalake_pin_performance_clean
table_name: template_role
owner: isabella.araujo@quintoandar.com.br
domain: people
description: Defines the roles assigned to participants within performance document templates, including role type and participant limits.
columns:
  id_template_role:
    description: Unique identifier for the role within the template. Primary key.
    lineage:
      - datalake_pin_performance_raw.hra_tmpl_roles.tmpl_role_id
  id_business_group:
    description: Foreign key referencing the business group or enterprise context.
    lineage:
      - datalake_pin_performance_raw.hra_tmpl_roles.business_group_id
  id_template_definition:
    description: Foreign key referencing the performance template definition.
    lineage:
      - datalake_pin_performance_raw.hra_tmpl_roles.template_defn_id
  id_role:
    description: Foreign key referencing the specific role definition.
    lineage:
      - datalake_pin_performance_raw.hra_tmpl_roles.role_id
  role_type:
    description: Type of role (e.g., manager, worker, participant).
    lineage:
      - datalake_pin_performance_raw.hra_tmpl_roles.role_type_code
    categories:
      manager: Role of the evaluating manager.
      worker: Role of the employee being evaluated.
      participant: Role of other individuals providing feedback.
  created_by:
    description: User (system username or email) who created this record.
    lineage:
      - datalake_pin_performance_raw.hra_tmpl_roles.created_by
  updated_by:
    description: User (system username or email) who last updated this record.
    lineage:
      - datalake_pin_performance_raw.hra_tmpl_roles.updated_by
  min_participants:
    description: Minimum number of participants required for this role in the template.
    lineage:
      - datalake_pin_performance_raw.hra_tmpl_roles.minimum_num_pcpns
  max_participants:
    description: Maximum number of participants allowed for this role in the template.
    lineage:
      - datalake_pin_performance_raw.hra_tmpl_roles.maximum_num_pcpns
  object_version_number:
    description: Counter for optimistic locking, incremented on each update.
    lineage:
      - datalake_pin_performance_raw.hra_tmpl_roles.object_version_number
  ts_created:
    description: Timestamp indicating when this record was created.
    lineage:
      - datalake_pin_performance_raw.hra_tmpl_roles.creation_date
  ts_updated:
    description: Timestamp indicating when this record was last updated.
    lineage:
      - datalake_pin_performance_raw.hra_tmpl_roles.last_update_date
  ts_load:
    description: Timestamp indicating when the data was loaded into this table. Reflects data ingestion or reprocessing time.
    lineage:
      - datalake_pin_performance_raw.hra_tmpl_roles.NOW()
  year:
    description: Year extracted from the 'ts_updated' column, used for partitioning.
    lineage:
      - datalake_pin_performance_raw.hra_tmpl_roles.year
  month:
    description: Month extracted from the 'ts_updated' column, used for partitioning.
    lineage:
      - datalake_pin_performance_raw.hra_tmpl_roles.month
  day:
    description: Day extracted from the 'ts_updated' column, used for partitioning.
    lineage:
      - datalake_pin_performance_raw.hra_tmpl_roles.day
