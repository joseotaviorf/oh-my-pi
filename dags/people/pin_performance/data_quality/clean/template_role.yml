---
table_name: datalake_pin_performance_clean.template_role
alert_channel: PEOPLE_ALERTS
table_level_validations:
  has_size:
    greater_than: 1
    severity_level: Error
column_level_validations:
  id_template_role:
    is_complete:
      severity_level: Warning
    custom:
      # id_template_role + object_version_number should be unique
      constraint: "(SELECT COUNT(*) FROM (SELECT 1 FROM datalake_pin_performance_clean.template_role GROUP BY id_template_role, object_version_number HAVING COUNT(*) > 1)) = 0"
      severity_level: Warning
