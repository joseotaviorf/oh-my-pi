---
dag:
  name: pin_performance
  schedule_interval: 30 2 * * *
  owner: Data People
  callback_by_task: False
  dag_documentation:
    dag_purpose: >
      This DAG ingests encrypted data from the Oracle HCM system, made
      available via an SFTP server through Oracle Integration Cloud (OIC).

      It downloads, decrypts, parses, and loads the files into both the `incoming` and `raw` layers of the Data Lake.
workflow:
  layer: raw
  custom_schema: pin_performance
  type: custom_ingestion
  bucket_config_name: people_bucket
  has_hive_sync: false
  load_spark_job: load_pin_performance_raw
  default_extraction_type: full
  spark_job_arguments:
    - "{environment}"
    - "{bucket}"
    - "{dag_name}"
    - "{table_name}"
    - "{{ data_interval_start | ds }}"
    - "{partitions}"
    - "{extraction_type}"
    - "{load_start_date}"
    - "{load_end_date}"
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, 1), 'load_end_date') }}"
  default_table_privileges:
    people-team:
      - ALL PRIVILEGES
  tables_customization:
    hra_check_in_meetings:
      clean_table_name: check_in_meeting
      vacuum_retention_hours: 168
      vacuum_lite: true
      extra_spark_job_arguments:
        - raw_custom_schema: pin_performance
          date_column_to_partition: last_update_date
    hra_discussion_topics:
      clean_table_name: discussion_topic
      vacuum_retention_hours: 168
      vacuum_lite: true
      extra_spark_job_arguments:
        - raw_custom_schema: pin_performance
          date_column_to_partition: last_update_date
    hra_eval_items:
      clean_table_name: evaluation_item
      vacuum_retention_hours: 168
      vacuum_lite: true
      extra_spark_job_arguments:
        - raw_custom_schema: pin_performance
          date_column_to_partition: last_update_date
    hra_eval_participants:
      clean_table_name: evaluation_participant
      vacuum_retention_hours: 168
      vacuum_lite: true
      extra_spark_job_arguments:
        - raw_custom_schema: pin_performance
          date_column_to_partition: last_update_date
    hra_eval_ratings:
      clean_table_name: evaluation_rating
      vacuum_retention_hours: 168
      vacuum_lite: true
      extra_spark_job_arguments:
        - raw_custom_schema: pin_performance
          date_column_to_partition: last_update_date
    hra_eval_roles:
      clean_table_name: evaluation_role
      vacuum_retention_hours: 168
      vacuum_lite: true
      extra_spark_job_arguments:
