database_name: datalake_degreed
table_name: contents
owner: gabriel.berger@quintoandar.com.br
domain: People
description: |-
  One row per distinct content item referenced in pathway structure (pathway_details).
  Content is the atomic unit in Learning Hub (courses,videos, articles, podcasts, documents).
  Courses are a specialized content type, usually SCORM, used for mandatory training with automatic completion.
  Use with lesson_contents to link content to lessons and pathway progress.
columns:
  id_content:
    description: Unique identifier for the content item.
    lineage:
    - datalake_degreed_clean.pathway_details.sections.lessons.resources.content_id
    - datalake_degreed_clean.pathway_details.sections.lessons.resources.id
  title:
    description: Title of the content (from first occurrence when deduplicated).
    lineage:
    - datalake_degreed_clean.pathway_details.sections.lessons.resources.title
  description:
    description: Description of the content.
    lineage:
    - datalake_degreed_clean.pathway_details.sections.lessons.resources.description
  resource_type:
    description: Type of resource (e.g. content type).
    lineage:
    - datalake_degreed_clean.pathway_details.sections.lessons.resources.type
  ts_load:
    description: Timestamp when the record was loaded into the enrich layer.
