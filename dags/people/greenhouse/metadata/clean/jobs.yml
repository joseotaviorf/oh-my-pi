database_name: datalake_greenhouse_clean
table_name: jobs
owner: gabriel.berger@quintoandar.com.br
domain: People
description: Table containing job data, sourced from the Greenhouse Harvest API's 'jobs' endpoint.
columns:
  id:
    description: "The job's unique identifier."
    lineage:
      - datalake_greenhouse_raw.jobs.id
  id_copied_from:
    description: "The identifier of the original job, in case this job was copied from another."
    lineage:
      - datalake_greenhouse_raw.jobs.copied_from_id
  id_requisition:
    description: "The requisition ID for the job."
    lineage:
      - datalake_greenhouse_raw.jobs.requisition_id
  id_department:
    description: "The unique identifier for the job's department, based on the first ID present in the department list, following the business rule that a job is associated with a single department."
    lineage:
      - datalake_greenhouse_raw.jobs.departments[0].id
  id_recruiter_responsible:
    description: "The unique identifier of the recruiter marked as responsible for the job."
    lineage:
      - datalake_greenhouse_raw.jobs.hiring_team.recruiters
  id_coordinator_responsible:
    description: "The unique identifier of the coordinator marked as responsible for the job."
    lineage:
      - datalake_greenhouse_raw.jobs.hiring_team.coordinators
  name:
    description: "The name of the job."
    lineage:
      - datalake_greenhouse_raw.jobs.name
  status:
    description: "The current status of the job."
    lineage:
      - datalake_greenhouse_raw.jobs.status
  internal_job_name:
    description: "The internal name for the job position."
    lineage:
      - datalake_greenhouse_raw.jobs.keyed_custom_fields.internal_position_name___quinto_andar_sp.value
  band:
    description: "The salary band for the job."
    lineage:
      - datalake_greenhouse_raw.jobs.keyed_custom_fields.band.value
  career_path:
    description: "The career path associated with the job."
    lineage:
      - datalake_greenhouse_raw.jobs.keyed_custom_fields.career_path.value
  salary_table:
    description: "The salary scale or table for the job."
    lineage:
      - datalake_greenhouse_raw.jobs.keyed_custom_fields.salary_scale.value
  affirmative_focus:
    description: "Specifies the affirmative action focus for the job, if any."
    lineage:
      - datalake_greenhouse_raw.jobs.keyed_custom_fields.affirmative_focus.value
  company:
    description: "The company associated with the job."
    lineage:
      - datalake_greenhouse_raw.jobs.keyed_custom_fields.company.value
  l1_full_name:
    description: "The full name of the primary leadership (L1) for this position."
    lineage:
      - datalake_greenhouse_raw.jobs.keyed_custom_fields.l1.value
  workplace:
    description: "The workplace model for the job."
    lineage:
      - datalake_greenhouse_raw.jobs.keyed_custom_fields.workplace.value
  careers_page_area:
    description: "Name of the area of interest associated with the job on the careers page."
    lineage:
      - datalake_greenhouse_raw.jobs.keyed_custom_fields.careers_page_area_of_interest.value
  employment_type:
    description: "The employment type for the job."
    lineage:
      - datalake_greenhouse_raw.jobs.keyed_custom_fields.employment_type.value
  work_hours:
    description: "The expected work hours for the job."
    lineage:
      - datalake_greenhouse_raw.jobs.keyed_custom_fields.work_hours.value
  notes:
    description: "Notes associated with the job."
    lineage:
      - datalake_greenhouse_raw.jobs.notes
  salary_range_currency:
    description: "The currency for the monthly salary range."
    lineage:
      - datalake_greenhouse_raw.jobs.keyed_custom_fields.monthly_salary_range.value.unit
  plr_currency:
    description: "The currency for the PLR (Profit Sharing) value."
    lineage:
      - datalake_greenhouse_raw.jobs.keyed_custom_fields.plr.value.unit
  rvv_currency:
    description: "The currency for the RVV (Variable Sales Commission) value."
    lineage:
      - datalake_greenhouse_raw.jobs.keyed_custom_fields.rvv.value.unit
  sop_currency:
    description: "The currency for the SOP (Stock Options Plan) value."
    lineage:
      - datalake_greenhouse_raw.jobs.keyed_custom_fields.sop.value.unit
  equity_options_min:
    description: "The minimum monetary value/amount for equity options approval exception range."
    lineage:
      - datalake_greenhouse_raw.jobs.keyed_custom_fields.equity_options_approval_exception_range.value.min_value
  equity_options_max:
    description: "The maximum monetary value/amount for equity options approval exception range."
    lineage:
      - datalake_greenhouse_raw.jobs.keyed_custom_fields.equity_options_approval_exception_range.value.max_value
  salary_range_min:
    description: "The minimum monthly salary for the job."
    lineage:
      - datalake_greenhouse_raw.jobs.keyed_custom_fields.monthly_salary_range.value.min_value
  salary_range_max:
    description: "The maximum monthly salary for the job."
    lineage:
      - datalake_greenhouse_raw.jobs.keyed_custom_fields.monthly_salary_range.value.max_value
  plr:
    description: "The PLR (Profit Sharing) monetary value/amount."
    lineage:
      - datalake_greenhouse_raw.jobs.keyed_custom_fields.plr.value.value
  rvv:
    description: "The RVV (Variable Sales Commission) monetary value/amount."
    lineage:
      - datalake_greenhouse_raw.jobs.keyed_custom_fields.rvv.value.value
  sop:
    description: "The SOP (Stock Options Plan) monetary value/amount."
    lineage:
      - datalake_greenhouse_raw.jobs.keyed_custom_fields.sop.value.value
  is_confidential:
    description: "A boolean flag indicating if the job is confidential."
    lineage:
      - datalake_greenhouse_raw.jobs.confidential
  is_template:
    description: "A boolean flag indicating if the job is a template."
    lineage:
      - datalake_greenhouse_raw.jobs.is_template
  ts_created:
    description: "The timestamp when the job was created."
    lineage:
      - datalake_greenhouse_raw.jobs.created_at
  ts_opened:
    description: "The timestamp when the job was opened."
    lineage:
      - datalake_greenhouse_raw.jobs.opened_at
  ts_closed:
    description: "The timestamp when the job was closed."
    lineage:
      - datalake_greenhouse_raw.jobs.closed_at
  ts_updated:
    description: "The timestamp when the job was last updated."
    lineage:
      - datalake_greenhouse_raw.jobs.updated_at
  ts_load:
    description: "The timestamp when the record was loaded into the clean layer."
  offices:
    description: "An array of structs containing office information (id, name, location)."
    lineage:
      - datalake_greenhouse_raw.jobs.offices
  departments:
    description: "An array of structs containing department information (id, name, code)."
    lineage:
      - datalake_greenhouse_raw.jobs.departments
  hiring_managers:
    description: "An array of structs containing hiring manager information (id, id_employee, name)."
    lineage:
      - datalake_greenhouse_raw.jobs.hiring_team.hiring_managers
  recruiters:
    description: "An array of structs containing recruiter information (id, id_employee, name, is_responsible)."
    lineage:
      - datalake_greenhouse_raw.jobs.hiring_team.recruiters
  coordinators:
    description: "An array of structs containing coordinator information (id, id_employee, name, is_responsible)."
    lineage:
      - datalake_greenhouse_raw.jobs.hiring_team.coordinators
  sourcers:
    description: "An array of structs containing sourcer information."
    lineage:
      - datalake_greenhouse_raw.jobs.hiring_team.sourcers
  openings:
    description: "An array of structs containing openings information."
    lineage:
      - datalake_greenhouse_raw.jobs.hiring_team.openings
  year:
    description: "The year the data was loaded into the raw layer, used for partitioning. Derived from the 'updated_at' column in the raw layer."
    lineage:
      - datalake_greenhouse_raw.jobs.year
  month:
    description: "The month the data was loaded into the raw layer, used for partitioning. Derived from the 'updated_at' column in the raw layer."
    lineage:
      - datalake_greenhouse_raw.jobs.month
  day:
    description: "The day the data was loaded into the raw layer, used for partitioning. Derived from the 'updated_at' column in the raw layer."
    lineage:
      - datalake_greenhouse_raw.jobs.day