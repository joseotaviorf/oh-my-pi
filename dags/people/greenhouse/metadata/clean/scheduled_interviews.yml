---
database_name: datalake_greenhouse_clean
table_name: scheduled_interviews
owner: isabella.araujo@quintoandar.com.br
domain: People
description: Table containing scheduled interview data, sourced from the Greenhouse Harvest API's 'scheduled_interviews' endpoint.
columns:
  id:
    description: The scheduled interview's unique identifier.
    lineage:
      - datalake_greenhouse_raw.scheduled_interviews.id
  id_application:
    description: The application's unique identifier.
    lineage:
      - datalake_greenhouse_raw.scheduled_interviews.application_id
  id_interview:
    description: The interview's unique identifier.
    lineage:
      - datalake_greenhouse_raw.scheduled_interviews.interview.id
  id_organizer:
    description: The organizer's unique identifier.
    lineage:
      - datalake_greenhouse_raw.scheduled_interviews.organizer.id
  id_external_event:
    description: The external event's unique identifier.
    lineage:
      - datalake_greenhouse_raw.scheduled_interviews.external_event_id
  status:
    description: The status of the scheduled interview (e.g., scheduled, complete).
    lineage:
      - datalake_greenhouse_raw.scheduled_interviews.status
  video_conferencing_url:
    description: The URL for the video conference.
    lineage:
      - datalake_greenhouse_raw.scheduled_interviews.video_conferencing_url
  interview_name:
    description: The name of the interview.
    lineage:
      - datalake_greenhouse_raw.scheduled_interviews.interview.name
  organizer_name:
    description: The name of the organizer.
    lineage:
      - datalake_greenhouse_raw.scheduled_interviews.organizer.name
  ts_started:
    description: The start timestamp of the interview.
    lineage:
      - datalake_greenhouse_raw.scheduled_interviews.start.date_time
  ts_ended:
    description: The end timestamp of the interview.
    lineage:
      - datalake_greenhouse_raw.scheduled_interviews.end.date_time
  ts_created:
    description: The timestamp when the interview was scheduled.
    lineage:
      - datalake_greenhouse_raw.scheduled_interviews.created_at
  ts_updated:
    description: The timestamp when the interview was last updated.
    lineage:
      - datalake_greenhouse_raw.scheduled_interviews.updated_at
  ts_load:
    description: The timestamp when the record was loaded into the clean layer.
  interviewers:
    description: An array of structs containing interviewer details (id, name, email, response_status, scorecard_id).
    lineage:
      - datalake_greenhouse_raw.scheduled_interviews.interviewers
  year:
    description: The year the data was loaded into the raw layer, used for partitioning. Derived from the 'updated_at' column in the raw layer.
    lineage:
      - datalake_greenhouse_raw.scheduled_interviews.year
  month:
    description: The month the data was loaded into the raw layer, used for partitioning. Derived from the 'updated_at' column in the raw layer.
    lineage:
      - datalake_greenhouse_raw.scheduled_interviews.month
  day:
    description: The day the data was loaded into the raw layer, used for partitioning. Derived from the 'updated_at' column in the raw layer.
    lineage:
      - datalake_greenhouse_raw.scheduled_interviews.day