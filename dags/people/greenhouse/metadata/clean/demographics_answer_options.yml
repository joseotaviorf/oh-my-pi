database_name: datalake_greenhouse_clean
table_name: demographics_answer_options
owner: isabella.araujo@quintoandar.com.br
domain: People
description: |-
  Table containing answer options for a demographic question, sourced from the Greenhouse Harvest API's 'demographics/answer_options' endpoint.
columns:
  id:
    description: The demographic answer's unique identifier.
    lineage:
    - datalake_greenhouse_raw.demographics_answer_options.id
  id_demographic_question:
    description: The unique identifier for the demographic question to which this answer option belongs.
    lineage:
    - datalake_greenhouse_raw.demographics_answer_options.demographic_question_id
  name:
    description: The name of the answer option.
    lineage:
    - datalake_greenhouse_raw.demographics_answer_options.translations.language
  language:
    description: The language of the answer option.
    lineage:
    - datalake_greenhouse_raw.demographics_answer_options.translations.language
  free_form:
    description: Indicates whether the answer option allows for free-form text input.
    lineage:
    - datalake_greenhouse_raw.demographics_answer_options.free_form
  is_active:
    description: Indicates whether the answer option is currently active.
    lineage:
    - datalake_greenhouse_raw.demographics_answer_options.active
  translations:
    description: Contains translations of the answer option for different languages.
    lineage:
    - datalake_greenhouse_raw.demographics_answer_options.translations
  ts_load:
    description: The timestamp when the record was loaded into the clean layer.
  year:
    description: The year the data was loaded into the raw layer, used for partitioning. Derived from the 'ts_load' column in the raw layer.
    lineage:
    - datalake_greenhouse_raw.demographics_answer_options.year
  month:
    description: The month the data was loaded into the raw layer, used for partitioning. Derived from the 'ts_load' column in the raw layer.
    lineage:
    - datalake_greenhouse_raw.demographics_answer_options.month
  day:
    description: The day the data was loaded into the raw layer, used for partitioning. Derived from the 'ts_load' column in the raw layer.
    lineage:
    - datalake_greenhouse_raw.demographics_answer_options.day
