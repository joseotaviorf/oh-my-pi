database_name: datalake_greenhouse_clean
table_name: demographics_questions
owner: isabella.araujo@quintoandar.com.br
domain: People
description: |-
  Table containing demographic questions, sourced from the Greenhouse Harvest API's 'demographics_questions' endpoint.
columns:
  id:
    description: The demographic question's unique identifier.
    lineage:
    - datalake_greenhouse_raw.demographics_questions.id
  id_demographic_question_set:
    description: The demographic question set's unique identifier.
    lineage:
    - datalake_greenhouse_raw.demographics_questions.demographic_question_set_id
  name:
    description: The name of the demographic question.
    lineage:
    - datalake_greenhouse_raw.demographics_questions.name
  answer_type:
    description: The type of answer expected for the question.
    lineage:
    - datalake_greenhouse_raw.demographics_questions.answer_type
  is_active:
    description: A boolean flag indicating if the question is active.
    lineage:
    - datalake_greenhouse_raw.demographics_questions.active
  is_required:
    description: A boolean flag indicating if the question is required.
    lineage:
    - datalake_greenhouse_raw.demographics_questions.required
  ts_load:
    description: The timestamp when the record was loaded into the clean layer.
  translations:
    description: An array of translations for the question.
    lineage:
    - datalake_greenhouse_raw.demographics_questions.translations
  year:
    description: The year the data was loaded into the raw layer, used for partitioning. Derived from the 'ts_load' column in the raw layer.
    lineage:
    - datalake_greenhouse_raw.demographics_questions.year
  month:
    description: The month the data was loaded into the raw layer, used for partitioning. Derived from the 'ts_load' column in the raw layer.
    lineage:
    - datalake_greenhouse_raw.demographics_questions.month
  day:
    description: The day the data was loaded into the raw layer, used for partitioning. Derived from the 'ts_load' column in the raw layer.
    lineage:
    - datalake_greenhouse_raw.demographics_questions.day
