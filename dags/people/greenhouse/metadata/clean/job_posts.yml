database_name: datalake_greenhouse_clean
table_name: job_posts
owner: isabella.araujo@quintoandar.com.br
domain: People
description: |-
  Table containing job post data, sourced from the Greenhouse Harvest API's 'job_posts' endpoint.
columns:
  id:
    description: The job post's unique identifier.
    lineage:
    - datalake_greenhouse_raw.job_posts.id
  id_job:
    description: The job's unique identifier.
    lineage:
    - datalake_greenhouse_raw.job_posts.job_id
  id_demographic_question_set:
    description: The demographic question set's unique identifier.
    lineage:
    - datalake_greenhouse_raw.job_posts.demographic_question_set_id
  title:
    description: The title of the job post.
    lineage:
    - datalake_greenhouse_raw.job_posts.title
  location_name:
    description: The name of the location for the job post.
    lineage:
    - datalake_greenhouse_raw.job_posts.location.name
  content_html:
    description: The HTML content of the job post.
    lineage:
    - datalake_greenhouse_raw.job_posts.content
  internal_content_html:
    description: The internal HTML content of the job post.
    lineage:
    - datalake_greenhouse_raw.job_posts.internal_content
  is_active:
    description: A boolean flag indicating if the job post is active.
    lineage:
    - datalake_greenhouse_raw.job_posts.active
  is_live:
    description: A boolean flag indicating if the job post is live.
    lineage:
    - datalake_greenhouse_raw.job_posts.live
  is_internal:
    description: A boolean flag indicating if the job post is for internal candidates.
    lineage:
    - datalake_greenhouse_raw.job_posts.internal
  is_external:
    description: A boolean flag indicating if the job post is for external candidates.
    lineage:
    - datalake_greenhouse_raw.job_posts.external
  ts_first_published:
    description: The timestamp when the job post was first published.
    lineage:
    - datalake_greenhouse_raw.job_posts.first_published_at
  ts_updated:
    description: The timestamp when the job post was last updated.
    lineage:
    - datalake_greenhouse_raw.job_posts.updated_at
  ts_created:
    description: The timestamp when the job post was created.
    lineage:
    - datalake_greenhouse_raw.job_posts.created_at
  ts_load:
    description: The timestamp when the record was loaded into the clean layer.
  questions:
    description: An array of questions associated with the job post.
    lineage:
    - datalake_greenhouse_raw.job_posts.questions
  year:
    description: The year the data was loaded into the raw layer, used for partitioning.
    lineage:
    - datalake_greenhouse_raw.job_posts.year
  month:
    description: The month the data was loaded into the raw layer, used for partitioning.
    lineage:
    - datalake_greenhouse_raw.job_posts.month
  day:
    description: The day the data was loaded into the raw layer, used for partitioning.
    lineage:
    - datalake_greenhouse_raw.job_posts.day
