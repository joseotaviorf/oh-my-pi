dag:
  name: greenhouse
  owner: Data People
  documentation:
    dag_purpose: |
      This DAG aims to ingest data from the Greenhouse API (Recruitment).
  schedule_interval: 0 3 * * *
  
cluster:
  type: databricks_13_3_min_memory_people_cluster
  access_control_list:
    group_name: people-analytics
    permission_level: CAN_MANAGE
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
      spark.sql.execution.arrow.pyspark.enabled: True

workflow:
  layer: raw
  has_hive_sync: false
  type: custom_ingestion
  bucket_config_name: people_bucket
  load_spark_job: load_greenhouse_raw
  default_table_privileges:
    people-team:
      - ALL PRIVILEGES
  spark_job_arguments:
    - "{environment}"
    - "{bucket}"
    - "{dag_name}"
    - "{table_name}"
    - "{{ data_interval_start | ds }}"
    - "{partitions}"
    - "{extraction_type}"
    - "{load_start_date}"
    - "{load_end_date}"
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, 1), 'load_end_date') }}"
  tables_customization:
    close_reasons:
      extraction_type: full
      extra_spark_job_arguments:
        - endpoint: "close_reasons"