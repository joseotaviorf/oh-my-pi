---
table_name: datalake_people.business_unit
alert_channel: PEOPLE_ALERTS

table_level_validations:
  has_size:
    greater_than: 1
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: 0
    less_than_or_equal_to: 25
    severity_level: Warning

column_level_validations:
  id_organization:
    is_complete:
      severity_level: Warning
  business_unit_name:
    is_complete:
      severity_level: Warning
  is_active:
    is_complete:
      severity_level: Warning
  version_order:
    is_complete:
      severity_level: Warning
  is_current:
    is_complete:
      severity_level: Warning
  dt_valid_from:
    is_complete:
      severity_level: Warning
  valid_to_must_be_after_valid_from:
    # SCD2 validity: when end date is set, it must be strictly after start date.
    custom:
      constraint: |-
        (SELECT COUNT(*)
         FROM datalake_people.business_unit
         WHERE dt_valid_to IS NOT NULL
           AND dt_valid_to <= dt_valid_from
        ) = 0
      severity_level: Warning
  brazil_main_business_units_have_legislation_code_br:
    custom:
      # Main Brazil business units should resolve to BR legislation_code.
      constraint: |-
        (SELECT COUNT(*)
         FROM datalake_people.business_unit
         WHERE is_current = TRUE
           AND business_unit_name IN ('QuintoAndar SP', 'QuintoAndar MG', 'QuintoAndar SC', 'Atta', 'MLSP', 'Deel - QuintoAndar')
           AND legislation_code IS NOT NULL
           AND legislation_code != 'BR'
        ) = 0
      severity_level: Warning
  non_brazil_business_units_flagged_as_br_legislation:
    custom:
      # International business units outside the main Brazil list should not resolve to BR legislation_code.
      constraint: |-
        (SELECT COUNT(*)
         FROM datalake_people.business_unit
         WHERE is_current = TRUE
           AND business_unit_name NOT IN ('QuintoAndar SP', 'QuintoAndar MG', 'QuintoAndar SC', 'Atta', 'MLSP', 'Deel - QuintoAndar')
           AND legislation_code = 'BR'
        ) = 0
      severity_level: Warning
  ts_load:
    is_complete:
      severity_level: Warning
