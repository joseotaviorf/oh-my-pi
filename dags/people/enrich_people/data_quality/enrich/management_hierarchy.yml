  current_hierarchy_l0_matches_ceo:
    custom:
      # Active employees and employees terminated on or after PIN go-live (2024-03-01)
      # must have L0 equal to a depth-0 CEO whose validity overlaps the same window.
      # Employees terminated before PIN go-live are historical and out of scope.
      constraint: |-
        (SELECT COUNT(*)
         FROM datalake_people.management_hierarchy AS mh
         INNER JOIN datalake_people.identifier_mapping AS im
             ON im.assignment_number = mh.assignment_number
             AND NOT im.is_user_test
             AND (
               im.dt_actual_termination IS NULL
               OR im.dt_actual_termination >= DATE('2024-03-01')
             )
         LEFT JOIN datalake_people.identifier_mapping AS im_l0
             ON im_l0.assignment_number = mh.assignment_number_l0
         WHERE mh.hierarchy_depth > 0
           AND mh.dt_valid_to >= DATE('2024-03-01')
           AND mh.dt_valid_from <= CURRENT_DATE()
           AND NOT COALESCE(im_l0.is_user_test, FALSE)
           AND NOT EXISTS (
             SELECT 1
             FROM datalake_people.management_hierarchy AS ceo
             WHERE ceo.hierarchy_depth = 0
               AND ceo.assignment_number = mh.assignment_number_l0
               AND ceo.dt_valid_to >= GREATEST(mh.dt_valid_from, DATE('2024-03-01'))
               AND ceo.dt_valid_from <= LEAST(mh.dt_valid_to, CURRENT_DATE())
           )
        ) = 0
      severity_level: Warning

  current_hierarchy_path_has_no_duplicates:
    custom:
      # Current L0–L9 path must not repeat an assignment number.
      constraint: |-
        (SELECT COUNT(*)
         FROM (
           SELECT
               filter(
                   array(
                       NULLIF(mh.assignment_number_l0, ''),
                       NULLIF(mh.assignment_number_l1, ''),
                       NULLIF(mh.assignment_number_l2, ''),
                       NULLIF(mh.assignment_number_l3, ''),
                       NULLIF(mh.assignment_number_l4, ''),
                       NULLIF(mh.assignment_number_l5, ''),
                       NULLIF(mh.assignment_number_l6, ''),
                       NULLIF(mh.assignment_number_l7, ''),
                       NULLIF(mh.assignment_number_l8, ''),
                       NULLIF(mh.assignment_number_l9, '')
                   ),
                   x -> x IS NOT NULL
               ) AS path_nodes
           FROM datalake_people.management_hierarchy AS mh
           WHERE mh.is_current = TRUE
         ) AS paths
         WHERE size(path_nodes) > size(array_distinct(path_nodes))
        ) = 0
      severity_level: Warning
