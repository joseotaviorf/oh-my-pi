---
table_name: datalake_people.assignment_snapshots
alert_channel: PEOPLE_ALERTS

table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error

column_level_validations:
  id_assignment:
    is_complete:
      severity_level: Error
  dt_reference:
    is_complete:
      severity_level: Error
  person_number:
    is_complete:
      severity_level: Error
  assignment_number:
    is_complete:
      severity_level: Error
  dt_hired:
    is_complete:
      severity_level: Error
  ts_load:
    is_complete:
      severity_level: Warning
  grain_uniqueness_per_assignment_per_day:
    custom:
      # Grain: one row per (id_assignment, dt_reference). Duplicates indicate a broken dedup in the final ROW_NUMBER step.
      constraint: |-
        (SELECT COUNT(*) FROM (
          SELECT id_assignment, dt_reference
          FROM datalake_people.assignment_snapshots
          GROUP BY id_assignment, dt_reference
          HAVING COUNT(*) > 1
        )) = 0
      severity_level: Error
  ceo_total_report_count_matches_assignment_count:
    custom:
      # Top-of-hierarchy assignments (L0 / no manager) must report as many people as there are active assignments per dt_reference.
      # A mismatch signals that report counts are under-counted or that hierarchy rows are missing.
      constraint: |-
        (SELECT COUNT(*) FROM (
          SELECT dt_reference
          FROM datalake_people.assignment_snapshots
          WHERE COALESCE(is_future_hire, FALSE) = FALSE
          GROUP BY dt_reference
          HAVING
            MAX(
              CASE
                WHEN manager_assignment_number IS NULL AND hierarchy_depth = 0
                THEN COALESCE(count_direct_report, 0) + COALESCE(count_indirect_report, 0)
              END
            ) IS NOT NULL
            AND COUNT(DISTINCT id_assignment) != MAX(
              CASE
                WHEN manager_assignment_number IS NULL AND hierarchy_depth = 0
                THEN COALESCE(count_direct_report, 0) + COALESCE(count_indirect_report, 0)
              END
            )
        )) = 0
      severity_level: Error
  one_current_snapshot_per_assignment:
    custom:
      # Every assignment_number must have exactly one is_current row — the latest day for active assignments,
      # the termination date for terminated ones. More or fewer signals a broken series-end or dedup logic.
      constraint: |-
        (SELECT COUNT(*) FROM (
          SELECT assignment_number
          FROM datalake_people.assignment_snapshots
          GROUP BY assignment_number
          HAVING SUM(CASE WHEN is_current THEN 1 ELSE 0 END) != 1
        )) = 0
      severity_level: Error
  termination_month_consistency:
    custom:
      # For terminated assignments, the is_current row (the termination date) must fall within the
      # same calendar month as dt_terminated. A mismatch means dt_month_reference is misaligned
      # with the actual termination month, breaking monthly headcount snapshots.
      constraint: |-
        (SELECT COUNT(*) FROM (
          SELECT assignment_number
          FROM datalake_people.assignment_snapshots
          WHERE is_current = TRUE
            AND dt_terminated < DATE('9999-12-31')
            AND TRUNC(dt_month_reference, 'MM') != TRUNC(dt_terminated, 'MM')
        )) = 0
      severity_level: Error
  status_termination_date_consistency:
    custom:
      # Every employee whose termination date is in the past must have is_active = FALSE on their is_current row.
      constraint: |-
        (SELECT COUNT(*)
         FROM datalake_people.assignment_snapshots
         WHERE is_current = TRUE
           AND is_active = TRUE
           AND dt_terminated IS NOT NULL
           AND dt_terminated < CURRENT_DATE()
        ) = 0
      severity_level: Warning
