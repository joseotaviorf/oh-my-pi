---
table_name: datalake_people.identifier_mapping
alert_channel: PEOPLE_ALERTS

table_level_validations:
  has_size:
    greater_than: 1
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    # Allows intentional shrink when excluding P-type rows (~2.6k rows, ~19% of prior baseline).
    greater_than_or_equal_to: -25
    less_than_or_equal_to: 10
    severity_level: Warning

column_level_validations:
  id_assignment:
    is_complete:
      severity_level: Warning
  id_period_of_service:
    is_unique:
      severity_level: Warning
    is_complete:
      severity_level: Warning
  id_continuous_employment_cycle:
    is_complete:
      severity_level: Warning
  id_person:
    is_complete:
      severity_level: Warning
  assignment_number:
    is_unique:
      severity_level: Warning
    is_complete:
      severity_level: Warning
  person_number:
    is_complete:
      severity_level: Warning
  assignment_type:
    is_complete:
      severity_level: Warning
    is_contained_in:
      values: ['E', 'C']
      severity_level: Warning
  assignment_status_type:
    is_complete:
      severity_level: Warning
    is_contained_in:
      values: ['ACTIVE', 'INACTIVE']
      severity_level: Warning
  documented_first_name:
    is_complete:
      severity_level: Warning
  documented_last_name:
    is_complete:
      severity_level: Warning
  documented_full_name:
    # 1 known null case (person_number 137786)
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Warning
  display_name:
    is_complete:
      severity_level: Warning
  name:
    is_complete:
      severity_level: Warning
  is_user_test:
    is_complete:
      severity_level: Warning
  is_active_pin:
    is_complete:
      severity_level: Warning
  is_active:
    is_complete:
      severity_level: Warning
  is_reorganization_termination:
    is_complete:
      severity_level: Warning
  dt_employee_hired:
    is_complete:
      severity_level: Warning
  dt_started:
    is_complete:
      severity_level: Warning
  # dt_actual_termination / dt_notified_termination: null while active; covered by pin_termination_status_consistency.
  ts_load:
    is_complete:
      severity_level: Warning

  employment_cycle_consistency:
    custom:
      # Active employment rows must always have an employment cycle assigned.
      constraint: |-
        (SELECT COUNT(*)
         FROM datalake_people.identifier_mapping
         WHERE is_active_pin = TRUE
           AND assignment_type IN ('E', 'C')
           AND id_continuous_employment_cycle IS NULL
        ) = 0
      severity_level: Warning
  employment_cycle_uniqueness:
    custom:
      # An assignment must belong to exactly one continuous employment cycle — no splits or double-counts.
      constraint: |-
        (SELECT COUNT(*)
         FROM (
           SELECT id_assignment
           FROM datalake_people.identifier_mapping
           GROUP BY id_assignment
           HAVING COUNT(DISTINCT id_continuous_employment_cycle) > 1
         ) violations
        ) = 0
      severity_level: Warning
  employment_cycle_transfer_consistency:
    custom:
      # After a GLB_TRANSFER, the previous and next period-of-service must belong to the same cycle.
      constraint: |-
        (WITH transfer_links_ranked AS (
           SELECT
             aa.id_period_of_service AS previous_id_period_of_service,
             aa_next.id_period_of_service AS next_id_period_of_service,
             ROW_NUMBER() OVER (
               PARTITION BY aa_next.id_period_of_service
               ORDER BY aa.dt_effective_started ASC
             ) AS rn
           FROM datalake_pin_core_clean.all_assignments AS aa
           INNER JOIN datalake_pin_core_clean.all_assignments AS aa_next
             ON aa_next.id_person = aa.id_person
            AND aa_next.assignment_sequence = aa.assignment_sequence + 1
           WHERE aa.assignment_type IN ('E', 'C')
             AND aa_next.assignment_type IN ('E', 'C')
             AND aa.assignment_status_type = 'INACTIVE'
             AND aa.action_code = 'GLB_TRANSFER'
         ),
         transfer_links AS (
           SELECT
             previous_id_period_of_service,
             next_id_period_of_service
           FROM transfer_links_ranked
           WHERE rn = 1
         ),
         period_cycles_ranked AS (
           SELECT
             id_period_of_service,
             id_continuous_employment_cycle,
             ROW_NUMBER() OVER (
               PARTITION BY id_period_of_service
               ORDER BY dt_started ASC NULLS LAST, id_assignment ASC
             ) AS rn
           FROM datalake_people.identifier_mapping
         ),
         period_cycles AS (
           SELECT
             id_period_of_service,
             id_continuous_employment_cycle
           FROM period_cycles_ranked
           WHERE rn = 1
         )
         SELECT COUNT(*)
         FROM transfer_links AS tl
         INNER JOIN period_cycles AS pc_prev
           ON pc_prev.id_period_of_service = tl.previous_id_period_of_service
         INNER JOIN period_cycles AS pc_next
           ON pc_next.id_period_of_service = tl.next_id_period_of_service
         WHERE pc_prev.id_continuous_employment_cycle <> pc_next.id_continuous_employment_cycle
        ) = 0
      severity_level: Warning
  hire_date_completeness:
    custom:
      # Every row must carry a hire date for its continuous employment cycle.
      constraint: |-
        (SELECT COUNT(*)
         FROM datalake_people.identifier_mapping
         WHERE dt_employee_hired IS NULL
        ) = 0
      severity_level: Warning
  pin_termination_status_consistency:
    custom:
      # Oracle must have flipped is_active_pin to FALSE for any termination date before today.
      constraint: |-
        (SELECT COUNT(*)
         FROM datalake_people.identifier_mapping
         WHERE is_active_pin = TRUE
           AND dt_actual_termination IS NOT NULL
           AND dt_actual_termination < CURRENT_DATE
        ) = 0
      severity_level: Warning
  status_termination_date_consistency:
    custom:
      # Every employee whose termination date is in the past must have is_active = FALSE (date-derived).
      constraint: |-
        (SELECT COUNT(*)
         FROM datalake_people.identifier_mapping
         WHERE is_active = TRUE
           AND dt_actual_termination IS NOT NULL
           AND dt_actual_termination < CURRENT_DATE
        ) = 0
      severity_level: Warning
  termination_action_reason_must_be_present:
    custom:
      # PIN Motivo da ação (id_action_reason) should be filled for termination-class assignments
      # on/after official PIN go-live (2024-03-01). Model uses reason sentinel -1 so consumers
      # still resolve action labels; this warns on post-go-live source gaps only.
      constraint: |-
        (SELECT COUNT(*)
         FROM datalake_people.identifier_mapping AS im
         INNER JOIN datalake_pin_core_clean.all_assignments AS aa
           ON aa.id_assignment = im.id_assignment
          AND aa.is_primary
          AND aa.assignment_status_type = 'INACTIVE'
          AND aa.action_code IN (
            'TERMINATION',
            'RESIGNATION',
            'DEATH',
            'GLB_TRANSFER',
            'EXPATRIADO'
          )
         INNER JOIN datalake_pin_core_clean.action_occurrence AS ao
           ON ao.id_action_occurrence = aa.id_action_occurrence
         WHERE im.dt_actual_termination IS NOT NULL
           AND im.dt_actual_termination >= DATE('2024-03-01')
           AND ao.id_action_reason IS NULL
        ) = 0
      severity_level: Warning
  termination_closing_action_must_be_classified:
    custom:
      # First inactive primary E/C row on or after periods_of_service.dt_actual_termination
      # must use a controlled assignment-closure action (TERMINATION, RESIGNATION, DEATH,
      # GLB_TRANSFER, EXPATRIADO). Post-termination corrections (e.g. cost-center updates)
      # must not be the closing action.
      constraint: |-
        (SELECT COUNT(*)
         FROM (
           SELECT
             assignment.id_assignment,
             assignment.action_code,
             ROW_NUMBER() OVER (
               PARTITION BY assignment.id_assignment
               ORDER BY
                 assignment.dt_effective_started ASC,
                 assignment.dt_effective_ended ASC
             ) AS rn
           FROM datalake_pin_core_clean.all_assignments AS assignment
           INNER JOIN datalake_pin_core_clean.periods_of_service AS service
             ON assignment.id_period_of_service = service.id_period_of_service
           WHERE assignment.is_primary = TRUE
             AND assignment.assignment_type IN ('E', 'C')
             AND assignment.assignment_status_type = 'INACTIVE'
             AND service.dt_actual_termination IS NOT NULL
             AND service.dt_actual_termination <= CURRENT_DATE()
             AND assignment.dt_effective_started >= service.dt_actual_termination
         ) AS termination_closing_action
         WHERE termination_closing_action.rn = 1
           AND termination_closing_action.action_code NOT IN (
             'TERMINATION',
             'RESIGNATION',
             'DEATH',
             'GLB_TRANSFER',
             'EXPATRIADO'
           )
        ) = 0
      severity_level: Warning
  termination_type_allowed_values:
    custom:
      # Structural integrity: termination_type is nullable with only these non-null values.
      constraint: |-
        (SELECT COUNT(*)
         FROM datalake_people.identifier_mapping
         WHERE termination_type IS NOT NULL
           AND termination_type NOT IN ('voluntary', 'involuntary', 'pending')
        ) = 0
      severity_level: Warning
  termination_type_pending_should_be_reclassified:
    custom:
      # 'pending' is a counted exit whose closing action is unmapped; flag it so the
      # source event gets classified. Warning so the metric keeps shipping meanwhile.
      constraint: |-
        (SELECT COUNT(*)
         FROM datalake_people.identifier_mapping
         WHERE termination_type = 'pending'
        ) = 0
      severity_level: Warning
  genuine_exit_must_have_termination_type:
    custom:
      # Genuine exits (excluding transfer, expatriate, and effectivation closures) must be classified.
      constraint: |-
        (SELECT COUNT(*)
         FROM datalake_people.identifier_mapping AS im
         WHERE im.dt_actual_termination IS NOT NULL
           AND im.dt_actual_termination < CURRENT_DATE
           AND COALESCE(im.is_transfer_termination, FALSE) = FALSE
           AND COALESCE(im.is_effectivation_termination, FALSE) = FALSE
           AND im.termination_type IS NULL
           AND NOT EXISTS (
             SELECT 1
             FROM datalake_people.event_definition AS ed
             WHERE ed.id_event_definition = im.id_termination_event_definition
               AND ed.action_code = 'EXPATRIADO'
           )
        ) = 0
      severity_level: Warning
  genuine_exit_should_have_resolved_reason:
    custom:
      # Genuine exits should resolve to a termination event; a null id means the
      # reason is unavailable and needs source correction. Warning, not blocking.
      constraint: |-
        (SELECT COUNT(*)
         FROM datalake_people.identifier_mapping
         WHERE dt_actual_termination IS NOT NULL
           AND dt_actual_termination < CURRENT_DATE
           AND COALESCE(is_transfer_termination, FALSE) = FALSE
           AND COALESCE(is_effectivation_termination, FALSE) = FALSE
           AND id_termination_event_definition IS NULL
        ) = 0
      severity_level: Warning
  termination_type_requires_termination_date:
    custom:
      # A non-null termination_type must belong to an assignment that actually closed.
      constraint: |-
        (SELECT COUNT(*)
         FROM datalake_people.identifier_mapping
         WHERE termination_type IS NOT NULL
           AND dt_actual_termination IS NULL
        ) = 0
      severity_level: Warning
  glb_transfer_missing_continuation:
    custom:
      # INACTIVE GLB_TRANSFER after which the person has no assignment at all (no assignment_sequence + 1 continuation and no other E/C assignment on/after the transfer close), which breaks is_transfer_hire / dt_employee_hired chaining. A continuation outside the sequence pattern (e.g. a fresh assignment for the same person) is a valid rejoin, not an error.
      constraint: |-
        (SELECT COUNT(*) FROM (
          SELECT DISTINCT glb.id_assignment
          FROM datalake_pin_core_clean.all_assignments AS glb
          WHERE glb.assignment_type IN ('E', 'C')
            AND glb.assignment_status_type = 'INACTIVE'
            AND glb.action_code = 'GLB_TRANSFER'
            AND NOT EXISTS (
              SELECT 1
              FROM datalake_pin_core_clean.all_assignments AS continuation
              WHERE continuation.id_person = glb.id_person
                AND continuation.id_assignment != glb.id_assignment
                AND continuation.assignment_type IN ('E', 'C')
                AND (
                  continuation.assignment_sequence = glb.assignment_sequence + 1
                  OR continuation.dt_effective_started >= glb.dt_effective_started
                )
            )
        )) = 0
      severity_level: Warning
  assignment_has_mixed_job_family_buckets:
    custom:
      # Warn when an E/C assignment has more than one job-family bucket in PIN history since go-live
      # (Estagiario, Jovem Aprendiz, other). Estagiario↔JA counts as mixed.
      constraint: |-
        (SELECT COUNT(*)
         FROM (
           SELECT
             history.id_assignment
           FROM (
             SELECT
               aa.id_assignment,
               CASE
                 WHEN jft.job_family_name = 'Estagiario' THEN 'Estagiario'
                 WHEN jft.job_family_name = 'Jovem Aprendiz' THEN 'Jovem Aprendiz'
                 WHEN jft.job_family_name IS NOT NULL THEN 'other'
               END AS job_family_bucket
             FROM datalake_pin_core_clean.all_assignments AS aa
             INNER JOIN datalake_people.identifier_mapping AS im
               ON im.id_assignment = aa.id_assignment
              AND im.is_valid_assignment = TRUE
             LEFT JOIN datalake_pin_core_clean.job AS j
               ON j.id_job = aa.id_job
              AND aa.dt_effective_started < j.dt_effective_ended
              AND aa.dt_effective_ended > j.dt_effective_started
             LEFT JOIN datalake_pin_core_clean.job_family_translation AS jft
               ON jft.id_job_family = j.id_job_family
              AND j.dt_effective_started < jft.dt_effective_ended
              AND j.dt_effective_ended > jft.dt_effective_started
             WHERE aa.assignment_type IN ('E', 'C')
               AND aa.dt_effective_ended >= DATE('2024-03-01')
           ) AS history
           WHERE history.job_family_bucket IS NOT NULL
           GROUP BY history.id_assignment
           HAVING COUNT(DISTINCT history.job_family_bucket) > 1
         ) AS violations
        ) = 0
      severity_level: Warning
  assignment_has_mixed_employee_category_buckets:
    custom:
      # Warn when an E/C assignment has more than one employee_category bucket in PIN history since go-live
      # (103, 901, other). 103↔901 counts as mixed.
      constraint: |-
        (SELECT COUNT(*)
         FROM (
           SELECT
             history.id_assignment
           FROM (
             SELECT
               aa.id_assignment,
               CASE
                 WHEN aa.employee_category = '103' THEN '103'
                 WHEN aa.employee_category = '901' THEN '901'
                 WHEN aa.employee_category IS NOT NULL THEN 'other'
               END AS category_bucket
             FROM datalake_pin_core_clean.all_assignments AS aa
             INNER JOIN datalake_people.identifier_mapping AS im
               ON im.id_assignment = aa.id_assignment
              AND im.is_valid_assignment = TRUE
             WHERE aa.assignment_type IN ('E', 'C')
               AND aa.dt_effective_ended >= DATE('2024-03-01')
           ) AS history
           WHERE history.category_bucket IS NOT NULL
           GROUP BY history.id_assignment
           HAVING COUNT(DISTINCT history.category_bucket) > 1
         ) AS violations
        ) = 0
      severity_level: Warning
  assignment_category_and_job_family_bucket_sets_disagree:
    custom:
      # Warn when assignment-level intern/apprentice vs other bucket sets disagree between category and job family.
      constraint: |-
        (SELECT COUNT(*)
         FROM (
           WITH category_flags AS (
             SELECT
               aa.id_assignment,
               MAX(
                 CASE
                   WHEN aa.employee_category IN ('103', '901') THEN 1
                   ELSE 0
                 END
               ) AS has_intern_category,
               MAX(
                 CASE
                   WHEN aa.employee_category IS NOT NULL
                    AND aa.employee_category NOT IN ('103', '901') THEN 1
                   ELSE 0
                 END
               ) AS has_other_category
             FROM datalake_pin_core_clean.all_assignments AS aa
             INNER JOIN datalake_people.identifier_mapping AS im
               ON im.id_assignment = aa.id_assignment
              AND im.is_valid_assignment = TRUE
             WHERE aa.assignment_type IN ('E', 'C')
               AND aa.dt_effective_ended >= DATE('2024-03-01')
             GROUP BY aa.id_assignment
           ),
           job_family_flags AS (
             SELECT
               aa.id_assignment,
               MAX(
                 CASE
                   WHEN jft.job_family_name IN ('Estagiario', 'Jovem Aprendiz') THEN 1
                   ELSE 0
                 END
               ) AS has_intern_job_family,
               MAX(
                 CASE
                   WHEN jft.job_family_name IS NOT NULL
                    AND jft.job_family_name NOT IN ('Estagiario', 'Jovem Aprendiz') THEN 1
                   ELSE 0
                 END
               ) AS has_other_job_family
             FROM datalake_pin_core_clean.all_assignments AS aa
             INNER JOIN datalake_people.identifier_mapping AS im
               ON im.id_assignment = aa.id_assignment
              AND im.is_valid_assignment = TRUE
             LEFT JOIN datalake_pin_core_clean.job AS j
               ON j.id_job = aa.id_job
              AND aa.dt_effective_started < j.dt_effective_ended
              AND aa.dt_effective_ended > j.dt_effective_started
             LEFT JOIN datalake_pin_core_clean.job_family_translation AS jft
               ON jft.id_job_family = j.id_job_family
              AND j.dt_effective_started < jft.dt_effective_ended
              AND j.dt_effective_ended > jft.dt_effective_started
             WHERE aa.assignment_type IN ('E', 'C')
               AND aa.dt_effective_ended >= DATE('2024-03-01')
             GROUP BY aa.id_assignment
           )
           SELECT
             category_flags.id_assignment
           FROM category_flags
           INNER JOIN job_family_flags
             ON job_family_flags.id_assignment = category_flags.id_assignment
           WHERE (
               category_flags.has_intern_category = 1
               AND job_family_flags.has_intern_job_family = 0
               AND job_family_flags.has_other_job_family = 1
             )
             OR (
               job_family_flags.has_intern_job_family = 1
               AND category_flags.has_intern_category = 0
               AND category_flags.has_other_category = 1
             )
         ) AS violations
        ) = 0
      severity_level: Warning
  effectivation_hire_termination_pair_must_be_one_to_one_consecutive:
    custom:
      # Warn when PIN-coded effectivation hire/termination flags are not a one-to-one consecutive pair since go-live.
      constraint: |-
        (SELECT COUNT(*)
         FROM (
           SELECT im_hire.id_assignment
           FROM datalake_people.identifier_mapping AS im_hire
           INNER JOIN datalake_pin_core_clean.all_assignments AS aa_hire
             ON aa_hire.id_assignment = im_hire.id_assignment
           LEFT JOIN datalake_pin_core_clean.all_assignments AS aa_prev
             ON aa_prev.id_person = aa_hire.id_person
            AND aa_prev.assignment_sequence = aa_hire.assignment_sequence - 1
            AND aa_prev.assignment_type IN ('E', 'C')
           LEFT JOIN datalake_people.identifier_mapping AS im_prev
             ON im_prev.id_assignment = aa_prev.id_assignment
           WHERE im_hire.is_effectivation_hire = TRUE
             AND COALESCE(im_hire.dt_started, aa_hire.dt_effective_started) >= DATE('2024-03-01')
             AND COALESCE(im_prev.is_effectivation_termination, FALSE) = FALSE
           UNION
           SELECT im_term.id_assignment
           FROM datalake_people.identifier_mapping AS im_term
           INNER JOIN datalake_pin_core_clean.all_assignments AS aa_term
             ON aa_term.id_assignment = im_term.id_assignment
           LEFT JOIN datalake_pin_core_clean.all_assignments AS aa_next
             ON aa_next.id_person = aa_term.id_person
            AND aa_next.assignment_sequence = aa_term.assignment_sequence + 1
            AND aa_next.assignment_type IN ('E', 'C')
           LEFT JOIN datalake_people.identifier_mapping AS im_next
             ON im_next.id_assignment = aa_next.id_assignment
           WHERE im_term.is_effectivation_termination = TRUE
             AND COALESCE(im_term.dt_actual_termination, im_term.dt_started, aa_term.dt_effective_started)
               >= DATE('2024-03-01')
             AND COALESCE(im_next.is_effectivation_hire, FALSE) = FALSE
         ) AS violations
        ) = 0
      severity_level: Warning
