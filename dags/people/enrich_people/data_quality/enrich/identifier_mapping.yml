---
table_name: datalake_people.identifier_mapping
alert_channel: PEOPLE_ALERTS

table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    # Allows intentional shrink when excluding P-type rows (~2.6k rows, ~19% of prior baseline).
    greater_than_or_equal_to: -25
    less_than_or_equal_to: 10
    severity_level: Warning

column_level_validations:
  id_assignment:
    is_complete:
      severity_level: Error
  id_period_of_service:
    is_unique:
      severity_level: Error
    is_complete:
      severity_level: Error
  id_continuous_employment_cycle:
    is_complete:
      severity_level: Warning
  id_person:
    is_complete:
      severity_level: Warning
  assignment_number:
    is_unique:
      severity_level: Warning
    is_complete:
      severity_level: Warning
  person_number:
    is_complete:
      severity_level: Warning
  assignment_type:
    is_complete:
      severity_level: Warning
    is_contained_in:
      values: ['E', 'C']
      severity_level: Warning
  assignment_status_type:
    is_complete:
      severity_level: Warning
    is_contained_in:
      values: ['ACTIVE', 'INACTIVE']
      severity_level: Warning
  documented_first_name:
    is_complete:
      severity_level: Warning
  documented_last_name:
    is_complete:
      severity_level: Warning
  documented_full_name:
    # 1 known null case (person_number 137786)
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Warning
  display_name:
    is_complete:
      severity_level: Warning
  name:
    is_complete:
      severity_level: Warning
  is_user_test:
    is_complete:
      severity_level: Warning
  is_active_pin:
    is_complete:
      severity_level: Warning
  is_active:
    is_complete:
      severity_level: Warning
  dt_original_hired:
    is_complete:
      severity_level: Warning
  dt_started:
    is_complete:
      severity_level: Warning
  # dt_actual_termination / dt_notified_termination: null while active; covered by pin_termination_status_consistency.
  ts_load:
    is_complete:
      severity_level: Warning

  employment_cycle_consistency:
    custom:
      # Active employment rows must always have an employment cycle assigned.
      constraint: |-
        (SELECT COUNT(*)
         FROM datalake_people.identifier_mapping
         WHERE is_active_pin = TRUE
           AND assignment_type IN ('E', 'C')
           AND id_continuous_employment_cycle IS NULL
        ) = 0
      severity_level: Warning
  employment_cycle_uniqueness:
    custom:
      # An assignment must belong to exactly one continuous employment cycle — no splits or double-counts.
      constraint: |-
        (SELECT COUNT(*)
         FROM (
           SELECT id_assignment
           FROM datalake_people.identifier_mapping
           GROUP BY id_assignment
           HAVING COUNT(DISTINCT id_continuous_employment_cycle) > 1
         ) violations
        ) = 0
      severity_level: Warning
  employment_cycle_transfer_consistency:
    custom:
      # After a GLB_TRANSFER, the previous and next period-of-service must belong to the same cycle.
      constraint: |-
        (WITH transfer_links AS (
           SELECT
             aa.id_period_of_service AS previous_id_period_of_service,
             aa_next.id_period_of_service AS next_id_period_of_service
           FROM datalake_pin_core_clean.all_assignments AS aa
           INNER JOIN datalake_pin_core_clean.all_assignments AS aa_next
             ON aa_next.id_person = aa.id_person
            AND aa_next.assignment_sequence = aa.assignment_sequence + 1
           WHERE aa.assignment_type IN ('E', 'C')
             AND aa_next.assignment_type IN ('E', 'C')
             AND aa.assignment_status_type = 'INACTIVE'
             AND aa.action_code = 'GLB_TRANSFER'
           QUALIFY ROW_NUMBER() OVER (
             PARTITION BY aa_next.id_period_of_service
             ORDER BY aa.dt_effective_started ASC
           ) = 1
         ),
         period_cycles AS (
           SELECT
             id_period_of_service,
             id_continuous_employment_cycle
           FROM datalake_people.identifier_mapping
           QUALIFY ROW_NUMBER() OVER (
             PARTITION BY id_period_of_service
             ORDER BY dt_started ASC NULLS LAST, id_assignment ASC
           ) = 1
         )
         SELECT COUNT(*)
         FROM transfer_links AS tl
         INNER JOIN period_cycles AS pc_prev
           ON pc_prev.id_period_of_service = tl.previous_id_period_of_service
         INNER JOIN period_cycles AS pc_next
           ON pc_next.id_period_of_service = tl.next_id_period_of_service
         WHERE pc_prev.id_continuous_employment_cycle <> pc_next.id_continuous_employment_cycle
        ) = 0
      severity_level: Warning
  hire_date_completeness:
    custom:
      # Every row must carry a hire date for its continuous employment cycle.
      constraint: |-
        (SELECT COUNT(*)
         FROM datalake_people.identifier_mapping
         WHERE dt_original_hired IS NULL
        ) = 0
      severity_level: Warning
  pin_termination_status_consistency:
    custom:
      # Oracle must have flipped is_active_pin to FALSE for any termination date before today.
      constraint: |-
        (SELECT COUNT(*)
         FROM datalake_people.identifier_mapping
         WHERE is_active_pin = TRUE
           AND dt_actual_termination IS NOT NULL
           AND dt_actual_termination < CURRENT_DATE
        ) = 0
      severity_level: Warning
  status_termination_date_consistency:
    custom:
      # Every employee whose termination date is in the past must have is_active = FALSE (date-derived).
      constraint: |-
        (SELECT COUNT(*)
         FROM datalake_people.identifier_mapping
         WHERE is_active = TRUE
           AND dt_actual_termination IS NOT NULL
           AND dt_actual_termination < CURRENT_DATE
        ) = 0
      severity_level: Warning
