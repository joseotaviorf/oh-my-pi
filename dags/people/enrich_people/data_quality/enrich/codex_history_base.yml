---
table_name: datalake_people.codex_history_base
alert_channel: PEOPLE_ALERTS

table_level_validations:
  has_size:
    greater_than: 1
    severity_level: Error
  # Incremental load: row count should not shrink vs prior run; cap spikes (People growing-table default).
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: 0
    less_than_or_equal_to: 25
    severity_level: Warning

column_level_validations:
  id:
    is_unique:
      severity_level: Warning
    is_complete:
      severity_level: Warning
  cost_center_code:
    is_complete:
      severity_level: Warning
  business:
    is_complete:
      severity_level: Warning
  product:
    is_complete:
      severity_level: Warning
  brand:
    is_complete:
      severity_level: Warning
  vertical:
    is_complete:
      severity_level: Warning
  vertical_allowed_values:
    custom:
      # Allowed values only (non-null enforced by is_complete).
      constraint: |-
        (SELECT COUNT(*)
         FROM datalake_people.codex_history_base
         WHERE vertical NOT IN ('Ops', 'Corp', 'Tech')
        ) = 0
      severity_level: Warning
  structure:
    is_complete:
      severity_level: Warning
  team:
    is_complete:
      severity_level: Warning
  dt_closing_month:
    is_complete:
      severity_level: Warning
  headcount_type_allowed_values:
    custom:
      # When set must be Capacity or Overhead (PIN classification).
      constraint: |-
        (SELECT COUNT(*)
         FROM datalake_people.codex_history_base
         WHERE headcount_type IS NOT NULL
           AND headcount_type NOT IN ('Capacity', 'Overhead')
        ) = 0
      severity_level: Warning
  ts_load:
    is_complete:
      severity_level: Warning
