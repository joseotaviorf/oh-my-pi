---
table_name: datalake_people.event_definition
alert_channel: PEOPLE_ALERTS

table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: -10
    less_than_or_equal_to: 20
    severity_level: Warning

column_level_validations:
  id_event_definition:
    is_unique:
      severity_level: Error
    is_complete:
      severity_level: Error
  id_action:
    is_complete:
      severity_level: Error
  id_reason:
    is_complete:
      severity_level: Error
  action_code:
    is_complete:
      severity_level: Error
  reason_code:
    is_complete:
      severity_level: Error
  is_current:
    is_complete:
      severity_level: Error
  dt_valid_from:
    is_complete:
      severity_level: Error
  ts_load:
    is_complete:
      severity_level: Error

  termination_type_action_mapping_is_canonical:
    custom:
      # RESIGNATION->voluntary; TERMINATION/DEATH->involuntary; any other action->NULL.
      constraint: |-
        (SELECT COUNT(*)
         FROM datalake_people.event_definition
         WHERE NOT (
           (action_code = 'RESIGNATION' AND termination_type = 'voluntary')
           OR (action_code IN ('TERMINATION', 'DEATH') AND termination_type = 'involuntary')
           OR (action_code NOT IN ('RESIGNATION', 'TERMINATION', 'DEATH') AND termination_type IS NULL)
         )
        ) = 0
      severity_level: Warning
  assignment_termination_events_are_exhaustively_mapped:
    custom:
      # Every assignment-termination event must use one of the five controlled closing
      # actions; a new/unmapped action means the classification must be extended.
      constraint: |-
        (SELECT COUNT(*)
         FROM datalake_people.event_definition
         WHERE is_assignment_termination_event = TRUE
           AND action_code NOT IN (
             'RESIGNATION', 'TERMINATION', 'DEATH', 'GLB_TRANSFER', 'EXPATRIADO'
           )
        ) = 0
      severity_level: Warning
  assignment_termination_event_labels_are_valid:
    custom:
      # Assignment-termination events need non-null action and reason labels
      # (reason may be the 'Unknown' sentinel, but never NULL).
      constraint: |-
        (SELECT COUNT(*)
         FROM datalake_people.event_definition
         WHERE is_assignment_termination_event = TRUE
           AND (action_name IS NULL OR reason_name IS NULL)
        ) = 0
      severity_level: Warning
