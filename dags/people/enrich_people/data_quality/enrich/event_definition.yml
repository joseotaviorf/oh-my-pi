---
table_name: datalake_people.event_definition
alert_channel: PEOPLE_ALERTS

table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: -10
    less_than_or_equal_to: 20
    severity_level: Warning

column_level_validations:
  id_event_definition:
    is_unique:
      severity_level: Error
    is_complete:
      severity_level: Error
  id_action:
    is_complete:
      severity_level: Error
  id_reason:
    is_complete:
      severity_level: Error
  action_code:
    is_complete:
      severity_level: Error
  reason_code:
    is_complete:
      severity_level: Error
  is_current:
    is_complete:
      severity_level: Error
  dt_valid_from:
    is_complete:
      severity_level: Error
  ts_load:
    is_complete:
      severity_level: Error
