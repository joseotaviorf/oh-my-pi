---
table_name: datalake_people.cost_center_history
alert_channel: PEOPLE_ALERTS

table_level_validations:
  has_size:
    greater_than: 1
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: 0
    less_than_or_equal_to: 25
    severity_level: Warning

column_level_validations:
  sk_cost_center_version:
    is_complete:
      severity_level: Error
    is_unique:
      severity_level: Error
  cost_center_code:
    is_complete:
      severity_level: Warning
  is_primary_organization:
    is_complete:
      severity_level: Warning
  is_future_version:
    is_complete:
      severity_level: Warning
  is_current:
    is_complete:
      severity_level: Warning
  exactly_one_current_version_per_organization_and_cost_center:
    custom:
      # Exactly one is_current row per organization and cost_center_code (same grain as enrich ROW_NUMBER partition)
      constraint: |-
        (SELECT COUNT(*) FROM (
          SELECT
            id_organization,
            cost_center_code
          FROM datalake_people.cost_center_history
          GROUP BY
            id_organization,
            cost_center_code
          HAVING SUM(CASE WHEN is_current THEN 1 ELSE 0 END) <> 1
        )) = 0
      severity_level: Warning
  current_version_must_cover_as_of_when_a_covering_version_exists:
    custom:
      # When any version of the org+code covers D-1, the is_current row must cover D-1 too (stale current windows).
      constraint: |-
        (SELECT COUNT(*) FROM (
          SELECT
            current_row.id_organization,
            current_row.cost_center_code
          FROM datalake_people.cost_center_history AS current_row
          WHERE
            current_row.is_current = TRUE
            AND NOT (
              current_row.dt_valid_from <= DATE_ADD(CURRENT_DATE(), -1)
              AND current_row.dt_valid_to >= DATE_ADD(CURRENT_DATE(), -1)
            )
            AND EXISTS (
              SELECT
                1
              FROM datalake_people.cost_center_history AS covering_row
              WHERE
                covering_row.id_organization = current_row.id_organization
                AND covering_row.cost_center_code = current_row.cost_center_code
                AND covering_row.dt_valid_from <= DATE_ADD(CURRENT_DATE(), -1)
                AND covering_row.dt_valid_to >= DATE_ADD(CURRENT_DATE(), -1)
            )
        )) = 0
      severity_level: Warning
  dt_valid_from:
    is_complete:
      severity_level: Warning
  one_row_per_organization_and_valid_from:
    custom:
      # At most one row per organization and validity start (id_organization is the grain anchor)
      constraint: |-
        (SELECT COUNT(*) FROM (
          SELECT
            id_organization,
            dt_valid_from
          FROM datalake_people.cost_center_history
          GROUP BY
            id_organization,
            dt_valid_from
          HAVING COUNT(*) > 1
        )) = 0
      severity_level: Error
