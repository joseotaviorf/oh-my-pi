---
# PIN drift vs Codex; final name codex_pin_sync_drift (older docs/tickets: codex_pin_update).
table_name: datalake_people.codex_pin_sync_drift
alert_channel: PEOPLE_ALERTS

table_level_validations:
  has_size:
    # Baseline (Databricks prod, 2026-03-25): 1,496 rows. 90% of baseline (~10% buffer); aligns with has_size_variation ±10%.
    greater_than: 1346
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: -10
    less_than_or_equal_to: 10
    severity_level: Warning

column_level_validations:
  cost_center_code:
    # has_pattern: enforced at ingest on datalake_gsheets_people_clean.codex_cost_centers (see codex_history_base DQ note).
