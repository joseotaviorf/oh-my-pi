---
table_name: datalake_people.compensation_versions
alert_channel: PEOPLE_ALERTS

table_level_validations:
  has_size:
    greater_than: 1
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: -5
    less_than_or_equal_to: 20
    severity_level: Warning

column_level_validations:
  sk_compensation:
    is_unique:
      severity_level: Error
    is_complete:
      severity_level: Error
  id_salary:
    is_complete:
      severity_level: Warning
  id_assignment:
    is_complete:
      severity_level: Warning
  person_number:
    is_complete:
      severity_level: Warning
  assignment_number:
    is_complete:
      severity_level: Warning
  salary_amount:
    is_complete:
      severity_level: Warning
  salary_amount_must_not_be_negative:
    custom:
      # Salary amount must be non-negative.
      constraint: |-
        (SELECT COUNT(*)
         FROM datalake_people.compensation_versions
         WHERE salary_amount < 0
        ) = 0
      severity_level: Warning
  annual_salary:
    is_complete:
      severity_level: Warning
  is_salary_approved:
    is_complete:
      severity_level: Warning
  dt_valid_from:
    is_complete:
      severity_level: Warning
  valid_from_must_not_be_after_valid_to:
    custom:
      # SCD bounds: valid-from must not be after valid-to.
      constraint: |-
        (SELECT COUNT(*)
         FROM datalake_people.compensation_versions
         WHERE dt_valid_from > dt_valid_to
        ) = 0
      severity_level: Warning
  dt_valid_to:
    is_complete:
      severity_level: Warning
  dt_reference:
    is_complete:
      severity_level: Warning
  is_current:
    is_complete:
      severity_level: Warning
  ts_load:
    is_complete:
      severity_level: Warning
