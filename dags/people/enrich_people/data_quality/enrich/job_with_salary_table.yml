---
table_name: datalake_people.job_with_salary_table
alert_channel: PEOPLE_ALERTS

table_level_validations:
  has_size:
    greater_than: 1
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: 0
    less_than_or_equal_to: 50
    severity_level: Warning

column_level_validations:
  job_name:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Warning
  is_leadership_job:
    is_complete:
      severity_level: Warning
  dt_valid_from:
    has_null_count:
      less_than_or_equal_to: 1
      severity_level: Warning
  job_history_versions_do_not_overlap:
    custom:
      # SCD2 versions for the same job must not overlap in time.
      constraint: |-
        (SELECT COUNT(*)
         FROM (
           SELECT
             id_job,
             dt_valid_from,
             dt_valid_to,
             LAG(dt_valid_to) OVER (PARTITION BY id_job ORDER BY dt_valid_from) AS prev_dt_valid_to
           FROM datalake_people.job_with_salary_table
         )
         WHERE prev_dt_valid_to IS NOT NULL
           AND dt_valid_from < prev_dt_valid_to
        ) = 0
      severity_level: Warning
  job_salary_versions_must_abut:
    custom:
      # Adjacent jwst versions for id_job must abut after PIN go-live (1-day handoff gaps).
      constraint: |-
        (SELECT COUNT(*) FROM (
          SELECT
            id_job,
            dt_valid_from,
            COALESCE(dt_valid_to, DATE('9999-12-31')) AS dt_valid_to,
            LEAD(dt_valid_from) OVER (
              PARTITION BY id_job
              ORDER BY dt_valid_from
            ) AS next_valid_from
          FROM datalake_people.job_with_salary_table
          WHERE COALESCE(dt_valid_to, DATE('9999-12-31')) >= DATE('2024-03-01')
        ) versions
        WHERE next_valid_from IS NOT NULL
          AND DATE_ADD(dt_valid_to, 1) != next_valid_from
          AND next_valid_from >= DATE('2024-03-01')
        ) = 0
      severity_level: Warning
  valid_to_must_not_be_before_valid_from:
    custom:
      # dt_valid_to must not precede dt_valid_from when both are set.
      constraint: |-
        (SELECT COUNT(*)
         FROM datalake_people.job_with_salary_table
         WHERE dt_valid_to IS NOT NULL
           AND dt_valid_to < dt_valid_from
        ) = 0
      severity_level: Warning
  single_version_jobs_have_consistent_target_plr:
    custom:
      # Jobs with a single SCD version must not carry conflicting target_plr values.
      constraint: |-
        (SELECT COUNT(*)
         FROM (
           SELECT id_job, COUNT(DISTINCT target_plr) AS distinct_target_plr
           FROM datalake_people.job_with_salary_table
           WHERE target_plr IS NOT NULL
           GROUP BY id_job
           HAVING COUNT(DISTINCT target_plr) > 1
           AND COUNT(*) = 1
         )
        ) = 0
      severity_level: Warning
  annualization_factor:
    custom:
      constraint: |-
        (SELECT COUNT(*)
         FROM datalake_people.job_with_salary_table
         WHERE annualization_factor IS NOT NULL
           AND annualization_factor <= 0
        ) = 0
      severity_level: Warning
  ts_load:
    is_complete:
      severity_level: Warning
