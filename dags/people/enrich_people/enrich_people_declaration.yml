dag:
  name: enrich_people
  owner: Data People
  callback_by_task: False
  schedule_start_date: 2026, 1, 29
  documentation:
    dag_purpose: |
      Core enriched tables for People domain that can be used across multiple DWs.
      Contains foundational data such as action reasons, employee identifiers,
      and other cross-domain reference tables. Also prepares LLM input tables
      consumed by `enrich_people_ai` (offboarding and Teva survey inputs).
workflow:
  type: query_delta
  layer: enrich
  default_extraction_type: full
  has_hive_sync: true
  bucket_config_name: people_bucket
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  default_table_privileges:
    people-team: ["ALL PRIVILEGES"]
  inner_dependencies:
    identifier_mapping:
      - event_definition
    assignment_termination:
      - identifier_mapping
    management_hierarchy:
      - identifier_mapping
      - job_with_salary_table
    assignment_snapshots:
      - identifier_mapping
      - assignment_termination
      - management_hierarchy
      - job_with_salary_table
      - cost_center_history
      - compensation_versions
    compensation_versions:
      - identifier_mapping
      - job_with_salary_table
      - event_definition
    codex_log:
      - codex_history_base
      - identifier_mapping
    codex_pin_sync_drift:
      - codex_log
    cost_center_history:
      - codex_log
    allocation_history:
      - identifier_mapping
  tables_customization:
    codex_history_base:
      extraction_type: incremental
      merge_on: ["id"]
      # 1080h = 45 days so a wrong GSheets closing month can still be restored via Delta time travel.
      vacuum_retention_hours: 1080
      vacuum_lite: true
    codex_log:
      extraction_type: full
      vacuum_retention_hours: 168
      vacuum_lite: true
    event_definition:
      vacuum_retention_hours: 168
      vacuum_lite: true
    identifier_mapping:
      vacuum_retention_hours: 168
      vacuum_lite: true
    assignment_termination:
      vacuum_retention_hours: 168
      vacuum_lite: true
    management_hierarchy:
      vacuum_retention_hours: 168
      vacuum_lite: true
    job_with_salary_table:
      vacuum_retention_hours: 168
      vacuum_lite: true
    business_unit:
      vacuum_retention_hours: 168
      vacuum_lite: true
    assignment_snapshots:
      vacuum_retention_hours: 168
      vacuum_lite: true
    compensation_versions:
      vacuum_retention_hours: 168
      vacuum_lite: true
    codex_pin_sync_drift:
      vacuum_retention_hours: 168
      vacuum_lite: true
    cost_center_history:
      vacuum_retention_hours: 168
      vacuum_lite: true
    allocation_history:
      vacuum_retention_hours: 168
      vacuum_lite: true
    teva_survey_inputs:
      extraction_type: full
      vacuum_retention_hours: 168
      vacuum_lite: true
