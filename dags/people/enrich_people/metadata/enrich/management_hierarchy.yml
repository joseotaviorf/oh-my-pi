database_name: datalake_people
table_name: management_hierarchy
owner: isabella.araujo@quintoandar.com.br
domain: People
description: |-
  This table outlines the reporting structure within the organization, detailing the hierarchical relationships between employees and their managers. Each hierarchy starts on the employee (L1 to L9 depending on depth), goes through their direct manager and upward chain, until it reaches the CEO at L0. The CEO is always L0; the employee themselves can be at any level from L1 to L9. The direct manager may appear at any L level (L1 through L9) depending on the employee's position in the org. For a given team and point in time, the same manager will always have the same L number across all employees in that team.
  Grain: one record per assignment per hierarchy version (period when the chain is valid). Rows with identical hierarchy attributes and sequential validity dates are consolidated into a single record with merged date range.
  The hierarchy shows up to 10 levels (L0 to L9), ordered from the CEO (L0) down to the employee (L1 to L9). Only hierarchies where the CEO (person in the highest band) is L0 are considered valid.
columns:
  sk_hierarchy_version:
    description: Deterministic surrogate key for the hierarchy version. Generated as MD5 hash of assignment_number + dt_valid_from + dt_valid_to.
    lineage:
      - datalake_people.identifier_mapping.assignment_number
      - datalake_pin_core_clean.assignment_supervisor.dt_effective_started
      - datalake_pin_core_clean.assignment_supervisor.dt_effective_ended
  assignment_number:
    description: Assignment number (employee code) whose managerial chain is tracked in this record.
    lineage:
      - datalake_people.identifier_mapping.assignment_number
  person_number:
    description: Person number (Oracle HCM person identifier) of the employee whose managerial chain is tracked in this record.
    lineage:
      - datalake_people.identifier_mapping.person_number
  manager_assignment_number:
    description: Assignment number of the direct manager. Derived from manager_struct_path[SIZE-2]. NULL when employee is CEO (no manager).
    lineage:
      - datalake_pin_core_clean.assignment_supervisor.id_manager_assignment
      - datalake_people.identifier_mapping.assignment_number
  hierarchy_depth:
    description: Numeric level in the org chart (0=CEO, 1=L1, ..., 9=L9). Derived from SIZE(manager_struct_path) - 1.
    lineage:
      - datalake_pin_core_clean.assignment_supervisor.id_manager_assignment
      - datalake_people.identifier_mapping.assignment_number
  hierarchy_level:
    description: Employee level in the org chart (L0 to L9). Derived from 'L' || (SIZE(manager_struct_path) - 1).
    lineage:
      - datalake_pin_core_clean.assignment_supervisor.id_manager_assignment
      - datalake_people.identifier_mapping.assignment_number
  person_number_manager:
    description: Person number (Oracle HCM person identifier) of the direct manager.
    lineage:
