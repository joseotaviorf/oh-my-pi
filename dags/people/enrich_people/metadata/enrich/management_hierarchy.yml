database_name: datalake_people
table_name: management_hierarchy
owner: isabella.araujo@quintoandar.com.br
domain: People
description: |
  Reporting chain for each workforce assignment, with the direct manager identity and denormalized people at each organizational layer from the CEO (L0) down to the employee (L1–L9).
  One row per assignment_number × hierarchy version: a new version opens when the reporting chain changes; consecutive identical periods are merged.
  Covers assignments that form a valid CEO-linked chain.
  Guarantees a stable L number for the same manager across a team at a point in time. manager_assignment_number / name_manager identify the immediate supervisor; *_lN columns identify the person at fixed depth N from the CEO (the employee sits at hierarchy_level; the direct manager sits one layer above and may be any of L1–L9).
columns:
  sk_hierarchy_version:
    description: Unique key for the assignment hierarchy version. Stable for a given assignment_number and validity window.
    lineage:
      - datalake_people.identifier_mapping.assignment_number
      - datalake_pin_core_clean.assignment_supervisor.dt_effective_started
      - datalake_pin_core_clean.assignment_supervisor.dt_effective_ended
  assignment_number:
    description: Assignment number (employee code) whose managerial chain is tracked in this record.
    lineage:
      - datalake_people.identifier_mapping.assignment_number
  person_number:
    description: Main business identifier of the employee in PIN whose reporting chain is tracked in this record.
    lineage:
      - datalake_people.identifier_mapping.person_number
  manager_assignment_number:
    description: Assignment number of the employee's direct manager (immediate supervisor). NULL when the assignment has no manager in the chain (e.g. CEO).
    lineage:
      - datalake_pin_core_clean.assignment_supervisor.id_manager_assignment
      - datalake_people.identifier_mapping.assignment_number
  hierarchy_depth:
    description: Numeric organizational depth of this assignment in the reporting chain, from 0 (CEO) to 9. The employee sits at this depth; the direct manager sits at depth - 1.
    lineage:
      - datalake_pin_core_clean.assignment_supervisor.id_manager_assignment
      - datalake_people.identifier_mapping.assignment_number
  hierarchy_level:
    description: Organizational layer label of this assignment in the reporting chain (L0 to L9). Matches hierarchy_depth as L{depth}.
    lineage:
      - datalake_pin_core_clean.assignment_supervisor.id_manager_assignment
      - datalake_people.identifier_mapping.assignment_number
  person_number_manager:
    description: Person number of the employee's direct manager (immediate supervisor).
    lineage:
      - datalake_people.identifier_mapping.person_number
  name_manager:
    description: Full name of the employee's direct manager (immediate supervisor).
    lineage:
      - datalake_people.identifier_mapping.name
  email_manager:
    description: Work email of the employee's direct manager (immediate supervisor).
    lineage:
      - datalake_people.identifier_mapping.work_email
  assignment_number_l0:
    description: Assignment number of the person at organizational layer 0 (CEO / top of the chain) (top of every valid reporting chain).
    lineage:
      - datalake_people.identifier_mapping.assignment_number
  person_number_l0:
    description: Person number of the person at organizational layer 0 (CEO / top of the chain) (top of every valid reporting chain).
    lineage:
      - datalake_people.identifier_mapping.person_number
  name_l0:
    description: Full name of the person at organizational layer 0 (CEO / top of the chain) (top of every valid reporting chain).
    lineage:
      - datalake_people.identifier_mapping.name
  email_l0:
    description: Work email of the person at organizational layer 0 (CEO / top of the chain) (top of every valid reporting chain).
    lineage:
      - datalake_people.identifier_mapping.work_email
  assignment_number_l1:
    description: Assignment number of the person at organizational layer 1 (L1), counted downward from the CEO at L0 (one layer below L0). Distinct from manager_assignment_number (direct manager).
    lineage:
      - datalake_people.identifier_mapping.assignment_number
  person_number_l1:
    description: Person number of the person at organizational layer 1 (L1), counted downward from the CEO at L0 (one layer below L0). Distinct from person_number_manager (direct manager).
    lineage:
      - datalake_people.identifier_mapping.person_number
  name_l1:
    description: Full name of the person at organizational layer 1 (L1), counted downward from the CEO at L0 (one layer below L0). Distinct from name_manager (direct manager).
    lineage:
      - datalake_people.identifier_mapping.name
  email_l1:
    description: Work email of the person at organizational layer 1 (L1), counted downward from the CEO at L0 (one layer below L0). Distinct from email_manager (direct manager).
    lineage:
      - datalake_people.identifier_mapping.work_email
  assignment_number_l2:
    description: Assignment number of the person at organizational layer 2 (L2), counted downward from the CEO at L0 (one layer below L1).
    lineage:
      - datalake_people.identifier_mapping.assignment_number
  person_number_l2:
    description: Person number of the person at organizational layer 2 (L2), counted downward from the CEO at L0 (one layer below L1).
    lineage:
      - datalake_people.identifier_mapping.person_number
  name_l2:
    description: Full name of the person at organizational layer 2 (L2), counted downward from the CEO at L0 (one layer below L1).
    lineage:
      - datalake_people.identifier_mapping.name
  email_l2:
    description: Work email of the person at organizational layer 2 (L2), counted downward from the CEO at L0 (one layer below L1).
    lineage:
      - datalake_people.identifier_mapping.work_email
  assignment_number_l3:
