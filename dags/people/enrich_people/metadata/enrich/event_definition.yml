database_name: datalake_people
table_name: event_definition
owner: isabella.araujo@quintoandar.com.br
domain: People
description: |
  Catalog of PIN HR action and action-reason (Motivo da ação) pairs with English and Portuguese labels.
  One row per id_action × id_reason.
  Covers every action-reason combination observed in PIN action occurrences, including an unknown-reason sentinel when the action-reason is missing.
  Supplies event keys and labels for termination and compensation joins; identifier_mapping and compensation_versions look up id_event_definition here, and DW dim_event_definition reads the current rows.

columns:
  id_event_definition:
    description: Unified event key as {id_action}-{id_reason}; when the action-reason (Motivo da ação) is missing, id_reason is the sentinel -1 so the key still resolves.
  id_action:
    description: System-generated primary key for the action.
  id_reason:
    description: PIN identifier of the action-reason (Motivo da ação), or -1 when it is missing so the event still joins on the action alone.
  action_code:
    description: Unique code that identifies the action (e.g., "HIR", "TER", "PROM").
  reason_code:
    description: Stable PIN code for the action-reason (Motivo da ação), or UNKNOWN when it is missing.
  action_name:
    description: Action name in English (US).
  reason_name:
    description: Action-reason label in English (US), or Unknown when the action-reason (Motivo da ação) is missing.
  action_description:
    description: Long description of the action in English (US).
  action_name_ptb:
    description: Action name in Portuguese (PTB).
  reason_name_ptb:
    description: Action-reason label in Portuguese (PTB), or Desconhecido when the action-reason is missing.
  action_description_ptb:
    description: Long description of the action in Portuguese (PTB).
  is_assignment_termination_event:
    description: True when the event closes an employee or contractor assignment through termination, resignation, death, global transfer, or the controlled expatriate flow.
  is_current:
    description: True when the action (and action-reason when present) is valid for the load date.
  dt_valid_from:
    description: First date the event definition is valid; for unknown-reason rows this follows the action start alone.
  dt_valid_to:
    description: Last date the event definition is valid; open-ended periods use 9999-12-31, and unknown-reason rows follow the action end alone.
  dt_action_started:
    description: The date from which the action is active.
  dt_action_ended:
    description: The date until which the action is active (NULL if still active).
  dt_reason_started:
    description: Date from which the action-reason (Motivo da ação) is active; for unknown-reason rows this mirrors the action start.
  dt_reason_ended:
    description: Date until which the action-reason (Motivo da ação) is active; 9999-12-31 for unknown-reason or open-ended reasons.
  ts_load:
    description: Timestamp of when the record was loaded into the table.
