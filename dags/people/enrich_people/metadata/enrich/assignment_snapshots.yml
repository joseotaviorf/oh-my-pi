database_name: datalake_people
table_name: assignment_snapshots
owner: isabella.araujo@quintoandar.com.br
domain: People
description: |
  Daily snapshot of all active and historical employment assignments. Grain: one row per id_assignment × dt_reference (each calendar day from hire to termination or today, whichever is earlier). Only assignment types E (employee) and C (contingent) are included.

  Data modeling patterns:
  - Current state per employee: filter is_current_for_employee = TRUE for one row per employee, active today or their most recent termination.
  - Historical state per employee: filter is_monthly_snapshot_for_employee = TRUE for one row per employee per closed month, plus the in-progress current month.
  - Assignment-grain analysis: filter is_current_for_assignment = TRUE (current state) or is_monthly_snapshot_for_assignment = TRUE (monthly, join/group by dt_month_reference) to get every assignment instead of the employee-grain default above — active assignments use today's date; terminated ones use the termination date. Use only when you need every assignment (e.g. rehires, multiple terminations).
  - Historical point-in-time: filter by a specific dt_reference value to reconstruct the workforce as it stood on any past calendar day.

  All job, org, and hierarchy attributes are time-valid: they reflect the state on dt_reference, not the current value. dt_original_hire is the earliest hire date within the current continuous employment cycle and is intended for tenure calculations only.

columns:
  id_assignment:
    description: Unique identifier for the work assignment.
    lineage:
      - datalake_people.identifier_mapping.id_assignment
  id_person:
    description: Unique identifier for the person.
    lineage:
      - datalake_people.identifier_mapping.id_person
  id_organization:
    description: Organization identifier.
    lineage:
      - datalake_pin_core_clean.all_assignments.id_organization
  id_business_unit:
    description: Business unit identifier. Use to join to dim_business_unit for BU name and context.
    lineage:
      - datalake_pin_core_clean.all_assignments.id_business_unit
  id_job:
    description: Oracle HCM job position identifier for the assignment on dt_reference. Use to join job_with_salary_table or dw_compensation.dim_job for role title, band, and compensation context effective on the snapshot date.
    lineage:
      - datalake_pin_core_clean.all_assignments.id_job
  sk_job_version:
    description: |
      Surrogate key for the job SCD2 version effective on dt_reference, identical to dw_compensation.dim_job.sk_job_version
      (MD5 of id_job and dt_valid_from from the matched job_with_salary_table row). NULL when id_job is null or no row
      matches the assignment date window; consumers should COALESCE to the fact unknown key (e.g. '-1') when needed.
    lineage:
      - datalake_people.job_with_salary_table.id_job
      - datalake_people.job_with_salary_table.dt_valid_from
  sk_compensation_version:
    description: Surrogate key for the compensation period effective on dt_reference. Matches dw_compensation.fact_compensations.sk_compensation for equality joins. NULL when no compensation_versions row covers dt_reference for this assignment.
    lineage:
      - datalake_people.compensation_versions.sk_compensation
  sk_cost_center_version:
    description: |
      Surrogate key for the cost center version in effect on dt_reference. NULL when there is no organization or no version covers that date.
    lineage:
      - datalake_people.cost_center_history.sk_cost_center_version
  business_unit_country:
    description: |
      Country inferred for the job row effective on dt_reference (same row as sk_job_version in job_with_salary_table). NULL when no job row matches the date window.
    lineage:
      - datalake_people.job_with_salary_table.country
  sk_hierarchy_version:
    description: Org structure identifier from management_hierarchy.
    lineage:
      - datalake_people.management_hierarchy.sk_hierarchy_version
  sk_termination_event_definition:
    description: Termination reason and type. Empty when still active.
    lineage:
      - datalake_pin_core_clean.action_occurrence.id_action
      - datalake_pin_core_clean.action_occurrence.id_action_reason
  sk_hired_date:
    description: Hire date in YYYYMMDD format.
    lineage:
      - datalake_pin_core_clean.periods_of_service.dt_started
  sk_terminated_date:
    description: End date of the assignment in YYYYMMDD format. Shows 99991231 when still active.
    lineage:
      - datalake_pin_core_clean.periods_of_service.dt_actual_termination
  sk_reference_date:
    description: Snapshot date in YYYYMMDD format.
    lineage:
      - datalake_pin_core_clean.periods_of_service.dt_started
  person_number:
    description: Unique employee identifier in the HR system.
    lineage:
      - datalake_people.identifier_mapping.person_number
  assignment_number:
    description: Employee registration number.
    lineage:
      - datalake_people.identifier_mapping.assignment_number
  manager_assignment_number:
    description: Assignment number of the direct manager. Use to join to assignment_snapshots or dim_employee for manager details. NULL when no manager (e.g. CEO).
    lineage:
      - datalake_people.management_hierarchy.manager_assignment_number
  hierarchy_level:
    description: Employee level in the org chart (L0 to L9).
    lineage:
      - datalake_people.management_hierarchy.hierarchy_level
  hierarchy_depth:
    description: Numeric level in the org chart (0 to 9).
    lineage:
      - datalake_people.management_hierarchy.hierarchy_depth
  employment_status:
    description: |
      Human-readable employment status derived from assignment_status_type.
    categories:
      "Active": Employee has an active assignment on the reference date.
      "Terminated": Employee's assignment has ended on or before the reference date.
    lineage:
      - datalake_people.identifier_mapping.assignment_status_type
  tenure_range:
    description: |
      Tenure band based on months_tenure_in_company (months between original hire date and reference date).
      Null when the hire date is unknown.
    categories:
      "< 3 months": Less than 3 months of tenure.
      "3-11 months": Between 3 and 11 months of tenure.
      "1-2 years": Between 1 and 2 years of tenure.
      "3-4 years": Between 3 and 4 years of tenure.
      "5+ years": 5 or more years of tenure.
    lineage:
      - datalake_pin_core_clean.periods_of_service.dt_started
  days_tenure_in_company:
    description: Days since the employee's first hire at the company.
    lineage:
      - datalake_pin_core_clean.periods_of_service.dt_started
  months_tenure_in_company:
    description: Months since the employee's first hire at the company.
    lineage:
      - datalake_pin_core_clean.periods_of_service.dt_started
  days_tenure_in_assignment:
    description: Days since the employee started this specific assignment.
    lineage:
      - datalake_pin_core_clean.periods_of_service.dt_started
  count_direct_report:
    description: Number of employees who report directly to this assignment.
    lineage:
      - datalake_people.management_hierarchy.assignment_number_l0
      - datalake_people.management_hierarchy.assignment_number_l8
  count_indirect_report:
    description: Number of employees who report indirectly to this assignment.
    lineage:
      - datalake_people.management_hierarchy.assignment_number_l0
      - datalake_people.management_hierarchy.assignment_number_l7
  count_total_report:
    description: Total number of reports (direct + indirect) under this assignment. Zero when no reports exist.
    lineage:
      - datalake_people.assignment_snapshots.count_direct_report
      - datalake_people.assignment_snapshots.count_indirect_report
  is_manager:
    description: True when the employee has leadership career track (L) or has at least one direct report.
    lineage:
      - datalake_pin_core_clean.all_assignments.ass_attribute14
      - datalake_people.management_hierarchy.assignment_number_l0
  is_leadership_team_member:
    description: True when the employee is in the Leadership Team (band 10+ or EXEC). Used for DE&I analytics.
    lineage:
      - datalake_people.job_with_salary_table.band
  is_executive_team_member:
    description: True when the employee is in the Executive Team (L0 or L1 in hierarchy and band 14+).
    lineage:
      - datalake_people.management_hierarchy.assignment_number_l0
      - datalake_people.management_hierarchy.assignment_number_l1
      - datalake_people.job_with_salary_table.band
  is_active:
    description: True when the employee is active, False when inactive.
  has_emergency_contact:
    description: True when the employee has at least one emergency contact on file for this date.
    lineage:
      - datalake_pin_core_clean.people_extra_info.id_person
  is_internal_transfer:
    description: True when the employee was already at the company before this assignment.
    lineage:
      - datalake_pin_core_clean.periods_of_service.dt_started
  is_transfer_termination:
    description: True when this assignment was closed by an internal transfer (GLB_TRANSFER) instead of a real exit. These assignments stay active on the transfer date and must not be counted as dismissals or turnover.
    lineage:
      - datalake_people.identifier_mapping.is_transfer_termination
  is_latest_date:
    description: True for the row representing today. Computed as dt_reference equal to load_start_date; only assignments active today or terminated today carry this flag, since terminated assignments' date series stops at their termination date.
  is_primary_assignment_for_snapshot:
    description: Indicates the current assignment for the employee on the reference date, based on the assignment start date (latest dt_started for id_person and dt_reference). If a person has both pending and effective assignments, the effective one takes priority.
    lineage:
      - datalake_pin_core_clean.periods_of_service.dt_started
  is_reorganization_termination:
    description: True when the employee's termination was part of an organizational restructuring (layoff/reorg), as recorded in the gsheets layoffs tracker. False for active employees or non-reorg terminations.
    lineage:
      - datalake_gsheets_people_clean.layoffs.is_layoff
  is_monthly_snapshot_for_assignment:
    description: True for the assignment's own monthly snapshot, when dt_reference is the last calendar day of the month (month-end closing) or the current date (the in-progress month's partial snapshot). Each closed month has exactly one monthly snapshot per assignment, and the current month is represented by the current-date snapshot; assignments terminated mid-month still appear on their termination month-end (or the current-date snapshot if terminated in the in-progress month), because the reference-date series extends to the last day of the termination month, capped at the current date. Grain is one row per assignment, not per employee; an employee with 2+ assignments in the same month can have multiple rows; use is_monthly_snapshot_for_employee for the employee-grain equivalent.
    lineage:
      - datalake_pin_core_clean.periods_of_service.dt_started
      - datalake_pin_core_clean.periods_of_service.dt_actual_termination
  is_monthly_snapshot_for_employee:
    description: True for the assignment that represents an employee's official month-closing snapshot, the latest information for that assignment within the month, on exactly one row per employee per dt_month_reference. This is the default flag for historical, employee-grain analysis, mirroring the legacy base_fotografias table. Resolved by ranking candidate rows (is_monthly_snapshot_for_assignment and is_primary_assignment_for_snapshot both true) within each employee and month, preferring the latest dt_reference, then active over inactive, then the highest assignment_number, which collapses the rare case of a mid-month transfer producing two qualifying rows in the same month.
    lineage:
      - datalake_pin_core_clean.periods_of_service.dt_started
      - datalake_pin_core_clean.periods_of_service.dt_actual_termination
  is_current_for_assignment:
    description: True for the assignment's latest available snapshot. Active assignments use the current date; terminated ones use the termination date. Exactly one row per assignment_number is flagged.
    lineage:
      - datalake_pin_core_clean.periods_of_service.dt_actual_termination
  is_current_for_employee:
    description: True on exactly one row per employee, the assignment active today or their most recent terminated assignment. Resolved by picking the assignment active as of today when one exists; otherwise falls back to the employee's most recent assignment closed by a real termination, deprioritizing assignments closed by an internal transfer.
    lineage:
      - datalake_pin_core_clean.periods_of_service.dt_actual_termination
      - datalake_pin_core_clean.periods_of_service.dt_started
  dt_original_hire:
    description: Date of the employee's first hire at the company. Derived from MIN(dt_started) over periods_of_service per person (approximation). PER_SENIORITY_DATES_F will provide assignment-level value when available.
    lineage:
      - datalake_pin_core_clean.periods_of_service.dt_started
  dt_hired:
    description: Date the employee started this assignment.
    lineage:
      - datalake_pin_core_clean.periods_of_service.dt_started
  dt_terminated:
    description: Date the assignment ended. Shows 9999-12-31 when still active.
    lineage:
      - datalake_pin_core_clean.periods_of_service.dt_actual_termination
  dt_notified_termination:
    description: Date when the termination was notified. Shows 9999-12-31 when still active.
    lineage:
      - datalake_pin_core_clean.periods_of_service.dt_notified_termination
  dt_reference:
    description: Snapshot date.
    lineage:
      - datalake_pin_core_clean.periods_of_service.dt_started
  dt_month_reference:
    description: Last calendar day of the snapshot month (LAST_DAY of dt_reference). Use when joining or grouping monthly snapshots.
    lineage:
      - datalake_pin_core_clean.periods_of_service.dt_started
  ts_load:
    description: When the record was loaded.
