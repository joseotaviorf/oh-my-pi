database_name: datalake_people
table_name: identifier_mapping
owner: isabella.araujo@quintoandar.com.br
domain: People
description: |-
  Consolidated table that maps all identifiers for an employee (person, assignment, registration) in a single location. It serves as a crosswalk table to unify data from different HR systems and HCM tables.
  Business rule for employment continuity:
  - GLB_TRANSFER continuation (same person and assignment_sequence + 1) keeps the same employment cycle only when both assignments are type E or C (Pending P is excluded).
  - Non-transfer rehiring starts a new employment cycle.
  - dt_original_hired is the earliest dt_started inside the current employment cycle.
  This means dt_original_hired is a cycle-based company tenure date.
  It is not the PIN seniority rule date and it can differ from seniority_date.dt_seniority.
  Example: period A -> cycle A, period B (rehire) -> cycle B, period C (GLB_TRANSFER continuation of B) -> cycle B.
  Name columns: name is the preferred full name for reports and communications, resolved from person_name (GLOBAL) as concatenated social names when present, else display_name, else documented_full_name, then normalized in this query; use documented_* for official / document-aligned names from HCM.

columns:
  id_assignment:
    description: Unique identifier for the work contract.
    lineage:
    - datalake_pin_core_clean.all_assignments.id_assignment
  id_period_of_service:
    description: Identifier that groups all contracts for the same period of service.
    lineage:
    - datalake_pin_core_clean.all_assignments.id_period_of_service
  id_continuous_employment_cycle:
    description: Stable identifier of the person's current continuous employment cycle. Computed only for employment periods (assignments of type E or C); pension / pre-hire (P) rows have NULL cycle. GLB_TRANSFER between assignment types E or C only keeps the same cycle id; non-transfer rehiring starts a new cycle id.
    lineage:
    - datalake_pin_core_clean.periods_of_service.id_period_of_service
    - datalake_pin_core_clean.periods_of_service.id_person
    - datalake_pin_core_clean.all_assignments.action_code
    - datalake_pin_core_clean.all_assignments.assignment_sequence
    - datalake_pin_core_clean.all_assignments.assignment_type
  id_person:
    description: Unique identifier for the person, shared across all their contracts.
    lineage:
    - datalake_pin_core_clean.all_people.id_person
  legacy_registration:
    description: Employee registration number, unified from new and legacy systems.
    lineage:
    - datalake_hr_system_custom_clean.workers_registration.registration
    - datalake_gsheets_people_clean.legacy_registration.legacy_registration
  assignment_number:
    description: The assignment registration number.
    lineage:
    - datalake_pin_core_clean.all_assignments.assignment_number
  legislation_code:
    description: Legislation code applicable to the work assignment.
    lineage:
    - datalake_pin_core_clean.all_assignments.legislation_code
  person_number:
    description: The person's identification number in the main HR system.
    lineage:
    - datalake_pin_core_clean.all_people.person_number
  assignment_type:
    description: Type of assignment (E for Employee, C for Contingent, P for Pending).
    lineage:
    - datalake_pin_core_clean.all_assignments.assignment_type
  assignment_status_type:
    description: Current status of the work assignment (e.g., ACTIVE, INACTIVE).
    lineage:
    - datalake_pin_core_clean.all_assignments.assignment_status_type
  documented_first_name:
    description: Official / document-aligned first name from HCM (GLOBAL name). Not necessarily the preferred name for addressing the person.
    lineage:
    - datalake_pin_core_clean.person_name.documented_first_name
  documented_last_name:
    description: Official / document-aligned last name from HCM (GLOBAL name). Not necessarily the preferred name for addressing the person.
    lineage:
    - datalake_pin_core_clean.person_name.documented_last_name
  documented_full_name:
    description: Official / document-aligned full name from HCM (GLOBAL name). For compliance and formal records; prefer name for dashboards and communications.
    lineage:
    - datalake_pin_core_clean.person_name.documented_full_name
  display_name:
    description: HCM display name from person_name (GLOBAL). Retained for traceability; prefer name for report-facing preferred full name.
    lineage:
    - datalake_pin_core_clean.person_name.display_name
  name:
    description: Preferred full name for reporting and communications, derived in this query from person_name (GLOBAL) social names, display_name, and documented_full_name.
    lineage:
    - datalake_pin_core_clean.person_name.first_social_name
    - datalake_pin_core_clean.person_name.last_social_name
    - datalake_pin_core_clean.person_name.display_name
    - datalake_pin_core_clean.person_name.documented_full_name
  work_email:
    description: The employee's primary work email (W1), in lowercase.
    lineage:
    - datalake_pin_core_clean.email_address.email_address
  personal_email:
    description: The employee's personal email (H1), in lowercase.
    lineage:
    - datalake_pin_core_clean.email_address.email_address
  is_user_test:
    description: Boolean flag indicating if the employee is a test user (has an ID_ONDA1 identifier).
    lineage:
    - datalake_pin_core_clean.external_application_identifier.id_person
  is_active:
    description: Boolean flag indicating if the assignment is currently active (TRUE) or not (FALSE).
    lineage:
    - datalake_pin_core_clean.all_assignments.assignment_status_type
  is_person_latest_assignment:
    description: |
      True when this row represents the most recent assignment for the person (by dt_started / hire date).
      Use to filter one row per person for dim_employee and similar person-level views.
  dt_projected_started:
    description: Projected start date for the employee's activities, usually for future hires.
    lineage:
    - datalake_pin_core_clean.all_assignments.dt_projected_started
  dt_original_hired:
    description: |
      Original hire date for the current continuous employment cycle.
      Calculation:
      - restrict to employment periods (periods with at least one E or C assignment); pension / pre-hire (P) rows have NULL
      - group periods_of_service by person and cycle continuity
      - keep continuity for GLB_TRANSFER continuation (assignment_sequence + 1) for assignment types E and C only
      - start a new cycle for non-transfer rehiring
      - return the minimum dt_started inside the cycle
      Interpretation for business users:
      - preserves tenure across transfer continuations
      - resets tenure on rehire
      - may differ from PIN seniority_date.dt_seniority
    lineage:
    - datalake_pin_core_clean.periods_of_service.dt_started
    - datalake_pin_core_clean.periods_of_service.id_period_of_service
    - datalake_pin_core_clean.periods_of_service.id_person
    - datalake_pin_core_clean.all_assignments.assignment_sequence
    - datalake_pin_core_clean.all_assignments.action_code
    - datalake_pin_core_clean.all_assignments.assignment_status_type
  dt_started:
    description: Effective start date of the work assignment.
    lineage:
    - datalake_pin_core_clean.periods_of_service.dt_started
  dt_actual_termination:
    description: Actual termination date of the work assignment.
    lineage:
    - datalake_pin_core_clean.periods_of_service.dt_actual_termination
  dt_notified_termination:
    description: Date on which the termination was notified.
    lineage:
    - datalake_pin_core_clean.periods_of_service.dt_notified_termination
  ts_load:
    description: Timestamp indicating when the data was loaded into this table.
