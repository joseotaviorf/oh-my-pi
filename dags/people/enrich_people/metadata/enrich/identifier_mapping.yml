database_name: datalake_people
table_name: identifier_mapping
owner: isabella.araujo@quintoandar.com.br
domain: People
description: |-
  Consolidated crosswalk for employment assignments (types E and C only; pension / pre-hire P excluded) mapping person, assignment, and registration identifiers across HR systems.
  Business rule for employment continuity:
  - GLB_TRANSFER continuation (same person and assignment_sequence + 1) keeps the same employment cycle when both assignments are type E or C.
  - Non-transfer rehiring starts a new employment cycle.
  - dt_employee_hired is the earliest dt_started inside the current employment cycle.
  This means dt_employee_hired is a cycle-based company tenure date.
  It is not the PIN seniority rule date and it can differ from seniority_date.dt_seniority.
  Example: period A -> cycle A, period B (rehire) -> cycle B, period C (GLB_TRANSFER continuation of B) -> cycle B.
  Name columns: name is the preferred full name for reports and communications, resolved from person_name (GLOBAL) as concatenated social names when present, else display_name, else documented_full_name, then normalized in this query; use documented_* for official / document-aligned names from HCM.

columns:
  id_assignment:
    description: Unique identifier for the work contract.
    lineage:
      - datalake_pin_core_clean.all_assignments.id_assignment
  id_period_of_service:
    description: Identifier that groups all contracts for the same period of service.
    lineage:
      - datalake_pin_core_clean.all_assignments.id_period_of_service
  id_continuous_employment_cycle:
    description: Stable identifier of the person's current continuous employment cycle. GLB_TRANSFER between E or C assignments keeps the same cycle id; non-transfer rehiring starts a new cycle id.
    lineage:
      - datalake_pin_core_clean.periods_of_service.id_period_of_service
      - datalake_pin_core_clean.periods_of_service.id_person
      - datalake_pin_core_clean.all_assignments.action_code
      - datalake_pin_core_clean.all_assignments.assignment_sequence
      - datalake_pin_core_clean.all_assignments.assignment_type
  id_person:
    description: Unique identifier for the person, shared across all their contracts.
    lineage:
      - datalake_pin_core_clean.all_people.id_person
  id_termination_event_definition:
    description: Key of the assignment's termination event in event_definition; when the action-reason (Motivo da ação) is missing, the key uses reason sentinel -1 so the action (e.g. voluntary resignation) still resolves. NULL while the assignment has no termination event.
    lineage:
      - datalake_people.event_definition.id_event_definition
      - datalake_pin_core_clean.all_assignments.action_code
      - datalake_pin_core_clean.action_occurrence.id_action
      - datalake_pin_core_clean.action_occurrence.id_action_reason
  termination_type:
    description: Classification of the assignment's closing action for turnover after the actual termination date is reached. Voluntary for resignations; involuntary for company-initiated terminations; pending for a real company exit whose closing action is not yet mapped (still counted as an exit, resolves to voluntary/involuntary later). NULL before a scheduled termination or when the assignment is not a company exit — still active, internal transfer, expatriate movement, or intern/apprentice effectivation. Treat any non-NULL value as a completed real exit.
    categories:
      "voluntary": Employee-initiated exit (resignation).
      "involuntary": Company-initiated exit.
      "pending": Real company exit awaiting classification; counted in turnover and expected to resolve to voluntary or involuntary.
    lineage:
      - datalake_pin_core_clean.all_assignments.action_code
      - datalake_pin_core_clean.periods_of_service.dt_actual_termination
  employee_tmf_code:
    description: Registration code used to identify the employee in the TMF time-management system.
    lineage:
      - datalake_pin_core_clean.external_application_identifier.number_external_identifier
  legacy_code:
    description: Convenia/GSheets legacy registration code.
    lineage:
      - datalake_gsheets_people_clean.legacy_registration.legacy_registration
      - datalake_pin_core_clean.external_application_identifier.number_external_identifier
  employee_salu_code:
    description: Identifier used to cross-reference the employee in the SALU payroll/HR platform.
    lineage:
      - datalake_pin_core_clean.external_application_identifier.number_external_identifier
  assignment_number:
    description: The assignment registration number.
    lineage:
      - datalake_pin_core_clean.all_assignments.assignment_number
  legislation_code:
    description: Legislation code applicable to the work assignment.
    lineage:
      - datalake_pin_core_clean.all_assignments.legislation_code
  person_number:
    description: The person's identification number in the main HR system.
    lineage:
      - datalake_pin_core_clean.all_people.person_number
  assignment_type:
    description: Type of employment assignment. E for employee, C for contingent worker. Pension and pre-hire (P) assignments are excluded from this table.
    lineage:
      - datalake_pin_core_clean.all_assignments.assignment_type
  assignment_status_type:
    description: Current status of the work assignment (e.g., ACTIVE, INACTIVE).
    lineage:
      - datalake_pin_core_clean.all_assignments.assignment_status_type
  documented_first_name:
    description: Official / document-aligned first name from HCM (GLOBAL name). Not necessarily the preferred name for addressing the person.
    lineage:
      - datalake_pin_core_clean.person_name.documented_first_name
  documented_last_name:
    description: Official / document-aligned last name from HCM (GLOBAL name). Not necessarily the preferred name for addressing the person.
    lineage:
      - datalake_pin_core_clean.person_name.documented_last_name
  documented_full_name:
    description: Official / document-aligned full name from HCM (GLOBAL name). For compliance and formal records; prefer name for dashboards and communications.
    lineage:
      - datalake_pin_core_clean.person_name.documented_full_name
  display_name:
    description: HCM display name from person_name (GLOBAL). Retained for traceability; prefer name for report-facing preferred full name.
    lineage:
      - datalake_pin_core_clean.person_name.display_name
  name:
    description: Preferred full name for reporting and communications, derived in this query from person_name (GLOBAL) social names, display_name, and documented_full_name.
    lineage:
      - datalake_pin_core_clean.person_name.first_social_name
      - datalake_pin_core_clean.person_name.last_social_name
      - datalake_pin_core_clean.person_name.display_name
      - datalake_pin_core_clean.person_name.documented_full_name
  work_email:
    description: The employee's primary work email (W1), in lowercase.
    lineage:
      - datalake_pin_core_clean.email_address.email_address
  personal_email:
    description: The employee's personal email (H1), in lowercase.
    lineage:
      - datalake_pin_core_clean.email_address.email_address
  is_user_test:
    description: True when the person is a test user and should not be included in official datasets. Synthetic accounts are those with an open ID_ONDA1 identifier and a person_number shorter than 6 digits; real employees who keep ID_ONDA1 for PIN Systems access remain false.
    lineage:
      - datalake_pin_core_clean.external_application_identifier.id_person
      - datalake_pin_core_clean.all_people.person_number
  is_valid_assignment:
    description: True when the assignment is eligible for snapshots and reporting (employment or contractor assignment, not a test user).
    lineage:
      - datalake_pin_core_clean.all_assignments.assignment_type
      - datalake_pin_core_clean.external_application_identifier.type_external_identifier
      - datalake_pin_core_clean.all_people.person_number
  is_active:
    description: True when the employee is active, False when inactive.
  is_transfer_termination:
    description: True when the assignment was closed by an internal Global Transfer rather than a real exit; the person stays employed under a continuation assignment, the outgoing side symmetric to is_transfer_hire.
    lineage:
      - datalake_pin_core_clean.all_assignments.action_code
  is_transfer_hire:
    description: True when the assignment was opened as the continuation of an internal Global Transfer, the incoming side symmetric to is_transfer_termination; the person was already employed under the previous assignment.
    lineage:
      - datalake_pin_core_clean.all_assignments.action_code
      - datalake_pin_core_clean.all_assignments.assignment_sequence
  is_effectivation_hire:
    description: True when this assignment opened as an intern/apprentice effectivation (efetivação) hire recorded in PIN — the incoming side of the conversion. The destination role may still be intern/apprentice or effective; use with is_effective_worker when counting new effective hires.
    lineage:
      - datalake_pin_core_clean.all_assignments.action_code
      - datalake_pin_core_clean.all_assignments.assignment_sequence
      - datalake_pin_core_clean.action_occurrence.id_action_reason
      - datalake_pin_core_clean.action_reason_base.action_reason_code
  is_effectivation_termination:
    description: True when this assignment closed as the outgoing side of an intern/apprentice effectivation (efetivação) recorded in PIN — the intern/apprentice assignment immediately before an effectivation hire, not a real company exit.
    lineage:
      - datalake_pin_core_clean.all_assignments.action_code
      - datalake_pin_core_clean.all_assignments.assignment_sequence
      - datalake_pin_core_clean.action_occurrence.id_action_reason
      - datalake_pin_core_clean.action_reason_base.action_reason_code
  is_effective_worker:
    description: True when the assignment belongs to the effective workforce for turnover and headcount. False for interns and young apprentices based on the latest classifiable PIN job family, or the latest employee category when job family is null; True when both are null.
    lineage:
      - datalake_pin_core_clean.all_assignments.employee_category
      - datalake_pin_core_clean.all_assignments.id_job
      - datalake_pin_core_clean.job_family_translation.job_family_name
  is_reorganization_termination:
    description: True when the assignment is listed in the People layoff/reorganization tracker (assignment-level membership; every tracked row is a reorganization exit). The snapshot and fact tables expose the terminated-only view. Official turnover excludes reorganization exits by default.
    lineage:
      - datalake_gsheets_people_clean.layoffs.id_employee
  is_active_pin:
    description: Raw active status from Oracle HCM. On the termination date itself, Oracle still records TRUE; it only flips to FALSE the following day.
    lineage:
      - datalake_pin_core_clean.all_assignments.assignment_status_type
  is_person_latest_assignment:
    description: |
      True when this row represents the most recent assignment for the person (by dt_started / hire date).
      Use to filter one row per person for dim_employee and similar person-level views.
  dt_projected_started:
    description: Projected start date for the employee's activities, usually for future hires.
    lineage:
      - datalake_pin_core_clean.all_assignments.dt_projected_started
  dt_employee_hired:
    description: |
      Earliest hire date within the employee's current continuous employment cycle — the company-tenure anchor.
      Preserved across GLB_TRANSFER continuations (assignment types E and C) and reset on a genuine rehire, so it can differ from the PIN seniority date.
    lineage:
      - datalake_pin_core_clean.periods_of_service.dt_started
      - datalake_pin_core_clean.periods_of_service.id_period_of_service
      - datalake_pin_core_clean.periods_of_service.id_person
      - datalake_pin_core_clean.all_assignments.assignment_sequence
      - datalake_pin_core_clean.all_assignments.action_code
      - datalake_pin_core_clean.all_assignments.assignment_status_type
  dt_started:
    description: Effective start date of the work assignment.
    lineage:
      - datalake_pin_core_clean.periods_of_service.dt_started
  dt_actual_termination:
    description: Actual termination date of the work assignment. NULL for active assignments.
    lineage:
      - datalake_pin_core_clean.periods_of_service.dt_actual_termination
  dt_notified_termination:
    description: Date on which the termination was notified. NULL for active assignments.
    lineage:
      - datalake_pin_core_clean.periods_of_service.dt_notified_termination
  ts_load:
    description: Timestamp indicating when the data was loaded into this table.
