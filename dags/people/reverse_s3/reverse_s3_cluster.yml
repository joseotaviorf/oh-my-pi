cluster:
  type: emr_7_12_consolidation_s_memory_fleet_cluster
  custom_configurations:
    autotermination_minutes: 180
    aws_attributes:
      instance_profile_arn: '{{ var.value.emr_instance_profile_arn_people }}'
    # Comp inbound AP lives in us-east-2; this cluster (and the rest of reverse_s3)
    # writes 5A buckets in us-east-1. Per-bucket keys so Base44 CSV exports stay
    # on the default region and keep BucketOwnerFullControl. Empty canned.acl
    # overrides the repo-wide spark-submit ACL injection Comp rejects.
    spark_conf:
      spark.hadoop.fs.s3a.bucket.quintoandar-inbound-wikpng8fowgxahxxccrd8j6ogxydnuse2a-s3alias.endpoint.region: us-east-2
      spark.hadoop.fs.s3a.bucket.quintoandar-inbound-wikpng8fowgxahxxccrd8j6ogxydnuse2a-s3alias.canned.acl: ""
      spark.hadoop.fs.s3a.bucket.quintoandar-inbound-wikpng8fowgxahxxccrd8j6ogxydnuse2a-s3alias.acl.default: ""
    core_nodes:
      target_on_demand: 2
      target_spot: 0
      instance_types:
      - r6g.xlarge
      - r7g.xlarge
      - r6i.xlarge
    task_nodes:
      instance_types:
      - r6g.xlarge
      - r7g.xlarge
      - r6i.xlarge
      target_on_demand: 0
      target_spot: 3
      allocation_strategy: price-capacity-optimized
      bid_price_percentage: 100
  access_control_list:
    group_name: people-analytics
    permission_level: CAN_MANAGE
