dag:
  name: pin
  schedule_interval: 0 0 * * *
  owner: Data People
  callback_by_task: False
  dag_documentation:
    dag_purpose: |
      Unified PIN ingestion from Oracle HCM via Oracle Integration Cloud (OIC) and SFTP.
      Downloads, decrypts, parses, and loads encrypted files into incoming and raw layers
      for all PIN modules (core, absence, compensation, goal, hr_review, performance,
      questionnaires, talent). EMR step_concurrency_level caps concurrent OIC/SFTP access.

workflow:
  layer: raw
  type: custom_ingestion
  max_tables_per_cluster: 99999
  bucket_config_name: people_bucket
  has_hive_sync: true
  spark_session_configs:
    udfs:
    - SF_FORMAT_PROPER_NOUN
  load_spark_job: load_pin_raw
  default_extraction_type: full
  spark_job_arguments:
    - "{environment}"
    - "{bucket}"
    - "{dag_name}"
    - "{table_name}"
    - "{{ data_interval_start | ds }}"
    - "{partitions}"
    - "{extraction_type}"
    - "{load_start_date}"
    - "{load_end_date}"
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, 1), 'load_end_date') }}"
  # Joined tables load before DQs that reference them; sibling DQs stay parallel.
  clean_inner_dependencies:
    job:
      - valid_grades
      - rates
      - rate_values
    rate_values:
      - rates
    external_application_identifier:
      - all_people
  default_table_privileges:
    people-team:
    - ALL PRIVILEGES
  tables_customization:
    anc_absence_types_f:
      clean_table_name: type
      custom_schema: pin_absence
      vacuum_retention_hours: 168
      vacuum_lite: true
      extra_spark_job_arguments:
      - raw_custom_schema: pin_absence
        date_column_to_partition: last_update_date
    anc_absence_types_f_tl:
      clean_table_name: type_translation
      custom_schema: pin_absence
      vacuum_retention_hours: 168
      vacuum_lite: true
      extra_spark_job_arguments:
      - raw_custom_schema: pin_absence
        date_column_to_partition: last_update_date
    anc_per_abs_entries:
