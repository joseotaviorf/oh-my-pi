---
database_name: datalake_pin_core_clean
table_name: hr_organization
owner: isabella.araujo@quintoandar.com.br
domain: People
description: |-
  Stores organizational units from Oracle HCM, including identifiers, classification,
  activity status, and effective-dating validity fields used for historical analyses.
columns:
  id_organization:
    description: Unique identifier for the organization.
    lineage:
      - datalake_pin_core_raw.hr_organization_v.organization_id
  id_action_occurrence:
    description: Foreign key to action occurrence that originated this organization state.
    lineage:
      - datalake_pin_core_raw.hr_organization_v.action_occurrence_id
  id_business_group:
    description: Enterprise/business group identifier used for multi-tenancy partitioning.
    lineage:
      - datalake_pin_core_raw.hr_organization_v.business_group_id
  id_set:
    description: Reference data set identifier used by Oracle HCM.
    lineage:
      - datalake_pin_core_raw.hr_organization_v.set_id
  id_legal_entity:
    description: Identifier of the legal entity associated with the organization.
    lineage:
      - datalake_pin_core_raw.hr_organization_v.legal_entity_id
  id_establishment:
    description: Identifier of the establishment associated with the organization.
    lineage:
      - datalake_pin_core_raw.hr_organization_v.establishment_id
  organization_code:
    description: Business code identifying the organization.
    lineage:
      - datalake_pin_core_raw.hr_organization_v.organization_code
  legislation_code:
    description: Legislation code derived from the legal entity context.
    lineage:
      - datalake_pin_core_raw.hr_organization_v.legislation_code
  classification_code:
    description: Organization classification type (for example department or business unit).
    lineage:
      - datalake_pin_core_raw.hr_organization_v.classification_code
  name:
    description: Localized display name of the HR organization unit in the target language.
    lineage:
      - datalake_pin_core_raw.hr_organization_v.name
  status:
    description: Source status code indicating whether the organization is active or inactive.
    lineage:
      - datalake_pin_core_raw.hr_organization_v.status
  created_by:
    description: User who created the source row.
    lineage:
      - datalake_pin_core_raw.hr_organization_v.created_by
  updated_by:
    description: User who last updated the source row.
    lineage:
      - datalake_pin_core_raw.hr_organization_v.last_updated_by
  organization_type:
    description: Internal or external organization flag.
    lineage:
      - datalake_pin_core_raw.hr_organization_v.internal_external_flag
  object_version_number:
    description: Optimistic locking version number incremented on each update.
    lineage:
      - datalake_pin_core_raw.hr_organization_v.object_version_number
  is_active:
    description: Boolean flag derived from status = 'A'.
    lineage:
      - datalake_pin_core_raw.hr_organization_v.status
  dt_effective_started:
    description: Effective start date of this organization row in Oracle HCM.
    lineage:
      - datalake_pin_core_raw.hr_organization_v.effective_start_date
  dt_effective_ended:
    description: Effective end date of this organization row in Oracle HCM.
    lineage:
      - datalake_pin_core_raw.hr_organization_v.effective_end_date
  ts_created:
    description: Source timestamp when the row was created.
    lineage:
      - datalake_pin_core_raw.hr_organization_v.creation_date
  ts_updated:
    description: Source timestamp when the row was last updated.
    lineage:
      - datalake_pin_core_raw.hr_organization_v.last_update_date
  ts_load:
    description: Timestamp when the row was loaded into the clean table.
  year:
    description: Partition year.
    lineage:
      - datalake_pin_core_raw.hr_organization_v.year
  month:
    description: Partition month.
    lineage:
      - datalake_pin_core_raw.hr_organization_v.month
  day:
    description: Partition day.
    lineage:
      - datalake_pin_core_raw.hr_organization_v.day
