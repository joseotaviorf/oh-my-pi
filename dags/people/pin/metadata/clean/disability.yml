---
database_name: datalake_pin_core_clean
table_name: disability
owner: isabella.araujo@quintoandar.com.br
domain: People
description: >-
  Documented disability records from Oracle HCM (quota law / PCD), including HR narrative,
  work restrictions, accommodation requests, and flex subclassification and clinical codes.
columns:
  id_business_group:
    description: Identifier for the business unit, used for multi-tenant data separation.
      Foreign key.
    lineage:
      - datalake_pin_core_raw.per_disabilities_f.business_group_id
  id_person:
    description: Foreign key referencing the person.
    lineage:
      - datalake_pin_core_raw.per_disabilities_f.person_id
  id_disability:
    description: System-generated unique identifier for the disability record. Primary
      key.
    lineage:
      - datalake_pin_core_raw.per_disabilities_f.disability_id
  disability_code:
    description: User-defined code to identify a disability record, unique in combination
      with the effective start date.
    lineage:
      - datalake_pin_core_raw.per_disabilities_f.disability_code
  category:
    description: Category of the person's disability.
    lineage:
      - datalake_pin_core_raw.per_disabilities_f.category
  created_by:
    description: User who created the record.
    lineage:
      - datalake_pin_core_raw.per_disabilities_f.created_by
  last_updated_by:
    description: User who last updated the record.
    lineage:
      - datalake_pin_core_raw.per_disabilities_f.last_updated_by
  quota_fte:
    description: Full-Time Equivalent (FTE) value for the disability quota.
    lineage:
      - datalake_pin_core_raw.per_disabilities_f.quota_fte
  status:
    description: >-
      PIN disability record status code (A active, P pending, I inactive). Pending often
      indicates documentation under review or not yet framed under quota law.
    lineage:
      - datalake_pin_core_raw.per_disabilities_f.status
  disability_description:
    description: Free-text description of the documented disability as entered in PIN (e.g. clinical or HR narrative).
    lineage:
      - datalake_pin_core_raw.per_disabilities_f.description
  work_restriction:
    description: Work restrictions associated with the documented disability record in PIN.
    lineage:
      - datalake_pin_core_raw.per_disabilities_f.work_restriction
  accommodation_request:
    description: Workplace accommodation request text linked to the disability record in PIN.
    lineage:
      - datalake_pin_core_raw.per_disabilities_f.accommodation_request
  clinical_classification_code:
    description: >-
      Clinical or administrative classification code from PIN flex attribute2 when populated
      (for example ICD/CID codes such as H544).
    lineage:
      - datalake_pin_core_raw.per_disabilities_f.attribute2
  documented_subclassification:
    description: >-
      HR-entered disability subclassification from PIN attribute1 (Levantamento PCD
      "Subclassificação", for example Visual - Baixa Visão).
    lineage:
      - datalake_pin_core_raw.per_disabilities_f.attribute1
  legislation_code:
    description: Legal code applicable to this disability information.
    lineage:
      - datalake_pin_core_raw.per_disabilities_f.legislation_code
  object_version_number:
    description: Counter for optimistic locking, incremented on each update to detect
      concurrent modifications.
    lineage:
      - datalake_pin_core_raw.per_disabilities_f.object_version_number
  dt_effective_ended:
    description: End date of the period for which this disability record is valid.
    lineage:
      - datalake_pin_core_raw.per_disabilities_f.effective_end_date
  dt_effective_started:
    description: Start date of the period for which this disability record is valid.
    lineage:
      - datalake_pin_core_raw.per_disabilities_f.effective_start_date
  ts_created:
    description: Timestamp of when the record was created.
    lineage:
      - datalake_pin_core_raw.per_disabilities_f.creation_date
  ts_updated:
    description: Timestamp of when the record was last updated.
    lineage:
      - datalake_pin_core_raw.per_disabilities_f.last_update_date
  ts_load:
    description: Timestamp indicating when the data was loaded into this table. Reflects
      data ingestion or reprocessing time.
  year:
    description: Year extracted from the 'ts_updated' column, useful for data partitioning
      and filtering.
    lineage:
      - datalake_pin_core_raw.per_disabilities_f.year
  month:
    description: Month extracted from the 'ts_updated' column, useful for data partitioning
      and filtering.
    lineage:
      - datalake_pin_core_raw.per_disabilities_f.month
  day:
    description: Day extracted from the 'ts_updated' column, useful for data partitioning
      and filtering.
    lineage:
      - datalake_pin_core_raw.per_disabilities_f.day
