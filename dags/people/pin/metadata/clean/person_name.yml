database_name: datalake_pin_core_clean
table_name: person_name
owner: isabella.araujo@quintoandar.com.br
domain: People
description: |-
  Stores core and legislation-specific name components for individuals, including names in different character sets. Tracks changes over time with date effectivity.
  Text name fields in clean are standardized for consistent reading and reporting across regions (Latin America, Portugal, United States): plain Latin letters, natural word capitalization, and short connecting words (articles and prepositions) in lowercase when they sit between other words.
  Preferred reporting full name (social name precedence over display_name over documented_full_name) is built in datalake_people.identifier_mapping.name; use documented_* fields here for official / document-aligned names from Oracle HCM (GLOBAL name type).
columns:
  id_business_group:
    description: Identifier for the business unit, used for multi-tenant data separation. Foreign key.
    lineage:
    - datalake_pin_core_raw.per_person_names_f.business_group_id
  id_person:
    description: Identifier of the person to whom this name record belongs.
    lineage:
    - datalake_pin_core_raw.per_person_names_f.person_id
  id_person_name:
    description: System-generated unique identifier for the person's name record. Primary key.
    lineage:
    - datalake_pin_core_raw.per_person_names_f.person_name_id
  character_encoding:
    description: Specifies the character set used to store the name details.
    lineage:
    - datalake_pin_core_raw.per_person_names_f.char_set_context
  created_by:
    description: User who created the record.
    lineage:
    - datalake_pin_core_raw.per_person_names_f.created_by
  updated_by:
    description: User who last updated the record.
    lineage:
    - datalake_pin_core_raw.per_person_names_f.last_updated_by
  display_name:
    description: |-
      Formatted name for on-screen display from HCM (GLOBAL name type). In clean, accents are converted to plain Latin letters, each word is shown with a leading capital letter, and short connecting words (for example de, da, do, van, y) stay lowercase when they appear between other words.
      For report-facing preferred full name, use datalake_people.identifier_mapping.name; display_name is retained here for traceability.
    lineage:
    - datalake_pin_core_raw.per_person_names_f.display_name
  documented_first_name:
    description: |-
      Official / document-aligned given name from HCM (GLOBAL name type). Not necessarily how the person should be addressed when a social name exists.
      In clean, same text standardization as other name fields.
    lineage:
    - datalake_pin_core_raw.per_person_names_f.first_name
  documented_last_name:
    description: |-
      Official / document-aligned surname from HCM (GLOBAL name type). Not necessarily how the person should be addressed when a social name exists.
      In clean, same text standardization as other name fields.
    lineage:
    - datalake_pin_core_raw.per_person_names_f.last_name
  documented_full_name:
    description: |-
      Official / document-aligned full name from HCM (GLOBAL name type), suitable for formal records and compliance. For preferred display in communications and reports, use datalake_people.identifier_mapping.name.
      In clean, same text standardization as other name fields.
    lineage:
    - datalake_pin_core_raw.per_person_names_f.full_name
  list_name:
    description: Formatted name for alphabetical lists, often starting with the last name. In clean, same text standardization as other name fields.
    lineage:
    - datalake_pin_core_raw.per_person_names_f.list_name
  name_type:
    description: Indicates if the name is globally applicable or specific to a legal context. In clean, values are stored in uppercase as standardized codes for stable filtering and joins.
    lineage:
    - datalake_pin_core_raw.per_person_names_f.name_type
    categories:
      Global: Name applicable in any context.
      PT: Portugal.
      BR: Brazil.
      AR: Argentine.
  first_social_name:
    description: The person's preferred given name (social name). From Name DFF field NAM_INFORMATION15. In clean, same text standardization as other name fields.
    lineage:
    - datalake_pin_core_raw.per_person_names_f.nam_information15
  last_social_name:
    description: The person's preferred surname (social name). From Name DFF field NAM_INFORMATION16. In clean, same text standardization as other name fields.
    lineage:
    - datalake_pin_core_raw.per_person_names_f.nam_information16
  legislation_code:
    description: Legal code associated with this name data.
    lineage:
    - datalake_pin_core_raw.per_person_names_f.legislation_code
  object_version_number:
    description: Counter for optimistic locking, incremented on each update to detect concurrent modifications.
    lineage:
    - datalake_pin_core_raw.per_person_names_f.object_version_number
  dt_effective_ended:
    description: End date of the period for which this name record is valid.
    lineage:
    - datalake_pin_core_raw.per_person_names_f.effective_end_date
  dt_effective_started:
    description: Start date of the period for which this name record is valid.
    lineage:
    - datalake_pin_core_raw.per_person_names_f.effective_start_date
  ts_created:
    description: Timestamp of when the record was created.
    lineage:
    - datalake_pin_core_raw.per_person_names_f.creation_date
  ts_updated:
    description: Timestamp of when the record was last updated.
    lineage:
    - datalake_pin_core_raw.per_person_names_f.last_update_date
  ts_load:
    description: Timestamp indicating when the data was loaded into this table. Reflects data ingestion or reprocessing time.
  year:
    description: Year extracted from the 'ts_updated' column, useful for data partitioning and filtering.
    lineage:
    - datalake_pin_core_raw.per_person_names_f.year
  month:
    description: Month extracted from the 'ts_updated' column, useful for data partitioning and filtering.
    lineage:
    - datalake_pin_core_raw.per_person_names_f.month
  day:
    description: Day extracted from the 'ts_updated' column, useful for data partitioning and filtering.
    lineage:
    - datalake_pin_core_raw.per_person_names_f.day
