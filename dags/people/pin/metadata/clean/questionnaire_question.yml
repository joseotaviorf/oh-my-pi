database_name: datalake_pin_questionnaires_clean
table_name: questionnaire_question
owner: isabella.araujo@quintoandar.com.br
domain: People
description: |-
  Placement of a question within a questionnaire section in PIN, including display order and response type.
  One row per questionnaire question placement.
  Covers all questionnaire question placements ingested from PIN.
  Full refresh from raw; version and sequence numbers are cast to integers; timestamps are cast to TIMESTAMP.
columns:
  id_business_group:
    description: Identifier of the enterprise business group in PIN, used for multi-tenancy partitioning.
    lineage:
    - datalake_pin_questionnaires_raw.hrq_qstnr_questions.business_group_id
  id_questionnaire_question:
    description: Identifier of the questionnaire question placement in PIN. Primary key for this table; links to datalake_pin_questionnaires_clean.question_response.
    lineage:
    - datalake_pin_questionnaires_raw.hrq_qstnr_questions.qstnr_question_id
  id_questionnaire_section:
    description: Identifier of the questionnaire section that contains this question placement in PIN.
    lineage:
    - datalake_pin_questionnaires_raw.hrq_qstnr_questions.qstnr_section_id
  id_question:
    description: Identifier of the underlying question definition in PIN. References datalake_pin_questionnaires_clean.question_base.
    lineage:
    - datalake_pin_questionnaires_raw.hrq_qstnr_questions.question_id
  id_response_type:
    description: Identifier of the response type allowed for this question placement in PIN (e.g. single choice, free text).
    lineage:
    - datalake_pin_questionnaires_raw.hrq_qstnr_questions.response_type_id
  created_by:
    description: PIN user who created the row.
    lineage:
    - datalake_pin_questionnaires_raw.hrq_qstnr_questions.created_by
  updated_by:
    description: PIN user or process that last updated the row.
    lineage:
    - datalake_pin_questionnaires_raw.hrq_qstnr_questions.last_updated_by
  object_version_number:
    description: Optimistic locking counter incremented on each update to detect concurrent changes.
    lineage:
    - datalake_pin_questionnaires_raw.hrq_qstnr_questions.object_version_number
  question_version_number:
    description: Version number of the question definition bound to this placement, cast to integer in the clean layer.
    lineage:
    - datalake_pin_questionnaires_raw.hrq_qstnr_questions.qstn_version_num
  sequence_number:
    description: Display order of the question within its questionnaire section, cast to integer in the clean layer.
    lineage:
    - datalake_pin_questionnaires_raw.hrq_qstnr_questions.seq_num
  ts_created:
    description: Timestamp when the row was created in PIN, cast to TIMESTAMP in the clean layer.
    lineage:
    - datalake_pin_questionnaires_raw.hrq_qstnr_questions.creation_date
  ts_updated:
    description: Timestamp when the row was last updated in PIN, cast to TIMESTAMP in the clean layer.
    lineage:
    - datalake_pin_questionnaires_raw.hrq_qstnr_questions.last_update_date
  ts_load:
    description: Timestamp when the record was loaded into the clean table.
  year:
    description: Partition year derived from ts_updated.
    lineage:
    - datalake_pin_questionnaires_raw.hrq_qstnr_questions.year
  month:
    description: Partition month derived from ts_updated.
    lineage:
    - datalake_pin_questionnaires_raw.hrq_qstnr_questions.month
  day:
    description: Partition day derived from ts_updated.
    lineage:
    - datalake_pin_questionnaires_raw.hrq_qstnr_questions.day
