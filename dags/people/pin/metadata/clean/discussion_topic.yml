---
database_name: datalake_pin_performance_clean
table_name: discussion_topic
owner: isabella.araujo@quintoandar.com.br
domain: People
description: Stores discussion topics associated with check-in meetings in Oracle HCM (HRA_DISCUSSION_TOPICS). Each check-in meeting can have multiple discussion topics. A topic can reference a performance goal (ORA_PERF_GOAL) or be a general agenda item (ORA_GENERAL).
columns:
  id_discussion_topic:
    description: Primary key. Unique identifier of the discussion topic in Oracle HCM.
    lineage:
      - datalake_pin_performance_raw.hra_discussion_topics.discussion_topic_id
  id_business_group:
    description: Foreign key referencing the business group. Always 1 for QuintoAndar.
    lineage:
      - datalake_pin_performance_raw.hra_discussion_topics.business_group_id
  id_check_in_meeting:
    description: Foreign key referencing the check-in meeting this topic belongs to. Joins with datalake_pin_performance_clean.check_in_meeting.
    lineage:
      - datalake_pin_performance_raw.hra_discussion_topics.check_in_meeting_id
  id_object:
    description: Polymorphic foreign key pointing to the object referenced by this topic. For ORA_PERF_GOAL topics, this is the goal ID. For ORA_GENERAL topics, this typically equals id_discussion_topic.
    lineage:
      - datalake_pin_performance_raw.hra_discussion_topics.object_id
  id_created_by_person:
    description: Oracle HCM internal person ID of the user who created this discussion topic.
    lineage:
      - datalake_pin_performance_raw.hra_discussion_topics.created_by_person_id
  topic_type:
    description: Classifies the type of discussion topic. ORA_PERF_GOAL indicates a performance goal topic; ORA_GENERAL indicates a free-form agenda topic.
    lineage:
      - datalake_pin_performance_raw.hra_discussion_topics.topic_type
    categories:
      ORA_PERF_GOAL: Topic is linked to a specific performance goal.
      ORA_GENERAL: Topic is a general free-form agenda item.
  topic_name:
    description: Display name or title of the discussion topic, entered by the meeting creator. May be empty for goal-linked topics.
    lineage:
      - datalake_pin_performance_raw.hra_discussion_topics.name
  object_version_number:
    description: Counter for optimistic locking, incremented on each update to the record.
    lineage:
      - datalake_pin_performance_raw.hra_discussion_topics.object_version_number
  created_by:
    description: Email of the Oracle HCM user who created this record.
    lineage:
      - datalake_pin_performance_raw.hra_discussion_topics.created_by
  updated_by:
    description: Email of the Oracle HCM user who last updated this record.
    lineage:
      - datalake_pin_performance_raw.hra_discussion_topics.last_updated_by
  ts_created:
    description: Timestamp when this discussion topic was created in Oracle HCM.
    lineage:
      - datalake_pin_performance_raw.hra_discussion_topics.creation_date
  ts_updated:
    description: Timestamp of the last update to this discussion topic record.
    lineage:
      - datalake_pin_performance_raw.hra_discussion_topics.last_update_date
  ts_load:
    description: Timestamp when this record was loaded into the clean table by the Spark job. Produced using NOW() and changes on reprocessing.
  year:
    description: Year partition derived from last_update_date, used for partition pruning.
    lineage:
      - datalake_pin_performance_raw.hra_discussion_topics.year
  month:
    description: Month partition derived from last_update_date, used for partition pruning.
    lineage:
      - datalake_pin_performance_raw.hra_discussion_topics.month
  day:
    description: Day partition derived from last_update_date, used for partition pruning.
    lineage:
      - datalake_pin_performance_raw.hra_discussion_topics.day
