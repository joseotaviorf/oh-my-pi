database_name: datalake_pin_questionnaires_clean
table_name: question_translation
owner: isabella.araujo@quintoandar.com.br
domain: People
description: |-
  Localized question text and instructions for question definitions in PIN.
  One row per question per language.
  Covers all question translations ingested from PIN.
  HTML tags are stripped from instructions_text in the clean layer; timestamps are cast to TIMESTAMP.
columns:
  id_business_group:
    description: Identifier of the enterprise business group in PIN, used for multi-tenancy partitioning.
    lineage:
    - datalake_pin_questionnaires_raw.hrq_questions_tl.business_group_id
  id_question:
    description: Identifier of the question definition being translated in PIN. References datalake_pin_questionnaires_clean.question_base.
    lineage:
    - datalake_pin_questionnaires_raw.hrq_questions_tl.question_id
  instructions_text:
    description: Localized instructions shown before the question prompt, with HTML tags stripped in the clean layer.
    lineage:
    - datalake_pin_questionnaires_raw.hrq_questions_tl.instructions_text
  question_text:
    description: Localized question prompt shown to the respondent in the target language.
    lineage:
    - datalake_pin_questionnaires_raw.hrq_questions_tl.question_text
  language:
    description: ISO language code of the translation row in PIN.
    lineage:
    - datalake_pin_questionnaires_raw.hrq_questions_tl.language
  source_language:
    description: ISO language code in which the translatable content was originally authored in PIN.
    lineage:
    - datalake_pin_questionnaires_raw.hrq_questions_tl.source_lang
  created_by:
    description: PIN user who created the row.
    lineage:
    - datalake_pin_questionnaires_raw.hrq_questions_tl.created_by
  updated_by:
    description: PIN user or process that last updated the row.
    lineage:
    - datalake_pin_questionnaires_raw.hrq_questions_tl.last_updated_by
  object_version_number:
    description: Optimistic locking counter incremented on each update to detect concurrent changes.
    lineage:
    - datalake_pin_questionnaires_raw.hrq_questions_tl.object_version_number
  question_version_number:
    description: Version number of the question definition associated with this translation, cast to integer in the clean layer.
    lineage:
    - datalake_pin_questionnaires_raw.hrq_questions_tl.qstn_version_num
  ts_created:
    description: Timestamp when the row was created in PIN, cast to TIMESTAMP in the clean layer.
    lineage:
    - datalake_pin_questionnaires_raw.hrq_questions_tl.creation_date
  ts_updated:
    description: Timestamp when the row was last updated in PIN, cast to TIMESTAMP in the clean layer.
    lineage:
    - datalake_pin_questionnaires_raw.hrq_questions_tl.last_update_date
  ts_load:
    description: Timestamp when the record was loaded into the clean table.
  year:
    description: Partition year derived from ts_updated.
    lineage:
    - datalake_pin_questionnaires_raw.hrq_questions_tl.year
  month:
    description: Partition month derived from ts_updated.
    lineage:
    - datalake_pin_questionnaires_raw.hrq_questions_tl.month
  day:
    description: Partition day derived from ts_updated.
    lineage:
    - datalake_pin_questionnaires_raw.hrq_questions_tl.day
