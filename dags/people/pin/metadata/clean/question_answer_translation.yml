database_name: datalake_pin_questionnaires_clean
table_name: question_answer_translation
owner: isabella.araujo@quintoandar.com.br
domain: People
description: |-
  Localized labels for predefined answer options attached to questionnaire questions in PIN.
  One row per answer option per language.
  Covers all answer option translations ingested from PIN.
  Full refresh from raw; timestamps are cast to TIMESTAMP.
columns:
  id_business_group:
    description: Identifier of the enterprise business group in PIN, used for multi-tenancy partitioning.
    lineage:
    - datalake_pin_questionnaires_raw.hrq_qstn_answers_tl.business_group_id
  id_question_answer:
    description: Identifier of the answer option in PIN. Primary key for this table; referenced by datalake_pin_questionnaires_clean.question_response.
    lineage:
    - datalake_pin_questionnaires_raw.hrq_qstn_answers_tl.qstn_answer_id
  long_text:
    description: Localized display text of the answer option shown to the respondent.
    lineage:
    - datalake_pin_questionnaires_raw.hrq_qstn_answers_tl.long_text
  language:
    description: ISO language code of the translation row in PIN.
    lineage:
    - datalake_pin_questionnaires_raw.hrq_qstn_answers_tl.language
  source_language:
    description: ISO language code in which the translatable content was originally authored in PIN.
    lineage:
    - datalake_pin_questionnaires_raw.hrq_qstn_answers_tl.source_lang
  response_feedback:
    description: Localized feedback message shown to the respondent after selecting this answer option.
    lineage:
    - datalake_pin_questionnaires_raw.hrq_qstn_answers_tl.response_feedback
  created_by:
    description: PIN user who created the row.
    lineage:
    - datalake_pin_questionnaires_raw.hrq_qstn_answers_tl.created_by
  updated_by:
    description: PIN user or process that last updated the row.
    lineage:
    - datalake_pin_questionnaires_raw.hrq_qstn_answers_tl.last_updated_by
  object_version_number:
    description: Optimistic locking counter incremented on each update to detect concurrent changes.
    lineage:
    - datalake_pin_questionnaires_raw.hrq_qstn_answers_tl.object_version_number
  ts_created:
    description: Timestamp when the row was created in PIN, cast to TIMESTAMP in the clean layer.
    lineage:
    - datalake_pin_questionnaires_raw.hrq_qstn_answers_tl.creation_date
  ts_updated:
    description: Timestamp when the row was last updated in PIN, cast to TIMESTAMP in the clean layer.
    lineage:
    - datalake_pin_questionnaires_raw.hrq_qstn_answers_tl.last_update_date
  ts_load:
    description: Timestamp when the record was loaded into the clean table.
  year:
    description: Partition year derived from ts_updated.
    lineage:
    - datalake_pin_questionnaires_raw.hrq_qstn_answers_tl.year
  month:
    description: Partition month derived from ts_updated.
    lineage:
    - datalake_pin_questionnaires_raw.hrq_qstn_answers_tl.month
  day:
    description: Partition day derived from ts_updated.
    lineage:
    - datalake_pin_questionnaires_raw.hrq_qstn_answers_tl.day
