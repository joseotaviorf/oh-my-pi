---
table_name: datalake_pin_questionnaires_clean.questionnaire_participant
alert_channel: PEOPLE_ALERTS
table_level_validations:
  has_size:
    greater_than: 1
    severity_level: Error
column_level_validations:
  id_questionnaire_participant:
    is_complete:
      severity_level: Warning
  one_row_per_questionnaire_participant_and_object_version:
    custom:
      # id_questionnaire_participant + object_version_number should be unique
      constraint: "(SELECT COUNT(*) FROM (SELECT 1 FROM datalake_pin_questionnaires_clean.questionnaire_participant GROUP BY id_questionnaire_participant, object_version_number HAVING COUNT(*) > 1)) = 0"
      severity_level: Warning
