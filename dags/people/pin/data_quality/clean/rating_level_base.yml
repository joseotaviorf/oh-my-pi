---
table_name: datalake_pin_talent_clean.rating_level_base
alert_channel: PEOPLE_ALERTS
table_level_validations:
  has_size:
    greater_than: 1
    severity_level: Error
column_level_validations:
  id_rating_level:
    is_complete:
      severity_level: Warning
  one_row_per_rating_level_and_object_version:
    custom:
      # id_rating_level + object_version_number should be unique
      constraint: "(SELECT COUNT(*) FROM (SELECT 1 FROM datalake_pin_talent_clean.rating_level_base GROUP BY id_rating_level, object_version_number HAVING COUNT(*) > 1)) = 0"
      severity_level: Warning
