---
table_name: datalake_pin_questionnaires_clean.question_translation
alert_channel: PEOPLE_ALERTS
table_level_validations:
  has_size:
    greater_than: 1
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: -10
    less_than_or_equal_to: 25
    severity_level: Error
column_level_validations:
  id_question:
    is_complete:
      severity_level: Warning
  one_row_per_question_language_and_question_version:
    custom:
      # id_question + language + question_version_number should be unique
      constraint: "(SELECT COUNT(*) FROM (SELECT 1 FROM datalake_pin_questionnaires_clean.question_translation GROUP BY id_question, language, question_version_number HAVING COUNT(*) > 1)) = 0"
      severity_level: Error
