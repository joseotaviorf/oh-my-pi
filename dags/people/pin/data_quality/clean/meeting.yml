---
table_name: datalake_pin_hr_review_clean.meeting
alert_channel: PEOPLE_ALERTS
table_level_validations:
  has_size:
    greater_than: 1
    severity_level: Error
column_level_validations:
  id_meeting:
    is_complete:
      severity_level: Warning
  one_row_per_meeting_and_object_version:
    custom:
      # id_meeting + object_version_number should be unique
      constraint: "(SELECT COUNT(*) FROM (SELECT 1 FROM datalake_pin_hr_review_clean.meeting GROUP BY id_meeting, object_version_number HAVING COUNT(*) > 1)) = 0"
      severity_level: Warning
