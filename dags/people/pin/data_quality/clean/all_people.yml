---
table_name: datalake_pin_core_clean.all_people
alert_channel: PEOPLE_ALERTS
table_level_validations:
  has_size:
    greater_than: 1
    severity_level: Error
column_level_validations:
  id_person:
    is_complete:
      severity_level: Warning
  one_row_per_person_and_effective_start:
    custom:
      # No duplicate rows for the same (id_person, dt_effective_started).
      constraint: "(SELECT COUNT(*) FROM (SELECT 1 FROM datalake_pin_core_clean.all_people GROUP BY id_person, dt_effective_started HAVING COUNT(*) > 1)) = 0"
      severity_level: Warning