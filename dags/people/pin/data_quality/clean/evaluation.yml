---
table_name: datalake_pin_performance_clean.evaluation
alert_channel: PEOPLE_ALERTS
table_level_validations:
  has_size:
    greater_than: 1
    severity_level: Error
column_level_validations:
  id_evaluation:
    is_complete:
      severity_level: Warning
  one_row_per_evaluation_and_object_version:
    custom:
      # id_evaluation + object_version_number should be unique
      constraint: "(SELECT COUNT(*) FROM (SELECT 1 FROM datalake_pin_performance_clean.evaluation GROUP BY id_evaluation, object_version_number HAVING COUNT(*) > 1)) = 0"
      severity_level: Warning
