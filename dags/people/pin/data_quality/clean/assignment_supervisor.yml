table_name: datalake_pin_core_clean.assignment_supervisor
alert_channel: PEOPLE_ALERTS
table_level_validations:
  has_size:
    greater_than: 1
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: -10
    less_than_or_equal_to: 25
    severity_level: Error
column_level_validations:
  id_assignment_supervisor:
    is_complete:
      severity_level: Warning
  dt_effective_started:
    is_complete:
      severity_level: Warning
  dt_effective_ended:
    is_complete:
      severity_level: Warning
  one_row_per_assignment_supervisor_and_effective_start:
    custom:
      # No duplicate rows for the same (id_assignment_supervisor, dt_effective_started).
      constraint: "(SELECT COUNT(*) FROM (SELECT 1 FROM datalake_pin_core_clean.assignment_supervisor GROUP BY id_assignment_supervisor, dt_effective_started HAVING COUNT(*) > 1)) = 0"
      severity_level: Error
