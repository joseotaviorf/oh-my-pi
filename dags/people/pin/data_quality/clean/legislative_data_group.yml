---
table_name: datalake_pin_core_clean.legislative_data_group
alert_channel: PEOPLE_ALERTS
table_level_validations:
  has_size:
    greater_than: 1
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: -10
    less_than_or_equal_to: 25
    severity_level: Error
column_level_validations:
  id_legislative_data_group:
    is_unique:
      severity_level: Warning
  one_row_per_legislative_data_group_and_object_version:
    custom:
      # No duplicate rows for the same (id_legislative_data_group, object_version_number).
      constraint: "(SELECT COUNT(*) FROM (SELECT 1 FROM datalake_pin_core_clean.legislative_data_group GROUP BY id_legislative_data_group, object_version_number HAVING COUNT(*) > 1)) = 0"
      severity_level: Error
  legislation_code:
    is_complete:
      severity_level: Warning
