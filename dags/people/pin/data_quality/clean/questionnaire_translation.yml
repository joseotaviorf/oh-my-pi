---
table_name: datalake_pin_questionnaires_clean.questionnaire_translation
alert_channel: PEOPLE_ALERTS
table_level_validations:
  has_size:
    greater_than: 1
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: -10
    less_than_or_equal_to: 25
    severity_level: Error
column_level_validations:
  id_questionnaire:
    is_complete:
      severity_level: Warning
  one_row_per_questionnaire_language_and_questionnaire_version:
    custom:
      # id_questionnaire + language + questionnaire_version_number should be unique
      constraint: "(SELECT COUNT(*) FROM (SELECT 1 FROM datalake_pin_questionnaires_clean.questionnaire_translation GROUP BY id_questionnaire, language, questionnaire_version_number HAVING COUNT(*) > 1)) = 0"
      severity_level: Error
