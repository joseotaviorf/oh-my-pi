---
table_name: datalake_pin_questionnaires_clean.question_answer_translation
alert_channel: PEOPLE_ALERTS
table_level_validations:
  has_size:
    greater_than: 1
    severity_level: Error
column_level_validations:
  id_question_answer:
    is_complete:
      severity_level: Warning
  one_row_per_question_answer_language_and_object_version:
    custom:
      # id_question_answer + language + object_version_number should be unique
      constraint: "(SELECT COUNT(*) FROM (SELECT 1 FROM datalake_pin_questionnaires_clean.question_answer_translation GROUP BY id_question_answer, language, object_version_number HAVING COUNT(*) > 1)) = 0"
      severity_level: Warning
