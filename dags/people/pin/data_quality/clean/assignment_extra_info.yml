---
table_name: datalake_pin_core_clean.assignment_extra_info
alert_channel: PEOPLE_ALERTS
table_level_validations:
  has_size:
    greater_than: 1
    severity_level: Error
column_level_validations:
  id_assignment_extra_info:
    is_complete:
      severity_level: Warning
  one_row_per_assignment_extra_info_and_effective_start:
    custom:
      # No duplicate rows for the same (id_assignment_extra_info, dt_effective_started).
      constraint: "(SELECT COUNT(*) FROM (SELECT 1 FROM datalake_pin_core_clean.assignment_extra_info GROUP BY id_assignment_extra_info, dt_effective_started HAVING COUNT(*) > 1)) = 0"
      severity_level: Warning
