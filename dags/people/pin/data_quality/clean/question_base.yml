---
table_name: datalake_pin_questionnaires_clean.question_base
alert_channel: PEOPLE_ALERTS
table_level_validations:
  has_size:
    greater_than: 1
    severity_level: Error
column_level_validations:
  id_question:
    is_complete:
      severity_level: Warning
  one_row_per_question_and_question_version:
    custom:
      # id_question + question_version_number should be unique (versioned grain, not object_version_number)
      constraint: "(SELECT COUNT(*) FROM (SELECT 1 FROM datalake_pin_questionnaires_clean.question_base GROUP BY id_question, question_version_number HAVING COUNT(*) > 1)) = 0"
      severity_level: Warning
