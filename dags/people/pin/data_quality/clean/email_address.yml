---
table_name: datalake_pin_core_clean.email_address
alert_channel: PEOPLE_ALERTS
table_level_validations:
  has_size:
    greater_than: 1
    severity_level: Error
column_level_validations:
  id_email_address:
    is_complete:
      severity_level: Warning
  one_row_per_email_address_and_object_version:
    custom:
      # No duplicate rows for the same (id_email_address, object_version_number).
      constraint: "(SELECT COUNT(*) FROM (SELECT 1 FROM datalake_pin_core_clean.email_address GROUP BY id_email_address, object_version_number HAVING COUNT(*) > 1)) = 0"
      severity_level: Warning

