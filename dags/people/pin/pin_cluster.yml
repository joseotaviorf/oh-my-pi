cluster:
  type: emr_7_12_consolidation_xs_memory_fleet_cluster
  custom_configurations:
    autotermination_minutes: 120
    aws_attributes:
      instance_profile_arn: '{{ var.value.emr_instance_profile_arn_people }}'
    # EMR StepConcurrencyLevel: caps concurrent Spark steps (OIC/SFTP pulls) on this
    # cluster. Replaces the old pattern of 8 staggered pin_* DAG schedules.
    step_concurrency_level: 10
    master_node_type_id: r6g.2xlarge
    core_nodes:
      target_on_demand: 2
      target_spot: 0
      instance_types:
      - r6g.xlarge
      - r7g.xlarge
      - r6i.xlarge
    task_nodes:
      instance_types:
      - r6g.xlarge
      - r7g.xlarge
      - r6i.xlarge
      target_on_demand: 0
      target_spot: 1
      allocation_strategy: price-capacity-optimized
      bid_price_percentage: 100
  access_control_list:
    group_name: people-analytics
    permission_level: CAN_MANAGE
  custom_libraries:
  - pypi:
      package: paramiko==4.0.0
