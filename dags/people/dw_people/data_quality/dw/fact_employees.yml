---
table_name: dw_people.fact_employees
alert_channel: PEOPLE_ALERTS

table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: 0
    less_than_or_equal_to: 25
    severity_level: Warning

column_level_validations:
  sk_employee:
    is_complete:
      severity_level: Error
  one_row_per_active_employee:
    custom:
      # Grain uniqueness: one row per active employee (sk_employee).
      constraint: |-
        (SELECT COUNT(*) FROM (
          SELECT sk_employee
          FROM dw_people.fact_employees
          GROUP BY sk_employee
          HAVING COUNT(*) > 1
        )) = 0
      severity_level: Error
  active_workforce_only:
    custom:
      # Every fact row must exist in dim_employee (active-only public dimension).
      constraint: |-
        (SELECT COUNT(*)
         FROM dw_people.fact_employees AS fact
         LEFT JOIN dw_people.dim_employee AS emp
           ON fact.sk_employee = emp.sk_employee
         WHERE emp.sk_employee IS NULL
        ) = 0
      severity_level: Error
  sk_reference_date:
    is_complete:
      severity_level: Error
  dt_reference:
    is_complete:
      severity_level: Error
  ts_load:
    is_complete:
      severity_level: Warning
