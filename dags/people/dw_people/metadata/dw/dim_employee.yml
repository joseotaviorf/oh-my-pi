---
database_name: dw_people
table_name: dim_employee
owner: gabriel.berger@quintoandar.com.br
domain: People
description: |
  Dimension table for active employees' public profile. Contains person_number, name,
  and work_email for dashboards, hierarchy views, and non-sensitive reporting.
  Grain: one record per active employee. SCD Type 1: current values only.
  Terminated employees are excluded; use dw_employee_details for full workforce history.
columns:
  sk_employee:
    description: Surrogate key for the employee. Stable system identifier for the person.
    lineage:
      - datalake_people.identifier_mapping.id_person
  person_number:
    description: Internal person code. Unique identifier for the employee in the HR system (PIN - Oracle HCM).
    lineage:
      - datalake_people.identifier_mapping.person_number
  name:
    description: Current display or preferred name
    lineage:
      - datalake_people.identifier_mapping.name
  work_email:
    description: Current work email of the employee.
    lineage:
      - datalake_people.identifier_mapping.work_email
  ts_load:
    description: Timestamp when the record was loaded into the data warehouse.
