---
database_name: dw_people
table_name: fact_employees
owner: gabriel.berger@quintoandar.com.br
domain: People
description: |
  Current employment snapshot for each active employee: headcount placement, tenure,
  hire date, and org keys (business unit, job, cost center, management hierarchy)
  as of the latest reference date in assignment_snapshots.

  Each row is one active employee on the current observation date, with surrogate
  keys and dates for employee, business unit, job, cost center, hierarchy, hire,
  reference and load timestamps, tenure in months, and inferred job country.

  How it works:
  - Source rows use is_current_for_employee and is_active on assignment_snapshots.
  - Terminated employees and month-end historical snapshots are excluded; use
    dw_employee_details.fact_assignment_snapshots for history and exits.
  - Cost center is the version effective on the reference date; job, business unit,
    and hierarchy follow the primary assignment snapshot for that date.
columns:
  sk_employee:
    description: Person identifier (Oracle HCM id_person) carried as the employee key for this fact, aligned with dim_employee.sk_employee.
    lineage:
      - datalake_people.assignment_snapshots.id_person
  sk_business_unit:
    description: Business unit identifier from the assignment snapshot for this reference date (same value as id_business_unit on the row).
    lineage:
      - datalake_people.assignment_snapshots.id_business_unit
  sk_job:
    description: Key of the employee's current job (e.g. '123456'). References dw_organization.dim_job.sk_job.
    lineage:
      - datalake_people.assignment_snapshots.id_job
  sk_cost_center_version:
    description: Surrogate key for the cost center organizational version effective on this reference date.
    lineage:
      - datalake_people.assignment_snapshots.sk_cost_center_version
  sk_manager_hierarchy:
    description: Surrogate key for the management hierarchy version effective on this reference date (same grain as the assignment snapshot).
    lineage:
      - datalake_people.assignment_snapshots.sk_hierarchy_version
  sk_employee_hired_date:
    description: Employee-cycle hire date in YYYYMMDD format for calendar-style joins (e.g. '20210510'). Consistent with dt_employee_hired on the same row.
    lineage:
      - datalake_people.assignment_snapshots.dt_employee_hired
  sk_reference_date:
    description: Latest observation date in YYYYMMDD form for this active employee snapshot (e.g. '20260728').
    lineage:
      - datalake_people.assignment_snapshots.sk_reference_date
  business_unit_country:
    description: Country inferred for the job role on this snapshot (from job naming and classification rules).
    lineage:
      - datalake_people.assignment_snapshots.business_unit_country
  months_employee_tenure:
    description: Employee's company tenure in whole months at the reference date (e.g. 12). Preserved across internal transfers and reset on a genuine rehire.
    lineage:
      - datalake_people.assignment_snapshots.months_employee_tenure
  dt_employee_hired:
    description: Date the employee was hired for their current employment cycle (e.g. 2021-05-10). Stays the same across internal transfers and resets on a genuine rehire.
    lineage:
      - datalake_people.assignment_snapshots.dt_employee_hired
  dt_reference:
    description: Reference date of the latest active snapshot (typically the current load date).
    lineage:
      - datalake_people.assignment_snapshots.dt_reference
  ts_load:
    description: Timestamp when the record was loaded.
