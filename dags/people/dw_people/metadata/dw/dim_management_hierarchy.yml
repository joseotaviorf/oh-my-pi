database_name: dw_people
table_name: dim_management_hierarchy
owner: gabriel.berger@quintoandar.com.br
domain: People
description: |
  Current reporting chain for each employee, with the direct manager and the people at each organizational layer from the CEO (L0) down to the employee (L1–L9).
  One row per person_number (current reporting chain only).
  Covers employees with a valid CEO-linked chain.
  Use person_number_manager / name_manager / email_manager for the immediate supervisor; use person_number_lN / name_lN / email_lN to slice by a fixed depth from the CEO. The direct manager may sit at any of L1–L9 depending on org depth.
columns:
  sk_manager_hierarchy:
    description: Unique key for the employee's current manager hierarchy (e.g. 'a1b2c3d4e5f6789012345678901234ab').
    lineage:
      - datalake_people.management_hierarchy.sk_hierarchy_version
  person_number:
    description: Main business identifier of the employee in PIN whose reporting chain is represented in this record (e.g. '123456').
    lineage:
      - datalake_people.management_hierarchy.person_number
  person_number_manager:
    description: Person number of the employee's direct manager (immediate supervisor) (e.g. '654321').
    lineage:
      - datalake_people.management_hierarchy.person_number_manager
  name_manager:
    description: Full name of the employee's direct manager (immediate supervisor) (e.g. 'Maria Silva').
    lineage:
      - datalake_people.management_hierarchy.name_manager
  email_manager:
    description: Work email of the employee's direct manager (immediate supervisor) (e.g. 'name.last_name@quintoandar.com.br').
    lineage:
      - datalake_people.management_hierarchy.email_manager
  person_number_l0:
    description: Person number of the person at organizational layer 0 (CEO / top of the chain) (top of every valid reporting chain) (e.g. '100000').
    lineage:
      - datalake_people.management_hierarchy.person_number_l0
  name_l0:
    description: Full name of the person at organizational layer 0 (CEO / top of the chain) (top of every valid reporting chain) (e.g. 'Example Name L0').
    lineage:
      - datalake_people.management_hierarchy.name_l0
  email_l0:
    description: Work email of the person at organizational layer 0 (CEO / top of the chain) (top of every valid reporting chain) (e.g. 'name.l0@quintoandar.com.br').
    lineage:
      - datalake_people.management_hierarchy.email_l0
  person_number_l1:
    description: Person number of the person at organizational layer 1 (L1), counted downward from the CEO at L0 (one layer below L0) (e.g. '100001'). Distinct from person_number_manager (direct manager).
    lineage:
      - datalake_people.management_hierarchy.person_number_l1
  name_l1:
    description: Full name of the person at organizational layer 1 (L1), counted downward from the CEO at L0 (one layer below L0) (e.g. 'Example Name L1'). Distinct from name_manager (direct manager).
    lineage:
      - datalake_people.management_hierarchy.name_l1
  email_l1:
    description: Work email of the person at organizational layer 1 (L1), counted downward from the CEO at L0 (one layer below L0) (e.g. 'name.l1@quintoandar.com.br'). Distinct from email_manager (direct manager).
    lineage:
      - datalake_people.management_hierarchy.email_l1
  person_number_l2:
    description: Person number of the person at organizational layer 2 (L2), counted downward from the CEO at L0 (one layer below L1) (e.g. '100002').
    lineage:
      - datalake_people.management_hierarchy.person_number_l2
  name_l2:
    description: Full name of the person at organizational layer 2 (L2), counted downward from the CEO at L0 (one layer below L1) (e.g. 'Example Name L2').
    lineage:
      - datalake_people.management_hierarchy.name_l2
  email_l2:
    description: Work email of the person at organizational layer 2 (L2), counted downward from the CEO at L0 (one layer below L1) (e.g. 'name.l2@quintoandar.com.br').
    lineage:
      - datalake_people.management_hierarchy.email_l2
  person_number_l3:
    description: Person number of the person at organizational layer 3 (L3), counted downward from the CEO at L0 (one layer below L2) (e.g. '100003').
    lineage:
      - datalake_people.management_hierarchy.person_number_l3
  name_l3:
    description: Full name of the person at organizational layer 3 (L3), counted downward from the CEO at L0 (one layer below L2) (e.g. 'Example Name L3').
    lineage:
      - datalake_people.management_hierarchy.name_l3
  email_l3:
    description: Work email of the person at organizational layer 3 (L3), counted downward from the CEO at L0 (one layer below L2) (e.g. 'name.l3@quintoandar.com.br').
    lineage:
      - datalake_people.management_hierarchy.email_l3
  person_number_l4:
    description: Person number of the person at organizational layer 4 (L4), counted downward from the CEO at L0 (one layer below L3) (e.g. '100004').
    lineage:
      - datalake_people.management_hierarchy.person_number_l4
  name_l4:
