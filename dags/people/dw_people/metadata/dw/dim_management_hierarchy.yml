database_name: dw_people
table_name: dim_management_hierarchy
owner: gabriel.berger@quintoandar.com.br
domain: People
description: |-
  Current snapshot of each employee's managerial chain. One row per employee.
  The hierarchy starts at the CEO (L0) and descends to the employee, who can appear at any level from L1 to L9 depending on the org depth.
  Columns expose the person_number, name, and email of the employee and of each manager in the chain (L0 to L9).
  Use this table to filter, group, or join on any level of the reporting structure.
  Grain: one row per person_number (SCD Type 1).
columns:
  sk_manager_hierarchy:
    description: Surrogate key for the current manager hierarchy.
    lineage:
      - datalake_people.management_hierarchy.sk_hierarchy_version
  person_number:
    description: Person number (Oracle HCM person identifier) of the employee whose current managerial chain is represented in this record.
    lineage:
      - datalake_people.management_hierarchy.person_number
  person_number_l0:
    description: Person number of the manager L0 (top-level manager / CEO in the valid chain).
    lineage:
      - datalake_people.management_hierarchy.person_number_l0
  name_l0:
    description: Full name of the manager L0 (top-level manager / CEO in the valid chain).
    lineage:
      - datalake_people.management_hierarchy.name_l0
  email_l0:
    description: Work e-mail of the manager L0 (top-level manager / CEO in the valid chain).
    lineage:
      - datalake_people.management_hierarchy.email_l0
  person_number_l1:
