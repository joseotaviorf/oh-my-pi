---
table_name: datalake_pin_goal_clean.goal_plan_to_goal
alert_channel: PEOPLE_ALERTS
table_level_validations:
  has_size:
    greater_than: 1
    severity_level: Error
column_level_validations:
  id_goal_plan_to_goal:
    is_complete:
      severity_level: Warning
    custom:
      # id_goal_plan_to_goal + object_version_number should be unique
      constraint: "(SELECT COUNT(*) FROM (SELECT 1 FROM datalake_pin_goal_clean.goal_plan_to_goal GROUP BY id_goal_plan_to_goal, object_version_number HAVING COUNT(*) > 1)) = 0"
      severity_level: Warning
