---
database_name: datalake_pin_goal_clean
table_name: goal_plan_to_goal
owner: isabella.araujo@quintoandar.com.br
domain: people
description: Stores the association between goal plans and individual goals.
columns:
  id_business_group:
    description: Foreign key referencing the business groups table.
    lineage:
      - datalake_pin_goal_raw.hrg_goal_plan_goals.business_group_id
  id_assignment:
    description: Denormalized column for assignment ID, used by OTBI VOs only and not populated.
    lineage:
      - datalake_pin_goal_raw.hrg_goal_plan_goals.assignment_id
  id_goal:
    description: Foreign key referencing the goal.
    lineage:
      - datalake_pin_goal_raw.hrg_goal_plan_goals.goal_id
  id_goal_plan_to_goal:
    description: System-generated unique identifier for this goal plan to goal association.
    lineage:
      - datalake_pin_goal_raw.hrg_goal_plan_goals.goal_plan_goal_id
  id_goal_plan:
    description: Foreign key referencing the goal plan.
    lineage:
      - datalake_pin_goal_raw.hrg_goal_plan_goals.goal_plan_id
  id_review_period:
    description: Identifier of the review period, used for filtering goals in primary goal plans.
    lineage:
      - datalake_pin_goal_raw.hrg_goal_plan_goals.review_period_id
  priority_code:
    description: Priority of the goal.
    lineage:
      - datalake_pin_goal_raw.hrg_goal_plan_goals.priority_code
    categories:
      High: Goal with high importance.
      Medium: Goal with medium importance.
      Low: Goal with low importance.
  goal_weight:
    description: Percentage representing the importance of this goal relative to others.
    lineage:
      - datalake_pin_goal_raw.hrg_goal_plan_goals.weighting
  object_version_number:
    description: Counter for optimistic locking, incremented on each update to detect concurrent modifications.
    lineage:
      - datalake_pin_goal_raw.hrg_goal_plan_goals.object_version_number
  ts_created:
    description: Timestamp of when this record was created.
    lineage:
      - datalake_pin_goal_raw.hrg_goal_plan_goals.creation_date
  ts_updated:
    description: Timestamp of when this record was last updated.
    lineage:
      - datalake_pin_goal_raw.hrg_goal_plan_goals.last_update_date
  ts_load:
    description: Timestamp indicating when the data was loaded into this table. Reflects data ingestion or reprocessing time.
    lineage:
      - datalake_pin_goal_raw.hrg_goal_plan_goals.ts_load
  year:
    description: Year extracted from the 'ts_updated' column, useful for partitioning and filtering.
    lineage:
      - datalake_pin_goal_raw.hrg_goal_plan_goals.year
  month:
    description: Month extracted from the 'ts_updated' column, useful for partitioning and filtering.
    lineage:
      - datalake_pin_goal_raw.hrg_goal_plan_goals.month
  day:
    description: Day extracted from the 'ts_updated' column, useful for partitioning and filtering.
    lineage:
      - datalake_pin_goal_raw.hrg_goal_plan_goals.day
