---
table_name: datalake_gsheets_people_clean.questionnaire_requests
alert_channel: PEOPLE_ALERTS

table_level_validations:
  has_size:
    greater_than: 1
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: -10
    less_than_or_equal_to: 25
    severity_level: Error

column_level_validations:
  survey_invite_id:
    is_complete:
      severity_level: Warning
    is_unique:
      severity_level: Warning
  survey_title:
    is_complete:
      severity_level: Warning
  requester_email:
    is_complete:
      severity_level: Warning
  invited_count:
    is_complete:
      severity_level: Warning
  answered_count:
    is_complete:
      severity_level: Warning
