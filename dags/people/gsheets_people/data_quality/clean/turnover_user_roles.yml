---
table_name: datalake_gsheets_people_clean.turnover_user_roles
alert_channel: PEOPLE_ALERTS

table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error

column_level_validations:
  email:
    is_complete:
      severity_level: Error
  special_role:
    is_complete:
      severity_level: Error
  one_row_per_email_and_special_role:
    custom:
      # Grain: one row per viewer email and manager scope (special_role).
      constraint: |-
        (SELECT COUNT(*) FROM (
          SELECT email, special_role
          FROM datalake_gsheets_people_clean.turnover_user_roles
          GROUP BY email, special_role
          HAVING COUNT(*) > 1
        )) = 0
      severity_level: Error
