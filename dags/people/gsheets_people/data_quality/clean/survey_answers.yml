---
table_name: datalake_gsheets_people_clean.survey_answers
alert_channel: PEOPLE_ALERTS

table_level_validations:
  has_size:
    greater_than: 1
    severity_level: Error
  has_size_variation:
    variation_type: percentage
    greater_than_or_equal_to: -10
    less_than_or_equal_to: 25
    severity_level: Error

column_level_validations:
  answer_id:
    is_complete:
      severity_level: Warning
    is_unique:
      severity_level: Warning
  survey_invite_id:
    is_complete:
      severity_level: Warning
  email:
    is_complete:
      severity_level: Warning
  survey_title:
    is_complete:
      severity_level: Warning
  score_team_performance:
    has_min_value:
      greater_than_or_equal_to: 1
      severity_level: Warning
    has_max_value:
      less_than_or_equal_to: 5
      severity_level: Warning
