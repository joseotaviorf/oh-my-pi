database_name: datalake_gsheets_people_clean
table_name: org_health_user_roles
owner: isabella.araujo@quintoandar.com.br
domain: People
description: Access control mapping of viewer emails to manager scopes in the Org Health analytics tool, with one row per
  viewer and manager combination. Super_admin rows grant company-wide visibility; other rows limit visibility to a manager
  subtree.
columns:
  email:
    description: Corporate email address of the employee who holds a special role in the Org Health dashboard, used to control
      data access and visibility.
    lineage:
    - datalake_gsheets_people_raw.org_health_user_roles.email
  special_role:
    description: Manager scope visible to the viewer in the Org Health dashboard, usually the manager display name. Super_admin
      grants company-wide access instead of a single manager subtree.
    lineage:
    - datalake_gsheets_people_raw.org_health_user_roles.special_role
  ts_load:
    description: Timestamp when this role assignment was ingested from the Google Sheets source into the People lake.
