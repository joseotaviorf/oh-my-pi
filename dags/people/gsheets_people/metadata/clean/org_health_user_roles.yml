database_name: datalake_gsheets_people_clean
table_name: org_health_user_roles
owner: isabella.araujo@quintoandar.com.br
domain: People
description: Access control mapping of employee emails to special dashboard roles in the Org Health analytics tool, defining
  which users have elevated permissions such as Super_admin for org-level data visibility.
columns:
  email:
    description: Corporate email address of the employee who holds a special role in the Org Health dashboard, used to control
      data access and visibility.
    lineage:
    - datalake_gsheets_people_raw.org_health_user_roles.email
  special_role:
    description: Elevated permission level granted to the user in the Org Health dashboard (e.g. Super_admin), controlling
      which organizational units and metrics are visible.
    lineage:
    - datalake_gsheets_people_raw.org_health_user_roles.special_role
  ts_load:
    description: Timestamp when this role assignment was ingested from the Google Sheets source into the People lake.
