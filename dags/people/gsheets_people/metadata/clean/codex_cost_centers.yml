database_name: datalake_gsheets_people_clean
table_name: codex_cost_centers
owner: gabriel.berger@quintoandar.com.br
domain: People
description: |-
  Table containing information regarding the cost centers, including owners and business divisions.
columns:
  cost_center_code:
    description: Unique identifier of the cost center.
    lineage:
    - datalake_gsheets_people_raw.codex_cost_centers.cc_code
  business:
    description: |-
      Business unit to which the cost center belongs.
      Empty strings and the literal placeholder '-' from the sheet are normalized to NULL.
    lineage:
    - datalake_gsheets_people_raw.codex_cost_centers.business
  product:
    description: |-
      Primary product associated with this cost center.
      Empty strings and the literal placeholder '-' from the sheet are normalized to NULL.
    lineage:
    - datalake_gsheets_people_raw.codex_cost_centers.product
  brand:
    description: |-
      Brand to which the cost center belongs.
      Empty strings and the literal placeholder '-' from the sheet are normalized to NULL.
    lineage:
    - datalake_gsheets_people_raw.codex_cost_centers.brand
  team:
    description: |-
      Team to which the cost center belongs.
      Empty strings and the literal placeholder '-' from the sheet are normalized to NULL.
    lineage:
    - datalake_gsheets_people_raw.codex_cost_centers.cc_name
  structure:
    description: |-
      Structure to which the cost center belongs.
      Empty strings and the literal placeholder '-' from the sheet are normalized to NULL.
    lineage:
    - datalake_gsheets_people_raw.codex_cost_centers.structure_name
  chapter:
    description: |-
      Chapter to which the cost center belongs.
      Empty strings and the literal placeholder '-' from the sheet are normalized to NULL.
    lineage:
    - datalake_gsheets_people_raw.codex_cost_centers.pt_chapter
  line:
    description: |-
      Line to which the cost center belongs.
      Empty strings and the literal placeholder '-' from the sheet are normalized to NULL.
    lineage:
    - datalake_gsheets_people_raw.codex_cost_centers.pt_line
  owner_l1_email:
    description: |-
      Email of the second highest manager (L1) in the hierarchy responsible for the cost center.
      Empty strings and the literal placeholder '-' from the sheet are normalized to NULL.
    lineage:
    - datalake_gsheets_people_raw.codex_cost_centers.l1_mail
  owner_l2_email:
    description: |-
      Email of the third highest manager (L2) in the hierarchy responsible for the cost center.
      Empty strings and the literal placeholder '-' from the sheet are normalized to NULL.
    lineage:
    - datalake_gsheets_people_raw.codex_cost_centers.l2_mail
  owner_l3_email:
    description: |-
      Email of the fourth highest manager (L3) in the hierarchy responsible for the cost center.
      Empty strings and the literal placeholder '-' from the sheet are normalized to NULL.
    lineage:
    - datalake_gsheets_people_raw.codex_cost_centers.l3_mail
  dt_updated:
    description: Date representing the offical monthly version of the data. Is used in the partition columns.
    lineage:
    - datalake_gsheets_people_raw.codex_cost_centers.dt_updated
  ts_load:
    description: Timestamp of when the record was loaded.
    lineage:
    - datalake_gsheets_people_raw.codex_cost_centers.ts_load
  month:
    description: Month (MM) partition column of the offical monthly version date.
    lineage:
    - datalake_gsheets_people_raw.codex_cost_centers.dt_updated
  year:
    description: Year (YYYY) partition column of the offical monthly version date.
    lineage:
    - datalake_gsheets_people_raw.codex_cost_centers.dt_updated
