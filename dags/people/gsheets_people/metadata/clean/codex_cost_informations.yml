database_name: datalake_gsheets_people_clean
table_name: codex_cost_informations
owner: gabriel.berger@quintoandar.com.br
domain: People
description: |-
  Table containing information about the type of P&L cost, further used to infer the type of headcount allocated in the cost center.
columns:
  cost_center_code:
    description: Current unique identifier of the cost center.
    lineage:
    - datalake_gsheets_people_raw.codex_cost_informations.cc_code
  cost_center_detail:
    description: Type of P&L cost, further used to infer the type of headcount allocated in the cost center, being either Capacity or Overhead.
    lineage:
    - datalake_gsheets_people_raw.codex_cost_informations.pl_line_type
  dt_updated:
    description: Date representing the offical monthly version of the data. Is used in the partition columns.
    lineage:
    - datalake_gsheets_people_raw.codex_cost_informations.dt_updated
  ts_load:
    description: Timestamp of when the record was loaded.
    lineage:
    - datalake_gsheets_people_raw.codex_cost_informations.ts_load
  month:
    description: Month (MM) partition column of the offical monthly version date.
    lineage:
    - datalake_gsheets_people_raw.codex_cost_informations.dt_updated
  year:
    description: Year (YYYY) partition column of the offical monthly version date.
    lineage:
    - datalake_gsheets_people_raw.codex_cost_informations.dt_updated
