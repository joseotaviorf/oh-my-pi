dag:
  name: qube_metric_offer_dashboard
  schedule_start_date: 2025, 1, 1
  schedule_interval: 0 7 * * *
  owner: Data Engineering
  documentation:
    dag_purpose: Builds QUBE metric table for offer.offer_dashboard with automatic
      dependency resolution
  folder_name: metrics_offer_dashboard
workflow:
  type: qube_metric
  layer: qube
  has_hive_sync: true
  custom_schema: "metrics"
  qube_specs:
    entity: offer
    name: offer_dashboard
    dimensions:
    - name: offer_status
      card: single
      type: string
    - name: offer_type
      card: single
      type: string
    measures:
    - name: offer_total
    - name: offer_accepted
    - name: offer_rejected
    counters:
      type: long
    privacy:
      k_anonymity: 1
    windows:
    - 1
    - 7
    - 28
cluster:
  type: databricks_16_4_rfleet_instance_cluster
  databricks_conn_id: databricks_new
