dag:
  name: qube_dimension_offer_type
  schedule_start_date: 2025, 1, 1
  schedule_interval: 0 5 * * *
  owner: Data Engineering
  documentation:
    dag_purpose: Builds QUBE dimension table for offer.offer_type
  folder_name: dimensions_offer_type
workflow:
  type: qube_dimension
  layer: qube
  has_hive_sync: true
  custom_schema: "dimensions"
  qube_specs:
    entity: offer
    name: offer_type
    source:
      date_expr: unix_timestamp(ts_updated, "yyyy-MM-dd'T'HH:mm:ss.SSS'Z'")
      select:
      - id_offer
      - type
      - ts_created
      - ts_updated
    logic:
      card: single
      type: string
      agg: last
      value_col: type
    order_by:
      ts_col: ts_updated
      nulls_last: true
    defaults:
      unknown_string: UNKNOWN
