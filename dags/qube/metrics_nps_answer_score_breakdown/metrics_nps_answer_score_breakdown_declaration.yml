dag:
  name: qube_metric_nps_answer_score_breakdown
  schedule_start_date: 2025, 1, 1
  schedule_interval: 0 7 * * *
  owner: Data Engineering
  documentation:
    dag_purpose: >
      NPS answer counts by score_category (promoter/passive/detractor),
      platform-wide. Building block only — NOT the "NPS FR" (For Rent
      weighted NPS True) metric from dataProduct:nps-fr. That metric needs
      per-journey weighting with quarterly CX-defined weights and a
      business_context = 'forRent' scope that isn't reproducible from a
      single QUBE source table; see measures_nps_answer_total's
      documentation for the join that would be required first. Downstream
      NPS = (promoters - detractors) / (promoters + passive + detractor) at
      query time.
  folder_name: metrics_nps_answer_score_breakdown
workflow:
  type: qube_metric
  layer: qube
  has_hive_sync: true
  custom_schema: metrics
  qube_specs:
    entity: nps_answer
    name: score_breakdown
    dimensions:
    - name: score_category
      card: single
      type: string
    measures:
    - name: total
    counters:
      type: long
    privacy:
      k_anonymity: 1
    windows:
    - 1
    - 7
    - 28
