dag:
  name: qube_metric_visit_funnel_dashboard
  schedule_start_date: 2025, 1, 1
  schedule_interval: 0 7 * * *
  owner: Data Engineering
  documentation:
    dag_purpose: Visit funnel dashboard metric — booked/completed counts by business_context
      and status
  folder_name: metrics_visit_funnel_dashboard
workflow:
  type: qube_metric
  layer: qube
  has_hive_sync: true
  custom_schema: metrics
  qube_specs:
    entity: visit
    name: visit_funnel_dashboard
    dimensions:
    - name: business_context
      card: single
      type: string
    - name: visit_status
      card: single
      type: string
    measures:
    - name: visit_booked
    - name: visit_completed
    counters:
      type: long
    privacy:
      k_anonymity: 1
    windows:
    - 1
    - 7
    - 28
