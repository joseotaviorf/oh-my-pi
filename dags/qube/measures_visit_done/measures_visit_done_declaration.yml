dag:
  name: qube_measure_visit_done
  schedule_start_date: 2025, 1, 1
  schedule_interval: 0 6 * * *
  owner: Data Engineering
  documentation:
    dag_purpose: Builds QUBE measure table for visit.visit_done
  folder_name: measures_visit_done
workflow:
  type: qube_measure
  layer: qube
  has_hive_sync: true
  custom_schema: "measures"
  qube_specs:
    entity: visit
    name: visit_done
    source:
      date_expr: unix_timestamp(dt_visit, 'yyyy-MM-dd')
    logic:
      filter_sql: status = 'Done' OR computed_status = 'DONE'
    windows:
    - 1
    - 7
    - 28
cluster:
  type: databricks_16_4_rfleet_instance_cluster
  databricks_conn_id: databricks_new
