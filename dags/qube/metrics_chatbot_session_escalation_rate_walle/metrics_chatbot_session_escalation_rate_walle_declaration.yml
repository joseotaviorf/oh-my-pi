dag:
  name: qube_metric_chatbot_session_escalation_rate_walle
  schedule_start_date: 2025, 1, 1
  schedule_interval: 0 7 * * *
  owner: Data Engineering
  documentation:
    dag_purpose: '% Escalation Rate (Wall-E) — distinct session counts by channel; rate =
      walle_session_escalated / walle_session_total at query time'
  folder_name: metrics_chatbot_session_escalation_rate_walle
workflow:
  type: qube_metric
  layer: qube
  has_hive_sync: true
  custom_schema: metrics
  qube_specs:
    entity: chatbot_session
    name: escalation_rate_walle
    dimensions:
    - name: channel
      card: single
      type: string
    measures:
    - name: walle_session_total
    - name: walle_session_escalated
    counters:
      type: long
    privacy:
      k_anonymity: 1
    windows:
    - 1
    - 7
    - 28
