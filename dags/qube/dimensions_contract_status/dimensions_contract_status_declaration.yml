dag:
  name: qube_dimension_contract_status
  schedule_start_date: 2025, 1, 1
  schedule_interval: 0 5 * * *
  owner: Data Engineering
  documentation:
    dag_purpose: Builds QUBE dimension table for contract.contract_status
  folder_name: dimensions_contract_status
workflow:
  type: qube_dimension
  layer: qube
  has_hive_sync: true
  custom_schema: "dimensions"
  qube_specs:
    entity: contract
    name: contract_status
    source:
      date_expr: unix_timestamp(ts_updated, "yyyy-MM-dd'T'HH:mm:ss.SSS'Z'")
      select:
      - id_contract
      - status
      - ts_created
      - ts_updated
    logic:
      card: single
      type: string
      agg: last
      value_col: status
    order_by:
      ts_col: ts_updated
      nulls_last: true
    defaults:
      unknown_string: UNKNOWN
cluster:
  type: databricks_16_4_rfleet_instance_cluster
  databricks_conn_id: databricks_new
