dag:
  name: qube_dimension_nps_answer_score_category
  schedule_start_date: 2025, 1, 1
  schedule_interval: 0 5 * * *
  owner: Data Engineering
  documentation:
    dag_purpose: >
      Builds QUBE dimension table for nps_answer.score_category (promoter /
      passive / detractor). Global across all NPS campaigns — NOT scoped to
      For Rent or any journey (onboarding/ongoing/offboarding); see caveat in
      the measure spec for why that scoping is not yet possible in QUBE.
  folder_name: dimensions_nps_answer_score_category
workflow:
  type: qube_dimension
  layer: qube
  has_hive_sync: true
  custom_schema: dimensions
  qube_specs:
    entity: nps_answer
    name: score_category
    source:
      table: dw_customer_satisfaction.dim_nps_answer
      layer: dw
      entity_id_col: sk_nps_answer
      date_expr: unix_timestamp(ts_answered)
      select:
      - sk_nps_answer
      - score_category
      - ts_answered
    logic:
      card: single
      type: string
      agg: last
      value_col: score_category
    order_by:
      ts_col: ts_answered
      nulls_last: true
    defaults:
      unknown_string: UNKNOWN
