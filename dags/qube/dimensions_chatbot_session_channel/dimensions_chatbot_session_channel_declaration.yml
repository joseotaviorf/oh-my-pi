dag:
  name: qube_dimension_chatbot_session_channel
  schedule_start_date: 2025, 1, 1
  schedule_interval: 0 5 * * *
  owner: Data Engineering
  documentation:
    dag_purpose: Builds QUBE dimension table for chatbot_session.channel (WhatsApp / in-app)
  folder_name: dimensions_chatbot_session_channel
workflow:
  type: qube_dimension
  layer: qube
  has_hive_sync: true
  custom_schema: dimensions
  qube_specs:
    entity: chatbot_session
    name: channel
    source:
      # Forno EMR smoke: datalake_chatbot.sessions (enrich) is stale on Forno —
      # merge_on: [id_session] never backfilled channel/ts_created after they
      # were added to sessions.sql, so the read fails column validation. Pivot
      # to the clean-layer message table (mirrors the visit funnel pilot's
      # datalake_ebdb_clean pivot). Caveat: entity_id_col here is the Copilot
      # id_session, NOT the unified id_sauron_session the measures/metric use
      # — dimension-only smoke pivot, not yet grain-consistent for a real join.
      # value_col channel is also the raw enum (WHATSAPP_SUPPORT_CHAT, ...),
      # not the enrich-derived whatsapp/in app label.
      table: datalake_copilot_service_clean.message
      layer: clean
      universe_table: datalake_copilot_service_clean.message
      entity_id_col: id_session
      date_expr: unix_timestamp(ts_created)
      select:
      - id_session
      - channel
      - ts_created
    logic:
      card: single
      type: string
      agg: last
      value_col: channel
    order_by:
      ts_col: ts_created
      nulls_last: true
    defaults:
      unknown_string: UNKNOWN
