dag:
  name: qube_metric_visit_dashboard
  schedule_start_date: 2025, 1, 1
  schedule_interval: 0 7 * * *
  owner: Data Engineering
  documentation:
    dag_purpose: Builds QUBE metric table for visit.visit_dashboard with automatic
      dependency resolution
  folder_name: metrics_visit_dashboard
workflow:
  type: qube_metric
  layer: qube
  has_hive_sync: true
  custom_schema: "metrics"
  qube_specs:
    entity: visit
    name: visit_dashboard
    dimensions:
    - name: visit_status
      card: single
      type: string
    - name: visit_business_context
      card: single
      type: string
    measures:
    - name: visit_total
    - name: visit_scheduled
    - name: visit_done
    counters:
      type: long
    privacy:
      k_anonymity: 1
    windows:
    - 1
    - 7
    - 28
