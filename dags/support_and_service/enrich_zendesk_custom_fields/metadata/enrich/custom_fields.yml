database_name: datalake_zendesk_custom_fields
table_name: custom_fields
description: The Zendesk ticket's custom field information
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  id_ticket:
    lineage:
      - datalake_zendesk_tickets_clean.tickets.id_ticket
    description: This unique identifier for Zendesk Tickets
  custom_fields:
    lineage:
      - datalake_zendesk_tickets_clean.ticket_fields.raw_title
      - datalake_zendesk_tickets_clean.tickets.custom_fields
    description: The custom fields of the ticket that correspond to the Zendesk Forms
      fields. It has JSON format with the form's field name and its value selected
      or inputted by agent. The value equal to false is related to the field that
      was not filled for the request