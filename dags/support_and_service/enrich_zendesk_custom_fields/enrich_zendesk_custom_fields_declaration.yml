dag:
    name: enrich_zendesk_custom_fields
    schedule_start_date: 2020, 8, 29
    owner: Data SS
    documentation: 
        dag_purpose: |
            This is the first layer of the enrichment phase of the Zendesk data preparation. The `custom_fields` column is a key-value data structure,
            the keys are IDs and the value can be many different things as _client type_, IDs of other systems and etc.. Zendesk is responsible for the
            tickets of the customer services.
workflow:
    type: query
    layer: enrich
cluster:
    type: custom_cluster
    custom_configurations: 
        driver_node_type_id: r5d.12xlarge
        node_type_id: r5d.12xlarge
        runtime_engine: PHOTON
        num_workers: 6
        aws_attributes:
            ebs_volume_size: 500
            availability: ON_DEMAND
