      - datalake_gsheets_clean.kong_ss_endpoints.description
    description: S&S endpoints description.
  entity:
    lineage:
      - datalake_kong_clean.kong_logs.message
    description: The endpoint entity.
  entity_code:
    lineage:
      - datalake_kong_clean.kong_logs.message
    description: The endpoint entity code.
  env:
    lineage:
      - datalake_kong_clean.kong_logs.env
    description: The log environment.
  host:
    lineage:
      - datalake_kong_clean.kong_logs.message
    description: The host address.
  ip_address:
    lineage:
      - datalake_kong_clean.kong_logs.message
    description: The log's respective ip_address.
  message:
    lineage:
      - datalake_kong_clean.kong_logs.message
