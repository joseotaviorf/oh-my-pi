dag:
  name: enrich_kong_ss
  schedule_start_date: 2023, 4, 12
  owner: Data SS
  documentation:
    dag_purpose: |
      This DAG main responsibility is to provide all the S&S logs data,
      not considering warn and notice messages, extracting specific information
      such as endpoint, and status code. It can be used for various purposes in the
      context of the system or application it is designed for.

workflow:
  type: query_delta
  layer: enrich
  default_extraction_type: incremental
  default_partitions: ["year", "month", "day", "hour"]

cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: r5d.2xlarge
    node_type_id: r5d.4xlarge
    spark_version: 13.3.x-scala2.12
    num_workers: 5
    spark_conf:
      spark.sql.mapKeyDedupPolicy: "LAST_WIN"
