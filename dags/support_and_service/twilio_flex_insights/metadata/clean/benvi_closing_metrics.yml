---
database_name: datalake_twilio_flex_insights_clean
table_name: benvi_closing_metrics
description: "This table has data from the Benvi's Closing Metrics dashboard.
  This Twilio's dashboard is related to Closing agents conversation metrics.
  This table is incrementally loaded and is partitioned by year, month and day."
domain: International
owner: guilherme.dorella@quintoandar.com.br
columns:
  handling_team:
    lineage:
      - datalake_twilio_flex_insights_raw.benvi_closing_metrics.handling_team
    description: "Handling team responsible for the calls."
  communication_channel:
    lineage:
      - datalake_twilio_flex_insights_raw.benvi_closing_metrics.communication_channel
    description: "Which is the communication channel (call, chat, etc.)."
  agent_name:
    lineage:
      - datalake_twilio_flex_insights_raw.benvi_closing_metrics.agent
    description: "The name of the Closing agent responsible for the calls/chats."
  all_calls:
    lineage:
      - datalake_twilio_flex_insights_raw.benvi_closing_metrics.all_calls
    description: "Number of all calls related to the agent."
  answered_outbound_calls:
    lineage:
      - datalake_twilio_flex_insights_raw.benvi_closing_metrics.answered_outbound_calls
    description: "Number of outbound calls answered by the agent."
  abandoned_conversations:
    lineage:
      - datalake_twilio_flex_insights_raw.benvi_closing_metrics.abandoned_conversations
    description: "Number of abandoned conversations related to the agent."
  total_handling_time:
    lineage:
      - datalake_twilio_flex_insights_raw.benvi_closing_metrics.total_handling_time
    description: "The total conversation handling time related to the agent."
  dt_created:
    lineage:
      - datalake_twilio_flex_insights_raw.benvi_closing_metrics.date
    description: "Creation date of the information."
  year:
    lineage:
      - datalake_twilio_flex_insights_raw.benvi_closing_metrics.year
    description: "Year related to the creation date of the information. Also, a partition of this table."
  month:
    lineage:
      - datalake_twilio_flex_insights_raw.benvi_closing_metrics.month
    description: "Month related to the creation date of the information. Also, a partition of this table."
  day:
    lineage:
      - datalake_twilio_flex_insights_raw.benvi_closing_metrics.day
    description: "Day related to the creation date of the information. Also, a partition of this table."
