database_name: datalake_repairs
table_name: repair_tickets
description:
  Enrichment table that aims to consolidate information from the repair
  service flow. Each line in this table represents a service ticket for this flow.
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  id_ticket:
    description: Unique identification key for the service ticket.
    lineage:
      - datalake_zendesk.tickets_current.id_ticket
  id_request:
    description: Repair request identification key.
    lineage:
      - datalake_repairs_clean.repair_request.id
  id_contract:
    description: Identification key of the contract related to the service.
    lineage:
      - datalake_zendesk.tickets_current.id_contract
  group_name:
    description: Discursive data that indicates the department to which the service ticket is linked.
    lineage:
      - datalake_zendesk.tickets_current.group_name
  client_type:
    description: Type of customer who requested service.
    lineage:
      - datalake_zendesk.tickets_current.client_type
  status:
    description: Descriptive data that indicates the stage in which the service is at.
    lineage:
      - datalake_zendesk.tickets_current.status
  custom_fields:
    description: Given in json format that brings together additional information for the service.
    lineage:
      - datalake_zendesk.tickets_current.custom_fields
  tags:
    description: Descriptive data that indicates the process tags used during the service.
    lineage:
      - datalake_zendesk.tickets_current.tags
  ticket_via:
    description: Descriptive data that indicates which platform the ticket was brought through.
    lineage:
      - datalake_zendesk.tickets_current.ticket_via
  channel:
    description: Descriptive data that indicates which service channel was used.
    lineage:
      - datalake_zendesk.tickets_current.channel
  agent_name:
    description: Descriptive data that indicates the analyst's name linked to the ticket.
    lineage:
      - datalake_zendesk.tickets_current.analyst_name
  agent_email:
    description: Descriptive data that indicates the analyst's email linked to the ticket.
    lineage:
      - datalake_zendesk.tickets_current.analyst_email
  agent_organization:
    description: Descriptive data that indicates the company in which the analyst linked to the ticket works.
    lineage:
      - datalake_zendesk.tickets_current.analyst_organization
  contestation_task_origin:
    description: Descriptive data that indicates where the contestation request came from.
    lineage:
      - datalake_zendesk_tickets.ticket_history.contestation_task_origin
  service_provider:
    description: Data in json format that indicates which company was the provider and the date on which the information was made available.
    lineage:
      - datalake_repairs_clean.repair_request.service_provider
  theme:
    description: Descriptive data that indicates a tag related to taxonomies.
    lineage:
      - datalake_customer_support.chat.contact_theme_tag
      - datalake_customer_support.call.contact_theme_tag
      - datalake_customer_support.email.contact_theme_tag
  theme_detail:
    description: Descriptive data that indicates the detail of a tag related to taxonomies.
    lineage:
      - datalake_customer_support.chat.contact_theme_detail_tag
      - datalake_customer_support.call.contact_theme_detail_tag
      - datalake_customer_support.email.contact_theme_detail_tag
  request_type:
    description: Descriptive information indicating the repair responsibility tag.
    lineage:
      - datalake_customer_support.chat.request_type
      - datalake_customer_support.call.request_type
      - datalake_customer_support.email.request_type
  customer_type_tag:
    description: Type of user identified in the tags.
    lineage:
      - datalake_customer_support.chat.customer_type_tag
      - datalake_customer_support.call.customer_type_tag
      - datalake_customer_support.email.customer_type_tag
  motivation:
    description: More taxonomy information to identify motivation.
    lineage:
      - datalake_customer_support.chat.contact_motivation_tag
      - datalake_customer_support.call.contact_motivation_tag
      - datalake_customer_support.email.contact_motivation_tag
  front_or_back:
    description: Descriptive information that indicates whether the ticket is a back or front ticket.
    lineage:
      - datalake_customer_support.chat.front_or_back
      - datalake_customer_support.call.front_or_back
      - datalake_customer_support.email.front_or_back
  comment_csat:
    description: Descriptive information that contains the customer's comment on the satisfaction survey.
    lineage:
      - datalake_survicate.repairs_surveys.respondent_comments
  csat_tags:
    description: Descriptive information that indicates which tags were added to the service.
    lineage:
      - datalake_survicate.repairs_surveys.improvement_tags
  csat_score:
    description: Notation that the customer gave to the customer service.
    lineage:
      - datalake_survicate.repairs_surveys.satisfaction_score
  csat_partes:
    description: Secondary Notation that the customer gave to the service.
    lineage:
      - datalake_survicate.repairs_surveys.secondary_satisfaction_score
  is_closed_by_merge:
    description: Boolean type information that indicates whether the ticket was closed with a merge from another service.
    lineage:
      - datalake_zendesk_tickets.ticket_history.is_closed_by_merge
  is_contestation_backlog:
    description: Boolean information that indicates whether the contestation ticket is still in the backlog for the analyst to act on.
    lineage:
      - datalake_zendesk_tickets.ticket_history.is_contestation_backlog
  is_ticket_followup:
    description: Boolean type information that indicates whether the ticket is a follow-up ticket.
    lineage:
      - datalake_zendesk_tickets.ticket_history.is_ticket_followup
  has_chat_negociation:
    description: Boolean data that indicates whether the repair was negotiated via chat.
  reopens:
    description: Integer type data that indicates the number of times the ticket was reopened.
    lineage:
      - datalake_zendesk.tickets_current.reopens
  replies:
    description: Integer type data that indicates the number of times the ticket was replied.
    lineage:
      - datalake_zendesk.tickets_current.replies
  relisting:
    description: Integer type data that indicates the number of times the listing was updated.
  minutes_first_reply_time_calendar:
    description: Integer type data that indicates the time in minutes until the first service response.
    lineage:
      - datalake_zendesk.tickets_current.reply_time_min_calendar
  entrance_date:
    description: Date on which the contract came into effect.
    lineage:
      - datalake_ebdb_contract.contract.dt_entered
  ts_contestation:
    description: Information such as date that indicates when the contestation was requested.
    lineage:
      - datalake_zendesk_tickets.ticket_history.ts_contestation
  ts_resolution_contestation:
    description: Boolean type data that indicates when the contestation demand was resolved.
    lineage:
      - datalake_zendesk_tickets.ticket_history.ts_resolution_contestation
  ts_first_interaction:
    description: Date in timestamp format of the first iteration of the repair request.
  ts_created_local:
    description: Date in timestamp format that indicates when the ticket was created.
    lineage:
      - datalake_zendesk.tickets_current.ts_created
  ts_updated_local:
    description: Date in timestamp format that indicates when the ticket was updated.
    lineage:
      - datalake_zendesk.tickets_current.ts_updated
  ts_closed_local:
    description: Date in timestamp format that indicates when the ticket was closed.
    lineage:
      - datalake_zendesk.tickets_current.ts_updated
  ts_solved_local:
    description: Date in timestamp format that indicates when the ticket was solved.
    lineage:
      - datalake_zendesk.tickets_current.ts_solved
  ts_request_created:
    description: Date in timestamp format that indicates when the repair request was created.
    lineage:
      - datalake_repairs_clean.repair_request.ts_created
  ts_csat_response_submitted:
    description: Date in timestamp format that indicates when the satisfaction survey was completed.
    lineage:
      - datalake_survicate.repairs_surveys.ts_submitted
  ts_initially_assigned_local:
    description: Date in timestamp format that indicates when the first analyst to answer the ticket signed it.
    lineage:
      - datalake_zendesk.tickets_current.ts_initially_assigned
  ts_last_assigned_local:
    description: Date in timestamp format that indicates when the last analyst to answer the ticket signed it.
    lineage:
      - datalake_zendesk.tickets_current.ts_assigned
  year:
    description: Partition data, referring to the year of the ticket update date.
    lineage:
      - datalake_zendesk.tickets_current.ts_updated
  month:
    description: Partition data, referring to the month of the ticket update date.
    lineage:
      - datalake_zendesk.tickets_current.ts_updated
  day:
    description: Partition data, referring to the day of the ticket update date.
    lineage:
      - datalake_zendesk.tickets_current.ts_updated
