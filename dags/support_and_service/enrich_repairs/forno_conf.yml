---
dag_documentation:
  dag_purpose: Enrichment of the Ongoing de Repairs flow data, for the construction of indicators.

inner_dependencies:
  repair_ongoing:
    - repair_custom_fields
    - repair_request_item
    - repair_tickets

incremental_tables:
  - repair_custom_fields
  - repair_ongoing
  - repair_tickets

custom_cluster:
  driver_node_type_id: r5d.2xlarge
  node_type_id: r5d.2xlarge
  runtime_engine: PHOTON
  autoscale:
    max_workers: 3
    min_workers: 1
  spark_conf:
    spark.sql.mapKeyDedupPolicy: "LAST_WIN"

partitions_cols: [year, month, day]
