dag:
    name: enrich_repairs
    schedule_start_date: 2023, 11, 24
    owner: Data SS
    documentation:
      dag_purpose:
        This dag aims to execute the bases related to the repair flow.
workflow:
  type: query
  layer: enrich
  tables_customization:
    repair_tickets:
      partition_cols: ["year", "month", "day"]
      extraction_type: full
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: m5a.xlarge
    node_type_id: m5a.xlarge
    num_workers: 2