dag:
  name: enrich_repairs
  schedule_start_date: 2023, 11, 24
  owner: Data SS
  documentation:
    dag_purpose: This dag aims to execute the bases related to the repair flow.
workflow:
  type: query_delta
  layer: enrich
  tables_customization:
    repair_tickets:
      partition_cols: ["year", "month", "day"]
      extraction_type: full
      z_order_by: [
        id_ticket,
        id_request,
        id_contract]
      merge_on: [id_ticket]
cluster:
  type: custom_cluster
  custom_configurations:
    spark_version: 13.3.x-scala2.12
    driver_node_type_id: r6gd.4xlarge
    node_type_id: r6gd.4xlarge
    num_workers: 4
