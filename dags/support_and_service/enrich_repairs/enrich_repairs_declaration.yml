dag:
  name: enrich_repairs
  schedule_start_date: 2023, 11, 24
  owner: Data SS
  documentation:
    dag_purpose: This dag aims to execute the bases related to the repair ongoing flow.
workflow:
  type: query_delta
  layer: enrich
  default_extraction_type: full
  tables_customization:
    repair_tickets:
      z_order_by:
        [
          id_ticket,
          id_request,
          id_contract
        ]
      merge_on: [id_ticket]
    ongoing_repair_tickets:
      z_order_by:
        [
          year,
          month,
          day,
          id_ticket,
          id_request,
          id_contract
        ]
      merge_on: [id_ticket]
cluster:
  type: custom_cluster
  custom_configurations:
    spark_version: 13.3.x-scala2.12
    driver_node_type_id: r6gd.4xlarge
    node_type_id: r6gd.4xlarge
    num_workers: 3
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
  databricks_conn_id: databricks_new
