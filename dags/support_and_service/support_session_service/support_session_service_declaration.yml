dag:
  name: support_session_service
  schedule_start_date: 2025, 7, 29
  schedule_interval: 0 3 * * *
  owner: Data SS
  documentation:
    dag_purpose: |
      Retrieves data from the Support Session Service database (PostgreSQL).

      [Support Session Service](https://github.com/quintoandar/support-session-service) is a service that provides
      support sessions data.

workflow:
  type: cdc
  layer: raw
  database_type: postgres
  source_schema: public
  source_database: support_session_service
  custom_schema: support_session_service
  dbutils_secret_key: SUPPORT_SESSION_SERVICE_DB
  tables_customization:
    support_session:
      raw_z_order_by: [updated_at]
      clean_z_order_by: [ts_updated]

cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: m5a.xlarge
    node_type_id: m5a.xlarge
    num_workers: 3
    spark_version: 16.4.x-scala2.12
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
  databricks_conn_id: databricks_new
