dag:
  name: support_session_service
  schedule_start_date: 2025, 7, 29
  schedule_interval: 0 * * * *
  owner: Data SS
  documentation:
    dag_purpose: |
      Retrieves data from the Support Session Service database (PostgreSQL).

      [Support Session Service](https://github.com/quintoandar/support-session-service) is a service that provides
      support sessions data.

workflow:
  type: cdc
  layer: raw
  database_type: postgres
  source_schema: public
  source_database: support_session_service
  custom_schema: support_session_service
  dbutils_secret_key: SUPPORT_SESSION_SERVICE_DB
  tables_customization:
    support_session:
      raw_z_order_by: [updated_at]
      clean_z_order_by: [ts_updated]
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
