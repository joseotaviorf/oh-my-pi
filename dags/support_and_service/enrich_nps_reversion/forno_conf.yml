---
dag_documentation:
    dag_purpose: |
        Enrich NPS Reversion DAG runs two spark jobs that use a Scikit-learn model to predict the probability of a tenant or a landlord being detractor in the NPS survey of Offboarding step.
        This DAG also saves the input data used for predictions in two tables named `offboarding_tenant_input` and `offboarding_landlord_input`.
        Besides that, this DAG save a log table named `offboarding_tenant_input` that allow users to understand the aggregations os sk_user's considered for each sk_contract in the model.
        The models are stored in Databricks File System, in the paths:

        ```
        /dbfs/FileStore/models/nps_reversion/offboarding/tenant
        /dbfs/FileStore/models/nps_reversion/offboarding/landlord
        ```

        You can find more information about the development proccess [here](https://github.com/quintoandar/support-and-service/tree/main/ml-models/nps-reversion).
    additional_information: |
        The resulting table of this enrich DAG is different than other enrich DAGs as it's not a direct result of a query execution, but a result of a Scikit-learn model applied on a query result set.

input_partitions: ["dt_termination_request"]

offboarding_tenant_input_table_name: offboarding_tenant_input
offboarding_tenant_output_table_name: offboarding_tenant_predictions
offboarding_tenant_model_filename: /dbfs/FileStore/models/nps_reversion/offboarding/tenant/nps_reversion_off_tenant_reglog_v0.pkl
offboarding_tenant_input_columns:
    [
        "iq_first_contract",
        "total_tickets_especiais",
        "csat_disatisfied_jornada",
        "reason_MOVING_OWN_HOUSE",
        "reason_NEEDS_CHANGE",
        "contract_lifetime",
        "reason_DISLIKES_QUINTOANDAR",
        "reason_PROBLEMS_WITH_HOUSE",
        "csat_satisfied_jornada",
        "reason_MOVING_TO_FRIENDS_OR_FAMILY",
        "back_tickets_not_sla_jornada",
        "type_of_termination_fine_WITHOUT_NOTICE",
        "last_nps_promotor",
        "house_bedrooms",
        "house_type_Casa",
        "reason_OTHER",
        "iq_nps_detrator_jornada",
        "complaint_tickets_jornada",
        "iq_nps_promotor_jornada",
        "front_tickets_jornada",
        "reason_JOB_TRANSFER",
    ]

offboarding_landlord_input_table_name: offboarding_landlord_input
offboarding_landlord_output_table_name: offboarding_landlord_predictions
offboarding_landlord_model_filename: /dbfs/FileStore/models/nps_reversion/offboarding/landlord/nps_reversion_off_landlord_rf_v0.pkl
offboarding_landlord_input_columns:
    [
        "has_one_year_fine",
        "utility_bill_in_condominium",
        "contract_lifetime",
        "has_24hdoorman",
        "house_total_value_per_m2",
        "is_house_furnished",
        "has_tenant_comment_inpection",
        "has_ongoing_repairs",
        "first_contract",
        "actual_contracts",
        "total_contracts",
        "back_tickets_jornada",
        "complaint_tickets_jornada",
        "total_tickets_especiais",
        "csat_disatisfied_jornada",
        "csat_satisfied_jornada",
        "total_segments_not_sla",
        "total_segments",
        "avg_minutes_talk_time",
        "avg_minutes_waiting_time",
        "resolution_survey_jornada",
        "avg_assignee_stations",
        "total_nps_promotor",
        "total_nps_detractor",
        "prob_answer_nps",
        "last_nps_detractor",
        "is_apartment",
        "perfect_state_condition",
    ]

offboarding_input_query: SELECT * FROM datalake_nps_reversion.{table_name} WHERE dt_termination_request = CAST('{execution_date}' AS DATE)
model_output_column: "model_output"
model_predicted_date_column: "dt_predicted"
output_partitions: ["dt_predicted"]
custom_libraries: [{ pypi: { "package": "scikit-learn>=1.1.1" } }]
offboarding_output_columns:
    [
        "id_termination",
        "id_contract",
        "id_house",
        "model_name",
        "model_version",
        "model_output",
        "dt_termination_request",
        "dt_predicted",
    ]
