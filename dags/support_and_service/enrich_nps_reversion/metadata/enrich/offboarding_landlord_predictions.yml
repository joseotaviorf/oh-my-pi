database_name: datalake_nps_reversion
table_name: offboarding_landlord_predictions
description: Table that concentrates the output information of the NPS prediction model, 
  this table includes the view by owners.
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  id_termination:
    description: Primary termination identification key.
  id_contract:
    description: Contract identification key.
  id_house:
    description: House identification key.
  model_name:
    description: Name of the prediction model used.
  model_version:
    description: Version of the prediction model used.
  model_output:
    description: Results of the owner offborading review, generated by the model.
  dt_termination_request:
    description: Offborading request date.
  dt_predicted:
    description: Date the prediction was made.
  