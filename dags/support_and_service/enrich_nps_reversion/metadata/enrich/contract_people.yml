database_name: datalake_nps_reversion
table_name: contract_people
description: Enrichment table that consolidates tenant and landlord 
  contract information, the granularity is the contract.
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  sk_contract:
    lineage:
      - dw_quintoandar.fact_contract_people.sk_contract
    description: Contract identifier, may be related to the tenant or the owner.
  sk_user:
    description: User identification key, can be either the tenant or the owner.
  model_name:
    description: Funnel stage
  model_version:
    description: Version of the funnel stage descriptive data.
  ts_tickets_search_range_max:
    description: Maximum ticket search interval
  ts_tickets_search_range_min:
    description: Minimum ticket search interval
  dt_termination_request:
    description: Request completion date.
