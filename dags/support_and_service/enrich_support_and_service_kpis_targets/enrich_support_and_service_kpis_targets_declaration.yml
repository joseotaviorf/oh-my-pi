dag:
  name: enrich_support_and_service_kpis_targets
  schedule_start_date: 2022, 1, 16
  owner: Data SS
  documentation:
    dag_purpose: Transform the KPIs target gsheets to a readable and mergeable format to insert on LookML.
workflow:
  type: query_delta
  layer: enrich
  tables_customization:
    kpis_target:
      extraction_type: full
cluster:
  type: databricks_13_3_med_general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
