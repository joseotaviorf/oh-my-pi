dag:
  name: enrich_inspections_metrics
  schedule_start_date: 2022, 1, 19
  owner: Data SS
  documentation:
    dag_purpose: "This DAG is responsible for generating indicators and metrics for QuintoAndar's inspection services"
workflow:
  type: query_delta
  layer: enrich
  tables_customization:
    inspection_achievements: {}
    inspector_performance:
      partitions: [year, month, day]
      extraction_type: incremental
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: c5a.4xlarge
    node_type_id: c5a.2xlarge
    num_workers: 3
    spark_version: 12.2.x-scala2.12
