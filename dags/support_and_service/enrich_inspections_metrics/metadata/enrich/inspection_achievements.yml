---
database_name: datalake_inspections_metrics
table_name: inspection_achievements
description: This table is responsible for calculating the achievement of targets for carrying out the inspection.
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  id_inspection:
    description:
      Unique id to identify a inspection. If its origin is the Inspection Service
      (IS), the ID will correspond to the ID generated in the product. If the inspection
      source is still the PWA, the ID will correspond to the ID generated by the MD5 function.
    lineage:
      - datalake_inspections.inspection_booking.id_inspection
  id_city:
    description: Unique identifier of city.
    lineage:
      - datalake_inspections.inspection_booking.id_city
  city_name:
    description: Name of the city where the property is located.
    lineage:
      - datalake_inspections.inspection_booking.city_name
  inspection_type:
    description: The type of inspection.
    categories:
      onboarding: Inspection carried out before the tenant enters the property, to certify the conditions of the house.
      verification: Inspection carried out when there is any relevant change in the property, such as the creation of rooms, for example.
      offboarding: Inspection carried out after the tenant leaves the property, to certify the conditions of the house.
    lineage:
      - datalake_inspections.inspection_booking.inspection_type
  status:
    description: Identifies the stage of the inspection from scheduling to review.
    categories:
      scheduled: When the inspection is waiting to be executed.
      received: When the inspection is received by the backend and is waiting for processing.
      sent_to_analysis: When the offboarding inspection is forwarded to the Analysis 1 stream.
      sent_to_review: When the offboarding inspection is sent for owner review.
      review_started: When the offboarding inspection receives some intervention made by the owner.
      reviewed: When the review is completed.
    lineage:
      - datalake_inspections.inspection_booking.status
  sla_execution_target:
    description:
      Inspection execution target. Indicates the maximum interval of days before or after a
      pre-defined period, in which the inspection must take place.
    lineage:
      - datalake_support_and_service_kpis_targets.kpis_targets.target
  ldt_hours_execution:
    description: Lead time from the beginning to the end of the inspection, that is, the assessment execution interval.
  is_sla_execution:
    description: Indicates whether the inspection occurred within the day range predefined by the execution target.
  dt_execution_limit:
    description: Deadline for carrying out the inspection within the expected SLA.
    lineage:
      - datalake_inspections.inspection_booking.dt_execution_limit
  ts_execution_started:
    description: This column should display the time when the inspector started to perform the inspection. (column with unreliable data)
    lineage:
      - datalake_inspections.inspection_booking.ts_started
  ts_execution_finished:
    description: This column should display the time when the inspector finished carrying out the inspection. (column with unreliable data)
    lineage:
      - datalake_inspections.inspection_booking.ts_finished
  ts_created:
    description: Timestamp of when the inspection request was synchronized in the database product.
    lineage:
      - datalake_inspections.inspection_booking.ts_created
  ts_updated:
    description: Timestamp of when the inspection request was updated in the database product.
    lineage:
      - datalake_inspections.inspection_booking.ts_updated
