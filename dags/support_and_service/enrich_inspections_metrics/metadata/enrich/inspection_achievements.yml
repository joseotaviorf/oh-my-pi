---
database_name: datalake_inspections_metrics
table_name: inspection_achievements
description: This table is responsible for calculating the achievement of targets for carrying out the inspection.
domain: Support and Services
owner: data-ae-ss@quintoandar.com.br
columns:
  id_inspection:
    description:
      Unique id to identify a inspection. If its origin is the Inspection Service
      (IS), the ID will correspond to the ID generated in the product. If the inspection
      source is still the PWA, the ID will correspond to the ID generated by the MD5 function.
    lineage:
      - datalake_inspections.inspection_booking.id_inspection
  id_assessment:
    description: Unique identifier of an Assessment.
      This identifier must be unique per inspection, however, for dates prior to August 19, 2023, there is residual data in a product bug.
      This bug erroneously created more than one Assessment per survey. Therefore, for these cases, the id_inspection will not be unique.
      It is observed that the extra Assessments are identical, with no data distinction between them.
    lineage:
      - datalake_inspections.inspection_booking.id_assessment
  id_external:
    description: Inspection correlational unique identifier in the PWA database.
    lineage:
      - datalake_inspections.inspection_booking.id_external
  id_city:
    description: Unique identifier of city.
    lineage:
      - datalake_inspections.inspection_booking.id_city
  city_name:
    description: Name of the city where the property is located.
    lineage:
      - datalake_inspections.inspection_booking.city_name
  inspection_type:
    description: The type of inspection.
    categories:
      onboarding: Inspection carried out before the tenant enters the property, to certify the conditions of the house.
      verification: Inspection carried out when there is any relevant change in the property, such as the creation of rooms, for example.
      offboarding: Inspection carried out after the tenant leaves the property, to certify the conditions of the house.
    lineage:
      - datalake_inspections.inspection_booking.inspection_type
  status:
    description: Identifies the stage of the inspection from scheduling to review.
    categories:
      scheduled: Inspection scheduled and awaiting execution
      received: Inspection sent by the inspector, waiting for synchronization with the Main
      sent_to_analysis: Inspection available for operations team interventions
      sent_to_owner_review: Review available for owner review
      review_started_by_owner: Survey whose owner has already done some intervention
      sent_to_tenant_review: Survey available for tenant review
      review_started_by_tenant: Survey whose tenant has already done some intervention
      reviewed: Survey sent to the Operations team to validate interventions proposed by owner/tenant
      EmAcordo: "Discontinued status, coming from the PWA data, so it's not part of the Inspection Service data flow, it's just historical data"
      ContratoCancelado: "Discontinued status, coming from the PWA data, so it's not part of the Inspection Service data flow, it's just historical data"
      Nova: "Discontinued status, coming from the PWA data, so it's not part of the Inspection Service data flow, it's just historical data"
      Finalizada: "Discontinued status, coming from the PWA data, so it's not part of the Inspection Service data flow, it's just historical data"
      Comentada: "Discontinued status, coming from the PWA data, so it's not part of the Inspection Service data flow, it's just historical data"
    lineage:
      - datalake_inspections.inspection_booking.status
  sla_execution_target:
    description:
      Inspection execution target. Indicates the maximum interval of days before or after a
      pre-defined period, in which the inspection must take place.
    lineage:
      - datalake_support_and_service_kpis_targets.kpis_targets.target
  ldt_hours_execution:
    description: Lead time from the beginning to the end of the inspection, that is, the assessment execution interval.
  is_sla_execution:
    description: Indicates whether the inspection occurred within the day range predefined by the execution target.
  dt_execution_limit:
    description: Deadline for carrying out the inspection within the expected SLA.
    lineage:
      - datalake_inspections.inspection_booking.dt_execution_limit
  ts_execution_started_local_tz:
    description: This column should display the time when the inspector started to perform the inspection. (column with unreliable data)
    lineage:
      - datalake_inspections.inspection_booking.ts_execution_started_local_tz
  ts_execution_finished_local_tz:
    description: This column should display the time when the inspector finished carrying out the inspection. (column with unreliable data)
    lineage:
      - datalake_inspections.inspection_booking.ts_execution_finished_local_tz
  ts_inspected:
    description: Date and time the inspection was performed.
    lineage:
      - datalake_inspections.inspection_booking.ts_inspected
  ts_created:
    description: Timestamp of when the inspection request was synchronized in the database product.
    lineage:
      - datalake_inspections.inspection_booking.ts_created
  ts_updated:
    description: Timestamp of when the inspection request was updated in the database product.
    lineage:
      - datalake_inspections.inspection_booking.ts_updated
