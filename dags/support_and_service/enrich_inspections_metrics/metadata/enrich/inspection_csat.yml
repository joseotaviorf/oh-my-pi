---
database_name: datalake_inspections_metrics
table_name: inspection_csat
description:
  This table brings the relationship between the inspection carried out and the satisfaction
  response of the tenant and the owner. The granularity of the table is the id_answer column,
  and the data can be crossed with the dw_satisfaction_rating modeling, in order to obtain the
  complete response data.
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  id_answer:
    description: Unique identifier of the satisfaction response.
    lineage:
      - datalake_satisfaction_rating.satisfaction_answer.id_answer
  id_inspection:
    description:
      Unique id to identify a inspection. If its origin is the Inspection Service
      (IS), the sk will correspond to the id generated in the product. If the inspection
      source is still the PWA, the sk will correspond to the id generated in the enrich_inspection
      by the MD5 function.
    lineage:
      - datalake_inspections.inspection_booking.id_inspection
  id_contract:
    description: Unique identifier of the contract.
    lineage:
      - datalake_satisfaction_rating.satisfaction_answer.id_contract
  year:
    description: Year referring to the data loading day.
    lineage:
      - datalake_satisfaction_rating.satisfaction_answer.year
  month:
    description: Month referring to the data loading day.
    lineage:
      - datalake_satisfaction_rating.satisfaction_answer.month
  day:
    description: Day referring to the data loading day.
    lineage:
      - datalake_satisfaction_rating.satisfaction_answer.day
