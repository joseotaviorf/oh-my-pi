---
database_name: dw_crm_recommendations
table_name: crm_recommendation_sale_users
description: >
  Daily snapshot of sale-context users eligible for the Salesforce CRM listing-recommendation
  campaign. Grain is one row per user currently in the audience: users with more than two sale
  listing_page_viewed events in the last 30 days, excluding tenants who signed a rent contract
  in that window and buyers who signed a sale agreement in the last year, plus broker-domain
  emails, empty emails, and non-BR country codes. Carries both email and phone so the same
  audience can feed email and WhatsApp journeys.
domain: Support and Services
owner: gustavo.brunelli@quintoandar.com.br
columns:
  id_user:
    description: >
      Platform user id of the eligible user, stored as a string so Hightouch can map it to the
      Salesforce Contact without a type cast. Equals dim_user.sk_user / EBDB user id. Built from
      CDP listing_page_viewed events in the sale business context, more than two views in 30 days.
    lineage:
      - datalake_cdp_clean.user_tracking.id_user
      - dw_public.dim_user.sk_user
  email_address:
    description: >
      Contact email of the eligible user, copied from dim_user for the Hightouch Salesforce sync.
      Empty strings and @corretores.quintoandar.com.br addresses are excluded; only BR or null
      country_code users are kept.
    lineage:
      - dw_public.dim_user.email
  uuid_person:
    description: >
      Person UUID of the eligible user, copied from dim_user so Hightouch can map the Salesforce
      Contact without a second identity lookup. Null only if dim_user has no uuid_person for that
      user.
    lineage:
      - dw_public.dim_user.uuid_person
  telefone_principal:
    description: >
      Main contact phone from dim_user with a leading plus stripped so Salesforce and WhatsApp can
      dial it. Null when the user has no main phone recorded; unlike the Homes audience, rows are
      not filtered on phone presence.
    lineage:
      - dw_public.dim_user.telefone_principal
