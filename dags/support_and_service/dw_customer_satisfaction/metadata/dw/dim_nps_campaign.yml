database_name: dw_customer_satisfaction
table_name: dim_nps_campaign
description: Table with context information about NPS campaigns, which are defined
  as survey models. Each line is a campaign registered at Tracksale.
domain: Support and Service
owner: ae-ss@quintoandar.com.br
columns:
  sk_nps_campaign:
    lineage:
    - datalake_tracksale.campaign.id
    description: Key of NPS campaign, which is a definition of a certain customer
      experience survey.
  name:
    lineage:
    - datalake_tracksale.campaign.campaign_name
    description: Name of the NPS campaign, such as registered in Tracksale.
  main_channel:
    lineage:
    - datalake_tracksale.campaign.main_channel
    description: Main channel in which the campaign is dispatched, such as email or
      sms.
  business_context:
    lineage:
    - datalake_tracksale.campaign.business_context
    description: Business context in which the NPS campaign is involved, such as forRent,
      B2B or forSale, if defined in Tracksale.
    categories:
      B2B: ''
      forRent: ''
      forSale: ''
  customer_journey:
    lineage:
    - datalake_tracksale.campaign.customer_journey
    description: Step of customer's journey in the NPS campaign, such as lost (churned)
      or true (client), if defined in Tracksale.
    categories:
      lost: ''
      'TRUE': ''
  purpose:
    lineage:
    - datalake_tracksale.campaign.purpose
    description: Purpose of use of the NPS campaign, such as main, test, internal,
      if defined in Tracksale.
    categories:
      internal: ''
      main: ''
      old: ''
      test: ''
  customer_type:
    lineage:
    - datalake_tracksale.campaign.customer_type
    description: Segment of the customer tracked in the NPS campaign, such IQ, PP,
      buyer, seller, if defined in Tracksale.
    categories:
      IQ: ''
      PP: ''
      affiliate: ''
      agent: ''
      buyer: ''
      candidate: ''
      employee: ''
      inspector: ''
      partners: ''
      photographer: ''
      seller: ''
  partner_name:
    lineage:
    - datalake_tracksale.campaign.partner_name
    description: Name of the B2B partner associated to the NPS campaign, if identified
      in Tracksale.
    categories:
      Barreto: ''
      CIPA: ''
      Canadá: ''
      Casa Mineira: ''
      Foxter: ''
      Nilo Uebel: ''
      Nova SP: ''
      Plus: ''
      Prado: ''
      Refúgios: ''
      Remax Xavante: ''
      Rizzo: ''
      Thaís: ''
      V3: ''
  metric_group:
    lineage:
    - datalake_tracksale.campaign.metric_group
    description: Main group in which the NPS campaign composes the final score, such
      as onboarding, ongoing, offboarding if defined in Tracksale.
    categories:
      buyerccv: ''
      buyercredit: ''
      buyerlostccv: ''
      buyerlostproposals: ''
      buyerlostvisits: ''
      buyerongoing: ''
      buyerregistry: ''
      iqlost: ''
      iqlostpropostas: ''
      iqlostpropostasrejected: ''
      iqlostvisitas: ''
      iqoffboarding: ''
      iqonboarding: ''
      iqongoing: ''
      offboarding: ''
      onboarding: ''
      ongoing: ''
      pplost: ''
      ppoffboarding: ''
      pponboarding: ''
      ppongoing: ''
      sellerccv: ''
      sellerlostccv: ''
      sellerongoing: ''
      sellerregistry: ''
      sellerunpublished: ''
  ts_created:
    lineage:
    - datalake_tracksale.campaign.ts_created
    description: Timestamp in which the NPS campaign was created in Tracksale.
  ts_load:
    description: Timestamp in which table was loaded in database.
