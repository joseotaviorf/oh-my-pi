database_name: dw_customer_satisfaction
table_name: fact_nps_answer_justifications
description: Table with detailed justifications from NPS answers, which are predefined
  reasons for some campaigns. Each line is a justification, either from main or second
  level.
domain: Support and Service
owner: ae-ss@quintoandar.com.br
columns:
  sk_nps_answer:
    lineage:
    - datalake_tracksale.answer_justifications.id_answer
    description: Key of the NPS answer from the customer in each dispatch (the last
      if multiple, which is rare).
  level:
    lineage:
    - datalake_tracksale.answer_justifications.level
    description: Hierarchy level of the justification provided, main if the first
      selection or second if in drop-down options.
    categories:
      main: ''
      second: ''
  justification:
    lineage:
    - datalake_tracksale.answer_justifications.justification
    description: Justification for the answer provided by the client, which might
      be multiple for answers and comes from a list.
  ts_load:
    description: Timestamp in which data was loaded in database.
