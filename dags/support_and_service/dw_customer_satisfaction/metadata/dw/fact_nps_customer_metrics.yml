database_name: dw_customer_satisfaction
table_name: fact_nps_customer_metrics
description: Table with aggregated NPS metrics for each customer. Each line is an
  unique customer
domain: Support and Service
owner: ae-ss@quintoandar.com.br
columns:
  sk_nps_customer:
    lineage:
    - datalake_tracksale.customer_conversions.id_customer
    description: 'Key of NPS customer in a dispatch. Formed by the three contact info
      availables: email, phone and name, if provided.'
  sk_user:
    lineage:
    - datalake_tracksale.answer_tags.tag_value
    - datalake_ebdb_customer_contact_identification.customer_contact_identification.id_user
    description: User ID of the NPS customer, when they are registered in QuintoAndar
      with EBDB login. Provided by dispatch database and completed by model whenever
      possible.
  sk_uuid_person:
    lineage:
    - datalake_ebdb_clean.user.uuid_person
    description: Personal and unique identification, registered in QuintoAndar with EBDB.
  last_shift_type:
    lineage:
    - datalake_tracksale.answer.score_category
    description: Type of the last shift in the NPS customer's answers, such as from
      promoter to detractor.
    categories:
      detractor:passive: ''
      detractor:promoter: ''
      passive:detractor: ''
      passive:promoter: ''
      promoter:detractor: ''
      promoter:passive: ''
  total_dispatches:
    lineage:
    - datalake_tracksale.customer_conversions.id_dispatch
    description: Total number of dispatches sent to the NPS customer.
  total_answers:
    lineage:
    - datalake_tracksale.customer_conversions.id_answer
    description: Total number of answers provided by the NPS customer to their dispatches.
  total_answers_forsale:
    lineage:
    - datalake_tracksale.customer_conversions.id_answer
    description: Total amount of responses from nps, filtered by For Sale context.
  total_answers_forrent:
    lineage:
    - datalake_tracksale.customer_conversions.id_answer
    description: Total amount of responses from nps, filtered by For Rent context.
  answers_as_promoter:
    lineage:
    - datalake_tracksale.customer_conversions.id_answer
    description: Number of respondents who are promoters.
  answers_as_detractor:
    lineage:
    - datalake_tracksale.customer_conversions.id_answer
    description: Number of respondents who are detractors.
  answer_rate:
    lineage:
    - datalake_tracksale.customer_conversions.id_answer
    - datalake_tracksale.customer_conversions.id_dispatch
    description: Average answer rate of the NPS customer, the ratio between their
      answers and dispatches.
  comment_rate:
    lineage:
    - datalake_tracksale.customer_conversions.id_answer
    description: Average comment rate of the NPS customer in their answers.
  avg_score:
    lineage:
    - datalake_tracksale.answer.nps_answer
    description: Average score of the answers provided by the NPS customers, ranging
      from 0 to 10.
  avg_score_forsale:
    lineage:
    - datalake_tracksale.answer.nps_answer
    description: Average score on responses to the context of For Sale.
  avg_score_forrent:
    lineage:
    - datalake_tracksale.answer.nps_answer
    description: Average score on responses to the context of For Rent.
  last_score:
    lineage:
    - datalake_tracksale.answer.nps_answer
    description: The NPS score provided by the customer in their last answered, if
      available.
  overall_nps:
    lineage:
    - datalake_tracksale.customer_conversions.id_answer
    description: Overall NPS score of the customer, considering standard metric which
      ranges from -100 to 100.
  overall_nps_forsale:
    lineage:
    - datalake_tracksale.customer_conversions.id_answer
    description: Information on the total number of promoters minus the total number of 
      detractors, referring to the For Sale context.
  overall_nps_forrent:
    lineage:
    - datalake_tracksale.customer_conversions.id_answer
    description: Information on the total number of promoters minus the total number of 
      detractors, referring to the For Rent context.
  avg_minutes_response_time:
    lineage:
    - datalake_tracksale.answer.seconds_spent_answering
    description: Average response time spent by the NPS customer during their answers.
  has_pending_survey:
    lineage:
    - datalake_tracksale.customer_conversions.id_dispatch
    description: Flag to indicate whether the NPS customer has pending surveys to
      answer or not.
  dt_last_dispatched:
    lineage:
    - datalake_tracksale.dispatch.ts_created
    description: Date of the last survey dispatched to the NPS customer.
  dt_last_answer:
    lineage:
    - datalake_tracksale.answer.ts_answer_sent_utc
    description: Date of the last reply sent.
  dt_first_answer:
    lineage:
    - datalake_tracksale.answer.ts_answer_sent_utc
    description: Date of the first reply sent.
  ts_load:
    description: Timestamp in which data was loaded into database.
