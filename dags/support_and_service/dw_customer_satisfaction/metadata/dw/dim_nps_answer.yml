database_name: dw_customer_satisfaction
table_name: dim_nps_answer
description: Table with context information about NPS answers (feedback provided by
  customers in dispatches). Each line is an answer.
domain: Support and Service
owner: ae-ss@quintoandar.com.br
columns:
  sk_nps_answer:
    lineage:
    - datalake_tracksale.answer.id
    description: Key of the NPS answer from the customer in each dispatch (the last
      if multiple, which is rare).
  campaign_step:
    lineage:
    - datalake_tracksale.answer_tags.tag_value
    description: NPS campaign step of the customer, which is registered only when
      they answer survey.
  score_category:
    lineage:
    - datalake_tracksale.answer.score_category
    description: Score category of the answer score, defined by theory as promoter,
      passive or detractor.
    categories:
      detractor: ''
      passive: ''
      promoter: ''
  comment:
    lineage:
    - datalake_tracksale.answer.nps_comment
    description: Comment written by customer in some answers, which is an optional
      custom field in survey.
  is_customer_identified:
    lineage:
    - datalake_tracksale.customer_conversions.is_customer_identified
    description: Boolean that indicates if the customer is identified through the
      id_customer, if the id_customer exists then it is True.
  ts_answered:
    lineage:
    - datalake_tracksale.answer.ts_answer_sent_local
    description: Timestamp in which the customer answered the survey.
  ts_load:
    description: Timestamp in which data was loaded into database.
