---
dag_documentation:
  dag_purpose: Tranform and centralize tasks from different sources to calculate the backoffice demand and SLA rate.

inner_dependencies:
  demand_metrics_tasks:
    - base_tasks
  demand_metrics:
    - demand_metrics_tasks
  backlog_metrics_tasks:
    - base_tasks
  backlog_metrics:
    - base_tasks
  quality_metrics:
    - base_tasks
tables:
  backlog_metrics:
    is_incremental: false
  base_tasks:
    is_incremental: false
  backlog_metrics_tasks:
    is_incremental: true
    partition_cols: ["year", "month", "day"]
  demand_metrics:
    is_incremental: false
  demand_metrics_tasks:
    is_incremental: false
  quality_metrics:
    is_incremental: false

custom_cluster:
  driver_node_type_id: r5d.8xlarge
  node_type_id: r5d.8xlarge
  runtime_engine: PHOTON
  num_workers: 3
  aws_attributes:
    ebs_volume_size: 300
