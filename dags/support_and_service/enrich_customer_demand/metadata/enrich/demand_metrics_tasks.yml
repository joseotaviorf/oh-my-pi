---
database_name: datalake_customer_demand
table_name: demand_metrics_tasks
description:
  This table presents a summary of all back-office tasks and their latest status, which
  includes received, solved, and closed demands, as well as whether the task was solved
  within its SLA or not. Unlike the backlog metrics task, this table does not track the
  number of days a task remained open, but instead provides the current status of
  each task.
domain: Support and Services
owner: data-ae-ss@quintoandar.com.br
columns:
  id_task:
    lineage:
      - datalake_customer_demand.base_tasks.id_task
    description: The id task, which is the crm task or the zendesk e-mail ticket.
  id_agent:
    lineage:
      - datalake_customer_demand.base_tasks.id_agent
    description:
      The id agent responsible for the task comes from the agents_control gsheets for
      CRM tasks, and from the tickets id_assignee for Zendesk e-mail tickets.
  id_user:
    lineage:
      - datalake_customer_demand.base_tasks.id_user
    description:
      The id user associated with the task is NULL for CRM tasks, but for Zendesk e-mail
      tickets, it is the same as the ticket id_user.
  id_taxonomy:
    lineage:
      - datalake_customer_demand.base_tasks.id_taxonomy
    description:
      The id taxonomy is used to represent the task taxonomy. For CRM tasks, the
      id_taxonomy is NULL. However, for zendesk e-mail tickets, it is a MD5 applied to
      some taxonomy fields, including "step_tag", "customer_type_tag", "client_type",
      "request_type", "contact_motivation_tag", "contact_theme_tag", and
      "contact_theme_detail_tag". The system considers the fields from left to right,
      and if the first field is NULL, it moves on to the next one until a
      non-NULL field is found.
  id_tags:
    lineage:
      - datalake_customer_demand.base_tasks.id_tags
    description:
      The id tag is used to represent the task tag. For CRM tasks, the id_tag is NULL.
      However, for Zendesk e-mail tickets, it is a MD5 applied to the ticket tag
      description field.
  id_main_department:
    lineage:
      - datalake_customer_demand.base_tasks.id_main_department
    description:
      The id_department associated with the task is the task type for CRM tasks,
      and a MD5 applied to the ticket department description field for
      Zendesk e-mail tickets.
  type:
    lineage:
      - datalake_customer_demand.base_tasks.type
    description: The department name.
  sla_target:
    lineage:
      - datalake_customer_demand.base_tasks.sla_target
    description:
      Each task has a SLA target. For CRM tasks, the default SLA target is 5 days.
      For Zendesk Tickets, it first considers the "tag sla target". If there is no
      return, it then considers the "unique_theme_detail_sla_target", followed by the
      "unique_theme_sla_target", and finally the "unique_journey_sla_target".
  agent_email:
    lineage:
      - datalake_customer_demand.base_tasks.agent_email
    description: Email of the agent assigned to the stask
  origin:
    lineage:
      - datalake_customer_demand.base_tasks.origin
    description: The task origin.
    categories:
      crm: For CRM tasks.
      email: For Zendesk E-mail Tickets.
      whatsapp: For backoffice whatsapp tickets.
  status:
    lineage:
      - datalake_customer_demand.base_tasks.status
    description:
      The task status differs for CRM tasks and Zendesk e-mail tickets. For CRM tasks,
      it is null. However, for Zendesk e-mail tickets, it can take on other values.
    categories:
      new: If a ticket was created.
      deleted: If a ticket was deleted.
      pending: If there is a pendency for the ticket.
      closed: If a ticket was closed.
      solved: If a ticket was solved.
      open: If a ticket is open.
      hold: If a ticket is on hold.
  time_spent_solved_in_time:
    description:
      The total days worked on a task is calculated as the difference between the
      task's start and end dates, not considering days off. If the total days worked
      are less than or equal to the task's SLA target, the total days worked are
      returned. Otherwise, the function returns 0.
  time_spent_not_solved_in_time:
    description:
      The total days worked on a task is calculated as the difference between the
      task's start and end dates, not considering days off. If the total days worked
      are greater than the task's SLA target, the total days worked are returned.
      Otherwise, the function returns 0.
  days_worked:
    description: The difference between the task's start and end dates, not considering days off.
  days_off:
    description:
      Total days off between the task's start and end dates, considering holidays
      and weekend.
  total_time_spent:
    description:
      The total worked days spent on the task, it assumes the same value as
      days_worked field.
  is_ticket_solved_in_time:
    description:
      If the total days worked are  less than or equal to the task's SLA target, it is
      equal to TRUE, otherwise, it is FALSE.
  is_ticket_not_solved_in_time:
    description:
      If the total days_worked are greater than the task's SLA target, it is equal to
      TRUE, otherwise, it is FALSE.
  is_received_demand:
    description: If the task ts_started is not null, then it is TRUE, otherwise, it is FALSE.
  is_solved_demand:
    description: If the task ts_completed is not null, then it is TRUE, otherwise, it is FALSE.
  is_closed_demand:
    description: If the task ts_closed is not null, then it is TRUE, otherwise, it is FALSE.
  ts_started:
    lineage:
      - datalake_customer_demand.base_tasks.ts_started
    description:
      This timestamp indicates when the task started. For Zendesk email tickets, if a
      ticket has a budget executed, it considers the budget date; otherwise, it
      considers the ticket creation date in the America/Sao_Paulo timezone.
  ts_completed:
    lineage:
      - datalake_customer_demand.base_tasks.ts_completed
    description:
      The task's solved date. For Zendesk email tickets, it is the ticket solved date
      in the America/Sao_Paulo timezone.
  ts_zendesk_started:
    lineage:
      - datalake_customer_demand.base_tasks.ts_zendesk_started
    description:
      This timestamp field is exclusive to Zendesk e-mail tickets and represents the
      creation date of the ticket in the America/Sao_Paulo timezone.
  ts_budget:
    lineage:
      - datalake_customer_demand.base_tasks.ts_budget
    description:
      This timestamp field pertains only to Zendesk e-mail tickets and represents the
      date on which the budget was executed.
  ts_closed:
    lineage:
      - datalake_customer_demand.base_tasks.ts_closed
    description: The task closed date.
