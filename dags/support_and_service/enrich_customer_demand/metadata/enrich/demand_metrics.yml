---
database_name: datalake_customer_demand
table_name: demand_metrics
description:
  This table provides a daily record of the demands received by each agent, categorized
  by department. The data is updated daily, with historical data kept without freezing.
  The table is generated by using tasks from demand_metrics_tasks and then
  summarizing them by agent and department.
domain: Support and Services
owner: data-ae-ss@quintoandar.com.br
columns:
  id_agent:
    lineage:
      - datalake_customer_demand.demand_metrics_tasks.id_agent
    description:
      The id agent responsible for the task comes from the agents_control gsheets for
      CRM tasks, and from the tickets id_assignee for Zendesk e-mail tickets.
  type:
    lineage:
      - datalake_customer_demand.demand_metrics_tasks.type
    description: The department name.
  received_demand:
    description: Total received demand by agent and department.
  solved_demand:
    description: Total solved demand by agent and department.
  closed_demand:
    description: Total closed demand by agent and department.
  tickets_solved_in_time:
    lineage:
      - datalake_customer_demand.demand_metrics_tasks.is_ticket_solved_in_time
    description: Total demands solved in time by agent and department.
  tickets_not_solved_in_time:
    lineage:
      - datalake_customer_demand.demand_metrics_tasks.is_ticket_not_solved_in_time
    description: Total demands not solved in time by agent and department.
  time_spent_on_tickets_solved_in_time:
    lineage:
      - datalake_customer_demand.demand_metrics_tasks.time_spent_solved_in_time
    description: Total days worked in demands solved within the SLA.
  time_spent_on_tickets_not_solved_in_time:
    lineage:
      - datalake_customer_demand.demand_metrics_tasks.time_spent_not_solved_in_time
    description: Total days worked in demands not solved within the SLA.
  total_time_spent:
    lineage:
      - datalake_customer_demand.demand_metrics_tasks.total_time_spent
    description: Total time spent on days, not considering days off.
  dt_metric_reference:
    lineage:
      - datalake_customer_demand.demand_metrics_tasks.ts_started
      - datalake_customer_demand.demand_metrics_tasks.ts_completed
      - datalake_customer_demand.demand_metrics_tasks.ts_closed
    description:
      The metric-reference date depends on the type of demand being analyzed.
      For SLA metrics, it uses the timestamp of task completion (ts_completed).
      For closed demands, it uses the timestamp of demand closure (ts_closed).
      For received demands, it uses the timestamp of task start (ts_started).
      And for solved demands, it uses the timestamp of task completion (ts_completed).
