dag:
  name: enrich_customer_demand
  schedule_start_date: 2021, 11, 16
  owner: Data SS
  documentation:
    dag_purpose: Tranform and centralize tasks from different sources to calculate the backoffice demand and SLA rate.

workflow:
  type: query_delta
  layer: enrich
  inner_dependencies:
    demand_metrics_tasks:
    - base_tasks
    demand_metrics:
    - demand_metrics_tasks
    backlog_metrics_tasks:
    - base_tasks
    backlog_metrics:
    - base_tasks
    quality_metrics:
    - base_tasks
  tables_customization:
    backlog_metrics_tasks:
      partitions: [year, month, day]
      extraction_type: incremental

cluster:
  type: custom_cluster
  custom_configurations:
    autotermination_minutes: 20
    driver_node_type_id: r5d.2xlarge
    node_type_id: r5d.2xlarge
    runtime_engine: PHOTON
    spark_version: 12.2.x-scala2.12
    num_workers: 3
    aws_attributes:
      first_on_demand: 1
      spot_bid_price_percent: 100
      zone_id: us-east-1d
      availability: SPOT_WITH_FALLBACK
      ebs_volume_size: 300
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
  databricks_conn_id: databricks_new
