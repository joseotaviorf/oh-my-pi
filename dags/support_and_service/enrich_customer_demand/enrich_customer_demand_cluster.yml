cluster:
  type: consolidation_l_memory_single_node_cluster
  databricks_conn_id: databricks_new_env
  custom_configurations:
    aws_attributes:
      ebs_volume_size: 300
    runtime_engine: PHOTON
validation:
  cluster:
    type: emr_7_12_consolidation_xl_memory_fleet_cluster
    custom_configurations:
      task_nodes:
        instance_types:
        - r6g.8xlarge
        - r7g.8xlarge
        - r6i.8xlarge
        target_on_demand: 0
        target_spot: 3
        allocation_strategy: price-capacity-optimized
        bid_price_percentage: 100
      core_nodes:
        target_on_demand: 2
        target_spot: 0
        instance_types:
        - r6g.8xlarge
        - r7g.8xlarge
        - r6i.8xlarge
      aws_attributes:
        ebs_volume_size: 300
      spark_conf:
        spark.executor.memory: 96g
        spark.executor.memoryOverhead: 8g
        spark.driver.memory: 20g
        spark.driver.memoryOverhead: 4g
        spark.dynamicAllocation.maxExecutors: '20'
        spark.sql.shuffle.partitions: '400'
