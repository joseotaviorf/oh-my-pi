dag:
  name: enrich_ebdb_customer_contact_identification
  schedule_start_date: 2020, 7, 16
  owner: Data SS
  documentation:
    dag_purpose: |
      Creates enriched tables for the context `Customer Contact Identification`
      of ebdb adding information like emails and phone numbers for customer.
workflow:
  type: query_delta
  layer: enrich
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: m5a.xlarge
    node_type_id: m5a.xlarge
    num_workers: 3
    spark_version: 13.3.x-scala2.12
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
  databricks_conn_id: databricks_new
