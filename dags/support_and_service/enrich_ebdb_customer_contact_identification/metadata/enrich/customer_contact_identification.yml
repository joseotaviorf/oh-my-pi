database_name: datalake_ebdb_customer_contact_identification
table_name: customer_contact_identification
description:
  Enrichment table with the aim of consolidating contact information for main
  users. Each row in this table represents a user (of any type) in ebdb.
domain: Support and Services
owner: data-ae-ss@quintoandar.com.br
columns:
  id_user:
    description: Unique ebdb user identification key.
    lineage:
      - datalake_ebdb_clean.user_aud.id_user
  cpf:
    description: Information related to the user document.
    lineage:
      - datalake_ebdb_clean.user.cpf
      - datalake_ebdb_clean.user_aud.cpf
  customer_contact:
    description: Descriptive data that indicates the user's contact information.
    lineage:
      - datalake_ebdb_clean.user_aud.alternative_email
      - datalake_ebdb_clean.user_aud.email
      - datalake_ebdb_clean.user_aud.main_phone
      - datalake_ebdb_clean.user_aud.secondary_phone
  channel:
    description: Descriptive information indicating the type of contact information described in the customer_contact column.
    categories:
      phone: Indicates that the contact came via telephone.
      email: Indicates that the contact came via email.
