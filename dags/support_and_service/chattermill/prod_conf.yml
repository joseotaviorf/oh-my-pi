---
partition_cols: ["year", "month", "day"]
dag_documentation:
  dag_purpose: |
    Retrieve data from Chattermill API. Chattermill is an external
    service that does unified customer feedback analytics. In our case, we
    mostly use it to process NPS survey data.
  additional_information: |
    We get data from _Responses_ endpoint, that gets processed information
    on NPS survey commentaries. For further information, please read [this
    documentation](https://www.notion.so/productquintoandar/Chattermill-In
    tegration-f0bddc216d5f45be974ce101710218d0), also available [here]
    (https://docs.google.com/document/d/1fCIkDUZyTrfR0C2cxVj19OqrEjxiB-9ddZ4oSAq0xC0).
tables:
  responses:
    endpoint: responses
    block_list_campaing:
      - "[PA] ClimaeEngajamento - Gestor"
      - "[PA] ClimaeEngajamento - Colaborador"
      - "[PA] eNPS - Q3"
    schema: '{"fields": [{"metadata": {}, "name": "comment", "nullable": true, "type": "string"}, {"metadata": {}, "name": "created_at", "nullable": true, "type": "string"}, {"metadata": {}, "name": "data_source", "nullable": true, "type": "string"}, {"metadata": {}, "name": "data_type", "nullable": true, "type": "string"}, {"metadata": {}, "name": "dataset", "nullable": true, "type": "string"}, {"metadata": {}, "name": "id", "nullable": true, "type": "long"}, {"metadata": {}, "name": "original_comment", "nullable": true, "type": "string"}, {"metadata": {}, "name": "phrases", "nullable": true, "type": "string"}, {"metadata": {}, "name": "score", "nullable": true, "type": "long"}, {"metadata": {}, "name": "tags", "nullable": true, "type": "string"}, {"metadata": {}, "name": "updated_at", "nullable": true, "type": "string"}, {"metadata": {}, "name": "user_attributes", "nullable": true, "type": "string"}, {"metadata": {}, "name": "themes", "nullable": true, "type": {"containsNull": true, "elementType": {"keyType": "string", "type": "map", "valueContainsNull": true, "valueType": "string"}, "type": "array"}}, {"metadata": {}, "name": "year", "nullable": true, "type": "integer"}, {"metadata": {}, "name": "month", "nullable": true, "type": "integer"}, {"metadata": {}, "name": "day", "nullable": true, "type": "integer"}], "type": "struct"}'
