database_name: datalake_braze_events_clean
table_name: events_owners
owner: gabriel.firmino@quintoandar.com.br
domain: Support and Services
description: This table contains details about events related/realized by owners, e.g. disptaches or clicks.
columns:
  id:
    description: Unique code to identify an event (dispatch or interaction of the user with the communication).
    lineage:
      - datalake_braze_events_raw.events_owners.id
  event_info:
    description: JSON with relevant information about the event.
    lineage:
      - datalake_braze_events_raw.events_owners.event_info
  event_type:
    description: Full event type name indicating the Braze event category (e.g., send, open, click, delivery, bounce).
    lineage:
      - datalake_braze_events_raw.events_owners.event_type
  year:
    description: Year when the Braze event occurred. Partition column — filter on this column to enable partition pruning.
    lineage:
      - datalake_braze_events_raw.events_owners.year
  month:
    description: Month when the Braze event occurred. Partition column — filter on this column to enable partition pruning.
    lineage:
      - datalake_braze_events_raw.events_owners.month
  day:
    description: Day when the Braze event occurred. Partition column — filter on this column to enable partition pruning.
    lineage:
      - datalake_braze_events_raw.events_owners.day
