database_name: datalake_braze_events_raw
table_name: events_indica_ai
description: Raw Braze events for the IndicaAi campaign audience. One row per Braze event (dispatch, interaction) for IndicaAi users. Contains PII — access restricted.
owner: gabriel.firmino@quintoandar.com.br
