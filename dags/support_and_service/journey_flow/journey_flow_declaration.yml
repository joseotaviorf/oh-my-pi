dag:
  name: journey_flow
  schedule_start_date: 2021, 2, 18
  schedule_interval: 0 3 * * *
  owner: Data SS
  documentation:
    dag_purpose: |
      Retrieve data from the [Journey Flow](https://github.com/quintoandar/journey-flow) database,
      a service that is part of the chatbot structure.

workflow:
  type: database_pull
  layer: raw
  database_type: postgres
  lineage_product_database_name: journey_flow
  dbutils_secret_key: JOURNEY_FLOW_DB
  tables_customization:
    t_journey_content:
      extraction_type: full
      clean_table_name: journey_content
    t_rule:
      extraction_type: full
      clean_table_name: rule
    t_journey_flow:
      date_filter_column: updated_at
      extraction_type: incremental
      partitions: [year, month, day]
      clean_table_name: journey_flow
    t_dialog:
      date_filter_column: creation
      extraction_type: incremental
      partitions: [year, month, day]
      clean_table_name: dialog

cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: m6g.2xlarge
    node_type_id: m6g.2xlarge
    num_workers: 4
    spark_version: 13.3.x-scala2.12
