database_name: reverse_webhelp
azure_container_name: lake-quinto-andar-hml

tables:
  backlog_metric:
    context: metrics
  csat_front:
    context: csat
  demand_metric:
    context: metrics
  fcr_metric:
    context: metrics
  general_metric:
    context: metrics
  speech_call:
    context: speech_analytics
  speech_chat:
    context: speech_analytics
  taxonomia_call:
    context: taxonomia
  taxonomia_chat:
    context: taxonomia
  taxonomia_email:
    context: taxonomia
  twilio_chat_aht:
    context: metrics

schema:
  fields:
    - metadata: {}
      name: table_name
      nullable: true
      type: string
    - metadata: {}
      name: dt_last_updated
      nullable: true
      type: string
    - metadata: {}
      name: ts_execution
      nullable: true
      type: string
  type: struct

custom_cluster:
  driver_node_type_id: m5a.2xlarge
  node_type_id: m5a.2xlarge
  autoscale:
    max_workers: 3
    min_workers: 1
