dag:
  name: terminator_fast_lane
  schedule_start_date: 2025, 03, 18
  schedule_interval: 0,30 * * * *
  owner: Data SS
  documentation:
    dag_purpose: |
      This DAG imports the tables from [Terminator](https://github.com/quintoandar/terminator), our service to orchestrate the offboard contract process.
        This table is updated every 30 minutes.

workflow:
  type: cdc
  layer: raw
  database_type: postgres
  source_database: terminator
  source_schema: public
  custom_schema: terminator
  dbutils_secret_key: TERMINATOR_DB
  lineage_product_database_name: terminator
  execution_timeout_hours: 0.5
  tables_customization:
    termination: {}
cluster:
  type: custom_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    driver_node_type_id: r-fleet.xlarge
    node_type_id: r-fleet.xlarge
    num_workers: 2
    spark_version: 16.4.x-scala2.12
    aws_attributes:
      availability: ON_DEMAND
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
