---
partition_cols: [year, month, day]
lineage_product_database_name: repairs

dag_documentation:
  dag_purpose:
    "This DAG handles the ingestion of the raw and clean data for our Repairs Service, \n
    which is a Service that was created to make repairs experience faster and easier for \n
    Tenants and Landlords. Check [its own repository](https://github.com/quintoandar/repairs) \n
    for more informations."

tables:
  # <raw_table_name>:
  #   clean_table_name: <clean_table_name>
  #   is_incremental: <is_incremental> #optional
  #   date_column: <date_column> #optional
  #   unixtime_measure: <unixtime_measure> #optional
  instant_approval_preference_aud: {}
  instant_approval_preference:
    is_incremental: True
    date_column: updated_at
  repair_evidence_aud: {}
  repair_evidence:
    is_incremental: True
    date_column: updated_at
  repair_expense_aud: {}
  repair_expense: {}
  repair_expense_group_aud: {}
  repair_expense_group: {}
  repair_request_aud: {}
  repair_request:
    is_incremental: True
    date_column: updated_at
  repair_request_item_aud: {}
  repair_request_item:
    is_incremental: True
    date_column: updated_at
  revinfo:
    clean_table_name: rev_info
    is_incremental: True
    date_column: revtstmp
    unixtime_measure: milliseconds
  service_request:
    is_incremental: True
    date_column: updated_at
  service_request_aud: {}
