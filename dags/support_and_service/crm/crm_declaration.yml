dag:
  name: crm
  schedule_start_date: 2021, 2, 18
  schedule_interval: 0 0 * * *
  owner: Data SS
  documentation:
    dag_purpose: Retrieves data from CRM (Customer Relationship Management) and load it on datalake.
workflow:
  type: database_pull
  layer: raw
  database_type: mongo
  lineage_product_database_name: crm
  dbutils_secret_key: CRM_DB
  tables_customization:
    tasks:
      clean_table_name: tasks
      date_filter_column: actions.date
      partitions: [year, month, day]
      extraction_type: incremental
    taskstatushistories:
      clean_table_name: task_status_histories
      date_filter_column: history.date
      partitions: [year, month, day]
      extraction_type: incremental
    tasktitles:
      clean_table_name: task_titles
    workflows:
      clean_table_name: workflows
      date_filter_column: updated
      partitions: [year, month, day]
      extraction_type: incremental
    workgroups: {}
cluster:
  type: custom_cluster
  custom_configurations:
    spark_version: 14.3.x-scala2.12
    autotermination_minutes: 20
    driver_node_type_id: c5a.4xlarge
    node_type_id: c5a.2xlarge
    autoscale:
      max_workers: 4
      min_workers: 1
    aws_attributes:
      first_on_demand: 1
      spot_bid_price_percent: 100
      zone_id: us-east-1d
      availability: SPOT_WITH_FALLBACK
      ebs_volume_size: 200
    spark_conf:
      spark.sql.createHiveTableByDefault: "true"
      spark.sql.parquet.datetimeRebaseModeInRead: LEGACY
      spark.sql.parquet.datetimeRebaseModeInWrite: LEGACY
      spark.sql.timeParserPolicy: LEGACY
