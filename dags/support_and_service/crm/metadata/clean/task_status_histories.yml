---
database_name: datalake_crm_clean
table_name: task_status_histories
domain: Support and Services
owner: gabriel.firmino@quintoandar.com.br
description: >
  One row per CRM task tracking its status change history over time. Each record
  holds the full history of status transitions for a single task, along with the
  document version. Source system is datalake_crm_raw.
columns:
  id:
    lineage:
      - datalake_crm_raw.taskstatushistories._id

    description: Unique identifier for the task status history record.
  history:
    lineage:
      - datalake_crm_raw.taskstatushistories.history

    description: JSON array containing the status change events for this task over time.
  version:
    lineage:
      - datalake_crm_raw.taskstatushistories.__v

    description: Version number of the task status history record for incremental tracking.
  year:
    lineage:
      - datalake_crm_raw.taskstatushistories.year
    description: Year of update date.
  month:
    lineage:
      - datalake_crm_raw.taskstatushistories.month
    description: Month of update date.
  day:
    lineage:
      - datalake_crm_raw.taskstatushistories.day
    description: Day of update date.
