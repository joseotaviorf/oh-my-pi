---
dag_documentation:
  dag_purpose: Retrieves data from CRM (Customer Relationship Management) and load it on datalake.

lineage_product_database_name: crm

custom_cluster:
  driver_node_type_id: c5.4xlarge
  node_type_id: c5.2xlarge
  autoscale:
    max_workers: 4
    min_workers: 1
  aws_attributes:
    ebs_volume_size: 200

partition_cols: [year, month, day]

tables:
  # <raw_table_name>:
  #   clean_table_name: <clean_table_name> #optional
  #   is_incremental: <is_incremental> #optional
  #   date_column: <date_column> #optional
  #   unixtime_measure: <unixtime_measure> #optional
  tasks:
    clean_table_name: tasks
    is_incremental: True
    date_column: actions.date
  taskstatushistories:
    clean_table_name: task_status_histories
    is_incremental: True
    date_column: history.date
  tasktitles:
    clean_table_name: task_titles
  workflows:
    clean_table_name: workflows
    is_incremental: True
    date_column: updated
  workgroups: {}
