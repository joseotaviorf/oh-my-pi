database_name: datalake_app_installed
table_name: events
description: Table containing the a series of Amplitude events for every id_user
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  id_user:
    lineage:
      - datalake_amplitude_clean.events.id_user
    description: ID of the user
  app_version:
    lineage:
      - datalake_amplitude_clean.events.version_name
    description: Version of the app installed on the users device at the time of the event
  ts_event:
    lineage:
      - datalake_amplitude_clean.events.ts_event
    description: Timestamp registered for the event
