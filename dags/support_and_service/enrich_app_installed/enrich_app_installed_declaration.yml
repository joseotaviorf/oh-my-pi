dag:
  name: enrich_app_installed
  schedule_start_date: 2023, 4, 18
  owner: Data SS
  documentation:
    dag_purpose: Consolidate events related to usage of the QuintoAndar App per client.

workflow:
  type: query_delta
  layer: enrich

cluster:
  type: custom_cluster
  custom_configurations:
    spark_version: 13.3.x-scala2.12
    driver_node_type_id: m6g.4xlarge
    node_type_id: m6g.4xlarge
    num_workers: 4
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
  databricks_conn_id: databricks_new
