dag:
    name: enrich_tenant_journey
    schedule_start_date: 2023, 7, 2
    owner: Data SS
    documentation:
        dag_purpose: |
            This DAG creates an enriched table containing the Tenant Journey Step.
            The respective table is a comprehensive record of customer journey steps, which is
            designed to categorize the progress of customers as they engage with the rental
            context.
            Each row in the table represents a specific customer and their journey
            through various stages or actions.
            The primary purpose of this table is to capture and organize important milestones
            and interactions that customers go through during their experience with the rental
            context. It provides a snapshot view of the different steps involved in the
            customer journey.
workflow:
    type: query_delta
    layer: enrich
    default_extraction_type: incremental
    default_partitions: ["year", "month", "day"]
    tables_customization:
        tenant_journey_step:
            z_order_by: [id_client, id_snapshot]
cluster:
    type: custom_cluster
    custom_configurations:
        driver_node_type_id: m5d.4xlarge
        node_type_id: m5d.4xlarge
        spark_version: 13.3.x-scala2.12
        runtime_engine: PHOTON
        num_workers: 4
        aws_attributes:
            ebs_volume_size: 200
