---
database_name: datalake_survicate_test_clean
table_name: surveys
description: This table contains a list of all searches in your workspace, including their associated metadata and configuration parameters.
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  id_survey:
    description: The survey's unique unchangeable identifier.
    lineage:
      - datalake_survicate_test_raw.surveys.id
  survey_name:
    description: The name of the survey.
    lineage:
      - datalake_survicate_test_raw.surveys.name
  type:
    description: |
      The survey's unchangeable type. The type of survey corresponds to the distribution method the
      survey is delivered to your respondents: * PageSurvey is Email & Sharable Link Survey *
      WidgetSurvey is Web & In-Product Survey * MobileSurvey is Mobile App Survey * IntercomSurvey is
      Intercom Messenger Survey.
    categories:
      PageSurvey: ""
      WidgetSurvey: ""
      MobileSurvey: ""
      IntercomSurvey: ""
    lineage:
      - datalake_survicate_test_raw.surveys.type
  launch:
    description: |
      - "start_at": Date when the survey will start appearing to respondents.
      - "end_at": Date when the survey will stop appearing to respondents.
      - "responses_limit": The survey will stop being available to respondents after collecting
      that amount of responses.
    lineage:
      - datalake_survicate_test_raw.surveys.launch
  total_responses:
    description: The total number of survey responses.
    lineage:
      - datalake_survicate_test_raw.surveys.responses
  is_enabled:
    description: Indicates whether a survey is available for respondents.
    lineage:
      - datalake_survicate_test_raw.surveys.enabled
  workspace_name:
    description: Workspace where the survey is from.
    lineage:
      - datalake_survicate_test_raw.surveys.workspace_name
  ts_created:
    description: The timestamp when the survey was creatd.
    lineage:
      - datalake_survicate_test_raw.surveys.created_at
  dt_load:
    description: Date and time when the data was loaded.
    lineage:
      - datalake_survicate_test_raw.surveys.dt_load
  year:
    description: Year when the data was loaded.
    lineage:
      - datalake_survicate_test_raw.surveys.year
  month:
    description: Month when the data was loaded.
    lineage:
      - datalake_survicate_test_raw.surveys.month
  day:
    description: Day when the data was loaded.
    lineage:
      - datalake_survicate_test_raw.surveys.day
