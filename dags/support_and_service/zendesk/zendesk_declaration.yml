dag:
  name: zendesk
  schedule_start_date: 2019, 9, 27
  schedule_interval: 0 0 * * *
  owner: Data SS
  documentation:
    dag_purpose: |
      Load data of the Zendesk to the Clean layer, the Raw layer is loaded by Stitch.
      Zendesk is responsible for the tickets of the customer services.

workflow:
  layer: raw
  type: custom_ingestion
  load_spark_job: add_data_from_stitch_to_raw
  spark_job_arguments:
  - "{environment}"
  - "{bucket}"
  - "{{ data_interval_start | ds }}"
  - "{{ macros.ds_add(data_interval_start | ds, 1) }}" # this refers to the next day. This only makes sense when the DAG runs daily.
  - "{table_name}"

  default_extraction_type: incremental
  default_partitions: [year, month, day]
  tables_customization:
    users:
      z_order_by: [id_user]
    groups:
      z_order_by: [id_group]
    group_memberships:
      z_order_by: [id_group_membership]
    organizations:
      z_order_by: [id_organization]
    satisfaction_ratings:
      z_order_by: [id_satisfaction_rating]
    tickets:
      z_order_by: [id_ticket]
    ticket_metrics:
      z_order_by: [id_ticket]
    ticket_fields:
      z_order_by: [id_ticket_field]
    ticket_comments:
      load_spark_job: add_data_from_airbyte_to_raw
      z_order_by: [id_ticket]
    ticket_audits:
      load_spark_job: add_data_from_airbyte_to_raw
      z_order_by: [id_ticket]

