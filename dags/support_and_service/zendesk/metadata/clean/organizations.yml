database_name: datalake_zendesk_clean
table_name: organizations
description:
  One row per Zendesk organization linked to customer accounts, deduplicated
  to the latest version per organization id.
owner: gabriel.firmino@quintoandar.com.br
domain: Support and Services
columns:
  id_group:
    lineage:
      - datalake_zendesk_tickets_raw.organizations.group_id
    description: Zendesk group id responsible for handling the ticket.
  id_external:
    lineage:
      - datalake_zendesk_tickets_raw.organizations.external_id
    description: External system identifier mapped to this Zendesk user.
  name:
    lineage:
      - datalake_zendesk_tickets_raw.organizations.name
    description: Display name of the entity as registered in the upstream operational application.
  domain_names:
    lineage:
      - datalake_zendesk_tickets_raw.organizations.domain_names
    description: Business value representing domain names on the organizations clean dataset.
  url:
    lineage:
      - datalake_zendesk_tickets_raw.organizations.url
    description: Canonical URL of the support ticket or resource in the external ticketing platform.
  organization_fields:
    lineage:
      - datalake_zendesk_tickets_raw.organizations.organization_fields
    description: Business value representing organization fields on the organizations clean dataset.
  has_shared_tickets:
    lineage:
      - datalake_zendesk_tickets_raw.organizations.shared_tickets
    description: Boolean flag indicating whether has shared tickets applies to this support service record.
  has_shared_comments:
    lineage:
      - datalake_zendesk_tickets_raw.organizations.shared_comments
    description: Boolean flag indicating whether has shared comments applies to this support service record.
  tags:
    lineage:
      - datalake_zendesk_tickets_raw.organizations.tags
    description: List of labels attached to the record for filtering and automation rules.
  details:
    lineage:
      - datalake_zendesk_tickets_raw.organizations.details
    description: Additional profile details stored on the Zendesk user record.
  notes:
    lineage:
      - datalake_zendesk_tickets_raw.organizations.notes
    description: Internal notes written by agents about this Zendesk user.
  ts_updated:
    lineage:
      - datalake_zendesk_tickets_raw.organizations.updated_at
    description: Timestamp of the most recent update to the record in the upstream source system.
  ts_created:
    lineage:
      - datalake_zendesk_tickets_raw.organizations.created_at
    description: Timestamp when the record was first created in the upstream source system.
  ts_deleted:
    lineage:
      - datalake_zendesk_tickets_raw.organizations.deleted_at
    description: Timestamp when deleted occurred according to the source system.
  year:
    lineage:
      - datalake_zendesk_tickets_raw.organizations.dt
    description: Year partition derived from the source event timestamp for incremental loading.
  month:
    lineage:
      - datalake_zendesk_tickets_raw.organizations.dt
    description: Month partition derived from the source event timestamp for incremental loading.
  day:
    lineage:
      - datalake_zendesk_tickets_raw.organizations.dt
    description: Day partition derived from the source event timestamp for incremental loading.
  dt_extracted:
    lineage: []
    description: Calendar date of the Stitch or batch extraction snapshot for this record.
  id_organization:
    lineage: []
    description: Zendesk organization identifier linked to the user or ticket.
