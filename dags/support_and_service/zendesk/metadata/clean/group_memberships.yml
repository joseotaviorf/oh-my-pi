database_name: datalake_zendesk_clean
table_name: group_memberships
description:
  One row per membership linking a Zendesk user to an agent group for ticket
  routing and workload reporting.
owner: gabriel.firmino@quintoandar.com.br
domain: Support and Services
columns:
  id_group:
    lineage:
      - datalake_zendesk_raw.group_memberships.group_id
    description: Zendesk group id responsible for handling the ticket.
  id_user:
    lineage:
      - datalake_zendesk_raw.group_memberships.user_id
    description: QuintoAndar user identifier associated with the IVR interaction or scheduled call.
  is_default:
    lineage:
      - datalake_zendesk_raw.group_memberships.default
    description: Indicates whether default applies to this record.
  dt_extracted:
    lineage:
      - datalake_zendesk_raw.group_memberships.dt
    description: Calendar date of the Stitch or batch extraction snapshot for this record.
  ts_created:
    lineage:
      - datalake_zendesk_raw.group_memberships.created_at
    description: Timestamp when the record was first created in the upstream source system.
  ts_updated:
    lineage:
      - datalake_zendesk_raw.group_memberships.updated_at
    description: Timestamp of the most recent update to the record in the upstream source system.
  year:
    lineage:
      - datalake_zendesk_raw.group_memberships.dt
    description: Year partition derived from the source event timestamp for incremental loading.
  month:
    lineage:
      - datalake_zendesk_raw.group_memberships.dt
    description: Month partition derived from the source event timestamp for incremental loading.
  day:
    lineage:
      - datalake_zendesk_raw.group_memberships.dt
    description: Day partition derived from the source event timestamp for incremental loading.
  ts_load:
    lineage: []
    description: Timestamp when the row was materialized into the governance lake by the ETL pipeline.
  id_group_membership:
    lineage: []
    description: Zendesk identifier for the group membership linked to this record.
  url:
    lineage: []
    description: Canonical URL of the support ticket or resource in the external ticketing platform.
