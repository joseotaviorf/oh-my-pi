dag:
  name: enrich_inspections
  schedule_start_date: 2022, 1, 19
  owner: Data SS
  documentation:
    dag_purpose: |
      This DAG is responsible for the union tables between new Inspection Services data and old PWA data, 
      as well as the construction of metrics through this data.

workflow:
  type: query_delta
  layer: enrich
  inner_dependencies:
    inspection_booking:
      - main_inspection_booking
    item:
      - item_group
    item_issue:
      - item
    item_media:
      - item
    item_review:
      - item
    report_approval:
      - reviewer
  tables_customization:
    inspection_booking: {}
    inspection_status_change: {}
    item_group:
      partitions: [year, month, day]
      extraction_type: incremental
    item_issue:
      partitions: [year, month, day]
      extraction_type: incremental
    item_media:
      partitions: [year, month, day]
      extraction_type: incremental
    item_review:
      partitions: [year, month, day]
      extraction_type: incremental
    item:
      partitions: [year, month, day]
      extraction_type: incremental
    repair_exempted:
      partitions: [year, month, day]
      extraction_type: incremental
    report_approval: {}
    report_review_media:
      partitions: [year, month, day]
      extraction_type: incremental
    room:
      partitions: [year, month, day]
      extraction_type: incremental
    reviewer:
      partitions: [year, month, day]
      extraction_type: incremental
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, ds, 'load_end_date') }}"
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: m5a.4xlarge
    node_type_id: m5a.4xlarge
    num_workers: 3
    spark_version: 12.2.x-scala2.12
