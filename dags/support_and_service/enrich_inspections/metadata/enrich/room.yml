    description: Room unique identifier.
    lineage:
      - datalake_inspection_services_clean.room.id_room
  id_assessment:
    description: Unique identifier of an Assessment.
      This identifier must be unique per inspection, however, for dates prior to August 19, 2023, there is residual data in a product bug.
      This bug erroneously created more than one Assessment per survey. Therefore, for these cases, the id_inspection will not be unique.
      It is observed that the extra Assessments are identical, with no data distinction between them.
    lineage:
      - datalake_inspection_services_clean.room.id_assessment
  id_room_type:
    description: Room Type unique identifier.
    lineage:
      - datalake_inspection_services_clean.room_type.id_room_type
  room_name:
    description: Descriptive name of the room (typed by inspector).
    lineage:
