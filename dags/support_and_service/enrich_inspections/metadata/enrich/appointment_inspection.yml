---
database_name: datalake_inspections
table_name: appointment_inspection
description: |
  Enrichment table that aims to store the processed inspection scheduling data.
  Each line of this table contains a scheduling record linked to the inspection process.
domain: Support and Services
owner: data-ae-ss@quintoandar.com.br
columns:
  id_appointment:
    lineage:
      - datalake_inspection_services_clean.appointment.id_appointment
      - datalake_ebdb_clean.booking.id
    description: scheduling identification key in hash format that groups the main and IS ids.
  id_is_appointment:
    lineage:
      - datalake_inspection_services_clean.appointment.id_appointment
    description: Unique scheduling identification key in IS.
  id_main_appointment:
    lineage:
      - datalake_inspection_services_clean.appointment.id_external_appointment
      - datalake_ebdb_clean.booking.id
    description: Identification key for scheduling the inspection on the main.
  id_inspection:
    lineage:
      - datalake_inspection_services_clean.appointment.id_inspection
    description: Inspection identification key in IS.
  id_inspector:
    lineage:
      - datalake_inspection_services_clean.appointment.id_inspector
    description: Inspector identification key in IS.
  id_user_who_created:
    lineage:
      - datalake_ebdb_clean.visit_status_log.id_author_user
      - datalake_ebdb_clean.booking.id_attendant
      - datalake_ebdb_clean.booking_status_change.id_user
      - datalake_schedules_clean.appointment_history.id_updated_by_reference
    description: Identification key of the user who created the schedule.
  id_user_who_canceled:
    lineage:
      - datalake_schedules_clean.appointment_history.id_updated_by_reference
      - datalake_ebdb_clean.user_revision_entity.id_user
    description: Identification key of the user who canceled the appointment.
  type:
    lineage:
      - datalake_schedules_clean.appointment.type
      - datalake_ebdb_clean.booking.type
    description: Descriptive information indicating the status of the inspection schedule.
  status:
    lineage:
      - datalake_inspection_services_clean.appointment.status
      - datalake_ebdb_clean.booking.status
    description: Descriptive information indicating the status of the inspection schedule.
  status_made_by:
    lineage:
      - datalake_schedules_clean.appointment_history.category_name
    description: |
      Descriptive information indicating who is responsible for the status in question.
      In the case of a cancelled inspection, this column indicates who cancelled it.
  status_description:
    lineage:
      - datalake_schedules_clean.appointment_history.category_description
    description: Descriptive information detailing the category_name field.
  cancellation_reason:
    lineage:
      - datalake_inspection_services_clean.appointment.cancellation_reason
      - datalake_ebdb_clean.booking.cancellation_reason
    description: Descriptive information indicating the reason for canceling the inspection appointment.
  observation:
    lineage:
      - datalake_inspection_services_clean.appointment.observation
    description: Descriptive information about the observation left when scheduling the inspection.
  source:
    description: Descriptive information indicating the source of the scheduling record.
  slot_of_day:
    lineage:
      - datalake_schedules_clean.appointment.slot_of_day
    description: Integer type information indicating in which inspector slot the appointment was made.
  duration_in_slots:
    lineage:
      - datalake_schedules_clean.appointment.duration_in_slots
    description: Integer information indicating how long the surveyor's appointment was scheduled.
  is_fixed_agent:
    lineage:
      - datalake_inspection_services_clean.appointment.is_fixed_agent
    description: Boolean information indicating whether the surveyor is fixed.
  is_confirmed:
    lineage:
      - datalake_schedules_clean.appointment.is_confirmed
    description: Boolean information indicating whether the appointment was confirmed.
  is_first_schedule:
    description: Boolean information indicating whether this is the first appointment for the contract.
  is_first_schedule_auto:
    description: Boolean information indicating whether the appointment is the first automatic appointment made.
  is_d0_canceled:
    description: Boolean information indicating whether the appointment was cancelled on the same day.
  is_d1_canceled:
    description: Boolean information indicating whether the appointment was cancelled the following day.
  is_not_canceled_by_inspector:
    description: Boolean information indicating whether the appointment was cancelled by the inspector.
  ts_appointment_inspected_utc:
    lineage:
      - datalake_inspection_services_clean.appointment.dt_scheduled
      - datalake_ebdb_clean.booking.ts_booking_utc
      - datalake_schedules_clean.appointment.slot_of_day
      - datalake_ebdb_clean.booking.slot_day
    description: Timestamp (UTC) information indicating the date and time the inspection was carried out.
  ts_appointment_inspected_local_tz:
    lineage:
      - datalake_inspection_services_clean.appointment.dt_scheduled
      - datalake_ebdb_clean.booking.ts_booking_utc
    description: Timestamp (Local Timezone) information indicating the date and time the inspection was carried out.
  ts_appointment_created_utc:
    lineage:
      - datalake_inspection_services_clean.appointment.ts_created
      - datalake_ebdb_clean.booking.ts_created
    description: Timestamp(UTC) information indicating when the inspection schedule was created.
  ts_appointment_updated_utc:
    lineage:
      - datalake_inspection_services_clean.appointment.ts_updated
      - datalake_ebdb_clean.booking.ts_updated
    description: Timestamp (UTC) information indicating when the inspection schedule was updated.
  ts_appointment_created_local_tz:
    lineage:
      - datalake_inspection_services_clean.appointment.ts_created
      - datalake_ebdb_clean.booking.ts_created_local_tz
    description: Timestamp (Local Timezone) information indicating when the inspection schedule was created.
  ts_appointment_updated_local_tz:
    lineage:
      - datalake_inspection_services_clean.appointment.ts_updated
      - datalake_ebdb_clean.booking.ts_updated
    description: Timestamp (Local Timezone) information indicating when the inspection schedule was updated.
  ts_first_appointment_cancelled_utc:
    lineage:
      - datalake_inspection_services_clean.appointment.ts_updated
      - datalake_ebdb_clean.booking.ts_first_canceled_unevaluated
    description: Timestamp (UTC) information indicating when the inspection schedule was cancelled.
  ts_first_appointment_cancelled_local_tz:
    lineage:
      - datalake_inspection_services_clean.appointment.ts_updated
      - datalake_ebdb_clean.booking.ts_first_canceled_unevaluated_local_tz
    description: Timestamp (Local Timezone) information indicating when the inspection schedule was cancelled.
  year:
    lineage:
      - datalake_inspection_services_clean.appointment.ts_updated
    description: Year referring to date of update.
  month:
    lineage:
      - datalake_inspection_services_clean.appointment.ts_updated
    description: Month referring to date of update.
  day:
    lineage:
      - datalake_inspection_services_clean.appointment.ts_updated
    description: Day referring to date of update.
