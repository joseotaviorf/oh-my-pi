---
database_name: datalake_inspections
table_name: item_review
description: After the inspection, the tenant and the property owner can review the report and contest the result given by the inspector.
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  id_item:
    description: Item unique identifier.
    lineage:
      - datalake_inspection_services_clean.review.id_item
  id_review:
    description: Review unique identifier.
    lineage:
      - datalake_inspection_services_clean.review.id_review
  id_review_media:
    description: Review Media unique identifier.
    lineage:
      - datalake_inspection_services_clean.review_media.id_review_media
  id_external_media:
    description: Review media unique identifier in Main monolith.
    lineage:
      - datalake_inspection_services_clean.review_media.id_main
  id_user:
    lineage:
      - datalake_inspection_services_clean.review.id_user
    description: Reviewer user unique identifier (number). This field is legacy,
      meaning it is no longer updated. The column that currently contains this
      information is id_reviewer.
  id_reviewer:
    lineage:
      - datalake_inspection_services_clean.review.id_reviewer
    description: Reviewer unique identifier (number)
  id_assessment:
    description: Unique identifier of an Assessment.
      This identifier must be unique per inspection, however, for dates prior to August 19, 2023, there is residual data in a product bug.
      This bug erroneously created more than one Assessment per survey. Therefore, for these cases, the id_inspection will not be unique.
      It is observed that the extra Assessments are identical, with no data distinction between them.
    lineage:
      - datalake_inspections.item.id_assessment
  id_inspection:
    description: Inspection unique identifier.
    lineage:
      - datalake_inspections.item.id_inspection
  uuid:
    description: Item Media unique identifier (uuid)
    lineage:
      - datalake_inspection_services_clean.review_media.uuid
  user_type:
    description: Indicates whether the user who reviewed was the tenant or owner.
    lineage:
      - datalake_inspection_services_clean.review.user_type
  user_comment:
    description: Displays a reviewer user comment
    lineage:
      - datalake_inspection_services_clean.review.comment
  media_type:
    description: Indicates whether the media is a photo or a video.
    lineage:
      - datalake_inspection_services_clean.review_media.type
  media_path:
    description: Path of the photo in the inspection image bucket.
    lineage:
      - datalake_inspection_services_clean.review_media.path
  ts_media_created:
    description: Media creation date and time.
    lineage:
      - datalake_inspection_services_clean.review_media.ts_created
  ts_media_updated:
    description: Media update date and time.
    lineage:
      - datalake_inspection_services_clean.review_media.ts_updated
  ts_created:
    description: Creation date and time.
    lineage:
      - datalake_inspection_services_clean.review.ts_created
  ts_updated:
    description: Update date and time.
    lineage:
      - datalake_inspection_services_clean.review.ts_updated
  year:
    description: Year referring to date of update.
    lineage:
      - datalake_inspection_services_clean.review.year
  month:
    description: Month referring to date of update.
    lineage:
      - datalake_inspection_services_clean.review.month
  day:
    description: Day referring to date of update.
    lineage:
      - datalake_inspection_services_clean.review.day
