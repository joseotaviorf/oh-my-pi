---
database_name: datalake_inspections
table_name: inspection_booking
description: |
  This table brings data from each inspection scheduled through the
  Inspection Service and historical data from the PWA.
  The granularity of the table is given by the id_inspection, which will be unique.
  This is just not true for data prior to August 19, 2023, because of a bug in the product
  (read the description of the id_assessment column for more details).
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  id_inspection:
    description:
      Unique id to identify a inspection. If its origin is the Inspection Service
      (IS), the ID will correspond to the ID generated in the product. If the inspection
      source is still the PWA, the ID will correspond to the ID generated by the MD5 function.
    lineage:
      - datalake_inspections_clean.inspection_aud.id_inspection
  id_previous_inspection:
    description:
      If there is a previous inspection for the same contract, it will be indicated
      in this column. It is usually completed in offboarding inspections, bringing the identification
      of the onboarding or dispute inspection.
    lineage:
      - datalake_inspections_clean.inspection_aud.id_previous_inspection
  id_external:
    description: Inspection correlational unique identifier in the PWA database.
    lineage:
      - datalake_inspections_clean.inspection_aud.id_external
      - datalake_inspections.main_inspection_booking.id
  id_assessment:
    description: Unique identifier of an Assessment.
      This identifier must be unique per inspection, however, for dates prior to August 19, 2023, there is residual data in a product bug.
      This bug erroneously created more than one Assessment per survey. Therefore, for these cases, the id_inspection will not be unique.
      It is observed that the extra Assessments are identical, with no data distinction between them.
    lineage:
      - datalake_inspections_clean.assessment.id_assessment
  id_booking:
    description: Unique identifier of the inspection date and time schedule.
    lineage:
      - datalake_inspections_clean.inspection_aud.id_schedule
      - datalake_inspections.main_inspection_booking.id_booking
  id_contract:
    description: Unique identifier of the contract related to the property to be inspected.
    lineage:
      - datalake_inspections_clean.inspection_aud.id_contract
      - datalake_inspections.main_inspection_booking.id_contract
  id_client_side:
    lineage:
      - datalake_inspections_clean.inspection_aud.id_client_side
    description: Inspection unique identifier (uuid)
  id_house:
    description: Unique identifier of the related house to be inspected.
    lineage:
      - datalake_inspections_clean.inspection_aud.house
  id_inspector:
    description: Unique identifier of the inspector responsible for carrying out the inspection.
    lineage:
      - datalake_inspections_clean.inspection_aud.id_inspector
  id_country:
    description: Unique identifier of country.
    lineage:
      - datalake_booking.booking.id_country
      - datalake_region.region.id_country
  id_city:
    description: Unique identifier of city.
    lineage:
      - datalake_region.region.id_city
      - datalake_inspections_clean.inspection_aud.house
  city_name:
    description: Name of the city where the property is located.
    lineage:
      - datalake_region.region.city_name
      - datalake_inspections_clean.inspection_aud.house
  country_code:
    description: Identification code of the country where the property is located.
    lineage:
      - datalake_inspections_clean.inspection_aud.house
      - datalake_booking.booking.country_code
      - datalake_region.region.country_code
  country_default_timezone:
    description: The country's default timezone.
    lineage:
      - datalake_ebdb_clean.country.default_timezone
  inspection_type:
    description: The type of inspection.
    categories:
      onboarding: Inspection carried out before the tenant enters the property, to certify the conditions of the house
      verification: Inspection carried out when there is any relevant change in the property, such as the creation of rooms, for example
      offboarding: Inspection carried out after the tenant leaves the property, to certify the conditions of the house
    lineage:
      - datalake_inspections_clean.inspection_aud.type
      - datalake_inspections.main_inspection_booking.type
  booking_type:
    description: What type of booking is Inspection or Quarterly Inspection
    lineage:
      - datalake_booking.booking.type
  source:
    description: Since the table merges two data sources, this column indicates where the inspection is coming from.
    categories:
      IS: The source of information is the Inspection Service.
      PWA: The source of information is the PWA.
  assessment_source:
    description: Identifies which application the inspector used to perform the inspection.
    categories:
      INSPETOR_BUGIGANGA: The inspection was carried out through the PWA.
      INSPECTORS_FLUTTER: The inspection was carried out through the Inspection Service.
    lineage:
      - datalake_inspections_clean.assessment.source
  status:
    description: Identifies the stage of the inspection from scheduling to review.
    categories:
      scheduled: Inspection scheduled and awaiting execution [onboarding/offboarding]
      cancelled: The inspection was canceled (see the appointment table for the reason)
      received: Inspection sent by the inspector, waiting for synchronization with the Main [offboarding]
      processing: Survey has been received and will be performed by the surveyor [onboarding]
      sent_to_review: Indicates that the owner and tenant are able to do their reviews [onboarding]
      review_started: When the owner or/and the tenant makes a comment [onboarding]
      sent_to_analysis: Inspection available for operations team interventions [discontinued] [offboarding]
      sent_to_repair_analysis: The inspection was sent to the analysis team to identify the need for repairs to the house [offboarding]
      sent_to_owner_review: c [offboarding]
      review_started_by_owner: Survey whose owner has already done some intervention [offboarding]
      sent_to_tenant_review: Survey available for tenant review [offboarding]
      review_started_by_tenant: Survey whose tenant has already done some intervention [offboarding]
      sent_to_contestation_analysis: The inspection was sent to the analysis team, to evaluate the PP/IQ contestation [offboarding]
      budget_approval: Mediation stage for budget approval
      reviewed: |
        offboarding: Survey sent to the Operations team to validate interventions proposed by owner/tenant
        onboarding: When the review deadline is reached
      EmAcordo: "Discontinued status, coming from the PWA data, so it's not part of the Inspection Service data flow, it's just historical data"
      ContratoCancelado: "Discontinued status, coming from the PWA data, so it's not part of the Inspection Service data flow, it's just historical data"
      Nova: "Discontinued status, coming from the PWA data, so it's not part of the Inspection Service data flow, it's just historical data"
      Finalizada: "Discontinued status, coming from the PWA data, so it's not part of the Inspection Service data flow, it's just historical data"
      Comentada: "Discontinued status, coming from the PWA data, so it's not part of the Inspection Service data flow, it's just historical data"
    lineage:
      - datalake_inspections_clean.inspection_aud.status
      - datalake_inspections.main_inspection_booking.status
  total_tentant_repair_ar:
    description: Total repairs with tenant's responsibility in repair analysis.
  repairs_added_by_owner_review:
    description: Total repairs added by owner for review.
  repairs_exempted_by_owner_review:
    description: Total repairs exempted by the owner in the review.
  total_tentant_repair_review:
    description: Total repairs under tenant's responsibility under review.
  repairs_exempted_ac:
    description: Total repairs exempted in the contestation analysis.
  repairs_absorbed_ac:
    description: Total repairs absorbed in the contestation analysis.
  total_tentant_repair_ac:
    description: Total repairs are the tenant's responsibility in the contestation analysis.
  has_owner_accompanying:
    description: Indicates whether the owner accompanied the inspector during the inspection.
  is_first_schedule:
    description: Indicates whether scheduling the inspection is the first in the process.
  is_executed_in_first_schedule:
    description: Indicates whether the inspection took place in the first scheduled time.
  is_d0_canceled:
    description: Indicates that the inspection was canceled by the inspector on the scheduled day.
  is_d1_canceled:
    description: Indicates that the inspection was canceled by the inspector the day before the scheduled.
  is_not_canceled_by_inspector:
    description: Indicates that the inspection was not canceled because of the inspector.
  dt_contract_entrance:
    description: Date defined in the contract of when the tenant will enter in the property.
    lineage:
      - datalake_ebdb_contract.contract.dt_entered
  dt_contract_termination:
    description: Contract termination date.
    lineage:
      - datalake_terminator_clean.termination.dt_termination
  dt_execution_limit:
    description: Deadline for carrying out the inspection within the expected SLA.
    lineage:
      - datalake_ebdb_contract.contract.dt_entered
      - datalake_terminator_clean.termination.dt_termination
  ts_booking_inspected_utc:
    description: Scheduled date and time (UTC).
    lineage:
      - datalake_booking.booking.ts_booking_utc
      - datalake_inspections_clean.appointment.dt_scheduled
  ts_booking_inspected_local_tz:
    description: Scheduled date and time in your region's local time.
    lineage:
      - datalake_booking.booking.ts_booking_local_tz
      - datalake_inspections_clean.appointment.dt_scheduled
  ts_booking_created_utc:
    description: Datetime of the booking creation (UTC).
    lineage:
      - datalake_booking.booking.ts_created
      - datalake_inspections_clean.appointment.ts_created
  ts_booking_created_local_tz:
    description: Datetime of the booking creation in your region's local time.
    lineage:
      - datalake_booking.booking.ts_created_local_tz
      - datalake_inspections_clean.appointment.ts_created
  ts_booking_cancelled_utc:
    description: Schedule cancellation date and time (UTC).
    lineage:
      - datalake_booking.booking.ts_first_canceled_unevaluated
      - datalake_inspections_clean.appointment.ts_updated
  ts_booking_cancelled_local_tz:
    description: Schedule cancellation date and time in local time for the region.
    lineage:
      - datalake_booking.booking.ts_first_canceled_unevaluated_local_tz
      - datalake_inspections_clean.appointment.ts_updated
  ts_termination_canceled:
    description: Date and time when the termination of the contract was canceled.
    lineage:
      - datalake_terminator_clean.termination.ts_canceled
  ts_execution_started_local_tz:
    description: This column should display the time when the inspector started to perform the inspection. In local time for the region.
    lineage:
      - datalake_inspections_clean.assessment.ts_started
  ts_execution_finished_local_tz:
    description: This column should display the time when the inspector finished carrying out the inspection. In local time for the region.
    lineage:
      - datalake_inspections_clean.assessment.ts_finished
  ts_inspected:
    description: Date and time the inspection was performed.
    lineage:
      - datalake_inspections_clean.assessment.ts_finished
      - datalake_inspections.main_inspection_booking.dt_inspected
  ts_synced:
    description: Date and time of the first synchronization of the inspection in the application.
    lineage:
      - datalake_inspections_clean.assessment.ts_created
      - datalake_inspections.main_inspection_booking.ts_last_synced
  ts_created:
    description: Timestamp of when the inspection request was synchronized in the database product.
    lineage:
      - datalake_inspections_clean.inspection_aud.ts_created
      - datalake_inspections.main_inspection_booking.ts_created
  ts_updated:
    description: Timestamp of when the inspection request was updated in the database product.
    lineage:
      - datalake_inspections_clean.inspection_aud.ts_updated
      - datalake_inspections.main_inspection_booking.ts_updated
