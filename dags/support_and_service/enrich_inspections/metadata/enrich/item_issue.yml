---
database_name: datalake_inspections
table_name: item_issue
description: Brings the sub problems that an item presents.
domain: Support and Services
owner: data-ae-ss@quintoandar.com.br
columns:
  id_item_issue:
    description: Item Issue unique identifier.
    lineage:
      - datalake_inspection_services_clean.item_issue.id_item_issue
  id_issue_type:
    description: Issue Type unique identifier.
    lineage:
      - datalake_inspection_services_clean.issue_type.id_issue_type
  id_item:
    description: Item unique identifier.
    lineage:
      - datalake_inspection_services_clean.item_issue.id_item
  id_room:
    description: Room unique identifier.
    lineage:
      - datalake_inspections.item.id_room
  id_assessment:
    description: Unique identifier of an Assessment.
      This identifier must be unique per inspection, however, for dates prior to August 19, 2023, there is residual data in a product bug.
      This bug erroneously created more than one Assessment per survey. Therefore, for these cases, the id_inspection will not be unique.
      It is observed that the extra Assessments are identical, with no data distinction between them.
    lineage:
      - datalake_inspections.item.id_assessment
  id_inspection:
    description: Inspection unique identifier.
    lineage:
      - datalake_inspections.item.id_inspection
  uuid:
    description: Inspection unique identifier (uuid).
    lineage:
      - datalake_inspection_services_clean.item_issue.uuid
  issue_type:
    description: Specify the sub-type problem.
    lineage:
      - datalake_inspection_services_clean.issue_type.type
  display_type:
    description: Shows the component that renders this type of problem.
    categories:
      COUNTER: Registers the number of parts with problems.
      OPTION_DESCRIPTION: Chipchoice with comment option.
      CHECK_DESCRIPTION: Checklist option with description.
      CHECK: Checklist option.
      OVERVIEW: Displays the overview of the item.
      CHIP_CHOICE_SINGLE: Chipchoice with single select option.
      OVERVIEW_WITH_CONDITIONS: Overview with option to record conditions.
      DEFAULT: Overview with comment option.
    lineage:
      - datalake_inspections.item.display_type
  item_group_name:
    description: Description of the item group, for example floor, paint, lighting, etc. (typed by inspector)
    lineage:
      - datalake_inspections.item.item_group_name
  item_group_type:
    description: Name of the object evaluated in the inspection.
    lineage:
      - datalake_inspections.item.item_group_type
  room_name:
    description: Descriptive name of the room (typed by inspector).
    lineage:
      - datalake_inspections.item.room_name
  item_comment:
    description: Displays a inspector's comment.
    lineage:
      - datalake_inspections.item.comment
  issue_comment:
    description: Displays a inspector's comment.
    lineage:
      - datalake_inspection_services_clean.item_issue.comment
  repair_suggestion:
    description: This column would keep repair suggestions for presentation in the report, but this functionality was not integrated.
    lineage:
      - datalake_inspection_services_clean.issue_type.repair_suggestion
  ts_created:
    description: Creation date and time.
    lineage:
      - datalake_inspection_services_clean.item_issue.ts_created
  ts_updated:
    description: Update date and time.
    lineage:
      - datalake_inspection_services_clean.item_issue.ts_updated
  year:
    description: Year referring to date of update.
    lineage:
      - datalake_inspection_services_clean.item_issue.year
  month:
    description: Month referring to date of update.
    lineage:
      - datalake_inspection_services_clean.item_issue.month
  day:
    description: Day referring to date of update.
    lineage:
      - datalake_inspection_services_clean.item_issue.day
