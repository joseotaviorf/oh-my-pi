dag:
  name: enrich_crm_tasks
  schedule_start_date: 2020, 8, 29
  owner: Data SS
  documentation:
    dag_purpose: Creates CRM (Customer Relationship Management) enrich tasks (migrated tables from bi-crm-tasks).
workflow:
  type: query_delta
  layer: enrich
cluster:
  type: databricks_13_3_med_mem_driver_min_memory_2_nodes_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
