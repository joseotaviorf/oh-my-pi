---
database_name: datalake_inspection_services_clean
table_name: assessment_aud
description:
  It deals with data on when and how the inspection of the property took place.
  An Assessment must be unique per inspection, however for dates before August 19, 2023 there is residual data of a product bug.
  This bug erroneously created more than one Assessment per inspection. Therefore, for these cases, the Assessment will not be unique per inspection.
  It is observed that the extra Assessments are identical, with no data distinction between them.
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  id_assessment:
    lineage:
      - datalake_inspection_services_raw.assessment_aud.id
    description: Assessment unique identifier.
      This identifier must be unique per inspection, however, for dates prior to August 19, 2023, there is residual data in a product bug.
      This bug erroneously created more than one Assessment per survey. Therefore, for these cases, the id_inspection will not be unique.
      It is observed that the extra Assessments are identical, with no data distinction between them.
  id_inspection:
    lineage:
      - datalake_inspection_services_raw.assessment_aud.inspection_id
    description: Inspection unique identifier
  id_previous_assessment:
    lineage:
      - datalake_inspection_services_raw.assessment_aud.previous_assessment_id
    description:
      If there was any previous assessment for the same contract, it will
      be indicated in this column. Usually references an assessment from an onboarding
      or contestation inspection.
  key_location:
    lineage:
      - datalake_inspection_services_raw.assessment_aud.key_location
    description: Where or with whom is the key after assessment of the property
  key_location_details:
    lineage:
      - datalake_inspection_services_raw.assessment_aud.key_location_details
    description:
      If the key_location column is filled in as 'other', the inspector
      must describe the location and this information is saved in this column.
  source:
    lineage:
      - datalake_inspection_services_raw.assessment_aud.source
    description:
      Identifies whether the inspection source was the PWA or was created
      directly in the new application. If it is from the PWA, it will be filled in
      as INSPETOR_BUGIGANGA, if it is from the new app, it will be filled in as INSPECTORS_FLUTTER.
  house_supplies:
    lineage:
      - datalake_inspection_services_raw.assessment_aud.house_supplies
    description:
      Indicates the operating condition of the water, gas and electricity
      supply. However, this field is no longer populated in the database, serving
      only for historical consultation.
  scheduling_key_recovery:
    lineage:
      - datalake_inspection_services_raw.assessment_aud.scheduling_key_recovery
    description:
      Indicates the place where the keys were left after the inspection
      was carried out
  key_information:
    lineage:
      - datalake_inspection_services_raw.assessment_aud.key_information
    description: JSON type information indicating the reason for changing the key location.
  rev:
    lineage:
      - datalake_inspection_services_raw.assessment_aud.rev
    description: Foreign key of the RevInfo table, which indicates when the record was changed
  revtype:
    lineage:
      - datalake_inspection_services_raw.assessment_aud.revtype
    description: Indicates whether the line refers to an inclusion, alteration or deletion.
    categories:
      "0": Inclusion operation.
      "1": Alteration operation.
      "2": Deletion operation.
  revend:
    lineage:
      - datalake_inspection_services_raw.assessment_aud.revend
    description: Number of the next revision of this id.
  mod_id_previous_assessment:
    lineage:
      - datalake_inspection_services_raw.assessment_aud.previous_assessment_id_mod
    description: Indicates if the id_previous_assessment field has been changed
  mod_inspection:
    lineage:
      - datalake_inspection_services_raw.assessment_aud.inspection_mod
    description: Indicates if the inspection field has been changed
  mod_key_location:
    lineage:
      - datalake_inspection_services_raw.assessment_aud.key_location_mod
    description: Indicates if the key_location field has been changed
  mod_key_location_details:
    lineage:
      - datalake_inspection_services_raw.assessment_aud.key_location_details_mod
    description: Indicates if the key_location_details field has been changed
  mod_rooms:
    lineage:
      - datalake_inspection_services_raw.assessment_aud.rooms_mod
    description: Indicates if the rooms field has been changed
  mod_source:
    lineage:
      - datalake_inspection_services_raw.assessment_aud.source_mod
    description: Indicates if the source field has been changed
  mod_house_supplies:
    lineage:
      - datalake_inspection_services_raw.assessment_aud.house_supplies_mod
    description: Indicates if the house_supplies field has been changed
  mod_scheduling_key_recovery:
    lineage:
      - datalake_inspection_services_raw.assessment_aud.scheduling_key_recovery_mod
    description: Indicates if the scheduling_key_recovery field has been changed
  mod_reviewers:
    lineage:
      - datalake_inspection_services_raw.assessment_aud.reviewers_mod
    description: Indicates if the reviewers field has been changed
  mod_key_information:
    lineage:
      - datalake_inspection_services_raw.assessment_aud.key_information_mod
    description: Indicates if the key_information field has been changed
  mod_ts_created:
    lineage:
      - datalake_inspection_services_raw.assessment_aud.created_at_mod
    description: Indicates if the ts_created field has been changed
  mod_ts_updated:
    lineage:
      - datalake_inspection_services_raw.assessment_aud.updated_at_mod
    description: Indicates if the ts_updated field has been changed
  mod_ts_started:
    lineage:
      - datalake_inspection_services_raw.assessment_aud.started_at_mod
    description: Indicates if the ts_started field has been changed
  mod_ts_finished:
    lineage:
      - datalake_inspection_services_raw.assessment_aud.finished_at_mod
    description: Indicates if the ts_finished field has been changed
  mod_dt_tenant_limit_revision:
    lineage:
      - datalake_inspection_services_raw.assessment_aud.tenant_limit_revision_date_mod
    description: Indicates if the dt_tenant_limit_revision field has been changed
  mod_dt_limit_budget_approval:
    lineage:
      - datalake_inspection_services_raw.assessment_aud.limit_budget_approval_date_mod
    description: Indicates if the dt_limit_budget_approval field has been changed
  mod_dt_owner_limit_revision:
    lineage:
      - datalake_inspection_services_raw.assessment_aud.owner_limit_revision_date_mod
    description: Indicates if the dt_owner_limit_revision field has been changed
  dt_owner_limit_revision:
    lineage:
      - datalake_inspection_services_raw.assessment_aud.owner_limit_revision_date
    description:
      Indicates the deadline for the owner to conclude its review of the report.
      After this date, completion is compulsory.
  dt_tenant_limit_revision:
    lineage:
      - datalake_inspection_services_raw.assessment_aud.tenant_limit_revision_date
    description:
      Indicates the deadline for tenant to complete its review of the report.
      After this date, completion is compulsory.
  ts_created:
    lineage:
      - datalake_inspection_services_raw.assessment_aud.created_at
    description: Assessment creation date
  ts_finished:
    lineage:
      - datalake_inspection_services_raw.assessment_aud.finished_at
    description:
      This column should display the time when the inspector finished carrying
      out the inspection (local timezone).
  ts_started:
    lineage:
      - datalake_inspection_services_raw.assessment_aud.started_at
    description:
      This column should display the time when the inspector started to
      perform the inspection (local timezone).
  ts_updated:
    lineage:
      - datalake_inspection_services_raw.assessment_aud.updated_at
    description: Assessment update date
  dt_limit_budget_approval:
    lineage:
      - datalake_inspection_services_raw.assessment_aud.limit_budget_approval_date
    description: Deadline for budget approval.
  year:
    lineage:
      - datalake_inspection_services_raw.assessment_aud.year
    description: Year of update date.
  month:
    lineage:
      - datalake_inspection_services_raw.assessment_aud.month
    description: Month of update date.
  day:
    lineage:
      - datalake_inspection_services_raw.assessment_aud.day
    description: Day of update date.
