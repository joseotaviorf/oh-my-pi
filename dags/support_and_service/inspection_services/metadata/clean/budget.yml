---
database_name: datalake_inspections_clean
table_name: budget
description: This table aims to store data from the budget approval context, each row in the table must have a budget ID.
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  id_budget:
    lineage:
      - datalake_inspections_raw.budget.id
    description: Unique identification key for the budget approval process.
  id_inspection:
    lineage:
      - datalake_inspections_raw.budget.inspection_id
    description: Inspection identification key in the budget approval process.
  uuid:
    lineage:
      - datalake_inspections_raw.budget.uuid
    description: Unique identifier (UUID) of the budget generated in the Product Database.
  owner_approval_comment:
    lineage:
      - datalake_inspections_raw.budget.owner_approval_comment
    description: Descriptive information indicating the owner's approval comment.
  tenant_approval_comment:
    lineage:
      - datalake_inspections_raw.budget.tenant_approval_comment
    description: Descriptive information indicating the tenant's approval comment.
  owner_approval_reason:
    lineage:
      - datalake_inspections_raw.budget.owner_approval_reason
    description: Descriptive information indicating the reason for the owner's approval.
  tenant_approval_reason:
    lineage:
      - datalake_inspections_raw.budget.tenant_approval_reason
    description: Descriptive information indicating the reason for the tenant's approval.
  owner_approved_by:
    lineage:
      - datalake_inspections_raw.budget.owner_approved_by
    description: Float type information indicating the value approved by the owner.
  tenant_approved_by:
    lineage:
      - datalake_inspections_raw.budget.tenant_approved_by
    description: Float type information indicating the value approved by the tenant.
  owner_approved:
    lineage:
      - datalake_inspections_raw.budget.owner_approved
    description: Boolean information indicating whether the owner approved the budget.
  tenant_approved:
    lineage:
      - datalake_inspections_raw.budget.tenant_approved
    description: Boolean information indicating whether the tenant approved the budget.
  total_cost:
    lineage:
      - datalake_inspections_raw.budget.total_cost
    description: Float type information that indicates the budget value.
  owner_amount_payment:
    lineage:
      - datalake_inspections_raw.budget.owner_amount_payment
    description: Float type information indicating the owner's payment amount.
  tenant_amount_payment:
    lineage:
      - datalake_inspections_raw.budget.tenant_amount_payment
    description: Float type information indicating the tenant's payment amount.
  dt_owner_approved:
    lineage:
      - datalake_inspections_raw.budget.owner_approved_date
    description: Date-type information indicating the date the owner approved the budget.
  dt_tenant_approved:
    lineage:
      - datalake_inspections_raw.budget.tenant_approved_date
    description: Date-type information indicating the date the tenant approved the budget.
  dt_owner_dead_line:
    lineage:
      - datalake_inspections_raw.budget.owner_deadline_date
    description: Date information indicating the deadline for budget approval.
  dt_tenant_dead_line:
    lineage:
      - datalake_inspections_raw.budget.tenant_deadline_date
    description: Date information indicating the deadline for budget approval.
  ts_created:
    lineage:
      - datalake_inspections_raw.budget.created_at
    description: Timestamp information indicating when the budget was created.
  ts_updated:
    lineage:
      - datalake_inspections_raw.budget.updated_at
    description: Timestamp information indicating when the budget was updated.
  year:
    lineage:
      - datalake_inspections_raw.budget.year
    description: Year of update date.
  month:
    lineage:
      - datalake_inspections_raw.budget.month
    description: Month of update date.
  day:
    lineage:
      - datalake_inspections_raw.budget.day
    description: Day of update date.
