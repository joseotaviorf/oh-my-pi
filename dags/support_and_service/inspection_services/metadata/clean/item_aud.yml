---
database_name: datalake_inspection_services_clean
table_name: item_aud
description:
  The item object found in the database refers to a sub-item or sub-conditions within an item,
  for example breakdowns, humidity, door problem, etc.
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  id_item:
    lineage:
      - datalake_inspection_services_raw.item_aud.id
    description: Item unique identifier (number)
  id_item_group:
    lineage:
      - datalake_inspection_services_raw.item_aud.item_group_id
    description: Item Group unique identifier (number)
  id_previous_item:
    lineage:
      - datalake_inspection_services_raw.item_aud.previous_item_id
    description:
      If there is a previous evaluation for the item in the same contract,
      it will be indicated in this column. It is usually completed in offboarding
      inspections, bringing information from the onboarding or dispute inspection.
  id_type:
    lineage:
      - datalake_inspection_services_raw.item_aud.type_id
    description: Indicates the type of problem
  id_main:
    lineage:
      - datalake_inspection_services_raw.item_aud.main_id
    description: Item correlational unique identifier in the PWA database
  uuid:
    lineage:
      - datalake_inspection_services_raw.item_aud.uuid
    description: Item unique identifier (uuid)
  comment:
    lineage:
      - datalake_inspection_services_raw.item_aud.comment
    description: Displays a inspector's comment
  count:
    lineage:
      - datalake_inspection_services_raw.item_aud.count
    description: Indicates the number of parts with problems
  status:
    lineage:
      - datalake_inspection_services_raw.item_aud.status
    description: " "
  is_present:
    lineage:
      - datalake_inspection_services_raw.item_aud.present
    description: Indicates if the issue checklist item was checked by the inspector
  is_active:
    lineage:
      - datalake_inspection_services_raw.item_aud.active
    description: Boolean information with the aim of indicating whether the item is active or not.
  rev:
    lineage:
      - datalake_inspection_services_raw.item_aud.rev
    description: Foreign key of the RevInfo table, which indicates when the record was changed
  revtype:
    lineage:
      - datalake_inspection_services_raw.item_aud.revtype
    description: Indicates whether the line refers to an inclusion, alteration or deletion.
    categories:
      "0": Inclusion operation.
      "1": Alteration operation.
      "2": Deletion operation.
  revend:
    lineage:
      - datalake_inspection_services_raw.item_aud.revend
    description: Number of the next revision of this id.
