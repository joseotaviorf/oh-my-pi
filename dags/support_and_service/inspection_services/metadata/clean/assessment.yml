---
database_name: datalake_inspection_services_clean
table_name: assessment
description:
  It deals with data on when and how the inspection of the property took place.
  An Assessment must be unique per inspection, however for dates before August 19, 2023 there is residual data of a product bug.
  This bug erroneously created more than one Assessment per inspection. Therefore, for these cases, the Assessment will not be unique per inspection.
  It is observed that the extra Assessments are identical, with no data distinction between them.
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  id_assessment:
    lineage:
      - datalake_inspection_services_raw.assessment.id
    description: Assessment unique identifier.
      This identifier must be unique per inspection, however, for dates prior to August 19, 2023, there is residual data in a product bug.
      This bug erroneously created more than one Assessment per survey. Therefore, for these cases, the id_inspection will not be unique.
      It is observed that the extra Assessments are identical, with no data distinction between them.
  id_inspection:
    lineage:
      - datalake_inspection_services_raw.assessment.inspection_id
    description: Inspection unique identifier
  id_previous_assessment:
    lineage:
      - datalake_inspection_services_raw.assessment.previous_assessment_id
    description:
      If there was any previous assessment for the same contract, it will
      be indicated in this column. Usually references an assessment from an onboarding
      or contestation inspection.
  key_location:
    lineage:
      - datalake_inspection_services_raw.assessment.key_location
    description: Where or with whom is the key after assessment of the property
  key_location_details:
    lineage:
      - datalake_inspection_services_raw.assessment.key_location_details
    description:
      If the key_location column is filled in as 'other', the inspector
      must describe the location and this information is saved in this column.
  source:
    lineage:
      - datalake_inspection_services_raw.assessment.source
    description:
      Identifies whether the inspection source was the PWA or was created
      directly in the new application. If it is from the PWA, it will be filled in
      as INSPETOR_BUGIGANGA, if it is from the new app, it will be filled in as INSPECTORS_FLUTTER.
  house_supplies:
    lineage:
      - datalake_inspection_services_raw.assessment.house_supplies
    description:
      Indicates the operating condition of the water, gas and electricity
      supply. However, this field is no longer populated in the database, serving
      only for historical consultation.
  scheduling_key_recovery:
    lineage:
      - datalake_inspection_services_raw.assessment.scheduling_key_recovery
    description:
      Indicates the place where the keys were left after the inspection
      was carried out
  dt_owner_limit_revision:
    lineage:
      - datalake_inspection_services_raw.assessment.owner_limit_revision_date
    description:
      Indicates the deadline for the owner to conclude its review of the report.
      After this date, completion is compulsory.
  dt_tenant_limit_revision:
    lineage:
      - datalake_inspection_services_raw.assessment.tenant_limit_revision_date
    description:
      Indicates the deadline for tenant to complete its review of the report.
      After this date, completion is compulsory.
  ts_created:
    lineage:
      - datalake_inspection_services_raw.assessment.created_at
    description: Assessment creation date
  ts_finished:
    lineage:
      - datalake_inspection_services_raw.assessment.finished_at
    description:
      This column should display the time when the inspector finished carrying
      out the inspection (local timezone).
  ts_started:
    lineage:
      - datalake_inspection_services_raw.assessment.started_at
    description:
      This column should display the time when the inspector started to
      perform the inspection (local timezone).
  ts_updated:
    lineage:
      - datalake_inspection_services_raw.assessment.updated_at
    description: Assessment update date
  year:
    lineage:
      - datalake_inspection_services_raw.assessment.year
    description: Year of update date.
  month:
    lineage:
      - datalake_inspection_services_raw.assessment.month
    description: Month of update date.
  day:
    lineage:
      - datalake_inspection_services_raw.assessment.day
    description: Day of update date.
