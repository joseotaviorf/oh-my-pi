database_name: datalake_braze_details
table_name: canvas_step_details
description: Step-level reference for Braze Canvas journeys across owner, tenant, and affiliate (Indica Aí) app groups. Each row is one Canvas step with its delivery channel, message configuration, next-step routing, and last sync timestamp from the Braze API clean layer.
domain: Support and Services
owner: gabriel.firmino@quintoandar.com.br
columns:
  id_canvas:
    lineage:
    - datalake_braze_details_clean.canvas_details_owners.id_canvas
    - datalake_braze_details_clean.canvas_details_tenants.id_canvas
    - datalake_braze_details_clean.canvas_details_indica_ai.id_canvas
    description: Braze Canvas identifier linking the step to its parent journey definition.
  canvas_name:
    lineage:
    - datalake_braze_details_clean.canvas_details_owners.canvas_name
    - datalake_braze_details_clean.canvas_details_tenants.canvas_name
    - datalake_braze_details_clean.canvas_details_indica_ai.canvas_name
    description: Display name of the Braze Canvas as configured in the Braze dashboard.
  id_step:
    lineage:
    - datalake_braze_details_clean.canvas_details_owners.step
    - datalake_braze_details_clean.canvas_details_tenants.step
    - datalake_braze_details_clean.canvas_details_indica_ai.step
    description: Braze Canvas step identifier from the exploded step definition.
  step_name:
    lineage:
    - datalake_braze_details_clean.canvas_details_owners.step
    - datalake_braze_details_clean.canvas_details_tenants.step
    - datalake_braze_details_clean.canvas_details_indica_ai.step
    description: Name of the individual step within the Canvas flow, extracted from the step definition JSON.
  step_channel:
    lineage:
    - datalake_braze_details_clean.canvas_details_owners.step
    - datalake_braze_details_clean.canvas_details_tenants.step
    - datalake_braze_details_clean.canvas_details_indica_ai.step
    description: Delivery channel configured for this Canvas step (for example email, push, in-app message, or webhook).
  step_message:
    lineage:
    - datalake_braze_details_clean.canvas_details_owners.step
    - datalake_braze_details_clean.canvas_details_tenants.step
    - datalake_braze_details_clean.canvas_details_indica_ai.step
    description: Serialized message payload and step configuration from Braze, including templates and webhook parameters.
  id_next_step:
    lineage:
    - datalake_braze_details_clean.canvas_details_owners.step
    - datalake_braze_details_clean.canvas_details_tenants.step
    - datalake_braze_details_clean.canvas_details_indica_ai.step
    description: Identifier of the next Canvas step executed after this step completes, when the journey branches or continues sequentially.
  ts_updated:
    lineage:
    - datalake_braze_details_clean.canvas_details_owners.ts_updated
    - datalake_braze_details_clean.canvas_details_tenants.ts_updated
    - datalake_braze_details_clean.canvas_details_indica_ai.ts_updated
    description: Timestamp when Braze last updated this Canvas step definition in the source API extract.
  app_group:
    description: Braze app group that owns the Canvas definition (OWNERS for landlords, TENANTS for renters, or AFFILIATES for the Indica Aí referral program).
  year:
    description: Partition column, year of the data update.
  month:
    description: Partition column, month of the data update.
  day:
    description: Partition column, day of the data update.
