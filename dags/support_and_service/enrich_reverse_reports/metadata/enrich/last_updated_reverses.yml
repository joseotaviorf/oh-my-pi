---
database_name: datalake_reverse_reports
table_name: last_updated_reverses
owner: gabriel.firmino@quintoandar.com.br
domain: Data S&S
description: Enrichment table with the aim of obtaining information about the execution of reverse dags, the granularity of this 
  table follows the "table_name" column. The data is generated in the reverse layer, right after sending.
columns:
  reverse_context:
    description: Descriptive data that indicates which reverse the information came from.
  table_name:
    lineage:
      - reverse_atento.atento_execution_tracking.table_name
      - reverse_webhelp.webhelp_execution_tracking.table_name
    description: Name of the table sent by the reverse process.
  ts_last_modified:
    lineage:
      - reverse_atento.atento_execution_tracking.ts_last_modified
      - reverse_webhelp.webhelp_execution_tracking.dt_last_updated
    description: Date indicating the last modification made to the destination bucket.
  ts_execution:
    lineage:
      - reverse_atento.atento_execution_tracking.ts_execution
      - reverse_webhelp.webhelp_execution_tracking.ts_execution
    description: Date indicating the last execution of the reverse dag.
