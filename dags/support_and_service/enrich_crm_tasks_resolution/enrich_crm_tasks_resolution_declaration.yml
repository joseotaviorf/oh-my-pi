dag:
  name: enrich_crm_tasks_resolution
  schedule_start_date: 2015, 10, 29
  owner: Data SS
  documentation:
    dag_purpose: |
      Creates CRM (Customer Relationship Management) tasks resolution tables which union actions and status histories
      from CRM tasks in enrich `datalake_crm` layer and loads them into datalake enrich `datalake_crm_tasks_resolution`
      layer.
workflow:
  type: query_delta
  layer: enrich
cluster:
  type: databricks_12_2_min_memory_photon_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
