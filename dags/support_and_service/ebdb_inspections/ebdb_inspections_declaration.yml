dag:
  name: ebdb_inspections
  schedule_start_date: 2021, 2, 20
  schedule_interval: 0 0 * * *
  owner: Data SS
  documentation:
    dag_purpose: Extraction of EBDB tables related to Inspections into data lake. EBDB is the main database for QuintoAndar.
workflow:
  type: cdc
  layer: raw
  custom_schema: ebdb
  database_type: mysql
  source_database: ebdb
  source_schema: ebdb
  tables_customization:
    Vistoria:
      raw_primary_keys: ["id"]
      clean_table_name: inspection
    Vistoria_AUD:
      clean_table_name: inspection_aud
      raw_primary_keys: ["id", "REV"]
    ItemVistoria:
      raw_primary_keys: ["id"]
      clean_table_name: inspection_item
    FotoItemVistoria:
      raw_primary_keys: ["id"]
      clean_table_name: inspection_photo_item
    ConservationAssessment:
      raw_primary_keys: ["id"]
      clean_table_name: conservation_assessment
    ConservationItem:
      raw_primary_keys: ["id"]
      clean_table_name: conservation_item
cluster:
  type: databricks_12_2_max_io-general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
