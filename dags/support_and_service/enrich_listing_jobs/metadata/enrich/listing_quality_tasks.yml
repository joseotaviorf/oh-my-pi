---
database_name: datalake_listing_jobs
table_name: listing_quality_tasks
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
description:
  Enrichment table that aims to consolidate information related to listing quality service.
  Each line in this table represents a service ticket from the listing quality context.
columns:
  id_ticket:
    description: Unique ticket identification key.
    lineage:
      - datalake_zendesk.tickets_current.ticket_funnel
  id_photo_job:
    description: Identification key for the photo activity generated by the service.
    lineage:
      - datalake_gsheets_clean.aux_check_photo_sender.id_photo_job
      - datalake_zendesk.tickets_current.id_job
  id_house:
    description: Identification key of the house involved in the service.
    lineage:
      - datalake_gsheets_clean.aux_check_photo_sender.id_house
      - datalake_zendesk.tickets_current.custom_fields
  user_sender:
    description: Type of user who sent the demand.
    lineage:
      - datalake_gsheets_clean.aux_check_photo_sender.final_user_sender
      - datalake_zendesk.tickets_current.custom_fields
  responsible_analyst_name:
    description: Name of the analyst responsible for the service.
    lineage:
      - datalake_gsheets_clean.aux_check_photo_sender.analyzed_by
      - datalake_zendesk.tickets_current.agent_name
  responsible_analyst_email:
    description: Email of the analyst responsible for the service.
    lineage:
      - datalake_zendesk.tickets_current.agent_email
  responsible_analyst_organization:
    description: Organization of the analyst responsible for the service.
    lineage:
      - datalake_zendesk.tickets_current.agent_organization
  group_name:
    description: Group the ticket is part of.
    lineage:
      - datalake_zendesk.tickets_current.group_name
  house_classification:
    description: Descriptive data that indicates the condition of the house.
    lineage:
      - datalake_gsheets_clean.aux_check_photo_sender.final_classification
      - datalake_zendesk.tickets_current.custom_fields
  house_classification_reason:
    description: Data in array format with the reasons why the house was
      classified with the data in the house_classification column.
    lineage:
      - datalake_gsheets_clean.aux_check_photo_sender.final_classification_reason
      - datalake_zendesk.tickets_current.custom_fields
  classification_comments:
    description: Additional comments to house rating.
    lineage:
      - datalake_gsheets_clean.aux_check_photo_sender.final_classification_comments
      - datalake_zendesk.tickets_current.custom_fields
  signboard_location:
    description: Classification of the region where the house is located.
    lineage:
      - datalake_gsheets_clean.aux_check_photo_sender.sign_placement
      - datalake_zendesk.tickets_current.custom_fields
  status:
    description: Stage the ticket is at.
    lineage:
      - datalake_zendesk.tickets_current.status
  ts_created:
    description: Ticket creation date (utc).
    lineage:
      - datalake_zendesk.tickets_current.ts_created
  ts_created_local:
    description: Ticket creation date
    lineage:
      - datalake_zendesk.tickets_current.ts_created
  dt_analyzed_utc:
    description: Ticket updated date (utc).
    lineage:
      - datalake_zendesk.tickets_current.ts_updated
  dt_analyzed:
    description: Ticket updated date
    lineage:
      - datalake_gsheets_clean.aux_check_photo_sender.dt_analyzed
      - datalake_zendesk.tickets_current.ts_updated
