database_name: datalake_listing_jobs
table_name: house_photo_job_tasks
description:
  Enrichment table that aims to bring together the relationship between home
  and job photos. The granularity of the table is the key.
domain: Support and Services
owner: data-ae-ss@quintoandar.com.br
columns:
  id_house:
    description: Unique house identification key.
    lineage:
      - datalake_ebdb_listing.house.id
  has_job_photo:
    description: Boolean information that indicates whether the job is from the photo context.
  has_fup_photo:
    description: Boolean information that indicates whether the step is to monitor the photo context.
