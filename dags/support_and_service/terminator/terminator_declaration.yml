dag:
  name: terminator
  schedule_start_date: 2025, 03, 18
  schedule_interval: 0 22,0 * * *
  owner: Data SS
  documentation:
    dag_purpose: |
      This DAG imports the tables from [Terminator](https://github.com/quintoandar/terminator), our service to orchestrate the offboard contract process.
workflow:
  type: cdc
  layer: raw
  database_type: postgres
  source_database: terminator
  source_schema: public
  custom_schema: terminator
  dbutils_secret_key: TERMINATOR_DB
  lineage_product_database_name: terminator
  tables_customization:
    application_user_aud: {}
    application_user: {}
    attachment_aud: {}
    attachment: {}
    checklist_item: {}
    contract: {}
    inspection_aud: {}
    inspection: {}
    member: {}
    negotiation_aud: {}
    negotiation: {}
    revinfo:
      clean_table_name: rev_info
    termination_aud: {}
    termination_characteristics: {}
    termination_fee_aud: {}
    termination_fee_negotiation_aud: {}
    termination_fee_negotiation: {}
    termination_fee: {}
    termination_step: {}
    termination_task: {}
    termination_workflow_aud: {}
    termination_workflow: {}
    utility_bill_aud: {}
    utility_bill: {}
    inspection_opted_out:
      raw_primary_keys: ["id"]
      clean_primary_keys: ["id_inspection_opted_out"]
