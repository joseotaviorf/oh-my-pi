database_name: datalake_terminator_clean
table_name: termination
description: The table from termination contracts.
domain: Support and Services
owner: data-ae-ss@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_terminator_raw.termination.id
    description: Unique identifier for each termination record.
  id_contract:
    lineage:
      - datalake_terminator_raw.termination.contract_id
    description: Identifier linking to the specific contract associated with the termination.
  id_exit_inspection:
    lineage:
      - datalake_terminator_raw.termination.exit_inspection_id
    description: Reference ID for the exit inspection associated with the termination.
  id_current_step:
    lineage:
      - datalake_terminator_raw.termination.current_step_id
    description: Current termination step.
  id_support_case:
    lineage:
      - datalake_terminator_raw.termination.support_case
    description: Case ID, which goes to the taskmaster.
  feedback:
    lineage:
      - datalake_terminator_raw.termination.feedback
    description: Customer or tenant feedback related to the termination process.
  tenant_keys_location:
    lineage:
      - datalake_terminator_raw.termination.tenant_keys_location
    description: Location where the tenant's keys are stored or returned.
  owner_keys_location:
    lineage:
      - datalake_terminator_raw.termination.owner_keys_location
    description: Location where the owner's keys are stored or returned.
  requested_by:
    lineage:
      - datalake_terminator_raw.termination.requested_by
    description: Identifier of the individual or entity that initiated the termination request.
  source:
    lineage:
      - datalake_terminator_raw.termination.source
    description: Source or origin of the termination request.
  status:
    lineage:
      - datalake_terminator_raw.termination.status
    description: Current status of the termination process.
  internal_status:
    lineage:
      - datalake_terminator_raw.termination.internal_status
    description: Internal status used for tracking the process on back.
  cancellation_info:
    lineage:
      - datalake_terminator_raw.termination.cancellation_info
    description: Details or reasons regarding any cancellation of the termination.
  rescheduling_history:
    lineage:
      - datalake_terminator_raw.termination.rescheduling_history
    description: Record of any rescheduling that has occurred during the termination process.
  utility_bill_info:
    lineage:
      - datalake_terminator_raw.termination.utility_bill_info
    description: Information about utility bills relevant to the termination.
  last_condominium_responsible:
    lineage:
      - datalake_terminator_raw.termination.last_condominium_responsible
    description: Identifier of the last responsible party for condominium-related issues, landlord or tenant.
  tenant_pending_tasks:
    lineage:
      - datalake_terminator_raw.termination.tenant_pending_tasks
    description: List of tasks or actions pending on the tenant's side.
  category:
    lineage:
      - datalake_terminator_raw.termination.category
    description: Category or type of termination (e.g., STANDARD, BEFORE_RENTAL, JOB_TRANSFER...).
  inspection_date_offset_in_days:
    lineage:
      - datalake_terminator_raw.termination.inspection_date_offset_in_days
    description: tenant's preferred date for exit inspection represented as compensation in days from the vacancy date.
  spoc_wave:
    lineage:
      - datalake_terminator_raw.termination.wave
    description: Information of type int that indicates in which wave of the spoc the termination entered.
  is_spoc:
    lineage:
      - datalake_terminator_raw.termination.is_spoc
    description: Boolean information indicating whether the termination is part of the spoc.
  is_spoc_control_group:
    lineage:
      - datalake_terminator_raw.termination.is_spoc_control_group
    description: Boolean information indicating whether the termination is part of the spoc control group.
  has_exit_inspection:
    lineage:
      - datalake_terminator_raw.termination.exit_inspection_required
    description: Boolean indicating whether an exit inspection is required or has occurred.
  is_relisting:
    lineage:
      - datalake_terminator_raw.termination.relisting_enabled
    description: Boolean indicating whether the property is marked for relisting post-termination.
  dt_relisting:
    lineage:
      - datalake_terminator_raw.termination.relisting_date
    description: Date when the property is marked for relisting.
  dt_termination:
    lineage:
      - datalake_terminator_raw.termination.date
    description: Date when the property became or will become vacant.
  dt_vacancy:
    lineage:
      - datalake_terminator_raw.termination.vacancy_date
    description: Date when the property became or will become vacant.
  dt_ended_termination:
    lineage:
      - datalake_terminator_raw.termination.end_date
    description: Date when the termination process was completed or finalized.
  ts_canceled:
    lineage:
      - datalake_terminator_raw.termination.canceled_at
    description: Timestamp for when the termination was canceled, if applicable.
  ts_created:
    lineage:
      - datalake_terminator_raw.termination.created_at
    description: Timestamp for when the termination record was initially created.
  ts_updated:
    lineage:
      - datalake_terminator_raw.termination.updated_at
    description: Timestamp for the most recent update to the termination record.
