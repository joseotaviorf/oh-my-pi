database_name: datalake_terminator_clean
table_name: termination_workflow
description:
  One row per termination workflow in the contract termination (offboarding)
  workflow managed by the Terminator service. Tracks step progression, fees,
  and inspection outcomes.
owner: gabriel.firmino@quintoandar.com.br
domain: Support and Services
columns:
  id:
    lineage:
      - datalake_terminator_raw.termination_workflow.id
    description: Primary surrogate identifier for the entity row in this support and service dataset.
  id_termination:
    lineage:
      - datalake_terminator_raw.termination_workflow.termination_id
    description: Identifier for the termination referenced by this record.
  id_current_assignee:
    lineage:
      - datalake_terminator_raw.termination_workflow.current_assignee_id
    description: Identifier for the current assignee referenced by this record.
  current_step:
    lineage:
      - datalake_terminator_raw.termination_workflow.current_step
    description: Attribute of the termination workflow describing current step.
  has_automatically_closed_task:
    lineage:
      - datalake_terminator_raw.termination_workflow.automatically_closed
    description: Boolean flag indicating whether has automatically closed task applies to this support service record.
  ts_created:
    lineage:
      - datalake_terminator_raw.termination_workflow.created_at
    description: Timestamp when the record was first created in the upstream source system.
  ts_updated:
    lineage:
      - datalake_terminator_raw.termination_workflow.updated_at
    description: Timestamp of the most recent update to the record in the upstream source system.
