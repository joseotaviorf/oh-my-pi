database_name: datalake_terminator_clean
table_name: application_user
description:
  One row per application user in the contract termination (offboarding)
  workflow managed by the Terminator service. Tracks step progression, fees,
  and inspection outcomes.
owner: gabriel.firmino@quintoandar.com.br
domain: Support and Services
columns:
  id:
    lineage:
      - datalake_terminator_raw.application_user.id
    description: Primary surrogate identifier for the entity row in this support and service dataset.
  id_external:
    lineage:
      - datalake_terminator_raw.application_user.external_id
    description: External system identifier mapped to this Zendesk user.
  id_keycloak_token:
    lineage:
      - datalake_terminator_raw.application_user.keycloak_token_id
    description: Identifier for the keycloak token referenced by this record.
  name:
    lineage:
      - datalake_terminator_raw.application_user.name
    description: Display name of the entity as registered in the upstream operational application.
  email:
    lineage:
      - datalake_terminator_raw.application_user.email
    description: Email address associated with the user or contact on this record.
  phone:
    lineage:
      - datalake_terminator_raw.application_user.phone
    description: Phone number associated with the user or contact on this record.
  ts_created:
    lineage:
      - datalake_terminator_raw.application_user.created_at
    description: Timestamp when the record was first created in the upstream source system.
  ts_updated:
    lineage:
      - datalake_terminator_raw.application_user.updated_at
    description: Timestamp of the most recent update to the record in the upstream source system.
