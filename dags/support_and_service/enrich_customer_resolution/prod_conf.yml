---
dag_documentation:
  dag_purpose: Construction of resolution metrics as FCR Customer above the customer support model.
inner_dependencies:
  customer_resolution_static: ["customer_resolution"]
tables:
  customer_resolution:
    is_incremental: false
  customer_resolution_static:
    is_incremental: true
    partition_cols: ["year", "month", "day"]

custom_cluster:
  driver_node_type_id: m5d.2xlarge
  node_type_id: m5d.2xlarge
  runtime_engine: PHOTON
  num_workers: 3
  aws_attributes:
    ebs_volume_size: 300
