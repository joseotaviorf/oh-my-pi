dag:
    name: enrich_customer_resolution
    schedule_start_date: 2021, 11, 16
    owner: Data SS
    documentation:
        dag_purpose: Construction of resolution metrics as FCR Customer above the customer support model.

workflow:
    type: query
    layer: enrich
    inner_dependencies:
        customer_resolution_static:
            - customer_resolution

cluster:
    type: custom_cluster
    custom_configurations:
        driver_node_type_id: m5d.2xlarge
        node_type_id: m5d.2xlarge
        runtime_engine: PHOTON
        num_workers: 3
        aws_attributes:
            ebs_volume_size: 300
