database_name: datalake_customer_resolution
table_name: customer_resolution
description:
  The customer resolution table is responsible for calculating the First Contact
  Resolution (FCR) Metric for front_tickets, which include e-mails, calls, and chats.
  A front_ticket is defined as any ticket that is not from "atendimento_escalado," a
  backoffice department, or has an outbound journey_step direction. This FCR Customer
  View involves verifying whether a user's first ticket session resulted in an FCR or
  not.
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  id_ticket:
    lineage:
      - datalake_customer_support.call.id_ticket
      - datalake_customer_support.chat.id_ticket
      - datalake_customer_support.email.id_ticket
    description:
      The id_ticket serves as a unique identifier for a ticket_session, which refers to
      a user's initial contact with a team within a 7-day period. Only closed
      ticket_sessions are considered.
  id_user:
    lineage:
      - datalake_customer_support.call.id_user
      - datalake_customer_support.chat.id_user
      - datalake_customer_support.email.id_user
    description: The unique user identifier is recorded for each ticket_session.
  ticket_channel:
    description:
      The ticket_session channel is categorized as call, chat, or email, depending on
      the nature of the initial contact.
  team:
    lineage:
      - datalake_gsheets_clean.department_control.team
    description: The ticket session department team is identified and recorded.
  total_tickets:
    description:
      The total number of tickets related to a ticket_session is recorded, regardless
      of their status.
  ticket_recontact_list:
    lineage:
      - datalake_customer_support.call.id_ticket
      - datalake_customer_support.chat.id_ticket
      - datalake_customer_support.email.id_ticket
    description:
      All recontact tickets related to the ticket_session are listed in chronological
      order based on their creation date.
  is_fcr:
    description:
      The First Contact Resolution (customer view) column is consolidated after 8 days
      from the ticket's closure. If the user did not open more than 1 ticket for the
      same team within a 7-day window, the value is True; if the user opened more than
      1 ticket for the same team within a 7-day window, the value is False.
  ts_started:
    lineage:
      - datalake_customer_support.call.ts_ticket_started
      - datalake_customer_support.chat.ts_ticket_started
      - datalake_customer_support.email.ts_ticket_started
    description: The ticket session creation date.
  ts_closed:
    lineage:
      - datalake_customer_support.call.ts_ticket_ended
      - datalake_customer_support.chat.ts_ticket_ended
      - datalake_customer_support.email.ts_ticket_ended
    description: The ticket session closing date.
