---
database_name: datalake_customer_resolution
table_name: customer_resolution_static
description:
  The customer resolution team is responsible for calculating the First Contact
  Resolution (FCR) Metric for front_tickets, which encompass e-mails, calls, and
  chats.
  A front_ticket is defined as any ticket that does not originate from
  "atendimento_escalado," a backoffice department, or an outbound journey_step
  direction.
  To determine the FCR for a ticket_session, the Customer View verifies whether the
  user's first ticket session resulted in an FCR or not. However, the FCR metric for a
  ticket_session is only obtained after 8 days from the ticket session's closure.
  This is because within 7 days, the user may open more tickets for the same team,
  thereby retroactively changing the metric value.
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  id_ticket:
    lineage:
      - datalake_customer_resolution.customer_resolution.id_ticket
    description:
      The id_ticket serves as a unique identifier for a ticket_session, which refers to
      a user's initial contact with a team within a 7-day period. Only closed
      ticket_sessions are considered.
  id_user:
    lineage:
      - datalake_customer_resolution.customer_resolution.id_user
    description: The unique user identifier is recorded for each ticket_session.
  ticket_channel:
    description:
      The ticket_session channel is categorized as call, chat, or email, depending on
      the nature of the initial contact.
  team:
    lineage:
      - datalake_customer_resolution.customer_resolution.team
    description: The ticket session department team is identified and recorded.
  total_tickets:
    description:
      The total number of tickets related to a ticket_session is recorded, regardless
      of their status.
  ticket_recontact_list:
    lineage:
      - datalake_customer_resolution.customer_resolution.ticket_recontact_list
    description:
      All recontact tickets related to the ticket_session are listed in chronological
      order based on their creation date.
  is_fcr:
    description:
      The First Contact Resolution (customer view) column is consolidated after 8 days
      from the ticket's closure. If the user did not open more than 1 ticket for the
      same team within a 7-day window, the value is True; if the user opened more than
      1 ticket for the same team within a 7-day window, the value is False. This metric
      is only obtained after 8 days from the ticket session's closure.
  ts_started:
    lineage:
      - datalake_customer_resolution.customer_resolution.ts_started
    description: The ticket session creation date.
  ts_closed:
    lineage:
      - datalake_customer_resolution.customer_resolution.ts_closed
    description: The ticket session closing date.
  year:
    lineage:
      - datalake_customer_resolution.customer_resolution.ts_closed
    description: The closing date year, partition column.
  month:
    lineage:
      - datalake_customer_resolution.customer_resolution.ts_closed
    description: The closing date month, partition column.
  day:
    lineage:
      - datalake_customer_resolution.customer_resolution.ts_closed
    description: The closing date day, partition column.
