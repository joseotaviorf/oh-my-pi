database_name: dw_call
table_name: fact_ivr_paths
description:
  Fact table that tracks the events that occurred during a call service,
  the main source of this base is the big fone and the granularity is the call answers.
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  sk_call:
    lineage:
      - datalake_bigfone_twilio.call_ivr_paths.id_call
    description: Primary identification key for the call service.
  step:
    lineage:
      - datalake_bigfone_twilio.call_ivr_paths.step_name
    description: Descriptive data that identifies the stage of the funnel in which the user is.
  answer:
    lineage:
      - datalake_bigfone_twilio.call_ivr_paths.digits
    description: Digits that the customer used during the call.
  is_timeout:
    lineage:
      - datalake_bigfone_twilio.call_ivr_paths.event_type
    description: Boolean data, to identify whether the call was terminated due to idle time.
  seconds_elapsed:
    lineage:
      - datalake_bigfone_twilio.call_ivr_paths.id_call
      - datalake_bigfone_twilio.call_ivr_paths.ts_created
    description: Numeric data that indicates how long the call lasted (in minutes).
  ts_answered:
    lineage:
      - datalake_bigfone_twilio.call_ivr_paths.ts_created
    description: Service creation date, in timestamp.
  ts_load:
    description: Date and time when the data was loaded.
