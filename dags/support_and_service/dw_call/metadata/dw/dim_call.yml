database_name: dw_call
table_name: dim_call
description: Dimension table with the objective of gathering 
  descriptive information about call service.
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  sk_call:
    lineage:
      - datalake_bigfone_twilio.call_ivr_events.id_call
      - datalake_bigfone_twilio.call_flex_events.id_call
      - datalake_bigfone_twilio.call_flex_events.id_conversation
      - datalake_bigfone_twilio.call_flex_events.id_task
    description: Unique identification key for call service.
  from_phone_number:
    lineage:
      - datalake_bigfone_twilio.call_ivr_events.from_number
      - datalake_bigfone_twilio.call_flex_events.from_number
    description: Descriptive data that indicates the number of those who requested service.
  to_phone_number:
    lineage:
      - datalake_bigfone_twilio.call_ivr_events.to_number
      - datalake_bigfone_twilio.call_flex_events.to_number
    description: Descriptive data that indicates the number of people who made a service.
  direction:
    lineage:
      - datalake_bigfone_twilio.call_flex_events.direction
    description: Descriptive information that indicates who the call came from, it can be inbound or outbound.
    categories:
      INBOUND: Indicates that the call comes from the customer to the analyst.
      OUTBOUND: Indicates that the call was made from the analyst to the customer.
  from_city:
    lineage:
      - datalake_bigfone_twilio.inbound_call_locations.from_city
    description: Descriptive information that indicates the city from where the customer requested service.
  from_state:
    lineage:
      - datalake_bigfone_twilio.inbound_call_locations.from_state
    description: Descriptive information that indicates the state from which the customer requested service.
  from_country:
    lineage:
      - datalake_bigfone_twilio.inbound_call_locations.from_country
    description: Descriptive information that indicates the country from which the customer requested service.
  scheduling_source:
    lineage:
      - datalake_bigfone_twilio.call_flex_events.scheduling_source
    description: Descriptive data that indicates whether the customer remained in automatic service.
  ts_started:
    lineage:
      - datalake_bigfone_twilio.call_ivr_events.ts_created_local
      - datalake_bigfone_twilio.call_flex_events.ts_created_local
    description: Information on the date and time the service was requested.
  ts_csat_answered:
    lineage:
      - datalake_bigfone_twilio.call_ivr_events.ts_created_local
    description: Information about the date and time the csat survey was completed.
  ts_ended:
    lineage:
      - datalake_bigfone_twilio.call_ivr_events.ts_created_local
      - datalake_bigfone_twilio.call_flex_events.ts_created_local
    description: Information about the date and time the service ended.
  ts_load:
    description: Timestamp date that indicates when the query was last executed.
