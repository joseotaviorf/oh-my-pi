database_name: dw_call
table_name: dim_call_task
description: Fact table that represents the list of tasks, 
  queues and dates. Each row in this table is a task.
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  sk_task:
    lineage:
      - datalake_bigfone_twilio.call_flex_reservations.id_reservation
    description: Unique identifier for every ID reservation from Twilio
  queue_name:
    lineage:
      - datalake_bigfone_twilio.call_flex_reservations.queue_name
    description: Name of the task queue.
  dt_updated:
    lineage:
      - datalake_bigfone_twilio.call_flex_reservations.year
      - datalake_bigfone_twilio.call_flex_reservations.month
      - datalake_bigfone_twilio.call_flex_reservations.day
    description: Task-related update date.
  ts_created:
    lineage:
      - datalake_bigfone_twilio.call_flex_reservations.ts_created
    description: Task creation date, in timestamp format.
  ts_ended:
    lineage:
      - datalake_bigfone_twilio.call_flex_reservations.ts_ended
    description: End date related to the task, in timestamp.
  ts_twilio_created_local:
    lineage:
      - datalake_bigfone_twilio.call_flex_events.ts_created_local
    description: Local task creation date in Twilio.
  ts_twilio_created_utc:
    lineage:
      - datalake_bigfone_twilio.call_flex_events.ts_created_utc
    description: UTC task creation date in Twilio.
