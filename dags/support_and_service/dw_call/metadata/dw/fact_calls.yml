database_name: dw_call
table_name: fact_calls
description: 
  Fact table that aims to consolidate keys 
  and metrics related to call service.
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  sk_call:
    description: Unique identification key for call service.
    lineage:
      - datalake_bigfone_twilio.call_ivr_events.id_call
      - datalake_bigfone_twilio.call_flex_events.id_call
      - datalake_bigfone_twilio.call_flex_events.id_conversation
      - datalake_bigfone_twilio.call_flex_events.id_task
  sk_user:
    description: Identification key of the customer who requested service.
    lineage:
      - datalake_ebdb_customer_contact_identification.customer_contact_identification.id_user
  sk_personal_document:
    description: Key related to the document of the customer who requested the service (cpf).
    lineage:
      - datalake_ebdb_customer_contact_identification.customer_contact_identification.cpf
  sk_call_date:
    description: Key related to the date on which the service was requested.
    lineage:
      - datalake_bigfone_twilio.call_ivr_events.ts_created_local_unix
      - datalake_bigfone_twilio.call_flex_events.ts_created_local_unix
  last_queue_name:
    description: Name of the queue where the call ended up being placed in.
    lineage:
      - datalake_bigfone_twilio.call_flex_reservations.queue_name
  has_ended_in_ura:
    description: Boolean information that indicates whether the service was completed with automatic assistance.
    lineage:
      - datalake_bigfone_twilio.call_flex_reservations.id_reservation
  is_answered:
    description: Boolean information that indicates whether the call was answered.
    lineage:
      - datalake_bigfone_twilio.call_flex_reservations.id_reservation
  is_transfered:
    description: Boolean information that indicates whether the call was transferred at any time.
    lineage:
      - datalake_bigfone_twilio.call_flex_reservations.is_answered
      - datalake_bigfone_twilio.call_flex_reservations.id_reservation
  is_csat_answered:
    description: Boolean information that indicates whether the service satisfaction survey was answered.
    lineage:
      - datalake_bigfone_twilio.call_ivr_events.csat_2
  is_solved:
    description: Boolean information that indicates whether the service resolved the customer's problem.
    lineage:
      - datalake_bigfone_twilio.call_ivr_events.csat_1
  tasks:
    description: Numerical information that indicates how many tasks the service generated.
    lineage:
      - datalake_bigfone_twilio.call_flex_reservations.id_reservation
  answered_tasks:
    description: Numerical information that indicates how many calls were answered during the resolution of the problem.
    lineage:
      - datalake_bigfone_twilio.call_flex_reservations.is_answered
      - datalake_bigfone_twilio.call_flex_reservations.id_reservation
  seconds_first_answer:
    description: Waiting time (in seconds) for service.
    lineage:
      - datalake_bigfone_twilio.call_flex_reservations.seconds_wait_time
  seconds_ivr_time:
    description: Time (in seconds) until an ivr event.
    lineage:
      - datalake_bigfone_twilio.call_ivr_paths.ts_created
  seconds_total_wait_time:
    description: Total time (in seconds) that the customer was waiting.
    lineage:
      - datalake_bigfone_twilio.call_flex_reservations.seconds_wait_time
  seconds_total_talk_time:
    description: Total time (in seconds) that the customer service conversation lasted.
    lineage:
      - datalake_bigfone_twilio.call_flex_reservations.seconds_talk_time
  seconds_wrapup_time:
    description: Time (in seconds) taken from the creation of the service to a closing event.
    lineage:
      - datalake_bigfone_twilio.call_flex_events.ts_created_local_unix
      - datalake_bigfone_twilio.call_flex_events.ts_wrapup_event_local_unix
  seconds_aht:
    description: Average handling time in seconds.
    lineage:
      - datalake_bigfone_twilio.call_flex_events.ts_created_local_unix
      - datalake_bigfone_twilio.call_flex_reservations.ts_created_local
  seconds_duration:
    description: Service duration (in seconds) measured by the date and time of the events.
    lineage:
      - datalake_bigfone_twilio.call_ivr_events.ts_created_local_unix
      - datalake_bigfone_twilio.call_flex_events.ts_created_local_unix
  csat_rating:
    description: Score of the completed satisfaction survey.
    lineage:
      - datalake_bigfone_twilio.call_ivr_events.csat_2
  is_scheduled:
    description: Boolean information that indicates whether a call has been scheduled.
    lineage:
      - datalake_bigfone_twilio.call_flex_events.is_scheduled
  ts_load:
    description: Timestamp of when the table was last processed.
