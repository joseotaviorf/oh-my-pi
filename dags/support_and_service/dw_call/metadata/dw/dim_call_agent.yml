database_name: dw_call
table_name: dim_call_agent
description: Dimension table that aims to consolidate descriptive 
  information about the analysts who answered the call.
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  sk_call_agent:
    lineage:
      - datalake_bigfone_twilio.call_agents.id_agent
    description: Unique identification key for the analyst who made the call, this information comes from Twilio.
  full_name:
    lineage:
      - datalake_bigfone_twilio.call_agents.full_name
    description: Descriptive information about the analyst's full name.
  email:
    lineage:
      - datalake_bigfone_twilio.call_agents.email
    description: Descriptive information about the analyst's email.
  location:
    lineage:
      - datalake_bigfone_twilio.call_agents.location
    description: Descriptive information that indicates which company the analyst is allocated to.
  skills:
    lineage:
      - datalake_bigfone_twilio.call_agents.skills
    description: Data in array format that indicates the types/departments in which the analyst works.
  ts_created:
    lineage:
      - datalake_bigfone_twilio.call_agents.ts_first_event
    description: Date in timestamp format that indicates when the analyst performed his first service event.
  ts_updated:
    lineage:
      - datalake_bigfone_twilio.call_agents.ts_last_event
    description: Date in timestamp format that indicates when the analyst performed his last service event.
  ts_load:
    description: Timestamp date that indicates when the query was last executed.
