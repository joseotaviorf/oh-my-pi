database_name: dw_call
table_name: fact_call_tasks
description: Fact table that represents metrics and indicators on call
    responses at task level. Each row in this table is a task.
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  sk_task:
    description: Unique identifier for every ID reservation from Twilio.
    lineage:
      - datalake_bigfone_twilio.call_flex_reservations.id_reservation
  sk_call:
    description: Call answering identification key.
    lineage:
      - datalake_bigfone_twilio.call_flex_reservations.id_call
      - datalake_bigfone_twilio.call_flex_reservations.id_task
  sk_agent:
    description: Analyst identification key, coming directly from the Twilio database 
      (does not include the new analyst model)
    lineage:
      - datalake_bigfone_twilio.call_flex_reservations.id_agent
  sk_queue:
    description: Identification key for the call service queue.
    lineage:
      - datalake_bigfone_twilio.call_flex_reservations.id_queue
  is_answered:
    description: Boolean that indicates whether the reservation had a response, 
      the response is characterized by the reservation accepted event.
    lineage:
      - datalake_bigfone_twilio.call_flex_reservations.is_answered
  is_timeout:
    description: Boolean that indicates whether the reservation had a timeout, 
      the timeout is characterized by the reservation timeout event.
    lineage:
      - datalake_bigfone_twilio.call_flex_reservations.is_timeout
  is_rejected:
    description: Boolean that indicates whether the reservation had a rejected, 
      the rejected is characterized by the reservation rejected event.
    lineage:
      - datalake_bigfone_twilio.call_flex_reservations.is_rejected
  seconds_duration:
    description: Time (in seconds) it took for the queue to be accepted or completed 
      + the conversation time at the service.
    lineage:
      - datalake_bigfone_twilio.call_flex_reservations.seconds_duration
  seconds_wait_time:
    description: Time (in seconds) it took for the queue to be accepted or completed.
    lineage:
      - datalake_bigfone_twilio.call_flex_reservations.seconds_wait_time
  seconds_talk_time:
    description: Time (in seconds) in which the customer service conversation took place, 
      defined from the reservation accepted event counting until the next event.
    lineage:
      - datalake_bigfone_twilio.call_flex_reservations.seconds_talk_time
  ts_load:
    description: Timestamp date that indicates when the query was last executed.
