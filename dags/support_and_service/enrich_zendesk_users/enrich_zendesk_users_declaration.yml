dag:
    name: enrich_zendesk_users
    schedule_start_date: 2023, 7, 24
    owner: Data SS
    documentation: 
        dag_purpose: |
            The dag has the objective of full loading the tables of entities and user segmentation, looking mainly at the zendesk source.
workflow:
    type: query
    layer: enrich
cluster:
    type: custom_cluster
    custom_configurations:
        driver_node_type_id: c5d.4xlarge
        node_type_id: c6id.4xlarge
        num_workers: 3
        aws_attributes:
            ebs_volume_size: 300
