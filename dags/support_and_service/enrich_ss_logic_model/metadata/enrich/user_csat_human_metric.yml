---
database_name: datalake_ss_logic_model
table_name: user_csat_human_metric
description:
  This table retrieves the csat human metrics by user. It is a snapshot ingestion, so in
  this case, only csat answered until the snapshot date are being considered.
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  id_snapshot:
    description: The snapshot id, which is the D-1 date in the format "yyyyMMdd".
  id_user:
    lineage:
      - datalake_customer_support.tickets.id_user_main
    description:
      The user ID that has answered the satisfaction survey. It does not consider null
      id users or satisfaction surveys with null answers.
  last_human_csat_answered_score:
    description: The last human csat answered score.
  total_human_csat_answered:
    description: The volume of human csat answered by the user.
  total_human_csat_promoter:
    description: The volume of human csat answered equal to 4 or 5.
  total_human_csat_neutral:
    description: The volume of human csat answered equal to 3.
  total_human_csat_detractor:
    description: The volume of human csat answered equal to 1 or 2.
  avg_human_csat_score_within_three_months:
    description: The average of human csat scores within the last 3 months.
  total_human_csat_detractor_within_three_months:
    description:
      The volume of human csat answers equal to 1 or 2 that were answered within the
      last 3 months.
  total_human_csat_neutral_within_three_months:
    description:
      The volume of human csat answers equal to 3 that were answered within the
      last 3 months.
  total_human_csat_promoter_within_three_months:
    description:
      The volume of human csat answers equal to 4 or 5 that were answered within the
      last 3 months.
  total_human_csat_answered_within_three_months:
    description: The volume of human csat answers within the last 3 months.
  human_csat_detractor_percentage_within_three_months:
    description:
      Considers the percentual of human csat answers equal to 1 or 2 that were answered
      within the last 3 months.
  has_answered_human_csat_within_three_months:
    description: If the user has answered any human csat created within the last 3 months.
  ts_last_human_csat_created:
    lineage:
      - datalake_customer_support.tickets.ts_csat_first_response
    description: Timestamp that represents the last csat answered by the user.
  year:
    description: It is the snapshot year, also a partition column.
  month:
    description: It is the snapshot month, also a partition column.
  day:
    description: It is the snapshot day, also a partition column.
