---
database_name: datalake_ss_logic_model
table_name: user_app_installed_metric
description:
  This table retrieves the user's last app installed event, so it is possible to know
  if the user has the app installed or not. It is a snapshot ingestion, so in this case,
  only events created until the snapshot date are being considered.
domain: Support and Services
owner: data-ae-ss@quintoandar.com.br
columns:
  id_snapshot:
    description: The snapshot id, which is the D-1 date in the format "yyyyMMdd".
  id_user:
    lineage:
      - datalake_app_installed.events.id_user
    description: ID of the user. It does not consider NULL values.
  app_version:
    lineage:
      - datalake_app_installed.events.app_version
    description: Version of the app installed on the users device at the time of the event
  has_app_installed:
    description:
      Whether the user has the app installed or not, the following conditions determine
      the result. If the app's latest event date is within 45 days, it is also
      considered TRUE. Otherwise, the result is FALSE.
  ts_last_app_installed:
    lineage:
      - datalake_app_installed.events.ts_event
    description: The timestamp registered for the user's last app installed event.
  year:
    description: It is the snapshot year, also a partition column.
  month:
    description: It is the snapshot month, also a partition column.
  day:
    description: It is the snapshot day, also a partition column.
