dag:
  name: ebdb_photo_job
  schedule_start_date: 2024, 10, 07
  schedule_interval: 0 0 * * *
  owner: Data SS
  documentation:
    dag_purpose: |
      Extraction of EBDB tables related to Photo Job into data lake. EBDB is the main database for QuintoAndar.
workflow:
  type: cdc
  layer: raw
  database_type: mysql
  source_database: ebdb
  source_schema: ebdb
  custom_schema: ebdb
  dbutils_secret_key: EBDB_DB
  tables_customization:
    DadosFotografo:
      clean_table_name: photographer_data
      raw_primary_keys: [id]
      clean_primary_keys: [id]
    Imagem:
      clean_table_name: image
      raw_primary_keys: [id]
      clean_primary_keys: [id_image]
    Imagem_AUD:
      clean_table_name: image_aud
      raw_primary_keys: [id, REV]
      clean_primary_keys: [id_image, rev]
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: r5a.xlarge
    node_type_id: r5a.2xlarge
    num_workers: 3
    spark_version: 12.2.x-scala2.12
