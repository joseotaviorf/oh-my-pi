dag:
  name: enrich_offboarding
  schedule_start_date: 2020, 7, 1
  owner: Data SS
  documentation:
    dag_purpose: Compile different tables of offboading context, to better elaborate questions about it.
workflow:
  type: query_delta
  layer: enrich
  inner_dependencies:
    customer_support:
      - ongoing
    consolidate_data:
      - budgeting_window
      - customer_support
      - inspection_analysis
      - ongoing
      - tickets
      - nps_agg
    contract_anomaly:
      - contract_termination
    inspection_analysis:
      - ongoing
    ongoing:
      - contract_termination
    nps:
      - contract_termination
    nps_agg:
      - nps
    tickets:
      - ongoing
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: m5d.2xlarge
    node_type_id: m5d.4xlarge
    num_workers: 3
    spark_version: 12.2.x-scala2.12
