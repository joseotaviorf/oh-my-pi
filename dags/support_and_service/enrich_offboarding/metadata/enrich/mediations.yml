database_name: datalake_offboarding
table_name: mediations
description: Table that consolidates all terminations in mediation
domain: Support and Services
owner: data-ae-ss@quintoandar.com.br
columns:
  id_termination:
    lineage:
      - datalake_offboarding.contract_termination.id_termination
    description: Unique identifier for the termination.
  id_contract:
    lineage:
      - datalake_offboarding.contract_termination.id_contract
    description: Contract identifier associated with the termination.
  id_mediation_ticket:
    lineage:
      - datalake_zendesk.tickets_current.id_ticket
    description: Ticket identifier from mediation processes.
  squad:
    lineage:
      - datalake_zendesk.tickets_current.tags
      - datalake_terminator_clean.termination_task.id_external
      - datalake_ebdb_contract.contract.rent
      - datalake_terminator_clean.termination_characteristics.is_pro_owner
      - datalake_inspections.reviewer.is_approved
    description: Computed from ticket tags indicating agreement or disagreement.
  has_mediation_ticket:
    lineage:
      - datalake_zendesk.tickets_current.id_ticket
    description: Flag indicating if a mediation ticket exists for the contract.
  has_ac_repairs:
    lineage:
      - datalake_terminator.termination.repairs_absorbed_ac
      - datalake_terminator.termination.total_tentant_repair_ac
    description: Flag indicating whether absorption of repairs occurred.
  has_mediation:
    lineage:
      - datalake_zendesk.tickets_current.id_ticket
    description: Flag indicating if a mediation occurred.
  is_ticket_opened_via_terminator:
    lineage:
      - datalake_zendesk.tickets_current.id_ticket
    description: Indicates if the mediation ticket was opened via the Terminator system.
  dt_inspection:
    lineage:
      - datalake_inspections.inspection_booking.ts_synced
      - datalake_terminator.termination.ts_termination_request
    description: Date of inspection.
  ts_termination_request:
    lineage:
      - datalake_terminator.termination.ts_termination_request
    description: Timestamp when the termination request was initiated.
  ts_termination_finished:
    lineage:
      - datalake_terminator.termination.ts_termination_finished
    description: Timestamp when the termination process was completed.
