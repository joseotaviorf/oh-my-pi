database_name: datalake_offboarding
table_name: mediations
description: >-
  Enriched table that links completed terminations to their mediation tickets/cases.
  Combines three sources — Terminator + Zendesk (legacy, frozen from Apr 2026) and Salesforce (active source going forward).
  Salesforce cases assigned to Squad 7 (evictions) are excluded; only non-eviction mediations are considered.
  Deduplicated to one mediation record per contract (most recent wins).
  Joined to terminations by contract and, when available, by termination ID.
domain: Support and Services
owner: data-ae-ss@quintoandar.com.br
columns:
  id_termination:
    lineage:
      - datalake_terminator.termination.id_termination
    description: Unique identifier for the termination.
  id_contract:
    lineage:
      - datalake_terminator.termination.id_contract
    description: Contract identifier associated with the termination.
  id_mediation_ticket:
    lineage:
      - datalake_zendesk.tickets_current.id_ticket
      - datalake_salesforce_clean.cases.case_number
    description: Ticket or case reference from mediation processes. Zendesk ticket ID for Zendesk-sourced records; Salesforce case_number (human-readable, alphanumeric reference used for lookup in Salesforce) for Salesforce-sourced records.
  squad:
    lineage:
      - datalake_zendesk.tickets_current.tags
      - datalake_salesforce_clean.cases.omni_channel_queue
    description: Squad classification derived from Zendesk ticket tags or Salesforce omni-channel queue. Squad 7 (evictions) is excluded from Salesforce cases, as eviction mediations are not counted in this table.
  has_mediation_ticket:
    lineage:
      - datalake_zendesk.tickets_current.id_ticket
      - datalake_salesforce_clean.cases.case_number
    description: |
      Flag indicating if a non-eviction mediation ticket or case exists for the termination.
      Salesforce cases from Squad 7 (evictions) are not counted. The flag is only populated for
      terminations that have already reached the DONE status (this query restricts the
      terminations CTE to status = 'DONE'); it is not marked while the termination is still in
      progress. Metrics that use this flag must scope the denominator to finished terminations
      so numerator and denominator stay coherent — e.g. "% of terminations without mediation
      and with repairs" should consider only terminations that already reached DONE.
  is_ticket_opened_via_terminator:
    lineage:
      - datalake_zendesk.tickets_current.id_ticket
    description: Indicates if the mediation ticket was opened via the Terminator system. Always FALSE for Salesforce cases.
  dt_mediation:
    lineage:
      - datalake_zendesk.tickets_current.ts_created
      - datalake_salesforce_clean.cases.ts_created
    description: Date of mediation ticket or case creation (BRT).
  dt_inspection:
    lineage:
      - datalake_inspections.inspection_booking.ts_synced
      - datalake_terminator.termination.ts_termination_request
    description: Date of inspection (most recent after termination request).
  ts_termination_request:
    lineage:
      - datalake_terminator.termination.ts_termination_request
    description: Timestamp when the termination request was initiated.
  ts_termination_finished:
    lineage:
      - datalake_terminator.termination.ts_termination_finished
    description: Timestamp when the termination process was completed.
  ts_termination_updated:
    lineage:
      - datalake_terminator.termination.ts_termination_updated
    description: Timestamp when the termination was last updated.
