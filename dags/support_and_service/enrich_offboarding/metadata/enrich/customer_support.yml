---
database_name: datalake_offboarding
table_name: customer_support
description: Enrichment table that aims to gather satisfaction information from the 
  customer support context. The granularity of this table is the contract.
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  id_contract:
    description: Contract identification key.
    lineage:
      - datalake_offboarding.ongoing.id_contract
  department:
    description: Descriptive information indicating the department related to the contract.
    lineage:
      - datalake_customer_support.email.department
  front_or_back:
    description: Descriptive information that indicates whether the contract is for front or back office.
    lineage:
      - datalake_customer_support.email.front_or_back
  num_ticket_satisfied:
    description: Grouping of tickets classified as satisfied by contract.
    lineage:
      - datalake_customer_support.email.id_ticket
      - datalake_customer_support.email.csat_score
  num_ticket_neutral:
    description: Grouping of tickets classified as neutral by contract.
    lineage:
      - datalake_customer_support.email.id_ticket
      - datalake_customer_support.email.csat_score
  num_ticket_dissatisfied:
    description: Grouping of tickets classified as dissatisfied by contract.
    lineage:
      - datalake_customer_support.email.id_ticket
      - datalake_customer_support.email.csat_score
