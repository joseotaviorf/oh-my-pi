---
database_name: datalake_offboarding
table_name: customer_support
description:
  Enrichment table that aims to gather satisfaction information from the
  customer support context. The granularity of this table is the contract.
domain: Support and Services
owner: data-ae-ss@quintoandar.com.br
columns:
  id_contract:
    lineage:
      - datalake_offboarding.ongoing.id_contract
      - datalake_ebdb_contract.contract_person.id_contract
    description: Contract identifier associated with the ongoing record and linked contracts.
  department:
    lineage:
      - datalake_customer_support.tickets.last_queue
    description: Department or queue where the ticket was last handled.
  front_or_back:
    lineage:
      - datalake_customer_support.tickets.front_or_back
    description: Indicates whether the support interaction was front-end or back-end.
  num_ticket_satisfied:
    lineage:
      - datalake_customer_support.csat.csat
      - datalake_customer_support.tickets.id_ticket
    description: Number of tickets with a customer satisfaction score of 4 or higher.
  num_ticket_neutral:
    lineage:
      - datalake_customer_support.csat.csat
      - datalake_customer_support.tickets.id_ticket
    description: Number of tickets with a customer satisfaction score of exactly 3.
  num_ticket_dissatisfied:
    lineage:
      - datalake_customer_support.csat.csat
      - datalake_customer_support.tickets.id_ticket
    description: Number of tickets with a customer satisfaction score of 2 or lower.
