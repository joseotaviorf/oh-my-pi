---
database_name: datalake_offboarding
table_name: contract_anomaly
description: Contains the information about the contracts that are anomalies filtering just the BR contracts.
  A contract in anomaly is when the termination was requested more than 20 days and it's not finished.
domain: Support and Service
owner: kleber.inoue@quintoandar.com.br
columns:
  id_contract:
    lineage:
      - datalake_offboarding.contract_termination.id_contract
    description: Contract unique identifier.
  termination_status:
    lineage:
      - datalake_offboarding.contract_termination.status
    description: Status of the termination.
  is_anomaly:
    description: Boolean value to check if the contract is an anomaly.
      That is, when the termination was requested more than 20 days and it's not with status DONE.
  dt_termination:
    lineage:
      - datalake_offboarding.contract_termination.dt_termination
    description: Date of the contract's termination.
  dt_termination_finished:
    lineage:
      - datalake_offboarding.contract_termination.dt_termination
    description: Offboarding process completion date
  dt_termination_expected_finish:
    lineage:
      - datalake_offboarding.contract_termination.dt_termination
    description: Date of when the termination should be finished, that is, 20 days ahead of dt_termination.
      If the termination is not completed until this date, the termination is an anomaly.