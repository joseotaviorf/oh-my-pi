---
database_name: datalake_offboarding
table_name: budgeting_window
description:
  Enrichment table that sought to consolidate budget information related to the
  post-contract context (offboarding). Each row in this table represents an offboarding ticket.
domain: Support and Services
owner: data-ae-ss@quintoandar.com.br
columns:
  id_ticket:
    lineage:
      - datalake_customer_support.tickets.id_ticket
    description: Unique identifier for the customer support ticket.
  id_contract:
    lineage:
      - datalake_customer_support.tickets.custom_fields
    description: Contract code associated with the ticket.
  id_house:
    lineage:
      - datalake_customer_support.tickets.custom_fields
    description: House code associated with the ticket.
  channel:
    description: Communication channel through which the ticket was received, set to 'email'.
  agent_email:
    lineage:
      - datalake_customer_support.tickets.last_analyst_email
    description: Email address of the last analyst who handled the ticket.
  agent_name:
    lineage:
      - datalake_support_users.analysts.name
    description: Name of the analyst associated with the ticket.
  agent_company:
    lineage:
      - datalake_support_users.analysts.organization
    description: Company or organization the analyst belongs to.
  department:
    lineage:
      - datalake_customer_support.tickets.last_queue
    description: Department or queue where the ticket was last handled.
  demand_type:
    lineage:
      - datalake_customer_support.tickets.custom_fields
    description: Type of demand or request associated with the ticket.
  process_type:
    lineage:
      - datalake_customer_support.tickets.custom_fields
    description: Type of process involved in the ticket.
  client_type:
    lineage:
      - datalake_customer_support.tickets.custom_fields
    description: Type of client associated with the ticket.
  client_description:
    lineage:
      - datalake_customer_support.tickets.custom_fields
    description: Description of the client based on the ticket data.
  repairs_sent_pp:
    lineage:
      - datalake_customer_support.tickets.custom_fields
    description: Indicates if repairs were sent to PP (Post-Processing).
  reanalysis_repairs:
    lineage:
      - datalake_customer_support.tickets.custom_fields
    description: Indicates if reanalysis of repairs is required.
  interaction_pp:
    lineage:
      - datalake_customer_support.tickets.custom_fields
    description: Details of interaction with PP (Post-Processing).
  budgeting_performed:
    lineage:
      - datalake_customer_support.tickets.custom_fields
    description: Indicates if budgeting was performed for the ticket.
  budgeting_sent_pp:
    lineage:
      - datalake_customer_support.tickets.custom_fields
    description: Indicates if budgeting details were sent to PP.
  budgeting_sent_iq:
    lineage:
      - datalake_customer_support.tickets.custom_fields
    description: Indicates if budgeting details were sent to IQ.
  intermediation_with_parties:
    lineage:
      - datalake_customer_support.tickets.custom_fields
    description: Details of intermediation with involved parties.
  agreement_execution:
    lineage:
      - datalake_customer_support.tickets.custom_fields
    description: Indicates if an agreement was executed.
  finishing:
    lineage:
      - datalake_customer_support.tickets.custom_fields
    description: Status indicating the ticket is being finalized.
  budget_value:
    lineage:
      - datalake_customer_support.tickets.custom_fields
    description: Monetary value associated with the budgeting.
  budget_range:
    lineage:
      - datalake_customer_support.tickets.custom_fields
    description: Range category of the budgeting value.
  tags:
    lineage:
      - datalake_customer_support.tickets.custom_fields
    description: Tags related to the conclusion of repair reanalysis.
  agreement_between_parties:
    lineage:
      - datalake_customer_support.tickets.custom_fields
    description: Details of agreements made between parties involved.
  is_solved:
    lineage:
      - datalake_customer_support.csat.is_solved
    description: Indicates whether the ticket has been resolved.
  dt_communicated_iq:
    lineage:
      - datalake_customer_support.tickets.custom_fields
    description: Date when communication was sent to IQ.
  dt_intermediate:
    lineage:
      - datalake_customer_support.tickets.custom_fields
    description: Date of intermediation with parties.
  dt_agreement_executed:
    lineage:
      - datalake_customer_support.tickets.custom_fields
    description: Date when the agreement was executed.
  dt_finished:
    lineage:
      - datalake_customer_support.tickets.custom_fields
    description: Date when the ticket was finalized.
  dt_return:
    lineage:
      - datalake_customer_support.tickets.custom_fields
    description: Date scheduled for returning to the client.
  dt_budgeted:
    lineage:
      - datalake_customer_support.tickets.custom_fields
    description: Date when budgeting was performed.
  dt_analysis:
    lineage:
      - datalake_customer_support.tickets.custom_fields
    description: Date when repairs were sent to PP for analysis.
  dt_reanalysis:
    lineage:
      - datalake_customer_support.tickets.custom_fields
    description: Date when reanalysis of repairs was conducted.
  dt_started:
    lineage:
      - datalake_customer_support.tickets.ts_created
    description: Date when the ticket was created.
  dt_closed:
    lineage:
      - datalake_customer_support.tickets.ts_closed
    description: Date when the ticket was closed.
