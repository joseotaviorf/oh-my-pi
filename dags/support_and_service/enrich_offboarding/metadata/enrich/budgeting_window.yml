---
database_name: datalake_offboarding
table_name: budgeting_window
description:
  Enrichment table that sought to consolidate budget information related to the
  post-contract context (offboarding). Each row in this table represents an offboarding ticket.
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  custom_fields:
    description: Data in json format that contains general information about the service ticket.
    lineage:
      - datalake_customer_support.email.custom_fields
  id_ticket:
    description: Unique identification key for the service ticket.
    lineage:
      - datalake_customer_support.email.id_ticket
  id_contract:
    description: Identification key of the contract related to the offboarding ticket.
    lineage:
      - datalake_customer_support.email.custom_fields
  id_house:
    description: House identification key related to the offboarding ticket.
    lineage:
      - datalake_customer_support.email.custom_fields
  channel:
    description: Channel for receiving service.
  agent_email:
    description: Email of the analyst who handled the ticket.
    lineage:
      - datalake_customer_support.email.agent_email
  agent_name:
    description: Name of the analyst who handled the ticket.
    lineage:
      - datalake_support_users.analysts.name
  agent_company:
    description: Organization of the analyst who handled the ticket.
    lineage:
      - datalake_support_users.analysts.organization
  department:
    description: Descriptive data that indicates which department the ticket is linked to.
    lineage:
      - datalake_customer_support.email.department
  demand_type:
    description: Descriptive information from the custom field, which indicates the type of demand generated by the ticket.
    lineage:
      - datalake_customer_support.email.custom_fields
  process_type:
    description: Descriptive information from the custom field, which indicates the type of process generated by the ticket.
    lineage:
      - datalake_customer_support.email.custom_fields
  client_type:
    description: Type of customer who requested the service.
    lineage:
      - datalake_customer_support.email.custom_fields
  client_description:
    description: Customer description related to service.
    lineage:
      - datalake_customer_support.email.custom_fields
  repairs_sent_pp:
    description: Boolean information indicating whether the repair was sent to the owner.
    lineage:
      - datalake_customer_support.email.custom_fields
  reanalysis_repairs:
    description: Boolean information that indicates whether a reanalysis of the repair was sent.
    lineage:
      - datalake_customer_support.email.custom_fields
  interaction_pp:
    description: Boolean information that indicates whether there was interaction with the owner.
    lineage:
      - datalake_customer_support.email.custom_fields
  budgeting_performed:
    description: Boolean data that indicates whether a budget was created.
    lineage:
      - datalake_customer_support.email.custom_fields
  budgeting_sent_pp:
    description: Boolean data that indicates whether the quote was sent to the owner.
    lineage:
      - datalake_customer_support.email.custom_fields
  budgeting_sent_iq:
    description: Boolean data that indicates whether the quote was sent to the tenant.
    lineage:
      - datalake_customer_support.email.custom_fields
  intermediation_with_parties:
    description: Boolean data that indicates whether there was intermediation between the parties in the process.
    lineage:
      - datalake_customer_support.email.custom_fields
  agreement_execution:
    description: Boolean data that indicates whether the agreement was executed.
    lineage:
      - datalake_customer_support.email.custom_fields
  finishing:
    description: Boolean data that indicates whether the process has already completed.
    lineage:
      - datalake_customer_support.email.custom_fields
  budget_value:
    description: Numerical information about the budget amount.
    lineage:
      - datalake_customer_support.email.custom_fields
  budget_range:
    description: Descriptive data with information about the value range in which the budget fits.
    lineage:
      - datalake_customer_support.email.custom_fields
  tags:
    description: Tags related to service.
    lineage:
      - datalake_customer_support.email.custom_fields
  agreement_between_parties:
    description: Descriptive information about the agreement between the parties.
    lineage:
      - datalake_customer_support.email.custom_fields
  is_solved:
    description: Boolean data that indicates whether the service ticket was resolved.
    lineage:
      - datalake_customer_support.email.is_solved
  dt_communicated_iq:
    description: Date on which communication with the tenant occurred.
    lineage:
      - datalake_customer_support.email.custom_fields
  dt_intermediate:
    description: Date on which the intermediation between the negotiating parties took place.
    lineage:
      - datalake_customer_support.email.custom_fields
  dt_agreement_executed:
    description: Date the agreement was accepted.
    lineage:
      - datalake_customer_support.email.custom_fields
  dt_finished:
    description: Process completion date.
    lineage:
      - datalake_customer_support.email.custom_fields
  dt_return:
    description: Date defined as the return of the process.
    lineage:
      - datalake_customer_support.email.custom_fields
  dt_budgeted:
    description: Date on which the budget was made.
    lineage:
      - datalake_customer_support.email.custom_fields
  dt_analysis:
    description: Date the repair was sent to the owner.
    lineage:
      - datalake_customer_support.email.custom_fields
  dt_reanalysis:
    description: Date on which the repair reanalysis occurred.
    lineage:
      - datalake_customer_support.email.custom_fields
  dt_started:
    description: Date format that indicates the start of the ticket.
    lineage:
      - datalake_customer_support.email.dt_started
  dt_closed:
    description: Date that indicates the completion of the ticket.
    lineage:
      - datalake_customer_support.email.dt_closed
