---
database_name: datalake_tracksale
table_name: answer_cities
description: >-
  Enriched Tracksale NPS answers with city attribution rules applied for geographic analysis; one
  row per survey response. City resolution may join datalake_firestore.sale_offer, a static table from
  the deprecated enrich_sale_firestore pipeline (legacy Firestore/Monday system inactive since 2024),
  for historical offer context only.
domain: Support and Services
owner: gabriel.firmino@quintoandar.com.br
columns:
  id_answer:
    lineage:
      - datalake_tracksale.answer_tags.id_answer
    description: Response identifier (related to the trigger) sent by the user.
  city:
    lineage:
      - datalake_ebdb_clean.house.city
      - datalake_tracksale.answer_tags.tag_value
    description: City related to location associated with the respondent.
