---
database_name: datalake_tracksale
table_name: customer_conversions
description: This table unifies dispatch-level records, especially customer information. Each row in this table must be a dispatch record.
domain: Support and Services
owner: data-ae-ss@quintoandar.com.br
columns:
  id_dispatch:
    lineage:
      - datalake_tracksale.answer.id
      - datalake_tracksale.dispatch.id
    description: Key of each individual NPS dispatch to a customer in a campaign.
  id_dispatch_user:
    lineage:
      - datalake_tracksale.answer.id
      - datalake_tracksale.dispatch.id
      - datalake_ebdb_user.user.uuid_person
    description: Key of each individual NPS dispatch to a customer in a campaign.
  id_dispatch_lot:
    lineage:
      - datalake_tracksale.dispatch.id
    description: Identification key related to the batch of NPS shots.
  uuid_person:
    lineage:
      - datalake_ebdb_user.user.uuid_person
    description: Unique client uuid identification 
  id_user:
    lineage:
      - datalake_tracksale.answer_tags.tag_value
      - datalake_ebdb_clean.user.id
      - datalake_ebdb_customer_contact_identification.customer_contact_identification.id_user
    description: Client identification from main (EBDB)
  id_customer:
    lineage:
      - datalake_tracksale.dispatch.customers
    description:
      "Key of NPS customer in a dispatch. Formed by the three contact info
      availables: email, phone and name, if provided."
  customer_email:
    lineage:
      - datalake_tracksale.dispatch.customers
    description: User email related to dispatch.
  customer_phone:
    lineage:
      - datalake_tracksale.dispatch.customers
    description: User phone related to dispatch.
  id_answer:
    lineage:
      - datalake_tracksale.answer.id
    description:
      Key of the NPS answer from the customer in each dispatch (the last
      if multiple, which is rare).
  is_customer_identified:
    lineage:
      - datalake_tracksale.dispatch.customers
    description:
      Boolean that indicates if the customer is identified through the
      id_customer, if the id_customer exists then it is True.
  customer_type:
    lineage:
      - datalake_tracksale.campaign.customer_type
    description: Description of customer type
  status:
    lineage:
      - datalake_tracksale.dispatch.status
    description: Dispatch tracking information.
  id_campaign:
    lineage:
      - datalake_tracksale.dispatch.id_campaign
    description: Key of NPS campaign, which is a definition of a certain customer
      experience survey.
  ts_dispatch_created:
    lineage:
      - datalake_tracksale.dispatch.ts_created
    description: Timestamp in which the NPS survey was dispatched to the customers.
