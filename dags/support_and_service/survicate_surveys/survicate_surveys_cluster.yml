cluster:
  type: consolidation_xs_general_cluster
  databricks_conn_id: databricks_new
  custom_libraries:
  - whl: '{artifacts_bucket}/survicate-api-client-python/quintoandar_survicate_api_client-0.1.0-py2.py3-none-any.whl'
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
    aws_attributes:
      ebs_volume_size: 200
    num_workers: 3
    driver_node_type_id: m6g.xlarge
