dag:
  name: survicate_surveys
  owner: Data SS
  schedule_start_date: 2020, 11, 1
  schedule_interval: 0 1 * * *
  documentation:
    dag_purpose: |
      Get survey response collected from [Survicate](https://developers.survicate.com/data-export/#get-the-list-of-surveys).
workflow:
  type: custom_ingestion
  layer: raw
  custom_schema: survicate
  load_spark_job: load_survicate_surveys_raw
  spark_job_arguments:
  - "{environment}"
  - "{bucket}"
  - "{{ data_interval_start | ds }}"
  - "{dag_name}"
  - "{table_name}"
  - "{partitions}"
  - "{schema}"

  default_extraction_type: incremental
  default_partitions: [year, month, day]
  tables_customization:
    surveys: {}

