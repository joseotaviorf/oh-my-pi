---
database_name: datalake_static_files_ss
table_name: robbyson_indicators
description:
  Enrichment table with the aim of generating indicator information to be sent to the Robbyson tool.
  The granularity of this table follows the name of the indicators.
domain: Support and Services
owner: data-ae-ss@quintoandar.com.br
columns:
  id_indicator:
    description: Unique indicator identifier, generated based on the indicator name.
  name:
    description: Descriptive information indicating the name of the indicator.
  attributes:
    description: Struct type information that contains the indicator description data, in addition to the array that indicates which columns are used to calculate the indicator.
  context:
    description: Information that indicates the line responsible for the indicator.
  ts_load:
    description: Timestamp indicating the date the record was loaded.
