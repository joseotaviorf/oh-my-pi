dag:
  name: enrich_static_files_ss
  schedule_start_date: 2024, 3, 26
  owner: Data SS
  documentation:
    dag_purpose: |
      Static dag with the objective of loading any type of information that will be updated only when the data changes.
workflow:
  type: query_delta
  layer: enrich
cluster:
  type: databricks_12_2_med_general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
