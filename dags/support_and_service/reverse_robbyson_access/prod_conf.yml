---
dag_documentation:
  dag_purpose: |
    This dag aims to send analyst productivity data to the Robbyson tool. The dag proposes to send data from more than one line.
api_url: https://integration-api.robbyson.com/v1
endpoint: results
configurations:
  support_and_services:
    results_table_path: dw_customer_support.fact_analysts_performance
    agent_table_path: dw_customer_support.dim_agent
    key_join_tables: sk_agent
    analyst_key_column: email
  fintech:
    results_table_path: dw_operator_performance.fact_operator_performance
    agent_table_path: dw_operator_performance.dim_operator
    key_join_tables: sk_operator
    analyst_key_column: email
