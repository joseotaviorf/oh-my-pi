database_name: datalake_greenseer
table_name: sessions
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
description:
  This table presents session data from the chatbots along with retention attempt data
  from the JourneyFlow service and customer support data from the Sauron service.
  This table holds the last update of every chat session from the Chatbot. The goal of this table
  is mainly to break down relevant information from the 'memory' column.
columns:
  id_session:
    lineage:
      - datalake_greenseer_clean.session.id_session
    description: Session unique identifier.
  id_ticket:
    lineage:
      - datalake_customer_support.unified_tickets.id_ticket
    description: Unique ticket identifier (generated by zendesk).
  id_user:
    lineage:
      - datalake_greenseer_clean.session.memory
    description: User unique identifier.
  id_pipeline:
    lineage:
      - datalake_greenseer_clean.session.id_pipeline
    description: Dialog script identifier.
  id_content:
    lineage:
      - datalake_journey_flow_clean.journey_flow.id_content
    description: Content unique identifier.
  id_contract:
    lineage:
      - datalake_greenseer_clean.session.memory
    description: Contract unique identifier.
  has_journey_flow_response:
    lineage:
      - datalake_journey_flow_clean.journey_flow.fired_response
    description: Boolean value that indicates whether a session has a retention message.
  before_reception:
    lineage:
      - datalake_greenseer_clean.session.memory
    description: DialogFlow intent identifier of the active support flow.
  after_reception:
    lineage:
      - datalake_greenseer_clean.session.memory
    description: DialogFlow intent identifier of the after reception flow.
  response_key:
    lineage:
      - datalake_greenseer_clean.session.memory
    description: Response key of the retention message we sent as a consequence of the selected taxonomy (or null if no message was sent).
  automatic_selection:
    description: Tag that indicates whether the contact reason taxonomy was added automatically by machine learning models.
    lineage:
      - datalake_greenseer_clean.session.memory
  context_message:
    description: String containing the session context message that will be used by machine learning models.
    lineage:
      - datalake_greenseer_clean.session.memory
  created_by_hsm:
    description: HSM identifier that originated the session (if applicable).
    lineage:
      - datalake_greenseer_clean.session.memory
  tags:
    description: Information generated (tags) from the interaction of the user with the chatbot.
    lineage:
      - datalake_greenseer_clean.session.memory
  flags:
    description: Flags that Skynet/PostoIpiranga built upon data available in 5A's Main.
    lineage:
      - datalake_greenseer_clean.session.memory
  current_state:
    description: Current state of the state machine from a dialog script.
    lineage:
      - datalake_greenseer_clean.session.current_state
  is_menu_available:
    description: Boolean indicating whether the menu options message was shown to the user
  is_more_help_required:
    description: Boolean value that indicates if a user needs more help.
    lineage:
      - datalake_greenseer_clean.session.memory
  is_problem_solved:
    description: Boolean value that indicates whether the user's problem has been solved.
    lineage:
      - datalake_greenseer_clean.session.memory
  is_retention:
    description: Boolean that identifies service retention, is generated by the condition - agent is not null and agent != "QuintoAndar".
    lineage:
      - datalake_sauron_clean.session.agent
  is_recontact:
    description: Boolean that identifies a recontact service, is generated by the condition - agent is not null and agent == "QuintoAndar".
    lineage:
      - datalake_greenseer_clean.session.memory
  recontact_time:
    description: Time in minutes that the user took to recontact the service.
    lineage:
      - datalake_greenseer_clean.session.memory
    categories:
      '<12h': Recontact before 12h
      '12-96h': Recontact between 12h and 96h
      '>96h': Recontact after 96h
      'NR': Did not return
  memory:
    lineage:
      - datalake_greenseer_clean.session.memory
    description: JSON field containing all relevant data from the Chatbot interaction
  has_same_previous_theme:
    description: Boolean that indicates whether the user has the same previous theme.
    lineage:
      - datalake_greenseer_clean.session.memory
  has_exceeded_session_timeout:
    description: Boolean that indicates that a service has exceeded the response time, the time for a service response is 4 hours.
    lineage:
      - datalake_greenseer_clean.session.ts_ended
      - datalake_greenseer_clean.session.ts_started
  has_fallback:
    description: Boolean that indicates whether the session has a fallback.
    lineage:
      - datalake_greenseer_clean.session.memory
  context_detection_attempts:
    description: Number of attempts to detect the context of the session.
    lineage:
      - datalake_greenseer_clean.session.memory
  ticket_origin:
    description: Origin of the ticket.
    lineage:
      - datalake_customer_support.unified_tickets.ticket_origin
  ts_updated:
    description: Timestamp date that indicates when the session was last executed.
    lineage:
      - datalake_greenseer_clean.session.ts_updated
  ts_started:
    description: Session start timestamp.
    lineage:
      - datalake_greenseer_clean.session.ts_started
  ts_ended:
    description: Session end timestamp.
    lineage:
      - datalake_greenseer_clean.session.ts_ended
  year:
    description: Partition year.
  month:
    description: Partition month.
  day:
    description: Partition day.
  ts_load:
    description: Timestamp date that indicates when the query was last executed.