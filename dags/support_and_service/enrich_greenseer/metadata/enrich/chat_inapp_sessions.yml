database_name: datalake_greenseer
table_name: chat_inapp_sessions
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
description:
  This table holds the last update of every chat session from the Chatbot, selecting data regarding InApp Chat
  access and migration strategies. The goal of this table is mainly to break down relevant information
  from the 'memory' column.
columns:
  id_session:
    lineage:
      - datalake_greenseer_clean.session.id_session
    description: Session unique identifier.
  id_user:
    lineage:
      - datalake_greenseer_clean.session.memory
    description: User unique identifier.
  id_user_legacy:
    lineage:
      - datalake_greenseer_clean.session.memory
    description: User legacy unique identifier.
  strategy:
    lineage:
      - datalake_greenseer_clean.session.memory
    description: Whatsapp to InApp Chat migration strategy
  jon_snow_with_context:
    lineage:
      - datalake_greenseer_clean.session.memory
    description: Jon Snow data
  jon_snow_no_context:
    lineage:
      - datalake_greenseer_clean.session.memory
    description: Jon Snow data
  jon_snow_greeting:
    lineage:
      - datalake_greenseer_clean.session.memory
    description: Jon Snow data
  jon_snow_no_answer_needed:
    lineage:
      - datalake_greenseer_clean.session.memory
    description: Jon Snow data
  taxonomy:
    lineage:
      - datalake_greenseer_clean.session.memory
    description: Taxonomy of the bot answer
  need_more_help_after_reception:
    lineage:
      - datalake_greenseer_clean.session.memory
    description: Client's answer regarding if they still want to talk to an agent after talking to the bot
  tags:
    lineage:
      - datalake_greenseer_clean.session.memory
    description: Tags from the bot answer
  has_chat_inapp_access:
    lineage:
      - datalake_greenseer_clean.session.memory
    description: Boolean if the client has access to the InApp Chat feature
  ts_started:
    lineage:
      - datalake_greenseer_clean.session.ts_started
    description: Session start timestamp.
  ts_ended:
    lineage:
      - datalake_greenseer_clean.session.ts_ended
    description: Session end timestamp.
