table_name: datalake_greenseer.sessions
alert_channel: "#alerts-de-airflow-dags"
table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error
column_level_validations:
  id_session:
    is_complete:
      severity_level: Error
    is_unique:
      severity_level: Error
  ts_started:
    is_complete:
      severity_level: Error
    is_unique:
      severity_level: Error
  has_journey_flow_response:
    is_complete:
      severity_level: Error