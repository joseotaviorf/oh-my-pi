database_name: datalake_repairs_test_clean
table_name: repair_request_budget
description:
  Repair budget data, only for requests where the property owner requests a tenant service provider.
  These requests are created via Zendesk.
owner: data-ae-ss@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_repairs_test_raw.repair_request_budget.id
    description: Repair request budget unique key
  id_repair_request:
    lineage:
      - datalake_repairs_test_raw.repair_request_budget.repair_request_id
    description: Unique key referring to the repair_request, we use it to link the repair_request created and the quote sent for it
  id_approver:
    lineage:
      - datalake_repairs_test_raw.repair_request_budget.approved_by
    description: Identifier referring to the user who approved the budget
  id_budget_sender:
    lineage:
      - datalake_repairs_test_raw.repair_request_budget.registered_by
    description: Identifier referring to the user who sent the quote
  status:
    lineage:
      - datalake_repairs_test_raw.repair_request_budget.status
    description: It is a containing enum that indicates what the current status of the budget is.
    categories:
      WAITING_ANALYSIS: The budget is waiting for analysis status.
      IN_ANALYSIS: The budget is in analysis status.
      APPROVED: The budget is approved.
      DENIED: The budget is denied.
  total_price:
    lineage:
      - datalake_repairs_test_raw.repair_request_budget.total_price
    description: Referring to the total budget price
  service_provider:
    lineage:
      - datalake_repairs_test_raw.repair_request_budget.service_provider
    description: |
      It is a jsonb with the name and phoneNumber values of the indicated service provider within the budget
      Example: {name: 'so-and-so', phoneNumber: '551299999999'}
  is_allowed_service_provider_info_sharing:
    lineage:
      - datalake_repairs_test_raw.repair_request_budget.allowed_service_provider_info_sharing
    description: Indicates that the tenant has accepted that the budget information is true and can be shared
  ts_created:
    lineage:
      - datalake_repairs_test_raw.repair_request_budget.created_at
    description: Budget creation date
  ts_updated:
    lineage:
      - datalake_repairs_test_raw.repair_request_budget.updated_at
    description: Budget update date
