database_name: datalake_repairs_test_clean
table_name: attachment
description: Documents attached to the repair request budget
owner: data-ae-ss@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_repairs_test_raw.attachment.id
    description: Attachment unique identifier
  id_contract:
    lineage:
      - datalake_repairs_test_raw.attachment.contract_id
    description: Unique identifier of the contract
  file_name:
    lineage:
      - datalake_repairs_test_raw.attachment.file_name
    description: |
      This field represents the name of the uploaded file. It is a text and will
      always be a uuid following the contentType which refers to the image format.
      Example: 123123-131231-123123-123123.png
  content_type:
    lineage:
      - datalake_repairs_test_raw.attachment.content_type
    description: This field refers to the format of the image.
    categories:
      image/png: The image type is PNG.
      image/jpeg: The image type is JPEG.
      image/jpg: The image type is JPG.
      application/pdf: The application type is PDF. 
