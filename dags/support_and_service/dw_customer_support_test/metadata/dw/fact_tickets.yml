database_name: dw_customer_support_test
table_name: fact_tickets
description: Fact table with metrics related to support tickets
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  sk_ticket:
    lineage:
      - datalake_customer_support_test.tickets.id_ticket
    description: Unique ticket identifier (generated by zendesk).
  sk_taxonomy:
    lineage:
      - datalake_customer_support_test.tickets.step_tag
      - datalake_customer_support_test.tickets.customer_type_tag
      - datalake_customer_support_test.tickets.client_type
      - datalake_customer_support_test.tickets.request_type
      - datalake_customer_support_test.tickets.contact_motivation_tag
      - datalake_customer_support_test.tickets.contact_theme_tag
      - datalake_customer_support_test.tickets.contact_theme_detail_tag
    description: Key generated as a MD5 from all taxonomies fields.
  sk_analyst:
    lineage:
      - datalake_customer_support_test.tickets.id_analyst
    description: Id of the last agent that answered this ticket.
  sk_department:
    lineage:
      - datalake_customer_support_test.tickets.id_queue
    description: Key generated as a MD5 from the last department from Twilio
      it if is a chat/call support, otherwise we consider the zendesk department.
  sk_user:
    lineage:
      - datalake_customer_support_test.tickets.id_user
    description: Unique user identifier.
  sk_contract:
    lineage:
      - datalake_customer_support_test.tickets.id_contract
    description: Unique contract identifier.
  sk_session:
    lineage:
      - datalake_customer_support_test.tickets.id_session
    description: Session ID from Sauron
  channel:
    lineage:
      - datalake_customer_support_test.tickets.channel
    description: Identify the channel for this ticket (call, chat, email).
  ticket_origin:
    description: It is the source channel of the chat ticket, which can be whatsapp or chat5A.
    lineage:
      - datalake_customer_support_test.tickets.ticket_origin
  context:
    description: Context of the ticket.
    categories:
      "ForRent":
        Ticket is considered from the ForRent context because has subjourney 'Contract to Entrance',
        'Listing & Search', 'Offboarding', 'Onboarding' or 'Visits to Offer'.
      "ForSale": Ticket is considered from the ForSale context because has subjourney 'For Sale'.
      "Partners": Ticket is considered from the Partners context because has subjourney 'Partners'.
    lineage:
      - datalake_customer_support_test.tickets.context
  csat_score:
    lineage:
      - datalake_customer_support_test.tickets.csat_score
    description: Last CSAT score (value goes from 1 to 5).
  first_csat_score:
    lineage:
      - datalake_customer_support_test.tickets.first_csat_score
    description: First CSAT score (value goes from 1 to 5).
  status:
    lineage:
      - datalake_customer_support_test.tickets.status
    description: Ticket status.
  front_or_back:
    lineage:
      - datalake_customer_support_test.tickets.front_or_back
    description:
      Given the main department define if this ticket is front or back.
      This column have undefined values in case there is no definition of this value
      in the department_control sheet for this specific main department.
  ticket_rate_weight:
    lineage:
      - datalake_customer_support_test.tickets.ticket_rate_weight
    description: The weight applied to the ticket if it's part of the ticket rate calculation.
    categories:
      "1":
        Ticket rate weight is 1 and is based on being a front ticket and in the sub journeys 'Contract to Entrance',
        'For Sale', 'Listing & Search', 'Offboarding', 'Onboarding', 'Partners' or 'Visits to Offer'.
      "2":
        Ticket rate weight is 2 and is based on being a back ticket and in the sub journeys 'Contract to Entrance',
        'For Sale', 'Listing & Search', 'Offboarding', 'Onboarding', 'Partners' or 'Visits to Offer'.
      "15": Ticket rate weight is 15 and is based on being a front ticket and in the sub journey 'Ongoing'.
      "30": Ticket rate weight is 30 and is based on being a back ticket and in the sub journey 'Ongoing'.
      "Null": No weight applied if the ticket is not part of the ticket rate rules.
  total_tickets_proportional:
    description:
      The total tickets proportional calculation related to the ticket, considering the ticket's weight,
      abandoned calls and tickets without theme.
      This column is exclusive for tickets that are part of the Ticket Rate metric.
  first_resolution_time_min_business:
    lineage:
      - datalake_zendesk.tickets_current.first_resolution_time_min_business
    description: Number of minutes to the first resolution time during business hours
  first_resolution_time_min_calendar:
    lineage:
      - datalake_zendesk.tickets_current.first_resolution_time_min_calendar
    description: Number of minutes to the first resolution time during calendar hours
  full_resolution_time_min_business:
    lineage:
      - datalake_zendesk.tickets_current.full_resolution_time_min_business
    description: Number of minutes to the full resolution during business hours
  full_resolution_time_min_calendar:
    lineage:
      - datalake_zendesk.tickets_current.full_resolution_time_min_calendar
    description: Number of minutes to the full resolution during calendar hours
  requester_wait_time_min_business:
    lineage:
      - datalake_zendesk.tickets_current.requester_wait_time_min_business
    description: Number of minutes the requester spent waiting during business hours
  requester_wait_time_min_calendar:
    lineage:
      - datalake_zendesk.tickets_current.requester_wait_time_min_calendar
    description: Number of minutes the requester spent waiting during calendar hours
  agent_wait_time_min_business:
    lineage:
      - datalake_zendesk.tickets_current.agent_wait_time_min_business
    description: Number of minutes the agent spent waiting during business hours
  agent_wait_time_min_calendar:
    lineage:
      - datalake_zendesk.tickets_current.agent_wait_time_min_calendar
    description: Number of minutes the agent spent waiting during calendar hours
  on_hold_time_min_business:
    lineage:
      - datalake_zendesk.tickets_current.on_hold_time_min_business
    description: Number of minutes on hold during business hours
  on_hold_time_min_calendar:
    lineage:
      - datalake_zendesk.tickets_current.on_hold_time_min_calendar
    description: Number of minutes on hold during calendar hours
  reopens:
    lineage:
      - datalake_zendesk.tickets_current.reopens
    description: Number of times the ticket was reopened
  replies:
    lineage:
      - datalake_zendesk.tickets_current.replies
    description: Number of public replies the agent added to the ticket
  is_ticket_rate:
    lineage:
      - datalake_customer_support_test.tickets.is_ticket_rate
    description:
      "Boolean flag indicating if the ticket is part of the ticket rate calculation.
      In order to be part of, the ticket must follow several rules:
      - The ticket area must be CX;
      - The ticket team could be anyone but Ong Back;
      - The ticket must be front or back, depending on the channel;
      - The ticket must not belong to a few departments (Rescisão por Inadimplência [OFF][POS][BACK], Offboarding Reparos [OFF] [POS] [BACK],
      Offboarding pré saída [OFF] [POS] [BACK], Proteção QuintoAndar [OFF] [POS] [BACK], Rescisão - Despejo [OFF][POS][BACK]
      or Rescisão 1 [OFF] [POS] [BACK]);
      - The date in which the ticket was solved must be later than 1st January/2022.
      - If the ticket has channel email, then we accept all directions;
      - If the ticket has channel chat, then we accept only direction inbound;
      - If the ticket has channel call, we accept only directions inbound and outbound-api."
  has_open_back_ticket:
    lineage:
      - datalake_customer_support_test.tickets.has_open_back_ticket
    description:
      Boolean that indicates if any of the related backoffice tickets have
      a status different than closed.
  total_backoffice_minutes_time:
    lineage:
      - datalake_customer_support_test.tickets.total_backoffice_minutes_time
    description: Time in minutes to close all related backoffice tickets.
  ts_created:
    lineage:
      - datalake_customer_support_test.tickets.ts_created
    description:
      Start timestamp. Note - for chat and call tickets this value is the
      first timestamp in our event tables. For email tickets we get the timestamp
      directly from zendesk.
  ts_sla_started:
    lineage:
      - datalake_customer_support_test.tickets.ts_sla_started
    description: Timestamp of then the SLA started
  ts_solved:
    lineage:
      - datalake_customer_support_test.tickets.ts_solved
    description:
      Solved timestamp. For chat and call this column have the same value
      as the closed timestamp. Note - for chat and call tickets this value is the
      last timestamp in our event tables. For email tickets we get the timestamp directly
      from zendesk.
  ts_closed:
    lineage:
      - datalake_customer_support_test.tickets.ts_closed
    description:
      Closed timestamp. This is an immutable column. Zendesk change the
      ticket from solved to closed automatically after 3 days it has been solved.
      Note - for chat and call tickets this value is the last timestamp in our event
      tables. For email tickets we get the timestamp directly from zendesk.
  ts_updated:
    lineage:
      - datalake_customer_support_test.tickets.ts_updated
    description: Timestamp of when the ticket was last updated
  ts_load:
    description: This timestamp indicates when this data was loaded into dw_customer_support.
