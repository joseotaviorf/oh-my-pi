dag:
  name: dw_customer_support_test
  schedule_start_date: 2021,2,7
  owner: Data SS
  documentation:
    dag_purpose: |
      New test DAG for dw_customer_support
workflow:
  type: query_delta
  layer: dw
  custom_schema: customer_support_test
  default_extraction_type: incremental
  default_partitions: [year, month, day]
  tables_customization:
    fact_ivr_interactions:
      z_order_by: [sk_task]
      merge_on: [sk_interaction]

cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: r7g.xlarge
    node_type_id: r7g.xlarge
    spark_version: 13.3.x-scala2.12
    num_workers: 1
