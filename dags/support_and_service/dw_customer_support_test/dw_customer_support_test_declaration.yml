dag:
  name: dw_customer_support_test
  schedule_start_date: 2021,2,7
  owner: Data SS
  documentation:
    dag_purpose: |
      New test DAG for dw_customer_support
workflow:
  type: query_delta
  layer: dw
  custom_schema: customer_support_test
  default_extraction_type: incremental
  tables_customization:
    fact_ivr_interactions:
      z_order_by: [sk_task]
      merge_on: [sk_interaction]
    fact_customer_contacts:
      z_order_by: [sk_contact, sk_interaction]
      merge_on:
        [
          sk_contact,
          sk_interaction,
          sk_user,
          sk_department,
          sk_from_department,
          sk_to_department,
        ]

cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: r7g.xlarge
    node_type_id: r7g.xlarge
    spark_version: 13.3.x-scala2.12
    num_workers: 1
