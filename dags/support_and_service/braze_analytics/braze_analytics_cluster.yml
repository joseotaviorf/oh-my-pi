cluster:
  type: databricks_13_3_med_general_driver_2_min_workers_cluster
  custom_libraries:
  - whl: "{artifacts_bucket}/braze-api-client-python/quintoandar_braze_api_client-0.1.0-py2.py3-none-any.whl"
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
validation:
  cluster:
    type: consolidation_xs_general_cluster
    databricks_conn_id: databricks_new
    custom_libraries:
    - whl: '{artifacts_bucket}/braze-api-client-python/quintoandar_braze_api_client-0.1.0-py2.py3-none-any.whl'
    custom_configurations:
      spark_version: 13.3.x-scala2.12
      driver_node_type_id: m6g.xlarge
      aws_attributes:
        ebs_volume_size: 200
  allow_custom_spark_job: true
