---
database_name: datalake_braze_analytics_clean
table_name: campaign_analytics_owners
domain: Support and Services
owner: gabriel.firmino@quintoandar.com.br
description: Daily series of various stats for a campaign over time for the Owners app group. Data includes how many messages were sent, opened, clicked, or converted by messaging channel.
columns:
  id_campaign:
    description: Campaign ID as given by the Braze Platform.
    lineage:
      - datalake_braze_analytics_raw.campaign_analytics_owners.campaign_id
  messages:
    description: JSON containing information about campaign messaging stats and conversions broken down by channel.
    lineage:
      - datalake_braze_analytics_raw.campaign_analytics_owners.messages
  conversions_by_send_time:
    description: The number of conversions attributed to the date the campaign was sent (primary conversion event).
    lineage:
      - datalake_braze_analytics_raw.campaign_analytics_owners.conversions_by_send_time
  conversions1_by_send_time:
    description: The number of conversions for the second conversion event attributed to the date the campaign was sent.
    lineage:
      - datalake_braze_analytics_raw.campaign_analytics_owners.conversions1_by_send_time
  conversions2_by_send_time:
    description: The number of conversions for the third conversion event attributed to the date the campaign was sent.
    lineage:
      - datalake_braze_analytics_raw.campaign_analytics_owners.conversions2_by_send_time
  conversions3_by_send_time:
    description: The number of conversions for the fourth conversion event attributed to the date the campaign was sent.
    lineage:
      - datalake_braze_analytics_raw.campaign_analytics_owners.conversions3_by_send_time
  conversions:
    description: Total number of conversions attributed to the primary conversion event for the campaign.
    lineage:
      - datalake_braze_analytics_raw.campaign_analytics_owners.conversions
  conversions1:
    description: The number of conversions for the second conversion event defined in the campaign.
    lineage:
      - datalake_braze_analytics_raw.campaign_analytics_owners.conversions1
  conversions2:
    description: The number of conversions for the third conversion event defined in the campaign.
    lineage:
      - datalake_braze_analytics_raw.campaign_analytics_owners.conversions2
  conversions3:
    description: The number of conversions for the fourth conversion event defined in the campaign.
    lineage:
      - datalake_braze_analytics_raw.campaign_analytics_owners.conversions3
  unique_recipients:
    description: The number of unique recipients who received at least one message from the campaign.
    lineage:
      - datalake_braze_analytics_raw.campaign_analytics_owners.unique_recipients
  revenue:
    description: The total revenue in USD generated by the campaign for the given analytics period.
    lineage:
      - datalake_braze_analytics_raw.campaign_analytics_owners.revenue
  ts_campaign_analytics_time:
    description: Timestamp indicating the point in time to which the analytics results refer.
    lineage:
      - datalake_braze_analytics_raw.campaign_analytics_owners.time
  year:
    description: Year extracted from the analytics timestamp, used for data partitioning and time-based filtering.
    lineage:
      - datalake_braze_analytics_raw.campaign_analytics_owners.year
  month:
    description: Month extracted from the analytics timestamp, used for data partitioning and time-based filtering.
    lineage:
      - datalake_braze_analytics_raw.campaign_analytics_owners.month
  day:
    description: Day extracted from the analytics timestamp, used for data partitioning and time-based filtering.
    lineage:
      - datalake_braze_analytics_raw.campaign_analytics_owners.day
