---
dag_documentation:
  dag_purpose:
    "This DAG unifies various sources of satisfaction survey data, so that it is possible to stack
    and enrich these sources in a single view for the Support and Service line."

inner_dependencies:
  satisfaction_answers:
    - satisfaction_surveys_gsheets
    - satisfaction_surveys_zendesk
    - satisfaction_surveys_bigfone
    - satisfaction_surveys_chat_fup

partitions_cols: [year, month, day]

incremental_tables:
  - satisfaction_answers
  - satisfaction_surveys_gsheets
  - satisfaction_surveys_zendesk
  - satisfaction_surveys_bigfone
  - satisfaction_surveys_chat_fup
