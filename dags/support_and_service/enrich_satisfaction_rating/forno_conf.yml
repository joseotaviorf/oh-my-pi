---
dag_documentation:
  dag_purpose:
    "This DAG unifies various sources of satisfaction survey data, so that it is possible to stack
    and enrich these sources in a single view for the Support and Service line."

inner_dependencies:
  satisfaction_answers:
    - bigfone_surveys
    - chat_fup_surveys
    - gsheets_surveys
    - survicate_surveys
    - zendesk_surveys

partitions_cols: [year, month, day]

incremental_tables:
  - bigfone_surveys
  - chat_fup_surveys
  - gsheets_surveys
  - satisfaction_answers
  - survicate_surveys
  - zendesk_surveys
