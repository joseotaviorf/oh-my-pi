dag:
  name: enrich_satisfaction_rating
  schedule_start_date: 2022, 4, 19
  owner: Data SS
  documentation:
    dag_purpose: |
      This DAG unifies various sources of satisfaction survey data, so that it is possible to stack
      and enrich these sources in a single view for the Support and Service line.

workflow:
  type: query_delta
  layer: enrich
  default_extraction_type: incremental
  default_partitions: [year, month, day]
  inner_dependencies:
    satisfaction_answers:
      - bigfone_surveys
      - chat_fup_surveys
      - gsheets_surveys
      - survicate_surveys
      - zendesk_surveys
    tables_customization:
      satisfaction_answers:
        z_order_by:
          [
            id_ticket,
            id_contract,
            id_survey,
            id_answer,
            id_respondent,
            id_origin,
          ]
      bigfone_surveys:
        z_order_by: [id_ticket, id_answer, id_contract, id_user]
      chat_fup_surveys:
        z_order_by: [id_ticket, id_answer, id_contract, id_survey]
      gsheets_surveys:
        z_order_by: [id_answer, id_contract, id_survey]
      survicate_surveys:
        z_order_by:
          [
            id_ticket,
            id_contract,
            id_survey,
            id_answer,
            id_respondent,
            id_origin,
          ]
      zendesk_surveys:
        z_order_by: [id_ticket, id_answer, id_contract, id_respondent]

cluster:
  type: custom_cluster
  custom_configurations:
    spark_version: 13.3.x-scala2.12
    driver_node_type_id: m5a.4xlarge
    node_type_id: m5a.4xlarge
    num_workers: 2
    aws_attributes:
      availability: ON_DEMAND
