---
database_name: datalake_satisfaction_rating
table_name: bigfone_surveys
description: Unifies and enriches form satisfaction responses coming from Bigfone.
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  id_answer:
    description: Unique identifier of the satisfaction response.
    lineage:
      - datalake_bigfone_clean.event.id_call
      - datalake_bigfone_clean.event.ts_created
      - datalake_bigfone_clean.event.metadata
  id_contract:
    description: Identifier of the contract linked to the satisfaction response.
    lineage:
      - datalake_zendesk_ticket_funnels.tickets_funnel_metrics.id_contract
  id_ticket:
    description: If the satisfaction form was requested after a service, this, in general, will be linked to a service identifier in Zendesk.
    lineage:
      - datalake_zendesk_ticket_funnels.tickets_funnel_metrics.id_ticket
  id_user:
    description: Identifier of the person who answered the form.
    lineage:
      - datalake_zendesk_ticket_funnels.tickets_funnel_metrics.id_user
  service_type:
    description: Indicates the service that originated the satisfaction response.
  service_context:
    description: The context in which this service occurred.
  source_name:
    description: Satisfaction form source.
  satisfaction_score:
    description: Main satisfaction form responses.
    lineage:
      - datalake_bigfone_clean.event.csat_1
      - datalake_bigfone_clean.event.csat_2
      - datalake_bigfone_clean.event.csat_3
      - datalake_bigfone_clean.event.metadata
  score_description:
    description: Main satisfaction score description.
  ts_submitted:
    description: Date the satisfaction response was submitted.
    lineage:
      - datalake_bigfone_clean.event.ts_created
      - datalake_bigfone_clean.event.ts_created
  year:
    description: Year referring to the data loading day.
    lineage:
      - datalake_bigfone_clean.event.year
      - datalake_bigfone_clean.event.year
  month:
    description: Month referring to the data loading day.
    lineage:
      - datalake_bigfone_clean.event.month
      - datalake_bigfone_clean.event.month
  day:
    description: Day referring to the data loading day.
    lineage:
      - datalake_bigfone_clean.event.day
      - datalake_bigfone_clean.event.day
