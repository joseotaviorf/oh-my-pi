---
database_name: datalake_satisfaction_rating
table_name: satisfaction_answers
description: It unifies and enriches the satisfaction responses of the Support and Service line forms.
domain: Support and Services
owner: data-ae-ss@quintoandar.com.br
columns:
  id_answer:
    description: Unique identifier of the satisfaction response.
    lineage:
      - datalake_satisfaction_rating.gsheets_surveys.id_answer
      - datalake_satisfaction_rating.zendesk_surveys.id_answer
      - datalake_satisfaction_rating.bigfone_surveys.id_answer
      - datalake_satisfaction_rating.survicate_surveys.id_answer
      - datalake_satisfaction_rating.chat_fup_surveys.id_answer
  id_survey:
    description: Unique identifier of the satisfaction survey.
    lineage:
      - datalake_satisfaction_rating.gsheets_surveys.id_survey
      - datalake_satisfaction_rating.zendesk_surveys.source_name
      - datalake_satisfaction_rating.bigfone_surveys.source_name
      - datalake_satisfaction_rating.survicate_surveys.id_survey
      - datalake_satisfaction_rating.chat_fup_surveys.id_survey
      - datalake_satisfaction_rating.chat_fup_surveys.source_name
  id_contract:
    description: Identifier of the contract linked to the satisfaction response.
    lineage:
      - datalake_satisfaction_rating.gsheets_surveys.id_contract
      - datalake_satisfaction_rating.zendesk_surveys.id_contract
      - datalake_satisfaction_rating.bigfone_surveys.id_contract
      - datalake_satisfaction_rating.survicate_surveys.id_contract
      - datalake_satisfaction_rating.chat_fup_surveys.id_contract
  id_ticket:
    description: If the satisfaction form was requested after a service, this, in general, will be linked to a service identifier in Zendesk.
    lineage:
      - datalake_satisfaction_rating.zendesk_surveys.id_ticket
      - datalake_satisfaction_rating.bigfone_surveys.id_ticket
      - datalake_satisfaction_rating.survicate_surveys.id_ticket
      - datalake_satisfaction_rating.chat_fup_surveys.id_ticket
  id_origin:
    lineage:
      - datalake_satisfaction_rating.survicate_surveys.id_origin
    description: |
      Crossover key with the originating service of the satisfaction survey. For example: Inspections, Repairs, Keys, etc.
  id_respondent:
    description: Identifier of the person who answered the form.
    lineage:
      - datalake_ebdb_user.user.id
      - datalake_satisfaction_rating.zendesk_surveys.id_respondent
      - datalake_satisfaction_rating.bigfone_surveys.id_respondent
      - datalake_satisfaction_rating.survicate_surveys.id_respondent
      - datalake_satisfaction_rating.chat_fup_surveys.id_respondent
  respondent_email:
    description: Email of the person who answered the form.
    lineage:
      - datalake_ebdb_user.user.email
      - datalake_satisfaction_rating.gsheets_surveys.respondent_email
      - datalake_satisfaction_rating.zendesk_surveys.respondent_email
      - datalake_satisfaction_rating.bigfone_surveys.respondent_email
      - datalake_satisfaction_rating.survicate_surveys.respondent_email
      - datalake_satisfaction_rating.chat_fup_surveys.respondent_email
  respondent_type:
    description:
      Position which the respondent assumed when filling out the form. It can be a
      tenant, landlord, the attendant itself, or other service providers.
    lineage:
      - datalake_satisfaction_rating.gsheets_surveys.respondent_type
      - datalake_satisfaction_rating.zendesk_surveys.respondent_type
      - datalake_satisfaction_rating.bigfone_surveys.respondent_type
      - datalake_satisfaction_rating.survicate_surveys.respondent_type
  service_type:
    description: Indicates the service that originated the satisfaction response.
    categories:
      customer support: Responses generated after customer service.
      inspection: Responses generated after the property inspection service.
      keys: Responses generated after the key service, which is an evaluation
        of the service performed during the transit of the property keys from
        the owner/responsible to the inspectors, visitors, brokers, etc.
      photos:
        Responses generated after the photo service, which is an evaluation
        of the service performed by the photographer.
      reimbursement: Satisfaction response generated after refund service.
    lineage:
      - datalake_satisfaction_rating.gsheets_surveys.service_type
      - datalake_satisfaction_rating.zendesk_surveys.service_type
      - datalake_satisfaction_rating.bigfone_surveys.service_type
      - datalake_satisfaction_rating.survicate_surveys.service_type
      - datalake_satisfaction_rating.chat_fup_surveys.service_type
  service_context:
    description: The context in which this service occurred.
    categories:
      call: Support and customer service through a call registered by Bigfone.
      chat: Support and customer service through a chat registered  by Chat FUP.
      email: Support and customer service via an email registered by Zendesk.
      offboarding: Provision of service and/or support within after or during termination of the contract.
      onboarding: Provision of service and/or support after generating a new contract.
    lineage:
      - datalake_satisfaction_rating.gsheets_surveys.service_context
      - datalake_satisfaction_rating.zendesk_surveys.service_context
      - datalake_satisfaction_rating.bigfone_surveys.service_context
      - datalake_satisfaction_rating.survicate_surveys.service_context
      - datalake_satisfaction_rating.chat_fup_surveys.service_context
  source_name:
    description: Satisfaction form source.
    lineage:
      - datalake_satisfaction_rating.gsheets_surveys.source_name
      - datalake_satisfaction_rating.zendesk_surveys.source_name
      - datalake_satisfaction_rating.bigfone_surveys.source_name
      - datalake_satisfaction_rating.survicate_surveys.source_name
      - datalake_satisfaction_rating.chat_fup_surveys.source_name
  survey_name:
    description: Name of the satisfaction form, used to identify different forms from the same source, if they have a description.
    lineage:
      - datalake_satisfaction_rating.gsheets_surveys.survey_name
      - datalake_satisfaction_rating.survicate_surveys.survey_name
  improvement_tags:
    description: Process improvement tags, which are indicated by the respondent.
    lineage:
      - datalake_satisfaction_rating.gsheets_surveys.improvement_tags
      - datalake_satisfaction_rating.zendesk_surveys.improvement_tags
      - datalake_satisfaction_rating.survicate_surveys.improvement_tags
      - datalake_satisfaction_rating.chat_fup_surveys.improvement_tags
  respondent_comments:
    description: Respondent's comment/justification on the satisfaction assessment.
    lineage:
      - datalake_satisfaction_rating.gsheets_surveys.respondent_comments
      - datalake_satisfaction_rating.zendesk_surveys.respondent_comments
      - datalake_satisfaction_rating.bigfone_surveys.respondent_comments
      - datalake_satisfaction_rating.chat_fup_surveys.respondent_comments
  satisfaction_score:
    description: Main satisfaction form responses.
    lineage:
      - datalake_satisfaction_rating.gsheets_surveys.satisfaction_score
      - datalake_satisfaction_rating.zendesk_surveys.satisfaction_score
      - datalake_satisfaction_rating.bigfone_surveys.satisfaction_score
      - datalake_satisfaction_rating.chat_fup_surveys.satisfaction_score
      - datalake_satisfaction_rating.survicate_surveys.satisfaction_score
  score_description:
    description: Main satisfaction score description.
    lineage:
      - datalake_satisfaction_rating.gsheets_surveys.score_description
      - datalake_satisfaction_rating.zendesk_surveys.score_description
      - datalake_satisfaction_rating.bigfone_surveys.score_description
      - datalake_satisfaction_rating.chat_fup_surveys.score_description
      - datalake_satisfaction_rating.survicate_surveys.score_description
  secondary_satisfaction_score:
    description: Secondary satisfaction form responses.
    lineage:
      - datalake_satisfaction_rating.gsheets_surveys.secondary_satisfaction_score
      - datalake_satisfaction_rating.bigfone_surveys.secondary_satisfaction_score
      - datalake_satisfaction_rating.chat_fup_surveys.secondary_satisfaction_score
      - datalake_satisfaction_rating.survicate_surveys.secondary_satisfaction_score
  secondary_score_description:
    description: Secondary satisfaction score description.
    lineage:
      - datalake_satisfaction_rating.gsheets_surveys.secondary_score_description
      - datalake_satisfaction_rating.bigfone_surveys.secondary_score_description
      - datalake_satisfaction_rating.chat_fup_surveys.secondary_score_description
      - datalake_satisfaction_rating.survicate_surveys.secondary_score_description
  custom_attributes:
    description: It may contain information specific to each form, such as other identifiers, boolean fields, etc.
    lineage:
      - datalake_satisfaction_rating.gsheets_surveys.custom_attributes
      - datalake_satisfaction_rating.survicate_surveys.custom_attributes
      - datalake_satisfaction_rating.chat_fup_surveys.custom_attributes
  ts_submitted:
    description: Date the satisfaction response was submitted.
    lineage:
      - datalake_satisfaction_rating.gsheets_surveys.ts_submitted
      - datalake_satisfaction_rating.zendesk_surveys.ts_submitted
      - datalake_satisfaction_rating.bigfone_surveys.ts_submitted
      - datalake_satisfaction_rating.survicate_surveys.ts_submitted
      - datalake_satisfaction_rating.chat_fup_surveys.ts_submitted
  year:
    description: Year referring to the data loading day.
    lineage:
      - datalake_satisfaction_rating.gsheets_surveys.year
      - datalake_satisfaction_rating.zendesk_surveys.year
      - datalake_satisfaction_rating.bigfone_surveys.year
      - datalake_satisfaction_rating.survicate_surveys.year
      - datalake_satisfaction_rating.chat_fup_surveys.year
  month:
    description: Month referring to the data loading day.
    lineage:
      - datalake_satisfaction_rating.gsheets_surveys.month
      - datalake_satisfaction_rating.zendesk_surveys.month
      - datalake_satisfaction_rating.bigfone_surveys.month
      - datalake_satisfaction_rating.survicate_surveys.month
      - datalake_satisfaction_rating.chat_fup_surveys.month
  day:
    description: Day referring to the data loading day.
    lineage:
      - datalake_satisfaction_rating.gsheets_surveys.day
      - datalake_satisfaction_rating.zendesk_surveys.day
      - datalake_satisfaction_rating.bigfone_surveys.day
