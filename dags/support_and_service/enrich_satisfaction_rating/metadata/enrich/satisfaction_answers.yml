  custom_attributes:
    description: It may contain information specific to each form, such as other identifiers, boolean fields, etc.
    lineage:
      - datalake_satisfaction_rating.satisfaction_surveys_gsheets.custom_attributes
      - datalake_satisfaction_rating.satisfaction_surveys_survicate.custom_attributes
