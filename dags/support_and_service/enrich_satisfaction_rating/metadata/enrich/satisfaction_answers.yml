    lineage:
      - datalake_satisfaction_rating.satisfaction_surveys_gsheets.score_description
      - datalake_satisfaction_rating.satisfaction_surveys_zendesk.score_description
      - datalake_satisfaction_rating.satisfaction_surveys_bigfone.score_description
      - datalake_satisfaction_rating.satisfaction_surveys_chat_fup.score_description
      - datalake_satisfaction_rating.satisfaction_surveys_survicate.score_description
  secondary_satisfaction_score:
