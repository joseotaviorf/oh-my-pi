dag:
  name: dw_crm_inspections
  schedule_start_date: 2024,11,6
  owner: Data SS
  documentation:
    dag_purpose: |
      This dag is intended to be a breakdown of the inspections context data from the CRM source
workflow:
  type: query_delta
  layer: dw
  custom_schema: crm_inspections
  default_extraction_type: incremental
  default_partitions: [year, month, day]
  tables_customization:
    dim_inspection_task:
      custom_schema: crm
      extraction_type: full
      partitions: []
    fact_inspection_tasks:
      custom_schema: crm

cluster:
  type: databricks_13_3_min_memory_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
