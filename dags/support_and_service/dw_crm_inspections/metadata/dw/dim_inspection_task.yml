database_name: dw_crm
table_name: dim_inspection_task
description: >
  Context data on each inspection task across different workgroups (onboarding,
  offboarding, and inspection itself). Each row represents one inspection task
  in the CRM, capturing its type, status, workgroup assignment, timing, and resolution
  attributes. Source system is the CRM tasks flow.
domain: Support and Services
owner: gabriel.firmino@quintoandar.com.br
columns:
  sk_task:
    lineage:
      - datalake_crm_tasks_flows.tasks_actions_resolutions_flow.id_task
    description: Surrogate key for the CRM inspection task record in the data warehouse.
  score_factor:
    lineage:
      - datalake_crm_tasks_flows.tasks_actions_resolutions_flow.score_factor
    description: Numeric weight assigned to the task that determines its priority order in the analyst backlog queue.
  version:
    lineage:
      - datalake_crm_tasks_flows.tasks_actions_resolutions_flow.version
    description: MongoDB document version number from the CRM production database, incremented on each update to the task record.
  origin:
    lineage:
      - datalake_crm_tasks_flows.tasks_actions_resolutions_flow.origin
    description: Entity type that originated this inspection task in the CRM (e.g., Contrato, Imovel, Vistoria, FluxoLocacao).
    categories:
      Contrato: ""
      ContratoFull: ""
      FluxoLocacao: ""
      Imovel: ""
      Offer: ""
      PreProposta: ""
      Vistoria: ""
      contrato: ""
  type:
    lineage:
      - datalake_crm_tasks_flows.tasks_actions_resolutions_flow.type
    description: Task type identifying the specific inspection workflow step (e.g., AgendarVistoria, ConfirmarVistoriaSaida), or "Manual" for manually created tasks.
    categories:
      AgendarVistoria: ""
      AgendarVistoriaPreSaida: ""
      AgendarVistoriaSaida: ""
      AnalisarPreVistoria: ""
      AnaliseVistoriaSaida: "#N/A"
      CancelarVistoriaPreSaida: ""
      ConfirmarVistoriaEntrada: ""
      ConfirmarVistoriaPreSaida: ""
      ConfirmarVistoriaSaida: ""
      EnviarPrimeiroResultadoSaida: ""
      EnviarSegundoResultadoSaida: ""
      EnviarVistoria: ""
      FollowUpVistoriaEntrada: ""
      FollowUpVistoriaPreSaida: ""
      FollowUpVistoriaSaida: ""
      Manual: ""
      PrimeiraAnaliseVistoriaSaida: ""
      SegundaAnaliseVistoriaSaida: ""
  description:
    lineage:
      - datalake_crm_tasks_flows.tasks_actions_resolutions_flow.description
    description: Free-text description field filled by the analyst with additional context or remarks (populated only for manual-type tasks).
  subject:
    lineage:
      - datalake_crm_tasks_flows.tasks_actions_resolutions_flow.subject
    description: Main subject heading of the inspection task shown to analysts in the CRM task list.
  titles:
    lineage:
      - datalake_crm_tasks_flows.tasks_actions_resolutions_flow.titles
    description: Task title standardized for automatic task types or free-text for manual tasks, used as the primary display label in the CRM.
  workgroups:
    lineage:
      - datalake_crm_tasks_flows.tasks_actions_resolutions_flow.workgroups
    description: CRM workgroup this task belongs to, defining the team responsible for resolution (e.g., DEP_VISTORIA_ID, EXIT_INSPECTION_TEAM).
    categories:
      "[CONFIRM_EXIT_INSPECTION]": ""
      "[DEP_OFFBOARDING_SECOND_STEP]": ""
      "[DEP_VISTORIA_CONFIRMATION]": ""
      "[DEP_VISTORIA_FUP]": ""
      "[DEP_VISTORIA_ID]": ""
      "[DEP_VISTORIA_LAUDO]": ""
      "[DEP_VISTORIA_OFFBOARDING]": ""
      "[EXIT_INSPECTION_TEAM]": ""
      "[FUP_EXIT_INSPECTION]": ""
      "[REVISIT_POSTCONTRACT_TEAM]": ""
      "[null]": ""
  hours_task_start_to_completed:
    lineage:
      - datalake_crm_tasks_flows.tasks_actions_resolutions_flow.hours_task_started_to_completed
    description: Number of hours elapsed between the task start timestamp and its completion timestamp, measuring resolution speed.
  flg_solved:
    lineage:
      - datalake_crm_tasks_flows.tasks_actions_resolutions_flow.is_resolved
    description: Boolean flag indicating whether the inspection task has been resolved (completed or closed) in the CRM.
  is_task_auto_completed:
    lineage:
      - datalake_crm_tasks_flows.tasks_actions_resolutions_flow.is_task_auto_completed
    description: Boolean flag indicating whether the task was automatically closed by the CRM system rather than manually resolved by an analyst.
  ts_start:
    lineage:
      - datalake_crm_tasks_flows.tasks_actions_resolutions_flow.ts_started
    description: Timestamp when the inspection task was started by an analyst in the CRM (UTC timezone).
  ts_completed:
    lineage:
      - datalake_crm_tasks_flows.tasks_actions_resolutions_flow.ts_completed
    description: Timestamp when the inspection task was completed or closed in the CRM (UTC timezone).
  ts_silenced_until:
    lineage:
      - datalake_crm_tasks_flows.tasks_actions_resolutions_flow.ts_silenced_until
    description: Timestamp indicating when the task snooze period expires and the task becomes active again in the analyst queue (UTC timezone).
  ts_load:
    description: Timestamp when this record was loaded into the dw_crm table (UTC timezone).
