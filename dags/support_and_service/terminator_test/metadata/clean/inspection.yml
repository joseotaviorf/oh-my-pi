database_name: datalake_terminator_test_clean
table_name: inspection
description: Table with informations about inspections services that are important for termination process.
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_terminator_test_raw.inspection.id
    description: Unique identifier for each inspection record.
  id_contract:
    lineage:
      - datalake_terminator_test_raw.inspection.contract_id
    description: Identifier linking to the specific contract related to the inspection.
  id_schedule:
    lineage:
      - datalake_terminator_test_raw.inspection.schedule_id
    description: Reference to the schedule ID associated with the inspection.
  id_last_event_handled_date:
    lineage:
      - datalake_terminator_test_raw.inspection.last_event_handled_date
    description: The id of the last date event handled during the inspection process.
  uuid:
    lineage:
      - datalake_terminator_test_raw.inspection.uuid
    description: A universally unique identifier for the inspection record.
  type:
    lineage:
      - datalake_terminator_test_raw.inspection.type
    description: Specifies the type of inspection being conducted.
  status:
    lineage:
      - datalake_terminator_test_raw.inspection.status
    description: Current status of the inspection.
  keys_location:
    lineage:
      - datalake_terminator_test_raw.inspection.keys_location
    description: Indicates the physical location of keys relevant to the inspection, if applicable.
  keys_location_comment:
    lineage:
      - datalake_terminator_test_raw.inspection.keys_location_comment
    description: Additional comments or details about the keys' location.
  ts_expiration:
    lineage:
      - datalake_terminator_test_raw.inspection.expiration_date
    description: Timestamp indicating when the inspection expires or is no longer valid.
  ts_inspected:
    lineage:
      - datalake_terminator_test_raw.inspection.date
    description: Timestamp recording when the inspection was actually carried out.
  ts_created:
    lineage:
      - datalake_terminator_test_raw.inspection.created_at
    description: Timestamp for when the inspection record was initially created.
  ts_updated:
    lineage:
      - datalake_terminator_test_raw.inspection.updated_at
    description: Timestamp for the most recent update to the inspection record.
