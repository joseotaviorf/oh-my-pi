database_name: datalake_terminator_test_clean
table_name: termination_characteristics
description: Table defining the characteristics of the contract termination.
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_terminator_test_raw.termination_characteristics.id
    description: The ID of the termination step.
  id_termination:
    lineage:
      - datalake_terminator_test_raw.termination_characteristics.termination_id
    description: The ID of the termination.
  is_job_transfer:
    lineage:
      - datalake_terminator_test_raw.termination_characteristics.job_transfer
    description: Terminations where IQ requests and seeks penalty waiver claiming it's due to job transfer.
  is_before_rental:
    lineage:
      - datalake_terminator_test_raw.termination_characteristics.before_rental
    description: Termination requested up to one day before the start of the term.
  is_internal_administration:
    lineage:
      - datalake_terminator_test_raw.termination_characteristics.internal_administration
    description: Contract managed by QuintoAndar.
  is_tenant_condominium_payer:
    lineage:
      - datalake_terminator_test_raw.termination_characteristics.tenant_condominium_payer
    description: Contracts where the agreement on condominium payment falls under the responsibility of the tenant.
  is_pro_owner:
    lineage:
      - datalake_terminator_test_raw.termination_characteristics.pro_owner
    description: Terminations where the PP qualifies as PP Multi (old ProOwner).
  is_termination_in_first_year:
    lineage:
      - datalake_terminator_test_raw.termination_characteristics.termination_in_first_year
    description: Termination requested by IQ before completing 12 months of the contract.
  is_notice_due:
    lineage:
      - datalake_terminator_test_raw.termination_characteristics.notice_due
    description: Termination where a prior notice payment by IQ is required and was not fulfilled.
  is_eviction:
    lineage:
      - datalake_terminator_test_raw.termination_characteristics.eviction
    description: Termination where QuintoAndar initiates eviction proceedings.
  is_landlord_selling:
    lineage:
      - datalake_terminator_test_raw.termination_characteristics.landlord_selling
    description: Termination occurring due to the property being sold.
  is_inspection_opted_out:
    lineage:
      - datalake_terminator_test_raw.termination_characteristics.inspection_opted_out
    description: Termination where PP has exempted IQ from liability for repairs before the inspection is carried out.
  is_inspection_required:
    lineage:
      - datalake_terminator_test_raw.termination_characteristics.inspection_required
    description: Indicates whether a property inspection is required as part of the contract termination process.
  is_intermediation_required:
    lineage:
      - datalake_terminator_test_raw.termination_characteristics.intermediation_required
    description: Refers to terminations where intermediation is necessary.
  is_high_value_contract:
    lineage:
      - datalake_terminator_test_raw.termination_characteristics.high_value_contract
    description: contract with value higher than R$ 2500.
  is_admin_termination:
    lineage:
      - datalake_terminator_test_raw.termination_characteristics.admin_termination
    description: termination with the administration, that is, cases in which the landlord no longer wants its property to be managed by QuintoAndar.
  ts_created:
    lineage:
      - datalake_terminator_test_raw.termination_characteristics.created_at
    description: The creation timestamp of the termination characteristics.
  ts_updated:
    lineage:
      - datalake_terminator_test_raw.termination_characteristics.updated_at
    description: The update timestamp of the termination characteristics.
