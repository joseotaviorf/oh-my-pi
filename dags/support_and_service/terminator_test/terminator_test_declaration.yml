dag:
  name: terminator_test
  schedule_start_date: 2025, 03, 18
  schedule_interval: 0 0 * * *
  owner: Data SS
  documentation:
    dag_purpose: |
      This DAG imports the tables from [Terminator](https://github.com/quintoandar/terminator), our service to orchestrate the offboard contract process.
workflow:
  type: cdc
  layer: raw
  database_type: postgres
  source_database: terminator
  source_schema: public
  custom_schema: terminator_test
  dbutils_secret_key: TERMINATOR_DB
  lineage_product_database_name: terminator
  tables_customization:
    application_user_aud: {}
    application_user: {}
    attachment_aud: {}
    attachment: {}
    checklist_item: {}
    contract: {}
    inspection_aud: {}
    inspection: {}
    member: {}
    negotiation_aud: {}
    negotiation: {}
    revinfo:
      clean_table_name: rev_info
    termination_aud: {}
    termination_characteristics: {}
    termination_fee_aud: {}
    termination_fee_negotiation_aud: {}
    termination_fee_negotiation: {}
    termination_fee: {}
    termination_step: {}
    termination_task: {}
    termination_workflow_aud: {}
    termination_workflow: {}
    termination: {}
    utility_bill_aud: {}
    utility_bill: {}
    inspection_opted_out: {}
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: r5d.xlarge
    node_type_id: r5d.xlarge
    num_workers: 3
    spark_version: 12.2.x-scala2.12
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
  databricks_conn_id: databricks_new
