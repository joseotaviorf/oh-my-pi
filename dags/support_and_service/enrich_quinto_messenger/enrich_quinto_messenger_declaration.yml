dag:
    name: enrich_quinto_messenger
    schedule_start_date: 2020, 8, 29
    owner: Data SS
    documentation:
        dag_purpose: |
            Prepares **chat** data from the [Quinto Messenger](github.com/quintoandar/big-fone) for business utilization.
            [Quinto Messenger](https://github.com/quintoandar/quinto-messenger) is the service built to be the connection between Twilio and QuintoAndar's system.
workflow:
    type: query_delta
    layer: enrich
    inner_dependencies:
        message:
            - task
cluster:
    type: custom_cluster
    custom_configurations:
        autotermination_minutes: 20
        driver_node_type_id: r5d.4xlarge
        node_type_id: r5d.8xlarge
        runtime_engine: PHOTON
        spark_version: 13.3.x-scala2.12
        num_workers: 4
        aws_attributes:
            first_on_demand: 1
            spot_bid_price_percent: 100
            zone_id: us-east-1d
            availability: SPOT_WITH_FALLBACK
            ebs_volume_size: 200
