database_name: datalake_quinto_messenger
table_name: task
description: Enrich table containing quinto_messenger microservice task information.
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  id_task:
    description: Unique identifier for each task.
    lineage:
      - datalake_quinto_messenger_clean.task.id_task
  id_channel:
    description: Unique identifier for each channel.
    lineage:
      - datalake_quinto_messenger_clean.task.id_channel
  id_chat:
    description: Unique identifier for each chat.
    lineage:
      - datalake_quinto_messenger_clean.task.task_attributes
  id_conversation:
    description: Unique identifier for each conversation.
    lineage:
      - datalake_quinto_messenger_clean.task.task_attributes
  id_agent:
    description: Unique identifier for each customer service agent.
    lineage:
      - datalake_quinto_messenger_clean.task.assigned_to
  agent_email:
    description: email customer service agent.
    lineage:
      - datalake_quinto_messenger_clean.task.assigned_to
  channel_type_twilio:
    description: What was the channel used for the conversation.
    categories:
      chat: Service via chat.
      whatsapp: Service via whatsapp.
    lineage:
      - datalake_quinto_messenger_clean.task.task_attributes
  channel_type_internal:
    description: Channel type internal.
    lineage:
      - datalake_quinto_messenger_clean.task.task_attributes
  task_status:
    description: Current ticket status.
    lineage:
      - datalake_quinto_messenger_clean.task.task_status
  completion_reason:
    description:
      A task event completion reason is the reason why a task has been
      marked as completed. When a worker finishes a task, they must provide a
      completion reason, which is a string that describes the reason why they completed
      the task. Usually, the last task ID in the conversation will have a
      completion reason.
    lineage:
      - datalake_quinto_messenger_clean.task.task_resources
  channel_status:
    description: Channel Status.
    lineage:
      - datalake_quinto_messenger_clean.task.task_attributes
  ticket_group_name:
    description: The respective department for the ticket.
    lineage:
      - datalake_quinto_messenger_clean.task.task_attributes
  from_phone_number:
    description: Descriptive data that indicates the number of those who requested service.
    lineage:
      - datalake_quinto_messenger_clean.task.task_attributes
  twilio_phone_number:
    description: Phone number registered on Twilio - the number that replied to the customer.
    lineage:
      - datalake_quinto_messenger_clean.task.task_attributes
  service_phone_number:
    description: Recipient phone number.
    lineage:
      - datalake_quinto_messenger_clean.task.task_attributes
  routing_tags:
    description: The list of all routing tags applied to the task.
    lineage:
      - datalake_quinto_messenger_clean.task.task_attributes
  contact_theme_tag:
    description: Related to ticket taxonomy, indicates what the contact is about.
    lineage:
      - datalake_quinto_messenger_clean.task.task_attributes
  customer_type_tag:
    description: Classification of the user.
    lineage:
      - datalake_quinto_messenger_clean.task.task_attributes
  contact_motivation_tag:
    description: Classification of the user motivation (e.g. doubt).
    lineage:
      - datalake_quinto_messenger_clean.task.task_attributes
  is_forwarded:
    description: If the message has been forwarded
    lineage:
      - datalake_quinto_messenger_clean.task.task_attributes
  task_number:
    description: Number of the task inside a conversation.
    lineage:
      - datalake_quinto_messenger_clean.task.task_attributes
  seconds_to_first_response:
    description: Seconds taken for the first response inside a task.
    lineage:
      - datalake_quinto_messenger_clean.task.seconds_to_first_response
  ts_created:
    description: UTC task creation date in Twilio, in timestamp format.
    lineage:
      - datalake_quinto_messenger_clean.task.ts_created
  ts_updated:
    description: UTC task updated date in Twilio, in timestamp format.
    lineage:
      - datalake_quinto_messenger_clean.task.ts_updated
  ts_created_local:
    description: Timezone Brazil/East task creation date, in timestamp format.
    lineage:
      - datalake_quinto_messenger_clean.task.ts_created
  ts_updated_local:
    description: Timezone Brazil/East task updated date, in timestamp format.
    lineage:
      - datalake_quinto_messenger_clean.task.ts_updated
