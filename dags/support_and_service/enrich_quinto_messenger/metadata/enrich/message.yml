database_name: datalake_quinto_messenger
table_name: message
description: This table contains all messages exchanged in chat conversations
domain: Support and Services
owner: data-ae-ss@quintoandar.com.br
columns:
  id_task:
    lineage:
      - datalake_quinto_messenger.tasks.id_task
    description: Twilio's task ID
  id_message:
    lineage:
      - datalake_internal_chat_clean.internal_chat_messages.id_message
      - datalake_quinto_messenger_clean.channel_event.event_payload
    description: Twilio's message ID
  msg_sender:
    lineage:
      - datalake_internal_chat_clean.internal_chat_messages.id_user_external
      - datalake_quinto_messenger_clean.channel_event.event_payload
    description: Sender of the message, could be a system message, an agent email or a customer
  message_body:
    lineage:
      - datalake_internal_chat_clean.internal_chat_messages.message
      - datalake_quinto_messenger_clean.channel_event.message_body
    description: Body of the message
  reply_time:
    description: Time elapsed between current and last message, in minutes
  origin:
    description: Customer source of contact
    categories:
      WHATSAPP: Customer contacted via Whatsapp
      CHAT INAPP: Customer contacted via App
  ts_created:
    lineage:
      - datalake_internal_chat_clean.internal_chat_messages.ts_created
      - datalake_quinto_messenger_clean.channel_event.ts_created
    description: Timestamp of when the message was sent
