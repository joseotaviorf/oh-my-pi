database_name: datalake_quinto_messenger
table_name: chat
description: " "
domain: Support and Services
owner: data-ae-ss@quintoandar.com.br
columns:
  id_chat:
    lineage:
      - datalake_quinto_messenger_clean.chat.id_chat
    description: ID of the chat on QuintoMessenger
  id_channel:
    lineage:
      - datalake_quinto_messenger_clean.chat.id_channel
    description: Twilio's channel ID
  id_session:
    lineage:
      - datalake_quinto_messenger_clean.chat.id_session
    description: Sauron's session ID
  source:
    lineage:
      - datalake_quinto_messenger_clean.chat.source
    description: Origin of the chat session
  session_status:
    lineage:
      - datalake_quinto_messenger_clean.chat.session_status
    description: Status of the chat session
    categories:
      active: "Session is still active, customer can still contact support through the same session"
      closed: "Session closed, a new contact by the customer will create a new session"
  ts_created:
    lineage:
      - datalake_quinto_messenger_clean.chat.ts_created
    description: "Date and time representing when the task was created"
  ts_updated:
    lineage:
      - datalake_quinto_messenger_clean.chat.ts_updated
    description: "Date and time of the last update to the task"
