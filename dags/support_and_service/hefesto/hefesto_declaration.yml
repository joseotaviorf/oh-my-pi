dag:
  name: hefesto
  schedule_start_date: 2024, 4, 7
  schedule_interval: 0 1 * * *
  owner: Data SS
  documentation:
    dag_purpose: This DAG imports tables from [Hefesto](https://github.com/quintoandar/hefesto)

workflow:
  type: cdc
  layer: raw
  database_type: postgres
  source_schema: public
  lineage_product_database_name: hefesto
  dbutils_secret_key: HEFESTO_DB
  tables_customization:
    worker:
      raw_primary_keys: ["id"]
    worker_portfolio:
      raw_primary_keys: ["id"]
    worker_portfolio_unit:
      raw_primary_keys: ["id"]
    worker_portfolio_event:
      raw_primary_keys: ["id"]
    worker_channel:
      raw_primary_keys: ["id"]
    queue:
      raw_primary_keys: ["id"]
    queue_type:
      raw_primary_keys: ["id"]
    queue_event:
      raw_primary_keys: ["id"]
    account:
      raw_primary_keys: ["id"]

