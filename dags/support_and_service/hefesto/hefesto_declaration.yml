dag:
  name: hefesto
  schedule_start_date: 2024, 4, 7
  schedule_interval: 0 1 * * *
  owner: Data SS
  documentation:
    dag_purpose: This DAG imports tables from [Hefesto](https://github.com/quintoandar/hefesto)

workflow:
  type: database_pull_delta
  layer: raw
  database_type: postgres
  lineage_product_database_name: hefesto
  dbutils_secret_key: HEFESTO_DB
  default_extraction_type: incremental
  tables_customization:
    worker:
      date_filter_column: updated_at
      partitions: [year, month, day]
    worker_portfolio:
      date_filter_column: updated_at
      partitions: [year, month, day]
    worker_portfolio_event:
      date_filter_column: created_at
      partitions: [year, month, day]
    worker_channel:
      date_filter_column: updated_at
      partitions: [year, month, day]
    queue:
      date_filter_column: updated_at
      partitions: [year, month, day]
    queue_type:
      extraction_type: full
    queue_event:
      date_filter_column: created_at
      partitions: [year, month, day]
    idled_channel:
      date_filter_column: updated_at
      partitions: [year, month, day]
    account:
      extraction_type: full
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, ds, 'load_end_date') }}"

cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: m5a.4xlarge
    node_type_id: m5a.4xlarge
    spark_version: 13.3.x-scala2.12
    num_workers: 3
