dag:
  name: sauron
  schedule_start_date: 2020,7,27
  schedule_interval: 0 0 * * *
  owner: Data SS
  documentation:
    dag_purpose: |
      Retrieve data from Sauron database (postgresql). [Sauron](https://github.com/quintoandar/sauron)
      is a internal message orchestration service that manages our sessions.
workflow:
  type: cdc
  layer: raw
  database_type: postgres
  source_schema: public
  dbutils_secret_key: SAURON_DB
  tables_customization:
    BotOutgoingMessages:
      clean_table_name: bot_outgoing_messages
    Session:
      clean_table_name: session
      clean_z_order_by: [ts_created, ts_updated, id]
    CallEvents:
      clean_table_name: call_events

