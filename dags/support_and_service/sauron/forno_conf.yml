---
lineage_product_database_name: sauron
partition_cols: [year, month, day]
max_records_per_file: 250000
update_col: updated_at
dag_documentation:
  dag_purpose: |
    Retrieve data from Sauron database (postgresql). [Sauron](https://github.com/quintoandar/sauron)
    is a internal message orchestration service that manages our sessions.

custom_cluster:
  driver_node_type_id: m5a.xlarge
  node_type_id: c5a.4xlarge
  num_workers: 3

tables:
  # <raw_table_name>:
  #   table_name: <table_name>
  #   partitioned_table: <True> #optional
  activesessions:
    table_name: ActiveSessions
  botoutgoingmessages:
    table_name: BotOutgoingMessages_{year}{month}
    partitioned_table: True
  expiredsessions:
    table_name: ExpiredSessions
  incomingmessagestatus:
    table_name: IncomingMessageStatus_{year}{month}
    partitioned_table: True
  incomingmessages:
    table_name: IncomingMessages_{year}{month}
    partitioned_table: True
  session:
    table_name: Session
