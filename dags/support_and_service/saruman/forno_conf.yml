  #   clean_table_name: <clean_table_name>
  #   is_incremental: <is_incremental> #optional
  #   date_column: <date_column> #optional
  #   unixtime_measure: <unixtime_measure> #optional
  session:
    clean_table_name: session
    is_incremental: True
    date_column: updated_at
  session_history:
    clean_table_name: session_history
    is_incremental: True
    date_column: created_at
  support_case:
    clean_table_name: support_case
    is_incremental: False
  pendency:
    clean_table_name: pendency
    is_incremental: True
    date_column: created_at
