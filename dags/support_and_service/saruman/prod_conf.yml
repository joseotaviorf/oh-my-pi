---
partition_cols: ["year", "month", "day"]
max_records_per_file: 250000
lineage_product_database_name: saruman
dag_documentation:
  dag_purpose: |
    Retrieves data from the Saruman database (PostgreSQL).

    [Saruman](https://github.com/quintoandar/saruman) is a service that concentrates events from multiple sources
    and builds a timeline used to provide context for support sessions. Some of these events are tagging, routing,
    creation, ending, comment events about a session and about workflows.

tables:
  # <raw_table_name>:
  #   clean_table_name: <clean_table_name>
  #   is_incremental: <is_incremental> #optional
  #   date_column: <date_column> #optional
  #   unixtime_measure: <unixtime_measure> #optional
  session:
    clean_table_name: session
    is_incremental: True
    date_column: updated_at
  session_history:
    clean_table_name: session_history
    is_incremental: True
    date_column: created_at
  support_case:
    clean_table_name: support_case
    is_incremental: False
  pendency:
    clean_table_name: pendency
    is_incremental: True
    date_column: created_at
