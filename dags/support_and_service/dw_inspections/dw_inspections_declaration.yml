dag:
  name: dw_inspections
  schedule_start_date: 2021,2,7
  owner: Data SS
  documentation:
    dag_purpose: |
      This DAG loads the DW tables for Inspection Services and PWA data (old data).
      These data are mainly related to the entry and exit inspections carried out by QuintoAndar.
workflow:
  type: query_delta
  layer: dw
  custom_schema: inspections
  default_extraction_type: incremental
  default_partitions: [year, month, day]
  has_load_to_redshift_task: False
  tables_customization:
    dim_inspection:
      extraction_type: full
      partitions: []
    dim_inspector:
      extraction_type: full
      partitions: []
    fact_inspection:
      extraction_type: full
      partitions: []
    fact_repair_request:
      extraction_type: full
      partitions: []
    fact_report_review:
      extraction_type: full
      partitions: []

cluster:
  type: custom_cluster
  custom_configurations:
    autotermination_minutes: 20
    driver_node_type_id: r5d.xlarge
    node_type_id: r5d.xlarge
    runtime_engine: PHOTON
    spark_version: 12.2.x-scala2.12
    num_workers: 2
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE
