---
database_name: dw_inspections
table_name: fact_item_issue
description:
  This fact table brings information about the problems or sub-problems linked to the condition of an evaluated item,
  serving as a connection between the item problem information with the other modeling fact tables.
  Each row is a unique issue, identified by the sk_item_issue column.
domain: Support and Services
owner: data-ae-ss@quintoandar.com.br
columns:
  sk_item_issue:
    description: Item Issue unique identifier.
    lineage:
      - datalake_inspectionss.item_issue.id_item_issue
  sk_item:
    description: Item unique identifier.
    lineage:
      - datalake_inspectionss.item_issue.id_item
  sk_assessment:
    description: Unique identifier of an Assessment.
      This identifier must be unique per inspection, however, for dates prior to August 19, 2023, there is residual data in a product bug.
      This bug erroneously created more than one Assessment per survey. Therefore, for these cases, the sk_inspection will not be unique.
      It is observed that the extra Assessments are identical, with no data distinction between them.
    lineage:
      - datalake_inspectionss.item_issue.id_assessment
  sk_inspection:
    description: Inspection unique identifier.
    lineage:
      - datalake_inspectionss.item_issue.id_inspection
  ts_created:
    description: Creation date and time.
    lineage:
      - datalake_inspectionss.item_issue.ts_created
  ts_updated:
    description: Update date and time.
    lineage:
      - datalake_inspectionss.item_issue.ts_updated
  ts_load:
    description: Date and time when the data was loaded.
  year:
    description: Year referring to date of update.
    lineage:
      - datalake_inspectionss.item_issue.year
  month:
    description: Month referring to date of update.
    lineage:
      - datalake_inspectionss.item_issue.month
  day:
    description: Day referring to date of update.
    lineage:
      - datalake_inspectionss.item_issue.day
