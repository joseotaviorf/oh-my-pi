---
database_name: dw_inspections
table_name: fact_repair_request
description: |
  This table provides indicators of the current status of the repair request, such as:
  whether the repair was contested, who will absorb the costs involved, whether there
  is related media, etc.
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  sk_repair_request:
    lineage:
      - datalake_inspections.repair_request.id_repair_request
    description: Repair Request unique identifier (number)
  sk_contestation:
    lineage:
      - datalake_inspections.repair_request.id_contestation
    description: Identification key of the contestation related to the repair request.
  sk_item_group:
    lineage:
      - datalake_inspections.repair_request.id_item_group
    description: Item Group unique identifier.
  sk_room:
    lineage:
      - datalake_inspections.repair_request.id_room
    description: Room unique identifier.
  sk_assessment:
    lineage:
      - datalake_inspections.repair_request.id_assessment
    description: Unique identifier of an Assessment.
  sk_inspection:
    lineage:
      - datalake_inspections.repair_request.id_inspection
    description: Inspection unique identifier.
  sk_requester:
    lineage:
      - datalake_inspections.repair_request.id_requester
    description: Author of repair request
  sk_granted_by:
    lineage:
      - datalake_inspections.repair_request.id_granted_by
    description:
      Reviewer who assessed whether a repair was exempted. Being an owner
      or member of AN1
  sk_contestation_requester:
    lineage:
      - datalake_inspections.repair_request.id_contestation_requester
    description: Identification key of the user who made the contestation.
  total_tenant_contestation:
    description: Numerical information indicating the total number of objections made by the tenant during the review.
  total_tenant_budget_approval_contestation:
    description: Numerical information indicating the total number of objections made by the tenant during the budget approval step.
  total_owner_budget_approval_contestation:
    description: Numerical information indicating the total number of objections made by the owner during the budget approval step.
  has_media:
    description: Indicates whether media was generated for the repair request
  has_tenant_contestation:
    description: Indicates that there are objections from the tenant to the repair request during the review.
  has_owner_contestation:
    description: ""
  has_tenant_budget_approval_contestation:
    description: Boolean information indicating whether the tenant contested the repair in question at the budget approval stage.
  has_owner_budget_approval_contestation:
    description: Boolean information indicating whether the owner contested the repair in question at the budget approval stage.
  is_cost_absorbed_by_company:
    description: The cost of the repair will be absorbed by the 5A
  is_cost_absorbed_by_tenant:
    description: The cost of the repair will be absorbed by the tenant
  is_cost_absorbed_by_owner:
    description: The cost of repair will be absorbed by the owner
  is_exempted:
    lineage:
      - datalake_inspections.repair_request.is_exempted
    description:
      Indicates whether the repair suggested by the AN1 team was exempted
      by the owner or a analyst
  is_exempted_by_owner_from_budget:
    lineage:
      - datalake_inspections.repair_request.is_exempted_by_owner_from_budget
    description: Indicates whether the repair was exempted by the owner at the budget approval stage.
  is_exempted_by_owner:
    description: The repair request was exempted by the owner
  is_requested_by_owner:
    description: The repair request was requested by the owner
  is_finished:
    lineage:
      - datalake_inspections.repair_request.is_finished
    description: Repair request ended
  has_automatically_identified:
    lineage:
      - datalake_inspections.repair_request.has_automatically_identified
    description: Boalean type information that indicates whether the repair was generated automatically.
  has_automatic_identification_accepted:
    lineage:
      - datalake_inspections.repair_request.has_automatic_identification_accepted
    description: Boalean type information that indicates whether the automatically generated repair was accepted.
  ts_granted:
    lineage:
      - datalake_inspections.repair_request.ts_granted
    description:
      Indicates the time at which the repair request exempted assessment
      was made
  ts_created:
    lineage:
      - datalake_inspections.repair_request.ts_created
    description: Record creation date
  ts_updated:
    lineage:
      - datalake_inspections.repair_request.ts_updated
    description: Record update date
  ts_load:
    description: Date and time when the data was loaded.
  year:
    lineage:
      - datalake_inspections.repair_request.year
    description: Year of update date
  month:
    lineage:
      - datalake_inspections.repair_request.month
    description: Month of update date
  day:
    lineage:
      - datalake_inspections.repair_request.day
    description: Day of update date
