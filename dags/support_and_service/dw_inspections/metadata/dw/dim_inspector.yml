---
database_name: dw_inspections
table_name: dim_inspector
description:
  This dimension provides general information about the inspector responsible for inspecting the property.
  Each line is a register of an inspector, identified by the sk_inspector column.
domain: Support and Services
owner: data-ae-ss@quintoandar.com.br
columns:
  sk_inspector:
    description: Unique identifier of the inspector.
    lineage:
      - datalake_gsheets_clean.inspectors_control.id_inspector
  inspector_name:
    description: Inspector's full name.
    lineage:
      - datalake_gsheets_clean.inspectors_control.inspector_name
  inspector_email:
    description: Inspector email address.
    lineage:
      - datalake_gsheets_clean.inspectors_control.inspector_email
  inspector_corporate_name:
    description: Name of the company the inspector is related to.
    lineage:
      - datalake_gsheets_clean.inspectors_control.inspector_corporate_name
  beneficiary_name:
    description: Beneficiary name.
    lineage:
      - datalake_gsheets_clean.inspectors_control.beneficiary_name
  employee_contract_type:
    description: Type of employment contract.
    lineage:
      - datalake_gsheets_clean.inspectors_control.employee_contract_type
  company:
    description: Which group 5A company or third party is responsible for the inspector.
    lineage:
      - datalake_gsheets_clean.inspectors_control.company
  status:
    description: Whether the inspector is still active or not.
    lineage:
      - datalake_gsheets_clean.inspectors_control.status
  operating_city:
    description: Inspector's operation city
    lineage:
      - datalake_gsheets_clean.inspectors_control.operating_city
  operating_regions:
    description: Inspector operation city regions.
    lineage:
      - datalake_gsheets_clean.inspectors_control.operating_regions
  transportation_type:
    description: Type of transport used by the inspector.
    lineage:
      - datalake_gsheets_clean.inspectors_control.transportation_type
  dt_start:
    description: Beginning of the employment contract.
    lineage:
      - datalake_gsheets_clean.inspectors_control.dt_start
  dt_end:
    description: End of employment contract.
    lineage:
      - datalake_gsheets_clean.inspectors_control.dt_end
  ts_load:
    description: Date and time when the data was loaded.
