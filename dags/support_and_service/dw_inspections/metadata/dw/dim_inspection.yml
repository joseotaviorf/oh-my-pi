database_name: dw_inspections
table_name: dim_inspection
description:
  This dimension brings information about the type, origin and status of the inspection, as well as information about its scheduling.
  It also brings data from each inspection scheduled by the Inspection Service and historical data from the PWA.
  Each row is a unique inspection, identified by the sk_inspection column.
domain: Support and Services
owner: data-ae-ss@quintoandar.com.br
columns:
  sk_inspection:
    description:
      Unique id to identify a inspection. If its origin is the Inspection Service (IS), the sk will
      correspond to the id generated in the product. If the inspection source is still the
      PWA, the sk will correspond to the ID generated by an encryption function.
    lineage:
      - datalake_inspections.inspection_booking.id_inspection
  inspection_type:
    description: The type of inspection.
    categories:
      onboarding: Inspection carried out before the tenant enters the property, to certify the conditions of the house.
      verification: Inspection carried out when there is any relevant change in the property, such as the creation of rooms, for example.
      offboarding: Inspection carried out after the tenant leaves the property, to certify the conditions of the house.
    lineage:
      - datalake_inspections.inspection_booking.inspection_type
  booking_type:
    description: What type of booking is Inspection or Quarterly Inspection
    lineage:
      - datalake_inspections.inspection_booking.booking_type
  source:
    description: Since the table merges two data sources, this column indicates where the inspection is coming from.
    categories:
      IS: The source of information is the Inspection Service.
      PWA: The source of information is the PWA.
    lineage:
      - datalake_inspections.inspection_booking.source
  status:
    description: Identifies the stage of the inspection from scheduling to review.
    categories:
      scheduled: Inspection scheduled and awaiting execution [onboarding/offboarding]
      received: Inspection sent by the inspector, waiting for synchronization with the Main [offboarding]
      processing: Survey has been received and will be performed by the surveyor [onboarding]
      sent_to_review: Indicates that the owner and tenant are able to do their reviews [onboarding]
      review_started: When the owner or/and the tenant makes a comment [onboarding]
      sent_to_analysis: Inspection available for operations team interventions [offboarding]
      sent_to_owner_review: Review available for owner review [offboarding]
      review_started_by_owner: Survey whose owner has already done some intervention [offboarding]
      sent_to_tenant_review: Survey available for tenant review [offboarding]
      review_started_by_tenant: Survey whose tenant has already done some intervention [offboarding]
      reviewed: |
        offboarding: Survey sent to the Operations team to validate interventions proposed by owner/tenant
        onboarding: When the review deadline is reached
      EmAcordo: "Discontinued status, coming from the PWA data, so it's not part of the Inspection Service data flow, it's just historical data"
      ContratoCancelado: "Discontinued status, coming from the PWA data, so it's not part of the Inspection Service data flow, it's just historical data"
      Nova: "Discontinued status, coming from the PWA data, so it's not part of the Inspection Service data flow, it's just historical data"
      Finalizada: "Discontinued status, coming from the PWA data, so it's not part of the Inspection Service data flow, it's just historical data"
      Comentada: "Discontinued status, coming from the PWA data, so it's not part of the Inspection Service data flow, it's just historical data"
    lineage:
      - datalake_inspections.inspection_booking.status
  has_owner_accompanying:
    description: Indicates whether the owner will be accompanying the inspection.
    lineage:
      - datalake_inspections.inspection_booking.has_owner_accompanying
  is_first_schedule:
    description:
      An inspection request can be canceled and rescheduled multiple times,
      and each rescheduling will generate a new inspection. Therefore, this column
      indicates whether the inspection itself was the first appointment in a sequence.
    lineage:
      - datalake_inspections.inspection_booking.is_first_schedule
  is_executed_in_first_schedule:
    description:
      An inspection request can be canceled and rescheduled multiple times,
      and each rescheduling will generate a new inspection. Therefore, this column
      indicates whether the inspection was carried out at the first scheduled time.
    lineage:
      - datalake_inspections.inspection_booking.is_executed_in_first_schedule
  is_d0_canceled:
    description: Indicates that the inspection was canceled by the inspector on the scheduled day.
    lineage:
      - datalake_inspections.inspection_booking.is_d0_canceled
  is_d1_canceled:
    description: Indicates that the inspection was canceled by the inspector the day before the scheduled.
    lineage:
      - datalake_inspections.inspection_booking.is_d1_canceled
  ts_created:
    description: Timestamp of when the inspection request was synchronized in the product.
    lineage:
      - datalake_inspections.inspection_booking.ts_created
  ts_updated:
    description: Inspection information update timestamp.
    lineage:
      - datalake_inspections.inspection_booking.ts_updated
  ts_load:
    description: This timestamp indicates when this data was loaded into dw_inspection.
  year:
    description: Year referring to date of update.
    lineage:
      - datalake_inspections.inspection_booking.ts_updated
  month:
    description: Month referring to date of update.
    lineage:
      - datalake_inspections.inspection_booking.ts_updated
  day:
    description: Day referring to date of update.
    lineage:
      - datalake_inspections.inspection_booking.ts_updated
