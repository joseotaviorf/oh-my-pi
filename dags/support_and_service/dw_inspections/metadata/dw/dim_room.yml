---
database_name: dw_inspections
table_name: dim_room
description:
  This dimension refers to the descriptive data of the inspected room, such as the name and type of room.
  Although simple, this table supports analysis with granular fact_item data.
  Each row is a unique room, identified by the sk_room column.
domain: Support and Services
owner: data-ae-ss@quintoandar.com.br
columns:
  sk_room:
    description: Room unique identifier.
    lineage:
      - datalake_inspections.room.id_room
  room_name:
    description: Descriptive name of the room (typed by inspector).
    lineage:
      - datalake_inspections.room.room_name
  room_type:
    description: Room type name, for example kitchen bedroom, etc.
    lineage:
      - datalake_inspections.room.room_type
  ts_created:
    description: Creation date and time.
    lineage:
      - datalake_inspections.room.ts_created
  ts_updated:
    description: Update date and time.
    lineage:
      - datalake_inspections.room.ts_updated
  ts_load:
    description: Date and time when the data was loaded.
  year:
    description: Year referring to date of update.
    lineage:
      - datalake_inspections.room.year
  month:
    description: Month referring to date of update.
    lineage:
      - datalake_inspections.room.month
  day:
    description: Day referring to date of update.
    lineage:
      - datalake_inspections.room.day
