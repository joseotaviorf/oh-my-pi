---
database_name: dw_inspections
table_name: dim_item_group
description:
  This dimension refers to the inspected object, bringing descriptive data about what this object is,
  what the situation is and if there were any comments from the inspector. It's worth noting that the
  item_group refers to things like a window, door, floor, cabinets, etc.
  Each row is a unique item_group, identified by the sk_item_group column.
domain: Support and Services
owner: data-ae-ss@quintoandar.com.br
columns:
  sk_item_group:
    description: Item Group unique identifier.
    lineage:
      - datalake_inspections.item_group.id_item_group
  item_group_name:
    description: Description of the item group, for example floor, paint, lighting, etc. (typed by inspector)
    lineage:
      - datalake_inspections.item_group.item_group_name
  item_group_type:
    description: Name of the object evaluated in the inspection.
    lineage:
      - datalake_inspections.item_group.item_group_type
  status:
    description: Indicates the condition of the object for comparative surveys.
    categories:
      ABSENT: Object removed.
      SAME: Object in the same conditions as the previous inspection.
      REPLACED: Replaced object.
    lineage:
      - datalake_inspections.item_group.status
  has_item_checklist:
    description: The inspector completed one or more checklists on items related to the item_group.
  has_item_chip_choice:
    description: The inspector selected one or more predefined tags when evaluating items related to the item_group.
  has_inspector_open_comment:
    description: The inspector fills in a comment in an open field for one or more items related to the item_group.
  is_inferior_quality:
    description: Indicates the quality of the object in case of replacement.
    lineage:
      - datalake_inspections.item_group.is_inferior_quality
  ts_created:
    description: Creation date and time.
    lineage:
      - datalake_inspections.item_group.ts_created
  ts_updated:
    description: Update date and time.
    lineage:
      - datalake_inspections.item_group.ts_updated
  ts_load:
    description: Date and time when the data was loaded.
  year:
    description: Year referring to date of update.
    lineage:
      - datalake_inspections.item_group.year
  month:
    description: Month referring to date of update.
    lineage:
      - datalake_inspections.item_group.month
  day:
    description: Day referring to date of update.
    lineage:
      - datalake_inspections.item_group.day
