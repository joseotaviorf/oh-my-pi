---
database_name: dw_inspections
table_name: fact_reviewer_approval
description: History of approval/disapproval of the inspection report by reviewers
domain: Support and Services
owner: data-ae-ss@quintoandar.com.br
columns:
  sk_reviewer:
    lineage:
      - datalake_inspections.reviewer.id_reviewer
    description: Review unique identifier (number)
  sk_assessment:
    lineage:
      - datalake_inspections.reviewer.id_assessment
    description: Assessment unique identifier (number)
  sk_inspection:
    lineage:
      - datalake_inspections.reviewer.id_inspection
    description: Inspection unique identifier (number)
  approval_reason:
    lineage:
      - datalake_inspections.reviewer.approval_reason
    description: Reason why the reviewer approved or disapproved
  approval_comment:
    lineage:
      - datalake_inspections.reviewer.approval_comment
    description: Reviewer's comment about approving or disapproving
  approval_type:
    lineage:
      - datalake_inspections.reviewer.approval_type
    description: This field differentiates whether the reviewer came from review, repair analysis, contestation analysis or budget approval
    categories:
      REVIEW: Approval made by the analyst, owner or tenant, after completing the review of the inspection report and the required repairs.
      REPAIR_ANALYSIS: Approval made by the analyst, after completing the analysis of the inspection report and creating repair requests
      CONTESTATION_ANALYSIS: Approval made by the analyst, after completing the dispute analyzes and new repair requests made by the owner and tenant
  is_approved:
    lineage:
      - datalake_inspections.reviewer.is_approved
    description: Indicates whether the reviewer completed the review manually
  ts_approved:
    lineage:
      - datalake_inspections.reviewer.ts_approved
      - datalake_inspections.reviewer.ts_updated
    description: Timestamp of when it was approved
  ts_load:
    description: Date and time when the data was loaded.
  year:
    lineage:
      - datalake_inspections.reviewer.year
    description: Year of update date.
  month:
    lineage:
      - datalake_inspections.reviewer.month
    description: Month of update date.
  day:
    lineage:
      - datalake_inspections.reviewer.day
    description: Day of update date.
