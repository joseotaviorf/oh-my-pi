---
database_name: dw_inspections
table_name: dim_assessment
description:
  This dimension brings information from the inspection assessment, there will only
  be an assessment after the survey is started by the inspector.
  Each row is a unique assessment, identified by the sk_assessment column.
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  sk_assessment:
    description: Assessment unique identifier.
    lineage:
      - datalake_inspections_clean.assessment.id_assessment
  source:
    description: Identifies which application the inspector used to perform the inspection.
    categories:
      INSPETOR_BUGIGANGA: The inspection was carried out through the PWA.
      INSPECTORS_FLUTTER: The inspection was carried out through the Inspection Service.
    lineage:
      - datalake_inspections_clean.assessment.source
  house_supplies:
    description:
      Indicates the operating condition of the water, gas and electricity supply. However,
      this field is no longer populated in the database, serving only for historical consultation.
    lineage:
      - datalake_inspections_clean.assessment.house_supplies
  key_location:
    description: Where or with whom is the key after assessment of the property.
    lineage:
      - datalake_inspections_clean.assessment.key_location
  key_location_details:
    description:
      If the key_location column is filled in as 'other', the inspector must
      describe the location and this information is saved in this column.
    lineage:
      - datalake_inspections_clean.assessment.key_location_details
  dt_owner_limit_revision:
    description: Indicates the deadline for the owner to conclude its review of the report.
      After this date, completion is compulsory.
    lineage:
      - datalake_inspections_clean.assessment.dt_owner_limit_revision
  dt_tenant_limit_revision:
    description: Indicates the deadline for tenant to complete its review of the report.
      After this date, completion is compulsory.
    lineage:
      - datalake_inspections_clean.assessment.dt_tenant_limit_revision
  ts_created:
    description: Assessment creation date and time.
    lineage:
      - datalake_inspections_clean.assessment.ts_created
  ts_finished:
    description: This column should display the time when the inspector started to perform the inspection. (column with unreliable data)
    lineage:
      - datalake_inspections_clean.assessment.ts_finished
  ts_started:
    description: This column should display the time when the inspector finished carrying out the inspection. (column with unreliable data)
    lineage:
      - datalake_inspections_clean.assessment.ts_started
  ts_updated:
    description: Assessment update date and time.
    lineage:
      - datalake_inspections_clean.assessment.ts_updated
  ts_load:
    description: Date and time when the data was loaded.
  year:
    description: Year referring to date of update.
    lineage:
      - datalake_inspections_clean.assessment.year
  month:
    description: Month referring to date of update.
    lineage:
      - datalake_inspections_clean.assessment.month
  day:
    description: Day referring to date of update.
    lineage:
      - datalake_inspections_clean.assessment.day
