dag:
  name: taskmaster
  schedule_start_date: 2022, 7, 27
  schedule_interval: 0 1 * * *
  owner: Data SS
  documentation:
    dag_purpose: This DAG imports the tables from [Taskmaster](https://github.com/quintoandar/taskmaster)

workflow:
  type: cdc
  layer: raw
  database_type: postgres
  source_database: taskmaster
  source_schema: public
  dbutils_secret_key: TASKMASTER_DB
  tables_customization:
    task: {}

cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: m5a.xlarge
    node_type_id: m5a.xlarge
    num_workers: 3
    spark_version: 13.3.x-scala2.12
    spark_conf:
      spark.sql.session.timeZone: "America/Sao_Paulo"
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
  databricks_conn_id: databricks_new
