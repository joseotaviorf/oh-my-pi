dag:
  name: help_center_api
  schedule_start_date: 2024,10,07
  schedule_interval: 0 0 * * *
  owner: Data SS
  documentation:
    dag_purpose: |
      DAG that ingests data from the help-center-api product databse
workflow:
  type: cdc
  layer: raw
  database_type: postgres
  source_schema: public
  dbutils_secret_key: HELP_CENTER_API_DB
  tables_customization:
    t_call_request:
      clean_table_name: call_request
      merge_on: [id_user, id_session]
    t_call_in_app_eligibility:
      clean_table_name: call_in_app_eligibility
      merge_on: [id_user, status]

cluster:
  type: databricks_12_2_min_general_cluster
