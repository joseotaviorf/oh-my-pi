dag:
  name: help_center_api
  schedule_start_date: 2024,10,07
  schedule_interval: 0 0 * * *
  owner: Data SS
  documentation:
    dag_purpose: |
      DAG that ingests data from the help-center-api product databse
workflow:
  type: cdc
  layer: raw
  database_type: postgres
  source_schema: public
  dbutils_secret_key: HELP_CENTER_API_DB
  tables_customization:
    t_call_request:
      clean_table_name: call_request
    t_call_in_app_eligibility:
      clean_table_name: call_in_app_eligibility

cluster:
  type: databricks_12_2_med_general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
