dag:
  name: help_center_api
  schedule_start_date: 2024,10,07
  schedule_interval: 0 0 * * *
  owner: Data SS
  documentation:
    dag_purpose: |
      DAG that ingests data from the help-center-api product databse
workflow:
  type: cdc
  layer: raw
  database_type: postgres
  source_schema: public
  dbutils_secret_key: HELP_CENTER_API_DB
  tables_customization:
    t_call_request:
      clean_table_name: call_request
    t_call_in_app_eligibility:
      clean_table_name: call_in_app_eligibility
    t_article_recommendation:
      clean_table_name: article_recommendation
    t_article:
      clean_table_name: article
    t_ongoing_requests:
      clean_table_name: ongoing_requests
    t_whatsapp_migration_strategy:
      clean_table_name: whatsapp_migration_strategy
cluster:
  type: databricks_12_2_min_general_cluster
