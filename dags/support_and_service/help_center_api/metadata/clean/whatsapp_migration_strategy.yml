database_name: datalake_help_center_api_clean
table_name: whatsapp_migration_strategy
description: >
  One row per user WhatsApp migration strategy assignment in the Help Center API. Each
  record defines which migration path a given user is assigned to when transitioning to
  WhatsApp-based support contact, used to orchestrate the rollout of the WhatsApp channel.
  Source system is Help Center API.
domain: Support and Services
owner: gabriel.firmino@quintoandar.com.br
columns:
  id_user:
    lineage:
      - datalake_help_center_api_raw.t_whatsapp_migration_strategy.id
    description: Unique identifier of the QuintoAndar user assigned to a WhatsApp migration strategy.
  migration_strategy:
    lineage:
      - datalake_help_center_api_raw.t_whatsapp_migration_strategy.migration_strategy
    description: Migration strategy assigned to this user (e.g., immediate, gradual, holdout), controlling when and how they are migrated to WhatsApp support.
  ts_created:
    lineage:
      - datalake_help_center_api_raw.t_whatsapp_migration_strategy.created_at
    description: Timestamp when the WhatsApp migration strategy was first assigned to this user.
  ts_updated:
    lineage:
      - datalake_help_center_api_raw.t_whatsapp_migration_strategy.updated_at
    description: Timestamp of the last update to this user's WhatsApp migration strategy assignment.
