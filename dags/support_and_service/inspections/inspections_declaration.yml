dag:
  name: inspections
  schedule_start_date: 2021, 11, 30
  schedule_interval: 15 3 * * *
  owner: Data SS
  documentation:
    dag_purpose: |
      "Retrieves data from the Inspections database (PostgreSQL). [Inspections](https://github.com/quintoandar/inspections-service)\n
      is a micro service to inspections with this database we need to measure the lead time inspections, when inspector start and \n
      finish inspection, if he follow the planner's route."
workflow:
  type: database_pull_delta
  layer: raw
  database_type: postgres
  lineage_product_database_name: inspections
  dbutils_secret_key: INSPECTIONS_DB
  default_extraction_type: incremental
  default_partitions: [year, month, day]
  tables_customization:
    appointment_aud:
      date_filter_column: updated_at
    appointment:
      merge_on: ["id_appointment"]
      date_filter_column: updated_at
    assessment:
      merge_on: ["id_assessment"]
      date_filter_column: updated_at
    assessment_aud:
      date_filter_column: updated_at
    budget:
      merge_on: ["id_budget"]
      date_filter_column: updated_at
    budget_aud:
      date_filter_column: updated_at
    budget_approval_payment_preference:
      merge_on: ["id_budget_approval_payment_preference"]
      date_filter_column: updated_at
    budget_approval_payment_preference_aud:
      date_filter_column: updated_at
    contestation_media:
      merge_on: ["id_contestation_media"]
      date_filter_column: updated_at
    contestation_media_aud:
      date_filter_column: updated_at
    contestation:
      merge_on: ["id_contestation"]
      date_filter_column: updated_at
    contestation_aud:
      date_filter_column: updated_at
    inspection_aud:
      date_filter_column: updated_at
    inspection:
      merge_on: ["id_inspection"]
      date_filter_column: updated_at
    issue_type:
      merge_on: ["id_issue_type"]
      date_filter_column: updated_at
    issue_type_aud:
      date_filter_column: updated_at
    item_group_type:
      merge_on: ["id_item_group_type"]
      date_filter_column: updated_at
    item_group_type_aud:
      date_filter_column: updated_at
    item_group:
      merge_on: ["id_item_group"]
      date_filter_column: updated_at
    item_group_aud:
      date_filter_column: updated_at
    item_group_state:
      merge_on: ["id"]
      date_filter_column: updated_at
    item_group_state_aud:
      date_filter_column: updated_at
    item_issue:
      merge_on: ["id_item_issue"]
      date_filter_column: updated_at
    item_issue_aud:
      date_filter_column: updated_at
    item_media:
      merge_on: ["id_item_media"]
      date_filter_column: updated_at
    item_media_aud:
      date_filter_column: updated_at
    item_type:
      merge_on: ["id_item_type"]
      date_filter_column: updated_at
    item_type_aud:
      date_filter_column: updated_at
    item:
      merge_on: ["id_item"]
      date_filter_column: updated_at
    item_aud:
      date_filter_column: updated_at
    repair_request_media:
      merge_on: ["id_repair_request_media"]
      date_filter_column: updated_at
    repair_request_media_aud:
      date_filter_column: updated_at
    repair_request:
      merge_on: ["id_repair_request"]
      date_filter_column: updated_at
    repair_request_aud:
      date_filter_column: updated_at
    repair_suggestion:
      merge_on: ["id"]
      date_filter_column: updated_at
    repair_suggestion_aud:
      date_filter_column: updated_at
    review_media:
      merge_on: ["id_review_media"]
      date_filter_column: updated_at
    review_media_aud:
      date_filter_column: updated_at
    review:
      merge_on: ["id_review"]
      date_filter_column: updated_at
    review_aud:
      date_filter_column: updated_at
    reviewer_aud:
      date_filter_column: updated_at
    reviewer:
      merge_on: ["id_reviewer"]
      date_filter_column: updated_at
    room_type:
      merge_on: ["id_room_type"]
      date_filter_column: updated_at
    room_type_aud:
      date_filter_column: updated_at
    room:
      merge_on: ["id_room"]
      date_filter_column: updated_at
    room_aud:
      date_filter_column: updated_at
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, ds, 'load_end_date') }}"
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: r5a.xlarge
    node_type_id: r5a.xlarge
    num_workers: 3
    spark_version: 12.2.x-scala2.12
