---
database_name: datalake_inspections_clean
table_name: item_group_state_aud
description:
  This audit table aims to store the minimum requirements information that an item needs for a repair to be suggested with history.
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_inspections_raw.item_group_state_aud.id
    description: 
      Unique identifier (number)
  id_item_group_type:
    lineage:
      - datalake_inspections_raw.item_group_state_aud.item_group_type_id
    description: 
      Records which item_group_type the criteria described in this record will relate to.
  id_repair_suggestion:
    lineage:
      - datalake_inspections_raw.item_group_state_aud.repair_suggestion_id
    description: 
      Records which repair will be suggested when the criteria are met.
  id_previous_item_type:
    lineage:
      - datalake_inspections_raw.item_group_state_aud.previous_item_type_id
    description: 
      Registers the problem macro tag in the item_group in the incoming inspection.
  id_current_item_type:
    lineage:
      - datalake_inspections_raw.item_group_state_aud.current_item_type_id
    description: 
      Registers the item_group problem macro tag in the output inspection.
  id_previous_item_issue_type:
    lineage:
      - datalake_inspections_raw.item_group_state_aud.previous_item_issue_type_id
    description:
      Register the item_group micro problem tag in the incoming inspection.
  id_current_item_issue_type:
    lineage:
      - datalake_inspections_raw.item_group_state_aud.current_item_issue_type_id
    description:
      Registers the item_group micro problem tag in the output inspection.
  item_group_status:
    lineage:
      - datalake_inspections_raw.item_group_state_aud.item_group_status
    description: 
      Records whether the item_group is present, absent or replaced.
  rev:
    lineage:
      - datalake_inspections_raw.item_group_state_aud.rev
    description: 
      Foreign key of the RevInfo table, which indicates when the record was changed.
  rev_type:
    lineage:
      - datalake_inspections_raw.item_group_state_aud.revtype
    description: 
      Indicates whether the line refers to an inclusion, alteration or deletion.
  rev_end:
    lineage:
      - datalake_inspections_raw.item_group_state_aud.revend
    description: 
      ""
  mod_id_item_group_type:
    lineage:
      - datalake_inspections_raw.item_group_state_aud.item_group_type_id_mod
    description: 
      Boolean information that indicates the modification of item_group_type data.
  mod_id_repair_suggestion:
    lineage:
      - datalake_inspections_raw.item_group_state_aud.repair_suggestion_id_mod
    description: 
      Boolean information that indicates the modification of id_repair_suggestion data.
  mod_id_previous_item_type:
    lineage:
      - datalake_inspections_raw.item_group_state_aud.previous_item_type_id_mod
    description: 
      Boolean information that indicates the modification of id_previous_item_type data.
  mod_id_current_item_type:
    lineage:
      - datalake_inspections_raw.item_group_state_aud.current_item_type_id_mod
    description: 
      Boolean information that indicates the modification of id_current_item_type data.
  mod_id_previous_item_issue_type:
    lineage:
      - datalake_inspections_raw.item_group_state_aud.previous_item_issue_type_id_mod
    description: 
      Boolean information that indicates the modification of id_previous_item_issue_type data.
  mod_id_current_item_issue_type:
    lineage:
      - datalake_inspections_raw.item_group_state_aud.current_item_issue_type_id_mod
    description: 
      Boolean information that indicates the modification of id_current_item_issue_type data.
  mod_item_group_status:
    lineage:
      - datalake_inspections_raw.item_group_state_aud.item_group_status_mod
    description: 
      Boolean information that indicates the modification of item_group_status data.
  mod_ts_created:
    lineage:
      - datalake_inspections_raw.item_group_state_aud.created_at_mod
    description: 
      Boolean information that indicates the modification of ts_created data.
  mod_ts_updated:
    lineage:
      - datalake_inspections_raw.item_group_state_aud.updated_at_mod
    description: 
      Boolean information that indicates the modification of ts_updated data.
  ts_created:
    lineage:
      - datalake_inspections_raw.item_group_state_aud.created_at
    description: 
      Creation date in timestamp format.
  ts_updated:
    lineage:
      - datalake_inspections_raw.item_group_state_aud.updated_at
    description: 
      Update date in timestamp format.
  year:
    lineage:
      - datalake_inspections_raw.item_group_state_aud.year
    description: Year of update date.
  month:
    lineage:
      - datalake_inspections_raw.item_group_state_aud.month
    description: Month of update date.
  day:
    lineage:
      - datalake_inspections_raw.item_group_state_aud.day
    description: Day of update date.
