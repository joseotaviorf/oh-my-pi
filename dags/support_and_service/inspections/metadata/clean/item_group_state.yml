---
database_name: datalake_inspections_clean
table_name: item_group_state
description:
  This table aims to store the minimum requirements information that an item needs for a repair to be suggested.
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_inspections_raw.item_group_state.id
    description: 
      Unique identifier (number)
  id_item_group_type:
    lineage:
      - datalake_inspections_raw.item_group_state.item_group_type_id
    description: 
      Records which item_group_type the criteria described in this record will relate to.
  id_repair_suggestion:
    lineage:
      - datalake_inspections_raw.item_group_state.repair_suggestion_id
    description: 
      Records which repair will be suggested when the criteria are met.
  id_previous_item_type:
    lineage:
      - datalake_inspections_raw.item_group_state.previous_item_type_id
    description: 
      Registers the problem macro tag in the item_group in the incoming inspection.
  id_current_item_type:
    lineage:
      - datalake_inspections_raw.item_group_state.current_item_type_id
    description: 
      Registers the item_group problem macro tag in the output inspection.
  id_previous_item_issue_type:
    lineage:
      - datalake_inspections_raw.item_group_state.previous_item_issue_type_id
    description:
      Register the item_group micro problem tag in the incoming inspection.
  id_current_item_issue_type:
    lineage:
      - datalake_inspections_raw.item_group_state.current_item_issue_type_id
    description:
      Registers the item_group micro problem tag in the output inspection.
  item_group_status:
    lineage:
      - datalake_inspections_raw.item_group_state.item_group_status
    description: 
      Records whether the item_group is present, absent or replaced
  ts_created:
    lineage:
      - datalake_inspections_raw.item_group_state.created_at
    description: 
      Creation date in timestamp format.
  ts_updated:
    lineage:
      - datalake_inspections_raw.item_group_state.updated_at
    description: 
      Update date in timestamp format.
