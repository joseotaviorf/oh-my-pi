---
database_name: datalake_inspections_clean
table_name: review
description:
  After the inspection, the tenant and the property owner can review the
  report and contest the result given by the inspector.
domain: Support and Services
owner: data-ae-ss@quintoandar.com.br
columns:
  id_review:
    lineage:
      - datalake_inspections_raw.review.id
    description: Review unique identifier (number)
  id_item:
    lineage:
      - datalake_inspections_raw.review.item_id
    description: Item unique identifier (number)
  id_user:
    lineage:
      - datalake_inspections_raw.review.user_id
    description: Reviewer user unique identifier (number). This field is legacy,
      meaning it is no longer updated. The column that currently contains this
      information is id_reviewer.

      Some records can be found with both the id_user and the id_reviewer null.
      This is because some people are still using the old tool (they shouldn't be), but it will
      be completely deactivated in Q1/2024, so after that, these cases will definitely end.
  id_reviewer:
    lineage:
      - datalake_inspections_raw.review.reviewer_id
    description: Reviewer unique identifier (number)
      Some records can be found with both the id_user and the id_reviewer null.
      This is because some people are still using the old tool (they shouldn't be), but it will
      be completely deactivated in Q1/2024, so after that, these cases will definitely end.
  user_type:
    lineage:
      - datalake_inspections_raw.review.user_type
    description: Indicates whether the user who reviewed was the tenant or owner
  comment:
    lineage:
      - datalake_inspections_raw.review.comment
    description: Displays a reviewer user comment
  ts_created:
    lineage:
      - datalake_inspections_raw.review.created_at
    description: Creation date
  ts_updated:
    lineage:
      - datalake_inspections_raw.review.updated_at
    description: Update date
  year:
    lineage:
      - datalake_inspections_raw.review.year
    description: Year of update date.
  month:
    lineage:
      - datalake_inspections_raw.review.month
    description: Month of update date.
  day:
    lineage:
      - datalake_inspections_raw.review.day
    description: Day of update date.
