---
database_name: datalake_inspections_clean
table_name: repair_request_aud
description:
  This table provides information on repair requests after the inspection
  process.
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  id_repair_request:
    lineage:
      - datalake_inspections_raw.repair_request_aud.id
    description: Repair Request unique identifier (number)
  id_reviewer:
    lineage:
      - datalake_inspections_raw.repair_request_aud.reviewer_id
    description: Author of repair request
  id_main:
    lineage:
      - datalake_inspections_raw.repair_request_aud.main_id
    description: Item id in Main monolith
  responsibility:
    lineage:
      - datalake_inspections_raw.repair_request_aud.responsibility
    description: Indicates who will be responsible for the repair, as well as whether QuintoAndar will absorb a repair
  id_item_group:
    lineage:
      - datalake_inspections_raw.repair_request_aud.item_group_id
    description: Object that will need repairs
  id_granted_by:
    lineage:
      - datalake_inspections_raw.repair_request_aud.granted_by_id
    description:
      Reviewer who assessed whether a repair was exempted. Being an owner
      or member of AN1
  id_repair_suggestion:
    lineage:
      - datalake_inspections_raw.repair_request_aud.repair_suggestion_id
    description: Repair suggestion identification key.
  uuid:
    lineage:
      - datalake_inspections_raw.repair_request_aud.uuid
    description: Repair Request unique identifier (uuid)
  type:
    lineage:
      - datalake_inspections_raw.repair_request_aud.type
    description: A repair request type.
    categories:
      REPAIR: Make item repair.
      CLEAN: Clean the item.
      TAKE AWAY: Remove item left in the property.
      GIVE BACK: Replace item that was in the property.
      OTHER: Other types not listed.
  comment:
    lineage:
      - datalake_inspections_raw.repair_request_aud.comment
    description: Commentary detailing the repair needed
  repair_service:
    lineage:
      - datalake_inspections_raw.repair_request_aud.repair_service
    description: ""
  title:
    lineage:
      - datalake_inspections_raw.repair_request_aud.title
    description: ""
  cost:
    lineage:
      - datalake_inspections_raw.repair_request_aud.cost
    description: ""
  rev:
    lineage:
      - datalake_inspections_raw.repair_request_aud.rev
    description: Foreign key of the RevInfo table, which indicates when the record was changed
  revtype:
    lineage:
      - datalake_inspections_raw.repair_request_aud.revtype
    description: Indicates whether the line refers to an inclusion, alteration or deletion.
    categories:
      "0": Inclusion operation.
      "1": Alteration operation.
      "2": Deletion operation.
  revend:
    lineage:
      - datalake_inspections_raw.repair_request_aud.revend
    description: Number of the next revision of this id.
  is_exempted:
    lineage:
      - datalake_inspections_raw.repair_request_aud.exempted
    description:
      Indicates whether the repair suggested by the AN1 team was exempted
      by the owner or a member of AN1
  is_exempted_from_budget:
    lineage:
      - datalake_inspections_raw.repair_request_aud.is_exempted_from_budget
    description: Boolean information indicating whether the exemption occurred at the budget approval stage.
  is_from_analysis:
    lineage:
      - datalake_inspections_raw.repair_request_aud.from_analysis
    description: Indicates whether the repair request was created by AN1
  is_finished:
    lineage:
      - datalake_inspections_raw.repair_request_aud.finished
    description: ""
  has_automatically_identified:
    lineage:
      - datalake_inspections_raw.repair_request_aud.automatically_identified
    description: Boalean type information that indicates whether the repair was generated automatically.
  has_automatic_identification_accepted:
    lineage:
      - datalake_inspections_raw.repair_request_aud.automatic_identification_accepted
    description: Boalean type information that indicates whether the automatically generated repair was accepted.
  mod_id_reviewer:
