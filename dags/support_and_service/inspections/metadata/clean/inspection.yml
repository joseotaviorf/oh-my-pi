---
database_name: datalake_inspections_clean
table_name: inspection
description:
  It handles the entire process of scheduling an inspection, including cancellations and
  rescheduling, until the inspection actually takes place.
domain: Support and Services
owner: data-ae-ss@quintoandar.com.br
columns:
  id_inspection:
    lineage:
      - datalake_inspections_raw.inspection.id
    description: Inspection unique identifier (number)
  id_previous_inspection:
    lineage:
      - datalake_inspections_raw.inspection.previous_inspection_id
    description:
      If there is a previous inspection for the same contract, it will
      be indicated in this column. It is usually completed in offboarding inspections,
      bringing the identification of the onboarding or dispute inspection.
  id_client_side:
    lineage:
      - datalake_inspections_raw.inspection.client_side_id
    description: Inspection unique identifier (uuid)
  id_contract:
    lineage:
      - datalake_inspections_raw.inspection.contract_id
    description: Unique identifier of the contract related to the property to be inspected
  id_external:
    lineage:
      - datalake_inspections_raw.inspection.external_id
    description: Inspection correlational unique identifier in the PWA database
  id_inspector:
    lineage:
      - datalake_inspections_raw.inspection.inspector_id
    description:
      Unique identifier of the inspector responsible for carrying out the
      inspection
  id_schedule:
    lineage:
      - datalake_inspections_raw.inspection.schedule_id
    description: Unique identifier of the inspection date and time schedule
  contract:
    lineage:
      - datalake_inspections_raw.inspection.contract
    description: Data of the parties interested in the contract
  house:
    lineage:
      - datalake_inspections_raw.inspection.house
    description: Property address and brief description of the house
  schedule:
    lineage:
      - datalake_inspections_raw.inspection.schedule
    description:
      Date and time of scheduling the inspection execution and location
      of keys
  status:
    lineage:
      - datalake_inspections_raw.inspection.status
    description: Identifies the stage of the inspection from scheduling to review.
    categories:
      scheduled: Inspection scheduled and awaiting execution [onboarding/offboarding]
      received: Inspection sent by the inspector, waiting for synchronization with the Main [offboarding]
      processing: Survey has been received and will be performed by the surveyor [onboarding]
      sent_to_review: Indicates that the owner and tenant are able to do their reviews [onboarding]
      review_started: When the owner or/and the tenant makes a comment [onboarding]
      sent_to_analysis: Inspection available for operations team interventions [offboarding]
      sent_to_owner_review: Review available for owner review [offboarding]
      review_started_by_owner: Survey whose owner has already done some intervention [offboarding]
      sent_to_tenant_review: Survey available for tenant review [offboarding]
      review_started_by_tenant: Survey whose tenant has already done some intervention [offboarding]
      reviewed: |
        offboarding: Survey sent to the Operations team to validate interventions proposed by owner/tenant
        onboarding: When the review deadline is reached
  type:
    lineage:
      - datalake_inspections_raw.inspection.type
    description: The type of inspection.
    categories:
      onboarding: Inspection carried out before the tenant enters the property, to certify the conditions of the house
      verification: Inspection carried out when there is any relevant change in the property, such as the creation of rooms, for example
      offboarding: Inspection carried out after the tenant leaves the property, to certify the conditions of the house
  is_comparative:
    lineage:
      - datalake_inspections_raw.inspection.comparative
    description:
      Field that indicates whether a previous inspection will be used as
      a basis for comparison
  ts_schedule:
    lineage:
      - datalake_inspections_raw.inspection.schedule_date
    description: Scheduled date for carrying out the inspection
  ts_created:
    lineage:
      - datalake_inspections_raw.inspection.created_at
    description:
      Timestamp of when the inspection request was synchronized in the
      database product
  ts_updated:
    lineage:
      - datalake_inspections_raw.inspection.updated_at
    description:
      Timestamp of when the inspection request was updated in the database
      product
  year:
    lineage:
      - datalake_inspections_raw.inspection.year
    description: Year of update date.
  month:
    lineage:
      - datalake_inspections_raw.inspection.month
    description: Month of update date.
  day:
    lineage:
      - datalake_inspections_raw.inspection.day
    description: Day of update date.
