---
database_name: datalake_inspections_clean
table_name: repair_request
description:
  This table provides information on repair requests after the inspection
  process.
domain: Support and Services
owner: data-ae-ss@quintoandar.com.br
columns:
  id_repair_request:
    lineage:
      - datalake_inspections_raw.repair_request.id
    description: Repair Request unique identifier (number)
  id_reviewer:
    lineage:
      - datalake_inspections_raw.repair_request.reviewer_id
    description: Author of repair request
  id_main:
    lineage:
      - datalake_inspections_raw.repair_request.main_id
    description: Item id in Main monolith
  responsibility:
    lineage:
      - datalake_inspections_raw.repair_request.responsibility
    description: Indicates who will be responsible for the repair, as well as whether QuintoAndar will absorb a repair
  id_item_group:
    lineage:
      - datalake_inspections_raw.repair_request.item_group_id
    description: Object that will need repairs
  id_granted_by:
    lineage:
      - datalake_inspections_raw.repair_request.granted_by_id
    description:
      Reviewer who assessed whether a repair was exempted. Being an owner
      or member of AN1
  id_repair_suggestion:
    lineage:
      - datalake_inspections_raw.repair_request.repair_suggestion_id
    description: Repair suggestion identification key.
  uuid:
    lineage:
      - datalake_inspections_raw.repair_request.uuid
    description: Repair Request unique identifier (uuid)
  type:
    lineage:
      - datalake_inspections_raw.repair_request.type
    description: A repair request type.
    categories:
      REPAIR: Make item repair.
      CLEAN: Clean the item.
      TAKE AWAY: Remove item left in the property.
      GIVE BACK: Replace item that was in the property.
      OTHER: Other types not listed.
  comment:
    lineage:
      - datalake_inspections_raw.repair_request.comment
    description: Commentary detailing the repair needed
  repair_service:
    lineage:
      - datalake_inspections_raw.repair_request.repair_service
    description: ""
  title:
    lineage:
      - datalake_inspections_raw.repair_request.title
    description: ""
  cost:
    lineage:
      - datalake_inspections_raw.repair_request.cost
    description: ""
  is_exempted:
    lineage:
      - datalake_inspections_raw.repair_request.exempted
    description:
      Indicates whether the repair suggested by the AN1 team was exempted
      by the owner or a member of AN1
  is_exempted_from_budget:
    lineage:
      - datalake_inspections_raw.repair_request.is_exempted_from_budget
    description: Boolean information indicating whether the exemption occurred at the budget approval stage.
  is_from_analysis:
    lineage:
      - datalake_inspections_raw.repair_request.from_analysis
    description: Indicates whether the repair request was created by AN1
  is_finished:
    lineage:
      - datalake_inspections_raw.repair_request.finished
    description: ""
  has_automatically_identified:
    lineage:
      - datalake_inspections_raw.repair_request.automatically_identified
    description: Boalean type information that indicates whether the repair was generated automatically.
  has_automatic_identification_accepted:
    lineage:
      - datalake_inspections_raw.repair_request.automatic_identification_accepted
    description: Boalean type information that indicates whether the automatically generated repair was accepted.
  ts_granted:
    lineage:
      - datalake_inspections_raw.repair_request.granted_at
    description:
      Indicates the time at which the repair request exempted assessment
      was made
  ts_created:
    lineage:
      - datalake_inspections_raw.repair_request.created_at
    description: Creation date
  ts_updated:
    lineage:
      - datalake_inspections_raw.repair_request.updated_at
    description: Update date
  year:
    lineage:
      - datalake_inspections_raw.repair_request.year
    description: Year of update date.
  month:
    lineage:
      - datalake_inspections_raw.repair_request.month
    description: Month of update date.
  day:
    lineage:
      - datalake_inspections_raw.repair_request.day
    description: Day of update date.
