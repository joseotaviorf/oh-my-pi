---
database_name: datalake_inspections_clean
table_name: budget_approval_payment_preference_aud
description: This table aims to store the user's payment preference information in the product database with its history.
domain: Support and Services
owner: data-ae-ss@quintoandar.com.br
columns:
  id_budget_approval_payment_preference:
    lineage:
      - datalake_inspections_raw.budget_approval_payment_preference_aud.id
    description: Unique identification key for payment preference in the product bank.
  id_budget:
    lineage:
      - datalake_inspections_raw.budget_approval_payment_preference_aud.budget_id
    description: Budget identification key in the product bank.
  id_inspection:
    lineage:
      - datalake_inspections_raw.budget_approval_payment_preference_aud.inspection_id
    description: Inspection identification key linked to the budget approval process.
  id_reviewer:
    lineage:
      - datalake_inspections_raw.budget_approval_payment_preference_aud.reviewer_id
    description: Identification key of the reviewer of the budget approval process.
  type:
    lineage:
      - datalake_inspections_raw.budget_approval_payment_preference_aud.type
    description: Descriptive information indicating the type of payment the user preferred.
    categories:
      CREDIT_CARD: "If the user preferred payment by credit card."
      PAYMENT_SLIP: "If the user preferred to pay by bank slip."
  mod_type:
    lineage:
      - datalake_inspections_raw.budget_approval_payment_preference_aud.type_mod
    description: Boolean information indicating whether type has been modified.
  installments:
    lineage:
      - datalake_inspections_raw.budget_approval_payment_preference_aud.installments
    description: Integer information indicating the number of installments for payment.
  mod_installments:
    lineage:
      - datalake_inspections_raw.budget_approval_payment_preference_aud.installments_mod
    description: Boolean information indicating whether installments has been modified.
  total:
    lineage:
      - datalake_inspections_raw.budget_approval_payment_preference_aud.total
    description: Float type information indicating the total value of the budget approval.
  mod_total:
    lineage:
      - datalake_inspections_raw.budget_approval_payment_preference_aud.total_mod
    description: Boolean information indicating whether total has been modified.
  rev_type:
    lineage:
      - datalake_inspections_raw.budget_approval_payment_preference_aud.revtype
    description: Indicates whether the line refers to an inclusion, alteration or deletion.
    categories:
      "0": Inclusion operation.
      "1": Alteration operation.
      "2": Deletion operation.
  rev:
    lineage:
      - datalake_inspections_raw.budget_approval_payment_preference_aud.rev
    description: Foreign key of the RevInfo table, which indicates when the record was changed.
  rev_end:
    lineage:
      - datalake_inspections_raw.budget_approval_payment_preference_aud.revend
    description: Reference the most recent rev data for a record.
  ts_created:
    lineage:
      - datalake_inspections_raw.budget_approval_payment_preference_aud.created_at
    description: Timestamp information indicating when the payment preference record was created.
  mod_ts_created:
    lineage:
      - datalake_inspections_raw.budget_approval_payment_preference_aud.created_at_mod
    description: Boolean information indicating whether ts_created has been modified.
  ts_updated:
    lineage:
      - datalake_inspections_raw.budget_approval_payment_preference_aud.updated_at
    description: Timestamp information indicating when the payment preference record was updated.
  mod_ts_updated:
    lineage:
      - datalake_inspections_raw.budget_approval_payment_preference_aud.updated_at_mod
    description: Boolean information indicating whether ts_updated has been modified.
  year:
    lineage:
      - datalake_inspections_raw.budget_approval_payment_preference_aud.year
    description: Year of update date.
  month:
    lineage:
      - datalake_inspections_raw.budget_approval_payment_preference_aud.month
    description: Month of update date.
  day:
    lineage:
      - datalake_inspections_raw.budget_approval_payment_preference_aud.day
    description: Day of update date.
