---
database_name: datalake_inspections_clean
table_name: budget_approval_payment_preference
description: This table is intended to store the user's payment preference information in the budget approval process.
domain: Support and Services
owner: data-ae-ss@quintoandar.com.br
columns:
  id_budget_approval_payment_preference:
    lineage:
      - datalake_inspections_raw.budget_approval_payment_preference.id
    description: Unique identification key for payment preference in the product bank.
  id_budget:
    lineage:
      - datalake_inspections_raw.budget_approval_payment_preference.budget_id
    description: Budget identification key in the product bank.
  id_inspection:
    lineage:
      - datalake_inspections_raw.budget_approval_payment_preference.inspection_id
    description: Inspection identification key linked to the budget approval process.
  id_reviewer:
    lineage:
      - datalake_inspections_raw.budget_approval_payment_preference.reviewer_id
    description: Identification key of the reviewer of the budget approval process.
  type:
    lineage:
      - datalake_inspections_raw.budget_approval_payment_preference.type
    description: Descriptive information indicating the type of payment the user preferred.
    categories:
      CREDIT_CARD: "If the user preferred payment by credit card."
      PAYMENT_SLIP: "If the user preferred to pay by bank slip."
  installments:
    lineage:
      - datalake_inspections_raw.budget_approval_payment_preference.installments
    description: Integer information indicating the number of installments for payment.
  total:
    lineage:
      - datalake_inspections_raw.budget_approval_payment_preference.total
    description: Float type information indicating the total value of the budget approval.
  ts_created:
    lineage:
      - datalake_inspections_raw.budget_approval_payment_preference.created_at
    description: Timestamp information indicating when the payment preference record was created.
  ts_updated:
    lineage:
      - datalake_inspections_raw.budget_approval_payment_preference.updated_at
    description: Timestamp information indicating when the payment preference record was updated.
  year:
    lineage:
      - datalake_inspections_raw.budget_approval_payment_preference.year
    description: Year of update date.
  month:
    lineage:
      - datalake_inspections_raw.budget_approval_payment_preference.month
    description: Month of update date.
  day:
    lineage:
      - datalake_inspections_raw.budget_approval_payment_preference.day
    description: Day of update date.
