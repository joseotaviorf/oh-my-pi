---
database_name: datalake_inspections_clean
table_name: reviewer
description: Data referring to the reviewers of the inspection report.
domain: Support and Services
owner: data-ae-ss@quintoandar.com.br
columns:
  id_reviewer:
    lineage:
      - datalake_inspections_raw.reviewer.id
    description: Review unique identifier (number)
  id_user:
    lineage:
      - datalake_inspections_raw.reviewer.user_id
    description: Id of the user who performed the review
  id_assessment:
    lineage:
      - datalake_inspections_raw.reviewer.assessment_id
    description: Indicates which assessment this reviewer belongs to
  uuid:
    lineage:
      - datalake_inspections_raw.reviewer.uuid
    description: Review unique identifier (uuid)
  reviewer_type:
    lineage:
      - datalake_inspections_raw.reviewer.reviewer_type
    description: The types of reviewers.
    categories:
      OWNER: Owner of the property.
      TENANT: Tenant of the property.
      ADMIN: Team of Repair Analysis.
      INSPECTIONS_SERVICE: Used for automatic repair suggestions.
  approval_type:
    lineage:
      - datalake_inspections_raw.reviewer.approval_type
    description: Refers to the context in which the approval occurred
    categories:
      REVIEW: Approval made by the analyst, owner or tenant, after completing the review of the inspection report and the required repairs.
      REPAIR_ANALYSIS: Approval made by the analyst, after completing the analysis of the inspection report and creating repair requests
      CONTESTATION_ANALYSIS: Approval made by the analyst, after completing the dispute analyzes and new repair requests made by the owner and tenant
  approval_reason:
    lineage:
      - datalake_inspections_raw.reviewer.approval_reason
    description: Reason why the reviewer approved or disapproved
  approval_comment:
    lineage:
      - datalake_inspections_raw.reviewer.approval_comment
    description: Reviewer's comment about approving or disapproving
  is_approved:
    lineage:
      - datalake_inspections_raw.reviewer.approved
    description: Indicates whether the owner completed the review manually
  ts_approved:
    lineage:
      - datalake_inspections_raw.reviewer.approved_at
    description: Timestamp of when it was approved
  ts_created:
    lineage:
      - datalake_inspections_raw.reviewer.created_at
    description: Creation date
  ts_updated:
    lineage:
      - datalake_inspections_raw.reviewer.updated_at
    description: Update date
  year:
    lineage:
      - datalake_inspections_raw.reviewer.year
    description: Year of update date.
  month:
    lineage:
      - datalake_inspections_raw.reviewer.month
    description: Month of update date.
  day:
    lineage:
      - datalake_inspections_raw.reviewer.day
    description: Day of update date.
