---
database_name: datalake_inspections_clean
table_name: item
description:
  The item object found in the database refers to a sub-item or sub-conditions within an item,
  for example breakdowns, humidity, door problem, etc.
domain: Support and Services
owner: data-ae-ss@quintoandar.com.br
columns:
  id_item:
    lineage:
      - datalake_inspections_raw.item.id
    description: Item unique identifier (number)
  id_item_group:
    lineage:
      - datalake_inspections_raw.item.item_group_id
    description: Item Group unique identifier (number)
  id_previous_item:
    lineage:
      - datalake_inspections_raw.item.previous_item_id
    description:
      If there is a previous evaluation for the item in the same contract,
      it will be indicated in this column. It is usually completed in offboarding
      inspections, bringing information from the onboarding or dispute inspection.
  id_type:
    lineage:
      - datalake_inspections_raw.item.type_id
    description: Indicates the type of problem
  id_main:
    lineage:
      - datalake_inspections_raw.item.main_id
    description: Item correlational unique identifier in the PWA database
  uuid:
    lineage:
      - datalake_inspections_raw.item.uuid
    description: Item unique identifier (uuid)
  comment:
    lineage:
      - datalake_inspections_raw.item.comment
    description: Displays a inspector's comment
  count:
    lineage:
      - datalake_inspections_raw.item.count
    description: Indicates the number of parts with problems
  status:
    lineage:
      - datalake_inspections_raw.item.status
    description: " "
  is_present:
    lineage:
      - datalake_inspections_raw.item.present
    description: Indicates if the issue checklist item was checked by the inspector
  is_active:
    lineage:
      - datalake_inspections_raw.item.active
    description: Boolean information with the aim of indicating whether the item is active or not.
  ts_created:
    lineage:
      - datalake_inspections_raw.item.created_at
    description: Creation timestamp
  ts_updated:
    lineage:
      - datalake_inspections_raw.item.updated_at
    description: Update timestamp
  year:
    lineage:
      - datalake_inspections_raw.item.year
    description: Year of update date.
  month:
    lineage:
      - datalake_inspections_raw.item.month
    description: Month of update date.
  day:
    lineage:
      - datalake_inspections_raw.item.day
    description: Day of update date.
