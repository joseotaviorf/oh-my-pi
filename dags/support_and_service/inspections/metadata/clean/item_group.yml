---
database_name: datalake_inspections_clean
table_name: item_group
description:
  This table deals with the items that were evaluated during the inspection. It is worth emphasizing
  that, when dealing with IS data, the item_group object refers to an item, such as window, door, floor, etc.
domain: Support and Services
owner: data-ae-ss@quintoandar.com.br
columns:
  id_item_group:
    lineage:
      - datalake_inspections_raw.item_group.id
    description: Item Group unique identifier (number)
  id_room:
    lineage:
      - datalake_inspections_raw.item_group.room_id
    description: Unique identifier of the room the Item Group belongs to
  id_type:
    lineage:
      - datalake_inspections_raw.item_group.type_id
    description: Indicates the type of the evaluated object
  id_main:
    lineage:
      - datalake_inspections_raw.item_group.main_id
    description: Item Group correlational unique identifier in the PWA database
  uuid:
    lineage:
      - datalake_inspections_raw.item_group.uuid
    description: Item Group unique identifier (uuid)
  name:
    lineage:
      - datalake_inspections_raw.item_group.name
    description:
      Description of the item group, for example floor, paint, lighting,
      etc. (typed by inspector)
  comment:
    lineage:
      - datalake_inspections_raw.item_group.comment
    description: Displays the comment typed by the inspector
  status:
    lineage:
      - datalake_inspections_raw.item_group.status
    description: Indicates the condition of the object for comparative surveys.
    categories:
      ABSENT: Object removed.
      SAME: Object in the same conditions as the previous inspection.
      REPLACED: Replaced object.
  is_inferior_quality:
    lineage:
      - datalake_inspections_raw.item_group.is_inferior_quality
    description: indicates the quality of the object in case of replacement
  is_active_status:
    lineage:
      - datalake_inspections_raw.item_group.active_status
    description: indicates the quality of the object in case of replacement
  is_active_inferior_quality:
    lineage:
      - datalake_inspections_raw.item_group.active_is_inferior_quality
    description: indicates the quality of the object in case of replacement
  ts_created:
    lineage:
      - datalake_inspections_raw.item_group.created_at
    description: Creation date
  ts_updated:
    lineage:
      - datalake_inspections_raw.item_group.updated_at
    description: Update date
  year:
    lineage:
      - datalake_inspections_raw.item_group.year
    description: Year of update date.
  month:
    lineage:
      - datalake_inspections_raw.item_group.month
    description: Month of update date.
  day:
    lineage:
      - datalake_inspections_raw.item_group.day
    description: Day of update date.
