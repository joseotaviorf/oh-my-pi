dag:
  name: insider_test
  schedule_start_date: 2019, 5, 31
  schedule_interval: 30 1 * * *
  owner: Data SS
  documentation:
    dag_purpose: |
      Retrieves data from the Insider database (PostgreSQL). [Insider](https://github.com/quintoandar/insider)
      is a manager for follow ups. In other words, the purpose of it is to store and manage Follow Ups (A.K.A. reviews).

workflow:
  type: cdc
  layer: raw
  database_type: postgres
  source_schema: public
  source_database: insider
  custom_schema: insider_test
  lineage_product_database_name: insider
  dbutils_secret_key: INSIDER_DB
  tables_customization:
    feature:
      raw_primary_keys: ["id"]
    resource:
      raw_primary_keys: ["id"]
    review_aud:
      raw_primary_keys: ["id", "rev"]
    review_feature:
      raw_primary_keys: ["id"]
    review:
      raw_primary_keys: ["id"]
    template_feature:
      raw_primary_keys: ["id"]
    template:
      raw_primary_keys: ["id"]
    user_revision_entity:
      raw_primary_keys: ["id"]

cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: r5a.2xlarge
    node_type_id: r5a.2xlarge
    num_workers: 3
    spark_version: 13.3.x-scala2.12
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
  databricks_conn_id: databricks_new
