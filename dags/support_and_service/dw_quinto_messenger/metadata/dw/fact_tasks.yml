---
database_name: dw_quinto_messenger
table_name: fact_tasks
description: Fact table representing every Twilio task of every chat conversation between an agent and a customer
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  sk_task:
    lineage:
      - datalake_quinto_messenger.task.id_task
    description: Twilio's ID for a task
  sk_chat:
    lineage:
      - datalake_quinto_messenger.channel.id_conversation
    description: An identifier for a macro interaction - sk_chat groups multiple sk_task together
  sk_quinto_messenger_agent:
    lineage:
      - datalake_quinto_messenger.task.id_agent
    description: Twilio's ID for an agent (worker)
  sk_created_date:
    lineage:
      - datalake_quinto_messenger.task.ts_created
    description: Timestamp of when the task was created
  is_forwarded:
    lineage:
      - datalake_quinto_messenger.task.is_forwarded
    description: Boolean indicating if the task is forwarded
  seconds_first_reply:
    lineage:
      - datalake_quinto_messenger.task.seconds_to_first_response
    description: Seconds taken for the first response inside a task
  task_number:
    lineage:
      - datalake_quinto_messenger.task.task_number
    description: Number of the task inside a conversation
  ts_load:
    description: Timestamp indicating when the data was loaded into the datalake
