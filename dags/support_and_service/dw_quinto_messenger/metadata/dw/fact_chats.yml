---
database_name: dw_quinto_messenger
table_name: fact_chats
description: Fact table representing every chat conversation exchanged between a customer and an agent
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  sk_chat:
    lineage:
      - datalake_quinto_messenger.channel.id_conversation
    description: An identifier for a macro interaction - sk_chat groups multiple sk_task together
  sk_session:
    lineage:
      - datalake_quinto_messenger.channel.id_source
    description: Sauron's ID for a customer contact
  sk_user:
    lineage:
      - datalake_ebdb_customer_contact_identification.customer_contact_identification.id_user
    description: ID of the customer
  sk_personal_document:
    lineage:
      - datalake_ebdb_customer_contact_identification.customer_contact_identification.cpf
    description: CPF of the customer
  sk_created_date:
    lineage:
      - datalake_quinto_messenger.channel.ts_created
    description: SK generated with the timestamp of creation for the conversation. Used to establish a relationship with dim_date
  minutes_duration:
    lineage:
      - datalake_quinto_messenger.channel.seconds_duration
    description: How long the conversation took, in minutes
  tasks:
    lineage:
      - datalake_quinto_messenger.task.id_task
    description: Number of Twilio tasks in a conversation
  ts_load:
    description: Timestamp indicating when the data was loaded into the datalake
