---
database_name: dw_quinto_messenger
table_name: dim_quinto_messenger_agent
description: Dimension table containing information of support agents on Twilio that answer to chat conversations
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  sk_quinto_messenger_agent:
    lineage:
      - datalake_quinto_messenger.task.id_agent
    description: Twilio's ID for an agent (worker)
  name:
    lineage:
      - datalake_quinto_messenger.task_event.agent_full_name
    description: Agent name
  email:
    lineage:
      - datalake_quinto_messenger.task_event.agent_email
    description: Agent email
  location:
    lineage:
      - datalake_quinto_messenger.task_event.agent_location
    description: Agent's working location - if it is 5A or a thir party.
  skills:
    lineage:
      - datalake_quinto_messenger.task_event.agent_skills
    description: Skills assigned to the agent
  ts_updated:
    lineage:
      - datalake_quinto_messenger.task_event.ts_updated
    description: Timestamp of when the agent was last updated
  ts_load:
    description: Timestamp indicating when the data was loaded into the datalake
