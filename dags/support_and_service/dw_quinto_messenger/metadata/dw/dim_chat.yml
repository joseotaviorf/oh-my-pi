---
database_name: dw_quinto_messenger
table_name: dim_chat
description: Dimension table containing extra information of every conversation in fact_chats, like phone numbers and status
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  sk_chat:
    lineage:
      - datalake_quinto_messenger.channel.id_conversation
    description: An identifier for a macro interaction - sk_chat groups multiple sk_task together
  channel:
    lineage:
      - datalake_quinto_messenger.channel.channel_type
    description: What was the channel used for the conversation
    categories:
      whatsapp: Conversation was held through WhatsApp messages
  customer_phone:
    lineage:
      - datalake_quinto_messenger.channel.from_phone_number
    description: Phone number of the customer
  twilio_phone:
    lineage:
      - datalake_quinto_messenger.channel.twilio_phone_number
    description: Phone number registered on Twilio - the number that replied to the customer
  status:
    lineage:
      - datalake_quinto_messenger.channel.channel_status
    description: Status of the channel
    categories:
      active: Channel is still active
      inactive: Channel has been inactivated
  is_forwarded:
    lineage:
      - datalake_quinto_messenger.channel.is_forwarded
    description: If the message has been forwarded
  ts_created:
    lineage:
      - datalake_quinto_messenger.channel.ts_created
    description: Timestamp of when the chat was created
  ts_updated:
    lineage:
      - datalake_quinto_messenger.channel.ts_updated
    description: Timestamp of when the chat was last updated
