dag:
  name: dw_tickets
  schedule_start_date: 2020,12,02
  owner: Data SS
  documentation:
    dag_purpose: |
      This DAG loads the DW tables of our Tickets data. This data is related to
      the external system named Zendesk, which is responsible for the tickets of
      the customer services.

workflow:
  type: query_delta
  layer: dw
  custom_schema: tickets
  tables_customization:
    fact_ticket_events:
      partitions: [year, month, day]
      extraction_type: incremental

cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: m7g.2xlarge
    node_type_id: m7g.2xlarge
    num_workers: 4
    spark_version: 13.3.x-scala2.12
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
  databricks_conn_id: databricks_new
