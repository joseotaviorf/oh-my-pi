database_name: dw_tickets
table_name: fact_ticket_events
description: Fact table that contains all update events on a ticket
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  sk_ticket:
    lineage:
      - datalake_zendesk.tickets.id_ticket
    description: Key of ticket that corresponds to the Zendesk ticket number
  sk_contract:
    lineage:
      - datalake_zendesk.tickets.id_contract
    description:
      Key of contract registered in QA that corresponds to the contract
      ID inputted by agent in Zendesk ticket form
  sk_job:
    lineage:
      - datalake_zendesk.ticket_funnel.id_job
    description: ID Job, from a specific ticket custom_field
  sk_agent:
    lineage:
      - datalake_zendesk.ticket_funnel.agent_email
    description: Identification key of the analyst assigned to the ticket, generated by an MD5 from the analyst's email.
  sk_session:
    lineage:
      - datalake_zendesk.tickets.id_session
    description: Sauron ID session
  sk_call:
    lineage:
      - datalake_zendesk.tickets.id_call
    description: Twilio ID call
  status:
    description: Status of the ticket
    lineage:
      - datalake_zendesk.tickets.status
  channel:
    description: The source where the ticket was created from the company perspective
    lineage:
      - datalake_zendesk.tickets.channel
  subject:
    description: Ticket subject, filled by the creator of the ticket. Tickets created via API or email do not have a required subject and will have the same value as description in this column
    lineage:
      - datalake_zendesk.tickets.subject
  description:
    description: The first comment on the ticket.
    lineage:
      - datalake_zendesk.tickets.description
  type:
    description: Type of the ticket
    lineage:
      - datalake_zendesk.tickets.type
  via:
    description: The Zendesk's default source where the ticket was created
    lineage:
      - datalake_zendesk.tickets.via
  priority:
    description: Ticket priority
    lineage:
      - datalake_zendesk.tickets.priority
  recipient:
    description: Ticket recipient
    lineage:
      - datalake_zendesk.tickets.recipient
  tags:
    description: Tags added to the ticket
    lineage:
      - datalake_zendesk.tickets.tags
  satisfaction_rating:
    description: Customer satisfaction data
    lineage:
      - datalake_zendesk.tickets.satisfaction_rating
  client_type:
    description: Type of client, from custom_fields like 'Tipo de Cliente'
    lineage:
      - datalake_zendesk.tickets.custom_fields
  step_tag:
    description: Journey step of the client, from custom_fields
    lineage:
      - datalake_zendesk.tickets.custom_fields
  customer_type_tag:
    description: Tag attached to the customer that requested the ticket, also from specific custom_fields
    lineage:
      - datalake_zendesk.tickets.custom_fields
  contact_theme_tag:
    description: Specific custom_fields associated with ticket taxonomy
    lineage:
      - datalake_zendesk.tickets.custom_fields
  contact_motivation_tag:
    description: Tag attached to the reason the customer opened a ticket, also from specific custom_fields
    lineage:
      - datalake_zendesk.tickets.custom_fields
  contact_theme_detail_tag:
    description: Specific custom_fields associated with ticket taxonomy
    lineage:
      - datalake_zendesk.tickets.custom_fields
  ts_ticket_created:
    lineage:
      - datalake_zendesk.tickets.ts_updated
    description: Timestamp of ticekt creation (UTC timezone)
  ts_event:
    lineage:
      - datalake_zendesk.tickets.ts_updated
    description: Timestamp of when the ticket was updated, which consists the 'event' the table represents.
  ts_load:
    description: Timestamp indicating when the data was loaded into the datalake
