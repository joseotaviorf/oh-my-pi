database_name: dw_tickets
table_name: dim_ticket
description: Dimension table that contains data on tickets created in Zendesk Support
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  sk_ticket:
    lineage:
      - datalake_zendesk_ticket_funnels.ticket_funnel.id_ticket
    description: Key of ticket that corresponds to the Zendesk ticket number
  sk_problem_ticket:
    lineage:
      - datalake_zendesk_ticket_funnels.ticket_funnel.id_problem_ticket
    description: Problem ticket identification key.
  subject:
    lineage:
      - datalake_zendesk_ticket_funnels.ticket_funnel.subject
    description: The value of the subject field for the ticket
  description:
    lineage:
      - datalake_zendesk_ticket_funnels.ticket_funnel.description
    description:
      The first comment on the ticket. This is the text of the support
      request or when an end-user submits a support request via email, the body of
      the email request is used as the description.
  ticket_via:
    lineage:
      - datalake_zendesk_ticket_funnels.ticket_funnel.ticket_via
    description: The Zendesk's default source where the ticket was created
  channel:
    lineage:
      - datalake_zendesk_ticket_funnels.ticket_funnel.channel
    description: The source where the ticket was created from the company perspective
  group_name:
    lineage:
      - datalake_zendesk_ticket_funnels.ticket_funnel.group_name
    description: The group the ticket is assigned to
  priority:
    lineage:
      - datalake_zendesk_ticket_funnels.ticket_funnel.priority
    description: The urgency with which the ticket should be addressed
  recipient:
    lineage:
      - datalake_zendesk_ticket_funnels.ticket_funnel.recipient
    description: The original recipient e-mail address of the ticket
  tags:
    lineage:
      - datalake_zendesk_ticket_funnels.ticket_funnel.tags
    description: The list of all tags applied to the ticket
  status:
    lineage:
      - datalake_zendesk_ticket_funnels.ticket_funnel.status
    description:
      The latest state of the ticket that can be set and updated either
      manually by an agent or automatically via business rules.
  ticket_type:
    lineage:
      - datalake_zendesk_ticket_funnels.ticket_funnel.ticket_type
    description: Descriptive data about the type of ticket.
  custom_fields:
    lineage:
      - datalake_zendesk_ticket_funnels.ticket_funnel.custom_fields
    description:
      The custom fields of the ticket that correspond to the Zendesk Forms
      fields. It has JSON format with the form's field name and its value selected
      or inputted by agent. The value equal to false is related to the field that
      was not filled for the request
  score:
    lineage:
      - datalake_zendesk_ticket_funnels.ticket_funnel.score
    description:
      The customer satisfaction ratings that is sent to end-user requesters
      by an email after the ticket has been set to solved that asks them to briefly
      evaluate their experience
  reason:
    lineage:
      - datalake_zendesk_ticket_funnels.ticket_funnel.reason
    description: The reason for the rating given by the requester in a follow-up question
  comment:
    lineage:
      - datalake_zendesk_ticket_funnels.ticket_funnel.comment
    description: Additional (and optional) comment received with the rating
  request_type:
    lineage:
      - datalake_zendesk_ticket_funnels.ticket_funnel.request_type
    description:
      Custom field from Zendesk Form that indicates the type of that request
      that generates a specific demand
  agent_organization:
    lineage:
      - datalake_zendesk_ticket_funnels.ticket_funnel.agent_organization
    description: Agent organization, temporary field to filters
  step_tag:
    lineage:
      - datalake_zendesk_ticket_funnels.ticket_funnel.step_tag
    description: Related to the ticket taxonomy, indicates the journey step of the customer
  client_type:
    lineage:
      - datalake_zendesk_ticket_funnels.ticket_funnel.client_type
    description:
      Custom field from Zendesk Form that indicates the type of QuintoAndar's
      end-user
  customer_type_tag:
    lineage:
      - datalake_zendesk_ticket_funnels.ticket_funnel.customer_type_tag
    description: Related to ticket taxonomy, indicates the type of the customer
  contact_motivation_tag:
    lineage:
      - datalake_zendesk_ticket_funnels.ticket_funnel.contact_motivation_tag
    description: Related to ticket taxonomy, indicates the reason for the customer to be contacting 5A
  contact_theme_tag:
    lineage:
      - datalake_zendesk_ticket_funnels.ticket_funnel.contact_theme_tag
    description: Related to ticket taxonomy, indicates what the contact is about
  contact_theme_detail_tag:
    lineage:
      - datalake_zendesk_ticket_funnels.ticket_funnel.contact_theme_detail_tag
    description: Related to ticket taxonomy, a more detailed version of the 'contact_theme_tag'
  has_public_comments:
    lineage:
      - datalake_zendesk_ticket_funnels.ticket_funnel.has_public_comments
    description:
      Flag that indicates true if any ticket comments are public or false
      otherwise
  ts_created:
    lineage:
      - datalake_zendesk_ticket_funnels.ticket_funnel.ts_created
    description: Timestamp of ticket's creation event (UTC timezone)
  ts_created_local:
    lineage:
      - datalake_zendesk_ticket_funnels.ticket_funnel.ts_created_local
    description: ts_created in UTC-3 timezone
  ts_updated:
    lineage:
      - datalake_zendesk_ticket_funnels.ticket_funnel.ts_updated
    description: Timestamp of latest ticket's update event (UTC timezone)
  ts_updated_local:
    lineage:
      - datalake_zendesk_ticket_funnels.ticket_funnel.ts_updated_local
    description: ts_updated in UTC-3 timezone
  ts_load:
    description: Timestamp of data load from database source (UTC timezone)
