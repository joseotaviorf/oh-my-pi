      manually by an agent or automatically via business rules.
    categories:
      closed: ''
      deleted: ''
      hold: ''
      new: ''
      open: ''
      pending: ''
      solved: ''
  custom_fields:
    lineage:
    - datalake_zendesk_ticket_funnels.ticket_funnel.custom_fields
    description: The custom fields of the ticket that correspond to the Zendesk Forms
      fields. It has JSON format with the form's field name and its value selected
      or inputted by agent. The value equal to false is related to the field that
      was not filled for the request
  score:
    lineage:
    - datalake_zendesk_ticket_funnels.ticket_funnel.score
    description: The customer satisfaction ratings that is sent to end-user requesters
      by an email after the ticket has been set to solved that asks them to briefly
      evaluate their experience
    categories:
