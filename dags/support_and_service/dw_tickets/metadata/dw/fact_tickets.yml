database_name: dw_tickets
table_name: fact_tickets
description:
  Fact table that contains the latest reply, wait time, resolution, and
  on hold metrics on each tickets, also including events, flags and its related foreign
  keys
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  sk_ticket:
    lineage:
      - datalake_zendesk.tickets_current.id_ticket
    description: Key of ticket that corresponds to the Zendesk ticket number
  sk_ticket_form:
    lineage:
      - datalake_zendesk.tickets_current.id_ticket_form
    description: Surrogate key corresponding to a Zendesk ticket form ID
  sk_house_listing:
    lineage:
      - datalake_ebdb_contract.contract_house.id_house_listing
    description:
      Key of house listing registered in QA that corresponds to the house
      ID inputted by agent in Zendesk ticket form
  sk_contract:
    lineage:
      - datalake_zendesk.tickets_current.id_contract
    description:
      Key of contract registered in QA that corresponds to the contract
      ID inputted by agent in Zendesk ticket form
  sk_sale_offer:
    lineage:
      - datalake_sale_offer_flows.sale_offer_flows.id_offer
    description: Sale offer ID from sale offer flows
  sk_job:
    lineage:
      - datalake_zendesk_ticket_funnels.ticket_funnel.id_job
    description: ID Job, from a specific ticket custom_field
  sk_user:
    lineage:
      - datalake_zendesk.tickets_current.id_user
    description: User ID as registered on Zendesk
  sk_personal_document:
    lineage:
      - datalake_zendesk.tickets_current.id_personal_document
    description: Cutomer CPF
  sk_client:
    lineage:
      - datalake_ebdb_contract.contract_house.id_client
    description:
      Key of tenant registered in QA that corresponds to tenant of the
      contract that is inputted by agent in Zendesk ticket form
  sk_owner:
    lineage:
      - datalake_ebdb_contract.contract_house.id_owner
    description:
      Key of landlord registered in QA that corresponds to landlord of
      the house ID that is inputted by agent in Zendesk Forms
  sk_zendesk_requester_user:
    lineage:
      - datalake_zendesk.tickets_current.id_zendesk_requester_user
    description:
      Key of the user who asks for support through the ticket. Usually
      the requester is a customer, but requesters can also be agents
  sk_zendesk_submitter_user:
    lineage:
      - datalake_zendesk.tickets_current.id_zendesk_submitter_user
    description:
      Key of the user who created a ticket. The submitter always becomes
      the author of the first comment on the ticket
  sk_zendesk_assignee_user:
    lineage:
      - datalake_zendesk.tickets_current.id_zendesk_assignee_user
    description: The agent currently assigned to act upon the ticket
  sk_agent:
    lineage:
      - datalake_zendesk_ticket_funnels.ticket_funnel.agent_email
    description: Identification key of the analyst assigned to the ticket, generated by an MD5 from the analyst's email.
  sk_session:
    lineage:
      - datalake_zendesk.tickets_current.id_session
    description: Sauron ID session
  sk_call:
    lineage:
      - datalake_zendesk.tickets_current.id_call
    description: Twilio ID call
  sk_created_date:
    lineage:
      - datalake_zendesk.tickets_current.ts_created
    description: Key of date on latest ticket's creation event (UTC timezone)
  sk_created_date_local:
    lineage:
      - datalake_zendesk.tickets_current.ts_created_local
    description: Key of date on latest ticket's creation event (UTC-3/Brasilia timezone)
  sk_solved_date:
    lineage:
      - datalake_zendesk.tickets_current.ts_solved
    description:
      Key of date on latest event created when the ticket is moved to solved
      status (UTC timezone)
  sk_solved_date_local:
    lineage:
      - datalake_zendesk.tickets_current.ts_solved_local
    description:
      Key of date on latest event created when the ticket is moved to solved
      status (UTC-3/Brasilia timezone)
  sk_closed_date:
    lineage:
      - datalake_zendesk.tickets_current.ts_closed
    description:
      Key of date on event created when the ticket is moved to closed status
      (UTC timezone)
  sk_closed_date_local:
    lineage:
      - datalake_zendesk.tickets_current.ts_closed_local
    description:
      Key of date on event created when the ticket is moved to closed status
      (UTC-3/Brasilia timezone)
  sk_initially_assigned:
    lineage:
      - datalake_zendesk.tickets_current.ts_initially_assigned
    description:
      Key of date on event created when the ticket was initially assigned
      (UTC timezone)
  sk_initially_assigned_local:
    lineage:
      - datalake_zendesk.tickets_current.ts_initially_assigned_local
    description:
      Key of date on event created when the ticket was initially assigned
      (UTC-3/Brasilia timezone)
  sk_last_assigned:
    lineage:
      - datalake_zendesk.tickets_current.ts_last_assigned
    description: Key of date on latest ticket's update from assignee (UTC timezone)
  sk_last_assigned_local:
    lineage:
      - datalake_zendesk.tickets_current.ts_last_assigned_local
    description:
      Key of date on latest ticket's update from assignee (UTC-3/Brasilia
      timezone)
  total_group_stations:
    lineage:
      - datalake_zendesk.tickets_current.total_group_stations
    description: Number of groups this ticket passed through
  total_assignee_stations:
    lineage:
      - datalake_zendesk.tickets_current.total_assignee_stations
    description: Number of assignees this ticket had
  minutes_first_reply_time_calendar:
    lineage:
      - datalake_zendesk.tickets_current.minutes_reply_calendar
    description:
      Number of minutes to the first reply out of business hours. Corresponds
      to the duration between ticket creation and the first public agent reply on
      the ticket.
  minutes_first_reply_time_business:
    lineage:
      - datalake_zendesk.tickets_current.minutes_reply_business
    description:
      Number of minutes to the first reply inside of business hours. Corresponds
      to the duration between ticket creation and the first public agent reply on
      the ticket.
  minutes_first_resolution_time_calendar:
    lineage:
      - datalake_zendesk.tickets_current.minutes_first_resolution_calendar
    description:
      Number of minutes to the first resolution out of business hours.
      Corresponds to the duration between ticket creation and it was initially moved
      to solved status.
  minutes_first_resolution_time_business:
    lineage:
      - datalake_zendesk.tickets_current.minutes_first_resolution_business
    description:
      Number of minutes to the first resolution inside of business hours.
      Corresponds to the time between ticket creation time and the time when the ticket
      was initially moved to solved status
  minutes_requester_wait_time_calendar:
    lineage:
      - datalake_zendesk.tickets_current.minutes_requester_wait_calendar
    description:
      Number of minutes to the requester wait time out of business hours.
      Corresponds to the total combined time ticket was in the new, open, and on-hold
      statuses.
  minutes_requester_wait_time_business:
    lineage:
      - datalake_zendesk.tickets_current.minutes_requester_wait_business
    description:
      Number of minutes to the requester wait time inside of business hours.
      Corresponds to the total combined time ticket was in the new, open, and on-hold
      statuses.
  minutes_agent_wait_time_calendar:
    lineage:
      - datalake_zendesk.tickets_current.minutes_agent_wait_calendar
    description:
      Number of minutes to the agent wait time out of business hours. Corresponds
      to the total combined time ticket was in the pending status.
  minutes_agent_wait_time_business:
    lineage:
      - datalake_zendesk.tickets_current.minutes_agent_wait_business
    description:
      Number of minutes to the agent wait time inside of business hours.
      Corresponds to the total combined time ticket was in the pending status.
  minutes_on_hold_time_calendar:
    lineage:
      - datalake_zendesk.tickets_current.minutes_on_hold_calendar
    description:
      Number of minutes to the on hold time out of business hours. Corresponds
      to the total combined time ticket was in the on-hold status.
  minutes_on_hold_time_business:
    lineage:
      - datalake_zendesk.tickets_current.minutes_on_hold_business
    description:
      Number of minutes to the on hold time inside of business hours. Corresponds
      to the total combined time ticket was in the on-hold status.
  minutes_full_resolution_time_calendar:
    lineage:
      - datalake_zendesk.tickets_current.minutes_full_resolution_calendar
    description:
      Number of minutes to the first resolution out of business hours.
      Corresponds to the duration between ticket creation and the final (or most recent)
      change of status to solved.
  minutes_full_resolution_time_business:
    lineage:
      - datalake_zendesk.tickets_current.minutes_full_resolution_business
    description:
      Number of minutes to the first resolution inside of business hours.
      Corresponds to the duration between ticket creation and the final (or most recent)
      change of status to solved.
  reopens:
    lineage:
      - datalake_zendesk.tickets_current.reopens
    description: Total number of times the ticket was reopened
  replies:
    lineage:
      - datalake_zendesk.tickets_current.replies
    description: Total number of times ticket was replied to
  ts_initially_assigned:
    lineage:
      - datalake_zendesk.tickets_current.ts_initially_assigned
    description:
      Timestamp of event created when the ticket was initially assigned
      (UTC timezone)
  ts_initially_assigned_local:
    lineage:
      - datalake_zendesk.tickets_current.ts_initially_assigned_local
    description:
      Timestamp of event created when the ticket was initially assigned
      (UTC-3/Brasilia timezone)
  ts_last_assigned:
    lineage:
      - datalake_zendesk.tickets_current.ts_last_assigned
    description: Timestamp of latest ticket's update from assignee event (UTC timezone)
  ts_last_assigned_local:
    lineage:
      - datalake_zendesk.tickets_current.ts_last_assigned_local
    description:
      Timestamp of latest ticket's update from assignee event (UTC-3/Brasilia
      timezone)
  ts_solved:
    lineage:
      - datalake_zendesk.tickets_current.ts_solved
    description:
      Timestamp of latest event created when the ticket is moved to solved
      status (UTC timezone)
  ts_solved_local:
    lineage:
      - datalake_zendesk.tickets_current.ts_solved_local
    description:
      Timestamp of latest event created when the ticket is moved to solved
      status (UTC-3/Brasilia timezone)
  ts_updated:
    lineage:
      - datalake_zendesk.tickets_current.ts_updated
    description: Timestamp of latest ticket's update event (UTC timezone)
  ts_updated_local:
    lineage:
      - datalake_zendesk.tickets_current.ts_updated_local
    description: Timestamp of latest ticket's update event (UTC-3/Brasilia timezone)
  ts_closed:
    lineage:
      - datalake_zendesk.tickets_current.ts_closed
    description:
      Timestamp of event created when the ticket is moved to closed status
      (UTC timezone)
  ts_closed_local:
    lineage:
      - datalake_zendesk.tickets_current.ts_closed_local
    description:
      Timestamp of event created when the ticket is moved to closed status
      (UTC-3/Brasilia timezone)
  ts_load:
    description: Timestamp indicating when the data was loaded into the datalake
