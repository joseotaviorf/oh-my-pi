dag:
  name: enrich_amplitude_magic_link
  schedule_start_date: 2022, 9, 22
  owner: Data SS
  documentation:
    dag_purpose: Formatting and json extract in Amplitude Magic Link 2.0 data.
workflow:
  type: query_delta
  layer: enrich
  default_extraction_type: incremental
  default_partitions: [year, month, day]
cluster:
  type: custom_cluster
  custom_configurations:
    spark_version: 16.4.x-scala2.12
    driver_node_type_id: r5a.xlarge
    node_type_id: r5a.2xlarge
    num_workers: 3
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
  databricks_conn_id: databricks_new

