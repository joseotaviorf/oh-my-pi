---
database_name: dw_offboarding
table_name: dim_termination
description: This table aims to store termination information, each line must contain the termination record in its most current state.
domain: Support and Services
owner: data-ae-ss@quintoandar.com.br
columns:
  sk_termination:
    description: Unique termination identification key.
    lineage:
      - datalake_terminator.termination.id_termination
  sk_mediation_ticket:
  lineage:
    - datalake_offboarding.mediations.id_ticket
  description: Mediation ticket linked to the termination, if it exists.
  cancellation_info:
    description: Data with json structure that indicates detailed information about canceling termination.
    lineage:
      - datalake_terminator.termination.cancellation_info
  category:
    description: Descriptive information about the termination category.
    lineage:
      - datalake_terminator.termination.category
  requested_by:
    description: Descriptive information that indicates the type of user who made the termination request.
    lineage:
      - datalake_terminator.termination.requested_by
  status:
    description: Current termination status.
    lineage:
      - datalake_terminator.termination.status
  feedback:
    description: Information in json format that indicates the home's output feedback.
    lineage:
      - datalake_terminator.termination.feedback
  reason:
    description: Termination's reason.
    lineage:
      - datalake_terminator.termination.reason
  rescheduling_history:
    description: Json type data that indicates the termination rescheduling history.
    lineage:
      - datalake_terminator.termination.rescheduling_history
  mediation_squad:
    lineage:
      - datalake_offboarding.mediations.squad
    description: Based on ticket tags indicating agreement or disagreement.
  workflow_current_step:
    description: Termination workflow step.
    lineage:
      - datalake_terminator.termination.workflow_current_step
  fee_negotiation_status:
    description: Termination fee negotiation status.
    lineage:
      - datalake_terminator.termination.fee_negotiation_status
  fee_payment_option:
    description: Option to pay the termination fee.
    lineage:
      - datalake_terminator.termination.fee_payment_option
  checklist_item:
    description: Descriptive information that indicates which checklist item the record is in the termination process.
    lineage:
      - datalake_terminator.termination.checklist_item
  decline_person:
    description: Column indicating who opted-out/declined the relisting.
    lineage:
      - datalake_terminator.termination.decline_person
    categories:
      "DECLINED_BY_PP": The person who declined the relisting was the owner.
      "DECLINED_BY_CX/ENG": The person who declined the relisting and opted-out wasn't the owner.
      "AUTO_DECLINED": If the is_early_relisting flag is False and we don't have any information who did the opt-out, the value will be Auto-declined.
  has_mediation:
    lineage:
      - datalake_offboarding.mediations.id_termination
    description: Flag indicating whether a mediation record exists for the termination.
  has_mediation_ticket:
    lineage:
      - datalake_offboarding.mediations.has_mediation_ticket
    description: Flag indicating the presence of a mediation ticket.
  has_ac_repairs:
    lineage:
      - datalake_offboarding.mediations.has_ac_repairs
    description: Flag indicating if absorbed repairs are associated with the termination.
  is_ticket_opened_via_terminator:
    lineage:
      - datalake_offboarding.mediations.is_ticket_opened_via_terminator
    description: Indicator if the mediation ticket was initiated via the terminator system.
  dt_inspection:
    lineage:
      - datalake_offboarding.mediations.dt_inspection
    description: Date when the inspection for the termination occurred.
  ts_load:
    description: This timestamp indicates when this data was loaded into dw_offboarding.
  year:
    description: Year when the data was loaded.
    lineage:
      - datalake_terminator.termination.year
  month:
    description: Month when the data was loaded.
    lineage:
      - datalake_terminator.termination.month
  day:
    description: Day when the data was loaded.
    lineage:
      - datalake_terminator.termination.day
