dag:
  name: dw_offboarding
  schedule_start_date: 2024, 05, 28
  owner: Data SS
  documentation:
    dag_purpose: |
      Dag for the purpose of consulting information related to terminations.

workflow:
  type: query_delta
  layer: dw
  custom_schema: offboarding
  default_extraction_type: incremental
  default_partitions: [year, month, day]
  tables_customization:
    fact_terminations:
      z_order_by: [sk_termination]
      merge_on: [sk_termination]
    dim_termination:
      z_order_by: [sk_termination]
      merge_on: [sk_termination]

cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: r5a.xlarge
    node_type_id: r5a.xlarge
    num_workers: 3
    spark_version: 13.3.x-scala2.12
