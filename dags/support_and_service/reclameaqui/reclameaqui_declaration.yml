dag:
  name: reclameaqui
  schedule_start_date: 2022, 4, 26
  schedule_interval: 0 1 * * *
  owner: Data SS
  documentation:
    dag_purpose: Extracts the reclameaqui information using [hugme api](https://developer.hugme.com.br/)

workflow:
  layer: raw
  type: custom_ingestion
  load_spark_job: load_reclameaqui_tickets
  spark_job_arguments:
  - "{environment}"
  - "{bucket}"
  - "{{ ds }}"

  default_extraction_type: incremental
  default_partitions: [year, month, day]
  tables_customization:
    tickets:
      z_order_by: [id]

cluster:
  type: databricks_12_2_med_general_cluster
  custom_libraries:
  - whl: "{artifacts_bucket}/reclameaqui-api-client-python/quintoandar_reclameaqui_api_client-0.1.0-py2.py3-none-any.whl"
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
