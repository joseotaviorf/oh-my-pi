---
dag_documentation:
  dag_purpose: This DAG is responsible for sending data from BIC to minority_report.

minority_request_header:
  Content-Type: application/json

batch_size: 100

tables_to_send:
  bic_ss:
    key_name: userId
    type: CUSTOMER_DATA

custom_cluster:
  autotermination_minutes: 20
  driver_node_type_id: r5a.large
  node_type_id: r5a.large
  num_workers: 1
  aws_attributes:
    spot_bid_price_percent: 100
    zone_id: us-east-1d
    availability: SPOT_WITH_FALLBACK
    ebs_volume_size: 200
  spark_conf:
    spark.driver.maxResultSize: "0"
