dag:
  name: comms_manager
  schedule_start_date: 2021, 11, 30
  schedule_interval: 0 3 * * *
  owner: Data SS
  documentation:
    dag_purpose: |
      Retrieves data from the Comms Manager database (PostgreSQL). [Jaiminho](https://github.com/quintoandar/comms-manager)
      Comms manager is a tool to manage transactional notifications resources.

workflow:
  type: cdc
  layer: raw
  database_type: postgres
  source_schema: comms_manager
  lineage_product_database_name: comms_manager
  tables_customization:
    central_template:
      clean_table_name: central_template
      raw_primary_keys: [id]
      clean_primary_keys: [id]
    email_template:
      clean_table_name: email_template
      raw_primary_keys: [id]
      clean_primary_keys: [id]
    push_template:
      clean_table_name: push_template
      raw_primary_keys: [id]
      clean_primary_keys: [id]
    sms_template:
      clean_table_name: sms_template
      raw_primary_keys: [id]
      clean_primary_keys: [id]
    whatsapp_template:
      clean_table_name: whatsapp_template
      raw_primary_keys: [id]
      clean_primary_keys: [id]

