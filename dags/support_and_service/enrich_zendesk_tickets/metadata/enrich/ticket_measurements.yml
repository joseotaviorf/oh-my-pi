database_name: datalake_zendesk_tickets
table_name: ticket_measurements
description: Table with reply, resolution and agent metrics for every ticket
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  id_ticket:
    lineage:
      - datalake_zendesk_tickets_clean.tickets.id_ticket
    description: Zendesk's ticket ID
  id_house:
    lineage:
      - datalake_zendesk_custom_fields.custom_fields.custom_fields
    description: ID of the house
  id_contract:
    lineage:
      - datalake_zendesk_custom_fields.custom_fields.custom_fields
    description: ID of the contract associated with the customer
  id_session:
    lineage:
      - datalake_zendesk_custom_fields.custom_fields.custom_fields
    description: Sauron's ID session, when the ticket is created through chat channel
  id_call:
    lineage:
      - datalake_zendesk_custom_fields.custom_fields.custom_fields
    description: Twilio's call ID, when the ticket is created through call channel
  client_type:
    lineage:
      - datalake_zendesk_custom_fields.custom_fields.custom_fields
    description: Type of customer, filled by the agent who created the ticket
  total_group_stations:
    lineage:
      - datalake_zendesk_tickets_clean.ticket_metrics.group_stations
    description: Number of groups the ticket passed through
  total_assignee_stations:
    lineage:
      - datalake_zendesk_tickets_clean.ticket_metrics.assignee_stations
    description: Number of agents assigned to the ticket
  minutes_reply_calendar:
    lineage:
      - datalake_zendesk_tickets_clean.ticket_metrics.minutes_reply_calendar
    description: Number of minutes to the first reply during calendar hours
  minutes_reply_business:
    lineage:
      - datalake_zendesk_tickets_clean.ticket_metrics.minutes_reply_business
    description: Number of minutes to the first reply during business hours
  minutes_first_resolution_business:
    lineage:
      - datalake_zendesk_tickets_clean.ticket_metrics.minutes_first_resolution_business
    description: Number of minutes to the first resolution time during business hours
  minutes_first_resolution_calendar:
    lineage:
      - datalake_zendesk_tickets_clean.ticket_metrics.minutes_first_resolution_calendar
    description: Number of minutes to the first resolution time during calendar hours
  minutes_requester_wait_business:
    lineage:
      - datalake_zendesk_tickets_clean.ticket_metrics.minutes_requester_wait_business
    description: Number of minutes the requester spent waiting during business hours
  minutes_requester_wait_calendar:
    lineage:
      - datalake_zendesk_tickets_clean.ticket_metrics.minutes_requester_wait_calendar
    description: Number of minutes the requester spent waiting during calendar hours
  minutes_agent_wait_business:
    lineage:
      - datalake_zendesk_tickets_clean.ticket_metrics.minutes_agent_wait_business
    description: Number of minutes the agent spent waiting during business hours
  minutes_agent_wait_calendar:
    lineage:
      - datalake_zendesk_tickets_clean.ticket_metrics.minutes_agent_wait_calendar
    description: Number of minutes the agent spent waiting during calendar hours
  minutes_on_hold_business:
    lineage:
      - datalake_zendesk_tickets_clean.ticket_metrics.minutes_on_hold_business
    description: Number of minutes on hold during business hours
  minutes_on_hold_calendar:
    lineage:
      - datalake_zendesk_tickets_clean.ticket_metrics.minutes_on_hold_calendar
    description: Number of minutes on hold during calendar hours
  minutes_full_resolution_business:
    lineage:
      - datalake_zendesk_tickets_clean.ticket_metrics.minutes_full_resolution_business
    description: Number of minutes to the full resolution during business hours
  minutes_full_resolution_calendar:
    lineage:
      - datalake_zendesk_tickets_clean.ticket_metrics.minutes_full_resolution_calendar
    description: Number of minutes to the full resolution during calendar hours
  reopens:
    lineage:
      - datalake_zendesk_tickets_clean.ticket_metrics.reopens
    description: Number of times the ticket was reopened
  replies:
    lineage:
      - datalake_zendesk_tickets_clean.ticket_metrics.replies
    description: Number of public replies the agent added to the ticket
  ts_initially_assigned:
    lineage:
      - datalake_zendesk_tickets_clean.ticket_metrics.ts_initially_assigned
    description: Timestamp of when the ticket was initially assigned
  ts_initially_assigned_local:
    lineage:
      - datalake_zendesk_tickets_clean.ticket_metrics.ts_initially_assigned
    description: Timestamp of when the ticket was initially assigned in UTC-3 timezone
  ts_last_assigned:
    lineage:
      - datalake_zendesk_tickets_clean.ticket_metrics.ts_assigned
    description: Timestamp of when the assignee last updated the ticket
  ts_last_assigned_local:
    lineage:
      - datalake_zendesk_tickets_clean.ticket_metrics.ts_assigned
    description: Timestamp of when the assignee last updated the ticket in UTC-3 timezone
  ts_solved:
    lineage:
      - datalake_zendesk_tickets_clean.ticket_metrics.ts_solved
    description: Timestamp of when the ticket was solved
  ts_solved_local:
    lineage:
      - datalake_zendesk_tickets_clean.ticket_metrics.ts_solved
    description: Timestamp of when the ticket was solved in UTC-3 timezone
  tags:
    lineage:
      - datalake_zendesk_tickets_clean.tickets.tags
    description: All tags assigned to the ticket
  id_zendesk_requester_user:
    lineage:
      - datalake_zendesk_tickets_clean.tickets.id_requester
    description: Zendesk's requester ID
  id_zendesk_submitter_user:
    lineage:
      - datalake_zendesk_tickets_clean.tickets.id_submitter
    description: Zendesk's submitter ID
  id_zendesk_assignee_user:
    lineage:
      - datalake_zendesk_tickets_clean.tickets.id_assignee
    description: Zendesk's assignee ID
  ts_created:
    lineage:
      - datalake_zendesk_tickets_clean.tickets.ts_created
    description: Timestamp of ticket creation
  str_created_date:
    lineage:
      - datalake_zendesk_tickets_clean.tickets.ts_created
    description: ts_created as DATE
  ts_created_local:
    lineage:
      - datalake_zendesk_tickets_clean.tickets.ts_created_local
    description: Timestamp of ticket creation in UTC-3 timezone
  ts_updated:
    lineage:
      - datalake_zendesk_tickets_clean.tickets.ts_updated
    description: Timestamp of ticket update
  ts_updated_local:
    lineage:
      - datalake_zendesk_tickets_clean.tickets.ts_updated
    description: Timestamp of ticket update in UTC-3 timezone
  ts_closed:
    lineage:
      - datalake_zendesk_tickets_clean.tickets.status
      - datalake_zendesk_tickets_clean.tickets.ts_updated
    description: Timestamp of when the ticket was closed
  ts_closed_local:
    lineage:
      - datalake_zendesk_tickets_clean.tickets.status
      - datalake_zendesk_tickets_clean.tickets.ts_updated
    description: Timestamp of when the ticket was closed in UTC-3 timezone
  ts_load:
    lineage:
      - datalake_zendesk_tickets_clean.tickets.ts_load
    description: Timestamp of when data was loaded
