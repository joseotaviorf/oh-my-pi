---
external_s3_bucket: atento-s3-data-quintoandar-com-br

partition_cols: ["year", "month", "day"]

dag_documentation:
  dag_purpose: |
    This DAG collects multiple data from Datalake and sends to an S3 bucket used to power Atento service.
    Atento is an external QuintoAndar partner for managing customer support.
  additional_information: This pipeline also exports results do atento bucket (`s3://atento-s3-data-quintoandar-com-br`).

custom_cluster:
  driver_node_type_id: m5a.2xlarge
  node_type_id: m5a.2xlarge
  autoscale:
    max_workers: 3
    min_workers: 1
