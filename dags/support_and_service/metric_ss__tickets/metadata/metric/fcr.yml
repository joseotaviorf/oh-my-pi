database_name: metric_metric_ss__tickets
table_name: fcr
description: This table contains FCR (First Call Resolution)  KPI with target per
  many dimensions.
domain: Support and Services
owner: william.angelo@quintoandar.com.br
columns:
  channel:
    description: Identify the channel for this ticket (call, chat, email).
    dimension: true
    lineage:
    - dw_customer_support.fact_tickets.channel
  journey:
    description: Customer journey segment from the support department taxonomy.
    dimension: true
    lineage:
    - dw_customer_support.dim_department.journey
  journey_step:
    description: Department journey step.
    dimension: true
    lineage:
    - dw_customer_support.dim_department.journey_step
  board:
    description: Operations board grouping within the support department taxonomy.
    dimension: true
    lineage:
    - dw_customer_support.dim_department.board
  department:
    description: Support department name from the customer support taxonomy.
    dimension: true
    lineage:
    - dw_customer_support.dim_department.department
  team:
    description: Support team assigned within the department taxonomy.
    dimension: true
    lineage:
    - dw_customer_support.dim_department.team
  area:
    description: Department area (e.g. CX).
    dimension: true
    lineage:
    - dw_customer_support.dim_department.area
  customer_type:
    description: Client type Note - This field does not belong to the taxonomy defined
      on Central Ops.
    dimension: true
    lineage:
    - dw_customer_support.dim_taxonomy.customer_type
  amount_resolutions:
    metric:
      name: Amount recontact tickets
      description: Number of classified tickets that contacted us again within 4 days
        of the first contact
      acronym: Amount Recontact
      is_additive: true
      business_stage: CX
      hierarchy: User analisys
      approved_by: vicente.neto@quintoandar.com.br
      link_to_metric: https://docs.google.com/document/d/1X-cyvwZdQTsTVVkzeA1rjqDrtLt1XIryozl7VBWiqkU/edit?usp=sharing
    description: Number of classified tickets that contacted us again within 4 days
      of the first contact
  amount_tickets:
    metric:
      name: Amount Recontact Tickets
      description: Amount of tickets that correspond or do not correspond to recontact
      acronym: Amoun Recontact Responses
      is_additive: true
      business_stage: CX
      hierarchy: User analisys
      approved_by: vicente.neto@quintoandar.com.br
      link_to_metric: https://docs.google.com/document/d/1X-cyvwZdQTsTVVkzeA1rjqDrtLt1XIryozl7VBWiqkU/edit?usp=sharing
    description: Amount of tickets that correspond or do not correspond to recontact
  fcr_rate:
    metric:
      name: Recontact Rate
      description: Semi-additive metrics representing the Sum of tickets that are
        recontacted divided by the overall number of recontact tickets
      acronym: DSAT Rate
      is_additive: false
      business_stage: CX
      hierarchy: User analisys
      approved_by: vicente.neto@quintoandar.com.br
      link_to_metric: https://docs.google.com/document/d/1X-cyvwZdQTsTVVkzeA1rjqDrtLt1XIryozl7VBWiqkU/edit?usp=sharing
    description: Semi-additive metrics representing the Sum of tickets that are recontacted
      divided by the overall number of recontact tickets
  dt_ticket_created:
    description: The created date of ticket.
    dimension: true
    lineage:
    - dw_customer_support.fact_tickets.ts_created
