database_name: metric_metric_ss__tickets
table_name: dsat
description: This table contains DSAT KPI with target per many dimensions.
domain: Support and Services
owner: william.angelo@quintoandar.com.br
columns:
  channel:
    description: Identify the channel for this ticket (call, chat, email).
    dimension: true
    lineage:
    - dw_customer_support.fact_tickets.channel
  journey:
    description: Customer journey segment from the support department taxonomy.
    dimension: true
    lineage:
    - dw_customer_support.dim_department.journey
  journey_step:
    description: Department journey step.
    dimension: true
    lineage:
    - dw_customer_support.dim_department.journey_step
  board:
    description: Operations board grouping within the support department taxonomy.
    dimension: true
    lineage:
    - dw_customer_support.dim_department.board
  department:
    description: Support department name from the customer support taxonomy.
    dimension: true
    lineage:
    - dw_customer_support.dim_department.department
  team:
    description: Support team assigned within the department taxonomy.
    dimension: true
    lineage:
    - dw_customer_support.dim_department.team
  area:
    description: Department area (e.g. CX).
    dimension: true
    lineage:
    - dw_customer_support.dim_department.area
  customer_type:
    description: Client type Note - This field does not belong to the taxonomy defined
      on Central Ops.
    dimension: true
    lineage:
    - dw_customer_support.dim_taxonomy.customer_type
  amount_dissatisfied:
    metric:
      name: DSAT Amount Dissatisfied
      description: Sum of dissatisfied responses
      acronym: Amount Dissatisfied
      is_additive: true
      business_stage: CX
      hierarchy: User analisys
      approved_by: vicente.neto@quintoandar.com.br
      link_to_metric: ''
    description: Sum of dissatisfied responses
  amount_responses:
    metric:
      name: DSAT Amount Responses
      description: Total responses
      acronym: Amount Responses
      is_additive: true
      business_stage: CX
      hierarchy: User analisys
      approved_by: vicente.neto@quintoandar.com.br
      link_to_metric: ''
    description: Total count of DSAT survey responses at the metric grain.
  dsat_rate:
    metric:
      name: DSAT Rate
      description: Semi-additive metrics representing the DSAT rate
      acronym: DSAT Rate
      is_additive: false
      business_stage: CX
      hierarchy: User analisys
      approved_by: vicente.neto@quintoandar.com.br
      link_to_metric: ''
    description: Semi-additive metrics representing the DSAT rate
  dt_csat_responsed:
    description: The responsed csat date.
    dimension: true
    lineage:
    - dw_satisfaction_rating.fact_ticket_csat.ts_csat_first_response
