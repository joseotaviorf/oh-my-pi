database_name: datalake_crm
table_name: task_titles
description: Enrichment table that aims to gather information from the title of CRM tasks.
domain: Support and Services
owner: gabriel.firmino@quintoandar.com.br
columns:
  id:
    description: Identification key for the task title in the crm.
    lineage:
      - datalake_crm_clean.task_titles.id
  workgroup_ids:
    description: Typo array information that lists group id names.
    lineage:
      - datalake_crm_clean.task_titles.workgroup_ids
  description:
    description: Free-text body describing the customer issue, task context, or field help text.
    lineage:
      - datalake_crm_clean.task_titles.description
  title:
    description: CRM task attribute describing title for support workflow tracking.
    lineage:
      - datalake_crm_clean.task_titles.title
  slug:
    description: Keywords related to the content of the task in the crm.
    lineage:
      - datalake_crm_clean.task_titles.slug
