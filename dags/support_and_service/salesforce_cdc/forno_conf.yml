# Create Airflow variable named WEBHOOK_SALESFORCE_CDC_FORNO whose value is the Google Chat incoming webhook URL.
webhook_salesforce_cdc: WEBHOOK_SALESFORCE_CDC_FORNO

dag_documentation:
  dag_purpose:
    "Salesforce Ingestion DAG responsible for ingesting data from Salesforce into the Data Lake.
    This DAG will handle ingestion via CDC Events and API events.
    The pipeline will be composed by three main steps:
    1. CDC + API Raw ingestion: This step will ingest the data from Salesforce into the Data Lake.
    2. Clean ingestion: This step will clean the data from the raw ingestion and store it in the Data Lake.
    3. Health checks and Metrics in future."

datalake_bucket: "5a-datalake-forno"
events_config:
  case:
    event_path: "raw/salesforce/CaseEvent"
  case_mediation:
    event_path: "raw/salesforce/CaseMediationEvent"
  case_member:
    event_path: "raw/salesforce/CaseMemberEvent"
  case_repair_analysis:
    event_path: "raw/salesforce/CaseRepairAnalysisEvent"
    skip_quality_contracts: true
  comment:
    event_path: "raw/salesforce/CommentEvent"
    skip_quality_contracts: true
  dynamic_form:
    event_path: "raw/salesforce/DynamicFormEvent"
  email_message:
    event_path: "raw/salesforce/EmailMessageEvent"
  opportunity:
    event_path: "raw/salesforce/OpportunityEvent"
  user:
    event_path: "raw/salesforce/UserEvent"

custom_cluster:
  driver_node_type_id: r5d.xlarge
  node_type_id: r5d.xlarge
  num_workers: 4
  spark_version: 16.4.x-scala2.12
  spark_conf:
    spark.driver.extraJavaOption: "-verbose:gc -XX:+PrintGCDetails -XX:+PrintGCDateStamps -XX:+UseG1GC"
    spark.executor.extraJavaOptions: "-verbose:gc -XX:+PrintGCDetails -XX:+PrintGCDateStamps -XX:+UseG1GC"
    spark.executor.heartbeatInterval: "100s"
    spark.network.timeout: "600s"
    spark.metrics.appStatusSource.enabled: "true"
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE
