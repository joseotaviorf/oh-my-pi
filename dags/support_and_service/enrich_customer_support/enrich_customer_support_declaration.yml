dag:
  name: enrich_customer_support
  schedule_start_date: 2021, 5, 12
  owner: Data SS
  documentation:
    dag_purpose: |
      Apply all the business rules needed to build an unified ticket vision on DW (Customer Support model).
      Each row of Call and Chat tables represent one task from a ticket. Each row in the Email table represents one ticket.
      About received_demand table, each row is a demand received from the user, it contains all the three channels
      (Call, Chat and Email).
    additional_information: |
      In order to run these queries directly from databricks notebook you must replace double brackets for single ones.
      This occurs because when running on our data pipeline we read and execute these queries using pyspark and to avoid
      python syntax errors we must escape the brackets characters.
workflow:
  type: query_delta
  layer: enrich
  inner_dependencies:
    tickets:
    - chats
    - calls
    - sla_journey
    - sla_theme
    - sla_theme_detail
    csat:
    - tickets
    tickets_backlog:
    - sla_journey
    - sla_theme
    - sla_theme_detail
  tables_customization:
    calls:
      z_order_by: [ts_task_created, id_task, id_reservation]
      merge_on: [id_task, id_reservation]
      table_properties:
        "delta.dataSkippingNumIndexedCols": "0"
        "delta.dataSkippingStatsColumns": "ts_task_created,id_task,id_reservation"
    chats:
      z_order_by: [ts_created, id_session, id_task, id_channel]
      merge_on: [id_task]
      table_properties:
        "delta.dataSkippingNumIndexedCols": "0"
        "delta.dataSkippingStatsColumns": "ts_created,id_session,id_task,id_channel"
    email:
      merge_on: [id_ticket]
    ivr_interactions:
      z_order_by: [id_task]
      merge_on: [id_task, step_name]
    tickets:
      merge_on: [id_ticket]
      z_order_by: [id_ticket, id_call, id_session]
      table_properties:
        "delta.dataSkippingNumIndexedCols": "0"
        "delta.dataSkippingStatsColumns": "id_ticket,id_call,id_session"
    csat:
      merge_on: [id_ticket]
    sla_journey:
      z_order_by: [journey_step]
    sla_theme:
      z_order_by: [theme]
    sla_theme_detail:
      z_order_by: [theme_detail]
    tickets_backlog:
      merge_on: [id_ticket, dt_snapshot]
