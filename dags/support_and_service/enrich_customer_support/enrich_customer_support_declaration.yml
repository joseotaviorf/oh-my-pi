dag:
    name: enrich_customer_support
    schedule_start_date: 2021, 5, 12
    owner: Data SS
    documentation:
        dag_purpose: |
            Apply all the business rules needed to build an unified ticket vision on DW (Customer Support model).
            Each row of Call and Chat tables represent one task from a ticket. Each row in the Email table represents one ticket.
            About received_demand table, each row is a demand received from the user, it contains all the three channels
            (Call, Chat and Email).
        additional_information: |
            In order to run these queries directly from databricks notebook you must replace double brackets for single ones.
            This occurs because when running on our data pipeline we read and execute these queries using pyspark and to avoid
            python syntax errors we must escape the brackets characters.
workflow:
    type: query_delta
    layer: enrich
    inner_dependencies:
        received_demand:
            - call
            - email
            - chat
        unified_tickets:
            - call
            - chat
            - email
        tickets:
            - chats
            - calls
            - sla_journey
            - sla_theme
            - sla_theme_detail
    tables_customization:
        calls:
            z_order_by: [id_task, id_reservation]
            merge_on: [id_task, id_reservation]
        chats:
            z_order_by: [id_session, id_task, id_channel]
            merge_on: [id_task]
        ivr_interactions:
            z_order_by: [id_task]
            merge_on: [id_task, step_name]
        tickets:
            merge_on: [id_ticket]
            z_order_by: [id_ticket, id_call, id_session]
        csat:
            merge_on: [id_ticket]
        sla_journey:
            z_order_by: [journey_step]
        sla_theme:
            z_order_by: [theme]
        sla_theme_detail:
            z_order_by: [theme_detail]
cluster:
    type: custom_cluster
    custom_configurations:
        autotermination_minutes: 20
        driver_node_type_id: r5d.4xlarge
        node_type_id: r5d.8xlarge
        runtime_engine: PHOTON
        spark_version: 12.2.x-scala2.12
        num_workers: 5
        aws_attributes:
            first_on_demand: 1
            spot_bid_price_percent: 100
            zone_id: us-east-1d
            availability: SPOT_WITH_FALLBACK
            ebs_volume_size: 300
