database_name: datalake_customer_support
table_name: chat
description: Test table for chat data
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  id_channel:
    lineage:
      - datalake_quinto_messenger_clean.task.id_channel
    description: Twilio channel ID
  id_task:
    lineage:
      - datalake_quinto_messenger_clean.task.id_task
    description: Twilio task ID
  id_session:
    lineage:
      - datalake_quinto_messenger_clean.chat.id_session
      - datalake_quinto_messenger_clean.channel.id_session
    description: Session identifier associated with the task, derived from chat or channel sessions.
  id_user:
    lineage:
      - datalake_sauron_clean.session.id_user
    description: ID for the user associated with the session.
  id_worker:
    lineage:
      - datalake_quinto_messenger_clean.task.id_worker
    description: Twilio worker ID
  id_queue:
    lineage:
      - datalake_quinto_messenger_clean.task_event.id_queue
    description: Twilio queue ID
  queue_name:
    lineage:
      - datalake_quinto_messenger_clean.task_event.queue_name
    description: Name of the queue to which the task is assigned.
  customer_email:
    lineage:
      - datalake_sauron_clean.session.user_email
      - datalake_quinto_messenger_clean.task.customer_email
    description: Email address of the customer associated with the task, from session or task data.
  customer_phone_number:
    lineage:
      - datalake_sauron_clean.session.user_phone
      - datalake_quinto_messenger_clean.task.customer_contact_info
    description: Phone number of the customer associated with the task, from session or task contact info.
  twilio_phone_number:
    lineage:
      - datalake_quinto_messenger_clean.task.twilio_phone_number
    description: Twilio phone number used for the task communication.
  origin:
    lineage:
      - datalake_quinto_messenger_clean.chat.id_session
      - datalake_quinto_messenger_clean.channel.id_session
    description: Origin of the task communication, either 'in app' or 'whatsapp'.
  worker_email:
    lineage:
      - datalake_quinto_messenger_clean.task.worker_email
    description: Email address of the worker handling the task.
  channel_type:
    lineage:
      - datalake_quinto_messenger_clean.task.channel_type
    description: Type of communication channel, such as 'whatsapp'.
  task_status:
    lineage:
      - datalake_quinto_messenger_clean.task.task_status
    description: Current status of the task.
  task_outcome:
    lineage:
      - datalake_quinto_messenger_clean.task.conversation_attributes
    description: Outcome of the task derived from conversation attributes.
  task_completion_reason:
    lineage:
      - datalake_quinto_messenger_clean.task.completion_reason
    description: Reason for the task completion status.
  bpo_name:
    lineage:
      - datalake_quinto_messenger_clean.task.bpo_name
    description: Name of the BPO handling the task.
  seconds_to_first_response:
    lineage:
      - datalake_quinto_messenger_clean.task.seconds_to_first_response
    description: Time in seconds taken to provide the first response to the task.
  is_forwarded:
    lineage:
      - datalake_quinto_messenger_clean.task.is_forwarded
    description: Indicates if the task was forwarded to another team or worker.
  is_per_team_task:
    lineage:
      - datalake_quinto_messenger_clean.task.conversation_attributes
    description: Indicates if the task is assigned per team based on conversation attributes.
  ts_created:
    lineage:
      - datalake_quinto_messenger_clean.task.ts_created
    description: Timestamp when the task was created.
  ts_ended:
    lineage:
      - datalake_quinto_messenger_clean.task.ts_updated
    description: Timestamp when the task was ended.
  task_attributes:
    lineage:
      - datalake_quinto_messenger_clean.task.task_attributes
    description: Attributes associated with the task in JSON format.
  year:
    lineage:
      - datalake_quinto_messenger_clean.task.ts_created
    description: Year component of the task creation date.
  month:
    lineage:
      - datalake_quinto_messenger_clean.task.ts_created
    description: Month component of the task creation date.
  day:
    lineage:
      - datalake_quinto_messenger_clean.task.ts_created
    description: Day component of the task creation date.
