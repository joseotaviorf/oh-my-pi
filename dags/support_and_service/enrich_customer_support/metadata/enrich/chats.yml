database_name: datalake_customer_support
table_name: chats
description: >
  Enrich-layer table consolidating Twilio chat tasks with session context from Sauron and Support
  Session Service. One row per Twilio task linked to a valid session, including queue assignment,
  channel context, and response/inactivity metrics. Used for support operational analysis and
  routing quality reporting.
domain: Support and Services
owner: data-ae-ss@quintoandar.com.br
columns:
  id_channel:
    lineage:
      - datalake_quinto_messenger_clean.task.id_channel
    description: Twilio channel identifier associated with the support task.
  id_task:
    lineage:
      - datalake_quinto_messenger_clean.task.id_task
    description: Unique identifier of the Twilio task used as the chat task key.
  id_session:
    lineage:
      - datalake_sauron_clean.session.id
      - datalake_quinto_messenger_clean.channel.id_session
    description: >
      Sauron session identifier or WhatsApp channel session id, resolved from in-app chats when
      chat.source is sauron or from channel.id_session for WhatsApp tasks. Nullable when no valid
      session is linked to the task.
  id_sss_session:
    lineage:
      - datalake_sauron_clean.session.public_id
      - datalake_support_session_service_clean.support_session.public_id
    description: >
      Public session identifier in SSS format, resolved from Sauron public_id or Support Session
      Service public_id when an in-app chat matches chat.id_session and chat.source aligns with
      the session origin. Populated for Sauron sessions with public_id or SSS sessions; null for
      WhatsApp-only tasks.
  id_user:
    lineage:
      - datalake_support_session_service_clean.support_session.user_data
      - datalake_sauron_clean.session.user_data
    description: User identifier linked to the session, resolved across Support Session Service and Sauron sources.
  id_worker:
    lineage:
      - datalake_quinto_messenger_clean.task.id_worker
    description: Twilio worker identifier responsible for handling the task.
  id_queue:
    lineage:
      - datalake_quinto_messenger_clean.task_event.id_queue
    description: Queue identifier of the latest routing queue associated with the task.
  id_source_ctwa:
    lineage:
      - datalake_quinto_messenger_clean.task.id_source_ctwa
    description: Identifier of the click-to-WhatsApp campaign source tied to the task.
  queue_name:
    lineage:
      - datalake_quinto_messenger_clean.task_event.queue_name
    description: Name of the latest queue where the task was routed.
  customer_email:
    lineage:
      - datalake_support_session_service_clean.support_session.user_data
      - datalake_sauron_clean.session.user_data
      - datalake_quinto_messenger_clean.task.customer_email
    description: Customer email resolved from session payloads with fallback to the task-level customer email.
  customer_phone_number:
    lineage:
      - datalake_support_session_service_clean.support_session.user_data
      - datalake_sauron_clean.session.user_data
      - datalake_quinto_messenger_clean.task.customer_phone_number
      - datalake_quinto_messenger_clean.task.customer_contact_info
    description: Customer phone number resolved from session payloads with fallback to task-level contact information.
  twilio_phone_number:
    lineage:
      - datalake_quinto_messenger_clean.task.twilio_phone_number
    description: Twilio phone number used by the support operation to interact with the customer.
  origin:
    lineage:
      - datalake_support_session_service_clean.support_session.source
      - datalake_sauron_clean.session.source
    description: Conversation origin channel, preserving source labels and normalizing internal_chat to in app.
  direction:
    lineage:
      - datalake_quinto_messenger_clean.task.is_spoc_task
      - datalake_support_session_service_clean.support_session.created_by
      - datalake_sauron_clean.session.created_by
    description: Contact direction classification built from SPOC flag and who created the original session.
  worker_email:
    lineage:
      - datalake_quinto_messenger_clean.task.worker_email
    description: Email address of the support worker currently associated with the task.
  channel_type:
    lineage:
      - datalake_quinto_messenger_clean.task.channel_type
    description: Communication channel type used by the task, such as whatsapp or in-app chat.
  task_status:
    lineage:
      - datalake_quinto_messenger_clean.task.task_status
    description: Current operational status of the Twilio task.
  task_outcome:
    lineage:
      - datalake_quinto_messenger_clean.task.task_outcome
    description: Final outcome reported for the task according to Twilio task data.
  task_completion_reason:
    lineage:
      - datalake_quinto_messenger_clean.task.completion_reason
    description: Reason code that explains why the task was completed.
  bpo_name:
    lineage:
      - datalake_quinto_messenger_clean.task.bpo_name
    description: Name of the BPO handling the task.
  bpo_selection_reason:
    lineage:
      - datalake_quinto_messenger_clean.task.bpo_selection_reason
    description: Reason why the task was assigned to a specific BPO, used for routing analysis and BPO performance tracking.
  seconds_to_first_response:
    lineage:
      - datalake_quinto_messenger_clean.task.seconds_to_first_response
    description: Time in seconds between task creation and the first worker response.
  is_forwarded:
    lineage:
      - datalake_quinto_messenger_clean.task.is_forwarded
    description: Boolean flag indicating whether the task was forwarded to another queue or handler.
  is_per_team_task:
    lineage:
      - datalake_quinto_messenger_clean.task.is_per_team_task
    description: Boolean flag indicating whether the task is configured with team-based assignment.
  is_spoc_task:
    lineage:
      - datalake_quinto_messenger_clean.task.is_spoc_task
    description: Boolean flag indicating whether the task belongs to a SPOC workflow.
  is_isaias_session:
    lineage:
      - datalake_support_session_service_clean.support_session.source_env
      - datalake_sauron_clean.session.source_environment
    description: Boolean flag that marks sessions created in Isaias inbound environments.
  url_source_ctwa:
    lineage:
      - datalake_quinto_messenger_clean.task.url_source_ctwa
    description: URL reference for the click-to-WhatsApp campaign source linked to the task.
  type_source_ctwa:
    lineage:
      - datalake_quinto_messenger_clean.task.type_source_ctwa
    description: Type of click-to-WhatsApp campaign source linked to the task.
  total_inactivity_time:
    lineage:
      - datalake_quinto_messenger_clean.task.total_inactivity_time
    description: Total accumulated inactivity time registered during the task lifecycle.
  last_inactivity_time:
    lineage:
      - datalake_quinto_messenger_clean.task.last_inactivity_time
    description: Most recent inactivity duration measured before the task ended.
  ts_created:
    lineage:
      - datalake_quinto_messenger_clean.task.ts_created
    description: Timestamp when the task was created in Twilio.
  ts_ended:
    lineage:
      - datalake_quinto_messenger_clean.task.ts_updated
    description: Timestamp used as the task end reference based on the latest task update.
  task_attributes:
    lineage:
      - datalake_quinto_messenger_clean.task.task_attributes
    description: Structured task attributes payload with additional operational metadata from Twilio.
  year:
    lineage:
      - datalake_quinto_messenger_clean.task.ts_created
    description: Year partition derived from the task creation timestamp.
  month:
    lineage:
      - datalake_quinto_messenger_clean.task.ts_created
    description: Month partition derived from the task creation timestamp.
  day:
    lineage:
      - datalake_quinto_messenger_clean.task.ts_created
    description: Day partition derived from the task creation timestamp.
