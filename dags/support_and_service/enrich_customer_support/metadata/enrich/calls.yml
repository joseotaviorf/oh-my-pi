database_name: datalake_customer_support
table_name: calls
description: Test table for call data
domain: Support and Services
owner: data-ae-ss@quintoandar.com.br
columns:
  id_call:
    lineage:
      - datalake_bigfone_clean.event.id_call
    description:
      The Twilio call ID is a unique identifier that represents a single phone call
      initiated on the Twilio platform.
  id_session:
    lineage:
      - datalake_sauron_clean.session.id
    description: Session ID from Sauron
  id_task:
    lineage:
      - datalake_bigfone_clean.event.id_task
    description: Twilio's ID Segment
  id_reservation:
    lineage:
      - datalake_bigfone_clean.event.id_reservation
    description: Twilio's ID Reservation
  id_queue:
    lineage:
      - datalake_bigfone_clean.event.id_queue
    description:
      A queue in Twilio is identified by a unique identifier called Queue SID, and it
      serves as a holding area for tasks that are waiting to be assigned to workers for
      processing. Typically, the name of the queue in Twilio corresponds to the
      department for which the task reservation is intended to be routed.
  id_user:
    lineage:
      - datalake_sauron_clean.session.user_data
    description: Unique identifier for the user associated with the session
  id_worker:
    lineage:
      - datalake_bigfone_clean.event.id_worker
    description: Twilio's worker ID
  origin:
    description: Used to segmented which channel the call originated from
  direction:
    lineage:
      - datalake_bigfone_clean.event.direction
    description: It is the support direction.
    categories:
      inbound:
        An inbound call is a call that is initiated by an external party, such as a
        customer or a client, and is received by the Twilio application.
      outbound:
        An outbound call is a call that is initiated by the Twilio application to an
        external party, such as a customer or a client.
  channel_type:
    lineage:
      - datalake_bigfone_clean.event.channel_type
    description: Column used to identify Call InApp records
  bpo_name:
    lineage:
      - datalake_bigfone_clean.event.bpo_name
    description: Which BPO the task was assigned to
  queue_name:
    lineage:
      - datalake_bigfone_clean.event.queue_name
    description: Name of the queue the task is assigned to
  worker_email:
    lineage:
      - datalake_bigfone_clean.event.worker_email
    description: Last worker email that answered the last reservation.
  from_phone_number:
    lineage:
      - datalake_bigfone_clean.event.from_phone_number
    description: Caller phone number
  to_phone_number:
    lineage:
      - datalake_bigfone_clean.event.to_phone_number
      - datalake_bigfone_clean.event.outbound_to_phone_number
    description: Receiver phone number
  waiting_time_sec:
    lineage:
      - datalake_bigfone_clean.event.waiting_time_sec
    description: Time elapsed between the start of the call and the first reservation, in seconds
  is_call_answered:
    description: Boolean that indicates if the call was answered
  ends_in_abandon:
    description: Boolean describing if the call ends in an abandoned reservation
  is_reservation_answered:
    description: Boolean that indicates if the reservation was answered
  is_reservation_timeout:
    description: If the reservation timed out
  is_reservation_rejected:
    description: If the reservation was rejected
  is_reservation_canceled:
    description: If the reservation was canceled
  ts_task_created:
    lineage:
      - datalake_bigfone_clean.event.ts_created
    description: Timestamp of task creation
  ts_reservation_created:
    lineage:
      - datalake_bigfone_clean.event.ts_created
    description: Timestamp of reservation creation
  ts_reservation_accepted:
    lineage:
      - datalake_bigfone_clean.event.ts_created
    description: Timestamp of when the reservartion was accepted
  ts_reservation_ended:
    lineage:
      - datalake_bigfone_clean.event.ts_created
    description: Timestamp of when the reservartion ended
  year:
    lineage:
      - datalake_bigfone_clean.event.ts_created
    description: Represents the year of ts_task_created, used as a partition
  month:
    lineage:
      - datalake_bigfone_clean.event.ts_created
    description: Represents the month of ts_task_created, used as a partition
  day:
    lineage:
      - datalake_bigfone_clean.event.ts_created
    description: Represents the day of ts_task_created, used as a partition
