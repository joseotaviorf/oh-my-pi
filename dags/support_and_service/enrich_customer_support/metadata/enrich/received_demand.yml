database_name: datalake_customer_support
table_name: received_demand
description:
  Enrich table that contains data from Twilio Flex table. It has data from
  Call, Chat and Email channels. Each row is a received demand. For chat and call,
  it uses Twilio Events IDs created for Tasks that were sent to an assigned queue
  and waiting for acceptance. For email, it considers all front office tickets.
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  id_call:
    lineage:
      - datalake_bigfone_twilio.call_flex_events.id_call
    description:
      The Twilio call ID is a unique identifier that represents a single phone call
      initiated on the Twilio platform. When a call is made, it can be routed to
      available agents or workers, and a corresponding task is created to represent the
      incoming call. The task is then assigned to one or more workers, and a reservation
      is generated for each worker who is considered for the task. For the purpose of
      our analysis, we only consider call IDs associated with reservations that have
      been accepted. This column is filled exclusively for call data
  id_session:
    lineage:
      - datalake_quinto_messenger.chat.id_session
      - datalake_quinto_messenger.channel.id_source
      - datalake_sauron_clean.session.id
    description: ID from Sauron session. This column is filled exclusively for chat data
  id_ticket:
    lineage:
      - datalake_customer_support.email.id_ticket
      - datalake_customer_support.call.id_ticket
      - datalake_customer_support.chat.id_ticket
    description: Zendesk's ticket ID.
  id_task:
    lineage:
      - datalake_bigfone_twilio.call_flex_events.id_task
      - datalake_quinto_messenger_clean.task_event.id_task_external
    description:
      Segment ID of Twilio Flex platform. Each ID is a demand, it's not unique because
      a demand can have multiples demands when there is a transfer. In the case of chat
      and call channels, the received demand is identified by the Twilio Task ID.
      For call tasks, it considers all inbound tasks, whereas for chat tasks, it takes into account
      all tasks that have generated a reservation. Similarly, for email, all Zendesk
      E-mail Tickets are considered.
  id_user:
    lineage:
      - datalake_sauron_clean.session.user_data
      - datalake_ebdb_customer_contact_identification.customer_contact_identification.id_user
    description: User ID from main/EBDB
  id_reservation:
    lineage:
      - datalake_bigfone_twilio.call_flex_events.id_reservation
    description: Reservation ID from Twilio, identifies an event which an agent has been assigned to a call
  agent_email:
    lineage:
      - datalake_bigfone_twilio.call_flex_events.id_task_external
      - datalake_quinto_messenger_clean.task.assigned_to
      - datalake_customer_support.email.agent_email
    description: The agent email.
  channel:
    description: Channel name which customer got in touch with 5A
    categories:
      call: channel_name receives this value when the customer get in touch via call
      chat: channel_name receives this value when the customer get in touch via chat
      email: channel_name receives this value when the customer get in touch via email
  customer_phone:
    lineage:
      - datalake_bigfone_twilio.call_flex_events.customer_phone
      - datalake_quinto_messenger_clean.task_event.event_payload
    description: The customer phone associated with the id_user.
  customer_email:
    lineage:
      - datalake_ebdb_customer_contact_identification.customer_contact_identification.customer_contact
    description: The user customer email associated with the id_user.
  department:
    lineage:
      - datalake_bigfone_twilio.call_flex_events.id_task_queue
      - datalake_quinto_messenger_clean.task_event.event_payload
      - datalake_customer_support.email.department
    description:
      In Twilio, a queue is a holding area for tasks that are waiting to be assigned to
      workers for processing. The name of the queue corresponds to the department for
      which the task is intended to be routed. For Zendesk E-mail, the department is
      the Zendesk group assigned to the ticket.
  client_type:
    lineage:
      - datalake_customer_suppor.call.client_type
      - datalake_customer_suppor.chat.client_type
      - datalake_customer_suppor.email.client_type
    description: Field related to the ticket taxonomy
  customer_type_tag:
    lineage:
      - datalake_customer_suppor.call.customer_type_tag
      - datalake_customer_suppor.chat.customer_type_tag
      - datalake_customer_suppor.email.customer_type_tag
    description: Field related to the ticket taxonomy
  contact_motivation_tag:
    lineage:
      - datalake_customer_suppor.call.contact_motivation_tag
      - datalake_customer_suppor.chat.contact_motivation_tag
      - datalake_customer_suppor.email.contact_motivation_tag
    description: Field related to the ticket taxonomy
  contact_theme_tag:
    lineage:
      - datalake_customer_suppor.call.contact_theme_tag
      - datalake_customer_suppor.chat.contact_theme_tag
      - datalake_customer_suppor.email.contact_theme_tag
    description: Field related to the ticket taxonomy
  contact_theme_detail_tag:
    lineage:
      - datalake_customer_suppor.call.contact_theme_detail_tag
      - datalake_customer_suppor.chat.contact_theme_detail_tag
      - datalake_customer_suppor.email.contact_theme_detail_tag
    description: Field related to the ticket taxonomy
  step_tag:
    lineage:
      - datalake_customer_suppor.call.step_tag
      - datalake_customer_suppor.chat.step_tag
      - datalake_customer_suppor.email.step_tag
    description: Field related to the ticket taxonomy
  request_type:
    lineage:
      - datalake_customer_suppor.call.request_type
      - datalake_customer_suppor.chat.request_type
      - datalake_customer_suppor.email.request_type
    description: Field related to the ticket taxonomy
  completion_reason:
    lineage:
      - datalake_quinto_messenger.task.completion_reason
    description: Reason for a given Twilio task to have been completed.
  status:
    lineage:
      - datalake_quinto_messenger_clean.task_event.event_payload
      - datalake_customer_support.call.id_external_service
    description: How a task ended, the final state of every interaction in a call, chat or email
    categories:
      ABANDONED: Valid for call channel, when the call was abandoned and did not create a ticket
      COMPLETED: Valid for all channels, when there is a ticket created for that contact
      TRANSFERRED: Valid for chat and call channels, when the task was transferred to another department
      IN PROGRESS: Valid for email channel, when the email ticket is still being solved
      IDLED: Valid for chat channel, when the conversation terminated due to the customer not responding
      EXPIRED: Valid for chat channel, when the session timeouts
  area:
    lineage:
      - datalake_customer_suppor.call.area
      - datalake_customer_suppor.chat.area
      - datalake_customer_suppor.email.area
      - datalake_gsheets_clean.department_control.area
    description: Department area (e.g. CX).
  front_or_back:
    lineage:
      - datalake_customer_suppor.call.front_or_back
      - datalake_customer_suppor.chat.front_or_back
      - datalake_customer_suppor.email.front_or_back
      - datalake_gsheets_clean.department_control.front_or_back
    description: Department classification as front or back.
  is_answered:
    description:
      The status of the demand, whether it was answered or not, is determined
      differently based on the channel. For call, the Twilio Reservation ID is
      considered to determine if the demand was accepted by a worker or not.
      For chat, the demand is considered answered if the corresponding Event Task
      has a conversation_measure_1 attribute NOT NULL. The conversation measure 1
      indicates the time elapsed between the moment the task was assigned to a worker
      and the moment the worker accepted the task and started working on it.
      This metric is also known as the "acceptance time" or "task acceptance time".
      It is used to track how quickly workers are able to start working on tasks once
      they are assigned to them, which can help optimize workflows and improve customer
      satisfaction. For Zendesk E-mail Tickets, the demand is always considered answered.
  is_per_team_task:
    description:
      Boolean attribute in a task that defines if it is transfer between differente departments. This value is used to
      build the "segments per team" metric.
  average_reply_time:
    lineage:
      - datalake_quinto_messenger.message.reply_time
    description: Average reply time for every agent on a task - considering all messages the agent exchanged with the customer.
  ts_reservation_created:
    lineage:
      - datalake_quinto_messenger_clean.task_event.ts_created
    description:
      For Twilio Events, the creation timestamp of every 'reservation.created' event.
      Only present in the 'chat' channel
  ts_created:
    lineage:
      - datalake_bigfone_twilio.call_flex_events.ts_created_local
      - datalake_quinto_messenger_clean.task_event.ts_created
      - datalake_customer_support.email.ts_ticket_started
    description:
      For Twilio Events, the creation timestamp represents the date and time when the
      event was created. For Zendesk E-mail Tickets, the creation timestamp corresponds
      to the ticket creation date in UTC-3.
  ts_task_created:
    lineage:
      - datalake_bigfone_twilio.call_flex_events.ts_created_local
      - datalake_quinto_messenger_clean.task_event.ts_created
    description: For Twilio Events, the creation timestamp of every task
