database_name: datalake_customer_support
table_name: csat
description:
  The customer support CSAT table consolidates all CSAT answers from tickets across
  chat, call, and email channels.
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  id_ticket:
    lineage:
      - datalake_zendesk_clean.tickets.id_ticket
      - datalake_survicate.zendesk_email_surveys.id_ticket
      - datalake_customer_support.tickets.id_ticket
      - datalake_chat_fup_clean.chats_chat.id_ticket
    description: Unique identifier for the customer support ticket.
  first_csat_score:
    lineage:
      - datalake_zendesk_clean.tickets.satisfaction_rating.score
      - datalake_survicate.zendesk_email_surveys.csat_score
      - datalake_bigfone_clean.event.csat_2
      - datalake_chat_fup_clean.surveys_answer.rating
    description: The initial customer satisfaction score recorded for the ticket.
  last_csat_score:
    lineage:
      - datalake_zendesk_clean.tickets.satisfaction_rating.score
      - datalake_survicate.zendesk_email_surveys.csat_score
      - datalake_bigfone_clean.event.csat_2
      - datalake_chat_fup_clean.surveys_answer.rating
    description: The most recent customer satisfaction score recorded for the ticket.
  first_csat_comment:
    lineage:
      - datalake_zendesk_clean.tickets.satisfaction_rating.comment
      - datalake_survicate.zendesk_email_surveys.user_comment
      - datalake_chat_fup_clean.surveys_answer.comment
    description: The first customer comment associated with the satisfaction score.
  last_csat_comment:
    lineage:
      - datalake_zendesk_clean.tickets.satisfaction_rating.comment
      - datalake_survicate.zendesk_email_surveys.user_comment
      - datalake_chat_fup_clean.surveys_answer.comment
    description: The most recent customer comment associated with the satisfaction score.
  is_answered:
    lineage:
      - datalake_zendesk_clean.tickets.satisfaction_rating.score
      - datalake_survicate.zendesk_email_surveys.user_comment
      - datalake_survicate.zendesk_email_surveys.csat_score
      - datalake_survicate.zendesk_email_surveys.is_solved
    description: Indicates whether the ticket has been answered based on satisfaction data.
  is_solved:
    lineage:
      - datalake_zendesk_clean.tickets.satisfaction_rating.score
      - datalake_survicate.zendesk_email_surveys.is_solved
      - datalake_bigfone_clean.event.csat_1
      - datalake_chat_fup_clean.surveys_answer.is_solved
    description: Indicates whether the ticket has been resolved or solved.
  ts_first_response:
    lineage:
      - datalake_zendesk_clean.tickets.ts_updated
      - datalake_survicate.zendesk_email_surveys.ts_first_response
      - datalake_bigfone_clean.event.ts_created
      - datalake_chat_fup_clean.surveys_answer.ts_created
    description: Timestamp of the first response recorded for the ticket.
  ts_last_response:
    lineage:
      - datalake_zendesk_clean.tickets.ts_updated
      - datalake_survicate.zendesk_email_surveys.ts_first_response
      - datalake_bigfone_clean.event.ts_created
      - datalake_chat_fup_clean.surveys_answer.ts_created
    description: Timestamp of the most recent response recorded for the ticket.
