database_name: datalake_customer_support
table_name: unified_tickets
description:
  This table has the goal to unify all tickets from call, chat and email channels.
  By centralizing all tickets metrics in a single table,
  it provides a full overview of the customer support activity.
  Also, this table is the base to build fact_ticket model.
domain: Support and Service
owner: william.angelo@quintoandar.com.br
columns:
  id_ticket:
    lineage:
      - datalake_customer_support.call.id_ticket
      - datalake_customer_support.chat.id_ticket
      - datalake_customer_support.email.id_ticket
      - datalake_customer_support.historical_call.id_ticket
      - datalake_customer_support.historical_chat.id_ticket
    description: Unique ticket identifier (generated by zendesk).
  id_taxonomy:
    lineage:
      - datalake_customer_support.call.step_tag
      - datalake_customer_support.call.customer_type_tag
      - datalake_customer_support.call.client_type
      - datalake_customer_support.call.request_type
      - datalake_customer_support.call.contact_motivation_tag
      - datalake_customer_support.call.contact_theme_tag
      - datalake_customer_support.call.contact_theme_detail_tag
      - datalake_customer_support.chat.step_tag
      - datalake_customer_support.chat.customer_type_tag
      - datalake_customer_support.chat.client_type
      - datalake_customer_support.chat.request_type
      - datalake_customer_support.chat.contact_motivation_tag
      - datalake_customer_support.chat.contact_theme_tag
      - datalake_customer_support.chat.contact_theme_detail_tag
      - datalake_customer_support.email.step_tag
      - datalake_customer_support.email.customer_type_tag
      - datalake_customer_support.email.client_type
      - datalake_customer_support.email.request_type
      - datalake_customer_support.email.contact_motivation_tag
      - datalake_customer_support.email.contact_theme_tag
      - datalake_customer_support.email.contact_theme_detail_tag
      - datalake_customer_support.historical_call.step_tag
      - datalake_customer_support.historical_call.customer_type_tag
      - datalake_customer_support.historical_call.client_type
      - datalake_customer_support.historical_call.request_type
      - datalake_customer_support.historical_call.contact_motivation_tag
      - datalake_customer_support.historical_call.contact_theme_tag
      - datalake_customer_support.historical_call.contact_theme_detail_tag
      - datalake_customer_support.historical_chat.step_tag
      - datalake_customer_support.historical_chat.customer_type_tag
      - datalake_customer_support.historical_chat.client_type
      - datalake_customer_support.historical_chat.request_type
      - datalake_customer_support.historical_chat.contact_motivation_tag
      - datalake_customer_support.historical_chat.contact_theme_tag
      - datalake_customer_support.historical_chat.contact_theme_detail_tag
    description: Key generated as a MD5 from all taxonomies fields.
  id_tags:
    lineage:
      - datalake_customer_support.call.tags
      - datalake_customer_support.chat.tags
      - datalake_customer_support.email.tags
    description: Key generated as a MD5 from the ticket tags field.
  id_channel:
    lineage:
      - datalake_customer_support.call.direction
      - datalake_customer_support.email.direction
      - datalake_customer_support.historical_call.direction
    description: Key generated to identify the channel of this ticket.
  id_first_agent:
    lineage:
      - datalake_customer_support.historical_chat.id_first_agent
    description:
      Id of the first agent that answered this ticket. For email tickets
      first agent will always be equal to the last agent.
  id_last_agent:
    lineage:
      - datalake_customer_support.historical_chat.id_last_agent
    description:
      Id of the last agent that answered this ticket. For email tickets
      first agent will always be equal to the last agent.
  id_first_department:
    lineage:
      - datalake_customer_support.call.first_department
      - datalake_customer_support.chat.first_department
      - datalake_customer_support.email.department
      - datalake_customer_support.historical_call.first_department
      - datalake_customer_support.historical_chat.first_department
    description:
      Key generated as a MD5 from the first department string registered
      for this ticket.
  id_main_department:
    lineage:
      - datalake_customer_support.call.last_department
      - datalake_customer_support.chat.last_department
      - datalake_customer_support.email.department
      - datalake_customer_support.historical_call.last_department
      - datalake_customer_support.historical_chat.last_department
    description:
      Key generated as a MD5 from the main department string registered
      for this ticket. We consider the main department the last department from Twilio
      it if is a chat/call support, otherwise we consider the zendesk department.
  id_user:
    lineage:
      - datalake_customer_support.call.id_user
      - datalake_customer_support.chat.id_user
      - datalake_customer_support.email.id_user
      - datalake_customer_support.historical_call.id_user
      - datalake_customer_support.historical_chat.id_user
    description: Unique user identifier.
  id_contract:
    lineage:
      - datalake_customer_support.call.id_contract
      - datalake_customer_support.chat.id_contract
      - datalake_customer_support.email.id_contract
      - datalake_customer_support.historical_call.id_contract
      - datalake_customer_support.historical_chat.id_contract
      - datalake_greenseer_clean.sessions.memory
    description: Unique contract identifier.
  id_session:
    lineage:
      - datalake_customer_support.call.id_session
      - datalake_customer_support.chat.id_session
    description: Session ID from Sauron
  id_service_status:
    lineage:
      - datalake_customer_support.chat.service_status
    description: Unique identifier for the front office service status
  id_main_session:
    lineage:
      - datalake_customer_resolution.customer_resolution_static.id_ticket
    description:
      Unique identifier of the ticket session (first user contact for this
      team in a 7 days window). Only valid for front tickets.
  id_next_ticket:
    lineage:
      - datalake_customer_resolution.customer_resolution_static.ticket_recontact_list
    description: Identifier of the next ticket for this user within the same session.
  channel:
    description: Identify the channel for this ticket (call, chat, email).
  channel_type:
    lineage:
      - datalake_customer_support.call.channel_type
    description: Identify the channel type for this ticket. Only available for call tickets.
  direction:
    lineage:
      - datalake_customer_support.call.direction
      - datalake_customer_support.email.direction
    description: Identify the direction for this ticket. Only available for call or email tickets.
  team:
    lineage:
      - datalake_customer_support.call.team
      - datalake_customer_support.chat.team
      - datalake_customer_support.email.team
    description: Team responsible for the ticket.
  area:
    lineage:
      - datalake_customer_support.call.area
      - datalake_customer_support.chat.area
      - datalake_customer_support.email.area
    description: Area responsible for the ticket.
  ticket_origin:
    description: It is the source channel of the chat ticket, which can be whatsapp or chat5A.
    lineage:
      - datalake_customer_support.chat.ticket_origin
      - datalake_customer_support.call.ticket_origin
  theme:
    description: Theme of the ticket.
    lineage:
      - datalake_customer_support.call.contact_theme_tag
      - datalake_customer_support.chat.contact_theme_tag
      - datalake_customer_support.email.contact_theme_tag
  theme_detail:
    description: Theme detail of the ticket.
    lineage:
      - datalake_customer_support.call.contact_theme_detail_tag
      - datalake_customer_support.chat.contact_theme_detail_tag
      - datalake_customer_support.email.contact_theme_detail_tag
  context:
    description: Context of the ticket.
    categories:
      "ForRent":
        Ticket is considered from the ForRent context because has subjourney 'Contract to Entrance',
        'Listing & Search', 'Offboarding', 'Onboarding' or 'Visits to Offer'.
      "ForSale": Ticket is considered from the ForSale context because has subjourney 'For Sale'.
      "Partners": Ticket is considered from the Partners context because has subjourney 'Partners'.
  csat_score:
    lineage:
      - datalake_customer_support.call.csat_rating
      - datalake_customer_support.chat.csat_score
      - datalake_customer_support.email.csat_score
      - datalake_customer_support.historical_chat.csat_score
    description: Last CSAT score (value goes from 1 to 5).
  first_csat_score:
    lineage:
      - datalake_customer_support.call.csat_rating
      - datalake_customer_support.chat.csat_score
      - datalake_customer_support.email.csat_score
      - datalake_customer_support.historical_chat.csat_score
    description: First CSAT score (value goes from 1 to 5).
  status:
    lineage:
      - datalake_customer_support.call.status
      - datalake_customer_support.chat.status
      - datalake_customer_support.email.status
      - datalake_customer_support.historical_call.status
      - datalake_customer_support.historical_chat.status
    description: Ticket status.
  first_department:
    lineage:
      - datalake_customer_support.call.first_department
      - datalake_customer_support.chat.first_department
      - datalake_customer_support.email.department
      - datalake_customer_support.historical_call.first_department
      - datalake_customer_support.historical_chat.first_department
    description: First department string registered for this ticket.
  main_department:
    lineage:
      - datalake_customer_support.call.last_department
      - datalake_customer_support.chat.last_department
      - datalake_customer_support.email.department
      - datalake_customer_support.historical_call.last_department
      - datalake_customer_support.historical_chat.last_department
    description:
      Main department string registered for this ticket. We consider the
      main department the last department from Twilio it if is a chat/call support,
      otherwise we consider the zendesk department.
  total_departments:
    lineage:
      - datalake_customer_support.call.number_of_departments
      - datalake_customer_support.chat.number_of_departments
      - datalake_customer_support.historical_chat.number_of_departments
    description:
      How many distinct departments have this ticket been transferred to.
      We consider that email has only a single segment (no transferences) so this
      column must alway have only 1 distinct department.
  total_segments:
    lineage:
      - datalake_customer_support.call.number_of_segments
      - datalake_customer_support.chat.number_of_segments
      - datalake_customer_support.historical_chat.number_of_segments
    description:
      How many segments this ticket have. We consider that email has only
      a single segment.
  full_resolution_time:
    lineage:
      - datalake_customer_support.call.frt
      - datalake_customer_support.chat.frt
      - datalake_customer_support.email.frt
    description:
      FRT (Full Resolution Time) calculates the total time from the beggining
      of the support in the front until the end, considering the backoffice time if
      there is back ticket related.
  front_or_back:
    lineage:
      - datalake_customer_support.call.front_or_back
      - datalake_customer_support.chat.front_or_back
      - datalake_customer_support.email.front_or_back
      - datalake_customer_support.historical_call.front_or_back
      - datalake_customer_support.historical_chat.front_or_back
    description:
      Given the main department define if this ticket is front or back.
      This column have undefined values in case there is no definition of this value
      in the department_control sheet for this specific main department.
  last_back_ticket:
    lineage:
      - datalake_customer_support.call.last_back_ticket
      - datalake_customer_support.chat.last_back_ticket
      - datalake_customer_support.email.last_back_ticket
    description: Last back ticket related to this ticket.
  back_tickets:
    lineage:
      - datalake_customer_support.call.back_ticket_list
      - datalake_customer_support.chat.back_ticket_list
      - datalake_customer_support.email.back_ticket_list
    description: List of back tickets related to this ticket.
  resolution_survey:
    lineage:
      - datalake_customer_support.call.is_solved
      - datalake_customer_support.chat.is_solved
      - datalake_customer_support.email.is_solved
      - datalake_customer_support.historical_chat.is_solved
    description:
      Boolean column containing the last user answer if his problem was
      solved via CSAT survey. Null if the user has not answered.
  ticket_rate_weight:
    description: The weight applied to the ticket if it's part of the ticket rate calculation.
    categories:
      "1":
        Ticket rate weight is 1 and is based on being a front ticket and in the sub journeys 'Contract to Entrance',
        'For Sale', 'Listing & Search', 'Offboarding', 'Onboarding', 'Partners' or 'Visits to Offer'.
      "2":
        Ticket rate weight is 2 and is based on being a back ticket and in the sub journeys 'Contract to Entrance',
        'For Sale', 'Listing & Search', 'Offboarding', 'Onboarding', 'Partners' or 'Visits to Offer'.
      "15": Ticket rate weight is 15 and is based on being a front ticket and in the sub journey 'Ongoing'.
      "30": Ticket rate weight is 30 and is based on being a back ticket and in the sub journey 'Ongoing'.
      "Null": No weight applied if the ticket is not part of the ticket rate rules.
  is_ticket_rate:
    description:
      "Boolean flag indicating if the ticket is part of the ticket rate calculation.
      In order to be part of, the ticket must follow several rules:
      - The ticket area must be CX;
      - The ticket team could be anyone but Ong Back;
      - The ticket must be front or back, depending on the channel;
      - The ticket must not belong to a few departments (Rescisão por Inadimplência [OFF][POS][BACK], Offboarding Reparos [OFF] [POS] [BACK],
      Offboarding pré saída [OFF] [POS] [BACK], Proteção QuintoAndar [OFF] [POS] [BACK], Rescisão - Despejo [OFF][POS][BACK]
      or Rescisão 1 [OFF] [POS] [BACK]);
      - The date in which the ticket was solved must be later than 1st January/2022.
      - If the ticket has channel email, then we accept all directions;
      - If the ticket has channel chat, then we accept only direction inbound;
      - If the ticket has channel call, we accept only directions inbound and outbound-api."
  has_answered_csat:
    lineage:
      - datalake_customer_support.call.is_csat_answered
      - datalake_customer_support.chat.is_csat_answered
      - datalake_customer_support.email.is_answered
      - datalake_customer_support.historical_chat.is_csat_answered
    description: Boolean that indicates if the user has answered the CSAT survey.
  has_back_ticket:
    lineage:
      - datalake_customer_support.call.has_back_ticket
      - datalake_customer_support.chat.has_back_ticket
      - datalake_customer_support.email.has_back_ticket
    description: Boolean that indicates if this ticket have a related backoffice ticket.
  is_back_ticket_open:
    lineage:
      - datalake_customer_support.call.is_open_back_ticket
      - datalake_customer_support.chat.is_open_back_ticket
      - datalake_customer_support.email.is_open_back_ticket
    description:
      Boolean that indicates if any of the related backoffice tickets have
      a status different than closed.
  is_solved:
    lineage:
      - datalake_customer_support.call.is_solved
      - datalake_customer_support.call.back_ticket_list
      - datalake_customer_support.call.is_open_back_ticket
      - datalake_customer_support.call.is_bot
      - datalake_customer_support.call.is_closed_by_merge
      - datalake_customer_support.call.front_or_back
      - datalake_customer_support.chat.is_solved
      - datalake_customer_support.chat.back_ticket_list
      - datalake_customer_support.chat.is_open_back_ticket
      - datalake_customer_support.chat.is_bot
      - datalake_customer_support.chat.is_closed_by_merge
      - datalake_customer_support.chat.front_or_back
      - datalake_customer_support.email.is_solved
      - datalake_customer_support.email.back_ticket_list
      - datalake_customer_support.email.is_open_back_ticket
      - datalake_customer_support.email.is_bot
      - datalake_customer_support.email.is_closed_by_merge
      - datalake_customer_support.email.front_or_back
      - datalake_customer_support.historical_chat.is_solved
      - datalake_customer_support.historical_chat.is_bot
      - datalake_customer_support.historical_chat.is_closed_by_merge
      - datalake_customer_support.historical_chat.front_or_back
    description:
      Calculated field with the following premisses True if resolution_survey
      = True and (back_ticket_list is empty or is_open_back_ticket = False) and front_or_back
      = front||null and is_bot=False and is_closed_by_merge=False False if resolution_survey
      is not null and (back_ticket_list is not empty or is_open_back_ticket = False)
      and front_or_back = front||null and is_bot=False and is_closed_by_merge=False
      null otherwise.
  is_fcr:
    lineage:
      - datalake_customer_support.call.is_solved
      - datalake_customer_support.call.back_ticket_list
      - datalake_customer_support.call.has_transfers
      - datalake_customer_support.call.is_bot
      - datalake_customer_support.call.is_closed_by_merge
      - datalake_customer_support.call.front_or_back
      - datalake_customer_support.chat.is_solved
      - datalake_customer_support.chat.back_ticket_list
      - datalake_customer_support.chat.number_of_departments
      - datalake_customer_support.chat.is_bot
      - datalake_customer_support.chat.is_closed_by_merge
      - datalake_customer_support.chat.front_or_back
      - datalake_customer_support.email.is_solved
      - datalake_customer_support.email.back_ticket_list
      - datalake_customer_support.email.is_bot
      - datalake_customer_support.email.is_closed_by_merge
      - datalake_customer_support.email.front_or_back
      - datalake_customer_support.historical_chat.is_solved
      - datalake_customer_support.historical_chat.number_of_departments
      - datalake_customer_support.historical_chat.is_bot
      - datalake_customer_support.historical_chat.is_closed_by_merge
      - datalake_customer_support.historical_chat.front_or_back
    description:
      First Contact Resolution (ticket view). True if resolution_survey
      = True and back_ticket_list is null and has_transfers = False and is_bot=False
      and is_closed_by_merge=False and front_or_back = front||null False if resolution_survey
      is not null and is_bot=False and is_closed_by_merge=False and front_or_back
      = front||null null otherwise.
  has_transfers:
    lineage:
      - datalake_customer_support.call.has_transfers
      - datalake_customer_support.chat.has_transfers
    description: True if the ticket have more than 1 segment, False otherwise.
  total_minutes_reception_time:
    lineage:
      - datalake_customer_support.call.total_minutes_reception_time
      - datalake_customer_support.chat.total_minutes_reception_time
    description: Reception time in minutes.
  total_minutes_talk_time:
    lineage:
      - datalake_customer_support.call.total_minutes_talk_time
      - datalake_customer_support.chat.total_minutes_talk_time
      - datalake_customer_support.historical_call.total_minutes_talk_time
      - datalake_customer_support.historical_chat.total_minutes_talk_time
    description: Talk time in minutes.
  total_minutes_queue_time:
    lineage:
      - datalake_customer_support.call.total_minutes_queue_time
      - datalake_customer_support.chat.total_minutes_queue_time
    description: Queue time in minutes.
  total_minutes_wrap_up_time:
    lineage:
      - datalake_customer_support.call.total_minutes_wrap_up_time
      - datalake_customer_support.chat.total_minutes_wrap_up_time
    description: Wrap up time in minutes.
  total_minutes_handling_time:
    lineage:
      - datalake_customer_support.call.total_minutes_handling_time
      - datalake_customer_support.chat.total_minutes_handling_time
    description: Handling time in minutes.
  total_backoffice_minutes_time:
    lineage:
      - datalake_customer_support.call.total_backoffice_minutes_time
      - datalake_customer_support.chat.total_backoffice_minutes_time
      - datalake_customer_support.email.total_backoffice_minutes_time
    description: Time in minutes to close all related backoffice tickets.
  total_minutes_front_to_open_back_ticket_time:
    lineage:
      - datalake_customer_support.call.total_minutes_front_to_open_back_ticket_time
      - datalake_customer_support.chat.total_minutes_front_to_open_back_ticket_time
      - datalake_customer_support.email.total_minutes_front_to_open_back_ticket_time
    description:
      Time in minutes to open the related backoffice ticket after solving
      the front ticket.
  replies:
    lineage:
      - datalake_customer_support.call.replies
      - datalake_customer_support.chat.replies
      - datalake_customer_support.email.replies
    description: Number of responses referring to a ticket, that is, how many times the ticket was answered.
  reopens:
    lineage:
      - datalake_customer_support.call.reopens
      - datalake_customer_support.chat.reopens
      - datalake_customer_support.email.reopens
    description: Total number of times a ticket has been reopened.
  csat_comment:
    lineage:
      - datalake_customer_support.email.csat_comment
      - datalake_customer_support.chat.csat_comment
    description: Sample of the comment the user left on our CSAT survey.
  first_csat_comment:
    lineage:
      - datalake_customer_support.email.csat_comment
      - datalake_customer_support.chat.csat_comment
    description: Sample of the first comment the user left on our CSAT survey.
  ts_started:
    lineage:
      - datalake_customer_support.call.ts_ticket_started
      - datalake_customer_support.chat.ts_ticket_started
      - datalake_customer_support.email.ts_ticket_started
      - datalake_customer_support.historical_call.ts_ticket_started
      - datalake_customer_support.historical_chat.ts_ticket_started
    description:
      Start timestamp. Note - for chat and call tickets this value is the
      first timestamp in our event tables. For email tickets we get the timestamp
      directly from zendesk.
  ts_closed:
    lineage:
      - datalake_customer_support.call.ts_ticket_ended
      - datalake_customer_support.chat.ts_ticket_ended
      - datalake_customer_support.email.ts_ticket_ended
      - datalake_customer_support.historical_call.ts_ticket_ended
      - datalake_customer_support.historical_chat.ts_ticket_ended
    description:
      Closed timestamp. This is an immutable column. Zendesk change the
      ticket from solved to closed automatically after 3 days it has been solved.
      Note - for chat and call tickets this value is the last timestamp in our event
      tables. For email tickets we get the timestamp directly from zendesk.
  ts_csat_response:
    lineage:
      - datalake_customer_support.call.ts_csat_answered
      - datalake_customer_support.chat.ts_csat_response
      - datalake_customer_support.email.ts_csat_last_response
    description: Timestamp of the last time the user answered a CSAT survey.
  ts_csat_first_response:
    lineage:
      - datalake_customer_support.email.ts_csat_first_response
    description: Timestamp of the first time the user answered the CSAT survey.
  ts_survey:
    lineage:
      - datalake_customer_support.call.ts_csat_answered
      - datalake_customer_support.call.ts_survey
    description:
      Time when the survey was sent to the user. Null if we don't have
      this information or the survey wasn't sent.
  ts_solved:
    lineage:
      - datalake_customer_support.call.ts_ticket_ended
      - datalake_customer_support.chat.ts_ticket_ended
      - datalake_customer_support.email.ts_ticket_solved
      - datalake_customer_support.historical_call.ts_ticket_ended
      - datalake_customer_support.historical_chat.ts_ticket_ended
    description:
      Solved timestamp. For chat and call this column have the same value
      as the closed timestamp. Note - for chat and call tickets this value is the
      last timestamp in our event tables. For email tickets we get the timestamp directly
      from zendesk.
