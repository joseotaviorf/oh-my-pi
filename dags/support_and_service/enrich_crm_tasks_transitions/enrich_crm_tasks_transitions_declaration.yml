dag:
  name: enrich_crm_tasks_transitions
  schedule_start_date: 2020, 8, 29
  owner: Data SS
  documentation:
    dag_purpose: |
      Creates CRM (Customer Relationship Management) tasks transitions
      tables based in workflows transitions.
workflow:
  type: query_delta
  layer: enrich
  default_extraction_type: incremental
  default_partitions: ["year", "month", "day"]
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: r5d.xlarge
    node_type_id: r5d.2xlarge
    num_workers: 2
    spark_version: 13.3.x-scala2.12
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
  databricks_conn_id: databricks_new
