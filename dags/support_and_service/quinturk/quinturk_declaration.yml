dag:
  name: quinturk
  schedule_start_date: 2024, 2, 20
  schedule_interval: 0 3 * * *
  owner: Data SS
  documentation:
    dag_purpose: |
      Retrieves data from the Quinturk database

workflow:
  type: cdc
  layer: raw
  source_database: quinturk
  source_schema: public
  custom_schema: quinturk
  database_type: postgres
  lineage_product_database_name: quinturk
  dbutils_secret_key: QUINTURK_DB
  tables_customization:
    task: {}
    task_completion: {}
    project: {}

cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: m5a.xlarge
    node_type_id: m5a.xlarge
    num_workers: 3
    spark_version: 13.3.x-scala2.12
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
  databricks_conn_id: databricks_new
