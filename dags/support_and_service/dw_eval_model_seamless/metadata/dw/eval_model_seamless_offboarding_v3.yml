---
database_name: dw_eval_model_seamless
table_name: eval_model_seamless_offboarding_v3
description: >
  DW dataset for offline evaluation of the seamless offboarding model:
  one row per SPOC-eligible termination contract with model prediction,
  ticket classification, and matched support or Salesforce ticket when present.
domain: Support and Services
owner: gabriel.firmino@quintoandar.com.br
columns:
  id_contract:
    description: Rental contract identifier from Terminator, aligned with listing contract keys.
    lineage:
      - datalake_terminator_clean.termination.id_contract
      - dw_rent.dim_contract.id_contract
  id_request:
    description: Model request identifier from the Emlio input JSON payload (users-and-journeys-ml-service).
    lineage:
      - datalake_emlio_clean.emlio_logs.inputs
  id_contract_request:
    description: Contract identifier from the Emlio input JSON payload (string path $.contract_id), aligned with the model request.
    lineage:
      - datalake_emlio_clean.emlio_logs.inputs
  spoc_wave:
    description: SPOC wave or cohort label on the termination when present.
    lineage:
      - datalake_terminator_clean.termination.spoc_wave
  is_spoc:
    description: Whether the termination is flagged as part of the SPOC flow.
    lineage:
      - datalake_terminator_clean.termination.is_spoc
  team:
    description: Owning team name on the termination in Terminator.
    lineage:
      - datalake_terminator_clean.termination.team
  prediction:
    description: Model prediction value from the Emlio output JSON (users-and-journeys-ml-service).
    lineage:
      - datalake_emlio_clean.emlio_logs.outputs
  probability:
    description: Model probability from the Emlio output JSON.
    lineage:
      - datalake_emlio_clean.emlio_logs.outputs
  id_ticket:
    description: >
      Support ticket or Salesforce case identifier matched to the offboarding
      contract timeline for model evaluation.
    lineage:
      - dw_customer_support.fact_tickets.sk_ticket
      - dw_bpo_performance.cases_perspective.case_number
  tipo_ticket:
    description: >
      Support contact bucket matched to the contract timeline: front, escalated
      back, reinspection scheduling, or mediation; null when no classified match.
    lineage:
      - dw_customer_support.fact_tickets.sk_ticket
      - dw_customer_support.dim_department.department
      - dw_customer_support.dim_taxonomy.motivation
      - dw_bpo_performance.cases_perspective.case_number
      - dw_bpo_performance.cases_perspective.last_team
      - dw_bpo_performance.cases_perspective.record_type_name
      - dw_bpo_performance.cases_perspective.status
      - dw_offboarding.obt_offboarding.has_mediation_ticket
  ts_created:
    description: Termination record creation timestamp in Terminator.
    lineage:
      - datalake_terminator_clean.termination.ts_created
  ts_log:
    description: Emlio service log timestamp for the model call linked to this termination.
    lineage:
      - datalake_emlio_clean.emlio_logs.ts_log
