dag:
  name: reverse_atento_access
  schedule_start_date: 2023, 10, 11
  owner: Data SS
  documentation:
    dag_purpose:
      This DAG collects multiple data from Datalake and sends to an S3 bucket used to power Atento service.
      Atento is an external QuintoAndar partner for managing customer support.
    additional_information: This pipeline also exports results do aten
workflow:
  layer: reverse
  type: access
  load_spark_job: load_s3_data_into_external_bucket
  spark_job_arguments:
    - "{dag_name}" # dag_name
    - "{environment}"
    - "{bucket}"
    - "atento" #source
  tables_customization:
    external_bucket: {} #dummy task
cluster:
  type: databricks_13_3_med_mem_driver_min_memory_2_nodes_cluster