---
database_name: datalake_survicate_clean
table_name: survey_questions
description: This table contains all questions included in a specific survey, making it easier to review or analyze the survey structure.
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  id_question:
    description: The question's unique unchangeable identifier.
    lineage:
      - datalake_survicate_raw.survey_questions.id
  id_survey:
    description:
    lineage:
      - datalake_survicate_raw.survey_questions.survey_id
  type:
    description: The question's type
    categories:
      button_close: ""
      button_next: ""
      matrix:
        Respondents will be asked to evaluate multiple items within a single row (in a matrix table) using the same column choices. You can adjust the number
        of answers and columns to your needs and randomize the order of options every time the survey is displayed.
      form:
        Collect additional information from users/visitors such as full name, email, organization, department, job title, phone, website, country,
        address, city, state, zip, fax, annual revenue, employees, and comment. Create new leads/contacts in your software based on the form submission.
      text:
        Get respondents to provide an open-ended reply (text answer). It's a great way to collect more information about your score in NPS, smiley,
        or rating scale questions - easy to set up with our logic feature.
      single:
        Ask a simple yes or no question or have respondents pick one item from the list. Respondents will only be able to select a single response.
        It's possible to add an introduction, submit button and randomize the order of answers. You can also enable the mandatory or optional
        comment box to receive more precise feedback.
      multiple:
        Respondents will be able to select multiple items from the list of options. You can randomize answers, add an optional or
        mandatory comment box or limit the number of options the user can choose.
      dropdown_list:
        Get respondents to select one value from a dropdown list. It's different from "Single answer selection" in that all options become
        accessible after clicking on the arrow. You can choose if this question will be mandatory and randomize the order of answers.
      rating:
        Measure customer satisfaction on a 2 to 10-point scale. You can choose from stars, numerical, or text scales. It's possible to enable
        the submit button and change the text on the left and right.
      ranking:
        Have respondents rank multiple items in order of preference. They can either drag&drop the available options or select the value,
        with 1 being the most preferred option.
      smiley_scale:
        Let your customers express how happy they are on a 3 or 5-point scale using emojis. Please note that the final design of emojis depends
        on your respondents' operating systems. You can adjust the text on the very left and right to add customized messages or translate it
        to run surveys in different languages.
        It's not possible to adjust the smiley faces. If you want to customize the emojis, feel free to use single-choice answer questions and
        paste the emojis in the applicable fields.
      numerical_scale: Measure the response on a numerical scale.
      date: Get respondents to provide a date when answering the survey.
      nps/csat:
        Measure brand loyalty by asking how likely your customers are to recommend your company to a friend or colleague. This is a standardized
        way to measure customers' loyalty. Therefore, it's impossible to adjust the number of points on this scale. If you need to measure your
        customers' loyalty on a different scale, please use a smiley or rating question instead.
    lineage:
      - datalake_survicate_raw.survey_questions.type
  question:
    description: Text of the question as displayed to the respondent.
    lineage:
      - datalake_survicate_raw.survey_questions.question
  introduction:
    description: Introduction to the question as displayed to the respondent.
    lineage:
      - datalake_survicate_raw.survey_questions.introduction
  answer_choices:
    description: |
      - id: The answer's unique unchangeable identifier.
      - content: Text of the answer option as displayed to the respondent.
    lineage:
      - datalake_survicate_raw.survey_questions.answer_choices
  workspace_name:
    description: Workspace where the question is from.
    lineage:
      - datalake_survicate_raw.survey_questions.workspace_name
  dt_load:
    description: Date and time when the data was loaded.
    lineage:
      - datalake_survicate_raw.survey_questions.dt_load
  year:
    description: Year when the data was loaded.
    lineage:
      - datalake_survicate_raw.survey_questions.year
  month:
    description: Month when the data was loaded.
    lineage:
      - datalake_survicate_raw.survey_questions.month
  day:
    description: Day when the data was loaded.
    lineage:
      - datalake_survicate_raw.survey_questions.day
