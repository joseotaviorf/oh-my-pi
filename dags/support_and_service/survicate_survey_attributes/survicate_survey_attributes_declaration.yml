dag:
  name: survicate_survey_attributes
  owner: Data SS
  schedule_start_date: 2020, 11, 1
  documentation:
    dag_purpose: |
      Get survey response collected from [Survicate](https://developers.survicate.com/data-export/#get-the-list-of-surveys).
workflow:
  type: custom_ingestion
  layer: raw
  custom_schema: survicate
  load_spark_job: load_survicate_survey_attributes_raw
  spark_job_arguments:
  - "{environment}"
  - "{bucket}"
  - "{{ ds }}"
  - "{dag_name}"
  - "{table_name}"
  - "{partitions}"
  - "{schema}"

  default_extraction_type: incremental
  default_partitions: [year, month, day]
  tables_customization:
    survey_questions: {}
    survey_responses: {}

cluster:
  type: databricks_13_3_med_general_cluster
  custom_libraries:
    - whl: "{artifacts_bucket}/survicate-api-client-python/quintoandar_survicate_api_client-0.1.0-py2.py3-none-any.whl"
