database_name: dw_braze
table_name: fact_user_centric
description: Table with metrics regarding all the communications sent to a user in
  a specific period of time. Here we can see the number of campaigns, canvas, emails,
  sms, webhooks, etc. sent to the user in a specific period of time, with the time
  reference being the column dt_snapshot. For example, the columns "same_week" refers
  to the week of the dt_snapshot with the week going from Mon-Sun. The columns "1w_before"
  refers to the week before the dt_snapshot and so on.
domain: Support and Services
owner: conrado.fabri@quintoandar.com.br
columns:
  sk_braze_user:
    lineage:
    - datalake_braze_user_centric_periodicity.user_events_all_time_before.id_user_braze
    description: Key of the user on the Braze Platform. It is NOT the same sk as our
      sk_user.
  sk_user:
    lineage:
      - datalake_braze_user_centric_periodicity.user_events_all_time_before.id_user
    description: Key of the user on QuintoAndar Platform.
  total_campaigns_sent_to_same_week:
    lineage:
    - datalake_braze_user_centric_periodicity.user_events_same_week.total_campaigns_sent_to
    description: Total of send events for campaigns sent to the user on the week of
      the dt_snapshot. This column can increase as the week passes.
  total_campaigns_sent_to_1w_before:
    lineage:
    - datalake_braze_user_centric_periodicity.user_events_1w_before.total_campaigns_sent_to
    description: Total of send events for campaigns sent to the user on the week before
      the week_start of the dt_snapshot. This column is static until the start of
      the next week_start of the dt_snapshot.
  total_campaigns_sent_to_2w_before:
