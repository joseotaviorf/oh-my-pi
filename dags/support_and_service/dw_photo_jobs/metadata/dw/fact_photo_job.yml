database_name: dw_public
table_name: fact_photo_job
description: Fact table that contains each photo job created and keys associated with
domain: For Rent
owner: gustavo.geiger@quintoandar.com.br

columns:
  id_photo_job:
    lineage:
      - datalake_ebdb_photo_jobs.photo_job.id
    description: Key of photo job
  sk_house_listing:
    lineage:
      - datalake_ebdb_photo_jobs.photo_job.id_house
