    lineage:
      - datalake_ebdb_photo_jobs.photo_job.photo_session_contact_name
    description: Name reference of person to contact about the photo job
  photo_shoot_email:
    lineage:
      - datalake_ebdb_photo_jobs.photo_job.photo_session_email
    description: Email of person to contact about the photo job
  photo_shoot_phone:
    lineage:
      - datalake_ebdb_photo_jobs.photo_job.photo_session_phone
    description: Primary phone of person to contact about the photo job
  photo_shoot_second_phone:
    lineage:
      - datalake_ebdb_photo_jobs.photo_job.photo_session_secondary_phone
    description: Secondary phone of person to contact about the photo job
