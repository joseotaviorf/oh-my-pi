database_name: dw_satisfaction_rating
table_name: fact_ticket_csat
description:
  The customer support CSAT table consolidates all CSAT answers from tickets across
  chat, call, and email channels.
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  id_ticket:
    lineage:
      - datalake_customer_support.csat.id_ticket
    description: Unique identifier for the customer support ticket.
  first_csat_score:
    lineage:
      - datalake_customer_support.csat.first_csat_score
    description: The initial customer satisfaction score recorded for the ticket.
  last_csat_score:
    lineage:
      - datalake_customer_support.csat.last_csat_score
    description: The most recent customer satisfaction score recorded for the ticket.
  first_csat_comment:
    lineage:
      - datalake_customer_support.csat.first_csat_comment
    description: The first customer comment associated with the satisfaction score.
  last_csat_comment:
    lineage:
      - datalake_customer_support.csat.last_csat_comment
    description: The most recent customer comment associated with the satisfaction score.
  is_answered:
    lineage:
      - datalake_customer_support.csat.is_answered
    description: Indicates whether the ticket has been answered based on satisfaction data.
  is_solved:
    lineage:
      - datalake_customer_support.csat.is_solved
    description: Indicates whether the ticket has been resolved or solved.
  ts_first_response:
    lineage:
      - datalake_customer_support.csat.ts_first_response
    description: Timestamp of the first response recorded for the ticket.
  ts_last_response:
    lineage:
      - datalake_customer_support.csat.ts_last_response
    description: Timestamp of the most recent response recorded for the ticket.
