---
database_name: dw_satisfaction_rating
table_name: fact_answer
description: This table contains information about satisfaction responses. Its granularity is given by the sk_answer column.
domain: Support and Services
owner: gabriel.firmino@quintoandar.com.br
columns:
  sk_answer:
    description: Unique identifier of the satisfaction response.
    lineage:
      - datalake_satisfaction_rating.satisfaction_answers.id_answer
  sk_survey:
    description: Unique identifier of the satisfaction survey.
    lineage:
      - datalake_satisfaction_rating.satisfaction_answers.id_survey
  sk_contract:
    description: Identifier of the contract linked to the satisfaction response.
    lineage:
      - datalake_satisfaction_rating.satisfaction_answers.id_contract
  sk_ticket:
    description: If the satisfaction form was requested after a service, this, in general, will be linked to a service identifier in Zendesk.
    lineage:
      - datalake_satisfaction_rating.satisfaction_answers.id_ticket
  sk_support_session:
    description: Surrogate key for the front (or front-with-back-case) support session that triggered the satisfaction response, sourced from Chat FUP. For Support Session Service sessions this is the public_id (UUID); for legacy Sauron sessions it is the numeric session id. Defaults to '-1' when no support session is associated (non-Chat FUP sources).
    lineage:
      - datalake_satisfaction_rating.satisfaction_answers.id_support_session
  sk_case:
    description: Salesforce case unique identifier for the satisfaction response.
    lineage:
      - datalake_satisfaction_rating.satisfaction_answers.id_case
  sk_account:
    description: Salesforce account unique identifier for the satisfaction response.
    lineage:
      - datalake_satisfaction_rating.satisfaction_answers.id_account
  sk_trigger:
    description: Salesforce trigger unique identifier for the satisfaction response. Defaults to -1 when no trigger is associated (non-Salesforce sources).
    lineage:
      - datalake_satisfaction_rating.satisfaction_answers.id_trigger
  sk_origin:
    lineage:
      - datalake_satisfaction_rating.satisfaction_answers.id_origin
    description: |
      Crossover key with the originating service of the satisfaction survey. For example: Inspections, Repairs, Keys, etc.
  sk_user:
    description: Identifier of the person who answered the form.
    lineage:
      - datalake_satisfaction_rating.satisfaction_answers.id_respondent
  utm_source:
    description: Origin of the survey dispatch (for example, 'sfmc'). Only populated for Survicate-originated responses; for all other sources, the value is NULL.
    lineage:
      - datalake_satisfaction_rating.satisfaction_answers.utm_source
  utm_medium:
    description: Channel used to send the survey (for example, 'email' or 'whatsapp'). Only populated for Survicate-originated responses; for all other sources, the value is NULL.
    lineage:
      - datalake_satisfaction_rating.satisfaction_answers.utm_medium
  utm_campaign:
    description: Identifier of the campaign responsible for the survey dispatch. Only populated for Survicate-originated responses; for all other sources, the value is NULL.
    lineage:
      - datalake_satisfaction_rating.satisfaction_answers.utm_campaign
  satisfaction_score:
    description: Main satisfaction form responses.
    lineage:
      - datalake_satisfaction_rating.satisfaction_answers.satisfaction_score
  secondary_satisfaction_score:
    description: Secondary satisfaction form responses.
    lineage:
      - datalake_satisfaction_rating.satisfaction_answers.secondary_satisfaction_score
  is_solved:
    description: Boolean flag indicating whether the customer's issue linked to the satisfaction response was marked as solved.
      Populated for Survicate (Salesforce case), Bigfone call, and Chat FUP resolution follow-up responses; NULL for other sources.
    lineage:
      - datalake_satisfaction_rating.satisfaction_answers.is_solved
  ts_submitted:
    description: Date the satisfaction response was submitted.
    lineage:
      - datalake_satisfaction_rating.satisfaction_answers.ts_submitted
  ts_load:
    description: This timestamp indicates when this data was loaded into dw_satisfaction_rating.
  year:
    description: Year referring to the data loading day.
    lineage:
      - datalake_satisfaction_rating.satisfaction_answers.year
  month:
    description: Month referring to the data loading day.
    lineage:
      - datalake_satisfaction_rating.satisfaction_answers.month
  day:
    description: Day referring to the data loading day.
    lineage:
      - datalake_satisfaction_rating.satisfaction_answers.day
