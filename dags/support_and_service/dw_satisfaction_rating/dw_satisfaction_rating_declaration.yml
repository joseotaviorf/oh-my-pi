dag:
  name: dw_satisfaction_rating
  schedule_start_date: 2021,2,7
  owner: Data SS
  documentation:
    dag_purpose: |
      This data modeling refers to satisfaction data with the services provided by the QuintoAndar group.

workflow:
  type: query_delta
  layer: dw
  custom_schema: satisfaction_rating
  default_extraction_type: incremental
  default_partitions: [year, month, day]
  tables_customization:
    dim_answer:
      z_order_by: [sk_answer, respondent_type]
    fact_analyst_answers:
      z_order_by: [sk_analyst, sk_survey]
    fact_answer:
      z_order_by: [sk_answer, sk_user]

cluster:
  type: custom_cluster
  custom_configurations:
    spark_version: 12.2.x-scala2.12
    driver_node_type_id: m5a.2xlarge
    node_type_id: m5a.2xlarge
    num_workers: 2
    aws_attributes:
      availability: ON_DEMAND