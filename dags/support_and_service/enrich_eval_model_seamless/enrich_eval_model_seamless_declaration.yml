dag:
  name: enrich_eval_model_seamless
  schedule_start_date: 2026, 4, 1
  catchup: false
  owner: Data SS
  documentation:
    dag_purpose: |
      Builds an enrich table to evaluate the seamless offboarding model (contact vs no-contact).
      For SPOC-eligible termination requests, it surfaces whether users actually opened support
      tickets (and how) and joins Emlio users-and-journeys-ml predictions so offline evaluation
      can compare model scores against observed contact behavior.

      Scheduling: dataset-driven only (no cron). The DAG is triggered by Airflow after all
      upstream load tasks listed in `dags/dependencies.yaml` have emitted their
      `:first-run-of-day` datasets for the current logical date.

workflow:
  type: query_delta
  layer: enrich
  custom_schema: eval_model_seamless
  default_extraction_type: full
  default_partitions: []
  tables_customization:
    eval_model_seamless_offboarding:
      z_order_by: [id_contract, id_request, ts_created, tipo_ticket]

cluster:
  type: databricks_16_4_med_general_cluster
  databricks_conn_id: databricks_new_env
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
