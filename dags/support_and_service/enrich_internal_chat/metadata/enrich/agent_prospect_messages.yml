database_name: datalake_internal_chat
table_name: agent_prospect_messages
description: Messages exchanged between agent and prospect via Agents app
domain: Support and Services
owner: gabriel.firmino@quintoandar.com.br
columns:
  id_channel:
    description: Communication channel identifier used to route the message or call in the platform.
    lineage:
      - datalake_internal_chat_clean.internal_chat_messages.id_channel
  id_message:
    description: Identifier for the message referenced by this record.
    lineage:
      - datalake_internal_chat_clean.internal_chat_messages.id_message
  id_user_sender:
    description: ID of the user that sent the message
    lineage:
      - datalake_internal_chat_clean.internal_chat_messages.id_user_external
  id_user_receiver:
    description: ID of the user that received the message
    lineage:
      - datalake_internal_chat_clean.internal_chat_messages.mentions
  changed_turn:
    description: If the message was a 'turn change', meaning if the previous message was sent by the other person
  user_role_sender:
    description: If the user is an agent or a prospect
  message:
    description: Business value representing message on the agent_prospect_messages enrich dataset.
    lineage:
      - datalake_internal_chat_clean.internal_chat_messages.message
  index:
    description: Business value representing index on the agent_prospect_messages enrich dataset.
    lineage:
      - datalake_internal_chat_clean.internal_chat_messages.index
  ts_created:
    description: Timestamp of when the message was sent
    lineage:
      - datalake_internal_chat_clean.internal_chat_messages.ts_created
  ts_last_message:
    description: Timestamp of the last message
  month:
    description: Month partition for incremental loading and partition pruning.
    lineage: []
  year:
    description: Year partition for incremental loading and partition pruning.
    lineage: []
  day:
    description: Day partition for incremental loading and partition pruning.
    lineage: []
  chat_type:
    description: Business value representing chat type on the agent_prospect_messages enrich dataset.
    lineage: []
