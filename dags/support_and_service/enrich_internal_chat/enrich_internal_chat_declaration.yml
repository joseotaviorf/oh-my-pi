dag:
  name: enrich_internal_chat
  schedule_start_date: 2024, 8, 1
  owner: Data SS
  documentation:
    dag_purpose: |
      DAG that contains enrich table for data regarding communication via the internal 5A chat platform

workflow:
  type: query_delta
  layer: enrich
  default_extraction_type: incremental
  default_partitions: ["year", "month", "day"]

cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: m7g.xlarge
    node_type_id: m7g.xlarge
    spark_version: 13.3.x-scala2.12
    num_workers: 2
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
  databricks_conn_id: databricks_new
