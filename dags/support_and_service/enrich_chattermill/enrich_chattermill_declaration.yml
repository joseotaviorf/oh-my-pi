dag:
  name: enrich_chattermill
  schedule_start_date: 2019, 3, 1
  owner: Data SS
  documentation:
    dag_purpose: |
      Prepares Chattermill information for business utilization. Chattermill is an external service that does unified
      customer feedback analytics. In our case, we mostly use it to process NPS data.
workflow:
  type: query
  layer: enrich
cluster:
  type: databricks_13_3_min_io-general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
