database_name: dw_tracksale
table_name: fact_nps_dispatches
description:
  "Table with metrics related to NPS dispatches, which are campaign surveys
  sent to a customer (usually daily). Each line is a dispatch to an unique customer."
domain: Support and Services
owner: ae-ss@quintoandar.com.br
columns:
  sk_nps_dispatch:
    lineage:
      - datalake_tracksale.customer_conversions.id_dispatch
      - datalake_casa_mineira_tracksale.customer_conversions.id_dispatch
    description: "Key of each individual NPS dispatch to a customer in a campaign."
  sk_nps_dispatch_lot:
    lineage:
      - datalake_tracksale.customer_conversions.id_dispatch
      - datalake_casa_mineira_tracksale.customer_conversions.id_dispatch
    description:
      "Key of daily dispatch of a NPS campaign, which cointains multiple
      customers."
  sk_nps_campaign:
    lineage:
      - datalake_tracksale.dispatch.id_campaign
      - datalake_casa_mineira_tracksale.dispatch.id_campaign
    description:
      "Key of the NPS campaign from which the dispatch was sent to target
      customers."
  sk_nps_customer:
    lineage:
      - datalake_tracksale.customer_conversions.id_customer
      - datalake_casa_mineira_tracksale.customer_conversions.id_customer
    description:
      "Key of NPS customer in a dispatch. Formed by the three contact info
      availables: email, phone and name, if provided."
  sk_user:
    lineage:
      - datalake_tracksale.answer_tags.tag_value
      - datalake_casa_mineira_tracksale.answer_tags.tag_value
      - datalake_ebdb_customer_contact_identification.customer_contact_identification.id_user
    description:
      "User ID of the NPS customer, when they are registered in QuintoAndar
      with EBDB login. Provided by dispatch database and completed by model whenever
      possible."
  sk_personal_document:
    lineage:
      - datalake_tracksale.customer_conversions.id_dispatch
      - datalake_casa_mineira_tracksale.customer_conversions.id_dispatch
      - datalake_ebdb_customer_contact_identification.customer_contact_identification.id_user
    description:
      "Personal document of the NPS customer (CPF or CNPJ), when they are
      registered in QuintoAndar with EBDB login. Provided by dispatch database and
      completed by model whenever possible."
  sk_nps_answer:
    lineage:
      - datalake_tracksale.customer_conversions.id_answer
      - datalake_casa_mineira_tracksale.customer_conversions.id_answer
    description:
      "Key of the NPS answer from the customer in each dispatch (the last
      if multiple, which is rare)."
  sk_house_listing:
    lineage:
      - datalake_nps_answer_drivers.answer_drivers.id_house_listing
    description:
      "House listing ID of the NPS customer, if provided in the dispatch
      database. This data is available only if customer has answered survey."
  sk_booking:
    lineage:
      - datalake_nps_answer_drivers.answer_drivers.id_booking
    description:
      "Booking ID of the NPS customer, if provided in the dispatch database.
      This data is available only if customer has answered survey."
  sk_tta:
    lineage:
      - datalake_nps_answer_drivers.answer_drivers.id_tta
    description:
      "Talk to agent ID of the NPS customer, if provided in the dispatch
      database. This data is available only if customer has answered survey."
  sk_offer:
    lineage:
      - datalake_nps_answer_drivers.answer_drivers.id_offer_context
    description:
      "Offer ID of the NPS customer, if provided in the dispatch database.
      This data is available only if customer has answered survey."
  sk_contract:
    lineage:
      - datalake_nps_answer_drivers.answer_drivers.id_contract
    description:
      "Contract ID of the NPS customer, if provided in the dispatch database.
      This data is available only if customer has answered survey."
  sk_last_rent_event:
    lineage:
      - datalake_rent_demand_events.rent_demand_events.id_event
    description:
      "Key of the last Rent event related to the tenant prospect (if the user is one) before the dispatch.
      By using it combined with the sk_last_rent_event_type key, is possible to find out the last event of the user (if it's a tenant prospect).
      It joins with column dw_rent.fact_rent_demand_events.sk_event"
  sk_last_rent_event_type:
    lineage:
      - datalake_rent_demand_events.rent_demand_events.id_event_type
    description:
      "Key of the last Rent event type related to the tenant prospect (if the user is one) before the dispatch, in order to understand which type of event it is.
      By using it combined with the sk_last_rent_event key, is possible to find out the last event of the user (if it's a tenant prospect).
      It joins with columndw_rent.fact_rent_demand_events.sk_event_type"
  sk_created_date:
    lineage:
      - datalake_tracksale.dispatch.ts_created
      - datalake_casa_mineira_tracksale.dispatch.ts_created
    description: "Key of the date in which the NPS survey was dispatched to the customers."
  sk_sent_date:
    lineage:
      - datalake_tracksale.dispatch_attributes.dispatch_time
      - datalake_casa_mineira_tracksale.dispatch_attributes.dispatch_time
    description: "Key of the date in which the NPS survey was dispatched to the customers."
  sk_answered_date:
    lineage:
      - datalake_tracksale.answer.ts_answer_sent_local
      - datalake_casa_mineira_tracksale.answer.ts_answer_sent_local
    description:
      "Key of the date in which the NPS customer has answered the survey,
      if they decided to do so."
  sk_last_rent_event_date:
    lineage:
      - datalake_rent_demand_events.rent_demand_events.ts_event
    description: "Key of the date in which happened the last Rent event of the tenant prospect (if the user is one) before the dispatch."
  score:
    lineage:
      - datalake_tracksale.answer.nps_answer
      - datalake_casa_mineira_tracksale.answer.nps_answer
    description:
      "Score provided in the NPS customer's answer, which ranges in integers
      from 0 to 10."
  minutes_response_time:
    lineage:
      - datalake_tracksale.answer.seconds_spent_answering
      - datalake_casa_mineira_tracksale.answer.seconds_spent_answering
    description:
      "Time in minutes spent by the customer to answer the survey, when
      they decided to do so."
  dispatch_status:
    lineage:
      - datalake_tracksale.dispatch_attributes.status
      - datalake_casa_mineira_tracksale.dispatch_attributes.status
    description: "Dispatch current status."
    categories:
      Em rota de entrega: "Dispatch in route to be delivered."
      Email não entregue: "Email couldn't be delivered."
      Enviado: "Dispatch was sent."
      Erro ao enviar: "Error when sending the dispatch."
      Na fila para envio: "Dispatch is in queue to be sent."
      Não enviado: "Dispatch not sent."
      Não enviado (Unsubscribed): "Dispatch wasn't sent due to user be unsubscribed."
      Não enviado (destinatário inválido): "Dispatch wasn't sent due to invalid recipient."
      Não enviado (falha da operadora): "Dispatch wasn't sent due to operator failure."
      Não enviado (filtro anti-flood): "Dispatch wasn't sent due to anti-flood filter."
      Não enviado (fora de área de cobertura): "Dispatch wasn't sent because it's out of area."
      Não enviado (prefixo/número inválido): "Dispatch wasn't sent because the prefix/phone number is invalid."
      Não enviado (regra da noventena): "Dispatch wasn't sent due novena rule."
      Não enviado (rejeitado pela operadora): "Dispatch wasn't sent because it was rejected by the operator."
      Não enviado (tempo de envio da operadora expirado): "Dispatch wasn't sent because the shipping time has expired."
      Pesquisa vencida: "Expired survey."
      Reminder enviado: "Reminder sent."
      Reminder não enviado (tempo limite estourado): "Reminder not sent (timeout overflowed)."
  city:
    lineage:
      - datalake_tracksale.answer_cities.city
      - datalake_casa_mineira_tracksale.answer_cities.city
    description: "City referring to the respondent."
  is_survey_opened:
    lineage:
      - datalake_tracksale.dispatch_attributes.survey_opened
      - datalake_casa_mineira_tracksale.dispatch_attributes.survey_opened
    description: "Boolean indicating if the user has opened the survey."
  is_pending_survey:
    lineage:
      - datalake_tracksale.dispatch.status
      - datalake_casa_mineira_tracksale.dispatch.status
    description:
      "Flag to indicate whether the dispatch is closed according to it's
      due date set on Tracksale."
  is_answered:
    lineage:
      - datalake_tracksale.customer_conversions.id_answer
      - datalake_casa_mineira_tracksale.customer_conversions.id_answer
    description:
      "Flag to indicate whether the dispatch was answered by the customer
      until table update date (yesterday)."
  has_comment:
    lineage:
      - datalake_tracksale.answer.nps_comment
      - datalake_casa_mineira_tracksale.answer.nps_comment
    description:
      "Flag to indicate whether the answer has comments. This is an optional
      custom field that might or not be provided by customer."
  is_customer_identified:
    lineage:
      - datalake_tracksale.customer_conversions.is_customer_identified
      - datalake_casa_mineira_tracksale.customer_conversions.is_customer_identified
    description: "Boolean indicating if the customer could be identified."
  ts_load:
    description: "Timestamp of data load into our systems."
