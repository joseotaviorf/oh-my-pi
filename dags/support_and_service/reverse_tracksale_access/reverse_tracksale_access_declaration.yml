dag:
  name: reverse_tracksale_access
  schedule_start_date: 2026,8,11
  owner: Data Engineering
  documentation:
    dag_purpose: |
      Sends Tracksale reverse tables loaded by reverse_tracksale_test to the Tracksale API
      via load_targets_into_tracksale. Source database: reverse_tracksale_test (custom schema
      tracksale_test). Campaign settings come from the environment conf (forno uses test
      campaign 242; prod uses the production campaign code).

      Dispatch rules (reference_date = reverse table partition day; execution_date =
      CURRENT_DATE when the Spark job runs):

      1. Future date — if reference_date > execution_date, do not schedule or POST.
         Emit a warning that the date is later than the maximum available data date.
      2. Same-day or backfill — if reference_date <= execution_date, select rows with
         is_dispatched = FALSE on that partition, then apply same-campaign 24h dedup per
         customer:
         - Skip when ts_dispatched is within the last 24 hours on any partition of this
           campaign table (covers reprocessing different reference_dates on the same day).
         - If ts_dispatched is unavailable, fall back to is_dispatched = TRUE on the
           execution_date and previous-day partitions.
         - Skipped customers stay is_dispatched = FALSE on the reference partition (retry later)
           and are logged as warnings on backfills.
         - Customers not in the 24h window are POSTed normally.
      3. After a successful POST, set is_dispatched = TRUE and ts_dispatched =
         current_timestamp() on the reference_date partition (ts_dispatched is null on load).
         The marking is retried before the task gives up, and every outcome is recorded in
         datalake_sst_metrics.api_logs.
      4. Recovery — the targets stay is_dispatched = FALSE when the marking fails, so an
         Airflow task retry would re-POST them. Before sending, the job looks for an already
         accepted dispatch (status_code 200) for this campaign, table and partition in
         api_logs within the last 24h: when it finds one, it skips the POST and only retries
         the marking, so customers are never sent twice.
      5. Schedule window — backfills (reference_date < execution_date) resolve schedule_time
         from the execution day so Tracksale never receives a past window; same-day runs use
         reference_date. After the campaign trigger hour UTC, schedule moves to the next day.
workflow:
  layer: reverse
  type: access
  load_spark_job: load_targets_into_tracksale
  # The reference date is the partition day (year/month/day) on the reverse table. This dag is
  # dataset-triggered by reverse_tracksale_test, so it inherits that dag's data_interval_start
  # (D-1, itself inherited from the daily DW dags); adding one day aligns with the load DAG
  # date params (cohort day formerly read from CURRENT_DATE in the legacy queries).
  spark_job_arguments:
  - "{dag_name}"
  - "reverse_tracksale_test"
  - "{table_name}"
  - "{{ get_date_param(dag_run, macros.ds_add(data_interval_start | ds, 1), 'load_start_date') }}"
  tables_customization:
    buyer_end_of_process: {}
    lost_buyer_proposals: {}
    lost_buyer_visits: {}
    lost_iq: {}
    lost_pp: {}
    lost_seller_unpublished: {}
    seller_end_of_process: {}
    true_buyer_ccv: {}
    true_buyer_ccv_central: {}
    true_buyer_ccv_hub: {}
    true_offboarding_iq: {}
    true_offboarding_pp: {}
    true_onboarding_iq: {}
    true_onboarding_pp: {}
    true_ongoing_iq: {}
    true_ongoing_pp: {}
    true_seller_ccv: {}
    true_seller_ccv_central: {}
    true_seller_ccv_hub: {}
