database_name: datalake_bigfone
table_name: reservations
description:
  Table that consolidates every reservation event that happened for every Call. A reservation
  is an assignment of a support analyst to a call from a customer.
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  id_task:
    lineage:
      - datalake_bigfone_clean.event.id_task
    description: Task ID from Twilio
  id_call:
    lineage:
      - datalake_bigfone_clean.event.id_call
    description: Call ID from Twilio
  id_reservation:
    lineage:
      - datalake_bigfone_clean.event.id_reservation
    description: Reservation ID from Twilio
  id_queue:
    lineage:
      - datalake_bigfone_clean.event.id_queue
    description: Queue ID from Twilio
  id_worker:
    lineage:
      - datalake_bigfone_clean.event.id_worker
    description: Worker ID from Twilio
  twilio_sid:
    lineage:
      - datalake_bigfone_clean.event.twilio_sid
    description: Either a call ID or a task ID, depending if it is an inbound or outbound call
  direction:
    lineage:
      - datalake_bigfone_clean.event.direction
    description: Defines if the call is inbound or outbound
  channel_type:
    lineage:
      - datalake_bigfone_clean.event.channel_type
    description: Channel where the call originated from
  bpo_name:
    lineage:
      - datalake_bigfone_clean.event.bpo_name
    description: BPO responsible for handling the call
  queue_name:
    lineage:
      - datalake_bigfone_clean.event.queue_name
    description: Name of the queue assigned to the call
  worker_email:
    lineage:
      - datalake_bigfone_clean.event.worker_email
    description: Email of the worker who handled the call
  from_phone_number:
    lineage:
      - datalake_bigfone_clean.event.from_phone_number
    description: Phone number the call originated from
  to_phone_number:
    description: Phone number the call was made to
  is_answered:
    description: Boolean indicating if the call was answered by a worker
  is_timeout:
    description: Boolean indicating if there was a timeout on a worker assignment
  is_rejected:
    description: Boolean indicating if the call was rejected by a worker
  is_canceled:
    description: Boolean indicating if the call was canceled
  ts_created:
    lineage:
      - datalake_bigfone_clean.event.ts_created
    description: Timestamp of when the reservation was created
