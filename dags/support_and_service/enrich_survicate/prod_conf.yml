---
dag_documentation:
  dag_purpose: Transform survey response collected from [Survicate](https://developers.survicate.com/data-export/#get-the-list-of-surveys).
custom_cluster:
  driver_node_type_id: m5a.2xlarge
  node_type_id: m5a.xlarge
  autoscale:
    max_workers: 3
    min_workers: 1

partitions: ["year", "month", "day"]

inner_dependencies:
  inspections_surveys:
    - response_content
    - survey_responses
  keys_surveys:
    - response_content
    - survey_responses
  lockbox_surveys:
    - response_content
    - survey_responses
  photo_surveys:
    - response_content
    - survey_responses
  repairs_surveys:
    - response_content
    - survey_responses
  scheduling_surveys:
    - response_content
    - survey_responses
  zendesk_email_surveys:
    - response_content
    - survey_responses
