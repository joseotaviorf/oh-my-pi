---
database_name: datalake_survicate
table_name: keys_surveys
description: Responses to key service forms
domain: Support and Services
owner: data-ae-ss@quintoandar.com.br
columns:
  id_answer:
    lineage:
      - datalake_survicate.response_content.id_response
    description: Answer unique identifier (uuid)
  id_survey:
    lineage:
      - datalake_survicate.survey_responses.id_survey
    description: Survey unique identifier
  id_respondent:
    lineage:
      - datalake_survicate.survey_responses.id_respondent
    description: Survey unique identifier
  id_contract:
    lineage:
      - datalake_survicate.survey_responses.response_url
    description: Contract unique identifier
  id_ticket:
    lineage:
      - datalake_survicate.survey_responses.response_url
    description: Zendesk ticket unique identifier
  email:
    lineage:
      - datalake_survicate.survey_responses.response_url
    description: Respondent's email
  survey_name:
    lineage:
      - datalake_survicate.survey_responses.survey_name
    description: Descriptive information indicating the name of the submitted survey.
  respondent_type:
    description:
      "Respondent role/type, for example: owner, tenant, surveyor, photographer,
      broker"
  service_type:
    description:
      "For which flow/service we are evaluating satisfaction. For example:
      inspections, repairs, customer support, etc."
  survey_type:
    description:
      "For which context are we evaluating satisfaction. Here we can refer
      to the journey, for example: onboarding, offboarding. Or we can refer to the
      related microservice, for example: lockbox."
  survey_source:
    description: Data source
  satisfaction_rating:
    lineage:
      - datalake_survicate.response_content.answer_content
      - datalake_gsheets_clean.tenant_onboarding_keys_csat.score
      - datalake_gsheets_clean.owner_offboarding_keys_csat.score
    description: Main satisfaction response score
  score_description:
    description: Main satisfaction response description
  improvement_tags:
    lineage:
      - datalake_survicate.response_content.answer_content
      - datalake_gsheets_clean.tenant_onboarding_keys_csat.improvement_tags
      - datalake_gsheets_clean.owner_offboarding_keys_csat.improvement_tags
    description: Predefined tags to categorize respondent satisfaction
  user_comment:
    lineage:
      - datalake_survicate.response_content.answer_content
      - datalake_gsheets_clean.tenant_onboarding_keys_csat.comments
      - datalake_gsheets_clean.owner_offboarding_keys_csat.comments
    description: Respondent open comment
  ts_first_response:
    lineage:
      - datalake_survicate.response_content.ts_collected
      - datalake_gsheets_clean.tenant_onboarding_keys_csat.ts_input
      - datalake_gsheets_clean.owner_offboarding_keys_csat.ts_input
    description: Date and time of first time visitor responded to a survey
  year:
    lineage:
      - datalake_survicate.response_content.year
      - datalake_gsheets_clean.tenant_onboarding_keys_csat.ts_input
      - datalake_gsheets_clean.owner_offboarding_keys_csat.ts_input
    description: Year of response submission date
  month:
    lineage:
      - datalake_survicate.response_content.month
      - datalake_gsheets_clean.tenant_onboarding_keys_csat.ts_input
      - datalake_gsheets_clean.owner_offboarding_keys_csat.ts_input
    description: Month of response submission date
  day:
    lineage:
      - datalake_survicate.response_content.day
      - datalake_gsheets_clean.tenant_onboarding_keys_csat.ts_input
      - datalake_gsheets_clean.owner_offboarding_keys_csat.ts_input
    description: Day of response submission date
