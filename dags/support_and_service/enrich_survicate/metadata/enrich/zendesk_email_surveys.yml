---
database_name: datalake_survicate
table_name: zendesk_email_surveys
description: Responses to service forms in the context of customer service by Zendesk via email.
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  id_survey:
    lineage:
      - datalake_survicate.response_content.id_survey
    description: Survey unique identifier
  id_ticket:
    lineage:
      - datalake_survicate.survey_responses.response_url
    description: Zendesk ticket unique identifier
  id_visitor:
    lineage:
      - datalake_survicate.survey_responses.id_respondent
    description: Visitor unique identifier. Visitor is a person responding to a survey.
  response_uuid:
    lineage:
      - datalake_survicate.response_content.response_uuid
    description: Response unique identifier (uuid).
  visitor_uuid:
    lineage:
      - datalake_survicate.survey_responses.id_respondent
    description:
      Visitor unique identifier (uuid). Visitor is a person responding
      to a survey.
  survey_name:
    description: Descriptive information indicating the name of the submitted survey.
    lineage:
      - datalake_survicate_clean.surveys.survey_name
  user_comment:
    lineage:
      - datalake_survicate.response_content.answer_content
    description: Respondent open comment
  csat_score:
    lineage:
      - datalake_survicate.response_content.answer_content
    description: Satisfaction response score
  is_solved:
    lineage:
      - datalake_survicate.response_content.answer_content
    description: The problem was solved
  ts_first_response:
    lineage:
      - datalake_survicate.response_content.ts_collected
    description: Date and time of first time visitor responded to a survey
  dt_load:
    description: Data loading date into the datalake
  year:
    lineage:
      - datalake_survicate.response_content.year
    description: Year of response submission date
  month:
    lineage:
      - datalake_survicate.response_content.month
    description: Month of response submission date
  day:
    lineage:
      - datalake_survicate.response_content.day
    description: Day of response submission date
