---
database_name: datalake_survicate
table_name: salesforce_surveys
description: >
  One row per Survicate survey response linked to a Salesforce case. Enriches
  survey feedback with the corresponding Salesforce case identifier for CRM analytics.
  Source system is Survicate.
domain: Support and Services
owner: gabriel.firmino@quintoandar.com.br
columns:
  id_survey:
    lineage:
      - datalake_survicate.survey_responses.id_survey
    description: Survey unique identifier created by Survicate
  id_case:
    lineage:
      - datalake_survicate.survey_responses.response_url
    description: Salesforce case unique identifier
  id_account:
    lineage:
      - datalake_survicate.survey_responses.response_url
    description: Salesforce account unique identifier
  id_respondent:
    lineage:
      - datalake_survicate.survey_responses.id_respondent
    description: Respondent unique identifier, generated by Survicate
  response_uuid:
    lineage:
      - datalake_survicate.response_content.id_response
    description: Response unique identifier (uuid)
  survey_name:
    lineage:
      - datalake_survicate.survey_responses.survey_name
    description: Survey title of the submitted survey
  user_comment:
    lineage:
      - datalake_survicate.response_content.answer_content
    description: Respondent open comment from text questions
  csat_score:
    lineage:
      - datalake_survicate.response_content.answer_content
    description: Customer satisfaction score (1-5) from rating or smiley_scale questions
  is_solved:
    lineage:
      - datalake_survicate.response_content.answer_content
    description: Whether the case was reported as solved by user (from single choice question)
  ts_first_response:
    lineage:
      - datalake_survicate.response_content.ts_collected
    description: Date and time of first time respondent answered the survey
  dt_load:
    lineage:
      - datalake_survicate.response_content.dt_load
    description: Data loading date into the datalake
  year:
    lineage:
      - datalake_survicate.response_content.year
    description: Year of response submission date
  month:
    lineage:
      - datalake_survicate.response_content.month
    description: Month of response submission date
  day:
    lineage:
      - datalake_survicate.response_content.day
    description: Day of response submission date
