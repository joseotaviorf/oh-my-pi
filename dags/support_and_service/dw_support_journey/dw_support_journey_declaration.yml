dag:
  name: dw_support_journey
  schedule_start_date: 2026, 6, 14
  owner: Data SS
  criticality: High
  sla_deadline_localtime: "08:00"
  documentation:
    dag_purpose: |
      DW layer for the Support Journey domain, modeling human customer service on
      Salesforce Service Cloud. Part of the Single Station consolidation that
      deprecates Zendesk and reframes the legacy "Ticket" concept into Salesforce
      Cases and Tasks (the successor analytical model to dw_customer_support).
      Builds fact_requests from the core_support_journey.cases core model, one row
      per support case event version, preserving SCD history via the
      ts_effective / ts_expired validity window (is_current flags the active version).
      Also builds dim_analyst from core_support_journey.analyst (Salesforce User CDC),
      one row per analyst event version, with the same SCD window so cases can be
      attributed to the analyst who owned them at a given instant.

workflow:
  type: query_delta
  layer: dw
  custom_schema: support_journey
  default_extraction_type: incremental
  default_partitions: []
  tables_customization:
    fact_requests:
      criticality: Critical
      z_order_by: [sk_case, case_number]
      merge_on: [sk_event]
    fact_services:
      criticality: Critical
      z_order_by: [sk_session, sk_task]
      merge_on: [sk_event]
    dim_record_type:
      merge_on: [sk_record_type]
    dim_analyst:
      z_order_by: [sk_analyst]
      merge_on: [sk_event]
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start.strftime('%Y-%m-%d %H:%M:%S'), 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_end.strftime('%Y-%m-%d %H:%M:%S'), 'load_end_date') }}"
