dag:
  name: reverse_birdie_access
  schedule_start_date: 2025, 3, 18
  owner: Data SS
  documentation:
    dag_purpose: This dag aims to send feedback data from our users to Birdie.
workflow:
  layer: reverse
  type: access
  load_spark_job: load_into_birdie_api
  spark_job_arguments:
  - "{dag_name}" 
  - "reverse_birdie"
  - "{table_name}"
  - "{{ ds }}"
  tables_customization:
    dsat_bot:
      extra_spark_job_arguments:
      - "feedbacks"
      - "audience/accounts"
      - "https://api.birdie.ai/ingestion"
    dsat_customer_relationship:
      extra_spark_job_arguments:
      - "feedbacks"
      - "audience/accounts"
      - "https://api.birdie.ai/ingestion"
    dsat_visits:
      extra_spark_job_arguments:
      - "feedbacks"
      - "audience/accounts"
      - "https://api.birdie.ai/ingestion"
    end_of_process:
      extra_spark_job_arguments:
      - "feedbacks"
      - "audience/accounts"
      - "https://api.birdie.ai/ingestion" 
    dsat_new_surveys:
      extra_spark_job_arguments:
      - "feedbacks"
      - "audience/accounts"
      - "https://api.birdie.ai/ingestion"
    dsat_diligence:
      extra_spark_job_arguments:
      - "feedbacks"
      - "audience/accounts"
      - "https://api.birdie.ai/ingestion"
    dsat_financing:
      extra_spark_job_arguments:
      - "feedbacks"
      - "audience/accounts"
      - "https://api.birdie.ai/ingestion"
    lost:
      extra_spark_job_arguments:
      - "feedbacks"
      - "audience/accounts"
      - "https://api.birdie.ai/ingestion"
    new_surveys:
      extra_spark_job_arguments:
      - "feedbacks"
      - "audience/accounts"
      - "https://api.birdie.ai/ingestion"
cluster:
  type: databricks_12_2_med_2xlarge_general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
