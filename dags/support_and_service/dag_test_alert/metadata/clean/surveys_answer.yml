description: "Clean version of the surveys_answer table"
domain: Support and Services
owner: data-ae-ss@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_chat_fup_raw.surveys_answer.id
    description: "Unique identifier for each survey answer"
  is_solved:
    lineage:
      - datalake_chat_fup_raw.surveys_answer.solved
