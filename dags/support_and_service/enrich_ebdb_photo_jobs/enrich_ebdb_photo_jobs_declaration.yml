dag:
    name: enrich_ebdb_photo_jobs
    schedule_start_date: 2020, 7, 1
    owner: Data SS
    documentation:
        dag_purpose: |
            Creates enriched tables for the context `Photo Jobs` of ebdb, like inspection and photo_job.
        additional_information: |
            Partitioned by `country_code`.
workflow:
    type: query_delta
    layer: enrich
    tables_customization:
        photo_job:
            partitions: [country_code]
cluster:
    type: custom_cluster
    custom_configurations:
        driver_node_type_id: r5a.xlarge
        node_type_id: r5a.2xlarge
        num_workers: 3
        spark_version: 12.2.x-scala2.12
