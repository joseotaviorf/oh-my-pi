dag:
  name: enrich_hefesto
  schedule_start_date: 2024, 4, 7
  owner: Data SS
  documentation:
    dag_purpose: Creates Hefesto enrich tasks.
workflow:
  type: query_delta
  layer: enrich
cluster:
  type: databricks_13_3_med_mem_driver_min_memory_2_nodes_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
