---
dag_documentation:
  dag_purpose: |
    This is the third layer of the enrichment phase of the Zendesk data preparation.
    Zendesk is responsible for the tickets of the customer services.
custom_cluster:
  driver_node_type_id: r5d.4xlarge
  node_type_id: r5d.4xlarge
  num_workers: 4
  spark_version: 10.4.x-scala2.12
  runtime_engine: PHOTON
  aws_attributes:
    ebs_volume_size: 200
  spark_conf:
    # This heuristic is based on the idea of having a balanced workload across the available resources
    spark.sql.shuffle.partitions: "256"
