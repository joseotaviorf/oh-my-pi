database_name: datalake_zendesk_ticket_funnels
table_name: tickets_funnel_metrics
description:
    The main purpose of this table is to concentrate ticket-related metrics data.
    The granularity of this table is the tickets, and the main concentrated data are metrics, identifiers and important dates for the ticket.
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  id_ticket:
    lineage:
      - datalake_zendesk_tickets.ticket_measurements.id_ticket
    description: Ticket's unique identifier.
  id_contract:
    lineage:
      - datalake_zendesk_tickets.ticket_measurements.id_contract
    description: The respective contract associated with the Zendesk Ticket.
  id_user:
    lineage:
      - datalake_zendesk_tickets.zendesk_users_contact.id_user
    description:
      This is the unique identifier associated with a Zendesk ticket for a user
      registered in the main system (ebdb).
  id_personal_document:
    lineage:
      - datalake_zendesk_tickets.zendesk_users_contact.id_personal_document
    description: Unique identifier of the user's document, based on the CPF.
  id_zendesk_requester_user:
    lineage:
      - datalake_zendesk_tickets.ticket_measurements.id_zendesk_requester_user
    description: Key of the user who asks for support through the ticket. Usually
      the requester is a customer, but requesters can also be agents
  id_zendesk_submitter_user:
    lineage:
      - datalake_zendesk_tickets.ticket_measurements.id_zendesk_submitter_user
    description: Key of the user who created a ticket. The submitter always becomes
      the author of the first comment on the ticket
  id_zendesk_assignee_user:
    lineage:
      - datalake_zendesk_tickets.ticket_measurements.id_zendesk_assignee_user
    description: The agent currently assigned to act upon the ticket
  id_session:
    lineage:
      - datalake_zendesk_tickets.ticket_measurements.id_session
    description: Sauron's session ID
  id_call:
    lineage:
      - datalake_zendesk_tickets.ticket_measurements.id_call
    description: Unique identifier of the contact attempt.
  user_name:
    lineage:
      - datalake_zendesk_tickets.zendesk_users_contact.user_name
    description: Name of the user who requested assistance.
  total_group_stations:
    lineage:
      - datalake_zendesk_tickets.ticket_measurements.total_group_stations
    description: Number of groups this ticket passed through.
  total_assignee_stations:
    lineage:
      - datalake_zendesk_tickets.ticket_measurements.total_assignee_stations
    description: Number of assignees this ticket had.
  minutes_reply_calendar:
    lineage:
      - datalake_zendesk_tickets.ticket_measurements.minutes_reply_calendar
    description: 
      Number of minutes to the reply out of business hours. Corresponds
      to the duration between ticket creation and the public agent reply on
      the ticket.
  minutes_reply_business:
    lineage:
      - datalake_zendesk_tickets.ticket_measurements.minutes_reply_business
    description: Number of minutes to the reply inside of business hours. Corresponds
      to the duration between ticket creation and the public agent reply on
      the ticket.
  minutes_first_resolution_calendar:
    lineage:
      - datalake_zendesk_tickets.ticket_measurements.minutes_first_resolution_calendar
    description: 
      Number of minutes to the first resolution out of business hours.
      Corresponds to the duration between ticket creation and it was initially moved
      to solved status.
  minutes_first_resolution_business:
    lineage:
      - datalake_zendesk_tickets.ticket_measurements.minutes_first_resolution_business
    description: 
      Number of minutes to the first resolution inside of business hours.
      Corresponds to the time between ticket creation time and the time when the ticket
      was initially moved to solved status
  minutes_requester_wait_calendar:
    lineage:
      - datalake_zendesk_tickets.ticket_measurements.minutes_requester_wait_calendar
    description: 
      Number of minutes to the requester wait time out of business hours.
      Corresponds to the total combined time ticket was in the new, open, and on-hold
      statuses.
  minutes_requester_wait_business:
    lineage:
      - datalake_zendesk_tickets.ticket_measurements.minutes_requester_wait_business
    description:
      The first response time metric represents the amount of time a ticket requester
      has waited for a response from an agent or the time between when the ticket was
      created and when the first public comment is added to the ticket during business
      hours. The time is measured in minutes and only includes business hours. This
      metric can be used to monitor response time SLAs and to identify tickets that
      have been waiting for a response for too long.
  minutes_agent_wait_calendar:
    lineage:
      - datalake_zendesk_tickets.ticket_measurements.minutes_agent_wait_calendar
    description: 
      Number of minutes to the agent wait time out of business hours. Corresponds
      to the total combined time ticket was in the pending status.
  minutes_agent_wait_business:
    lineage:
      - datalake_zendesk_tickets.ticket_measurements.minutes_agent_wait_business
    description: 
      Number of minutes to the agent wait time inside of business hours.
      Corresponds to the total combined time ticket was in the pending status.
  minutes_on_hold_calendar:
    lineage:
      - datalake_zendesk_tickets.ticket_measurements.minutes_on_hold_calendar
    description: 
      Number of minutes to the on hold time out of business hours. Corresponds
      to the total combined time ticket was in the on-hold status.
  minutes_on_hold_business:
    lineage:
      - datalake_zendesk_tickets.ticket_measurements.minutes_on_hold_business
    description: 
      Number of minutes to the on hold time inside of business hours. Corresponds
      to the total combined time ticket was in the on-hold status.
  minutes_full_resolution_calendar:
    lineage:
      - datalake_zendesk_tickets.ticket_measurements.minutes_full_resolution_calendar
    description:
      The total time in minutes from the moment a ticket is created to the moment it is
      resolved, taking into account all calendar time (including weekends and holidays).
  minutes_full_resolution_business:
    lineage:
      - datalake_zendesk_tickets.ticket_measurements.minutes_full_resolution_business
    description:
      The total time in minutes from the moment a ticket is created to the moment it is
      resolved, only taking into account business hours (excluding weekends and holidays).
      This metric is useful for understanding how quickly tickets are resolved during
      standard business hours.
  reopens:
    lineage:
      - datalake_zendesk_tickets.ticket_measurements.reopens
    description: The number of times the ticket was reopened after it was first marked as solved.
  replies:
    lineage:
      - datalake_zendesk_tickets.ticket_measurements.replies
    description:
      The total number of public replies made by agents on the ticket, including the
      initial agent reply.
  ts_created:
    lineage:
      - datalake_zendesk_tickets.ticket_measurements.ts_created
    description: The creation date of the ticket.
  ts_created_local:
    lineage:
      - datalake_zendesk_tickets.ticket_measurements.ts_created_local
    description: The creation date of the ticket in UTC-3.
  ts_solved:
    lineage:
      - datalake_zendesk_tickets.ticket_measurements.ts_solved
    description: The resolution date of the ticket.
  ts_solved_local:
    lineage:
      - datalake_zendesk_tickets.ticket_measurements.ts_solved_local
    description: The resolution date of the ticket in UTC-3.
  ts_closed:
    lineage:
      - datalake_zendesk_tickets.ticket_measurements.ts_closed
    description: The closure date of the ticket.
  ts_closed_local:
    lineage:
      - datalake_zendesk_tickets.ticket_measurements.ts_closed_local
    description: The closure date of the ticket in UTC-3.
  ts_initially_assigned:
    lineage:
      - datalake_zendesk_tickets.ticket_measurements.ts_initially_assigned
    description:
      The timestamp when a ticket is first assigned to an agent or group. This timestamp
      represents the start of the first agent's response time for the ticket.
  ts_initially_assigned_local:
    lineage:
      - datalake_zendesk_tickets.ticket_measurements.ts_initially_assigned_local
    description:
      The timestamp when a ticket is first assigned to an agent or group. This timestamp
      represents the start of the first agent's response time for the ticket, in UTC-3.
  ts_last_assigned:
    lineage:
      - datalake_zendesk_tickets.ticket_measurements.ts_last_assigned
    description:
      The last assigned timestamp refers to the date and time when the ticket was most
      recently assigned to an agent or group. This timestamp is updated every time the
      ticket is reassigned to a different agent or group. It can be used to track the
      time taken by agents to work on a ticket, as well as to monitor ticket assignment
      patterns and agent workload.
  ts_last_assigned_local:
    lineage:
      - datalake_zendesk_tickets.ticket_measurements.ts_last_assigned_local
    description: 
      The last assigned timestamp refers to the date and time when the ticket was most
      recently assigned to an agent or group. This timestamp is updated every time the
      ticket is reassigned to a different agent or group. It can be used to track the
      time taken by agents to work on a ticket, as well as to monitor ticket assignment
      patterns and agent workload. It is in UTC-3.
  ts_updated:
    lineage:
      - datalake_zendesk_tickets.ticket_measurements.ts_updated
    description: Date when the ticket was updated.
  ts_updated_local:
    lineage:
      - datalake_zendesk_tickets.ticket_measurements.ts_updated_local
    description: Date when the ticket was updated, in UTC-3.
  ts_load:
    description: Timestamp of when the table was last processed.
  year:
    lineage:
      - datalake_zendesk_tickets.ticket_measurements.ts_updated
    description: Data partition in year format, this partition is based on ticket update date.
  month:
    lineage:
      - datalake_zendesk_tickets.ticket_measurements.ts_updated
    description: Data partition in month format, this partition is based on ticket update date.
  day:
    lineage:
      - datalake_zendesk_tickets.ticket_measurements.ts_updated
    description: Data partition in day format, this partition is based on ticket update date.
