database_name: datalake_zendesk_ticket_funnels
table_name: ticket_funnel
description:
  This enrichment table is intended to gather data from each ticket created in Zendesk Support,
  coming from FAQ Forms, Email, Web and Chat channels and Whatsapp notifications
domain: Support and Service
owner: gabriel.firmino@quintoandar.com.br
columns:
  id_ticket:
    lineage:
      - datalake_zendesk_tickets_clean.tickets.id_ticket
    description: Ticket ID from Zendesk
  id_sale_offer:
    lineage:
      - datalake_sale_offer_flows.sale_offer_flows.id_offer
    description: ID from sale_offer_flows assigned to the ticket, if exists
  id_job:
    lineage:
      - datalake_zendesk_custom_fields.custom_fields.custom_fields
    description: ID Job, from a specific custom_field
  id_problem_ticket:
    lineage:
      - datalake_zendesk_custom_fields.custom_fields.custom_fields
    description: Problem ticket linked with the current ticket, if exists. If this is filled, then the ticket is of 'incident' type
  subject:
    lineage:
      - datalake_zendesk_tickets_clean.tickets.subject
    description: Ticket subject
  description:
    lineage:
      - datalake_zendesk_tickets_clean.tickets.description
    description: Ticket description
  ticket_via:
    lineage:
      - datalake_zendesk_tickets_clean.tickets.ticket_via
    description: Ticket via - in which way the ticket was created
  channel:
    lineage:
      - datalake_zendesk_tickets_clean.tickets.ticket_via
      - datalake_zendesk_tickets_clean.tickets.tags
    description: Channel assigned to the ticket
  group_name:
    lineage:
      - datalake_zendesk_tickets_clean.groups.name
    description: Ticket group - department associated with the ticket
  priority:
    lineage:
      - datalake_zendesk_tickets_clean.tickets.priority
    description: Ticket priority from Zendesk
  recipient:
    lineage:
      - datalake_zendesk_tickets_clean.tickets.recipient
    description: Ticket recipient
  tags:
    lineage:
      - datalake_zendesk_tickets_clean.tickets.tags
    description: Tags assigned to the ticket
  status:
    lineage:
      - datalake_zendesk_tickets_clean.tickets.status
    description: Ticket status
  ticket_type:
    lineage:
      - datalake_zendesk_tickets_clean.tickets.type
    description: Descriptive data about the type of ticket.
    categories:
      task: ""
      problem: ""
      question: ""
      incident: ""
  has_public_comments:
    lineage:
      - datalake_zendesk_tickets_clean.tickets.is_public
    description: If the ticket has comments
  score:
    lineage:
      - datalake_zendesk_tickets_clean.tickets.satisfaction_rating
    description: CSAT score for the ticket
  reason:
    lineage:
      - datalake_zendesk_tickets_clean.tickets.satisfaction_rating
    description: Reason for the csat score
  comment:
    lineage:
      - datalake_zendesk_tickets_clean.tickets.satisfaction_rating
    description: Comments on the score given
  custom_fields:
    lineage:
      - datalake_zendesk_custom_fields.custom_fields.custom_fields
    description: All custom_fields attached to the ticket, in JSON format
  request_type:
    lineage:
      - datalake_zendesk_custom_fields.custom_fields.custom_fields
    description: Request type of the ticket, from custom_field 'Tipo de Solicitação'
  agent_organization:
    description: Agent organization, temporary field to filters.
  client_type:
    lineage:
      - datalake_zendesk_custom_fields.custom_fields.custom_fields
    description: Type of client, from custom_fields like 'Tipo de Cliente'
  step_tag:
    lineage:
      - datalake_zendesk_custom_fields.custom_fields.custom_fields
    description: Journey step of the client, from custom_fields
  customer_type_tag:
    lineage:
      - datalake_zendesk_custom_fields.custom_fields.custom_fields
    description: Tag attached to the customer that requested the ticket, also from specific custom_fields
  contact_motivation_tag:
    lineage:
      - datalake_zendesk_custom_fields.custom_fields.custom_fields
    description: Tag attached to the reason the customer opened a ticket, also from specific custom_fields
  contact_theme_detail_tag:
    lineage:
      - datalake_zendesk_custom_fields.custom_fields.custom_fields
    description: Specific custom_fields associated with ticket taxonomy
  contact_theme_tag:
    lineage:
      - datalake_zendesk_custom_fields.custom_fields.custom_fields
    description: Specific custom_fields associated with ticket taxonomy
  ts_created:
    lineage:
      - datalake_zendesk_tickets_clean.tickets.ts_created
    description: Timestamp of when the ticket was created
  ts_created_local:
    lineage:
      - datalake_zendesk_tickets_clean.tickets.ts_created_local
    description: ts_created in UTC-3
  ts_updated:
    lineage:
      - datalake_zendesk_tickets_clean.tickets.ts_updated
    description: Timestamp of when the ticket was updated
  ts_updated_local:
    lineage:
      - datalake_zendesk_tickets_clean.tickets.ts_updated
    description: ts_updated in UTC-3
  year:
    lineage:
      - datalake_zendesk_tickets_clean.tickets.ts_updated
    description: ts_updated year
  month:
    lineage:
      - datalake_zendesk_tickets_clean.tickets.ts_updated
    description: ts_updated month
  day:
    lineage:
      - datalake_zendesk_tickets_clean.tickets.ts_updated
    description: ts_updated day
