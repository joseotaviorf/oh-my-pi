dag:
  name: tracksale_test
  schedule_start_date: 2019, 6, 1
  schedule_interval: 0 2 * * *
  owner: Data SS
  documentation:
    dag_purpose:
      Retrieves data from [Tracksale API](https://github.com/quintoandar/tracksale-api-client-python). Tracksale is an external
      service that monitors in real time the customer's experience. We use it mostly to manage NPS. For further information, 
      please read [this documentation](https://docs.google.com/document/d/15YEa41mdZ2YRUgpKpMNK63sIrHhCSXAYuf2QbW_Df7E).

workflow:
  layer: raw
  type: custom_ingestion
  load_spark_job: load_full_data_into_datalake_raw
  custom_schema: tracksale_test
  spark_job_arguments:
    - "{environment}"
    - "{bucket}"
    - "{dag_name}"
    - "{table_name}"
    - "{{ ds }}"
    
  default_extraction_type: full
  tables_customization:
    campaign:
      load_spark_job: load_full_data_into_datalake_raw
      extraction_type: full
    answer:
      load_spark_job: load_incremental_data_into_datalake_raw
      extraction_type: incremental
      partitions: [year, month, day]
    dispatch:
      load_spark_job: load_incremental_data_into_datalake_raw
      extraction_type: incremental
      partitions: [year, month, day]
cluster:
  type: databricks_12_2_med_general_cluster
  custom_libraries:
    - whl: "{artifacts_bucket}/tracksale-api-client-python/quintoandar_tracksale_api_client-0.3.0-py2.py3-none-any.whl"
