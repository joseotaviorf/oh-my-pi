dag:
  name: dw_terminator
  schedule_start_date: 2024, 05, 28
  owner: Data SS
  documentation:
    dag_purpose: |
      Dag for the purpose of consulting information related to terminations.
workflow:
  type: query_delta
  layer: dw
  custom_schema: terminator
  default_extraction_type: incremental
  default_partitions: [year, month, day]
  extra_query_template_params:
      load_start_date: "{{ get_date_param(dag_run, ds, 'load_start_date') }}"
      load_end_date: "{{ get_date_param(dag_run, ds, 'load_end_date') }}"
cluster:
  type: databricks_12_2_min_general_photon_cluster
