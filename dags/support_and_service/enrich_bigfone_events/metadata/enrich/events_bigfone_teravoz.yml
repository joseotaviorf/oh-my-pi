database_name: datalake_bigfone_events
table_name: events_bigfone_teravoz
description:
  Base responsible for processing event data from the Bigfone microservice intended for calls to Teravoz,
  with the call ID and event ID as the main key.
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  id_event: 
    description: Key that identifies the event.
    lineage:
      - datalake_bigfone_clean.event.id
      - datalake_teravoz_clean.calls.id
  id_call:
    description: Key that identifies the call.
    lineage:
      - datalake_bigfone_clean.event.call_id
      - datalake_bigfone_clean.event.metadata
      - datalake_teravoz_clean.calls.id
  direction: 
    description: Direction of the call.
    lineage:
      - datalake_bigfone_clean.event.metadata
      - datalake_teravoz_clean.calls.call_direction
  seconds_talk_duration: 
    description: Duration of the call in seconds.
    lineage:
      - datalake_teravoz_clean.calls.seconds_talk_duration
  provider: 
    description: Provider of the event.
    lineage:
      - datalake_bigfone_clean.event.provider
  event: 
    description: Event name.
    lineage:
      - datalake_bigfone_clean.event.metadata
      - datalake_teravoz_clean.calls.status
  ts_created: 
    description: Timestamp of the event creation.
    lineage:
      - datalake_bigfone_clean.event.event_timestamp
      - datalake_teravoz_clean.calls.ts_started_local
  ts_created_local: 
    description: Local timestamp of the event creation.
    lineage:
      - datalake_bigfone_clean.event.event_timestamp
      - datalake_teravoz_clean.calls.ts_started_local
  ts_received: 
    description: Timestamp of the event reception.
    lineage:
      - datalake_bigfone_clean.event.received_timestamp
  ts_received_local: 
    description: Local timestamp of the event reception.
    lineage:
      - datalake_bigfone_clean.event.received_timestamp
  year: 
    description: Year of the event.
    lineage:
      - datalake_bigfone_clean.event.year
      - datalake_teravoz_clean.calls.year
  month: 
    description: Month of the event.
    lineage:
      - datalake_bigfone_clean.event.month
      - datalake_teravoz_clean.calls.month
  day: 
    description: Day of the event.
    lineage:
      - datalake_bigfone_clean.event.day
      - datalake_teravoz_clean.calls.day