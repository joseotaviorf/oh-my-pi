database_name: datalake_bigfone_events
table_name: events
description:
  Base responsible for processing event data from the Bigfone microservice intended for calls to Twilio,
  with the call ID and event ID as the main key.
domain: Support and Services
owner: gabriel.firmino@quintoandar.com.br
columns:
  id:
    description: Key that identifies the event.
    lineage:
      - datalake_bigfone_clean.event.id
  event:
    description: Business value representing event on the events enrich dataset.
    lineage:
      - datalake_bigfone_clean.event.event
  id_call:
    description: Key that identifies the call.
    lineage:
      - datalake_bigfone_clean.event.metadata
  metadata:
    description: Structured JSON payload with provider-specific attributes not flattened into columns.
    lineage:
      - datalake_bigfone_clean.event.metadata
  provider:
    description: Telephony provider or integration source that originated the call record.
    lineage:
      - datalake_bigfone_clean.event.provider
  ts_created:
    description: Timestamp of the event creation.
    lineage:
      - datalake_bigfone_clean.event.ts_created
  ts_created_local:
    description: Local timestamp of the event creation.
    lineage:
      - datalake_bigfone_clean.event.ts_created
  ts_received:
    description: Timestamp of the event reception.
    lineage:
      - datalake_bigfone_clean.event.ts_received
  ts_received_local:
    description: Local timestamp of the event reception.
    lineage:
      - datalake_bigfone_clean.event.ts_received
  year:
    description: Year of the event.
    lineage:
      - datalake_bigfone_clean.event.year
  month:
    description: Month of the event.
    lineage:
      - datalake_bigfone_clean.event.month
  day:
    description: Day of the event.
    lineage:
      - datalake_bigfone_clean.event.day
