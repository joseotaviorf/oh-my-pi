---
database_name: datalake_braze
table_name: events_owners
owner: gabriel.firmino@quintoandar.com.br
domain: Support and Services
description: Braze messaging engagement events for the property-owner app group. Each row is one owner interaction with a campaign or Canvas communication (send, delivery, open, click, bounce, or unsubscribe) parsed from Braze Currents exports.
columns:
  id_event:
    description: Braze event identifier from the Currents payload (`id` in `event_info` JSON).
    lineage:
      - datalake_braze_events_clean.events_owners.event_info
  id_dispatch:
    description: Braze dispatch identifier grouping messages sent in the same communication wave.
    lineage:
      - datalake_braze_events_clean.events_owners.event_info
  id_user_dispatch:
    description: Surrogate key (MD5) combining dispatch identifier and Braze user id to uniquely identify a message sent to a specific owner.
    lineage:
      - datalake_braze_events_clean.events_owners.event_info
      - datalake_braze_events_clean.events_owners.event_type
  id_user_braze:
    description: Braze internal user profile identifier (`user_id` in Currents payloads).
    lineage:
      - datalake_braze_events_clean.events_owners.event_info
  id_user:
    description: QuintoAndar platform user identifier mapped as Braze `external_user_id`.
    lineage:
      - datalake_braze_events_clean.events_owners.event_info
  id_campaign:
    description: Braze campaign identifier when the event originated from a standalone campaign.
    lineage:
      - datalake_braze_events_clean.events_owners.event_info
  id_variant_campaign:
    description: Braze message variation id (A/B test variant) within the campaign.
    lineage:
      - datalake_braze_events_clean.events_owners.event_info
  id_canvas:
    description: Braze Canvas journey identifier when the event originated from a Canvas flow.
    lineage:
      - datalake_braze_events_clean.events_owners.event_info
  id_variant_canvas:
    description: Braze Canvas variation id when the Canvas has multiple entry paths or variants.
    lineage:
      - datalake_braze_events_clean.events_owners.event_info
  id_step_canvas:
    description: Braze Canvas step id linking the event to a specific node in the owner journey.
    lineage:
      - datalake_braze_events_clean.events_owners.event_info
  event_channel:
    description: Message delivery channel parsed from the Braze event type namespace (email, pushnotification, inappmessage, or webhook).
    categories:
      email: It's a message sent via email.
      inappmessage: It's a message that's not delivered outside of the user's app i.e. it's delivered when the user is active within the app.
      pushnotification: It's a message sent via push.
      webhook: It's a message sent via webhook.
    lineage:
      - datalake_braze_events_clean.events_owners.event_type
  event_action:
    description: Normalized action extracted from the Braze event type suffix (send, open, click, delivery, bounce, etc.).
    categories:
      bounce: Occurs when there is not a valid push token, the email addresses were incorrect or deactivated, or the user unsubscribed after the campaign was launched.
      click: Occurs when the user clicks on the message.
      delivery: Occurs when the message is accepted by the receiving email server.
      impression: Occurs when the in-app message has been viewed.
      markasspam: Occurs when the email is marked as "spam".
      newsfeedimpression: Occurs when the News Feed has been viewed.
      open: Occurs when the message is opened.
      send: Occurs when a message is sent in a campaign. This number is received from Braze.
      softbounce: Soft bounces occur when your recipient’s email address is valid or when the email message reaches the recipient’s email server, but the message was rejected for a temporary issue.
      unsubscribe: Occurs when the subscription state changed to unsubscribed as a result of clicking the Braze provided unsubscribe URL.
    lineage:
      - datalake_braze_events_clean.events_owners.event_type
  event_type:
    description: Full Braze Currents event type string as received in the source export (for example `users.messages.email.Open`).
    lineage:
      - datalake_braze_events_clean.events_owners.event_type
  ts_event:
    description: Timestamp when the Braze event occurred, converted from the Unix epoch in the Currents payload.
    lineage:
      - datalake_braze_events_clean.events_owners.event_info
  year:
    description: Partition year derived from `ts_event`.
    lineage:
      - datalake_braze_events_clean.events_owners.year
  month:
    description: Partition month derived from `ts_event`.
    lineage:
      - datalake_braze_events_clean.events_owners.month
  day:
    description: Partition day derived from `ts_event`.
    lineage:
      - datalake_braze_events_clean.events_owners.day
