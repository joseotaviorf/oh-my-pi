database_name: datalake_zendesk_history
table_name: ticket_history
description: 
  This enrichment table aims to gather descriptive data, metrics and dates related to the ticket history. 
  Each row in the table represents a ticket.
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  id_ticket:
    description: Unique ticket identification key in Zendesk.
    lineage: 
      - datalake_zendesk_ticket_funnels.ticket_funnel.id_ticket
  contestation_task_origin:
    description: Descriptive data that indicates where the contestation was requested from.
  is_closed_by_merge:
    description: Boolean type data that indicates whether the ticket was closed through a merge with another service.
  is_contestation_backlog:
    description: Boolean type data that indicates whether the ticket is still a contestation demand that is in the backlog.
  is_ticket_followup:
    description: Boolean type data that indicates whether the ticket is a follow-up ticket.
  dt_contestation:
    description: Information such as date that indicates when the contestation was requested.
    lineage:
      - datalake_zendesk_tickets_clean.tickets_history.ts_updated
  dt_resolution_contestation:
    description: Boolean type data that indicates when the contestation demand was resolved.
    lineage:
      - datalake_zendesk_tickets_clean.tickets_history.ts_updated
