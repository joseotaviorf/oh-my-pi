---
dag_documentation:
  dag_purpose: This DAG is responsible for sending data from inspections and inspectors to the MinorityReportAPIClient

query_model: SELECT {selected_columns} FROM {data_source_table} WHERE {filter_date_column} = DATE('{filter_date_value}')
minority_request_header:
  Content-Type: application/json

tables_to_send:
  inspector_performance:
    key_name: agentId
    key_value: id_inspector
    type: INSPECTORS_PERFORMANCE
    data_source_table: datalake_inspections_metrics.inspector_performance
    selected_columns: id_inspector, inspections_conversion, eligible_inspections
    filter_date_column: dt_load
    context_fields:
      - name: inspectionsConversion
        value: inspections_conversion
      - name: eligibleInspections
        value: eligible_inspections
