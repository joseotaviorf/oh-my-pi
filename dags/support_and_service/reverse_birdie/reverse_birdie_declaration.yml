dag:
  name: reverse_birdie
  schedule_start_date: 2025,3,18
  owner: Data SS
  documentation:
    dag_purpose: |
      This dag aims to load a copy of the databases that will be sent to Birdie from our datalake, before actually sending them.
workflow:
  type: load
  layer: reverse
  custom_schema: birdie
  default_extraction_type: incremental
  default_partitions: ["year", "month", "day"]
  execution_timeout_hours: 4
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, macros.ds_add(ds, 1), 'load_start_date') }}"
cluster:
  type: databricks_13_3_med_general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}

