dag: 
  name: linhadireta
  owner: Data SS
  schedule_start_date: 2019, 5, 31
  schedule_interval: 0 5 * * *
  documentation:
    dag_purpose:
      This DAG imports the tables from [LinhaDireta](https://github.com/quintoandar/linha-direta),
      our service for chat management.
workflow:
  type: database_pull_delta
  layer: raw
  database_type: postgres
  lineage_product_database_name: linhadireta
  dbutils_secret_key: ENV_LINHADIRETA
  tables_customization:
    Chat_users:
      clean_table_name: chat_users
      extraction_type: full
    Chat:
      clean_table_name: chat
      extraction_type: full
    User_chats:
      clean_table_name: user_chats
      extraction_type: full
    User:
      clean_table_name: user
      extraction_type: full
cluster:
  type: databricks_12_2_med_general_cluster
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE