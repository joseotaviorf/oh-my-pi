database_name: datalake_linhadireta_clean
table_name: chat_users
description: >
  Bridge table with one row per user-to-chat association in Linhadireta. Maps the
  many-to-many relationship between users and chat conversations, identifying all
  participants in each chat. Source system is Linhadireta.
domain: Support and Services
owner: gabriel.firmino@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_linhadireta_raw.chat_users.id
    description: Unique identifier for the user-to-chat association record in Linhadireta.
  id_chat:
    lineage:
      - datalake_linhadireta_raw.chat_users.chat_id
    description: Identifier of the chat conversation (from chat table) this user is associated with.
  id_user:
    lineage:
      - datalake_linhadireta_raw.chat_users.user_id
    description: Identifier of the Linhadireta user (from user table) who is a participant in the chat.
