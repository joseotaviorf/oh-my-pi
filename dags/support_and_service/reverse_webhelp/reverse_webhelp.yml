dag:
  name: reverse_webhelp
  schedule_start_date: 2021, 5, 12
  owner: Data SS
  documentation:
    dag_purpose: |
      This dag has the purpose of processing and storing the operation follow-up data,
      related to webhelp services.

workflow:
  type: query_delta
  layer: enrich
  default_partitions: ["year", "month", "day"]
  default_extraction_type: incremental
  has_hive_sync: false
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: m5a.2xlarge
    node_type_id: m5a.2xlarge
    spark_version: 12.2.x-scala2.12
    autoscale:
      max_workers: 3
      min_workers: 1