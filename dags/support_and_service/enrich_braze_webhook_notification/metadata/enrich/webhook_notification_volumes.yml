---
database_name: datalake_braze_webhook_notification
table_name: webhook_notification_volumes
owner: gabriel.firmino@quintoandar.com.br
domain: Support and Services
description: Table with the volume of communications sent through webhook to affiliates, tenants and owners.
columns:
  id_step_canvas:
    lineage:
      - datalake_braze_dispatches_user.affiliates_events.id_step_canvas
      - datalake_braze_dispatches_user.tenants_events.id_step_canvas
      - datalake_braze_dispatches_user.owners_events.id_step_canvas
    description: Key of the step within a variant. One variant can have multiple steps.
  canvas_name:
    lineage:
      - datalake_braze_details_clean.canvas_details_indica_ai.canvas_name
      - datalake_braze_details_clean.canvas_details_tenants.canvas_name
      - datalake_braze_details_clean.canvas_details_owners.canvas_name
    description: Human-readable canvas name used in dashboards and operational reports.
  variant_name:
    lineage:
      - datalake_braze_details_clean.canvas_details_indica_ai.variants
    description: Human-readable variant name used in dashboards and operational reports.
  step_name:
    lineage:
      - datalake_braze_details_clean.canvas_details_indica_ai.steps
    description: Name of the Canvas step.
  country_code:
    lineage:
      - datalake_braze_details_clean.canvas_details_indica_ai.country_code
      - datalake_braze_details_clean.canvas_details_tenants.country_code
      - datalake_braze_details_clean.canvas_details_owners.country_code
    description: Country code the canvas belongs to.
  rule_status:
    lineage:
      - datalake_braze_details_clean.canvas_details_indica_ai.steps
    description: Business value representing rule status on the webhook_notification_volumes enrich dataset.
  notification_count:
    description: Business value representing notification count on the webhook_notification_volumes enrich dataset.
  dt_webhook_sent:
    lineage:
      - datalake_braze_dispatches_user.affiliates_events.ts_webhook_sent
      - datalake_braze_dispatches_user.tenants_events.ts_webhook_sent
      - datalake_braze_dispatches_user.owners_events.ts_webhook_sent
    description: Timestamp of when that communication of a webhook was sent to an user.
