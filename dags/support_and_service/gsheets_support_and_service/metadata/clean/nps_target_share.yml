database_name: datalake_gsheets_clean
table_name: nps_target_share
description:
  NPS target allocation shares by campaign group and customer journey,
  maintained in Google Sheets for quarterly support KPI planning. One row per
  target period and journey segment.
owner: gabriel.firmino@quintoandar.com.br
domain: Support and Services
columns:
  support:
    description: Support squad or operational area (apoio) responsible for this NPS target share.
    lineage:
      - datalake_gsheets_raw.nps_target_share.apoio
  campaign_group:
    description: Braze or survey campaign group whose NPS performance is being allocated.
    lineage:
      - datalake_gsheets_raw.nps_target_share.campaign_group
  customer_journey:
    description: Customer journey stage (e.g. onboarding, offboarding) covered by this target.
    lineage:
      - datalake_gsheets_raw.nps_target_share.customer_journey
  target:
    description: Numeric NPS target score the squad should achieve in the period.
    lineage:
      - datalake_gsheets_raw.nps_target_share.target
  share:
    description: Fraction of the overall NPS target attributed to this journey or campaign slice.
    lineage:
      - datalake_gsheets_raw.nps_target_share.share
  quarter:
    description: Fiscal quarter label for which this NPS target allocation applies.
    lineage:
      - datalake_gsheets_raw.nps_target_share.quarter
  dt_start:
    description: First calendar date when this NPS target share becomes effective.
    lineage:
      - datalake_gsheets_raw.nps_target_share.data_inicio
  dt_end:
    description: Last calendar date when this NPS target share remains valid.
    lineage:
      - datalake_gsheets_raw.nps_target_share.data_fim
  year:
    description: Calendar year associated with the NPS target planning period.
    lineage:
      - datalake_gsheets_raw.nps_target_share.ano
  macro_customer_journey:
    description: High-level journey grouping used to roll up NPS shares across related stages.
    lineage:
      - datalake_gsheets_raw.nps_target_share.macro_customer_journey
  share_macro:
    description: Share of the macro-journey NPS target allocated to this sub-segment.
    lineage:
      - datalake_gsheets_raw.nps_target_share.share_macro
  share_nps_global:
    description: 'Share of the company-wide NPS target assigned to this row''s scope.'
    lineage:
      - datalake_gsheets_raw.nps_target_share.share_nps_global