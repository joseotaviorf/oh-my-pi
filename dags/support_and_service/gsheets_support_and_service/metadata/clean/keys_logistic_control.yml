database_name: datalake_gsheets_clean
table_name: keys_logistic_control
description:
  Reference keys logistics tracking curated in Google Sheets by the Support
  and Services team. One row per keys logistic control entry used to calibrate
  dashboards and operational KPIs.
owner: gabriel.firmino@quintoandar.com.br
domain: Support and Services
columns:
  id_contract:
    lineage:
      - datalake_gsheets_raw.keys_logistic_control.contrato
    description: Identifier for the contract referenced by this record.
  id_house:
    lineage:
      - datalake_gsheets_raw.keys_logistic_control.id_imovel
    description: Identifier for the house referenced by this record.
  id_run:
    lineage:
      - datalake_gsheets_raw.keys_logistic_control.codigo_corrida
    description: Identifier for the run referenced by this record.
  email:
    lineage:
      - datalake_gsheets_raw.keys_logistic_control.email
    description: Email address associated with the user or contact on this record.
  advanced_keys:
    lineage:
      - datalake_gsheets_raw.keys_logistic_control.chaves_antecipadas
    description: Value from the Google Sheets source column mapped to advanced_keys for keys_logistic_control planning.
  service_provider:
    lineage:
      - datalake_gsheets_raw.keys_logistic_control.prestador_servico
    description: Value from the Google Sheets source column mapped to service_provider for keys_logistic_control planning.
  type_of_keys:
    lineage:
      - datalake_gsheets_raw.keys_logistic_control.tipo_chaves
    description: Value from the Google Sheets source column mapped to type_of_keys for keys_logistic_control planning.
  contract_phase:
    lineage:
      - datalake_gsheets_raw.keys_logistic_control.fase_contrato
    description: Value from the Google Sheets source column mapped to contract_phase for keys_logistic_control planning.
  running_cost:
    lineage:
      - datalake_gsheets_raw.keys_logistic_control.custo_corrida
    description: Value from the Google Sheets source column mapped to running_cost for keys_logistic_control planning.
  status:
    lineage:
      - datalake_gsheets_raw.keys_logistic_control.status
    description: Current lifecycle status of the ticket, task, or workflow step.
  final_running_cost:
    lineage:
      - datalake_gsheets_raw.keys_logistic_control.cutsto_corrida_final
    description: Value from the Google Sheets source column mapped to final_running_cost for keys_logistic_control planning.
  dt_started_task:
    lineage:
      - datalake_gsheets_raw.keys_logistic_control.dt_abertura_tarefa
    description: Calendar date associated with started task in the business process.
  dt_max_to_send_keys:
    lineage:
      - datalake_gsheets_raw.keys_logistic_control.dt_vigencia_saida
    description: Calendar date associated with max to send keys in the business process.
  dt_keys_travel:
    lineage:
      - datalake_gsheets_raw.keys_logistic_control.dt_viagem
    description: Calendar date associated with keys travel in the business process.
  dt_ended_key_logistics:
    lineage:
      - datalake_gsheets_raw.keys_logistic_control.data
    description: Calendar date associated with ended key logistics in the business process.