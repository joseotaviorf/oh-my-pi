    lineage:
      - datalake_gsheets_raw.csat_reembolso_true.is_solved
  ts_submitted:
    description: Satisfaction survey response date
    lineage:
      - datalake_gsheets_raw.csat_reembolso_true.submitted_at
  ts_load:
