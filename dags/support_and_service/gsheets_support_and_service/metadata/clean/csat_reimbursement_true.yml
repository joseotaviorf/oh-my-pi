---
database_name: datalake_gsheets_clean
table_name: csat_reimbursement_true
description: This worksheet contains the satisfaction form responses for the tenant/landlord refund or repair refund process.
domain: Support and Services
owner: data-ae-ss@quintoandar.com.br
columns:
  id_activity:
    description: Reimbursement task ID in Heimdall base
    lineage:
      - datalake_gsheets_raw.csat_reembolso_true.act_id
  token:
    description: Customer token
    lineage:
      - datalake_gsheets_raw.csat_reembolso_true.token
  cid:
    description: Unique contract identifier
    lineage:
      - datalake_gsheets_raw.csat_reembolso_true.cid
  uid:
    description: User ID requesting refund
    lineage:
      - datalake_gsheets_raw.csat_reembolso_true.uid
  type:
    description: "Refund category: tenant_refund, landlord_refund or repairs"
    lineage:
      - datalake_gsheets_raw.csat_reembolso_true.type
  improvement_suggestions:
