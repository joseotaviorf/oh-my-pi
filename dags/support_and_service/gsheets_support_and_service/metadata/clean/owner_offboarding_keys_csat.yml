database_name: datalake_gsheets_clean
table_name: owner_offboarding_keys_csat
description:
  Reference CSAT survey score targets curated in Google Sheets by the Support
  and Services team. One row per owner offboarding keys csat entry used to
  calibrate dashboards and operational KPIs.
owner: gabriel.firmino@quintoandar.com.br
domain: Support and Services
columns:
  improvement_tags:
    lineage:
      - datalake_gsheets_raw.csat_chaves_off_pp.tags
    description: Value from the Google Sheets source column mapped to improvement_tags for owner_offboarding_keys_csat planning.
  comments:
    lineage:
      - datalake_gsheets_raw.csat_chaves_off_pp.comments
    description: Value from the Google Sheets source column mapped to comments for owner_offboarding_keys_csat planning.
  score:
    lineage:
      - datalake_gsheets_raw.csat_chaves_off_pp.score
    description: Value from the Google Sheets source column mapped to score for owner_offboarding_keys_csat planning.
  ts_input:
    lineage:
      - datalake_gsheets_raw.csat_chaves_off_pp.ts_input
    description: Timestamp when input occurred according to the source system.