cluster:
  type: emr_7_12_consolidation_s_general_fleet_cluster
  custom_libraries:
  - whl: '{artifacts_bucket}/gsheets-api-client-python/quintoandar_gsheets_api_client-0.7.0-py2.py3-none-any.whl'
  - pypi:
      package: google-auth==2.23
  - pypi:
      package: google-api-python-client==2.55.0
  custom_configurations:
    aws_attributes:
      ebs_volume_size: 200
    task_nodes:
      instance_types:
      - m6g.xlarge
      - m7g.xlarge
      target_on_demand: 0
      target_spot: 1
      allocation_strategy: price-capacity-optimized
      bid_price_percentage: 100
    core_nodes:
      target_on_demand: 2
      target_spot: 0
      instance_types:
      - m6g.xlarge
      - m7g.xlarge
    spark_conf: {}
