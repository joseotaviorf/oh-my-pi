database_name: dw_crm
table_name: dim_photo_job_task
description:
  Dimension table that contains ""agendarjobdefotografo""  and ""fupfoto""
  tasks information
domain: Support and Services
owner: sayuri.matsumoto@quintoandar.com.br
columns:
  sk_task:
    lineage:
      - datalake_crm_tasks_flows.tasks_actions_resolutions_flow.id_task
    description: Key of task in CRM
  score_factor:
    lineage:
      - datalake_crm_tasks_flows.tasks_actions_resolutions_flow.score_factor
    description:
      Defines the task importance weight to be ordered in analysts' tasks
      backlog
  version:
    lineage:
      - datalake_crm_tasks_flows.tasks_actions_resolutions_flow.version
    description: Specifies the MongoDB (CRM Production database technology) version
  origin:
    lineage:
      - datalake_crm_tasks_flows.tasks_actions_resolutions_flow.origin
    description:
      Origin of the task, if it was generated from a Property or a job
      photographer
    categories:
      Imovel: ""
      JobFotografo: ""
  type:
    lineage:
      - datalake_crm_tasks_flows.tasks_actions_resolutions_flow.type
    description:
      Indicates whether the task is Manual or the task name when it is
      automatic-type
    categories:
      AgendarJobDeFotografo: ""
      FupFoto: ""
  description:
    lineage:
      - datalake_crm_tasks_flows.tasks_actions_resolutions_flow.description
    description:
      The task description field filled by an analyst as an additional
      information or remark (for task manual-type only).
  subject:
    lineage:
      - datalake_crm_tasks_flows.tasks_actions_resolutions_flow.subject
    description: Subject of the task
  titles:
    lineage:
      - datalake_crm_tasks_flows.tasks_actions_resolutions_flow.titles
    description:
      The task title which should be standardized according to the task
      type
  workgroups:
    lineage:
      - datalake_crm_tasks_flows.tasks_actions_resolutions_flow.workgroups
    description: The specific workgroup on which a task belongs to
    categories:
      "[FUP_TEAM]": ""
      "[JOB_FOTOGRAFO]": ""
  hours_task_start_to_completed:
    lineage:
      - datalake_crm_tasks_flows.tasks_actions_resolutions_flow.hours_task_started_to_completed
    description: Hours that the task takes between the start and completion timestamps
  flg_solved:
    lineage:
      - datalake_crm_tasks_flows.tasks_actions_resolutions_flow.is_resolved
    description:
      Boolean column that indicates if a task was solved or not by the
      system
  is_task_auto_completed:
    lineage:
      - datalake_crm_tasks_flows.tasks_actions_resolutions_flow.is_task_auto_completed
    description: Flag if the task was closed automatically by the system
  ts_start:
    lineage:
      - datalake_crm_tasks_flows.tasks_actions_resolutions_flow.ts_started
    description: Timestamp of task start event (UTC timezone)
  ts_completed:
    lineage:
      - datalake_crm_tasks_flows.tasks_actions_resolutions_flow.ts_completed
    description: Timestamp of task completion event (UTC timezone)
  ts_silenced_until:
    lineage:
      - datalake_crm_tasks_flows.tasks_actions_resolutions_flow.ts_silenced_until
    description: Timestamp column marking the expiration of a task snooze event (UTC)
  ts_load:
    description: Timestamp of data load event (UTC timezone)
