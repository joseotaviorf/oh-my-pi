database_name: dw_crm
table_name: fact_closing_tasks
description:
  Fact table that contains events data, flags and its related foreign keys
  on each closing task grouped by task action
domain: Support and Services
owner: cassio.bastos@quintoandar.com.br
columns:
  sk_task:
    lineage:
      - datalake_crm_tasks_history_flows.tasks_history_users_flow.id_task
    description: Key of task in CRM
  sk_receiver:
    lineage:
      - datalake_crm_tasks_history_flows.tasks_history_users_flow.id_receiver
    description:
      CRM User's ID of the first user assignee which task was assigned
      by another team or automatically
  sk_start_date:
    lineage:
      - datalake_crm_tasks_history_flows.tasks_history_users_flow.id_start_date
    description: Key of task start event
  sk_completed_date:
    lineage:
      - datalake_crm_tasks_history_flows.tasks_history_users_flow.id_completed_date
    description: Key of task completion event
  sk_origin:
    lineage:
      - datalake_crm_tasks_history_flows.tasks_history_users_flow.id_origin
    description: Key of origin entity that generates a specific task
  sk_assignee:
    lineage:
      - datalake_crm_tasks_history_flows.tasks_history_users_flow.id_assignee
    description: CRM User's ID of task assignee for the specific task
  sk_user_action:
    lineage:
      - datalake_crm_tasks_history_flows.tasks_history_users_flow.id_user_action
    description:
      CRM User's ID of analyst who act on the task's action, that may be
      either the assignee or other one
  sk_action_date:
    lineage:
      - datalake_crm_tasks_history_flows.tasks_history_users_flow.id_action_date
    description: Key of task action event
  sk_task_action_end_date:
    lineage:
      - datalake_crm_tasks_history_flows.tasks_history_users_flow.id_next_action_date
    description: Key of task action end event
  sk_task_action_start_date:
    lineage:
      - datalake_crm_tasks_history_flows.tasks_history_users_flow.id_action_date
    description: Key of task action start event
  sk_offer:
    lineage:
      - datalake_ebdb_proposal.pre_proposal.id_offer_context
      - datalake_offer.offer.id_offer_context
      - datalake_ebdb_rent_flow.rent_flow.id_offer_context
    description: Offer ID related to closing task
  sk_proposal:
    lineage:
      - datalake_ebdb_clean.proposal.id
      - datalake_ebdb_clean.contract.id_proposal
      - datalake_ebdb_rent_flow.rent_flow.id_proposal
    description: Accepted Offer ID related to closing task
  sk_contract:
    lineage:
      - datalake_ebdb_clean.contract.id
      - datalake_ebdb_rent_flow.rent_flow.id_contract
    description: Contract ID  related to closing task
  id_house_listing:
    lineage:
      - datalake_listing_contracts.listing_contracts.id_house_listing
      - datalake_ebdb_listing.house_listing.id_house_listing
    description: The house listing related to the task.
  sk_house_owner:
    lineage:
      - datalake_ebdb_clean.house.id_user
      - datalake_ebdb_rent_flow.rent_flow.id_owner
    description: House Owner user's ID related to closing task
  sk_tenant:
    lineage:
      - datalake_ebdb_clean.proposal.id_proponent
      - datalake_ebdb_clean.contract.id_user
      - datalake_ebdb_rent_flow.rent_flow.id_client
    description: User's ID who is tenant related to closing task
  sk_proponent:
    lineage:
      - datalake_ebdb_rent_flow.rent_flow.id_client
    description: User's ID who sent the proposal related to closing task
  task_action_type:
    lineage:
      - datalake_crm_tasks_history_flows.tasks_history_users_flow.action_type
    description: The task's action categories (CREATE, UPDATE, RESOLVE, REALIZE etc.)
    categories:
      COMMENT: ""
      CREATE: ""
      DISCARD: "#N/A"
      FINISH: "#N/A"
      PAUSE: "#N/A"
      REALIZE: ""
      REASSIGN: "#N/A"
      RESOLVE: ""
      SNOOZE: ""
      START: "#N/A"
      UPDATE: ""
      UPDATE_METADATA: ""
  minutes_task_created_to_started:
    lineage:
      - datalake_crm_tasks_history_flows.tasks_history_users_flow.minutes_task_created_to_started
    description: Time (in minutes) the task took after being created until it started.
  task_user_action_resolve_hours:
    lineage:
      - datalake_crm_tasks_history_flows.tasks_history_users_flow.task_user_resolve_hours
    description:
      Hours that the task action takes to be resolved, or the difference
      hours between action started and ended
  action_user_name:
    lineage:
      - datalake_crm_tasks_history_flows.tasks_history_users_flow.action_user_name
    description: User's name of task assignee who act on the task's action
  action_type:
    lineage:
      - datalake_crm_tasks_history_flows.tasks_history_users_flow.action_type
    description: The task's action categories (CREATE, UPDATE, RESOLVE, REALIZE etc.)
    categories:
      COMMENT: ""
      CREATE: ""
      DISCARD: "#N/A"
      FINISH: "#N/A"
      PAUSE: "#N/A"
      REALIZE: ""
      REASSIGN: "#N/A"
      RESOLVE: ""
      SNOOZE: ""
      START: "#N/A"
      UPDATE: ""
      UPDATE_METADATA: ""
  action_reason:
    lineage:
      - datalake_crm_tasks_history_flows.tasks_history_users_flow.action_reason
    description: Motivator for the action taken on the task.
    categories:
      Estou aguardando data segura: "#N/A"
      Estou aguardando direcionamento interno: "#N/A"
      Estou aguardando retorno do IQ por chat: "#N/A"
      Estou aguardando retorno do IQ por e-mail: "#N/A"
      Estou aguardando retorno do IQ por telefone: "#N/A"
      Estou aguardando retorno do PP por chat: "#N/A"
      Estou aguardando retorno do PP por e-mail: "#N/A"
      Estou aguardando retorno do PP por telefone: "#N/A"
      Estou em horário de almoço: "#N/A"
      Estou em reunião: "#N/A"
      Estou em um evento: "#N/A"
      Irei retomar o contato com o IQ por chat: "#N/A"
      Irei retomar o contato com o IQ por e-mail: "#N/A"
      Irei retomar o contato com o IQ por telefone: "#N/A"
      Irei retomar o contato com o PP por chat: "#N/A"
      Irei retomar o contato com o PP por e-mail: "#N/A"
      Irei retomar o contato com o PP por telefone: "#N/A"
      Outra tarefa foi iniciada: "#N/A"
      Outros: "#N/A"
      Task reassignment: "#N/A"
  task_status:
    lineage:
      - datalake_crm_tasks_history_flows.tasks_history_users_flow.task_status
    description: Task progress identifier.
    categories:
      FINISHED: "#N/A"
      NOT_STARTED: "#N/A"
      PAUSED: "#N/A"
      STARTED: "#N/A"
  ts_action:
    lineage:
      - datalake_crm_tasks_history_flows.tasks_history_users_flow.ts_action
    description: Timestamp of action event on the task started
  ts_task_action_start:
    lineage:
      - datalake_crm_tasks_history_flows.tasks_history_users_flow.ts_action
    description: Timestamp of action event on the task started (UTC timezone)
  ts_task_action_end:
    lineage:
      - datalake_crm_tasks_history_flows.tasks_history_users_flow.ts_next_action
    description: Timestamp of action event on the task ended (UTC timezone)
  year:
    lineage:
      - datalake_crm_tasks_history_flows.tasks_history_users_flow.year
    description: Integer type data that indicates the year in which we had the task in the crm.
  month:
    lineage:
      - datalake_crm_tasks_history_flows.tasks_history_users_flow.month
    description: Integer type data that indicates the month in which we had the task in the crm.
  day:
    lineage:
      - datalake_crm_tasks_history_flows.tasks_history_users_flow.day
    description: Integer type data that indicates the day in which we had the task in the crm.
  sk_house_listing:
    description: House Listing ID related to closing task
  ts_load:
    description: Timestamp of data load event (UTC timezone)
