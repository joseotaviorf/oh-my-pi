database_name: dw_crm
table_name: fact_onboarding_tenant_tasks
description:
  Fact table that contains events data, flags and its related foreign keys
  on each Tenant's Onborading task grouped by task action
domain: Support and Services
owner: nathalia.paula@quintoandar.com.br
columns:
  sk_task:
    lineage:
      - datalake_crm_tasks_flows.tasks_users_resolutions_flow.id_task
    description: Key of task in CRM
  sk_receiver:
    lineage:
      - datalake_crm_tasks_flows.tasks_users_resolutions_flow.id_receiver
    description:
      CRM User's ID of the first user assignee which task was assigned
      by another team or automatically
  sk_start_date:
    lineage:
      - datalake_crm_tasks_flows.tasks_users_resolutions_flow.id_start_date
    description: Key of task start event
  sk_completed_date:
    lineage:
      - datalake_crm_tasks_flows.tasks_users_resolutions_flow.id_completed_date
    description: Key of task completion event
  sk_origin:
    lineage:
      - datalake_crm_tasks_flows.tasks_users_resolutions_flow.id_origin
    description: Key of origin entity that generates a specific task
  sk_assignee:
    lineage:
      - datalake_crm_tasks_flows.tasks_users_resolutions_flow.id_assignee
    description: CRM User's ID of task assignee for the specific task
  sk_user_action:
    lineage:
      - datalake_crm_tasks_flows.tasks_users_resolutions_flow.id_user_action
    description:
      CRM User's ID of analyst who act on the task's action, that may be
      either the assignee or other one
  sk_action_date:
    lineage:
      - datalake_crm_tasks_flows.tasks_users_resolutions_flow.id_action_date
    description: Key of task action event
  sk_contract:
    lineage:
      - datalake_ebdb_listing.house_listing.id_contrato
      - datalake_listing_contracts.listing_contracts.id_contrato
      - datalake_ebdb_clean.onboarding.id_contrato
      - datalake_inspections.inspection_booking.id_contract
      - datalake_ebdb_clean.contract.id
    description: Contract ID  related to onboarding task
  sk_house_listing:
    lineage:
      - datalake_ebdb_listing.house_listing.id_house_listing
      - datalake_listing_contracts.listing_contracts.id_house_listing
    description: House Listing ID related to onboarding task
  sk_house_owner:
    lineage:
      - datalake_ebdb_rent_flow.rent_flow.id_owner
    description: House Owner user's ID related to onboarding task
  sk_tenant:
    lineage:
      - datalake_ebdb_rent_flow.rent_flow.id_client
    description: User's ID who is tenant related to onboarding task
  sk_task_action_start_date:
    lineage:
      - datalake_crm_tasks_flows.tasks_users_resolutions_flow.id_task_user_start_date
    description: Key of task action start event
  sk_task_action_end_date:
    lineage:
      - datalake_crm_tasks_flows.tasks_users_resolutions_flow.id_task_user_end_date
    description: Key of task action end event
  action_user_name:
    lineage:
      - datalake_crm_tasks_flows.tasks_users_resolutions_flow.action_user_name
    description: User's name of task assignee who act on the task's action
  action_type:
    lineage:
      - datalake_crm_tasks_flows.tasks_users_resolutions_flow.action_type
    description: The task's action categories (CREATE, UPDATE, RESOLVE, REALIZE etc.)
    categories:
      COMMENT: ""
      CREATE: ""
      REALIZE: ""
      RESOLVE: ""
      SNOOZE: ""
      UPDATE: ""
  task_action_type:
    lineage:
      - datalake_crm_tasks_flows.tasks_users_resolutions_flow.task_user_type
    description: The task's action categories (CREATE, UPDATE, RESOLVE, REALIZE etc.)
    categories:
      COMMENT: ""
      CREATE: ""
      REALIZE: ""
      RESOLVE: ""
      SNOOZE: ""
      UPDATE: ""
  task_user_action_resolve_hours:
    lineage:
      - datalake_crm_tasks_flows.tasks_users_resolutions_flow.task_user_resolve_hours
    description:
      Hours that the task action takes to be resolved, or the difference
      hours between action started and ended
  ts_task_action_start:
    lineage:
      - datalake_crm_tasks_flows.tasks_users_resolutions_flow.ts_task_user_start
    description: Timestamp of action event on the task started (UTC timezone)
  ts_task_action_end:
    lineage:
      - datalake_crm_tasks_flows.tasks_users_resolutions_flow.ts_task_user_end
    description: Timestamp of action event on the task ended (UTC timezone)
  ts_action:
    lineage:
      - datalake_crm_tasks_flows.tasks_users_resolutions_flow.ts_action
    description: Timestamp of action event on the task started
  year:
    lineage:
      - datalake_crm_tasks_flows.tasks_users_resolutions_flow.year
    description: Integer type data that indicates the year in which we had the task action in the crm.
  month:
    lineage:
      - datalake_crm_tasks_flows.tasks_users_resolutions_flow.month
    description: Integer type data that indicates the month in which we had the task action in the crm.
  day:
    lineage:
      - datalake_crm_tasks_flows.tasks_users_resolutions_flow.day
    description: Integer type data that indicates the day in which we had the task action in the crm.
  ts_load:
    description: Timestamp of data load event (UTC timezone)
