cluster:
  type: emr_7_12_consolidation_l_memory_fleet_cluster
  custom_configurations:
    aws_attributes:
      # Prior EMR runs filled /mnt under concurrent fact loads; keep headroom.
      ebs_volume_size: 500
    # Cap concurrent Spark steps (default 8). Heavy facts share one fleet.
    step_concurrency_level: 2
    core_nodes:
      target_on_demand: 4
      target_spot: 0
      instance_types:
      - r6g.4xlarge
      - r7g.4xlarge
      - r6i.4xlarge
    spark_conf:
      # j-2OPXNTRUAVU4W: AQE coalesce collapsed shuffles to ~10 multi-hour tasks.
      # Keep more shuffle partitions; accept more files — OPTIMIZE compacts after load.
      spark.sql.adaptive.coalescePartitions.enabled: 'false'
      spark.sql.shuffle.partitions: '200'
      spark.driver.memory: 16g
      spark.driver.memoryOverhead: 4g
      spark.driver.maxResultSize: '0'
      # Pack more executors on r6g (~128 GiB / 16 vCPU): use all cores (~8×2c/node → ~64 slots).
      # Safer heaps than 6g on compute; smaller than preset 48g/4c which only filled ~half the CPUs.
      spark.executor.memory: 12g
      spark.executor.memoryOverhead: 2g
      spark.executor.cores: '2'
