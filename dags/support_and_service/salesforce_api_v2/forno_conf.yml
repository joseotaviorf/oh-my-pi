webhook_salesforce_api_v2: WEBHOOK_SALESFORCE_CDC_FORNO # TODO: Change to WEBHOOK_SALESFORCE_API_V2_FORNO

salesforce_endpoint: "https://quintoandar--fornov1.sandbox.my.salesforce.com"

dag_documentation:
  dag_purpose:
    "Salesforce API_v2 ingestion DAG. Runs daily and, for each mapped Salesforce
    object, pulls the incremental snapshot from the Salesforce REST API into the
    raw layer (salesforce/api_v2) and then maintains an SCD Type 2 history table in
    the clean layer (salesforce/api_v2_clean). Consumed downstream via clean-layer
    dataset events."

datalake_bucket: "5a-datalake-forno"

# Per-object hourly cutover switch: when `hourly` is true the DAG passes
# --partition_hour (two-digit HH) to that object's raw/clean jobs; when false or
# absent the flag is omitted and the jobs run at daily granularity.
objects_config:
  task_v2:
    api_entity: "Task"
    hourly: false
  case_milestone_v2:
    api_entity: "CaseMilestone"
    hourly: false
  record_type_v2:
    api_entity: "RecordType"
    hourly: false
  case_feed_v2:
    api_entity: "CaseFeed"
    hourly: false
  # Hourly from day one: bootstraps hour-partitioned; while the DAG schedule is
  # still daily, each run only covers the 00:00-01:00 window.
  email_message_v2:
    api_entity: "EmailMessage"
    hourly: true


cluster:
  type: emr_7_12_small_general_2xlarge_2_workers_cluster
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE
