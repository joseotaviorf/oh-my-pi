webhook_salesforce_api_v2: WEBHOOK_SALESFORCE_CDC_PROD # TODO: Change to WEBHOOK_SALESFORCE_API_V2_PROD

salesforce_endpoint: "https://quintoandar.my.salesforce.com"

dag_documentation:
  dag_purpose:
    "Salesforce API_v2 ingestion DAG. Runs hourly: objects marked hourly pull
    each completed hour's incremental snapshot from the Salesforce REST API into
    the raw layer (salesforce/api_v2) and then maintain an SCD Type 2 history
    table in the clean layer (salesforce/api_v2_clean); daily objects are
    short-circuited on every run except the one at daily_execution_hour, where
    they process the previous complete day. Consumed downstream via clean-layer
    dataset events."

datalake_bucket: "5a-datalake-prod"

# Wall-clock UTC hour at which daily (hourly: false) objects run — the DAG-run
# whose data_interval_end lands on this hour processes the previous complete
# day; every other hourly run short-circuits the daily tasks.
daily_execution_hour: 0

# Per-object hourly cutover switch: when `hourly` is true the object's raw/clean
# jobs run every hour with --partition_hour (two-digit HH from
# data_interval_start); when false or absent the jobs run once a day at
# daily_execution_hour, at daily granularity. Before flipping an object to true:
# repartition of its raw *_v2 table to [partition_date, partition_hour], and the
# partition_hour column on datalake_sst_metrics.salesforce_api_logs.
objects_config:
  task_v2:
    api_entity: "Task"
    hourly: false
  case_milestone_v2:
    api_entity: "CaseMilestone"
    hourly: false
  record_type_v2:
    api_entity: "RecordType"
    hourly: false
  case_feed_v2:
    api_entity: "CaseFeed"
    hourly: false
  integration_job_v2:
    api_entity: "IntegrationJob__c"
    hourly: false
  # Hourly from day one: the table bootstraps already partitioned by
  # [partition_date, partition_hour], so no repartition is needed at cutover.
  email_message_v2:
    api_entity: "EmailMessage"
    hourly: true



# Sizing here follows task slots and YARN AM admission, not CPU%: the raw step is
# network-bound. api_v2.py fans out exactly PARALELISM=10 HTTP partitions through
# mapInPandas, and the token / describe / updated-deleted calls block on the driver
# before any Spark work, so executor CPU stays near idle at any instance size.
#
# The previous preset (emr_7_12_small_general_2xlarge_2_workers_cluster) is one of
# the legacy emr_cluster_base presets: it declares no spark_conf of its own and so
# inherits spark.yarn.am.memory: 8g. Against
# yarn.scheduler.capacity.root.default.maximum-am-resource-percent: 0.2, two
# m6g.2xlarge cores budget ~9.8 GB for application masters, which a single ~9 GB AM
# consumes whole -- so the object steps serialized despite StepConcurrencyLevel
# defaulting to 4, and an 8 GB AM crowded executors off its node. Every consolidation
# tier overrides am.memory (1g here), which restores real step overlap at the
# daily_execution_hour run and frees the node for executors.
#
# m6g.xlarge x 2 cores keeps the same ~6 concurrent task slots as before (4 vCPU per
# node, 2 cores per executor) at half the EC2 footprint, which matters at 24 cluster
# creations a day. If the clean-layer Delta MERGE starts spilling on the 4g executor
# heap, step up to emr_7_12_consolidation_m_general_cluster -- same footprint as the
# old preset, but with the AM budget fixed.
cluster:
  type: emr_7_12_consolidation_xs_general_cluster
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE
