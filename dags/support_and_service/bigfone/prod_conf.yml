---
lineage_product_database_name: bigfone
dag_documentation:
  dag_purpose: Retrieve data from the Bigfone database (PostgreSQL).
    [Bigfone](https://github.com/quintoandar/big-fone) is a system which is responsible for interacting with Twilio (an external service) to manage calls, peers and store data used to generate some reports.
    It also acts as a central place to identify a person, adding info from Skynet, Akinator, Timeline (from Stalker) and Akinator.

tables:
  Call:
    raw_table_name: "call"
    raw_extraction_type: full
    clean_extraction_type: full
  Queued:
    raw_table_name: "queued"
    raw_extraction_type: full
    clean_extraction_type: full
  Event:
    raw_table_name: "event"
    raw_extraction_type: incremental
    clean_extraction_type: incremental
    date_filter_column: event_timestamp
  IVRClosedHistory:
    raw_table_name: "ivr_closed_history"
    raw_extraction_type: full
    clean_extraction_type: full
partition_cols: ["year", "month", "day"]

custom_cluster:
  driver_node_type_id: r5d.2xlarge
  node_type_id: r5d.xlarge
  runtime_engine: PHOTON
  autoscale:
    min_workers: 1
    max_workers: 3
  aws_attributes:
    ebs_volume_size: 200
