database_name: datalake_bigfone_clean
table_name: scheduled_call_task
description: >
  One row per scheduled call task created in Bigfone via Twilio TaskRouter. Represents
  a callback or outbound call task assigned to a support agent, including routing details
  (queue, BPO, worker), task status lifecycle, and communication channel. Source system
  is Bigfone integrated with Twilio.
domain: Support and Services
owner: gabriel.firmino@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_bigfone_raw.scheduledcalltask.id
    description: Unique identifier for the scheduled call task record in Bigfone.
  id_task:
    lineage:
      - datalake_bigfone_raw.scheduledcalltask.task_id
    description: Twilio TaskRouter task SID that identifies this task in the Twilio platform.
  id_reservation:
    lineage:
      - datalake_bigfone_raw.scheduledcalltask.task_attributes
    description: Twilio reservation identifier extracted from task attributes, linking this task to a specific agent reservation.
  id_worker:
    lineage:
      - datalake_bigfone_raw.scheduledcalltask.task_attributes
    description: Twilio worker SID extracted from task attributes, identifying the agent assigned to handle this call task.
  id_user:
    lineage:
      - datalake_bigfone_raw.scheduledcalltask.user_id
    description: Identifier of the QuintoAndar user (customer) associated with this call task.
  id_session:
    lineage:
      - datalake_bigfone_raw.scheduledcalltask.session_id
    description: Session identifier linking this task to a broader customer interaction session.
  task_attributes:
    lineage:
      - datalake_bigfone_raw.scheduledcalltask.task_attributes
    description: JSON with attributes related to the call - BPO information, worker/queue IDs, channel, etc.
  task_status:
    lineage:
      - datalake_bigfone_raw.scheduledcalltask.task_status
    description: Current lifecycle status of the Twilio task (e.g., pending, reserved, assigned, completed, canceled).
  task_resource:
    lineage:
      - datalake_bigfone_raw.scheduledcalltask.task_resource
    description: JSON with Twilio related attributes
  user_phone:
    lineage:
      - datalake_bigfone_raw.scheduledcalltask.user_phone
    description: Phone number of the customer associated with this scheduled call task.
  communication_channel:
    lineage:
      - datalake_bigfone_raw.scheduledcalltask.task_attributes
    description: Communication channel for this call task (e.g., voice, whatsapp), extracted from the task attributes JSON.
  bpo_name:
    lineage:
      - datalake_bigfone_raw.scheduledcalltask.task_attributes
    description: BPO (Business Process Outsourcing) partner name extracted from task attributes, indicating the outsourced team handling this task.
  queue_name:
    lineage:
      - datalake_bigfone_raw.scheduledcalltask.task_attributes
    description: Target Twilio TaskRouter queue name extracted from task attributes, indicating the support queue this task was routed to.
  ts_created:
    lineage:
      - datalake_bigfone_raw.scheduledcalltask.created_at
    description: Timestamp of when the task was created
  ts_updated:
    lineage:
      - datalake_bigfone_raw.scheduledcalltask.updated_at
    description: Timestamp of when the task was updated
  year:
    lineage:
      - datalake_bigfone_raw.scheduledcalltask.year
    description: Year extracted from the task creation date. Partition column.
  month:
    lineage:
      - datalake_bigfone_raw.scheduledcalltask.month
    description: Month extracted from the task creation date. Partition column.
  day:
    lineage:
      - datalake_bigfone_raw.scheduledcalltask.day
    description: Day extracted from the task creation date. Partition column.
