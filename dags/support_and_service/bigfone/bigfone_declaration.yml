dag:
  name: bigfone
  schedule_start_date: 2020, 7, 27
  schedule_interval: 0 0 * * *
  owner: Data SS
  documentation:
  dag_purpose: Retrieve data from the Bigfone database (PostgreSQL).
    [Bigfone](https://github.com/quintoandar/big-fone) is a system which is responsible for interacting with Twilio (an external service) to manage calls, peers and store data used to generate some reports.
    It also acts as a central place to identify a person, adding info from Skynet, Akinator, Timeline (from Stalker) and Akinator.

workflow:
  type: database_pull
  layer: raw
  database_type: postgres
  dbutils_secret_key: BIGFONE_DB
  default_extraction_type: incremental
  tables_customization:
    Call:
      clean_table_name: call
      extraction_type: full
    Event:
      clean_table_name: event
      date_filter_column: event_timestamp
      partitions: [year, month, day]
    IVRClosedHistory:
      clean_table_name: ivr_closed_history
      extraction_type: full
    ScheduledCallTask:
      clean_table_name: scheduled_call_task
      date_filter_column: updated_at
      partitions: [year, month, day]

cluster:
  type: databricks_12_2_med_general_cluster
