dag:
  name: bigfone
  schedule_start_date: 2020, 7, 27
  schedule_interval: 0 0 * * *
  owner: Data SS
  documentation:
  dag_purpose: Retrieve data from the Bigfone database (PostgreSQL). [Bigfone](https://github.com/quintoandar/big-fone) is a system which is responsible for interacting with Twilio (an external service) to manage calls, peers and store data used to generate some reports. It also acts as a central place to identify a person, adding info from Skynet, Akinator, Timeline (from Stalker) and Akinator.

workflow:
  type: cdc
  layer: raw
  source_database: bigfone
  source_schema: public
  database_type: postgres
  dbutils_secret_key: BIGFONE_DB
  tables_customization:
    IVRClosedHistory:
      clean_table_name: ivr_closed_history
    ScheduledCallTask:
      clean_table_name: scheduled_call_task
    Call:
      clean_table_name: call
    Event:
      clean_table_name: event

cluster:
  type: emr_7_12_min_driver_2xlarge_6_workers_cluster
