---
database_name: datalake_terminator
table_name: termination
description:
  Enrichment table created with the aim of gathering information from the termination context.
  The granularity of this table is the requested termination.
domain: Support and Services
owner: data-ae-ss@quintoandar.com.br
columns:
  id_termination:
    description: Unique termination identification key.
    lineage:
      - datalake_terminator_clean.termination.id
  id_contract:
    description: Contract identification key.
    lineage:
      - datalake_terminator_clean.termination.id_contract
  id_exit_inspection:
    description: Identification key for the exit inspection (offboarding).
    lineage:
      - datalake_terminator_clean.termination.id_exit_inspection
      - datalake_inspections.inspection_booking.id_external
  id_house:
    description: House identification key.
    lineage:
      - datalake_ebdb_contract.contract.id_house
  id_house_listing:
    description: House listing identification key.
    lineage:
      - datalake_ebdb_contract.contract.id_house_listing
  id_region:
    description: Region identification key.
    lineage:
      - datalake_ebdb_clean.house.id_region
  id_workflow_assignee:
    description: Identification key of the user responsible for the workflow.
    lineage:
      - datalake_terminator_clean.termination_workflow.id_current_assignee
  id_zendesk_task:
    description: Ticket identification key generated in Zendesk.
    lineage:
      - datalake_terminator_clean.termination_task.id_external
  team:
    description: Name of the team responsible for the termination.
    lineage:
      - datalake_terminator_clean.termination.team
  cancellation_info:
    description: Data with json structure that indicates detailed information about canceling termination.
    lineage:
      - datalake_terminator_clean.termination.cancellation_info
  category:
    description: Descriptive information about the termination category.
    lineage:
      - datalake_terminator_clean.termination.category
  requested_by:
    description: Descriptive information that indicates the type of user who made the termination request.
    lineage:
      - datalake_terminator_clean.termination.requested_by
  source:
    description: Descriptive information that indicates the source of the termination request.
    lineage:
      - datalake_terminator_clean.termination.source
  status:
    description: Current termination status.
    lineage:
      - datalake_terminator_clean.termination.status
  feedback:
    description: Information in json format that indicates the home's output feedback.
    lineage:
      - datalake_terminator_clean.termination.feedback
  reason:
    description: Reason of the termination.
    lineage:
      - datalake_terminator_clean.termination.feedback
  rescheduling_history:
    description: Json type data that indicates the termination rescheduling history.
    lineage:
      - datalake_terminator_clean.termination.rescheduling_history
  workflow_current_step:
    description: Termination workflow step.
    lineage:
      - datalake_terminator_clean.termination_workflow.current_step
  fee_negotiation_status:
    description: Termination fee negotiation status.
    lineage:
      - datalake_terminator_clean.termination_fee_negotiation.status
  fee_payment_option:
    description: Option to pay the termination fee.
    lineage:
      - datalake_terminator_clean.termination_fee.tenant_payment_method
  checklist_item:
    description: Descriptive information that indicates which checklist item the record is in the termination process.
    lineage:
      - datalake_terminator_clean.checklist_item.checklist_item
  decline_person:
    description: Column indicating who opted-out/declined the relisting.
    lineage:
      - datalake_ebdb_contract.contract_declined_relisting.decline_person
    categories:
      "DECLINED_BY_PP": The person who declined the relisting was the owner.
      "DECLINED_BY_CX/ENG": The person who declined the relisting and opted-out wasn't the owner.
      "AUTO_DECLINED": If the is_early_relisting flag is False and we don't have any information who did the opt-out, the value will be Auto-declined.
  task_type:
    description: Descriptive information that indicates the type of task related to the termination.
    lineage:
      - datalake_terminator_clean.termination_task.type
  is_spoc:
    description: Boolean information indicating whether the termination is part of the spoc control group.
    lineage:
      - datalake_terminator_clean.termination.is_spoc
  is_spoc_control_group:
    description: Boolean information indicating whether the termination is part of the spoc control group.
    lineage:
      - datalake_terminator_clean.termination.is_spoc_control_group
  is_relisting:
    description: Boolean information that indicates whether the house is already being relisting.
    lineage:
      - datalake_terminator_clean.termination.is_relisting
  has_automatically_closed_task:
    description: Boolean information that indicates whether the termination task was closed automatically.
    lineage:
      - datalake_terminator_clean.termination_workflow.has_automatically_closed_task
  is_contract_b2b:
    description: Boolean information that indicates whether the contract is b2b.
    lineage:
      - datalake_ebdb_contract.contract_b2b.is_contract_b2b
  is_before_contract_start:
    description: Boolean information that indicates whether the termination occurred before the contract began.
  has_been_rescheduled:
    description: Boolean information that indicates whether the termination was rescheduled.
  is_checklist_active:
    description: Boolean information that indicates if de checklit is active.
    lineage:
      - datalake_terminator_clean.checklist_item.is_active
  is_checklist_done:
    description: Boolean information that indicates if de checklit is done.
    lineage:
      - datalake_terminator_clean.checklist_item.is_done
  is_relisting_enabled:
    lineage:
      - datalake_ebdb_contract.contract_declined_relisting.is_relisting_enabled
    description: Boolean flag indicating if the house can be relisted.
  is_early_relisting_enabled:
    lineage:
      - datalake_ebdb_contract.contract_declined_relisting.is_early_relisting_enabled
    description: Boolean flag indicating if the house's owner opted-in/out of the early relisting.
  has_repair_by_tenant_needed:
    lineage:
      - datalake_terminator_clean.negotiation.needs_repair_by_tenant
    description: Boolean flag indicating if needs repair by tenant.
  is_exit_inspection_opt_out:
    description: Boolean information that indicates whether the exit inspection is opted out.
    lineage:
      - datalake_terminator_clean.inspection_opted_out.is_exit_inspection_opt_out
  has_early_termination_fee:
    description: Boolean information that indicates whether the termination fee is early.
  is_fee_prior_notice:
    description: Boolean information that indicates whether the termination fee is prior notice.
    lineage:
      - datalake_terminator_clean.termination_fee.is_fee_prior_notice
  leadtime_request_to_vacancy:
    description: Numerical information that indicates the number of days between the request and the vacancy for termination.
    lineage:
      - datalake_terminator_clean.termination.ts_created
      - datalake_terminator_clean.termination.dt_termination
  fee_discount_percentage:
    description: Numerical information that indicates the discount percentage for the termination fee.
    lineage:
      - datalake_terminator_clean.termination_fee_negotiation.discount_percentage
  fee_discount_value:
    description: Numerical information that indicates the discount value for the termination fee.
    lineage:
      - datalake_terminator_clean.termination_fee_negotiation.discount_value
  fee_final_amount:
    description: Numerical information that indicates the final value of the termination fee.
    lineage:
      - datalake_terminator_clean.termination_fee_negotiation.final_amount
  fee_number_of_installments:
    description: Numerical information that indicates the number of installments for the termination fee.
    lineage:
      - datalake_terminator_clean.termination_fee.tenant_payment_method
  total_tentant_repair_ar:
    description: Total repairs with tenant's responsibility in repair analysis.
  repairs_added_by_owner_review:
    description: Total repairs added by owner for review.
  repairs_exempted_by_owner_review:
    description: Total repairs exempted by the owner in the review.
  total_tentant_repair_review:
    description: Total repairs under tenant's responsibility under review.
  repairs_exempted_ac:
    description: Total repairs exempted in the contestation analysis.
  repairs_absorbed_ac:
    description: Total repairs absorbed in the contestation analysis.
  total_tentant_repair_ac:
    description: Total repairs are the tenant's responsibility in the contestation analysis.
  spoc_wave:
    description: Information of type int that indicates in which wave of the spoc the termination entered.
    lineage:
      - datalake_terminator_clean.termination.spoc_wave
  dt_termination:
    description: Date when the property became or will become vacant.
    lineage:
      - datalake_terminator_clean.termination.dt_vacancy
  dt_last_rescheduled:
    description: Date of last rescheduling of termination.
    lineage:
      - datalake_terminator_clean.termination_aud.ts_updated
  ts_termination_request:
    description: Date in timestamp format that indicates when the termination request occurred.
    lineage:
      - datalake_terminator_clean.termination.ts_created
  ts_termination_updated:
    description: Date in timestamp format that indicates when the termination request was updated.
    lineage:
      - datalake_terminator_clean.termination.ts_updated
  ts_termination_canceled:
    description: Date in timestamp format that indicates when the cancellation of the termination occurred.
    lineage:
      - datalake_terminator_clean.termination.ts_canceled
  ts_termination_finished:
    description: Date in timestamp format that indicates when termination was completed.
    lineage:
      - datalake_terminator_clean.termination_aud.ts_updated
      - datalake_terminator_clean.negotiation.ts_updated
  ts_fee_negotiation_created:
    description: Date in timestamp format that indicates when the trade opening for the termination fee was created.
    lineage:
      - datalake_terminator_clean.termination_fee_negotiation.ts_created
  ts_fee_negotiation_updated:
    description: Date in timestamp format that indicates when the trade opening for the termination fee was updated.
    lineage:
      - datalake_terminator_clean.termination_fee_negotiation.ts_updated
  ts_declined:
    lineage:
      - datalake_ebdb_contract.contract_declined_relisting.ts_declined
    description: Timestamp of when the declined for relisting happened.
  year:
    description: Year when the data was loaded.
    lineage:
      - datalake_terminator_clean.termination.ts_updated
  month:
    description: Month when the data was loaded.
    lineage:
      - datalake_terminator_clean.termination.ts_updated
  day:
    description: Day when the data was loaded.
    lineage:
      - datalake_terminator_clean.termination.ts_updated
