dag:
    name: enrich_terminator
    schedule_start_date: 2024, 5, 17
    owner: Data SS
    documentation: 
        dag_purpose: |
          Dag with the aim of processing data from the termination database.
workflow:
    type: query_delta
    layer: enrich
    default_extraction_type: incremental
    default_partitions: [year, month, day]
    tables_customization:
        termination:
            merge_on: ['sk_termination']
    extra_query_template_params:
        load_start_date: "{{ get_date_param(dag_run, ds, 'load_start_date') }}"
        load_end_date: "{{ get_date_param(dag_run, ds, 'load_end_date') }}"
cluster:
    type: databricks_12_2_med_compute_cluster
