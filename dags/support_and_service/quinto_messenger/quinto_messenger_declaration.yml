dag:
  name: quinto_messenger
  schedule_start_date: 2020, 7, 27
  schedule_interval: 0 0 * * *
  owner: Data SS
  documentation:
    dag_purpose:
      Retrieve data from Quinto Messenger database (postgresql). [Quinto Messenger](https://github.com/quintoandar/quinto-messenger)
      is the service built to be the connection between Twilio and QuintoAdar's system.

workflow:
  type: database_pull_delta
  layer: raw
  database_type: postgres
  lineage_product_database_name: quintomessenger
  dbutils_secret_key: QUINTO_MESSENGER_DB
  default_extraction_type: incremental
  tables_customization:
    Channel:
      clean_table_name: channel
      date_filter_column: updated_at
      partitions: [year, month, day]
      z_order_by: [id_channel]
    ChannelEvent:
      clean_table_name: channel_event
      date_filter_column: updated_at
      partitions: [year, month, day]
      z_order_by: [id_channel]
    Task:
      clean_table_name: task
      date_filter_column: updated_at
      partitions: [year, month, day]
      z_order_by: [id_task]
    TaskEvent:
      clean_table_name: task_event
      date_filter_column: updated_at
      partitions: [year, month, day]
      z_order_by: [id_task]
    Chat:
      clean_table_name: chat
      date_filter_column: updated_at
      partitions: [year, month, day]
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, ds, 'load_end_date') }}"

cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: m5a.xlarge
    node_type_id: m5a.xlarge
    num_workers: 3
    spark_version: 13.3.x-scala2.12
