dag:
  name: quinto_messenger
  schedule_start_date: 2020, 7, 27
  schedule_interval: 0 0 * * *
  owner: Data SS
  documentation:
    dag_purpose: Retrieve data from Quinto Messenger database (postgresql). [Quinto Messenger](https://github.com/quintoandar/quinto-messenger) is the service built to be the connection between Twilio and QuintoAdar's system.

workflow:
  type: cdc
  layer: raw
  source_schema: public
  source_database: quintomessenger
  database_type: postgres
  dbutils_secret_key: QUINTOMESSENGER_DB

  default_extraction_type: incremental
  tables_customization:
    Channel:
      clean_table_name: channel
    ChannelEvent:
      clean_table_name: channel_event
    Task:
      clean_table_name: task
    TaskEvent:
      clean_table_name: task_event
    Chat:
      clean_table_name: chat

cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: m5a.2xlarge
    node_type_id: m5a.2xlarge
    num_workers: 5
    spark_version: 13.3.x-scala2.12
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
  databricks_conn_id: databricks_new
