database_name: datalake_quinto_messenger_clean
table_name: chat
description: >
  One row per chat session in Quinto Messenger, representing a Twilio Conversations
  session that groups messages between a customer and support agents. Links to the
  underlying channel and tracks session status and source identity. Partitioned by
  year, month and day. Source system is Quinto Messenger.
domain: Support and Services
owner: gabriel.firmino@quintoandar.com.br
columns:
  id_chat:
    lineage:
      - datalake_quinto_messenger_raw.chat.id
    description: Unique identifier for the chat session in Quinto Messenger.
  id_external:
    lineage:
      - datalake_quinto_messenger_raw.chat.external_id
    description: External identifier for the chat session from the originating system (e.g., CRM ticket ID or bot session ID).
  id_session:
    lineage:
      - datalake_quinto_messenger_raw.chat.source_id
    description: Identifier of the source session that originated this chat, used to link back to the originating interaction.
  id_channel:
    lineage:
      - datalake_quinto_messenger_raw.chat.attributes
    description: Twilio channel SID extracted from the chat attributes, linking this session to its underlying messaging channel.
  source:
    lineage:
      - datalake_quinto_messenger_raw.chat.source
    description: Originating system or entry point that created this chat session (e.g., whatsapp, webchat, bot).
  session_status:
    lineage:
      - datalake_quinto_messenger_raw.chat.status
    description: Current lifecycle status of the chat session (e.g., active, closed, transferred).
  source_identity:
    lineage:
      - datalake_quinto_messenger_raw.chat.source_identity
    description: Identity string from the originating source system that created this chat session.
  attributes:
    lineage:
      - datalake_quinto_messenger_raw.chat.attributes
    description: Raw JSON payload with all Twilio chat session attributes, including channel SID and routing context.
  ts_created:
    lineage:
      - datalake_quinto_messenger_raw.chat.created_at
    description: Timestamp when the chat session was created in Quinto Messenger.
  ts_updated:
    lineage:
      - datalake_quinto_messenger_raw.chat.updated_at
    description: Timestamp of the last update to the chat session record.
  year:
    lineage:
      - datalake_quinto_messenger_raw.chat.year
    description: Year extracted from the chat creation date. Partition column — filter on this column to enable partition pruning.
  month:
    lineage:
      - datalake_quinto_messenger_raw.chat.month
    description: Month extracted from the chat creation date. Partition column — filter on this column to enable partition pruning.
  day:
    lineage:
      - datalake_quinto_messenger_raw.chat.day
    description: Day extracted from the chat creation date. Partition column — filter on this column to enable partition pruning.
  year_month:
    lineage:
      - datalake_quinto_messenger_raw.chat.year_month
    description: Year and month concatenated (YYYYMM) from the chat creation date, used as an alternative partition filter.
