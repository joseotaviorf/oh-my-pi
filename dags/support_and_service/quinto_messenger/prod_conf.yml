---
lineage_product_database_name: quintomessenger
partition_cols: [year, month, day]
max_records_per_file: 250000

dag_documentation:
  dag_purpose:
    "Retrieve data from Quinto Messenger database (postgresql). [Quinto Messenger](https://github.com/quintoandar/quinto-messenger) \n
    is the service built to be the connection between Twilio and QuintoAdar's system."

tables:
  # <raw_table_name>:
  #   clean_table_name: <clean_table_name> #optional
  #   is_incremental: <is_incremental> #optional
  #   date_column: <date_column> #optional
  #   unixtime_measure: <unixtime_measure> #optional
  Channel:
    is_incremental: True
    date_column: updated_at
  ChannelEvent:
    clean_table_name: channel_event
    is_incremental: True
    date_column: updated_at
  Chat:
    is_incremental: True
    date_column: updated_at
  TaskEvent:
    clean_table_name: task_event
    is_incremental: True
    date_column: updated_at
  Task:
    is_incremental: True
    date_column: updated_at
