---
dag_documentation:
  dag_purpose:
    This dag aims to send BPO performance information, so that the product can make a recommendation as to which BPO will receive the demands. 
    The objective is to make the operation more robust in case a BPO cannot meet demands.

minority_request_header:
  Content-Type: application/json

tables_to_send:
  bpo_performance:
    key_name: csatKey
    type: BPO_PERFORMANCE
