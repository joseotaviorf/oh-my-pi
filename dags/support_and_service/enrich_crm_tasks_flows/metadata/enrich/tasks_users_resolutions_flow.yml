---
database_name: datalake_crm_tasks_flows
table_name: tasks_users_resolutions_flow
description: >
  One row per CRM task enriched with user assignment and resolution flow metrics. Combines task
  identity with assignee information and resolution timing, used for analyst performance
  and SLA reporting. Source systems are datalake_crm and datalake_crm_tasks_resolution.
domain: Support and Services
owner: gabriel.firmino@quintoandar.com.br
columns:
  id_action_date:
    lineage:
      - datalake_crm_tasks_resolution.tasks_resolution.ts_action
    description: Key of the task action date.
  id_assignee:
    lineage:
      - datalake_crm_tasks_resolution.tasks_resolution.id_assignee
    description: Key of task assignee user responsible for the task action.
  id_completed_date:
    lineage:
      - datalake_crm_tasks_resolution.tasks_resolution.ts_completed
    description: Key of task completion date.
  id_contract:
    lineage:
      - datalake_crm_tasks_resolution.tasks_resolution.id_contract
    description: Identifier of the rental contract associated with this task action.
  id_origin:
    lineage:
      - datalake_crm_tasks_resolution.tasks_resolution.id_origin
    description:
      Key of origin entity that generated the task, such as rent flow,
      offer, contract.
  id_activity:
    lineage:
      - datalake_heimdall.activity.id
    description: Activity identification key, coming from the heimdall base.
  id_receiver:
    lineage:
      - datalake_crm_tasks_resolution.tasks_resolution.id_receiver
    description:
      CRM User's ID of the first user assignee which task was assigned
      by another team or automatically
  id_start_date:
    lineage:
      - datalake_crm_tasks_resolution.tasks_resolution.ts_start
    description: Key of task start date.
  id_task:
    lineage:
      - datalake_crm_tasks_resolution.tasks_resolution.id_task
    description: Key of task in CRM Payment.
  id_task_user_end_date:
    lineage:
      - datalake_crm_tasks_resolution.tasks_resolution.ts_action
    description: Key of task action end date.
  id_task_user_start_date:
    lineage:
      - datalake_crm_tasks_resolution.tasks_resolution.ts_action
    description: Key of task action start date.
  id_user_action:
    lineage:
      - datalake_crm_tasks_resolution.tasks_resolution.id_user_action
    description:
      Key of the analyst performs the task action, that may or not be task
      assignee.
  id_workgroup:
    lineage:
      - datalake_crm_tasks_resolution.tasks_resolution.id_workgroup
    description: Identifier of the workgroup (team queue) this task action belongs to.
  action_type:
    lineage:
      - datalake_crm_tasks_resolution.tasks_resolution.action_type
    description:
      The action of the event happened to the task, such as created, updated,
      resolved.
  action_user_name:
    lineage:
      - datalake_crm_tasks_resolution.tasks_resolution.action_user_name
    description: The user's name of task assignee who performs that task action.
  origin:
    lineage:
      - datalake_crm_tasks_resolution.tasks_resolution.origin
    description: Origin system or entity that triggered this task action (e.g., rent flow, contract).
  type_activity:
    lineage:
      - datalake_heimdall.activity.type
    description: Type of Heimdall activity.
  task_user_resolve_hours:
    lineage:
      - datalake_crm_tasks_resolution.tasks_resolution.ts_action
    description:
      Hours that the task action takes to be resolved, or the difference
      hours between action started and ended.
  type:
    lineage:
      - datalake_crm_tasks_resolution.tasks_resolution.type
    description: Task type classification indicating the category of support task (e.g., inspection, repair).
  task_user_type:
    lineage:
      - datalake_crm_tasks_resolution.tasks_resolution.action_type
    description: Category for task action type, such as created, updated, resolved.
    categories:
      COMMENT: ""
      CREATE: ""
      REALIZE: ""
      RESOLVE: ""
      SNOOZE: ""
      UPDATE: ""
  ts_action:
    lineage:
      - datalake_crm_tasks_resolution.tasks_resolution.ts_action
    description: Timestamp of task action.
  ts_start:
    lineage:
      - datalake_crm_tasks_resolution.tasks_resolution.ts_start
    description: Task start date.
  ts_task_user_start:
    lineage:
      - datalake_crm_tasks_resolution.tasks_resolution.ts_action
    description: Timestamp of task action start.
  ts_task_user_end:
    lineage:
      - datalake_crm_tasks_resolution.tasks_resolution.ts_action
    description: Timestamp of task action end.
  year:
    lineage:
      - datalake_crm_tasks_resolution.tasks_resolution.year
    description: Integer type data that indicates the year in which we had the task action in the crm.
  month:
    lineage:
      - datalake_crm_tasks_resolution.tasks_resolution.month
    description: Integer type data that indicates the month in which we had the task action in the crm.
  day:
    lineage:
      - datalake_crm_tasks_resolution.tasks_resolution.day
    description: Integer type data that indicates the day in which we had the task action in the crm.
