dag:
  name: enrich_crm_tasks_flows
  schedule_start_date: 2015, 10, 29
  owner: Data SS
  documentation:
    dag_purpose: |
      Creates CRM (Customer Relationship Management) base tasks flows tables. These tables will be used to generate models in Tasks context.
workflow:
  type: query_delta
  layer: enrich
  default_extraction_type: incremental
  default_partitions: ["year", "month", "day"]
cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: m5d.2xlarge
    node_type_id: m5d.4xlarge
    num_workers: 3
    spark_version: 12.2.x-scala2.12
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
  databricks_conn_id: databricks_new
