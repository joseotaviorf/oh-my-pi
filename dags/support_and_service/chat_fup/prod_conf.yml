---
lineage_product_database_name: chatfup
partition_cols: [year, month, day]
dag_documentation:
  dag_purpose: |
    Extraction of [Chat FUP](https://github.com/quintoandar/chatfup) tables into data lake.
    Chat FUP is a service to manage followups for whatsapp chats.

tables:
  chats_chat:
    partitioned: False
  django_content_type:
    partitioned: False
  django_migrations:
    partitioned: False
  health_check_db_testmodel:
    partitioned: False
  rating:
    partitioned: True
    incremental_col: updated_at
  surveys_answer:
    partitioned: False
  surveys_survey:
    partitioned: False
  message_voting:
    partitioned: True
    incremental_col: updated_at
