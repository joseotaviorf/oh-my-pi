dag:
  name: chat_fup
  schedule_start_date: 2019, 5, 31
  schedule_interval: 0 3 * * *
  owner: Data SS
  documentation:
    dag_purpose: |
      Extraction of [Chat FUP](https://github.com/quintoandar/chatfup) tables into data lake.
      Chat FUP is a service to manage followups for whatsapp chats.

workflow:
  type: cdc
  layer: raw
  database_type: postgres
  source_database: chatfup
  source_schema: public
  lineage_product_database_name: chatfup
  dbutils_secret_key: CHAT_FUP_DB
  tables_customization:
    chats_chat:
      raw_primary_keys: ["id"]
      clean_primary_keys: ["id"]
    surveys_answer:
      raw_primary_keys: ["id"]
      clean_primary_keys: ["id"]
    surveys_survey:
      raw_primary_keys: ["id"]
      clean_primary_keys: ["id"]
    message_voting:
      raw_primary_keys: ["id"]
      clean_primary_keys: ["id"]
    rating:
      raw_primary_keys: ["id"]
      clean_primary_keys: ["id_rating"]

