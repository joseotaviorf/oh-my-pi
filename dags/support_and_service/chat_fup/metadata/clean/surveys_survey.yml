database_name: datalake_chat_fup_clean
table_name: surveys_survey
description: >
  One row per post-chat survey instance created in the Chat Fup platform. Represents
  a survey dispatched to a customer after a chat session ends, tracking whether a response
  is still pending and the unique token used to identify the survey request.
  Source system is Chat Fup.
domain: Support and Services
owner: gabriel.firmino@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_chat_fup_raw.surveys_survey.id
    description: Unique identifier for the survey instance in Chat Fup.
  token:
    lineage:
      - datalake_chat_fup_raw.surveys_survey.token
    description: Unique token generated for this survey dispatch, used to link the survey to its customer response.
  is_pending:
    lineage:
      - datalake_chat_fup_raw.surveys_survey.pending
    description: Boolean flag indicating whether the customer has not yet responded to this survey.
  ts_created:
    lineage:
      - datalake_chat_fup_raw.surveys_survey.created_at
    description: Timestamp when the survey was created and dispatched to the customer.
  ts_updated:
    lineage:
      - datalake_chat_fup_raw.surveys_survey.updated_at
    description: Timestamp of the last update to the survey record (e.g., when the customer responded).
  id_chat:
    lineage:
      - datalake_chat_fup_raw.surveys_survey.chat_id
    description: Identifier of the chat session (from chats_chat) that triggered this post-chat survey.
