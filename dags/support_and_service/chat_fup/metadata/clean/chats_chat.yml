database_name: datalake_chat_fup_clean
table_name: chats_chat
description: >
  One row per chat session handled in the Chat Fup platform. Records the customer and
  attendant involved, whether the chat was answered by a bot or a human agent, the
  associated support ticket, and key timestamps (creation, first attendance, last update).
  Source system is Chat Fup.
domain: Support and Services
owner: gabriel.firmino@quintoandar.com.br
columns:
  id:
    description: Primary key. Unique identifier of the chat record in the Chat FUP source database.
    lineage:
      - datalake_chat_fup_raw.chats_chat.id
    description: Unique identifier for the chat session in the Chat Fup platform.
  id_ticket:
    description: Foreign key to the Zendesk ticket associated with the chat, when the chat generated a support ticket.
    lineage:
      - datalake_chat_fup_raw.chats_chat.ticket_id
  id_support_session:
    description: Identifier of the support session the chat originated from, as stored by Chat FUP. For sessions handled by the Support Session Service this is its public_id (UUID); for legacy Sauron sessions it is Sauron's numeric session id. Both coexist today and converge to the Support Session Service public_id as the migration completes. Carried through to the satisfaction-rating models as id_support_session.
    lineage:
      - datalake_chat_fup_raw.chats_chat.session_id
  attendant_email:
    description: Email of the attendant (agent) who handled the chat.
    lineage:
      - datalake_chat_fup_raw.chats_chat.attendant_email
    description: Email address of the support agent who attended this chat session.
  ts_created:
    description: Timestamp when the chat record was created in the source system.
    lineage:
      - datalake_chat_fup_raw.chats_chat.created_at
    description: Timestamp when the chat session was created in Chat Fup.
  ts_updated:
    description: Timestamp of the most recent update to the chat record in the source system.
    lineage:
      - datalake_chat_fup_raw.chats_chat.updated_at
    description: Timestamp of the last update to the chat session record.
  attendant_name:
    description: Name of the attendant (agent) who handled the chat.
    lineage:
      - datalake_chat_fup_raw.chats_chat.attendant_name
    description: Full name of the support agent who attended this chat session.
  is_bot_answered:
    description: Boolean flag indicating whether the chat was answered by the bot.
    lineage:
      - datalake_chat_fup_raw.chats_chat.bot_answered
    description: Boolean flag indicating whether the chat was answered and resolved by an automated bot rather than a human agent.
  customer_email:
    description: Email of the customer served in the chat.
    lineage:
      - datalake_chat_fup_raw.chats_chat.customer_email
    description: Email address of the customer who initiated the chat session.
  customer_name:
    description: Name of the customer served in the chat.
    lineage:
      - datalake_chat_fup_raw.chats_chat.customer_name
    description: Full name of the customer who initiated the chat session.
  customer_phone:
    description: Phone number of the customer served in the chat.
    lineage:
      - datalake_chat_fup_raw.chats_chat.customer_phone
    description: Phone number of the customer who initiated the chat session.
  ts_attended:
    description: Timestamp when the chat was first attended by the agent.
    lineage:
      - datalake_chat_fup_raw.chats_chat.attended_at
    description: Timestamp when a support agent first attended (responded to) the chat session.
  group_name:
    description: Name of the support group or queue responsible for the chat.
    lineage:
      - datalake_chat_fup_raw.chats_chat.group_name
    description: Name of the support group or queue to which this chat session was routed.
  ts_ticket_updated:
    description: Timestamp of the most recent update to the ticket associated with the chat.
    lineage:
      - datalake_chat_fup_raw.chats_chat.ticket_updated_at
    description: Timestamp of the last update to the linked support ticket associated with this chat.
