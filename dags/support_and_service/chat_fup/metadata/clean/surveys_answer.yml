database_name: datalake_chat_fup_clean
table_name: surveys_answer
description: >
  One row per customer response to a post-chat survey in the Chat Fup platform. Captures
  whether the customer considered their issue resolved, their satisfaction rating, and any
  optional free-text comment. Each answer is linked to a specific survey instance.
  Source system is Chat Fup.
domain: Support and Services
owner: gabriel.firmino@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_chat_fup_raw.surveys_answer.id
    description: Unique identifier for the survey answer record.
  is_solved:
    lineage:
      - datalake_chat_fup_raw.surveys_answer.solved
    description: Boolean flag indicating whether the customer reported their issue as solved after the chat interaction.
  rating:
    lineage:
      - datalake_chat_fup_raw.surveys_answer.rating
    description: Numeric satisfaction score provided by the customer in the post-chat survey.
  comment:
    lineage:
      - datalake_chat_fup_raw.surveys_answer.comment
    description: Optional free-text comment submitted by the customer alongside their survey rating.
  ts_created:
    lineage:
      - datalake_chat_fup_raw.surveys_answer.created_at
    description: Timestamp when the customer submitted this survey answer.
  ts_updated:
    lineage:
      - datalake_chat_fup_raw.surveys_answer.updated_at
    description: Timestamp of the last update to the survey answer record.
  id_survey:
    lineage:
      - datalake_chat_fup_raw.surveys_answer.survey_id
    description: Identifier of the survey instance (from surveys_survey) that this answer belongs to.
