---
database_name: datalake_braze_dispatches
table_name: email_affiliates
owner: gabriel.firmino@quintoandar.com.br
domain: Support and Services
description: Table with details about communications sent through email to affiliates. Joins multiple event types to give a complete picture of the email lifecycle for each user on a given day.

columns:
  id_user_dispatch:
    description: Unique identifier for each user dispatch event
    lineage:
      - datalake_braze.events_affiliates.id_user_dispatch

  id_user_braze:
    description: Unique identifier for the user in the Braze system
    lineage:
      - datalake_braze.events_affiliates.id_user_braze

  id_user:
    description: General unique identifier for the user
    lineage:
      - datalake_braze.events_affiliates.id_user
  
  event_channel:
    description: Channel through which the event was triggered, in this case, all braze events related to emails
    lineage:
      - datalake_braze.events_affiliates.event_channel
  
  ts_email_sent:
    description: Timestamp when the email was sent
    lineage:
      - datalake_braze.events_affiliates.ts_event

  ts_email_delivered:
    description: Timestamp when the email was successfully delivered
    lineage:
      - datalake_braze.events_affiliates.ts_event
  
  ts_email_opened:
    description: Timestamp when the email was opened by the user
    lineage:
      - datalake_braze.events_affiliates.ts_event

  ts_email_clicked:
    description: Timestamp when a link in the email was clicked by the user
    lineage:
      - datalake_braze.events_affiliates.ts_event

  ts_email_bounced:
    description: Timestamp when the email bounced
    lineage:
      - datalake_braze.events_affiliates.ts_event
  
  ts_email_spammed:
    description: Timestamp when the email was marked as spam
    lineage:
      - datalake_braze.events_affiliates.ts_event

  ts_email_unsubscribed:
    description: Timestamp when the user unsubscribed from the email list
    lineage:
      - datalake_braze.events_affiliates.ts_event

  year:
    description: The year the event occurred
    lineage:
      - datalake_braze.events_affiliates.year

  month:
    description: The month the event occurred
    lineage:
      - datalake_braze.events_affiliates.month

  day:
    description: The day the event occurred
    lineage:
      - datalake_braze.events_affiliates.day
