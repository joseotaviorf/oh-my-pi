---
database_name: datalake_braze_dispatches
table_name: email_tenants
owner: gabriel.firmino@quintoandar.com.br
domain: Support and Services
description: Table with details about communications sent through email.
columns:
  id_user:
    description: Unique code to identify an user created here at QuintoAndar.
  id_user_dispatch:
    description: The combination of id_dispatch and id_user.
    lineage:
      - datalake_braze.events_tenants.id_user_dispatch
  id_user_braze:
    description: Unique code to identify an user created by Braze.
    lineage:
      - datalake_braze.events_tenants.id_user_braze
  event_channel:
    description: Through where the event occurred. In this table it's going to be only email.
    lineage:
      - datalake_braze.events_tenants.event_channel
  ts_email_sent:
    description: Timestamp of when the email was sent.
    lineage:
      - datalake_braze.events_tenants.ts_event
  ts_email_delivered:
    description: Timestamp of when the email was delivered.
    lineage:
      - datalake_braze.events_tenants.ts_event
  ts_email_opened:
    description: Timestamp of when the email was opened.
    lineage:
      - datalake_braze.events_tenants.ts_event
  ts_email_clicked:
    description: Timestamp of when the email was clicked.
    lineage:
      - datalake_braze.events_tenants.ts_event
  ts_email_bounced:
    description: Timestamp of when the email was bouced.
    lineage:
      - datalake_braze.events_tenants.ts_event
  ts_email_spammed:
    description: Timestamp of when the email was classified as spam.
    lineage:
      - datalake_braze.events_tenants.ts_event
  ts_email_unsubscribed:
    description: Timestamp of when the email led to an unsubscribe.
    lineage:
      - datalake_braze.events_tenants.ts_event
  year:
    description: Year of when the information was updated.
    lineage:
      - datalake_braze.events_tenants.year
  month:
    description: Month of when the information was updated.
    lineage:
      - datalake_braze.events_tenants.month
  day:
    description: Day of when the information was updated.
    lineage:
      - datalake_braze.events_tenants.day
