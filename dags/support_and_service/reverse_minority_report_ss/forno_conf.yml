---
dag_documentation:
  dag_purpose: This DAG is responsible for sending data from S&S models to Minority Report

tables:
  bic_ss:
    key_name: userId
    key_value: id_user
    type: CUSTOMER_DATA
  inspector_performance:
    key_name: agentIdr
    key_value: id_inspector
    type: INSPECTORS_PERFORMANCE
  inside_sales_whitelist:
    key_name: phoneNumber
    key_value: phone_number
    type: CUSTOMER_PHONE_NUMBER_WHITELIST
  pp_multi_assistants_whitelist:
    key_name: phoneNumber
    key_value: phone_number
    type: CUSTOMER_PHONE_NUMBER_WHITELIST
  bpo_performance:
    key_name: csatKey
    key_value: key_csat
    type: BPO_PERFORMANCE

custom_cluster:
  autotermination_minutes: 20
  driver_node_type_id: r5a.4xlarge
  node_type_id: r5a.4xlarge
  num_workers: 3
  spark_version: 13.3.x-scala2.12
  aws_attributes:
    first_on_demand: 1
    spot_bid_price_percent: 100
    zone_id: us-east-1d
    availability: SPOT_WITH_FALLBACK
    ebs_volume_size: 200
  spark_conf:
    spark.driver.maxResultSize: "0"
