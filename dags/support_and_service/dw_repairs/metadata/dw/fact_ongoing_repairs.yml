  sk_contract:
    description: Contract unique identifier.
    lineage:
      - datalake_repairs.repair_tickets.id_contract
  sk_user:
    description: User unique identifier.
    lineage:
      - datalake_zendesk.tickets_current.id_user_main
  sk_agent:
    description: Unique agent identifier.
    lineage:
      - datalake_repairs.repair_tickets.agent_email
  sk_budget_sender: 
    description: Sender Budget unique identifier.
    lineage:
