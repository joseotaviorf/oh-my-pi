database_name: dw_repairs
table_name: fact_repair_ongoing
description: THIS TABLE WILL BE DEPRECATED SOON!!!
  Table stores data on ongoing repair requests. This data includes information about the customer,
  the repair, the responsible analyst, and the repair status. The table is used to analyze the performance of the repair process,
  including response time, resolution time, costs, delay reasons, and success factors.
domain: Support and Services
owner: data-ae-ss@quintoandar.com.br
columns:
  sk_ticket:
    description: Ticket unique identifier.
    lineage:
      - datalake_repairs.repair_tickets.id_ticket
  sk_request:
    description: Repair request unique identifier.
    lineage:
      - datalake_repairs.repair_tickets.id_request
  sk_contract:
    description: Contract unique identifier.
    lineage:
      - datalake_repairs.repair_tickets.id_contract
  sk_user:
    description: User unique identifier.
    lineage:
      - datalake_zendesk.tickets_current.id_user_main
  sk_agent:
    description: Unique agent identifier.
    lineage:
      - datalake_repairs.repair_tickets.agent_email
  sk_budget_sender:
    description: Sender Budget unique identifier.
    lineage:
      - datalake_repairs_clean.repair_request_budget.id_budget_sender
  sk_first_interaction:
    description: Foreign key referring to the first iteration of the repair request. Can be joined with dw_public.dim_date.
    lineage:
      - datalake_repairs.repair_tickets.ts_first_interaction
  sk_created_local:
    description: Foreign key referring to that indicates when the ticket was created. Can be joined with dw_public.dim_date.
    lineage:
      - datalake_repairs.repair_tickets.ts_created_local
  sk_solved_local:
    description: Foreign key referring to that indicates when the ticket was solved. Can be joined with dw_public.dim_date.
    lineage:
      - datalake_repairs.repair_tickets.ts_solved_local
  sk_request_created:
    description: Foreign key referring to that indicates when the repair request was created. Can be joined with dw_public.dim_date.
    lineage:
      - datalake_repairs.repair_tickets.ts_request_created
  sk_created_chat:
    description: Foreign key referring to the date and time when the first chat conversation for the repair request was started. Can be joined with dw_public.dim_date.
    lineage:
      - datalake_repairs_clean.repair_request_chat.ts_started
  sk_updated_local:
    description: Foreign key referring to that indicates when the ticket was updated. Can be joined with dw_public.dim_date.
    lineage:
      - datalake_repairs.repair_tickets.ts_updated_local
  sk_initially_assigned_local:
    description: Foreign key referring to that indicates when the first analyst to answer the ticket signed it. Can be joined with dw_public.dim_date.
    lineage:
      - datalake_repairs.repair_tickets.ts_initially_assigned_local
  sk_last_assigned_local:
    description: Foreign key referring to that indicates when the last analyst to answer the ticket signed it. Can be joined with dw_public.dim_date.
    lineage:
      - datalake_repairs.repair_tickets.ts_last_assigned_local
  sk_closed_local:
    description: Foreign key referring to that indicates when the ticket was closed. Can be joined with dw_public.dim_date.
    lineage:
      - datalake_repairs.repair_tickets.ts_closed_local
  sk_measurement:
    description: Foreign key referring to the date and time of the first measurement taken for the repair (if applicable). Can be joined with dw_public.dim_date.
    lineage:
      - datalake_repairs.repair_tickets.custom_fields
  sk_first_reply_milestone:
    description: Foreign key referring to the date and time the ticket reached the "First Reply" milestone (as defined in the Zendesk ticket funnel metrics). Can be joined with dw_public.dim_date.
    lineage:
      - datalake_repairs.repair_tickets.custom_fields
  sk_first_public_comment:
    description:
      Foreign key referring to estimated date on which the first public comment was added to the ticket based on the ticket creation date
      and the average reply time in calendar minutes (from Zendesk ticket funnel metrics). Can be joined with dw_public.dim_date.
    lineage:
      - datalake_zendesk.tickets_currentreply_time_min_calendar
      - datalake_repairs.repair_tickets.ts_created_local
  reopens:
    description: The number of times the ticket was reopened after it was first marked as solved.
    lineage:
      - datalake_repairs.repair_tickets.reopens
  relisting:
    description: Integer type data that indicates the number of times the listing was updated.
    lineage:
      - datalake_repairs.repair_tickets.relisting
  replies:
    description: Integer type data that indicates the number of times the ticket was replied.
    lineage:
      - datalake_repairs.repair_tickets.replies
  has_chat_negociation:
    description: Boolean data that indicates whether the repair was negotiated via chat.
    lineage:
      - datalake_repairs.repair_tickets.has_chat_negociation
  ongoing:
    description: Indicates whether the repair request is still open (ongoing) or has been closed.
    lineage:
      - datalake_repairs.repair_tickets.ts_created_local
      - datalake_repairs.repair_tickets.ts_solved_local
  frt:
    description: Full Repair Time, calculated as the difference in days between the ticket creation date (ts_created_local) and the ticket solved date (ts_solved_local).
    lineage:
      - datalake_repairs.repair_tickets.ts_created_local
      - datalake_repairs.repair_tickets.ts_solved_local
  created_front_or_back:
    description: Descriptive information that indicates whether the ticket is a back or front ticket.
    lineage:
      - datalake_repairs.repair_tickets.front_or_back
  is_other_responsability:
    description: Binary flag indicating whether the repair responsibility lies with a third-party company.
    lineage:
      - datalake_repairs.repair_tickets.tags
  days_to_firs_reply:
    description: Number of days it took for the ticket to receive its first reply after creation.
    lineage:
      - datalake_repairs.repair_tickets.ts_created_local
      - datalake_repairs.repair_tickets.ts_first_reply_milestone
  ldt_fr_minutes:
    description: Amount of calendar minutes the ticket took to be replied
    lineage:
      - datalake_zendesk.tickets_currentreply_time_min_calendar
  dt_definition:
    description: Date in timestamp format indicating when the ticket suplier was set
    lineage:
      - datalake_repairs.repair_tickets.dt_definition
  dt_chat:
    description: Date in timestamp format indicating when the chat was started.
    lineage:
      - datalake_repairs.repair_tickets.dt_chat
  ts_reflux:
    description: Date in timestamp format that indicates when the ticket was reopened.
    lineage:
      - dw_tickets.fact_ticket_events.ts_event
  ts_contestation:
    description: Date in timestamp informe such as date that indicates when the contestation was requested.
    lineage:
      - dw_tickets.fact_ticket_events.ts_event
  ts_resolution_contestation:
    description: Date in timestamp that indicates when the contestation demand was resolved.
    lineage:
      - dw_tickets.fact_ticket_events.ts_event
  ts_first_open:
    description: Date in timestamp format that indicates when the ticket was first opened.
    lineage:
      - dw_tickets.fact_ticket_events.ts_event
  ts_help_request:
    description: Date in timestamp format that indicates when the ticket was requested.
    lineage:
      - datalake_repairs_clean.repair_request_tenant_negotiation_follow_up.ts_updated
  ts_load:
    description: Date in timestamp format that indicates when the ticket was loaded.
  year:
    description: Partition data, referring to the year of the ticket update date.
    lineage:
      - datalake_repairs.repair_tickets.year
  month:
    description: Partition data, referring to the month of the ticket update date.
    lineage:
      - datalake_repairs.repair_tickets.month
  day:
    description: Partition data, referring to the day of the ticket update date.
    lineage:
      - datalake_repairs.repair_tickets.day
