dag:
  name: dw_repairs
  schedule_start_date: 2022,12,31
  owner: Data SS
  documentation:
    dag_purpose: |
      This modeling aims to provide operational information related to ongoing repair tickets.
workflow:
  type: query_delta
  layer: dw
  custom_schema: repairs
  default_extraction_type: full
  tables_customization:
    dim_repair_ongoing:
      z_order_by: [sk_ticket]
      merge_on: [sk_ticket]
    fact_repair_ongoing:
      z_order_by: [
        sk_ticket,
        sk_request,
        sk_contract,
        sk_user,
        sk_agent,
        sk_budget_sender]
      merge_on: [sk_ticket]
cluster:
  type: custom_cluster
  custom_configurations:
    spark_version: 13.3.x-scala2.12
    driver_node_type_id: r6gd.4xlarge
    node_type_id: r6gd.4xlarge
    num_workers: 2
