output_table_name: offboarding_repair_predictions
custom_libraries: [{ pypi: { "package": "scikit-learn>=0.24.0" } }]
partitions: ["dt_booked"]
model_filename: /dbfs/FileStore/models/inspections/off_repair_prediction_rf_model_v0.pkl
input_query: "SELECT * FROM datalake_offboarding_repairs_probability.contracts WHERE dt_booked = DATE('{execution_date}')"
threshold: 0.42
partition_cols: ["dt_predicted"]

dag_documentation:
  dag_purpose: |
    Enrich Offboarding Repairs Probability DAG runs a spark job that uses a Scikit-learn model to predict the probability of an
    offboarding inspection resulting in a repair. This DAG also saves the input data used for predictions as a table named `contracts`.
    The model is stored in Databricks File System, in the path:

    ```
    /dbfs/FileStore/models/inspections/
    ```
  additional_information: |
    The resulting table of this enrich DAG is different than other enrich DAGs as it's not a direct result of a query execution,
    but a result of a Scikit-learn model applied on a query result set.
