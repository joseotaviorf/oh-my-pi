database_name: datalake_offboarding_repairs_probability
table_name: offboarding_repair_predictions
description: Table that concentrates the results of the repair probability 
  predictive model, each line represents a contract.
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  id_contract:
    description: Primary contract identification key.
  dt_booked:
    description: Date of inspection visit.
  predicted_offboarding_repair_probability:
    description: Percentage of probability of repair occurring.
  predicted_offboarding_repair:
    description: Binary information (1/0) that uses predictive information as a basis to identify whether the repair will be carried out or not.
  threshold:
    description: Percentage limit used to define the repair.
  model_filename:
    description: Name of the template file we pulled the information from.
  dt_predicted:
    description: Date the prediction was made.
