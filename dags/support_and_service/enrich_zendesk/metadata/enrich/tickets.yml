    description: Problem ticket linked with the current ticket, if exists. If this is filled, then the ticket is of 'incident' type
    lineage:
      - datalake_zendesk_clean.tickets.custom_fields
  id_house:
    description: House ID associated with the ticket
    lineage:
      - datalake_zendesk_clean.tickets.custom_fields
  id_contract:
    description: Contract ID associated with the ticket
    lineage:
      - datalake_zendesk_clean.tickets.custom_fields
  id_session:
