database_name: datalake_zendesk
table_name: tickets
description: Table containing all ticket information, including custom_fields
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  id_ticket:
    description: Ticket ID from Zendesk
    lineage:
      - datalake_zendesk_clean.tickets.id_ticket
  id_ticket_form:
    description: Ticket form ID from Zendesk
    lineage:
      - datalake_zendesk_clean.tickets.id_ticket_form
  id_assignee:
    description: ID of the user assigned to the ticket
    lineage:
      - datalake_zendesk_clean.tickets.id_assignee
  id_group:
    description: ID of the group of the ticket
    lineage:
      - datalake_zendesk_clean.tickets.id_group
