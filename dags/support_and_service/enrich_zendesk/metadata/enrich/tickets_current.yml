database_name: datalake_zendesk
table_name: tickets_current
description: Table containing tickets and ticket metrics data
domain: Support and Services
owner: gabriel.firmino@quintoandar.com.br
columns:
  id_ticket:
    description: External ticketing platform identifier for the customer support case record.
    lineage:
      - datalake_zendesk.tickets.id_ticket
  id_ticket_form:
    description: Zendesk ticket form id determining which fields appear on the ticket.
    lineage:
      - datalake_zendesk.tickets.id_ticket_form
  id_assignee:
    description: ID of the user assigned to the ticket
    lineage:
      - datalake_zendesk.tickets.id_assignee
  id_requester:
    description: Zendesk user id of the ticket requester
    lineage:
      - datalake_zendesk.tickets.id_requester
