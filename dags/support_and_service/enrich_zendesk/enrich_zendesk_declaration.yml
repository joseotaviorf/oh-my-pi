dag:
    name: enrich_zendesk
    owner: Data SS
    documentation:
        dag_purpose: |
            This DAG comprises all the logic on ticket and ticket metrics from Zendesk.
workflow:
    type: query
    layer: enrich
    inner_dependencies:
        tickets_current:
            - ticket_metrics
            - tickets
    default_extraction_type: incremental
    default_partitions: ["year", "month", "day"]
    tables_customization:
        tickets_curent:
            extraction_type: full
cluster:
    type: custom_cluster
    custom_configurations:
        driver_node_type_id: r5d.8xlarge
        node_type_id: r5d.8xlarge
        runtime_engine: PHOTON
        spark_version: 12.2.x-scala2.12
        num_workers: 4
        spark_conf:
            spark.sql.mapKeyDedupPolicy: "LAST_WIN"
