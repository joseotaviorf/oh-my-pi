dag:
    name: enrich_zendesk
    owner: Data SS
    documentation:
        dag_purpose: |
            This DAG comprises all the logic on ticket and ticket metrics from Zendesk.
workflow:
    type: query_delta
    layer: enrich
    inner_dependencies:
        tickets_current:
            - ticket_metrics
            - tickets
    default_extraction_type: incremental
    default_partitions: ["year", "month", "day"]
    tables_customization:
        tickets_curent:
            extraction_type: full
        tickets_metric:
            z_order_by: [id_ticket]
        tickets:
            z_order_by: [id_ticket]
    extra_query_template_params:
        load_start_date: "{{ get_date_param(dag_run, ds, 'load_start_date') }}"
        load_end_date: "{{ get_date_param(dag_run, ds, 'load_end_date') }}"
cluster:
    type: custom_cluster
    custom_configurations:
        driver_node_type_id: r7g.4xlarge
        node_type_id: r7g.8xlarge
        spark_version: 13.3.x-scala2.12
        num_workers: 5
        spark_conf:
            spark.sql.mapKeyDedupPolicy: "LAST_WIN"
