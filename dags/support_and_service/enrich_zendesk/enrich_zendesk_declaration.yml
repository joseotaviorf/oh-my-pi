dag:
    name: enrich_zendesk
    owner: Data SS
    documentation:
        dag_purpose: |
            This DAG comprises all the logic on ticket and ticket metrics from Zendesk.
workflow:
    type: query
    layer: enrich
    inner_dependencies:
        tickets_current:
            - ticket_metrics
            - tickets
    default_extraction_type: incremental
    default_partitions: ["year", "month", "day"]
    tables_customization:
        tickets_curent:
            extraction_type: full
cluster:
    type: databricks_10_4_max_io-memory_photon_cluster
    custom_configurations:
        spark_conf:
            spark.sql.mapKeyDedupPolicy: "LAST_WIN"
