dag:
  name: enrich_zendesk
  owner: Data SS
  documentation:
    dag_purpose: |
      This DAG comprises all the logic on ticket and ticket metrics from Zendesk.

workflow:
  type: query_delta
  layer: enrich
  inner_dependencies:
    tickets_current:
      - ticket_metrics
      - tickets
  default_extraction_type: incremental
  tables_customization:
    tickets_current:
      merge_on: [id_ticket]
      z_order_by: [ts_updated, ts_created, id_ticket]
      table_properties:
        "delta.dataSkippingNumIndexedCols": "0"
        "delta.dataSkippingStatsColumns": "ts_updated,ts_created,id_ticket"
    ticket_metrics:
      merge_on: [id_ticket]
      when_matched_update_condition: "source.ts_updated > target.ts_updated OR (source.ts_updated = target.ts_updated AND source.ts_solved IS NOT NULL AND target.ts_solved IS NULL)"
      z_order_by: [id_ticket, ts_created]
      table_properties:
        "delta.dataSkippingNumIndexedCols": "0"
        "delta.dataSkippingStatsColumns": "ts_updated,ts_created,id_ticket"
    tickets:
      merge_on: [id_ticket, ts_updated]
      z_order_by: [ts_updated, id_ticket]
      table_properties:
        "delta.dataSkippingNumIndexedCols": "0"
        "delta.dataSkippingStatsColumns": "ts_updated,ts_created,id_ticket"

