---
database_name: datalake_jaiminho_clean
table_name: campaigns
description: This table consolidates campaigns comms data from Jaiminho.
domain: Support and Services
owner: gabriel.firmino@quintoandar.com.br
columns:
  id:
    description: Unique identifier for the campaign.
    lineage:
      - datalake_jaiminho_raw.campaigns.id
  id_user:
    description: Identifier of the user who created or manages the campaign.
    lineage:
      - datalake_jaiminho_raw.campaigns.userId
  channel:
    description: Communication channel used for the campaign (e.g., email, SMS, push notification).
    lineage:
      - datalake_jaiminho_raw.campaigns.channel
  country:
    description: Country where the campaign is targeted or executed.
    lineage:
      - datalake_jaiminho_raw.campaigns.country
  env:
    description: Environment where the campaign was executed (e.g., production, staging).
    lineage:
      - datalake_jaiminho_raw.campaigns.env
  name:
    description: Human-readable name or title of the campaign.
    lineage:
      - datalake_jaiminho_raw.campaigns.name
  status:
    description: Current status of the campaign (e.g., draft, active, completed, paused).
    lineage:
      - datalake_jaiminho_raw.campaigns.status
  size:
    description: Number of recipients or scope size of the campaign.
    lineage:
      - datalake_jaiminho_raw.campaigns.size
  template:
    description: Template identifier or name used for the campaign messaging.
    lineage:
      - datalake_jaiminho_raw.campaigns.template
  user_email:
    description: Email address of the user who created or manages the campaign.
    lineage:
      - datalake_jaiminho_raw.campaigns.userEmail
  ts_created:
    description: Timestamp when the campaign was created.
    lineage:
      - datalake_jaiminho_raw.campaigns.createdAt
  ts_updated:
    description: Timestamp when the campaign was last updated.
    lineage:
      - datalake_jaiminho_raw.campaigns.updatedAt
  ts_sent:
    description: Timestamp when the campaign was sent or executed.
    lineage:
      - datalake_jaiminho_raw.campaigns.sentAt
  year:
    description: Year extracted from the campaign update timestamp. Partition column — filter on this column to enable partition pruning.
    lineage:
      - datalake_jaiminho_raw.campaigns.updatedAt
  month:
    description: Month extracted from the campaign update timestamp. Partition column — filter on this column to enable partition pruning.
    lineage:
      - datalake_jaiminho_raw.campaigns.updatedAt
  day:
    description: Day extracted from the campaign update timestamp. Partition column — filter on this column to enable partition pruning.
    lineage:
      - datalake_jaiminho_raw.campaigns.updatedAt
