---
database_name: datalake_jaiminho_clean
table_name: notifications_delivery
description: This table consolidates all records of communications delivered from Jaiminho.
domain: Support and Services
owner: conrado.fabri@quintoandar.com.br
columns:
  id:
    description: Unique identifier for the notification delivery record.
    lineage:
      - datalake_jaiminho_raw.notifications_delivery.id
  id_notification:
    description: Identifier of the notification that was delivered.
    lineage:
      - datalake_jaiminho_raw.notifications_delivery.notificationId
  uid_message:
    description: Unique identifier for the message within the delivery system.
    lineage:
      - datalake_jaiminho_raw.notifications_delivery.messageUid
  status:
    description: Delivery status of the notification (e.g., delivered, failed, pending).
    lineage:
      - datalake_jaiminho_raw.notifications_delivery.status
  dispatcher:
    description: Service or system component responsible for dispatching the notification.
    lineage:
      - datalake_jaiminho_raw.notifications_delivery.dispatcher
  tracing_context:
    description: Context information used for tracing the delivery process.
    lineage:
      - datalake_jaiminho_raw.notifications_delivery.tracingContext
  result:
    description: Result details or outcome of the delivery attempt.
    lineage:
      - datalake_jaiminho_raw.notifications_delivery.result
  ts_created:
    description: Timestamp when the delivery record was created.
    lineage:
      - datalake_jaiminho_raw.notifications_delivery.createdAt
  ts_updated:
    description: Timestamp when the delivery record was last updated.
    lineage:
      - datalake_jaiminho_raw.notifications_delivery.updatedAt
  year:
    description: Year extracted from the delivery update timestamp for partitioning.
    lineage:
      - datalake_jaiminho_raw.notifications_delivery.updatedAt
  month:
    description: Month extracted from the delivery update timestamp for partitioning.
    lineage:
      - datalake_jaiminho_raw.notifications_delivery.updatedAt
  day:
    description: Day extracted from the delivery update timestamp for partitioning.
    lineage:
      - datalake_jaiminho_raw.notifications_delivery.updatedAt
