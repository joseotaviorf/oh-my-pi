dag:
  name: jaiminho
  schedule_start_date: 2021, 11, 30
  schedule_interval: 0 0 * * *
  owner: Data SS
  documentation:
    dag_purpose: |
      Retrieves data from the Jaiminho database (PostgreSQL). [Jaiminho](https://github.com/quintoandar/jaiminho)
        is a microservice that handles notification schedule processing.
workflow:
  type: cdc
  layer: raw
  database_type: postgres
  source_schema: jaiminho
  dbutils_secret_key: JAIMINHO_DB
  lineage_product_database_name: jaiminho
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_end | ds, -1), 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, macros.ds_add(data_interval_end | ds, -1), 'load_end_date') }}"
  tables_customization:
    user_notifications:
      clean_table_name: user_notifications
      raw_primary_keys: [id]
      clean_primary_keys: [id]
    notifications_delivery:
      clean_table_name: notifications_delivery
      raw_primary_keys: [id]
      clean_primary_keys: [id]
    events:
      clean_table_name: events
      raw_primary_keys: [id]
      clean_primary_keys: [id]
    event_traces:
      clean_table_name: event_traces
      raw_primary_keys: [id]
      clean_primary_keys: [id]
    campaigns:
      clean_table_name: campaigns
      raw_primary_keys: [id]
      clean_primary_keys: [id]
    notifications_tracking:
      clean_table_name: notifications_tracking
      raw_primary_keys: [id]
      clean_primary_keys: [id]
    user_contacts:
      clean_table_name: user_contacts
      raw_primary_keys: [id]
      clean_primary_keys: [id]
    notifications:
      clean_table_name: notifications
      raw_primary_keys: [id]
      clean_primary_keys: [id]
