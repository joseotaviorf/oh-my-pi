cluster:
  type: emr_7_12_consolidation_xl_memory_fleet_cluster
  custom_configurations:
    # Driver stays at 16g; an 8xlarge master would only add cost.
    master_node_type_id: r6g.4xlarge
    aws_attributes:
      ebs_volume_size: 500
    step_concurrency_level: 3
    core_nodes:
      instance_types:
        - r6g.8xlarge
        - r7g.8xlarge
        - r6i.8xlarge
      target_on_demand: 2
      target_spot: 0
    task_nodes:
      instance_types:
        - r6g.8xlarge
        - r7g.8xlarge
        - r6i.8xlarge
      target_on_demand: 4
      target_spot: 0
      max_nodes: 6
      allocation_strategy: price-capacity-optimized
      bid_price_percentage: 100
    spark_conf:
      spark.driver.memory: 16g
      spark.driver.memoryOverhead: 4g
      spark.yarn.am.memory: 4g
      spark.executor.cores: "4"
      spark.executor.memory: 48g
      spark.executor.memoryOverhead: 8g
      spark.dynamicAllocation.maxExecutors: "24"
      spark.sql.shuffle.partitions: "600"
      spark.memory.fraction: "0.8"
      spark.memory.storageFraction: "0.2"
