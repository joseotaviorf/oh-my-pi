dag:
  name: dw_sauron
  schedule_start_date: 2022,12,02
  owner: Data SS
  documentation:
    dag_purpose: |
      This DAG loads the DW tables with the sessions data from our Sauron database.
      [Sauron](https://github.com/quintoandar/sauron) is the messaging orchestration service,
      and it controls the user session when someone contact our customer service lines.
workflow:
  type: query
  layer: dw
  custom_schema: sauron
cluster:
  type: databricks_10_4_med_2xlarge_general_photon_cluster
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE
