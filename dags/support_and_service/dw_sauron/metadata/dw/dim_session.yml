---
database_name: dw_sauron
table_name: dim_session
description: 
  Dimension table with the aim of consolidating metrics, 
  keys and dates in the context of Sauron sessions.
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  sk_session:
    description: Primary key that identifies the service session.
    lineage:
      - datalake_sauron.session.id_session
  source:
    description: Descriptive information indicating the source of the session.
    lineage:
      - datalake_sauron.session.source_environment
  attendance:
    description: Platform where the session was made.
    lineage:
      - datalake_sauron.session.agent
  department_name:
    description: Descriptive information about the department related to the service session.
    lineage:
      - datalake_sauron.session.department
  customer_phone:
    description: Customer telephone number related to the service session.
    lineage:
      - datalake_sauron.session.customer_phone_formatted
  user_type:
    description: Type of customer served in the service session.
    lineage:
      - datalake_sauron.session.customer_type
  flow_step:
    description: Descriptive information about the stage of the journey the customer is in.
    lineage:
      - datalake_sauron.session.customer_flow_step
  status:
    description: Descriptive data that indicates the status of the service session.
    lineage:
      - datalake_sauron.session.status
  ts_created:
    description: Date in timestamp format that indicates when the session was created.
    lineage:
      - datalake_sauron.session.ts_created
  ts_first_message:
    description: Date in timestamp format that indicates when the first message of the session was sent.
    lineage:
      - datalake_sauron.session.ts_first_message
  ts_updated:
    description: Date in timestamp format that indicates when the session was updated.
    lineage:
      - datalake_sauron.session.ts_updated
  ts_load:
    description: Timestamp of when the table was last processed.
