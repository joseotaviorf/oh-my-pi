---
database_name: dw_sauron
table_name: fact_sessions
description: Fact table that includes service session data, with sauron as the main source. 
  Each row in the table represents a session on Sauron.
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  sk_session:
    lineage:
      - datalake_sauron.session.id_session
    description: Primary key that identifies the service session.
  sk_conversation:
    lineage:
      - datalake_quinto_messenger.channel.id_conversation
    description: Identification key for the text conversation, using the quinto messenger as the source.
  sk_user:
    lineage:
      - datalake_sauron.session.id_user
    description: User identification key.
  sk_personal_document:
    lineage:
      - datalake_ebdb_customer_contact_identification.customer_contact_identification.cpf
    description: User CPF.
  sk_created_date:
    lineage:
      - datalake_sauron.session.ts_created
    description: Session creation date, in timestamp format.
  is_retained_by_bot:
    lineage:
      - datalake_quinto_messenger.channel.id_source
    description: Boolean data that indicates whether the bot avoided human assistance.
  minutes_duration:
    lineage:
      - datalake_sauron.session.seconds_duration
    description: Service duration, in minutes.
