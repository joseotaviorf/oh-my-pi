---
database_name: dw_braze
table_name: dim_canvas
description: Dimension table containing information about Braze canvas related to affiliates, owners, and tenants
domain: Support and Services
owner: cristina.cardoso@quintoandar.com.br
columns:
  sk_variant_canvas:
    description: Unique identifier of the canvas variant as defined in the Braze Platform, used to distinguish individual variants within a canvas.
  sk_canvas:
    lineage:
      - datalake_braze_details_clean.canvas_details_indica_ai.id_canvas
      - datalake_braze_details_clean.canvas_details_owners.id_canvas
      - datalake_braze_details_clean.canvas_details_tenants.id_canvas
    description: The canvas ID as defined in Braze Platform.
  user_type:
    lineage:
      - datalake_braze_details_clean.canvas_details_indica_ai.id_canvas
      - datalake_braze_details_clean.canvas_details_owners.id_canvas
      - datalake_braze_details_clean.canvas_details_tenants.id_canvas
    description: App group the canvas belongs to. Identifies the user segment targeted by the canvas (affiliates, owners, or tenants).
  canvas_name:
    lineage:
      - datalake_braze_details_clean.canvas_details_indica_ai.canvas_name
      - datalake_braze_details_clean.canvas_details_owners.canvas_name
      - datalake_braze_details_clean.canvas_details_tenants.canvas_name
    description: The canvas name as defined in Braze Platform.
  variant_name:
    description: Name of the canvas variant as defined in the Braze Platform, used to identify specific paths within a multi-variant canvas.
  canvas_description:
    lineage:
      - datalake_braze_details_clean.canvas_details_indica_ai.canvas_description
      - datalake_braze_details_clean.canvas_details_owners.canvas_description
      - datalake_braze_details_clean.canvas_details_tenants.canvas_description
    description: The canvas description as defined in Braze Platform.
  schedule_type:
    lineage:
      - datalake_braze_details_clean.canvas_details_indica_ai.schedule_type
      - datalake_braze_details_clean.canvas_details_owners.schedule_type
      - datalake_braze_details_clean.canvas_details_tenants.schedule_type
    description: Describes what triggers the canvas to be sent.
    categories:
      action_based: When a canvas is sent after a user completes a certain event.
      api_triggered: When a canvas is sent after a API trigger.
      time_based: When a canvas is sent in a scheduled time. 
  is_archived:
    lineage:
      - datalake_braze_details_clean.canvas_details_indica_ai.archived
      - datalake_braze_details_clean.canvas_details_owners.archived
      - datalake_braze_details_clean.canvas_details_tenants.archived
    description: Boolean indicating whether the canvas is archived.
  is_draft:
    lineage:
      - datalake_braze_details_clean.canvas_details_indica_ai.draft
      - datalake_braze_details_clean.canvas_details_owners.draft
      - datalake_braze_details_clean.canvas_details_tenants.draft
    description: Boolean indicating whether the canvas is a draft.
  ts_first_entry:
    lineage:
      - datalake_braze_details_clean.canvas_details_indica_ai.ts_first_entry
      - datalake_braze_details_clean.canvas_details_owners.ts_first_entry
      - datalake_braze_details_clean.canvas_details_tenants.ts_first_entry
    description: Timestamp of when the canvas had its first entry.
  ts_last_entry:
    lineage:
      - datalake_braze_details_clean.canvas_details_indica_ai.ts_last_entry
      - datalake_braze_details_clean.canvas_details_owners.ts_last_entry
      - datalake_braze_details_clean.canvas_details_tenants.ts_last_entry
    description: Timestamp of when the canvas had its last entry.
  ts_created:
    lineage:
      - datalake_braze_details_clean.canvas_details_indica_ai.ts_created
      - datalake_braze_details_clean.canvas_details_owners.ts_created
      - datalake_braze_details_clean.canvas_details_tenants.ts_created
    description: Timestamp of when the canvas was created.
  ts_updated:
    lineage:
      - datalake_braze_details_clean.canvas_details_indica_ai.ts_updated
      - datalake_braze_details_clean.canvas_details_owners.ts_updated
      - datalake_braze_details_clean.canvas_details_tenants.ts_updated
    description: Timestamp of when the canvas was last updated.
  ts_load:
    description: Timestamp of when the record was loaded into the DW table, generated at query execution time via NOW().
