---
database_name: dw_braze
table_name: dim_campaign
description: Dimension table containing information about Braze campaigns related to affiliates, owners, and tenants
domain: Support and Services
owner: gabriel.firmino@quintoandar.com.br
columns:
  sk_campaign:
    lineage:
      - datalake_braze_details_clean.campaign_details_indica_ai.id_campaign
      - datalake_braze_details_clean.campaign_details_owners.id_campaign
      - datalake_braze_details_clean.campaign_details_tenants.id_campaign
    description: Campaign ID as given by the Braze Platform.
  user_type:
    lineage:
      - datalake_braze_details_clean.campaign_details_indica_ai.id_campaign
      - datalake_braze_details_clean.campaign_details_owners.id_campaign
      - datalake_braze_details_clean.campaign_details_tenants.id_campaign
    description: App group the campaign belongs to. Identifies the user segment targeted by the campaign (affiliates, owners, or tenants).
  campaign_name:
    lineage:
      - datalake_braze_details_clean.campaign_details_indica_ai.campaign_name
      - datalake_braze_details_clean.campaign_details_owners.campaign_name
      - datalake_braze_details_clean.campaign_details_tenants.campaign_name
    description: The campaign name as defined in Braze Platform.
  campaign_description:
    lineage:
      - datalake_braze_details_clean.campaign_details_indica_ai.campaign_description
      - datalake_braze_details_clean.campaign_details_owners.campaign_description
      - datalake_braze_details_clean.campaign_details_tenants.campaign_description
    description: The campaign description as defined in Braze Platform.
  schedule_type:
    lineage:
      - datalake_braze_details_clean.campaign_details_indica_ai.schedule_type
      - datalake_braze_details_clean.campaign_details_owners.schedule_type
      - datalake_braze_details_clean.campaign_details_tenants.schedule_type
    description: Describes what triggers the campaign to be sent.
    categories:
      action_based: When a campaign is sent after a user completes a certain event.
      api_triggered: When a campaign is sent after a API trigger.
      time_based: When a campaign is sent in a scheduled time. 
  is_archived:
    lineage:
      - datalake_braze_details_clean.campaign_details_indica_ai.archived
      - datalake_braze_details_clean.campaign_details_owners.archived
      - datalake_braze_details_clean.campaign_details_tenants.archived
    description: Boolean indicating whether the campaign is archived.
  is_draft:
    lineage:
      - datalake_braze_details_clean.campaign_details_indica_ai.draft
      - datalake_braze_details_clean.campaign_details_owners.draft
      - datalake_braze_details_clean.campaign_details_tenants.draft
    description: Boolean indicating whether this campaign is a draft.
  ts_first_sent:
    lineage:
      - datalake_braze_details_clean.campaign_details_indica_ai.ts_first_sent
      - datalake_braze_details_clean.campaign_details_owners.ts_first_sent
      - datalake_braze_details_clean.campaign_details_tenants.ts_first_sent
    description: Timestamp of when the campaign was sent for the first time.
  ts_last_sent:
    lineage:
      - datalake_braze_details_clean.campaign_details_indica_ai.ts_last_sent
      - datalake_braze_details_clean.campaign_details_owners.ts_last_sent
      - datalake_braze_details_clean.campaign_details_tenants.ts_last_sent
    description: Timestamp of when the campaign was sent for the last time.
  ts_created:
    lineage:
      - datalake_braze_details_clean.campaign_details_indica_ai.ts_created
      - datalake_braze_details_clean.campaign_details_owners.ts_created
      - datalake_braze_details_clean.campaign_details_tenants.ts_created
    description: Timestamp of when the campaign was created.
  ts_updated:
    lineage:
      - datalake_braze_details_clean.campaign_details_indica_ai.ts_updated
      - datalake_braze_details_clean.campaign_details_owners.ts_updated
      - datalake_braze_details_clean.campaign_details_tenants.ts_updated
    description: Timestamp of when the campaign was last updated.
  ts_load:
    description: Timestamp of when the record was loaded into the DW table, generated at query execution time via NOW().
