database_name: metric_ss
table_name: escalation
description: This table contains Escalation Rate KPI with target per many dimensions.
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  channel:
    description: Identify the channel for this ticket (call, chat, email).
    dimension: True
    lineage:
      - dw_customer_support.fact_ticket.channel
      - dw_customer_support.fact_ticket.ticket_via
  journey:
    description: Journey of the ticket.
    dimension: True
    lineage:
      - dw_customer_support.dim_department.journey
  journey_step:
    description: Department journey step.
    dimension: True
    lineage:
      - dw_customer_support.dim_department.journey_step
  department:
    description: Department name.
    dimension: True
    lineage:
      - dw_customer_support.dim_department.department
  team:
    description: Department team.
    dimension: True
    lineage:
      - dw_customer_support.dim_department.team
  area:
    description: Department area (e.g. CX).
    dimension: True
    lineage:
      - dw_customer_support.dim_department.area
  customer_type:
    description: Client type Note - This field does not belong to the taxonomy defined on Central Ops.
    dimension: True
    lineage:
      - dw_customer_support.dim_taxonomy.customer_type
  amount_escalation:
    metric:
      name: Amount escalation tickets
      description: Number of tickets that were escalated to the departments
          '[MX] Media OPS'
          'CX Conta Comigo [POS] [BACK]'
          'CX ReclameAqui Adquiridas [CE] [POS] [BACK]'
          'Midias Ops [POS] [BACK]'
          'Notificação Extrajudicial [CE] [POS] [BACK]'
          'Ouvidoria [CE] [POS] [BACK]'
          'Ouvidoria For Sale [CE] [SALE] [BACK]'
          'PROCON [CE] [POS] [BACK]'
          'ReclameAqui [CE] [POS] [BACK]'
        And that do not have the api_reclame_aqui TAG
        And that were not originated on WhatsApp
      acronym: Amount Escalation
      is_additive: True
      business_stage: CX
      hierarchy: User analisys
      approved_by: vicente.neto@quintoandar.com.br
      link_to_metric: ""
  amount_escalation_responses:
    metric:
      name: Amount Escalation Tickets
      description: Number of tickets that were escalated to departments
          'CX Partners Tasks [PRE] [BACK]'
          'CX Proposals Tasks [PRE] [BACK]'
          'Addendums [REP] [POS] [BACK]'
          'Property Entry [ONB] [POS] [BACK]'
          'CX Payments Active [POS] [BACK] [PAY]'
          'Change of Bank Details [BACK]'
          'Repairs Triage [Back]'
          'Termination Due to Default [OFF][POS][BACK]'
          'Scheduled Service [OFF] [POS] [BACK]'
          'Common Repairs [Back]'
          'Offboarding Repairs [OFF] [POS] [BACK]'
          'QuintoAndar Protection [OFF] [POS] [BACK]'
          'Repairs [BACK]'
          'Self-Service Repairs [BACK]'
        And they were not originated on WhatsApp
      acronym: Amoun Escalation Responses
      is_additive: True
      business_stage: CX
      hierarchy: User analisys
      approved_by: vicente.neto@quintoandar.com.br
      link_to_metric: ""
  escalation_rate:
    metric:
      name: Escalation Rate
      description: Semi-additive metric representing the sum of tickets that are escalation tickets for
        given departments divided by the overall sum of the number of escalation tickets
      acronym: DSAT Rate
      is_additive: False
      business_stage: CX
      hierarchy: User analisys
      approved_by: vicente.neto@quintoandar.com.br
      link_to_metric: ""
  dt_ticket_created:
    description: The created date of ticket.
    dimension: True
    lineage:
      - dw_customer_support.fact_ticket.ts_started