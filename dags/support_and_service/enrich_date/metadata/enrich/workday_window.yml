---
database_name: datalake_date
table_name: workday_window
description:
  Calculation of working days after a reference date in certain cities.
  The granularity of the table is given by id_date and id_city.
domain: Support and Services
owner: data-ae-ss@quintoandar.com.br
columns:
  id_date:
    description: Date identifier.
    lineage:
      - datalake_date.cities_calendar.id_date
  id_city:
    description: City unique identifier.
    lineage:
      - datalake_date.cities_calendar.id_city
  city:
    description:
      Name of the city to which the dates refer, this consideration is important
      because of the variation of holidays and working days in each city.
    lineage:
      - datalake_date.cities_calendar.city
  dt_ref:
    description: The reference date for calculating the working day window.
    lineage:
      - datalake_date.cities_calendar.dt_reference
  dt_start:
    description: If the reference date is a non-business day, we will consider
      the next business day as the initial one.
    lineage:
      - datalake_date.cities_calendar.dt_workday
  dt_end_1:
    description: One business day after the initial reference business day.
    lineage:
      - datalake_date.cities_calendar.dt_workday
