inner_dependencies:
  tickets:
    - tickets_history
tables:
  group_memberships:
    is_incremental: false
  groups:
    is_incremental: false
  organizations:
    is_incremental: false
  satisfaction_ratings:
    is_incremental: false
  ticket_fields:
    is_incremental: false
  ticket_metrics:
    is_incremental: false
  tickets_history:
    no_raw: true
    is_incremental: true
    has_create_external_table: false
    partition_cols: ["year", "month", "day"]
  tickets:
    is_incremental: false
    partition_cols: ["year", "month", "day"]
  users:
    is_incremental: false

custom_cluster:
  driver_node_type_id: r5d.8xlarge
  node_type_id: r5d.16xlarge
  runtime_engine: PHOTON
  num_workers: 4
  aws_attributes:
    ebs_volume_size: 500
    availability: ON_DEMAND
  spark_conf:
    spark.driver.maxResultSize: "0"
    spark.executor.memory: "400g"
    spark.executor.memoryOverhead: "32g"
    spark.driver.memory: "100g"
    spark.driver.memoryOverhead: "16g"
    spark.sql.shuffle.partitions: "1040"
