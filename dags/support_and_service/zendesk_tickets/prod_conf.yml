inner_dependencies:
  tickets:
    - tickets_history
tables:
  group_memberships:
    is_incremental: false
  groups:
    is_incremental: false
  organizations:
    is_incremental: false
  satisfaction_ratings:
    is_incremental: false
  ticket_fields:
    is_incremental: false
  ticket_metrics:
    is_incremental: false
  tickets_history:
    no_raw: true
    is_incremental: true
    has_create_external_table: false
    partition_cols: ["year", "month", "day"]
  tickets:
    is_incremental: false
    partition_cols: ["year", "month", "day"]
  users:
    is_incremental: false

custom_cluster:
  driver_node_type_id: r5d.12xlarge
  node_type_id: r5d.12xlarge
  runtime_engine: PHOTON
  autoscale:
    min_workers: 3
    max_workers: 6
  aws_attributes:
    ebs_volume_size: 500
  spark_conf:
    spark.executor.memory: "240g"
    spark.executor.memoryOverhead: "23g"
    spark.driver.maxResultSize: "0"
    spark.driver.memory: "240g"
    spark.driver.memoryOverhead: "23g"
