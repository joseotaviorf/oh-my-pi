---
database_name: datalake_chat_inapp_strategies
table_name: whatsapp_sessions
description: " "
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  id_session:
    lineage:
      - datalake_greenseer.session_memory.id_session
    description: ID of session on Greenseer.
  id_user:
    lineage:
      - datalake_greenseer.session_memory.id_user
    description: ID of user on Greenseer.
  id_ticket:
    lineage:
      - datalake_zendesk_ticket_funnels.tickets_funnel_metrics.id_ticket
    description: Zendesk funnel ticket ID.
  ts_started:
    lineage:
      - datalake_greenseer.session_memory.ts_started
    description: Date and time of session started.
  has_chat5a_access:
    lineage:
      - datalake_greenseer.session_memory.has_chat5a_access
    description: If user has chat5a available.
  migration_strategy:
    lineage:
      - datalake_greenseer.session_memory.strategy
    description: Type of migration strategy to chat5a available.
  migration_strategy_adjusted:
    lineage:
      - datalake_greenseer.session_memory.strategy
    description: Adjustment in migration strategy.
  id_pipeline:
    lineage:
      - datalake_greenseer.session_memory.id_pipeline
    description: ID of the pipeline on Greenseer.
  contract_role:
    lineage:
      - dw_quintoandar.fact_contract_people.contract_role
    description:
      Role that person performs in contract, such as owner, tenant, dweller
      (resident), sponsor ("fiador").
  is_retention:
    lineage:
      - datalake_greenseer.greenseer_session.is_retention
    description: Flag to indicate if session retention in bot or no.
  tag:
    lineage:
      - datalake_greenseer.session_memory.tags
    description: Tagging done by the bot.
  grade_bot:
    lineage:
      - datalake_chat_fup_clean.rating.grade
    description: Satisfaction score for the service performed in the bot.
  comment_bot:
    lineage:
      - datalake_chat_fup_clean.rating.comment
    description: Satisfaction comment for the service performed in the bot
  grade_human:
    lineage:
      - datalake_chat_fup_clean.surveys_answer.rating
    description: Satisfaction score for the service performed in the human.
  comment_human:
    lineage:
      - datalake_chat_fup_clean.surveys_answer.comment
    description: Satisfaction comment for the service performed in the human.
  is_solved_human:
    lineage:
      - datalake_chat_fup_clean.surveys_answer.is_solved
    description: Flag to indicate if ID ticket resolve in human service.
  currently_tenant_post:
    description: Defines if the user is a tenant in the 'post contract' journey.
  has_installed_app:
    lineage:
      - datalake_amplitude_clean.event.platform
    description: Describes which platform the user used in this event.
  year:
    description: Partition col, year of record insertion
  month:
    description: Partition col, month of record insertion
  day:
    description: Partition col, day of record insertion
