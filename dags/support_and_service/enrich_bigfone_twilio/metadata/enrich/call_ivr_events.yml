database_name: datalake_bigfone_twilio
table_name: call_ivr_events
description: Contains all Twilio IVR events related to customer support via call
domain: Support and Services
owner: gabriel.firmino@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_bigfone_events.events.id
    description: Primary surrogate identifier for the entity row in this support and service dataset.
  id_event:
    lineage:
      - datalake_bigfone_events.events.metadata
    description: Unique event identifier assigned by the telephony platform for this lifecycle record.
  id_call:
    lineage:
      - datalake_bigfone_events.events.metadata
    description: Telephony provider call identifier linking multiple events to the same phone conversation.
  id_call_teravoz:
    lineage:
      - datalake_bigfone_events.events.metadata
    description: Legacy Teravoz call identifier retained for historical telephony reconciliation.
  id_task:
    lineage:
      - datalake_bigfone_events.events.metadata
    description: Operational task identifier from the CRM platform linking events to a single work item.
  id_channel:
    lineage:
      - datalake_bigfone_events.events.metadata
    description: Communication channel identifier used to route the message or call in the platform.
  from_number:
    lineage:
      - datalake_bigfone_events.events.metadata
    description: Caller phone number
  to_number:
    lineage:
      - datalake_bigfone_events.events.metadata
    description: Receiver phone number
  customer_phone:
    lineage:
      - datalake_bigfone_events.events.metadata
    description: from_number without the country prefix
  event_type:
    lineage:
      - datalake_bigfone_events.events.event
    description: Lifecycle event label emitted by the telephony provider for this call-handling step.
  task_cancelation_reason:
    lineage:
      - datalake_bigfone_events.events.metadata
    description: Reason for task cancelling
  steps:
    lineage:
      - datalake_bigfone_events.events.metadata
    description: Ordered sequence of IVR menu steps navigated by the caller before agent routing.
  metadata:
    lineage:
      - datalake_bigfone_events.events.metadata
    description: JSON with all event metadata
  task_priority:
    lineage:
      - datalake_bigfone_events.events.metadata
    description: Numeric priority assigned to the TaskRouter task when competing for agent capacity.
  csat_1:
    lineage:
      - datalake_bigfone_events.events.metadata
    description: Customer answers the question "Has your problem been solved?"
  csat_2:
    lineage:
      - datalake_bigfone_events.events.metadata
    description: Standard CSAT regarding the call
  csat_3:
    lineage:
      - datalake_bigfone_events.events.metadata
    description: Standard CSAT regarding the chatbot experience. Valid only for Call InApp
  ts_created_local:
    lineage:
      - datalake_bigfone_events.events.ts_created_local
    description: Timestamp of event creation
  ts_received_local:
    lineage:
      - datalake_bigfone_events.events.ts_received_local
    description: Timestamp of event creation in UTC-3
  ts_created_local_unix:
    lineage:
      - datalake_bigfone_events.events.ts_created_local
    description: Timestamp of event creation in UTC-3 and unix time
  year:
    lineage:
      - datalake_bigfone_events.events.year
    description: Year partition
  month:
    lineage:
      - datalake_bigfone_events.events.month
    description: Month partition
  day:
    lineage:
      - datalake_bigfone_events.events.day
    description: Day partition
