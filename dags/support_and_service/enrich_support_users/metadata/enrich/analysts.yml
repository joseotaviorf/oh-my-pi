database_name: datalake_support_users
table_name: analysts
description:
  This table is intended to gather user information segmented by the analyst entity.
  The main source of this table is the zendesk base and the granularity is built in at the analyst level.
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  id_agent:
    lineage:
      - datalake_zendesk_clean.tickets.id_assignee
      - datalake_bigfone_clean.event.metadata
      - datalake_quinto_messenger_clean.task.assigned_to
    description: Analyst's unique identifier.
  id_agent_twilio:
    lineage:
      - datalake_bigfone_clean.event.metadata
      - datalake_quinto_messenger_clean.task.assigned_to
    description: Temporary field for analyst identification in twilio.
  id_user_external:
    lineage:
      - datalake_zendesk_clean.users.id_user_external
    description: User identifier in main.
  id_organization:
    lineage:
      - datalake_zendesk_clean.users.id_organization
    description: Identifier of the company where the analyst works.
  email:
    lineage:
      - datalake_zendesk_clean.users.email
      - datalake_bigfone_clean.event.metadata
      - datalake_quinto_messenger_clean.task.assigned_to
    description: Email with which the analyst is registered.
  phone:
    lineage:
      - datalake_zendesk_clean.users.phone
    description: Phone with which the analyst is registered.
  name:
    lineage:
      - datalake_zendesk_clean.users.name
      - datalake_bigfone_clean.event.metadata
    description: Analyst name.
  organization:
    lineage:
      - datalake_zendesk_clean.organizations.name
      - datalake_zendesk_clean.users.email
      - datalake_bigfone_clean.event.metadata
      - datalake_quinto_messenger_clean.task.assigned_to
    description: Name of the company where the analyst works.
  role:
    lineage:
      - datalake_zendesk_clean.users.role
    description: Descriptive information coming from Zendesk that indicates the user's role, in the case of this table it should always be agent.
  is_active:
    lineage:
      - datalake_zendesk_clean.users.is_active
    description: Boolean indicating whether the analyst is active.
  ts_created:
    lineage:
      - datalake_zendesk_clean.users.ts_created
    description: Date the analyst record was created (in timestamp).
  ts_updated:
    lineage:
      - datalake_zendesk_clean.users.ts_updated
    description: Date the analyst record was updated (in timestamp).
