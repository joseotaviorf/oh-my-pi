dag:
  name: enrich_support_users
  schedule_start_date: 2023, 7, 24
  owner: Data SS
  documentation:
    dag_purpose: |
      This DAG loads tables related to users in the Support context, this includes analysts, customers, and Zendesk general users.
workflow:
  type: query_delta
  layer: enrich
  inner_dependencies:
    analysts:
    - zendesk_users
  tables_customization:
    zendesk_users:
      z_order_by: [id_user_main, id_user_zendesk]
