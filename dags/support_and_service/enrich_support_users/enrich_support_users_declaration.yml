dag:
    name: enrich_support_users
    schedule_start_date: 2023, 7, 24
    owner: Data SS
    documentation:
        dag_purpose: |
            This DAG loads tables related to users in the Support context, this includes analysts, customers, and Zendesk general users.
workflow:
    type: query
    layer: enrich
    inner_dependencies:
        analysts:
            - zendesk_users
cluster:
    type: custom_cluster
    custom_configurations:
        driver_node_type_id: c5d.4xlarge
        node_type_id: c6id.4xlarge
        num_workers: 3
        aws_attributes:
            ebs_volume_size: 300
