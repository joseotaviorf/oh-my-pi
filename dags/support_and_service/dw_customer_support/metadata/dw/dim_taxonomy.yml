      Classification of the user request. Note - This field does not belong
      to the taxonomy defined on Central Ops.
  motivation:
    lineage:
      - datalake_customer_support.tickets.contact_motivation_tag
    description: Classification of the user motivation (e.g. doubt).
  theme:
    lineage:
      - datalake_customer_support.tickets.contact_theme_tag
    description: Theme.
  theme_detail:
    lineage:
      - datalake_customer_support.tickets.contact_theme_detail_tag
    description: Detailed theme.
  journey:
    lineage:
      - datalake_gsheets_clean.ticket_rate_classification.journey
    description: Journey of the ticket.
  sub_journey:
    lineage:
      - datalake_gsheets_clean.ticket_rate_classification.sub_journey
