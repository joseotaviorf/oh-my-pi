database_name: dw_customer_support
table_name: fact_chat_messages
description:
  This table contains all chat messages exchanged via Twilio
domain: Support and Services
owner: data-ae-ss@quintoandar.com.br
columns:
  sk_channel:
    lineage:
      - datalake_quinto_messenger_clean.channel_event.id_channel
      - datalake_internal_chat_clean.internal_chat_messages.id_channel
    description: Twilio channel identifier.
  sk_session:
    lineage:
      - datalake_quinto_messenger_clean.channel.id_session
      - datalake_quinto_messenger_clean.chat.id_session
      - datalake_sauron_clean.session.id
    description: Session identifier.
  sk_message:
    lineage:
      - datalake_quinto_messenger_clean.channel_event.event_payload
      - datalake_internal_chat_clean.internal_chat_messages.id_message
    description: Message identifier.
  sk_user_sender:
    lineage:
      - datalake_ebdb_user.user.id
      - datalake_quinto_messenger_clean.channel_event.from_phone_number
      - datalake_internal_chat_clean.internal_chat_messages.id_user_external
    description: Identifier of the user who sent the message.
  origin:
    description: The source of the message, either 'in_app' or 'whatsapp'.
  message:
    lineage:
      - datalake_quinto_messenger_clean.channel_event.message_body
      - datalake_internal_chat_clean.internal_chat_messages.message
    description: Content of the message.
  ts_created:
    lineage:
      - datalake_quinto_messenger_clean.channel_event.ts_created
      - datalake_internal_chat_clean.internal_chat_messages.ts_created
    description: Timestamp indicating when the message was created.
  ts_load:
    description: Timestamp of when data was loaded to the table.
