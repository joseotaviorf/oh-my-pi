database_name: dw_customer_support
table_name: fact_segment
description: DEPRECATED - Fact table with metrics related with our support.
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  sk_ticket:
    lineage:
      - datalake_customer_support.call.id_ticket
      - datalake_customer_support.chat.id_ticket
      - datalake_customer_support.email.id_ticket
      - datalake_customer_support.historical_call.id_ticket
      - datalake_customer_support.historical_chat.id_ticket
    description:
      DEPRECATED - Unique ticket identifier. A single ticket may have multiple segments
      so this is expected not to be unique on this grain.
  sk_segment:
    lineage:
      - datalake_customer_support.call.id_segment
      - datalake_customer_support.chat.id_segment
      - datalake_customer_support.email.id_ticket
      - datalake_customer_support.historical_call.id_segment
      - datalake_customer_support.historical_chat.id_segment
      - datalake_customer_support.historical_chat.id_ticket
    description:
      DEPRECATED - Unique segment identifier. A segment is the smallest part of our
      support. We consider that email have only 1 segment but call and chat tickets
      may have multiple segments.
  sk_agent:
    lineage:
      - datalake_customer_support.historical_call.id_agent
      - datalake_customer_support.historical_chat.id_agent
    description: DEPRECATED - Id of the agent that answered this segment.
  sk_department:
    lineage:
      - datalake_customer_support.call.department
      - datalake_customer_support.chat.department
      - datalake_customer_support.email.department
      - datalake_customer_support.historical_call.department
      - datalake_customer_support.historical_chat.department
    description: DEPRECATED - Key generated as a MD5 from the segment department string.
  sk_channel:
    lineage:
      - datalake_customer_support.call.direction
      - datalake_customer_support.email.direction
      - datalake_customer_support.historical_call.direction
    description: DEPRECATED - Key generated to identify the channel of this ticket.
  sk_external_service:
    lineage:
      - datalake_customer_support.call.id_external_service
      - datalake_customer_support.chat.id_segment
      - datalake_customer_support.historical_call.id_segment
      - datalake_customer_support.historical_chat.id_segment
    description:
      DEPRECATED - External id. For call this id represents the task id and for chat
      this represents the segment id, both from Twilio (usefull to use use this ids
      in Twilio Flex UI).
  department:
    lineage:
      - datalake_customer_support.call.department
      - datalake_customer_support.chat.department
      - datalake_customer_support.email.department
      - datalake_customer_support.historical_call.department
      - datalake_customer_support.historical_chat.department
    description: DEPRECATED - Segment department.
  completion_reason:
    lineage:
      - datalake_customer_support.chat.completion_reason
    description: DEPRECATED - Tasm completion reason.
  transferred_from_dept:
    lineage:
      - datalake_customer_support.call.transferred_from_dept
      - datalake_customer_support.chat.transferred_from_dept
      - datalake_customer_support.historical_chat.transferred_from_dept
    description: DEPRECATED - Segement started from a transfer from this department.
  transferred_to_dept:
    lineage:
      - datalake_customer_support.call.transferred_to_dept
      - datalake_customer_support.chat.transferred_to_dept
      - datalake_customer_support.historical_chat.transferred_to_dept
    description: DEPRECATED - Transfer the segment to this department.
  transference_type:
    lineage:
      - datalake_customer_support.call.transference_type
      - datalake_customer_support.chat.transference_type
    description: DEPRECATED - Type of transference.
    categories:
      internal-same-agent: Transfered for the same department and the same agent.
      internal-other-agent: Transfered for the same department and different agent.
      external: Transfered for a different department.
  transference_reason:
    lineage:
      - datalake_customer_support.call.transference_reason
      - datalake_customer_support.chat.transference_reason
    description: DEPRECATED - Reason the segment was transfered.
  is_sla:
    lineage:
      - datalake_customer_support.call.sla_achieved
      - datalake_customer_support.chat.sla_achieved
      - datalake_customer_support.email.is_sla
    description:
      DEPRECATED - SLA achieved for this segment. chat minutes_to_first_response <=
      15 call seconds_total_wait_time <= 60 email minutes_requester_wait_business
      / (60.0 * COALESCE(replies,1) < 6
  is_first_segment:
    lineage:
      - datalake_customer_support.call.is_first_segment
      - datalake_customer_support.chat.is_first_segment
      - datalake_customer_support.historical_chat.is_first_segment
    description: DEPRECATED - Boolean indicating if this is the first segment of the support.
  is_last_segment:
    lineage:
      - datalake_customer_support.call.is_last_segment
      - datalake_customer_support.chat.is_last_segment
      - datalake_customer_support.historical_chat.is_last_segment
    description: DEPRECATED - Boolean indicating if this is the last segment of the support.
  ts_started:
    lineage:
      - datalake_customer_support.call.ts_segment_created
      - datalake_customer_support.chat.ts_segment_created
      - datalake_customer_support.email.ts_ticket_started
      - datalake_customer_support.historical_call.ts_ticket_started
      - datalake_customer_support.historical_chat.ts_segment_created
    description: DEPRECATED - Start timestamp.
  ts_closed:
    lineage:
      - datalake_customer_support.call.ts_segment_closed
      - datalake_customer_support.chat.ts_segment_closed
      - datalake_customer_support.email.ts_ticket_ended
      - datalake_customer_support.historical_call.ts_ticket_ended
      - datalake_customer_support.historical_chat.ts_segment_closed
    description: DEPRECATED - Closed timestamp.
  channel:
    description: DEPRECATED - Channel (call, email, chat).
  ts_load:
    description: DEPRECATED - This timestamp indicates when this data was loaded into dw_customer_support.
