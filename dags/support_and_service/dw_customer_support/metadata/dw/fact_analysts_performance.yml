database_name: dw_customer_support
table_name: fact_analysts_performance
description: 
  Fact table that aims to gather data on metrics related to analysts' performance. This table is a 
  periodic snapshot type with the frequency being daily, this means that the base will contain a day-by-day 
  photo of each analyst's performance numbers. The granularity of this table is sk_agent + date.
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  sk_snapshot:
    lineage:
      - datalake_zendesk_users.agents.email
      - datalake_zendesk_ticket_funnels.ticket_funnel.ts_updated
    description: Unique snapshot identifier (a concatenation of id_agent + date).
  sk_agent:
    lineage:
      - datalake_customer_support.unified_tickets.id_last_agent
    description: Analyst identification key.
  sk_last_ticket_updated_date:
    lineage:
      - datalake_zendesk_ticket_funnels.ticket_funnel.ts_updated
    description: Identification key for the update date of the last ticket handled by the analyst.
  total_tickets:
    description: Information of integer type that indicates the total number of tickets that the analyst handled on the day.
  ticket_reopenings:
    description: Information of integer type that indicates the number of ticket reopenings linked to the analyst on the day.
  ticket_responses:
    description: Information of integer type that indicates the number of responses linked to the analyst on the day.
  total_attendance_time:
    description: Information of integer type that indicates the service time (in minutes) linked to the analyst on the day.
  total_tickets_recontact:
    description: Integer type information that indicates how many tickets were recontacted.
  total_received_demand:
    description: Integer type information that indicates the amount of demand received by the analyst.
  total_productivity:
    description: Integer type data that indicates how many tickets the analyst solved.
  tickets_with_csat_score:
    description: Information of integer type that indicates the number of tickets with the csat score sent on the day.
  tickets_csat_satisfied:
    description: Integer type information that indicates the number of tickets with csat marked as "satisfied" on the day.
  tickets_csat_neutral:
    description: Integer type information that indicates the number of tickets with csat marked as "neutral" on the day.
  tickets_csat_dissatisfied:
    description: Integer type information that indicates the number of tickets with csat marked as "dissatisfied" on the day.
  tickets_with_resolution_answered:
    description: Integer type information that indicates the number of tickets with a resolution response linked to the analyst on the day.
  tickets_with_resolution:
    description: Integer type information that indicates the number of tickets with resolution linked to the analyst on the day.
  tickets_transferred:
    description: Integer type information that indicates the number of tickets that were transferred on the day.
  tickets_in_backlog:
    description: Integer type information that indicates the number of tickets that were in the analyst's backlog that day.
  backlog_within_sla:
    description: Integer type information that indicates the number of tickets that were in the analyst's backlog still within the SLA on the day.
  backlog_with_exceed_sla:
    description: Integer type information that indicates the number of tickets that exceeded the sla in the analyst's backlog on the day.
  frt:
    description: Average FRT (Full Resolution Time) calculates the total time from the beggining
      of the support in the front until the end, considering the backoffice time if
      there is back ticket related.
  year:
    description: Year of reference date.
  month:
    description: Month of reference date.
  day:
    description: Day of reference date.
