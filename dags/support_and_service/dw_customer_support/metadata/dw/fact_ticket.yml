database_name: dw_customer_support
table_name: fact_ticket
description: DEPRECATED - Fact table with metrics related with our support
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  sk_ticket:
    lineage:
      - datalake_customer_support.unified_tickets.id_ticket
    description: DEPRECATED - Unique ticket identifier (generated by zendesk).
  sk_taxonomy:
    lineage:
      - datalake_customer_support.unified_tickets.id_taxonomy
    description: DEPRECATED - Key generated as a MD5 from all taxonomies fields.
  sk_tags:
    lineage:
      - datalake_customer_support.unified_tickets.id_tags
    description: DEPRECATED - Key generated as a MD5 from the ticket tags field.
  sk_channel:
    lineage:
      - datalake_customer_support.unified_tickets.id_channel
    description: DEPRECATED - Key generated to identify the channel of this ticket.
  sk_first_agent:
    lineage:
      - datalake_customer_support.unified_tickets.id_first_agent
    description:
      DEPRECATED - Id of the first agent that answered this ticket. For email tickets
      first agent will always be equal to the last agent.
  sk_last_agent:
    lineage:
      - datalake_customer_support.unified_tickets.id_last_agent
    description:
      DEPRECATED - Id of the last agent that answered this ticket. For email tickets
      first agent will always be equal to the last agent.
  sk_first_department:
    lineage:
      - datalake_customer_support.unified_tickets.id_first_department
    description:
      DEPRECATED - Key generated as a MD5 from the first department string registered
      for this ticket.
  sk_main_department:
    lineage:
      - datalake_customer_support.unified_tickets.id_main_department
    description:
      DEPRECATED - Key generated as a MD5 from the main department string registered
      for this ticket. We consider the main department the last department from Twilio
      it if is a chat/call support, otherwise we consider the zendesk department.
  sk_user:
    lineage:
      - datalake_customer_support.unified_tickets.id_user
    description: DEPRECATED - Unique user identifier.
  sk_contract:
    lineage:
      - datalake_customer_support.unified_tickets.id_contract
    description: DEPRECATED - Unique contract identifier.
  sk_session:
    lineage:
      - datalake_customer_support.unified_tickets.id_session
    description: DEPRECATED - Session ID from Sauron
  sk_service_status:
    lineage:
      - datalake_customer_support.unified_tickets.service_status
    description: DEPRECATED - Unique identifier for the front office service status
  sk_main_session:
    lineage:
      - datalake_customer_resolution.customer_resolution_static.id_ticket
    description:
      DEPRECATED - Unique identifier of the ticket session (first user contact for this
      team in a 7 days window). Only valid for front tickets.
  sk_next_ticket:
    lineage:
      - datalake_customer_resolution.customer_resolution_static.ticket_recontact_list
    description: DEPRECATED - Identifier of the next ticket for this user within the same session.
  channel:
    lineage:
      - datalake_customer_support.unified_tickets.channel
    description: DEPRECATED - Identify the channel for this ticket (call, chat, email).
  ticket_origin:
    description: DEPRECATED - It is the source channel of the chat ticket, which can be whatsapp or chat5A.
    lineage:
      - datalake_customer_support.unified_tickets.ticket_origin
  context:
    description: DEPRECATED - Context of the ticket.
    categories:
      "ForRent":
        Ticket is considered from the ForRent context because has subjourney 'Contract to Entrance',
        'Listing & Search', 'Offboarding', 'Onboarding' or 'Visits to Offer'.
      "ForSale": Ticket is considered from the ForSale context because has subjourney 'For Sale'.
      "Partners": Ticket is considered from the Partners context because has subjourney 'Partners'.
    lineage:
      - datalake_customer_support.unified_tickets.context
  csat_score:
    lineage:
      - datalake_customer_support.unified_tickets.csat_score
    description: DEPRECATED - Last CSAT score (value goes from 1 to 5).
  first_csat_score:
    lineage:
      - datalake_customer_support.unified_tickets.first_csat_score
    description: DEPRECATED - First CSAT score (value goes from 1 to 5).
  status:
    lineage:
      - datalake_customer_support.unified_tickets.status
    description: DEPRECATED - Ticket status.
  first_department:
    lineage:
      - datalake_customer_support.unified_tickets.first_department
    description: DEPRECATED - First department string registered for this ticket.
  main_department:
    lineage:
      - datalake_customer_support.unified_tickets.main_department
    description:
      DEPRECATED - Main department string registered for this ticket. We consider the
      main department the last department from Twilio it if is a chat/call support,
      otherwise we consider the zendesk department.
  total_departments:
    lineage:
      - datalake_customer_support.unified_tickets.total_departments
    description:
      DEPRECATED - How many distinct departments have this ticket been transferred to.
      We consider that email has only a single segment (no transferences) so this
      column must alway have only 1 distinct department.
  total_segments:
    lineage:
      - datalake_customer_support.unified_tickets.total_segments
    description:
      DEPRECATED - How many segments this ticket have. We consider that email has only
      a single segment.
  full_resolution_time:
    lineage:
      - datalake_customer_support.unified_tickets.full_resolution_time
    description:
      DEPRECATED - FRT (Full Resolution Time) calculates the total time from the beggining
      of the support in the front until the end, considering the backoffice time if
      there is back ticket related.
  front_or_back:
    lineage:
      - datalake_customer_support.unified_tickets.front_or_back
    description:
      DEPRECATED - Given the main department define if this ticket is front or back.
      This column have undefined values in case there is no definition of this value
      in the department_control sheet for this specific main department.
  last_back_ticket:
    lineage:
      - datalake_customer_support.unified_tickets.last_back_ticket
    description: DEPRECATED - Last back ticket related to this ticket.
  back_tickets:
    lineage:
      - datalake_customer_support.unified_tickets.back_tickets
    description: DEPRECATED - List of back tickets related to this ticket.
  resolution_survey:
    lineage:
      - datalake_customer_support.unified_tickets.resolution_survey
    description:
      DEPRECATED - Boolean column containing the last user answer if his problem was
      solved via CSAT survey. Null if the user has not answered.
  ticket_rate_weight:
    lineage:
      - datalake_customer_support.unified_tickets.ticket_rate_weight
    description: DEPRECATED - The weight applied to the ticket if it's part of the ticket rate calculation.
    categories:
      "1":
        Ticket rate weight is 1 and is based on being a front ticket and in the sub journeys 'Contract to Entrance',
        'For Sale', 'Listing & Search', 'Offboarding', 'Onboarding', 'Partners' or 'Visits to Offer'.
      "2":
        Ticket rate weight is 2 and is based on being a back ticket and in the sub journeys 'Contract to Entrance',
        'For Sale', 'Listing & Search', 'Offboarding', 'Onboarding', 'Partners' or 'Visits to Offer'.
      "15": Ticket rate weight is 15 and is based on being a front ticket and in the sub journey 'Ongoing'.
      "30": Ticket rate weight is 30 and is based on being a back ticket and in the sub journey 'Ongoing'.
      "Null": No weight applied if the ticket is not part of the ticket rate rules.
  total_tickets_proportional:
    description:
      DEPRECATED - The total tickets proportional calculation related to the ticket, considering the ticket's weight,
      abandoned calls and tickets without theme.
      This column is exclusive for tickets that are part of the Ticket Rate metric.
  is_ticket_rate:
    lineage:
      - datalake_customer_support.unified_tickets.is_ticket_rate
    description:
      DEPRECATED - Boolean flag indicating if the ticket is part of the ticket rate calculation.
      In order to be part of, the ticket must follow several rules
      - The ticket area must be CX;
      - The ticket team could be anyone but Ong Back;
      - The ticket must be front or back, depending on the channel;
      - The ticket must not belong to a few departments (Rescisão por Inadimplência [OFF][POS][BACK], Offboarding Reparos [OFF] [POS] [BACK],
      Offboarding pré saída [OFF] [POS] [BACK], Proteção QuintoAndar [OFF] [POS] [BACK], Rescisão - Despejo [OFF][POS][BACK]
      or Rescisão 1 [OFF] [POS] [BACK]);
      - The date in which the ticket was solved must be later than 1st January/2022.
      - If the ticket has channel email, then we accept all directions;
      - If the ticket has channel chat, then we accept only direction inbound;
      - If the ticket has channel call, we accept only directions inbound and outbound-api.
  has_answered_csat:
    lineage:
      - datalake_customer_support.unified_tickets.has_answered_csat
    description: DEPRECATED - Boolean that indicates if the user has answered the CSAT survey.
  has_back_ticket:
    lineage:
      - datalake_customer_support.unified_tickets.has_back_ticket
    description: DEPRECATED - Boolean that indicates if this ticket have a related backoffice ticket.
  is_back_ticket_open:
    lineage:
      - datalake_customer_support.unified_tickets.is_back_ticket_open
    description:
      DEPRECATED - Boolean that indicates if any of the related backoffice tickets have
      a status different than closed.
  is_solved:
    lineage:
      - datalake_customer_support.unified_tickets.is_solved
    description:
      DEPRECATED - Calculated field with the following premisses True if resolution_survey
      = True and (back_ticket_list is empty or is_open_back_ticket = False) and front_or_back
      = front||null and is_bot=False and is_closed_by_merge=False False if resolution_survey
      is not null and (back_ticket_list is not empty or is_open_back_ticket = False)
      and front_or_back = front||null and is_bot=False and is_closed_by_merge=False
      null otherwise.
  is_fcr:
    lineage:
      - datalake_customer_support.unified_tickets.is_fcr
    description:
      DEPRECATED - First Contact Resolution (ticket view). True if resolution_survey
      = True and back_ticket_list is null and has_transfers = False and is_bot=False
      and is_closed_by_merge=False and front_or_back = front||null False if resolution_survey
      is not null and is_bot=False and is_closed_by_merge=False and front_or_back
      = front||null null otherwise.
  is_ticket_session:
    description:
      DEPRECATED - True if the ticket is the first ticket of a session, False if the
      ticket is recontact. Null if this doesn't apply (e.g. back tickets)
  is_fcr_customer:
    lineage:
      - datalake_customer_resolution.customer_resolution_static.is_fcr
    description:
      DEPRECATED - First Contact Resolution (customer view). This column only consolidates
      after 8 days the ticket have been closed. True if the user did not open more
      than 1 ticket for the same team in a 7 days window False if the user opened
      more than 1 ticket for the same team in a 7 days window null if not applied.
  is_recontact:
    description:
      DEPRECATED - True if the ticket is not the first ticket of a session, False if
      the ticket is session. Null if this doesn't apply (e.g. back tickets).
  has_transfers:
    lineage:
      - datalake_customer_support.unified_tickets.has_transfers
    description: DEPRECATED - True if the ticket have more than 1 segment, False otherwise.
  total_minutes_reception_time:
    lineage:
      - datalake_customer_support.unified_tickets.total_minutes_reception_time
    description: DEPRECATED - Reception time in minutes.
  total_minutes_talk_time:
    lineage:
      - datalake_customer_support.unified_tickets.total_minutes_talk_time
    description: DEPRECATED - Talk time in minutes.
  total_minutes_queue_time:
    lineage:
      - datalake_customer_support.unified_tickets.total_minutes_queue_time
    description: DEPRECATED - Queue time in minutes.
  total_minutes_wrap_up_time:
    lineage:
      - datalake_customer_support.unified_tickets.total_minutes_wrap_up_time
    description: DEPRECATED - Wrap up time in minutes.
  total_minutes_handling_time:
    lineage:
      - datalake_customer_support.unified_tickets.total_minutes_handling_time
    description: DEPRECATED - Handling time in minutes.
  total_backoffice_minutes_time:
    lineage:
      - datalake_customer_support.unified_tickets.total_backoffice_minutes_time
    description: DEPRECATED - Time in minutes to close all related backoffice tickets.
  total_minutes_front_to_open_back_ticket_time:
    lineage:
      - datalake_customer_support.unified_tickets.total_minutes_front_to_open_back_ticket_time
    description:
      DEPRECATED - Time in minutes to open the related backoffice ticket after solving
      the front ticket.
  replies:
    lineage:
      - datalake_customer_support.unified_tickets.replies
    description: DEPRECATED - Number of responses referring to a ticket, that is, how many times the ticket was answered.
  reopens:
    lineage:
      - datalake_customer_support.unified_tickets.reopens
    description: DEPRECATED - Total number of times a ticket has been reopened.
  csat_comment:
    lineage:
      - datalake_customer_support.unified_tickets.csat_comment
    description: DEPRECATED - Sample of the comment the user left on our CSAT survey.
  first_csat_comment:
    lineage:
      - datalake_customer_support.unified_tickets.first_csat_comment
    description: DEPRECATED - Sample of the first comment the user left on our CSAT survey.
  ts_started:
    lineage:
      - datalake_customer_support.unified_tickets.ts_started
    description:
      DEPRECATED - Start timestamp. Note - for chat and call tickets this value is the
      first timestamp in our event tables. For email tickets we get the timestamp
      directly from zendesk.
  ts_closed:
    lineage:
      - datalake_customer_support.unified_tickets.ts_closed
    description:
      DEPRECATED - Closed timestamp. This is an immutable column. Zendesk change the
      ticket from solved to closed automatically after 3 days it has been solved.
      Note - for chat and call tickets this value is the last timestamp in our event
      tables. For email tickets we get the timestamp directly from zendesk.
  ts_csat_response:
    lineage:
      - datalake_customer_support.unified_tickets.ts_csat_response
    description: DEPRECATED - Timestamp of the last time the user answered a CSAT survey.
  ts_csat_first_response:
    lineage:
      - datalake_customer_support.unified_tickets.ts_csat_first_response
    description: DEPRECATED - Timestamp of the first time the user answered the CSAT survey.
  ts_survey:
    lineage:
      - datalake_customer_support.unified_tickets.ts_survey
    description:
      DEPRECATED - Time when the survey was sent to the user. Null if we don't have
      this information or the survey wasn't sent.
  ts_solved:
    lineage:
      - datalake_customer_support.unified_tickets.ts_solved
    description:
      DEPRECATED - Solved timestamp. For chat and call this column have the same value
      as the closed timestamp. Note - for chat and call tickets this value is the
      last timestamp in our event tables. For email tickets we get the timestamp directly
      from zendesk.
  ts_load:
    description: DEPRECATED - This timestamp indicates when this data was loaded into dw_customer_support.
