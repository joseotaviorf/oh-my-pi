database_name: dw_customer_support
table_name: fact_customer_contacts
description:
  Fact table that describes all contacts that happen in the front office. Each contact is made of
  one or many interactions between the customer and an analyst. Time metrics for each interaction are
  also present in this table
domain: Support and Services
owner: gabriel.firmino@quintoandar.com.br
columns:
  sk_contact:
    lineage:
      - datalake_customer_support.calls.id_session
      - datalake_customer_support.calls.id_task
      - datalake_customer_support.chats.id_session
      - datalake_customer_support.chats.id_task
    description: MD5 hash of channel, id_session, and id_task for contact surrogate key.
  sk_interaction:
    lineage:
      - datalake_customer_support.calls.direction
      - datalake_customer_support.calls.id_session
      - datalake_customer_support.calls.id_task
      - datalake_customer_support.calls.id_reservation
      - datalake_customer_support.chats.direction
      - datalake_customer_support.chats.id_session
      - datalake_customer_support.chats.id_task
    description: MD5 hash of direction, id_session, id_task, and id_reservation for interaction surrogate key.
  sk_session:
    lineage:
      - datalake_customer_support.calls.id_session
      - datalake_customer_support.chats.id_session
    description: Session identifier associated with the contact.
  sk_support_session:
    lineage:
      - datalake_customer_support.calls.id_sss_session
      - datalake_customer_support.chats.id_sss_session
      - datalake_customer_support.tickets.sk_support_session
    description: Support session (SSS) identifier associated with the contact, defaulting to '-1' when absent.
  sk_task:
    lineage:
      - datalake_customer_support.calls.id_task
      - datalake_customer_support.chats.id_task
    description: Task identifier associated with the contact.
  sk_call:
    lineage:
      - datalake_customer_support.calls.id_call
    description: Twilio call ID.
  sk_reservation:
    lineage:
      - datalake_customer_support.calls.id_reservation
    description: Twilio reservation ID.
  sk_ticket:
    lineage:
      - datalake_customer_support.tickets.id_ticket
    description: Ticket identifier associated with the contact.
  sk_user:
    lineage:
      - datalake_customer_support.calls.id_user
      - datalake_customer_support.chats.id_user
    description: User identifier associated with the contact.
  sk_prev_department:
    lineage:
      - datalake_customer_support.calls.queue_name
      - datalake_customer_support.chats.queue_name
    description: Previous department associated with the contact, based on task creation time.
  sk_department:
    lineage:
      - datalake_customer_support.calls.queue_name
      - datalake_customer_support.chats.queue_name
    description: Current department associated with the contact.
  sk_analyst:
    lineage:
      - datalake_customer_support.calls.worker_email
      - datalake_customer_support.chats.worker_email
    description: SK of the analyst associated with the contact.
  sk_next_department:
    lineage:
      - datalake_customer_support.calls.queue_name
      - datalake_customer_support.chats.queue_name
    description: Next department associated with the contact, based on task creation time.
  sk_first_department:
    lineage:
      - datalake_customer_support.calls.queue_name
      - datalake_customer_support.chats.queue_name
    description: First department associated with the contact, based on task creation time.
  sk_last_department:
    lineage:
      - datalake_customer_support.calls.queue_name
      - datalake_customer_support.chats.queue_name
    description: Last department associated with the contact, based on task creation time.
  origin:
    lineage:
      - datalake_customer_support.calls.origin
      - datalake_customer_support.chats.origin
    description: Communication origin channel of the contact, indicating whether it came through the in-app chat interface ('in_app') or WhatsApp ('whatsapp').
  direction:
    lineage:
      - datalake_customer_support.calls.direction
    description: Direction of the contact.
    categories:
      inbound: Contacts initiated by the customer
      outbound: Contacts initiated by 5A
  channel:
    description: Communication channel of the contact (call or chat).
  status:
    lineage:
      - datalake_customer_support.chats.task_completion_reason
      - datalake_customer_support.chats.task_outcome
    description: Status of the interaction - represents how that interaction ended
    categories:
      tranferred: Not a terminal status, means the contact has a transfer generating a new interaction
      in progress: Means the contact is still in progress, valid for email channel only.
      completed: Terminal status, means the contact is finished.
      abandoned: Is a terminal status, valid for calls
  worker_email:
    lineage:
      - datalake_customer_support.calls.worker_email
      - datalake_customer_support.chats.worker_email
    description: Email address of the QuintoAndar analyst who handled the contact interaction in Twilio Flex.
  quinto_andar_phone_number:
    lineage:
      - datalake_customer_support.calls.to_phone_number
      - datalake_customer_support.calls.from_phone_number
      - datalake_customer_support.chats.twilio_phone_number
    description: QuintoAndar's phone number used in the contact, representing the company-side number in call or WhatsApp interactions managed via Twilio.
  completion_reason:
    lineage:
      - datalake_customer_support.chats.task_completion_reason
      - datalake_customer_support.chats.task_outcome
    description: Completion reason or outcome of the interaction.
  outcome:
    lineage:
      - datalake_customer_support.chats.task_outcome
    description: Raw business outcome reported by Twilio for the conversation once finished (e.g. resolved, transferred, abandoned), unlike status/completion_reason it is not bucketed. Only populated for chat interactions; NULL for call and email, which have no equivalent source field.
  customer_phone_number:
    lineage:
      - datalake_customer_support.calls.from_phone_number
      - datalake_customer_support.calls.to_phone_number
      - datalake_customer_support.chats.customer_phone_number
    description: Customer phone number associated with the contact.
  customer_email:
    lineage:
      - datalake_customer_support.chats.customer_email
    description: Customer email associated with the contact.
  total_talk_time:
    lineage:
      - datalake_quinto_messenger_clean.task_event.ts_created
      - datalake_twilio_flex_insights_clean.conversation_time_metrics.total_talk_time
    description: >
      Seconds the agent stayed engaged in the contact. For chat it is measured from the task event
      trail, as the elapsed time between the reservation being accepted and completed; Twilio Flex
      Insights is used only when that trail is incomplete. For calls it always comes from Twilio.
  total_queue_time:
    lineage:
      - datalake_quinto_messenger_clean.task_event.ts_created
      - datalake_twilio_flex_insights_clean.conversation_time_metrics.total_queue_time
    description: >
      Seconds the contact waited in queue before an agent accepted it. For chat it is measured from
      the task event trail, as the elapsed time between the task being created and the reservation
      being accepted; Twilio Flex Insights is used only when that trail is incomplete. For calls it
      always comes from Twilio.
  total_wrap_up_time:
    lineage:
      - datalake_quinto_messenger_clean.task_event.ts_created
      - datalake_twilio_flex_insights_clean.conversation_time_metrics.total_wrap_up_time
    description: >
      Seconds the agent spent on post-contact work. For chat it is the elapsed time between the
      task wrap-up event and the reservation being completed, and zero when the task emitted no
      wrap-up event, which is the case for the vast majority of chats. For calls it comes from
      Twilio Flex Insights.
  total_waiting_time:
    lineage:
      - datalake_quinto_messenger_clean.task_event.ts_created
      - datalake_twilio_flex_insights_clean.conversation_time_metrics.total_waiting_time
    description: >
      Seconds the customer waited across all phases of the contact. For chat it matches
      total_queue_time, which is how Twilio Flex Insights itself reports it for this channel. For
      calls it comes from Twilio.
  first_reply_time:
    lineage:
      - datalake_customer_support.chats.seconds_to_first_response
      - datalake_customer_support.calls.waiting_time_sec
    description: First reply time during the contact.
  total_handling_time:
    lineage:
      - datalake_quinto_messenger_clean.task_event.ts_created
      - datalake_twilio_flex_insights_clean.conversation_time_metrics.total_handling_time
    description: >
      Total agent effort on the contact, in seconds, as talk time plus wrap-up time. For chat it is
      computed from the task event trail; Twilio Flex Insights is used only when that trail is
      incomplete. For calls it always comes from Twilio.
  total_inactivity_time:
    lineage:
      - datalake_customer_support.chats.total_inactivity_time
    description: Total inactivity time during Twilio task, in seconds.
  last_inactivity_time:
    lineage:
      - datalake_customer_support.chats.last_inactivity_time
    description: Last inactivity time during each Twilio task, in seconds.
  is_per_team_task:
    lineage:
      - datalake_customer_support.chats.is_per_team_task
    description: Flag that matches the 'per team' field from Twilio Flex Insights
  is_contact_answered:
    lineage:
      - datalake_customer_support.calls.is_call_answered
    description: Indicates if the contact was answered.
  is_interaction_answered:
    lineage:
      - datalake_customer_support.calls.is_reservation_answered
    description: Indicates if the interaction was answered.
  is_spoc_task:
    description: True if the task was originated by SPOC
  is_isaias_session:
    lineage:
      - datalake_customer_support.chats.is_isaias_session
    description: Indicates if the session is part of an ISAIAS AI Agent interaction
  is_first_interaction:
    description: Indicates if this is the first interaction in the contact.
  is_last_interaction:
    description: Indicates if this is the last interaction in the contact.
  is_first_department_interaction:
    description: Indicates if this is the first interaction in the department for the contact.
  ts_task_created:
    lineage:
      - datalake_customer_support.calls.ts_task_created
      - datalake_customer_support.chats.ts_created
    description: Timestamp when the task was created.
  ts_reservation_created:
    lineage:
      - datalake_customer_support.calls.ts_reservation_created
      - datalake_quinto_messenger_clean.task_event.ts_created
    description: >
      Timestamp when the reservation was created. For chat it is the first reservation acceptance
      recorded in the task event trail, converted to local time.
  ts_reservation_ended:
    lineage:
      - datalake_customer_support.calls.ts_reservation_ended
    description: Timestamp when the reservation ended.
  ts_load:
    description: Timestamp when the contact data was loaded.
