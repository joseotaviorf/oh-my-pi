database_name: dw_customer_support
table_name: fact_single_door_events
description: Table with events related to Single Door features
domain: Support and Services
owner: gabriel.firmino@quintoandar.com.br
columns:
  sk_event:
    lineage:
      - datalake_amplitude_clean.events.id_amplitude
    description: Data warehouse surrogate key for event used in support reporting joins.
  sk_user:
    lineage:
      - datalake_amplitude_clean.events.id_user
    description: Data warehouse surrogate key for user used in support reporting joins.
  event_from:
    description: What feature the event is from
  event_type:
    lineage:
      - datalake_amplitude_clean.events.event_type
    description: Lifecycle event label emitted by the telephony provider for this call-handling step.
  app:
    description: If the event is from the tenant or landlord app
  event_properties:
    lineage:
      - datalake_amplitude_clean.events.event_properties
    description: Properties of the event, contains relevant metadata of the interaction performed by the user
  city:
    lineage:
      - datalake_amplitude_clean.events.city
    description: Business value representing city on the fact_single_door_events dw dataset.
  region:
    lineage:
      - datalake_amplitude_clean.events.region
    description: Business value representing region on the fact_single_door_events dw dataset.
  country:
    lineage:
      - datalake_amplitude_clean.events.country
    description: Business value representing country on the fact_single_door_events dw dataset.
  device_carrier:
    lineage:
      - datalake_amplitude_clean.events.device_carrier
    description: Internet provider from the connection where the event happened
  device_family:
    lineage:
      - datalake_amplitude_clean.events.device_family
    description: Business value representing device family on the fact_single_door_events dw dataset.
  device_type:
    lineage:
      - datalake_amplitude_clean.events.device_type
    description: Device specific model
  os_name:
    lineage:
      - datalake_amplitude_clean.events.os_name
    description: iOS or Android
  os_version:
    lineage:
      - datalake_amplitude_clean.events.os_version
    description: Business value representing os version on the fact_single_door_events dw dataset.
  version_name:
    lineage:
      - datalake_amplitude_clean.events.version_name
    description: Human-readable version name used in dashboards and operational reports.
  ts_event:
    lineage:
      - datalake_amplitude_clean.events.ts_event
    description: Timestamp when the API gateway recorded the HTTP request in the access log stream.
  ts_load:
    description: This timestamp indicates when this data was loaded into dw_customer_support.
  year:
    description: Partition column
  month:
    description: Partition column
  day:
    description: Partition column
