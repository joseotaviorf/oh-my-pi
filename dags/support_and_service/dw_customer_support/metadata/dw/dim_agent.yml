database_name: dw_customer_support
table_name: dim_agent
description: Dimension containing agents attributes. Values obtained from Controle
  Analistas 2.0 sheet.
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  sk_agent:
    lineage:
    - datalake_customer_support.call.id_agent
    - datalake_customer_support.chat.id_agent
    - datalake_customer_support.email.id_agent
    description: Unique agent identifier.
  email:
    lineage:
    - datalake_customer_support.call.agent_email
    - datalake_customer_support.chat.agent_email
    - datalake_customer_support.email.agent_email
    description: Agent email.
  agent_manager:
    lineage:
    - datalake_customer_support.call.agent_manager
    - datalake_customer_support.chat.agent_manager
    - datalake_customer_support.email.agent_manager
    description: Agent manager.
  full_name:
    lineage:
    - datalake_customer_support.call.agent_name
    - datalake_customer_support.chat.agent_name
    - datalake_customer_support.email.agent_name
    description: Agent name.
  agent_company:
    lineage:
    - datalake_customer_support.call.agent_company
    - datalake_customer_support.chat.agent_company
    - datalake_customer_support.email.agent_company
    description: Agent company.
    categories:
      atento: Atento company.
      concentrix: Concentrix company.
      quintoandar: Quintoandar company.
      actionline: Action Line.
  dt_agent_start:
    lineage:
    - datalake_customer_support.call.dt_agent_start
    - datalake_customer_support.chat.dt_agent_start
    - datalake_customer_support.email.dt_agent_start
    description: Date agent start working for QuintoAndar.
