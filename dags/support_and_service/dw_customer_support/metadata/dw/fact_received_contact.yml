database_name: dw_customer_support
table_name: fact_received_contact
description:
  DEPRECATED - DW table that turns data from datalake_customer_support.received_demand into a fact table
  It has data from call, chat and email channels, where each row is a 'demand' generated by
  a customer contacting 5A, identified by sk_interaction. For further information check the documention from the
  received_demand table.
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  sk_interaction:
    lineage:
      - datalake_customer_support.received_demand.id_task
      - datalake_customer_support.received_demand.id_ticket
    description:
      DEPRECATED - MD5 unique ID generated to represent every interaction a customer had.
      This is basically an MD5 on top of id_task for call and chat, and id_ticket for
      email.
  sk_contact:
    lineage:
      - datalake_customer_support.received_demand.id_call
      - datalake_customer_support.received_demand.id_ticket
      - datalake_customer_support.received_demand.id_session
    description:
      DEPRECATED - MD5 unique ID generated for every group of interactions in call (using id_call),
      chat(using id_session) and email (using id_ticket).
  sk_call:
    lineage:
      - datalake_customer_support.received_demand.id_call
    description: DEPRECATED - MD5 unique identifier for every ID call from Twilio
  sk_session:
    lineage:
      - datalake_customer_support.received_demand.id_session
    description: DEPRECATED - MD5 unique identifier for every Sauron session
  sk_ticket:
    lineage:
      - datalake_customer_support.received_demand.id_ticket
    description: DEPRECATED - MD5 unique identifier for every Zendesk ticket
  sk_task:
    lineage:
      - datalake_customer_support.received_demand.id_task
    description: DEPRECATED - MD5 unique identifier for every Twilio task
  sk_taxonomy:
    lineage:
      - datalake_customer_support.received_demand.step_tag
      - datalake_customer_support.received_demand.customer_type_tag
      - datalake_customer_support.received_demand.client_type
      - datalake_customer_support.received_demand.request_type
      - datalake_customer_support.received_demand.contact_motivation_tag
      - datalake_customer_support.received_demand.contact_theme_tag
      - datalake_customer_support.received_demand.contact_theme_detail_tag
    description: DEPRECATED - MD5 unique ID from all taxonomies fields.
  sk_user:
    lineage:
      - datalake_customer_support.received_demand.id_user
    description: DEPRECATED - MD5 unique identifier for every user ID.
  sk_agent:
    lineage:
      - datalake_customer_support.received_demand.agent_email
    description: DEPRECATED - Unique agent identifier key.
  sk_department:
    lineage:
      - datalake_customer_support.received_demand.department
    description: DEPRECATED - MD5 generated for every department represented in dim_department
  sk_reservation:
    lineage:
      - datalake_customer_support.received_demand.id_reservation
    description: DEPRECATED - MD5 unique identifier for every ID reservation from Twilio
  channel:
    lineage:
      - datalake_customer_support.received_demand.channel
    description: DEPRECATED - Channel name which customer got in touch with 5A
    categories:
      call: channel_name receives this value when the customer get in touch via call
      chat: channel_name receives this value when the customer get in touch via chat
      email: channel_name receives this value when the customer get in touch via email
  origin:
    description: DEPRECATED - Describes the origin of the interaction, only valid for call interactions.
  agent_email:
    lineage:
      - datalake_customer_support.received_demand.agent_email
    description: DEPRECATED - The agent email.
  customer_phone:
    lineage:
      - datalake_customer_support.received_demand.customer_phone
    description: DEPRECATED - The user customer phone. It is NULL for email channel.
  customer_email:
    lineage:
      - datalake_customer_support.received_demand.customer_email
    description: DEPRECATED - The user customer phone. It is NULL for call and chat channels.
  transferred_from:
    lineage:
      - datalake_customer_support.received_demand.department
    description:
      DEPRECATED - From which department the interaction comes from. NULL if there is no
      transfer or if it is the first interaction of a contact
  transferred_to:
    lineage:
      - datalake_customer_support.received_demand.department
    description:
      DEPRECATED - Department which the interaction goes to. NULL if there is no transfer or if
      it is the last interaction of a contact
  status:
    lineage:
      - datalake_customer_support.received_demand.status
    description: DEPRECATED - How a task ended, the final state of every interaction in a call, chat or email
  completion_reason:
    lineage:
      - datalake_customer_support.received_demand.completion_reason
    description: DEPRECATED - Reason for a given Twilio task to have been completed.
  average_reply_time:
    lineage:
      - datalake_customer_support.received_demand.average_reply_time
    description: DEPRECATED - Average reply time for every agent on a task - considering all messages the agent exchanged with the customer.
  total_queue_time:
    lineage:
      - datalake_twilio_flex_insights_clean.conversation_time_metrics.total_queue_time
    description: DEPRECATED - Total time of the conversation spent in queue
  total_talk_time:
    lineage:
      - datalake_twilio_flex_insights_clean.conversation_time_metrics.total_talk_time
    description: DEPRECATED - Total time of the conversation spent talking
  total_wrap_up_time:
    lineage:
      - datalake_twilio_flex_insights_clean.conversation_time_metrics.total_wrap_up_time
    description: DEPRECATED - Wrap up time is the time spent by the agent after it has talked to the customer
  total_handling_time:
    lineage:
      - datalake_twilio_flex_insights_clean.conversation_time_metrics.total_handling_time
    description: DEPRECATED - Total time spent by the agent handled the customer task. This is the sum of talk, queue and wrap up time
  total_waiting_time:
    lineage:
      - datalake_twilio_flex_insights_clean.conversation_time_metrics.total_waiting_time
    description: DEPRECATED - Total time the customer spent waiting for an agent
  first_reply_time:
    lineage:
      - datalake_twilio_flex_insights_clean.conversation_time_metrics.first_reply_time
    description: DEPRECATED - Time until the first reply of the agent
  is_answered:
    lineage:
      - datalake_customer_support.received_demand.is_answered
    description:
      DEPRECATED - The status of the demand, whether it was answered or not, is determined
      differently based on the channel. For call, the Twilio Reservation ID is
      considered to determine if the demand was accepted by a worker or not.
      For chat, the demand is considered answered if the corresponding Event Task
      has a conversation_measure_1 attribute NOT NULL. The conversation measure 1
      indicates the time elapsed between the moment the task was assigned to a worker
      and the moment the worker accepted the task and started working on it.
      This metric is also known as the "acceptance time" or "task acceptance time".
      It is used to track how quickly workers are able to start working on tasks once
      they are assigned to them, which can help optimize workflows and improve customer
      satisfaction. For Zendesk E-mail Tickets, the demand is always considered answered.
  is_per_team_task:
    description:
      DEPRECATED - Boolean attribute in a task that defines if it is transfer between differente departments. This value is used to
      build the "segments per team" metric.
  is_first_interaction:
    lineage:
      - datalake_customer_support.received_demand.id_call
      - datalake_customer_support.received_demand.id_ticket
      - datalake_customer_support.received_demand.id_session
    description: DEPRECATED - Boolean if the interaction is the first of it's contact
  is_first_department_interaction:
    lineage:
      - datalake_customer_support.received_demand.id_call
      - datalake_customer_support.received_demand.id_ticket
      - datalake_customer_support.received_demand.id_session
      - datalake_customer_support.received_demand.department
    description: DEPRECATED - Boolean if in a contact, the interaction is the first of it's department
  is_last_interaction:
    lineage:
      - datalake_customer_support.received_demand.id_call
      - datalake_customer_support.received_demand.id_ticket
      - datalake_customer_support.received_demand.id_session
    description: DEPRECATED - Boolean if the interaction is the last of it's contact
  ts_reservation_created:
    lineage:
      - datalake_customer_support.received_demand.ts_created
    description:
      DEPRECATED - For Twilio Events, the creation timestamp of every 'reservation.created' event.
      Only present in the 'chat' channel
  ts_task_created:
    lineage:
      - datalake_customer_support.received_demand.ts_created
    description: DEPRECATED - For Twilio Events, the creation timestamp of every task
  ts_created:
    lineage:
      - datalake_customer_support.received_demand.ts_created
    description:
      DEPRECATED - For Twilio Events, the creation timestamp represents the date and time when the
      event was created. For Zendesk E-mail Tickets, the creation timestamp corresponds
      to the ticket creation date in UTC-3.
