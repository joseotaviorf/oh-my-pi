database_name: dw_customer_support
table_name: dim_department
description:
  Dimension containing department attributes. Those attributes are collected
  from Controle Analistas 2.0 sheet.
domain: Support and Services
owner: data-ae-ss@quintoandar.com.br
columns:
  sk_department:
    lineage:
      - datalake_gsheets_clean.department_control.department
    description: Key generated as a MD5 from the department string.
  department:
    lineage:
      - datalake_gsheets_clean.department_control.department
    description: Department name.
  board:
    lineage:
      - datalake_gsheets_clean.department_control.board
    description: Deparmtnet board.
  team:
    lineage:
      - datalake_gsheets_clean.department_control.team
    description: Department team.
  journey_step:
    lineage:
      - datalake_gsheets_clean.department_control.journey_step
    description: Department journey step.
  channel:
    lineage:
      - datalake_gsheets_clean.department_control.channel
    description: Department channel.
    categories:
      Chat Deparment: Zendesk department for chat support in Twilio.
      Twillio: Twilio department.
      CRM: CRM task.
      Teravoz: Deprecated, teravoz department.
      Ticket Group: Zendesk department.
      Call Queue: Zendesk department for call support in Twilio.
  front_or_back:
    lineage:
      - datalake_gsheets_clean.department_control.front_or_back
    description: Department classification as front or back.
  area:
    lineage:
      - datalake_gsheets_clean.department_control.area
    description: Department area (e.g. CX).
  concentrix_area_name:
    lineage:
      - datalake_gsheets_clean.department_control.concentrix_area_name
    description: Concentrix internal area name.
  is_concentrix:
    lineage:
      - datalake_gsheets_clean.department_control.concentrix_area
    description: Boolean marking if the department is from concentrix.
  is_active:
    lineage:
      - datalake_gsheets_clean.department_control.active_department
    description: Boolean column showing if the department is active.
  is_partner:
    description: Indicates whether the department belongs to a 5A partner.
    lineage:
      - datalake_gsheets_clean.department_control.is_partner
  ts_load:
    description: This timestamp indicates when this data was loaded into dw_customer_support.
