database_name: dw_customer_support
table_name: dim_channel
description: >
  Support channel dimension. One row per distinct customer support channel, capturing
  channel identifier, direction, and classification attributes used to dimension
  fact tables in the customer support data warehouse layer.
domain: Support and Services
owner: gabriel.firmino@quintoandar.com.br
columns:
  sk_channel:
    lineage:
      - datalake_customer_support.tickets.direction
      - datalake_customer_support.tickets.channel
      - datalake_customer_support.tickets.ticket_origin
    description: Key generated to identify the channel of this ticket.
  direction:
    lineage:
      - datalake_customer_support.tickets.direction
    description: Communication direction of the contact channel — inbound (customer-initiated) or outbound (agent-initiated).
  channel:
    lineage:
      - datalake_customer_support.tickets.channel
    description: Channel the support ocurred (call, chat, email).
  origin:
    lineage:
      - datalake_customer_support.tickets.ticket_origin
    description: Origin of the support (n/a, in app, whatsapp).
  ts_load:
    description: This timestamp indicates when this data was loaded into dw_customer_support.
