dag:
  name: dw_customer_support
  schedule_start_date: 2021,2,7
  owner: Data SS
  documentation:
    dag_purpose: |
      This DAG load the DW tables for Customer Support.

workflow:
  type: query_delta
  layer: dw
  custom_schema: customer_support
  default_extraction_type: full
  inner_dependencies:
    fact_tickets:
    - fact_customer_contacts
  tables_customization:
    fact_user_blocks:
      partitions: [year, month, day]
      extraction_type: incremental
      z_order_by: [sk_user, channel]
    fact_single_door_events:
      partitions: [year, month, day]
      extraction_type: incremental
      z_order_by: [sk_user, event_from, event_type, app]
    fact_agent_ranking:
      partitions: [year, month, day]
      extraction_type: incremental
    fact_agent_daily_productivity:
      partitions: [year, month, day]
      extraction_type: incremental
    fact_analysts_performance:
      partitions: [year, month, day]
      extraction_type: incremental
      z_order_by: [sk_snapshot, sk_agent, sk_last_ticket_updated_date]
    fact_sessions_chatbot:
      partitions: [year, month, day]
      extraction_type: incremental
      z_order_by: [sk_session, sk_ticket, sk_user, sk_pipeline, sk_content, sk_contract, sk_survey, sk_answer, sk_started_chat, sk_ended_chat]
      extra_query_template_params:
        load_start_date: "{{ get_date_param(dag_run, macros.ds_add(ds, -7), 'load_start_date') }}"
        load_end_date: "{{ get_date_param(dag_run, ds, 'load_end_date') }}"
      merge_on: [sk_session]
    dim_chatbot:
      partitions: [year, month, day]
      extraction_type: incremental
      z_order_by: [sk_session]
      merge_on: [sk_session]
    dim_ra_ticket:
      partitions: [year, month, day]
      extraction_type: incremental
      z_order_by: [sk_ra_ticket]
      merge_on: [sk_ra_ticket]
    fact_tickets:
      z_order_by: [sk_ticket]
      merge_on: [sk_ticket]
    fact_ivr_interactions:
      z_order_by: [sk_task]
      merge_on: [sk_interaction]
    fact_customer_contacts:
      z_order_by: [sk_contact, sk_interaction]
      merge_on: [sk_contact, sk_interaction, sk_user, sk_department]
    fact_tickets_backlog:
      partitions: [dt_snapshot]
      z_order_by: [sk_ticket, sk_taxonomy, sk_department, sk_analyst]
    fact_ticket_events:
      partitions: [year, month, day]
      extraction_type: incremental

cluster:
  type: custom_cluster
  custom_configurations:
    driver_node_type_id: r7g.2xlarge
    node_type_id: r7g.2xlarge
    spark_version: 13.3.x-scala2.12
    num_workers: 4
    spark_conf:
      spark.sql.broadcastTimeout: "600"
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
  databricks_conn_id: databricks_new
