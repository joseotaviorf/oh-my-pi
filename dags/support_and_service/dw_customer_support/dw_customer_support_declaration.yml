dag:
  name: dw_customer_support
  schedule_start_date: 2021,2,7
  owner: Data SS
  criticality: High
  documentation:
    dag_purpose: |
      This DAG load the DW tables for Customer Support.

workflow:
  type: query_delta
  layer: dw
  custom_schema: customer_support
  default_extraction_type: full
  inner_dependencies:
    fact_tickets:
      - fact_ticket_events
      - fact_customer_contacts
    fact_task_metrics:
      - fact_customer_contacts
    fact_analysts_performance:
      - fact_customer_contacts
  tables_customization:
    fact_single_door_events:
      partitions: [year, month, day]
      extraction_type: incremental
      z_order_by: [sk_user, event_from, event_type, app]
    fact_analysts_performance:
      partitions: [year, month, day]
      extraction_type: incremental
      z_order_by: [sk_snapshot, sk_agent, sk_reference_date]
    fact_sessions_chatbot:
      partitions: [year, month, day]
      extraction_type: incremental
      z_order_by:
        [
          sk_session,
          sk_ticket,
          sk_user,
          sk_pipeline,
          sk_content,
          sk_contract,
          sk_survey,
          sk_answer,
          sk_started_chat,
          sk_ended_chat,
        ]
      merge_on: [sk_session]
    dim_chatbot:
      partitions: [year, month, day]
      extraction_type: incremental
      z_order_by: [sk_session]
      merge_on: [sk_session]
    dim_ra_ticket:
      partitions: [year, month, day]
      extraction_type: incremental
      z_order_by: [sk_ra_ticket]
      merge_on: [sk_ra_ticket]
    fact_tickets:
      z_order_by: [sk_ticket]
      merge_on: [sk_ticket]
    fact_ivr_interactions:
      z_order_by: [sk_task]
      merge_on: [sk_interaction]
    fact_tickets_backlog:
      partitions: [dt_snapshot]
      z_order_by: [sk_ticket, sk_taxonomy, sk_department, sk_analyst]
    fact_ticket_events:
      partitions: [year, month, day]
      extraction_type: incremental
    fact_task_metrics:
      z_order_by: [sk_task, sk_ticket, sk_user]
    fact_chat_messages:
      merge_on: [sk_message]
      z_order_by: [sk_session]
    fact_chat_metrics:
      z_order_by: [sk_session]


