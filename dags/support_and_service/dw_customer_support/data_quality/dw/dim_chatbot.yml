table_name: dw_customer_support_staging.dim_chatbot
alert_channel: "#alerts-de-airflow-dags"
table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error
column_level_validations:
  sk_session:
    is_complete:
      severity_level: Error
    is_unique:
      severity_level: Error
  flags:
    is_complete:
      severity_level: Error
  current_state:
    is_complete:
      severity_level: Error
  session_type:
    is_complete:
      severity_level: Error
  channel:
    is_contained_in:
      values:
        - 'Chat In-App'
        - 'WhatsApp'
        - 'Vazio'
        - 'Outros'
      severity_level: Error