      "NOT STARTED": Not started, difficulty is not defined
      "NO APPOINTMENT": No appointment, difficulty is not defined
      "LOW RISK": Low risk, difficulty is low
      "MODERATE RISK": Medium risk, difficulty is medium
      "HIGH RISK": High risk, difficulty is high
