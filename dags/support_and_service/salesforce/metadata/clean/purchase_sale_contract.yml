      "ONBOARDING": Onboardin
      "PAYMENT_OF_THE_DEPOSIT": Payment of the deposit
      "DILIGENCE": Diligence
      "CRN": CRN (Notary Office)
      "ITBI": ITBI (Property Transfer Tax)
      "BALANCE_PAYMENT": Balance payment
      "CRI": CRI (Real Estate Credit Certificate)
      "KEY_DELIVERY": Key delivery
