      - datalake_salesforce_raw.task.RecurrenceRegeneratedType
    description: Business value representing recurrence regenerated type on the task clean dataset.
  task_name:
    lineage:
      - datalake_salesforce_raw.task.TaskName
    description: Human-readable task name used in dashboards and operational reports.
  task_interaction_type:
    lineage:
      - datalake_salesforce_raw.task.TaskInteractionType
    description: Type of interaction related to the task.
  case_criticality:
    lineage:
      - datalake_salesforce_raw.task.CaseCriticality
    description: Criticality level of the related case.
  case_account:
    lineage:
      - datalake_salesforce_raw.task.CaseAccount
    description: Account associated with the case.
  observation:
    lineage:
      - datalake_salesforce_raw.task.Observation
    description: Observations about the task.
  delay_message:
    lineage:
      - datalake_salesforce_raw.task.DelayMessage
    description: Message related to task delay.
  experiment_group:
    lineage:
      - datalake_salesforce_raw.task.ExperimentGroup
    description: Business value representing experiment group on the task clean dataset.
  unlisting_reason:
    lineage:
      - datalake_salesforce_raw.task.UnlistingReason
    description: Reason for unlisting the house.
  is_answer:
    lineage:
      - datalake_salesforce_raw.task.Answer
    description: Response associated with the task.
  is_high_priority:
    lineage:
      - datalake_salesforce_raw.task.IsHighPriority
    description: Indicates if the task is of high priority.
  is_deleted:
    lineage:
      - datalake_salesforce_raw.task.IsDeleted
    description: Indicates if the task is deleted.
  is_closed:
    lineage:
      - datalake_salesforce_raw.task.IsClosed
    description: Indicates if the task is closed.
  is_archived:
    lineage:
      - datalake_salesforce_raw.task.IsArchived
    description: Indicates if the task is archived.
  is_reminder_set:
    lineage:
      - datalake_salesforce_raw.task.IsReminderSet
    description: Indicates if a reminder is set for the task.
  is_recurrence:
    lineage:
      - datalake_salesforce_raw.task.IsRecurrence
    description: Indicates if the task is recurrent.
  is_ab_test:
    lineage:
      - datalake_salesforce_raw.task.IsABTest
    description: Flag indicating if the task is an AB test.
  contract_id_odd_even:
    lineage:
      - datalake_salesforce_raw.task.ContractIdOddOrEven
    description: Descriptive column indicating if the case contract ID is odd or even.
  communication_task:
    lineage:
      - datalake_salesforce_raw.task.CommunicationTask
    description: Picklist field that identifies whether the task is linked to an HSM submission.
    categories:
      AgentTask: "This value is when an error occurs while sending and returns to the agent's action."
      HSMAutomation: "Sending HSM Whatsapp."
      EmailAutomation: "Sending email."
  communication_status:
    lineage:
      - datalake_salesforce_raw.task.CommunicationStatus
    description: Indicates the sending status of the HSM message associated with the task.
    categories:
      Sent: "The message was transmitted successfully."
      Pending: "The message is waiting to be sent or processed."
      Error: "There was a failure to send or the return was error."
  is_hsm_sent:
    lineage:
      - datalake_salesforce_raw.task.HSMSent
    description: Indicates if the task is an HSM sent.
  is_email_sent:
    lineage:
      - datalake_salesforce_raw.task.EmailSent
    description: Indicates if the task is an email sent.
  responsability_contesting_is_good:
    lineage:
      - datalake_salesforce_raw.task.ResponsabilityContestingIsGood
    description: Indicator of responsibility contesting.
  ts_completed:
