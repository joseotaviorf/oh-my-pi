database_name: datalake_salesforce_clean
table_name: task
description: Clean table for ingesting task data from the Sales Force tool.
domain: Support and Services
owner: gabriel.firmino@quintoandar.com.br
columns:
  id_task:
    lineage:
      - datalake_salesforce_raw.task.Id
    description: Unique identification key for task in Sales Force.
  id_who:
    lineage:
      - datalake_salesforce_raw.task.WhoId
    description: Identification key of the person related to the task.
  id_what:
    lineage:
      - datalake_salesforce_raw.task.WhatId
    description: Identification key of the object related to the task.
  id_owner:
    lineage:
      - datalake_salesforce_raw.task.OwnerId
    description: Owner identification key of the task.
  id_account:
    lineage:
      - datalake_salesforce_raw.task.AccountId
    description: Account identification key associated with the task.
  id_recurrence_activity:
    lineage:
      - datalake_salesforce_raw.task.RecurrenceActivityId
    description: Recurrence activity identification key.
  id_contract:
    lineage:
      - datalake_salesforce_raw.task.ContractId
    description: Contract identification key related to the task.
  id_source_task:
    lineage:
      - datalake_salesforce_raw.task.SourceTask__c
    description: Custom field to record the ID of the task that originated another.
  who_count:
    lineage:
      - datalake_salesforce_raw.task.WhoCount
    description: Count of related people.
  what_count:
    lineage:
      - datalake_salesforce_raw.task.WhatCount
    description: Count of related objects.
  subject:
    lineage:
      - datalake_salesforce_raw.task.Subject
    description: Human-readable subject line describing the CRM task purpose for agents and reporting.
  status:
    lineage:
      - datalake_salesforce_raw.task.Status
    description: Current status of the task.
  priority:
    lineage:
      - datalake_salesforce_raw.task.Priority
    description: Priority level of the task.
  type:
    lineage:
      - datalake_salesforce_raw.task.Type
    description: Classification type assigned by the source platform for routing or reporting.
  call_duration_in_seconds:
    lineage:
      - datalake_salesforce_raw.task.CallDurationInSeconds
    description: Business value representing call duration in seconds on the task clean dataset.
  call_type:
    lineage:
      - datalake_salesforce_raw.task.CallType
    description: Type of call associated with the task.
  call_disposition:
    lineage:
      - datalake_salesforce_raw.task.CallDisposition
    description: Disposition status of the call.
  call_object:
    lineage:
      - datalake_salesforce_raw.task.CallObject
    description: Object reference of the call.
  task_subtype:
    lineage:
      - datalake_salesforce_raw.task.TaskSubtype
    description: Business value representing task subtype on the task clean dataset.
  recurrence_type:
    lineage:
      - datalake_salesforce_raw.task.RecurrenceType
    description: Type of recurrence pattern.
  recurrence_interval:
    lineage:
      - datalake_salesforce_raw.task.RecurrenceInterval
    description: Interval between recurrences.
  recurrence_day_of_week_mask:
    lineage:
      - datalake_salesforce_raw.task.RecurrenceDayOfWeekMask
    description: Mask representing recurring days of the week.
  recurrence_day_of_month:
    lineage:
      - datalake_salesforce_raw.task.RecurrenceDayOfMonth
    description: Business value representing recurrence day of month on the task clean dataset.
  recurrence_instance:
    lineage:
      - datalake_salesforce_raw.task.RecurrenceInstance
    description: Instance of recurrence within a month.
  recurrence_month_of_year:
    lineage:
      - datalake_salesforce_raw.task.RecurrenceMonthOfYear
    description: Business value representing recurrence month of year on the task clean dataset.
  recurrence_regenerated_type:
