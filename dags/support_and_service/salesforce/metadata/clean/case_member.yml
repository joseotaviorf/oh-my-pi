    description: System modification timestamp.
  dt_last_activity:
    lineage:
      - datalake_salesforce_raw.case_member.LastActivityDate
    description: Date of the last activity related to the case member.
  ts_created:
    lineage:
      - datalake_salesforce_raw.case_member.CreatedDate
    description: Timestamp of when the record was created.
  ts_last_modified:
    lineage:
      - datalake_salesforce_raw.case_member.LastModifiedDate
    description: Timestamp of the last modification.
  year:
    lineage:
      - datalake_salesforce_raw.case_member.year
    description: Year of the case member record.
  month:
    lineage:
      - datalake_salesforce_raw.case_member.month
    description: Month of the case member record.
  day:
    lineage:
      - datalake_salesforce_raw.case_member.day
    description: Day of the case member record.
  ts_load:
    description: Timestamp of the load.
