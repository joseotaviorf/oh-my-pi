database_name: datalake_salesforce_clean
table_name: case_member
description: Clean table for ingesting case member data from the Sales Force tool.
domain: Support and Services
owner: data-ae-ss@quintoandar.com.br
columns:
  id_case_member:
    lineage:
      - datalake_salesforce_raw.case_member.Id
    description: Unique identification key for case member in Sales Force.
  id_owner:
    lineage:
      - datalake_salesforce_raw.case_member.OwnerId
    description: Owner identification key in Salesforce.
  id_case:
    lineage:
