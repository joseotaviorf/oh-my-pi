    lineage:
      - datalake_salesforce_raw.dynamic_forms.Id
    description: Unique identification key for the dynamic form in Sales Force.
  id_owner:
    lineage:
      - datalake_salesforce_raw.dynamic_forms.OwnerId
    description: Owner identification key of the dynamic form.
  id_record_type:
    lineage:
