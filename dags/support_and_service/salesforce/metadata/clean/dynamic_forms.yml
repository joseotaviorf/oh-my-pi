    description: User identification key who created the dynamic form.
  id_last_modified_by:
    lineage:
      - datalake_salesforce_raw.dynamic_forms.LastModifiedById
    description: User identification key who last modified the dynamic form.
  id_external:
    lineage:
      - datalake_salesforce_raw.dynamic_forms.ExternalId__c
    description: External identification key for the dynamic form.
  id_parent_form:
    lineage:
