dag:
  name: salesforce
  owner: Data SS
  schedule_start_date: 2025, 02, 10
  schedule_interval: 0 3 * * *
  documentation:
    dag_purpose: |
      DAG for ingesting data from the Sales Force tool, this DAG uses the Sales Force API to query data from operations performed in the tool.
workflow:
  type: custom_ingestion
  layer: raw
  custom_schema: salesforce
  load_spark_job: load_salesforce_raw
  spark_job_arguments:
    - "{environment}"
    - "{bucket}"
    - "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    - "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
    - "{table_name}"
    - "{partitions}"
    - "{schema}"
    - "https://quintoandar--fornov1.sandbox.my.salesforce.com"
    - "https://quintoandar.my.salesforce.com"

  default_extraction_type: incremental
  default_partitions: [year, month, day]
  tables_customization:
    account:
      extra_spark_job_arguments:
        - "SELECT Id,IsDeleted,MasterRecordId,Name,Type,RecordTypeId,ParentId,BillingStreet,BillingCity,BillingState,BillingPostalCode,BillingCountry,BillingLatitude,BillingLongitude,BillingGeocodeAccuracy,BillingAddress,ShippingStreet,ShippingCity,ShippingState,ShippingPostalCode,ShippingCountry,ShippingLatitude,ShippingLongitude,ShippingGeocodeAccuracy,ShippingAddress,Phone,Fax,AccountNumber,Website,PhotoUrl,Sic,Industry,AnnualRevenue,NumberOfEmployees,Ownership,TickerSymbol,Description,Rating,Site,OwnerId,CreatedDate,CreatedById,LastModifiedDate,LastModifiedById,SystemModstamp,LastActivityDate,LastViewedDate,LastReferencedDate,SourceSystemIdentifier,Jigsaw,JigsawCompanyId,AccountSource,SicDesc,CustomerId__c,ExternalId__c,Email__c FROM Account"
        - "LastModifiedDate"
    cases:
      extra_spark_job_arguments:
        - "SELECT Id,IsDeleted,MasterRecordId,CaseNumber,ContactId,AccountId,AssetId,ProductId,EntitlementId,SourceId,BusinessHoursId,ParentId,SuppliedName,SuppliedEmail,SuppliedPhone,SuppliedCompany,Type,RecordTypeId,Status,Reason,Origin,Language,Subject,Priority,Description,IsClosed,ClosedDate,IsEscalated,OwnerId,IsClosedOnCreate,SlaStartDate,SlaExitDate,IsStopped,StopStartDate,CreatedDate,CreatedById,LastModifiedDate,LastModifiedById,SystemModstamp,ContactPhone,ContactMobile,ContactEmail,ContactFax,Comments,LastViewedDate,LastReferencedDate,ServiceContractId,MilestoneStatus,IsABTest__c,ContractIdOddOrEven__c,ContestationResponsabilityValid__c,InformationCollected__c,LandlordInformedServiceProvider__c,PastDueDateSimulation__c,SimulationTenantBudgetTimeLimit__c,criticality__c,followUpDescription__c,followUpExpectedResolutionDate__c,followUpReassignDate__c,followUpStatus__c,isContest__c,RepairId__c,serviceProviderJourney__c,serviceProviderName__c,serviceProviderPhone__c,serviceProviderType__c,AlreadyAskedForApproval__c,AlreadyContested__c,CaseCreationStartMilestoneClosed__c,CaseCreationStartMilestone__c,LLBudgetApprovalTimeLimit__c,LLServiceConcluded__c,LandlordInformedTTServiceProvider__c,LandlordProviderNoHelpMilestoneClosed__c,LandlordProviderNoHelpMilestone__c,PPacceptedDoingRepair__c,RequestedHelpTimeLimit__c,TTsolicitedHelp__c,TenantProviderOwnerApprovalClosed__c,TenantProviderOwnerApprovalMilestone__c,TenantServiceProviderMilestoneClosed__c,TenantServiceProviderMilestone__c,ContractId__c,ZendeskId__c,ZendeskUrl__c,AgentRepublishedWithPP__c,ContactSuccess__c,MS_TT_Close_BudgetReviewIQ__c,MS_TT_Close_BudgetReviewPP__c,MS_TT_Close_ReportReviewIQ__c,MS_TT_Close_ReportReviewPP__c,MS_TT_Open_BudgetReviewIQ__c,MS_TT_Open_BudgetReviewPP__c,MS_TT_Open_ReportReviewIQ__c,MS_TT_Open_ReportReviewPP__c,Termination__c,ExternalId__c,AccountName__c,BYContactSuccess__c,BYCurrentOnboardingContact__c,CRNStatus__c,customerId__c,FlowSubType__c,ForSaleFlow__c,FS_BalancePaymentMade_