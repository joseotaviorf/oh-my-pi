dag:
  name: dw_chattermill
  schedule_start_date: 2021,02,07
  owner: Data SS
  documentation:
    dag_purpose: This DAG load the DW tables for Chatttermill data. Those data are related to NPS.
workflow:
  type: query_delta
  layer: dw
  custom_schema: chattermill
cluster:
  type: databricks_12_2_min_io-general_cluster
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
