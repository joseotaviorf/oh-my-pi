database_name: dw_chattermill
table_name: dim_answer_category
description: Dimension table that contains descriptive information about the categories a response can have.
domain: Support and Services
owner: data-ae-ss@quintoandar.com.br
columns:
  sk_category:
    lineage:
      - datalake_chattermill.responses.id_tag_theme
    description: Main identification key of the category in question.
  category:
    lineage:
      - datalake_chattermill.responses.tag_parent
    description: Descriptive data about the category related to its identification key.
  theme:
    lineage:
      - datalake_chattermill.responses.tag_name
    description: Descriptive data on the theme of the analyzed category.
  ts_load:
    description: Date of the last load of this base, in timestamp format.
