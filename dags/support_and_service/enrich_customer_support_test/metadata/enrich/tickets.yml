database_name: datalake_customer_support_test
table_name: tickes
description: Test table for tickets data
domain: Support and Service
owner: data-ae-ss@quintoandar.com.br
columns:
  id_ticket:
    lineage:
      - datalake_zendesk.tickets_current.id_ticket
    description: Unique identifier for each ticket.
  id_problem_ticket:
    lineage:
      - datalake_zendesk.tickets_current.id_problem_ticket
    description: Identifier for the problem associated with the ticket.
  id_user_main:
    lineage:
      - datalake_zendesk.tickets_current.id_user_main
    description: Identifier for the main user associated with the ticket.
  id_contract:
    lineage:
      - datalake_zendesk.tickets_current.id_contract
    description: Contract identifier related to the ticket.
  id_call:
    lineage:
      - datalake_zendesk.tickets_current.id_call
    description: Call identifier associated with the ticket.
  id_session:
    lineage:
      - datalake_zendesk.tickets_current.id_session
    description: Session identifier related to the ticket.
  id_twilio:
    lineage:
      - datalake_customer_support_test.chats.id_task
      - datalake_customer_support_test.calls.id_task
      - datalake_customer_support_test.calls.id_call
    description: Identifier from Twilio tasks or calls associated with the ticket.
  first_queue:
    lineage:
      - datalake_customer_support_test.chats.queue_name
      - datalake_customer_support_test.calls.queue_name
      - datalake_zendesk.tickets_current.group_name
    description: The first queue the ticket was assigned to.
  last_queue:
    lineage:
      - datalake_customer_support_test.chats.queue_name
      - datalake_customer_support_test.calls.queue_name
      - datalake_zendesk.tickets_current.group_name
    description: The most recent queue the ticket was assigned to.
  first_analyst_email:
    lineage:
      - datalake_zendesk.tickets_current.analyst_email
    description: Email of the first analyst who handled the ticket.
  last_analyst_email:
    lineage:
      - datalake_zendesk.tickets_current.analyst_email
    description: Email of the most recent analyst who handled the ticket.
  front_or_back:
    lineage:
      - datalake_gsheets_clean.department_control.front_or_back
    description: Indicates if the ticket is related to front-end or back-end operations.
  journey_step:
    lineage:
      - datalake_gsheets_clean.department_control.journey_step
    description: The step in the customer journey related to the ticket.
  team:
    lineage:
      - datalake_gsheets_clean.department_control.team
    description: The team responsible for handling the ticket.
  area:
    lineage:
      - datalake_gsheets_clean.department_control.area
    description: The area within the organization handling the ticket.
  status:
    lineage:
      - datalake_zendesk.tickets_current.status
    description: Current status of the ticket.
  channel:
    lineage:
      - datalake_zendesk.tickets_current.channel
    description: Communication channel through which the ticket was created.
  direction:
    lineage:
      - datalake_customer_support_test.calls.direction
      - datalake_customer_support_test.calls.channel_type
      - datalake_zendesk.tickets_current.tags
    description: Direction of the communication, either inbound or outbound.
  ticket_origin:
    lineage:
      - datalake_customer_support_test.calls.origin
      - datalake_customer_support_test.chats.source
    description: Origin of the ticket, indicating the source of the communication.
  tags:
    lineage:
      - datalake_zendesk.tickets_current.tags
    description: Tags associated with the ticket for categorization.
  type:
    lineage:
      - datalake_zendesk.tickets_current.type
    description: Type of the ticket, such as problem or request.
  description:
    lineage:
      - datalake_zendesk.tickets_current.description
    description: Detailed description of the ticket issue.
  request_type:
    lineage:
      - datalake_zendesk.tickets_current.request_type
    description: Type of request made in the ticket.
  client_type:
    lineage:
      - datalake_zendesk.tickets_current.client_type
    description: Type of client associated with the ticket.
  step_tag:
    lineage:
      - datalake_zendesk.tickets_current.step_tag
    description: Tag indicating the step in the process related to the ticket.
  customer_type_tag:
    lineage:
      - datalake_zendesk.tickets_current.customer_type_tag
    description: Tag indicating the type of customer related to the ticket.
  contact_theme_tag:
    lineage:
      - datalake_zendesk.tickets_current.contact_theme_tag
    description: Theme tag related to the contact in the ticket.
  contact_motivation_tag:
    lineage:
      - datalake_zendesk.tickets_current.contact_motivation_tag
    description: Motivation tag related to the contact in the ticket.
  contact_theme_detail_tag:
    lineage:
      - datalake_zendesk.tickets_current.contact_theme_detail_tag
    description: Detailed theme tag related to the contact in the ticket.
  custom_fields:
    lineage:
      - datalake_zendesk.tickets_current.custom_fields
    description: Custom fields in JSON format associated with the ticket.
  reopens:
    lineage:
      - datalake_zendesk.tickets_current.reopens
    description: Number of times the ticket has been reopened.
  replies:
    lineage:
      - datalake_zendesk.tickets_current.replies
    description: Number of replies to the ticket.
  back_ticket_list:
    description: List of back office tickets associated with the front ticket.
  total_backoffice_minutes_time:
    description: Total time spent in back office operations for the ticket.
  sla_target:
    lineage:
      - datalake_gsheets_clean.tag_sla_target.sla
      - datalake_gsheets_clean.taxonomy_sla.sla_in_days
    description: Service Level Agreement target time for resolving the ticket.
  days_worked:
    lineage:
      - datalake_zendesk.tickets_current.ts_solved
      - datalake_zendesk.tickets_current.ts_sla_started
      - datalake_quintoandar.aux_date.dt_non_working
      - datalake_gsheets_clean.service_city_holidays.dt_holiday
    description: Number of business days worked on the ticket.
  days_off:
    lineage:
      - datalake_quintoandar.aux_date.dt_non_working
      - datalake_gsheets_clean.service_city_holidays.dt_holiday
    description: Number of non-working days during the SLA period.
  time_spent_solved_in_time:
    lineage:
      - datalake_zendesk.tickets_current.ts_solved
      - datalake_zendesk.tickets_current.ts_sla_started
      - datalake_gsheets_clean.tag_sla_target.sla
      - datalake_gsheets_clean.taxonomy_sla.sla_in_days
      - datalake_quintoandar.aux_date.dt_non_working
      - datalake_gsheets_clean.service_city_holidays.dt_holiday
    description: Time spent solving the ticket within the SLA target.
  time_spent_not_solved_in_time:
    lineage:
      - datalake_zendesk.tickets_current.ts_solved
      - datalake_zendesk.tickets_current.ts_sla_started
      - datalake_gsheets_clean.tag_sla_target.sla
      - datalake_gsheets_clean.taxonomy_sla.sla_in_days
      - datalake_quintoandar.aux_date.dt_non_working
      - datalake_gsheets_clean.service_city_holidays.dt_holiday
    description: Time spent solving the ticket outside the SLA target.
  is_ticket_solved_in_time:
    lineage:
      - datalake_zendesk.tickets_current.ts_solved
      - datalake_zendesk.tickets_current.ts_sla_started
      - datalake_gsheets_clean.tag_sla_target.sla
      - datalake_gsheets_clean.taxonomy_sla.sla_in_days
      - datalake_quintoandar.aux_date.dt_non_working
      - datalake_gsheets_clean.service_city_holidays.dt_holiday
    description: Indicates if the ticket was solved within the SLA target.
  is_ticket_not_solved_in_time:
    lineage:
      - datalake_zendesk.tickets_current.ts_solved
      - datalake_zendesk.tickets_current.ts_sla_started
      - datalake_gsheets_clean.tag_sla_target.sla
      - datalake_gsheets_clean.taxonomy_sla.sla_in_days
      - datalake_quintoandar.aux_date.dt_non_working
      - datalake_gsheets_clean.service_city_holidays.dt_holiday
    description: Indicates if the ticket was not solved within the SLA target.
  context:
    lineage:
      - datalake_gsheets_clean.ticket_rate_classification.sub_journey
    description: Context category based on the sub-journey of the ticket.
  ticket_rate_weight:
    description: Weight assigned to the ticket rate based on various conditions.
  has_open_back_ticket:
    description: Indicates if there are any open back office tickets associated with the front ticket.
  is_back_ticket:
    lineage:
      - datalake_zendesk.tickets_current.tags
      - datalake_gsheets_clean.department_control.front_or_back
    description: Indicates if the ticket is a back office ticket.
  is_closed_by_merge:
    lineage:
      - datalake_zendesk.tickets_current.tags
    description: Indicates if the ticket was closed by a merge operation.
  is_call_answered:
    lineage:
      - datalake_customer_support_test.calls.is_call_answered
    description: Indicates if the associated call was answered.
  is_ticket_rate:
    lineage:
      - datalake_zendesk.tickets_current.channel
      - datalake_zendesk.tickets_current.front_or_back
      - datalake_zendesk.tickets_current.team
      - datalake_zendesk.tickets_current.area
      - datalake_zendesk.tickets_current.last_queue
      - datalake_zendesk.tickets_current.ticket_origin
      - datalake_zendesk.tickets_current.type
      - datalake_zendesk.tickets_current.tags
    description: Indicates if the ticket meets the rate criteria based on various conditions.
  ts_budget:
    lineage:
      - datalake_zendesk.tickets_current.ts_budget
    description: Timestamp related to the budget allocation for the ticket.
  ts_created:
    lineage:
      - datalake_zendesk.tickets_current.ts_created
    description: Timestamp when the ticket was created.
  ts_sla_started:
    lineage:
      - datalake_zendesk.tickets_current.ts_created
      - datalake_gsheets_clean.tag_sla_target.sla
      - datalake_gsheets_clean.taxonomy_sla.sla_in_days
    description: Timestamp when the SLA period started for the ticket.
  ts_solved:
    lineage:
      - datalake_zendesk.tickets_current.ts_solved
    description: Timestamp when the ticket was solved.
  ts_closed:
    lineage:
      - datalake_zendesk.tickets_current.ts_closed
    description: Timestamp when the ticket was closed.
  ts_updated:
    lineage:
      - datalake_zendesk.tickets_current.ts_updated
    description: Timestamp when the ticket was last updated.
  year:
    lineage:
      - datalake_zendesk.tickets_current.year
    description: Year component of the ticket's creation date.
  month:
    lineage:
      - datalake_zendesk.tickets_current.month
    description: Month component of the ticket's creation date.
  day:
    lineage:
      - datalake_zendesk.tickets_current.day
    description: Day component of the ticket's creation date.
