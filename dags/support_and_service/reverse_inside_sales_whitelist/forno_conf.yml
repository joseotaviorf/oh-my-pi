---
dag_documentation:
  dag_purpose:
    This DAG is responsible for compiling a list of phone numbers from customers that contacted the Inside Sales
    channel and sending these phone numbers to Minority Report

minority_request_header:
  Content-Type: application/json

batch_size: 100

tables_to_send:
  phone_numbers:
    key_name: phoneNumber
    type: CUSTOMER_PHONE_NUMBER_WHITELIST
  pp_multi_assistants:
    key_name: phoneNumber
    type: CUSTOMER_PHONE_NUMBER_WHITELIST

custom_cluster:
  autotermination_minutes: 20
  driver_node_type_id: r5a.large
  node_type_id: r5a.large
  num_workers: 1
  aws_attributes:
    first_on_demand: 1
    spot_bid_price_percent: 100
    zone_id: us-east-1d
    availability: SPOT_WITH_FALLBACK
    ebs_volume_size: 200
  spark_conf:
    spark.driver.maxResultSize: "0"
