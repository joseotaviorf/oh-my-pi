dag:
  name: chat_fup_test
  schedule_start_date: 2019, 5, 31
  schedule_interval: 0 3 * * *
  owner: Data SS
  documentation:
    dag_purpose: |
      Test extraction of [Chat FUP](https://github.com/quintoandar/chatfup) tables into data lake.
      Chat FUP is a service to manage followups for whatsapp chats.

workflow:
  type: cdc
  layer: raw
  database_type: postgres
  source_database: chatfup
  custom_schema: chatfup_test
  source_schema: public
  lineage_product_database_name: chatfup
  dbutils_secret_key: CHAT_FUP_DB
  tables_customization:
    chats_chat:
      raw_primary_keys: ["id"]
      clean_primary_keys: ["id"]
    surveys_answer:
      raw_primary_keys: ["id"]
      clean_primary_keys: ["id"]
    surveys_survey:
      raw_primary_keys: ["id"]
      clean_primary_keys: ["id"]
    message_voting:
      raw_primary_keys: ["id"]
      clean_primary_keys: ["id"]
    rating:
      raw_primary_keys: ["id"]
      clean_primary_keys: ["id_rating"]

cluster:
  type: databricks_12_2_med_2xlarge_general_cluster
  access_control_list:
    group_name: analytics-engineers
    permission_level: CAN_MANAGE
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}