---
database_name: datalake_atento_reports
table_name: last_updated_atento
owner: gabriel.firmino@quintoandar.com.br
domain: Data S&S
description: Enrichment table with the aim of obtaining information about the execution of atento reverse dag, the granularity of this 
  table follows the "table_name" column.
columns:
  bpo:
    description: Partner company that receives the reverse data.
  table_name:
    description: Name of the table sent to the atento partner company.
  ts_load:
    lineage:
      - reverse_atento.backlog_metric.ts_load
      - reverse_atento.csat_front.ts_load
      - reverse_atento.demand_metric.ts_load
      - reverse_atento.fcr_metric.ts_load
      - reverse_atento.general_metric.ts_load
      - reverse_atento.speech_call.ts_load
      - reverse_atento.speech_chat.ts_load
      - reverse_atento.taxonomia_call.ts_load
      - reverse_atento.taxonomia_chat.ts_load
      - reverse_atento.taxonomia_email.ts_load
      - reverse_atento.twilio_chat_aht.ts_load
    description: Timestamp date that indicates when our atento reverse process was executed.
