dag:
  name: enrich_onboarding_entities
  schedule_start_date: 2024, 1, 1
  owner: Data Primitives
  documentation:
    dag_purpose: |
      Creates enriched view for onboarding data that consolidates tenant, house, and owner information.
      This view provides a unified view of the onboarding process with all related entities.
workflow:
  type: query_view
  layer: enrich
cluster:
  type: databricks_12_2_min_memory_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
