dag:
  name: privacy_hub
  schedule_start_date: 2021, 11, 30
  schedule_interval: 0 2 * * *
  owner: Data Primitives
  documentation:
    dag_purpose: |
      Retrieves data from the Privacy Hub  database (PostgreSQL). [Privacy Hub](https://github.com/quintoandar/backend-services/tree/6a2a395d11dc9df8f0b155a94617d429f0d8ab35/applications/privacy-hub)

workflow:
  type: cdc
  layer: raw
  database_type: postgres
  source_database: privacy_hub
  source_schema: public
  lineage_product_database_name: privacy_hub
  tables_customization:
    transaction:
      clean_table_name: transaction
      raw_primary_keys: [id]
      clean_primary_keys: [id]
    data_subject:
      clean_table_name: data_subject
      raw_primary_keys: [id]
      clean_primary_keys: [id]
    cookie:
      clean_table_name: cookie
      raw_primary_keys: [id]
      clean_primary_keys: [id]
    intercepted_cookie:
      clean_table_name: intercepted_cookie
      raw_primary_keys: [id]
      clean_primary_keys: [id]

cluster:
  type: databricks_13_3_med_2xlarge_general_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
