---
database_name: datalake_hightouch
table_name: sync_changelog
owner: eduardo.soares@quintoandar.com.br
domain: Primitives
description: Clean Hightouch reverse ETL sync changelog tracking data synchronization operations and status
columns:
  id_sync:
    description: Unique identifier for the sync configuration
    lineage:
      - datalake_hightouch_logs_clean.sync_changelog_databricks.id_sync
      - datalake_hightouch_logs_clean.sync_changelog_trino.id_sync
  id_sync_run:
    description: Unique identifier for the specific sync run execution
    lineage:
      - datalake_hightouch_logs_clean.sync_changelog_databricks.id_sync_run
      - datalake_hightouch_logs_clean.sync_changelog_trino.id_sync_run
  id_row:
    description: Unique identifier for the individual row being synchronized
    lineage:
      - datalake_hightouch_logs_clean.sync_changelog_databricks.id_row
      - datalake_hightouch_logs_clean.sync_changelog_trino.id_row
  op_type:
    description: Type of operation performed (insert, update, delete)
    lineage:
      - datalake_hightouch_logs_clean.sync_changelog_databricks.op_type
      - datalake_hightouch_logs_clean.sync_changelog_trino.op_type
  status:
    description: Status of the synchronization operation (success, failed, pending)
    lineage:
      - datalake_hightouch_logs_clean.sync_changelog_databricks.status
      - datalake_hightouch_logs_clean.sync_changelog_trino.status
  failure_reason:
    description: Detailed reason for failure if the operation was unsuccessful
    lineage:
      - datalake_hightouch_logs_clean.sync_changelog_databricks.failure_reason
      - datalake_hightouch_logs_clean.sync_changelog_trino.failure_reason
