dag:
  name: enrich_hightouch
  schedule_start_date: 2025, 8, 20
  owner: Data Primitives
  documentation:
    dag_purpose: |
      This DAG ingests sync logs data from Hightouch.
workflow:
  type: query_delta
  layer: enrich
  default_extraction_type: full
  tables_customization:
    sync_changelog: {}
    sync_runs: {}
    audience_membership: {}
    journey_metadata: {}
    journey_log: {}

cluster:
  type: databricks_16_4_rfleet_instance_cluster
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
