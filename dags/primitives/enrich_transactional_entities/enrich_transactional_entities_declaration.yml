dag:
  name: enrich_transactional_entities
  schedule_start_date: 2025, 8, 20
  owner: Data Primitives
  documentation:
    dag_purpose: |
      This DAG creates enriched tables containing the CDP Transactional entities vision.
workflow:
  type: query_delta
  layer: enrich
  default_extraction_type: incremental
  extra_query_template_params:
    load_start_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    load_end_date: "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
    sk_entity: "SHA2(CONCAT_WS('||', entity, id_entity, persona, id_user), 256)"
    house_address: "CONCAT(h.address, ', ', h.number, ' - ', h.complement, '. ', h.neighborhood, ', ', h.city)"
  tables_customization:
    entities:
      merge_on: [sk_entity]
      when_not_matched_insert_condition: |
        source.is_active = true OR (
          source.is_active = false AND
          CAST(source.ts_updated AS DATE) >= CURRENT_DATE - INTERVAL 3 MONTH
        )
      when_matched_update_condition: |
        source.ts_updated > target.ts_updated OR
        source.id_entity <> target.id_entity OR
        source.id_house <> target.id_house OR
        source.id_contract <> target.id_contract OR
        source.id_user <> target.id_user OR
        source.uuid_person <> target.uuid_person OR
        source.entity <> target.entity OR
        source.persona <> target.persona OR
        source.business_context <> target.business_context OR
        source.house_address <> target.house_address OR
        source.is_active <> target.is_active OR
        source.ts_created <> target.ts_created
      when_matched_delete_condition: |
        source.is_active = false AND
        CAST(source.ts_updated AS DATE) < CURRENT_DATE - INTERVAL 3 MONTH
      z_order_by: [id_user, id_house, persona]
      table_properties:
        "delta.enableChangeDataFeed": "true"
cluster:
  type: databricks_13_3_rfleet_instance_cluster
  databricks_conn_id: databricks_new
