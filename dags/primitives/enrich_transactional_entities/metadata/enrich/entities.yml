database_name: datalake_transactional_entities
table_name: entities
domain: Primitives
owner: isadora.gallerani@quintoandar.com.br
description:
  A table containing transactional entities with intelligent filtering to provide a comprehensive
  yet optimized view of our customers' activities on the platform.
  Includes all active entities (is_active = TRUE) regardless of date, and inactive entities (is_active = FALSE)
  from the last 3 months based on ts_updated.
  This filtering strategy ensures relevant, recent data while maintaining complete active entity coverage.
  The format is specifically designed for use by AI initiatives like our chatbots.
columns:
  sk_entity:
    lineage:
      - core_contract.contract.id_owner
      - core_contract.contract.id_tenant
      - core_visit.visit.id_visit
      - core_offer.offer.id_offer
      - core_visit.visit.id_agent
      - core_visit.visit.id_visitor
      - core_visit.visit.id_owner
      - core_offer.offer.id_tenant
      - core_offer.offer.id_owner
      - core_visit.visit.id_visit
      - core_offer.offer.id_offer
      - core_contract.contract.id_contract
      - datalake_terminator_clean.termination.id
      - datalake_ebdb_clean.listing_business_context.id
      - datalake_ebdb_clean.inspection.id
    description: Surrogate key of all transactional entities.
      It's made by concatenating "<entity>||<id_entity>||<persona>||<id_user>" and then applying the SHA256 hash.
      This key must always be unique.
  id_entity:
    lineage:
      - core_visit.visit.id_visit
      - core_offer.offer.id_offer
      - core_contract.contract.id_contract
      - datalake_terminator_clean.termination.id
      - datalake_ebdb_clean.listing_business_context.id
      - datalake_ebdb_test_clean.inspection.id
    description:
      The primary identifier for an entity, directly from our production systems.
      This key might not always be unique across all entities, as different entities may share the same id.
  id_house:
    lineage:
      - core_visit.visit.id_house
      - core_offer.offer.id_house
      - core_contract.contract.id_house
      - datalake_ebdb_clean.listing_business_context.id_house
    description: House id related to the entity. It's the id of the Imovel/House table, from Main's database (EBDB).
  id_contract:
    lineage:
      - core_contract.contract.id_contract
    description: Contract id related to the entity, if it has any.
      It's the id of the Contrato/Contract table, from Main's database (EBDB).
  id_user:
    lineage:
      - core_visit.visit.id_agent
      - core_visit.visit.id_owner
      - core_visit.visit.id_visitor
      - core_offer.offer.id_tenant
      - core_offer.offer.id_owner
      - core_contract.contract.id_owner
      - core_contract.contract.id_tenant
      - datalake_ebdb_test_clean.house.id_user
      - datalake_ebdb_test_clean.inspection.id_user_inspector
    description: The unique identifier for a user associated with the entity.
      This id corresponds to the id from the User table in our Main database (EBDB).
      Each entity may be linked to multiple users.
  uuid_person:
    lineage:
      - datalake_ebdb_clean.user.uuid_person
    description: The unique identifier for a user associated with the entity.
      This is the Person's uuid.
      Each entity may be linked to multiple users.
  entity:
    description: String that specifies the type of entity.
    categories:
      VISIT: The entity is a visit, with its id_entity mapping directly to the id_visit from the Visit table in EBDB database.
      FR_OFFER: The entity is a ForRent offer, with its id_entity mapping directly to the id_offer from the Rental Transact system.
      FR_CONTRACT: The entity is a contract, with its id_entity mapping directly to the id_contract from the Contract table in the core model.
      FR_TERMINATION: The entity is a termination, with its id_entity mapping directly to the id from the Termination table in the terminator system.
      LISTING: The entity is a property listing, with its id_entity mapping directly to the id from the Listing Business Context table, representing property listings.
      FR_INSPECTION: The entity is an inspection, with its id_entity mapping directly to the id from the Inspection table in EBDB database.
  persona:
    description:
      A persona describes the primary role of a user (id_user) in relation to a specific
      entity within our platform's business context.
    categories:
      AGENT_BROKER: A broker who acts as an agent, managing client demands and mediating communication.
      BUYER_PROSPECT: A potential customer interested in purchasing a property.
      TENANT_PROSPECT: A potential customer interested in renting a property.
      OWNER: The owner of one or more properties registered on the platform.
      TENANT: A current tenant who has signed a contract for a property.
      AGENT_INSPECTOR: A professional who conducts property inspections.
  business_context:
    lineage:
      - core_visit.visit.business_context
      - datalake_ebdb_clean.listing_business_context.business_context
    description:
      Business context that categorizes the type of transaction or interaction.
      This field indicates whether the entity is related to rental (RENT) or sale (SALE) operations,
      helping to differentiate business flows and customer journeys within our platform.
    categories:
      RENT: The entity is related to rental transactions, including visits, contracts, terminations, and listings for rental properties.
      SALE: The entity is related to sale transactions, including visits and listings for property purchases.
  properties:
    lineage:
      - core_visit.visit.computed_status
      - core_offer.offer.status
      - core_contract.contract.status
      - datalake_terminator_clean.termination.status
      - datalake_ebdb_clean.listing_business_context.status
      - datalake_ebdb_clean.listing_business_context.status_reason
      - datalake_ebdb_test_clean.inspection.status
    description:
      Struct containing entity-specific properties and status information, used to create labels for chatbots.
      This field provides detailed contextual information about the current state of each entity.
      For VISIT entities - contains computed_status field.
      For FR_OFFER entities - contains status field.
      For FR_CONTRACT entities - contains status field.
      For FR_TERMINATION entities - contains status field.
      For LISTING entities - contains status and status_reason fields.
      For FR_INSPECTION entities - contains status field.
  house_address:
    lineage:
      - datalake_ebdb_test_clean.house.address
      - datalake_ebdb_test_clean.house.number
      - datalake_ebdb_test_clean.house.complement
      - datalake_ebdb_test_clean.house.neighborhood
      - datalake_ebdb_test_clean.house.city
    description: The full address of the property related to the entity.
      It combines address, number, complement, neighborhood and city (in this exactly order)
      from EBDB's House/Imovel table.
  is_active:
    description:
      Boolean flag indicating if the entity is currently active, used as primary filter for data inclusion.
      Active entities (TRUE) are always included regardless of date. Inactive entities (FALSE) are only included
      if updated within the last 3 months. An entity is considered active as long as it is still receiving interactions.
      A visit entity will be considered as active for statuses confirmed, requested or scheduled, and inactive for statuses canceled, done, request_canceled, unsuccessful or stalled.
      An offer entity will be considered as active for status proposed, and inactive for statuses accepted, dismissed or rejected.
      A contract entity will be considered as active for statuses ativo, minuta or PreAssinaturas, and inactive for statuses cancelado or finalizado.
      A termination entity will be considered as active for statuses requested, inspection_under_review, inspection_scheduled, inspection_opted_out, inspection_executed, or inspection_canceled, and inactive for statuses done or canceled.
      A listing entity will be considered as active for statuses published, editing, or suspended (except when suspended for specific owner-related reasons like giving up renting, consequences management, reforming, temporarily suspended, or traveling), and inactive for statuses opted_out, unpublished, or suspended with owner-related reasons.
      An inspection entity will be considered as active for statuses Agendada, Comentada, EmAcordo, EmRevisao, Nova, or Revisada, and inactive for statuses Finalizada, Cancelada, or ContratoCancelado.
  ts_inactive:
    lineage:
      - core_visit.visit.ts_updated
      - core_offer.offer.ts_updated
      - core_contract.contract.ts_updated
      - datalake_terminator_clean.termination.ts_updated
      - datalake_ebdb_clean.listing_business_context.ts_updated
      - datalake_ebdb_test_clean.inspection.ts_updated
    description: Timestamp when the entity became inactive (is_active = FALSE).
      This field captures the ts_updated timestamp for entities that are currently inactive.
      For active entities (is_active = TRUE), this field will be NULL.
      This is useful for tracking when entities transitioned to an inactive state.
  ts_created:
    lineage:
      - core_visit.visit.ts_created
      - core_offer.offer.ts_created
      - core_contract.contract.ts_created
      - datalake_terminator_clean.termination.ts_created
      - datalake_ebdb_test_clean.inspection.ts_created
    description: Timestamp of when the entity was created in our product.
  ts_updated:
    lineage:
      - core_visit.visit.ts_updated
      - core_offer.offer.ts_updated
      - core_contract.contract.ts_updated
      - datalake_terminator_clean.termination.ts_updated
      - datalake_ebdb_clean.listing_business_context.ts_updated
      - datalake_ebdb_test_clean.inspection.ts_updated
    description: Last timestamp of when the entity was updated in our product.
      This field is used as the filtering criterion for inactive entities - only inactive entities
      updated within the last 3 months are included in this table.
