dag:
  name: comms_manager_rules
  owner: Data Primitives
  schedule_interval: 0 0 * * *
  documentation:
    dag_purpose: |
      This DAG ingests the notifications rules from the Comms Manager s3
workflow:
  type: custom_ingestion
  layer: raw
  load_spark_job: load_comms_manager_rules_raw
  custom_schema: comms_manager

  tables_customization:
    comms_manager_rules:
      load_spark_job: load_comms_manager_rules
      spark_job_arguments:
        - "{environment}"
        - "{bucket}"
        - "{dag_name}"
        - "{schema}"
        - "{table_name}"
        - "{partitions}"
        - "{execution_date}"
        - "s3://comms-manager-{environment}/notification-rules/versions/"
      partitions: [year, month, day]
      merge_on: [id_rule, id_action]
      when_matched_update_condition: |
        source.ts_export_generated_at > target.ts_export_generated_at
      when_not_matched_insert_condition: |
        source.id_rule IS NOT NULL AND source.id_action IS NOT NULL
      data_quality:
        clean:
          - name: unique_rule_action_combination
            query: |
              SELECT COUNT(*) as duplicate_count
              FROM (
                SELECT id_rule, id_action, COUNT(*) as cnt
                FROM {table_name}
                GROUP BY id_rule, id_action
                HAVING COUNT(*) > 1
              )
            expected: 0
            description: "Ensure unique combinations of rule_id and action_id"
cluster:
  type: databricks_13_3_high_mem_driver_high_mem_nodes
  databricks_conn_id: databricks_new
  custom_configurations:
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
    aws_attributes:
      availability: ON_DEMAND
    spark_conf:
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
      spark.driver.maxResultSize: "0"
