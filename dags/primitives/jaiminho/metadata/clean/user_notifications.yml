---
database_name: datalake_jaiminho_clean
table_name: user_notifications
description: This table consolidates user notifications from Jaiminho.
domain: Primitives
owner: conrado.fabri@quintoandar.com.br
columns:
  id:
    lineage:
      - datalake_jaiminho_raw.user_notifications.id
    description: The unique identifier for the user notification.
  id_user:
    description: Identifier of the user who will receive or has received the notification.
    lineage:
      - datalake_jaiminho_raw.user_notifications.user_id
      - datalake_jaiminho_raw.user_notifications.userid
  id_event:
    description: Identifier of the event that triggered this notification.
    lineage:
      - datalake_jaiminho_raw.user_notifications.event_id
  id_entity:
    description: Identifier of the entity (object, resource) associated with the notification.
    lineage:
      - datalake_jaiminho_raw.user_notifications.entity_id
      - datalake_jaiminho_raw.user_notifications.referenceId
  id_campaign:
    description: Identifier of the campaign this notification belongs to, if applicable.
    lineage:
      - datalake_jaiminho_raw.user_notifications.campaign_id
  entity_name:
    description: Name or type of the entity associated with the notification.
    lineage:
      - datalake_jaiminho_raw.user_notifications.entity_name
      - datalake_jaiminho_raw.user_notifications.referenceName
  action:
    description: Action or operation that triggered the notification.
    lineage:
      - datalake_jaiminho_raw.user_notifications.action
  status:
    description: Current status of the notification (e.g., pending, sent, delivered, failed).
    lineage:
      - datalake_jaiminho_raw.user_notifications.status
  state:
    description: Current state of the notification (e.g., processing_at_gateway, build_failed, delivered, failed).
    lineage:
      - datalake_jaiminho_raw.user_notifications.state
  channel:
    description: Communication channel used for the notification (e.g., email, SMS, push, in-app).
    lineage:
      - datalake_jaiminho_raw.user_notifications.channel
  profile:
    description: User profile or segment information relevant to the notification.
    lineage:
      - datalake_jaiminho_raw.user_notifications.profile
  tags:
    description: Tags or labels associated with the notification for categorization.
    lineage:
      - datalake_jaiminho_raw.user_notifications.tags
  destination:
    description: Target destination for the notification (e.g., email address, phone number).
    lineage:
      - datalake_jaiminho_raw.user_notifications.destination
  sender:
    description: Whatsapp number or email address used to send the notification
    lineage:
      - datalake_jaiminho_raw.user_notifications.sender
  payload:
    description: Raw payload data containing the notification content and metadata.
    lineage:
      - datalake_jaiminho_raw.user_notifications.payload
  template:
    description: Template identifier used for formatting the notification body.
    lineage:
      - datalake_jaiminho_raw.user_notifications.payload:bodyTemplate
      - datalake_jaiminho_raw.user_notifications.templateName
  template_meta_category:
    description: Category of the template at meta at the time the notification was sent. Only for whatsapp
    lineage:
      - datalake_jaiminho_raw.user_notifications.metaCategory
  country_code:
    description: Country code where the notification was sent or targeted.
    lineage:
      - datalake_jaiminho_raw.user_notifications.payload:country
  metadata:
    description: Additional metadata extracted from the notification payload.
    lineage:
      - datalake_jaiminho_raw.user_notifications.payload:metadata
  cost_center:
    description: Cost center associated with the notification for billing or tracking purposes.
    lineage:
      - datalake_jaiminho_raw.user_notifications.ccost
  scope:
    description: Scope or context of the notification (e.g., global, regional, user-specific).
    lineage:
      - datalake_jaiminho_raw.user_notifications.scope
  notification_center_acknowledge:
    description: Acknowledgment status for notifications displayed in the notification center.
    lineage:
      - datalake_jaiminho_raw.user_notifications.notificationCenterAcknowledge
  error_info:
    description: Description of the error associated with the failure status.
    lineage:
      - datalake_jaiminho_raw.user_notifications.errorInfo
  error_code:
    description: Code of the error associated with the failure status.
    lineage:
      - datalake_jaiminho_raw.user_notifications.errorCode
  ts_sent:
    description: Timestamp when the notification was sent to the user.
    lineage:
      - datalake_jaiminho_raw.user_notifications.sent_at
      - datalake_jaiminho_raw.user_notifications.sentAt
  ts_created:
    description: Timestamp when the notification record was created.
    lineage:
      - datalake_jaiminho_raw.user_notifications.created_at
      - datalake_jaiminho_raw.user_notifications.createdAt
  ts_updated:
    description: Timestamp when the notification record was last updated.
    lineage:
      - datalake_jaiminho_raw.user_notifications.updated_at
      - datalake_jaiminho_raw.user_notifications.updatedAt
  year:
    description: Year extracted from the notification timestamp for partitioning.
    lineage:
      - datalake_jaiminho_raw.user_notifications.year
  month:
    description: Month extracted from the notification timestamp for partitioning.
    lineage:
      - datalake_jaiminho_raw.user_notifications.month
  day:
    description: Day extracted from the notification timestamp for partitioning.
    lineage:
      - datalake_jaiminho_raw.user_notifications.day
