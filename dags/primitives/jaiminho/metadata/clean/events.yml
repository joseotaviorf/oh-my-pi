---
database_name: datalake_jaiminho_clean
table_name: events
description: This table consolidates all records of communication events from Jaiminho DB.
domain: Primitives
owner: conrado.fabri@quintoandar.com.br
columns:
  id:
    description: Unique identifier for the communication event.
    lineage:
      - datalake_jaiminho_raw.events.id
  id_user:
    description: Identifier of the user associated with the communication event.
    lineage:
      - datalake_jaiminho_raw.events.userId
  id_callback:
    description: Identifier for callback handling related to the event.
    lineage:
      - datalake_jaiminho_raw.events.callbackId
  reference_name:
    description: Name of the reference object or entity related to the event.
    lineage:
      - datalake_jaiminho_raw.events.referenceName
  reference_id:
    description: Identifier of the reference object or entity related to the event.
    lineage:
      - datalake_jaiminho_raw.events.referenceId
  type:
    description: Type or category of the communication event.
    lineage:
      - datalake_jaiminho_raw.events.type
  status:
    description: Current status of the event (e.g., pending, processing, completed, failed).
    lineage:
      - datalake_jaiminho_raw.events.status
  callback_channel:
    description: Communication channel used for callback processing.
    lineage:
      - datalake_jaiminho_raw.events.callbackChannel
  callback_trigger:
    description: Trigger mechanism or condition that initiated the callback.
    lineage:
      - datalake_jaiminho_raw.events.callbackTrigger
  tracing_context:
    description: Context information used for tracing and debugging the event flow.
    lineage:
      - datalake_jaiminho_raw.events.tracingContext
  extra_info:
    description: Additional metadata or information related to the event.
    lineage:
      - datalake_jaiminho_raw.events.extraInfo
  version:
    description: Version number of the event schema or processing logic.
    lineage:
      - datalake_jaiminho_raw.events.version
  ts_created:
    description: Timestamp when the event was created.
    lineage:
      - datalake_jaiminho_raw.events.createdAt
  ts_updated:
    description: Timestamp when the event was last updated.
    lineage:
      - datalake_jaiminho_raw.events.updatedAt
  year:
    description: Year extracted from the event update timestamp for partitioning.
    lineage:
      - datalake_jaiminho_raw.events.updatedAt
  month:
    description: Month extracted from the event update timestamp for partitioning.
    lineage:
      - datalake_jaiminho_raw.events.updatedAt
  day:
    description: Day extracted from the event update timestamp for partitioning.
    lineage:
      - datalake_jaiminho_raw.events.updatedAt
