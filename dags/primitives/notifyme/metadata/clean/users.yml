---
database_name: datalake_notifyme_clean
table_name: users
description: This table consolidates users data from NotifyMe. Contains user information for notification purposes.
domain: Primitives
owner: data-primitives@quintoandar.com.br
columns:
  id:
    description: Unique identifier for the user.
    lineage:
      - datalake_notifyme_raw.users.id
  name:
    description: Name of the user.
    lineage:
      - datalake_notifyme_raw.users.name
  email:
    description: Email address of the user.
    lineage:
      - datalake_notifyme_raw.users.email
  phone:
    description: Phone number of the user.
    lineage:
      - datalake_notifyme_raw.users.phone
  id_external:
    description: External identifier for the user.
    lineage:
      - datalake_notifyme_raw.users.external_id
  ts_created:
    description: Timestamp when the user record was created.
    lineage:
      - datalake_notifyme_raw.users.created_at
  ts_updated:
    description: Timestamp when the user record was last updated.
    lineage:
      - datalake_notifyme_raw.users.updated_at
  year:
    description: Year extracted from the user update timestamp for partitioning.
    lineage:
      - datalake_notifyme_raw.users.updated_at
  month:
    description: Month extracted from the user update timestamp for partitioning.
    lineage:
      - datalake_notifyme_raw.users.updated_at
  day:
    description: Day extracted from the user update timestamp for partitioning.
    lineage:
      - datalake_notifyme_raw.users.updated_at
