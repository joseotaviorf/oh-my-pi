database_name: datalake_search
table_name: search_impressions
owner: pedro.nogueira@quintoandar.com.br
domain: primitives
description: |
  Table with ids, dimensions, metrics and timestamps related to search.
columns:
  ids:
    description: A json with all relevant ids for search analysis. Ex. id_user, id_house, id_search, id_amplitude, ...
  dimensions:
    description: A json with all relevant dimensions for search analysis. Ex. business_context, city, ...
  variants:
    description: A json mapping `experiment_name` to `variant` the user was on that search.
  metrics:
    description: A json with all relevant metrics for search analysis. Ex. clicks, offer, visit_completed
  timestamps:
    description: A json with all relevant timestamps
  ts_event:
    description: The timestamp of the search.
  date:
    description: The date of the search.
  year:
    description: The year of the search.
  month:
    description: The month of the search.
  day:
    description: The day of the search.
