dag:
  name: enrich_base_metrics_service
  schedule_start_date: 2024, 1, 1
  owner: Data Primitives
workflow:
  type: query_delta
  layer: enrich
  custom_schema: search
  default_extraction_type: full
  extra_query_template_params:
    "days_past": 14
    "days_past_21": 21
    "days_past_30": 30
    "start_date": "{{ get_date_param(dag_run, data_interval_start | ds, 'load_start_date') }}"
    "end_date": "{{ get_date_param(dag_run, data_interval_start | ds, 'load_end_date') }}"
  inner_dependencies:
    rent_flow_past_30_days:
      - experiment_config
    sale_flow_past_30_days:
      - experiment_config
    recs_impressions:
      - experiment_config
      - global_metrics
    recs_impressions_processed:
      - experiment_config_processed
      - recs_impressions
      - house_publication_dates
      - rent_flow_past_30_days
      - sale_flow_past_30_days
      - rent_outlier_users_past_30_days
      - sale_outlier_users_past_30_days
    search_impressions:
      - experiment_config_processed
      - house_publication_dates
      - rent_flow_past_30_days
      - sale_flow_past_30_days
      - rent_outlier_users_past_30_days
      - sale_outlier_users_past_30_days
    recs_global_metrics:
      - recs_impressions_processed
    global_metrics:
      - search_impressions
    experiment_config_processed:
      - experiment_config
  tables_customization:
    recs_impressions:
      partitions:
        - year
        - month
        - day
    recs_impressions_processed:
      partitions:
        - year
        - month
        - day
    search_impressions:
      partitions:
        - year
        - month
        - day
    global_metrics:
      partitions:
        - year
        - month
        - day
    recs_global_metrics:
      partitions:
        - year
        - month
        - day
    rent_flow_past_30_days:
      z_order_by: [id_user, id_house]
    sale_flow_past_30_days:
      z_order_by: [id_user, id_house]
    house_publication_dates:
      z_order_by: [id_house, business_context]


cluster:
  type: custom_cluster
  custom_configurations:
    autotermination_minutes: 20
    driver_node_type_id: r5d.2xlarge
    node_type_id: r5d.8xlarge
    runtime_engine: PHOTON
    spark_version: 12.2.x-scala2.12
    num_workers: 3
    spark_conf:
      spark.metrics.namespace: "data_products.enrich_base_metrics_service"
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
    aws_attributes:
      ebs_volume_size: 200
    single_user_name: "{{ var.value.databricks_single_user_name }}"
    data_security_mode: SINGLE_USER
  access_control_list:
    group_name: data-products
    permission_level: CAN_MANAGE
  databricks_conn_id: databricks_new
