database_name: datalake_entities_views
table_name: onboarding
description: Enriched view of onboarding data that consolidates tenant, house, and owner information for the onboarding process.
domain: Primitives
owner: marcio.gomes@quintoandar.com.br
columns:
  id_entity:
    lineage:
      - datalake_ebdb_clean.onboarding.id
    description: Primary key of the onboarding entity.
  id_house:
    lineage:
      - core_contract.contract.id_house
    description: Foreign key referencing the house entity, sourced from the contract.
  id_tenant:
    lineage:
      - core_contract.contract.id_tenant
    description: Foreign key referencing the tenant entity, sourced from the contract.
  id_owner:
    lineage:
      - core_contract.contract.id_owner
    description: Foreign key referencing the property owner, sourced from the contract.
  id_contract:
    lineage:
      - datalake_ebdb_clean.onboarding.id_contrato
    description: Foreign key referencing the contract entity.
  entity:
    description: Fixed value 'ONBOARDING' indicating the type of entity.
  business_context:
    description: Fixed value 'RENT' indicating this entity is related to rental transactions.
  status:
    lineage:
      - datalake_ebdb_clean.onboarding.status
    description: Current status of the onboarding process.
    categories:
      Finished: When the onboarding process has been completed successfully.
      Aborted: When the onboarding process has been cancelled or terminated.
      ContractReview: When the onboarding process is in contract review.
      ContractReviewAndInfoCheck: When the onboarding process is in contract review and information check.
      DashboardTasks: When the onboarding process is in dashboard tasks.
      DeliveryTermUploaded: When the onboarding process is in delivery term uploaded.
      InformationCheck: When the onboarding process is in information check.
      KillBill: When the onboarding process is in kill bill.
      WelcomingAutomatedEmails: When the onboarding process is in welcoming automated emails.
  properties:
    lineage:
      - datalake_ebdb_clean.onboarding.status
      - datalake_ebdb_clean.onboarding.ts_created
    description: JSON structure containing onboarding properties including status and creation timestamp.
      Used to provide detailed contextual information about the current state of each onboarding entity.
  is_active:
    lineage:
      - datalake_ebdb_clean.onboarding.status
    description: Boolean flag indicating if the onboarding process is currently active.
      Set to FALSE when status is 'Finished' or 'Aborted', TRUE for all other statuses.
      Active onboarding entities are those that can still receive interactions.
  ts_created:
    lineage:
      - datalake_ebdb_clean.onboarding.ts_created
    description: Timestamp when the onboarding record was created.
  ts_updated:
    lineage:
      - datalake_ebdb_clean.onboarding.ts_updated
    description: Timestamp when the onboarding record was last updated.
