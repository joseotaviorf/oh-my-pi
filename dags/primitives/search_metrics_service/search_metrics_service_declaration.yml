dag:
  name: search_metrics_service
  schedule_start_date: 2022, 1, 1
  owner: Data Primitives

workflow:
  layer: raw
  type: custom_ingestion
  load_spark_job: load_parquet_batch_inference_into_datalake

  spark_job_arguments:
  - "{environment}"
  - "{bucket}"
  - "{dag_name}"
  - s3://data-science.s3.data.quintoandar.com.br/search_monitoring/data
  - "{{ macros.ds_add(data_interval_start | ds, 1) }}" # this refers to the next day. This only makes sense when the DAG runs daily.
  - "{table_name}"
  - "{partitions}"
  - parquet

  default_extraction_type: incremental

  tables_customization:
    search_metrics:
      partitions:
      - date_granularity
      - date
    search_experiments:
      partitions:
      - exp_name
    search_contamination:
      partitions:
        - date

cluster:
  type: databricks_12_2_med_memory_photon_cluster
  access_control_list:
    group_name: data-products
    permission_level: CAN_MANAGE
  custom_configurations:
    spark_conf:
      spark.metrics.namespace: "data_products.search"
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
  databricks_conn_id: databricks_new
