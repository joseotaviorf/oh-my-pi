inner_dependencies:
  item_interaction:
    - recommendation_catalog
  recommendation_flow:
    - item_interaction
    - recommendation
  recommendation_metrics_agg_recset:
    - recommendation_flow
  recommendation_metrics_agg_display_type_business_context:
    - recommendation_metrics_agg_recset

tables:
  recommendation_catalog:
    is_incremental: false
  item_interaction:
    is_incremental: false
    partition_cols:
      - year
      - month
      - day
      - interaction_type
  recommendation:
    is_incremental: false
  recommendation_flow:
    is_incremental: false
  recommendation_metrics_agg_display_type_business_context:
    is_incremental: false
    partition_cols:
      - dt_rec_received
  recommendation_metrics_agg_recset:
    is_incremental: false
    partition_cols:
      - dt_rec_received
