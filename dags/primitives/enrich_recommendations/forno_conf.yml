inner_dependencies:
  item_interaction:
    - recommendation_catalog
  recommendation_flow:
    - item_interaction
    - recommendation
  coverage:
    - recommendation
    - recommendation_catalog
  diversity:
    - recommendation
    - embeddings
  popularity:
    - recommendation
    - recommendation_catalog
    - item_interaction
  recommendation_metrics_agg_recset:
    - recommendation_flow
    - diversity
    - popularity
  recommendation_metrics_agg_display_type_business_context:
    - recommendation_metrics_agg_recset
    - coverage
  recommendation_metrics_agg_display_type_business_context_experiment:
    - recommendation_metrics_agg_recset
  recommendation_metrics_agg_dimensions:
    - recommendation_metrics_agg_recset

tables:
  recommendation_catalog:
    is_incremental: false
  embeddings:
    is_incremental: false
    partition_cols:
      - year
      - month
      - day
      - ml_model
  item_interaction:
    is_incremental: false
    partition_cols:
      - year
      - month
      - day
      - interaction_type
  recommendation:
    is_incremental: false
  recommendation_flow:
    is_incremental: false
    partition_cols:
      - dt_rec_received
  coverage:
    is_incremental: false
    partition_cols:
      - dt_rec_received
  diversity:
    is_incremental: false
    partition_cols:
      - dt_rec_received
  popularity:
    is_incremental: false
    partition_cols:
      - dt_rec_received
  recommendation_metrics_agg_display_type_business_context:
    is_incremental: false
    partition_cols:
      - dt_rec_received
  recommendation_metrics_agg_display_type_business_context_experiment:
    is_incremental: false
    partition_cols:
      - dt_rec_received
  recommendation_metrics_agg_recset:
    is_incremental: false
    partition_cols:
      - dt_rec_received
  recommendation_metrics_agg_dimensions:
    is_incremental: false
    partition_cols:
      - dt_rec_received
