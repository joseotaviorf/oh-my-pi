dag:
  name: enrich_search
  schedule_start_date: 2021, 8, 24
  owner: Data Primitives
workflow:
  type: query
  layer: enrich
  default_extraction_type: incremental
  extra_query_template_params:
    "start_date": "{{ ds }}"
    "end_date": "{{ tomorrow_ds }}"
    "days_past": 7
    "year":  "{year}"
    "month": "{month}"
    "day": "{day}"
  tables_customization:
    item_interaction:
      partitions:
      - year
      - month
      - day
      - interaction_type
cluster:
  type: databricks_10_4_med_memory_photon_cluster
  access_control_list:
      group_name: data-products
      permission_level: CAN_MANAGE
