dag:
  name: enrich_search
  schedule_start_date: 2021, 8, 24
  owner: Data Primitives
workflow:
  type: query
  layer: enrich
  extra_query_template_params:
    start_date: MAKE_DATE({year}, {month}, {day})
    end_date: "DATE_ADD(MAKE_DATE({year}, {month}, {day})), 1)"
    days_past: 7
    year:  "{year}"
    month: "{month}"
    day: "{day}"
  tables_customization:
    item_interaction:
      partitions:
      - year
      - month
      - day
      - interaction_type
cluster:
  type: databricks_10_4_med_memory_photon_cluster