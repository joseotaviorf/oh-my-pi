dag:
  name: enrich_search
  schedule_start_date: 2022, 1, 1
  owner: Data Primitives
workflow:
  type: query
  layer: enrich
  default_extraction_type: full
  extra_query_template_params:
        "days_past": 14
  inner_dependencies:
    item_interaction:
      - amplitude_user_device
    item_interaction_sale:
      - amplitude_user_device
  tables_customization:
    item_interaction:
      partitions:
      - year
      - month
      - day
      - interaction_type
    item_interaction_sale:
      partitions:
      - year
      - month
      - day
      - interaction_type
cluster:
  type: databricks_10_4_med_memory_photon_cluster
  access_control_list:
      group_name: data-products
      permission_level: CAN_MANAGE
  custom_configurations:
    spark_conf:
      spark.metrics.namespace: "data_products.enrich_search"      
