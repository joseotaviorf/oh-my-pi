dag:
  name: enrich_search
  schedule_start_date: 2022, 1, 1
  owner: Data Primitives
workflow:
  type: query
  layer: enrich
  default_extraction_type: full
  extra_query_template_params:
        "days_past": 14
  inner_dependencies:
    item_interaction:
      - amplitude_user_device
    item_interaction_sale:
      - amplitude_user_device
  tables_customization:
    item_interaction:
      partitions:
      - year
      - month
      - day
      - interaction_type
    item_interaction_sale:
      partitions:
      - year
      - month
      - day
      - interaction_type
cluster:
  type: custom_cluster
  custom_configurations:
    autotermination_minutes: 20
    driver_node_type_id: r5d.2xlarge
    node_type_id: r5d.4xlarge
    runtime_engine: PHOTON
    spark_version: 10.4.x-scala2.12
    num_workers: 3
    spark_conf:
      spark.metrics.namespace: "data_products.enrich_search"      
    aws_attributes:
      ebs_volume_size: 200
  access_control_list:
    group_name: data-products
    permission_level: CAN_MANAGE
