dag:
  name: enrich_search
  schedule_start_date: 2022, 1, 1
  owner: Data Primitives
workflow:
  type: query
  layer: enrich
  default_extraction_type: full
  extra_query_template_params:
    "days_past": 14
    "days_past_21": 21
    "days_past_30": 30
    "start_date": "{{ get_date_param(dag_run, ds, 'load_start_date') }}"
    "end_date": "{{ get_date_param(dag_run, ds, 'load_end_date') }}"
  inner_dependencies:
    item_interaction:
    - amplitude_user_device
    item_interaction_sale:
    - amplitude_user_device
  tables_customization:
    item_interaction:
      partitions:
      - year
      - month
      - day
      - interaction_type
    item_interaction_sale:
      partitions:
      - year
      - month
      - day
      - interaction_type

cluster:
  type: custom_cluster
  custom_configurations:
    autotermination_minutes: 20
    driver_node_type_id: r5d.2xlarge
    node_type_id: r5d.4xlarge
    runtime_engine: PHOTON
    spark_version: 12.2.x-scala2.12
    num_workers: 3
    spark_conf:
      spark.metrics.namespace: "data_products.enrich_search"
      spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
    aws_attributes:
      ebs_volume_size: 200
    single_user_name: '{{ var.value.databricks_single_user_name }}'
    data_security_mode: SINGLE_USER
  access_control_list:
    group_name: data-products
    permission_level: CAN_MANAGE
  databricks_conn_id: databricks_new
