database_name: datalake_search
table_name: houses_published
owner: joao.fidalgo@quintoandar.com.br
domain: primitives
description: |
  Table with all published houses.
columns:
  id_search:
    description: id_search
  id_house:
    description: id_house
  ids:
    description: A json with all relevant ids for search analysis. In this table it is empty.
  dimensions:
    description: A json with all relevant dimensions for search analysis. Ex. business_context, city, ...
  variants:
    description: A json mapping `experiment_name` to `variant` the user was on that search. In this table it is empty.
  metrics:
    description: A json with all relevant metrics for search analysis. Ex. house_published
  timestamps:
    description: A json with all relevant timestamps. Ex. ts_house_published
  ts_event:
    description: The timestamp of the house publishing.
  date:
    description: The date of the house publishing.
  year:
    description: The year of the house publishing.
  month:
    description: The month of the house publishing.
  day:
    description: The day of the house publishing.
