---
database_name: datalake_hightouch_logs_raw
table_name: sync_changelog_trino
domain: Primitives
description: Hightouch reverse ETL sync changelog tracking data synchronization from Trino to marketing and communication destinations
columns:
  sync_id:
    description: Unique identifier for the sync configuration
  sync_run_id:
    description: Unique identifier for the specific sync run execution
  row_id:
    description: Unique identifier for the individual row being synchronized
  op_type:
    description: Type of operation performed (insert, update, delete)
  status:
    description: Status of the synchronization operation (success, failed, pending)
  failure_reason:
    description: Detailed reason for failure if the operation was unsuccessful
  fields:
    description: JSON string containing the field data that was synchronized
  year:
    description: Partition column representing the year of the data
  month:
    description: Partition column representing the month of the data
  day:
    description: Partition column representing the day of the data
