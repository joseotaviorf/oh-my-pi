database_name: datalake_analyst_ranking
table_name: ranking
columns:
  id_agent:
    lineage:
      - datalake_customer_support.email.id_agent
      - datalake_gsheets_clean.agents_control.id_assignee
  agent_company:
    lineage:
      - datalake_gsheets_clean.agents_control.agent_company
  agent_manager:
    lineage:
      - datalake_gsheets_clean.agents_control.manager
  department:
    lineage:
      - datalake_customer_support.email.department
      - datalake_crm_tasks_flows.tasks_users_resolutions_flow.type
  sum_csat_satisfied_score:
    lineage:
      - datalake_customer_support.csat.csat_score
  sum_csat_dissatisfied_score:
    lineage:
      - datalake_customer_support.csat.csat_score
  total_tickets_resolution:
    lineage:
      - datalake_customer_support.csat.resolution_survey
  total_tickets_answered_resolution:
    lineage:
      - datalake_customer_support.csat.resolution_survey
  total_tickets_with_csat_score:
    lineage:
      - datalake_customer_support.csat.csat_score
  total_tickets:
    lineage:
      - datalake_customer_support.email.id_ticket
  sum_ticket_resolution_time:
    lineage:
      - datalake_customer_support.email.minutes_full_resolution_time_business
  agent_age_in_months:
    lineage:
      - datalake_gsheets_clean.agents_control.dt_start
      - datalake_customer_support.email.ts_ticket_solved
      - datalake_customer_support.csat.ts_response
      - datalake_crm_tasks_flows.tasks_actions_resolutions_flow.ts_completed
  dt:
    lineage:
      - datalake_customer_support.email.ts_ticket_solved
      - datalake_customer_support.csat.ts_response
      - datalake_crm_tasks_flows.tasks_actions_resolutions_flow.ts_completed
  year:
    lineage:
      - datalake_customer_support.email.ts_ticket_solved
      - datalake_customer_support.csat.ts_response
      - datalake_crm_tasks_flows.tasks_actions_resolutions_flow.ts_completed
  month:
    lineage:
      - datalake_customer_support.email.ts_ticket_solved
      - datalake_customer_support.csat.ts_response
      - datalake_crm_tasks_flows.tasks_actions_resolutions_flow.ts_completed
  day:
    lineage:
      - datalake_customer_support.email.ts_ticket_solved
      - datalake_customer_support.csat.ts_response
      - datalake_crm_tasks_flows.tasks_actions_resolutions_flow.ts_completed
