---
raw_partition_cols: ["year", "month", "day"]
table_name: rtb_campaigns
account_hashes:
  - 2toD4h11MfIW4ZCg7MIQ
metrics:
  - impsCount
  - clicksCount
  - campaignCost
  - conversionsCount
  - conversionsValue
  - cr
  - ctr
  - roas
group_by:
  - day
  - subcampaign
schema: |
  accountCountry STRING,
  accountCreatedAt STRING,
  accountCurrency STRING,
  accountFeatures STRUCT<
    enabled: ARRAY<STRING>,
    countConvention: MAP<STRING,ARRAY<STRING>>
  >,
  accountFeedIdentifier STRING,
  accountHash STRING,
  accountName STRING,
  accountProperties STRUCT<
    campaignType: STRING,
    isArchived: BOOLEAN,
    permissions: ARRAY<STRING>
  >,
  accountStatus STRING,
  accountUrl STRING,
  accountVersion STRING,
  campaignCost DOUBLE,
  clicksCount DOUBLE,
  conversionsCount DOUBLE,
  conversionsValue DOUBLE,
  cr DOUBLE,
  ctr DOUBLE,
  attributionDate STRING,
  impsCount DOUBLE,
  roas DOUBLE,
  subcampaign STRING,
  subcampaignHash STRING
