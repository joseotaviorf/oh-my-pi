    resolved_issue STRING,
    back_doing_business STRING,
    consumer_consideration STRING,
    consumer_consideration_date STRING,
    company_consideration STRING,
    company_consideration_date STRING,
    private_treatment_time STRING,
    public_treatment_time STRING,
    rating_time STRING,
    rating STRING,
    rating_date STRING,
    comments_count STRING,
    redistributions_count STRING,
    redistributions_reason STRING,
    ticket_moderations_count STRING,
    ticket_messages_count STRING,
    last_replica_date STRING,
    contact_us STRING,
