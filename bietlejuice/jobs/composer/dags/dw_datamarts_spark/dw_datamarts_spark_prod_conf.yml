---
## TEMPLATE
# dags:
#   <context>:
#     load_to_redshift: <boolean> -> default False
#     cluster_name: <cluster_name>
#       # Optional. By default, databricks_default_cluster
#       # Eg: databricks_memory_optimized_cluster
#     owner: <dag_owner>
#       # Mandatory.
#       # Eg: Data ForSale

dags:
  cross:
    owner: Data Engineering
    cluster_name: databricks_9_1_med_memory_cluster
  for_rent:
    owner: Data ForRent
    cluster_name: databricks_9_1_med_memory_cluster
  for_rent_cross:
    owner: Data ForRent
    cluster_name: databricks_9_1_med_general_cluster
  for_sale:
    owner: Data ForSale
    cluster_name: databricks_9_1_default_datamart_cluster
    custom_libraries:
      - maven:
          coordinates: "org.apache.sedona:sedona-python-adapter-3.0_2.12:1.2.0-incubating"
      - maven:
          coordinates: "org.datasyslab:geotools-wrapper:1.1.0-25.2"
      - pypi:
          package: geospark
      - pypi:
          package: pytopojson
      - pypi:
          package: apache-sedona
    init_script:
         - dbfs:
              destination: "dbfs:/FileStore/sedona/sedona-init.sh"
    spark_conf:
      - spark.serializer: "org.apache.spark.serializer.KryoSerializer"
      - spark.sql.extensions: "org.apache.sedona.viz.sql.SedonaVizExtensions,org.apache.sedona.sql.SedonaSqlExtensions"
      - spark.kryo.registrator: "org.apache.sedona.core.serde.SedonaKryoRegistrator"
  for_sale_cross:
    owner: Data ForSale
    cluster_name: databricks_9_1_default_datamart_cluster
  fintech_cross:
    cluster_name: databricks_9_1_med_general_cluster
    owner: Data Fintech
  growth:
    owner: Data Growth
    cluster_name: databricks_9_1_med_general_cluster
  growth_cross:
    owner: Data Growth
  support_and_service:
    owner: Data S&S
    load_to_redshift: True
