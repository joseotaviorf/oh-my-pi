---
raw_partition_cols: [account_snake_case, dt_created]
login_customer_id: "7524178457"
customer_filter: "NOT LIKE '%mineira%'"
report_type_mapping:
  ads_performance: AD_PERFORMANCE_REPORT
  campaigns_performance: CAMPAIGN_PERFORMANCE_REPORT
  keywords_performance: KEYWORDS_PERFORMANCE_REPORT
  videos_performance: VIDEO_PERFORMANCE_REPORT
GAQL:
  ads_performance: |
    SELECT
        customer.id,
        ad_group.id,
        ad_group.name,
        ad_group_ad.ad.type,
        campaign.id,
        campaign.name,
        metrics.clicks,
        metrics.cost_micros,
        segments.date,
        ad_group_ad.ad.legacy_responsive_display_ad.description,
        ad_group_ad.ad.expanded_text_ad.description,
        ad_group_ad.ad.text_ad.description1,
        ad_group_ad.ad.call_ad.description1,
        ad_group_ad.ad.text_ad.description2,
        ad_group_ad.ad.call_ad.description2,
        segments.device,
        ad_group_ad.ad.display_url,
        ad_group_ad.ad.id,
        metrics.impressions,
        ad_group_ad.ad.image_ad.name,
        customer.descriptive_name
    FROM ad_group_ad
    WHERE
        segments.date = '{execution_date}'
  campaigns_performance: |
    SELECT
        customer.id,
        campaign.id,
        campaign.name,
        metrics.clicks,
        metrics.cost_micros,
        segments.date,
        segments.device,
        metrics.impressions,
        customer.descriptive_name,
        segments.month,
        campaign.labels,
        segments.week,
        segments.year
    FROM campaign
    WHERE
        segments.date = '{execution_date}'
  keywords_performance: |
    SELECT
        customer.id,
        customer.descriptive_name,
        campaign.id,
        campaign.name,
        ad_group.id,
        ad_group.name,
        ad_group_criterion.criterion_id,
        ad_group_criterion.keyword.text,
        ad_group_criterion.keyword.match_type,
        segments.device,
        segments.date,
        metrics.impressions,
        metrics.clicks,
        metrics.cost_micros
    FROM keyword_view
    WHERE
        segments.date = '{execution_date}'
        AND ad_group_criterion.negative = 'false'
  videos_performance: |
    SELECT
          customer.id,
          ad_group.id,
          ad_group.name,
          campaign.id,
          campaign.name,
          metrics.clicks,
          metrics.cost_micros,
          segments.date,
          segments.device,
          metrics.impressions,
          customer.descriptive_name,
          video.id
      FROM video
      WHERE
        segments.date = '{execution_date}'
schema:
  ads_performance: |
    customer STRUCT<
      id: STRING,
      descriptiveName: STRING
    >,
    adGroup STRUCT<
      id: STRING,
      name: STRING
    >,
    campaign STRUCT<
      id: STRING,
      name: STRING
    >,
    segments STRUCT<
      date: STRING,
      device: STRING
    >,
    adGroupAd STRUCT<
      ad STRUCT<
        legacyResponsiveDisplayAd STRUCT<
          description: STRING
        >,
        expandedTextAd STRUCT<
          description: STRING
        >,
        textAd STRUCT<
          description1: STRING
        >,
        callAd STRUCT<
          description1: STRING
        >,
        textAd STRUCT<
          description2: STRING
        >,
        callAd STRUCT<
          description2: STRING
        >,
        displayUrl: STRING,
        id: STRING,
        imageAd STRUCT<
          name: STRING
        >,
        type: STRING
      >
    >,
    metrics STRUCT<
      impressions: STRING,
      clicks: STRING,
      cost_micros: STRING
    >
