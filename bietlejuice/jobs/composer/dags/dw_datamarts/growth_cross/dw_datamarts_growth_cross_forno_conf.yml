# Merge Keys are available only in Yaml 1.1.
redshift_template:
  dw: &redshift_anchor
    schema: datamarts
    runs_on: redshift
athena_template:
  dw: &athena_anchor
    schema: datamarts
    runs_on: athena
pipeline:
  ##<KEEP THIS COMMENTED AS A TEMPLATE>
  # <task-name-like-attribution-conversion-paths>:
  #   dw:
  #     sql_file: <query-file E.g: dw/queries/datamarts/offer_attribution_conversion_paths_demand.sql>
  #     table: <targe-table-name>
  #     schema: <target-schema-name> # TODO this will always be `datamart` (for both datalake and dw). This var is not used anymore
  #     runs_on: <backend-to-run-the-query> E.g: redshift or athena
  affiliates_clusters:
    dw:
      <<: *redshift_anchor
      sql_file: dw/queries/datamarts/growth_cross/affiliates_clusters.sql
      table: affiliates_clusters
  performance_marketing_cluster_promotional_bonus:
    dw:
      <<: *redshift_anchor
      sql_file: dw/queries/datamarts/growth_cross/performance_marketing_cluster_promotional_bonus.sql
      table: performance_marketing_cluster_promotional_bonus
      depends_on:
        - affiliates_clusters
  performance_marketing_cluster_promotional_bonus_costs:
    dw:
      <<: *redshift_anchor
      sql_file: dw/queries/datamarts/growth_cross/performance_marketing_cluster_promotional_bonus_costs.sql
      table: performance_marketing_cluster_promotional_bonus_costs
      depends_on:
        - affiliates_clusters
        - performance_marketing_cluster_promotional_bonus
  rent_flow_interactions:
    dw:
      <<: *redshift_anchor
      sql_file: dw/queries/datamarts/growth_cross/rent_flow_interactions.sql
      table: rent_flow_interactions
  rental_marketplace_flows:
    dw:
      <<: *redshift_anchor
      sql_file: dw/queries/datamarts/growth_cross/rental_marketplace_flows.sql
      table: rental_marketplace_flows
      depends_on:
        - rent_flow_interactions
        - tenant_prospect_status
  tenant_prospects_activations:
    dw:
      <<: *redshift_anchor
      sql_file: dw/queries/datamarts/growth_cross/tenant_prospects_activations.sql
      table: tenant_prospects_activations
      depends_on:
        - rent_flow_interactions
  tenant_prospect_status:
    dw:
      <<: *redshift_anchor
      sql_file: dw/queries/datamarts/growth_cross/tenant_prospect_status.sql
      table: tenant_prospect_status
      depends_on:
        - rent_flow_interactions
  unique_supply_cohort_conversions:
    dw:
      <<: *redshift_anchor
      sql_file: dw/queries/datamarts/growth_cross/unique_supply_cohort_conversions.sql
      table: unique_supply_cohort_conversions
  user_funnel:
    dw:
      <<: *redshift_anchor
      sql_file: dw/queries/datamarts/growth_cross/user_funnel.sql
      table: user_funnel
