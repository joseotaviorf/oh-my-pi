redshift_template:
  dw: &redshift_anchor
    schema: datamarts
    runs_on: redshift
athena_template:
  dw: &athena_anchor
    schema: datamarts
    runs_on: athena
pipeline:
  ##<KEEP THIS COMMENTED AS A TEMPLATE>
  # <task-name-like-attribution-conversion-paths>:
  #   dw:
  #     sql_file: <query-file E.g: dw/queries/datamarts/offer_attribution_conversion_paths_demand.sql>
  #     table: <targe-table-name>
  #     schema: <target-schema-name> # TODO this will always be `datamart` (for both datalake and dw). This var is not used anymore
  #     runs_on: <backend-to-run-the-query> E.g: redshift or athena
  agents_3p:
    dw:
      <<: *athena_anchor
      sql_file: dw/queries/datamarts/for_sale_cross/agents_3p.sql
      table: agents_3p
  houses_3p:
    dw:
      <<: *athena_anchor
      sql_file: dw/queries/datamarts/for_sale_cross/houses_3p.sql
      table: houses_3p
  sale_ongoing_listings:
    dw:
      <<: *redshift_anchor
      sql_file: dw/queries/datamarts/for_sale_cross/sale_ongoing_listings.sql
      table: sale_ongoing_listings
      depends_on:
        - houses_3p
