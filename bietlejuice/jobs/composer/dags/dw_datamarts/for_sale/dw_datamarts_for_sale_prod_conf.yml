redshift_template:
  dw: &redshift_anchor
    schema: datamarts
    runs_on: redshift
athena_template:
  dw: &athena_anchor
    schema: datamarts
    runs_on: athena
pipeline:
  ##<KEEP THIS COMMENTED AS A TEMPLATE>
  # <task-name-like-attribution-conversion-paths>:
  #   dw:
  #     sql_file: <query-file E.g: dw/queries/datamarts/offer_attribution_conversion_paths_demand.sql>
  #     table: <targe-table-name>
  #     schema: <target-schema-name> # TODO this will always be `datamart` (for both datalake and dw). This var is not used anymore
  #     runs_on: <backend-to-run-the-query> E.g: redshift or athena
  agents_3p:
    dw:
      <<: *athena_anchor
      sql_file: dw/queries/datamarts/for_sale/agents_3p.sql
      table: agents_3p
  buyer_first_visit_intent:
    dw:
      <<: *redshift_anchor
      sql_file: dw/queries/datamarts/for_sale/buyer_first_visit_intent.sql
      table: buyer_first_visit_intent
  dim_house_listing_amenities:
    dw:
      <<: *athena_anchor
      sql_file: dw/queries/datamarts/for_sale/dim_house_listing_amenities.sql
      table: dim_house_listing_amenities
  deal_making_funnel:
    dw:
      <<: *redshift_anchor
      sql_file: dw/queries/datamarts/for_sale/deal_making_funnel.sql
      table: deal_making_funnel
  houses_3p:
    dw:
      <<: *athena_anchor
      sql_file: dw/queries/datamarts/for_sale/houses_3p.sql
      table: houses_3p
  liquidity_by_sk_region:
    dw:
      <<: *redshift_anchor
      sql_file: dw/queries/datamarts/for_sale/liquidity_by_sk_region
      table: liquidity_by_sk_region
  sale_agents_weekly_performance:
    dw:
      <<: *redshift_anchor
      sql_file: dw/queries/datamarts/for_sale/sale_agents_weekly_performance.sql
      table: sale_agents_weekly_performance
  sale_ongoing_listings:
    dw:
      <<: *redshift_anchor
      sql_file: dw/queries/datamarts/for_sale/sale_ongoing_listings.sql
      table: sale_ongoing_listings
      depends_on:
        - houses_3p
  sale_ongoing_listings_casa_mineira:
    dw:
      <<: *redshift_anchor
      sql_file: dw/queries/datamarts/for_sale/sale_ongoing_listings_casa_mineira.sql
      table: sale_ongoing_listings_casa_mineira
  repressed_demand_sale_booking_fit_in:
    dw:
      <<: *redshift_anchor
      sql_file: dw/queries/datamarts/for_sale/repressed_demand_sale_booking_fit_in.sql
      table: repressed_demand_sale_booking_fit_in
  temp_autonomous_agents_listings:
    dw:
      <<: *redshift_anchor
      sql_file: dw/queries/datamarts/for_sale/temp_autonomous_agents_listings.sql
      table: temp_autonomous_agents_listings
  temp_sale_offers:
    dw:
      <<: *redshift_anchor
      sql_file: dw/queries/datamarts/for_sale/temp_sale_offers.sql
      table: temp_sale_offers