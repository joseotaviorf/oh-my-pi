---
# tasks_to_remove contain a list of tasks duplicated in the product database due to a
# error in the Instant Refund flow. Those tasks should be removed from our pipeline to
# grant that we won't affect any metrics due this bug.
tasks_to_remove: &tasks-to-remove |-
  62b4fe141e139e863114f94a,
  62b4fe84db1782ab0c4b2f0c,
  619d118870f5ac72f24ba450,
  618e7ed092c74bda00eb340a

tables:
  tasks:
    extraction_type: incremental
    partitions: ["year", "month", "day"]
    extra_query_params: 
      tasks_to_remove: *tasks-to-remove
  task_status_histories:
    extraction_type: full
  task_titles:
    extraction_type: full 
  tasks_actions:
    extraction_type: incremental
    partitions: ["year", "month", "day"]
    extra_query_params:
      tasks_to_remove: *tasks-to-remove
  workflows_transitions:
    extraction_type: incremental
    partitions: ["year", "month", "day"]
  workgroups:
    extraction_type: full
