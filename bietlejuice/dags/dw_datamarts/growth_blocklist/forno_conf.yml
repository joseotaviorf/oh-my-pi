  #     schema: <target-schema-name> # TODO this will always be `datamart` (for both datalake and dw). This var is not used anymore
  #     runs_on: <backend-to-run-the-query> E.g: redshift or athena
  marketplace_intelligence_metrics:
    dw:
      <<: *redshift_anchor
      sql_file: dw/queries/datamarts/growth_blocklist/marketplace_intelligence_metrics.sql
      table: marketplace_intelligence_metrics
  listings_online_metrics:
