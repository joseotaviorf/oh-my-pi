---
raw_partition_cols: ["pwa", "dt"]
schema:
  meta STRUCT<marge:STRUCT<options:STRUCT<html:BOOLEAN,json:BOOLEAN,overwrite:BOOLEAN,quiet:BOOLEAN,reportDir:STRING>,version:STRING>,mocha:STRUCT<version:STRING>,mochawesome:STRUCT<options:STRUCT<code:BOOLEAN,consoleReporter:STRING,quiet:BOOLEAN,reportFilename:STRING,saveHtml:BOOLEAN,saveJson:BOOLEAN,useInlineDiffs:BOOLEAN>,version:STRING>>,
  results ARRAY<STRUCT<_timeout:BIGINT,afterHooks:ARRAY<STRING>,beforeHooks:ARRAY<STRING>,duration:BIGINT,failures:ARRAY<STRING>,file:STRING,fullFile:STRING,passes:ARRAY<STRING>,pending:ARRAY<STRING>,root:BOOLEAN,rootEmpty:BOOLEAN,skipped:ARRAY<STRING>,suites:ARRAY<STRUCT<_timeout:BIGINT,afterHooks:ARRAY<STRING>,beforeHooks:ARRAY<STRING>,duration:BIGINT,failures:ARRAY<STRING>,file:STRING,fullFile:STRING,passes:ARRAY<STRING>,pending:ARRAY<STRING>,root:BOOLEAN,rootEmpty:BOOLEAN,skipped:ARRAY<STRING>,suites:ARRAY<STRUCT<_timeout:BIGINT,afterHooks:ARRAY<STRING>,beforeHooks:ARRAY<STRING>,duration:BIGINT,failures:ARRAY<STRING>,file:STRING,fullFile:STRING,passes:ARRAY<STRING>,pending:ARRAY<STRING>,root:BOOLEAN,rootEmpty:BOOLEAN,skipped:ARRAY<STRING>,suites:ARRAY<STRUCT<_timeout:BIGINT,afterHooks:ARRAY<STRING>,beforeHooks:ARRAY<STRING>,duration:BIGINT,failures:ARRAY<STRING>,file:STRING,fullFile:STRING,passes:ARRAY<STRING>,pending:ARRAY<STRING>,root:BOOLEAN,rootEmpty:BOOLEAN,skipped:ARRAY<STRING>,suites:ARRAY<STRING>,tests:ARRAY<STRUCT<code:STRING,context:STRING,duration:BIGINT,fail:BOOLEAN,fullTitle:STRING,isHook:BOOLEAN,parentUUID:STRING,pass:BOOLEAN,pending:BOOLEAN,skipped:BOOLEAN,speed:STRING,state:STRING,timedOut:STRING,title:STRING,uuid:STRING>>,title:STRING,uuid:STRING>>,tests:ARRAY<STRUCT<code:STRING,context:STRING,duration:BIGINT,fail:BOOLEAN,fullTitle:STRING,isHook:BOOLEAN,parentUUID:STRING,pass:BOOLEAN,pending:BOOLEAN,skipped:BOOLEAN,speed:STRING,state:STRING,timedOut:STRING,title:STRING,uuid:STRING>>,title:STRING,uuid:STRING>>,tests:ARRAY<STRUCT<code:STRING,context:STRING,duration:BIGINT,err:STRUCT<diff:STRING,estack:STRING,message:STRING>,fail:BOOLEAN,fullTitle:STRING,isHook:BOOLEAN,parentUUID:STRING,pass:BOOLEAN,pending:BOOLEAN,skipped:BOOLEAN,speed:STRING,state:STRING,timedOut:STRING,title:STRING,uuid:STRING>>,title:STRING,uuid:STRING>>,tests:ARRAY<STRING>,title:STRING,uuid:STRING>>,
  stats STRUCT<duration:BIGINT,end:STRING,failures:BIGINT,hasOther:BOOLEAN,hasSkipped:BOOLEAN,other:BIGINT,passPercent:double,passes:BIGINT,pending:BIGINT,pendingPercent:double,skipped:BIGINT,start:STRING,suites:BIGINT,tests:BIGINT,testsRegistered:BIGINT>
cypress_source_bucket: 5a-cypress
cypress_enrich_query:
  suites: |
    WITH results_set AS (
        SELECT
            EXPLODE(results) AS results,
            SPLIT(INPUT_FILE_NAME(), '/') AS split_path
        FROM
            temp_view_{source}_{table_name}
    ),
    suites_set AS (
        SELECT
            EXPLODE(results.suites) AS suites,
            split_path[5] AS test_execution_id,
            split_path[3] AS pwa,
            split_path[4] AS dt
        FROM results_set
    )
    SELECT
        suites._timeout,
        suites.afterHooks,
        suites.beforeHooks,
        suites.duration,
        suites.failures,
        suites.file,
        suites.fullFile,
        suites.passes,
        suites.pending,
        suites.root,
        suites.rootEmpty,
        suites.skipped,
        suites.suites,
        suites.title,
        suites.uuid,
        test_execution_id,
        pwa,
        dt
    FROM suites_set
  tests: |
    WITH results_set AS (
        SELECT
            EXPLODE(results) AS results,
            SPLIT(INPUT_FILE_NAME(), '/') AS split_path
        FROM
            temp_view_{source}_{table_name}
    ),
    suites_set AS (
        SELECT
            EXPLODE(results.suites) AS suites,
            split_path[3] AS pwa,
            split_path[4] AS dt
        FROM
            results_set
    ),
    tests_set AS (
        SELECT
            EXPLODE(suites.tests) AS tests,
            pwa,
            dt
        FROM
            suites_set
    )
    SELECT
        tests.code,
        tests.context,
        tests.duration,
        tests.err,
        tests.fail,
        tests.fullTitle,
        tests.isHook,
        tests.parentUUID,
        tests.pass,
        tests.pending,
        tests.skipped,
        tests.speed,
        tests.state,
        tests.timedOut,
        tests.title,
        tests.uuid,
        pwa,
        dt
    FROM tests_set
