---
- name: lead
  sql: COUNT(CASE WHEN (CAST(fact_house_listing_flows.sk_lead_date AS INTEGER) >= 0) THEN 1 ELSE NULL END)
  table_name: fact_house_listing_flows
  event_date: sk_lead_date
  description:
- name: prospect
  sql: COUNT(CASE WHEN (CAST(fact_house_listing_flows.sk_prospect_date AS INTEGER) >= 0) THEN 1 ELSE NULL END)
  table_name: fact_house_listing_flows
  event_date: sk_prospect_date
  description:
- name: qualified
  sql: COUNT(CASE WHEN (CAST(fact_house_listing_flows.sk_qualified_date AS INTEGER) >= 0) THEN 1 ELSE NULL END)
  table_name: fact_house_listing_flows
  event_date: sk_qualified_date
  description:
- name: opportunity
  sql: COUNT(CASE WHEN (CAST(fact_house_listing_flows.sk_opportunity_date AS INTEGER) >= 0) THEN 1 ELSE NULL END)
  table_name: fact_house_listing_flows
  event_date: sk_opportunity_date
  description:
- name: first_listing
  sql: COUNT(CASE WHEN (CAST(fact_house_listing_flows.sk_first_listing_date AS INTEGER) >= 0) THEN 1 ELSE NULL END)
  table_name: fact_house_listing_flows
  event_date: sk_first_listing_date
  description:
- name: discarded
  sql: COUNT(CASE WHEN (CAST(fact_house_listing_flows.sk_discard_date AS INTEGER) >= 0) THEN 1 ELSE NULL END)
  table_name: fact_house_listing_flows
  event_date: sk_discard_date
  dscription:
- name: visits_booked
  sql: COUNT(DISTINCT CASE WHEN (CAST(fact_listing_rent_flows.sk_booking AS INTEGER) >= 0) THEN fact_listing_rent_flows.sk_booking ELSE NULL END)
  table_name: fact_listing_rent_flows
  event_date: sk_booking_created_date
  description: Visits booked
- name: visits_completed
  sql: COUNT(DISTINCT CASE WHEN (CAST(fact_listing_rent_flows.sk_booking AS INTEGER) >= 0) AND (CAST(fact_listing_rent_flows.flg_visit_completed AS INTEGER) > 0) THEN fact_listing_rent_flows.sk_booking ELSE NULL END)
  table_name: fact_listing_rent_flows
  event_date: sk_visit_date
  description: Visits that actually happened
- name: offers_submitted
  sql: COUNT(DISTINCT CASE WHEN (CAST(fact_listing_rent_flows.sk_offer_submitted_date AS INTEGER) >= 0) THEN fact_listing_rent_flows.sk_offer ELSE NULL END)
  table_name: fact_listing_rent_flows
  event_date: sk_offer_submitted_date
  description: Offers submitted by tenant
- name: offers_processed
  sql: COUNT(DISTINCT CASE WHEN COALESCE(fact_listing_rent_flows.days_offer_submitted_to_internal_analysis, '') != '' THEN fact_listing_rent_flows.sk_offer END)
  table_name: fact_listing_rent_flows
  event_date: sk_credit_analysis_init_date
  description: Offers that went through credit analysis
- name: offers_accepted
  sql: COUNT(DISTINCT CASE WHEN (CAST(fact_listing_rent_flows.sk_offer_approved_date AS INTEGER) >= 0) THEN fact_listing_rent_flows.sk_offer ELSE NULL END)
  table_name: fact_listing_rent_flows
  event_date: sk_offer_approved_date
  description: Offers approved
