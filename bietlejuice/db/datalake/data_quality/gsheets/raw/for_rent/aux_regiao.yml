---
table_name: datalake_gsheets_raw.aux_regiao
alert_channel: "#alerts-de-airflow-dags"
table_level_validations:
  has_size:
    greater_than: 0
    severity_level: Error
column_level_validations:
  id:
    is_complete:
      severity_level: Error
    is_unique:
      severity_level: Error
  city:
    is_complete:
      severity_level: Error
  regional:
    is_contained_in:
      values:
        - Nordeste
        - GFPC
        - SPMG
        - Norte
        - Vitória
        - RJPB
  tier:
    is_contained_in: # On the raw this column still as string.
      values: ['1', '2', '3', '4']
