##### Clusters Configs #####
cluster_template:
    cluster: &cluster_anchor
        enable_elastic_disk: "true"
        autotermination_minutes: 20
        aws_attributes: &aws_anchor
            availability: SPOT_WITH_FALLBACK
            ebs_volume_count: 1
            ebs_volume_size: 100
            ebs_volume_type: GENERAL_PURPOSE_SSD
            first_on_demand: 1
            instance_profile_arn: "{{ var.value.instance_profile_arn }}"
            spot_bid_price_percent: 100
            zone_id: us-east-1a
        cluster_log_conf:
            s3:
                destination: s3://{{ var.value.databricks_s3_bucket }}/logs/jobs/{{ dag.dag_id}}
                region: us-east-1
        cluster_name: "{{ dag.dag_id }}_{{ run_id }}"
        custom_tags:
            - key: application
              value: airflow
            - key: resource-name
              value: databricks
            - key: environment
              value: "{{ var.value.environment }}"
            - key: owner
              value: "{{ task.owner.lower().replace(' ', '-') }}"
            - key: ecosystem
              value: data-engineering
            - key: data-classification
              value: private
            - key: sensitive-data
              value: true
            - key: cost-center
              value: c052
            - key: provisioner
              value: databricks
        init_scripts:
            - s3:
                  destination: "{{ var.value.artifacts_s3_bucket }}/bi-etl-ejuice/init_script.sh"
                  region: ""
        spark_conf:
            spark.rpc.message.maxSize: "2000"
            spark.sql.sources.partitionOverwriteMode: dynamic
            spark.sql.parquet.filterPushdown: "true"
            spark.sql.sources.default: parquet
            spark.sql.legacy.createHiveTableByDefault: "true"
            spark.sql.legacy.parquet.datetimeRebaseModeInRead: LEGACY
            spark.sql.legacy.parquet.datetimeRebaseModeInWrite: LEGACY
            spark.sql.legacy.timeParserPolicy: LEGACY
            spark.metrics.conf.*.sink.graphite.class: "org.apache.spark.metrics.sink.GraphiteSink"
            spark.metrics.conf.*.sink.graphite.host: "graphite-exporter.forno.quintoandar.com.br"
            spark.metrics.conf.*.sink.graphite.period: "15"
            spark.metrics.conf.*.sink.graphite.port: "9109"
            spark.metrics.conf.*.sink.graphite.unit: "seconds"
            spark.metrics.conf.*.source.jvm.class: "org.apache.spark.metrics.source.JvmSource"
            spark.metrics.namespace: "{{ dag.dag_id.replace('.', '_').replace('_', '.', 1) }}"
            spark.plugins: "ch.cern.CloudFSMetrics,ch.cern.CgroupMetrics,br.com.quintoandar.GangliaMetrics"
            spark.jars.packages: "ch.cern.sparkmeasure:spark-plugins_2.12:0.2,ch.cern.sparkmeasure:spark-measure_2.12:0.21"
            spark.cernSparkPlugin.cloudFsName: "s3a"
            spark.extraListeners: "ch.cern.sparkmeasure.FlightRecorderStageMetrics"
            spark.sparkmeasure.outputFilename: "/tmp/stageMetrics_flightRecorder.json"
            spark.sparkmeasure.outputFormat: "json"
            spark.sparkmeasure.printToStdout: "false"
        spark_env_vars:
            PYSPARK_PYTHON: "/databricks/python3/bin/python3"
            ENVIRONMENT: "{{ var.value.environment }}"
            ARTIFACTS_BUCKET: *artifacts_bucket
        ssh_public_keys: []
        node_type_id: m5a.large
        driver_node_type_id: m5a.large
        autoscale:
            max_workers: 2
            min_workers: 1
        spark_version: 10.4.x-scala2.12

