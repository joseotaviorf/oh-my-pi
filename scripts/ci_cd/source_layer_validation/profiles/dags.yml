# Profile: all DAG folders under dags/<domain>/<dag_name>/
# Allowed source layers are resolved per DAG from workflow.layer (declaration).

id: dags_unified
cli_profile: dags

path_prefix: "dags/"
dag_root_segment_count: 3

spark_jobs_subdir: spark_jobs
yaml_conf_files:
  - prod_conf.yml
  - forno_conf.yml

skip_yaml_keys:
  - merge_on
  - when_matched_update_condition
  - ENTITY_TYPE
  - when_matched_operation
  - when_not_matched_insert
  - when_not_matched_by_source
  - when_not_matched_by_target

python_globs:
  - "load_*.py"
  - "*_base.py"

scan_python_spark_table_literals: true

sql_scan_globs:
  - "queries/**/*.sql"
sql_read_dialect: spark

# No SQL / conf table extraction for these workflow types (ingestion, sheets, etc.)
skip_workflow_types:
  - cdc
  - database_pull_delta
  - api_ingestion
  - custom_ingestion
  - gsheets
  - wonka
  - raw
