---
database_name: str(min=1, max=280)
table_name: str(min=1, max=280)
owner: regex('(?:[\.-]?\w+)*@\w+(?:[\.-]?\w+)*')
domain: str(min=1, max=280)
description: str(min=1, max=280)
columns: map(include("column"), key=str(min=1, max=280))
---
column:
  description: str(min=1, max=280)
  lineage: list(str(min=1, max=280), required=False)
  categories: map(str(min=1, max=280), key=str(min=1, max=280), required=False)
