---
database_name: str(min=1, max=280)
table_name: str(min=1, max=280)
owner: regex('(?:[\.-]?\w+)*@\w+(?:[\.-]?\w+)*', required=False)
domain: str(min=1, max=280, required=False)
description: str(required=False)
columns: map(include("column"), key=str(min=1, max=280))
---
column:
  description: str(min=0, required=True)
  lineage: list(str(min=1, max=280), required=False)
  categories: map(str(), key=str(), required=False)
