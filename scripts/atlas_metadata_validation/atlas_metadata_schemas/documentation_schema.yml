---
database_name: str(max=100)
table_name: str(max=100)
owner: str(max=100)
description: str(max=280)
columns: map(any(include("tags"), include("columns_documentation")), key=str(), required=False)
---
tags:
  tags: list(str(max=50))
---
columns_documentation:
  description: str(max=280)
  lineage: list(str(max=140))
  categories: map(include("category"), key=str(), required=False)
---
category:
  description: str(max=100)
