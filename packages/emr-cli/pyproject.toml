[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bi-etl-ejuice-emr"
version = "0.1.0"
description = "CLI for PySpark job submission and cluster lifecycle on AWS EMR."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "boto3>=1.37.3",
    "click>=7,<9",
    "pyyaml>=6",
]

[project.scripts]
emr-cli = "emr.cli:run"

[tool.hatch.build.targets.wheel]
packages = ["src/emr"]

# Shipped inside the wheel / PEX so ``package_root()`` resolves config without a git checkout.
[tool.hatch.build.targets.wheel.force-include]
"config" = "emr/config"
"samples" = "emr/samples"

[tool.uv]
index-strategy = "unsafe-best-match"

[dependency-groups]
dev = [
    "pex>=2.1.162",
    "pytest==8.3.5",
    "pytest-cov",
    "ruff==0.5.5",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]
addopts = ["--import-mode=importlib"]

[tool.ruff.lint.isort]
known-first-party = ["emr"]
