# EMR submit settings.

region: us-east-1
release_label: emr-7.5.0
subnet_id: subnet-05cb5b20def7300c3
job_flow_role: emr-prod
service_role: arn:aws:iam::206390561754:role/EMR_DefaultRole_V2
poll_sec: 15.0
action_on_failure: TERMINATE_CLUSTER
deploy_mode: cluster
log_uri: s3://artifacts.s3.data.quintoandar.com.br/emr/logs/cli/
staging_uri: s3://artifacts.s3.data.quintoandar.com.br/emr/staging/cli/
visible_to_all_users: true
idle_timeout_sec: 600

applications:
  - Hadoop
  - Hive
  - Spark

configurations:
  - Classification: iceberg-defaults
    Properties:
      iceberg.enabled: "true"
  - Classification: delta-defaults
    Properties:
      delta.enabled: "true"
  - Classification: spark-hive-site
    Properties:
      hive.metastore.client.factory.class: "com.amazonaws.glue.catalog.metastore.AWSG\
        lueDataCatalogHiveClientFactory"

# Overridable per run (CLI args).
master_instance_type: m5.xlarge
core_instance_type: m5.xlarge
core_instance_count: 2
use_spot: true
