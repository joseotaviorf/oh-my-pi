# EMR submit settings.

region: us-east-1
release_label: emr-7.5.0
subnet_id: subnet-0b0dd4939e90dab1a
job_flow_role: emr-forno
service_role: arn:aws:iam::713278628093:role/EMR_DefaultRole_V2 
poll_sec: 15.0
action_on_failure: TERMINATE_CLUSTER
deploy_mode: cluster
log_uri: s3://artifacts.s3.forno.data.quintoandar.com.br/emr/logs/cli/  
staging_uri: s3://artifacts.s3.forno.data.quintoandar.com.br/emr/staging/cli/
visible_to_all_users: true
idle_timeout_sec: 600

# Same ``emr_applications`` as ``emr_cluster_base`` in ``bietlejuice/forno_conf.yml``:
# Hadoop (YARN/HDFS), Hive (metastore SQL), JupyterEnterpriseGateway, Livy (REST),
# Spark — plus configurations below for Glue + Delta/Iceberg.
applications:
  - Hadoop
  - Hive
  - Spark

# Subset of ``emr_configurations`` from ``forno_conf.yml``: Delta/Iceberg toggles + Glue metastore client.
# Does not include ``yarn-env`` (Databricks/UC secrets) — full parity uses Airflow + ``scripts/emr_init_script.sh``.
configurations:
  - Classification: iceberg-defaults
    Properties:
      iceberg.enabled: "true"
  - Classification: delta-defaults
    Properties:
      delta.enabled: "true"
  - Classification: spark-hive-site
    Properties:
      hive.metastore.client.factory.class: "com.amazonaws.glue.catalog.metastore.AWSG\
        lueDataCatalogHiveClientFactory"

# Overridable per run (CLI args).
master_instance_type: m5.xlarge
core_instance_type: m5.xlarge
core_instance_count: 2
use_spot: true
