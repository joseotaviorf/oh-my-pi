[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bietlejuice-compiler"
version = "0.1.0"
description = "DAG compiler and CI/CD tooling for bietlejuice"
requires-python = ">=3.10,<3.13"
dependencies = [
    "bietlejuice-airflow",
    # apache-airflow is in bietlejuice-airflow's `dev` group (kept out of the Astro
    # runtime venv on purpose — the runtime ships its own customized 2.11.0+astro.4).
    # The compiler is a CI-only tool (never published as a wheel; runs only inside
    # `make create-dag-files` to scaffold DAG .py files for the Astro DAG bag), so it
    # can — and must — list apache-airflow as a real dependency. Without this, the
    # `create-dag-files` Woodpecker step fails with `ModuleNotFoundError: airflow`
    # because `uv run --project bietlejuice-compiler` does not pick up dev-group
    # deps from workspace members.
    "apache-airflow==2.11.0",    # CI-only; matches Astro Runtime 13.4.0
    # Most Airflow-constrained deps (boto3, PyYAML, requests, etc.) are inherited
    # from bietlejuice-airflow. Only script-specific additions are listed below.
    "botocore==1.37.3",          # airflow constraints-2-10
    "hierarchical-conf==1.0.4",
    "pandas==2.1.4",             # airflow constraints-2-10
    "quintoandar-logger>=0.4.0",
    "sql-metadata==2.3.0",
    "sqlglot==26.9.0",
    "tqdm==4.67.1",              # airflow constraints-2-10
    "yamale==4.0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bietlejuice"]

[tool.uv.sources]
bietlejuice-airflow = { workspace = true }

[tool.uv]
index-strategy = "unsafe-best-match"

[dependency-groups]
dev = [
    "pytest==8.3.5",   # airflow constraints-2-10
    "pytest-cov",
    "pytest-testmon",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]
addopts = ["--import-mode=importlib", "--cov=bietlejuice", "--cov-report=term-missing"]
markers = [
    "unit: unit tests",
    "ci_cd: CI/CD pipeline tests",
    "sql_transpiler: SQL transpiler tests",
    "schema_validation: schema validation tests",
]

[tool.coverage.run]
source = ["bietlejuice"]
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
