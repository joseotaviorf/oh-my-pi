# Coverage config for the core-model CI step ONLY (scoped tests + diff-cover).
#
# Passed to pytest via `--cov-config`. Kept separate from
# packages/bietlejuice-runtime/pyproject.toml [tool.coverage.*] because the step
# runs from the repo root and does NOT pick that config up. `exclude_lines`
# mirrors the runtime pyproject so untestable entrypoint blocks are not counted
# against diff-coverage (otherwise a one-line edit to `if __name__ ...` would
# score 0% and unfairly fail the gate).
[run]
relative_files = true

[report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
