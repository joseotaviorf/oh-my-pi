# DAGs allowed to introduce or keep shipping Databricks production runtime.
# Changes to this file require @quintoandar/data-ingestion-code-owners approval
# (see CODEOWNERS).
#
# Match by DAG folder name (`dag`), exact repo-relative path (`path`), or
# domain prefix (`path_prefix`), e.g.:
#   dags/tech_platform/enrich_databricks_query_history
#
# For hand-written Python DAG modules the same keys apply with different
# scopes: `dag` matches the module's file stem and `path` its parent
# directory, e.g. `dag: em_casa` / `path: dags/cross/crawlers/listings`.
#
# exceptions:
#   - dag: enrich_databricks_query_history
#     reason: "Reads Databricks system tables; cannot run on EMR"
#     approved_by: person@quintoandar.com.br
#   - path: dags/platform/some_dag
#     reason: "..."
#     approved_by: person@quintoandar.com.br
#   - path_prefix: dags/luigijr
#     reason: "Luigi Jr DAGs run on dedicated Astro instances (Databricks only)"
#     approved_by: person@quintoandar.com.br

exceptions:
  - dag: dw_crm
    path: dags/support_and_service/dw_crm
    reason: >-
      Temporary EMR→Databricks revert while investigating slow
      load-dw-crm-fact-credit-tasks / fact-closing-tasks / fact-repair-tasks
      (full house_listing+rent_flow joins under EMR step concurrency).
    approved_by: eduardo.soares@quintoandar.com.br
  - dag: dw_user
    path: dags/growth/dw_user
    reason: >-
      Folder relocated from dags/for_rent/dw_user to dags/growth/dw_user
      (ownership move to the Growth team). The validator runs `git diff
      --no-renames`, so the moved *_declaration.yml is seen as a brand-new
      file and flagged as a new Databricks introduction; the DAG has run on
      Databricks (consolidation_xs_memory_cluster) since before the move,
      with no runtime change.
    approved_by: isadora.gallerani@quintoandar.com.br
  - path_prefix: dags/luigijr
    reason: >-
      Luigi Jr DAGs are scaffolded via Zordon and deployed only to dedicated
      luigijr Astro instances (forno-luigijr / prod luigijr). They are
      isolated from the main forno/prod DAG bag and intentionally run on
      Databricks production runtime until 2026-07-31, when they will be
      migrated to EMR.
    approved_by: mario.abreu@quintoandar.com.br
  - dag: oitchau_api
    path: dags/people/oitchau_api
    reason: >-
      Revert EMR migration from #26852 (DBP-1808): restore Databricks
      consolidation_m_memory_single_node_cluster and databricks_new for
      people-scoped api_ingestion secrets.
    approved_by: isabella.carolinasl@quintoandar.com.br
  - dag: gsheets_agents
    path: dags/agents/gsheets_agents
    reason: >-
      Temporary Databricks exception: the gsheets_ingestion workflow is not yet
      adapted for EMR. Once that migration lands, this DAG will move to EMR
      (consolidation_s_memory_cluster).
    approved_by: anne.macedo@quintoandar.com.br
  - dag: gsheets_agents_fast_lane
    path: dags/agents/gsheets_agents_fast_lane
    reason: >-
      Temporary Databricks exception: the gsheets_ingestion workflow is not yet
      adapted for EMR. Once that migration lands, this DAG will move to EMR
      (consolidation_s_memory_cluster).
    approved_by: anne.macedo@quintoandar.com.br
  - dag: salesforce_cdc
    path: dags/support_and_service/salesforce_cdc
    reason: >-
      Revert EMR migration from #27482: restore Databricks runtime after EMR
      migration issues (struct DDL parsing / recovery flow failures on EMR
      Spark).
    approved_by: gabriel.firmino@quintoandar.com.br
  - dag: enrich_transactional_entities
    path: dags/growth/enrich_transactional_entities
    reason: >-
      Temporary Databricks rollback: the enrich_transactional_entities workflow is taking too long to run on EMR.
      We'll need to make some optimizations to the workflow to make it run faster on EMR.
    approved_by: jose.rferreira@quintoandar.com
  - dag: amplitude_new
    path: dags/growth/amplitude_new
    reason: >-
      Temporary EMR→Databricks revert for performance: load-clean-events does
      not complete on the EMR fleet (timed out after ~2h on the 2026-08-18 prod
      run). The clean write is skewed on the id_app/event_type partitions and
      spills heavily; cluster/spark_conf tuning alone did not resolve it.
      Returns to EMR once the write skew is addressed.
    approved_by: eduardo.soares@quintoandar.com.br
  - dag: braze_events
    path: dags/support_and_service/braze_events
    reason: >-
      Temporary EMR→Databricks revert for performance: the load-raw-events-*
      tasks do not complete on the EMR fleet (still running after ~1h30 on the
      2026-08-18 prod run, no terminal state). Returns to EMR once the raw
      ingestion is optimized.
    approved_by: eduardo.soares@quintoandar.com.br
