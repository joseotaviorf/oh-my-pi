- id: offboarding_uc_fr-denominator-ended-rentals-by-month
  question: Denominator — Ended Rentals by month
  expected_query: "SELECT\n    f.version,\n    SUM(TRY_CAST(REPLACE(f.\"<YYYYMM>\", ',', '') AS DOUBLE)) AS ended_rentals\nFROM datalake_luigijr_ops_finance_clean.finance_revenue_cost_<YEAR> f\nWHERE f.bece_business = 'For Rent'\n  AND f.bece_l2 = 'Lucas Lima'\n  AND f.pl_line_1 = '-'\n  AND f.pl_line_2 = '-'\n  AND f.pl_line_3 = '-'\n  AND f.pl_line_4 = 'Ended Rentals'\n  AND f.version = '<VERSION>'\n  AND TRY_CAST(REPLACE(f.\"<YYYYMM>\", ',', '') AS DOUBLE) IS NOT NULL\nGROUP BY 1;"
- id: offboarding_uc_fr-offboarding-uc-single-month
  question: Offboarding UC — single month
  expected_query: "WITH offboarding_cost AS (\n    SELECT\n        SUM(TRY_CAST(REPLACE(f.\"<YYYYMM>\", ',', '') AS DOUBLE)) AS offboarding_cost\n    FROM datalake_luigijr_ops_finance_clean.finance_revenue_cost_<YEAR> f\n    WHERE f.bece_business = 'For Rent'\n      AND f.pl_line_1 = 'Operations'\n      AND f.pl_line_2 = 'Offboarding'\n      AND f.reporting_group <> '-'\n      AND f.version = '<VERSION>'\n      AND TRY_CAST(REPLACE(f.\"<YYYYMM>\", ',', '') AS DOUBLE) IS NOT NULL\n),\nended_rentals AS (\n    SELECT\n        SUM(TRY_CAST(REPLACE(f.\"<YYYYMM>\", ',', '') AS DOUBLE)) AS ended_rentals\n    FROM datalake_luigijr_ops_finance_clean.finance_revenue_cost_<YEAR> f\n    WHERE f.bece_business = 'For Rent'\n      AND f.bece_l2 = 'Lucas Lima'\n      AND f.pl_line_1 = '-'\n      AND f.pl_line_2 = '-'\n      AND f.pl_line_3 = '-'\n      AND f.pl_line_4 = 'Ended Rentals'\n      AND f.version = '<VERSION>'\n      AND TRY_CAST(REPLACE(f.\"<YYYYMM>\", ',', '') AS DOUBLE) IS NOT NULL\n)\nSELECT\n\
    \    oc.offboarding_cost,\n    er.ended_rentals,\n    oc.offboarding_cost / er.ended_rentals AS offboarding_uc\nFROM offboarding_cost oc\nCROSS JOIN ended_rentals er;"
