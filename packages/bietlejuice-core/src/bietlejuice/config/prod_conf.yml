wonka_cluster:
    <<: *cluster_anchor
    access_control_list:
        group_name: mlops
        permission_level: CAN_MANAGE
    databricks_conn_id: databricks_new
    custom_libraries:
        - maven:
              coordinates: "org.apache.kafka:kafka-clients:3.5.1"
    custom_configurations:
        single_user_name: "{{ var.value.databricks_single_user_name }}"
        data_security_mode: SINGLE_USER
        spark_conf:
            spark.databricks.sql.initial.catalog.namespace: quintoandar_{{ var.value.environment }}
            spark.databricks.delta.schema.autoMerge.enabled: "true"
    spark_env_vars:
        PREV_DATA_INTERVAL_START_SUCCESS: "{{ prev_data_interval_start_success }}"
        PREV_DATA_INTERVAL_END_SUCCESS: "{{ prev_data_interval_end_success }}"
        PREV_START_DATE_SUCCESS: "{{ prev_start_date_success }}"
        PREV_END_DATE_SUCCESS: "{{ prev_end_date_success }}"
        DATA_INTERVAL_START: "{{ data_interval_start | ds }}"
        DATA_INTERVAL_START_JUST_FOR_DEBUG: "{{ data_interval_start }}"
        DATA_INTERVAL_END: "{{ data_interval_end }}"
        LOGICAL_DATE: "{{ logical_date }}"
        VAULT_SECRET: "{{ '{{secrets/mlops/VAULT_SECRET}}' }}"
        ENVIRONMENT: "{{ var.value.environment }}"
        FEATURE_STORE_HISTORICAL_DATABASE: "wonka"
        FEATURE_STORE_S3_BUCKET: "wonka.s3.data.quintoandar.com.br/wonka"
        INMETRO_VERSION: "{{ var.value.environment }}"
        INMETRO_DATA_ALARMS_SLACK_WEBHOOK: "https://notification-hub-internal-api.quintoandar.com.br/webhook/inmetro?space=data-alarms"
        INMETRO_S3_BUCKET_LOADER: "inmetro-s3-data-quintoandar-com-br"
        KAFKA_CONNECTION_STRING: "kafka-01.svc.core-prd.habitat.zone:9092,kafka-02.svc.core-prd.habitat.zone:9092,kafka-03.svc.core-prd.habitat.zone:9092"
        PYSPARK_PYTHON: "/databricks/python3/bin/python3"
        SPARK_RUNTIME: databricks
        SPARK_VERSION: "3.5.0"
        STREAM_CHECKPOINT_PATH: "s3://wonka.s3.data.quintoandar.com.br/checkpoints/online_feature_store"
        STREAM_PROCESSING_TIME: "0 seconds"
        ARTIFACTS_BUCKET: *artifacts_bucket
        DATABRICKS_S3_BUCKET: "{{ var.value.databricks_s3_bucket }}"
        AIRFLOW_DAG_ID: "{{ dag.dag_id }}"
        AIRFLOW_EXECUTION_PARAMS: "{{ dag_run.conf }}"
        AIRFLOW_EXECUTION_DATE: "{{ ds }}"
        AIRFLOW_PREVIOUS_EXECUTION_DATE: "{{ prev_ds }}"
        AIRFLOW_NEXT_EXECUTION_DATE: "{{ next_ds }}"
        WONKA_START_DATE: "{{ dag_run.conf.get('load_start_date', dag_run.conf.get('start_date', '')) }}"
        WONKA_END_DATE: "{{ dag_run.conf.get('load_end_date', dag_run.conf.get('end_date', '')) }}"
        WONKA_FORCE_FULL_LOAD: "{{ dag_run.conf.get('force_full_load', 'false')}}"
        CDF_TO_KAFKA_USE_SCHEMA_REGISTRY: "false"
    aws_attributes:
        <<: *aws_anchor
        availability: SPOT_WITH_FALLBACK
    init_scripts:
        - s3:
              destination: "{{ var.value.artifacts_bucket }}/bi-etl-ejuice/configure_spark.sh"
              region: ""
        - s3:
              destination: "{{ var.value.artifacts_bucket }}/bi-etl-ejuice/install_pex_generic.sh"
              region: ""
        - s3:
              destination: "{{ var.value.artifacts_bucket }}/bi-etl-ejuice/get_credentials_from_vault.sh"
              region: ""

