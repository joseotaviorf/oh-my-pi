### EMR Cluster Configs ###

emr_cluster_base: &emr_cluster_anchor
    cluster_name: "{{ dag.dag_id }}_{{ run_id }}"
    spark_version: emr-7.12.0
    emr_deploy_mode: client
    master_node_type_id: m6g.xlarge
    core_nodes:
        node_type_id: m6g.xlarge
        instance_count: 2
    task_nodes:
        node_type_id: m6g.xlarge
        instance_count: 0
    autotermination_minutes: 60
    emr_auto_terminate: false
    aws_attributes: &emr_aws_anchor
        availability: ON_DEMAND
        task_availability: SPOT
        ebs_volume_count: 1
        ebs_volume_size: 400
        ebs_volume_type: GENERAL_PURPOSE_SSD_GP3
        instance_profile_arn: "{{ var.value.emr_instance_profile_arn }}"
    emr_applications:
        - Hadoop
        - Hive
        - Spark
    emr_subnet_id: "{{ var.value.emr_subnet_id }}"
    emr_service_role: "{{ var.value.emr_service_role }}"
    emr_ebs_root_volume_size: 100
    cluster_log_conf:
        s3:
            destination: "{{ var.value.artifacts_bucket }}/emr/logs/dags/{{ dag.dag_id }}"
    init_scripts:
        - s3:
              destination: "{{ var.value.artifacts_bucket }}/bi-etl-ejuice/emr_init_script.sh"
          args:
              - "{{ var.value.artifacts_bucket }}"
              - "{{ var.value.databricks_s3_bucket }}"
              - "{{ dag.dag_id }}"
    custom_tags:
        - key: dag_id
          value: "{{ dag.dag_id }}"
        - key: application
          value: "{{ dag.dag_id }}"
        - key: app
          value: airflow
        - key: resource-name
          value: emr
        - key: environment
          value: "{{ var.value.environment }}"
        - key: owner
          value: "{{ task.owner.lower().replace(' ', '-') }}"
        - key: ecosystem
          value: data-engineering
        - key: data-classification
          value: private
        - key: sensitive-data
          value: "true"
        - key: cost-center
          value: c052
        - key: provisioner
          value: emr
        - key: for-use-with-amazon-emr-managed-policies
          value: "true"
    emr_configurations:
        - &emr_conf_iceberg_defaults
          Classification: iceberg-defaults
          Properties:
              iceberg.enabled: "true"
        - &emr_conf_delta_defaults
          Classification: delta-defaults
          Properties:
              delta.enabled: "true"
        - &emr_conf_yarn_env
          Classification: yarn-env
          Configurations:
              - Classification: export
                Properties:
                    ARTIFACTS_BUCKET: *artifacts_bucket
                    ENVIRONMENT: "{{ var.value.environment }}"
                    SPARK_RUNTIME: "emr"
                    SPARK_VERSION: "3.5"
                    DATABRICKS_UC_HOST: "{{ conn.databricks_new.host }}"
                    DATABRICKS_UC_TOKEN: "{{ conn.databricks_new.extra_dejson.token }}"
          Properties: {}
        - &emr_conf_spark_hive_site
          Classification: spark-hive-site
          Properties:
              hive.metastore.client.factory.class: "com.amazonaws.glue.catalog.metastore.AWSGlueDataCatalogHiveClientFactory"
              hive.metastore.glue.skip-archive: "true"
              aws.glue.cache.table.enable: "true"
              aws.glue.cache.table.size: "1000"
              aws.glue.cache.table.ttl-mins: "30"
              aws.glue.cache.db.enable: "true"
              aws.glue.cache.db.size: "1000"
              aws.glue.cache.db.ttl-mins: "30"
        - &emr_conf_yarn_site
          Classification: yarn-site
          Properties:
              yarn.resourcemanager.scheduler.enable-preemption: "true"
              yarn.scheduler.capacity.maximum-am-resource-percent: "0.2"
              yarn.scheduler.capacity.resource-calculator: org.apache.hadoop.yarn.util.resource.DominantResourceCalculator
              yarn.nodemanager.vmem-check-enabled: "false"
              yarn.nodemanager.pmem-check-enabled: "false"
        - &emr_conf_capacity_scheduler
          Classification: capacity-scheduler
          Properties:
              yarn.scheduler.capacity.root.queues: "default"
              yarn.scheduler.capacity.root.default.capacity: "100"
              yarn.scheduler.capacity.root.default.maximum-capacity: "100"
              yarn.scheduler.capacity.root.default.ordering-policy: fair
              yarn.scheduler.capacity.root.default.maximum-am-resource-percent: "0.2"
              yarn.scheduler.capacity.maximum-am-resource-percent: "0.2"
              yarn.scheduler.capacity.maximum-applications: "2000"
              yarn.scheduler.capacity.minimum-user-limit-percent: "10"
        - Classification: spark-defaults
          Properties: &emr_spark_defaults_props
              spark.databricks.delta.vacuum.parallelDelete.enabled: "true"
              spark.databricks.delta.autoCompact.enabled: "true"
    spark_conf: &emr_cluster_spark_conf_anchor
        spark.dynamicAllocation.enabled: "true"
        spark.shuffle.service.enabled: "true"
        spark.dynamicAllocation.minExecutors: "1"
        spark.executor.memory: 8g
        spark.executor.cores: "2"
        spark.executor.memoryOverhead: 2g
        spark.driver.memory: 8g
        spark.driver.memoryOverhead: 2g
        spark.yarn.am.memory: 8g
        spark.yarn.am.cores: "1"
        spark.sql.adaptive.enabled: "true"
        spark.sql.adaptive.coalescePartitions.enabled: "true"
        spark.sql.files.maxPartitionBytes: "268435456"
        spark.sql.adaptive.advisoryPartitionSizeInBytes: "268435456"
        # Delta OSS writes one file per shuffle partition (100) per table partition, so a
        # full-rewrite DAG emits 100k+ ~30KB files per run (dw_rent.fact_rent_demand_events:
        # 100 files / 3.9MB per day partition, 456k files vacuumed daily). Databricks UC
        # enabled optimized writes implicitly for partitioned tables; Delta OSS does not.
        # optimizeWrite hash-partitions on the table partition columns before writing, so
        # each partition gets ~1 right-sized file in the same commit. File layout only,
        # table data unchanged. Per-DAG opt-out: set "false" under
        # cluster.custom_configurations.spark_conf.
        spark.databricks.delta.optimizeWrite.enabled: "true"
        spark.sql.adaptive.skewJoin.enabled: "true"
        spark.sql.adaptive.localShuffleReader.enabled: "true"
        spark.sql.shuffle.partitions: "100"
        # Planner-time broadcast stays off: #26363 hit multi-GB BroadcastHashJoins
        # because Catalyst underestimates build-side size from Glue stats /
        # compressed parquet file lengths (Wonka, fact_tickets).
        spark.sql.autoBroadcastJoinThreshold: "-1"
        # AQE re-plans after a shuffle stage completes, so JoinSelection sees
        # measured MapOutputStatistics bytes (Statistics.isRuntime) instead of an
        # estimate; the SortMergeJoin -> BroadcastHashJoin promotion is bounded by
        # the shuffle compression ratio, not by cardinality-estimation error.
        spark.sql.adaptive.autoBroadcastJoinThreshold: "67108864"
        spark.serializer: "org.apache.spark.serializer.KryoSerializer"
        spark.scheduler.mode: FAIR
        spark.speculation: "false"
        spark.hadoop.mapreduce.input.fileinputformat.list-status.num-threads: "64"
        spark.sql.sources.parallelPartitionDiscovery.threshold: "32"
        spark.hadoop.fs.s3a.fast.upload: "true"
        spark.hadoop.fs.s3a.fast.upload.buffer: "disk"
        spark.sql.parquet.compression.codec: "zstd"
        spark.sql.adaptive.skewJoin.skewedPartitionFactor: "5"
        spark.sql.adaptive.skewJoin.skewedPartitionThresholdInBytes: "256MB"
        spark.sql.execution.arrow.pyspark.enabled: "true"
        spark.rpc.message.maxSize: "2000"
        spark.sql.parquet.int96RebaseModeInWrite: "LEGACY"
        spark.sql.parquet.datetimeRebaseModeInWrite: "LEGACY"
        spark.sql.sources.partitionOverwriteMode: dynamic
        spark.sql.parquet.filterPushdown: "true"
        spark.sql.sources.default: parquet
        spark.sql.legacy.createHiveTableByDefault: "true"
        spark.sql.legacy.parquet.datetimeRebaseModeInRead: LEGACY
        spark.sql.legacy.parquet.datetimeRebaseModeInWrite: LEGACY
        spark.sql.legacy.timeParserPolicy: LEGACY
        spark.sql.legacy.json.allowEmptyString.enabled: "true"
        # DESCRIBE renders data_type with simpleString, truncated past this limit
        # ("... N more fields"). The metastore loader writes DESCRIBE output back as
        # DDL, so a low value corrupts wide struct columns in the catalog.
        spark.sql.debug.maxToStringFields: "4096"
        spark.sql.catalogImplementation: hive
        spark.driverEnv.ARTIFACTS_BUCKET: *artifacts_bucket
        spark.driverEnv.ENVIRONMENT: "{{ var.value.environment }}"
        spark.driverEnv.SPARK_RUNTIME: "emr"
        spark.driverEnv.SPARK_VERSION: "3.5"
        spark.driverEnv.DATABRICKS_UC_HOST: "{{ conn.databricks_new.host }}"
        spark.driverEnv.DATABRICKS_UC_TOKEN: "{{ conn.databricks_new.extra_dejson.token }}"
        spark.executorEnv.ARTIFACTS_BUCKET: *artifacts_bucket
        spark.executorEnv.ENVIRONMENT: "{{ var.value.environment }}"
        spark.executorEnv.SPARK_RUNTIME: "emr"
        spark.executorEnv.SPARK_VERSION: "3.5"
        spark.executorEnv.DATABRICKS_UC_HOST: "{{ conn.databricks_new.host }}"
        spark.executorEnv.DATABRICKS_UC_TOKEN: "{{ conn.databricks_new.extra_dejson.token }}"
        spark.yarn.appMasterEnv.ARTIFACTS_BUCKET: *artifacts_bucket
        spark.yarn.appMasterEnv.ENVIRONMENT: "{{ var.value.environment }}"
        spark.yarn.appMasterEnv.SPARK_RUNTIME: "emr"
        spark.yarn.appMasterEnv.SPARK_VERSION: "3.5"
        spark.yarn.appMasterEnv.DATABRICKS_UC_HOST: "{{ conn.databricks_new.host }}"
        spark.yarn.appMasterEnv.DATABRICKS_UC_TOKEN: "{{ conn.databricks_new.extra_dejson.token }}"
        spark.extraListeners: "io.openlineage.spark.agent.OpenLineageSparkListener"
        spark.openlineage.transport.type: "http"
        spark.openlineage.transport.url: "https://metadata-propagator.apps.data-frn-blue.habitat.zone"
        spark.openlineage.transport.endpoint: "/openlineage/events"
        # NoOpCircuitBreaker let OpenLineageSparkListener.onApplicationEnd submit a Spark
        # job into the SparkContext.stop() window and wedge the driver
        # (j-0835817ZSRL6JVJLDX9, 2026-08-07).
        spark.openlineage.circuitBreaker.type: "timeout"
        spark.openlineage.circuitBreaker.timeoutInSeconds: "20"
        # Keep event logs on the EMR default path (do not set spark.eventLog.dir)
        # so Persistent Application UI / History Server can still show them.
        # spark.eventLog.enabled: "true"
        # spark.eventLog.compress: "true"
        # spark.eventLog.compression.codec: "zstd"
        # spark.eventLog.logStageExecutorMetrics: "true"
        # spark.eventLog.rolling.enabled: "true"
        # YARN app staging on S3 (not cluster HDFS) so AM relaunches after lost NM /
        # node blips still find __spark_conf__.zip / pyspark.zip.
        # Recommend an S3 lifecycle rule on emr/spark-staging/.
        spark.yarn.stagingDir: "s3a://{{ var.value.artifacts_bucket | replace('s3://', '') }}/emr/spark-staging/{{ dag.dag_id }}"
        # Cluster observability → graphite-exporter → Prometheus/Grafana. Mirrors the
        # Databricks cluster_template spark_conf (forno_conf.yml:188-197). Plugin JARs
        # (spark-measure, spark-plugins, spark-cluster-metrics=GangliaMetrics) are already
        # staged on the EMR Spark classpath by emr_init_script.sh:892-911.
        spark.plugins: "ch.cern.CloudFSMetrics,ch.cern.CgroupMetrics,br.com.quintoandar.GangliaMetrics"
        spark.cernSparkPlugin.cloudFsName: "s3a"
        # spark-defaults applies to driver + executors; client-mode driver runs on master.
        # Databricks sets registerOnDriver in its driver conf (init_script.sh:16); mirror here.
        spark.cernSparkPlugin.registerOnDriver: "true"
        spark.metrics.conf.*.sink.graphite.class: "org.apache.spark.metrics.sink.GraphiteSink"
        spark.metrics.conf.*.sink.graphite.host: "graphite-exporter.apps.core-frn.habitat.zone"
        spark.metrics.conf.*.sink.graphite.period: "15"
        spark.metrics.conf.*.sink.graphite.port: "9109"
        spark.metrics.conf.*.sink.graphite.unit: "seconds"
        spark.metrics.conf.*.source.jvm.class: "org.apache.spark.metrics.source.JvmSource"
        spark.metrics.namespace: "{{ dag.dag_id.replace('.', '_').replace('_', '.', 1) }}"

    spark_env_vars:
        ENVIRONMENT: "{{ var.value.environment }}"
        ARTIFACTS_BUCKET: *artifacts_bucket
        SPARK_RUNTIME: "emr"
        SPARK_VERSION: "3.5"
        DATABRICKS_UC_HOST: "{{ conn.databricks_new.host }}"
        DATABRICKS_UC_TOKEN: "{{ conn.databricks_new.extra_dejson.token }}"

