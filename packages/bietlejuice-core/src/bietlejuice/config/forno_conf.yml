##### Clusters Configs #####
cluster_template:
    cluster: &cluster_anchor
        enable_elastic_disk: "true"
        autotermination_minutes: 20
        aws_attributes: &aws_anchor
            availability: SPOT_WITH_FALLBACK
            ebs_volume_count: 1
            ebs_volume_size: 100
            ebs_volume_type: GENERAL_PURPOSE_SSD
            instance_profile_arn: "{{ var.value.instance_profile_arn }}"
            spot_bid_price_percent: 100
            zone_id: us-east-1d
        cluster_log_conf:
            s3:
                destination: s3://{{ var.value.databricks_s3_bucket }}/logs/jobs/{{ dag.dag_id}}
                region: us-east-1
        cluster_name: "{{ dag.dag_id }}_{{ run_id }}"
        custom_tags: &cluster_custom_tags_anchor
            dag_id: "{{ dag.dag_id }}"
            application: "{{ dag.dag_id }}"
            app: airflow
            resource-name: databricks
            environment: "{{ var.value.environment }}"
            owner: "{{ task.owner.lower().replace(' ', '-') }}"
            ecosystem: data-engineering
            data-classification: private
            sensitive-data: "true"
            cost-center: c052
            provisioner: databricks
        init_scripts:
            - s3:
                  destination: "{{ var.value.artifacts_bucket }}/bi-etl-ejuice/init_script.sh"
                  region: ""
        spark_conf: &spark_conf_anchor
            spark.rpc.message.maxSize: "2000"
            spark.sql.sources.partitionOverwriteMode: dynamic
            spark.sql.parquet.filterPushdown: "true"
            spark.sql.sources.default: parquet
            spark.sql.legacy.createHiveTableByDefault: "true"
            spark.sql.legacy.parquet.datetimeRebaseModeInRead: LEGACY
            spark.sql.legacy.parquet.datetimeRebaseModeInWrite: LEGACY
            spark.sql.legacy.timeParserPolicy: LEGACY
            # DESCRIBE renders data_type with simpleString, truncated past this limit
            # ("... N more fields"). The metastore loader writes DESCRIBE output back as
            # DDL, so a low value corrupts wide struct columns in the catalog.
            spark.sql.debug.maxToStringFields: "4096"
            spark.metrics.conf.*.sink.graphite.class: "org.apache.spark.metrics.sink.GraphiteSink"
            spark.metrics.conf.*.sink.graphite.host: "graphite-exporter.apps.core-frn.habitat.zone"
            spark.metrics.conf.*.sink.graphite.period: "15"
            spark.metrics.conf.*.sink.graphite.port: "9109"
            spark.metrics.conf.*.sink.graphite.unit: "seconds"
            spark.metrics.conf.*.source.jvm.class: "org.apache.spark.metrics.source.JvmSource"
            spark.metrics.namespace: "{{ dag.dag_id.replace('.', '_').replace('_', '.', 1) }}"
            spark.plugins: "ch.cern.CloudFSMetrics,ch.cern.CgroupMetrics,br.com.quintoandar.GangliaMetrics"
            spark.jars.packages: "ch.cern.sparkmeasure:spark-plugins_2.12:0.2,ch.cern.sparkmeasure:spark-measure_2.12:0.21"
            spark.cernSparkPlugin.cloudFsName: "s3a"
            # TODO(DPLT-927): remove sparkmeasure listener once Spark event log pipeline is validated stable.
            # Superseded by spark.eventLog.* below — event log parser covers all metrics plus executor memory peaks.
            spark.extraListeners: "ch.cern.sparkmeasure.FlightRecorderStageMetrics"
            spark.sparkmeasure.outputFilename: "/tmp/stageMetrics_flightRecorder.json"
            spark.sparkmeasure.outputFormat: "json"
            spark.sparkmeasure.printToStdout: "false"
            # Spark event logs (Spark UI history) → S3, zstd-compressed. Ingested into
            # datalake_databricks_health.spark_stage_metrics by bietlejuice.enrich_spark_event_logs.
            # logStageExecutorMetrics is OFF by default in Spark; we MUST set it to true so the
            # event log includes SparkListenerStageExecutorMetrics with peak JVM heap, GC time,
            # on/off-heap execution memory per executor — the data needed for memory right-sizing.
            spark.eventLog.enabled: "true"
            spark.eventLog.dir: "s3a://{{ var.value.databricks_s3_bucket }}/spark-event-logs/{{ dag.dag_id }}"
            spark.eventLog.compress: "true"
            spark.eventLog.compression.codec: "zstd"
            spark.eventLog.logStageExecutorMetrics: "true"
            spark.databricks.delta.retentionDurationCheck.enabled: "false"
            spark.databricks.behaviorChange.SC102534CommandRedactProperties.enabled: "false"
            spark.databricks.sql.initial.catalog.namespace: "quintoandar_{{ var.value.environment }}"
        spark_env_vars:
            PYSPARK_PYTHON: "/databricks/python3/bin/python3"
            SPARK_RUNTIME: databricks
            ENVIRONMENT: "{{ var.value.environment }}"
            ARTIFACTS_BUCKET: *artifacts_bucket
            DATABRICKS_S3_BUCKET: "{{ var.value.databricks_s3_bucket }}"
            AIRFLOW_DAG_ID: "{{ dag.dag_id }}"
            DATAHUB_GRAPHQL_URL: "https://datahub-gms.apps.data-frn.habitat.zone/api/graphql"
        ssh_public_keys: []
        node_type_id: m5a.large
        driver_node_type_id: m5a.large
        spark_version: 10.4.x-scala2.12
        data_security_mode: SINGLE_USER
        single_user_name: "{{ var.value.databricks_single_user_name }}"

    cluster_base: &cluster_anchor_base
        autotermination_minutes: 20
        aws_attributes:
            instance_profile_arn: "{{ var.value.instance_profile_arn }}"
        cluster_log_conf:
            s3:
                destination: s3://{{ var.value.databricks_s3_bucket }}/logs/jobs/{{ dag.dag_id}}
                region: us-east-1
        cluster_name: "{{ dag.dag_id }}_{{ run_id }}"
        custom_tags:
            - key: dag_id
              value: "{{ dag.dag_id }}"
            - key: application
              value: "{{ dag.dag_id }}"
            - key: app
              value: airflow
            - key: resource-name
              value: databricks
            - key: environment
              value: "{{ var.value.environment }}"
            - key: owner
              value: "{{ task.owner.lower().replace(' ', '-') }}"
            - key: ecosystem
              value: data-engineering
            - key: data-classification
              value: private
            - key: sensitive-data
              value: true
            - key: cost-center
              value: c052
            - key: provisioner
              value: databricks
        init_scripts:
            - s3:
                  destination: "{{ var.value.artifacts_bucket }}/bi-etl-ejuice/init_script.sh"
                  region: ""
        spark_conf: &spark_conf_base_anchor
            spark.scheduler.mode: FAIR
            spark.speculation: "false"
            spark.rpc.message.maxSize: "2000"
            spark.sql.sources.partitionOverwriteMode: dynamic
            spark.sql.parquet.filterPushdown: "true"
            spark.sql.sources.default: parquet
            spark.sql.legacy.createHiveTableByDefault: "true"
            spark.sql.legacy.parquet.datetimeRebaseModeInRead: LEGACY
            spark.sql.legacy.parquet.datetimeRebaseModeInWrite: LEGACY
            spark.sql.legacy.timeParserPolicy: LEGACY
            # DESCRIBE renders data_type with simpleString, truncated past this limit
            # ("... N more fields"). The metastore loader writes DESCRIBE output back as
            # DDL, so a low value corrupts wide struct columns in the catalog.
            spark.sql.debug.maxToStringFields: "4096"
            spark.metrics.conf.*.sink.graphite.class: "org.apache.spark.metrics.sink.GraphiteSink"
            spark.metrics.conf.*.sink.graphite.host: "graphite-exporter.apps.core-frn.habitat.zone"
            spark.metrics.conf.*.sink.graphite.period: "15"
            spark.metrics.conf.*.sink.graphite.port: "9109"
            spark.metrics.conf.*.sink.graphite.unit: "seconds"
            spark.metrics.conf.*.source.jvm.class: "org.apache.spark.metrics.source.JvmSource"
            spark.metrics.namespace: "{{ dag.dag_id.replace('.', '_').replace('_', '.', 1) }}"
            spark.plugins: "ch.cern.CloudFSMetrics,ch.cern.CgroupMetrics,br.com.quintoandar.GangliaMetrics"
            spark.jars.packages: "ch.cern.sparkmeasure:spark-plugins_2.12:0.2,ch.cern.sparkmeasure:spark-measure_2.12:0.21"
            spark.cernSparkPlugin.cloudFsName: "s3a"
            # TODO(DPLT-927): remove sparkmeasure listener once Spark event log pipeline is validated stable.
            # Superseded by spark.eventLog.* below — event log parser covers all metrics plus executor memory peaks.
            spark.extraListeners: "ch.cern.sparkmeasure.FlightRecorderStageMetrics"
            spark.sparkmeasure.outputFilename: "/tmp/stageMetrics_flightRecorder.json"
            spark.sparkmeasure.outputFormat: "json"
            spark.sparkmeasure.printToStdout: "false"
            # Spark event logs (Spark UI history) → S3, zstd-compressed. Ingested into
            # datalake_databricks_health.spark_stage_metrics by bietlejuice.enrich_spark_event_logs.
            # logStageExecutorMetrics is OFF by default in Spark; we MUST set it to true so the
            # event log includes SparkListenerStageExecutorMetrics with peak JVM heap, GC time,
            # on/off-heap execution memory per executor — the data needed for memory right-sizing.
            spark.eventLog.enabled: "true"
            spark.eventLog.dir: "s3a://{{ var.value.databricks_s3_bucket }}/spark-event-logs/{{ dag.dag_id }}"
            spark.eventLog.compress: "true"
            spark.eventLog.compression.codec: "zstd"
            spark.eventLog.logStageExecutorMetrics: "true"
            spark.databricks.delta.retentionDurationCheck.enabled: "false"
            spark.databricks.behaviorChange.SC102534CommandRedactProperties.enabled: "false"
            spark.databricks.sql.initial.catalog.namespace: "quintoandar_{{ var.value.environment }}"
        spark_env_vars:
            PYSPARK_PYTHON: "/databricks/python3/bin/python3"
            SPARK_RUNTIME: databricks
            ENVIRONMENT: "{{ var.value.environment }}"
            ARTIFACTS_BUCKET: *artifacts_bucket
            DATABRICKS_S3_BUCKET: "{{ var.value.databricks_s3_bucket }}"
            AIRFLOW_DAG_ID: "{{ dag.dag_id }}"
            DATAHUB_GRAPHQL_URL: "https://datahub-gms.apps.data-frn.habitat.zone/api/graphql"
        ssh_public_keys: []
        spark_version: 10.4.x-scala2.12
        data_security_mode: SINGLE_USER
        single_user_name: "{{ var.value.databricks_single_user_name }}"

