##### Wonka Consolidation Presets #####
# Each preset = the same-tier consolidation_* preset + the wonka runtime
# (env vars, init scripts, ACL, conn id), so generated wonka validation
# blocks carry only real per-job overrides.
# Merge order matters: in a block-sequence merge, EARLIER entries win key
# collisions, so *wonka_runtime is listed first — it overrides the tier
# preset (init_scripts, aws_attributes, ...) exactly like wonka_cluster.
# Runtime pinned to 15.4.x-scala2.12: wonka prod jobs run 15.4, and
# validation must mirror the prod runtime (unlike the 16.4 generic set).
# No single-node wonka variants: no wonka cluster is single-node.

wonka_consolidation_xs_compute_cluster:
    <<:
        - *wonka_runtime
        - *consolidation_xs_compute_cluster
    spark_version: 15.4.x-scala2.12

wonka_consolidation_s_compute_cluster:
    <<:
        - *wonka_runtime
        - *consolidation_s_compute_cluster
    spark_version: 15.4.x-scala2.12

wonka_consolidation_m_compute_cluster:
