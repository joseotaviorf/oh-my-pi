        WONKA_FORCE_FULL_LOAD: "{{ dag_run.conf.get('force_full_load', 'false')}}"
        CDF_TO_KAFKA_USE_SCHEMA_REGISTRY: "false"
    aws_attributes:
        <<: *aws_anchor
        availability: SPOT_WITH_FALLBACK
    init_scripts:
        - s3:
              destination: "{{ var.value.artifacts_bucket }}/bi-etl-ejuice/configure_spark.sh"
