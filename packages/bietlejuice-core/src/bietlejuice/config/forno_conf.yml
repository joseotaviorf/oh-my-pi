### Datazord Configs
datazord_kafka_bootstrap_servers: "lkc-2yo85o-j29g53.us-east-1.aws.glb.confluent.cloud:9092"
datazord_base_checkpoint_location: "s3://wonka.s3.forno.data.quintoandar.com.br/checkpoints/cdf-to-kafka"

wonka_cluster_emr:
    <<: *emr_cluster_anchor
    # Airflow-only (stripped before EMR API); avoids deferred create-cluster resume issues on forno.
    airflow_emr_create_cluster_deferrable: false
    # Overrides the anchor's list to add Delta schema autoMerge, restoring parity
    # with wonka_runtime's Databricks spark_conf. It must live here (cluster
    # classification) rather than in spark_conf because HierarchicalConf's
    # deep-merge replaces list values wholesale, so a spark_conf-only override
    # would wipe the preset Glue/Delta classifications. Without it, the first
    # schema evolution of any wonka feature set fails the write with a Delta
    # schema mismatch.
    emr_configurations:
        - *emr_conf_iceberg_defaults
        - *emr_conf_delta_defaults
        - *emr_conf_yarn_env
        - *emr_conf_spark_hive_site
        - *emr_conf_yarn_site
        - *emr_conf_capacity_scheduler
        - Classification: spark-defaults
          Properties:
              <<: *emr_spark_defaults_props
              spark.databricks.delta.schema.autoMerge.enabled: "true"
    init_scripts:
        - s3:
              destination: "{{ var.value.artifacts_bucket }}/bi-etl-ejuice/emr_init_script.sh"
          args:
              - "{{ var.value.artifacts_bucket }}"
              - "{{ var.value.databricks_s3_bucket }}"
              - "{{ dag.dag_id }}"
        - s3:
              destination: "{{ var.value.artifacts_bucket }}/bi-etl-ejuice/install_pex_generic.sh"
          args: []
    spark_conf:
        <<: *emr_cluster_spark_conf_anchor
    spark_env_vars:
        PREV_DATA_INTERVAL_START_SUCCESS: "{{ prev_data_interval_start_success }}"
        PREV_DATA_INTERVAL_END_SUCCESS: "{{ prev_data_interval_end_success }}"
        PREV_START_DATE_SUCCESS: "{{ prev_start_date_success }}"
        PREV_END_DATE_SUCCESS: "{{ prev_end_date_success }}"
        DATA_INTERVAL_START: "{{ data_interval_start | ds }}"
        DATA_INTERVAL_START_JUST_FOR_DEBUG: "{{ data_interval_start }}"
        DATA_INTERVAL_END: "{{ data_interval_end }}"
        LOGICAL_DATE: "{{ logical_date }}"
        AIRFLOW_EXECUTION_DATE: "{{ ds }}"
        AIRFLOW_PREVIOUS_EXECUTION_DATE: "{{ prev_ds }}"
        AIRFLOW_NEXT_EXECUTION_DATE: "{{ next_ds }}"
        WONKA_START_DATE: "{{ dag_run.conf.get('start_date', '') }}"
        WONKA_END_DATE: "{{ dag_run.conf.get('end_date', '') }}"
        ENVIRONMENT: "{{ var.value.environment }}"
        ARTIFACTS_BUCKET: *artifacts_bucket
        SPARK_RUNTIME: "emr"
        SPARK_VERSION: "3.5"
        FEATURE_STORE_HISTORICAL_DATABASE: "wonka"
        FEATURE_STORE_S3_BUCKET: "wonka.s3.forno.data.quintoandar.com.br/wonka"
        INMETRO_VERSION: "{{ var.value.environment }}"
        INMETRO_DATA_ALARMS_SLACK_WEBHOOK: "https://notification-hub-internal-api.apps.core-frn.habitat.zone/webhook/inmetro?space=data-alarms"
        INMETRO_S3_BUCKET_LOADER: "inmetro-s3-forno-quintoandar-com-br"
        KAFKA_CONNECTION_STRING: "kafka-01.svc.core-frn.habitat.zone:9092,kafka-02.svc.core-frn.habitat.zone:9092,kafka-03.svc.core-frn.habitat.zone:9092"
        STREAM_CHECKPOINT_PATH: "s3://wonka.s3.forno.data.quintoandar.com.br/checkpoints/online_feature_store"
        STREAM_PROCESSING_TIME: "0 seconds"
        AIRFLOW_EXECUTION_PARAMS: "{{ dag_run.conf }}"
        WONKA_DISABLE_ONLINE_WRITER: "{{ dag_run.conf.get('disable_online_writer', 'false')}}"
        WONKA_FORCE_FULL_LOAD: "{{ dag_run.conf.get('force_full_load', 'false')}}"
