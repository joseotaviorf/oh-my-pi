        PYSPARK_PYTHON: "/databricks/python3/bin/python3"
        SPARK_RUNTIME: databricks
        SPARK_VERSION: "3.5.0"
        STREAM_CHECKPOINT_PATH: "s3://wonka.s3.forno.data.quintoandar.com.br/checkpoints/online_feature_store"
        STREAM_PROCESSING_TIME: "0 seconds"
        ARTIFACTS_BUCKET: *artifacts_bucket
        DATABRICKS_S3_BUCKET: "{{ var.value.databricks_s3_bucket }}"
        AIRFLOW_DAG_ID: "{{ dag.dag_id }}"
        AIRFLOW_EXECUTION_PARAMS: "{{ dag_run.conf }}"
        AIRFLOW_EXECUTION_DATE: "{{ ds }}"
        AIRFLOW_PREVIOUS_EXECUTION_DATE: "{{ prev_ds }}"
