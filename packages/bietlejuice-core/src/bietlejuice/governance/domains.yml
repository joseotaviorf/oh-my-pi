# Single source of truth for the metadata `domain:` allowlist (FAIR F2-01 + Yamale CI).
#
# Read through bietlejuice.governance.domain_registry — consumers depend on the
# loader, never on this file's format. Swapping the source later (e.g. to the
# data-contracts domain files) is contained behind that loader.
#
# IMPORTANT: `metadata_domains` order is PRESERVED into the generated Yamale regex
# and must stay byte-identical to the historical pattern. Do not reorder casually;
# append new domains at the position the sync expects (see test_domain_registry).
version: 1

metadata_domains:
  - Agents
  - Cross
  - Data Ops & Governance
  - Data Life Cycle
  - Fintech
  - For Rent
  - For Sale
  - Growth
  - International
  - Journey Optimizer
  - MLOps
  - People
  - QCX
  - Rede
  - Support and Services
  - Tech Platform
  - Data Platform
  - Conversational XP
  - DS Pricing
  - Atlas DB
  - Broker XP
  - House and Listing
  - Enterprise Efficiency

# Reliable 1:1 mapping from a dags/ repo folder to its metadata `domain:` value.
# Used to scaffold `domain:` in generate_metadata. Only folders with a single,
# unambiguous domain are listed — folders that are mixed or per-DAG (platform, core,
# planning_and_performance, publisher_xp, ops_poc) are intentionally omitted so the
# author fills `domain:` in by hand instead of getting a wrong guess.
repo_folder_mappings:
  agents: Agents
  atlas_db: Atlas DB
  broker_xp: Broker XP
  conversational_xp: Conversational XP
  cross: Cross
  ds_pricing: DS Pricing
  enterprise_efficiency: Enterprise Efficiency
  fintech: Fintech
  for_rent: For Rent
  for_sale: For Sale
  governance: Data Ops & Governance
  growth: Growth
  house_and_listing: House and Listing
  journey_optimizer: Journey Optimizer
  mlops: MLOps
  people: People
  qcx: QCX
  support_and_service: Support and Services
  tech_platform: Tech Platform

# metadata `domain:` → data-contracts catalog + DataHub URN leaf.
# A bietlejuice domain may map to a DC domain root (omit dc_subdomain) or to a DC
# subdomain (set dc_subdomain). Domains without a row here have no DC mapping yet
# and fall back to the legacy name-derived slug (Cross, International, Journey
# Optimizer, Rede, DS Pricing). DS Pricing is intentionally left unmapped: its
# schemas are governed by the Growth domain in data-contracts but there is no
# DS Pricing subdomain yet -- revisit if/when one is created under Growth.
catalog_mappings:
  Agents:
    dc_domain: prod-agents-domain
    datahub_urn_leaf: urn:li:domain:agents-domain
  Atlas DB:
    dc_domain: prod-growth-domain
    dc_subdomain: prod-growth-atlas-subdomain
    datahub_urn_leaf: urn:li:domain:growth-atlas-subdomain
  Broker XP:
    dc_domain: prod-growth-domain
    dc_subdomain: prod-growth-brokerxp-subdomain
    datahub_urn_leaf: urn:li:domain:growth-brokerxp-subdomain
  Conversational XP:
    dc_domain: prod-conversationalxp-domain
    datahub_urn_leaf: urn:li:domain:conversationalxp-domain
  Data Life Cycle:
    dc_domain: prod-dataplatform-domain
    dc_subdomain: prod-dataplatform-dlc-subdomain
    datahub_urn_leaf: urn:li:domain:dataplatform-dlc-subdomain
  Data Ops & Governance:
    dc_domain: prod-dataplatform-domain
    dc_subdomain: prod-dataplatform-gov-subdomain
    datahub_urn_leaf: urn:li:domain:dataplatform-gov-subdomain
  Data Platform:
