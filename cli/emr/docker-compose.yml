services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      EMR_ENVIRONMENT: ${EMR_ENVIRONMENT:-prod}
    volumes:
      - ${HOME}/.aws:/root/.aws:ro
      - ./config:/config:ro
      # WORKDIR is /app — mount here so relative paths like samples/job/x.py resolve.
      - ./samples:/app/samples:ro
