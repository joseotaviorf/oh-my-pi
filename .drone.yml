clone:
  git-clone:
    image: plugins/git

pipeline:
#  =======================================================================
# =============================== PYTHON 2 ===============================
#  =======================================================================
  check-style-python2:
    group: ec2-tests
    image: python:2.7.12
    commands:
      - apt-get update
      - apt-get install -y git > /dev/null
      - chmod +x scripts/execute_python2_steps.sh
      - bash scripts/execute_python2_steps.sh "make requirements-lint-python2" "make check-style-python2"
    when:
      event: push

  validate-tables-ddl-ods-migration:
    group: ec2-tests
    image: python:2.7.12
    commands:
      - apt-get update
      - apt-get install -y git > /dev/null
      - pip install -r requirements_ods_migration_test.txt
      - python scripts/compare_tables_ddl.py
    when:
      event: push

  unit-tests-python2:
    group: ec2-tests
    image: python:2.7.12
    commands:
      - export AIRFLOW_GPL_UNIDECODE=yes
      - export AWS_DEFAULT_REGION=us-east-1
      - apt-get update
      - apt-get install -y git > /dev/null
      - chmod +x scripts/execute_python2_steps.sh
      - bash scripts/execute_python2_steps.sh "make requirements-python2" "make unit-tests-python2" "make cov-badge"
    when:
      event: push

  export-github-credentials-ec2:
    group: ec2-export
    image: python:2.7.12
    commands:
      - echo $${GITHUB_ACCESS_TOKEN} > githubcredentials.txt
    secrets:
      - source: github_access_token
        target: github_access_token
    when:
      event: push
      branch: [ forno, master ]

  install-dependencies-ec2-forno:
    group: ec2-install
    image: drillster/drone-rsync
    hosts: [ ssh.airflow.forno.quintoandar.com.br ]
    user: airflow
    source: .
    target: ~/bi
    include: [ 'requirements.txt', 'variables.json', 'githubcredentials.txt'  ]
    exclude: [ '*' ]
    args: '-vI'
    script:
      - git config --global credential.helper store
      - export GH_TOKEN=$(cat ~/bi/githubcredentials.txt)
      - echo "https://$GH_TOKEN:$GH_TOKEN@github.com" > ~/.git-credentials
      - cd /var/www/airflow/
      - AIRFLOW_GPL_UNIDECODE=yes airflow_venv/bin/pip install -I -Ur ~/bi/requirements.txt --extra-index-url https://quintoandar.github.io/python-package-server/
      - airflow_venv/bin/airflow variables -i ~/bi/variables.json
      - sudo find /var/www/airflow/dags/bietlejuice -name \*.pyc -delete
      - sudo find /var/www/airflow/plugins -name \*.pyc -delete
      - rm ~/bi/githubcredentials.txt
    secrets:
      - source: rsync_key
        target: rsync_key
    when:
      event: push
      branch: [ forno ]

  install-dependencies-ec2-prod:
    group: ec2-install
    image: drillster/drone-rsync
    hosts: [ ssh.airflow.quintoandar.com.br ]
    user: airflow
    source: .
    target: ~/bi
    include: [ 'requirements.txt', 'variables.json', 'githubcredentials.txt'   ]
    exclude: [ '*' ]
    args: '-vI'
    script:
      - git config --global credential.helper store
      - export GH_TOKEN=$(cat ~/bi/githubcredentials.txt)
      - echo "https://$GH_TOKEN:$GH_TOKEN@github.com" > ~/.git-credentials
      - cd /var/www/airflow/
      - AIRFLOW_GPL_UNIDECODE=yes airflow_venv/bin/pip install -I -Ur ~/bi/requirements.txt --extra-index-url https://quintoandar.github.io/python-package-server/
      - airflow_venv/bin/airflow variables -i ~/bi/variables.json
      - sudo find /var/www/airflow/dags/bietlejuice -name \*.pyc -delete
      - sudo find /var/www/airflow/plugins -name \*.pyc -delete
      - rm ~/bi/githubcredentials.txt
    secrets: [ rsync_key ]
    when:
      event: push
      branch: [ master ]

  load-jobs-ec2-forno:
    group: ec2-updated_jobs
    image: drillster/drone-rsync
    hosts: [ ssh.airflow.forno.quintoandar.com.br ]
    user: airflow
    source: "bietlejuice/*"
    exclude: "jobs/composer/*"
    target: /var/www/airflow/dags/bietlejuice
    args: '--force -vI'
    delete: true
    secrets: [ rsync_key ]
    when:
      event: push
      branch: [ forno ]

  load-jobs-ec2-prod:
    group: ec2-updated_jobs
    image: drillster/drone-rsync
    hosts: [ ssh.airflow.quintoandar.com.br ]
    user: airflow
    source: "bietlejuice/*"
    exclude: "jobs/composer/*"
    target: /var/www/airflow/dags/bietlejuice
    args: '--force -vI'
    delete: true
    secrets: [ rsync_key ]
    when:
      event: push
      branch: [ master ]

  load-plugins-ec2-forno:
    group: ec2-updated_jobs
    image: drillster/drone-rsync
    hosts: [ ssh.airflow.forno.quintoandar.com.br ]
    user: airflow
    source: plugins/*
    target: /var/www/airflow/plugins
    args: '--force -vI'
    delete: true
    secrets: [ rsync_key ]
    when:
      event: push
      branch: [ forno ]

  load-plugins-ec2-prod:
    group: ec2-updated_jobs
    image: drillster/drone-rsync
    hosts: [ ssh.airflow.quintoandar.com.br ]
    user: airflow
    source: plugins/*
    target: /var/www/airflow/plugins
    args: '--force -vI'
    delete: true
    secrets: [ rsync_key ]
    when:
      event: push
      branch: [ master ]

#  =======================================================================
# =============================== PYTHON 3 ===============================
#  =======================================================================

  check-style-python3:
    group: tests
    image: python:3.7.3
    commands:
      - apt-get update
      - apt-get install -y git > /dev/null
      - chmod +x scripts/execute_python3_steps.sh
      - bash scripts/execute_python3_steps.sh "make requirements-lint-python3" "make check-style-python3"
    when:
      event: push

  files-validation-python3:
    group: tests
    image: python:3.7.3
    pull: true
    commands:
      - apt-get update
      - apt-get install -y git > /dev/null
      - chmod +x scripts/execute_python3_steps.sh
      - bash scripts/execute_python3_steps.sh "make requirements-test-python3" "make files-validation-python3"
    when:
      event: push

  unit-tests-python3:
    group: tests
    image: quintoandar/pyspark:0.2
    pull: true
    commands:
      - export AIRFLOW_GPL_UNIDECODE=yes
      - export AWS_DEFAULT_REGION=us-east-1
      - chmod +x scripts/execute_python3_steps.sh
      - bash scripts/execute_python3_steps.sh "make requirements-test-python3" "make requirements-python3" "make unit-tests-python3"
    when:
      event: push

  validate-dags-dependencies-forno:
    group: tests
    image: python:3.7.3
    environment:
      ENVIRONMENT: forno
    commands:
      - make requirements-python3
      - make requirements-test-python3
      - make validate-dags-dependencies
    when:
      event: push
      branch:
        exclude:
          - master

  validate-dags-dependencies-prod:
    group: tests
    image: python:3.7.3
    environment:
      ENVIRONMENT: prod
    commands:
      - make requirements-python3
      - make requirements-test-python3
      - make validate-dags-dependencies
    when:
      event: push
      branch: master

  validate-atlas-metadata-files:
    group: tests
    image: python:3.7.3
    commands:
      - make requirements-scripts-python3
      - make validate-atlas-metadata-files
    when:
      event: push

  make-package-python3:
    group: package
    image: python:3.7.3
    commands:
      - make package-python3
    when:
      event: [ push, tag ]
      branch: [ master, forno ]

  prepare-release-python3-forno:
    group: release
    image: alpine:3.10
    commands:
      - find . -wholename "./dist/bi_etl_ejuice-*-py3-none-any.whl" -exec mv '{}' ./dist/bi_etl_ejuice-forno-py3-none-any.whl \;
    when:
      event: push
      branch: forno

  prepare-release-python3-prod:
    group: release
    image: alpine:3.10
    commands:
      - find . -wholename "./dist/bi_etl_ejuice-*-py3-none-any.whl" -exec cp '{}' ./dist/bi_etl_ejuice-latest-py3-none-any.whl \;
    when:
      event: [ push, tag ]
      branch: master

  export-releases-to-s3-prod:
    group: export
    image: plugins/s3
    pull: true
    bucket: 5a-artifacts
    source: dist/*.whl
    target: bi-etl-ejuice/
    strip_prefix: dist/
    acl: bucket-owner-full-control
    cache_control: no-cache
    when:
      event: [ push, tag ]
      branch: master

  export-releases-to-s3-new-prod-account:
    group: export
    image: plugins/s3
    pull: true
    bucket: artifacts.s3.data.quintoandar.com.br
    source: dist/*.whl
    target: bi-etl-ejuice/
    strip_prefix: dist/
    acl: bucket-owner-full-control
    cache_control: no-cache
    when:
      event: [ push, tag ]
      branch: master

  export-releases-to-s3-forno:
    group: export
    image: plugins/s3
    pull: true
    bucket: artifacts.s3.forno.data.quintoandar.com.br
    source: dist/*.whl
    target: bi-etl-ejuice/
    strip_prefix: dist/
    acl: bucket-owner-full-control
    cache_control: no-cache
    when:
      event: [ push, tag ]
      branch: forno

  load-dags-composer-forno:
    group: update_jobs
    image: quintoandar/drone-gcs-sync
    pull: true
    bucket: us-east4-airflow-forno-90eedca3-bucket
    source: bietlejuice/jobs/composer/
    target: dags/bietlejuice/jobs/composer/
    delete: true
    dry_run: false
    secrets:
      - source: google_cloud_composer_credentials
        target: google_application_credentials
    when:
      event: push
      branch: [ forno ]

  load-dags-composer-prod:
    group: update_jobs
    image: quintoandar/drone-gcs-sync
    pull: true
    bucket: us-east4-airflow-prod-6fc58ef2-bucket
    source: bietlejuice/jobs/composer/
    target: dags/bietlejuice/jobs/composer/
    delete: true
    dry_run: false
    secrets:
      - source: google_cloud_composer_credentials
        target: google_application_credentials
    when:
      event: push
      branch: [ master ]

  load-spark-jobs-s3-forno:
    group: update_jobs
    image: python:3.7.3
    commands:
      - pip install boto3==1.9.159
      - python scripts/upload_spark_jobs_to_s3.py 5a-databricks-forno
    when:
      event: push
      branch: forno

  load-spark-jobs-s3-new-forno-account:
    group: update_jobs
    image: python:3.7.3
    commands:
      - pip install boto3==1.9.159
      - python scripts/upload_spark_jobs_to_s3.py databricks.s3.forno.data.quintoandar.com.br
    when:
      event: push
      branch: forno

  load-spark-jobs-s3-prod:
    group: update_jobs
    image: python:3.7.3
    commands:
      - pip install boto3==1.9.159
      - python scripts/upload_spark_jobs_to_s3.py 5a-databricks
    when:
      event: push
      branch: master

  load-spark-jobs-s3-new-prod-account:
    group: update_jobs
    image: python:3.7.3
    commands:
      - pip install boto3==1.9.159
      - python scripts/upload_spark_jobs_to_s3.py databricks.s3.data.quintoandar.com.br
    when:
      event: push
      branch: master

  load-atlas-metadata-files-to-s3-forno:
    group: update_jobs
    image: python:3.7.3
    commands:
      - pip install boto3==1.9.159 PyYAML==5.1
      - python scripts/upload_atlas_metadata_files_to_s3.py data-documentation.s3.forno.data.quintoandar.com.br
    when:
      event: push
      branch: forno

  load-atlas-metadata-files-to-s3-prod:
    group: update_jobs
    image: python:3.7.3
    commands:
      - pip install boto3==1.9.159 PyYAML==5.1
      - python scripts/upload_atlas_metadata_files_to_s3.py data-documentation.s3.data.quintoandar.com.br
    when:
      event: push
      branch: master

#  =======================================================================
# =============================== Common ===============================
#  =======================================================================
  sonar-preview:
    group: common-sonar
    image: quintoandar/sonar-scanner
    pull: true
    commands:
      - |-
        sonar-scanner \
          -Dsonar.projectName=Bietlejuice \
          -Dsonar.projectKey=${DRONE_REPO_NAME} \
          -Dsonar.projectBaseDir=. \
          -Dsonar.sources=./bietlejuice \
          -Dsonar.sourceEncoding=UTF-8 \
          -Dsonar.analysis.mode=preview \
          -Dsonar.github.pullRequest=${DRONE_PULL_REQUEST} \
          -Dsonar.github.repository=${DRONE_REPO_OWNER}/${DRONE_REPO_NAME} \
          -Dsonar.github.oauth=$${GITHUB_ACCESS_TOKEN} \
          -Dsonar.host.url=https://sonar.quintoandar.com.br \
          -Dsonar.login=user \
          -Dsonar.password=$${SONAR_PASSWORD}
    secrets: [ sonar_password, github_access_token ]
    when:
      event: pull_request
      branch: [ master ]

  sonar-report:
    group: common-sonar
    image: quintoandar/sonar-scanner
    pull: true
    commands:
      - |-
        sonar-scanner \
          -Dsonar.projectName=Bietlejuice \
          -Dsonar.projectKey=${DRONE_REPO_NAME} \
          -Dsonar.projectBaseDir=. \
          -Dsonar.sources=./bietlejuice \
          -Dsonar.python.coverage.reportPath=coverage.xml \
          -Dsonar.sourceEncoding=UTF-8 \
          -Dsonar.tests=./tests \
          -Dsonar.host.url=https://sonar.quintoandar.com.br \
          -Dsonar.projectKey=${DRONE_REPO_NAME} \
          -Dsonar.login=user \
          -Dsonar.password=$${SONAR_PASSWORD}
    secrets: [ sonar_password, github_access_token ]
    when:
      event: push
      branch: [ master ]
