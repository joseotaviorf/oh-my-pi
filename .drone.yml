clone:
  clone:
    image: plugins/git
    depth: 20

pipeline:

  progressive-lint:
    image: python:2.7.12
    commands:
      - pip install -q flake8==3.5.0
      - export FILES_CHANGED=$(git diff --name-only master | grep '.py$' || true)
      - flake8 --max-line-length=120 $FILES_CHANGED

  unit-test:
    image: python:2.7.12
    commands:
      - export AIRFLOW_GPL_UNIDECODE=yes
      - export AWS_DEFAULT_REGION=us-east-1
      - pip install -q -r requirements.txt
      - pip install -q -r requirements_test.txt
      - pytest --cov=bietlejuice/jobs/etl --cov-report html:htmlcov --cov-fail-under=10 --cov-config .coveragerc tests
      - coverage-badge -o badge-lines.svg
  
  publish-coverage:
    image: plugins/s3
    pull: true
    acl: public-read
    bucket: 5a-coverage
    source: badge-lines.svg
    target: /bi-etl-ejuice
    content_type: image/svg+xml
    cache_control: no-cache
    when:
      event: push
      branch: [ master ]
    
  install-forno:
    image: drillster/drone-rsync
    hosts: [ ssh.airflow.forno.quintoandar.com.br ]
    user: airflow
    source: .
    target: ~/bi
    include: [ 'requirements.txt', 'variables.json' ]
    exclude: [ '*' ]
    args: '-vI'
    script:
      - cd /var/www/airflow/
      - AIRFLOW_GPL_UNIDECODE=yes airflow_venv/bin/pip install -I -Ur ~/bi/requirements.txt
      - airflow_venv/bin/airflow variables -i ~/bi/variables.json
      - sudo find /var/www/airflow/dags/bietlejuice -name \*.pyc -delete
      - sudo find /var/www/airflow/plugins -name \*.pyc -delete      
    secrets: [ rsync_key ]
    when:
      event: push
      branch: [ forno ]

  install-production:
    image: drillster/drone-rsync
    hosts: [ ssh.airflow.quintoandar.com.br ]
    user: airflow
    source: .
    target: ~/bi
    include: [ 'requirements.txt', 'variables.json' ]
    exclude: [ '*' ]
    args: '-vI'
    script:
      - cd /var/www/airflow/
      - AIRFLOW_GPL_UNIDECODE=yes airflow_venv/bin/pip install -I -Ur ~/bi/requirements.txt
      - airflow_venv/bin/airflow variables -i ~/bi/variables.json
      - sudo find /var/www/airflow/dags/bietlejuice -name \*.pyc -delete
      - sudo find /var/www/airflow/plugins -name \*.pyc -delete      
    secrets: [ rsync_key ]
    when:
      event: push
      branch: [ master ]

  load-dags-forno:
    image: drillster/drone-rsync
    hosts: [ ssh.airflow.forno.quintoandar.com.br ]
    user: airflow
    source: "bietlejuice/*"
    target: /var/www/airflow/dags/bietlejuice
    args: '--force -vI'
    delete: true
    secrets: [ rsync_key ]
    when:
      event: push
      branch: [ forno ]

  load-dags-production:
    image: drillster/drone-rsync
    hosts: [ ssh.airflow.quintoandar.com.br ]
    user: airflow
    source: "bietlejuice/*"
    target: /var/www/airflow/dags/bietlejuice
    args: '--force -vI'
    delete: true
    secrets: [ rsync_key ]
    when:
      event: push
      branch: [ master ]

  load-plugins-forno:
    group: deploy
    image: drillster/drone-rsync
    hosts: [ ssh.airflow.forno.quintoandar.com.br ]
    user: airflow
    source: plugins/*
    target: /var/www/airflow/plugins
    args: '--force -vI'
    delete: true
    secrets: [ rsync_key ]
    when:
      event: push
      branch: [ forno ]

  load-plugins-prod:
    group: deploy
    image: drillster/drone-rsync
    hosts: [ ssh.airflow.quintoandar.com.br ]
    user: airflow
    source: plugins/*
    target: /var/www/airflow/plugins
    args: '--force -vI'
    delete: true
    secrets: [ rsync_key ]
    when:
      event: push
      branch: [ master ]

  sonar-preview:
    image: newtmitch/sonar-scanner
    commands:
      - |-
        sonar-scanner \
          -Dsonar.projectName=Bietlejuice \
          -Dsonar.projectKey=${DRONE_REPO_NAME} \
          -Dsonar.projectBaseDir=. \
          -Dsonar.sources=./bietlejuice \
          -Dsonar.sourceEncoding=UTF-8 \
          -Dsonar.analysis.mode=preview \
          -Dsonar.github.pullRequest=${DRONE_PULL_REQUEST} \
          -Dsonar.github.repository=${DRONE_REPO_OWNER}/${DRONE_REPO_NAME} \
          -Dsonar.github.oauth=$${GITHUB_ACCESS_TOKEN} \
          -Dsonar.host.url=https://sonar.quintoandar.com.br \
          -Dsonar.login=user \
          -Dsonar.password=$${SONAR_PASSWORD}
    secrets: [ sonar_password, github_access_token ]
    when:
      event: pull_request
      branch: [ master ]
  
  sonar-report:
    image: newtmitch/sonar-scanner
    commands:
      - |-
        sonar-scanner \
          -Dsonar.projectName=Bietlejuice \
          -Dsonar.projectKey=${DRONE_REPO_NAME} \
          -Dsonar.projectBaseDir=. \
          -Dsonar.sources=./bietlejuice \
          -Dsonar.python.coverage.reportPath=coverage.xml \
          -Dsonar.sourceEncoding=UTF-8 \
          -Dsonar.tests=./tests \
          -Dsonar.host.url=https://sonar.quintoandar.com.br \
          -Dsonar.projectKey=${DRONE_REPO_NAME} \
          -Dsonar.login=user \
          -Dsonar.password=$${SONAR_PASSWORD}
    secrets: [ sonar_password, github_access_token ]
    when:
      event: push
      branch: [ master ]
  
  notify:
    image: plugins/slack
    webhook: https://hooks.slack.com/services/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
    channel: dataops
    when:
      branch: [ forno, master ]
      status: [ success, failure ]
