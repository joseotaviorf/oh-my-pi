clone:
  git-clone:
    image: plugins/git

pipeline:
  check-style-python2:
    group: tests
    image: python:2.7.12
    commands:
      - make requirements-lint-python2
      - make check-style-python2
    when:
      event: push

  check-style-python3:
    group: tests
    image: python:3.6.7
    commands:
      - make requirements-lint-python3
      - make check-style-python3
    when:
      event: push

  unit-tests-python2:
    group: tests
    image: python:2.7.12
    commands:
      - export AIRFLOW_GPL_UNIDECODE=yes
      - export AWS_DEFAULT_REGION=us-east-1
      - make requirements-python2
      - make unit-tests-python2
      - make cov-badge
    when:
      event: push

  unit-tests-python3:
    group: tests
    image: quintoandar/pyspark:0.1
    pull: true
    commands:
      - export AIRFLOW_GPL_UNIDECODE=yes
      - export AWS_DEFAULT_REGION=us-east-1
      - make requirements-python3
      - make unit-tests-python3
    when:
      event: push

  publish-coverage:
    image: plugins/s3
    pull: true
    acl: public-read
    bucket: 5a-coverage
    source: badge-lines.svg
    target: /bi-etl-ejuice
    content_type: image/svg+xml
    cache_control: no-cache
    when:
      event: push
      branch: [ master ]

  make-package-python3:
    image: python:3.6.7
    commands:
      - make package-python3
    when:
      event: [ push, tag ]
      branch: [ master, forno ]

  prepare-release-python3-forno:
    image: alpine:3.10
    commands:
      - find . -wholename "./dist/bi_etl_ejuice-*-py3-none-any.whl" -exec mv '{}' ./dist/bi_etl_ejuice-forno-py3-none-any.whl \;
    when:
      event: push
      branch: forno

  prepare-release-python3-prod:
    image: alpine:3.10
    commands:
      - find . -wholename "./dist/bi_etl_ejuice-*-py3-none-any.whl" -exec cp '{}' ./dist/bi_etl_ejuice-latest-py3-none-any.whl \;
    when:
      event: [ push, tag ]
      branch: master

  export-releases-to-s3:
    image: plugins/s3
    pull: true
    bucket: 5a-artifacts
    source: dist/*.whl
    target: bi-etl-ejuice/
    strip_prefix: dist/
    acl: private
    cache_control: no-cache
    when:
      event: [ push, tag ]
      branch: [ master, forno ]

  export-github-credentials-ec2:
    image: python:2.7.12
    commands:
      - echo $${GITHUB_ACCESS_TOKEN} > githubcredentials.txt
    secrets:
      - source: github_access_token
        target: github_access_token
    when:
      event: push
      branch: [ forno, master ]

  install-dependencies-ec2-forno:
    image: drillster/drone-rsync
    hosts: [ ssh.airflow.forno.quintoandar.com.br ]
    user: airflow
    source: .
    target: ~/bi
    include: [ 'requirements.txt', 'variables.json', 'githubcredentials.txt'  ]
    exclude: [ '*' ]
    args: '-vI'
    script:
      - git config --global credential.helper store
      - export GH_TOKEN=$(cat ~/bi/githubcredentials.txt)
      - echo "https://$GH_TOKEN:$GH_TOKEN@github.com" > ~/.git-credentials
      - cd /var/www/airflow/
      - AIRFLOW_GPL_UNIDECODE=yes airflow_venv/bin/pip install -I -Ur ~/bi/requirements.txt --extra-index-url https://quintoandar.github.io/python-package-server/
      - airflow_venv/bin/airflow variables -i ~/bi/variables.json
      - sudo find /var/www/airflow/dags/bietlejuice -name \*.pyc -delete
      - sudo find /var/www/airflow/plugins -name \*.pyc -delete
      - rm ~/bi/githubcredentials.txt
    secrets:
      - source: rsync_key
        target: rsync_key
    when:
      event: push
      branch: [ forno ]

  install-dependencies-ec2-prod:
    image: drillster/drone-rsync
    hosts: [ ssh.airflow.quintoandar.com.br ]
    user: airflow
    source: .
    target: ~/bi
    include: [ 'requirements.txt', 'variables.json', 'githubcredentials.txt'   ]
    exclude: [ '*' ]
    args: '-vI'
    script:
      - git config --global credential.helper store
      - export GH_TOKEN=$(cat ~/bi/githubcredentials.txt)
      - echo "https://$GH_TOKEN:$GH_TOKEN@github.com" > ~/.git-credentials
      - cd /var/www/airflow/
      - AIRFLOW_GPL_UNIDECODE=yes airflow_venv/bin/pip install -I -Ur ~/bi/requirements.txt --extra-index-url https://quintoandar.github.io/python-package-server/
      - airflow_venv/bin/airflow variables -i ~/bi/variables.json
      - sudo find /var/www/airflow/dags/bietlejuice -name \*.pyc -delete
      - sudo find /var/www/airflow/plugins -name \*.pyc -delete
      - rm ~/bi/githubcredentials.txt
    secrets: [ rsync_key ]
    when:
      event: push
      branch: [ master ]

  load-jobs-ec2-forno:
    group: updated_jobs
    image: drillster/drone-rsync
    hosts: [ ssh.airflow.forno.quintoandar.com.br ]
    user: airflow
    source: "bietlejuice/*"
    exclude: "jobs/composer/*"
    target: /var/www/airflow/dags/bietlejuice
    args: '--force -vI'
    delete: true
    secrets: [ rsync_key ]
    when:
      event: push
      branch: [ forno ]

  load-jobs-ec2-prod:
    group: updated_jobs
    image: drillster/drone-rsync
    hosts: [ ssh.airflow.quintoandar.com.br ]
    user: airflow
    source: "bietlejuice/*"
    exclude: "jobs/composer/*"
    target: /var/www/airflow/dags/bietlejuice
    args: '--force -vI'
    delete: true
    secrets: [ rsync_key ]
    when:
      event: push
      branch: [ master ]

  load-plugins-ec2-forno:
    group: updated_jobs
    image: drillster/drone-rsync
    hosts: [ ssh.airflow.forno.quintoandar.com.br ]
    user: airflow
    source: plugins/*
    target: /var/www/airflow/plugins
    args: '--force -vI'
    delete: true
    secrets: [ rsync_key ]
    when:
      event: push
      branch: [ forno ]

  load-plugins-ec2-prod:
    group: updated_jobs
    image: drillster/drone-rsync
    hosts: [ ssh.airflow.quintoandar.com.br ]
    user: airflow
    source: plugins/*
    target: /var/www/airflow/plugins
    args: '--force -vI'
    delete: true
    secrets: [ rsync_key ]
    when:
      event: push
      branch: [ master ]

  load-dags-composer-forno:
    group: updated_jobs
    image: quintoandar/drone-gcs-sync
    pull: true
    bucket: us-east4-airflow-forno-90eedca3-bucket
    source: bietlejuice/jobs/composer/
    target: dags/bietlejuice/jobs/composer/
    delete: true
    dry_run: false
    secrets:
      - source: google_cloud_composer_credentials
        target: google_application_credentials
    when:
      event: push
      branch: [ forno ]

  load-dags-composer-prod:
    group: updated_jobs
    image: quintoandar/drone-gcs-sync
    pull: true
    bucket: us-east4-airflow-prod-6fc58ef2-bucket
    source: bietlejuice/jobs/composer/
    target: dags/bietlejuice/jobs/composer/
    delete: true
    dry_run: false
    secrets:
      - source: google_cloud_composer_credentials
        target: google_application_credentials
    when:
      event: push
      branch: [ master ]

  load-spark-jobs-s3-forno:
    group: updated_jobs
    image: python:3.6.7
    commands:
      - pip install boto3==1.9.159
      - python scripts/upload_spark_jobs_to_s3.py 5a-databricks-forno
    when:
      event: push
      branch: forno

  load-spark-jobs-s3-prod:
    group: updated_jobs
    image: python:3.6.7
    commands:
      - pip install boto3==1.9.159
      - python scripts/upload_spark_jobs_to_s3.py 5a-databricks
    when:
      event: push
      branch: master

  sonar-preview:
    image: quintoandar/sonar-scanner
    pull: true
    commands:
      - |-
        sonar-scanner \
          -Dsonar.projectName=Bietlejuice \
          -Dsonar.projectKey=${DRONE_REPO_NAME} \
          -Dsonar.projectBaseDir=. \
          -Dsonar.sources=./bietlejuice \
          -Dsonar.sourceEncoding=UTF-8 \
          -Dsonar.analysis.mode=preview \
          -Dsonar.github.pullRequest=${DRONE_PULL_REQUEST} \
          -Dsonar.github.repository=${DRONE_REPO_OWNER}/${DRONE_REPO_NAME} \
          -Dsonar.github.oauth=$${GITHUB_ACCESS_TOKEN} \
          -Dsonar.host.url=https://sonar.quintoandar.com.br \
          -Dsonar.login=user \
          -Dsonar.password=$${SONAR_PASSWORD}
    secrets: [ sonar_password, github_access_token ]
    when:
      event: pull_request
      branch: [ master ]

  sonar-report:
    image: quintoandar/sonar-scanner
    pull: true
    commands:
      - |-
        sonar-scanner \
          -Dsonar.projectName=Bietlejuice \
          -Dsonar.projectKey=${DRONE_REPO_NAME} \
          -Dsonar.projectBaseDir=. \
          -Dsonar.sources=./bietlejuice \
          -Dsonar.python.coverage.reportPath=coverage.xml \
          -Dsonar.sourceEncoding=UTF-8 \
          -Dsonar.tests=./tests \
          -Dsonar.host.url=https://sonar.quintoandar.com.br \
          -Dsonar.projectKey=${DRONE_REPO_NAME} \
          -Dsonar.login=user \
          -Dsonar.password=$${SONAR_PASSWORD}
    secrets: [ sonar_password, github_access_token ]
    when:
      event: push
      branch: [ master ]

  schemaspy:
    image: quintoandar/drone-schemaspy:v1.1.0
    pull: true
    commands:
      - |-
        java -jar /dependencies/schemaspy-6.1.0.jar \
            -t redshift \
            -dp /dependencies/RedshiftJDBC42-no-awssdk-1.2.36.1060.jar \
            -db dw \
            -host "quintoandar-bi.c6wy0orj1cqf.us-east-1.redshift.amazonaws.com" \
            -port "5439" \
            -schemas "public","growth","agent","asterisk","bank","call","crm","datamarts","datamarts_credit","zendesk","marketing","datamarts_strategy" \
            -u $${DB_USER} \
            -p $${DB_PASSWORD} \
            -I "(view|pg|vw)_.*" \
            -o ./output

        echo "====== Uploading documentation to S3 ======"
        aws s3 cp output/ s3://dbschema.quintoandar.com.br/dw --recursive --acl private
    secrets:
      - source: dw_db_password_prod
        target: DB_PASSWORD
      - source: dw_db_user_prod
        target: DB_USER
    when:
      branch: master
      event: push
