clone:
  git-clone:
    image: plugins/git

pipeline:
  check-style-python:
    group: tests
    image: python:3.7.3
    commands:
      - apt-get update
      - apt-get install -y git > /dev/null
      - make requirements-lint
      - make check-style
    when:
      event: push

  files-validation-python:
    group: tests
    image: python:3.7.3
    pull: true
    commands:
      - apt-get update
      - apt-get install -y git > /dev/null
      - make requirements-test
      - make files-validation
    when:
      event: push

  unit-tests-python:
    group: tests
    image: quintoandar/pyspark:0.2
    pull: true
    commands:
      - export AIRFLOW_GPL_UNIDECODE=yes
      - export AWS_DEFAULT_REGION=us-east-1
      - make requirements-test
      - make requirements
      - make unit-tests
    when:
      event: push

  validate-dags-dependencies-forno:
    group: tests
    image: python:3.7.3
    environment:
      ENVIRONMENT: forno
    commands:
      - make requirements-scripts
      - make validate-dags-dependencies
    when:
      event: push
      branch:
        exclude:
          - master
          - hotfix/*

  validate-dags-dependencies-prod:
    group: tests
    image: python:3.7.3
    environment:
      ENVIRONMENT: prod
    commands:
      - make requirements-scripts
      - make validate-dags-dependencies
    when:
      event: push
      branch: [master, hotfix/*]

  validate-atlas-metadata-files:
    group: tests
    image: python:3.7.3
    commands:
      - make requirements-scripts
      - make validate-atlas-metadata-files
    when:
      event: push
      branch:
        exclude:
          - hotfix/* # excluding this branch since the process validates master's code

  validate-metadata-files-exist:
    group: tests
    image: python:3.7.3
    commands:
      - make requirements-scripts
      - make validate-metadata-files-exist
    when:
      event: push
      branch:
        exclude:
          - forno
          - hotfix/* # excluding this branch since the process validates master's code

  validate-datamarts-metadata-files-exist:
    group: tests
    image: python:3.7.3
    commands:
      - make requirements-scripts
      - make validate-datamarts-metadata-files-exist
    when:
      event: push
      branch:
        exclude:
          - forno
          - hotfix/* # excluding this branch since the process validates master's code

  make-package-python:
    group: package
    image: python:3.7.3
    commands:
      - make package
    when:
      event: [ push, tag ]
      branch: [ master, forno, hotfix/* ]

  prepare-release-forno:
    group: release
    image: alpine:3.10
    commands:
      - find . -wholename "./dist/bi_etl_ejuice-*-py3-none-any.whl" -exec mv '{}' ./dist/bi_etl_ejuice-forno-py3-none-any.whl \;
    when:
      event: push
      branch: forno

  prepare-release-prod:
    group: release
    image: alpine:3.10
    commands:
      - find . -wholename "./dist/bi_etl_ejuice-*-py3-none-any.whl" -exec cp '{}' ./dist/bi_etl_ejuice-latest-py3-none-any.whl \;
    when:
      event: [ push, tag ]
      branch: [master, hotfix/*]

  export-releases-to-s3-prod:
    group: export
    image: plugins/s3
    pull: true
    bucket: 5a-artifacts
    source: dist/*.whl
    target: bi-etl-ejuice/
    strip_prefix: dist/
    acl: bucket-owner-full-control
    cache_control: no-cache
    when:
      event: [ push, tag ]
      branch: [master, hotfix/*]

  export-releases-to-s3-new-prod-account:
    group: export
    image: plugins/s3
    pull: true
    bucket: artifacts.s3.data.quintoandar.com.br
    source: dist/*.whl
    target: bi-etl-ejuice/
    strip_prefix: dist/
    acl: bucket-owner-full-control
    cache_control: no-cache
    when:
      event: [ push, tag ]
      branch: [master, hotfix/*]

  export-releases-to-s3-forno:
    group: export
    image: plugins/s3
    pull: true
    bucket: artifacts.s3.forno.data.quintoandar.com.br
    source: dist/*.whl
    target: bi-etl-ejuice/
    strip_prefix: dist/
    acl: bucket-owner-full-control
    cache_control: no-cache
    when:
      event: [ push, tag ]
      branch: forno

  load-dags-composer-forno:
    group: update_jobs
    image: quintoandar/drone-gcs-sync
    pull: true
    bucket: us-east4-airflow-forno2-7f52154d-bucket
    source: bietlejuice/
    target: dags/bietlejuice/
    delete: true
    dry_run: false
    secrets:
      - source: google_cloud_composer_credentials
        target: google_application_credentials
    when:
      event: push
      branch: [ forno ]

  load-dags-composer-prod:
    group: update_jobs
    image: quintoandar/drone-gcs-sync
    pull: true
    bucket: us-east4-airflow-prod2-fdaf9748-bucket
    source: bietlejuice/
    target: dags/bietlejuice/
    delete: true
    dry_run: false
    secrets:
      - source: google_cloud_composer_credentials
        target: google_application_credentials
    when:
      event: push
      branch: [master, hotfix/*]

  load-spark-jobs-s3-forno:
    group: update_jobs
    image: python:3.7.3
    commands:
      - pip install boto3==1.9.159
      - python scripts/upload_spark_jobs_to_s3.py 5a-databricks-forno
    when:
      event: push
      branch: forno

  load-spark-jobs-s3-new-forno-account:
    group: update_jobs
    image: python:3.7.3
    commands:
      - pip install boto3==1.9.159
      - python scripts/upload_spark_jobs_to_s3.py databricks.s3.forno.data.quintoandar.com.br
    when:
      event: push
      branch: forno

  load-spark-jobs-s3-prod:
    group: update_jobs
    image: python:3.7.3
    commands:
      - pip install boto3==1.9.159
      - python scripts/upload_spark_jobs_to_s3.py 5a-databricks
    when:
      event: push
      branch: [master, hotfix/*]

  load-spark-jobs-s3-new-prod-account:
    group: update_jobs
    image: python:3.7.3
    commands:
      - pip install boto3==1.9.159
      - python scripts/upload_spark_jobs_to_s3.py databricks.s3.data.quintoandar.com.br
    when:
      event: push
      branch: [master, hotfix/*]

  load-atlas-metadata-files-to-s3-forno:
    group: update_jobs
    image: python:3.7.3
    commands:
      - pip install boto3==1.9.159 PyYAML==5.1
      - python scripts/upload_atlas_metadata_files_to_s3.py data-documentation.s3.forno.data.quintoandar.com.br
    when:
      event: push
      branch: forno

  load-atlas-metadata-files-to-s3-prod:
    group: update_jobs
    image: python:3.7.3
    commands:
      - pip install boto3==1.9.159 PyYAML==5.1
      - python scripts/upload_atlas_metadata_files_to_s3.py data-documentation.s3.data.quintoandar.com.br
    when:
      event: push
      branch: [master, hotfix/*]

  sonar-preview:
    group: common-sonar
    image: quintoandar/sonar-scanner
    pull: true
    commands:
      - |-
        sonar-scanner \
          -Dsonar.projectName=Bietlejuice \
          -Dsonar.projectKey=${DRONE_REPO_NAME} \
          -Dsonar.projectBaseDir=. \
          -Dsonar.sources=./bietlejuice \
          -Dsonar.sourceEncoding=UTF-8 \
          -Dsonar.pullrequest.base=${DRONE_REPO_BRANCH} \
          -Dsonar.pullrequest.branch=${DRONE_BRANCH} \
          -Dsonar.pullrequest.key=${DRONE_PULL_REQUEST} \
          -Dsonar.host.url=https://sonarqube.quintoandar.com.br \
          -Dsonar.login=$${SONARQUBE_TOKEN} \
    secrets: [ sonarqube_token ]
    when:
      event: pull_request
      branch: [ master, hotfix/* ]

  sonar-report:
    group: common-sonar
    image: quintoandar/sonar-scanner
    pull: true
    commands:
      - |-
        sonar-scanner \
          -Dsonar.projectName=Bietlejuice \
          -Dsonar.projectKey=${DRONE_REPO_NAME} \
          -Dsonar.projectBaseDir=. \
          -Dsonar.sources=./bietlejuice \
          -Dsonar.python.coverage.reportPath=coverage.xml \
          -Dsonar.sourceEncoding=UTF-8 \
          -Dsonar.tests=./tests \
          -Dsonar.host.url=https://sonarqube.quintoandar.com.br \
          -Dsonar.login=$${SONARQUBE_TOKEN} \
          -Dsonar.projectKey=${DRONE_REPO_NAME} \
    secrets: [ sonarqube_token ]
    when:
      event: push
      branch: [ master, hotfix/* ]
