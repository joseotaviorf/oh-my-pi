clone:
  git-clone:
    image: plugins/git

pipeline:
  check-style-python:
    group: tests
    image: python:3.7.16
    commands:
      - apt-get update
      - apt-get install -y git > /dev/null
      - make requirements-lint
      - make check-style
    when:
      event: push

  files-validation-python:
    group: tests
    image: python:3.7.16
    pull: true
    commands:
      - apt-get update
      - apt-get install -y git > /dev/null
      - make requirements-test
      - make files-validation
    when:
      event: push

  unit-tests-python:
    group: tests
    image: quintoandar/pyspark:0.2
    pull: true
    commands:
      - export AIRFLOW_GPL_UNIDECODE=yes
      - export AWS_DEFAULT_REGION=us-east-1
      - make requirements-test
      - make requirements
      - make unit-tests
      - make cov-badge
    when:
      event: push

  integration-tests-python:
    group: tests
    image: quintoandar/pyspark:0.2
    pull: true
    commands:
      - export AIRFLOW_GPL_UNIDECODE=yes
      - export AWS_DEFAULT_REGION=us-east-1
      - make requirements-test
      - make requirements
      - make integration-tests
    when:
      event: push

  validate-dag-declaration-files:
    group: tests
    image: python:3.7.16
    commands:
      - pip install tqdm==4.64.1 Cerberus==1.3.4
      - make requirements-scripts
      - make validate-dag-declaration-files level=debug
    when:
      event: push

  validate-dags-dependencies-forno:
    group: tests
    image: python:3.7.16
    environment:
      ENVIRONMENT: forno
    commands:
      - make requirements-scripts
      - make validate-dags-dependencies
    when:
      event: push
      branch:
        exclude:
          - master
          - hotfix/*

  validate-dags-dependencies-prod:
    group: tests
    image: python:3.7.16
    environment:
      ENVIRONMENT: prod
    commands:
      - make requirements-scripts
      - make validate-dags-dependencies
    when:
      event: push
      branch: [master, hotfix/*]

  validate-dependency-file-correctness:
    group: tests
    image: python:3.7.16
    commands:
      - make requirements
      - make requirements-scripts
      - make validate-dependency-file-correctness
    when:
      event: push
  
  validate-metadata-files-content:
    group: tests
    image: python:3.7.16
    commands:
      - make requirements-scripts
      - make validate-metadata-files-content
    when:
      event: push
      branch:
        exclude: [forno, hotfix/*]

  validate-metadata-files-exist:
    group: tests
    image: python:3.7.3
    commands:
      - make requirements-scripts
      - make validate-metadata-files-exist
    when:
      event: push
      branch:
        exclude: [forno, hotfix/*]

  make-package-python:
    group: package
    image: python:3.7.16
    commands:
      - make package
    when:
      event: [push, tag]
      branch: [master, forno, hotfix/*]

  prepare-release-forno:
    group: release
    image: alpine:3.10
    commands:
      - find . -wholename "./dist/bi_etl_ejuice-*-py3-none-any.whl" -exec mv '{}' ./dist/bi_etl_ejuice-latest-py3-none-any.whl \;
    when:
      event: push
      branch: forno

  prepare-release-prod:
    group: release
    image: alpine:3.10
    commands:
      - find . -wholename "./dist/bi_etl_ejuice-*-py3-none-any.whl" -exec cp '{}' ./dist/bi_etl_ejuice-latest-py3-none-any.whl \;
    when:
      event: [push, tag]
      branch: [master, hotfix/*]

  export-releases-to-s3-prod:
    group: export
    image: plugins/s3
    pull: true
    bucket: artifacts.s3.data.quintoandar.com.br
    source: dist/*.whl
    target: bi-etl-ejuice/
    strip_prefix: dist/
    acl: bucket-owner-full-control
    cache_control: no-cache
    when:
      event: [push, tag]
      branch: [master, hotfix/*]

  export-releases-to-s3-forno:
    group: export
    image: plugins/s3
    pull: true
    bucket: artifacts.s3.forno.data.quintoandar.com.br
    source: dist/*.whl
    target: bi-etl-ejuice/
    strip_prefix: dist/
    acl: bucket-owner-full-control
    cache_control: no-cache
    when:
      event: [push, tag]
      branch: forno

  export-init-script-to-s3-forno:
    group: export
    image: plugins/s3
    pull: true
    bucket: artifacts.s3.forno.data.quintoandar.com.br
    source: scripts/init_script.sh
    target: bi-etl-ejuice/
    strip_prefix: scripts/
    acl: bucket-owner-full-control
    cache_control: no-cache
    when:
      event: [push, tag]
      branch: forno

  export-init-script-to-s3-prod:
    group: export
    image: plugins/s3
    pull: true
    bucket: artifacts.s3.data.quintoandar.com.br
    source: scripts/init_script.sh
    target: bi-etl-ejuice/
    strip_prefix: scripts/
    acl: bucket-owner-full-control
    cache_control: no-cache
    when:
      event: [push, tag]
      branch: [master, hotfix/*]

  export-coverage:
    group: export
    image: plugins/s3
    pull: true
    bucket: 5a-coverage
    source: coverage_badge.svg
    target: ${DRONE_REPO_NAME}/
    acl: public-read
    cache_control: no-cache
    when:
      event: [push]
      branch: [master]

  create-dag-files:
    group: export
    image: python:3.7.16
    commands:
      - make create-dag-files
    when:
      event: push
      branch: [forno, master, hotfix/*]

  upload-bi-etl-ejuice-modules-gcs-forno:
    group: upload
    image: quintoandar/drone-gcs-sync
    pull: true
    bucket: us-east4-airflow-forno2-7f52154d-bucket
    source: bietlejuice/
    target: dags/bietlejuice/
    delete: true
    dry_run: false
    secrets:
      - source: google_cloud_composer_credentials
        target: google_application_credentials
    when:
      event: push
      branch: [forno]

  upload-bi-etl-ejuice-modules-gcs-prod:
    group: upload
    image: quintoandar/drone-gcs-sync
    pull: true
    bucket: us-east4-airflow-prod2-fdaf9748-bucket
    source: bietlejuice/
    target: dags/bietlejuice/
    delete: true
    dry_run: false
    secrets:
      - source: google_cloud_composer_credentials
        target: google_application_credentials
    when:
      event: push
      branch: [master, hotfix/*]

  upload-dag-packages-dags-gcs-forno:
    group: upload
    image: quintoandar/drone-gcs-sync
    pull: true
    bucket: us-east4-airflow-forno2-7f52154d-bucket
    source: dags/
    target: dags/dags/
    delete: true
    dry_run: false
    secrets:
      - source: google_cloud_composer_credentials
        target: google_application_credentials
    when:
      event: push
      branch: [forno]

  upload-dag-packages-dags-gcs-prod:
    group: upload
    image: quintoandar/drone-gcs-sync
    pull: true
    bucket: us-east4-airflow-prod2-fdaf9748-bucket
    source: dags/
    target: dags/dags/
    delete: true
    dry_run: false
    secrets:
      - source: google_cloud_composer_credentials
        target: google_application_credentials
    when:
      event: push
      branch: [master, hotfix/*]

  upload-dag-packages-spark-jobs-s3-forno:
    group: upload
    image: python:3.7.16
    commands:
      - pip install boto3==1.24.0 tqdm==4.64.1
      - python scripts/ci_cd/upload_dag_packages_artifact_into_s3.py databricks.s3.forno.data.quintoandar.com.br spark_jobs
    when:
      event: push
      branch: forno

  upload-dag-packages-spark-jobs-s3-prod:
    group: upload
    image: python:3.7.16
    commands:
      - pip install boto3==1.24.0 tqdm==4.64.1
      - python scripts/ci_cd/upload_dag_packages_artifact_into_s3.py 5a-databricks spark_jobs
    when:
      event: push
      branch: [master, hotfix/*]

  upload-dag-packages-queries-s3-forno:
    group: upload
    image: python:3.7.16
    commands:
      - pip install boto3==1.24.0 tqdm==4.64.1
      - python scripts/ci_cd/upload_dag_packages_artifact_into_s3.py databricks.s3.forno.data.quintoandar.com.br queries
    when:
      event: push
      branch: forno

  upload-dag-packages-queries-s3-prod:
    group: upload
    image: python:3.7.16
    commands:
      - pip install boto3==1.24.0 tqdm==4.64.1
      - python scripts/ci_cd/upload_dag_packages_artifact_into_s3.py 5a-databricks queries
    when:
      event: push
      branch: [master, hotfix/*]

  upload-dag-packages-data-quality-s3-forno:
    group: upload
    image: python:3.7.16
    commands:
      - pip install boto3==1.24.0 tqdm==4.64.1
      - python scripts/ci_cd/upload_dag_packages_artifact_into_s3.py databricks.s3.forno.data.quintoandar.com.br data_quality
    when:
      event: push
      branch: forno

  upload-dag-packages-data-quality-s3-prod:
    group: upload
    image: python:3.7.3
    commands:
      - pip install boto3==1.24.0 tqdm==4.64.1
      - python scripts/ci_cd/upload_dag_packages_artifact_into_s3.py 5a-databricks data_quality
    when:
      event: push
      branch: [master, hotfix/*]

  load-metadata-files-to-s3-forno:
    group: upload
    image: python:3.7.3
    commands:
      - pip install requests==2.28.1 PyYAML==5.1 boto3==1.24.0
      - make requirements-scripts
      - PYTHONPATH=. python scripts/ci_cd/upload_metadata_files_into_s3.py --branch ${DRONE_BRANCH} --bucket "data-documentation.s3.forno.data.quintoandar.com.br" --host "https://metadata-propagator.forno.data.quintoandar.com.br/"
    when:
      event: push
      branch: forno

  load-metadata-files-to-s3-prod:
    group: upload
    image: python:3.7.3
    commands:
      - pip install requests==2.28.1 PyYAML==5.1 boto3==1.24.0
      - make requirements-scripts
      - PYTHONPATH=. python scripts/ci_cd/upload_metadata_files_into_s3.py --branch ${DRONE_BRANCH} --bucket "data-documentation.s3.data.quintoandar.com.br" --host "https://metadata-propagator.data.quintoandar.com.br/"
    when:
      event: push
      branch: [master, hotfix/*]

  load-all-metadata-files-information-to-s3-forno:
    group: upload
    image: python:3.7.3
    environment:
      ENVIRONMENT: forno
    commands:
      - pip install boto3==1.24.0 PyYAML==5.1 hierarchical-conf==1.0.3
      - make requirements-scripts
      - PYTHONPATH=. python scripts/ci_cd/upload_all_metadata_files_informations_into_s3.py databricks.s3.forno.data.quintoandar.com.br
    when:
      event: push
      branch: forno

  load-all-metadata-files-information-to-s3-prod:
    group: upload
    image: python:3.7.3
    environment:
      ENVIRONMENT: prod
    commands:
      - pip install boto3==1.24.0 PyYAML==5.1 hierarchical-conf==1.0.3
      - make requirements-scripts
      - PYTHONPATH=. python scripts/ci_cd/upload_all_metadata_files_informations_into_s3.py 5a-databricks
    when:
      event: push
      branch: [master, hotfix/*]

  sonar-preview:
    group: common-sonar
    image: quintoandar/sonar-scanner
    pull: true
    commands:
      - |-
        sonar-scanner \
          -Dsonar.projectName=Bietlejuice \
          -Dsonar.projectKey=${DRONE_REPO_NAME} \
          -Dsonar.projectBaseDir=. \
          -Dsonar.sources=./bietlejuice \
          -Dsonar.sourceEncoding=UTF-8 \
          -Dsonar.pullrequest.base=${DRONE_REPO_BRANCH} \
          -Dsonar.pullrequest.branch=${DRONE_BRANCH} \
          -Dsonar.pullrequest.key=${DRONE_PULL_REQUEST} \
          -Dsonar.host.url=https://sonarqube.quintoandar.com.br \
          -Dsonar.login=$${SONARQUBE_TOKEN} \
    secrets: [sonarqube_token]
    when:
      event: pull_request
      branch: [master, hotfix/*]

  sonar-report:
    group: common-sonar
    image: quintoandar/sonar-scanner
    pull: true
    commands:
      - |-
        sonar-scanner \
          -Dsonar.projectName=Bietlejuice \
          -Dsonar.projectKey=${DRONE_REPO_NAME} \
          -Dsonar.projectBaseDir=. \
          -Dsonar.sources=./bietlejuice \
          -Dsonar.python.coverage.reportPath=coverage.xml \
          -Dsonar.sourceEncoding=UTF-8 \
          -Dsonar.tests=./tests \
          -Dsonar.host.url=https://sonarqube.quintoandar.com.br \
          -Dsonar.login=$${SONARQUBE_TOKEN} \
          -Dsonar.projectKey=${DRONE_REPO_NAME} \
          -Dsonar.ws.timeout=240
    secrets: [sonarqube_token]
    when:
      event: push
      branch: [master, hotfix/*]
