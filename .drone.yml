clone:
  clone:
    image: plugins/git
    depth: 1

pipeline:

  install:
    image: drillster/drone-rsync
    hosts: [ ssh.airflow.forno.quintoandar.com.br ]
    user: airflow
    source: .
    target: ~/bi
    include: [ 'requirements.txt', 'variables.json' ]
    exclude: [ '*' ]
    args: '-vI'
    script:
      - cd /var/www/airflow/
      - airflow_venv/bin/pip install -Ur ~/bi/requirements.txt
      - airflow_venv/bin/airflow variables -i ~/bi/variables.json
    secrets:
      - rsync_key
    when:
      branch:
        - forno

  install:
    image: drillster/drone-rsync
    hosts: [ ssh.airflow.quintoandar.com.br ]
    user: airflow
    source: .
    target: ~/bi
    include: [ 'requirements.txt', 'variables.json' ]
    exclude: [ '*' ]
    args: '-vI'
    script:
      - cd /var/www/airflow/
      - airflow_venv/bin/pip install -Ur ~/bi/requirements.txt
      - airflow_venv/bin/airflow variables -i ~/bi/variables.json
    secrets:
      - rsync_key
    when:
      branch:
        - master

  load-dags:
    image: drillster/drone-rsync
    hosts: [ ssh.airflow.forno.quintoandar.com.br ]
    user: airflow
    source: jobs
    target: /var/www/airflow/dags/
    delete: true
    args: '--force -vI'
    secrets:
      - rsync_key
    when:
      branch:
        - forno
  
  load-dags:
    image: drillster/drone-rsync
    hosts: [ ssh.airflow.quintoandar.com.br ]
    user: airflow
    source: jobs
    target: /var/www/airflow/dags/
    delete: true
    args: '--force -vI'
    secrets:
      - rsync_key
    when:
      branch:
        - master
  
  ecr:
    group: ecr
    image: plugins/ecr:1.0
    repo: 632540934959.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice
    debug: true
    daemon_off: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    tag:
      - '${DRONE_COMMIT_BRANCH}-${DRONE_COMMIT:0:7}'
      - '${DRONE_COMMIT_BRANCH}-latest'
    secrets:
      - ecr_access_key
      - ecr_secret_key
    when:
      branch:
        - forno
        - master

