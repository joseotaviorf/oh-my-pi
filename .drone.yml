clone:
  clone:
    image: plugins/git
    depth: 1

pipeline:

  install-forno:
    image: drillster/drone-rsync
    hosts: [ ssh.airflow.forno.quintoandar.com.br ]
    user: airflow
    source: .
    target: ~/bi
    include: [ 'requirements.txt', 'variables.json' ]
    exclude: [ '*' ]
    args: '-vI'
    script:
      - cd /var/www/airflow/
      - airflow_venv/bin/pip install -Ur ~/bi/requirements.txt
      - airflow_venv/bin/airflow variables -i ~/bi/variables.json
      - find /var/www/airflow/dags -name \*.pyc -delete
    secrets: [ rsync_key ]
    when:
      branch: [ forno ]

  install-production:
    image: drillster/drone-rsync
    hosts: [ ssh.airflow.quintoandar.com.br ]
    user: airflow
    source: .
    target: ~/bi
    include: [ 'requirements.txt', 'variables.json' ]
    exclude: [ '*' ]
    args: '-vI'
    script:
      - cd /var/www/airflow/
      - airflow_venv/bin/pip install -Ur ~/bi/requirements.txt
      - airflow_venv/bin/airflow variables -i ~/bi/variables.json
      - find /var/www/airflow/dags -name \*.pyc -delete
    secrets: [ rsync_key ]
    when:
      branch: [ master ]

  load-dags-forno:
    image: drillster/drone-rsync
    hosts: [ ssh.airflow.forno.quintoandar.com.br ]
    user: airflow
    source: "db jobs"
    target: /var/www/airflow/dags/
    args: '--force -vI'
    secrets: [ rsync_key ]
    when:
      branch: [ forno ]

  load-dags-production:
    image: drillster/drone-rsync
    hosts: [ ssh.airflow.quintoandar.com.br ]
    user: airflow
    source: "db jobs"
    target: /var/www/airflow/dags/
    args: '--force -vI'
    secrets: [ rsync_key ]
    when:
      branch: [ master ]

  publish:
    image: quintoandar/drone-ecr
    pull: true
    repo: 632540934959.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice
    tag: [ '${DRONE_BRANCH}-${DRONE_COMMIT:0:7}', '${DRONE_BRANCH}-latest' ]
    volumes: [ '/var/run/docker.sock:/var/run/docker.sock' ]
    when:
      branch: [ master, forno ]

  notify:
    image: plugins/slack
    webhook: https://hooks.slack.com/services/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
    channel: dataops
    when:
      branch: [ forno, master ]
      status: [ success, failure ]
