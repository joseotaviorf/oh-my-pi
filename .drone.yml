pipeline:

  test:
    image: python:2.7.12
    commands:
      - pip install -Ur requirements.txt

  install:
    image: appleboy/drone-ssh
    host: ssh.airflow.forno.quintoandar.com.br
    username: airflow
    command_timeout: 300
    script:
      - cd /var/www/airflow/bi-etl-ejuice
      - git reset --hard
      - git fetch origin
      - git checkout origin/${DRONE_COMMIT_BRANCH}
      - /var/www/airflow/airflow_venv/bin/pip install -Ur requirements.txt
    secrets:
      - ssh_key
    when:
      branch:
        - forno
        - master
  
  test-dags:
    image: appleboy/drone-ssh
    host: ssh.airflow.forno.quintoandar.com.br
    username: airflow
    script:
      - sleep 3
      - cd /var/www/airflow
      - source /etc/airflow.conf
      - airflow_venv/bin/airflow test bi-analytics-data-validation validate_schemas 2017-01-01
    secrets:
      - ssh_key
    when:
      branch:
        - forno
        - master

  ecr:
    group: ecr
    image: plugins/ecr:1.0
    repo: 632540934959.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice
    debug: true
    daemon_off: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    tag:
      - '${DRONE_COMMIT_BRANCH}-${DRONE_COMMIT:0:7}'
      - '${DRONE_COMMIT_BRANCH}-latest'
    secrets:
      - ecr_access_key
      - ecr_secret_key
    when:
      branch:
        - forno
        - master

