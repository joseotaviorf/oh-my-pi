clone:
  git-clone:
    image: plugins/git
    depth: 20

pipeline:

  progressive-lint:
    image: python:2.7.12
    commands:
      - pip install -q flake8==3.5.0
      - export FILES_CHANGED=$(git diff --name-only master | grep '.py$' || true)
      - flake8 --max-line-length=120 $FILES_CHANGED
    when:
      event: push

  unit-test:
    image: python:2.7.12
    commands:
      - export AIRFLOW_GPL_UNIDECODE=yes
      - export AWS_DEFAULT_REGION=us-east-1
      - pip install -r requirements.txt
      - pip install -r requirements_test.txt
      - pytest --cov=bietlejuice/jobs/etl --cov-report html:htmlcov --cov-fail-under=25 --cov-config .coveragerc tests
      - coverage-badge -o badge-lines.svg
    when:
      event: push

  upload-to-gs:
    image: plugins/gcs
    source: "bietlejuice/*"
    target: us-east4-airflow-forno-d10a26d5-bucket/dags/drone-test/
    ignore: ["**/__pycache__/**", "**/jobs/old_etl/**", "**/jobs/dags/**"]
    acl: allUsers:READER
    cache_control: public,max-age=3600
    secrets:
      - source: google_cloud_composer_credentials
        target: google_application_credentials
    debug: true
    when:
      event: push
