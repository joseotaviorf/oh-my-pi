clone:
  clone:
    image: plugins/git
    depth: 20

pipeline:

  flake8-web:
    image: python:2.7.12
    commands:
      - pip install -q flake8==3.5.0
      - flake8 .

  install-forno:
    image: drillster/drone-rsync
    hosts: [ ssh.airflow.forno.quintoandar.com.br ]
    user: airflow
    source: .
    target: ~/bi
    include: [ 'requirements.txt', 'variables.json' ]
    exclude: [ '*' ]
    args: '-vI'
    script:
      - cd /var/www/airflow/
      - AIRFLOW_GPL_UNIDECODE=yes airflow_venv/bin/pip install -I --force-reinstall -r ~/bi/requirements.txt
      - airflow_venv/bin/airflow variables -i ~/bi/variables.json
      - mkdir -p /var/www/airflow/dags/bietlejuice && sudo find /var/www/airflow/dags/bietlejuice -name \*.pyc -delete
      - sudo find /var/www/airflow/plugins -name \*.pyc -delete      
    secrets: [ rsync_key ]
    when:
      branch: [ forno ]

  install-production:
    image: drillster/drone-rsync
    hosts: [ ssh.airflow.quintoandar.com.br ]
    user: airflow
    source: .
    target: ~/bi
    include: [ 'requirements.txt', 'variables.json' ]
    exclude: [ '*' ]
    args: '-vI'
    script:
      - cd /var/www/airflow/
      - AIRFLOW_GPL_UNIDECODE=yes airflow_venv/bin/pip install -I -Ur ~/bi/requirements.txt
      - airflow_venv/bin/airflow variables -i ~/bi/variables.json
      - sudo find /var/www/airflow/dags/bietlejuice -name \*.pyc -delete
      - sudo find /var/www/airflow/plugins -name \*.pyc -delete      
    secrets: [ rsync_key ]
    when:
      branch: [ master ]

  load-dags-forno:
    image: drillster/drone-rsync
    hosts: [ ssh.airflow.forno.quintoandar.com.br ]
    user: airflow
    source: "bietlejuice/*"
    target: /var/www/airflow/dags/bietlejuice
    args: '--force -vI'
    delete: true
    secrets: [ rsync_key ]
    when:
      branch: [ forno ]

  load-dags-production:
    image: drillster/drone-rsync
    hosts: [ ssh.airflow.quintoandar.com.br ]
    user: airflow
    source: "bietlejuice/*"
    target: /var/www/airflow/dags/bietlejuice
    args: '--force -vI'
    delete: true
    secrets: [ rsync_key ]
    when:
      branch: [ master ]

  load-plugins-forno:
    group: deploy
    image: drillster/drone-rsync
    hosts: [ ssh.airflow.forno.quintoandar.com.br ]
    user: airflow
    source: plugins/*
    target: /var/www/airflow/plugins
    args: '--force -vI'
    delete: true
    secrets: [ rsync_key ]
    when:
      branch: [ forno ]

  load-plugins-prod:
    group: deploy
    image: drillster/drone-rsync
    hosts: [ ssh.airflow.forno.quintoandar.com.br ]
    user: airflow
    source: plugins/*
    target: /var/www/airflow/plugins
    args: '--force -vI'
    delete: true
    secrets: [ rsync_key ]
    when:
      branch: [ master ]

  publish:
    image: plugins/ecr
    pull: true
    repo: 632540934959.dkr.ecr.us-east-1.amazonaws.com/quintoandar/bi-etl-ejuice
    tag: [ '${DRONE_BRANCH}-${DRONE_COMMIT:0:7}', '${DRONE_BRANCH}-latest' ]
    when:
      branch: [ master, forno ]

  notify:
    image: plugins/slack
    webhook: https://hooks.slack.com/services/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
    channel: dataops
    when:
      branch: [ forno, master ]
      status: [ success, failure ]
