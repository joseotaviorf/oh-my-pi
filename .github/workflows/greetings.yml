name: Greetings

on: [pull_request, issues]

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: 'Hey! Thanks for your first reported issue! As always, we''re committed to do our best'
        pr-message: 'Wow! Congrats for the first, of many, pull requests in bi-etl-juice repo!'
