# Notify a Google Chat channel when a PR touches Luigi Jr DAGs (dags/luigijr/**).
#
# Setup (one-time):
#   1. In the target GChat space: Apps & integrations → Incoming Webhooks → create webhook.
#   2. In GitHub repo settings → Secrets and variables → Actions:
#        GCHAT_LUIGIJR_PR_WEBHOOK = <webhook URL>
#
# The webhook URL is never committed to the repo.

name: Luigi Jr PR GChat Alert

on:
  pull_request:
    types: [opened, reopened]
    branches:
      - master
    paths:
      - "dags/luigijr/**"

jobs:
  notify-gchat:
    runs-on: github-actions-developers-runner
    permissions:
      pull-requests: read
      contents: read
    steps:
      - name: Post alert to Google Chat
        env:
          WEBHOOK_URL: ${{ secrets.GCHAT_LUIGIJR_PR_WEBHOOK }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail

          if [ -z "${WEBHOOK_URL}" ]; then
            echo "Secret GCHAT_LUIGIJR_PR_WEBHOOK is not configured."
            exit 1
          fi

          if [ "${EVENT_ACTION}" = "reopened" ]; then
            event_title="PR reaberto — Luigi Jr"
          else
            event_title="Novo PR — Luigi Jr"
          fi

          payload=$(
            EVENT_TITLE="${event_title}" \
            PR_NUMBER="${PR_NUMBER}" \
            PR_TITLE="${PR_TITLE}" \
            PR_URL="${PR_URL}" \
            PR_AUTHOR="${PR_AUTHOR}" \
            PR_BRANCH="${PR_BRANCH}" \
            PR_HEAD_SHA="${PR_HEAD_SHA}" \
            REPOSITORY="${REPOSITORY}" \
            GITHUB_TOKEN="${GITHUB_TOKEN}" \
            python3 <<'PY'
          import base64
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          GENERATED_BY_RE = re.compile(r"generated-by:([^\s#]+)")
          ZORDON_MARKERS = ("zordon",)
          DECLARATION_SUFFIX = "_declaration.yml"


          def github_get(path: str) -> object:
              request = urllib.request.Request(
                  f"https://api.github.com{path}",
                  headers={
                      "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "luigijr-pr-gchat-alert",
                  },
              )
              with urllib.request.urlopen(request) as response:
                  return json.load(response)


          def is_zordon_bot(login: str) -> bool:
              lowered = login.lower()
              return any(marker in lowered for marker in ZORDON_MARKERS)


          def format_person_id(person_id: str) -> str:
              return " ".join(part.capitalize() for part in person_id.split("."))


          def extract_generated_by(content: str) -> list[str]:
              return sorted(set(GENERATED_BY_RE.findall(content)))


          def fetch_declaration_generated_by(
              repository: str, path: str, ref: str
          ) -> list[str]:
              encoded_path = urllib.parse.quote(path, safe="")
              try:
                  payload = github_get(
                      f"/repos/{repository}/contents/{encoded_path}?ref={ref}"
                  )
              except urllib.error.HTTPError:
                  return []
              if not isinstance(payload, dict) or payload.get("encoding") != "base64":
                  return []
              content = base64.b64decode(payload["content"]).decode("utf-8")
              return extract_generated_by(content)


          repository = os.environ["REPOSITORY"]
          pr_number = os.environ["PR_NUMBER"].strip()
          pr_title = os.environ["PR_TITLE"]
          pr_url = os.environ["PR_URL"]
          pr_author = os.environ["PR_AUTHOR"]
          pr_branch = os.environ["PR_BRANCH"]
          pr_head_sha = os.environ["PR_HEAD_SHA"]
          event_title = os.environ["EVENT_TITLE"]

          pr_files = github_get(
              f"/repos/{repository}/pulls/{pr_number}/files?per_page=100"
          )
          luigijr_files = [
              item["filename"]
              for item in pr_files
              if item["filename"].startswith("dags/luigijr/")
          ]

          dag_items = sorted(
              {
                  path.split("/")[2]
                  for path in luigijr_files
                  if len(path.split("/")) > 2 and path.split("/")[2]
              }
          )
          if not dag_items:
              dag_items = ["(nenhuma pasta de DAG identificada)"]

          if len(dag_items) == 1:
              dags_text = dag_items[0]
          else:
              dags_text = "<br>".join(
                  f'• <font face="monospace">{item}</font>' for item in dag_items
              )

          generated_by_users: set[str] = set()
          for path in luigijr_files:
              if not path.endswith(DECLARATION_SUFFIX):
                  continue
              generated_by_users.update(
                  fetch_declaration_generated_by(repository, path, pr_head_sha)
              )

          summary_bits = [f"<b>PR:</b> #{pr_number}"]

          if generated_by_users:
              requesters = [
                  f"<b>{format_person_id(user)}</b> <font face=\"monospace\">({user})</font>"
                  for user in sorted(generated_by_users)
              ]
              summary_bits.append(
                  "<b>Solicitante:</b> " + "<br>".join(requesters)
              )
          elif not is_zordon_bot(pr_author):
              summary_bits.append(
                  f'<b>Solicitante:</b> <font color="#1a73e8">@{pr_author}</font>'
              )
          else:
              summary_bits.append("<b>Solicitante:</b> não identificado")

          if is_zordon_bot(pr_author):
              summary_bits.append("<b>PR aberto por:</b> Zordon (bot)")

          summary_bits.append(
              f'<b>Branch:</b> <font face="monospace">{pr_branch}</font>'
          )

          widgets = [
              {
                  "decoratedText": {
                      "topLabel": "Título",
                      "text": pr_title,
                      "wrapText": True,
                  }
              },
              {
                  "textParagraph": {
                      "text": "<br>".join(summary_bits),
                  }
              },
              {
                  "decoratedText": {
                      "topLabel": "DAGs afetadas",
                      "text": dags_text,
                      "wrapText": True,
                  }
              },
              {
                  "buttonList": {
                      "buttons": [
                          {
                              "text": "Abrir no GitHub",
                              "onClick": {
                                  "openLink": {"url": pr_url},
                              },
                          }
                      ]
                  }
              },
          ]

          payload = {
              "cardsV2": [
                  {
                      "cardId": "luigijr-pr-alert",
                      "card": {
                          "header": {
                              "title": event_title,
                              "subtitle": "bi-etl-ejuice · dags/luigijr",
                              "imageUrl": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
                              "imageType": "CIRCLE",
                          },
                          "sections": [{"widgets": widgets}],
                      },
                  }
              ]
          }

          print(json.dumps(payload, ensure_ascii=False))
          PY
          )

          curl -fsSL -X POST \
            -H "Content-Type: application/json; charset=UTF-8" \
            -d "${payload}" \
            "${WEBHOOK_URL}"
