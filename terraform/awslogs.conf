[general]
state_file = /var/lib/awslogs/agent-state

[gunicorn]
datetime_format = [%Y-%m-%d %H:%M:%S %z]
file = /var/log/airflow/gunicorn.log
buffer_duration = 30000
log_stream_name = {instance_id}/gunicorn
initial_position = start_of_file
log_group_name = LOG_GROUP_NAME
multi_line_start_pattern = {datetime_format}

[webserver]
datetime_format = [%Y-%m-%d %H:%M:%S,%f]
file = /var/log/airflow/webserver.log
buffer_duration = 30000
log_stream_name = {instance_id}/webserver
initial_position = start_of_file
log_group_name = LOG_GROUP_NAME
multi_line_start_pattern = {datetime_format}

[scheduler]
datetime_format = [%Y-%m-%d %H:%M:%S,%f]
file = /var/log/airflow/scheduler.log
buffer_duration = 30000
log_stream_name = {instance_id}/scheduler
initial_position = start_of_file
log_group_name = LOG_GROUP_NAME
multi_line_start_pattern = {datetime_format}
