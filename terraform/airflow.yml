- hosts: all
  
  vars:
    required_vars:
      - server_name
      - log_group
      - s3_bucket
      - s3_key
      - s3_secret
      - google_client_id
      - google_client_secret
      - db_username
      - db_password
      - db_name
      - db_hostname
      - git_branch
      - git_private_key_file
      - sentry_dsn
      - environment

  tasks:
    - name: check required variables
      fail: msg="Variable '{{ item }}' is not defined"
      when: item not in vars
      with_items: "{{required_vars}}"

    - name: check for local git private key file
      local_action: stat path={{ git_private_key_file }}
      register: stat_result

    - fail:
        msg: "Whoops! File {{ git_private_key_file }} does not exist!"
      when: stat_result.stat.exists == False

    - name: upgrade all packages, excluding kernel
      become: true
      yum:
        name: '*'
        state: latest
        exclude: kernel*
        update_cache: yes

    - name: install airflow required packages
      become: true
      yum: name={{item}} state=latest
      with_items:
        - gcc
        - git
        - glibc-devel
        - make
        - mysql-devel

    - name: install python 2.7.12
      become: true
      yum:
        name: python27-2.7.12-2.121.amzn1.x86_64
        state: present

    - name: install virtualenv
      become: true
      pip:
        name: virtualenv
        version: 15.1.0
        state: present

    - name: create airflow directory
      become: true
      file: 
        path: /var/www/airflow
        state: directory
        owner: airflow 
        group: airflow

    - name: create airflow service logs directory
      become: true
      file: 
        path: /var/log/airflow
        state: directory
        owner: airflow 
        group: airflow

    - name: install airflow
      pip:
        name: "{{ item.name }}"
        version: "{{ item.version }}"
        state: "{{ item.state | default('present') }}"
        virtualenv: "/var/www/airflow/airflow_venv"
      with_items:
        - name: 'airflow[mysql,crypto,s3,slack]'
          version: '1.8.0'
        - name: 'flask-oauthlib'
          version: '0.9.4'
        - name: 'google-auth'
          version: '1.2.1'

    - name: config airflow environment
      become: true
      lineinfile:
        dest: /etc/airflow.conf
        line: "export {{ item.key }}={{ item.val }}"
        create: true
        owner: airflow 
        group: airflow
      with_items:
        - { key: "AIRFLOW_HOME", val: "/var/www/airflow/" }
        - { key: "AIRFLOW_CONFIG", val: "/var/www/airflow/airflow.cfg" }
        - { key: "AIRFLOW__CORE__DAGS_FOLDER", val: "/var/www/airflow/bi-etl-ejuice/jobs/dags" }
        - { key: "AIRFLOW__CORE__SQL_ALCHEMY_CONN", val: "mysql://{{ db_username }}:{{ db_password }}@{{ db_hostname }}/{{ db_name }}" }
        - { key: "AIRFLOW__CORE__EXECUTOR", val: "LocalExecutor" }
        - { key: "AIRFLOW__CORE__REMOTE_BASE_LOG_FOLDER", val: "s3://{{ s3_bucket }}/logs" }
        - { key: "AIRFLOW__CORE__LOAD_EXAMPLES", val: "False" }
        - { key: "AIRFLOW__CORE__REMOTE_LOG_CONN_ID", val: "s3" }
        - { key: "AIRFLOW__CORE__LOG_LEVEL", val: "INFO" }
        - { key: "AIRFLOW__CONN__S3", val: '"{"aws_access_key_id": "{{ s3_key }}", "aws_secret_access_key": "{{ s3_secret }}"}"' }
        - { key: "AIRFLOW__WEBSERVER__ACCESS_LOGFILE", val: "/var/log/airflow/gunicorn.log" }
        - { key: "AIRFLOW__WEBSERVER__AUTHENTICATE", val: "True" }
        - { key: "AIRFLOW__WEBSERVER__ERROR_LOGFILE", val: "/var/log/airflow/gunicorn.log" }
        - { key: "AIRFLOW__WEBSERVER__AUTH_BACKEND", val: "airflow.contrib.auth.backends.google_auth" }
        - { key: "AIRFLOW__WEBSERVER__BASE_URL", val: "https://{{ server_name }}" }
        - { key: "AIRFLOW__GOOGLE__CLIENT_ID", val: "{{ google_client_id }}" }
        - { key: "AIRFLOW__GOOGLE__CLIENT_SECRET", val: "{{ google_client_secret }}" }
        - { key: "AIRFLOW__GOOGLE__OAUTH_CALLBACK_ROUTE", val: "/oauth2callback" }
        - { key: "AIRFLOW__GOOGLE__DOMAIN", val: "quintoandar.com.br" }
        - { key: "AWS_ACCESS_KEY_ID", val: "{{ s3_key }}" }  # required by default quintoandar logger
        - { key: "AWS_SECRET_ACCESS_KEY", val: "{{ s3_secret }}" }  # required by default quintoandar logger
        - { key: "AWS_DEFAULT_REGION", val: "us-east-1" }  # required by default quintoandar logger
        - { key: "PYTHONPATH", val: "/var/www/airflow/bi-etl-ejuice" }  # required by default quintoandar logger
        - { key: "SENTRY_DSN", val: "{{ sentry_dsn }}" }  # required by default quintoandar logger
        - { key: "SENTRY_ENVIRONMENT", val: "{{ environment }}" }  # required by default quintoandar logger

    - name: initialize airflow directory
      shell: >
        AIRFLOW_HOME=/var/www/airflow/
        AIRFLOW__CORE__SQL_ALCHEMY_CONN=mysql://{{ db_username }}:{{ db_password }}@{{ db_hostname }}/{{ db_name }}
        /var/www/airflow/airflow_venv/bin/airflow
        initdb
    
    # minium required to get our analytics_validation job up
    # ideally we should have these configured elsewhere, such as in a file
    # within the bi-etl-ejuice repository
    - name: config airflow initial variables
      shell: >
        AIRFLOW_HOME=/var/www/airflow/
        AIRFLOW__CORE__SQL_ALCHEMY_CONN=mysql://{{ db_username }}:{{ db_password }}@{{ db_hostname }}/{{ db_name }}
        /var/www/airflow/airflow_venv/bin/airflow
        variables -s {{ item.key }} {{ item.val }}
      with_items:
        - { key: "AWS_ACCESS_KEY_ID", val: "{{ s3_key }}" }
        - { key: "AWS_SECRET_ACCESS_KEY", val: "{{ s3_secret }}" }
        - { key: "AWS_DEFAULT_REGION", val: "us-east-1" }
        - { key: "DOCKER_REGISTRY", val: "632540934959.dkr.ecr.us-east-1.amazonaws.com" }
        - { key: "bi-datalake-s3-bucket", val: "5a-datalake" }
        - { key: "bi-etl-ejuice-repo", val: "quintoandar/bi-etl-ejuice" }

    - name: copy airflow wrapper script
      copy:
        src: airflow_wrapper.py
        dest: /var/www/airflow/airflow_wrapper.py
        mode: 0644

    - name: copy airflow upstart files
      become: true
      copy:
        src: "init/{{ item }}"
        dest: /etc/init/
        mode: 0644
      with_items:
        - airflow-scheduler.conf
        - airflow-webserver.conf

    - name: install nginx
      become: true
      yum: 
        name: nginx

    - name: copy nginx config
      become: true
      copy:
        src: nginx.conf
        dest: /etc/nginx/conf.d/airflow.conf
        mode: 0644

    - name: set nginx config server name
      become: true
      replace:
        dest: /etc/nginx/conf.d/airflow.conf
        regexp: 'SERVER_NAME'
        replace: '{{ server_name }}'

    - name: copy nginx upstart file
      become: true
      copy:
        src: init/nginx.conf
        dest: /etc/init/
        mode: 0644

    - name: install bi-etl-juice required packages
      become: true
      yum:
        name: postgresql-devel

    - name: add git private key to server
      copy:
        src: "{{ git_private_key_file }}"
        dest: /home/airflow/.ssh/id_rsa
        mode: 0400

    - name: install bi-etl-juice
      git:
        repo: "git@github.com:quintoandar/bi-etl-ejuice.git"
        dest: /var/www/airflow/bi-etl-ejuice
        version: "{{ git_branch }}"
        key_file: /home/airflow/.ssh/id_rsa
        accept_hostkey: true

    - name: install bi-etl-juice python dependencies
      pip:
        requirements: "/var/www/airflow/bi-etl-ejuice/requirements.txt"
        virtualenv: "/var/www/airflow/airflow_venv"

    - name: install awslogs
      become: true
      yum: 
        name: awslogs

    - name: install awscli  # required for awslogs
      pip:
        name: awscli
        virtualenv: "/var/www/airflow/airflow_venv"

    - name: copy awslogs config
      become: true
      copy:
        src: awslogs.conf
        dest: /etc/awslogs/awslogs.conf
        mode: 0644

    - name: set awslogs log group environment
      become: true
      replace:
        dest: /etc/awslogs/awslogs.conf
        regexp: 'LOG_GROUP_NAME'
        replace: '{{ log_group }}'

    - name: copy awslogs upstart file
      become: true
      copy:
        src: init/awslogs.conf
        dest: /etc/init/awslogs.conf
        mode: 0644

    - name: copy airflow logrotate file
      become: true
      copy:
        src: logrotate/airflow
        dest: /etc/logdrotate.d/airflow
        mode: 0644

    - name: restart server
      become: true
      command: /sbin/shutdown -r +1
      async: 0
      poll: 0
      ignore_errors: true

