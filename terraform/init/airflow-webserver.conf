description "Airflow webserver daemon"
author "QuintoAndar"

start on runlevel [2345]
stop on runlevel [016]

respawn
respawn limit 5 30

script
    source /etc/airflow.conf  # environment variables
    . /var/www/airflow/airflow_venv/bin/activate
    python /var/www/airflow/airflow_wrapper.py webserver -p 8080 &>> /var/log/airflow/webserver.log
end script
