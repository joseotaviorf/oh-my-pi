description "Airflow scheduler daemon"
author "QuintoAndar"

start on started airflow-webserver
stop on (deconfiguring-networking or runlevel [016])

respawn
respawn limit 5 10

# required setting, 0 sets it to unlimited. Scheduler will restart after every X runs
env SCHEDULER_RUNS=5
export SCHEDULER_RUNS

script
    source /etc/airflow.conf  # environment variables
    . /var/www/airflow/airflow_venv/bin/activate
    airflow scheduler &>> /var/log/airflow/scheduler.log
end script
